 MR_BALLOONIST_CROSSING_TRIGGER_TT: "#default_text [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] does #R not#! have the #V $santos_balloon_demoralized_modifier$#! [concept_modifier]."
 