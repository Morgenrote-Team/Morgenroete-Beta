 MR_BALLOONIST_BALLOON_RIDE_BUTTON: "Balloon Ride"
 MR_BALLOONIST_BALLOON_RIDE_BUTTON_TT: "#T Balloon Ride#!\nThe balloon ride for public entertainment is the safest—but also somewhat boring—default action for the [concept_santos_balloonist]. It can enhance certain buildings with a balloon attraction and provide a small technology boost for ballooning technologies.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_BALLOON_ADVENTURE_BUTTON: "Balloon Adventure"
 MR_BALLOONIST_BALLOON_ADVENTURE_BUTTON_TT: "#T Balloon Adventure#!\nA [concept_santos_balloonist] can embark on an adventure beyond our borders. Over the course of many months, he will travel through numerous countries—and perhaps bring back a souvenir or two. There is a small chance that he might die during the journey.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_BALLOON_RECORD_BUTTON: "Balloon Record"
 MR_BALLOONIST_BALLOON_RECORD_BUTTON_TT: "#T Balloon Record#!\nA [concept_santos_balloonist] can set records for altitude, distance, and time, provided he can break these world records using his own resources. There is a moderate chance that he might die during the record attempt.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_BALLOON_CROSSING_BUTTON: "Balloon Crossing"
 MR_BALLOONIST_BALLOON_CROSSING_BUTTON_TT: "#T Balloon Crossing#!\nA [concept_santos_balloonist] can fly over geographically dangerous straits or mountain ranges. This feat is considered the ultimate challenge for any adventurer. There is a significant chance that he might die during the crossing attempt.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
