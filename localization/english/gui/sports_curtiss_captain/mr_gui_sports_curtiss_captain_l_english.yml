 curtiss_zeppelin_cabins_tt: "#T Passenger Cabins#!\nPassenger cabins are an essential part of any Zeppelin that carries civilian passengers."
 curtiss_zeppelin_station_tt: "#T Research Station#!\nA research station dedicated to the scientific and cartographic exploration of the Arctic."
 curtiss_zeppelin_climber_tt: "#T Altitude Climber#!\nIts specialization as a high-altitude aircraft makes the Zeppelin of military interest, as it can reach altitudes that are out of reach for many aircraft."
 curtiss_zeppelin_tanks_tt: "#T Additional Tanks#!\nAdditional tanks increase a zeppelin's range, but they also take up space that could be used for other upgrades."
 
 curtiss_zeppelin_deck_tt: "#T Integrated Promenade Deck#!\nAn integrated promenade deck not only enhances the passenger experience but also makes the entire ship slightly more aerodynamic by eliminating external attachments."
 curtiss_zeppelin_insulation_tt: "#T Cold Protection Insulation#!\nBasic protection against the cold is the primary requirement for undertaking an expedition to the Arctic—even though many experts say these measures are insufficient."
 curtiss_zeppelin_equipment_tt: "#T Arctic Equipment#!\nThoroughly equipping the Zeppelin to withstand the dangers of the Arctic should ensure greater success for our expedition to the far north."
 curtiss_zeppelin_bay_tt: "#T Internal Bomb Bay#!\nWho said zeppelins have to be just peaceful passenger ships? With this arsenal of bombs, no city will be safe from the terror of the skies!"

 curtiss_zeppelin_radio_tt: "#T Radio Room#!\nWireless telegraphy enables a constant connection with ground stations, which can be crucial for course corrections and in emergencies."
 curtiss_zeppelin_magnetometer_tt: "#T Magnetometer#!\nThe magnetometer enables a significant improvement in meteorological research."
 curtiss_zeppelin_basket_tt: "#T Observation Basket#!\nSpying on the enemy from high above using an observation basket should help our armies in their next attack."

 curtiss_zeppelin_airmail_tt: "#T Airmail#!\nAirmail enhances our reputation around the world and satisfies both passengers and stamp collectors."
 curtiss_zeppelin_floats_tt: "#T Water Landing Floats#!\nThis useful piece of equipment can be used for water landings in Antarctica and not only enables safe shore landings but also an emergency water landing if necessary."
 curtiss_zeppelin_cargo_tt: "#T Cargo Hold#!\nWith a huge cargo hold, we can convert our Zeppelin into a hub for the national economy."

 curtiss_zeppelin_lounge_tt: "#T Lounge#!\nA lounge with a dining room and a smoking room is among the most luxurious amenities an airship has to offer. This makes every trip an experience!"
 curtiss_zeppelin_cage_tt: "#T Polar Bear Cage#!\nWild polar bears shouldn't be a problem with this cage—and finding fossils and specimens will be easier, too."
 curtiss_zeppelin_carrier_tt: "#T Airship Carrier#!\nWith a few modifications, such as a specially mounted grappling hook, we can transport up to three aircraft inside the zeppelin and use them as mobile reconnaissance and patrol craft."

