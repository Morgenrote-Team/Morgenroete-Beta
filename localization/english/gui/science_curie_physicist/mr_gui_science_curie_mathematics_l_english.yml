 CURIE_EXPERIMENT_YOUNG_NAME: "$mr_young$"
 CURIE_EXPERIMENT_ORSTED_NAME: "$mr_orsted$"
 CURIE_EXPERIMENT_YOUNG_TT: "In [Scope.Var('year').GetValue], [Scope.Var('discoverer').GetFlagName] passed light through two narrow slits onto a screen. The resulting interference pattern of bright and dark bands proved that light behaves as a wave, successfully refuting Isaac Newton's dominant particle theory."
 CURIE_EXPERIMENT_ORSTED_TT: "In [Scope.Var('year').GetValue], [Scope.Var('discoverer').GetFlagName] aligned a current-carrying wire above a magnetic compass. The needle's deflection proved that electricity generates a magnetic field, establishing the unified field of electromagnetism."
 CURIE_EXPERIMENT_JOULES_TT: "In [Scope.Var('year').GetValue], [Scope.Var('discoverer').GetFlagName] used falling weights to spin paddle wheels in insulated water. The resulting temperature increase showed that mechanical work converts directly into heat, establishing energy conservation."
 CURIE_EXPERIMENT_DOPPLER_TT: "In [Scope.Var('year').GetValue], [Scope.Var('discoverer').GetFlagName] tested Doppler's theory using trumpet players on a moving train. The observed shift in pitch as the train passed confirmed the Doppler effect, proving that motion alters acoustic frequency."
 CURIE_EXPERIMENT_FOUCAULT_TT: "In [Scope.Var('year').GetValue], [Scope.Var('discoverer').GetFlagName] suspended a heavy pendulum from a long wire. The gradual rotation of its swinging plane relative to the floor provided direct visual proof of Earth's axial rotation without celestial observations."
 CURIE_EXPERIMENT_FIZEAU_TT: "In [Scope.Var('year').GetValue], [Scope.Var('discoverer').GetFlagName] bounced light through a rotating cogwheel to a distant mirror. Blocking the return light at known rotation speeds yielded the first terrestrial measurement of the speed of light."
 CURIE_EXPERIMENT_WEBER_TT: "In [Scope.Var('year').GetValue], [Scope.Var('discoverer').GetFlagName] measured electric charge using a Leyden jar and galvanometer. The ratio between electrostatic and electromagnetic units yielded the speed of light, proving light's electromagnetic nature."
 CURIE_EXPERIMENT_MICHELSON_TT: "In [Scope.Var('year').GetValue], [Scope.Var('discoverer').GetFlagName] split light into perpendicular paths using a sensitive interferometer. The absence of expected fringe shifts disproved the luminiferous aether, paving the way for Special Relativity."
 CURIE_EXPERIMENT_HERTZ_TT: "In [Scope.Var('year').GetValue], [Scope.Var('discoverer').GetFlagName] used spark-gap circuits to generate and detect invisible radio waves. Proving they shared light's velocity and wave properties, it confirmed Maxwell's electromagnetic theory and birthed wireless communication."
 CURIE_EXPERIMENT_THOMSON_TT: "In [Scope.Var('year').GetValue], [Scope.Var('discoverer').GetFlagName] deflected cathode rays using electric and magnetic fields in a vacuum tube. Measuring their charge-to-mass ratio revealed negative subatomic particles—electrons—disproving the idea that atoms were indivisible."
 CURIE_EXPERIMENT_MILIKAN_TT: "In [Scope.Var('year').GetValue], [Scope.Var('discoverer').GetFlagName] suspended electrically charged oil droplets between two metal plates. Balancing gravity against electric force proved charge is quantized in fixed units, accurately establishing the electron's charge."
 CURIE_EXPERIMENT_RUTHERFORD_TT: "In [Scope.Var('year').GetValue], [Scope.Var('discoverer').GetFlagName] fired alpha particles at thin gold foil. Unexpected wide-angle deflections proved that atomic mass and positive charge are concentrated in a tiny central nucleus, replacing the uniform atom model."
 CURIE_EXPERIMENT_FRANCK_TT: "In [Scope.Var('year').GetValue], [Scope.Var('discoverer').GetFlagName] passed accelerated electrons through mercury vapor. Periodic current drops at specific voltages proved atoms absorb energy in discrete quanta, confirming Bohr's model of quantized energy levels."
 CURIE_EXPERIMENT_EDDINGTON_TT: "In [Scope.Var('year').GetValue], [Scope.Var('discoverer').GetFlagName] photographed stars near the sun during a total eclipse. The observed gravitational bending of starlight provided the first empirical proof of General Relativity."
 CURIE_EXPERIMENT_STERN_TT: "In [Scope.Var('year').GetValue], [Scope.Var('discoverer').GetFlagName] directed silver atoms through an uneven magnetic field. The beam split into two distinct paths rather than a continuum, proving space quantization and discovering intrinsic quantum spin."

 curie_thomas_young_loc: "$mr_thomas$ $mr_young$"
 curie_hans_christian_orsted_loc: "$mr_hans_christian$ $mr_orsted$"

