 MATHEMATICAL_INNOVATION_VAR_TT: "#header Mathematical Innovation#!\n[GetPlayer.GetName] generated @curie_mathematical_innovation! [GetPlayer.MakeScope.GetVariable('curie_national_mathematical_innovation_var').GetValue|0+] National Mathematical Innovation and @curie_mathematical_innovation! [GetGlobalVariable('curie_international_mathematical_innovation_global_var').GetValue|V0] International Mathematical Innovation generated by #V all countries#!."
 CLOUDS_VAR: "#tooltip:[GetRawTextTooltipTag('CLOUDS_VAR_TT')] @curie_clouds!  [GetPlayer.MakeScope.GetVariable('curie_discovered_clouds_country_number_var').GetValue|V0] / [GetGlobalVariable('curie_discovered_clouds_global_number_var').GetValue|V0] #!"
 CLOUDS_VAR_TT: "#header Clouds#!\n[GetPlayer.GetName] described @curie_clouds! [GetPlayer.MakeScope.GetVariable('curie_discovered_clouds_country_number_var').GetValue|V0] of @curie_clouds! [GetGlobalVariable('curie_discovered_clouds_global_number_var').GetValue|V0] [Concept('concept_curie_meteorology','$concept_curie_clouds$')]."

