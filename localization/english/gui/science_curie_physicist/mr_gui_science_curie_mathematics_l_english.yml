 CURIE_FORMULA_COMPLEX_ANALYSIS_NAME: "$curie_complex$ $curie_analysis$"
 CURIE_FORMULA_COMPLEX_ANALYSIS_TT: "A branch of mathematics that studies functions operating on complex numbers, which combine real and imaginary numbers. It is widely used in physics and engineering to analyze wave patterns, fluid dynamics, and electrical circuits."
 CURIE_FORMULA_DIFFERENTIAL_EQUATIONS_NAME: "$curie_differential$ $curie_equation$"
 CURIE_FORMULA_DIFFERENTIAL_EQUATIONS_TT: "Equations that relate functions to their rates of change. They describe how physical quantities evolve over time or space, making them essential for modeling planetary motion, population growth, climate systems, and heat transfer."
 CURIE_FORMULA_FOURIER_ANALYSIS_NAME: "$mr_fourier$-$curie_analysis$"
 CURIE_FORMULA_FOURIER_ANALYSIS_TT: "A technique that breaks complex signals, waves, or functions down into simple sine and cosine components. It is fundamental to modern signal processing, image compression, audio streaming, and telecommunications."
 CURIE_FORMULA_NON_EUCLIDIAN_GEOMETRY_NAME: "Non-Euclidean $curie_geometry$"
 CURIE_FORMULA_NON_EUCLIDIAN_GEOMETRY_TT: "Geometries based on surfaces that are not flat, where parallel lines can intersect or diverge. Spherical geometry models the curved surface of planets, while hyperbolic geometry helps explain spacetime in general relativity."
 CURIE_FORMULA_GROUP_THEORY_NAME: "Group $curie_theory$"
 CURIE_FORMULA_GROUP_THEORY_TT: "The study of algebraic structures that capture symmetry and transformations. It provides a formal language to analyze symmetries in geometric shapes, chemical molecules, subatomic particles, and cryptographic algorithms."

 CURIE_FORMULA_LINEAR_ALGEBRA_NAME: "Linear Algebra"
 CURIE_FORMULA_LINEAR_ALGEBRA_TT: "The branch of mathematics studying vector spaces, vectors, and matrices. It provides the core mathematical foundation for 3D computer graphics, machine learning algorithms, quantum mechanics, and large-scale data analysis."
 CURIE_FORMULA_ABSTRACT_ALGEBRA_NAME: "Abstract Algebra"
 CURIE_FORMULA_ABSTRACT_ALGEBRA_TT: "The study of algebraic structures such as groups, rings, and fields, rather than specific numbers. It examines underlying rules and symmetries, forming the basis for modern cryptography, coding theory, and theoretical physics."
 CURIE_FORMULA_NS_EQUATIONS_NAME: "Navier-Stokes Equations"
 CURIE_FORMULA_NS_EQUATIONS_TT: "A set of partial differential equations describing how fluids move. They model viscous fluid behavior and are essential for weather forecasting, ocean current predictions, aerodynamics, and pipeline simulation."
 CURIE_FORMULA_MATHEMATICAL_LOGIC_NAME: "Mathematical Logic"
 CURIE_FORMULA_MATHEMATICAL_LOGIC_TT: "The study of formal logic applied to mathematics. It analyzes proof systems, truth, and computation limits, serving as the theoretical foundation for software design and artificial intelligence."
 CURIE_FORMULA_ANALYTICAL_NUMBER_THEORY_NAME: "Analytical Number Theory"
 CURIE_FORMULA_ANALYTICAL_NUMBER_THEORY_TT: "A branch using tools from continuous calculus and complex analysis to solve problems about integers. It focuses primarily on prime number distribution, modular forms, and additive number patterns."

 CURIE_FORMULA_ALGEBRAIC_NUMBER_THEORY_NAME: "Algebraic Number Theory"
 CURIE_FORMULA_ALGEBRAIC_NUMBER_THEORY_TT: "A branch that applies abstract algebra to study integers and algebraic numbers. It solves factorization problems in number fields and underpins modern public-key cryptography, including elliptic curve encryption systems."
 CURIE_FORMULA_EM_FIELD_EQUATIONS_NAME: "EM Field Equations"
 CURIE_FORMULA_EM_FIELD_EQUATIONS_TT: "A set of partial differential equations, known as Maxwell's equations, that describe how electric and magnetic fields interact with matter. They explain electromagnetic waves, light, electric circuits, and wireless communication."
 CURIE_FORMULA_SET_THEORY_NAME: "Set Theory"
 CURIE_FORMULA_SET_THEORY_TT: "The foundational branch of mathematics studying collections of objects, known as sets. It establishes basic concepts like infinity, relations, and functions, forming the structural basis for almost all modern mathematical logic."
 CURIE_FORMULA_TOPOLOGY_NAME: "Topology"
 CURIE_FORMULA_TOPOLOGY_TT: "The study of spatial properties that remain unchanged under continuous deformations like stretching or bending, without tearing. It is applied in network analysis, data analysis  and material physics."
 CURIE_FORMULA_FUNCTIONAL_ANALYSIS_NAME: "Functional Analysis"
 CURIE_FORMULA_FUNCTIONAL_ANALYSIS_TT: "A branch studying infinite-dimensional vector spaces and transformations between them. It extends linear algebra to calculus, providing the mathematical framework for quantum mechanics and differential equations."

 CURIE_FORMULA_LIE_THEORY_NAME: "Lie Theory"
 CURIE_FORMULA_LIE_THEORY_TT: "The study of continuous symmetries and geometric transformations. It links calculus with abstract algebra to describe continuous motion, making it vital for quantum mechanics and general relativity."
 CURIE_FORMULA_REPRESENTATION_THEORY_NAME: "Representation Theory"
 CURIE_FORMULA_REPRESENTATION_THEORY_TT: "A branch that translates abstract algebraic structures into concrete operations on linear vector spaces. It allows complex algebraic symmetries to be studied via matrices, simplifying problems in particle physics and chemistry."
 CURIE_FORMULA_ALGEBRAIC_TOPOLOGY_NAME: "Algebraic Topology"
 CURIE_FORMULA_ALGEBRAIC_TOPOLOGY_TT: "A field using tools from abstract algebra to study topological spaces and continuous shapes. It converts geometric shape features into algebraic invariants, aiding data analysis."
 CURIE_FORMULA_CLASS_FIELD_THEORY_NAME: "Class Field Theory"
 CURIE_FORMULA_CLASS_FIELD_THEORY_TT: "A major branch of algebraic number theory describing abelian extensions of number fields. It links arithmetic properties to reciprocity laws, forming the basis for advanced number theory and modern arithmetic geometry."
 CURIE_FORMULA_RELATIVITY_THEORY_NAME: "Relativity Theory"
 CURIE_FORMULA_RELATIVITY_THEORY_TT: "A fundamental physics framework describing gravitation, space, and time. It shows that time and space are intertwined as spacetime and that massive objects warp this fabric, underpinning astrophysics and satellite navigation."

 CURIE_FORMULA_QUANTUM_MECHANICS_NAME: "Quantum Mechanics"
 CURIE_FORMULA_QUANTUM_MECHANICS_TT: "A physical theory describing nature at atomic and subatomic scales. It replaces classical determinism with probabilities, explaining phenomena like wave-particle duality and entanglement, which power semiconductors and quantum computing."
 CURIE_FORMULA_PROOF_THEORY_NAME: "Proof Theory"
 CURIE_FORMULA_PROOF_THEORY_TT: "A branch of mathematical logic treating mathematical proofs as formal mathematical objects. It analyzes proof structure, consistency, and provability limits."
 CURIE_FORMULA_CRYPTOGRAPHY_NAME: "Cryptography"
 CURIE_FORMULA_CRYPTOGRAPHY_TT: "The science of securing communications against unauthorized access through mathematical codes and ciphers."
 CURIE_FORMULA_ALGORITHM_THEORY_NAME: "Algorithm Theory"
 CURIE_FORMULA_ALGORITHM_THEORY_TT: "The mathematical study of systematic, step-by-step procedures for solving computational problems. Formulated around pencil-and-paper calculation, it analyzes mechanical rules to determine which problems can be solved in a finite sequence of steps."
 CURIE_FORMULA_LAMBDA_CALCULUS_NAME: "Lambda Calculus"
 CURIE_FORMULA_LAMBDA_CALCULUS_TT: "A formal logical system introduced in the 1930s to investigate mathematical functions, variable bindings, and substitution. It was created to study the foundational limits of decidability and formal reasoning in pure logic and mathematics."

