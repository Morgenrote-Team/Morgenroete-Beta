 MR_CIRRUS_DESCRIPTION_LOC: "#lore Cirrus clouds consist of delicate, fibrous, white wisps, streaks, or feather-like formations that often look like brushstrokes against the blue sky. They are made entirely of ice crystals.#!"
 MR_CIRRUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_montgolfier_balloon_researched_type')] [GetTechnology('curtiss_montgolfier_balloon_tech').GetName]"
 MR_CIRRUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ None"
 MR_CIRRUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ None"
 MR_CIRRUS_CLOUD: "Cirrus appears in the most varied forms, such as isolated tufts (PI. 35), lines drawn across a blue sky (PI. 33), branching feather-like plumes, curved lines ending in tufts; they are often arranged in bands which cross the sky like meridian lines, and which, owing to the effect of perspective, converge to a point on the horizon, or to two opposite points (cirrostratus and cirrocumulus often take part in the formation of these bands).\n\nCirrus clouds are always composed of ice crystals, and their transparent character is due to the state of division of the crystals.\nAs a rule these clouds cross the sun's disc without dimming its light. But when they are exceptionally thick they may veil its light and obliterate its contour. This would also be the case with patches of altostratus, but cirrus is distinguished by its dazzling whiteness and silky edges.\n\n#Italic From the International Cloud Atlas, 1930#!"

 MR_CIRROCUMULUS_DESCRIPTION_LOC: "#lore Cirrocumulus clouds are fine, fluffy clusters of ice crystals at high altitudes that form a delicate pattern. They indicate high-altitude winds and increasing instability in the upper troposphere.#!"
 MR_CIRROCUMULUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_montgolfier_balloon_researched_type')] [GetTechnology('curtiss_montgolfier_balloon_tech').GetName]"
 MR_CIRROCUMULUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetPlayer.GetCustom('curie_extreme_winds_condition_type')] [GetHarvestConditionType('extreme_winds').GetName]"
 MR_CIRROCUMULUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ #G -10%#! $state_harvest_condition_extreme_winds_impact_mult$"
 MR_CIRROCUMULUS_CLOUD: "In general cirrocumulus represents a degraded state of cirrus and cirrostratus both of which may change into it (PI. 41). In this case the changing patches often retain some fibrous structure in places.\n\nReal cirrocumulus is uncommon. It must not be confused with small altocumulus patches on the edges of altocumulus sheets (PL 41). There are in fact all states of transition between cirrocumulus and altocumulus proper; this is only to be expected as the process of formation is the same. In the absence of any other criterion the term cirrocumulus should only be used when:\n\n1) There is evident connection with cirrus or cirrostratus (PI. 41).\n2) The cloud observed, results from a change in cirrus or cirrostratus (PI. 41)\n3) The cloud observed, shows some of the characteristics of ice crystal clouds which will be found enumerated under cirrus (p. 3).\n\n#Italic From the International Cloud Atlas, 1930#!"

 MR_CIRROSTRATUS_DESCRIPTION_LOC: "#lore A fine, milky-translucent veil that covers the sky. Its most distinctive feature is halos (rings or arcs of light around the sun or moon), which are caused by the refraction of light by ice crystals.#!"
 MR_CIRROSTRATUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_montgolfier_balloon_researched_type')] [GetTechnology('curtiss_montgolfier_balloon_tech').GetName]"
 MR_CIRROSTRATUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetPlayer.GetCustom('curie_moderate_rainfall_condition_type')] [GetHarvestConditionType('moderate_rainfall').GetName]"
 MR_CIRROSTRATUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ #G 10%#! $state_harvest_condition_moderate_rainfall_impact_mult$"
 MR_CIRROSTRATUS_CLOUD: "A sheet of cirrostratus which is very extensive, though in places it may be interrupted by rifts, nearly always ends by covering the whole sky. The border of the sheet may be straight edged and clear-cut (PI. 40) but more often it is ragged or cut up (PI. 37).\n\nDuring the day, when the sun is sufficiently high above the horizon, the sheet is never thick enough to mask the shadows of objects on the ground.\nA milky veil of fog is distinguished from a veil of cirrostratus of a similar appearance by the halo phenomena which the sun or the moon nearly always produce in a layer of cirrostratus.\n\nWhat has been said above of the transparent character and colours of cirrus is true to a great extent of cirrostratus\n\n#Italic From the International Cloud Atlas, 1930#!"

 MR_ALTOCUMULUS_DESCRIPTION_LOC: "#lore Mid-level cloud fields or layers consisting of small balls, clumps, or roll-shaped elements. They often signal an impending change in the weather.#!"
 MR_ALTOCUMULUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_reconnaissance_balloon_researched_type')] [GetTechnology('curtiss_reconnaissance_balloon_tech').GetName]"
 MR_ALTOCUMULUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetPlayer.GetCustom('curie_torrential_rains_condition_type')] [GetHarvestConditionType('torrential_rains').GetName]"
 MR_ALTOCUMULUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ #G -10%#! $state_harvest_condition_torrential_rains_impact_mult$"
 MR_ALTOCUMULUS_CLOUD: "The limits within which altocumulus is met with are very wide. At the greatest heights, altocumulus, made up of small elements (PI. 21), resembles cirrocumulus ; altocumulus however is distinguished by not possessing any of the following characters of cirrocumulus:\n\n1) Connection with cirrus or cirrostratus\n2)An evolution from cirrus or cirrostratus.\n3)Properties due to physical structure (ice crystals) enumerated under cirrus.\n\nAt lower levels, where altocumulus may be derived from a spreading out of the tops of cumulus clouds (PL 25), it may easily be mistaken for stratocumulus ; the convention is that the cloud is altocumulus if the smallest, well defined, and regularly arranged elements which are observed in the layer (leaving out the detached elements which are generally seen on the edges) are not greater than ten solar diameters in their smallest diameters.\n\n#Italic From the International Cloud Atlas, 1930#!"
 
 MR_ALTOSTRATUS_DESCRIPTION_LOC: "#lore Altostratus is grayish or bluish, layered or fibrous cloud cover that often spreads evenly across the sky. The sun usually shines through it only dimly.#!"
 MR_ALTOSTRATUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_reconnaissance_balloon_researched_type')] [GetTechnology('curtiss_reconnaissance_balloon_tech').GetName]"
 MR_ALTOSTRATUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetPlayer.GetCustom('curie_frost_condition_type')] [GetHarvestConditionType('frost').GetName]"
 MR_ALTOSTRATUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ #G -10%#! $state_harvest_condition_frost_impact_mult$"
 MR_ALTOSTRATUS_CLOUD: "The limits between which altostratus may be met with are fairly wide (about 5000 to 2000 metres).\nA sheet of high altostratus is distinguished from a rather similar sheet of cirrostratus by the convention that halo phenomena are not seen in altostratus, nor are the shadows of objects on the ground visible.\n\nA sheet of low altostratus may be distinguished from a somewhat similar sheet of nimbostratus by the following characters: nimbostratus is of a much darker and more uniform grey, and shows nowhere any whitish gleam or fibrous structure; one cannot definitely see the limit of its undersurface which has a 'soft' look, due to the rain, which may not reach the ground.\n\nThe convention is also made that nimbostratus always hides the sun and moon in every part of it, while altostratus only hides them in places behind its darker portions, but they reappear through the lighter parts (PL 18).\n\n#Italic From the International Cloud Atlas, 1930#!"

 MR_NIMBOSTRATUS_DESCRIPTION_LOC: "#lore A dark gray, shapeless, and thicker layer of clouds that often hangs so low that it completely blocks out the sun and its edges become blurred.#!"
 MR_NIMBOSTRATUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_early_aviation_researched_type')] [GetTechnology('curtiss_early_aviation_tech').GetName]"
 MR_NIMBOSTRATUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetPlayer.GetCustom('curie_flood_condition_type')] [GetHarvestConditionType('flood').GetName]"
 MR_NIMBOSTRATUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ #G -10%#! $state_harvest_condition_flood_impact_mult$"
 MR_NIMBOSTRATUS_CLOUD: "The usual evolution is as follows : a layer of altostratus grows thicker and lower until it becomes a layer of nimbostratus. Beneath the latter there is generally a progressive development of very low ragged clouds, isolated at first, then fusing together into an almost continuous layer, in the interstices of which however the nimbostratus can generally be seen. These very low clouds are called fractocumulus or fractostratus according as to whether they appear more or less cumuliform or stratiform.\n\nGenerally the rain only falls after the formation of these very low clouds, which are then hidden by the precipitation or may even melt away under its action. The vertical visibility then becomes very bad.\n\n#Italic From the International Cloud Atlas, 1930#!"

 MR_STRATOCUMULUS_DESCRIPTION_LOC: "#lore Gray or whitish, often coarsely mottled banks of clouds, in the form of balls or rolls, which usually cover the entire sky in solid patches but may have gaps.#!"
 MR_STRATOCUMULUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_meteorology_researched_type')] [GetTechnology('curtiss_meteorology_tech').GetName]"
 MR_STRATOCUMULUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ None"
 MR_STRATOCUMULUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ None"
 MR_STRATOCUMULUS_CLOUD: "The elements of thick stratocumulus (stratocumulus opacus) often tend to fuse together completely, and the layer can, in certain cases, change into nimbostratus. The cloud is called nimbostratus when the cloud elements of stratocumulus have completely disappeared and when, owing to the trails of falling precipitation, the lower surface has no longer a clear cut boundary.\n\nStratocumulus can change into stratus (PI. 10), and vice versa. The stratus, being lower, the elements appear very large and very soft, so that the structure of regularly arranged globular masses and waves disappears as far as the observer can see. The cloud will be called stratocumulus as long as the structure remains visible (PI. 10.\n\n#Italic From the International Cloud Atlas, 1930#!"

 MR_STRATUS_DESCRIPTION_LOC: "#lore A uniform gray, low-hanging blanket of clouds that often looks like rising fog and completely darkens the sky. Stratus clouds bring light drizzle, especially in the fall and winter.#!"
 MR_STRATUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_montgolfier_balloon_researched_type')] [GetTechnology('curtiss_montgolfier_balloon_tech').GetName]"
 MR_STRATUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ None"
 MR_STRATUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ None"
 MR_STRATUS_CLOUD: "A veil of true stratus generally gives the sky a hazy appearance which is very characteristic, but which in certain cases may cause confusion with nimbostratus. When there is precipitation the difference is manifest: nimbostratus gives continuous rain (sometimes snow), precipitation composed of drops which may be small and sparse, or else large (at least some of then) and close together, while stratus only gives a drizzle, that is to say small drops very close together.\n\nWhen there is no precipitation a dark and uniform layer of stratus can easily be mistaken for nimbostratus. The lower surface of nimbostratus however has always a soft appearance (widespread trailing precipitation, 'virga'); it is quite uniform and it is not possible to make out definite detail; stratus on the other hand has a 'dryer' appearance, and however uniform it may be it shows some contrasts and some lighter transparent parts, that is, places less dark where the cloud is thinner, corresponding to the interstices between the rolls and globular masses of stratocumulus, but considerably larger, while nimbostratus seems only to be feebly illuminated, and as though lit up from within.\n\n#Italic From the International Cloud Atlas, 1930#!"

 MR_CUMULUS_DESCRIPTION_LOC: "#lore Sharply defined, dense cumulus clouds with flat bases and dome-shaped, cauliflower-like tops that glow white against the sky. The classic harbinger of fair weather.#!"
 MR_CUMULUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_montgolfier_balloon_researched_type')] [GetTechnology('curtiss_montgolfier_balloon_tech').GetName]"
 MR_CUMULUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetPlayer.GetCustom('curie_optimal_sunlight_condition_type')] [GetHarvestConditionType('optimal_sunlight').GetName]"
 MR_CUMULUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ #G 10%#! $state_harvest_condition_optimal_sunlight_impact_mult$"
 MR_CUMULUS_CLOUD: "Typical cumulus (PI. i) develops on days of clear skies, and is due to the currents of diurnal convection; it appears in the morning, grows, and then more or less dissolves again towards the evening.\nCumulus whose base is generally of a grey colour, has a uniform structure, that is to say it is composed of rounded parts right up to its summit, with no fibrous structure (PI. 2). Even when highly developed, cumulus can only produce light precipitation.\n\nCumulus, when it reaches the altocumulus level, is sometimes capped with a light, diffuse, and white veil of more or less lenticular shape, with a delicate striated or flaky structure on its edges ; it is generally shaped like a bow which may cover several domes of the cumulus, and finally be pierced by them (PI. 2).\n\n#Italic From the International Cloud Atlas, 1930#!"

 MR_CUMULONIMBUS_DESCRIPTION_LOC: "#lore Gigantic cumulus clouds that rise to great heights (up to the tropopause), resembling towers or mountains, with their upper parts often taking on a fibrous or ice-cap-like appearance (capillatus).#!"
 MR_CUMULONIMBUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_early_aviation_researched_type')] [GetTechnology('curtiss_early_aviation_tech').GetName]"
 MR_CUMULONIMBUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetPlayer.GetCustom('curie_hailstorm_condition_type')] [GetHarvestConditionType('hailstorm').GetName]"
 MR_CUMULONIMBUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ #G -10%#! $state_harvest_condition_hailstorm_impact_mult$"
 MR_CUMULONIMBUS_CLOUD: "Even if a cumulonimbus were not distinguished by its shape from a strongly developed cumulus its essential character is evident in the difference of structure of its upper parts, when these are visible (fibrous structure and cumuliform structure). Masses of cumulus however heavy they may be, and however great their vertical development, should never be classed as cumulonimbus unless the whole or a part of their tops is transformed (PL 5) or is in process of transformation (PL 4) into a cirrus mass.\n\nAlthough the upper cirriform parts of a cumulonimbus may take on very varied shapes, yet in certain cases they spread out into the form of an anvil (PL 5). To this interesting variety the name #Italic incus#! is given.\n\n#Italic From the International Cloud Atlas, 1930#!"

 MR_NOCTILUCENT_DESCRIPTION_LOC: "#lore Delicate, fibrous veils, wavy patterns or bands in the night sky, often glowing in shades ranging from silvery-white to an electric blue. They become visible when the Sun has already set well below the horizon.#!"
 MR_NOCTILUCENT_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_high_altitude_balloon_researched_type')] [GetTechnology('curtiss_high_altitude_balloon_tech').GetName]"
 MR_NOCTILUCENT_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetGeographicRegion('curie_geographic_region_noctilucent').GetName]."
 MR_NOCTILUCENT_BONUS_LOC: "None"
 MR_NOCTILUCENT_CLOUD: "Noctilucent clouds (NLC) resemble thin cirrus clouds, but usually have a bluish or silvery, or occasionally orange to red, colour. They stand out against the dark night sky (p. 239).\n\nThe physical nature of noctilucent clouds is still unknown, but there are some indications that they consist of very fine cosmic dust.\n\nLuminous noctilucent clouds have so far been observed only rarely and then only in summer in the northern regions of the mid-latitudes of the Northern Hemisphere when the Sun is 5-13 degrees below the horizon. Measurements have shown that their altitude lies between 75 and 90 km.\n\n#Italic From the International Cloud Atlas, 1990#!"

 MR_NACREOUS_DESCRIPTION_LOC: "#lore Breathtakingly iridescent, lens-shaped or wavy clouds that glow in the most dazzling rainbow colours (particularly pink, magenta, cyan and green) just before sunrise or after sunset.#!"
 MR_NACREOUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_high_altitude_balloon_researched_type')] [GetTechnology('curtiss_high_altitude_balloon_tech').GetName]"
 MR_NACREOUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ Polar Region."
 MR_NACREOUS_BONUS_LOC: "None"
 MR_NACREOUS_CLOUD: "Nacreous clouds (Polar Stratographic Clouds, PSC) resemble cirrus or mandel-shaped altocumulus (p. 237). Like mother-of-pearl, they display very distinct iridescence. The most magnificent colours are observed when the sun is a few degrees below the horizon.\n\nThe physical nature of a mother-of-pearl cloud is still unknown. It is thought that these clouds consist of very small water droplets or spherical ice particles. \n\nThese clouds are rare. So far, they have mainly been observed in Scotland and Scandinavia. Measurements have shown that the nacreous clouds observed over southern Norway occurred at altitudes between 21 and 30 kilometres.\n\n#Italic From the International Cloud Atlas, 1990#!"

