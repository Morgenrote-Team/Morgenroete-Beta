 MR_PHYSICIST_MATHEMATICAL_INNOVATION_BUTTON: "Mathematical Innovation"
 MR_PHYSICIST_MATHEMATICAL_INNOVATION_BUTTON_TT: "#T Mathematical Innovation#!\nThis project is available when the [concept_curie_mathematical_physicist] is not occupied with another task.\n\nYour [concept_curie_physicist] helps to increase your weekly innovation capacity and reduces the penalty for technologies that are ahead of their time.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"

 MR_PHYSICIST_FORMULA_DISCOVERY_BUTTON: "New Formula"
 MR_PHYSICIST_FORMULA_DISCOVERY_BUTTON_TT: "#T New Formula#!\nMathematicians can derive new formulas, provided the right technology is available and there are still unexplored formulas. With each new formula discovered, the amount of physical data to be investigated increases.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"

 MR_PHYSICIST_IMPROVE_MATHEMATICS_BUTTON: "Improve Mathematics"
 MR_PHYSICIST_IMPROVE_MATHEMATICS_BUTTON_TT: "#T Improve Mathematics#!\nA mathematician can visit a [GetBuildingType('building_university').GetName] to disseminate new scientific standards through lectures and seminars.\n\nModifiers that the building will gain:\n$curie_building_throughput_add_modifier_with_tooltip$\n$curie_building_production_mult_modifier_with_tooltip$\n$curie_building_goods_input_mult_modifier_with_tooltip$\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"

 MR_PHYSICIST_EXPERIMENT_BUTTON: "Physics Experiment"
 MR_PHYSICIST_EXPERIMENT_BUTTON_TT: "#T Physics Experiment#!\nA physicist can conduct an experiment that, if successful, may have historic implications. This is something any type of physicist can do.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_EXPERIMENT_POSSIBLE_TRIGGER_TT: "#default_text [GetPlayer.GetName] does #R not#! have the #V $curie_physics_experiment_successful_modifier$#! or #V $curie_physics_experiment_failure_modifier$#! [concept_modifier]."

 MR_PHYSICIST_METEOROLOGICAL_OBSERVATION_BUTTON: "Meteorological Observation"
 MR_PHYSICIST_METEOROLOGICAL_OBSERVATION_BUTTON_TT: "#T Meteorological Observation#!\nThis project is available when the [concept_curie_meteorological_physicist] is not occupied with another task.\n\nYour [concept_curie_physicist] helps to increase your yearly @curie_physical_data!#! [concept_curie_physical_data].\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"

 MR_PHYSICIST_WEATHER_STATION_EXPANSION_BUTTON: "Weather Station Expansion"
 MR_PHYSICIST_WEATHER_STATION_EXPANSION_BUTTON_TT: "#T Weather Station Expansion#!\nProvided there is an observatory and the right technology, a [concept_curie_meteorological_physicist] can expand the weather station there to improve weather forecasts for the entire nation—and better manage severe weather events through timely alerts.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 PHYSICIST_HAS_NO_WEATHER_STATION_PM_TT: "#default_text [GetPlayer.GetName] has an [GetBuildingType('building_verrier_observatory').GetName] with the #V $pm_curtiss_no_weather_meteorology$#! [concept_production_method]."
 PHYSICIST_HAS_EARLY_WEATHER_STATION_PM_TT: "#default_text [GetPlayer.GetName] has an [GetBuildingType('building_verrier_observatory').GetName] with the #V $pm_curtiss_early_weather_station$#! [concept_production_method]."
 PHYSICIST_HAS_WEATHER_STATION_PM_TT: "#default_text [GetPlayer.GetName] has an [GetBuildingType('building_verrier_observatory').GetName] with the #V $pm_curtiss_weather_station$#! [concept_production_method]."

 MR_PHYSICIST_AGRICULTURAL_WEATHER_SERVICE_BUTTON: "Agricultural Weather Service"
 MR_PHYSICIST_AGRICULTURAL_WEATHER_SERVICE_BUTTON_TT: "#T Agricultural Weather Service#!\nA [concept_curie_meteorological_physicist] may limit themselves to weather forecasts for the agricultural sector and set up a weather service for farmers for three years to warn them of meteorological events. The more experienced a meteorologist is, the better the results will be.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_ADVANCED_WEATHER_STATION_TRIGGER_TT: "#default_text [GetPlayer.GetName] has an [GetBuildingType('building_verrier_observatory').GetName] with the #V $pm_curtiss_weather_station$#! or $pm_curtiss_modern_weather_station$ [concept_production_method]."
 MR_PHYSICIST_50_OR_MORE_EXPERIENCE_TRIGGER_TT: "#default_text The [concept_curie_meteorological_physicist] has #V 50 or more#! [concept_academics_experience].#!"

 MR_PHYSICIST_MARINE_WEATHER_SERVICE_BUTTON: "Shipping Forecast"
 MR_PHYSICIST_MARINE_WEATHER_SERVICE_BUTTON_TT: "#T Shipping Forecast#!\nA [concept_curie_meteorological_physicist] may limit themselves to weather forecasts for the navy to warn them of dangers at sea. This project will take three years. The more experienced a meteorologist is, the better the results will be.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_5_FLOTILLAS_TRIGGER_TT: "#default_text [GetPlayer.GetName] has #V 5 or more Ships#!.#!"

 MR_PHYSICIST_FOUND_MAGNETIC_ASSOCIATION_BUTTON: "Magnetic Association"
 MR_PHYSICIST_FOUND_MAGNETIC_ASSOCIATION_BUTTON_TT: "#T Found the Magnetic Association#!\nAn international magnetic association dedicated to researching the Earth's magnetism offers the founder, in particular, a number of advantages when it comes to collecting physical data, as well as a small technological bonus. It also unlocks the Geomagnetic Observatory as a production method.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_MAGNETIC_RESEARCH_STATION_BUTTON: "Geomagnetic Observatory"
 MR_PHYSICIST_MAGNETIC_RESEARCH_STATION_BUTTON_TT: "#T Build a Geomagnetic Observatory#!\nWe can expand our observatory to include a Geomagnetic Observatory in order to study the Earth's magnetic field in greater detail. To do this, we need to join the Magnetic Association.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_NO_MAGNETIC_OBSERVATORY_TRIGGER_TT: "#default_text [GetPlayer.GetName] has an [GetBuildingType('building_verrier_observatory').GetName] with the #V No Geomagnetic Observatory#! [concept_production_method]."
 MAGNETIC_ASSOCIATION_TRIGGER_TT: "#default_text The Magnetic Society has been established."
 MR_NO_MAGNETIC_ASSOCIATION_TRIGGER_TT: "#default_text The Magnetic Society has #R not#! yet been established."
 MR_PHYSICIST_MAGNETIC_ATLAS_BUTTON: "Geomagnetic Atlas"
 MR_PHYSICIST_MAGNETIC_ATLAS_BUTTON_TT: "#T Create a Geomagnetic Atlas#!\nUsing our extensive geomagnetic data, a physicist could compile their own geomagnetic atlas. Such a work would significantly enhance our understanding of physics.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_MAGNETIC_OBSERVATORY_TRIGGER_TT: "#default_text [GetPlayer.GetName] has an [GetBuildingType('building_verrier_observatory').GetName] with the #V Geomagnetic Observatory#! [concept_production_method]."
 MR_PHYSICIST_15_MAGNETIC_DATA_TRIGGER_TT: "#default_text [GetPlayer.GetName] has at least #V 15#! @curie_magnetic_data! #O Magnetic Data#!.#!"
 MR_PHYSICIST_FORMULA_PHYSICAL_DATA_TRIGGER_TT: "#default_text [GetPlayer.GetName] has at least #V [GetPlayer.MakeScope.ScriptValue('curie_formula_cost_value')]#! @curie_physical_data! [concept_curie_physical_data].#!"
 MR_PHYSICIST_FORMULA_POSSIBLE_TRIGGER_TT: "#default_text At least one unknown formula can be investigated using current technology.#!"
 MR_PHYSICIST_IMPROVE_MATHEMATICS_TRIGGER_TT: "#default_text At least one [GetBuildingType('building_university').GetName] Building of level 1 or higher with the #O Mathematical-Technical Focus#! does not have all three [Concept('concept_modifier','$concept_modifiers$')].#!"

