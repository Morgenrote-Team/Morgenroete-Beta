 MR_PHYSICIST_ACHIEVEMENTS_TT: "[AddLocalizationIf( Scope.IsSet , 'curie_physicist_achievements_loc')][AddLocalizationIf( Not(Scope.IsSet) , 'curie_physicist_achievements_no_physicist_loc')]"

 curie_physicist_achievements_loc: "$curie_physicist_achievements_intro_loc$[AddLocalizationIf( Scope.Var('curie_physicist_achievement_founded_magnetic_association_var').IsSet , Scope.Var('curie_physicist_achievement_founded_magnetic_association_var').GetFlagName)] [AddLocalizationIf( Scope.Var('curie_physicist_achievements_finished_geomagnetic_observatory_project_var').IsSet , Scope.Var('curie_physicist_achievements_finished_geomagnetic_observatory_project_var').GetFlagName)] [AddLocalizationIf( Scope.Var('curie_physicist_achievement_magnetic_atlas_var').IsSet , Scope.Var('curie_physicist_achievement_magnetic_atlas_var').GetFlagName)] [AddLocalizationIf( Scope.Var('curie_physicist_achievement_mathematics_improvement_finished_var').IsSet , Scope.Var('curie_physicist_achievement_mathematics_improvement_finished_var').GetFlagName)]"

 curie_physicist_achievements_intro_loc: "#V Achievements of this Physicist#!\n #indent_newline:3 • [Scope.GetCharacter.GetFullName] is a well-known physicist.#!\n #indent_newline:3 • So far [Scope.GetCharacter.GetSheHe] has derived [Scope.Var('curie_discovered_formulas_character_number_var').GetValue|V0] formulas and conducted [Scope.Var('curie_discovered_formulas_character_number_var').GetValue|V0] experiments. [AddLocalizationIf( Scope.Var('curie_physicist_achievement_historical_physics_experiment_var').IsSet , Scope.Var('curie_physicist_achievement_historical_physics_experiment_var').GetFlagName)]#!"
 curie_physicist_achievements_no_physicist_loc: "The #V Achievements of this [concept_curie_physicist]#! will be displayed here, once you have one."

 curie_physicist_achievement_historical_physics_experiment_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetSheHe] is famous for the #V [Scope.GetCharacter.GetLastNameNoFormatting] Experiment#! named after [Scope.GetCharacter.GetHerHim]."
 curie_physicist_achievement_founded_magnetic_association_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] is the #V founder of the Magnetic Association#!, the first international scientific association.#!"
 curie_physicist_achievements_finished_geomagnetic_observatory_project_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] helped conducting geomagnetical research by #V building a Geomagnetic Observatory#!.#!"
 curie_physicist_achievement_magnetic_atlas_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetSheHe] played a key role in the #V creation of a magnetic atlas#!."

 curie_physicist_achievement_mathematics_improvement_finished_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] worked tirelessly to #V improve the mathematics departments#! in this country.#!"