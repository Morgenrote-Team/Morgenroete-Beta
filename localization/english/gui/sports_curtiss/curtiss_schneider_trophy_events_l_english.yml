l_english:

 curtiss_schneider_trophy_event_crash_icon_flag: "@curtiss_event_log_crash_icon!"
 curtiss_schneider_trophy_event_crash_title_flag: "Plane Crash"
 curtiss_schneider_trophy_event_crash_flag: "#t $curtiss_schneider_trophy_event_crash_title_flag$#!\nDuring a maneuver, the pilot overestimated himself - and crashed into the water!"

 curtiss_schneider_trophy_event_buoy_icon_flag: "@curtiss_event_log_buoy_icon!"
 curtiss_schneider_trophy_event_buoy_title_flag: "Buoy overlooked"
 curtiss_schneider_trophy_event_buoy_flag: "#t $curtiss_schneider_trophy_event_buoy_title_flag$#!\nThe team flew a good lap in the Schneider Trophy race, but one of the pilots was threatened with a point deduction because one of the referees complained that he had overlooked a buoy."

 curtiss_schneider_trophy_event_maximum_speed_icon_flag: "@curtiss_event_log_speed_icon!"
 curtiss_schneider_trophy_event_maximum_speed_title_flag: "Maximum Speed"
 curtiss_schneider_trophy_event_maximum_speed_flag: "#t $curtiss_schneider_trophy_event_maximum_speed_title_flag$#!\nAlong the route, the pilots can show the speed that the plane can reach."

 curtiss_schneider_trophy_event_slalom_icon_flag: "@curtiss_event_log_slalom_icon!"
 curtiss_schneider_trophy_event_slalom_title_flag: "Slalom maneuvers"
 curtiss_schneider_trophy_event_slalom_flag: "#t $curtiss_schneider_trophy_event_slalom_title_flag$#!\nThe Schneider Trophy is best known as a speed competition, but there were three to four marks that could be missed at high speed - and could result in disqualification."

 curtiss_schneider_trophy_event_fog_icon_flag: ""
 curtiss_schneider_trophy_event_fog_title_flag: "Fog"
 curtiss_schneider_trophy_event_fog_flag: "#t $curtiss_schneider_trophy_event_fog_title_flag$#!\nFog was more often a problem on the waterways. Even experienced pilots could fail at this sudden challenge."
