 zeppelin.233.f: ""
 zeppelin.233.g: ""
 zeppelin.233.h: ""
 zeppelin.233.i: ""
 zeppelin.235.t: "North Pole Passage"
 zeppelin.235.d: "The team of our zeppelin expedition under the command of Captain [ROOT.Var('zeppelin_captain_var').GetCharacter.GetLastName] crossed the North Pole!"
 zeppelin.235.f: "'The fact that the others hadn't succeeded: This was the essential fact that pushed me towards the North Pole enterprise. As a guy I was ambitious. I wanted new things. I had built a new kind of airship, but I wasn't happy with the way it was used by the pilots, by the Air Force officers. I wanted to fly it because I knew it could do much more than they thought.' - Umberto Nobile"
 zeppelin.235.g: "I have ice for you."