 zeppelin.131.t: "Maiden Voyage"
 zeppelin.131.f: "#YELLOW #b Technical Data#!#!\n\n$MR_ZEPPELIN_NAME$\n$MR_ZEPPELIN_SIZE$\n$MR_ZEPPELIN_SPEED$\n$MR_ZEPPELIN_RANGE$\n$MR_ZEPPELIN_ENDURANCE$\n$MR_ZEPPELIN_ENGINE$\n$MR_ZEPPELIN_STRUCTURE$\n$MR_ZEPPELIN_FORM$\n$MR_ZEPPELIN_CELLS$"
 zeppelin.131.g: "I salute you, [GetPlayer.GetCustom('zeppelin_name_type')]!"
 zeppelin.131.d_small: "A small crowd of onlookers gathered in a field today to watch the [GetPlayer.GetCustom('zeppelin_name_type')]. At first, many spectators did not expect the zeppelin to take off, but to everyone's surprise, Captain [ROOT.Var('zeppelin_captain_var').GetCharacter.GetLastName] mastered the small airship without any problems."
 zeppelin.131.d_medium: "A large crowd gathered near the airship hangar for the [GetPlayer.GetCustom('zeppelin_name_type')]'s maiden flight. Several members of the press were also present. To the delight of those in attendance, the medium-sized Zeppelin rose elegantly into the sky under the command of Captain [ROOT.Var('zeppelin_captain_var').GetCharacter.GetLastName]."
 zeppelin.131.d_large: "For days now, the residents of [SCOPE.sState('zeppelin_state_scope').GetName] have been eagerly awaiting the [GetPlayer.GetCustom('zeppelin_name_type')]'s ceremonial maiden flight. A festival took place this weekend, and Captain [ROOT.Var('zeppelin_captain_var').GetCharacter.GetLastName]'s first sightseeing flight was greeted with wild cheers and confetti. That huge airship is simply a stunning sight to behold!"
 zeppelin.131.d_giant: "At an official state ceremony in front of the Zeppelin hangar in [SCOPE.sState('zeppelin_state_scope').GetName], [SCOPE.sCharacter('zeppelin_ruler_scope').GetFullName] christened the Italia with the most expensive champagne available. With a military band, state guests, and a massive spectator grandstand, the amazed onlookers watched as the gigantic airship soared into the sky. For Captain [ROOT.Var('zeppelin_captain_var').GetCharacter.GetLastName], it was certainly the day of [ROOT.Var('zeppelin_captain_var').GetCharacter.GetHerHis] life!"

