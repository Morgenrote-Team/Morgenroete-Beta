 zeppelin.101.t: "Zeppelin Captain"
 zeppelin.101.d: "[SCOPE.sCharacter('zeppelin_new_captain_scope').GetFullName] is an experienced naval officer with extensive expertise in the fields of navigation and organisation. [SCOPE.sCharacter('zeppelin_new_captain_scope').GetHerHis|U] superiors have recommended [SCOPE.sCharacter('zeppelin_new_captain_scope').GetHerHim] as the next zeppelin captain."
 zeppelin.101.d_no_ship: "Today, officials at the Zeppelin shipyard named [SCOPE.sCharacter('zeppelin_new_captain_scope').GetFullName] as the future captain of the airship currently under construction."
 zeppelin.101.f: "„I am the monarch of the sea,\nThe ruler of the Queen's Navee,\nWhose praise Great Britain loudly chants.\nCousin Hebe: And we are his sisters, and his cousins, and his aunts!“"
 zeppelin.101.f_no_ship: "„Of legal knowledge I acquired such a grip\nThat they took me into the partnership.\nAnd that junior partnership, I ween,\nWas the only ship that I ever had seen.“"
 zeppelin.101.g: "[SCOPE.sCharacter('zeppelin_new_captain_scope').GetSheHe|U]'ll be a captain of the skies!"

 zeppelin.102.t: "Admiral of the Skies"
 zeppelin.102.d: "In recognition of [ROOT.Var('zeppelin_captain_var').GetCharacter.GetHerHis] numerous voyages and the extraordinary services [ROOT.Var('zeppelin_captain_var').GetCharacter.GetSheHe] has rendered to [ROOT.Var('zeppelin_captain_var').GetCharacter.GetHerHis] homeland, [SCOPE.sCharacter('zeppelin_ruler_scope').GetFullName] has today awarded [ROOT.Var('zeppelin_captain_var').GetCharacter.GetFullName] the title of 'Admiral of the Skies'."
 zeppelin.102.f: ""
 zeppelin.102.g: "Admiral of the Skies? What a grandiose title!"

