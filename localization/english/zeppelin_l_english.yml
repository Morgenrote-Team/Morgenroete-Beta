 zeppelin_expedition_event_superheat_flag: "#t $zeppelin_expedition_event_superheat_title_flag$#!\nIntense solar glare off the pack ice overheats the gas cells well beyond ambient temperatures, causing the expanded hydrogen to vent away and leaving the zeppelin struggling for lift as the air suddenly cools.\n\n#b The following factors make this outcome less likely:#!\n[concept_zeppelin] has #V Arctic Equipment#! (Module Slot 2)."
