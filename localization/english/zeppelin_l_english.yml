 zeppelin.111.t: "New Oil Gas"
 zeppelin.111.d: "Our chemist has revolutionized airship travel with his development of a new gas for zeppelins. From now on, the new oil-based gas will bear his name: [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastNameNoFormatting] Gas."
 zeppelin.111.f: "Blaugas, an oil gas named after the German chemist Hermann Blau and patented in 1904, became of central importance for Zeppelin flight beginning in the late 1920s. Since it has nearly the same density as air, its use as fuel did not alter the airship's total weight—eliminating the need for the labor-intensive process of venting the expensive lifting gas, hydrogen, to regulate lift. In addition, Blaugas had a very high calorific value and could be easily liquefied under pressure. It was first used successfully in 1928 on the long-distance and round-the-world flights of the airship LZ 127 Graf Zeppelin, where it played a decisive role in achieving its great range."
 zeppelin.111.g: "[ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastNameNoFormatting] Gas? Great Name!"
 mendelejew_add_blau_gas_effect_tt: "[GetPlayer.GetName] invents #V [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastNameNoFormatting] Gas#!!"
 zeppelin.112.t: "New Ballast System"
 zeppelin.112.d: "[ROOT.Var('tesla_engineer_var').GetCharacter.GetFullName] has improved the performance of our zeppelins with a new technical system and ensured that less valuable lifting gas is wasted."
 zeppelin.112.f: "The ballast water recovery system in Zeppelins extracted water from the engines' exhaust gases, thereby keeping the airship's weight constant despite fuel consumption. The combustion of hydrocarbon fuels produces water vapor; when cooled, this vapor condensed in metal tubes exposed to the airflow and collected as ballast water. This eliminated the need to release valuable lifting gas to compensate for buoyancy. The system became particularly important starting in the 1920s for long-distance flights and for airships using non-flammable but expensive helium."
 zeppelin.112.g: "Our zeppelins will soar to heights and distances never before seen!"
 tesla_add_ballast_water_effect_tt: "[GetPlayer.GetName] invents #V Ballast Water Recovery#!!"

 zeppelin.121.t: "Zeppelin Construction"
 zeppelin.121.d: "The necessary preparations have been made, and the plans for the construction of a new zeppelin have been laid out. The question remains: How big should the zeppelin be?"
 zeppelin.121.f: "Building a zeppelin is an ambitious project that can take months or even years in some cases. The number of additional modules a zeppelin can have also depends on its size. The smallest version has two modules, a medium-sized zeppelin has three modules, a large zeppelin has four modules, and a gigantic zeppelin has five modules. Initially, only small zeppelins are available, so it's possible that they will need to be replaced by larger ones later on, if technical and financial resources allow. Of course, building a large zeppelin takes longer and is also more expensive."
 zeppelin.121.zepelin_small_cost_tt: "#V $zeppelin_small_flag$#!\nAverage construction time: 6 months\nDaily Expenses: 1000"
 zeppelin.121.zepelin_medium_cost_tt: "#V $zeppelin_small_flag$#!\nAverage construction time: 12 months\nDaily Expenses: 2000"
 zeppelin.121.zepelin_large_cost_tt: "#V $zeppelin_large_flag$#!\nAverage construction time: 30 months\nDaily Expenses: 35000"
 zeppelin.121.zepelin_giant_cost_tt: "#V $zeppelin_giant_flag$#!\nAverage construction time: 60 months\nDaily Expenses: 5000"

 je_zeppelin_propellant_invention: "Zeppelins: Propellant Invention"
 je_zeppelin_propellant_invention_reason: "Our skilled chemist researches a new fuel for Zeppelin engines that mitigates the problems associated with buoyancy control and thereby extend the Zeppelin's range and endurance.\n\nBuoyancy control involves maintaining the balance between static buoyancy (lifting gas) and total weight (hull, gondola, crew, fuel, payload) of an airship or balloon. If the weight decreases—for example, due to fuel consumption—or if the lifting gas heats up from solar radiation, excess buoyancy results; if it cools or gas escapes, the airship or balloon risks sinking. In the past, this was primarily compensated for by jettisoning ballast (sand, water) or releasing lifting gas—both of which limited the range. To positively influence lift—that is, to minimize losses and ensure sustainability—technicians utilized blue gas with a density similar to air, ballast water recovery from exhaust gases, overheating or cooling of the lifting gas, altitude control (aerodynamic lift), and tow ropes."

 je_zeppelin_ballast_invention: "Zeppelins: Ballast Invention"
 je_zeppelin_ballast_invention_reason: "Our skilled engineer develops a new system that counteracts a zeppelin's buoyancy, thereby improving its range and endurance.\n\nBuoyancy control involves maintaining the balance between static buoyancy (lifting gas) and total weight (hull, gondola, crew, fuel, payload) of an airship or balloon. If the weight decreases—for example, due to fuel consumption—or if the lifting gas heats up from solar radiation, excess buoyancy results; if it cools or gas escapes, the airship or balloon risks sinking. In the past, this was primarily compensated for by jettisoning ballast (sand, water) or releasing lifting gas—both of which limited the range. To positively influence lift—that is, to minimize losses and ensure sustainability—technicians utilized blue gas with a density similar to air, ballast water recovery from exhaust gases, overheating or cooling of the lifting gas, altitude control (aerodynamic lift), and tow ropes."

