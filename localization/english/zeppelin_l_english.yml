 je_zeppelin_expedition: "Zeppelin Expedition"
 je_zeppelin_expedition_reason: "An [concept_zeppelin_expedition] expeditions rely heavily on the capabilities of a [concept_zeppelin]. The total progress value depends on the zeppelin's range. Accordingly, a minimum range of 6,000 kilometers corresponds to a maximum progress bar of 6. The greater the range, the higher the progress bar.\n\nThe longer an expedition lasts, the more positive discoveries are made. This is especially true for expedition specializations—certain events are triggered only with a Physics or Nature specialization. For example, a bonus event is triggered only when the zeppelin has a range of 8,000 miles (progress value 8).\n\nA primary goal of zeppelin expeditions is to map unknown [Concept('concept_zeppelin_arctic_region','$concept_zeppelin_arctic_regions|q$')]. A region can be mapped starting at 5,000 kilometers. A zeppelin that reaches 10,000 kilometers also maps a second region. A third region is unlocked at the end of the expedition if the zeppelin has a research station on board.\n\nZeppelin expeditions are always at risk of ending in catastrophe if the danger level is too high. #V Water Landing Floats#! can increase the maximum danger level, allowing a zeppelin to survive a greater number of negative events. However, the safest approach is to research the relevant technologies.\n\nIn total, there are four different discoveries in the Arctic: one geographical, one paleontological, one zoological, and one physical. The geographical discovery involves crossing the North Pole. It is only possible once all eight other regions have been mapped."

