 zeppelin.231.t_meo: "Aurora Borealis"
 zeppelin.231.t_bio: "Polar Bears"
 zeppelin.231.d_meo: "The researchers of the Zeppelin expedition were able to experience some unusually active auroral nights."
 zeppelin.231.d_bio: "From the airship, researchers were able to observe a group of polar bears and study their behavior for days."
 zeppelin.231.f_meo: "Auroras are the result of disturbances in the magnetosphere caused by the solar wind. Major disturbances result from enhancements in the speed of the solar wind from coronal holes and coronal mass ejections. These disturbances alter the trajectories of charged particles in the magnetospheric plasma. Auroras display dynamic patterns of brilliant lights that appear as curtains, rays, spirals, or dynamic flickers covering the entire sky."
 zeppelin.231.f_bio: "Constantine John Phipps was the first to describe the polar bear as a distinct species in 1774 in his report about his 1773 expedition towards the North Pole. It is the largest extant bear species, as well as the largest extant land carnivore. Although it is the sister species of the brown bear, it has evolved to occupy a narrower ecological niche, with many body characteristics adapted for cold temperatures, for moving across snow, ice and open water, and for hunting seals, which make up most of its diet. Although most polar bears are born on land, they spend most of their time on the sea ice."
 zeppelin.231.g: "Wonderful!"
 zeppelin.231.h: "This stately animal belongs in a [concept_dubois_zoo]!"
 zeppelin.231.i: "Write a documentation about the bear!"
 zeppelin.232.t_meo: "Magnetic studies"
 zeppelin.232.t_bio: "Narwhal"
 zeppelin.232.d_meo: "Meteorologists on board the current polar expedition want to observe a magnetic phenomenon in a region more closely."
 zeppelin.232.d_bio: "Marine researchers aboard the polar zeppelin have spotted a narwhal. They plan to spend two days studying the animal's behavior more closely."
 zeppelin.232.f_meo: "Owing to motion of fluid in the Earth's outer core, the actual magnetic poles are constantly moving. However, over thousands of years, their direction averages to the Earth's rotation axis. On the order of once every half a million years, the poles reverse although the time frame of this switching can be anywhere from every 10 thousand years to every 50 million years. Although the geomagnetic pole is only theoretical and cannot be located directly, it arguably is of more practical relevance than the magnetic (dip) pole. This is because the poles describe a great deal about the Earth's magnetic field, determining for example where auroras can be observed."
 zeppelin.232.f_bio: "Found primarily in Canadian Arctic and Greenlandic and Russian waters, the narwhal is a uniquely specialised Arctic predator. In winter, it feeds on benthic prey, mostly flatfish, under dense pack ice. During the summer, narwhals eat mostly Arctic cod and Greenland halibut, with other fish such as polar cod making up the remainder of their diet. The most conspicuous characteristic of the male narwhal is a single long tusk, which is in fact a canine tooth. Some medieval Europeans believed narwhal tusks to be the horns from the legendary unicorn."
 zeppelin.232.g: "Conduct physical studies."
 zeppelin.232.h: "Conduct biological studies."
