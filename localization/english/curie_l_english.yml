 je_curie_magnetic_observation: "Geomagnetic Observation"
 je_curie_magnetic_observation_reason: "Carl Friedrich Gauß built the first geophysical observatory in Göttingen and constructed a sensitive magnetometer for it in 1832. He realized that globally distributed measurements would have to be carried out at the same time in order to be able to localize the causes of the fluctuations and measure the static field more precisely. From 1836 onwards, the Magnetic Association founded for this purpose and the British Royal Society provided data that he and Wilhelm Weber evaluated. The aim was to measure the fluctuations of the earth's magnetic field in a coordinated manner using numerous measuring stations distributed all over the world. Up to 50 observatories took part in this project, including 35 in Europe, six in Asia, two in Africa, three in North America and four in Oceania. The results were delivered to Göttingen and scientifically processed by Gauß and Weber."
 je_curie_magnetic_observation_goal: "Collect #G 100#! @curie_magnetic_data_var! #O Magnetic Data#!. This is an international effort, every member of the Magnetic Association will contribute."

 je_curie_magnetic_atlas: "The Geomagnetic Atlas"
 je_curie_magnetic_atlas_reason: "In the 1830s, Gauss and Weber founded the Göttingen Magnetic Association. They established a global network of observation stations that measured the strength and direction of the Earth's magnetic field simultaneously and in accordance with standardised procedures. Gauss developed the theory of potential to describe the Earth's magnetic field. Using this mathematical method, he was able to calculate the magnetic field for the entire surface of the Earth - even for regions for which no direct measurements were available."
 je_curie_magnetic_atlas_progress_complete_tt: "The progess reached #V 24#!."

 curie_set_magnetic_association_effect_tt: "Found the Magnetic Association. Other countries can join and also build #O Geomagnetic Observatories#! to collect @curie_magnetic_data_var! #O Magnetic Data#!."
 curie_add_magnetic_association_member_tt: "Join the Magnetic Association. Members will send @curie_magnetic_data_var! #O Magnetic Data#! to [GetPlayer.GetCustom('curie_magnetic_association_city')] and benefit from scientific results."

