 curie_nuclear_reactor_tech: "Nuclear Reactor"
 curie_nuclear_reactor_tech_desc: "The path to controlled nuclear fission began in 1942 with Chicago Pile-1, the world's first artificial nuclear reactor, which demonstrated a self-sustaining chain reaction beneath the stands of a stadium. Building on this, the X-10 graphite reactor in Tennessee followed, serving as a pilot plant to test the large-scale production of plutonium and the handling of intense radiation. The highlight of this era was the B Reactor at Hanford, the world's first full-scale production reactor, which finally made the industrial application of nuclear power a reality."
 curie_the_bomb_tech: "The Bomb"
 curie_the_bomb_tech_desc: "'Now I am become Death, the destroyer of worlds.'"
 curie_nuclear_fission_tech: "Nuclear Fission"
 curie_nuclear_fission_tech_desc: "In the late 1930s, researchers succeeded for the first time in splitting heavy atomic nuclei by bombarding them with neutrons, thereby unlocking a previously unimagined source of energy within matter. This scientific breakthrough marked the transition from theoretical physics to the practical mastery of the forces that bind the universe together."

 curie_facility_can_construct_only_facility_tt: "We do not have a Nuclear Research Facility yet."

 curie_rocket_science_tech: "Rocket Science"
 curie_rocket_science_tech_desc: "At the turn of the 20th century, rocket science transitioned from science fiction to a rigorous theoretical framework, largely pioneered by the Russian visionary Konstantin Tsiolkovsky. In his seminal 1903 work, Tsiolkovsky derived the fundamental rocket equation, proving that space travel was mathematically possible through multi-stage rockets and liquid propellants. The Transylvanian-German physicist Hermann Oberth independently developed the principles of astronautics in the 1920s, providing the engineering blueprints that would later inspire the first generation of practical rocket engineers."
 curie_modern_rockets_tech: "Modern Rockets"
 curie_modern_rockets_tech_desc: "Robert Goddard transitioned rocket science into a practical era by launching the first liquid-fueled rockets and developing essential systems like gyroscopic stabilization. In Germany, research intensified through the Verein für Raumschiffahrt, where a young Wernher von Braun began refining the engineering required for large-scale propulsion. This period ultimately saw the technology shift from private experimentation to massive state-funded projects, culminating in the development of the first rockets capable of reaching the edge of space."

 alert_curie_physicist_will_retire_soon_alert_name: "[concept_curie_physicist] close to retirement"
 alert_curie_physicist_will_retire_soon_alert_desc: "Your [concept_curie_physicist] is close to retirement. You might want to find a replacement."
 curie_physicist_will_retire_soon_alert_setting_name: "#tooltip:[GetRawTextTooltipTag('mr_morgenroete_tt')] @mr_morgenroete_icon! #! [concept_curie_physicist] close to retirement"
 alert_curie_physicist_will_retire_soon_alert_hint: "Your [concept_curie_physicist] will retire sometime in the next #V 5 years#!. You might want to find a new Physicist to replace them."
 alert_curie_physicist_will_retire_soon_alert_action: "$mr_alert_send_to_science_mathematics$"

 curie_differential_geometry_tech: "Differential Geometry"
 curie_differential_geometry_tech_desc: "Pioneered by Gauss in the 19th century, Differential Geometry uses complex math to describe how curves and surfaces behave in the real world. Originally developed to create more accurate maps and measure the Earth, it allowed scientists to calculate shapes and distances using formulas instead of just looking at them."

 ### 2.9.0 ###

 curie_mathematics_tech: "Mathematics"
 curie_mathematics_tech_desc: "Mathematics is the science of numbers, quantities, and shapes. It provides the logical foundation for advanced engineering, navigation, physics, and complex resource management in the march of progress."

 je_group_curie_physics: "Physics"

 je_curie_formula_discovery: "Mathematical Formula"
 je_curie_formula_discovery_reason: "[ROOT.Var('curie_physicist_var').GetCharacter.GetFullName] is trying to come up with a new mathematical formula. Some character traits and skills may speed up research. Our physicist is currently working on [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]."
 je_curie_formula_discovery_goal: "#E Physicist Progress#! reaches #ORANGE [GetPlayer.MakeScope.GetVariable('curie_searched_formula_duration_value').GetValue|0]#! points."
 je_physicist_dies_tt: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] dies"
 je_curie_formula_discovery_failed_tt: "Another nation discovers the formula before Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName]."
 curie_add_discovered_formula_effect_tt: "[GetPlayer.GetName] formulates #V [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]#!."

 curie.201.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]"
 curie.201.d: "Is it really true—or just another one of those strange dreams that swirled through Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetFullName]'s mind and revealed the completed formula to [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHim]? After nerve-wracking nights, [ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe] can proudly point to [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis] work. [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis|U] research in the field of the [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')] is complete."
 curie.201.f: "'It is always curious that all those who seriously study this science develop a kind of passion for it.' -Carl Friedrich Gauß "
 curie.201.g: "So who's going to clean the board now?"
 curie.202.t: "Mathematical Formula"
 curie.202.d: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetFullName] has set out to discover a new field of mathematics. [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis|U] research focuses on [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]."
 curie.202.f: "Beginning in the 19th century, the foundations of mathematical concepts were scrutinized and solidified. Augustin-Louis Cauchy established the ε definition of the limit. He also laid the foundations of function theory. The close connection between the development of physics and mechanics and 18th-century calculus persisted, and many mathematicians were also theoretical physicists—a distinction that had not yet been made at that time."
 curie.202.g: "Hopefully something useful will come of it...?"
 curie.203.t: "Foreign Nation formulates [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]"
 curie.203.d: "Through an exchange of letters, Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetFullName] discovered today that a foreign colleague had beaten [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHim] to the punch in [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis] research on [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]! The rival has already derived the formula."
 curie.203.f: "'Nothing reveals a lack of mathematical education more strikingly than an excessive precision in arithmetic.' -Wilhelm Weber"
 curie.203.g: "This mathematical glory should be ours!"

