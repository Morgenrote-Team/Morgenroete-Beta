 curie.100.t: "The Magnetic Association"
 curie.100.d: "Dr. [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetLastName] commissioned the Geomagnetic Observatory for the first time today. It will be the heart of the newly founded Magnetic Society and a model for similar stations around the world. Three cheers for science!"
 curie.100.f: "The Magnetic Association (Magnetischer Verein) was the first international scientific association. It was founded in 1834 by Carl Friedrich Gauss and Wilhelm Weber in Göttingen. It coordinated worldwide, synchronized measurements of Earth's magnetic field across a network of global observatories."
 curie.101.t: "A new Member of the Magnetic Association"
 curie.101.d: "[GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetFullName] joined the Magnetic Association in [GetPlayer.GetCustom('curie_magnetic_association_city')] today. The other members welcomed [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetHerHim] warmly."
 curie.101.f: "By joining, Dr. [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetLastName] was also able to obtain the necessary knowledge to build a functional geomagnetic observatory. The chairman gave our physicist the plans for such a station and a magnetometer. The entire association pushed for construction to get underway quickly and for the first data to be sent to [GetPlayer.GetCustom('curie_magnetic_association_city')]."
 curie.101.g: "We should build a measuring station immediately."
 curie.102.t: "Geomagnetic Observatory finished"
 curie.102.d: "The construction of the Geomagnetic Observatory was completed today. Numerous data was obtained in the last months and transmitted to [GetPlayer.GetCustom('curie_magnetic_association_city')]."
 curie.102.f: "The measurement data obtained not only serves the scientific research of the earth's magnetic field, but also has practical use. Declination maps were used in the past and are still used today for navigation in shipping and aviation. For the search for raw materials like ore and oil deposits, the geomagnetic measurement data is important."
 curie.102.g: "For geomagnetical science!"
 curie.103.t: "International Magnetic Data Collection"
 curie.103.d: "After years of collecting and comparing geomagnetic data from all over the world, the researchers in [GetPlayer.GetCustom('curie_magnetic_association_city')] were able to come to an interesting result."
 curie.103.f: "Geophysics and geomagnetism have many practical uses. Mining in particular benefited from uncovering possible deposits. Large companies used geophysical knowledge to locate previously unknown deposits of iron, lead and oil. Together with the right technologies and the mapping of the earth's magnetic field, it should be easy to make productive use of current theoretical knowledge."
 curie.103.g: "We need more scientific data."
 curie.103.h: "This will help in the search for iron deposits."
 curie.103.i: "This will help in the search for lead deposits."
 curie.103.j: "This will help in the search for copper deposits."
 curie.103.k: "This will help in the search for oil deposits."
 curie.104.t: "Nautical Interest"
 curie.104.d: "[SCOPE.sCharacter('curie_admiral_scope').GetFullName] has expressed great interest in [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetFullName]'s geomagnetic research. He carried out a successful experiment at the Geomagnetic Observatory that is currently under construction."
 curie.104.f: "'What am I going to do with the frog legs? Oh, nothing special, absolutely nothing...'"
 curie.104.g: "The new knowledge should be useful to him."
 curie.104.h: "This knowledge should benefit everyone."
 curie.105.t: "An Anomaly"
 curie.105.d: "Despite renewed measurements, the figures for the earth's magnetic field that Dr. [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetLastName] recorded hardly correspond to what was expected. He hasn't been able to find the reason for this yet."
 curie.105.f: "There can be a variety of reasons why the earth's magnetic field is different in one place than elsewhere. Such incidents often gave rise to the assumption that a large metal deposit could be located at the site, which is why geomagnetic research was not uninteresting for mining."
 curie.105.g: "We should send the data directly to [GetPlayer.GetCustom('curie_magnetic_association_city')]."
 curie.106.t: "Astronomer consults Geomagnetic Observatory"
 curie.106.d: "Dr. [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetFullName] and Dr. [GetPlayer.MakeScope.GetVariable('verrier_astronomer_var').GetCharacter.GetFullName] had some stimulating conversations during the tour of the newly built geomagnetic observatory. The exchange has enormously expanded [GetPlayer.MakeScope.GetVariable('verrier_astronomer_var').GetCharacter.GetLastName]'s' scientific knowledge."
 curie.106.f: "'So THIS is the reason why the jam bread always falls to the floor with the jam side on it!'"
 curie.106.g: "This will help [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetHerHim] in [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetHerHis] practical research."
 curie.106.h: "This will help [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetHerHim] in [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetHerHis] theoretical research."
 curie.107.t: "Magnetic Atlas"
 curie.107.d: "Dr. [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetFullName] has published the first Geomagnetic Atlas of the Earth. The book is set to become a standard scientific reference work in physics!"
 curie.107.f: "The Geomagnetic Atlas (officially usually referred to as the 'Atlas of Terrestrial Magnetism') from the 19th century is a pioneering work in the fields of geophysics and cartography. It was published in Leipzig in 1840 and edited by the mathematician Carl Friedrich Gauss and the physicist Wilhelm Weber. The work was the first to compile global measurements of the Earth's magnetic field on a mathematically sound basis and to represent them visually on maps. The atlas comprises 18 detailed maps and diagrams of the Earth and demonstrated that the main cause of the Earth's magnetic field lies within the Earth's interior."
 curie.107.g: "This knowledge should be applied in a theoretical context."
 curie.107.h: "This knowledge should be put into practice."

