l_english:

### Curtiss ###

 CURTISS_ADD_X_SCHNEIDER_TROPHY_POINTS_EFFECT_POSITIVE: "The country $MR_GAINS$ $VALUE|0+$ @curtiss_schneider_point! Schneider Trophy Points"
 CURTISS_ADD_X_SCHNEIDER_TROPHY_POINTS_EFFECT_NEGATIVE: "The country $MR_LOSES$ [Negate_CFixedPoint('(CFixedPoint)$VALUE$')|0+] @curtiss_schneider_point! Schneider Trophy Points"
 CURTISS_ADD_X_SCHNEIDER_TROPHY_POINTS_EFFECT_FIRST_POSITIVE: "[COUNTRY.GetNameNoFlag] $MR_GAINS$ $VALUE|+0$ @curtiss_schneider_point! Schneider Trophy Points (currently [COUNTRY.MakeScope.GetVariable('curtiss_schneider_trophy_point_var').GetValue|0|V])"
 CURTISS_ADD_X_SCHNEIDER_TROPHY_POINTS_EFFECT_FIRST_NEGATIVE: "[COUNTRY.GetNameNoFlag] $MR_LOSES$ [Negate_CFixedPoint('(CFixedPoint)$VALUE$')|+0] @curtiss_schneider_point! Schneider Trophy Points (currently [COUNTRY.MakeScope.GetVariable('curtiss_schneider_trophy_point_var').GetValue|0|V])"
 CURTISS_ADD_X_SCHNEIDER_TROPHY_POINTS_EFFECT_THIRD_POSITIVE: "[COUNTRY.GetName] $MR_GAINS$ $VALUE|+0$ @curtiss_schneider_point! Schneider Trophy Points"
 CURTISS_ADD_X_SCHNEIDER_TROPHY_POINTS_EFFECT_THIRD_NEGATIVE: "[COUNTRY.GetName] $MR_LOSES$ [Negate_CFixedPoint('(CFixedPoint)$VALUE$')|+0] @curtiss_schneider_point! Schneider Trophy Points"

 CURTISS_FLIGHT_ROUTE: "Flight Route"
 CURTISS_FLIGHT_ROUTES: "Flight Routes"

 CURTISS_ADD_X_FLIGHT_ROUTE_EFFECT_POSITIVE: "The country $MR_GAINS$ $VALUE|0+$ @curtiss_airlines! [SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE$','(CFixedPoint)1'),'CURTISS_FLIGHT_ROUTES','CURTISS_FLIGHT_ROUTE')]"
 CURTISS_ADD_X_FLIGHT_ROUTE_EFFECT_NEGATIVE: "The country $MR_LOSES$ [Negate_CFixedPoint('(CFixedPoint)$VALUE$')|0+] @curtiss_airlines! [SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE$','(CFixedPoint)1'),'CURTISS_FLIGHT_ROUTES','CURTISS_FLIGHT_ROUTE')]"
 CURTISS_ADD_X_FLIGHT_ROUTE_EFFECT_FIRST_POSITIVE: "[COUNTRY.GetNameNoFlag] $MR_GAINS$ $VALUE|+0$ @curtiss_airlines! [SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE$','(CFixedPoint)1'),'CURTISS_FLIGHT_ROUTES','CURTISS_FLIGHT_ROUTE')] (currently [COUNTRY.MakeScope.GetVariable('curtiss_flight_route').GetValue|0|V])"
 CURTISS_ADD_X_FLIGHT_ROUTE_EFFECT_FIRST_NEGATIVE: "[COUNTRY.GetNameNoFlag] $MR_LOSES$ [Negate_CFixedPoint('(CFixedPoint)$VALUE$')|+0] @curtiss_airlines! [SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE$','(CFixedPoint)1'),'CURTISS_FLIGHT_ROUTES','CURTISS_FLIGHT_ROUTE')] (currently [COUNTRY.MakeScope.GetVariable('curtiss_flight_route').GetValue|0|V])"
 CURTISS_ADD_X_FLIGHT_ROUTE_EFFECT_THIRD_POSITIVE: "[COUNTRY.GetName] $MR_GAINS$ $VALUE|+0$ @curtiss_airlines! [SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE$','(CFixedPoint)1'),'CURTISS_FLIGHT_ROUTES','CURTISS_FLIGHT_ROUTE')]"
 CURTISS_ADD_X_FLIGHT_ROUTE_EFFECT_THIRD_NEGATIVE: "[COUNTRY.GetName] $MR_LOSES$ [Negate_CFixedPoint('(CFixedPoint)$VALUE$')|+0] @curtiss_airlines! [SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE$','(CFixedPoint)1'),'CURTISS_FLIGHT_ROUTES','CURTISS_FLIGHT_ROUTE')]"
