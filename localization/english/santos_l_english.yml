 je_santos_balloon_ride: "Balloon Ride"
 je_santos_balloon_ride_reason: "[ROOT.GetCountry.GetCustom('santos_balloon_research_active_type')] In addition to balloon innovations, [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] can enhance buildings—primarily monuments, city parks, and amusement parks—with balloon attractions.\n\nThis is the default project of the [concept_santos_balloonist]. It is active when the Balloonist is not busy with another project.\nEvery time the progress reaches #V 36#! we will get a small technology boost. If there is a [concept_monument], [GetBuildingType('building_gaudi_park').GetName], or [GetBuildingType('building_gaudi_luna').GetName], the balloonist will randomly visit one of these locations and apply the $santos_building_production_mult_modifier$ modifier. \n\nTechnology for the next boost: [GetPlayer.MakeScope.GetCountry.GetCustom('santos_balloon_research_next_technology_type')]"
 je_santos_balloon_ride_active_loc: "#p This Project is currently active.#!\n\nDr. [ROOT.Var('santos_balloonist_var').GetCharacter.GetLastName] takes fun sightseeing trips."
 je_santos_balloon_ride_inactive_loc: "#n This Project is currently inactive.#! It becomes active again, once the Balloonist is no longer busy.\n\n[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] could take fun rides if [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] wasn't busy already."

