 santos.401.t: "Crossing Selection"
 santos.401.d: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] is still pondering which balloon crossing [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] should attempt. The destination of his journey must be chosen carefully—it could be his last..."
 santos.401.f: "'Get in a supply of taffeta and of cordage, quickly, and you will see one of the most astonishing sights in the world.' -Joseph-Michel Montgolfier"