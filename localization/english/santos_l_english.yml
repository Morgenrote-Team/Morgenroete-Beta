 santos_distance_description_no_record: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] tried to fly with [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] balloon as far as possible. With a distance of #b #n [ROOT.Var('new_balloon_distance_var').GetValue]#! kilometers#!, [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] could not beat our country's previous record of #b #p [ROOT.Var('santos_balloon_distance_record_var').GetValue]#! kilometers#!. Nor did [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] beat the previous duration record of #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! hours#! with a duration of #b #n [ROOT.Var('new_balloon_time_var').GetValue]#! hours#!. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName] will certainly try again."
 santos_distance_description_distance_record_country: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] has set a new distance record for our country with [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] balloon! With a distance of #b #p [ROOT.Var('new_balloon_distance_var').GetValue]#! kilometers#!, [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] was able to clearly surpass our country's previous record of #b #p [ROOT.Var('santos_balloon_distance_record_var').GetValue]#! Kilometers#!.  But unfortunately it was not enough to break the world record of #b #p [GetGlobalVariable('santos_balloon_distance_record_global_var').GetValue]#! kilometers#! [GetGlobalVariable('santos_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon]. The duration of #b #n [ROOT.Var('new_balloon_time_var').GetValue]#! hours#! was unfortunally not enough for our national record of #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! hours#!"
 santos_distance_description_time_record_country: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] has set a new duration record for our country with [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] balloon! With a duration of #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! hours#!, [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] was able to beat our country's previous record of #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! hours#!.  Unfortunately it was not enough for the world record of #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! hours#! [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon] The distance record of our country of #b #p [ROOT.Var('santos_balloon_distance_record_var').GetValue]#! kilometers#! could not be broken either with a distance of #b #n [ROOT.Var('new_balloon_distance_var').GetValue]#! kilometers#!."
 santos_distance_description_both_records_country: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] has set a new distance record and a new continuous flight record for our country with [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] balloon! With a distance of #b #p [ROOT.Var('new_balloon_distance_var').GetValue]#! kilometers#!, [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] was able to clearly surpass our country's previous record of #b #p [ROOT.Var('santos_balloon_distance_record_var').GetValue]#! kilometers#!. It was not enough for the world record of #b #p [GetGlobalVariable('santos_balloon_distance_record_global_var').GetValue]#! Kilometers#! [GetGlobalVariable('santos_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon] Though. With a duration of #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! hours#! the national record of #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! hours#! was broken as well, but not the world record of #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! hours#! [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon]"
 santos_distance_description_distance_record_global: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] has set a new world record for a distance flight with [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] balloon! With a distance of #b #p [ROOT.Var('new_balloon_distance_var').GetValue]#! kilometers#! [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] was able to break our country's previous record of #b #p [ROOT.Var('santos_balloon_distance_record_var').GetValue]#! kilometers#! and the world record of #b #p [GetGlobalVariable('santos_balloon_distance_record_global_var').GetValue]#! Kilometers#! [GetGlobalVariable('santos_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon] clearly exceed. The duration of the flight of #b #n [ROOT.Var('new_balloon_time_var').GetValue]#! hours#! was unfortunately not enough for the world record of #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! hours#! [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon]"
 santos_distance_description_time_record_global: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] has set a new world record for a duration flight with [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] balloon! With a duration of #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! hours#! [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] was able to break our country's previous record of #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! Hours#! and the world record of #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! Hours#! [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon] clearly exceed. The distance of #b #n [ROOT.Var('new_balloon_distance_var').GetValue]#! Kilometers#! was unfortunately not enough for the world record of #b #p [GetGlobalVariable('santos_balloon_distance_record_global_var').GetValue]#! Kilometer#! [GetGlobalVariable('santos_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon]"
 santos_distance_description_both_records_global: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] has set a new world record for a distance and a duration flight with [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] balloon! With a distance of #b #p [ROOT.Var('new_balloon_distance_var').GetValue]#! kilometers#! [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] was able to break our country's previous record of #b #p [ROOT.Var('santos_balloon_distance_record_var').GetValue]#! kilometers#! and the world record of #b #p [GetGlobalVariable('santos_balloon_distance_record_global_var').GetValue]#! kilometers#! [GetGlobalVariable('santos_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon] clearly surpassed. The world record time of #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! hours#! [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon] could be exceeded with a flight duration of #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! hours#!."

 # Balloonist tries to set new Time record
 santos.655.t1: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] fails in attempt to break continuous flight record with balloon"
 santos.655.t2: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] has set a new record for the longest lasting balloon flight for our country"
 santos.655.t3: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] has flown longer with [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] balloon than any human has ever flown before!"
 santos.655.d1: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] tried to fly as long as possible with [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] balloon. With a flight time of #b #n [ROOT.Var('new_balloon_time_var').GetValue]#! hours#!, [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] was not able to beat our country's previous record of #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! hours#!. [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe|U] will surely try again."
 santos.655.d2: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] has set a new record for the longest lasting flight for our country with [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] balloon! With a flight time of #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! hours#!, [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] beat our country's previous record of #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! hours#!. But unfortunately it was not enough for the world record of #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! hours#! [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon]."
 santos.655.d3: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] has set a new world record for a the longest lasting flight with [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] balloon! With a flight time of #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! hours#!, [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] was able to beat our country's previous record of #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! hours#! and clearly beat the world record of #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! hours [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon].#!"
 santos.655.f1: "\"This time I did not succeed. But next time I will definitely make it!\""
 santos.655.f2: "\"Who cares about a record like that? I want the world record!\""
 santos.655.f3: "\"That was a cinch!\""
 santos.655.g: "Good luck for the next time!"
 santos.655.h: "Good Work!"
 santos.655.i: "Wonderful! Congratulations!"

 # Balloonist is afraid of heights and gives up ballooning
 santos.656.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] is afraid of heights and gives up ballooning"
 santos.656.d: "Although he claimed to have made quite a few balloon flights, [SCOPE.sCharacter('santos_balloonist_scope').GetFullName] discovered that he is afraid of heights when he made his first flight for our country at an altitude of ten meters. He therefore gives up ballooning."
 santos.656.f: "\"It is terrible! Two weeks ago I was flying at tremendous heights and now.... Now I can't even climb a ladder!\""
 santos.656.g: "How unfortunate..."
 santos.656.h: "Argh! Is there another balloonist we could sponsor?"



 # Balloonist died in accident
 santos.670.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] dies in a balloon accident"
 santos.670.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] crashed on [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] balloon flight and was killed. We thus lose a hero of aviation."
 santos.670.f: "[SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloonist_death_type')]"
 santos.670.g: "How horrible!"
 santos.670.h: "Terrible! Is there another balloonist we could sponsor?"

 # Experienced Balloonist
 santos.671.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] is now an experienced balloonist"
 santos.671.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] has completed a number of balloon flights and gained a lot of experience in ballooning. He is now considered an experienced balloonist who knows what he is doing."
 santos.671.f: "\"Don't be afraid! I have done this dozens of times!\""
 santos.671.g: "Good to hear!"

 # Famous Balloonist
 santos.672.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] is now a famous balloonist"
 santos.672.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] has already made hundreds of balloon flights, on which he also broke some records. By now he is famous, and not only in our country."
 santos.672.f: "\"[SCOPE.sCharacter('santos_balloonist_scope').GetFullName]? Isn't that the balloonist? I really want to meet him!\""
 santos.672.g: "Wonderful!"

 # Balloonist killed by comet
 santos.673.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] hit by a comet during flight"
 santos.673.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] was hit by a comet during the balloon flight and died."
 santos.673.f: "Shortly after takeoff in the balloon [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')], a loud bang was heard. The people on the ground saw a flash of light twitch across the sky and hit directly into the basket of [SCOPE.sCharacter('santos_balloonist_scope').GetFullName]. The balloon started to burn and plummeted into the depths. After the wreckage was cleared, the body of [SCOPE.sCharacter('santos_balloonist_scope').GetFullName] was found. Only our astronomers were pleased with this event because they were able to examine the remains of the comet."
 santos.673.g: "If [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] only had comet sense..."
 santos.673.h: "Oh Comet, devil's kith and kin... Is there another balloonist we could sponsor?"

 # Death by Whale
 santos.674.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] crashed and died while ballonning on beach"
 santos.674.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] crashed on the beach during a balloon flight and died. Oddly enough, a whale was found on the balloon wreckage."
 santos.674.f: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] flew along a beach during a glorious day. Since [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] never returned, search teams were sent out. After a short time, the wreckage was found. The balloon and basket, oddly enough, had been found under the remains of a badly crushed whale. An alcoholic from the next village reported that he had seen a whale and a petunia pot crashing down and that the whale had hit the balloon dead on. Obviously, no credence was given to this story. Interestingly, an intact petunia pot was found nearby. The petunia looked a bit ragged and was left in the expert hands of a local botanist.\n\n[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] will be remembered for his heart of gold and ability to remain calm in any situation."
 santos.674.g: "Oh no! Not again!"
 santos.674.h: "Hello Ground! Is there another balloonist we could sponsor?"

 santos.676.t: "Our Balloonist died"
 santos.676.d:  "After spending decades as a [concept_santos_balloonist], our former #b #r Balloonist#!#! has died. Will we ever be able to replace such an astonishing explorer?"

 santos.691.t: "Balloon Type"
 santos.691.d: "Change the type of your balloon. The conversion will take half a year. During this period, the balloon will be out of service."
 santos.691.f: "Each specialised balloon grants a 5 per cent bonus to the specialisation for which it is named and a -5 per cent penalty. Example: A distance balloon achieves #G +5%#! #V Distance#!, but #R -5#! #V Altitude#! and #R -5#! #V Time#!. The all-round balloon has neither advantages nor disadvantages."
 santos.691.g: "We need an Altitude Balloon."
 santos.691.h: "Distance is King."
 santos.691.i: "Time is everything!"
 santos.691.j: "A nice All-Round Balloon will do"
 santos.691.k: "Nevermind."

