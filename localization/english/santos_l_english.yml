 je_santos_balloon_adventure: "Balloon Adventure"
 je_santos_balloon_adventure_reason: "During their adventurous journey, balloonists can collect items related to their profession. Archaeologists and ethnologists collect artifacts; naturalists collect specimens and fossils; geologists collect generic and rare materials; meteorologists collect magnetic data, physical data, and oceanographic knowledge; and engineers, on the other hand, return with technical insights.\n\nThere is a #G small chance#! that balloonists will not return alive from their journey."

 santos.502.t: "Balloonist returns from Adventure"
 santos.502.d: "After many months of traveling, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] is back in [GetPlayer.GetNameNoFormatting]. Curious onlookers are eagerly awaiting [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis] return. [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe|U] surely has some exciting stories to tell—and [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]'s brought back some souvenirs!"
 santos.502.f: "Somewhere over the rainbow\nBluebirds fly\nAnd the dreams that you dream of\nDreams really do come true-ooh-ooh\nSomeday I'll wish upon a star\nWake up where the clouds are far behind me\nWhere trouble melts like lemon drops\nHigh above the chimney tops that's where\nYou'll find me, oh"
 santos.502.g: "The balloonist is actually good for something ..."
 santos.503.t: "Balloonist returns with an Animal"
 santos.503.d: "On [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis] latest adventure, our balloonist once again overcame some death-defying challenges. The haul, however, is meager. Instead, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] brought back something else: a new animal friend..."
 santos.503.g: "What a cute little monkey! How adorable!"
 santos.504.g: "What a cute little ermine! How adorable!"
 santos.505.g: "What a cute little ... what the hell is this?"

