 santos.654.f3: "\"That was a cinch!\"\n\n [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloonist_distance_flight_type')]"
 santos.654.g: "Good luck for the next time!"
 santos.654.h: "Good Work!"
 santos.654.i: "Wonderful! Congratulations!"

