 roy_ethnology_tech: "民族学"
 roy_ethnology_tech_desc: "19世紀には、民族学が独立したひとつの学術分野となり、その内容も旅行中に気まぐれに観察するだけのものから、人類の文化とその起源を体系的に研究するものへと生まれ変わりました。進化論の勃興と植民地の拡張に影響されて、初期の民族学者は、世界中の人種を比較する手法をとったり、遺物となる物質を集めたりし、人種の分類を試みました。こうした年月を経たのち、この学問は憶測に基づいて人種間のヒエラルキーを構築するところから距離を置き、より厳格な民族誌学によるフィールドワークを行うようになり、現代の社会人類学に至る下地となったのです。"
 alert_roy_ethnologist_will_retire_soon_alert_name: "[concept_roy_ethnologist] close to retirement"
 alert_roy_ethnologist_will_retire_soon_alert_desc: "Your [concept_roy_ethnologist] is close to retirement. You might want to find a replacement."
 roy_ethnologist_will_retire_soon_alert_setting_name: "#tooltip:[GetRawTextTooltipTag('mr_morgenroete_tt')] @mr_morgenroete_icon! #! [concept_roy_ethnologist] close to retirement"
 alert_roy_ethnologist_will_retire_soon_alert_hint: "Your [concept_roy_ethnologist] will retire sometime in the next #V 5 years#!. You might want to find a new Ethnologist to replace them."
 alert_roy_ethnologist_will_retire_soon_alert_action: "$mr_alert_send_to_science_humanities$"