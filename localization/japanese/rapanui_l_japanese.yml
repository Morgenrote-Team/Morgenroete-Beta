 rapanui_destination_oceania_tt: "#b オセアニア#!は世界でもっとも謎の多い地域の一つです。ごくわずかな者だけがかつてそこを旅しました。[concept_dubois_pacific_expedition]は間違いなく我々の地図上の空白を埋める手助けをしてくれることでしょう。"
 rapanui_destination_australia_tt: "他の目的地とは異なり、#b オーストラリアとニュージーランド#!は、オーストラリアの内陸部の広大な砂漠がその多くを占めています。[concept_dubois_pacific_expedition]にとっては幸運なことに、その沿岸部は幅広い種類の気候、植物、動物が特徴となっています。"
 rapanui_destination_indonesia_tt: "#b インドネシアとマレーシア#!はジャングルで覆われ、未知の種で満ちています。[concept_dubois_pacific_expedition]を遣わせてこの地域の謎を解き明かしましょう。"
