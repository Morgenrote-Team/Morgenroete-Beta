 rapanui_pacific_expedition_decision: "Expedition to the Pacific"
 rapanui_pacific_expedition_decision_desc: "北極や南極と並んで、太平洋は未だ地球が謎を秘めている最後の領域の一つである。複数の学術分野の学者が博物学的、古生物学的、天文学的ならびに海洋学的な調査の実行に関心を示しており、加えて列強にとっては、世界の端にあっても影響力を有しているのを示すことは国威に関わることになりうる。"
