l_japanese:
 glossary_curie_complex_analysis: "$curie_complex$ $curie_analysis$"
 glossary_curie_complex_analysis_desc: "#b;italic $glossary_curie_complex_analysis$#!は、実数と虚数を組み合わせた複素数上で定義される関数を研究する数学の一分野である。波動パターン、流体力学、電気回路などを解析するために物理学や工学で広く用いられている。"
 glossary_curie_differential_equation: "$curie_differential$ $curie_equation$"
 glossary_curie_differential_equation_desc: "#b;italic $glossary_curie_differential_equation$#!は、関数とその変化率を結びつける方程式である。時間や空間とともに物理量がどのように変化するかを記述するため、惑星の運動、人口増加、気候システム、熱伝導などをモデル化するうえで不可欠となっている。"
 glossary_curie_fourier_analysis: "$mr_fourier$-$curie_analysis$"
 glossary_curie_fourier_analysis_desc: "#b;italic $glossary_curie_fourier_analysis$#!は、複雑な信号、波動、あるいは関数を単純な正弦波と余弦波の成分に分解する手法である。現代の信号処理、画像圧縮、音声ストリーミング、および電気通信の基礎を成している。"
 glossary_curie_non_euclidean_geometry: "非ユークリッド$curie_geometry$"
 glossary_curie_non_euclidean_geometry_desc: "#b;italic $glossary_curie_non_euclidean_geometry$#!は、平らではない曲面を基礎とし、平行線が交わったり離れたりし得る幾何学を扱う分野である。球面幾何学は惑星の湾曲した表面をモデル化し、双曲幾何学は一般相対性理論における時空の解明に役立っている。"
 glossary_curie_group_theory: "群$curie_theory$"
 glossary_curie_group_theory_desc: "#b;italic $glossary_curie_group_theory$#!は、対称性と変換を捉える代数的構造を研究する分野である。幾何学的図形、化学分子、素粒子、そして暗号アルゴリズムにおける対称性を解析するための厳密な言語を提供する。"
 glossary_curie_linear_algebra: "線形代数学"
 glossary_curie_linear_algebra_desc: "#b;italic $glossary_curie_linear_algebra$#!は、ベクトル空間、ベクトル、および行列を研究する数学の一分野である。3Dコンピュータグラフィックス、機械学習アルゴリズム、量子力学、そして大規模データ解析の中核的な数学的基盤を提供している。"
 glossary_curie_abstract_algebra: "抽象代数学"
 glossary_curie_abstract_algebra_desc: "#b;italic $glossary_curie_abstract_algebra$#!は、具体的な数値ではなく、群・環・体などの代数的構造を研究する分野である。その根底にある規則や対称性を解明し、現代の暗号理論、符号理論、および理論物理学の基礎を成している。"
 glossary_curie_navier_stokes_equations: "ナビエ–ストークス方程式"
 glossary_curie_navier_stokes_equations_desc: "#b;italic $glossary_curie_navier_stokes_equations$#!は、流体の運動を記述する一連の偏微分方程式である。粘性流体の挙動をモデル化するものであり、天気予報、海流予測、空気力学、およびパイプラインのシミュレーションに不可欠となっている。"
 glossary_curie_mathematical_logic: "数理論理学"
 glossary_curie_mathematical_logic_desc: "#b;italic $glossary_curie_mathematical_logic$#!は、数学に応用された形式論理学を研究する分野である。証明体系、真理、および計算の限界を解析し、ソフトウェア設計や人工知能の理論的基盤となっている。"
 glossary_curie_analytical_number_theory: "解析的整数$curie_theory$"
 glossary_curie_analytical_number_theory_desc: "#b;italic $glossary_curie_analytical_number_theory$#!は、連続的な微積分学や複素解析の手法を用いて整数に関する問題を解く数学の一分野である。主に素数の分布、保型形式、および加法的数論のパターンに焦点を当てている。"
 glossary_curie_algebraic_number_theory: "代数的整数$curie_theory$"
 glossary_curie_algebraic_number_theory_desc: "#b;italic $glossary_curie_algebraic_number_theory$#!は、抽象代数学の手法を応用して整数や代数的数を研究する数学の一分野である。数体における因数分解の問題を解明し、楕円曲線暗号をはじめとする現代の公開鍵暗号方式を支えている。"
 glossary_curie_em_field_equations: "電磁場方程式"
 glossary_curie_em_field_equations_desc: "#b;italic $glossary_curie_em_field_equations$#!は、マクスウェル方程式として知られる一連の偏微分方程式であり、電場と磁場が物質とどのように相互作用するかを記述するものである。電磁波、光、電気回路、および無線通信の原理を説明する。"
 glossary_curie_set_theory: "集合$curie_theory$"
 glossary_curie_set_theory_desc: "#b;italic $glossary_curie_set_theory$#!は、集合と呼ばれる対象の集まりを研究する数学の基礎分野である。無限、関係、関数といった基本概念を確立し、現代の数理論理学のほぼすべてにおける構造的基盤を成している。"
 glossary_curie_topology: "位相幾何学"
 glossary_curie_topology_desc: "#b;italic $glossary_curie_topology$#!は、引き伸ばしや曲げといった連続変形のもとでも、引き裂かれない限り不変に保たれる空間的性質を研究する分野である。ネットワーク解析、データ解析、および物性物理学に応用されている。"
 glossary_curie_functional_analysis: "関数解析学"
 glossary_curie_functional_analysis_desc: "#b;italic $glossary_curie_functional_analysis$#!は、無限次元ベクトル空間とその間の変換を研究する数学の一分野である。線形代数学を微分積分学へと拡張するものであり、量子力学や微分方程式の数学的枠組みを提供している。"
 glossary_curie_lie_theory: "リー$curie_theory$"
 glossary_curie_lie_theory_desc: "#b;italic $glossary_curie_lie_theory$#!は、連続的な対称性と幾何学的変換を研究する分野である。微分積分学と抽象代数学を結びつけて連続運動を記述するものであり、量子力学や一般相対性理論において不可欠な役割を果たしている。"
 glossary_curie_representation_theory: "表現$curie_theory$"
 glossary_curie_representation_theory_desc: "#b;italic $glossary_curie_representation_theory$#!は、抽象的な代数的構造を線形ベクトル空間上の具体的な演算へと翻訳する数学の一分野である。複雑な代数的対称性を行列によって研究することを可能にし、素粒子物理学や化学における諸問題を簡略化する。"
 glossary_curie_algebraic_topology: "代数的位相幾何学"
 glossary_curie_algebraic_topology_desc: "#b;italic $glossary_curie_algebraic_topology$#!は、抽象代数学の手法を用いて位相空間や連続的な図形を研究する分野である。幾何学的な形状の特徴を代数的不変量へと変換することで、データ解析などにも役立てられている。"
 glossary_curie_class_field_theory: "類体$curie_theory$"
 glossary_curie_class_field_theory_desc: "#b;italic $glossary_curie_class_field_theory$#!は、数体のアーベル拡大を記述する代数的整数論の主要分野である。算術的性質を相互法則と結びつけるものであり、高度な整数論や現代の数論幾何学の基盤となっている。"
 glossary_curie_relativity_theory: "相対性$curie_theory$"
 glossary_curie_relativity_theory_desc: "#b;italic $glossary_curie_relativity_theory$#!は、重力・空間・時間を記述する基礎物理学の枠組みである。時間と空間が「時空」として不可分に結びついており、大質量天体がその構造を歪めることを示し、天体物理学や衛星測位の基盤となっている。"
 glossary_curie_quantum_mechanics: "量子力学"
 glossary_curie_quantum_mechanics_desc: "#b;italic $glossary_curie_quantum_mechanics$#!は、原子および素粒子スケールにおける自然現象を記述する物理理論である。古典的な決定論を確率論へと置き換えることで、粒子と波動の二重性や量子もつれといった現象を説明し、半導体や量子コンピューティングの基盤となっている。"
 glossary_curie_proof_theory: "証明$curie_theory$"
 glossary_curie_proof_theory_desc: "#b;italic $glossary_curie_proof_theory$#!は、数学的証明を形式的な数学的対象として扱う数理論理学の一分野である。証明の構造、無矛盾性、および証明可能性の限界を解析する。"
 glossary_curie_cryptography: "暗号学"
 glossary_curie_cryptography_desc: "#b;italic $glossary_curie_cryptography$#!は、数学的な符号や暗号を用いて、不正アクセスから通信を保護する科学である。"
 glossary_curie_algorithm_theory: "アルゴリズム$curie_theory$"
 glossary_curie_algorithm_theory_desc: "#b;italic $glossary_curie_algorithm_theory$#!は、計算問題を解くための体系的かつ段階的な手順を扱う数学の一分野である。紙と鉛筆による計算を起点として定式化され、どのような問題が有限回の手順で解けるのかを見極めるために機械的な規則を解析する。"
 glossary_curie_lambda_calculus: "ラムダ計算"
 glossary_curie_lambda_calculus_desc: "#b;italic $glossary_curie_lambda_calculus$#!は、数学的関数や変数の束縛、および代入を研究するために1930年代に導入された形式論理体系である。純粋論理学と数学における決定可能性および形式的推論の基礎的な限界を探求するために考案された。"