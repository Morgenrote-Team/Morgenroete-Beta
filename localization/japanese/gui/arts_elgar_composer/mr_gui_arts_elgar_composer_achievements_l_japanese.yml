 elgar_composer_achievements_intro_loc: "#V この作曲家の実績#!\n #indent_newline:3 • [Scope.GetCharacter.GetFullName]は[Scope.Var('elgar_composer_experience').GetValue|V0]の評価を得ている作曲家です。#!\n#indent_newline:3 •[Scope.GetCharacter.GetSheHe]はこれまでに[Scope.Var('elgar_composer_num_tours_var').GetValue|V0]回の公演を終えました。#!\n#indent_newline:3 •[Scope.GetCharacter.GetHerHis]の数多の楽曲のうち、[Scope.Var('elgar_composer_num_compositions_var').GetValue|V0]が特に際立っています。#!"
