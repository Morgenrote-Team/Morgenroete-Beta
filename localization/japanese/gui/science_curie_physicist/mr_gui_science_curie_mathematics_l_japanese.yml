 CURIE_EXPERIMENT_ITEM_COUNTRY: "[Scope.Var('discovering_country').GetCountryDefinition.GetName]"
 CURIE_EXPERIMENT_ITEM_INVENTOR: "[Scope.Var('discoverer').GetFlagName]"
 CURIE_EXPERIMENT_ITEM_YEAR: "[Scope.Var('year').GetValue]"
 CURIE_EXPERIMENT_YOUNG_NAME: "$mr_young$"
 CURIE_EXPERIMENT_ORSTED_NAME: "$mr_orsted$"
 CURIE_EXPERIMENT_YOUNG_TT: "[Scope.Var('year').GetValue]年、[Scope.Var('discoverer').GetFlagName]は細いスリットを通して光をスクリーンに照射させ、その結果明暗の干渉縞が生じたことで、光が波としての性質を持つことを証明し、アイザック・ニュートンによる光の粒子説という定説を覆すことになった。"
 CURIE_EXPERIMENT_ORSTED_TT: "[Scope.Var('year').GetValue]年、[Scope.Var('discoverer').GetFlagName]は方位磁針の上に通電したワイヤーを通した。方位磁針の針にふれが生じたことで、電気が磁場を生じさせることを突き止め、電磁気学の統一理論を成立させた。"
 CURIE_EXPERIMENT_JOULES_TT: "[Scope.Var('year').GetValue]年、[Scope.Var('discoverer').GetFlagName]は断熱された水中の外車を回転させるため、おもりを落下させた。その結果、水温が上昇し、機械の運動が直接熱に転換されたことが示され、エネルギー保存の法則を打ち立てた。"
 CURIE_EXPERIMENT_DOPPLER_TT: "[Scope.Var('year').GetValue]年、[Scope.Var('discoverer').GetFlagName]は、進行中の列車の中でトランペットを演奏させ、ドップラー効果を確かめたところ、列車が通過した際に音程の変化がみられた。これによってドップラー効果の存在が裏付けられ、物体の動きが音の周波数を変化させることを証明した。"
 CURIE_EXPERIMENT_FOUCAULT_TT: "[Scope.Var('year').GetValue]年、[Scope.Var('discoverer').GetFlagName]は長いワイヤーから重い振り子を吊り下げた。振動面が床面に対して徐々に回転していったことで、天体観測なしに地球の自転を直接、視覚的に示した。"
 CURIE_EXPERIMENT_FIZEAU_TT: "[Scope.Var('year').GetValue]年、[Scope.Var('discoverer').GetFlagName]は回転する歯車の歯の間を通した光を、離れた鏡に反射させた。反射した光が一定速度で回転した歯に遮られて見えなくなったことで、地上での初の光速測定が成し遂げられた。"
 CURIE_EXPERIMENT_WEBER_TT: "[Scope.Var('year').GetValue]年、[Scope.Var('discoverer').GetFlagName]はライデン瓶と検流計を用いて電荷を測定した。静電単位と電磁単位の比から光速を導出し、光の電磁学的性質を明らかにした。"
 CURIE_EXPERIMENT_MICHELSON_TT: "[Scope.Var('year').GetValue]年、[Scope.Var('discoverer').GetFlagName]は高感度干渉計を用いて光を互いに直行するように分割した。予期された干渉縞のずれが起こらなかったことで、光のエーテル説を反証し、特殊相対性理論への道を開いた。"
 CURIE_EXPERIMENT_HERTZ_TT: "[Scope.Var('year').GetValue]年、[Scope.Var('discoverer').GetFlagName]は火花放電を発生させる電気回路を用いて、目視できない電波を検知した。光と電波の速度や性質が共通していることを証明し、マクスウェルによる電磁気の理論を裏付けるとともに、無線通信をもたらした。"
 CURIE_EXPERIMENT_THOMSON_TT: "[Scope.Var('year').GetValue]年、[Scope.Var('discoverer').GetFlagName]は真空管内の電場および磁場によって、陰極線を偏向させた。電荷対質量比を測定したところ、負の素粒子、つまり電子の存在を証明し、原子がそれ以上分割不可能だという考えを否定した。"
 CURIE_EXPERIMENT_MILIKAN_TT: "[Scope.Var('year').GetValue]年、[Scope.Var('discoverer').GetFlagName]は二つの金属電極の間で帯電させた油滴を浮遊させ、重力とクーロン力のバランスをとることで、電荷が一定の割合で素量化されていることを証明し、電気素量の測定を可能にした。"
 CURIE_EXPERIMENT_RUTHERFORD_TT: "[Scope.Var('year').GetValue]年、[Scope.Var('discoverer').GetFlagName]は薄い金箔にアルファ線を当て、思いがけず大きく跳ね返るものがあったことを発見しました。これによって原子の質量とプラスの電荷が原子の中心に位置する小さな核に集中していることを突き止め、ブドウパンモデルを置き換えました。"
 CURIE_EXPERIMENT_FRANCK_TT: "[Scope.Var('year').GetValue]年、[Scope.Var('discoverer').GetFlagName]は加速した電子を水銀の水蒸気に通し、特定の電圧下で周期的に電流が降下したことで、原子が離散的な量子からエネルギーを受け取ることを証明し、ボーアの量子的なエネルギー準位の原子モデルを確証しました。"
 CURIE_EXPERIMENT_EDDINGTON_TT: "[Scope.Var('year').GetValue]年、[Scope.Var('discoverer').GetFlagName]は皆既日食の際に太陽附近の星を撮影し、星の光が太陽の重力で曲げられたことが、一般相対性理論を実証する初めての証拠となりました。"
 CURIE_EXPERIMENT_STERN_TT: "[Scope.Var('year').GetValue]年、[Scope.Var('discoverer').GetFlagName]は銀原子を不均一な磁場に送り込むと、そのビームは連続体ではなく2本に分かれ、このことから空間量子化を証明し、電子にスピンがあることを発見しました。"
