 MR_PHYSICIST_MATHEMATICAL_INNOVATION_BUTTON: "数学的革新"
 MR_PHYSICIST_MATHEMATICAL_INNOVATION_BUTTON_TT: "#T 数学的革新#!\nこのプロジェクトは[concept_curie_mathematical_physicist]が多忙でない時に可能になる。\n\n[concept_curie_physicist]が週次の最大革新を増加させ、時代に先行する技術のペナルティを減少させる。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_FORMULA_DISCOVERY_BUTTON: "新たな公式"
 MR_PHYSICIST_FORMULA_DISCOVERY_BUTTON_TT: "#T 新たな公式#!\n適切な技術が研究済みであり、かつ未だ解明されていない公式がある場合、数学者は新たな公式を導出することができる。新たな公式が見つかると、調査すべき物理学データの量が増加する。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_IMPROVE_MATHEMATICS_BUTTON: "数学の改良"
 MR_PHYSICIST_IMPROVE_MATHEMATICS_BUTTON_TT: "#T 数学の改良#!\n数学者は[GetBuildingType('building_university').GetName]を訪れ、講義や演習を通して新たな科学的基準を広めることができる。\n\n施設が受け取る補正は:\n$curie_building_throughput_add_modifier_with_tooltip$\n$curie_building_production_mult_modifier_with_tooltip$\n$curie_building_goods_input_mult_modifier_with_tooltip$\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_EXPERIMENT_BUTTON: "物理学の実験"
 MR_PHYSICIST_EXPERIMENT_BUTTON_TT: "#T 物理学の実験#!\n物理学者は実験を行うことができ、仮に成功すれば歴史に残る結果を得られるかもしれない。どのタイプの物理学者も実験を行うことができる。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_EXPERIMENT_POSSIBLE_TRIGGER_TT: "#default_text [GetPlayer.GetName]が#V $curie_physics_experiment_successful_modifier$#!あるいは#V $curie_physics_experiment_failure_modifier$#![concept_modifier]を有して#R いない#!。"
 MR_PHYSICIST_METEOROLOGICAL_OBSERVATION_BUTTON: "気象学的観測"
 MR_PHYSICIST_METEOROLOGICAL_OBSERVATION_BUTTON_TT: "#T 気象学的観測#!\n[Concept('concept_curie_meteorology','$je_curie_meteorological_observation|q$')]は[concept_curie_meteorological_physicist]が多忙でない時に可能となる。\n\n[concept_curie_physicist]が年次の@curie_physical_data!#![concept_curie_physical_data]獲得量を増加させる。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_WEATHER_STATION_EXPANSION_BUTTON: "気象観測所の拡張"
 MR_PHYSICIST_WEATHER_STATION_EXPANSION_BUTTON_TT: "#T 気象観測所の拡張#!\n天文台および適切な技術がある場合、[concept_curie_meteorological_physicist]はそこで気象観測所を拡張し、国家全体の天気予報の精度を向上させ、深刻な悪天候の際には早期に警報を発出することができるようになる。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 PHYSICIST_HAS_NO_WEATHER_STATION_PM_TT: "#default_text [GetPlayer.GetName]に#V $pm_curtiss_no_weather_station$#![concept_production_method]の[GetBuildingType('building_verrier_observatory').GetName]が存在する"
 PHYSICIST_HAS_EARLY_WEATHER_STATION_PM_TT: "#default_text [GetPlayer.GetName]に#V $pm_curtiss_early_weather_station$#![concept_production_method]の[GetBuildingType('building_verrier_observatory').GetName]が存在する"
 PHYSICIST_HAS_WEATHER_STATION_PM_TT: "#default_text [GetPlayer.GetName]に#V $pm_curtiss_weather_station$#![concept_production_method]の[GetBuildingType('building_verrier_observatory').GetName]が存在する"
 MR_PHYSICIST_IMPROVE_METEOROLOGY_BUTTON: "気象観測網"
 MR_PHYSICIST_IMPROVE_METEOROLOGY_BUTTON_TT: "#T 気象観測網#!\n電信の登場によって、気象学は素晴らしい進展を遂げている。瞬く間に国中から気象データを受信し、それらを照らし合わせることができるようになったのだ。それによって、気象予報や警報の発出ができるようになった。[concept_curie_meteorological_physicist]は[GetBuildingType('building_tesla_telegraph').GetName]のあるステートに気象観測所を設置し、広範な気象現象への対処が可能となる。\n\n次の補正を施設に付与する:\n$curie_building_throughput_add_modifier_with_tooltip$\n$curie_building_production_mult_modifier_with_tooltip$\n$curie_building_goods_input_mult_modifier_with_tooltip$\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_IMPROVE_METEOROLOGY_TRIGGER_TT: "#default_text 上記の3つの[Concept('concept_modifier','$concept_modifiers|q$')]を一つでも持たない、レベル1以上の[GetBuildingType('building_tesla_telegraph').GetName]施設が少なくとも一つ存在する#!"
 MR_PHYSICIST_AGRICULTURAL_WEATHER_SERVICE_BUTTON: "農業用気象サービス"
 MR_PHYSICIST_AGRICULTURAL_WEATHER_SERVICE_BUTTON_TT: "#T 農業用気象サービス#!\n[concept_curie_meteorological_physicist]は農業部門向けの天気予報に職域を狭め、農家向けの気象サービスを立ち上げ、3年間の間気象イベントの発生を警告することができる。気象学者の経験量が多いほど、結果は改善される。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_ADVANCED_WEATHER_STATION_TRIGGER_TT: "#default_text [GetPlayer.GetName]に#V $pm_curtiss_weather_station$#!あるいは$pm_curtiss_modern_weather_station$[concept_production_method]の[GetBuildingType('building_verrier_observatory').GetName]が存在する"
 MR_PHYSICIST_50_OR_MORE_EXPERIENCE_TRIGGER_TT: "#default_text [concept_curie_meteorological_physicist]が#V 50以上#!の[concept_academics_experience]を有している#!"
 MR_PHYSICIST_MARINE_WEATHER_SERVICE_BUTTON: "海洋気象予報"
 MR_PHYSICIST_MARINE_WEATHER_SERVICE_BUTTON_TT: "#T 海洋気象予報#!\n[concept_curie_meteorological_physicist]は海軍向けの気象予報に職域を狭め、海で発生する危険を警告することができる。このプロジェクトは3年を要する。気象学者の経験量が多いほど、結果は改善される。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_5_FLOTILLAS_TRIGGER_TT: "#default_text [GetPlayer.GetName]が#V 5以上の艦船#!を有している#!"
 MR_PHYSICIST_FOUND_MAGNETIC_ASSOCIATION_BUTTON: "磁気協会"
 MR_PHYSICIST_FOUND_MAGNETIC_ASSOCIATION_BUTTON_TT: "#T 磁気協会の設立#!\n国際的な磁気協会は、地磁気の研究に専念し、特に設立者が物理学のデータを収集する際に数々のアドバンテージを提供したり、小さな技術ボーナスを与えたりする。生産方式としての地磁気観測所も解禁する。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_MAGNETIC_RESEARCH_STATION_BUTTON: "地磁気観測所"
 MR_PHYSICIST_MAGNETIC_RESEARCH_STATION_BUTTON_TT: "#T 地磁気観測所の設立#!\n天文台を拡張して地磁気観測所を組み込み、非常に詳細な地球の磁場の調査を行うことができるようにする。磁気協会への加入が必要。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_NO_MAGNETIC_OBSERVATORY_TRIGGER_TT: "#default_text [GetPlayer.GetName]に#V 地磁気観測所なし#![concept_production_method]の[GetBuildingType('building_verrier_observatory').GetName]が存在する"
 MAGNETIC_ASSOCIATION_TRIGGER_TT: "#default_text 磁気協会が設立されている#!"
 MR_NO_MAGNETIC_ASSOCIATION_TRIGGER_TT: "#default_text 磁気協会が#R まだ#!設立されていない"
 MR_PHYSICIST_MAGNETIC_ATLAS_BUTTON: "磁気図"
 MR_PHYSICIST_MAGNETIC_ATLAS_BUTTON_TT: "#T 磁気図の作成#!\n我々の広範な地磁気データを活かし、物理学者は磁気図を編纂できるかもしれない。このような業績によって物理学への理解は大いに深まるだろう。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_MAGNETIC_OBSERVATORY_TRIGGER_TT: "#default_text [GetPlayer.GetName]に#V 地磁気観測所#![concept_production_method]の[GetBuildingType('building_verrier_observatory').GetName]が存在する"
 MR_PHYSICIST_15_MAGNETIC_DATA_TRIGGER_TT: "#default_text [GetPlayer.GetName]が少なくとも#V 15#!の@curie_magnetic_data![concept_curie_magnetic_data]を有している#!"
 MR_PHYSICIST_FORMULA_PHYSICAL_DATA_TRIGGER_TT: "#default_text [GetPlayer.GetName]が少なくとも#V [GetPlayer.MakeScope.ScriptValue('curie_formula_cost_value')]#!の@curie_physical_data![concept_curie_physical_data]を有している#!"
 MR_PHYSICIST_FORMULA_POSSIBLE_TRIGGER_TT: "#default_text 現在の技術によって、未知の数式を少なくとも一つ研究することができる#!"
 MR_PHYSICIST_IMPROVE_MATHEMATICS_TRIGGER_TT: "#default_text 上記の3つの[Concept('concept_modifier','$concept_modifiers|q$')]を一つでも持たず、かつ#O 数理工学専攻#!のレベル1以上の[GetBuildingType('building_university').GetName]施設が少なくとも一つ存在する#!"
 GEOMAGNETIC_RESEARCH_VAR: "#tooltip:[GetRawTextTooltipTag('GEOMAGNETIC_RESEARCH_VAR_TT')] @curie_magnetic_data!  [GetPlayer.MakeScope.GetVariable('curie_magnetic_data_var').GetValue|0+] / [GetGlobalVariable('curie_total_magnetic_data_global_var').GetValue|V0] #!"
 GEOMAGNETIC_RESEARCH_VAR_TT: "#header 地磁気データ#!\n#V 全国家#!によって収集された@curie_magnetic_data_var![concept_curie_magnetic_data]は[GetGlobalVariable('curie_total_magnetic_data_global_var').GetValue|V0]であり、そのうち[GetPlayer.GetName]の発見した@curie_magnetic_data![concept_curie_magnetic_data]は[GetPlayer.MakeScope.GetVariable('curie_magnetic_data_var').GetValue|0+]である。"
 MATHEMATICAL_INNOVATION_VAR: "#tooltip:[GetRawTextTooltipTag('MATHEMATICAL_INNOVATION_VAR_TT')] @curie_mathematical_innovation!  [GetPlayer.MakeScope.GetVariable('curie_national_mathematical_innovation_var').GetValue|0+] / [GetGlobalVariable('curie_international_mathematical_innovation_global_var').GetValue|V0] #!"
 MATHEMATICAL_INNOVATION_VAR_TT: "#header 数学的革新#!\n[GetPlayer.GetName]は@curie_mathematical_innovation![GetPlayer.MakeScope.GetVariable('curie_national_mathematical_innovation_var').GetValue|0+]の数学的革新を一国で生み出し、対して#V 全国家#!による世界中の数学的革新は@curie_mathematical_innovation![GetGlobalVariable('curie_international_mathematical_innovation_global_var').GetValue|V0]である。"
 CLOUDS_VAR: "#tooltip:[GetRawTextTooltipTag('CLOUDS_VAR_TT')] @curie_clouds!  [GetPlayer.MakeScope.GetVariable('curie_discovered_clouds_country_number_var').GetValue|V0] / [GetGlobalVariable('curie_discovered_clouds_global_number_var').GetValue|V0] #!"
 CLOUDS_VAR_TT: "#header 雲#!\n[GetPlayer.GetName]は@curie_clouds![GetGlobalVariable('curie_discovered_clouds_global_number_var').GetValue|V0]中の@curie_clouds![GetPlayer.MakeScope.GetVariable('curie_discovered_clouds_country_number_var').GetValue|V0]の[Concept('concept_curie_meteorology','$concept_curie_clouds|q$')]を記述した。"
 MR_CURIE_BUILDING_CHOOSER_MATHEMATICS_MULTIPLE_HEADER: "数学の改良プロジェクト"
 MR_CURIE_BUILDING_CHOOSER_METEOROLOGY_MULTIPLE_HEADER: "気象学の改良プロジェクト"
