 MR_ROCKETRY: "ロケット工学"
 VISIT_ROCKETRY_BUTTON: "ロケット科学"
 VISIT_ROCKETRY_BUTTON_TT: "#T ロケット科学#!\nここでロケット研究の概要と、物理学における最重要な実績を確認できる。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 ROCKET_SCIENCE_HEADER_TEXT: "ロケット科学"
 mr_rocket_equation: "ロケット方程式"
 MR_ROCKET_EQUATION_ACTIVE_TT: "ロケット方程式が研究されている。"
 MR_ROCKET_EQUATION_INACTIVE_TT: "#T ロケット方程式#!\nロケット方程式は近代のロケット科学の歴史的な土台の一つであり、ロシア人のロケットの先駆者であるコンスタンチン・ツィオルコフスキーに因んで名付けられた、ツィオルコフスキーの公式という名でも知られている。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 mr_spaceflight_theory: "宇宙飛行理論"
 mr_rocket_association: "ロケット協会"
 mr_liquid_fuelled_rocket: "液体燃料ロケット"
 VISIT_NUCLEAR_PHYSICS_BUTTON: "原子物理学"
 VISIT_NUCLEAR_PHYSICS_BUTTON_TT: "#T 原子物理学#!\nここで原子物理学研究の概要と、物理学における最重要な実績を確認できる。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_DECISION_PROBLEM_BUTTON: "決定問題を解く"
 MR_PHYSICIST_DECISION_PROBLEM_BUTTON_TT: "#T 決定問題を解く#!\n全ての数学に関する意見の中から、証明可能なものを見つける数学的な手立てはあるのだろうか？長きにわたって数学の議題となってきたこの疑問に答えるために、数学者は思考実験を通じて解決策を探ることができる。数学者の能力によって必要とする時間が異なる。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ALL_FORMULAS_DISCOVERED_TRIGGER_TT: "#default_text 全ての[Concept('concept_curie_mathematics','$concept_curie_mathematical_formulas|q$')]が導出された#!"
 MR_PHYSICIST_100_PHYSICAL_DATA_TRIGGER_TT: "#default_text [GetPlayer.GetName]が少なくとも#V 100#!の@curie_physical_data![concept_curie_physical_data]を有している#!"
 MR_PHYSICIST_RADIOSONDE_BUTTON: "ラジオゾンデの建造"
 MR_PHYSICIST_RADIOSONDE_BUTTON_TT: "#T ラジオゾンデの建造#!\nラジオゾンデは気象学と航空学で用いられる、高度20kmないし35kmの成層圏で、地球大気の諸要素を測定するための器具である。気象観測気球に搭載され、気温とその変化、湿度などの計測結果を、無線で地上の気象局へと送信することができる。このようなラジオゾンデは気象予報をかつてないほど正確なものにしてくれるだろう！\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_HAS_MODERN_WEATHER_STATION_TRIGGER_TT: "#default_text [GetPlayer.GetName]に$pm_curtiss_modern_weather_station$[concept_production_method]方式の[GetBuildingType('building_verrier_observatory').GetName]が存在する"