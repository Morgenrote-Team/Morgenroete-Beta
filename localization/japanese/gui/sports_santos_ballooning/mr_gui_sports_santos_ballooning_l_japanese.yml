 santos_time_bonus_fuel_helium_inactive_tt_loc: "\n#default_text 8 Hours for Helium.#!"
 MR_RIP_PANEL: "#underline #T Rip Panel#!#!: [GetPlayer.GetCustom('santos_logistics_researched_type')] [GetTechnology('logistics').GetName]"
 MR_RIP_PANEL_TT: "#header Rip Panel#!\nA rip panel is a built-in, tear-away section of a balloon's envelope that the pilot pulls open upon landing to rapidly release the lifting gas and prevent the balloon from being dragged across the ground.\n\nAltitude Bonus: #p +500 Meters#!\n[concept_santos_stratospheric_flight]: #p Lower probability#! of Slow Ascent"
 MR_BAGS_OF_FINE_SAND: "#underline #T Bags of Fine Sand#!#!: [GetPlayer.GetCustom('santos_military_statistics_researched_type')] [GetTechnology('military_statistics').GetName]"
 MR_BAGS_OF_FINE_SAND_TT: "#header Bags of Fine Sand#!\nThe increasingly precise weighting of the balloon's load and the switch to finer-grained sand allow for greater precision in controlling a balloon's ascent.\n\nAltitude Bonus: #p +500 Meters#!\n[concept_santos_stratospheric_flight]: #p Lower probability#! of Slow Ascent"
 MR_OXYGEN_CYLINDERS: "#underline #T Oxygen Cylinders#!#!: [GetPlayer.GetCustom('santos_electric_arc_process_researched_type')] [GetTechnology('electric_arc_process').GetName]"
 MR_OXYGEN_CYLINDERS_TT: "#header Oxygen Cylinders#!\nThanks to new soldering techniques and the resulting improved storage of gas, the oxygen cylinder was also invented, enabling balloonists to reach previously unknown heights—including those that had previously meant certain death.\n\nAltitude Bonus: #p +500 Meters#!\n[concept_santos_balloon_record]: Protects #p against altitude sickness#!"
 MR_TRAIL_ROPE: "#underline #T Trail Rope#!#!: [GetPlayer.GetCustom('santos_mechanical_tools_researched_type')] [GetTechnology('mechanical_tools').GetName]"
 MR_TRAIL_ROPE_TT: "#header Trail Rope#!\nA trail rope (or guide rope) is a long, heavy cable suspended beneath a balloon that drags along the ground to automatically regulate altitude—reducing weight as more rope rests on the earth during descent and adding weight as it lifts off during ascent—while also slowing the balloon before landing.\n\nDistance Bonus: #p +200 Kilometers#!\n[concept_santos_stratospheric_flight]: #p Lower probability#! of Slow Ascent"
 MR_CANNED_FOOD: "#underline #T Canned Food#!#!: [GetPlayer.GetCustom('santos_canneries_researched_type')] [GetTechnology('canneries').GetName]"
 MR_CANNED_FOOD_TT: "#header Canned Food#!\nWith enough provisions, a balloonist can stay aloft longer. Canned food also has the advantage of taking up very little space in the balloon basket and stacking up very well.\n\nDistance Bonus: #p +200 Kilometers#!\n[concept_santos_stratospheric_flight]: #p Lower probability#! of Slow Ascent"
 MR_RUBBERIZED_FABRICS: "#underline #T Rubberized Fabrics#!#!: [GetPlayer.GetCustom('santos_rubber_mastication_researched_type')] [GetTechnology('rubber_mastication').GetName]"
 MR_RUBBERIZED_FABRICS_TT: "#header Rubberized Fabrics#!\nRubber fabrics were standard in 19th-century ballooning and increased a balloon's airtightness.\n\nTime Bonus: #p +5 Hours#!"
 MR_VULCANIZED_COTTON: "#underline #T Vulcanized Cotton#!#!: [GetPlayer.GetCustom('santos_vulcanization_researched_type')] [GetTechnology('vulcanization').GetName]"
 MR_VULCANIZED_COTTON_TT: "#header Vulcanized Cotton#!\nBy using vulcanized cotton fabric, balloonists and engineers were able to increase the volume of a balloon and improve its airtightness.\n\nTime Bonus: #p +5 Hours#!"
 MR_VULCANIZED_SILK: "#underline #T Vulcanized Silk#!#!: [GetPlayer.GetCustom('santos_art_silk_researched_type')] [GetTechnology('art_silk').GetName]"
 MR_VULCANIZED_SILK_TT: "#header Vulcanized Silk#!\nVulcanized silk was one of the best options for making balloons suitable for long journeys and was long considered the unbeatable material for balloons.\n\nTime Bonus: #p +5 Hours#!\n[concept_santos_stratospheric_flight]: #p Lower probability#! of Slow Ascent"
 MR_REINFORCED_MATERIAL: "#underline #T Modern Material#!#!: [GetPlayer.GetCustom('santos_reinforced_material_researched_type')] [GetTechnology('art_silk').GetName]&[GetTechnology('vulcanization').GetName]"
 MR_REINFORCED_MATERIAL_TT: "#header Modern Material#!\nAs balloon flights ventured into the stratosphere, the balloon material also reached its limits. Although the methods used up to that point were sufficient for balloon flights to that altitude, they did not become safe until the discovery of polyethylene.\n[concept_santos_balloon_record]: Distance records will be #p significantly improved#! when using hydrogen or helium as fuel\n\n[concept_santos_stratospheric_flight]: Protects #p against Material Fatigue#!"
 MR_SUN_PROTECTION: "#underline #T Sun Protection#!#!: [GetPlayer.GetCustom('santos_sun_protection_researched_type')] [GetTechnology('zeppelins').GetName]&[GetTechnology('curie_rocket_science_tech').GetName]"
 MR_SUN_PROTECTION_TT: "#header Sun Protection#!\nOver time, physicists, engineers, and balloonists learned that the paint and material properties of a stratospheric balloon are crucial for preventing the balloon from overheating and the associated danger.\n\n[concept_santos_stratospheric_flight]: Protects #p against Heat Buildup#!"
 MR_BALLOONIST_HAS_HYDROGEN_OR_HELIUM_BALLOON_TRIGGER_TT: "#default_text [GetPlayer.GetName] has a [concept_santos_balloon] with #BLUE Hydrogen#! or #V Helium#!#!"