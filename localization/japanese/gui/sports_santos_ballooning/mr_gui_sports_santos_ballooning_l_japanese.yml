 MR_BALLOONIST_CHANGE_FUEL_BUTTON: "Change Fuel"
 MR_BALLOONIST_CHANGE_FUEL_BUTTON_TT: "Each type of balloon gas has certain advantages and disadvantages. Coal gas is good for long distances, hydrogen for high altitudes, and helium is particularly useful to prevent accidents."
 MR_BALLOONIST_CHANGE_FUEL_TRIGGER: "#default_text [GetPlayer.GetName] has at least one [GetBuildingType('building_explosives_factory').GetName] with the $pm_brine_electrolysis$ [concept_production_method]\n#R OR#! [GetPlayer.GetName] has a [GetBuildingType('building_mendelejew_helium_plant').GetName].#!"
