 MR_BALLOONIST_BALLOON_RIDE_BUTTON: "気球飛行"
 MR_BALLOONIST_BALLOON_RIDE_BUTTON_TT: "#T 気球飛行#!\n大衆の娯楽のための気球飛行は、[concept_santos_balloonist]にとって最も安全な――その一方で幾分退屈でもある――デフォルトの活動だ。気球の集客力によって特定の建物を強化したり、気球の技術に小さなブーストをもたらしたりすることがある。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_BALLOON_ADVENTURE_BUTTON: "気球による冒険"
 MR_BALLOONIST_BALLOON_ADVENTURE_BUTTON_TT: "#T 気球による冒険#!\n[concept_santos_balloonist]は国境を越えた冒険に乗り出すことができる。数ヶ月の工程の間、たくさんの国々を旅して回り――時には一つか二つの土産を持ち帰る。旅のうちに落命する可能性が少しだけある。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_BALLOON_RECORD_BUTTON: "気球記録"
 MR_BALLOONIST_BALLOON_RECORD_BUTTON_TT: "#T 気球記録#!\n[concept_santos_balloonist]は、自らの資源でこれらの世界記録を打ち破ることができれば、高度・距離・時間の新記録を樹立できる。記録を樹立する過程で落命する可能性がそれなりにある。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_BALLOON_CROSSING_BUTTON: "気球による渡航"
 MR_BALLOONIST_BALLOON_CROSSING_BUTTON_TT: "#T 気球による渡航#!\n[concept_santos_balloonist]は地理的に危険な海峡や山脈を気球で越えることができる。この偉業はすべての冒険者にとっての究極の挑戦と考えられ、こうした試みのうちに落命する可能性がかなりある。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_FIRE_BALLOONIST_TRIGGER_TT: "#default_text [GetPlayer.GetName] does #R not#! have the #V $santos_balloon_contract_modifier$#! [concept_modifier]."
 SANTOS_CROSSING_ITEM_TOOLTIP: "[Scope.Var('tooltip').GetFlagName]"
 SANTOS_CROSSING_ACHIEVED_MARK: "@green_checkmark!"
 SANTOS_CROSSING_CHANNEL_TT: "英仏海峡は広く知られた35から50kmほどの短距離海上横断ルートです。その主な危険要因は予測不可能な沿岸の風と、広い大西洋に突然吹き流されてしまうことにありますが、ブランシャールとグリーンの飛行以来、ここはパイオニア的な気球飛行の実験台として定評のある場所にとどまっています。"
 SANTOS_CROSSING_ALPS_TT: "極めて標高の高い障害物であるアルプスを越えるには、5500から6000メートルの運用可能高度が求められ――これには低酸素症の重大なリスクがある――さらに400ないし600キロメートルの飛行距離を必要とします。思わぬ危険は切り立った岩肌に衝突させかねない凶暴な山岳波や下降気流にあり、こうした危難は1849年にフランシスク・アルバンによって初めて乗り越えられました。"
 SANTOS_CROSSING_SKAGERRAK_TT: "デンマークとスカンジナビア半島を分断するこの海峡には、80ないし130キロメートルの開けた水域があり、2000メートルの巡航高度と400キロメートルの飛行距離を確保する必要がある。気球士は急速に発達する北海の強風に、厳しい寒さ、そして居住に適さないような海岸線に対処する必要があり、気密構造の気嚢と正確な気球の航法が求められる。"
 SANTOS_CROSSING_MEDITERRANEAN_TT: "コルシカ島やシチリア島のような山がちな島々の点在するこの広大な海盆では、島の山頂を飛び越えるための4000メートルの巡航高度と、700キロメートルの飛行距離が求められる。苛酷な熱帯の太陽放射は深刻なガスの膨張をきたし、その一方で海上ではロープを下ろすことができないため、バラストを入念に管理する必要がある。"
 SANTOS_CROSSING_RIO_TT: "アルゼンチンとウルグアイの間のこのとてつもなく広い河口を横断するのには、220キロメートルにもなる水域があるため、2000メートルの巡航高度と300キロメートルの飛行距離が必要だ。主な危険は現地でパンペロと呼ばれている突然のスコールや、海上の深刻な乱気流から生じる。"
 SANTOS_CROSSING_PYRENEES_TT: "フランスとスペインの間の山による障壁となるピレネー山脈には5000メートルの飛行高度を確保するのと、500キロメートルの飛行距離の能力が求められます。標高3000メートルを超す山頂の風下側には凄まじい下降気流が発生するため、壊滅的な墜落を防ぐためには安全のために垂直方向にゆとりを持たせなければなりません。"
 SANTOS_CROSSING_ANDES_TT: "気球航行の最大の障害物であるアンデス山脈越えには、並外れた8000メートルもの飛行性能と、800キロメートルの飛行距離を必要とする。与圧装備なしには飛行士は生命をおびやかす酸素の欠乏や、あまつさえ苦しい寒さや荒れ狂う山風にも直面することになる。"
 SANTOS_CROSSING_KOREA_TT: "韓国と日本の間の180ないし200キロメートルの海上をまたぐこの経路は、2500メートルの高度と250キロメートルの飛行距離を確保する必要がある。中ほどには対馬のような島々が方位を示してくれるが、移り変わる季節風や島のない太平洋に流されることが主要な懸念点となる。"
 SANTOS_CROSSING_BAB_TT: "この紅海南方のチョークポイントは30から40キロメートルほどの開けた海域であるが、その海岸線上の山脈を通過するのには4000メートルの高度と、400キロメートルの飛行距離を確保する必要がある。極端な熱帯性の暑さは気嚢のガスを非常に不安定にし、加えて猛烈な砂漠の熱や予測不可能な下降気流も存在する。"
 SANTOS_KOREA_CROSSING_TT: "#default_text #V 対馬海峡#!は#G 簡単な横断#!と考えられる。\n\n$santos_balloon_crossing_korea_possible_trigger_tt$#!"
 SANTOS_BAB_CROSSING_TT: "#default_text #V バブ・エル・マンデブ海峡#!は#R 難しい横断#!と考えられる\n\n$santos_balloon_crossing_bab_possible_trigger_tt$#!"
