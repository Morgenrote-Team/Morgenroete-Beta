ar('panum_physician_achievement_endoscope_inventor_var').GetFlagName)][AddLocalizationIf( Scope.Var('panum_physician_achievement_ophthalmoscope_inventor_var').IsSet , Scope.Var('panum_physician_achievement_ophthalmoscope_inventor_var').GetFlagName)][AddLocalizationIf( Scope.Var('panum_physician_achievement_chemotherapy_inventor_var').IsSet , Scope.Var('panum_physician_achievement_chemotherapy_inventor_var').GetFlagName)][AddLocalizationIf( Scope.Var('panum_physician_achievement_attended_medical_congress_var').IsSet , Scope.Var('panum_physician_achievement_attended_medical_congress_var').GetFlagName)][AddLocalizationIf( Scope.Var('panum_physician_achievement_anthrax_disease_var').IsSet , Scope.Var('panum_physician_achievement_anthrax_disease_var').GetFlagName)][AddLocalizationIf( Scope.Var('panum_physician_achievement_goiter_disease_var').IsSet , Scope.Var('panum_physician_achievement_goiter_disease_var').GetFlagName)][AddLocalizationIf( Scope.Var('panum_physician_achievement_nephrolithiasis_disease_var').IsSet , Scope.Var('panum_physician_achievement_nephrolithiasis_disease_var').GetFlagName)][AddLocalizationIf( Scope.Var('panum_physician_achievement_pellagra_disease_var').IsSet , Scope.Var('panum_physician_achievement_pellagra_disease_var').GetFlagName)][AddLocalizationIf( Scope.Var('panum_physician_achievement_rickets_disease_var').IsSet , Scope.Var('panum_physician_achievement_rickets_disease_var').GetFlagName)][AddLocalizationIf( Scope.Var('panum_physician_achievement_syphilis_disease_var').IsSet , Scope.Var('panum_physician_achievement_syphilis_disease_var').GetFlagName)][AddLocalizationIf( Scope.Var('panum_physician_achievement_tetanus_disease_var').IsSet , Scope.Var('panum_physician_achievement_tetanus_disease_var').GetFlagName)][AddLocalizationIf( Scope.Var('panum_physician_achievement_hemophilia_disease_var').IsSet , Scope.Var('panum_physician_achievement_hemophilia_disease_var').GetFlagName)][AddLocalizationIf( Scope.Var('panum_physician_achievement_military_medicine_project_finished_var').IsSet , Scope.Var('panum_physician_achievement_military_medicine_project_finished_var').GetFlagName)][AddLocalizationIf( Scope.Var('panum_physician_achievement_inaugurated_asylum_var').IsSet , Scope.Var('panum_physician_achievement_inaugurated_asylum_var').GetFlagName)][AddLocalizationIf( Scope.Var('mendelejew_chemist_achievement_aspirin_inventor_var').IsSet , Scope.Var('mendelejew_chemist_achievement_aspirin_inventor_var').GetFlagName)][AddLocalizationIf( Scope.Var('panum_physician_achievement_basketball_inventor_var').IsSet , Scope.Var('panum_physician_achievement_basketball_inventor_var').GetFlagName)]"
 panum_physician_no_physician_loc: "#V この[concept_panum_physician]]の功績#!を表示する。"
 panum_physician_achievements_intro_loc: "#V この医師の業績#!\n #indent_newline:3 • [Scope.GetCharacter.GetFullName]は優秀な医師である。#!"
 panum_physician_achievement_successful_treatments_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetLastNameNoFormatting]医師は患者の治療に熟練しており、#o [GetPlayer.MakeScope.Var('panum_physician_var').GetVariable('panum_physician_successful_treatments_var').GetValue]人の患者の治療に成功#!している。#!"
 panum_physician_achievement_epidemiologist_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetSheHe|U]は疾病を幅広く研究し、#o $panum_epidemiologist$#!となった。#!"
 panum_physician_achievement_surgeon_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetSheHe|U]は数多くの手術を手がけており、優秀な#o $panum_surgeon$#!と評価されている。#!"
 panum_physician_achievement_psychiatrist_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetLastNameNoFormatting]医師は人間の心を深く研究しており、高名な#o $panum_psychiatrist$#!である。#!"
 panum_physician_achievement_military_physician_loc: "\n #indent_newline:3 • #o $panum_military_physician$#!として戦争の惨禍を目の当たりにしてきた[Scope.GetCharacter.GetSheHe]は、過酷な状況下で人々を治療する術を心得ている。#!"
 panum_physician_achievement_germ_theory_inventor_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetLastNameNoFormatting]医師は#o 病原体説#!を提唱し、すでに数千人もの命を救っている。#!"
 panum_physician_achievement_pneumothorax_inventor_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetHerHim]の最大の発明の一つは、#o 人工気胸を誘発する装置#!である。これにより肺を虚脱させることで、結核の治療に役立てることができる。#!"
 panum_physician_achievement_thoracoplasty_inventor_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetHerHis]の優れた外科技術により、[Scope.GetCharacter.GetLastNameNoFormatting]医師は#o 肺外科に革命をもたらした「胸郭成形術」と呼ばれる術式#!を考案し、結核患者の治療を向上させた。#!"
 panum_physician_achievement_attended_medical_congress_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetSheHe|U]は少なくとも一度#o 医学会#!に参加し、[Scope.GetCharacter.GetHerHis]の見解を共有した。#!"
 mendelejew_chemist_achievement_aspirin_inventor_loc: "\n #indent_newline:3 • [GetPlayer.MakeScope.Var('mendelejew_chemist_var').GetCharacter.GetLastNameNoFormatting]博士は#o アスピリン#!の主要な開発者と見なされており、無数の患者に鎮痛効果をもたらしただけでなく、製薬業界にも革命を起こした。#!"
 panum_physician_achievement_xray_inventor_loc: "\n #indent_newline:3 • #o X線#!の発見により、[GetPlayer.MakeScope.Var('curie_physicist_var').GetCharacter.GetLastNameNoFormatting]博士は医学と物理学の双方に等しく革命をもたらした世界有数の物理学者の一人と見なされている。#!"
 panum_physician_achievement_bloodtypes_inventor_loc: "\n #indent_newline:3 • #o A型、B型、AB型、0型という異なる血液型#!の発見により、[Scope.GetCharacter.GetLastNameNoFormatting]医師は血液そのものへの理解を深め、輸血の成功率を高めるうえで重要な役割を果たした。#!"
 panum_physician_achievement_ecg_inventor_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetLastNameNoFormatting]医師によって発明された#o 心電計#!は、心臓の電気的活動の測定を可能にし、病院医療における画期的な出来事となった。#!"
 panum_physician_achievement_transplantation_inventor_loc: "\n #indent_newline:3 • #o 初の移植手術#!により、[Scope.GetCharacter.GetLastNameNoFormatting]医師は医学史にその名を刻んだ。#!"
 panum_physician_achievement_stereotactic_method_inventor_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetSheHe]が考案した#o 定位脳手術法#!は、今日に至るまで脳外科分野において画期的な手法と見なされている。#!"
 panum_physician_achievement_cardiopulmonary_bypass_inventor_loc: "\n #indent_newline:3 • #o 人工心肺装置#!の開発により、[Scope.GetCharacter.GetLastNameNoFormatting]医師は近代医学における傑作を成し遂げた。#!"
 panum_physician_achievement_endoscope_inventor_loc: "\n #indent_newline:3 • 人体の内部を初めて観察することを可能にした#o 内視鏡#!を[Scope.GetCharacter.GetHerHis|U]が発明したことも、特に人々の記憶に残っている。#!"
 panum_physician_achievement_ophthalmoscope_inventor_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetLastNameNoFormatting]医師は眼疾患の診察を容易にする装置である#o 検眼鏡#!を発明し、眼科学に計り知れない貢献を果たした。#!"
 panum_physician_achievement_chemotherapy_inventor_loc: "\n #indent_newline:3 • 最も難治性の疾患をも多様な薬剤で治療するために[Scope.GetCharacter.GetSheHe]が開発した#o 化学療法#!は、がん患者にさえ、すべてが絶望的ではないという希望を与えている。#!"
 panum_physician_achievement_iron_lung_inventor_loc: "\n #indent_newline:3 • 危篤状態にあるポリオ患者の命をつなぐために[GetPlayer.MakeScope.Var('tesla_engineer_var').GetCharacter.GetHerHis|U]が行った#o 初の「鉄の肺」の製作#!は、現代における最も目覚ましい工学的偉業の一つと見なされている。#!"
 panum_physician_achievement_military_medicine_project_finished_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetLastNameNoFormatting]医師は#o 野戦医療の分野で最新の手法を考案#!し、軍医部隊を世界で最も高く評価される存在の一つへと押し上げた。#!"
 panum_physician_achievement_inaugurated_asylum_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetLastNameNoFormatting]医師は、精神疾患を抱える人々に包括的かつ人道的な支援を提供するため、国内#o 初の精神療養所#!の設立において重要な役割を果たした。#!"
 panum_physician_achievement_anthrax_disease_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetLastNameNoFormatting]医師は#o 炭疽菌#!を専門としており、その効果的な予防法と治療法を確立している。#!"
 panum_physician_achievement_goiter_disease_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetLastNameNoFormatting]医師は#o 甲状腺腫#!を専門としており、その効果的な予防法と治療法を確立している。#!"
 panum_physician_achievement_nephrolithiasis_disease_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetLastNameNoFormatting]医師は#o 腎結石症#!を専門としており、その効果的な予防法と治療法を確立している。#!"
 panum_physician_achievement_pellagra_disease_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetLastNameNoFormatting]医師は#o ペラグラ#!を専門としており、その効果的な予防法と治療法を確立している。#!"
 panum_physician_achievement_rickets_disease_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetLastNameNoFormatting]医師は#o くる病#!を専門としており、その効果的な予防法と治療法を確立している。#!"
 panum_physician_achievement_syphilis_disease_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetLastNameNoFormatting]医師は#o 梅毒#!を専門としており、その効果的な予防法と治療法を確立している。#!"
 panum_physician_achievement_tetanus_disease_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetLastNameNoFormatting]医師は#o 破傷風#!を専門としており、その効果的な予防法と治療法を確立している。#!"
 panum_physician_achievement_basketball_inventor_loc: "\n #indent_newline:3 • [Scope.Var('panum_physician_achievement_basketball_inventor_year_var').GetValue|0]年、[Scope.GetCharacter.GetLastNameNoFormatting]医師は#o バスケットボールと呼ばれる新しい団体競技を考案した#!#!"
 panum_physician_achievement_hemophilia_disease_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetHerHis]社会環境における血友病患者を詳細に観察したことに着想を得て、[Scope.GetCharacter.GetLastNameNoFormatting]医師は#V この疾患に関する論文#!を執筆した。#!"