 mendelejew.990.d: "Dziś nasz naród opłakuje stratę [SCOPE.sCharacter('mendelejew_chemist_scope').GetFullName], jednego z najwybitniejszych umysłów i prawdziwego giganta chemii, którego odejście pozostawia ogromną pustkę w życiu akademickim."
 mendelejew.990.f: "Przywiązanie do własnego poglądu często prowadzi do całkowitego przekonania o jego prawdziwości, ukrywa jego słabsze strony i sprawia, że nie potrafimy przyjąć dowodów świadczących przeciwko niemu. \n \n /Jacob Berzelius"
