 je_noble_gases: "Nieznane Pierwiastki w Powietrzu"
 je_noble_gases_reason: "Henry Cavendish odkrył pierwszą przesłankę wskazującą na to, że powietrze zawiera niereaktywny gaz w 1783 roku. Zmieszał powietrze z tlenem w taki sposób, aby zawarte w nim pierwiastki, azot i tlen, całkowicie przereagowały, tworząc tlenki azotu pod wpływem elektryczności tarciowej. W rezultacie pozostała nieprzereagowana reszta. Nie dostrzegł jednak znaczenia swojego odkrycia i nie przerwał swoich eksperymentów. Może to stanowić dowód na istnienie wcześniej nieznanych pierwiastków, które należy zbadać przy użyciu najnowocześniejszych metod."
 je_mendelejew_noble_gases_has_famous_chemist_tt: "Ma sławnego [concept_mendelejew_chemist]."
 je_mendelejew_noble_gases_invalid: "Inny Naród odkrywa Gazy Szlachetne."
 mendelejew.901.t: "Gazy Szlachetne"
 mendelejew.901.d: "Dr. [GetPlayer.MakeScope.Var('mendelejew_chemist_var').GetCharacter.GetLastName] zdołał wyizolować wcześniej postulowany hel, który wykryto również na Ziemi. Dokonał zdumiewającego odkrycia: w powietrzu znajduje się nie jeden, lecz kilka nieznanych pierwiastków. Ze względu na ich niską reaktywność nazwał je gazami szlachetnymi."
 mendelejew.901.f: "Eksperymenty Cavendisha nad badaniem powietrza były kontynuowane przez Lorda Rayleigha od 1888 roku. Zauważył on, że azot otrzymany z powietrza ma inną gęstość niż azot uzyskany w wyniku rozkładu amoniaku. Rayleigh podejrzewał więc, że w powietrzu musi znajdować się nieznany dotąd, obojętny składnik. W związku z tym wraz z Williamem Ramsayem podjął próbę całkowitego usunięcia azotu z próbki powietrza poprzez reakcję z magnezem i wyizolowania tego nieznanego gazu. W końcu, w 1894 roku, udało im się wykryć spektroskopowo nowy pierwiastek, który nazwali argonem. Po ustaleniu głównych właściwości helu i argonu stwierdzono, że gazy te są jednoatomowe, w przeciwieństwie do pozostałych gazów atmosferycznych. William Ramsay podejrzewał następnie, że musi istnieć cała grupa takich gazów, które zajmują osobną grupę w tablicy okresowej, i rozpoczął ich poszukiwania. W 1898 roku jemu i Morrisowi Williamowi Traversowi udało się wyizolować neon, krypton i ksenon poprzez destylację frakcyjną powietrza."
 mendelejew.901.g: "Szlachetne? Nazwałbym to lenistwem."
 mandelejew_noble_gases_901.tt: "Przewiduj, odkryj i wyizoluj #YELLOW Argon#!, #YELLOW Neon#!, #YELLOW Krypton#! i #YELLOW Ksenon#!."
 mendelejew_chemist_synthetic_rubber_cost_modifier: "Badania nad Kauczukiem Syntetycznym"
 mendelejew_synthetic_rubber_tech: "Kauczuk Syntetyczny"
 mendelejew_synthetic_rubber_tech_desc: "Kauczuk syntetyczny jest sztucznym elastomerem. Są to polimery syntetyzowane z produktów ubocznych przeróbki ropy naftowej. Kauczuki syntetyczne przewyższają kauczuk naturalny pod dwoma istotnymi względami: stabilnością termiczną oraz odpornością na oleje i pokrewne związki."
 building_mendelejew_synthetic_rubber_factory: "Fabryka Kauczuku Syntetycznego"
 pmg_mendelejew_isoprene: "Izopren"
 pm_mendelejew_isoprene: "Izopren"
 je_mendelejew_synthetic_rubber_reason: "Około 1860 roku Charles Hanson Greville Williams zdołał wydestylować izopren z kauczuku naturalnego i ustalić jego wzór sumaryczny C5H8. Umożliwiło to Gustave’owi Bouchardatowi otrzymanie po raz pierwszy kauczuku syntetycznego w 1879 roku. Proces ten trwał kilka miesięcy i polegał na ogrzewaniu izoprenu uzyskanego z kauczuku z kwasem solnym, w wyniku czego powstawała substancja przypominająca kauczuk. Około 1900 roku Ivan Kondakov otrzymał pierwszy w pełni syntetyczny kauczuk z 2,3-dimetylobutadienu. Pierwszy patent na produkcję kauczuku syntetycznego przyznano Fritzowi Hofmannowi w 1909 roku. Tak zwany kauczuk metylowy otrzymywano w procesie polimeryzacji 2,3-dimetylobutadienu."
 je_mendelejew_synthetic_rubber_goal: "#E Postęp Chemiczny#! osiąga #ORANGE 75#! punktów."
 mendelejew.702.t: "Kauczuk w Laboratorium"
 mendelejew.702.d: "[GetPlayer.MakeScope.Var('mendelejew_chemist_var').GetCharacter.GetFullName] dokonał historycznego wyczynu, który zapisze się w historii chemii. Po latach eksperymentów i budowy nowego laboratorium nasz główny Chemik zdołał wyprodukować kauczuk syntetyczny. Zrewolucjonizuje to cały przemysł chemiczny."
 mendelejew.702.f: "Podczas obu wojen światowych Niemcy utraciły dostęp do źródeł kauczuku, co skłoniło je do poszukiwania alternatywnych rozwiązań. Podczas I wojny światowej, w latach 1915–1918, w zakładach firmy Bayer w Leverkusen wyprodukowano około 2500 ton kauczuku metylowego, stosując metodę Fritza Hofmanna. Pierwszym kauczukiem syntetycznym nadającym się do zastosowań komercyjnych był kauczuk butadienowo-styrenowy (SBR), opracowany w 1926 roku przez niemieckich chemików Waltera Bocka i Eduarda Tschunkura w zakładach I.G.-Farbenindustrie w Leverkusen. Zgłoszono go do opatentowania 15 stycznia 1927 roku."
 mendelejew.702.g: "Koniec z alergią na lateks!"
