 mendelejew_lauded_congress_modifier: "Pochwały na Kongresie Chemików"
 mendelejew_stop_chemistry_project_button: "Zakończ Projekt Chemiczny"
 mendelejew_stop_chemistry_project_button_desc: "Zakończ obecny Projekt Chemiczny. Postępy w badaniach chemicznych zostaną utracone."
 mendelejew_stop_chemist_improving_project_tt: "Zdecydowałeś się zakończyć projekt, klikając przycisk #italic Zakończ Projekt Chemiczny#!, albo nie masz [concept_mendelejew_chemist]."
 mendelejew_conference_chemist_double_vote_tt: "Dzięki naszemu doświadczonemu chemikowi mamy #G dwukrotnie większą#! siłę głosu"
 mendelejew_conference_chemist_triple_vote_tt: "Dzięki naszemu słynnemu chemikowi mamy #G trzykrotnie większą#! siłę głosu."
 je_mendelejew_improve_fertilizer_project: "Ulepsz Nawóz"
 je_mendelejew_improve_explosives_project: "Ulepsz Materiały Wybuchowe"
 je_mendelejew_improve_synthetics_project: "Ulepsz Materiały Syntetyczne"
 mendelejew_synthetic_fuel_tech: "Paliwo Syntetyczne"
 mendelejew_synthetic_fuel_tech_desc: "Proces Bergiusa-Piera to przemysłowa metoda upłynniania węgla poprzez jego bezpośrednie uwodornienie. Makrocząsteczki węgla rozkładane są na mniejsze cząsteczki za pomocą wodoru pod wysokim ciśnieniem i w wysokiej temperaturze. W wyniku tego procesu powstają gazowe i ciekłe węglowodory, wykorzystywane jako paliwa i środki smarne. W latach 1910–1925 niemiecki chemik Friedrich Bergius opracował podstawy tej metody. Od 1925 roku firma BASF prowadziła prace nad wdrożeniem procesu na skalę przemysłową i rozwojem katalizatorów pod kierownictwem projektu Matthiasa Piera."
 mendelejew.501.t: "W Służbie Ludzkości"
 mendelejew.501.d: "[SCOPE.sCharacter('mendelejew_chemist_scope').GetFullName] zapoczątkował rewolucję w krajowych fabrykach nawozów. Nowe procesy i metody chemiczne znacząco poprawiły produkcję i jej wydajność. Już teraz mówi się, że Dr. [SCOPE.sCharacter('mendelejew_chemist_scope').GetLastName] wniósł znaczący wkład w walkę z głodem na świecie.\n\nŁączna liczba ulepszonych budynków: [GetPlayer.MakeScope.Var('mr_num_improved_chemical_plants_buildings_var').GetValue|V0]"
 mendelejew.501.f: "„Rolnicy nas wyprzedzą dzięki naszym supernowym nawozom! To ogromny krok dla ludzkości, wspaniałe osiągnięcie profesora! To bardzo bystry człowiek. To, że zarabiam fortunę, jest tylko efektem ubocznym, o którym możecie śmiało nie wspominać w artykule. Za to możecie spokojnie napisać o moim zwycięstwie w ostatnim turnieju golfa”."
 mendelejew.501.g: "Więcej Azotanów dla wszystkich!"
 mendelejew.502.t: "W Służbie Górnictwa"
 mendelejew.502.d: "[ROOT.Var('mendelejew_chemist_var').GetCharacter.GetFullName] zapoczątkował nowy etap w górnictwie naszego kraju, patentując nowe metody produkcji materiałów wybuchowych. Dzięki nowej formule opracowanej przez Dr. [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] produkcja stała się wydajniejsza i wymaga mniejszej ilości surowców.\n\nŁączna liczba ulepszonych budynków: [GetPlayer.MakeScope.Var('mr_num_improved_explosives_factory_buildings_var').GetValue|V0]"
 mendelejew.502.f: "„Oczywiście te materiały wybuchowe nie uczynią pracy górników bezpieczniejszą. Ale jeśli dotąd odnosili sukcesy, teraz będą odnosić jeszcze większe. Przekonałem się o sile wybuchu naszego nowego dynamitu, wynalezionego przez Dr. [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName], i odkryłem, że górnicy muszą teraz pracować mniej niż kiedykolwiek. W zasadzie powinni mi płacić, bo nie pozostało im już nic do roboty poza zamiataniem gruzu”."
 mendelejew.502.g: "Więcej Nitrogliceryny dla wszystkich!"
 mendelejew.503.t: "W Służbie Suwerenności Narodowej"
 mendelejew.503.d: "[ROOT.Var('mendelejew_chemist_var').GetCharacter.GetFullName] zapoczątkował znaczące zmiany w produkcji wyrobów syntetycznych. Dzięki udoskonaleniu niektórych receptur i ulepszeniu procesów można teraz wytwarzać jeszcze więcej produktów przy mniejszym nakładzie pracy. [GetPlayer.GetName] stało się bardziej niezależne od zagranicy niż kiedykolwiek wcześniej, a Dr. [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] jest już uważany za bohatera narodowego.\n\nŁączna liczba ulepszonych budynków: [GetPlayer.MakeScope.Var('mr_num_improved_synthetics_factory_buildings_var').GetValue|V0]"
 mendelejew.503.f: "„Zasadniczo kupowanie naszych nowych produktów syntetycznych jest patriotycznym obowiązkiem. Zostały one wynalezione przez naukowca [ROOT.GetCountry.GetAdjectiveNoFlag] Dr. [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName], a wytwarzają je [ROOT.GetCountry.GetAdjectiveNoFlag] robotnicy w [ROOT.GetCountry.GetAdjectiveNoFlag] fabrykach z — mniej lub bardziej — [ROOT.GetCountry.GetAdjectiveNoFlag] surowców. A chyba chcecie być dobrymi, patriotycznymi obywatelami? W takim razie wyższa cena powinna być dla was do zaakceptowania, w końcu chodzi o ojczyznę”."
 mendelejew.503.g: "Więcej Wyrobów Syntetycznych dla wszystkich!"
 mendelejew.601.t: "Kongres Chemików"
 mendelejew.601.d: "Przygotowania do najważniejszego międzynarodowego spotkania chemików w mieście [ROOT.GetCountry.GetCapital.GetCityHubName] są niemal zakończone. [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetFullName] dołożył szczególnych starań, aby w wydarzeniu wzięli udział najważniejsi eksperci. Teraz pozostało już tylko rozesłać zaproszenia."
 mendelejew.601.f: "Chemia ukształtowała się jako dyscyplina naukowa w połowie XIX wieku, ale wciąż borykała się z poważnymi brakami teoretycznymi. Poszczególne „szkoły” reprezentowały odmienne poglądy, zwłaszcza w kwestii budowy atomów i cząsteczek. Zgodnie z teorią Johna Daltona powszechnie uznawano je za najmniejsze składniki związków chemicznych, jednak niemal nic nie wiedziano o ich strukturze. Różnice zdań dotyczyły również innych fundamentalnych zagadnień teoretycznych, takich jak podstawy określania mas atomowych. Nomenklatura i sposób zapisywania wzorów chemicznych także były bardzo niespójne. Nie istniało jednak jeszcze forum, na którym można by omawiać ówczesne problemy. Dlatego trzech młodych profesorów chemii podjęło inicjatywę zorganizowania kongresu, aby przedyskutować sporne kwestie z kolegami po fachu i znaleźć ich rozwiązania. Zaprosili najważniejszych przedstawicieli tej dziedziny do Karlsruhe na spotkanie zaplanowane na 3–5 września 1860 roku."
 mendelejew.601.g: "Nasi goście będą solą w zupie."
 mendelejew.602.d: "[SCOPE.sCountry('mendelejew_congress_host_country').GetName] zaprosiło uczestników na międzynarodowy Kongres Chemików. Najwyraźniej zamierzają przedyskutować kwestię międzynarodowego ujednolicenia mas atomowych. Dr. [SCOPE.sCharacter('mendelejew_chemist_scope').GetLastName] otrzymał serdeczne zaproszenie."
 mendelejew.602.g: "Musimy szybko zareagować!"
 mendelejew.604.t: "Masa Atomowa"
 mendelejew.604.d: "Choć konferencja rozpoczęła się obiecująco, próby ostatecznego uzgodnienia międzynarodowego systemu mas atomowych wkrótce utknęły w martwym punkcie. Grupa chemików o nacjonalistycznych poglądach nie chciała zrezygnować ze swoich dotychczasowych systemów."
 mendelejew.604.f: "Podczas Kongresu w Karlsruhe w 1860 roku nie osiągnięto porozumienia w kilku kwestiach. Jednym z najważniejszych zagadnień były masy atomowe i cząsteczkowe. Na podstawie odkryć wcześniejszych chemików zgadzano się, że atomy są odrębnymi cząstkami, z których zbudowane są cząsteczki, jednak równolegle stosowano kilka systemów określania mas atomowych. Jeden z nich opierał się na wodorze, któremu przypisano wartość 1 jako jednostkę podstawową, podczas gdy węglowi przypisano wartość 6, a tlenowi 8. Dopóki istniały niejasności dotyczące mas atomowych, niepewny pozostawał również skład pierwiastkowy badanych związków. Stosowano nawet pięć różnych systemów wag atomowych, a ze względu na skomplikowane przeliczenia niektórzy chemicy skłaniali się ku temu, by nie zmieniać niczego."
 mendelejew.604.g: "Przy tak dużych rozbieżnościach nie ma powodu, by porzucać stary system."
 mendelejew.604.h: "Potrzebujemy wspólnej, międzynarodowej skali mas atomowych."
 mendelejew.605.t: "Rozmowy Chemików"
 mendelejew.605.d: "W kuluarach konferencji naukowej Dr. [SCOPE.sCharacter('mendelejew_chemist_scope').GetLastName] ma okazję wymienić poglądy z wieloma kolegami po fachu z całego świata. Pozostaje pytanie, jak najlepiej wykorzystać tę wyjątkową okazję."
 mendelejew.605.f: "„Nie ma nic dziwnego w tym, że do zrozumienia praw potrzebujemy pomocy hipotez. Często zdarza się, że umysł człowieka poznającego nową dziedzinę nauki musi przejść przez wszystkie etapy, przez które sama ta nauka przeszła w toku swojego historycznego rozwoju”. – Stanislao Cannizzaro"
 mendelejew.605.g: "Nasz chemik powinien zdobyć nowe doświadczenia, które przydadzą się w przyszłości."
 mendelejew.605.h: "Nasz chemik powinien poszukać rozwiązań bieżących problemów w swoich badaniach."
 mendelejew.605.i: "Nasz chemik powinien wysłać swoich asystentów, aby zdobyli nową wiedzę."
 mendelejew.609.t_national: "Kongres Chemików kończy się bez rozstrzygnięcia"
 mendelejew.609.d_national: "Przez trzy dni organizatorzy i czołowi eksperci w dziedzinie chemii próbowali uratować wydarzenie, jednak ostatecznie nie udało się ustalić uniwersalnej zasady określania mas atomowych. Państwa narodowe przez pewien czas pozostaną przy tradycyjnych systemach, co sprawi, że konieczne będzie stosowanie tabel przeliczeniowych."
 mendelejew.609.f_national: "Kongres w Karlsruhe był pierwszym kongresem specjalistycznym poświęconym konkretnej dyscyplinie naukowej. Mimo że nie przyniósł rozstrzygających rezultatów, Kongres Chemików w Karlsruhe można uznać za najważniejsze wydarzenie w historii chemii XIX wieku. Spotkanie tak wielu chemików z kraju i zagranicy stało się katalizatorem dalszego rozwoju chemii teoretycznej."
 mendelejew.609.g: "To opóźni nas o całe lata."
 mendelejew.609.t_international: "Kongres Chemików kończy się porozumieniem"
 mendelejew.609.d_international: "Na szczęście chemicy uczestniczący w kongresie naukowym znaleźli jednolite rozwiązanie kwestii mas atomowych, które zostało teraz uznane na arenie międzynarodowej. Naukowcy powołują się na twierdzenie Amedea Avogadra. Dr. [SCOPE.sCharacter('mendelejew_chemist_scope').GetLastName] z radością ogłosił dziś ten sukces w liście."
 mendelejew.609.f_international: "Ważnym długofalowym rezultatem Kongresu w Karlsruhe było przyjęcie mas atomowych, które znamy dzisiaj. Po spotkaniu w Karlsruhe przyjęto wartości wynoszące około 1 dla wodoru, 12 dla węgla, 16 dla tlenu i tak dalej. Podstawą tej zmiany było uznanie, że niektóre pierwiastki, takie jak wodór, azot i tlen, występują w postaci cząsteczek dwuatomowych, a nie pojedynczych atomów."
 mendelejew.609.h: "Przełom dla Chemii!"
 mendelejew.201.d: "Po wielu żmudnych godzinach pracy i przebrnięciu przez nużącą ilość materiałów Dr. [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] jest już pewien: jeśli ostatnie badania są poprawne, to rzeczywiście odkrył od dawna poszukiwany #YELLOW pierwiastek o numerze [ROOT.Var('mendelejew_searched_variable').GetValue|0]#!. Dr. [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] postanowił nazwać ten pierwiastek #YELLOW [SCOPE.GetRootScope.GetCountry.GetCustom('mendelejew_element_name')]#!."
 mendelejew.301.d: "Nie ma już żadnych wątpliwości: #YELLOW pierwiastek o numerze [ROOT.Var('mendelejew_examined_variable').GetValue|0]#! nie tylko istnieje, ale można go również wyizolować przy użyciu nowoczesnych metod chemicznych. To naprawdę wielki dzień dla naszego kraju!"
 je_mendelejew_element_isolation_reason: "[ROOT.Var('mendelejew_chemist_var').GetCharacter.GetFullName] niestrudzenie pracuje nad wyizolowaniem nowego pierwiastka. Doświadczenie, umiejętności i cechy charakteru, a także wyposażenie laboratorium w obserwatorium, mają istotny wpływ na czas trwania tego procesu. Badania dotyczą #YELLOW pierwiastka o numerze [ROOT.Var('mendelejew_examined_variable').GetValue|0]#!."
