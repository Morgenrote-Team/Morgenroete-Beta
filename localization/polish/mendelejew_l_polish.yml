 ACHIEVEMENT_GROUP_mendelejew_achievement_group: "Osiągnięcia Mendelejewa"
 ACHIEVEMENT_mendelejew_chemist: "Chemik"
 ACHIEVEMENT_DESC_mendelejew_chemist: "Osiągnij Punktację Chemiczną na poziomie co najmniej 50."
 ACHIEVEMENT_mendelejew_proud: "Mendelejew byłby dumny."
 ACHIEVEMENT_DESC_mendelejew_proud: "Opracuj układ okresowy pierwiastków chemicznych."
 ACHIEVEMENT_mendelejew_oil: "Samowystarczalność naftowa"
 ACHIEVEMENT_DESC_mendelejew_oil: "Bądź pierwszym państwem, które opracuje paliwo syntetyczne."
 mendelejew.11.t: "Wybuchowy interes"
 mendelejew.11.d: "[SCOPE.sCharacter('mendelejew_chemist_scope').GetFullName] opracował ulepszony materiał wybuchowy podczas [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetHerHis] eksperymentów z nitrogliceryną i odniósł dosłownie wybuchowy sukces. Chemik opatentował [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetHerHis] wynalazek i rozpoczął jego próbną produkcję we własnej fabryce należącej do [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetHerHis]."
 mendelejew.11.f: "Podczas studiów w Paryżu w 1850 roku Alfred Nobel poznał Ascania Sobrero, który trzy lata wcześniej odkrył nitroglicerynę, lecz nie uważał jej za praktyczną ze względu na jej wrażliwość na wstrząsy i ogień. Nobel był bardzo zainteresowany tym wynalazkiem i od 1862 roku koncentrował swoje wysiłki na zastosowaniu nitrogliceryny w technice jako materiału wybuchowego. Podczas eksperymentów Nobla z nitrogliceryną doszło do kilku wypadków. We wrześniu 1864 roku eksplozja 125 kilogramów nitrogliceryny przechowywanej w jego laboratorium zabiła jego brata Emila, inżyniera Hertzmana, pokojówkę Marię, posłańca Hermana oraz cieślę Johana Petera Nymana. W 1866 roku Nobel dokonał przełomu i opracował materiał wybuchowy, który nazwał „dynamitem”, w swojej fabryce materiałów wybuchowych w Krümmel, niedaleko Geesthacht."
 mendelejew.11.g: "Czy [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetSheHe] jest również przedsiębiorcą?"
 mendelejew.12.t: "[SCOPE.sCharacter('mendelejew_chemist_scope').GetFullName] odkrył przyczynę powstawania linii Fraunhofera"
 mendelejew.12.d: "Przez długi czas przyczyna powstawania cienkich, czarnych linii w widmie Słońca była przedmiotem spekulacji. Jednak teraz Dr. [SCOPE.sCharacter('mendelejew_chemist_scope').GetFullName] w końcu odkrył ich przyczynę: to określone Pierwiastki Chemiczne powodują powstawanie tych linii. Otwiera to drogę do ustalenia, jakie Pierwiastki występują w gwiazdach."
 mendelejew.12.f: "Joseph Fraunhofer zaobserwował charakterystyczne linie w widmie Słońca w 1813 roku. Dopiero kilkadziesiąt lat później Gustav Robert Kirchhoff i Robert Bunsen odkryli przyczynę ich powstawania. Spalając różne pierwiastki i związki chemiczne, zauważyli, że pochłaniają one określone części widma. Na tej podstawie stwierdzili, że pochłanianie określonych części widma świadczy o obecności konkretnych związków chemicznych lub pierwiastków w zewnętrznych warstwach gwiazdy.\n\nSpektroskopia umożliwiła nie tylko klasyfikowanie gwiazd według ich typów, lecz także analizę spektroskopową materiałów i substancji chemicznych. Nawet hel został odkryty dzięki spektroskopii Słońca."
 mendelejew.12.g: "Kolejna zagadka wszechświata została rozwiązana!"
 building_mendelejew_hydrogenation_plants: "Zakłady Uwodorniania"
 pmg_mendelejew_coal_liquefaction: "Upłynnianie Węgla"
 pm_mendelejew_coal_liquefaction: "Upłynnianie Węgla"
 mendelejew_chemist_synthetic_oil_cost_modifier: "Badania Nad Ropą Syntetyczną"
 je_mendelejew_synthetic_oil: "Badania nad Upłynnianiem Węgla"
 je_mendelejew_synthetic_oil_reason: "Upłynnianie węgla, nazywane również uwodornianiem węgla, określane obecnie najczęściej jako konwersja węgla w paliwa ciekłe (w skrócie CtL), to proces karbochemiczny polegający na przekształcaniu węgla brunatnego lub kamiennego w ciekłe surowce chemiczne oraz paliwa syntetyczne, takie jak benzyna, olej napędowy i nafta. W latach 1910–1925 Friedrich Bergius opracował metodę wysokociśnieniową, którą następnie zmodyfikował Matthias Pier. Był to pierwszy proces upłynniania węgla stosowany na dużą skalę przemysłową. Polega on na bezpośrednim uwodornieniu, przeprowadzanym w dwóch etapach. W 1925 roku Franz Fischer, ówczesny dyrektor Instytutu Badań nad Węglem im. Cesarza Wilhelma, wraz ze swoim współpracownikiem Hansem T ropschem odkrył reakcję, która należy do najważniejszych w dziedzinie katalizy heterogenicznej, a jej znaczenie naukowe, gospodarcze i społeczne jest widoczne do dziś."
 je_mendelejew_synthetic_oil_goal: "#E Postęp Chemiczny#! osiąga #ORANGE 100#! punktów."
 mendelejew.701.t: "Węgiel na Ropę"
 mendelejew.701.d: "[GetPlayer.MakeScope.Var('mendelejew_chemist_var').GetCharacter.GetFullName] dokonał historycznego osiągnięcia, które zapisze się w historii chemii. Po latach eksperymentów i zbudowaniu nowego laboratorium nasz główny chemik zdołał wyprodukować paliwo syntetyczne. Zrewolucjonizuje to cały przemysł chemiczny."
 mendelejew.701.f: "Systematyczne badania nad równoważnymi substytutami wykorzystywanymi do produkcji benzyny rozpoczęły się w Niemczech po I wojnie światowej. Z jednej strony kolejne rządy Republiki Weimarskiej, ze względu na sytuację gospodarczą, nieustannie kwestionowały zasadność importu ropy naftowej i coraz intensywniej poszukiwały sposobów na osiągnięcie samowystarczalności w tym zakresie. Z drugiej strony amerykańscy naukowcy przewidywali w badaniu, które potraktowano poważnie na całym świecie, że światowe zasoby ropy naftowej wyczerpią się w krótkim czasie, podczas gdy motoryzacja rozwijała się w niepowstrzymanym tempie. W tych okolicznościach, przy wsparciu rządu, naukowcy i przedsiębiorstwa z dużym zaangażowaniem zwrócili się ku źródłu energii, którego Niemcy miały pod dostatkiem: węglowi. Już na początku XIX wieku, na długo przed pojawieniem się benzyny otrzymywanej z ropy naftowej, wiedziano, że z węgla można uzyskać benzen. W 1913 roku niemiecki chemik Friedrich Bergius zgłosił pierwszy patent na uwodornianie węgla, za co otrzymał Nagrodę Nobla wspólnie z Carlem Boschem."
 mendelejew.701.g: "Oznacza to, że jesteśmy samowystarczalni pod względem zaopatrzenia w ropę naftową."
 mendelejew_chemist_periodic_table_inventor: "Twórca Układu Okresowego"
 mendelejew_chemist_periodic_table_inventordesc: "Jako twórca Układu Okresowego Pierwiastków, postać ta szczególnie dobrze radzi sobie z przewidywaniem istnienia pierwiastków."
 mendelejew.801.t: "Układ Okresowy Pierwiastków"
 mendelejew.801.d: "[GetPlayer.MakeScope.Var('mendelejew_chemist_var').GetCharacter.GetFullName] zdołał uporządkować dotychczas poznane pierwiastki chemiczne, a nawet przewidzieć, których pierwiastków jeszcze brakuje. Zgodnie z wcześniejszymi przypuszczeniami właściwości pierwiastków w uporządkowanym systemie powtarzają się okresowo — dlatego Dr. [GetPlayer.MakeScope.Var('mendelejew_chemist_var').GetCharacter.GetLastName] nazwał go „Układem Okresowym Pierwiastków”."
 mendelejew.801.f: "Współczesny układ okresowy został opracowany przez Lothara Meyera i Dmitrija Iwanowicza Mendelejewa. Obaj opublikowali swoje wyniki w 1869 roku, a w 1882 roku wspólnie otrzymali Medal Davy'ego przyznawany przez brytyjskie Towarzystwo Królewskie za swoją pracę. Mendelejew jest częściej wymieniany niż Meyer jako twórca współczesnego układu okresowego. Wynika to z jednej strony z faktu, że układ okresowy Meyera został opublikowany kilka miesięcy później, a z drugiej z tego, że Mendelejew przewidział właściwości pierwiastków, które nie zostały jeszcze odkryte. W Rosji układ okresowy nadal nazywany jest Tabliza Mendeleyeva (tablicą Mendelejewa). Ani Mendelejew, ani Meyer nie znali nawzajem swoich prac nad układem okresowym. Mendelejew nie znał również prac Béguyera de Chancourtois z 1862 roku, Newlandsa z lat 1863–1864 ani Hinrichsa z lat 1866–1867."
 mendelejew.801.g: "Chemia stała się pełnoprawną nauką."
 je_mendelejew_periodic_table: "Porządek Pierwiastków"
 je_mendelejew_periodic_table_reason: "Już na początku XIX wieku poszukiwano prawidłowości w zależnościach między pierwiastkami. Przeszkodami były między innymi niepewności dotyczące mas atomowych oraz fakt, że wiele pierwiastków nie zostało jeszcze odkrytych. Döbereiner jako pierwszy ustalił związek między masą atomową a właściwościami chemicznymi poszczególnych pierwiastków. W 1824 roku Falckner opublikował system naturalnych rodzin pierwiastków. Jednak wielki przełom wciąż nie nastąpił."
