 mendelejew_chemist_theorist: "Specjalizacja Chemika: Teoretyk"
 mendelejew_chemist_theorist_desc: "Ten chemik skupił się na chemii teoretycznej i szybciej formułuje nowe hipotezy dotyczące jeszcze nieodkrytych pierwiastków."
 mendelejew_chemist_analyst: "Specjalizacja Chemika: Analityk"
 mendelejew_chemist_analyst_desc: "Ten chemik jest utalentowanym odkrywcą nowych pierwiastków i osiąga sukcesy szybciej niż jego koledzy po fachu."
 mendelejew_chemist_inspector: "Specjalizacja Chemika: Preparatywista"
 mendelejew_chemist_inspector_desc: "Ten chemik jest uznawany za doświadczonego eksperta w dziedzinie substancji i potrafi wyizolowywać pierwiastki szybciej niż ktokolwiek inny."
 je_mendelejew_element_theory: "Rozważania nad Pierwiastkiem"
 je_mendelejew_element_theory_reason: "[ROOT.Var('mendelejew_chemist_var').GetCharacter.GetFullName] przewiduje istnienie nowego pierwiastka. Doświadczenie, umiejętności i cechy charakteru, a także wyposażenie laboratorium w obserwatorium, mają istotny wpływ na czas trwania tego procesu. Badania dotyczą #YELLOW pierwiastka o numerze [ROOT.Var('mendelejew_thought_variable').GetValue|0]#!."
 je_chemist_dies_tt: "Dr [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] umiera"
 je_element_theory_failed_tt: "Inne państwo przewiduje istnienie pierwiastka, zanim zrobi to Dr. [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName]."
 je_mendelejew_element_discovery: "Poszukiwanie Pierwiastka"
 je_mendelejew_element_discovery_reason: "[ROOT.Var('mendelejew_chemist_var').GetCharacter.GetFullName] niestrudzenie pracuje nad odkryciem nowego pierwiastka. Doświadczenie, umiejętności i cechy charakteru, a także wyposażenie laboratorium w obserwatorium, mają istotny wpływ na czas trwania tego procesu. Badania dotyczą #YELLOW pierwiastka o numerze [ROOT.Var('mendelejew_searched_variable').GetValue|0]#!."
 je_element_discovery_failed_tt: "Inne państwo odkrywa pierwiastek przed Dr. [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName]."
 je_mendelejew_element_isolation: "Badanie Pierwiastka"
 je_element_isolation_failed_tt: "Inne państwo wyizolowuje pierwiastek przed Dr. [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName]."
 mendelejew.101.t: "Teoria Nowego Pierwiastka"
 mendelejew.101.d: "Po szeroko zakrojonych badaniach i analizach dr [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] wysunął hipotezę, że musi istnieć jeszcze nieznany pierwiastek. Chemik nadaje temu hipotetycznemu pierwiastkowi nazwę #YELLOW pierwiastek o numerze [ROOT.Var('mendelejew_thought_variable').GetValue|0]#!. Wciąż jednak czeka on na odkrycie."
 mendelejew.101.f: "Termin „pierwiastek chemiczny” pojawił się w XVII wieku, gdy coraz powszechniej dostrzegano, że alchemiczne pojęcie pierwiastków nie nadaje się do naukowego wyjaśnienia różnorodnych właściwości substancji i zachodzących między nimi reakcji. W 1661 roku Robert Boyle opublikował wpływającą na rozwój nauki krytykę niedostatków alchemii zatytułowaną „Sceptyczny chemik”. Wyjaśnił w niej, że przez pierwiastki chemiczne należy rozumieć te pierwotne substancje, „które nie powstały z innych substancji ani z siebie nawzajem, lecz stanowią składniki, z których powstają substancje złożone”."
 mendelejew.101.g: "Ale hej, to tylko teoria. Teoria chemika!"
 mendelejew.102.t: "Brakujący Pierwiastek?"
 mendelejew.102.d: "W swoich najnowszych badaniach dr [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] ustalił, że zgodnie z obecnym stanem wiedzy muszą istnieć inne, nieznane jeszcze pierwiastki. Wciąż nie wiadomo, jak dokładnie można je zidentyfikować, ale wkrótce powinna powstać hipoteza."
 mendelejew.102.f: "Terminu „pierwiastki” (stoicheia) po raz pierwszy użył grecki filozof Platon około 360 roku p.n.e. w swoim dialogu „Timajos”, który zawiera rozważania na temat budowy ciał nieorganicznych i organicznych oraz stanowi spekulacyjny traktat o chemii. Platon uważał, że pierwiastki opisane sto lat wcześniej przez Empedoklesa składają się z małych brył wielościennych: czworościanu (ogień), ośmiościanu (powietrze), dwudziestościanu (woda) i sześcianu (ziemia)."
 mendelejew.102.g: "Jak może czegoś brakować, skoro nie wiadomo nawet, że to istnieje?"
 mendelejew.103.t: "Obce Państwo przewiduje istnienie Nowego Pierwiastka"
 mendelejew.103.d: "Ku ubolewaniu naszego głównego chemika, [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetSheHe] dowiaduje się dziś, że w zagranicznym czasopiśmie zostanie opublikowany artykuł naukowy przedstawiający hipotezę dotyczącą #YELLOW pierwiastka o numerze [ROOT.Var('mendelejew_thought_variable').GetValue|0]#!, o którym dr [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] chciał [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetHerselfHimself] stworzyć teorię. Wszystkie badania zostały wstrzymane."
 mendelejew.103.f: "„Szczęście sprzyja przygotowanym”. – Louis Pasteur"
 mendelejew.103.g: "Bezczelność! Nasza publikacja była już właściwie gotowa do druku!"
 mendelejew.111.t: "Nieobecny Profesor?"
 mendelejew.111.d: "[ROOT.Var('mendelejew_chemist_var').GetCharacter.GetFullName] jest uważany nie tylko za znakomitego badacza, lecz także za utalentowanego nauczyciela. Jednak obecne obowiązki związane z badaniami nad pierwiastkami powodują problemy z realizacją programu nauczania. Pojawiają się już skargi, że seminaria i wykłady są zaniedbywane."
 mendelejew.111.f: "Niemiecki profesor chemii Justus von Liebig cieszył się szczególną popularnością wśród swoich studentów dzięki nowoczesnym metodom nauczania. Jego odkrycia i publikacje szybko przyniosły mu światową sławę, w wyniku czego do Giessen przybywali nie tylko liczni Niemcy, lecz także wielu cudzoziemców, w tym 84 Anglików i 18 Amerykanów, aby słuchać wykładów Liebiga z chemii i farmacji."
 mendelejew.111.g: "Dr [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] powinien skupić się na badaniach."
 mendelejew.111.h: "Dr [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] powinien skupić się na pracy dydaktycznej."
 mendelejew.111.i: "Dr [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] powinien znaleźć równowagę."
 mendelejew.112.t: "Marzenie"
 mendelejew.112.d: "[ROOT.Var('mendelejew_chemist_var').GetCharacter.GetFullName] opowiada o inspirującym śnie, który pewnej nocy pozwolił mu rozwiązać problem z chemii teoretycznej, z którym wcześniej nie potrafił sobie poradzić."
 mendelejew.112.f: "„Siedziałem, pisząc mój podręcznik, ale praca nie posuwała się naprzód; moje myśli błądziły gdzie indziej. Przysunąłem krzesło do kominka i zdrzemnąłem się. Znów atomy harcowały przed moimi oczami. Tym razem mniejsze grupy skromnie pozostawały w tle. Oko mojego umysłu, wyostrzone przez powtarzające się podobne wizje, potrafiło już rozróżniać większe struktury o rozmaitych kształtach; długie szeregi, niekiedy ściślej do siebie przylegające, wszystkie wijące się i skręcające niczym węże. Ależ spójrzcie! Co to takiego? Jeden z węży chwycił własny ogon, a jego kształt wirował szyderczo przed moimi oczami. Jak rażony błyskawicą, ocknąłem się; i tym razem również spędziłem resztę nocy na rozważaniu konsekwencji tej hipotezy. Uczmy się marzyć, panowie, a być może poznamy wtedy prawdę… ale strzeżmy się publikowania naszych marzeń, zanim nie zostaną poddane próbie przez trzeźwy rozum”. – August Kekulé"
 mendelejew.112.g: "Chcesz powiedzieć, że Doktor pracuje nawet przez sen?"
 mendelejew.113.t: "Traktat o Chemii"
 mendelejew.113.d: "Jako poboczne opracowanie związane z teorią dotyczącą nieznanego pierwiastka powstał traktat o chemii. Dr [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] zamierzał dotąd wykorzystywać go wyłącznie na własny użytek, jednak jego asystent nalega, by dokończyć dzieło i opublikować je, zamiast pozostawiać je jedynie w formie szkicu."
 mendelejew.113.f: "Nie tylko w chemii, lecz także w niemal każdej dziedzinie nauki zdarza się, że nie udaje się osiągnąć zamierzonego celu badawczego, ale po drodze dokonuje się znacznie ciekawszych odkryć, które zostają jedynie odnotowane w pośpiesznych notatkach. Często zdarza się, że na chwilę traci się z oczu główny cel, by poświęcić się czemuś znacznie bardziej przełomowemu."
 mendelejew.113.g: "To służy wyłącznie do prywatnych badań."
 mendelejew.113.h: "To opracowanie powinno być omawiane na zajęciach."
 mendelejew.113.i: "Ta publikacja ma wartość naukową — powinna być publicznie dostępna!"
 mendelejew.114.t: "Marzenia na jawie"
 mendelejew.114.d: "Nasz chemik, dr [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName], zwrócił uwagę, że [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetSheHe] potrzebuje specjalnych warunków do odpoczynku i możliwości odosobnienia, a zwłaszcza inspirującego snu, aby pomyślnie ukończyć [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetHerHis] badania. Jednak od tamtej pory niewiele się wydarzyło."
 mendelejew.114.f: "„Jeśli wszystkie hipotezy są prawdziwe, a ten wzór chemiczny jest poprawny, to powinno istnieć... o, wiewiórka!”"
 mendelejew.114.g: "Chemik przez cały ten czas po prostu się obijał?!"
 mendelejew.115.t: "Współpraca Astronomiczno-Chemiczna"
 mendelejew.115.d: "Wymiana pomysłów z astronomem dr [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] dała naszemu chemikowi dr [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] przełomową inspirację w [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetHerHis] rozważaniach teoretycznych dotyczących nowego pierwiastka."
 mendelejew.115.f: "Jeszcze przed odkryciem spektroskopii, a zwłaszcza po nim, chemia i astronomia nadal wzajemnie na siebie oddziaływały. Spektroskopia początkowo była wykorzystywana jako technika astronomiczna w eksperymentach Williama Hyde’a Wollastona, który skonstruował pierwszy spektrometr umożliwiający ukazanie linii widmowych promieni słonecznych. Linie te zostały później scharakteryzowane przez Josefa von Fraunhofera. Następnie Gustav Robert Kirchhoff i Robert Bunsen odkryli, że każdemu pierwiastkowi chemicznemu odpowiada określona liczba i układ linii widmowych. Wywnioskowali z tego, że linie zaobserwowane przez Wollastona i Fraunhofera wynikały z właściwości absorpcyjnych tych pierwiastków w górnych warstwach Słońca, a zatem pierwiastki te musiały być również obecne w fotosferze."
 mendelejew.115.g: "Synteza Akademicka!"
 mendelejew.201.t: "Odkrycie Nowego Pierwiastka"
 mendelejew.201.f: "„Należy spodziewać się odkrycia wielu jeszcze nieznanych pierwiastków, na przykład pierwiastków analogicznych do glinu i krzemu, których masa atomowa wynosiłaby od 65 do 75”. – Dmitrij Mendelejew"
 mendelejew.201.g: "A jak to smakuje?"
 mendelejew.202.d: "Nasz główny chemik, [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetFullName], jest głęboko przekonany, że postulowany #YELLOW pierwiastek o numerze [ROOT.Var('mendelejew_searched_variable').GetValue|0]#! rzeczywiście istnieje, i postanowił go odnaleźć."
 mendelejew.202.f: "Spośród pierwiastków w dzisiejszym rozumieniu jedynie dziesięć było znanych w czystej postaci już w starożytności. Występowały one naturalnie lub można je było wytopić z rud: węgiel, siarka, żelazo, miedź, cynk, srebro, cyna, złoto, rtęć i ołów. Wraz z rozwojem średniowiecznego górnictwa odkrywano w rudach niewielkie domieszki nieznanych metali, szczególnie w Rudawach Kruszcowych. Nadawano im nazwy nawiązujące do duchów gór, czego przykładami są kobalt i nikiel. Odkrycie fosforu przez Henniga Branda w 1669 roku zapoczątkowało erę odkrywania większości pierwiastków, w tym uranu, który Martin Heinrich Klaproth otrzymał ze smółki uranowej w 1789 roku."
 mendelejew.202.g: "Badania nad Pierwiastkami"
 mendelejew.203.t: "Obce Państwo odkrywa Nowy Pierwiastek"
 mendelejew.203.d: "Dr [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] dowiedział się dziś podczas konferencji, że zagranicznemu chemikowi udało się jako pierwszemu odkryć #YELLOW pierwiastek o numerze [ROOT.Var('mendelejew_searched_variable').GetValue|0]#!. Zniechęcony tą wiadomością, [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetSheHe] przerwał wszelkie badania."
 mendelejew.203.f: "„Przeprowadzałam różne doświadczenia opisane w traktatach z fizyki i chemii, a ich wyniki bywały niekiedy nieoczekiwane. Czasami podnosił mnie na duchu drobny, niespodziewany sukces, innym razem popadałam w głęboką rozpacz z powodu wypadków i niepowodzeń wynikających z mojego braku doświadczenia”. – Maria Skłodowska-Curie"
 mendelejew.203.g: "Musimy udowodnić, że ten pierwiastek nie istnieje!"
 mendelejew.211.t: "Nowe Laboratorium?"
 mendelejew.211.d: "Dr [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] skarży się, że laboratorium chemiczne na jego uniwersytecie jest w złym stanie. Należy pilnie zakupić nowe przyrządy i wyposażenie. W przeciwnym razie odkrycia nowych pierwiastków mogą ulec znacznemu opóźnieniu."
 mendelejew.211.f: "Zakładanie laboratoriów i zakup nowego sprzętu czy przyrządów wcale nie były czymś oczywistym. Na początku XIX wieku w wielu miejscach chemia wciąż spotykała się z niechęcią. Nawet chemik Justus von Liebig, mimo swojej wysokiej pozycji, musiał sam opłacać wyposażenie swojego laboratorium."
 mendelejew.211.g: "Sfinansuj nowe laboratorium wyposażone w najnowocześniejszy sprzęt."
 mendelejew.211.h: "Oszczędź na wydatkach uniwersytetu, aby zakupić nowe przyrządy."
 mendelejew.211.i: "A kto to wszystko sfinansuje?"
 mendelejew.212.t: "Nieznany Związek Chemiczny"
 mendelejew.212.d: "Próbując wreszcie odkryć #YELLOW pierwiastek o numerze [ROOT.Var('mendelejew_searched_variable').GetValue|0]#!, dr [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] odkrył wcześniej nieznany związek chemiczny, który może znaleźć praktyczne zastosowanie w przemyśle."
 mendelejew.212.f: "Związek chemiczny to substancja chemiczna złożona z wielu identycznych cząsteczek (lub jednostek molekularnych), zawierających atomy więcej niż jednego pierwiastka chemicznego, połączone ze sobą wiązaniami chemicznymi. Cząsteczka składająca się z atomów tylko jednego pierwiastka nie jest więc związkiem chemicznym. Związek chemiczny może zostać przekształcony w inną substancję w wyniku reakcji chemicznej, która może obejmować oddziaływania z innymi substancjami. W trakcie tego procesu wiązania między atomami mogą zostać zerwane lub mogą powstać nowe wiązania."
 mendelejew.212.g: "Świetnie!"
 mendelejew.213.t: "Asystent Chemika"
 mendelejew.213.d: "W poszukiwaniach wciąż nieodkrytego #YELLOW pierwiastka o numerze [ROOT.Var('mendelejew_searched_variable').GetValue|0]#! dr [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] otrzymuje cenne wsparcie od utalentowanego asystenta. Niektórzy koledzy uważają, że jest on wręcz zbyt dobry, by pracować jedynie jako asystent."
 mendelejew.213.f: "„Byłem po prostu zafascynowany zjawiskami chemicznymi i reakcjami, w których powstają substancje, często o uderzająco odmiennych właściwościach. Miałem nadzieję, że dowiem się coraz więcej o tym aspekcie świata”. – Linus Pauling"
 mendelejew.213.g: "Asystent powinien skupić się na badaniach nad pierwiastkami."
 mendelejew.213.h: "Wspieraj ten talent naukowy."
 mendelejew.214.t: "Nieudane Próbki"
 mendelejew.214.d: "Jak się okazuje, dr [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] przez wiele miesięcy pracował na zanieczyszczonych próbkach i w związku z tym wyciągał z nich błędne wnioski."
 mendelejew.214.f: "„Jak to, że to tylko przebarwiony kwarc?!”"
 mendelejew.214.g: "Niepowodzenie Naukowe"
 mendelejew.215.t: "Współpraca Geologiczno-Chemiczna"
 mendelejew.215.d: "Wymiana pomysłów z geologiem dr [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] dostarczyła naszemu chemikowi dr [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] przełomowych inspiracji w poszukiwaniach nowego pierwiastka."
 mendelejew.215.f: "Bez nowych minerałów skatalogowanych przez geologów odkrycie wielu pierwiastków chemicznych nie byłoby możliwe. W 1839 roku niemiecko-szwajcarski chemik Christian Friedrich Schönbein ukuł termin „geochemia”. Opiera się ona na założeniu, że należy nie tylko opisywać minerały, lecz także rozumieć ich skład materialny i leżące u ich podstaw procesy chemiczne."
 mendelejew.301.t: "Wyizolowanie Nowego Pierwiastka"
 mendelejew.301.f: "„W przyrodzie nic nie powstaje, nic nie ginie, wszystko się przemienia. Powinniśmy ufać wyłącznie faktom: przedstawia nam je Natura i nie mogą nas zwieść”. – Antoine Lavoisier"
 mendelejew.301.g: "Triumf Nauki"
 mendelejew.302.d: "Chociaż #YELLOW pierwiastek o numerze [ROOT.Var('mendelejew_examined_variable').GetValue|0]#! jest uznawany za „odkryty”, jego istnienie nie zostało jeszcze potwierdzone, ponieważ nie udało się go wyizolować. [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetFullName] postanowił dokładniej zbadać ten pierwiastek, zweryfikować jego istnienie i ostatecznie uzyskać go w czystej postaci."
 mendelejew.302.f: "Pierwszy nowoczesny wykaz pierwiastków przedstawił Antoine Lavoisier w swoim dziele „Elementy chemii” z 1789 roku, które zawierało 33 pierwiastki, w tym światło i kaloryk. Do 1818 roku Jöns Jacob Berzelius ustalił masy atomowe 45 spośród 49 pierwiastków uznawanych wówczas za istniejące. W układzie okresowym Dmitrija Mendelejewa z 1869 roku uwzględniono 63 pierwiastki."
 mendelejew.302.g: "Mam nadzieję, że laboratorium jest ubezpieczone."
 mendelejew.303.t: "Obce Państwo wyizolowuje Nowy Pierwiastek"
 mendelejew.303.d: "Złe wieści! Wygląda na to, że zagranicznemu chemikowi udało się wyizolować #YELLOW pierwiastek o numerze [ROOT.Var('mendelejew_examined_variable').GetValue|0]#!. Wszystkie wysiłki i nadzieje związane z inwestycjami dr [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] poszły na marne. Może uda nam się zbadać inny pierwiastek?"
 mendelejew.303.f: "„To właściwy pomysł, ale niewłaściwy moment. Jeśli odniosłem większy sukces niż wielu ludzi wokół mnie, zawdzięczam to przede wszystkim — śmiem twierdzić, niemal wyłącznie — nieustannej pracowitości”. – John Dalton"
 mendelejew.303.g: "Ta naukowa chwała powinna była przypaść nam..."
 mendelejew.311.t: "Synteza Chemiczna"
 mendelejew.311.d: "Podczas prób wyizolowania #YELLOW pierwiastka o numerze [ROOT.Var('mendelejew_examined_variable').GetValue|0]#! dr [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] z powodzeniem przeprowadził syntezę, która wcześniej uchodziła za niezwykle wymagającą pod względem technicznym. Skorzystają na tym zarówno gospodarka i przemysł, jak i nauka."
 mendelejew.311.f: "Synteza chemiczna (łączenie chemiczne) to sztuczne przeprowadzanie reakcji chemicznych w celu uzyskania jednego lub kilku produktów. Odbywa się to poprzez działania fizyczne i chemiczne, zazwyczaj obejmujące jedną lub więcej reakcji. We współczesnych zastosowaniach laboratoryjnych proces ten jest powtarzalny i niezawodny. Synteza chemiczna obejmuje jeden lub więcej związków (zwanych odczynnikami lub substratami), które ulegają przemianom w określonych warunkach. Do otrzymania pożądanego produktu można zastosować różne rodzaje reakcji. W tym celu związki należy zmieszać w naczyniu reakcyjnym, takim jak reaktor chemiczny lub zwykła kolba okrągłodenna. Wiele reakcji wymaga pewnego rodzaju obróbki lub procedury oczyszczania, aby wyodrębnić produkt końcowy."
 mendelejew.311.g: "Świetnie"
 mendelejew.312.t: "Dysocjacja Chemiczna"
 mendelejew.312.d: "Dr [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] poczynił postępy w próbach wyizolowania #YELLOW pierwiastka o numerze [ROOT.Var('mendelejew_examined_variable').GetValue|0]#!. Dysocjacja chemiczna pozwoliła mu zrobić decydujący krok naprzód."
 mendelejew.312.f: "Dysocjacja w chemii to ogólny proces, w którym cząsteczki (lub związki jonowe, takie jak sole, albo kompleksy) rozpadają się na inne cząstki, takie jak atomy, jony lub rodniki, zazwyczaj w sposób odwracalny. Na przykład, gdy kwas rozpuszcza się w wodzie, wiązanie kowalencyjne między atomem elektroujemnym a atomem wodoru zostaje zerwane w wyniku rozszczepienia heterolitycznego, w wyniku czego powstaje proton (H+) i jon ujemny. Dysocjacja jest procesem przeciwnym do asocjacji lub rekombinacji."
 mendelejew.312.g: "Fantastyczny"
 mendelejew.313.t: "Zaniedbane Obowiązki"
 mendelejew.313.d: "Nie jest tajemnicą, że [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetFullName] wykorzystuje swoje obecne zadanie badawcze dotyczące wyizolowania #YELLOW pierwiastka o numerze [ROOT.Var('mendelejew_examined_variable').GetValue|0]#! jako wymówkę, by unikać pozostałych, nieprzyjemnych obowiązków akademickich. Rektor wezwał go teraz do wyjaśnień, ponieważ nie pojawia się na zebraniach uniwersyteckich ani na wykładach."
 mendelejew.313.f: "Nie ma wymówki, która byłaby zbyt błaha, by uniknąć tych uciążliwych stworzeń, które zwykle noszą miano „studentów”."
 mendelejew.313.g: "Dr [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] ma ważniejsze sprawy na głowie."
 mendelejew.313.h: "Dr [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] musi wypełniać pozostałe obowiązki."
 mendelejew.314.t: "Nieprzewidziana Reakcja Chemiczna"
 mendelejew.314.d: "Podczas jednego z ostatnich eksperymentów chemicznych dr [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] najwyraźniej błędnie ocenił kilka drobnych szczegółów i przez to nieco zaniżył przewidywaną siłę reakcji."
 mendelejew.314.f: "Gazety wciąż donoszą o nieudanej akcji straży pożarnej, podczas której użycie wody zamiast ograniczyć szkody jeszcze bardziej nasiliło reakcję chemiczną. Kilku studentów skarżyło się na zatrucie dymem, a w laboratorium doszło do kilku urazów. Budynek uniwersyteckiego Wydziału Nauk Ścisłych został poważnie uszkodzony i będzie musiał zostać zamknięty na wiele miesięcy, a być może nawet lat. Lokalna gazeta oczekiwała na oświadczenie dr. [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName], z którym jednak nie udało się skontaktować po jego krótkim pobycie w szpitalu, ponieważ wybrał się na turniej tenisowy."
 mendelejew.314.g: "Katastrofa!"
 mendelejew.315.t: "Współpraca Innowacyjno-Chemiczna"
 mendelejew.315.d: "Inżynier Dr. [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] ulepszył część sprzętu naukowego, aby pomóc Dr. [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] w planowanym wyizolowaniu pierwiastka."
 mendelejew.315.f: "Na początku XX wieku chemicy i inżynierowie mechanicy współpracowali w przemyśle chemicznym, na przykład przy projektowaniu reaktorów i kotłów, z których część musiała wytrzymywać znaczne obciążenia (600 °C i 100 barów). Na styku tych dziedzin rozwinęła się ostatecznie nowa dyscyplina — inżynieria chemiczna, której absolwenci dominują dziś w przemyśle chemicznym."
 mendelejew.401.t: "Eksperyment Chemiczny"
 mendelejew.401.d: "Aby odpocząć od swojej zwykłej pracy, Dr. [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] chce wykorzystać przestrzeń w najważniejszym laboratorium kraju do przeprowadzenia eksperymentu chemicznego. Szkło laboratoryjne jest już przygotowane."
 mendelejew.401.f: "Zdarza się, że chemicy postanawiają oddać się własnej pasji zamiast wykonywać powierzone im zadania. Niekiedy przynosi to cenne odkrycia, na przykład ulepszenie nawozów lub opracowanie metod przemysłowej produkcji substancji chemicznych. To, czy takie działania zakończą się sukcesem, zależy w dużej mierze od cech charakteru, umiejętności i doświadczenia chemika."
 mendelejew.401.g: "Nie mogę się doczekać, żeby zobaczyć, co wyniknie z tego eksperymentu!"
 mendelejew.401.h: "Skończ z tymi bzdurami."
 mendelejew.402.t: "Udany Eksperyment"
 mendelejew.402.d: "Dr. [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] miał rację i rzeczywiście zdobył cenną wiedzę dzięki swojemu ostatniemu eksperymentowi. Nowo opracowana metoda chemiczna wpłynie na rolnictwo i przemysł w nadchodzących latach. Może kiedyś proces ten zostanie nazwany na cześć [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetHerHim]?"
 mendelejew.402.f1: "Dzięki [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetHerHis] badaniom eksperymentalnym [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetFullName] udało się opracować lepszy nawóz, który zapowiada obfitsze plony w nadchodzących latach."
 mendelejew.402.f2: "Dzięki [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetHerHis] rewolucyjnej metodzie [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetFullName] położył podwaliny pod opracowanie specjalnego nawozu, który znajdzie zastosowanie przede wszystkim w rolnictwie plantacyjnym."
 mendelejew.402.f3: "Nowy proces, który [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetFullName] udostępnił przemysłowi, powinien znacząco usprawnić produkcję w zakładach chemicznych."
 mendelejew.402.g: "Sukces!"
 mendelejew.403.t: "Nieudany Eksperyment"
 mendelejew.403.d: "Chociaż koledzy wiązali duże nadzieje z pracą [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetFullName], [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetHerHis] eksperyment zakończył się niepowodzeniem. Zamiast tego [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetSheHe] stracił cenny czas, który lepiej byłoby poświęcić na badania nad pierwiastkami."
 mendelejew.403.f: "„Cóż, nie wyszło tak, jak się spodziewałem. Przynajmniej laboratorium nie wyleciało w powietrze!”"
 mendelejew.403.g: "Rozczarowujące."
