 dubois_remount_megalodon_modifier: "Zmontuj Ponownie Megalodona"
 dubois_paleontological_research_modifier_desc: "Kraj ogarnęła ekscytacja odkryciami. Każda wydobyta skamieniałość jest oknem na zaginiony świat, a każde wykopalisko pobudza wyobraźnię zarówno naukowców, jak i szerokiej publiczności. Poszukiwanie śladów pradawnego życia stało się narodową pasją, podsycając naukowe ambicje i powszechny zachwyt."
 dubois_paleontologist_travell_to_location_modifier_desc: "Z notatnikami w dłoni i marzeniami o prehistorycznych olbrzymach nasz paleontolog wyrusza w trudny teren, stawiając czoła żywiołom w poszukiwaniu tajemnic zaklętych w kamieniu. Podróż ta jest w równym stopniu przygodą, co przedsięwzięciem naukowym—wyścigiem z czasem, by odkryć pozostałości odległej przeszłości Ziemi."
 dubois_paleontologist_travell_from_location_modifier_desc: "Po miesiącach badań terenowych paleontolog powraca, zmęczony, lecz triumfujący. Torby pękają w szwach od skamieniałości, szkiców i opowieści o odkryciach. Każde znalezisko zapowiada zmiany w podręcznikach historii i inspiruje nowe pokolenie"
 notification_dubois_paleontological_report_notification_tooltip: "Z wyprawy naszego [concept_dubois_paleontologist] nadszedł raport paleontologiczny opisujący niezwykłe znaleziska skamielin."
 notification_dubois_java_man_notification_tooltip: "Nowe sprawozdanie paleoantropologiczne profesora Dubois wskazuje na odkrycie pradawnego przodka człowieka, nazwanego roboczo „Człowiekiem z Jawy”."
 notification_dubois_animal_breeding_notification_tooltip: "Jedno ze zwierząt w naszym zoo doczekało się potomstwa w niewoli. To przełom w naszej wiedzy o tym gatunku."
 ask_for_zoo_animal_proposal_third_party_accepted_name: "Prośba Zaakceptowana przez Stronę Trzecią"
 ask_for_zoo_animal_proposal_third_party_accepted_desc: "Strona trzecia zgodziła się dostarczyć nam okaz zwierzęcia do zoo. Wyprawa odbędzie się pod jej ochroną."
 ask_for_zoo_animal_proposal_third_party_declined_name: "Prośba Odrzucona przez Stronę Trzecią"
 ask_for_zoo_animal_proposal_third_party_declined_desc: "Strona trzecia odmówiła dostarczenia zwierzęcia do zoo oraz udzielenia zgody na jego pozyskanie. Być może trzeba będzie ponownie rozważyć drogi dyplomatyczne."
