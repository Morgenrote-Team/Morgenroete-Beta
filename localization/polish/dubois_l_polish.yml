 dubois_lion_baby_birth_flavor: "Dwa małe lwiątka pełzały wokół matki. Przyszły na świat zaledwie kilka tygodni temu, lecz matka przez dłuższy czas trzymała je w kryjówce. Teraz wreszcie mogły poznawać świat, bawić się i baraszkować. Były przeurocze!"
 dubois_otter_baby_birth_flavor: "Maleńka wydra po raz pierwszy weszła do wody, by popływać. Jak na pierwszy raz radziła sobie całkiem dobrze. Potem wyszła z wody i położyła się na ciepłej skale."
 dubois_jaguar_baby_birth_flavor: "Mały jaguar, mający zaledwie około 6 tygodni, podążał za matką. Wyglądał dość niezdarnie. Wkrótce jednak miał wyrosnąć na groźnego drapieżnika."
 dubois_koala_baby_birth_flavor: "Mały koala trzymał się grzbietu matki. Był już dość duży, lecz nadal od niej zależny. Nagle zerwał liść z jednego z drzew i zaczął go skubać."
 dubois_panda_baby_birth_flavor: "Mała panda wyglądała tak niewinnie. Turlała się i wydawała się dość niezdarna. Matka jednak nie spuszczała jej z oczu. Maleństwu nic nie mogło się stać."
 dubois.1250.t: "Park Narodowy Yosemite?"
 dubois.1250.d: "Wpływowi działacze ochrony przyrody chcą utworzyć Park Narodowy w dolinie Yosemite, by chronić jej wyjątkowy krajobraz. To niezwykłe miejsce oferuje zapierające dech w piersiach widoki. Pytanie brzmi: czy wolimy utworzyć Rezerwat Przyrody, czy wykorzystać dolinę do celów rolniczych, wyrębu lasów i wydobycia surowców?"
 dubois.1250.f: "„Lecz żadna świątynia wzniesiona ludzką ręką nie może się równać z Yosemite. Każda skała w ścianach doliny zdaje się tętnić życiem”.\n - John Muir"
 dubois.1250.g: "To świetny pomysł!"
 dubois.1250.h: "Właściwie to wygląda na świetne miejsce do wydobycia surowców!"
 dubois.1251.t: "Ostatnie Żubry"
 dubois.1251.d: "Żubr europejski jest bliski wyginięcia. W Puszczy Białowieskiej pozostało zaledwie kilka osobników. Do 1830 roku puszcza była chroniona, lecz po powstaniu listopadowym zlikwidowano niemal wszystkie stanowiska leśniczych. Wizyta, którą złoży [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullNameNoFormatting], może doprowadzić do ponownego objęcia puszczy ochroną jako [concept_dubois_nature_reserve]."
 dubois.1251.f: "„Puszcza Białowieska to ostatnia pierwotna puszcza Europy i ostoja ostatnich żubrów. To cud natury!”\n„Ale te drzewa można by wyciąć i ożywić naszą gospodarkę!”"
 dubois.1251.g: "Musimy chronić żubra!"
 dubois.1251.h: "Ten las doskonale nadaje się do wyrębu."
 dubois.1252.t: "Królewski Rezerwat Łowiecki w Gran Paradiso?"
 dubois.1252.d: "Polowania w Gran Paradiso są wspaniałe! Zwłaszcza że to ostatnie miejsce, gdzie żyje #b Koziorożec Alpejski#!. Po jednym z tamtejszych polowań [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullNameNoFormatting] rozważał utworzenie na tym obszarze [Concept('concept_dubois_nature_reserve','$concept_dubois_royal_hunting_reserve|q$')], by chronić ostatnie nieliczne koziorożce."
 dubois.1252.f: "„Jak ci prostacy śmią zabijać moje koziorożce? Tylko ja mam prawo na nie polować! Musimy chronić moją zwierzynę przed tymi dzikusami!”\n\n#b Historycznie, #! Park Narodowy Gran Paradiso powstał w 1922 roku, gdy Wiktor Emanuel III przekazał ziemie Królewskiego Rezerwatu Łowieckiego na utworzenie pierwszego włoskiego Parku Narodowego. Ochrona koziorożca alpejskiego nadal należała do najważniejszych zadań parku. W 1922 roku żyło w nim około 3000 koziorożców. Ich liczebność gwałtownie spadła podczas rządów faszystowskich i II wojny światowej, lecz później populacja się odbudowała i dziś w parku narodowym żyje około 4000 koziorożców."
 dubois.1252.g: "Natychmiast utwórz Królewski Rezerwat Łowiecki!"
 dubois.1252.h: "Może później..."
