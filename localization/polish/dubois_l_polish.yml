 dubois.158.d: "Nasze zoo wzbogaciło się o nowe, egzotyczne zwierzę: dziś długo wyczekiwany #O Wilkowór Tasmański#! zamieszkał na swoim nowym wybiegu."
 dubois.158.f: "Wilkowór tasmański, znany również jako tygrys tasmański, był mięsożernym torbaczem zamieszkującym Tasmanię i Australię. Wyróżniał się pręgowanym grzbietem i prowadził głównie nocny tryb życia. Wilkowory polowały samotnie, skradając się do ofiar, takich jak drobne ssaki i ptaki. Niestety, wskutek polowań i utraty siedlisk wilkowór tasmański jest dziś uznawany za gatunek wymarły."
 dubois.158.g: "Jakie urocze!"
