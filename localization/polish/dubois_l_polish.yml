 dubois.1041.t: "Europejskie Wybiegi"
 dubois.1041.d: "W europejskiej części ogrodu dominuje rozległy obszar leśny, ale znajdują się tam również inne wybiegi. Niektórzy zwiedzający jedli i pili w restauracji mieszczącej się w tradycyjnym europejskim domu o konstrukcji szachulcowej."
