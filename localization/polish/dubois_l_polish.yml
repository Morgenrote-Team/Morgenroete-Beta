 building_dubois_national_park: "Rezerwat Przyrody"
 building_dubois_national_park_desc: "Rezerwaty Przyrody to ostoje, w których dzika przyroda zyskuje przestrzeń do oddechu—gdzie prastare lasy, rozległe łąki i ukryte doliny chroni się przed nieubłaganym postępem cywilizacji. Czy to wydzielone jako królewskie tereny łowieckie, czy otoczone uznaniem jako Parki Narodowe, miejsca te dają schronienie rzadkim stworzeniom i pozwalają ujrzeć majestat natury, nienaruszony i trwały."
