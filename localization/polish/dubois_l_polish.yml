 dubois.108.t: "Heloderma Arizońska"
 dubois.108.d: "Nasz ogród zoologiczny wzbogacił się o nowe, egzotyczne zwierzę: dziś długo wyczekiwana #O Heloderma Arizońska#! zamieszkała na swoim nowym wybiegu."
 dubois.108.f: "Heloderma Arizońska to jadowita jaszczurka występująca naturalnie w południowo-zachodnich Stanach Zjednoczonych i północno-zachodnim Meksyku. Rozpoznawalna dzięki charakterystycznemu czarno-pomarańczowemu umaszczeniu, jest jedną z nielicznych jadowitych jaszczurek na świecie. Helodermy arizońskie poruszają się powoli i prowadzą głównie nocny tryb życia, żywiąc się drobnymi ssakami, ptakami i jajami. Gromadzą tłuszcz w ogonach, co pozwala im przetrwać długie okresy bez pożywienia."
 dubois.108.g: "Nie wygląda aż tak groźnie..."
 visit_gila_tt: "Odwiedzisz wybieg #o Helodermy Arizońskiej#!"
