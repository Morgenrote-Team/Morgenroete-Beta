 dubois.7.t: "Krępak Nabrzozak ewoluuje!"
 dubois.7.d: "Dr. [ROOT.Var('ito_naturalist_var').GetCharacter.GetLastName] zauważył, że wygląd krępaka nabrzozaka zmienił się w ostatnich latach, co stanowi wyraźny dowód na słuszność Teorii Ewolucji."
 dubois.7.f: "„W miarę jak brzozy, na których żyje krępak nabrzozak, ciemnieją wskutek zanieczyszczeń, obserwujemy wyraźny wzrost liczby ciemnych osobników. Ponieważ jaśniejsze ćmy są znacznie lepiej widoczne, częściej padają ofiarą drapieżników, a ciemne zaczynają przeważać.\nTo wyraźny dowód na zachodzenie ewolucji w krótkim czasie. Moje obserwacje są fascynujące i jednoznacznie potwierdzają słuszność Teorii Ewolucji”.\n\n#b Historycznie#! ewolucyjną zmianę ubarwienia krępaka nabrzozaka zauważono już w 1848 roku w Manchesterze. Dopiero w 1896 roku J. W. Tutt wykazał, że był to przypadek doboru naturalnego.\nObecnie znów przeważa jasny fenotyp krępaka nabrzozaka, ponieważ powietrze stało się czystsze, a większość brzóz ponownie ma białą korę."
 dubois.7.g: "Wyraźny dowód na ewolucję!"
