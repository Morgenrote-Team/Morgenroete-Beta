 je_dubois_native_animal: "Dokumentacja Rodzimego Zwierzęcia"
 je_dubois_native_animal_reason: "Prof. [ROOT.Var('ito_naturalist_var').GetCharacter.GetLastName] bada rodzime zwierzę w jego naturalnym środowisku. Doświadczenie, umiejętności i cechy charakteru, a także uniwersytet specjalizujący się w historii naturalnej wpływają na czas trwania tego procesu. Zwierzę, które [ROOT.Var('ito_naturalist_var').GetCharacter.GetSheHe] bada, to #ORANGE [SCOPE.GetRootScope.GetCountry.GetCustom('dubois_animal_documentation_name')]#!."
 je_dubois_native_animal_goal: "#E Postęp Przyrodnika#! osiąga #GREEN [JournalEntry.GetTotalGoalValue|V0]#! punktów."
 je_naturalist_dies_tt: "Prof. [ROOT.Var('ito_naturalist_var').GetCharacter.GetLastName] umiera"
 dubois.442.t: "Wiedza Geologiczna"
 dubois.442.d: "Podczas pobytu w górach [ROOT.Var('agassiz_geologist_var').GetCharacter.GetFullName] dokładnie zbadał górę, sporządził jej mapę i opracował naukowe wnioski. Następnego ranka zaskoczył cały zespół alpinistów mapą rzeźby terenu, na której zaznaczył niebezpieczne miejsca oraz łatwiejsze drogi wejścia na szczyt."
 dubois.442.f: "„Dlaczego to zrobiłem? Och, po prostu trochę się nudziłem, a minerały już skatalogowałem. To nic takiego! Nawet jej nie pokolorowałem...”"
 dubois.442.g: "Dzięki Bogu mamy Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName]"
 dubois.443.t: "Piękny Minerał"
 dubois.443.d: "Alpiniści narzekali już na ociągającego się geologa, który jako naukowiec był raczej ciężarem niż pomocą. Jak się jednak okazało, Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] podczas wspinaczki na szczyt odkrył rzadki surowiec."
 dubois.443.g: "Cóż za miła niespodzianka."
