 dubois.139.d: "Nasze zoo wzbogaciło się o nowe, egzotyczne zwierzę: dziś długo wyczekiwany #O Goryl#! zamieszkał na swoim nowym wybiegu."
 dubois.139.f: "Goryl, zamieszkujący lasy Afryki Środkowej, jest największą z małp człekokształtnych. Odznacza się potężną budową i inteligentnym spojrzeniem. Żyje w grupach, którym przewodzi dominujący samiec, zwany srebrnogrzbietym. Goryle są głównie roślinożerne i żywią się liśćmi, łodygami oraz owocami. Mimo swoich rozmiarów i siły są zazwyczaj łagodne i płochliwe, a większość czasu spędzają na poszukiwaniu pokarmu i odpoczynku w leśnym środowisku."
 dubois.139.g: "Są ogromne!"
