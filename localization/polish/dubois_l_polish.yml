 dubois.35.t: "Zwierzę ucieka!"
 dubois.35.d: "Gdy uczestnicy safari próbują podążać za zwierzęciem, ono nagle ucieka. Asystenci profesora [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] mogą stracić jego trop!"
 dubois.35.f: "„Wciąż daleko nam do poznania życia zwierząt i nadal badamy je z zamiarem poznania samych siebie”. -Alfred Edmund Brehm"
 dubois.35.g: "Nic nie możemy zrobić..."
 dubois.36.t: "Zwierzę atakuje!"
 dubois.36.d: "Gdy uczestnicy safari chcieli zastawić pułapki, spłoszyli zwierzę, które natychmiast zaatakowało!"
 dubois.36.f: "„Błędem jest twierdzić, że słoń to zwierzę drażliwe. Z natury jest łagodny i spokojny. Żyje w przyjaźni i pokoju z każdym stworzeniem”. -Alfred Edmund Brehm"
 dubois.36.g: "Uciekajcie, głupcy!"
 dubois.36.h: "Mimo wszystko zastawcie pułapki!"
 dubois.36.i: "Nasz przyrodnik ma wszystko pod kontrolą."
 dubois.37.t: "Wypadek na safari"
 dubois.37.d: "Uczestnicy safari przez swoją nieostrożność zadarli z niewłaściwym zwierzęciem. Zniszczyło ono wszystkie pułapki, poraniło asystentów, a następnie uciekło. Tygodnie pracy poszły na marne w ciągu zaledwie kilku godzin. Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] musiał z tego powodu odwołać safari."
 dubois.37.f: "„Jeśli kiedykolwiek widziałem magię, to właśnie w Afryce”. -Ernest Hemingway"
 dubois.37.g: "Okropne!"
 dubois.36.success_tt: "Uczestnikom safari mimo wszystko udaje się zastawić pułapki."
 dubois.36.fail_tt: "Poważny wypadek prowadzi do przedwczesnego odwołania safari."
 dubois_safari_zoologist_tt: "Jest to możliwe, ponieważ nasz Przyrodnik ma cechę Zoolog."
 dubois.38.t: "Dodatkowe Wydatki na Safari"
 dubois.38.d: "Postęp technologiczny rewolucjonizuje również safari, czy to za sprawą nowej broni, czy pojazdów."
 dubois.38.f: "„Nie było w Afryce poranka, w którym obudziłbym się nieszczęśliwy”. -Ernest Hemingway"
 dubois.38.machine_guns_tt: "Dzięki wynalezieniu karabinu maszynowego nasz zespół ma ogromną przewagę zarówno nad ludźmi, jak i zwierzętami, które mogą mu zagrażać."
 dubois.38.combustion_engine_tt: "Dzięki wynalezieniu silnika spalinowego możemy z łatwością dogonić każde zwierzę."
 dubois.38.g: "To nadaje „Heia Safari!” zupełnie nowe znaczenie."
 dubois.40.d: "Po bezowocnych poszukiwaniach, które przyniosły jedynie trudy, profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] poddaje się i wraca ze swoim zespołem do [ROOT.GetCountry.GetNameNoFlag]."
