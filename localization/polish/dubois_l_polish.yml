 dubois.1031.t: "Galerie Historii Naturalnej Australazji"
 dubois.1031.d: "Edukacyjna trasa spacerowa urządzona na wzór wystawy etnograficznej i przyrodniczej: skromne pawilony przywodzące na myśl Antypody, rzeźbione ozdoby z Oceanii oraz skały w odcieniach ochry, przypominające australijski interior. Charakterystyczną faunę Australazji prezentuje się tu dociekliwym zwiedzającym z myślą o nauce i zachowaniu stosownej powagi."
