 dubois.1039.t: "Wybieg Wilkoworów Tasmańskich"
 dubois.1039.d: "Na pogrążonym w półmroku wybiegu w zoo skryty wilkowór tasmański z gracją skrada się wzdłuż ogrodzenia. Pręgowany grzbiet i smukła sylwetka nadają mu wygląd niemal mitycznego stworzenia. Zafascynowani jego niezwykłą postacią zwiedzający gromadzą się, by obserwować to rzadkie zwierzę. Zaciekawiony jego pochodzeniem, podchodzisz do opiekuna zwierząt, by dowiedzieć się więcej."
 dubois.1039.f1: "„Wilkowór tasmański, zwany też tygrysem tasmańskim, to fascynujący przykład ewolucji zbieżnej” — wyjaśnia opiekun zwierząt. „Choć budową ciała przypomina psa i ma pręgowane futro, w rzeczywistości jest torbaczem, bliżej spokrewnionym z kangurami i koalami. Pochodzi z Tasmanii i kontynentalnej Australii, gdzie niegdyś był drapieżnikiem szczytowym. Charakterystyczne pręgi pomagały mu wtapiać się w otoczenie gęstych lasów i terenów trawiastych, na których polował”."
 dubois.1039.f2: "„Wilkowory tasmańskie polowały głównie nocą” — opowiada opiekun zwierząt. „Tropiły zdobycz dzięki wyostrzonemu wzrokowi i słuchowi, często polując samotnie lub w parach. W odróżnieniu od wielu innych drapieżników były stosunkowo ciche i zbliżały się do ofiar cierpliwie i ukradkiem. Ich dieta składała się głównie z małych i średniej wielkości zwierząt, w tym walabii, ptaków i gryzoni”."
 dubois.1039.f3: "„Wilkowory tasmańskie rzadko się odzywały, ale ich głosy zapadały w pamięć” — wyjaśnia opiekun zwierząt. „Wydawały serie skowytów, warknięć i wycia, zwłaszcza w okresie godowym lub gdy czuły się zagrożone. Odgłosy te służyły do porozumiewania się z innymi wilkoworami na duże odległości, szczególnie w gęstych lasach Tasmanii. Choć ich repertuar głosowy nie był tak zróżnicowany jak u niektórych innych drapieżników, odgłosy wilkoworów stanowiły istotny element ich zachowania i potęgowały otaczającą je aurę tajemniczości”."
