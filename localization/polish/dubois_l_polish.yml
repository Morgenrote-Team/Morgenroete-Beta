 dubois.261.t: "Systematyzacja zakończona"
 dubois.261.d: "Po latach pracy Dr. [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetLastName] opublikował [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetHerHis] teorie dotyczące pokrewieństwa w prehistorycznym świecie zwierząt i roślin. Publikacja została już doceniona przez jedną z fundacji za nowe spojrzenie na drzewo rodowe organizmów."
 dubois.261.f: "„Będę zbierał rośliny i skamieliny, a za pomocą najlepszych przyrządów prowadził obserwacje astronomiczne. Nie to jednak jest głównym celem mojej podróży. Postaram się odkryć, jak siły przyrody wzajemnie na siebie oddziałują i w jaki sposób środowisko geograficzne wpływa na zwierzęta i rośliny. Krótko mówiąc, muszę zgłębić harmonię przyrody”. -Alexander von Humboldt"
 dubois.261.g: "To naprawdę... NIEZWYKLE INTERESUJĄCE."
 dubois.262.t: "Drzewo Rodowe Zwierzęcia"
 dubois.262.d: "Po porównaniu krajowych i zagranicznych doniesień o skamielinach pewnego gatunku zwierzęcia Dr. [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetLastName] doszedł do nowych wniosków. [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetSheHe] podważa dotychczasowe ustalenia dotyczące ewolucji tego gatunku."
 dubois.262.f: "„Pochłonięty szczegółowymi badaniami, nie dostrzegałem całości, która tymczasem niepostrzeżenie wyłaniała się z mojej pracy. Kiedy jednak ukończyłem w Paryżu porównywanie gatunków kopalnych, postanowiłem dla ułatwienia późniejszego przeglądu sporządzić ich wykaz według kolejności występowania w formacjach geologicznych. Chciałem w ten sposób dokładniej określić ich cechy i wyraźniej je uwydatnić poprzez samo zestawienie. Jakaż była moja radość i zdumienie, gdy odkryłem, że najprostsze wyliczenie ryb kopalnych według ich następstwa geologicznego stanowiło zarazem pełny obraz naturalnych związków między poszczególnymi rodzinami! Można więc było odczytać rozwój rodowy całej gromady z dziejów stworzenia, w których określone było występowanie rodzajów i gatunków należących do poszczególnych rodzin. Jednym słowem, następstwo rodowe ryb odpowiada doskonale ich klasyfikacji zoologicznej, i to właśnie tej, którą sam zaproponowałem”. -Louis Agassiz"
 dubois.262.g: "Czy mamy to zwierzę w zoo?"
 dubois.263.t: "Niewielki Nabytek"
 dubois.263.d: "Podczas badań Dr. [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetLastName] nawiązał kontakt z innym paleontologiem. Dzięki negocjacjom [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetSheHe] zdołał nabyć skamielinę potwierdzającą jego najnowszą hipotezę, choć część kosztów poniósł uniwersytet."
 dubois.263.f: "„Na wezwanie anatomii porównawczej każda kość i każdy jej fragment powracały na swoje miejsce. Brak mi słów, by wyrazić radość, jaką sprawiało mi odkrywanie kolejnych cech i obserwowanie, jak stopniowo potwierdzają się wszystkie wnioski, które z nich wyprowadziłem. Stopy odpowiadały cechom, na które wskazywały zęby, a zęby zgadzały się z tym, co wcześniej wywnioskowałem z budowy stóp. Kości podudzi i ud oraz wszystkie łączące je części kończyn pasowały do siebie dokładnie tak, jak je ułożyłem, zanim odkrycie kompletnych szczątków potwierdziło moje przypuszczenia. Krótko mówiąc, każdy gatunek został niejako odtworzony na podstawie jednego tylko elementu jego budowy”. -William Buckland"
 dubois.263.g: "Czy było warto?"
 dubois.264.t: "Sugestie Geologiczne"
 dubois.264.d: "Podczas rozmowy z [GetPlayer.MakeScope.Var('agassiz_geologist_var').GetCharacter.GetFullName] o występowaniu skamielin w warstwach skalnych [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetFullName] zdobył cenne nowe informacje dotyczące określania ich wieku."
 dubois.264.f: "„Dlaczego nikt nie dostrzegł, że to właśnie skamieliny dały początek teorii powstania Ziemi i że bez nich nikomu nawet nie przyszłoby do głowy, iż nasz glob kształtował się w kolejnych epokach”. -Georges Cuvier"
 dubois.264.g: "Ach, ta synergia geologii i paleontologii!"
 dubois.265.t: "Imponujący wykład"
 dubois.265.d: "Dr. [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetLastName] wygłosił w tym semestrze na swoim uniwersytecie cykl wykładów, które spotkały się z wielkim uznaniem i są uważane za inspirujące dla rozwoju paleontologii. Wielu nowych studentów zapisało się na zajęcia z tej dziedziny."
 dubois.265.f: "„Gdy zagłębiamy się w kolejne pokłady i warstwy, odkrywając pod kamieniołomami Montmartre’u lub w łupkach Uralu zwierzęta, których skamieniałe szczątki należą do przedpotopowych cywilizacji, umysł ogarnia zdumienie na widok miliardów lat i milionów ludów, o których zapomniały zarówno zawodna pamięć ludzka, jak i niezniszczalna tradycja boska, a których prochy, nagromadzone na powierzchni naszego globu, tworzą dwie stopy ziemi dającej nam chleb i kwiaty”. -Honoré de Balzac"
 dubois.265.g: "Popularny profesor!"
