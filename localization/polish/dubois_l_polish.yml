 dubois.1059.t: "Wybieg Heloderm Arizońskich"
 dubois.1059.d: "Wybieg helodermy arizońskiej tworzył surowy krajobraz piaszczystego terenu i skalnych szczelin. Początkowo wyraziste czarne i pomarańczowe łuski jaszczurki doskonale wtapiały się w otoczenie. W końcu udało ci się ją dostrzec. Powoli wyłaniała się z zacienionej nory, a jej gruba skóra, pokryta łuskami przypominającymi paciorki, połyskiwała w świetle, gdy ostrożnie przemierzała wybieg."
 dubois.1059.f1: "Na rozgrzanym słońcem wybiegu w zoo samotna heloderma arizońska powoli przemierza skalisty teren, a jej charakterystyczne czarne i pomarańczowe łuski lśnią w promieniach słońca. Niespieszne, niemal ociężałe ruchy tej jadowitej jaszczurki przyciągają uwagę zaciekawionych zwiedzających. Zaintrygowany jej niezwykłym wyglądem i zachowaniem, podchodzisz do opiekuna zwierząt, by dowiedzieć się więcej.\n„Heloderma arizońska jest jedną z nielicznych jadowitych jaszczurek na świecie” — wyjaśnia opiekun. „Porusza się powoli, oszczędzając energię w surowym pustynnym środowisku. W odróżnieniu od wielu innych drapieżników nie polega na szybkości, lecz na silnym jadzie, którym obezwładnia ofiary, takie jak drobne ssaki i ptaki. Jej jaskrawe ubarwienie ostrzega potencjalnych drapieżników, że nie jest łatwą zdobyczą”."
 dubois.1059.f2: "Na skalistym wybiegu heloderma arizońska kryje się częściowo pod dużym głazem, wysuwając co chwila rozwidlony język, by badać zapachy w powietrzu. Widok tego stworzenia o prehistorycznym wyglądzie, skórze pokrytej łuskami przypominającymi paciorki i potężnych szczękach fascynuje zwiedzających. Zaciekawiony jej zwyczajami żywieniowymi, szukasz opiekuna zwierząt, by dowiedzieć się więcej.\n„Helodermy arizońskie mają powolny metabolizm i mogą przeżyć, zjadając zaledwie kilka obfitych posiłków rocznie” — opowiada opiekun. „Silnymi szczękami rozgniatają jaja ptaków i gadów, jeden ze swoich ulubionych pokarmów. Po posiłku mogą gromadzić tłuszcz w ogonach, co pozwala im przetrwać długie okresy bez jedzenia. To przystosowanie ma kluczowe znaczenie dla przetrwania na suchej pustyni, gdzie pożywienia bywa niewiele”."
 dubois.1059.f3: "Obserwując helodermę arizońską na jej pustynnym wybiegu, zauważasz, jak ostrożnie wspina się po skałach i zagląda w szczeliny. Jej niespieszne ruchy i metodyczny sposób badania otoczenia wzbudzają twoje zainteresowanie. Chcąc dowiedzieć się więcej o tym intrygującym zachowaniu, podchodzisz do opiekuna zwierząt.\n„Helodermy arizońskie z natury prowadzą nocny tryb życia” — wyjaśnia opiekun. „Większość dnia spędzają ukryte w norach lub pod skałami, unikając skrajnego upału. Gdy wychodzą z kryjówek, poruszają się niezwykle ostrożnie, wykorzystując wyostrzony węch do odnajdywania zdobyczy lub bezpiecznego miejsca na odpoczynek. Samotniczy i skryty tryb życia pozwolił im dobrze radzić sobie w jednych z najbardziej niegościnnych środowisk”."
