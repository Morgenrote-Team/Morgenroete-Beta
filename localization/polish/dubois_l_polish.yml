 dubois.138.d: "Nasze zoo wzbogaciło się o nowe, egzotyczne zwierzę: dziś długo wyczekiwana #O Surykatka#! zamieszkała na swoim nowym wybiegu."
 dubois.138.f: "Surykatka to niewielki przedstawiciel rodziny mangustowatych żyjący w Afryce. Surykatki są niezwykle towarzyskie i żyją w grupach liczących do 30 osobników. Zazwyczaj zamieszkują nory lub jaskinie, w których mogą ukryć się przed drapieżnikami. Zwykle przynajmniej jedna surykatka wypatruje zagrożeń i ostrzega grupę. Zwierzęta pełnią wartę na zmianę."
 dubois.138.g: "Jakie urocze!"
