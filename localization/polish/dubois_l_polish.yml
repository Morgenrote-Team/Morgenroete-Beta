 dubois_skeleton_has_no_rhoetosaurus_loc: "#tooltip:[GetRawTextTooltipTag('dubois_skeleton_has_no_rhoetosaurus_loc_tt')] @skeleton_rhoetosaurus_inactive! #!"
 dubois_skeleton_has_no_rhoetosaurus_loc_tt: "W twojej Kolekcji Paleontologicznej nie ma #V Retozaura#!. Do jego zrekonstruowania potrzebujesz kości z #V Australii#!.[GetPlayer.GetCustom('dubois_rhoetosaurus_discoverer_type')]"
 dubois_rhoetosaurus_discoverer_loc: "\n\nTen Dinozaur został po raz pierwszy odkryty i złożony w roku [GetGlobalVariable('dubois_rhoetosaurus_year_global_var').GetValue|V0] przez [GetGlobalVariable('dubois_rhoetosaurus_discoverer_global_var').GetCountryDefinition.GetName]"
 dubois.3000.t: "Czy Dr. [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] traci panowanie nad [SCOPE.sCharacter('dubois_naturalist_scope').GetHerHis] umysłem?"
 dubois.3000.d: "Twój [concept_dubois_naturalist], [SCOPE.sCharacter('dubois_naturalist_scope').GetFullName], zdaje się zapominać o coraz większej liczbie rzeczy. Może nadszedł czas, by odwołać [SCOPE.sCharacter('dubois_naturalist_scope').GetHerHim] ze stanowiska Przyrodnika?"
 dubois.3000.f: "Chwileczkę... Gdzie postawiłem herbatę? Och, czy to tutaj? A może to była ta trująca roślina? I dlaczego w kącie pokoju siedzi ogromny pająk?"
 dubois.3000.g: "Nie sądzę, by [SCOPE.sCharacter('dubois_naturalist_scope').GetSheHe] powinien dalej pracować."
 dubois.3000.h: "Pff, to zupełnie normalne!"
 dubois.3010.t: "Okazy utracone"
 dubois.3010.d: "Dr. [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] nagle nie może znaleźć niektórych okazów w [SCOPE.sCharacter('dubois_naturalist_scope').GetHerHis] kolekcji. [SCOPE.sCharacter('dubois_naturalist_scope').GetSheHe] twierdzi, że po prostu... zniknęły."
 dubois.3010.f: "Jestem absolutnie pewien, że dopiero co umieściłem je tutaj, na tych szpilkach. Ale teraz ich nie ma. To były wspaniałe owady! Może po prostu odłożyłem je gdzie indziej?"
 dubois.3010.g: "Jak to zniknęły? Myślałem, że są martwe..."
 dubois.3011.t: "Przyrodnik sprzedaje część kolekcji"
 dubois.3011.d: "Najwyraźniej profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] zaciągnął ogromne długi. Wygląda na to, że jedynym rozwiązaniem, jakie [SCOPE.sCharacter('dubois_naturalist_scope').GetSheHe] dostrzegł, była sprzedaż części naszej kolekcji."
 dubois.3011.f: "„Nie, proszę, nie róbcie nic mojej małej Hope. Ona nic złego nie zrobiła! Zrobię wszystko, żeby zdobyć pieniądze! Błagam! Tylko jej nie krzywdźcie. To tylko mała, niewinna pajęczyca!”"
 dubois.3011.g: "[SCOPE.sCharacter('dubois_naturalist_scope').GetSheHe|U] zrobił co?!"
