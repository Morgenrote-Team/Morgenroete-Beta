 dubois.901.t: "Kongres Przyrodników: Miejsce Człowieka w Przyrodzie"
 dubois.901.d: "Zakończono przygotowania do być może najważniejszego kongresu naukowego minionych i nadchodzących lat. Jego tematem będzie nie mniej doniosła kwestia niż klasyfikacja taksonomiczna człowieka — jeden z najbardziej zapalnych tematów od czasu, gdy [SCOPE.sCharacter('dubois_darwin_scope').GetFullName] sformułował teorię ewolucji. Zaproszenia zostaną wysłane do wszystkich przyrodników na świecie. Obradom będzie przewodniczył profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName]."
 dubois.901.f: "W XIX wieku spór o klasyfikację taksonomiczną człowieka zaostrzył się w związku ze sformułowaniem teorii ewolucji. Choć od dawna wiedziano o podobieństwie ludzi do małp człekokształtnych, a Karol Linneusz zaliczył już człowieka do rzędu naczelnych, nadal zgłaszano liczne zastrzeżenia. Aby podkreślić wyjątkowość człowieka, Johann Friedrich Blumenbach wyodrębnił go spośród pozostałych naczelnych, zaliczając do „dwurękich” (Bimana), a pozostałe do „czwororękich” (Quadrumana). Klasyfikacja ta, choć stosunkowo nowa, zyskała popularność w kręgach akademickich, między innymi u wpływowego brytyjskiego paleontologa Richarda Owena. Dla zwolenników teorii ewolucji była to sytuacja nie do przyjęcia, a dla anatomów — koszmar. Oznaczała bowiem, że według tego podziału goryl był bliżej spokrewniony z pawianem stepowym niż z człowiekiem."
 dubois.901.g: "Świat nauki powinien u nas zagościć."
 dubois.902.d: "[SCOPE.sCountry('dubois_congress_host_country').GetName] zaprasza na międzynarodowy kongres naukowy. Jego tematem będzie klasyfikacja taksonomiczna człowieka w świetle teorii ewolucji. Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] otrzymał serdeczne zaproszenie."
 dubois.902.g: "Nie przegapimy tego wydarzenia."
 dubois.904.t: "Miejsce Człowieka w Przyrodzie: Wyjątkowa Istota czy po prostu kolejna Małpa?"
 dubois.904.d: "Już po dwóch wykładach stało się jasne, jak zaciekłe spory budzi kwestia będąca w istocie jedynie procedurą porządkową w zoologii. Pytanie o to, jak należy klasyfikować człowieka, wystawia na próbę nawet przyjaźnie między uczonymi. Najwyraźniej na pierwszy plan wysunęło się już nie samo zagadnienie naukowe, lecz związane z nim konsekwencje."
 dubois.904.f: "Gdy początkowo przywołano argumenty morfologiczne, debata zaostrzyła się wokół konkretnego zagadnienia anatomicznego: mózgu. [SCOPE.sCharacter('dubois_hippocampus_defender_scope').GetFullName] przedstawił kilka prac poświęconych różnicom anatomicznym między małpami a ludźmi, podkreślając niemożność przekształcenia się małp w ludzi. Twierdził, że ludzie stanowią nie tylko odrębny rząd naczelnych, lecz także osobną podgromadę ssaków, odrębną od wszystkich pozostałych naczelnych i ssaków w ogóle. Prof. [SCOPE.sCharacter('dubois_hippocampus_defender_scope').GetLastName] oparł tę klasyfikację na trzech cechach, z których najważniejszą było jego twierdzenie, że tylko ludzki mózg posiada hipokamp mniejszy. Sprzeciwił się temu [SCOPE.sCharacter('dubois_hippocampus_attacker_scope').GetFullName], utrzymując, że te rzekomo wyjątkowe cechy występują również u małp człekokształtnych. Zapytany, czy potrafiłby pogodzić się z myślą, że jest jedynie zmodyfikowaną małpą, Prof. [SCOPE.sCharacter('dubois_hippocampus_attacker_scope').GetLastName] odparł: „Bycie zmodyfikowaną małpą jest równie godne szacunku jak bycie zmodyfikowaną gliną”."
 dubois.904.g: "Człowiek jest wyjątkowy w królestwie zwierząt."
 dubois.904.h: "Ludzie są bliżej spokrewnieni z małpami, niż dotychczas sądzono."
 dubois.905.t: "Cenione Przemówienie"
 dubois.905.d: "[SCOPE.sCharacter('dubois_naturalist_scope').GetFullName] wygłosił wykład przed gronem uczonych zgromadzonych w kraju [SCOPE.sCountry('dubois_congress_host_country').GetName], inspirując zarówno publiczność, jak i młodych naukowców."
 dubois.905.f: "„Owen powiada: jak widzicie,\nMózg szympansa\nJest zawsze niezmiernie mały,\nA jego tylny »róg«\nPozbawiony końcówki,\nZaś »hipokampa« nie ma wcale.\nNa to Huxley odpowiada,\nŻe Owen kłamstwa opowiada\nI przekręca cytat z łaciny;\nŻe jego fakty nie są nowe,\nA błędy nader liczne,\nCo szkodzi jego reputacji”.\n -Sir Philip Egerton."
 dubois.905.g: "Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] robi niemałe wrażenie."
 dubois.906.t: "Cenny Wkład w Debatę"
 dubois.906.d: "Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] wygłosił znakomity wykład naukowy, który poszerzył horyzonty środowiska akademickiego podczas kongresu naukowego w kraju [SCOPE.sCountry('dubois_congress_host_country').GetName]. Jego wpływ będzie zapewne długotrwały."
 dubois.906.f: "„Miał bardzo dziwne teorie na wiele tematów. Pewnego razu zabrał nawet głos na posiedzeniu Brytyjskiego Towarzystwa Naukowego i oświadczył, że małpy mają w mózgach hipopotamy większe, tak samo jak ludzie. Było to stwierdzenie wstrząsające; bo gdyby tak było, co stałoby się z wiarą, nadzieją i miłością milionów nieśmiertelnych dusz? Możesz sądzić, że istnieją inne, ważniejsze różnice między tobą a małpą, takie jak zdolność mówienia, budowania maszyn, odróżniania dobra od zła, odmawiania modlitw i inne podobne drobiazgi; ale to tylko dziecięce mrzonki, moje drogie dziecko. Polegać można wyłącznie na wielkiej próbie hipopotama. Jeśli masz w mózgu hipopotama większego, nie jesteś małpą, choćbyś miał cztery ręce, ani jednej stopy i był bardziej małpi niż wszystkie małpy ze wszystkich małpiarni”. -Charles Kingsley"
 dubois.907.t: "Kwestia Hipopotama"
 dubois.907.d: "Debata o miejscu człowieka w królestwie zwierząt odbiła się już szerokim echem wśród opinii publicznej — i to w niezbyt pochlebny sposób. Pisarz [SCOPE.sCharacter('dubois_hippopotamus_writer').GetLastName] już wyśmiewa spór uczonych w jednym ze swoich dzieł."
 dubois.907.f: "„Ogromnie nas ucieszyło i, mogę śmiało powiedzieć, zaciekawiło odkrycie, że wszyscy mamy w mózgach hipopotamy. Ja co prawda nigdy żadnego u siebie nie poczułem, ale może zdechł i dlatego się nie ruszał, a wtedy, rzecz jasna, to się nie liczy, rozumiecie. Każdy ma mózg w głowie, chyba że jest szkieletem; a to coś owijało ogon wokół różnych rzeczy jak małpa — wiem, bo widziałem na własne oczy. To profesor Huxley mówił, że to jest w ogonie — oczywiście nie pana Huxleya, tylko małpy. Tyle że małpy nie mają ogonów, więc nie bardzo to rozumiem. A potem ten drugi pan, który wstał na końcu, wiecie, pan Flower, powiedział, że małpa ma to wszędzie, na całym ciele. Cała w hipokampach, od stóp do głów, biedaczka, jak pies oblepiony kleszczami! Ciekawe, dlaczego nie nacierają jej karku siarczanem miedzi, jak się to robi wyżłom. No dobrze. Na czym to ja skończyłem? Ach, tak! Profesor Owen powiedział, że małpy wcale tego nie mają, tylko rząd dwurękich, czyli ty i ja. Cóż, on wie najlepiej. Zresztą oni wszyscy wiedzą najlepiej, bo to piekielnie mądrzy ludzie. Więc albo jeden ma rację, a wszyscy pozostali się mylą, albo jeden się myli, a wszyscy pozostali mają rację — rozumiecie? Ciekawe, dlaczego nie rozstrzygną tego rzutem monetą”. -Charles Kingsley"
 dubois.907.g: "To przezabawne."
 dubois.908.t: "Wymiana intelektualna lub materialna"
 dubois.908.d: "Nasz przyrodnik znalazł trochę wolnego czasu między obradami kongresu i zastanawia się teraz, jak najlepiej go wykorzystać."
 dubois.908.f: "[SCOPE.sCharacter('dubois_naturalist_scope').GetFullName] poznał na kongresie naukowym kilku interesujących kolegów po fachu, którzy chętnie wymieniliby poglądy na różne zagadnienia naukowe. Wymiana doświadczeń byłaby niezwykle owocna. Z drugiej strony profesor mógłby też wykorzystać ten czas na wymianę okazów chrząszczy i roślin ze swoich zbiorów z innymi uczonymi..."
 dubois.908.g: "Wymień poglądy z kolegami po fachu."
 dubois.908.h: "Wymień okazy z kolegami po fachu."
 dubois.909.t_unique: "Człowiek jest wyjątkowy"
 dubois.909.t_primate: "Człowiek i Małpy są spokrewnieni"
 dubois.909.d_unique: "Przyrodnicy zakończyli długotrwałe spory. Człowiek zajmuje szczególne miejsce w królestwie zwierząt — tak stwierdzili uczeni w deklaracji końcowej, którą przewodniczący kongresu uroczyście odczytał dzisiaj."
 dubois.909.d_primate: "Niektórzy profesorowie ze złością opuścili salę, gdy na zakończenie kongresu odczytano deklarację końcową. Uczeni stwierdzili, że ludzie są bliżej spokrewnieni z małpami, niż wcześniej sądzono."
 dubois.909.f_unique: "„U człowieka mózg osiąga wyższy stopień rozwoju, a różnica ta jest większa i wyraźniejsza niż ta, która odróżnia poprzednią podgromadę od podgromady stojącej niżej. Półkule mózgowe nie tylko przykrywają płaty węchowe i móżdżek, lecz także sięgają dalej ku przodowi niż te pierwsze i dalej ku tyłowi niż ten ostatni. Ich tylna część jest tak silnie rozwinięta, że anatomowie uznali ją za trzeci płat; jest on właściwy wyłącznie rodzajowi Homo, podobnie jak »róg tylny komory bocznej« i »hipokamp mniejszy«, które charakteryzują tylny płat każdej półkuli. Powierzchniowa istota szara mózgu osiąga u człowieka największą rozległość dzięki liczbie i głębokości zakrętów. Z tą najwyższą formą mózgu wiążą się szczególne zdolności umysłowe, a ich następstwa wspaniale ukazują znaczenie cech mózgu. Moja ocena tych cech skłania mnie do uznania rodzaju Homo za przedstawiciela nie tylko odrębnego rzędu, lecz także odrębnej podgromady ssaków, dla której proponuję nazwę »ARCHENCEPHALA«”. -Richard Owen"
 dubois.909.f_primate: "„Nie ulega wątpliwości, że małpą najbardziej zbliżoną do człowieka jest szympans albo goryl. W ogólnych proporcjach ciała i kończyn występują znaczne różnice między gorylem a człowiekiem. Jednak pod każdym względem, pod którym proporcje goryla odbiegają od ludzkich, pozostałe małpy różnią się od goryla jeszcze bardziej. Wobec tego takie różnice proporcji nie mogą stanowić podstawy do wyodrębnienia osobnego rzędu. W tak istotnej kwestii jak pojemność czaszki ludzie różnią się między sobą bardziej niż od małp, podczas gdy małpy najniższe różnią się pod tym względem od najwyższych w takim samym stosunku, w jakim te ostatnie różnią się od człowieka. Jest zatem oczywiste, że choć uzębienie najwyższej małpy znacznie różni się od ludzkiego, to jeszcze bardziej odbiega od uzębienia małp niższych i najniższych. Tak więc niezależnie od tego, który układ narządów badamy, porównanie jego odmian u kolejnych grup małp prowadzi do jednego i tego samego wniosku: różnice w budowie oddzielające człowieka od goryla i szympansa nie są tak wielkie jak te, które oddzielają goryla od małp niższych”. -Thomas Henry Huxley"
 dubois.909.g: "Człowiek jest koroną stworzenia."
 dubois.909.h: "Czy jesteśmy tylko nagimi małpami?"
 dubois.921.t: "Kongres Paleontologiczny: Wyginięcie Dinozaurów"
 dubois.921.d: "Nasz naród ma zaszczyt zorganizować jeden z najważniejszych kongresów paleontologicznych. Naukowcy z całego świata przybędą do kraju [SCOPE.sCountry('dubois_congress_host_country').GetName], by odpowiedzieć na pytanie, dlaczego dinozaury wyginęły. [SCOPE.sCharacter('dubois_paleontologist_scope').GetFullName] wybrał już swój ulubiony hełm korkowy, który założy na czas przemówienia inauguracyjnego."
 dubois.921.f: "Pytanie o przyczynę wyginięcia dinozaurów nurtuje ludzkość od dnia, w którym znaleziono pierwszą kość dinozaura i uznano ją za szczątek nieznanego gatunku. Przed XIX wiekiem zadowalano się wyjaśnieniem, że dinozaury były zwierzętami, które nie dostały się na arkę Noego podczas potopu. Wraz z rozwojem nowych metod geologicznych i paleontologicznych obraz stawał się coraz bardziej złożony. Idea potopu przetrwała jeszcze u Georges’a Cuviera, choć w odwróconej postaci: uważał on, że poziom mórz opadł, a gady, które według niego zamieszkiwały tereny podmokłe, utraciły swoje siedliska. Była to tylko jedna z licznych teorii, które miały pojawić się w ciągu kolejnego półtora wieku — żadna nie dawała zadowalającej odpowiedzi."
 dubois.921.g: "Czy kiedykolwiek poznamy odpowiedź na to pytanie?"
 dubois.922.d: "[SCOPE.sCountry('dubois_congress_host_country').GetName] zaprasza na międzynarodowy kongres naukowy. Jego tematem będzie przyczyna wyginięcia dinozaurów. Profesor [SCOPE.sCharacter('dubois_paleontologist_scope').GetLastName] otrzymał serdeczne zaproszenie."
 dubois.922.f: "To będzie wydarzenie dekady."
 dubois.923.t: "[SCOPE.sCharacter('verrier_astronomer_scope').GetLastName] i jego Rewolucyjna Teoria"
 dubois.923.d: "Tuż przed rozpoczęciem kongresu najbardziej ceniony astronom naszego kraju, [SCOPE.sCharacter('verrier_astronomer_scope').GetFullName], ogłosił, że ma własny pomysł na to, co mogło doprowadzić do wyginięcia dinozaurów: uderzenie planetoidy! Prosi o rozpowszechnienie tej hipotezy wśród paleontologów."
 dubois.923.f: "Choć profesor [SCOPE.sCharacter('verrier_astronomer_scope').GetLastName] nie był paleontologiem, znał zjawiska kosmiczne i wiedział, jak niszczycielska bywa ich siła. W XIX wieku na niebie pojawiło się kilka niezwykłych, wielkich komet, a katastrofa tunguska pokazała, do czego zdolne są odłamki skał z kosmosu. Astronom nie ograniczył się do obliczeń teoretycznych, lecz zlecił także zebranie próbek zawierających nietypowe materiały z określonych warstw skalnych, w tym z końca kredy. Pozostawał w stałym kontakcie z profesorem [SCOPE.sCharacter('dubois_paleontologist_scope').GetLastName]. Obaj sławni uczeni wymieniali poglądy i, korzystając z najnowszej wiedzy fizycznej, doszli do wniosku, że uderzenie planetoidy było najbardziej logicznym wyjaśnieniem końca ery dinozaurów — nie tyle ze względu na samo uderzenie, ile na jego konsekwencje ekologiczne i klimatyczne."
 dubois.923.g: "To fascynujący pomysł."
 dubois.923.h: "To kompletny absurd."
 dubois.924.t: "Dlaczego Dinozaury wyginęły?"
 dubois.924.d: "Paleontolodzy zebrali się na obrady, lecz ich opinie na temat masowego wymierania pod koniec kredy są podzielone. Nie ma tu dwóch czy trzech obozów, lecz cała mieszanina hipotez, które często niewiele różnią się od siebie stopniem prawdopodobieństwa i niedorzeczności."
 dubois.924.f: "Od czasu odkrycia dinozaurów krążą najrozmaitsze fantastyczne teorie wyjaśniające, dlaczego zniknęły one z powierzchni Ziemi. Oto tylko niektóre z nich."
 dubois.924.a: "Przyczyną było uderzenie planetoidy."
 dubois.924.g: "Poziom mórz opadł, niszcząc siedliska."
 dubois.924.h: "Zawartość tlenu w ziemskiej atmosferze wzrosła do poziomu bardziej sprzyjającego ptakom i ssakom."
 dubois.924.i: "Niekorzystne cechy doprowadziły do ewolucyjnej ślepej uliczki."
 dubois.924.j: "Spadek aktywności płciowej doprowadził do wyginięcia."
 dubois.924.k: "Patologiczny Gigantyzm!"
 dubois.924.l: "Konkurencja ze Ssakami, które zjadały ich jaja."
 dubois.924.m: "Zmiana Klimatu."
 dubois.924.n: "Erupcje Wulkaniczne."
 dubois.924.o: "Bombardowanie promieniowaniem kosmicznym lub ultrafioletowym."
 dubois.924.p: "Mózgi dinozaurów zmniejszały się przez cały mezozoik, aż w końcu stały się one zbyt głupie, by przetrwać."
 dubois.929.t: "Kongres Paleontologiczny dobiega końca"
 dubois.929.d_asteroid: "W deklaracji końcowej uczestnicy kongresu paleontologicznego ogłosili swoją decyzję: jedynie hipoteza, że uderzenie planetoidy przypieczętowało zagładę dinozaurów, wydaje się przekonująca."
 dubois.929.d_climate: "Profesor z kraju goszczącego kongres rozpoczął dziś wykład pełnym przygnębienia westchnieniem, po czym z ubolewaniem wskazał zmianę klimatu jako przyczynę wyginięcia dinozaurów."
 dubois.929.d_sex: "Nieco zawstydzony i często odchrząkując, przewodniczący kongresu paleontologicznego wyjaśnił, że przyczyną zagłady dinozaurów był brak rozmnażania płciowego. Wtrącenie profesora Tottenhama, że zawsze uważał swoją żonę za brontozaura, odnotowano w protokole z naganą."
 dubois.929.d_mammals: "Po wielu dniach dyskusji paleontolodzy doszli do wniosku, że konkurencja ze ssakami zwiastowała koniec dinozaurów. Podejrzewają, że gryzonie szczególnie chętnie zjadały ich jaja."
 dubois.929.d_fat: "Przewodniczący kongresu paleontologicznego odczytał dziś z pełną powagą i przekonaniem dokument popierający pogląd, że dinozaury stały się po prostu zbyt wielkie i zbyt grube, co doprowadziło do ich nieuchronnego wyginięcia. Uwaga profesora Tottenhama, że w takim razie stanowisko przewodniczącego wkrótce się zwolni, spotkała się z publiczną naganą."
 dubois.929.d_stupid: "Odczytana dziś deklaracja końcowa kongresu paleontologicznego szczegółowo wyjaśnia, że mózgi dinozaurów zmniejszały się przez miliony lat, aż w końcu stały się one po prostu zbyt głupie, by przetrwać. Uwaga profesora Tottenhama, że podobny los byłby pożądany także w przypadku niektórych kolegów po fachu jeszcze przed kongresem, nie została uwzględniona w protokole."
 dubois.929.f: "Właśnie w to naprawdę wierzyli niektórzy wybitni naukowcy XIX i początku XX wieku."
 dubois.929.g: "Przyczyną było uderzenie planetoidy."
 dubois.929.h: "Niezręczna teoria, ale jedyna zaakceptowana."
