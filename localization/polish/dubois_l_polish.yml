 dubois_sherry_bribe_modifier: "Łapówka w Postaci Sherry"
 je_prehistoric_scenery: "Prehistoryczna Diorama"
 je_prehistoric_scenery_reason: "Dr. [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetLastName] przygotowuje obecnie salę na uniwersytecie, w której wiernie odtworzone rośliny i zwierzęta z innej epoki przybliżą zwiedzającym przeszłość Ziemi."
 je_prehistoric_scenery_goal: "#E Postęp Paleontologa#! osiąga #GREEN [JournalEntry.GetTotalGoalValue|V0]#! punktów."
 dubois_no_university_for_scenery_tt: "[GetPlayer.GetName] nie ma uniwersytetu, w którym można stworzyć #V Prehistoryczną Dioramę#!."
 dubois.271.t_cretaceous: "Prehistoryczna Diorama: Kreda"
 dubois.271.t_jurassic: "Prehistoryczna Diorama: Jura"
 dubois.271.t_triassic: "Prehistoryczna Diorama: Trias"
 dubois.271.d: "Dr. [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetLastName] zaprosił dziś grupę kolegów po fachu do obejrzenia nowej Prehistorycznej Dioramy. Uczeni chwalili [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetHerHis] dbałość o szczegóły."
 dubois.271.f_cretaceous: "Klimat kredy był na ogół ciepły i wyrównany. Umożliwiał niektórym dinozaurom docieranie do wysokich szerokości geograficznych na obu półkulach, przynajmniej w miesiącach letnich. Bieguny były wolne od lodu, a poziom mórz był w związku z tym bardzo wysoki i osiągnął maksimum we wczesnym turonie. Dopiero pod koniec kredy, w mastrychcie, nastąpiło ochłodzenie i wyraźne cofnięcie się mórz. Podobnie jak w poprzedzającej ją jurze, wśród lądowej makrofauny i megafauny dominowały dinozaury. We wczesnej kredzie wśród roślin przeważały widłaki, paprocie, paprocie drzewiaste, miłorzębowe, benetyty i rośliny iglaste. W późnej kredzie liczne drzewa liściaste, takie jak klony, dęby i orzechy, konkurowały z drzewami iglastymi, takimi jak sekwoje i geinicje. Trawy rozprzestrzeniły się na lądach, znacznie zmieniając przebieg procesów erozyjnych."
 dubois.271.f_jurassic: "Wczesna jura mogła zakończyć się potężnymi erupcjami w wielkiej prowincji magmatycznej na Gondwanie. Doprowadziło to do globalnego ocieplenia, któremu towarzyszyło masowe wymieranie drugiego rzędu. Ważnym składnikiem flory stały się wówczas rośliny iglaste o drobnych liściach, przystosowane do suszy, a wśród dinozaurów rozwinęły się nowocześniejsze formy zauropodów. Jura, zwłaszcza późna, była pierwszym okresem rozkwitu dinozaurów, z wielkimi teropodami, takimi jak allozaur, i olbrzymimi zauropodami, takimi jak diplodok i żyrafatytan. We florze dominowały rośliny nagonasienne, w tym iglaste, takie jak sekwoje i sosny, a także miłorzęby i sagowce. Jurę nazywa się również erą sagowców ze względu na ich powszechne występowanie. Paprocie i skrzypy tworzyły runo leśne."
 dubois.271.f_triassic: "W triasie niemal nieprzerwanie panował ciepły klimat, choć na początku tego okresu podlegał silnym wahaniom. Wydaje się również, że na całym świecie było dość sucho. Przyczyną był kształt superkontynentu Pangei i wynikający z niego efekt monsunowy. W głębi lądu prawdopodobnie rozciągały się rozległe pustynie. Przełom permu i triasu wiąże się z głębokimi zmianami w świecie zwierząt. Były one tak drastyczne, że ze względu na znaczne różnice w zapisie kopalnym granica między permem a triasem oddziela nie tylko dwa okresy, lecz także dwie ery w dziejach Ziemi: paleozoik i mezozoik. W następstwie tych przemian liczne grupy bezkręgowców morskich całkowicie lub na stałe znikają z zapisu kopalnego. Istotnym zmianom ulega również fauna kręgowców lądowych. Zapoczątkowane już w permie przemiany w świecie roślin, polegające na ustępowaniu paproci na rzecz roślin nagonasiennych, trwały nadal w triasie."
 dubois.271.g: "Przepiękne!"
 dubois.272.t: "Materiały"
 dubois.272.d: "[GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetFullName] wykazuje się niezwykłym perfekcjonizmem podczas prac nad prehistoryczną dioramą. Właśnie dlatego [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetSheHe] wyczerpał już cały swój budżet."
 dubois.272.f: "Czy to przez jajo dinozaura zamówione specjalnie na wystawę? Wyborne nasiona? A może napiwek w wysokości 300 funtów, który tragarz otrzymał za przyniesienie prawdziwej ziemi? Z powodów, które Dr. [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetLastName] z trudem potrafi wyjaśnić, pieniądze po prostu przeciekają mu przez palce."
 dubois.272.g: "Więcej pieniędzy na jakieś sztuczne rośliny i jaszczurki? Nie ma mowy!"
 dubois.272.h: "Chcemy pięknej dioramy, nie szczędźcie wydatków!"
 dubois.273.t: "Niedorzeczne zajęcie?"
 dubois.273.d: "Niektórzy „koledzy” ze środowiska akademickiego drwią z Dr. [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetLastName] z powodu [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetHerHis] obsesji na punkcie prehistorycznych dioram, już nie tylko za [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetHerHis] plecami, lecz także całkiem otwarcie. Część badaczy uważa [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetHerHis] zajęcie za niedorzeczne hobby, a sam projekt za przedsięwzięcie z gruntu śmieszne."
 dubois.273.f: "„Niezwykła rzadkość form przejściowych w zapisie kopalnym pozostaje tajemnicą zawodową paleontologii”. -Søren Kierkegaard"
 dubois.273.g: "Paleontologia to poważna nauka!"
 dubois.273.h: "Trzeba przyznać, że nasz paleontolog jest nieco ekscentryczny."
 dubois.273.i: "Kup tym złośliwym uczonym kilka butelek sherry, żeby dali doktorowi spokój."
 dubois.274.t: "Zainteresowanie Studentów"
 dubois.274.d: "Od kilku tygodni studenci uniwersytetu z rosnącym zainteresowaniem przyglądają się pracom Dr. [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetLastName] nad prehistoryczną dioramą. To, co jedni uważają za ekscentryczne przedsięwzięcie, dla innych jest źródłem inspiracji. Nagle odległa przeszłość staje się namacalna."
 dubois.274.f: "Dinosaur Court w parku Crystal Palace w południowym Londynie to park tematyczny poświęcony geologii i paleontologii. Słynie z rzeźb zwierząt wykonanych przez Benjamina Waterhouse’a Hawkinsa w połowie XIX wieku, będących pierwszymi na świecie pełnowymiarowymi przedstawieniami wymarłych zwierząt. Park miał służyć zarówno rozrywce, jak i edukacji odwiedzających go mieszkańców wiktoriańskiej Anglii. Na wyspach jeziora, w części kompleksu urządzonej w stylu angielskiego ogrodu krajobrazowego, zaprojektowano ekspozycję odzwierciedlającą historię geologiczną Wielkiej Brytanii. Zgodnie z koncepcją opartą na pomyśle geologa Davida Thomasa Ansteda każdą z trzech wysp przyporządkowano jednej z er fanerozoiku i urządzono z wykorzystaniem osadów powstałych w danym okresie. Doradcą Hawkinsa był paleontolog Richard Owen. Choć przedstawienia prehistorycznych zwierząt jeszcze w tym samym stuleciu przestały odpowiadać ówczesnemu stanowi badań, wzbudziły wielkie zainteresowanie i pozwoliły szerokim rzeszom ludności zdobyć podstawową wiedzę paleontologiczną."
 dubois.274.g: "Nowe pokolenie uczonych!"
 dubois.274.h: "Powinni pomóc Doktorowi."
 je_dubois_safari_hippopotamus: "Afrykańskie Safari: Hipopotam"
 je_dubois_safari_hippopotamus_reason: "Podczas afrykańskiego safari można dzięki wytrwałemu tropieniu i zastawianiu pułapek schwytać duże zwierzęta, a następnie przetransportować je do [concept_dubois_zoo]. Podczas jednego safari można schwytać tylko jedno zwierzę. To, czy należy zastawiać pułapki, czy podążać tropem zwierzęcia, zależy od jego gatunku. Z reguły duże, powolne zwierzęta wymagają większej liczby pułapek, a szybkie — intensywniejszego tropienia. Safari trwa 300 dni. Jeśli do tego czasu nie uda się schwytać zwierzęcia, uczestnicy safari opuszczą kraj z pustymi rękami.\n\nAgresywne zwierzęta mogą się bronić i atakować podczas prób schwytania. Płochliwe zwierzęta uciekają. [concept_dubois_naturalist] z cechą Zoolog potrafi rozwiązać takie sytuacje bez negatywnych konsekwencji. Nowe technologie, takie jak #ORANGE Karabin Maszynowy#! czy #ORANGE Silnik Spalinowy#!, ułatwiają tropienie i chwytanie zwierząt."
