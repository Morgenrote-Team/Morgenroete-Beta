 dubois.1032.t: "Wybieg Żółwia Morskiego"
 dubois.1032.d: "Pawilon #o Żółwia Morskiego#! składa się głównie z rozległego basenu z przejrzystą wodą, otoczonego niewielkimi piaszczystymi plażami. Przeszklone okno poniżej lustra wody pozwala ciekawym zwiedzającym obserwować zwierzęta w ich naturalnym środowisku."
 dubois.1032.f1: "Żółw Zielony (Chelonia mydas) to stworzenie o godnej podziwu budowie. Dzięki oliwkowemu pancerzowi i potężnym płetwom przemierza tropikalne i subtropikalne morza, odbywając niezwykle dalekie wędrówki ku plażom, do których bezbłędnie odnajduje drogę. Jego spokojne ruchy nie zdradzają wytrzymałości pozwalającej pokonywać bezkres oceanu."
 dubois.1032.f2: "Cykl rozrodczy przebiega z należytą powagą. Po godach w morzu samica nocą wychodzi na odpowiednią plażę, cierpliwie wykopuje jamę lęgową i składa w niej jaja, po czym przykrywa je piaskiem. Gdy nadejdzie pora, młode, wiedzione zarówno światłem ciał niebieskich, jak i instynktem, śpieszą ku morzu, by rozpocząć pełną niebezpieczeństw próbę przetrwania."
 dubois.1032.f3: "W gospodarstwie przyrody Żółw Zielony nie jest jedynie ozdobą. Żerując na trawie morskiej, przycina i odnawia podwodne łąki, a sporadycznie zjadając meduzy, przyczynia się do utrzymania korzystnej równowagi. W ten sposób gad ten chroni zarówno morskie pastwiska, jak i toń otwartego morza przed nadmiernym rozrostem ich mieszkańców."
 dubois.1032.k: "Wróć do Australijskich i Oceanicznych Wybiegów"
 zoo_australian_enclosures_tt: "Wrócisz do Australijskich i Oceanicznych Wybiegów Ogrodu Zoologicznego."
 dubois.1033.t: "Wybieg Manty"
 dubois.1033.d: "W ogromnym akwarium mieszka kilka #o Mant#!; przeszklony tunel pozwala zwiedzającym podziwiać te łagodne lewiatany, gdy zataczają kręgi z dostojną gracją."
 dubois.1033.f1: "Manta Olbrzymia (Mobula, powszechnie zwana mantą) należy do najszlachetniejszych płaszczek. Jej romboidalne ciało i rozległe płetwy piersiowe pozwalają jej przecinać wodę niczym żywy latawiec, a u niektórych osobników rozpiętość płetw przekracza sześć metrów. Ma łagodne usposobienie i żywi się najdrobniejszymi stworzeniami otwartego morza."
 dubois.1033.f2: "Niczym niestrudzone sprzątaczki skąpanych w słońcu mórz, manty odcedzają niezliczone organizmy planktonowe za pomocą delikatnych wyrostków filtracyjnych skrzeli, ograniczając w ten sposób nadmierny rozrost tych maleńkich rzesz. W ulubionych miejscach korzystają z usług drobniejszych ryb, które oczyszczają ich skórę — to układ wzajemnych przysług, w przyrodzie wcale nierzadki."
 dubois.1033.f3: "Przyrodnicy odnotowali u tych płaszczek skłonności towarzyskie: regularne zataczanie kręgów, wielokrotne powroty na dobrze znane żerowiska, a nawet proste zaloty polegające na miarowym krążeniu. Zachowania te świadczą o godnej uwagi pamięci i stałości zwyczajów."
 dubois.1034.t: "Wybieg Koali"
 dubois.1034.d: "Gaj eukaliptusowy, zasadzony z troską o zapewnienie cienia i schronienia, stwarza dla #o Koali#! otoczenie bardzo zbliżone do jego nadrzewnego domu."
 dubois.1034.f1: "Koala (Phascolarctos cinereus) prowadzi nadrzewny i mało ruchliwy tryb życia. Dzięki chwytnym dłoniom i przeciwstawnym palcom wspina się na eukaliptusy i wypoczywa wśród ich gałęzi, żywiąc się niemal wyłącznie liśćmi tych drzew. Powolne tętno i miarowy oddech świadczą o oszczędnej przemianie materii, przystosowanej do ubogiego pożywienia."
 dubois.1034.f2: "Matczyna opieka jest wzorowa. Maleńkie i niesamodzielne młode tuż po narodzinach dociera do bezpiecznej torby, gdzie ssie mleko i rośnie. Z czasem matka przyzwyczaja je do specyficznej diety gatunku, a później nosi je na grzbiecie, pozwalając mu poznawać dogodne miejsca wśród drzew i zasady poruszania się po nich."
 dubois.1034.f3: "Choć koala częściej milczy, niż się odzywa, posługuje się niskimi rykami i chrapliwymi odgłosami — zwłaszcza samiec — by oznajmić zajęcie terytorium i gotowość do godów. Te zaskakująco głębokie głosy niosą się daleko w ciszy gaju."
 dubois.1035.t: "Wybieg Kangura"
 dubois.1035.d: "Przypominający step wybieg, porośnięty wysoką trawą i usiany czerwonymi skałami, przeznaczono dla #o Kangurów#!, których osobliwy sposób poruszania się można tu bez pośpiechu obserwować."
 dubois.1035.f1: "Kangur Rudy (Osphranter rufus) jest mistrzem poruszania się skokami. Sprężyste ścięgna tylnych kończyn i potężny ogon pozwalają mu długo przemieszczać się susami ze znaczną prędkością; widok grupy w ruchu stanowi pouczający pokaz mechanicznych rozwiązań natury."
 dubois.1035.f2: "Opieka macierzyńska kangurów jest szczególnie interesująca. Maleńki noworodek, niewiele więcej niż żywy zarodek, samodzielnie dociera do torby, gdzie kontynuuje rozwój, przyssany do sutka. Przyrodnicy odnotowują, że matka potrafi jednocześnie wychowywać kolejne młode z godną podziwu oszczędnością sił i zasobów."
 dubois.1035.f3: "Porządek społeczny utrzymywany jest za pomocą postaw i sygnałów: tupania nogą w razie zagrożenia, syków i niskich pomruków podczas sporów oraz rytualnych pokazów samców. W ten sposób zwierzęta ustalają hierarchię i dochodzą swoich praw bez nadmiernej przemocy."
 dubois.1036.t: "Wybieg Dziobaka"
 dubois.1036.d: "Przejrzysty, chłodny strumień o zacienionych brzegach tworzy otoczenie dla #o Dziobaka#!, który większość czasu spędza w wodzie lub w norze."
 dubois.1036.f1: "Dziobak (Ornithorhynchus anatinus) to stekowiec — jajorodny ssak, którego budowa wprawiła świat nauki w zdumienie, gdy dotarły o nim pierwsze doniesienia. Miękki dziób, łapy z błoną pławną i gęste futro doskonale przystosowują go do życia w strumieniu; samiec ma na tylnej łapie jadowitą ostrogę, wobec której zaleca się ostrożność."
 dubois.1036.f2: "Jego życie rodzinne jest osobliwe. Samica przygotowuje norę, buduje gniazdo z liści i składa niewielką liczbę jaj. Młode wykluwają się ślepe i nagie, a następnie żywią się mlekiem wydzielanym na skórę matki — pozbawionej sutków — dopóki nie będą zdolne samodzielnie zdobywać pożywienia."
 dubois.1036.f3: "Choć rzadko się odzywa, dziobak oznajmia swoją obecność za pomocą śladów i zapachu; samce dość zaciekle bronią swoich terytoriów, zwłaszcza w okresie godowym. Ich nurkowanie i przeszukiwanie dna w poszukiwaniu larw owadów stanowią miły dla oka pokaz pracowitości."
 dubois.1036.f4: "#o Dziobak Pepe Zaginął w Ogrodzie#!\nOdkrycie, że jednego z naszych dziobaków — zwanego Pepe — nie można odnaleźć w jego schronieniu, wywołało krótkie poruszenie. Opiekunowie, panowie Fineasz Flynn i Ferb Fletcher, zalecają cierpliwość: „Nasz Pepe zwykł kryć się tam, gdzie nikt by nie zajrzał, i niezmiennie pojawia się z powrotem przed końcem dnia”.\n\n#o Uczony Uszedł Cało z Wypadku w Laboratorium#!\nDr. Heinz Dundersztyc omal nie odniósł obrażeń, gdy eksperyment zakończył się eksplozją. Szczęśliwym trafem — lub dzięki interwencji nieznanego dobroczyńcy w porę — uczony nie doznał trwałego uszczerbku na zdrowiu."
 dubois.1032.g: "Dziobak? Pepe Pan Dziobak!"
 dubois_unknown_hero_modifier: "Nieznany Bohater"
 dubois.1037.t: "Wybieg Kazuara"
 dubois.1037.d: "Gęsto obsadzony roślinnością zakątek, urządzony na wzór skrawka lasu deszczowego, jest domem dla #o Kazuarów Hełmiastych#! — słynnych „ogrodników” tych krain."
 dubois.1037.f1: "Kazuar Hełmiasty (Casuarius casuarius) to duży nielot, którego ciemne upierzenie i kobaltową skórę dopełnia rogowy hełm. Jako wytrawny owocożerca rozsiewa liczne nasiona leśnych roślin w nienaruszonym stanie, przyczyniając się tym samym znacząco do odnowy lasu."
 dubois.1037.f2: "Hełm, którego funkcja pozostaje przedmiotem sporów, może ułatwiać przedzieranie się przez gęstą roślinność lub przewodzenie dźwięku. Potężne nogi są uzbrojone w groźny pazur na wewnętrznym palcu; ptak używa ich raczej do stanowczej obrony niż do ataku, lecz roztropnie jest zachować respekt."
 dubois.1037.f3: "Obowiązki rodzinne są nierówno podzielone między płciami. Zazwyczaj to samiec wysiaduje jaja i prowadzi pręgowane pisklęta, podczas gdy samica odzyskuje swobodę. Taki porządek, choć nietypowy wśród ptaków, jest regułą u kazuarów."
 dubois.1038.t: "Wybieg Maoryszanki Uszatej"
 dubois.1038.d: "Rozległy basen otoczony skałami i półkami skalnymi zapewnia #o Maoryszankom Uszatym#! zarówno miejsce do wygrzewania się, jak i przestrzeń do nurkowania; możliwość podziwiania ich pod wodą niewątpliwie zachwyciłaby przyszłe pokolenia."
 dubois.1038.f1: "Maoryszanka Uszata (Phocarctos hookeri), występująca w naturze wyłącznie na południowych wyspach, to krzepki płetwonóg o ujmującym usposobieniu. W wodzie porusza się z gracją; na lądzie jest towarzyska i wierna swojej kolonii."
 dubois.1038.f2: "Dzięki opływowemu ciału i silnym przednim płetwom mknie pod falami w pogoni za rybami i głowonogami. Duże oczy, dobrze przystosowane do półmroku, pomagają jej wypatrywać zdobycz tam, gdzie światła jest niewiele."
 dubois.1038.f3: "W okresie godowym samce oznajmiają swoje panowanie głębokimi rykami i przybieraniem okazałych póz na skałach; pokazy te zazwyczaj wystarczają, by ustalić hierarchię i przyciągnąć uwagę samic. W ten sposób w kolonii lęgowej utrzymuje się porządek bez nieustannych starć."
