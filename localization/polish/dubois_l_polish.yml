 dubois.11.no: "W końcu nie można przepełniać wybiegów."
 dubois.12.t: "Przemytnicy Docierają do Siedliska Zwierząt"
 dubois.12.d: "Profesor [ROOT.Var('ito_naturalist_var').GetCharacter.GetLastName] zdołał potajemnie dotrzeć do odległego siedliska zwierząt na terytorium państwa [SCOPE.sCountry('dubois_animal_country').GetName]. Teraz pojawia się delikatna kwestia: który okaz należy „pozyskać” w imię postępu naukowego?"
 dubois.12.f: "„Jakże schwytanie dzikiego stworzenia może być niezgodne z prawem? Wszak nie posiada ono tytułu własności” — zadumał się Profesor po powrocie, gdy jeden z uczestników wyprawy delikatnie zapytał, czy ich poczynania nie wykroczyły poza granice prawa."
 dubois.13.t: "Przemytnicy Schwytani!"
 dubois.13.d: "Z państwa [SCOPE.sCountry('dubois_animal_country').GetName] docierają do nas niepomyślne wieści: niewielka grupa przemytników wysłana w celu pozyskania okazu zoologicznego została schwytana. Incydent wywołał skandal dyplomatyczny — nasz kraj został publicznie oskarżony o kłusownictwo."
 dubois.13.f: "Według doniesień grupę jako pierwsi odkryli miejscowi leśnicy, którzy niezwłocznie powiadomili władze. Nasz ambasador został następnie wezwany, by przyjąć oficjalny protest. Szczęśliwym trafem Profesor [ROOT.Var('ito_naturalist_var').GetCharacter.GetLastName] zdołał opuścić kraj przed aresztowaniami, chroniąc tym samym swoją reputację naukową przed nieodwracalnym uszczerbkiem."
 dubois.13.g: "Sprawy nie potoczyły się zgodnie z planem."
 dubois.21.t: "Prof. [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] Powraca z Rzadkimi Okazami"
 dubois.21.d: "Po rocznej wyprawie w dzikie ostępy Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetFullName] triumfalnie powrócił. Dzięki pomocy miejscowych przewodników, myśliwych i traperów uczestnikom wyprawy udało się pozyskać kilka niezwykłych [Concept('concept_dubois_zoo_animal','$concept_dubois_zoo_animals|q$')] do badań naukowych i prezentacji zwiedzającym."
 dubois.21.f: "Liczba pozyskanych zwierząt: #G [ROOT.Var('dubois_catch_animal_total').GetValue]#!"
 dubois.21.g: "Wspaniały triumf nauki i narodu!"
 dubois.31.t: "Safari się Rozpoczyna"
 dubois.31.d: "Wyprawa pod przewodnictwem cenionego Profesora [SCOPE.sCharacter('dubois_naturalist_scope').GetFullName] dotarła na kontynent afrykański. Jej cel: pozyskanie niezwykłego okazu dla narodowego [concept_dubois_zoo]. Na jakie zwierzę wyruszą łowcy?"
 dubois.31.f: "Nie wszystkie stworzenia dają się schwytać w ten sam sposób. Oto kilka ogólnych wskazówek: schwytanie słonia wymaga licznych pułapek, podczas gdy żyrafę łatwiej złapać w sidła. Lwy są niespokojne i zmieniają miejsce pobytu częściej niż ociężałe hipopotamy."
 dubois.31.g: "Wyrusz w Pogoń za Hipopotamem."
 dubois.31.h: "Wyrusz w Pogoń za Lwem Afrykańskim."
 dubois.31.i: "Wyrusz w Pogoń za Słoniem Afrykańskim."
 dubois.31.j: "Wyrusz w Pogoń za Żyrafą."
 dubois.31.k: "Wyrusz w Pogoń za Zebrą Stepową."
 dubois.32.t.hippopotamus_1: "Ogromny Hipopotam"
 dubois.32.t.hippopotamus_2: "Drugie Dostrzeżenie Hipopotama"
 dubois.32.t.hippopotamus_3: "Kolejny Hipopotam"
 dubois.32.t.lion_1: "Majestatyczny Lew"
 dubois.32.t.lion_2: "Drugie Dostrzeżenie Lwa"
 dubois.32.t.lion_3: "Kolejny Lew"
 dubois.32.t.elephant_1: "Potężny Słoń"
 dubois.32.t.elephant_2: "Drugie Dostrzeżenie Słonia"
 dubois.32.t.elephant_3: "Kolejny Słoń"
 dubois.32.t.giraffe_1: "Pełna Gracji Żyrafa"
 dubois.32.t.giraffe_2: "Drugie Dostrzeżenie Żyrafy"
 dubois.32.t.giraffe_3: "Kolejna Żyrafa"
 dubois.32.t.zebra_1: "Szybka Zebra"
 dubois.32.t.zebra_2: "Drugie Dostrzeżenie Zebry"
 dubois.32.t.zebra_3: "Kolejna Zebra"
 dubois.32.d: "Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] wytropił poszukiwane zwierzę. Teraz zespół musi cierpliwie i umiejętnie zagonić je w miejsce dogodne do schwytania."
 dubois.32.f.hippopotamus.1: "W cieniu wielkiej rzeki mieszkańcy wiosek ściszonym głosem opowiadają o bestiach, które o zmierzchu wzburzają wody. Miejscowy myśliwy wspomina niedawną noc, gdy samica hipopotama zmiażdżyła krokodyla ciężarem własnego ciała, broniąc młodego — relację tę potwierdził Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] po zbadaniu zdruzgotanych szczątków gada. Niskie ryki hipopotamów rozbrzmiewają do późnej nocy, przypominając, że zwierzęta te nie są jedynie mieszkańcami tych stron — są ich władcami."
 dubois.32.f.hippopotamus.2: "Gdy słońce przebiło się przez poranną mgłę, członkowie wyprawy dostrzegli olbrzymią postać wynurzającą się z rzeki — gruboskórą, z ciałem parującym w pierwszych promieniach dnia. Mieszkańcy wiosek nazywają te zwierzęta „bykami widmami”, gdyż znikają pod wodą bez śladu i atakują ze straszliwą siłą. Ich kły lśnią niczym polerowana kość słoniowa, a one same łatwo wpadają w gniew. Nawet lwy omijają te bestie szerokim łukiem. Lecz Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName], o nerwach ze stali i z notatnikiem w dłoni, nieustraszenie rusza naprzód."
 dubois.32.f.hippopotamus.3: "Przy obozowych ogniskach i na szlakach karawan krążą opowieści o samotnej bestii — „Behemocie z Kości Słoniowej” — która ponoć ma kostne płyty, blade i mocne niczym kamienny pancerz. Jedni mówią, że jest nieśmiertelna, inni, że jej oddech przywołuje burze. Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] uważa ją za okaz wyjątkowo wielki i sędziwy, a cześć, jaką otaczają ją miejscowe ludy, świadczy o jej niemal mitycznej randze. Gdyby udało się ją schwytać, stałaby się klejnotem każdej kolekcji zoologicznej na świecie."
 dubois.32.f.lion.1: "Przez złociste połacie sawanny przemyka cień z cesarską gracją. Lew o grzywie niczym płomień targany wiatrem nie tylko tu żyje — on tu panuje. Miejscowi tropiciele z podziwem mówią o „Królowej Sawanny”, lwicy tak silnej, że odparła całą watahę hien, broniąc swoich młodych. Nawet doświadczony Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] czuje respekt, podążając jej tropem. Sama ziemia zdaje się chylić przed nią czoła."
 dubois.32.f.lion.2: "W obozie zapada pełna napięcia cisza: ogromne ślady miarowych kroków prowadzą ku zaroślom spowitym pyłem i słonecznym blaskiem. „Złoty Władca” jest blisko — szepczą miejscowi. Ponoć stoczył walkę z samcem bawołu afrykańskiego i wyszedł z niej zakrwawiony, lecz niepokonany, a jego grzywę przyrównuje się do samego słońca w całym jego gniewie. Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] wie, że to nie jest zwykły drapieżnik. To monarcha, którego władztwo mierzy się ciszą i strachem, a jego spojrzenie zmusza do ucieczki nawet dorosłych myśliwych."
 dubois.32.f.lion.3: "Pośród grania cykad i traw kołysanych wiatrem coś się porusza. Ryk lwa — głęboki, gardłowy i donośny — przetacza się przez równiny niczym odległy grzmot. Legenda opowiada o patriarsze, którego sama obecność poskramia rywali i zatrzymuje słonie na ich drodze. W ten odwieczny dramat drapieżnika i ofiary wkracza teraz Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] — samotny uczony podążający śladami najsłynniejszego władcy przyrody."
 dubois.32.f.elephant.1: "Słońce praży rozedrganą od żaru sawannę, gdy odległy pomruk zaczyna się przybliżać. To nie grzmot — to dostojny pochód słoni. Przewodniczka stada prowadzi swych krewniaków przez pokrytą pyłem równinę, przystając jedynie w gaju akacjowym, gdzie ich trąby unoszą się niczym peryskopy ku koronom drzew. Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] obserwuje je w milczeniu przez lornetkę, poruszony nie tylko ich rozmiarami, lecz także spokojnym rytmem ich wspólnego życia. Za jego plecami rozbrzmiewają jednak szepty zniecierpliwionych mecenasów: naród nie sfinansował tej podróży dla sentymentalnych wzruszeń."
 dubois.32.f.elephant.2: "Stado porusza się z gracją zaskakującą u tak ogromnych zwierząt; każdy krok jest rozważny, każde wymieniane spojrzenie pełne znaczenia. Pod przewodnictwem doświadczonej samicy, której oczy widziały już wiele wędrówek, słonie maszerują w dostojnej jedności. O zmierzchu, przy płytkim wodopoju, rozbrzmiewa ich trąbienie — dźwięk na pograniczu muzyki i lamentu. Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName], trzymając bezczynnie notatnik w dłoni, zaczyna odczuwać wątpliwości. Czy to nauka, czy żądza widowiska każe podążać ich tropem?"
 dubois.32.f.elephant.3: "Pod rozłożystymi, wiekowymi baobabami czas zdaje się stać w miejscu. Tam Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] ogląda widok zarazem szlachetny i przejmująco smutny: grupę słoni stojących spokojnie, z wachlarzowato rozpostartymi uszami i ciosami lśniącymi niczym polerowana kość słoniowa. Nie grożą ani nie uciekają — po prostu są. A jednak wyrwanie jednego z tej wspólnoty, zamknięcie w klatce władcy tych równin, pozostawiłoby bolesny ślad w całym stadzie. Profesor zna nazwy kości i gatunków, lecz to — to coś zupełnie innego."
 dubois.32.f.giraffe.1: "Przez wiele dni członkowie wyprawy wędrowali w bezlitosnym słońcu, nie znajdując żadnego śladu poszukiwanych zwierząt. Aż pewnego ranka, gdy nad horyzontem wstawał świt, wyłoniły się sylwetki — wysokie i nieruchome niczym posągi. Na tle rudego płomienia porannego nieba szyje kilku żyraf wznosiły się ponad akacjami, tworząc żywą panoramę. Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] dał sygnał. Łowy — w imię wiedzy — rozpoczęły się."
 dubois.32.f.giraffe.2: "Gdy promienie słońca przesączały się przez drzewa niczym rozsypane złoto, żyrafy wyłoniły się spomiędzy pni. Wysokie, spokojne, o umaszczeniu przypominającym abstrakcyjne mozaiki, poruszały się jak do muzyki, którą tylko one mogły słyszeć. Urzeczony Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] z wolna zbliżał się z notatnikiem i lunetą w dłoniach. Elegancja tych stworzeń nie miała sobie równych — każdy ich krok był studium gracji. Przyrodnik wiedział, że to coś więcej niż okazja do badań zoologicznych; było to zetknięcie ze wzniosłością."
 dubois.32.f.giraffe.3: "Z dala od najbliższej osady, w głębi dziewiczego zakątka sawanny, członkowie wyprawy natrafili na samotną żyrafę, niepodobną do żadnej dotąd opisanej. Jej sierść pokrywały osobliwe plamy — niemal w kształcie gwiazd — a ruchy były niezwykle szybkie. Miejscowi przewodnicy szeptali o znaku, o świętym zwierzęciu rzadko widywanym przez ludzkie oczy. Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName], będący w równej mierze sceptykiem i uczonym, przygotował się do uważnej obserwacji. Czy rzeczywiście mógł to być odrębny podgatunek — czy jedynie złudzenie zrodzone z gry światła i legendy?"
 dubois.32.f.zebra.1: "Gdy słońce chyliło się ku zachodowi, na równinach panowała cisza, aż między ciernistymi krzewami i drzewami smaganymi wiatrem pojawiły się czarno-białe smugi. Stado zebr, spokojne i niczego niepodejrzewające, pasło się tuż poza zasięgiem. Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] obserwował je w milczeniu, zafascynowany ich pasami — zagadką ewolucji ucieleśnioną w żywych kontrastach. Pragnienie dokładniejszego zbadania zwierząt ścierało się z koniecznością pośpiechu: zbyt długa zwłoka mogła sprawić, że okazja przepadnie na zawsze."
 dubois.32.f.zebra.2: "Mijały tygodnie bezowocnych poszukiwań, aż członkowie wyprawy przypomnieli sobie istotną wskazówkę miejscowych tropicieli: zebry rzadko oddalają się od wody. Rozbili obóz w pobliżu kolejnego wodopoju, który nie wysychał, i rzeczywiście, gdy tylko zapadł zmierzch, znajome parskanie i świst ogonów zwiastowały nadejście pasiastego stada. Wreszcie druga szansa — a przy odrobinie szczęścia i ostrożności być może uda się schwytać żywy okaz."
 dubois.32.f.zebra.3: "Sawanna była niemym świadkiem przemocy: przed nimi leżały okaleczone zwłoki zebry, która niedawno padła ofiarą lwa atakującego z zasadzki. Jej śmierć, choć ponura, dostarczyła wskazówek — śladów, odgłosów, poruszenia. Przynaglani upływającym czasem członkowie wyprawy ruszyli dalej. Dotarłszy na szczyt niewysokiego grzbietu, ujrzeli scenę dzikiej harmonii: stado zebr w ruchu, których głosy były osobliwym połączeniem rżenia konia i ryku osła, a pasy zdawały się tańczyć z wiatrem. Dla Profesora [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] widok ten łączył tragedię z triumfem."
 dubois.32.g: "Poleć zespołowi zastawić pułapki."
 dubois.32.h: "Poleć zespołowi rozpocząć tropienie zwierzęcia."
 dubois.33.t: "Łąka Rzadkich Kwiatów"
 dubois.33.d.hippopotamus: "Podczas tropienia nieuchwytnego #O Hipopotama#! uczestnicy safari natrafili na łąkę pełną niezwykłych roślin. Jaskrawe kwiaty nieznanego pochodzenia przykuły uwagę profesora. [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName], zaintrygowany tym odkryciem, rozważa teraz chwilowe odstąpienie od łowów, by zaspokoić naukową ciekawość."
 dubois.33.d.lion: "Podążając tropem #O Lwa#!, członkowie wyprawy natrafili na gaj pełen rzadkich roślin o żywych barwach. Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] rozważa wstrzymanie pościgu — rośliny te mogą skrywać tajemnice równie niezwykłe jak każde ze zwierząt."
 dubois.33.d.elephant: "Podczas poszukiwań #O Słonia#! członkowie wyprawy natrafili na rzadkie kwiaty o żywych barwach. Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] najwyraźniej ma ochotę zatrzymać się na dłużej i zebrać te osobliwe rośliny."
 dubois.33.d.giraffe: "Podczas poszukiwań #O Żyrafy#! uczestnicy safari natrafili na obszar o bogatej różnorodności roślin kwiatowych. Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] zaproponował krótki postój, by zebrać próbki."
 dubois.33.d.zebra: "Podczas tropienia #O Zebry#! uczestnicy safari natrafili na osobliwy gaj pełen nieznanych roślin. Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] rozważał krótki postój, by zebrać próbki."
 dubois.33.f: "Wyprawa przystanęła, gdy Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName], wyczuwszy niezwykłą woń, nakazał zatrzymać kolumnę. Przed nimi rozciągała się polana usiana nieznanymi kwiatami o jaskrawych barwach. Nawet pobieżne oględziny wskazywały na ich możliwe właściwości lecznicze. Profesor stanął przed dylematem — poświęcić czas na zebranie tych cennych okazów botanicznych czy ruszyć dalej tropem zwierzęcia."
 dubois.33.g: "Zbierzcie kwiaty — to znalezisko jest zbyt cenne, by je zignorować."
 dubois.33.h: "Czasu jest niewiele. Wytropienie zwierzęcia musi pozostać naszym priorytetem."
 dubois.34.t: "Rój Odkryć"
 dubois.34.d.hippopotamus: "Gdy członkowie wyprawy zapuszczali się coraz głębiej na mokradła w poszukiwaniu #O Hipopotama#!, nagle zdali sobie sprawę, że Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] zniknął. Ślady jego stóp prowadzą ku zawalonej termitierze, na której połyskują chrząszcze — najwyraźniej kolejna osobliwość świata przyrody mogła odciągnąć jego uwagę i zwabić go na ubocze."
 dubois.34.d.lion: "Wśród uczestników safari tropiących #O Lwa#! niespodziewanie zapanował chaos. Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] zniknął gdzieś w zaroślach — być może zwabiony przez coś nie mniej groźnego lub fascynującego niż sam lew."
 dubois.34.d.elephant: "Safari w poszukiwaniu #O Słonia#! zostało nagle przerwane. Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] zniknął w zaroślach — być może szukając potężnego zwierzęcia, a może podążając za jakimś głębszym pytaniem, na które tylko on potrafi odpowiedzieć."
 dubois.34.d.giraffe: "Safari w poszukiwaniu #O Żyrafy#! zostało przerwane — Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] zniknął w gęstwinie bez słowa. Niepokój zaczyna narastać."
 dubois.34.d.zebra: "Safari mające na celu schwytanie #O Zebry#! zostało zakłócone — nigdzie nie można znaleźć Profesora [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName]."
 dubois.34.f: "Po krótkim odpoczynku uczestnicy safari zauważyli nagłą nieobecność swojego przywódcy. Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] wkrótce odnalazł się na szczycie wyschniętej termitiery, urzeczony kłębiącą się masą chrząszczy mieniących się opalizującym błękitem, żywą czerwienią i połyskliwą zielenią. Z dziecięcym entuzjazmem profesor katalogował owady należące, jak się zdawało, do kilku nieopisanych dotąd gatunków."
 dubois.34.g: "Zbierzcie okazy owadów do badań naukowych."
 dubois.34.h: "To nie czas na chrząszcze — ruszajmy na łowy!"
 dubois.39.t: "Udane Łowy"
 dubois.39.f: "„W Afryce wszystko kąsa, ale bakcyl safari jest najgorszy ze wszystkich”. – Ernest Hemingway"
 dubois.39.g: "Triumf nauki!"
 dubois.40.t: "Safari Dobiega Końca"
 dubois.40.d.success: "Po schwytaniu poszukiwanego zwierzęcia i zakończeniu wyprawy Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] triumfalnie powraca do kraju. Nowy okaz w Narodowym Ogrodzie Zoologicznym państwa [ROOT.GetCountry.GetNameNoFlag] niewątpliwie wzbudzi zarówno zachwyt zwiedzających, jak i zainteresowanie uczonych."
 dubois.40.d.fail: "Po miesiącach trudów i bezowocnego tropienia Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] powraca do kraju [ROOT.GetCountry.GetNameNoFlag] bez zdobyczy. Wyprawa dobiegła końca, a pokładane w niej nadzieje pozostały niespełnione."
 dubois.40.f: "„Pragnąłem tylko jednego: wrócić do Afryki. Jeszcze jej nie opuściliśmy, lecz gdy budziłem się nocą, leżałem i nasłuchiwałem, już za nią tęskniąc...” – Ernest Hemingway"
 dubois.40.g: "Pora na kolejną wyprawę."
 dubois.41.t: "Egzotyczne Rośliny"
 dubois.41.d: "Uczestnicy wyprawy natrafili na zdumiewające bogactwo egzotycznych roślin, choć nie wiadomo, czy ten bujnie porośnięty zakątek jest bezpieczny."
 dubois.41.f: "Członkowie wyprawy przeprawiali się przez rzeki, wspinali na górskie grzbiety i przedzierali przez gęste leśne poszycie. Nic jednak nie przygotowało ich na majestat tych ogromnych, kwitnących roślin — olbrzymów o szerokich liściach i kwiatach o niewiarygodnych barwach. [SCOPE.sCharacter('expedition_leader').GetFullName] początkowo zapowiedział, że nie zatrzymają się na długo, lecz potem pozwolił asystentowi badawczemu zebrać kilka próbek. Ich wartość naukowa była zbyt wielka, by ją zignorować. Mimo to w dżungli rozbrzmiewały dziwne odgłosy — ani ptasie, ani zwierzęce, być może nawet nie ludzkie — które wzbudziły niepokój przywódcy wyprawy."
 dubois.41.g: "Zbierzcie kilka próbek roślin."
 dubois.41.h: "Zbierzcie jak najwięcej okazów."
 dubois.42.t: "Motyle"
 dubois.42.d: "Ku swemu zaskoczeniu członkowie wyprawy dotarli na skąpaną w słońcu polanę, gdzie dziesiątki tysięcy motyli tańczyły w powietrzu."
 dubois.42.f: "„To kwiaty, które latają i niemal śpiewają”. – Robert Frost"
 dubois.42.g: "Nasi przyrodnicy w kraju będą zachwyceni."
 dubois.43.t: "Ryby Rzeczne"
 dubois.43.d: "Podczas przeprawy przez rzekę kilku członków wyprawy zauważyło nieznane [Concept('concept_dubois_specimen','$concept_dubois_specimens|q$')] ryb pływające na płyciźnie. Jednak [SCOPE.sCharacter('expedition_leader').GetFullName] miał własne plany."
 dubois.43.f: "Tuż pod powierzchnią wody pływały połyskujące stworzenia o barwach klejnotów — piękne, tajemnicze i zupełnie nieznane. Dla zespołu naukowego były cudem natury, który należało skatalogować. Dla przywódcy wyprawy — wielce pożądanym dodatkiem do kociołka. Spór, który potem wybuchł, trwał krótko, a ogień już płonął."
 dubois.43.g: "Zakonserwujcie i zbadajcie ryby."
 dubois.43.h: "Ugotujcie i zjedzcie ryby."
 dubois.44.t: "Utracone Próbki"
 dubois.44.d: "Kilka dni temu uczestnicy wyprawy zebrali próbki o wielkiej wartości naukowej — teraz, ku powszechnemu zmartwieniu, wszystkie zniknęły."
 dubois.44.f: "W południe nagle rozległ się krzyk alarmu. [SCOPE.sCharacter('expedition_leader').GetFullName] obawiał się zasadzki — wrogo nastawionych tubylców lub dzikich bestii — lecz był to tylko asystent badawczy, blady i roztrzęsiony. Skrzynie z owadami, liśćmi i zakonserwowanymi okazami zniknęły. Asystent zażądał, by wyprawa zawróciła, lecz tragarze odmówili, a przywódca odrzucił ten pomysł: było to zbyt niebezpieczne, a na zbieranie chwastów zmarnowano już zbyt wiele czasu. Asystent zagroził, że doniesie o tym zaniedbaniu swoim wpływowym znajomym ze świata nauki i polityki."
 dubois.44.g: "Wróćcie po własnych śladach i odzyskajcie kolekcję."
 dubois.44.h: "Zostawcie te „rupiecie” i ruszajcie dalej."
 dubois.45.t: "Cenna Kolekcja"
 dubois.45.d: "Na odległej polanie uczestnicy wyprawy odkryli samotnego przyrodnika, który przed laty porzucił cywilizację i zgromadził niezwykłą kolekcję rzadkich okazów."
 dubois.45.f: "Był wychudzony, miał potargane włosy i oczy zapadnięte od życia w samotności. Jego schronienie wypełniały jednak starannie zakonserwowane chrząszcze, motyle, nasiona oraz szkice opatrzone notatkami. [SCOPE.sCharacter('expedition_leader').GetFullName] szybko dostrzegł, że człowiek ten nie jest szaleńcem, lecz geniuszem — i że się boi. Z obawy przed wierzycielami i o własną reputację pustelnik wahał się, czy wrócić do domu. Jego kolekcja miała jednak nieocenioną wartość, zarówno naukową, jak i materialną. Kryły się tu rozmaite możliwości, nie tylko botaniczne."
 dubois.45.g: "Zakupcie kolekcję dla naszej instytucji."
 dubois.45.h: "Bardziej interesuje nas jego wiedza."
 dubois.72.t: "Odkryto Formację Geologiczną"
 dubois.72.d: "Na obszarze [SCOPE.sState('dubois_formation_state').GetName] [Concept('concept_dubois_paleontologist','$concept_dubois_paleontologists|q$')] odkryli formacje skalne liczące miliony lat. Podejrzewają, że można tam znaleźć nieznane dotąd skamieniałości."
 dubois.72.f: "Formacje z pradawnymi warstwami skalnymi są rajem dla paleontologów. We wszystkich formacjach skalnych można znaleźć drobne skamieniałości. Duże formacje mogą kryć nawet szkielety olbrzymich dinozaurów. Badania paleontologiczne tych formacji przebiegają w kilku etapach. Do wydobywania z nich skamieniałości potrzebny jest paleontolog. Będzie on samodzielnie badać formacje i co roku znajdować skamieniałości."
 dubois.72.g: "Powinniśmy przyjrzeć się temu bliżej."
 dubois.73.t: "Odkryto Wielką Formację Geologiczną"
 dubois.73.d: "Na obszarze [SCOPE.sState('dubois_formation_state').GetName] paleontolodzy odkryli formacje skalne liczące miliony lat. W tej ogromnej formacji zapewne spoczywają liczne skamieniałości, być może nawet dobrze zachowane szkielety, o jakich dotąd mogliśmy jedynie marzyć."
 dubois.101.t: "Przybycie Niedźwiedzia Polarnego"
 dubois.101.d: "W naszym ogrodzie zoologicznym zamieszkała kolejna osobliwość: długo wyczekiwany #O Niedźwiedź Polarny#! został bezpiecznie umieszczony na swoim wybiegu."
 dubois.101.f: "Niedźwiedź Polarny (*Ursus maritimus*) to potężny drapieżnik lodowatej Północy, przystosowany do życia na dryfującym lodzie morskim Arktyki. Poluje na foki w mroźnych wodach i przemierza ogromne odległości w poszukiwaniu pożywienia. Choć obdarzony niezwykłą siłą, jest mniej terytorialny niż jego krewniacy i często woli się wycofać, niż walczyć. To żywa sprzeczność — budzi lęk, a zarazem sam jest zagrożony — uosabiająca surowe piękno najzimniejszych zakątków świata."
 dubois.101.g: "Majestatyczny nowy okaz."
 dubois.102.t: "Przybycie Niedźwiedzia Grizzly"
 dubois.102.d: "W ogrodzie zoologicznym panuje wielkie poruszenie: budzący lęk i szacunek #O Niedźwiedź Grizzly#! dołączył do naszej kolekcji."
 dubois.102.f: "Niedźwiedź Grizzly (*Ursus arctos horribilis*), zwany niekiedy północnoamerykańskim niedźwiedziem brunatnym, to stworzenie o ogromnej sile i legendarnej zaciekłości. Sama jego nazwa przywodzi na myśl dwa angielskie słowa — „grizzled”, czyli siwiejący, jak jego sierść, oraz „grisly”, czyli przerażający, jak jego potęga. Niegdyś swobodnie przemierzał kontynent amerykański, dziś zaś to imponujące zwierzę stanowi świadectwo potęgi przyrody i niszczycielskich poczynań człowieka w przeszłości. To nie tylko osobliwość — to także przestroga."
 dubois.102.g: "Imponujący okaz."
 dubois.103.t: "Przybycie Bielika Amerykańskiego"
 dubois.103.d: "Dziś prezentujemy symbol narodowy i cud natury: #O Bielik Amerykański#! zdobi już naszą wolierę."
 dubois.103.f: "Bielik Amerykański (*Haliaeetus leucocephalus*) to ptak drapieżny występujący naturalnie w Ameryce Północnej, najczęściej spotykany w pobliżu rzek, jezior i wód przybrzeżnych. Jego szlachetna sylwetka i przenikliwy krzyk stały się symbolami wolności i siły. Wbrew angielskiej nazwie nie jest łysy — jego głowę pokrywają białe pióra, kontrastujące z ciemnym tułowiem. Zaradny i zdolny wykorzystać każdą okazję, cieszy się uznaniem zarówno jako drapieżnik, jak i kulturowy symbol amerykańskiej republiki."
 dubois.103.g: "Szlachetny ptak drapieżny."
 dubois.104.t: "Przybycie Bizona Amerykańskiego"
 dubois.104.d: "Nasza kolekcja staje się coraz bardziej imponująca: słynny #O Bizon Amerykański#! przemierza już nasz starannie przygotowany wybieg odtwarzający warunki prerii."
 dubois.104.f: "Bizon Amerykański (*Bison bison*), nazywany niekiedy bawołem, niegdyś przemierzał równiny Ameryki Północnej w ogromnych stadach, wśród łoskotu kopyt. Niepohamowana rzeź i ekspansja osadnictwa niemal doprowadziły te kudłate olbrzymy do wyginięcia. Ich powrót pod opiekę człowieka w warunkach niewoli stanowi świadectwo zarówno dawnej lekkomyślności, jak i dzisiejszej odpowiedzialności. To stworzenie o pradawnej sile, żywy symbol wytrwałości na przeobrażonym kontynencie."
 dubois.104.g: "Kudłaty Tytan."
 dubois.105.t: "Przybycie Pumy Florydzkiej"
 dubois.105.d: "Dziś #O Puma Florydzka#! przybywa do naszego ogrodu zoologicznego, dając zwiedzającym rzadką okazję ujrzenia tego skrytego kota."
 dubois.105.f: "Puma Florydzka (*Puma concolor coryi*) to skryty podgatunek pumy północnoamerykańskiej, zamieszkujący podmokłe lasy i subtropikalne zarośla południowo-wschodnich Stanów Zjednoczonych. Ten zwinny drapieżnik o jasnej sierści, z ciemnymi końcówkami ogona i uszu, częściej daje się usłyszeć niż zobaczyć. Jego ciche odgłosy — ćwierkanie, warczenie i syczenie — kontrastują z bezszelestnymi krokami. Przez długi czas tępiona, a dziś chroniona, pozostaje jednym z najrzadszych dużych ssaków Ameryki Północnej."
 dubois.105.g: "Zjawa mokradeł."
 dubois.106.t: "Przybycie Aligatora Missisipijskiego"
 dubois.106.d: "Groźny relikt minionej epoki znalazł u nas nowy dom: przybył #O Aligator Missisipijski#!."
 dubois.106.f: "Aligator Missisipijski (*Alligator mississippiensis*) to potężny gad i władca mokradeł. Jako drapieżnik szczytowy, a zarazem inżynier ekosystemu, kształtuje swoje otoczenie, wykopując wodopoje i regulując liczebność populacji swoich ofiar. Jego głębokie ryki rozbrzmiewają na bagnach zarówno podczas zalotów, jak i przy manifestowaniu dominacji. Mimo groźnego wyglądu to pradawne stworzenie odgrywa kluczową rolę w utrzymaniu równowagi swojego siedliska, a teraz także w edukacji zwiedzających."
 dubois.106.g: "Zęby i groza."
 dubois.107.t: "Przybycie Aksolotla"
 dubois.107.d: "Pod naszą opiekę trafia zagadkliwy cud wodnego świata: #O Aksolotl#! jest już prezentowany zwiedzającym."
 dubois.107.f: "Aksolotl (*Ambystoma mexicanum*) to salamandra prowadząca przez całe życie wodny tryb życia, pochodząca z pradawnych jezior Meksyku. Wyróżnia się tym, że zachowuje cechy młodociane przez całe życie, osiągając dojrzałość bez przechodzenia przeobrażenia. Jego zdumiewająca zdolność do regeneracji utraconych kończyn, a nawet fragmentów serca czy mózgu, od pokoleń fascynuje naukowców. Badany już od czasów von Humboldta, pozostaje symbolem biologicznej tajemnicy i zdolności przystosowawczych."
 dubois.107.g: "Żywy cud natury."
 dubois.111.t: "Przybycie Leniwca Pstrego"
 dubois.111.d: "Osobliwy skarb z koron drzew znalazł nowy dom w naszym ogrodzie: #O Leniwiec Pstry#! został ostrożnie umieszczony na swoim wybiegu."
 dubois.111.f: "Leniwiec Pstry (*Bradypus variegatus*) to powolny ssak nadrzewny występujący w neotropikalnych obszarach Ameryki Środkowej i Południowej. Preferuje korony drzew, gdzie spędza większość życia zawieszony grzbietem w dół, schodząc na dno lasu jedynie raz na osiem dni, by się wypróżnić. Zajmuje wyjątkowo niewielki obszar, często ograniczając się do jednego lub dwóch ulubionych gatunków drzew. Mimo swej ospałości jest mistrzem kamuflażu i symbolem ewolucyjnej cierpliwości."
 dubois.111.g: "Najpowolniejszy filozof."
 dubois.112.t: "Przybycie Jaguara"
 dubois.112.d: "Stąpając bezszelestnie, z płonącymi oczami, #O Jaguar#! przemyka teraz w cieniu bujnej roślinności na wybiegach naszego ogrodu zoologicznego."
 dubois.112.f: "Jaguar (*Panthera onca*) to drapieżnik szczytowy tropikalnych obszarów obu Ameryk i trzeci co do wielkości gatunek kota na świecie. Wyróżnia się muskularną budową, efektowną sierścią pokrytą rozetami oraz wyjątkowo silnym zgryzem, dzięki któremu potrafi przebić czaszkę ofiary jednym ugryzieniem. Jego nazwa pochodzi od słowa *yaguara* z języków tupi-guarani, oznaczającego „tego, który zabija jednym skokiem”. Skryty i samotniczy, kot ten jest mistrzem bezszelestnego podkradania się i atakowania z zaskoczenia w gęstych lasach deszczowych."
 dubois.112.g: "Wcielenie skrytości."
 dubois.113.t: "Przybycie Mrówkojada Wielkiego"
 dubois.113.d: "Osobliwy owadożerca zamieszkał wśród nas: #O Mrówkojad Wielki#! stawia pierwsze kroki w swoim nowym domu."
 dubois.113.f: "Mrówkojad Wielki (*Myrmecophaga tridactyla*) to największy gatunek mrówkojada, zamieszkujący tereny trawiaste i lasy Ameryki Środkowej i Południowej. Ten samotniczy ssak wyróżnia się wydłużonym pyskiem i językiem, który może wysuwać na długość do 60 cm, oraz potężnymi pazurami służącymi do rozrywania termitier i mrowisk. Choć porusza się niezgrabnie, jest doskonale przystosowany do swojej wyspecjalizowanej diety i trybu życia. Mimo łagodnego wyglądu w obliczu zagrożenia potrafi zaciekle się bronić."
 dubois.113.g: "Arystokrata wśród owadożerców."
 dubois.114.t: "Przybycie Pancernika Dziewięciopaskowego"
 dubois.114.d: "Stworzenie okryte żywym pancerzem wbiega na nasz wybieg: przybył #O Pancernik Dziewięciopaskowy#!."
 dubois.114.f: "Pancernik Dziewięciopaskowy (*Dasypus novemcinctus*) to najszerzej rozpowszechniony gatunek pancernika w obu Amerykach. Rozpoznawalny dzięki segmentowanemu pancerzowi kostnemu i płochliwemu usposobieniu, jest sprawnym kopaczem i owadożercą. Jako jeden z ważniejszych uczestników Wielkiej Amerykańskiej Wymiany Faunistycznej w ostatnich dziesięcioleciach znacznie rozszerzył swój zasięg na północ. Do jego osobliwych sposobów przemieszczania się należą unoszenie się na wodzie i chodzenie po dnie rzek, co czyni go niezwykłym przykładem biologicznej wytrzymałości i zdolności przystosowawczych."
 dubois.114.g: "Osobliwość w pancerzu."
 dubois.115.t: "Przybycie Kondora Wielkiego"
 dubois.115.d: "Niegdyś szybujący wysoko ponad urwiskami i szczytami, #O Kondor Wielki#! rozpościera teraz swe potężne skrzydła w naszej wolierze."
 dubois.115.f: "Kondor Wielki (*Vultur gryphus*) należy do największych ptaków latających na świecie pod względem rozpiętości skrzydeł i masy ciała. Zamieszkuje Andy oraz wybrzeża Pacyfiku w Ameryce Południowej. Ten padlinożerca odgrywa kluczową rolę ekologiczną w swoich górskich siedliskach. Jego nieopierzona głowa i szyja zmieniają barwę pod wpływem emocji lub temperatury, a ogromne skrzydła pozwalają mu szybować godzinami bez jednego machnięcia. Otaczany czcią w mitologii andyjskiej i uznawany za symbol wolności, jest zarazem majestatyczny i zagrożony wyginięciem."
 dubois.115.g: "Władca prądów wznoszących."
 dubois.116.t: "Przybycie Manata Karaibskiego"
 dubois.116.d: "Łagodny pływak z karaibskich płycizn wynurzył się pod naszą opieką: #O Manat Karaibski#! jest już z nami."
 dubois.116.f: "Manat Karaibski (*Trichechus manatus*) to powolny wodny roślinożerca występujący w ciepłych wodach przybrzeżnych Karaibów, Zatoki Meksykańskiej i południowo-wschodnich Stanów Zjednoczonych. Nazywane niekiedy „krowami morskimi”, manaty pasą się na podwodnej roślinności i słyną z łagodnego usposobienia. Mimo swoich rozmiarów są zwinnymi pływakami, napędzanymi potężnymi ogonami w kształcie wiosła. Choć nie mają naturalnych drapieżników, dotkliwie ucierpiały wskutek ekspansji człowieka, zderzeń z łodziami i utraty siedlisk."
 dubois.116.g: "Wodny filozof."
 dubois.117.t: "Przybycie Sajmiri Wiewiórczej"
 dubois.117.d: "Niewielka ciałem, lecz obdarzona ogromnym urokiem, #O Sajmiri Wiewiórcza#! dołączyła do naszej menażerii."
 dubois.117.f: "Sajmiri (*rodzaj Saimiri*) to wysoce towarzyskie naczelne zamieszkujące lasy tropikalne Ameryki Środkowej i Południowej. Ważą mniej niż kilogram, zwinnie się wspinają, szybko skaczą i odznaczają się niespożytą ciekawością. Żyją w dużych stadach pod przewodnictwem dominujących samic, a ich codzienność wypełnia złożona komunikacja — ćwierkanie, skrzeki i gwizdy odzwierciedlające skomplikowane więzi społeczne. Wyraziste pyszczki i nieposkromiona energia czynią je zarówno obiektem badań, jak i ulubieńcami zwiedzających."
 dubois.117.g: "Mali akrobaci o wielkim uroku."
 dubois.121.t: "Przybycie Rysia Iberyjskiego"
 dubois.121.d: "Do naszej menażerii dołączył nowy, skryty mieszkaniec: rzadki i pełen gracji #O Ryś Iberyjski#! zamieszkał już na swoim wybiegu."
 dubois.121.f: "Ryś Iberyjski (*Lynx pardinus*) to krytycznie zagrożony wyginięciem kot, występujący wyłącznie na Półwyspie Iberyjskim. Wyróżnia się cętkowaną, płową sierścią, czarnymi pędzelkami na uszach i krótkim ogonem. Jest wyraźnie mniejszy od swojego eurazjatyckiego krewniaka. Ma niezwykle czuły słuch, wspomagany przez wydatne pędzelki na uszach — doświadczenia wykazały, że ich usunięcie upośledza zdolność określania kierunku, z którego dochodzi dźwięk. Samotniczy i terytorialny, ryś iberyjski niegdyś występował na rozległych obszarach Hiszpanii i Portugalii, lecz dziś walczy o przetrwanie dzięki intensywnym działaniom ochronnym."
 dubois.121.g: "Rzadki klejnot Półwyspu."
 dubois.122.t: "Przybycie Wilka Eurazjatyckiego"
 dubois.122.d: "Stąpający cicho i czujnie obserwujący otoczenie #O Wilk Eurazjatycki#! zamieszkał w naszym ogrodzie zoologicznym."
 dubois.122.f: "Wilk Eurazjatycki (*Canis lupus lupus*) to najszerzej rozpowszechniony podgatunek wilka szarego, zamieszkujący rozległe obszary Europy i Azji. Jego sierść przybiera odcienie od szarości po rdzawy brąz, a grzbiet zdobi charakterystyczne czarne siodło. Jest sprytnym drapieżnikiem żyjącym w grupach. Jego wycie jest dłuższe i bardziej melodyjne niż u amerykańskich krewniaków — to niesamowita pieśń Starego Świata. Wilki te przetrwały stulecia prześladowań i złowrogich ludowych opowieści, a mimo to nadal żyją w odległych lasach i na stepach."
 dubois.122.g: "Widmowy strażnik."
 dubois.123.t: "Przybycie Borsuka Europejskiego"
 dubois.123.d: "Dziś do naszej kolekcji dołącza wytrwały kopacz: #O Borsuk Europejski#! został pomyślnie umieszczony w swoim nowym lokum."
 dubois.123.f: "Borsuk Europejski (*Meles meles*) to krępy ssak z rodziny łasicowatych, prowadzący nocny tryb życia i występujący na znacznych obszarach Europy. Rozpoznawalny dzięki czarno-białym pasom na pysku, zamieszkuje rozległe, złożone systemy nor, często wspólnie z krewniakami. Te towarzyskie drapieżniki poszukują dżdżownic, owadów i bulw oraz budują rozbudowane podziemne siedziby, przekazywane z pokolenia na pokolenie. Sezonowe wahania masy ich ciała odzwierciedlają trudy snu zimowego i surowość klimatu."
 dubois.123.g: "Niezłomny mieszkaniec podziemi."
 dubois.124.t: "Przybycie Gronostaja Europejskiego"
 dubois.124.d: "Nasza kolekcja ssaków znów się powiększa: zwinny i zabójczy #O Gronostaj Europejski#! zdobi teraz nasz ogród zoologiczny."
 dubois.124.f: "Gronostaj Europejski (*Mustela erminea*), w białej szacie zimowej zwany również gronostajem, to niewielki drapieżny ssak z rodziny łasicowatych, występujący naturalnie w Eurazji i Ameryce Północnej. Wydłużone ciało, krótkie kończyny i ogon z czarną końcówką stanowią przystosowanie do szybkiego ścigania gryzoni, jego głównej zdobyczy. Co niezwykłe, atakuje także zwierzęta kilkakrotnie większe od siebie. Jego cenione białe futro zimowe od stuleci zdobi królewskie szaty, czyniąc to skryte stworzenie trwałym symbolem szlachetności."
 dubois.124.g: "Zabójca w gronostajowym płaszczu."
 dubois.125.t: "Przybycie Wydry Europejskiej"
 dubois.125.d: "Wody naszego ogrodu zoologicznego zyskały nowego mieszkańca o smukłej sylwetce: przybyła #O Wydra Europejska#!."
 dubois.125.f: "Wydra Europejska (*Lutra lutra*) to drapieżnik prowadzący ziemnowodny tryb życia, występujący w Europie i na znacznych obszarach Azji. Żywi się głównie rybami i z niezwykłą zwinnością patroluje rzeki oraz jeziora. Jej futro należy do najgęstszych w królestwie zwierząt, a zazębiające się włosy zatrzymują izolującą warstwę powietrza i nie przepuszczają wody. Dzięki temu pozostaje sucha i zachowuje ciepło nawet w lodowatych warunkach. Płochliwa, lecz ciekawska, wydra jest oznaką zdrowych ekosystemów słodkowodnych i symbolem sukcesu działań ochronnych na całym obszarze swojego występowania."
 dubois.125.g: "Duch strumienia."
 dubois.126.t: "Przybycie Koziorożca Alpejskiego"
 dubois.126.d: "Wspinając się na szczyty naszego alpejskiego wybiegu, #O Koziorożec Alpejski#! dumnie staje na skałach."
 dubois.126.f: "Koziorożec Alpejski (*Capra ibex*) to gatunek dzikiej kozy zamieszkujący europejskie Alpy, słynący z imponujących rogów i gracji, z jaką pewnie stąpa po skałach. Samce mają potężne, zakrzywione rogi, których używają w rytualnych walkach podczas okresu godowego. Zwierzęta te są doskonale przystosowane do poruszania się po stromych zboczach, żywią się skąpą roślinnością alpejską i znoszą surowe warunki skalistych gór. Niegdyś niemal wytępiony przez polowania, gatunek ten został ponownie wprowadzony w góry dzięki królewskiemu dekretowi i działaniom ochronnym."
 dubois.126.g: "Władca gór."
 dubois.127.t: "Przybycie Żubra Europejskiego"
 dubois.127.d: "Pradawne zwierzę Europy powróciło: #O Żubr Europejski#! przechadza się teraz po swoim zielonym wybiegu."
 dubois.127.f: "Żubr Europejski (*Bison bonasus*) to najcięższy współcześnie żyjący ssak lądowy Europy. Niegdyś przemierzał obszary od Hiszpanii po Ural, lecz na początku XX wieku został wytępiony na wolności. Wszystkie żyjące dziś osobniki pochodzą od zaledwie dwunastu okazów zachowanych w ogrodach zoologicznych. W porównaniu ze swoim amerykańskim krewniakiem żubr jest wyższy i smuklejszy, przystosowany do życia w lasach mieszanych i liściastych. To żywy symbol przetrwania wbrew przeciwnościom."
 dubois.127.g: "Odrodzony relikt."
 dubois.131.t: "Przybycie Hipopotama"
 dubois.131.d: "Nasz ogród zoologiczny może się teraz poszczycić potężnym nowym okazem: ociężały #O Hipopotam#! został umieszczony na swoim wodnym wybiegu."
 dubois.131.f: "Hipopotam (*Hippopotamus amphibius*) to ssak parzystokopytny prowadzący ziemnowodny tryb życia, zamieszkujący Afrykę Subsaharyjską. Jest trzecim co do wielkości ssakiem lądowym po słoniu i nosorożcu. Jego nazwa, wywodząca się z greckiego określenia „koń rzeczny”, nie zdradza usposobienia znacznie bardziej porywczego niż końskie. Za dnia pozostaje zanurzony w rzekach lub bagnach, co pewien czas wynurzając się, by zaczerpnąć powietrza, nocą zaś samotnie się pasie. Choć jest roślinożercą, należy do najniebezpieczniejszych zwierząt Afryki, a sprowokowany potrafi wykazać się zdumiewającą szybkością i agresją."
 dubois.131.g: "Lewiatan płycizn."
 dubois.132.t: "Przybycie Lwa Afrykańskiego"
 dubois.132.d: "Pod naszą opiekę trafiło stworzenie o królewskiej postawie, sławne od zamierzchłych czasów: #O Lew Afrykański#! przemierza teraz swoje włości w naszym ogrodzie zoologicznym."
 dubois.132.f: "Lew (*Panthera leo*) to potężny kot zamieszkujący tereny trawiaste i sawanny Afryki oraz niektóre obszary Indii. W przeciwieństwie do większości kotów lwy są zwierzętami społecznymi, żyjącymi w złożonych grupach rodzinnych zwanych stadami. Okazała grzywa samca służy zarówno ozdobie, jak i ochronie. Od wieków czczony w heraldyce, rzeźbie i poezji, lew pozostaje wymownym symbolem suwerenności, odwagi i panowania. Za mitem kryje się jednak groźny drapieżnik, którego współpraca podczas łowów może przesłaniać ogromną siłę każdego osobnika."
 dubois.132.g: "Władca zwierząt."
 dubois.133.t: "Przybycie Słonia Afrykańskiego"
 dubois.133.d: "Przybyło największe zwierzę lądowe na Ziemi: dziś witamy #O Słonia Afrykańskiego#! w specjalnie przygotowanym dla niego siedlisku."
 dubois.133.f: "Słoń Afrykański (*Loxodonta africana*) to olbrzymi roślinożerca słynący z inteligencji, pamięci i matriarchalnej struktury społecznej. Jego ogromne uszy służą do regulacji temperatury ciała, a trąba — niezwykłe połączenie nosa i górnej wargi — pełni funkcje dotykowe, węchowe i chwytne. Słonie opłakują swoich zmarłych i wykazują złożone zachowania społeczne. Niegdyś władcy rozległych równin, dziś są symbolami zarówno majestatu, jak i kruchości w zmieniającym się świecie."
 dubois.133.g: "Uosobienie pamięci i potęgi."
 dubois.134.t: "Przybycie Żyrafy"
 dubois.134.d: "Górująca nad wszystkimi innymi #O Żyrafa#! zajęła już swoje miejsce w naszym ogrodzie zoologicznym."
 dubois.134.f: "Żyrafa (*Giraffa camelopardalis*) to najwyższe żyjące zwierzę lądowe, łatwo rozpoznawalne dzięki wydłużonej szyi i mozaikowemu umaszczeniu. Zamieszkuje afrykańskie sawanny i tereny leśne, żywiąc się liśćmi akacji na wysokościach niedostępnych dla innych roślinożerców. Mimo tyczkowatej sylwetki porusza się z zaskakującą gracją i szybkością. Od dawna fascynuje ludzkość, pozostając nieprzemijającym symbolem elegancji i budowy jakby nie z tego świata."
 dubois.134.g: "O szyję ponad innymi."
 dubois.135.t: "Przybycie Pingwina Przylądkowego"
 dubois.135.d: "Niespodziewany gość z południowych mórz dołącza chwiejnym krokiem do naszej kolekcji: #O Pingwin Przylądkowy#! jest już prezentowany zwiedzającym."
 dubois.135.f: "Pingwin Przylądkowy (*Spheniscus demersus*) to jedyny gatunek pingwina gniazdujący na kontynencie afrykańskim. Wyróżnia się czarną maską na głowie i różowymi plamami wokół oczu. Poluje pod wodą, ścigając ryby i kałamarnice. Przystosowany do klimatu umiarkowanego, doskonale radzi sobie na wybrzeżach i nie potrzebuje mroźnych warunków. Jego pocieszny chód nie zdradza niezwykłej zwinności i wytrzymałości, jakimi wykazuje się w morzu — niezmiennie pozostaje ulubieńcem zarówno zwiedzających, jak i przyrodników."
 dubois.135.g: "Morski ptak we fraku."
 dubois.136.t: "Przybycie Golca Piaskowego"
 dubois.136.d: "Niezwykła osobliwość przyrody drąży teraz tunele na naszych oczach: przybył #O Golec Piaskowy#!."
 dubois.136.f: "Golec Piaskowy (*Heterocephalus glaber*) to niezwykły gryzoń przystosowany do podziemnego życia w Afryce Wschodniej. Niemal bezwłosy i zmiennocieplny, jest jedynym ssakiem, którego temperatura ciała dostosowuje się do temperatury otoczenia, oraz jednym z nielicznych ssaków eusocjalnych, tworzących kolonie rządzone przez rozmnażającą się królową i jej partnerów. Wyjątkowo odporny na nowotwory i zdolny przetrwać w warunkach niemal całkowitego braku tlenu, ten niepozorny stwór stał się przedmiotem intensywnych badań naukowych, zwłaszcza nad długowiecznością i mechanizmami naprawy komórek."
 dubois.136.g: "Cud biologii, choć nie urody."
 dubois.137.t: "Przybycie Zebry Stepowej"
 dubois.137.d: "Pasiasta mieszkanka rozległych równin Afryki dołączyła do naszej kolekcji: oto #O Zebra Stepowa#! w swoim nowym domu."
 dubois.137.f: "Zebra (*Equus quagga*) to przedstawiciel rodzaju dzikich koniowatych występujących wyłącznie w Afryce. Zebry, znane przede wszystkim z czarno-białych pasów, zamieszkują sawanny, tereny trawiaste, a nawet obszary górskie. Ewolucyjna funkcja ich wyjątkowego umaszczenia pozostaje przedmiotem sporów — wśród możliwych wyjaśnień wymienia się kamuflaż, dezorientowanie drapieżników, termoregulację i odstraszanie kąsających owadów. Te zwierzęta stadne, obdarzone bystrym wzrokiem i ostrymi kopytami, łączą grację z niezwykłą czujnością."
 dubois.137.g: "Porządek w pasach."
 dubois.141.t: "Przybycie Pandy Wielkiej"
 dubois.141.d: "Wyjątkowy symbol Wschodu zdobi teraz nasz ogród: #O Panda Wielka#! zamieszkała na specjalnie dla niej przygotowanym wybiegu."
 dubois.141.f: "Panda Wielka (*Ailuropoda melanoleuca*) to niedźwiedź zamieszkujący górskie lasy strefy umiarkowanej w środkowych Chinach. Wyróżnia się kontrastowym czarno-białym futrem i ociężałym chodem, a wśród niedźwiedziowatych jest wyjątkowa ze względu na dietę opartą głównie na pokarmie roślinnym — żywi się niemal wyłącznie bambusem. Choć należy do rzędu drapieżnych, jej układ pokarmowy pozostaje słabo przystosowany do takiego pożywienia, co zmusza ją do nieustannego jedzenia. Z natury samotnicza, panda przemierza określone terytorium i rzadko spotyka się z innymi osobnikami poza krótkim okresem godowym. Niegdyś niemal mityczne stworzenie dla zachodnich przyrodników, pozostaje żywym symbolem ochrony przyrody."
 dubois.141.g: "Ambasador Chin."
 dubois.142.t: "Przybycie Orangutana Borneńskiego"
 dubois.142.d: "Dziś witamy stworzenie o niezwykłej inteligencji, poruszające się z gracją wśród gałęzi: #O Orangutan Borneński#! zadomowił się w swoim schronieniu w koronach drzew."
 dubois.142.f: "Orangutan Borneński (*Pongo pygmaeus*) to małpa człekokształtna pochodząca z lasów deszczowych Borneo i Sumatry. Znany z długich ramion i rudobrązowej sierści, prowadzi najbardziej nadrzewny tryb życia spośród małp człekokształtnych, co noc budując z gałęzi gniazdo wysoko w koronach drzew. U samców wykształcają się duże talerze policzkowe, a ich długie, donośne nawoływania oznajmiają obecność. Gatunek ten jest samotniczy i refleksyjny, a więzi społeczne ograniczają się zazwyczaj do opieki matki nad potomstwem. Orangutany wykazują wyjątkową zdolność rozwiązywania problemów, posługiwania się narzędziami i zapamiętywania, dlatego zalicza się je do najinteligentniejszych zwierząt poza człowiekiem."
 dubois.142.g: "Uczony pośród gałęzi."
 dubois.143.t: "Przybycie Tygrysa Bengalskiego"
 dubois.143.d: "Władca lasów i trawiastych równin wreszcie przybył: #O Tygrys Bengalski#! panuje teraz na swoim okazałym wybiegu."
 dubois.143.f: "Tygrys Bengalski (*Panthera tigris tigris*) to potężny drapieżnik zamieszkujący subkontynent indyjski. Jego sierść o intensywnej barwie i wyrazistych czarnych pasach czyni go jednym z największych i najbardziej efektownych kotów świata. Preferuje samotniczy tryb życia, a podczas łowów polega na skrytości i sile, często atakując ofiarę z zasadzki z zabójczą precyzją. Jego królestwo obejmuje lasy, bagna i tereny trawiaste — wszędzie tam, gdzie występują duże ssaki kopytne. Tygrys od dawna rozpala wyobraźnię poetów, książąt i myśliwych, pozostając nieprzemijającym symbolem majestatu i dzikości."
 dubois.143.g: "Prawdziwy król bez korony."
 dubois.144.t: "Przybycie Tapira Malajskiego"
 dubois.144.d: "Odznaczający się osobliwą sylwetką i niezwykłymi zwyczajami #O Tapir Malajski#! zamieszkał wśród egzotycznych zwierząt naszej kolekcji."
 dubois.144.f: "Tapir Malajski (*Tapirus indicus*) to największy i najbardziej charakterystyczny spośród tapirów, a zarazem jedyny przedstawiciel swojego rodzaju występujący poza obiema Amerykami. Jego umaszczenie — wyrazisty kontrast czerni i bieli — zaciera zarys sylwetki w grze światła i cienia tropikalnych lasów Azji Południowo-Wschodniej. Ma słaby wzrok, lecz wyostrzony słuch i węch; prowadzi skryty, nocny tryb życia, żywiąc się liśćmi i pędami. Choć jego osobliwy wygląd niegdyś wprawiał pierwszych zoologów w zakłopotanie, dziś jest ceniony jako relikt pradawnej linii ewolucyjnej."
 dubois.144.g: "Iluzjonista natury."
 dubois.145.t: "Przybycie Warana z Komodo"
 dubois.145.d: "Gadzi postrach odległych wysp przemierza teraz nasz ogród: #O Waran z Komodo#! został bezpiecznie umieszczony w swoim siedlisku."
 dubois.145.f: "Waran z Komodo (*Varanus komodoensis*) to największa żyjąca jaszczurka świata, występująca wyłącznie na kilku indonezyjskich wyspach. Ten drapieżnik szczytowy osiąga do trzech metrów długości i jest wyposażony w potężny ogon, ząbkowane zęby oraz gruczoły jadowe, których wydzielina obezwładnia ofiary. Zręcznie poluje z zasadzki, równie chętnie żywiąc się padliną, jak i upolowaną zdobyczą. Groźna reputacja i późne odkrycie przez zachodnią naukę w 1910 roku otoczyły go aurą mitu. Do dziś pozostaje wymownym symbolem pierwotnej siły."
 dubois.145.g: "Echo epoki gadów."
 dubois.146.t: "Przybycie Pantery Śnieżnej"
 dubois.146.d: "Zstąpiwszy z dachu świata, nieuchwytna #O Pantera Śnieżna#! dołączyła do naszej kolekcji."
 dubois.146.f: "Pantera Śnieżna (*Panthera uncia*), znana również jako irbis, zamieszkuje mroźne wyżyny i góry Azji Środkowej i Południowej. Okryta gęstym futrem o dymnej barwie, obdarzona potężnymi kończynami i długim ogonem pomagającym utrzymać równowagę, jest doskonale przystosowana do górskiego terenu. Cicha i rzadko widywana, przemierza wysokogórskie przełęcze w poszukiwaniu dzikich owiec i kóz. W przeciwieństwie do innych wielkich kotów nie potrafi ryczeć, lecz porozumiewa się za pomocą syków, pomruków i żałosnego miauczenia. Od dawna otaczana czcią w folklorze Azji Środkowej, pantera śnieżna pozostaje widmową obecnością zarówno w przyrodzie, jak i kulturze."
 dubois.146.g: "Duch gór."
 dubois.147.t: "Przybycie Geparda Azjatyckiego"
 dubois.147.d: "Szybki niczym pustynny wiatr, rzadki #O Gepard Azjatycki#! przybył, by zadziwiać zwiedzających i poszerzać ich wiedzę."
 dubois.147.f: "Gepard Azjatycki (*Acinonyx jubatus venaticus*) to krytycznie zagrożony wyginięciem podgatunek geparda, niegdyś szeroko rozpowszechniony na Bliskim Wschodzie i aż po Indie. Wyróżnia się jaśniejszą sierścią i smuklejszą budową, pozostając najszybszym ssakiem lądowym na Ziemi — zdolnym do gwałtownych sprintów, podczas których w jego ciele wydzielają się ogromne ilości ciepła. Historyczne związki z indyjską arystokracją, która szkoliła gepardy do polowań, uczyniły go symbolem zarówno gracji, jak i przemijania. Dziś przetrwała jedynie niewielka, zagrożona populacja w Iranie, a gepard azjatycki pozostaje żywym pomnikiem utraconych obszarów występowania."
 dubois.147.g: "Znikająca szybkość."
 dubois.148.t: "Przybycie Pandy Małej"
 dubois.148.d: "Z mglistych Himalajów wyłoniło się rzadkie i płochliwe stworzenie: #O Panda Mała#! zdobi teraz nasze drzewa."
 dubois.148.f: "Panda Mała (*Ailurus fulgens*) to nadrzewny ssak zamieszkujący lasy strefy umiarkowanej we wschodnich Himalajach i południowo-zachodnich Chinach. Choć dzieli nazwę z pandą wielką, należy do odrębnej rodziny. Wyróżnia się rudobrązowym futrem, pręgowanym ogonem i uroczym pyszczkiem. Żeruje nocą i o zmierzchu, żywiąc się głównie bambusem. Wrażliwa na upał i z natury samotnicza, spędza dnie, śpiąc wysoko na drzewach, zwinięta w kłębek, z ogonem osłaniającym nos. Ten rzadki klejnot koron drzew jest ceniony, lecz zagrożony."
 dubois.148.g: "Nieuchwytna i zachwycająca."
 dubois.151.t: "Przybycie Żółwia Zielonego"
 dubois.151.d: "Sędziwy podróżnik oceanów znalazł bezpieczną przystań: #O Żółw Zielony#! zamieszkał w naszym pawilonie wodnym."
 dubois.151.f: "Żółw Zielony (*Chelonia mydas*) to duży gad morski znany z dalekich wędrówek między żerowiskami a plażami lęgowymi. Opływowy pancerz w kształcie łzy oraz szerokie kończyny przypominające płetwy czynią go sprawnym pływakiem. Choć jego ubarwienie zazwyczaj przybiera odcienie od oliwkowego po czarny, różni się zależnie od regionu. Dorosłe żółwie żywią się niemal wyłącznie trawą morską, kształtując całe podwodne łąki podczas żerowania. Długowieczny, cierpliwy i zagadkowy, żółw zielony od stuleci towarzyszy żeglarzom i symbolizuje wytrwałość."
 dubois.151.g: "Pradawny i niezłomny."
 dubois.152.t: "Przybycie Manty Olbrzymiej"
 dubois.152.d: "Ogromny, milczący lewiatan rozwinął skrzydła pod wodą: #O Manta Olbrzymia#! sunie teraz w naszym wielkim zbiorniku słonowodnym."
 dubois.152.f: "Manta Olbrzymia (*Mobula birostris*) to największa z płaszczek, o rozpiętości płetw sięgającej 7 metrów lub więcej. Te łagodne filtratory zamieszkują tropikalne i subtropikalne morza, szybując w oceanicznych wodach z gracją przeczącą ich pokaźnym rozmiarom. Mają niewielu naturalnych wrogów, a jedynym poważnym zagrożeniem jest dla nich człowiek. Ich gładką skórę pokrywają charakterystyczne wzory, pozwalające rozpoznać każdego osobnika. Powszechnie uznawana za jedno z najbardziej majestatycznych stworzeń oceanu, manta od dawna budzi podziw zarówno żeglarzy, jak i przyrodników."
 dubois.152.g: "Skrzydlata zjawa."
 dubois.153.t: "Przybycie Kangura Rudego"
 dubois.153.d: "Ze spieczonych słońcem równin Australii przybywa susami nasz najnowszy gość: #O Kangur Rudy#! wykonał swój pierwszy skok w niewoli."
 dubois.153.f: "Kangur Rudy (*Osphranter rufus*) to największy żyjący torbacz i wyrazisty symbol australijskiego interioru. Samce, zwane „Wielkimi Rudymi”, są szczególnie imponujące — w pozycji stojącej mogą osiągać ponad 2,4 metra całkowitej długości. Potężne tylne kończyny i sprężyste ścięgna pozwalają im pokonywać ogromne odległości z prędkością do 60 km/h. Ten prawdziwy cud ewolucji jest doskonale przystosowany do surowych, suchych warunków swojej ojczyzny, łącząc grację, wytrzymałość i niezwykłą sprawność fizyczną."
 dubois.153.g: "Skoczek z kontynentu skrajności."
 dubois.154.t: "Przybycie Koali"
 dubois.154.d: "Sennie, lecz wytrwale trzymając się gałęzi, #O Koala#! drzemie teraz błogo w naszym gaju eukaliptusowym."
 dubois.154.f: "Koala (*Phascolarctos cinereus*) to wyjątkowy torbacz, znany z mało ruchliwego trybu życia i zależności od liści eukaliptusa. Krępe ciało, wydatne uszy i nos w kształcie łyżki sprawiają, że jest natychmiast rozpoznawalny i powszechnie lubiany. Mimo przytulnego wyglądu koala jest niezwykle wybredny w doborze pokarmu i z natury terytorialny. Przesypia nawet 20 godzin na dobę, by oszczędzać energię, i jest raczej zadumany niż towarzyski — to nadrzewny samotnik, doskonale przystosowany do diety ubogiej w składniki odżywcze."
 dubois.154.g: "Śpiąca królewna buszu."
 dubois.155.t: "Przybycie Dziobaka"
 dubois.155.d: "Zagadka dla przyrodnika i osobliwość fascynująca uczniów: dziś #O Dziobak#! po raz pierwszy prezentuje się publiczności."
 dubois.155.f: "Dziobak (*Ornithorhynchus anatinus*) to stekowiec pochodzący ze wschodniej Australii i Tasmanii. Ten jajorodny ssak o kaczym dziobie, łapach z błoną pławną i ogonie przypominającym bobrzy wprawił w zdumienie osiemnastowiecznych europejskich uczonych, którzy początkowo podejrzewali mistyfikację. Samce mają jadowite ostrogi na tylnych kończynach, a wszystkie dziobaki posiadają w dziobach elektroreceptory służące do wykrywania zdobyczy w mętnej wodzie. Ich linia ewolucyjna jest tak odmienna od linii pozostałych ssaków, że niezmiennie budzą fascynację, pozostając na pograniczu tego, co znajome, i tego, co nieprawdopodobne."
 dubois.155.g: "Dowód na to, że natura nie boi się sprzeczności."
 dubois.156.t: "Przybycie Kazuara Hełmiastego"
 dubois.156.d: "Z cieni lasu deszczowego wyłania się zagadkowy ptak o niemałej sławie: #O Kazuar Hełmiasty#! patroluje teraz swój zalesiony wybieg."
 dubois.156.f: "Kazuar Hełmiasty (*Casuarius casuarius*) to pokaźny nielot o groźnym usposobieniu, występujący w lasach tropikalnych północnej Australii i Nowej Gwinei. Wyróżnia się wysokim hełmem na głowie, jaskrawoniebieską skórą i pazurami przypominającymi sztylety. Choć żywi się owocami, nie ma w sobie nic z łagodności, jaką mogłaby sugerować taka dieta. W naturze jest płochliwy, lecz sprowokowany może stać się niebezpiecznie agresywny. Funkcja hełmu pozostaje przedmiotem sporów — przypisuje mu się rolę ozdoby godowej, rezonatora akustycznego lub osłony głowy w gęstych zaroślach. Jest zarazem reliktem i zagadką dawnego świata ptaków."
 dubois.156.g: "Najlepiej podziwiać go z respektem."
 dubois.157.t: "Przybycie Maoryszanki Uszatej"
 dubois.157.d: "Wytrwała mieszkanka subantarktycznych wybrzeży dołączyła do naszej ekspozycji morskiej: #O Maoryszanka Uszata#! odpoczywa teraz na skałach."
 dubois.157.f: "Maoryszanka Uszata (*Phocarctos hookeri*) należy do najrzadszych płetwonogich na świecie i ma jeden z najbardziej ograniczonych zasięgów występowania. Samce — okazałe i obdarzone ciemną grzywą — mogą osiągać do 2,45 metra długości, natomiast mniejsze samice mają płowe futro i smuklejszą sylwetkę. Niemal wytępione wskutek dziewiętnastowiecznych polowań na foki, maoryszanki odbudowują dziś swoje kolonie dzięki ochronie, zwłaszcza na odległych Wyspach Auckland. Ten towarzyski gatunek zamieszkujący wybrzeża niezmiennie urzeka i budzi zainteresowanie naukowców swoją potężną budową, wyrazistymi pyskami i więziami rodzinnymi."
 dubois.157.g: "Niegdyś tępiona, dziś otaczana czcią."
 dubois.200.t: "Uroczyste Otwarcie Muzeum Historii Naturalnej"
 dubois.200.d: "Profesor [SCOPE.sCharacter('dubois_paleontologist_scope').GetLastName] dokonał uroczystego otwarcia Muzeum Historii Naturalnej, poświęconego rozwojowi filozofii przyrody i badaniom nad ewolucją."
 dubois.200.f: "Gdy Prof. [SCOPE.sCharacter('dubois_paleontologist_scope').GetLastName] ogłosił otwarcie pierwszego w naszym kraju Muzeum Historii Naturalnej, niewielu pamiętało o ogromnych wysiłkach, jakich wymagało powołanie tej instytucji do życia. Muzeum Narodowe, dotychczas sprawujące pieczę nad zbiorami historii naturalnej, sprzeciwiało się ich wydzieleniu, uznając tę dziedzinę za podrzędną. Dzięki wytrwałości i wpływom Prof. [SCOPE.sCharacter('dubois_paleontologist_scope').GetLastName] przedsięwzięcie zakończyło się sukcesem. Nowe muzeum zapowiada rozkwit badań paleontologicznych, a społeczeństwo już wykazuje żywe zainteresowanie tajemnicami wymarłych gatunków i pochodzeniem człowieka. Niegdyś uważana jedynie za dziedzinę pomocniczą geologii, paleontologia cieszy się dziś uznaniem, a własne instytucje zapewniają jej miejsce wśród czołowych nauk epoki."
 dubois.200.g: "Wielce pouczająca instytucja!"
 dubois_natural_history_museum_modifier: "Muzeum Historii Naturalnej"
 dubois.201.t: "Cel Wyprawy Paleontologicznej"
 dubois.201.f: "[concept_dubois_paleontologist] może zostać wysłany do formacji geologicznych, gdzie coroczne wykopaliska dostarczają skamieniałości. Wielkie Formacje mogą również zawierać kości dinozaurów, różniące się w zależności od kontynentu. Najprostszym sposobem uzyskania dostępu jest sprawowanie suwerennej władzy nad danym terytorium, choć pozwolenia na badania naukowe można też uzyskać na drodze porozumień dyplomatycznych."
 dubois.201.g: "Może innym razem."
 dubois.202.t: "Skamieniałe Zęby Rekina"
 dubois.202.d: "Badania paleontologiczne przyniosły zbiór skamieniałych zębów rekinów, reliktów pradawnych mórz."
 dubois.202.f: "Skamieniałe zęby rekinów, często będące jedynymi pozostałościami tych wymarłych stworzeń, należą do najliczniejszych skamieniałości ze względu na nieustanną wymianę uzębienia u żywych rekinów. Już w 1616 roku Fabio Colonna wykazał w rozprawie De Glossopetris Dissertatio, że tak zwane „języki żmij” były w istocie zębami rekinów. Squalicorax pristodontus, o płaskich, ząbkowanych zębach, występował licznie w kredzie i był rozpowszechniony na całym świecie. Takie zęby wydobywano z warstw mezozoicznych w obu Amerykach, Afryce, Azji i Europie, gdzie stanowią nieme świadectwo pradawnego rodowodu i wszechobecności tych groźnych drapieżników."
 dubois.202.g: "Znakomite uzupełnienie kolekcji."
 dubois.203.t: "Ślady Dinozaurów?"
 dubois.203.d: "[SCOPE.sCharacter('pb_leader').GetFullName] wyraża sceptycyzm wobec niedawnego odkrycia Profesora [SCOPE.sCharacter('dubois_paleontologist_scope').GetLastName]."
 dubois.203.f: "Po ogłoszeniu nowego znaleziska w formacji geologicznej przywódca drobnomieszczaństwa przybył, by obejrzeć domniemane ślady dinozaurów. Nie doceniając przedstawionych dowodów, [SCOPE.sCharacter('pb_leader').GetFullName] uznał odciski za nic szczególnego. Ta filisterska postawa wywołała zażarty spór z profesorem, który zażądał natychmiastowych przeprosin. Kłótnia szybko przybrała na sile, dzieląc zwolenników przywódcy o nazwisku [SCOPE.sCharacter('pb_leader').GetLastName] i środowisko akademickie skupione wokół Prof. [SCOPE.sCharacter('dubois_paleontologist_scope').GetLastName]."
 dubois.203.g: "To bez wątpienia ślady dinozaurów."
 dubois.203.h: "Dowody pozostają niejednoznaczne."
 dubois.204.t: "Palaeosinopa"
 dubois.204.d: "Zespół naukowców odkrył szkielet wczesnego ssaka, zachowany w znakomitym stanie."
 dubois.204.f: "Palaeosinopa, rodzaj należący do wymarłej rodziny Pantolestidae, występował od późnego paleocenu do wczesnego eocenu, około 59–48 milionów lat temu. Skamieniałości, znajdowane głównie w Ameryce Północnej, a sporadycznie także w Europie, wskazują na masywną budowę ciała i wydłużony ogon oraz krótsze kończyny przednie i dłuższe tylne. Taka budowa sugeruje ziemnowodny tryb życia, podobny do trybu życia współczesnych wydr, natomiast uzębienie świadczy o diecie opartej na pokarmie zwierzęcym. Warstwy skamieniałości w formacjach Green River i Willwood są szczególnie bogate w okazy, dostarczając cennych informacji o historii ewolucyjnej wczesnych ssaków."
 dubois.204.g: "Wielce pouczający okaz."
 dubois.204.h: "Odpowiedni upominek dla kolegi po fachu."
 dubois.205.t: "Kości Odkryte w Szybie Kopalnianym"
 dubois.205.d: "Górnicy na obszarze [SCOPE.sState('dubois_excavation_state').GetName] odkopali kości prehistorycznego gatunku. Prof. [SCOPE.sCharacter('dubois_paleontologist_scope').GetLastName] został wezwany do zbadania znaleziska."
 dubois.205.f: "Odkrycie kości w kopalni wywołało mieszane reakcje. Paleontolog pragnął jak najszybciej rozpocząć wykopaliska naukowe, lecz kierownictwo kopalni obawiało się zakłóceń w pracy. Prof. [SCOPE.sCharacter('dubois_paleontologist_scope').GetLastName] ustalił, że prawidłowe przeprowadzenie wykopalisk wymagałoby czasowego wstrzymania wydobycia, co wywołało protest przemysłowców. Znalezisko stało się tym samym przedmiotem zainteresowania opinii publicznej, a inteligencja opowiedziała się za przeprowadzeniem badań naukowych. Niektórzy proponują kompromis — samo udokumentowanie znaleziska bez prowadzenia wykopalisk — by nie utrudniać działalności przemysłu, choć uniemożliwiłoby to wydobycie skamieniałości."
 dubois.205.g: "Skamieniałości muszą zostać zabezpieczone dla nauki."
 dubois.205.h: "Zezwólcie jedynie na pobieżne oględziny."
 dubois.205.i: "Niech górnicy pracują bez przeszkód."
 dubois.206.t: "Composita"
 dubois.206.d: "W tym roku [Concept('concept_dubois_paleontologist','$concept_dubois_paleontologists|q$')] pod kierownictwem Prof. [SCOPE.sCharacter('dubois_paleontologist_scope').GetLastName] wydobyli znakomite okazy Composita na stanowisku wykopaliskowym na obszarze [SCOPE.sState('dubois_excavation_state').GetName]."
 dubois.206.f: "Composita, wymarły rodzaj ramienionogów, występował od późnego dewonu do późnego permu i miał kosmopolityczny zasięg. Jego cechami charakterystycznymi są gładka muszla, wyraźny fałd i bruzda oraz okrągły otwór nóżkowy. Composita należy do rodziny Athyrididae i podrodziny Spirigerellinae. Skamieniałości te, znajdowane na wszystkich kontynentach poza Antarktydą, są cenione przez przyrodników ze względu na swój pradawny wiek i wartość poznawczą, wykraczającą daleko poza samą osobliwość muszli."
 dubois.206.g: "Godne uzupełnienie naszego gabinetu."
 dubois.207.t: "Trylobit"
 dubois.207.d: "Prof. [SCOPE.sCharacter('dubois_paleontologist_scope').GetLastName] wzbogacił kolekcję paleontologiczną o doskonale zachowany okaz trylobita. Jego wiek szacuje się na 400 milionów lat, a wartość naukowa jest znaczna."
 dubois.207.f: "Trylobity, wymarła gromada morskich stawonogów, żyły przez całą erę paleozoiczną, od kambru po perm. Ich pancerze zewnętrzne, wzmocnione kalcytem, często zachowują się w stanie kopalnym, umożliwiając odtworzenie ich różnorodności ewolucyjnej. Obejmując dziewięć rzędów, ponad 150 rodzin, 5000 rodzajów i ponad 15 000 opisanych gatunków, trylobity stanowią ważne skamieniałości przewodnie paleozoiku i są nieodzowne w badaniach geologicznych oraz paleontologicznych."
 dubois.207.g: "Wyrazy wdzięczności dla profesora."
 dubois.208.t: "Amonity"
 dubois.208.d: "Amonity odkryte na obszarze [SCOPE.sState('dubois_excavation_state').GetName] dodatkowo wzbogacają zbiory paleontologiczne naszego kraju."
 dubois.208.f: "Amonity (Ammonoidea), wymarły rząd głowonogów, odznaczały się niezwykłą różnorodnością, obejmując ponad 1500 rodzajów i przypuszczalnie od 30 000 do 40 000 gatunków. Ich muszle, zazwyczaj o średnicy od 1 do 30 cm, występują w osadach morskich od dewonu po granicę kredy i paleogenu. Amonity są bezcennymi skamieniałościami przewodnimi, pomocnymi w określaniu wieku warstw skalnych. Nazwa „Ammonis cornua” (rogi Amona) sięga starożytności, a badania nad nimi zajmują kluczowe miejsce w geologii i paleontologii epoki wiktoriańskiej."
 dubois.208.g: "Zachowajcie jeden okaz dla muzeum."
 dubois.209.t: "Skamieniała Flora"
 dubois.209.d: "[Concept('concept_dubois_paleontologist','$concept_dubois_paleontologists|q$')] wydobyli z kamieniołomu skamieniałości roślin pochodzących z zamierzchłych epok."
 dubois.209.f: "W karbonie (około 360–300 milionów lat temu) rozległe lasy paproci, skrzypów i widłaków dały początek dzisiejszym złożom węgla. Najstarsze skamieniałości paproci pochodzą z wczesnego dewonu (około 400 milionów lat temu), sprzed pojawienia się roślin nasiennych. Te pradawne flory budzą ogromne zainteresowanie filozofów przyrody, rzucając światło na początki roślinności lądowej i procesy geologiczne, które ukształtowały epokę przemysłową."
 dubois.209.g: "Korzenie przemysłu i postępu."
 dubois.210.t: "Jaja Dinozaurów"
 dubois.210.d: "Przedmioty początkowo uznane za kamienie po bliższych oględzinach okazały się skamieniałymi jajami — niemal na pewno należącymi do jednego z gatunków dinozaurów."
 dubois.210.f: "Pierwsze naukowo udokumentowane skamieniałe jaja dinozaurów odkryto w 1859 roku w południowej Francji, choć początkowo przypisywano je olbrzymim ptakom. W 1923 roku wyprawa Amerykańskiego Muzeum Historii Naturalnej w Mongolii odkryła jaja, o których dziś wiadomo, że należały do owiraptora, a nie protoceratopsa, jak pierwotnie sądzono. Rosnąca liczba takich znalezisk doprowadziła do powstania konkurencyjnych systemów klasyfikacji, a badania nad jajami dinozaurów pozostają przedmiotem ożywionych debat epoki wiktoriańskiej."
 dubois.210.g: "Obchodźmy się z nimi z najwyższą ostrożnością."
 dubois.211.t: "Wykopaliska Dinozaurów"
 dubois.211.d: "Podczas badania Wielkiej Formacji Prof. [SCOPE.sCharacter('dubois_paleontologist_scope').GetLastName] dokonał niezwykłego odkrycia: znalazł kość dinozaura! [concept_dubois_paleontologist] natychmiast zorganizował zakrojone na szeroką skalę wykopaliska w nadziei na odnalezienie kolejnych szczątków."
 dubois.211.f: "„Połączenie takich cech — jednych niespotykanych u innych gadów, innych zapożyczonych od grup obecnie uznawanych za odrębne — występujące u stworzeń znacznie przewyższających rozmiarami największe żyjące gady, zostanie, jak można przypuszczać, uznane za wystarczającą podstawę do wyodrębnienia osobnego plemienia lub podrzędu gadów jaszczurowatych, dla którego proponuję nazwę Dinosauria”. — Richard Owen"
 dubois.211.g: "Niech rozpoczną się wykopaliska!"
 dubois.213.t: "Fragmenty Skamieniałości"
 dubois.213.d: "Na stanowisku wykopaliskowym dinozaura naukowcy odnaleźli drobniejsze fragmenty skamieniałości."
 dubois.213.f: "„Może nie jest to zdobycz, której szukaliśmy, lecz każdy fragment wzbogaca naszą wiedzę”. — [SCOPE.sCharacter('dubois_paleontologist_scope').GetFullName]"
 dubois.213.g: "Zbierzcie skamieniałości!"
 dubois.214.t: "Kość Dinozaura"
 dubois.214.d: "Zespół Prof. [SCOPE.sCharacter('dubois_paleontologist_scope').GetLastName] odkrył kolejną kość dinozaura na stanowisku wykopaliskowym."
 dubois.214.f: "„Na widok jednej kości, choćby jednego jej fragmentu, rozpoznaję i odtwarzam część całości, z której pochodzi. Cała istota, do której należał ten fragment, ukazuje się oczom mojej wyobraźni”. — Georges Cuvier"
 dubois.214.g: "Dodajcie ją do kolekcji."
 dubois.215.t: "Czaszka Dinozaura"
 dubois.215.d: "Podczas wykopalisk odkryto wspaniałą czaszkę dinozaura."
 dubois.215.f: "„Głowa była równie długa jak u w pełni dorosłego niedźwiedzia grizzly lub nawet dłuższa, a szczęki proporcjonalnie masywniejsze w stosunku do swej długości. Pysk był krótszy i masywniejszy niż u buldoga. Wszystkie zęby miały postać ostrych, walcowatych kłów, gładkich, lśniących i różnej wielkości. W pewnych odstępach w obu szczękach wystawały na trzy cale ponad dziąsło i były osadzone na głębokość jednego cala w krawędzi szczęki, dorównując tym samym długością kłom tygrysa, choć były smuklejsze. Po dwa takie kły krzyżowały się z każdej strony przedniej części pyska, tuż przy jego linii środkowej. Oprócz mniejszych ryb jego apetyt zaspokajały bez wątpienia także gady”. — Edward Drinker Cope"
 dubois.215.g: "Spektakularne znalezisko!"
 dubois.216.t: "Szkielet Dinozaura"
 dubois.216.d: "Po miesiącach starannej pracy Prof. [SCOPE.sCharacter('dubois_paleontologist_scope').GetLastName] odkrył imponujący szkielet dinozaura, którego kilka kości zachowało się w doskonałym stanie."
 dubois.216.f: "„Sam szkielet zmontowano w Muzeum Akademii Nauk w Filadelfii zgodnie z tą rekonstrukcją. Gdy profesor Cope pokazał mi go i objaśnił jego osobliwości, zauważyłem, że powierzchnie stawowe kręgów są zwrócone w przeciwną stronę, i delikatnie zasugerowałem mu, że ustawił całość tyłem do przodu. Oburzył się niezmiernie i w dosadnych słowach oświadczył, że badał to zwierzę przez wiele miesięcy i powinien przynajmniej umieć odróżnić jeden jego koniec od drugiego”. — Othniel Charles Marsh"
 dubois.216.g: "Fascynujące."
 dubois.220.t: "Wykopaliska Zakończone"
 dubois.220.d: "[Concept('concept_dubois_paleontologist','$concept_dubois_paleontologists|q$')] zakończyli wykopaliska na stanowisku ze szczątkami dinozaura. Ważne badania naukowe dobiegają końca."
 dubois.220.f: "„Poszukiwacz skamieniałości musi być przede wszystkim entuzjastą nauki. Musi być gotów znosić wszelkie trudy, cierpieć z zimna wczesną wiosną, późną jesienią i na początku zimy, a latem znosić dotkliwy upał i oślepiający blask słońca. Musi być przygotowany na picie alkalicznej wody, a w niektórych okolicach także na odpieranie ataków komarów i innych dokuczliwych stworzeń. Musi mieć w sobie coś z inżyniera, aby móc przemieszczać wielkie bloki skalne i przewozić je przez bezdrożne pustkowia do najbliższego punktu przeładunkowego; musi mieć delikatne i wprawne dłonie, by ocalić najdrobniejsze fragmenty pękniętych kości; musi zadowalać się bardzo skromnym życiem, gdyż zawód ten rzadko, jeśli w ogóle, przynosi godziwe dochody, a jego praca niemal zawsze jest zbyt nisko wynagradzana; główną nagrodę i zachętę do dalszych wysiłków musi znajdować w poczuciu dokonania odkrycia oraz w wysyłaniu okazów do muzeów, których nigdy nie widział, dla dobra publiczności, która niewiele wie o jego poświęceniach i rzadko je docenia”. - Henry Fairfield Osborn"
 dubois.220.g: "Oczekuję co najmniej nowego szkieletu dinozaura do naszej kolekcji."
 dubois.221.t: "Eustenopteron"
 dubois.221.d: "Prof. [SCOPE.sCharacter('dubois_paleontologist_scope').GetLastName] odkrył rzadką, prehistoryczną rybę, która może stanowić kluczowe ogniwo w przejściu od życia wodnego do lądowego."
 dubois.221.f: "Eustenopteron to wymarły rodzaj ryb mięśniopłetwych (Sarcopterygii) z późnego dewonu Ameryki Północnej i Europy. Uznaje się go za klasyczny przykład wczesnych przedstawicieli Tetrapodomorpha. Eustenopteron miał zarówno skrzela, jak i prymitywny pęcherz pławny pełniący funkcję płuca, a także mocny szkielet płetw. Co niezwykłe, w jego płetwach piersiowych występowały już trzy kości kończyn spotykane u kręgowców lądowych: kość ramienna, łokciowa i promieniowa. Przystosowania te sugerują, że mógł przez krótki czas poruszać się poza wodą. Jego dwie płetwy grzbietowe były osadzone daleko z tyłu, a naprzeciw nich znajdowały się płetwy brzuszne i odbytowa."
 dubois.221.g: "Niezwykłe ogniwo ewolucji."
 dubois.222.t: "Archeopteryks"
 dubois.222.d: "Podczas wykopalisk w bawarskich wapieniach w pobliżu Solnhofen Prof. [SCOPE.sCharacter('dubois_paleontologist_scope').GetLastName] dokonał odkrycia, które wprawiło świat nauki w osłupienie: odnalazł skamieniałość mogącą stanowić ogniwo łączące gady z ptakami."
 dubois.222.f: "Archeopteryks to jedna z najsłynniejszych form przejściowych znanych z zapisu kopalnego, pochodząca z późnej jury. Dzięki upierzonym skrzydłom, zębom i długiemu kostnemu ogonowi łączy cechy ptaków i gadów. Jego odkrycie dostarczyło przekonujących dowodów na poparcie teorii ewolucji Darwina, sugerując, że ptaki wyewoluowały z niewielkich dinozaurów teropodowych."
 dubois.223.t: "Megaterium"
 dubois.223.d: "Podczas badań paleontologicznych zespół Prof. [SCOPE.sCharacter('dubois_paleontologist_scope').GetLastName] wydobył kości olbrzymiego leniwca naziemnego."
 dubois.223.f: "Megaterium to rodzaj olbrzymich leniwców naziemnych, które przemierzały Amerykę Południową jeszcze około 10 000 lat temu. Te powolne zwierzęta roślinożerne osiągały rozmiary słoni i kształtowały swoje otoczenie, wyrywając drzewa z korzeniami i rozkopując ziemię w poszukiwaniu korzeni. Ich wyginięcie wiąże się ze zmianami klimatu i działalnością człowieka."
 dubois.224.t: "Ichtiozaur"
 dubois.224.d: "Kierownik wykopalisk paleontologicznych donosi o odkryciu prehistorycznego gada przypominającego zarówno rybę, jak i delfina."
 dubois.224.f: "Ichtiozaur był gadem morskim z okresu jurajskiego, przystosowanym do życia na otwartym oceanie. Opływowe ciało, długi pysk i duże oczy czyniły go sprawnym drapieżnikiem. W przeciwieństwie do większości gadów rodził żywe młode i stanowi wyrazisty przykład ewolucji zbieżnej ze współczesnymi delfinami."
 dubois.225.t: "Smilodon"
 dubois.225.d: "Dział historii naturalnej z dumą ogłasza nowe znalezisko: nasz paleontolog odkrył szkielet kota szablozębnego."
 dubois.225.f: "Smilodon, często nazywany tygrysem szablozębnym, był groźnym drapieżnikiem zamieszkującym obie Ameryki w plejstocenie. Wydłużone kły i potężna budowa ciała czyniły go drapieżnikiem szczytowym. Skamieniałości z naturalnych pułapek asfaltowych świadczą o zachowaniach społecznych i dramatycznych starciach z innymi przedstawicielami megafauny epoki lodowcowej."
 dubois.226.t: "Pterodaktyl"
 dubois.226.d: "Kości niewielkiego pterozaura wzbudziły zachwyt środowiska naukowego i zostały już przekazane do Kolekcji Paleontologicznej."
 dubois.226.f: "Pterodaktyl należał do najwcześniejszych pterozaurów, latających gadów późnej jury. Osiągając rozpiętość skrzydeł do 1,5 metra, szybował nad przybrzeżnymi lagunami, polując na ryby i drobne zwierzęta. Jego odkrycie pomogło poznać różnorodność prehistorycznego życia i ewolucję lotu."
 dubois.227.t: "Ichtiostega"
 dubois.227.d: "Po wylądowaniu sterowca uczestnicy wyprawy w krainie Wiecznych Lodów odkryli niezwykłą skamieniałość, która może zrewolucjonizować paleontologię. Szybko wysłano ją do czołowego paleontologa kraju, Prof. [SCOPE.sCharacter('dubois_paleontologist_scope').GetLastName]. Podobno to brakujące ogniwo między rybami a zwierzętami lądowymi!"
 dubois.227.f: "Ichtiostega to jeden z najwcześniejszych znanych czworonogów późnego dewonu. Jej mocne kończyny i płuca wyznaczają kluczowy etap ewolucyjnego przejścia od życia wodnego do lądowego. Skamieniałość łączy cechy ryb i płazów, rzucając światło na początki życia kręgowców na lądzie."
 dubois.301.t: "Cel Wyprawy Botanicznej"
 dubois.301.d: "Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] jest gotów wyruszyć na wyprawę botaniczną. Który Rodzaj roślin powinien być celem tej wyprawy?"
 dubois.301.f: "„Ciekawe, czy uda mi się znaleźć jakieś olbrzymie rośliny do mojej kolekcji botanicznej? Gdybym tylko nie musiał szukać czegoś pożytecznego...”"
 dubois.302.t: "Wiktoria Amazońska"
 dubois.302.d: "Podczas wyprawy botanicznej Prof. [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] natrafił na niezwykłą lilię wodną o niezrównanej okazałości."
 dubois.302.f: "Wiktoria Amazońska, olbrzymia lilia wodna z Amazonii, należy do rodzaju Victoria z rodziny grzybieniowatych (Nymphaeaceae). Pochodzi z wolno płynących wód dorzecza Amazonki, a swoją nazwę otrzymała na cześć królowej Wiktorii. Jej zanurzony ogonek liściowy może osiągać do 8 metrów długości, a pływające liście — o uniesionych brzegach i głębokich wcięciach — dorastają w naturze do 3 metrów średnicy. Wcięcia te zapobiegają rozrywaniu liści i umożliwiają odpływ nadmiaru wody po ulewnych deszczach. W ogrodach botanicznych liście zazwyczaj osiągają 2 metry średnicy."
 dubois.302.g: "Ten okaz będzie ozdobą naszej wystawy."
 dubois.302.h: "Skatalogujcie i zbadajcie okaz do celów naukowych."
 dubois.303.t: "Pawica Atlas"
 dubois.303.d: "Choć wyprawa koncentrowała się na roślinach, Prof. [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] zachwycił się kolonią okazałych pawic atlas w lesie deszczowym."
 dubois.303.f: "Pawica atlas (Attacus atlas) to jedna z największych ciem na świecie, nazwana na cześć tytana Atlasa z mitologii greckiej. Samice są większe od samców. Z kokonów pozyskuje się jedwab Fagara, który ma jasnobrązową barwę i jest znacznie wytrzymalszy od zwykłego jedwabiu."
 dubois.304.t: "Dziwidło Olbrzymie"
 dubois.304.d: "W Indonezji Prof. [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] odkrył ogromne Dziwidło Olbrzymie, prawdopodobnie największy kwiat na świecie. Przyrodnik jest zachwycony, choć reszta zespołu narzeka na jego odrażającą woń."
 dubois.304.f: "Rodzaj Amorphophallus obejmuje około 200 gatunków występujących od Nowej Gwinei po Afrykę Zachodnią. A. titanum wytwarza największy znany nierozgałęziony kwiatostan, osiągający ponad trzy metry wysokości. Kwiat wydziela woń padliny i wytwarza ciepło, by zwabić chrząszcze, które go zapylają. Jego rzadkie kwitnienia stanowią wielką atrakcję ogrodów botanicznych."
 dubois.305.t: "Goliat"
 dubois.305.d: "Odkrycie chrząszcza goliata na krótko odrywa Prof. [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] od poszukiwań botanicznych."
 dubois.305.f: "Goliaty (Goliathus) należą do największych i najcięższych owadów na Ziemi oraz do podrodziny kruszczycowatych (Cetoniinae). Larwy mogą ważyć do 110 gramów. Martwe okazy są cenione przez kolekcjonerów i osiągają wysokie ceny."
 dubois.306.t: "Skarbnica Storczyków"
 dubois.306.d: "W głębi lasu deszczowego uczestnicy Wyprawy Botanicznej odkryli olśniewające bogactwo gatunków storczyków, z których wiele było dotąd nieznanych nauce."
 dubois.306.f: "Storczyki słyną z niezwykłej różnorodności — żadna inna rodzina roślin nie może poszczycić się takim bogactwem kształtów, rozmiarów i barw. Ich kwiaty bywają małe jak główka szpilki lub wielkie jak talerz obiadowy, a paleta barw rozciąga się od delikatnych bieli i zieleni po żywe czerwienie, błękity i żółcie, często tworzące efektowne połączenia. Storczyki obejmują ponad tysiąc rodzajów i dziesiątki tysięcy gatunków, ustępując liczebnością wśród roślin kwiatowych jedynie astrowatym. Każde nowe odkrycie pogłębia naszą wiedzę o pomysłowości natury."
 dubois.306.g: "Wspaniałe uzupełnienie naszej kolekcji."
 dubois.307.t: "Rośliny Lecznicze"
 dubois.307.d: "Uczestnicy wyprawy znaleźli kilka niezwykłych ziół o obiecujących właściwościach leczniczych."
 dubois.307.f: "Rośliny od dawna stanowią podstawę medycyny — ponad połowa wszystkich znanych środków leczniczych pochodzi ze źródeł roślinnych. Na przykład kora wierzby zawiera salicynę, prekursor współczesnej aspiryny, i od wieków łagodzi ból oraz gorączkę. Szczególnie lasy deszczowe obfitują w rośliny, które mogą dostarczyć nowych leków i czekają na zbadanie oraz poznanie ich właściwości."
 dubois.307.g: "Przeanalizujcie rośliny do celów naukowych."
 dubois.307.h: "Zbierzcie zioła do późniejszego wykorzystania."
 dubois.308.t: "Zagadkowe Kwiaty"
 dubois.308.d: "Zapuszczając się w niezbadany zakątek lasu deszczowego, uczestnicy wyprawy natrafili na obfitość nieznanych, zachwycających kwiatów."
 dubois.308.f: "Ich piękno jest niezaprzeczalne, lecz miejscowi przewodnicy ostrzegają, że kwiaty te mogą być niebezpieczne — być może nawet trujące. Zespół staje przed dylematem: zebrać je w dużych ilościach, ryzykując nieprzewidziane konsekwencje, czy zachować ostrożność i najpierw je zbadać. Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] musi zdecydować, jak najlepiej pogodzić ciekawość z rozwagą."
 dubois.308.g: "Poleć członkom wyprawy zebrać kwiaty."
 dubois.308.h: "Niech przywódca wyprawy zbierze i zbada kwiaty."
 dubois.308.i: "Pozostawcie te tajemnicze kwiaty nietknięte."
 dubois.309.t: "Opozycja Krytykuje Wyprawę Botaniczną"
 dubois.309.d: "[SCOPE.sCharacter('dubois_sceptical_leader').GetLastName] potępia wyprawę botaniczną jako rozrzutne wydawanie środków publicznych, przekonując, że fundusze należy przeznaczyć na inne cele. Jego protest jest równie głośny, co uporczywy."
 dubois.309.f: "„Kolejna wyprawa? Najpierw sterowce, potem Pacyfik, a teraz botanicy włóczący się po dżunglach. Archeolodzy, paleontolodzy, zoolodzy — kiedy to się skończy? To nic innego jak biurokratyczna rozrzutność!”"
 dubois.309.g: "Natychmiast odwołaj Prof. [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName]."
 dubois.309.h: "Badania naukowe muszą pozostać ponad polityką."
 dubois.310.t: "[SCOPE.sCharacter('dubois_naturalist_scope').GetFullName] Zapada na Chorobę"
 dubois.310.d: "Prof. [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] uległ zatruciu podczas zbierania próbek roślin w lesie deszczowym. Ciężki przebieg choroby zmusza do nagłego przerwania wyprawy."
 dubois.310.f: "Na czas choroby przyrodnika wyprawa botaniczna zostaje zawieszona. Do jego wyzdrowienia nie będą wysyłane żadne nowe okazy."
 dubois.310.g: "Niepokojący obrót spraw."
 dubois.311.t: "Odkrycie Egzotycznych Nasion"
 dubois.311.d: "Podczas wyprawy botanicznej Prof. [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] odkrył rzadkie nasiona o znacznym potencjale naukowym i rolniczym."
 dubois.311.f: "Światowa wymiana roślin uprawnych od stuleci kształtuje rolnictwo. Trzcina cukrowa, niegdyś uprawiana w basenie Morza Śródziemnego, rozkwitła w Ameryce Południowej; w 1876 roku Henry Wickham zasłynął przemyceniem nasion kauczukowca z Brazylii do Azji, przeobrażając gospodarki i krajobrazy."
 dubois.311.g: "Dodajcie nasiona do naszej kolekcji naukowej."
 dubois.311.h: "Wprowadźcie nowe nasiona do miejscowych upraw."
 dubois.1000.t: "Le Carnaval des animaux"
 dubois.1000.d: "Podczas wizyty w Ogrodzie Zoologicznym pewien kompozytor odnalazł inspirację wśród lwa, słonia, kangura i żółwi, co zaowocowało pełną fantazji suitą muzyczną zatytułowaną „Karnawał zwierząt”."
 dubois.1000.f: "„Karnawał zwierząt” (Grande fantaisie zoologique) został skomponowany przez Camille’a Saint-Saënsa w 1886 roku podczas pobytu w niewielkiej austriackiej wiosce. Wykorzystując wcześniejsze szkice z czasów pracy pedagogicznej w Paryżu, Saint-Saëns stworzył ten żartobliwy utwór kameralny za namową uczniów, którzy lubili muzyczne parodie. W trosce o swoją reputację kompozytor nie zgodził się na publikację dzieła za życia, gdyż w humorystyczny sposób naśladowało ono odgłosy zwierząt i subtelnie wyśmiewało innych kompozytorów. Dopiero po śmierci Saint-Saënsa utwór trafił do szerokiej publiczności dzięki wydawcy Jacques’owi Durandowi."
 dubois.1000.g: "Zoologiczne arcydzieło muzyczne?"
 dubois.1001.t: "Wejście do Ogrodu Zoologicznego"
 dubois.1001.d: "Witamy przy Głównym Wejściu do Ogrodu Zoologicznego. Stąd możesz udać się do poszczególnych wybiegów zwierząt."
