 dubois_theory_of_evolution_tech: "Teoria Ewolucji"
 dubois_theory_of_evolution_tech_desc: "Teoria ewolucji drogą doboru naturalnego przyniosła ostateczne zerwanie z doktryną niezmienności typów biologicznych. Darwin zauważył, że nieograniczony wzrost populacji nieuchronnie prowadzi do „walki o byt”, w której korzystne odmiany zostają zachowane, a pozostałe są eliminowane. Mechanizm ten racjonalnie wyjaśnia różnorodność flory i fauny wywodzących się od wspólnych przodków. Wnioski te budziły niepokój wielu osób, sugerowały bowiem, że ludzkość nie zajmuje uprzywilejowanego miejsca w porządku przyrody."
 dubois_paleontology_tech: "Paleontologia"
 dubois_paleontology_tech_desc: "Zainteresowanie zamierzchłą historią Ziemi i wymarłymi organizmami sięga starożytności, lecz istotnym przełomem stały się badania Georges’a Cuviera nad anatomią porównawczą prowadzone około 1800 roku. Publikacja „O powstawaniu gatunków” wyznaczyła punkt zwrotny w naukach biologicznych, zwłaszcza w paleontologii. Wywołana nią debata naukowa zapoczątkowała systematyczne poszukiwania skamieniałości form przejściowych oraz empirycznych dowodów procesów ewolucyjnych w zapisie geologicznym."
 dubois_genetics_tech: "Genetyka"
 dubois_genetics_tech_desc: "Współczesna genetyka wywodzi się ze skrupulatnych eksperymentów augustianina Gregora Johanna Mendla. Ponowne odkrycie jego prac w 1900 roku zapoczątkowało szybki rozwój tej dziedziny. Do 1915 roku wyjaśniono zasady dziedziczenia mendlowskiego u różnorodnych organizmów, zwłaszcza muszki owocowej Drosophila melanogaster. Równocześnie matematycy opracowali statystyczne podstawy genetyki populacyjnej, włączając teorię genetyczną w szersze badania"
 dubois_paleontologist: "Paleontolog"
 dubois_paleontologist_desc: "Uczony poświęcający się badaniu skamieniałych szczątków, odkrywający zapomniane światy prehistorycznego życia."
 dubois_paleontologist_experienced: "Wybitny Paleontolog"
 dubois_paleontologist_experienced_desc: "Dzięki serii znaczących wykopalisk ten naukowiec zdobył uznanie wśród ówczesnych towarzystw geologicznych."
 dubois_paleontologist_famous: "Znamienity Paleontolog"
 dubois_paleontologist_famous_desc: "Dzięki bogatemu dorobkowi badawczemu i głośnym odkryciom ten paleontolog uchodzi za czołowy autorytet w dziedzinie dawnego życia."
 ask_for_zoo_animal: "Pozyskaj Egzotyczne Zwierzę"
 ask_for_zoo_animal_desc: "Jeśli państwo to posiada [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animal|q$')], którego nie ma jeszcze w naszej kolekcji, możemy wystąpić z oficjalną prośbą o jego pozyskanie."
