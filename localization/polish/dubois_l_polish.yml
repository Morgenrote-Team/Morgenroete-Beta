 dubois.1062.t: "Wybieg Leniwca Pstrego"
 dubois.1062.d: "Bujna zieleń wybiegu #o Leniwca Pstrego#! stwarzała idealne warunki dla tego powolnego zwierzęcia. Rosło tam wiele drzew, na których leniwce mogły zwisać z gałęzi."
 dubois.1062.f1: "Na bujnie porośniętym wybiegu ogrodu zoologicznego powolny i uroczy leniwiec pstry bez wysiłku trzyma się gałęzi, a jego niespieszne ruchy i łagodne usposobienie przyciągają uwagę zwiedzających. Zaintrygowany jego wyjątkowymi przystosowaniami, podchodzisz do doświadczonego opiekuna zwierząt, pragnąc dowiedzieć się więcej o tym fascynującym ssaku nadrzewnym.\n\n„Leniwiec pstry jest mistrzem niespiesznego życia” — zaczyna opiekun. „Te niezwykłe stworzenia przystosowały się do życia w koronach drzew lasów deszczowych Ameryki Środkowej i Południowej. Dzięki długim, zakrzywionym pazurom i odpowiednio przystosowanym mięśniom leniwce doskonale radzą sobie, wisząc grzbietem w dół. Ich niespieszne ruchy i powolny metabolizm pomagają oszczędzać energię i pozwalają im przetrwać na diecie złożonej głównie z liści”."
 dubois.1062.f2: "W spokojnym, nadrzewnym zakątku ogrodu zoologicznego leniwiec pstry niespiesznie przemierza korony drzew, a jego kudłate futro i szeroko otwarte oczy budzą poczucie spokoju. Zaintrygowany jego trybem życia, szukasz doświadczonego opiekuna zwierząt, licząc, że dowiesz się więcej o intrygujących zachowaniach tych fascynujących ssaków.\n\n„Leniwce pstre słyną z wyjątkowych przystosowań i fascynujących zachowań” — wyjaśnia opiekun. „Większość życia spędzają wysoko na drzewach, często pozostając w bezruchu i wtapiając się w otoczenie. Mają wyspecjalizowany układ pokarmowy, który pozwala im trawić twarde, włókniste liście — ich całkowite strawienie może zająć kilka dni. Na ich futrze rosną również glony, które zapewniają im kamuflaż i dodatkowe składniki odżywcze”."
 dubois.1062.f3: "Pośród bujnej zieleni wybiegu leniwiec pstry zwisa z gałęzi grzbietem w dół, najwyraźniej niewzruszony zgiełkiem ogrodu zoologicznego. Zaintrygowany jego pozornie beztroskim usposobieniem, podchodzisz do doświadczonego opiekuna zwierząt, chcąc zrozumieć znaczenie tego niespiesznego trybu życia.\n\n„Niespieszny tryb życia leniwca pstrego jest doprawdy niezwykły” — wyjaśnia opiekun. „Jego powolne ruchy nie tylko pozwalają oszczędzać energię, lecz także zapewniają pewną ochronę przed drapieżnikami. Spędzając większość czasu w zwisie grzbietem w dół, leniwce stają się mniej widoczne, a ich szczególne futro pomaga im wtapiać się w otaczające listowie. To fascynujące przystosowanie ukazuje wyjątkowe sposoby, dzięki którym leniwce potrafią przetrwać w swoim nadrzewnym środowisku”."
 dubois.1062.k: "Wróć do Południowoamerykańskich Wybiegów"
 zoo_south_american_enclosures_tt: "Wrócisz do Południowoamerykańskich Wybiegów Ogrodu Zoologicznego."
 dubois.1063.t: "Wybieg Jaguara"
 dubois.1063.d: "Przypominający dżunglę wybieg był królestwem #o Jaguara#!. Pełen zielonych krzewów, drzew i bujnej roślinności, zapewniał mu doskonałe kryjówki."
 dubois.1063.f1: "Na wybiegu ogrodu zoologicznego, wiernie odtwarzającym krajobraz dżungli, potężny i skryty jaguar przemyka pewnym krokiem, a jego smukłe, muskularne ciało doskonale wtapia się w bujne otoczenie. Zaintrygowany jego sławą sprawnego łowcy, podchodzisz do doświadczonego opiekuna zwierząt, pragnąc dowiedzieć się więcej o tym słynnym wielkim kocie.\n\n„Jaguar, o charakterystycznym umaszczeniu w rozety i potężnej budowie, jest władcą lasu deszczowego” — zaczyna opiekun. „Wyposażony w silne szczęki i ostre pazury, jest drapieżnikiem szczytowym, zdolnym upolować rozmaite zwierzęta, w tym duże ssaki, gady i ryby. Jaguary słyną ze skrytego sposobu polowania, często atakując ofiary z zasadzki szybkimi i precyzyjnymi ciosami. Ich obecność w ekosystemie pomaga regulować liczebność ofiar i utrzymywać delikatną równowagę lasu deszczowego”."
 dubois.1063.f2: "Na urzekającym wybiegu jaguarów w ogrodzie zoologicznym smukły i zwinny jaguar z gracją wspina się na drzewo, demonstrując niezwykłe umiejętności poruszania się wśród gałęzi. Jego muskularne kończyny i bystre spojrzenie przyciągają uwagę zwiedzających. Zaintrygowany jego sprawnością we wspinaczce, szukasz doświadczonego opiekuna zwierząt, licząc, że dowiesz się więcej o życiu tego zagadkowego kota.\n\n„Jaguary słyną z niezwykłych umiejętności wspinaczkowych, które wyróżniają je spośród innych wielkich kotów” — wyjaśnia opiekun. „Mają potężne kończyny i chowane pazury, dzięki którym pewnie poruszają się po drzewach. Często wykorzystują gałęzie jako punkty obserwacyjne lub miejsca odpoczynku po udanym polowaniu. Zdolność wspinania się i przemieszczania w koronach drzew świadczy o ich wszechstronności jako sprawnych drapieżników”."
 dubois.1063.f3: "Pośród bujnej roślinności na wybiegu jaguarów potężny samiec wydaje niski, donośny ryk, który niesie się w powietrzu, demonstrując jego siłę i prawa do terytorium. Zaintrygowany jego głosem, podchodzisz do doświadczonego opiekuna zwierząt, chcąc zrozumieć znaczenie tych dźwięków.\n\n„Odgłosy wydawane przez jaguary pełnią wiele funkcji” — wyjaśnia opiekun. „Ich głębokie ryki służą oznajmianiu obecności i obronie terytorium. Pomagają również porozumiewać się z potencjalnymi partnerami, zwłaszcza w okresie godowym. Jaguary dysponują bogatym repertuarem głosowym, obejmującym pomruki, warczenie i parskanie. Wsłuchując się w te charakterystyczne odgłosy, badacze zdobywają cenne informacje o zachowaniu i relacjach społecznych tych majestatycznych kotów”."
 dubois.1064.t: "Wybieg Mrówkojada Wielkiego"
 dubois.1064.d: "Na wybiegu #o Mrówkojada Wielkiego#! dominowały ogromne czerwone mrowiska, wyrastające ponad trawę. Mrówkojad mógł tam bez trudu ucztować na drobnych owadach."
 dubois.1064.f1: "Na wybiegu ogrodu zoologicznego, wiernie odtwarzającym naturalne środowisko, przechadza się niezwykły i fascynujący mrówkojad wielki, którego charakterystyczny wydłużony pysk i puszysty ogon przyciągają uwagę zwiedzających. Zaintrygowany jego wyspecjalizowanymi przystosowaniami, podchodzisz do doświadczonego opiekuna zwierząt, pragnąc dowiedzieć się więcej o tym osobliwym owadożernym ssaku.\n\n„Mrówkojad wielki jest mistrzem polowania na owady” — zaczyna opiekun. „Długi pysk, lepki język i ostre pazury doskonale przystosowują go do wyspecjalizowanej diety. Mrówkojady zjadają codziennie tysiące mrówek i termitów, posługując się niezwykłym językiem, który mogą wysuwać na długość do dwóch stóp. Wyostrzony węch pomaga im odnajdywać kolonie owadów, a ostre pazury pozwalają z łatwością rozrywać termitiery”."
 dubois.1064.f2: "Na przyciągającym wzrok wybiegu mrówkojadów w ogrodzie zoologicznym mrówkojad wielki niespiesznie przemierza otoczenie, a jego charakterystyczna czarno-biała sierść wtapia się w grę promieni słońca przesączających się przez drzewa. Zaintrygowany jego wyjątkowym wyglądem, szukasz doświadczonego opiekuna zwierząt, licząc, że dowiesz się więcej o fascynującym trybie życia tego urzekającego ssaka.\n\n„Mrówkojady wielkie to fascynujące stworzenia o niezwykłych zwyczajach” — wyjaśnia opiekun. „Są przede wszystkim samotnikami, spędzającymi czas na poszukiwaniu owadów i odpoczynku w dziuplach lub norach. Mają powolny metabolizm i niską temperaturę ciała, co pozwala im oszczędzać energię. Są także znakomitymi pływakami i z łatwością pokonują zbiorniki wodne dzięki ciałom utrzymującym się na powierzchni oraz długim pyskom służącym niczym rurki do oddychania”."
 dubois.1064.f3: "Pośród bujnego listowia na wybiegu mrówkojad wielki rozrywa termitierę potężnymi pazurami, błyskawicznie wysuwając i chowając język, by chwytać drobne owady. Zaintrygowany jego sposobem zdobywania pożywienia, podchodzisz do doświadczonego opiekuna zwierząt, chcąc zrozumieć znaczenie tego zachowania.\n\n„Sposób żerowania mrówkojada wielkiego jest doprawdy niezwykły” — wyjaśnia opiekun. „Posługuje się on wyspecjalizowaną techniką zdobywania pokarmu, rozrywając mrowiska i termitiery ostrymi pazurami. Potrafi wysuwać i chować język nawet 160 razy na minutę, zbierając owady z niezwykłą precyzją. Taki sposób żerowania pomaga regulować liczebność owadów i odgrywa kluczową rolę w ekosystemie”."
 dubois.1065.t: "Wybieg Pancernika Dziewięciopaskowego"
 dubois.1065.d: "#o Pancerniki Dziewięciopaskowe#! dobrze radzą sobie w różnorodnych siedliskach — od ciepłych i wilgotnych obszarów po zarośla, prerie i tropikalne lasy deszczowe. W ogrodzie zoologicznym zdecydowano się połączyć elementy tych środowisk."
 dubois.1065.f1: "Na fascynującym wybiegu ogrodu zoologicznego krząta się ciekawski pancernik dziewięciopaskowy, którego segmentowany pancerz i charakterystyczny ryjek przyciągają uwagę zwiedzających. Zaintrygowany jego wyjątkowymi przystosowaniami, podchodzisz do doświadczonego opiekuna zwierząt, pragnąc dowiedzieć się więcej o tym osobliwym ssaku.\n\n„Pancernik dziewięciopaskowy jest mistrzem obrony i przystosowania” — zaczyna opiekun. „Jego niezwykły pancerz, złożony z kostnych płytek, zapewnia ochronę przed drapieżnikami. W obliczu zagrożenia potrafi zwinąć się w kulę, wystawiając na zewnątrz pancerz i pozostawiając niewiele odsłoniętych miejsc podatnych na atak. Silne pazury doskonale służą mu do kopania i poszukiwania ulubionego pokarmu — owadów, takich jak mrówki i termity”."
 dubois.1065.f2: "Na przyciągającym wzrok wybiegu pancerników w ogrodzie zoologicznym pancernik dziewięciopaskowy wykorzystuje wyostrzony węch, by wyczuć owady ukryte w ziemi, badając podłoże charakterystycznym ryjkiem w poszukiwaniu posiłku. Zaintrygowany jego sposobem żerowania, szukasz doświadczonego opiekuna zwierząt, licząc, że dowiesz się więcej o fascynującym trybie życia tego opancerzonego ssaka.\n\n„Pancerniki dziewięciopaskowe to fascynujące stworzenia o niezwykłych umiejętnościach zdobywania pokarmu” — wyjaśnia opiekun. „Przy odnajdywaniu owadów w glebie polegają przede wszystkim na węchu. Dzięki ostrym pazurom i silnym przednim kończynom z łatwością rozkopują ziemię, odsłaniając swoje ofiary. Mają wyspecjalizowany język, którym mogą sięgać głęboko do korytarzy mrówek i termitów, precyzyjnie wydobywając ulubione przysmaki”."
 dubois.1065.f3: "Po piaszczystym podłożu wybiegu pancerników biega pancernik dziewięciopaskowy, pozostawiając za sobą ślad płytkich dołków w poszukiwaniu kolejnego posiłku. Zaintrygowany jego kopaniem, podchodzisz do doświadczonego opiekuna zwierząt, chcąc zrozumieć znaczenie tego zachowania.\n\n„Kopanie jest niezbędnym elementem życia pancernika dziewięciopaskowego” — wyjaśnia opiekun. „Zwierzęta te drążą płytkie nory, służące jako doraźne kryjówki, w których chronią się przed skrajnymi temperaturami i potencjalnymi zagrożeniami. Nory zapewniają im również bezpieczne miejsce do odpoczynku i wydawania potomstwa na świat. Zdolność pancerników do kopania i tworzenia takich schronień świadczy o ich umiejętności przystosowania się do różnych środowisk”."
 dubois.1066.t: "Woliera Kondora Wielkiego"
 dubois.1066.d: "Aby odtworzyć krajobraz Andów, wolierę #o Kondora Wielkiego#! wypełniono skałami. Zbudowano ją na zboczu i umieszczono w niej również urwisko."
 dubois.1066.f1: "W rozległej wolierze ogrodu zoologicznego majestatyczny i budzący podziw kondor wielki szybuje z rozpostartymi skrzydłami, a jego ogromne rozmiary i efektowny wygląd przyciągają uwagę zwiedzających. Zaintrygowany jego wspaniałością, podchodzisz do doświadczonego opiekuna zwierząt, pragnąc dowiedzieć się więcej o tym słynnym ptaku Andów.\n\n„Kondor wielki jest symbolem potęgi i wolności” — zaczyna opiekun. „Dzięki imponującej rozpiętości skrzydeł, sięgającej trzech metrów, należy do największych ptaków latających na świecie. Te wspaniałe ptaki słyną z pełnego gracji lotu i zdolności do szybowania bez wysiłku nad górzystymi obszarami Andów. Potrafią w niezwykły sposób wykorzystywać termiczne prądy wznoszące, co pozwala im pokonywać ogromne odległości w poszukiwaniu pożywienia”."
 dubois.1066.f2: "W urzekającej wolierze ogrodu zoologicznego kondor wielki siedzi na skalnej półce, a jego pióra lśnią w słońcu, gdy bystrym wzrokiem obserwuje otoczenie. Zaintrygowany jego znakomitym wzrokiem, szukasz doświadczonego opiekuna zwierząt, licząc, że dowiesz się więcej o niezwykłych zdolnościach tego majestatycznego ptaka.\n\n„Kondory wielkie mają niezwykle ostry wzrok” — wyjaśnia opiekun. „Pozwala im on dostrzegać z dużych wysokości potencjalne źródła pokarmu, takie jak padlina czy zwłoki zwierząt. Odgrywają ważną rolę ekologiczną jako służba porządkowa przyrody, pomagając zapobiegać rozprzestrzenianiu się chorób poprzez zjadanie padliny. Zdolność odnajdywania pożywienia z ogromnych odległości świadczy o ich niezwykłej ostrości widzenia”."
 dubois.1066.f3: "Na malowniczym tle wybiegu wspaniały samiec kondora wielkiego prezentuje zachwycające upierzenie, rozpościerając skrzydła i wydając głęboki, donośny głos, który niesie się w powietrzu. Zaintrygowany jego zachowaniem, podchodzisz do doświadczonego opiekuna zwierząt, chcąc zrozumieć znaczenie tych pokazów.\n\n„Pokazy kondora wielkiego pełnią wiele funkcji” — wyjaśnia opiekun. „Służą komunikacji i stanowią część rytuałów godowych. Samce urządzają złożone pokazy, by przyciągnąć samice: rozpościerają skrzydła, stroszą pióra i wydają niskie odgłosy. W ten sposób demonstrują swoją siłę, witalność i wartość jako potencjalni partnerzy. Obserwowanie tych pokazów jest niezwykłym przeżyciem i pozwala poznać rytuały godowe tych wspaniałych ptaków”."
 dubois.1067.t: "Wybieg Manata Karaibskiego"
 dubois.1067.d: "Manaty karaibskie miały duży basen, w którym mogły pływać, oraz kilka piaszczystych łach, na których mogły się wylegiwać."
 dubois.1067.f1: "W spokojnym wodnym zakątku ogrodu zoologicznego łagodny i majestatyczny manat karaibski sunie przez wodę, a jego duże ciało i spokojne usposobienie przyciągają uwagę zwiedzających. Zaintrygowany jego pełną spokoju obecnością, podchodzisz do doświadczonego opiekuna zwierząt, pragnąc dowiedzieć się więcej o tym słynnym ssaku morskim.\n\n„Manat karaibski jest symbolem gracji i bezbronności” — zaczyna opiekun. „Te łagodne olbrzymy występują w ciepłych wodach przybrzeżnych i wolno płynących rzekach. Mimo potężnych rozmiarów są roślinożercami, żywiącymi się głównie roślinnością wodną. Powolny metabolizm i życie w ciepłych wodach pomagają im oszczędzać energię. Niestety, manatom zagrażają utrata siedlisk i zderzenia z łodziami. Działania ochronne są niezbędne, by ocalić te łagodne stworzenia”."
 dubois.1067.f2: "W spokojnych wodach wybiegu manat karaibski unosi się tuż pod powierzchnią, a jego płetwy przy każdym ruchu delikatnie przecinają taflę. Widok unoszącego się na wodzie zwierzęcia przyciąga uwagę zwiedzających. Zaintrygowany jego sposobem pływania, szukasz doświadczonego opiekuna zwierząt, licząc, że dowiesz się więcej o życiu tego niezwykłego ssaka morskiego.\n\n„Manaty odznaczają się szczególną pływalnością, która ułatwia im poruszanie się” — wyjaśnia opiekun. „Ich duże, masywne ciała i wypełnione powietrzem płuca zapewniają im naturalną wyporność, pozwalając unosić się blisko powierzchni wody. Dzięki temu oszczędzają energię i bez wysiłku suną przez swoje wodne środowisko. Ich powolne, miarowe ruchy świadczą o przystosowaniu do życia w wodzie”."
 dubois.1067.f3: "W spokojnych wodach wybiegu manat karaibski wydaje serię cichych, melodyjnych odgłosów, które rozbrzmiewają w powietrzu, oznajmiając jego obecność i być może stanowiąc próbę nawiązania kontaktu. Zaintrygowany jego głosem, podchodzisz do doświadczonego opiekuna zwierząt, chcąc zrozumieć znaczenie tych dźwięków.\n\n„Manaty słyną z charakterystycznych odgłosów” — wyjaśnia opiekun. „Te łagodne stworzenia porozumiewają się za pomocą różnorodnych dźwięków, w tym ćwierkania, gwizdów i kliknięć. Ta wymiana sygnałów głosowych pomaga podtrzymywać więzi społeczne, odnajdywać się pod wodą i być może sygnalizować gotowość do godów. Odgłosy manatów pozwalają nam poznać złożone relacje społeczne tych ssaków morskich”."
 dubois.1068.t: "Wybieg Sajmiri Wiewiórczej"
 dubois.1068.d: "Wybieg Sajmiri Wiewiórczej był pełen drzew i innych elementów do wspinaczki i zabawy. Było to idealne miejsce dla tych małp."
 dubois.1068.f1: "Na tętniącym życiem wybiegu ogrodu zoologicznego, urządzonym na wzór lasu deszczowego, grupa energicznych i towarzyskich sajmiri wiewiórczych zwinnie przeskakuje między drzewami, a ich szybkie ruchy i figlarne wybryki przyciągają uwagę zwiedzających. Zaintrygowany ich żywiołowym zachowaniem, podchodzisz do doświadczonego opiekuna zwierząt, pragnąc dowiedzieć się więcej o tych fascynujących naczelnych.\n\n„Obserwowanie sajmiri wiewiórczych to prawdziwa przyjemność” — zaczyna opiekun. „Te niewielkie naczelne słyną z niespożytej energii i silnych więzi w grupach społecznych. Wyróżniają się białymi maskami na pyszczkach i puszystymi ogonami. Sajmiri wiewiórcze porozumiewają się za pomocą różnorodnych odgłosów, od ostrych głosów alarmowych po kojące mruczenie. Ich współpraca i ożywione relacje społeczne czynią je fascynującym obiektem badań”."
 dubois.1068.f2: "W tętniącym życiem otoczeniu lasu deszczowego na wybiegu małp sajmiri wiewiórcza starannie pielęgnuje sierść swojego towarzysza, a ich bliski kontakt i delikatne ruchy świadczą o sile łączących je więzi społecznych. Widok ten przyciąga uwagę zwiedzających. Zaintrygowany ich wzajemnymi relacjami, szukasz doświadczonego opiekuna zwierząt, licząc, że dowiesz się więcej o życiu tych urzekających naczelnych.\n\n„Wzajemna pielęgnacja jest niezwykle ważnym elementem życia społecznego sajmiri wiewiórczych” — wyjaśnia opiekun. „Pełni wiele funkcji, od utrzymywania higieny i usuwania pasożytów po wzmacnianie więzi społecznych w grupie. Sajmiri wiewiórcze wzajemnie pielęgnują sobie sierść, a nawet oczyszczają pyszczki. Takie zabiegi umacniają relacje społeczne i sprzyjają spójności grupy”."
 dubois.1068.f3: "Pośród bujnego listowia na wybiegu małp skora do zabawy sajmiri wiewiórcza wydaje serię wysokich odgłosów, które niosą się w powietrzu, oznajmiając jej obecność i służąc porozumiewaniu się. Zaintrygowany jej głosem, podchodzisz do doświadczonego opiekuna zwierząt, chcąc zrozumieć znaczenie tych dźwięków.\n\n„Sajmiri wiewiórcze są niezwykle rozgadanymi stworzeniami” — wyjaśnia opiekun. „Ich repertuar głosowy obejmuje zarówno głośne sygnały alarmowe, jak i ciche gruchanie. Ta wymiana odgłosów pozwala im porozumiewać się z innymi członkami grupy, ostrzegać ich przed potencjalnymi zagrożeniami i sygnalizować swoje zamiary. Sajmiri wiewiórcze posługują się także mową ciała, w tym zabiegami pielęgnacyjnymi i gestami, by przekazywać informacje w ramach swojego ożywionego życia społecznego”."
 dubois.1101.t: "W Ogrodzie Zoologicznym przyszły na świat [SCOPE.GetRootScope.GetCountry.GetCustom('dubois_zoo_baby_type')]!"
 dubois.1101.d: "W ostatnich dniach ogród zoologiczny przyciągnął więcej zwiedzających niż zwykle, ponieważ przyszły w nim na świat [SCOPE.GetRootScope.GetCountry.GetCustom('dubois_zoo_baby_type')]. Teraz możemy nadać imię jednemu z tych małych zwierząt."
