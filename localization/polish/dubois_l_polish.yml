 dubois_send_paleontologist_to_excavation_button: "Wyślij Paleontologa"
 dubois_send_paleontologist_to_excavation_button_desc: "Wyślij [concept_dubois_paleontologist] na [concept_dubois_paleontological_excavation].\nObecność Paleontologa zwiększy liczbę [Concept('concept_dubois_fossil','$concept_dubois_fossils|q$')] i [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones|q$')] pozyskiwanych z Wykopalisk.\n\nMożesz odwołać Paleontologa w dowolnym momencie, ale przez rok nie będzie mógł wrócić na Wykopaliska."
 dubois_recall_paleontologist_from_excavation_button: "Odwołaj Paleontologa"
 dubois_recall_paleontologist_from_excavation_button_desc: "Odwołaj [concept_dubois_paleontologist] z [concept_dubois_paleontological_excavation].\nNie będziesz już otrzymywać dodatkowych [Concept('concept_dubois_fossil','$concept_dubois_fossils|q$')] i [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones|q$')] z Wykopalisk.\n\nPaleontolog #n nie będzie mógł#! wyruszyć na kolejne Wykopaliska przez #n rok#!."
 dubois_recall_excavation_button: "Odwołaj Zespół"
