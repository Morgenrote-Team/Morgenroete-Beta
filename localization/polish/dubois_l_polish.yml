 smuggle_zoo_animal: "Przemyć zwierzę do zoo"
 smuggle_zoo_animal_desc: "Naglące okoliczności - takie jak nieprzyjazne stosunki - mogą sprawić, że konieczne będzie pilne sprowadzenie do naszego zoo [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animal|q$')] przy użyciu „specjalnych środków”."
