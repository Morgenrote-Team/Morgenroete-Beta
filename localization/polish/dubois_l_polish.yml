 dubois.1022.t: "Wybieg Pandy Wielkiej"
 dubois.1022.d: "To schronienie dla #o Pandy Wielkiej#! łączy zacienioną pagodę z gęstwiną bambusów, przywodząc na myśl górskie lasy strefy umiarkowanej, które zamieszkuje."
 dubois.1022.f1: "Pod bambusami króluje samica ze swym maleńkim młodym. Panda Wielka słynie z niewielkiej rozrodczości; samica przechodzi ruję tylko przez krótki czas w roku, a noworodek — ważący często niewiele ponad dwieście gramów — przychodzi na świat ślepy i bezradny. Matka otacza go zatem niezwykle troskliwą opieką, karmiąc mlekiem i strzegąc, dopóki nie nabierze dostatecznej siły i koordynacji ruchowej."
 dubois.1022.f2: "Zabawa, choć z pozoru bezcelowa, ma wyraźny pożytek. Młode siłują się i baraszkują, ćwicząc sprawność kończyn, utrzymywanie równowagi na nierównym podłożu oraz podstawowe zasady obcowania z przedstawicielami własnego gatunku. Nawet dorosłe zwierzęta od czasu do czasu oddają się igraszkom, przypominając, że ruch służy zdrowiu tak samo w menażerii, jak na wolności."
 dubois.1022.f3: "Panda Wielka to wyjątkowy przedstawiciel niedźwiedziowatych, którego dieta składa się niemal wyłącznie z bambusa. Jej zespoły zębów trzonowych są poszerzone i przystosowane do miażdżenia włóknistych pędów, a niezwykła trzeszczka promieniowa — tak zwany fałszywy kciuk — pomaga chwytać źdźbła. Aby zrekompensować niską wartość odżywczą pokarmu, panda musi poświęcać wiele czasu na jedzenie i oszczędzać siły, poruszając się niespiesznym krokiem."
 dubois.1022.k: "Wróć do Azjatyckich Wybiegów"
 zoo_asian_enclosures_tt: "Wrócisz do Azjatyckich Wybiegów Ogrodu Zoologicznego."
 dubois.1023.t: "Wybieg Orangutana"
 dubois.1023.d: "W języku malajskim orangutan oznacza „człowieka lasu”. Tutaj #o Orangutany Borneańskie#! mają do dyspozycji podwieszone kładki, siatki i liczne drewniane konstrukcje, stosownie do życia spędzanego głównie wśród gałęzi."
 dubois.1023.f1: "Orangutan prowadzi najbardziej nadrzewny tryb życia spośród małp człekokształtnych. Dzięki ogromnej rozpiętości ramion oraz niezwykle giętkim dłoniom i stopom przemieszcza się w koronach drzew, huśtając się na ramionach i ostrożnie wspinając. Każdego wieczoru buduje z przygiętych gałęzi staranne posłanie — zwyczaj ten obserwuje się zarówno na wolności, jak i w niewoli, gdy zapewni mu się odpowiednie warunki."
 dubois.1023.f2: "Więź matki z potomstwem jest długotrwała i godna podziwu. Młode pozostaje przy matce przez lata, ucząc się sztuki budowania gniazd, wybierania owoców i ostrożnego przemieszczania się. Taka cierpliwość i nauka świadczą o wysokiej inteligencji oraz organizacji społecznej dostosowanej do samotniczego życia w lesie."
 dubois.1023.f3: "Dorosłe samce, zwłaszcza te o rozwiniętych talerzach policzkowych, wydają długie, donośne nawoływania, niosące się na znaczne odległości. Te głosowe obwieszczenia oznajmiają ich obecność, odstraszają rywali i, jak się uważa, pomagają poszczególnym osobnikom zachować dystans w gęstym lesie."
 dubois.1024.t: "Wybieg Tygrysa"
 dubois.1024.d: "Z początku wybieg wydaje się pusty; potem z cienia w słońce wyłania się #o Tygrys Bengalski#!, poruszając się niespiesznie i z nieomylną pewnością, a jego pasiasta sierść sprawia, że sylwetka niemal magicznie wtapia się w otoczenie."
 dubois.1024.f1: "Tygrys Bengalski to najwspanialszy spośród azjatyckich kotów. Samotniczy i terytorialny, poluje głównie z ukrycia, wykorzystując potężną przednią część ciała, chowane pazury i nagły atak z niewielkiej odległości. Jego słynne umaszczenie — pasy na rudym tle — sprawia, że sylwetka wtapia się w trzciny i leśne cienie."
 dubois.1024.f2: "Tygrysica jest czujną matką. Po krótkiej ciąży udaje się do zacisznej kryjówki, gdzie rodzi od dwóch do czterech młodych. Stopniowo przyzwyczaja je do mięsa, uczy rozpoznawania zapachów i tropów oraz udziela niezbędnych lekcji ostrożności, cierpliwości i zdecydowanego skoku na zdobycz."
 dubois.1024.f3: "W repertuarze głosowym tygrysa znajdują się odgłosy przypominające kaszel, jęki oraz donośny ryk, który o zmierzchu oznajmia, że terytorium jest zajęte. Głosy te ograniczają zbędne starcia, a w okresie godowym sygnalizują obecność odpowiedniego partnera."
 dubois.1025.t: "Wybieg Tapira Malajskiego"
 dubois.1025.d: "Ten zacieniony wybieg dla #o Tapira Malajskiego#! zapewnia schronienie, liście i pędy do żerowania oraz wodę, naśladując warunki jego rodzimych, wiecznie zielonych lasów."
 dubois.1025.f1: "Tapir Malajski wyróżnia się kontrastowym czarno-białym umaszczeniem, dzięki któremu jego sylwetka wtapia się w grę światła i cienia. Aktywny głównie nocą, za pomocą chwytnego ryjka zrywa pędy i liście, a do wody chętnie wchodzi zarówno dla ochłody, jak i w poszukiwaniu schronienia przed niebezpieczeństwem."
 dubois.1025.f2: "Po długiej ciąży samica rodzi jedno młode, uroczo pręgowane i cętkowane — ten młodzieńczy kamuflaż zanika z wiekiem. Matka kieruje nim łagodnie, lecz stanowczo, prowadząc bezpiecznymi ścieżkami do żerowisk i zbiornika wodnego."
 dubois.1025.f3: "Tapiry porozumiewają się za pomocą delikatnych gwizdów i niskich pomruków. Dźwięki te służą utrzymywaniu kontaktu w gęstych zaroślach, zalotom oraz, jak się uważa, dyskretnemu uzgadnianiu wzajemnych spotkań i mijania się podczas samotnych wędrówek przez las."
 dubois.1026.t: "Wybieg Warana z Komodo"
 dubois.1026.d: "Na tym ciepłym, skalistym wybiegu kilka #o Waranów z Komodo#! wygrzewa się lub patroluje teren dostojnym krokiem, badając powietrze językami."
 dubois.1026.f1: "Waran z Komodo, największa z żyjących jaszczurek, to niezwykle silny łowca polujący z zasadzki, który potrafi również odnajdywać padlinę. Ząbkowane zęby i potężna szyja pozwalają mu zadawać głębokie rany; wskutek działania jadowitych wydzielin i zakażenia nawet silna ofiara może paść po krótkim pościgu."
 dubois.1026.f2: "Przystosowany do surowych warunków wysp, gatunek ten doskonale radzi sobie dzięki niewielkim potrzebom i cierpliwości. Ma bystry wzrok i wyostrzoną zdolność wykrywania substancji chemicznych, co pozwala mu odnajdywać odległą padlinę z zadziwiającą niezawodnością. Postawą i wyglądem zwierzę przywodzi na myśl pradawny świat."
 dubois.1026.f3: "Do pokazów dominacji należą nadymanie gardła, kiwanie głową i syczenie. Te rytuały, choć robią wrażenie, oszczędzają rywalom bardziej wyniszczających starć i wystarczają do ustalenia pierwszeństwa przy padlinie lub w miejscu wygrzewania się."
 dubois.1027.t: "Wybieg Irbisa Śnieżnego"
 dubois.1027.d: "Skalisty wybieg z licznymi półkami odpowiada potrzebom #o Irbisa Śnieżnego#!, którego rodzime królestwo rozciąga się na mroźnych wyżynach Azji."
 dubois.1027.f1: "Irbis Śnieżny jest doskonale przystosowany do wysokogórskiego terenu: szerokie, owłosione łapy zapewniają pewne oparcie, długi ogon pomaga utrzymać równowagę i chroni przed zimnem, a jasna, cętkowana sierść wtapia się w piargi i śnieg. Porusza się bezszelestnie, ze sprężystą gracją, pokonując teren, który dla mniej sprawnych zwierząt byłby nie do przebycia."
 dubois.1027.f2: "Żywi się głównie dzikimi owcami i kozami, a gdy nadarzy się okazja, poluje także na świstaki i zające. Z natury samotniczy, przemierza rozległe obszary i jest najaktywniejszy o świcie i zmierzchu."
 dubois.1027.f3: "W okresie godowym niskie miauczenie i inne przyciszone odgłosy oznajmiają obecność i zamiary zwierzęcia. Głosy te, choć skromne w porównaniu z rykiem lwa, wystarczają w rozrzedzonym powietrzu, by umożliwić partnerom odnalezienie się wśród nierówności terenu."
 dubois.1028.t: "Wybieg Geparda Azjatyckiego"
 dubois.1028.d: "Ten rozległy, otwarty wybieg przywodzi na myśl surowe równiny Bliskiego Wschodu, gdzie #o Gepard Azjatycki#! niegdyś występował znacznie powszechniej."
 dubois.1028.f1: "Gepard Azjatycki jest prawdziwym uosobieniem szybkości. Smukła sylwetka, głęboka klatka piersiowa i długie kończyny, a także częściowo chowane pazury zapewniające przyczepność, pozwalają mu na sprint niezrównany wśród czworonogów. Niestety, pozostała już tylko szczątkowa populacja, którą należy otoczyć troskliwą ochroną."
 dubois.1028.f2: "Sztuka łowiecka geparda polega na skradaniu się, sprincie i podcinaniu nóg ofierze. Ciemne smugi pod oczami ograniczają oślepiający blask, a giętki kręgosłup umożliwia niezwykle długie susy. Jego zwykłą zdobyczą są gazele i inne niewielkie antylopy."
 dubois.1028.f3: "Samce wydają niskie, pulsujące odgłosy, by oznajmić zajęcie terytorium i swoją kondycję. Dźwięki te ograniczają starcia między rywalami i wskazują drogę potencjalnym partnerkom. W hodowli uważne badanie tych głosów okazało się pomocne w zapewnianiu dobrostanu gatunku."
