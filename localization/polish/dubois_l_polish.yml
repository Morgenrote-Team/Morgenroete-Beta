 dubois.1030.t: "Wybieg Manuli"
 dubois.1030.d: "Wybieg manuli był skalistym terenem pełnym szczelin i niewielkich jaskiń. Początkowo krępy, puszysty kot wydawał się niemal niewidoczny, doskonale wtapiając się w otoczenie. W końcu udało ci się dostrzec jednego z nich. Jego okrągłe, szeroko otwarte oczy ostrożnie wyglądały zza głazu, a on w ciszy obserwował wszystko wokół."
 dubois.1030.f1: "Na skalistym wybiegu w zoo manul wygląda zza głazu, omiatając otoczenie szeroko otwartymi, okrągłymi oczami. Z gęstym, srebrzystym futrem nastroszonym dla ochrony przed zimnem przypomina mały, dziki kłębek puchu. W odróżnieniu od wielu innych dzikich kotów manul ma krępą budowę i krótkie nogi, dzięki czemu jest doskonale przystosowany do życia w chłodnych, wysokogórskich rejonach Azji Środkowej."
 dubois.1030.f2: "Gdy manul wyłania się ze swojej kryjówki wśród skał, jego płaski pysk i duże, wyraziste oczy nadają mu niemal komiczny wygląd. Zwiedzających często zaskakują jego niewielkie rozmiary i puszyste futro, które pomagają mu wtapiać się w śnieżne otoczenie. Z natury samotnik, manul rzadko daje się dostrzec na wolności. W ciągu dnia woli pozostawać w szczelinach skalnych i norach, a na polowanie wychodzi o świcie lub zmierzchu."
 dubois.1030.f3: "W chłodnym otoczeniu wybiegu, odtwarzającym warunki stepowe, manul porusza się cicho i precyzyjnie, ciągnąc za sobą puszysty ogon niczym pióropusz. Ten niewielki dziki kot, znany ze skrytego trybu życia, woli samotność i polega na maskującym futrze, by pozostać niezauważonym zarówno przez drapieżniki, jak i ofiary. Manul żywi się głównie drobnymi ssakami i jest zręcznym łowcą, który dzięki doskonałemu wzrokowi dostrzega ruch na otwartym terenie."
