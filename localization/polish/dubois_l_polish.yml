 je_dubois_paleontological_expedition_reason: "Paleontolog prowadzi [concept_dubois_paleontological_expedition].\n$mr_divider_for_je$\nWyprawa potrwa 12 miesięcy. Po jej zakończeniu otrzymasz [Concept('concept_dubois_fossil','$concept_dubois_fossils|q$')] i [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones|q$')] w ilości zależnej od wartości #V Sukcesu#! Wyprawy.\n$mr_divider_for_je$\nCo miesiąc #V Szansa na Sukces#! nieznacznie wzrasta. Dodatkowo losowe wydarzenia mogą zwiększać lub zmniejszać Sukces.\n\nObecna szacowana miesięczna zmiana Sukcesu: #underline #tooltip:[GetRawTextTooltipTag('je_dubois_paleontological_expedition_monthly_progress_tt')] [Country.MakeScope.Var('dubois_paleontological_expedition_estimated_progress_var').GetValue|2+] #!#! (Maksimum: 1)\n$mr_divider_for_je$\nMożesz rozpocząć [concept_dubois_paleontological_excavation], jeśli masz wolny [concept_dubois_paleontological_team]. Wykopaliska będą biernie dostarczać więcej Skamielin i Kości.\n$mr_divider_for_je$\nObecne #tooltip:[GetRawTextTooltipTag('je_dubois_paleontological_expedition_yield_tt')] #underline #b szacowane znaleziska#!#!#! z Wyprawy:\n[GetPlayer.GetCustom('je_dubois_paleontological_expedition_yield_type')]"
 je_dubois_paleontological_expedition_yield_tt: "Otrzymujesz więcej skamielin i kości w zależności od #V Szansy na Sukces#!:\n0 - 3:     $je_dubois_paleontological_expedition_yield_level_1_loc$\n4 - 7:     $je_dubois_paleontological_expedition_yield_level_2_loc$\n8 - 11:   $je_dubois_paleontological_expedition_yield_level_3_loc$\n12 - 14: #p 4#! @dubois_fossil!  [Concept('concept_dubois_fossil','$concept_dubois_fossils|q$')] i #p 1#! @dubois_dinosaur_bone! [concept_dubois_dinosaur_bone]\n15:         #p 5#! @dubois_fossil!  [Concept('concept_dubois_fossil','$concept_dubois_fossils|q$')] i #p 2#! @dubois_dinosaur_bone! [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones|q$')]\n"
