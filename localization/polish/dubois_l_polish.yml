 je_breeding_programm_failed_tt: "Jeśli pozostanie mniej niż #n 1#! osobnik gatunku [GetPlayer.MakeScope.GetCountry.GetCustom('dubois_breeding_animal_type')], Program Hodowlany zakończy się niepowodzeniem."
 je_breeding_programm_succesfull_tt: "Osiągnięcie liczebności #p 4000#! lub więcej osobników gatunku [GetPlayer.MakeScope.GetCountry.GetCustom('dubois_breeding_animal_type')] zakończy Program Hodowlany i doprowadzi do powstania nowego Siedliska."
 notification_dubois_animal_breeding_notification_name: "Raport Hodowlany"
 notification_dubois_animal_breeding_notification_desc: "W tym roku liczebność populacji [GetPlayer.MakeScope.GetCountry.GetCustom('dubois_breeding_animal_type')] w naszym [concept_dubois_nature_reserve] zmieniła się o [GetPlayer.MakeScope.Var('dubois_animal_breeding_change_var').GetValue|0+=]. Obecnie żyje tam [GetPlayer.MakeScope.Var('dubois_breeding_animal_amount_var').GetValue|0+] osobników gatunku [GetPlayer.MakeScope.GetCountry.GetCustom('dubois_breeding_animal_type')]."
 dubois.1321.t: "Nowy dom dla [GetPlayer.MakeScope.GetCountry.GetCustom('dubois_breeding_animal_type')]"
 dubois.1321.d: "Nasz [concept_dubois_nature_reserve] zamieszkuje już wystarczająco wiele osobników gatunku [GetPlayer.MakeScope.GetCountry.GetCustom('dubois_breeding_animal_type')], by mógł powstać stabilny [concept_dubois_habitat]."
 dubois.1321.f: "To wielki dzień dla [GetPlayer.MakeScope.GetCountry.GetCustom('dubois_breeding_animal_type')]. Od teraz ich przyszłość będzie bezpieczna!"
 dubois.1321.g: "Wspaniale!"
 dubois.1322.t: "Rozmnażanie [GetPlayer.MakeScope.GetCountry.GetCustom('dubois_breeding_animal_type')] zakończyło się niepowodzeniem"
 dubois.1322.d: "Niestety, nasza próba utworzenia nowego, stabilnego [concept_dubois_habitat] w [concept_dubois_nature_reserve] w regionie [ROOT.Var('dubois_breeding_state_var').GetState.GetName] zakończyła się niepowodzeniem. Jeśli zechcemy, możemy spróbować ponownie, licząc na więcej szczęścia tym razem."
 dubois.1322.f: "Opłakujemy utratę [GetPlayer.MakeScope.GetCountry.GetCustom('dubois_breeding_animal_type')]."
 dubois.1322.g: "Cóż za smutny dzień."
 dubois.2001.t: "Kolekcja Paleontologiczna"
 dubois.2001.d: "Witamy w Kolekcji Paleontologicznej."
 dubois.2001.f_paleontologist: "Naszą kolekcją zarządza obecnie nasz [concept_dubois_paleontologist] [ROOT.Var('dubois_paleontologist_var').GetCharacter.GetFullName]. W jej skład wchodzą:\n\n#G [ROOT.Var('dubois_fossil').GetValue]#! @dubois_fossil! Skamieniałości\n\n#G [ROOT.Var('dubois_special_fossil').GetValue]#! @dubois_special_fossil! Specjalne Skamieniałości.\n\n#G [ROOT.Var('dubois_human_fossil').GetValue]#! @dubois_human_fossil! Skamieniałości Ludzkie\n\n#G [ROOT.Var('dubois_dinosaur_bone_total').GetValue]#! @dubois_dinosaur_bone! Kości Dinozaurów\n\n#G [ROOT.Var('dubois_dinosaur_skeleton').GetValue]#! @dubois_dinosaur_skeleton! Szkielety Dinozaurów\n\nNasza #T Ocena Dinozaurów#!, obejmująca wszystkie wystawione szkielety dinozaurów, wynosi [ROOT.Var('dubois_dinosaur_rating').GetValue]."
 dubois.2001.f_no_paleontologist: "Naszą kolekcją obecnie #R nikt nie zarządza#!. W jej skład wchodzą:\n\n#G [ROOT.Var('dubois_fossil').GetValue]#! @dubois_fossil! Skamieniałości\n\n#G [ROOT.Var('dubois_special_fossil').GetValue]#! @dubois_special_fossil! Specjalne Skamieniałości.\n\n#G [ROOT.Var('dubois_human_fossil').GetValue]#! @dubois_human_fossil! Skamieniałości Ludzkie\n\n#G [ROOT.Var('dubois_dinosaur_bone_total').GetValue]#! @dubois_dinosaur_bone! Kości Dinozaurów\n\n#G [ROOT.Var('dubois_dinosaur_skeleton').GetValue]#! @dubois_dinosaur_skeleton! Szkielety Dinozaurów\n\nNasza #T Ocena Dinozaurów#!, obejmująca wszystkie wystawione szkielety dinozaurów, wynosi [ROOT.Var('dubois_dinosaur_rating').GetValue]."
