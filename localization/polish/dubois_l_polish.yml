 dubois.118.t: "Kapibara"
 dubois.118.d: "Nasze zoo wzbogaciło się o nowe, egzotyczne zwierzę: dziś długo wyczekiwana #O Kapibara#! zamieszkała na swoim nowym wybiegu."
 dubois.118.f: "Kapibara, największy gryzoń świata, pochodzi z Ameryki Południowej. Dzięki palcom połączonym błoną pławną i ziemnowodnemu trybowi życia doskonale radzi sobie na terenach podmokłych i nad brzegami rzek. Kapibary są bardzo towarzyskimi zwierzętami, często żyjącymi w grupach liczących od 10 do 20 osobników. Żywią się głównie trawami i roślinami wodnymi, a słyną z łagodnego i spokojnego usposobienia. Mimo swoich rozmiarów znakomicie pływają i potrafią pozostawać pod wodą, by uniknąć drapieżników."
 dubois.118.g: "To ogromna Świnka Morska!"
 visit_capybara_tt: "Odwiedzisz wybieg #o Kapibary#!"
