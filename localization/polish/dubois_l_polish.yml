 dubois.10.t: "Likwidacja Zoo"
 dubois.10.d: "Rząd nie jest zainteresowany dalszym utrzymywaniem Zoo w regionie [SCOPE.sState('dubois_zoo_state').GetName]. Należy je zlikwidować, a zwierzęta sprzedać."
 dubois.10.f: "Państwo może utrzymywać tylko jedno zoo w stolicy. Ilość pieniędzy i liczba okazów, które otrzyma w zamian, zależą od wielkości zoo."
 dubois.10.g: "Ale... ale te wszystkie wspaniałe zwierzęta!"
