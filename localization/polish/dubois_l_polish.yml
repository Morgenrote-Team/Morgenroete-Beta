 dubois_nature_reserve_survey_decision: "Badanie Rezerwatu Przyrody"
 dubois_nature_reserve_survey_decision_desc: "Przeprowadź badanie w celu znalezienia miejsca na Rezerwat Przyrody. Takie badanie może potrwać #n kilka miesięcy#!."
 dubois.1210.t: "Siedlisko w regionie [ROOT.GetState.GetName] jest zagrożone"
 dubois.1210.d: "Nieustanna ekspansja cywilizacji zagraża [Concept('concept_dubois_habitat','$concept_dubois_animal_habitat|q$')] w regionie [ROOT.GetState.GetName]. Jeśli nie ochronimy miejscowej fauny, tworząc [concept_dubois_nature_reserve], zwierzęta wyginą za około 10 lat."
 dubois.1210.f: "Żarłoczne maszyny wgryzające się w ziemię. Rozrastające się miasta pochłaniające coraz więcej terenów. Linie kolejowe przecinające kwitnące połacie. Każdego dnia zwierzęta tracą kolejne części swojego królestwa. Krok po kroku wdzierają się do niego ludzie."
 dubois.1210.g: "Musimy chronić te zwierzęta!"
 dubois.1210.h: "Postęp ponad wszystko!"
 dubois_endangered_habitat_tt: "Gdy [concept_dubois_habitat] stanie się zagrożone, zostanie usunięte po 10 latach. Możesz temu zapobiec, tworząc [concept_dubois_nature_reserve] w tym regionie. W ten sposób ochronisz [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals|q$')] przed wyginięciem."
 dubois_habitat_endangered_modifier: "Siedlisko zagrożone"
 dubois_habitat_endangered_timer_modifier: "Czas do utraty siedliska"
 dubois_habitat_protection_path_modifier: "Gotowość do ochrony siedliska"
 dubois_habitat_destruction_path_modifier: "Postęp ponad wszystko"
 dubois.1211.t: "Siedlisko w regionie [ROOT.GetState.GetName] zostało zniszczone"
 dubois.1211.d: "Ponieważ nie zdołaliśmy ochronić [Concept('concept_dubois_habitat','$concept_dubois_animal_habitat|q$')] w regionie [ROOT.GetState.GetName], tworząc [concept_dubois_nature_reserve], siedlisko zostało zniszczone."
 dubois.1211.f: "Niestety, założenie przedsiębiorstwa górniczego odbyło się kosztem zniszczenia siedliska jednego ze zwierząt występujących w naszym kraju. Ale kogo to obchodzi? Czekają na nas zyski!"
 dubois.1211.g: "O nie. No nic."
 dubois_breeding_animal_trigger_tt: "Możesz hodować [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals|q$')], jeśli posiadasz region, w którym znajduje się [concept_dubois_nature_reserve], ale nie występuje jeszcze dane zwierzę pochodzące z tej samej części świata co #b Rezerwat Przyrody#!, a także masz to zwierzę w swoim [concept_dubois_zoo].\n\nJeśli na przykład masz #b Rezerwat Przyrody#! w regionie europejskim i chcesz hodować w nim #b Koziorożca Alpejskiego#!, możesz to zrobić tylko wtedy, gdy w tym regionie nie istnieje jeszcze [concept_dubois_habitat] koziorożca, a w twoim #b Zoo#! znajdują się #b Koziorożce Alpejskie#!."
