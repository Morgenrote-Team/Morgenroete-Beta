 dubois.1052.t: "Wybieg Niedźwiedzia Polarnego"
 dubois.1052.d: "Wybieg #o Niedźwiedzia Polarnego#! jest prawdopodobnie najmniej zbliżony do naturalnego siedliska spośród wszystkich wybiegów w każdym ogrodzie zoologicznym. Nie dlatego, że ogrody się nie starają, lecz raczej dlatego, że przyciągają zwiedzających tylko wtedy, gdy nie znajdują się na biegunie północnym. Mimo to skalisty wybieg był przyjemnym miejscem dla niedźwiedzi polarnych."
 dubois.1052.f1: "Na rozległym wybiegu ogrodu zoologicznego, urządzonym na wzór arktycznego krajobrazu, wspaniały niedźwiedź polarny przemierza skaliste otoczenie, przyciągając uwagę gęstym białym futrem i potężną sylwetką. Zaintrygowany jego majestatyczną postacią, podchodzisz do doświadczonego opiekuna zwierząt, pragnąc dowiedzieć się więcej o tym słynnym drapieżniku Arktyki.\n\n„Niedźwiedź polarny, symbol arktycznej dziczy, jest prawdziwym cudem przystosowania do skrajnego zimna” — zaczyna opiekun. „Dzięki gęstemu futru, warstwie tłuszczu i łapom z błoną pławną niedźwiedzie polarne są doskonale wyposażone do przetrwania w mroźnych temperaturach. Są znakomitymi pływakami, zdolnymi pokonywać ogromne odległości w poszukiwaniu pożywienia, którym są przede wszystkim foki”."
 dubois.1052.f2: "W urzekającym polarnym krajobrazie ogrodu zoologicznego niedźwiedzica polarna troskliwie opiekuje się młodymi, których puszyste białe futro i figlarne wybryki zachwycają zwiedzających w każdym wieku. Zaintrygowany więzią matki z potomstwem, szukasz doświadczonego opiekuna zwierząt, licząc, że dowiesz się więcej o życiu tych arktycznych olbrzymów.\n\n„Niedźwiedzice polarne są oddanymi matkami, które otaczają swoje młode troskliwą opieką” — wyjaśnia opiekun. „Po ciąży trwającej około ośmiu miesięcy samica rodzi od jednego do trzech młodych w gawrze wykopanej w zaspie śnieżnej. Ich przetrwanie zależy od ciepła i pokarmu zapewnianych przez matkę. Ssą jej pożywne mleko, dopóki nie będą gotowe wyruszyć w lodowy świat. Niedźwiedzica uczy młode niezbędnych umiejętności, takich jak polowanie i poruszanie się po zdradliwym lodzie morskim”."
 dubois.1052.f3: "Na wybiegu urządzonym na wzór arktycznego siedliska niedźwiedź polarny spoczywa na śnieżnym kopcu, a jego majestatyczna postać emanuje zarówno siłą, jak i spokojem. Zaintrygowany jego zachowaniem, podchodzisz do doświadczonego opiekuna zwierząt, chcąc zrozumieć znaczenie tego, co robi.\n\n„Niedźwiedzie polarne słyną ze zdolności oszczędzania energii i wykazują zachowanie zwane «aktywną hibernacją»” — wyjaśnia opiekun. „W miesiącach letnich, gdy brakuje pożywienia, przechodzą w stan zmniejszonej aktywności, czerpiąc energię z zapasów tłuszczu. To przystosowanie pomaga im przetrwać okresy niedostatku, dopóki nie powróci lód morski, zapewniając dostęp do ich głównego źródła pokarmu — fok. Rozumiejąc te zachowania, możemy zapewnić niedźwiedziom polarnym w naszym ogrodzie odpowiednią opiekę i zajęcia wzbogacające ich codzienne życie”."
 dubois.1052.k: "Wróć do Północnoamerykańskich Wybiegów"
 zoo_north_american_enclosures_tt: "Wrócisz do Północnoamerykańskich Wybiegów Ogrodu Zoologicznego."
 dubois.1053.t: "Wybieg Niedźwiedzia Grizzly"
 dubois.1053.d: "Większą część wybiegu #o Niedźwiedzia Grizzly#! zajmował dziki, zalesiony teren. Zapewniał grizzly wszystko, czego potrzebowały — od kryjówek po niewielki staw, w którym mogły się ochłodzić."
 dubois.1053.f1: "Na surowym wybiegu ogrodu zoologicznego, urządzonym na wzór dzikiego krajobrazu, przechadza się potężny i budzący respekt niedźwiedź grizzly, którego gęste futro i masywna sylwetka przyciągają uwagę zwiedzających. Zaintrygowany jego siłą, podchodzisz do doświadczonego opiekuna zwierząt, pragnąc dowiedzieć się więcej o tym słynnym północnoamerykańskim niedźwiedziu.\n\n„Niedźwiedź grizzly, zwany również północnoamerykańskim niedźwiedziem brunatnym, jest symbolem siły i dzikiej przyrody” — zaczyna opiekun. „Te majestatyczne niedźwiedzie są dobrze przystosowane do swoich siedlisk dzięki muskularnym ciałom, ostrym pazurom i wyostrzonemu węchowi. Są wszystkożerne i poszukują różnorodnego pożywienia, w tym jagód, ryb, drobnych ssaków, a także roślin. Jako gatunek kluczowy niedźwiedź grizzly wpływa na równowagę zamieszkiwanych przez siebie ekosystemów”."
 dubois.1053.f2: "Na rozległym wybiegu niedźwiedzi grizzly w ogrodzie zoologicznym matka prowadzi rozbrykane młode przez skalisty teren, a ich puszyste futro i figlarne wybryki wywołują uśmiechy obserwatorów. Zaintrygowany relacjami w tej rodzinie, szukasz doświadczonego opiekuna zwierząt, licząc, że dowiesz się więcej o życiu tych wspaniałych niedźwiedzi.\n\n„Niedźwiedzice grizzly słyną z silnego instynktu macierzyńskiego i bliskich więzi rodzinnych” — wyjaśnia opiekun. „Po okresie snu zimowego matka wychodzi z gawry wraz z młodymi, ucząc je niezbędnych umiejętności przetrwania, takich jak łowienie ryb, zdobywanie pożywienia i rozpoznawanie potencjalnych zagrożeń. Troszczy się o nie i przekazuje im swoją wiedzę, przygotowując je do samodzielnego życia na wolności. Obserwowanie wzajemnych kontaktów matki i młodych pozwala dostrzec opiekuńczą stronę tych potężnych stworzeń”."
 dubois.1053.f3: "Pośród surowej scenerii wybiegu niedźwiedzi grizzly masywny samiec przemierza teren ciężkim krokiem, a jego potężne susy i sporadyczne fuknięcia podkreślają dominację i przywiązanie do terytorium. Zaintrygowany jego zachowaniem, podchodzisz do doświadczonego opiekuna zwierząt, chcąc zrozumieć znaczenie tych pokazów.\n\n„Niedźwiedzie grizzly wykazują fascynujące zachowania terytorialne” — wyjaśnia opiekun. „Samce wyznaczają swoje terytoria, oznaczając je zapachem i głosem, by zaznaczyć dominację i przyciągnąć potencjalne partnerki. Przybierają rozmaite pozy, na przykład stają na tylnych nogach i ocierają się o drzewa, pozostawiając ślady zapachowe i oznajmiając swoją obecność. Zachowania te są nieodłącznym elementem ich życia społecznego i sukcesu rozrodczego”."
 dubois.1053.f4: "Prasa brukowa szaleje! Jeden z naszych słynnych niedźwiedzi grizzly uciekł z ogrodu zoologicznego, lecz gdy urzędnicy wciąż jeszcze bili na alarm, natknął się w pobliskim parku na goszczącego w mieście greckiego siłacza. Ten, umilający sobie czas przejażdżką powozem w towarzystwie miejscowej młodej kobiety, zareagował błyskawicznie: zwarł się z bestią i ciosem pozbawił ją przytomności. Gdy policjanci przybyli na miejsce, nie mogli uwierzyć własnym oczom — tak niezwykły był to wyczyn. Miejscowa prasa szybko okrzyknęła siłacza „Nowym Herkulesem” i wychwalała jego odwagę. Choć z powodu silnego akcentu nikt nie potrafił zrozumieć jego słów, stał się ulubieńcem zarówno młodych imigrantów, jak i miejscowych. Doprowadziło to jednak do serii nieszczęśliwych wypadków, gdy pary zaczęły umyślnie zapuszczać się w dzicz, by młodzieńcy mogli dowieść swego męstwa przed damami serca.\nNasz grizzly nie odniósł obrażeń i wrócił do ogrodu zoologicznego."
 dubois.1054.t: "Woliera Bielika Amerykańskiego"
 dubois.1054.d: "Surowa, skalista woliera była domem #o Bielika Amerykańskiego#!. Rozpięta nad nią siatka uniemożliwiała ptakowi ucieczkę."
 dubois.1054.f1: "Siedząc majestatycznie na wysokiej gałęzi w rozległej wolierze ogrodu zoologicznego, wspaniały bielik amerykański lustruje otoczenie przenikliwym wzrokiem. Jego wyrazista biała głowa i ciemne, potężne skrzydła budzą podziw zwiedzających. Zaintrygowany jego królewską postawą, podchodzisz do doświadczonego opiekuna zwierząt, pragnąc dowiedzieć się więcej o tym słynnym ptaku drapieżnym.\n\n„Bielik amerykański jest otaczanym szacunkiem symbolem siły i wolności” — zaczyna opiekun. „Dzięki imponującej rozpiętości skrzydeł i ostrym szponom ptaki te są groźnymi łowcami. Żywią się głównie rybami, wypatrując zdobyczy z dużych wysokości za pomocą bystrego wzroku. Historia skutecznej ochrony bielika amerykańskiego pokazuje, jak ważne jest zachowanie siedlisk i ochrona tych majestatycznych ptaków dla przyszłych pokoleń”."
 dubois.1054.f2: "W wolierze ogrodu zoologicznego, urządzonej na wzór naturalnego środowiska, para bielików amerykańskich bez wysiłku szybuje w powietrzu, zgodnie wykonując manewry, a ich melodyjne nawoływania rozbrzmiewają wokół. Zaintrygowany ich podniebną sprawnością, szukasz doświadczonego opiekuna zwierząt, licząc, że dowiesz się więcej o życiu tych słynnych ptaków.\n\n„Bieliki amerykańskie słyną z niezwykłych umiejętności lotniczych i złożonych rytuałów godowych” — wyjaśnia opiekun. „Podczas zalotów samiec i samica wykonują zapierający dech w piersiach podniebny taniec, wspólnie szybując i nurkując. Pokazy te nie tylko wzmacniają więź między partnerami, lecz także stanowią wspaniałe widowisko. Obserwowanie gracji i zwinności tych ptaków w locie naprawdę budzi podziw”."
 dubois.1054.f3: "Na malowniczym tle wybiegu bielik amerykański siedzi na wysokiej gałęzi, wydając charakterystyczny głos, w którym pobrzmiewa duch dzikiej przyrody. Zaintrygowany jego nawoływaniem, podchodzisz do doświadczonego opiekuna zwierząt, chcąc zrozumieć znaczenie tych dźwięków.\n\n„Bieliki amerykańskie porozumiewają się za pomocą głosu” — wyjaśnia opiekun. „Ich charakterystyczne, wysokie nawoływania, często kojarzone z obecnością tych ptaków na wolności, pełnią wiele funkcji. Pomagają wyznaczać terytorium, utrzymywać kontakt z partnerem i bronić gniazda. Bogaty repertuar głosowy bielika amerykańskiego świadczy o jego zdolnościach przystosowawczych i umiejętności radzenia sobie w różnorodnych siedliskach”."
 dubois.1055.t: "Wybieg Pumy Florydzkiej"
 dubois.1055.d: "W królestwie #o Pumy Florydzkiej#! dominowała subtropikalna roślinność, a przez wybieg płynęła niewielka rzeka. Niektóre drzewa umożliwiały wspinaczkę."
 dubois.1055.f1: "Na bujnie porośniętym, subtropikalnym wybiegu ogrodu zoologicznego potężna i zwinna puma florydzka przemyka z bezszelestną gracją, a jej muskularna sylwetka i przenikliwe zielone oczy przyciągają wzrok obserwatorów. Zaintrygowany jej wyjątkowym statusem, podchodzisz do doświadczonego opiekuna zwierząt, pragnąc dowiedzieć się więcej o tym fascynującym wielkim kocie.\n\n„Puma florydzka to niezwykły podgatunek pumy” — zaczyna opiekun. „Występuje wyłącznie w bogatych i różnorodnych siedliskach mokradeł i lasów Florydy, do których doskonale się przystosowała. Dzięki wyostrzonym zmysłom, silnym szczękom i niezwykłej zwinności jest świetnie wyposażona do polowania i przetrwania w naturalnym środowisku. Puma florydzka stanowi świadectwo niezwykłej różnorodności dzikiej fauny tego regionu”."
 dubois.1055.f2: "Pośród rodzimej roślinności na wybiegu pum samiec pumy florydzkiej wydaje niski, donośny głos, który niesie się w powietrzu, oznajmiając jego obecność i prawa do terytorium. Zaintrygowany jego nawoływaniem, podchodzisz do doświadczonego opiekuna zwierząt, chcąc zrozumieć znaczenie tych dźwięków.\n\n„Pumy florydzkie porozumiewają się za pomocą różnorodnych odgłosów” — wyjaśnia opiekun. „Samce posługują się między innymi warczeniem, syczeniem i krzykami, by zaznaczyć dominację i bronić swoich terytoriów. Głosy te pomagają odstraszać potencjalnych rywali i utrzymywać kontakt z pobliskimi samicami. Wsłuchując się w ich repertuar głosowy, badacze i działacze ochrony przyrody zdobywają cenne informacje o zachowaniach pumy florydzkiej i zmianach zachodzących w jej populacji”."
 dubois.1055.f3: "Pośród rodzimej roślinności na wybiegu pum samiec pumy florydzkiej wydaje niski, donośny głos, który niesie się w powietrzu, oznajmiając jego obecność i prawa do terytorium. Zaintrygowany jego nawoływaniem, podchodzisz do doświadczonego opiekuna zwierząt, chcąc zrozumieć znaczenie tych dźwięków.\n\n„Pumy florydzkie porozumiewają się za pomocą różnorodnych odgłosów” — wyjaśnia opiekun. „Samce posługują się między innymi warczeniem, syczeniem i krzykami, by zaznaczyć dominację i bronić swoich terytoriów. Głosy te pomagają odstraszać potencjalnych rywali i utrzymywać kontakt z pobliskimi samicami. Wsłuchując się w ich repertuar głosowy, badacze i działacze ochrony przyrody zdobywają cenne informacje o zachowaniach pumy florydzkiej i zmianach zachodzących w jej populacji”."
 dubois.1055.f4: "Zainspirowany losem pantery w niewoli, [SCOPE.sCharacter('manzoni_literary_scope').GetFullName] napisał wiersz:\n\n„Od przesuwających się prętów jego wzrok\nznużył się tak, że nic już nie zatrzymuje.\nZdaje mu się, że prętów jest tysiąc,\na za tym tysiącem prętów nie ma świata.\n\nMiękki chód, krok silny i sprężysty,\nzataczający kręgi w ciasnej przestrzeni,\njest niczym taniec siły wokół środka,\nw którym potężna wola tkwi bezwładnie.\n\nTylko czasami zasłona źrenicy\nunosi się bezgłośnie —. Wnika obraz,\nprzenika przez napiętą ciszę ciała —\ni w sercu przestaje istnieć”."
 dubois.1056.t: "Wybieg Bizona Amerykańskiego"
 dubois.1056.d: "#o Bizony Amerykańskie#! żyły na ogromnym wybiegu, urządzonym na wzór krajobrazu amerykańskiego Środkowego Zachodu. Większość jego powierzchni porastały trawy preriowe, wśród których bizony mogły się paść."
 dubois.1056.f1: "Na rozległym wybiegu ogrodu zoologicznego, urządzonym na wzór prerii, przechadza się potężny i majestatyczny bizon amerykański, którego masywna sylwetka i imponujące rogi przyciągają uwagę zwiedzających. Zaintrygowany jego historycznym znaczeniem, podchodzisz do doświadczonego opiekuna zwierząt, pragnąc dowiedzieć się więcej o tym słynnym symbolu amerykańskiego Zachodu.\n\n„Bizon amerykański, zwany również bawołem, ma ogromne znaczenie kulturowe i ekologiczne” — zaczyna opiekun. „Te wspaniałe zwierzęta roślinożerne przemierzają rozległe tereny trawiaste w ogromnych stadach, kształtując krajobraz i zapewniając warunki do życia licznym innym gatunkom. Bizony odznaczają się niezwykłą siłą i wytrzymałością, dzięki którym znoszą surowe warunki pogodowe i pokonują wielkie odległości w poszukiwaniu pożywienia i wody”."
 dubois.1056.f2: "Na spokojnym wybiegu ogrodu zoologicznego stado bizonów amerykańskich pasie się bez pośpiechu, a ich masywne ciała zgodnie przemieszczają się po trawiastej przestrzeni. Odgłos kopyt uderzających o ziemię niesie się w powietrzu, tworząc rytmiczną harmonię. Zaintrygowany ich relacjami społecznymi, szukasz doświadczonego opiekuna zwierząt, licząc, że dowiesz się więcej o życiu tych słynnych roślinożerców.\n\n„Bizony amerykańskie są zwierzętami wysoce społecznymi, żyjącymi w zwartych grupach zwanych stadami” — wyjaśnia opiekun. „W stadzie panuje hierarchia, na której czele stoją dominujące samce, zwane bykami. Te majestatyczne stworzenia wzajemnie pielęgnują sierść, porozumiewają się za pomocą różnorodnych odgłosów i wykazują fascynujące zachowania w okresie godowym. Obserwowanie wzajemnych kontaktów w stadzie bizonów pozwala poznać ich złożone relacje społeczne”."
 dubois.1056.f3: "Pośród łagodnie pofałdowanego krajobrazu preriowego wybiegu stoi potężny samiec bizona, którego kudłata sierść i imponująca postawa budzą podziw zwiedzających. Zaintrygowany jego zachowaniem, podchodzisz do doświadczonego opiekuna zwierząt, chcąc zrozumieć znaczenie jego poczynań.\n\n„Pokaz dominacji i siły w wykonaniu samca bizona to fascynujący widok” — wyjaśnia opiekun. „W okresie godowym samce urządzają niezwykłe pokazy, by ustalić swoją pozycję i rywalizować o możliwość rozrodu. Mogą przy tym grzebać kopytami w ziemi, tarzać się w pyle i ścierać się rogami z rywalami w imponujących próbach sił. Pokazy te są nieodłącznym elementem utrzymywania struktury społecznej stada i zapewniania przetrwania gatunku”."
 dubois.1057.t: "Wybieg Aligatora"
 dubois.1057.d: "Wybieg Aligatora był rozległym bagnem, które wyglądało jak żywcem przeniesione z Florydy."
 dubois.1057.f1: "Na przyciągającym wzrok podmokłym wybiegu ogrodu zoologicznego tuż pod powierzchnią wody czai się groźny aligator o prehistorycznym wyglądzie, którego łuskowata skóra i czujne oczy przyciągają uwagę zwiedzających. Zaintrygowany jego pradawną postacią, podchodzisz do doświadczonego opiekuna zwierząt, pragnąc dowiedzieć się więcej o tym słynnym gadzie.\n\n„Aligatory to żywe relikty minionej epoki” — zaczyna opiekun. „Te pradawne gady od milionów lat pozostają stosunkowo niezmienione. Słyną z potężnych szczęk i silnego zgryzu, który pomaga im chwytać i pożerać rozmaite ofiary. Aligatory odgrywają istotną rolę w swoich ekosystemach, regulując liczebność mniejszych zwierząt i utrzymując równowagę siedlisk podmokłych”."
 dubois.1057.f2: "W spokojnym wodnym zakątku ogrodu zoologicznego aligator wygrzewa się na skąpanym w słońcu brzegu, a jego opancerzone ciało i imponujące rozmiary budzą podziw. Widok odpoczywającego na słońcu gada przyciąga uwagę zwiedzających. Zaintrygowany tym zwyczajem, szukasz doświadczonego opiekuna zwierząt, licząc, że dowiesz się więcej o zachowaniach tego pradawnego gada.\n\n„Aligatory są zwierzętami ektotermicznymi, co oznacza, że do regulowania temperatury ciała wykorzystują zewnętrzne źródła ciepła” — wyjaśnia opiekun. „Wygrzewanie się jest dla nich niezwykle ważne. Przebywając na słońcu, podnoszą temperaturę ciała, co z kolei przyspiesza metabolizm i zwiększa ich aktywność. Zachowanie to ma szczególne znaczenie w chłodniejszych miesiącach, gdy pod wpływem otoczenia temperatura ich ciała spada”."
 dubois.1057.f3: "Pośród bujnej roślinności na wybiegu aligatorów duży samiec wydaje głęboki, dudniący pomruk, który rozchodzi się w wodzie, oznajmiając jego dominację i prawa do terytorium. Zaintrygowany jego głosem, podchodzisz do doświadczonego opiekuna zwierząt, chcąc zrozumieć znaczenie tych odgłosów.\n\n„Odgłosy wydawane przez aligatory są niezwykle ważnym elementem ich komunikacji” — wyjaśnia opiekun. „W okresie godowym samce posługują się charakterystycznymi rykami, by ustanowić dominację i przyciągnąć samice. Ta wymiana sygnałów głosowych pomaga zapobiegać starciom między rywalizującymi samcami. Aligatory wydają także rozmaite inne dźwięki, takie jak syczenie i chrząkanie, by porozumiewać się ze sobą i zaznaczać swoją obecność w podmokłych siedliskach”."
 dubois.1058.t: "Wybieg Aksolotla"
 dubois.1058.d: "Wybieg Aksolotla przypominał raczej niewielką sadzawkę w skale niż typowy wybieg. Ponieważ aksolotle były dość małe, zwiedzający mogli podejść bardzo blisko i niemal dotknąć tych drobnych zwierząt."
 dubois.1058.f1: "Na urzekającym wodnym wybiegu ogrodu zoologicznego sunie przez wodę fascynujący aksolotl, stworzenie jakby nie z tego świata, którego pierzaste skrzela zewnętrzne i niezwykły wygląd przyciągają uwagę zwiedzających. Zaintrygowany jego wyjątkowymi cechami, podchodzisz do doświadczonego opiekuna zwierząt, pragnąc dowiedzieć się więcej o tym niezwykłym płazie.\n\n„Aksolotl to prawdziwy cud zdolności regeneracyjnych i przystosowania” — zaczyna opiekun. „W przeciwieństwie do większości płazów aksolotle zachowują cechy młodociane przez całe życie — zjawisko to nazywa się neotenią. Słyną z niezwykłych zdolności regeneracyjnych: potrafią odtwarzać utracone kończyny, a nawet fragmenty rdzenia kręgowego. Zdolności te przyciągnęły uwagę naukowców i badaczy, dostarczając cennych informacji o regeneracji tkanek”."
 dubois.1058.f2: "W spokojnym wodnym zakątku ogrodu zoologicznego aksolotl odpoczywa na zanurzonej skale, a jego pierzaste skrzela delikatnie poruszają się, gdy oddycha pod wodą. Widok jego wyjątkowych przystosowań oddechowych przyciąga uwagę zwiedzających. Zaintrygowany sposobem, w jaki oddycha, szukasz doświadczonego opiekuna zwierząt, licząc, że dowiesz się więcej o życiu tego niezwykłego płaza.\n\n„Aksolotle mają wyjątkowe cechy układu oddechowego, które wyróżniają je spośród innych płazów” — wyjaśnia opiekun. „Podczas gdy większość płazów przechodzi przeobrażenie i wykształca płuca do oddychania na lądzie, aksolotle pozostają w wodzie i wykorzystują zewnętrzne skrzela do pobierania z niej tlenu. Ich skrzela są niezwykle wydajne, dzięki czemu mogą oddychać pod wodą przez całe życie. To przystosowanie świadczy o ich specjalizacji do życia w środowisku wodnym”."
 dubois.1058.f3: "Pośród roślin wodnych na wybiegu aksolotli grupa młodych osobników bawi się ze sobą, a ich delikatne ruchy i ciekawskie zachowanie ujawniają urocze usposobienie. Zaintrygowany ich wzajemnymi kontaktami, podchodzisz do doświadczonego opiekuna zwierząt, chcąc zrozumieć znaczenie ich zachowań.\n\n„Aksolotle słyną z ciekawskiej i towarzyskiej natury” — wyjaśnia opiekun. „Są stosunkowo łagodnymi stworzeniami i często zgodnie żyją z innymi mieszkańcami zbiornika. Płazy te mają wyostrzony zmysł dotyku i potrafią wykrywać drgania wody. Wykorzystują te zmysły do poznawania otoczenia, odnajdywania pokarmu i nawiązywania kontaktów z innymi osobnikami. Ich zabawy i wzajemne relacje dodają im uroku i czynią je jeszcze bardziej fascynującymi”."
