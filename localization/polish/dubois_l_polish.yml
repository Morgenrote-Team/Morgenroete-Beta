 dubois.251.t: "Nieznane Ludzkie Kości"
 dubois.251.d: "Podczas badań paleontologicznych [SCOPE.sCharacter('dubois_paleontologist_scope').GetFullName] znalazł ludzkie kości z czasów prehistorycznych. Mają one prawdopodobnie dziesiątki tysięcy lat. Odpowiednio je zabezpieczył i wysłał, aby mógł się nimi zająć specjalista."
 dubois.251.f: "Ku swojemu zdumieniu [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetSheHe] znalazł szczątki ludzkiego szkieletu w górnej warstwie skał. Jednak [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetSheHe] nie zdołał ustalić, jak poszczególne kości łączyły się ze sobą. [SCOPE.sCharacter('dubois_paleontologist_scope').GetLastName] ma podstawową wiedzę z zakresu paleoantropologii, ale nie chce wydawać opinii, ponieważ mogłoby to wpłynąć na wynik badań naukowych."
 dubois_add_fossil_java_tt: "Zyskaj #G 1#! @dubois_human_fossil! #O Specjalną Skamielinę Ludzką#!: Człowiek z Jawy."
 dubois_add_fossil_neanderthaler_tt: "Zyskaj #G 1#! @dubois_human_fossil! #O Specjalną Skamielinę Ludzką#!: Neandertalczyk."
