 dubois.1019.t: "Wybieg Surykatek"
 dubois.1019.d: "Na wybiegu surykatek dominowały skały z grotami. Od razu rzucały się w oczy liczne małe zwierzęta, które stały lub biegały dookoła."
 dubois.1019.f1: "„Surykatki wyróżniają się doskonale zorganizowaną strukturą społeczną” — wyjaśnia opiekun zwierząt. „Każdy członek grupy, zwanej »bandą« lub »gangiem«, na zmianę pełni wartę, wypatrując drapieżników, podczas gdy pozostali szukają pożywienia lub odpoczywają. Porozumiewają się sprawnie i precyzyjnie, a różne odgłosy sygnalizują różne poziomy zagrożenia. Ta nieustanna czujność i współpraca mają kluczowe znaczenie dla ich przetrwania na wolności”."
 dubois.1019.f2: "„Surykatki są mistrzami kopania” — opowiada opiekun zwierząt. „W zaledwie kilka minut potrafią wykopać dół głęboki na kilka stóp, co jest niezbędne do zdobywania pożywienia, takiego jak owady, drobne gady i korzenie. Umiejętność ta pozwala im również tworzyć rozbudowane systemy nor, w których żyją w grupach i wychowują młode. Te podziemne sieci zapewniają ochronę przed drapieżnikami i skrajnymi warunkami pogodowymi”."
 dubois.1019.f3: "„Surykatki wydają wiele różnych odgłosów” — wyjaśnia opiekun zwierząt. „Od sygnałów alarmowych pomagających koordynować ruchy grupy po cichsze nawoływania służące utrzymywaniu kontaktu między jej członkami. Gdy któraś znajdzie pożywienie, często nawołuje pozostałe, by podzielić się odkryciem, co podkreśla wspólnotowy charakter ich życia. Porozumiewanie się za pomocą dźwięków jest niezbędne do ich przetrwania, ponieważ pomaga im utrzymywać kontakt i działać zgodnie”."
