 dubois.2171.t: "Dział Szkieletów Ogólnych"
 dubois.2171.d: "Który szkielet obejrzeć?"
 dubois.2171.f: "Niektóre Szkielety można znaleźć na całym świecie. Większość z nich należała do morskich Dinozaurów lub innych stworzeń zamieszkujących morza."
 dubois.2171.g: "Mozazaur."
 dubois.2172.t: "Mozazaur"
 dubois.2172.f: "Mozazaur nie jest w rzeczywistości dinozaurem, lecz gadem morskim. Mozazaury żyły w oceanach w okresie kredowym. Istniało wiele różnych gatunków mozazaurów przystosowanych do życia w rozmaitych regionach. Wiele z nich było drapieżnikami szczytowymi i polowało na ryby, rekiny oraz inne dinozaury i gady morskie."
