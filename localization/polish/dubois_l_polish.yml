 dubois.1049.t: "Wybieg Łosi"
 dubois.1049.d: "Na zalesionym wybiegu w zoo stoi dumnie majestatyczny łoś europejski, a jego potężne poroże wznosi się ku niebu."
 dubois.1049.f1: "Spokojne usposobienie i imponujące rozmiary łosia przyciągają uwagę zwiedzających, którzy podziwiają ogrom tego łagodnego olbrzyma. Zaciekawiony jego okazałym porożem, podchodzisz do opiekuna zwierząt, by dowiedzieć się więcej.\n„Łosie europejskie, w Ameryce Północnej znane jako »moose«, są największymi przedstawicielami rodziny jeleniowatych” — wyjaśnia opiekun. „Ich poroże może osiągać rozpiętość do sześciu stóp i służy głównie do walk w okresie godowym, gdy samce rywalizują o samice. Co roku łosie zrzucają poroże, a na jego miejsce wyrasta nowe, które z wiekiem staje się coraz większe i bardziej rozbudowane”."
 dubois.1049.f2: "W zacienionym zakątku wybiegu duży samiec łosia europejskiego pochyla masywną głowę, by skubać delikatne pędy i liście. Spokojne, rytmiczne ruchy jego szczęk podczas przeżuwania niemal hipnotyzują, przyciągając tłum obserwatorów. Zaintrygowany zwyczajami żywieniowymi łosia, szukasz opiekuna zwierząt, by dowiedzieć się więcej.\n„Łosie zgryzają pędy i liście” — wyjaśnia opiekun. „W odróżnieniu od zwierząt żywiących się głównie trawą wolą różnorodny pokarm roślinny, w tym liście, korę i rośliny wodne. Mają wyostrzony węch, który pomaga im odnajdywać najbardziej pożywne rośliny w otoczeniu. Na wolności mogą zjadać nawet 70 funtów pokarmu dziennie, co jest niezbędne do utrzymania ich ogromnych ciał”."
 dubois.1049.f3: "Wśród szumiących drzew na wybiegu łoś europejski nagle wydaje głęboki, donośny ryk, który rozchodzi się echem w powietrzu. Dźwięk przyciąga uwagę wszystkich w pobliżu. Zwiedzający przystają, by wsłuchać się w ten pierwotny zew. Zaciekawiony jego znaczeniem, podchodzisz do opiekuna zwierząt, by dowiedzieć się więcej.\n„To był zew godowy” — wyjaśnia opiekun. „W okresie godowym samce łosi wydają takie głośne odgłosy, by zaznaczyć swoją dominację i przyciągnąć samice. Słychać je z dużej odległości, a często towarzyszą im pokazy poroża i przybieranie groźnych póz. To dobitne przypomnienie o potędze łosia w jego naturalnym środowisku”."
