 dubois.1061.t: "Południowoamerykańskie Wybiegi"
 dubois.1061.d: "Południowoamerykańska część ogrodu oferowała niezwykle zróżnicowane siedliska — od tropikalnych lasów deszczowych po suchsze tereny, ogromne skały i pampę."
