 dubois.52.t: "Leśnictwo Wysokiej Jakości"
 dubois.52.d: "Dr. [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] osiągnął [SCOPE.sCharacter('dubois_naturalist_scope').GetHerHis] cel. Dzięki starannej selekcji szczególnie odpornych sadzonek, zastosowaniu naturalnych metod zwalczania szkodników oraz badaniom nad zwierzętami i roślinami żyjącymi w symbiozie [SCOPE.sCharacter('dubois_naturalist_scope').GetSheHe] trwale wzmocnił gospodarkę leśną naszego kraju.\n\nŁączna liczba ulepszonych budynków: [GetPlayer.MakeScope.Var('mr_num_improved_forestry_buildings_var').GetValue|V0]\n$concept_dubois_specimens$ z Projektu: [GetPlayer.MakeScope.ScriptValue('ito_specimens_from_forestry_project_for_event_value')|+0] @dubois_specimen!"
 dubois.52.f: "„Przepraszam, co takiego? Chcecie WYCIĄĆ te drzewa? Tyle trudu włożyłem w ich wyhodowanie, pielęgnację i opiekę nad nimi, a teraz te kapitalistyczne potwory chcą zabić moje maleństwa? O mój Boże, co ja zrobiłem!”"
 dubois.52.g: "Więcej drewna dla wszystkich!"
 dubois.53.t: "Kauczukowce Wysokiej Jakości"
 dubois.53.d: "Dr. [ROOT.Var('ito_naturalist_var').GetCharacter.GetLastName] osiągnął [ROOT.Var('ito_naturalist_var').GetCharacter.GetHerHis] cel. Dzięki starannej selekcji szczególnie odpornych sadzonek, zastosowaniu naturalnych metod zwalczania szkodników oraz badaniom nad zwierzętami i roślinami żyjącymi w symbiozie [ROOT.Var('ito_naturalist_var').GetCharacter.GetSheHe] trwale wzmocnił przemysł kauczukowy naszego kraju.\n\nŁączna liczba ulepszonych budynków: [GetPlayer.MakeScope.Var('mr_num_improved_runner_buildings_var').GetValue|V0]"
 dubois.53.f: "„Dlaczego wszystkich interesuje ten zupełnie bezużyteczny kauczuk? Zrobiłem to tylko dlatego, że interesuje mnie neohesperialistyczny komar bagienny. To małe stworzenie, którego ukąszenie łatwo może okazać się śmiertelne, rozmnaża się wyłącznie w tym klimacie”."
 dubois.53.g: "Więcej kauczuku dla wszystkich!"
 dubois.22.t: "Prof. [ROOT.Var('ito_naturalist_var').GetCharacter.GetLastName] dokumentuje [SCOPE.GetRootScope.GetCountry.GetCustom('dubois_animal_documentation_name')]"
 dubois.22.d: "Po miesiącach obserwowania zwierzęcia w jego naturalnym środowisku [ROOT.Var('ito_naturalist_var').GetCharacter.GetFullName] zakończył badania. Jego rozprawa, #YELLOW „[SCOPE.GetRootScope.GetCountry.GetCustom('dubois_animal_documentation_title')]”#!, jest już dostępna. [SCOPE.GetRootScope.GetCountry.GetCustom('dubois_animal_documentation_topic')]"
 dubois.22.g: "Zarezerwuj egzemplarz dla Biblioteki Narodowej."
