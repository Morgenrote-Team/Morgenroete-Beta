 je_animal_breeding: "Rozmnażanie [SCOPE.GetRootScope.GetCountry.GetCustom('dubois_breeding_animal_type')]"
 je_animal_breeding_reason: "Rozmnażamy [SCOPE.GetRootScope.GetCountry.GetCustom('dubois_breeding_animal_type')] w nadziei, że powstanie tam nowy [concept_dubois_habitat].\n\nObecnie liczebność populacji wynosi [ROOT.Var('dubois_breeding_animal_amount_var').GetValue] osobników gatunku [SCOPE.GetRootScope.GetCountry.GetCustom('dubois_breeding_animal_type')]. Jeśli osiągniemy #p 4000#! osobników gatunku [SCOPE.GetRootScope.GetCountry.GetCustom('dubois_breeding_animal_type')], populacja będzie zdolna do samodzielnego przetrwania i powstanie nowe siedlisko."
