 dubois.2011.d_default: "Prof. [ROOT.Var('dubois_paleontologist_var').GetCharacter.GetLastName] to czołowy [concept_dubois_paleontologist] naszego kraju. [ROOT.Var('dubois_paleontologist_var').GetCharacter.GetSheHe|U] obecnie nie ma przydzielonego zadania."
 dubois.2011.d_other: "Prof. [ROOT.Var('dubois_paleontologist_var').GetCharacter.GetLastName] to czołowy [concept_dubois_paleontologist] naszego kraju. [ROOT.Var('dubois_paleontologist_var').GetCharacter.GetSheHe|U] zajmuje się w tej chwili innymi sprawami."
 dubois.2011.f: "[ROOT.Var('dubois_paleontologist_var').GetCharacter.GetFullName] ma łączne paleontologiczne [concept_academics_experience] na poziomie #G [ROOT.Var('dubois_paleontologist_var').GetVariable('dubois_paleontologist_experience_var').GetValue]#!\n\nPaleontolodzy mogą co roku znajdować nowe skamieniałości w formacjach. W Wielkich Formacjach istnieje również szansa na odkrycie rzadkich kości dinozaurów, które można wykorzystać do rekonstrukcji szkieletów. W tym celu [concept_dubois_paleontologist] musi zostać przydzielony do formacji. Jeśli w granicach kraju nie ma żadnej formacji, można również wynegocjować Umowę o Pozwolenie na Wykopaliska Paleontologiczne z państwem posiadającym Wielką Formację. Bez przydziału do formacji paleontolog pozostaje nieaktywny. W tym czasie jednak [ROOT.Var('dubois_paleontologist_var').GetCharacter.GetSheHe] może brać udział w wyprawach, rekonstruować kości dinozaurów, montować szkielety lub zmieniać sposób ich ekspozycji."
 dubois.2011.g: "Badaj Formacje w Ameryce Północnej."
 dubois.2011.h: "Badaj Formacje w Ameryce Południowej."
 dubois.2011.i: "Badaj Formacje w Europie."
 dubois.2011.j: "Badaj Formacje w Afryce."
 dubois.2011.k: "Badaj Formacje w Azji."
 dubois.2011.l: "Badaj Formacje w Australii."
 dubois.2021.t: "Specjalne Skamieliny"
 dubois.2021.d: "Ta kolekcja zawiera jedne z najbardziej niezwykłych skamielin odkrytych do tej pory."
 dubois.2021_amber: "#T Bursztyn#!\nŻywica zachowała owada sprzed milionów lat.\n\n"
 dubois.2021_ammonite: "#T Amonit#!\nDziesiątki tysięcy gatunków amonitów kształtowały życie mórz przez 350 milionów lat.\n\n"
 dubois.2021_archaeopteryx: "#T Archeopteryks#!\nTen „praptak” jest uznawany przez niektórych badaczy za możliwe ogniwo pośrednie między gadami a ptakami.\n\n"
 dubois.2021_composita: "#T Composita#!\nComposita były szeroko rozpowszechnionym gatunkiem żyjącym od późnego dewonu do późnego permu.\n\n"
 dubois.2021_eusthenopteron: "#T Eustenopteron#!\nTa ryba mogła przetrwać w wyschniętym korycie rzeki i jest uważana za ważne ogniwo w ewolucji prowadzącej do powstania płazów.\n\n"
 dubois.2021_ichthyosaurus: "#T Ichtiozaur#!\nTen gad nie tylko bardzo przypominał delfina, ale był również żyworodny.\n\n"
 dubois.2021_ichthyostega: "#T Ichtiostega#!\nMożliwe brakujące ogniwo między rybami a czworonogami.\n\n"
 dubois.2021_megatherium: "#T Megaterium#!\nOlbrzymi leniwiec naziemny. Niestety również wymarły gatunek.\n\n"
 dubois.2021_pterodactylus: "#T Pterodaktyl#!\nNiewielki pterodaktyl o krótkim ogonie, który prawdopodobnie żył na wybrzeżach.\n\n"
 dubois.2021_smilodon: "#T Smilodon#!\nJeden z najbardziej znanych drapieżników szablozębnych.\n\n"
 dubois.2021_trilobite: "#T Trylobit#!\nLiczne występowanie tych stawonogów oraz ich rozmieszczenie w warstwach skalnych czynią je ważnymi skamielinami przewodnimi paleozoiku."
 dubois.2041.t: "Kości Dinozaurów"
 dubois.2041.d: "Tutaj można odtwarzać kości dinozaurów ze skamielin, a następnie składać z nich szkielety dinozaurów."
 dubois.2041.f: "Na podstawie pięciu kości dinozaurów z jednego kontynentu [concept_dubois_paleontologist] może zrekonstruować całego dinozaura. Doświadczony paleontolog może również podjąć próbę odtworzenia kości dinozaura z 20 fragmentów skamielin. Odtworzenie kości dinozaura jest możliwe tylko wtedy, gdy dostępna jest przynajmniej jedna kość dinozaura służąca za wzór. Aby wykonać którąkolwiek z tych czynności, paleontolog nie może być wyczerpany ani zajęty. Powodzenie zależy w dużej mierze od doświadczenia paleontologicznego.\n\n#G [ROOT.Var('dubois_north_american_dinosaur_bone').GetValue]#! Kości Dinozaurów z Ameryki Północnej\n#G [ROOT.Var('dubois_south_american_dinosaur_bone').GetValue]#! Kości Dinozaurów z Ameryki Południowej\n#G [ROOT.Var('dubois_european_dinosaur_bone').GetValue]#! Kości Dinozaurów z Europy\n#G [ROOT.Var('dubois_african_dinosaur_bone').GetValue]#! Kości Dinozaurów z Afryki\n#G [ROOT.Var('dubois_asian_dinosaur_bone').GetValue]#! Kości Dinozaurów z Azji\n#G [ROOT.Var('dubois_australian_dinosaur_bone').GetValue]#! Kości Dinozaurów z Australii"
 dubois.2041.g: "Odtwórz Kość Dinozaura ze Skamielin."
 dubois.2042.t: "Kość Dinozaura Odtworzona"
 dubois.2042.d: "Profesor [ROOT.Var('dubois_paleontologist_var').GetCharacter.GetLastName] odniósł pełny sukces: dzięki swojej wiedzy naukowej zdołał odtworzyć kość dinozaura z fragmentów skamielin."
 dubois.2042.f: "Była to pobudzająca umysł łamigłówka, która jednak nie stanowiła wyzwania dla kogoś o tak wybitnych umiejętnościach jak nasz [concept_dubois_paleontologist]. Po kilku miesiącach badań i skomplikowanych zabiegów kombinatorycznych zdołał odtworzyć fragmenty kości ze szczątków kopalnych wielkości zapałki, a tym samym kluczowe części szkieletu gatunku dinozaura, znanego dotąd jedynie z pojedynczych kości."
 dubois.2042.g: "Wspaniale."
 dubois.2043.t: "Zdezorientowany Profesor"
 dubois.2043.d: "Mimo wielomiesięcznych prób profesor [ROOT.Var('dubois_paleontologist_var').GetCharacter.GetLastName] nie zdołał uzyskać żadnych rezultatów z wykorzystanych materiałów. Szkoda skamielin!"
 dubois.2043.f: "Gdzie też pasował ten fragment? A ten? Ale jeśli ten kawałek łączył się z tamtym, to z kolei inny już nie pasował. W końcu [concept_dubois_paleontologist] nie mógł już tego znieść. Głowił się nad tym przez całą noc, lecz za nic nie potrafił ustalić na podstawie dotychczasowych znalezisk, jak niegdyś musiał wyglądać szkielet dinozaura."
 dubois.2043.g: "Profesor zmarnował nasze skamieliny!"
 dubois.2044.t: "Doskonale złożony Szkielet"
 dubois.2044.d: "Nasz [concept_dubois_paleontologist] znakomicie poradził sobie ze złożeniem szkieletu, wzbogacając kolekcję historii naturalnej o cenny okaz."
 dubois.2044.f: "Gromkie brawa rozległy się w sali wystawowej, gdy profesor zaprezentował publiczności nowo złożony szkielet dinozaura. Przy okazji rozwiązał kilka problemów, które od lat zaprzątały głowy ekspertów, i pokazał zupełnie nowe podejście do interpretacji kości dinozaura. Obecni na wystawie paleontolodzy z różnych krajów zabiegali o rozmowę z profesorem, chcąc zastosować podobną metodę przy składaniu znalezisk ze swoich kolekcji. Niektórzy posunęli się nawet do stwierdzenia, że [ROOT.Var('dubois_paleontologist_var').GetCharacter.GetFullName] to geniusz układanek — od razu udało mu się osiągnąć to, co innym zajmowało całe dziesięciolecia."
 dubois.2044.g: "Znakomita robota, Prof. [ROOT.Var('dubois_paleontologist_var').GetCharacter.GetLastName]."
 dubois.2045.t: "Niedoskonale złożony Szkielet"
 dubois.2045.d: "Profesor [ROOT.Var('dubois_paleontologist_var').GetCharacter.GetLastName] dołożył wszelkich starań, lecz niestety przy składaniu szkieletu dinozaura popełnił kilka błędów."
 dubois.2045.f: "Prezentacji nowego szkieletu dinozaura w kolekcji historii naturalnej towarzyszyły uprzejme, lecz dość powściągliwe brawa. Choć czołowy paleontolog kraju dołożył wszelkich starań, jego koledzy po fachu już w dniu prezentacji dostrzegli kilka niedociągnięć, które przyćmiły to osiągnięcie. Mimo to szkielet spełnia wymagania, przynajmniej w ogólnym zarysie, i powinien wzbogacić wystawę, choć w nadchodzących latach konieczne będą pewne poprawki."
 dubois.2045.g: "Może być, prawda?"
 dubois.2046.t: "Źle złożony Szkielet"
 dubois.2046.d: "Szkielet, który złożył [ROOT.Var('dubois_paleontologist_var').GetCharacter.GetFullName], wprawił ekspertów w… zdumienie. Choć nie takie, na jakie liczyło Towarzystwo Paleontologiczne."
 dubois.2046.f: "Był to pamiętny dzień, a jeszcze bardziej osobliwe okazało się samo wydarzenie. Prof. [ROOT.Var('dubois_paleontologist_var').GetCharacter.GetLastName] teatralnym gestem zerwał płachtę z nowego szkieletu dinozaura, oczekując gromkich braw. Zamiast nich zapadła jednak cisza. Potem rozległy się szepty. A następnie śmiech. Badacze uczestniczący w wydarzeniu uśmiechali się, inni próbowali zachować powagę, aż w końcu jeden z kolegów, na wpół rozbawiony, na wpół niedowierzający, wskazał na skleconą chimerę i zawołał: „Czy to trójgłowy dinozaur?”"
 dubois.2046.g: "To musi być żart!"
 dubois.2051.t: "Szkielety Dinozaurów"
 dubois.2051.d: "Szkielety dinozaurów są chlubą każdej kolekcji historii naturalnej. Doskonale złożone szkielety mają pozytywny wpływ na naszą Ocenę Dinozaurów."
 dubois.2051.f: "Nasza kolekcja dinozaurów składa się z następujących szkieletów:\n\n"
 dubois.2051.ankylosaurus: "Ankylozaur"
 dubois.2051.diplodocus: "Diplodok"
 dubois.2051.triceratops: "Triceratops"
 dubois.2051.tyrannosaurus: "Tyranozaur Rex"
 dubois.2051.stegosaurus: "Stegozaur"
 dubois.2051.antarctosaurus: "Antarktozaur"
 dubois.2051.argyrosaurus: "Argyrozaur"
 dubois.2051.iguanodon: "Iguanodon"
 dubois.2051.plateosaurus: "Plateozaur"
 dubois.2051.giraffatitan: "Giraffatitan"
 dubois.2051.spinosaurus: "Spinozaur"
 dubois.2051.psittacosaurus: "Psitakozaur"
 dubois.2051.velociraptor: "Welociraptor"
 dubois.2051.muttaburrasaurus: "Muttaburazaur"
 dubois.2051.rhoetosaurus: "Retozaur"
 dubois.2051.g: "Obejrzyj Szkielety z Ameryki Północnej."
 dubois.2051.h: "Obejrzyj Szkielety z Ameryki Południowej."
 dubois.2051.i: "Obejrzyj Szkielety z Europy."
 dubois.2051.j: "Obejrzyj Szkielety z Afryki."
 dubois.2051.k: "Obejrzyj Szkielety z Azji."
 dubois.2051.l: "Obejrzyj Szkielety z Australii."
 dubois.2101.t: "Ulepszony Szkielet"
 dubois.2101.d: "Wysiłki naszych [Concept('concept_dubois_paleontologist','$concept_dubois_paleontologists|q$')] przyniosły owoce: szkielet, który wcześniej miał wady, został znacznie ulepszony."
 dubois.2101.f: "Profesor [ROOT.Var('dubois_paleontologist_var').GetCharacter.GetLastName] długo rozważał sposób poruszania się prehistorycznego zwierzęcia, jego środowisko życia i wiele innych kwestii, zanim wpadł na kluczowy pomysł, dzięki któremu umieścił niektóre kości na właściwych miejscach. W ten sposób znacznie poprawił rekonstrukcję całego szkieletu."
 dubois.2101.g: "Wygląda o wiele lepiej!"
 dubois.2102.t: "Szkielet Bez Zmian"
 dubois.2102.d: "Mimo licznych prób poprawienia rekonstrukcji szkieletu nasz [concept_dubois_paleontologist] nie odniósł sukcesu."
 dubois.2102.f: "Profesor [ROOT.Var('dubois_paleontologist_var').GetCharacter.GetLastName] obchodził się ze szkieletem z wielką ostrożnością. Starając się nie wyrządzić zbyt wielu szkód i działać rozważnie, był tak zachowawczy, że niemal niczego nie zmienił."
 dubois.2102.g: "Bez zmian? Za co właściwie ten [concept_dubois_paleontologist] dostaje pieniądze?"
 dubois.2103.t: "Szkielet w Gorszym Stanie"
 dubois.2103.d: "Być może lepiej byłoby, gdyby [ROOT.Var('dubois_paleontologist_var').GetCharacter.GetFullName] nie pracował nad szkieletem dinozaura."
 dubois.2103.f: "Wszystkich obecnych ogromnie zaskoczyła „poprawiona wersja” szkieletu, którą zaprezentował profesor [ROOT.Var('dubois_paleontologist_var').GetCharacter.GetLastName]. Zwłaszcza że jedna z kości biodrowych spoczywała teraz na barku, a zwierzę zyskało imponujący drugi ogon — na czole."
 dubois.2103.g: "Ten głupiec tylko pogorszył sprawę!"
 dubois.2111.t: "Dział Dinozaurów z Ameryki Północnej"
 dubois.2111.d: "Który szkielet dinozaura chcesz obejrzeć?"
 dubois.2111.f: "Dinozaury z Ameryki Północnej należą do najbardziej znanych przedstawicieli tej grupy. Pod koniec XIX wieku w formacji Morrison odkryto liczne gatunki dinozaurów. Do znanych przedstawicieli należą ankylozaur, diplodok, triceratops i tyranozaur rex."
 dubois.2111.g: "Ankylozaur."
 dubois.2111.h: "Diplodok."
 dubois.2111.i: "Triceratops."
 dubois.2111.j: "Tyranozaur Rex."
 dubois.2111.k: "Stegozaur."
 dubois.2112.t: "Ankylozaur"
 dubois.2112.f: "Ankylozaur to niezwykły rodzaj opancerzonego dinozaura, który żył w późnej kredzie, około 68 do 66 milionów lat temu. Należał do grupy roślinożernych dinozaurów zwanych ankylozaurydami i wyróżniał się charakterystycznymi, imponującymi przystosowaniami obronnymi.\nAnkylozaur miał masywne, silnie opancerzone ciało o szerokiej, nisko osadzonej sylwetce. W jego skórze tkwiły płyty kostne, zwane osteodermami, zapewniające skuteczną ochronę przed potencjalnymi drapieżnikami. Jego najbardziej rozpoznawalną cechą była maczuga ogonowa, utworzona przez zwarte zgrubienie kostne na końcu ogona, która prawdopodobnie służyła zarówno do odstraszania napastników, jak i do walk z osobnikami własnego gatunku.\nOsiągający długość około 20 do 30 stóp ankylozaur był czworonożnym roślinożercą, który ścinał roślinność szerokim dziobem. Jego stosunkowo niewielka głowa w porównaniu z masywnym ciałem wskazuje, że wybiórczo żerował na nisko rosnących roślinach i krzewach."
 dubois.2113.t: "Diplodok"
 dubois.2113.f: "Diplodok to jeden z najbardziej rozpoznawalnych rodzajów olbrzymich dinozaurów o długich szyjach, które żyły w późnej jurze, około 154 do 152 milionów lat temu. Zaliczany do zauropodów, diplodok słynie z niezwykle wydłużonej szyi i ogromnych rozmiarów, uosabiając potęgę prehistorycznego życia.\nDiplodok wyróżniał się charakterystyczną budową ciała: miał wydłużoną szyję i ogon oraz stosunkowo małą głowę z kołkowatymi zębami przystosowanymi do zgryzania roślinności. Imponująca długość, sięgająca 90 stóp, czyniła go jednym z najdłuższych zwierząt lądowych w dziejach, a stosunkowo lekki szkielet i czworonożna postawa umożliwiały mu sprawne poruszanie się.\nUważa się, że diplodok był roślinożercą, który dzięki długiej szyi sięgał po roślinność wysoko nad ziemią, unikając konkurencji z innymi roślinożercami. Skamieliny wskazują, że dinozaury te prawdopodobnie zamieszkiwały bujnie porośnięte brzegi rzek, gdzie miały pod dostatkiem pokarmu roślinnego."
 dubois.2114.t: "Triceratops"
 dubois.2114.f: "Triceratops to jeden z najbardziej rozpoznawalnych rodzajów rogatych dinozaurów, które żyły w późnej kredzie, około 68 do 66 milionów lat temu. Zaliczany do ceratopsydów, triceratops słynie z charakterystycznego wyglądu, na który składają się imponujące rogi na głowie oraz kostna kryza w jej tylnej części.\nTriceratops wyróżniał się potężnymi przystosowaniami obronnymi: miał duże, krzepkie ciało i masywną głowę z wydatnym rogiem nosowym nad pyskiem oraz dwoma wydłużonymi rogami nad oczami. Jego kryza, ozdobiona otworami i misternymi wzorami, prawdopodobnie służyła rozpoznawaniu osobników własnego gatunku, termoregulacji oraz pokazom siły przed ewentualną walką.\nTriceratops był czworonożnym roślinożercą zamieszkującym różnorodne środowiska, od terenów leśnych po równiny. Mocny dziób pozwalał mu sprawnie ścinać roślinność, a potężne szczęki umożliwiały rozcieranie twardego pokarmu roślinnego. Skamieliny kości triceratopsa sugerują, że mógł przejawiać zachowania społeczne i uczestniczyć w relacjach hierarchicznych w obrębie stad."
 dubois.2115.t: "Tyranozaur Rex"
 dubois.2115.f: "Tyrannosaurus rex, powszechnie nazywany T. rex, to jeden z najbardziej rozpoznawalnych olbrzymich dinozaurów drapieżnych, który przemierzał Ziemię w późnej kredzie, około 68 do 66 milionów lat temu. Należący do teropodów T. rex zajmował szczyt prehistorycznego łańcucha pokarmowego jako jeden z największych drapieżników lądowych w dziejach.\nT. rex słynął z charakterystycznej budowy i imponujących rozmiarów: osiągał do 40 stóp długości i około 15 do 20 stóp wysokości. Jego potężna czaszka, wyposażona w ząbkowane zęby wielkości bananów, wskazuje na mięsożerną dietę złożoną głównie z innych dinozaurów. Silne kończyny tylne były przystosowane do szybkiego poruszania się, natomiast nieproporcjonalnie małe kończyny przednie, przypominające narządy szczątkowe, nadal intrygują naukowców.\nZnaleziska paleontologiczne sugerują, że T. rex mógł być drapieżnikiem szczytowym, który dzięki wyostrzonemu węchowi, widzeniu obuocznemu i ogromnej sile szczęk utrzymywał swoją pozycję na szczycie prehistorycznego ekosystemu. Dyskusja o tym, czy aktywnie polował, czy też żywił się padliną, pozostaje przedmiotem nieustannych badań i spekulacji."
 dubois.2116.t: "Stegozaur"
 dubois.2116.f: "Stegozaur to jeden z najbardziej rozpoznawalnych rodzajów roślinożernych dinozaurów, które żyły w późnej jurze, około 155 do 150 milionów lat temu. Zaliczany do tyreoforów, stegozaur słynie z charakterystycznego i efektownego wyglądu.\nStegozaur wyróżniał się podwójnym rzędem dużych płyt kostnych wzdłuż grzbietu oraz potężnymi kolcami na ogonie, tworzącymi tak zwany tagomizer. Był dinozaurem średniej wielkości o niepowtarzalnej sylwetce. Przeznaczenie jego płyt — termoregulacja, funkcja pokazowa czy obrona — pozostaje przedmiotem naukowej debaty.\nOsiągający długość do 30 stóp stegozaur miał stosunkowo niewielką głowę wyposażoną w dziób i zęby policzkowe służące do rozdrabniania pokarmu roślinnego. Był wyspecjalizowanym roślinożercą, który w swoim jurajskim środowisku prawdopodobnie żerował na nisko rosnącej roślinności.\nSkamieliny stegozaura odkrywano głównie w zachodniej części Ameryki Północnej, między innymi w Kolorado i Utah. Dostarczyły one cennych informacji o anatomii, zachowaniu i historii ewolucyjnej tyreoforów. Charakterystyczny wygląd stegozaura zapewnił mu trwałą popularność zarówno w paleontologii, jak i w kulturze popularnej."
 dubois.2112.h: "Wróć do Działu Północnoamerykańskiego."
 dubois.2121.t: "Dział Dinozaurów z Ameryki Południowej"
 dubois.2121.d: "Który szkielet dinozaura chcesz obejrzeć?"
 dubois.2121.f: "Pod koniec XIX wieku w masywach górskich Patagonii w Ameryce Południowej coraz częściej znajdowano kości dinozaurów. Do najwcześniej odkrytych przedstawicieli należą antarktozaur i argyrozaur."
 dubois.2121.g: "Ankylozaur."
 dubois.2121.h: "Argyrozaur."
 dubois.2122.t: "Antarktozaur"
 dubois.2122.f: "Antarktozaur to godny uwagi rodzaj zauropodów, które zamieszkiwały pradawny kontynent Gondwanę w późnej kredzie, około 70 do 65 milionów lat temu. Zaliczany do tytanozaurów, antarktozaur ukazuje różnorodność form zauropodów, które niegdyś przemierzały Ziemię.\nAntarktozaur wyróżniał się ogromnymi rozmiarami. Był olbrzymim, czworonożnym roślinożercą, który osiągał długość do 60 stóp, a nawet więcej. Wydłużona szyja i ogon oraz stosunkowo niewielka głowa wskazują na przystosowanie do żywienia się roślinnością wysoko nad ziemią. Ten tytanozaur odznaczał się masywną budową kończyn, które prawdopodobnie podtrzymywały jego ciężar i umożliwiały mu poruszanie się.\nSkamieliny antarktozaura odkrywano głównie na kontynentach południowych, w tym w Ameryce Południowej i na Antarktydzie. Dostarczyły one cennych informacji o ewolucji i rozmieszczeniu zauropodów w późnej kredzie. Znaleziska te pomagają nam zrozumieć wyjątkowe ekosystemy, które istniały wówczas na Gondwanie."
 dubois.2123.t: "Argyrozaur"
 dubois.2123.f: "Argyrozaur to ważny rodzaj zauropodów, które przemierzały pradawne krajobrazy Ameryki Południowej w późnej kredzie, około 90 do 70 milionów lat temu. Należący do podgrupy zauropodów zwanej tytanozaurami, argyrozaur dostarcza informacji o różnorodnej prehistorycznej faunie tego regionu.\nChoć niektóre aspekty jego biologii i zachowania pozostają przedmiotem przypuszczeń, argyrozaur nadal stanowi fascynujący obiekt badań paleontologicznych, rzucając światło na potęgę i złożoność prehistorycznego świata półkuli południowej."
 dubois.2122.h: "Wróć do Działu Południowoamerykańskiego."
 dubois.2131.t: "Dział Dinozaurów z Europy"
 dubois.2131.d: "Który szkielet dinozaura chcesz obejrzeć?"
 dubois.2131.f: "Już od początku XIX wieku w europejskich masywach górskich odkrywano kolejne skamieliny dinozaurów, w dużej mierze dzięki rozwojowi górnictwa. Do znanych przedstawicieli należą między innymi iguanodon i plateozaur."
 dubois.2131.g: "Iguanodon."
 dubois.2131.h: "Plateozaur."
 dubois.2132.t: "Iguanodon"
 dubois.2132.f: "Iguanodon to ważny rodzaj roślinożernych dinozaurów, które żyły we wczesnej kredzie, około 140 do 120 milionów lat temu. Zaliczany do iguanodontydów, iguanodon odegrał kluczową rolę w kształtowaniu naszej wiedzy o anatomii i zachowaniu dinozaurów.\nIguanodon wyróżniał się charakterystycznym kolcem na kciuku oraz pyskiem przypominającym dziób. Miał ciało średniej wielkości i poruszał się zarówno na dwóch, jak i na czterech nogach, wykazując intrygującą zdolność łączenia obu sposobów lokomocji. Kolec na kciuku, niegdyś uznawany za róg, według obecnych przypuszczeń służył do obrony przed drapieżnikami lub do manipulowania roślinnością.\nIguanodon zamieszkiwał różnorodne środowiska, w tym lasy i równiny, a jego bezzębny dziób pozwalał mu sprawnie ścinać roślinność. Osiągając długość do 33 stóp, był jednym z ważniejszych roślinożerców swoich czasów i wpływał na zamieszkiwane ekosystemy. Skamieliny iguanodona po raz pierwszy odkryto w Europie, przede wszystkim w Belgii i Anglii, a badania nad nim odegrały kluczową rolę w rozwoju paleontologii."
 dubois.2133.t: "Plateozaur"
 dubois.2133.f: "Plateozaur to ważny rodzaj roślinożernych dinozaurów, które żyły w późnym triasie, około 214 do 204 milionów lat temu. Zaliczany do prozauropodów, plateozaur dostarcza kluczowych informacji o wczesnej ewolucji dinozaurów i ich przystosowaniach do różnych środowisk.\nPlateozaur wyróżniał się wydłużoną szyją, niewielką głową i stosunkowo długim ogonem. Poruszał się zarówno na dwóch, jak i na czterech nogach, co odzwierciedlało przejściowy etap ewolucji dinozaurów. Silne kończyny i przystosowania do podtrzymywania ciężaru ciała pozwalały mu sprawnie zdobywać pokarm roślinny i poruszać się w swoim środowisku.\nPlateozaur, którego długość szacuje się na nawet 30 stóp, był jednym z dominujących roślinożerców swoich czasów. Zamieszkiwał różnorodne tereny, od równin zalewowych po lasy na wyżynach. Jego szerokie zęby w kształcie liści ułatwiały spożywanie pokarmu roślinnego."
 dubois.2132.h: "Wróć do Działu Europejskiego."
 dubois.2141.t: "Dział Dinozaurów z Afryki"
 dubois.2141.d: "Który szkielet dinozaura chcesz obejrzeć?"
 dubois.2141.f: "Dopiero na początku XX wieku paleontologia w Afryce zaczęła się dynamicznie rozwijać, zwłaszcza na terenach Tanzanii i Afryki Południowej, a także w Egipcie. Do ważnych odkryć należały żyrafatytan i spinozaur."
 dubois.2141.g: "Giraffatitan."
 dubois.2141.h: "Spinozaur."
 dubois.2142.t: "Giraffatitan"
 dubois.2142.f: "Żyrafatytan, dawniej znany jako brachiozaur, to ważny rodzaj olbrzymich dinozaurów o długich szyjach, które żyły w późnej jurze, około 154 do 150 milionów lat temu. Zaliczany do zauropodów, żyrafatytan wyróżniał się wyjątkowymi rozmiarami i niezwykłymi przystosowaniami.\nŻyrafatytan miał wydłużoną szyję i stosunkowo krótki ogon. Jego przednie nogi były dłuższe od tylnych, co nadawało mu charakterystyczną sylwetkę i pozwalało sięgać po roślinność wysoko nad ziemią. Osiągając wysokość do 39 stóp i długość przekraczającą 80 stóp, należał do najwyższych i najdłuższych zwierząt lądowych w dziejach.\nŻyrafatytan był roślinożercą, który prawdopodobnie zamieszkiwał bujnie porośnięte środowiska, takie jak doliny rzek i równiny zalewowe, gdzie miał pod dostatkiem pokarmu roślinnego. Ogromną masę jego ciała podtrzymywały masywne kości kończyn oraz potężna, beczkowata klatka piersiowa. Skamieliny żyrafatytana odkrywano głównie w Afryce, zwłaszcza na terenach dzisiejszej Tanzanii i Zimbabwe."
 dubois.2143.t: "Spinozaur"
 dubois.2143.f: "Spinozaur to niezwykły rodzaj mięsożernych dinozaurów, które zamieszkiwały Afrykę Północną w kredzie, około 112 do 93 milionów lat temu. Zaliczany do teropodów, spinozaur słynie z charakterystycznego wyglądu i wyjątkowych przystosowań.\nSpinozaur wyróżniał się wydłużonym pyskiem, płetwą grzbietową przypominającą żagiel oraz potężnymi szczękami podobnymi do krokodylich. Uważa się, że był drapieżnikiem prowadzącym ziemnowodny tryb życia, prawdopodobnie wyspecjalizowanym w polowaniu na ryby i inne zwierzęta morskie. Jego żagiel mógł odgrywać rolę w termoregulacji lub rozpoznawaniu osobników własnego gatunku.\nSpinozaur, którego długość szacuje się na nawet 50 do 59 stóp, jest uznawany za jednego z największych teropodów. Masywne kończyny i wydłużona czaszka sugerują przystosowanie do chwytania i zjadania zwierząt wodnych, wskazując na jego niszę ekologiczną. Skamieliny spinozaura odkryto po raz pierwszy w Egipcie, a później także w Maroku."
 dubois.2142.h: "Wróć do Działu Afrykańskiego."
 dubois.2151.t: "Dział Dinozaurów z Azji"
 dubois.2151.d: "Który szkielet dinozaura chcesz obejrzeć?"
 dubois.2151.f: "Pierwsza amerykańska wyprawa do Mongolii w pierwszej tercji XX wieku miała doprowadzić do odkrycia nowych rodzajów dinozaurów w Azji. Do najwcześniej poznanych należą psitakozaur i welociraptor."
 dubois.2151.g: "Psitakozaur."
 dubois.2151.h: "Welociraptor."
 dubois.2152.t: "Psitakozaur."
 dubois.2152.f: "Psitakozaur to ważny rodzaj niewielkich, roślinożernych dinozaurów, które zamieszkiwały Azję we wczesnej kredzie, około 126 do 101 milionów lat temu. Zaliczany do ceratopsów, psitakozaur wyróżnia się intrygującymi cechami i wnosi istotny wkład w naszą wiedzę o ewolucji dinozaurów.\nPsitakozaur miał dziób przypominający papuzi, krępe ciało oraz charakterystyczne struktury przypominające postrzępione dutki piór wzdłuż ogona i tułowia, co nadawało mu wyjątkowy wygląd wśród dinozaurów. Uważa się, że te guzki stanowiły miejsca osadzenia struktur przypominających szczecinę, które mogły pełnić funkcję pokazową lub służyć termoregulacji.\nPsitakozaur osiągał długość od około 3 do 6.5 stopy i zamieszkiwał różnorodne środowiska, w tym lasy i równiny. Jego dziób i wyspecjalizowane zęby wskazują na przystosowanie do rozdrabniania różnorodnego pokarmu roślinnego. Skamieliny psitakozaura odkrywano głównie w Chinach i Mongolii."
 dubois.2153.t: "Welociraptor"
 dubois.2153.f: "Welociraptor to słynny rodzaj małych i średniej wielkości mięsożernych dinozaurów, które przemierzały niektóre obszary Azji w późnej kredzie, około 75 do 71 milionów lat temu. Zaliczany do teropodów z rodziny dromeozaurydów, welociraptor słynie z niezwykłych przystosowań oraz roli, jaką odegrał w kształtowaniu powszechnego wyobrażenia o dinozaurach.\nWelociraptor wyróżniał się ostrymi, zakrzywionymi pazurami na palcach stóp oraz dobrze rozwiniętymi cechami drapieżnymi. Był zwinnym i inteligentnym łowcą o smukłym ciele i długim ogonie. Na każdej stopie miał charakterystyczny sierpowaty pazur, którym prawdopodobnie zadawał ofiarom rany cięte.\nWbrew wcześniejszym przedstawieniom welociraptor był stosunkowo niewielki: mierzył około 6.5 stopy długości i ważył około 50 funtów. Wyostrzone zmysły, ostre zęby oraz zachowania związane z polowaniem w stadzie, o których wnioskowano na podstawie skamielin i badań, przyczyniły się do jego reputacji groźnego drapieżnika."
 dubois.2152.h: "Wróć do Działu Azjatyckiego."
 dubois.2161.t: "Dział Dinozaurów z Australii"
 dubois.2161.d: "Który szkielet dinozaura chcesz obejrzeć?"
 dubois.2161.f: "W 1926 roku po raz pierwszy odkryto w Australii kości dinozaurów, co zapoczątkowało intensywniejsze badania. Później rozgłos miał zyskać mutaburazaur."
 dubois.2161.g: "Muttaburazaur."
 dubois.2161.h: "Retozaur."
 dubois.2162.t: "Muttaburazaur"
 dubois.2162.f: "Mutaburazaur to ważny rodzaj ornitopodów, które zamieszkiwały Australię we wczesnej kredzie, około 112 do 99 milionów lat temu. Zaliczany do iguanodontów, mutaburazaur dostarcza cennych informacji o prehistorycznej faunie tego regionu.\nMutaburazaur wyróżniał się charakterystycznym, pustym w środku, zaokrąglonym grzebieniem na pysku. Miał ciało średniej wielkości i osiągał długość około 20 do 30 stóp. Jego potężne szczęki były wyposażone w baterie zębowe przystosowane do rozcierania pokarmu roślinnego, co sugeruje roślinożerną dietę.\nGrzebień na czaszce, który mógł służyć jako komora rezonansowa przy wydawaniu dźwięków lub pełnić funkcję pokazową, odróżnia mutaburazaura od innych ornitopodów. Masywne kończyny i stosunkowo duże rozmiary wskazują na przystosowanie do sprawnego poruszania się i roślinożernego trybu życia."
 dubois.2163.t: "Retozaur"
 dubois.2163.f: "Retozaur to godny uwagi rodzaj zauropodów, które zamieszkiwały Australię w środkowej jurze, około 165 milionów lat temu. Zaliczany do zauropodomorfów, retozaur dostarcza kluczowych informacji o pradawnej historii australijskich dinozaurów.\nRetozaur wyróżniał się ogromnymi rozmiarami. Był olbrzymim, czworonożnym roślinożercą o długiej szyi, masywnych kończynach i stosunkowo niewielkiej głowie. Choć ustępował rozmiarami niektórym swoim krewniakom wśród zauropodów, mierzył około 50 stóp długości, co czyniło go jednym z największych zwierząt ówczesnej Australii.\nSkamieliny retozaura odkryto po raz pierwszy w australijskim Queensland. Stanowią one jedne z najwcześniejszych świadectw obecności zauropodów w tym regionie. Cechy jego budowy, takie jak długa szyja i stosunkowo wydłużony ogon, odzwierciedlają przystosowania do roślinożerności i korzystania z różnorodnych zasobów roślinnych."
 dubois.2162.h: "Wróć do Działu Australijskiego."
 dubois.2112.d_perfect_dinosaur: "Ten szkielet dinozaura jest uznawany za doskonale złożony. Nie wymaga zmian i zapewnia maksymalną Ocenę Dinozaurów."
 dubois.2112.d_imperfect_dinosaur: "Ten szkielet dinozaura jest uznawany za niedoskonale złożony. Zapewnia tylko połowę możliwej Oceny Dinozaurów. Może go ponownie złożyć [concept_dubois_paleontologist], pod warunkiem że nie jest zajęty ani wyczerpany."
 dubois.2112.d_poor_dinosaur: "Ten szkielet dinozaura jest uznawany za źle złożony. Znacznie obniża naszą Ocenę Dinozaurów. Może go ponownie złożyć [concept_dubois_paleontologist], pod warunkiem że nie jest zajęty ani wyczerpany."
 dubois.2112.g: "Złóż ponownie ten szkielet dinozaura."
