 dubois.1012.t: "Wybieg Hipopotama"
 dubois.1012.d: "Wybieg #o Hipopotama#! zamieszkuje grupa tych ogromnych stworzeń. Na szczęście od zwiedzających oddziela je szeroka fosa."
 dubois.1012.f1: "Hipopotamy unosiły się w wodzie na swoim wybiegu. Niewiele się działo. Zastanawiałeś się, czy w ogóle kiedykolwiek coś robią, gdy obok ciebie pojawił się opiekun zwierząt.\n\n„To fascynujące, że hipopotamy za dnia zazwyczaj tylko unoszą się w wodzie, a po zmierzchu stają się bardzo aktywne i zaczynają żerować. Wszystko staje się jednak jasne, gdy wiemy, jak gorąco jest w ich naturalnym środowisku. Woda chłodzi je w ciągu dnia, a wieczorem i nocą mogą wreszcie zacząć wędrować”."
 dubois.1012.f2: "Nagle z wody wynurzył się hipopotam. Wcześniej go nie widziałeś, choć obserwowałeś wybieg od kilku minut. Musiał przez dłuższy czas pozostawać pod wodą.\n\nOsoba stojąca obok odezwała się: „Czyż to nie fascynujące? Hipopotamy potrafią przebywać pod wodą przez pięć minut. Gdy się zanurzają, ich nozdrza i uszy zamykają się, nie wpuszczając wody do środka”."
 dubois.1012.f3: "Jeden z hipopotamów otworzył ogromną paszczę, ukazując długie, zakrzywione zęby. Następnie zaczął chrząkać i rozchlapywać wodę.\n\nCzytałeś kiedyś, że samce hipopotamów robią to, by odstraszyć rywali, ponieważ zaciekle bronią swojego terytorium. Oznaczają też odchodami wybrane miejsca na jego obszarze. Czasem nawet wpatrują się w inne samce, by okazać dominację."
 dubois.1012.k: "Wróć do Afrykańskich Wybiegów"
 zoo_african_enclosures_tt: "Wrócisz do Afrykańskich Wybiegów Ogrodu Zoologicznego."
 dubois.1013.t: "Wybieg Lwa Afrykańskiego"
 dubois.1013.d: "Na tym wybiegu można obserwować stado #o Lwów Afrykańskich#!. Zgodnie ze zwyczajami gatunku zapewniono im drzewa dające cień oraz płytki zbiornik wodny."
 dubois.1013.f1: "Spoczywający wśród swojej rodziny dorosły samiec szczyci się bujną grzywą o ciemnej barwie — ozdobą, której okazałość wzrasta wraz z wiekiem i siłą zwierzęcia. Przyrodnicy uważają, że grzywa pełni dwojaką funkcję: po pierwsze, służy doborowi płciowemu, świadcząc o zdrowiu i pozycji jej posiadacza; po drugie, stanowi ochronną kryzę, w pewnym stopniu osłaniającą gardło i szyję podczas walk z rywalizującymi samcami. W chłodniejszym klimacie, zwłaszcza w menażeriach położonych z dala od Afryki, grzywa staje się zwykle dłuższa i gęstsza, osiągając niekiedy ponad 16 cm długości, co prawdopodobnie wiąże się z temperaturą i kondycją zwierzęcia."
 dubois.1013.f2: "Lwy Afrykańskie żyją w grupach społecznych zwanych stadami, zazwyczaj złożonych ze spokrewnionych samic i ich potomstwa oraz jednego lub kilku dorosłych samców, które pozostają w stadzie przez pewien czas. Samice pozostają w miejscu urodzenia i zajmują się głównie zdobywaniem pożywienia oraz polowaniem; dzięki współpracy odnoszą znaczne sukcesy w łowach na duże ssaki kopytne. Samce z kolei bronią stada i jego terytorium, a gdy już powalą wielką zdobycz, dorosły osobnik może pochłonąć ponad 40 kilogramów mięsa podczas jednego posiłku."
 dubois.1013.f3: "Miarowe przechadzki lwa — tak często dostrzegane przez uważnych zwiedzających — można przyrównać do obchodu wartownika, odzwierciedlają bowiem wrodzoną skłonność zwierzęcia do patrolowania granic, badania zapachów i czuwania o świcie i zmierzchu. W naturze lew strzeże terytorium, rycząc, znakując je moczem i wydzielinami gruczołów oraz systematycznie sprawdzając znajome ścieżki i charakterystyczne punkty terenu; w niewoli te odziedziczone po przodkach instynkty przejawiają się w regularnym obchodzeniu wybiegu."
 dubois.1013.f4: "W ogrodzie zoologicznym od dawna widywano, jak [SCOPE.sCharacter('dubois_prinz_eugen').GetFullName] codziennie odwiedza sędziwego lwa, jak gdyby weteran i zwierzę dostrzegali w sobie nawzajem ślady przeżytych trudów i triumfów. Gdy przez trzy dni mężczyzna się nie pojawiał, lew odmawiał pożywienia i przechadzał się wyraźnie zaniepokojony. O trzeciej nad ranem wydał potężny ryk; w tej samej chwili dzwon kaplicy obwieścił śmierć wielkiego Generała noszącego nazwisko [SCOPE.sCharacter('dubois_prinz_eugen').GetLastName]. Takie zbiegi okoliczności, choć nie należy uznawać ich za dowód naukowy, poruszają nawet najbardziej żołnierskie serca."
 dubois.1014.t: "Wybieg Słonia Afrykańskiego"
 dubois.1014.d: "Na tym rozległym wybiegu wypoczywają #o Słonie Afrykańskie#!. Ich rozmiary i inteligencja sprawiają, że należą do największych atrakcji Ogrodu Zoologicznego."
 dubois.1014.f1: "Oto przewodniczka stada — najbardziej doświadczona spośród swych krewniaczek — wokół której skupia się cała grupa. Społeczność słoni ma wyraźnie matrylinearny charakter: dorosłe samice pozostają wraz z córkami i siostrami, kierują wędrówkami ku wodzie i żerowiskom oraz otaczają młode i krewniaków szczególną troską. Przyrodnicy odnotowali przypadki zachowań sugerujących żałobę i pamięć o utraconych towarzyszach, co świadczy o niezwykłej pamięci tych zwierząt i sile ich więzi społecznych."
 dubois.1014.f2: "Trąbienie, tak poruszające dla ucha, jest zaledwie jednym z głosów w bogatym repertuarze słonia. Oprócz tych donośnych dźwięków i gardłowych pomruków zwierzęta te wydają infradźwięki poniżej progu ludzkiej słyszalności, które rozchodzą się na wielkie odległości zarówno w powietrzu, jak i przez podłoże. W ten sposób stada koordynują swoje wędrówki, wzywają pomoc i oznajmiają swoją obecność na sawannie."
 dubois.1014.f3: "Niezwykła trąba — łącząca nos i górną wargę — jest cudem budowy mięśniowej, złożonym, jak się podaje, z wielu dziesiątek tysięcy włókien i zdolnym do najdelikatniejszych czynności chwytnych. Ciosy są w istocie wydłużonymi siekaczami, które stale rosną i służą do rozmaitych celów: kopania, zdzierania kory i obrony. Słonie długo zachowują w pamięci miejsca i osoby; bezbłędnie odnajdują wodopoje odwiedzane w minionych porach roku, a poszczególne osobniki rozpoznają po zapachu i wyglądzie nawet po długiej rozłące."
 dubois.1015.t: "Wybieg Żyrafy"
 dubois.1015.d: "#o Żyrafy#! widać już z daleka, gdy zgodnie ze swą naturą sięgają wysoko uniesionymi głowami po liście wśród najwyższych gałęzi."
 dubois.1015.f1: "Język o niebieskawym zabarwieniu, mierzący niemal pół łokcia długości, jest znakomicie przystosowany do chwytania ciernistych gałązek, które poraniłyby mniej wyspecjalizowany pysk. Zwierzę delikatnie chwyta i obrywa liście akacji, omijając ciernie, dzięki czemu może zjadać blisko trzydzieści kilogramów listowia dziennie. Pożywienie dostarcza żyrafie tak wiele wody, że rzadko musi się schylać, by się napić."
 dubois.1015.f2: "Gdy samce rywalizują o pierwszeństwo, wdają się w osobliwe starcia zwane „walkami na szyje”, kołysząc głową niczym wahadłem, by uderzyć rywala w bok. Z biegiem lat wyrostki kostne na czaszce (ossikony) stają się masywniejsze, a ich końce często łysieją, co jest oznaką wieku i pozycji. Żyrafy zazwyczaj tworzą luźne grupy, których skład zmienia się podczas wędrówek po równinach, choć samice z młodymi trzymają się razem."
 dubois.1015.f3: "Umaszczenie, tworzące mozaikę plam na jaśniejszym tle, zapewnia kamuflaż w grze światła i cienia, a także, jak się uważa, umożliwia regulację ciepła dzięki gęstej sieci naczyń krwionośnych pod każdą plamą. Potężne serce i mocne tętnice żyrafy zapewniają dopływ krwi do wysoko uniesionej głowy wbrew sile ciążenia; mimo to zwierzę porusza się z gracją, która nie zdradza trudów wynikających z jego wzrostu."
 dubois.1016.t: "Wybieg Pingwina Przylądkowego"
 dubois.1016.d: "Niektóre #o Pingwiny Przylądkowe#! bawią się w wodzie, podczas gdy inne stoją gromadnie na brzegu, pielęgnując swoje wspaniałe upierzenie."
 dubois.1016.f1: "Gatunek ten (Spheniscus demersus), zwany „pingwinem oślim” ze względu na głos przypominający ryk osła, zamieszkuje wybrzeża południowej Afryki o umiarkowanym klimacie, zwłaszcza Namibii i Kraju Przylądkowego. W przeciwieństwie do swoich antarktycznych krewniaków dobrze radzi sobie w łagodniejszych morzach, a ciemny grzbiet i jasny spód ciała chronią go przed wzrokiem wrogów zarówno z góry, jak i z dołu. Żywi się głównie drobnymi rybami i głowonogami, ścigając je z wielką zwinnością pod powierzchnią wody."
 dubois.1016.f2: "Pingwiny przylądkowe często drążą nory w pradawnych pokładach guana, gdzie składają jaja i wychowują młode, a rodzice na przemian wysiadują i zdobywają pożywienie. Zniesienie składa się najczęściej z dwóch jaj. Tam, gdzie człowiek usunął guano, ubyło dogodnych miejsc lęgowych; należy mieć nadzieję, że rozumna gospodarka z czasem naprawi te szkody."
 dubois.1016.f3: "Ich upierzenie jest niezwykle gęste i dobrze natłuszczone, dzięki czemu zapewnia zarówno izolację cieplną, jak i nieprzemakalność. W wodzie ptaki osiągają znaczną prędkość i sterują z godną podziwu precyzją za pomocą sztywnych skrzydeł przekształconych w płetwy oraz ogona. Na lądzie są towarzyskie i porozumiewają się bogatym repertuarem głosów, a każdy dźwięk jest zrozumiały dla ich pobratymców pośród zgiełku kolonii lęgowej."
 dubois.1017.t: "Wybieg Golca Piaskowego"
 dubois.1017.d: "Ponieważ gryzonie te spędzają większość życia pod ziemią, wybieg urządzono w formie ziemnego kopca z przeszklonymi korytarzami, które odsłaniają ich komory i tunele przed dociekliwym wzrokiem zwiedzających."
 dubois.1017.f1: "Golec Piaskowy (Heterocephalus glaber) wyróżnia się wśród ssaków bezwłosą skórą, temperaturą ciała dostosowującą się do otoczenia i niezwykłą tolerancją niedoboru tlenu — cechami doskonale służącymi życiu w głębokich, pełnych dusznych wyziewów tunelach. Jego potężne siekacze, pracujące przed zamkniętymi wargami, służą niczym kilofy do drążenia ziemi; wargi zwierają się za zębami, nie wpuszczając pyłu do pyska. Choć niepozorny, jest nadzwyczaj pracowity i z niestrudzonym zapałem drąży długie korytarze oraz obszerne spiżarnie."
 dubois.1017.f2: "Gatunek ten tworzy rzadko spotykaną społeczność eusocjalną: jedna rozmnażająca się „królowa”, otoczona partnerami, przewodzi rzeszy bezpłodnych robotników i żołnierzy. Pierwsi rozbudowują nory, dostarczają pożywienie i opiekują się młodymi; drudzy bronią wspólnoty przed wężami i innymi intruzami. Taka organizacja, częściej spotykana u owadów, dostarcza filozofowi przyrody wiele materiału do rozważań."
 dubois.1017.f3: "W swoich ciepłych schronieniach zwierzęta tulą się do siebie, dzieląc się ciepłem i okazując sobie czułość podczas częstych zabiegów wzajemnej pielęgnacji. Ich ciche, lecz różnorodne głosy podtrzymują więzi między członkami kolonii. U tego niewielkiego stworzenia odnotowano niezwykłą długowieczność i znaczną odporność na niektóre schorzenia, co wzbudziło zainteresowanie zarówno lekarzy, jak i zoologów."
 dubois.1018.t: "Wybieg Zebry Stepowej"
 dubois.1018.d: "Ten równy, trawiasty wybieg z rozproszonymi skrawkami cienia przypomina miniaturę afrykańskiego weldu; tutaj #o Zebra Stepowa#! czuje się jak u siebie."
 dubois.1018.f1: "Wyrazista czarno-biała szata zebry, choć rzuca się nam w oczy, w blaskach i cieniach sawanny dezorientuje zarówno muchy, jak i wrogów. Układ pasów każdego osobnika jest niepowtarzalny niczym podpis. Te koniowate żyją zazwyczaj w rodzinnych „haremach”, złożonych z jednego ogiera, kilku klaczy i ich młodych, a członkowie grupy podtrzymują ład poprzez wzajemną pielęgnację i czujne wypatrywanie drapieżników."
 dubois.1018.f2: "Hierarchię wśród samców ustalają rytualne pokazy — kładzenie uszu, wyginanie szyi w łuk i uderzenia przednimi nogami — a niekiedy także gryzienie i szybkie kopnięcia. Zebry porozumiewają się za pomocą ryku, parskania i wysokiego rżenia, a także wyrazistej mowy uszu i ogona. Młodsze samce tworzą odrębne grupy kawalerskie, dopóki nie zaczną rywalizować o klacze."
 dubois.1018.f3: "Źrebię przychodzi na świat dobrze rozwinięte i już w ciągu godziny po narodzinach staje na nogi i biega, gdyż na otwartej równinie bezpieczeństwo zależy od wcześnie nabytej szybkości. Zapamiętuje zapach matki i układ jej pasów, ona zaś otacza je pełną oddania opieką. Z czasem młode poznają zwyczaje stada — gdzie się paść, kiedy wędrować i jak korzystać z czujności licznych towarzyszy."
