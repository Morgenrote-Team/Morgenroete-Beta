 dubois_set_paleontologist_to_north_america_tt: "Profesor wyruszy na wyprawę, aby odkryć #O skamieniałe szczątki#! w pradawnych warstwach skalnych Ameryki Północnej."
 dubois_set_paleontologist_to_south_america_tt: "Profesor zbada prehistoryczne szczątki pogrzebane na rozległych obszarach Ameryki Południowej."
 dubois_set_paleontologist_to_europe_tt: "Profesor przeprowadzi systematyczne badania #O złóż paleontologicznych#! na przesiąkniętych historią ziemiach Europy."
 dubois_set_paleontologist_to_africa_tt: "Profesor będzie poszukiwać #O okazów skamieniałości#! w pradawnych formacjach kontynentu afrykańskiego."
 dubois_set_paleontologist_to_asia_tt: "Profesor wyruszy do Azji w poszukiwaniu #O skamieniałych świadectw#! pradawnego życia."
 dubois_set_paleontologist_to_australia_tt: "Profesor wyrusza do Australii, aby zbadać jej odległe i zagadkowe #O pokłady skamieniałości#!."
 dubois_set_paleontologist_to_default_tt: "Wezwij profesora do powrotu z badań terenowych i wznowienia obowiązków w kraju."
 dubois_has_formation_tt: "Posiada co najmniej jeden region, w którym znajduje się znacząca Formacja Geologiczna lub uznana Wielka Formacja Geologiczna."
 dubois_has_rainforest_tt: "Kontroluje co najmniej jeden region z lasem deszczowym. Uznawane obszary lasów deszczowych to: Puszcza Amazońska, Puszcza Kongijska, Lasy Borneo i Lasy Indochińskie."
 dubois_has_mountains_tt: "Ma roszczenia terytorialne do co najmniej jednego regionu, przez który przebiega znaczące pasmo górskie."
 dubois_unconquered_summit_tt: "Posiada niezdobyty szczyt lub prawo dostępu do niego, czy to we własnych granicach, czy na mocy karty alpinistycznej przyznanej przez obce mocarstwo."
 dubois_has_active_naturalist_tt: "[concept_dubois_naturalist] jest obecnie dostępny i nie prowadzi badań terenowych."
 dubois_has_active_paleontologist_tt: "[concept_dubois_paleontologist] jest gotowy do działania i nie jest obecnie zajęty wyprawami ani badaniami."
 dubois_naturalist_sick_tt: "[concept_dubois_naturalist] jest niedysponowany z powodu choroby i nie może obecnie prowadzić badań terenowych."
 dubois_botanical_expedition_banned_tt: "Wyprawy botaniczne zostały wstrzymane z powodu obowiązujących ograniczeń politycznych."
 dubois_chemical_warfare_tt: "Przedsięwzięcie to umożliwia opracowana przez nas #O Wojna Chemiczna#!, ponura, lecz przełomowa innowacja."
 dubois_triage_tt: "Działanie to jest możliwe dzięki wprowadzeniu przez nas systemu #O Segregacji Medycznej#! w medycynie pola walki."
 dubois_logistics_tt: "Operację tę wspiera nasza biegłość w nowoczesnej #O Logistyce#!, zapewniająca terminowe dostawy i koordynację."
 dubois_hide_animal_decisions: "Ukryj decyzje dotyczące Zwierząt"
 dubois_hide_animal_decisions_desc: "Ukryj wszystkie decyzje dotyczące Zwierząt."
 dubois_hide_animal_decisions_tt: "Ukryj wszystkie decyzje dotyczące Zwierząt."
 dubois_show_animal_decisions: "Pokaż decyzje dotyczące Zwierząt"
 dubois_show_animal_decisions_desc: "Pokaż wszystkie decyzje dotyczące Zwierząt."
 dubois_show_animal_decisions_tt: "Pokaż wszystkie decyzje dotyczące Zwierząt."
 dubois_extend_zoo_small_decision: "Rozbuduj [concept_dubois_zoo] (małe)"
 dubois_extend_zoo_small_decision_desc: "[Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals|q$')] cieszą wszystkich: ludzie znajdują w zoo rozrywkę, naukowcy mogą kontynuować badania zoologiczne, a międzynarodowy prestiż przypada tym, którzy potrafią zaprezentować jak najwięcej okazów obcej fauny. Każda rozbudowa zwiększa prestiż państwa. Niektóre etapy rozbudowy wymagają zgromadzenia nie tylko wielu zwierząt, lecz także okazów z różnych części świata."
 dubois_extend_zoo_medium_decision: "Rozbuduj [concept_dubois_zoo] (średnie)"
 dubois_extend_zoo_medium_decision_desc: "[Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals|q$')] cieszą wszystkich: ludzie znajdują w zoo rozrywkę, naukowcy mogą kontynuować badania zoologiczne, a międzynarodowy prestiż przypada tym, którzy potrafią zaprezentować jak najwięcej okazów obcej fauny. Każda rozbudowa zwiększa prestiż państwa. Niektóre etapy rozbudowy wymagają zgromadzenia nie tylko wielu zwierząt, lecz także okazów z różnych części świata."
 dubois_extend_zoo_large_decision: "Rozbuduj [concept_dubois_zoo] (duże)"
 dubois_extend_zoo_large_decision_desc: "[Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals|q$')] cieszą wszystkich: ludzie znajdują w zoo rozrywkę, naukowcy mogą kontynuować badania zoologiczne, a międzynarodowy prestiż przypada tym, którzy potrafią zaprezentować jak najwięcej okazów obcej fauny. Każda rozbudowa zwiększa prestiż państwa. Niektóre etapy rozbudowy wymagają zgromadzenia nie tylko wielu zwierząt, lecz także okazów z różnych części świata."
 dubois_extend_zoo_famous_decision: "Rozbuduj [concept_dubois_zoo] (sławne)"
 dubois_extend_zoo_famous_decision_desc: "[Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals|q$')] cieszą wszystkich: ludzie znajdują w zoo rozrywkę, naukowcy mogą kontynuować badania zoologiczne, a międzynarodowy prestiż przypada tym, którzy potrafią zaprezentować jak najwięcej okazów obcej fauny. Każda rozbudowa zwiększa prestiż państwa. Niektóre etapy rozbudowy wymagają zgromadzenia nie tylko wielu zwierząt, lecz także okazów z różnych części świata."
 dubois_catch_local_animal_decision: "Schwytaj Lokalną Faunę"
 dubois_catch_local_animal_decision_desc: "W naszym kraju znajdują się siedliska fascynujących gatunków zwierząt, które można by prezentować w [concept_dubois_zoo]. Znawca zwierząt ma przez rok podróżować po kraju, zbierając [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals|q$')] do zoo."
 dubois_visit_zoo_decision: "Zwiedź Ogród Zoologiczny"
 dubois_visit_zoo_decision_desc: "Rozpoczyna specjalne wydarzenie, podczas którego możesz przespacerować się po swoim Ogrodzie Zoologicznym i podziwiać wszystkie egzotyczne stworzenia zgromadzone dzięki wyprawom i wytrwałym staraniom."
 dubois_ban_animal_export_decision: "Zakaż Eksportu Zwierząt"
 dubois_ban_animal_export_decision_desc: "Wprowadzając zakaz eksportu żywych okazów, potwierdzamy nasze suwerenne prawo do zachowania rodzimych skarbów przyrody. Zagraniczne rządy przestaną kierować do nas prośby."
 dubois_allow_animal_export_decision: "Zezwól na Eksport Zwierząt"
 dubois_allow_animal_export_decision_desc: "Wydawanie zezwoleń na eksport wybranych zwierząt pozwala zarówno zyskać przychylność dyplomatyczną, jak i zapewnić pokaźne dodatkowe dochody."
 dubois_collect_specimen_decision: "Rozpocznij Zbieranie [concept_dubois_specimen]"
 dubois_collect_specimen_decision_desc: "Zgromadzenie znakomitej kolekcji [Concept('concept_dubois_specimen','$concept_dubois_specimens|q$')]—zarówno flory, jak i fauny—nie tylko wspiera rozwój naszych instytucji naukowych, lecz także świadczy o duchu dociekliwości i oświeconego postępu naszego narodu."
 dubois_safari_decision: "Rozpocznij Afrykańskie Safari"
 dubois_safari_decision_desc: "Wyślij grupę ekspedycyjną w głąb afrykańskiej dziczy w poszukiwaniu potężnej zwierzyny do naszego [concept_dubois_zoo]. Dzięki wytrwałemu tropieniu i starannemu zastawianiu pułapek być może uda się schwytać żywy okaz. Podczas jednego safari można pozyskać tylko jedno zwierzę. Ogólna zasada jest prosta: im większe i cięższe zwierzę, tym więcej pułapek potrzeba; szybkonogie stworzenia wymagają natomiast niestrudzonego pościgu."
 je_dubois_safari: "Wyprawa Safari do Afryki"
 je_dubois_safari_reason: "Zespół doświadczonych myśliwych i przyrodników wyruszył na safari do Afryki z zadaniem pozyskania rzadkiego okazu do naszego [concept_dubois_zoo]. Aby odnieść sukces, uczestnicy wyprawy muszą w równym stopniu polegać na sprycie, wytrwałości i metodach naukowych. Ciężkie zwierzęta wymagają licznych pułapek, a płochliwą zwierzynę trzeba tropić z wprawą. Z każdej wyprawy można przywieźć tylko jedno zwierzę."
 je_dubois_safari_goal: "Afrykańskie safari potrwa pół roku. Jeśli w tym czasie nie uda się pozyskać okazu, uczestnicy wyprawy powrócą z pustymi rękami, a ich wysiłki pójdą na marne."
 je_dubois_safari_fail: "Safari zakończyło się niepowodzeniem. Mimo miesięcy trudów i starań zespół powraca bez okazu, który byłby owocem jego pracy."
 je_dubois_dinosaur_excavation: "Wykopaliska Dinozaurów"
 je_dubois_dinosaur_excavation_reason: "Po odnalezieniu skamieniałej kości dinozaura Profesor [ROOT.Var('dubois_paleontologist_var').GetCharacter.GetLastName] rozpoczął zakrojone na szeroką skalę wykopaliska paleontologiczne. W ciągu roku, w zależności od swojego doświadczenia i przenikliwości, nasz szanowany [concept_dubois_paleontologist] może odkryć od jednego do trzech dodatkowych fragmentów skamieniałości. Po zakończeniu wyprawy możliwe jest kolejne odkrycie, co świadczy o tym, że nie wszystkie szczątki szkieletu zostały już odnalezione. Pełna rekonstrukcja wymaga pięciu kości, z których można zmontować okaz do Kolekcji Paleontologicznej."
 je_dubois_dinosaur_excavation_goal: "Po upływie dwunastu miesięcy nasz [concept_dubois_paleontologist] sporządzi oficjalne sprawozdanie z odkryć i wydobytych szczątków."
 dubois_specimen_tt: "Zgromadź co najmniej #G 50,000#! @dubois_specimen! #O Biologicznych [Concept('concept_dubois_specimen','$concept_dubois_specimens|q$')]#!—tworzących bogaty zbiór odkryć zoologicznych i botanicznych."
 notification_dubois_paleontological_report_notification_name: "Roczne Sprawozdanie Paleontologiczne"
 notification_dubois_paleontological_report_notification_desc: "Nasi [Concept('concept_dubois_paleontologist','$concept_dubois_paleontologists|q$')] odkryli w tym roku [GetPlayer.MakeScope.Var('dubois_fossils_notification_var').GetValue|0+=] nowych skamieniałości."
 notification_dubois_java_man_notification_name: "[INITIATOR_COUNTRY.GetName] odkrywa Człowieka z Jawy"
 notification_dubois_java_man_notification_desc: "[concept_dubois_paleontologist] z państwa [INITIATOR_COUNTRY.GetName] odkrył na Jawie ważny szkielet, który może pomóc odpowiedzieć na pytania dotyczące ewolucji człowieka."
 dubois.1.t: "Uroczyste Otwarcie Ogrodu Zoologicznego"
 dubois.1.d: "Uroczyste otwarcie nowego [concept_dubois_zoo] przyciągnęło tłumy ciekawskich zwiedzających, pragnących zobaczyć zgromadzoną menażerię. Ogromny entuzjazm społeczeństwa sprawił, że już teraz pojawiają się apele o budowę kolejnych wybiegów i pozyskanie nowych gatunków."
 dubois.1.f: "„Dwie noce temu widziałem, jak tygrysy wieczerzały w Exeter Change. Poza lwem Velego Paszy w Morei, który chodził za swym arabskim opiekunem niczym pies, najbardziej ubawiło mnie przywiązanie hieny do jej dozorcy. Cóż za konwersacja! — Był tam «hipopotam» o obliczu lorda Liverpoola, a «niedźwiedź wargacz» miał głos i maniery zupełnie jak mój kamerdyner — lecz tygrys zanadto się rozgadał. Słoń brał ode mnie pieniądze i mi je oddawał — zdjął mi kapelusz, otworzył drzwi, chwycił trąbą bat i zachowywał się tak dobrze, że zapragnąłem mieć go za ochmistrza. Najpiękniejszym zwierzęciem na ziemi jest jedna z tamtejszych panter; biedne antylopy jednak nie żyły. Nie zniósłbym widoku antylopy tutaj: sam widok wielbłąda sprawił, że znów zatęskniłem za Azją Mniejszą”. — Lord Byron"
 dubois.1.g: "Wspaniały początek narodowej menażerii."
 dubois.2.t: "O powstawaniu gatunków"
 dubois.2.d: "Publikując przełomową rozprawę, profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] przedstawił śmiałą nową teorię, która ma wyjaśnić samo pochodzenie gatunków poprzez procesy naturalne."
 dubois.2.f: "„Wskutek tej walki o byt każda zmiana, choćby najdrobniejsza i wynikająca z dowolnej przyczyny, jeśli tylko przynosi jakąkolwiek korzyść osobnikowi dowolnego gatunku w jego nieskończenie złożonych stosunkach z innymi istotami organicznymi i otaczającą przyrodą, będzie sprzyjać przetrwaniu tego osobnika i na ogół zostanie odziedziczona przez jego potomstwo ... Zasadę tę, dzięki której każda drobna zmiana, jeśli jest użyteczna, zostaje zachowana, nazwałem Doborem Naturalnym, aby zaznaczyć jej związek ze zdolnością człowieka do prowadzenia selekcji”. — Karol Darwin"
 dubois.2.g: "Teoria, która odmieni nauki przyrodnicze."
 dubois.2.h: "Kolejny cios zadany zabobonom przez naukę."
 dubois.3.t: "Powrót Beagle’a"
 dubois.3.d: "HMS Beagle powrócił z wieloletniej wyprawy naukowej. Statek przywiózł bogaty zbiór okazów przyrodniczych, skamieniałości, szczegółowych szkiców i danych obserwacyjnych. Wśród załogi znajdował się znany [concept_dubois_naturalist] [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName], którego wkład już teraz spotyka się z wielkim uznaniem."
 dubois.3.f: "„Podczas podróży na pokładzie HMS Beagle w charakterze przyrodnika szczególnie uderzyły mnie pewne fakty dotyczące rozmieszczenia organizmów zamieszkujących Amerykę Południową oraz geologicznych związków między obecnymi a dawnymi mieszkańcami tego kontynentu. Fakty te zdawały mi się rzucać nieco światła na pochodzenie gatunków — ową tajemnicę tajemnic, jak nazwał ją jeden z naszych najwybitniejszych filozofów”. — Karol Darwin"
 dubois.3.g: "Przełomowa podróż. Jakie odkrycia przyniesie?"
 dubois.4.t: "Kosmos"
 dubois.4.d: "Ukazało się monumentalne dzieło Alexandra von Humboldta, *Kosmos* — ambitna próba zjednoczenia nauk w ramach jednego systemu filozoficznego. Pierwotnie przedstawione w formie wykładów w Berlinie, dotarło teraz do czytelników na całym świecie, ukazując encyklopedyczny obraz przyrody i ludzkich dociekań."
 dubois.4.f: "„U schyłku pracowitego życia oddaję w ręce niemieckich czytelników dzieło, którego mglisty zarys unosił się przed moją duszą przez niemal pół wieku. Niejednokrotnie, w różnych stanach ducha, uważałem to przedsięwzięcie za niewykonalne, a gdy już je porzucałem, powracałem do niego ponownie, być może nierozważnie. Dedykuję je moim współczesnym z nieśmiałością, jaką musi budzić we mnie uzasadniona nieufność wobec własnych sił. Staram się zapomnieć, że długo wyczekiwane dzieła zazwyczaj spotykają się z mniejszą wyrozumiałością”. — Alexander von Humboldt"
 dubois.4.g: "Kamień węgielny współczesnej myśli naukowej."
 dubois.4.h: "To dzieło oświeci przyszłe pokolenia."
 dubois.5.t: "Dziedzictwo Mendla"
 dubois.5.d: "Przez długi czas niedoceniane eksperymenty opata Gregora Mendla zostały ponownie odkryte, zapoczątkowując rewolucję w badaniach nad dziedzicznością. Sformułowane przez niego proste, lecz doniosłe zasady — znane dziś jako Prawa Mendla — kładą podwaliny pod nową naukę: genetykę."
 dubois.5.f: "„Doświadczenia ze sztucznym zapylaniem, stosowanym u roślin ozdobnych w celu uzyskania nowych odmian barwnych, dały początek eksperymentom, które zostaną tutaj omówione. Uderzająca regularność, z jaką te same formy mieszańcowe pojawiały się za każdym razem, gdy krzyżowano te same gatunki, skłoniła do podjęcia dalszych doświadczeń, których celem było prześledzenie rozwoju mieszańców w kolejnych pokoleniach ich potomstwa”. — Gregor Mendel"
 dubois.5.g: "Narodziny współczesnej genetyki."
 dubois.6.t: "Odkrycie Skamieniałości na Jawie"
 dubois.6.d: "W Holenderskich Indiach Wschodnich lekarz i anatom [SCOPE.sCharacter('dubois_new_paleontologist_scope').GetFullName] odkrył skamieniałe szczątki prehistorycznego przodka człowieka, wzbudzając zarówno entuzjazm, jak i kontrowersje w środowisku naukowym."
 dubois.6.f: "Skamieniałości odkryte po raz pierwszy przez [SCOPE.sCharacter('dubois_new_paleontologist_scope').GetFullName] w 1891 roku nad rzeką Solo we wschodniej części Jawy stały się znane jako człowiek jawajski. Szczątki te, datowane na około milion lat, były pierwszymi skamieniałościami hominina odkrytymi poza Europą i drugim takim znaleziskiem po neandertalczyku. Okaz, pierwotnie sklasyfikowany jako \*Anthropopithecus\*, a następnie \*Pithecanthropus erectus\*, jest dziś powszechnie uznawany za \*Homo erectus\*, niekiedy określanego dokładniej jako \*Homo erectus javanensis\*. Jak zauważył później paleoantropolog Ralph von Koenigswald: „Żadne inne odkrycie paleontologiczne nie wywołało takiej sensacji ani nie doprowadziło do tak wielkiej różnorodności sprzecznych opinii naukowych”."
 dubois.11.t: "Nowy [concept_dubois_zoo_animal]"
 dubois.11.d: "[SCOPE.sCountry('dubois_animal_country').GetName] łaskawie wyraziło zgodę na przekazanie rzadkiego okazu, który zostanie zaprezentowany w naszym renomowanym Ogrodzie Zoologicznym."
 dubois.11.f: "Zgodnie z zasadami wymiany naukowej do Ogrodu Zoologicznego można sprowadzać tylko jedno zwierzę naraz. Po jego pozyskaniu musi upłynąć kilka tygodni na transport i aklimatyzację w nowym otoczeniu. Dopiero po należytym i godnym zaprezentowaniu nowego mieszkańca kolekcji można podjąć kolejne starania dyplomatyczne o pozyskanie dalszych okazów. Które wspaniałe zwierzę ozdobi naszą menażerię?"
