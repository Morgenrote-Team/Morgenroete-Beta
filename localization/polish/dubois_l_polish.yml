 dubois.2171.h: "Plezjozaur."
 dubois.2171.i: "Bazylozaur."
 dubois.2171.j: "Megalodon."
 dubois.2173.t: "Plezjozaur"
 dubois.2173.f: "Plezjozaury to rząd gadów morskich. Ich skamieniałości można znaleźć na całym świecie. W zależności od gatunku zwierzęta te osiągały od 1,5 do 15 metrów długości. Prawdopodobnie żywiły się różnymi zwierzętami, od ślimaków i małży po ryby i inne ofiary.\nIch szczęki w kształcie litery U oraz ostre zęby przypominające więcierz stanowiły przydatne narzędzie."
 dubois.2174.t: "Bazylozaur"
 dubois.2174.f: "Bazylozaur nie jest dinozaurem, lecz prehistorycznym waleniem. Jego wydłużone ciało przypomina węża, ale osiągając do 20 metrów długości, dorównuje rozmiarami kaszalotowi."
 dubois.2175.t: "Megalodon"
 dubois.2175.f: "Olbrzymi megalodon jest prawdopodobnie największym rekinem, jaki kiedykolwiek istniał. Oszacowanie jego długości jest jednak trudne, ponieważ dotychczas odnaleziono jedynie zęby i kręgi. Nasi paleontolodzy szacują, że mierzył od 9 do 30 metrów. Tak czy inaczej, szkielet tego rekina zapiera dech w piersiach i jest jedną z pereł naszej kolekcji."
