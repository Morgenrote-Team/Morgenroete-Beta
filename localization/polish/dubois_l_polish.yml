 dubois.1021.t: "Galerie Historii Naturalnej Azji"
 dubois.1021.d: "Azjatyckie Pawilony Ogrodu Zoologicznego urządzono z myślą o rzeczowej edukacji: drewniane kioski i pagody, lakierowane parawany oraz dyskretne motywy zdobnicze stanowią oprawę dla charakterystycznej fauny kontynentu. Dociekliwych zwiedzających zapraszamy na niespieszny spacer przez różnorodne krainy Azji."
