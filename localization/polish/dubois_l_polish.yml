 dubois.128.t: "Łoś"
 dubois.128.d: "Nasze zoo wzbogaciło się o nowe, egzotyczne zwierzę: dziś długo wyczekiwany #O Łoś#! zamieszkał na swoim nowym wybiegu."
 dubois.128.f: "Łoś europejski, w Ameryce Północnej znany jako „Moose”, jest największym przedstawicielem rodziny jeleniowatych. Te samotnicze olbrzymy zamieszkują lasy Europy i Azji. Słyną z potężnego poroża, które samce co roku zrzucają i odrastają im nowe. Łosie żywią się liśćmi, korą i roślinami wodnymi. Mimo swoich rozmiarów są zwinne i dobrze przystosowane do życia w chłodnych lasach."
 dubois.128.g: "Majestatycznie!"
