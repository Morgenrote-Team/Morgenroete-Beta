 dubois.231.t: "Rywal zniszczył Wykopaliska"
 dubois.231.d: "Dr. [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetLastName] był na tropie obiecującego złoża. Gdy jednak dotarł na miejsce, odkrył, że rywal zdążył już wykopać wiele kości, a następnie wysadził stanowisko w powietrze."
 dubois.231.f: "Jeśli ja nie mogę mieć tych Kości, nikt ich nie dostanie!"
 dubois.231.g: "Dlaczego mieliby to zrobić!"
 dubois.232.t: "Miejscowi dzielą się Informacjami"
 dubois.232.d: "Mieszkańcy niewielkiej wioski znaleźli w pobliżu rozmaite skamieliny. Chętnie podzielili się nimi z Dr. [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetLastName]. To przybliży [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetHerHim] o krok do odkrycia nowego stanowiska wykopaliskowego!"
 dubois.232.f: "Mój prapradziadek znalazł kiedyś róg jednorożca. Wiem, co se myślicie, ale moim zdaniem to była kość dinozaura! Niestety ją sprzedał. Ale powiedział mi, gdzie ją znalazł. Tam, w korycie rzeki. Na pewno znajdziecie jakieś kości nad rzeką!"
 dubois.232.g: "Dziękuję!"
 dubois.233.t: "Miejscowy Paleontolog dzieli się Badaniami"
 dubois.233.d: "Mieszkaniec niewielkiej wioski najwyraźniej również zajmuje się amatorsko paleontologią. Ponieważ [SCOPE.sCharacter('dubois_paleontologist_scope').GetFullName] jest już zbyt stary, by prowadzić wykopaliska w obiecujących miejscach, podzielił się całą swoją wiedzą z Dr. [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetLastName]."
 dubois.233.f: "Zacząłem zbierać skamieliny jako dziecko i nigdy nie przestałem. Teraz jednak jestem już zbyt stary, by klękać i samemu kopać. Mam więc nadzieję, że pomogę wam chociaż znaleźć jakieś kości dinozaurów i skamieliny. A jeśli coś znajdziecie, proszę, pokażcie mi!"
 dubois.233.g: "To niesamowita kolekcja!"
 dubois.234.t: "Osuwisko błotne zasypuje Obiecujące Stanowisko"
 dubois.234.d: "Zaledwie dzień po tym, jak Dr. [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetLastName] i [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetHerHis] zespół odkryli obiecujące stanowisko, zasypało je potężne osuwisko błotne. Odkopanie tego, co kryje się pod zwałami ziemi, zajęłoby miesiące, a nawet lata."
 dubois.234.f: "Najpierw było za gorąco, żeby kopać, potem za mokro, a teraz jest za dużo błota? Może po prostu nie lubicie kopać!"
 dubois.234.g: "Przeklęta pogoda!"
 dubois.235.t: "Nowy Trop"
 dubois.235.d: "Ciężka praca Dr. [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetLastName] zdaje się wreszcie przynosić owoce. Po zebraniu doniesień o skałach i formacjach geologicznych [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetSheHe] zlokalizował kilka obiecujących stanowisk. Miejmy nadzieję, że [GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetSheHe] znajdzie kości dinozaurów w jednym z tych miejsc."
 dubois.235.f: "Widzicie, te osady często zawierają kości dinozaurów. W tych miejscach wychodzą na powierzchnię, więc na pewno w którymś z nich znajdziemy kości! A przynajmniej mam taką nadzieję. Może."
 dubois.235.g: "Dobra robota!"
