 dubois.228.t: "Orzeł Haasta"
 dubois.228.f: "„Najpierw znaleźliśmy ogromny szpon i uznaliśmy, że należał do dinozaura, ale gdy odkrywaliśmy kolejne kości, stawało się coraz bardziej oczywiste, że był to orzeł. Na szczęście ten gatunek już wyginął, bo prawdopodobnie potrafiłby zabić człowieka”."
 dubois.228.g: "To przerażające!"
