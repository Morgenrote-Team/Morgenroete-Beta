 dubois.6.g: "Kamień milowy w odkrywaniu pochodzenia człowieka."
 ito_naturalist: "Przyrodnik"
 ito_naturalist_desc: "Uczony badacz przyrody, któremu powierzono zbieranie okazów i chwytanie żywych egzotycznych zwierząt."
 ito_naturalist_experienced: "Doświadczony Przyrodnik"
 ito_naturalist_experienced_desc: "Ten przyrodnik zdobył uznanie dzięki sumiennym badaniom terenowym i cennemu wkładowi w katalogowanie różnorodności przyrody."
 ito_naturalist_famous: "Słynny Przyrodnik"
 ito_naturalist_famous_desc: "Dzięki przełomowym wyprawom i wkładowi w filozofię przyrody postać ta należy do najbardziej cenionych uczonych epoki."
 ito_botanist: "Botanik"
 ito_botanist_desc: "Od dżungli po pustynie, od drzew po mchy, postać ta poświęcała swój czas badaniu roślin na całym świecie."
 ito_entomologist: "Entomolog"
 ito_entomologist_desc: "Po co ktokolwiek miałby badać robaki? Cóż, ta postać właśnie to robi i stała się specjalistą w tej dziedzinie."
 ito_marine_biologist: "Biolog Morski"
 ito_marine_biologist_desc: "Ach, morze! Czyż nie byłoby wspaniale spędzić tam całe życie? Może tylko nie jako marynarz. Ta postać może poświęcić życie badaniu wszelkich morskich form życia. Cóż za wspaniałe życie!"
 ito_zoologist: "Zoolog"
 ito_zoologist_desc: "Zwierzęta są niezwykłe! Są fascynujące! A ta postać chce poznać je wszystkie!"
