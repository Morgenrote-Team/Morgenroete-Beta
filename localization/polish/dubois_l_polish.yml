 alert_dubois_paleontologist_unused_alert_hint: "Twój [concept_dubois_paleontologist] jest obecnie bezczynny i można przydzielić mu zadanie. Rozważ uzyskanie dostępu do [concept_dubois_formation] za pomocą [concept_mr_research_charter], jeśli nie masz dostępu do żadnej formacji, lub przydziel mu inne zadanie. Możesz go wysłać, korzystając z Przeglądu Akademickiego w #V Oknie Morgenröte#!."
 dubois.39.d: "Po tygodniach nieudanych prób i nieustannych wysiłków wreszcie udało się schwytać tak długo wyczekiwane zwierzę. Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] nie posiada się z radości. Bohaterowie wracają do domu ze swoją zdobyczą. Z pewnością zwierzę będzie szczęśliwsze w przyjemnym Narodowym Zoo państwa [ROOT.GetCountry.GetNameNoFlag] niż na tym niewygodnym łonie natury!"
 dubois_cretaceous_scenery_modifier: "Prehistoryczna Diorama: Kreda"
 dubois_jurassic_scenery_modifier: "Prehistoryczna Diorama: Jura"
 dubois_triassic_scenery_modifier: "Prehistoryczna Diorama: Trias"
