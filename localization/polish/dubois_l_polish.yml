 dubois.149.d: "Nasze zoo wzbogaciło się o nowe, egzotyczne zwierzę: dziś długo wyczekiwany #O Manul#! zamieszkał na swoim nowym wybiegu."
 dubois.149.f: "Manul to niewielki dziki kot zamieszkujący tereny trawiaste i górskie obszary Azji Środkowej. Słynie z gęstego, puszystego futra i krępej budowy, dzięki którym jest dobrze przystosowany do zimnego klimatu. Manule są samotnikami i trudno je dostrzec. Często kryją się w szczelinach skalnych lub norach, by uniknąć drapieżników. Polują głównie na drobne ssaki, takie jak gryzonie, a także na ptaki, wykorzystując doskonały wzrok i umiejętność skradania się."
 dubois.149.g: "Przepiękne!"
