 dubois.443.f: "Mężczyźni od godziny czekali na uczonego, który zatrzymał się gdzieś na zboczu i nagle wyciągnął [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis] narzędzia. Początkowo kręcili głowami, lecz potem postanowili połączyć nieprzyjemne z pożytecznym i wcześniej zjeść posiłek, by nie tracić niepotrzebnie czasu. Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] nie zamierzał jednak ani jeść, ani do nich dołączyć. Gdy kierownik zagroził, że wyprawa ruszy dalej bez geologa, [ROOT.Var('agassiz_geologist_var').GetCharacter.GetSheHe] nagle wrócił do grupy z lśniącym kamieniem w [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis] dłoni, którego piękno zachwyciło wszystkich [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis] kolegów."
