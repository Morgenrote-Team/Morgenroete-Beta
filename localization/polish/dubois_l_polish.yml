 dubois.31.l: "Podążaj za Gorylem"
 dubois.32.t.gorilla_1: "Silny Goryl"
 dubois.32.t.gorilla_2: "Drugie spotkanie z Gorylem"
 dubois.32.t.gorilla_3: "Kolejny Goryl"
 dubois.32.f.gorilla.1: "W spowitych mgłą górskich lasach głębokie, donośne odgłosy uderzeń w pierś niosą się przez gęste poszycie, przyprawiając o dreszcz każde stworzenie, do którego docierają. Tam, pośród wiekowych drzew, srebrnogrzbiety goryl oznajmia swoją obecność. Potężny i groźny, jest zarazem obrońcą i przywódcą stada. Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] z podziwem obserwuje, jak wielka małpa zaznacza swoją dominację, przewodząc rodzinie z gracją, która zdaje się przeczyć jej ogromnej sile. Przyrodnik, rozdarty między podziwem a obowiązkiem, przygotowuje sprzęt, wiedząc, że schwytanie tego majestatycznego stworzenia do zoo może być jego najtrudniejszym dotąd zadaniem."
 dubois.32.f.gorilla.2: "Gdy słońce zaczyna zachodzić za górskim horyzontem, dżungla ożywa odgłosami przyrody. Spod gęstego sklepienia koron drzew wyłania się rodzina goryli, poruszających się niespiesznie i zdecydowanie. Najmłodszy z nich kurczowo trzyma się grzbietu matki, a pochód zamyka potężny srebrnogrzbiety samiec, czujnie wypatrujący wszelkich oznak niebezpieczeństwa. Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] wstrzymuje oddech, obserwując przez lornetkę tę rzadką, ulotną scenę z życia szlachetnych stworzeń. Myśl o rozdzieleniu takiej rodziny ciąży mu na sercu, lecz naciski patronów zoo nie pozostawiają mu wielkiego wyboru. Musi działać, nawet jeśli oznacza to zakłócenie harmonii dżungli."
 dubois.32.f.gorilla.3: "Głęboko w sercu lasu deszczowego, gdzie powietrze przesyca zapach ziemi i nawoływania niewidocznych stworzeń, goryle mają swój dom. Potężny srebrnogrzbiety samiec, o futrze przetykanym srebrem i mądrym, przenikliwym spojrzeniu, jest niekwestionowanym przywódcą stada. W ogromnych dłoniach delikatnie tuli młodego goryla, okazując czułość rzadko widywaną u tak silnej istoty. Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] obserwuje tę intymną chwilę z oddali, rozdarty stojącym przed nim dylematem moralnym. Patroni zoo oczekują rezultatów, lecz gdy przygląda się złożonym więziom społecznym łączącym te niezwykłe zwierzęta, zaczyna się zastanawiać, czy jakakolwiek klatka mogłaby naprawdę uwięzić ducha dzikiej przyrody."
 dubois.33.d.gorilla: "Podczas poszukiwań #O Goryla#! uczestnicy naszego safari natknęli się na niezwykłą roślinność. Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] skłania się ku zrobieniu przerwy."
 dubois.34.d.gorilla: "Safari, którego celem było schwytanie # O Goryla#!, musi zostać przerwane. Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] zaginął!"
 je_dubois_safari_gorilla: "Afrykańskie Safari: Goryl"
 je_dubois_safari_gorilla_reason: "Podczas afrykańskiego safari można dzięki wytrwałemu tropieniu i zastawianiu pułapek schwytać duże zwierzęta, a następnie przetransportować je do [concept_dubois_zoo]. Podczas jednego safari można schwytać tylko jedno zwierzę. To, czy należy zastawiać pułapki, czy podążać tropem zwierzęcia, zależy od jego gatunku. Z reguły duże, powolne zwierzęta wymagają większej liczby pułapek, a szybkie — intensywniejszego tropienia. Safari trwa 300 dni. Jeśli do tego czasu nie uda się schwytać zwierzęcia, uczestnicy safari opuszczą kraj z pustymi rękami.\n\nAgresywne zwierzęta mogą się bronić i atakować podczas prób schwytania. Płochliwe zwierzęta uciekają. [concept_dubois_naturalist] z cechą Zoolog potrafi rozwiązać takie sytuacje bez negatywnych konsekwencji. Nowe technologie, takie jak #ORANGE Karabin Maszynowy#! czy #ORANGE Silnik Spalinowy#!, ułatwiają tropienie i chwytanie zwierząt."
 dubois.228.d: "Kto by się spodziewał, że tak majestatyczny orzeł pochodził właśnie z Nowej Zelandii? Prof. [SCOPE.sCharacter('dubois_paleontologist_scope').GetLastName] znalazł liczne kości olbrzymiego orła, którego imponująca rozpiętość skrzydeł wynosiła 2.6 metra (8 stóp i 6 cali). Profesor [SCOPE.sCharacter('dubois_paleontologist_scope').GetLastName] przypuszcza, że ptak ten mógł dać początek maoryskiej legendzie o Pouākai."
