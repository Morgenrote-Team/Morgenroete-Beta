 dubois_nature_protection_tech_desc: "Ochrona Przyrody zrodziła się z potrzeby ochrony lasów. Później objęto nią również zagrożone gatunki zwierząt i całe obszary. W XIX i XX wieku z powodzeniem zrealizowano różne przedsięwzięcia służące ochronie przyrody, takie jak przywrócenie koziorożca alpejskiego w szwajcarskich Alpach."
