 dubois.1020.t: "Wybieg Goryli"
 dubois.1020.d: "Wybieg goryli wyróżniał się bujną roślinnością i dużymi konstrukcjami do wspinaczki. Od razu rzucało się w oczy kilka tych imponujących naczelnych, poruszających się z gracją wśród gęstego listowia. Niektóre wspinały się po linach, inne odpoczywały w cieniu. Ich potężna budowa i spokojne usposobienie sprawiały, że trudno było oderwać od nich wzrok."
 dubois.1020.f1: "Na bujnie porośniętym wybiegu goryli dominujący srebrnogrzbiety samiec siedzi majestatycznie na dużej skale, czujnie obserwując swoją grupę. Jego spokój i władcza postawa od razu przyciągają uwagę zwiedzających. Zaciekawiony strukturą społeczną goryli, podchodzisz do opiekuna zwierząt, by dowiedzieć się więcej.\n„Goryle są bardzo towarzyskimi zwierzętami” — wyjaśnia opiekun. „Srebrnogrzbiety samiec jako przywódca stada odgrywa kluczową rolę w utrzymywaniu porządku i ochronie grupy. Każdy członek stada pełni określone funkcje, a do obowiązków przywódcy należą podejmowanie decyzji o przemieszczaniu się i reagowanie na zagrożenia. Spójność grupy i jego przywództwo są niezbędne dla ich dobrostanu”."
 dubois.1020.f2: "Na wybiegu goryli młody osobnik energicznie wspina się i huśta na linach oraz gałęziach, podczas gdy starsi członkowie grupy obserwują go z dołu. Jego figle przyciągają uwagę zwiedzających. Chcąc dowiedzieć się więcej o tym zachowaniu, pytasz opiekuna zwierząt.\n„Młode goryle są niezwykle aktywne i skore do zabawy” — opowiada opiekun. „Wspinanie się i huśtanie pomagają im rozwijać sprawność fizyczną potrzebną w dorosłym życiu. Te zajęcia pobudzają również ich umysł i wzmacniają więzi z innymi członkami stada. Zabawa jest niezbędna dla ich rozwoju, pomaga im nabierać sił i uczy życia w grupie”."
 dubois.1020.f3: "Na wybiegu goryli grupa zgromadziła się wokół dużego stosu owoców i warzyw. Zwierzęta jedzą i dzielą się pożywieniem. Obserwowanie, jak zgodnie współpracują podczas posiłku, jest fascynujące. Chcąc dowiedzieć się więcej o tych zachowaniach społecznych, podchodzisz do opiekuna zwierząt.\n„Goryle słyną ze spokojnego i zgodnego spożywania posiłków” — wyjaśnia opiekun. „Często jedzą razem i dzielą się pożywieniem w obrębie grupy, co wzmacnia więzi społeczne i zapewnia wszystkim wystarczającą ilość pokarmu. Takie wspólnotowe zachowanie jest ważnym elementem ich struktury społecznej, sprzyja harmonii i ogranicza rywalizację między członkami grupy”."
