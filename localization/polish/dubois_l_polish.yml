 dubois.1069.t: "Wybieg Kapibar"
 dubois.1069.d: "Wybieg kapibar obejmował bujnie porośnięty trawą teren wokół dużego stawu. Od razu rzucało się w oczy kilka tych dużych, łagodnych gryzoni odpoczywających nad brzegiem, podczas gdy inne niespiesznie brodziły w płytkiej wodzie. Ich spokojne usposobienie i silne więzi w grupie natychmiast przyciągały uwagę zwiedzających."
 dubois.1069.f1: "Na wybiegu kapibar, rozświetlonym plamami słońca, niewielka grupa tych dużych gryzoni odpoczywa nad brzegiem wody. Niektóre leniwie skubią trawę, inne wylegują się w cieniu. Ich spokojne, towarzyskie zachowanie od razu przyciąga uwagę zwiedzających. Zaciekawiony ich trybem życia, podchodzisz do opiekuna zwierząt, by dowiedzieć się więcej.\n„Kapibary są niezwykle towarzyskimi zwierzętami” — wyjaśnia opiekun. „Żyją w grupach liczących niekiedy 20 lub więcej osobników i rzadko widuje się je samotnie. Silne więzi społeczne mają kluczowe znaczenie dla ich przetrwania, zapewniając ochronę przed drapieżnikami i pomagając utrzymać zwartą strukturę rodzinną. Porozumiewają się za pomocą rozmaitych dźwięków, w tym pomruków i gwizdów, by pozostawać ze sobą w kontakcie”."
 dubois.1069.f2: "Na tętniącym życiem wybiegu kapibar jeden szczególnie śmiały osobnik wchodzi do stawu, zanurzając się aż po nos. Pozostałe idą w jego ślady, radośnie pluskając się w wodzie. Widok tych dużych gryzoni z upodobaniem oddających się kąpieli urzeka obserwatorów. Zaintrygowany tym zachowaniem, pytasz opiekuna zwierząt o szczegóły.\n„Kapibary prowadzą ziemnowodny tryb życia i doskonale pływają” — opowiada opiekun. „Spędzają dużo czasu w wodzie, co pomaga im regulować temperaturę ciała i uciekać przed drapieżnikami. Potrafią nawet spać w wodzie, wystawiając nad powierzchnię jedynie nosy. To zamiłowanie do wody jest istotnym elementem ich naturalnego zachowania. Właśnie w niej czują się najlepiej”."
 dubois.1069.f3: "Gdy obserwujesz grupę kapibar na wybiegu, twoją uwagę przyciąga nagłe poruszenie. Jedna z młodszych kapibar znalazła kępę wyjątkowo smacznej trawy i z zapałem ją skubie, zachęcając pozostałe, by zgromadziły się wokół i dołączyły do posiłku. Widok wspólnie jedzących zwierząt chwyta za serce, więc postanawiasz dowiedzieć się więcej od opiekuna.\n„Kapibary są roślinożerne i spędzają wiele czasu, wspólnie się pasąc” — wyjaśnia opiekun. „Ich dieta składa się głównie z traw i roślin wodnych, którymi chętnie się dzielą. Mają wyjątkowy układ pokarmowy, pozwalający im wydobyć jak najwięcej składników odżywczych z pokarmu bogatego we włókno. Często trawią go ponownie, by uzyskać wszystkie potrzebne substancje odżywcze. Wspólne posiłki wzmacniają ich silne więzi społeczne i pomagają utrzymać zgodę w grupie”."
