 dubois.1011.t: "Galerie Historii Naturalnej Afryki"
 dubois.1011.d: "Wejdź do Afrykańskich Pawilonów Ogrodu Zoologicznego, gdzie starannie zaaranżowane siedliska i subtelne stylizacje architektoniczne przywodzą na myśl zróżnicowane krajobrazy kontynentu. Wybiegi te, zaprojektowane pod okiem uczonych przyrodników, dają dociekliwym zwiedzającym sposobność obserwowania charakterystycznej fauny sawann, rzek i wybrzeży w warunkach sprzyjających nauce i zachowaniu stosownej powagi."
