l_polish:
 matsuura.101.t: "Młody mężczyzna chce udać się na Ezo"
 matsuura.101.d: "[SCOPE.sCharacter('character_1_scope').GetFullName] to młody mężczyzna, który chce udać się na położoną na północy wyspę Ezo. Władze domeny Matsumae wprowadziły jednak ograniczenia w podróżowaniu. Czy należy pozwolić młodzieńcowi wyruszyć na wyprawę na północne wyspy?"
 matsuura.101.f: "„Chcę podróżować wszędzie! Ezo, Morokoshi, Tenjiku! Proszę, pozwólcie mi zobaczyć cuda świata!”"
 matsuura.101.g: "Mógłby tam badać krajobraz!"
 matsuura.101.h: "Słyszałem, że jest poetą. Może podróże staną się dla niego inspiracją?"
 matsuura.101.i: "Może mógłby namalować obrazy przedstawiające ten region?"
 matsuura.101.j: "Nikomu nie wolno wyjechać."
 matsuura_allowed_travels_modifier: "Zezwolono na podróż do Ezo"
 matsuura.102.t: "Zachodnia Chemia"
 matsuura.102.d: "[SCOPE.sCharacter('character_1_scope').GetFullName] od lat zgłębia Rangaku, czyli naukę zachodnią. Teraz zamierza napisać książkę o czymś zwanym „Chemią”. Może warto go wesprzeć."
 matsuura.102.f: "„Widzisz, człowiek z dalekiej krainy przeprowadzał eksperymenty...”\n„Chcesz wiedzieć, czym są eksperymenty? Jeśli masz teorię...”\n„Och, nie wiesz też, czym jest teoria...”"
 matsuura.102.g: "Czym jest ta \"Chemia\" o której on mówi?"
 matsuura.102.h: "Barbarzyńskie idee!"
 matsuura_barbarian_ideas_modifier: "Barbarzyńskie Idee"
 matsuura_nintendo_modifier: "Karty Hanafuda Nintendo"
 matsuura.103.t: "Nintendo"
 matsuura.103.d: "W Kioto Fusajirō Yamauchi założył fabrykę kart do gry, zajmującą się wyłącznie produkcją popularnych kart Hanafuda. Firma szybko zdobyła pozycję lidera na rynku w całej Japonii. Jej nazwa to Nintendo."
 matsuura.103.f: "„Rozsiądź się wygodnie, przyjacielu,\nDzisiejsza lekcja nie potrwa długo.\nA żeby było trochę ciekawiej,\nZaśpiewam ci ją po nerdowsku.\nJest rok 1889 — do sławy i nagród jeszcze daleko,\nOd wyrobu kart Hanafuda zaczyna Nintendo.\n\nPrzez sto lat firma rosła, szukając tego, co się sprzeda,\nOd odkurzaczy i Ultra Hand po testery miłości i miłosne hotele.\nWkrótce Nintendo stawia na gry — Game & Watch i Color TV,\nW osiemdziesiątym pierwszym tworzy Donkey Kong — a co dalej, wiesz i ty!\n\nOto historia Nintendo,\nOd kart Hanafuda aż po Mario,\nProsto z Kioto, z gościem zwanym Miyamoto —\nOto historia Nintendo!”\n\n– Matthew Taranto"
 matsuura.103.g: "Czy istnieją gry, które mogłyby być popularniejsze od kart Hanafuda?"