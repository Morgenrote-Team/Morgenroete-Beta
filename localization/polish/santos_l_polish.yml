 santos.681.t: "Puchar Gordona Bennetta"
 santos.681.d: "Przygotowania do pierwszego wielkiego międzynarodowego wyścigu balonowego idą pełną parą. Baloniarze z całego świata gromadzą się w [ROOT.GetCountry.GetCapital.GetCityHubName], aby zmierzyć się w rywalizacji długodystansowej. Wydarzenie już teraz zyskuje status legendarnego i będzie kontynuowane w kolejnych latach."
 santos.681.f: "„Przed żadnym wcześniejszym lotem nie otrzymałem na pożegnanie tylu dobrych życzeń i nigdy wcześniej nie poczyniłem tylu przygotowań co do tego lotu o Puchar Gordona Bennetta w 1907 roku. Wkrótce po zakończeniu wyścigu z Paryża we wrześniu 1906 roku zapragnąłem wziąć udział w tegorocznych zawodach. Dziękuję Niemieckiemu Związkowi Żeglugi Powietrznej za wybranie mnie na swojego przedstawiciela, a także baronowi von Hewaldowi i kapitanowi Hildebrandtowi, którzy oddali do mojej dyspozycji swój wielki balon POMMERN. To dzięki nim mogłem odnieść tegoroczne zwycięstwo.\n\nPodczas tego lotu Ameryka Północna wywarła na mnie jak najlepsze wrażenie zarówno pod względem warunków do lotów balonowych, jak i gościnności. Żałuję jedynie, że kraj ten nie był jeszcze większy, abym mógł wykorzystać pełny zasięg mojego balonu i pobić światowy rekord odległości”. -Oscar Erbslöh"
 santos.681.g: "Wspaniale!"
