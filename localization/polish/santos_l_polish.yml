 santos.655.d1: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] próbował utrzymać się w powietrzu jak najdłużej przy użyciu [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] balonu. Osiągając czas lotu wynoszący #b #n [ROOT.Var('new_balloon_time_var').GetValue]#! godzin#!, [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] nie zdołał pobić dotychczasowego rekordu naszego kraju wynoszącego #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! godzin#!. [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe|U] z pewnością spróbuje ponownie."
 santos.655.d2: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] ustanowił nowy krajowy rekord długości lotu przy użyciu [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] balonu! Utrzymując się w powietrzu przez #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! godzin#!, [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] pobił dotychczasowy rekord naszego kraju wynoszący #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! godzin#!. Niestety nie wystarczyło to do pobicia rekordu świata wynoszącego #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! godzin#! [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon]."
 santos.655.d3: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] ustanowił nowy światowy rekord długości lotu przy użyciu [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] balonu! Utrzymując się w powietrzu przez #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! godzin#!, [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] zdołał pobić dotychczasowy rekord naszego kraju wynoszący #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! godzin#! i wyraźnie przewyższyć rekord świata wynoszący #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! godzin [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon].#!"
 santos.655.f1: "„Tym razem mi się nie udało. Ale następnym razem na pewno dam radę!”"
 santos.655.f2: "„Kogo obchodzi taki rekord? Chcę rekordu świata!”"
 santos.655.f3: "„To była bułka z masłem!”"
 santos.655.g: "Powodzenia następnym razem!"
 santos.655.h: "Dobra robota!"
 santos.655.i: "Wspaniale! Gratulacje!"
 santos.656.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] boi się wysokości i rezygnuje z baloniarstwa"
 santos.656.d: "Chociaż twierdził, że odbył już całkiem sporo lotów balonem, [SCOPE.sCharacter('santos_balloonist_scope').GetFullName] odkrył, że boi się wysokości, gdy podczas swojego pierwszego lotu dla naszego kraju znalazł się na wysokości dziesięciu metrów. Dlatego rezygnuje z baloniarstwa."
 santos.656.f: "„To straszne! Dwa tygodnie temu latałem na ogromnych wysokościach, a teraz... Teraz nie potrafię nawet wejść po drabinie!”"
 santos.656.g: "Co za pech..."
 santos.656.h: "Argh! Czy jest jeszcze jakiś baloniarz, którego moglibyśmy sponsorować?"
 santos.670.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] ginie w wypadku balonowym"
 santos.670.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] rozbił się podczas [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] lotu balonem i zginął. Tym samym tracimy bohatera lotnictwa."
 santos.670.f: "[SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloonist_death_type')]"
 santos.670.g: "Jakie to straszne!"
 santos.670.h: "Straszne! Czy jest jeszcze jakiś baloniarz, którego moglibyśmy sponsorować?"
 santos.671.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] jest teraz doświadczonym baloniarzem"
 santos.671.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] odbył już wiele lotów balonem i zdobył duże doświadczenie w baloniarstwie. Jest teraz uznawany za doświadczonego baloniarza, który wie, co robi."
 santos.671.f: "„Nie bójcie się! Robiłem to już dziesiątki razy!”"
 santos.671.g: "Dobrze to słyszeć!"
 santos.672.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] jest teraz Sławnym Baloniarzem"
 santos.672.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] odbył już setki lotów balonem, podczas których pobił także kilka rekordów. Obecnie jest już sławny, i to nie tylko w naszym kraju."
 santos.672.f: "„[SCOPE.sCharacter('santos_balloonist_scope').GetFullName]? Czy to nie ten baloniarz? Naprawdę chcę go poznać!”"
 santos.672.g: "Wspaniale!"
 santos.673.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] trafiony przez kometę podczas lotu"
 santos.673.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] został trafiony przez kometę podczas lotu balonem i zginął."
 santos.673.f: "Krótko po starcie balonem [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] rozległ się głośny huk. Ludzie na ziemi zobaczyli błysk światła przecinający niebo i uderzający prosto w kosz [SCOPE.sCharacter('santos_balloonist_scope').GetFullName]. Balon stanął w płomieniach i runął w dół. Po usunięciu szczątków odnaleziono ciało [SCOPE.sCharacter('santos_balloonist_scope').GetFullName]. Jedynie nasi astronomowie byli zadowoleni z tego wydarzenia, ponieważ mogli zbadać pozostałości komety."
 santos.673.g: "Gdyby tylko [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] miał choć odrobinę zdrowego rozsądku(comet sense*)..."
 santos.673.h: "O kometo, diabelski pomiocie... Czy jest jeszcze jakiś baloniarz, którego moglibyśmy sponsorować?"
 santos.674.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] rozbił się i zginął podczas lotu balonem nad plażą"
 santos.674.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] rozbił się na plaży podczas lotu balonem i zginął. Co dziwne, na wraku balonu znaleziono wieloryba."
 santos.674.f: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] leciał wzdłuż plaży podczas pięknego dnia. Ponieważ [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] nie wrócił, wysłano ekipy poszukiwawcze. Po krótkim czasie odnaleziono wrak. Co dziwne, balon i kosz znaleziono pod szczątkami mocno zmiażdżonego wieloryba. Alkoholik z pobliskiej wioski twierdził, że widział spadającego wieloryba i doniczkę z petunią oraz że wieloryb trafił prosto w balon. Oczywiście nikt nie dał wiary tej historii. Co ciekawe, w pobliżu znaleziono nienaruszoną doniczkę z petunią. Petunia wyglądała na nieco zmarnowaną i została powierzona fachowej opiece miejscowego botanika.\n\n[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] zostanie zapamiętany za swoje złote serce i zdolność zachowania spokoju w każdej sytuacji."
 santos.674.g: "O nie! Tylko nie znowu!"
 santos.674.h: "Halo, Ziemia! Czy jest jeszcze jakiś baloniarz, którego moglibyśmy sponsorować?"
 santos.676.t: "Nasz baloniarz zmarł"
 santos.676.d: "Po dziesięcioleciach spędzonych jako [concept_santos_balloonist] nasz były #b #r Baloniarz#!#! zmarł. Czy kiedykolwiek uda nam się zastąpić tak niezwykłego odkrywcę?"
 santos.691.t: "Typ Balonu"
 santos.691.d: "Zmień typ swojego balonu. Przebudowa potrwa pół roku. W tym czasie balon będzie wyłączony z użytku."
 santos.691.f: "Każdy wyspecjalizowany balon zapewnia premię w wysokości 5 procent w dziedzinie, od której pochodzi jego nazwa, oraz karę w wysokości -5 procent w pozostałych. Przykład: Balon odległościowy zapewnia #G +5%#! do #V Odległości#!, ale #R -5#! do #V Wysokości#! i #R -5#! do #V Czasu#!. Balon uniwersalny nie posiada ani zalet, ani wad."
 santos.691.g: "Potrzebujemy Balonu Wysokościowego."
 santos.691.h: "Odległość jest najważniejsza."
 santos.691.i: "Czas jest wszystkim!"
 santos.691.j: "Dobry Balon Uniwersalny wystarczy"
 santos.691.k: "Nieważne."
