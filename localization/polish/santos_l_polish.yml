 santos_balloon_crossing_event_favorable_weather_icon_flag: "@curtiss_event_log_favorable_conditions_positive_icon!"
 santos_balloon_crossing_event_favorable_weather_title_flag: "Sprzyjająca Pogoda"
 santos_balloon_crossing_event_favorable_weather_flag: "#t $santos_balloon_crossing_event_favorable_weather_title_flag$#!\nSłońce świeci, a wiatr sprzyja. Balon posuwa się naprzód szybciej, niż się spodziewano."
 santos_balloon_crossing_event_wind_shear_icon_flag: "@santos_event_log_positive_wind_shear_icon!"
 santos_balloon_crossing_event_wind_shear_title_flag: "Uskok Wiatru"
 santos_balloon_crossing_event_wind_shear_flag: "#t $santos_balloon_crossing_event_wind_shear_title_flag$#!\nWiatr zmienił kierunek na korzyść baloniarza. Balon niemal sunie po niebie!\n\n#b Następujące czynniki zwiększają prawdopodobieństwo takiego wyniku:#!\n[concept_santos_balloonist] ma cechę charakteru: $santos_balloonist_experienced$, $santos_balloonist_hero$ lub $ambitious$ [concept_character_trait].#!"
 santos_balloon_crossing_event_balloonist_maneuver_icon_flag: "@santos_event_log_positive_balloonist_maneuver_icon!"
 santos_balloon_crossing_event_balloonist_maneuver_title_flag: "Manewr Baloniarza"
 santos_balloon_crossing_event_balloonist_maneuver_flag: "#t $santos_balloon_crossing_event_balloonist_maneuver_title_flag$#!\nBaloniarz wykonał śmiały manewr, dzięki któremu balon znalazł się w doskonałym położeniu i mógł pokonać maksymalny dystans.\n\n#b Następujące czynniki zwiększają prawdopodobieństwo takiego wyniku:#!\n[concept_santos_balloonist] ma cechę charakteru: $santos_balloonist_experienced$, $santos_balloonist_hero$ lub $ambitious$ [concept_character_trait].#!"
 santos_balloon_crossing_event_cautious_flight_icon_flag: "@santos_event_log_positive_cautious_flight_icon!"
 santos_balloon_crossing_event_cautious_flight_title_flag: "Ostrożny Lot"
 santos_balloon_crossing_event_cautious_flight_flag: "#t $santos_balloon_crossing_event_cautious_flight_title_flag$#!\nBaloniarz unika wszelkiego niepotrzebnego ryzyka.\n\n#b Następujące czynniki zwiększają prawdopodobieństwo takiego wyniku:#!\n[concept_santos_balloonist] ma cechę charakteru $cautious$ [concept_character_trait].#!"
 santos_balloon_crossing_event_unfavorable_weather_icon_flag: "@santos_event_log_negative_unfavorable_weather_icon!"
 santos_balloon_crossing_event_unfavorable_weather_title_flag: "Niesprzyjająca Pogoda"
 santos_balloon_crossing_event_unfavorable_weather_flag: "#t $santos_balloon_crossing_event_unfavorable_weather_title_flag$#!\nNiekorzystne warunki pogodowe utrudniają lot balonem bardziej, niż się spodziewano."
 santos_balloon_crossing_event_confusing_situation_icon_flag: "@santos_event_log_negative_confusing_situation_icon!"
 santos_balloon_crossing_event_confusing_situation_title_flag: "Dezorientująca Sytuacja"
 santos_balloon_crossing_event_confusing_situation_flag: "#t $santos_balloon_crossing_event_confusing_situation_title_flag$#!\nZachmurzenie, mroźne noce i ogólna niepewność utrudniają przelot balonem.\n\n#b Następujące czynniki zwiększają prawdopodobieństwo takiego wyniku:#!\n[concept_santos_balloonist] ma cechę charakteru $reckless$, $wrathful$, $arrogant$ [concept_character_trait] lub #V negatywną cechę stanu, taką jak choroba lub uzależnienie#!.#! "
 santos_balloon_crossing_event_dangerous_fog_icon_flag: "@santos_event_log_negative_dangerous_fog_icon!"
 santos_balloon_crossing_event_dangerous_fog_title_flag: "Niebezpieczna Mgła"
 santos_balloon_crossing_event_dangerous_fog_flag: "#t $santos_balloon_crossing_event_dangerous_fog_title_flag$#!\nGęstniejąca mgła sprawia, że lot balonem staje się coraz bardziej niebezpieczny!\n\n#b Następujące czynniki zwiększają prawdopodobieństwo takiego wyniku:#!\n[concept_santos_balloonist] ma cechę charakteru $reckless$, $wrathful$, $arrogant$ [concept_character_trait] lub #V negatywną cechę stanu, taką jak choroba lub uzależnienie#!.\n\n#b Następujące czynniki zmniejszają prawdopodobieństwo takiego wyniku:#!\n[concept_santos_balloonist] ma cechę charakteru $curie_meteorological_physicist$ [concept_character_trait] lub posiada [concept_curie_meteorological_physicist].#!"
 santos_balloon_crossing_event_violent_storm_icon_flag: "@santos_event_log_negative_wind_icon!"
 santos_balloon_crossing_event_violent_storm_title_flag: "Gwałtowna Burza"
 santos_balloon_crossing_event_violent_storm_flag: "#t $santos_balloon_crossing_event_violent_storm_title_flag$#!\nBurza lub silne wiatry na dużej wysokości mogą poważnie zagrozić balonowi!\n\n#b Następujące czynniki zmniejszają prawdopodobieństwo takiego wyniku:#!\n[concept_santos_balloonist] ma cechę charakteru $curie_meteorological_physicist$ [concept_character_trait] lub posiada [concept_curie_meteorological_physicist].#!"
 santos_balloon_crossing_event_balloonist_error_icon_flag: "@santos_event_log_negative_balloonist_error_icon!"
 santos_balloon_crossing_event_balloonist_error_title_flag: "Błąd Baloniarza"
 santos_balloon_crossing_event_balloonist_error_flag: "#t $santos_balloon_crossing_event_balloonist_error_title_flag$#!\nBaloniarz spowodował problemy podczas samej Wyprawy Balonowej z powodu błędu w pilotażu.\n\n#b Następujące czynniki zwiększają prawdopodobieństwo takiego wyniku:#!\n[concept_santos_balloonist] ma cechę charakteru $reckless$, $wrathful$ lub $arrogant$ [concept_character_trait].\n\n#b Następujące czynniki zmniejszają prawdopodobieństwo takiego wyniku:#!\n[concept_santos_balloonist] ma cechę charakteru $santos_balloonist_experienced$ [concept_character_trait].#!"
 santos_balloon_crossing_event_altitude_sickness_icon_flag: "@santos_event_log_negative_altitude_sickness_icon!"
 santos_balloon_crossing_event_altitude_sickness_title_flag: "Choroba Wysokościowa"
 santos_balloon_crossing_event_altitude_sickness_flag: "#t $santos_balloon_crossing_event_altitude_sickness_title_flag$#!\nBaloniarz przekroczył krytyczną wysokość 7,000 metrów i odczuwa w związku z tym ostre skutki niedoboru tlenu.\n\n#b Następujące czynniki zmniejszają prawdopodobieństwo takiego wyniku:#!\nKraj [GetPlayer.GetName] ma zbadaną technologię [GetTechnology('electric_arc_process').GetName].#!"
 santos_balloon_crossing_event_the_pampero_icon_flag: "@santos_event_log_negative_wind_icon!"
 santos_balloon_crossing_event_the_pampero_title_flag: "Pampero"
 santos_balloon_crossing_event_the_pampero_flag: "#t $santos_balloon_crossing_event_the_pampero_title_flag$#!\nPampero, słynny gwałtowny i nagły wiatr wiejący nad Río de la Plata, dopadł balon!\n\n#b Następujące czynniki zmniejszają prawdopodobieństwo takiego wyniku:#!\n[concept_santos_balloonist] ma cechę charakteru $curie_meteorological_physicist$ [concept_character_trait] lub posiada [concept_curie_meteorological_physicist].#!"
 santos_balloon_crossing_event_wind_calm_icon_flag: "@santos_event_log_negative_wind_calm_icon!"
 santos_balloon_crossing_event_wind_calm_title_flag: "Cisza Wiatrowa"
 santos_balloon_crossing_event_wind_calm_flag: "#t $santos_balloon_crossing_event_wind_calm_title_flag$#!\nNie wieje nawet najlżejszy wiatr. Balon praży się w palącym słońcu.\n\n#b Następujące czynniki zwiększają prawdopodobieństwo takiego wyniku:#!\n[concept_santos_balloonist] ma cechę charakteru $reckless$, $wrathful$ lub $arrogant$ [concept_character_trait].#!"
