 santos_distance_description_distance_record_country: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] ustanowił nowy rekord odległości naszego kraju przy użyciu [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] balonu! Pokonując odległość #b #p [ROOT.Var('new_balloon_distance_var').GetValue]#! kilometrów#!, [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] zdołał wyraźnie przewyższyć dotychczasowy rekord naszego kraju wynoszący #b #p [ROOT.Var('santos_balloon_distance_record_var').GetValue]#! Kilometrów#!. Niestety nie wystarczyło to do pobicia rekordu świata wynoszącego #b #p [GetGlobalVariable('santos_balloon_distance_record_global_var').GetValue]#! kilometrów#! [GetGlobalVariable('santos_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon]. Czas lotu wynoszący #b #n [ROOT.Var('new_balloon_time_var').GetValue]#! godzin#! również niestety nie wystarczył do pobicia naszego rekordu krajowego wynoszącego #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! godzin#!"
 santos_distance_description_time_record_country: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] ustanowił nowy rekord długości lotu naszego kraju przy użyciu [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] balonu! Utrzymując się w powietrzu przez #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! godzin#!, [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] zdołał pobić dotychczasowy rekord naszego kraju wynoszący #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! godzin#!. Niestety nie wystarczyło to do pobicia rekordu świata wynoszącego #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! godzin#! [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon]. Nie udało się również pobić krajowego rekordu odległości wynoszącego #b #p [ROOT.Var('santos_balloon_distance_record_var').GetValue]#! kilometrów#!, ponieważ pokonana odległość wyniosła #b #n [ROOT.Var('new_balloon_distance_var').GetValue]#! kilometrów#!."
