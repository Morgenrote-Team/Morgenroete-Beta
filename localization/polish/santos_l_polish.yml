 santos_balloon_demoralized_modifier: "Zniechęcony Baloniarz"
 je_group_santos_ballooning: "Morgenröte: [concept_santos_ballooning]"
 santos.441.t: "O włos od Śmierci"
 santos.441.d: "Cudem, mimo wszelkich przeciwności, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] zdołał ujść z życiem z niebezpiecznego przelotu nad kanałem La Manche. To wyrwanie się ze szponów śmierci ma jednak swoją cenę: balon znów wymaga naprawy... a sam baloniarz również nie jest w najlepszej kondycji."
 santos.441.f: "„W sycącej strawie kryje się smak życia i nieśmiertelności. Podobnie jak balony, jesteśmy niczym, dopóki się nie napełnimy”. -Herman Melville"
 santos.441.g: "Czy [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] doznał traumy?"
