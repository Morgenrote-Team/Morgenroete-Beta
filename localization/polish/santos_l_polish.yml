 santos_balloon_record_progress_bar: "Rekord Balonowy"
 santos_balloon_record_progress_bar_desc: "Przygotowanie do bicia rekordu Balonowego: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|1%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/12)"
 je_santos_balloon_record: "Rekord Balonowy"
 je_santos_balloon_record_reason: "Rekordy można ustanawiać w kategoriach wysokości, odległości i czasu lotu. Po odpowiednim okresie przygotowań baloniarz podejmie próbę ustanowienia rekordu w jednej z tych kategorii. Nawet jeśli zdoła pobić jedynie rekord krajowy, może liczyć na niewielką premię do badań nad technologią. Ponadto zawsze otrzyma punkty doświadczenia, których liczba zależy od odniesionego sukcesu. \n\nIstnieje #YELLOW umiarkowane ryzyko#!, że baloniarze zginą podczas lotu mającego na celu pobicie rekordu."
 je_santos_balloon_crossing: "Przelot Balonem"
 je_santos_balloon_crossing_reason: "#p [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] aktualnie pokonuje trasę [Scope.Var('santos_balloon_crossing_target_var').GetFlagName].#!\n\nPrzeloty balonowe stanowią największe wyzwanie dla [concept_santos_balloonist]. Każdy [concept_santos_balloon_crossing] można zaklasyfikować do jednego z trzech poziomów trudności — poziomy te określają ryzyko wystąpienia negatywnych wydarzeń, które mogą szybko doprowadzić do katastrofy, zwłaszcza na najbardziej wymagających trasach. Doświadczenie [concept_academics_experience] oraz [concept_character_trait] baloniarza często decydują o tym, jakie wydarzenia wystąpią. Na przykład ambitni baloniarze mają tendencję do wykonywania imponujących manewrów, które mogą skrócić czas lotu, podczas gdy ostrożni baloniarze starają się ograniczać ryzyko do minimum. Ponadto baloniarz posiadający cechę Meteorologa lub mający do dyspozycji wyspecjalizowanego [concept_curie_meteorological_physicist] może ochronić się przed najbardziej niszczycielskimi warunkami pogodowymi.\n\nJeśli baloniarz zbyt daleko posunie się w igraniu z losem, istnieje ryzyko, że zginie podczas podróży. Po upływie roku baloniarz porzuci swoje przedsięwzięcie, nie osiągając żadnych rezultatów.\n\nIstnieje #R znaczne ryzyko#!, że baloniarze zginą podczas przelotu balonowego."
 santos_ballooning_danger_progress_bar: "Niebezpieczeństwo"
 santos_ballooning_danger_progress_bar_desc: "Niebezpieczeństwo: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|1%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/[GetPlayer.MakeScope.ScriptValue('santos_balloon_crossing_danger_value')|0])"
 santos.506.g: "Jaki uroczy mały koala! Cóż za słodziak!"
 santos_balloon_crossing_cost_modifier: "Koszt Przelotu Balonem"
