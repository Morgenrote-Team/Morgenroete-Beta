 santos.653.d1: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] próbował wznieść się jak najwyżej przy użyciu [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] balonu. Osiągając wysokość #b #n [ROOT.Var('new_balloon_altitude_var').GetValue]#! metrów#!, [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] nie zdołał pobić dotychczasowego rekordu naszego kraju wynoszącego #b #p [ROOT.Var('santos_balloon_altitude_record_var').GetValue]#! metrów#!. [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe|U] z pewnością spróbuje ponownie."
 santos.653.d2: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] ustanowił nowy rekord wysokości naszego kraju przy użyciu [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] balonu! Osiągając wysokość #b #p [ROOT.Var('new_balloon_altitude_var').GetValue]#! metrów#!, [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] pobił dotychczasowy rekord naszego kraju wynoszący #b #p [ROOT.Var('santos_balloon_altitude_record_var').GetValue]#! metrów#!. Niestety nie wystarczyło to do pobicia rekordu świata wynoszącego #b #p [GetGlobalVariable('santos_balloon_altitude_record_global_var').GetValue]#! metrów#! [GetGlobalVariable('santos_balloon_altitude_record_holder_global_var').GetCountry.GetFlagTextIcon]."
 santos.653.d3: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] ustanowił nowy światowy rekord wysokości lotu przy użyciu [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] balonu! Osiągając wysokość #b #p [ROOT.Var('new_balloon_altitude_var').GetValue]#! metrów#!, [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] zdołał pobić dotychczasowy rekord naszego kraju wynoszący #b #p [ROOT.Var('santos_balloon_altitude_record_var').GetValue]#! metrów#! i wyraźnie przewyższyć rekord świata wynoszący #b #p [GetGlobalVariable('santos_balloon_altitude_record_global_var').GetValue]#! metrów [GetGlobalVariable('santos_balloon_altitude_record_holder_global_var').GetCountry.GetFlagTextIcon].#!"
