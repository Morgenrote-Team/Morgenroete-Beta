 santos.401.t: "Wybór Przelotu"
 santos.401.d: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] wciąż zastanawia się, który [concept_santos_balloon_crossing] [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] ma podjąć. Miejsce docelowe jego podróży należy starannie wybrać — może to być jego ostatnia..."
 santos.401.f: "„Zaopatrzcie się szybko w taftę i liny, a ujrzycie jeden z najbardziej zdumiewających widoków na świecie”. -Joseph-Michel Montgolfier"
 santos.431.d: "Pokonując [Scope.Var('santos_balloon_crossing_target_var').GetFlagName], [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] dokonał niezwykłego wyczynu. Po wielu godzinach wytrwałych zmagań wreszcie wiadomo, że sprostał temu wyzwaniu. Słońce jasno świeci na błękitnym niebie, zwiastując nowy dzień dla baloniarstwa!"
 santos.431.g: "Niezwykłe osiągnięcie baloniarza!"
