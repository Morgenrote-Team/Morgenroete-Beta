 je_santos_balloon_ride_reason: "[ROOT.GetCountry.GetCustom('santos_balloon_research_active_type')] Oprócz wprowadzania innowacji w baloniarstwie [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] może wzbogacać budynki, przede wszystkim pomniki, parki miejskie i parki rozrywki, o atrakcje balonowe.\n\nTo domyślny projekt [concept_santos_balloonist]. Jest aktywny, gdy Baloniarz nie jest zajęty innym projektem.\nZa każdym razem, gdy postęp osiągnie #V 24#!, otrzymamy niewielką premię do badań nad technologią. Jeśli istnieje [concept_monument], [GetBuildingType('building_gaudi_park').GetName] lub [GetBuildingType('building_gaudi_luna').GetName], baloniarz odwiedzi losowo jedną z tych lokalizacji i nada jej modyfikator $santos_building_production_mult_modifier$. \n\nTechnologia objęta następną premią: [GetPlayer.MakeScope.GetCountry.GetCustom('santos_balloon_research_next_technology_type')]"
 je_santos_balloon_ride_active_loc: "#p Ten Projekt jest obecnie aktywny.#!\n\n[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] odbywa rekreacyjne loty widokowe."
 je_santos_balloon_ride_inactive_loc: "#n Ten Projekt jest obecnie nieaktywny.#! Stanie się ponownie aktywny, gdy Baloniarz nie będzie już zajęty.\n\n[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] mógłby odbywać rekreacyjne loty, gdyby [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] nie był już zajęty."
 santos_balloon_research_active_loc: "#p Ten Projekt jest obecnie aktywny.#!\n\n[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] prowadzi obecnie badania przyczyniające się do rozwoju baloniarstwa."
 santos_balloon_research_inactive_loc: "#n Ten Projekt jest obecnie nieaktywny.#! Stanie się ponownie aktywny, gdy Baloniarz nie będzie już zajęty.\n\n[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] mógłby prowadzić badania przyczyniające się do rozwoju baloniarstwa, gdyby [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] nie był już zajęty."
