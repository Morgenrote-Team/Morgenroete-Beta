 santos_stratospheric_flight_cost_modifier: "Koszt Lotu Stratosferycznego"
 santos.301.t: "Lot Stratosferyczny: Spektakularny Sukces"
 santos.301.d: "Ku zaskoczeniu wielu obserwatorów, którzy uważali lot balonem do stratosfery za misję samobójczą, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] powrócił dziś z podróży. Kapsuła wylądowała na pastwisku niedaleko miasta [SCOPE.sState('santos_balloon_state').GetCityHubName]. Balon osiągnął wysokość #p [ROOT.Var('new_balloon_altitude_var').GetValue]#! metrów."
 santos.301.f: "„Kilka tygodni temu ogromny żółty balon wzbił się ku niebu z miasta [SCOPE.sState('santos_balloon_state').GetCityHubName], [GetPlayer.GetNameNoFormatting]. Zamiast kosza unosił czarno-srebrną aluminiową kulę o niezwykle cienkich ściankach. W jej wnętrzu [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] zamierzał zbadać powietrze na wysokości 50,000 stóp. Siedemnaście godzin później, choć uznano już śmierć podróżnika za pewną, [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] powrócił bezpiecznie z szacowanej wysokości [ROOT.Var('new_balloon_altitude_var').GetValue]”."
 santos.301.g: "Chwała naszemu bohaterowi [ROOT.Var('santos_balloonist_var').GetCharacter.GetLastNameNoFormatting]!"
 santos.302.t: "Lot Stratosferyczny: Śmiertelna Katastrofa"
 santos.302.d: "Potwierdziło się przekonanie wielu badaczy i dziennikarzy: lot stratosferyczny był pomysłem całkowicie szalonym. Sekcja zwłok wykaże, czy nasz baloniarz zginął podczas twardego lądowania w pobliżu miasta [SCOPE.sState('santos_balloon_state').GetCityHubName], gdy liny pękły wskutek zmęczenia materiału, czy też upał wewnątrz balonu i niedobór tlenu na tej wysokości doprowadziły do [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis] przedwczesnej śmierci. Tak czy inaczej, prasa już ma używanie."
 santos.302.f: "„Badania, ostrzeżenia, a nawet życzliwe rady nie przyniosły skutku. Tragicznej śmierci [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] prawdopodobnie można było zapobiec, gdyby rząd zakazał tego lekkomyślnego wyczynu. Jednak pragnienie międzynarodowej sławy i całkowite zaślepienie perspektywą wysłania baloniarza na niespotykaną dotąd wysokość sprawiły, że nawet najrozsądniejsze zastrzeżenia trafiały w próżnię.\n\nKim w ogóle są ci ludzie? Gdzie ich poczucie odpowiedzialności? To nie przypadek, że odkąd [SCOPE.sCharacter('santos_ruler_scope').GetFullNameNoFormatting] objął urząd, ten kraj zaczął się pruć w szwach! Odpowiedzialni za to ludzie nie chcą wam tego powiedzieć, ale się boją. I słusznie, bo cała tkanka tego kraju rozdziera się ze wszystkich stron”."
 santos.302.g: "Ogłoście dzień żałoby narodowej."
 santos_stratospheric_flight_success_modifier: "Lot Stratosferyczny: Sukces"
 santos_stratospheric_flight_failure_modifier: "Lot Stratosferyczny: Porażka"
 je_santos_stratospheric_flight: "Lot Stratosferyczny"
 je_santos_stratospheric_flight_reason: "Dla XIX-wiecznych baloniarzy spektakularny lot do stratosfery pozostawał jedynie utopijnym marzeniem. Jednak dzięki ogromnym postępom epoki przemysłowej i wynalezieniu kapsuły ciśnieniowej nawet ta wyprawa przestała być wyzwaniem nie do pokonania. W latach trzydziestych XX wieku odważni mężczyźni i kobiety z różnych krajów podjęli to wyzwanie, ryzykując przy tym życiem. Zasady lotu wysokościowego przypominają zasady [concept_santos_balloon_crossing], z tą różnicą, że ta podróż jest bardziej wymagająca i kończy się wyłącznie triumfem albo śmiercią. Ponadto można tu ustanowić najwyższe rekordy wysokości, sięgające nawet 22,000 metrów!"
 santos_stratospheric_flight_on_fail_tt: "Balon stratosferyczny ulega katastrofie ze skutkiem śmiertelnym."
 santos_stratospheric_flight_event_normal_ascent_icon_flag: "@santos_event_log_positive_normal_ascent_icon!"
 santos_stratospheric_flight_event_normal_ascent_title_flag: "Zwykłe Wznoszenie"
 santos_stratospheric_flight_event_normal_ascent_flag: "#t $santos_stratospheric_flight_event_normal_ascent_title_flag$#!\nBalon płynnie wznosi się do stratosfery."
 santos_stratospheric_flight_event_boost_ascent_icon_flag: "@santos_event_log_positive_boost_ascent_icon!"
 santos_stratospheric_flight_event_boost_ascent_title_flag: "Szybkie Wznoszenie"
 santos_stratospheric_flight_event_boost_ascent_flag: "#t $santos_stratospheric_flight_event_boost_ascent_title_flag$#!\nBaloniarz zdołał pomyślnie zwiększyć wysokość lotu balonu.\n\n#b Następujące czynniki zwiększają prawdopodobieństwo tego wyniku:#!\n[concept_santos_balloonist] posiada $santos_balloonist_experienced$, $innovative$ lub $ambitious$ [concept_character_trait]."
 santos_stratospheric_flight_event_altitude_improvisation_icon_flag: "@santos_event_log_positive_altitude_improvisation_icon!"
 santos_stratospheric_flight_event_altitude_improvisation_title_flag: "Improwizacja na Wysokości"
 santos_stratospheric_flight_event_altitude_improvisation_flag: "#t $santos_stratospheric_flight_event_altitude_improvisation_title_flag$#!\nWiedza techniczna załogi pozwoliła zminimalizować ryzyko związane z lotem balonem.\n\n#b Następujące czynniki zwiększają prawdopodobieństwo tego wyniku:#!\n[concept_santos_balloonist] posiada $cautious$, $innovative$ lub $engineer$ [concept_character_trait]. Pomóc może również [concept_curie_meteorological_physicist] posiadający $innovative$, $erudite$ lub $meticulous$ [concept_character_trait]."
 santos_stratospheric_flight_event_slow_ascent_icon_flag: "@santos_event_log_negative_slow_ascent_icon!"
 santos_stratospheric_flight_event_slow_ascent_title_flag: "Powolne Wznoszenie"
 santos_stratospheric_flight_event_slow_ascent_flag: "#t $santos_stratospheric_flight_event_slow_ascent_title_flag$#!\nZ nieznanych przyczyn balon nie wznosi się tak szybko, jak pierwotnie obliczono."
 santos_stratospheric_flight_event_broken_rope_icon_flag: "@santos_event_log_negative_broken_rope_icon!"
 santos_stratospheric_flight_event_broken_rope_title_flag: "Zerwana Lina"
 santos_stratospheric_flight_event_broken_rope_flag: "#t $santos_stratospheric_flight_event_broken_rope_title_flag$#!\nZerwana lina utrudnia sterowanie balonem, a zwłaszcza prawidłowe wypuszczanie gazu.\n\n#b Następujące czynniki zwiększają prawdopodobieństwo tego wyniku:#!\n[concept_santos_balloonist] posiada $reckless$, $wrathful$, $arrogant$ [concept_character_trait] lub #V negatywną cechę stanu, taką jak choroba lub uzależnienie#!.\n\n#b Następujące czynniki zmniejszają prawdopodobieństwo tego wyniku:#!\n[concept_santos_balloonist] posiada $curie_meteorological_physicist$ lub $engineer$ [concept_character_trait]. [concept_curie_meteorological_physicist] może wykryć te problemy przed startem."
 santos_stratospheric_flight_event_defective_valve_icon_flag: "@santos_event_log_negative_defective_valve_icon!"
 santos_stratospheric_flight_event_defective_valve_title_flag: "Uszkodzony Zawór"
 santos_stratospheric_flight_event_defective_valve_flag: "#t $santos_stratospheric_flight_event_defective_valve_title_flag$#!\nUszkodzony zawór sprawia, że lot balonu stratosferycznego nie przebiega zgodnie z pierwotnym planem.\n\n#b Następujące czynniki zwiększają prawdopodobieństwo tego wyniku:#!\n[concept_santos_balloonist] posiada $reckless$, $wrathful$, $arrogant$ [concept_character_trait] lub #V negatywną cechę stanu, taką jak choroba lub uzależnienie#!.\n\n#b Następujące czynniki zmniejszają prawdopodobieństwo tego wyniku:#!\n[concept_santos_balloonist] posiada $curie_meteorological_physicist$ lub $engineer$ [concept_character_trait]. [concept_curie_meteorological_physicist] może wykryć te problemy przed startem."
 santos_stratospheric_flight_event_heat_buildup_icon_flag: "@santos_event_log_negative_heat_buildup_icon!"
 santos_stratospheric_flight_event_heat_buildup_title_flag: "Nagromadzenie Ciepła"
 santos_stratospheric_flight_event_heat_buildup_flag: "#t $santos_stratospheric_flight_event_heat_buildup_title_flag$#!\nBez ochronnej warstwy chmur słońce niemiłosiernie praży balon. Powłoka i gaz nośny silnie się nagrzewają, a gaz gwałtownie się rozszerza.\n\n#b Następujące czynniki zmniejszają prawdopodobieństwo tego wyniku:#!\n[GetPlayer.GetName] posiada zbadane technologie [GetTechnology('zeppelins').GetName] i [GetTechnology('curie_rocket_science_tech').GetName]."
 santos_stratospheric_flight_event_material_fatigue_icon_flag: "@santos_event_log_negative_material_fatigue_icon!"
 santos_stratospheric_flight_event_material_fatigue_title_flag: "Zmęczenie Materiału"
 santos_stratospheric_flight_event_material_fatigue_flag: "#t $santos_stratospheric_flight_event_material_fatigue_title_flag$#!\nLot na dużej wysokości wystawia materiał balonu na skrajną próbę: Ryzyko rozdarć i innych uszkodzeń znacznie wzrasta!\n\n#b Następujące czynniki zwiększają prawdopodobieństwo tego wyniku:#!\n[GetPlayer.GetName] posiada zbadane technologie [GetTechnology('vulcanization').GetName] i [GetTechnology('art_silk').GetName]."
 santos_stratospheric_flight_event_hydrogen_fire_icon_flag: "@santos_event_log_negative_hydrogen_fire_icon!"
 santos_stratospheric_flight_event_hydrogen_fire_title_flag: "Pożar Wodoru!"
 santos_stratospheric_flight_event_hydrogen_fire_flag: "#t $santos_stratospheric_flight_event_hydrogen_fire_title_flag$#!\nDoszło do najgorszej możliwej katastrofy podczas lotu balonem: Wodór zapalił się! To oznacza pewną śmierć załogi\...\n\n#b Następujące czynniki zmniejszają prawdopodobieństwo tego wyniku:#!\n[GetPlayer.GetName] posiada $curtiss_helium_reserve_modifier$ [concept_modifier]. [concept_santos_balloonist] posiada $curie_meteorological_physicist$ lub $engineer$ [concept_character_trait]. [concept_curie_meteorological_physicist] może wykryć te problemy przed startem."
 je_santos_balloon_crossing_complete_tt: "@santos_ballooning_progress! #V #BLUE Postęp Balonu#!#! osiągnął #V [GetPlayer.MakeScope.ScriptValue('santos_balloon_crossing_goal_value')|0]#!."
 replace_balloonist_tt: "Zastąp [concept_santos_balloonist] nowym."
 santos.511.t: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetLastName] zniewolony w Afryce!"
 santos.511.d: "Nasz pilot balonowy, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName], od kilku miesięcy uznawany jest za zaginionego. Gazety doniosły dziś, że [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] najwyraźniej zaginął podczas swojego ostatniego lotu przygodowego nad Afryką. Wygląda na to, że [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] rozbił się na terytorium [SCOPE.sCountry('santos_balloonist_slaver_scope').GetName], gdzie został sprzedany w niewolę, a teraz jest zmuszany do ciężkiej pracy na polach!"
 santos.511.f: "W 1853 roku w różnych gazetach rzeczywiście ukazywały się artykuły, w których twierdzono, że Arban został zniewolony w Afryce. Nie istniały jednak żadne dowody na poparcie tych doniesień. Nie wiadomo dokładnie, co stało się z Arbanem, ale najbardziej prawdopodobne jest, że utonął w Morzu Śródziemnym."
 santos.511.g: "Uwolnimy [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHim] z niewoli!"
 santos.511.h: "Po prostu zapłaćmy i miejmy to z głowy..."
 santos.511.i: "Życie baloniarza nie jest warte aż tylu zachodów."
 santos.512.t: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetLastName] uwolniony z niewoli"
 santos.512.d1: "Niewielki oddział otrzymał zadanie uwolnienia [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] z niewoli. Po krótkiej potyczce żołnierzom udało się uwolnić [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHim] oraz kilku innych Europejczyków, po czym zbiegli konno. Zanim władze [SCOPE.sCountry('curtiss_arban_slaver_scope').GetAdjective] zdążyły zareagować, uciekinierzy dotarli już na pokład statku, który zabrał ich do domu. Z powodu długotrwałej niewoli [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis] stan zdrowia znacznie się pogorszył, a [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] jest wyczerpany i osłabiony. Mimo to [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] zdołał opowiedzieć nam o [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis] pełnym przygód locie balonem."
 santos.512.d2: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] powrócił do domu. Z powodu długotrwałej niewoli [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis] stan zdrowia znacznie się pogorszył, a [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] jest wyczerpany i osłabiony. Mimo to [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] zdołał opowiedzieć nam o swoim pełnym przygód locie balonem."
 santos.512.f: "„Wiatr zniósł mnie nad otwarte morze. Ponieważ pchał mnie na południe, postanowiłem spróbować dotrzeć do Balearów. Wiatr jednak nie sprzyjał i zostałem zniesiony aż ku wybrzeżom Afryki Północnej, gdzie udało mi się wylądować. Niestety tamtejsi mieszkańcy nie byli zbyt przyjaźni. Czy ktoś wcześniej przeleciał nad Morzem Śródziemnym? Czy ustanowiłem rekord?”"
 santos.512.g: "Udana akcja ratunkowa!"
 santos.512.h: "Witaj z powrotem, [ROOT.Var('santos_balloonist_var').GetCharacter.GetLastName]!"
 santos.701.t: "Pierwsze Zdjęcia Lotnicze z Balonu"
 santos.701.d: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] połączył swoje dwie pasje, baloniarstwo i fotografię, które [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis] od dawna były bliskie. [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe|U] zdołał sfotografować linię frontu w [SCOPE.sState('santos_balloon_state').GetCityHubName], zdobywając tym samym cenne informacje wojskowe."
 santos.701.f: "Nadar wykonał swoje pierwsze zdjęcia lotnicze w 1859 roku podczas bitwy pod Solferino. W 1863 roku został prezesem #b Société d'encouragement pour la locomotion aérienne au moyen d'appareils plus lourds que l'air#!, stowarzyszenia zajmującego się rozwojem lotnictwa. Sekretarzem tego towarzystwa był nie kto inny jak Juliusz Verne, którego balony Nadara zainspirowały do napisania powieści „#b Pięć tygodni w balonie#!”."
 santos.701.g: "Świat z góry wygląda zupełnie inaczej!"
 santos.702.t: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] przewozi pasażerów przez Alpy"
 santos.702.d: "Podczas lotu z pasażerami szwajcarski baloniarz [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] przeleciał nad Alpami. W trakcie wyprawy [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] pokonał niektóre z najwyższych szczytów Alp. [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe|U] jest teraz gwiazdą baloniarstwa."
 santos.702.f: "Eduard Spelterini, urodzony jako Albert Schweizer, już w młodości zdobył wykształcenie baloniarza. Gdy zbudowano dla niego pierwszy własny balon o nazwie „Urania”, zaczął podróżować po Europie, aby pokazywać przedstawicielom wyższych sfer świat widziany z góry. Zazwyczaj lot obejmował również niewielki piknik, podczas którego podawano kotlety i szampana. Spelterini zaczął także wykonywać zdjęcia lotnicze, jednak to pasażerskie loty nad Alpami najbardziej przyczyniły się do jego sławy."
 santos.702.g: "Niesamowity widok!"
 santos.703.t: "Pierwszy Lot Sterowca Kierowanego"
 santos.703.d: "Dużym problemem lotów balonowych jest ich zależność od sprzyjających wiatrów. Balon zbyt łatwo może zostać zniesiony z kursu, co wielokrotnie prowadzi do wypadków. [ROOT.Var('tesla_engineer_var').GetCharacter.GetFullName] postanowił znaleźć rozwiązanie tego problemu, konstruując podłużny sterowiec wyposażony w silnik parowy i ster umożliwiający kierowanie lotem. Na pokładzie swojego sterowca „[ROOT.Var('tesla_engineer_var').GetCharacter.GetLastNameNoFormatting]” [ROOT.Var('tesla_engineer_var').GetCharacter.GetSheHe] odbył lot o długości 27 kilometrów z Paryża do Élancourt. Ponieważ sterowiec jest bardzo powolny, lot pod wiatr na razie pozostaje niemożliwy. Kto wie, w jakim kierunku rozwinie się konstrukcja tych sterowców?"
 santos.703.f: "Lotem z 24 września 1852 roku Giffard zapisał się w historii jako pierwszy człowiek, który odbył lot sterowcem wyposażonym w napęd i układ sterowania. Napęd parowy był jednak bardzo słaby, przez co sterowce nie zyskały jeszcze szerszego zastosowania. Dopiero później, wraz z wynalezieniem silnika spalinowego, marzenie o sterowcach mogło stać się rzeczywistością."
 santos.703.g: "Może te sterowane balony wkrótce podbiją przestworza!"