 santos_stop_ballonist_project_button: "Przerwij Projekt Baloniarza"
 santos_stop_ballonist_project_button_desc: "Przerwij obecny Projekt Baloniarza. Postęp Baloniarza zostanie utracony."
 santos_stop_balloonist_project_tt: "Postanowiono przerwać projekt przez kliknięcie przycisku #italic $santos_stop_ballonist_project_button$#! lub nie posiadasz już postaci [concept_santos_balloonist]."
 je_santos_balloon_adventure: "Wyprawa Balonowa"
 je_santos_balloon_adventure_reason: "Podczas pełnej przygód wyprawy baloniarze mogą zbierać przedmioty związane ze swoim zawodem. Archeolodzy i etnolodzy gromadzą artefakty; przyrodnicy zbierają okazy i skamieliny; geolodzy pozyskują zwykłe i rzadkie materiały; meteorolodzy gromadzą dane magnetyczne, dane fizyczne i wiedzę oceanograficzną; inżynierowie natomiast wracają z wiedzą techniczną.\n\nIstnieje #G niewielkie ryzyko#!, że baloniarze nie wrócą żywi z wyprawy."
 santos.502.t: "Baloniarz powraca z Wyprawy"
 santos.502.d: "Po wielu miesiącach podróży [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] powraca do [GetPlayer.GetNameNoFormatting]. Ciekawscy z niecierpliwością wyczekują [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis] powrotu. [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe|U] z pewnością ma do opowiedzenia kilka pasjonujących historii, a do tego [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] przywiózł pamiątki!"
 santos.502.f: "Gdzieś ponad tęczą\nLatają błękitne ptaki\nA marzenia, które snujesz\nNaprawdę się spełniają, o-o-och\nPewnego dnia wypowiem życzenie do gwiazdy\nObudzę się tam, gdzie chmury zostaną daleko za mną\nGdzie troski topnieją jak cytrynowe landrynki\nWysoko ponad kominami, właśnie tam\nMnie znajdziesz, och"
 santos.502.g: "Ten baloniarz jednak do czegoś się przydaje..."
 santos.503.t: "Baloniarz powraca ze Zwierzęciem"
 santos.503.d: "Podczas [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis] ostatniej wyprawy nasz baloniarz po raz kolejny stawił czoła śmiertelnie niebezpiecznym wyzwaniom. Zdobycz jest jednak skromna. Zamiast niej [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] przywiózł coś innego: nowego zwierzęcego przyjaciela..."
 santos.503.g: "Jaka urocza małpka! Cóż za słodziak!"
 santos.504.g: "Jaki uroczy gronostajek! Cóż za słodziak!"
 santos.505.g: "Jakie urocze maleństwo... co to, do diabła, jest?"
