 je_mr_archaeology: "Archeologia"
 je_mr_archaeology_reason: "XIX wiek i początek XX wieku przyniosły gwałtowny rozwój badań nad starożytnością: od poszukiwania skarbów po poważną naukę. Wykopaliska Troi prowadzone przez Heinricha Schliemanna oraz odkrycie grobowca Tutanchamona przez Howarda Cartera to tylko dwa z najbardziej znanych wydarzeń tej epoki. Jednocześnie pokazują one, że w odzyskiwaniu cennych artefaktów ważną rolę odgrywało nie tylko pragnienie wiedzy naukowej, lecz także prestiż narodowy. Wraz z niemal całkowitym odczytaniem egipskich hieroglifów przez Karla Richarda Lepsiusa w 1837 roku rozpoczęła się ta nowa era."
 mr_romantic_composer_button: "Zatrudnij nowego [concept_elgar_composer] (romantyzm)"
 mr_composer_button_desc: "W przeciwieństwie do [Concept('concept_elgar_great_composer','$concept_elgar_great_composers$')], zwykli [Concept('concept_elgar_composer','$concept_elgar_composers$')] odpowiadają za codzienną działalność. Można ich zatrudniać jako dyrygentów, a ich kraj otrzymuje pasywny bonus do [concept_elgar_musical_tradition]. Kompozytora można zatrudnić trzy razy w ciągu gry, co wymaga zbadania określonej technologii (romantyzm, irracjonalizm, neoklasycyzm/Nowa Rzeczowość/Art déco). Kraj może wspierać tylko jednego zwykłego kompozytora, a ponadto wymagane jest dziesięcioletnie inwestowanie w kulturę muzyczną kraju."
 mr_wagnerian_composer_button: "Zatrudnij nowego [concept_elgar_composer] (irracjonalizm)"
 mr_modern_composer_button: "Zatrudnij nowego [concept_elgar_composer] (modernizm)"
 mr_appoint_conductor_button: "Mianuj głównego dyrygenta"
 mr_appoint_conductor_button_desc: "Dyrygenci kierują krajowym życiem muzycznym, w szczególności najważniejszą [Concept('concept_elgar_opera','$concept_elgar_opera_house$')] w kraju. W operze można powierzyć im na trzy lata określone zadanie: dyrygowanie, komponowanie lub tournée. Pod tym względem są podobni do [Concept('concept_elgar_great_composer','$concept_elgar_great_composers$')], choć ich wkład w [concept_elgar_musical_tradition] pozostaje na umiarkowanym poziomie."
 mr_national_conservatory_button: "Załóż Narodowe Konserwatorium"
 mr_national_conservatory_button_desc: "Dzięki konserwatorium istnieje szansa, że z czasem pojawią się postacie z cechą Kompozytor bez konieczności ich zatrudniania. Szansa jest bardzo mała, ale istnieje. Prawdopodobieństwo można zwiększyć dzięki szkole baletowej w jednej z naszych oper."
 mr_santa_cecilia_button: "Przekształć Santa Cecilia w akademię"
 mr_santa_cecilia_button_desc: "Akademia Santa Cecilia została założona w 1585 roku przez papieża Sykstusa V bullą „Ratione congruit” jako kongregacja. W 1838 roku Kongregacja św. Cecylii została oficjalnie przekształcona w akademię, a następnie w Akademię Papieską. Do jej ówczesnych członków należeli Luigi Cherubini, Mercadante, Donizetti, Rossini, Paganini, Auber, Liszt, Mendelssohn, Berlioz, Gounod i Meyerbeer. Jedną z jej honorowych członkiń była królowa Wiktoria. W zjednoczonych Włoszech rozwinęła się w czołowe konserwatorium."
 mr_leipzig_conservatory_button: "Załóż Konserwatorium Lipskie"
 mr_leipzig_conservatory_button_desc: "Tradycyjne miasto muzyki, jakim był Lipsk, w którym działał już Johann Sebastian Bach, oferowało optymalne warunki do założenia muzycznej i akademickiej kuźni talentów na początku XIX wieku. Czterech zaangażowanych obywateli miasta, a mianowicie prawnik Heinrich Conrad Schleinitz (drugi dyrektor), dyrektor okręgu lipskiego Johann Paul von Falkenstein oraz Królewsko-Saski Radca Dworu Johann Georg Keil, a także kapelmistrz Gewandhausu Felix Mendelssohn Bartholdy wcielili wcześniejsze idee w życie."
 mr_petrograd_conservatory_button: "Załóż konserwatorium w Piotrogrodzie"
 mr_petrograd_conservatory_button_desc: "Z inicjatywy wielkiej księżnej Heleny Pawłownej, Antona Rubinsteina, Andrieja Nikołajewicza Markowicza oraz innych osobistości życia społecznego i muzycznego powstało Rosyjskie Towarzystwo Muzyczne, z którego klas muzycznych założono pierwsze konserwatorium w Rosji. Anton Rubinstein został pierwszym dyrektorem konserwatorium oraz profesorem fortepianu. Pierwszym absolwentem, który ukończył tutaj studia kompozytorskie, był Piotr Czajkowski. Szczególnie wpływową rolę jako profesor kompozycji i instrumentacji oraz kierownik klasy orkiestry odegrał Nikołaj Rimski-Korsakow."
 mr_bayreuth_button: "Ustanów Festiwal Richarda Wagnera"
 mr_bayreuth_button_desc: "Richard Wagner od dawna marzył o posiadaniu własnej sali festiwalowej, w której co roku wystawiano by jego największe dzieła. Takie miejsce mogłoby szybko stać się celem pielgrzymek wszystkich miłośników muzyki i byłoby trwałym, żywym pomnikiem ku jego czci."
