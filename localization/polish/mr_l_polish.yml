l_polish:
 objective_thriving_culture: "Kwitnąca kultura"
 objective_thriving_culture_desc: "Każdy barbarzyński kraj może podbić kawałek ziemi. Wyższa cywilizacja objawia się jednak w dziedzinie nauki i kultury. Odkrywaj skarby archeologiczne, odkrywaj nowe gwiazdy i planety, zatrudniaj kompozytorów, kolekcjonuj egzotyczne zwierzęta i rośliny, wyruszaj na wyprawy badawcze lub ustanawiaj rekordy w epoce lotnictwa. Nadchodzi nowy świt!"
 objective_thriving_culture_name_AUS: "Austria"
 objective_thriving_culture_desc_AUS: "Bella gerant alii, tu felix Austria nube! Czy te czasy dla Austrii dobiegły końca? Kongres wiedeński i Metternich po raz ostatni wynieśli Austrię na centralną pozycję w Europie, lecz ambicje Prus i Rosji zagrażają nastawionej na kompromis polityce Imperium Habsburgów. Czy Austria, podobnie jak w przeszłości, może również w przyszłości triumfować, stając się centrum przyciągającym kulturą i stylem życia? Broń reputacji Wiednia jako metropolii muzyki i uczyń z niego najbardziej atrakcyjne miasto Europy."
 objective_thriving_culture_name_BEL: "Belgia"
 objective_thriving_culture_desc_BEL: "Belgia jest nie tylko wschodzącą potęgą gospodarczą, lecz ma również wiele możliwości rozwoju na polu naukowym: w paleontologii, astronomii, a także poprzez ekspedycje na Pacyfik ten niewielki kraj mógłby umocnić swoją światową sławę, którą inni zdobywają dzięki wojnie. Czy Kongo jest jedynie kolonią, czy także celem ekspedycji botanicznej? I czy Bruksela pozostanie tylko miejscem tranzytowym dla podróżujących kompozytorów, czy też kraj spróbuje stworzyć własną tradycję muzyczną?"
 objective_thriving_culture_name_SAR: "Sardynia-Piemont"
 objective_thriving_culture_desc_SAR: "Sardynia-Piemont znajduje się w trudnej sytuacji: z jednej strony, czy zdoła zgromadzić wystarczające siły polityczne i militarne, aby zjednoczyć naród włoski, a z drugiej — sprostać reputacji Włoch jako narodu kultury? Zjednoczone Włochy zyskałyby nowe możliwości, od budowy Mole Antonelliana i sukcesów muzycznych po rekordy lotnicze ustanawiane podczas Schneider Trophy."
 objective_thriving_culture_name_SWI: "Szwajcaria"
 objective_thriving_culture_desc_SWI: "Jako kraj śródlądowy Szwajcaria może mieć gorsze warunki do organizowania ekspedycji w odległe zakątki świata, ale posiada znaczny potencjał w obrębie własnych granic. Trafne decyzje dotyczące wspierania muzyki klasycznej mogą skłonić być może jednego z wielkich kompozytorów do pozostania w kraju. Jedna z formacji geologicznych jest przydatna dla paleontologii. A poza tym zawsze pozostaje projekt stulecia rozważany przez Alfreda Eschera: ogromny tunel przebijający się przez sam środek gór..."
 objective_thriving_culture_idle_header: "Kontynuuj swoją drogę"
 objective_thriving_culture_idle_hint: "Z czasem pojawią się kolejne wyzwania"
 thriving_culture_welcome: "Witaj w Morgenröte!"
 thriving_culture_welcome_desc: "Gratulacje z okazji wyboru ścieżki kulturowej! To scenariusz „Morgenröte”. Spróbuj pokojowo doprowadzić swój naród na szczyt świata, opierając się wyłącznie na kulturze i nauce."
 thriving_culture_lesson_button_skip: "Naprzód!"
 thriving_culture_complete_desc: "Gratulacje! Twój naród jest kulturalną wizytówką tej epoki! Czy naprawdę odkryłeś wszystkie oblicza Morgenröte? Czy podróżowałeś do Centrum Ziemi? Czy odkryłeś na nowo Zaginiony Świat? Odnalazłeś Atlantydę? Odkryłeś Shangri-La? Nie? To jak możesz mówić, że już skończyłeś?"
 thriving_culture_lesson_button_complete: "Jest tego więcej?"
 je_objective_promote_an_academic: "Promuj [concept_academics_academic]"
 je_objective_promote_an_academic_reason: "Aby prowadzić nasze różnorodne działania naukowe i kulturalne, awansowanie uczonego jest niezbędne."
 je_objective_a_great_step_forward: "Ogromny krok naprzód"
 je_objective_a_great_step_forward_reason: "Nasz naród powinien wyznaczyć ważny historyczny kamień milowy, opracowując kluczową technologię naukową."
 je_objective_a_great_step_forward_theory_of_evolution_tt: "Odkryj #b teorię ewolucji#! jako pierwszy naród."
 je_objective_a_great_step_forward_early_archaeology_tt: "Odkryj #b wczesną archeologię#! jako pierwszy naród."
 je_objective_a_great_step_forward_modern_astronomy_tt: "Odkryj #b nowoczesną astronomię#! jako pierwszy naród."
 je_objective_a_great_step_forward_steel_frame_tt: "Odkryj #b budynki o stalowym szkielecie#! jako pierwszy naród."
 je_objective_major_discovery: "Znaczące odkrycie"
 je_objective_major_discovery_reason: "Faustowski duch naszej epoki wzywa do przekraczania granic. Powinniśmy dokonać wielkiego odkrycia ku chwale naszego narodu!"
 je_objective_go_on_scientifical_expedition: "Sponsoruj wyprawę naukową"
 je_objective_go_on_scientifical_expedition_reason: "Ekspedycja naukowa ma fundamentalne znaczenie dla dalszych badań naszych uczonych oraz wzbogacania naszych muzeów i kolekcji. Powinniśmy jak najszybciej zatrudnić uczonego, aby ją przeprowadził."
 je_objective_go_on_scientifical_expedition_archaeology: "Aktywuj [concept_lepsius_expedition]."
 je_objective_go_on_scientifical_expedition_paleontology: "Aktywuj [concept_dubois_paleontological_expedition]"
 je_objective_go_on_scientifical_expedition_botany: "Aktywuj [concept_dubois_botanical_expedition]"
 je_objective_go_on_scientifical_expedition_pacific: "Aktywuj [concept_dubois_pacific_expedition]"
 je_objective_dawn_of_a_new_era: "Świt nowej ery"
 je_objective_dawn_of_a_new_era_reason: "W XIX wieku czysta pasja kolekcjonerska przekształciła się w metody naukowe i systematykę. Żaden zakątek planety nie jest już niedostępny, żadna przeszłość, choćby najciemniejsza, nie wydaje się niezgłębiona. Wszystko można zmierzyć, przeanalizować i zinterpretować. Nadszedł czas, aby stworzyć kolekcję naukową, która sprosta tym ambicjom."
 dawn_of_new_era_fossil_tt: "Zbierz #G 25#! [Concept('concept_dubois_fossil','$concept_dubois_fossils$')]."
 dawn_of_new_era_specimen_tt: "Zbierz #G 35 000#! [Concept('concept_dubois_specimen','$concept_dubois_specimens$')]."
 dawn_of_new_era_artifacts_tt: "Zbierz #G 50#! [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')]."
 dawn_of_new_era_astronomical_objects_tt: "Skataloguj #G 75#! [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects$')]."
 je_objective_more_than_politics: "Więcej niż polityka"
 je_objective_more_than_politics_reason: "Piękno i prawda mają większą wartość niż godna pogardy walka o władzę. Budowa znaczących instytucji naukowych i kulturalnych powinna być znakiem tego, co naprawdę liczy się w obliczu historii."
 je_objective_assemble_dinosaur_skeleton: "Zrekonstruuj dinozaura"
 je_objective_assemble_dinosaur_skeleton_reason: "Nie należy zaniedbywać paleontologicznych wysiłków naszego kraju. Imponujący szkielet dinozaura mógłby stać się początkiem wyśmienitej kolekcji!"
 je_objective_relevant_culture: "Kultura o znaczeniu międzynarodowym"
 je_objective_relevant_culture_reason: "W kraju wykazaliśmy już nasze zamiłowanie do sztuk pięknych i nauki, ale aby dowiedział się o tym cały świat, musimy znacznie zwiększyć nasze wysiłki — a to, w jakiej dziedzinie się wyspecjalizujemy, zależy wyłącznie od nas."
 relevant_culture_astronomy_tt: "Zorganizuj #O kongres astronomiczny#!."
 relevant_culture_music_tt: "Posiadaj #O regionalnie ważną#! [concept_elgar_musical_tradition]."
 je_objective_cradle_of_culture: "Kolebka kultury"
 je_objective_cradle_of_culture_reason: "Nowe formy sztuki zastępują sztywne formy historyzmu, manieryzmu i realizmu. Rozpoczęła się nowa era. Nasz naród musi znaleźć się na czele tego nowego świtu i stać się sztandarowym przedstawicielem awangardy!"
 je_objective_thriving_culture: "Rozkwitająca kultura"
 je_objective_thriving_culture_reason: "Aby stać się najważniejszym narodem kultury na świecie, musimy wykazać się naszym wyczuciem estetyki i zrozumieniem nauki we wszystkich dziedzinach."
 thriving_culture_archaeological_discovery_tt: "Dokonaj wielkiego #O odkrycia archeologicznego#!."
 thriving_culture_great_comet_tt: "Odkryj [concept_verrier_comet]."
 thriving_culture_great_composer_tt: "Zatrudnij w trakcie gry co najmniej jednego [concept_elgar_great_composer]."
