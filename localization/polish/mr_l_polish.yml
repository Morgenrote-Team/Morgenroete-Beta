 setting_mr_tech_normal_rule: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mr_tech_normal_rule_desc Normalny bonus technologiczny#!#!"
 setting_mr_tech_normal_rule_desc: "Wiele wydarzeń [concept_morgenroete] zapewnia twojemu krajowi niewielki bonus do badań nad technologią. Przy tym ustawieniu używane są #V normalne wartości#!."
 setting_mr_tech_half_rule: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mr_tech_half_rule_desc Bonus technologiczny 50%#!#!"
 setting_mr_tech_half_rule_desc: "Wiele wydarzeń [concept_morgenroete] zapewnia twojemu krajowi niewielki bonus do badań nad technologią. Przy tym ustawieniu wartości są #n o połowę niższe#!. Może to skutkować wolniejszym tempem badań."
 setting_mr_tech_quarter_rule: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_mr_tech_quarter_rule_desc Bonus technologiczny 25%#!#!"
 setting_mr_tech_quarter_rule_desc: "Wiele wydarzeń [concept_morgenroete] zapewnia twojemu krajowi niewielki bonus do badań nad technologią. Przy tym ustawieniu wartości są #n czterokrotnie niższe#!. Może to skutkować wolniejszym tempem badań."
