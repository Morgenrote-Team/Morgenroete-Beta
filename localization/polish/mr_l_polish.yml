 mr_appoint_chief_engineer: "Mianuj głównego inżyniera"
 mr_appoint_chief_engineer_desc: "Dzięki głównemu inżynierowi miesięczny postęp budowy monumentów otrzymuje dodatkowy punkt budowy."
 mr_dismiss_chief_engineer: "Odwołaj głównego inżyniera"
