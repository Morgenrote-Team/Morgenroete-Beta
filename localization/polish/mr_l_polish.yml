 objective_thriving_culture_name_BAV: "Bawaria"
 objective_thriving_culture_desc_BAV: "Pod względem kultury Bawaria zawsze mogła konkurować z wielkimi państwami niemieckimi. XIX wiek był okresem rozkwitu sztuki i architektury w Monachium. Oprócz Walhalli i Neuschwanstein, Bawaria jest również miejscem, gdzie odkryto archeopteryksa, kolebką monachijskiej secesji oraz ojczyzną Spitzwega. Czy Bawaria jako niemieckie mocarstwo średniej wielkości może obronić się przed swoimi wielkimi sąsiadami, polegając mniej na wojsku, a bardziej na nauce i sztuce?"
 objective_thriving_culture_name_MEX: "Meksyk"
 objective_thriving_culture_desc_MEX: "Na pierwszy rzut oka Meksyk może nie wydawać się pierwszym wyborem, jeśli chodzi o rozwój kultury. Jednak jego bogata historia archeologiczna daje wiele nadziei. W teorii Meksyk mógłby nawet dokonać przełomu w kwestii Przejścia Północno-Zachodniego. Jeśli kraj, wstrząsany kryzysami, odnajdzie harmonię, będzie mógł zwieńczyć swój sukces estetycznym dziełem w postaci Palacio de Bellas Artes."
 je_mr_morgenrote_introduction_reason: "[concept_morgenroete] to modyfikacja skupiająca się na nauce, sztuce i kulturze. Zawiera wiele nowych mechanik oraz ogromną ilość treści. Aby uzyskać ogólny przegląd moda, spróbuj użyć konceptów, przechodząc do menu i Vickypedii lub najeżdżając kursorem na ten [Concept('concept_morgenroete','$concept_morgenroete_concept$')].\n\nAby uzyskać dostęp do większości zawartości Morgenröte, kliknij przycisk w tym wpisie w dzienniku lub ten znajdujący się obok paska bocznego. Przycisk w tym wpisie w dzienniku powinien zawsze działać."
 je_objective_cradle_of_culture_tt: "Bądź pierwszym narodem, który wynajdzie #ORANGE Impresjonizm#!, #ORANGE Ekspresjonizm#! lub #ORANGE Secesję#!."
 mr_divider_for_je: "              @divider_start!@divider_mid!@divider_mid!@divider_mid!@divider_mid!@divider_mid!@divider_end!"
 objective_thriving_culture_name_SWE: "Szwecja"
 objective_thriving_culture_desc_SWE: "W ciągu ostatnich 100 lat Szwecja stała się wiodącym narodem naukowym, wnosząc znaczący wkład w rozwój nauki, w tym system nazewnictwa organizmów, skalę temperatur Celsjusza oraz system symboli pierwiastków chemicznych. \n   Czy Szwecja może utrzymać swoją pozycję w czołówce nauki, czy nadszedł czas, aby skierować uwagę ku kulturze, wspierając pisarzy i kompozytorów?"
