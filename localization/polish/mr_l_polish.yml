 je_mr_scientific_conferences: "Konferencje naukowe"
 je_mr_scientific_conferences_reason: "Ile lat ma Ziemia? Skąd pochodzi człowiek? Jak wiarygodna jest Biblia jako źródło historyczne? Czy wszechświat jest nieskończony — i czym właściwie są galaktyki? Na przestrzeni stu lat znacząco zmieniła się nie tylko sama nauka, ale również sposób, w jaki ludzie postrzegają świat. Teoria ewolucji zachwiała ludzką pewnością siebie w takim samym stopniu jak teoria względności. Konferencje naukowe mają pomóc wyjaśnić niektóre z fundamentalnych kwestii poprzez dyskusje międzynarodowego grona naukowców."
 mr_exodus_congress_egyptian_artifacts_tt: "Potrzebujemy co najmniej #G 25#! #O @lepsius_egypt_minor! egipskich artefaktów#!."
 mr_exodus_congress_global_artifacts_tt: "Międzynarodowe badania archeologiczne muszą zabezpieczyć łącznie #BLUE 150 #! #O artefaktów#!. Obecnie odzyskano [GetGlobalVariable('lepsius_global_artifacts').GetValue] #O artefaktów#!."
