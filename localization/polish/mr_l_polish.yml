 dlc_morgenrote: "Morgenröte - Dawn of Flavor"
 dlc_morgenrote_desc: "Morgenröte – Dawn of Flavor to modyfikacja wzbogacająca świat Victorii 3 o kulturę, piękno i styl życia. Naszym celem nie jest ulepszanie mapy ani gospodarki, lecz rozwinięcie wszystkich tych aspektów epoki wiktoriańskiej, które wcześniej pojawiały się jedynie na krótko w sterylnym świecie gry. Obejmują one realistyczne ekspedycje naukowe, zwiększanie prestiżu poprzez kulturę oraz kształcenie artystów i naukowców.\n\nNie martw się, Morgenröte jest #p aktywne#!."
