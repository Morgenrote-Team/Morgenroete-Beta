 mr_hippocampus_congress_specimen_tt: "Potrzebujemy co najmniej #G 20000#! @dubois_specimen! [Concept('concept_dubois_specimen','$concept_dubois_specimens$')]."
 mr_hippocampus_congress_global_specimen_tt: "Międzynarodowe badania przyrodnicze muszą zgromadzić łącznie #BLUE 100000 #! @dubois_specimen! [Concept('concept_dubois_specimen','$concept_dubois_specimens$')]. Obecnie zebrano [GetGlobalVariable('dubois_global_specimen').GetValue] #O okazów#!."
 mr_origin_congress_human_fossil_tt: "Potrzebujemy co najmniej #G 10#! @dubois_human_fossil! #O ludzkich skamieniałości#!."
 mr_origin_congress_special_human_fossil_tt: "Potrzebujemy co najmniej #G 3#! @dubois_human_fossil! #O ludzkich skamieniałości#! należących do jednego z tych gatunków: Homo Neanderthalensis, Homo Erectus, Australopithecus lub Paranthropus."
