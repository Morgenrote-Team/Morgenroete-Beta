l_polish:
 mr_swe_nor_union_decision_1: "Mianuj nowego Gubernatora Generalnego w Norwegii"
 mr_swe_nor_union_decision_1_desc: "Stanowisko w Christianii jest obecnie nieobsadzone. Powinniśmy zdecydować, kogo mianować nowym szefem norweskiego rządu pod nieobecność króla."
 mr_swe_nor_union_decision_2: "Żądać, aby nasi ministrowie mogli uczestniczyć w debatach parlamentarnych"
 mr_swe_nor_union_decision_2_desc: "Obecnie ministrom zabrania się zabierania głosu w Stortingu. Tak nie może być."
 mr_swe_nor_union_decision_3: "Zażądać usunięcia wszystkich symboli unii z naszej flagi"
 mr_swe_nor_union_decision_3_desc: "Powinniśmy używać czystej norweskiej flagi, bez symboli unii."
 mr_swe_nor_union_decision_4: "Żądać norweskich urzędów konsularnych"
 mr_swe_nor_union_decision_4_desc: "Wraz ze wzrostem norweskiej żeglugi szwedzkie urzędy konsularne nie są już wystarczające. Potrzebujemy norweskich urzędów."
 mr_swe_nor_union_decision_5: "Zażądaj, aby król Karol XV dotrzymał swojej obietnicy"
 mr_swe_nor_union_decision_5_desc: "Wraz z koronacją Karola XV na króla Szwecji i króla Norwegii nadszedł czas, aby spełnił swoją obietnicę zniesienia stanowiska gubernatora generalnego."
 da_appoint_governor_general: "Mianuj gubernatora generalnego"
 da_appoint_governor_general_desc: "Zmienia gubernatora generalnego [concept_subject]. [concept_liberty_desire] może się zmienić w zależności od wybranego kandydata."
 da_appoint_governor_general_action_name: "Mianuj gubernatora generalnego"
 da_appoint_governor_general_action_notification_name: "[TARGET_COUNTRY.GetName] otrzymuje nowego gubernatora generalnego"
 da_appoint_governor_general_action_notification_desc: "[INITIATOR_COUNTRY.GetName] zastąpiło gubernatora generalnego [TARGET_COUNTRY.GetName] nowo mianowanym przedstawicielem."
 da_appoint_governor_general_action_notification_third_party_name: "[TARGET_COUNTRY.GetName] otrzymuje nowego gubernatora generalnego"
 da_appoint_governor_general_action_notification_third_party_desc: "[INITIATOR_COUNTRY.GetName] zastąpiło gubernatora generalnego [TARGET_COUNTRY.GetName] nowo mianowanym przedstawicielem."
 mr_swe_nor_union_event.1.t: "Mianowanie nowego gubernatora generalnego"
 mr_swe_nor_union_event.1.d: "Stanowisko gubernatora generalnego w Christianii jest nieobsadzone. Być może powinniśmy rozważyć mianowanie kogoś na to stanowisko."
 mr_swe_nor_union_event.1.f: "Zgodnie z norweską konstytucją z 1814 roku gubernator generalny narodowości szwedzkiej lub norweskiej mógł zostać mianowany do kierowania norweskim rządem podczas nieobecności króla, który rezyduje w Sztokholmie. W Szwecji wielu uważa, że gubernator generalny, działający w imieniu szwedzkiego króla, powinien być koniecznie narodowości szwedzkiej. Wszystko, co temu przeczy, jest postrzegane jako potencjalne zagrożenie dla bezpieczeństwa narodowego."
 mr_swe_nor_union_event.1.a: "Mianuj szwedzkiego gubernatora generalnego"
 mr_swe_nor_union_event.1.b: "Mianuj norweskiego gubernatora generalnego"
 mr_swe_nor_union_event.1.c: "Pozostaw stanowisko nieobsadzone przez następne 5 lat"
 mr_swe_nor_union_event.2.t: "Norweskie Ministerstwa"
 mr_swe_nor_union_event.2.d: "Storting zezwala norweskim ministrom na udział w debatach parlamentarnych."
 mr_swe_nor_union_event.2.f: "Norweski parlament, Storting, zagłosował za zezwoleniem norweskim ministrom na udział w debatach i negocjacjach parlamentarnych. Teraz oczekują na zatwierdzenie swojej decyzji przez króla."
 mr_swe_nor_union_event.2.a: "Odmów uznania ich decyzji"
 mr_swe_nor_union_event.2.b: "Zatwierdź ich decyzję"
 mr_swe_nor_union_event.3.t: "Norweska Flaga"
 mr_swe_nor_union_event.3.d: "Norwegia domaga się prawa do używania czystej norweskiej flagi."
 mr_swe_nor_union_event.3.f: "Storting, norweski parlament, zagłosował za przyjęciem nowej „czystej” flagi bez zwyczajowych symboli unii szwedzko-norweskiej. Czy powinniśmy poprzeć ich decyzję, czy odmówić im prawa do używania wybranej przez nich flagi?"
 mr_swe_nor_union_event.3.a: "Zachowają swoją obecną flagę"
 mr_swe_nor_union_event.3.b: "Pozwól im używać wybranej przez nich flagi"
 mr_swe_nor_union_event.4.t: "Norweskie urzędy konsularne"
 mr_swe_nor_union_event.4.d: "Norwegia domaga się prawa do otwierania własnych urzędów konsularnych na całym świecie."
 mr_swe_nor_union_event.4.f: "Urzędy konsularne unii były prowadzone przez ministerstwo spraw zagranicznych w Sztokholmie, ale wraz ze wzrostem znaczenia norweskiego przemysłu żeglugowego Norwegowie argumentują, że norweski urząd konsularny jest konieczny. \nW Szwecji norweskie żądanie jest postrzegane jako pierwszy krok w kierunku norweskiej służby zagranicznej oraz potencjalnego przyszłego żądania niepodległości Norwegii."
 mr_swe_nor_union_event.4.a: "Z naszymi urzędami jest wszystko w porządku"
 mr_swe_nor_union_event.4.b: "Im więcej urzędów, tym lepiej"
 mr_swe_nor_union_event.5.t: "Obietnica Karola XV"
 mr_swe_nor_union_event.5.d: "Norwegia domaga się, aby nowy król, Karol XV, spełnił swoją obietnicę zniesienia stanowiska gubernatora generalnego w Christianii."
 mr_swe_nor_union_event.5.f: "Składanie obietnic ludowi Norwegii podczas bycia następcą tronu to jedno, a bycie władcą dwóch krajów to coś zupełnie innego. Czy stanowisko powinno zostać zniesione zgodnie z obietnicą, a norweski premier powinien zastąpić gubernatora generalnego w Christianii?"
 mr_swe_nor_union_event.5.a: "Potrzebujemy własnej osoby w Christianii"
 mr_swe_nor_union_event.5.b: "Obietnica powinna zostać dotrzymana"
 mr_swe_nor_union_event.6.t: "Obietnica następcy tronu"
 mr_swe_nor_union_event.6.d: "Następca tronu, Karl Bernadotte, zobowiązuje się znieść stanowisko gubernatora generalnego w Christianii po swojej koronacji."
 mr_swe_nor_union_event.6.f: "W celu zdobycia przychylności norweskiego ludu przyszły król uroczyście zobowiązuje się zlikwidować urząd gubernatora generalnego w Christianii po swojej koronacji. Reakcje szwedzkich właścicieli ziemskich i sił zbrojnych, co nie jest zaskakujące, rzucają cień na propozycję młodego następcy tronu."
 mr_swe_nor_union_event.6.a: "Miejmy nadzieję, że wie, co robi."
 mr_swe_nor_union_concessions_none: "Odmówiono ustępstw wobec Norwegii"
 mr_swe_nor_union_concessions_minor: "Drobne ustępstwa wobec Norwegii"
 mr_swe_nor_union_concessions_major: "Duże ustępstwa wobec Norwegii"
 mr_swe_nor_clean_flag: "Norwegia usuwa wszystkie symbole unii ze swojej flagi"