l_polish:
 MFE_trade_good_events.1.t: "Amunicja dla [SCOPE.sW('active_war').GetName]"
 MFE_trade_good_events.1.d: "Dotarły do nas doniesienia, że fabryki amunicji w [SCOPE.sC('munitions_state').GetName] zostały niedawno zmodernizowane."
 MFE_trade_good_events.1.f: "[SCOPE.sC('munitions_state').GetAdjective] prasa przechwala się tym imponującym osiągnięciem i trudno ich za to winić."
 MFE_trade_good_events.1.a: "W samą porę na wojnę"
 MFE_trade_good_events.2.t: "Rozpaczliwy brak amunicji"
 MFE_trade_good_events.2.d: "Wojna [SCOPE.sW('active_war').GetName], w którą zaangażowane jest [SCOPE.sC('ally').GetName], ujawniła niedobór ich zapasów amunicji i teraz błagają nas o jej dostarczenie."
 MFE_trade_good_events.2.f: "Podajcie swoją cenę, [ROOT.GetCountry.GetName], a gdy wygramy tę wojnę, będzie wasza."
 MFE_trade_good_events.2.a: "Możemy oddać kilka nabojów"
 MFE_trade_good_events.2.b: "Jak mamy strzelać do naszych wrogów bez amunicji?!"
 MFE_trade_good_events.3.t: "[SCOPE.sC('ally').GetName] składa tajną prośbę"
 MFE_trade_good_events.3.d: "Wygląda na to, że wojna [SCOPE.sW('active_war').GetName] zastała [SCOPE.sC('ally').GetName] nieprzygotowane do takiego konfliktu i już teraz zaczyna im brakować zaopatrzenia, zwłaszcza amunicji.\n\nPotajemnie wysłali do nas swoich dyplomatów, którzy składają nam wszelkiego rodzaju obietnice w zamian za pomoc w dostarczeniu artylerii."
 MFE_trade_good_events.3.f: "Uwierzcie mi — [SCOPE.sC('ally').GetName] naprawdę może wygrać tę wojnę, ale będziemy potrzebować pomocy! Nie opuszczajcie nas w tej rozpaczliwej godzinie!"
 MFE_trade_good_events.3.a: "Możemy oddać kilka dział artyleryjskich"
 MFE_trade_good_events.3.b: "Obawiam się, że nasze własne zapasy są zbyt małe"
 MFE_trade_good_events.4.t: "Naruszenie bezpieczeństwa"
 MFE_trade_good_events.4.d: "Nasze służby wywiadowcze donoszą, że w [SCOPE.sS('arms_state').GetName] doszło do jakiegoś rodzaju wtargnięcia do zakładów wojskowych, a duże ilości materiałów wybuchowych zaginęły."
 MFE_trade_good_events.4.f: "Jak mogli pozwolić żeby coś takiego się wydarzyło?"
 MFE_trade_good_events.4.a: "Miejmy nadzieję, że nie wpadły w niepowołane ręce..."
 MFE_trade_good_events.5.t: "Obfite zbiory w [SCOPE.sS('arable_state').GetName]"
 MFE_trade_good_events.5.d: "Wciąż docierają do nas doniesienia, że deszcze w [SCOPE.sS('arable_state').GetName] zdziałały cuda na miejscowych gospodarstwach, zwiększając i tak już imponującą produkcję rolną ponad wszelkie oczekiwania."
 MFE_trade_good_events.5.f: "Tegoroczne zbiory są tak dobre, że będziemy musieli zatrudnić więcej robotników na ten sezon, ale na szczęście możemy sobie na to pozwolić."
 MFE_trade_good_events.5.a: "Nie mogło być lepszego momentu"
 MFE_trade_good_events.6.t: "Szaleniec w fabryce czołgów"
 MFE_trade_good_events.6.d: "Lokalne gazety są pełne przerażających nagłówków z [SCOPE.sS('tank_state').GetName] — szaleniec w jakiś sposób przejął czołg i rozpoczął morderczą szarżę, niszcząc całą wioskę i zabijając dziesiątki niewinnych osób, zanim został powstrzymany przez policję."
 MFE_trade_good_events.6.f: "Nikt nie wie, dlaczego doszło do tej bezsensownej tragedii, i nigdy nie poznamy jej przyczyny."
 MFE_trade_good_events.6.a: "Łączymy się z nimi w żałobie, ale nie możemy im w żaden sposób pomóc"
 MFE_trade_good_events.6.b: "Dajmy im wszystko, czego potrzebują — to po prostu straszne..."
 MFE_trade_good_events.7.t: "Inwestycje nabierają rozpędu w [SCOPE.sS('plane_state').GetName]"
 MFE_trade_good_events.7.d: "Inwestorzy z branży lotniczej wciąż napływają do [SCOPE.sS('plane_state').GetName], prześcigając się nawzajem w walce o zdobycie własnych kontraktów z lokalnymi fabrykami."
 MFE_trade_good_events.7.f: "Nigdy wcześniej nie widzieliśmy czegoś takiego — przemysłowcy rzucają się, by zagarnąć swój kawałek tortu, zanim będzie za późno."
 MFE_trade_good_events.7.a: "To wspaniały czas, by żyć w [SCOPE.GetRootScope.GetCountry.GetName]"
 MFE_trade_good_events.8.t: "Niska jakość wykonania"
 MFE_trade_good_events.8.d: "[SCOPE.sS('ironclad_state').GetName] szybko zyskuje złą reputację z powodu niskiej jakości wykonania eksportowanych stamtąd statków."
 MFE_trade_good_events.8.f: "Te statki nie były na wodzie nawet miesiąca, a już całkowicie pokryły się rdzą? To najlepiej świadczy o marnej jakości użytego żelaza."
 MFE_trade_good_events.8.a: "Miejmy nadzieję, że ich dostawy się poprawią"
 MFE_trade_good_events.9.t: "Niewdzięczna praca"
 MFE_trade_good_events.9.d: "Niedobór zboża w [SCOPE.sS('grain_state').GetName] zaczyna powodować problemy społeczne, a radykalne środowiska inteligencji wykorzystują ten moment, by zaatakować [SCOPE.GetRootScope.GetCountry.GetName] za niewłaściwe zarządzanie kryzysem."
 MFE_trade_good_events.9.f: "Rząd, który nie potrafi wyżywić swoich obywateli, nie powinien otrzymywać od ludu mandatu do sprawowania władzy"
 MFE_trade_good_events.9.a: "Czy oni naprawdę potrzebują jedzenia, żeby żyć?"
 MFE_trade_good_events.9.b: "Przekieruj część funduszy do [SCOPE.sS('grain_state').GetName]"
 MFE_trade_good_events.9.c: "Ostatnim razem, gdy sprawdzałem, w sklepach w [SCOPE.sS('grain_state').GetName] było pod dostatkiem ciasta"
 MFE_trade_good_events.10.t: "Cuchnące krewetki i okonie"
 MFE_trade_good_events.10.d: "Ostatnio trawlery rybackie z [SCOPE.sS('fish_state').GetName] przywożą połowy o odrażającym smaku; wszystkie rodzaje owoców morza mają tłustą, oleistą konsystencję i smakują jak gnijąca ryba."
 MFE_trade_good_events.10.f: "Fuj, czujesz ten smród? Oczywiście, że tak; ledwie wszedłeś do budynku, już chciałeś z niego wyjść. Nawet bezpańskie koty tego nie chcą."
 MFE_trade_good_events.10.a: "W jaki sposób ryba może być nazbyt rybna?"
 MFE_trade_good_events.11.t: "[SCOPE.sS('ship_state').GetName]- Stocznie"
 MFE_trade_good_events.11.d: "Kapitan portu w [SCOPE.sS('ship_state').GetName] informuje, że budowane tam okręty wojenne zostały ukończone."
 MFE_trade_good_events.11.f: "Mam nadzieję, że przyniosłeś ze sobą butelkę szampana, ponieważ wodowanie okrętu wojennego zwyczajowo wiąże się z jego chrztem."
 MFE_trade_good_events.11.a: "Fantastyczne wieści! I to przed terminem"
 MFE_trade_good_events.11.b: "W takim wypadku, będziemy potrzebować więcej szampana!"
 MFE_trade_good_events.12.t: "Tkaniny z [SCOPE.sS('fabric_state').GetName]"
 MFE_trade_good_events.12.d: "Tkaniny produkowane w [SCOPE.sS('fabric_state').GetName] zyskują międzynarodową renomę dzięki doskonałej jakości wykonania."
 MFE_trade_good_events.12.f: "Spójrz, jak materiał zmienia kolor w świetle słonecznym; myślisz, że to egipska bawełna?"
 MFE_trade_good_events.12.a: "Zawsze cieszy nas, gdy przemysł dobrze prosperuje"
 MFE_trade_good_events.12.b: "To Haute Couture!"
 MFE_trade_good_events.13.t: "Pożar w tartakach"
 MFE_trade_good_events.13.d: "Gazety w [SCOPE.sS('sawmill_fire_state').GetName] donoszą o straszliwym pożarze, który strawił znaczną część miasta."
 MFE_trade_good_events.13.f: "Stos nasiąkniętych olejem szmat zapalił się tuż na obrzeżach miasta, a powstały pożar pochłonął życie 139 osób."
 MFE_trade_good_events.13.a: "Co za tragedia! Te biedne, nieszczęsne dusze"
 MFE_trade_good_events.13.b: "Natychmiast wyślijcie pomoc!"
 MFE_trade_good_events.14.t: "Najlepsze drewno w [SCOPE.sS('hardwood_state').GetName]"
 MFE_trade_good_events.14.d: "Producenci mebli w całym [SCOPE.sS('hardwood_state').GetName] słyną z wykorzystywania twardego drewna pozyskiwanego z miejscowych lasów."
 MFE_trade_good_events.14.f: "No dalej, przyjrzyj się słojom i zapukaj w deskę... słyszysz ten dźwięk? To solidne, wytrzymałe drewno... przetrwa sto lat."
 MFE_trade_good_events.14.a: "To dobrze, prawda?"
 MFE_trade_good_events.14.b: "Brzmi świetnie! Zróbmy z tego drewna instrumenty!"
 MFE_trade_good_events.15.t: "Fala przestępczości zorganizowanej w [SCOPE.sS('grocery_state').GetName]"
 MFE_trade_good_events.15.d: "Gangi głodujących mieszkańców współpracują w [SCOPE.sS('grocery_state').GetName], napadając na warzywniaki i delikatesy."
 MFE_trade_good_events.15.f: "Kiedy funt pieczonej wołowiny kosztuje dwa razy więcej niż pół roku temu, jakie możliwości pozostają zwykłemu człowiekowi?"
 MFE_trade_good_events.15.a: "Miejmy nadzieję, że policja szybko zakończy tę sprawę"
 MFE_trade_good_events.15.b: "Wyślijmy pomoc zamiast używać siły!"
 MFE_trade_good_events.16.t: "Opłakany stan rzeczy"
 MFE_trade_good_events.16.d: "Wzrost cen bawełny sprawił, że ceny odzieży w [SCOPE.sS('clothes_state').GetName] gwałtownie wzrosły."
 MFE_trade_good_events.16.f: "No tak, zdecydowanie robi się źle. Widziałem dzieci ulicy noszące worki po mące jak tuniki i uwierz mi, to jeszcze te szczęśliwsze."
 MFE_trade_good_events.16.a: "To tragedia, ale nie mamy na to wpływu..."
 MFE_trade_good_events.16.b: "Chyba stać nas na worek po mące dla każdego..."
 MFE_trade_good_events.17.t: "Tragedia w salonie wystawowym"
 MFE_trade_good_events.17.d: "[SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName], po wizycie w fabryce mebli w [SCOPE.sS('furniture_state').GetName], nagle zasłabł, siedząc na krześle, i zmarł."
 MFE_trade_good_events.17.f: "Ogromna obecność policji w [SCOPE.sS('furniture_state').GetName] utrudnia poznanie szczegółów tego, co się wydarzyło, ale bez wątpienia jest to katastrofa."
 MFE_trade_good_events.17.a: "Czy był to nieszczęśliwy wypadek, czy też doszło do czegoś celowego?"
 MFE_trade_good_events.17.b: "Hm... Mordercze krzesło. Tego jeszcze brakuje w naszej kolekcji."
 MFE_trade_good_events.18.t: "Najlepszy papier na świecie"
 MFE_trade_good_events.18.d: "Produkcja papieru w [SCOPE.sS('paper_state').GetName] przerosła wszelkie oczekiwania, a region zyskuje renomę prawdziwego potentata."
 MFE_trade_good_events.18.f: "Jeszcze dwadzieścia lat temu w mieście nie było żadnych fabryk, a teraz jest jedna na każdym rogu."
 MFE_trade_good_events.18.a: "Sprzedamy nasze nadwyżki za taki papier, który da się złożyć, jeśli wiecie, co mam na myśli"
 MFE_trade_good_events.18.b: "Paper please!"
 MFE_trade_good_events.19.t: "Zgaście gwiazdy"
 MFE_trade_good_events.19.d: "Rosnące wykorzystanie elektryczności w [SCOPE.sS('power_state').GetName], zwłaszcza oświetlenia ulicznego, doprowadziło do wzrostu zanieczyszczenia światłem."
 MFE_trade_good_events.19.f: "Kiedyś w pogodną noc można było zobaczyć Wielki Wóz z rynku, ale teraz, jeśli chce się podziwiać niebo, trzeba wyjechać na wieś."
 MFE_trade_good_events.19.a: "Można powiedzieć, że marsz postępu niesie ze sobą niezamierzone konsekwencje"
 MFE_trade_good_events.19.b: "Wyłączcie część świateł na noc!"
 MFE_trade_good_events.20.t: "Wybuchowa sytuacja"
 MFE_trade_good_events.20.d: "Ogromna eksplozja w kopalniach siarki w pobliżu [SCOPE.sS('sulfur_state').GetName] zniszczyła teren wydobycia i zabiła setki robotników."
 MFE_trade_good_events.20.f: "Zapowiadał się zwyczajny dzień, jak każdy inny, ale potem ziemia zadrżała i rozległ się potworny huk..."
 MFE_trade_good_events.20.a: "Czy jacyś ludzie zostali uwięzieni pod ziemią? To straszne"
 MFE_trade_good_events.20.b: "Gdzie jest siarka? Czy jest bezpieczna? Czy wszystko z nią w porządku?"
 MFE_trade_good_events.21.t: "Dziwne sceny w kopalni ołowiu"
 MFE_trade_good_events.21.d: "W kopalniach ołowiu w [SCOPE.sS('lead_state').GetName] doszło do wypadku; wszystko zostało stracone."
 MFE_trade_good_events.21.f: "Robotnicy wciąż próbują ratować tych, którzy zostali uwięzieni pod ziemią, ale nie wygląda to dobrze..."
 MFE_trade_good_events.21.a: "Opłakujemy tę tragiczną i bezsensowną utratę życia"
 MFE_trade_good_events.21.b: "To była nasza najważniejsza kopalnia ołowiu!"
 MFE_trade_good_events.22.t: "Przenikanie szkodliwych chemikaliów"
 MFE_trade_good_events.22.d: "Kopalnie ołowiu w pobliżu [SCOPE.sS('lead_state').GetName] zanieczyszczają lokalne zasoby wody pitnej."
 MFE_trade_good_events.22.f: "Chłopi twierdzą, że woda powoduje choroby nerek i wypadanie włosów, i proszą [SCOPE.GetRootScope.GetCountry.GetRuler.GetFullName], by w geście solidarności napił się wody z miejscowej studni."
 MFE_trade_good_events.22.a: "Nie zamierzam tego próbować! Zabierzcie ode mnie tę szklankę wody"
 MFE_trade_good_events.22.b: "To najlepsza woda, jaką kiedykolwiek piłem!"
 MFE_trade_good_events.23.t: "Początek nowej epoki"
 MFE_trade_good_events.23.d: "Cudowna substancja znana jako „kauczuk” zmienia życie wszędzie — od stolicy po wieś."
 MFE_trade_good_events.23.f: "Choć może to brzmieć jak przesada, można śmiało powiedzieć, że wkraczamy w nową epokę — z tej niezwykłej substancji można zrobić praktycznie wszystko!"
 MFE_trade_good_events.23.a: "Z zadowoleniem witamy postęp technologiczny, jaki obiecuje ten materiał"
 MFE_trade_good_events.23.b: "Po prostu produkujcie więcej!"
 MFE_trade_good_events.24.t: "Czarne złoto z [SCOPE.sS('oil_state').GetName]"
 MFE_trade_good_events.24.d: "Ilość ropy odkrytej w [SCOPE.sS('oil_state').GetName] z dnia na dzień uczyniła wielu ludzi milionerami, zwiększając zainteresowanie górnictwem w całym kraju."
 MFE_trade_good_events.24.f: "Może nie wygląda na wiele, ale mówię ci — to jest na wagę złota!"
 MFE_trade_good_events.24.a: "Nasz przemysł ciężki potrzebuje tyle ropy, ile tylko możemy zdobyć, więc to bardzo dobra wiadomość"
 MFE_trade_good_events.24.b: "Wolę prawdziwe złoto!"
 MFE_trade_good_events.25.t: "Huta stali niszczy lokalne społeczności"
 MFE_trade_good_events.25.d: "Mieszkańcy [SCOPE.sState('steel_state').GetName] zaczynają żałować powstania hut stali w mieście, ubolewając nad utratą tradycyjnego sposobu życia."
 MFE_trade_good_events.25.f: "Na początku byliśmy po prostu wdzięczni za pracę, ale szesnastogodzinne zmiany, siedem dni w tygodniu... czy tak powinno wyglądać życie?"
 MFE_trade_good_events.25.a: "Przyszłość [ROOT.GetCountry.GetName] wymaga od nas silnego przemysłu stalowego"
 MFE_trade_good_events.25.b: "Przynajmniej skróćcie im zmiany..."