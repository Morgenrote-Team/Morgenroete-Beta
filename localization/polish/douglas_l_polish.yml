 douglas.111.t: "Pierwszy Krok"
 douglas.111.d: "[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] wyposaża zespół w podstawowy sprzęt wspinaczkowy."
 douglas.111.f: "Era improwizowanych wspinaczek dobiegła końca. Pod kierownictwem [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] zespół otrzymuje swoje pierwsze standardowe wyposażenie: liny, czekany, haki wspinaczkowe i solidne plecaki. Narzędzia te nie tylko ratują życie, lecz także zmieniają samo postrzeganie gór. Wspinaczka staje się bardziej metodyczna i przemyślana. Tam, gdzie niegdyś liczyły się jedynie odwaga i siła fizyczna, teraz na pierwszy plan wysuwają się technika i przygotowanie. To skromny, lecz epokowy krok dla każdego, kto odważy się wkroczyć w bezlitosny świat lodu i skał."
 douglas.111.g: "Teraz góry należą do tych, którzy są przygotowani."
 douglas.112.t: "Połączeni Liną"
 douglas.112.d: "Nasz alpinista [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] ma nowy pomysł: aby zwiększyć bezpieczeństwo, wprowadza stałe zespoły linowe."
 douglas.112.f: "Każdy krok w górach wiąże się z ryzykiem, ale teraz nikt nie wspina się samotnie. Wprowadzenie zespołów linowych oznacza zmianę sposobu myślenia: odtąd nie jest to już samotny człowiek mierzący się z górą, lecz łańcuch wspinaczy połączonych zaufaniem i splecioną liną. Ta zmiana przynosi porządek, dyscyplinę i głębokie poczucie wspólnej odpowiedzialności. Jeśli jeden z nich upadnie, pozostali go utrzymają. Zagrożenie nie znika, lecz zostaje rozłożone na wszystkich. Góry pozostają dzikie, ale naszą odpowiedzią na ich potęgę nie jest już samotne bohaterstwo, lecz współpraca."
 douglas.112.g: "Jedna lina. Jedna wola. Jeden zespół."
 douglas.113.t: "Kruche Ciało"
 douglas.113.d: "[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] nalega na wprowadzenie systemu pierwszej pomocy dla zespołu."
 douglas.113.f: "Pęcherze, złamania, odmrożenia – góry nie znają litości. To, co niegdyś uznawano za nieodłączną część ryzyka, teraz staje się przedmiotem systematycznych działań. Niewielka apteczka, odpowiednio wykorzystana, może uratować życie. Szybko zbudowane schronienie może zapewnić cenny czas. Po raz pierwszy podstawowa wiedza medyczna staje się częścią szkolenia. Góry wciąż wymagają wszystkiego, lecz dzięki wprowadzeniu apteczek pierwszej pomocy i planów ratunkowych zespół może polegać na czymś więcej niż tylko własnej wytrwałości. Ludzkie ciało nie jest już lekceważone – teraz otacza się je ochroną."
 douglas.113.g: "Nawet najsilniejsi mogą upaść."
 douglas.114.t: "Kamień Przemawia"
 douglas.114.d: "[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] wprowadza naukowe metody w alpinizmie: wiedza geologiczna zostaje wykorzystana do usprawnienia analizy terenu."
 douglas.114.f: "To, co niegdyś wydawało się jedynie tłem – rumowiska, osady, skały – teraz staje się językiem, który można odczytać. Jeden z członków zespołu wnosi wiedzę geologiczną: warstwy skalne ujawniają ślady pradawnych ruchów, rodzaje skał ostrzegają przed lawinami, a linie uskoków pomagają wytyczać bezpieczne szlaki. Góry przestają być mitem – stają się archiwum. Nauka przybywa z notatnikami i młotkami geologicznymi, a wyprawy nagle przestają być jedynie przygodami, stając się również badaniami terenowymi. To nowy sposób postrzegania świata – cicha rewolucja."
 douglas.114.g: "Najpierw poznajmy góry, zanim zaczniemy się wspinać."
 douglas.115.t: "Oddech na Wysokościach"
 douglas.115.d: "Dlaczego nie wykorzystać doświadczeń zdobytych podczas wojny chemicznej w alpinizmie? Nowa technologia umożliwia stosowanie masek tlenowych na ekstremalnych wysokościach."
 douglas.115.f: "Powyżej pewnej wysokości powietrze staje się coraz rzadsze. Oddychanie zamienia się w walkę, a organizm zaczyna się buntować. Teraz jednak, dzięki urządzeniom mechanicznym, ludzie docierają do miejsc, które nigdy nie były im przeznaczone. Maski tlenowe – niegdyś jedynie naukowa ciekawostka – stają się standardowym wyposażeniem. Na nowo wyznaczają granice możliwości. Świat powyżej 7000 metrów staje się dostępny, choć za pewną cenę: wspinacz nie jest już naprawdę samodzielny, lecz staje się częścią systemu podtrzymywania życia. Triumf nad górą nie traci na wielkości – staje się jedynie chłodniejszy."
 douglas.115.g: "Oddychamy sztucznie, ale zwyciężamy."
 je_douglas_mountaineering_training: "Szkolenie Alpinistyczne"
 je_douglas_mountaineering_training_reason: "[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] poznaje i zdobywa znane góry na terenie naszego kraju, aby zwiększyć swoje doświadczenie i być może nauczyć się nowych umiejętności."
 douglas_stop_mountaineering_project_button: "Zakończ Projekt Alpinistyczny"
 douglas_stop_mountaineering_project_button_desc: "Zakończ swój obecny Projekt Alpinistyczny. Twój Postęp Alpinistyczny zostanie utracony."
 douglas_stop_mountaineering_project_tt: "Zdecydowano o zakończeniu projektu poprzez kliknięcie przycisku #italic Zakończ Projekt Alpinistyczny#!."
 douglas.104.t: "Góra w Nas Samych"
 douglas.104.d: "Po pięciu wyczerpujących latach wspinaczki i treningów [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] powraca."
 douglas.104.f: "Góry nie mają głosu, a jednak potrafią uczyć. Przez pięć długich lat nasz alpinista zmagał się ze ślepotą śnieżną, kruszącymi się ścianami skalnymi, przenikliwym wiatrem i ciszą, która tnie głębiej niż jakiekolwiek ostrze. Każda trudność utrwalała jednak wiedzę w mięśniach, a cierpliwość w każdym oddechu. To, co zaczęło się jako ambicja, z czasem przerodziło się w umiejętności zahartowane doświadczeniem. Alpinista nauczył się wsłuchiwać w głos skał, przewidywać burze po zapachu powietrza i wiązać węzły z zamkniętymi oczami i spokojnym sercem. [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetSheHe|U] powraca jako odmieniony człowiek. To początek prawdziwego mistrzostwa."
 douglas.104.g: "[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetSheHe|U] nie zdobywa już gór – [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetSheHe] je rozumie."
