 douglas.211.t: "Szczyt"
 douglas.211.d: "Po wyczerpującej wspinaczce grupa alpinistów wreszcie dociera na szczyt. [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] jako pierwszy zdobywa to miejsce na Ziemi w imieniu [ROOT.GetCountry.GetNameNoFormatting]. Teraz nie pozostaje nic innego, jak delektować się tą chwilą triumfu."
 douglas.211.f: "„Pierwsze pytanie, jakie mi zadacie i na które muszę spróbować odpowiedzieć, brzmi: «Jaki jest pożytek ze wspinaczki na Mount Everest?». Moja odpowiedź musi być natychmiastowa: «Nie ma z tego żadnego pożytku». Nie ma najmniejszej nadziei na osiągnięcie jakiejkolwiek korzyści.\n\nOwszem, być może dowiemy się czegoś o zachowaniu ludzkiego organizmu na wielkich wysokościach, a specjaliści medycyny zdołają wykorzystać nasze obserwacje na potrzeby lotnictwa. Ale poza tym nic z tego nie wyniknie. Nie przywieziemy ani odrobiny złota czy srebra, ani jednego klejnotu, ani węgla czy żelaza. Nie znajdziemy nawet skrawka ziemi, na którym można by uprawiać rośliny dostarczające pożywienia. Nie ma z tego żadnego pożytku.\n\nJeśli więc nie potraficie zrozumieć, że w człowieku tkwi coś, co odpowiada na wyzwanie rzucone przez tę górę i każe mu wyjść mu naprzeciw, że ta walka jest walką samego życia, które nieustannie pnie się wzwyż, wciąż wyżej i wyżej, to nie zrozumiecie, dlaczego tam wyruszamy. To, co zyskujemy dzięki tej przygodzie, jest po prostu czystą radością.\n\nA przecież radość jest ostatecznym celem życia. Nie żyjemy po to, by jeść i zarabiać pieniądze. Jemy i zarabiamy pieniądze po to, by móc cieszyć się życiem. Oto jego sens i cel”. – George Leigh Mallory"
 douglas.211.g: "Cieszmy się świtem!"
 douglas.212.t: "Wspinaczka Przerwana"
 douglas.212.d: "Próba zdobycia szczytu przez [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] zakończyła się na razie niepowodzeniem. Nasz alpinista jest zmuszony porzucić przedsięwzięcie i zawrócić."
 douglas.212.f: "Istnieje wiele powodów, dla których alpinista rezygnuje z dalszej wspinaczki. Czasem wystarczy nagła zmiana pogody, a czasem droga na szczyt, która początkowo wydawała się dostępna, okazuje się zbyt zdradliwa. Wspinaczka często trwa zbyt długo i przekracza wyznaczone ramy czasowe, ponieważ określone pory dnia i zmieniające się warunki mogą utrudnić lub wręcz uniemożliwić dalsze podejście. A czasem po prostu wybiera się niewłaściwą drogę."
 douglas.212.g: "Rozczarowujące"
 douglas.213.t: "Katastrofa Alpinistyczna!"
 douglas.213.d: "Podczas wspinaczki w górach na terenie [SCOPE.sState('douglas_location_scope').GetName] [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] popełnił fatalny błąd, który doprowadził do katastrofy. Kilka osób poniosło śmierć, a wraz z nimi w przepaść runęły zapasy i sprzęt. Cały naród jest wstrząśnięty!"
 douglas.213.f: "„Każdej nocy, rozumiecie, widzę moich towarzyszy z Matterhornu, jak jeden po drugim osuwają się na plecy z wyciągniętymi ramionami, w idealnym porządku, w równych odstępach – najpierw przewodnik Croz, potem Hadow, następnie Hudson, a na końcu Douglas. Tak, zawsze będę ich widział...” – Edward Whymper"
 douglas.213.g: "Tragedia!"
 douglas_mountaineering_expedition_cost_modifier: "Koszt Wyprawy Górskiej"
 douglas.201.t: "Wyprawa Górska – Poziom 1"
 douglas.201.d: "Klub Alpinistyczny wybrał szereg gór, na których zdobycie można się pokusić, dysponując jedynie najbardziej podstawowym sprzętem alpinistycznym."
 douglas.202.t: "Wyprawa Górska – Poziom 2"
 douglas.202.d: "Klub Alpinistyczny wybrał szereg gór, na których zdobycie można się pokusić, dysponując standardowym sprzętem alpinistycznym."
 douglas.203.t: "Wyprawa Górska – Poziom 3"
 douglas.203.d: "Klub Alpinistyczny wybrał szereg gór, na których zdobycie można się pokusić, dysponując dobrym sprzętem alpinistycznym."
 douglas.204.t: "Wyprawa Górska – Poziom 4"
 douglas.204.d: "Klub Alpinistyczny wybrał szereg gór, na których zdobycie można się pokusić, dysponując wysokiej jakości sprzętem alpinistycznym."
 douglas.205.t: "Wyprawa Górska – Poziom 5"
 douglas.205.d: "Klub Alpinistyczny wybrał szereg gór, na których zdobycie można się pokusić, dysponując najlepszym sprzętem alpinistycznym."
