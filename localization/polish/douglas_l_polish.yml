 je_douglas_mountaineering_expedition: "Wyprawa Górska"
 je_douglas_mountaineering_expedition_reason: "[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName], nasz alpinista, prowadzi obecnie zespół na wyprawę, której celem jest zdobycie po raz pierwszy szczytu #V [AddLocalizationIf( Scope.Var('douglas_mountain_expedition_var').IsSet , Scope.Var('douglas_mountain_expedition_var').GetFlagName)]#!. Celem jest dokonanie pierwszego wejścia na szczyt. Tempo wspinaczki zależy w dużej mierze od jego doświadczenia i cech charakteru. W zależności od stopnia trudności góry mogą pojawić się poważniejsze zagrożenia. Jeśli wyprawa nie osiągnie celu w określonym czasie, [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName] przerwie próbę zdobycia szczytu. Jeśli z jakiegokolwiek powodu wyprawa znajdzie się w obliczu największego możliwego niebezpieczeństwa, dojdzie do najgorszego."
