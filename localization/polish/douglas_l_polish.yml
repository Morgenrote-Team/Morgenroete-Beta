 ACHIEVEMENT_GROUP_douglas_achievement_group: "Osiągnięcia Douglasa"
 ACHIEVEMENT_douglas_president: "Wzgórze Kapitolińskie"
 ACHIEVEMENT_DESC_douglas_president: "Zostań Prezesem Klubu Alpejskiego."
 ACHIEVEMENT_douglas_seven: "Korona Ziemi"
 ACHIEVEMENT_DESC_douglas_seven: "Zdobądź siedem szczytów górskich."
 ACHIEVEMENT_douglas_everest: "Ostatnie Życzenie Mallory’ego"
 ACHIEVEMENT_DESC_douglas_everest: "Zdobądź Mount Everest przed 1953 rokiem."
 je_douglas_mount_everest_expedition_preparation: "Przygotowania do Wyprawy na Mount Everest"
 je_douglas_mount_everest_expedition_preparation_reason: "Zdobycie najwyższej góry świata wymaga nie tylko wybitnego alpinisty, ale także wszechstronnych przygotowań. Im lepiej przygotujemy się do wspinaczki, tym mniejsze będzie początkowe ryzyko."
 je_douglas_mount_everest_expedition: "Ekspedycja na Mount Everest"
 je_douglas_mount_everest_expedition_reason: "Mount Everest jest królem gór. Postęp wyprawy mierzy się tutaj wyłącznie na podstawie wyników poszczególnych wydarzeń. To, czy alpinista odniesie sukces, zależy od jego umiejętności. Ponieważ początkowe ryzyko związane ze zdobywaniem Mount Everestu jest bardzo wysokie, można założyć, że przed wyruszeniem wyprawa zasięgnęła wszechstronnych porad naukowych, aby zapobiec sytuacji, w której drobne niedopatrzenia mogłyby doprowadzić do katastrofy."
 je_mount_everest_metereologist_tt: "#default_text [GetPlayer.GetName] posiada [concept_curie_physicist] z cechą #V $curie_meteorologist$#! [concept_character_trait].#!"
