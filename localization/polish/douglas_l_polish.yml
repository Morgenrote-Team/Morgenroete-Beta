 douglas.210.t: "Wsparcie Naukowe"
 douglas.210.d: "Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] zaoferował pomoc [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis] asystenta w badaniu budowy geologicznej góry podczas wyprawy."
 douglas.210.f: "List został napisany starannym pismem, a jego pieczęć pozostała nienaruszona aż do tej chwili. Profesor [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] proponuje w nim tymczasowe oddelegowanie [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis] najbardziej obiecującego asystenta – cichego, spostrzegawczego młodzieńca, obdarzonego talentem do klasyfikacji minerałów i analizy nachylenia stoków. Profesor liczy na szczegółowe sprawozdania. Asystent przybywa wyposażony w pręty pomiarowe, notatniki i nieposkromioną ciekawość. Niewiele wie o wspinaczce, ale za to doskonale zna się na skałach."
 douglas.210.g: "Powitaj asystenta."
 douglas.214.t: "Górska Symfonia"
 douglas.214.d: "Zainspirowany niedawnym sukcesem [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName], [ROOT.Var('elgar_composer_var').GetCharacter.GetFullName] ogłasza, że [ROOT.Var('elgar_composer_var').GetCharacter.GetSheHe] pragnie skomponować wielkie dzieło muzyczne poświęcone górom i walce człowieka z naturą. Świat muzyczny już teraz jest zgodny, że będzie to dzieło o wielkim znaczeniu."
 douglas.214.f: "Symfonia alpejska op. 64 to poemat symfoniczny kompozytora Richarda Straussa, którego prawykonanie odbyło się w 1915 roku. Dzieło opiera się na zamyśle kompozytora, by za pomocą środków muzycznych przedstawić wejście na alpejski szczyt i powrót do doliny w ciągu jednego dnia. Pomysł na program utworu sięga wydarzenia z dzieciństwa Straussa. Latem 1879 roku, podczas wędrówki na górę Heimgarten w Alpach Bawarskich, stracił on oparcie pod nogami i został zaskoczony przez burzę. Następnego dnia odtworzył to przeżycie przy fortepianie. Z tego wspomnienia narodziła się koncepcja dzieła. Kompozytor pragnął, aby słuchacz mógł bezpośrednio, niemal wszystkimi zmysłami, doświadczyć kolejnych etapów górskiej wędrówki poprzez muzyczny obraz dźwiękowy. Zdaniem wielu krytyków muzycznych dzieło osiąga ten cel w imponujący sposób."
 douglas.214.g: "Oby tylko nie było w niej rogów alpejskich."
 douglas.215.t: "Od Szczytu do Nauki"
 douglas.215.d: "Jeden z uczestników wyprawy postanowił obrać nową drogę. Poruszony tym, czego [ROOT.Var('agassiz_geologist_var').GetCharacter.GetSheHe] był świadkiem w wysokich górach, [ROOT.Var('agassiz_geologist_var').GetCharacter.GetFullName] rozpoczyna karierę w geologii."
 douglas.215.f: "Gdy śnieg skrzypiał pod butami [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis], a słońce wschodziło ponad poszarpanymi szczytami, w [ROOT.Var('agassiz_geologist_var').GetCharacter.GetFullName] zaszła głęboka przemiana. Warstwy skalne, milcząca potęga pofałdowanych pokładów i ślady działalności wulkanicznej – wszystko to wyryło się w pamięci [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis] głębiej niż wspomnienie jakiegokolwiek szczytu. Po zejściu z gór, gdy pozostali świętowali, [ROOT.Var('agassiz_geologist_var').GetCharacter.GetSheHe] poszukiwał książek, map i młotków geologicznych. Wyprawa pozostawiła po sobie coś więcej niż zatkniętą flagę – rozbudziła umysł."
 douglas.215.g: "Zachęć [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis] do dalszych studiów!"
 douglas.221.t: "Łatwa Wspinaczka"
 douglas.221.d: "Zespół alpinistów bez większych trudności posuwa się naprzód podczas próby zdobycia #V [AddLocalizationIf( Scope.Var('douglas_mountain_expedition_var').IsSet , Scope.Var('douglas_mountain_expedition_var').GetFlagName)]#!. Nie dochodzi do żadnych godnych uwagi wydarzeń."
 douglas.221.f: "„Szczęśliwy jest ten, kto w pełni życia miał okazję choć przez pewien czas doświadczać otoczenia, którego najbardziej pragnął. W dzisiejszych czasach niepokojów i gwałtownych przemian, gdy podstawowe wartości dnia dzisiejszego stają się jutro próżnymi i rozwianymi marzeniami, wiele przemawia za filozofią, która nakazuje żyć pełnią życia, póki nadarza się ku temu sposobność. Niewiele jest skarbów o trwalszej wartości niż doświadczenie takiego sposobu życia, który sam w sobie przynosi całkowite spełnienie. Ostatecznie bowiem są to jedyne dobra, których nie może nam odebrać żaden los ani żadna kosmiczna katastrofa. Nic nie zdoła zmienić faktu, że choćby przez jedną chwilę w wieczności naprawdę żyliśmy”. – Eric Shipton"
 douglas.221.g: "Naprzód"
 douglas.222.t: "Zbocze"
 douglas.222.d: "[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] dostrzega niewielkie zbocze w górach, jednak nie powinno ono stanowić większego problemu dla wspinaczy."
 douglas.222.f: "Im wyżej wspina się zespół alpinistów, tym większe napotyka wyzwania. Zbocze może stanowić przeszkodę, ale nie powinno sprawić większych trudności wyprawie wyposażonej w odpowiednio dobry sprzęt."
 douglas.222.g: "Zespół poradzi sobie z tą przeszkodą."
 douglas.222.h: "To zbyt ryzykowne."
 douglas.223.t: "Stroma Ściana"
 douglas.223.d: "Urwisko stanowi poważną przeszkodę dla wspinaczy zmierzających na szczyt, jednak [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] jest przekonany, że [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetSheHe] poradzi sobie z tym wyzwaniem."
 douglas.223.f: "Na wysokości od 2000 metrów zespół alpinistów może napotkać urwiska. W przypadku niższych gór stanowią one ostatnią przeszkodę przed szczytem, lecz często są jedynie rozgrzewką przed dalszymi trudnościami. Od tego momentu zwykła górska wędrówka zaczyna różnić się od prawdziwej wspinaczki wysokogórskiej."
 douglas.224.t: "Lawina!"
 douglas.224.d: "Na zboczach #V [AddLocalizationIf( Scope.Var('douglas_mountain_expedition_var').IsSet , Scope.Var('douglas_mountain_expedition_var').GetFlagName)]#! zeszła niebezpieczna lawina, zagrażając powodzeniu wyprawy. Zwały śniegu i skalnego rumowiska blokują teraz bezpośrednią drogę na szczyt. Znalezienie alternatywnej trasy mogłoby być bezpieczniejsze, lecz kosztowałoby cenny czas. Niektórzy wspinacze proponują przeczekać, choć istnieje ryzyko, że szlak zostanie jeszcze bardziej zasypany."
 douglas.224.f: "Lawiny schodzą z pokrytych śniegiem górskich zboczy i od niepamiętnych czasów stanowią zagrożenie dla wszystkich mieszkańców górskich krain, nie tylko dla zdobywców szczytów. Ich zdradliwa natura kosztowała już życie wielu ludzi. Od tej chwili okaże się, kto naprawdę sprosta wyzwaniu."
 douglas.224.g: "To nie zdoła zachwiać prawdziwym alpinistą."
 douglas.224.h: "Poszukaj alternatywnej trasy."
 douglas.225.t: "Przepaść"
 douglas.225.d: "Przed [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] otwiera się niebezpieczny wąwóz, gdy [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetSheHe] dociera do ostatniej formacji skalnej. Ta pozornie niemożliwa do pokonania przeszkoda stanowi poważne wyzwanie dla alpinistów."
 douglas.225.f: "„Alpinizm jest sztuką zdobywania gór poprzez stawianie czoła największym niebezpieczeństwom z największą rozwagą. Sztuka oznacza tutaj zastosowanie wiedzy w praktyce. Nie można wiecznie pozostawać na szczytach. Trzeba z nich również zejść. Jaki więc jest w tym sens? Otóż taki: ten, kto jest na górze, wie, co znajduje się na dole, lecz ten, kto jest na dole, nie wie, co znajduje się na górze. Człowiek wspina się i widzi. Schodzi i już nie widzi, ale zapamiętał to, co zobaczył. Podczas wspinaczki zwracaj uwagę na wszystkie trudności napotykane na swojej drodze. W czasie zejścia nie będziesz już ich dostrzegać, lecz jeśli uważnie je obserwowałeś, będziesz wiedzieć, że tam są”. – René Daumal"
 douglas.226.t: "Śmiertelny Krok"
 douglas.226.d: "Tuż przed szczytem [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] staje przed jeszcze jednym, ostatecznym wyzwaniem: urwisko wznoszące się niemal pionowo przed [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetHerHim] zadecyduje o zwycięstwie lub porażce. Wśród wspinaczy krążą już pogłoski, że to śmiertelna pułapka — albo śmiertelny krok."
 douglas.226.f: "„Po godzinie miarowego marszu dotarliśmy do podnóża najgroźniej wyglądającej przeszkody na grani – skalnego progu wysokiego na jakieś czterdzieści stóp. Zdawaliśmy sobie sprawę, że na tej wysokości może on przesądzić o sukcesie lub porażce. Sama skała, gładka i niemal pozbawiona chwytów, mogłaby stanowić ciekawe wyzwanie na niedzielne popołudnie dla grupy doświadczonych wspinaczy w Krainie Jezior, lecz tutaj była barierą, której pokonanie przekraczało nasze nadwątlone siły. Nie widziałem sposobu, by obejść ją od zachodu, gdzie wznosiło się strome skalne urwisko, ale na szczęście pozostawała jeszcze jedna możliwość. Po jej wschodniej stronie znajdował się kolejny ogromny nawis śnieżny, a przez całą wysokość czterdziestostopniowego progu biegła wąska szczelina między nawisem a skałą. Pozostawiłem Tenzinga, by asekurował mnie najlepiej, jak potrafił, po czym wcisnąłem się w tę szczelinę. Następnie, kopiąc nogami do tyłu, wbiłem kolce raków głęboko w zamarznięty śnieg za plecami i odepchnąłem się od podłoża. Wykorzystując każdy najmniejszy chwyt skalny oraz całą siłę kolan, barków i ramion, jaką zdołałem z siebie wykrzesać, dosłownie piąłem się tyłem w górę szczeliny, wbijając raki w śnieg i żarliwie modląc się, aby nawis nie oderwał się od skały”. – Edmund Hillary"
 douglas.226.i: "To zupełnie beznadziejne!"
 douglas.227.t: "Zmiana Pogody"
 douglas.227.d: "Zmiana pogody w górach na terenie [SCOPE.sState('douglas_location_scope').GetName] stawia alpinistów w obliczu śmiertelnego zagrożenia. Wciąż istnieje szansa na dotarcie do bardziej osłoniętego miejsca na większej wysokości, jednak jest to niebezpieczne przedsięwzięcie. W obozie bazowym alpiniści znaleźliby bezpieczne schronienie, lecz oznaczałoby to zaprzepaszczenie postępów poczynionych w ciągu ostatnich kilku dni, a może nawet tygodni."
 douglas.227.f: "Zmiany pogody w górach należą do najgroźniejszych zjawisk, jakie mogą wystąpić podczas górskiej wyprawy. Dotyczy to zarówno deszczu, burz, jak i opadów śniegu. Szczególnie na największych wysokościach nagłe opady śniegu mogą wymusić przerwanie próby zdobycia szczytu, ponieważ nieprzewidywalne żywioły mogą doprowadzić do tragedii."
 douglas.227.g: "To nie zdoła zachwiać prawdziwym alpinistą."
 douglas.227.h: "Wracajmy do ostatniego obozu!"
 douglas.228.t: "Obryw Skalny!"
 douglas.228.d: "Nagłe osunięcie się ziemi uderzyło w obóz. Kilku wspinaczy zostało rannych, a niezbędny sprzęt przepadł!"
 douglas.228.f: "Zaczęło się od ostrego trzasku, po którym rozległ się ogłuszający huk. Zbocze górujące nad biwakiem osunęło się niczym budząca się ze snu bestia. Skały, pył i ogromne głazy runęły w dół przerażającą kaskadą. Jeden z tragarzy został trafiony kamieniem, lina uległa rozerwaniu, a skrzynia z zapasami roztrzaskała się na drzazgi. Ci, którym udało się umknąć w bezpieczne miejsce, w milczeniu wpatrują się teraz w zniszczenia. Nikt nie mówi tego na głos, ale wszyscy wiedzą, że mogło się to skończyć tragedią. Trasa wydawała się bezpieczna, lecz góry nie są niczyim przyjacielem."
 douglas.228.g: "Zabezpiecz obóz i udziel pomocy rannym."
 douglas.229.t: "Przyprawiające o Zawrót Głowy Wysokości"
 douglas.229.d: "W miarę zbliżania się do szczytu rozrzedzone górskie powietrze i odsłonięte granie zaczynają dawać się wspinaczom we znaki."
 douglas.229.f: "Niebo pozostaje ciemne nawet w samo południe, a powietrze jest niezwykle rozrzedzone. Każdy krok sprawia wrażenie dźwigania ogromnego głazu. Oddech staje się krótki i płytki, a wiatr zdaje się wyrywać duszę prosto z płuc. Niektórzy zbyt długo wpatrują się w rozciągającą się poniżej przepaść, aż zaczynają drżeć im kolana. Inni doznają halucynacji: słyszą głosy dobiegające z lodu i widzą cienie przemykające po śniegu. Tutaj góry nie znają litości – pozostają jedynie wysokość, wiatr i cisza. Na tej wysokości nawet odwaga zaczyna zamarzać."
 douglas.229.g: "Naprzód, z pochylonymi głowami."
 douglas.229.h: "Czas na odpoczynek."
 douglas.230.t: "Odczytywanie Zapisów w Kamieniu"
 douglas.230.d: "Nasz asystent geologiczny przeprowadził szczegółową analizę terenu i zidentyfikował ukryte zagrożenia, zanim mogły doprowadzić do tragedii."
 douglas.230.f: "Podczas gdy pozostali rozpakowywali liny i sprawdzali swoje buty, geolog badał skały. Warstwa po warstwie, ziarno po ziarnie, asystent Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] dostrzegał drobne pęknięcia, subtelne zmiany zabarwienia i nachylenie warstw osadowych. „To zbocze jest niestabilne” – mruknął, wskazując drogę, która dotąd wydawała się bezpieczna. I miał rację. Niewielka grupa zwiadowcza potwierdziła ślady wcześniejszego osunięcia się ziemi. Dzięki jego skrupulatności i spokojnej dokładności trasę zmieniono w porę, być może ratując w ten sposób ludzkie życie. Góry mogą być ogromne, lecz ci, którzy przyglądają się im uważnie, potrafią odczytać ich tajemnice."
 douglas.230.g: "Zaufaj nauce."
 douglas.231.t: "Nauka o Górach"
 douglas.231.d: "Nieznane dotąd wysokości #V [AddLocalizationIf( Scope.Var('douglas_mountain_expedition_var').IsSet , Scope.Var('douglas_mountain_expedition_var').GetFlagName)]#! dostarczają asystentowi geologicznemu całego szeregu nowych spostrzeżeń, które zbiera i zapisuje podczas górskiej wyprawy."
 douglas.231.f: "Już na wczesnych etapach wypraw górskich naukowcy często badali niezwykłą florę i faunę danego obszaru. Szczególne zainteresowanie budziły badania geologiczne – nie tylko ze względów czysto naukowych, lecz także dlatego, że często pomagały ułatwić przyszłe wspinaczki."
 douglas.231.g: "Dla Nauki!"
 douglas.232.t: "Piękny Minerał"
 douglas.232.d: "Grupa alpinistów zaczęła już narzekać na opieszałość geologa, który jako naukowiec stanowił dla nich raczej ciężar niż pomoc. Okazało się jednak, że podczas wspinaczki na szczyt odkrył rzadki minerał."
 douglas.232.f: "Mężczyźni już od godziny czekali na uczonego, który zatrzymał się gdzieś na zboczu i nagle wyciągnął swoje narzędzia. Początkowo kręcili głowami z dezaprobatą, lecz w końcu postanowili połączyć nieprzyjemne z pożytecznym i przyspieszyć porę posiłku, aby nie marnować niepotrzebnie czasu. Asystent Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] nie zamierzał jednak ani jeść, ani dołączyć do pozostałych. Kiedy [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] zagroził, że wyprawa będzie kontynuowana bez geologa, ten niespodziewanie powrócił do grupy – z połyskującym kamieniem w dłoni."
 douglas.232.g: "Cóż za miła niespodzianka."
 douglas.233.t: "Zagubione Zwierzę"
 douglas.233.d: "W niższych partiach Himalajów nasz przyrodnik [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] dokonuje niezwykłego odkrycia: samotne, porzucone zwierzę błąka się po okolicy, cierpiąc z głodu i zimna."
 douglas.233.f: "Dla [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName] widok tak małego, delikatnego stworzenia, które zazwyczaj zamieszkuje bambusowe lasy Nepalu, na tym opustoszałym pustkowiu był czymś niezwykłym. [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetSheHe|U] znał to zwierzę z ilustracji w książkach i wiedział, że żyje ono w pobliskich lasach. Ale jak samotne zwierzę mogło dotrzeć aż tutaj? Pokonać tak wielką odległość? Bez pożywienia? Pozostawało to zagadką. Czy mała panda ruda również zapragnęła przeżyć górską przygodę? A może uciekała przed drapieżnikami? Tak czy inaczej, alpinista otacza wyczerpane zwierzę opieką i pomaga mu odzyskać siły. Ustalono, że asystent naukowy zabierze pandę rudą do obozu bazowego, a następnie przygotuje ją do podróży do miejscowego ogrodu zoologicznego."
 douglas.233.g: "Czy to legendarne 43. zwierzę?"
