 je_mount_everest_good_physician_tt: "#default_text [GetPlayer.GetName] posiada [concept_panum_physician] z cechą #V $panum_physician_experienced$#! lub #V $panum_physician_famous$#! [concept_character_trait].#!"
 je_mount_everest_good_ethnologist_tt: "#default_text [GetPlayer.GetName] posiada [concept_roy_ethnologist] z cechą #V $roy_ethnologist_experienced$#! lub #V $roy_ethnologist_famous$#! [concept_character_trait]."
 je_mount_everest_good_geologist_tt: "#default_text [GetPlayer.GetName] posiada [concept_agassiz_geologist] z cechą #V $agassiz_geologist_experienced$#! lub #V $agassiz_geologist_famous$#! [concept_character_trait].#!"
 douglas.401.t: "U Stóp Świętej Góry"
 douglas.401.d: "Wyprawa dociera w Himalaje i musi teraz wybrać drogę na szczyt świata."
 douglas.401.f: "[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName] rozwinął mapę i rozłożył ją na skale. Dwie trasy. Dwie możliwości.\n\nNa północy: znany szlak przez Tybet. Zgody dyplomatyczne, wcześniejsze pomiary terenu i widmo poprzednich wypraw.\n\nNa południu: zakazana dolina Nepalu. Nieznany teren, pogłoski o gniewie bogów. A jednak tamtejsze zbocza mogłyby okazać się łagodniejsze.\n\nNie mogli wybrać obu dróg.\n\nGóra pozwalała tylko na jedną próbę."
 douglas.401.g: "Podążaj trasą północnej ściany."
 douglas.401.h: "Podążaj trasą południowej ściany."
 douglas.411.t: "Zakazana Dolina"
 douglas.411.d: "Po miesiącach negocjacji wyprawa przekracza granicę Nepalu, aby podjąć próbę zdobycia Czomolungmy od południa."
 douglas.411.f: "Nazywano ją „zakazaną doliną”. Przez dziesięciolecia żaden cudzoziemiec nie zapuścił się dalej niż do ostatniego posterunku w Darjeelingu. Lecz tamtego ranka mgły się podniosły, a [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName] wraz z zespołem przemknął za ostatnią grań.\n\nRzeka wijąca się przez las nie była już zaznaczona na żadnej mapie. Nie było tam żadnych ścieżek. Jedynie kozie szlaki i przyciszone głosy dochodzące z pobliskich wiosek. Nawet szerpa wydawał się niespokojny. Nocą wiatr niósł dźwięk inny niż wszystko, co [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetSheHe] słyszał w Alpach czy Andach — cichą, głęboką ciszę, która zdawała się spływać prosto z samych lodowców. Ludzie mówili niewiele. Zwierzęta juczne stawały się coraz bardziej niespokojne. A lekarz odnotował pierwsze przypadki choroby wysokościowej znacznie wcześniej, niż się spodziewano. Mimo to nikt nie zawrócił. Bo za drzewami, za mgłą, za ostatnim zakrętem doliny, wznosiło się południowe zbocze Everestu — nietknięte od tej strony.\n\nByło piękne. I wyglądało tak, jakby chciało ich zabić."
 douglas.411.g: "Na tej trasie nie ma żadnych dróg."
 douglas.412.t: "Seraki Ponad Nami"
 douglas.412.d: "Wyprawa dociera do podnóża lodospadu Khumbu – labiryntu lodowych bloków i ziejących szczelin."
 douglas.412.f: "Lodowiec poruszał się w ciszy. Trzeszczał, przesuwał się i wzdychał pod ich stopami niczym żywa istota. [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName] widział już wcześniej lód, ale nigdy taki jak ten. Nie były to alpejskie zbocza, lecz ogromne lodowe monolity, puste w środku i przechylone, błękitne niczym zamarznięte płuca i równie kruche.\n\nW południe temperatura wzrosła. Z lewej strony dobiegł głuchy trzask, potem kolejny, aż wreszcie blok lodu wielkości domu oderwał się i runął w dół niczym roztrzaskujące się szkło. Szerpowie rozpierzchli się na wszystkie strony. Jeden z mężczyzn stracił oparcie pod nogami w pobliżu szczeliny lodowcowej i został odciągnięty w ostatniej chwili. Mapa okazała się bezużyteczna. Liny zamarzały i pękały. Promienie słoneczne topiły stopnie wykute w lodzie szybciej, niż wspinacze zdołali się po nich wspinać.\n\nNie pokonali jeszcze nawet połowy drogi.\n\nMogli ruszyć naprzód, licząc, że lodowiec wytrzyma. Albo wycofać się i spróbować ponownie przed świtem, gdy mróz utrzymywał lód w bezruchu.\n\nJednak każda godzina stracona tutaj oznaczała kolejną godzinę mniej na przebywanie w rozrzedzonym powietrzu powyżej ośmiu tysięcy metrów."
 douglas.412.g: "Naprzód. Przybyliśmy tutaj, by się wspinać."
 douglas.412.h: "To przeszkoda nie do pokonania."
 douglas.413.t: "Biały Piec"
 douglas.413.d: "Zespół wkracza do Kotła Zachodniego (Western Cwm) – rozległej doliny lodowcowej otoczonej strzelistymi ścianami lodu, od których ze wszystkich stron odbijają się promienie słoneczne."
 douglas.413.f: "To miał być łatwiejszy odcinek. Płaski teren, krótka chwila wytchnienia przed ścianą Lhotse. Ale nikt nie ostrzegł ich przed upałem.\n\nDo południa Kocioł Zachodni zamienił się w piec. Śnieg pod butami przeobraził się w breję. Okulary przeciwsłoneczne parowały albo pękały. Lodowe ściany po obu stronach odbijały promienie słońca w dół z oślepiającą jasnością, aż wspinacze mieli wrażenie, że idą po rozżarzonym szkle. [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName] próbował coś powiedzieć, ale [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetSheHe] nie czuł już [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetHerHis] języka.\n\nJeden z tragarzy upadł. Inny zwymiotował. Odmrożenia ustąpiły miejsca poparzeniom słonecznym. Lodowiec jęczał pod stopami, jakby miał im za złe ich ciężar. Nie było wiatru, nie było dźwięku, nie było cienia — tylko blask, żar i narastające poczucie, że żywcem się gotują na dachu świata.\n\nA jednak ściana przed nimi wciąż ich przyzywała. Ściana Lhotse wznosiła się przed nimi, błękitna i pionowa.\n\nCzekać oznaczało tracić więcej czasu, więcej żywności i więcej sił.\n\nIść naprzód oznaczało zaryzykować w starciu ze słońcem."
 douglas.413.g: "Naprzód. Nie możemy się teraz zatrzymać."
 douglas.413.h: "Przerwijmy to szaleństwo."
 douglas.414.t: "Błękitna Ściana"
 douglas.414.d: "Aby dotrzeć na Przełęcz Południową, zespół musi wspiąć się po stromej i odsłoniętej ścianie Lhotse w coraz trudniejszych warunkach."
 douglas.414.f: "To nie była już wspinaczka – to było mozolne pełzanie w górę, wbrew samej sile grawitacji. Lód pod ich stopami był twardy jak marmur i błękitny niczym stal. [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName] wbijał w niego raki obiema nogami, zatapiał czekan i modlił się, by ten wytrzymał. Każdy krok zajmował całe minuty. Każdy oddech był walką.\n\nDaleko w dole Kocioł Zachodni lśnił zwodniczym spokojem. Nad nimi ściana ciągnęła się bez końca. Wiatr powrócił – nie jako burza, lecz suchy, szorstki świst, który wysysał ciepło aż do szpiku kości. Liny zamarzały. Palce sztywniały. Nie było jednak miejsca na najmniejszy błąd. Jedno poślizgnięcie mogło pociągnąć w przepaść trzech ludzi.\n\nKtoś zakaszlał za [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName]. Krew na śniegu. Jeden z Szerpów słabł. Zbyt wysoko, zbyt szybko. Ale zaszli już za daleko, by się wycofać.\n\nŚciana nie dawała schronienia. Nie pozwalała odpocząć. Pozostawała tylko wspinaczka.\n\nA grań ponad nimi wydawała się równie odległa jak dwie godziny wcześniej."
 douglas.414.g: "Wspinajmy się dalej. Zaszliśmy zbyt daleko, by teraz zawrócić."
 douglas.414.h: "Uciekajcie, głupcy!"
 douglas.415.t: "Ostatni Obóz"
 douglas.415.d: "Zespół dociera na Przełęcz Południową. Przed nimi pozostaje już tylko grań szczytowa i podjęcie ostatecznej decyzji."
 douglas.415.f: "Przypominało to obozowanie na Księżycu. Powietrze było przeszywająco zimne, a wiatr bezlitosny. Namioty drżały pod każdym podmuchem niczym ranne zwierzęta. Żadnych ptaków, żadnych głosów, nawet trzaskania lodowca. Tylko płytkie, chrapliwe oddechy. Przełęcz Południowa nie była miejscem odpoczynku – była miejscem oczekiwania na chwałę albo śmierć.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName] siedział zgarbiony wewnątrz płóciennego namiotu, wpatrując się w mapę drżącą dłonią. Droga na szczyt była jasna: wzdłuż południowo-wschodniej grani, aż na sam dach świata.\n\nJednak tlen powoli się kończył. Zapasy malały. Palce były poczerniałe od odmrożeń. Jeden z mężczyzn nie odezwał się ani słowem od wschodu słońca.\n\nPaliwa wystarczało tylko na jedno podejście. Jedną, ostatnią próbę. Szczyt znajdował się mniej niż 1000 metrów przewyższenia dalej, lecz w strefie śmierci równie dobrze mógł być oddalony o tysiąc mil.\n\nNa zewnątrz wiatr wył niczym żywa istota. Nadszedł czas podjęcia decyzji.\n\nW górę albo w dół.\n\nPrzeżyć albo spróbować."
 douglas.415.g: "Rozpocznij próbę zdobycia szczytu."
 douglas.415.h: "Przerwij wspinaczkę. Ocalmy życie, by móc powrócić w przyszłym roku."
 douglas.416.t: "Stopień [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName]"
 douglas.416.d: "Tuż pod szczytem niespodziewana przeszkoda blokuje ostatni odcinek grani – pionowa ściana skał i lodu."
 douglas.416.f: "Słońce jeszcze nie wzeszło. Grań szczytowa jaśniała blado w przedświcie i przez chwilę [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName] wierzył, że droga stoi otworem. Powietrze było zbyt rozrzedzone, by mówić. Wiatr przenikał przez rękawice i gogle. Ale wtedy – zatrzymało ich to.\n\nPionowa ściana. Dziesięć, może dwanaście metrów. Zbyt stroma, by ją obejść pieszo, zbyt odsłonięta, by próbować ją ominąć. Pojedynczy, pionowy monolit przecinał grań niczym ostrze – nie było tam lin, haków ani żadnej drogi. Nie było go na mapach. Nie wspominała o nim żadna relacja. Nikt ich o nim nie uprzedził.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName] wpatrywał się w ścianę. Warstwa śniegu stawała się coraz cieńsza. To był granit, czarny i pokryty szronem. Jeden z Szerpów spróbował zbadać lewą stronę – pionowy uskok. Inny ruszył w prawo – nic poza niebem.\n\nGóra zachowała na koniec jeszcze jedną sztuczkę. Jeszcze jedną, ostatnią przeszkodę.\n\nNie było drogi dookoła. Tylko ponad nią.\n\nPóźniej nazwą ją imieniem tego, który ujrzał ją jako pierwszy."
 douglas.416.g: "Pokonaj Stopień [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName]."
 douglas.416.h: "To zbyt niebezpieczne. Zawracamy."
 douglas.421.t: "Zakazana Ściana"
 douglas.421.d: "Po uzyskaniu zgody lokalnych władz wyprawa wyrusza na Mount Everest, aby podjąć próbę zdobycia szczytu od północy, przez dolinę Rongbuk."
 douglas.421.f: "Nie było żadnego powitania, tylko wiatr. Flagi modlitewne trzepotały, jakby utraciły swoje barwy. Mnisi spoglądali ze wzgórz niczym duchy, nieruchomi i milczący. Szlak kończył się tam, gdzie zaczynał się lodowiec, a lodowiec prowadził wprost w ciszę.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName] znał relacje poprzedników. Mallory, Norton, Finch. Ich mapy były niekompletne, a notatki zagadkowe. Ale góra stała dokładnie tam, gdzie ją opisywali: strzelista, szara i surowa.\n\nJaki zatrzymały się w pobliżu klasztoru Rongbuk. Odtąd wszystko musieli nieść na własnych plecach. Wyprawa przestała być jedynie teoretycznym przedsięwzięciem. Teraz liczyły się skały, lód i wysokość. Niebo nad nimi wydawało się kruche i rozrzedzone. Śnieg nie padał – zdawał się wisieć w powietrzu. Nocą lodowiec trzeszczał niczym pradawna istota przewracająca się we śnie.\n\nJeden z tragarzy wyszeptał coś o bogu zamieszkującym górę, którego gniewu wciąż nie udało się ułagodzić.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName] nie poprosił o tłumaczenie."
 douglas.421.g: "Północ udziela pozwolenia – ale nie wita z otwartymi ramionami."
 douglas.422.t: "Lodowiec Pęka"
 douglas.422.d: "Lodowiec Wschodni Rongbuk ujawnia swoje niebezpieczeństwa – walące się seraki i ukryte szczeliny lodowcowe zagrażają dalszemu marszowi karawany."
 douglas.422.f: "Słońce ledwie zdążyło ogrzać dno doliny, gdy rozległ się pierwszy dźwięk – głuchy, przeciągły trzask dobiegający z głębi lodu. Potem kolejny. Mężczyźni zastygli w bezruchu. Jaki zaczęły się niepokoić. Z urwisk nad nimi osuwały się powoli płaty śniegu, wydając cichy syk.\n\nZ daleka Lodowiec Wschodni Rongbuk wyglądał na nieruchomy, lecz z bliska okazywał się labiryntem błękitnych grzbietów lodowych, pól szczelin i przechylonych wież lodowych. Każdy krok był zgadywaniem. Każdy odcisk buta – ryzykiem.\n\nPróbowali obejść grań od lewej strony. Lód się załamał. Jeden z tragarzy zniknął bezgłośnie. Drugi zawisł na linie, krzycząc rozpaczliwie. Jego raki drapały gładki lód, nie znajdując żadnego oparcia. Wyciągnęli go na powierzchnię – zakrwawionego, z szeroko otwartymi oczami. Przez długi czas nikt nie wypowiedział ani słowa.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName] spojrzał przed siebie. Pozostały jeszcze trzy kilometry lodowca, zanim teren stanie się bardziej płaski. Mogli ruszyć naprzód – natychmiast, jak najszybciej – albo się wycofać, przeczekać do chłodniejszych godzin i spróbować ponownie, gdy lód stwardnieje.\n\nAle pogoda zaczynała się zmieniać. Chmury przetaczały się po niebie niczym dudniące bębny. Zwłoka mogła oznaczać nadejście burzy."
 douglas.423.t: "Lodowa Ściana"
 douglas.423.d: "Aby dotrzeć na Przełęcz Północną, zespół musi wspiąć się po stromym, odsłoniętym lodowym zboczu, smaganym wiatrem i spowitym cieniem."
 douglas.423.f: "Trasa zaczęła piąć się stromo w górę. Jęzor lodowca, twardy jak żelazo, prowadził wprost ku niebu. Przełęcz Północna majaczyła nad nimi niczym obietnica wykuta w lodzie. Nie było jednak żadnego szlaku – tylko zbocze, wiatr i strach.\n\nIm wyżej się wspinali, tym silniejszy stawał się wiatr. Nie wył – wrzeszczał. Zdzierał śnieg ze ściany i ciskał im go w twarze niczym odłamki szkła. Punkty asekuracyjne nie trzymały się lodu. Liny sztywniały. Słońce zniknęło za chmurami, jakby ze wstydu.\n\nJeden z mężczyzn się poślizgnął. Jego krzyk był krótki. Utrzymali go – ledwie. Ale lina była już postrzępiona. A grań powyżej wydawała się wcale nie bliższa.\n\nNiektórzy Szerpowie odmówili dalszej wspinaczki, klękając na śniegu i szepcząc modlitwy do niewidzialnych bóstw.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName] stał u podnóża ostatniego stromego odcinka. Linia grani majaczyła wysoko nad nimi niczym halucynacja. Mogli siłą przedrzeć się na górę albo zejść, odpocząć i spróbować ponownie, dysponując mocniejszymi linami i przy łagodniejszej pogodzie.\n\nJednak zwłoka groziła nadejściem burz. Albo czymś jeszcze gorszym – zwątpieniem."
 douglas.424.t: "Na Granicy Oddechu"
 douglas.424.d: "Zespół zakłada ostatni obóz powyżej Przełęczy Północnej, wystawiony na działanie wiatru i przytłaczającą potęgę górującego nad nim szczytu."
 douglas.424.f: "Nie było żadnego schronienia. Tylko wiatr i odgłos płuc rozpaczliwie poszukujących powietrza, którego niemal już nie było. Namioty uginały się do środka pod każdym podmuchem, jakby sama góra próbowała ich pochłonąć.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName] wczołgał się do śpiwora wciąż pokrytego szronem. Termometr był bezużyteczny. Zimno przestało być liczbą – stało się nieodłącznym elementem egzystencji. Żadnego ognia. Żadnego apetytu. Tylko dreszcze i nieustanny syk tlenu przepływającego przez pokrywające się lodem zawory do masek tlenowych.\n\nJeden z Szerpów przestał się odzywać. Siedział nieruchomo, z otwartymi oczami. Jego palce poszarzały. Inny wciąż szeptał coś o domu, choć nikt go o nic nie pytał.\n\nZnajdowali się już powyżej 8000 metrów. W strefie śmierci. Mięśnie przestały się regenerować. Organizm wyniszczał sam siebie, by utrzymać się przy życiu. Nawet każdy oddech wymagał świadomego wysiłku.\n\nPrzed nimi rozciągała się grań szczytowa. Albo dotrą do niej jutro, albo już nigdy nie będą mogli o niej opowiedzieć."
 douglas.425.t: "Drugi Stopień"
 douglas.425.d: "Tuż poniżej szczytu zespół dociera do pionowej ściany skał i lodu – największej przeszkody na północnej grani."
 douglas.425.f: "Wyrastał z grani niczym ściana przeznaczona dla olbrzymów. Wysoki na dziesięć metrów, czarny, pionowy i pokryty szronem. Drugi Stopień.\n\nNikt ich przed nim nie ostrzegł. Nie zaznaczono go na żadnej mapie.\n\nTutaj droga się kończyła. Po jednej stronie rozciągała się przepaść głęboka na tysiąc metrów. Po drugiej znajdowała się wąska półka skalna, niewiele szersza od buta. Wiatr szarpał ich kurtkami. Tlen syczał w maskach niczym para.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName] spojrzał w górę. Nie było żadnego widocznego chwytu. Żadnej szczeliny. Tylko gładka skała, śliska od zamarzniętej wilgoci wydychanego powietrza. Szerpa odmówił dalszej wspinaczki. Pozostali czekali z zapadniętymi oczami, zbyt wyczerpani, by cokolwiek powiedzieć.\n\nJeden z mężczyzn zaproponował, by spróbować bez plecaków. Inny zaoferował, że wejdzie pierwszy i zamocuje linę. Ale nie mieli już żadnych lin.\n\nDotarli do miejsca, w którym ludzie zawracali. Albo znikali bez śladu."
 douglas.425.g: "Podejmij próbę wspinaczki na Drugi Stopień."
 douglas.425.h: "Zawróć. To już koniec."
 douglas.431.t: "Dach Świata"
 douglas.431.d: "[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] dociera na szczyt Czomolungmy – jako pierwszy człowiek, który stanął na dachu świata."
 douglas.431.f: "Nie było wiatru. Nie było żadnego dźwięku. Tylko skrzypienie śniegu pod butami [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetHerHis] i przejmująca cisza świata pozostawionego za sobą.\n\nOstatnie kroki wydawały się snem. Płuca płonęły, wzrok się zamazywał, ciało drżało – i nagle nad głową nie było już niczego.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName] stał samotnie na szczycie, a promienie słońca rozpalały śniegi niczym płomienie. Daleko w dole chmury dryfowały niczym oceany. Szczyty, które niegdyś wydawały się potężne, teraz przypominały pognieciony pergamin.\n\nZiemia zakrzywiała się na horyzoncie. Czas stanął w miejscu. Pozostała tylko jedna, jedyna chwila, wyryta w lodzie i niebie, w którym brakowało tchu."
 douglas.431.g: "Trzeci Biegun należy do nas."
 douglas.432.t: "Góra Czeka"
 douglas.432.d: "W obliczu poniesionych strat, wyczerpania i gasnącej nadziei wyprawa zostaje przerwana, zanim uda się dotrzeć na szczyt."
 douglas.432.f: "Żadna decyzja nie przychodziła łatwo. To nie burza, odmrożenia ani głód położyły kres wyprawie. Zadecydowała cisza panująca wokół ogniska. Spojrzenia, które już się nie podnosiły. Ludzie, którzy przestali pytać „jak daleko?”, a zaczęli pytać „po co?”.\n\nMapy były podarte, a liny zesztywniałe od lodu. Tragarze szeptali modlitwy w ciemnościach. Nawet [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName] nie spoglądał już na szczyt – patrzył jedynie w niebo.\n\nZakopali to, czego nie mogli zabrać ze sobą. Na kopcu kamieni poniżej przełęczy pozostawili flagę.\n\nPodczas długiego zejścia nikt się nie odzywał. Lecz w ich milczeniu nie było wstydu."
 douglas.432.g: "Niepowodzenie na Evereście nie oznacza porażki. Jedynie opóźnienie."
 douglas.433.t: "Nigdy Nie Powrócili"
 douglas.433.d: "Po ostatniej próbie zdobycia szczytu nie nadeszła już żadna wiadomość. Góra zachowała milczenie."
 douglas.433.f: "Ostatni sygnał nadszedł o zmierzchu. Błysk światła na grani. Sylwetka poruszająca się tuż pod linią nieba. A potem – nic.\n\nPrzez wiele dni przeszukiwali zbocza góry. Szerpowie przeczesywali lodowiec. Ani liny. Ani rękawicy. Tylko ślady rozwiewane przez wiatr, prowadzące donikąd.\n\nNikt nie wiedział, jak daleko zdołali dotrzeć. Czy zdobyli szczyt. Czy spojrzeli z góry na świat i ujrzeli go w całej okazałości.\n\nJedno było pewne: nie powrócili.\n\nNiektórzy twierdzili, że spadli w przepaść. Inni, że spoczywają tuż pod śniegiem, z ramieniem wyciągniętym ku niebu.\n\nLecz nieliczni szeptali coś jeszcze – że góra ich przyjęła. I że wciąż tam pozostają, pośród lodu i skał, czekając, aż ktoś podąży ich śladem."
 douglas.433.g: "Wyprawa przechodzi do legendy."
 douglas_third_pole_modifier: "Trzeci Biegun"
 douglas_mount_everest_physicist_button: "Prognozy Pogody w Himalajach"
 douglas_mount_everest_physicist_button_desc: "Zmienna pogoda często była w przeszłości przyczyną niepowodzenia wypraw. Fizyk posiadający cechę meteorologa mógłby obliczyć odpowiedni termin wyprawy, w którym podczas próby zdobycia szczytu panowałyby najlepsze warunki widoczności."
 douglas_mount_everest_engineer_button: "Ulepszone Zaopatrzenie w Tlen"
 douglas_mount_everest_engineer_button_desc: "Wykorzystanie butli tlenowych podczas wspinaczki na ekstremalnych wysokościach wciąż znajduje się w powijakach. Inżynier mógłby udoskonalić tę eksperymentalną technologię, opracowując lepsze urządzenie."
 douglas_mount_everest_physician_button: "Badania nad Chorobą Wysokościową"
 douglas_mount_everest_physician_button_desc: "Choroba wysokościowa jest uważana za jedno z niebezpiecznych następstw wspinaczki w Himalajach. Doświadczony lekarz mógłby dokładniej zbadać to schorzenie."
 douglas_mount_everest_ethnologist_button: "Miejscowi Szerpowie"
 douglas_mount_everest_ethnologist_button_desc: "Najlepsze drogi na himalajskie szczyty można odnaleźć dzięki wiedzy miejscowej ludności, która zna te tereny najlepiej. Etnolog mógłby zwerbować doświadczonego Szerpę jako towarzysza wyprawy."
 douglas_mount_everest_geologist_button: "Badania Geologiczne"
 douglas_mount_everest_geologist_button_desc: "Geolog może sporządzić profil geologiczny góry, wyznaczyć bardziej obiecujące trasy prowadzące na szczyt, a także zaproponować lepsze sposoby jego zdobycia."
 douglas_mount_everest_risk_decrease_tt: "Początkowe ryzyko podczas wspinaczki na Mount Everest jest niższe."
 douglas.402.t: "Prognoza Pogody"
 douglas.402.d: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] przedstawia pierwszy długoterminowy model prognozowania pogody dla Himalajów – na kilka dni przed wyruszeniem wyprawy [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName]."
 douglas.402.f: "Przez wiele miesięcy fizyk pracował w milczeniu. Wykresy. Dane barometryczne. Pomiary wiatrów z Indii. I teoria – być może rewolucyjna, lecz niezwykle spójna: potężne wiatry Azji Środkowej podążały sezonowymi korytarzami, a nie chaotycznymi ścieżkami.\n\nTeraz, z rękawami poplamionymi kredą i popękanymi opuszkami palców, Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] stanął przed komisją alpinistyczną i wskazał na arkusz papieru: ciąg ręcznie wykreślonych izobar, pozwalających przewidzieć dziesięciodniowe okno pogodowe wzdłuż grani Himalajów.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName] zmrużył [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetHerHis] oczy. „I jest pan tego pewien?”\n\nFizyk poprawił okulary.\n\n„Tak pewien, jak tylko można być, gdy ma się do czynienia z górą”."
 douglas.402.g: "Wykorzystaj prognozę pogody, aby wybrać odpowiedni termin wspinaczki."
 douglas.403.t: "Tlen dla Strefy Śmierci"
 douglas.403.d: "Dr. [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] prezentuje nowy aparat tlenowy, zaprojektowany z myślą o przetrwaniu na dużych wysokościach."
 douglas.403.f: "Dotychczas korzystanie z tlenu powyżej 8000 metrów było jedynie eksperymentem – niewygodnym, syczącym ciężarem przytroczonym do pleców ludzi, którzy ledwo byli w stanie chodzić. Nieszczelne zawory. Zamarznięte przewody. Butle zbyt ciężkie dla ramion ludzi z trudem łapiących oddech.\n\n[ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] odmienił ten stan rzeczy.\n\nDzięki regulatorom ciśnienia dostrojonym z mikroskopijną precyzją, izolowanym przewodom i modułowemu systemowi uprzęży nowe urządzenie ważyło o połowę mniej i zapewniało dwukrotnie większą stabilność przepływu tlenu. Butle można było teraz nosić pod ubraniem, co zapobiegało ich zamarzaniu. Maska przylegała do twarzy niczym druga skóra nurka.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName] uniósł urządzenie dłonią w rękawicy i skinął głową. „Czy będzie działać powyżej 26 000 stóp?”\n\nInżynier się uśmiechnął.\n\n„Zbudowano je po to, by działało tam, gdzie wszystko inne zawodzi”."
 douglas.403.g: "Wyposaż zespół w ulepszony system."
 douglas.404.t: "Niewidzialne Zagrożenie"
 douglas.404.d: "Dr. [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] wyjaśnia zespołowi, jak rozpoznawać chorobę wysokościową i zapobiegać jej podczas wspinaczki."
 douglas.404.f: "Odmrożenia byłyby widoczne. Na upadki można było się przygotować. Ale to – to było coś zupełnie innego.\n\n[ROOT.Var('panum_physician_var').GetCharacter.GetLastName] stanął przed uczestnikami wyprawy i zaczął opisywać objawy: ból głowy, duszności, subtelne zaburzenia świadomości prowadzące do podejmowania fatalnych w skutkach decyzji.\n\n„Zaczyna się jak upojenie alkoholowe” – powiedział [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] – „ale kończy jak utonięcie”.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName] słuchał w milczeniu. Była to recepta na przetrwanie."
 douglas.404.g: "Ściśle przestrzegaj zaleceń lekarza."
 douglas.405.t: "Człowiek, Który Zna Góry"
 douglas.405.d: "Dzięki dyskretnym negocjacjom i znajomości miejscowej kultury Dr. [ROOT.Var('roy_ethnologist_var').GetCharacter.GetLastName] zapewnia wyprawie wsparcie doświadczonego Szerpy, którego wiedza o zboczach Mount Everestu nie ma sobie równych."
 douglas.405.f: "Nie nosił ze sobą map. Nie mówił zbyt dobrze po angielsku. A jednak kiedy wskazywał drogę, góra zdawała się odpowiadać.\n\nTo [ROOT.Var('roy_ethnologist_var').GetCharacter.GetLastName] go odnalazł – nie na liście nazwisk, lecz w spokojnej wiosce oddalonej o dwie doliny.\n\n„Dotarł wyżej niż ktokolwiek z nas” – powiedział etnolog – „i niejednokrotnie stamtąd powrócił”.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName] wyciągnął rękę. Szerpa uścisnął ją w milczeniu. Bez ceremonii. Bez wahania.\n\n„Być może badał pan szczyt” – szepnął Dr. [ROOT.Var('roy_ethnologist_var').GetCharacter.GetLastName] – „ale on rozmawiał z jego cieniem”."
 douglas.405.g: "Zatrudnij doświadczonego Szerpę jako głównego przewodnika."
 douglas.406.t: "Kości Góry"
 douglas.406.d: "Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] bada teren i odkrywa bezpieczniejszą drogę na szczyt, prowadzącą przez pradawne formacje geologiczne."
 douglas.406.f: "[ROOT.Var('agassiz_geologist_var').GetCharacter.GetSheHe|U] przesunął palcami po czarnych smugach na skale i powoli skinął głową. Najpierw łupek krystaliczny, potem gnejs, a następnie skupisko spękanego wapienia. Linie uskoków niczym blizny. Fałdy skalne przypominające zamarznięte fale.\n\n„Góra nie jest nieruchoma” – powiedział geolog. „Po prostu porusza się powoli”.\n\nPrzez wiele godzin Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] szedł przed zespołem z młotkiem geologicznym w dłoni, opukując skały, nasłuchując i odczytując ich strukturę. Uczony wyznaczył trasę wzdłuż grani, która pozwalała ominąć niebezpieczny lodospad. Odkrył też inną, prowadzącą ukośnie przez rumowisko skalne wystawione na działanie wiatru, co pozwalało skrócić wspinaczkę o dwa dni.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName] przyglądał się temu w milczeniu.\n\n„Potrafi pan przewidzieć, co wytrzyma?”\n\nDr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] wzruszył ramionami.\n\n„Nie” – odparł [ROOT.Var('agassiz_geologist_var').GetCharacter.GetSheHe]. „Ale potrafię powiedzieć, co wytrzymało przez ostatnie dziesięć milionów lat”.\n\nA czasami to wystarczało."
 douglas.406.g: "Postępuj zgodnie z zaleceniami geologa."
 douglas.121.t: "Odwaga Zahartowana w Ojczyźnie"
 douglas.121.d: "Lata treningów w [ROOT.GetCountry.GetAdjective] górach zaszczepiły spokój tam, gdzie niegdyś panowało wahanie. [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] powraca z pewniejszą ręką i odważniejszym sercem."
 douglas.121.f: "„Kiedyś uważałem, że strach jest czymś, co trzeba przezwyciężyć” – powiedział [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetSheHe]. „Ale prawda jest taka, że trzeba nauczyć się z nim żyć, nie pozwalając, by nami rządził”.\n\nPrzez wiele miesięcy [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] przemierzał granie i lodowce ojczystych gór – samotnie, w milczeniu, często powracając na te same szlaki, by dostrzec to, co wcześniej umknęło uwadze.\n\nSzczyty nie stały się wyższe, lecz [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetSheHe] wyrósł ponad własne ograniczenia. Obrywy skalne, mróz i śnieżne zamiecie ograniczające widoczność do zera stały się znajomymi przeciwnikami. I choć żadna z tych wspinaczek nie trafiła na pierwsze strony gazet, każda pozostawiła po sobie ślad – nie w sławie, lecz w odwadze."
 douglas.121.g: "Niech nadejdą kolejne wyzwania na wysokościach."
 douglas.122.t: "Ani Jeden Krok na Marne"
 douglas.122.d: "Tam, gdzie inni zawracali, [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] po prostu szedł dalej. Nawet niepowodzenia stawały się źródłem motywacji, a każdy przebyty szlak – cenną lekcją."
 douglas.122.f: "Szczyt nigdy nie był najważniejszy. A przynajmniej nie do końca.\n\nNa jednej z grani burza rozpętała się, zanim [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetSheHe] dotarł do ostatniego odcinka wspinaczki. Na innej lawina zatarła szlak w ciągu jednej nocy. Czasami kończyły się zapasy żywności albo przewodnicy rezygnowali z dalszej wyprawy. Ale [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetSheHe] nie ustępował. Powracał. Dostosowywał się do okoliczności.\n\nGóra nie poddaje się uporowi. Potrafi jednak docenić wytrwałość.\n\nPrzez wiele miesięcy [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] zdobywał znajome szczyty nieznanymi dotąd drogami – badał nowe podejścia, wypróbowywał sprzęt i sporządzał mapy ukrytych półek skalnych. To, co inni uznawali za bezowocne powtarzanie tych samych prób, stało się fundamentem czegoś trudniejszego do zdobycia niż chwała: niezłomnej wytrzymałości."
 douglas.122.g: "Żaden szlak przebyty po raz drugi nie jest już taki sam."
 douglas.123.t: "Poza Granicami Znanych Map"
 douglas.123.d: "Ciekawość pchnęła [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] poza szlaki, którym ufali inni. Tam, na niezbadanych obszarach, [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetSheHe] odnalazł cel – i drogę do jego osiągnięcia."
 douglas.123.f: "Stare mapy wyznaczały granice nie tylko ziem, lecz także ludzkiej wiedzy. Większość alpinistów nie przekraczała tych granic. Ale nie [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName].\n\nPodczas gdy inni podążali utartymi szlakami, [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetSheHe] zapuszczał się dalej – na rozpadające się granie, których nikt nie naniósł na mapy, w bezimienne doliny i ku urwiskom zbyt odległym od jakichkolwiek miast, by przyciągać turystów czy poszukiwaczy chwały.\n\nPodczas jednej z takich wypraw [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetSheHe] rozbił obóz w pobliżu zapomnianego lodowca, skatalogował warstwy skalne wskazujące na pradawne ruchy tektoniczne i sporządził mapę wąwozu, o którym miejscowi opowiadali szeptem, lecz do którego nigdy nie odważyli się wejść. Nie było to pierwsze zdobycie szczytu. Był to jednak pierwszy krok ku zrozumieniu tego miejsca."
 douglas.123.g: "Nie ma większej radości niż odkrycie czegoś, czego nikt się nie spodziewał."
 douglas.124.t: "Stal i Kamień"
 douglas.124.d: "Kiedy [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] spotkał generała [SCOPE.sCharacter('douglas_general_scope').GetLastName], doświadczenie zderzyło się z instynktem – a obaj wyszli z tego spotkania odmienieni."
 douglas.124.f: "[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetSheHe|U] miał postawę człowieka przywykłego do przekrzykiwania huku artyleryjskich nawałnic, a jego mundur wciąż nosił ślady alpejskiego śniegu. Generał [SCOPE.sCharacter('mountain_general').GetFullName] walczył na dużych wysokościach, prowadził żołnierzy przez mróz i ciszę, a góry postrzegał nie jako przeszkodę, lecz jako pole bitwy.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] przybył, aby uczyć się od [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetHerHim]. Jednak już po kilku dniach stało się jasne, że obaj mogą się wiele od siebie nauczyć.\n\n„My planujemy kampanie wojskowe. Wy planujecie, jak przetrwać” – mruknął generał, gdy [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetSheHe] przyglądał się hakom wspinaczkowym i mapom wysokościowym.\n\n„Pan dowodzi armiami” – padła odpowiedź. „Ja przemieszczam się samotnie. Ale góry osądzają nas obu jednakowo”."
 douglas.124.g: "Góra uczy wszystkich, choć do każdego przemawia innym językiem."
