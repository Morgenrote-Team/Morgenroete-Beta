 douglas.101.t: "Założono Klub Alpinistyczny"
 douglas.101.d: "[SCOPE.sCharacter('douglas_president_scope').GetFullName] rzuca wyzwanie – a góry odpowiadają na jego wezwanie. Założenie Klubu Alpinistycznego wyznacza początek nowej ery dla wszystkich, którzy pragną sięgać coraz wyżej."
 douglas.101.f: "Wyprawy [SCOPE.sCharacter('douglas_president_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('douglas_president_scope').GetLastName] prowadziły [SCOPE.sCharacter('douglas_president_scope').GetHerHim] przez burze i lawiny – lecz teraz [SCOPE.sCharacter('douglas_president_scope').GetSheHe] pragnie przekazać dalej [SCOPE.sCharacter('douglas_president_scope').GetHerHis] dziedzictwo. W [ROOT.GetCountry.GetCapital.GetCityHubName] [SCOPE.sCharacter('douglas_president_scope').GetSheHe] zakłada Klub Alpinistyczny [GetPlayer.GetName], nie samodzielnie, lecz u boku obiecującego młodego adepta: [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName], początkującego alpinisty o bystrym spojrzeniu i żelaznej woli. [SCOPE.sCharacter('douglas_president_scope').GetFullName] dostrzega w [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetHerHim] nie tylko ambicję, lecz także przyszłą legendę. Razem stają u progu drogi prowadzącej nie tylko na górskie szczyty, ale również ku chwale, odwadze – a być może nawet ku zapisaniu się na kartach historii. Klub otwiera swoje podwoje przed wszystkimi, którzy słyszą zew gór. Rozpoczyna się wspinaczka."
 douglas.101.g: "Góry wzywają duszę odkrywcy!"
 douglas.102.t: "Klub Alpejski"
 douglas.102.d: "Klub Alpejski został oficjalnie założony w [ROOT.GetCountry.GetCapital.GetCityHubName] w [TimeKeeper.GetCurrentDate.Format('y')] roku i jest uznawany za pierwszą na świecie międzynarodową organizację alpinistyczną. Jego powstanie wyznacza początek nowoczesnego alpinizmu jako zorganizowanej dyscypliny."
 douglas.102.f: "Historycznie rzecz biorąc, w 1857 roku grupa brytyjskich dżentelmenów zebrała się w Londynie, aby założyć klub poświęcony alpinizmowi. Pod przewodnictwem takich postaci jak John Ball i Edward Kennedy Klub Alpinistyczny postawił sobie za cel promowanie systematycznej eksploracji Alp, łącząc wyzwania fizyczne z badaniami geograficznymi i przyrodniczymi. Klub stworzył zorganizowane ramy wymiany wiedzy, organizowania wypraw oraz budowania poczucia wspólnoty wśród alpinistów. Jego członkowie odegrali kluczową rolę w okresie, który później nazwano „Złotym Wiekiem Alpinizmu”, dokonując licznych pierwszych wejść na szczyty i dokumentując swoje doświadczenia. Wkrótce potem rozpoczęto wydawanie czasopisma „Alpine Journal”, które przyczyniło się do rozwoju rodzącej się literatury alpinistycznej. Założenie Klubu Alpinistycznego położyło fundamenty pod rozwój zorganizowanego alpinizmu na całym świecie i ustanowiło trwałe standardy eksploracji górskiej."
 douglas.102.g: "Razem na szczyt!"
