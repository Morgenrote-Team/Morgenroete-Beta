 douglas.103.t: "Pułk Piechoty Górskiej"
 douglas.103.d: "Dzięki [SCOPE.sCharacter('douglas_mountain_veteran').GetHerHis] imponującemu doświadczeniu w zdobywaniu górskich szczytów i obronie terenów górskich [SCOPE.sCharacter('douglas_mountain_veteran').GetFullName] postanowił wykorzystać swoje wyjątkowe umiejętności do utworzenia elitarnej jednostki wojsk górskich."
 douglas.103.f: "Gebirgsjäger, Alpini czy Chasseurs Alpins to tylko kilka przykładów elitarnych formacji wojskowych z różnych krajów, wyspecjalizowanych w prowadzeniu działań wojennych w górach. Utworzeni w 1872 roku Alpini są najstarszą na świecie nadal aktywną formacją piechoty górskiej. Ich pierwotnym zadaniem była ochrona granic Włoch z Francją i Austro-Węgrami."
 douglas.103.g: "Będą nieść jego dziedzictwo w przyszłość."
