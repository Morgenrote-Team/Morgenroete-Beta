 douglas.209.t: "Zaawansowany Sprzęt"
 douglas.209.d: "Już na początku wspinaczki na #V [AddLocalizationIf( Scope.Var('douglas_mountain_expedition_var').IsSet , Scope.Var('douglas_mountain_expedition_var').GetFlagName)]#! [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] zdaje sobie sprawę, że dobrej jakości sprzęt znacznie przewyższa wymagania stawiane przez tę górę."
 douglas.209.f: "Jeśli Poziom Sprzętu podczas Wyprawy Górskiej przewyższa poziom trudności góry, zmniejsza to początkowe ryzyko wyprawy i zapewnia premię do postępu."
 douglas.209.g: "Do zobaczenia na szczycie!"
 douglas.216.t: "Demotywacja"
 douglas.216.d: "Nasz zespół alpinistów otrzymał dziś wiadomość, że inne państwo jako pierwsze zdobyło #V [AddLocalizationIf( Scope.Var('douglas_mountain_expedition_var').IsSet , Scope.Var('douglas_mountain_expedition_var').GetFlagName)]#!. W zespole pojawiają się pierwsze oznaki rozłamu. Niektórzy zawracają, a [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] otwarcie rozważa przerwanie wspinaczki."
 douglas.216.f: "Jeśli inne państwo jako pierwsze zdobędzie szczyt góry, próba jego zdobycia niemal na pewno zostanie przerwana."
 douglas.216.g: "Ta wyprawa straciła sens."
 douglas_mountaineer_speech_tt: "Wyprawa Górska potrwa o #YELLOW 60 dni dłużej#!, zanim upłynie wyznaczony limit czasu."
 douglas.208.t: "Słowa Przed Wspinaczką"
 douglas.208.d: "Przed ostatecznym podejściem na szczyt [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] przemawia do zespołu. Góra #V [AddLocalizationIf( Scope.Var('douglas_mountain_expedition_var').IsSet , Scope.Var('douglas_mountain_expedition_var').GetFlagName)]#! wznosi się majestatycznie, lecz równie donośnie rozbrzmiewa głos [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetHerHis]."
 douglas.208.f: "„Nad nami wznosi się szczyt – zimny, milczący, niewzruszony. Nie obchodzi go nasza odwaga. Nie zadaje nam pytań. A jednak odpowiadamy mu – każdym kolejnym krokiem. Tam na górze nie rozbrzmiewają bębny, nie czeka nas chwała. Jest tylko widok rozciągający się za naszymi plecami i duma z tego, że odważyliśmy się podjąć wyzwanie. Nie przybyliśmy tutaj, by spotkać się z górą. Przybyliśmy, by ją zdobyć. Każdy z was ma prawo się bać. Ale żaden strach nas nie powstrzyma. Nie dzisiaj”."
 douglas.208.g: "Razem z [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFirstName] rzucamy wyzwanie górze!"
 douglas_alpine_club_new_board_tt: "Wybrano nowy zarząd Klubu Alpejskiego."
 douglas.302.t: "Klub Alpejski: Nowy Zarząd"
 douglas.302.d: "Podczas dzisiejszego posiedzenia w [SCOPE.sState('douglas_alpine_club_state').GetStateRegion.GetCityHubName] Klub Alpejski powołał nowych członków zarządu."
 douglas.302.f: "Klub Alpejski zdecydował o następującym składzie władz:\n\n#V Prezes: [GetGlobalVariable('douglas_alpine_club_president_global_var').GetCountry.GetName|V] #!\n\n#V Zarząd: [GetGlobalVariable('douglas_alpine_club_board_member_1_global_var').GetCountry.GetName|V] [GetGlobalVariable('douglas_alpine_club_board_member_2_global_var').GetCountry.GetName|V] [GetGlobalVariable('douglas_alpine_club_board_member_3_global_var').GetCountry.GetName|V] [GetGlobalVariable('douglas_alpine_club_board_member_4_global_var').GetCountry.GetName|V] [GetGlobalVariable('douglas_alpine_club_board_member_5_global_var').GetCountry.GetName|V]"
 douglas.302.g: "Gratulujemy nowym członkom zarządu."
 douglas.302.h: "I nie doszło przy tym do żadnego przekupstwa?"
 douglas_mountaineering_international_expedition_modifier: "Niedawna Międzynarodowa Wyprawa Górska"
 douglas_mountaineering_international_expedition_setback_modifier: "Niepowodzenie w Klubie Alpejskim"
 douglas.311.t: "Propozycja Międzynarodowej Wyprawy Górskiej"
 douglas.311.d: "[SCOPE.sCountry('douglas_board_scope').GetName], będący członkiem zarządu Klubu Alpejskiego, wystąpił z wnioskiem o zorganizowanie międzynarodowej wyprawy górskiej. Kraj ten pokryłby koszty jej organizacji. Prezes klubu może jednak zawetować tę propozycję."
 douglas.311.f: "„Panowie, góry nie zważają na flagi ani granice. Wznoszą się ponad małostkowe spory narodów, niewzruszone naszymi rywalizacjami. Dlatego stoję dziś przed wami z pewną wizją: szczytu ponad polityką, ponad więzami krwi – szczytu należącego do całej ludzkości. Zgromadźmy najlepszych alpinistów z całej Europy, obu Ameryk, a nawet dalekiej Azji, i stawmy czoła górze nie jako Portugalczycy, Francuzi czy Sasi, lecz jako wspólnota ludzi, którzy mają odwagę podjąć wyzwanie. Niech będzie to triumf nie tylko siły woli i umiejętności wspinaczkowych, ale także dyplomacji, zaufania i wspólnej chwały. Niech takie będzie nasze dziedzictwo: nie podbój, lecz współpraca”."
 douglas.311.g: "Dobra propozycja."
 douglas.311.h: "Nie."
 douglas.312.t: "Weto"
 douglas.312.d: "[SCOPE.sCountry('douglas_president_scope').GetName], pełniący funkcję Prezesa Klubu Alpejskiego, ogłosił weto wobec organizacji międzynarodowej wyprawy górskiej."
 douglas.312.f: "„Wspinać się z Francuzami? Ze Szwajcarami? Wolałbym już siłować się z niedźwiedziem w kapciach. Próbowaliście kiedyś dojść do porozumienia z Anglikiem w sprawie herbaty, nie mówiąc już o namiotach? Nie, dziękuję. Ostatnim razem, gdy zaprosiliśmy zagraniczny zespół, przywieźli cztery beczki sznapsa, a zapomnieli map. Poza tym, panowie, góra nigdzie się nie wybiera – i ja również. Jeśli mamy zdobyć chwałę, niech to nasze buty odciskają ślady na śniegu, a nie uczestnicy jakiegoś pikniku Organizacji Narodów Zjednoczonych na lodowcu. Będziemy wspinać się z godnością albo wcale!”"
 douglas.312.g: "Kto w ogóle wybrał tego prezesa?"
 douglas.321.t: "Wybór Szczytu"
 douglas.321.d: "Po zatwierdzeniu międzynarodowej wyprawy klub rozpoczyna debatę nad najważniejszą kwestią: który szczyt stanie się areną walki o chwałę?"
 douglas.321.f: "Klub Alpejski może podjąć decyzję o zdobyciu dowolnego szczytu znajdującego się na terytorium kraju posiadającego klub alpinistyczny. Nie jest do tego wymagana licencja. Jednak góra musi należeć do poziomu 2, 3 lub 4."
 douglas.321.g: "Góra nie powinna być zbyt trudna."
 douglas.321.h: "Wybierzmy jedną z klasycznych gór."
 douglas.321.i: "Góra powinna stanowić wyzwanie!"
 douglas.331.t: "Wyprawa Klubu Alpejskiego"
 douglas.331.d: "Klub Alpejski ogłosił ambitny cel: zdobycie wyznaczonego szczytu przez międzynarodowy zespół wspinaczkowy złożony z czołowych członków klubu. Celem jest #V [AddLocalizationIf( Scope.Var('douglas_mountain_expedition_var').IsSet , Scope.Var('douglas_mountain_expedition_var').GetFlagName)]#!"
 douglas.331.f: "Wszyscy członkowie zarządu Klubu Alpejskiego mogą wziąć udział w międzynarodowej wyprawie górskiej organizowanej przez klub. Warunkiem uczestnictwa jest dołączenie do wyprawy aktywnego alpinisty. Międzynarodowe wyprawy mają niemal stuprocentową szansę powodzenia, jednak odbywają się niezwykle rzadko. W przypadku pomyślnego zdobycia szczytu prezesowi klubu przypisuje się pierwsze wejście i otrzymuje on największy prestiż, ale nagradzani są również wszyscy pozostali członkowie zarządu, którzy uczestniczyli w wyprawie."
 douglas.331.g: "Niech nad szczytem powiewa wspólny sztandar."
 douglas.341.t: "Wspólna Wspinaczka Narodów"
 douglas.341.d: "Flagi zostały wzniesione. Zapasy spakowane. Międzynarodowa wyprawa przygotowuje się do zdobycia szczytu, na którym nie stanął jeszcze żaden człowiek."
 douglas.341.f: "Nad obozem bazowym zapadła cisza, a w rześkim porannym powietrzu mieszały się akcenty z różnych zakątków świata. Niektórzy w milczeniu poprawiali sznurowadła swoich butów, inni wymieniali ostatnie nerwowe żarty. Na skraju obozowiska [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] stał nieruchomo, wpatrując się w spowity chmurami szczyt.\n\n„Mówią, że nikt jeszcze go nie zdobył” – mruknął Francuz, zapalając papierosa.\n\n„W takim razie najwyższy czas to zmienić” – odparła Angielka z lekkim uśmiechem."
 douglas.341.g: "Niech cały świat wspólnie zdobywa szczyty."
 douglas.351.t: "Triumfalne Zdobycie Szczytu"
 douglas.351.d: "Po wielu tygodniach zmagań udało się zdobyć szczyt. [GetGlobalVariable('douglas_alpine_club_president_global_var').GetCountry.GetName|V] objął go w posiadanie w imieniu Klubu Alpejskiego."
 douglas.351.f: "Stali ramię w ramię w rozrzedzonym górskim powietrzu, z kryształkami lodu osiadłymi na brodach i rzęsach oraz wyczerpaniem wypisanym w każdej zmarszczce ich twarzy. A jednak nikt się nie cofnął, gdy Prezes Klubu Alpejskiego rozwinął sztandar wyprawy i mocno zatknął go w śniegu.\n\nPozostali zgromadzili się wokół niego. Przygotowano aparat fotograficzny, który z ogromnym trudem wniesiono na tę niemal nieosiągalną wysokość. Za ich plecami chmury rozstąpiły się, odsłaniając dolinę rozciągającą się w dole niczym malowana mapa.\n\n„Ani drgnąć!” – powiedział fotograf. „To zdjęcie przejdzie do historii”.\n\nRozległ się trzask migawki.\n\nTa jedna fotografia miała później ozdabiać salony, sale wykładowe i strony gazet na całym świecie. Uwieczniono na niej Prezesa stojącego dumnie ze sztandarem, otoczonego przez uśmiechniętych wspinaczy o odmrożonych twarzach – zjednoczonych nie narodowością, lecz wspólnym triumfem."
 douglas.351.g: "Dla nauki, dla chwały, dla ludzkości."
 douglas_add_international_expedition_effect_tt: "#default_text [GetPlayer.GetName] kończy Wyprawę Klubu Alpejskiego"
 je_douglas_international_mountaineering_expedition_preparation: "Przygotowania do Wyprawy Klubu Alpejskiego"
 je_douglas_international_mountaineering_expedition_preparation_reason: "Wszyscy członkowie zarządu Klubu Alpejskiego mogą wziąć udział w międzynarodowej wyprawie górskiej organizowanej przez klub. Warunkiem uczestnictwa jest dołączenie do wyprawy aktywnego alpinisty. Międzynarodowe wyprawy mają niemal stuprocentową szansę powodzenia, jednak odbywają się niezwykle rzadko. W przypadku pomyślnego zdobycia szczytu prezesowi klubu przypisuje się pierwsze wejście i otrzymuje on największy prestiż, ale nagradzani są również wszyscy pozostali członkowie zarządu, którzy uczestniczyli w wyprawie.\n\nAby wziąć udział w Międzynarodowej Wyprawie, musisz dołączyć do niej poprzez opcję „Klub” w menu Alpinisty. Jest to możliwe, dopóki nie upłynie termin tego wpisu w dzienniku."
 je_douglas_international_mountaineering_expedition: "Wyprawa Klubu Alpejskiego"
 je_douglas_international_mountaineering_expedition_reason: "Sukces wyprawy górskiej organizowanej przez Klub Alpejski jest zazwyczaj niemal pewny. Jednak czas jej trwania zależy w dużej mierze od liczby uczestniczących w niej członków zarządu. W przypadku pomyślnego zdobycia szczytu prezesowi klubu przypisuje się pierwsze wejście i otrzymuje on największy prestiż, ale nagradzani są również wszyscy pozostali członkowie zarządu, którzy uczestniczyli w wyprawie."
 douglas_international_mountain_expedition_progress_bar: "Wyprawa Klubu Alpejskiego"
 douglas_international_mountain_expedition_progress_bar_desc: "Postęp ekspedycji: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]/10)"
