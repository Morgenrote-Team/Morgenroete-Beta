 douglas_mountaineer: "Alpinista"
 douglas_mountaineer_desc: "Alpinista to osoba zajmująca się wspinaczką górską, często w celach sportowych lub dla przeżycia przygody. Potrafi poruszać się w trudnym terenie i przetrwać w surowych warunkach. Alpiniści wyróżniają się wytrzymałością fizyczną, odpornością psychiczną oraz głębokim szacunkiem dla przyrody."
