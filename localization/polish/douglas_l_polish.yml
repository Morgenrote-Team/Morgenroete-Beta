 douglas.217.t: "Ślady Stóp na Śniegu"
 douglas.217.d: "„Były zbyt duże, by mogły należeć do człowieka, i zbyt głębokie, by pozostawił je irbis śnieżny” – wyjaśnił [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName] korespondentowi gazety „The Penny Illustrated Paper”. Artykuł szybko rozprzestrzenił się po herbaciarniach i salonach od Londynu po Kalkutę, wywołując tyle samo śmiechu, co zdumienia. Powiadano, że po lodowych zboczach Kabru, Kamet i Mount Everestu przemierza tajemnicze stworzenie, wysokie niczym niedźwiedź i ciche jak opadający płatek śniegu. Nawet przewodnicy Szerpowie nie mieli wątpliwości – nazywali je Metoh-Kangmi."
 douglas.217.f: "„Widziałem w tych górach wiele rzeczy – lodospady, nagłe burze, ludzi, którzy stracili palce i odnaleźli Boga. Ale przysięgam na buty Jej Królewskiej Mości, że widziałem coś, co przemknęło poza blaskiem naszego ogniska. I to coś nas obserwowało”.\n\nList od [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName], opublikowany w roku [TimeKeeper.GetCurrentDate.Format('y')]"
 douglas.217.g: "Ludzi interesują takie historie."
 douglas.217.h: "Te doniesienia szkodzą reputacji naszego alpinisty!"
