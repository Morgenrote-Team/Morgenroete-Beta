 pius.111.h_tt: "Duża szansa, że w następstwie objawienia Maryjnego wystąpią kolejne wydarzenia."
 pius.111.i_tt: "Bardzo duża szansa na krwawe starcie."
 pius.121.h_tt: "To działanie może mieć nieznane, poważne konsekwencje."
 pius.101.t: "Objawienie w La Salette"
 pius.101.d: "Dwoje dzieci w górach południowo-wschodniej Francji twierdzi, że było świadkami objawienia Matki Boskiej, wywołując fale duchowego entuzjazmu — i niepokoju — w całym katolickim świecie."
 pius.101.f: "„Podejdźcie bliżej, moje dzieci, nie bójcie się. Jestem tutaj, aby przynieść wam wielkie wieści…”\n\nWysoko w alpejskich pastwiskach ponad wioską La Salette, niedaleko Corps w południowo-wschodniej Francji, dwoje dzieci pasących owce donosi o wizji, która porusza teraz serca całego chrześcijańskiego świata. Ukazała im się kobieta promieniująca światłem i przepełniona smutkiem. Płakała — jej łzy spływały za świat, który odwrócił się od Boga. Mówiła o bluźnierstwach wypowiadanych bez wstydu, o znieważaniu niedziel oraz o nadchodzącym głodzie i zniszczeniu, jeśli ludzkość nie okaże skruchy.\n\nTo, co początkowo wydawało się prostą wiejską legendą, stało się ruchem. Pielgrzymi tłumnie przybywają na odległe górskie zbocze. Mnisi i dziennikarze wspinają się tymi samymi szlakami. Kościół waha się: jedni przyjmują wizję jako boskie wezwanie do pokuty; inni obawiają się wzrostu ludowego mistycyzmu i nieracjonalnego zapału.\n\nBiskup Grenoble wyraża ostrożną aprobatę. Władze świeckie pozostają podejrzliwe.\n\nA Rzym? Rzym obserwuje — milczący. Lecz już teraz biją dzwony."
 pius.101.g: "Ostrzeżenie z niebios"
 pius.101.h: "Pozostań racjonalny."
 pius.102.t: "Objawienie w Lourdes"
 pius.102.d: "W małym miasteczku Lourdes czternastoletnia dziewczyna twierdzi, że ujrzała promienistą kobietę w grocie. Jej wizje szybko przyciągają pielgrzymów, wzbudzają kontrowersje — oraz zwracają uwagę Rzymu."
 pius.102.f: "'Była młoda, bosa i biedna. A jednak mówiła o pięknie, którego nie da się opisać słowami.'\n\nW odległej grocie niedaleko Lourdes, u podnóża Pirenejów, wiejska dziewczyna o imieniu Bernadette Soubirous opowiada o kobiecie odzianej na biało, z błękitną szarfą i złotymi różami u stóp. Zjawa początkowo nic nie mówi — tylko się uśmiecha. Potem przemawia: o pokucie, modlitwie, cierpieniu i Bożym miłosierdziu. Przedstawia się po prostu jako: Niepokalane Poczęcie.\n\nPoczątkowo mieszkańcy wioski drwią. Lecz gdy Bernadette odkrywa ukryte źródło i twierdzi, że ma ono uzdrawiającą moc, zaczynają przybywać tysiące — z nadzieją, modlitwą i łzami. Porzucane są kule. Rozchodzą się świadectwa. Sceptycy mówią o histerii. Do Lourdes zjeżdżają lekarze, księża i politycy.\n\nKościół prowadzi dochodzenie. Państwo przygląda się temu z nieufnością. A lud wciąż napływa."
 pius.102.g: "Sanktuarium uzdrowienia i nadziei"
 pius.102.h: "Halucynacje!"
 pius.103.t: "Nieme wizja w Knock"
 pius.103.d: "W irlandzkiej wiosce Knock piętnastu świadków donosi o milczącym objawieniu Matki Boskiej, świętego Józefa i świętego Jana Ewangelisty. Wizja porusza lud dotknięty od dawna ubóstwem, wygnaniem i obcymi rządami."
 pius.103.f: "„Nie powiedzieli ani słowa. A jednak w tej ciszy cały naród usłyszał nadzieję.”\n\nNad parafialnym kościołem w Knock, w hrabstwie Mayo, nieustannie padał deszcz. A mimo to piętnastu mieszkańców wioski stało jak zahipnotyzowanych. Przed nimi, skąpane w świetle na południowej ścianie szczytowej kościoła, stało milczące zgromadzenie: Matka Boska w modlitewnej pozie; święty Józef u jej boku; święty Jan Ewangelista odziany w szaty i trzymający Ewangelię. Za nimi znajdował się baranek na ołtarzu oraz krzyż.\n\nNie padła żadna wiadomość. Nie wykonano żadnego ruchu. A mimo to świadkowie przysięgali na to, co ujrzeli — zarówno młodzi, jak i starzy, zarówno mężczyźni, jak i kobiety.\n\nW kraju wyniszczonym przez głód, emigrację i duchową tęsknotę milcząca wizja rozbrzmiała głośniej niż kazania. Wkrótce zaczęli przybywać pielgrzymi, szukając uzdrowienia, znaków i pocieszenia. Angielskie władze drwiły. Niektórzy w Kościele wahali się. Lecz wśród biednych i pobożnych mieszkańców Irlandii Knock stało się świętym wołaniem o godność."
 pius.103.g: "Światło w deszczu"
 pius.103.h: "Odrzuć to jako folklor."
 pius.104.t: "Tajemnice Fátimy"
 pius.104.d: "W środkowej Portugalii troje dzieci pasących owce donosi o powtarzających się objawieniach Matki Boskiej, których zwieńczeniem jest cudowne zjawisko obserwowane przez tysiące ludzi. Ich wizje niosą proroctwa dotyczące wojny, cierpienia i przyszłości Kościoła."
 pius.104.f: "„Na końcu moje Niepokalane Serce zatriumfuje.”\nW pobliżu miasteczka Fátima, na wiejskich wzgórzach Cova da Iria, troje dzieci — Łucja, Franciszek i Hiacynta — opowiada o Pani jaśniejszej niż słońce, odzianej w blask i smutek. Przez sześć miesięcy ukazuje się im raz za razem, ostrzegając przed wojną światową, wzrostem bezbożnych ideologii oraz prześladowaniem wiernych. Wzywa do pokuty, modlitwy i poświęcenia Rosji Jej Sercu.\n13 października 1917 roku, gdy dziesiątki tysięcy ludzi stoją w strugach deszczu, słońce zdaje się wyrwać z niebios, wirując i spadając po niebie. Niektórzy padają na kolana. Inni uciekają. Gdy światło gaśnie, ich ubrania są suche. Tłum rozchodzi się w milczeniu, pełen zachwytu i trwogi.\nKościół zachowuje ostrożność. Prasa jest podzielona. Lecz pośród ludu — zwłaszcza biednych, skrzywdzonych i wiernych — rozpala się nowy płomień: płomień nadziei, płomień ostrzeżenia, który każe widzieć w Dziewicy nie tylko matkę, lecz także strażniczkę nadchodzącej epoki."
 pius.104.g: "Wsłuchaj się w ostrzeżenia z Fátimy."
 pius.104.h: "Obal cud słoneczny."
 pius.105.t: "Matka Boża z [SCOPE.sState('pius_marian_apparition_state').GetFarmHubName]"
 pius.105.d: "W odległej wiosce niedaleko [SCOPE.sState('pius_marian_apparition_state').GetFarmHubName] pojawiają się doniesienia o objawieniu Matki Boskiej. Historia szybko się rozprzestrzenia, przyciągając pielgrzymów, sceptyków oraz uwagę władz kościelnych."
 pius.105.f: "Stała ponad polami, w koronie światła, i patrzyła na nas tak, jakby znała smutek każdej duszy.'\nPierwsze odezwało się dziecko — z oczami szeroko otwartymi z zachwytu i drżącym głosem. Opowiadało o pani jaśniejszej od świtu, spowitej blaskiem i smutkiem, która ukazała się w milczeniu i spoglądała na świat z głębokim, pełnym zrozumienia żalem. Inni również twierdzili, że ją widzieli. Niektórzy padli na kolana. Inni uciekli. Wszyscy zapamiętali ciszę, która nastała później.\nHistoria rozeszła się poza granice wioski. Przybyli pielgrzymi, ze świecami w dłoniach. Wierni się modlili. Cierpiący mieli nadzieję. Księża debatowali. Urzędnicy unosili brwi. Lecz ludzie wciąż przychodzili — przyciągani nie przez pewność, lecz przez coś starszego: potrzebę wiary.\nCzy był to cud, wizja czy mit, wydarzenie to już odcisnęło piętno na sercach tych, którzy byli jego świadkami — oraz na życiu tych, którzy muszą teraz zdecydować, co ono oznacza."
 pius.105.g: "Znak dla wiernych."
 pius.105.h: "Powstrzymaj histerię."
 pius.111.t: "Nieproszona procesja"
 pius.111.d: "Pomimo oficjalnych rozkazów zakazujących publicznych manifestacji, tłum wiernych rozpoczął spontaniczną procesję w kierunku miejsca objawienia Maryjnego w [SCOPE.sState('pius_marian_apparition_state').GetFarmHubName]."
 pius.111.f: "„Nie zapaliliśmy pochodni. Nie nieśliśmy żadnych sztandarów. Tylko różańce, ciszę i nasze stopy w pyle.”\n\nPrzybyli o świcie, po dwóch i trzech, przemierzając pola i osady, szepcząc modlitwy. Do południa były ich już setki, podążających wiejskimi drogami — niektórzy boso, niektórzy ze łzami w oczach. Kobiety trzymały kwiaty. Starcy szeptali litanie. Dzieci ściskały ikony wyrzeźbione w drewnie.\n\nWładze ogłosiły, że miejsce zostało zamknięte. Żołnierze pełnili wartę. A jednak nikt nie zatrzymał tłumu. Być może powstrzymał ich śpiew. Być może cisza. Być może coś niewidzialnego.\n\nGdy wierni dotarli do miejsca objawienia, uklękli, wyszeptali modlitwy i zapalili świece w ziemi. Nie rozległ się żaden głos z nieba. Nie ujrzano żadnego cudu. Ale coś już się zmieniło. Lud podjął działanie — nie w sprzeciwie wobec prawa, lecz w posłuszeństwie czemuś starszemu niż prawo."
 pius.111.g: "Zezwól na praktyki religijne."
 pius.111.h: "Obserwuj w ciszy."
 pius.111.i: "Rozpędź ich siłą."
 pius.112.t: "Krew na świętej ziemi"
 pius.112.d: "Starcie między władzami a wiernymi w miejscu zakazanej procesji maryjnej przerodziło się w przemoc. Ziemia, na której niegdyś wizje niosły nadzieję, nosi teraz ślad krwi."
 pius.112.f: "„Były modlitwy, a potem były krzyki.”\n\nŚwiece wciąż migotały, gdy przybyli żołnierze. Głosy wzniosły się w zamieszaniu, a potem w błaganiu. Kobieta upadła. Chłopiec krzyknął. Nikt nie wie, kto wydał rozkaz — lecz muszkiety przemówiły, pałki poszły w ruch, a buty przeszły przez kadzidło i ziemię. Gdy powróciła cisza, była cięższa niż wcześniej.\n\nKościół jest wstrząśnięty. Wierni są oburzeni. Prasa mówi przyciszonym głosem — jedni nazywają to wypadkiem, inni masakrą. Miejsce, które niegdyś szeptem nazywano świętym, jest teraz przeklęte przez pamięć. A jednak ludzie wciąż się gromadzą — już nie z kwiatami, lecz z gniewem, z ciszą, ze spojrzeniem, którego żadne prawo nie jest w stanie zgasić."
 pius.112.g: "Żałujemy tego, co się wydarzyło."
 pius.112.h: "Sami do tego doprowadzili."
 pius.113.t: "Głos z ambony"
 pius.113.d: "Lokalny ksiądz stał się najważniejszym obrońcą objawienia Maryjnego w [SCOPE.sState('pius_marian_apparition_state').GetFarmHubName]. Jego kazania przyciągają tłumy, jego słowa niosą nadzieję — i rzucają wyzwanie władzy państwowej. Nazywa się ksiądz [SCOPE.sCharacter('pius_marian_priest_scope').GetFirstName]."
 pius.113.f: "„Ukazała się pokornym, nie potężnym. I być może dlatego chcą ją uciszyć.”\n\nW kamiennym kościele nad wioską ksiądz [SCOPE.sCharacter('pius_marian_priest_scope').GetFirstName] zaczął głosić kazania — nie tylko o miłosierdziu Dziewicy, lecz także o jej sprawiedliwości. Jego słowa rozbrzmiewają poza nawą kościoła: „Jeśli Niebo przemówiło tutaj, to żaden rząd nie może zakazać jego echa.”\n\nPielgrzymi tłumnie przybywają na jego kazania. Jego imię jest powtarzane szeptem i pojawia się w śpiewnikach. Wzywa do pokoju, lecz jego obecność wzmacnia niepokoje. Jedni nazywają go prorokiem. Inni — buntownikiem w szatach duchownego.\n\nWładze stają się zaniepokojone. Wojsko mówi o podżeganiu. Hierarchia Kościoła waha się — rozdarta między doktryną a dyplomacją. Na twoje biurko trafia cicha propozycja: Można go usunąć. Dyskretnie. Bez rozgłosu.\n\nLecz niektórzy ludzie, gdy zostają uciszeni, przemawiają jeszcze głośniej."
 pius.113.g: "Pozwól mu głosić kazania."
 pius.113.h: "Wezwij go do stolicy na negocjacje."
 pius.113.i: "Spraw, by zniknął."
 pius.114.t: "Procesja, która wstrząsnęła narodem"
 pius.114.d: "W całym kraju katoliccy wierni rozpoczęli publiczne demonstracje poparcia dla objawienia Maryjnego. To, co zaczęło się jako wiejska pielgrzymka, stało się ruchem ogólnonarodowym."
 pius.114.f: "„Szli z różańcami w dłoniach, swoimi dziećmi na ramionach i imieniem Dziewicy na ustach.”\n\nOd wiosek rybackich po miasta przemysłowe znaki są wszędzie takie same: świece płonące w oknach, hymny rozbrzmiewające na miejskich placach, tysiące ludzi gromadzących się w ciszy. Nie powiewają żadne sztandary — są tylko posągi, ikony i jedno imię powtarzane wciąż na nowo: Maria. To, co zaczęło się jako pobożność, stało się sprzeciwem.\nW odpowiedzi na przemoc w świętym miejscu [SCOPE.sState('pius_marian_apparition_state').GetFarmHubName] wierni wyszli na ulice. Nie krzyczą. Modlą się. Jednak ich liczba rośnie z każdym dniem.\nNiektórzy w rządzie nawołują do tolerancji. Inni domagają się represji. Wojsko jest niespokojne. A w domach w całym kraju nawet sceptycy zastanawiają się: jeśli tak wielu wierzy, czy nadal może to być kłamstwo?"
 pius.114.g: "Zezwól na narodową procesję."
 pius.114.h: "Zakazuj narodowej procesji."
 pius.115.t: "Pola leżą odłogiem"
 pius.115.d: "Dotkliwa klęska nieurodzaju nawiedziła kilka wiejskich regionów [SCOPE.sState('pius_marian_apparition_state').GetFarmHubName]. Wśród wiernych zaczyna rozprzestrzeniać się niebezpieczny szept: że Dziewica, niegdyś uciszona przez państwo, teraz płacze — i karze."
 pius.115.f: "'Prosiła o modlitwę. Odpowiedzieliśmy jej żołnierzami.'\nDeszcze nie nadeszły. Pszenica zżółkła zbyt wcześnie. Ziemniaki zgniły pod ziemią, niewidoczne i gorzkie. Wieśniacy mówią o polach, które wydają się... opuszczone. Nie tylko przez ludzi, ale i przez miłosierdzie.\nI tak zaczynają szeptać. O kobiecie w światłości, która niegdyś się ukazała — i została wyśmiana. O księdzu, który zniknął. O sanktuarium zamkniętym na głucho i pobitych pielgrzymach. Teraz, jak mówią, odwróciła od nich swoje oblicze.\nŚwiece znów płoną, lecz teraz za zamkniętymi okiennicami. Matki potajemnie chrzczą dzieci. Starcy zakopują skórki chleba jako ofiary. Kościół nie waży się przemówić, ale lud już wierzy: to jej smutek. A może ostrzeżenie."
 pius.115.g: "Przesąd! Mam nadzieję..."
 pius.116.t: "Cisza pośród dzwonów"
 pius.116.d: "Po latach represji i odrzucania cudów wielu niegdyś gorliwych wiernych zaczęło porzucać swoją wiarę w [SCOPE.sState('pius_marian_apparition_state').GetFarmHubName]. Coraz większa liczba osób określa się już nie jako katolicy — lecz jako osoby bez żadnej wiary."
 pius.116.f: "„Już nie przychodzi. Ani w snach, ani w wizjach. Świece nie są już zapalane.”\n\nSanktuarium jest zamknięte. Ksiądz zniknął. Pola milczą.\nBył czas, gdy nawet najbiedniejsi szeptali Zdrowaś Maryjo przed snem, gdy ikony wisiały obok domowych palenisk, a łzy spływały na dźwięk dzwonów. Teraz kościoły stoją puste. Dzieci pytają, czym była „spowiedź”. Młodzi mówią o Rozumie, o Postępie, o Nicości.\nLudzie nie zwrócili się ku ideologii. Obrócili się w popiół. Nie są radykałami. Są wyczerpani. A gdzieś w tej pustej ciszy pozostaje pytanie:\nCzy to ona nas opuściła — czy to my opuściliśmy ją?"
 pius.116.g: "Wiek Wiary przeminął."
 pius.119.t: "Zamknięcie sanktuarium"
 pius.119.d: "Nowo ustanowiony ateistyczny rząd nakazał zamknięcie miejsca pielgrzymkowego poświęconego Maryi. To, co niegdyś było miejscem światła i modlitwy, jest teraz odgrodzone i milczące pod strażą państwa."
 pius.119.f: "„Nie zabrzmiały żadne dzwony. Nie zapłonęły żadne świece. Bramy zostały zamknięte przed wschodem słońca.”\n\nSanktuarium, które niegdyś przyciągało tysiące ludzi, stoi teraz samotnie. Na drzwiach kaplicy przybito obwieszczenie: „Z rozkazu Zgromadzenia Ludowego obiekt ten zostaje uznany za nieistotny.” Strażnicy stoją na warcie nie po to, by chronić, lecz by zapobiegać.\n\nNie użyto siły. Nie zezwolono na protesty. Zmiana nadeszła cicho, biurokratycznie — jako nieobecność, a nie wybuch. Jednak w domach w całym kraju starsze dłonie drżą. Babcie ukrywają swoje różańce. Dzieci pytają, dlaczego pielgrzymi już nie śpiewają.\n\nDuchowieństwo milczy. Partia mówi o nauce, rozumie i postępie. A gdzieś za zamkniętymi drzwiami migocze pytanie niczym dogasająca świeca: Czy to naprawdę było konieczne?"
 pius.119.g: "Nie będziemy już wznosić pomników dla złudzeń."
 pius.121.t: "Co ona ma na myśli?"
 pius.121.d: "Objawienie Maryjne w [SCOPE.sState('pius_marian_apparition_state').GetFarmHubName] zostało oficjalnie uznane za pozytywny znak. Jednak nawet teraz jego prawdziwe znaczenie pozostaje kwestią interpretacji."
 pius.121.f: "W tygodniach, które minęły od czasu, gdy promienna postać ukazała się mieszkańcom wsi, nie pojawiły się żadne kolejne znaki. Żaden ogień z nieba. Żaden głos z chmur. Tylko spokojne niebo i utrzymujące się echo zachwytu.\n\nA jednak ludzie mówią — o pokoju, o uzdrowieniu, o czymś, co odmieniło duszę narodu. Pielgrzymi przybywają nie w szale, lecz z czcią. Duchowieństwo naucza łagodnie. Prasa po raz pierwszy od dawna relacjonuje wydarzenie bez szyderstwa: Co oznacza ten cud?"
 pius.121.g: "Błogosławieństwo dla zwykłych ludzi."
 pius.121.h: "Boski znak dla naszego duchowieństwa."
 pius.121.i: "Wskazanie prawomocności naszego rządu."
 pius.122.t: "Sanktuarium [SCOPE.sState('pius_marian_apparition_state').GetFarmHubName]"
 pius.122.d: "Miejsce objawienia Maryjnego stało się teraz w pełni uznanym miejscem pielgrzymkowym, przyciągającym wiernych z bliska i z daleka w coraz większej liczbie."
 pius.122.f: "„Tam, gdzie niegdyś były tylko pastwiska, teraz stoją świece, róże i ciche kroki tysięcy ludzi.”\n\nDrogi zostały poszerzone. Pola oczyszczono. W pobliżu miejsca, gdzie dzieci niegdyś mówiły o Pani odzianej w światłość, wznosi się skromna kaplica. Każdego dnia przybywają pielgrzymi: rolnicy ze swoimi synami, wdowy w czerni, żołnierze na urlopie, matki szepczące modlitwy za swoje nienarodzone dzieci.\n\nKościół uznał świętość tego miejsca. Powstaje sanktuarium. Na jego obrzeżach rozkwitają targowiska oferujące chleb, medaliki, różańce i wino. To, co niegdyś było historią podawaną w wątpliwość w salonach, jest teraz obecnością odczuwaną w kościach narodu.\n\nA gdy dzwony rozbrzmiewają w dolinie, pojawia się pytanie: Czy jest to odrodzenie wiary — czy też zalążek czegoś jeszcze większego, co dopiero nadejdzie?"
 pius.122.g: "Totus tuus."