 roy_ethnology_tech: "Ethnology"
 roy_ethnology_tech_desc: "W XIX wieku etnologia wyłoniła się jako odrębna dyscyplina akademicka, przechodząc od przypadkowych obserwacji podróżników do systematycznego badania ludzkich kultur i ich pochodzenia. Pod wpływem rozwoju teorii ewolucji oraz ekspansji kolonialnej pierwsi etnolodzy starali się klasyfikować globalną różnorodność za pomocą metod porównawczych i gromadzenia materialnych artefaktów. Z biegiem dekad dziedzina ta odchodziła od czysto spekulacyjnych hierarchii rasowych na rzecz bardziej rygorystycznych badań terenowych, kładąc podwaliny pod współczesną antropologię społeczną."
 alert_roy_ethnologist_will_retire_soon_alert_name: "[concept_roy_ethnologist] bliski emerytury"
 alert_roy_ethnologist_will_retire_soon_alert_desc: "Twój [concept_roy_ethnologist] jest bliski emerytury. Możesz chcieć znaleźć zastępcę."
 roy_ethnologist_will_retire_soon_alert_setting_name: "\#tooltip:[GetRawTextTooltipTag('mr_morgenroete_tt')] `@mr_morgenroete_icon!` #! [concept_roy_ethnologist] bliski emerytury"
 alert_roy_ethnologist_will_retire_soon_alert_hint: "Twój [concept_roy_ethnologist] przejdzie na emeryturę w ciągu najbliższych #V 5 lat#!. Możesz chcieć znaleźć nowego etnologa, który go zastąpi."
 alert_roy_ethnologist_will_retire_soon_alert_action: "$mr_alert_send_to_science_humanities$"