 MFE_political_events.1.t:0 "Anonimowe artykuły w gazecie"
 MFE_political_events.1.d:0 "Członkowie [SCOPE.gsInterestGroup('ig_intelligentsia').GetName], ośmieleni obecną sytuacją polityczną, publikują w gazetach oszczercze artykuły wymierzone przeciwko rządowi."
 MFE_political_events.1.f:0 "„W dzisiejszych czasach, do czego ludzie potrzebują `[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle]`? Wyobrażamy sobie śmielszą przyszłość dla `[ROOT.GetCountry.GetName]`, w końcu uwolnioną spod jarzma tyranów.”"
 MFE_political_events.1.a:0 "Stłum to – te oskarżenia są absurdalne!"
 MFE_political_events.1.b:0 "Pozwól publikacjom swobodnie płynąć"
 MFE_political_events.2.t:0 "Nękanie podczas wyborów lokalnych"
 MFE_political_events.2.d:0 "Napięcia polityczne w `[ROOT.GetCountry.GetCapital.GetName]` osiągają wysoki poziom, prowadząc do ataków na lokalne biura partyjnych gazet."
 MFE_political_events.2.f:0 "„Widziałem ich całą grupę, ludzi z [SCOPE.sParty('harassing_party').GetName], uzbrojonych w łomy i siekiery – mówili, że zamierzają rozbić prasy drukarskie [SCOPE.sParty('harassed_party').GetName] i pobić każdego, kto stanie im na drodze.”"
 MFE_political_events.2.a:0 "Broń [SCOPE.sParty('harassed_party').GetName]"
 MFE_political_events.2.b:0 "Potęp [SCOPE.sParty('harassing_party').GetName] tłum"
 MFE_political_events.3.t:0 "Oszustwo wyborcze"
 MFE_political_events.3.d:0 "Wyniki wyborów w `[ROOT.GetCountry.GetCapital.GetName]` zostały skażone oskarżeniami opozycji o fałszowanie kart wyborczych i kupowanie głosów."
 MFE_political_events.3.f:0 "„Ile razy widziałem cię dzisiaj, młodzieńcze? Przysiągłbym, że już tu byłeś...”"
 MFE_political_events.3.a:0 "[SCOPE.sParty('party_1').GetName] najwyraźniej sfałszowało te głosy..."
 MFE_political_events.3.b:0 "[SCOPE.sParty('party_2').GetName] nie można ufać w tych sprawach..."
 MFE_political_events.4.t:0 "Komitet robotniczy"
 MFE_political_events.4.d:0 "Robotnicy związani z [SCOPE.gsInterestGroup('ig_tradeunions').GetName] w [SCOPE.sState('workers_state').GetName] utworzyli Komitet i agitują za większymi prawami w miejscu pracy."
 MFE_political_events.4.f:0 "„Dwunastogodzinne zmiany w fabrykach są nieludzkie, są obrazą dla ludzkiej przyzwoitości; mówię ci, Robotniku, że możliwa jest inna droga.”"
 MFE_political_events.4.a:0 "Pozwolimy im się gromadzić... na razie"
 MFE_political_events.4.b:0 "To niedopuszczalne! Te spotkania nie mogą być kontynuowane."
 MFE_political_events.5.t:0 "Konflikt lokalnego zarządzania"
 MFE_political_events.5.d:0 "Związek zawodowy pracowników młyna w jednej z naszych prowincji protestuje przeciwko kierownikowi fabryki oskarżanemu o znęcanie się nad robotnikami, posuwającemu się nawet do bicia ich laskami za każdym razem, gdy tylko wywołają jego wysoce osobistą definicję lenistwa. Moglibyśmy usunąć kierownika, ale właściciel młyna twierdzi, że wykonuje on bardzo dobrą pracę."
 MFE_political_events.5.f:0 "Musimy więc go usunąć. Nie tylko usunąć, ale pozbyć się go na dobre. Rozumiesz? Nie chcemy go już więcej. To zły człowiek, mówię ci."
 MFE_political_events.5.a:0 "Nic nie można z tym zrobić..."
 MFE_political_events.5.b:0 "Musimy natychmiast wkroczyć do działania"
 MFE_political_events.6.t:0 "Odbyło się publiczne spotkanie"
 MFE_political_events.6.d:0 "Naśladując przykład z sąsiednich stolic, [SCOPE.gsInterestGroup('ig_trade_unions').GetName] w [ROOT.GetCountry.GetCapital.GetName] zaczęli organizować publiczne spotkania."
 MFE_political_events.6.f:0 "„Siła jednego człowieka jest niczym, ale gdy połączymy nasze siły, wtedy... cała `[ROOT.GetCountry.GetName]` będzie musiała nas wysłuchać.”"
 MFE_political_events.6.a:0 "Te spotkania są nieszkodliwe... pozwólmy im trwać"
 MFE_political_events.6.b:0 "Zróbcie co trzeba aby powstrzymać te zachowania"
 MFE_political_events.7.t:0 "Atak na przytułek dla ubogich"
 MFE_political_events.7.d:0 "Demonstracje w [SCOPE.sState('attacked_state').GetName] wymknęły się spod kontroli, prowadząc do przemocy na ulicach."
 MFE_political_events.7.f:0 "„Przeklęta hołota z huty zaczęła zbierać się przed fabryką, a zanim policja zdążyła przybyć, by rozproszyć tłum, doszło do... cóż, wiesz, co się wydarzyło.”"
 MFE_political_events.7.a:0 "Demokracja jest z natury chaotycznym przedsięwzięciem"
 MFE_political_events.7.b:0 "Zróbcie co w naszej mocy aby zapewnić pomoc"
 MFE_political_events.8.t:0 "Strajk w przytułku dla ubogich"
 MFE_political_events.8.d:0 "Niewypłacone wynagrodzenia, połączone z niedoborem chleba w `[ROOT.GetCountry.GetCapital.GetName]`, doprowadziły do strajku robotników."
 MFE_political_events.8.f:0 "„Jak można oczekiwać od nas pracy od świtu do zmierzchu, gdy zalegają nam z wypłatami, a nasze żołądki są puste? Na barykady, Towarzyszu!”"
 MFE_political_events.8.a:0 "Wyślij policję!"
 MFE_political_events.8.b:0 "To nic wielkiego..."
 MFE_political_events.9.t:0 "Profesor krytykuje system wyborczy"
 MFE_political_events.9.d:0 "[SCOPE.sCharacter('professor').GetFullName], profesor uniwersytecki wychwalany przez [SCOPE.gsInterestGroup('ig_intelligentsia').GetName], ostro krytykuje wybory w `[ROOT.GetCountry.GetName]` podczas serii publicznych wykładów."
 MFE_political_events.9.f:0 "„Zwracam teraz państwa uwagę na te subtelniejsze kwestie, które po dokładniejszym przeanalizowaniu jasno pokażą, że system istniejący pod rządami `[ROOT.GetCountry.GetRuler.GetFullName]` jest nie do utrzymania.”"
 MFE_political_events.9.a:0 "To są słuszne argumenty..."
 MFE_political_events.9.b:0 "Nakaż [SCOPE.sCharacter('professor').GetFullName] powstrzymanie się od publicznych wystąpień"
 MFE_political_events.10.t:0 "Negocjacje polityki handlowej"
 MFE_political_events.10.d:0 "Po okresie burzliwych debat w końcu nastąpił przełom w negocjacjach dotyczących polityki handlowej w `[ROOT.GetCountry.GetCapital.GetName]`."
 MFE_political_events.10.f:0 "„Jak mówi przysłowie, dobry kompromis pozostawia obie strony niezadowolone. Na szczęście obecne porozumienia przynoszą korzyści wszystkim – prawdziwie mistrzowski pokaz umiejętności dyplomatycznych.”"
 MFE_political_events.10.a:0 "To dzięki [SCOPE.gsInterestGroup('ig_industrialists').GetName]"
 MFE_political_events.10.b:0 "`[ROOT.GetCountry.GetRuler.GetFullName]` dokonał tego samodzielnie!"
 MFE_political_events.11.t:0 "Zamieszki o chleb"
 MFE_political_events.11.d:0 "Niedobory zboża za granicą spowodowały gwałtowny wzrost ceny chleba w [SCOPE.sState('bread_riot_state').GetName]."
 MFE_political_events.11.f:0 "„Kiedyś za pół pensa można było kupić trzy bochenki chleba, ale teraz? Możesz uważać się za szczęściarza, jeśli w ogóle znajdziesz otwartą piekarnię.”"
 MFE_political_events.11.a:0 "Państwo spróbuje złagodzić ich głód"
 MFE_political_events.11.b:0 "Jeśli chcą chleba, mogą go sobie kupić!"
 MFE_political_events.12.t:0 "Ciężkie czasy na wsi"
 MFE_political_events.12.d:0 "Susza w [SCOPE.sState('bread_queue_state').GetName] zaczyna rujnować miejscowych rolników, prowadząc do kryzysu w [ROOT.GetCountry.GetName]."
 MFE_political_events.12.f:0 "„Deszcz? W [SCOPE.sState('bread_queue_state').GetName] nie widzieliśmy go od miesięcy. Okres zasiewów był dla nas niezwykle ciężki... stracimy wszystko.”"
 MFE_political_events.12.a:0 "Wyślij pomoc natychmiast"
 MFE_political_events.12.b:0 "Cóż, poradzą sobie sami"
 MFE_political_events.13.t:0 "Broń przekracza granicę"
 MFE_political_events.13.d:0 "Krążą doniesienia, że pozbawieni skrupułów kupcy zalewają [SCOPE.sState('neighbor_neighbor_state').GetName] bronią, zwiększając ryzyko wybuchu przemocy."
 MFE_political_events.13.f:0 "„[SCOPE.sState('neighbor_neighbor_state').GetName] jest obecnie beczką prochu, a do wywołania większego pożaru wystarczy tylko jedna iskra.”"
 MFE_political_events.13.a:0 "Niewiele można zrobić w gospodarce wolnorynkowej..."
 MFE_political_events.13.b:0 "Zażądaj, aby natychmiast przestali!"
 MFE_political_events.14.t:0 "Lokalny biznes upada"
 MFE_political_events.14.d:0 "Wypadek przemysłowy w [SCOPE.sState('failing_building').GetName] trafia na pierwsze strony międzynarodowych gazet; eksplozja w fabryce zabiła trzydziestu dwóch robotników."
 MFE_political_events.14.f:0 "„Skąd mieliśmy wiedzieć, że kotły wybuchną? Nieważne [SCOPE.gsInterestGroup('ig_trade_unions').GetName] – miną miesiące, zanim zakład znów zacznie działać!”"
 MFE_political_events.14.a:0 "Wyślij pieniądze administratorom stanu"
 MFE_political_events.14.b:0 "Musimy wesprzeć ludność"
 MFE_political_events.15.t:0 "Kampania rekrutacyjna"
 MFE_political_events.15.d:0 "Fala szowinistycznego zapału w [SCOPE.sState('conscription_state').GetName] doprowadziła do bezprecedensowej liczby ochotników do poboru."
 MFE_political_events.15.f:0 "„Nie ma nic złego w tym, żeby chłopcy zaznali odrobiny chwały – i tak wrócą do domu przed Bożym Narodzeniem.”"
 MFE_political_events.15.a:0 "Przeprowadź kampanię rekrutacyjną"
 MFE_political_events.15.b:0 "Nie potrzebujemy dodatkowych żołnierzy"
 MFE_political_events.16.t:0 "Prawa sekularne"
 MFE_political_events.16.d:0 "[SCOPE.sCharacter('ig_leader').GetFullName], postać religijna ciesząca się pewną sławą, publicznie wzywa rząd `[ROOT.GetCountry.GetName]` do podjęcia większych działań na rzecz wsparcia najuboższych warstw społeczeństwa."
 MFE_political_events.16.f:0 "„Jak `[ROOT.GetCountry.GetRuler.GetFullName]`, który wiedzie wygodne życie w luksusie w `[ROOT.GetCountry.GetCapital.GetName]`, może wiedzieć, jak smakuje gorycz ubóstwa? Nasze przywództwo jest oderwane od rzeczywistości.”"
 MFE_political_events.16.a:0 "„Przekonaj” Kościół, aby zachował milczenie"
 MFE_political_events.16.b:0 "Czy oni nie mają wiary w nasze działania?!"
 MFE_political_events.17.t:0 "Lobby protekcjonistyczne"
 MFE_political_events.17.d:0 "Elementy polityczne powiązane z Lobby Protekcjonistycznym zaproponowały śmiałą serię reform, wywołując debaty w całym `[ROOT.GetCountry.GetName]`."
 MFE_political_events.17.f:0 "„Przyjaciele, wiatr wieje w nasze żagle – musimy kuć żelazo, póki gorące, i zdobyć poparcie ludu!”"
 MFE_political_events.17.a:0 "Możemy być może wprowadzić jeszcze więcej ograniczeń..."
 MFE_political_events.17.b:0 "Kim oni myślą, że są..."
 MFE_political_events.18.t:0 "Towarzystwo Wolnego Handlu i Zniesienia Ustaw"
 MFE_political_events.18.d:0 "Grupa wichrzycieli nazywająca siebie „Towarzystwem Wolnego Handlu i Zniesienia Ustaw” założyła swoją siedzibę w `[ROOT.GetCountry.GetCapital.GetName]` i publikuje podburzające broszury."
 MFE_political_events.18.f:0 "„Nadszedł czas, aby zburzyć stworzone przez człowieka granice i pozwolić handlowi swobodnie przepływać między narodami Ziemi. Usuńmy potrzebę nadzoru, a zwykły człowiek zatriumfuje!”"
 MFE_political_events.18.a:0 "Wolny handel może być dobrym pomysłem..."
 MFE_political_events.18.b:0 "[SCOPE.sParty('liberal_party').GetName] nie będzie dyktować naszej polityki!"
 MFE_political_events.19.t:0 "Wolny handel i moralność"
 MFE_political_events.19.d:0 "Redakcja gazety w `[ROOT.GetCountry.GetCapital.GetName]` opublikowała serię artykułów na temat wolnego handlu, wywołując gniewne reakcje wśród chłopstwa."
 MFE_political_events.19.f:0 "„Dlaczego my, zwykli ludzie, musimy być zmuszani do płacenia uciążliwych podatków od wszystkiego? Czy nie wycierpieliśmy już wystarczająco wiele pod obecnym reżimem? Przyjęcie wolnego handlu jest moralnym obowiązkiem.”"
 MFE_political_events.19.a:0 "Wolny handel jest drogą przyszłości"
 MFE_political_events.19.b:0 "Na razie nic się nie zmieni"
 MFE_political_events.20.t:0 "Reforma związków zawodowych"
 MFE_political_events.20.d:0 "Przedstawiciele [SCOPE.gsInterestGroup('ig_trade_unions').GetName] proponują szeroko zakrojone reformy."
 MFE_political_events.20.f:0 "[SCOPE.sCharacter('trade_leader').GetFullName], ustawodawca powiązany z biznesem, wykorzystuje swoje wpływy polityczne, aby przeforsować pakiet reform, który przyniósłby korzyści jego przedsiębiorstwom."
 MFE_political_events.20.a:0 "Ta oferta nie może zostać przyjęta"
 MFE_political_events.20.b:0 "Uspokoimy ich... na razie"
 MFE_political_events.21.t:0 "Biuro cenzury przeciążone pracą"
 MFE_political_events.21.d:0 "Biuro cenzury napisało do `[ROOT.GetCountry.GetRuler.GetFullName]`, prosząc o zwiększenie swojego budżetu."
 MFE_political_events.21.f:0 "„Każdego ranka otrzymujemy ponad tysiąc dokumentów – gazet, biuletynów, broszur politycznych, prywatnej korespondencji – które muszą zostać przeczytane, a obecnie po prostu brakuje nam ludzi do pracy.”"
 MFE_political_events.21.a:0 "Cóż... musimy uciszyć ludność"
 MFE_political_events.21.b:0 "Każ im zrobić, co mogą, przy obecnych zasobach"
 MFE_political_events.22.t:0 "Krytyka wolnorynkowców"
 MFE_political_events.22.d:0 "Spory o handel pochłonęły nasz naród, a każdy zdaje się opowiadać po którejś ze stron."
 MFE_political_events.22.f:0 "„Nasz rząd bardziej troszczy się o [SCOPE.gsInterestGroup('ig_industrialists').GetName] niż o własnych ludzi! Jak mamy przetrwać na tak bezwzględnym rynku?”"
 MFE_political_events.22.a:0 "Wolny rynek jest jedyną drogą naprzód!"
 MFE_political_events.22.b:0 "Czasy naprawdę się zmieniły... musisz się dostosować"
 MFE_political_events.23.t:0 "Konwent przeciw niewolnictwu"
 MFE_political_events.23.d:0 "Kwestia #Y niewolnictwa#! jest polaryzująca w `[ROOT.GetCountry.GetName]`; coraz więcej głosów krytykuje tę instytucję, ale istnieją silne interesy zaciekle sprzeciwiające się jakimkolwiek zmianom w obecnym porządku."
 MFE_political_events.23.f:0 "„To drażliwa kwestia, którą najlepiej pozostawić nietkniętą na razie. Kto na przykład zrekompensuje właścicielom niewolników utratę ich własności? Nie stać nas nawet na to, by obecnie o tym dyskutować.”"
 MFE_political_events.23.a:0 "Niewiele możemy zrobić"
 MFE_political_events.23.b:0 "Tak, niewolnictwo jest właściwie dość złe"
 MFE_political_events.24.t:0 "Edukacja kobiet"
 MFE_political_events.24.d:0 "Wpływowe kluby społeczne w `[ROOT.GetCountry.GetCapital.GetName]` naciskają na rozszerzenie praw kobiet, szczególnie w kwestii dostępu do akademii."
 MFE_political_events.24.f:0 "„Dlaczego nasze córki miałyby być pozbawione edukacji? Czy nie są one pełnoprawnymi członkami społeczeństwa `[ROOT.GetCountry.GetName]`?”"
 MFE_political_events.24.a:0 "Dostęp do edukacji jest podstawowym prawem!"
 MFE_political_events.24.b:0 "Stopniowe zmiany są bezpieczniejszą drogą do postępu."
 MFE_political_events.25.t:0 "Strajk głodowy"
 MFE_political_events.25.d:0 "Wielki strajk głodowy ma miejsce w `[ROOT.GetCountry.GetCapital.GetName]`, a robotnicy są wspierani przez [SCOPE.gsInterestGroup('ig_industrialists').GetName]."
 MFE_political_events.25.f:0 "„Jak można oczekiwać od nas pracy na dwunastogodzinnych zmianach bez przerwy na posiłek? Jeśli nasi przełożeni nadal będą odmawiać nam jedzenia w czasie pracy, odmawiamy przyjmowania posiłków, dopóki ta polityka się nie zmieni!”"
 MFE_political_events.25.a:0 "Mają trochę racji... w końcu przerwa na posiłek jest ważna."
 MFE_political_events.25.b:0 "Aresztuj tych wichrzycieli."
 MFE_political_events.26.t:0 "Lokalny poeta"
 MFE_political_events.26.f:0 "„A teraz odczyt z „Radosnego uniesienia młodego Wertera”... ekhem.\n\nO, młoda dziewico o złocistych lokach,/Oświeć mnie; gdzieżeś kupiła te skarpety?/Bo moje bose stopy są zimne; twarde kamienie/Co grożą, że dreszcz prześle mi po kościach.”"
 MFE_political_events.26.a:0 "Powinniśmy zatrudnić go, aby nauczał naszych uczniów"
 MFE_political_events.26.b:0 "Powinniśmy skupić się na praktycznych sprawach, a nie na „sztuce”"
 MFE_political_events.27.t:0 "Podziemna gazeta"
 MFE_political_events.27.d:0 "Niektórzy anonimowi członkowie [SCOPE.gsInterestGroup('ig_intelligentsia').GetName] samodzielnie wydają gazety wyśmiewające `[ROOT.GetCountry.GetRuler.GetFullName]`."
 MFE_political_events.27.f:0 "„Na szóstej stronie znajduje się karykatura nagiego `[ROOT.GetCountry.GetRuler.GetFirstName]` pijącego z koryta dla świń z podpisem: „Chrum chrum! Zjem każdą pomyjkę, którą nakarmią mnie przemysłowcy!”"
 MFE_political_events.27.a:0 "Niewiarygodne plugastwo! Stłumić to natychmiast"
 MFE_political_events.27.b:0 "Pozwól publikacjom swobodnie krążyć"
 MFE_political_events.28.t:0 "Szlachta podburza chłopstwo"
 MFE_political_events.28.d:0 "Otrzymujemy skargi od ludności [SCOPE.sCulture('discriminated_culture').GetName] w naszym kraju; twierdzą oni, że szlachta ich nęka."
 MFE_political_events.28.f:0 "Powszechnym poglądem wśród wyższych warstw społecznych jest: „ludność [SCOPE.sCulture('discriminated_culture').GetName] nadaje się jedynie do kopania latryn i powożenia mułami w `[ROOT.GetCountry.GetName]`, ponieważ śmierdzi jak kanały i śpi w stajniach”."
 MFE_political_events.28.a:0 "To jest całkiem zabawne"
 MFE_political_events.28.b:0 "Dość tych obelg! Stań po stronie ludności [SCOPE.sCulture('discriminated_culture').GetName]"
 MFE_political_events.29.t:0 "Lokalni kupcy oburzeni"
 MFE_political_events.29.d:0 "Napływ tanio wytwarzanych zagranicznych towarów do `[ROOT.GetCountry.GetCapital.GetName]` rozgniewał lokalnych kupców, którzy twierdzą, że są wypierani z rynku."
 MFE_political_events.29.f:0 "„Jeśli nic z tym nie zostanie zrobione, nie będziemy mieli innego wyboru, jak tylko domagać się reform politycznych – jak uczciwy przedsiębiorca ma dziś osiągnąć sukces?”"
 MFE_political_events.29.a:0 "Popieraj wolny handel!"
 MFE_political_events.29.b:0 "Nasze rynki potrzebują każdej możliwej przewagi!"
 MFE_political_events.26.d: "[SCOPE.sCharacter('manzoni_new_writer_scope').GetFullName], poeta, przybył do `[ROOT.GetCountry.GetCapital.GetName]` w ramach trasy wykładów promującej jego najnowszy zbiór."
 MFE_political_events.26.g: "[SCOPE.sCharacter('manzoni_new_writer_scope').GetSheHe|U] może jednak okazać się dobrym talentem."