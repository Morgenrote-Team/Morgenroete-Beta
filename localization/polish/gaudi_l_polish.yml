 gaudi.1201.t: "Nowoczesne Lokomotywy"
 gaudi.1201.t_general: "Western & Atlantic Railroad #3 „General”"
 gaudi.1201.t_forney: "\"Forney\" 0-4-4T"
 gaudi.1201.t_e6: "E6 Class \"Atlantic\""
 gaudi.1201.t_m_1000: "M-10000"
 gaudi.1201.t_gg1: "Class GG1"
 gaudi.1201.t_kkstb_30: "kkStB-Reihe 30"
 gaudi.1201.t_fs_class_670: "FS Class 670"
 gaudi.1201.d: "Lokomotywy zbudowane przez naszego [concept_tesla_mechanical_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] wreszcie wyjechały na tory, którymi dysponuje [GetPlayer.GetAdjectiveNoFormatting] sieć kolejowa. Z pewnością ustanowią nowe rekordy prędkości!"
 gaudi.1201.f: "„Spójrzcie tylko na ten cud inżynierii! Jest fantastyczny, prawda?”"
 gaudi.1201.f_general: "Układ osi 4-4-0 już dowiódł swojej wartości. „General” i podobne lokomotywy z pewnością staną się końmi roboczymi Ameryki!"
 gaudi.1201.f_forney: "Forney to doskonała lokomotywa do użytku w miastach, ponieważ niewielkie rozmiary pozwalają jej pokonywać ciasne łuki kolei miejskiej."
 gaudi.1201.f_e6: "Lokomotywa serii E6 „Atlantic” to szybki parowóz zapewniający pasażerom płynną jazdę. Będzie obsługiwać główne linie pasażerskie."
 gaudi.1201.f_m_1000: "M-10000 to lokomotywa spalinowo-elektryczna o opływowym kształcie. Może osiągać duże prędkości i idealnie nadaje się do obsługi tras ekspresowych."
 gaudi.1201.f_gg1: "Lokomotywa serii GG1 to elektrowóz o opływowym kształcie, który może ciągnąć pociągi z oszałamiającą prędkością. Z pewnością czeka ją długa służba!"
 gaudi.1201.f_kkstb_30: "Lokomotywa kkStB serii 30 doskonale nadaje się do obsługi ruchu podmiejskiego, ponieważ podczas spalania emituje wyjątkowo mało pary i dymu."
 gaudi.1201.f_fs_class_670: "Lokomotywa FS serii 670 ma charakterystyczną konstrukcję, zasadniczo odwracającą tradycyjny układ lokomotywy. Kabina znajduje się z przodu, zapewniając maszyniście doskonałą widoczność."
 gaudi.1201.g: "Cud Inżynierii!"
 je_gaudi_modernizing_industries_project: "Modernizacja Metod Produkcji"
 gaudi_engineer_focus_building: "Specjalizacja Inżynieryjna"
 gaudi.1211.f: "„Widzicie, dzięki tej nowej maszynie potrzebuję o trzech robotników mniej. Mogą więc teraz obsługiwać trzy inne takie maszyny, a wszystko stanie się znacznie bardziej dochodowe. Będzie mnie stać na nowy jacht!”"
 gaudi.1211.g: "Nasze zyski poszybują w górę!"
