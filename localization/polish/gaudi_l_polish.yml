 je_gaudi_civil_airports_project: "Modernizacja Lotnisk"
 gaudi.1501.t: "Nowoczesne lotniska [GetPlayer.GetName]"
 gaudi.1501.f: "„Nareszcie pas startowy bez wybojów i dziur oraz samolot, który nie jest głośniejszy od młota parowego!”"
 gaudi.1501.g: "Nie mogę się doczekać samolotów, którymi polecę wszędzie!"
