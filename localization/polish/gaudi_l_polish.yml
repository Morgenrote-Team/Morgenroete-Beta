 je_gaudi_construction_sector_project_reason: "Twój [concept_tesla_civil_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] rozpoczął projekt modernizacji budynku [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] w regionie [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]\n$mr_divider_for_je$\nProjekt będzie zyskiwał postęp co miesiąc. Za każdym razem, gdy postęp osiągnie #V 12 Punktów#!, bieżący budynek otrzyma nowy modyfikator. Projekt zakończy się, gdy wszystkie wybrane do niego budynki otrzymają modyfikatory.\n\nŁącznie dostępne są 3 modyfikatory. Każdy kolejny modyfikator wymaga ponownego zapełnienia paska postępu.\n$mr_divider_for_je$\nBieżący Budynek: [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] w regionie [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_tesla_improve_construction_project_modifier_1_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_tesla_improve_construction_project_modifier_2_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_tesla_improve_construction_project_modifier_3_type')]\n\nŁączna Liczba Pozostałych Budynków (bez bieżącego): [JournalEntry.MakeScope.Var('mr_number_of_remaining_list_entries_var').GetValue|V0]\n\nObecny miesięczny postęp: #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_civil_research_progress_tt')] [GetPlayer.MakeScope.ScriptValue('tesla_monthly_civil_engineering_progress_value')|+2] #!#!"
 gaudi.1151.t: "Nowoczesne Metody Budowlane"
 gaudi.1151.d: "Nasz [concept_tesla_civil_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] ukończył projekt modernizacji naszych budynków typu [GetBuildingType('building_construction_sector').GetName]. Teraz, gdy nasze procesy budowlane są wydajniejsze niż kiedykolwiek, powinniśmy móc kończyć budowy znacznie szybciej!\n\nŁączna liczba ulepszonych budynków: [GetPlayer.MakeScope.Var('mr_num_improved_construction_buildings_var').GetValue|V0]"
