 gaudi.1407.t: "Odkryto Złoże Żelaza!"
 gaudi.1408.t: "Odkryto Złoże Ołowiu!"
 gaudi.1409.t: "Odkryto Złoże Ropy Naftowej!"
 gaudi.1407.d: "Nasz [concept_tesla_engineer] Dr. [GetPlayer.MakeScope.GetVariable('tesla_engineer_var').GetCharacter.GetFullName] odkrył nowe złoże żelaza w regionie [SCOPE.sState('gaudi_deposit_state').GetName] przy użyciu najnowocześniejszych metod geofizycznych."
 gaudi.1408.d: "Nasz [concept_tesla_engineer] Dr. [GetPlayer.MakeScope.GetVariable('tesla_engineer_var').GetCharacter.GetFullName] odkrył nowe złoże ołowiu w regionie [SCOPE.sState('gaudi_deposit_state').GetName] przy użyciu najnowocześniejszych metod geofizycznych."
 gaudi.1409.d: "Nasz [concept_tesla_engineer] Dr. [GetPlayer.MakeScope.GetVariable('tesla_engineer_var').GetCharacter.GetFullName] odkrył nowe złoże ołowiu w regionie [SCOPE.sState('gaudi_deposit_state').GetName] przy użyciu najnowocześniejszych metod geofizycznych."
 gaudi.1407.f: "W trakcie każdej rozgrywki inżynier może trzykrotnie odkryć specjalne złoże: po jednym złożu żelaza, ołowiu i ropy naftowej. Wymaga to również pewnego zasobu wiedzy geomagnetycznej, którą gromadzi się przez lata. Warto więc jak najwcześniej rozpocząć badania geomagnetyczne."
 gaudi.1407.g: "Eureka!"
