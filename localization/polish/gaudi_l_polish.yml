 gaudi.1301.t: "Wynaleziono Nowe Karabiny"
 gaudi.1301.d: "Nasz [concept_tesla_military_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] przez lata pracował nad opracowaniem nowego karabinu dla naszej armii. Teraz wreszcie jest on gotowy, by trafić w ręce naszych żołnierzy!"
 gaudi.1301.f: "„To bardzo nowatorska broń, która zapewni nam ogromną przewagę nad wrogami! Jestem przekonany, że strzela szybciej, dalej i celniej niż jakakolwiek inna obecnie używana broń!”"
 gaudi.1301.g: "Fascynująca broń. Powinienem ją natychmiast wypróbować!"
