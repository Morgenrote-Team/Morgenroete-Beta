 gaudi.1511.d: "Nasz [concept_tesla_aeronautical_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] skonstruował wreszcie nowoczesny samolot wojskowy dla naszych sił powietrznych. To niezwykła maszyna, która zmieni sposób prowadzenia wojny."
 gaudi.1511.f: "„Słyszałem, że zbudowali jakiś nowy samolot. Nie wiem, co w nim takiego nowego... Ma skrzydła i silnik. Tak samo jak wszystkie samoloty”."
 gaudi.1511.g: "Niebo należy do nas!"
