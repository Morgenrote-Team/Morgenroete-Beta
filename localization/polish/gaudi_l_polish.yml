 je_gaudi_sagrada_phase_2: "Sagrada Família: Apsyda"
 je_gaudi_sagrada_phase_2_reason: "Gaudí ukończył kryptę, której budowę rozpoczęto zasadniczo według planów del Villara, wprowadzając jednak własne zmiany w konstrukcji sklepień. W połowie lat 80. XIX wieku można już było odprawiać w niej pierwsze nabożeństwa, a budowę krypty zakończono w 1889 roku. Równolegle z jej wznoszeniem Gaudí rozpoczął gruntowne przeprojektowywanie całej świątyni. W 1885 roku przedstawił nową, całościową koncepcję utrzymaną w stylistyce gotyckiej, w której można było dostrzec 18 wież, choć o mniejszych rozmiarach niż w obecnym projekcie. Zewnętrzna ściana apsydy, ukończona w 1893 roku, jest wyższa, niż przewidywał projekt del Villara. Zawiera elementy neogotyckie, lecz nosi wyraźne piętno stylu Gaudíego, widoczne w niekonwencjonalnym wykorzystaniu form gotyckich, naturalistycznych rzygaczach oraz zwieńczeniach pinakli."
