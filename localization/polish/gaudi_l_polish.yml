 je_gaudi_neuschwanstein_phase_1: "Neuschwanstein: Marzenie Króla"
 je_gaudi_neuschwanstein_phase_1_reason: "Neuschwanstein uchodzi za sztandarowy przykład historyzmu i niemieckiego romantyzmu. Ten baśniowy zamek, który wielu miało później uznać za ucieleśnienie „idealnego” zamku, powstał według wizji króla Bawarii Ludwika II. Choć w XIX wieku monarchowie nierzadko wznosili wspaniałe zamki w średniowiecznym stylu, Neuschwanstein miał przyćmić je wszystkie i stać się symbolem nie tylko Bawarii, lecz całego niemieckojęzycznego świata."
 je_gaudi_neuschwanstein_phase_1_goal: "#E Postęp Budowy#! osiągnie #BLUE 120#! punktów. Obecnie mamy #G [GetGlobalVariable('gaudi_neuschwanstein_progress').GetValue]#! punktów. Zazwyczaj zyskujemy jeden punkt miesięcznie."
 je_gaudi_neuschwanstein_phase_2: "Neuschwanstein: Baśniowy Zamek"
 je_gaudi_neuschwanstein_phase_2_reason: "Od początku Neuschwanstein nie miał pełnić funkcji reprezentacyjnych ani być dostępny dla publiczności, lecz służyć królowi jako prywatne schronienie. Inspiracją były dla niego średniowieczne legendy chrześcijańskie, a przede wszystkim opery Richarda Wagnera, którego wspierał finansowo i podziwiał. Coraz to nowe pomysły króla oraz jego pragnienie, by uczynić z Neuschwanstein kamienną scenę operową na wieczność, znacznie opóźniały budowę i doprowadziły Ludwika II na skraj ruiny."
 je_gaudi_neuschwanstein_phase_2_goal: "#E Postęp Budowy#! osiągnie #BLUE 120#! punktów. Obecnie mamy #G [GetGlobalVariable('gaudi_neuschwanstein_progress').GetValue]#! punktów. Zazwyczaj zyskujemy jeden punkt miesięcznie."
