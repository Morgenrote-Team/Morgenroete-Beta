 gaudi.2101.t: "Narodziny Stalowego Tytana"
 gaudi.2101.d: "Przy wielkim zainteresowaniu opinii publicznej rozpoczęto prace budowlane od wykopów pod fundamenty. W tym celu wydobytych zostanie łącznie 30 973 metrów sześciennych ziemi. Wieża Eiffla ustanowiła już rekord, zanim położono choćby jedną stalową belkę."
 gaudi.2101.f: "„Ta wieża będzie symbolizować nie tylko kunszt współczesnego inżyniera, lecz także wiek Przemysłu i Nauki, w którym żyjemy i któremu drogę utorowały wielki ruch naukowy XVIII wieku oraz rewolucja 1789 roku. Ten pomnik zostanie wzniesiony jako wyraz wdzięczności Francji wobec tej rewolucji”. -Gustave Eiffel"
 gaudi.2101.g: "Ku niebu, ku gwiazdom!"
 gaudi.2102.t: "Uroczyste otwarcie Wieży Eiffla"
 gaudi.2102.d: "Stalowy tytan, którego ukończenia zarazem się obawiano i wyczekiwano, góruje teraz nad stolicą Francji. Cały Paryż leży w cieniu wieży - nowego symbolu miasta. Entuzjazm, z jakim świętowano jej uroczyste otwarcie, uciszył krytyków."
 gaudi.2102.f: "„Przed faktem dokonanym - i to jakim faktem! - musimy się pokłonić. Podobnie jak wielu innych mówiłem i wierzyłem, że Wieża Eiffla jest szaleństwem, lecz jest to szaleństwo wielkie i dumne. Oczywiście ta ogromna bryła przytłacza resztę wystawy, a gdy ponownie wychodzi się na Pola Marsowe, olbrzymie kopuły i galerie wydają się maleńkie. Ale czego chcieć? Wieża Eiffla przemawia do wyobraźni, jest czymś nieoczekiwanym, czymś fantastycznym, co schlebia naszej małości. Gdy jej budowa ledwie ruszyła, najsłynniejsi artyści i pisarze, od Meissoniera po Zolę, podpisali płomienny protest przeciw wieży jako straszliwej zbrodni przeciw sztuce. Czy podpisaliby go jeszcze dzisiaj? Nie, z pewnością nie, i woleliby, żeby ten dokument gniewu nie istniał”."
 gaudi.2102.g: "Vive la France!"
 gaudi.2109.t: "Paryż Utracony!"
 gaudi.2109.d: "Wraz z utratą Paryża straciliśmy wszelką możliwość kontynuowania budowy Wieży Eiffla."
 gaudi.2109.f: "Jeśli z jakiegokolwiek powodu utracimy Paryż, dotychczasowe postępy budowy #R przepadną całkowicie#!. Tylko Francja może kontynuować budowę Wieży Eiffla. Obcy najeźdźcy nie wykażą zainteresowania jej budową."
 gaudi.2109.g: "Nie możemy pozostawić Paryża w ich rękach na długo!"
 gaudi.2111.t: "Windy"
 gaudi.2111.d: "Nowe osiągnięcia w technice dźwigowej pozwoliły niespodziewanie przyspieszyć prace przy budowie Wieży Eiffla."
 gaudi.2111.f: "Wjazd na Wieżę Eiffla umożliwia łącznie dziewięć różnych wind - pięć w filarach wieży, kursujących między wejściem a drugim piętrem, oraz dwie pary wind z dwupoziomowymi kabinami między drugim a trzecim piętrem. Podczas budowy wieży Eiffel celowo korzystał z różnych rozwiązań technicznych i usług różnych producentów, by zachować niezależność w razie awarii. W filarach północnym i południowym do 1910 roku działały windy firmy Otis. W filarach wschodnim i zachodnim do 1897 roku znajdowały się windy firm Roux, Combaluzie i Lepape. Za pomocą podwójnego łańcucha bez końca mogły przewozić do 200 osób. Oba systemy miały napęd hydrauliczny. Z okazji wystawy światowej w 1900 roku Eiffel wymienił windy, a maszyny parowe napędzające układ hydrauliczny zastąpił silnikami elektrycznymi."
 gaudi.2111.g: "Magnifique!"
 gaudi.2112.t: "Oburzenie Intelektualistów"
 gaudi.2112.d: "Na łamach renomowanego dziennika kilka czołowych postaci życia intelektualnego, naukowego i artystycznego zaprotestowało przeciw budowie Wieży Eiffla, potępiając ją jako szpetną budowlę rażącą w oczy."
 gaudi.2112.f: "„My, pisarze, malarze, rzeźbiarze, architekci i żarliwi wielbiciele dotąd nieskażonego piękna Paryża, protestujemy ze wszystkich sił, z całym oburzeniem, w imię znieważonego francuskiego gustu, przeciw wzniesieniu ... tej bezużytecznej i monstrualnej Wieży Eiffla ... Aby dobitnie przedstawić nasze racje, wyobraźcie sobie przez chwilę zawrotnie wysoką, niedorzeczną wieżę górującą nad Paryżem niczym gigantyczny czarny komin, przytłaczającą swą barbarzyńską bryłą Notre Dame, wieżę Saint-Jacques, Luwr, kopułę Pałacu Inwalidów, Łuk Triumfalny; wszystkie nasze upokorzone zabytki znikną w tym upiornym śnie. I przez dwadzieścia lat ... będziemy oglądać rozciągający się niczym plama atramentu nienawistny cień nienawistnej kolumny ze skręconych śrubami blach”."
 gaudi.2112.g: "Odłóżcie budowę na później."
 gaudi.2112.h: "Ten protest zachęca nas do jeszcze szybszej budowy wieży!"
 gaudi.2113.t: "Przemysłowcy przyklaskują Stalowemu Tytanowi"
 gaudi.2113.d: "Rosnąca Wieża Eiffla jest postrzegana przez przemysłowców naszego kraju jako symbol gospodarczego i technicznego postępu Francji. Z entuzjazmem wyczekują jej otwarcia."
 gaudi.2113.f: "Przedsiębiorca i archeolog Heinrich Schliemann, który miał okazję wejść na Wieżę Eiffla jeszcze przed jej oficjalnym otwarciem, w liście do Rudolfa Virchowa z 24 maja 1889 roku wychwalał budowlę jako cud kunsztu inżynieryjnego, bez którego paryska wystawa światowa nie miałaby uroku. Mimo entuzjazmu, z jakim uznawano ją za udaną manifestację narodowej dumy i pokaz postępu technicznego, nie brakowało również nieprzejednanej krytyki."
 gaudi.2113.g: "Może moglibyście trochę pomóc?"
 gaudi.2113.h: "To dzięki wam!"
 gaudi.2114.t: "Stal Gorszej Jakości"
 gaudi.2114.d: "Główny architekt ostro skrytykował jakość ostatniej dostawy stali i nakazał ją odesłać. Harmonogram budowy Wieży Eiffla ulega wyraźnemu przesunięciu."
 gaudi.2114.f: "W pracach budowlanych uczestniczyło do 250 osób, z czego około 150 zajmowało się nitowaniem elementów na miejscu. Wśród robotników oprócz cieśli byli również kominiarze, przyzwyczajeni do pracy na dużych wysokościach. Zmiany trwały dziewięć godzin w miesiącach zimowych i dwanaście godzin w miesiącach letnich. We wrześniu 1888 roku robotnicy rozpoczęli strajk; trzy miesiące później ponownie przerwali pracę, domagając się wyższych płac. Gustave Eiffel negocjował z nimi i urządził dla nich stołówkę na ukończonej już pierwszej platformie. Podczas całej budowy doszło tylko do jednego śmiertelnego wypadku. Włoski robotnik zginął przy montażu wind już po oficjalnym otwarciu."
 gaudi.2114.g: "Kupcie nową partię stali."
 gaudi.2115.t: "Stal Wysokiej Jakości"
 gaudi.2115.d: "Stal z pobliskich paryskich hut okazała się podczas budowy Wieży Eiffla tak wysokiej jakości, że nie tylko zwiększyła wydajność prac, lecz także skłoniła innych klientów do składania większych zamówień w tych hutach."
 gaudi.2115.f: "14 sierpnia 1888 roku ukończono drugie piętro, a górną część wieży wznoszono metodą wspornikową. Jednocześnie wyposażano platformy. Poszczególne elementy, z otworami wywierconymi wcześniej w fabryce, ustawiano na miejscu w ostatecznym położeniu za pomocą wbijanych trzpieni stożkowych. Elementy Wieży Eiffla łączy łącznie 2,5 miliona nitów. Nitowanie wykonywały czteroosobowe zespoły. Pierwszy robotnik przygotowywał nit do zakuwania na gorąco, rozgrzewając go do czerwoności w niewielkim palenisku kowalskim. Następnie drugi robotnik wprowadzał nit do otworu. Trzeci wykuwał zakuwkę. Na koniec nit ściskano."
 gaudi.2115.g: "Francuska stal to najlepsza stal."
 gaudi.2116.t: "Matematyk przewiduje Zawalenie"
 gaudi.2116.d: "Po tym, jak jeden z najbardziej szanowanych francuskich matematyków przewidział, że Wieża Eiffla zawali się po osiągnięciu wysokości około 230 metrów, wśród niektórych właścicieli domów szerzy się panika."
 gaudi.2116.f: "Jeden z mieszkańców okolic Pól Marsowych pozwał państwo i miasto Paryż w obawie, że Wieża Eiffla może się zawalić i zniszczyć jego dom. Sąd zezwala na dalszą budowę jedynie pod warunkiem, że Gustave Eiffel poniesie odpowiedzialność za wszelkie szkody. Wywołało to we Francji zasadniczą debatę na temat wiarygodności projektu i obliczeń Eiffla. Przemysłowcy postrzegają jednak tę krytykę jako zniewagę wobec samej idei postępu."
 gaudi.2116.g: "To niedorzeczne."
 gaudi.2116.h: "Eiffel musi zapłacić, jeśli wieża się zawali."
 gaudi_admires_liberty_statue_modifier: "Statua Wolności: Podziw dla Amerykańskich Ideałów"
 gaudi_liberty_impressed_modifier: "Statua Wolności: Pod Wrażeniem Pani Wolności"
 gaudi_america_first_modifier: "Statua Wolności: Amerykańskie Przedsięwzięcie"
 gaudi.2201.t: "Francuzka w amerykańskim porcie"
 gaudi.2201.d: "Z francuskiej inicjatywy powstaje obecnie gigantyczny posąg, który już wkrótce będzie jako symbol wolności witał wszystkich przybywających do Nowego Świata."
 gaudi.2201.f: "W 1796 roku wyspę Bedloe przekazano pod zarząd stanu Nowy Jork, lecz w 1800 roku ostatecznie przejął ją rząd federalny Stanów Zjednoczonych. USA postanowiły wznieść na niej umocnienia, podobnie jak na wyspach Governors Island i Ellis Island, aby chronić port nowojorski. W czerwcu 1871 roku rzeźbiarz Bartholdi udał się do Nowego Jorku. Jego uwagę przyciągnęła wyspa Bedloe w Górnej Zatoce Nowojorskiej. Każdy przypływający statek musiał ją mijać, dlatego wydawała się odpowiednim miejscem na ustawienie posągu."
 gaudi.2201.g: "Znaleźliśmy już godne miejsce."
 gaudi.2202.t: "Wolność Opromieniająca Świat"
 gaudi.2202.d: "Kilkaset tysięcy osób świętowało dziś uroczyste odsłonięcie Statuy Wolności podczas parady, na której czele stanął osobiście [SCOPE.sCharacter('gaudi_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('gaudi_ruler_scope').GetLastName]. Francuski komitet kieruje również paradą morską zmierzającą ku wyspie Bedloe."
 gaudi.2202.f: "Nie jak spiżowy olbrzym greckiej sławy,\nCo zdobywczymi nogami dwa lądy rozpiera,\nTu, u morskich bram zachodu, stanie\nPotężna niewiasta z pochodnią, której płomień\nJest uwięzioną błyskawicą, a jej imię\nTo Matka Wygnańców. Z dłoni dzierżącej światło\nPłynie powitanie dla całego świata; jej łagodne oczy strzegą\nPortu spiętego podniebnym mostem, ujętego w ramy bliźniaczych miast.\n„Zachowajcie, stare ziemie, swój legendarny przepych!” woła\nMilczącymi ustami. „Dajcie mi waszych zmęczonych, waszych biednych,\nWasze stłoczone tłumy spragnione wolnego oddechu,\nNędzne wyrzutki waszych ludnych wybrzeży.\nPrzyślijcie mi tych bezdomnych, miotanych burzą:\nWznoszę mą lampę przy złotych wrotach”."
 gaudi.2202.g: "Oto Nowy Kolos."
 gaudi.2209.t: "Nowy Jork Utracony!"
 gaudi.2209.d: "Wraz z utratą Nowego Jorku straciliśmy wszelką możliwość kontynuowania budowy Statuy Wolności."
 gaudi.2209.f: "Jeśli z jakiegokolwiek powodu utracimy Nowy Jork, dotychczasowe postępy budowy #R przepadną całkowicie#!. Tylko Stany Zjednoczone Ameryki mogą kontynuować budowę Statuy Wolności. Obcy najeźdźcy nie wykażą zainteresowania jej budową."
 gaudi.2209.g: "Nie możemy pozostawić Nowego Jorku w ich rękach na długo!"
 gaudi.2211.t: "Windy"
 gaudi.2211.d: "Nowe osiągnięcia w technice dźwigowej pozwoliły niespodziewanie przyspieszyć prace przy budowie Statuy Wolności."
 gaudi.2211.f: "„Powierzchnie powinny być wyraźne i proste, podporządkowane śmiałemu i klarownemu projektowi, z akcentami w istotnych miejscach. Należy unikać powiększania lub mnożenia detali. Wyolbrzymiając formy, by uczynić je lepiej widocznymi, lub dodając do nich szczegóły, zniszczylibyśmy proporcje dzieła. Wreszcie model, podobnie jak projekt, powinien mieć syntetyczny charakter, niczym pospieszny szkic. Charakter ten musi wynikać ze świadomego zamiaru i obserwacji, a artysta, skupiając całą swoją wiedzę, powinien odnaleźć formę i linię w ich największej prostocie”. -Frédéric-Auguste Bartholdi"
 gaudi.2211.g: "Świetnie!"
 gaudi.2213.t: "Intelektualiści pod wrażeniem"
 gaudi.2213.d: "Elita intelektualna z zadowoleniem przyjmuje trwające w Nowym Jorku przedsięwzięcie budowlane, które w pełni ucieleśnia demokratycznego i liberalnego ducha Stanów Zjednoczonych. Artyści czerpią z niego inspirację do pisania wierszy i tworzenia kompozycji muzycznych."
 gaudi.2213.f: "„Strażniczko zachodniej bramy nad zatoką Manhattanu,\nMgły zwątpienia, co skrywały twą twarz, rozwiały się bez śladu:\nTwe oczy wreszcie patrzą jasno w dal, wysoko wznosisz dłoń,\nBy światło wolności nieść całemu światu, do wszystkich jego stron”. -Henry van Dyke"
 gaudi.2213.g: "Może mogliby zadbać o trochę rozgłosu?"
 gaudi.2214.t: "Przedsięwzięcie amerykańskie czy francuskie?"
 gaudi.2214.d: "Im bardziej postępuje budowa Statuy Wolności, a cokół na wyspie u wybrzeży Manhattanu rośnie, tym częściej niektórzy politycy zadają pytanie, który kraj jest właściwie inicjatorem tego przedsięwzięcia."
 gaudi.2214.f: "„Nie przybyliśmy tu dzisiaj, by pokłonić się wizerunkowi srogiego boga wojny, przepełnionego gniewem i żądzą zemsty, lecz z radością podziwiamy nasze własne bóstwo, czuwające u otwartych bram Ameryki i wspanialsze od wszystkich, które sławiono w starożytnych pieśniach. Zamiast ściskać w dłoni pioruny grozy i śmierci, wznosi ona światło wskazujące drogę ku wyzwoleniu człowieka. Nie zapomnimy, że Wolność obrała tu sobie dom, ani nie zaniedbamy wybranego przez nią ołtarza. Oddani czciciele będą nieustannie podtrzymywać jego płomienie, a ich blask dotrze stąd do brzegów naszej siostrzanej Republiki. Połączony z odpowiadającymi mu promieniami strumień światła przeniknie mroki niewiedzy i ucisku człowieka, aż Wolność opromieni świat”. -Grover Cleveland"
 gaudi.2214.g: "To amerykańskie przedsięwzięcie."
 gaudi.2214.h: "To francusko-amerykańskie przedsięwzięcie."
 gaudi.2214.i: "To francuskie przedsięwzięcie."
 gaudi.2215.t: "Stal Wysokiej Jakości"
 gaudi.2215.d: "Stal z pobliskich nowojorskich hut okazała się podczas budowy Statuy Wolności tak wysokiej jakości, że nie tylko zwiększyła wydajność prac, lecz także skłoniła innych klientów do składania większych zamówień w tych hutach."
 gaudi.2215.f: "„Zobaczyłem Statuę Wolności. I powiedziałem sobie: Pani, jesteś taka piękna! Rozpostarłaś ramiona i przyjmujesz tu wszystkich cudzoziemców. Daj mi szansę udowodnić, że jestem tego wart, coś osiągnąć, zostać kimś w Ameryce. I ten posąg zawsze tkwił w mojej pamięci”."
 gaudi.2215.g: "Amerykańska stal to najlepsza stal."
 gaudi.2216.t: "Partia Rządząca wspiera Panią Wolność"
 gaudi.2216.d: "[SCOPE.sCharacter('gaudi_liberty_leader').GetFullName] jest znany jako gorący zwolennik budowy Statuy Wolności. Zdołał już przekonać do tego przedsięwzięcia kilka wpływowych osób ze swojego otoczenia i zebrał darowizny."
 gaudi.2216.f: "Bartholdi planował zamontować na balkonie pochodni pokrytej płatkami złota reflektory, które miały ją oświetlać. Na tydzień przed uroczystym odsłonięciem Korpus Inżynieryjny Armii odrzucił tę propozycję w obawie, że światło oślepi pilotów przepływających statków. Zamiast tego Bartholdi polecił wyciąć w pochodni bulaje i umieścił reflektory wewnątrz."
 gaudi.2216.g: "Poproście o kolejną darowiznę."
 gaudi.2216.h: "Pochwalcie go publicznie!"
 gaudi.2217.t: "Wypadek na placu budowy"
 gaudi.2217.d: "W wypadku na placu budowy Statuy Wolności kilka osób zostało rannych, a część posągu uległa zniszczeniu."
 gaudi.2217.f: "„Wznieśliście w porcie nowojorskim monstrualnego bożka, którego nazywacie Wolnością. Aby dopełnić ten pomnik, pozostaje już tylko umieścić na jego cokole napis, który Dante umieścił na bramie piekieł: Porzućcie wszelką nadzieję, wy, którzy tu wchodzicie”. -George Bernard Shaw"
 gaudi.2217.g: "Amerykańska stal to najlepsza stal - tak myślałem..."
 gaudi.2218.t: "Ile kosztuje Wolność?"
 gaudi.2218.d: "[SCOPE.sCharacter('gaudi_opposition_leader').GetFullName] uchodzi za zdecydowanego krytyka budowy Statuy Wolności. Zebrane pieniądze można by przeznaczyć na znacznie lepsze przedsięwzięcia."
 gaudi.2218.f: "Amerykański komitet napotkał poważne trudności ze zbieraniem darowizn. Statua Wolności nie była jedynym przedsięwzięciem cierpiącym z powodu braku funduszy; na przykład prace nad Pomnikiem Waszyngtona trwały trzy i pół dekady, z kilkoma przerwami. Krytykowano zarówno posąg Bartholdiego, jak i fakt, że Amerykanie musieli zapłacić za cokół pod ten dar. Powszechne było również przekonanie, że dzieła sztuki w przestrzeni publicznej powinni projektować Amerykanie. Czasopismo „Harper’s Weekly” stwierdziło, że Bartholdi mógł podarować zarówno posąg, jak i cokół, a „New York Times” zauważył: „Żaden prawdziwy patriota nie może przy obecnym stanie naszych finansów aprobować takich wydatków na kobiety z brązu”."
 gaudi.2218.g: "Ale to przedsięwzięcie jest bardzo ważne!"
 gaudi.2218.h: "Może są ważniejsze sprawy..."
 gaudi.2301.t: "Gojenie Ran w Londynie"
 gaudi.2301.d: "Londyńczycy wciąż są wstrząśnięci pożarem dawnego Pałacu Westminsterskiego. Ogień pozostawił bliznę na brzegu Tamizy, gdzie niegdyś biło polityczne serce Wielkiej Brytanii. Uroczysta ceremonia rozpoczęła prace budowlane, które mają wreszcie zagoić tę ranę."
 gaudi.2301.f: "Bezpośrednio po pożarze król Wilhelm IV zaoferował parlamentowi niemal ukończony Pałac Buckingham, licząc na pozbycie się rezydencji, której nie lubił. Budynek uznano jednak za nieodpowiedni na siedzibę parlamentu i dar odrzucono. Dużą popularnością cieszyła się koncepcja neoklasycystyczna. Decimus Burton opracował projekt nowego gmachu parlamentu w tym stylu. Zwolennicy tego rozwiązania, w przeciwieństwie do neogotyku, stawiali za wzór twórców katedry św. Pawła, wzniesionej w piękniejszym i bardziej uniwersalnym stylu architektury rzymskiej ku zadowoleniu pełnych uznania potomnych. Augustus W. N. Pugin, najwybitniejszy znawca gotyku, musiał zgłaszać wszystkie swoje projekty za pośrednictwem innych architektów, Jamesa Gillespiego Grahama i Charlesa Barry’ego, a zatem pod ich nazwiskami, ponieważ niedawno otwarcie i gorliwie przeszedł na katolicyzm. Projekt parlamentu, który Pugin zgłosił za pośrednictwem Barry’ego, wygrał konkurs."
 gaudi.2301.g: "A miałem nadzieję, że pozwolimy politykom zamieszkać na ulicy."
 gaudi.2302.t: "Sale Obrad ukończone"
 gaudi.2302.d: "Dzięki ukończeniu sal obrad Izby Lordów i Izby Gmin parlament może wznowić normalną działalność w nowym Pałacu Westminsterskim. Do zakończenia budowy miną jednak jeszcze lata."
 gaudi.2302.f: "Salę obrad Izby Lordów ukończono w 1847 roku, a Izby Gmin w 1852 roku (wtedy też Barry otrzymał tytuł szlachecki). Choć do śmierci Charlesa Barry’ego w 1860 roku wykonano większość prac, budowę zakończono dopiero dekadę później, pod nadzorem jego syna Edwarda Middletona Barry’ego."
 gaudi.2302.g: "Robimy całkiem niezłe postępy, prawda?"
 gaudi.2303.t: "Big Ben"
 gaudi.2303.d: "W drugim etapie budowy pozostają do wykonania wystrój wnętrz gmachu parlamentu oraz montaż ogromnych dzwonów w wieży zegarowej."
 gaudi.2303.f: "W ramach prac nadzorowanych przez Królewską Komisję Sztuk Pięknych pod przewodnictwem księcia Alberta specjalna komisja parlamentarna, w której skład wchodził Sir Robert Peel, rozpoczęła w 1841 roku przesłuchania ekspertów. Wśród nich znaleźli się Sir Martin Archer Shee, prezes Królewskiej Akademii Sztuk Pięknych, oraz Charles Lock Eastlake, malarz i uznany autorytet w dziedzinie historii sztuki, który wkrótce miał zostać pierwszym dyrektorem Galerii Narodowej i faktycznym zarządcą całego przedsięwzięcia dekoracji Pałacu Westminsterskiego. Postanowiono wykorzystać tę okazję do wsparcia rozwoju narodowej brytyjskiej szkoły Malarstwa Historycznego oraz zdecydowano, że malowidła zostaną wykonane techniką fresku."
 gaudi.2303.g: "Po co tyle zamieszania wokół zwykłej wieży zegarowej?"
 gaudi.2304.t: "Pałac Westminsterski odbudowany"
 gaudi.2304.d: "Nowy gmach brytyjskiego parlamentu dumnie wznosi się nad brzegiem Tamizy i kształtuje panoramę miasta. Bicie dzwonów wieży zegarowej stało się nieodłącznym elementem życia Londynu i towarzyszy mieszkańcom z godziny na godzinę. Wieża stała się już symbolem całego kraju."
 gaudi.2304.f: "„Więc kiedy ta sprawa znów pojawi się podczas pytań do rządu, mam powiedzieć parlamentowi, że to jego wina, iż administracja państwowa jest zbyt rozbudowana?”\n„Ale taka jest prawda, panie ministrze”.\n„Nie chcę prawdy! Chcę czegoś, co mogę powiedzieć parlamentowi! Humphrey, jesteś moim stałym sekretarzem, masz realizować moją politykę. A jednak nadal nie rozumiem, dlaczego tak nieprzejednanie się jej sprzeciwiasz. Muszę wiedzieć, jakie zajmujesz stanowisko w tej sprawie”.\n„Punkt widzenia, panie ministrze, zależy od punktu siedzenia”."
 gaudi.2304.g: "Ding-dong ding-dong, ding-dong ding-dong."
 gaudi.2309.t: "Londyn Utracony!"
 gaudi.2309.d: "Wraz z utratą Londynu straciliśmy wszelką możliwość kontynuowania budowy Pałacu Westminsterskiego."
 gaudi.2309.f: "Jeśli z jakiegokolwiek powodu utracimy Londyn, dotychczasowe postępy budowy #R przepadną całkowicie#!. Tylko Wielka Brytania może kontynuować budowę Pałacu Westminsterskiego. Obcy najeźdźcy nie wykażą zainteresowania jego budową."
 gaudi.2309.g: "Nie możemy pozostawić Londynu w ich rękach na długo!"
 gaudi_ben_decoration_modifier: "Dekoracje Pałacu Westminsterskiego"
 gaudi_praised_by_parliament_modifier: "Pochwała Parlamentu"
 gaudi_ben_decoration_tt: "Po ukończeniu Pałac Westminsterski będzie cieszył się większym prestiżem."
 gaudi.2311.t: "Wapień Złej Jakości"
 gaudi.2311.d: "Ostatnia dostawa materiałów do budowy Pałacu Westminsterskiego okazała się kiepskiej jakości."
 gaudi.2311.f: "Na chwilę ucichł codzienny zgiełk na placu budowy, gdzie gmach parlamentu z każdym dniem piął się coraz wyżej. Krótka kontrola przeprowadzona przez architekta wykazała, że wapień nie spełnia zwykłych standardów jakości. Architekt oznajmił, że woli poczekać, niż narazić przedsięwzięcie na niebezpieczeństwo. W kierownictwie budowy słychać jednak głosy, że mimo wszystko należy wykorzystać ten wapień."
 gaudi.2311.g: "Cenimy brytyjską solidność wykonania."
 gaudi.2311.h: "Musimy dotrzymać harmonogramu!"
 gaudi.2312.t: "Katastrofa!"
 gaudi.2312.f: "Być może należało posłuchać architekta. Być może użycie kruszącego się wapienia do wzniesienia tak ważnej budowli jak Pałac Westminsterski naprawdę nie było dobrym pomysłem. Być może należało więc dwa razy przemyśleć tę decyzję. Ale jest już za późno - materiał gorszej jakości dał dziś o sobie znać, doprowadzając do zawalenia się ściany. Runęła fasada, niwecząc znaczną część pracy wykonanej w ciągu ostatnich tygodni i miesięcy."
 gaudi.2313.t: "Nowa maszyna"
 gaudi.2313.d: "Nasz krajowy przemysł silnikowy wyposażył niedawno plac budowy Pałacu Westminsterskiego w niezwykle nowoczesną maszynę, która przyspiesza postępy prac."
 gaudi.2313.f: "„Dobrze mieć lokomotywy!”"
 gaudi.2313.g: "To jest postęp!"
 gaudi.2314.t: "Pałac Westminsterski: Dobre postępy"
 gaudi.2314.d: "Budowa gmachu parlamentu postępuje zaskakująco szybko. Przy obecnym stanie prac mogłaby zakończyć się wcześniej."
 gaudi.2314.f: "Z nieznanych przyczyn budowa Pałacu Westminsterskiego postępuje sprawniej: być może to zasługa miłości do ojczyzny, wysokich płac, życzliwego wsparcia lokalnych elit lub po prostu lepszej pogody."
 gaudi.2314.g: "Wspaniale."
 gaudi.2315.t: "Pałac Westminsterski: Powolne postępy"
 gaudi.2315.d: "Niestety, kierownictwo budowy w Londynie musiało dziś przyznać, że budowa gmachu parlamentu pozostaje w tyle za harmonogramem i trwa dłużej, niż oczekiwano."
 gaudi.2315.f: "Z nieznanych przyczyn budowa Pałacu Westminsterskiego postępuje wolniej: być może to skutek agitacji wrogich sił politycznych, podkopywania etosu pracy przez związki zawodowe, spisku jezuitów lub po prostu złej pogody."
 gaudi.2315.g: "Godne ubolewania."
 gaudi.2316.t: "[SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle] składa wizytę"
 gaudi.2316.d: "[SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('gaudi_ruler').GetFullName] postanowił osobiście odwiedzić plac budowy Pałacu Westminsterskiego."
 gaudi.2316.f: "Nasz monarcha [SCOPE.sCharacter('gaudi_ruler').GetFullName] już wcześniej wykazywał duże zainteresowanie pracami na londyńskim placu budowy, a teraz zamierza osobiście go odwiedzić. Przygotowania idą pełną parą - wszyscy chcą przecież godnie zaprezentować się przed Jej Królewską Mością! Po ogłoszeniu wizyty zarówno zwykli robotnicy, jak i kierownictwo budowy oraz główny architekt narzucili więc niespotykane dotąd tempo pracy."
 gaudi.2316.g: "Jej Królewska Mość wie, jak motywować."
 gaudi.2317.t: "Burzowa pogoda"
 gaudi.2317.d: "Burza opóźniła nasze prace budowlane w Londynie o kilka tygodni."
 gaudi.2317.f: "Ubiegłej nocy nad Londynem przeszła burza. Wiatr zerwał plandeki i przewrócił rusztowania, uszkadzając okna, figury i dach."
 gaudi.2317.g: "Wolałbym już kometę."
 gaudi.2318.t: "Dekoracje Pałacu Westminsterskiego"
 gaudi.2318.d: "W kręgach politycznych i kierownictwie budowy dominuje obecnie debata nad tym, jak bogato wyposażyć nowy gmach parlamentu. Projektant wnętrz zaproponował wystawny wystrój Pałacu Westminsterskiego, lecz pojawiają się obawy, że mogłoby to znacznie opóźnić ukończenie budowy."
 gaudi.2318.f: "Po zniszczeniu Pałacu Westminsterskiego przez pożar w 1834 roku Sir Charles Barry zatrudnił Augustusa Pugina do opracowania projektów wnętrz na potrzeby swojej propozycji konkursowej. Konkurs architektoniczny miał wyłonić twórcę nowego Pałacu Westminsterskiego. Następnie komisja powierzyła Puginowi pomoc przy realizacji wnętrz nowego pałacu, na których projekt sam wywarł decydujący wpływ. Pod koniec życia Pugina, w lutym 1852 roku, Barry odwiedził go w Ramsgate, a Pugin dostarczył szczegółowy projekt słynnej pałacowej wieży zegarowej. Projekt ten jest bardzo zbliżony do jego wcześniejszych koncepcji, w tym niezrealizowanego projektu dla Scarisbrick Hall w Lancashire. Wieża była ostatnim projektem Pugina, zanim popadł w obłęd."
 gaudi.2318.g: "Może to potrwać dłużej, ale brytyjski parlament powinien być jak najwystawniejszy."
 gaudi.2318.h: "Co dalej? Pokrowce na krzesła ze złotych płatków?"
 gaudi.2319.t: "Poparcie dla Nowego Parlamentu"
 gaudi.2319.d: "[SCOPE.sCharacter('gaudi_ben_leader').GetFullName] jest znany jako gorący zwolennik budowy wystawnego Nowego Pałacu Westminsterskiego. Zdołał już przekonać do tego przedsięwzięcia kilka wpływowych osób ze swojego otoczenia i zebrał dodatkowe darowizny."
 gaudi.2319.f: "Budowa nowego Pałacu rozpoczęła się w 1840 roku. Choć Barry szacował, że potrwa sześć lat i będzie kosztować @money! 724 986, w rzeczywistości realizacja przedsięwzięcia zajęła ponad 30 lat, a koszty przekroczyły @money! 2 miliony."
 gaudi.2319.g: "Poproście o kolejną darowiznę."
 gaudi.2319.h: "Pochwalcie go publicznie!"
