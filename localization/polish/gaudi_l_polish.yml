 gaudi.16.f: "„Ornamentyka to zmarnowana praca, a tym samym zmarnowane zdrowie. Dziś oznacza również marnotrawstwo materiałów, a jedno i drugie prowadzi do marnotrawstwa kapitału. Człowiek współczesny, człowiek o nowoczesnej wrażliwości, nie potrzebuje ornamentyki; brzydzi się nią”. – Adolf Loos"
