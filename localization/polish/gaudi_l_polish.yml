 gaudi.1311.t: "Opracowano Nowy Czołg"
 gaudi.1311.d: "Nasz [concept_tesla_military_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] przez lata pracował nad opracowaniem nowego czołgu dla naszej armii. Teraz wreszcie jest on gotowy, by trafić do naszych brygad zmechanizowanych!"
 gaudi.1311.f: "„Ten maluch zniszczy wszystko na swojej drodze! Wierzcie mi, ogromnie zmieni sposób prowadzenia wojny! Tylko... Na razie starajcie się nie używać go zimą, zapomnieliśmy o ogrzewaniu...”"
 gaudi.1311.g: "Cud techniki!"
