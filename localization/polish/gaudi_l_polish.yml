 je_gaudi_civil_airports_project_reason: "Twój [concept_tesla_aeronautical_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] pracuje nad modernizacją budynku [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] w regionie [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName].\n$mr_divider_for_je$\nProjekt będzie zyskiwał postęp co miesiąc. Za każdym razem, gdy postęp osiągnie #V 18 Punktów#!, budynek otrzyma nowy modyfikator. Łącznie można uzyskać 3 modyfikatory. Każdy kolejny modyfikator wymaga ponownego zapełnienia paska postępu.\n$mr_divider_for_je$\nBieżący Budynek: [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] w regionie [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_gaudi_civil_airports_project_modifier_1_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_gaudi_civil_airports_project_modifier_2_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_gaudi_civil_airports_project_modifier_3_type')]\n\nŁączna Liczba Pozostałych Budynków (bez bieżącego): [JournalEntry.MakeScope.Var('mr_number_of_remaining_list_entries_var').GetValue|V0]\n\nObecny miesięczny postęp: #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_aeronautical_research_progress_tt')] [GetPlayer.MakeScope.ScriptValue('tesla_monthly_aeronautical_engineering_progress_value')|+2] #!#!"
 gaudi.1501.d: "Nasz [concept_tesla_aeronautical_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] przez długi czas pracował nad zwiększeniem możliwości Lotnisk w naszym kraju. Prace obejmowały ulepszanie pasów startowych, budowę nowych samolotów i zwiększanie wydajności ich silników.\n\nŁączna liczba ulepszonych budynków: [GetPlayer.MakeScope.Var('mr_num_improved_airport_buildings_var').GetValue|V0]"
