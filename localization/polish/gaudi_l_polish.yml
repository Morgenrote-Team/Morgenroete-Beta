 ACHIEVEMENT_GROUP_gaudi_achievement_group: "Osiągnięcia Gaudíego"
 ACHIEVEMENT_gaudi_kulturnation: "Naród Kultury"
 ACHIEVEMENT_DESC_gaudi_kulturnation: "Jako naród niemiecki ukończ budowę Katedry Kolońskiej, odkryj Neptuna, załóż Powszechne Niemieckie Towarzystwo Muzyczne, zorganizuj Festiwal Richarda Wagnera, przetransportuj Bramę Isztar do Niemiec i uczyń swoją stolicę kolebką Ekspresjonizmu. Musisz również posiadać aktywnego Dyrygenta i aktywnego sławnego Archeologa."
 ACHIEVEMENT_gaudi_segundo_siglo_de_oro: "Drugi Złoty Wiek"
 ACHIEVEMENT_DESC_gaudi_segundo_siglo_de_oro: "Przywróć Hiszpanii miejsce w gronie wielkich narodów kultury: odkryj Plutona, dokonaj wielkiego odkrycia archeologicznego, uczyń swoją stolicę kolebką Secesji i ukończ budowę Sagrady Famílii! Podczas rozgrywki musisz zatrudnić co najmniej jednego Wielkiego Kompozytora."
