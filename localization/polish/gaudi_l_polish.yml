 gaudi_gyeong_rooms_tt: "Po ukończeniu Gyeongbokgung będzie cieszył się większym prestiżem."
 gaudi.901.t: "Rozpoczyna się budowa Pałacu Gyeongbokgung"
 gaudi.901.d: "[SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('gaudi_ruler').GetFullName] wydał rozkaz odbudowy dawnej rezydencji królewskiej. Za kilka lat znów zabłyśnie ona dawnym blaskiem."
 gaudi.901.f: "Pałac leżał w ruinie przez dwa i pół stulecia. [SCOPE.sCharacter('gaudi_ruler').GetFullName] chce odbudować około 500 budynków mieszczących 7 700 pomieszczeń na obszarze 40 hektarów. To gigantyczne przedsięwzięcie architektoniczne ma zostać ukończone w zaledwie kilka lat."
 gaudi.901.g: "Taki pałac to godna siedziba dla naszego władcy, który nosi tytuł [SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle]!"
 gaudi.902.t: "Pałac Gyeongbokgung ukończony"
 gaudi.902.d: "Po latach prac Gyeongbokgung został wreszcie ukończony. Lśni niczym klejnot nad stolicą. Nasz kraj znów ma wreszcie pałac, który odzwierciedla potęgę i bogactwo Korei."
 gaudi.902.f: "W 1867 roku, za regencji Daewonguna, zabudowania pałacowe odbudowano, tworząc rozległy kompleks obejmujący 330 budynków i 5 792 pomieszczenia. Zajmujący powierzchnię 4 657 576 stóp kwadratowych (432 703 metrów kwadratowych) Gyeongbokgung ponownie stał się rozpoznawalnym symbolem zarówno narodu koreańskiego, jak i koreańskiej rodziny królewskiej. W 1894 roku Japończycy zajęli pałac i zmusili Gojonga do powołania projapońskiego rządu. Ze względu na swoją rangę symbolu suwerenności narodowej Gyeongbokgung został poważnie zniszczony podczas japońskiej okupacji na początku XX wieku. W 1911 roku własność gruntów pałacowych przekazano japońskiemu gubernatorowi generalnemu. W 1915 roku pod pretekstem organizacji wystawy rozebrano ponad 90% budynków. Po wystawie Japończycy zrównali z ziemią pozostałą zabudowę i wznieśli na jej miejscu siedzibę swoich władz kolonialnych, gmach Generalnego Gubernatorstwa."
 gaudi.902.g: "Dawny blask Korei powrócił!"
 gaudi.909.t: "Seul Utracony!"
 gaudi.909.d: "Wraz z utratą Seulu straciliśmy wszelką możliwość kontynuowania budowy pałacu Gyeongbokgung."
 gaudi.909.f: "Jeśli z jakiegokolwiek powodu utracimy Seul, dotychczasowe postępy budowy #R przepadną całkowicie#!. Tylko Seul może kontynuować budowę pałacu Gyeongbokgung. Obcy najeźdźcy nie wykażą zainteresowania jego budową."
 gaudi.909.g: "Nie możemy pozostawić Seulu w ich rękach na długo!"
 gaudi.911.t: "Powolny Postęp Budowy"
 gaudi.911.d: "Prace przy budowie rezydencji królewskiej postępują powoli. Według obliczeń głównego architekta dotychczasowe opóźnienie względem harmonogramu wynosi wiele miesięcy."
 gaudi.911.f: "Z nieznanych przyczyn budowa Gyeongbokgung postępuje wolniej: być może to skutek agitacji wrogich sił politycznych, podkopywania etosu pracy przez związki zawodowe, spisku iluminatów lub po prostu złej pogody."
 gaudi.911.g: "Wprowadźcie dłuższy czas pracy."
 gaudi.911.h: "Wypłaćcie robotnikom premię."
 gaudi.911.i: "Poczekamy."
 gaudi.912.t: "Dobre Postępy Budowy"
 gaudi.912.d: "Budowa Gyeongbokgung postępuje zaskakująco szybko. Według głównego architekta pałac może zostać ukończony wcześniej."
 gaudi.912.f: "Z nieznanych przyczyn budowa Gyeongbokgung postępuje sprawniej: być może to zasługa miłości do ojczyzny, wysokich płac, życzliwego wsparcia lokalnych elit lub po prostu lepszej pogody."
 gaudi.912.g: "Wspaniale."
 gaudi.913.t: "Pożar!"
 gaudi.913.d: "Nad stolicą unoszą się kłęby dymu widoczne z wielu kilometrów - na największym placu budowy w Korei wybuchł pożar!"
 gaudi.913.f: "Przyczyna pożaru nie została jeszcze wyjaśniona, lecz wskutek niedbalstwa i złej organizacji akcji gaśniczej ogień rozprzestrzenił się na liczne budynki i pomieszczenia. Płomienie strawiły przede wszystkim łatwopalne konstrukcje drewniane. Budowa opóźniła się o całe tygodnie i miesiące!"
 gaudi.913.g: "Straszne!"
 gaudi.914.t: "Więcej Pomieszczeń"
 gaudi.914.d: "W trakcie prac budowlanych główny architekt przedstawił nowe plany pozwalające lepiej wykorzystać teren. Umożliwiłoby to wzniesienie dodatkowych budynków i zwiększenie liczby pomieszczeń. Wiązałoby się to jednak z dodatkowymi kosztami i znacznym opóźnieniem."
 gaudi.914.f: "„Tylko 5 000 pomieszczeń? Niech będzie 7 000!”"
 gaudi.914.g: "Potrzebujemy więcej miejsca dla monarchy i jego rodziny."
 gaudi.914.h: "To próżność!"
 gaudi.915.t: "Gość pod wrażeniem"
 gaudi.915.d: "W ostatnich dniach [SCOPE.sCharacter('gaudi_sycophant_leader').GetFullName] zapragnął osobiście przekonać się o rozmiarach i pięknie powstającego pałacu. Na widok wznoszonych budowli zachwycił się rodzącym się arcydziełem."
 gaudi.915.f: "„Mój [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle], nie zdawałem sobie sprawy z własnej znikomości, dopóki nie ujrzałem Gyeongbokgung. Poczułem się jak pyłek na rozległej plaży, jak zagubiona gwiazda na wieczornym niebie. Tego dnia byłem zaledwie świetlikiem wobec słońca. Zaiste, ten pałac będzie najbardziej pałacowym pałacem ze wszystkich pałaców, sanktuarium królów, cesarzy - bogów! Tylko dzięki tobie możemy już ujrzeć tę chwałę, tę genialną ideę zrodzoną w twoim umyśle. Liżę twój cień, a nawet ślina, która spływa z twych ust, jest zbyt cenna, by dotknąć mego nikczemnego ciała po tym, jak ujrzałem tę wspaniałość. Och, zaiste, ja, nędzny robak, wątpiłem, wątpiłem w ciebie, wątpiłem w ten kraj, wątpiłem we wszystkie krainy między morzami a gwiaździstymi niebiosami! Lecz to ja się myliłem, myliłem się tutaj, myliłem się tam, myliłem się na górze, myliłem się na dole. Jak łososiowy drozd przemówił do króla łąkowych jeży, tak...”"
 gaudi.915.g: "Ci pochlebcy to istna plaga."
 gaudi.1005.t: "Pierwszy Telegram"
 gaudi.1005.d: "Dziś [GetPlayer.MakeScope.GetVariable('tesla_engineer_var').GetCharacter.GetFullName] wysłał pierwszą wiadomość za pomocą telegrafu elektrycznego, używając alfabetu, który [GetPlayer.MakeScope.GetVariable('tesla_engineer_var').GetCharacter.GetSheHe] wynalazł. Próba zakończyła się pełnym sukcesem."
 gaudi.1005.f: "W marcu 1843 roku Kongres Stanów Zjednoczonych przyznał Samuelowi Morse’owi 30 000 dolarów na budowę linii telegraficznej między Waszyngtonem a Baltimore w stanie Maryland. Morse początkowo postanowił poprowadzić przewód pod ziemią i poprosił Ezrę Cornella o ułożenie go za pomocą specjalnego pługa kablowego, który Cornell opracował. Prace wstrzymano jednak po ułożeniu około 9,3 mili przewodu, ponieważ linia nie działała prawidłowo. Morse dowiedział się, że Cooke i Wheatstone wykorzystują w Anglii słupy do prowadzenia swoich linii, i postanowił pójść za ich przykładem. Próbę wciąż nieukończonej linii przeprowadzono 1 maja 1844 roku, gdy z konwencji Partii Wigów w Baltimore przesłano do Kapitolu w Waszyngtonie wiadomość o nominowaniu Henry’ego Claya na kandydata na prezydenta Stanów Zjednoczonych. Pokaz działania linii Morse’a odbył się 24 maja 1844 roku między dawną salą Sądu Najwyższego na Kapitolu w Waszyngtonie a stacją kolejową Mount Clare w Baltimore. Rozpoczęto go od przesłania pierwszej wiadomości Morse’a z Waszyngtonu do Alfreda Vaila w Baltimore."
 gaudi.1005.g: "Cóż Bóg uczynił"
 gaudi.1006.t: "Pierwszy Samochód z Silnikiem Spalinowym"
 gaudi.1006.d: "Dziś [GetPlayer.MakeScope.GetVariable('tesla_engineer_var').GetCharacter.GetFullName] przejechał samochodem z silnikiem spalinowym całą trasę od [SCOPE.sState('gaudi_car_state_1_scope').GetName] do [SCOPE.sState('gaudi_car_state_2_scope').GetName], osiągając prędkość 16 kilometrów na godzinę."
 gaudi.1006.f: "„16 kilometrów na godzinę? To zabójczo niebezpieczna prędkość!”"
 gaudi.1006.g: "Brum!"
