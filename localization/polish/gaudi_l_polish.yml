 gaudi.35.t: "Dzielnica Secesyjna w [SCOPE.sState('gaudi_art_nouveau_quarter_state').GetCityHubName]"
 gaudi.35.d: "Nowe prądy artystyczne dotarły również do [SCOPE.sState('gaudi_art_nouveau_quarter_state').GetCityHubName]: w dzielnicy uznawanej obecnie za centrum awangardy powstają nowe budynki w stylu secesyjnym."
 gaudi.35.f: "Pojawieniu się architektury secesyjnej w Brukseli towarzyszył rozkwit sztuki dekoracyjnej utrzymanej w nowym stylu. Do najważniejszych artystów należeli Gustave Strauven, który wykorzystywał kute żelazo do tworzenia barokowych efektów na fasadach brukselskich budynków; projektant mebli Gustave Serrurier-Bovy, znany z niezwykle oryginalnych krzeseł i mebli o ruchomych elementach metalowych; oraz jubiler Philippe Wolfers, który tworzył biżuterię w kształcie ważek, motyli, łabędzi i węży. Nowy styl szybko zwrócił uwagę sąsiedniej Francji. Po zwiedzeniu Hôtel Tassel, zaprojektowanego przez Hortę, Hector Guimard wzniósł Castel Béranger, jeden z pierwszych paryskich budynków w nowym stylu. Paryżanie entuzjastycznie przyjęli oryginalny i malowniczy styl Guimarda. Fasada Castel Béranger została uznana za jedną z najlepszych nowych elewacji w Paryżu, co zapoczątkowało karierę architekta. Punktem kulminacyjnym rozwoju secesji była Wystawa Światowa w Paryżu w 1900 roku. Od kwietnia do listopada 1900 roku przyciągnęła ona niemal 50 milionów zwiedzających z całego świata, prezentując secesyjną architekturę, wzornictwo, wyroby szklane, meble i przedmioty dekoracyjne. Choć wystawa paryska była zdecydowanie największa, inne ekspozycje również odegrały istotną rolę w popularyzacji tego stylu."
 gaudi.35.g: "Nowa, tętniąca życiem kultura."
 gaudi.22.t: "Linie i Miary"
 gaudi.22.d: "Nasz architekt powraca – tym razem z łatą geodezyjną w dłoni i świeżym spojrzeniem na otaczający teren."
 gaudi.22.f: "[ROOT.Var('gaudi_architect_var').GetCharacter.GetFullName] niegdyś zadowalał się szkicowaniem fasad na miejskich placach, studiowaniem gry cieni i ornamentów. Teraz [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe] wytycza linie w terenie.\n\nPodczas [ROOT.Var('gaudi_architect_var').GetCharacter.GetHerHis] podróży [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe] porzucił miasta na rzecz prowincji. W dzikich zakątkach Galicji, na mokradłach delty Padu i wzdłuż wykopów kolejowych w środkowej Anglii [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe] przemierzał tereny w towarzystwie inżynierów, rolników i brygadzistów. [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U] nauczył się odczytywać ukształtowanie terenu tak, jak inni czytają Pismo Święte. [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U] potrafi wskazać, którędy popłynie woda, gdzie osunie się glina i w którym miejscu fundament pęknie za pięć zim.\n\n[ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U] mówi teraz o nachyleniach terenu i punktach geodezyjnych. [ROOT.Var('gaudi_architect_var').GetCharacter.GetHerHis|U] notatniki wypełniają już nie ozdobne szkice, lecz kąty, wysokości i odległości mierzone z dokładnością do cala. Niektórzy twierdzą, że [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe] stał się oschły – zbyt drobiazgowy i nieustępliwy. Jednak gdy [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe] spogląda na puste pole, [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe] już widzi, którędy mogłyby przebiegać przyszłe aleje."
 gaudi.22.g: "Budowa zaczyna się na długo przed położeniem kamienia węgielnego."
 gaudi.23.t: "Architekt, Który Liczy"
 gaudi.23.d: "Po dwóch latach nauki nasz architekt powraca – [ROOT.Var('gaudi_architect_var').GetCharacter.GetHerHis] umysł jest teraz bystrzejszy, a [ROOT.Var('gaudi_architect_var').GetCharacter.GetHerHis] rysunki bardziej osobliwe."
 gaudi.23.f: "[ROOT.Var('gaudi_architect_var').GetCharacter.GetFullName] niegdyś szkicował, kierując się intuicją. Teraz [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe] szkicuje zgodnie z zasadami logiki.\n\n[ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U] spędził [ROOT.Var('gaudi_architect_var').GetCharacter.GetHerHis] czas nie wśród murarzy czy budowniczych, lecz w salach wykładowych. Paryż, Getynga, a nawet Petersburg. [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U] przesiadywał pod tablicami pokrytymi symbolami, pobierając nauki u ludzi, którzy własnymi rękami nie zbudowali niczego, lecz umysłami potrafili stworzyć wszystko. [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U] mówi teraz o symetrii, modułach i krzywych obciążeń opisywanych eleganckimi wzorami.\n\nZniknęły rozmach i ozdobne zawijasy kreślone odręcznie. [ROOT.Var('gaudi_architect_var').GetCharacter.GetHerHis|U] nowe projekty są surowe, osobliwe, niemal nieziemskie w swojej precyzji. Niektórym wydają się zimne i nieludzkie. Wtedy jednak [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe] wyjaśnia: piękno kopuły nie tkwi w jej zdobieniach, lecz w doskonałości jej krzywizny.\n\nUrzędnicy nie wiedzą, co począć z [ROOT.Var('gaudi_architect_var').GetCharacter.GetHerHim]. [ROOT.Var('gaudi_architect_var').GetCharacter.GetHerHis|U] współpracownicy szepczą o braku praktycznego zastosowania tych pomysłów. Inni jednak, zwłaszcza młodzi, słuchają z uwagą."
 gaudi.23.g: "[ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U] buduje to, co inni potrafią sobie jedynie wyobrazić."
 gaudi.24.t: "Papier Przed Kamieniem"
 gaudi.24.d: "Nasz architekt powraca nie z narzędziami ani równaniami, lecz z pieczęciami, podpisami i siecią kontaktów wśród urzędników."
 gaudi.24.f: "[ROOT.Var('gaudi_architect_var').GetCharacter.GetFullName] nie zmaga się już z trudnościami przy desce kreślarskiej. [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U] porusza się teraz z łatwością po urzędowych korytarzach.\n\nPodczas dwóch lat spędzonych za granicą [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe] studiował nie tylko architekturę, lecz także administrację, której [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe] poświęcił równie wiele uwagi. [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U] nauczył się, że o powodzeniu lub upadku projektu decyduje nie jego konstrukcja, lecz urzędowa decyzja. W Wiedniu [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe] obserwował pracę ministerstw; w Brukseli [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe] przyglądał się pracy urzędników wydających pozwolenia; w Marsylii [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe] uczestniczył w posiedzeniach rady miejskiej, podczas których decyzje dotyczące kanalizacji kształtowały przyszły wygląd miasta.\n\nTeraz, po powrocie do kraju, [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe] wie, jakie dokumenty i kiedy należy złożyć, na które przepisy się powołać, komu schlebiać, a kogo ignorować. Przepisy, jak twierdzi [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe], nie są murami, lecz rusztowaniami – można je przesuwać, łagodzić i dostosowywać do potrzeb. I jakimś sposobem pozwolenia zaczynają napływać szybciej niż kiedykolwiek wcześniej."
 gaudi.24.g: "Każda wielka budowla zaczyna się od podpisanego formularza."
 gaudi.25.t: "Architekt Powraca… W Końcu"
 gaudi.25.d: "Nasz architekt wreszcie powrócił ze swojej wielkiej podróży [ROOT.Var('gaudi_architect_var').GetCharacter.GetHerHis] życia. Nikt nie jest do końca pewien, co [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe] przywiózł ze sobą – poza mnóstwem opowieści."
 gaudi.25.f: "[ROOT.Var('gaudi_architect_var').GetCharacter.GetFullName] wyruszył w podróż ze szkicownikami. [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U] powraca z cygaretkami i anegdotami. [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U] ma mnóstwo znajomości, którymi może się chwalić, opinii do wygłoszenia i długów, o których [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe] udaje, że nie pamięta.\n\n[ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U] opowiada pięknie, a nawet przekonująco – o konstrukcjach, których [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe] nigdy nie zmierzył. Zapytany o plany [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe] zmienia temat. Gdy ktoś domaga się rezultatów, [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe] uśmiecha się i zapewnia, że geniuszu nie można poganiać.\n\nNiektórzy twierdzą, że [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe] jest oszustem. Inni uważają [ROOT.Var('gaudi_architect_var').GetCharacter.GetHerHim] za niezrozumianego geniusza. A prawda? Zapewne kryje się gdzieś między kawiarnią w Trieście a spóźnieniem na pociąg w Neapolu."
 gaudi.25.g: "Co [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe] robił przez cały ten czas?!"
 gaudi.26.t: "W Cieniu Mistrza"
 gaudi.26.d: "Nasz architekt powraca – mądrzejszy, bardziej opanowany i naznaczony wpływem wielkiego mistrza."
 gaudi.26.f: "Podczas gdy inni przemierzali dalekie kraje, [ROOT.Var('gaudi_architect_var').GetCharacter.GetFullName] przedłożył głębię wiedzy nad długość podróży. [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U] spędził większość tych lat pod opieką jednego człowieka – sędziwego architekta o legendarnej sławie. Nie tylko w salach wykładowych, lecz także na rusztowaniach i podczas chwil milczącej obserwacji [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe] nauczył się dostrzegać konstrukcję ukrytą za ornamentami i zamysł kryjący się za fasadą. [ROOT.Var('gaudi_architect_var').GetCharacter.GetHerHis|U] linie stały się bardziej przejrzyste. [ROOT.Var('gaudi_architect_var').GetCharacter.GetHerHis|U] spojrzenie – bardziej krytyczne. [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U] nauczył się nie tylko tego, jak budować, ale także dlaczego. Wieści o [ROOT.Var('gaudi_architect_var').GetCharacter.GetHerHis] nauce pod okiem mistrza dotarły do kraju jeszcze przed [ROOT.Var('gaudi_architect_var').GetCharacter.GetHerHim]. Młodzi adepci architektury już pragną pobierać nauki u [ROOT.Var('gaudi_architect_var').GetCharacter.GetHerHim], a miejscy urzędnicy okazują mu niespodziewany szacunek. [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U] powraca jako człowiek ukształtowany przez ciągłość pokoleń, tradycję, a być może pewnego dnia również przez dziedzictwo, które sam po sobie pozostawi."
 gaudi.26.g: "[ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U] dźwiga ciężar mądrości innego człowieka."
 je_gaudi_study_trip: "Podróż Studyjna Architekta"
 je_gaudi_study_trip_reason: "Nasz architekt, [ROOT.Var('gaudi_architect_var').GetCharacter.GetFullName], odbywa obecnie podróż, podczas której zwiedza zabytki architektury, odwiedza akademie i spotyka się z innymi artystami. Przez dwa lata nie będziemy mogli się z nim skontaktować."
