 je_gaudi_sagrada_phase_1: "Sagrada Família: Marzenie Antoniego Gaudíego"
 je_gaudi_sagrada_phase_1_reason: "Antoni Gaudí i Cornet był katalońskim architektem i projektantem z Hiszpanii, uznawanym za najwybitniejszego przedstawiciela katalońskiego modernizmu. Jego dzieła wyróżniają się niezwykle indywidualnym, niepowtarzalnym stylem. W 1883 roku Gaudíemu powierzono kierownictwo nad niedawno rozpoczętą budową barcelońskiej świątyni zwanej Basílica i Temple Expiatori de la Sagrada Família. Gaudí całkowicie zmienił pierwotny projekt, nadając mu swój charakterystyczny styl. Aż do śmierci poświęcał się bez reszty temu przedsięwzięciu. Przez dziesięciolecia Sagrada Família miała pozostawać największą niedokończoną świątynią katolicką na świecie – przedsięwzięciem stulecia balansującym na granicy geniuszu i szaleństwa."
