 je_gaudi_palacio_phase_1: "Serce Meksykańskiej Kultury"
 je_gaudi_palacio_phase_1_reason: "Palacio de Bellas Artes (po polsku: Pałac Sztuk Pięknych) to najważniejsza instytucja kulturalna w Meksyku. Ten monumentalny gmach uchodzi za najwyższej rangi i najważniejszy obiekt kulturalny w kraju, poświęcony teatrowi, tańcowi, muzyce i operze, sztukom plastycznym, literaturze oraz architekturze. Jego budowę rozpoczęto 1 października 1904 roku. Miał zastąpić zdewastowany wcześniej Teatr Narodowy, postrzegany jako relikt kolonializmu."
 je_gaudi_palacio_phase_1_goal: "#E Postęp Budowy#! osiągnie #BLUE 120#! punktów. Obecnie mamy #G [GetGlobalVariable('gaudi_palacio_progress').GetValue]#! punktów. Zazwyczaj zyskujemy jeden punkt miesięcznie."
 je_gaudi_palacio_phase_2: "Serce Meksykańskiej Kultury"
 je_gaudi_palacio_phase_2_reason: "Włoskiemu architektowi Adamowi Boariemu zlecono zaprojektowanie Palacio de Bellas Artes, którego budowa miała zostać ukończona w ciągu czterech lat. Terminu tego nie udało się jednak dotrzymać z powodu licznych problemów. Podmokły grunt w mieście Meksyk powodował osiadanie budynków, pojawiły się również trudności finansowe, a Boari ostatecznie powrócił do Włoch z powodu rewolucji meksykańskiej. Opóźnienie budowy sprawiło też, że w międzyczasie zmieniły się gusta artystyczne i architektoniczne, a w projekcie uwzględniono inspiracje stylem art déco."
 je_gaudi_palacio_phase_2_goal: "#E Postęp Budowy#! osiągnie #BLUE 120#! punktów. Obecnie mamy #G [GetGlobalVariable('gaudi_palacio_progress').GetValue]#! punktów. Zazwyczaj zyskujemy jeden punkt miesięcznie."
