 je_gaudi_urban_planning_project_reason: "Twój [concept_gaudi_architect] [ROOT.Var('gaudi_architect_var').GetCharacter.GetFullName] koncentruje się na modernizacji metod produkcji w [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] w stanie [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName].\n$mr_divider_for_je$\nProjekt będzie zyskiwał postęp co miesiąc. Za każdym razem, gdy postęp osiągnie #V 24 Punkty#!, [GetBuildingType('building_urban_center').GetName] otrzyma nowy modyfikator.\nŁącznie dostępne są 3 modyfikatory. Aby otrzymać każdy kolejny, pasek postępu musi ponownie się zapełnić.\nGdy [GetBuildingType('building_urban_center').GetName] otrzyma wszystkie modyfikatory, zyskasz również #p 5#! @gaudi_architectural_splendour! [concept_gaudi_architectural_splendour].\n$mr_divider_for_je$\nObecny Budynek: [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] w stanie [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_gaudi_urban_planning_project_modifier_1_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_gaudi_urban_planning_project_modifier_2_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_gaudi_urban_planning_project_modifier_3_type')]\n\nŁączna Liczba Pozostałych Budynków (z wyłączeniem obecnego): [JournalEntry.MakeScope.Var('mr_number_of_remaining_list_entries_var').GetValue|V0]\n$concept_gaudi_architectural_splendour$ z Projektu: [JournalEntry.MakeScope.ScriptValue('gaudi_architectural_splendor_from_urban_planning_value')|+0] @gaudi_architectural_splendour!"
