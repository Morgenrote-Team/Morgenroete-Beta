 pmg_base_building_campanile: "Campanile di San Marco"
 pm_default_building_campanile: "Campanile di San Marco"
 building_gaudi_campanile: "Campanile di San Marco"
 gaudi_campanile_cost_modifier: "Campanile di San Marco: Koszt Budowy"
 gaudi_no_campanile_modifier: "Brak Campanile di San Marco"
 je_gaudi_rebuild_campanile: "Tam, gdzie była i taka, jaka była"
 je_gaudi_rebuild_campanile_reason: "Po zawaleniu się Campanile di San Marco wpływowe kręgi sprzeciwiły się odbudowie jednego z symboli Wenecji w pierwotnej formie. Ta historyczna rekonstrukcja będzie wymagała czasu i nakładów finansowych."
 je_gaudi_rebuild_campanile_goal: "#E Postęp Budowy#! osiągnie #BLUE 120#! punktów. Obecnie mamy #G [GetGlobalVariable('gaudi_campanile_progress').GetValue]#! punktów. Zazwyczaj zyskujemy jeden punkt miesięcznie."
 gaudi.70.t: "Zawalenie się Campanile"
 gaudi.70.d: "Campanile di San Marco, jeden z symboli Wenecji, zawaliła się. Nie tylko mieszkańcy Wenecji, lecz cały naród opłakuje tę stratę. Wciąż zupełnie nie wiadomo, co będzie dalej."
 gaudi.70.f: "Campanile di San Marco to dzwonnica bazyliki św. Marka w Wenecji, położona na placu św. Marka. Jest jednym z najbardziej rozpoznawalnych symboli miasta. W lipcu 1902 roku na północnej ścianie wieży pojawiło się niebezpieczne pęknięcie, które w kolejnych dniach stale się powiększało. Wreszcie w poniedziałek 14 lipca około godziny 9:45 Campanile zawaliła się całkowicie, niszcząc również loggettę. Co niezwykłe, nikt nie zginął poza kotem dozorcy. Ze względu na usytuowanie Campanile powstałe szkody były stosunkowo ograniczone. Poza loggettą zniszczeniu uległ jedynie narożnik Biblioteki Marciana. Samą bazylikę ochroniła pietra del bando, wielka porfirowa kolumna, z której niegdyś odczytywano prawa. Mimo to utrata jednego z najważniejszych symboli dawnej kultury włoskiej stała się przedmiotem dyskusji w całym kraju."
 gaudi.70.g: "Odbudujcie Campanile - tam, gdzie była, i taką, jaka była."
 gaudi.70.h: "Zbudujcie coś nowego!"
 gaudi.70.i: "Nie stać nas na to."
 gaudi.71.t: "Odbudowa Campanile"
 gaudi.71.d: "Nowa Campanile di San Marco w Wenecji, odtwarzająca swoją poprzedniczkę co do ostatniej cegły, została dziś uroczyście otwarta. Cała Wenecja świętuje powrót swojego symbolu."
 gaudi.71.f: "Nową Campanile uroczyście otwarto 25 kwietnia 1912 roku, w święto św. Marka, dokładnie 1000 lat po domniemanym położeniu fundamentów pierwotnej budowli."
 gaudi.71.g: "Paron powrócił!"
 gaudi_captain: "Kapitan"
 gaudi_nemo: "Nemo"
 gaudi_nautilus_modifier: "Ruchomy w Ruchomym"
 gaudi_nautilus_strikes_modifier: "Antyimperialistyczna Zemsta"
 gaudi_nemo_button: "Polowanie na Potwora"
 gaudi_nemo_button_desc: "Niewielka wyprawa z doświadczonym przyrodnikiem na pokładzie powinna pomóc nam dowiedzieć się więcej o zagrożeniu ze strony nieznanego potwora."
 je_gaudi_nemo: "Dwadzieścia Tysięcy Mil Podmorskiej Żeglugi"
 je_gaudi_nemo_reason: "Tajemniczy potwór morski, którego naoczni świadkowie uważają za olbrzymiego narwala, atakuje nasze statki handlowe, a nawet porty. Z pomocą przyrodnika możemy zorganizować wyprawę, by dowiedzieć się więcej o tym stworzeniu - i być może je powstrzymać."
 gaudi.80.t: "Walhalla"
 gaudi.80.d: "Ukończenie Walhalli w pobliżu Ratyzbony dało Bawarii miejsce, w którym może wystawiać popiersia wielkich niemieckich geniuszy i oddawać im hołd."
 gaudi.80.f: "Walhalla to pomnik na wzgórzu Bräuberg w bawarskim miasteczku Donaustauf. Wzniesiono ją w latach 1830–1842 z polecenia króla Bawarii Ludwika I według projektu architekta Leo von Klenzego. W obliczu „najgłębszej hańby Niemiec” w 1806 roku, gdy rozwiązano Święte Cesarstwo Rzymskie, a znaczna część ziem późniejszych Niemiec znalazła się pod bezpośrednim wpływem Napoleona, ówczesny następca tronu Ludwik zlecił wykonanie serii Popiersi „Niemców okrytych chwałą”. Jak głosi pierwsza z trzech inskrypcji posadzkowych, już w styczniu 1807 roku Ludwik postanowił jak najszybciej wznieść świątynię chwały ku czci pięćdziesięciu wielkich Niemców. Gdy objął tron w 1825 roku, gotowych było już 60 popiersi, lecz wciąż nie wybrano miejsca pod budowę. Walhalli nadano formę greckiej świątyni doryckiej typu peripteros, wzorowanej na ateńskim Partenonie."
 gaudi.80.g: "Uhonorujcie niemieckiego kompozytora."
 gaudi.80.h: "Uhonorujcie niemieckiego pisarza."
 gaudi.80.i: "Uhonorujcie niemieckiego malarza."
 gaudi.90.t: "Tajemniczy Wieloryb zatapia Statek!"
 gaudi.90.d: "Napływa coraz więcej doniesień, które początkowo uznawano za marynarskie zabobony, lecz których nie można już dłużej lekceważyć. W pewnym okresie kilka statków napotkało na morzu „coś ogromnego”, długi, wrzecionowaty obiekt, czasami emitujący fosforyzującą poświatę, nieporównanie większy i szybszy od jakiegokolwiek wieloryba.\n\nW ciągu ostatniego roku kilka statków floty handlowej zaginęło na morzu za sprawą dziwnego zjawiska, które wielu uważa za wielki, dotąd nieodkryty gatunek wieloryba."
 gaudi.90.f: "Doniesienia o tym zjawisku były w większości zgodne co do kształtu owego obiektu czy stworzenia, niesłabnącej szybkości jego ruchów, zadziwiającej zdolności przemieszczania się i osobliwej żywotności, jaką zdawało się obdarzone. Jeśli był to waleń, rozmiarami przewyższał wszystkie dotąd sklasyfikowane przez naukę. Biorąc pod uwagę uśrednione wyniki obserwacji poczynionych w różnym czasie, można było zasadnie uznać, że ta tajemnicza istota znacznie przekraczała wszelkie rozmiary dopuszczane przez ówczesnych ichtiologów."
 gaudi.90.g: "Ale czy to naprawdę wieloryb?"
 gaudi.91.t: "Tajemniczy Wieloryb atakuje ponownie!"
 gaudi.91.d: "Tajemniczy potwór znów zaatakował! Cała branża żeglugi handlowej jest przerażona."
 gaudi.91.f: "Inżynierowie dokonali oględzin statku Scotia, umieszczonego w suchym doku. Ledwie mogli uwierzyć własnym oczom: dwa i pół jarda poniżej linii wodnej widniał regularny otwór w kształcie trójkąta równoramiennego. Krawędzie przebitych żelaznych płyt były tak równe, że nawet przebijakiem nie dałoby się wykonać tego staranniej. Było więc jasne, że narzędzie, które spowodowało uszkodzenie, nie było czymś zwyczajnym; wbite z nadzwyczajną siłą przebiło żelazną płytę o grubości jednego i trzech ósmych cala, po czym wycofało się ruchem wstecznym, doprawdy niewytłumaczalnym."
 gaudi.91.g: "Trzeba położyć kres temu nikczemnemu zagrożeniu dla pokoju na pełnym morzu!"
 gaudi.92.t: "Tajemniczy Wieloryb atakuje wybrzeże!"
 gaudi.92.d: "Wieloryb - czy cokolwiek to jest - zaatakował miasto portowe, pozostawiając po sobie pas zniszczeń."
 gaudi.92.f: "Odrzucono hipotezę pływającej wyspy i niedostępnej mielizny, popieraną przez osoby niezbyt kompetentne do wydawania osądów. Bo istotnie, jak taka mielizna mogłaby zmieniać położenie z tak zadziwiającą szybkością, gdyby nie miała w swym wnętrzu maszyny? Z tego samego powodu porzucono myśl, że chodzi o unoszący się na wodzie kadłub olbrzymiego wraku.\n\nPozostały zatem tylko dwa możliwe wyjaśnienia, które podzieliły ludzi na dwa odrębne obozy: jedni opowiadali się za potworem o kolosalnej sile, drudzy za okrętem podwodnym o ogromnej mocy napędowej."
 gaudi.93.t: "Profesor i jego Potwór"
 gaudi.93.d: "Po zasięgnięciu informacji o miejscu ostatniego ataku nieznanego stworzenia [SCOPE.sCharacter('dubois_naturalist_scope').GetFullName] wyruszył wraz z odważną załogą na poszukiwanie potwora."
 gaudi.93.f: "„Największe głębiny oceanu są nam zupełnie nieznane. Sondy nie są w stanie do nich dotrzeć. Co dzieje się w tych odległych otchłaniach—jakie istoty żyją lub mogą żyć dwanaście czy piętnaście mil pod powierzchnią wód—jak zbudowane są te zwierzęta—możemy się zaledwie domyślać. Rozwiązanie przedstawionego mi problemu może jednak zmienić postać tego dylematu. Albo znamy wszystkie odmiany istot zamieszkujących naszą planetę, albo ich nie znamy. Jeśli nie znamy ich wszystkich, jeśli Natura wciąż skrywa przed nami tajemnice ichtiologii, nic nie jest bardziej zgodne z rozumem niż uznanie istnienia ryb lub waleni innych rodzajów, a nawet nowych gatunków, których budowa pozwala im zamieszkiwać głębiny niedostępne dla sond i które jakiś osobliwy czy kapryśny przypadek wynosi w długich odstępach czasu ku powierzchni oceanu”."
 gaudi.93.g: "Powodzenia!"
 gaudi.94.t: "[SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] zaginął!"
 gaudi.94.d: "Potwór morski zaatakował statek, którego załoga zamierzała go zbadać. Podczas walki z potworem [SCOPE.sCharacter('dubois_naturalist_scope').GetFullName] wypadł za burtę! Mimo wielodniowych poszukiwań nie udało się go odnaleźć."
 gaudi.94.f: "„W tej chwili, oparty o nadburcie pokładu dziobowego, ujrzałem poniżej Neda Landa, który jedną ręką trzymał się łańcucha odciągowego bukszprytu, a w drugiej dzierżył swój straszliwy harpun, zaledwie dwadzieścia stóp od nieruchomego zwierzęcia. Nagle wyprostował ramię i cisnął harpunem; usłyszałem dźwięczny odgłos uderzenia broni, jakby trafiła w twarde ciało. Światło elektryczne nagle zgasło, a dwie olbrzymie strugi wody runęły na pokład fregaty, przetaczając się niczym potok od dziobu po rufę, przewracając ludzi i zrywając mocowania drzewc. Potem nastąpił straszliwy wstrząs. Wyrzucony za burtę, nie zdążyłem się niczego uchwycić i wpadłem do morza”."
 gaudi.94.g: "Nie! Tylko nie Profesor [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName]!"
 gaudi.95.t: "Morze wyrzuca na brzeg Profesora [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName]!"
 gaudi.95.d: "Znanego przyrodnika [SCOPE.sCharacter('dubois_naturalist_scope').GetFullName] odnaleziono dziś na naszym wybrzeżu, wyrzuconego na brzeg przez morze. Profesor zaginął dość dawno temu, po dołączeniu do wyprawy mającej odkryć prawdę o tajemniczym wielorybie, który podobno zatapia i pożera statki na pełnym morzu. Profesor jest wstrząśnięty swoimi przeżyciami, a jego opowieść jest doprawdy niezwykła. [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] twierdzi, że fala zmyła go za burtę podczas bliskiego spotkania jego statku ze stworzeniem, które w rzeczywistości okazało się zbudowanym przez ludzi okrętem zdolnym do żeglugi pod wodą. [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] utrzymuje, że okrętem dowodzi lub dowodził miłujący wolność samozwańczy obrońca sprawiedliwości, który wyrzekł się wszelkich kontaktów ze stałym lądem na rzecz swobodnego życia na oceanach świata na pokładzie swojego okrętu. Jaka by nie była prawda, liczne szczegółowe relacje Profesora [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] o wielu osobliwych, nowych formach życia, rzekomo napotkanych podczas podróży w charakterze gościa na pokładzie tej dziwnej jednostki, będą przez wiele lat bezcenną pomocą w naszych badaniach naukowych."
 gaudi.95.f: "„To najwyraźniej olbrzymi narwal, i to elektryczny”. -[SCOPE.sCharacter('gaudi_nemo_scope').GetFullName]"
 gaudi.95.g: "Ale czy Kapitan Nemo naprawdę został pokonany?"
 gaudi.1004.t: "Magnetischer Verein Göttingen"
 gaudi.1004.d: "Słynny astronom i matematyk Carl Friedrich Gauß oraz fizyk Wilhelm Eduard Weber założyli międzynarodowe stowarzyszenie mające badać ziemskie pole magnetyczne."
 gaudi.1004.f: "Towarzystwo Magnetyczne, zwane również Getyńskim Towarzystwem Magnetycznym, było stowarzyszeniem badawczym założonym w latach 30. XIX wieku z siedzibą w Getyndze. Jego głównym przedsięwzięciem był globalny projekt badań geofizycznych nad zmianami ziemskiego magnetyzmu w czasie i przestrzeni. Uznaje się je za pierwsze międzynarodowe towarzystwo naukowe. Założyli je getyńscy profesorowie Carl Friedrich Gauß i Wilhelm Weber przy wsparciu Alexandra von Humboldta. Celem było prowadzenie skoordynowanych pomiarów wahań ziemskiego pola magnetycznego za pomocą licznych stacji pomiarowych rozmieszczonych na całym świecie. W ciągu sześciu lat, od 1836 do 1841 roku, pomiary wykonywano w 28 wyznaczonych dniach, za każdym razem przez 24 godziny w odstępach pięciominutowych. W projekcie uczestniczyło do 50 obserwatoriów, w tym 35 w Europie, sześć w Azji, dwa w Afryce, trzy w Ameryce Północnej i cztery na Morzach Południowych. Wyniki przesyłano do Getyngi, gdzie Gauß i Weber poddawali je opracowaniu naukowemu."
 gaudi.1004.g: "Magnesy? Elektryczność? Elektromagnetyzm!"
 gaudi.1004.h: "Aż iskrzy!"
