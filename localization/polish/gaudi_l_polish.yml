 je_gaudi_road_project_reason: "Twój [concept_tesla_civil_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] rozpoczął projekt rozbudowy Dróg w państwie [GetPlayer.GetName]. Projekt będzie zyskiwał Postęp co miesiąc. Za każdym razem, gdy postęp osiągnie [JournalEntry.GetTotalGoalValue|V0], region z najmniejszą dostępną Infrastrukturą otrzyma $gaudi_modern_roads_modifier_with_tooltip$ [concept_modifier].\n\nObecny miesięczny postęp: #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_civil_research_progress_tt')] [GetPlayer.MakeScope.GetVariable('gaudi_monthly_civil_engineering_progress_var').GetValue|2+] #!#!"
