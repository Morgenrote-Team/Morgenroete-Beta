 je_gaudi_gyeong_phase_1: "Odbudowa Pałacu Gyeongbokgung"
 je_gaudi_gyeong_phase_1_reason: "Gyeongbokgung to pałac w Seulu. Jego nazwa oznacza „Pałac Błogosławionego Krajobrazu”. Jest najstarszym i największym z pięciu pałaców wzniesionych w Korei za panowania dynastii Joseon. Pałac Gyeongbokgung został zbudowany z polecenia założyciela dynastii Joseon, króla Taejo, a jego budowę ukończono w 1395 roku. Służył jako rezydencja królewska aż do zniszczenia przez Japończyków podczas wojny Imjin w 1592 roku. Zniszczonego wówczas przez pożar pałacu nie odbudowano przez niemal 300 lat. Może teraz nadszedł czas, by przywrócić mu dawną świetność?"
 je_gaudi_gyeong_phase_1_goal: "#E Postęp Budowy#! osiągnie #BLUE 60#! punktów. Obecnie mamy #G [GetGlobalVariable('gaudi_gyeong_progress').GetValue]#! punktów. Zazwyczaj zyskujemy jeden punkt miesięcznie."
 gaudi_gyeong_phase_1_decision: "Odbudowa Pałacu Gyeongbokgung"
 gaudi_gyeong_phase_1_decision_desc: "Gyeongbokgung to pałac w Seulu. Jego nazwa oznacza „Pałac Błogosławionego Krajobrazu”. Jest najstarszym i największym z pięciu pałaców wzniesionych w Korei za panowania dynastii Joseon. Pałac Gyeongbokgung został zbudowany z polecenia założyciela dynastii Joseon, króla Taejo, a jego budowę ukończono w 1395 roku. Służył jako rezydencja królewska aż do zniszczenia przez Japończyków podczas wojny Imjin w 1592 roku. Zniszczonego wówczas przez pożar pałacu nie odbudowano przez niemal 300 lat. Może teraz nadszedł czas, by przywrócić mu dawną świetność?"
