 notification_gaudi_summer_palace_burned_notification_name: "Pałac Letni Spalony"
 notification_gaudi_summer_palace_burned_notification_desc: "Wspaniały Pałac Letni, od stulecia będący rezydencją chińskich cesarzy, został spalony przez [INITIATOR_COUNTRY.GetName]."
 gaudi_dombau_phase_1_decision: "Ukończ Budowę Katedry Kolońskiej"
 gaudi_dombau_phase_1_decision_desc: "Katedra Kolońska jest uważana za najdoskonalszą katedrę gotycką na świecie. Jej budowę rozpoczęto w XIII wieku, a całe przedsięwzięcie miało kolosalne rozmiary. Po ukończeniu prezbiterium prace stopniowo zwalniały, aż w XV wieku zostały całkowicie wstrzymane. Do dziś nad niedokończoną wieżą południową góruje dźwig budowlany z późnego średniowiecza. Wraz z odrodzeniem uczuć narodowych i romantycznych wśród niemieckiego mieszczaństwa, a zwłaszcza po ponownym odkryciu i rozpowszechnieniu oryginalnych planów budowlanych, umacnia się przekonanie, że ukończenie katedry jest nie tylko przedsięwzięciem ku chwale Bożej, lecz także symbolem niemieckiej kultury i jedności narodu niemieckiego."
 gaudi_dombau_phase_2_decision: "Fasada Południowa Katedry Kolońskiej"
 gaudi_dombau_phase_2_decision_desc: "Po kilku latach trwania prac budowlanych architekci stanęli przed zadaniem wzniesienia i ozdobienia południowej fasady katedry. Dzięki bogatej dekoracji figuralnej jest ona uznawana nie tylko za szczytowe osiągnięcie niemieckiej rzeźby, lecz także za jedno z najważniejszych dzieł architektury neogotyckiej. Sama budowa fasady trwała trzynaście lat, a jej wykończenie i ozdobienie zajęło kolejnych osiemnaście lat."
 gaudi_dombau_phase_3_decision: "Konstrukcja Dachu Katedry Kolońskiej"
 gaudi_dombau_phase_3_decision_desc: "Projekt Katedry Kolońskiej, oparty na gotyckim ideale, nie przeszkodził budowniczym w wykorzystaniu najnowocześniejszych materiałów budowlanych tamtych czasów. Konstrukcję dachu wykonano z żelaza, dzięki czemu aż do wzniesienia Wieży Eiffla była ona największą konstrukcją żelazno-stalową na świecie. Dzięki tej decyzji konstrukcja przetrwała nawet bombardowania aliantów podczas II wojny światowej."
 gaudi_dombau_phase_4_decision: "Fasada Zachodnia i Wieże Katedry Kolońskiej"
 gaudi_dombau_phase_4_decision_desc: "Zachodnia fasada katedry jest największą fasadą kościelną, jaką kiedykolwiek wzniesiono. W najdrobniejszych szczegółach nawiązuje do średniowiecznego projektu opracowanego przez mistrza budowlanego Michaela von Savoyena, utrwalonego w 1370 roku na tak zwanym planie fasady F. Charakterystycznym elementem sylwetki Katedry Kolońskiej jest dwuwieżowa fasada z dwiema strzelistymi iglicami. Mistrz Michael zaprojektował ośmioboczną, całkowicie ażurową iglicę o maswerkowej konstrukcji, zwieńczoną wielostopniowym kwiatonem. Dzięki tym rozwiązaniom, sięgającym granic ówczesnych możliwości technicznych, gotyccy architekci pragnęli podkreślić, że budowla miała być „monumentalnym relikwiarzem”, w którego wnętrzu spoczywają relikwie Trzech Króli."
 gaudi_gotthard_survey_decision: "Zaplanuj Kolej Gotthardzką i Przeprowadź Pomiary Geodezyjne"
 gaudi_gotthard_survey_decision_desc: "W XIX wieku Szwajcarii groziło ominięcie przez międzynarodowe szlaki kolejowe, co oznaczałoby nie tylko pozostanie w tyle za rozwojem nowoczesnego transportu, lecz także utratę szans na uczestnictwo w rewolucji przemysłowej. Wraz z otwarciem linii kolejowej przez Przełęcz Brenner zagrożenie to nabrało nowego wymiaru. Ze względów geograficznych Szwajcaria mierzyła się z większymi trudnościami niż Austria: przeprowadzenie linii kolejowej przez Przełęcz Brenner było znacznie łatwiejsze niż przez alternatywne szlaki szwajcarskie. Budowę kolei alpejskiej w Szwajcarii poprzedziły dziesięciolecia dyskusji nad przebiegiem trasy i finansowaniem takiego przedsięwzięcia. Kluczową rolę w wyborze trasy przez Przełęcz Świętego Gotarda odegrał zuryski polityk i przedsiębiorca Alfred Escher."
 gaudi_gotthard_construction_decision: "Zbuduj Kolej Gotthardzką"
 gaudi_gotthard_construction_decision_desc: "Budowa Kolei Gotthardzkiej jest uznawana za jedno z największych przedsięwzięć budowlanych XIX wieku, porównywane pod względem skali i trudności technicznych do budowy Kanału Sueskiego. Od samego początku najważniejszym i najbardziej ambitnym elementem projektu było wydrążenie tunelu przez masyw Świętego Gotarda. W chwili otwarcia w 1882 roku tunel Gotthardzki, liczący 15 kilometrów długości, był najdłuższym tunelem na świecie. Kolejnym elementem tej ambitnej trasy jest około stu małych i dużych mostów, wykonanych głównie z żelaza i stali. Linia ta nie tylko łączy północną i południową Europę, lecz także stanowi symbol jedności Szwajcarii."
 gaudi_cristo_construction_decision: "Zbuduj Cristo Redentor"
 gaudi_cristo_construction_decision_desc: "W połowie lat 50. XIX wieku lazarysta Pedro Maria Boss jako pierwszy zaproponował wzniesienie chrześcijańskiego pomnika na górze Corcovado ku czci księżniczki Izabeli, regentki Brazylii i córki cesarza Piotra II, jednak projekt nie uzyskał aprobaty. W 1920 roku Koło Katolickie w Rio de Janeiro przedstawiło drugą propozycję wzniesienia na górze monumentalnego posągu. Pomnik zaprojektowali miejscowy inżynier Heitor da Silva Costa oraz artysta Carlos Oswald. Jego wykonaniem zajął się francuski rzeźbiarz Paul Landowski. Posąg w stylu art déco zyskał później światową sławę, stając się obok Głowy Cukru jednym z symboli Rio de Janeiro."
 gaudi_mole_phase_1_decision: "Mole Antonelliana: Od Synagogi do Symbolu Narodowego"
 gaudi_mole_phase_1_decision_desc: "Mole Antonelliana to budowla o charakterze pawilonowym, zwieńczona wysoką, ostro zwężającą się ku górze nadbudową, zaprojektowana przez turyńskiego architekta Alessandra Antonellego. Jej budowę rozpoczęto jako synagogę na zlecenie społeczności żydowskiej, jednak nadmierne ambicje architekta sprawiły, że przedsięwzięcie znacznie wykroczyło poza pierwotne plany. Koszty gwałtownie rosły, a ukończenie budowli opóźniało się o kolejne lata. Pomimo usilnych starań społeczność żydowska ostatecznie nie była w stanie zebrać dalszych funduszy. Mieszkańcy Turynu opowiedzieli się jednak za przejęciem projektu przez władze lokalne, aby ukończyć budowlę, która już w stanie surowym robiła ogromne wrażenie, i poświęcić ją idei zjednoczenia Włoch."
 gaudi_custom_tt_trigger_mole: "Grając jako #yellow Włochy#!"
 gaudi_mole_phase_2_decision: "Mole Antonelliana: Latarnia i Iglica"
 gaudi_mole_phase_2_decision_desc: "Antonelli nieustannie wprowadzał zmiany w projekcie swojej budowli, między innymi dodając tak zwane „tempietto”, czyli neoklasyczną, dwukondygnacyjną sześcioboczną kolumnadę na kwadratowej podstawie, nawiązującą do klasycznej formy pronaosu. Pierwotnie Antonelli zamierzał zwieńczyć iglicę pięcioramienną gwiazdą, jednak później zdecydował się na posąg przedstawiający uskrzydlonego geniusza, zwanego „genio alato”. Wykonanie posągu powierzono rzeźbiarzowi Fumagallemu kilka miesięcy po śmierci Antonellego. Projekt przewidywał wykonanie postaci geniusza z tłoczonej i pozłacanej miedzi, trzymającej w jednej ręce włócznię, a w drugiej gałązkę palmową. Na jego głowie miała znajdować się niewielka pięcioramienna gwiazda osadzona na pręcie. Gdy 10 kwietnia 1889 roku umieszczono gwiazdę na swoim miejscu, całkowita wysokość Mole Antonelliana osiągnęła 167,5 metra (550 stóp), co uczyniło ją wówczas najwyższą ceglaną budowlą w Europie."
 gaudi_ringstrasse_phase_1_decision: "Wiedeńska Ringstrasse: Władca Ringstrasse"
 gaudi_ringstrasse_phase_1_decision_desc: "Wiedeńska Ringstrasse powstała po rozebraniu murów miejskich w połowie XIX wieku. Od lat 60. do 90. XIX wieku wzdłuż Ringstrasse wzniesiono wiele okazałych budynków użyteczności publicznej w eklektycznym stylu historyzmu, nazywanym niekiedy Ringstraßenstil („stylem Ringstrasse”), łączącym elementy architektury klasycystycznej, gotyckiej, renesansowej i barokowej. Wzdłuż całej alei powstały liczne budynki publiczne i prywatne. Arystokraci oraz inni zamożni mieszkańcy prześcigali się we wznoszeniu reprezentacyjnych pałaców, zwanych pałacami Ringstrasse, utrzymanych w monumentalnym stylu historyzmu."
 gaudi_ringstrasse_phase_2_decision: "Wiedeńska Ringstrasse: Opera Dworska i Nowy Ratusz"
 gaudi_ringstrasse_phase_2_decision_desc: "Ringstrasse została uroczyście otwarta zaledwie dziesięć lat po podjęciu decyzji o budowie wspaniałego bulwaru w miejscu rozebranych wiedeńskich bastionów. W tamtym czasie wzdłuż alei wciąż jednak dominowały niezabudowane tereny. Jednym z najważniejszych przedsięwzięć kolejnych lat była budowa nowego, okazałego gmachu opery, który później stał się siedzibą Wiedeńskiej Opery Państwowej. W tym okresie wzniesiono również Nowy Ratusz, a Ringstrasse przekształciła się ze zwykłej alei w nowe centrum Wiednia, zdominowane przez pałace i budynki użyteczności publicznej."
 gaudi_ringstrasse_phase_3_decision: "Wiedeńska Ringstrasse: Uniwersytet i Muzea Sztuki"
 gaudi_ringstrasse_phase_3_decision_desc: "Ringstrasse stała się już prestiżowym adresem, pożądanym przez przemysłowców, bankierów i arystokrację. Budynki użyteczności publicznej zajmują tu szczególne miejsce, reprezentując państwo w sposób godny podziwu pod względem estetycznym. Do ukończenia całego przedsięwzięcia niezbędny jest jednak ostatni etap budowy, w którym główny nacisk należy położyć na wzniesienie nowego gmachu uniwersytetu oraz utworzenie muzeów sztuki."
 gaudi_custom_tt_trigger_ringstrasse: "Grając jako #yellow Austria#!"
 gaudi_sagrada_phase_1_decision: "Sagrada Família: Marzenie Antoniego Gaudíego"
 gaudi_sagrada_phase_1_decision_desc: "Antoni Gaudí i Cornet był katalońskim architektem i projektantem z Hiszpanii, uznawanym za najwybitniejszego przedstawiciela katalońskiego modernizmu. Jego dzieła wyróżniają się niezwykle indywidualnym, niepowtarzalnym stylem. W 1883 roku Gaudíemu powierzono kierownictwo nad niedawno rozpoczętą budową barcelońskiej świątyni zwanej Basílica i Temple Expiatori de la Sagrada Família. Gaudí całkowicie zmienił pierwotny projekt, nadając mu swój charakterystyczny styl. Aż do śmierci poświęcał się bez reszty temu przedsięwzięciu. Przez dziesięciolecia Sagrada Família miała pozostawać największą niedokończoną świątynią katolicką na świecie – przedsięwzięciem stulecia balansującym na granicy geniuszu i szaleństwa."
 gaudi_sagrada_phase_2_decision: "Sagrada Família: Apsyda"
 gaudi_sagrada_phase_2_decision_desc: "Gaudí ukończył kryptę, której budowę rozpoczęto zasadniczo według planów del Villara, wprowadzając jednak własne zmiany w konstrukcji sklepień. W połowie lat 80. XIX wieku można już było odprawiać w niej pierwsze nabożeństwa, a budowę krypty zakończono w 1889 roku. Równolegle z jej wznoszeniem Gaudí rozpoczął gruntowne przeprojektowywanie całej świątyni. W 1885 roku przedstawił nową, całościową koncepcję utrzymaną w stylistyce gotyckiej, w której można było dostrzec 18 wież, choć o mniejszych rozmiarach niż w obecnym projekcie. Zewnętrzna ściana apsydy, ukończona w 1893 roku, jest wyższa, niż przewidywał projekt del Villara. Zawiera elementy neogotyckie, lecz nosi wyraźne piętno stylu Gaudíego, widoczne w niekonwencjonalnym wykorzystaniu form gotyckich, naturalistycznych rzygaczach oraz zwieńczeniach pinakli."
 gaudi_sagrada_phase_3_decision: "Sagrada Família: Fasada Narodzenia Pańskiego"
 gaudi_sagrada_phase_3_decision_desc: "Fasada Narodzenia Pańskiego, poświęcona narodzinom Jezusa, jest ozdobiona scenami nawiązującymi do różnych przejawów życia. Charakterystyczne dla naturalistycznego stylu Gaudíego rzeźby są misternie rozmieszczone i wzbogacone scenami oraz motywami zaczerpniętymi z natury, z których każdy ma własne znaczenie symboliczne. Fasada jest zwrócona ku północnemu wschodowi, w stronę wschodzącego słońca, symbolizującego narodziny Chrystusa. Dzieli się na trzy portyki, z których każdy przedstawia jedną z cnót teologalnych (Nadzieję, Wiarę i Miłość). Nad drzwiami Jezusa w portyku Miłości wznosi się Drzewo Życia."
 gaudi_sagrada_phase_4_decision: "Sagrada Família: Nawa Główna"
 gaudi_sagrada_phase_4_decision_desc: "Plan świątyni ma kształt krzyża łacińskiego i obejmuje pięć naw. Kolumny we wnętrzu stanowią unikatowe dzieło Gaudíego. Nie tylko rozgałęziają się, aby podtrzymywać spoczywający na nich ciężar, lecz także nieustannie zmieniają swój przekrój w wyniku przenikania się różnych form geometrycznych. Najprostszym przykładem jest kolumna o kwadratowej podstawie, której przekrój wraz ze wzrostem wysokości przechodzi w ośmiokąt, następnie w szesnastokąt, aż w końcu przybiera kształt koła. W zasadzie żadna z wewnętrznych powierzchni nie jest płaska. Dekoracje są wszechobecne i niezwykle bogate, składając się w dużej mierze z abstrakcyjnych form łączących płynne krzywizny z ostrymi, nieregularnymi zakończeniami. Nawet najdrobniejsze elementy wykończenia, takie jak żelazne balustrady balkonów i schodów, obfitują w kunsztownie ukształtowane, faliste linie."
 gaudi_sagrada_phase_5_decision: "Sagrada Família: Iglice Apostołów"
 gaudi_sagrada_phase_5_decision_desc: "Pierwotny projekt Gaudíego przewiduje łącznie osiemnaście iglic, symbolizujących, w kolejności od najniższych do najwyższych, Dwunastu Apostołów, Maryję Dziewicę, czterech Ewangelistów i wreszcie Jezusa Chrystusa, któremu poświęcona jest najwyższa z nich. Wszystkie wieże, których kształty mają przywodzić na myśl pastorał biskupi, posiadają długie pionowe żłobienia oraz barwne zwieńczenia ozdobione przedstawieniami zwierząt, świętymi symbolami i cytatami z Biblii. Na każdej z nich znajduje się niewielki złoty krzyż z imieniem odpowiedniego apostoła. Niektóre wieże są połączone wąskimi kamiennymi mostami."
 gaudi_sagrada_phase_6_decision: "Sagrada Família: Fasada Męki Pańskiej"
 gaudi_sagrada_phase_6_decision_desc: "W przeciwieństwie do bogato zdobionej Fasady Narodzenia Pańskiego Fasada Męki Pańskiej jest surowa, oszczędna i prosta, z rozległymi powierzchniami nieozdobionego kamienia oraz ostrymi, prostymi liniami przywodzącymi na myśl kości szkieletu. Poświęcona Męce Chrystusa i cierpieniu Jezusa podczas ukrzyżowania, fasada ma ukazywać grzechy ludzkości. Gaudí pragnął, aby budziła ona lęk wśród patrzących. Zamierzał „łamać” łuki i „przecinać” kolumny, a także wykorzystywać efekt światłocienia (ciemne, kanciaste cienie kontrastujące z ostrym, intensywnym światłem), aby jeszcze mocniej podkreślić surowość i okrucieństwo ofiary Chrystusa. Fasada Męki Pańskiej, zwrócona ku zachodzącemu słońcu, symbolizującemu śmierć Chrystusa, wspiera się na sześciu dużych, pochylonych kolumnach, których kształt ma przypominać napięte mięśnie."
 gaudi_sagrada_phase_7_decision: "Sagrada Família: Transept"
 gaudi_sagrada_phase_7_decision_desc: "Wśród motywów zdobniczych całej świątyni pojawiają się słowa zaczerpnięte z liturgii. Wieże zdobią inskrypcje takie jak „Hosanna”, „Excelsis” i „Sanctus”. Na wielkich drzwiach Fasady Męki Pańskiej umieszczono fragmenty Nowego Testamentu opisujące Mękę Jezusa w różnych językach, przede wszystkim po katalońsku. Fasadę Chwały mają natomiast zdobić słowa Składu Apostolskiego, a jej główne drzwi mają zawierać pełny tekst Modlitwy Pańskiej w języku katalońskim, otoczony licznymi wersjami słów „Chleba naszego powszedniego daj nam dzisiaj” w innych językach. Trzy wejścia symbolizują trzy cnoty: Wiarę, Nadzieję i Miłość. Każde z nich jest również poświęcone innemu etapowi życia Chrystusa."
 gaudi_sagrada_phase_8_decision: "Sagrada Família: Iglice Maryi i Ewangelistów"
 gaudi_sagrada_phase_8_decision_desc: "Iglice Ewangelistów zwieńczone są rzeźbami przedstawiającymi ich tradycyjne symbole: uskrzydlonego wołu (św. Łukasz), uskrzydlonego człowieka (św. Mateusz), orła (św. Jan) oraz uskrzydlonego lwa (św. Marek). Zwieńczenia wież mają 22,5 metra wysokości i składają się z trzech części. Podstawę tworzą cztery rzędy sześciokątów z inskrypcjami Al·leluia i Amen, otoczone ceramicznymi liśćmi palmowymi o wzorze przypominającym jodełkę. W środkowej części znajduje się dwudziestościan przenikający się z kulą, pokrytą ceramiczną mozaiką trencadís i szkłem weneckim, wewnątrz której umieszczono źródła światła. Całość wieńczą rzeźby przedstawiające symbole czterech Ewangelistów, wyposażone w skrzydła i księgi Ewangelii z inicjałami poszczególnych świętych. Wieża Maryi znajduje się nad apsydą i jest zwieńczona wielką dwunastoramienną gwiazdą, symbolizującą Gwiazdę Poranną. Zdobią ją również liczne elementy ikonograficzne nawiązujące do Matki Bożej, takie jak słowa modlitwy Zdrowaś Maryjo oraz różnorodne kwiaty symbolizujące przymioty Matki Jezusa."
 gaudi_sagrada_phase_9_decision: "Sagrada Família: Fasada Chwały"
 gaudi_sagrada_phase_9_decision_desc: "Największą i najbardziej imponującą spośród wszystkich fasad jest Fasada Chwały. Poświęcona Niebiańskiej Chwale Jezusa, przedstawia drogę do Boga poprzez Śmierć, Sąd Ostateczny i Chwałę, podczas gdy Piekło czeka na tych, którzy zboczyli z drogi wyznaczonej przez wolę Bożą. Do Portyku Chwały prowadzą monumentalne schody, biegnące ponad podziemnym przejściem pod ulicą Carrer de Mallorca, którego dekoracje przedstawiają Piekło i występki. Znajdą się tam wizerunki demonów, bożków, fałszywych bogów, a także przedstawienia herezji i schizm. Ukazane zostaną również Czyściec i śmierć, przy czym tę ostatnią symbolizować będą grobowce rozmieszczone wzdłuż ziemi. Portyk posiada siedem wielkich kolumn poświęconych darom Ducha Świętego. U podstawy kolumn znajdują się przedstawienia siedmiu grzechów głównych, natomiast na ich szczytach ukazano siedem cnót niebiańskich."
 gaudi_sagrada_phase_10_decision: "Sagrada Família: Iglica Chrystusa"
 gaudi_sagrada_phase_10_decision_desc: "Wieża Jezusa jest połączona czterema mostami z wieżami Ewangelistów i zwieńczona wielkim sześcioramiennym krzyżem o wysokości 13,5 metra. W jego centralnej części znajduje się baranek, a także inskrypcja „Tu solus Sanctus, Tu solus Dominus, Tu solus Altissimus” oraz słowa „Amen” i „Alleluja”. Każde z czterech ramion krzyża emituje potężne snopy światła widoczne z wielkiej odległości, nawiązując do biblijnych słów Jezusa: „Ja jestem światłością świata”. Wewnątrz Wieża Jezusa będzie podzielona na trzy kondygnacje, symbolizujące stworzenie wszechświata oraz słowa Chrystusa: „Ja jestem drogą, prawdą i życiem”."
 gaudi_sagrada_support_decision: "Wesprzyj Budowę Sagrady Famílii"
 gaudi_sagrada_support_decision_desc: "Budowa Sagrady Famílii powinna być właściwie finansowana z dobrowolnych datków, jednak nasza obecna konstytucja pozwala nam nieco swobodniej interpretować pojęcie „darowizn”, zachęcając mieszkańców naszego kraju do wspierania tego przedsięwzięcia. Dzięki temu otrzymujemy jeden dodatkowy Punkt Postępu Budowy każdego miesiąca."
 gaudi_end_sagrada_support_decision: "Zakończ Wsparcie Budowy Sagrady Famílii"
 gaudi_end_sagrada_support_decision_desc: "Zawsze możemy wycofać nasze wsparcie dla budowy Sagrady Famílii, ale kto rozsądny chciałby to zrobić?"
 gaudi_activate_saxon_palace_decision: "Odrestauruj Pałac Saski"
 gaudi_activate_saxon_palace_decision_desc: "Wraz z wyzwoleniem Warszawy rozpoczyna się nowy rozdział w dziejach narodu polskiego. Zaniedbany Pałac Saski, niegdyś siedziba królów z dynastii Wettinów, powinien odzyskać dawną świetność, między innymi dzięki utworzeniu miejsca pamięci poświęconego Nieznanemu Żołnierzowi."
 gaudi.31.t: "Kino w Stylu Art Déco w [SCOPE.sState('gaudi_art_deco_cinema_state').GetCityHubName]"
 gaudi.31.d: "Nowe, nowoczesne kino otworzyło dziś swoje podwoje."
 gaudi.31.f: "Ważnym rodzajem budowli w stylu art déco były kina. Rozkwit art déco zbiegł się z narodzinami kina dźwiękowego oraz epoką ogromnych, bogato zdobionych kinoteatrów. Wiele z tych kin przetrwało do dziś, choć wnętrza licznych obiektów podzielono na mniejsze sale projekcyjne. Jednym z najsłynniejszych przykładów jest Paramount Theatre w Oakland w Kalifornii, który posiadał okazałe foyer o wysokości czterech kondygnacji, do którego prowadziło dwadzieścia siedem drzwi, a jego widownia mogła pomieścić 3746 osób."
 gaudi.31.g: "Czy nowy film z Busterem Keatonem już wszedł do kin?"
 gaudi.32.t: "Wieżowiec w Stylu Art Déco w [SCOPE.sState('gaudi_art_deco_skyscraper_state').GetCityHubName]"
 gaudi.32.d: "Dzięki fantazyjnym ornamentom, bajecznym mozaikom i zachwycającym kształtom nowy wieżowiec w [SCOPE.sState('gaudi_art_deco_skyscraper_state').GetCityHubName] jest czymś znacznie więcej niż tylko wysokim budynkiem."
 gaudi.32.f: "Styl art déco narodził się w Paryżu, jednak w mieście tym nie zezwalano na wznoszenie budynków wyższych od Katedry Notre-Dame (z jedynym wyjątkiem Wieży Eiffla). W rezultacie Stany Zjednoczone szybko objęły prowadzenie w budowie wysokościowców. Pierwsze wieżowce powstały w Chicago w latach 80. XIX wieku, w stylu Beaux-Arts lub neoklasycystycznym. W latach 20. XX wieku nowojorscy architekci wykorzystali nowy styl art déco przy budowie Chrysler Building i Empire State Building. Empire State Building przez czterdzieści lat pozostawał najwyższym budynkiem na świecie. Wystrój wnętrz i elewacji wieżowców był typowy dla art déco, z geometrycznymi formami i zygzakowatymi wzorami. W Chrysler Building tradycyjne rzygacze znane z gotyckich katedr zastąpiono rzeźbami umieszczonymi na narożnikach budynku, których kształty nawiązywały do ozdób chłodnic samochodów marki Chrysler."
 gaudi.32.g: "Wieżowce z klasą."
 gaudi.33.t: "Art Deco Airport"
 gaudi.33.d: "Nowe lotnisko w luksusowym stylu art déco wita pasażerów z całego świata i już od chwili przybycia ukazuje zagranicznym gościom wielkość naszego narodu."
 gaudi.33.f: "Na początku nowego stulecia lotniska stały się symbolem postępu. Podbój przestworzy, przez długi czas uważany za nieosiągalne marzenie ludzkości, nagle stał się czymś oczywistym. Piloci rywalizowali ze sobą, bili rekordy i podejmowali próby okrążenia świata. Łączyli w sobie ideał starożytnego bohatera z najnowszymi osiągnięciami techniki. Jednocześnie podróżowanie samolotem pasażerskim było oznaką wysokiego statusu społecznego, kojarzoną z wyrafinowaniem i luksusem. Lotniska w stylu art déco nawiązywały do tych skojarzeń, przekładając je na sugestywne formy architektoniczne, zarówno poprzez bogate dekoracje, jak i monumentalne rozmiary."
 gaudi.33.g: "Howard Hughes byłby z tego dumny."
 gaudi.34.t: "Biuro w Stylu Art Déco"
 gaudi.34.d: "Dziś otwarto nowy budynek rządowy. Jego fantazyjna fasada obwieszcza triumf stylu art déco."
 gaudi.34.f: "Styl art déco kojarzono przede wszystkim z instytucjami związanymi z bogactwem i luksusem, takimi jak domy handlowe, giełdy, kina i teatry. Z czasem jednak styl ten rozpowszechnił się również w instytucjach państwowych. Wkrótce zaczęto wznosić w nim także ratusze, gmachy sądów i budynki administracji publicznej, takie jak urzędy pocztowe."
 gaudi.34.g: "To już nie są zwykłe biura!"
 gaudi.50.t: "Sen w Stylu Art Déco"
 gaudi.50.d: "[ROOT.GetCountry.GetName] stało się wspaniałym przykładem nowoczesnej i luksusowej architektury. Cały świat zazdrości nam tego prestiżu!"
 gaudi.50.f: "„Tout sert au luxe, aux plaisirs de ce monde.\nO le bon temps que ce siecle de fer !\nLe superflu, chose tres necessaire,\nA reuni l’un et l’autre hemisphere.\n\nWszystko służy zbytkowi i rozkoszom tego świata.\nO, jakże szczęśliwe czasy nadeszły w tym wieku żelaza!\nZbytek, rzecz tak bardzo potrzebna,\nPołączył obie półkule świata”.\n– Wolter"
 gaudi.50.g: "Uniesienie przenoszące do innego świata!"
 gaudi.60.t: "Spalenie Pałacu Letniego"
 gaudi.60.d: "Wysocy rangą oficerowie naszej armii w Chinach domagają się odwetu po tym, jak kilku obywateli naszego kraju zostało pojmanych i zamordowanych. Nigdy więcej żaden Chińczyk nie powinien odważyć się choćby krzywo spojrzeć na jednego z naszych rodaków!"
 gaudi.60.f: "„Był w pewnym zakątku świata jeden z jego cudów. Cud ten nazywał się Pałacem Letnim. Sztuka opiera się na dwóch zasadach: Idei, która rodzi sztukę europejską, oraz Chimerze, która rodzi sztukę Wschodu. Pałac Letni był dla sztuki zrodzonej z Chimery tym, czym Partenon jest dla sztuki zrodzonej z Idei. Był czymś w rodzaju nieznanego, olśniewającego arcydzieła, dostrzeganego z oddali w półmroku, niczym sylwetka cywilizacji Azji na horyzoncie cywilizacji Europy.\nTen cud przestał istnieć.\nPewnego dnia do Pałacu Letniego wtargnęło dwóch bandytów. Jeden rabował, drugi podpalał. Zwycięstwo, jak się zdaje, potrafi być złodziejką. Zniszczenia Pałacu Letniego dokonali wspólnie obaj zwycięzcy. Jeden z nich napełnił sobie kieszenie, a gdy drugi to zobaczył, napełnił własne kufry. Potem wrócili do Europy, ramię w ramię, śmiejąc się beztrosko. Oto historia dwóch bandytów.\nMy, Europejczycy, uważamy się za cywilizowanych, a Chińczyków za barbarzyńców. Oto, co cywilizacja uczyniła barbarzyństwu”. – Victor Hugo"
 gaudi.60.g: "Spalić go doszczętnie!"
 gaudi.60.h: "Tylko barbarzyńcy mogliby wpaść na taki pomysł."
 gaudi.61.t: "Pałac Letni Spalony!"
 gaudi.61.d: "W jednym z najbardziej barbarzyńskich aktów w dziejach świata wróg splądrował cesarską rezydencję dynastii Qing i podpalił Pałac Letni!"
 gaudi.61.g: "Doprawdy, przechodzimy przez dolinę łez..."
 gaudi.62.t: "Spalenie Big Bena"
 gaudi.62.d: "Zemsta jest słodka."
 gaudi.62.f: "„Tłum był spokojny, raczej zadowolony niż niezadowolony. Gdy zrywał się wiatr, ludzie pohukiwali i gwizdali, jakby chcieli go zachęcić: „Oto rozgorzał ogień dla Izby Lordów!”, „To kara za ustawę o ubogich!”, „Oto idą z dymem ich ustawy!”. Takie okrzyki zdawały się przeważać. Nigdzie nie dostrzegłem ani jednego człowieka, któremu byłoby żal”. – Thomas Carlyle"
 gaudi.63.t: "Pałac Westminsterski Spalony!"
 gaudi.63.d: "W jednym z najbardziej barbarzyńskich aktów w dziejach świata wróg splądrował siedzibę brytyjskiego parlamentu i podpalił Big Bena!"
 gaudi.100.t: "Śpiący Olbrzym"
 gaudi.100.d: "Idealizacja średniowiecza w epoce romantyzmu sprawiła, że coraz więcej osób zaczęło postrzegać ukończenie Katedry Kolońskiej jako zadanie o znaczeniu narodowym."
 gaudi.100.f: "W 1770 roku Johann Wolfgang von Goethe zachwycił się gotycką Katedrą w Strasburgu, zapoczątkowując tym samym romantyczne odkrywanie na nowo gotyckiego stylu architektonicznego. Później publicyści wychwalali Katedrę Kolońską jako dzieło sztuki, które wciąż oczekiwało na ukończenie. Ostatecznie katolicki publicysta Joseph Görres nadał dyskusji nowy kierunek, gdy w 1814 roku ogłosił katedrę narodowym sanktuarium, czyniąc z niej symbol upragnionego niemieckiego państwa narodowego. W centrum nieustających starań o ukończenie katedry znajdował się Sulpiz Boisserée, marszand działający w Kolonii. Jego wysiłki nabrały rozpędu, gdy w latach 1814 i 1816 wraz z Georgiem Mollerem zdołał ponownie odnaleźć plan fasady z 1370 roku, stanowiący podstawę projektu zachodniej fasady katedry. W latach 1821–1831 Boisserée opublikował serię rycin przedstawiających katedrę w jej ukończonej postaci. Dzieło to znacząco przyczyniło się do wzrostu entuzjazmu dla budowy katedry w całych Niemczech. Romantyczna idealizacja gotyku, uznawanego wówczas za prawdziwie niemiecki styl architektoniczny, oraz przedstawianie katedry jako niemieckiego pomnika narodowego ostatecznie przekonały pruskiego następcę tronu Fryderyka Wilhelma do poparcia przedsięwzięcia. Idea ukończenia katedry, początkowo rozwijana w Kolonii, stała się tym samym sprawą pruską, a nawet ogólnoniemiecką, i po raz pierwszy pojawiła się realna możliwość jej urzeczywistnienia."
 gaudi.100.g: "To prawdziwy olbrzym."
 gaudi.101.t: "Rozpoczyna się Pierwszy Etap Budowy"
 gaudi.101.d: "Podczas dzisiejszej uroczystości wmurowano drugi kamień węgielny katedry w Kolonii."
 gaudi.101.f: "4 września 1842 roku król Prus Fryderyk Wilhelm IV oraz koadiutor i późniejszy arcybiskup Johannes von Geissel położyli kamień węgielny pod dalszą budowę katedry. Kamień wciągnięto na wciąż nieukończoną wieżę południową i tam wmurowano."
 gaudi.101.g: "Rozpoczyna się nowy etap budowy."
 gaudi.102.t: "Pierwszy Etap Budowy Ukończony"
 gaudi.102.d: "Ukończyliśmy pierwszy etap budowy katedry w Kolonii."
 gaudi.102.f: "Zaledwie sześć lat po położeniu kamienia węgielnego pod dokończenie budowy katedry wszystkie nawy boczne korpusu nawowego i transeptu otrzymały sklepienia, a mury ich naw głównych wzniesiono ponad poziom triforium. Nad triforium zamontowano otwartą od dołu więźbę dachową, dzięki czemu można było korzystać z korpusu nawowego i transeptu pomimo trwających wyżej prac."
 gaudi.102.g: "Kontynuujmy nasze dzieło."
 gaudi.103.t: "Rozpoczyna się Drugi Etap Budowy"
 gaudi.103.d: "Nasi budowniczowie rozpoczęli wznoszenie i zdobienie południowej fasady katedry."
 gaudi.103.f: "Już w średniowieczu budowniczowie ukończyli prezbiterium, lecz zaniedbali korpus nawowy i transept. Gdy prace nad obiema tymi częściami posunęły się naprzód, można było skupić się na kształtowaniu wielkich fasad bocznych, przy czym fasada północna otrzymała skromniejszą formę niż południowa."
 gaudi.104.t: "Drugi Etap Budowy Ukończony"
 gaudi.104.d: "Ukończyliśmy drugi etap budowy katedry w Kolonii."
 gaudi.104.f: "Południową fasadę zaprojektował mistrz budowlany Ernst Friedrich Zwirner, który uzgodnił swoje plany z Karlem Friedrichem Schinklem, Sulpizem Boisserée i królem Fryderykiem Wilhelmem IV. Wzniesiono ją w latach 1842–1855, a dziś uchodzi za jedno z najważniejszych i najdoskonalszych pod względem artystycznym dzieł neogotyku. Po lewej stronie fasady znajduje się portal św. Urszuli, pośrodku portal Męki Pańskiej, a po prawej portal św. Gereona."
 gaudi.105.t: "Rozpoczyna się Trzeci Etap Budowy"
 gaudi.105.d: "Po licznych sporach nasi inżynierowie rozpoczęli prace nad dachem katedry."
 gaudi.105.f: "Pomimo silnego sprzeciwu licznych fundatorów wspierających dokończenie budowy katedry, którzy opowiadali się za drewnianą więźbą dachową, taką jak nad częściami świątyni ukończonymi w średniowieczu, mistrz budowlany Ernst Friedrich Zwirner polecił wykonać konstrukcje dachów i wieży nad skrzyżowaniem naw z żelaza. Jako argumenty przemawiające za tak nowoczesnym rozwiązaniem wskazywał oszczędności, mniejszy ciężar i mniejsze obciążenie ogniowe."
 gaudi.106.t: "Trzeci Etap Budowy Ukończony"
 gaudi.106.d: "Ukończyliśmy trzeci etap budowy katedry w Kolonii."
 gaudi.106.f: "W 1863 roku ukończono korpus nawowy i transept, z wyjątkiem przestrzeni między wieżami. Można było wreszcie zburzyć tymczasową ścianę, która przez stulecia oddzielała ukończone prezbiterium od nieukończonej części świątyni, i po raz pierwszy podziwiać niemal całe wnętrze katedry."
 gaudi.107.t: "Rozpoczyna się Czwarty Etap Budowy"
 gaudi.107.d: "Dziś usunięto późnośredniowieczny żuraw budowlany z południowej wieży katedry w Kolonii, dotychczas uznawany za symbol miasta."
 gaudi.107.f: "Po ukończeniu korpusu nawowego i transeptu dokończono wreszcie budowę wież. Warsztat budowy katedry, zatrudniający wówczas ponad 500 osób, korzystał z najnowocześniejszych rozwiązań technicznych, takich jak wózki z wciągarkami poruszające się po torach na placu budowy czy maszyna parowa."
 gaudi.108.t: "Katedra w Kolonii Ukończona"
 gaudi.108.d: "Dziś nastał chwalebny dzień dla architektury i kultury niemieckiej: po dziesięcioleciach prac ukończono katedrę w Kolonii. Zaiste, prześcignęliśmy gotyckich mistrzów!"
 gaudi.108.f: "Gdy ostatecznie ukończono katedrę, była ona najwyższą budowlą na świecie dzięki dwóm wieżom o wysokości ponad 157 metrów, choć podczas budowy bardzo ściśle trzymano się średniowiecznego projektu fasady, sporządzonego 600 lat wcześniej, około 1280–1290 roku. Dopiero wieża Eiffla, wytwór epoki przemysłowej, miała po ukończeniu przewyższyć wysokość zaplanowaną już w średniowieczu."
 gaudi.108.g: "I tam właśnie jego miejsce!"
 gaudi.109.t: "Kolonia Utracona!"
 gaudi.109.d: "Wraz z utratą północnej Nadrenii straciliśmy wszelką możliwość kontynuowania budowy katedry w Kolonii."
 gaudi.109.f: "Jeśli z jakiegokolwiek powodu utracimy północną Nadrenię, dotychczasowe postępy budowy nie przepadną całkowicie. Inne państwo, o ile jego kulturą podstawową jest kultura niemiecka, może kontynuować budowę katedry od ostatniego etapu. Obcy najeźdźcy nie wykażą natomiast zainteresowania dalszą budową."
 gaudi.109.g: "Nie możemy pozostawić Kolonii w ich rękach na długo!"
 gaudi.111.t: "Materiał Gorszej Jakości"
 gaudi.111.d: "Ostatnia dostawa materiałów do budowy katedry w Kolonii okazała się kiepskiej jakości."
 gaudi.111.f: "Już wstępne oględziny wykazały, że dostarczony kamień był miejscami porowaty. Mistrz budowlany bez wahania odrzucił więc całą partię. Z pewnością opóźniłoby to budowę i pociągnęło za sobą dodatkowe koszty, lecz ostatecznie jakość jest najważniejsza. Niektórzy twierdzą jednak, że dla oszczędności czasu i pieniędzy powinniśmy nie tylko wykorzystać ten kamień, ale także odłożyć część lepszych materiałów budowlanych, a uzyskane w ten sposób środki przeznaczyć na... inne cele."
 gaudi.111.g: "Jakość ma swoją cenę."
 gaudi.111.h: "Jakby ktokolwiek miał to zauważyć."
 gaudi.112.t: "Niedbała budowa"
 gaudi.112.d: "Materiał gorszej jakości dał o sobie znać: dziś rano zawaliła się część katedry w Kolonii, powodując znaczne zniszczenia."
 gaudi.112.f: "Kościół w Kolonii wali się,\nwali się, wali się,\nKościół w Kolonii wali się,\nmoja piękna pani!"
 gaudi.112.g: "Któż mógł to przewidzieć?"
 gaudi.113.t: "Szybszy Postęp Budowy"
 gaudi.113.d: "Prace nad katedrą w Kolonii postępują lepiej, niż oczekiwano. Spodziewamy się wyprzedzić harmonogram o kilka miesięcy."
 gaudi.113.f: "Nowoczesna technologia, sprawna organizacja pracy, nieprzerwane dostawy materiałów i dobra pogoda sprzyjają postępom budowy."
 gaudi.113.g: "Przewidziałem to!"
 gaudi.114.t: "Wypadek"
 gaudi.114.d: "Na placu budowy katedry w Kolonii doszło do strasznego wypadku. Część robotników została ranna, a niektórzy nawet zginęli!"
 gaudi.114.f: "Niestety, nawet najlepsze przepisy budowlane nie są w stanie zapobiec wypadkom — zwłaszcza gdy niektóre materiały mają już znacznie więcej niż kilka lat."
 gaudi.114.g: "Co za tragedia!"
 gaudi.115.t: "Nowe miejsca pracy"
 gaudi.115.d: "Budowa katedry przyciągnęła do Kolonii wielu nowych mieszkańców."
 gaudi.115.f: "Podobnie jak w średniowieczu, budowa katedry zrodziła wiele nowych potrzeb w życiu miasta, które często można było zaspokoić jedynie dzięki napływowi nowych pracowników. Trzeba zatrudnić nie tylko samych robotników budowlanych. Potrzebują oni również gospód, sklepów, dostawców i nowych mieszkań, które przecież także ktoś musi zbudować. Doprowadziło to do rozkwitu Kolonii, z którego niektórzy chcą czerpać bezpośrednie lub pośrednie korzyści."
 gaudi.115.g: "Wielkie przedsięwzięcie potrzebuje wielkich ludzi."
 gaudi.116.t: "Spór polityczny wokół katedry"
 gaudi.116.d: "Nie wszyscy przychylnie patrzą na dokończenie budowy katedry w Kolonii. Jeden z przywódców ruchu robotniczego publicznie potępił dziś to „marnotrawstwo”."
 gaudi.116.f: "„Pytam was, panowie — cóż skłania państwo do tak horrendalnych wydatków, które służą jedynie klerykalizmowi, nacjonalizmowi i kapitalizmowi? Możni zyskują prestiż, bogacze pomnażają zyski dzięki udziałowi w budowie, a Kościół, który wpaja proletariatowi zabobony i zacofanie, wychodzi z tej reakcyjnej polityki jeszcze silniejszy. Lecz kto, pytam was, wznosi te pełne zbytku i marnotrawstwa zamki na lodzie? Otóż zwykły robotnik! Zwykły robotnik, którego się poniewiera, który zostaje okaleczony lub ginie w wypadku na budowie, a którego jedyną nagrodą jest obietnica nieistniejącego królestwa niebieskiego. Ta średniowieczna katedra uosabia wszystko, co złe w naszym kraju!”"
 gaudi.116.g: "A co z prognozą pogody?"
 gaudi.116.h: "Ma rację."
 gaudi.117.t: "Polityczne poparcie dla katedry"
 gaudi.117.d: "Patriotycznie nastawiony przedstawiciel drobnomieszczaństwa wygłosił dziś płomienne przemówienie popierające budowę katedry w Kolonii."
 gaudi.117.f: "„Panowie, nie słuchajcie obiekcji zdrajców, zawistników i ludzi małego ducha. Doprowadzając do rychłego ukończenia katedry w Kolonii, nasz naród wyzwolił się z dawnej dekadencji i podąża śladami swoich przodków. Kiedy jakikolwiek kraj zrealizował równie wielkie przedsięwzięcie? Trzeba sięgnąć pamięcią do budowniczych średniowiecznych katedr — a może nawet do budowniczych piramid. Zapisujemy się na kartach historii. A przyszłe pokolenia, spoglądając na te kolosalne wieże, będą pamiętać, że podjęliśmy wówczas słuszną decyzję. Katedra to więcej niż kościół. To pomnik, budowla budząca natchnienie, która przez kolejne dziesięciolecia i stulecia będzie inspirować wielu Niemców do nowych dokonań!”"
 gaudi.117.g: "Brawo! Dobrze powiedziane!"
 gaudi.117.h: "Powinniśmy to wykorzystać, by zdobyć dalsze poparcie."
 gaudi.118.t: "Przedsięwzięcie narodowe czy religijne?"
 gaudi.118.d: "W parlamencie toczy się obecnie poważna debata nad tym, czy katedra w Kolonii jest przede wszystkim budowlą narodową, czy religijną."
 gaudi.118.f: "Już od chwili, gdy zaczęto rozważać dokończenie średniowiecznej budowli, podkreślano znaczenie katedry dla Niemców jako „zjednoczonego” narodu. Wielu postrzegało średniowiecze jako epokę, do której naród niemiecki powinien się odwoływać, gdyż czasy Świętego Cesarstwa Rzymskiego, zwłaszcza pod rządami dynastii salickiej i Hohenstaufów, uważano za szczyt potęgi Niemiec. Inni widzieli w takim podejściu rozmywanie idei chrześcijańskiej. Katedra była przecież nie tylko kościołem, lecz także siedzibą jednego z najpotężniejszych biskupów w Niemczech. Chrześcijańskie dzieje Kolonii sięgały czasów Cesarstwa Rzymskiego, a kwestia Boga i narodu często mogła raczej dzielić niż jednoczyć."
 gaudi.118.g: "To przedsięwzięcie narodowe."
 gaudi.118.h: "To przedsięwzięcie narodowe i religijne."
 gaudi.118.i: "To przedsięwzięcie religijne."
 gaudi.119.t: "Loteria na rzecz budowy katedry"
 gaudi.119.d: "Loteria na rzecz budowy katedry przyniosła w tym roku tak nadzwyczajne zyski, że prace mogą postępować znacznie szybciej, niż oczekiwano."
 gaudi.119.f: "Początkowo mistrz budowlany Zwirner oszacował koszt ukończenia korpusu nawowego na 1,2 miliona talarów, a systemu przypór — na taką samą sumę. Na tej podstawie roczne koszty budowy obliczono na 100 000 talarów, z czego połowę król Prus zamierzał pokryć ze specjalnego funduszu budowlanego. Aby zebrać pozostałe środki, założono w Kolonii Centralne Stowarzyszenie Budowy Katedry (Zentral-Dombau-Verein), które początkowo finansowano ze składek. Gdy w 1863 roku ukończono wnętrze, obliczenia wykazały, że przy utrzymaniu dotychczasowego poziomu finansowania dokończenie budowy zajmie jeszcze 50 lat. W 1864 roku stowarzyszenie postanowiło więc zorganizować loterię na rzecz katedry, która okazała się dobrym źródłem dochodów. Ogółem stowarzyszenie pokryło około 60 procent wszystkich kosztów, podczas gdy udział państwa w kosztach budowy katedry wyniósł zaledwie około 32 procent."
 gaudi.119.g: "Jackpot!"
 gaudi.120.t: "[SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('gaudi_ruler').GetFullName] wspiera budowę katedry"
 gaudi.120.d: "[SCOPE.sCharacter('gaudi_ruler').GetFullName] wykazuje duże osobiste zainteresowanie romantyzmem. Z tego powodu przekazał prywatną darowiznę na budowę katedry."
 gaudi.120.f: "Z historycznego punktu widzenia budowa katedry w Kolonii była również w pewnej mierze zasługą osobistej inicjatywy króla Fryderyka Wilhelma IV, który uchodził za człowieka bogobojnego i związanego z romantyzmem. Przez całe życie żywo interesował się sztuką i architekturą."
 gaudi.120.g: "Niech żyje nasz dobry [SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('gaudi_ruler').GetFullName]!"
 gaudi.121.t: "Zwiedzanie"
 gaudi.121.d: "Katedra w Kolonii wciąż jest w budowie, ale postępy są imponujące. Powinniśmy zaprosić sojusznika i wszystko mu pokazać."
 gaudi.121.f: "Nawet jako nieukończona budowla katedra w Kolonii robiła wrażenie na odwiedzających i pobudzała ich wyobraźnię. Tak było również w okresie, gdy na kolejne dziesięciolecia ponownie stała się placem budowy. Widok postępujących prac zainspirował Roberta Schumanna do napisania III symfonii, a królową Wiktorię podczas wizyty oprowadzono po katedrze i zapoznano z planami jej ukończenia."
 gaudi.121.g: "Zaprośmy naszego sojusznika do Kolonii."
 gaudi.121.h: "To tylko zakłóci nasze prace."
 gaudi.122.t: "Darowizna na rzecz katedry w Kolonii?"
 gaudi.122.d: "Nasz ambasador został zaproszony do zwiedzenia placu budowy katedry w Kolonii. Wizyta zrobiła na nim ogromne wrażenie i teraz pyta, czy nie zechcielibyśmy zyskać międzynarodowego prestiżu, przekazując darowiznę na rzecz katedry."
 gaudi.122.f: "Nawet jako nieukończona budowla katedra w Kolonii robiła wrażenie na odwiedzających i pobudzała ich wyobraźnię. Tak było również w okresie, gdy na kolejne dziesięciolecia ponownie stała się placem budowy. Widok postępujących prac zainspirował Roberta Schumanna do napisania III symfonii, a królową Wiktorię podczas wizyty oprowadzono po katedrze i zapoznano z planami jej ukończenia."
 gaudi.122.g: "To wspaniałe przedsięwzięcie zasługuje na nasze wsparcie."
 gaudi.122.h: "Nie jest znowu takie wspaniałe."
 gaudi.123.t: "Darowizna od Sojusznika"
 gaudi.123.d: "Po zwiedzaniu ambasador naszego sojusznika był tak zachwycony, że postanowił wesprzeć przedsięwzięcie darowizną."
 gaudi.123.f: "Nawet jako nieukończona budowla katedra w Kolonii robiła wrażenie na odwiedzających i pobudzała ich wyobraźnię. Tak było również w okresie, gdy na kolejne dziesięciolecia ponownie stała się placem budowy. Widok postępujących prac zainspirował Roberta Schumanna do napisania III symfonii, a królową Wiktorię podczas wizyty oprowadzono po katedrze i zapoznano z planami jej ukończenia."
 gaudi.123.g: "Prawdziwych przyjaciół rozpoznaje się od razu."
 gaudi.124.t: "Nowe maszyny w Kolonii"
 gaudi.124.d: "Wykorzystanie najnowocześniejszych maszyn przyspiesza mozolną budowę katedry w Kolonii o wiele miesięcy."
 gaudi.124.f: "W podnoszeniu materiałów na wyższe poziomy katedry pomagały zwłaszcza maszyny parowe. Wiele innych zdobyczy techniki również pozwalało pracować znacznie wydajniej niż w średniowieczu."
 gaudi.124.g: "To jest postęp!"
 gaudi.125.t: "Kolej dostarcza kamień na budowę katedry"
 gaudi.125.d: "Budowa linii kolejowej w okolicach Kolonii pozwoliła przyspieszyć budowę katedry o kilka miesięcy."
 gaudi.125.f: "Tradycyjnie materiały budowlane dostarczano do Kolonii drogą wodną po Renie. W kolejnych latach żegluga rzeczna pozostała najchętniej wybieranym sposobem przewozu dużych ilości materiałów do miasta katedralnego. Rozwój transportu kolejowego pozwalał jednak w razie potrzeby zmieniać trasy dostaw, a także szybciej przewozić ludzi i maszyny."
 gaudi.126.t: "Burzowa pogoda"
 gaudi.126.d: "Burza opóźniła nasze prace przy katedrze w Kolonii o kilka tygodni."
 gaudi.126.f: "Ubiegłej nocy nad Kolonią przeszła burza. Wiatr zerwał plandeki i przewrócił rusztowania, uszkadzając część gargulców i figur."
 gaudi.126.g: "Wolałbym już kometę."
 gaudi.127.t: "Badania archeologiczne w Kolonii"
 gaudi.127.d: "Po wizycie w Kolonii [SCOPE.sCharacter('gaudi_archaeologist').GetFullName] odkrył, że katedra najwyraźniej stoi na rzymskich ruinach. Prosi o pozwolenie na prowadzenie badań."
 gaudi.127.f: "Kolonia jest jednym z najstarszych miast Niemiec i była ważną kolonią w Cesarstwie Rzymskim. Rzymskie dziedzictwo pozostawało żywe w świadomości jej mieszkańców, zarówno w samorządowej organizacji wspólnoty miejskiej, jak i w chrześcijańskim kulcie św. Piotra oraz wizerunku miasta jako córy Rzymu. Dowiedziono, że centrum miasta stoi na rzymskich ruinach, a nawet zachowały się niektóre ulice z tamtych czasów. Ze względu na gęstą zabudowę nikt jednak nie odważył się prowadzić tam wykopalisk. Wykopaliska w pobliżu katedry znacznie utrudniłyby prace budowlane, ale mogłyby pomóc naszemu archeologowi zdobyć cenne doświadczenie."
 gaudi.127.g: "Nie możemy sobie pozwolić na tak długą przerwę w budowie."
 gaudi.127.h: "Wyjątkowa okazja do badań archeologicznych."
 gaudi.200.t: "Początek kariery Alfreda Eschera"
 gaudi.200.d: "W 1849 roku przemysłowiec Alfred Escher po raz pierwszy został wybrany na przewodniczącego Rady Narodowej. Jako polityk, bankier, szef ważnego przedsiębiorstwa kolejowego i realizator budowy tunelu Świętego Gotarda miał stać się jedną z najbardziej wpływowych postaci w historii Szwajcarii."
 gaudi.200.f: "Johann Heinrich Alfred Escher vom Glas, znany jako Alfred Escher, był szwajcarskim politykiem, działaczem gospodarczym i przedsiębiorcą kolejowym. Dzięki licznym piastowanym urzędom politycznym oraz działalności założycielskiej i kierowniczej w Szwajcarskiej Kolei Północno-Wschodniej, Szwajcarskiej Politechnice Federalnej, Szwajcarskim Instytucie Kredytowym, Szwajcarskim Zakładzie Ubezpieczeń na Życie i Rent oraz Towarzystwie Kolei Gotarda Escher wywarł na rozwój polityczny i gospodarczy Szwajcarii większy wpływ niż ktokolwiek inny w XIX wieku."
 gaudi.200.g: "Dobrze przysłuży się Szwajcarii."
 gaudi.200.h: "Ten człowiek jest zbyt niebezpieczny"
 gaudi.201.t: "Pozbawienie Alfreda Eschera Władzy"
 gaudi.201.d: "Budowa Kolei Gotarda nadwyrężyła siły Alfreda Eschera. Jego rywale wykorzystali tę okazję, by nakłonić go najpierw do ustąpienia ze stanowiska prezesa Szwajcarskiego Instytutu Kredytowego, a następnie do rezygnacji z przewodniczenia Towarzystwu Kolei Gotarda."
 gaudi.201.f: "Dzięki licznym piastowanym urzędom politycznym oraz założeniu Kolei Północno-Wschodniej i Szwajcarskiego Instytutu Kredytowego Escher skupił w swoich rękach ogromną władzę, przez co nazywano go „królem Alfredem I”. Ta dominująca pozycja przyciągnęła krytyków. Ruch demokratyczny domagał się większego udziału obywateli w podejmowaniu decyzji politycznych. Zaufany krąg polityków skupionych wokół Alfreda Eschera — „system Eschera” — stał się głównym wrogiem demokratów. Zwalczano go za pomocą pamfletów i zgromadzeń ludowych, co ostatecznie osłabiło wpływy Eschera. Jego sytuację dodatkowo pogarszał fakt, że w latach 70. XIX wieku Kolej Północno-Wschodnia pogrążała się w coraz głębszym kryzysie finansowym."
 gaudi.201.g: "Czy jego upadek jest bliski?"
 gaudi.202.t: "Śmierć Alfreda Eschera"
 gaudi.202.d: "Zmarł dziś Alfred Escher, być może najbardziej wpływowa postać XIX-wiecznej Szwajcarii."
 gaudi.202.f: "Oprócz wymierzonych w niego ataków Escher musiał zmagać się z problemami zdrowotnymi. Przez całe życie wielokrotnie chorował i był zmuszony poddawać się długotrwałym kuracjom. Jego podatność na choroby źle znosiła się z ogromnym obciążeniem pracą. W krytycznej fazie realizacji projektu Kolei Gotarda Escher niemal zapracował się na śmierć. Jego stan zdrowia stale się pogarszał i poprawiał: dokuczały mu astma, gorączka, problemy ze wzrokiem i czyraki. Nie przeszkadzało mu to jednak w wypełnianiu obowiązków politycznych i gospodarczych, gdy tylko było to możliwe. Pod koniec listopada 1882 roku ponownie ciężko zachorował. Rankiem 6 grudnia 1882 roku Alfred Escher zmarł w swojej posiadłości „Belvoir”."
 gaudi.202.g: "Wprowadził Szwajcarię w nowoczesną epokę."
 gaudi.211.t: "Planowanie Kolei Gotarda"
 gaudi.211.d: "Rozpoczęliśmy planowanie projektu Kolei Gotarda. Oprócz pomiarów terenu i wytyczenia trasy obejmuje ono również poszukiwanie zagranicznych darczyńców oraz utworzenie spółki, która zapewni finansowanie."
 gaudi.211.f: "W 1852 roku szef federalnego urzędu kolejnictwa Gottlieb Koller przedstawił pierwszy projekt budowy linii kolejowej przez masyw Świętego Gotarda, a 19 sierpnia 1853 roku powołano pierwszy komitet gotardzki, skupiający przedstawicieli dziewięciu kantonów. Inżynier Koller opracował pierwszy projekt trasy z Flüelen do jeziora Maggiore. W 1861 roku zuryski inżynier Kaspar Wetli w zaledwie pięć miesięcy przeprowadził pomiary trasy z Erstfeld do Lugano, co do dziś uchodzi za mistrzowskie osiągnięcie geodezyjne."
 gaudi.211.g: "Ogromne przedsięwzięcie."
 gaudi.212.t: "Planowanie zakończone"
 gaudi.212.d: "Zakończono planowanie i przygotowania do budowy Kolei Gotarda. Po spełnieniu odpowiednich warunków możemy dać sygnał do rozpoczęcia budowy."
 gaudi.212.f: "Po zaciekłych sporach między zwolennikami trasy przez Świętego Gotarda a orędownikami wariantów przez przełęcze Lukmanier i Splügen inżynierowie Wetli i Koller po raz pierwszy przedstawili w 1863 roku pomysł budowy tunelu pod masywem Świętego Gotarda. Sprawę przesądziło ostateczne poparcie tej trasy przez Alfreda Eschera, prezesa Szwajcarskiej Kolei Północno-Wschodniej z siedzibą w Zurychu. Trasa przez Świętego Gotarda była ponadto najkrótsza. „Od dawna jestem przekonany, że ze względu na układ sieci kolejowej w Szwajcarii i krajach sąsiednich linia przez Świętego Gotarda znacznie lepiej służyłaby interesom Zurychu i Kolei Północno-Wschodniej niż linia przez którąś z alpejskich przełęczy Gryzonii” — mówi Escher."
 gaudi.212.g: "Najtrudniejsze dopiero przed nami..."
 gaudi.213.t: "Budowa Kolei Gotarda"
 gaudi.213.d: "Rozpoczęły się prace budowlane w masywie Świętego Gotarda — po stronie północnej w pobliżu Göschenen i po stronie południowej w pobliżu Airolo. Towarzystwo Kolei Gotarda zatrudniło tysiące robotników, głównie z Włoch."
 gaudi.213.f: "W niezwykle krótkim terminie sześciu tygodni wpłynęło siedem ofert na budowę tunelu Świętego Gotarda. Kontrakt przyznano genewskiej firmie Louisa Favre’a „Entreprise du Grand Tunnel du Gothard”. Jej największym konkurentem była włoska firma „Società Italiana di Lavori Pubblici”, kierowana przez Severina Grattoniego. Grattoni zbudował już najdłuższy tunel na świecie — tunel kolejowy Mont Cenis o długości 12 kilometrów. Zajmował się również projektem tunelu Świętego Gotarda, zbadał warunki geologiczne i przeprowadził odwierty próbne. Favre, który nigdy wcześniej nie zbudował tunelu dłuższego niż 1 000 metrów, zaoferował niższą cenę niż konkurenci, przyjął rujnujące warunki kontraktu i wpłacił kaucję w wysokości 8 milionów franków szwajcarskich. Obiecał ukończyć budowę w osiem lat — było to ryzykowne przedsięwzięcie wobec nierozpoznanych warunków geologicznych."
 gaudi.213.g: "Favre powinien uważać się za szczęściarza, że może uczestniczyć w tym historycznym przedsięwzięciu."
 gaudi.214.t: "Kolej Gotarda Ukończona!"
 gaudi.214.d: "Dziś wielki dzień dla naszego kraju: ukończenie Kolei Gotarda nie tylko połączyło Europę Północną z Południową, lecz także uczyniło Szwajcarię węzłem międzynarodowego ruchu kolejowego."
 gaudi.214.f: "„W gruncie rzeczy nienawidzę gór, ponieważ są zimne, pożerają kawałki nieba, a więc i świetlistej kuli, oraz ograniczają horyzont. Moją ulubioną fantazją jest teraz wysadzenie dynamitem masywu Świętego Gotarda wraz z całymi Alpami po drugiej stronie, na północy, aby włoskie powietrze mogło docierać do nas bezpośrednio”. — Carl Spitteler"
 gaudi.214.g: "Heil Dir, Gotthardbahn!"
 gaudi.219.t: "Szwajcaria Wschodnia Utracona!"
 gaudi.219.d: "Wraz z utratą Szwajcarii Wschodniej straciliśmy wszelką możliwość kontynuowania budowy Kolei Gotarda."
 gaudi.219.f: "Jeśli z jakiegokolwiek powodu utracimy Szwajcarię Wschodnią, dotychczasowe postępy budowy nie przepadną całkowicie. Inne państwo może kontynuować budowę tunelu od ostatniego etapu."
 gaudi.219.g: "Nie możemy pozostawić Szwajcarii Wschodniej w ich rękach na długo!"
 gaudi.221.t: "Kredyt od Włoch"
 gaudi.221.d: "Alfred Escher spotkał się w Mediolanie z grupą włoskich przedsiębiorców, którzy chcą zainwestować w budowę Kolei Gotarda i mają dobre kontakty z rządem."
 gaudi.221.f: "Przed rozpoczęciem budowy koszty sieci kolejowej przyszłego Towarzystwa Kolei Gotarda oszacowano na 187 milionów franków szwajcarskich. Największą część środków (54.55%) należało pozyskać z międzynarodowego rynku kapitałowego. Włochy pokrywały 24.05% kosztów, a Niemcy i Szwajcaria po 10.7%. Aby pozyskać z rynku kapitałowego 102 miliony franków szwajcarskich, utworzono konsorcjum finansowe pod przewodnictwem niemieckich banków. Składało się ono z grup niemieckiej, włoskiej i szwajcarskiej, z których każda miała zebrać 34 miliony franków szwajcarskich."
 gaudi.221.g: "Każda pomoc jest mile widziana."
 gaudi.221.h: "Nie potrzebujemy pomocy od obcokrajowców."
 gaudi.222.t: "Kredyt od Niemiec"
 gaudi.222.d: "Alfred Escher spotkał się z grupą niemieckich przedsiębiorców, którzy chcą zainwestować w budowę Kolei Gotarda i mają dobre kontakty z rządem."
 gaudi.222.f: "Przed rozpoczęciem budowy koszty sieci kolejowej przyszłego Towarzystwa Kolei Gotarda oszacowano na 187 milionów franków szwajcarskich. Największą część środków (54.55%) należało pozyskać z międzynarodowego rynku kapitałowego. Włochy pokrywały 24.05% kosztów, a Niemcy i Szwajcaria po 10.7%. Aby pozyskać z rynku kapitałowego 102 miliony franków szwajcarskich, utworzono konsorcjum finansowe pod przewodnictwem niemieckich banków. Składało się ono z grup niemieckiej, włoskiej i szwajcarskiej, z których każda miała zebrać 34 miliony franków szwajcarskich."
 gaudi.223.t: "Gotthardbahn-Gesellschaft"
 gaudi.223.d: "Utworzenie Towarzystwa Kolei Gotarda (Gotthardbahn-Gesellschaft) było ważnym krokiem w kierunku realizacji tego ambitnego przedsięwzięcia."
 gaudi.223.f: "Towarzystwo Kolei Gotarda powstało w Lucernie jako spółka akcyjna mająca zbudować i eksploatować Kolej Gotarda. Decydujący wpływ na decyzje polityczne i negocjacje dotyczące finansowania kolei przed utworzeniem spółki, a także na zarządzanie nią w początkowym okresie budowy, miał były przewodniczący rady rządowej kantonu Zurych, a później trzykrotny przewodniczący Rady Narodowej, Dr. Alfred Escher. Gdy finansowanie projektu Kolei Gotarda zapewniono niemal wyłącznie dzięki dotacjom państwowym ze Szwajcarii i jej kantonów, a od 1869 roku także z Włoch, Związku Północnoniemieckiego oraz jego następcy prawnego od 1871 roku — Rzeszy Niemieckiej, ze Stowarzyszenia Gotarda wyłoniono Towarzystwo Kolei Gotarda. Stowarzyszenie przekazało nowej spółce swoje prawa. Alfred Escher został jej prezesem, a Joseph Zingg wiceprezesem. Następnie spółka przystąpiła do właściwej budowy Kolei Gotarda."
 gaudi.231.t: "Napływ wody do tunelu"
 gaudi.231.d: "Napływ wody do tunelu Świętego Gotarda zagraża postępom budowy i życiu robotników."
 gaudi.231.f: "Zróżnicowane warstwy skalne w masywie Świętego Gotarda wielokrotnie sprawiały problemy. Piaszczyste podłoże przeplatało się miejscami ze skałą nie do przebicia, a w rzadkich, lecz tym groźniejszych przypadkach do tunelu wdzierała się woda lub masa błotno-skalna, powodując śmierć niektórych robotników."
 gaudi.231.g: "Zróbcie wszystko, co konieczne, by uszczelnić miejsce przecieku. Bezpieczeństwo przede wszystkim."
 gaudi.231.h: "Zapłaćcie robotnikom za nadgodziny, by uszczelnili szczelinę, ale zachowajcie ostrożność."
 gaudi.231.i: "Zatkajcie otwór za wszelką cenę i pracujcie dalej — bez względu na straty!"
 gaudi.232.t: "Próba obciążeniowa wiaduktu"
 gaudi.232.d: "Kierownictwo budowy ma wątpliwości, czy aż tyle prób obciążeniowych na licznych wiaduktach jest rzeczywiście koniecznych, ponieważ pochłaniają one materiały i czas."
 gaudi.232.f: "Ze względu na presję czasu związaną z ukończeniem Kolei Gotarda nie wszystkim elementom przedsięwzięcia można poświęcić tyle samo uwagi. Niektórzy inżynierowie uważają na przykład, że wielokrotne próby obciążeniowe jednego z naszych wiaduktów są zbędne — konstrukcja jest wystarczająco wytrzymała. Część naszych doradców nalega jednak, by nie kończyć prób przedwcześnie, gdyż ewentualne uszkodzenia mogłyby opóźnić prace o wiele miesięcy i zaszkodzić naszej reputacji."
 gaudi.232.g: "Powinniśmy przeprowadzić dodatkową próbę."
 gaudi.232.h: "Nie mam obaw co do stabilności tego wiaduktu."
 gaudi.233.t: "Wiadukt się zawalił!"
 gaudi.233.d: "Jeden z naszych wiaduktów zawalił się dzisiaj. Najwyraźniej nie był tak bezpieczny, jak sądziliśmy."
 gaudi.233.f: "Jak śmiecie tak szargać renomę szwajcarskiej precyzji i rzetelności?"
 gaudi.233.g: "Od razu mówiłem, że należało przeprowadzić próbę obciążeniową!"
 gaudi.234.t: "Więcej przerw w pracy"
 gaudi.234.d: "Robotnicy pracujący przy budowie tunelu Świętego Gotarda uważają, że ich zmiany są zbyt długie, a przerwy zbyt krótkie."
 gaudi.234.f: "Oprócz niebezpieczeństw związanych z pracą w tunelu Świętego Gotarda problemem była bardzo słaba cyrkulacja powietrza. Ciepło z wnętrza Ziemi sprawiało ponadto, że temperatura w tunelu przekraczała 33 stopnie, a w rzadkich przypadkach dochodziła do 40 stopni. Mimo to robotnicy musieli wykonywać ciężką pracę w pocie czoła przez ponad 8 godzin dziennie."
 gaudi.234.g: "Przerwa? Phi! Ci leniwi Włosi nawet nie wiedzą, co to praca!"
 gaudi.234.h: "Krótka przerwa i nic więcej."
 gaudi.234.i: "Dajcie im premię zamiast przerwy."
 gaudi.234.j: "Zasługują na regularne przerwy."
 gaudi.235.t: "Zawroty głowy pod ziemią"
 gaudi.235.d: "Jakość powietrza w tunelu Świętego Gotarda pogorszyła się tak bardzo, że niektórzy robotnicy zasłabli z powodu zawrotów głowy."
 gaudi.235.f: "Jakość powietrza w tunelu Świętego Gotarda spada do alarmująco niskiego poziomu. Przyczynia się do tego pył wzbijany przez kilofy i maszyny, a dynamit dopełnia reszty. Zdecydowanie zbyt często robotników odsyła się do tunelu, zanim rozwieje się dym po wybuchach. Jeden z naszych nadzorców chciał zapędzić tę leniwą zgraję z powrotem do pracy, lecz w drodze w głąb tunelu zmarł wskutek nieszczęśliwych zaburzeń krążenia."
 gaudi.235.g: "Cóż za nieszczęście. A teraz do pracy!"
 gaudi.235.h: "Dajcie robotnikom większą zachętę do narażania życia..."
 gaudi.235.i: "Wprowadźcie krótsze zmiany."
 gaudi.236.t: "Zdziercze ceny"
 gaudi.236.d: "Nasza polityka cenowa dotycząca żywności, odzieży i innych artykułów pierwszej potrzeby spotkała się z ostrą krytyką robotników pracujących przy budowie tunelu Świętego Gotarda."
 gaudi.236.f: "W Göschenen pracowało maksymalnie 1645 robotników, a w Airolo 1302, głównie Włochów z ubogich obszarów wiejskich Piemontu i Lombardii. Górnicy i robotnicy mieszkali w brudnych, przepełnionych barakach i byli wyzyskiwani finansowo. Górnik zarabiał około 3,90 franka za ośmiogodzinną zmianę. Dwie trzecie tej płacy potrącano za wyżywienie i zakwaterowanie, a za lampy i oliwę do nich — 30 centymów dziennie — musieli płacić sami. Potrącano im również pięć franków miesięcznie za odzież i dwa franki za pozwolenie na pobyt w Szwajcarii. Część wynagrodzenia wypłacano w bonach, które można było zrealizować wyłącznie w sklepach należących do przedsiębiorstwa."
 gaudi.236.g: "Nikt nie jest zmuszany do pracy przy tym przedsięwzięciu. Każdy może odejść!"
 gaudi.236.h: "Wyzyskujemy ich i płacimy im ich własnymi pieniędzmi, by pracowali po godzinach — znakomity pomysł!"
 gaudi.236.i: "Zakażcie tych nieetycznych praktyk!"
 gaudi.237.t: "Brudne baraki"
 gaudi.237.d: "Nędza w barakach robotników pracujących przy budowie tunelu Świętego Gotarda osiągnęła takie rozmiary, że kierownictwo budowy kolei poważnie obawia się rychłego buntu."
 gaudi.237.f: "„Zastałem sytuację w Göschenen niewiele zmienioną; kwatery Favre’a są zadowalające, lecz jest ich stanowczo za mało, prywatne kwatery u mieszkańców są po części dobre, po części znośne, a po części złe; baraki robotnicze, zbudowane dla zysku i wynajmowane, nadal są w skandalicznym stanie, zwłaszcza duży dom obok poczty, zamieszkany przez 240 osób; nieczystości spływały tam po zewnętrznych ścianach i zalegały stertami na korytarzach i w kątach; izby i ich wyposażenie są pokryte brudem, okna szczelnie zamknięte, a powietrze odrażające, doprawdy gorsze niż w większości chlewów, które mają wrota i otwory wentylacyjne. Wodociąg wprawdzie sumiennie zbudowano, lecz w taki sposób, że zamarzł i popękał, przez całą zimę nie dostarczał wody i nadal nie działa, choć od tygodni nie było silnego mrozu”."
 gaudi.237.g: "Każdemu według zasług."
 gaudi.237.h: "Skoro tak bardzo nie podoba im się w ich domach — powinni więcej pracować."
 gaudi.237.i: "W cywilizowanym kraju takim jak nasz należy natychmiast położyć kres tym skandalicznym warunkom!"
 gaudi.238.t: "Pogrzebani żywcem"
 gaudi.238.d: "W tunelu Świętego Gotarda doszło do poważnego wypadku. Kilku robotników zostało zasypanych gruzem. Ich szanse na przeżycie są nieznane."
 gaudi.238.f: "Podczas budowy tunelu Świętego Gotarda zginęło 199 robotników. Spośród 171 ofiar śmiertelnych wymienionych w wykazie wypadków przechowywanym w Archiwum Federalnym 53 robotników zostało zmiażdżonych przez wagony lub lokomotywy, 49 zginęło od uderzeń skał, a 46 wskutek wybuchów dynamitu. 23 poniosło śmierć w innych okolicznościach, w tym jeden utonął. Według oficjalnych oświadczeń winę ponosił albo przypadek, albo sam poszkodowany. Wielu innych mężczyzn zmarło w kolejnych latach wskutek niedożywienia, chorób i obrażeń odniesionych podczas budowy tunelu."
 gaudi.238.g: "Niestety, takie ryzyko wiąże się z tą pracą. Kopcie dalej!"
 gaudi.238.h: "Nic już nie możemy dla nich zrobić. Wprowadźcie lepsze przepisy na przyszłość."
 gaudi.238.i: "Zróbcie wszystko, co w waszej mocy, by uratować tych biedaków!"
 gaudi.239.t: "Nowe maszyny w tunelu"
 gaudi.239.d: "Wprowadzenie nowych technologii znacznie przyspieszyło nasze postępy w budowie tunelu Świętego Gotarda."
 gaudi.239.f: "Przedsiębiorca budowlany Louis Favre sprowadził pierwsze wiertarki typu Sommeillera z tunelu Mont Cenis. Testował również na miejscu najważniejsze dostępne modele wiertarek udarowych. Kierownicy warsztatów w Airolo i Göschenen udoskonalali istniejące maszyny: miały one rzadziej wymagać napraw, a wiertarki udarowe zamierzano wyposażyć w automatyczny posuw. Seguin i Ferroux, obaj kierownicy warsztatów, osiągnęli znaczne postępy: początkowo trzeba było wymieniać trzy maszyny dziennie, natomiast pod koniec budowy już tylko jedną co trzy dni. Jednocześnie powietrze wylotowe z pneumatycznych wiertarek udarowych zapewniało niewielką wentylację tunelu. Na wózkach zamontowano sześć wiertarek. Wierciły one otwory o głębokości około metra, które następnie wypełniano dynamitem i wysadzano."
 gaudi.239.g: "Niech żyje postęp!"
 gaudi.240.t: "Związki zawodowe krytykują projekt Kolei Gotarda"
 gaudi.240.d: "Jeden z przywódców związkowych potępił dziś w parlamencie przerażające warunki, w jakich powstaje tunel Świętego Gotarda."
 gaudi.240.f: "Codzienne zalania, praca w żarze niczym w wielkim piecu, nędzne kwatery, zdziercze ceny i marna płaca poniżej 4 franków dziennie! W naszym kraju niejeden pies żyje lepiej niż setki robotników, którzy narażają życie dla zysku spółki kolejowej, nim pewnego pechowego dnia ładunek dynamitu rozerwie ich na strzępy. Sądziłem, że minęły już czasy, gdy właściciel ziemski mógł pomiatać swoimi chłopami jak bydłem! To, co dzieje się w Göschenen i Airolo, wydaje się znacznie gorsze! Jeśli coś się natychmiast nie zmieni, obiecuję wam, że dojdzie do eskalacji!”"
 gaudi.240.g: "Czy ten człowiek nie rozumie znaczenia naszego przedsięwzięcia?"
 gaudi.240.h: "Pewne reformy mogą rzeczywiście być konieczne."
 gaudi.241.t: "Escher przekazuje darowiznę"
 gaudi.241.d: "Alfred Escher, któremu budowa Kolei Gotarda szczególnie leży na sercu, przeznaczył dziś własne środki na przyspieszenie budowy linii."
 gaudi.241.f: "Escher nie tylko towarzyszył projektowi Kolei Gotarda od jego powstania aż do ukończenia, lecz także osobiście się dla niego poświęcał. Nie chodziło wyłącznie o wkład finansowy. Zarzucano mu, że dosłownie zapracowuje się na śmierć dla Kolei Gotarda."
 gaudi.241.g: "Dziękujemy, panie Escher."
 gaudi.242.t: "Porowata skała"
 gaudi.242.d: "Zaskakująco miękka skała sprawiła, że prace przy tunelu Świętego Gotarda postępują lepiej, niż oczekiwano."
 gaudi.242.f: "Oprócz licznych nieprzewidzianych trudności podczas budowy tunelu Świętego Gotarda, które często miały dość nieprzyjemne skutki, nie brakowało też miłych niespodzianek."
 gaudi.242.g: "Świetnie!"
 gaudi.243.t: "Skała nie do przebicia"
 gaudi.243.d: "Zaskakująco twarda skała sprawiła, że prace przy tunelu Świętego Gotarda postępują wolniej, niż oczekiwano."
 gaudi.243.f: "Kierownictwo budowy wielokrotnie borykało się z problemami wynikającymi ze zmienności skał. Gdy rozpoczynano prace, inżynierowie byli słabo przygotowani na geologiczną mozaikę masywu Świętego Gotarda. Dopiero z czasem nauczyli się unikać tych przykrych niespodzianek. Główny inżynier Robert Gerwig zlecił niemieckiemu inżynierowi górniczemu Friedrichowi Moritzowi Stapffowi przeprowadzenie wszystkich niezbędnych badań geologicznych. Początkowo przydzielono go do odcinka budowy w Airolo, a później został kierownikiem działu geologiczno-górniczego w tamtejszej centralnej dyrekcji budowy. Do zadań Stapffa należały aktualizowanie istniejących map geologicznych oraz obserwacja warunków geologicznych, w tym temperatury, napływu wody i stanu skał, aby zapobiegać opóźnieniom budowy. Stapff dokumentował wszystkie formacje skalne wzdłuż osi tunelu i z każdej pobierał okaz."
 gaudi.243.g: "Dobre rzeczy wymagają czasu."
 gaudi.243.h: "Robotnicy powinni pracować po godzinach!"
 gaudi.243.i: "Sprowadźcie ekspertów z uniwersytetu, by znaleźli długofalowe rozwiązanie."
 gaudi.244.t: "Wspaniałe eksplozje"
 gaudi.244.d: "Jedna z naszych krajowych fabryk dynamitu została stałym dostawcą na potrzeby budowy tunelu Świętego Gotarda. Korzystają na tym w równym stopniu zarówno samo przedsięwzięcie, jak i firma."
 gaudi.244.f: "W trakcie budowy zapotrzebowanie na materiały wybuchowe wzrosło tak bardzo, że nad Jeziorem Czterech Kantonów powstała fabryka produkująca je specjalnie na potrzeby tunelu."
 gaudi.244.g: "Ale to sprawdzono pod kątem bezpieczeństwa, prawda?"
 gaudi.245.t: "Napływ robotników"
 gaudi.245.d: "Coraz więcej ludzi przybywa do Szwajcarii Wschodniej w poszukiwaniu pracy przy budowie Kolei Gotarda."
 gaudi.245.f: "Budowa Kolei Gotarda zapewniła pracę ponad 5 000 osób przez niemal dekadę."
 gaudi.245.g: "Dajcie każdemu łopatę, potrzebujemy każdych rąk do pracy."
 gaudi.245.h: "Powinni osiedlić się na dłużej."
 gaudi.246.t: "Nowy zagraniczny inwestor"
 gaudi.246.d: "Alfred Escher zdołał pozyskać kolejnego zamożnego inwestora zagranicznego, który może zapewnić nowy kapitał na realizację projektu Kolei Gotarda."
 gaudi.246.f: "Przez lata Escher wielokrotnie wykorzystywał swoje kontakty w chwilach trudności finansowych, by pozyskiwać środki na niezwykle kosztowną budowę tunelu Świętego Gotarda — a były one bardzo potrzebne."
 gaudi.246.g: "Pragniemy tego jak wędrowiec na pustyni!"
 gaudi.246.h: "Nie, dziękujemy."
 gaudi.247.t: "STRAJK!"
 gaudi.247.d: "Złe, bardzo złe wieści! Robotnicy pracujący przy budowie Kolei Gotarda porzucili pracę i żądają lepszych płac, mieszkań, wyżywienia i odzieży, zanim ponownie chwycą za łopaty!"
 gaudi.247.f: "Podczas budowy tunelu Świętego Gotarda liczba mieszkańców Göschenen wzrosła kilkukrotnie. Robotnicy budowlani żyli w bardzo trudnych warunkach. Włoscy robotnicy tunelowi rozpoczęli strajk, domagając się wyższych płac i wywołując zamieszki we wsi. Bezpośrednią przyczyną był spór między kierownikiem zmiany a górnikami, którzy odmówili dalszego wiercenia, dopóki nie rozwieje się dym po wybuchach. Doszło do ostrej wymiany zdań, po której górnicy ze złością opuścili miejsce pracy. W drodze do wyjścia rozeszła się pogłoska, że płonie skrzynia dynamitu. Sprawiło to, że pozostali robotnicy również wybiegli z tunelu. Następnie udali się do wsi i zatrzymali przed pocztą, gdzie mieszkali wójt i poczmistrz, dając upust swojemu gniewowi. Tam Luigi Dissune przedstawił przy aplauzie zebranych żądania robotników: podwyżkę płac o jednego franka dziennie, sprawną wentylację i lepsze przepisy bezpieczeństwa. Zapowiedź, że żaden górnik nie wejdzie do tunelu, dopóki wszystkie żądania nie zostaną spełnione, poparto wystawieniem straży przed wlotem tunelu, która nie wpuściła nikogo do środka podczas zmiany o godzinie 22."
 gaudi.247.g: "Wezwijcie straż obywatelską."
 gaudi.247.h: "Przystajemy na ich żądania."
 gaudi.248.t: "Smutny dzień dla Szwajcarii"
 gaudi.248.d: "Gdy doszło do buntu robotników, nasze siły porządkowe interweniowały dość brutalnie. Kilku robotników zginęło. W rezultacie ucierpiała nasza międzynarodowa reputacja."
 gaudi.248.f: "Nie wiadomo, dlaczego padł pierwszy strzał ani kto go oddał. Nie wydano rozkazu otwarcia ognia. Dokładny przebieg strzelaniny również pozostaje niejasny. Po niej demonstranci się rozproszyli. Czterech z nich zginęło, a kilku zostało rannych. W zależności od źródła dwóch lub trzech zginęło na miejscu, kolejny zmarł wskutek odniesionych obrażeń dzień później, a według raportu z dochodzenia czwarty — kilka dni później. Za sprawą oskarżycielskich doniesień prasowych wydarzenie odbiło się echem w całej Europie, także poza Szwajcarią. W szczególności kwestionowano okoliczności powołania oddziałów policyjnych biorących udział w interwencji."
 gaudi.248.g: "To oni zaczęli!"
 gaudi.249.t: "Durchstich"
 gaudi.249.d: "Po latach niezwykle ciężkiej pracy robotnicy drążący tunel z obu stron spotkali się w środku masywu Świętego Gotarda z zaledwie minimalnym odchyleniem."
 gaudi.249.f: "Po siedmiu latach i pięciu miesiącach ekipy budowlane drążące tunel przez masyw górski od północy i południa spotkały się ze sobą. Odchylenia wynosiły zaledwie 33 centymetry w poziomie i 5 centymetrów w pionie — było to mistrzowskie osiągnięcie ówczesnej inżynierii i geodezji. Europejska prasa świętowała to wydarzenie: powstał najdłuższy wówczas tunel na świecie, liczący 15 kilometrów. „Można dziś powiedzieć, że cała prasa kontynentu składa hołd dziełu Świętego Gotarda i wyraża szczere uznanie” — pisał wówczas zuryski „Landbote”."
 gaudi.249.g: "Szampan!"
 gaudi.301.t: "Rozpoczyna się budowa Cristo Redentor"
 gaudi.301.d: "Wraz ze wzniesieniem pierwszych rusztowań i żelaznych konstrukcji na Corcovado robotnicy rozpoczęli prace nad posągiem Chrystusa."
 gaudi.301.f: "Cristo Redentor to największy na świecie posąg w stylu art déco. Jego twarz wykonał rzeźbiarz Gheorghe Leonida, urodzony w 1893 roku w Gałaczu w Rumunii. Studiował rzeźbę w bukareszteńskiej szkole sztuk pięknych, a następnie, po kolejnych trzech latach nauki we Włoszech, zdobył nagrodę rzeźbiarską za dzieło „Reveil”. Zasłynął we Francji jako portrecista, a Paul Landowski zaprosił go do zespołu, który w 1922 roku rozpoczął prace nad Cristo Redentor. Gheorghe Leonida wyrzeźbił twarz Jezusa Chrystusa, co przyniosło mu sławę. Grupa inżynierów i techników przeanalizowała projekty Landowskiego i zdecydowała, że konstrukcja zostanie wykonana z żelbetu według projektu Alberta Caquota, zamiast ze stali, która lepiej nadawałaby się do posągu w kształcie krzyża. Zewnętrzną okładzinę wykonano ze steatytu, wybranego ze względu na trwałość i łatwość obróbki. Budowa trwała dziewięć lat i kosztowała równowartość 250 000 dolarów amerykańskich (czyli 3,3 miliona dolarów według wartości z 2014 roku)."
 gaudi.301.g: "Ważny krok dla naszego narodu."
 gaudi.302.t: "Chrystus na górze Corcovado"
 gaudi.302.d: "Po latach prac budowlanych ukończono dziś posąg Chrystusa — wybitne dzieło architektury art déco i jeden z nowych symboli Brazylii!"
 gaudi.302.f: "Podczas ceremonii odsłonięcia posąg miały oświetlić reflektory uruchomione zdalnie przez pioniera radiowej łączności krótkofalowej Guglielma Marconiego, przebywającego w Rzymie we Włoszech, w odległości 9 200 kilometrów. Z powodu niesprzyjającej pogody światła włączono jednak na miejscu. W ramach uroczystości odprawiono również mszę. W latach 1931–1981 Cristo Redentor był najwyższym posągiem Chrystusa na świecie."
 gaudi.302.g: "Niech chroni kraj i miasto."
 gaudi.309.t: "Rio utracone"
 gaudi.309.d: "Wraz z utratą Rio de Janeiro straciliśmy wszelką możliwość kontynuowania budowy Cristo Redentor."
 gaudi.309.f: "Jeśli utracimy Rio de Janeiro, po jego odzyskaniu będziemy musieli rozpocząć budowę od nowa. Tylko państwo o kulturze brazylijskiej może ukończyć Cristo Redentor."
 gaudi.309.g: "Nie możemy pozostawić Rio de Janeiro w ich rękach na długo!"
 gaudi.311.t: "Dobre postępy"
 gaudi.311.d: "Prace nad Cristo Redentor postępują lepiej, niż oczekiwano. Spodziewamy się wyprzedzić harmonogram o kilka miesięcy."
 gaudi.311.f: "Nowoczesna technologia, sprawna organizacja pracy, nieprzerwane dostawy materiałów i dobra pogoda sprzyjają postępom budowy."
 gaudi.311.g: "Takie wieści umilają dzień."
 gaudi.312.t: "Darowizna na rzecz Cristo Redentor"
 gaudi.312.d: "Jako dobry chrześcijanin [SCOPE.sCharacter('gaudi_cristo_donator').GetFullName] wykazuje duże osobiste zainteresowanie Cristo Redentor. Z tego powodu przekazał prywatną darowiznę na budowę posągu."
 gaudi.312.f: "Pomysł wzniesienia posągu Chrystusa pojawił się na dziesięciolecia przed jego realizacją i był szczególnie bliski gorliwym środowiskom katolickim. Gdy wreszcie przystąpiono do budowy, przedsięwzięcie wsparło wielu darczyńców."
 gaudi.312.g: "Mamy wobec niego dług wdzięczności."
 gaudi.313.t: "Duchowieństwo z zadowoleniem przyjmuje nasz projekt budowlany"
 gaudi.313.d: "Brazylijskie duchowieństwo jest gotowe zrobić wszystko, co w jego mocy, by ukończyć Cristo Redentor w Rio de Janeiro. Środowiska krytyczne wobec Kościoła obawiają się, że nasz rząd zbytnio ulegnie jego wpływom."
 gaudi.313.f: "Problemy z finansowaniem opóźniły budowę Cristo Redentor o niemal dziesięć lat, zanim dzięki wsparciu archidiecezji Rio de Janeiro, Stolicy Apostolskiej i Francji mogło wreszcie dojść do uroczystego odsłonięcia."
 gaudi.313.g: "Powinniśmy na tym skorzystać."
 gaudi.313.h: "Publicznie pochwalcie Kościół."
 gaudi.313.i: "Ta sprawa nie dotyczy Kościoła!"
 gaudi.314.t: "Związki zawodowe krytykują Cristo Redentor"
 gaudi.314.d: "[SCOPE.sCharacter('trade_unions_leader').GetFullName] jako przedstawiciel związków zawodowych skierował dziś do rządu petycję o ponowne rozważenie kontrowersyjnego wsparcia dla budowy Cristo Redentor."
 gaudi.314.f: "Przywódcy związkowi w Brazylii uważają trwającą budowę Cristo Redentor za skandaliczne marnotrawstwo pieniędzy. Skoro nie mogą powstrzymać budowy i skierować tych środków na pożyteczne cele dobroczynne, domagają się przynajmniej lepszego traktowania i opieki dla robotników, którzy pracują na niebezpiecznych wysokościach i muszą transportować tony materiałów na szczyt góry."
 gaudi.314.g: "Zignorujcie ich."
 gaudi.314.h: "Poprzestańcie na pustych deklaracjach."
 gaudi.314.i: "Przeznaczcie środki na poprawę sytuacji robotników."
 gaudi.315.t: "Problemy z transportem"
 gaudi.315.d: "Góra Corcovado jest z pewnością idealnym miejscem na wzniesienie budowli widocznej z wielu kilometrów. Pod względem logistycznym ma jednak swoje wady."
 gaudi.315.f: "Corcovado, którego nazwa oznacza po portugalsku „garb”, to góra o wysokości 710 metrów położona na obszarze metropolitalnym Rio de Janeiro, z niemal pionowym urwiskiem po jednej stronie. Choć pod koniec XIX wieku doprowadzono na nią linię kolejową, transport zwłaszcza większych elementów okazał się trudniejszy, niż początkowo sądzono, przede wszystkim ze względu na krętą i wąską drogę prowadzącą na szczyt."
 gaudi.315.g: "Słyszę tylko same skargi!"
 gaudi.316.t: "Wypadek"
 gaudi.316.d: "Dziś na placu budowy Cristo Redentor doszło do wypadku, który opóźnił prace o kilka tygodni."
 gaudi.316.f: "Mimo znacznej wysokości budowa posągu Chrystusa była mniej niebezpieczna niż wznoszenie niejednego wieżowca. Nie można było jednak wykluczyć wypadków. Nawet kierownik budowy Heitor Levy omal nie spadł z rusztowania w przepaść. Robotnicy uratowali go w ostatniej chwili, a Levy przypisał ten cud interwencji samego Jezusa Chrystusa. Pod wpływem tego doświadczenia na granicy śmierci Levy, z pochodzenia Żyd, przeszedł później na katolicyzm."
 gaudi.316.g: "Czy to omen?"
 gaudi.317.t: "Burza"
 gaudi.317.d: "Podczas burzy piorun uderzył w Cristo Redentor, niszcząc część posągu."
 gaudi.317.f: "Burze stanowiły nieustanny problem podczas budowy, a także po ukończeniu posągu. Uderzenia piorunów wielokrotnie niszczyły fragmenty steatytowej okładziny, a także większe elementy, takie jak palce."
 gaudi.317.g: "Niefortunny incydent."
 gaudi.317.h: "Naprawcie uszkodzenia."
 gaudi.317.i: "Potrzebujemy więcej piorunochronów."
 gaudi.317.j: "Naprawcie uszkodzenia i zamontujcie nowe piorunochrony."
 gaudi.318.t: "Pochwała"
 gaudi.318.d: "Parlamentarzysta z państwa [SCOPE.sCountry('gaudi_cristo_neighbour').GetName] odwiedził dziś Rio de Janeiro i wyraził zachwyt nad Cristo Redentor, który z każdym dniem nabiera kształtów."
 gaudi.318.f: "Posąg Chrystusa stał się już narodowym symbolem Brazylii i przyćmiewa całą Amerykę Łacińską."
 gaudi.318.g: "Dziękujemy."
 gaudi.318.h: "Nakłońcie go, by zabiegał w swoim kraju o poparcie dla naszego przedsięwzięcia."
 gaudi.319.t: "Ateistyczna interwencja"
 gaudi.319.d: "W dzisiejszym publicznym przemówieniu [SCOPE.sCharacter('gaudi_cristo_atheist').GetFullName] potępił budowę posągu Chrystusa jako powrót do średniowiecza i wezwał osoby o podobnych poglądach do potępienia tego marnotrawstwa pieniędzy."
 gaudi.319.f: "„Jeśli Bóg chciał mieć swój posąg, dlaczego o tym nie powiedział? A jeśli go potrzebuje, dlaczego sam go nie zbuduje? Brazylia jest nowoczesnym krajem, który nie potrzebuje bogów ani królów, a jedynie człowieka. Czy człowiek nie ma prawa do owoców własnej pracy? Nie wierzę w żadnego Boga, w żadnego niewidzialnego człowieka na niebie. Po co czcić flagę lub Boga, skoro możemy czcić to, co w nas najlepsze: naszą wolę osiągnięcia wielkości?"
 gaudi.319.g: "Nie powinniśmy zanadto prowokować tej grupy."
 gaudi.319.h: "DEUS VULT!"
 gaudi.319.i: "Art déco i takie słowa. Mam BARDZO złe przeczucia co do tego człowieka."
 gaudi.320.t: "Inwestycje turystyczne"
 gaudi.320.d: "Branża turystyczna dostrzega korzyści płynące z budowy posągu Chrystusa i chciałaby wesprzeć to przedsięwzięcie."
 gaudi.320.f: "Budowa Cristo Redentor przypadła na okres, gdy Rio de Janeiro stawało się modnym celem podróży dzięki rozwojowi połączeń lotniczych, piaszczystej plaży i tętniącemu życiu kulturalnemu. Nowoczesny posąg na Corcovado był więc również symbolem rozwijającej się branży turystycznej i mile widzianą nową atrakcją."
 gaudi.320.g: "Plaża, słońce, hotele i Chrystus Odkupiciel!"
 gaudi.401.t: "Wznowiono budowę Mole Antonelliana"
 gaudi.401.d: "Po zakończeniu ostatnich negocjacji władz Turynu z gminą żydowską wznowiono dziś prace budowlane."
 gaudi.401.f: "Początkowo gmina żydowska w Turynie zamierzała wznieść okazałą siedzibę w dawnej stolicy Królestwa Sardynii i Piemontu. Nowa synagoga miała świadczyć o obecności, awansie społecznym i integracji żydowskich mieszkańców miasta. Realizację powierzono architektowi Alessandrowi Antonellemu. Antonelli słynął jednak również z monumentalnych budowli, których rozmiary stale zwiększał. W piemonckim Castellamonte zaplanował na przykład katedrę, która mogłaby rywalizować z bazyliką św. Piotra w Rzymie, lecz to ogromne przedsięwzięcie pozostało nieukończone z braku funduszy. Podobny los groził teraz gminie żydowskiej i jej nowej synagodze, która z każdym dniem pięła się ku niebu, lecz zarazem groziła doprowadzeniem gminy do finansowej ruiny. Władze Turynu wykupiły budowlę, przekazując gminie w ramach rekompensaty nową działkę i nową synagogę, którą wzniesiono w ciągu kilku lat. Sama „Mole” miała natomiast stać się narodowym symbolem Włoch."
 gaudi.401.g: "Miejmy nadzieję, że Antonelli znów nie zmieni planów..."
 gaudi.402.t: "Mole Antonelliana: Pierwszy Etap Ukończony"
 gaudi.402.d: "Główna konstrukcja Mole Antonelliana jest ukończona. Antonelli ma jednak nowe ekscentryczne pomysły dotyczące dachu i iglicy.."
 gaudi.402.f: "Pierwotnie Mole Antonelliana miała być zwieńczona zwykłą kopułą. Antonelli stale jednak zwiększał jej rozmiary i wysokość, aż uzyskała charakterystyczną formę, z którą jest dziś kojarzona. Oznaczało to również, że ukończenie górnej części budowli wymagało dodatkowego czasu."
 gaudi.402.g: "Czy ten człowiek nigdy nie jest zadowolony?"
 gaudi.403.t: "Z Antonellim ku niebu"
 gaudi.403.d: "Rozpoczął się ostatni etap budowy Mole Antonelliana."
 gaudi.403.f: "Zgodnie ze swoim pierwotnym projektem Antonelli postanowił nadać Mole niemal spiczaste zwieńczenie z kolumnadami łączącymi neogotyk z neoklasycyzmem, nawiązując tym samym do jednego ze swoich wcześniejszych dzieł — zwieńczenia bazyliki San Gaudenzio, symbolu Novary. Powyżej 90 metrów zerwał więc z formami opartymi na planie kwadratu i zaprojektował granitową kolumnadę na planie koła, zwaną „Latarnią”, osadzoną na podstawie w kształcie ściętego stożka. Nad Latarnią architekt zaprojektował ponadto iglicę o wysokości około 50 metrów i ośmiokątnym przekroju, podzieloną dziesięcioma okrągłymi tarasami. Pierwsze dwa również otaczały kolumnady, a kolejne stawały się coraz mniejsze w miarę wzrostu wysokości. Prowadziły do nich niewielkie schody biegnące zygzakiem."
 gaudi.403.g: "A miałem nadzieję, że zostały już tylko ostatnie poprawki i zdobienia..."
 gaudi.404.t: "Mole Antonelliana ukończona"
 gaudi.404.d: "Uroczystym zwieńczeniem prac budowlanych było dzisiejsze umieszczenie figury geniusza. Turyn i Włochy wzbogaciły się o nowy symbol!"
 gaudi.404.f: "Antonelli z oddaniem pracował nad Mole aż do śmierci. Legendarna stała się prosta winda z mechanizmem bloczkowym, która wynosiła niemal dziewięćdziesięcioletniego architekta na wysokość kilkudziesięciu metrów, aby mógł osobiście sprawdzać postępy prac. Na kilka miesięcy przed śmiercią zaproponował zwieńczenie iglicy posągiem „Skrzydlatego Geniusza”. Wykonanie projektu figury powierzono rzeźbiarzowi Fumagallemu. Geniusz, wykonany z repusowanej i złoconej miedzi, ważył około 300 kg i trzymał w jednej dłoni włócznię, a w drugiej gałązkę palmową. Posąg miał łącznie 5,46 metra wysokości. Po śmierci Antonellego nad ukończeniem iglicy czuwali przede wszystkim jego syn Costanzo i uczeń Crescentino Caselli. Po ostatecznym umieszczeniu „Skrzydlatego Geniusza” budowla osiągnęła całkowitą wysokość 167,35 metra — wówczas nieosiągniętą przez żadną murowaną konstrukcję w Europie ani na świecie. Mole, najwyższa murowana budowla świata, stanęła do bezpośredniej „rywalizacji” z paryską wieżą Eiffla, otwartą zaledwie 10 dni wcześniej, która miała pozostać najwyższą budowlą świata do 1930 roku."
 gaudi.404.g: "Viva Torino, viva l'Italia!"
 gaudi.409.t: "Turyn Utracony!"
 gaudi.409.d: "Wraz z utratą Piemontu straciliśmy wszelką możliwość kontynuowania budowy Mole Antonelliana."
 gaudi.409.f: "Jeśli z jakiegokolwiek powodu utracimy Piemont, dotychczasowe postępy budowy nie przepadną całkowicie. Tylko Włochy mogą kontynuować budowę Mole Antonelliana od ostatniego etapu. Obcy najeźdźcy nie wykażą natomiast zainteresowania dalszą budową."
 gaudi.409.g: "Nie możemy pozostawić Turynu w ich rękach na długo!"
 gaudi.411.t: "Cegły złej jakości"
 gaudi.411.d: "Ostatnia dostawa materiałów do budowy Mole Antonelliana okazała się kiepskiej jakości."
 gaudi.411.f: "Na chwilę ucichł codzienny zgiełk na turyńskim placu budowy, gdzie Mole Antonelliana z każdym dniem pięła się coraz wyżej. Krótka kontrola przeprowadzona przez Antonellego wykazała, że cegły nie spełniają zwykłych standardów jakości. Architekt oznajmił, że woli poczekać, niż narazić swoje arcydzieło na niebezpieczeństwo przez użycie tych cegieł. W kierownictwie budowy słychać jednak głosy, że mimo wszystko należy je wykorzystać — nie tylko ze względu na możliwe opóźnienie prac, lecz także z obawy, że Antonelli mógłby wykorzystać ten czas, by ponownie zmienić projekt ..."
 gaudi.412.t: "Katastrofa!"
 gaudi.412.d: "Materiał gorszej jakości dał o sobie znać: dziś rano zawaliła się część Mole Antonelliana, powodując znaczne zniszczenia."
 gaudi.412.f: "Być może należało posłuchać Antonellego. Być może użycie kruszących się cegieł do wzniesienia tak ważnej budowli jak Mole Antonelliana naprawdę nie było dobrym pomysłem. Być może należało więc dwa razy przemyśleć tę decyzję. Ale jest już za późno — materiał gorszej jakości dał dziś o sobie znać, doprowadzając do zawalenia się ściany. Runęła fasada, niwecząc znaczną część pracy wykonanej w ciągu ostatnich tygodni i miesięcy."
 gaudi.413.t: "Badania archeologiczne w Turynie"
 gaudi.413.d: "Po wizycie w Turynie [SCOPE.sCharacter('gaudi_archaeologist').GetFullName] odkrył, że Mole Antonelliana najwyraźniej stoi na rzymskich ruinach. Prosi o pozwolenie na prowadzenie badań."
 gaudi.413.f: "W I wieku p.n.e. Rzymianie założyli miasto Augusta Taurinorum. Via Garibaldi biegnie dokładnie śladem decumanus rzymskiego miasta, który rozpoczynał się przy Porta Decumani, później włączonej w obręb zamku, czyli Palazzo Madama. Porta Palatina, po północnej stronie dzisiejszego centrum miasta, zachowała się do dziś w parku w pobliżu katedry. Pozostałości teatru z czasów rzymskich zachowały się na terenie Manica Nuova."
 gaudi.414.t: "Nowa maszyna"
 gaudi.414.d: "Nasz krajowy przemysł silnikowy wyposażył niedawno plac budowy Mole Antonelliana w niezwykle nowoczesną maszynę, która przyspiesza postępy prac."
 gaudi.414.f: "Mole Antonelliana słynie przede wszystkim jako jedna z największych ceglanych budowli swoich czasów, pod wieloma względami oparta na tradycyjnych, a nie nowatorskich koncepcjach architektonicznych. Choć przy jej wznoszeniu nie stosowano konstrukcji stalowych ani cementu, nie wykluczało to wykorzystania maszyn. Turyn, obok Mediolanu i Genui, był jednym z głównych ośrodków przemysłowych Włoch, dzięki czemu można było dostarczać maszyny ułatwiające pracę, jeśli tylko mistrz Antonelli je zamówił."
 gaudi.415.t: "Darowizna od mieszkańców"
 gaudi.415.d: "Przedstawiciele patriotycznie nastawionego drobnomieszczaństwa, którym przewodzi [SCOPE.sCharacter('pb_leader').GetPrimaryRoleTitle] [SCOPE.sCharacter('pb_leader').GetFullName], przekazali darowiznę na budowę Mole Antonelliana."
 gaudi.415.f: "Od czasu przejęcia przez władze miejskie Mole Antonelliana stała się czymś więcej niż tylko symbolem Turynu jako prężnie rozwijającego się ośrodka przemysłowego. Jej strzelista bryła była symbolem nie tylko nowoczesności, lecz także włoskiego ducha narodowego. Dla patriotycznie nastawionego mieszczaństwa budowla stanowiła symbol utożsamienia z nowym państwem. Po ukończeniu miała pomieścić Muzeum Risorgimenta. Włochom o silnym poczuciu narodowym bardzo więc zależało na szybkim zakończeniu budowy."
 gaudi.415.g: "Mamy wobec nich dług wdzięczności."
 gaudi.416.t: "Antonelli znów wpadł na pomysł ..."
 gaudi.416.d: "Alessandro Antonelli, budowniczy monumentu nazwanego jego imieniem, zaskoczył niedawno kierownictwo budowy pewną zmianą..."
 gaudi.416.f: "Nazwanie Alessandra Antonellego ekscentrycznym architektem byłoby niedopowiedzeniem. To przecież zupełnie naturalne, by zaplanować budowlę o wysokości 130 metrów, a następnie, kierując się własnym dążeniem do doskonałości, upierać się, że każda wysokość poniżej 160 metrów uwłacza godności architekta. Równie oczywiste jest zaprojektowanie kościoła na piemonckiej prowincji na miarę bazyliki św. Piotra w Rzymie. A już z pewnością nie świadczy o lekkiej megalomanii to, że pokaźna liczba jego budowli nigdy nie zostaje ukończona, ponieważ nie spełniają jego własnych wymagań. Żadna z tych przywar nie pasowałaby przecież do Alessandra Antonellego. Tak czy inaczej, ma on nowy pomysł, który znów przedłuży budowę Mole Antonelliana..."
 gaudi.416.g: "Mamma mia!"
 gaudi.416.h: "Santo Dio!"
 gaudi.416.i: "Porca miseria!"
 gaudi.416.j: "Cavolo!"
 gaudi.417.t: "Antonelliana pnie się ku niebu"
 gaudi.417.d: "Budowa Mole Antonelliana postępuje szybciej, niż oczekiwano, z bliżej nieokreślonych przyczyn."
 gaudi.417.f: "Z nieznanych przyczyn budowa majestatycznej Mole Antonelliana posuwa się naprzód. Może to zasługa dobrej pogody. Być może modlitwy do Madonny. A może również materiałów budowlanych dość marnej jakości, które ostatnio zużyliśmy i których, miejmy nadzieję, nikt nigdy nie odkryje. Jedno jest pewne: ten kolos, którego budowę wielokrotnie opóźniały najróżniejsze okoliczności, powinien zostać ukończony szybciej, niż oczekiwano. O ile Antonelli nie wykorzysta tego, by zniweczyć oszczędność czasu kolejną rozbudową..."
 gaudi.418.t: "Spadająca belka niszczy ceglany mur"
 gaudi.418.d: "Spadająca belka nośna spowodowała dziś znaczne uszkodzenia Mole Antonelliana i opóźniła budowę."
 gaudi.418.f: "Ta belka nośna niewiele uniosła."
 gaudi.418.g: "Irytujące."
 gaudi.419.t: "Monarcha składa wizytę"
 gaudi.419.d: "[SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('gaudi_ruler').GetFullName] postanowił osobiście odwiedzić plac budowy Mole Antonelliana."
 gaudi.419.f: "Nasz monarcha [SCOPE.sCharacter('gaudi_ruler').GetFullName] już wcześniej wykazywał duże zainteresowanie pracami na turyńskim placu budowy, a teraz zamierza osobiście go odwiedzić. Przygotowania idą pełną parą — wszyscy chcą przecież godnie zaprezentować się przed Jego Królewską Mością! Po ogłoszeniu wizyty zarówno zwykli robotnicy, jak i kierownictwo budowy oraz sam Antonelli narzucili więc niespotykane dotąd tempo pracy."
 gaudi.419.g: "Jego Królewska Mość wie, jak motywować."
 gaudi.420.t: "Wypadek na placu budowy"
 gaudi.420.d: "Kilku mężczyzn zostało dziś rannych w wypadku. Kierownictwo budowy Mole Antonelliana przewiduje znaczne opóźnienia, jeśli nie naprawimy uszkodzeń i nie zatrudnimy robotników na zastępstwo."
 gaudi.420.f: "W dzisiejszym wypadku w Turynie rannych zostało kilku mężczyzn, niektórzy z nich ciężko — musieli zostać przewiezieni do szpitala. Wśród poszkodowanych są doświadczeni fachowcy, którzy odgrywali kluczową rolę w budowie. Bez nich prace prawdopodobnie ulegną opóźnieniu do czasu ich powrotu do zdrowia."
 gaudi.420.g: "Wypadki się zdarzają."
 gaudi.420.h: "Powinniśmy zrobić wszystko, co w naszej mocy, by nie zakłóciło to postępów budowy."
 gaudi.421.t: "Groźba strajku"
 gaudi.421.d: "Robotnicy pracujący przy budowie Mole Antonelliana zapowiedzieli strajk, jeśli nie zgodzimy się na negocjacje w sprawie wyższych płac."
 gaudi.421.f: "Ach, ten cudowny świat strajków! Nie wiecie, co tracicie, jeśli nigdy nie utknęliście na dworcu we Włoszech, bo związek zawodowy kolejarzy nagle postanowił sparaliżować ruch. Dziś dotyczy to tylko jednego placu budowy. Naprawdę mamy szczęście!"
 gaudi.421.g: "Nie będziemy negocjować."
 gaudi.421.h: "Opłacenie kilku łamistrajków załatwi sprawę."
 gaudi.421.i: "Wezwijcie karabinierów!"
 gaudi.421.j: "Negocjuj."
 gaudi.422.t: "Burza niszczy Iglicę"
 gaudi.422.d: "Burza przerodziła się w zjawisko przypominające tornado i w nocy zerwała iglicę Mole Antonelliana!"
 gaudi.422.f: "Gwałtowna burza, prawdopodobnie trąba powietrzna, spowodowała odłamanie się 47 metrów iglicy, które runęły do niewielkiego ogrodu. Iglica otarła się o okno pokoju na najwyższym piętrze i częściowo zniszczyła balkon, lecz nikt nie ucierpiał. Podobny los spotkał Mole 23 maja 1953 roku. Budowlę z odłamaną iglicą można zobaczyć pod koniec czołówki filmu „Przyjaciółki” Michelangela Antonioniego z 1955 roku. Tytuł najwyższej murowanej budowli Europy przeszedł wówczas na wieżę katedry w Ulm w Niemczech (161,53 metra), a tytuł najwyższej murowanej budowli świata przypadł ratuszowi w Filadelfii (162,53 metra). Wynikało to również z faktu, że iglicy nie zamierzano już odbudowywać jako konstrukcji murowanej, lecz żelbetowej."
 gaudi.422.g: "Katastrofa!"
 gaudi.423.t: "Nietzsche podziwia Mole"
 gaudi.423.d: "Słynny niemiecki filozof Friedrich Nietzsche spędził znaczną część lat 70. i 80. XIX wieku w Turynie, który darzył wielkim uznaniem. Wychwalał Mole Antonelliana jako jedną z najwspanialszych budowli swoich czasów."
 gaudi.423.f: "„Przechodziłem obok Mole Antonelliana, najbardziej genialnej budowli, jaką być może wzniesiono z bezwarunkowego pędu ku górze — nie przywodzi na myśl niczego poza Zaratustrą. Ochrzciłem ją mianem Ecce Homo i otoczyłem w duchu ogromną, wolną przestrzenią”. — Friedrich Nietzsche"
 gaudi.423.g: "Ten człowiek ma gust. I to nie dopiero od czasu „Morgenröte”."
 gaudi.424.t: "Mongolfiera Italo"
 gaudi.424.d: "Budowa Mole Antonelliana ma zostać sfinansowana dzięki specjalnej inicjatywie, która wzbudzi dodatkowe zainteresowanie."
 gaudi.424.f: "Władze miejskie planowały, że ukończenie Mole Antonelliana zbiegnie się z wielką wystawą. Zwiedzający mieli podziwiać budowlę z bliska. Nie ukończono jej na czas, lecz w zamian można było obejrzeć postępy budowy podczas lotu balonem za opłatą 5 lirów. Sam balon otrzymał nazwę „Italo”."
 gaudi.424.g: "Loty widokowe balonem brzmią jak dobry pomysł."
 gaudi.424.h: "Co za marnotrawstwo pieniędzy!"
 gaudi.425.t: "Piorun uderza w Italo"
 gaudi.425.d: "Balon przy Mole Antonelliana został zniszczony podczas nawałnicy!"
 gaudi.425.f: "Balon „Italo”, który podczas budowy Mole Antonelliana zapewniał przedstawicielom wyższych sfer przyjemną rozrywkę w postaci lotów za niewielką opłatą, został trafiony piorunem 27 kwietnia 1884 roku i runął na ziemię. Nikt nie zginął ani nie został ranny."
 gaudi.425.g: "Zbudujcie nowy balon."
 gaudi.425.h: "Te loty balonem są zbyt niebezpieczne."
 gaudi.501.t: "Rozpoczynają się prace budowlane przy Ringstrasse"
 gaudi.501.d: "[SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('gaudi_ruler').GetFullName] wydał dziś dekret o rozpoczęciu budowy obwodnicy."
 gaudi.501.f: "„Moją wolą jest, aby jak najrychlej przystąpiono do rozbudowy śródmieścia Wiednia w celu połączenia go z przedmieściami, mając przy tym na względzie uporządkowanie i upiększenie mojej rezydencji i stolicy cesarstwa. W tym celu zezwalam na rozbiórkę murów i fortyfikacji śródmieścia, jak również zasypanie otaczających je fos. Tę część terenów i przedpola fortyfikacji, uzyskanych wskutek likwidacji murów, umocnień i fos miejskich, której zgodnie z mającym powstać planem ogólnym nie przeznaczy się na inne cele, należy oddać pod zabudowę. Uzyskane z tego dochody mają posłużyć do utworzenia funduszu budowlanego, z którego pokrywane będą wydatki poniesione przez skarb państwa w związku z tym przedsięwzięciem, w szczególności koszty wznoszenia budynków publicznych, a także przeniesienia nadal niezbędnych obiektów wojskowych”. — Franciszek Józef I."
 gaudi.501.g: "Wiedeń stanie się metropolią najwyższej rangi."
 gaudi.502.t: "Uroczyste otwarcie Ringstrasse"
 gaudi.502.d: "Dziś uroczyście otwarto Ringstrasse. Dotyczy to jednak wyłącznie samej alei — miejscu temu wciąż brakuje rozmachu, który ma postawić Wiedeń na równi z Londynem i Paryżem."
 gaudi.502.f: "„Wasza Cesarska Mość obdarzył całą ludność swego wiernego miasta rezydencjonalnego najpiękniejszym darem bożonarodzeniowym, podejmując wielkoduszną decyzję o zburzeniu murów Wiednia i rozbudowie miasta, aby stało się ono jednym z najpiękniejszych i najzdrowszych miast Europy. Większa część zadania wyznaczonego przez Waszą Cesarską Mość została wykonana: zniknęły krępujące miasto mury obronne, ukończono ulicę z najpiękniejszymi pałacami i domami, założono ogrody i tereny zielone, które zdobią cesarską rezydencję i zapewniają mieszkańcom wypoczynek. Długo wyczekiwany wodociąg, od którego zależą czystość miasta i zdrowie jego mieszkańców, zwieńczy wielkie dzieło rozbudowy, za które również przyszłe pokolenia będą winne Waszej Cesarskiej Mości jako jego inicjatorowi najgłębszą wdzięczność. Niech Wasza Cesarska Mość pozwoli mi w imieniu przedstawicieli miasta Wiednia złożyć najpokorniejsze podziękowania za łaskę uroczystego otwarcia dziś Ringstrasse”. — Andreas Zelinka, burmistrz Wiednia"
 gaudi.502.g: "Wiedniu, jesteś klejnotem!"
 gaudi.503.t: "Punkt zwrotny w dziejach Wiednia"
 gaudi.503.d: "Ringstrasse powoli nabiera kształtów. Szczególnie budowa wielkiego gmachu opery i nowego ratusza podkreśli przełomowe znaczenie tego etapu prac w dziejach Wiednia."
 gaudi.503.f: "„Ukończenie Ringstrasse uważam za szczególnie ważny etap rozbudowy miasta. Sprawie tej zawsze poświęcałem szczególną uwagę i wyrażam panu, panie burmistrzu, oraz radzie miejskiej uznanie i wdzięczność za wyjątkową troskę o upiększenie mojej rezydencji. Również w przyszłości będę śledził dalsze postępy rozbudowy miasta i w miarę możliwości uwzględniał życzenia władz miejskich dotyczące pozyskiwania po bardzo przystępnych cenach gruntów pod budowę szkół i magazynów oraz zakładanie parków. Aby doprowadzić do szybkiego rozwiązania jednej z najważniejszych kwestii, zarządziłem, by zezwolono miastu na bezpłatne doprowadzenie wody ze źródła Kaiserbrunnen. Mam nadzieję, że dzięki temu budowa wodociągu zostanie szybko i pomyślnie ukończona”. — Franciszek Józef I."
 gaudi.504.t: "Blask Wiednia"
 gaudi.504.d: "Uroczyste otwarcie nowej Opery Państwowej i przeniesienie władz miejskich do Nowego Ratusza stanowią ważny krok ku uczynieniu Wiednia prawdziwie godną stolicą Austrii."
 gaudi.504.f: "„Ulice Wiednia wybrukowane są kulturą. Ulice innych miast — asfaltem”. — Karl Kraus"
 gaudi.505.t: "Na Drodze do Wielkości"
 gaudi.505.d: "Wraz z rozpoczęciem planowania budowy uniwersytetu, parlamentu i muzeów sztuki prace przy wiedeńskiej Ringstrasse wkraczają w ostatnią fazę. Teraz należy przekształcić tę piękną dzielnicę w cud architektury."
 gaudi.505.f: "„Wiedeń ma wiele osobliwości i każdy wiedeńczyk czuje się jedną z nich”. — Karl Kraus"
 gaudi.506.t: "Wiedeńska Ringstrasse ukończona"
 gaudi.506.d: "Od dziś Ringstrasse ma już swój charakterystyczny wygląd. Choć nie można wykluczyć dalszej rozbudowy w przyszłości, to, co przejdzie do historii jako „styl Ringstrasse”, właśnie tutaj i teraz osiągnęło swój szczyt. Cała Europa zazdrości nam tego widoku!"
 gaudi.506.f: "„Było bardzo pięknie, sprawiło mi to wielką przyjemność”. — Franciszek Józef I."
 gaudi.506.g: "Było bardzo pięknie, sprawiło mi to prawdziwą przyjemność."
 gaudi.509.t: "Wiedeń Utracony!"
 gaudi.509.d: "Wraz z utratą Wiednia straciliśmy wszelką możliwość kontynuowania budowy wiedeńskiej Ringstrasse."
 gaudi.509.f: "Jeśli z jakiegokolwiek powodu utracimy Wiedeń, dotychczasowe postępy budowy nie przepadną całkowicie. Tylko Austria może kontynuować budowę wiedeńskiej Ringstrasse od ostatniego etapu. Obcy najeźdźcy nie wykażą natomiast zainteresowania dalszą budową."
 gaudi.509.g: "Nie możemy pozostawić Wiednia w ich rękach na długo!"
 gaudi.601.t: "Krypta"
 gaudi.601.d: "Pierwszy etap budowy skupi się na krypcie i absydzie Sagrady Famílii. Już od samego początku staje się jasne, że rozmiary budowli są większe, niż początkowo zakładano."
 gaudi.601.f: "„Dzieło Świętej Rodziny powstaje powoli, ponieważ Mistrz tego dzieła się nie spieszy”. — Antoni Gaudí"
 gaudi.601.g: "Nie potrwa to aż tak długo, prawda?"
 gaudi.602.t: "Krypta ukończona"
 gaudi.602.d: "Dziś poświęcono kryptę Sagrady Famílii. Wkrótce będzie można odprawić w niej pierwsze nabożeństwo."
 gaudi.602.f: "„Ludzi można podzielić na dwa typy: ludzi słowa i ludzi czynu. Pierwsi mówią, drudzy działają. Należę do tej drugiej grupy. Brakuje mi środków, by odpowiednio wyrazić swoje myśli. Nie potrafiłbym nikomu wyjaśnić moich koncepcji artystycznych. Nie nadałem im jeszcze konkretnej postaci. Nigdy nie miałem czasu się nad nimi zastanowić. Cały swój czas poświęcałem pracy”. — Antoni Gaudí"
 gaudi.602.g: "Jeszcze dziewięć etapów budowy..."
 gaudi.603.t: "Absyda"
 gaudi.603.d: "Dzięki całkowicie zmienionemu projektowi, który niewiele przypomina pierwotne zamierzenia, Antoni Gaudí otworzył drogę do powstania kościoła, jakiego jeszcze nigdy nie było."
 gaudi.603.f: "„Nadaliśmy tytuł szaleńcowi albo geniuszowi. Czas pokaże”. — Elies Rogent, dyrektor Barcelońskiej Szkoły Architektury"
 gaudi.603.g: "Czy to ma się zakończyć za życia jednego człowieka?"
 gaudi.604.t: "Absyda ukończona"
 gaudi.604.d: "Po ukończeniu absydy mieszkańcy Barcelony mogą po raz pierwszy zobaczyć, co właściwie zamierza Gaudí. Budowla już teraz przybiera niezwykłe kształty."
 gaudi.604.f: "Linia prosta należy do Człowieka. Linia krzywa należy do Boga. — Antoni Gaudí"
 gaudi.604.g: "Jeszcze osiem etapów budowy..."
 gaudi.605.t: "Fasada Narodzenia Pańskiego"
 gaudi.605.d: "Wbrew życzeniom władz miejskich rozpoczyna się budowa Fasady Narodzenia Pańskiego. Początkowo wolały one wznieść najpierw Fasadę Męki Pańskiej, ponieważ jest zwrócona w stronę miasta."
 gaudi.605.f: "„Każdy odnajduje w świątyni coś swojego: chłopi widzą kury i koguty; uczeni — znaki zodiaku; teologowie — genealogię Jezusa. Lecz wyjaśnienie i zamysł znają jedynie znawcy i nie należy ich trywializować”. — Antoni Gaudí"
 gaudi.605.g: "Podobają mi się żółwie."
 gaudi.606.t: "Fasada Narodzenia Pańskiego ukończona"
 gaudi.606.d: "Budowa Fasady Narodzenia Pańskiego została ukończona. Jej fantazyjny wygląd i kolosalne rozmiary nie tylko przekonują mieszkańców Barcelony do wsparcia budowy kościoła, lecz także dają przedsmak całego dzieła."
 gaudi.606.f: "„Jedno pokolenie nie jest w stanie wznieść całej Świątyni, pozostawmy więc tak dobitne świadectwo naszych postępów, by przyszłe pokolenia poczuły zachętę do podobnego wysiłku, a zarazem nie krępujmy ich przy dalszych pracach (...). Ukończyliśmy całą fasadę Świątyni, aby jej doniosłość nie pozwoliła zaniechać dalszej budowy”. — Antoni Gaudí"
 gaudi.606.g: "Jeszcze siedem etapów budowy."
 gaudi.607.t: "Nawa Główna"
 gaudi.607.d: "Wnętrze Sagrady Famílii z każdym dniem wzbogaca się o nowe detale; bardziej przypomina las niż budynek."
 gaudi.607.f: "„Wnętrze świątyni będzie niczym las. (...) Filary nawy głównej będą palmami — drzewami chwały, ofiary i męczeństwa. Te w nawach bocznych będą wawrzynami — drzewami chwały i intelektu”. — Antoni Gaudí"
 gaudi.607.g: "Ile lat to potrwa?"
 gaudi.608.t: "Nawa Główna ukończona"
 gaudi.608.d: "Nuncjusz apostolski spotkał się z Gaudím podczas zwiedzania Sagrady Famílii. Jego zdaniem twórczość i sposób życia architekta słusznie zasługują na miano „Dantego architektury”. Wobec groteskowej architektury krytycy nie wiedzą jednak, czy kościół nawiązuje do raju, czy do piekła."
 gaudi.608.f: "„Malarstwo za pomocą barwy, a rzeźba za pomocą formy przedstawiają istniejące organizmy. Postacie, drzewa, owoce... wyrażają swoje wnętrze poprzez wygląd zewnętrzny. Architektura tworzy organizm. Musi zatem podlegać prawu zgodnemu z prawami natury. Architekci, którzy nie przestrzegają tej zasady, tworzą fuszerkę zamiast dzieła sztuki”. — Antoni Gaudí"
 gaudi.608.g: "Jeszcze sześć etapów budowy."
 gaudi.609.t: "Wieże Apostołów"
 gaudi.609.d: "Już przy budowie Fasady Narodzenia Pańskiego Gaudí podkreślał, że Sagrada Família powinna rosnąć raczej wzwyż niż wszerz, aby wzbudzać większy zachwyt; wznoszenie kolejnych wież nada budowli imponujący wygląd."
 gaudi.609.f: "„Jakiś czas temu przyjechał z moich rodzinnych stron dawny sąsiad, który znał mnie od dziecka. Na widok świątyni Sagrada Família zawołał z prostotą: Ach, ach! Robi to samo, co za małego! I miał rację. To zdolności przekazywane z pokolenia na pokolenie są moją siłą napędową i wskazują mi drogę”. — Antoni Gaudí"
 gaudi.609.g: "Czy to się kiedyś skończy?"
 gaudi.610.t: "Wieże Apostołów ukończone"
 gaudi.610.d: "Ukończono pierwsze wieże Sagrady Famílii. Część mieszkańców jest zafascynowana, a część wstrząśnięta."
 gaudi.610.f: "„W przeciwieństwie do większości kościołów w Barcelonie nie został uszkodzony podczas rewolucji — jak mówiono, oszczędzono go ze względu na jego «wartość artystyczną». Uważam, że anarchiści wykazali się złym gustem, nie wysadzając go w powietrze, gdy mieli ku temu okazję, choć wywiesili między jego wieżami czerwono-czarny sztandar”. — George Orwell"
 gaudi.610.g: "Jeszcze pięć etapów budowy."
 gaudi.611.t: "Fasada Męki Pańskiej"
 gaudi.611.d: "Wraz z budową Fasady Męki Pańskiej powstaje część Sagrady Famílii, która budzi niepokój nawet wśród przyjaciół Gaudíego."
 gaudi.611.f: "„Ktoś uzna ten portal za zbyt wymyślny, lecz chciałbym, aby budził grozę. By to osiągnąć, nie będę szczędził światłocienia, form wklęsłych i wypukłych ani niczego, co pozwoli uzyskać jak najbardziej ponury efekt. Co więcej, jestem gotów poświęcić samą konstrukcję, łamać łuki i przecinać kolumny, by ukazać, jak krwawa jest Ofiara”. — Antoni Gaudí"
 gaudi.611.g: "Groza zaklęta w kamieniu."
 gaudi.612.t: "Fasada Męki Pańskiej ukończona"
 gaudi.612.d: "W przeciwieństwie do Fasady Narodzenia Pańskiego utrzymana w prostym stylu Fasada Męki Pańskiej sprawia niezwykle nowoczesne wrażenie, przez co jednych przyciąga, a innych odpycha. Teraz staje się całkowicie zrozumiałe, dlaczego Gaudí nie chciał wznosić jej jako pierwszej."
 gaudi.612.f: "„To, co zobaczyłem w Barcelonie — dzieło Gaudíego — było wyrazem takiej siły, takiej wiary i niezwykłych umiejętności technicznych, przejawiających się przez całe życie geniusza; człowieka, który na własnych oczach nadawał kamieniom kształt według starannie przemyślanego wzoru. Gaudí to «budowniczy» przełomu wieków, mistrz kamienia, żelaza i cegły. Jego kraj dostrzega dziś jego wielkość. Gaudí był wielkim artystą; w pamięci pozostają tylko ci, którzy poruszają wrażliwe serca ludzi łagodnego ducha”. — Le Corbusier"
 gaudi.612.g: "Pozostały już tylko cztery etapy budowy."
 gaudi.613.t: "Transept"
 gaudi.613.d: "Mimo pomyślnych postępów prac budowlanych krytycy nadal zabierają głos, teraz również ze świata sztuki. Nie chcą, by przy budowie sztywno trzymano się wytycznych, lecz by projekt ewoluował wraz z nowymi nurtami w architekturze. Kierownictwo budowy odrzuciło te postulaty."
 gaudi.613.f: "„W książkach rzadko znajduje się to, czego się szuka, a gdy już się znajdzie, często okazuje się to błędne”. — Antoni Gaudí"
 gaudi.613.g: "Hosanna in excelsis."
 gaudi.614.t: "Transept ukończony"
 gaudi.614.d: "Teraz, gdy Sagrada Família jest ukończona w niemal dwóch trzecich, papież podczas mszy podniósł ją do rangi bazyliki mniejszej."
 gaudi.614.f: "„W Sagradzie Famílii wszystko jest dziełem Opatrzności: znajduje się ona w centrum miasta i równiny barcelońskiej; świątynię dzieli taka sama odległość od morza i gór, od Sants i Sant Andreu oraz od rzek Besòs i Llobregat”. — Antoni Gaudí"
 gaudi.614.g: "Pozostały już tylko trzy etapy budowy."
 gaudi.615.t: "Wieże Maryi i Ewangelistów"
 gaudi.615.d: "Projektując wieże Ewangelistów, Gaudí połączył w ich architekturze symbole, żywioły, znaki zodiaku i cnoty. Teraz jego wizja ma się urzeczywistnić."
 gaudi.615.f: "„Maryjo Dziewico, nie martw się, że jesteś mała, kwiaty i gwiazdy też takie są”. - Antoni Gaudí"
 gaudi.615.g: "Ave Maria."
 gaudi.616.t: "Wieże Maryi i Ewangelistów ukończone"
 gaudi.616.d: "Pięć wysokich wież Sagrady Famílii góruje nad Barceloną; umieszczenie dwunastoramiennej gwiazdy wieńczy budowę Wieży Maryi."
 gaudi.616.f: "„Sagrada Família nie jest ostatnią z katedr, lecz pierwszą nowej epoki”. - Antoni Gaudí"
 gaudi.616.g: "Dwa ostatnie etapy budowy!"
 gaudi.617.t: "Fasada Chwały"
 gaudi.617.d: "Wreszcie przystępujemy do budowy głównej fasady Sagrady Famílii. W tym celu trzeba nabyć nowe grunty pod zabudowę, ku wielkiemu niezadowoleniu mieszkańców miasta. Kierownictwo musi jeszcze wyrazić zgodę."
 gaudi.617.f: "„Nie ukończę ani nie dopracuję fragmentu modelu dzwonnic głównej fasady. Postanowiłem pozostawić go jedynie w zarysie, aby kolejne pokolenie mogło wnieść swój wkład w budowę świątyni, jak wielokrotnie bywało w dziejach katedr, których fasady są nie tylko dziełem innych twórców, lecz także reprezentują inne style”. - Antoni Gaudí"
 gaudi.617.g: "Sanctus, Sanctus, Sanctus."
 gaudi.618.t: "Fasada Chwały ukończona"
 gaudi.618.d: "Wraz z ukończeniem Fasady Chwały budowa Sagrady Famílii jest już niemal zakończona."
 gaudi.618.f: "„Sagrada Família... to najwybitniejsze dzieło twórczej architektury ostatnich dwudziestu pięciu lat. To duch wyrażony w kamieniu!” - Louis Sullivan"
 gaudi.618.g: "Ostatni etap budowy!"
 gaudi.619.t: "Wieża Chrystusa"
 gaudi.619.d: "Dzięki Wieży Chrystusa Sagrada Família nie tylko będzie górować nad Barceloną, lecz także przewyższy katedrę w Ulm - dotychczas najwyższy kościół w Europie."
 gaudi.619.f: "„Oryginalność polega na powrocie do źródeł”. - Antoni Gaudí"
 gaudi.619.g: "To będzie najwyższy kościół na Ziemi."
 gaudi.620.t: "La Sagrada"
 gaudi.620.d: "Ukończona! Naprawdę ukończona! Sagrada Família, architektoniczny cud świata, jaśnieje nad Barceloną i całym globem!"
 gaudi.620.f: "Ojcze nasz, któryś jest w niebie:\nświęć się imię Twoje:\nprzyjdź królestwo Twoje:\nbądź wola Twoja, jako w niebie, tak i na ziemi.\nChleba naszego powszedniego daj nam dzisiaj:\ni odpuść nam nasze winy, jako i my odpuszczamy naszym winowajcom\nI nie wódź nas na pokuszenie.\nAle nas zbaw ode złego."
 gaudi.620.g: "Nigdy nie sądziłem, że dożyję tego dnia."
 gaudi.629.t: "Barcelona Utracona!"
 gaudi.629.d: "Wraz z utratą Barcelony straciliśmy wszelką możliwość kontynuowania budowy Sagrady Famílii."
 gaudi.629.f: "Jeśli z jakiegokolwiek powodu utracimy Katalonię, dotychczasowe postępy budowy nie przepadną całkowicie. Inne państwo, o ile ma iberyjską kulturę podstawową, może kontynuować budowę katedry od ostatniego etapu. Obcy najeźdźcy nie wykażą natomiast zainteresowania dalszą budową."
 gaudi.629.g: "Nie możemy pozostawić Barcelony w ich rękach na długo!"
 gaudi.631.t: "Pobożna darowizna na rzecz Sagrady Famílii"
 gaudi.631.d: "Jako dobry chrześcijanin [SCOPE.sCharacter('gaudi_sagrada_donator').GetFullName] wykazuje duże osobiste zainteresowanie Sagradą Famílią. Z tego powodu przekazał prywatną darowiznę na budowę kościoła."
 gaudi.631.f: "Przez dziesięciolecia budowę Sagrady Famílii finansowano głównie z darowizn. To właśnie dzięki dużej anonimowej darowiźnie, otrzymanej na krótko przed rozpoczęciem budowy, Antoni Gaudí znacznie rozszerzył swoje plany, nadając Sagradzie Famílii jej dzisiejszy kształt. Prace budowlane nadal finansowane są, zgodnie z pierwotnym zamysłem Josepa Marii Bocabelli, z darowizn fundacji i opłat za wstęp. Każdego roku na budowę dostępnych jest około 22 milionów euro; w 2009 roku było to 18 milionów euro."
 gaudi.631.g: "Mamy wobec niego dług wdzięczności."
 gaudi.632.t: "Budowa Sagrady Famílii zachwyca duchowieństwo"
 gaudi.632.d: "Duchowieństwo naszego kraju jest zachwycone postępami budowy Sagrady Famílii i zaoferowało pomoc. Istnieje jednak obawa, że mogłoby to nadmiernie zwiększyć wpływy Kościoła."
 gaudi.632.f: "Ostatnie lata życia Gaudí poświęcił całkowicie „Katedrze Ubogich”, jak ją powszechnie nazywano, zbierając datki na kontynuowanie jej budowy. Poza pracą nad tym dziełem podejmował niewiele innych zajęć, a większość z nich wiązała się z jego wiarą katolicką: w 1916 roku uczestniczył w kursie chorału gregoriańskiego w Palau de la Música Catalana, prowadzonym przez benedyktyna Gregoriego M. Sunyola. Monsignor Ragonesi uważał Gaudíego za „Dantego architektury”. Mimo ogromnych rozmiarów Sagrada Família nie jest kościołem katedralnym, a jej budowa nie jest finansowana z oficjalnych źródeł kościelnych."
 gaudi.632.g: "Powinniśmy na tym skorzystać."
 gaudi.632.h: "Publicznie pochwalcie Kościół."
 gaudi.632.i: "Ta sprawa nie dotyczy Kościoła!"
 gaudi.633.t: "Związki zawodowe krytykują Sagradę Famílię"
 gaudi.633.d: "[SCOPE.sCharacter('trade_unions_leader').GetFullName] jako przedstawiciel związków zawodowych skierował dziś do rządu petycję o ponowne rozważenie kontrowersyjnego wsparcia dla budowy Sagrady Famílii."
 gaudi.633.f: "Przywódcy związkowi uważają trwającą budowę Sagrady Famílii za skandaliczne marnotrawstwo pieniędzy. Skoro nie mogą powstrzymać budowy i skierować tych środków na pożyteczne cele dobroczynne, domagają się przynajmniej lepszego traktowania i opieki dla robotników, którzy pracują na niebezpiecznych wysokościach."
 gaudi.633.g: "Zignorujcie ich."
 gaudi.633.h: "Poprzestańcie na pustych deklaracjach."
 gaudi.633.i: "Przeznaczcie środki na poprawę sytuacji robotników."
 gaudi.634.t: "Wypadek"
 gaudi.634.d: "Dziś na placu budowy Sagrady Famílii doszło do wypadku, który opóźnił prace o kilka tygodni."
 gaudi.634.f: "Praca na zawrotnych wysokościach nie jest jedynym źródłem zagrożenia. W 2020 roku podpalacz wzniecił pożar w Sagradzie Famílii, przerywając budowę i zmuszając do ewakuacji robotników oraz obecnych na miejscu turystów. Ogień objął zakrystię, powodując jej uszkodzenie."
 gaudi.634.g: "Godne ubolewania."
 gaudi.635.t: "Ateiści występują przeciwko Sagradzie Famílii"
 gaudi.635.d: "W dzisiejszym publicznym przemówieniu [SCOPE.sCharacter('gaudi_sagrada_atheist').GetFullName] potępił budowę Sagrady Famílii jako powrót do średniowiecza i wezwał osoby o podobnych poglądach do potępienia tego marnotrawstwa pieniędzy."
 gaudi.635.f: "„Można sprzeciwiać się Sagradzie Famílii z wielu powodów. Z wielu dobrych powodów. Choćby dlatego, że jest architektonicznym koszmarem, by nie powiedzieć przerażającym koszmarem. Nawet w europejskiej architekturze naszych czasów nie sposób znaleźć czegoś równie wulgarnego i pretensjonalnego. To koszmar, który z każdym dniem pnie się ku niebu, przybierając najbardziej dziwaczne i absurdalne formy, gdzieś pomiędzy kiczem, zabobonem a ludzkim szaleństwem. Przede wszystkim zaś jest to szaleństwo opłacane przez naszych podatników, aby księża mogli czynić głupich jeszcze głupszymi, a biednych jeszcze biedniejszymi. Panie i panowie, powiem wam jedno: to szaleństwo musi się skończyć. Nie jutro, lecz dziś!”"
 gaudi.635.g: "Nie powinniśmy zanadto prowokować tej grupy."
 gaudi.635.h: "DEUS VULT!"
 gaudi.636.t: "Inwestycje turystyczne"
 gaudi.636.d: "Branża turystyczna dostrzega korzyści płynące z budowy Sagrady Famílii i chciałaby wesprzeć to przedsięwzięcie."
 gaudi.636.f: "W ciągu XX wieku Sagrada Família stała się prawdziwym symbolem Barcelony. Choć dla Gaudíego najważniejszy był wymiar duchowy, pomysłowi przedsiębiorcy coraz wyraźniej dostrzegali, że ten wieczny plac budowy można wykorzystać komercyjnie. W późniejszych latach setki targujących się turystów miały z tego powodu tłumnie przybywać do Barcelony. Dziś Sagrada Família jest jedną z najpopularniejszych atrakcji turystycznych Hiszpanii."
 gaudi.636.g: "Barcelona wkrótce wzbogaci się o nowy symbol."
 gaudi.637.t: "Nowe maszyny na plac budowy"
 gaudi.637.d: "Nasz krajowy przemysł silnikowy wyposażył niedawno plac budowy Sagrady Famílii w niezwykle nowoczesną maszynę, która przyspiesza postępy prac."
 gaudi.637.f: "Trwającej ponad stulecie budowie Sagrady Famílii towarzyszył również rozwój technologii, który miał przyspieszyć prace. O ile na przełomie wieków stosowano nowe metody budowlane i maszyny, o tyle pod koniec stulecia symulacje komputerowe zrewolucjonizowały budowę kościoła."
 gaudi.637.g: "To jest postęp!"
 gaudi.638.t: "Groźba strajku"
 gaudi.638.d: "Robotnicy pracujący przy budowie Sagrady Famílii zapowiedzieli strajk, jeśli nie zgodzimy się na negocjacje w sprawie wyższych płac."
 gaudi.638.f: "Ach, ten cudowny świat strajków! Nie wiecie, co tracicie, jeśli nigdy nie utknęliście na dworcu w Europie Południowej, bo związek zawodowy kolejarzy nagle postanowił sparaliżować ruch. Dziś dotyczy to tylko jednego placu budowy. Naprawdę mamy szczęście!"
 gaudi.638.g: "Nie będziemy negocjować."
 gaudi.638.h: "Opłacenie kilku łamistrajków załatwi sprawę."
 gaudi.638.i: "Wezwijcie Gwardię Cywilną!"
 gaudi.638.j: "Negocjuj."
 gaudi.639.t: "Materiał Gorszej Jakości"
 gaudi.639.d: "Ostatnia dostawa materiałów do budowy Sagrady Famílii okazała się kiepskiej jakości."
 gaudi.639.f: "Już wstępne oględziny wykazały, że dostarczony kamień był miejscami porowaty. Mistrz budowlany bez wahania odrzucił więc całą partię. Z pewnością opóźniłoby to budowę i pociągnęło za sobą dodatkowe koszty, lecz ostatecznie jakość jest najważniejsza. Niektórzy twierdzą jednak, że dla oszczędności czasu i pieniędzy powinniśmy nie tylko wykorzystać ten kamień, ale także odłożyć część lepszych materiałów budowlanych, a uzyskane w ten sposób środki przeznaczyć na... inne cele."
 gaudi.639.g: "Jakość ma swoją cenę."
 gaudi.639.h: "Jakby ktokolwiek miał to zauważyć."
 gaudi.640.t: "Niedbała budowa"
 gaudi.640.d: "Materiał gorszej jakości dał o sobie znać: dziś rano zawaliła się część Sagrady Famílii, powodując znaczne zniszczenia."
 gaudi.640.f: "Antoni Gaudí nie jest zachwycony."
 gaudi.640.g: "Któż mógł to przewidzieć?"
 gaudi.641.t: "Szybszy Postęp Budowy"
 gaudi.641.d: "Prace nad Sagradą Famílią postępują lepiej, niż oczekiwano. Spodziewamy się wyprzedzić harmonogram o kilka miesięcy."
 gaudi.641.f: "Nowoczesna technologia, sprawna organizacja pracy, nieprzerwane dostawy materiałów i dobra pogoda sprzyjają postępom budowy."
 gaudi.641.g: "Przewidziałem to!"
 gaudi.642.t: "Nowe miejsca pracy w Barcelonie"
 gaudi.642.d: "Budowa kościoła przyciągnęła do Barcelony wielu nowych mieszkańców."
 gaudi.642.f: "Podobnie jak w średniowieczu, budowa wielkiego kościoła zrodziła wiele nowych potrzeb w życiu miasta, które często można było zaspokoić jedynie dzięki napływowi nowych pracowników. Trzeba zatrudnić nie tylko samych robotników budowlanych. Potrzebują oni również gospód, sklepów, dostawców i nowych mieszkań, które przecież także ktoś musi zbudować. Doprowadziło to do rozkwitu Barcelony, z którego niektórzy chcą czerpać bezpośrednie lub pośrednie korzyści."
 gaudi.642.g: "Wielkie przedsięwzięcie potrzebuje wielkich ludzi."
 gaudi.643.t: "Duża anonimowa darowizna"
 gaudi.643.d: "Nieznany, zamożny darczyńca przekazał znaczną sumę pieniędzy, która przyspieszy budowę Sagrady Famílii."
 gaudi.643.f: "Przez dziesięciolecia budowę Sagrady Famílii finansowano głównie z darowizn. To właśnie dzięki dużej anonimowej darowiźnie, otrzymanej na krótko przed rozpoczęciem budowy, Antoni Gaudí znacznie rozszerzył swoje plany, nadając Sagradzie Famílii jej dzisiejszy kształt. Prace budowlane nadal finansowane są, zgodnie z pierwotnym zamysłem Josepa Marii Bocabelli, z darowizn fundacji i opłat za wstęp. Każdego roku na budowę dostępnych jest około 22 milionów euro; w 2009 roku było to 18 milionów euro."
 gaudi.643.g: "Najwyraźniej ktoś bardzo obawia się o swoje zbawienie."
 gaudi.644.t: "[SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('gaudi_ruler').GetFullName] wspiera budowę Sagrady Famílii"
 gaudi.644.d: "[SCOPE.sCharacter('gaudi_ruler').GetFullName] wykazuje duże osobiste zainteresowanie Sagradą Famílią."
 gaudi.644.f: "Oficjalnie budowa Sagrady Famílii nie otrzymuje wsparcia rządowego. Podczas hiszpańskiej wojny domowej radykalne siły lewicowe podejmowały nawet działania mające uniemożliwić dalszą budowę. Franco wykazywał niewielkie zainteresowanie świątynią, lecz niewiele mógł zrobić. Gaudí nalegał, by jej budowę finansowali członkowie hiszpańskiej wspólnoty katolickiej. Nie wyklucza to jednak możliwości, by zainteresowana głowa państwa znacząco przyspieszyła realizację przedsięwzięcia nieoficjalnymi kanałami ... czy to za pomocą pieniędzy, czy dzięki kontaktom z lokalnymi władzami."
 gaudi.644.g: "Niech żyje nasz dobry [SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('gaudi_ruler').GetFullName]!"
 gaudi.645.t: "Zwiedzanie"
 gaudi.645.d: "Sagrada Família wciąż jest w budowie, ale postępy są imponujące. Powinniśmy zaprosić sojusznika i wszystko mu pokazać."
 gaudi.645.f: "Nawet jako nieukończona budowla Sagrada Família robiła wrażenie na odwiedzających i pobudzała ich wyobraźnię. Sam jej projekt budził skrajne opinie. Architekci współcześni Gaudíemu oceniali ją na ogół pozytywnie; Louis Sullivan bardzo ją podziwiał, opisując Sagradę Famílię jako „najwybitniejsze dzieło twórczej architektury ostatnich dwudziestu pięciu lat. To duch wyrażony w kamieniu!”. Walter Gropius chwalił Sagradę Famílię, nazywając jej ściany „cudem technicznej doskonałości”. Pisarz i krytyk George Orwell nazwał ją jednak „jedną z najbardziej odrażających budowli na świecie”."
 gaudi.645.g: "Zaprośmy naszego sojusznika do Barcelony."
 gaudi.645.h: "To tylko zakłóci nasze prace."
 gaudi.646.t: "Wesprzeć budowę Sagrady Famílii?"
 gaudi.646.d: "Nasz ambasador został zaproszony do zwiedzenia placu budowy Sagrady Famílii. Wizyta zrobiła na nim ogromne wrażenie i teraz pyta, czy nie zechcielibyśmy zyskać międzynarodowego prestiżu, przekazując darowiznę na budowę kościoła."
 gaudi.646.f: "Nawet jako nieukończona budowla Sagrada Família robiła wrażenie na odwiedzających i pobudzała ich wyobraźnię. Sam jej projekt budził skrajne opinie. Architekci współcześni Gaudíemu oceniali ją na ogół pozytywnie; Louis Sullivan bardzo ją podziwiał, opisując Sagradę Famílię jako „najwybitniejsze dzieło twórczej architektury ostatnich dwudziestu pięciu lat. To duch wyrażony w kamieniu!”. Walter Gropius chwalił Sagradę Famílię, nazywając jej ściany „cudem technicznej doskonałości”. Pisarz i krytyk George Orwell nazwał ją jednak „jedną z najbardziej odrażających budowli na świecie”."
 gaudi.646.g: "To wspaniałe przedsięwzięcie zasługuje na nasze wsparcie."
 gaudi.646.h: "Gdyby ten „kościół” był żywy, należałoby go spalić."
 gaudi.647.t: "Darowizna od Sojusznika"
 gaudi.647.d: "Po zwiedzaniu ambasador naszego sojusznika był tak zachwycony, że postanowił wesprzeć przedsięwzięcie darowizną."
 gaudi.647.f: "Nawet jako nieukończona budowla Sagrada Família robiła wrażenie na odwiedzających i pobudzała ich wyobraźnię. Sam jej projekt budził skrajne opinie. Architekci współcześni Gaudíemu oceniali ją na ogół pozytywnie; Louis Sullivan bardzo ją podziwiał, opisując Sagradę Famílię jako „najwybitniejsze dzieło twórczej architektury ostatnich dwudziestu pięciu lat. To duch wyrażony w kamieniu!”. Walter Gropius chwalił Sagradę Famílię, nazywając jej ściany „cudem technicznej doskonałości”. Pisarz i krytyk George Orwell nazwał ją jednak „jedną z najbardziej odrażających budowli na świecie”."
 gaudi.647.g: "Prawdziwych przyjaciół rozpoznaje się od razu."
 gaudi.648.t: "Badania archeologiczne w Barcelonie"
 gaudi.648.d: "Po wizycie w Barcelonie [SCOPE.sCharacter('gaudi_archaeologist').GetFullName] odkrył, że Sagrada Família najwyraźniej stoi na rzymskich ruinach. Prosi o pozwolenie na prowadzenie badań."
 gaudi.648.f: "Choć Rzymianie osiedlili się w Barcino, miało ono znacznie mniejsze znaczenie niż ośrodki stołeczne Tarraco i Caesaraugusta. Nazwę Barcino przyjęto pod koniec panowania Augusta, pierwszego cesarza Rzymu. Była to skrócona forma nazwy Colonia Faventia Iulia Augusta Pia Barcino, kolonii założonej w 133 roku p.n.e. Jej celem było zapewnienie ziemi weteranom. Rzymski geograf Pomponiusz Mela opisywał Barcino jako skupisko mniejszych osad podlegających Tarragonie (Tarraco). Strategiczne położenie miasta przy odgałęzieniu Via Augusta umożliwiło jednak jego rozwój gospodarczy, a samo miasto cieszyło się zwolnieniem z podatków."
 gaudi.648.g: "Nie możemy sobie pozwolić na tak długą przerwę w budowie."
 gaudi.648.h: "Wyjątkowa okazja do badań archeologicznych."
 gaudi.649.t: "[SCOPE.sCharacter('gaudi_chief_engineer').GetLastName] znów wpadł na pomysł..."
 gaudi.649.d: "[SCOPE.sCharacter('gaudi_chief_engineer').GetFullName] zaskoczył niedawno kierownictwo budowy pewną zmianą..."
 gaudi.649.f: "Każdy, kto wznosi takiego kolosa jak Sagrada Família, prędzej czy później staje się ekscentrykiem - albo już nim jest."
 gaudi.649.g: "To niemal tak straszne jak budowa Mole Antonelliana..."
 gaudi.650.t: "[SCOPE.sCharacter('gaudi_chief_engineer').GetLastName] przyspiesza budowę Sagrady Famílii"
 gaudi.650.d: "[SCOPE.sCharacter('gaudi_chief_engineer').GetFullName] zaskoczył niedawno kierownictwo budowy postępami prac."
 gaudi.650.f: "Dobrze być głównym inżynierem."
 gaudi.650.g: "To niemal tak satysfakcjonujące jak budowa wiedeńskiej Ringstrasse."
 gaudi.1001.t: "Upowszechnienie Szkieletu Stalowego w budownictwie"
 gaudi.1001.d: "Wynalezienie Budownictwa Szkieletowego ze Stali nie było dziełem jednej osoby. Był to powolny proces. Jednak [SCOPE.sCharacter('gaudi_engineer_scope').GetFullName], znany inżynier, przyczynia się do upowszechnienia tego wynalazku, wznosząc budynki o niezwykłej wytrzymałości, sięgające niespotykanych dotąd wysokości."
 gaudi.1001.f: "Nowy budynek, który w przyszłości miał pomieścić bank, z każdym dniem piął się coraz wyżej. Stalowa konstrukcja stała niczym szkielet, czekając na pokrycie innym materiałem.\nJednak jego architektom marzyło się już znacznie więcej niż 10 pięter. W przyszłości możliwe stanie się wznoszenie budynków liczących 50, a może nawet 100 pięter!"
 gaudi.1001.g: "Nasze wieże wreszcie sięgną nieba!"
 gaudi.1002.t: "Pawilony Güella"
 gaudi.1002.g: "Doprawdy niezwykły Styl Artystyczny!"
 gaudi.1003.t: "[SCOPE.sCharacter('tesla_new_engineer_scope').GetFullName] zwycięża na torze Savio"
 gaudi.1003.d: "Młody [SCOPE.sCharacter('tesla_new_engineer_scope').GetFullName] zajął pierwsze miejsce w wyścigu Grand Prix na torze Savio w Rawennie. Może moglibyśmy jakoś wesprzeć ten wschodzący talent?"
 gaudi.1003.f: "Zapach benzyny w powietrzu, ryk silników, emocje, niebezpieczeństwo, akcja, oto co przyciągało tłumy widzów na wyścigi samochodowe.\n\nW 1923 roku młody Enzo Ferrari wygrał swój pierwszy wyścig Grand Prix i ścigał się aż do narodzin syna, kiedy to zakończył karierę kierowcy. Pozostał jednak wierny wyścigom, zakładając Scuderia Ferrari, własny zespół kierowców wyścigowych."
 gaudi.1003.g: "Cóż za widowisko!"
