 je_gaudi_new_locomotives_project_reason: "Twój [concept_tesla_mechanical_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] niestrudzenie pracuje nad skonstruowaniem nowych typów lokomotyw dla państwa [GetPlayer.GetName]. Projekt będzie zyskiwał Postęp co miesiąc. Gdy postęp osiągnie [JournalEntry.GetTotalGoalValue|V0], nowe lokomotywy będą co miesiąc trafiać do jednego z budynków typu [GetBuildingType('building_railway').GetName]. Modyfikator otrzyma najpierw budynek o najwyższym poziomie. Pasek postępu zostanie zresetowany, gdy wszystkie budynki otrzymają ten modyfikator.\nŁącznie można uzyskać 5 modyfikatorów. Każdy kolejny modyfikator wymaga ponownego zapełnienia paska postępu.\n\nObecny miesięczny postęp: #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_mechanical_research_progress_tt')] [GetPlayer.MakeScope.GetVariable('gaudi_monthly_mechanical_engineering_progress_var').GetValue|2+] #!#!"
