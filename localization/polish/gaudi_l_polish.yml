 je_gaudi_sagrada_phase_3: "Sagrada Família: Fasada Narodzenia Pańskiego"
 je_gaudi_sagrada_phase_3_reason: "Fasada Narodzenia Pańskiego, poświęcona narodzinom Jezusa, jest ozdobiona scenami nawiązującymi do różnych przejawów życia. Charakterystyczne dla naturalistycznego stylu Gaudíego rzeźby są misternie rozmieszczone i wzbogacone scenami oraz motywami zaczerpniętymi z natury, z których każdy ma własne znaczenie symboliczne. Fasada jest zwrócona ku północnemu wschodowi, w stronę wschodzącego słońca, symbolizującego narodziny Chrystusa. Dzieli się na trzy portyki, z których każdy przedstawia jedną z cnót teologalnych (Nadzieję, Wiarę i Miłość). Nad drzwiami Jezusa w portyku Miłości wznosi się Drzewo Życia."
 je_gaudi_sagrada_phase_3_goal: "#E Postęp Budowy#! osiągnie #BLUE 120#! Punktów. Obecnie posiadamy #G [GetGlobalVariable('gaudi_sagrada_progress').GetValue]#! Punktów. Zazwyczaj otrzymujemy jeden Punkt miesięcznie."
 je_gaudi_sagrada_phase_4: "Sagrada Família: Nawa Główna"
 je_gaudi_sagrada_phase_4_reason: "Plan świątyni ma kształt krzyża łacińskiego i obejmuje pięć naw. Kolumny we wnętrzu stanowią unikatowe dzieło Gaudíego. Nie tylko rozgałęziają się, aby podtrzymywać spoczywający na nich ciężar, lecz także nieustannie zmieniają swój przekrój w wyniku przenikania się różnych form geometrycznych. Najprostszym przykładem jest kolumna o kwadratowej podstawie, której przekrój wraz ze wzrostem wysokości przechodzi w ośmiokąt, następnie w szesnastokąt, aż w końcu przybiera kształt koła. W zasadzie żadna z wewnętrznych powierzchni nie jest płaska. Dekoracje są wszechobecne i niezwykle bogate, składając się w dużej mierze z abstrakcyjnych form łączących płynne krzywizny z ostrymi, nieregularnymi zakończeniami. Nawet najdrobniejsze elementy wykończenia, takie jak żelazne balustrady balkonów i schodów, obfitują w kunsztownie ukształtowane, faliste linie."
 je_gaudi_sagrada_phase_4_goal: "#E Postęp Budowy#! osiągnie #BLUE 120#! Punktów. Obecnie posiadamy #G [GetGlobalVariable('gaudi_sagrada_progress').GetValue]#! Punktów. Zazwyczaj otrzymujemy jeden Punkt miesięcznie."
 je_gaudi_sagrada_phase_5: "Sagrada Família: Iglice Apostołów"
 je_gaudi_sagrada_phase_5_reason: "Pierwotny projekt Gaudíego przewiduje łącznie osiemnaście iglic, symbolizujących, w kolejności od najniższych do najwyższych, Dwunastu Apostołów, Maryję Dziewicę, czterech Ewangelistów i wreszcie Jezusa Chrystusa, któremu poświęcona jest najwyższa z nich. Wszystkie wieże, których kształty mają przywodzić na myśl pastorał biskupi, posiadają długie pionowe żłobienia oraz barwne zwieńczenia ozdobione przedstawieniami zwierząt, świętymi symbolami i cytatami z Biblii. Na każdej z nich znajduje się niewielki złoty krzyż z imieniem odpowiedniego apostoła. Niektóre wieże są połączone wąskimi kamiennymi mostami."
 je_gaudi_sagrada_phase_5_goal: "#E Postęp Budowy#! osiągnie #BLUE 120#! Punktów. Obecnie posiadamy #G [GetGlobalVariable('gaudi_sagrada_progress').GetValue]#! Punktów. Zazwyczaj otrzymujemy jeden Punkt miesięcznie."
 je_gaudi_sagrada_phase_6: "Sagrada Família: Fasada Męki Pańskiej"
 je_gaudi_sagrada_phase_6_reason: "W przeciwieństwie do bogato zdobionej Fasady Narodzenia Pańskiego Fasada Męki Pańskiej jest surowa, oszczędna i prosta, z rozległymi powierzchniami nieozdobionego kamienia oraz ostrymi, prostymi liniami przywodzącymi na myśl kości szkieletu. Poświęcona Męce Chrystusa i cierpieniu Jezusa podczas ukrzyżowania, fasada ma ukazywać grzechy ludzkości. Gaudí pragnął, aby budziła ona lęk wśród patrzących. Zamierzał „łamać” łuki i „przecinać” kolumny, a także wykorzystywać efekt światłocienia (ciemne, kanciaste cienie kontrastujące z ostrym, intensywnym światłem), aby jeszcze mocniej podkreślić surowość i okrucieństwo ofiary Chrystusa. Fasada Męki Pańskiej, zwrócona ku zachodzącemu słońcu, symbolizującemu śmierć Chrystusa, wspiera się na sześciu dużych, pochylonych kolumnach, których kształt ma przypominać napięte mięśnie."
 je_gaudi_sagrada_phase_6_goal: "#E Postęp Budowy#! osiągnie #BLUE 120#! Punktów. Obecnie posiadamy #G [GetGlobalVariable('gaudi_sagrada_progress').GetValue]#! Punktów. Zazwyczaj otrzymujemy jeden Punkt miesięcznie."
 je_gaudi_sagrada_phase_7: "Sagrada Família: Transept"
 je_gaudi_sagrada_phase_7_reason: "Wśród motywów zdobniczych całej świątyni pojawiają się słowa zaczerpnięte z liturgii. Wieże zdobią inskrypcje takie jak „Hosanna”, „Excelsis” i „Sanctus”. Na wielkich drzwiach Fasady Męki Pańskiej umieszczono fragmenty Nowego Testamentu opisujące Mękę Jezusa w różnych językach, przede wszystkim po katalońsku. Fasadę Chwały mają natomiast zdobić słowa Składu Apostolskiego, a jej główne drzwi mają zawierać pełny tekst Modlitwy Pańskiej w języku katalońskim, otoczony licznymi wersjami słów „Chleba naszego powszedniego daj nam dzisiaj” w innych językach. Trzy wejścia symbolizują trzy cnoty: Wiarę, Nadzieję i Miłość. Każde z nich jest również poświęcone innemu etapowi życia Chrystusa."
 je_gaudi_sagrada_phase_7_goal: "#E Postęp Budowy#! osiągnie #BLUE 120#! Punktów. Obecnie posiadamy #G [GetGlobalVariable('gaudi_sagrada_progress').GetValue]#! Punktów. Zazwyczaj otrzymujemy jeden Punkt miesięcznie."
 je_gaudi_sagrada_phase_8: "Sagrada Família: Iglice Maryi i Ewangelistów"
 je_gaudi_sagrada_phase_8_reason: "Iglice Ewangelistów zwieńczone są rzeźbami przedstawiającymi ich tradycyjne symbole: uskrzydlonego wołu (św. Łukasz), uskrzydlonego człowieka (św. Mateusz), orła (św. Jan) oraz uskrzydlonego lwa (św. Marek). Zwieńczenia wież mają 22,5 metra wysokości i składają się z trzech części. Podstawę tworzą cztery rzędy sześciokątów z inskrypcjami Al·leluia i Amen, otoczone ceramicznymi liśćmi palmowymi o wzorze przypominającym jodełkę. W środkowej części znajduje się dwudziestościan przenikający się z kulą, pokrytą ceramiczną mozaiką trencadís i szkłem weneckim, wewnątrz której umieszczono źródła światła. Całość wieńczą rzeźby przedstawiające symbole czterech Ewangelistów, wyposażone w skrzydła i księgi Ewangelii z inicjałami poszczególnych świętych. Wieża Maryi znajduje się nad apsydą i jest zwieńczona wielką dwunastoramienną gwiazdą, symbolizującą Gwiazdę Poranną. Zdobią ją również liczne elementy ikonograficzne nawiązujące do Matki Bożej, takie jak słowa modlitwy Zdrowaś Maryjo oraz różnorodne kwiaty symbolizujące przymioty Matki Jezusa."
 je_gaudi_sagrada_phase_8_goal: "#E Postęp Budowy#! osiągnie #BLUE 120#! Punktów. Obecnie posiadamy #G [GetGlobalVariable('gaudi_sagrada_progress').GetValue]#! Punktów. Zazwyczaj otrzymujemy jeden Punkt miesięcznie."
 je_gaudi_sagrada_phase_9: "Sagrada Família: Fasada Chwały"
 je_gaudi_sagrada_phase_9_reason: "Największą i najbardziej imponującą spośród wszystkich fasad jest Fasada Chwały. Poświęcona Niebiańskiej Chwale Jezusa, przedstawia drogę do Boga poprzez Śmierć, Sąd Ostateczny i Chwałę, podczas gdy Piekło czeka na tych, którzy zboczyli z drogi wyznaczonej przez wolę Bożą. Do Portyku Chwały prowadzą monumentalne schody, biegnące ponad podziemnym przejściem pod ulicą Carrer de Mallorca, którego dekoracje przedstawiają Piekło i występki. Znajdą się tam wizerunki demonów, bożków, fałszywych bogów, a także przedstawienia herezji i schizm. Ukazane zostaną również Czyściec i śmierć, przy czym tę ostatnią symbolizować będą grobowce rozmieszczone wzdłuż ziemi. Portyk posiada siedem wielkich kolumn poświęconych darom Ducha Świętego. U podstawy kolumn znajdują się przedstawienia siedmiu grzechów głównych, natomiast na ich szczytach ukazano siedem cnót niebiańskich."
 je_gaudi_sagrada_phase_9_goal: "#E Postęp Budowy#! osiągnie #BLUE 120#! Punktów. Obecnie posiadamy #G [GetGlobalVariable('gaudi_sagrada_progress').GetValue]#! Punktów. Zazwyczaj otrzymujemy jeden Punkt miesięcznie."
 je_gaudi_sagrada_phase_10: "Sagrada Família: Iglica Chrystusa"
 je_gaudi_sagrada_phase_10_reason: "Wieża Jezusa jest połączona czterema mostami z wieżami Ewangelistów i zwieńczona wielkim sześcioramiennym krzyżem o wysokości 13,5 metra. W jego centralnej części znajduje się baranek, a także inskrypcja „Tu solus Sanctus, Tu solus Dominus, Tu solus Altissimus” oraz słowa „Amen” i „Alleluja”. Każde z czterech ramion krzyża emituje potężne snopy światła widoczne z wielkiej odległości, nawiązując do biblijnych słów Jezusa: „Ja jestem światłością świata”. Wewnątrz Wieża Jezusa będzie podzielona na trzy kondygnacje, symbolizujące stworzenie wszechświata oraz słowa Chrystusa: „Ja jestem drogą, prawdą i życiem”."
