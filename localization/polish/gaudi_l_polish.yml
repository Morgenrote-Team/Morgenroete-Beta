 gaudi.1441.t: "The modern $building_power_plant$ of [GetPlayer.GetName]"
 gaudi.1441.d: "Our [concept_tesla_electrical_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] has spent a long time improving the capabilities of the Power Plants and Power Infrastructure in our country. From improving the cable to improving the efficiency of the generators.\n\nTotal improved buildings: [GetPlayer.MakeScope.Var('mr_num_improved_power_plants_buildings_var').GetValue|V0]"
 gaudi.1441.f: "\"The Power Generators are now much more powerful. In fact one of my employees acidentally tested their strength by becoming a lightning rod.\""
 gaudi.1441.g: "Unlimited Power!"
 tesla_civil_engineer_desc: "[Concept('concept_tesla_civil_engineer','$concept_tesla_civil_engineers|q$')] are engineers that focus on construction and infrastructure projects. They might build new bridges, tunnels or canals."
 tesla_mechanical_engineer_desc: "[Concept('concept_tesla_mechanical_engineer','$concept_tesla_mechanical_engineers|q$')] focus on the construction of new and innovative machines. Maybe they will create a better locomotive or a new innovative steam engine. Maybe they will even build carts that can move without horses?"
 tesla_military_engineer_desc: "[Concept('concept_tesla_military_engineer','$concept_tesla_military_engineers|q$')] are oftentimes part of the military and focus on the construction of fortresses or new innovative war machines."
 tesla_electrical_engineer_desc: "Electricity allows for many innovative uses, from light, to motors and even communication. [Concept('concept_tesla_electrical_engineer','$concept_tesla_electrical_engineers|q$')] work on harnessing this power for the good of humanity."
 tesla_aeronautical_engineer_desc: "The dream of flying is old. Now that it is actually possible for humans to conquer the air, [Concept('concept_tesla_aeronautical_engineer','$concept_tesla_aeronautical_engineers|q$')] are aiming to let people fly higher, faster and further as they build new airplanes and airships."
