 gaudi_traditional_style: "Tradycyjna Architektura"
 gaudi_traditional_style_desc: "Jako Architekt:\n#p +10#! $country_construction_add$ (jeśli nie jest zajęty projektem)\n\nTen architekt kieruje się tradycyjnymi stylami budownictwa, nie wprowadzając żadnych innowacji."
 gaudi_historicism_style: "Architektura Historyzmu"
 gaudi_historicism_style_desc: "Jako Architekt:\n#p +20#! $country_construction_add$ (jeśli nie jest zajęty projektem)\n\nTen architekt czerpie motywy, formy i style budowli z dawnych epok, łącząc je i reinterpretując w celu stworzenia czegoś nowego."
 gaudi_bauhaus_style: "Architektura Bauhausu"
 gaudi_bauhaus_style_desc: "Jako Architekt:\n#p +30#! $country_construction_add$ (jeśli nie jest zajęty projektem)\n\nTen architekt preferuje oszczędne w wyrazie, przejrzyste budynki o prostych formach."
 gaudi_neoclassical_style: "Architektura Neoklasycystyczna"
 gaudi_neoclassical_style_desc: "Jako Architekt:\n#p +30#! $country_construction_add$ (jeśli nie jest zajęty projektem)\n\nTen architekt skłania się ku monumentalnym budowlom o wyrazistych formach estetycznych, nawiązującym do imperialnej przeszłości."
 gaudi_art_deco_style: "Architektura Art Déco"
 gaudi_art_deco_style_desc: "Jako Architekt:\n#p +30#! $country_construction_add$ (jeśli nie jest zajęty projektem)\n\nTen architekt opowiada się za luksusową i pełną fantazji architekturą, która podkreśla żywotność i przepych."
 gaudi.51.t: "Odrodzenie Neoklasycyzmu"
 gaudi.51.d: "[ROOT.GetCountry.GetName] stał się wzorem ponadczasowej i dostojnej architektury. To prestiż, który budzi podziw w całym cywilizowanym świecie!"
 gaudi.51.f: "„Najbardziej charakterystyczną i najwybitniejszą cechą arcydzieł starożytności jest w istocie szlachetna prostota i spokojna wielkość, zarówno w postawie, jak i w wyrazie”.\n– Johann Joachim Winckelmann"
 gaudi.51.g: "To istota prawdziwej sztuki."
 gaudi.52.t: "Triumf Bauhausu"
 gaudi.52.d: "[ROOT.GetCountry.GetName] stał się wzorem racjonalnej i postępowej architektury. To prestiż, który budzi szacunek i podziw na całym świecie!"
 gaudi.52.f: "„Projektowanie nie jest zawodem, lecz postawą”.\n– László Moholy-Nagy"
 gaudi.52.g: "Potrzeby ludzi zamiast zamiłowania do luksusu!"
 je_gaudi_bauhaus_architecture: "Architektura Bauhausu"
 je_gaudi_bauhaus_architecture_reason: "Bauhaus był niemiecką szkołą artystyczną działającą w latach 1919–1933, która łączyła rzemiosło ze sztukami pięknymi. Szkoła zasłynęła z podejścia do projektowania, które dążyło do połączenia indywidualnej wizji artystycznej z zasadami produkcji masowej i naciskiem na funkcjonalność. U podstaw tej koncepcji leżała idea stworzenia Gesamtkunstwerk (całościowego dzieła sztuki), w którym wszystkie dziedziny sztuki miały ostatecznie połączyć się w jedną harmonijną całość. Styl Bauhausu stał się później jednym z najbardziej wpływowych nurtów nowoczesnego wzornictwa, architektury modernistycznej i edukacji architektonicznej."
 je_gaudi_neoclassical_architecture: "Architektura Neoklasycystyczna"
 je_gaudi_neoclassical_architecture_reason: "Neoklasycyzm początku XX wieku był nurtem w architekturze i sztuce, który dążył do odrodzenia klasycznych wzorców, nawiązując do przejrzystości form, symetrii i monumentalności starożytnej Grecji i Rzymu. Rozwijając się jako przeciwwaga dla przesady historyzmu i rosnącej abstrakcyjności sztuki nowoczesnej, styl ten kładł nacisk na monumentalizm, geometryczny porządek oraz wykorzystanie tradycyjnych form w racjonalnej estetyce, często popieranej przez państwo. Był ściśle związany z tożsamością narodową i architekturą publiczną, wyrażając ideały trwałości, autorytetu i zdyscyplinowanego piękna."
 je_gaudi_art_deco_architecture: "Architektura Art Déco"
 je_gaudi_art_deco_architecture_reason: "Art déco narodziło się w latach 20. XX wieku jako styl dekoracyjny i architektoniczny, który łączył nowoczesność z elementami klasycznego porządku. Dzięki charakterystycznemu wykorzystaniu stylizowanych form, szlachetnych materiałów i geometrycznych ornamentów art déco łączyło przepych tradycyjnego rzemiosła z rodzącą się estetyką maszynową. Styl ten sławił postęp technologiczny i dynamikę życia miejskiego poprzez motywy inspirowane przemysłem, prędkością i egzotyką."
 je_gaudi_splendour_bauhaus: "Triumf Bauhausu"
 je_gaudi_splendour_bauhaus_reason: "Wraz z rozprzestrzenianiem się idei Bauhausu architekci zaczęli odrzucać ornamentykę i pozorne efekty na rzecz przejrzystości, precyzji i wierności naturze materiałów. Celem architektury przestało być imponowanie przepychem czy przywoływanie dawnej potęgi imperiów. Zamiast tego zaczęła ona służyć społeczeństwu, tworząc przestrzenie funkcjonalne, pozbawione zbędnych ozdobników i nowoczesne. Bauhaus to nie tylko estetyka, lecz także filozofia projektowania oparta na przekonaniu, że architektura i codzienne życie muszą tworzyć harmonijną całość dzięki prostocie, użyteczności oraz jedności formy i przeznaczenia. Przyjmując zasady Bauhausu, stolica daje wyraz nie tylko swojej nowoczesności, ale także postępowi w najczystszej postaci: przedkładaniu funkcjonalności nad wygląd zewnętrzny, a innowacji nad tradycję."
 je_gaudi_splendour_neoclassical: "Odrodzenie Neoklasycyzmu"
 je_gaudi_splendour_neoclassical_reason: "Neoklasycyzm to styl zakorzeniony w racjonalnej harmonii starożytności, oparty na architektonicznym języku kolumn, frontonów i symetrycznych układów przestrzennych. Jednak na początku XX wieku zyskał nowe oblicze dzięki zastosowaniu nowoczesnych technik budowlanych, prostszych linii i często monumentalnej skali. Reprezentował nie tylko tradycję, lecz także uporządkowaną wizję przyszłości, w której życie publiczne, prawo i kultura miały rozwijać się w otoczeniu budowli budzących podziw i poczucie jedności. Architektura oparta na tych zasadach nadałaby naszej stolicy powagę i majestat, czyniąc z niej w oczach świata symbol ładu, niezłomności i potęgi opartej na kulturze."
 je_gaudi_splendour_art_deco: "Marzenie o Art Déco"
 je_gaudi_splendour_art_deco_reason: "Wraz z pojawieniem się art déco architekci zrewolucjonizowali świat sztuki, między innymi zrywając ze sztywnymi zasadami dawnego historyzmu. Jednak w przeciwieństwie do wielu nowoczesnych nurtów ich budowle nie były wyłącznie wyrazem funkcjonalności i obiektywizmu. Art déco rozwinęło się w okresie ogólnego rozkwitu klasycznego modernizmu, stawiając na pierwszym planie twórcze połączenie elegancji form, szlachetności materiałów, intensywności barw i zmysłowości motywów. W czasach swojej największej świetności styl ten uosabiał luksus, przepych, bogactwo form oraz wiarę w postęp społeczny i technologiczny. Architektura oparta na tych zasadach uczyniłaby nasz naród wzorem nowoczesności i bogactwa."
