 je_gaudi_secession_1: "Pierwsza Secesja Artystyczna"
 je_gaudi_secession_1_reason: "Nowy kierunek artystyczny, secesja, przyciągnął licznych artystów. W sprzyjających okolicznościach może to doprowadzić do powstania ugruntowanego ruchu artystycznego, który zdobędzie międzynarodowe uznanie i nada nowy impuls rozwojowi malarstwa oraz architektury. Historycznie jednym z najważniejszych stowarzyszeń tego rodzaju była Secesja Wiedeńska. Secesja Wiedeńska, a dokładniej Stowarzyszenie Artystów Austriackich, to stowarzyszenie artystów działające w Wiedniu w okresie fin de siècle, czyli schyłku XIX wieku. Od jego nazwy wywodzi się również określenie wiedeńskiej odmiany secesji, znanej jako styl secesyjny lub secesja wiedeńska."
 je_gaudi_secession_2: "Druga Secesja Artystyczna"
 je_gaudi_secession_2_reason: "Nowy kierunek artystyczny, secesja, przyciągnął licznych artystów. W sprzyjających okolicznościach może to doprowadzić do powstania ugruntowanego ruchu artystycznego, który zdobędzie międzynarodowe uznanie i nada nowy impuls rozwojowi malarstwa oraz architektury. Historycznie jednym z najważniejszych stowarzyszeń tego rodzaju była Secesja Wiedeńska. Secesja Wiedeńska, a dokładniej Stowarzyszenie Artystów Austriackich, to stowarzyszenie artystów działające w Wiedniu w okresie fin de siècle, czyli schyłku XIX wieku. Od jego nazwy wywodzi się również określenie wiedeńskiej odmiany secesji, znanej jako styl secesyjny lub secesja wiedeńska."
 je_gaudi_secession_3: "Trzecia Secesja Artystyczna"
 je_gaudi_secession_3_reason: "Nowy kierunek artystyczny, secesja, przyciągnął licznych artystów. W sprzyjających okolicznościach może to doprowadzić do powstania ugruntowanego ruchu artystycznego, który zdobędzie międzynarodowe uznanie i nada nowy impuls rozwojowi malarstwa oraz architektury. Historycznie jednym z najważniejszych stowarzyszeń tego rodzaju była Secesja Wiedeńska. Secesja Wiedeńska, a dokładniej Stowarzyszenie Artystów Austriackich, to stowarzyszenie artystów działające w Wiedniu w okresie fin de siècle, czyli schyłku XIX wieku. Od jego nazwy wywodzi się również określenie wiedeńskiej odmiany secesji, znanej jako styl secesyjny lub secesja wiedeńska."
 je_gaudi_splendid_architecture: "Wspaniała Nowa Architektura"
 je_gaudi_splendid_architecture_reason: "Wraz z pojawieniem się secesji i art déco architekci zrewolucjonizowali świat sztuki, między innymi zrywając ze sztywnym historyzmem minionych epok. Jednak w przeciwieństwie do wielu nurtów nowoczesnych ich budowle nie były wyłącznie wyrazem funkcjonalności i obiektywizmu. Art déco rozwinęło się w okresie powszechnego rozkwitu klasycznego modernizmu, stawiając na pierwszym planie twórcze połączenie elegancji form, szlachetności materiałów, intensywności barw i zmysłowości motywów. W czasach swojej największej świetności styl ten uosabiał luksus, przepych, ekstrawagancję oraz wiarę w postęp społeczny i technologiczny. Architektura hołdująca tym zasadom uczyniłaby nasz naród wzorem nowoczesności i bogactwa."
 je_gaudi_splendid_architecture_goal: "#E Wspaniała Architektura#! osiągnie #BLUE 10#! Punktów. Obecnie posiadamy #G [ROOT.Var('gaudi_splendid_architecture').GetValue]#! @gaudi_architectural_splendour! Punktów. Budowa Dzielnic Secesyjnych, Kin w Stylu Art Déco, Wieżowców w Stylu Art Déco, Biur w Stylu Art Déco i Lotnisk w Stylu Art Déco poprzez Wpis w Dzienniku zapewni Ci więcej Punktów."
 je_gaudi_art_nouveau_quarter: "Dzielnica Secesyjna"
 je_gaudi_art_nouveau_quarter_reason: "Pierwsze secesyjne domy i dekoracje wnętrz pojawiły się w Brukseli w latach 90. XIX wieku, w architekturze i wystroju budynków zaprojektowanych przez Paula Hankara, Henry'ego van de Veldego, a przede wszystkim Victora Hortę, którego Hôtel Tassel ukończono w 1893 roku. Styl ten szybko dotarł do Paryża, gdzie został zaadaptowany przez Hectora Guimarda, który zapoznał się z twórczością Horty w Brukseli i zastosował secesyjne wzornictwo przy projektowaniu wejść do nowego paryskiego metra. Z Belgii i Francji secesja rozprzestrzeniła się na pozostałe kraje Europy, przyjmując w każdym z nich odmienne nazwy i cechy charakterystyczne. Często pojawiała się nie tylko w stolicach, lecz także w szybko rozwijających się miastach, które pragnęły wykształcić własną tożsamość artystyczną (Turyn i Palermo we Włoszech, Glasgow w Szkocji, Monachium i Darmstadt w Niemczech), a także w ośrodkach ruchów niepodległościowych (Helsinki w Finlandii, należącej wówczas do Imperium Rosyjskiego, oraz Barcelona w hiszpańskiej Katalonii)."
 je_gaudi_art_deco_cinema: "Kino w Stylu Art Déco"
 je_gaudi_art_deco_cinema_reason: "Wiele z najlepiej zachowanych przykładów architektury art déco stanowią kina wybudowane w latach 20. i 30. XX wieku. Rozkwit art déco zbiegł się z przejściem od kina niemego do dźwiękowego, a wytwórnie filmowe wznosiły w wielkich miastach okazałe kinoteatry, aby przyciągnąć ogromne rzesze widzów. Pałace kinowe lat 20. często łączyły egzotyczne motywy ze stylem art déco. Grauman's Egyptian Theatre w Hollywood (1922) inspirowany był starożytnymi egipskimi grobowcami i piramidami, natomiast Fox Theater w Bakersfield w Kalifornii łączył salę w stylu art déco z wieżą nawiązującą do architektury kalifornijskich misji."
 je_gaudi_art_deco_skyscraper: "Wieżowiec w Stylu Art Déco"
 je_gaudi_art_deco_skyscraper_reason: "Wieżowce są dzwonnicami współczesności. Czym jednak byłaby dzwonnica bez charakterystycznego dźwięku dzwonów? Nadanie wieżowcowi stylu art déco byłoby prestiżowym przedsięwzięciem, które wzbudziłoby podziw na całym świecie."
 je_gaudi_art_deco_airport: "Art Deco Airport"
 je_gaudi_art_deco_airport_reason: "Niegdyś karawele otworzyły Europejczykom drogę na oceany i połączyły kontynenty Starego Świata z Nowym. Teraz, gdy nadeszła era lotnictwa, otwierają się granice, które dotąd wydawały się nieprzekraczalne. Jaki styl mógłby lepiej pasować do portów przyjmujących nowe latające statki niż luksusowe i zdobywające coraz większą popularność art déco? Lotnicy, powitajcie słońce!"
 je_gaudi_art_deco_office: "Biuro w Stylu Art Déco"
 je_gaudi_art_deco_office_reason: "Styl art déco zdominował świat handlu i przemysł rozrywkowy, jednak również rządy poszczególnych państw pragnęły imponować nowoczesnymi budowlami, które podkreślały dobrobyt kraju i dawały jego mieszkańcom poczucie, że żyją w dynamicznie rozwijającym się państwie."
 je_gaudi_bauhaus: "Bauhaus"
 je_gaudi_bauhaus_reason: "Bauhaus był niemiecką szkołą artystyczną działającą w latach 1919–1933, łączącą rzemiosło ze sztukami pięknymi. Szkoła zasłynęła ze swojego podejścia do projektowania, które dążyło do połączenia indywidualnej wizji artystycznej z zasadami produkcji masowej i naciskiem na funkcjonalność. U podstaw jej filozofii leżała idea stworzenia Gesamtkunstwerk (dzieła sztuki totalnej), w którym wszystkie dziedziny sztuki miały ostatecznie połączyć się w harmonijną całość. Styl Bauhausu stał się później jednym z najbardziej wpływowych nurtów nowoczesnego wzornictwa, architektury modernistycznej oraz edukacji architektonicznej."
 je_gaudi_summer_burn: "Spalenie Pałacu Letniego"
 je_gaudi_summer_burn_reason: "Pałac Letni od pierwszej połowy XVIII wieku stanowił faktyczną siedzibę rodziny cesarskiej dynastii Qing. Jest symbolem potęgi i majestatu Chin. Jego zniszczenie oznaczałoby nie tylko dotkliwe upokorzenie wroga, lecz także stworzyłoby okazję do zdobycia cennych łupów..."
 je_gaudi_summer_burn_success: "Zajmij cały region stołeczny #T Pekin#!."
 je_gaudi_ben_burn: "Spalenie Big Bena"
 je_gaudi_ben_burn_reason: "Po pożarze Pałacu Westminsterskiego Wielka Brytania wzniosła nowy, charakterystyczny gmach parlamentu, podkreślający potęgę Imperium. Może nadszedł czas, by kolejnym pożarem upokorzyć dumnych Brytyjczyków?"
 je_gaudi_ben_burn_success: "Zajmij cały region stołeczny #T Hrabstwa Macierzyste#!."
 je_gaudi_dombau_phase_1: "Katedra Kolońska: Wznowienie Budowy"
 je_gaudi_dombau_phase_1_reason: "Katedra Kolońska jest uważana za najdoskonalszą katedrę gotycką na świecie. Jej budowę rozpoczęto w XIII wieku, a całe przedsięwzięcie miało kolosalne rozmiary. Po ukończeniu prezbiterium prace stopniowo zwalniały, aż w XV wieku zostały całkowicie wstrzymane. Do dziś nad niedokończoną wieżą południową góruje dźwig budowlany z późnego średniowiecza. Wraz z odrodzeniem uczuć narodowych i romantycznych wśród niemieckiego mieszczaństwa, a zwłaszcza po ponownym odkryciu i rozpowszechnieniu oryginalnych planów budowlanych, umacnia się przekonanie, że ukończenie katedry jest nie tylko przedsięwzięciem ku chwale Bożej, lecz także symbolem niemieckiej kultury i jedności narodu niemieckiego."
 je_gaudi_dombau_phase_1_goal: "#E Postęp Budowy#! osiągnie #BLUE 120#! Punktów. Obecnie posiadamy #G [GetGlobalVariable('gaudi_dombau_progress').GetValue]#! Punktów. Zazwyczaj otrzymujemy jeden Punkt miesięcznie."
 je_gaudi_dombau_phase_2: "Katedra Kolońska: Fasada Południowa"
 je_gaudi_dombau_phase_2_reason: "Po kilku latach trwania prac budowlanych architekci stanęli przed zadaniem wzniesienia i ozdobienia południowej fasady katedry. Dzięki bogatej dekoracji figuralnej jest ona uznawana nie tylko za szczytowe osiągnięcie niemieckiej rzeźby, lecz także za jedno z najważniejszych dzieł architektury neogotyckiej. Sama budowa fasady trwała trzynaście lat, a jej wykończenie i ozdobienie zajęło kolejnych osiemnaście lat."
 je_gaudi_dombau_phase_2_goal: "#E Postęp Budowy#! osiągnie #BLUE 120#! Punktów. Obecnie posiadamy #G [GetGlobalVariable('gaudi_dombau_progress').GetValue]#! Punktów. Zazwyczaj otrzymujemy jeden Punkt miesięcznie."
 je_gaudi_dombau_phase_3: "Katedra Kolońska: Konstrukcja Dachu"
 je_gaudi_dombau_phase_3_reason: "Projekt Katedry Kolońskiej, oparty na gotyckim ideale, nie przeszkodził budowniczym w wykorzystaniu najnowocześniejszych materiałów budowlanych tamtych czasów. Konstrukcję dachu wykonano z żelaza, dzięki czemu aż do wzniesienia Wieży Eiffla była ona największą konstrukcją żelazno-stalową na świecie. Dzięki tej decyzji konstrukcja przetrwała nawet bombardowania aliantów podczas II wojny światowej."
 je_gaudi_dombau_phase_3_goal: "#E Postęp Budowy#! osiągnie #BLUE 120#! Punktów. Obecnie posiadamy #G [GetGlobalVariable('gaudi_dombau_progress').GetValue]#! Punktów. Zazwyczaj otrzymujemy jeden Punkt miesięcznie."
 je_gaudi_dombau_phase_4: "Katedra Kolońska: Fasada Zachodnia i Wieże"
 je_gaudi_dombau_phase_4_reason: "Zachodnia fasada katedry jest największą fasadą kościelną, jaką kiedykolwiek wzniesiono. W najdrobniejszych szczegółach nawiązuje do średniowiecznego projektu opracowanego przez mistrza budowlanego Michaela von Savoyena, utrwalonego w 1370 roku na tak zwanym planie fasady F. Charakterystycznym elementem sylwetki Katedry Kolońskiej jest dwuwieżowa fasada z dwiema strzelistymi iglicami. Mistrz Michael zaprojektował ośmioboczną, całkowicie ażurową iglicę o maswerkowej konstrukcji, zwieńczoną wielostopniowym kwiatonem. Dzięki tym rozwiązaniom, sięgającym granic ówczesnych możliwości technicznych, gotyccy architekci pragnęli podkreślić, że budowla miała być „monumentalnym relikwiarzem”, w którego wnętrzu spoczywają relikwie Trzech Króli."
 je_gaudi_dombau_phase_4_goal: "#E Postęp Budowy#! osiągnie #BLUE 120#! Punktów. Obecnie posiadamy #G [GetGlobalVariable('gaudi_dombau_progress').GetValue]#! Punktów. Zazwyczaj otrzymujemy jeden Punkt miesięcznie."
 je_gaudi_gotthard_survey: "Kolej Gotthardzka: Planowanie i Pomiary Geodezyjne"
 je_gaudi_gotthard_survey_reason: "W XIX wieku Szwajcarii groziło ominięcie przez międzynarodowe szlaki kolejowe, co oznaczałoby nie tylko pozostanie w tyle za rozwojem nowoczesnego transportu, lecz także utratę szans na uczestnictwo w rewolucji przemysłowej. Wraz z otwarciem linii kolejowej przez Przełęcz Brenner zagrożenie to nabrało nowego wymiaru. Ze względów geograficznych Szwajcaria mierzyła się z większymi trudnościami niż Austria: przeprowadzenie linii kolejowej przez Przełęcz Brenner było znacznie łatwiejsze niż przez alternatywne szlaki szwajcarskie. Budowę kolei alpejskiej w Szwajcarii poprzedziły dziesięciolecia dyskusji nad przebiegiem trasy i finansowaniem takiego przedsięwzięcia. Kluczową rolę w wyborze trasy przez Przełęcz Świętego Gotarda odegrał zuryski polityk i przedsiębiorca Alfred Escher."
 je_gaudi_gotthard_survey_goal: "#E Postęp Planowania#! osiągnie #BLUE 60#! Punktów. Obecnie posiadamy #G [GetGlobalVariable('gaudi_gotthard_progress').GetValue]#! Punktów. Zazwyczaj otrzymujemy jeden Punkt miesięcznie."
 je_gaudi_gotthard_construction: "Kolej Gotthardzka: Budowa"
 je_gaudi_gotthard_construction_reason: "Budowa Kolei Gotthardzkiej jest uznawana za jedno z największych przedsięwzięć budowlanych XIX wieku, porównywane pod względem skali i trudności technicznych do budowy Kanału Sueskiego. Od samego początku najważniejszym i najbardziej ambitnym elementem projektu było wydrążenie tunelu przez masyw Świętego Gotarda. W chwili otwarcia w 1882 roku tunel Gotthardzki, liczący 15 kilometrów długości, był najdłuższym tunelem na świecie. Kolejnym elementem tej ambitnej trasy jest około stu małych i dużych mostów, wykonanych głównie z żelaza i stali. Linia ta nie tylko łączy północną i południową Europę, lecz także stanowi symbol jedności Szwajcarii."
 je_gaudi_gotthard_construction_goal: "#E Postęp Budowy#! osiągnie #BLUE 120#! Punktów. Obecnie posiadamy #G [GetGlobalVariable('gaudi_gotthard_progress').GetValue]#! Punktów. Zazwyczaj otrzymujemy jeden Punkt miesięcznie."
 je_gaudi_gotthard_discontent: "Kolej Gotthardzka: Niezadowolenie Robotników"
 je_gaudi_gotthard_discontent_reason: "Warunki pracy podczas budowy Kolei Gotthardzkiej były ciężkie nawet jak na ówczesne standardy. Robotnicy w większości pochodzili z zagranicy, głównie z ubogich dolin alpejskich północnych Włoch, i w praktyce byli pozbawieni wszelkich praw. Szczególnie prace przy drążeniu tunelu Gotthardzkiego uważano za niebezpieczne dla życia i słabo wynagradzane. Wielokrotnie prowadziło to do sporów z kierownictwem budowy, które w pewnym momencie zagroziły nawet realizacji całego przedsięwzięcia."
 je_gaudi_gotthard_discontent_goal: "Jeśli #E Niezadowolenie Robotników#! osiągnie maksymalną wartość #BLUE 10#! Punktów, może wybuchnąć strajk! Obecnie wartość ta wynosi #R [GetGlobalVariable('gaudi_gotthard_discontent').GetValue]#! Punktów."
 je_gaudi_cristo: "Cristo Redentor: Budowa"
 je_gaudi_cristo_reason: "W połowie lat 50. XIX wieku lazarysta Pedro Maria Boss jako pierwszy zaproponował wzniesienie chrześcijańskiego pomnika na górze Corcovado ku czci księżniczki Izabeli, regentki Brazylii i córki cesarza Piotra II, jednak projekt nie uzyskał aprobaty. W 1920 roku Koło Katolickie w Rio de Janeiro przedstawiło drugą propozycję wzniesienia na górze monumentalnego posągu. Pomnik zaprojektowali miejscowy inżynier Heitor da Silva Costa oraz artysta Carlos Oswald. Jego wykonaniem zajął się francuski rzeźbiarz Paul Landowski. Posąg w stylu art déco zyskał później światową sławę, stając się obok Głowy Cukru jednym z symboli Rio de Janeiro."
 je_gaudi_cristo_goal: "#E Postęp Budowy#! osiągnie #BLUE 120#! Punktów. Obecnie posiadamy #G [GetGlobalVariable('gaudi_cristo_progress').GetValue]#! Punktów. Zazwyczaj otrzymujemy jeden Punkt miesięcznie."
 je_gaudi_mole_phase_1: "Mole Antonelliana: Od Synagogi do Symbolu Narodowego"
 je_gaudi_mole_phase_1_reason: "Mole Antonelliana to budowla o charakterze pawilonowym, zwieńczona wysoką, ostro zwężającą się ku górze nadbudową, zaprojektowana przez turyńskiego architekta Alessandra Antonellego. Jej budowę rozpoczęto jako synagogę na zlecenie społeczności żydowskiej, jednak nadmierne ambicje architekta sprawiły, że przedsięwzięcie znacznie wykroczyło poza pierwotne plany. Koszty gwałtownie rosły, a ukończenie budowli opóźniało się o kolejne lata. Pomimo usilnych starań społeczność żydowska ostatecznie nie była w stanie zebrać dalszych funduszy. Mieszkańcy Turynu opowiedzieli się jednak za przejęciem projektu przez władze lokalne, aby ukończyć budowlę, która już w stanie surowym robiła ogromne wrażenie, i poświęcić ją idei zjednoczenia Włoch."
 je_gaudi_mole_phase_1_goal: "#E Postęp Budowy#! osiągnie #BLUE 120#! Punktów. Obecnie posiadamy #G [GetGlobalVariable('gaudi_mole_progress').GetValue]#! Punktów. Zazwyczaj otrzymujemy jeden Punkt miesięcznie."
 je_gaudi_mole_phase_2: "Mole Antonelliana: Latarnia i Iglica"
 je_gaudi_mole_phase_2_reason: "Antonelli nieustannie wprowadzał zmiany w projekcie swojej budowli, między innymi dodając tak zwane „tempietto”, czyli neoklasyczną, dwukondygnacyjną sześcioboczną kolumnadę na kwadratowej podstawie, nawiązującą do klasycznej formy pronaosu. Pierwotnie Antonelli zamierzał zwieńczyć iglicę pięcioramienną gwiazdą, jednak później zdecydował się na posąg przedstawiający uskrzydlonego geniusza, zwanego „genio alato”. Wykonanie posągu powierzono rzeźbiarzowi Fumagallemu kilka miesięcy po śmierci Antonellego. Projekt przewidywał wykonanie postaci geniusza z tłoczonej i pozłacanej miedzi, trzymającej w jednej ręce włócznię, a w drugiej gałązkę palmową. Na jego głowie miała znajdować się niewielka pięcioramienna gwiazda osadzona na pręcie. Gdy 10 kwietnia 1889 roku umieszczono gwiazdę na swoim miejscu, całkowita wysokość Mole Antonelliana osiągnęła 167,5 metra (550 stóp), co uczyniło ją wówczas najwyższą ceglaną budowlą w Europie."
 je_gaudi_mole_phase_2_goal: "#E Postęp Budowy#! osiągnie #BLUE 120#! Punktów. Obecnie posiadamy #G [GetGlobalVariable('gaudi_mole_progress').GetValue]#! Punktów. Zazwyczaj otrzymujemy jeden Punkt miesięcznie."
 je_gaudi_ringstrasse_phase_1: "Wiedeńska Ringstrasse: Władca Ringstrasse"
 je_gaudi_ringstrasse_phase_1_reason: "Wiedeńska Ringstrasse powstała po rozebraniu murów miejskich w połowie XIX wieku. Od lat 60. do 90. XIX wieku wzdłuż Ringstrasse wzniesiono wiele okazałych budynków użyteczności publicznej w eklektycznym stylu historyzmu, nazywanym niekiedy Ringstraßenstil („stylem Ringstrasse”), łączącym elementy architektury klasycystycznej, gotyckiej, renesansowej i barokowej. Wzdłuż całej alei powstały liczne budynki publiczne i prywatne. Arystokraci oraz inni zamożni mieszkańcy prześcigali się we wznoszeniu reprezentacyjnych pałaców, zwanych pałacami Ringstrasse, utrzymanych w monumentalnym stylu historyzmu."
 je_gaudi_ringstrasse_phase_1_goal: "#E Postęp Budowy#! osiągnie #BLUE 120#! Punktów. Obecnie posiadamy #G [GetGlobalVariable('gaudi_ringstrasse_progress').GetValue]#! Punktów. Zazwyczaj otrzymujemy jeden Punkt miesięcznie."
 je_gaudi_ringstrasse_phase_2: "Wiedeńska Ringstrasse: Opera Dworska i Nowy Ratusz"
 je_gaudi_ringstrasse_phase_2_reason: "Ringstrasse została uroczyście otwarta zaledwie dziesięć lat po podjęciu decyzji o budowie wspaniałego bulwaru w miejscu rozebranych wiedeńskich bastionów. W tamtym czasie wzdłuż alei wciąż jednak dominowały niezabudowane tereny. Jednym z najważniejszych przedsięwzięć kolejnych lat była budowa nowego, okazałego gmachu opery, który później stał się siedzibą Wiedeńskiej Opery Państwowej. W tym okresie wzniesiono również Nowy Ratusz, a Ringstrasse przekształciła się ze zwykłej alei w nowe centrum Wiednia, zdominowane przez pałace i budynki użyteczności publicznej."
 je_gaudi_ringstrasse_phase_2_goal: "#E Postęp Budowy#! osiągnie #BLUE 120#! Punktów. Obecnie posiadamy #G [GetGlobalVariable('gaudi_ringstrasse_progress').GetValue]#! Punktów. Zazwyczaj otrzymujemy jeden Punkt miesięcznie."
 je_gaudi_ringstrasse_phase_3: "Wiedeńska Ringstrasse: Uniwersytet i Muzea Sztuki"
 je_gaudi_ringstrasse_phase_3_reason: "Ringstrasse stała się już prestiżowym adresem, pożądanym przez przemysłowców, bankierów i arystokrację. Budynki użyteczności publicznej zajmują tu szczególne miejsce, reprezentując państwo w sposób godny podziwu pod względem estetycznym. Do ukończenia całego przedsięwzięcia niezbędny jest jednak ostatni etap budowy, w którym główny nacisk należy położyć na wzniesienie nowego gmachu uniwersytetu oraz utworzenie muzeów sztuki."
