 gaudi.1321.t: "Opracowano Nowe Umocnienia Polowe"
 gaudi.1321.d: "Nasz [concept_tesla_military_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] przez lata pracował nad opracowaniem nowych metod budowy umocnień polowych i fortyfikacji dla naszej armii. Teraz nasi żołnierze będą mogli korzystać z zaawansowanych metod budowy umocnień polowych i fortyfikacji, by zapewnić sobie ochronę."
 gaudi.1321.f: "„Gdyby nie szczury i inne robactwo, można by się tu czuć naprawdę bezpiecznie!”"
 gaudi.1321.g: "Silna obrona ocali życie naszych żołnierzy!"
