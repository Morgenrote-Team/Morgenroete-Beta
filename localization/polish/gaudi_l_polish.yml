 je_gaudi_telegraphy_network: "Zbuduj Sieć Telegraficzną"
 je_gaudi_telegraphy_network_reason: "Zasadniczo Urząd Telegraficzny można zbudować tylko tam, gdzie istnieje już linia kolejowa, ponieważ słupy telegraficzne biegną wzdłuż jej trasy i odgrywają istotną rolę w koordynowaniu ruchu pociągów. Otwarcie nowego urzędu zajmuje około roku, przy czym [concept_tesla_engineer] przyspiesza ten proces. Prace kończą się jeszcze szybciej, jeśli jest to [concept_tesla_electrical_engineer]. Odkrycie elektromagnetyzmu również korzystnie wpływa na postępy prac. Jest ono także niezbędne do zakładania Urzędów Telegraficznych na terytoriach zamorskich lub w innych eksklawach. W przeciwnym razie Urząd Telegraficzny można zbudować wyłącznie w regionie graniczącym z innym regionem, w którym taki urząd już istnieje."
 gaudi.1411.t: "Krajowa Sieć Telegraficzna"
 gaudi.1411.d: "Dr. [GetPlayer.MakeScope.GetVariable('tesla_engineer_var').GetCharacter.GetFullName] przedstawił dziś plany nowej linii telegraficznej, która połączy [GetPlayer.GetName]. Zbliży to ludzi do siebie bardziej niż kiedykolwiek wcześniej."
 gaudi.1411.f: "Samuel Morse opracował i opatentował w 1837 roku elektryczny telegraf rejestrujący. Jego asystent Alfred Vail skonstruował urządzenie zwane rejestratorem, służące do zapisywania odbieranych wiadomości. Za pomocą rysika sterowanego elektromagnesem wytłaczało ono kropki i kreski na przesuwającej się taśmie papierowej. Morse i Vail opracowali alfabet sygnałowy znany jako alfabet Morse’a. Pierwszy telegram w Stanach Zjednoczonych Morse wysłał 11 stycznia 1838 roku przewodem o długości dwóch mil (3 km) w zakładach metalurgicznych Speedwell w pobliżu Morristown w stanie New Jersey. Dopiero później, w 1844 roku, przesłał wiadomość „CÓŻ BÓG UCZYNIŁ” na odległość 44 mil (71 km), z Kapitolu w Waszyngtonie do dawnej stacji kolejowej Mount Clare w Baltimore."
 gaudi.1411.g: "..-. .. -. ."
 gaudi.1412.t: "Rozbudowa Sieci Telegraficznej wstrzymana"
 gaudi.1412.d: "Rząd nakazał natychmiastowe wstrzymanie rozbudowy linii telegraficznych."
 gaudi.1412.f: "Dziś wydano następujący rozkaz, w związku z czym od tej chwili wszelkie prace zostają wstrzymane:\n\n-.-. --- -. ... - .-. ..- -.-. - .. --- -. / ... - --- .--. --..-- / -. --- .-- -.-.--"
 gaudi.1412.g: "Na razie kończymy budowę."
 gaudi.1413.t: "Sieć Telegraficzna ukończona"
 gaudi.1413.d: "Dziś na dotychczas niedostępnym obszarze uroczyście ustawiono ostatni słup telegraficzny. Każda miejscowość w naszym kraju jest połączona z krajową siecią telegraficzną, a wiadomości przesyłane są z jednego krańca kraju na drugi."
 gaudi.1413.f: "Objęcie całego kraju jedną siecią telegraficzną to ogromne osiągnięcie. Połączenie z siecią międzynarodową znacznie ożywi wymianę myśli zarówno w kraju, jak i na świecie. Oczywiście to nie koniec: jeśli nasze państwo pozyska nowe obszary, które nie są jeszcze podłączone do sieci, również tam będziemy musieli założyć urzędy telegraficzne. A może pewnego dnia pojawi się sposób przesyłania wiadomości bez użycia linii telegraficznych..."
 gaudi.1413.g: "..-. .- -. - .- ... - .. -.-."
 gaudi.1414.t: "Uniwersytety połączone Telegrafem"
 gaudi.1414.d: "Uniwersytety w regionach [SCOPE.sState('gaudi_university_state_1').GetName] i [SCOPE.sState('gaudi_university_state_2').GetName] są teraz połączone bezpośrednią linią telegraficzną. Naukowcy mają nadzieję, że ożywi to wymianę wiedzy."
 gaudi.1414.f: "„Ze wszystkich cudownych osiągnięć współczesnej nauki telegraf elektryczny jest bezsprzecznie największym i najbardziej użytecznym dla ludzkości … Całą ziemię oplecie prąd elektryczny, pulsujący ludzkimi myślami i uczuciami … Jakże potężną siłą w rozwoju cywilizacji świata ma się zatem stać telegraf! Łączy on życiodajną więzią wszystkie narody ziemi. Nie sposób, by dawne uprzedzenia i wrogość mogły nadal istnieć, skoro powstało takie narzędzie wymiany myśli między wszystkimi narodami ziemi”. -Augustus Maverick"
 gaudi.1414.g: "To wzmocni badania techniczne."
 gaudi.1414.h: "To wzmocni badania przyrodnicze."
 gaudi.1414.i: "To wzmocni badania archeologiczne."
 gaudi.1415.t: "Telegram do Sąsiada"
 gaudi.1415.d: "Stacja telegraficzna w regionie [SCOPE.sState('gaudi_our_telegraph_state').GetName] nawiązała połączenie z sąsiednim regionem [SCOPE.sState('gaudi_neighbour_telegraph_state').GetName]. Możemy teraz wysłać telegram do naszego sąsiada."
 gaudi.1415.f: "Telegrafia może sprzyjać porozumieniu między narodami i poprawie stosunków. Niektóre telegramy jednak temu nie służą."
 gaudi.1415.g: "Wyślijcie przyjazny telegram, by zacieśnić nasze stosunki."
 gaudi.1415.h: "Wyślijcie żartobliwy telegram, by zirytować ich głowę państwa."
 gaudi.1416.t: "Telegram od naszego Sąsiada"
 gaudi.1416.d: "Nasz sąsiad [SCOPE.sCountry('gaudi_telegram_country').GetName] uruchomił linię telegraficzną w sąsiednim regionie i przesłał nam przyjazną wiadomość."
 gaudi.1416.f: "„Za dobrych sąsiadów”."
 gaudi.1416.g: "Telegram? Do mnie? Też powinniśmy jakiś wysłać!"
 gaudi.1417.d: "Dziś nadszedł pierwszy oficjalny telegram z państwa [SCOPE.sCountry('gaudi_telegram_country').GetName]. Najwyraźniej chcą zrobić z nas głupców!"
 gaudi.1417.f: "„[SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('gaudi_ruler').GetFullName] ma pchły”."
 gaudi.1417.g: "Czy to ma być jakiś żartobliwy telegram?"
 gaudi_building_radio_network_modifier: "Stacje Radiowe dla Wszystkich"
 gaudi_radio_network_modifier: "Sieć Stacji Radiowych"
 je_gaudi_radio_network: "Zbuduj Sieć Stacji Radiowych"
 je_gaudi_radio_network_reason: "Stacje radiowe można zakładać w dowolnym miejscu kraju, pod warunkiem że istnieje tam już linia kolejowa - wcześniejsza budowa sieci telegraficznej nie jest konieczna. Budowa nowej stacji radiowej zajmuje około roku, przy czym [concept_tesla_engineer] przyspiesza ten proces. Prace kończą się jeszcze szybciej, jeśli jest to [concept_tesla_electrical_engineer]."
 gaudi.1421.t: "Sieć Radiowa"
 gaudi.1421.d: "Wynalezienie telegrafii bezprzewodowej umożliwia prawdziwe cuda. Od teraz wiadomości można przesyłać z dowolnego miejsca do innego, bez żadnych wież nadawczych, pod warunkiem posiadania odpowiedniego sprzętu technicznego."
 gaudi.1421.f: "W 1897 roku Karl Ferdinand Braun dołączył do grona pionierów łączności bezprzewodowej. Do jego najważniejszych osiągnięć należały wprowadzenie zamkniętego obwodu rezonansowego w części nadajnika wytwarzającej drgania, oddzielenie go od części promieniującej (anteny) za pomocą sprzężenia indukcyjnego, a później także wykorzystanie kryształów do odbioru sygnałów. W 1898 roku telegrafia bezprzewodowa całkowicie pochłonęła uwagę Dr. Brauna, który przez wiele kolejnych lat poświęcał się niemal wyłącznie rozwiązywaniu związanych z nią problemów. Dr. Braun wiele pisał o łączności bezprzewodowej i był dobrze znany dzięki licznym artykułom w czasopiśmie „Electrician” oraz innych periodykach naukowych. W 1899 roku miał złożyć wniosek patentowy dotyczący bezprzewodowego przesyłania sygnałów elektrycznych ponad powierzchniami."
 gaudi.1421.g: "Antena w każdej miejscowości!"
 gaudi.1422.t: "Rozbudowa Sieci Radiowej wstrzymana"
 gaudi.1422.d: "Prace nad budową nowych anten i stacji radiowych zostały na razie wstrzymane. Można je wznowić w dowolnym momencie z pomocą [concept_tesla_electrical_engineer]."
 gaudi.1422.f: "„Czy przysłużyłem się światu, czy sprowadziłem na niego nowe zagrożenie?” -Guglielmo Marconi"
 gaudi.1422.g: "Na razie kończymy budowę."
 gaudi.1423.t: "Sieć Radiowa ukończona"
 gaudi.1423.d: "Fizycy i inżynierowie z państwa [GetPlayer.GetName] z dumą ogłaszają, że objęli już zasięgiem cały kraj - bezprzewodowo!"
 gaudi.1423.f: "„Największą trudność sprawiało mi to, że pomysł był tak prosty i logiczny, iż trudno było uwierzyć, że nikt inny nie pomyślał o wprowadzeniu go w życie”. -Guglielmo Marconi"
 gaudi.1423.g: "Słuchaj Radia!"
 gaudi.1424.t: "Pierwsza Audycja Radiowa"
 gaudi.1424.d: "Emisja pierwszej prywatnej audycji radiowej w regionie [SCOPE.sState('gaudi_radio_state').GetName] doprowadziła do gwałtownego wzrostu zainteresowania tym nowym medium. Pobliska fabryka przygotowuje się na tę sytuację i zwiększyła wydajność produkcji, by sprostać ewentualnemu napływowi klientów."
 gaudi.1424.f: "W 1909 roku pierwsza na świecie stacja informacyjna rozpoczęła regularne nadawanie z mocą 14 watów. Stację w San José w Kalifornii stworzyli fizyk Charles „Doc” Herrold i studenci jego szkoły łączności bezprzewodowej i inżynierii. W 1921 roku stacja, działająca już komercyjnie, otrzymała znak wywoławczy KQW, a później została przejęta przez CBS."
 gaudi.1424.g: "Radio w każdym domu?"
 gaudi.1425.t: "Agitacja Radiowa"
 gaudi.1425.d: "Polityka i propaganda również zmieniają się wraz z rozwojem technologii. [SCOPE.sCharacter('gaudi_opposition_leader').GetFullName] uruchomił własną niewielką stację radiową, której zwolennicy partii słuchają każdego dnia. Audycje trafiają nawet do osób dotychczas niezainteresowanych polityką."
 gaudi.1425.f: "„Dzieeeń dobry, drodzy słuchacze. Oto poranne ogłoszenia. Nabór do drużyny piłkarskiej odbędzie się w piątek po południu. Oczywiście pod warunkiem, że nasz [SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle] zrobi coś z naszym fatalnym boiskiem. Mam pytanie. Co właściwie robi [SCOPE.sCharacter('gaudi_ruler').GetFullName]? Podobno nosi tytuł [SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle], prawda? Jakie ma plany? Okłamuje wszystkich? A może nie? Zadawajmy te pytania. Poza tym, kto właściwie głosował na osobę o nazwisku [SCOPE.sCharacter('gaudi_ruler').GetFullName]? Wiem, że ja nie. A każdy, kto to zrobił, drapie się teraz po głowie i mówi: «Ups. Chyba nie powinienem był tego robić». Nie zasiadam w rządzie, jestem zwykłym człowiekiem, tak jak wy wszyscy. I tak jak wy wszyscy chcę wiedzieć, co się stało... z moim krajem”."
 gaudi.1425.g: "Zakażcie działalności tej stacji radiowej!"
 gaudi.1425.h: "To wolny kraj, więc możecie swobodnie nadawać."
 gaudi.1426.t: "Niepokojące Słuchowisko Radiowe"
 gaudi.1426.d: "Jedno z pierwszych słuchowisk radiowych wywołało masową panikę wśród nieświadomych słuchaczy, którzy uznali fikcyjną opowieść za część serwisu informacyjnego."
 gaudi.1426.f: "„Mówi Orson Welles, panie i panowie, już poza rolą, by zapewnić was, że Wojna światów nie ma żadnego głębszego znaczenia poza zamierzoną świąteczną rozrywką; to radiowy odpowiednik przebrania się w prześcieradło, wyskoczenia zza krzaka i zawołania «Buu!» w wykonaniu Mercury Theatre. Gdybyśmy zaczęli teraz, nie zdążylibyśmy do jutrzejszego wieczoru wysmarować mydłem wszystkich waszych okien i ukraść wszystkich furtek z waszych ogrodów, więc zrobiliśmy coś w zamian. Unicestwiliśmy świat na waszych własnych uszach i doszczętnie zniszczyliśmy CBS. Mam nadzieję, że z ulgą przyjmiecie wiadomość, iż nie zrobiliśmy tego naprawdę i obie te instytucje nadal działają. Żegnamy więc wszystkich i prosimy, byście przez najbliższy dzień lub dwa pamiętali straszliwą lekcję dzisiejszego wieczoru. Ten uśmiechnięty, świecący, kulisty najeźdźca w waszym salonie pochodzi z dyniowej grządki, a jeśli zadzwoni dzwonek do drzwi i nikogo za nimi nie będzie, to nie Marsjanin, lecz Halloween”. -Orson Welles"
 gaudi.1426.g: "Inwazja kosmitów? I ludzie w to uwierzyli?"
 gaudi.1426.h: "Dobrze, że byliśmy przygotowani!"
 gaudi.1420.t: "Kabel Transatlantycki"
 gaudi.1420.d: "Kabel transatlantycki łączy teraz Nową Fundlandię z Irlandią. Między kontynentami wymieniono już pierwszą wiadomość."
 gaudi.1420.f: "„Jest to triumf wspanialszy, ponieważ przynoszący ludzkości znacznie większy pożytek, niż jakiekolwiek zwycięstwo odniesione przez zdobywcę na polu bitwy. Niech telegraf atlantycki, z błogosławieństwem Niebios, stanie się więzią wiecznego pokoju i przyjaźni między bratnimi narodami oraz narzędziem, któremu Opatrzność Boża przeznaczyła szerzenie religii, cywilizacji, wolności i prawa na całym świecie”. – James Buchanan"
 gaudi.1420.g: ".... . .-.. .-.. --- -.-.--"
 gaudi.1430.t: "Transmisja Transatlantycka"
 gaudi.1430.d: "Wielki sukces na drodze postępu ludzkości: dziś po raz pierwszy przesłano wiadomość bezprzewodowo przez Atlantyk!"
 gaudi.1430.f: "-s-"
 gaudi.1430.g: "I to naprawdę działa? Wiadomości przesyłane przez powietrze?"
 je_gaudi_transatlantic_cable: "Kabel Transatlantycki"
 je_gaudi_transatlantic_cable_reason: "Utworzenie stacji telegraficznych po obu stronach Atlantyku umożliwia ułożenie podmorskiego kabla telegraficznego, który zbliży Europę i Amerykę."
 je_gaudi_transatlantic_radio: "Transmisja Transatlantycka"
 je_gaudi_transatlantic_radio_reason: "Brzmi to jak magia, ale dzięki najnowocześniejszej technologii znacznie łatwiej jest przesyłać wiadomości przez Atlantyk bez użycia kabli telegraficznych. Rozwiązałoby to problem ciągłego zrywania się kabli i wynikających z tego zakłóceń łączności."
