 gaudi.1161.t: "Nowa Mapa Topograficzna [GetPlayer.GetName]"
 gaudi.1161.d: "Nasz [concept_tesla_civil_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] ukończył starannie opracowaną mapę topograficzną państwa [GetPlayer.GetName]. Mapa ta pomoże naszym Inżynierom w budowie nowej infrastruktury i budynków. Ponadto zapewnia dobry obraz ukształtowania terenu państwa [GetPlayer.GetNameNoFormatting]."
 gaudi.1161.f: "„To fantastyczne! Nie wiedziałem, że mieszkam tak blisko sąsiedniego miasta. Nawet moja szopa ogrodowa jest na mapie!”"
 gaudi.1161.g: "Widzę swój dom!"
