 advanced_weapons: "Zaawansowana Broń"
 mobilization_option_advanced_weapons_1: "Zaawansowane Karabiny Poziomu 1"
 mobilization_option_advanced_weapons_1_desc: "Zaawansowana broń opracowana przez twojego [concept_tesla_military_engineer] jest potężna.\n#V Uwaga:#! Tę opcję mobilizacji można aktywować dopiero po opracowaniu nowej broni przez twojego Inżyniera."
