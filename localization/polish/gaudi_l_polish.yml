 gaudi.1101.t: "Nowoczesne Drogi [GetPlayer.GetName]"
 gaudi.1101.d: "Nasz [concept_tesla_civil_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] ukończył wreszcie projekt modernizacji dróg w państwie [GetPlayer.GetNameNoFormatting]. Nasze drogi uchodzą teraz za najnowocześniejsze na całym świecie. Przyczyni się to do rozwoju handlu i podróży w naszym kraju."
 gaudi.1101.f: "„Pamiętam czasy, gdy nie mieliśmy nawet dróg. Każdego dnia musieliśmy sami przecierać szlaki przez gęste lasy! Wy, młodzi, macie tak łatwo! Rząd zapewnia wam wszystko, czego potrzebujecie! W ogóle nie musicie już pracować!”"
 gaudi.1101.g: "Teraz wreszcie możemy podróżować bez tych wszystkich wybojów!"
 je_gaudi_bridge_project: "Nowe Mosty"
 gaudi_states_with_bridges_tt: "Wszystkie [GetPlayer.GetAdjective] regiony mają $gaudi_new_bridge_modifier_with_tooltip$ [concept_modifier] (obecnie [GetPlayer.MakeScope.GetVariable('gaudi_num_states_bridge_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('tesla_num_states_var').GetValue|V0])."
 gaudi.1121.t: "Mosty [GetPlayer.GetName]"
 gaudi.1121.d: "Nasz [concept_tesla_civil_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] ukończył wreszcie projekt budowy Mostów w ważnych miejscach w państwie [GetPlayer.GetNameNoFormatting]. Teraz, gdy mosty te łączą niegdyś odległe od siebie miejsca, możemy spodziewać się ożywienia handlu i wzrostu ruchu podróżnych."
 gaudi.1121.f: "„Mosty? Komu potrzebne są mosty. Za moich młodych lat przepływaliśmy rzeki wpław! Ci młodzi pewnie już nawet nie potrafią pływać! Co się stanie z naszą cywilizacją!”"
 gaudi.1121.g: "Trzeba przejść przez siedem mostów!"
 je_gaudi_tunnel_project: "Nowe Tunele"
 gaudi_states_with_tunnels_tt: "Wszystkie [GetPlayer.GetAdjective] regiony mają $gaudi_new_tunnel_modifier_with_tooltip$ [concept_modifier] (obecnie [GetPlayer.MakeScope.GetVariable('gaudi_num_states_tunnel_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('tesla_num_states_var').GetValue|V0])."
 gaudi.1131.t: "Tunele [GetPlayer.GetName]"
 gaudi.1131.d: "Nasz [concept_tesla_civil_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] ukończył wreszcie projekt budowy kilku nowych tuneli przez wzgórza i góry w państwie [GetPlayer.GetNameNoFormatting]. Teraz, gdy tunele te ułatwiają podróżowanie i transport, możemy spodziewać się korzystnych skutków dla naszego przemysłu."
 gaudi.1131.f: "„Jestem krasnoludem i kopię dół! Kopię, kopię dół, kopię sobie dół!”"
 gaudi.1131.g: "Znaleźliście może jakieś złoto?"
 je_gaudi_railway_project: "Modernizacja Linii Kolejowych"
 gaudi_states_with_modernized_railway_tt: "Wszystkie [GetPlayer.GetAdjective] regiony mają $tesla_modernized_railway_lines_building_modifier_with_tooltip$ [concept_modifier] (obecnie [GetPlayer.MakeScope.GetVariable('gaudi_num_states_modernized_railway_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('tesla_num_states_var').GetValue|V0])."
 gaudi.1141.t: "Nowoczesne Linie Kolejowe [GetPlayer.GetName]"
 gaudi.1141.d: "Nasz [concept_tesla_civil_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] ukończył wreszcie projekt modernizacji infrastruktury kolejowej w państwie [GetPlayer.GetNameNoFormatting]. Nasze linie kolejowe należą teraz do najnowocześniejszych na świecie, więc z pewnością wzrośnie ruch na naszej sieci kolejowej."
 gaudi.1141.f: "„Te nowe linie kolejowe mają wszystko, czego potrzeba! Nie zdziwiłbym się nawet, gdyby rozjazdy były ogrzewane!”"
 gaudi.1141.g: "Ciuch! Ciuch!"
 je_gaudi_construction_sector_project: "Modernizacja Sektorów Budowlanych"
 gaudi.1151.f: "„No więc budowałem ten mur, kiedy przyszedł jakiś mężczyzna w eleganckim garniturze. Powiedział mi, że mogę zaoszczędzić na materiałach, jeśli zastosuję wymyślony przez niego sposób. I proszę, naprawdę zadziałało! Nie wiedziałem, że te białe kołnierzyki naprawdę coś potrafią!”"
 gaudi.1151.g: "Sprawniejsza budowa to więcej fabryk!"
