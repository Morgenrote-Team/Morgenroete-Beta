 gaudi_eiffel_phase_1_decision: "Wieża Eiffla"
 gaudi_eiffel_phase_1_decision_desc: "Możliwości techniczne, jakie przyniosła industrializacja, zrodziły pomysły wznoszenia wysokich budowli. Zwłaszcza wieże odzwierciedlały ducha epoki. 1 maja 1886 roku minister handlu Édouard Lockroy ogłosił konkurs na koncepcje budowli paryskiej wystawy światowej, skierowany do francuskich architektów i inżynierów. Wzięło w nim udział około 100 uczestników, z których wielu zaproponowało konstrukcję wieżową. Po wstępnej selekcji pozostały trzy projekty, w tym propozycja Eiffla oraz projekty Ferdinanda Duterta i Jeana Camille’a Formigégo. Eiffel zlecił ponowne przepracowanie bogato zdobionej wersji Sauvestre’a, zachowując część elementów dekoracyjnych, i wygrał konkurs tą kompromisową propozycją."
 gaudi_liberty_phase_1_decision: "Statua Wolności"
 gaudi_liberty_phase_1_decision_desc: "Rzeźbiarz Frédéric-Auguste Bartholdi zaproponował wzniesienie Statuy Wolności jako znaku braterstwa między narodami francuskim i amerykańskim oraz upamiętnienia wspólnej walki w wojnie o niepodległość i o ideały oświecenia. Miała ona stać się symbolem wolnej i demokratycznej Ameryki. Obchody stulecia niepodległości USA w 1876 roku nadały tej idei nowy impet."
 gaudi_ben_phase_1_decision: "Godna siedziba Parlamentu"
 gaudi_ben_phase_1_decision_desc: "16 października 1834 roku niszczycielski pożar strawił większą część Pałacu Westminsterskiego. Ministerstwo skarbu postanowiło spalić drewniane kije karbowe, które stały się zbędne po reformie podatkowej z 1826 roku. Dwa wozy tego drewna spalono w dwóch piecach, co doprowadziło do wybuchu pożaru w sali obrad Izby Lordów. Zniszczenia uniknęły jedynie Westminster Hall, Wieża Klejnotów, krypta kaplicy św. Szczepana i krużganki. W czerwcu 1835 roku komisja zdecydowała, że pałac należy odbudować w tym samym miejscu, w stylu gotyckim lub Tudorów. W 1836 roku, po rozpatrzeniu 97 projektów konkursowych, wybrano plan Charlesa Barry’ego, przewidujący odbudowę w stylu gotyckim."
 gaudi_ben_phase_2_decision: "Charakterystyczny Dzwon"
 gaudi_ben_phase_2_decision_desc: "Nazwa Big Ben odnosi się do najcięższego z pięciu dzwonów słynnej wieży zegarowej Pałacu Westminsterskiego w Londynie, ważącego 13,5 tony. Wieża ma 96,3 metra wysokości. Jej dolne 61 metrów wykonano z cegły z wapienną okładziną, a górną część z żeliwa. Charles Barry, architekt Pałacu Westminsterskiego, zlecił zaprojektowanie wieży Augustusowi Puginowi. Mechanizm zegarowy opracowali w 1848 roku Sir George Airy i Edmund Denison, a wykonał go zegarmistrz Edward John Dent. Każda z czterech tarcz ma siedem metrów średnicy. Pod każdą z nich widnieje łacińska inskrypcja „Domine salvam fac reginam nostram Victoriam primam” (Boże, zachowaj naszą królową Wiktorię Pierwszą)."
