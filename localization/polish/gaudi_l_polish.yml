 alert_gaudi_architect_will_retire_soon_alert_action: "$mr_alert_send_to_arts_artists$"
 gaudi.1451.t: "The modern Saw Mills of [GetPlayer.GetName]"
 gaudi.1451.d: "Our [concept_tesla_electrical_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] has spent a long time designing the electric saws in our country to be as energy-efficient as possible. \n\nTotal improved buildings: [GetPlayer.MakeScope.Var('mr_num_improved_saw_mills_buildings_var').GetValue|V0]"
 gaudi.1451.f: "\"These saws are now more cost-effective and efficient than ever. They're so efficient that some people with no technical background might even think they're a perpetual motion machine.\""
 gaudi.1451.g: "Spiczasto i energooszczędnie!"
 gaudi.1461.t: "Nowoczesna Sieć Elektroenergetyczna [GetPlayer.GetName]"
 gaudi.1461.d: "Nasz [concept_tesla_electrical_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] od dawna pracuje nad ogólnokrajową siecią elektroenergetyczną, przyspieszając budowę podstacji w szczególnie ważnych regionach. \n\nŁączna liczba ulepszonych budynków: [GetPlayer.MakeScope.Var('mr_num_improved_power_grid_buildings_var').GetValue|V0]"
 gaudi.1461.f: "„Mam nadzieję, że nie zaplątałem się w tę plątaninę kabli”."
 gaudi.1461.g: "Niech żyją podstacje! Wiwat, wiwat, wiwat!"
 gaudi_blueprint_research_cost_modifier: "Koszt Badań nad Schematami"