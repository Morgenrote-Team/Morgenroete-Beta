 gaudi.1002.d: "[SCOPE.sCharacter('gaudi_new_architect_scope').GetFullName] ukończył budowę Pawilonów Güella, stanowiących rozbudowę wiejskiej posiadłości w stylu Modernizmu, którego głównym przedstawicielem jest [SCOPE.sCharacter('gaudi_new_architect_scope').GetLastName]."
 gaudi.1002.f: "Żelazną Bramę Pawilonów Güella wieńczył żelazny smok o szklanych oczach. Wszystkie budynki zaprojektowano w stylu Modernisme, z inspiracjami orientalistycznymi.\n\n[SCOPE.sCharacter('gaudi_new_architect_scope').GetLastName] był najważniejszym przedstawicielem katalońskiego stylu Modernisme. Modernisme można uznać za katalońską odmianę secesji, wykorzystującą tradycyjne katalońskie materiały i techniki. „Naturalność” i „Ruch” to najważniejsze pojęcia opisujące Modernisme. Dobrze widać to na przykładzie Parku Güella, który wyróżnia się zaokrąglonymi kształtami i czerpie inspirację z roślin oraz innych form natury."
 gaudi.1002.h: "Gaudí ma przed sobą wspaniałą przyszłość!"
 gaudi_bauhaus_modifier: "Architektura Bauhausu"
 gaudi.21.t: "Powrót Architekta"
 gaudi.21.d: "Po dwóch latach za granicą nasz architekt powraca—nie tylko ze szkicami, lecz także z nową dyscypliną."
 gaudi.21.f: "[ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U] wyjechał jako kreślarz. [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U] wraca jako budowniczy.\n\nPrzez dwa długie lata [ROOT.Var('gaudi_architect_var').GetCharacter.GetFullName] przemierzał Europę—przez doliny Lombardii, huty Manchesteru i pod mostami Budapesztu. [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U] studiował nie tylko kościoły, lecz także przepompownie; nie tylko kapitele i gzymsy, lecz także kotłownie i nabrzeża wyposażone w dźwigi. [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U] uczęszczał na wykłady na politechnice, przepisywał notatniki inżynierów i na placu budowy w Lyonie nauczył się, że wytrzymałości nie da się narysować—trzeba ją zrozumieć.\n\n[ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U] posługuje się teraz nowymi słowami. Mówi o siłach przenoszących obciążenia, szkieletach poddanych rozciąganiu i duszy żelaza. Niektórzy z [ROOT.Var('gaudi_architect_var').GetCharacter.GetHerHis] dawnych kolegów ledwie rozpoznają [ROOT.Var('gaudi_architect_var').GetCharacter.GetHerHim]. A jednak [ROOT.Var('gaudi_architect_var').GetCharacter.GetHerHis] dłonie pozostały takie same—tylko pewniejsze. A [ROOT.Var('gaudi_architect_var').GetCharacter.GetHerHis] spojrzenie? Zdaje się przenikać ściany."
 gaudi.21.g: "Architektura zaczyna się od pytania: co wytrzyma?"
