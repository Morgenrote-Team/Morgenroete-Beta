 gaudi.801.t: "Rozpoczyna się budowa Palacio de Bellas Artes"
 gaudi.801.d: "Po wyburzeniu Teatru Narodowego jest już wystarczająco dużo miejsca, by wzbogacić miasto Meksyk o wielki pałac poświęcony w całości kulturze. [SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('gaudi_ruler').GetFullName] dokonał dziś uroczystego rozpoczęcia budowy."
 gaudi.801.f: "Najstarszą znaną budowlą w tym miejscu był klasztor Santa Isabel, którego kościół wzniesiono w 1680 roku. Część tego kompleksu przy zaułku Santa Isabel wyburzono w drugiej połowie XIX wieku i zastąpiono Teatrem Narodowym. Pod koniec XIX i na samym początku XX wieku teatr ten był głównym ośrodkiem kultury wysokiej w mieście Meksyk, oferując spektakle teatralne, operetki, tańce wiedeńskie i inne widowiska. Następnie postanowiono zastąpić go bardziej okazałym gmachem z myślą o zbliżających się obchodach stulecia niepodległości Meksyku w 1910 roku. Stary teatr wyburzono w 1901 roku, a nowy miał nosić nazwę Gran Teatro de Ópera."
 gaudi.801.g: "Meksyk stanie się kulturową potęgą najwyższej rangi!"
 gaudi.802.t: "Palacio de Bellas Artes: Pierwszy Etap ukończony"
 gaudi.802.d: "Szkielet Palacio de Bellas Artes wznosi się już ponad dachami miasta Meksyk. Mieszkańcy już teraz przeczuwają, że na ich oczach powstaje arcydzieło."
 gaudi.802.f: "Adamo Boari połączył w swoich projektach różne style epoki, wśród których dominowały styl belle époque oraz motywy neoklasycystyczne i przedhiszpańskie. Fasadę pałacu wykonano z białego marmuru, a wnętrza wyłożono marmurem w różnych kolorach. Z tego powodu budowla ma tak ogromny ciężar, że pałac znajduje się obecnie kilka metrów poniżej poziomu otaczających go ulic."
 gaudi.802.g: "Kiedy rozpocznie się przedsprzedaż biletów?"
 gaudi.803.t: "Budowa Palacio de Bellas Artes trwa"
 gaudi.803.d: "Budynek jest już w znacznej mierze ukończony, lecz obok dalszych prac budowlanych rozpoczynają się teraz kunsztowne prace nad bogatym wystrojem wnętrz."
 gaudi.803.f: "Ściany pałacu zdobią dzieła wielu znanych muralistów, w tym malowidła José Clemente Orozca, Diega Rivery i Davida Alfara Siqueirosa. W pałacu znajdują się również rzeźby André Allara poświęcone siedmiu muzom. Wykonanie dziesięciu bogato zdobionych żelaznych bram budynku zlecono Włochowi Alessandrowi Mazzucotellemu. Grupę rzeźbiarską z brązu, która wieńczy główną kopułę, wykonał Węgier Géza Maróti, natomiast same kopuły zaprojektował Roberto Álvarez Espinoza w stylu art déco."
 gaudi.803.g: "Marzenie w stylu art déco."
 gaudi.804.t: "Palacio de Bellas Artes ukończony"
 gaudi.804.d: "Po wielu latach budowy i kilku nieprzewidzianych opóźnieniach miasto Meksyk zyskało nowy symbol: Palacio de Bellas Artes przyćmiewa cały kraj swoim kulturowym rozmachem."
 gaudi.804.f: "Budowę gmachu ukończono w 1934 roku, a jego uroczyste otwarcie odbyło się 29 listopada tego samego roku. Przedstawieniem inaugurującym działalność teatru była wystawiona w 1934 roku „La Verdad Sospechosa” Juana Ruiza de Alarcóna. W 1946 roku utworzono Instituto Nacional de Bellas Artes (Narodowy Instytut Sztuk Pięknych), instytucję rządową mającą promować sztukę."
 gaudi.804.g: "Muzyka, literatura i malarstwo pod jednym dachem!"
 gaudi.809.t: "Meksyk Utracony!"
 gaudi.809.d: "Wraz z utratą Meksyku straciliśmy wszelką możliwość kontynuowania budowy Palacio de Bellas Artes."
 gaudi.809.f: "Jeśli z jakiegokolwiek powodu utracimy Meksyk, dotychczasowe postępy budowy nie przepadną całkowicie. Tylko Meksyk może kontynuować budowę Palacio de Bellas Artes od ostatniego etapu. Obcy najeźdźcy nie wykażą natomiast zainteresowania dalszą budową."
 gaudi.809.g: "Nie możemy pozostawić Meksyku w ich rękach na długo!"
 gaudi.811.t: "Darowizna"
 gaudi.811.d: "Partie rządzące w naszym kraju są ze zrozumiałych względów zainteresowane szybką kontynuacją budowy Palacio de Bellas Artes. [SCOPE.sCharacter('gaudi_government_leader').GetFullName] szczególnie zaangażował się w budowę pałacu kultury i zbierał darowizny."
 gaudi.811.f: "Pogłoski, jakoby w rzeczywistości chodziło o nielegalne środki z partyjnej kasy, które pilnie muszą zniknąć, są oczywiście wyłącznie wymysłem opozycji."
 gaudi.811.g: "Muchas gracias."
 gaudi.812.t: "Związki zawodowe krytykują warunki pracy"
 gaudi.812.d: "[SCOPE.sCharacter('trade_unions_leader').GetFullName] potępił dziś w parlamencie przerażające warunki, w jakich powstaje Palacio de Bellas Artes."
 gaudi.812.f: "„Palacio de Bellas Artes ma stać się centrum kultury w naszym kraju, miejscem, w którym ludzie oddają się wyłącznie prawdzie, dobru i pięknu. Lecz sposób, w jaki rząd wyzyskuje zwykłych robotników, wyciskając z nich ostatnie siły w najgorszych warunkach, aby inni mogli cieszyć się tym pięknem, stoi w rażącej sprzeczności z ideałami estetycznymi, które mają przyświecać temu przedsięwzięciu!”"
 gaudi.813.t: "Podmokły Grunt"
 gaudi.813.d: "Nierówny i podmokły grunt przysparza głównemu architektowi Palacio de Bellas Artes nowych problemów. Budynkowi coraz bardziej grozi zapadnięcie się w ziemię. Działania zaradcze nadal opóźniają właściwe prace budowlane."
 gaudi.813.f: "Miasto Meksyk rozrasta się w sposób niekontrolowany i zarówno wówczas, jak i dziś należało do największych aglomeracji świata. Jego położenie nie było jednak korzystne. Poprzednikiem miasta był aztecki Tenochtitlan, położony pośrodku jeziora. Przez stulecia jezioro to osuszano, a grząskie podłoże już wcześniej okazywało się mało stabilne. Budowa studni głębinowych jeszcze pogorszyła sytuację. Niektóre barokowe kościoły znajdują się znacznie niżej niż w chwili ich wzniesienia. Palacio de Bellas Artes nie jest więc wyjątkiem."
 gaudi.813.g: "Bądź przeklęte, jezioro Texcoco!"
 gaudi.814.t: "Nowe Maszyny"
 gaudi.814.d: "Dzięki postępowi technologicznemu budowa Palacio de Bellas Artes przebiega sprawniej, niż początkowo zakładano."
 gaudi.814.f: "„Winda? Nie potrzeba już schodów? Więc można po prostu dać się wwieźć na górę? Materiały budowlane też? Dlaczego nikt nam wcześniej o tym nie powiedział?”"
 gaudi.815.t: "Groźba Strajku"
 gaudi.815.d: "Robotnicy pracujący przy budowie Palacio de Bellas Artes zapowiedzieli strajk, jeśli nie zgodzimy się na negocjacje w sprawie wyższych płac."
 gaudi.815.f: "Ach, ten cudowny świat strajków! Nie wiecie, co tracicie, jeśli nigdy nie utknęliście na dworcu w Ameryce Łacińskiej, bo związek zawodowy kolejarzy nagle postanowił sparaliżować ruch. Dziś dotyczy to tylko jednego placu budowy. Naprawdę mamy szczęście!"
 gaudi.815.i: "Wezwijcie żandarmerię!"
 gaudi.816.t: "Zawalenie się fasady zabija robotników"
 gaudi.816.d: "Na placu budowy Palacio de Bellas Artes doszło do poważnego wypadku: dziesiątki robotników zostały ranne, niektórzy nawet zginęli, a część fasady się zawaliła!"
 gaudi.816.f: "Przyczyna nie została jeszcze wyjaśniona, a główny architekt jest przesłuchiwany. Niektórzy podejrzewają fuszerkę budowlaną i sprzeniewierzenie środków przeznaczonych na materiały wysokiej jakości. Inne dowody wskazują na błąd projektowy. Pewne jest, że waląca się ściana fasady przygniotła całą grupę robotników, a także doszczętnie zniszczyła część już wzniesionej budowli."
 gaudi.817.t: "Palacio de Bellas Artes rośnie"
 gaudi.817.d: "Budowa Palacio de Bellas Artes postępuje szybciej, niż oczekiwano, z bliżej nieokreślonych przyczyn."
 gaudi.817.f: "Z nieznanych przyczyn budowa wspaniałego Palacio de Bellas Artes posuwa się naprzód. Może to zasługa dobrej pogody. Być może modlitwy do Najświętszej Maryi Panny. A może również materiałów budowlanych dość marnej jakości, które ostatnio zużyliśmy i których, miejmy nadzieję, nikt nigdy nie odkryje. Jedno jest pewne: ten kolos, którego budowę wielokrotnie opóźniały najróżniejsze okoliczności, powinien zostać ukończony szybciej, niż oczekiwano. O ile podmokły grunt nie sprawi, że budynek znów zacznie się zapadać..."
 gaudi.817.g: "¡Excelente!"
 gaudi.818.t: "Badania archeologiczne w mieście Meksyk"
 gaudi.818.d: "Po wizycie na placu budowy [SCOPE.sCharacter('gaudi_archaeologist').GetFullName] odkrył, że Palacio de Bellas Artes najwyraźniej stoi na azteckich ruinach. Prosi o pozwolenie na prowadzenie badań."
 gaudi.818.f: "Tenochtitlán był stolicą imperium Azteków i poprzednikiem dzisiejszego miasta Meksyk. Po hiszpańskim podboju został w znacznej mierze zniszczony, a część gruzów wrzucono do otaczającego go jeziora Texcoco lub wykorzystano jako materiał do wznoszenia nowych budynków. W starszych domach z epoki kolonialnej nadal można znaleźć azteckie spolia."
 gaudi.819.t: "Nowe Miejsca Pracy w Mieście Meksyk"
 gaudi.819.d: "Budowa Palacio de Bellas Artes przyciągnęła do Meksyku wielu nowych mieszkańców."
 gaudi.819.f: "Wyjątkowe znaczenie miasta Meksyk sięga czasów przedkolonialnych, gdy Tenochtitlán był stolicą imperium Azteków i pełnił liczne funkcje centralne. Zniszczone przez Hiszpanów i odbudowane jako kolonialna metropolia miasto stało się siedzibą scentralizowanej administracji kolonialnej. Pod koniec XIX wieku jego znaczenie wzrosło dzięki rozbudowie sieci kolejowej. Na początku XX wieku, oprócz roli centrum finansowego i handlowego, miasto zyskiwało również na znaczeniu jako ośrodek przemysłowy. Perspektywa zatrudnienia przez dziesięciolecia przyciągała do stolicy setki tysięcy ludzi. Dodatkową zachętę stanowiły przedsięwzięcia budowlane, takie jak Palacio de Bellas Artes."
