 je_gaudi_public_construction_reason: "[ROOT.GetCountry.GetCustom('je_gaudi_public_construction_active_type')]Architekt [concept_gaudi_architect], który nie jest zajęty żadnym innym projektem, będzie pracował przy budownictwie publicznym, zapewniając dodatkowe, darmowe #V Punkty Budowy#!.\nDopóki żaden inny projekt nie jest aktywny, będziesz otrzymywać ten modyfikator. Ponadto twój Architekt będzie co roku zdobywał #V Reputację#!.\n\nArchitekt posiadający cechę #V $gaudi_art_deco_style$#!, #V $gaudi_bauhaus_style$#! lub #V $gaudi_neoclassical_style$#! zapewnia twojemu krajowi #p +30#! $country_construction_add$, gdy zajmuje się budownictwem publicznym.\nArchitekt posiadający cechę #V $gaudi_historicism_style$#! zapewnia twojemu krajowi #p +20#! $country_construction_add$, gdy zajmuje się budownictwem publicznym.\nArchitekt posiadający cechę #V $gaudi_traditional_style$#! zapewnia twojemu krajowi #p +10#! $country_construction_add$, gdy zajmuje się budownictwem publicznym.\n\nPonadto Architekt posiadający cechę #V $gaudi_great_architect$#! zapewnia twojemu krajowi dodatkowe #p +20#! $country_construction_add$, gdy zajmuje się budownictwem publicznym."
