 gaudi.701.t: "Rozpoczyna się budowa Neuschwanstein"
 gaudi.701.d: "Król Bawarii wybrał miejsce w pobliżu starszej rezydencji Hohenschwangau, którą znał z dzieciństwa. Już teraz jest jasne, że budową faktycznie kieruje monarcha, a nie wybrani architekci."
 gaudi.701.f: "„Zamierzam odbudować ruiny starego zamku Hohenschwangau w pobliżu wąwozu Pöllat w autentycznym stylu dawnych zamków niemieckich rycerzy”. -Król Ludwik II"
 gaudi.701.g: "Król jest albo geniuszem, albo szaleńcem."
 gaudi.702.t: "Neuschwanstein: Pierwszy Etap ukończony"
 gaudi.702.d: "Na wzgórzu w pobliżu Füssen palatium góruje już wyraźnie nad bawarskim Allgäu. Budynek bramny Neuschwanstein jest już gotowy."
 gaudi.702.f: "„... pod każdym względem zamek ten będzie piękniejszy i przytulniejszy niż położony niżej Hohenschwangau...” -Król Ludwik II"
 gaudi.702.g: "Wygląda bardziej kiczowato, niż planowano."
 gaudi.703.t: "Budowa Neuschwanstein trwa"
 gaudi.703.d: "Rozpoczął się kolejny etap budowy zamku Neuschwanstein. Coraz częściej słychać głosy, że ta pełna przepychu budowla to całkowite marnotrawstwo pieniędzy."
 gaudi.703.f: "Wbrew powszechnym pogłoskom Ludwik II finansował budowę Neuschwanstein wyłącznie z własnego majątku. Z powodu braku pieniędzy chętnie przyjmował również darowizny od dawnego pruskiego odpowiednika. Aby zyskać przychylność Bawarii wobec koronacji króla Prus Wilhelma na cesarza niemieckiego, Bismarck wypłacał władcy roczną rentę w wysokości 300 000 marek Rzeszy. Pod koniec życia prywatne długi Ludwika wynosiły 8,25 miliona marek Rzeszy."
 gaudi.703.g: "Ile to będzie kosztować?"
 gaudi.704.t: "Neuschwanstein ukończony"
 gaudi.704.d: "Dziś wreszcie ukończono Neuschwanstein! Historia pokaże, czy budowla zapisze się w tradycji Ludwika XIV jako wyraz nostalgicznej megalomanii, czy też legenda króla przetrwa przez stulecia. Najpewniej jedno i drugie."
 gaudi.704.f: "„Chcę pozostać wieczną zagadką dla siebie i innych...” -Król Ludwik II"
 gaudi.704.g: "Niech żyje [SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('gaudi_ruler').GetFirstName]!"
 gaudi.709.t: "Bawaria Utracona!"
 gaudi.709.d: "Wraz z utratą Bawarii straciliśmy wszelką możliwość kontynuowania budowy zamku Neuschwanstein."
 gaudi.709.f: "Jeśli z jakiegokolwiek powodu utracimy Bawarię, dotychczasowe postępy budowy nie przepadną całkowicie. Tylko Bawaria może kontynuować budowę zamku Neuschwanstein od ostatniego etapu. Obcy najeźdźcy nie wykażą natomiast zainteresowania dalszą budową."
 gaudi.709.g: "Nie możemy pozostawić Bawarii w ich rękach na długo!"
 gaudi.711.t: "Cegły złej jakości"
 gaudi.711.d: "Ostatnia dostawa materiałów do budowy Neuschwanstein okazała się kiepskiej jakości."
 gaudi.711.f: "Na chwilę ucichł codzienny zgiełk na placu budowy, gdzie zamek Neuschwanstein z każdym dniem piął się coraz wyżej. Krótka kontrola przeprowadzona przez samego króla wykazała, że cegły nie spełniają zwykłych standardów jakości. Monarcha oznajmił, że woli poczekać, niż narazić swoje arcydzieło na niebezpieczeństwo przez użycie tych cegieł. W kierownictwie budowy słychać jednak głosy, że mimo wszystko należy je wykorzystać - nie tylko ze względu na możliwe opóźnienie prac, lecz także z obawy, że monarcha mógłby wykorzystać ten czas, by ponownie zmienić projekt..."
 gaudi.712.t: "Katastrofa!"
 gaudi.712.d: "Materiał gorszej jakości dał o sobie znać: dziś rano zawaliła się część Neuschwanstein, powodując znaczne zniszczenia."
 gaudi.712.f: "Być może król miał rację. Być może użycie kruszących się cegieł do wzniesienia tak ważnej budowli jak zamek Neuschwanstein naprawdę nie było dobrym pomysłem. Być może należało więc dwa razy przemyśleć tę decyzję. Ale jest już za późno - materiał gorszej jakości dał dziś o sobie znać, doprowadzając do zawalenia się ściany. Runęła fasada, niwecząc znaczną część pracy wykonanej w ciągu ostatnich tygodni i miesięcy."
 gaudi.713.t: "Opozycja krytykuje Neuschwanstein"
 gaudi.713.d: "[SCOPE.sCharacter('gaudi_opposition_leader').GetFullName] skierował petycję do Króla."
 gaudi.713.f: "„Za granicą już śmieją się z monarchy, który w zależności od nastroju uważa się za baśniowego króla lub wcielenie Ludwika XIV. Zadłużanie rodziny królewskiej na rzecz przestarzałych marzeń musi się skończyć. Bawaria staje się pośmiewiskiem Europy. Takie zachowanie nie przystoi królowi”."
 gaudi.713.g: "Jestem Królem i buduję, co chcę!"
 gaudi.713.h: "Może to JEDNAK próżność?"
 gaudi.714.t: "Nowe Maszyny"
 gaudi.714.d: "Postęp techniczny pomaga również przy wznoszeniu pozornie staromodnej budowli, takiej jak średniowieczny zamek."
 gaudi.714.f: "Fabryka maszyn w Monachium i nowoczesna konstrukcja szkieletowa ze stali umożliwiają odbudowę Neuschwanstein w niespotykanym dotąd, rekordowym czasie."
 gaudi.715.t: "Sąsiad pod wrażeniem Neuschwanstein"
 gaudi.715.d: "Nasze sąsiednie państwo [SCOPE.sCountry('gaudi_neighbour_nation').GetName] z podziwem przyjęło oddanie, z jakim Bawaria realizuje marzenie o idealnym zamku, i wyraziło duże zainteresowanie postępami prac budowlanych."
 gaudi.715.f: "Neuschwanstein to najsłynniejszy z zamków Ludwika II i jedna z najbardziej znanych atrakcji turystycznych Niemiec. Od udostępnienia go zwiedzającym w roku śmierci Ludwika liczba gości stale rosła. W ciągu zaledwie pierwszych ośmiu tygodni zamek odwiedziło około 18 000 osób. W 1913 roku przybyło ponad 28 000 gości, a w 1939 roku już 290 000. Do 2001 roku liczba ta wzrosła do około 1,3 miliona zwiedzających rocznie, w tym 560 000 Niemców oraz 385 000 Amerykanów i Anglików. Trzecią co do wielkości grupę stanowili w tym roku Japończycy, których przybyło 149 000. Do 2005 roku odnotowano łącznie ponad 50 milionów zwiedzających."
 gaudi.715.g: "Pokażcie ambasadorowi Neuschwanstein."
 gaudi.715.h: "Poproście o darowiznę."
 gaudi.716.t: "Król znów wpadł na pomysł..."
 gaudi.716.d: "Nasz monarcha zaskoczył niedawno kierownictwo budowy pewną zmianą."
 gaudi.716.f: "Budowa zamku rozpoczęła się w 1869 roku. Wraz z postępami prac rosły życzenia i wymagania Ludwika II, a także wydatki, przez co projekty i kosztorysy trzeba było kilkakrotnie zmieniać. Zamiast wielkiej sali tronowej początkowo planowano jedynie skromny gabinet, a przewidziane pokoje gościnne usunięto z planów, by zrobić miejsce dla Sali Mauretańskiej, której nie udało się zrealizować z powodu ciągłego braku pieniędzy. Ukończenie zamku, pierwotnie przewidziane na 1872 rok, wielokrotnie się opóźniało."
 gaudi.716.g: "Kruzetiakn!"
 gaudi.716.h: "Sakrament!"
 gaudi.716.i: "Zefix!"
 gaudi.716.j: "Himme, Oarsch und Zwian!"
 gaudi.717.t: "Neuschwanstein rośnie"
 gaudi.717.d: "Budowa zamku Neuschwanstein postępuje szybciej, niż oczekiwano, z bliżej nieokreślonych przyczyn."
 gaudi.717.f: "Z nieznanych przyczyn budowa majestatycznego zamku Neuschwanstein posuwa się naprzód. Może to zasługa dobrej pogody. Być może modlitwy do Najświętszej Maryi Panny. A może również materiałów budowlanych dość marnej jakości, które ostatnio zużyliśmy i których, miejmy nadzieję, nikt nigdy nie odkryje. Jedno jest pewne: ten kolos, którego budowę wielokrotnie opóźniały najróżniejsze okoliczności, powinien zostać ukończony szybciej, niż oczekiwano. O ile król nie wykorzysta tego, by zniweczyć oszczędność czasu kolejną rozbudową..."
 gaudi.718.t: "Przedsięwzięcie Narodowe czy Królewskie?"
 gaudi.718.d: "W parlamencie toczy się obecnie poważna debata nad tym, czy zamek Neuschwanstein jest przede wszystkim budowlą narodową, czy królewską."
 gaudi.718.f: "Zamek Neuschwanstein, położony na odludziu w Allgäu, od początku miał służyć królowi jako prywatne schronienie. Mimo to budowla miała również wymiar romantyczny, a tym samym narodowy, przynajmniej w oczach postronnych obserwatorów: idealizacja średniowiecza jako okresu największej świetności w dziejach Niemiec stanowiła część narracji ruchu narodowego. Jednocześnie zamek był kamiennym hołdem dla Richarda Wagnera, narodowego kompozytora podzielonego narodu niemieckiego."
 gaudi.718.g: "To przedsięwzięcie narodowe."
 gaudi.718.h: "To przedsięwzięcie narodowe i królewskie."
 gaudi.718.i: "To przedsięwzięcie królewskie."
 gaudi.719.t: "Monarcha składa wizytę"
 gaudi.719.d: "[SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('gaudi_ruler').GetFullName] postanowił osobiście odwiedzić plac budowy Neuschwanstein."
 gaudi.719.f: "Nasz monarcha [SCOPE.sCharacter('gaudi_ruler').GetFirstName] stale śledzi postępy budowy i zapowiedział kolejną wizytę. Przygotowania idą pełną parą - wszyscy chcą przecież godnie zaprezentować się przed Jego Królewską Mością! Po ogłoszeniu wizyty zarówno zwykli robotnicy, jak i kierownictwo budowy oraz główny architekt narzucili więc niespotykane dotąd tempo pracy."
 gaudi.719.g: "Jego Królewska Mość wie, jak motywować."
 gaudi.720.t: "Pożar na placu budowy"
 gaudi.720.d: "Z nieznanych przyczyn na placu budowy Neuschwanstein wybuchł pożar, który opóźnił prace o wiele miesięcy!"
 gaudi.720.f: "„Czy ktoś właśnie gra Walkirię Richarda Wagnera?!”"
 gaudi.720.g: "Straszne! Zupełnie jak u Wagnera!"
 gaudi.721.t: "Królewska Pomoc dla Robotników"
 gaudi.721.d: "Jeden z przywódców związkowych zwrócił się do króla z prośbą o zapewnienie robotnikom lepszej opieki w zamian za niebezpieczną pracę przy budowie zamku Neuschwanstein."
 gaudi.721.f: "Ten wielki plac budowy był przez około dwie dekady największym pracodawcą w regionie. W 1880 roku pracowało tam codziennie około 200 rzemieślników, nie licząc dostawców i innych osób pośrednio zaangażowanych w budowę. Gdy król narzucał szczególnie napięte terminy i pilne zmiany, liczba robotników miała sięgać nawet 300 dziennie, a prace prowadzono również nocą przy świetle lamp naftowych. Założone 3 kwietnia 1870 roku „Stowarzyszenie Rzemieślników przy Pałacu Królewskim w Hohenschwangau” było bardzo nowoczesną instytucją socjalną. Jego celem było zapewnienie dalszej wypłaty wynagrodzeń chorym lub rannym robotnikom budowlanym dzięki niewielkim miesięcznym składkom i znacznym dopłatom króla. Działając podobnie do dzisiejszych instytucji ubezpieczeń społecznych lub branżowych kas ubezpieczeniowych, stowarzyszenie gwarantowało wypłatę wynagrodzenia przez 15 tygodni w zamian za składkę w wysokości 0,70 marki. Potomkom osób zmarłych podczas budowy przysługiwała renta - choć niewielka, nie była wówczas powszechnym świadczeniem."
 gaudi.721.g: "Instytucja godna wsparcia."
 gaudi.721.h: "Wzór do naśladowania dla całego kraju!"
 gaudi.721.i: "Pomoc socjalna? Potrzebuję robotników, nie mazgajów!"
