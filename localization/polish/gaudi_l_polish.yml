 gaudi.1221.t: "Komputer Mechaniczny"
 gaudi.1221.d: "Nasz [concept_tesla_mechanical_engineer] [GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] ukończył wreszcie jeden z największych wynalazków ludzkości: Komputer Mechaniczny. Wpływu tego wynalazku nikt nie jest jeszcze w stanie pojąć."
 gaudi.1221.f: "Silniki zaryczały, a kolos zaczął terkotać i zgrzytać. Tysiące kół zębatych ruszyły, a drukarka zaczęła wyrzucać z siebie kolejne liczby. Wszystko to z szybkością i precyzją nieosiągalną dla człowieka."
 gaudi.1222.t: "Maszyna Analityczna"
 gaudi.1222.d: "[SCOPE.sCharacter('tesla_new_engineer_scope').GetFullName], znany polihistor, zaprojektował nową maszynę zdolną wykonać wszelkie możliwe obliczenia. Teraz zwraca się do naszego rządu o wsparcie, by rzeczywiście zbudować taki komputer mechaniczny."
 gaudi.1222.f: "„Gdy tylko powstanie Maszyna Analityczna, nieuchronnie wyznaczy dalszy kierunek rozwoju nauki. Ilekroć będziemy szukać za jej pomocą jakiegoś wyniku, pojawi się pytanie — jaki sposób obliczeń pozwoli maszynie uzyskać go w najkrótszym czasie?” - Charles Babbage"
 gaudi.1222.g: "Cóż za fascynujący Projekt!"
 gaudi.1222.h: "Zamiast tego moglibyśmy zbudować tyle okrętów wojennych!"
 tesla_mechanical_computer_project_finished_engineer_loc: "\n[GetPlayer.MakeScope.GetVariable('tesla_engineer_var').GetCharacter.GetFullNameNoFormatting] wynalazł pierwszy #V Komputer Mechaniczny#!. Jeden z największych wynalazków ludzkości."
