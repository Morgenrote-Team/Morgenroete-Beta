 je_gaudi_custom_monument_blueprint_research_reason: "[ROOT.Var('gaudi_architect_var').GetCharacter.GetFullName] cieszy się światową sławą jako jeden z najwybitniejszych architektów [ROOT.Var('gaudi_architect_var').GetCharacter.GetHerHis] czasów. Aby uwiecznić [ROOT.Var('gaudi_architect_var').GetCharacter.GetHerHis] imię, [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe] pracuje nad projektem wyjątkowego monumentu, który rozsławi nasz naród na całym świecie jako ośrodek sztuki architektonicznej."
 gaudi.81.t: "Arcydzieło Architekta"
 gaudi.81.d: "W ostatnich latach [THIS.GetCountry.GetName] stał się jednym z czołowych krajów w dziedzinie architektury. [ROOT.Var('gaudi_architect_var').GetCharacter.GetFullName] odegrał znaczącą rolę w tym rozwoju. [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U] przyjął zlecenie zaprojektowania monumentu, który dorównałby największym cudom architektury starożytności, średniowiecza i czasów nowożytnych."
 gaudi.81.f: "Monument Architekta będzie nawiązywał do stylu preferowanego przez Wielkiego Architekta:\n\nArchitekci Art Déco zaprojektują [GetBuildingType('building_gaudi_people_monument').GetName].\nArchitekci Bauhausu zaproponują [GetBuildingType('building_gaudi_people_forum').GetName].\nArchitekci Neoklasycystyczni stworzą [GetBuildingType('building_gaudi_people_palace').GetName]."
 gaudi.81.g: "Wspaniale."
 ACHIEVEMENT_gaudi_stalin: "Stalin Zielenieje z Zazdrości"
 ACHIEVEMENT_DESC_gaudi_stalin: "Posiadaj Pałac Ludowy jako republika rad z gospodarką nakazową."
 gaudi.82.t: "Dzieło Życia Architekta"
 gaudi.82.d: "Po miesiącach przygotowań [ROOT.Var('gaudi_architect_var').GetCharacter.GetFullName] przedstawił plany, obliczenia, dane statystyczne oraz ręcznie wykonany model. [ROOT.Var('gaudi_architect_var').GetCharacter.GetHerHis|U] ambitny projekt monumentu już teraz uznawany jest za urzeczywistnienie marzeń o doskonałej architekturze. Pozostaje tylko jedno pytanie: kto urzeczywistni tę wizję?"
 gaudi.82.f: "„Jutro stworzymy piękne rzeczy”. – Antoni Gaudí"
 gaudi.82.g: "Pomnik ku naszej własnej chwale."
