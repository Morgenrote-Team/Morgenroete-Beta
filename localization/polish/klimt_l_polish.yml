 klimt_recently_hired_independent_painter_modifier: "Niedawno zatrudniony Niezależny Malarz"
 klimt.2.f: "W wieku około 40 lat [concept_klimt_painter] uzna, że zakończył naukę, i ostatecznie wybierze preferowany styl malarski. Ogólna zasada jest taka, że styl ten opiera się na najnowocześniejszym nurcie artystycznym, przy czym Secesja jest najnowocześniejsza, a Klasycyzm stanowi najbardziej archaiczną formę sztuki. Malarze o wyspecjalizowanym stylu malarskim będą tworzyć arcydzieła w tym stylu artystycznym pod pewnymi warunkami. Możesz również zapoczątkować kolekcję sztuki w galerii odpowiadającej Twoim upodobaniom. Malarz o wyspecjalizowanym stylu uznaje swoją edukację malarską za zakończoną i nie będzie już wyruszał w podróże edukacyjne."
 klimt.2.g: "Styl malarski jest już dojrzały."
 klimt.10.t: "Inauguracja Galerii"
 klimt.10.d: "Nowo mianowany dyrektor otworzył nową galerię sztuki podczas uroczystej ceremonii. Wśród honorowych gości znalazł się [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetFullName], który z zadowoleniem uczestniczył w uroczystości."
 klimt.10.f: "Budowa galerii narodowej otwiera wiele możliwości. Malarze o wyspecjalizowanym stylu automatycznie utworzą kolekcję sztuki odpowiadającą ich upodobaniom. W związku z tym artyści, którzy porzucili styl romantyczny, stworzą kolekcję obrazów romantycznych. Taką kolekcję sztuki można dodatkowo wzbogacić o arcydzieło, przekształcając ją w doskonałą kolekcję. Arcydzieła mogą być z czasem losowo tworzone przez artystów reprezentujących dany nurt artystyczny lub nabywane za granicą."
 klimt.10.g: "Wreszcie nie musimy już przechowywać tych rzeczy na strychu!"
 klimt.20.t: "Galeria Narodowa"
 klimt.20.d: "Arcydzieła charakterystyczne dla danej epoki są wystawiane w galerii sztuki. Obecnie posiadamy następujące unikatowe obrazy:"
 klimt.20.none: "Obecnie nie posiadamy żadnych arcydzieł w Galerii Narodowej."
