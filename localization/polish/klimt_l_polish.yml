 je_klimt_painter_trip: "Podróż Edukacyjna"
 je_klimt_painter_trip_reason: "Podczas [concept_klimt_painter_trip] malarz może poznać nieznany mu wcześniej styl artystyczny, a tym samym zwiększyć roczny przyrost [concept_klimt_painting_tradition]. Podczas pobytu w zagranicznym [concept_artists_center_of_arts] może również naby"
 je_klimt_painter_trip_goal: "Malarz zazwyczaj kończy naukę w ciągu #G 12 miesięcy#!. Wydarzenia mogą wydłużyć lub skrócić ten czas."
 je_klimt_secession: "Secesja Wiedeńska"
 je_klimt_secession_reason: "Nowy ruch artystyczny, jakim jest Secesja, przyciągnął wielu artystów. W określonych warunkach może to doprowadzić do powstania uznanego ruchu artystycznego, który zdobędzie międzynarodową sławę i nada nowy impuls malarstwu oraz architekturze. Historycznie jednym z najważniejszych stowarzyszeń tego rodzaju była Secesja Wiedeńska. Secesja Wiedeńska, a dokładniej Stowarzyszenie Artystów Austriackich, to zrzeszenie artystów działające w Wiedniu w okresie fin de siècle. Od nazwy tego stowarzyszenia pochodzi również określenie wiedeńskiej odmiany secesji jako stylu secesyjnego lub wiedeńskiej secesji."
 je_klimt_secession_fail: "Inny naród odblokował Secesję Wiedeńską przed nami."
