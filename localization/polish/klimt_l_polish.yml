l_polish:
 klimt_painter: "Malarz"
 klimt_painter_desc: "Ta postać jest artystą, który zajmuje się głównie malarstwem. Może pewnego dnia jego obrazy będą znane na całym świecie?"
 klimt_great_painter: "Wielki Malarz"
 klimt_great_painter_desc: "Ta postać należy do grona najwybitniejszych Malarzy na świecie. Jej obrazy wiszą we wszystkich najważniejszych galeriach sztuki, a kolekcjonerzy płacą za nie fortunę."
 klimt_spitzweg_not_funny_modifier: "Podejrzliwy Spitzweg"
 klimt.1300.t: "Carl Spitzweg, Biedny Poeta"
 klimt.1300.d: "Biedny Poeta (niem. Der arme Poet) to najbardziej znany i najpopularniejszy obraz niemieckiego malarza Carla Spitzwega. Został namalowany w 1839 roku i doczekał się trzech wersji. Uważany jest za wczesne arcydzieło."
 klimt.1300.f: "Carl Spitzweg był niemieckim malarzem romantycznym i poetą. Uważany jest za jednego z najważniejszych artystów epoki Biedermeieru. Jego ojciec, zamożny kupiec, zadbał o to, by Carl zdobył wykształcenie farmaceutyczne. Carl uzyskał kwalifikacje na Uniwersytecie Monachijskim, ale podczas rekonwalescencji po chorobie zainteresował się również malarstwem. Spitzweg był samoukiem i początkowo kopiował dzieła mistrzów flamandzkich. Swoje pierwsze prace publikował w czasopismach satyrycznych. Po otrzymaniu spadku w 1833 roku mógł poświęcić się malarstwu. Jego późniejsze obrazy i rysunki często przedstawiały humorystyczne sceny rodzajowe. Wiele jego dzieł ukazuje ekscentryczne postacie o wyrazistych cechach charakteru."
 klimt.1300.g: "Ahahaha, zabawny malarz!"
 klimt.1300.h: "Zaraz! Z kogo ta satyra?"
