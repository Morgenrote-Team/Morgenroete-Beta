 klimt.30.t: "Powiew Świeżości w Sztuce"
 klimt.30.d: "Miasto [SCOPE.sState('klimt_secession_state').GetCityHubName] stało się centrum wybitnego, międzynarodowego ruchu artystycznego, silnie związanego z secesją. Krąg artystyczny określa się mianem „Secesji [SCOPE.sState('klimt_secession_state').GetCityHubName]”."
 klimt.30.f: "Secesja Wiedeńska to ruch artystyczny ściśle związany z secesją, który powstał w 1897 roku z inicjatywy grupy austriackich malarzy, grafików, rzeźbiarzy i architektów, wśród których znaleźli się Josef Hoffman, Koloman Moser, Otto Wagner i Gustav Klimt. Opuścili oni Stowarzyszenie Artystów Austriackich w proteście przeciwko wspieraniu przez nie bardziej tradycyjnych stylów artystycznych. Ich najważniejszym dziełem architektonicznym był Pawilon Secesji, zaprojektowany przez Josepha Marię Olbricha jako miejsce wystaw organizowanych przez grupę. Oficjalne czasopismo stowarzyszenia nosiło tytuł Ver Sacrum (po łacinie „Święta Wiosna”) i publikowało wysoce stylizowane, wpływowe dzieła sztuki graficznej. W 1905 roku doszło do rozłamu w samej grupie, gdy część jej najwybitniejszych członków, w tym Klimt, Wagner i Hoffmann, odeszła w wyniku sporu o priorytety. Stowarzyszenie nadal jednak działało i funkcjonuje do dziś, mając swoją siedzibę w Pawilonie Secesji. Obecnie galeria wystawowa Secesji jest niezależnie prowadzona i zarządzana przez artystów."
 klimt.30.g: "Pocałunek dla całego świata!"
 klimt.30.h: "Klimt? Masz na myśli Gustava Klimta?"
 klimt.30_tt: "Wywołuje wydarzenie #white #b Pierwsza Secesja#!#!"
 klimt.40.t: "Wernisaż"
 klimt.40.d: "Wystawa w [SCOPE.sState('klimt_vernissage_state').GetCityHubName] była w całości poświęcona dziełom [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetFullName]. Wydarzenie uznano za jedno z najważniejszych wydarzeń kulturalnych roku, a wystawa zyskała uznanie krytyków. Dla naszego kraju jest to potwierdzenie, że jesteśmy wiodącym krajem w dziedzinie kultury."
 klimt.40.f: "„Czym jestem w oczach większości ludzi — nikim, ekscentrykiem czy nieprzyjemnym człowiekiem — kimś, kto nie ma żadnej pozycji społecznej i nigdy jej nie zdobędzie; krótko mówiąc, najniższym z najniższych. No dobrze, nawet jeśli byłaby to absolutna prawda, chciałbym pewnego dnia pokazać poprzez swoją twórczość, co taki ekscentryk, taki nikt, nosi w sercu.\nMoja ambicja wynika mniej z urazy niż z miłości mimo wszystko, bardziej z poczucia spokoju niż z namiętności.\nChoć często pogrążam się w rozpaczy, wciąż jest we mnie spokój, czysta harmonia i muzyka. Dostrzegam obrazy lub rysunki w najbiedniejszych chatach, w najbrudniejszych zakątkach. A mój umysł kieruje się ku tym rzeczom z nieodpartym impetem.” -Vincent van Gogh"
 klimt.40.g: "Jak tam bufet?"
 klimt.101.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('custom_painting_classicism')]"
 klimt.101.d: "Podczas swojego wernisażu Maestro [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetFullName] zaprezentował publiczności [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetHerHis] najnowszy obraz: „[SCOPE.GetRootScope.GetCountry.GetCustom('custom_painting_classicism')]\" to typowe dzieło Klasycyzmu, które już teraz uznawane jest za znaczące w tym nurcie."
 klimt.101.f: "Nowe dzieło [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetLastName] od razu przyciągnęło uwagę znawców sztuki. Szczególnie konserwatywnie nastawieni uczeni docenili estetyczne formy oraz równowagę linii i kolorów. Podkreślano przede wszystkim moralną integralność i wzniosłość dzieła. Obraz jest już uznawany za cenny element dziedzictwa kulturowego naszego narodu i powinien być ozdobą każdej galerii."
 klimt.101.g: "To powinno trafić do ... Galerii!"
 klimt.102.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('custom_painting_romanticism')]"
 klimt.102.d: "Malarz narodowy [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetFullName] zaprezentował publiczności [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetHerHis] dzieło w obecności kilku zaproszonych gości. Zmysłowość i siła barw wywarły wrażenie na widzach. Obraz jest już uznawany za jedno z najważniejszych dzieł Romantyzmu."
 klimt.102.f: "„[SCOPE.GetRootScope.GetCountry.GetCustom('custom_painting_romanticism')]” już pierwszego wieczoru wywarło silne wrażenie na niektórych zwiedzających. Duch tego arcydzieła jest wyraźnie wyczuwalny. Krytycy narzekali, że kontury w niektórych miejscach są rozmyte, inni zaś dostrzegali siłę tematu właśnie w tym braku wyrazistości, połączonym z bogactwem barw. Dzięki temu obrazowi [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetLastName] z pewnością zapisał się na kartach historii sztuki."
 klimt.103.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('custom_painting_realism')]"
 klimt.103.d: "Podczas wieczoru towarzyskiego [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetFullName] skorzystał z okazji, aby zaprezentować nowy obraz, który wyraźnie wpisuje się w nurt realizmu. Niektórzy obecni na miejscu znawcy sztuki pochwalili dzieło."
 klimt.103.f: "Niektórzy obecni goście obawiali się bardziej prowokacyjnej niespodzianki, jednak „[SCOPE.GetRootScope.GetCountry.GetCustom('custom_painting_realism')]” okazał się bardzo stonowanym przedstawieniem. Na pierwszy rzut oka część gości wzięła go za obraz rodzajowy. Jednak im dłużej zgromadzeni przyglądali się przedstawionej scenie z życia codziennego, tym wyraźniej dostrzegali subtelną, wywrotową ideę kryjącą się za dziełem oraz problemy społeczne, do których nawiązywał autor. [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetLastName] mógł zrazić do siebie kilku uczestników wieczornego spotkania swoim krytycznym podejściem do społeczeństwa, jednak przeważa opinia, że taki skarb sztuki zasługuje na godną wystawę o randze narodowej."
 klimt.104.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('custom_painting_impressionism')]"
 klimt.104.d: "Podczas wielkiej wystawy sztuki zorganizowanej przez wysokich rangą przedstawicieli krajowego stowarzyszenia malarskiego [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetFullName] zaprezentował dzieło, które wzbudziło spore zainteresowanie, ale również stało się obiektem drwin niektórych krytyków. Nagle jednak wysoka oferta od zagranicznego marszanda sprawiła, że obraz zyskał ogromną popularność."
 klimt.104.f: "Opinie były podzielone, gdy zaprezentowano „[SCOPE.GetRootScope.GetCountry.GetCustom('custom_painting_impressionism')]”. Niektórzy uznali ten idylliczny obraz za niemal naiwny i pozbawiony ambicji politycznych czy społecznych, inni krytykowali brak formy i wyraźnych linii. Ktoś zadrwił, że rozmyty krajobraz jest zapewne wynikiem rozmytego umysłu autora. Zwolennikom dzieła nie udało się przekonać pozostałych, dopóki marszand z kraju [SCOPE.sCountry('klimt_art_dealer_country').GetName] nie podkreślił wyjątkowej jakości i nowatorskiego ducha arcydzieła. Był od razu gotów zapłacić za obraz zawrotną sumę i zabrać go do swojego kraju. Po tym wydarzeniu zainteresowanie dziełem wzrosło, a sam obraz natychmiast uznano za narodowe dziedzictwo kulturowe. [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetLastName] może być z tego więcej niż zadowolony."
 klimt.105.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('custom_painting_expressionism')]"
 klimt.105.d: "Najnowszy obraz [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetFullName] wzbudził przerażenie, nienawiść, gniew i odrazę wśród publiczności i krytyków. Innymi słowy: odniósł sensacyjny sukces!"
 klimt.105.f: "„Co to w ogóle ma znaczyć: [SCOPE.GetRootScope.GetCountry.GetCustom('custom_painting_expressionism')]? Jaki to ma sens? Co to za kolory, jak z przedszkolnej kolorowanki? Te prymitywne postacie? Te majaczeniowe sceny? Nazywasz to sztuką? SZTUKĄ?! Ty szarlatanie! Gdybyś napluł na ten obraz, byłoby w nim więcej sztuki niż teraz!”\n\nA to był jeden z bardziej pozytywnych komentarzy podczas prezentacji. [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetLastName] wywołał tym samym historyczny skandal, który tylko zwiększa znaczenie obrazu."
 klimt.106.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('custom_painting_art_nouveau')]"
 klimt.106.d: "Po opublikowaniu nowego dzieła [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetHerHis] autorstwa „[SCOPE.GetRootScope.GetCountry.GetCustom('custom_painting_art_nouveau')]\", [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetFullName] uchodzi za jednego z najważniejszych artystów na arenie międzynarodowej. Dzieło zachwyciło zarówno tradycjonalistów, jak i przedstawicieli awangardy."
 klimt.106.f: "„Cóż to takiego, secesja? Sztuka nigdy nie może być nowa”. -Alphonse Mucha"
 klimt.110.t: "Dyskretne Zamówienie"
 klimt.110.d: "Doświadczony handlarz dziełami sztuki i antykami zaoferował sprowadzenie rzadkiego arcydzieła z zagranicy. Wymaga to zachowania najwyższej dyskrecji — handlarz kupuje również od rywali, a nawet wrogów wojennych. [SCOPE.sCharacter('klimt_art_dealer').GetFullName] zapewnił, że zrealizuje zamówienie po cichu, pod warunkiem odpowiednio wysokiego wynagrodzenia i otrzymania w zamian kilku obrazów."
 klimt.110.f: "Aby kupić obraz z zagranicy, marszand działający w innym kraju musi złożyć odpowiednią ofertę. Obejmuje ona nie tylko pieniądze, ale również kilka obrazów w zamian, co uszczupli naszą [concept_klimt_painting_tradition]. Marszand może kupować arcydzieła tylko w krajach, które posiadają więcej niż jeden obraz w danym stylu — nie sprzedadzą one unikatowego dzieła. Podobnie dany kraj nie może kupić za granicą więcej niż jednego arcydzieła w każdym stylu. Sfinalizowanie transakcji i dostarczenie obrazu do naszej Galerii Narodowej zajmie około sześciu miesięcy."
 klimt.110.g: "Pozyskaj Arcydzieło Klasycyzmu"
 klimt.110.h: "Pozyskaj Arcydzieło Romantyzmu"
 klimt.110.i: "Pozyskaj Arcydzieło Realizmu"
 klimt.110.j: "Pozyskaj Arcydzieło Impresjonizmu"
 klimt.110.k: "Pozyskaj Arcydzieło Ekspresjonizmu"
 klimt.110.l: "Pozyskaj Arcydzieło Secesji"
 klimt.111.t: "Arcydzieło Klasycyzmu"
 klimt.111.d: "„[SCOPE.GetRootScope.GetCountry.GetCustom('custom_painting_classicism')]” trafił dziś do Galerii Narodowej jako nowe arcydzieło. Rząd jest bardzo zadowolony z nabytku. Marszand uznaje swoje zadanie za wykonane."
 klimt.111.f: "Wielkie oczekiwania nie zostały zawiedzione. „[SCOPE.GetRootScope.GetCountry.GetCustom('custom_painting_classicism')]” dokładnie spełnia stawiane mu wymagania i powinien być doskonałym uzupełnieniem kolekcji obrazów kraju [GetPlayer.GetNameNoFlag]. Prasa branżowa również zgadza się, że zakup był wart każdej wydanej złotówki. Na przyszły miesiąc zaplanowano wystawę poświęconą temu szczytowemu osiągnięciu Klasycyzmu."
 klimt.111.g: "Kolejny skarb sztuki w naszej kolekcji!"
 klimt.112.t: "Arcydzieło Romantyzmu"
 klimt.112.d: "Dziś przed Galerią Narodową zgromadzili się ciekawscy. Przedstawiciele lokalnej i krajowej prasy oblegają to miejsce już od wczesnych godzin porannych. Rozeszła się już wieść, że „[SCOPE.GetRootScope.GetCountry.GetCustom('custom_painting_romanticism')]”, arcydzieło romantyzmu, ma wkrótce wzbogacić kolekcję obrazów."
 klimt.112.f: "Krążyły już pewne pogłoski na temat „[SCOPE.GetRootScope.GetCountry.GetCustom('custom_painting_romanticism')]”. Podobno jest to barwny obraz pobudzający zmysły. Nie wiadomo nic więcej na temat jego tematyki. Mówi się, że tajemniczy marszand, który mógłby udzielić więcej informacji, wyjechał za granicę z pokaźną sumą pieniędzy i zaplanował przejście na emeryturę. Nie był już dostępny dla dziennikarzy."
 klimt.113.t: "Arcydzieło Realizmu"
 klimt.113.d: "Nowe arcydzieło „[SCOPE.GetRootScope.GetCountry.GetCustom('custom_painting_realism')]” zostało dziś zaprezentowane publiczności podczas uroczystości otwierającej specjalną wystawę. Dzieło reprezentuje nurt realizmu i jest uznawane za jeden z najważniejszych obrazów tej epoki artystycznej. Frekwencja była odpowiednio wysoka. Bilety na to wydarzenie wyprzedały się całkowicie już na kilka tygodni przed jego rozpoczęciem."
 klimt.113.f: "„To dla mnie zarówno wielki zaszczyt, jak i przyjemność, że jako dyrektor Galerii Narodowej mogę dziś zaprezentować Państwu nowe arcydzieło, które od dziś wzbogaci naszą kolekcję obrazów. Jak Państwo wiedzą, od dawna staraliśmy się zdobyć dzieło, które moglibyśmy uznać za jedno z najważniejszych osiągnięć realizmu. „[SCOPE.GetRootScope.GetCountry.GetCustom('custom_painting_realism')]” jest właśnie takim dziełem. Nie muszę wiele mówić o malarzu, wszyscy Państwo go znacie. Ze względu na swoje stonowane przedstawienie i odniesienia do codziennego życia obraz został początkowo błędnie uznany przez krytyków za malarstwo rodzajowe lub dzieło pozbawione ducha. W rzeczywistości jednak jego treść jest głęboka. Proszę zwrócić uwagę na szczegóły kolorystyki, które sprawiają wrażenie, że...”"
 klimt.114.t: "Arcydzieło Impresjonizmu"
 klimt.114.d: "Marszand wykonał dziś swoje zadanie i za pokaźną zapłatę przekazał „[SCOPE.GetRootScope.GetCountry.GetCustom('custom_painting_impressionism')]” osobom odpowiedzialnym za zbiory Galerii Narodowej. Transakcja przebiegła bez zakłóceń. Dyrektor również pozytywnie wypowiedział się o zakupie, choć zauważył, że kolory są nieco rozmyte."
 klimt.114.f: "„Jestem bardzo przygnębiony i głęboko zniesmaczony malarstwem. To naprawdę nieustanna męka”. -Claude Monet"
 klimt.115.t: "Arcydzieło Ekspresjonizmu"
 klimt.115.d: "„[SCOPE.GetRootScope.GetCountry.GetCustom('custom_painting_expressionism')]”, arcydzieło sprowadzone z zagranicy przez zaufanego marszanda, w końcu dotarło do kraju [GetPlayer.GetNameNoFlag]. Nie wszyscy jednak przyjęli je z aprobatą. Marszand odebrał zapłatę i odszedł, a teraz nie można go odnaleźć."
 klimt.115.f: "Po przybyciu „[SCOPE.GetRootScope.GetCountry.GetCustom('custom_painting_expressionism')]” niektórzy znawcy sztuki wyrazili zdziwienie, a nawet krytykę. Nietypowa kompozycja sprawiała wrażenie, jakby dzieło nie mogło być pracą uznanego artysty. Dziwaczny tytuł, który niewiele miał wspólnego z tymi bazgrołami, również wzbudził podejrzenia, czy przypadkiem nie natrafiono na szarlatana, który postanowił sobie zażartować. Odkrycie na obrazie autentycznego podpisu artysty tylko pogorszyło sytuację. Przygotuj się na gwałtowne reakcje publiczności."
 klimt.116.t: "Arcydzieło Secesji"
 klimt.116.d: "Dyrektor Galerii Narodowej odetchnął dziś z ulgą, gdy odkrył, że arcydzieło dotarło zza granicy. [SCOPE.GetRootScope.GetCountry.GetCustom('custom_painting_art_nouveau')] to prawdziwa uczta dla oczu."
 klimt.116.f: "Gdy „[SCOPE.GetRootScope.GetCountry.GetCustom('custom_painting_art_nouveau')]” w końcu wyjęto ze skrzyni, natychmiast skradło serca zgromadzonych, niczym nowo narodzone tygrysiątko w zoo. Albo nowy, ważny eksponat w muzeum. Albo nowo odkryta planeta w obserwatorium. Albo nowe arcydzieło muzyczne kompozytora. Albo złożony na nowo szkielet paleontologa. Albo odnalezione szczątki przodka człowieka. Albo..."
 klimt.116.g: "Albo zwycięstwo w Pucharze Schneidera?"
 klimt.301.t: "Nagroda [SCOPE.sState('klimt_art_capital').GetCityHubName]"
 klimt.301.d: "Elita naszego kraju, miłująca sztukę, domaga się ustanowienia nagrody dla artysty, który stworzy najlepsze obrazy."
 klimt.301.f: "Kraje posiadające galerię sztuki od czasu do czasu organizują konkursy artystyczne. Pięciu najbardziej utalentowanych malarzy otrzymuje nagrodę, która znacząco wpływa na ich reputację. Nagroda Artystyczna jest zazwyczaj przyznawana co pięć lat. Wielcy Malarze nie są zapraszani — otrzymali już swoją nagrodę."
 klimt.301.g: "Powinniśmy zorganizować konkurs artystyczny."
 klimt.301.h: "Co za marnotrawstwo pieniędzy!"
 klimt.302.t: "Nagroda [SCOPE.sState('klimt_art_capital').GetCityHubName]"
 klimt.302.d: "Jury doszło do porozumienia i wybrało najlepsze obrazy. Lista pięciu zwycięzców już krąży wśród ludzi."
 klimt.302.f: "1\. [SCOPE.sCharacter('klimt_character_first_winner_scope').GetFullName] z [GetGlobalVariable('klimt_prize_winner_1_global_var').GetCountry.GetName]\n2\. [SCOPE.sCharacter('klimt_character_second_winner_scope').GetFullName] z [GetGlobalVariable('klimt_prize_winner_2_global_var').GetCountry.GetName]\n3\. [SCOPE.sCharacter('klimt_character_third_winner_scope').GetFullName] z [GetGlobalVariable('klimt_prize_winner_3_global_var').GetCountry.GetName]\n4\. [SCOPE.sCharacter('klimt_character_fourth_winner_scope').GetFullName] z [GetGlobalVariable('klimt_prize_winner_4_global_var').GetCountry.GetName]\n5\. [SCOPE.sCharacter('klimt_character_fifth_winner_scope').GetFullName] z [GetGlobalVariable('klimt_prize_winner_5_global_var').GetCountry.GetName]"
 klimt.302.g: "Nagródź Zwycięzców"
 klimt.401.t: "Cel Podróży Malarza"
 klimt.401.d: "[GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetFullName] spakował już [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetHerHis] rzeczy. W której szkole artystycznej [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetSheHe] ma studiować?"
 klimt.401.f: "[concept_klimt_painter], który kontynuuje naukę podczas podróży artystycznej, nie będzie generował [concept_klimt_painting_tradition] podczas swojej nieobecności. [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetSheHe|U] może studiować wyłącznie style artystyczne, których wcześniej nie znał. Taka podróż trwa zazwyczaj rok, ale mogą pojawić się przeszkody lub okazje, które wydłużą pobyt."
 klimt.401.g: "Klasycyzm."
 klimt.401.h: "Romantyzm."
 klimt.401.i: "Realizm."
 klimt.401.j: "Impresjonizm."
 klimt.401.k: "Ekspresjonizm."
 klimt.401.l: "Secesja."
 klimt.401.m: "Nieważne."
 klimt.402.t: "Przybycie do [SCOPE.sState('klimt_center_of_art_scope').GetCityHubName]"
 klimt.402.d: "Dobre wieści! [ROOT.Var('klimt_painter_var').GetCharacter.GetFullName] przybył do [SCOPE.sState('klimt_center_of_art_scope').GetCityHubName]. [ROOT.Var('klimt_painter_var').GetCharacter.GetSheHe|U] wciąż szuka wolnego pokoju i wkrótce rozpocznie [ROOT.Var('klimt_painter_var').GetCharacter.GetHerHis] naukę."
 klimt.402.f: ""
 klimt.402.g: "Ah... [SCOPE.sState('klimt_center_of_art_scope').GetCityHubName]"
 klimt.403.t: "[ROOT.Var('klimt_painter_var').GetCharacter.GetLastName] wraca z podróży artystycznej"
 klimt.403.f: "„Sztuka jest sztuką tylko wtedy, gdy jest celem samym w sobie, gdy jest całkowicie wolna i pozostawiona samej sobie, gdy nie uznaje żadnych wyższych praw poza własnymi — prawami prawdy i piękna”. -Ludwig Feuerbach"
 klimt.403.g: "A więc ta cała podróż nie była tylko dla przyjemności?"
 klimt.411.t: "Malarze we własnym gronie"
 klimt.411.d: "[ROOT.Var('klimt_painter_var').GetCharacter.GetFullName] poznał podczas podróży edukacyjnej malarza z [SCOPE.sCharacter('klimt_fellow_painter').GetHomeCountry.GetName]. Obaj uznali się za równorzędnych kolegów po fachu. [SCOPE.sCharacter('klimt_fellow_painter').GetFullName] wydaje się utalentowanym i towarzyskim człowiekiem."
 klimt.411.f: "Jeśli kilka krajów wyśle malarzy na podróż edukacyjną w tym samym czasie, mogą oni przypadkowo się spotkać, co może przynieść pozytywne efekty synergii. Rywalizacja i wzajemna niechęć mogą wtedy szybko ustąpić miejsca wspólnemu entuzjazmowi dla sztuki."
 klimt.411.g: "Powinni wymienić się wiedzą artystyczną."
 klimt.411.h: "Z pewnością mogą nauczyć się czegoś od siebie nawzajem, poznając swoje techniki."
 klimt.411.i: "Ta znajomość przyda się w świecie sztuki, ponieważ będą mogli wzajemnie się wspierać."
 klimt.421.t: "Śladami Gigantów"
 klimt.421.d: "Nasz malarz napisał z [ROOT.Var('klimt_painter_var').GetCharacter.GetHerHis] miejsca nauki, że [ROOT.Var('klimt_painter_var').GetCharacter.GetSheHe] już widzi [ROOT.Var('klimt_painter_var').GetCharacter.GetHerHis] przyszłość w pełnych chwały wizjach. [ROOT.Var('klimt_painter_var').GetCharacter.GetSheHe] potrzebuje jednak więcej czasu i pieniędzy."
 klimt.421.f: "W Rzymie [ROOT.Var('klimt_painter_var').GetCharacter.GetFullName] styka się z niektórymi z najważniejszych malarzy w historii sztuki, a także z pozostałościami rzymskiej architektury. Wielu podróżników odwiedzających Rzym na przestrzeni wieków nawiązywało szczególną więź z tym miastem i jego historią. Pragnienie podążania śladami klasyków poruszyło niejednego artystę. Ambicja [ROOT.Var('klimt_painter_var').GetCharacter.GetLastName] rośnie — pragnie pewnego dnia stać się równie wielkim artystą jak jeden z [ROOT.Var('klimt_painter_var').GetCharacter.GetHerHis] idoli. Może to graniczyć z megalomanią, ale przede wszystkim potrzeba czasu, cierpliwości i dalszych studiów, jak [ROOT.Var('klimt_painter_var').GetCharacter.GetSheHe] napisał w liście."
 klimt.421.g: "[ROOT.Var('klimt_painter_var').GetCharacter.GetLastName] powinien poświęcić [ROOT.Var('klimt_painter_var').GetCharacter.GetHerHis] czas na wzorowanie się na Michale Aniele i Rafaelu."
 klimt.421.h: "[ROOT.Var('klimt_painter_var').GetCharacter.GetLastName] powinien malować, a nie bujać w obłokach!"
 klimt.422.t: "Duch Romantyków"
 klimt.422.d: "[ROOT.Var('klimt_painter_var').GetCharacter.GetFullName] od kilku dni nie odpisuje z Bambergu. Najwyraźniej [ROOT.Var('klimt_painter_var').GetCharacter.GetSheHe] buja w obłokach."
 klimt.422.f: "Bamberg to nie tylko malownicze miasto z licznymi domami o konstrukcji szachulcowej i bogatym dziedzictwem barokowym, które zachęcają do romantycznego odpoczynku. Jest w tym mieście coś, co sprawiło, że stało się niezwykle atrakcyjne dla romantyków. Ludwig Tieck i Heinrich Wackenroder byli ważnymi przedstawicielami romantyzmu, którzy wprawdzie pochodzili z Berlina, ale zostali ukształtowani przez Frankonię. Oni również mniej interesowali się swoimi studiami, a bardziej samą krainą, jej mieszkańcami i bogatym dziedzictwem okolicznych miast. E. T. A. Hoffmann, kolejny romantyk pochodzący z Prus, przeżył przełom w swojej karierze literackiej podczas pięcioletniego pobytu w Bambergu. To, czym podróż do Włoch była dla Goethego, tym ten region Niemiec stał się dla młodych romantyków. W tutejszym krajobrazie kulturowym odnajdywali oni nie tylko nawiązania do wyidealizowanego niemieckiego średniowiecza, lecz także do obrazów Albrechta Dürera w Norymberdze oraz do katolicyzmu, którego duchowość przemawiała do romantyków bardziej niż zsekularyzowany protestantyzm."
 klimt.422.g: "Z życia nicponia..."
 klimt.423.t: "Nawrócenie"
 klimt.423.d: "Do tej pory [ROOT.Var('klimt_painter_var').GetCharacter.GetFullName] nie miał zbyt wiele wspólnego z wiarą. Jednak silny katolicyzm, z którym zetknął się zarówno w sztuce, jak i w życiu codziennym, poruszył coś w [ROOT.Var('klimt_painter_var').GetCharacter.GetHerHim]. Coraz bardziej [ROOT.Var('klimt_painter_var').GetCharacter.GetSheHe] odczuwa więź, której istnienia [ROOT.Var('klimt_painter_var').GetCharacter.GetSheHe] wcześniej nigdy by sobie nie wyobrażał. Zainspirowany tym, [ROOT.Var('klimt_painter_var').GetCharacter.GetSheHe] namalował [ROOT.Var('klimt_painter_var').GetCharacter.GetHerHis] pierwszy obraz religijny."
 klimt.423.f: "„Zobacz Bamberg i zostań katolikiem” — takie motto krążyło wśród niemieckich romantyków. W rzeczywistości niemiecki romantyzm był jedną z nielicznych epok, w których większy wpływ mieli myśliciele katoliccy niż protestanccy, w tym wielu konwertytów. Podobnie Rzym przywiódł na łono Kościoła również tych, którzy wcześniej wątpili w wiarę. Może się to wydawać zaskakujące w materialistycznej epoce, w której postęp i nauka odgrywały wiodącą rolę w społeczeństwie, ale to właśnie potrzeba przeciwstawienia się temu nurtowi ostatecznie zaprowadziła hedonistę do klasztoru."
 klimt.423.g: "Mam nadzieję, że to nie będzie jakiś kiczowaty obraz Madonny."
 klimt.423.tt: "[ROOT.Var('klimt_painter_var').GetCharacter.GetFullName] pozbywa się wszystkich negatywnych cech związanych z nałogami i przechodzi na #YELLOW Katolicyzm#!, jeśli [ROOT.Var('klimt_painter_var').GetCharacter.GetSheHe] nie jest jeszcze katolikiem."
 klimt.424.t: "Dbałość o Szczegóły"
 klimt.424.d: "[ROOT.Var('klimt_painter_var').GetCharacter.GetFullName] znalazł w [SCOPE.sState('klimt_center_of_art_scope').GetCityHubName] mistrza realizmu, który pomógłby mu udoskonalić [ROOT.Var('klimt_painter_var').GetCharacter.GetHerHis] technikę malarską. Zajmie to jednak wiele miesięcy, a honorarium jest wysokie."
 klimt.424.f: "„Malarstwo jest sztuką z natury konkretną i może polegać jedynie na przedstawianiu rzeczy rzeczywistych i istniejących”. -Gustave Courbet"
 klimt.424.g: "To może trochę potrwać, ale warto."
 klimt.424.h: "[ROOT.Var('klimt_painter_var').GetCharacter.GetLastName] powinien raczej skupić się na zdobyciu uznania mistrza."
 klimt.425.t: "Inspiracja bez granic"
 klimt.425.f: "„Od czasu pojawienia się impresjonizmu oficjalne salony, niegdyś utrzymane w brązach, stały się niebieskie, zielone i czerwone... Ale czy miętowe, czy czekoladowe, wciąż pozostają wyrobami cukierniczymi”. -Claude Monet"
 klimt.425.g: "Te nowe idee zainspirują go do stworzenia licznych obrazów."
 klimt.425.h: "Te nowe idee powinny zainspirować naszą rodzimą kulturę."
 klimt.426.t: "Życie Artysty"
 klimt.426.d: "Wyrafinowane życie w [SCOPE.sState('klimt_center_of_art_scope').GetCityHubName] również odcisnęło swoje piętno na [ROOT.Var('klimt_painter_var').GetCharacter.GetFullName]. [ROOT.Var('klimt_painter_var').GetCharacter.GetSheHe|U] często przesiaduje w barach i pubach, a także sięga po używki, aby zwiększyć [ROOT.Var('klimt_painter_var').GetCharacter.GetHerHis] potencjał twórczy. Bez odurzenia się raz czy dwa [ROOT.Var('klimt_painter_var').GetCharacter.GetSheHe] z trudem byłby w stanie wykonać [ROOT.Var('klimt_painter_var').GetCharacter.GetHerHis] pracę w tak krótkim czasie."
 klimt.426.f: "„Po pierwszym kieliszku widzisz rzeczy takimi, jakimi chciałbyś, żeby były.\nPo drugim widzisz je takimi, jakimi nie są.\nW końcu widzisz je takimi, jakimi są naprawdę,\na to najstraszniejsza rzecz na świecie”. -Oscar Wilde"
 klimt.426.g: "Jeśli to inspiruje [ROOT.Var('klimt_painter_var').GetCharacter.GetHerHis] twórczość, to w czym problem?"
 klimt.426.h: "W takim razie po prostu zajmie to więcej czasu."
 klimt.427.t: "Nałóg Artysty"
 klimt.427.d: "Docierają do nas niepokojące doniesienia z [SCOPE.sState('klimt_center_of_art_scope').GetCityHubName]. Uzależnienia [ROOT.Var('klimt_painter_var').GetCharacter.GetFullName] przybierają przerażające rozmiary. Najwyraźniej [ROOT.Var('klimt_painter_var').GetCharacter.GetSheHe] wykorzystuje swoją nieobecność, by oddawać się nałogom i rozpuście, co znacząco odbija się na [ROOT.Var('klimt_painter_var').GetCharacter.GetHerHis] zdrowiu."
 klimt.427.f: "Camille Pissarro, Henri de Toulouse-Lautrec, Paul Gauguin, Oscar Wilde i Charles Baudelaire – wszyscy padli ofiarą zatrucia absyntem. To samo dotyczy Vincenta van Gogha. Gabriele D'Annunzio z kolei poszukiwał erotycznych przygód. Jean Cocteau odkrył dla siebie opium i prowadził dziennik, w którym opisywał jego zażywanie oraz działanie. Fakt, że w wielu przypadkach te uzależnienia i nałogi prowadziły do samozniszczenia i przedwczesnej śmierci, stanowi jeden z tragicznych rozdziałów życia artystów."
 klimt.427.g: "Każdy artysta ma swój nałóg."
 klimt.427.h: "Musimy interweniować!"
 klimt.427.tt: "Podróż edukacyjna zostaje odwołana. [ROOT.Var('klimt_painter_var').GetCharacter.GetFullName] zostaje zatrzymany przez naszych agentów w [SCOPE.sState('klimt_center_of_art_scope').GetCityHubName] i sprowadzony z powrotem do [GetPlayer.GetName]. Tam przez następne sześć miesięcy będzie przechodził terapię odwykową."
 klimt.428.t: "[ROOT.Var('klimt_painter_var').GetCharacter.GetLastName] jest ponownie dostępny"
 klimt.428.d: "Po kilkumiesięcznej przerwie nasz malarz powrócił do [ROOT.Var('klimt_painter_var').GetCharacter.GetHerHis] codziennych obowiązków. [ROOT.Var('klimt_painter_var').GetCharacter.GetFullName] nie porzucił [ROOT.Var('klimt_painter_var').GetCharacter.GetHerHis] dotychczasowego stylu życia, ale przynajmniej udało się zapobiec czemuś gorszemu."
 klimt.428.f: "„Porwanie? Nie, nie, monsieur, to była interwencja. Porwanie przyniosłoby panu cierpienie, a interwencję podejmuje się wyłącznie dla pańskiego dobra... Jak to, nie wiemy, co jest dla pana najlepsze?”"
 klimt.428.g: "Miejmy nadzieję, że teraz wszystko wróci do normy."
 klimt.431.t: "Weduta"
 klimt.431.d: "Zainspirowany pięknem [ROOT.Var('klimt_painter_var').GetCharacter.GetHerHis] miasta goszczącego [SCOPE.sState('klimt_center_of_art_scope').GetCityHubName], nasz malarz rozpoczął podczas podróży edukacyjnej pracę nad mistrzowską wedutą. Może to jednak nieco wydłużyć [ROOT.Var('klimt_painter_var').GetCharacter.GetHerHis] pobyt."
 klimt.431.f: "Weduta to niezwykle szczegółowy, zazwyczaj wielkoformatowy obraz lub, częściej, rycina przedstawiająca panoramę miasta bądź inny widok. Malarzy tworzących weduty nazywa się wedutystami. W drugiej połowie XIX wieku bardziej osobiste „impresje” przedstawiające pejzaże miejskie zastąpiły dążenie do dokładności topograficznej, którą zaczęto osiągać za pomocą panoram malarskich, a później fotograficznych. Do najważniejszych malarzy wedut tego okresu należeli David Roberts i Eduard Gaertner."
 klimt.431.g: "Znakomity pomysł."
 klimt.431.h: "Skoncentruj się na nauce."
 klimt.432.t: "Koło Malarskie"
 klimt.432.d: "[ROOT.Var('klimt_painter_var').GetCharacter.GetFullName] został przyjęty do lokalnego koła artystycznego w [SCOPE.sState('klimt_center_of_art_scope').GetCityHubName] i uznany za jednego z jego członków."
 klimt.432.f: "„Muszę pozostać sam i mieć świadomość swojej samotności, aby móc w pełni kontemplować i odczuwać naturę. Muszę oddać się temu, co mnie otacza, muszę zjednoczyć się z moimi chmurami i skałami, aby być tym, kim jestem. Samotność jest niezbędna do mojego dialogu z naturą”. -Caspar David Friedrich"
 klimt.432.g: "Potrzebujemy uznania w świecie malarstwa."
 klimt.433.t: "Szybkie przyswajanie wiedzy"
 klimt.433.d: "Podczas [ROOT.Var('klimt_painter_var').GetCharacter.GetHerHis] podróży edukacyjnej w [SCOPE.sState('klimt_center_of_art_scope').GetCityHubName] nasz artysta robi szybsze postępy, niż oczekiwano. Być może [ROOT.Var('klimt_painter_var').GetCharacter.GetSheHe] będzie mógł wrócić wcześniej."
 klimt.433.f: "„Utalentowany człowiek robi to, co chce. Geniusz robi tylko to, co może”. -Eugène Delacroix"
 klimt.433.g: "Talent widać już na pierwszy rzut oka."
 klimt.434.t: "Marszand"
 klimt.434.d: "Podczas [ROOT.Var('klimt_painter_var').GetCharacter.GetHerHis] pobytu edukacyjnego [ROOT.Var('klimt_painter_var').GetCharacter.GetFullName] nawiązał kontakt z cenionym marszandem, który mógłby sprzedać kilka obrazów."
 klimt.434.f: "„Jestem uczciwym biznesmenem, traktującym swoją pracę z najwyższą powagą. Oszczerstwa konkurencji, jakobym sprzedawał falsyfikaty, wynikają wyłącznie z zazdrości. A teraz pozwoli pan, że zainteresuję pana tym obrazem? Prawdziwy Leonardo da Vinci: Dama z gronostajem sykstyńskim. Prawdziwy unikat! Taka okazja już się nie powtórzy!”"
 klimt.434.g: "Kup kilka obrazów."
 klimt.434.h: "Nie potrzebujemy zagranicznych dzieł drugiej kategorii."
 klimt.435.t: "Najnowsza Moda"
 klimt.435.d: "Podczas [ROOT.Var('klimt_painter_var').GetCharacter.GetHerHis] podróży edukacyjnej nasz artysta poznał najnowsze trendy w modzie, nowe style architektoniczne oraz nieznane dotąd [ROOT.Var('klimt_painter_var').GetCharacter.GetHerHis] formy rozrywki."
 klimt.435.f: "„Ci, którzy wracali z Anglii, opowiadali swoim zdumionym przyjaciołom, że mieszkańcy po drugiej stronie kanału La Manche, choć tak rozsądni, wciąż mają wielkie upodobanie do dziecinnych rozrywek. Młodzi ludzie bawią się tam, kopiąc skórzaną piłkę po łące, inni zaś odbijają piłkę ponad siatką czymś w rodzaju trzepaczki do dywanów. To szaleństwo przyciąga tłumy widzów. Wśród nich można spotkać nawet ludzi piastujących wysokie urzędy i cieszących się powszechnym szacunkiem, którzy niekiedy sami nie gardzą udziałem w tych zabawach”."
 klimt.435.g: "Powiew świeżości w kulturze."
 klimt.435.h: "Ale czy naprawdę warto ślepo podążać za duchem czasu?"
 alert_klimt_painter_trip_possible_alert_name: "Twój [concept_klimt_painter] mógłby zgłębić nowy Styl Artystyczny"
 klimt_painter_trip_possible_alert_setting_name: "#tooltip:[GetRawTextTooltipTag('mr_morgenroete_tt')] @mr_morgenroete_icon! #! Twój [concept_klimt_painter] mógłby zgłębić nowy Styl Artystyczny"
 klimt_great_painting_modifier: "Wspaniały Portret"
 klimt_excellent_taste_modifier: "Wyrafinowany Gust"
 klimt_disgusting_painting_modifier: "Odrażający Portret"
 klimt_disgusting_taste_modifier: "Odrażający Gust"
 klimt_art_censorship_modifier: "Cenzura Malarstwa"
 je_klimt_rossetti: "Bractwo Prerafaelitów"
 je_klimt_rossetti_reason: "Prerafaelici to grupa artystów, którzy w sztuce renesansowej Rafaela i Michała Anioła dostrzegali zerwanie z wcześniejszą tradycją artystyczną. Cenili przede wszystkim włoskie malarstwo trecenta i quattrocenta. Uważali się za ruch reformatorski. Ich sprzeciw był skierowany nie tyle przeciwko samym artystom renesansowym, ile przeciwko neoklasycystom, którzy brali z nich przykład. Szczególnie chętnie sięgali po tematykę średniowieczną. Jednym z najsłynniejszych przedstawicieli tego ruchu był Dante Gabriel Rossetti."
 je_klimt_fattori: "Macchiaioli"
 je_klimt_fattori_reason: "Macchiaioli byli wyjątkową włoską grupą artystyczną, która wyprzedziła niektóre innowacje impresjonizmu, choć w swoich czasach pozostawała w dużej mierze niedoceniona. Nazwa Macchiaioli pochodzi od włoskiego słowa macchia, oznaczającego plamę (innym jego znaczeniem są zarośla, makia). Najważniejszym przedstawicielem tego ugrupowania był Giovanni Fattori."
 je_klimt_barbizon: "Szkoła Barbizońska"
 je_klimt_barbizon_reason: "Szkoła Barbizońska powstała z inicjatywy grupy francuskich pejzażystów pod koniec pierwszej tercji XIX wieku. Artyści osiedlali się we wsi Barbizon, położonej w pobliżu lasu Fontainebleau. Kolonia artystyczna, założona przez Théodore'a Rousseau i istniejąca do około 1870 roku, wywarła znaczący wpływ na malarstwo pejzażowe w całej Europie, a zwłaszcza na rozwój impresjonizmu."
 klimt.501.t: "Prerafaelici"
 klimt.501.d: "Wraz z powstaniem Bractwa Prerafaelitów narodził się ruch sprzeciwiający się klasycyzmowi i realizmowi, a jednocześnie dążący do odnowy sztuki. Poparcie dla prerafaelitów mogłoby pomóc odkryć nowe talenty, ale stałoby to w sprzeczności ze stylem naszego obecnego malarza, [ROOT.Var('klimt_painter_var').GetCharacter.GetFullName]."
 klimt.501.f: "„Byłem tu już kiedyś,\nLecz kiedy i jak – nie umiem rzec:\nZnam trawę rosnącą za progiem,\nJej słodki, przenikliwy zapach,\nWestchnienia fal i światła migoczące wzdłuż brzegu”. -Dante Gabriele Rossetti"
 klimt.501.g: "Promuj Bractwo Prerafaelitów."
 klimt.501.h: "[ROOT.Var('klimt_painter_var').GetCharacter.GetLastName] jest o wiele lepszy"
 klimt.502.t: "Macchiaioli"
 klimt.502.d: "Dziś we Florencji powstało ugrupowanie artystyczne Macchiaioli. Choć jego wpływy są na razie niewielkie, inspiruje ono młodych artystów do poszukiwania nowych dróg w sztuce."
 klimt.502.f: "„Plama (macchia) to materialność brył ukazanych na tle światła”. -Giovanni Fattori"
 klimt.502.g: "A więc byli awangardą, zanim jeszcze pojawiła się awangarda?"
 klimt.503.t: "Szkoła Barbizońska"
 klimt.503.d: "Wraz z powstaniem koła malarzy pod przewodnictwem Théodore'a Rousseau w pobliżu Fontainebleau, malarstwo pejzażowe zyskało nowy impuls, który ożywił całe środowisko artystyczne."
 klimt.503.f: "„Jeśli mój obraz wiernie i bez zbędnego wyrafinowania oddaje prosty i prawdziwy charakter miejsca, w którym bywałeś, jeśli uda mi się... tchnąć własne życie w ten świat roślinności, wówczas usłyszysz jęk drzew smaganych zimowym wiatrem, nawoływania ptaków przyzywających swoje młode i ich rozpaczliwe krzyki, gdy zostaną rozdzielone. Poczujesz, jak drży stary zamek. Opowie ci, że podobnie jak ukochana przez ciebie żona, on również... przeminie i odrodzi się w niezliczonych postaciach... Nie chodzi o to, by z matematyczną dokładnością kopiować to, co się widzi, lecz by odczuwać i interpretować rzeczywisty świat, którego nieubłagane prawa trzymają nas w swym uścisku”. -Théodore Rousseau"
 klimt.503.g: "Wspaniałe Pejzaże!"
 klimt.601.t: "Śmierć [SCOPE.sCharacter('klimt_painter_scope').GetLastName]"
 klimt.601.d: "[SCOPE.sCharacter('klimt_painter_scope').GetFullName], malarz cieszący się ogromnym uznaniem zarówno w kraju, jak i za granicą oraz jedna z najwybitniejszych postaci naszego życia artystycznego, zmarł dzisiaj. Pozostawił po sobie pustkę, którą trudno będzie wypełnić."
 klimt.601.f: "26 czerwca 1835 roku Caspar David Friedrich doznał udaru mózgu, któremu towarzyszyły objawy paraliżu. Udał się na kurację do Cieplic, na którą mógł sobie pozwolić jedynie dzięki sprzedaży kilku obrazów na dwór rosyjskiego cara za pośrednictwem poety Żukowskiego. Po zakończeniu leczenia Friedrich powrócił do malowania, choć sprawiało mu to znaczne trudności. Mimo to w latach 1835–1836 powstał obraz olejny „Wybrzeże w świetle księżyca”. Do 1839 roku tworzył głównie rysunki sepią i akwarele, coraz rzadziej malując pejzaże, a coraz częściej sięgając po alegorie śmierci. W latach 1836 i 1838 Friedrich wysłał kilka rysunków wykonanych sepią na wystawy sztuki w Dreźnie. W ostatnim roku życia niemal całkowicie zaprzestał pracy twórczej. Zmarł 7 maja 1840 roku w Dreźnie, w wieku 65 lat, i został pochowany na Cmentarzu Trójcy Świętej."
 klimt.601.g: "Ale kto teraz namaluje [ROOT.Var('klimt_painter_var').GetCharacter.GetHerHis] portret pośmiertny?"
 klimt.602.f: "Z wiekiem Turner stawał się coraz bardziej ekscentryczny. Miał niewielu bliskich przyjaciół, a jednym z najważniejszych ludzi w jego życiu był ojciec, który mieszkał z nim przez 30 lat i pomagał mu w pracowni malarskiej. Śmierć ojca w 1829 roku głęboko nim wstrząsnęła. Od tamtej pory Turner miewał nawroty depresji. Zmarł na cholerę 19 grudnia 1851 roku w domu Sophii Caroline Booth przy Cheyne Walk w londyńskiej dzielnicy Chelsea. Został pochowany w katedrze św. Pawła, nieopodal malarza sir Joshuy Reynoldsa. Podobno jego ostatnie słowa brzmiały: „Słońce jest Bogiem” (a może „Syn jest Bogiem”?), choć autentyczność tej wypowiedzi pozostaje niepewna."
 klimt.603.f: "6 lutego 1848 roku rodzina Cole’ów uczestniczyła w porannym nabożeństwie w kościele episkopalnym św. Łukasza w Catskill. Po obiedzie Cole zaczął skarżyć się na osłabienie, a przed północą jego stan pogorszył się na tyle, że wezwano lekarza. Wkrótce pojawiły się objawy zapalenia opłucnej i przekrwienia płuc. Thomas Cole zmarł w głównym budynku posiadłości Cedar Grove w piątek, 11 lutego 1848 roku, o godzinie 20:00."
 klimt.604.f: "Zima na przełomie 1862 i 1863 roku była dla Delacroix wyjątkowo ciężka. Cierpiał na poważną infekcję gardła, która z każdym kolejnym miesiącem zdawała się nasilać. Podczas podróży do Champrosay spotkał w pociągu przyjaciela, lecz sama rozmowa wyczerpała go do tego stopnia, że opadł z sił. 1 czerwca wrócił do Paryża, aby skonsultować się z lekarzem. Dwa tygodnie później, 16 czerwca, poczuł się lepiej i powrócił do swojego wiejskiego domu. Jednak 15 lipca jego stan ponownie się pogorszył. Udał się do lekarza, który przyznał, że nie może już nic dla niego zrobić. W tym czasie Delacroix był w stanie jeść wyłącznie owoce. Świadomy powagi swojego stanu, sporządził testament, w którym zapisał upominek każdemu ze swoich przyjaciół. Swojej zaufanej gospodyni, Jenny Le Guillou, pozostawił sumę wystarczającą na utrzymanie, nakazując jednocześnie sprzedaż całego wyposażenia pracowni. W testamencie zawarł również zapis zabraniający jakiegokolwiek utrwalania jego wizerunku: „Czy to za pomocą maski pośmiertnej, rysunku, czy fotografii. Stanowczo tego zabraniam”. Delacroix zmarł 13 sierpnia."
 klimt.605.f: "W ostatnich latach życia wzrok Eckersberga zaczął się pogarszać. Z czasem zmusiło go to do całkowitego porzucenia malarstwa. Zmarł na cholerę 22 lipca 1853 roku w Kopenhadze, podczas wielkiej epidemii tej choroby. Został pochowany na kopenhaskim cmentarzu Assistens."
 klimt.901.t: "Firmament [GetPlayer.GetNameNoFlag]"
 klimt.901.d: "[GetPlayer.GetNameNoFlag] należy do czołowych państw w dziedzinie astronomii. Wybitne odkrycia [ROOT.Var('verrier_astronomer_var').GetCharacter.GetFullName] zainspirowały [ROOT.Var('klimt_painter_var').GetCharacter.GetLastName] do namalowania obrazu przedstawiającego nocne niebo i kosmos."
 klimt.901.f: "Przełomowe wydarzenia w dziejach narodu wpływają również na twórczość jego malarzy. Niezwykłe wydarzenia kulturalne, postęp technologiczny i odkrycia naukowe mogą inspirować artystów do uwieczniania ich na płótnie dla przyszłych pokoleń."
 klimt.901.g: "Przepiękne!"
 klimt.902.t: "Skarby Pacyfiku"
 klimt.902.d: "Powrót wyprawy z Pacyfiku pozostawił po sobie trwały ślad: do [GetPlayer.GetNameNoFlag] dotarły egzotyczne towary, fascynujące dzieła sztuki, nowe odkrycia oceanograficzne oraz dzikie zwierzęta. Zainspirowany tymi wydarzeniami [ROOT.Var('klimt_painter_var').GetCharacter.GetLastName] postanowił namalować obraz ukazujący ducha odkrywczości i pragnienie poznawania nieznanego, które cechują nasz naród."
 klimt.903.t: "Sztuka Orientalna"
 klimt.903.d: "Rosnąca liczba wypraw na Bliski Wschód rozbudziła w społeczeństwie entuzjazm dla nurtu artystycznego, który można określić mianem „Orientalizmu”. [ROOT.Var('klimt_painter_var').GetCharacter.GetLastName] również uległ fascynacji Orientem i namalował fantazyjny obraz inspirowany Baśniami z tysiąca i jednej nocy."
 klimt.904.t: "Impuls Nowej Ery"
 klimt.904.d: "[GetPlayer.GetNameNoFlag] znajduje się w awangardzie podboju przestworzy. Nowe maszyny, zarówno samoloty, jak i sterowce, coraz liczniej pojawiają się na niebie. Każdego dnia padają kolejne rekordy, a nasi piloci są uznawani za bohaterów narodowych. [ROOT.Var('klimt_painter_var').GetCharacter.GetLastName] uchwycił na płótnie ducha tej nowej ery, sławiąc triumf techniki, siły woli i bohaterstwa."
 klimt.905.t: "Portret z Tygrysem i Lwem"
 klimt.905.d: "Podczas ostatniej wizyty w ogrodzie zoologicznym [ROOT.Var('klimt_painter_var').GetCharacter.GetLastName] miał okazję zobaczyć z bliska egzotyczne zwierzęta, które [GetPlayer.GetNameNoFlag] sprowadziło już do stolicy z najdalszych zakątków świata. Profesor [ROOT.Var('ito_naturalist_var').GetCharacter.GetLastName], wykwalifikowany zoolog, oprowadził [ROOT.Var('klimt_painter_var').GetCharacter.GetHerHim|U] po ogrodzie i opowiedział wiele ciekawostek o jego mieszkańcach. Pod koniec wizyty [ROOT.Var('klimt_painter_var').GetCharacter.GetSheHe|U] namalował niezwykły autoportret."
 klimt.906.t: "Szkice Dinozaurów"
 klimt.906.d: "Zainspirowany sukcesami Prof. [ROOT.Var('dubois_paleontologist_var').GetCharacter.GetLastName], [ROOT.Var('klimt_painter_var').GetCharacter.GetLastName] spróbował tchnąć nowe życie w wymarłe gady na obrazie."
 klimt.907.t: "Tajemnice Dżungli"
 klimt.907.d: "Archeologiczne odkrycia na Jukatanie oraz pełne przygód okoliczności, w jakich badacze tacy jak Prof. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] raz po raz odkrywali nowe stanowiska Majów, skłoniły [ROOT.Var('klimt_painter_var').GetCharacter.GetLastName] do uwiecznienia naszych wypraw na obrazach."
 klimt.908.t: "Portret [ROOT.Var('elgar_composer_var').GetCharacter.GetFullName]"
 klimt.908.d: "Niestrudzona praca Maestra [ROOT.Var('elgar_composer_var').GetCharacter.GetLastName] oraz kolejne wybitne osiągnięcia w jego twórczości zainspirowały [ROOT.Var('klimt_painter_var').GetCharacter.GetLastName] do namalowania portretu kompozytora. Nie tylko jego niezrównana muzyka, lecz także ten obraz przyczynią się do wzrostu jego sławy."
 klimt.911.t: "Portret [SCOPE.sCharacter('klimt_ruler_scope').GetPrimaryRoleTitle]?"
 klimt.911.d: "W oficjalnej galerii portretów głów państwa [GetPlayer.GetNameNoFlag] wciąż brakuje wizerunku [SCOPE.sCharacter('klimt_ruler_scope').GetFullName]. [ROOT.Var('klimt_painter_var').GetCharacter.GetFullName] jest uważany za oczywistego kandydata do godnego uwiecznienia władcy."
 klimt.911.f: "W każdej kadencji istnieje szansa, że malarz otrzyma zlecenie namalowania portretu szefa rządu lub głowy państwa. Powodzenie przedsięwzięcia zależy od renomy danego artysty."
 klimt.911.g: "Namaluj portret."
 klimt.911.h: "A jeśli coś pójdzie nie tak, kto za to zapłaci?"
 klimt.912.t: "N... niezwykły Portret"
 klimt.912.d: "[ROOT.Var('klimt_painter_var').GetCharacter.GetFullName] zaprezentował dziś publicznie namalowany przez [ROOT.Var('klimt_painter_var').GetCharacter.GetHerHis] portret [SCOPE.sCharacter('klimt_ruler_scope').GetPrimaryRoleTitle]. Podczas gdy inni artyści podkreślają jego „śmiałość” i „nowatorstwo”, część członków rządu jest nim przerażona."
 klimt.912.f: "„To obrzydliwe!”\n„To się nazywa kubizm, proszę pana”."
 klimt.912.g: "Sztuka to Sztuka."
 klimt.912.h: "Zniszczcie ten obraz!"
 klimt.913.t: "Wspaniały Portret"
 klimt.913.d: "[ROOT.Var('klimt_painter_var').GetCharacter.GetFullName] przeszedł [ROOT.Var('klimt_painter_var').GetCharacter.GetHerselfHimself] w tworzeniu portretu [SCOPE.sCharacter('klimt_ruler_scope').GetPrimaryRoleTitle]. Obraz namalowany przez [ROOT.Var('klimt_painter_var').GetCharacter.GetHerHis] od razu wzbudził zachwyt i jest uznawany za jedno z [ROOT.Var('klimt_painter_var').GetCharacter.GetHerHis] najlepszych dzieł."
 klimt.913.f: "„Prawie dwa metry wzrostu, muskuły jak u Herkulesa, zdecydowane spojrzenie niczym u Napoleona, twarz jak u Afrodyty – tak, zgadza się, to cały ja! Obsypcie artystę złotem!”"
