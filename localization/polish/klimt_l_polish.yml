 klimt.11.t: "Likwidacja Galerii"
 klimt.11.d: "Rząd nie jest już w stanie zagwarantować dalszego funkcjonowania Galerii Narodowej w [SCOPE.sState('klimt_gallery_state').GetName]. Podjęto decyzję o jej likwidacji i przeniesieniu najcenniejszych eksponatów do naszej stolicy."
 klimt.11.f: "Jeśli Galeria Narodowa znajduje się poza stolicą, zostanie automatycznie zlikwidowana, a jej zbiory trafią na wystawę w Galerii Narodowej w stolicy. Jeśli w stolicy nie ma jeszcze Galerii Narodowej, zostanie wybudowana nowa."
 klimt.11.g: "Ta znakomita kolekcja obrazów wzbogaci zbiory naszej Galerii Narodowej."
 klimt.11.h: "Wykorzystaj tę kolekcję jako podstawę do utworzenia nowej Galerii Narodowej."
 alert_klimt_painter_trip_possible_alert_hint: "Posiadasz [concept_klimt_painter], który mógłby zgłębić nowy Styl Artystyczny w [concept_artists_center_of_arts]. Aby wysłać go na naukę, kliknij przycisk w zakładce Artyści w #V Panelu Morgenröte#!."
 klimt.403.d: "[GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetFullName] powrócił z [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetHerHis] podróży edukacyjnej, przywożąc ze sobą nowe doświadczenia, wiedzę i inspiracje, którymi wzbogacił się podczas [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetHerHim] pobytu. [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetSheHe|U] zdołał również nieco poprawić [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetHerHis] reputację w świecie sztuki."
 klimt.425.d: "Od czasu [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetHerHis] przybycia do [SCOPE.sState('klimt_center_of_art_scope').GetCityHubName], [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetFullName] doznał setek i tysięcy wrażeń. Minęło dużo czasu, odkąd jedna idea następowała po drugiej. [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetLastName] dosłownie czuje, jak to miejsce pobudza [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetHerHim]."
 country_klimt_decorative_painting_tradition_add: "@klimt_painting_tradition! [concept_klimt_painting_tradition] rocznie"
 country_klimt_decorative_painting_tradition_add_desc: "Ilość [concept_klimt_painting_tradition] gromadzona przez Twój kraj każdego roku."
 alert_klimt_painter_trip_possible_alert_action: "$mr_alert_send_to_arts_artists$"
 klimt_has_x_painting_tradition_tooltip_trigger_tt: "#default_text [GetPlayer.GetName] posiada #V [SCOPE.GetValue('variable_amount')|0] lub więcej#! @klimt_painting_tradition! [concept_klimt_painting_tradition] (obecnie [GetPlayer.MakeScope.GetVariable('klimt_painting_tradition_var').GetValue|0]).#!"
 klimt.2.t: "[GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetLastName] ([GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetHerselfHimself]) poświęca się określonemu stylowi"
 klimt.2.d: "Po wielu latach, podczas których [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetFullName] gromadził doświadczenia i wrażenia, aby doskonalić [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetHerHis] technikę, [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetSheHe] w końcu wybiera preferowany styl."
 je_klimt_painter_trip_fail: "Jeśli [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetFullName] będzie musiał przedwcześnie zakończyć [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetHerHis] podróż, zostanie zastąpiony lub umrze podczas [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetHerHis] pobytu za granicą, [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetSheHe] nie zdobędzie nowej [concept_character_trait] związanej ze szkołą artystyczną."
 klimt.2.h: "Malarstwo klasyczne przewyższa wszystkie inne formy malarstwa."
 klimt.2.i: "Tylko romantyzm nadaje malarstwu duszę."
 klimt.2.j: "Czy realizm naprawdę ma sobie równych?"
 klimt.2.k: "Mam wrażenie, że impresjonizm powinien robić wrażenie."
 klimt.2.l: "Gugelhupf!"
 klimt.2.m: "Secesja to prawdziwa sztuka – i żadna inna."
