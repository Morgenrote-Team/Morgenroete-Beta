 andersson_anthropologist_desc: "Antropolodzy pomagają badać najdawniejsze dzieje ludzkości, od ewolucji w Afryce po człowieka epoki kamienia."
 andersson_anthropologist_experienced_desc: "Ten antropolog ma na swoim koncie osiągnięcia w badaniach nad najdawniejszymi dziejami ludzkości i uchodzi za autorytet naukowy."
 andersson_anthropologist_famous_desc: "Liczne osiągnięcia tego badacza w dziedzinie antropologii uczyniły go jedną z najważniejszych postaci tej dyscypliny na świecie."
