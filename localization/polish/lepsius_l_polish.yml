 je_lepsius_palmyra_reason: "#T Ruiny Palmyry w Syrii to fascynujące miejsce dla Archeologów.#!\n$mr_divider_for_je$\nCo miesiąc postęp prac będzie wzrastał w zależności od wielu różnych czynników. Na określonych etapach wykopalisk otrzymasz wydarzenie zapewniające [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts|q$')], doświadczenie oraz zmianę cechy obszaru, co zwiększy dochody z [concept_curtiss_tourism].\n$mr_divider_for_je$\n$lepsius_excavation_progress_loc$"
 je_lepsius_palmyra_1_loc: "Ruiny w większości pozostają w takim stanie, w jakim znajdowały się od wieków."
 je_lepsius_palmyra_2_loc: "Niedawne wykopaliska i częściowa restauracja Świątyni Bela przyciągnęły więcej osób pragnących odwiedzić to starożytne miejsce."
 je_lepsius_palmyra_3_loc: "Nasi Archeolodzy odkopali i odrestaurowali różne Świątynie, w tym Świątynię Bela, Dolinę Grobów z jej Grobowcami Wieżowymi oraz wiele innych miejsc. Przyciąga to coraz więcej zwiedzających."
