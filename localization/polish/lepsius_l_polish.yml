 alert_lepsius_troy_congress_possible_alert_hint: "Nasz Naród może zorganizować Kongres poświęcony ustaleniu, czy miasto odkryte przez Schliemanna jest Troją Homera. Otwórz Przegląd Uczonych w #V Panelu Morgenröte#!, aby go zorganizować."
