 country_lepsius_decorative_local_artifacts_add: "@lepsius_local_minor! #V Lokalny Artefakt#! z Projektów Archeologicznych"
 je_lepsius_angkor: "Serce Imperium Khmerów"
 je_lepsius_angkor_reason: "Ruiny Angkoru nigdy tak naprawdę nie popadły w całkowite zapomnienie. Były znane nie tylko miejscowej ludności, lecz także europejskim misjonarzom i podróżnikom we wczesnej epoce nowożytnej, którzy donosili o świątyniach ukrytych w dżungli. Aby dokładnie zbadać dzieje dawnego panowania Khmerów, należałoby najpierw całkowicie oczyścić ruiny z roślinności i przywrócić stanowisko archeologiczne do stanu umożliwiającego prowadzenie badań."
 je_lepsius_cliff: "Tajemnica Pueblo"
 je_lepsius_cliff_reason: "W przeciwieństwie do wielu innych mieszkańców zachodniej części Ameryki Północnej Indianie Pueblo prowadzą osiadły tryb życia. Mieszkają w kamiennych domach i niewielkich osadach, zajmując się rolnictwem. Krążą pogłoski, że na ich ziemiach znajduje się wiele opuszczonych miast. Czy to możliwe, że w tej części Ameryki istniała nieznana dotąd cywilizacja?"
 je_lepsius_guatavita: "Tajemnica Muisca"
 je_lepsius_guatavita_reason: "Jezioro Guatavita wciąż pozostaje owiane tajemnicą. Było ono uważane za święte przez lud Muisca, jeden z legendarnych ludów Kolumbii słynących z wyrobów ze złota, który utrzymywał bliskie kontakty z Inkami i którego sztuka złotnicza należała do najbardziej rozwiniętych w epoce prekolumbijskiej. Echa przeszłości wciąż rozbrzmiewają: w wodach jeziora mogą kryć się niezmierzone bogactwa. Niewielkie wykopaliska mogłyby rozwiać wszelkie wątpliwości."
 lepsius.78.t: "Pałac Klifowy"
 lepsius.78.d: "Archeolodzy poszukujący w Kolorado starożytnych artefaktów rdzennych mieszkańców Ameryki odkryli zupełnie przypadkowo osadę ludu Pueblo wykutą w skale. Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] natychmiast udał się na miejsce, aby dokładniej zbadać stanowisko."
 lepsius.78.f: "Cliff Palace to największa osada w skalnej niszy w Ameryce Północnej, położona na terenie Parku Narodowego Mesa Verde w Kolorado. Kompleks, wzniesiony przez przodków Indian Pueblo w latach 1190–1260 n.e., obejmuje ponad 150 pomieszczeń i 23 kivy, czyli ceremonialne pomieszczenia kultowe. Chociaż rdzenne społeczności zachowały więź z tym miejscem jako siedzibą swoich przodków, jego udokumentowane odkrycie przez Amerykanów europejskiego pochodzenia nastąpiło 18 grudnia 1888 roku. Ranczerzy Richard Wetherill i Charlie Mason dostrzegli ruiny z krawędzi kanionu, gdy podczas zamieci śnieżnej poszukiwali zaginionego bydła. Zdumieni rozmiarami kamiennych budowli ukrytych w niszy piaskowcowego urwiska, nazwali to miejsce „Cliff Palace”, czyli „Pałacem Klifowym”. Odkrycie to wzbudziło międzynarodowe zainteresowanie archeologią południowo-zachodniej części Stanów Zjednoczonych i przyczyniło się do objęcia tego miejsca ochroną federalną w 1906 roku."
 lepsius.79.t: "Angkor Odrestaurowany"
 lepsius.79.d: "Po wielu miesiącach prac Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] i jego asystenci odsłonili ruiny Angkoru, dawnej stolicy Khmerów. Na stanowisku archeologicznym można teraz ponownie prowadzić szczegółowe badania."
 lepsius.79.f: "„Różni się ona zaiste od wielkich dzieł klasycznych basenu Morza Śródziemnego, które od dawna budzą nasz podziw. Nie znajdziemy tu już majestatycznych kolumnad ani rozległych, spokojnych płaszczyzn znanych z Grecji czy Egiptu. Przeciwnie, mamy tu do czynienia z formami kunsztownymi, złożonymi i pełnymi niepokoju: nakładającymi się na siebie konstrukcjami, licznymi uskokami, labiryntami, galeriami skrytymi przed światłem dziennym, strzelistymi wieżami o poszarpanych konturach, piramidami o niezliczonych kondygnacjach i iglicach, niezwykłym bogactwem ornamentów i rzeźb oraz nieustanną grą światła i cienia, która wzbogaca całość, nie ujmując jej majestatu. Wszystko to przepięknie współgra z intensywnym światłem i bujną tropikalną roślinnością. Krótko mówiąc, jest to zupełnie inny rodzaj piękna”. – Louis Delaporte"
 lepsius.751.t: "Złota Tratwa z Siecha"
 lepsius.751.d: "Podczas wykopalisk odkryto tajemniczą i przepiękną tratwę wykonaną ze złota. Już teraz uznaje się ją za jeden z najważniejszych zabytków zaginionej kultury Muisca, a jej odkrycie przywraca do życia dawne legendy."
 lepsius.751.f: "W 1856 roku dwaj bracia z Siecha, Joaquín i Bernardino Tovar, częściowo osuszyli pobliską lagunę i odnaleźli złotą tratwę wotywną, którą powiązali z ceremonią opisaną w legendzie o El Dorado. Tratwa trafiła w ręce dyplomaty Salomóna Koppela, który sprzedał ją niemieckiemu Muzeum Etnologicznemu (Ethnologisches Museum). Niestety, po przybyciu do Niemiec została zniszczona w pożarze. Tratwa z Siecha jest jedną z zaledwie dwóch znanych złotych tratw pochodzących z kultury Muisca. Drugą, Tratwę z Pasca, odkryto dopiero 100 lat później."
 lepsius.751.g: "Będzie najwspanialszym eksponatem w naszej kolekcji."
 lepsius.751.h: "Nie mamy muzeum, w którym moglibyśmy ją przechowywać. Powinniśmy ją sprzedać w zamian za pieniądze, pomoc naukową i przysługę polityczną."
 lepsius.752.d: "Nie posiadając własnego muzeum, [SCOPE.sCountry('lepsius_raft_country').GetName] zwróciło się do nas z propozycją sprzedaży niezwykłego zabytku. Pochodzi on z Siecha, położonego nad brzegiem jeziora Guatavita, i przedstawia złotą tratwę ozdobioną misternie wykonanymi figurkami tworzącymi uroczysty orszak. Podczas gdy uczeni nalegają, abyśmy nabyli ten zabytek za wszelką cenę, politycy mają zastrzeżenia co do warunków umowy."
 lepsius.752.g: "Musimy zdobyć ten zabytek za wszelką cenę!"
 lepsius.752.h: "Nie możemy tego kupić."
 lepsius.734.t: "Ryton w Kształcie Głowy Byka"
 lepsius.734.d: "Podczas trwających wykopalisk w Pałacu w Knossos Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] dokonał sensacyjnego odkrycia, które rzuca zupełnie nowe światło na grecką mitologię związaną z Kretą i jej legendarnym królem Minosem."
 lepsius.734.f: "Ryton w kształcie głowy byka został odkryty przez sir Arthura Evansa w „Małym Pałacu” w Knossos na Krecie i pochodzi z okresu młodszych pałaców (ok. 1550–1500 p.n.e.). To ceremonialne naczynie wyrzeźbiono z jednego bloku czarnego steatytu. Jego oczy wykonano z kryształu górskiego i czerwonego jaspisu, nadając spojrzeniu niezwykły realizm, natomiast pysk misternie ozdobiono intarsją z białych muszli. Jako ryton służył do składania rytualnych ofiar płynnych: ciecz wlewano przez otwór w szyi naczynia, a wypływała ona przez otwór w nozdrzu byka. Symbolizując władzę i płodność, naczynie to ukazuje centralną rolę byka w religii minojskiej."
 lepsius_no_artifact_export_modifier: "Zakaz Wywozu Zabytków"
 building_lepsius_needle: "Igła Kleopatry"
 building_lepsius_obelisk: "Obelisk z Aksum"
 pmg_lepsius_obelisk: "Obelisk"
 pm_lepsius_obelisk: "Obelisk"
 je_lepsius_cleopatras_needle: "Igła Kleopatry"
 je_lepsius_cleopatras_needle_reason: "Przez stulecia dwa obeliski w Aleksandrii, znane jako „Igły Kleopatry”, przyciągały zainteresowanie całego świata. Jeden z nich został już podarowany Wielkiej Brytanii, choć Londynowi jak dotąd nie udało się sprowadzić tego obelisku. Być może moglibyśmy pójść za tym przykładem i zapytać władze Egiptu, czy zechciałyby przekazać nam drugą „Igłę”? Aby jednak osiągnąć ten cel, musielibyśmy oczywiście stać się jednym z czołowych państw w dziedzinie egiptologii."
 je_lepsius_cleopatras_needle_fail: "Każde państwo ma prawo przetransportować Igłę Kleopatry."
 je_lepsius_cleopatras_needle_transport: "Igła Kleopatry – Transport"
 je_lepsius_cleopatras_needle_transport_reason: "Transport obelisku jest znacznie trudniejszym przedsięwzięciem, niż mogłoby się wydawać. Nic dziwnego, że Francuzi poprzestali na jednym, który stoi na placu Zgody w Paryżu – drugi obelisk, który im obiecano, nadal znajduje się w Luksorze."
 je_lepsius_cleopatras_needle_transport_success: "Gdy obelisk dotrze do stolicy, Archeolog będzie musiał go odrestaurować i przygotować, a Inżynier pomóc w jego ustawieniu.\n\n#R Ważne:#! Prace Archeologa nad renowacją oraz prace Inżyniera nad ponownym wzniesieniem obelisku rozpoczną się dopiero po jego przybyciu."
 je_lepsius_ishtar_gate: "Brama Isztar"
 je_lepsius_ishtar_gate_reason: "Już w 1815 roku Claudius Rich sporządził plan topograficzny ruin Babilonu. Już wtedy przypuszczał, że ogromny kopiec może kryć pozostałości pałacu, a nawet Wieży Babel. Jak wiele z tego kompleksu pałacowego przetrwało i czy uda się wydobyć z niego jakiekolwiek zabytki, pozostaje na razie niewiadomą. Współczesne badania mogłyby jednak rzucić światło na charakter tego kopca. Oczywiście powinniśmy również zadbać o uzyskanie pozwolenia na wywiezienie odkrytych zabytków do naszego kraju."
 je_lepsius_ishtar_gate_fail: "Dowolne państwo odkryło Bramę Isztar."
 je_lepsius_ishtar_gate_transport: "Brama Isztar – Transport"
 je_lepsius_ishtar_gate_transport_reason: "Po tym, jak wyprawa do Babilonii odzyskała pozostałości legendarnej Bramy Isztar, przedłużyliśmy nasze Pozwolenie na Wykopaliska, aby umożliwić transport babilońskich cegieł do naszego muzeum."
 je_lepsius_ishtar_gate_transport_success: "Aby przywrócić bramie dawną świetność, potrzeba łącznie 200 000 cegieł. Przewiduje się, że każdego roku dotrze do nas około 20 000 cegieł, o ile nie wystąpią żadne problemy. Kolejne transporty będą docierać do nas tylko tak długo, jak długo będziemy kontynuować wykopaliska w Babilonii.\n\n#R Ważne:#! Prace Archeologa nad renowacją oraz prace Inżyniera nad rekonstrukcją rozpoczną się dopiero po dostarczeniu co najmniej 100 000 cegieł."
 je_lepsius_piedras_negras: "Stela z Piedras Negras"
 je_lepsius_piedras_negras_reason: "Piedras Negras to ważne miasto Majów na terenie Gwatemali, zamieszkane już od VII wieku p.n.e. Było niezależnym miastem-państwem, które przeżywało okres rozkwitu kulturalnego, szczególnie między VII a IX wiekiem n.e., i słynie z licznych monumentalnych stel. Być może uda nam się pozyskać wyjątkowo cenny okaz do naszego muzeum?"
 je_lepsius_piedras_negras_fail: "Dowolne państwo transportuje Stelę z Piedras Negras do swojego muzeum."
 je_lepsius_piedras_negras_transport: "Stela z Piedras Negras – Transport"
 je_lepsius_piedras_negras_transport_reason: "W latach 30. XX wieku Muzeum Uniwersytetu Pensylwanii zorganizowało zakrojone na szeroką skalę wyprawy, których celem było przetransportowanie kilku wielotonowych stel z gęstej gwatemalskiej dżungli w niezwykle trudnych warunkach. Ponieważ nie było tam dróg, ogromne monolity trzeba było z wielkim trudem przewozić na drewnianych saniach i tratwach przez zdradliwe wody rzeki Usumacinta."
 je_lepsius_piedras_negras_transport_success: "Gdy Stela z Piedras Negras dotrze do stolicy, Archeolog będzie musiał ją odrestaurować i przygotować, a Inżynier pomóc w jej ustawieniu.\n\n#R Ważne:#! Prace Archeologa nad renowacją oraz prace Inżyniera nad rekonstrukcją rozpoczną się dopiero po przybyciu obelisku."
 je_lepsius_axum_obelisk_transport: "Obelisk z Aksum – Transport"
 je_lepsius_axum_obelisk_transport_reason: "Z historycznego punktu widzenia transport obelisku z Aksum do Rzymu i jego ponowne ustawienie w 1937 roku były ogromnym przedsięwzięciem. Obelisk zabezpieczono i ustawiono na miejscu za pomocą metalowych prętów umieszczonych wewnątrz steli."
 je_lepsius_axum_obelisk_transport_success: "Gdy obelisk dotrze do stolicy, Archeolog będzie musiał go odrestaurować i przygotować, a Inżynier pomóc w jego ustawieniu.\n\n#R Ważne:#! Prace Archeologa nad renowacją oraz prace Inżyniera nad rekonstrukcją rozpoczną się dopiero po przybyciu obelisku."
