 notification_lepsius_ishtar_double_transport_notification_desc: "Do muzeum dotarła dziś wyjątkowo duża liczba cegieł potrzebnych do odbudowy Bramy Isztar. Najwyraźniej załadunek w Mezopotamii przebiega sprawniej, niż oczekiwano. Otrzymujemy #G 40.000#! #V Cegieł z Bramy Isztar#!."
