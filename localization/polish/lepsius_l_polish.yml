 lepsius_archaeologist: "Archeolog"
 lepsius_archaeologist_desc: "Ten uczony interesuje się starożytnymi językami, zaginionymi cywilizacjami i cennymi artefaktami, aby odtworzyć przeszłość."
 lepsius_archaeologist_experienced: "Doświadczony Archeolog"
 lepsius_archaeologist_experienced_desc: "Ta postać dokonała kilku ważnych odkryć archeologicznych i cieszy się wysoką reputacją."
 lepsius_archaeologist_famous: "Sławny Archeolog"
 lepsius_archaeologist_famous_desc: "Ten doskonale zorientowany archeolog jest znany na całym świecie dzięki licznym przygodom i cieszy się międzynarodową reputacją."
 je_lepsius_letter_to_rosellini: "List Lepsiusa do Roselliniego"
 je_lepsius_letter_to_rosellini_reason: "Karl Richard Lepsius, młody i ambitny filolog, jest u progu przełomu. Wykorzysta swoją metodę, aby udoskonalić podstawy rozszyfrowywania hieroglifów przez Champolliona — a tym samym zrewolucjonizować badania archeologiczne."
 je_lepsius_stephens_catherwood_expedition: "Wyprawa Stephensa i Catherwooda"
 je_lepsius_stephens_catherwood_expedition_reason: "Ambasador w Ameryce Środkowej, John Lloyd Stephens, wyraził zainteresowanie odwiedzeniem Półwyspu Jukatan. Artysta Frederik Catherwood chce towarzyszyć mu podczas wyprawy do tajemniczych ruin w dżungli. To przedsięwzięcie może stać się kwestią narodowego prestiżu, pod warunkiem że stworzymy dla niego odpowiednie ramy."
 je_lepsius_decipherment_akkadian: "Odczytanie języka akadyjskiego"
 je_lepsius_decipherment_akkadian_reason: "Nie tylko odczytanie hieroglifów trzymało ekspertów w napięciu przez dziesięciolecia. Starożytny język perski i pismo klinowe nie są już tajemnicą dla naszych uczonych. Wyprawa Austena Henry'ego Layarda do Nimrud wywołała niemałe poruszenie i wzbudziła zainteresowanie opinii publicznej. Po niedawnym odkryciu kolosalnej, wielojęzycznej inskrypcji w Behistun nadszedł czas na kolejny projekt: odczytanie najstarszych języków starożytnej Mezopotamii. Otworzyłoby to zupełnie nowe możliwości dla archeologii."
 je_lepsius_support_schliemann: "Heinrich Schliemann i marzenie o Troi"
 je_lepsius_support_schliemann_reason: "Heinrich Schliemann jest niemieckim przedsiębiorcą i samoukiem, który podróżował po świecie i zgromadził pokaźną fortunę. Jednak od młodości jego prawdziwą pasją były eposy homeryckie. Schliemann jest przekonany, że starożytna Troja nie jest bajką. Wciąż szuka zwolenników."
 je_lepsius_machu_picchu: "Dziedzictwo Inków"
 je_lepsius_machu_picchu_reason: "Dzięki najnowszej technologii i najbardziej zaawansowanym metodom badawczym nawet najbardziej niedostępne miejsca na świecie nie są już tajemnicą dla ludzi początku XX wieku. W szczególności wynalezienie samolotu ogromnie pomogło w mapowaniu wcześniej odległych regionów. Być może ostatnie tajemnice dawno zaginionych cywilizacji mogłyby wreszcie zostać wyjaśnione."
 je_lepsius_epic_of_gilgamesh: "Epos o Gilgameszu"
 je_lepsius_epic_of_gilgamesh_reason: "Epos o Gilgameszu jest treścią grupy dzieł literackich pochodzących głównie z obszaru Babilonii i zawiera jeden z najstarszych zachowanych zapisów pisanych. Epos o Gilgameszu w różnych wersjach jest najbardziej znanym dziełem literatury akadyjskiej i sumeryjskiej. Epos opowiada historię Gilgamesza, króla Uruk, jego czynów i przygód, jego przyjaźni z Enkidu, jego śmierci oraz poszukiwania nieśmiertelności przez Gilgamesza. #T Do odtworzenia podstawowej wersji potrzebnych jest pięć fragmentów eposu.#!"
 je_lepsius_epic_of_gilgamesh_success: "Znajdź co najmniej #G 5#! @lepsius_gilgamesh_fragment! fragmentów Eposu o Gilgameszu, aby stworzyć jego podstawową rekonstrukcję."
