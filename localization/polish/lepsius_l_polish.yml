 andersson_state_trait_erectus_cave: "Prehistoryczna Jaskinia"
 andersson_state_trait_paranthropus_cave: "Prehistoryczna Jaskinia"
 andersson_anthropology_tech: "Antropologia"
 andersson_anthropology_tech_desc: "Paleoantropologia, zwana też po prostu antropologią, jest gałęzią paleontologii i antropologii zajmującą się poznawaniem wczesnego rozwoju człowieka anatomicznie współczesnego, czyli procesu hominizacji. W tym celu odtwarza ewolucyjne linie pokrewieństwa w obrębie rodziny człowiekowatych na podstawie świadectw biologicznych (takich jak skamieniałe szczątki szkieletowe, fragmenty kości i odciski stóp) oraz kulturowych (takich jak narzędzia kamienne, artefakty i pozostałości osad)."
 lepsius.2105.t: "Skarb z Hildesheim"
 lepsius.2105.d: "Archeolodzy odkryli w Hildesheim pokaźny skarb ze srebra. Ku ich zaskoczeniu składa się on z licznych cennych rzymskich artefaktów!"
 lepsius.2105.f: "Skarb z Hildesheim, odkryty 17 października 1868 roku przez pruskich żołnierzy w pobliżu Galgenbergu, pozostaje jednym z najważniejszych znalezisk rzymskiego srebrnictwa poza granicami cesarstwa. Składa się z około 70 kunsztownych srebrnych naczyń, w tym słynnej Czary z Minerwą, pochodzących głównie z I wieku n.e. Ten zespół zabytków jest arcydziełem rzemiosła epoki Augusta, lecz jego odkrycie wywołało gorące spory naukowe i nacjonalistyczne. Początkowo często wiązano skarb z bitwą w Lesie Teutoburskim (9 rok n.e.), przypuszczając, że stanowił zaginiony bagaż rzymskiego wodza Warusa. Późniejsi badacze uznawali go za dar dyplomatyczny lub podróżny serwis stołowy wysokiego rangą oficera."
 lepsius.2105.g: "Rzymskie srebro w sercu Germanii?"
 lepsius.2115.t: "Skarb Amudarski"
 lepsius.2115.d: "Nad brzegami Oksusu archeolodzy odkryli spektakularny złoty skarb, odzwierciedlający przepych starożytnego Imperium Perskiego."
 lepsius.2115.f: "Skarb Amudarski to najważniejszy odkryty dotąd zbiór wyrobów perskiego złotnictwa z epoki Achemenidów. Odnaleziony około 1877 roku w pobliżu rzeki Oksus, na terenie dzisiejszego Tadżykistanu, składa się z około 180 złotych i srebrnych przedmiotów oraz ponad 200 monet. Zbiór ukazuje niezwykłe połączenie perskich, scytyjskich i greckich wpływów artystycznych. Do najważniejszych zabytków należą słynna miniatura złotego rydwanu, misternie wykonane naramienniki ze skrzydlatymi gryfami oraz liczne plakietki wotywne przedstawiające kapłanów i wojowników. Zanim skarb trafił do Muzeum Brytyjskiego, został ocalony z rąk bandytów przez brytyjskiego oficera. Stanowi ważne źródło wiedzy o bogactwie i kunszcie artystycznym Imperium Achemenidów, odzwierciedlając rozległe sieci handlowe i przenikanie się kultur starożytnego świata perskiego. Jego odkrycie dostarczyło badaczom pierwszych znaczących materialnych świadectw legendarnego przepychu tego imperium."
 lepsius.2115.g: "Te wspaniałe eksponaty zasługują na własną salę w muzeum!"
 lepsius.2135.t: "Posąg Xōchipilli"
 lepsius.2135.d: "Miejscowi znaleźli starożytny posąg wśród skał wulkanicznych. Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] jest zachwycony: być może to najlepiej zachowany posąg z Imperium Azteków!"
 lepsius.2135.f: "Wyrzeźbiona w wulkanicznym andezycie postać siedzącego mężczyzny, odkryta w latach 80. XIX wieku na zboczach wulkanu Popocatépetl, szybko stała się przedmiotem spekulacji dotyczących cywilizacji Azteków. Posąg przedstawia mężczyznę siedzącego w rytualnej pozycji ze skrzyżowanymi nogami na bogato zdobionym postumencie. Całe ciało postaci oraz tron pokrywają misternie rzeźbione reliefy stylizowanych kwiatów i motyli, wykazujące uderzające podobieństwo do roślin halucynogennych z wyżyn Meksyku. Lekko odchylona do tyłu głowa, szeroko otwarte oczy i nieznacznie rozchylone usta sprawiają wrażenie ekstatycznego transu lub rozmowy z bóstwem. Rysy twarzy przypominające maskę oraz motywy kwiatowe — w tym przedstawienia wilca i tytoniu — skłoniły badaczy do utożsamienia postaci z „Księciem Kwiatów”, bogiem Xōchipilli, który patronował tańcowi, pieśniom i świętym snom Azteków."
 lepsius.2135.g: "Ten posąg jest upiorny, niepokojący, fascynujący i wspaniały."
 lepsius.2145.t: "Kirys z Ksour Essef"
 lepsius.2145.d: "Archeolodzy dokonali zdumiewającego odkrycia podczas wykopalisk w pobliżu starożytnej Kartaginy."
 lepsius.2145.f: "Kirys z Ksour Essef to starożytny element uzbrojenia ochronnego, odkryty w 1909 roku w punickim grobowcu w pobliżu Ksour Essef w Tunezji. Ten brązowy napierśnik, wyróżniający się anatomicznym modelowaniem i bogatymi rytowaniami, jest arcydziełem rzemiosła południowoitalskiego lub kampańskiego z III wieku p.n.e. Kirys zdobią wizerunki punickiej bogini Tanit, gryfów oraz motywy roślinne, symbolizujące ochronę i pozycję społeczną. Tradycyjnie wiąże się go z drugą wojną punicką. Wielu badaczy uważa, że należał do wysokiego rangą oficera armii Hannibala i mógł zostać pozyskany podczas kampanii w Italii."
 lepsius.2145.g: "Starożytna italska zbroja na ziemiach punickich!"
 lepsius.2155.t: "Kocioł z Gundestrup"
 lepsius.2155.d: "W Himmerlandzie na Jutlandii archeolodzy niespodziewanie odnaleźli wspaniały celtycki artefakt."
 lepsius.2155.f: "Kocioł z Gundestrup, odkryty w 1891 roku na torfowisku w Danii, jest największym znanym zabytkiem srebrnictwa epoki żelaza. Naczynie składa się z kilku srebrnych płyt, pierwotnie złoconych, ozdobionych wypukłymi reliefami przedstawiającymi złożone sceny mitologiczne. Jego odkrycie zdumiało świat archeologii, ponieważ znaleziono go daleko na północ od głównych ziem Celtów. Kocioł powstał prawdopodobnie w regionie dolnego Dunaju, na terenie dzisiejszej Rumunii lub Bułgarii, wykonany przez trackich złotników dla celtyckich odbiorców. Pod koniec XIX i na początku XX wieku stał się jednym z najważniejszych zabytków służących poznaniu dawnych europejskich praktyk religijnych oraz rozległych, wzajemnie powiązanych sieci handlowych, które rozciągały się od Bałkanów po Morze Północne."
 lepsius.2155.g: "Czy nadal można w nim ugotować zupę?"
 lepsius.2185.t: "Mechanizm z Antykithiry"
 lepsius.2185.d: "Poławiacze gąbek odkryli wrak statku u wybrzeży Antykithiry. Jednostka z czasów rzymskich kryje nie tylko cenne dla archeologii artefakty, lecz także urządzenie, które wywraca do góry nogami naszą wiedzę o starożytności hellenistycznej."
 lepsius.2185.f: "Mechanizm z Antykithiry jest powszechnie uznawany przez historyków i naukowców za najstarszy znany przykład komputera analogowego. Pochodzi z II lub początku I wieku p.n.e., a urządzenia o porównywalnej złożoności nie pojawiły się w świecie zachodnim przez kolejne 1,500 lat. Mechanizm składał się pierwotnie z co najmniej 30 brązowych kół zębatych, umieszczonych w drewnianej obudowie wielkości zegara kominkowego. Napędzano go ręczną korbą, a na jego tarczach widniały greckie inskrypcje. Pochodzenie mechanizmu pozostaje przedmiotem ożywionej debaty naukowej. Choć jego twórca jest nieznany, istnieje kilka teorii — niektóre sugerują nawet związek z Archimedesem z Syrakuz."
 lepsius.2185.g: "Kompas? Przyrząd astronomiczny? Wehikuł czasu?"
 lepsius.2205.t: "Latający Koń z Gansu"
 lepsius.2205.d: "Nasi badacze odkryli na północnych rubieżach dawnego cesarstwa być może najwspanialszą figurę z epoki Han."
 lepsius.2205.f: "Latający Koń z Gansu, znany również jako Galopujący Koń Stąpający po Lecącej Jaskółce, to słynna rzeźba z brązu z okresu Wschodniej Dynastii Han (25–220 n.e.). Odkryta w 1969 roku w grobowcu generała w Leitai, stanowi szczytowe osiągnięcie starożytnego chińskiego odlewnictwa brązu. Przedstawia potężnego „niebiańskiego konia” — legendarnej rasy fergańskiej — uchwyconego w pełnym galopie. W mistrzowskim połączeniu równowagi i dynamiki koń wspiera się na jednym kopycie opartym na lecącej jaskółce, co sugeruje prędkość przewyższającą nawet najszybszego ptaka. Podczas pierwszych badań rzeźbę okrzyknięto symbolem Jedwabnego Szlaku, odzwierciedlającym potęgę militarną i wymianę kulturową, które towarzyszyły ekspansji Chin."
 lepsius.2205.g: "Jest szybszy i bardziej elegancki niż jakikolwiek ptak!"
 lepsius.2215.t: "Złote Korony Silla"
 lepsius.2215.d: "W Gyeongju, dawnej stolicy Królestwa Silla, archeolodzy odnaleźli i otworzyli królewskie grobowce. Dokonane w nich odkrycia są naukową sensacją!"
 lepsius.2215.f: "Złote Korony Silla należą do najwspanialszych skarbów starożytnej Korei. Większość z nich odkryto w królewskich grobowcach w Gyeongju. Choć pogłoski o złotych zabytkach krążyły od stuleci, pierwszy przełom naukowy nastąpił w 1921 roku, gdy podczas prac budowlanych przypadkowo odkryto Geumgwanchong (Grobowiec Złotej Korony). Wykonane ze złota wysokiej próby i ozdobione magatama (jadeitowymi paciorkami w kształcie przecinka), korony wyróżniają się pionowymi elementami przypominającymi drzewa oraz motywami poroża. Na początku XX wieku archeolodzy i historycy interpretowali te zdobienia jako symbole szamańskiej władzy królewskiej, dopatrując się w nich kulturowych związków ze stepowymi ludami Syberii i Azji Środkowej."
 lepsius.2215.g: "Te korony zasługują na honorowe miejsca na kolejnej wystawie."
 lepsius.2225.t: "Wojownik Haniwa"
 lepsius.2225.d: "Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] zaprezentował dziś wyjątkowy artefakt. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe|U] sam nazywa go „archeologicznym zwieńczeniem” [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] kariery. Zabytek już teraz uchodzi za wybitny przykład sztuki okresu Yamato."
 lepsius.2225.f: "Wojownik Haniwa to jeden ze słynnych typów glinianych rzeźb japońskiego okresu Kofun. Figury te ustawiano na szczytach wielkich kurhanów, aby chroniły zmarłych i wyznaczały świętą przestrzeń grobowca. Najsłynniejszego odkrycia dokonano w 1924 roku w Oizumi, w prefekturze Gunma. Ta wyjątkowo dobrze zachowana figura, Wojownik w Zbroi Keiko, stanowi rzadkie trójwymiarowe przedstawienie wyposażenia wojskowego z VI wieku, w tym zbroi lamelkowej i tradycyjnego długiego łuku. Zabytek, uznawany dziś za skarb narodowy, dostarczył historykom wiedzy o kształtującej się wojskowości państwa Yamato. Romantyczne umysły mogłyby dopatrywać się w tym żołnierzu swoistego „pradziadka” klasy samurajów."
 lepsius.2225.g: "Przeszłość Japonii nie jest już spowita mrokiem!"
 lepsius.2235.t: "Król-Kapłan"
 lepsius.2235.d: "Zespół archeologiczny dokonał najważniejszego dotąd odkrycia w badaniach nad Cywilizacją Doliny Indusu: odnalazł niewielką figurkę nieznanego mężczyzny w pozie medytacyjnej. Już teraz uchodzi ona za jeden z najważniejszych artefaktów Epoki Brązu."
 lepsius.2235.f: "Odkrycie niewielkiej, siedzącej postaci mężczyzny wyrzeźbionej w steatycie podczas wykopalisk w Mohendżo-Daro w latach 1925–26 szybko stało się punktem wyjścia do naukowych spekulacji na temat politycznej i religijnej struktury cywilizacji harappańskiej. Ten fragmentarycznie zachowany posążek, choć mierzy zaledwie 17.5 centymetra wysokości, wyróżnia się niezwykłą precyzją detali. Przedstawia brodatego mężczyznę ze starannie wypielęgnowanymi wąsami i półprzymkniętymi oczami, nadającymi mu wyraz kontemplacji lub medytacji. Postać nosi wzorzysty płaszcz przerzucony przez jedno ramię, ozdobiony motywami trójliścia, które wykazują uderzające podobieństwo do symboli religijnych znanych z ówczesnej Mezopotamii i Egiptu. Opaska na głowie i naramiennik sugerowały wysoką pozycję społeczną lub obrzędową, co skłoniło ówczesnych archeologów do nazwania postaci „Królem-Kapłanem”."
 lepsius.2235.g: "Oblicze zaginionego imperium."
 lepsius.2245.t: "Spoczywający Wisznu"
 lepsius.2245.d: "Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] ogłasza, że [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] odnalazł najwspanialszy brązowy posąg Buddy w całej Azji Południowo-Wschodniej. Fakt, że w rzeczywistości przedstawia on Wisznu, nie dociera do [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHim] w ferworze [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] zachwytu."
 lepsius.2245.f: "Spoczywający Wisznu z Zachodniego Mebonu to monumentalna rzeźba z brązu z XI wieku, pochodząca z Imperium Khmerów, odkryta w obrębie zbiornika Zachodni Baraj w Angkorze w Kambodży. Przedstawia Wisznu w pozie Anantaśajina — spoczywającego na wężu Śeszy w kosmicznym oceanie — i stanowi arcydzieło stylu Baphuon. O jej znaczeniu decydują rozmiary i symbolika. Jako jeden z największych dawnych posągów z brązu w Azji Południowo-Wschodniej świadczy o wyjątkowym kunszcie metalurgicznym Khmerów. Umieszczenie rzeźby pośrodku ogromnego sztucznego jeziora nadawało zbiornikowi religijny wymiar, czyniąc go materialnym wyobrażeniem hinduistycznego praoceanu i legitymizując boską władzę Króla. Fragmenty posągu wydobywano od 1936 roku, a zachowane tors i głowa należą dziś do najsłynniejszych skarbów Muzeum Narodowego Kambodży."
 lepsius.2245.g: "Budda czy Wisznu? Co za różnica, jego miejsce jest w muzeum!"
 lepsius.2255.t: "Obelisk z Aksum"
 lepsius.2255.d: "Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] prowadzi ostatnio intensywne badania nad tak zwanym „Obeliskiem” z Aksum. W [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] opinii jest to w rzeczywistości stela wyznaczająca miejsce pochówku. Archeolog uważa ją za jeden z najwspanialszych artefaktów starożytnego królestwa Aksum."
 lepsius.2255.f: "Obelisk z Aksum (znany również jako Stela 2) to granitowy monolit o wysokości 24 metrów, pochodzący z IV wieku n.e., będący świadectwem kunsztu rzemieślników Imperium Aksumskiego na terenie dzisiejszej Etiopii. Stelę zdobią kunsztowne „ślepe drzwi” i okna, naśladujące wielokondygnacyjny budynek. Pełniła ona funkcję grobowca dla przedstawicieli elit. Zabytek zyskał międzynarodowy rozgłos również za sprawą swojej współczesnej odysei: w 1937 roku został wywieziony do Rzymu jako łup wojenny na rozkaz Benita Mussoliniego. Dopiero po dziesięcioleciach zabiegów dyplomatycznych obelisk powrócił do Etiopii w trzech częściach w 2005 roku."
 lepsius.2255.g: "Dumny symbol naszych przodków!"
 lepsius.2255.h: "Przetransportujcie obelisk do [ROOT.GetCountry.GetCapital.GetCityHubName]!"
 lepsius.2265.t: "Płyty z Malden"
 lepsius.2265.d: "Podczas wykopalisk w jednym z głównych ośrodków kultury Missisipi archeolodzy dokonali zaskakującego odkrycia: po stuleciach światło dzienne znów ujrzały zachwycająco piękne wyroby z miedzi."
 lepsius.2265.f: "Płyty z Malden (znane również jako Skarb Wulfinga) to osiem miedzianych płyt zdobionych wypukłym reliefem, odkrytych w 1906 roku przez Raya Groominga w Malden w stanie Missouri. Te niezwykłe artefakty należą do kultury Missisipi (około 1200–1400 n.e.). Znaleziono je zakopane na polu, gdzie prawdopodobnie ukryto je dla bezpieczeństwa lub złożono jako ofiarę obrzędową. Płyty są arcydziełami metalurgii prekolumbijskiej, ozdobionymi złożonymi motywami ikonograficznymi Południowo-Wschodniego Kompleksu Ceremonialnego. Przedstawiają głównie Tancerza Sokoła — postać o ludzkiej sylwetce, ptasich cechach, skrzydłach i insygniach obrzędowych — uosabiającego potężną istotę nadprzyrodzoną lub szamańską przemianę."
 lepsius.2265.g: "Czy Ameryka była cywilizowana, zanim ją ucywilizowano?"
 lepsius.2275.t: "Skarb Quimbaya"
 lepsius.2275.d: "Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] odkrył prawdopodobnie największy dotąd złoty skarb w Kolumbii. Podczas wykopalisk wydobyto setki artefaktów. Wygląda na to, że [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] natrafił na skarb całej zaginionej cywilizacji."
 lepsius.2275.f: "Skarb Quimbaya to światowej sławy zbiór Prekolumbijskich artefaktów ze złota i tumbagi, wykonanych przez cywilizację Quimbaya na terenie dzisiejszej Kolumbii. Skarb, datowany głównie na okres od IV do X wieku n.e., odkryto w 1890 roku w pobliżu Filandii. Zbiór obejmuje około 122 przedmiotów, w tym biżuterię, figurki oraz naczynia rytualne zwane poporos, służące do przechowywania wapna. Przedmioty te świadczą o niezwykłym mistrzostwie w stosowaniu techniki odlewania na wosk tracony i wyróżniają się gładkimi, zaokrąglonymi powierzchniami oraz kunsztownymi, stylizowanymi postaciami ludzkimi. W 1893 roku rząd Kolumbii podarował skarb hiszpańskiej królowej regentce Marii Krystynie."
 lepsius.2275.g: "Nigdy nie widziałem tyle złota!"
 lepsius.2201.t: "Malowidła Grobowe z Epoki Han"
 lepsius.2201.d: "Wykopaliska w grobowcach wysoko postawionych osobistości z czasów Cesarstwa Han dostarczyły cennych informacji o życiu i codziennych zwyczajach w dawno minionych czasach."
 lepsius.2201.f: "Choć wiele artefaktów z epoki Han było już wcześniej znanych, odkrycie malowanych grobowców dynastii Han na początku XX wieku ujawniło rozległe cykle malowideł ściennych, które pozostawały ukryte od II wieku naszej ery. Malowidła te przedstawiają tętniące życiem sceny z codzienności: wystawne uczty, występy akrobatów i gwarne procesje rydwanów zaprzężonych w konie. Dowiodły one, że Chińczycy z epoki Han rozwinęli zaawansowane techniki przedstawiania perspektywy i malarstwa narracyjnego na długo przed nastaniem dynastii Tang. Intensywne barwniki — czerwienie, ochry i czernie — zachowały się w wyjątkowo dobrym stanie, stanowiąc jedne z najlepiej zachowanych przykładów wczesnego chińskiego malarstwa."
 lepsius.2201.g: "Nasza wiedza o społeczeństwie epoki Han była dotychczas niewystarczająca."
 lepsius.2202.t: "Wyroby Lakowe Dynastii Han"
 lepsius.2202.d: "Podczas ostatniego odkrycia archeolodzy wydobyli liczne wyroby lakowe."
 lepsius.2202.f: "Choć laki używano już od tysiącleci, dopiero w okresie panowania dynastii Han (206 r. p.n.e. – 220 r. n.e.) produkcja wyrobów lakowych przekształciła się w ogromną gałąź rzemiosła kontrolowaną przez państwo. Ważne odkrycia z początku XX wieku, szczególnie na północnych rubieżach cesarstwa, takich jak Lelang (na terenie dzisiejszej Korei Północnej), ujawniły niezwykłą trwałość i kunszt wykonania tych przedmiotów. Na dworze dynastii Han wyroby lakowe ceniono znacznie wyżej niż przedmioty z brązu, przede wszystkim za ich odporność na wysoką temperaturę, wilgoć i niszczenie. Przedmioty te — od pucharów do wina i szkatułek na kosmetyki po bogato zdobione trumny — zazwyczaj malowano w efektownych odcieniach czerwieni i czerni, ozdabiając je płynnymi, przypominającymi obłoki ornamentami oraz wizerunkami mitycznych stworzeń."
 lepsius.2202.g: "Więcej artefaktów na następną wystawę."
 lepsius.2203.t: "Ceramiczne Figurki Dynastii Han"
 lepsius.2203.d: "Podczas wykopalisk odnaleziono liczne przedmioty stanowiące wyposażenie grobowe. Duża liczba wyrobów ceramicznych sugeruje, że pochowana osoba była niezwykle zamożna. Szczególną uwagę zespołu przykuły figurki i miniaturowe domy."
 lepsius.2203.f: "Ceramiczne figurki z czasów dynastii Han, znane jako mingqi (przedmioty przeznaczone dla duchów), przedstawiają zarówno dworskie tancerki i piechurów, jak i niezwykle szczegółowe miniaturowe modele domów, spichlerzy oraz wież strażniczych. Dla archeologów tamtej epoki modele te miały nieocenioną wartość, ponieważ stanowiły jedyne zachowane świadectwo drewnianego budownictwa w stylu dynastii Han, którego rzeczywiste przykłady już dawno uległy zniszczeniu. Figurki i modele postrzegano jako kompletny mikrokosmos świata dynastii Han, mający zapewnić zmarłemu w życiu pozagrobowym w pełni funkcjonujący majątek, wyposażony we wszystko, co niezbędne — od zwierząt gospodarskich i kuchni po rozrywki."
 lepsius.2203.g: "Czy dałoby się z tego zbudować makietę miasta Chang'an?"
 lepsius.2204.t: "Sztuka Brązownicza Dynastii Han"
 lepsius.2204.d: "Podczas ostatnich wykopalisk archeolodzy odkryli skarb złożony z wyrobów z brązu pochodzących z czasów dynastii Han. Szczególny zachwyt badaczy wzbudziło pięknie zdobione naczynie rytualne ding."
 lepsius.2204.f: "Odkrycie skarbów z brązu pochodzących z epoki Han na przełomie XIX i XX wieku ujawniło cywilizację, która doprowadziła metalurgię do perfekcji, zarówno na potrzeby rytualne, jak i codziennego życia. Skarby te, odnajdywane często w północnych Chinach oraz na terenach przygranicznych, takich jak Gansu, zawierały bogato zdobione kadzielnice, lustra i zestawy naczyń, które pozostawały ukryte przez dwa tysiąclecia. Jednym z najbardziej charakterystycznych znalezisk jest Boshan Lu (kadzielnica górska), wykonana z brązu kadzielnica w kształcie świętej góry spowitej wirującą mgłą. Dla ówczesnych uczonych odkrycie masywnych lamp z brązu oraz naczyń na wino (hu) w grobowcach dynastii Han stanowiło dowód, że brąz pozostawał symbolem wysokiego statusu społecznego jeszcze długo po upowszechnieniu się żelaza."
 lepsius.2204.g: "Wspaniałe uzupełnienie naszych zbiorów muzealnych."
 lepsius.2211.t: "Artefakty ze Stawu Silla"
 lepsius.2211.d: "Po osuszeniu stawu w pobliżu dawnego pałacu pochodzącego z czasów Zjednoczonego Królestwa Silla archeolodzy odnaleźli w mule liczne artefakty z tamtej epoki."
 lepsius.2211.f: "W przeciwieństwie do uroczystych darów odnajdywanych w grobowcach przedmioty wydobyte z mułu zalegającego na dnie stawu stanowiły przede wszystkim pozostałości codziennego życia pałacowego i wystawnych uroczystości. Wśród najbardziej intrygujących znalezisk znalazły się pozłacane posążki Buddy z brązu, bogato zdobione dachówki (ebwadang) oraz niezwykłe drewniane kości do gry, używane podczas królewskich uczt. Artefakty te ukazywały styl życia pełen niezwykłego przepychu i artystycznego wyrafinowania. Odzwierciedlały również rolę Silli jako jednego z głównych punktów końcowych Jedwabnego Szlaku, gdzie wpływy artystyczne Chin dynastii Tang przenikały się z inspiracjami pochodzącymi nawet z odległej Persji."
 lepsius.2211.g: "Pozostałości Złotego Wieku."
 lepsius.2212.t: "Skarby Monet z Królestwa Silla"
 lepsius.2212.d: "Archeolodzy niemal przypadkiem odkryli ogromny skarb monet w jednym z prowincjonalnych miast Korei. Monety pochodzą przede wszystkim z czasów chińskiej dynastii Tang, potężnego sąsiada Zjednoczonego Królestwa Silla."
 lepsius.2212.f: "W starożytnej Korei handel opierał się zazwyczaj na wymianie towarów, wśród których szczególnie ważną rolę odgrywały tkaniny i zboże, lub na posługiwaniu się monetami w kształcie noży. Niemniej jednak istnieją liczne świadectwa używania monet zagranicznych. Zwłaszcza Chiny, jako potężny sąsiad Królestwa Silla, wywierały znaczny wpływ na sąsiednie państwa poprzez swój system monetarny, szczególnie za sprawą monet Wu Zhu, bitych od czasów dynastii Han. Ich następcą były monety Kaiyuan Tongbao z czasów dynastii Tang. Dzięki międzynarodowemu handlowi prowadzonemu wzdłuż Jedwabnego Szlaku liczne chińskie monety trafiały zatem do Korei."
 lepsius.2212.g: "Czy koreańskie, czy chińskie... monety są nasze."
 lepsius.2213.t: "Drzeworyty Dynastii Silla"
 lepsius.2213.d: "Podczas badań archeologicznych w pobliżu pagody badacze odkryli kilka tekstów buddyjskich. Pochodzą one z okresu Silla i zostały wydrukowane techniką drzeworytniczą."
 lepsius.2213.f: "Dokumenty te dowodzą, że Królestwo Silla już w VIII wieku opanowało technikę druku drzeworytniczego, co stwarzało teoretyczną możliwość masowego drukowania tekstów. Dla badaczy stanowią one zatem nie tylko cenne teksty religijne, lecz także świadectwo istnienia społeczeństwa o nieoczekiwanie wysokim poziomie rozwoju technologicznego."
 lepsius.2213.g: "Fascynujące!"
 lepsius.2214.t: "Grota Seokguram"
 lepsius.2214.d: "Listonosz powiadomił Instytut Archeologiczny o spektakularnym odkryciu w pobliżu starożytnej stolicy Gyeongju, które rzuca zupełnie nowe światło na okres panowania Królestwa Silla."
 lepsius.2214.f: "Grota Seokguram, monumentalna pustelnia stanowiąca część kompleksu świątynnego Bulguksa, została ponownie odkryta w 1909 roku przez miejscowego listonosza, który szukał schronienia przed burzą. Położona na górze Toham w Gyeongju, ta sztucznie wykuta w granicie grota, zbudowana w VIII wieku w okresie Zjednoczonego Królestwa Silla, popadła w zapomnienie i przez stulecia pozostawała częściowo zawalona oraz przysypana ziemią i gruzem. Grota jest uznawana za arcydzieło wschodniej sztuki buddyjskiej. W jej wnętrzu znajduje się monumentalny posąg Buddy Siakjamuniego, emanujący spokojem i otoczony misternie rzeźbionymi płaskorzeźbami przedstawiającymi strażników, bóstwa i uczniów Buddy. Na początku XX wieku odkrycie to stało się jednym z głównych przedmiotów zainteresowania archeologii okresu kolonialnego. Ówczesnych uczonych i inżynierów fascynowała wyrafinowana konstrukcja architektoniczna groty, w której zastosowano unikatową strukturę kopułową pozwalającą utrzymywać odpowiednią temperaturę i wilgotność."
 lepsius.2214.g: "Klejnot epoki Silla."
 lepsius.2221.t: "Figurki Haniwa"
 lepsius.2221.d: "Podczas niedawnych wykopalisk odkryto liczne ceramiczne figurki, które strzegły wejść do grobowców. Te gliniane figurki są niezwykle kruche."
 lepsius.2221.f: "Haniwa to nieszkliwione rzeźby ceramiczne charakterystyczne dla okresu Kofun (Yamato), tworzone specjalnie po to, by umieszczać je na szczytach monumentalnych kopców grobowych lub wokół nich. Te terakotowe figury strażnicze miały wyznaczać granice świętej przestrzeni grobowej i zapewniać jej ochronę. Powstające między III a VI wiekiem n.e. wyroby te ewoluowały od prostych cylindrycznych naczyń do skomplikowanych figur przedstawiających całe społeczne i materialne otoczenie zmarłego. Należały do pierwszych zabytków, które japońscy archeolodzy poddali naukowej klasyfikacji."
 lepsius.2221.g: "Niegdyś strzegły grobów, dziś zdobią muzea."
 lepsius.2222.t: "Magatama"
 lepsius.2222.d: "Nasz zespół archeologiczny odnalazł liczne niewielkie magatama wykonane z jadeitu, pochodzące z okresu Yamato."
 lepsius.2222.f: "Magatama to zakrzywione paciorki w kształcie przecinka, stanowiące jeden z najbardziej charakterystycznych symboli japońskiego okresu Yamato (Kofun). Ozdoby te, wykonywane zazwyczaj z kamieni szlachetnych i ozdobnych, takich jak jadeit, jaspis, nefryt czy karneol, były wysoko cenione zarówno jako oznaki przynależności do elit, jak i potężne amulety religijne. Odkrycie magatama w monumentalnych grobowcach o kształcie dziurki od klucza wzbudziło ogromne zainteresowanie archeologów badających początki kultury japońskiej. Ówcześni uczeni dostrzegli uderzające podobieństwa między tymi ozdobami a znaleziskami pochodzącymi z królestwa Silla i konfederacji Gaya na Półwyspie Koreańskim. Poza walorami estetycznymi magatama zajmowały szczególne miejsce w japońskiej świadomości narodowej. Jako jeden z Trzech Świętych Skarbów stanowiących japońskie regalia cesarskie, wydobywane ze starożytnych stanowisk archeologicznych magatama były często postrzegane jako namacalny symbol ponownego nawiązania więzi z boskim rodowodem państwa Yamato."
 lepsius.2222.g: "Czy mogę dostać jedną?"
 lepsius.2223.t: "Zbroje i Uzbrojenie Yamato"
 lepsius.2223.d: "Nasi archeolodzy podejrzewają, że odkryli dawne pole bitwy. Znaleziono tam miecze i zbroje pochodzące z okresu Yamato. Szczególnie dobrze zachowała się zbroja wojownika zwana tankō."
 lepsius.2223.f: "Okres Yamato był epoką intensywnego umacniania i rozszerzania potęgi militarnej, charakteryzującą się powszechnym wykorzystaniem zaawansowanych technik obróbki żelaza. Podczas wykopalisk archeologicznych w grobowcach Kofun odkryto ogromne ilości wyposażenia wojskowego, w tym proste miecze (chokutō), groty strzał oraz zaawansowane zbroje płytowe. W epoce tej dominowały dwa podstawowe rodzaje zbroi: tankō, sztywna żelazna zbroja osłaniająca tułów, wykonana z nitowanych płyt, oraz keikō, bardziej elastyczna zbroja lamelkowa przeznaczona do walki konnej."
 lepsius.2223.g: "Japonia ma za sobą wspaniałą historię militarną."
 lepsius.2224.t: "Brązowe Lustra Yamato"
 lepsius.2224.d: "Archeolodzy odkryli liczne dary grobowe, wśród których wyróżniają się brązowe lustra będące pamiątkami po chwalebnym okresie Yamato."
 lepsius.2224.f: "Brązowe lustra, zwane Shinju-kyo, należą do najważniejszych pod względem religijnym zabytków odkrywanych w grobowcach Kofun z okresu Yamato. Często umieszczano je w pobliżu głowy lub klatki piersiowej zmarłego, a czczono je jako święte przedmioty rytualne zdolne do odbijania i skupiania światła, co wiązano z boską władzą oraz boginią słońca Amaterasu. Wiele luster odkrytych w Japonii zidentyfikowano jako importowane z chińskiej dynastii Wei lustra z wizerunkami bóstw i zwierząt, podczas gdy inne stanowiły miejscowe japońskie naśladownictwa, znane jako Bosei-kyo. Dla historyków epok Meiji i Taishō rozmieszczenie tych luster stanowiło swoistą mapę polityczną starożytnej Japonii. Odkrycie identycznych luster w odległych od siebie grobowcach sugerowało, że dwór Yamato przekazywał te cenne przedmioty lokalnym wodzom jako symbole jednolitego sojuszu politycznego."
 lepsius.2224.g: "Odbicie przeszłości Japonii."
 lepsius.2231.t: "Ceramika Doliny Indusu"
 lepsius.2231.d: "Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] ogłosił dziś, że w Dolinie Indusu odkryto skrytkę zawierającą liczne wyroby ceramiczne."
 lepsius.2231.f: "Garncarze cywilizacji Doliny Indusu już ponad 4000 lat temu posługiwali się wysoko rozwiniętymi, szybkoobrotowymi kołami garncarskimi. Szczególnie wyróżnia się tak zwana „ceramika czarno malowana na czerwonym tle”: naczynia pokrywane intensywnie czerwoną angobą, a następnie zdobione delikatnymi wzorami malowanymi czarnym pigmentem. Motywy zdobnicze miały charakter ściśle geometryczny lub przedstawiały bogatą florę i faunę subkontynentu indyjskiego, od pawi po charakterystyczne liście figowca pagodowego. Ogromne ilości tych trwałych zabytków dostarczyły najważniejszych dowodów na rozwój ośrodków miejskich w dorzeczu Indusu, potwierdzając, że złożone, wysoko zorganizowane społeczeństwo rozkwitało tam na długo przed początkiem pisanej historii subkontynentu."
 lepsius.2231.g: "Teraz pora poskładać fragmenty w całość."
 lepsius.2232.t: "Paciorki Doliny Indusu"
 lepsius.2232.d: "Zespół archeologów pod kierownictwem Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] zabezpieczył dziś cenne znalezisko w starożytnej osadzie w Dolinie Indusu, potwierdzające kunszt rzemieślników cywilizacji harappańskiej."
 lepsius.2232.f: "Odkrycie misternie wykonanej biżuterii i ozdobnych paciorków dostarczyło jednych z najbardziej przekonujących dowodów na ogromne bogactwo i wysoki poziom wyspecjalizowanego rzemiosła cywilizacji Doliny Indusu. Ozdoby te wykonywano z różnorodnych materiałów, w tym złota, srebra, lapis lazuli, turkusu oraz rozmaitych wyrobów z terakoty. Jednak to produkcja długich paciorków z karneolu stanowiła świadectwo wyjątkowego kunsztu technicznego rzemieślników harappańskich. Archeologów zadziwiała precyzja, z jaką wiercono otwory w tych twardych kamieniach i zdobiono je delikatnymi białymi wzorami wykonywanymi przy użyciu substancji alkalicznych. Proces ten wymagał specjalistycznych pieców oraz wierteł ze stopów miedzi. Oprócz walorów estetycznych znaleziska te dostarczyły cennych informacji o rozległych morskich i lądowych szlakach handlowych epoki brązu. Obecność charakterystycznych paciorków harappańskich w królewskich grobowcach mezopotamskich miast-państw dodatkowo potwierdziła, że subkontynent indyjski był jednym z głównych eksporterów dóbr luksusowych."
 lepsius.2232.g: "Ta starożytna kultura utrzymywała rozległe kontakty handlowe!"
 lepsius.2233.t: "Pismo Doliny Indusu"
 lepsius.2233.d: "Archeolodzy odnaleźli kilka pieczęci z inskrypcjami w miejscu, które prawdopodobnie służyło jako magazyn cywilizacji Doliny Indusu. Jednak Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] jak dotąd nie zdołał odczytać tych znaków."
 lepsius.2233.f: "Odkrycie niewielkich, kwadratowych pieczęci ze steatytu pozostaje jedną z najbardziej zagadkowych sensacji archeologicznych wykopalisk w Dolinie Indusu. Na tych zabytkach wykonywano techniką wklęsłorytu niezwykle kunsztowne przedstawienia zwierząt, przede wszystkim byka zwanego „jednorożcem”, słoni i nosorożców, nad którymi umieszczano ciągi ujednoliconych znaków znanych jako pismo Doliny Indusu. Odkrycie dużej liczby takich pieczęci w dzielnicach magazynowych sugerowało, że służyły one jako oficjalne oznaczenia własności lub władzy, wykorzystywane do odciskania znaków na glinianych plombach umieszczanych na towarach przeznaczonych na rynki krajowe i zagraniczne. Krótka forma inskrypcji oraz powtarzalność występujących w nich znaków skłoniły uczonych do wniosku, że pismo to prawdopodobnie służyło do zapisywania imion, tytułów lub informacji administracyjnych, a nie długich tekstów narracyjnych. Pomimo szczegółowych analiz językoznawczych język kryjący się za tym pismem pozostawał przedmiotem ożywionych sporów."
 lepsius.2233.g: "Pismo i język pozostaną zagadką dla przyszłych pokoleń."
 lepsius.2234.t: "Kontakty Doliny Indusu z Mezopotamią"
 lepsius.2234.d: "Rolnicy poinformowali Instytut Archeologiczny o starożytnych budowlach na obszarze, na którym przypuszczalnie rozwijała się cywilizacja harappańska. Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] dokonał tam zaskakującego odkrycia: pieczęci cylindrycznych pochodzących z Mezopotamii!"
 lepsius.2234.f: "Odkrycie charakterystycznych zabytków bliskowschodnich w ruinach Harappy i Mohendżo-Daro dostarczyło pierwszych niepodważalnych dowodów archeologicznych na bezpośrednie kontakty między cywilizacją Doliny Indusu a cywilizacjami Mezopotamii. Do najważniejszych znalezisk należały pieczęcie cylindryczne, wyraźnie różniące się od kwadratowych, płaskich pieczęci stemplowych charakterystycznych dla dorzecza Indusu. Te importowane przedmioty, wykonywane zazwyczaj z takich kamieni jak hematyt czy lapis lazuli, zdobiono przedstawieniami scen narracyjnych i mitologicznych charakterystycznymi dla akadyjskich i sumeryjskich miast-państw. Oprócz pieczęci archeolodzy zidentyfikowali również szereg luksusowych przedmiotów, w tym fragmenty ceramiki w stylu Zatoki Perskiej oraz niektóre rodzaje odlewanej broni z brązu, pochodzące z zachodu."
 lepsius.2234.g: "Mezopotamskie zabytki? Tutaj? I nawet nie musimy wysyłać wyprawy?"
