 je_lepsius_archaoelogical_society: "Załóż Towarzystwo Archeologiczne"
 je_lepsius_archaoelogical_society_reason: "Nie tylko zainteresowanie archeologią stale rośnie w naszym narodzie. Po wielu latach wypraw, wykopalisk i odkryć artefaktów nasz kraj zbudował imponującą wiedzę archeologiczną. Wybitny archeolog mógłby założyć Towarzystwo Archeologiczne, aby zgromadzić siły naukowe i intelektualne oraz nadać nowy impuls badaniom. Nie tylko poprawiłoby to nasze osiągnięcia naukowe, ale także zwiększyłoby doświadczenie kolejnych pokoleń archeologów."
