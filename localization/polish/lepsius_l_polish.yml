l_polish:
 lepsius_upper_egypt_modifier: "Dolina Królów"
 lepsius_upper_egypt_modifier_desc: "Dolina Królów jest jednym z najbardziej fascynujących stanowisk archeologicznych na świecie. W tysiącletnich grobowcach podobno znajdują się skarby, które tylko czekają na odkrycie."
 lepsius_lower_egypt_modifier: "Piramidy"
 lepsius_lower_egypt_modifier_desc: "Dolny Egipt ze swoją starożytną stolicą Memfis to kraina nieodkrytych piramid i nieznanych miast. Mówi się, że w egipskich piaskach do dziś spoczywa cała seria zaginionych artefaktów."
 lepsius_babylonia_modifier: "Kolebka cywilizacji"
 lepsius_babylonia_modifier_desc: "Mezopotamia uważana jest za miejsce, gdzie wynaleziono pismo i rolnictwo oraz powstały pierwsze królestwa. Tabliczki z pismem klinowym, kolosalne kamienne posągi i ruiny świątyń nadal świadczą o niegdyś wspaniałej kulturze."
 lepsius_assyria_modifier: "Ruiny Niniwy i Nimrud"
 lepsius_assyria_modifier_desc: "Asyria to nie tylko miejsce pochodzenia wojowniczych imperiów, ale także punkt, w którym spotykają się starożytna historia orientalna i biblijne narracje. Ruiny dawnych ogrodów i potężne mury obronne fascynują do dziś."
 lepsius_argolis_modifier: "Cytadele w Mykenach"
 lepsius_argolis_modifier_desc: "Kultura mykeńska jest uważana za pierwszą zaawansowaną cywilizację na kontynencie greckim. Królowie z greckiej mitologii od dawna są uważani za zwykłe bajki - ale wykopaliska archeologiczne mogą udowodnić, że opowieści te mają w sobie ziarno prawdy."
 lepsius_crete_modifier: "Cywilizacja minojska"
 lepsius_crete_modifier_desc: "Kreta jest domem dla najstarszych miast w Europie - wraz z kompleksami pałacowymi, których tajemnice nie zostały jeszcze odkryte. Nazwa kultury minojskiej pochodzi od legendarnego króla Minosa, o którym mówi się, że kiedyś rządził całym Morzem Egejskim."
 lepsius_yucatan_modifier: "Tajemnice Jukatanu"
 lepsius_yucatan_modifier_desc: "Mówi się, że głęboko w dżunglach Jukatanu wciąż znajdują się zatopione miasta niegdyś kwitnącej kultury Majów. Doniesienia miejscowych sugerują archeologiczne sensacje - jeśli komuś uda się przedrzeć przez nieprzenikniony gąszcz."
 lepsius_peru_modifier: "Sekrety Andów"
 lepsius_peru_modifier_desc: "Imperium Inków było niegdyś najpotężniejszym państwem na kontynencie południowoamerykańskim - jego kres położył dopiero hiszpański podbój. Ale podobno wciąż istnieją nieznane grobowce i świątynie. Niektórzy mówią nawet o nieznanym mieście ukrytym w Andach."
