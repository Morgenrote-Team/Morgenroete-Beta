 notification_lepsius_rosellini_notification_name: "List Lepsiusa do Roselliniego"
 notification_lepsius_rosellini_notification_desc: "Niemiecki filolog Karl Richard Lepsius przedstawił swoją ulepszoną metodę tłumaczenia hieroglifów w liście do włoskiego egiptologa Ippolito Roselliniego. Pojawiają się głosy, aby podjąć wyprawę do Egiptu."
 notification_lepsius_stephens_catherwood_expedition_notification_name: "Wyprawa Stephensa i Catherwooda"
 notification_lepsius_stephens_catherwood_expedition_notification_desc: "Amerykański odkrywca John Lloyd Stephens i brytyjski artysta Frederick Catherwood powrócili z pełnej przygód podróży po Półwyspie Jukatan — i opowiadają o legendarnych ruinach w dżungli. Naukowcy wyrazili zainteresowanie bliższym zbadaniem kultury Majów."
 notification_lepsius_decipherment_akkadian_notification_name: "Odczytanie języka akadyjskiego"
 notification_lepsius_decipherment_akkadian_notification_desc: "Wszystkie gazety w kraju donoszą o przełomie dokonanym przez znanych badaczy pod przewodnictwem doświadczonego archeologa: starożytne języki Mezopotamii nie są już tajemnicą. Nic nie stoi na przeszkodzie poważnym badaniom Babilonii i Asyrii."
 notification_lepsius_support_schliemann_notification_name: "Schliemann odkrywa Troję!"
 notification_lepsius_support_schliemann_notification_desc: "Niemiecki przedsiębiorca Heinrich Schliemann odkrył Troję, którą przez długi czas odrzucano jako bajkę. Archeolodzy na całym świecie na nowo zainteresowali się starożytną Grecją — choć tą z mitycznej starożytności."
 notification_lepsius_machu_picchu_notification_name: "Machu Picchu"
 notification_lepsius_machu_picchu_notification_desc: "Wyprawa archeologiczna odkryła zaginione inkaskie miasto Machu Picchu głęboko w Andach. Naukowcy zachęcają do intensywniejszego badania tego regionu."
 notification_lepsius_excavation_artifacts_notification_name: "Nowe artefakty z wykopalisk"
 notification_lepsius_excavation_artifacts_notification_desc: "Dziś rano nasze Muzeum Archeologiczne otrzymało przesyłkę nowych artefaktów z naszych stanowisk wykopaliskowych."
 lepsius_hide_archaeological_decisions: "Ukryj wszystkie decyzje archeologiczne."
 lepsius_hide_archaeological_decisions_desc: "Ukryj wszystkie decyzje geograficzne, aby zachować lepszy przegląd."
 lepsius_show_archaeological_decisions: "Pokaż wszystkie decyzje archeologiczne."
 lepsius_show_archaeological_decisions_desc: "Pokaż wszystkie decyzje archeologiczne."
 lepsius_cancel_excavation_decision: "Odwołaj jeden z naszych zespołów wykopaliskowych"
 lepsius_cancel_excavation_decision_desc: "W niektórych sytuacjach przydatne może być odwołanie zespołu wykopaliskowego. Zdobyte przez nas artefakty i kolekcje pozostaną, ale nasze stałe wykopaliska zostaną zakończone."
 lepsius_gather_first_excavation_team_decision: "Zbierz nowy zespół archeologiczny"
 lepsius_gather_first_excavation_team_decision_desc: "Możemy wyszkolić dodatkowy zespół archeologów. Oznacza to, że kilka wykopalisk będzie możliwych jednocześnie."
 lepsius_gather_second_excavation_team_decision: "Zbierz nowy zespół archeologiczny"
 lepsius_gather_second_excavation_team_decision_desc: "Możemy wyszkolić dodatkowy zespół archeologów. Oznacza to, że kilka wykopalisk będzie możliwych jednocześnie."
 lepsius_gather_third_excavation_team_decision: "Niech archeolog utworzy nowy zespół"
 lepsius_gather_third_excavation_team_decision_desc: "Możemy wyszkolić dodatkowy zespół archeologów. Oznacza to, że kilka wykopalisk będzie możliwych jednocześnie."
 lepsius_upper_egypt_expedition_decision: "Dolina Królów"
 lepsius_upper_egypt_expedition_decision_desc: "Wraz ze starożytną stolicą Tebami i Doliną Królów, Górny Egipt jest uważany za Mekkę egiptologii. Powinniśmy uzyskać licencję na wykopaliska na tym obszarze i poszukać egipskich skarbów."
 lepsius_lower_egypt_expedition_decision: "Piramidy"
 lepsius_lower_egypt_expedition_decision_desc: "Od zarania dziejów egipskie piramidy fascynują ludzkość. Mówi się, że inne grobowce, świątynie, a nawet miasta, które zaginęły w piaskach Dolnego Egiptu, czekają na ponowne odkrycie."
 lepsius_babylonia_expedition_decision: "Kolebka cywilizacji"
 lepsius_babylonia_expedition_decision_desc: "Babilonia, południowa część Mezopotamii, zawdzięcza swoją nazwę niegdyś potężnemu miastu Babilon. Region ten jest uważany za „kolebkę cywilizacji”, gdzie raz po raz odkrywane są cenne artefakty archeologiczne. Zdecydowanie powinny one trafić do muzeum."
 lepsius_assyria_expedition_decision: "Ogrody Asyrii"
 lepsius_assyria_expedition_decision_desc: "Asyria odnosi się do północnej części Mezopotamii z dwoma ważnymi miastami: Assur i Niniwą. Nieliczna wiedza o tym kraju wciąż może być czerpana z Biblii jako źródła — ale być może istnieją bardziej wiarygodne dowody historyczne?"
 lepsius_argolis_expedition_decision: "Miasto Agamemnona"
 lepsius_argolis_expedition_decision_desc: "Po odkryciu Troi nawet sceptyczni naukowcy zaczynają zdawać sobie sprawę, że mity starożytnych Greków to coś więcej niż tylko bajki. Mówi się, że w Argolidzie do dziś znajdują się pozostałości miast z epoki brązu, z których najbardziej znane są Mykeny. Powinniśmy się o tym przekonać."
 lepsius_crete_expedition_decision: "Opowieść o Minotaurze"
 lepsius_crete_expedition_decision_desc: "Mówi się, że legendarny król Minos niegdyś władał Kretą. Podobnie jak w przypadku Troi i Myken, wydaje się, że również w tej historii jest ziarno prawdy: na wyspie coraz częściej odnajduje się artefakty legendarnej kultury minojskiej. Nasz naród również powinien zdobyć kilka z nich."
 lepsius_yucatan_expedition_decision: "Zaginione miasta Majów"
 lepsius_yucatan_expedition_decision_desc: "Doniesienia o nieznanych i ogromnych miastach pośrodku dżungli nasiliły się. Powinniśmy zbadać to dokładniej i wysłać wyprawę archeologiczną na Jukatan."
 lepsius_peru_expedition_decision: "Ukryte dziedzictwo Inków"
 lepsius_peru_expedition_decision_desc: "Piloci zgłaszają dziwne fortece i otoczone murami budowle w Andach, które widzieli podczas swoich lotów nad Peru. Być może Hiszpanie nie zniszczyli całkowicie kultury Inków? Niektóre miasta rdzennego oporu do dziś nie zostały odnalezione."
 lepsius_found_archaeological_museum_decision: "Załóż Muzeum Archeologiczne"
 lepsius_found_archaeological_museum_decision_desc: "Każdy szanujący się naród posiada w swojej stolicy wyjątkowe muzeum, w którym wystawia wszystkie dobra kulturowe zdobyte podczas śmiałych przygód lub najwyższej jakości wypraw naukowych. Liczba artefaktów oraz liczba różnych kolekcji nie tylko zwiększają prestiż na świecie, ale również mają wartość edukacyjną."
 lepsius_visit_archaeological_museum_decision: "Odwiedź Muzeum Archeologiczne"
 lepsius_visit_archaeological_museum_decision_desc: "Wyświetl statystyki zdobytych artefaktów i zaaranżuj je w prestiżowe wystawy."
 lepsius_appoint_lead_scientist_decision: "Wyznacz głównego naukowca"
 lepsius_appoint_lead_scientist_decision_desc: "Wyznacza nowego głównego naukowca Muzeum Archeologicznego. Postać będzie pełnić tę funkcję przez około 15 do 20 lat. Mianowanie uchroni ją przed zniknięciem ze sceny politycznej w tym okresie."
 lepsius_found_archaeological_society_decision: "Załóż Towarzystwo Archeologiczne"
 lepsius_found_archaeological_society_decision_desc: "Nie tylko zainteresowanie archeologią stale rośnie w naszym narodzie. Po wielu latach wypraw, wykopalisk i odkryć artefaktów nasz kraj zbudował imponującą wiedzę archeologiczną. Wybitny archeolog mógłby założyć Towarzystwo Archeologiczne, aby zgromadzić siły naukowe i intelektualne oraz nadać nowy impuls. Nie tylko poprawiłoby to nasze osiągnięcia naukowe, ale także zwiększyłoby doświadczenie kolejnych pokoleń archeologów."
 lepsius_inspect_excavation_decision: "Zorganizuj szczegółową inspekcję archeologiczną"
 lepsius_inspect_excavation_decision_desc: "Możemy wysłać doświadczonego archeologa na obszar, na którym prowadzimy wykopaliska, aby zintensyfikować tam nasze działania. Nasz archeolog otworzy nowe stanowisko wykopaliskowe za około rok i przeprowadzi intensywne badania, podczas których możemy znaleźć dalsze wskazówki dotyczące wcześniej nieznanych, wielkich odkryć archeologicznych. Sukces w dużej mierze zależy od doświadczenia naszego archeologa. Utworzenie Towarzystwa Archeologicznego również zwiększa nasze szanse."
 lepsius.2.t: "List do prof. Roselliniego"
 lepsius.2.d: "Niemiecki filolog [SCOPE.sCharacter('lepsius_archaeologist_scope').GetFullName] przedstawił swoją ulepszoną metodę tłumaczenia hieroglifów w liście do włoskiego egiptologa Ippolito Roselliniego. Pojawiają się głosy, aby podjąć wyprawę do Egiptu."
 lepsius.2.f: "Po śmierci François Champolliona badania nad hieroglifami zatrzymały się. W 1837 roku młody niemiecki filolog [SCOPE.sCharacter('lepsius_archaeologist_scope').GetFullName] napisał list do Ippolito Roselliniego, bliskiego współpracownika Champolliona i współodpowiedzialnego za francusko-toskańską wyprawę do Egiptu z 1829 roku. Lepsius uporządkował i przedstawił wiedzę zgromadzoną przez Champolliona oraz odegrał kluczową rolę w przekształceniu egiptologii w poważną naukę. Z drugiej strony przekonał polityczne elity Europy do przyszłych wypraw do Egiptu."
 lepsius.2.a: "Zbadamy cuda Egiptu!"
 lepsius.3.t: "Stephens i Catherwood"
 lepsius.3.d: "Amerykański odkrywca John Lloyd Stephens i brytyjski artysta Frederick Catherwood powrócili z pełnej przygód podróży po Półwyspie Jukatan — i opowiadają o legendarnych ruinach w dżungli. Naukowcy wyrazili zainteresowanie bliższym zbadaniem kultury Majów."
 lepsius.3.f: "Czy Nowy Świat był zamieszkany jedynie przez dzikusów i barbarzyńców przed przybyciem Europejczyków na kontynent? Odkrywcy John Lloyd Stephens i Frederick Catherwood głęboko zachwiali tym poglądem. Przez kilka lat Amerykanin i Brytyjczyk przemierzali dżungle Półwyspu Jukatan i według własnych relacji odwiedzili 44 różne miejsca dawno zaginionej kultury mezoamerykańskiej. Miejscowi od dawna opowiadali historie o dawno zapomnianych miastach w dżungli i świątyniach ukrytych pośród roślinności; jednak raporty Stephensa, a zwłaszcza zachwycające litografie Catherwooda, ukazały świat dotąd całkowicie nieznany. Obrazy świątyń, posągów i stel nie tylko pobudziły wyobraźnię romantyków. Fala zainteresowania nieznaną cywilizacją rozprzestrzenia się po USA i Europie, obejmując ciekawość, idealizację oraz autentyczne zainteresowanie naukowe."
 lepsius.3.a: "Powinniśmy zaopatrzyć się w wysokiej jakości skórzane kurtki."
 lepsius.4.t: "Rozszyfrowanie języka akadyjskiego"
 lepsius.4.d: "Wszystkie gazety w kraju donoszą o przełomie dokonanym przez znanych badaczy pod przewodnictwem doświadczonego archeologa: starożytne języki Mezopotamii nie są już tajemnicą. Nic nie stoi na przeszkodzie poważnym badaniom Babilonii i Asyrii."
 lepsius.4.f: "Już za czasów niemieckiego matematyka Carstena Niebuhra tabliczki z pismem klinowym wzbudzały zainteresowanie uczonych w XVIII wieku, a podejmowano próby ich odczytania i tłumaczenia języków. Georg Friedrich Grotefend, Anquetil-Duperron i Antoine Isaac Silvestre de Sacy odegrali decydującą rolę w odczytaniu staroperskich zapisów klinowych; ich badania zostały potwierdzone wraz z odczytaniem hieroglifów i czterojęzycznego „Wazonu Calyusa”. Po odkryciu monumentalnej inskrypcji z Behistun, która oprócz znanego już języka perskiego zawierała starsze języki Mezopotamii, było tylko kwestią czasu, zanim elamicki, babiloński i akadyjski znów staną się zrozumiałe po wiekach zapomnienia. Po zaproszeniu różnych asyriologów twierdzących, że rozumieją te starożytne języki, jedna z naszych akademii poddała ich próbie: niezależnie od siebie mieli przetłumaczyć tę samą inskrypcję. Co niezwykłe, tłumaczenia wszystkich uczonych były zgodne. Poważne badania najstarszych kultur ludzkości w Mezopotamii mogą się teraz rozpocząć."
 lepsius.4.a: "Jesteśmy spadkobiercami Champolliona."
 lepsius.5.t: "Schliemann odkrywa Troję!"
 lepsius.5.d: "Niemiecki przedsiębiorca Heinrich Schliemann odkrył Troję, którą przez długi czas odrzucano jako bajkę. Archeolodzy na całym świecie na nowo zainteresowali się starożytną Grecją — choć tą z mitycznej starożytności."
 lepsius.5.f: "Gdzie kończy się nauka, a gdzie zaczyna mit? Współczesność zrobiła wszystko, aby oddzielić religię od wiedzy. Wygnaliśmy legendy i sagi, które jeszcze kilkadziesiąt lat temu uważano za rzeczywistość, do krainy bajek. A jednak nagle wychodzą one na światło dzienne, najpierw w gazetach, a potem w akademiach: Troja została odkryta! Legendarne miasto Priama, o którym Homer śpiewał w swojej Iliadzie, historia znana każdemu wykształconemu obywatelowi Zachodu — to coś więcej niż tylko mit. Niemiecki kupiec Heinrich Schliemann nie przejął się odczarowaniem świata, a nawet twierdzi, że odnalazł cenny skarb: skarb Priama. Świat archeologii był zszokowany i zafascynowany tym wydarzeniem — czy inne historie z odległej przeszłości również okażą się prawdziwe? Czy na wybrzeżach Morza Egejskiego czekają na ponowne odkrycie kolejne zatopione miasta?"
 lepsius.5.a: "Menin aeide, thea, Peleiadeo Achileos ..."
 lepsius.6.t: "Machu Picchu"
 lepsius.6.d: "Wyprawa archeologiczna odkryła zaginione inkaskie miasto Machu Picchu głęboko w Andach. Naukowcy zachęcają do intensywniejszego badania tego regionu."
 lepsius.6.f: "Istnieją pewne narracje, które dominują w naszej teraźniejszości. Wszystko zostało podbite, wszystko zostało odkryte i wszystko zostało już powiedziane. Nie ma skrawka ziemi, który nie posiadałby już kolonialnej flagi, nie ma wioski, która nie byłaby połączona z koleją, ani przełomowej technologii, o której już nie wiemy. A jednak zdarzają się chwile, gdy nihilizm elit pęka. Wyścig do biegunów, podbój przestworzy i zajmowanie się ostatnimi tajemnicami ludzkości pokazują, że historia się nie skończyła. Odkrycie miasta Machu Picchu jest jedynie fragmentem ukazującym, jak niewiele wiemy o świecie, który wydaje nam się, że rozumiemy i kontrolujemy. Być może jest coś prawdziwego w opowieściach o nieznanych miastach Inków, które interpretowano jako próbę zmylenia Hiszpanów. Vilcabamba, ostatnia stolica wolnych Inków, do dziś nie została odnaleziona..."
 lepsius.6.a: "Czas chwycić mój fedorowy kapelusz!"
 lepsius.10.t: "Inauguracja muzeum"
 lepsius.10.d: "Muzeum Archeologiczne zostało dziś otwarte podczas uroczystej ceremonii."
 lepsius.10.f: ""
 lepsius.10.g: "Nie mogę się doczekać wizyty w muzeum!"
 lepsius.10.h: "Szampan! Szampan!"
 lepsius.11.t: "Wizyta w muzeum"
 lepsius.11.d: "Witamy w Muzeum Archeologicznym."
 lepsius.11.f: "Nasza kolekcja muzealna obejmuje obecnie #T łącznie #G [ROOT.Var('lepsius_total_artifacts').GetValue]#! artefaktów.#! \n\nArtefakty są podzielone na następujące kolekcje: \n\n#T Kolekcja egipska:#! \n#G [ROOT.Var('lepsius_egyptian_artifact_minor').GetValue]#! @lepsius_egypt_minor! mniejszych artefaktów i #G [ROOT.Var('lepsius_egyptian_artifact_major').GetValue]#! @lepsius_egypt_major! większych artefaktów. \n\n#T Kolekcja mezopotamska:#!\n#G [ROOT.Var('lepsius_mesopotamian_artifact_minor').GetValue]#! @lepsius_mesopotamia_minor! mniejszych artefaktów i #G [ROOT.Var('lepsius_mesopotamian_artifact_major').GetValue]#! @lepsius_mesopotamia_major! większych artefaktów. \n\n#T Kolekcja egejska:#!\n#G [ROOT.Var('lepsius_aegean_artifact_minor').GetValue]#! @lepsius_aegean_minor! mniejszych artefaktów i #G [ROOT.Var('lepsius_aegean_artifact_major').GetValue]#! @lepsius_aegean_major! większych artefaktów. \n\n#T Kolekcja prekolumbijska:#!\n#G [ROOT.Var('lepsius_precolumbian_artifact_minor').GetValue]#! @lepsius_precolumbian_minor! mniejszych artefaktów i #G [ROOT.Var('lepsius_precolumbian_artifact_major').GetValue]#! @lepsius_precolumbian_major! większych artefaktów.\n\n#T Zespoły archeologiczne:#!\nMamy dostępnych #G [ROOT.Var('lepsius_excavation_teams').GetValue]#! zespołów z łącznej liczby #G [ROOT.Var('lepsius_total_excavation_teams').GetValue]#!."
 lepsius.11.g: "To było całkiem pouczające. Do następnego razu!"
 lepsius.11.h: "Odwiedź kolekcję egipską"
 lepsius.11.i: "Odwiedź kolekcję mezopotamską"
 lepsius.11.j: "Odwiedź kolekcję egejską"
 lepsius.11.k: "Odwiedź kolekcję prekolumbijską"
 lepsius.11.l: "Odwiedź głównego naukowca"
 lepsius.11.m: "Odwiedź główne artefakty"
 lepsius.11.n: "Odwiedź kolekcję kultur świata"
 lepsius.11.o: "Pokaż kraje z największą liczbą artefaktów!"
 lepsius.12.t: "Kolekcja egipska"
 lepsius.12.d: "Ta sekcja obejmuje artefakty z Górnego i Dolnego Egiptu."
 lepsius.12.g: "Zorganizuj małą wystawę."
 lepsius.12.h: "Zorganizuj średniej wielkości wystawę."
 lepsius.12.i: "Zorganizuj dużą wystawę."
 lepsius.12.j: "Zorganizuj znakomitą wystawę."
 lepsius.12.k: "Wróć do głównej sali."
 lepsius.12.l: "Opuść muzeum."
 lepsius.13.t: "Kolekcja mezopotamska"
 lepsius.13.d: "Ta sekcja obejmuje artefakty z Babilonii i Asyrii."
 lepsius.14.t: "Kolekcja egejska"
 lepsius.14.d: "Ta sekcja obejmuje artefakty z Argolidy i Krety."
 lepsius.15.t: "Kolekcja prekolumbijska"
 lepsius.15.d: "Ta sekcja obejmuje artefakty z Jukatanu i Peru."
 lepsius.16.t: "[SCOPE.sCharacter('lepsius_archaeologist_scope').GetFullName]"
 lepsius.16.d: "To jest gabinet najwybitniejszego archeologa naszego narodu, profesora [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName]."
 lepsius.16.f: "[SCOPE.sCharacter('lepsius_archaeologist_scope').GetFullName] ma łącznie #G [ROOT.Var('lepsius_archaeologist_var').GetVariable('lepsius_archaeologist_experience_var').GetValue]#! doświadczenia archeologicznego.\n\nŁączna liczba wypraw sfinansowanych przez nasz naród: #G [ROOT.Var('lepsius_total_expeditions').GetValue]#!\n\nŁączna liczba wielkich odkryć dokonanych przez nasz naród: #G [ROOT.Var('lepsius_total_discoveries').GetValue]#!"
 lepsius.16.g: "Zorganizuj wielki kongres archeologiczny"
 lepsius.17.t: "Wielkie artefakty"
 lepsius.17.d: "To jest przegląd wszystkich wielkich artefaktów w muzeum."
 lepsius.17.egypt: "\n#T Egipt:#!\n"
 lepsius.17.sarcophagus: "Odnaleźliśmy #E Sarkofag Nieznanego Faraona#! w zaginionym grobowcu w Dolinie Królów.\n"
 lepsius.17.nefertiti: "#E Popiersie Nefertiti#! było nagrodą za żmudne wykopaliska i spory dyplomatyczne.\n"
 lepsius.17.tut: "#E Maska pośmiertna Tutanchamona#! jest klejnotem w koronie legendarnego grobowca w Dolinie Królów.\n"
 lepsius.17.narmer: "#E Paleta Narmera#! jest jednym z najstarszych pisanych znalezisk ludzkości i przez niektórych uważana jest za dokument założycielski Egiptu.\n"
 lepsius.17.mesopotamia: "\n#T Mezopotamia:#!\n"
 lepsius.17.lamassu: "Otrzymaliśmy #E Lamassu króla Sargona#! z Asyrii w pełnych przygód okolicznościach.\n"
 lepsius.17.meskalamdug: "Odnaleźliśmy #E Hełm Meskalamduga#! po intensywnych wykopaliskach w Babilonii.\n"
 lepsius.17.sargon: "Odnaleźliśmy #E Maskę Sargona#! podczas dokładnych wykopalisk w starożytnej asyryjskiej stolicy Niniwie.\n"
 lepsius.17.gilgamesh: "Po nieustannych poszukiwaniach nowych fragmentów i najnowocześniejszych badaniach udało nam się zrekonstruować części #E Eposu o Gilgameszu#!.\n"
 lepsius.17.greece: "\n#T Grecja:#!\n"
 lepsius.17.agamemnon: "#E Maska Agamemnona#! była głównym znaleziskiem naszego wielkiego odkrycia w Mykenach.\n"
 lepsius.17.priam: "Otrzymaliśmy #E Skarb Priama#! w darze od Heinricha Schliemanna.\n"
 lepsius.17.snake: "Udało nam się sprowadzić do naszego muzeum tak zwaną #E Boginię Węży#! z Krety, jeden z najważniejszych artefaktów kultury minojskiej, w nieco niekonwencjonalny sposób.\n"
 lepsius.17.diskos: "Po wytrwałych pracach wykopaliskowych odnaleźliśmy #E Dysk z Fajstos#!.\n"
 lepsius.17.southamerica: "\n#T Ameryka Południowa:#!\n"
 lepsius.17.kukulkan: "#E Klejnot Kukulkana#! został zdobyty przez jednego z naszych archeologów podczas fantastycznej i niebezpiecznej podróży.\n"
 lepsius.17.pakal: "Nasi archeolodzy zabezpieczyli #E Grobowy Skarb Pakala#! po latach wykopalisk w Palenque.\n"
 lepsius.17.other: "\n#T Inne:#!\n"
 lepsius.17.abraham: "#E Laska Abrahama#! została odnaleziona przez jednego z naszych archeologów podczas duchowej podróży.\n"
 lepsius.17.arne: "Podczas fantastycznej przygody nasi odważni archeolodzy odnaleźli #E Rękopis Arne Saknussemma#! jako dowód, że w XVI wieku odbył podróż do wnętrza Ziemi.\n"
 lepsius.17.skull: "Nabyliśmy niezwykle tajemniczą #E Kryształową czaszkę#! od zaufanego handlarza antykami.\n"
 lepsius.17.hoa: "Tajemniczy posąg #E Moai Hoa Hakananai'a#! został odnaleziony przez podróżnika na Wyspie Wielkanocnej.\n"
 lepsius.17.summer: "Podczas spalenia chińskiej Cesarskiej Rezydencji zdobyliśmy znaczną ilość cennego #E Łupu z Pałacu Letniego#!."
 lepsius.18.t: "Kolekcja kultur świata"
 lepsius.18.d: "Ta sekcja obejmuje artefakty z różnych kultur świata."
 lepsius.18.f: "Ta kolekcja jest zarówno zbiorem antropologicznym, jak i archeologicznym różnych kultur, z których część nadal istnieje. #G 10#! artefaktów wystarczy, aby zorganizować wystawę. Nie ma większych kolekcji, ale poszczególne zbiory są bardziej wartościowe. Obecnie ta kolekcja składa się z następujących sekcji: \n\n #G [ROOT.Var('lepsius_oceanic_artifact_minor').GetValue]#! @lepsius_oceanian_minor! mniejszych artefaktów z Oceanii \n #G [ROOT.Var('lepsius_oceanic_artifact_major').GetValue]#! @lepsius_oceanian_major! większych artefaktów z Oceanii \n\n #G [ROOT.Var('lepsius_fareastern_artifact_minor').GetValue]#! @lepsius_east_asian_minor! mniejszych artefaktów z Dalekiego Wschodu \n #G [ROOT.Var('lepsius_fareastern_artifact_major').GetValue]#! @lepsius_east_asian_major! większych artefaktów z Dalekiego Wschodu \n"
 lepsius.18.g: "Zorganizuj wystawę Dalekiego Wschodu."
 lepsius.18.h: "Zorganizuj wystawę Oceanii."
 lepsius.22.d: "Zgromadzona elita naszej stolicy jest poruszona: Muzeum Archeologiczne przygotowuje nową wystawę."
 lepsius.22.f: "Ludzie z wyższych i średnich klas tłoczą się rano przed wejściem do muzeum. Nowa wystawa rozpoczyna się wykładem czołowego archeologa, który przedstawi z pierwszej ręki najnowszą wyprawę oraz wykopaliska na stanowisku. Następnie miłośnicy sztuki i obserwatorzy mogą przyjrzeć się samym eksponatom. Prasa jest na miejscu, przygotowując swoje artykuły. To wielki dzień dla [ROOT.GetCountry.GetNameNoFlag], zarówno w kraju, jak i za granicą; wielkie mocarstwa z zazdrością spoglądają na naszą prestiżową kolekcję."
 lepsius.22.g: "Mam nadzieję, że dostanę kolejny bilet."
 lepsius.24.t: "Nowa wystawa egejska"
 lepsius.25.t: "Nowa wystawa prekolumbijska"
 lepsius.26.t: "Kongres archeologiczny dobiega końca"
 lepsius.26.d: "Kongres zorganizowany przez nasze Towarzystwo Archeologiczne dobiega dziś końca. Profesor [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] poszerzył w tym czasie swoją wiedzę."
 lepsius.26.f: "Kilka tygodni spotkań, odczytów, konferencji i kameralnych zgromadzeń dobiega końca. Krajowi i zagraniczni archeolodzy związani z towarzystwem wymieniali się odkryciami, wyprawami i teoriami. Wydarzenie zakończyło się pełnym sukcesem — i poszerzyło horyzonty wszystkich zaangażowanych."
 lepsius.26.g: "Zawsze te kłótnie o to, kto ma najlepsze skórzane kurtki..."
 lepsius.27.t: "Nowa wystawa kultur świata"
 lepsius.30.t: "Nowy główny naukowiec"
 lepsius.30.d: "Muzeum Archeologiczne wyznaczyło nowego głównego naukowca. Jest nim [SCOPE.sCharacter('lepsius_museum_lead_scientist').GetPrimaryRoleTitle] [SCOPE.sCharacter('lepsius_museum_lead_scientist').GetFullName]."
 lepsius.30.f: ""
 lepsius.30.g: "Gratulacje!"
 lepsius.31.t: "Główny naukowiec zostaje dyrektorem muzeum"
 lepsius.31.d: "[SCOPE.sCharacter('lepsius_museum_lead_scientist').GetPrimaryRoleTitle] [SCOPE.sCharacter('lepsius_museum_lead_scientist').GetFullName] miał zaszczyt zostać mianowany nowym dyrektorem muzeum. Tym samym wycofa się z aktywnej służby."
 lepsius.31.f: "Przez lata [SCOPE.sCharacter('lepsius_museum_lead_scientist').GetFullName] poświęcał swoje życie nauce i kulturze, a polityka już dawno go zmęczyła. Dla wielu decyzja o skupieniu się wyłącznie na działalności muzeum nie była zaskoczeniem. Nie będzie już dostępny do działań politycznych ani wypraw. Są awanse, których należy żałować."
 lepsius.31.g: "Żegnaj..."
 lepsius.80.t: "Nowa era archeologii!"
 lepsius.80.d_egypt: "Dr [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] wykorzystał nowe metody archeologiczne, aby odkryć wiele szczegółów dotyczących starożytnej egipskiej wioski. Wykorzystanie stratygrafii i systemu trzech epok, a także dokumentowanie [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] odkryć oznacza nową erę w archeologii."
 lepsius.80.d_mesopotamia: "Dr [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] wykorzystał nowe metody archeologiczne, aby odkryć wiele szczegółów dotyczących starożytnej mezopotamskiej wioski. Wykorzystanie stratygrafii i systemu trzech epok, a także dokumentowanie [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] odkryć oznacza nową erę w archeologii."
 lepsius.80.d_aegean: "Dr [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] wykorzystał nowe metody archeologiczne, aby odkryć wiele szczegółów dotyczących starożytnej egejskiej wioski. Wykorzystanie stratygrafii i systemu trzech epok, a także dokumentowanie [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] odkryć oznacza nową erę w archeologii."
 lepsius.80.d_precolumbian: "Dr [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] wykorzystał nowe metody archeologiczne, aby odkryć wiele szczegółów dotyczących starożytnej prekolumbijskiej wioski. Wykorzystanie stratygrafii i systemu trzech epok, a także dokumentowanie [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] odkryć oznacza nową erę w archeologii."
 lepsius.80.f: "Warstwy ziemi, w których znaleźliśmy artefakty z tej wioski, mówią nam wiele na jej temat. Jedna z warstw zawiera na przykład dużo węgla i oznacza koniec znalezisk z tego okresu. Prawdopodobnie oznacza to, że pożar zniszczył wioskę i została ona opuszczona. Dodatkowo nie ma żadnych metalowych przedmiotów, co oznacza, że musiała być to wioska z epoki kamienia. Szczątki ludzkie, które znaleźliśmy, również były fascynujące, ponieważ wykazywały oznaki niedożywienia i miały starte zęby."
 lepsius.80.g: "Tak cywilizowane!"
 lepsius.100.t: "Przygotowywanie [ROOT.GetCountry.GetAdjectiveNoFlag] wyprawy archeologicznej"
 lepsius.100.d: "Trwają przygotowania do wyprawy archeologicznej. Nie jest jednak jeszcze jasne, jak długo podróż powinna być finansowana."
 lepsius.100.f: "Nie tylko samo finansowanie, ale również długość wyprawy wkrótce stały się kwestią polityczną po tym, jak [ROOT.GetCountry.GetName] zdecydowało się spełnić życzenia swoich uczonych i wysłać długo wyczekiwaną ekspedycję. Sama podróż w obie strony zajęłaby cenny czas, podczas gdy zrzędliwi członkowie gabinetu nalegali na wysłanie zaledwie kilku negocjatorów, aby zdobyli kilka artefaktów od handlarza antykami."
 lepsius.100.g: "Nie róbmy niczego połowicznie — będzie to długa podróż."
 lepsius.100.h: "Średnio długa podróż jest dobrym kompromisem."
 lepsius.100.i: "Krótka podróż wystarczy."
 lepsius.110.t: "Kontrowersje wokół przywództwa"
 lepsius.110.d: "Inteligencja uważa, że to właśnie jej przedstawiciel jest faworytem do objęcia kierownictwa wyprawy archeologicznej. Jednak pojawia się wiele głosów sprzeciwu."
 lepsius.110.f: "Elity kraju są podzielone. Państwowe wsparcie dla wyprawy sprowadziło na scenę krytyków i zazdrosnych ludzi. Inteligencja kraju postrzega przedsięwzięcie jako swoją domenę. Zarówno siły opozycyjne, jak i rządowe domagają się przyznania im stanowiska obserwatorów. Nie ulega wątpliwości, że przedstawiciel inteligencji byłby najlepiej wykwalifikowany do tego zadania, ale istnieją również inne możliwości..."
 lepsius.110.g: "Inteligencja jest najbardziej wykwalifikowana."
 lepsius.110.h: "Przedstawiciel rządu będzie towarzyszył wyprawie."
 lepsius.110.i: "Polityk opozycji będzie odpowiedni do tego zadania."
 lepsius.110.j: "Ktoś z doświadczeniem archeologicznym powinien wykonać to zadanie."
 lepsius.110.k: "Ten zaszczyt należy wyłącznie do następcy tronu."
 lepsius.120.t: "Attaché wojskowy"
 lepsius.120.d: "Zdecydowanie zaleca się zatrudnienie attaché wojskowego do wyprawy archeologicznej."
 lepsius.120.f: "Wojsko przedstawiło trzech możliwych kandydatów do pełnienia funkcji attaché wojskowych podczas wyprawy. Decyzja została dziś przekazana przez Ministerstwo Wojny. Wybór musi jeszcze zostać potwierdzony."
 lepsius.120.g: "[SCOPE.sCharacter('lepsius_military_attache_1').GetFullName]."
 lepsius.120.h: "[SCOPE.sCharacter('lepsius_military_attache_2').GetFullName]."
 lepsius.120.i: "[SCOPE.sCharacter('lepsius_military_attache_3').GetFullName]."
 lepsius.130.t: "Artyści dołączają do wyprawy"
 lepsius.130.d: "Grupa artystów z naszej Akademii wyraziła zainteresowanie udziałem w nadchodzącej wyprawie archeologicznej."
 lepsius.130.f: "W akademii sztuki rozeszła się wieść, że wkrótce wyprawa będzie poszukiwać zaginionych miast i nieznanych skarbów sztuki. Rysownicy i malarze już wcześniej czerpali inspirację z atmosfery, kolorów i scen podczas egipskiej wyprawy Napoleona. Jest wystarczająco wielu chętnych, którzy chcą wykonywać dla nas rysunki i szkice stanowisk archeologicznych. Oczywiście takie rozszerzenie wyprawy powoduje dodatkowe koszty, ale z pewnością jest warte tych pieniędzy."
 lepsius.130.a: "Są serdecznie zaproszeni."
 lepsius.130.b: "Dziękujemy, ale nie skorzystamy."
 lepsius.140.t: "Archeolog rekrutuje doświadczonych uczonych"
 lepsius.140.f: "Wspólne zainteresowania nas łączą: nasz przywódca ma kontakty z innymi uczonymi zajmującymi się archeologią, historią i antropologią. Takie rozszerzenie grona członków wyprawy z pewnością pozytywnie wpłynęłoby na wyniki całego przedsięwzięcia. Nie jest to jednak przysługa przyjacielska: państwo musi pokryć koszty wyżywienia, zakwaterowania i wynagrodzenia. Niektórzy mogliby nazwać takie zaopatrywanie wyprawy przez „przyjaciół” jej przywódcy nepotyzmem, ale zapewnił nas on, że powodem rozszerzenia są wyłącznie względy naukowe."
 lepsius.140.a: "Wzbogacenie dla zespołu."
 lepsius.140.b: "Nie będziemy opłacać klik naszego archeologa!"
 lepsius.150.t: "Przyrodnicy dołączają do wyprawy"
 lepsius.150.d: "Naukowcy chcą przeprowadzić eksperymenty podczas nadchodzącej wyprawy."
 lepsius.150.f: "Uniwersytety naszego kraju nie pozostały obojętne na obecne wydarzenia. Niektórzy naukowcy chcieliby towarzyszyć wyprawie, aby badać warunki geograficzne, porównywać obliczenia astronomiczne lub przeprowadzać eksperymenty pogodowe. Inni uważają, że próbki skał i drewna mogą poprawić naukowe wyniki wyprawy. Z wielu wybranych naukowców jasno wynika, że od dawna czekali na okazję, aby udać się do długo wyczekiwanych obcych krajów: po prostu czekają na wymówkę, by dołączyć jako darmowi pasażerowie. A ich życzenia są również kosztowne!"
 lepsius.150.a: "Wspaniały pomysł!"
 lepsius.150.b: "Nie możemy zaspokoić potrzeb każdej kudłatej brody..."
 lepsius.200.t: "Wyprawa dociera do miejsca rozpoczęcia podróży"
 lepsius.200.d: "Wyprawa dotarła do miejsca rozpoczęcia podróży. Czas na dokonanie ostatnich przygotowań przed wyruszeniem."
 lepsius.200.f_ex_upe: "„Luksor, Luksor!” — okrzyk rozchodzi się w szeregach, gdy na horyzoncie pojawia się świątynia Karnaku. Łódź grozi przewróceniem się do Nilu, gdy członkowie wyprawy tłoczą się przy burcie, spoglądając na sylwetkę miasta znanego w starożytnym Egipcie jako Teby. Ruiny budowli liczących tysiące lat ciągną się wzdłuż brzegów Nilu, obeliski wznoszą się pomiędzy podupadłymi domami i namiotami. Jednak po drugiej stronie Nilu wyrastają piaszczystobrązowe pasma górskie, w których ukryta jest legendarna Dolina Królów, gdzie podobno wciąż znajdują się nieznane grobowce faraonów. Zanim jednak będziemy mogli się tym zająć, wciąż mamy kilka spraw do załatwienia w Luksorze..."
 lepsius.200.f_ex_loe: "„Matka Świata” leży nad wodami Nilu, lśniąc w słońcu. Minarety i kopuły zdobią panoramę i opowiadają o potędze oraz znaczeniu tego miasta, które niegdyś i dziś pomagało kształtować losy Bliskiego Wschodu. Kolorowe bazary i dywany charakteryzują ulice, podobnie jak wyszukane zdobienia architektury fatymidzkiej. Jednak widok sięga dalej — daleko poza miasto, gdzie wierzchołki piramid zwiastują minioną epokę, będącą prawdziwym celem naszej podróży. Zanim jednak tam dotrzemy, musimy podjąć kilka środków ostrożności w Kairze."
 lepsius.200.f_ex_bab: "Bagdad, największe miasto Mezopotamii, tętni życiem. Podobnie jak Kair, jest centrum świata arabskiego; podobnie jak Kair, był niegdyś siedzibą władzy i prestiżu. Jednak w przeciwieństwie do Kairu, gdzie odległe piramidy w Gizie zwiastują jeszcze starszy świat, w Bagdadzie niewiele jest tego, co przywodzi na myśl imperia Babilonu i Akadu. Nawet rzekome antyki, które nieco nieostrożny członek wyprawy kupił od podejrzanego handlarza, okazały się podróbkami. Podczas gdy kamienne budowle Egipcjan i Majów wciąż świadczą o zaginionych cywilizacjach, tutaj nie ma prawie nic porównywalnego. Prawdopodobnie będziemy musieli zacząć od zera."
 lepsius.200.f_ex_ass: "Co jeszcze można znaleźć w Asyrii po tym, jak Layard prowadził wykopy w Nimrud? Całkiem sporo – zdaniem pewnego kupca z Mosulu. Zaledwie miesiąc temu z piasku wyłoniła się głowa lamasu. A bazar zawsze ma do zaoferowania dobre okazy, jak nam zapewnia. Fakt, że całej serii artefaktów nie udało się wydobyć, ma również związek z kurdyjskimi rodami zamieszkującymi te tereny, które nie pozwalają każdemu na kłusownictwo na swoim terytorium – niezależnie od posiadanej licencji na wykopaliska. Bierzemy to ostrzeżenie ze sobą i zaopatrujemy się w najpotrzebniejsze rzeczy, zanim ruszymy w drogę."
 lepsius.200.f_ex_arg: "Ach, stare, dobre Ateny! Może i niezbyt stare jak na to, czego szuka nasz zespół badawczy, ale wystarczająco dobre, by spędzić parę dodatkowych dni w Attyce. Grecja nie ma zbyt wielu dużych miast, więc nasza ekspedycja nie miała wielkiego wyboru i musiała poczynić najpotrzebniejsze przygotowania na miejscu, zanim wyruszy na prowincję. Nasz przewodnik archeologiczny mocno nas ponagla, jako że niektórzy uczeni marnują zbyt wiele czasu na rozpraszacze – czy to klasyczny marmur, czy greckie wino. Ciepłe słońce, cień drzew oliwnych i arkadyjska idylla wręcz zapraszają, by posiedzieć i odpocząć – niektórzy zdają się już zapominać, po co naprawdę tu jesteśmy."
 lepsius.200.f_ex_cre: "Lekka bryza wieje od strony Morza Egejskiego, gdy nasza ekspedycja dociera do portu w Heraklionie. Dawne weneckie bastiony witają nas, przywodząc na myśl czasy, gdy Candia była średniowiecznym centrum handlowym. Po wyładunku towarów w akompaniamencie krzyku mew i wyjściu uczestników na ląd, po życzliwym powitaniu przychodzi czas na gorzką rzeczywistość. Podczas gdy niektórzy narzekają na lokalną kuchnię i żądają lepszego zakwaterowania, główny archeolog ma niewiele wyrozumiałości dla tak mało intelektualnych zachcianek. Dla niego Heraklion to zaledwie przystanek – w głębi wyspy czekają bowiem skarby Minojczyków."
 lepsius.200.f_ex_yuc: "W Mēridzie nasz zespół wykopaliskowy czyni ostatnie przygotowania przed wielkim wyruszeniem w drogę. Ślady hiszpańskiego podboju i kolonizacji nadają charakter miastu, które mimo niewielkich rozmiarów pokazuje, że wraz z Campeche było niegdyś miejscem, z którego Hiszpanie sprawowali kontrolę nad półwyspem. Rzekomo niespełna 100 mil stąd znajdują się ruiny Majów, które w ciągu ostatnich stuleci odzyskała dżungla. Uczestnicy naszej ekspedycji nie unikną przedzierania się w głąb gęstwiny, jeśli chcą odkryć nowe świątynie, a może nawet całe miasta..."
 lepsius.200.f_ex_per: "Andy górują niczym królowie nad głowami swoich poddanych; ich szczyty spoglądają na nas z majestatem, jakby chciały poddać próbie naszą godność, zanim pozwolą nam wkroczyć do swoich dolin. Podróż do Cuzco była uciążliwa, jednak postęp technologiczny sprawia, że wyprawy nie są już ryzykownymi przedsięwzięciami pełnymi nieprzewidywalności. Na ulicach dawnej stolicy Inków historyczna dominacja Hiszpanów łączy się z urokiem andyjskiej architektury. Pomiędzy nimi idealnie dopasowane cyklopowe mury wciąż dają świadectwo kunsztowi dawnych władców. Ruiny inkaskiej twierdzy Sacsayhuamán, znajdujące się o rzut kamieniem od centrum, stanowią zaledwie przedsmak tego, czego uczestnicy ekspedycji będą szukać podczas tej wyprawy."
 lepsius.200.g: "Ah, Egipt"
 lepsius.200.h: "Ah, Mezopotamia"
 lepsius.200.i: "Ah, Grecja"
 lepsius.200.j: "Ah, komary i śmiertelne choroby."
 lepsius.200.k: "Ah, Peru"
 lepsius.210.t: "Tłumacze i tajemniczy przewodnik"
 lepsius.210.d: "Wśród członków ekspedycji nie ma zgody co do tego, czy pozostałe pieniądze powinniśmy wydać na kilku wykwalifikowanych tłumaczy, czy też na tajemniczego przewodnika."
 lepsius.210.f: "To nie kwestia ilości czy jakości, nawet jeśli niektórzy członkowie naszej ekspedycji tak to przedstawiają. Tłumacze mają nie tylko tę zaletę, że znają język, ale również tę, że lokalni mieszkańcy szybciej obdarzają ich zaufaniem. Szansa na uzyskanie informacji o artefaktach jest znacznie wyższa. Z drugiej strony, tajemniczy przewodnik mógłby zaprowadzić nas w wyjątkowe miejsca, których inaczej byśmy nie znaleźli lub trafilibyśmy na nie z wielkim trudem – miejsca skrywające niezwykłe artefakty i nieznane wyzwania."
 lepsius.210.a: "Przydałoby nam się kilku tłumaczy."
 lepsius.210.b: "Potrzebujemy przewodnika, który zna sekrety tej okolicy."
 lepsius.220.t: "Archaeologist buys artifacts"
 lepsius.220.d: "Nasz dowódca ekspedycji znalazł i nabył kilka cennych artefaktów na lokalnym targu."
 lepsius.220.f: "Rabusie grobowców, poszukiwacze skarbów i awanturnicy przemierzali światowe stanowiska archeologiczne na długo przed tym, jak pierwsza noga archeologa stanęła na tamtejszej ziemi. To gorzka prawda. W wielu przypadkach artefakty przepadają bez śladu, trafiają do prywatnych kolekcji lub – jeśli są wykonane z metali szlachetnych – bywają wręcz przetapiane. Jednak nawet te znaleziska, które udaje się odzyskać, obarczone są skazą: ich pochodzenie może nigdy nie zostać wyjaśnione. Doświadczeni archeolodzy mają jednak wyczucie nie tylko do wykopywania zabytków, ale i do odnajdywania ich w handlu oraz rekonstruowania ich proweniencji."
 lepsius.220.g: "Co za miła niespodzianka."
 lepsius.230.t: "Pisanie dziennika"
 lepsius.230.d: "Zainspirowany egzotycznym otoczeniem i codziennymi wrażeniami, nasz kierownik ekspedycji zaczął prowadzić dziennik."
 lepsius.230.f: "Każdy kraj i każde miejsce ma własne barwy i zapachy. Mistycyzm Orientu, magia Grecji oraz legendy Majów i Inków od dawna urzekały ludzi. Innych fascynowała nieznana codzienność, niezrozumiałe języki czy wręcz obcość świata, w który rzucono awanturnika. Czasami już samo pisanie wystarczało, by przetrawić ogrom wrażeń – i uwiecznić je na papierze."
 lepsius.230.g: "Niepoprawna romantyczna dusza."
 lepsius.240.t: "Pisanie traktatu"
 lepsius.240.d: "Nasz dowódca ekspedycji postanowił spisać rozprawę naukową poświęconą przebiegowi wyprawy."
 lepsius.240.f: "Może się to wydawać zaskakujące, ale nie każdy ma czas na prowadzenie własnych zapisków obok wykonywania swoich obowiązków. Niektóre zagadnienia nie znajdują miejsca w oficjalnych raportach, być może dlatego, że zbytnio odbiegają od głównego tematu lub postawiona teza nie jest jeszcze wystarczająco dopracowana. Tak czy inaczej, przywódca naszej wyprawy najwyraźniej znalazł temat, którym chciałby się zająć niezależnie od oficjalnej sprawozdawczości, a następnie opublikować wyniki swoich badań."
 lepsius.240.g: "Miejmy nadzieję, że wyniknie z tego coś pożytecznego."
 lepsius.250.t: "Bójka w karczmie"
 lepsius.250.d: "Negatywne cechy przywódcy naszej wyprawy doprowadziły do incydentu dyplomatycznego."
 lepsius.250.g: "Żenujące..."
 lepsius.260.t: "Uznanie"
 lepsius.260.d: "Pozytywne cechy przywódcy naszej wyprawy przyczyniły się do powszechnego uznania naszego przedsięwzięcia archeologicznego."
 lepsius.260.g: "Wspaniale"
 lepsius.270.t: "Lody i lemoniada"
 lepsius.270.g: "Trzeba podróżować z klasą."
 lepsius.280.t: "Audiencja"
 lepsius.280.f: "Miejscowy gubernator usłyszał o wyprawie i wezwał do siebie przywódcę misji archeologicznej. Zainteresowały go cele wyprawy, a także sam gość, który wzbudził jego ogromną ciekawość. Podczas rozmowy naszemu przywódcy udało się nie tylko umilić gospodarzowi czas, ale również wywrzeć na nim tak duże wrażenie swoimi umiejętnościami, że gubernator zaoferował swoją pomoc. Jak się okazało, posiadał cenny artefakt, który w geście dobrej woli podarował naszej wyprawie."
 lepsius.280.g: "Wspaniały prezent!"
 lepsius.290.t: "Attaché wojskowy zatrudnia strażników"
 lepsius.290.d: "Attaché wojskowy naszej wyprawy archeologicznej zatrudnił kilku najemników, aby zapewnić bezpieczeństwo podczas naszej podróży."
 lepsius.290.f: "Najwyraźniej Ministerstwo Wojny miało szczęśliwą rękę przy wyborze naszego attaché wojskowego. Dzięki swoim umiejętnościom zyskał uznanie miejscowego oficera, z którym omówił możliwość przydzielenia grupy strażników do ochrony naszej wyprawy. W zamian odwiedził oddział wojsk kraju goszczącego i podzielił się swoją wiedzą fachową."
 lepsius.290.g: "Wojsko wybrało właściwego człowieka."
 lepsius.300.t: "Wyprawa archeologiczna rozpoczyna się!"
 lepsius.300.d: "Wszystko zostało spakowane, ostatni pomocnicy zostali zwerbowani, plan wyprawy jest gotowy — podróż może się rozpocząć."
 lepsius.300.f: ""
 lepsius.300.g: "Ruszamy!"
 lepsius.310.t: "Wyprawa archeologiczna dobiega końca"
 lepsius.310.d: "Wyprawa archeologiczna dobiegła końca. Czas podsumować jej zdobycze!"
 lepsius.310.f: "Była to wyczerpująca podróż, pełna trudności i przeszkód, ale podczas wyprawy nasz naród nie tylko poszerzył swoją wiedzę o przeszłości, lecz także zdobył cenne artefakty dla muzeum. Niektórzy pomocnicy już odeszli, a część członków wyprawy marzy o powrocie do domu. Tymczasem przywódca wyprawy zlicza zdobyte drobniejsze artefakty, które składają się na sukces całego przedsięwzięcia. Po romantycznej przygodzie nadchodzi czas na żmudne katalogowanie."
 lepsius.310.g: "Wznieśmy toast za naukę! A teraz sprowadźmy naszych ludzi do domu."
 lepsius.310.h: "To dopiero początek — rozpocznij długoterminowe wykopaliska archeologiczne."
 lepsius.311.t: "Archeolog publikuje dziennik"
 lepsius.311.f: ""
 lepsius.311.g: "Inspiracja dla nas wszystkich."
 lepsius.312.t: "Archeolog publikuje pracę naukową"
 lepsius.312.f: ""
 lepsius.312.g: "Powinniśmy zdobyć egzemplarz dla biblioteki narodowej."
 lepsius.313.t: "Przywódca wyprawy wraca do domu"
 lepsius.313.d: "[SCOPE.sCharacter('lepsius_relaxing_archaeologist').GetFullName] powrócił z wyprawy archeologicznej. Doświadczenia zdobyte podczas podróży wywarły na nim głębokie wrażenie. Teraz jednak czeka go żmudna analiza odnalezionych artefaktów — nawet tych mniej znaczących, takich jak skorupy naczyń, skrawki tkanin i kawałki drewna."
 lepsius.313.f: "Właściwa praca archeologiczna, żmudne katalogowanie wszystkich przedmiotów, ich klasyfikacja oraz wyciąganie wniosków na temat przeszłości w murach zatęchłych uniwersytetów, jest mniej atrakcyjna i pełna przygód, niż mogłoby sugerować życie archeologa. #V Zazwyczaj zajmuje to trzy lata.#! Jeśli jednak naród potrzebowałby swojego archeologa — być może do lokalnych wykopalisk — lepiej byłoby natychmiast zwolnić uczonego z [SCOPE.sCharacter('lepsius_relaxing_archaeologist').GetHerHis] obowiązków. Doktor [SCOPE.sCharacter('lepsius_relaxing_archaeologist').GetLastName] mógłby być za to nawet wdzięczny."
 lepsius.313.g: "Zabierzmy się za katalogowanie!"
 lepsius.401.t_bedouin: "Najazd Beduinów"
 lepsius.401.t_kurdish: "Najazd Kurdów"
 lepsius.401.d: "Nasza wyprawa archeologiczna została zaatakowana przez miejscowe plemiona."
 lepsius.401.f_bedouin: "Nie wszystkie obszary pustyni znajdują się pod pełną kontrolą rządu. Niektóre plemiona beduińskie skutecznie opierają się państwowej modernizacji i przemianom społecznym. Klany wciąż żyją tak, jak ich przodkowie przed wiekami. Napady na karawany i nieostrożnych podróżników są na porządku dziennym. Atak Beduinów dotknął również naszą wyprawę: skradziono kosztowności i sprzęt archeologiczny, a także uprowadzono wielbłądy. Przywódca wyprawy prosi nas o interwencję u władz, aby podobne incydenty zagrażające wyprawie więcej się nie powtórzyły. Oczywiście zostanie to uznane za ingerencję w sprawy wewnętrzne..."
 lepsius.401.f_kurdish: "Góry Zagros, graniczące z Mezopotamią od północy i wschodu, od wieków są zamieszkiwane przez plemiona kurdyjskie, które tylko w niewielkim stopniu podlegają kontroli miejscowych władz. Wiele z nich działa na własną rękę, uznając jedynie władzę swojego plemienia. Raz po raz dokonują najazdów. Tym razem atak Kurdów dotknął również naszą wyprawę: skradziono kosztowności i sprzęt archeologiczny, a także uprowadzono wielbłądy. Przywódca wyprawy prosi nas o interwencję u władz, aby podobne incydenty zagrażające wyprawie więcej się nie powtórzyły. Oczywiście zostanie to uznane za ingerencję w sprawy wewnętrzne..."
 lepsius.401.g: "Złóż oficjalną skargę do władz."
 lepsius.401.h: "Poradzimy sobie sami."
 lepsius.401.i: "Ukarz ich!"
 lepsius.401.j: "Strażnicy!"
 lepsius.402.t_desert: "Burza piaskowa"
 lepsius.402.t_tropical: "Burza tropikalna"
 lepsius.402.d: "Nasza wyprawa archeologiczna musi stawić czoła niszczycielskiej burzy!"
 lepsius.402.f_desert: "Początkowo był to tylko lekki wiatr, który sypał piaskiem w oczy członkom naszej wyprawy. Później jednak wiatr przybrał na sile do tego stopnia, że powalał ludzi i zwierzęta juczne. Nawet po wielu godzinach burza piaskowa nie straciła nic ze swojej gwałtowności. Kiedy nasi archeolodzy zapytali miejscowego mieszkańca o to zjawisko, odpowiedział, że tego rodzaju burze są normalne o tej porze roku. Te pustynne burze mogą zagrozić całej naszej wyprawie!"
 lepsius.402.f_tropical: "Nagłym ulewom, które pewnego popołudnia nawiedziły członków naszej wyprawy, nie towarzyszyły wcześniej ani grzmoty, ani błyskawice. Początkowo szukali schronienia, lecz po kilku godzinach zdali sobie sprawę, że ta burza tropikalna znacznie różni się od zwykłych opadów deszczu w tym regionie. Jeden z naszych tragarzy zasugerował nawet, że może to być prawdziwy huragan!"
 lepsius.402.g: "Ten lekki wietrzyk nas nie powstrzyma."
 lepsius.402.h: "Sytuacja jest zbyt niebezpieczna, wyprawa musi zaczekać."
 lepsius.403.t: "Mgła w Andach"
 lepsius.403.d: "Po tym, jak attaché wojskowy po raz kolejny naraził naszą wyprawę na niebezpieczeństwo, pozostali uczestnicy domagają się wyciągnięcia konsekwencji."
 lepsius.403.f: "Członkowie naszej wyprawy w Andach narzekają na attaché wojskowego. Kilkakrotnie poprowadził grupę w niewłaściwym kierunku podczas poszukiwań starożytnego stanowiska Inków. Ostatnio, chcąc jak najszybciej dotrzeć do celu, nie wziął nawet pod uwagę mgły panującej w górach. Z tego powodu wyprawa straciła cenny czas. Niektórzy członkowie domagają się wyznaczenia nowego przywódcy."
 lepsius.403.g: "Powinien zostać zwolniony ze swoich obowiązków."
 lepsius.403.h: "Dobrze wykonał swoją pracę."
 lepsius.404.t_aegean: "Zniszczony most"
 lepsius.404.t_peru: "Zniszczony most wiszący"
 lepsius.404.d: "Zniszczony most uniemożliwia naszej wyprawie dalszą podróż."
 lepsius.404.f_aegean: "Grecja i Kreta słyną z górzystych i trudno dostępnych terenów. Gdy nasza wyprawa dociera do wąwozu, okazuje się, że niedawne osuwisko zniszczyło jeden z filarów mostu. Musimy zdecydować, czy naprawić most i kontynuować podróż do pierwotnie wyznaczonego celu, czy udać się w inne miejsce. Druga możliwość jest szybsza i tańsza, ale prawdopodobnie przyniesie mniej znaczące odkrycia archeologiczne."
 lepsius.404.f_peru: "Po mozolnej wspinaczce przez andyjskie przełęcze i wąskie drogi biegnące wzdłuż górskich zboczy nasza wyprawa archeologiczna napotyka nieoczekiwany problem. Most wiszący, który według miejscowych prowadzi do świątyni owianej legendami, został doszczętnie zniszczony. Niektórzy uczestnicy wyprawy nalegają, by porzucić poszukiwania i udać się do łatwiej dostępnego stanowiska archeologicznego. Miejscowi przekonują jednak, że warto podjąć ten trud. Odbudowa mostu będzie nas jednak kosztować czas i pieniądze."
 lepsius.404.g: "Odbuduj most."
 lepsius.404.h: "Znajdź inną drogę."
 lepsius.405.t_mesopotamia: "Złe drogi w Mezopotamii"
 lepsius.405.t_yucatan: "Złe drogi na Jukatanie"
 lepsius.405.d: "Zły stan dróg stawia przed naszą wyprawą wyzwania, o jakich dotąd nawet nie śniliśmy."
 lepsius.405.f_mesopotamia: "Niestety nie wszystkie drogi są w tak dobrym stanie, jakiego można by oczekiwać. Szczególnie boczne drogi i ścieżki, oddalone od głównych szlaków handlowych, znajdują się w wyjątkowo złym stanie. Jednak potencjalne cele naszej podróży leżą daleko od ośrodków cywilizacji. Podróż jest trudna, a niektórzy uczestnicy wyprawy już narzekają, że powinniśmy byli wybrać inną trasę."
 lepsius.405.f_yucatan: "Dżungle Jukatanu nawet w dzisiejszych czasach pozostają w dużej mierze niezagospodarowane. Dzięki temu są atrakcyjnym celem wypraw archeologicznych, ponieważ wiele ruin od wieków nie było dokładnie badanych przez człowieka. Z drugiej strony podróż przez te tereny jest pełna trudności. Poza kilkoma dobrze wydeptanymi leśnymi ścieżkami praktycznie nie ma tu żadnych dróg. Uczestnicy wyprawy już zaczynają narzekać na decyzję o wyborze tej trasy."
 lepsius.405.g: "Spróbuj innej ścieżki."
 lepsius.405.h: "Zainwestuj w zatrudnienie nowych ludzi i zakup zwierząt jucznych, aby ułatwić podróż."
 lepsius.405.i: "Trzymamy się tej drogi."
 lepsius.406.t: "Katastrofa statku wyprawy!"
 lepsius.406.d: "Nasz attaché wojskowy jest odpowiedzialny za wyjątkowo niefortunne zdarzenie."
 lepsius.406.f: "Jeden ze statków naszej wyprawy rozbił się na Morzu Egejskim. Na szczęście nikt nie ucierpiał, jednak znaczna część naszego sprzętu archeologicznego zatonęła niedaleko brzegu. Większość uczestników wyprawy obwinia kapitana o niezauważenie mielizny. Ten jednak broni się, twierdząc, że chciał jak najszybciej zakończyć podróż, a rafa nie była zaznaczona na żadnej mapie. Wśród członków wyprawy narasta przekonanie, że pod obecnym przywództwem nasze szanse na sukces są coraz mniejsze."
 lepsius.406.g: "To on ponosi odpowiedzialność."
 lepsius.406.h: "Kupmy nowy sprzęt i udawajmy, że nic się nie stało."
 lepsius.407.t: "Oaza"
 lepsius.407.d: "Podczas podróży nasi archeolodzy odkryli nieznaną dotąd oazę i uzupełnili zapasy wody."
 lepsius.407.f: "W rzeczywistości członkowie wyprawy spodziewali się, że będą musieli przetrwać kilka trudnych dni: starożytne egipskie ruiny, które chcieli zbadać, miały znajdować się gdzieś na pustyni, w odległości dwóch do trzech dni marszu. Ku ich wielkiemu zaskoczeniu okazało się jednak, że po drodze znajduje się oaza: czekały tam na nich palmy z dorodnymi daktylami oraz drzewa figowe ze słodkimi owocami. Uzupełniono zapasy wody, a niektórzy uczestnicy skorzystali z okazji, by wykąpać się w egipskim słońcu."
 lepsius.407.g: "Orzeźwiające wieści."
 lepsius.408.t: "Amulet Nazara"
 lepsius.408.d: "Niektórzy z wynajętych tragarzy wierzą, że przywódcę naszej wyprawy archeologicznej prześladuje „złe oko”. Namawiają go, aby kupił amulet."
 lepsius.408.g: "Kup amulet."
 lepsius.408.h: "Ten przesąd jest sprzeczny z wszelkimi przekonaniami naukowymi!"
 lepsius.409.t: "Przyjaźni rybacy"
 lepsius.409.d: "Kilku przyjaznych rybaków przepływających wzdłuż wybrzeża zaoferowało, że przewiezie sprzęt naszej wyprawy na odległość kilku mil."
 lepsius.409.g: "Bardzo pomocne."
 lepsius.410.t_yucatan: "Papuga maskotka"
 lepsius.410.t_peru: "Groźny kondor"
 lepsius.410.d_yucatan: "Odkąd zagłębiliśmy się w dżunglę Jukatanu, towarzyszy nam mała, kolorowa papuga."
 lepsius.410.d_peru: "Odkąd wspięliśmy się w Andy, każdego dnia towarzyszy nam cień potężnego kondora."
 lepsius.410.f_yucatan: "Lasy Jukatanu pełne są niebezpieczeństw: w zaroślach czają się jaguary, węże i jadowite owady. Jednocześnie uczestnicy wyprawy są zafascynowani miejscową florą i fauną, a szczególnie małą, kolorową papugą, która przelatuje nad ich kapeluszami i hełmami, nie odstępując podróżników na krok. Ptak okazuje się niezwykle inteligentny i zdążył już przyzwyczaić się do regularnego karmienia. Przywódca wyprawy ogłosił papugę maskotką całej grupy i zamierza zabrać ją do domu po zakończeniu podróży."
 lepsius.410.f_peru: "Kondor jest królem Andów. Te ogromne ptaki królują w przestworzach, a ich cienie przybierają niewyobrażalne rozmiary. Od początku wyprawy jeden z nich krąży nad naszymi alpakami i tragarzami w sposób budzący prawdziwy niepokój. Miejscowi nie ufają temu ptakowi. Jako padlinożerca znany jest z tego, że krąży raczej nad zwłokami niż nad żywymi istotami. Wśród niektórych uczestników wyprawy zaczyna narastać złe przeczucie."
 lepsius.410.g: "Dobry omen."
 lepsius.410.h: "Powinien zostać naszym pupilem."
 lepsius.410.i: "Zły omen."
 lepsius.410.j: "Będzie nasz."
 lepsius.411.t: "Wyczerpane zwierzęta juczne"
 lepsius.411.d: "Wygląda na to, że nadmiernie przeciążyliśmy nasze zwierzęta juczne."
 lepsius.411.f: "Od wielu dni zmuszamy nasze zwierzęta juczne do ciężkiej pracy. Niektórzy twierdzą nawet, że trwa to już zbyt długo. Teraz widać u nich wyraźne oznaki zmęczenia. Część zwierząt odmawia dalszego marszu i można je zmusić do ruchu jedynie uderzeniami. Dziś rano padło pierwsze z nich."
 lepsius.411.g: "Odpoczną, jak zdechną."
 lepsius.411.h: "Pozwólmy im odpocząć!"
 lepsius.412.t: "Wyprawa archeologiczna zakończyła się niepowodzeniem!"
 lepsius.412.d: "Od dwóch miesięcy nie mamy żadnego kontaktu z naszą wyprawą archeologiczną."
 lepsius.412.f: "Czasami po prostu ma się pecha. Niektórzy przesądni mieszkańcy twierdzą nawet, że nad całą naszą wyprawą ciąży fatum. Tak czy inaczej, całkowicie straciliśmy kontakt z naszą wyprawą archeologiczną. Od ostatniej wiadomości minęło już sporo czasu. Jesteśmy przekonani, że archeolodzy wkrótce powrócą, jednak na razie wygląda na to, że wszyscy uczestnicy wyprawy zabłądzili."
 lepsius.412.g: "A niech to!"
 lepsius.413.t: "Egzotyczne choroby"
 lepsius.413.d: "Niektórzy uczestnicy naszej wyprawy archeologicznej są poważnie chorzy."
 lepsius.413.f: "Choroby od zawsze utrudniały dalekie podróże. Czy to w tropikach, na pustyniach, bagnach, czy w wysokich górach – członkowie naszej wyprawy nie są przyzwyczajeni do panujących tam warunków, a nieznane patogeny czyhają na każdym kroku. Szczególnie malaria wciąż zbiera kolejne żniwo. Podczas podróży niektórzy uczestnicy zapadli na tak poważne choroby, że nie są już w stanie wykonywać żadnej pracy."
 lepsius.413.g: "Poczekajmy, aż ich wyleczymy."
 lepsius.413.h: "Zostawmy ich."
 lepsius.414.t: "Korupcja"
 lepsius.414.d: "Nasza wyprawa jest nękana przez miejscowych urzędników, którzy uniemożliwiają jej dalszą podróż."
 lepsius.414.f: "Od początku naszej wyprawy jej uczestnicy muszą znosić różnego rodzaju szykany. Urzędnicy niższego i średniego szczebla utrudniają nam życie, wymagając kolejnych pieczątek i dodatkowych opłat. Jeden z nich zakwestionował nawet ważność naszych wiz i chciał nałożyć na nas grzywnę. Sytuacja jest niezwykle zagmatwana. Najwyraźniej w tym kraju bez odpowiednich znajomości lub powiązań rodzinnych nie da się niczego załatwić."
 lepsius.414.g: "Zdziercy!"
 lepsius.414.h: "Złodzieje!"
 lepsius.414.i: "Politycy!"
 lepsius.415.t: "Powódź"
 lepsius.415.d: "Gdy powódź pustoszy kraj, przywódca naszej wyprawy dostrzega kobietę porywaną przez wezbrane wody."
 lepsius.415.f: "Nieustanne deszcze ostatnich dni sprawiły, że rzeka wystąpiła z brzegów. To wyjątkowe warunki pogodowe, ale członkowie naszej wyprawy byli na nie przygotowani. Choć rzeka zamieniła się w rwący potok, nasi ludzie kontynuują podróż, aż nagle od strony brzegu rozlega się krzyk. Przez krótką chwilę przywódca naszej wyprawy dostrzega barwną sylwetkę unoszoną przez nurt. Teraz trzeba działać szybko, nawet jeśli oznaczałoby to znaczne opóźnienie dalszej podróży."
 lepsius.415.g: "Uratujmy ją!"
 lepsius.415.h: "Wyprawa nie może czekać!"
 lepsius.416.t: "Dobra pogoda"
 lepsius.416.d: "Wyprawa archeologiczna posuwa się naprzód w zaskakująco szybkim tempie."
 lepsius.416.f: "Nasza wyprawa posuwa się naprzód w dobrym tempie. Czasami brak wiadomości to najlepsza wiadomość, a w tym przypadku nasi archeolodzy są przekonani, że uda im się odnaleźć obiecujące, a może nawet wyjątkowo cenne stanowisko archeologiczne. Poza tym nie ma niczego godnego uwagi, z wyjątkiem pięknej pogody!"
 lepsius.416.g: "Co za satysfakcja."
 lepsius.417.t: "Gościnni mieszkańcy"
 lepsius.417.d: "Miejscowi życzliwie przyjęli naszą wyprawę, ale być może udałoby się uzyskać od nich jeszcze więcej..."
 lepsius.417.f: "Nasza wyprawa zatrzymała się w niewielkiej wiosce. Jej mieszkańcy okazali się niezwykle gościnni, oferując uczestnikom wygodne miejsce do odpoczynku oraz zapewniając pożywienie zwierzętom. Podczas rozmów z miejscowymi pojawiły się sugestie, że mogą oni wiedzieć znacznie więcej o okolicy, w tym również o pozostałościach dawnych cywilizacji..."
 lepsius.417.g: "Musimy dowiedzieć się wszystkiego."
 lepsius.417.h: "Niech zostanie tak, jak jest."
 lepsius.418.t: "Miejscowy przewodnik"
 lepsius.418.d: "Miejscowy przewodnik zaoferował swoje usługi naszej wyprawie."
 lepsius.418.f: "Czasami trzeba po prostu mieć szczęście. Do naszej wyprawy dołączył miejscowy przewodnik, który doskonale zna okolicę i posiada rozległą wiedzę na temat atrakcji tego regionu."
 lepsius.418.g: "Doskonale!"
 lepsius.419.t: "Skrót"
 lepsius.419.d: "Attaché wojskowy naszej wyprawy znalazł skrót prowadzący do ruin, ale żąda czegoś w zamian."
 lepsius.419.f: "Nasz attaché wojskowy donosi o odkryciu skrótu. Podczas wczorajszego popołudniowego postoju wykorzystał przerwę na zbadanie okolicy i twierdzi, że znalazł starą drogę, której nie zaznaczono na żadnej mapie. Jeśli to prawda, odkrycie to może znacznie ułatwić dalszą podróż naszej wyprawie, ale oznacza również, że będziemy musieli go hojnie wynagrodzić..."
 lepsius.419.g: "Wynagrodźmy go i ruszajmy za nim!"
 lepsius.419.h: "Nie róbmy z niego kogoś ważniejszego, niż jest."
 lepsius.420.t: "Zmotywowani ludzie"
 lepsius.420.d: "Nasza wyprawa miała szczęście zatrudnić wyjątkowo zmotywowanych ludzi. Znacznie zwiększa to nasze szanse na sukces."
 lepsius.420.f: "Już z daleka słychać gwizdy i śpiewy. Wyprawa archeologiczna posuwa się naprzód w zaskakująco szybkim tempie. Jej uczestnicy są niezwykle zmotywowani i pewni sukcesu. Z większym spokojem podchodzą do wszelkich przeszkód i problemów. Nie wiemy, co jest tego przyczyną. Być może po prostu mieliśmy szczęśliwą rękę przy doborze ludzi. Tak czy inaczej, ogromnie zwiększa to nasze szanse na sukces."
 lepsius.420.g: "Carpe Diem."
 lepsius.421.t: "Skarabeusz"
 lepsius.421.f: "Niestety podczas niewielkich wykopalisk w pobliżu mastaby nasz zespół archeologów nie znalazł niczego poza małym skarabeuszem o błękitnej barwie lapis lazuli. W starożytnym Egipcie skarabeusz był uważany za symbol szczęścia. Jego zwyczaj toczenia przed sobą kulek łajna wiązano z bogiem Re i jego podróżą po niebie na słonecznej barce. Przywódca naszej wyprawy zapytał, czy moglibyśmy zrobić mały wyjątek i pozwolić mu zatrzymać ten niezbyt istotny przedmiot na pamiątkę."
 lepsius.421.g: "Może zatrzymać artefakt."
 lepsius.421.h: "Wszystkie znalezione artefakty muszą trafić do muzeum – bez wyjątku!"
 lepsius.422.t: "Świątynia w piaskach"
 lepsius.422.d: "Nasi archeolodzy znaleźli coś, co wygląda na macedońską świątynię."
 lepsius.422.f: "Początkowo nasi ludzie myśleli, że to zwykła wydma, jednak niewielki fragment obrobionego wapienia wystający z piasku uświadomił naszym archeologom, że ta niezwykła góra piasku na egipskiej pustyni skrywa pewną tajemnicę. W ciągu kilku dni wyprawa odsłoniła świątynię. Dla niektórych odkrycie okazało się rozczarowaniem, ponieważ budowla nie przypominała starożytnych egipskich świątyń, lecz pochodziła z czasów Aleksandra Wielkiego. Eksperci twierdzą jednak, że świątynia stanowi dowód działalności greckiego wodza w Egipcie, którego grobowca do dziś nie odnaleziono."
 lepsius.422.g: "Śladami Aleksandra Wielkiego..."
 lepsius.422.h: "To wszystko stare bajki."
 lepsius.423.t: "Skrzydlaty lew"
 lepsius.423.d: "Nasi archeolodzy odkopali w Mezopotamii statuetkę przypominającą cherubina."
 lepsius.423.f: "Istoty hybrydowe, łączące cechy ludzi i zwierząt, są szeroko rozpowszechnione na Wschodzie. Nasza wyprawa miała szczęście zabezpieczyć wyjątkowo piękną i doskonale zachowaną statuetkę podczas poszukiwań stanowiska wykopaliskowego; jest już w drodze do naszego muzeum. Równie pouczająca okazała się inskrypcja klinowa, która określa tę istotę jako strażnika świątyni. Nasi archeolodzy wysunęli teorię, że ci świątynni strażnicy są powiązani z izraelskimi cherubinami wspomnianymi w Biblii. Dwaj z nich strzegli również Arki Przymierza znajdującej się w Świątyni Jerozolimskiej."
 lepsius.423.g: "Czy mówimy o zaginionej Arce Przymierza?"
 lepsius.423.h: "Czy mówimy o zaginionej Arce Przymierza?"
 lepsius.423.i: "To wszystko stare bajki."
 lepsius.424.t: "Skład tabliczek klinowych"
 lepsius.424.d: "Nasi archeolodzy odkryli liczne artefakty mezopotamskie."
 lepsius.424.f: "Kiedy nasi archeolodzy badali starożytny mur miejski na obrzeżach niewielkiego miasteczka, nie spodziewali się znaleźć niczego szczególnego. Dopiero podczas oględzin kamieni zauważyli, że wewnątrz konstrukcji znajdują się puste przestrzenie. Po dokładnym zbadaniu muru postanowili wykuć w nim otwór w jednym z miejsc. Jak się okazało, w murze ukryto tabliczki zapisane pismem klinowym! Znalezisko jest zaskakująco dobrze zachowane i dostarcza cennych informacji o starożytnej Mezopotamii."
 lepsius.424.g: "Niesamowite odkrycie!"
 lepsius.425.t: "Orichalkum?"
 lepsius.425.d: "Nasi archeolodzy znaleźli artefakt wykonany z dziwnego, nieznanego materiału."
 lepsius.425.f: "Podczas jednej z naszych wypraw do Grecji archeolodzy dokonali osobliwego odkrycia. Pewnego ranka do dyrekcji muzeum dostarczono niewielką kulkę. Początkowo dyrektor nie rozumiał, dlaczego jego ludzie przysłali mu coś przypominającego zwykłą szklaną kulkę. W normalnych okolicznościach byłoby to zupełnie nieistotne znalezisko. Jednak ta bursztynowa kula wykonana jest z nieznanego materiału, z którym nigdy wcześniej się nie zetknęliśmy. Jak dotąd eksperci nie potrafią ustalić, czym właściwie jest ten artefakt. Niektórzy uważają go za falsyfikat, inni zaś twierdzą, że odkrycie to dowodzi, jak niewiele wiemy o świecie egejskim."
 lepsius.425.g: "Czy Platon nie wspominał o czymś podobnym w swoim dialogu „Kritiasz”...?"
 lepsius.425.h: "To wszystko stare bajki."
 lepsius.426.t: "Skarb ceramiki"
 lepsius.426.d: "Nasi archeolodzy odkryli liczne artefakty egejskie."
 lepsius.426.f: "To, co dla starożytnych było śmieciem, dla archeologa stanowi prawdziwy skarb. To powiedzenie niedawno znalazło potwierdzenie, gdy nasza wyprawa zatrzymała się przy niewielkich ruinach w poszukiwaniu miejsca do prowadzenia wykopalisk. Podczas dokładniejszych oględzin odkryto jamę wypełnioną wyrobami ceramicznymi. Wiele fragmentów naczyń wciąż wymaga ponownego złożenia, ale liczne znaleziska z pewnością wzbogacą kolekcję naszego muzeum."
 lepsius.426.g: "A wszystko to należy do nas!"
 lepsius.427.t: "Jadeit Majów"
 lepsius.427.d: "Nasi archeolodzy znaleźli cenne artefakty Majów wykonane z jadeitu."
 lepsius.427.f: "Jadeit był materiałem powszechnie wykorzystywanym przez Majów w sztuce i religii. Przedstawiciele elit ozdabiali się jadeitem, a boga słońca również przedstawiano na wykonanej z niego biżuterii. Ludy Ameryki Środkowej wytwarzały jednak z jadeitu także narzędzia, ponieważ był on jednym z najtwardszych materiałów znanych w Nowym Świecie. Nasi archeolodzy mieli szczęście znaleźć kilka takich jadeitowych artefaktów podczas ostatnich wykopalisk."
 lepsius.427.g: "To będzie się pięknie prezentować w naszej kolekcji."
 lepsius.428.t: "Idol Inków"
 lepsius.428.d: "Nasi archeolodzy odkopali tajemniczego złotego idola Inków."
 lepsius.428.f: "Dziś rano do muzeum przesyłką ekspresową dostarczono złotą statuetkę przedstawiającą inkaskiego boga Inti. Nasi archeolodzy nie zdradzają, jak ani gdzie ją zdobyli. Na obserwatora spogląda wykrzywiona grymasem twarz, jednocześnie przerażająca i piękna. Niektórzy eksperci wyrazili już wątpliwości, czy przedmiot rzeczywiście pochodzi z czasów Inków. Jego wykonanie wskazuje na nieznaną kulturę. Ponadto niemal całe złoto Inków zostało zrabowane z Peru. Być może jest to najbardziej niezwykły eksponat w naszej dotychczasowej kolekcji prekolumbijskiej. Dyrektor muzeum już szepcze za zamkniętymi drzwiami, że niektóre legendy mogą jednak kryć w sobie ziarno prawdy."
 lepsius.428.g: "Czyżby El Dorado?"
 lepsius.428.h: "To wszystko stare bajki."
 lepsius.429.t: "Kryształowa czaszka"
 lepsius.429.d: "Nasi archeolodzy znaleźli... coś."
 lepsius.429.f: "Nasz archeolog przysięga, że zaufany handlarz pokazał mu niedawno niezwykle interesujący, a zarazem złowieszczy przedmiot. Jest to ludzka czaszka wykonana w całości z mezoamerykańskiego kwarcu. Jej powierzchnia jest zadziwiająco dobrze wypolerowana, a kunszt wykonania przewyższa wszystko, co dotąd wiedzieliśmy o kulturach kontynentu południowoamerykańskiego. Wątpliwości są jednak ogromne. Nawet nasz główny archeolog nie jest do końca pewien, co sądzić o tym artefakcie."
 lepsius.429.g: "Dodajmy ją do naszej kolekcji."
 lepsius.429.h: "To na pewno falsyfikat."
 lepsius.430.t: "Fałszywa kryształowa czaszka"
 lepsius.430.d: "Rzekomy artefakt, który przed laty sprzedano nam jako sensacyjne znalezisko, okazał się falsyfikatem."
 lepsius.430.f: "Jak mogło do tego dojść? Czy byliśmy zbyt nieostrożni? A może zbyt zaślepieni własnymi ambicjami, ponieważ gonimy od jednej sensacji do drugiej i wierzymy tylko w to, w co chcemy wierzyć? Legendarna kryształowa czaszka, którą nasze muzeum nabyło przed laty jako niezwykłą atrakcję, okazała się tandetnym falsyfikatem. Miną lata, zanim uda nam się odbudować naszą reputację w świecie archeologii!"
 lepsius.430.g: "Narodowa kompromitacja naszej archeologii!"
 lepsius.431.t: "Miejscowy zna położenie ruin"
 lepsius.431.d: "Pomocny mieszkaniec okolicy pomógł nam w odnalezieniu artefaktów."
 lepsius.431.f: "Kiedy nasza wyprawa zatrzymuje się w niewielkim miasteczku na swojej trasie, spotykamy starszego rolnika, który słyszał o celu naszej podróży. W zamian za trochę chleba, soli i wody okazuje się niezwykle pomocny. „Pozostali mieszkańcy wioski powiedzieli mi już, czego szukacie” – wyjaśnia. Następnie prowadzi nas przez nieznane tereny, a wędrówka zajmuje pół dnia. Nasi archeolodzy są zaskoczeni, gdy doprowadza nas prosto do starożytnych ruin. Dzięki temu udaje nam się odnaleźć kilka artefaktów, które z pewnością wzbogacą kolekcję naszego muzeum."
 lepsius.431.g: "To musi być nasz szczęśliwy dzień!"
 lepsius.432.t: "Miejscowy mieszkaniec oferuje artefakt na wymianę"
 lepsius.432.d: "Miejscowy mieszkaniec oferuje artefakt na wymianę"
 lepsius.432.f: "Nasza wyprawa zatrzymuje się w większym mieście. Gdy tragarze kupują paszę dla zwierząt jucznych, zaczepia ich pewien handlarz. Najwyraźniej wieści o naszej podróży rozeszły się już szeroko wśród miejscowych. Za odpowiednią cenę jest gotów sprzedać cenne dzieło sztuki, które nabył od rabusia grobów. Pochodzenie artefaktu pozostaje niejasne, ale oferta jest kusząca, choć wiąże się ze sporym wydatkiem."
 lepsius.432.g: "To powinno trafić do muzeum."
 lepsius.432.h: "Nie interesują nas takie podejrzane interesy."
 lepsius.433.t: "Oryginał czy falsyfikat?"
 lepsius.433.d: "Handlarz antykami o wątpliwej reputacji chce sprzedać nam artefakt."
 lepsius.433.f: "Nie wszyscy handlarze rzekomo cennymi artefaktami archeologicznymi są godni zaufania. Przykładem jest pewien kupiec, który z przesadną natarczywością próbuje sprzedać nam cenne dzieło sztuki. Jego nachalne zachowanie oraz gotowość do negocjowania ceny, która ma nam rzekomo zapewnić „przyjacielską ofertę”, wzbudziły wśród przywódców naszej wyprawy wątpliwości co do uczciwości tej transakcji. Dlatego zwrócili się do dyrekcji muzeum z pytaniem, czy powinni przyjąć artefakt z rąk tego podejrzanego handlarza."
 lepsius.433.g: "Musimy podjąć ryzyko."
 lepsius.433.h: "Nie ufajmy mu."
 lepsius.434.t: "Schwytano rabusiów grobów"
 lepsius.434.d: "Nasza wyprawa schwytała grupę rabusiów grobów i przejęła ich łupy, ale nie możemy zdecydować, co z nimi zrobić."
 lepsius.434.f: "Nasi archeolodzy sądzili, że znaleźli już odpowiednie miejsce do prowadzenia wykopalisk, dopóki nie odkryli, że stanowisko było plądrowane przez całe stulecia. Gdy pakowali swój sprzęt, kilku strażnikom obozowym udało się schwytać podejrzanych osobników próbujących wynieść artefakt z opuszczonego stanowiska. Właściwie powinniśmy przekazać rabusiów władzom i zwrócić skradzione dzieło sztuki. Niektórzy uważają jednak, że powinniśmy zatrzymać artefakt dla siebie i przekupić rabusiów grobów, aby zachowali milczenie."
 lepsius.434.g: "Artefakt powinien należeć do nas."
 lepsius.434.h: "Złóżmy skargę i zwróćmy artefakt miejscowym władzom."
 lepsius.435.t: "Aukcja"
 lepsius.435.d: "Naciski polityczne skłaniają nas do rozważenia sprzedaży niedawno odnalezionego artefaktu."
 lepsius.435.f: "Niektórzy członkowie rządu obawiają się, że nasze zagraniczne przedsięwzięcia archeologiczne są jedynie marnotrawstwem pieniędzy, a dorobek gospodarczy naszego narodu poświęcany jest dla zaspokojenia akademickich ambicji wąskiej grupy uczonych. Domagają się nie tylko wyników naukowych, ale również wymiernych korzyści finansowych, które dowiodłyby, że organizowanie takich wypraw ma sens. Dlatego grupa polityków żąda sprzedaży niedawno odnalezionego artefaktu, aby pokryć koszty naszych archeologicznych przedsięwzięć."
 lepsius.435.g: "Sprzedajmy go na aukcji."
 lepsius.435.h: "Ale przecież jego miejsce jest w muzeum!"
 lepsius.436.t: "Ukryta komnata"
 lepsius.436.d: "Nasi archeolodzy znaleźli grobowiec, który najwyraźniej został splądrowany przez rabusiów. Kiedy jednak przeprowadzili dalsze badania, odkryli komnatę ukrytą za fałszywą ścianą."
 lepsius.436.f: "Ostatni postój rozpoczął się od rozczarowania. Przywódca naszej wyprawy wiązał duże nadzieje z tym historycznym miejscem. Miał się tu znajdować grobowiec wysokiego rangą dostojnika, być może pełniącego również funkcje religijne. W każdym razie tak wynikało z informacji uzyskanych od kilku rolników. Tym większe było rozczarowanie na miejscu: grobowiec okazał się pusty, ściany były nagie, a nic nie wskazywało na jakiekolwiek znaczenie historyczne. Na pierwszy rzut oka przypominał jedynie gładko wykutą jaskinię. Wszystko zmieniło się jednak nagle, gdy asystent badawczy, opierając się o pozornie zwyczajną ścianę, przypadkowo dostrzegł zarys framugi drzwi. Usunięcie gruzu, zasłon i kamieni zajęło dwie godziny, ale ostatecznie udało się odsłonić wejście do ukrytej dotąd komnaty."
 lepsius.436.g: "Mój skarb!"
 lepsius.437.t: "Opuszczony obóz"
 lepsius.437.d: "Znaleźliśmy opuszczony obóz zagranicznej ekipy archeologicznej. Po zabezpieczeniu dwóch artefaktów ambasador jej kraju zażądał ich wydania."
 lepsius.437.f: "Gdy nasi ludzie dotarli do obozu wykopaliskowego, zastali pozostałości po wyprawie, która zaledwie kilka miesięcy wcześniej badała pobliską świątynię. Jak się okazało, pracownicy prowadzący wykopaliska opuścili to miejsce nieco zbyt pospiesznie: w jednej ze skrzyń znaleziono dwa artefakty, których nie zabrano. Nasi archeolodzy zabezpieczyli znalezisko, lecz wkrótce odwiedził ich ambasador kraju, z którego pochodziła poprzednia wyprawa, żądając zwrotu artefaktów odkrytych przez jego rodaków. Sprawa wywołała incydent dyplomatyczny z udziałem jednego z mocarstw."
 lepsius.437.g: "My to znaleźliśmy, więc należy do nas."
 lepsius.437.h: "Podzielmy się artefaktami."
 lepsius.437.i: "Zamiast tego podzielmy się naszą wiedzą."
 lepsius.437.j: "To oni są prawowitymi właścicielami."
 lepsius.438.t: "Pustelnik"
 lepsius.438.d: "Niestety pustelnik, w którego posiadaniu znajduje się artefakt, nie jest zbyt skłonny do współpracy."
 lepsius.438.f: "Dotarły do nas wieści o pewnym ekscentrycznym pustelniku, który podobno posiada cenny artefakt. Człowiek ten ma imponującą wiedzę o przeszłości i niezwykłą pamięć. Pod wieloma względami nawet uczeni z naszej wyprawy są zdumieni jego wiedzą. Zrzędliwy starzec chętnie opowiedziałby nam więcej, ale za nic w świecie nie zamierza oddać artefaktu. Najwyraźniej będziemy musieli użyć siły."
 lepsius.438.g: "Chcę ten artefakt i to natychmiast!"
 lepsius.438.h: "Po prostu go wysłuchajmy."
 lepsius.439.t: "Dynamit?"
 lepsius.439.d: "Czasami wyjątkowe wyzwania wymagają wyjątkowych środków."
 lepsius.439.f: "Podczas wykopalisk nasz przewodnik dochodzi do wniosku, że za jedną ze ścian może kryć się przejście. Przynajmniej tak twierdzi, ponieważ podobno dostrzegł za nią pustą przestrzeń. W początkach archeologii radykalne metody były na porządku dziennym, a do osiągania wzniosłych celów naukowych wykorzystywano nawet materiały wybuchowe. Oczywiście możemy nie osiągnąć niczego, jeśli domniemana pusta przestrzeń okaże się jedynie złudzeniem, a przy okazji narazimy na zniszczenie zabezpieczone już stanowisko archeologiczne."
 lepsius.439.g: "BUUUM!"
 lepsius.439.h: "Już sama myśl o tym jest barbarzyństwem."
 lepsius.440.t: "Uszkodzony fragment"
 lepsius.440.d: "Znaleźliśmy uszkodzony artefakt. Brakujący fragment znajduje się w posiadaniu jednego z pomniejszych państw."
 lepsius.440.f: "Podczas wykopalisk archeolodzy odnaleźli cenny skarb sztuki, a przynajmniej jego część. Okazuje się, że drugi fragment znajduje się w rękach jednego z pomniejszych państw, które kilka lat temu zakupiło go od handlarza antykami. Moglibyśmy wykorzystać nasze służby dyplomatyczne, aby odzyskać brakujący fragment i połączyć obie części artefaktu, jednak ambasador dał już jasno do zrozumienia, że wiązałoby się to z koniecznością podjęcia pewnych zobowiązań politycznych."
 lepsius.440.g: "Uprzejmie ich o to poprośmy."
 lepsius.440.h: "Ostatecznie ta sprawa nie jest aż tak ważna."
 lepsius.441.t: "Zapomniany obelisk"
 lepsius.441.d: "Niedokończony obelisk dostarcza naszym uczonym informacji o starożytnych technikach budowlanych."
 lepsius.441.f: "W starożytnym egipskim kamieniołomie nasi archeolodzy znaleźli coś, co przypomina niedokończony obelisk. Prace nad tym ogromnym monolitem najwyraźniej nigdy nie zostały ukończone. Chociaż nie ma na nim żadnych hieroglifów, a ze względu na jego rozmiary nie można go przetransportować, nasi uczeni zdobyli nową wiedzę na temat sposobów, w jakie starożytni Egipcjanie wytwarzali i wznosili tego rodzaju budowle."
 lepsius.441.g: "Bardzo interesujące."
 lepsius.442.t: "Zmumifikowane zwierzęta"
 lepsius.442.d: "Sposób postępowania z niedawno odkrytymi zmumifikowanymi zwierzętami wywołał kontrowersje wśród archeologów."
 lepsius.442.f: "Kilka dni temu archeolodzy odkryli komorę grobową z niezwykłym znaleziskiem: oprócz pochowanego w niej szlachcica odnaleziono również mniejsze sarkofagi zawierające zmumifikowane zwierzęta. Sądząc po ich wyglądzie, są to kot, pies i małpa. Odkrycie wywołało ożywioną dyskusję wśród uczonych. Badania zmumifikowanych zwierząt mogłyby rzucić nowe światło na sposoby ich hodowli oraz życie zwierząt domowych w starożytnym Egipcie, ale jednocześnie mogłyby doprowadzić do zniszczenia tych rzadkich artefaktów."
 lepsius.442.g: "Wymagają dokładnego zbadania."
 lepsius.442.h: "Nie dotykajmy ich, to ważne eksponaty muzealne!"
 lepsius.443.t: "Spór o krokodyla"
 lepsius.443.d: "Dziwny spór o martwego krokodyla dzieli naszych uczonych i attaché wojskowego."
 lepsius.443.f: "Fauna Nilu zainspirowała naszych uczonych do zintensyfikowania badań biologicznych. Szczególną uwagę poświęcają krokodylowi nilowemu, który budzi w nich zarówno strach i odrazę, jak i fascynację. Na prośbę naszych uczonych attaché wojskowy zabił krokodyla. Teraz jednak odmawia przekazania im zwierzęcia. Wolałby je wypchać i powiesić nad swoim kominkiem."
 lepsius.443.g: "Ma przekazać krokodyla badaczom."
 lepsius.443.h: "Niech żyje taksydermia!"
 lepsius.443.i: "To rzeczywiście całkiem ładny krokodyl..."
 lepsius.444.t: "Klątwa faraona"
 lepsius.444.d: "Po kilku tajemniczych incydentach nie tylko miejscowi pomocnicy, ale nawet niektórzy uczeni zaczęli wierzyć, że nad naszą wyprawą do Egiptu ciąży klątwa!"
 lepsius.444.f: "Wszystko zaczęło się, gdy przywódca naszej wyprawy otworzył egipski grobowiec. W sarkofagu spoczywała odrażająco wyglądająca mumia, która w ciągu zaledwie kilku minut rozpadła się na oczach uczestników. Kilka dni później niemal wszystkich członków wyprawy dotknęła tajemnicza choroba. Zmarł również asystent badawczy, który był obecny przy odsłonięciu mumii. Następnego dnia burza piaskowa uniemożliwiła prowadzenie prac przez cały tydzień. Dziś rano okazało się, że zapasy wody zostały skażone i nie nadają się do picia. Woda mieni się miedzianożółtym odcieniem. Coraz więcej uczestników wyprawy jest przekonanych, że muszą zapłacić za zbezczeszczenie grobowca. Spadła na nich klątwa nieznanego faraona!"
 lepsius.444.g: "Co to ma być? Jeszcze kometę zauważono?!"
 lepsius.445.t: "Fragment Eposu o Gilgameszu"
 lepsius.445.d: "Uczeni odnaleźli fragment słynnego Eposu o Gilgameszu. Jest on uważany za najstarsze dzieło literackie w dziejach ludzkości."
 lepsius.445.f: "Epos o Gilgameszu to zbiór utworów literackich pochodzących głównie z Babilonii, zawierający jedne z najstarszych zachowanych zabytków piśmiennictwa. Epos o Gilgameszu w swoich różnych wersjach jest najbardziej znanym dziełem literatury akadyjskiej i sumeryjskiej. Opowiada historię Gilgamesza, króla Uruk, jego czynów i przygód, przyjaźni z Enkidu, śmierci Enkidu oraz poszukiwań nieśmiertelności przez Gilgamesza. #T @lepsius_gilgamesh_fragment! Do odtworzenia podstawowej wersji eposu potrzeba pięciu fragmentów.#!"
 lepsius.445.g: "Musimy znaleźć więcej fragmentów."
 lepsius.445.h: "Musimy znaleźć więcej fragmentów."
 lepsius.445.i: "Więcej fragmentów zawsze się przyda."
 lepsius.446.t: "Fresk minojski"
 lepsius.446.d: "Podczas badań na Krecie nasz zespół archeologów natrafił na pozostałości kultury minojskiej."
 lepsius.446.f: "Piękny fresk przyciągnął uwagę naszych archeologów. Przedstawienia rybaków, tancerzy i graczy w piłkę dają wyobrażenie o codziennym życiu starożytnej cywilizacji minojskiej. Ściana odsłonięta przez zespół wykopaliskowy na Krecie wciąż nosi ślady farby — po 4000 latach! To pewne, że po tym wspaniałym odkryciu nastąpią kolejne znaleziska."
 lepsius.446.g: "Zaginiona kultura ożywa na naszych oczach."
 lepsius.447.t: "Mury cyklopowe"
 lepsius.447.d: "Podczas badań w Argolidzie nasz zespół archeologów odkrył pozostałości kultury mykeńskiej."
 lepsius.447.f: "Po kilku niepowodzeniach archeolodzy w Grecji odkryli coś, co miejscowi początkowo uznali za taras przeznaczony do uprawy drzew oliwnych. W rzeczywistości okazało się, że był to jedynie szczyt muru cyklopowego. Jak dotąd uczestnicy wyprawy nie znaleźli zbyt wiele, ale przynajmniej jest to jakiś początek."
 lepsius.447.g: "Jak oni potrafili wtedy tak idealnie dopasowywać do siebie kamienie?"
 lepsius.448.t: "Stela Majów"
 lepsius.448.d: "Zespół archeologiczny na Jukatanie poczynił postępy w odczytywaniu hieroglifów Majów."
 lepsius.448.f: "W głębi dżungli Jukatanu uczestnicy naszej wyprawy natrafili na inskrypcję z czasów Majów. Uczeni datują ją w przybliżeniu na VI wiek p.n.e. Odkrycie to znacznie poszerzyło naszą wiedzę o zaginionej kulturze, jednak niektóre hieroglify wciąż pozostają zagadką dla naszych archeologów. Uczestnicy badań są jednak przekonani, że rozszyfrowanie pisma Majów jest tylko kwestią czasu."
 lepsius.448.g: "Musimy je rozszyfrować."
 lepsius.449.t: "Jaskinia Majów"
 lepsius.449.d: "Uczestnicy wyprawy znaleźli ślady kultury Majów, ale jak dotąd nie mają zbyt wielu odkryć, którymi mogliby się pochwalić."
 lepsius.449.f: "Majowie wykorzystywali niegdyś jaskinie do odprawiania obrzędów religijnych. Do dziś nie udało się dokładnie ustalić, na czym polegały te rytuały. Być może w przyszłości nasi archeolodzy zdołają dowiedzieć się na ten temat więcej. W północnej Gwatemali odkryli wejście do jaskini Majów. Jak dotąd jednak wyniki badań są raczej skromne."
 lepsius.449.g: "Za co wy właściwie dostajecie pieniądze?"
 lepsius.450.t: "Mumie andyjskie"
 lepsius.450.d: "Na szczycie góry nasi uczeni odkryli ciała inkaskich dzieci, które padły ofiarą rytuału. Niskie temperatury zachowały ich szczątki przez całe stulecia."
 lepsius.450.f: "Capacocha była ważnym obrzędem ofiarnym Inków, który zazwyczaj wiązał się ze składaniem dzieci w ofierze. Do udziału w ceremoniach capacocha wybierano chłopców i dziewczęta z całego imperium Inków, a same obrzędy odbywały się w ważnych miejscach kultu rozsianych po całym państwie. Uważa się, że celem tych rytuałów było zapewnienie, aby najlepsi przedstawiciele ludzkości mogli dołączyć do bóstw. Dzieciom wybranym na ofiarę podczas ceremonii capacocha zazwyczaj podawano alkohol i liście koki, a następnie pozostawiano je w miejscu odprawiania obrzędu. Inkowie przywiązywali szczególną wagę do licznych świętych miejsc zwanych wak'a, położonych na bardzo dużych wysokościach. W wielu przypadkach, zwłaszcza na najważniejszych spośród tych gór, odnaleziono zmumifikowane szczątki dzieci złożonych w ofierze podczas ceremonii capacocha."
 lepsius.450.g: "Nieprzyjemne, ale cenne."
 lepsius.451.t: "Posąg"
 lepsius.451.d: "Podczas podróży archeolodzy znaleźli niezwykły posąg. Niestety ze względu na jego rozmiary nie można go przetransportować."
 lepsius.451.f: "W drodze do kolejnego stanowiska wykopaliskowego nasza wyprawa natrafiła na olbrzymi posąg na trudno dostępnym, dotychczas słabo zbadanym terenie. Nie wiedziało o jego istnieniu nawet wielu miejscowych pomocników i tragarzy, a towarzyszący wyprawie uczeni byli nim zafascynowani od pierwszej chwili. Przywódca naszej wyprawy natychmiast zaproponował przetransportowanie posągu, jednak jego rozmiary oraz solidne osadzenie w ziemi znacznie utrudniają takie przedsięwzięcie. Większość uczestników uznała więc, że najlepszym rozwiązaniem będzie sporządzenie kopii wszystkich inskrypcji znajdujących się na posągu oraz dokładnego rysunku całego monumentu. Pojawiło się jednak kilka odosobnionych, niegodziwych głosów sugerujących, że to wspaniałe znalezisko należałoby pociąć na części i wysłać do naszej stolicy..."
 lepsius.451.g: "Powinni sporządzić dokładny rysunek i skrupulatnie skopiować inskrypcje."
 lepsius.451.h: "Potnijmy posąg na części i wyślijmy je do kraju."
 lepsius.452.t: "Transkrypcja"
 lepsius.452.d: "Przywódca naszej wyprawy zdobył starożytny zapis przedstawiający treści, których oryginały już dawno uległy zniszczeniu."
 lepsius.452.g: "Lepsze to niż nic."
 lepsius.453.t: "Artyści uwieczniają krajobraz na papierze"
 lepsius.453.d: "Artyści, których zabraliśmy na wyprawę archeologiczną, uwieczniają krajobraz z tak niezwykłą dokładnością, że ich prace będą służyć uczonym przez kolejne dziesięciolecia."
 lepsius.453.f: "Na przestrzeni dziejów wyprawom archeologicznym towarzyszyli nie tylko uczeni zajmujący się badaniem starożytności, ale często również przedstawiciele różnych dziedzin nauki, tacy jak geografowie, biolodzy, matematycy, astronomowie czy artyści, którzy za pomocą pióra i papieru dokumentowali otaczający ich świat. Każdy z uczestników wnosił swoją wiedzę i umiejętności, aby zapewnić uczonym pozostającym w kraju możliwie najdokładniejszy opis badanego stanowiska archeologicznego. To właśnie interdyscyplinarne podejście sprawiło, że od czasów wyprawy Napoleona do Egiptu ekspedycje te stały się wieloaspektowymi przedsięwzięciami, podczas których dokonywano przełomowych odkryć naukowych w kilku dziedzinach jednocześnie."
 lepsius.453.g: "Dobrze, że ich zatrudniliśmy."
 lepsius.454.t: "Uczeni prowadzą badania"
 lepsius.454.d: "Nasi uczeni przeprowadzili na miejscu różnorodne eksperymenty, nie tylko dokonując porównań, ale także udzielając naszym archeologom cennych wskazówek."
 lepsius.454.f: "Na przestrzeni dziejów wyprawom archeologicznym towarzyszyli nie tylko uczeni zajmujący się badaniem starożytności, ale często również przedstawiciele różnych dziedzin nauki, tacy jak geografowie, biolodzy, matematycy, astronomowie czy artyści, którzy za pomocą pióra i papieru dokumentowali otaczający ich świat. Każdy z uczestników wnosił swoją wiedzę i umiejętności, aby zapewnić uczonym pozostającym w kraju możliwie najdokładniejszy opis badanego stanowiska archeologicznego. To właśnie interdyscyplinarne podejście sprawiło, że od czasów wyprawy Napoleona do Egiptu ekspedycje te stały się wieloaspektowymi przedsięwzięciami, podczas których dokonywano przełomowych odkryć naukowych w kilku dziedzinach jednocześnie."
 lepsius.455.t: "Konkurencyjna wyprawa"
 lepsius.455.d: "Kilka mil w głąb dzikich terenów grupa dowodzona przez przywódcę naszej wyprawy napotyka oddział wychudzonych ludzi. To żałosne niedobitki zagranicznej wyprawy."
 lepsius.455.f: "Nasi archeolodzy nie są jedynymi, którzy zapuszczają się na niezbadane tereny. Nasza państwowa wyprawa napotyka niewielką prywatną wyprawę zorganizowaną przez ekscentrycznego uczonego. W przeciwieństwie do naszego zespołu uczestnicy konkurencyjnej wyprawy są słabo wyposażeni. Widać po nich wyraźne oznaki niedostatku i wycieńczenia. Kapelan naszej wyprawy proponuje udzielenie im pomocy, co mogłoby również zostać odebrane w kraju jako gest dobrej woli. Inni uczestnicy dostrzegają natomiast okazję do wymiany wiedzy z zagranicznymi uczonymi. Z kolei attaché wojskowy proponuje zaoferowanie im pomocy w zamian za cenny artefakt pochodzący ze zbiorów konkurencyjnej wyprawy."
 lepsius.455.g: "Pomóżmy im."
 lepsius.455.h: "Pomożemy im w zamian za ich wiedzę."
 lepsius.455.i: "Dostaną jedzenie i pomoc tylko wtedy, gdy oddadzą nam swój skarb."
 lepsius.461.t: "Szepczący Sfinks"
 lepsius.461.d: "Jego więcej niż wątpliwy tryb życia sprawia, że przywódca naszej wyprawy [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] doświadcza niezapomnianych halucynacji."
 lepsius.462.d: "Jego więcej niż wątpliwy tryb życia sprawia, że nasz attaché wojskowy [SCOPE.sCharacter('lepsius_military_attache').GetFullName] doświadcza niezapomnianych halucynacji."
 lepsius.461.g: "Ten człowiek naprawdę powinien przemyśleć swój styl życia."
 lepsius.463.t: "Bastet, bogini kotów"
 lepsius.463.d: "Podczas swojej podróży [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] odkrył dzięki prowadzonym badaniom swoją słabość do kotów."
 lepsius.463.f: "Wśród licznych bóstw przedstawianych pod postaciami zwierząt w starożytnym Egipcie czczono również Bastet, boginię kotów. Egipcjanie darzyli niegdyś koty ogromnym szacunkiem, ponieważ chroniły spichlerze przed szkodnikami, takimi jak myszy, a także przed wężami. W miarę jak rosła jego fascynacja Egiptem, przywódca naszej wyprawy zaczął szczególnie interesować się tą boginią i postanowił zaopiekować się własnym kotem. Towarzystwo zwierzęcia sprawiło również, że jego dotychczas surowy charakter nieco złagodniał."
 lepsius.463.g: "Są miłośnicy kotów i są miłośnicy psów."
 lepsius.464.t: "Polowanie z chartem saluki"
 lepsius.464.d: "Nasz attaché wojskowy [SCOPE.sCharacter('lepsius_military_attache').GetFullName] podczas podróży po Mezopotamii nabył miejscowego psa myśliwskiego."
 lepsius.464.f: "Psy zazwyczaj nie cieszą się dobrą opinią na Bliskim Wschodzie. Wyjątkiem są charty, takie jak saluki. Beduini uważają je za szlachetnych towarzyszy, którzy doskonale sprawdzają się również podczas polowań na zające i gazele. Nasz attaché wojskowy otrzymał takiego wspaniałego psa w prezencie od miejscowego mieszkańca, a od kilku tygodni między człowiekiem a zwierzęciem rozwija się głęboka więź."
 lepsius.464.g: "Są miłośnicy psów i są miłośnicy kotów."
 lepsius.465.t: "Problematyczne poczucie wyższości"
 lepsius.465.d: "Aroganckie zachowanie [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] wywołało niechęć w kraju, w którym przebywa nasza wyprawa."
 lepsius.465.g: "Po co mamy się nimi przejmować? Przecież to barbarzyńcy!"
 lepsius.465.h: "Powinniśmy za wszelką cenę naprawić tę dyplomatyczną gafę."
 lepsius.466.t: "Kartograf"
 lepsius.466.d: "Podczas wyprawy archeologicznej attaché wojskowy zainteresował się kartografią i zaczął samodzielnie sporządzać mapy. Wygląda na to, że ma talent do prowadzenia pomiarów terenowych."
 lepsius.466.f: "Od samego początku wyprawy attaché wojskowy prowadził szczegółowy dziennik przemieszczania się oddziału i jego postępów, sporządzając przy tym własne mapy. Podczas jednej z odpraw okazało się, że zgromadził już imponującą kolekcję. W ciągu ostatniego tygodnia wielokrotnie towarzyszył mu asystent naukowy, który pomagał mu rozwijać umiejętności kartograficzne. Dzięki temu attaché potrafi już również posługiwać się przyrządami pomiarowymi. Asystent naukowy proponuje, aby przeszkolić go na profesjonalnego geodetę."
 lepsius.466.g: "Czeka go wspaniała kariera!"
 lepsius.466.h: "Jego mapy są dobre, ale powinien skupić się na sprawach wojskowych."
 lepsius.467.t: "Zapomniany relikt"
 lepsius.467.d: "Przywódca naszej wyprawy archeologicznej nawiązał kontakt z niewielką mniejszością chrześcijańską na Wschodzie. Ma na ten temat niezwykłe rzeczy do opowiedzenia."
 lepsius.467.h: "Powinien zbadać relikt."
 lepsius.468.t: "Attaché przyłapany na kradzieży artefaktów"
 lepsius.468.d: "Dziś rano jeden z naszych pracowników wykopaliskowych znalazł w namiocie attaché wojskowego dwa artefakty, które od kilku tygodni uważano za zaginione. Najwyraźniej zamierzał zatrzymać je dla siebie."
 lepsius.468.f: "Wszyscy znają przeszłość naszego attaché wojskowego, jednak pozostali uczestnicy wyprawy mieli nadzieję, że [SCOPE.sCharacter('lepsius_military_attache').GetFullName] nie powróci do dawnych nawyków. Najwyraźniej jednak się mylili: kto raz został bandytą, na zawsze nim pozostanie. Kiedy jeden z pracowników wykopaliskowych przypadkowo znalazł dwa artefakty pochodzące z ostatnich wykopalisk, których attaché nie zgłosił, nasunął się tylko jeden wniosek: zamierzał zatrzymać je dla siebie albo sprzedać. Przywódca wyprawy nie skonfrontował go jeszcze bezpośrednio z zarzutami, uznając, że rozsądniej będzie najpierw ustalić sposób dalszego postępowania, zanim zostaną wyciągnięte konsekwencje."
 lepsius.468.g: "Zachowajmy tę sprawę w tajemnicy."
 lepsius.468.h: "Podejdźmy do sprawy ostrożnie, ale nalegajmy, by zwrócił artefakty."
 lepsius.468.i: "Publicznie ujawnijmy jego winę i ukarzmy go dyscyplinarnie!"
 lepsius.471.t_karnak: "Karnak"
 lepsius.471.t_memphis: "Memphis"
 lepsius.471.t_uruk: "Uruk"
 lepsius.471.t_niniveh: "Nineveh"
 lepsius.471.t_tiryns: "Tiryns"
 lepsius.471.t_phaistos: "Phaistos"
 lepsius.471.t_itza: "Chichén Itzá"
 lepsius.471.t_olla: "Ollantaytombo"
 lepsius.471.d: "[SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] chce odwiedzić słynne stanowisko archeologiczne. Choć miejsce to ma ogromne znaczenie dla archeologii, taka wyprawa znacznie utrudniłaby realizację naszych obecnych planów."
 lepsius.471.f_karnak: "Świątynia w Karnaku, położona na północ od Luksoru, jest uważana za jeden z największych kompleksów świątynnych starożytnego świata. Po wyniesieniu Amona-Re z Teb do rangi bóstwa lokalnego, a później głównego bóstwa całego państwa, władcy wczesnego Średniego Państwa rozpoczęli budowę świątyni, którą rozbudowywano przez tysiąclecia, aż powstał znany dziś kompleks świątynny. To właśnie tam kapłani Amona sprawowali codzienne obrzędy religijne. Uważa się, że w jego budowie i rozbudowie uczestniczyło aż 30 faraonów."
 lepsius.471.f_memphis: "Maneton podaje, że według legendy Memfis zostało założone przez króla Menesa około 3000 roku p.n.e. Miasto było stolicą Egiptu w okresie Starego Państwa i przez kolejne wieki pozostawało ważnym ośrodkiem w dziejach kraju. Memfis znajdowało się pod opieką boga Ptaha, patrona rzemieślników, którego świątynia Hut-Ka-Ptah wznosiła się w centrum miasta. Rozkwit i upadek Memfis były nierozerwalnie związane z historią całego Egiptu."
 lepsius.471.f_uruk: "Uruk jest miejscem, w którym narodziło się pismo. Już pod koniec IV tysiąclecia p.n.e. było jednym z najważniejszych ośrodków politycznych wczesnego okresu sumeryjskiego. W starożytności to mezopotamskie miasto leżało bezpośrednio nad rzeką. W mitach i literaturze Uruk zasłynęło jako stolica Gilgamesza, bohatera Eposu o Gilgameszu. Uczeni utożsamiają Uruk z biblijnym Erech (Księga Rodzaju 10,10), drugim miastem założonym przez Nimroda w krainie Szinear."
 lepsius.471.f_niniveh: "Niniwa leży na wschodnim brzegu Tygrysu i była stolicą oraz największym miastem imperium nowoasyryjskiego, a przez kilka dziesięcioleci także największym miastem świata. W okresie panowania imperium nowoasyryjskiego, szczególnie od czasów Aszurnasirpala II, miasto przechodziło znaczną rozbudowę. Niektórych głównych wejść strzegły monumentalne kamienne posągi lamassu, ważące nawet 30 000 kilogramów (30 ton)."
 lepsius.471.f_tiryns: "Tiryns osiągnęło szczyt swojego znaczenia między 1400 a 1200 rokiem p.n.e., kiedy stało się jednym z najważniejszych ośrodków świata mykeńskiego, a zwłaszcza Argolidy. Do najbardziej charakterystycznych budowli miasta należały pałac, cyklopowe tunele, a przede wszystkim potężne mury, dzięki którym Homer określił Tiryns mianem „potężnie obwarowanego”. Tiryns wiązano również z mitami o Herak"
 lepsius.471.f_phaistos: "Według legendy miasto Fajstos zostało założone przez króla Minosa i nazwane na cześć syna lub wnuka Heraklesa (herosa Fajstosa), który został zabity przez Idomeneusa, wnuka Minosa i późniejszego króla Krety. Pierwszym władcą Fajstos miał być Radamantys, brat Minosa. W mieście znajduje się drugi co do wielkości kompleks pałacowy na Krecie, ustępujący jedynie Knossos."
 lepsius.471.f_itza: "Chichén Itzá jest jednym z najważniejszych stanowisk archeologicznych na meksykańskim półwyspie Jukatan. Znajduje się około 120 kilometrów na wschód od Méridy, w stanie Jukatan. Ruiny pochodzą z późnego okresu cywilizacji Majów. Chichén Itzá, zajmujące powierzchnię 1547 hektarów, jest jednym z największych stanowisk archeologicznych na Jukatanie. W jego centrum znajdują się liczne monumentalne budowle o charakterze religijnym i politycznym, wśród których wyróżnia się duża, w znacznym stopniu zachowana piramida schodkowa."
 lepsius.471.f_olla: "W czasach imperium Inków Ollantaytambo było królewską posiadłością władcy Pachacutiego, który podbił ten region, a następnie wzniósł miasto i ośrodek ceremonialny. Podczas hiszpańskiego podboju Peru miejscowość służyła jako twierdza Manco Inki Yupanquiego, przywódcy inkaskiego ruchu oporu. Ollantaytambo jest jedynym zachowanym przykładem inkaskiego planowania urbanistycznego. Budynki, inkaskie tarasy oraz wąskie uliczki miasta zachowały się do dziś w swojej pierwotnej post"
 lepsius.471.j: "Absolutnie nie! Wyprawa ma pierwszeństwo!"
 lepsius.472.t: "Zaginiony świat?"
 lepsius.472.d: "Po długim okresie milczenia nasza wyprawa wreszcie nawiązała kontakt, donosząc o znacznych stratach w ludziach, zwierzętach jucznych i sprzęcie. Wyjaśnienie, jakie przedstawił przywódca wyprawy, jest doprawdy zdumiewające."
 lepsius.501.t: "Grobowiec nieznanego"
 lepsius.501.d: "Przywódca naszej wyprawy [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] usłyszał o zaginionym grobowcu w Dolinie Królów. Podobno należy on do nieznanego dotąd faraona. Miejscowi twierdzą, że odnaleźli wejście do grobowca."
 lepsius.501.f: "Ponad 3000 lat temu faraonów Egiptu chowano w legendarnej Dolinie Królów. Wiele z tych grobowców było znanych już w starożytności i stanowiło atrakcje turystyczne, o czym świadczą pozostawione przez Greków i Rzymian graffiti. Koptyjscy chrześcijanie przekształcili nawet niektóre otwarte grobowce w kaplice. Przez stulecia rabusie z pobliskich miejscowości wykradali dzieła sztuki z grobowców i świątyń, a następnie sprzedawali je na targowiskach. Z tego powodu po wielu grobowcach pozostały jedynie puste komory. Mimo to raz po raz przybysze z bliska i daleka natrafiali na zapomniane grobowce, w których wciąż znajdowały się przedmioty, malowidła lub nieotwarte komory. Niedawno [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] otrzymał wiadomość o grobowcu, który może być dobrze zachowany."
 lepsius.501.g: "Nie mamy na to czasu."
 lepsius.502.t: "Piasek, mnóstwo piasku"
 lepsius.502.d: "Kiedy archeolodzy docierają na miejsce, odkrywają, że rzeczywiście istnieją ślady królewskiego grobowca, jednak całe stanowisko jest zasypane piaskiem."
 lepsius.502.f: "Nikt nie spodziewał się, że wykopaliska będą łatwe. Kiedy jednak miejscowy przewodnik prowadzi archeologów do miejsca, w którym rzekomo znajduje się grobowiec, uczestnicy wyprawy stają przed pionową skalną ścianą, do której przylega ogromna wydma z piasku i błota. Nigdzie nie widać najmniejszego śladu grobowca. Zapytany o to miejscowy wyjaśnia, że sam nigdy nie widział wejścia do grobowca, ale jego dziadek jeszcze je pamiętał, a ojciec przynajmniej dostrzegł jego zarys w dzieciństwie. Ze względu na opady deszczu w Dolinie Królów często dochodzi do osuwisk błotnych, a wiatr i egipskie piaski słyną z ukrywania miejsc liczących sobie całe stulecia. Choć niektórzy asystenci wątpią nawet w istnienie grobowca, [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] pozostaje zdeterminowany, by odnaleźć zaginione miejsce pochówku. Usunięcie ogromnych ilości piasku nagromadzonego przez lata będzie jednak wymagało dodatkowych funduszy."
 lepsius.502.g: "Potrzebujemy więcej narzędzi!"
 lepsius.503.t: "Głaz"
 lepsius.503.d: "Po wytrwałym kopaniu, do którego wykorzystano wszystkie łopaty dostępne na sprzedaż w promieniu dziesięciu mil, uczestnikom wyprawy udało się odsłonić wejście. Niestety okazało się, że blokuje je ogromny głaz."
 lepsius.503.f: "Dni mozolnego odgarniania piasku i błota powinny wreszcie przynieść nagrodę – przynajmniej na to liczyli uczestnicy wyprawy. Kiedy rzeczywiście odkryto nadproże wejścia do kompleksu grobowego, przygnębienie wyczerpanych ludzi ustąpiło miejsca euforii. W ciągu zaledwie kilku godzin odsłonięto pozostałą część wejścia. Jednak gdy tylko próbowano posunąć się dalej, odkryto powód, dla którego grobowiec uniknął splądrowania: ogromny głaz, który prawdopodobnie oderwał się od skalnej ściany dziesiątki, jeśli nie setki lat temu, blokował przejście. Nawet mały chłopiec nie zdołałby się obok niego przecisnąć, ponieważ gruz i stwardniałe błoto wypełniały resztę korytarza niczym zaprawa murarska. [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] stanął przed ważną decyzją: w jaki sposób usunąć przeszkodę blokującą wejście do grobowca?"
 lepsius.503.g: "Zastosujmy zaawansowane metody."
 lepsius.503.h: "Wykorzystajmy zaawansowane mechanizmy."
 lepsius.503.i: "Sięgnijmy po niezawodną nitroglicerynę."
 lepsius.503.j: "Użyjmy czystej siły mięśni."
 lepsius.504.t: "Grobowiec zniszczony przez nitroglicerynę"
 lepsius.504.d: "Niestety użycie materiałów wybuchowych przyniosło więcej szkody niż pożytku. Eksplozja zniszczyła nie tylko skałę, ale również cały kompleks grobowy!"
 lepsius.504.f: "Zdobycie materiałów wybuchowych nie było najłatwiejszym zadaniem, jednak problem udało się rozwiązać w ciągu kilku dni, gdy uczestnicy wyprawy zakupili zapasy nitrogliceryny od pewnego geologa za korzystną cenę. Żaden z członków wyprawy nie nazwałby siebie ekspertem od wyburzeń, ale [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] uważał, że obchodzenie się z niezwykle niebezpieczną nitrogliceryną nie stanowi szczególnie wielkiego wyzwania. Być może lepiej byłoby wcześniej zasięgnąć porady specjalisty, ponieważ nasi ludzie najwyraźniej błędnie oszacowali potrzebną ilość materiału wybuchowego. Zamiast wysadzić jedynie głaz, wyprawa archeologiczna doprowadziła do zniszczenia całej skalnej ściany! Tylko cudem uczestnicy zdołali się uratować, zanim z pobliskiej góry runęła lawina głazów, zamieniając cały teren w rumowisko. Cokolwiek znajdowało się za wejściem do grobowca, teraz musiało zostać bezpowrotnie zniszczone..."
 lepsius.504.g: "Może trochę przesadziliśmy?"
 lepsius.505.t_archaeology: "Obrazy w galerii"
 lepsius.505.t_engine: "Zniszczona galeria"
 lepsius.505.t_muscular: "Obrazy w galerii"
 lepsius.505.d_archaeology: "Po szczegółowych badaniach archeologicznych i ostrożnym usunięciu głazu przy użyciu najnowocześniejszych metod nasi archeolodzy wkraczają do doskonale zachowanej galerii grobowca faraona."
 lepsius.505.d_engine: "Za pomocą maszyny uczestnikom wyprawy udaje się usunąć głaz, jednak nie obywa się bez negatywnych konsekwencji."
 lepsius.505.d_muscular: "Po zatrudnieniu potężnie zbudowanego Włocha udało nam się usunąć głaz i dostać na doskonale zachowane stanowisko archeologiczne."
 lepsius.505.f_archaeology: "Archeolodzy podeszli do głazu niczym chirurdzy przystępujący do skomplikowanej operacji. Dokładnie zbadali skałę, sprawdzili jej strukturę i rozpoczęli ostrożne prace przy użyciu łopat i kilofów. Po szczegółowych oględzinach postanowili usuwać głaz stopniowo, warstwa po warstwie, stosując skomplikowaną i czasochłonną metodę, która pozwoliłaby uniknąć uszkodzenia hieroglifów przy wejściu. Była to niezwykle pracochłonna operacja, ale zdecydowanie warta wysiłku. Z lampami oliwnymi w dłoniach ostrożnie zagłębili się w pierwszy korytarz i ujrzeli piękno starożytnego Egiptu. Na ścianach w migotliwym świetle lamp ukazały się zadziwiająco dobrze"
 lepsius.505.f_engine: "Najnowsza technologia miała pomóc nam w wykopaliskach przy Grobowcu Nieznanego Faraona. W tym celu wykorzystano maszynę, która za pomocą specjalnego mechanizmu miała wyciągnąć głaz z szybu wejściowego. Początkowo skała ani drgnęła, więc nasi uczeni postanowili uruchomić silnik z pełną mocą. Był to fatalny błąd. Choć głaz na chwilę oderwał się od podłoża i został wciągnięty w górę zbocza, wkrótce wysunął się z pasa mocującego i z ogromną siłą stoczył się z powrotem w kierunku grobowca, powodując katastrofalne zniszczenia! [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] wraz ze swoimi asystentami natychmiast wbiegł do odsłoniętego przejścia. Ku ich przerażeniu okazało się, że głaz nie tylko doszczętnie zniszczył niegdyś pięknie zdobioną malowidłami galerię, ale również poważnie uszkodził ważną ścianę nośną, od której zależała stabilność całego kompleksu..."
 lepsius.505.f_muscular: "Po powrocie do Luksoru uczestnicy naszej wyprawy poznali niezwykłego siłacza. Pochodził z Padwy i przybył do Egiptu, aby zaprezentować paszy urządzenie hydrauliczne, które miało pomóc w kontrolowaniu wylewów Nilu. Niestety, jego przedsięwzięcie zakończyło się niepowodzeniem. Mężczyzna mierzył około dwóch metrów wzrostu i miał siłę byka. Twierdził, że wcześniej występował w cyrku jako „Herkules z Patagonii”. Według wiarygodnej relacji jego angielskiego służącego potrafił jednocześnie unieść sześciu mężczyzn.To właśnie te niezwykłe zdolności skłoniły nas do zatrudnienia go, by pomógł odblokować wejście do grobowca. Gdy tylko dotarł na miejsce, bez trudu odsunął potężny głaz. Nasi archeolodzy ruszyli do korytarza z lampami oliwnymi w dłoniach i ujrzeli piękno starożytnego Egiptu. Na ścianach zachowały się niezwykłe malowidła przedstawiające chłopów pracujących na polach, dwór faraona oraz bóstwa sądu. Już same te malowidła stanowiły wystarczający powód, by dokładnie zbadać cały grobowiec."
 lepsius.505.g: "Splendor starożytnego Egiptu!"
 lepsius.505.h: "Ups."
 lepsius.506.t_archaeology: "Piękny sarkofag"
 lepsius.506.t_engine: "Sarkofag w niebezpieczeństwie"
 lepsius.506.t_muscular: "Uszkodzony sarkofag"
 lepsius.506.d_archaeology: "Nasi archeolodzy wkraczają do komory królewskiej z podziwem i zachwytem, po czym zabezpieczają wspaniały sarkofag oraz mumię pochodzące z XX dynastii."
 lepsius.506.d_engine: "W komorze grobowej wyraźnie widać zniszczenia spowodowane przez maszynę: archeolodzy ledwie mają czas ocenić sytuację i w pośpiechu próbują jak najszybciej wyciągnąć sarkofag na zewnątrz!"
 lepsius.506.d_muscular: "Naszym archeologom udaje się dostać do nienaruszonej i pięknie zdobionej komory grobowej nieznanego faraona — ale wtedy dochodzi do nieprzewidzianego... wypadku."
 lepsius.506.f_archaeology: "Wejście naszych archeologów pod przewodnictwem [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] do właściwej komory grobowej było prawdziwie historyczną chwilą. Oprócz naczyń z darami ofiarnymi i zmumifikowanego psa czekała tam na nich wyjątkowa niespodzianka: sarkofag z mumią nieznanego faraona nadal spoczywał w miejscu jego pochówku sprzed ponad 3000 lat! Naukowcy ostrożnie badali dotykiem niezwykłe znalezisko, zmiatając z niego kurz. Po zdjęciu uszkodzonej przez rabusiów grobowych pokrywy ujrzeli dobrze zachowaną drewnianą trumnę. Nasze muzeum wzbogaciło się o wyjątkowe świadectwo kultury egipskiej!"
 lepsius.506.g: "Archeologia nas nie zawiodła."
 lepsius.506.h: "Szybko go przenieśmy!"
 lepsius.506.i: "Ups."
 lepsius.511.t: "Kwestia honoru"
 lepsius.511.d: "Według okolicznych rolników kilka dni temu zagraniczna wyprawa zatknęła flagę swojego kraju na piramidzie Cheopsa. Patrioci w naszym zespole uznali to za wyzwanie i chcą zrobić to samo."
 lepsius.511.f: "Wyprawa znajdowała się w pobliżu Kairu, gdy wszystkich jej uczestników zelektryzowała wiadomość: podobno w zeszłym tygodniu ktoś zatknął flagę swojego kraju na szczycie piramidy w Gizie! Takie popisy próżności nie przystoją naukowcom, a wciąż nie wiadomo, czy pasza wyraził zgodę na ten triumfalny gest. Jedno jest pewne: wszystkich uczestników wyprawy ogarnęło gorące pragnienie, by zrobić to samo, choćby po to, by nie narazić własnej ojczyzny na ujmę."
 lepsius.511.g: "Nie mamy na to czasu."
 lepsius.511.h: "Zrobimy to — dla [ROOT.GetCountry.GetName]!"
 lepsius.512.t: "Świt"
 lepsius.512.d: "Wyprawa wyrusza wcześnie rano, by wspiąć się na Wielką Piramidę w Gizie!"
 lepsius.512.f_wine: "Uczestnicy wspinaczki na piramidę wstają już o piątej rano. Poprzedniego dnia przygotowali flagę o wysokości pięciu metrów, po czym zwinęli ogromny sztandar i zanieśli go obok Wielkiego Sfinksa pod piramidę Cheopsa. Na śniadanie przygotowano indyka na zimno. Niektórzy wciąż odczuwają zmęczenie po wczorajszej pracy nad flagą. Część uczestników wyprawy zostaje przy namiocie rozbitym u stóp Sfinksa, a pozostali ruszają ku piramidzie. [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] obiecuje, że na szczycie będą świętować przy butelce wina zachowanej specjalnie na tę okazję."
 lepsius.512.f_no_wine: "Uczestnicy wspinaczki na piramidę wstają już o piątej rano. Poprzedniego dnia przygotowali flagę o wysokości pięciu metrów, po czym zwinęli ogromny sztandar i zanieśli go obok Wielkiego Sfinksa pod piramidę Cheopsa. Na śniadanie przygotowano indyka na zimno. Niektórzy wciąż odczuwają zmęczenie po wczorajszej pracy nad flagą. Część uczestników wyprawy zostaje przy namiocie rozbitym u stóp Sfinksa, a pozostali ruszają ku piramidzie. Dopiero gdy grupa zbliża się do Wielkiej Piramidy, attaché wojskowy orientuje się, że [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] zapomniał tego ranka o najważniejszym: winie do wzniesienia toastu!"
 lepsius.512.g: "Mam nadzieję, że przyniesie najlepsze wino..."
 lepsius.512.h: "Zapomniał wina?"
 lepsius.513.t: "Wspinaczka"
 lepsius.513.d: "Kierownik wyprawy archeologicznej i attaché wojskowy stoją u podnóża Wielkiej Piramidy. Nie mogą się zgodzić, kto powinien stanąć na czele tego śmiałego przedsięwzięcia."
 lepsius.513.f: "Nasz zespół dociera do podnóża Wielkiej Piramidy Cheopsa. Ktoś pyta, ile stopni dzieli nas od nieba — a [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] podaje dokładną liczbę: 203. Właśnie tyle warstw kamiennych bloków trzeba pokonać. Pozostaje jednak ustalić, kto poprowadzi wspinaczkę. [SCOPE.sCharacter('lepsius_military_attache').GetFullName] już zdążył zapewnić, że poradzi sobie równie dobrze jak doświadczony wspinacz..."
 lepsius.513.g: "Niech [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] poprowadzi nas dalej."
 lepsius.513.h: "Niech [SCOPE.sCharacter('lepsius_military_attache').GetFullName] poprowadzi nas dalej."
 lepsius.514.t: "Pierwotne wejście"
 lepsius.514.d: "Nasz zespół pokonał już dolną część piramidy. Znajduje się teraz na siedemnastym stopniu, tuż obok pierwotnego wejścia do komory grobowej."
 lepsius.514.f: "Pierwszy etap za nami. Choć wyprawa wciąż znajduje się niewiele ponad podnóżem piramidy, zarządzono postój. Kierownik wyprawy chciałby dokładniej zbadać pierwotne wejście do piramidy Cheopsa i zejść do jej wnętrza z kilkoma pomocnikami pracującymi przy wykopaliskach. Niektórzy uczestnicy wykorzystują przerwę, by zjeść obiad. Wszyscy wiedzą, że od tej chwili wspinaczka będzie bardziej niebezpieczna."
 lepsius.514.i: "To dobre miejsce na naszą flagę."
 lepsius.515.t: "100 stopni"
 lepsius.515.d: "Nasz zespół dotarł na setny stopień piramidy. Uczestnicy wyprawy są już niemal w połowie drogi na szczyt."
 lepsius.515.f: "Sto stopni może nie wydawać się wielkim wyzwaniem, ale z liczną grupą, bagażami i niewielką ilością miejsca sprawa wygląda zupełnie inaczej. Nasz sztandar wciąż jest zwinięty i niesie go pięciu mężczyzn. Niektórzy uczestnicy wyprawy już oznajmiają, że jak na podziwianie widoków wspięli się wystarczająco wysoko. Tymczasem [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] spogląda z niepokojem ku szczytowi — przed nami bowiem najbardziej niebezpieczny etap wspinaczki."
 lepsius.516.t: "Upadek"
 lepsius.516.d: "Na ostatnim etapie wspinaczki na piramidę nasz kierownik i jego ludzie najwyraźniej przecenili swoje siły — doszło do tragicznego wypadku!"
 lepsius.516.f: "Może zawinił człowiek, może zawiódł plan, a może los ukarał nas za pychę. Podczas wspinaczki jeden z pomocników poślizgnął się na stopniu piramidy i pociągnął za sobą w przepaść innych uczestników wyprawy oraz niesione ładunki. Kierownik wyprawy i attaché wojskowy zdołali zapobiec najgorszemu, lecz odnieśli ciężkie obrażenia. Niektórzy tragarze wyszli z wypadku z lekkimi obrażeniami, inni ze złamaniami. Musieliśmy zrezygnować z ambitnego zamiaru zatknięcia naszej flagi na Wielkiej Piramidzie."
 lepsius.516.g: "To hańba dla nas wszystkich."
 lepsius.517.t: "Na szczycie Wielkiej Piramidy"
 lepsius.517.d: "To prawdziwie wspaniały dzień dla uczestników wyprawy i naszego kraju — [ROOT.GetCountry.GetAdjectiveNoFlag] flaga powiewa nad Wielką Piramidą w Gizie!"
 lepsius.517.f: "Wielka chwila dla archeologii, wielka chwila dla państwa [ROOT.GetCountry.GetName]. Nasza wyprawa dotarła na szczyt piramidy Cheopsa i uczciła ten wyczyn skromną uroczystością. Skandowano nazwiska Champolliona, Lepsiusa i Roselliniego, wznosząc gromkie „Hip, hip, hurra!”, aż wreszcie patrioci zatknęli flagę. W blasku zachodzącego słońca nasz sztandar lśni teraz nad całą doliną Nilu!"
 lepsius.517.g: "Wznieśmy flagę państwa [ROOT.GetCountry.GetName] — i na zdrowie!"
 lepsius.517.h: "Wznieśmy flagę państwa [ROOT.GetCountry.GetName]!"
 lepsius.521.t: "Brama Isztar"
 lepsius.521.d: "Podczas wykopalisk w Babilonie archeolodzy odkryli monumentalne pozostałości legendarnej Bramy Isztar. Ta starożytna brama miejska zachowała się w zadziwiająco dobrym stanie."
 lepsius.521.f: "Podczas wykopalisk na terenie starożytnej stolicy Babilonii robotnicy natrafili najpierw na glazurowane cegły, wskazujące na istnienie okazałej budowli reprezentacyjnej. Im głębiej kopali archeolodzy, tym więcej znajdowali. W końcu odsłonili nawet mury i wieże znakomicie zachowanej bramy miejskiej, ozdobionej kroczącymi dumnie lwami, bykami i mitycznymi stworzeniami. Kierownik wyprawy [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] przedstawił naszemu rządowi śmiały plan: rozebrać całą bramę i wiernie odtworzyć ją w naszej stolicy. To kosztowne przedsięwzięcie, pełne niewiadomych — a zarazem tak kuszące, że pomysł poparli czołowi intelektualiści i dyrekcja muzeum."
 lepsius.521.g: "Zabierzmy tylko kilka fragmentów. Brama powinna pozostać na swoim miejscu."
 lepsius.521.h: "Należy przewieźć ją do miasta [SCOPE.sState('capital_scope').GetCityHubName] i tam zrekonstruować."
 lepsius.522.t: "Transport cegieł z Mezopotamii"
 lepsius.522.d: "Do muzeum w mieście [SCOPE.sState('capital_scope').GetCityHubName] dotarła dziś duża partia cegieł przeznaczonych do rekonstrukcji bramy."
 lepsius.522.f: ""
 lepsius.522.g: "Uwielbiam zapach mezopotamskich cegieł o poranku."
 lepsius.523.t: "Cegły Bramy Isztar w obcych rękach"
 lepsius.523.d: "Nie tylko my prowadziliśmy wykopaliska w Babilonie przez ostatnie dziesięciolecia. Okazuje się, że inne państwo również posiada część cegieł potrzebnych do odbudowy Bramy Isztar. Musimy pokornie poprosić o ich przekazanie."
 lepsius.523.f: ""
 lepsius.523.g: "Chyba przyjdzie nam schować dumę do kieszeni."
 lepsius.523.h: "Dla jakichś bezwartościowych cegieł? Nigdy!"
 lepsius.524.t: "Wróg blokuje nasz transport cegieł!"
 lepsius.524.d: "Od miesięcy czekamy na cegły z Mezopotamii, potrzebne do rekonstrukcji Bramy Isztar w naszym muzeum. Teraz dotarła do nas wieść, że transport zatrzymano z powodu wojny."
 lepsius.524.f: ""
 lepsius.524.g: "To sabotaż!"
 lepsius.525.t: "Dodatkowa opłata"
 lepsius.525.d: "Najwyraźniej państwo, na którego terenie wydobyto cegły Bramy Isztar, próbuje zarobić na naszym przedsięwzięciu. Przy wywozie cegieł zażądano od nas „dodatkowej opłaty”!"
 lepsius.525.f: ""
 lepsius.525.g: "Zapłacimy za każdy kamień..."
 lepsius.526.t: "Niewielki transport cegieł z Mezopotamii"
 lepsius.526.d: "Z niewyjaśnionych przyczyn nasz statek zabrał tym razem zaledwie połowę ładunku cegieł Bramy Isztar."
 lepsius.526.f: ""
 lepsius.526.g: "Co jest takiego trudnego w przewiezieniu kilku cegieł?"
 lepsius.527.t: "Statek z cegłami zawija do portu"
 lepsius.527.d: "Do muzeum dotarła dziś wyjątkowo duża partia cegieł potrzebnych do rekonstrukcji Bramy Isztar. Najwyraźniej załadunek w Mezopotamii przebiega sprawniej, niż się spodziewaliśmy."
 lepsius.527.f: ""
 lepsius.527.g: "Ach, kolejne cegły!"
 lepsius.528.t: "Uszkodzone cegły"
 lepsius.528.d: "Niestety, podczas oględzin cegieł dostarczonych do miasta [SCOPE.sState('capital_scope').GetCityHubName] nasi kustosze stwierdzili, że zawartość części skrzyń zupełnie nie nadaje się do użytku. Chcąc nie chcąc, musimy się bez niej obejść."
 lepsius.528.f: ""
 lepsius.528.g: "Nie! Tylko nie moje cenne cegły!"
 lepsius.529.t: "Dyplomatyczne upokorzenie"
 lepsius.529.d: "Pewne państwo upokorzyło się na oczach całego świata, błagając nas o kilka bezwartościowych artefaktów archeologicznych, które parę lat temu sprzedał nam pewien antykwariusz. Oczywiście z przyjemnością przyjęliśmy ten gest pokory i pozbyliśmy się tych rupieci."
 lepsius.529.f: ""
 lepsius.529.g: "Znakomicie!"
 lepsius.530.t: "Brama Isztar zrekonstruowana!"
 lepsius.530.d: "Po latach pracy i żmudnego składania dziesiątek tysięcy babilońskich fragmentów legendarna Brama Isztar znów lśni pełnym blaskiem — odtworzona w oryginalnych rozmiarach w naszym muzeum!"
 lepsius.530.f: "Brama Isztar była ósmą bramą prowadzącą do wewnętrznej części Babilonu. Wzniesiono ją około 575 roku p.n.e. na rozkaz króla Nabuchodonozora II, po północnej stronie miasta. Stanowiła część monumentalnej drogi procesyjnej, otoczonej murami i prowadzącej do wnętrza miasta. Ściany pokryto glazurowanymi cegłami, przeważnie niebieskimi, a w regularnych odstępach zdobiły je płaskorzeźby zwierząt i bóstw, również wykonane z cegieł o odpowiednich kształtach i barwach. Front bramy zdobił powtarzający się motyw płaskorzeźb symbolizujących dwóch najważniejszych bogów babilońskiego panteonu. Marduka, naczelne bóstwo i opiekuna Babilonii, reprezentował służący mu smok Mušḫuššu, przedstawiany z wężową głową i ogonem, lwim ciałem pokrytym łuskami oraz potężnymi szponami tylnych łap. Marduka uważano za boskiego obrońcę dobra w walce ze złem, a Babilończycy często przyzywali jego opieki w swoich zaklęciach. Drugim bogiem przedstawionym na płaskorzeźbach Bramy Isztar był Adad, znany również jako Iszkur, którego świętym zwierzęciem był tur — wymarły przodek bydła domowego. Adad władał zarówno niszczycielskimi burzami, jak i dobroczynnym deszczem. Dekorację bramy uzupełniały geometryczne obramowania oraz rozety, często uznawane za symbole płodności. Cegły Bramy Isztar wykonywano z drobnoziarnistej gliny wciskanej w drewniane formy. Płaskorzeźby zwierząt również składano z cegieł, które uzyskiwały odpowiedni kształt dzięki wyciskaniu gliny w formach wielokrotnego użytku."
 lepsius.530.g: "Wspaniale!"
 lepsius.531.t: "Legenda o Lamassu"
 lepsius.531.d: "Nasi archeolodzy usłyszeli opowieść o wyjątkowo okazałym lamassu, które zaginęło dawno temu i podobno znajduje się gdzieś na ziemiach kurdyjskich."
 lepsius.531.f: "Pewnego wieczoru nasz zespół rozbił namioty, rozpalił ognisko i szykował baraninę na kolację. Gdy niebo dogasało w odcieniach czerni, błękitu i czerwieni, do obozu przybył stary pasterz z prośbą o prowiant. [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] spełnił jego prośbę, a w zamian usłyszał niezwykłą opowieść. Podobno około trzydziestu lat temu inna wyprawa archeologiczna szukała w tej okolicy skarbów i wyjątkowych dzieł sztuki, by zaimponować dyrekcji swojego muzeum i wrócić do ojczyzny w chwale. Najwspanialszym znaleziskiem było ogromne lamassu, które miejscowi do dziś wspominają ze względu na jego monumentalne rozmiary i dobry stan zachowania. Podczas transportu doszło jednak do nieszczęścia. Gdy dziesiątki ludzi przemieszczały olbrzymi posąg mezopotamskiej istoty o cechach człowieka i zwierząt, kierownicy wyprawy poróżnili się z miejscowym plemieniem kurdyjskim. Najwyraźniej zamierzali pozbawić wynajętych kurdyjskich pomocników należnej im zapłaty. Członkowie plemienia urządzili więc zasadzkę na uczestników wyprawy i zabrali to, co uważali za swoją własność. Lamassu pozostało jednak na miejscu i do dziś czeka na ziemiach kurdyjskich, aż ktoś je stamtąd zabierze. W zamian za okazaną pomoc pasterz zaproponował, że zdradzi nam miejsce, w którym znajduje się legendarny posąg."
 lepsius.531.g: "Nie warto bez potrzeby ryzykować życia dla takich bajek."
 lepsius.531.h: "Musimy odzyskać to lamassu za wszelką cenę!"
 lepsius.532.t: "Poszukiwania lamassu"
 lepsius.532.d: "Nasza wyprawa wyruszyła w niebezpieczną podróż na ziemie kurdyjskie. Niektórzy proponują podział na grupy, by zwiększyć szanse powodzenia."
 lepsius.532.g: "Nie powinniśmy się rozdzielać."
 lepsius.532.h: "Powinniśmy podzielić wyprawę na grupy."
 lepsius.533.t: "Dary"
 lepsius.533.d: "Uczestnicy naszej wyprawy spotkali się z przywódcami klanów, by uzyskać zgodę na pokojowe przejście przez ich ziemie i odzyskanie lamassu."
 lepsius.533.f: "Decyzja, by nie rozdzielać wyprawy, przyniosła nieoczekiwaną korzyść: przez powolne tempo taboru przywódcy miejscowego klanu kurdyjskiego odnaleźli nas szybciej, niż się spodziewaliśmy. Wkrótce kierownik wyprawy i attaché wojskowy stanęli przed starszyzną, uznawaną za rzeczywistych władców tych ziem. Przyjęto ich z wyraźną nieufnością. Najwyraźniej przykre wspomnienia po poprzedniej wyprawie archeologicznej wciąż są tu żywe. Oczekuje się również, że jako goście przywieziemy dary. [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] przygotował się na taką ewentualność, lecz zgromadzone podarki najwyraźniej nie wystarczają, by przekonać wielu przywódców o naszych dobrych zamiarach."
 lepsius.533.g: "Zaoferujmy wykwintne tkaniny."
 lepsius.533.h: "Przypomnijmy im o honorze i gościnności."
 lepsius.533.i: "Okażmy im uległość."
 lepsius.534.t: "Znieważeni"
 lepsius.534.d: "Próba zjednania sobie kurdyjskiej starszyzny zakończyła się całkowitą porażką — zamiast tego zraziliśmy ją do siebie. Dalsze zaostrzenie sytuacji zagraża całej naszej wyprawie!"
 lepsius.534.g: "Strażnicy!"
 lepsius.534.h: "Brońmy się!"
 lepsius.534.i: "Uciekajmy!"
 lepsius.535.t: "Uczestnicy wyprawy porwani przez Kurdów"
 lepsius.535.d: "Po bezowocnych poszukiwaniach grupa, która odłączyła się od wyprawy, wraca do obozu. Ku swojemu przerażeniu odkrywa, że część pozostawionych tam uczestników padła ofiarą ataku Kurdów."
 lepsius.535.f: "Podział wyprawy okazał się fatalnym błędem. Najwyraźniej jedno z kurdyjskich plemion tylko czekało na okazję do grabieży i wykorzystało moment, w którym uzbrojona grupa pod dowództwem attaché wojskowego odłączyła się od reszty karawany. Ponieważ większość zrabowanego wyposażenia miała dla napastników niewielką wartość, uprowadzili oni kilkunastu pomocników jako zakładników, licząc zapewne na okup. Uczestnicy wyprawy postanowili jednak nie ulegać takim żądaniom — mogłoby to stworzyć niebezpieczny precedens. [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] nalega na negocjacje z kurdyjskimi przywódcami, natomiast [SCOPE.sCharacter('lepsius_military_attache').GetFullName] domaga się ataku na ich obóz, by dać rabusiom nauczkę."
 lepsius.535.g: "Spróbujmy negocjować."
 lepsius.535.h: "Zaatakujmy ich!"
 lepsius.536.t: "Negocjacje zakończyły się fiaskiem!"
 lepsius.538.t: "Noc rozpaczy"
 lepsius.538.d: "Poszukiwania lamassu zakończyły się niepowodzeniem."
 lepsius.538.f: "Uczestnicy wyprawy opuszczają ziemie kurdyjskie z pustymi rękami. Niczym zbite psy przedzierają się nocą przez wzgórza, by wrócić na dawny szlak. Strata ludzi i wyposażenia przygnębia wszystkich. Wątpliwości co do sensu całej podróży pogłębiają smutek i zniechęcenie."
 lepsius.538.g: "Jeszcze tu wrócimy..."
 lepsius.539.t: "Chwalebna śmierć"
 lepsius.539.d: "[SCOPE.sCharacter('lepsius_military_attache').GetFullName], nasz attaché wojskowy, poległ w walce z Kurdami!"
 lepsius.539.f: "Walka była zacięta, lecz nasi słabo wyszkoleni ludzie niewiele mogli zdziałać przeciwko doświadczonym i odważnym kurdyjskim wojownikom. Attaché zarządził odwrót i pozostał ze swoimi żołnierzami, by osłaniać nasz odwrót. [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] zdążył tylko po raz ostatni obejrzeć się za siebie i zobaczyć, jak attaché pada na ziemię, pokonany. Dzięki jego poświęceniu zespół zyskał cenny czas, by dotrzeć w bezpieczne miejsce. Dla niego samego było już jednak za późno na ratunek."
 lepsius.539.g: "Oddał życie, by ocalić nasze."
 lepsius.540.t: "Lamassu"
 lepsius.540.d: "[SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] zdołał przekonać Kurdów do naszych zamiarów. Droga do odzyskania Lamassu stoi otworem."
 lepsius.540.d_victory: "Odnieśliśmy zwycięstwo nad miejscowym plemieniem kurdyjskim i otworzyliśmy sobie drogę do legendarnego Lamassu!"
 lepsius.540.f: "Niełatwo było przekonać Kurdów o naszych dobrych zamiarach, lecz dzięki umiejętnościom kierownika wyprawy to pozornie niemożliwe przedsięwzięcie zakończyło się sukcesem. Już po kilku dniach poszukiwań odnaleźliśmy opisane Lamassu w pobliżu urwiska. Cóż za majestatyczny widok — posąg górujący nad całą doliną! Nasi archeolodzy z radością stwierdzili, że kolos jest niemal nietknięty. Już teraz wiadomo, że stanie się najważniejszym eksponatem naszej kolekcji mezopotamskiej."
 lepsius.540.f_victory: "Po ciężkiej i zaciętej walce nasz bohaterski attaché [SCOPE.sCharacter('lepsius_military_attache').GetFullName], dzięki swoim znakomitym umiejętnościom (i niewielkiej pomocy żołnierzy), zdołał zmusić przeciwnika do ucieczki. Po takiej nauczce Kurdowie nie śmieli już przeszkadzać nam w odzyskaniu Lamassu. Już po kilku dniach poszukiwań odnaleźliśmy opisane Lamassu w pobliżu urwiska. Cóż za majestatyczny widok — posąg górujący nad całą doliną! Nasi archeolodzy z radością stwierdzili, że kolos jest niemal nietknięty. Już teraz wiadomo, że stanie się najważniejszym eksponatem naszej kolekcji mezopotamskiej."
 lepsius.540.g: "Coś wspaniałego!"
 lepsius.551.t: "Wypadek na wykopaliskach"
 lepsius.551.d: "Na wykopaliskach doszło do strasznego wypadku — dr [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] zaginął!"
 lepsius.551.g: "Co się stało z [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHim]?"
 lepsius.552.t: "Labirynt"
 lepsius.552.g: "Obyśmy nie natknęli się na żadne mityczne stwory przypominające byki..."
 lepsius.553.t: "Znów w labiryncie"
 lepsius.553.g: "To istny déjà vu!"
 lepsius.554.t: "Sala Delfinów"
 lepsius.554.g: "Zeus — idź w lewo."
 lepsius.554.h: "Demeter i Persefona — idź w prawo."
 lepsius.554.i: "Artemida — idź na górę."
 lepsius.554.j: "Posejdon — idź na dół."
 lepsius.555.t: "Sala Słońca"
 lepsius.555.d: "Na końcu korytarza droga rozdziela się na trzy przejścia. Na ścianie widać pozostałości fresku."
 lepsius.555.f: "Błękit fresku przyciąga wzrok [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetFullNameNoFormatting]. Niebo zajmuje całą ścianę. Po wschodniej stronie stoi Eos, bogini świtu, dominująca nad całą sceną. Naprzeciw niej, na zachodzie, widnieje jej mąż Astrajos, którego sylwetka ledwie odcina się od nocnego tła. Pomiędzy nimi jaśnieje słońce w zenicie."
 lepsius.555.g: "Eos — wybierz lewy korytarz."
 lepsius.555.h: "Astrajos — wybierz prawy korytarz."
 lepsius.555.i: "Helios — wybierz środkowy korytarz."
 lepsius.556.t: "Sala Kobiet"
 lepsius.556.d: "Zagubiony dociera do komnaty, na której końcu znajdują się cztery otwarte drzwi. Przed nimi stoją niewielkie posągi czterech kobiet."
 lepsius.556.f: "Cztery rzeźby przedstawiają kobiety w różnym wieku i o różnej budowie ciała. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetFullNameNoFormatting] nie potrafi stwierdzić, czy to boginie, czy śmiertelniczki. Ich sylwetki są prymitywne, z zaznaczonymi jedynie najważniejszymi szczegółami. Barwy dawno już wyblakły, a postacie odróżniają od siebie przedmioty trzymane w dłoniach. Pierwsza trzyma kłębek przędzy, z którego wyciąga nić. Druga przegląda się w trzymanym przed sobą lustrze. Trzecia trzyma węża. Ostatnia dzierży łuk."
 lepsius.556.g: "Kłębek przędzy — drzwi I."
 lepsius.556.h: "Lustro — drzwi II."
 lepsius.556.i: "Wąż — drzwi III."
 lepsius.556.j: "Łuk — drzwi IV."
 lepsius.557.t: "Sala Wysp"
 lepsius.557.g: "Rodos."
 lepsius.557.h: "Delos."
 lepsius.557.i: "Eubea."
 lepsius.557.j: "Naksos."
 lepsius.558.t: "Gniew Minotaura"
 lepsius.558.g: "Co tam się właśnie wydarzyło?"
 lepsius.559.t: "Tragiczna śmierć: [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetFullNameNoFormatting]"
 lepsius.559.d: "Dr [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastNameNoFormatting] został znaleziony martwy w swoim mieszkaniu w tajemniczych okolicznościach."
 lepsius.559.g: "Ale czy to na pewno było samobójstwo?"
 lepsius.560.t: "Ucieczka z labiryntu!"
 lepsius.560.d: "Po wydostaniu się wreszcie z labiryntu [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetFullNameNoFormatting] może opowiedzieć [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] współpracownikom o niezwykłym odkryciu. Na dowód, że [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] nie postradał zmysłów, [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] przyniósł ze [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHim] zdumiewający dowód, który [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] znalazł w głębi labiryntu."
 lepsius.560.g: "Czyżby to był... legendarny labirynt Dedala?"
 lepsius.561.t: "Tajemnicza piramida"
 lepsius.561.d: "Nasza wyprawa archeologiczna odkryła nieznaną dotąd piramidę, do połowy pochłoniętą przez jukatańską dżunglę. [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] zna już opowieści o tym miejscu i postanawia spróbować dostać się do środka..."
 lepsius.561.g: "Mam co do tego złe przeczucia."
 lepsius.561.h: "Ciekawe. Ty idź pierwszy."
 lepsius.562.t: "Zagadka glifów"
 lepsius.562.d: "Na końcu długiego korytarza o sklepieniu wspornikowym znajduje się płyta z obrobionego kamienia, na której wyryto zagadkę. Cztery zagłębione kartusze, każdy z wyrzeźbionym obliczem jednego z wielkich bogów Majów, dają się wcisnąć. Wszystko wskazuje na to, że w murze kryje się mechanizm. Poniżej widnieje dwuwiersz: „Na wschodzie wstaję w ognistej chwale, w zenicie płonę niczym jadeit; o zmierzchu zstępuję na drogę pod ziemią, rachuję dni i osadzam władców na tronach”. Trzeba nacisnąć jeden z kartuszy."
 lepsius.562.g: "K'inich Ajaw (Pan Słońca)."
 lepsius.562.h: "Chaac (Deszcz/Pioruny)."
 lepsius.562.i: "Itzamnaaj (Stwórca/Niebo)."
 lepsius.562.j: "Kukulkan (Pierzasty Wąż)."
 lepsius.563.t: "Bożek"
 lepsius.563.d_right: "Nasz archeolog dociera do celu wyprawy — mechanizm ustępuje, otwierając wejście do sanktuarium."
 lepsius.563.d_wrong: "Nasz archeolog dociera do wewnętrznej komnaty, lecz wejście do niej okazuje się podejrzanie łatwe — ten mechanizm z pewnością jeszcze czymś nas zaskoczy."
 lepsius.563.g: "Delikatnie... ostrożnie... zrób to..."
 lepsius.563.h: "Znam tę scenę — to nigdy nie kończy się dobrze. Łap ten cholerny artefakt i WIEJ!"
 lepsius.564.t: "To pułapka!"
 lepsius.564.g: "WIEJ!"
 lepsius.564.h: "Wiedziałem — niech to szlag!"
 lepsius.565.t_right: "Wyjście z piramidy"
 lepsius.565.t_wrong: "Rywal w archeologii"
 lepsius.565.d_right: "Wbrew oczekiwaniom [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] uchodzi z życiem z pułapek piramidy i zdoła zdobyć bożka!"
 lepsius.565.g: "Charlie, odpal silnik!"
 lepsius.565.h: "Nie znoszę tego faceta."
 lepsius.566.t: "Archeologiczna oferta"
 lepsius.566.d: "Prywatny archeolog oferuje nam znakomity okaz, który wcześniej sprzątnął sprzed nosa zagranicznemu rywalowi."
 lepsius.566.f: "Prywatna wyprawa doniosła o piramidzie Majów ukrytej głęboko w jukatańskiej dżungli. Jej przywódca — niestety nasz rodak — twierdzi, że zdobył świętego bożka, którego wskutek osobliwego zbiegu okoliczności zdołał właśnie odebrać noszącemu fedorę archeologowi z kraju [PREV.GetCountry.GetAdjectiveNoFlag]. Ten ostatni, jak głosi opowieść, zginął wkrótce potem w gwałtownej potyczce z wojownikami plemienia Hovitos. Choć okoliczności budzą podejrzenia, okaz ten byłby wyjątkową atrakcją prekolumbijskiej kolekcji naszego muzeum — o ile zapłacimy żądaną cenę."
 lepsius.566.g: "Ten artefakt będzie się wspaniale prezentował w naszej kolekcji!"
 lepsius.566.h: "Nie kupujemy artefaktów od bezwzględnych rabusiów grobów."
 lepsius.581.t: "Powrót do zaginionego świata"
 lepsius.581.g: "Powinien odzyskać honor."
 lepsius.581.i: "Interesy naszego państwa są ważniejsze niż urażona duma marnych jednostek."
 lepsius.582.t: "Lekceważony odkrywca powraca w triumfie"
 lepsius.582.d: "Ku zaskoczeniu całego świata nauki [SCOPE.sCharacter('lepsius_lostworld_leader').GetFullName] powrócił z Jukatanu — i ma dowody na poparcie swoich osobliwych twierdzeń!"
 lepsius.582.g: "On... miał rację?"
 lepsius.583.t: "Lekceważony odkrywca znika na Jukatanie"
 lepsius.584.t: "Wkraczając do zaginionego świata"
 lepsius.584.d: "Po tygodniach podróży wyprawa dotarła do zupełnie nieznanej doliny. Wygląda na to, że [SCOPE.sCharacter('lepsius_lostworld_leader').GetFullName] rzeczywiście ma rację, a jego nieprawdopodobne twierdzenia są prawdziwe!"
 lepsius.584.g: "Niesamowite!"
 lepsius.585.t: "Fotografowanie dinozaurów"
 lepsius.585.d: "Nowe możliwości techniczne pozwalają uwiecznić na zdjęciach wyjątkową florę i faunę zaginionego świata."
 lepsius.585.f: "To jak spojrzenie przez okno na świat sprzed milionów lat: pterozaury władają przestworzami, olbrzymie brontozaury wprawiają ziemię w drżenie, a groźne raptory polują na nieostrożne ofiary. Tutejsza roślinność również zupełnie różni się od tej w pozostałych częściach Jukatanu. Towarzyszący wyprawie naukowiec wykorzystał okazję i wykonał całą serię zdjęć, które posłużą jako dowód po powrocie do kraju. Być może tamtejsi uczeni zdołają dzięki nim jeszcze dokładniej odtworzyć pradzieje Ziemi."
 lepsius.585.g: "Zrób „RAAWR”, proszę!"
 lepsius.586.t: "Ślady obecności Majów"
 lepsius.586.d: "Po dokładnym zbadaniu doliny kierownik wyprawy opracował ryzykowny plan."
 lepsius.586.g: "Niepowtarzalna okazja!"
 lepsius.586.h: "Zabierzmy ze sobą tylko najpotrzebniejsze dowody."
 lepsius.587.t: "Wyprawa kończy się straszliwą katastrofą"
 lepsius.587.d: "Po ataku raptorów wyprawa przybrała najgorszy możliwy obrót."
 lepsius.588.t: "Klejnot Kukulkana"
 lepsius.588.d: "Wbrew wszelkim przeciwnościom kierownik naszej wyprawy zdołał zdobyć legendarny Klejnot Kukulkana!"
 lepsius.589.t: "Bohaterowie wracają z zaginionego świata"
 lepsius.589.f: "Cóż za dzień! Po niebezpiecznej, pełnej przygód podróży na kraniec świata uczestnicy naszej wyprawy zaprezentowali niezwykłe znaleziska, dowodząc wszystkim, że [SCOPE.sCharacter('lepsius_lostworld_leader').GetFullName] nie jest szaleńcem, lecz szanowanym naukowcem i prawdziwym bohaterem! Prasa i społeczeństwo całkowicie zmieniły zdanie, uznając również rządowe wsparcie wyprawy za słuszną decyzję. Kierownik wyprawy zobowiązał się jednak zachować położenie doliny w tajemnicy, by chronić tamtejszą florę i faunę oraz ograniczyć zagrożenie ze strony kłusowników."
 lepsius.701.t: "Cudzoziemcy chcą ukraść nasze dziedzictwo"
 lepsius.701.d: "[SCOPE.sCountry('lepsius_smuggler_country').GetAdjectiveNoFlag] archeolodzy zostali dziś przyłapani na próbie nielegalnego wywozu cennego artefaktu z naszego kraju. Jak powinniśmy zareagować?"
 lepsius.701.f: "Cudzoziemcy z państwa [SCOPE.sCountry('lepsius_smuggler_country').GetName], którym udzieliliśmy zezwoleń na wykopaliska, zostali dziś przyłapani na próbie wywiezienia z kraju niezwykle cennego artefaktu. Zgodnie z obowiązującym prawem zagraniczni archeolodzy muszą przekazywać połowę znalezisk państwu, na którego terenie prowadzą wykopaliska. Najwyraźniej próbowali przemycić znalezisko do ojczyzny, nie dając nam możliwości jego zbadania."
 lepsius.701.g: "Protest!"
 lepsius.701.h: "Co nam po tych starych bazgrołach?"
 lepsius.702.t: "Incydent dyplomatyczny"
 lepsius.702.d: "Niestety, władze państwa [SCOPE.sCountry('lepsius_protest_country').GetName] odkryły naszą próbę przewiezienia cennego artefaktu do naszego kraju. Jak powinniśmy zareagować?"
 lepsius.702.f: "Od końca XIX wieku najczęściej udzielano zezwoleń na wykopaliska archeologiczne na zasadzie podziału znalezisk: prowadzący badania przekazywał połowę odkrytych artefaktów państwu, na którego terenie pracował. Władze oglądały znaleziska i szczególnie pilnowały, by najcenniejsze okazy nie opuszczały kraju. Mimo to niektóre państwa raz po raz odmawiały oddania wydobytego zabytku. W innych przypadkach strony dochodziły do porozumienia w drodze negocjacji."
 lepsius.702.g: "Znalezione, nie kradzione."
 lepsius.702.h: "Z pewnością dojdziemy do porozumienia."
 lepsius.702.i: "Podarujmy im artefakt na znak naszej hojności."
 lepsius.703.t: "Cudzoziemcy z nas drwią!"
 lepsius.703.d: "Barbarzyńcy z państwa [SCOPE.sCountry('lepsius_smuggler_country').GetName] wyśmiali nasze żądania. Ani myślą dzielić się z nami znaleziskiem — przemycili już artefakt do swojej ojczyzny."
 lepsius.703.f: "Epoka wiktoriańska obfituje w historie nielegalnego wywozu artefaktów, zwłaszcza przez europejskie mocarstwa. W niektórych przypadkach muzea do dziś mierzą się z żądaniami zwrotu tych zabytków."
 lepsius.703.g: "Co za niewiarygodna arogancja!"
 lepsius.704.t: "Ustępstwa przyznane"
 lepsius.704.d: "[SCOPE.sCountry('lepsius_smuggler_country').GetName] wyszło nam naprzeciw i uznało nasze żądania za uzasadnione. Proponuje ustępstwa dyplomatyczne i finansowe, a także szereg innych znalezisk, by przekonać nas do przekazania cennego skarbu."
 lepsius.704.f: "W wielu przypadkach podejrzeń o rabunek grobów lub kradzież europejskie mocarstwa szły na ustępstwa wobec państw, na których terenie prowadzono wykopaliska. Na przykład po wykopaliskach w Troi Schliemann musiał tłumaczyć się przed Wysoką Portą z przemytu artefaktów za granicę. Nie tylko przekazał część znalezisk, lecz także zapłacił pięciokrotność żądanej kwoty. Z pewnością nie był to najbardziej elegancki sposób postępowania w stosunkach międzynarodowych, ale zawsze lepszy niż całkowite oszukanie państwa, z którego pochodziły znaleziska. Państwa występujące z roszczeniami często przyjmowały takie rozwiązanie jako polubowne zakończenie sporu."
 lepsius.704.g: "Dobrze, że zrozumieli swój błąd."
 lepsius.706.t: "Cenny artefakt dotarł na miejsce!"
 lepsius.706.d: "Po niewielkim opóźnieniu cenny artefakt dotarł dziś wreszcie do muzeum. Dyrektor wybrał już dla niego wyjątkowe miejsce!"
 lepsius.706.f: "Cenne artefakty są chlubą każdej wystawy i każdego muzeum. Szczęśliwy kraj, który ma w swoich zbiorach takie skarby!"
 lepsius.711.t: "Maska Tutanchamona"
 lepsius.711.d: "Po odkryciu zaginionego grobowca Tutanchamona nasi archeolodzy zdołali wydobyć wyjątkowy artefakt: maskę faraona!"
 lepsius.711.f: "Maska Tutanchamona to złota maska grobowa starożytnego egipskiego faraona z XVIII dynastii. Jest jednym z najbardziej rozpoznawalnych dzieł sztuki na świecie i symbolem starożytnego Egiptu. Nawiązuje do wizerunku Ozyrysa, egipskiego boga zaświatów, mierzy 54 centymetry wysokości, waży ponad 10 kilogramów, czyli 321,5 uncji trojańskich, i jest zdobiona kamieniami półszlachetnymi. Na jej ramionach wyryto hieroglifami starożytne zaklęcie z Księgi Umarłych. Twarz przedstawia faraona w konwencjonalny sposób, znany również z innych przedmiotów odnalezionych w grobowcu, zwłaszcza posągów strażników. Według egiptologa Nicholasa Reevesa maska jest „nie tylko najbardziej charakterystycznym wizerunkiem z grobowca Tutanchamona, lecz być może także najbardziej znanym zabytkiem całego starożytnego Egiptu”."
 lepsius.711.g: "Będzie najwspanialszym eksponatem w naszej kolekcji."
 lepsius.711.h: "Powinniśmy spróbować bezpiecznie wywieźć artefakt z kraju..."
 lepsius.712.t: "Popiersie Nefertiti"
 lepsius.712.d: "Podczas wykopalisk w Egipcie nasi archeolodzy odnaleźli prawdziwie wyjątkowy artefakt: popiersie Nefertiti!"
 lepsius.712.f: "Popiersie Nefertiti to wykonana z wapienia, pokryta stiukiem i pomalowana rzeźba przedstawiająca Nefertiti, Wielką Małżonkę Królewską egipskiego faraona Echnatona. Należy do najczęściej kopiowanych dzieł sztuki starożytnego Egiptu. Nefertiti stała się jedną z najsłynniejszych kobiet starożytnego świata i ikoną kobiecego piękna. Niewiele jednak wiadomo o jej życiu. Według różnych teorii mogła pochodzić z egipskiej rodziny królewskiej, być zagraniczną księżniczką lub córką wysokiego urzędnika imieniem Aj, który objął tron po Tutanchamonie. Być może współrządziła Egiptem z Echnatonem, panującym w latach 1352–1336 p.n.e. Na popiersiu nie ma żadnych inskrypcji, ale charakterystyczna korona, znana z innych zachowanych wizerunków królowej, pozwala z całą pewnością rozpoznać w nim Nefertiti."
 lepsius.713.t: "Paleta Narmera"
 lepsius.713.d: "Podczas wykopalisk nasi archeolodzy odkryli niezwykły artefakt: Paletę Narmera!"
 lepsius.713.f: "Paleta Narmera, znana również jako Wielka Paleta z Hierakonpolis, to ważny egipski zabytek archeologiczny datowany na około XXXI wiek p.n.e., zaliczany — przynajmniej formalnie — do palet kosmetycznych. Znajdują się na niej jedne z najstarszych odkrytych inskrypcji hieroglificznych. Według niektórych badaczy przedstawia zjednoczenie Górnego i Dolnego Egiptu pod panowaniem króla Narmera. Wraz z głowicą maczugi króla Skorpiona i głowicami maczug Narmera, odnalezionymi w tym samym głównym depozycie w Nechen, stanowi jedno z najwcześniejszych znanych przedstawień egipskiego władcy. Ukazuje wiele klasycznych konwencji sztuki starożytnego Egiptu, które musiały być już ustalone w chwili jej powstania. Egiptolog Bob Brier nazwał Paletę Narmera „pierwszym dokumentem historycznym na świecie”."
 lepsius.722.t: "Maska Sargona"
 lepsius.722.d: "Podczas wykopalisk w Niniwie, prowadzonych w związku z odkryciem Wiszących Ogrodów, nasi archeolodzy odnaleźli niezwykły artefakt: Maskę Sargona!"
 lepsius.722.f: "Brązowa głowa króla w peruce przypominającej hełm, charakterystycznej dla dawnych władców sumeryjskich, przedstawia prawdopodobnie samego Sargona. Choć brakuje jej inkrustowanych oczu, a w innych miejscach nosi drobne uszkodzenia, słusznie zalicza się ją do największych arcydzieł sztuki starożytnej. To naturalnej wielkości popiersie z brązu odnaleziono w Niniwie. Misternie ułożone loki brody i kunsztowna fryzura podkreślają królewską godność, potęgę i bogactwo, tworząc wizerunek idealnego mężczyzny w ówczesnym społeczeństwie. Oprócz walorów estetycznych dzieło wyróżnia się również techniką wykonania: jest najstarszą znaną rzeźbą odlaną jako pusta w środku przy użyciu metody wosku traconego. Celowe uszkodzenia lewej strony twarzy i oka świadczą o tym, że w późniejszym okresie popiersie okaleczono w akcie politycznego ikonoklazmu."
 lepsius.723.t: "Hełm Meskalamduga"
 lepsius.723.d: "Podczas wykopalisk w Babilonii nasi archeolodzy natrafili na wyjątkowe znalezisko: Hełm Meskalamduga!"
 lepsius.723.f: "Hełm Meskalamduga jest jednym z najsłynniejszych znalezisk z królewskich grobowców w Ur. Meskalamdug był wczesnym władcą sumeryjskim z I dynastii z Ur, panującym w XXVI wieku p.n.e. Hełm wykuto ze złotej blachy, dlatego nie nadawał się do ochrony w walce. Prawdopodobnie służył raczej celom ceremonialnym lub kultowym. Poza wymodelowanymi po bokach uszami całość przypomina perukę, której delikatne ryty naśladują falowane włosy. Po bokach widnieją loki, oddzielone od reszty fryzury warkoczem oplatającym głowę i związanym z tyłu w węzeł. Wzdłuż krawędzi hełmu znajduje się szereg niewielkich otworów, do których prawdopodobnie mocowano wyściółkę."
 lepsius.731.t: "Maska Agamemnona"
 lepsius.731.d: "Wśród skarbów odkrytych w Mykenach naszą uwagę przykuł jeden wyjątkowy artefakt: złota maska grobowa, zwana Maską Agamemnona!"
 lepsius.731.f: "„Maska Agamemnona” to nazwa złotej maski grobowej odkrytej na stanowisku archeologicznym w starożytnych Mykenach. Niemiecki archeolog Heinrich Schliemann, który odnalazł ją w 1876 roku, sądził, że odkrył ciało mykeńskiego króla Agamemnona, wodza Achajów opisanego w Iliadzie, eposie Homera o wojnie trojańskiej. Współczesne badania archeologiczne wskazują jednak, że maska pochodzi z około 1600 roku p.n.e., a więc powstała 300–400 lat przed okresem legendarnej wojny trojańskiej. Wykonano ją z grubej złotej blachy o żółtoczerwonawym odcieniu. Mierzy około 26 cm wysokości i 26,5 cm szerokości. W blasze wytłoczono twarz mężczyzny z brodą, wąsami i brwiami. Przy każdym płatku ucha znajduje się otwór, który prawdopodobnie służył do mocowania maski. Cathy Gere nazwała ją „Moną Lisą prehistorii”."
 lepsius.732.t: "Dysk z Fajstos"
 lepsius.732.d: "Podczas wykopalisk na Krecie odkryto osobliwy i tajemniczy artefakt: Dysk z Fajstos!"
 lepsius.732.f: "Dysk z Fajstos to krążek z wypalonej gliny pochodzący z minojskiego pałacu w Fajstos na Krecie, datowany przypuszczalnie na środkowy lub późny okres minojski epoki brązu, czyli II tysiąclecie p.n.e. Ma około 15 cm średnicy, a obie jego strony pokrywają spiralnie ułożone, odciśnięte symbole. Jego przeznaczenie i miejsce wykonania pozostają przedmiotem sporów. Dysk odkrył w 1908 roku włoski archeolog Luigi Pernier na terenie minojskiego pałacu w Fajstos. Widnieje na nim 241 odcisków przedstawiających 45 różnych znaków. Najwyraźniej wykonano je przez wciskanie hieroglificznych „pieczęci” w miękką glinę, układając je zgodnie z ruchem wskazówek zegara w spiralę biegnącą ku środkowi dysku. Dysk z Fajstos rozpalił wyobraźnię zarówno archeologów amatorów, jak i zawodowych badaczy. Wielokrotnie próbowano rozszyfrować zapis ukryty w jego znakach."
 lepsius.733.t: "Bogini z wężami"
 lepsius.733.d: "Podczas wykopalisk na Krecie w nasze ręce trafił minojski artefakt o wyjątkowej wartości artystycznej i historycznej: Bogini z wężami!"
 lepsius.733.f: "Dwie minojskie figurki bogini z wężami odkryto w 1903 roku w pałacu w Knossos na greckiej wyspie Krecie. Obie zachowały się ze znacznymi ubytkami i pochodzą ze schyłku okresu nowych pałaców cywilizacji minojskiej, około 1600 roku p.n.e. Evans nazwał większą z nich „Boginią z wężami”, a mniejszą „Kapłanką z wężami”. Od tamtej pory trwa spór, czy miał rację, czy też obie figurki przedstawiają kapłanki, to samo bóstwo lub dwie różne boginie. Połączenie bogatych strojów całkowicie odsłaniających piersi z trzymanymi w dłoniach wężami wzbudziło ogromne zainteresowanie, a także przyczyniło się do powstania licznych falsyfikatów. Zwłaszcza mniejsza figurka pozostaje rozpoznawalnym symbolem sztuki i religii minojskiej i dziś również jest powszechnie nazywana „Boginią z wężami”."
 lepsius.771.t: "Skarb grobowy Pakala"
 lepsius.771.d: "Po odkryciu grobowca króla Pakala udało nam się wydobyć wyjątkowe artefakty: Skarby grobowe Pakala!"
 lepsius.771.f: "Zadziwiające, że Majowie, choć nie dysponowali metalowymi narzędziami, wykonywali liczne przedmioty z tak twardego i zwartego materiału jak jadeit. Były to przede wszystkim rozmaite elementy stroju, zwłaszcza królewskiego: płytki pasa, ozdoby w kształcie siekierek, kolczyki tulejowate, wisiory, a także maski. Płaskie ozdoby przypominające siekierki zdobiono niekiedy rytym wizerunkiem króla, podobnym do przedstawień na stelach. Przykładem jest „Płytka z Lejdy” z okresu wczesnoklasycznego. Najbardziej znaną maską jest prawdopodobnie maska grobowa Pakala, króla Palenque, pokryta marmurowymi płytkami o nieregularnych kształtach, z oczami wykonanymi z masy perłowej i obsydianu. Pakal Wielki był ajawem majańskiego miasta-państwa Palenque w okresie późnoklasycznym prekolumbijskiej Mezoameryki. Wstąpił na tron w lipcu 615 roku i panował aż do śmierci. Jego rządy trwały 68 lat."
 lepsius.772.t: "Płytka pasa"
 lepsius.772.d: "Podczas wykopalisk na Jukatanie w nasze ręce trafił prekolumbijski artefakt o wyjątkowej wartości artystycznej i historycznej: Płytka pasa!"
 lepsius.772.f: "Płytka z Lejdy to cenny zabytek kultury Majów, wyrzeźbiony z jasnozielonego jadeitu i noszony jako zawieszka przy pasie. Odkryto ją w 1864 roku w pobliżu Puerto Barrios w Gwatemali. Jest jednym z najstarszych datowanych przedmiotów cywilizacji Majów. Obie strony płytki zdobią delikatne ryty. Awers przedstawia ukazanego z profilu majańskiego władcę, często utożsamianego z Siyaj Chan K'awiilem I z Tikal, depczącego związanego jeńca. Na rewersie widnieje data zapisana w systemie Długiej Rachuby (8.14.3.1.12), odpowiadająca wrześniowi 320 roku n.e. i upamiętniająca objęcie tronu przez władcę. Jako źródło do dziejów Majów z okresu wczesnoklasycznego płytka dostarcza bezcennych informacji o ówczesnej ikonografii królewskiej i piśmie. Jej nazwa pochodzi od miasta, w którym jest przechowywana. Obecnie znajduje się w zbiorach Narodowego Muzeum Etnologii w Lejdzie w Holandii."
 lepsius.721.t: "Epos o Gilgameszu"
 lepsius.721.d: "Na podstawie odnalezionych tabliczek z pismem klinowym nasi asyriolodzy zdołali odtworzyć zarys eposu o Gilgameszu."
 lepsius.721.f: "Gilgamesz powstał, by objaśnić swe sny,\n i zwrócił się do matki.\n „Matko moja! Tej nocy,\n pełen sił, błądziłem\n pośród znaków wróżebnych.\n I ukazały się gwiazdy na niebie,\n niczym ... z niebios spadł na mnie.\n Dźwigałem go, lecz był dla mnie zbyt ciężki.\n Niósł sieć, lecz ja nie zdołałem jej udźwignąć.\n Wezwałem cały kraj, by zgromadził się wokół niego,\n by bohaterowie mogli ucałować jego stopy.\n Stanął przede mną,\n a oni stanęli naprzeciw mnie.\n Podniosłem go i zaniosłem do ciebie”."
 lepsius.721.g: "Najstarszy epos w dziejach ludzkości..."
 lepsius.741.t: "Skarb Priama"
 lepsius.741.d: "Po przełomowym odkryciu Troi Heinrich Schliemann szuka odpowiedniego muzeum, któremu mógłby podarować Skarb Priama."
 lepsius.741.f: "Choć wykopaliska Schliemanna wstrząsnęły światem nauki i przyniosły mu popularność w całej Europie, spotykał się on z oporem specjalistów, zwłaszcza ze względu na stosowane metody badawcze. Wiele wątpliwości pozostawało nierozstrzygniętych. Historycy i archeolodzy kwestionowali na przykład, czy tak zwany Skarb Priama rzeczywiście pochodził z warstwy odpowiadającej Troi Homera. Kiedy Schliemann postanowił podarować znaleziska muzeum, również nie spotkał się z oczekiwanym odzewem — dawni mecenasi odnosili się do niego niechętnie. Odmówiły mu nawet tak słynne muzea jak Ermitaż i Luwr. Odkrywca wystawiał skarb tymczasowo w Londynie, aż w 1881 roku zdecydował się przekazać go „narodowi niemieckiemu na wieczyste posiadanie i przechowanie w stolicy Rzeszy”."
 lepsius.741.g: "...i znam idealne miejsce dla tego skarbu!"
 lepsius.743.t: "Schliemann przekazuje Skarb Priama"
 lepsius.743.d: "Po długim namyśle [SCOPE.sCharacter('lepsius_new_archaeologist_scope').GetFullName] postanowił powierzyć Skarb Priama naszemu muzeum!"
 lepsius.743.g: "Przeznaczymy dla niego osobną salę — i nazwiemy ją imieniem Schliemanna!"
 lepsius.743.h: "[SCOPE.sCharacter('lepsius_new_archaeologist_scope').GetLastName] to prawdziwy skarb!"
 lepsius.744.t: "Schliemann przekazuje Skarb Priama muzeum"
 lepsius.744.d: "Dotarła dziś do nas przykra wiadomość: Heinrich Schliemann przekazał Skarb Priama jednemu z muzeów. Niestety, nie naszemu."
 lepsius.744.g: "Jak mógł nas tak zdradzić?"
 lepsius.801.t: "Stanowisko wykopaliskowe"
 lepsius.801.d: "Na które stanowisko wykopaliskowe powinniśmy wysłać naszego archeologa?"
 lepsius.801.f: "Kiedy pan Coffeecake zorientował się, że imponująco autentyczna mapa skarbów pochodziła w rzeczywistości z automatu z gumami do żucia, musiał zmienić plany swojej archeologicznej podróży w sposób, jakiego świat jeszcze nie widział."
 lepsius.801.g: "Górny Egipt."
 lepsius.801.h: "Dolny Egipt."
 lepsius.801.i: "Babilonia."
 lepsius.801.j: "Asyria."
 lepsius.801.k: "Argolida."
 lepsius.801.l: "Jukatan."
 lepsius.801.m: "Nieważne."
 lepsius.802.t: "Archeolog"
 lepsius.802.d: "Którego archeologa powinniśmy wysłać, by założył nowe stanowisko wykopaliskowe?"
 lepsius.802.f: "Większość państw ma tylko jednego archeologa, który często pełni również funkcję głównego naukowca. Jeśli jednak z jakiegoś powodu państwo dysponuje większą liczbą doświadczonych archeologów, można tutaj wybrać inną osobę."
 lepsius.802.g: "[SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetFullName]"
 lepsius.802.h: "[SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetFullName]"
 lepsius.803.t: "Wyruszenie"
 lepsius.803.g: "Powodzenia!"
 lepsius.811.t_vok: "Grobowiec dostojnika"
 lepsius.811.t_pyr: "Kapliczka Bastet"
 lepsius.811.t_bab: "Sumeryjski grobowiec"
 lepsius.811.t_ass: "Asyryjska kapliczka"
 lepsius.811.t_arg: "Mykeńskie sanktuarium"
 lepsius.811.t_yuc: "Magazyn"
 lepsius.811.d: "Nasz archeolog założył przeciętne stanowisko wykopaliskowe."
 lepsius.811.f_pyr: "[SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetFullName] odkrył ruiny starożytnego egipskiego kompleksu świątynnego na bagnistym terenie delty Nilu w Dolnym Egipcie — przynajmniej tak się początkowo wydawało. Niestety, znalezisko okazało się znacznie skromniejsze: domniemana świątynia była raczej kapliczką poświęconą kociej bogini Bastet. Mimo to nasi badacze rozpoczęli wykopaliska — w końcu od czegoś trzeba zacząć."
 lepsius.811.f_bab: "Sumerowie stworzyli być może najstarszą cywilizację świata. Podczas pobytu w Babilonii [SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetFullName] przypadkiem odkrył grobowiec tego starożytnego ludu, któremu przypisuje się wynalezienie koła i pisma. Niestety, wkrótce okazało się, że większość artefaktów została skradziona lub zniszczona. Archeolodzy przystąpili do pracy."
 lepsius.811.f_arg: ""
 lepsius.811.f_yuc: "Niestety, nasz zespół wykopaliskowy na Jukatanie nie odniósł większych sukcesów w poszukiwaniu pozostałości kultury Majów. W bocznej dolinie archeolodzy odkryli dawny magazyn, w którym dotąd znaleziono jedynie potłuczoną ceramikę. W telegramie [SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetFullName] zapewnił jednak, że w przyszłości można spodziewać się kolejnych znalezisk."
 lepsius.811.g: "Miejsce przeciętne, ale nasze..."
 lepsius.812.t_vok: "Grobowiec księcia"
 lepsius.812.t_pyr: "Świątynia Ra"
 lepsius.812.t_bab: "Ziggurat Księżyca"
 lepsius.812.t_ass: "Asyryjska twierdza"
 lepsius.812.t_arg: "Grobowiec komorowy"
 lepsius.812.t_yuc: "Grobowiec komorowy"
 lepsius.812.d: "Nasz archeolog założył dobre stanowisko wykopaliskowe."
 lepsius.812.f_vok: "Dobre wieści z Egiptu! Po wielu trudach [SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetFullName] odkrył nieznany dotąd grobowiec. Według wstępnych ustaleń spoczywa w nim starożytny egipski książę. Choć brakuje części artefaktów, które miejscowi mogli niegdyś wykraść i sprzedać, znalezisko stanowi dobrą podstawę do dalszych wykopalisk archeologicznych."
 lepsius.812.f_pyr: "Pod bezchmurnym egipskim niebem na szczycie widocznego na horyzoncie obelisku połyskują ostatnie resztki elektrum, wskazując wejście do świątyni boga słońca Ra! [SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetFullName] natychmiast zabezpieczył teren i rozpoczął wykopaliska."
 lepsius.812.f_ass: "Biblia do dziś kształtuje dość negatywny obraz Asyryjczyków wśród Żydów i chrześcijan. Ten wojowniczy lud, znany z wielokrotnych najazdów na Izraelitów i ostatecznego zniszczenia ich północnego królestwa, zapisał się w historii jako wielka potęga militarna. Choć nie wszystkie zarzuty tej nieprzychylnej propagandy są prawdziwe, odkrycie asyryjskiej twierdzy pokazało, że dawni władcy Bliskiego Wschodu mieli imponującą kulturę wojskową."
 lepsius.812.f_arg: "[SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetFullName] odkrył niedawno mykeński grobowiec komorowy. Ten typ architektury grobowej był stosowany w późnej epoce brązu na terenach pozostających pod wpływem kultury egejskiej. Grobowce wykuwano w skale i dzielono na trzy części: komorę grobową, wejście zwane stomionem oraz prowadzący do niego korytarz — dromos. Często miały też dodatkowe nisze i boczne komory, w których składano zmarłych lub ich przeniesione szczątki. Dyrektor naszego muzeum już chłodzi butelkę szampana."
 lepsius.812.f_yuc: "Majowie żywo interesowali się astronomią. Najwyraźniej ich rozległa wiedza o zjawiskach niebieskich pod wieloma względami przewyższała wiedzę starożytnych Greków. [SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetFullName] odkrył w dżungli budowlę, w której górnej części znajdują się spiralne schody przypominające węża. Nasi badacze z niecierpliwością czekają na odkrycia i artefakty, jakie może przynieść to znalezisko."
 lepsius.812.g: "Doskonałe miejsce na wykopaliska."
 lepsius.813.t_vok: "Grobowiec królowej"
 lepsius.813.t_pyr: "Niezbadana piramida"
 lepsius.813.t_bab: "Babilońska brama i mury"
 lepsius.813.t_ass: "Asyryjski pałac"
 lepsius.813.t_arg: "Mykeńska cytadela"
 lepsius.813.t_yuc: "Piramida Majów"
 lepsius.813.d: "Nasz archeolog założył znakomite stanowisko wykopaliskowe."
 lepsius.813.f_pyr: "Gdy dotarł dziś najnowszy telegram od kierownika wykopalisk [SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetFullName], nasi badacze początkowo nie mogli uwierzyć w jego treść: nasi archeolodzy odnaleźli na egipskiej pustyni nieznaną dotąd piramidę. Miejscowi wspominali już wprawdzie o tej całkowicie zasypanej piaskiem budowli, lecz nie zdołali znaleźć wejścia. Nasz kraj może poszczycić się licznymi znaleziskami z czasów Starego Państwa!"
 lepsius.813.f_arg: "Czy starożytne miasta naprawdę wznieśli półbogowie lub cyklopi? Nad greckimi wzgórzami góruje potężna mykeńska cytadela, a zaledwie tydzień po jej odkryciu nasz zespół donosi o kolejnych sukcesach. Zachwyca nie tylko architektura — również gliniane i złote znaleziska zapowiadają dalsze odkrycia. [SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetFullName] stwierdził nawet, że odnaleziono pierścień Menelaosa."
 lepsius.813.f_yuc: "Gdy po wielu godzinach deszcz ustał, pozostawiając jedynie delikatną mgłę spowijającą korony drzew dżungli, oczom uczestników wyprawy ukazał się wspaniały widok. Ponad drzewami niezliczone stopnie porośnięte gęstą roślinnością i oplecione lianami pięły się ku niebu. Potężna piramida schodkowa górowała nad dziką okolicą, zamieszkaną przez ptaki i tapiry. [SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetFullName] natychmiast zabezpieczył pierwsze znaleziska i wysłał je przesyłką ekspresową do muzeum."
 lepsius.813.g: "To miejsce jest idealne!"
 lepsius.190.t: "Zespół archeologiczny odwołany"
 lepsius.190.d: "Z którego stanowiska archeologicznego powinniśmy odwołać nasz zespół?"
 lepsius.190.f: "Ktoś musiał oczernić Henry’ego J., bo pewnego ranka, choć nic złego nie zrobił, odwołano go z wykopalisk."
 lepsius.190.g: "Górny Egipt"
 lepsius.190.h: "Dolny Egipt"
 lepsius.190.i: "Babilonia"
 lepsius.190.j: "Asyria"
 lepsius.190.k: "Argolida"
 lepsius.190.l: "Kreta"
 lepsius.190.m: "Jukatan"
 lepsius.190.n: "Peru"
 lepsius.190.o: "Kontynuujmy."
 lepsius.901.t: "Grobowiec Tutanchamona"
 lepsius.901.d: "To przełomowy dzień dla światowej nauki. Dokonaliśmy wielkiego odkrycia: [ROOT.GetCountry.GetAdjectiveNoFlag] archeolodzy odsłonili dziś grobowiec Tutanchamona!"
 lepsius.901.f: "Powoli — nieznośnie powoli, jak nam się zdawało, gdy patrzyliśmy — usuwano resztki gruzu zalegającego w dolnej części wejścia, aż wreszcie odsłoniło się ono przed nami w całości. Nadeszła decydująca chwila. Drżącymi rękami wybiłem niewielki otwór w lewym górnym rogu. Żelazny pręt, którym badałem przestrzeń za nim, sięgał jedynie w ciemną pustkę. Cokolwiek znajdowało się po drugiej stronie, nie było zasypane jak korytarz, który właśnie oczyściliśmy. Na wszelki wypadek sprawdziliśmy świecą, czy nie ma tam szkodliwych gazów. Następnie nieco poszerzyłem otwór, wsunąłem świecę do środka i zajrzałem. Początkowo nic nie widziałem — gorące powietrze uchodzące z komory wprawiało płomień w drżenie. Kiedy jednak moje oczy przywykły do światła, powoli, jak z mgły, zaczęły wyłaniać się szczegóły wnętrza: niezwykłe zwierzęta, posągi i złoto — wszędzie blask złota. Na chwilę oniemiałem ze zdumienia, choć stojącym obok musiała się ona wydawać wiecznością. Gdy mój towarzysz, nie mogąc dłużej znieść napięcia, zapytał z niepokojem: „Czy coś widzisz?”, zdołałem jedynie wydusić: „Tak, cudowne rzeczy”."
 lepsius.901.g: "Doprawdy, cudowne rzeczy."
 lepsius.902.d: "[SCOPE.sCountry('lepsius_tut_discoverer').GetName] dokonał wielkiego odkrycia: dziś odsłonięto grobowiec Tutanchamona!"
 lepsius.902.f: ""
 lepsius.902.g: "Oby dosięgła ich klątwa faraona."
 lepsius.911.t: "Statek Chufu"
 lepsius.911.d: "To przełomowy dzień dla światowej nauki. Dokonaliśmy wielkiego odkrycia: [ROOT.GetCountry.GetAdjectiveNoFlag] archeolodzy odsłonili dziś statek Cheopsa!"
 lepsius.911.f: "Odetchnął głęboko i zamknął oczy, by przyzwyczaić je do panującego w wykopie półmroku, po czym powoli je otworzył. Pewną ręką znów zaczął kuć. Pracował szybko, a kamienna osłona ustępowała i kruszyła się. Pogłębił otwór na tyle, by móc obrócić się głową w dół, i pracował teraz zaledwie kilka cali od własnej twarzy. Kuł bez ustanku. Czas przestał mieć znaczenie. Nie czuł zmęczenia ani nie zdawał sobie sprawy, że tkwi w niemal pionowej pozycji. Badał opór kamienia. Kuł dalej. Nagle, jakimś cudem, jego dłonie przebiły się w pustkę. Znieruchomiał jak w transie. Zamknął oczy. Do jego nozdrzy dotarł ledwie wyczuwalny zapach. Nie potrafił go rozpoznać. Był niemal słodki. To nie mogło być kadzidło. A może jednak? Czyżby tak pachniała sama historia? Wtedy zrozumiał. Drewno cedrowe! Wciąż nie otwierał oczu. Wciągnął głęboko powietrze i upewnił się, że to rzeczywiście cedr. Ogarnęło go poczucie spełnienia, jakiego nigdy wcześniej nie zaznał. Cały drżał ze szczęścia. Nadal z zamkniętymi oczami wyszeptał modlitwę dziękczynną. Po chwili jego dociekliwy umysł znów podjął pracę. Nawet jeśli zapach pochodził od cedrowego drewna znajdującej się niżej barki solarnej, nie oznaczało to przecież, że termity próżnowały. Może hordy tych owadów doszczętnie przeżarły cenne drewno. „To łódź!” — zawołał. „To łódź!”"
 lepsius.911.g: "Po ponad 4000 lat naprawdę nadal może pływać?"
 lepsius.912.d: "[SCOPE.sCountry('lepsius_ship_discoverer').GetName] dokonało wielkiego odkrycia: dziś odsłonięto komorę ze statkiem Cheopsa!"
 lepsius.912.f: ""
 lepsius.912.g: "Z pewnością ważny nabytek dla ich nowej floty."
 lepsius.921.t: "Wieża Babel"
 lepsius.921.d: "To przełomowy dzień dla światowej nauki. Dokonaliśmy wielkiego odkrycia: [ROOT.GetCountry.GetAdjectiveNoFlag] archeolodzy odsłonili dziś Wieżę Babel!"
 lepsius.921.f: "Za tym grzbietem rozciąga się dość rozległa i zadziwiająco równa równina, sięgająca wzgórza Amran Ibn Ali. Przecina ją ukośnie droga z naszej wioski Kweiresh do Hilli. Miejsce to nazywa się „Sachn”, co dosłownie oznacza patelnię, lecz we współczesnym języku określa otwartą przestrzeń otoczoną arkadami wokół wielkich meczetów pielgrzymkowych, takich jak te w Karbali czy Nadżafie. Nasz „Sachn” to jednak nic innego jak dzisiejsza pozostałość starożytnego świętego okręgu, w którym wznosił się ziggurat Etemenanki — „Kamień Węgielny Nieba i Ziemi”, wieża Babel. Otaczał go mur obwodowy, do którego przylegały rozmaite budowle związane z kultem. Nie znamy pełnej wysokości wieży. Zarówno Nabopolassar, jak i Nabuchodonozor podkreślają jednak jej ogrom w swoich inskrypcjach na cylindrach z Etemenanki. Pierwszy z nich oznajmia: „W owym czasie Marduk nakazał mi... wieżę Babilonu, która za dni moich poprzedników podupadła i legła w ruinie, posadowić mocno na piersi podziemnego świata, a jej wierzchołek wznieść ku niebu”."
 lepsius.921.g: "A więc Biblia jednak się nie myliła."
 lepsius.922.d: "[SCOPE.sCountry('lepsius_babylon_discoverer').GetName] dokonało wielkiego odkrycia: dziś odsłonięto Wieżę Babel!"
 lepsius.922.f: ""
 lepsius.922.g: "Oby teraz pomieszały im się języki, tak jak budowniczym wieży."
 lepsius.931.t: "Ogrody Sennacheryba"
 lepsius.931.d: "To przełomowy dzień dla światowej nauki. Dokonaliśmy wielkiego odkrycia: [ROOT.GetCountry.GetAdjectiveNoFlag] archeolodzy odsłonili dziś Wiszące Ogrody!"
 lepsius.931.f: "Czy Wiszące Ogrody rzeczywiście znajdowały się w Babilonie? Najnowsze odkrycie dowodzi, że nie. Porównując przekazy historyczne, nasi najzdolniejsi archeolodzy ustalili, że bardzo niewiele źródeł umieszcza legendarne ogrody w Babilonie. Co więcej, z zaawansowanych technik ogrodniczych słynęli Asyryjczycy, a nie Babilończycy. Płaskorzeźby ukazują rozległe ogrody rozmieszczone na kilku poziomach. Zainspirowany tym zespół archeologów przeprowadził wykopaliska sondażowe w słabo zbadanej części wielkiego pałacu asyryjskiego króla Sennacheryba. Wyniki nie pozostawiają wątpliwości: zaginiony cud świata znajdował się w Niniwie. Nasi archeolodzy mogą więc poszczycić się nie tylko odkryciem, lecz także rozwiązaniem zagadki sprzed dwóch i pół tysiąca lat."
 lepsius.931.g: "Czyli tak naprawdę były to Wiszące Ogrody Niniwy?"
 lepsius.932.d: "[SCOPE.sCountry('lepsius_semiramis_discoverer').GetName] has made a great discovery: the Hanging Gardens were uncovered today!"
 lepsius.932.f: ""
 lepsius.932.g: "There is almost certainly a mix-up here."
 lepsius.941.t: "Treasures of Mycenae"
 lepsius.941.d: "It is a sensational day for international science. We have made a great discovery: the Treasures of Mycenae were uncovered today by [ROOT.GetCountry.GetAdjectiveNoFlag] archaeologists!"
 lepsius.941.f: "By far the most important and worthwhile excavation was the one directly behind the Lion's Gate. During his test excavations in 1874, Schliemann had already established that the rock at the lowest point of the castle was covered deepest with rubble. According to the words of Pausanias, he considered it likely that the graves of the ruling family were within the castle wall and had to remember the words when, soon after the start of the work, three tombstones with ancient reliefs were found at a depth of 3 to 5 meters. When the stones were removed, says Schliemann, it turned out that they were not standing on the ground, as previously assumed, but on earth that filled the shafts that had been driven vertically into the rock to make the graves. They dug into five such shafts, and after layers of stone had been removed at a certain depth, which had served as altars after the burial of the dead victims, the ax struck the ground about 6 meters deep. On the bottom lay fifteen corpses spread out in the five graves, adorned with rich, one might say fabulous, gold jewellery. Golden masks, imitating the features of the deceased, lay over the faces of the men, golden plates, richly decorated with spirals, covered their breasts, the robes of the women were laden with gold."
 lepsius.941.g: "Agamemnon, is that you?"
 lepsius.942.d: "[SCOPE.sCountry('lepsius_mycenae_discoverer').GetName] has made a great discovery: the Treasures of Mycenae were uncovered today!"
 lepsius.942.f: ""
 lepsius.942.g: "In case of doubt, these scammers have hidden these 'treasures' there themselves."
 lepsius.961.t: "Legacy of Pakal"
 lepsius.961.d: "It is a sensational day for international science. We have made a great discovery: the Tomb and Burial Treasures of Pakal were uncovered today by [ROOT.GetCountry.GetAdjectiveNoFlag] archaeologists!"
 lepsius.961.f: "My first impression was a mosaic of green, red and white. Then it resolved itself into details - green jade ornaments, red painted teeth and bones, and fragments of a mask. I was gazing at the death face of him for whom all this stupendous work - the crypt, the sculpture, the stairway, the great pyramid with its crowning temple - had been built, the mortal remains of one of the greatest men of Palenque! This was a sarcophagus, the first ever found in a Maya pyramid!"
 lepsius.961.g: "The Tutankhamun Tomb of South America!"
 lepsius.962.d: "[SCOPE.sCountry('lepsius_pakal_discoverer').GetName] has made a great discovery: the Tomb and Burial Treasures of Pakal were uncovered today!"
 lepsius.962.f: ""
 lepsius.962.g: "The mask was pretty hideous anyway."
 lepsius_local_excavation_modifier: "Miejscowe Wykopaliska"
 lepsius_local_excavation_state_modifier: "Miejscowe Wykopaliska"
 lepsius_local_excavation_cost_modifier: "Local Excavation Cost"
 lepsius.1101.t: "Archaeological Congress: The Exodus"
 lepsius.1101.d: "Our nation has made all relevant preparations to hold the next Archaeological Congress. The focus will be on the role of the Bible in archeology and antiquity research. Invitations will be sent to all major archaeologists in the world. Professor [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] will chair the session."
 lepsius.1101.f: "As early as Roman times, the lack of sources about ancient Egypt meant that historical writings were based on secondary sources such as Herodotus. The development continued in the Middle Ages. The Bible offered clues and was viewed as a reputable source for Near Eastern history for a long time - also because there were simply no other traditions. With the deciphering of hieroglyphs and the beginning of modern Egyptology, both proponents and critics of the Bible attempted to present evidence that the biblical accounts were false or correct. With the beginning of exploration of ancient Babylonia, this trend increased even further. An example of the dispute over the historicity of the biblical stories was the Exodus - the departure of the people of Israel from Egypt - for which there was no evidence in Egyptian sources."
 lepsius.1101.g: "The archaeological world should be our guest."
 lepsius.1102.d: "[SCOPE.sCountry('lepsius_congress_host_country').GetName] has invited us to an archaeological congress. The topic will be the historicity of the Bible using the example of the Exodus. Our archaeologist Professor [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] has received a warm invitation."
 lepsius.1102.g: "Always these arguments about who has the finest leather jackets..."
 lepsius.1103.t_laughed: "The Ridicule of the Archaeological Society"
 lepsius.1103.t_respected: "A confident Appearance"
 lepsius.1103.t_lauded: "Admiration and Congratulations"
 lepsius.1103.d_laughed: "Prof. [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName]'s appearance was greeted with amusement. [ROOT.GetCountry.GetNameNoFlag] does not exactly have a reputation for having achieved anything outstanding in the field of Egyptology. There were clearly jokes behind closed doors."
 lepsius.1103.d_respected: "Before the start of the Archaeological Congress, our archaeologist was warmly greeted and the usual customs were exchanged. [ROOT.GetCountry.GetNameNoFlag] has a recognized reputation in the research world."
 lepsius.1103.d_lauded: "The arrival of Professor [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] was greeted with great joy. He is considered one of the most awaited guests. A crowd quickly formed around him, as [ROOT.GetCountry.GetNameNoFlag] is considered a pioneer in the field of Egyptology."
 lepsius.1103.f_laughed: "'Why don't [ROOT.GetCountry.GetAdjectiveNoFlag] archaeologists get any girls?\n\nBecause they have the worst dating techniques!'"
 lepsius.1103.f_respected: "Upon his arrival, Professor [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] had a few pleasant conversations with colleagues about mostly boring ruins that a non-scientist would have dismissed as even more boring rock formations."
 lepsius.1103.f_lauded: "Prof. [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] seemed almost overwhelmed by the onslaught. So many colleagues sought to talk to him and wanted to benefit from his expeditions and his experiences. Some even urged him to give a private lecture."
 lepsius.1103.g: "How embarrassing!"
 lepsius.1103.h: "Finally among like-minded people."
 lepsius.1103.i: "We are a leading archaeological nation!"
 lepsius.1104.t: "The Exodus: Historical merit or invention?"
 lepsius.1104.d: "The topic-specific conference quickly developed into a question of principle. At first people only wanted to discuss the biblical exodus and the Egyptian sources, but it quickly turned into a debate about the value of the Bible in history and archaeology. Two scholarly camps are now irreconcilably opposed to each other."
 lepsius.1104.f: "[SCOPE.sCharacter('lepsius_bible_defender_scope').GetFullName] had actually wanted to give a lecture on the memory culture of the Israeli people and the status of the exodus when [SCOPE.sCharacter('lepsius_bible_attacker_scope').GetFullName] asked the provocative and justified question of whether such a statement was not just a waste of time - because ultimately it would have to be clarified whether the Bible could be considered as a source, since there was no archaeological tradition that speaks for the historicity of the Exodus. There was also no tradition in the texts that have now been translated. Therefore, in principle, they should ask the question whether the five books of Moses are actually made up stories and therefore useless. 'Archaeology is about fact, not about truth', he concluded. [SCOPE.sCharacter('lepsius_bible_defender_scope').GetFullName] responded to these accusations by saying that it should not be the case to understand the Bible texts as eyewitness reports, but rather as a secondary source about events that made up a piece of the puzzle of ancient memory culture. 'To reject the Bible completely is just as much nonsense as to accept every word of it as historical fact. It's more about asking the right questions', he said."
 lepsius.1104.g: "The Bible has some historical value as secondary source."
 lepsius.1104.h: "The Bible has no historical value at all."
 lepsius.1105.t: "Archaeologists among themselves"
 lepsius.1105.d: "Aside from the current Archaeological Congress, our archaeologist made friends with a foreign colleague and exchanged ideas."
 lepsius.1105.f: "The congress had been going on for days, and at first Professor [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] only had time to talk to a previously unknown colleague during breaks. The meeting was followed by a meal together, and the longer the scientists talked to each other, the more they learned about each other - and from each other. As it turns out, [SCOPE.sCharacter('lepsius_foreign_archaeologist_scope').GetFullName] is a person with a wealth of experience."
 lepsius.1105.g: "Another friend of archaeology!"
 lepsius.1106.t: "A Negotiator's Artifact"
 lepsius.1106.d: "The negotiator of an antiques owner attended the Archaeological Congress in [SCOPE.sCountry('lepsius_congress_host_country').GetName]. He tries to sell an artifact to an interested museum on behalf of a secret aristocrat. So far he hasn't found a customer."
 lepsius.1106.f: "Prof. [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] was able to convince himself of the authenticity of the artifact. However, given the high price, he is hesitant to buy and is waiting for a commitment from the capital before taking any action."
 lepsius.1106.g: "Expensive but valuable."
 lepsius.1106.h: "Not valuable enough."
 lepsius.1107.t: "Friendly Talk"
 lepsius.1107.d: "On the sidelines of the Archaeological Congress in [SCOPE.sCountry('lepsius_congress_host_country').GetName], our archaeologist presented [ROOT.GetCountry.GetNameNoFlag] in a very positive light in conversation with several colleagues."
 lepsius.1107.f: "It's unknown what exactly Professor [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] said, but apparently he struck a chord with the other archaeologists. They will surely spread this positive impression in their home country."
 lepsius.1107.g: "Let's improve our relationships."
 lepsius.1107.h: "Let's improve our reputation."
 lepsius.1108.t: "An Assistant"
 lepsius.1108.d: "An aspiring young man who wanted to gain entry to the Archaeological Congress but was prevented from doing so by the door guards attracts the attention of Professor [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName]."
 lepsius.1108.f: "Of course, the student was prevented from entering the hall with the select company of international archaeologists, but the persistence impressed [SCOPE.sCharacter('lepsius_archaeologist_scope').GetFullName] so much that he wanted to get to know the young man better. As it turned out, he had accumulated a wealth of knowledge for his age, both in ancient languages and in geography. After just a few hours, the professor decided to make him his assistant after the congress in the hope that he could soon enrich the academic world."
 lepsius.1108.g: "We expect an academic career."
 lepsius.1109.t_merit: "The Exodus: More than a Story"
 lepsius.1109.t_invention: "The Exodus: Fiction, not Fact"
 lepsius.1109.d_merit: "After many meetings, debates and arguments, the Archaeological Congress came to an end and a final declaration was drawn up. Accordingly, the Bible is not a primary historical source, but it still has historical value in some respects, even if this may not be directly applicable to Egypt and Babylon."
 lepsius.1109.d_invention: "After many meetings, debates and arguments, the Archaeological Congress came to an end and a final declaration was drawn up. Accordingly, the Bible has no value for archaeology or history. Rather, it is largely a series of inventions that are more of a hindrance than a help to the study of antiquity."
 lepsius.1109.f_merit: "A smaller group of archaeologists saw the declaration as a compromise, but others recognized it as a more nuanced approach to the past that went beyond absolute positions. Despite a direct reference to the Exodus, some archaeologists highlighted a recently discovered passage from Pharaoh Merenptah that mentioned devastation to the people of Israel. Another group pointed out that, according to the Bubastis portal translated by Champollion, Pharaoh Shishak actually sacked Jerusalem. These are all indications that it is less important to use the book literally, but to view it as a piece of the puzzle in researching older history. Wrong interpretations are unavoidable, but this applies to all areas of science."
 lepsius.1109.f_invention: "In the end, the group of skeptics was able to prevail with their maximum demand. From now on, the biblical stories should have no more value than, for example, the legends about the 7 Kings of Rome or the Greek mythical stories - the prominent position of the Bible had then come to an end in the Western world, at least in this area. The desperate references to coincidences between archaeological finds and biblical passages were recognized for what they were: coincidences. The question of what to do with the Bible was therefore merely the task of literature. Some archaeologists also mentioned the possibility that the Bible stories were at most copied from Egyptian stories or Babylonian myths. This would only be about the necessary investigation of the dependency. Otherwise, the case was closed for archaeology and history: the Bible was largely a collection of invented stories of no value to science."
 lepsius.1109.g: "You have to classify and interpret the texts correctly."
 lepsius.1109.h: "The Bible is a useless storybook."
 lepsius.1109.i: "We already knew this beforehand."
 lepsius.1111.t: "Archaeological Congress: The Rise of Civilization"
 lepsius.1111.d: "Our nation has made all relevant preparations to hold the next Archaeological Congress. The focus will be on the question of where civilization first emerged. According to the latest information, this is probably Babylonia. This further raises the question of the extent to which Babylonian culture influenced other cultures. Invitations will be sent to all major archaeologists in the world. Professor [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] will chair the session."
 lepsius.1111.f: "The knowledge that there had been a Babylonian civilization was never completely lost - even in the time of the Greeks there was information about Babylonians and Assyrians. However, the decoding of Akkadian revealed that there had been significantly older cultures such as the Sumerians, whose history eclipsed even the Egyptians in terms of age. A whole series of inventions typical of civilization shaped the everyday life of these ancient peoples, and many philologists and archaeologists soon suspected that Babylon was the actual cradle of civilization. The fascination with ancient Mesopotamia soon led to the fact that all areas of civilization were traced back to Babylon: not only the Bible, but also cultures of the Levant and Persia, even the Egyptians, were only mere 'cultural recipients' or 'cultural transmitters' of the original Babylonian culture. This scientific narrowness soon acquired a derisive name that its adherents used for themselves: Panbabylonism."
 lepsius.1111.g: "The archaeological world should be our guest."
 lepsius.1112.d: "[SCOPE.sCountry('lepsius_congress_host_country').GetName] has invited us to an archaeological congress. The focus will be on the question of where civilization first emerged. According to the latest information, this is probably Babylonia. This further raises the question of the extent to which Babylonian culture influenced other cultures. Our archaeologist Professor [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] has received a warm invitation."
 lepsius.1112.g: "Always these arguments about who has the finest leather jackets..."
 lepsius.1113.d_laughed: "Prof. [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName]'s appearance was greeted with amusement. [ROOT.GetCountry.GetNameNoFlag] does not exactly have a reputation for having achieved anything outstanding in the field of Assyriology. There were clearly jokes behind closed doors."
 lepsius.1113.d_respected: "Before the start of the Archaeological Congress, our archaeologist was warmly greeted and the usual customs were exchanged. [ROOT.GetCountry.GetNameNoFlag] has a recognized reputation in the research world."
 lepsius.1113.d_lauded: "The arrival of Professor [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] was greeted with great joy. He is considered one of the most awaited guests. A crowd quickly formed around him, as [ROOT.GetCountry.GetNameNoFlag] is considered a pioneer in the field of Assyriology."
 lepsius.1114.t: "Babylon: The Cradle of Civilization?"
 lepsius.1114.d: "During the course of the congress, the question of the origin of civilization increasingly developed into the question of whether and to what extent Babylon influenced all cultures of the Middle East and the Eastern Mediterranean. Some assume that almost every idea that later played a role was conceived in ancient Babylon!"
 lepsius.1114.f: "Professor [SCOPE.sCharacter('lepsius_babylon_defender_scope').GetLastName] opened with a very interesting contribution about the cultural achievements and the high level of Babylonian knowledge more than 4,000 years ago: 'The Sumerian-Babylonian cultural world presupposes a world theory according to which all state and social organizations were regulated. All sciences and arts go back to a primordial wisdom revealed by heaven, according to which property is managed and protected. Panbabylonism aims to provide evidence that this astral worldview left its mark on all cultures and religions in the world.' But this view provoked strong opposition from numerous academics, whose spokesman soon emerged as [SCOPE.sCharacter('lepsius_babylon_attacker_scope').GetFullName]. He rejected the idea that all myths were derived from the Babylonians. 'What [SCOPE.sCharacter('lepsius_babylon_defender_scope').GetLastName] said were more constructions than facts. The idea that there could be no parallel developments is far-fetched - the Egyptian hieroglyphs, for example, were not inspired by cuneiform.' And while the Panbabylonists tried to create a priority that relegated Mesopotamia to the center and all other mythology to the periphery, they completely overlooked the fact that cultures can live on a common spectrum."
 lepsius.1114.g: "Babylon is the Cradle of Civilization."
 lepsius.1114.h: "Civilization arose in several places."
 lepsius.1119.t_panbabylonism: "Rise of Civilization: Panbabylonism triumphs"
 lepsius.1119.t_antipanbabylonism: "Rise of Civilization: Panbabylonism refuted"
 lepsius.1119.d_panbabylonism: "After a passionate debate that resulted in rifts between numerous academics, the congress was able to agree on a final declaration. Accordingly, Mesopotamia is not only the cradle of civilization, but also the starting point of all mythological ideas of the Middle East."
 lepsius.1119.d_antipanbabylonism: "The battles are over, and after some heated verbal arguments, the scholars were able to pull themselves together and sign a final declaration that sealed the final defeat of the Pan-Babylonian camp. True, Mesopotamia was recognized as one of the most important cradles of civilization; but not the only one. The attempt to trace every mythology back to the Babylonians was nipped in the bud."
 lepsius.1119.f_panbabylonism: "The final declaration confirmed all the theories put forward by the Pan-Babylonian followers: the dependence of the mythology and literature of the Orient on Babylonian culture was evident. Both the Bible and the Egyptian myths are obviously dependent on well-known Babylonian ideas, such as those found in the Epic of Gilgamesh. In the final analysis, the entire development of the Middle East was culturally strongly influenced by the astronomy and astrology of this original culture, whose ideas were sometimes more, sometimes less obvious."
 lepsius.1119.f_antipanbabylonism: "The supporters of Panbabylonism recently found themselves in the minority. Academics did recognize that many of the achievements of the Mesopotamian cultures were part of the core of the intellectual substructure of the Middle East. However, the scientists rejected the claim to absoluteness, even the claim to an 'original culture', in the final declaration. Astronomical research, which was considered the starting point of Babylonian thinking, was exposed as a later development that had been wrongly placed at the beginning. The academics were also unable to recognize a priority of the Babylonian tradition: rather, it turned out that the various 'Babylonian' stories were in fact a common heritage of traditions in the region that the Babylonians actually wrote down first. One sentence stands out as particularly bitter, summarily declaring Panbabylonism to be pseudoscience: 'This mystical wisdom has no more scientific significance than the 'original revelation' of all the dimensions of the world in the great pyramid, which unfortunately still finds adepts.'"
 lepsius.1119.g: "Everything started in Mesopotamia."
 lepsius.1119.h: "There is not just one origin alone."
 lepsius.1121.t: "Archaeological Congress: The Status of Troy"
 lepsius.1121.d: "Our nation has made all relevant preparations to hold the next Archaeological Congress. The conference is intended to finally resolve the Troy question. Despite Heinrich Schliemann's spectacular excavations, the question is entirely justified as to what Heinrich Schliemann actually found, whether it was really Troy and whether Troy even existed in this form. Invitations will be sent to all major archaeologists in the world. Professor [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] will chair the session."
 lepsius.1121.f: "After Schliemann announced the discovery of Troy, it took some time for more skeptical minds to overcome their state of shock. Later inspections revealed not only that Schliemann had dug in the wrong layer, but also that the alleged 'Priam's Treasure' he found was much older than Homeric Troy. A rumor soon spread that Schliemann might have excavated the wrong city. Others insisted that nothing could be dug up that didn't exist. Still others defended Schliemann's discovery and saw that the proof had been provided, as Schliemann had based himself on ancient descriptions. Roman finds also proved that the Greeks and Romans also considered this place to be the site of the Trojan War. The discovery of Troy did not end the scholarly dispute, but only marked a new phase."
 lepsius.1121.g: "The archaeological world should be our guest."
 lepsius.1122.d: "[SCOPE.sCountry('lepsius_congress_host_country').GetName] has invited us to an archaeological congress. The conference is intended to finally resolve the Troy question. Despite Heinrich Schliemann's spectacular excavations, the question is entirely justified as to what Heinrich Schliemann actually found, whether it was really Troy and whether Troy even existed in this form. Our archaeologist Professor [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] has received a warm invitation."
 lepsius.1122.g: "Always these arguments about who has the finest leather jackets..."
 lepsius.1123.d_laughed: "Prof. [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName]'s appearance was greeted with amusement. [ROOT.GetCountry.GetNameNoFlag] does not exactly have a reputation for having achieved anything outstanding in the field of Aegean Archaeology. There were clearly jokes behind closed doors."
 lepsius.1123.d_respected: "Before the start of the Archaeological Congress, our archaeologist was warmly greeted and the usual customs were exchanged. [ROOT.GetCountry.GetNameNoFlag] has a recognized reputation in the research world."
 lepsius.1123.d_lauded: "The arrival of Professor [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] was greeted with great joy. He is considered one of the most awaited guests. A crowd quickly formed around him, as [ROOT.GetCountry.GetNameNoFlag] is considered a pioneer in the field of Aegean Archaeology."
 lepsius.1124.t: "Troy: Just a Myth?"
 lepsius.1124.d: "The debate over the status of Troy is even more controversial than expected. Not just two, but three camps have emerged. The first group consists of passionate Schliemann supporters who are completely convinced that all of the theses he put forward are correct. This is opposed by an irreconcilable opposing camp that sees only very meager evidence that Homeric Troy has anything to do with Schliemann's excavation site. A third group believes that Schliemann made serious mistakes, but that this was in fact the city he was looking for."
 lepsius.1124.f: "'If Schliemann didn't find Troy, then what did he find? He finds a place that matches the descriptions of the Iliad and the ancient authors. He finds a structure that fits this time. And we find a structure that appears to have been destroyed by enemies. How much more evidence is needed?' Prof. [SCOPE.sCharacter('lepsius_troy_defender_scope').GetLastName] began his lecture, but was then interrupted by many questions from his colleague [SCOPE.sCharacter('lepsius_troy_attacker_scope').GetLastName]. For example, the ancient Greeks no longer knew where Troy was located in the classical period and had already misidentified this place with Troy. That the name of the city is unknown and there is no clue as to how it was related to the Greek world. And that there have never been any reliable historical sources on a Trojan War in any form that resemble Homer's descriptions. Then, Mr. [SCOPE.sCharacter('lepsius_troy_mediator_scope').GetLastName] intervened: 'Dear colleagues, Schliemann has certainly made mistakes - but do we want to lose sight of the big picture?'"
 lepsius.1124.g: "Schliemann did find Troy."
 lepsius.1124.h: "Schliemann did find 'Troy', but the matter is more complicated."
 lepsius.1124.i: "There is no real evidence that this is really Troy."
 lepsius.1129.t_homeric: "Troy: History, not Myth"
 lepsius.1129.t_historical: "Troy: History and Myth"
 lepsius.1129.t_myth: "Troy: Myth, not History"
 lepsius.1129.t_disputed: "Troy: An unsolved Mystery"
 lepsius.1129.d_homeric: "After strenuous debates and many lectures, the camp of Schliemann's supporters, who recognized the Homeric Ilion in the hill of Hisarlik, was able to prevail. Not only the historicity of Troy, but also the Trojan War and other elements of the Homeric epics are recognized as historical reality."
 lepsius.1129.d_historical: "The archaeologists gathered at the congress in [SCOPE.sCountry('lepsius_congress_host_country').GetName] came to the conclusion that at least parts of the Homeric tradition contain a kernel of truth. Even if Schliemann was mistaken in the excavation, there is some evidence to suggest that Hisarlik corresponds to the place that is generally recognized as Troy in literature and historiography - the rest is a matter of clarifying details."
 lepsius.1129.d_myth: "The Congress came to the conclusion that the Troy debate, after centuries, has come to an end: the supposed discovery of Troy has strengthened the critics, who even more strongly suspect that the Homeric epics are pure fiction. Whatever Schliemann unearthed, it cannot be Troy because it never existed."
 lepsius.1129.d_disputed: "The trench warfare between scholars has recently led to great disillusionment and apathy. There is no solution in sight to the Troy question - they could not even agree on a joint final declaration. Some representatives left early, others sat out their time with further pointless discussions."
 lepsius.1129.f_homeric: "The Schliemann supporters are celebrating a great triumph today: they enthusiastically sent a telegram to the discoverer of Troy that all of his theses would be confirmed and he would even be made an honorary member of the society. He definitely excavated Troy and thus provided evidence that the Trojan War of the Homeric epics was not an invention, not a vague memory, but a historical event. Now it is even more important to search the Aegean region for further artifacts that could provide even more information about the age that was once disguised as 'mythical'. The enthusiasm of the researchers should ensure that more intensive excavations will soon take place to support Schliemann's theses: perhaps the house of Odysseus, the grave of Achilles or the bathtub in which Agamemnon was killed will soon be found? It is surprising that Schliemann has not yet responded to the telegram..."
 lepsius.1129.f_historical: "After long discussions and a lot of persuasion, it was possible to achieve a compromise among most congress members. The vast majority of the international archaeological assembly is of the opinion that Schliemann made serious errors in the excavation of Troy - among other things, it is clear that he searched in the wrong layer of excavations. However, this simply means that Schliemann found the 'wrong' Troy in the 'right' place. Another layer may actually contain the city that dates back to the time of the Trojan War. The archaeologists were ultimately unable to determine whether this was a real historical event; The fact is that the hill on which Troy is located fell victim to fires and wars several times. As far as the identity of the city is concerned, the thesis of a Hittite influence is confirmed. The scientists have announced that they will use these results as an opportunity for more intensive research and will continue to intensively discuss the Troy question."
 lepsius.1129.f_myth: "After serious arguments, the archaeologists and historians - some only with a lot of grumbling in their stomachs - were able to bring themselves to sign a joint declaration. Accordingly, they only see the Homeric epics as literary products that possibly refer to older events, which, however, are difficult to reconstruct for modern archaeology. Rather, it could be that the Trojan War is considered a 'war as such' in which the overall human experience was reflected. Troy might therefore have about as much historical content as Atlantis: a kind of utopia, a literary place where ideas are fought out. In principle, the congress declared Troy research to be an activity 'on the fringes of pseudoscience' that was both pointless and purposeless. Archeology should move on to more worthwhile fields."
 lepsius.1129.f_disputed: "'Well, at least the food was good!'"
 lepsius.1129.g: "So Schliemann actually found Troy!"
 lepsius.1129.h: "Schliemann dug up the wrong Troy, but the location is correct."
 lepsius.1129.i: "Troy is most likely pure literature."
 lepsius.1129.j: "This entire congress was a complete waste of time!"
 lepsius.1201.t: "Local Excavation Site in [SCOPE.sState('lepsius_excavation_site').GetName]"
 lepsius.1201.d: "[SCOPE.sCharacter('lepsius_archaeologist_scope').GetFullName] has identified a new excavation site in [SCOPE.sState('lepsius_excavation_site').GetName]. He and his team started work immediately. However, it is not yet clear how long the excavation will be financed."
 lepsius.1201.f: "An excavation can be authorized for 5, 7 or 10 years. Unlike an excavation taking place abroad, this cannot be canceled at any time. The lead archaeologist will remain at the excavation site for 6, 12 or 18 months, depending on the term, until returning. He is not available during this time."
 lepsius.1201.g: "10 years."
 lepsius.1201.h: "7 years."
 lepsius.1201.i: "5 years."
 lepsius.1202.t: "Prof. [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] returns from Excavation Site"
 lepsius.1202.d: "[SCOPE.sCharacter('lepsius_archaeologist_scope').GetFullName] has been helping set up the archaeological excavation site in [SCOPE.sState('lepsius_excavation_site').GetName] over the last few months and has made some initial discoveries. He returns to his university for evaluation, while the team continues the excavation independently for the next few years until the funding runs out."
 lepsius.1202.f: "'In few kinds of work are the results so directly dependent on the personality of the worker as they are in excavating. The old saying that a man finds what he looks for in a subject, is too true; or if he has not enough insight to ensure finding what he looks for, it is at least sadly true that he does not find anything that he does not look for.' -Flinders Petrie"
 lepsius.1202.g: "Welcome back."
 lepsius.1203.t: "Local excavation completed"
 lepsius.1203.d: "The excavation team has completed the local excavation and stowed away some final finds. It is now available again for other excavations or expeditions."
 lepsius.1203.f: "'Dunkel sind des Schicksals Wege,\nungewiß der Zukunft Stern,\neh ich mich zu Bette lege,\ntrink ich einen Kognak gern.' -Robert Koldewey"
 lepsius.1203.g: "We should do another excavation soon."
 lepsius.2000.t: "[SCOPE.sCharacter('lepsius_new_archaeologist_scope').GetLastName] invents the Three-Age System"
 lepsius.2000.d: "The director of the National Museum of Denmark, [SCOPE.sCharacter('lepsius_new_archaeologist_scope').GetFullName], has invented a system to classify archaeological findingss in the three periods #b Stone Age#!, #b Bronze Age#! and #b Iron Age#!. This is revolutionary for Archaeology!"
 lepsius.2000.f: "\"You see, some artifacts are always appearing together and some materials never appear at the same excavation. Silver for example is only found where iron tools and weapons are found as well. Gold on the other hand can be found with both iron and bronze tools.\nIt is fascinating as well that some materials only appear in certain forms of graves. Stone tools can only be found with uncremated corpses and stone-chamber tombs. Iron is found in chamber tombs in barrows.\nAll of this allows us to date our findings way more precisely. First there were stone tools, then there were bronze tools and only afterwards there were iron tools.\""
 lepsius.2000.g: "Such a great mind needs to work for us!"
 lepsius.2000.h: "He can stay in his museum..."
