 lepsius.2301.t: "Edykt Filarowy Aśoki"
 lepsius.2301.d: "W regionie [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] odkrył nieznany dotąd filar cesarza Aśoki. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe|U] rozpoczął już odczytywanie inskrypcji."
 lepsius.2301.f: "Wielkie Edykty Filarowe to zbiór siedmiu inskrypcji sporządzonych na polecenie cesarza Aśoki z dynastii Maurjów (268–232 p.n.e.). Wyryte na potężnych, monolitycznych kolumnach z piaskowca, edykty te stanowią publiczną deklarację przywiązania cesarza do Dharmy (Dhammy) – kodeksu postępowania społeczno-etycznego, który przyjął po nawróceniu na buddyzm w następstwie wojny z Kalingą. Inskrypcje, zapisane głównie w języku prakryt magadhi przy użyciu pisma brahmi, przedstawiają reformy administracyjne i wytyczne moralne. Do ich głównych tematów należą tolerancja religijna, niestosowanie przemocy (ahimsa) oraz dobrobyt społeczny, obejmujący między innymi zapewnianie opieki medycznej i kopanie studni. Rozmieszczone strategicznie na całym subkontynencie indyjskim filary te służyły jako trwałe symbole władzy cesarskiej i duchowej przemiany, pozostając do dziś niezwykle ważnymi źródłami pierwotnymi do badań nad historią starożytnych Indii."
 lepsius.2301.g: "Aśoka był wielkim mężem stanu."
 lepsius.2302.t: "Monety Maurjów"
 lepsius.2302.d: "Po kilku targach i łapówce sfinansowanej przez państwo Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] zdołał nabyć od handlarza antykami całą kolekcję monet z czasów Imperium Maurjów."
 lepsius.2302.f: "Imperium Maurjów stworzyło jeden z najbardziej zaawansowanych systemów monetarnych w starożytnej Azji Południowej. Za bicie monet odpowiadał urzędnik nadzorujący mennicę (Lakshanadhyaksha), działający pod scentralizowaną kontrolą państwa, o czym wspomina traktat Arthashastra autorstwa Kautilji. Podstawową walutą były monety stemplowe, a w szczególności srebrne karshapany. Monety te miały zazwyczaj nieregularny kształt, ale ich waga była ściśle ustandaryzowana. W przeciwieństwie do późniejszych monet w stylu hellenistycznym nie umieszczano na nich napisów ani portretów. Zamiast tego wybijano na nich symboliczne znaki, przede wszystkim słońce, sześcioramienne koło oraz różne zwierzęta i drzewa."
 lepsius.2302.g: "Srebrnych kwadratowych monet nigdy za wiele."
 lepsius.2303.t: "Stupa Maurjów"
 lepsius.2303.d: "Archeolodzy odkryli w regionie [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] starożytną stupę pochodzącą z czasów Imperium Maurjów. Wiadomo, że cesarz Aśoka był wielkim mecenasem buddyzmu."
 lepsius.2303.f: "W czasach Imperium Maurjów, szczególnie za panowania cesarza Aśoki, buddyzm stał się religią wspieraną przez państwo. Mecenat Aśoki odegrał kluczową rolę w upowszechnieniu stup, półkulistych budowli relikwiarzowych przeznaczonych do przechowywania świętych szczątków Buddy lub jego uczniów. Tradycja przypisuje Aśoce wzniesienie 84,000 stup na całym subkontynencie, a najsłynniejszym przykładem jest pierwotna część Wielkiej Stupy w Sańći. Budowle te stanowiły ośrodki kultu i medytacji, symbolizując parinirwanę Buddy. Królewskie wsparcie w tej epoce nie tylko umocniło społeczny i etyczny wpływ buddyzmu w Indiach, lecz także ułatwiło działalność misyjną na Sri Lance i w Azji Środkowej, nadając mu rangę jednej z głównych religii świata."
 lepsius.2303.g: "Czasy, gdy buddyzm był główną religią Indii..."
 lepsius.2304.t: "Rzeźby Jakszów"
 lepsius.2304.d: "Zespół prowadzący wykopaliska odkrył dwie rzeźby z okresu Imperium Maurjów. Przedstawiają one Jakszów, którzy często pełnią funkcję strażników skarbów, drzew lub miejsc."
 lepsius.2304.f: "Jakszowie, pierwotnie pradawne duchy natury związane z płodnością i bogactwem, zostali harmonijnie włączeni do wczesnej ikonografii buddyjskiej, dźinijskiej i hinduistycznej. Posągi Jakszów z epoki Maurjów słyną z olbrzymich rozmiarów i charakterystycznego „poleru mauryjskiego”, nadającego piaskowcowi z Chunar lustrzaną powierzchnię."
 lepsius.2304.g: "Dwie kolejne rzeźby do muzeum."
 lepsius.2305.t: "Lwia Głowica Aśoki"
 lepsius.2305.d: "Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] dokonał sensacyjnego odkrycia! [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe|U] znał już kilka kolumn Aśoki ze wspaniałymi lwimi zwieńczeniami, lecz najnowszy okaz zachwyca tak zapierającym dech w piersiach pięknem, że znawcy już nazywają go jednym z najwspanialszych dzieł rzeźbiarskich subkontynentu."
 lepsius.2305.f: "Lwia Głowica Aśoki to arcydzieło rzeźby z epoki Maurjów, wykonane na zlecenie cesarza Aśoki około 250 roku p.n.e. w Sarnath, aby upamiętnić miejsce pierwszego kazania Buddy. Wyrzeźbiona z jednego bloku polerowanego piaskowca z Chunar głowica przedstawia cztery majestatyczne lwy azjatyckie stojące tyłem do siebie, symbolizujące zarówno władzę cesarską, jak i szerzenie Dhammy na całym świecie. Poniżej znajduje się abakus ozdobiony wypukłymi reliefami byka, konia, słonia i lwa, rozdzielonymi czterema kołami zwanymi dharmaczakrami. Całość spoczywa na odwróconym kwiecie lotosu w kształcie dzwonu. Kunszt wykonania rzeźby przez stulecia wywierał wpływ na sztukę indyjską."
 lepsius.2305.g: "Te lwy świetnie prezentowałyby się w herbie."
 lepsius.2311.t: "Skalne Domostwo Pueblo"
 lepsius.2311.d: "W regionie [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] zespół archeologów odkrył nieznaną dotąd osadę Pueblo!"
 lepsius.2311.f: "Skalne domostwa Pueblo to wielokondygnacyjne budowle murowane, wznoszone w płytkich jaskiniach lub pod nawisami skalnymi na południowym zachodzie Stanów Zjednoczonych. Powstawały głównie w XII i XIII wieku i wyróżniają się kunsztownymi konstrukcjami kamiennymi, drewnianymi belkami nośnymi oraz zastosowaniem zaprawy wapiennej. Domostwa te obejmowały zazwyczaj pomieszczenia mieszkalne i spichlerze. Wśród zabytków zachowanych w tych suchych wnękach skalnych często znajdują się przedmioty z materiałów organicznych, takie jak tkaniny i sandały, które rzadko przetrwałyby na stanowiskach pod gołym niebem."
 lepsius.2311.g: "Odnaleziono kolejną zaginioną wioskę."
 lepsius.2312.t: "Pueblo Kiva"
 lepsius.2312.d: "Podczas wykopalisk w regionie [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] odkrył prekolumbijską kivę, która może poszerzyć obecną wiedzę o kulturze Pueblo."
 lepsius.2312.f: "Kiva to specjalnie przystosowane, często okrągłe pomieszczenie podziemne lub częściowo zagłębione w ziemi, wykorzystywane przez społeczności przodków ludów Pueblo do ceremonii religijnych i spotkań politycznych. Charakterystycznymi elementami kiv są murowane kamienne ściany, centralne palenisko, system wentylacyjny oraz sipapu, niewielki otwór w podłodze symbolizujący przejście, przez które przodkowie wyłonili się na świat. Do środka zazwyczaj schodzono po drabinie przez otwór w dachu, który służył również do odprowadzania dymu. Duże budowle tego typu, zwane Wielkimi Kivami, pełniły funkcję ośrodków wspólnotowych, w których odbywały się zgromadzenia ludności z całego regionu i wspólne obrzędy."
 lepsius.2312.g: "Musimy ją zbadać!"
 lepsius.2313.t: "Czarno-biała Ceramika Pueblo"
 lepsius.2313.d: "Kilka dni temu rolnicy z regionu [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] zgłosili odkrycie dawnej ceramiki, której najprawdopodobniej nie pozostawili po sobie osadnicy. Wykopaliska archeologiczne ujawniły kolejne znaleziska, przypisywane wczesnej kulturze Pueblo."
 lepsius.2313.f: "Wyrób czarno-białej ceramiki polega na pokryciu naczynia z szarej masy ceramicznej białą angobą, a następnie malowaniu zdobień czarnymi pigmentami mineralnymi lub organicznymi. Do typowych form naczyń należą garnki kuchenne o żłobkowanych ściankach, dzbany, misy i kubki. Zdobienia obejmują złożone motywy geometryczne, takie jak kreskowanie, zygzaki i przeplatające się spirale. Zmiany stylów zdobniczych oraz składu domieszek schudzających pozwalają archeologom ustalać dokładną chronologię i odtwarzać regionalne sieci handlowe."
 lepsius.2313.g: "Ostrożnie z ceramiką!"
 lepsius.2314.t: "Turkusowa Biżuteria Pueblo"
 lepsius.2314.d: "Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] odkrył dawne cmentarzysko Pueblo, wydobywając przy tym kilka wyrobów biżuteryjnych i ozdób wykonanych z turkusu."
 lepsius.2314.f: "Turkus miał duże znaczenie kulturowe i gospodarcze dla przodków ludów Pueblo, szczególnie w okresach Pueblo II i III. Ten kamień półszlachetny wydobywano z regionalnych złóż i obrabiano za pomocą piaskowcowych narzędzi ściernych, tworząc paciorki, wisiorki oraz kunsztowne mozaikowe inkrustacje. Archeolodzy odkryli tysiące turkusowych zabytków w głównych ośrodkach, takich jak kanion Chaco, często w grobach lub depozytach rytualnych. Ich obecność świadczy o rozwiniętych sieciach handlu dalekosiężnego, ponieważ turkus często wymieniano na egzotyczne dobra, takie jak pióra ar i ozdoby z muszli. Materiał ten był wyznacznikiem statusu społecznego i wykorzystywano go w praktykach religijnych."
 lepsius.2314.g: "Piękne artefakty do naszego muzeum!"
