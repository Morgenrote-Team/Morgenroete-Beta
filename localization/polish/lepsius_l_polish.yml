 building_lepsius_archaeological_museum: "Muzeum Archeologiczne"
 building_lepsius_archaeological_museum_desc: "Każdy szanujący się naród posiada w swojej stolicy wyjątkowe muzeum, w którym prezentuje wszystkie dobra kultury zdobyte dzięki śmiałym wyprawom lub najwyższej jakości ekspedycjom naukowym. Liczba artefaktów oraz liczba różnych kolekcji nie tylko zwiększają wartość prestiżu na świecie, ale także mają wartość edukacyjną."
