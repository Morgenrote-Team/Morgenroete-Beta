 lepsius.17.manco: "#E Mascapaicha Huayny Capaca#! jest najwspanialszym artefaktem pochodzącym z Imperium Inków.\n"
 lepsius_mascapaicha_knowledge_modifier: "Wiedza Starszyzny"
 je_lepsius_mascapaicha: "Odczytywanie Kipu"
 je_lepsius_mascapaicha_reason: "Badania nad kipu przyniosły dotychczas więcej pytań niż odpowiedzi. Jedno jest pewne: zawiera ono nazwy miejsc ułożone w określonej kolejności oraz liczby oznaczające poszczególne plemiona, których sekwencja wskazuje z kolei pewnego rodzaju trasę. Krótko mówiąc, kipu jest swego rodzaju mapą skarbów. Tylko doświadczony archeolog może w pełni rozwikłać tę tajemnicę. Nadal nie wiadomo, co Inkowie tak starannie ukryli. Aby to odnaleźć, powinniśmy zebrać niewielki, specjalny zespół, inny niż zwykła grupa wyprawowa. Oprócz archeologa i attaché będziemy potrzebować również pilota, który przetransportuje nas samolotem bezpośrednio w Andy."
 je_lepsius_mascapaicha_success: "Odczytano Kipu."
 lepsius_decode_quipu_button: "Odczytaj Kipu"
 lepsius_decode_quipu_button_desc: "Aby pomyślnie odczytać Kipu, potrzebny jest doświadczony lub sławny archeolog oraz dział wyspecjalizowany w badaniu artefaktów mezoamerykańskich."
 lepsius_decode_quipu_tt: "Kipu zostanie odczytane po pewnym czasie."
 lepsius_decode_quipu_done_tt: "Odczytaj Kipu."
 lepsius.474.t: "Tajemnicze Kipu"
 lepsius.474.d: "Peruwiański przewodnik zaprowadził członków wyprawy do sekretnego miejsca, o którym nie wiedziało nawet wielu miejscowych. W opuszczonej świątyni, do której nikt nie wchodził od co najmniej czterystu lat, znaleźli tajemniczy przedmiot."
 lepsius.474.f: "[SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] od razu wyczuwa, że to miejsce jest wyjątkowe. Świątynia ta wydaje się opuszczona jeszcze przed hiszpańskim podbojem. To nie najazd, lecz zapomnienie doprowadziło do upadku tej budowli. Na pierwszy rzut oka zachowało się rozczarowująco niewiele pozostałości, które mogłyby rzucić światło na życie Inków przed przybyciem Francisca Pizarra. Zespół zadowala się wykonywaniem rutynowych prac archeologicznych, gdy jeden z asystentów odkrywa niepokojący przedmiot na bloku przypominającym ołtarz. To kipu – wiązka sznurów z węzłami, za pomocą której Inkowie zapisywali liczby, statystyki i dane. Jest jednak tak skomplikowane, że trudno je odszyfrować na miejscu."
 lepsius.474.g: "Należy dokładniej zbadać je po powrocie do kraju."
 lepsius.571.t: "Tajemnica Kipu"
 lepsius.571.d: "Nawet uczeni w kraju mają trudności z odczytaniem Kipu przywiezionego przez ostatnią wyprawę do Peru. Naukowcy są już zgodni, że jest to coś więcej niż tylko zapis liczb."
 lepsius.571.f: "Po dokładniejszym zbadaniu kipu i porównaniu go z wcześniej poznanymi systemami węzłów naukowcy z kilku uniwersytetów oraz pracownicy Muzeum Archeologicznego doszli do wniosku, że węzły te tworzą znany już system zapisu. Początkowo nie miało to większego sensu, ponieważ zakładano, że jest to jedynie wykaz podatkowy lub spis ludności. W rzeczywistości okazało się jednak, że jest to zbiór miejsc. Ich nazwy były znane z innych zapisów kipu, lecz odnosiły się nie tyle do nazw geograficznych, ile do miejsc osiedlenia poszczególnych klanów. Najbardziej rozpowszechniona teoria głosi, że zapis ten stanowi swego rodzaju wskazówki dotyczące trasy. Nie wiadomo jednak, dokąd ona prowadzi."
 lepsius.571.g: "Ten sznur z węzłami... to mapa?"
 lepsius.572.t: "Wyprawa po Mascapaichę"
 lepsius.572.d: "[SCOPE.sCharacter('lepsius_archaeologist_scope').GetFullName] nie tylko uważa, że [SCOPE.sCharacter('lepsius_archaeologist_scope').GetSheHe] odkrył miejsce, do którego prowadzi zaszyfrowana mapa, lecz [SCOPE.sCharacter('lepsius_archaeologist_scope').GetSheHe] ma również teorię na temat tego, co może się tam znajdować. Wraz z [SCOPE.sCharacter('lepsius_pilot_scope').GetFullName] i [SCOPE.sCharacter('lepsius_archaeologist_attache').GetFullName] [SCOPE.sCharacter('lepsius_archaeologist_scope').GetSheHe] wyrusza na specjalną misję w najwyższe partie Andów."
 lepsius.572.f: "Wydobycie tajemnicy z kipu nie było łatwym zadaniem. Potwierdzono, że zawarte w nim zapisy miały charakter geograficzny i miały wskazywać drogę do pewnego miejsca – tak odległego, że dotarcie do niego wydawało się niemal niemożliwe. [SCOPE.sCharacter('lepsius_pilot_scope').GetLastName] ostrzegał, że nie należy pokładać zbyt wielkich nadziei w znalezieniu na tym niegościnnym terenie wystarczająco długiego pasa do lądowania. Jednak dokumentacja wojskowa wskazywała na istnienie dogodnego płaskowyżu, który nadawał się do tego celu i znajdował się niedaleko miejsca docelowego. Stamtąd pozostawało jedynie około 10 mil pieszej wędrówki. Podczas lotu do Peru prof. [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] przedstawił pozostałej dwójce [SCOPE.sCharacter('lepsius_archaeologist_scope').GetHerHis] teorię dotyczącą tego, co mogą tam odnaleźć. Budowla, w której znaleziono kipu, wskazywała, że powstało ono prawdopodobnie za panowania cesarza Huayny Capaca, zanim Imperium Inków pogrążyło się w wojnie domowej między Huascarem a Atahualpą. Profesor przypuszczał, że we wskazanym miejscu może znajdować się coś pochodzącego z czasów poprzedzających rozpad imperium i jego późniejszy upadek. Coś, co symbolizowało jedność i wielkość Imperium Inków i było tak cenne, że ukryto to przed Atahualpą, którego wielu uważało za nieprawowitego władcę, ponieważ dokonał zamachu stanu przeciwko swojemu bratu Huascarowi. Przedmiot, który jak żaden inny uosabiał potęgę Sapa Inki i uchodził za zaginiony: korona Huayny Capaca. Mascapaicha."
 lepsius.572.g: "To byłaby sensacja archeologiczna."
 lepsius.573.d: "[SCOPE.sCharacter('lepsius_pilot_scope').GetFullName] znajduje odpowiednie miejsce do lądowania w pobliżu celu wyprawy. Jednak w drodze do domniemanego miejsca ukrycia Mascapaichy cała trójka natrafia na niezwykłe znalezisko."
 lepsius.573.f: "Trzymając kipu w [SCOPE.sCharacter('lepsius_archaeologist_scope').GetHerHis] dłoni niczym mapę wskazującą drogę, [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] poprowadził niewielką grupę ku zboczu góry. Na zawrotnych wysokościach wykuto tam schody przypominające kliny. Cała trójka wspięła się na pierwsze kilka metrów, po czym natrafiła na zarośniętą ścieżkę. Krótkie oględziny wystarczyły archeologowi, by rozwiać wszelkie wątpliwości. Starannie ułożone kamienne bloki niewątpliwie pochodzą z czasów Inków. Podążyli Drogą Inków do doliny spowitej mgłą, niewidocznej z samolotu. Brnęli przez nią przez kolejne mile. Nagle [SCOPE.sCharacter('lepsius_pilot_scope').GetLastName] coś dostrzegł. Mimo mgły z zamglenia wyłaniał się błysk. To złoto. Czyste złoto. Ogromne ilości złota! Z mgły wyłaniał się gigantyczny posąg, wysoki niczym trzypiętrowy budynek. [SCOPE.sCharacter('lepsius_pilot_scope').GetLastName] zszedł ze ścieżki i ruszył w jego stronę. [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] chciał zawołać [SCOPE.sCharacter('lepsius_archaeologist_scope').GetHerHim], ostrzegając, że może to być pułapka. Takie rozproszenie uwagi mogło być niebezpieczne. [SCOPE.sCharacter('lepsius_attache_scope').GetLastName] nie potrafił jednak zdecydować, co robić."
 lepsius.573.g: "Trochę złota nie zaszkodzi."
 lepsius.573.h: "Tylko człowiek pokorny odnajdzie Mascapaichę."
 lepsius.574.d: "Trójka kontynuowała wędrówkę. Nagle jednak [SCOPE.sCharacter('lepsius_archaeologist_scope').GetFullName] dostrzega coś, co każe mu się zatrzymać. [SCOPE.sCharacter('lepsius_pilot_scope').GetFullName] i [SCOPE.sCharacter('lepsius_attache_scope').GetFullName] przeszli już kilka metrów, zanim zorientowali się, że profesor zniknął."
 lepsius.574.f: "To była inskrypcja. Inskrypcja? Źródła epigraficzne w Andach? W społeczeństwie, którego pismo węzełkowe nie pełniło funkcji alfabetu? Już samo to było niewiarygodnym odkryciem! Majowie posługiwali się hieroglifami, Aztekowie zapisywali swoje kodeksy piktogramami. Tutaj jednak znaki przypominały litery. Jak to możliwe? A jeszcze większe zdumienie ogarnęło [SCOPE.sCharacter('lepsius_archaoelogist_scope').GetLastName], gdy okazało się, że:\n[SCOPE.sCharacter('lepsius_archaeologist_scope').GetSheHe] potrafi je odczytać.\nBez wcześniejszej wiedzy. Bez żadnych studiów. Bez choćby najmniejszego pojęcia, jak to możliwe. Zupełnie jakby [SCOPE.sCharacter('lepsius_archaeologist_scope').GetSheHe] chłonął treść wyrytych znaków samym dotknięciem palca. [SCOPE.sCharacter('lepsius_archaeologist_scope').GetSheHe] wcale ich nie odczytuje. To Pismo przemawia do [SCOPE.sCharacter('lepsius_archaeologist_scope').GetHerHim]. A im dłużej [SCOPE.sCharacter('lepsius_archaeologist_scope').GetSheHe] zatraca [SCOPE.sCharacter('lepsius_archaeologist_scope').GetHerselfHimself] w lekturze, tym bardziej przytłaczająca staje się wiedza, którą [SCOPE.sCharacter('lepsius_archaeologist_scope').GetSheHe] poznaje. Bo tutaj zgromadzono wiedzę. Wiedzę sprzed setek i tysięcy lat, pochodzącą ze wszystkich kultur Ameryki Południowej i Środkowej. W całkowitym zachwycie nad tym wspaniałym odkryciem [SCOPE.sCharacter('lepsius_archaeologist_scope').GetSheHe] nie zauważa, jak attaché potrząsa [SCOPE.sCharacter('lepsius_archaeologist_scope').GetHerHim] i próbuje odciągnąć [SCOPE.sCharacter('lepsius_archaeologist_scope').GetHerHim] od inskrypcji — pilot stoi obok niezdecydowany, spoglądając na absurdalną scenę rozgrywającą się na oczach [SCOPE.sCharacter('lepsius_pilot_scope').GetHerHim]."
 lepsius.574.g: "Wiedza nie jest grzechem."
 lepsius.575.d: "Grupa dociera do budowli przypominającej świątynię, w której niegdyś znaleziono tajemnicze Kipu. Do środka prowadzi ich [SCOPE.sCharacter('lepsius_archaeologist_scope').GetFullName], uważnie badając otoczenie. Ścianę przed nimi pokrywa przerażający wizerunek demona."
 lepsius.575.f: "Wieczna mgła spowijająca nieznaną dolinę wypełniała również świątynię. Otulała ściany i posągi niczym delikatna szata. [SCOPE.sCharacter('lepsius_pilot_scope').GetLastName] zapalił papierosa, dodając do mgły woń tytoniu. [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] rozglądał się w poszukiwaniu wskazówek. Jednak [SCOPE.sCharacter('lepsius_attache_scope').GetLastName] niczego nie dostrzegał. [SCOPE.sCharacter('lepsius_attache_scope').GetSheHe] stał przed wizerunkiem demona jak zahipnotyzowany. [SCOPE.sCharacter('lepsius_attache_scope').GetHerHis] oczy wpatrywały się w wykrzywione oblicze pradawnej istoty. Wiatr szeptał w [SCOPE.sCharacter('lepsius_attache_scope').GetHerHis] uszach. Wiatr, który stawał się słowami. Słowami, które szeptały do [SCOPE.sCharacter('lepsius_attache_scope').GetHerHim], by paść na kolana. Ziemia, na której [SCOPE.sCharacter('lepsius_attache_scope').GetSheHe] stał, była święta. Należała do boga, przed którym [SCOPE.sCharacter('lepsius_attache_scope').GetSheHe] musiał się pokłonić. Boga będącego panem świata. Który wynosił żebraków na trony i powierzał im królestwa tego świata. Boga, który sprawiał, że wszyscy władcy świata, dziedziczni i obieralni, padali na twarz przed [SCOPE.sCharacter('lepsius_attache_scope').GetHerHim]. „Dam ci całą potęgę i chwałę tych królestw, gdyż należą do mnie i daję je, komu zechcę. Jeśli upadniesz przede mną i oddasz mi pokłon, wszystko będzie twoje”.\nDym papierosowy wirował wokół [SCOPE.sCharacter('lepsius_attache_scope').GetLastName]. Pilot mówił chaotycznie i usiłował przywołać [SCOPE.sCharacter('lepsius_attache_scope').GetHerHim] do rozsądku. Archeolog jedynie przyglądał się tej scenie."
 lepsius.575.g: "Musisz władać, jeśli pragniesz Mascapaichy."
 lepsius.576.t: "Mascapaicha"
 lepsius.576.d: "Po raz pierwszy od ich przybycia do doliny mgła się rozwiała. W ukrytej komnacie, którą odkrył Prof. [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName], stoi jedynie postument. Góruje nad nim cień. Cień upadłego imperium. Cień zapomnianej wiedzy. Cień utraconego złota. To cień Mascapaichy, korony Sapa Inki."
 lepsius.576.f: "Mascapaicha była insygnium władzy cesarskiej, noszonym wyłącznie przez Sapa Inkę jako Króla Cuzco i Cesarza Tawantinsuyu. Miała postać opaski złożonej z warstw wielobarwnego splotu, z której zwisało latu — frędzla z najdelikatniejszej czerwonej wełny, z czerwonymi chwostami przymocowanymi do złotych rurek. Zdobiły ją złote nici oraz pęk dwóch lub trzech pionowo osadzonych piór karakary górskiej, świętego ptaka zwanego po hiszpańsku corequenque. Stanowiła namacalny wyraz najwyższej władzy politycznej w Imperium Inków. Podczas niektórych ceremonii Sapa Inka trzymał Mascapaichę w dłoni, a na głowie nosił wojenne nakrycie — hełm ozdobiony piórami."
 lepsius.576.g: "To musi być korona Huayny Capaca!"
 lepsius.577.t: "Śmierć w Andach"
 lepsius.577.d: "Po uczestnikach specjalnej misji w Andach słuch zaginął. Żadnych oznak życia. Żadnych śladów. Wygląda na to, że poszukiwania Mascapaichy zakończyły się dla wyprawy tragicznie."
 lepsius.577.f: "Naukowcy i agenci wywiadu próbują ustalić przebieg wyprawy w Andach, lecz nie udaje im się znaleźć żadnych wskazówek. Jedynym świadectwem jej obecności pozostaje samolot zaginionej załogi. Miejscowi twierdzą, że miejsce lądowania leży tuż obok przeklętej doliny. Przeklętej, ponieważ ludzie, którzy do niej wchodzą, znikają bez śladu. Podobno ulegają tam demonicznym pokusom i giną marnie. Naukowcy wysunęli przypuszczenie, że unoszącą się tam mglistą zasłonę mogą tworzyć zarodniki nieznanych roślin, opary siarki lub inne gazy wywołujące halucynacje."
 lepsius.577.g: "Czy padli ofiarą własnych złudzeń?"
 lepsius_specialization_egypt_tech: "Egiptologia"
 lepsius_specialization_egypt_tech_desc: "Skupienie się na Starożytnym Egipcie sprawia, że nasi archeolodzy od samego początku posiadają cechę Archeologia Egipska. Ponadto z każdych wykopalisk w Egipcie otrzymujemy co roku jeden dodatkowy artefakt."
 lepsius_specialization_mesopotamia_tech: "Asyriologia"
 lepsius_specialization_mesopotamia_tech_desc: "Skupienie się na Mezopotamii sprawia, że nasi archeolodzy od samego początku posiadają cechę Archeologia Mezopotamska. Ponadto z każdych wykopalisk w Mezopotamii otrzymujemy co roku jeden dodatkowy artefakt."
 lepsius_specialization_aegean_tech: "Archeologia Egejska"
 lepsius_specialization_aegean_tech_desc: "Skupienie się na Cywilizacjach Egejskich sprawia, że nasi archeolodzy od samego początku posiadają cechę Archeologia Egejska. Ponadto z każdych wykopalisk w Grecji lub na Krecie otrzymujemy co roku jeden dodatkowy artefakt."
 lepsius_specialization_precolumbian_tech: "Archeologia Prekolumbijska"
 lepsius_specialization_precolumbian_tech_desc: "Skupienie się na Kulturach Prekolumbijskich sprawia, że nasi archeolodzy od samego początku posiadają cechę Archeologia Prekolumbijska. Ponadto z każdych wykopalisk w Ameryce Środkowej lub Południowej otrzymujemy co roku jeden dodatkowy artefakt."
 lepsius_has_archaeologist_egypt_specialist_tt: "[GetPlayer.GetName] posiada [concept_lepsius_archaeologist] z cechą #V Specjalizacja: Egiptologia#!."
 lepsius_has_archaeologist_mesopotamia_specialist_tt: "[GetPlayer.GetName] posiada [concept_lepsius_archaeologist] z cechą #V Specjalizacja: Asyriologia#!."
 lepsius_has_archaeologist_aegean_specialist_tt: "[GetPlayer.GetName] posiada [concept_lepsius_archaeologist] z cechą #V Specjalizacja: Archeologia Egejska#!."
 lepsius_has_archaeologist_precolumbian_specialist_tt: "[GetPlayer.GetName] posiada [concept_lepsius_archaeologist] z cechą #V Specjalizacja: Archeologia Prekolumbijska#!."
 je_lepsius_mascapaicha_goal: ""
 je_lepsius_specialization: "Specjalizacja Archeologiczna"
 je_lepsius_specialization_reason: "Państwo może tylko raz wybrać specjalizację archeologiczną. W zależności od wybranej dziedziny otrzymuje co roku jeden dodatkowy artefakt (egipski, mezopotamski, egejski lub prekolumbijski) z każdych wykopalisk. Nowi archeolodzy otrzymują odpowiednią cechę specjalizacji i znajdują o 5 artefaktów więcej na zakończenie wyprawy."
 je_lepsius_specialization_success: "[GetPlayer.GetName] posiada wybraną specjalizację archeologiczną."
 lepsius_archaeological_expedition_specialization_tt: "Dzięki specjalizacji naszego archeologa otrzymujemy dodatkowo #G 5#! [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts|q$')]."
 lepsius_add_1_specialization_clue_tt: "Dzięki specjalizacji naszego archeologa otrzymujemy #G 1#! dodatkową wskazówkę."
 je_lepsius_alexander: "Grobowiec Aleksandra"
 je_lepsius_alexander_reason: "Aleksander Wielki był jednym z najwybitniejszych wodzów wszech czasów. Stworzył imperium, z którego wyłoniły się później państwa hellenistyczne. Budził zarówno podziw, jak i lęk, a jego grobowiec stał się w starożytności celem pielgrzymek. Jednak najpóźniej w V wieku n.e. dokładne położenie grobowca przestało być znane. Większość źródeł wskazuje Aleksandrię jako ostateczne miejsce pochówku, choć nawet ta kwestia pozostaje sporna. Naszym głównym celem jest rozpoczęcie wykopalisk w miejscach, w których odnaleziono ślady Aleksandra — czy to na mocy pozwolenia, czy przy użyciu siły. Podążając za wskazówkami, możemy zawęzić obszar poszukiwań grobowca. Będzie to jednak wymagało przemieszczania się od jednego stanowiska wykopaliskowego do kolejnego, niczym w grze w podchody."
 je_lepsius_alexander_success: "Jeśli zbierzemy wystarczająco dużo #V Tajemniczych Wskazówek#! dotyczących grobowca Aleksandra, zdołamy ustalić jego dokładne położenie."
 je_lepsius_alexander_goal: ""
 je_lepsius_ark: "Arka Przymierza"
 je_lepsius_ark_reason: "Arka Przymierza ma ogromną wartość religijną i archeologiczną. Dla Izraelitów stanowiła centralny punkt ich sanktuarium — Świątyni Jerozolimskiej. Od czasów Mojżesza przechowywano w niej tablice z Dziesięciorgiem Przykazań, a ona sama towarzyszyła ludowi w odzyskiwaniu Ziemi Świętej. Arka była rękojmią obecności Boga pośród jego ludu. Uznaje się ją za zaginioną od zdobycia Jerozolimy przez Nabuchodonozora II (587/586 p.n.e.). Naszym głównym celem jest rozpoczęcie wykopalisk w miejscach, w których odnaleziono ślady Arki — czy to na mocy pozwolenia, czy przy użyciu siły. Podążając za wskazówkami, możemy zawęzić obszar jej poszukiwań. Będzie to jednak wymagało przemieszczania się od jednego stanowiska wykopaliskowego do kolejnego, niczym w grze w podchody."
 je_lepsius_ark_success: "Jeśli zbierzemy wystarczająco dużo #V Tajemniczych Wskazówek#! dotyczących Arki, zdołamy ustalić jej dokładne położenie."
 je_lepsius_ark_goal: ""
 je_lepsius_atlantis: "Los Atlantydy"
 je_lepsius_atlantis_reason: "Atlantyda to jeden z największych mitów w dziejach ludzkości. Zagłada legendarnego miasta stała się symbolem utraconego raju, zapowiedzią istnienia wielkiego kraju na Zachodzie i opowieścią o upadku wysoko rozwiniętej cywilizacji. Pierwszy wspomniał o niej Platon, opisując rzekomą potęgę morską, która władała znaczną częścią basenu Morza Śródziemnego, aż klęska żywiołowa przypieczętowała jej los. Już w starożytności dyskutowano o możliwym istnieniu Atlantydy. Podczas gdy autorzy tacy jak Pliniusz Starszy zaprzeczali istnieniu owego wyspiarskiego królestwa, inni, jak Krantor, Posejdonios i Strabon, dopuszczali taką możliwość. Naszym głównym celem jest rozpoczęcie wykopalisk w miejscach, w których odnaleziono ślady Atlantydy — czy to na mocy pozwolenia, czy przy użyciu siły. Podążając za wskazówkami, możemy zawęzić obszar poszukiwań miasta. Będzie to jednak wymagało przemieszczania się od jednego stanowiska wykopaliskowego do kolejnego, niczym w grze w podchody."
 je_lepsius_atlantis_success: "Jeśli zbierzemy wystarczająco dużo #V Tajemniczych Wskazówek#! dotyczących Atlantydy, zdołamy ustalić jej dokładne położenie."
 je_lepsius_atlantis_goal: ""
 je_lepsius_eldorado: "Poszukiwania El Dorado"
 je_lepsius_eldorado_reason: "Czy konkwistadorzy podążali jedynie za baśniami i niestworzonymi opowieściami? Bez legend o ludach opływających w złoto Balboa nie dotarłby do Pacyfiku, a Hernando de Soto nie przemierzyłby ziem dzisiejszych Stanów Zjednoczonych. Odkrywanie Nowego Świata potoczyłoby się inaczej. Dokonania Cortésa i Pizarra potwierdziły, że w legendach tkwiło ziarno prawdy. Być może na kontynencie amerykańskim wciąż istnieje nieodkryte miasto o wielkim znaczeniu — znaleziska archeologiczne mówią same za siebie. Naszym głównym celem jest rozpoczęcie wykopalisk w miejscach, w których odnaleziono ślady El Dorado — czy to na mocy pozwolenia, czy przy użyciu siły. Podążając za wskazówkami, możemy zawęzić obszar poszukiwań miasta. Będzie to jednak wymagało przemieszczania się od jednego stanowiska wykopaliskowego do kolejnego, niczym w grze w podchody."
 je_lepsius_eldorado_success: "Jeśli zbierzemy wystarczająco dużo #V Tajemniczych Wskazówek#! dotyczących El Dorado, zdołamy ustalić jego dokładne położenie."
 je_lepsius_eldorado_goal: ""
