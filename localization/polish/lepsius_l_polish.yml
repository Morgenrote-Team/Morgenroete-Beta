 lepsius_museum_lower_prices_modifier: "Niższe Ceny Biletów do Muzeum"
 lepsius.1502_peking_d: "\nCzłowiek pekiński, obok człowieka jawajskiego, jest uznawany za jedno z pierwszych znalezisk Homo Erectus i umocnił przekonanie, że ludzkość wywodzi się z Azji. Wiek kości szacuje się na 400,000 do 780,000 lat."
 lepsius_state_trait_heidelbergensis_cave: "Prehistoryczna Jaskinia"
 lepsius.1326.t: "Homo Heidelbergensis ukończony"
 lepsius.1326.d: "[SCOPE.sCharacter('andersson_anthropologist_scope').GetFullName] zgromadził wystarczająco dużo kości, by wyciągnąć konkretne wnioski na temat tego wymarłego gatunku. Homo Heidelbergensis nie jest już zagadką dla nauki i można go teraz z pewną dozą pewności umiejscowić w drzewie rodowym człowieka, choć wiele pytań wciąż pozostaje bez odpowiedzi."
 lepsius.1326.f: "Żuchwę Homo Heidelbergensis odkrył w 1907 roku robotnik Daniel Hartmann w piaskowni w Mauer koło Heidelbergu, a w 1908 roku opisał ją anatom Otto Schoetensack. Znalezisko sprzed około 600,000 lat uznaje się za najstarsze świadectwo obecności wczesnych ludzi w Europie. Pod względem morfologicznym zajmuje ono pozycję pośrednią między Homo erectus a Homo sapiens i wskazuje na szerokie rozprzestrzenienie tej formy hominida w Afryce, Europie i Azji. Masywna budowa oraz szacowana objętość mózgu pozwalają wyciągać wnioski o zaawansowanym przystosowaniu fizycznym, posługiwaniu się narzędziami i organizacji społecznej."
 lepsius.1336.t: "Człowiek z Heidelbergu"
 lepsius.1336.d: "Robotnik dokonał niezwykłego odkrycia w kopalni w Mauer, miejscowości koło Heidelbergu. Profesor Uniwersytetu w Heidelbergu natychmiast rozpoznał wartość znaleziska."
 lepsius.1336.f: "Żuchwę Homo Heidelbergensis odkrył w 1907 roku robotnik Daniel Hartmann w piaskowni w Mauer koło Heidelbergu, a w 1908 roku opisał ją anatom Otto Schoetensack. Znalezisko sprzed około 600,000 lat uznaje się za najstarsze świadectwo obecności wczesnych ludzi w Europie. Pod względem morfologicznym zajmuje ono pozycję pośrednią między Homo erectus a Homo sapiens i wskazuje na szerokie rozprzestrzenienie tej formy hominida w Afryce, Europie i Azji. Masywna budowa oraz szacowana objętość mózgu pozwalają wyciągać wnioski o zaawansowanym przystosowaniu fizycznym, posługiwaniu się narzędziami i organizacji społecznej."
 lepsius.1501_heidelbergensis_human_fossils: "\n#G [ROOT.Var('lepsius_heidelbergensis_human_fossil').GetValue]#! #E Skamieliny Homo Heidelbergensis#!."
 lepsius.1501_taxonomy_heidelbergensis: "\n#E Homo Heidelbergensis#! został sklasyfikowany przez [SCOPE.sCountry('lepsius_heidelbergensis_systemizer_country').GetName]."
 lepsius.1502_mauer_t: "#T Homo Heidelbergensis#! odkryty przez [SCOPE.sCountry('lepsius_heidelbergensis_finder_country').GetName]"
 lepsius.1502_mauer_d: "\nŻuchwę Homo heidelbergensis odkryto w pobliżu Heidelbergu. Uznaje się ją za najstarsze świadectwo obecności wczesnego człowieka w Europie oraz ważne ogniwo pośrednie między Homo erectus a późniejszymi homininami."
 dubois_add_fossil_mauer_tt: "Zyskaj #G 1#! @dubois_human_fossil! #O Wyjątkową Skamielinę Człowieka#!: Człowiek heidelberski."
