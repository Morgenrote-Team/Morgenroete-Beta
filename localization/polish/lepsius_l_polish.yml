 je_lepsius_excavation_harappa: "Wykopaliska w Harappie"
 je_lepsius_excavation_harappa_reason: "#T Ruiny Harappy w Indiach to fascynujące miejsce dla Archeologów.#!\n$mr_divider_for_je$\nCo miesiąc będziesz zyskiwać postęp zależny od wielu różnych czynników. Na określonych etapach wykopalisk wystąpi wydarzenie, które zapewni ci [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts|q$')] i doświadczenie oraz zmieni cechę regionu, zwiększając dochody z [concept_curtiss_tourism].\n$mr_divider_for_je$\n$lepsius_excavation_progress_loc$"
 je_lepsius_excavation_harappa_0_loc: "Ruiny w większości pozostają w takim stanie, w jakim znajdowały się od wieków."
 je_lepsius_excavation_harappa_1_loc: "Niedawne wykopaliska i częściowa restauracja Świątyni Bela przyciągnęły więcej osób pragnących odwiedzić to starożytne miejsce."
 je_lepsius_excavation_harappa_2_loc: "Nasi Archeolodzy odkopali i odrestaurowali różne Świątynie, w tym Świątynię Bela, Dolinę Grobów z jej Grobowcami Wieżowymi oraz wiele innych miejsc. Przyciąga to coraz więcej zwiedzających."
 lepsius.5020.t: "Stanowisko w Harappie"
 lepsius.5020.d: "Niewiele jeszcze wiemy o Stanowisku w Harappie, ale nasi Archeolodzy nie mogą się doczekać odkrycia tajemnic tego starożytnego miasta."
 lepsius.5020.f: "Na razie nie wiadomo, jak poważnych zniszczeń doznało stanowisko przez te wszystkie lata. Nasze zespoły archeologiczne już jednak przygotowują się do wykopalisk i prowadzą badania sondażowe w różnych miejscach, aby ustalić, gdzie prace zapowiadają się najbardziej obiecująco."
 lepsius.5020.g: "Stanowisko o wielkim znaczeniu dla Indii"
 lepsius.5021.t: "Miasto o układzie siatki"
 lepsius.5021.d: "Wykopaliska odsłoniły miasto zbudowane na planie siatki. Musiało być ogromne, a my wciąż nie wiemy, ilu ludzi mogło je niegdyś zamieszkiwać."
 lepsius.5021.f: "„To doprawdy fascynujące, że poza Mezopotamią i Egiptem istniała jeszcze jedna kolebka cywilizacji. Nigdy bym nie przypuszczał, że to właśnie w Indiach mogło znajdować się jedno z największych miast epoki brązu na świecie”. - Jeden z twoich Archeologów"
 lepsius.5021.g: "Nowa Kolebka Cywilizacji"
 lepsius.5022.t: "Mury Harappy"
 lepsius.5022.d: "Nasi Archeolodzy odkopali miejsce, które nazwali Cytadelą. Nie jest jeszcze jasne, dlaczego mieszkańcy Harappy potrzebowali ufortyfikowanego miejsca w swoim mieście."
 lepsius.5022.f: "„Jestem absolutnie pewien, że obawiali się najazdu Ludów Morza!”\n„Ludy Morza działały w basenie Morza Śródziemnego, a nie tutaj! Moim zdaniem musieli chronić zapasy żywności przed tymi natrętnymi chłopami!”\n„Bardzo w to wątpię. Musieli wznieść ufortyfikowaną świątynię dla swoich bogów!”"
 lepsius.5022.g: "To fascynujące!"
 lepsius.5023.t: "System Kanalizacyjny Harappy"
 lepsius.5023.d: "Nasze wykopaliska odsłoniły rozbudowany system odprowadzania wody i nieczystości. Wygląda na to, że nawet niektóre toalety były podłączone do tych kanałów."
 lepsius.5023.f: "„Nawet ja nie mam tak nowoczesnej toalety, jaką mieli mieszkańcy Harappy! Musieli być niezwykle zaawansowani!”"
 lepsius.5023.g: "A pomyśleć, że do dziś borykamy się z problemem ścieków..."
 je_lepsius_petra: "Petra - Dziedzictwo Nabatejczyków"
 je_lepsius_petra_reason: "Około 1800 roku tylko nieliczni uczeni wiedzieli o legendarnym mieście wykutym w skale na Bliskim Wschodzie. Petrę odkrył na nowo dopiero w 1812 roku szwajcarski podróżnik Johann Ludwig Burckhardt, przemierzający kraje arabskie. Choć od tego czasu odwiedziło ją wielu podróżników, szczegółowe badania archeologiczne Petry wciąż czekają na przeprowadzenie."
 lepsius.77.t: "Dziedzictwo Nabatejczyków"
 lepsius.77.d: "Doktor [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] przeprowadził pierwsze gruntowne badania archeologiczne Petry i odnalazł zabytki z przeszłości. Inspirujące osiągnięcie naukowe!"
 lepsius.77.f: "Petra, której ruiny znajdują się na terenie dzisiejszej Jordanii, była w starożytności stolicą Imperium Nabatejskiego. Ze względu na monumentalne świątynie grobowe, których fasady wykuto bezpośrednio w skale, uchodzi za wyjątkowy zabytek kultury. Historia miasta jest ściśle związana z dziejami Imperium Nabatejskiego, pierwszego imperium arabskiego w historii. Poza pewną liczbą inskrypcji Nabatejczycy pozostawili jednak niewiele własnych świadectw pisanych. Ich dzieje oraz historię Petry można więc odtworzyć jedynie fragmentarycznie i pośrednio, na podstawie źródeł biblijnych, greckich i rzymskich. Najsłynniejszą budowlą Petry jest wzniesiony w stylu hellenistycznym Chazne al-Firaun, mierzący niemal 40 metrów wysokości i 25 metrów szerokości. „Skarbiec Faraona”, jak nazwali go Beduini, był w rzeczywistości jednym z licznych grobowców skalnych. Być może powstał dla nabatejskiego króla Aretasa IV, który panował w I wieku p.n.e. Inni badacze datują jednak Chazne dopiero na II wiek n.e., na czasy cesarza Hadriana."
 lepsius.77.g: "W takim miejscu można by też ukryć chrześcijańskie artefakty okultystyczne."
