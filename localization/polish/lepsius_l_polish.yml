 je_lepsius_pergamon_altar: "Ołtarz Pergamoński"
 je_lepsius_pergamon_altar_reason: "Odkrycie Ołtarza Pergamońskiego zawdzięczamy niemieckiemu inżynierowi Carlowi Humannowi, który już w 1864 roku rozpoznał pierwsze marmurowe płyty wbudowane w bizantyjskie mury obronne akropolu Pergamonu, a ostatecznie w 1878 roku uzyskał oficjalne pozwolenie na wykopaliska od rządu osmańskiego. Na mocy umownie ustalonego podziału znalezisk wydobyte płyty reliefowe przypadły Cesarstwu Niemieckiemu, co wiązało się z wymagającym logistycznie transportem łącznie 462 skrzyń o całkowitej masie około 350 ton. W podobnych okolicznościach historycznych moglibyśmy również pozyskać to arcydzieło architektury hellenistycznej i ponownie złożyć je w naszym Muzeum Archeologicznym."
 je_lepsius_pergamon_altar_fail: "Każdy kraj ma prawo przetransportować Ołtarz Pergamoński."
 je_lepsius_pergamon_altar_transport: "Ołtarz Pergamoński – Transport"
 je_lepsius_pergamon_altar_transport_reason: "Po przeprowadzeniu lokalnych wykopalisk w starożytnej twierdzy Pergamon i negocjacjach z władzami udało nam się uzyskać zgodę na transport marmurowych elementów do miasta [ROOT.GetCountry.GetCapital.GetCityHubName]. Ołtarz Pergamoński ma zostać zrekonstruowany w naszym Muzeum Archeologicznym."
 je_lepsius_pergamon_altar_transport_success: "Do przywrócenia Ołtarzowi jego dawnej świetności potrzeba łącznie 350 marmurowych elementów. Oczekuje się, że każdego roku dotrze do nas około 50 elementów, o ile nie wystąpią żadne problemy.\n\n#R Ważne:#! Prace Archeologa nad restauracją i prace Inżyniera nad rekonstrukcją rozpoczną się dopiero po dotarciu co najmniej 150 marmurowych elementów."
 lepsius_monument_pergamon_progress_bar: "Transport"
 lepsius_monument_pergamon_progress_bar_desc: "Postęp Transportu: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|1%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/350)"
 lepsius.2186.t: "Ołtarz Pergamoński"
 lepsius.2186.d: "Na koniec musimy oficjalnie zwrócić się do państwa [SCOPE.sCountry('lepsius_pergamon_country').GetName] o przyznanie nam niezbędnych praw do prowadzenia wykopalisk w Pergamonie i przetransportowania odnalezionych zabytków do miasta [ROOT.GetCountry.GetCapital.GetCityHubName]. To jedynie formalność."
 lepsius.2186.f: "W latach 1864–1865 Carl Humann po raz pierwszy przybył do Pergamonu. Niemiecki inżynier otrzymał zlecenie przeprowadzenia pomiarów geograficznych i w kolejnych latach wielokrotnie odwiedzał to miasto. Opowiadał się za ochroną zabytków znajdujących się na wzgórzu cytadeli i poszukiwał partnerów do przeprowadzenia wykopalisk, ponieważ jako osoba prywatna nie byłby w stanie samodzielnie podjąć się takiego przedsięwzięcia. Brakowało mu niezbędnych środków finansowych i zaplecza logistycznego. Równie ważne było szybkie rozpoczęcie prac wykopaliskowych, ponieważ mieszkańcy Bergamy, jak wówczas nazywano Pergamon, wykorzystywali Ołtarz i inne ruiny widoczne na powierzchni jako kamieniołom. Rozbierali pozostałości starożytnych budowli, aby pozyskiwać materiał do wznoszenia nowych budynków, a niekiedy nawet wypalali marmur, by produkować z niego wapno. W 1871 roku berliński filolog klasyczny i archeolog Ernst Curtius wraz z kilkoma innymi niemieckimi uczonymi przybył do Pergamonu na zaproszenie Humanna. Zorganizował transport kilku artefaktów, w tym dwóch fragmentów Ołtarza, do Berlina."
 lepsius.2186.g: "Poproś o Pozwolenie"
 lepsius.2187.t: "Ołtarz Pergamoński – Wniosek"
 lepsius.2187.d: "[SCOPE.sCountry('lepsius_pergamon_request_country').GetName] zwróciło się z prośbą o pozwolenie na przetransportowanie kilku starych kamieni do swojej stolicy – aby zbudować z nich starożytny ołtarz, z powodów, które pozostają dla nas całkowicie niezrozumiałe – mimo że jest zupełnie oczywiste, iż marmur znacznie lepiej nadawałby się na wapienny tynk do budynków mieszkalnych. Mimo wszystko oferta jest kusząca. Archeolodzy dobrze płacą, a kraj obiecał nam przysługę w dziedzinie polityki zagranicznej..."
 lepsius.2187.g: "Udziel zgody"
 lepsius.2187.h: "Odmów zgody"
 lepsius.2188.t: "Wniosek Zaakceptowany"
 lepsius.2188.d: "[SCOPE.sCountry('lepsius_pergamon_country').GetName] udzieliło nam zgody na przetransportowanie Ołtarza Pergamońskiego do miasta [ROOT.GetCountry.GetCapital.GetCityHubName]!"
 lepsius.2188.g: "Do Dzieła!"
 lepsius.2189.t: "Wniosek Odrzucony"
 lepsius.2189.d: "[SCOPE.sCountry('lepsius_pergamon_country').GetName] — ku naszemu zaskoczeniu — odmówiło nam zgody na przetransportowanie Ołtarza Pergamońskiego do miasta [ROOT.GetCountry.GetCapital.GetCityHubName]. Czyżbyście nie uzgodnili tego wcześniej na Discordzie?"
 lepsius.2189.g: "Co do cholery...?!"
 lepsius.2190.t: "Ołtarz Pergamoński w mieście [ROOT.GetCountry.GetCapital.GetCityHubName]"
 lepsius.2190.d: "Po żmudnych wykopaliskach, latach transportu oraz skrupulatnych pracach konserwatorskich i rekonstrukcyjnych Ołtarz Pergamoński stoi teraz w centrum naszego muzeum jako monumentalny eksponat. To bez wątpienia najważniejszy zabytek epoki hellenistycznej!"
 lepsius.2190.f: "Po wykopaliskach prowadzonych przez Carla Humanna w latach 1878–1886 fragmenty rzeźbiarskie Ołtarza Pergamońskiego zostały przewiezione do Berlina na mocy porozumienia z Imperium Osmańskim. Rekonstrukcja obejmuje przede wszystkim zachodnią fasadę oraz fryz Gigantomachii. Ołtarz został po raz pierwszy wystawiony w 1901 roku, jednak dopiero otwarcie obecnego Muzeum Pergamońskiego w 1930 roku zapewniło przestrzeń niezbędną do jego prezentacji w pełnej skali. Montaż polegał na osadzeniu oryginalnych fragmentów marmurowych na nowoczesnym rdzeniu konstrukcyjnym, aby odtworzyć pierwotne wymiary zabytku. Obecnie, jako część Państwowych Muzeów w Berlinie, Ołtarz pozostaje jednym z najważniejszych obiektów archeologii hellenistycznej."
 lepsius.2190.g: "Triumf archeologii i inżynierii [ROOT.GetCountry.GetAdjectiveNoFlag]!"
