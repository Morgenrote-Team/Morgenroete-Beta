 je_ishtar_gate: "Rekonstrukcja Bramy Isztar"
 je_ishtar_gate_reason: "Po tym, jak Wyprawa do Babilonii wydobyła pozostałości legendarnej Bramy Isztar, rozszerzyliśmy naszą Licencję Badawczą, aby sprowadzić babilońskie cegły do naszego muzeum."
 je_ishtar_gate_success: "Do przywrócenia bramy do jej dawnej świetności potrzeba łącznie 200 000 cegieł. Oczekuje się, że każdego roku dotrze do nas około 20 000 cegieł — o ile nie wystąpią żadne problemy."
 je_ishtar_gate_goal: ""
 je_lepsius_priams_treasure: "Skarb Priama"
 je_lepsius_priams_treasure_reason: "Heinrich Schliemann szuka odpowiedniego miejsca dla legendarnego skarbu Priama, który, jak twierdzi, odnalazł w Troi. Podczas gdy poważni uczeni wątpią, że te odkrycia rzeczywiście pasują do epoki, w której Schliemann je umieszcza, jest to kwestia drugorzędna. Jest to przecież wyjątkowa okazja, aby wejść w posiadanie jednego z największych skarbów archeologicznych tego stulecia. Nasze muzeum byłoby idealnym miejscem dla niego."
 je_lepsius_priams_treasure_fail: "Jeśli konkurent szybciej niż my spełni życzenia Schliemanna, stracimy wyjątkową szansę na zdobycie skarbu Priama."
 je_lepsius_the_labyrinth: "Labirynt"
 je_lepsius_the_labyrinth_reason: "Uwięziony w dziwnym, starożytnym labiryncie, doktor [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastNameNoFormatting] musi odnaleźć [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] drogę powrotną. Jeśli [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] popełni zbyt wiele błędów, [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] ryzykuje, że na zawsze zagubi się w jego głębi!"
 je_lepsius_discovery_tut: "Badanie Doliny Królów"
 je_lepsius_discovery_tut_reason: "Mamy wszelkie powody, by sądzić, że Dolina Królów może zawierać ukryte miejsce o wielkiej wartości historycznej. Poszukiwania mogą zająć nam lata. Ktokolwiek dokona tego odkrycia, powinien zapisać się dzięki niemu w historii."
 je_lepsius_disovery_tut_success: "Jeśli uda nam się znaleźć dziesięć wskazówek w Górnym Egipcie, zgromadzimy wystarczająco dużo materiału, aby ponownie odkryć zaginione miejsce o wielkim znaczeniu historycznym."
 je_lepsius_disovery_tut_fail: "Nasze wysiłki pójdą na marne, jeśli inny naród znajdzie dziesięć wskazówek w Górnym Egipcie przed nami."
 je_lepsius_discovery_ship: "Badania w pobliżu piramid"
 je_lepsius_discovery_ship_reason: "Mamy wszelkie powody, by sądzić, że piramidy mogą skrywać coś o wielkiej wartości historycznej. Poszukiwania mogą zająć nam lata. Ktokolwiek dokona tego odkrycia, powinien zapisać się dzięki niemu w historii."
 je_lepsius_disovery_ship_success: "Jeśli uda nam się znaleźć dziesięć wskazówek w Dolnym Egipcie, zgromadzimy wystarczająco dużo materiału, aby ponownie odkryć zaginione miejsce o wielkim znaczeniu historycznym."
 je_lepsius_disovery_ship_fail: "Nasze wysiłki pójdą na marne, jeśli inny naród znajdzie dziesięć wskazówek w Dolnym Egipcie przed nami."
 je_lepsius_discovery_babylon: "Badania w Babilonie"
 je_lepsius_discovery_babylon_reason: "Mamy wszelkie powody, by sądzić, że na obszarze Babilonu może znajdować się coś większego, czego jeszcze nie odkryliśmy. Poszukiwania mogą zająć nam lata. Ktokolwiek dokona tego odkrycia, powinien zapisać się dzięki niemu w historii."
 je_lepsius_disovery_babylon_success: "Jeśli uda nam się znaleźć dziesięć wskazówek w Babilonii, zgromadzimy wystarczająco dużo materiału, aby ponownie odkryć zaginione miejsce o wielkim znaczeniu historycznym."
 je_lepsius_disovery_babylon_fail: "Nasze wysiłki pójdą na marne, jeśli inny naród znajdzie dziesięć wskazówek w Babilonii przed nami."
 je_lepsius_discovery_semiramis: "Badania w Asyrii"
 je_lepsius_discovery_semiramis_reason: "Mamy wszelkie powody, by sądzić, że Asyria może skrywać cud, o którym nikt nie ma pojęcia. Poszukiwania mogą zająć nam lata. Ktokolwiek dokona tego odkrycia, powinien zapisać się dzięki niemu w historii."
 je_lepsius_disovery_semiramis_success: "Jeśli uda nam się znaleźć dziesięć wskazówek w Asyrii, zgromadzimy wystarczająco dużo materiału, aby ponownie odkryć zaginione miejsce o wielkim znaczeniu historycznym."
 je_lepsius_disovery_semiramis_fail: "Nasze wysiłki pójdą na marne, jeśli inny naród znajdzie dziesięć wskazówek w Asyrii przed nami."
 je_lepsius_discovery_mycenae: "Badania w Mykenach"
 je_lepsius_discovery_mycenae_reason: "Mamy wszelkie powody, by sądzić, że starożytne miasto Mykeny wciąż skrywa pewną tajemnicę. Poszukiwania mogą zająć nam lata. Ktokolwiek dokona tego odkrycia, powinien zapisać się dzięki niemu w historii."
 je_lepsius_disovery_mycenae_success: "Jeśli uda nam się znaleźć dziesięć wskazówek w Argolidzie, zgromadzimy wystarczająco dużo materiału, aby ponownie odkryć zaginione miejsce o wielkim znaczeniu historycznym."
 je_lepsius_disovery_mycenae_fail: "Nasze wysiłki pójdą na marne, jeśli inny naród znajdzie dziesięć wskazówek w Argolidzie przed nami."
 je_lepsius_discovery_pakal: "Badania na Jukatanie"
 je_lepsius_discovery_pakal_reason: "Mamy wszelkie powody, by sądzić, że nie wszystkie tajemnice Majów zostały jeszcze rozwiązane. Poszukiwania mogą zająć nam lata. Ktokolwiek dokona tego odkrycia, powinien zapisać się dzięki niemu w historii."
 je_lepsius_disovery_pakal_success: "Jeśli uda nam się znaleźć dziesięć wskazówek na Jukatanie, zgromadzimy wystarczająco dużo materiału, aby ponownie odkryć zaginione miejsce o wielkim znaczeniu historycznym."
