 lepsius.15.f: "Obecnie Kolekcja Prekolumbijska zawiera #p [ROOT.Var('lepsius_precolumbian_artifact_minor').GetValue]#! @lepsius_precolumbian_minor! pomniejszych artefaktów oraz #p [ROOT.Var('lepsius_precolumbian_artifact_major').GetValue]#! @lepsius_precolumbian_major! cennych artefaktów. \n\n Kolekcję Prekolumbijską można #T zreorganizować#!, organizując w ten sposób nową wystawę. Wymaga to jednak określonej liczby artefaktów. \n\n #T Mała wystawa#! wymaga #p 10#! @lepsius_precolumbian_minor! artefaktów, #T średnia wystawa#! wymaga #p 25#! @lepsius_precolumbian_minor! artefaktów, #T duża wystawa#! wymaga #p 50#! @lepsius_precolumbian_minor! artefaktów, a #T znakomita wystawa#! wymaga #p 100#! @lepsius_precolumbian_minor! artefaktów. Ponadto #T znakomita wystawa#! wymaga #p 1#! @lepsius_precolumbian_major! cennego artefaktu. \n\n Reorganizacja kolekcji i przygotowania do nowej wystawy potrwają około pół roku. Premie zapewniane przez wystawę pozostają na stałe – aż do kolejnej reorganizacji."
 lepsius.99.t: "Przeniesienie Muzeum Archeologicznego"
 lepsius.99.d: "Z jakiegoś powodu posiadamy [GetBuildingType('building_lepsius_archaeological_museum').GetName], ale nie znajduje się ono w naszej wspaniałej Stolicy. Oczywiście musimy przenieść je do Stolicy!"
 lepsius.99.f: "„Proszę uważać na te wazy, są bardzo kruche! Nie! Nie możecie ich tak po prostu wrzucać do skrzyni, trzeba je czymś zabezpieczyć! Naprawdę nie sądzę, żeby to był dobry pomysł!”"
 lepsius.99.g: "Teraz mogę tam chodzić codziennie!"
 lepsius.140.d: "Nasz archeolog wykorzystał [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] znajomości, aby zwerbować wysoko wykwalifikowany personel na wyprawę."
 lepsius.250.f: "Zaczęło się od kłótni, po której posypały się przekleństwa i groźby, aż w końcu poszły w ruch pięści. Cały incydent przerodził się w prawdziwą bójkę w karczmie. W samym jej centrum znalazł się nasz przywódca wyprawy. Przez [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] porywczy temperament straciliśmy wiele na reputacji. Dziś rano doniesienie o tym nietakcie dotarło do wysoko postawionego dostojnika. Udało nam się uniknąć poważnego incydentu dyplomatycznego, ale złe wrażenie pozostanie na długo."
 lepsius.260.f: "Dobre wieści! Jak się okazało, podczas podróży nasz przywódca wyprawy zachowywał się jak wzorowy [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetCustom('academics_gentleman_or_gentlewoman_type')]. Dzięki [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] taktowi i nienagannym manierom udało się zrobić doskonałe wrażenie. [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis|U] taktowne i charyzmatyczne zachowanie uznano za typowe dla [ROOT.GetCountry.GetAdjectiveNoFlag] obywateli. Reputacja naszego narodu w tamtejszym środowisku znacznie wzrosła."
 lepsius.270.d: "Przywódca naszej wyprawy wyróżnia się przede wszystkim tym, że [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] codziennie przesiaduje w kawiarni, popijając wodę sodową i zajadając się lodami."
 lepsius.270.f: "Są ambitni przywódcy, którzy całymi dniami nie robią nic poza pracą. Pragną dokonać wielkich rzeczy lub zgromadzić fortunę. Niektórzy chcą zasłynąć swoimi czynami. Inni obsesyjnie skupiają się na każdym szczególe. Zupełnie inaczej jest z kierownikiem naszej wyprawy archeologicznej. [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] ma zwyczaj codziennie szukać ochłody przed upałem, wypijając ogromne ilości wody sodowej i pochłaniając lody. Można by nazwać to lenistwem. Dla innych jest to jednak oznaka osobistej elegancji, dobrego gustu i właściwego ustalania życiowych priorytetów."
 lepsius.280.d: "Dzięki zdolnościom dyplomatycznym przywódcy naszej wyprawy [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHim] zaproszono na spotkanie z miejscowym gubernatorem i uhonorowano nagrodą."
 lepsius.311.d: "Przywódca ostatniej zagranicznej wyprawy archeologicznej postanowił opublikować dziennik, który [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] prowadził podczas podróży."
 lepsius.312.d: "[SCOPE.sCharacter('lepsius_scientific_writer').GetFullName] postanowił opublikować pracę naukową, którą [SCOPE.sCharacter('lepsius_scientific_writer').GetSheHe] napisał podczas podróży."
 lepsius.408.f: "Nazar to amulet mający chronić przed złym okiem. Przesąd ten jest rozpowszechniony w znacznej części Orientu, a także w niektórych regionach basenu Morza Śródziemnego. Oczywiście absurdem byłoby sądzić, że człowiek o naukowym wykształceniu mógłby polegać na talizmanie, aby uchronić się przed złymi mocami, które mogłyby sprowadzić nieszczęście na wyprawę. Inaczej jednak wygląda sytuacja z miejscowymi pomocnikami i tragarzami. Proszą oni przywódcę wyprawy o zdobycie jednego z takich amuletów, przekonani, że w przeciwnym razie [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] doświadczy wielkiego nieszczęścia. Niezależnie od tego, czy nazar rzeczywiście posiada jakieś magiczne właściwości, nawet jeśli nie wpłynie na przebieg wyprawy, to przynajmniej podniesie morale naszych podwładnych."
 lepsius.409.f: "Gdy nasza wyprawa posuwała się wzdłuż wybrzeża, jej uczestnicy natrafili na rozległą zatokę, której przeciwległe cyple niemal się ze sobą stykały. Zamiast obchodzić ją dookoła, skorzystaliśmy z propozycji greckich rybaków, którzy zaoferowali przewiezienie nas na drugą stronę. Przywódca wyprawy szybko przyjął ich ofertę. Podczas rozmowy z rybakami [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] zdołał również uzyskać ważne informacje o pobliskich ruinach, które prawdopodobnie pochodzą z okresu przedklasycznego."
 lepsius.421.d: "Nasz archeolog znalazł małego egipskiego skarabeusza wykonanego z lapis lazuli, którego [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] chciałby zatrzymać dla siebie."
 lepsius.452.f: "[SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] wielokrotnie słyszał wcześniej, że w okolicy muszą istnieć historyczne zapiski dotyczące dawno zniszczonych stanowisk archeologicznych. Kilka dni temu [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetSheHe] otrzymał cenną wskazówkę: pewien kupiec posiadał XVI-wieczny manuskrypt zawierający kopię dawno zaginionych zapisków. Oryginały prawdopodobnie przepadły na zawsze, ale przynajmniej istnieje możliwość odtworzenia zawartych w nich informacji."
 lepsius.461.f: "Pojawiło się dziwne, przytłaczające uczucie. Był środek nocy. [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] wstał, sądząc, że to wiatr uderza w namiot rozbity na pustynnym piasku. Ale to było coś więcej niż wiatr. Rozległ się dziwny szept. Pomruk, który stopniowo przechodził w nieharmonijne dźwięki, aż w końcu przerodził się w melodyjny śpiew. Niczym śpiew syren wabił i mącił zmysły. Tak przynajmniej twierdził [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetLastName], gdy po wielu godzinach poszukiwań [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetSheHe] został odnaleziony u łap Wielkiego Sfinksa w Gizie, kopiąc jak szaleniec w przekonaniu, że pod Sfinksem znajduje się tajemna komnata, w której od tysięcy lat ukryta jest bezcenna wiedza. Od tamtej pory stan [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetHerHis] zdrowia niemal się nie poprawił. To miejsce ma naprawdę zgubny wpływ na [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetHerHim]."
 lepsius.462.f: "Pojawiło się dziwne, przytłaczające uczucie. Był środek nocy. [SCOPE.sCharacter('lepsius_military_attache').GetFullName] wstał, sądząc, że to wiatr uderza w namiot rozbity na pustynnym piasku. Ale to było coś więcej niż wiatr. Rozległ się dziwny szept. Pomruk, który stopniowo przechodził w nieharmonijne dźwięki, aż w końcu przerodził się w melodyjny śpiew. Niczym śpiew syren wabił i mącił zmysły. Tak przynajmniej twierdził [SCOPE.sCharacter('lepsius_military_attache').GetLastName], gdy po wielu godzinach poszukiwań [SCOPE.sCharacter('lepsius_military_attache').GetSheHe] został odnaleziony u łap Wielkiego Sfinksa w Gizie, kopiąc jak szaleniec w przekonaniu, że pod Sfinksem znajduje się tajemna komnata, w której od tysięcy lat ukryta jest bezcenna wiedza. Od tamtej pory stan [SCOPE.sCharacter('lepsius_military_attache').GetHerHis] zdrowia niemal się nie poprawił. To miejsce ma naprawdę zgubny wpływ na [SCOPE.sCharacter('lepsius_military_attache').GetHerHim]."
 lepsius.465.f: "Przywódca naszej wyprawy nie kryje swojego pochodzenia, języka, którym [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] się posługuje, potraw, które [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] najbardziej lubi, ani tego, którą kulturę [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] uważa za wyższą od innych. Z każdym dniem przybywa obelg kierowanych pod adresem miejscowej ludności, zarówno zatrudnionych pracowników, jak i przypadkowo napotkanych osób. Podczas podróży przez kolejne wioski [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] zaczął traktować miejscowych wójtów niczym swoich podwładnych, jakby każdy z nich pozostawał pod [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] rozkazami. Nawet najbardziej gościnne gesty nie są w stanie zadowolić [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHim]. Do różnych organów miejscowej administracji wpłynęło już kilka skarg na aroganckie i obraźliwe zachowanie [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName], a nasza wyprawa coraz bardziej przeradza się w antyreklamę naszego kraju."
 lepsius.467.f: "Niewiele pozostało z niegdyś chrześcijańskiego Bliskiego Wschodu, a jednak rozproszone wspólnoty chrześcijańskie Koptów, Maronitów, Chaldejczyków i Ormian przetrwały przez całe stulecia. [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] nie kierował się żadnymi pobudkami religijnymi, gdy [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] wyruszał w podróż. Jednak wczoraj wieczorem miejscowy kapłan zaprowadził [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHim] do dawno zapomnianego kościoła. Świątynia była interesująca zarówno z archeologicznego, jak i historycznego punktu widzenia, ale dopiero później duchowny pokazał relikwiarz zawierający relikwię jednego z Ojców Kościoła, którą od dawna uważano za zaginioną. Ponieważ było już późno, a obóz znajdował się daleko, przywódca wyprawy pozostał tam na noc i część następnego poranka. Od tamtej pory pewien sen nie daje [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHim] spokoju. Choć [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] niemal nigdy o nim nie opowiada, to właśnie pod jego wpływem [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] zapragnął zmienić pewne aspekty [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] życia. Kapłan zaproponował, że podaruje [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHim] część zapomnianej relikwii, aby umocnić [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHim] w nowo odnalezionej wierze."
 lepsius.467.g: "Czy [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] doznał wizji uszczęśliwiającej?"
 lepsius.471.g: "[GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe|U] powinien poświęcić trochę czasu, aby dowiedzieć się jak najwięcej o tym miejscu."
 lepsius.471.h: "[GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe|U] może pozostać tam dłużej, pod warunkiem że [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] przywiezie ze sobą kilka artefaktów."
 lepsius.471.i: "[GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe|U] może odwiedzić to miejsce, ale tylko na niezbędny czas."
 lepsius.472.f: "[SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] przedstawił niewiarygodne wyjaśnienie ogromnych strat w ludziach i sprzęcie. Jest ono zarówno oburzające, jak i haniebne, zwłaszcza gdy pada z ust człowieka, po którym można by oczekiwać choćby odrobiny oświeconego rozsądku. Przywódca wyprawy twierdzi, że [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetSheHe] wraz ze swoimi ludźmi, pozostającymi pod [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetHerHis] dowództwem, błąkał się przez tydzień, zanim natrafili na nieznaną dolinę otoczoną wysokimi górami, ukrytą w nieprzebytej dżungli Jukatanu. Mając nadzieję na odnalezienie nieznanego dotąd stanowiska Majów, opracowali plan zbadania doliny. Jak się okazało, był to ogromny błąd. Dolinę zamieszkują bowiem przerażające potwory, olbrzymie gady. [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetSheHe] wyjaśnił nam nawet, że w tym „zaginionym świecie” od milionów lat żyją dinozaury, które przetrwały wyginięcie dzięki odizolowaniu od reszty świata. Bestie terroryzowały członków wyprawy i bezlitośnie rozszarpały kilku tragarzy oraz badaczy. Podczas ucieczki [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetSheHe] musiał podobno porzucić znaczną część wyposażenia. Teraz [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetSheHe] błaga nas o ponowne wyposażenie całej wyprawy. Nie wiemy, dlaczego [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetSheHe] uważa, że [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetSheHe] zdoła zrobić na nas wrażenie tą bajeczną opowieścią. Wręcz przeciwnie, zaczynamy poważnie wątpić, czy [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetSheHe] nadal jest odpowiednią osobą do kierowania tym przedsięwzięciem!"
 lepsius.472.g: "Czy [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetSheHe] twierdzi, że dinozaury pożarły naszą wyprawę?!"
 lepsius.501.h: "Pozwólmy [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHim] kontynuować badania."
 lepsius.506.f_engine: "Niestety, członkowie naszej wyprawy nie mieli zbyt wiele czasu na dokładniejsze zbadanie grobowca Nieznanego Faraona. Gdy nasi archeolodzy przedzierali się przez komorę grobową, ze stropu zaczęły odpadać odłamki skał, a przez szczeliny w jego górnej części przesypywał się piasek. Najwyraźniej otaczające skały były znacznie bardziej porowate, niż przypuszczano, a oderwany głaz ostatecznie naruszył stabilność całej konstrukcji. Wykazując się przytomnością umysłu, [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] mimo niebezpieczeństwa nie odstąpił od swojego zamiaru i utorował [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] drogę do sarkofagu, po czym rozkazał wszystkim dostępnym ludziom wynieść go na zewnątrz. To wspaniały, jedyny w swoim rodzaju zabytek, który prawdopodobnie wynagrodzi nam utratę pozostałych znalezisk. W końcu cały królewski grobowiec może zawalić się w ciągu zaledwie kilku minut..."
 lepsius.506.f_muscular: "To była prawdziwie historyczna chwila, gdy [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] wkroczył do właściwej komory grobowej. Na [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHim] czekała niezwykła niespodzianka: sarkofag wraz z mumią Nieznanego Faraona nadal spoczywał w miejscu, w którym pochowano go ponad 3000 lat temu! Ponownie miał nam pomóc niezrównanie silny Padewczyk, który podjął się wydobycia drewnianego sarkofagu wraz z mumią z granitowej obudowy. Jednak początkowa radość naszych archeologów szybko ustąpiła miejsca jeszcze większej rozpaczy. Podczas przerwy obiadowej, gdy zespół dzielił się chlebem w ozdobionej galerii, z komory grobowej dobiegł straszliwy trzask i odgłos pękającego drewna. Ku przerażeniu pomocników wykopaliskowych i przywódcy naszej wyprawy okazało się, że olbrzymi siłacz również postanowił zrobić sobie przerwę i przypadkowo usiadł na sarkofagu. Z królewskiej mumii i drewnianej trumny pozostały jedynie szczątki..."
 lepsius.532.f: "Attaché wojskowy wielokrotnie ostrzegał przed wkraczaniem na terytorium Kurdów. Poprzednie wyprawy w te rejony nie miały dobrych doświadczeń z miejscową ludnością. Kurdowie uchodzą za ludzi wolnych i honorowych, ale także dumnych. Wkroczenie na ich ziemie mogłoby wzbudzić ich gniew. [SCOPE.sCharacter('lepsius_military_attache').GetFullName] nalegał więc na uzbrojenie kilku ludzi, aby móc skuteczniej reagować na ewentualne niebezpieczne incydenty. Podczas gdy attaché spodziewa się najgorszego, [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] pragnie jak najszybciej odnaleźć kurdyjskie plemię, rozpocząć negocjacje i osiągnąć polubowne porozumienie, aby jak najszybciej zdobyć lamassu na [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] własność. [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] proponuje podzielenie wyprawy na dwie grupy. Nieuzbrojeni ludzie, niewyszkoleni tragarze oraz większość zapasów i wyposażenia mieliby pozostać w obozie, podczas gdy [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] wyruszyłby naprzód wraz z attaché wojskowym, tworząc bardziej mobilny oddział, który mógłby sprawnie poszukiwać lamassu. Attaché wyraził jednak obawę, że w razie ataku Kurdów pozostawiona część wyprawy byłaby całkowicie bezbronna."
 lepsius.534.f: "Przywódca wyprawy zbyt późno zdał sobie sprawę, że jego ostatnia próba zaskarbienia sobie przychylności miejscowych plemion przyniosła skutek odwrotny do tego, jaki [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] zamierzał osiągnąć. W namiocie rozległ się przeraźliwy krzyk, a niektórzy podwładni instynktownie sięgnęli już po broń. Od tej chwili w powietrzu wisiało napięcie, a attaché wojskowy utwierdził się w przekonaniu, że konfliktu tego nie da się rozwiązać drogą dyplomacji, lecz jedynie siłą. Ma teraz niewiele czasu, aby ustawić przyprowadzonych przez siebie ludzi w szyku bojowym. Niektórzy asystenci naukowi już nalegają, by spakować dobytek i jak najszybciej oddalić się od tego miejsca."
 lepsius.551.f: "[ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetFullNameNoFormatting] pracował tego dnia do późna. Greckie słońce niemiłosiernie prażyło [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] głowę, a wiatr nie nadchodził ani od gór, ani od morza. Nudne i żmudne katalogowanie mało interesujących przedmiotów archeologicznych ciągnęło się całymi dniami. Znaleziska często ograniczały się do mizernych fragmentów potłuczonego szkła i porzuconych kurzych kości, które archeolog przypisywał nie tyle minojskiej kulturze kulinarnej, ile prostackim manierom przy stole wykazywanym przez pomocników wykopaliskowych. W nastroju znużenia i rezygnacji [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] przechadzał się po rozległym terenie słabo zbadanego kompleksu pałacowego. Ostatni raz widziano [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastNameNoFormatting] w pobliżu budowli datowanej na późną epokę brązu lub wczesny okres archaiczny. Wzgórza Krety przeszył huk, który zagłuszył cykady i spłoszył gołębie, gdy pod archeologiem zapadła się ziemia. Pomimo dwudniowych poszukiwań nie udało się go odnaleźć."
 lepsius.552.d: "Kiedy [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] odzyskuje przytomność, [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetFullNameNoFormatting] odkrywa, że [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerselfHimself] znajduje się w nieznanej podziemnej budowli."
 lepsius.552.f: "Było to być może najdziwniejsze doświadczenie w życiu przywódcy wyprawy archeologicznej. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe|U] sądził, że [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] wpadł do króliczej nory ciągnącej się całymi metrami. Szyb był niezwykle wąski, a osuwające się piasek i błoto spychały [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHim] coraz głębiej, niczym ruchome piaski, przez co upadek zdawał się trwać całą wieczność. Nikt nie byłby w stanie podążyć za [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHim], a w ciemnościach nie sposób było czegokolwiek dostrzec, ponieważ żaden promień światła słonecznego nie docierał za [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHim] w głąb szybu. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe|U] poczuł pod [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] dłońmi kamienne płyty, gdy wreszcie uderzył o podłoże. W blasku [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] zapalniczki [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] dostrzegł gładko ociosane ściany, na których zachowały się resztki farby. Były to freski zaginionej kultury, które [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] początkowo chciał przypisać Minojczykom, lecz wkrótce nie potrafił już określić, z którego stulecia pochodziły. Wyraźnie widoczne były płynne przejścia między wpływami minojskimi a mykeńskimi. Rozglądając się wokół, [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastNameNoFormatting] odkrył, że [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerselfHimself] znajduje się w sali przypominającej megaron. Archeolog powoli posuwał się naprzód, ostrożnie szukając [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] drogi po omacku i słysząc echo [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] własnych kroków rozchodzące się po pustej przestrzeni. Dalej ciągnęły się korytarze pozbawione ozdób, przedmiotów i jakichkolwiek charakterystycznych szczegółów, a także rozwidlenia, komnaty i ślepe zaułki. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastNameNoFormatting] zdał sobie sprawę, że [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] trafił do starożytnego labiryntu, którego rozplanowania [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] zupełnie nie znał. Im bardziej [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] sądził, że [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] poznaje jego tajemnice, tym większy i bardziej nieznany wydawał się labirynt..."
 lepsius.553.d: "Po pewnym czasie błądzenia i bezskutecznych prób odnalezienia drogi [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetFullNameNoFormatting] uświadamia sobie, że [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] powrócił do punktu wyjścia labiryntu..."
 lepsius.553.f: "Nogi ciążyły, umysł spowijała mgła – czy to możliwe, że [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] już tu wcześniej był? Ślad na kamiennych płytach, pozostawiony w miejscu, w którym [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] wylądował po tym, jak [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] spadł z góry, nie pozostawiał żadnych wątpliwości. Wraz z narastającym przerażeniem pojawiło się pytanie: jak długo [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] już tu przebywał? Ile godzin minęło? A może dni? I czy [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] zdoła znaleźć wyjście, zanim głód i pragnienie doprowadzą do śmierci...?"
 lepsius.554.d: "W labiryncie zaginiony archeolog natrafia na mozaikę. Pozostaje pytanie, czy [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] wybierze jeden z dwóch korytarzy, czy też schody."
 lepsius.554.f: "Pośród jednakowo wyglądających korytarzy i schodów [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetFullNameNoFormatting] dociera do większej komnaty. Na lewo i na prawo otwierają się korytarze, a schody prowadzą zarówno w górę, jak i w dół. Wzrok przyciąga mozaika na posadzce. Morska scena potwierdza tezę, że ściany mogą pochodzić z czasów minojskich, podczas gdy rzadkie ozdoby świadczą o wpływach mykeńskich. Przedstawieni bogowie są poprzednikami klasycznego greckiego panteonu. Otoczony delfinami ojciec bogów Zeus wyciąga ramię ku niebu, dzierżąc błyskawicę. Demeter i Persefona wskazują na zachód, trzymając w dłoniach kłosy zboża, Artemidzie zaś towarzyszą dwa lwy spoglądające ku wschodowi. Wreszcie Posejdon, ojciec bogów Mykeńczyków, trójzębem sprawia, że ziemia drży pod jego stopami."
 lepsius.557.d: "W jednej z sal [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetFullNameNoFormatting] ponownie natrafia na zagadkę."
 lepsius.557.f: "Cztery przejścia. Cztery obrazy. Nad każdym przejściem więzień labiryntu dostrzega kontury wyryte w kamieniu. Mija trochę czasu, zanim [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] uświadamia sobie, że przedstawiają one zarysy wysp. Dzięki [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] doświadczeniom zdobytym na Krecie [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] potrafi z grubsza je rozpoznać. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe|U] przyporządkowuje pierwsze przejście wyspie Rodos, drugie wyspie Delos, trzecie wyspie Eubei, a czwarte wyspie Naksos. Niestety, [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] nie potrafi odnaleźć żadnych dalszych wskazówek."
 lepsius.558.d: "Po kilku dniach nasz zespół wykopaliskowy odnalazł zaginionego archeologa w pobliżu urwiska. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetFullNameNoFormatting] był całkowicie wyczerpany i od tamtej pory cierpi na zaburzenia świadomości."
 lepsius.558.f: "Pozostaje zagadką, gdzie [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetFullNameNoFormatting] przebywał przez ostatnie 72 godziny. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe|U] został odnaleziony kilka mil od właściwego stanowiska archeologicznego, w opłakanym stanie, jakby padł ofiarą ataku dzikiego zwierzęcia. Chociaż [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] odzyskał już przytomność, lekarz wyprawy uważa, że [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] musiał doznać silnego uderzenia w głowę. W każdym razie wydaje się, że [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] ośrodek mowy został uszkodzony. Raz po raz [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] zaczyna mówić niemal jak w obłędzie, gdy [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] próbuje opowiedzieć o tym, co się wydarzyło. Zespół opuścił okolicę w obawie, że [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] może ponownie wyruszyć na poszukiwania, aby udowodnić, że [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] nie postradał zmysłów."
 lepsius.559.f: "Wczoraj wieczorem policja przeprowadziła oględziny zwłok byłego archeologa. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetFullNameNoFormatting] stał się znany opinii publicznej przede wszystkim z powodu choroby psychicznej, która pojawiła się po tym, jak [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] zaginął w tajemniczych okolicznościach podczas wykopalisk na Krecie, a kilka dni później został odnaleziony w równie zagadkowych okolicznościach. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe|U] od tamtej pory nie był już tą samą osobą. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe|U] obawiał się samotności i wydawało się, że [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] dostrzega potwory czające się w cieniu. Ostatecznie [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] mógł zasnąć jedynie przy zapalonym świetle, ponieważ koszmary nie pozwalały [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHim] spać przez całą noc. W ostatnich dniach [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] życia Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastNameNoFormatting] nie tylko popadł w silne uzależnienie od leków, a jego stan fizyczny i psychiczny wyraźnie się pogorszył, lecz także [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] stał się obiektem drwin ze strony [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] kolegów ze środowiska naukowego z powodu niedorzecznych twierdzeń dotyczących [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] badań na Krecie. Odrzucony przez świat nauki, wyśmiewany w gazetach i przypominający już tylko karykaturę [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] dawnego ja, pozostawił po sobie tragiczną historię. Śledczy są zgodni, że [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] odebrał [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] własne życie."
 lepsius.560.f: "Początkowo Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastNameNoFormatting] był zaskoczony, jak daleko od dawnego stanowiska archeologicznego [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] ponownie ujrzał światło słoneczne. Minęło kilka godzin, zanim [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] dołączył do pozostałych uczestników wyprawy wykopaliskowej, ku wielkiej uldze [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] współpracowników. Tam, ku zdumieniu wszystkich obecnych, [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] zdołał opowiedzieć o [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] znalezisku – prawdziwie niezwykłym odkryciu, które być może zmieni sposób, w jaki dotychczas interpretowaliśmy mity starożytnych Greków. Tajemniczy kłębek tkaniny, który [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] tam odnalazł, pozwala wyciągnąć tylko jeden wniosek."
 lepsius.561.f: "Mgła spowija wzgórza Jukatanu, gdy kolumna przedziera się przez tropikalną dżunglę. W oddali rozlegają się ryki jaguarów, powietrze roi się od komarów, a gorączka powala niejednego z naszych pomocników. Z wyprawy pozostała zaledwie trzyosobowa grupa i kilku tragarzy. [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] daje znak do zatrzymania się. Wśród roślinności sterczą stele i rzeźbione kamienie, a częściowo zasypane, śliskie od mchu schody prowadzą na zrujnowany taras. Z dżungli wyłania się zarys piramidy Majów. [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetSheHe|U] nadstawia ucha, gdy jeden z tragarzy podnosi rękę i woła: „Patrón! Otwór!”"
 lepsius.562.f: "Nalegając, by wejść samotnie, przywódca wyprawy mija wybielone kości wcześniejszego śmiałka i staje przed płytą pokrytą licznymi glifami. Cztery wgłębione kartusze przedstawiające oblicza wielkich bogów można naciskać niczym przyciski. Pod nimi widnieje dwuwiersz: ten, który wschodzi na wschodzie, jaśnieje w zenicie, zachodzi o zmierzchu i odmierza kolejne dni. Mechanizm jest ewidentnie próbą, a jeden błąd może sprowadzić na [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetHerHis] głowę zgubę."
 lepsius.563.f: "Odgłos kroków odbija się echem w wąskim korytarzu. W świetle pochodni na ścianach połyskują ryte zdobienia, a korzenie olbrzymich drzew przebijają się przez zawalone nadproże. Dalej otwiera się komnata, w której centrum stoi niski ołtarz, a spoczywający na nim posążek lśni słabo w mroku. [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetSheHe|U] waży w lewej dłoni sakiewkę z piaskiem, trzymaną w [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetHerHis] ręce, prawą zaś ocenia ciężar posążka i uspokaja [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetHerHis] oddech. Jeden sprawny ruch, szybka zamiana i droga powrotna."
 lepsius.564.d: "Być może [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] błędnie odczytał zagadkę, a może budowniczowie po prostu nikomu nie ufali. Rozlega się ogłuszający huk, a ogromna kamienna kula odrywa się i z impetem toczy korytarzem wprost na [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetHerHim]."
 lepsius.564.f: "Zamiana została dokonana, a woreczek spoczywa na ołtarzu. Przez krótką chwilę nic się nie dzieje. Nagle ziemia zaczyna drżeć, z sufitu osypuje się pył, a z góry dobiega ogłuszający huk – to gigantyczny toczący się głaz!"
 lepsius.565.d_wrong: "Kiedy [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] zatacza się na zewnątrz, ku światłu dnia, czeka jeszcze gorsza niespodzianka: obóz został opanowany przez napastników, a uzbrojeni mężczyźni żądają oddania posążka, grożąc, że w przeciwnym razie [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetHerHis] życie będzie zagrożone."
 lepsius.565.f_right: "Była to próba sprytu, a nie siły. Wybór K'inich Ajawa, Władcy Słońca, który „odmierza kolejne dni”, pozwolił [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetHerHim] uniknąć śmiercionośnych pułapek mechanizmu. Po przejściu bez szwanku przez wszystkie zabezpieczenia [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] zdobywa posążek i pospiesznie kieruje się ku wyjściu. Wkrótce do [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetHerHim] dociera wiadomość, że zbliża się konkurencyjna wyprawa, dlatego zespół natychmiast opuszcza stanowisko archeologiczne."
 lepsius.565.f_wrong_right: "Uciekając korytarzem, [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] chwyta się korzenia i odskakuje na bok, podczas gdy kamienna kula przetacza się obok z ogromną prędkością i roztrzaskuje się w dżungli. Na zewnątrz leżą porozrzucane włócznie i ciała poległych – pozostałości po zasadzce udaremnionej przez tę samą pułapkę. [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetSheHe] nie ma czasu, by dokładnie zbadać miejsce zdarzenia. [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetSheHe|U] nie może tego udowodnić, ale wszystko wskazuje na udział zagranicznego rywala, który zamierzał wykorzystać nas do uruchomienia pułapek. Nieważne – czas ruszać dalej."
 lepsius.565.f_wrong: "Ostatnim skokiem [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetFullName] dociera do wyjścia, lecz natychmiast zostaje otoczony przez łuczników. Spośród drzew dobiega aksamitny głos z lekkim [SCOPE.sCountry('lepsius_archaeological_rival').GetAdjectiveNoFlag] akcentem, a naprzód wychodzi mężczyzna ubrany w jasny len: „Nareszcie miło się spotkać. Ale ten okaz powinien trafić w lepsze ręce”. W obliczu przewagi liczebnej przeciwników i śmierci tragarzy [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetSheHe|U] oddaje posążek. „Szkoda, że Hovitos nie znają cię tak dobrze jak ja” – mruczy [SCOPE.sCharacter('lepsius_archaeological_expedition_leader').GetSheHe], po czym korzysta z nadarzającej się okazji do ucieczki, odchodząc z pustymi rękami."
 lepsius.581.d: "[SCOPE.sCharacter('lepsius_lostworld_leader').GetFullName] zgłosił się do nas z osobistą sprawą: [SCOPE.sCharacter('lepsius_lostworld_leader').GetSheHe] pragnie udowodnić, że „Zaginiony Świat” naprawdę istnieje, i tym samym odzyskać swój honor. [SCOPE.sCharacter('lepsius_lostworld_leader').GetSheHe|U] zbiera fundusze na prywatną wyprawę."
 lepsius.581.f: "Minęło kilka lat, odkąd znaczna część wyprawy na Jukatan zaginęła w tajemniczych okolicznościach. [SCOPE.sCharacter('lepsius_lostworld_leader').GetFullName] od tamtej pory stał się pośmiewiskiem środowiska naukowego. Karykatury w gazetach przedstawiają [SCOPE.sCharacter('lepsius_lostworld_leader').GetHerHim] jako szaleńca z powodu [SCOPE.sCharacter('lepsius_lostworld_leader').GetHerHis] „opowieści o dinozaurach”. Trauma pozostawiła głębokie blizny: [SCOPE.sCharacter('lepsius_lostworld_leader').GetSheHe] ma obsesję na punkcie udowodnienia światu, że rzekoma dolina naprawdę istnieje. Podobno [SCOPE.sCharacter('lepsius_lostworld_leader').GetSheHe|U] przeznaczył już cały [SCOPE.sCharacter('lepsius_lostworld_leader').GetHerHis] spadek na zorganizowanie wyprawy na własny koszt, wykorzystując wszystkie [SCOPE.sCharacter('lepsius_lostworld_leader').GetHerHis] środki. Oczywiście [SCOPE.sCharacter('lepsius_lostworld_leader').GetSheHe] zwrócił się również do państwa z prośbą o wsparcie dla [SCOPE.sCharacter('lepsius_lostworld_leader').GetHerHis] całkowicie szalonej podróży. Nasi eksperci odradzają tę samobójczą misję – wszyscy pamiętają, jak zakończyła się ostatnia wyprawa na Jukatan. Pojawiają się więc głosy domagające się całkowitego zakazania takiej wyprawy. Mogłoby to jednak tylko pogorszyć [SCOPE.sCharacter('lepsius_lostworld_leader').GetHerHis] stan psychiczny. Inni uważają, że [SCOPE.sCharacter('lepsius_lostworld_leader').GetSheHe] powinien otrzymać zgodę na wyjazd, ale bez żadnego dalszego oficjalnego zaangażowania. W końcu nikt nie chce być kojarzony z podróżą człowieka, który najwyraźniej cierpi na zaburzenia psychiczne. Jedynie nieliczni są gotowi sięgnąć do własnych kieszeni, aby sfinansować to szaleństwo. Argumentują, że rzekomo ponosimy odpowiedzialność za [SCOPE.sCharacter('lepsius_lostworld_leader').GetHerHis] stan..."
 lepsius.581.h: "Niech [SCOPE.sCharacter('lepsius_lostworld_leader').GetSheHe] poluje na [SCOPE.sCharacter('lepsius_lostworld_leader').GetHerHis] dinozaury."
 lepsius.582.f: "Kilka miesięcy po tym, jak [SCOPE.sCharacter('lepsius_lostworld_leader').GetSheHe] zniknął w lasach Jukatanu, wyczerpany podróżnik ponownie pojawił się w stolicy prowincji, Méridzie. Po raz kolejny [SCOPE.sCharacter('lepsius_lostworld_leader').GetSheHe] stracił wielu pomocników, a reszta [SCOPE.sCharacter('lepsius_lostworld_leader').GetHerHis] grupy znajdowała się w opłakanym stanie. Jednak oprócz licznych świadków [SCOPE.sCharacter('lepsius_lostworld_leader').GetSheHe] dysponował jednym niepodważalnym dowodem: współczesnymi fotografiami, których autentyczność potwierdziło kilku uczonych. Dzięki nim [SCOPE.sCharacter('lepsius_lostworld_leader').GetSheHe] mógł przedstawić niezaprzeczalne dowody na prawdziwość [SCOPE.sCharacter('lepsius_lostworld_leader').GetHerHis] niewiarygodnych opowieści. I rzeczywiście: na zdjęciach wyraźnie widać pterozaury oraz roślinożerne brontozaury! Ludzie okrzyknęli [SCOPE.sCharacter('lepsius_lostworld_leader').GetFullName] bohaterem, środowisko naukowe jest wstrząśnięte, a nasz rząd uchodzi za bandę upartych ignorantów, którzy odmówili narodowemu bohaterowi sławy, na jaką [SCOPE.sCharacter('lepsius_lostworld_leader').GetSheHe] zasługuje!"
 lepsius.583.d: "Od miesięcy nie mamy żadnych wieści od [SCOPE.sCharacter('lepsius_lostworld_leader').GetFullName]. Najwyraźniej [SCOPE.sCharacter('lepsius_lostworld_leader').GetSheHe] zaginął w nieznanych ostępach lasów Jukatanu."
 lepsius.583.f: "Być może pewnego dnia powstaną tragedie teatralne opowiadające o tych wydarzeniach. [SCOPE.sCharacter('lepsius_lostworld_leader').GetFullName], który pod koniec [SCOPE.sCharacter('lepsius_lostworld_leader').GetHerHis] życia był już bliski obłędu, najwyraźniej do samego końca poszukiwał śladów rzekomej doliny dinozaurów. Choroby i wrogie plemiona Majów doprowadziły do zagłady [SCOPE.sCharacter('lepsius_lostworld_leader').GetHerHis] wyprawy. Jeden z nielicznych ocalałych relacjonuje, że [SCOPE.sCharacter('lepsius_lostworld_leader').GetFullName] po raz ostatni twierdził, iż ponownie odnalazł zbocza płaskowyżu, na którym znajduje się dolina. Jednak ostatni pozostali przy nim ludzie mieli się zbuntować i powrócić do domów. Nikt nie wie, co stało się z [SCOPE.sCharacter('lepsius_lostworld_leader').GetHerHim]. Mamy jednak powody przypuszczać, że pozostawszy w samotności i skrajnie wycieńczony, [SCOPE.sCharacter('lepsius_lostworld_leader').GetSheHe] miał niewielkie szanse na przetrwanie zagrożenia, które ostatecznie doprowadziło do [SCOPE.sCharacter('lepsius_lostworld_leader').GetHerHim] śmierci."
 lepsius.583.g: "[SCOPE.sCharacter('lepsius_lostworld_leader').GetSheHe|U] naprawdę nie był złym człowiekiem. Kiepskim odkrywcą, owszem, ale nie złym człowiekiem."
 lepsius.584.f: "Wszyscy spodziewali się, że ta podróż nie potrwa długo. Albo trudne warunki skażą uczestników wyprawy na śmierć, albo wybuchnie bunt. Tym większe było zdumienie, gdy pewnego ranka dokonano niezwykłego odkrycia. [SCOPE.sCharacter('lepsius_lostworld_leader').GetFullName] od wielu dni prowadził oddział przez nieprzebyte lasy Jukatanu niczym poszukiwacz ogarnięty obsesją. Sprawiał wrażenie, jakby [SCOPE.sCharacter('lepsius_lostworld_leader').GetSheHe] rozpoznawał każde drzewo i każdy kamień. Pozostali członkowie wyprawy uznawali to albo za oznakę szaleństwa, albo za część misternie obmyślonego planu mającego ich zwieść i dać im fałszywą nadzieję. Teraz jednak, na zboczach rozległego płaskowyżu, w którego zagłębieniu znajduje się legendarna dolina, o której [SCOPE.sCharacter('lepsius_lostworld_leader').GetSheHe] opowiadał od lat, niektórzy zaczynają zmieniać zdanie. Krzyk pterodaktyla rozbrzmiewa w powietrzu i przeszywa uszy uczestników wyprawy tak przenikliwie, że rozwiewa wszelkie wątpliwości."
 lepsius.586.f: "Właściwie [SCOPE.sCharacter('lepsius_lostworld_leader').GetFullName] powinien być zadowolony: [SCOPE.sCharacter('lepsius_lostworld_leader').GetSheHe] miał rację we wszystkich [SCOPE.sCharacter('lepsius_lostworld_leader').GetHerHis] twierdzeniach. Zespół zebrał już cały szereg dowodów, które powinny wywołać sensację w ojczyźnie. Jednak w miarę dokładniejszego badania Zaginionego Świata coraz wyraźniej okazuje się, że [SCOPE.sCharacter('lepsius_lostworld_leader').GetSheHe] nie był pierwszym człowiekiem, który dotarł do tej doliny. W rzeczywistości wiele wskazuje na znaczącą obecność Majów na tym obszarze około 1500 lat temu. Najwyraźniej mieszkańcy nieznanego dotąd miasta Majów regularnie odwiedzali tę dolinę. [SCOPE.sCharacter('lepsius_lostworld_leader').GetFullName] przypuszcza, że właśnie tutaj mogła narodzić się tradycja składania ofiar z ludzi. Tak czy inaczej, istnieją mocne dowody na to, że dolina pełniła funkcje religijne. Jeden ze współpracowników niedawno odkopał artefakty Majów, co sugeruje, że ich odkrycie może wywołać jeszcze większą sensację niż kilka rozproszonych po dolinie olbrzymich jaszczurów. Problem polega na tym, że domniemane stanowisko Majów znajduje się w samym środku obszaru zamieszkanego przez drapieżne dinozaury! Większość członków wyprawy nalega więc na natychmiastowy powrót do domu, zamiast podejmowania kolejnej samobójczej misji."
 lepsius.587.f: "Tylko jeden ocalały. Nic więcej nie pozostało z wyprawy. Jest nim młody asystent naukowy z uniwersytetu. Doznał ciężkiej traumy i znajduje się w złym stanie fizycznym. Tak wynika z telegramu nadesłanego z Jukatanu. Nie udało się wydobyć od niego zbyt wielu informacji. Najwyraźniej przywódca naszej wyprawy popełnił kluczowy, tragiczny błąd podczas próby zbadania stanowiska Majów w Zaginionym Świecie. Błąd, za który niemal wszyscy członkowie wyprawy zapłacili życiem. Incydent wywołał tak wielki wstrząs, że na czas nieokreślony zakazano wszelkich wypraw na Jukatan, które nie miały ściśle archeologicznego charakteru."
 lepsius.587.g: "[SCOPE.sCharacter('lepsius_lostworld_leader').GetSheHe|U] dokonał... złego wyboru."
 lepsius.588.f: "Kukulkan był znany Majom jako Pierzasty Wąż – bóstwo czczone przez Azteków pod imieniem Quetzalcoatl. Czy to przypadek, że Majowie wiedzieli o istnieniu tej doliny? Czy istniał związek między Zaginionym Światem a kultem Kukulkana? [SCOPE.sCharacter('lepsius_lostworld_leader').GetFullName] nie potrafi jeszcze tego rozstrzygnąć. Udało się jednak odkryć, że [SCOPE.sCharacter('lepsius_lostworld_leader').GetSheHe] natrafił pośród gniazd drapieżnych dinozaurów na dawno zapomniane sanktuarium poświęcone Pierzastemu Wężowi, znanemu w tych stronach jako Kukulkan. Szczególną uwagę przyciągał tajemniczy klejnot osadzony w amulecie. Był tak niezwykle piękny, że przywódca wyprawy nazwał go „Klejnotem Kukulkana” – bóstwa, które posiadało klejnot pozwalający mu władać wiatrem. Jest to prawdopodobnie jedno z najwspanialszych odkryć archeologicznych w Ameryce Środkowej i Południowej."
 lepsius.588.g: "[SCOPE.sCharacter('lepsius_lostworld_leader').GetSheHe|U] dokonał mądrego wyboru."
 lepsius.589.d: "Nasza wyprawa z Zaginionego Świata, dowodzona przez [SCOPE.sCharacter('lepsius_lostworld_leader').GetFullName], powróciła. [SCOPE.sCharacter('lepsius_lostworld_leader').GetSheHe|U] wraz ze swoim zespołem jest witany przez ludność jak bohater."
 lepsius.589.g: "Chwała [SCOPE.sCharacter('lepsius_lostworld_leader').GetHerHim]!"
 lepsius.803.d: "[SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetFullName] zakończył przygotowania do podróży. [SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetSheHe|U] wyruszy dziś, aby pogłębić naszą wiedzę dzięki badaniom na istniejącym już stanowisku archeologicznym."
 lepsius.803.f: "Przewiduje się, że nasz archeolog będzie nieobecny przez około rok, choć czas ten może się różnić w zależności od okoliczności. Po zakończeniu [SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetHerHis] działalności [SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetSheHe] udostępni nowe stanowisko wykopaliskowe, którego jakość może być różna. [SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetSheHe] odnajdzie również wskazówki dotyczące nieznanych dotąd stanowisk archeologicznych."
 lepsius.811.f_vok: "[SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetFullName] donosi, że [SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetSheHe] odkrył niewielki grobowiec w Dolinie Królów. Najwyraźniej rabusie grobów zdążyli już ukraść znaczną część znajdujących się w nim przedmiotów, a zachowane graffiti świadczą o tym, że grobowiec był znany również w późnej starożytności. Przywódcy wyprawy postanowili przeprowadzić tam wykopaliska w nadziei, że w przyszłości uda się poinformować o kolejnych znaleziskach."
 lepsius.811.f_ass: "Wykopaliska w Asyrii od samego początku napotykały trudności. Po kilku dniach [SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetFullName] wciąż nie zdołał znaleźć odpowiedniego stanowiska archeologicznego, więc [SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetSheHe] musiał zadowolić się pierwszym w miarę dogodnym miejscem. Jak dotąd udało się odkopać jedynie fundamenty świątynki, która niegdyś mogła stanowić część większego kompleksu."
 lepsius.812.f_bab: "Czas nie zatarł wszystkich świadectw dawnej potęgi Babilonii w Mezopotamii. Gdy [SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetFullName] uzupełnił [SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetHerHis] zapasy wody, miejscowi mieszkańcy opowiedzieli [SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetHerHim] o tajemniczych ruinach, których pobożni muzułmanie z tego regionu unikają ze względu na ich pogańskie pochodzenie. Jak się okazało, są to pozostałości zigguratu. Kompleks jest zaskakująco dobrze zachowany, a według najnowszych doniesień nasi archeolodzy zdołali już nawet odkopać pierwsze artefakty."
 lepsius.813.f_vok: "Dziś rano nadszedł telegram z sensacyjnymi wieściami. [SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetFullName] donosi, że [SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetSheHe] odkrył grobowiec królowej. Tożsamość zmarłej małżonki władcy nie jest jeszcze całkowicie jasna, ale według wstępnych doniesień komora grobowa zachowała się w zaskakująco nienaruszonym stanie. Malowidła ścienne i cenne artefakty dostarczają niezwykle wartościowych informacji o starożytnym Egipcie, rzucając nowe światło na dawno zapomniane aspekty jego historii."
 lepsius.813.f_bab: "Legendy o bramach i murach miejskich Babilonu przetrwały tysiące lat. Jednak czym innym jest słuchać o nich opowieści, a czym innym zobaczyć je na własne oczy. Początkowo [SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetFullName] nie mógł uwierzyć własnym oczom, gdy [SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetSheHe] przemierzał kolejne mury i odkrywał ogromne rozmiary zaginionego miasta. To odkrycie zapewni nam zajęcie na wiele nadchodzących lat."
 lepsius.813.f_ass: "Asyryjczycy byli nie tylko potęgą militarną, ale słynęli również ze swoich ogrodów. Niektórzy twierdzą nawet, że słynne Ogrody Babilonu znajdowały się w rzeczywistości w asyryjskiej stolicy, Niniwie. Podczas wykopalisk na terenie kompleksu pałacowego i przylegających do niego tarasów [SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetFullName] mógł na [SCOPE.sCharacter('lepsius_archaeological_excavation_leader').GetHerselfHimself] własne oczy przekonać się o wspaniałości kultury asyryjskiej. Dyrekcja muzeum nie kryje radości."
 lepsius.2191.t: "Odkopano Kompleks Łaźni Inków"
 lepsius.2191.d: "Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] dokonał niezwykłego odkrycia w [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName]. Podczas wykopalisk odsłonięto kompleks łaźni pochodzący z czasów Imperium Inków. Wstępne przypuszczenia wskazują, że kompleks był wykorzystywany do ceremonii rytualnych."
 lepsius.2191.f: "„Czy to nie ironia, że odkopaliśmy łaźnię, a teraz sami przydałaby nam się kąpiel?”"
 lepsius.2191.g: "Kąpiel byłaby teraz wspaniała!"
 lepsius.2192.t: "Odkryto Czaszkę Inki z Otworem"
 lepsius.2192.d: "W [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] dokonano niezwykłego odkrycia. Podczas wykopalisk na stanowisku Inków profesor [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] natrafił na liczne kości. Szczególną uwagę [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] przykuła jedna z czaszek. Znajdował się w niej otwór, który najwyraźniej wykonano celowo. Wygląda na to, że zmarły przeżył zabieg, ponieważ otwór zdążył się częściowo zasklepić."
 lepsius.2192.f: "„Jestem pewien, że musiała to być ofiara z człowieka! Jak myślisz?”"
 lepsius.2192.g: "Kosmici!"
 lepsius_recent_excavation_inspection_modifier: "Niedawna Inspekcja Archeologiczna"
 lepsius.2193.t: "Górskie Mumie Inków"
 lepsius.2193.d: "Podczas wyprawy z [SCOPE.sCharacter('lepsius_mountaineer_character_scope').GetFullName] w [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] dokonał wstrząsającego odkrycia. Na jednej z gór odnaleziono zmumifikowane szczątki młodej dziewczynki. Wygląda na to, że padła ona ofiarą inkaskiego rytuału „qhapaq hucha”, polegającego na składaniu dzieci w ofierze. Choć jest to tragiczne znalezisko, może dostarczyć wielu nowych informacji na temat cywilizacji Inków."
 lepsius.2193.f: "„Panował przenikliwy mróz, wiatr szarpał nasze ubrania, a my ledwo cokolwiek widzieliśmy. Kiedy zauważyliśmy ciało, początkowo sądziliśmy, że to alpinista, który zginął w podobnych warunkach do tych, z jakimi sami musieliśmy się teraz zmagać. Wkrótce jednak zdaliśmy sobie sprawę, że nie był to alpinista, lecz młoda dziewczynka”."
 lepsius.2193.g: "To naprawdę smutne."
 lepsius.2194.t: "Ruiny Inków"
 lepsius.2194.d: "Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] dokonał odkrycia w odległym zakątku [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName]. Odnalazł liczne ruiny z czasów Imperium Inków. Większość z nich nosi ślady pożaru, a znalezione przedmioty pochodzenia europejskiego sugerują, że osada została zniszczona przez Hiszpanów. Prawdopodobnie również ją splądrowali, ponieważ nie natrafiono na żadne inne znaleziska. Wygląda na to, że wszystko, co miało jakąkolwiek wartość, zostało zabrane."
 lepsius.2194.f: "„Dawno temu te ruiny musiały być solidnie zbudowanymi domostwami. Wygląda na to, że potrafiły przetrwać nawet trzęsienia ziemi. Tylko że... hiszpańscy najeźdźcy okazali się najwyraźniej potężniejsi od trzęsień ziemi”."
 lepsius.2194.g: "Nie ma złota? To po co w ogóle się trudzić?"
