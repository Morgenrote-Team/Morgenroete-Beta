 lepsius_research_charter_tech: "Wyprawy Badawcze i Licencje Badawcze"
 lepsius_research_charter_tech_desc: "W 1835 roku Egipt uchwalił ustawę zobowiązującą cudzoziemców do uzyskania rządowego pozwolenia na prowadzenie wykopalisk archeologicznych. Ustanowiło to precedens. Również inne projekty badawcze i wyprawy wymagały współpracy z krajem goszczącym. Kompleksowa [concept_mr_research_charter] daje zatem wnioskodawcom możliwość eksplorowania obcych krajów."
