 je_lepsius_persepolis: "Klejnot Imperium Achemenidów"
 je_lepsius_persepolis_reason: "Persepolis było wychwalane już przez starożytnych pisarzy i historyków. To miejsce, które przez stulecia przyciągało podróżników z odległych krain, nigdy tak naprawdę nie popadło w zapomnienie, między innymi za sprawą legendy o Aleksandrze Wielkim, który obrał tę starożytną stolicę Imperium Perskiego za cel swojego najazdu. Jednak współczesne wykopaliska archeologiczne wciąż pozostają do przeprowadzenia."
 lepsius.69.t: "Persepolis"
 lepsius.69.d: "Minęło niemal dwa i pół tysiąca lat, odkąd wojska Aleksandra Wielkiego zniszczyły wspaniałe Persepolis, lecz [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] wraz z zespołem [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] pracuje nad ocaleniem tego, co można jeszcze ocalić, odzyskaniem tego, co można jeszcze odzyskać, i zrozumieniem tego, co można jeszcze zrozumieć. Wreszcie, po wszystkich grabieżach i zniszczeniach, możliwe staje się przeprowadzenie naukowych badań tego miasta."
 lepsius.69.f: "„Persepolis było stolicą królestwa perskiego. Aleksander przedstawił je Macedończykom jako najbardziej znienawidzone ze wszystkich miast Azji i oddał swoim żołnierzom na łup, oszczędzając jedynie pałace. Było to najbogatsze miasto pod słońcem, a przez lata prywatne domostwa wypełniono wszelkiego rodzaju bogactwami. Macedończycy wdarli się do miasta, mordując wszystkich napotkanych mężczyzn i plądrując domostwa. Wiele z tych domów należało do zwykłych mieszkańców i było obficie wyposażonych w meble oraz wszelkiego rodzaju odzież”.\n – Diodor Sycylijski"
 lepsius.2271.t: "Wisiorki Tairona"
 lepsius.2271.d: "Podczas lokalnych wykopalisk archeologicznych odkryto cenne złote wisiorki. Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] szczegółowo zbadał już te wyjątkowe ozdoby i uważa je za arcydzieła sztuki prekolumbijskiej."
 lepsius.2271.f: "Tairona byli wysoko rozwiniętą cywilizacją prekolumbijską zamieszkującą góry Sierra Nevada de Santa Marta na terenie dzisiejszej Kolumbii. Słynęli z niezwykłych umiejętności inżynieryjnych, dzięki którym przystosowali strome zbocza górskie do osadnictwa, budując rozbudowane kamienne tarasy, systemy odwadniające i brukowane ścieżki. Ich społeczeństwo było zorganizowane w rywalizujące ze sobą wodzostwa, takie jak Bonda i Pocigüeica, które łączyła wspólna tradycja religijna podtrzymywana przez wpływową kastę kapłańską. Tairona słyną ze swojego „zaginionego złota”, czyli kunsztownych wyrobów złotniczych wykonywanych techniką tumbaga, które często przedstawiały szamańskie przemiany oraz otaczanego czcią jaguara."
 lepsius.2271.g: "Kolumbia jest pełna skarbów archeologicznych!"
 lepsius.2272.t: "Posąg z San Agustín"
 lepsius.2272.d: "Na południu Kolumbii rolnicy donieśli o opuszczonym miejscu, w którym podobno znajduje się kilka tajemniczych posągów. Zespół archeologów dokładniej zbadał jedną z tych zagadkowych figur."
 lepsius.2272.f: "Tajemnicza kultura San Agustín pozostawiła po sobie jedno z najważniejszych stanowisk archeologicznych Ameryki Południowej, położone na wyżynach Kolumbii. Między 200 rokiem p.n.e. a 800 rokiem n.e. nieznani rzeźbiarze stworzyli ponad 500 monumentalnych posągów ze skał wulkanicznych, rozsianych po rozległym górzystym terenie. Rzeźby te, z których niektóre mierzą ponad cztery metry wysokości, strzegą monumentalnych grobowców i ośrodków ceremonialnych. Przedstawienia mają często charakter antropozoomorficzny: ludzkie cechy łączą się w nich z kłami drapieżników, szponami orłów lub wężowymi atrybutami, co wskazuje na głęboko zakorzenione tradycje szamańskie i kult przodków. Szczególnie uderzające są przedstawienia „podwójnego ja”, w których jedna postać niesie drugą na plecach. Ponieważ kultura ta zanikła na wiele stuleci przed przybyciem Hiszpanów i nie pozostawiła po sobie żadnych źródeł pisanych, kamienni strażnicy takich miejsc jak Bosque de las Estatuas pozostają jedną z zagadek archeologii andyjskiej."
 lepsius.2272.g: "Kultura, która pozostawia tak wiele pytań bez odpowiedzi!"
 lepsius.2273.t: "Zabytki Kultury Zenú"
 lepsius.2273.d: "Podczas badań archeologicznych odkryto kilka przedmiotów codziennego użytku pochodzących z kultury Zenú, o czym poinformowano Muzeum w [ROOT.GetCountry.GetCapital.GetCityHubName]."
 lepsius.2273.f: "Lud Zenú (zwany również Sinú) rozwijał się na żyznych nizinach i w dolinach rzecznych północnej Kolumbii. Jego trwałym dziedzictwem jest monumentalny system gospodarki wodnej. Przez stulecia Zenú stworzyli rozległą sieć sztucznych kanałów, które umożliwiały kontrolowane odwadnianie ponad 500 000 hektarów gruntów, pozwalając na intensywną uprawę roli w regionie narażonym na częste powodzie. Ich społeczeństwo dzieliło się na trzy prowincje, z których każda specjalizowała się w produkcji, praktykach religijnych lub obrzędach pogrzebowych. O ich kunszcie rzemieślniczym świadczyły delikatne wyroby złotnicze, przedstawiające głównie zwierzęta wodne i lądowe, a także wyroby plecionkarskie. Tradycja wyplatania kapelusza Sombrero Vueltiao, będącego dziś symbolem narodowym Kolumbii, wywodzi się z plecionkarstwa ludu Zenú."
 lepsius.2273.g: "Lud o niezwykłym kunszcie rzemieślniczym."
 lepsius.2274.t: "Złoto Muisca"
 lepsius.2274.d: "Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] z zachwytem opowiada o skarbie, który [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] wraz z zespołem [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] niedawno zabezpieczył w Andach. Znajdowało się w nim kilka cennych zabytków. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe|U] nie ma najmniejszych wątpliwości: skarby te należały niegdyś do legendarnego ludu Muisca."
 lepsius.2274.f: "Lud Muisca (zwany również Czibcza) zamieszkiwał chłodne wyżyny Andów na terenie dzisiejszej środkowej Kolumbii. Wraz z Inkami, Majami i Aztekami tworzył jedną z czterech najbardziej rozwiniętych cywilizacji obu Ameryk, choć zamiast monumentalnej architektury kamiennej preferował budowle z drewna kryte strzechą. Pod względem politycznym ich ziemie tworzyły Konfederację Muisca, na której czele stali Zipa (Bacatá) i Zaque (Hunza). Ich gospodarka opierała się na rozległej sieci handlowej, obejmującej sól, szmaragdy i tkaniny. Światową sławę przyniosła im legenda o El Dorado: podczas uroczystości objęcia władzy nowy władca rytualnie pokrywał swoje ciało złotem i składał w jeziorze Guatavita ofiary ze złotych figurek zwanych tunjos. Te wspaniałe wyroby złotnicze nie służyły jako środek płatniczy, lecz jako ofiary religijne."
 lepsius.2274.g: "Zaledwie przebłysk bogactw, które niegdyś przepadły..."
 lepsius.550.tt: "Specjalizacja w archeologii egejskiej może pozwolić odkryć tę tajemnicę."
 lepsius.550.t: "Tajemniczy Pałac Minojski"
 lepsius.550.d: "Podczas wyprawy Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] odkrył ruiny niedaleko Knossos, których najwyraźniej nikt wcześniej nie skatalogował."
 lepsius.550.f: "Oczywiście z dawnego kompleksu zachowały się jedynie bardzo skromne pozostałości. Archeolodzy podejrzewają, że większa część pałacu może znajdować się pod ziemią. Wymagałoby to jednak przeprowadzenia zakrojonych na szeroką skalę wykopalisk, co nie jest możliwe podczas tej wyprawy o charakterze ogólnym. Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] postanawia w przyszłości dokładnie zbadać to miejsce."
 lepsius.550.g: "Jakie tajemnice mogą skrywać się w tym pałacu?"
 je_lepsius_mysterious_minoan_palace: "Tajemniczy Pałac Minojski"
 je_lepsius_mysterious_minoan_palace_reason: "Podczas wyprawy nasz zespół archeologiczny odkrył tajemniczy pałac w pobliżu Knossos. Aby odkryć jego sekrety, konieczne jest poświęcenie szczególnej uwagi archeologii egejskiej."
 je_lepsius_the_labyrinth_fail: "Jeśli Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastNameNoFormatting] zbyt często będzie błądzić, istnieje ryzyko, że [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHim] spotka coś bardzo, bardzo złego..."
 je_lepsius_the_labyrinth_success: "Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastNameNoFormatting] wydostaje się z labiryntu, nie błądząc zbyt długo."
 lepsius_labyrinth_progress_bar: "Postęp"
 lepsius_labyrinth_progress_bar_desc: "Postęp Labiryntu: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|1%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/4)"
 lepsius_labyrinth_confusion_bar: "Zamęt"
 lepsius_labyrinth_confusion_bar_desc: "Zamęt w Labiryncie: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|1%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/4)"
 lepsius.2241.t: "Świątynia Khmerska"
 lepsius.2241.d: "Lokalna wyprawa archeologiczna w [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName], kierowana przez Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName], odkryła nieznaną dotąd świątynię z czasów Imperium Angkoru!"
 lepsius.2241.f: "Architektura Imperium Khmerów, która osiągnęła szczyt rozwoju między IX a XIII wiekiem, charakteryzowała się przede wszystkim budową świątyń-gór. Te wznoszone z piaskowca budowle miały symbolizować górę Meru, mityczną siedzibę bogów. Architekci wykorzystywali zaawansowaną technikę sklepień pozornych do tworzenia rozległych kompleksów otoczonych galeriami, które często okalały ogromne fosy symbolizujące kosmiczny ocean. Charakterystycznymi elementami tego stylu były prasaty, czyli wieże zwieńczone kształtem pąka lotosu, oraz płaskorzeźby przekształcające kamienne ściany w bogato zdobione opowieści przedstawiające sceny z mitologii hinduistycznej i dziejów imperium. Jak pokazuje słynny Angkor Wat, styl ten osiągnął doskonałą równowagę między symetrią, monumentalną skalą i misternością detali."
 lepsius.2241.g: "Zdumiewające."
 lepsius.2242.t: "Rzeźby Khmerskie"
 lepsius.2242.d: "W dżungli Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] odkrył kilka wspaniałych khmerskich posągów, których wyjątkowe piękno zachwyciło licznych innych archeologów. Nadal jednak nie ma zgody co do tego, jak należy z nimi postąpić..."
 lepsius.2242.f: "Rzeźba khmerska okresu Angkoru słynie z odejścia od hinduistycznej ikonografii na rzecz odrębnego, lokalnego stylu, podkreślającego spokój i duchowy autorytet. W przeciwieństwie do dynamicznych póz spotykanych w sztuce indyjskiej posągi khmerskie charakteryzują się hieratycznym bezruchem i poczuciem monumentalnej trwałości. Wczesne dzieła często przedstawiały hinduistyczne bóstwa, takie jak Wisznu i Śiwa, o potężnych, atletycznych sylwetkach. Jednak „styl Angkor Wat” wprowadził bardziej wyszukane proporcje i bogato zdobioną biżuterię. Pod koniec XII wieku, za panowania króla Dżajawarmana VII, głównym źródłem inspiracji stał się buddyzm mahajany. W epoce tej narodził się charakterystyczny „styl Bayon”, słynący z Uśmiechu Angkoru, czyli wyrazu twarzy o przymkniętych oczach i lekko uniesionych kącikach ust, symbolizującego wewnętrzny spokój i oświecenie wolne od ziemskich przywiązań."
 lepsius.2242.g: "Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] powinien dokładnie zbadać posągi."
 lepsius.2242.h: "Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] powinien pociąć posągi na części i wysłać je do muzeum."
 lepsius.2243.t: "Zabytki Khmerskie"
 lepsius.2243.d: "Zespół archeologiczny w [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] odkrył zbiór zabytków z czasów Imperium Angkoru. Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] zabezpieczył naczynia z brązu oraz wyroby ceramiczne."
 lepsius.2243.f: "Choć monumentalna architektura i rzeźba zajmują najważniejsze miejsce w historii sztuki khmerskiej, rzemieślnicy Khmerów osiągnęli mistrzostwo również w wielu innych dziedzinach. Odlewnictwo brązu stanowiło szczyt ich umiejętności metalurgicznych. Wykorzystując technikę wosku traconego, rzemieślnicy tworzyli kunsztowne naczynia rytualne, okucia palankinów i dzwony, często zdobione misternymi motywami roślinnymi lub przedstawieniami mitycznych istot, takich jak Garuda. Równie ważną rolę odgrywała ceramika, zwłaszcza charakterystyczne naczynia kamionkowe pokryte brązowym szkliwem, wytwarzane w prowincjonalnych warsztatach garncarskich. Naczynia te, często przybierające kształty zwierząt, takich jak słonie czy sowy, służyły do przechowywania wapna używanego podczas żucia betelu lub cennych olejków. Khmerowie byli również mistrzami jubilerstwa i złotnictwa, wykonując z kutego złota masywne naszyjniki, naramienniki i diademy, którymi ozdabiano zarówno członków rodziny królewskiej, jak i drewniane posągi kultowe."
 lepsius.2243.g: "Nowe eksponaty do naszego muzeum."
 lepsius.2244.t: "Historia Khmerów"
 lepsius.2244.d: "Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] zebrał swoją dotychczasową wiedzę o khmerskim Imperium Angkoru w monografii. Książka już teraz jest uznawana za fundamentalne dzieło w tej dziedzinie."
 lepsius.2244.f: "Imperium Khmerów, zwane również Imperium Angkoru, wyłoniło się na początku IX wieku jako dominująca potęga Azji Południowo-Wschodniej, obejmując znaczną część terenów dzisiejszej Kambodży, Tajlandii, Laosu i Wietnamu. Założone w 802 roku n.e. przez Dżajawarmana II, który ogłosił się „władcą wszechświata” (ćakrawartinem), imperium zjednoczyło liczne, wcześniej niezależne księstwa dzięki połączeniu hinduistyczno-buddyjskiej koncepcji władzy królewskiej z zaawansowaną inżynierią wodną. Dobrobyt imperium opierał się na rozbudowanym systemie barajów (zbiorników wodnych) i kanałów, które umożliwiały intensywną uprawę ryżu i zapewniały utrzymanie ogromnej liczbie ludności. W okresie największej świetności w XII wieku Khmerowie osiągnęli szczyt potęgi politycznej i rozkwitu artystycznego, wznosząc monumentalne stolice, takie jak Angkor Thom. Jednak w XIV i XV wieku imperium zaczęło podupadać wskutek splotu czynników, takich jak problemy ekologiczne, wzrost potęgi królestw tajskich oraz zmiany przebiegu szlaków handlowych, co ostatecznie doprowadziło do opuszczenia Angkoru."
 lepsius.2244.g: "Ta książka powinna trafić do Biblioteki Narodowej."
 lepsius.2251.t: "Skarb Monet Aksumickich"
 lepsius.2251.d: "Podczas lokalnych wykopalisk archeologicznych w [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] odkryto bogaty skarb monet z późnej starożytności. Udało się zabezpieczyć zarówno monety rzymskie, jak i aksumickie."
 lepsius.2251.f: "Monety zaczęto bić w Imperium Aksumickim około 270 roku n.e., za panowania króla Endubisa. Aksum było pierwszym znaczącym państwem Afryki Subsaharyjskiej, które rozpoczęło emisję własnej waluty, wybijając monety ze złota, srebra i brązu. Miały one ułatwiać handel międzynarodowy, zwłaszcza z Rzymem i Bizancjum, a często umieszczano na nich greckie inskrypcje, ponieważ greka była językiem porozumiewania się kupców handlujących w regionie Morza Czerwonego. Na najwcześniejszych monetach widniały tradycyjne symbole politeistyczne, takie jak półksiężyc i dysk słoneczny, natomiast monety bite po przyjęciu chrześcijaństwa przez króla Ezanę w IV wieku wyróżniały się wyraźnie przedstawionym krzyżem chrześcijańskim."
 lepsius.2251.g: "To ucieszy numizmatyków."
 lepsius.2252.t: "Pałac Aksumicki"
 lepsius.2252.d: "Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] wraz ze swoim zespołem zdołał niedawno z wielkim trudem odsłonić fundamenty ogromnego kompleksu pałacowego, który bez wątpienia pochodzi z czasów Imperium Aksumickiego."
 lepsius.2252.f: "Architektura pałacowa Imperium Aksumickiego charakteryzowała się masywnymi, wielokondygnacyjnymi budowlami wznoszonymi na podwyższonych kamiennych platformach. Najsłynniejszym przykładem jest Dungur w Aksum, znany jako Pałac Królowej Saby. W konstrukcji tych pałaców stosowano charakterystyczną technikę „małpich głów”, polegającą na osadzaniu poziomych drewnianych belek w kamiennych murach w celu wzmocnienia konstrukcji. Ich wystające końce tworzyły rytmiczny wzór na zewnętrznych elewacjach. Fundamenty wznoszono ze starannie obrobionych bloków granitu, a ściany często wzbogacano uskokami, które nadawały budowlom większą głębię wizualną i poprawiały ich stabilność."
 lepsius.2252.g: "Pałace godne króla Salomona!"
 lepsius.2253.t: "Literatura Gyyz"
 lepsius.2253.d: "Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] zdołał pozyskać dla muzeum cenny zabytek piśmiennictwa ze starożytnego Imperium Aksumickiego."
 lepsius.2253.f: "Literatura Imperium Aksumickiego jest nierozerwalnie związana z wprowadzeniem chrześcijaństwa i rozwojem języka gyyz, posługującego się odrębnym pismem południowosemickim. Choć wczesne inskrypcje aksumickie na kamiennych monumentach były często wielojęzyczne, wykorzystując grekę i język sabejski, z czasem w imperium rozwinęła się bogata rodzima tradycja literacka, skupiona wokół tekstów religijnych i królewskich. Najważniejszym przedsięwzięciem literackim było przetłumaczenie Biblii oraz rozmaitych tekstów apokryficznych z greki na język gyyz w V i VI wieku. Dzieła takie jak Ewangelie z Garimy, ozdobione zachwycającymi iluminacjami, należą do najstarszych chrześcijańskich rękopisów na świecie."
 lepsius.2253.g: "Cenne dzieło piśmiennictwa!"
 lepsius.2254.t: "Historia Aksumicka"
 lepsius.2254.d: "Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] zebrał swoją dotychczasową wiedzę o Imperium Aksumickim w monografii. Książka już teraz jest uznawana za fundamentalne dzieło w tej dziedzinie."
 lepsius.2254.f: "Imperium Aksumickie (ok. 100–940 n.e.) powstało na wyżynach dzisiejszej Etiopii i Erytrei, z czasem stając się jedną z czterech wielkich potęg starożytnego świata, obok Rzymu, Persji i Chin. Jego dobrobyt opierał się na strategicznej kontroli nad szlakami handlowymi Morza Czerwonego, łączącymi Imperium Rzymskie z Indiami. Za pośrednictwem portu Adulis Aksum eksportowało złoto, kość słoniową i szmaragdy, sprowadzając jednocześnie jedwab i przyprawy. W IV wieku, za panowania króla Ezany, Aksum osiągnęło szczyt potęgi politycznej i stało się jednym z pierwszych wielkich imperiów, które przyjęły chrześcijaństwo jako religię państwową. Przemiana ta wywarła głęboki wpływ na sztukę i architekturę regionu oraz rozwój pisma gyyz. Jednak w VII wieku powstanie kalifatów islamskich doprowadziło do zmiany przebiegu szlaków handlowych i izolacji imperium. Degradacja środowiska naturalnego oraz niepokoje wewnętrzne ostatecznie przyczyniły się do jego upadku, choć jego dziedzictwo kulturowe i religijne do dziś stanowi fundament współczesnego państwa etiopskiego."
 lepsius.2254.g: "Ta książka powinna trafić do Biblioteki Narodowej."
 lepsius.2261.t: "Figurki Missisipijskie"
 lepsius.2261.d: "Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] zaprezentował dziś prasie kunsztowne figurki świadczące o kreatywności rdzennych mieszkańców Ameryki należących do kultury missisipijskiej. Odkryto je w [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName]."
 lepsius.2261.f: "Kamienne posągi kultury missisipijskiej, datowane na okres od około 800 do 1500 roku n.e., stanowią jedno z najwybitniejszych osiągnięć prehistorycznej sztuki figuralnej Ameryki Północnej. Te antropomorficzne rzeźby, wykonywane głównie z fluorytu, piaskowca lub boksytu, odgrywały kluczową rolę w kulcie przodków związanym z Południowo-Wschodnim Kompleksem Ceremonialnym. Posągi te, zazwyczaj odnajdywane parami w kompleksach świątynno-grobowych na szczytach kopców ziemnych, przedstawiają siedzących lub klęczących mężczyzn i kobiety. Charakteryzują się monumentalnym bezruchem, sztywnymi pozami, stylizowanymi fryzurami, takimi jak włosy związane w kok na czubku głowy, oraz spokojnym, stoickim wyrazem twarzy. Uważa się, że postacie te uosabiały duchy wysoko postawionych przodków lub założycieli rodów."
 lepsius.2261.g: "Zbierzmy ich jak najwięcej."
 lepsius.2262.t: "Kopiec Missisipijski"
 lepsius.2262.d: "Archeolodzy odkryli ogromny kopiec, niemal dorównujący rozmiarami słynnym budowlom Majów i Azteków. Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] został natychmiast wezwany, aby dokładniej zbadać tę fascynującą pozostałość po kulturze missisipijskiej."
 lepsius.2262.f: "Charakterystyczną cechą kultury missisipijskiej było wznoszenie ogromnych kopców ziemnych, które przekształciły równiny zalewowe Środkowego Zachodu i południowo-wschodniej części Ameryki Północnej w rozbudowane ośrodki miejskie. W przeciwieństwie do stożkowatych kopców grobowych z wcześniejszych okresów kopce missisipijskie miały zazwyczaj formę piramid o płaskich wierzchołkach, zwanych kopcami platformowymi, na których wznoszono drewniane świątynie, domy zgromadzeń lub rezydencje elitarnych władców uznawanych za bóstwa „Słońca”. Budowle te wznoszono ręcznie, przenosząc ziemię w koszach, a stanowiły one ceremonialne i polityczne centra społeczności rządzonych przez wodzów. Najsłynniejszy przykład, Kopiec Mnichów w Cahokii, wznosi się na wysokość 30 metrów i zajmuje powierzchnię ponad 5 hektarów, dorównując Wielkiej Piramidzie w Gizie pod względem powierzchni podstawy."
 lepsius.2262.g: "Piramidy z błota!"
 lepsius.2263.t: "Ceramika Missisipijska"
 lepsius.2263.d: "Podczas lokalnych wykopalisk w [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] odkryto zbiór wyrobów ceramicznych datowanych na koniec I tysiąclecia p.n.e., które wydają się być związane z kulturą miejską cywilizacji missisipijskiej."
 lepsius.2263.f: "Ceramika missisipijska wyróżniała się przede wszystkim wykorzystaniem pokruszonych muszli małży jako domieszki schudzającej glinę. Ta innowacja pozwoliła garncarzom tworzyć naczynia o cieńszych, wytrzymalszych ściankach i bardziej złożonych kształtach niż w przypadku wcześniejszych metod wykorzystujących domieszkę tłucznia kamiennego. Ceramika ta słynęła z różnorodności form, obejmujących naczynia na wodę z osłoniętymi szyjkami, talerze oraz naczynia figuralne w kształcie zwierząt, ludzkich głów lub istot mitologicznych. Style zdobnicze różniły się w zależności od regionu. Ceramika w stylu „Avenue Polychrome” wyróżniała się wyrazistymi czerwono-białymi wzorami wykonanymi angobą, podczas gdy w innych stylach stosowano głębokie ryty lub malowanie negatywowe. Wiele naczyń pełniło funkcje rytualne i było zdobionych motywami charakterystycznymi dla Południowo-Wschodniego Kompleksu Ceremonialnego, takimi jak „dłoń i oko” czy „promieniste słońce”."
 lepsius.2263.g: "Zaraz, one są zrobione z muszli?"
 lepsius.2264.t: "Missisipijskie Miejsce Pochówku"
 lepsius.2264.d: "Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] odkrył ukryte groby należące do kultury missisipijskiej i dokonał kilku niezwykłych znalezisk."
 lepsius.2264.f: "Praktyki pogrzebowe kultury missisipijskiej były ściśle związane z hierarchią społeczną i wierzeniami kosmologicznymi, odzwierciedlając silnie rozwarstwione społeczeństwo. Przedstawicieli elit często chowano w świątyniach grobowych wznoszonych na szczytach kopców platformowych lub w specjalnych kopcach grobowych. W grobach osób o wysokiej pozycji społecznej często znajdowano cenne dary pogrzebowe, takie jak miedziane płytki zdobione techniką repusowania, ozdoby na szyję wykonane z muszli morskich oraz misternie wykonaną ceramikę, które miały towarzyszyć zmarłym w życiu pozagrobowym. Natomiast zwykłych mieszkańców chowano zazwyczaj na skromniejszych cmentarzyskach w pobliżu osad. Charakterystyczną cechą tego okresu było stosowanie grobów skrzynkowych, w których zmarłych składano w komorach wyłożonych płytami wapiennymi lub piaskowcowymi."
 lepsius.2264.g: "Fascynujące!"
 lepsius.2281.t: "Broń Scytyjska"
 lepsius.2281.d: "Podczas lokalnych wykopalisk w [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] archeolodzy odkryli skarb zawierający scytyjską broń. Uzdzienice, łuki i szable świadczą o uzbrojeniu tego starożytnego ludu stepowego."
 lepsius.2281.f: "Scytyjska sztuka wojenna opierała się na mobilności i zabójczej skuteczności broni dystansowej. Podstawowym uzbrojeniem był łuk kompozytowy, wykonany z drewna, rogu i ścięgien. Przechowywano go w gorytosie, specjalnym skórzanym futerale mieszczącym zarówno łuk, jak i do 200 strzał z brązowymi grotami, co umożliwiało szybkie i nieprzerwane ostrzeliwanie przeciwnika z grzbietu konia. W walce wręcz Scytowie posługiwali się akinakesem, charakterystycznym krótkim żelaznym mieczem lub sztyletem z prostokątnym bądź „nerkowatym” jelcem. Wśród znalezisk archeologicznych często pojawia się również sagaris, topór bojowy o wąskim ostrzu, zdolny do przebijania hełmów. Ochronę zapewniała zbroja łuskowa, składająca się z zachodzących na siebie żelaznych lub brązowych płytek przyszytych do skórzanych kamizelek."
 lepsius.2281.g: "Nic dziwnego, że panowali na stepach!"
 lepsius.2282.t: "Kurhan Scytyjski"
 lepsius.2282.d: "Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] przekazał dziś muzeum znakomite wieści: wszystko wskazuje na to, że zespół [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] odkrył nieznany dotąd kurhan, czyli scytyjski kopiec grobowy."
 lepsius.2282.f: "Scytyjskie kurhany stepu pontyjskiego to kopce grobowe, które służyły zarówno jako miejsca pochówku elit, jak i oznaczenia terytorium. Zazwyczaj kryją centralną komorę drewnianą, zbudowaną z potężnych dębowych lub modrzewiowych bali i zagłębioną w ziemi. Aby uczcić zmarłego, usypywano nad nią ogromne ilości ziemi i darni. W „królewskich” kurhanach, takich jak Czertomłyk, kopce często osiągały ponad 20 metrów wysokości. Oprócz głównego pochówku kurhany te często zawierają boczne komory dla sług złożonych w ofierze oraz osobne jamy dla dziesiątek koni bojowych, wyposażonych w brązowe wędzidła i uzdy."
 lepsius.2282.g: "Zwykle aż podskakuję, gdy profesor wchodzi do pokoju i oznajmia: „Dobre wieści!...”"
 lepsius.2283.t: "Osada Scytyjska"
 lepsius.2283.d: "Archeolodzy odkryli rozległą osadę starożytnych Scytów. Dotychczasowe wykopaliska odsłoniły artefakty i ludzkie szczątki, które poszerzają naszą wiedzę o tej dawnej kulturze stepowej."
 lepsius.2283.f: "Najbardziej znanym przykładem osady scytyjskiej jest grodzisko w Bielsku, kompleks o charakterze protomiejskim otoczony wałami ziemnymi o łącznej długości ponad 30 kilometrów. Takie osady lokowano w strategicznych miejscach wzdłuż szlaków rzecznych, aby kontrolować handel i chronić zwierzęta hodowlane. Wykopaliska archeologiczne odsłoniły stałe drewniane domostwa, jamy zasobowe oraz wyspecjalizowane warsztaty zajmujące się wytopem żelaza, odlewaniem brązu i tkactwem. Ośrodki te pełniły funkcję centrów gospodarczych, w których koczownicy wymieniali surowce na greckie towary luksusowe, takie jak wino i ceramika."
 lepsius.2283.g: "Gigantyczne wioski..."
 lepsius.2284.t: "Baby Scytyjskie"
 lepsius.2284.d: "Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] odnalazł starożytną stelę na obszarze [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName]. Pochodzi ona z czasów starożytnych Scytów."
 lepsius.2284.f: "Scytyjskie stele, zwane „Kamiennymi Babami”, to monumentalne płyty z piaskowca wieńczące kurhany na stepie pontyjskim. Te pomniki przodków przedstawiają zmarłych wojowników w sztywnej pozie, zwróconych twarzą do patrzącego. W przeciwieństwie do stylizowanych „kamieni jeleni” ze Wschodu mają postać ludzką i zdobią je szczegółowe ryty scytyjskiego wyposażenia wojennego. Centralnym elementem ich ikonografii jest pas wojownika, przy którym widnieją akinakes (sztylet), gorytos (futerał na łuk) oraz osełki. Wiele postaci trzyma przy piersi rytualny róg do picia (ryton), symbolizujący wysoką pozycję społeczną i uczty obrzędowe. „Baby” służyły jako oznaczenia terytorium oraz centralne punkty obrzędów pogrzebowych."
 lepsius.2284.g: "Zabierzcie babę do muzeum."
 lepsius.2285.t: "Złoty Grzebień"
 lepsius.2285.d: "Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] dokonał w Sołosze najwspanialszego dotąd odkrycia w archeologii scytyjskiej: tamtejszy kurhan kryje ogromny złoty skarb. Jego najcenniejszym zabytkiem jest złoty grzebień przedstawiający sceny walki."
 lepsius.2285.f: "Kurhan Sołocha, położony na lewym brzegu Dniepru na terenie dzisiejszej Ukrainy, jest jednym z najważniejszych stanowisk archeologii scytyjskiej, odkrytym przez Nikołaja Wiesiełowskiego w 1912 roku. Ten monumentalny kopiec grobowy, datowany na początek IV wieku p.n.e., miał 18 metrów wysokości. Krył dwie królewskie komory grobowe: wcześniejszy grób centralny, splądrowany już w starożytności, oraz nienaruszony grobowiec boczny. W tym drugim odkryto szczątki scytyjskiego króla, podczaszego i strażnika, którym towarzyszyło pięć koni złożonych w ofierze. Oprócz słynnych złotych zabytków wyposażenie grobowe obejmuje liczne greckie amfory, broń z brązu oraz srebrne naczynie rytualne."
 lepsius.2285.g: "Jest zdecydowanie zbyt piękny, by czesać nim włosy..."
 lepsius.2291.t: "Kamień Runiczny Wikingów"
 lepsius.2291.d: "W odległym zakątku obszaru [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] odnalazł kamień runiczny. Pochodzi on z Epoki Wikingów."
 lepsius.2291.f: "Kamień runiczny wikingów to pionowo ustawiony pomnik, zazwyczaj wykonany z granitu lub piaskowca, pokryty inskrypcją zapisaną runami młodszego futharku. Kamienie te wznoszono głównie między IX a XI wiekiem w całej Skandynawii, a najwięcej zachowało się ich na terenie dzisiejszej Szwecji. W przeciwieństwie do nagrobków rzadko ustawiano je bezpośrednio nad grobem. Pełniły raczej funkcję publicznych pomników, które upamiętniały zmarłych, poświadczały dziedziczenie lub sławiły doniosłe osiągnięcia i wyprawy."
 lepsius.2291.g: "Odczytajcie inskrypcję na kamieniu runicznym."
 lepsius.2291.h: "Zabierzcie kamień runiczny do muzeum."
 lepsius.2292.t: "Osada Wikingów"
 lepsius.2292.d: "Rolnik z obszaru [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] powiadomił władze o dziwnych znaleziskach na swoim polu. Badacze rozpoczęli wykopaliska i odkryli artefakty z epoki wikingów. Następnie zespół doświadczonych archeologów odsłonił całą osadę."
 lepsius.2292.f: "Podstawowym elementem zabudowy osady wikingów był długi dom (langhús), prostokątny budynek mieszczący wspólnotę mieszkańców, zazwyczaj o długości od 15 do 30 metrów. Budowle te miały wygięte ściany przypominające kształtem łódź, wznoszone z drewna, darni lub kamienia, oraz centralne palenisko służące do ogrzewania i przygotowywania posiłków. Na północnym Atlantyku osady dostosowywano do miejscowych warunków. W regionach ubogich w drewno, takich jak Islandia i Grenlandia, podstawowym budulcem stała się darń. Wykopaliska na stanowiskach takich jak L'Anse aux Meadows na Nowej Fundlandii potwierdziły, że ten model osadnictwa na krótko dotarł nawet do Ameryki Północnej."
 lepsius.2292.g: "Trudno uwierzyć, że ci krwawi grabieżcy potrafili być w domu kochającymi mężami i ojcami."
 lepsius.2293.t: "Langskip Wikingów"
 lepsius.2293.d: "Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] odnalazł zachowane szczątki dawnego statku wikingów. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe|U] i jego zespół zabezpieczyli kilka fragmentów."
 lepsius.2293.f: "Langskip Wikingów był wyspecjalizowaną jednostką morską, opracowaną i wykorzystywaną przez dawnych Skandynawów do handlu, wypraw odkrywczych i działań wojennych w Epoce Wikingów. Wyróżniał się długim, smukłym drewnianym kadłubem, niewielkim zanurzeniem oraz symetrycznym dziobem i rufą, co umożliwiało rozwijanie dużych prędkości i żeglugę zarówno po głębokich wodach oceanicznych, jak i płytkich śródlądowych szlakach wodnych. Przy budowie stosowano zazwyczaj poszycie zakładkowe, w którym zachodzące na siebie drewniane klepki, głównie dębowe, łączono żelaznymi nitami. Zapewniało to kadłubowi elastyczność niezbędną do wytrzymywania naprężeń skrętnych wywoływanych przez atlantyckie fale. Napęd stanowiły jeden duży żagiel rejowy oraz rzędy wioseł. Dzięki tym ostatnim „smocze okręty” mogły dobijać bezpośrednio do plaż i wykonywać manewry taktyczne niezależnie od kierunku wiatru."
 lepsius.2293.g: "Da się go znów przystosować do żeglugi? Nie? To zabierzcie go do muzeum!"
 lepsius.2294.t: "Pochówek Wikingów w Łodzi"
 lepsius.2294.d: "Archeologiczna sensacja! U wybrzeży obszaru [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] archeolodzy pod kierownictwem Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] odkryli całkowicie zachowany statek wikingów, który najwyraźniej posłużył za miejsce pochówku. Zmarłego wodza pochowano wraz z licznymi cennymi artefaktami!"
 lepsius.2294.f: "Pochówek w łodzi był wikińskim zwyczajem pogrzebowym, polegającym na złożeniu zmarłego, zazwyczaj osoby o wysokiej pozycji społecznej, w statku morskim. Praktyka ta odzwierciedlała wiarę, że statek posłuży jako środek transportu do zaświatów, takich jak Walhalla czy Folkwang. Obrzęd obejmował umieszczenie zmarłego w komorze grobowej na statku, często wraz z bogatym wyposażeniem: zwierzętami złożonymi w ofierze (końmi i psami), bronią, luksusowymi tkaninami, a niekiedy także niewolnikami. Pochówki tego rodzaju — jak słynny statek z Oseberg — obfitowały w dary grobowe, w tym kunsztownie zdobioną broń, srebrną biżuterię i przedmioty codziennego użytku, dostarczając wiedzy o rzemiośle dawnych Skandynawów."
 lepsius.2294.g: "Dla nich Walhalla, dla nas artefakty!"
 lepsius.2106.t: "August z Prima Porta"
 lepsius.2106.d: "W Prima Porta Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] dokonał zupełnie nieoczekiwanego odkrycia: w Willi Liwii pod Rzymem [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] i [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] zespół odkopali kolosalny posąg pierwszego cesarza rzymskiego, Augusta!"
 lepsius.2106.f: "August z Prima Porta to marmurowy posąg pierwszego cesarza rzymskiego, mierzący około 2,04 metra wysokości, odkryty w 1863 roku w Willi Liwii niedaleko Rzymu. Posąg przedstawia Augusta w pozie wodza przemawiającego do swoich żołnierzy (adlocutio). Szczególne znaczenie historyczne ma bogato zdobiony pancerz. Centralne reliefy przedstawiają zwrot orłów legionowych odzyskanych od Partów w 20 roku p.n.e. – triumf dyplomatyczny, który August ukazał jako przywrócenie honoru Rzymu. U jego stóp znajduje się mały Kupidyn dosiadający delfina, co podkreśla boskie pochodzenie dynastii julijskiej od bogini Wenus. Posąg jest uważany za jeden z najważniejszych przykładów cesarskiej autoprezentacji i rzymskiego klasycyzmu."
 lepsius.2106.g: "To musi być jeden z najpiękniejszych posągów starożytnego Rzymu."
 lepsius.2116.t: "Cylinder Cyrusa"
 lepsius.2116.d: "Zespół archeologiczny dokonał zaskakującego odkrycia podczas wykopalisk w Babilonie: glinianego dokumentu przypisywanego wielkiemu królowi Persji, Cyrusowi. W dokumencie tym władca ogłasza powrót licznych ludów do ich ojczystych ziem oraz przyznaje im swobodę wyznawania własnej religii. Czyżby była to starożytna deklaracja praw człowieka?"
 lepsius.2116.f: "„Ja jestem Cyrus – król światowego imperium, wielki i potężny król, król Babilonii, król Sumeru i Akadu, król czterech stron świata, syn Kambyzesa, wielkiego króla Anszanu, wnuk Cyrusa I, potomek Teispesa – którego panowanie było miłe Belowi i Nabu. Sprowadziłem z powrotem bogów, którzy przebywali (za Tygrysem). Zgromadziłem wszystkie ich ludy i pozwoliłem im powrócić do swoich domów. Pośród okrzyków radości i powszechnego wesela ustanowiłem swoją królewską siedzibę w pałacu władców Babilonu. Dzień po dniu oddawałem cześć Mardukowi. Nie dopuściłem, aby w całej krainie Sumeru i Akadu pojawili się wichrzyciele. Zapewniłem pomyślność miastu Babilon i wszystkim jego miejscom kultu. Pozwoliłem odpocząć wyczerpanym mieszkańcom, którzy wbrew woli bogów dźwigali niegodne jarzmo. Marduk, wielki pan, pobłogosławił mnie, Cyrusa, oraz Kambyzesa, mojego własnego syna, a także wszystkie moje wojska."
 lepsius.2116.g: "Cenny perski artefakt w Babilonie? Zdumiewające."
