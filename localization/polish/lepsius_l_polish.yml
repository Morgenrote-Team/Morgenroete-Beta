 lepsius.81.t: "[ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastNameNoFormatting] stosuje Nowoczesne Metody Wykopaliskowe"
 lepsius.81.d: "Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] odnalazł w jaskini różne ludzkie kości. Jednak w przeciwieństwie do innych Antropologów [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetSheHe] nie ograniczył się jedynie do zebrania kości, lecz skrupulatnie udokumentował również okoliczności ich odnalezienia."
 lepsius.81.f: "Każdą kość dokumentowano dokładnie w miejscu, w którym została odnaleziona. Siatka naniesiona na rysunki pomagała rejestrować położenie każdej kości, artefaktu, a nawet kawałka węgla drzewnego. Wszystko mogło stanowić wskazówkę dotyczącą tego, co jedli prehistoryczni ludzie, czym się zajmowali i jak żyli. Każdy szczegół miał znaczenie."
 lepsius.81.g: "Nie jesteśmy już rabusiami grobowców!"
