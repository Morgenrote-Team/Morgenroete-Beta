 alert_lepsius_expedition_possible_alert_hint: "Mamy co najmniej jeden wolny Zespół Wykopaliskowy, który można wykorzystać do prowadzenia [Concept('concept_lepsius_excavation','$concept_lepsius_excavations|q$')] i [Concept('concept_lepsius_expedition','$concept_lepsius_expeditions|q$')]. Zawieraj [Concept('concept_mr_research_charter','$concept_mr_research_charters|q$')] z innymi krajami, aby wysyłać zespół w świat. Otwórz Przegląd Akademicki w #V Oknie Morgenröte#!, aby go wysłać."
