 lepsius.1601.t: "Darowizna [SCOPE.sCharacter('lepsius_donator_scope').GetLastName]"
 lepsius.1601.d: "[SCOPE.sCharacter('lepsius_donator_scope').GetFullName] jest znany jako kolekcjoner rzadkich egipskich osobliwości. Jego zainteresowania egiptologią sprawiły, że zgromadził imponującą kolekcję. Wielkodusznie zaoferował przekazanie swoich wyjątkowych artefaktów Muzeum Archeologicznemu."
 lepsius.1602.d: "Powszechnie wiadomo, że [SCOPE.sCharacter('lepsius_donator_scope').GetFullName] posiada prawdopodobnie najbardziej imponującą prywatną kolekcję artefaktów mezopotamskich. Zasygnalizował rządowi, że kolekcja ta mogłaby zostać przekazana na własność państwa, choć niektórzy sceptyczni obserwatorzy ostrzegają, że może zażądać czegoś w zamian."
 lepsius.1603.d: "[SCOPE.sCharacter('lepsius_donator_scope').GetFullName] nie uchodzi wprawdzie za wielkiego miłośnika sztuki, jednak szczęśliwym trafem odkrył na swojej posiadłości kilka niezwykle cennych skarbów archeologicznych, które od paru lat trzyma pod kluczem. Ponieważ nie ma z nich większego pożytku, zaproponował rządowi przekazanie ich w darze Muzeum Archeologicznemu."
 lepsius.1604.d: "[SCOPE.sCharacter('lepsius_donator_scope').GetFullName] nie uchodzi wprawdzie za wielkiego miłośnika sztuki, jednak szczęśliwym trafem odkrył na swojej posiadłości kilka niezwykle cennych skarbów archeologicznych, które od paru lat trzyma pod kluczem. Ponieważ nie ma z nich większego pożytku, zaproponował rządowi przekazanie ich w darze Muzeum Archeologicznemu."
 lepsius.1605.d: "[SCOPE.sCharacter('lepsius_donator_scope').GetFullName] był pod wielkim wrażeniem starożytnych kultur egejskich. Od kilku lat kolekcjonował artefakty pochodzące z Krety, a nawet sprowadził do swojej willi cały minojski fresk. Jednak świadomy swoich obowiązków wobec społeczeństwa postanowił przekazać swoje skarby ludowi [ROOT.GetCountry.GetAdjectiveNoFlag]."
 lepsius.1601.f: "Początki licznych kolekcji archeologicznych sięgają czasów renesansowych książąt, którzy gromadzili starożytne dzieła sztuki i nabywali je za pośrednictwem handlarzy. W 1824 roku król Karol Feliks zakupił zbiory kolekcji Drovettiego (5268 eksponatów, w tym 100 posągów, 170 papirusów, stele, mumie i inne przedmioty), którą francuski konsul generalny Bernardino Drovetti zgromadził podczas swojego pobytu w Egipcie. Kolekcja ta stała się później podstawą Muzeum Egipskiego w Turynie. Zamożni przedsiębiorcy i wpływowe elity również interesowali się gromadzeniem przedmiotów stanowiących symbole statusu społecznego, które często zapisywali społeczeństwu w swoich testamentach. Nierzadko takie darowizny miały nie tylko poprawić reputację samych darczyńców, lecz także zapewnić im wyższą pozycję społeczną."
 lepsius.1601.g: "Wspaniała darowizna dla naszego muzeum!"
 lepsius.1601.h: "Ten pochlebca próbuje jedynie coś na tym ugrać."
 lepsius.1606.t: "Egiptomania"
 lepsius.1606.d: "Zebrała się grupa ludzi zafascynowanych Egiptem, której przewodzi [SCOPE.sCharacter('lepsius_esoteric_leader').GetFullName]. Nie wszyscy podzielają niemal fanatyczny podziw dla starożytnego Egiptu, jednak działalność tej grupy może przynieść pewne korzyści."
 lepsius.1606.f: "Choć XIX wiek pod wieloma względami uznawany jest za epokę postępu, zdominowaną przez ducha nauki, to właśnie w tym okresie rozpowszechniły się rozmaite formy okultyzmu i zjawiska pseudonaukowe. Najbardziej znanym z nich był spirytyzm, którego zwolennicy pragnęli udowodnić istnienie duchów. Badania archeologiczne stały się inspiracją nie tylko dla wielu błędnych teorii, lecz także dla ruchów pseudonaukowych i ezoterycznych, takich jak panbabilonizm, mayanizm czy wiara w istnienie Atlantydy. Chociaż zjawiska te często wywierały szkodliwy wpływ na naukę, niektóre z nich cieszyły się pewną popularnością i przyczyniały się do popularyzacji badań naukowych, co mogło przynosić całkiem owocne skutki uboczne."
 lepsius.1606.g: "Niech oddają się praktykom swojego małego kultu."
 lepsius.1606.h: "Zakażmy tych bredni."
 lepsius.1607.t: "Mayanizm"
 lepsius.1607.d: "Niektóre elity w naszym kraju uległy dziwnemu, błędnemu przekonaniu, że świat podlega starożytnemu kalendarzowi wywodzącemu się od Majów. Co więcej, lud ten miał rzekomo posiadać wiedzę skrywającą tajemnice wszechświata. Można by śmiać się z tych absurdalnych poglądów, gdyby na czele tej wpływowej grupy nie stał [SCOPE.sCharacter('lepsius_esoteric_leader').GetFullName]."
 lepsius.1608.t: "Panbabilonizm"
 lepsius.1608.d: "Pewna grupa ludzi wywołała poruszenie w społeczeństwie i świecie nauki, utrzymując, że cała wiedza wywodzi się z Babilonu, a nawet religie żydowska i chrześcijańska są jedynie naśladownictwem. [SCOPE.sCharacter('lepsius_esoteric_leader').GetFullName] również należy do tego „Klubu Panbabilonistów”, którego członkowie starają się rozpowszechniać swoje poglądy."
 lepsius.1608.g: "To pseudonauka!"
 lepsius.1608.h: "Świetnie."
 lepsius.1609.t: "Atlantyzm"
 lepsius.1609.d: "[SCOPE.sCharacter('lepsius_esoteric_leader').GetFullName] przewodzi ezoteryczno-pseudonaukowej grupie, która twierdzi, że Atlantyda nie jest mitem, lecz historycznym miastem, które już w epoce lodowcowej dysponowało zaawansowaną technologią. Co więcej, wszystkie kultury miały wywodzić się z Atlantydy. Podczas cotygodniowych seansów spirytystycznych zamierza nawiązywać kontakt z duchami Atlantydów."
 lepsius.1609.h: "Kto wie, czy to prawda, czy tylko legenda?"
 lepsius.1609.i: "Istnieją solidne dowody na istnienie Atlantydy."
 lepsius.1610.t: "Inwestycja Archeologiczna"
 lepsius.1610.d: "Dyrektor Muzeum Archeologicznego zaoferował wsparcie w szkoleniu nowych specjalistów. Wiązałoby się to jednak z dodatkowymi kosztami."
 lepsius.1610.f: "Do Instytutu dotarły wieści, że rząd jest obecnie szczególnie zainteresowany wspieraniem rozwoju archeologii w naszym kraju. Dodatkowe wsparcie finansowe mogłoby pomóc w zatrudnieniu nowych, obiecujących asystentów”."
 lepsius.1610.g: "Przekaż muzeum dodatkowe wsparcie finansowe."
 lepsius.1610.h: "To nie jest tego warte."
 lepsius.1611.t: "Bilety do Muzeum"
 lepsius.1611.d: "Aby pokryć rosnące koszty, muzeum jest zmuszone podnieść ceny biletów. Państwo mogłoby przejąć dodatkowe zyski. Mogłoby to jednak nieco zaszkodzić naszej reputacji."
 lepsius.1611.f: "„Nie ma biletu!”"
 lepsius.1611.g: "Podnieś ceny biletów."
 lepsius.1611.h: "Obniż ceny biletów."
 lepsius.1611.i: "Bilety? Wstęp do muzeum powinien być bezpłatny!"
 lepsius.1612.t: "Dziedzictwo Dyrektora [SCOPE.sCharacter('lepsius_director_scope').GetLastName]"
 lepsius.1612.d: "Niedawno zmarły dyrektor muzeum, [SCOPE.sCharacter('lepsius_director_scope').GetLastName], był szanowanym człowiekiem. Cieszył się znakomitą reputacją w świecie nauki. Jednak niedawne odkrycie może rzucić cień na jego dziedzictwo."
 lepsius.1612.f: "Śledztwo wykazało, że [SCOPE.sCharacter('lepsius_director_scope').GetFullName] podczas swojej kadencji wielokrotnie otrzymywał prywatne darowizny od anonimowych osób. Nigdy jednak nie przekazał tych artefaktów muzeum, lecz zatrzymał je dla siebie. Choć chodzi jedynie o kilka pojedynczych eksponatów, nie umniejsza to ich wartości. Całej Inteligencji grozi prawdziwy skandal."
 lepsius.1612.g: "Prawda musi wyjść na jaw!"
 lepsius.1612.h: "[SCOPE.sCharacter('lepsius_director_scope').GetFullName] był człowiekiem honoru."
 je_lepsius_pompeii: "Nowoczesne Wykopaliska w Pompejach"
 je_lepsius_pompeii_reason: "Starożytne rzymskie miasto Pompeje, zasypane podczas erupcji Wezuwiusza w 79 roku n.e., jest przedmiotem wykopalisk już od XVIII wieku. Jednak pod wieloma względami tego rodzaju badania można w dużej mierze określić mianem rabunku, podczas którego niszczono materiały o wartości naukowej w celu pozyskania skarbów sztuki lub unicestwiano cenne znaleziska z czystej niewiedzy. Nowoczesne metody archeologiczne mogłyby znacząco usprawnić badania nad Pompejami."
 je_lepsius_teotihuacan: "Teotihuacán"
 je_lepsius_teotihuacan_reason: "Teotihuacán już przez Azteków było uważane za tajemnicze miejsce, które powstało na długo przed ich panowaniem. Według nich to zrujnowane miasto musiało być miejscem narodzin bogów. W rzeczywistości wiele dowodów wskazuje na to, że Teotihuacán było starożytnym miastem, które na wiele stuleci przed powstaniem Imperium Azteków wywierało wpływ na znaczną część Ameryki Środkowej i stanowi jedno z największych prekolumbijskich stanowisk archeologicznych obu Ameryk. Rząd Meksyku ma zatem nie tylko naukowe powody, by dokładniej zbadać to miejsce. Teotihuacán może być postrzegane jako symbol długiej, nieprzerwanej tradycji kulturowej Meksyku, a tym samym jako prekursor naszego narodu. Odbudowa częściowo zniszczonej Piramidy Słońca w Teotihuacán przed setną rocznicą niepodległości ma podkreślić tę symbolikę oraz uczcić jedność narodową i historię kraju."
 je_lepsius_harappa: "Cywilizacja Doliny Indusu"
 je_lepsius_harappa_reason: "Chociaż ruiny Harappy są znane już od pewnego czasu i zostały po raz pierwszy opisane przez Charlesa Massona w 1844 roku w jego książce „Relacja z różnych podróży po Beludżystanie, Afganistanie i Pendżabie” jako „zrujnowane fortyfikacje zbudowane z cegły”, ich znaczenie wciąż nie zostało w pełni wyjaśnione. Być może również w Indiach kryją się dotąd zupełnie nieznane skarby archeologiczne?"
 je_lepsius_first_emperor: "Grobowiec Pierwszego Cesarza"
 je_lepsius_first_emperor_reason: "Chiny są krajem stawiającym dopiero pierwsze kroki w dziedzinie archeologii. Nasi badacze muszą wyruszyć w świat i zdobywać doświadczenie, aby pogłębiać swoją wiedzę. Dopiero gdy odniesiemy wystarczająco wiele sukcesów, a nasi archeolodzy zdobędą odpowiednie umiejętności, będziemy mogli podjąć się największego archeologicznego wyzwania: zbadania Grobowca Pierwszego Cesarza, czego dotąd nikt nie odważył się dokonać."
 lepsius.7.t: "Wykopaliska w Pompejach"
 lepsius.7.d: "W Pompejach pod kierownictwem profesora [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] mają zostać przetestowane nowe metody naukowe. Stanowi to punkt zwrotny w historii wykopalisk w Pompejach. Nadal jednak trzeba zdecydować, na czym skupią się badania."
 lepsius.7.f: "Wykopaliska Giuseppe Fiorellego otworzyły nowy rozdział w badaniach archeologicznych nad Pompejami. Podczas wcześniejszych prac wykopaliskowych na tym stanowisku natrafiano niekiedy na puste przestrzenie w warstwie popiołu, w których znajdowały się ludzkie szczątki. Fiorelli zdał sobie sprawę, że były to przestrzenie pozostawione przez rozłożone ciała, dlatego opracował metodę wypełniania ich gipsem, aby odtworzyć sylwetki ofiar Wezuwiusza. Technika ta jest stosowana do dziś, choć zamiast gipsu używa się obecnie przezroczystej żywicy, która jest trwalsza i nie niszczy kości, umożliwiając ich dalsze badania. Fiorelli wprowadził również naukową dokumentację wykopalisk. Podzielił miasto na dziewięć istniejących do dziś sektorów oraz poszczególne kwartały, a także ponumerował wejścia do poszczególnych domów. Fiorelli rozpoczął również wydawanie pierwszego czasopisma zawierającego sprawozdania z wykopalisk. Za czasów jego następców odsłonięto całą zachodnią część miasta."
 lepsius.7.g: "Interesują nas przede wszystkim artefakty."
 lepsius.7.h: "Musimy dowiedzieć się więcej o przeszłości."
 lepsius.7.i: "Chcemy wyszkolić nowe pokolenie uczonych."
 lepsius.8.t: "Piramida Słońca w Teotihuacán"
 lepsius.8.d: "[SCOPE.sCharacter('lepsius_archaeologist_scope').GetFullName] podziwia panoramę Teotihuacán z najwyższego punktu odbudowanej piramidy. Ten prestiżowy projekt pokonał ważną przeszkodę, jednak nadal nie wiadomo, jakie konkretne korzyści kraj odniesie z prowadzonych wykopalisk."
 lepsius.8.f: "Teotihuacán, położone na Wyżynie Meksykańskiej, jest jednym z najważniejszych prehistorycznych miast, których ruiny zachowały się na kontynentach amerykańskich. Słynie przede wszystkim ze swoich świątyń schodkowych, takich jak Wielka Piramida Słońca. Obszar Teotihuacán był nieprzerwanie zamieszkany od VI wieku p.n.e. Między 100 a 650 rokiem n.e. miasto stanowiło dominujące centrum kulturalne, gospodarcze i militarne Mezoameryki. W okresie największego rozkwitu mogło liczyć nawet 200 000 mieszkańców. W swoich czasach było zdecydowanie największym miastem na kontynencie amerykańskim i jednym z największych na świecie. Około 650 roku jego znaczenie zaczęło maleć, aż około 750 roku zostało w znacznej mierze opuszczone z przyczyn, które do dziś nie zostały w pełni wyjaśnione. Wpływy kulturowe Teotihuacán nadal kształtowały środkowy Meksyk aż do hiszpańskiego podboju tego kraju."
 lepsius.9.t: "Nieznana Cywilizacja"
 lepsius.9.d: "[SCOPE.sCharacter('lepsius_archaeologist_scope').GetFullName] jest całkowicie zdumiony. Wygląda na to, że odkrył ślady nieznanej dotąd cywilizacji, która osiedliła się w Dolinie Indusu tysiące lat temu. Oznaczałoby to, że region ten był kolebką cywilizacji na równi z Egiptem czy Babilonią. Przed nami dziesięciolecia badań, ale jakie powinny być nasze priorytety?"
 lepsius.9.f: "Cywilizacja Doliny Indusu z epoki brązu, znana również jako Cywilizacja Indusu lub Kultura Harappańska, była jedną z najwcześniejszych cywilizacji miejskich. Istniała od około 2800 do 1800 roku p.n.e. wzdłuż rzeki Indus, w północno-zachodniej części subkontynentu indyjskiego. Cywilizacja Doliny Indusu rozciągała się na niemal całe terytorium dzisiejszego Pakistanu oraz części Indii i Afganistanu. W 1912 roku J. Fleet odnalazł na terenie ówczesnych Indii Brytyjskich pieczęcie z nieznanymi znakami pisma, co wzbudziło zainteresowanie europejskiego środowiska naukowego. Następnie, w latach 1921–1922, pod kierownictwem Johna Marshalla, ówczesnego dyrektora Brytyjskiej Służby Starożytności, przeprowadzono wykopaliska w Harappie i Mohendżo-Daro. Podobieństwo obu odkopanych miast szybko uświadomiło badaczom, że odkryto tu nieznaną wcześniej wysoko rozwiniętą kulturę."
 lepsius.70.t: "Armia z Terakoty"
 lepsius.70.d: "[SCOPE.sCharacter('lepsius_archaeologist_scope').GetFullName] dokonał niezwykłego odkrycia podczas badania terenu wokół Mauzoleum Pierwszego Cesarza z dynastii Qin: armii wykonanej w całości z terakoty, która po dziś dzień strzeże zmarłego cesarza."
 lepsius.70.f: "„W dziewiątym miesiącu Pierwszy Cesarz został pochowany u podnóża góry Li. Prace wykopaliskowe i przygotowawcze na górze Li rozpoczęły się, gdy Pierwszy Cesarz wstąpił na tron. Później, gdy zjednoczył już swoje imperium, sprowadzono tam 700 000 ludzi ze wszystkich jego zakątków. Przekopali się przez trzy warstwy wód gruntowych, a następnie odlali z brązu zewnętrzną trumnę. Wzniesiono pałace i malownicze wieże przeznaczone dla stu urzędników, a grobowiec wypełniono rzadkimi artefaktami i wspaniałymi skarbami. Rzemieślnikom nakazano wykonać kusze i strzały, przygotowane tak, by razić każdego, kto wtargnie do grobowca. Za pomocą rtęci odtworzono sto rzek, Jangcy, Żółtą Rzekę oraz wielkie morze, wprawiając je w ruch za pomocą mechanizmów. Powyżej przedstawiono gwiazdozbiory niebieskie, a poniżej ukształtowanie ziemi. Świece wykonano z tłuszczu «ryb-człeków», obliczając, że będą płonąć przez długi czas, nie gasnąc”. – Sima Qian"
 lepsius.70.g: "Starożytna wielkość Chin jest zdumiewająca."
 lepsius.61.t: "Wykopaliska w [SCOPE.sState('lepsius_excavation_state').GetName]"
 lepsius.61.d: "Podczas okupacji [SCOPE.sState('lepsius_excavation_state').GetName] w nasze ręce wpadły zespoły archeologiczne oraz artefakty. Archeolodzy nalegają, aby nie przerywać prac naukowych i zapewnić ochronę stanowisku archeologicznemu. Niektórzy oficerowie domagają się jednak, abyśmy zagarnęli łupy dla siebie."
 lepsius.61.f: "Niestety grabieże ważnych stanowisk archeologicznych nie należą do rzadkości. Nadciągające armie nie zawsze postępowały zgodnie ze swoją reputacją obrońców i opiekunów skarbów sztuki. W niektórych przypadkach już sama perspektywa powrotu z dodatkowymi łupami wystarczała, by rozbudzić chciwość ambitnych ludzi. Dlaczego to, co było prawdą w czasach Sulli, miałoby wyglądać inaczej dzisiaj?"
 lepsius.61.g: "Splądruj stanowisko archeologiczne!"
 lepsius.61.h: "Chroń stanowisko archeologiczne."
 lepsius.62.t: "Stanowisko Archeologiczne Splądrowane!"
 lepsius.62.d: "Wojna w jednym z krajów, w których prowadzimy wykopaliska, odcisnęła swoje piętno: wrogie wojska zajęły region, w którym badane jest stanowisko archeologiczne, i bezceremonialnie skonfiskowały artefakty odnalezione tam przez nasz zespół, pozostawiając po sobie ślady zniszczeń."
 lepsius.62.f: "Stanowiska archeologiczne mogą paść ofiarą wojny i zniszczeń. Dotyczy to również neutralnych zespołów archeologicznych pochodzących z państw trzecich, które nie uczestniczą w konflikcie. Nastawione na grabież państwa mogą wówczas zagarnąć artefakty, które nie zostały jeszcze przewiezione do krajów pochodzenia poszczególnych zespołów. Bez obaw: zespół archeologiczny pozostaje na miejscu, a wykopaliska nie zostają utracone. Jednak naprawienie szkód w stopniu umożliwiającym wznowienie normalnych prac zajmie archeologom trzy lata. W tym czasie nasze muzea nie będą otrzymywać corocznych dostaw artefaktów z tego stanowiska archeologicznego."
 lepsius.62.g: "Co za barbarzyńcy!"
 lepsius_excavation_sacked_state_modifier: "Splądrowane Stanowisko Archeologiczne"
 lepsius_excavation_protected_state_modifier: "Chronione Stanowisko Archeologiczne"
 lepsius_4_excavation_team_needed_tt: "Posiadaj co najmniej #G 4#! Zespoły Wykopaliskowe."
 lepsius.2101.t: "Pozostałości po Rzymskiej Bitwie "
 lepsius.2101.f: "„Sir, znalazłem kolejny gwóźdź!”\n„Wspaniale! To umacnia teorię, że w tym miejscu rozegrała się starożytna bitwa! Mam nadzieję, że wkrótce znajdziemy również jakieś kości!”"
 lepsius.2101.g: "Niezbyt prestiżowe, ale ważne odkrycie!"
 lepsius.2102.t: "Odkryto Villa Rustica"
 lepsius.2102.f: "Villa Rustica była nie tylko ważnym ośrodkiem produkcji rolnej, żywności i napojów. Zapewniała również podróżnym miejsce odpoczynku podczas wędrówek i odgrywała kluczową rolę w zaopatrywaniu legionów. Odkryte pozostałości pozwalają nam wyciągnąć wnioski na temat produkcji żywności, życia Rzymian oraz rolnictwa w Cesarstwie Rzymskim."
 lepsius.2102.g: "Dzięki temu dowiemy się wiele o życiu Rzymian na wsi!"
 lepsius.2103.t: "Odkryto Starożytne Rzymskie Tabliczki"
 lepsius.2103.f: "Claudia Severa przesyła pozdrowienia swojej Lepidinie.\n11 września, siostro, w dniu moich urodzin, serdecznie zapraszam Cię do nas. Upewnij się, że przybędziesz, gdyż Twoja obecność uczyni ten dzień jeszcze radośniejszym. Przekaż moje pozdrowienia swojemu Cerialisowi. Mój Aelius i mój mały synek również przesyłają mu pozdrowienia.\nBędę na Ciebie czekać, siostro. Żegnaj, siostro, najdroższa mojemu sercu. Oby los mi sprzyjał. Bądź zdrowa.\nDo Sulpicii Lepidiny, żony Cerialisa, od Cl. Severy."
 lepsius.2103.g: "Nie wszystkie skarby są ze srebra i złota!"
 lepsius.2104.t: "Odkryto Skarb Rzymskich Monet"
 lepsius.2104.d: "Skarby rzymskich monet należą do rzadkich znalezisk. Niemniej jednak jeden z nich odkryto w [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName]. Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] zdołał wydobyć skarb, który prawdopodobnie ukryto w okresie kryzysu Cesarstwa Rzymskiego."
 lepsius.2104.f: "„Zastanawiam się, czy archeolodzy w przyszłości znajdą kiedyś pozostawione przez nas monety i będą się zastanawiać, jak się tam znalazły”."
 lepsius.2104.g: "Mój Skarb!"
 lepsius.2111.t: "Starożytny Perski Sarkofag"
 lepsius.2111.f: "„Ostrożnie, ostrożnie. Nie możemy dopuścić, żeby to znalezisko zostało uszkodzone. Proszę nie używać do tego łomu!”"
 lepsius.2111.g: "Co za niezwykłe znalezisko!"
 lepsius.2112.t: "Skarb w Perskim Pałacu"
 lepsius.2112.d: "Wskazówka pewnego rolnika doprowadziła [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetFullName] do zaginionego perskiego pałacu z okresu panowania Achemenidów. Podczas późniejszych wykopalisk dokonano zaskakującego odkrycia."
 lepsius.2112.f: "Mezopotamia była jedną z kluczowych prowincji starożytnego Imperium Perskiego. Podczas podbojów Achemenidzi wywozili do swojej ojczyzny liczne dzieła sztuki, a także tabliczki zapisane pismem klinowym. Mimo to odkrycie całego archiwum mezopotamskich tabliczek w jednej z części odnalezionego pałacu było dla zespołu archeologicznego ogromnym zaskoczeniem."
 lepsius.2112.g: "Zbierzmy je wszystkie!"
 lepsius.2113.t: "Egipski Posąg w Perskim Grobowcu"
 lepsius.2113.d: "Podczas niewielkich wykopalisk w grobowcu perskiego arystokraty odkryto małą figurkę egipskiego boga Tota."
 lepsius.2113.f: "Persowie panowali nad Egiptem przez ponad sto lat. Jednak zarówno przed tym okresem, jak i po nim, między obiema cywilizacjami dochodziło do wymiany kulturowej, mimo że wojny między tymi imperiami były częstym zjawiskiem."
 lepsius.2113.g: "Jak ten artefakt się tutaj znalazł?"
 lepsius.2114.t: "Monumentalna Inskrypcja"
 lepsius.2114.d: "Osuwisko odsłoniło na zboczu góry monumentalną inskrypcję wykutą w skale, którą wcześniej uważano za zaginioną. Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] niezwłocznie wyruszył, aby zbadać tę starożytną relację."
 lepsius.2114.f: "Perskie inskrypcje i reliefy skalne zajmują trwałe miejsce w sztuce upadłego imperium. Najsłynniejszym przykładem jest Inskrypcja z Behistun, wielojęzyczna inskrypcja królewska Achemenidów wraz z monumentalnym reliefem skalnym, wykutymi na urwisku góry Behistun w irańskiej prowincji Kermanszah na polecenie Dariusza Wielkiego. Odegrała ona kluczową rolę w odczytaniu pisma klinowego, ponieważ jest najdłuższą znaną trójjęzyczną inskrypcją klinową, sporządzoną w językach staroperskim, elamickim i babilońskim (odmianie akadyjskiego)."
 lepsius.2114.g: "Ważne źródło historyczne dotyczące dziejów Persji!"
 lepsius_state_trait_tikal: "Tikal – Miasto w Dżungli\n#G +1#! @lepsius_local_minor! Lokalny Artefakt z Projektów Archeologicznych"
 je_lepsius_tikal: "Tikal – Miasto w Dżungli"
 je_lepsius_tikal_reason: "Wyprawa Stephensa i Catherwooda wzbudziła ogromne zainteresowanie, zwłaszcza po opublikowaniu książki zawierającej liczne ilustracje zaginionych miast Majów. Jednak dwaj podróżnicy nie odkryli wszystkich tych miejsc. Wiele nieznanych stanowisk archeologicznych wciąż czekało na ponowne odkrycie. Jednym z nich było legendarne Tikal."
 lepsius.71.t: "Tikal – Miasto w Dżungli"
 lepsius.71.d: "Po żmudnych poszukiwaniach w głębi gwatemalskiej dżungli wyprawa pod przewodnictwem prof. [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] odnalazła legendarne miasto Majów – Tikal. To historyczne wydarzenie dla naszego narodu, ale jakie wnioski powinniśmy z niego wyciągnąć?"
 lepsius.71.f: "Tikal to starożytne miasto Majów, położone w lasach deszczowych regionu Petén w północnej Gwatemali, słynące z imponujących świątyń schodkowych. Było jednym z najważniejszych miast Majów w okresie klasycznym (od III do IX wieku) i należy do najlepiej zbadanych miast tej cywilizacji. Pierwsze ślady osadnictwa pochodzą z początku I tysiąclecia p.n.e. W II wieku rozpoczął się właściwy rozwój miasta, któremu towarzyszyła budowa świątyń, stel oraz kompleksów pałacowo-świątynnych. Pierwszy okres świetności przypadł na V wiek, kiedy potężna dynastia panująca podporządkowywała sobie kolejne niewielkie państwa w sąsiedztwie, przekształcając je w królestwa wasalne. Doprowadziło to do długotrwałego konfliktu z potężnym sąsiednim państwem Calakmul. Tikal przeżyło drugi okres rozkwitu w VIII wieku, po pokonaniu rywalizującego z nim Calakmul. Na początku IX wieku potęga Tikal zaczęła słabnąć, a działalność budowlana ustała. Najpóźniej w X wieku miasto zostało całkowicie opuszczone."
 LEPSIUS_NO_MORE_EXPEDITIONS_FOR_YEARS_TT: "Przez #n 3 do 5 lat#! #n nie będziesz mógł#! organizować żadnych [Concept('concept_lepsius_expedition','$concept_lepsius_expeditions|q$')], ponieważ Twój [concept_lepsius_archaeologist] będzie zajęty katalogowaniem znalezisk."
 LEPSIUS_SUB_TEAM_WITH_EXPLANATION_TT: "Stracisz #R 1#! [Concept('concept_lepsius_archaeological_team','$concept_lepsius_excavation_team|q$')]. Możesz go #p odzyskać#! po zakończeniu [concept_lepsius_expedition] lub pozostawić na miejscu, aby przeprowadzić [concept_lepsius_excavation], jeśli opracowano technologię #V Wczesna Archeologia#!."
 lepsius_long_expedition_tt: "Długa [concept_lepsius_expedition] potrwa około #V 1 roku#!. Po zakończeniu wyprawy [concept_lepsius_archaeologist] będzie musiał skatalogować znaleziska, a Ty #p nie będziesz mógł#! zorganizować kolejnej wyprawy przez #n 5 lat#!."
 lepsius_medium_expedition_tt: "Średnia [concept_lepsius_expedition] potrwa około #V 10 miesięcy#!. Po zakończeniu wyprawy [concept_lepsius_archaeologist] będzie musiał skatalogować znaleziska, a Ty #p nie będziesz mógł#! zorganizować kolejnej wyprawy przez #n 4 lata#!."
 lepsius_short_expedition_tt: "Krótka [concept_lepsius_expedition] potrwa około #V 8 miesięcy#!. Po zakończeniu wyprawy [concept_lepsius_archaeologist] będzie musiał skatalogować znaleziska, a Ty #p nie będziesz mógł#! zorganizować kolejnej wyprawy przez #n 3 lata#!."
 lepsius_leave_team_for_excavation_tt: "Pozwolisz swojemu [Concept('concept_lepsius_archaeological_team','$concept_lepsius_excavation_team|q$')] rozpocząć [concept_lepsius_excavation], które zazwyczaj będą dostarczać #V 1#! [concept_lepsius_artifact] #V rocznie#!."
 lepsius.2101.d: "Gdy pewien mieszkaniec znalazł żelazny sztylet w [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName], [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetFullName] zebrał zespół i rozpoczął wykopaliska. Odkryto rozmaite pozostałości starożytnej bitwy z czasów rzymskich, od fragmentów tarczy po gwoździe i kilka monet. Dzięki znalezionym monetom archeolodzy mogli dość dokładnie określić datę bitwy."
 lepsius.2102.d: "Pewien rolnik znalazł starożytne pozostałości na jednym ze swoich pól. Na szczęście skontaktował się z uniwersytetem, dzięki czemu Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] zdołał odkryć starożytną Villa Rustica w [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName]. Różnorodność znalezisk archeologicznych pozwala wyciągnąć wnioski na temat życia ludności rzymskiej na wsi."
 lepsius.2103.d: "Odkrycie licznych rzymskich tabliczek wykonanych z cienkiego drewna w [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] wzbudziło ogromny entuzjazm wśród archeologów. Chociaż Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] zdołał odczytać treść zaledwie kilku tabliczek przy użyciu współczesnych metod, nawet te nieliczne znaleziska pozwalają nam lepiej poznać życie Rzymian."
 lepsius.2111.d: "W [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] dokonano niezwykłego odkrycia z czasów starożytnego Imperium Perskiego. Pewien rolnik znalazł stary sarkofag z brązu i skontaktował się z Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName]. Dzięki [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] wiedzy i doświadczeniu Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] zdołał otworzyć sarkofag i odkrył w nim szkielet ozdobiony luksusową biżuterią. Biżuteria sugeruje, że zmarły był wysoko postawionym dostojnikiem achemenidzkim."
 je_lepsius_dreamtime: "Czas Snu"
 je_lepsius_dreamtime_reason: "Brytyjski etnolog Walter Baldwin Spencer i jego australijski współpracownik Francis James Gillen przetłumaczyli słowo „alcheringa” z języka Arrernte, używanego w środkowej Australii, jako „śnienie”. Dla Aborygenów Czas Snu odnosi się do duchowego, naturalnego i moralnego porządku wszechświata. W tym kontekście śnienie oznacza zbiorową zdolność do prawidłowego rozumienia świata i rządzących nim zależności oraz korzystania z tej wiedzy, odwoływania się do świata mitów podczas obrzędów religijnych, a także posiadania siły życiowej. Na terenie całej Australii rozsiane są liczne miejsca kultu związane z Czasem Snu i innymi mitami Aborygenów, a także pozostałości archeologiczne i antropologiczne. Nadszedł czas, aby dokładnie zbadać przeszłość ostatniego z kontynentów."
 lepsius_2_excavation_team_needed_tt: "Posiadaj co najmniej #G 2#! Zespoły Wykopaliskowe."
 lepsius.72.t: "Czas Snu"
 lepsius.72.d: "Podczas swojej podróży po Australii profesorowie [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] i [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] przeprowadzili cenne badania naukowe, które rzucają światło na dotychczas niezbadane dzieje kontynentu."
 lepsius.72.f: "Po powrocie naukowcy zaskoczyli Towarzystwo Naukowe całą serią imponujących znalezisk. Sporządzili rysunki i szkice malowideł naskalnych, przywieźli kości liczące tysiące lat, odnaleźli artefakty zarówno z odległej, jak i niedawnej przeszłości oraz spisali mity i opowieści Aborygenów. Żaden z ich kolegów nie spodziewał się tak bogatych zbiorów."
 lepsius.72.g: "Och, jest tu nawet didgeridoo!"
 je_lepsius_gwanggaeto: "Stela Gwanggaeto"
 je_lepsius_gwanggaeto_reason: "Stela Gwanggaeto to kamień pamiątkowy poświęcony Gwanggaeto, który był królem Goguryeo od 391 roku aż do swojej śmierci. Stela znajduje się w Chinach, niedaleko granicy z Koreą Północną. Wyryta na niej inskrypcja jest najstarszym i najbardziej szczegółowym zachowanym źródłem dotyczącym historii Królestwa Goguryeo. Po upadku Królestwa Goguryeo w 668 roku, a następnie jego następcy, Balhae, region wokół Guonei i Wandu stracił na znaczeniu. Po mandżurskim podboju Cesarstwa Chińskiego w 1644 roku cesarze nowej dynastii Qing ogłosili rozległy obszar na północ od rzeki Yalu strefą zamkniętą. Dopiero w drugiej połowie XIX wieku teren ten ponownie udostępniono osadnikom. Około 1876 roku pewien chiński urzędnik ponownie odkrył stelę, która była całkowicie porośnięta roślinnością i częściowo zapadnięta w ziemię."
 lepsius_gwanggaeto_modifier: "Dziedzictwo Goguryeo"
 lepsius.73.t: "Stela Gwanggaeto"
 lepsius.73.d: "Przypadkowe odkrycie wielkiej steli z czasów zaginionego imperium Goguryeo nie tylko pozwala zajrzeć w dotychczas nieznaną przeszłość, ale także rodzi zagadki – zagadki, które mogą mieć wybuchowe konsekwencje polityczne."
 lepsius.74.t: "Goguryeo – Imperium Koreańskie"
 lepsius.74.d: "Po odkryciu steli poświęconej królowi Gwanggaeto Chiny śmiało ogłosiły, że stanowi ona dowód na to, iż Goguryeo nie było państwem koreańskim, lecz chińskim – a przynajmniej państwem zależnym od Chin. Japonia natomiast twierdzi, że inskrypcja dowodzi japońskiego panowania nad południową częścią Korei."
 lepsius.75.t: "Inwazja Wa"
 lepsius.75.d: "Niedawno odkryta Stela Gwanggaeto dostarcza dowodów na udaną japońską inwazję na południową część Korei i podporządkowanie sobie tamtejszych państw."
 lepsius.73.f: "Stela odkryta przez [SCOPE.sCharacter('lepsius_archaeologist_scope').GetFullName] jest monumentalnym pomnikiem, być może nawet największą stelą na świecie. Choć stanowi wyjątkowe źródło wiedzy pozwalające odtworzyć historię państwa Goguryeo, położonego na terenach północnej Korei i południowej Mandżurii, trudne do odczytania fragmenty inskrypcji oraz spór o tożsamość Królestwa Goguryeo mają konsekwencje polityczne, których nie można lekceważyć, zwłaszcza w czasach, gdy nacjonalizm budzi się również w państwach Dalekiego Wschodu. Królestwo Goguryeo łączą głębokie więzi historyczne i kulturowe ze współczesnymi koreańskimi grupami etnicznymi, jednak Chiny nie bez powodu obawiają się, że wieloetniczne tereny południowej Mandżurii, stanowiące niegdyś centrum Goguryeo, mogą stać się przedmiotem roszczeń koreańskich nacjonalistów dążących do odzyskania dawnych ziem. Z kolei fragment inskrypcji dotyczący możliwej inwazji Japonii (Wa) stał się podstawą spekulacji na temat japońskiego panowania nad południową Koreą, podczas gdy według koreańskiej interpretacji to państwa koreańskie dokonały inwazji na Japonię."
 lepsius.73.g: "Pouczająca przeszłość, której tajemnice warto rozszyfrować."
 lepsius.73.h: "Goguryeo było ważnym państwem chińskim."
 lepsius.73.i: "To podkreśla, że południowa Mandżuria była pierwotnie ziemią koreańską."
 lepsius.73.j: "Wskazówka świadcząca o wpływach Japonii w Korei."
 lepsius.2131.t: "Fragmenty Czaszki Znalezione w Osadzie Azteków"
 lepsius.2131.d: "W [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] dokonano makabrycznego odkrycia. Liczne fragmenty czaszek skłoniły Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] do przypuszczenia, że w tym miejscu znajdowało się niegdyś tzompantli, czyli stojak na czaszki."
 lepsius.2131.f: "Aztekowie często składali w ofierze jeńców pojmanych podczas Wojen Kwiatowych. Czaszki tych ofiar nierzadko umieszczano następnie na tzompantli, czyli stojakach na czaszki. Często układano je również jedną na drugiej, tworząc swego rodzaju ścianę z czaszek. W niektórych świątyniach znajdowały się nawet kamienne ściany, w których kamieniarze wykuwali czaszki jako elementy dekoracyjne."
 lepsius.2131.g: "Co za okrucieństwo!"
 lepsius.2132.t: "Aztecka Inskrypcja ocalona przez miejscowego Uczonego"
 lepsius.2132.d: "Kiedy w [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] wymieniano nawierzchnię chodnika, nikt nie przypuszczał, że podjęte prace doprowadzą do odkrycia archeologicznego. Jednak pewien miejscowy uczony dostrzegł na płytach chodnikowych liczne azteckie inskrypcje. Profesor [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] został wezwany na miejsce i zdołał ocalić inskrypcje."
 lepsius.2132.f: "Znalezisko przedstawia pewną bitwę stoczoną przez Mexików. Nie jesteśmy jeszcze pewni znaczenia wszystkich zapisów w języku nahuatl, ale występuje w nich wiele nazw geograficznych. Możemy więc przynajmniej ustalić, jakie miejsca zostały wymienione."
 lepsius.2132.g: "Dzięki Bogu, że udało mu się to odnaleźć, zanim wykorzystano to do wyłożenia chodnika."
 lepsius.2133.t: "Odkryto Ruiny Azteków"
 lepsius.2133.d: "W [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] odkryto ruiny starożytnej osady Azteków. Profesor [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] natychmiast rozpoczął wykopaliska. Niestety, poza samymi budowlami nie udało się znaleźć zbyt wiele."
 lepsius.2133.f: "„Choć ruiny zostały już splądrowane, pozwalają nam lepiej poznać życie Mexików przed przybyciem Europejczyków. To wciąż ważne znalezisko dla naszych badań!”"
 lepsius.2133.g: "Interesujące."
 lepsius.2134.t: "Odkryto Obsydianowe Zwierciadło"
 lepsius.2134.d: "W [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] odkryto arcydzieło azteckiego rzemiosła. Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] zdołał wydobyć doskonale wykonane obsydianowe zwierciadło, używane przez Azteków podczas obrzędów religijnych."
 lepsius.2134.f: "„Wierzono, że obsydianowe zwierciadła umożliwiały komunikację ze światem podziemnym. Jeden z bogów, Tezcatlipoca, był nawet przedstawiany ze zwierciadłem zamiast stopy. To wspaniałe odkrycie archeologiczne!”"
 lepsius.2134.g: "Niesamowite!"
 lepsius.2141.t: "Odkryto Wrak Kartagińskiego Statku"
 lepsius.2141.d: "Poławiacze pereł w [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] odkryli wrak starożytnego kartagińskiego statku. Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] zdecydował, że statek na razie pozostanie na dnie morza, jednak dzięki nurkom udało się zbadać i udokumentować jego ładunek, co pozwoliło lepiej poznać kartagińskie szlaki handlowe."
 lepsius.2141.f: "„Jest tu mnóstwo purpurowych tkanin, które prawdopodobnie były przeznaczone dla arystokracji z różnych krajów”."
 lepsius.2141.g: "Najwięksi kupcy basenu Morza Śródziemnego!"
 lepsius.2142.t: "Osiadły na Mieliźnie Punicki Okręt Wojenny"
 lepsius.2142.d: "Kto by pomyślał, że Kartagińczycy, władcy mórz, mogli osiąść na mieliźnie? A jednak najwyraźniej właśnie to wydarzyło się w [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName]. Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] zdołał wydobyć wiele artefaktów z niegdyś potężnego okrętu wojennego. Niestety, większość drewnianych elementów uległa już rozkładowi."
 lepsius.2142.f: "„Czy to birema, triera, kwinkwerema, czy może jeszcze więcej rzędów wioseł?”"
 lepsius.2142.g: "Niegdyś wspaniały okręt!"
 lepsius.2143.t: "Odkryto Port Punicki"
 lepsius.2143.d: "W [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] odkryto starożytny port kartagiński. Profesor [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] nakazał dokładne zbadanie stanowiska archeologicznego. Niestety, udało się ocalić jedynie część pozostałości, ponieważ pewien bogaty przemysłowiec zamierzał natychmiast wybudować w tym miejscu nową fabrykę."
 lepsius.2143.f: "„Przynajmniej udało nam się znaleźć kilka amfor. Z pewnością wiele nam powiedzą o starożytnym handlu śródziemnomorskim”."
 lepsius.2143.g: "Cały nieznany dotąd port! Co za odkrycie!"
 lepsius.2144.t: "Odkryto Monety ze Starożytnej Kartaginy"
 lepsius.2144.d: "Pewien rolnik odkopał skarb starożytnych monet w [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName]. Niestety, nawet dokładne badania przeprowadzone przez Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] nie doprowadziły do odkrycia żadnych innych punickich artefaktów. Pozostaje zagadką, w jaki sposób monety znalazły się na tym polu."
 lepsius.2144.f: "„Ta moneta przedstawia Hazdrubala, brata Hannibala. Najwyraźniej musi być stosunkowo nowa”."
 lepsius.2144.g: "Teraz jestem bogaty!"
 lepsius.2151.t: "Odkryto Celtycki Kocioł"
 lepsius.2151.d: "Celtowie używali kotłów do wielu różnych celów. Teraz jeden z takich ogromnych kotłów odnaleziono w [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName]. Profesor [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] zdołał pozyskać ten imponujący wyrób metalowy do naszej kolekcji."
 lepsius.2151.f: "„Istnieje legenda o wielkim wojowniku, który wpadł do kotła pełnego magicznego wywaru, obdarzającego każdego, kto go wypije, nadludzką siłą. Podobno wojownik ten był tak silny, że potrafił podnosić ogromne głazy. Uwielbiał też walczyć z Rzymianami”."
 lepsius.2151.g: "Mam nadzieję, że nikt jeszcze nie wpadł do Magicznego Kotła!"
 lepsius.2152.t: "Odkryto Celtyckie Okucie Tarczy z Brązu"
 lepsius.2152.d: "W mulistym korycie rzeki w [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] znaleziono płytę z brązu. Po przybyciu na miejsce Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] udało się ustalić, że [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] ma przed sobą metalową płytę, która niegdyś stanowiła część celtyckiej tarczy."
 lepsius.2152.f: "„Według niektórych opowieści celtyckich wodzów noszono na tarczach, ale z pewnością są to tylko bajki dla dzieci. Tacyt wspomina jednak o wodzach unoszonych na tarczach podczas ogłaszania ich nowymi przywódcami. Być może właśnie to wydarzenie historyczne dało początek tym opowieściom”."
 lepsius.2152.g: "Tarcza godna wielkiego wodza!"
 lepsius.2153.t: "Odnaleziono Celtycki Hełm z Brązu"
 lepsius.2153.d: "W [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] znaleziono hełm z brązu ozdobiony rogami. Profesor [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] szybko ustalił, że w rzeczywistości nie był to hełm używany podczas walki, lecz celtycki przedmiot kultowy."
 lepsius.2153.f: "„Być może widzieliście przedstawienia Celtów noszących hełmy ozdobione skrzydłami lub rogami, ale są one błędne. Podczas bitwy taki hełm stanowiłby przeszkodę. Tego rodzaju hełmy rzeczywiście istniały, lecz często były jedynie przedmiotami kultowymi związanymi z określonymi celtyckimi bogami”."
 lepsius.2153.g: "Co za wspaniały hełm!"
 lepsius.2154.t: "Odkryto Starożytny Menhir"
 lepsius.2154.d: "Podczas jednej z [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] wędrówek po okolicy Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] natrafił na dziwny kamień w [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName]. Okazało się, że jest to celtycki menhir, wzniesiony niegdyś przez miejscowe plemię Celtów. Obecnie Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] prowadzi szczegółowe badania menhiru."
 lepsius.2154.f: "„Nie wiemy, dlaczego Celtowie wznosili menhiry, ponieważ nie pozostawili po sobie żadnych pisemnych świadectw. Możliwe jednak, że były to miejsca kultu. Niektórzy mieszkańcy mają własną opowieść o słynnym wojowniku i jego potężnym psie. Ów Obelix podobno wykonywał menhiry o idealnych kształtach i ustawiał je bez niczyjej pomocy. To jednak tylko niedorzeczna historyjka”."
 lepsius.2154.g: "Czy to dzieło Obeliksa?"
 lepsius.2161.t: "Odkryto Egejski Fresk"
 lepsius.2161.d: "Podczas miejscowych wykopalisk w ruinach egejskich w [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] odkryto wspaniały fresk. Profesor [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] nakazał sporządzić rysunki znaleziska, ponieważ fresk jest związany z ruinami."
 lepsius.2161.f: "„Te wzory są niesamowite! Chciałbym, żebyśmy i w dzisiejszych czasach tworzyli takie piękne dzieła!”"
 lepsius.2161.g: "To jest Sztuka!"
 lepsius.2162.t: "Odkryto Ruiny Egejskie"
 lepsius.2162.d: "Podczas prac budowlanych w [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] odkryto starożytne ruiny egejskie. Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] rozpoczął szczegółowe badania stanowiska archeologicznego. Niestety, zachowało się niewiele znalezisk, jednak ruiny mogą pomóc nam lepiej zrozumieć życie ludzi, którzy niegdyś tu mieszkali."
 lepsius.2162.f: "„Te łuki stoją tu od tysiącleci. Ciekawe, czy nasze budowle przetrwają równie długo...”"
 lepsius.2162.g: "Dzięki temu dowiemy się wiele o życiu w starożytnym świecie egejskim."
 lepsius.2163.t: "Odkopano Egejską Biżuterię"
 lepsius.2163.d: "Szczęśliwym trafem pewien rolnik natknął się na fascynujące znalezisko w [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName]. Kiedy profesor [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] przybył na miejsce, [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] mógł jedynie podziwiać niezwykłą biżuterię egejską."
 lepsius.2163.f: "„Jaka piękna biżuteria! Chciałbym, żebyśmy i dziś potrafili tworzyć podobne ozdoby!”"
 lepsius.2163.g: "Wspaniałe rzemiosło!"
 lepsius.2164.t: "Złoty Puchar Pochodzenia Egejskiego"
 lepsius.2164.d: "Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] zdołał odkryć złoty puchar na jednym z naszych lokalnych stanowisk archeologicznych. Nikt nie spodziewał się tak wspaniałego znaleziska, ale najwyraźniej [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] wciąż kryje wiele możliwości dokonania niezwykłych odkryć."
 lepsius.2164.f: "„Puchar przedstawia scenę z mężczyzną i kilkoma bykami. Byki ukazano w dynamicznych, zróżnicowanych pozach”."
 lepsius.2164.g: "Chciałbym mieć taki puchar!"
 lepsius.2171.t: "Egipskie Malowidła Ścienne"
 lepsius.2171.d: "Starożytne egipskie malowidła ścienne zostały odkryte przez profesora [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] podczas jednej z [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] podróży do [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName]. Malowidła przedstawiają sceny z życia starożytnego Egiptu."
 lepsius.2171.f: "„Fascynujące jest to, że na tych ścianach wciąż zachowały się malowidła, podczas gdy w Grecji wszystko jest po prostu białe. Najwyraźniej Egipcjanie albo znacznie bardziej lubili kolory, albo pustynny klimat lepiej sprzyjał ich zachowaniu”."
 lepsius.2171.g: "Wspaniałe malowidła!"
 lepsius.2172.t: "Odkopano Starożytną Egipską Świątynię"
 lepsius.2172.d: "Kto by pomyślał, że w [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] wciąż znajdują się nieodkryte świątynie? A jednak! Profesor [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] odnalazł jedną z nich pod warstwami piasku. To wspaniałe odkrycie, mimo że wszystkie cenne przedmioty już dawno zniknęły."
 lepsius.2172.f: "„Spójrz na tę świątynię! Czy potrafisz sobie wyobrazić ceremonie religijne, które się tutaj odbywały? Czyż to nie niesamowite?”"
 lepsius.2172.g: "Możemy się tutaj tak wiele nauczyć!"
 lepsius.2173.t: "Odnaleziono Egipski Posąg"
 lepsius.2173.d: "Choć posąg jest uszkodzony, nadal pozostaje wspaniałym dziełem nieznanego egipskiego kamieniarza. Posąg znaleziony w [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] prawdopodobnie przedstawiał niegdyś sokoła, zanim uległ zniszczeniu. Tak przynajmniej uważa Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName]."
 lepsius.2173.f: "„Może nie wygląda zbyt imponująco, ale ten posąg pozwoli nam wiele dowiedzieć się o tym, jak Egipcjanie wykonywali takie rzeźby!”"
 lepsius.2173.g: "To fantastyczne dzieła kamieniarzy!"
 lepsius.2174.t: "Odkryto Egipską Mumię"
 lepsius.2174.d: "Mumie są prawdopodobnie jednymi z najczęstszych znalezisk w Egipcie. Jedną z nich odnaleziono w [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName]. Profesor [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] rozpoczął jej bardzo dokładne badania, ale niektórzy mają... inne pomysły."
 lepsius.2174.f: "„Wyobraźcie sobie, że dzięki tym mumiom moglibyśmy dowiedzieć się, co jedli i pili mieszkańcy starożytnego Egiptu oraz jakim cieszyli się zdrowiem. To byłoby fantastyczne!”"
 lepsius.2174.g: "Śmierć to dopiero początek."
 lepsius.2174.h: "Słyszałem, że niektórzy lubią jeść mumie! Sprzedajmy ją!"
 lepsius.2181.t: "Odkryto Miejsce Starożytnej Greckiej Bitwy"
 lepsius.2181.d: "Wojny diadochów spustoszyły wiele regionów świata. W [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] najwyraźniej doszło do niewielkiej bitwy. Nie ustalono jeszcze, czy była ona częścią wojen diadochów. Profesor [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] odnalazł różne rodzaje broni oraz fragmenty zbroi."
 lepsius.2181.f: "„Musiała się tu rozegrać niewielka bitwa. Nie tak wielka jak inne, ale mimo to ważna. Jestem pewien, że dowiemy się jeszcze więcej o tym miejscu!”"
 lepsius.2181.g: "Jakże tragiczne były te wojny..."
 lepsius.2182.t: "Odnaleziono Helleńskie Monety"
 lepsius.2182.d: "Starożytni Hellenowie pozostawili po sobie ślady w odległych zakątkach świata, od basenu Morza Śródziemnego aż po Indie. Często można natrafić na ich monety, tak jak miało to miejsce w [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName]. Dzięki znalezionym monetom Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] będzie mógł ustalić, w jakim stopniu Grecy byli obecni w tym regionie."
 lepsius.2182.f: "Chyba jestem teraz bogaty!"
 lepsius.2182.g: "Fascynujące!"
 lepsius.2183.t: "Odkopano Helleńskie Ruiny"
 lepsius.2183.d: "[SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] to kolejne miejsce, w którym odkryto helleńskie ruiny. Pozostałości helleńskich miast można znaleźć od Hiszpanii aż po Indie. Profesor [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] uważa, że to konkretne miasto pozwoli nam dowiedzieć się więcej o greckim osadnictwie."
 lepsius.2183.f: "„Czy potrafisz sobie wyobrazić, że jedna kultura rozprzestrzeniła się na tak ogromnym obszarze? To naprawdę niewiarygodne!”"
 lepsius.2183.g: "Greckie miasta są po prostu wszędzie, prawda?"
 lepsius.2184.t: "Wizerunek Greckiego Boga"
 lepsius.2184.d: "Greccy bogowie i ich religia dotarli do odległych krain. W [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName] niedawno odkryto wizerunek greckiego boga. Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] ustalił, że musi to być Dionizos, grecki bóg wina."
 lepsius.2184.f: "„Według greckiej opowieści, gdy tylko Dionizos przyszedł na świat, Zeus zaszył go w swoim udzie i zaniósł do Nysy w Etiopii, za Egiptem. Jeśli zaś chodzi o Pana, Grecy nie wiedzą, co się z nim stało po narodzinach. Jest więc dla mnie oczywiste, że Grecy poznali imiona tych dwóch bogów później niż imiona wszystkich pozostałych, a ich narodziny umiejscawiają w czasach, gdy sami się o nich dowiedzieli”.\n– Herodot"
 lepsius.2184.g: "Wypijmy trochę wina, aby uczcić to odkrycie!"
 lepsius.2500.t: "Nowa Mapa Archeologiczna [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName]"
 lepsius.2500.d: "Profesor [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] ciężko pracował nad naniesieniem na mapę wszystkich znalezisk archeologicznych z ostatnich lat w [SCOPE.sState('lepsius_local_archaeological_state_scope').GetName]. Mapa ta pozwala określić, gdzie można spodziewać się kolejnych odkryć."
 lepsius.2500.f: "„Tutaj znaleźliśmy kilka gwoździ, a tam kości owcy! Czyż to nie niesamowite?!”"
 lepsius.2500.g: "To otworzy drogę do nowych odkryć!"
 lepsius.2501.t: "Ilustrowany Katalog Archeologiczny [GetPlayer.GetName]"
 lepsius.2501.d: "Profesor [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] jest nie tylko znakomitym archeologiem, ale także utalentowanym artystą. Dzięki swoim zdolnościom artystycznym zdołał opublikować Ilustrowany Katalog Archeologiczny [GetPlayer.GetNameNoFormatting], który przez wielu laików jest uważany za doskonałe wprowadzenie do archeologii."
 lepsius.2501.f: "„Spójrz na te ilustracje! Czuję się, jakbym był w muzeum i oglądał te przedmioty na własne oczy! Niesamowite!”"
 lepsius.2501.g: "Wspaniała książka!"
 lepsius.2502.t: "Nowy Katalog Wszystkich Znalezisk Archeologicznych [GetPlayer.GetName]"
 lepsius.2502.d: "Opracowując nowy katalog wszystkich znalezisk archeologicznych w [GetPlayer.GetNameNoFormatting], Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] wykonał niezwykle żmudną pracę, której ukończenie mało kto uważał za możliwe. Dzięki jego nadzwyczajnemu wysiłkowi dysponujemy teraz szczegółowym, siedmiotomowym katalogiem wszystkich dotychczasowych znalezisk."
 lepsius.2502.f: "„Numer 7342: Kawałek kamienia, prawdopodobnie z neolitu, nazwany Kamuś”."
 lepsius.2502.g: "To przyda się w przyszłości!"
 lepsius.2503.t: "Profesor [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] udaremnia przemyt Artefaktów"
 lepsius.2503.d: "Po miesiącach pracy Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] zdołał doprowadzić do aresztowania członków szajki przemytniczej, która przemycała artefakty przez nasz kraj. Artefakty zostały skonfiskowane i obecnie są bezpiecznie przechowywane w naszej kolekcji."
 lepsius.2503.f: "„Zniszczyliście bezcenne źródła wiedzy archeologicznej, łajdacy!”"
 lepsius.2503.g: "To powinno trafić do Muzeum!"
 lepsius.2600.t: "Zaginiona Gwiazda"
 lepsius.2600.d: "Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] od dawna zastanawiał się, dlaczego starożytne przedstawienia gwiazd nie odpowiadają temu, co widzimy dziś na niebie. Dzięki pomocy profesora [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] udało mu się w końcu odkryć przyczynę tej rozbieżności. Wspólnie odkryli nową gwiazdę na nocnym niebie."
 lepsius.2600.f: "„Tam! Właśnie tam jest, dokładnie tak, jak mówili mi starożytni Egipcjanie! W końcu odnaleźliśmy zaginioną gwiazdę!”"
 lepsius.2600.g: "Przełomowe odkrycie naukowe!"
 lepsius.2601.t: "Ustalanie Dat Wydarzeń Historycznych na Podstawie Wiedzy Astronomicznej o Zaćmieniach Słońca"
 lepsius.2601.d: "Dzięki wspólnym wysiłkom profesor [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] i profesor [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] zdołali wykorzystać współczesną wiedzę astronomiczną o zaćmieniach Słońca do ustalenia dat konkretnych wydarzeń historycznych opisanych w źródłach pierwotnych."
 lepsius.2601.f: "„Oczywiście Tales z Miletu mówił o zaćmieniu Słońca z 28 maja 585 roku n.e., a nie o żadnym innym zaćmieniu!”"
 lepsius.2601.g: "To ogromny krok naprzód dla archeologii!"
 lepsius.2602.t: "Przegląd Wiedzy Astronomicznej Dawnych Kultur"
 lepsius.2602.d: "Dr. [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] i profesor [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] opublikowali nową książkę zawierającą przegląd wiedzy astronomicznej starożytnych cywilizacji."
 lepsius.2602.f: "„Tak, wiedzieli, że Ziemia nie jest centrum niczego. Nie, nawet wtedy nie byli na tyle głupi, by wierzyć, że Ziemia jest płaska. Tak, jestem tego absolutnie pewien”."
 lepsius.2602.g: "Ciekawa lektura!"
 lepsius.2603.t: "Zrekonstruowano Maszynę Parową Herona"
 lepsius.2603.d: "Kiedy profesor [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] opowiedział Dr. [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] o starożytnej maszynie parowej Herona, ten natychmiast zapalił się do pomysłu jej odtworzenia. Wspólnie zbudowali niewielką replikę eolipili."
 lepsius.2603.f: "„Jak widzicie, eolipila nie posiada mechanizmu przenoszenia napędu. Dlatego jest raczej zabawką niż prawdziwą maszyną. Niestety, nigdy nie doczekała się dalszego rozwoju”."
 lepsius.2603.g: "Jakim cudem nie doszło u nich do industrializacji?"
 lepsius_illustrated_archaeological_catalog_modifier: "Napisał Ilustrowany Katalog Archeologiczny"
 lepsius.12.f: "Obecnie Kolekcja Egipska zawiera #p [ROOT.Var('lepsius_egyptian_artifact_minor').GetValue]#! @lepsius_egypt_minor! pomniejszych artefaktów oraz #p [ROOT.Var('lepsius_egyptian_artifact_major').GetValue]#! @lepsius_egypt_major! cennych artefaktów. \n\n Kolekcję Egipską można #T zreorganizować#!, organizując w ten sposób nową wystawę. Wymaga to jednak określonej liczby artefaktów. \n\n #T Mała wystawa#! wymaga #p 10#! @lepsius_egypt_minor! artefaktów, #T średnia wystawa#! wymaga #p 25#! @lepsius_egypt_minor! artefaktów, #T duża wystawa#! wymaga #p 50#! @lepsius_egypt_minor! artefaktów, a #T znakomita wystawa#! wymaga #p 100#! @lepsius_egypt_minor! artefaktów. Ponadto #T znakomita wystawa#! wymaga #p 1#! @lepsius_egypt_major! cennego artefaktu. \n\n Reorganizacja kolekcji i przygotowania do nowej wystawy potrwają około pół roku. Premie zapewniane przez wystawę pozostają na stałe – aż do kolejnej reorganizacji."
