 lepsius_identify_heidelbergensis_fossil_tt: "Zyskaj #G 1#! @dubois_human_fossil! #O Skamielinę Homo Heidelbergensis#!"
 lepsius_heidelbergensis_complete_tt: "Sklasyfikuj Homo Heidelbergensis jako gatunek"
 andersson_anthropologist_achievement_completed_heidelbergensis_anthropologist_loc: "Na podstawie zaledwie kilku skamielin, dzięki nowoczesnym narzędziom oraz [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetHerHis] niezrównanemu geniuszowi, Profesor [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastNameNoFormatting] jako pierwszy sklasyfikował #o Homo Heidelbergensis#!."
 notification_lepsius_heidelbergensis_systemized_notification_name: "Homo Heidelbergensis opisany po raz pierwszy"
 notification_lepsius_heidelbergensis_systemized_notification_desc: "Naukowcy po raz pierwszy zidentyfikowali i przeanalizowali kości Homo Heidelbergensis oraz szczegółowo opisali ten gatunek."
 lepsius_ishtar_gate_modifier: "Brama Isztar"
 lepsius.313.h: "Dr. [SCOPE.sCharacter('lepsius_relaxing_archaeologist').GetLastName] jest pilniej potrzebny gdzie indziej."
 lepsius.321.t: "Katalogowanie Ukończone"
 lepsius.321.d: "Po wielu miesiącach żmudnego porządkowania, identyfikowania, numerowania i oceniania pozostałości odnalezionych podczas wyprawy Doktor [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] znów może zająć się innymi zadaniami."
 lepsius.321.f: "„Ostatecznie jesteśmy księgowymi historii — tyle że nasze bilanse zawsze są na minusie. Ujmujemy niewiedzę w tabelach. Jedyną pociechą jest to, że w przeciwieństwie do archiwistów czasem widujemy słońce”."
 lepsius.321.g: "Jeśli będziesz się tym zajmować zbyt długo, w końcu pokryjesz się kurzem tak samo jak artefakty."
 je_lepsius_cataloging: "Katalogowanie Archeologiczne"
 je_lepsius_cataloging_reason: "Katalogowanie archeologiczne to systematyczny proces dokumentowania, opisywania i wprowadzania znalezisk z wykopalisk archeologicznych lub istniejących kolekcji do bazy danych bądź systemu inwentarzowego. Każde znalezisko zostaje powiązane z danymi o jego kontekście: lokalizacją, stratygrafią, okolicznościami odkrycia, materiałem, wymiarami czy datowaniem.\n\nProces ten trwa znacznie dłużej niż sama wyprawa i często sprawia, że zespół archeologiczny musi długo czekać, zanim obierze sobie nowy cel. Ale który archeolog nie byłby dumny z wypełniania tego niezwykle pasjonującego obowiązku?"
