 lepsius_expedition_general_information_loc: "\n$mr_divider_for_je$\nTwoja [concept_lepsius_expedition] będzie otrzymywać co miesiąc wydarzenie zwiększające jej postęp. Gdy postęp osiągnie wymagany poziom, Wyprawa dobiegnie końca.\n$mr_divider_for_je$\nWartość Sukcesu określa, jak pomyślnie przebiega wyprawa. Im wyższy sukces, tym więcej [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts|q$')] otrzymasz na jej zakończenie. Maksymalną liczbę artefaktów otrzymasz, jeśli sukces osiągnie #V 15#!.\nNa sukces może wpływać wiele czynników, od wydarzeń po przygotowania. Na przykład 10 poziomów Uniwersytetów z [concept_pm_academics_university_humanities] zapewni ci 1 punkt sukcesu na początku wyprawy. Pamiętaj, że specjalizacje Uniwersytetów mogą zapewnić maksymalnie 4 punkty."
