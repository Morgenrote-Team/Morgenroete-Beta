 lepsius_antiquarianism_tech: "Antykwaryzm"
 lepsius_antiquarianism_tech_desc: "Kolekcjonerzy dzieł sztuki interesowali się przeszłością już od czasów włoskiego renesansu. Podczas gdy Johann Joachim Winckelmann wzbudził zainteresowanie starożytnym Rzymem i Grecją, wyprawy napoleońskie wybudziły Egipt z uśpienia przeszłości. Pomimo tych postępów badania przedarcheologiczne były kształtowane przez takich awanturników jak Giovanni Battista Belzoni, którego metody badawcze oscylowały między poszukiwaniem skarbów a grabieżą grobów."
 lepsius_early_archaeology_tech: "Wczesna Archeologia"
 lepsius_early_archaeology_tech_desc: "Po pracach przygotowawczych Champolliona Karl Richard Lepsius zdołał całkowicie odczytać egipskie hieroglify. Symbolizuje to zmianę w krajobrazie archeologii: towarzystwa archeologiczne, instytuty i muzea promowały nową kulturę naukową. Niemniej Auguste Mariette, jeden z ojców założycieli ochrony zabytków, nie wahał się użyć ładunków wybuchowych do otwarcia Serapeum po jego odkryciu."
 lepsius_modern_archaeology_tech: "Współczesna archeologia"
 lepsius_modern_archaeology_tech_desc: "Dalszy rozwój metodologii prac terenowych w archeologii nastąpił pod koniec XIX wieku. Jedną z pionierskich postaci w tej dziedzinie był Augustus Pitt Rivers, który skrupulatnie prowadził wykopaliska na Cranborne Chase w południowej Anglii, podkreślając, że nie tylko przedmioty piękne lub wartościowe powinny być rejestrowane, ale również te codziennego użytku. Flinders Petrie wprowadził systematyczną metodologię w archeologii oraz w zakresie ochrony artefaktów."
