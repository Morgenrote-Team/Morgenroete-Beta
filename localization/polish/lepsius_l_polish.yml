 lepsius.1101.t: "Kongres Archeologiczny: Exodus"
 lepsius.1101.d: "Nasz Naród poczynił wszelkie niezbędne przygotowania do zorganizowania kolejnego Kongresu Archeologicznego. Głównym tematem obrad będzie rola Biblii w archeologii i badaniach nad starożytnością. Zaproszenia zostaną wysłane do wszystkich czołowych archeologów świata. Profesor [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] będzie przewodniczyć obradom."
 lepsius.1101.f: "Już w czasach rzymskich brak źródeł dotyczących starożytnego Egiptu sprawiał, że opracowania historyczne opierały się na źródłach wtórnych, takich jak dzieła Herodota. Tendencja ta utrzymywała się również w średniowieczu. Biblia dostarczała wskazówek i przez długi czas była uznawana za wiarygodne źródło wiedzy o historii Bliskiego Wschodu, również dlatego, że po prostu brakowało innych przekazów. Wraz z odczytaniem hieroglifów i narodzinami nowoczesnej egiptologii zarówno zwolennicy, jak i krytycy Biblii zaczęli poszukiwać dowodów potwierdzających lub podważających prawdziwość biblijnych relacji. Wraz z rozpoczęciem badań nad starożytną Babilonią tendencja ta jeszcze bardziej się nasiliła. Przykładem sporu o historyczność opowieści biblijnych był Exodus, czyli wyjście Izraelitów z Egiptu, na które nie znaleziono żadnych dowodów w źródłach egipskich."
 lepsius.1101.g: "Niech cały świat archeologii będzie naszym gościem."
 lepsius.1102.d: "[SCOPE.sCountry('lepsius_congress_host_country').GetName] zaprosiło nas na kongres archeologiczny. Tematem obrad będzie historyczność Biblii na przykładzie Exodusu. Nasz Archeolog, profesor [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName], otrzymał serdeczne zaproszenie."
 lepsius.1102.g: "Znowu te niekończące się spory o to, kto ma najlepsze skórzane kurtki..."
 lepsius.1103.t_laughed: "Drwiny Towarzystwa Archeologicznego"
 lepsius.1103.t_respected: "Pewne Siebie Wystąpienie"
 lepsius.1103.t_lauded: "Podziw i Gratulacje"
 lepsius.1103.d_laughed: "Wystąpienie profesora [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] zostało przyjęte z rozbawieniem. [ROOT.GetCountry.GetNameNoFlag] nie cieszy się szczególną reputacją w dziedzinie egiptologii, ponieważ nie może poszczycić się żadnymi wybitnymi osiągnięciami. Za zamkniętymi drzwiami wyraźnie nie brakowało żartów."
 lepsius.1103.d_respected: "Przed rozpoczęciem Kongresu Archeologicznego nasz Archeolog został serdecznie powitany, a uczestnicy wymienili się zwyczajowymi uprzejmościami. [ROOT.GetCountry.GetNameNoFlag] cieszy się uznaniem w świecie nauki."
 lepsius.1103.d_lauded: "Przybycie profesora [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] zostało powitane z wielką radością. Uważano go za jednego z najbardziej wyczekiwanych gości. Wokół profesora szybko zgromadził się tłum, gdyż [ROOT.GetCountry.GetNameNoFlag] jest uznawane za pioniera w dziedzinie egiptologii."
 lepsius.1103.f_laughed: "„Dlaczego archeolodzy z [ROOT.GetCountry.GetAdjectiveNoFlag] nie mają powodzenia u dziewczyn?\n\nBo mają najgorsze metody randkowania!(dating techniques)”"
 lepsius.1103.f_respected: "Po przybyciu profesor [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] odbył kilka miłych rozmów z kolegami po fachu, głównie na temat nudnych ruin, które każdy laik uznałby za jeszcze nudniejsze formacje skalne."
 lepsius.1103.f_lauded: "Prof. [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] wydawał się niemal przytłoczony ogromnym zainteresowaniem. Tak wielu kolegów po fachu pragnęło z nim porozmawiać i skorzystać z wiedzy zdobytej podczas jego wypraw oraz z jego doświadczenia. Niektórzy nawet namawiali go do wygłoszenia prywatnego wykładu."
 lepsius.1103.g: "Co za wstyd!"
 lepsius.1103.h: "Wreszcie wśród ludzi o podobnych poglądach."
 lepsius.1103.i: "Jesteśmy czołową potęgą archeologiczną!"
 lepsius.1104.t: "Exodus: Fakt Historyczny czy Fikcja?"
 lepsius.1104.d: "Konferencja poświęcona konkretnemu zagadnieniu szybko przerodziła się w spór o fundamentalne kwestie. Początkowo zamierzano jedynie omówić biblijny Exodus i źródła egipskie, lecz dyskusja szybko przekształciła się w debatę na temat wartości Biblii jako źródła historycznego i archeologicznego. Dwa obozy uczonych stoją teraz na całkowicie przeciwstawnych, niemożliwych do pogodzenia stanowisk."
 lepsius.1104.f: "[SCOPE.sCharacter('lepsius_bible_defender_scope').GetFullName] zamierzał właśnie wygłosić wykład na temat kultury pamięci Izraelitów i miejsca, jakie zajmuje w niej Exodus, gdy [SCOPE.sCharacter('lepsius_bible_attacker_scope').GetFullName] zadał prowokacyjne, lecz uzasadnione pytanie, czy takie rozważania nie są jedynie stratą czasu. Przede wszystkim należałoby bowiem ustalić, czy Biblię w ogóle można uznać za źródło historyczne, skoro nie istnieją żadne świadectwa archeologiczne przemawiające za historycznością Exodusu. Również wśród odczytanych i przetłumaczonych dotychczas tekstów nie znaleziono żadnych wzmianek o tym wydarzeniu. Należałoby zatem zadać zasadnicze pytanie, czy Pięcioksiąg Mojżeszowy nie jest w rzeczywistości zbiorem zmyślonych opowieści, a przez to źródłem całkowicie bezużytecznym. „W archeologii chodzi o fakty, a nie o prawdę” – podsumował. [SCOPE.sCharacter('lepsius_bible_defender_scope').GetFullName] odpowiedział na te zarzuty, argumentując, że tekstów biblijnych nie należy traktować jako relacji naocznych świadków, lecz raczej jako źródła wtórne dotyczące wydarzeń stanowiących jeden z elementów układanki, jaką jest kultura pamięci starożytnych ludów. „Całkowite odrzucenie Biblii jest równie niedorzeczne jak uznawanie każdego jej słowa za fakt historyczny. Chodzi raczej o zadawanie właściwych pytań” – stwierdził."
 lepsius.1104.g: "Biblia ma pewną wartość historyczną jako źródło wtórne."
 lepsius.1104.h: "Biblia nie ma żadnej wartości historycznej."
 lepsius.1105.t: "Archeolodzy we własnym gronie"
 lepsius.1105.d: "Poza obradami trwającego Kongresu Archeologicznego nasz Archeolog zaprzyjaźnił się z zagranicznym kolegą po fachu i wymienił z nim poglądy."
 lepsius.1105.f: "Kongres trwał już od kilku dni, a profesor [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] początkowo miał okazję rozmawiać z nieznanym mu wcześniej kolegą po fachu jedynie podczas przerw. Po spotkaniu wspólnie udali się na posiłek, a im dłużej uczeni ze sobą rozmawiali, tym więcej dowiadywali się o sobie nawzajem i tym więcej mogli się od siebie nauczyć. Jak się okazało, [SCOPE.sCharacter('lepsius_foreign_archaeologist_scope').GetFullName] jest osobą o bogatym doświadczeniu."
 lepsius.1105.g: "Kolejny Przyjaciel Archeologii!"
 lepsius.1106.t: "Artefakt Negocjatora"
 lepsius.1106.d: "Na Kongres Archeologiczny w [SCOPE.sCountry('lepsius_congress_host_country').GetName] przybył negocjator reprezentujący właściciela antyków. Próbuje on sprzedać zainteresowanemu muzeum pewien artefakt w imieniu arystokraty, który pragnie zachować anonimowość. Jak dotąd nie znalazł jednak nabywcy."
 lepsius.1106.f: "Prof. [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] zdołał osobiście przekonać się o autentyczności artefaktu. Jednak ze względu na wysoką cenę waha się przed zakupem i czeka na zgodę ze stolicy, zanim podejmie jakiekolwiek działania."
 lepsius.1106.g: "Drogi, ale cenny."
 lepsius.1106.h: "Niewystarczająco cenny."
 lepsius.1107.t: "Przyjacielska Rozmowa"
 lepsius.1107.d: "Na kuluarach Kongresu Archeologicznego w [SCOPE.sCountry('lepsius_congress_host_country').GetName] nasz Archeolog przedstawił [ROOT.GetCountry.GetNameNoFlag] w bardzo pozytywnym świetle podczas rozmów z kilkoma kolegami po fachu."
 lepsius.1107.f: "Nie wiadomo, co dokładnie powiedział profesor [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName], ale najwyraźniej trafił do przekonania pozostałym archeologom. Z pewnością podzielą się oni tym pozytywnym wrażeniem po powrocie do swoich ojczyzn."
 lepsius.1107.g: "Poprawmy nasze stosunki."
 lepsius.1107.h: "Poprawmy naszą reputację."
 lepsius.1108.t: "Asystent"
 lepsius.1108.d: "Ambitny młodzieniec, który chciał dostać się na Kongres Archeologiczny, lecz nie został wpuszczony przez strażników pilnujących wejścia, zwrócił uwagę profesora [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName]."
 lepsius.1108.f: "Oczywiście studentowi odmówiono wstępu do sali, w której zgromadziło się elitarne grono archeologów z całego świata, jednak jego wytrwałość zrobiła na [SCOPE.sCharacter('lepsius_archaeologist_scope').GetFullName] tak duże wrażenie, że postanowił lepiej poznać młodzieńca. Jak się okazało, mimo młodego wieku posiadał on rozległą wiedzę zarówno z zakresu języków starożytnych, jak i geografii. Już po kilku godzinach profesor postanowił, że po zakończeniu kongresu zatrudni go jako swojego asystenta, mając nadzieję, że młodzieniec wkrótce wniesie cenny wkład w rozwój nauki."
 lepsius.1108.g: "Spodziewamy się Kariery Naukowej."
 lepsius.1109.t_merit: "Exodus: Więcej niż Opowieść"
 lepsius.1109.t_invention: "Exodus: Fikcja, a nie Fakt"
 lepsius.1109.d_merit: "Po wielu spotkaniach, debatach i sporach Kongres Archeologiczny dobiegł końca, a jego uczestnicy opracowali końcową deklarację. Zgodnie z nią Biblia nie jest pierwotnym źródłem historycznym, jednak pod pewnymi względami nadal posiada wartość historyczną, nawet jeśli niekoniecznie odnosi się to bezpośrednio do Egiptu i Babilonii."
 lepsius.1109.d_invention: "Po wielu spotkaniach, debatach i sporach Kongres Archeologiczny dobiegł końca, a jego uczestnicy opracowali końcową deklarację. Zgodnie z nią Biblia nie ma żadnej wartości dla archeologii ani historii. Jest raczej w dużej mierze zbiorem wymyślonych opowieści, które bardziej utrudniają, niż pomagają w badaniu starożytności."
 lepsius.1109.f_merit: "Mniejsza grupa archeologów uznała to stanowisko za kompromis, inni jednak dostrzegli w nim bardziej wyważone podejście do przeszłości, wykraczające poza skrajne poglądy. Choć odkrycie to nie odnosiło się bezpośrednio do Exodusu, niektórzy archeolodzy zwrócili uwagę na niedawno odkryty tekst z czasów faraona Merenptaha, wspominający o spustoszeniu dokonanym wśród ludu Izraela. Inna grupa wskazała, że według inskrypcji z Portalu Bubastydów, odczytanych przez Champolliona, faraon Szeszonk rzeczywiście złupił Jerozolimę. Wszystko to wskazuje, że zamiast dosłownie interpretować treść Biblii, należy traktować ją jako jeden z elementów układanki w badaniach nad historią starożytną. Błędne interpretacje są nieuniknione, ale dotyczy to wszystkich dziedzin nauki."
 lepsius.1109.f_invention: "Ostatecznie obóz sceptyków zdołał przeforsować swoje najbardziej radykalne postulaty. Odtąd opowieści biblijne miały mieć nie większą wartość niż na przykład legendy o siedmiu królach Rzymu czy greckie mity. Tym samym uprzywilejowana pozycja Biblii w świecie zachodnim dobiegła końca, przynajmniej w tej dziedzinie. Desperackie próby wskazywania zbieżności między znaleziskami archeologicznymi a fragmentami Biblii uznano za to, czym rzeczywiście były: zwykłe przypadki. Kwestia interpretacji Biblii stała się więc wyłącznie przedmiotem badań literackich. Niektórzy archeolodzy wspominali również o możliwości, że opowieści biblijne zostały co najwyżej zaczerpnięte z egipskich opowieści lub babilońskich mitów. W takim przypadku należałoby jedynie zbadać zależności między tymi przekazami. Poza tym dla archeologii i historii sprawa została zamknięta: Biblia była w dużej mierze zbiorem wymyślonych opowieści, pozbawionych jakiejkolwiek wartości naukowej."
 lepsius.1109.g: "Trzeba właściwie klasyfikować i interpretować teksty."
 lepsius.1109.h: "Biblia to bezużyteczny zbiór opowieści."
 lepsius.1109.i: "Wiedzieliśmy o tym już wcześniej."
 lepsius.1111.t: "Kongres Archeologiczny: Powstanie Cywilizacji"
 lepsius.1111.d: "Nasz kraj poczynił wszelkie niezbędne przygotowania do zorganizowania kolejnego Kongresu Archeologicznego. Głównym tematem obrad będzie pytanie o to, gdzie po raz pierwszy narodziła się cywilizacja. Według najnowszych ustaleń najprawdopodobniej była to Babilonia. Rodzi to kolejne pytanie o to, w jakim stopniu kultura babilońska wpłynęła na inne kultury. Zaproszenia zostaną wysłane do wszystkich wybitnych archeologów na świecie. Obradom będzie przewodniczył profesor [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName]."
 lepsius.1111.f: "Wiedza o istnieniu cywilizacji babilońskiej nigdy nie została całkowicie zapomniana – już w czasach starożytnych Greków znano przekazy o Babilończykach i Asyryjczykach. Jednak odczytanie pisma akadyjskiego ujawniło, że istniały znacznie starsze kultury, takie jak Sumerowie, których dzieje sięgały jeszcze odleglejszych czasów niż historia Egipcjan. Cały szereg wynalazków charakterystycznych dla rozwiniętej cywilizacji kształtował codzienne życie tych starożytnych ludów, a wielu filologów i archeologów wkrótce zaczęło podejrzewać, że to właśnie Babilonia była prawdziwą kolebką cywilizacji. Fascynacja starożytną Mezopotamią szybko doprowadziła do tego, że początków wszystkich przejawów cywilizacji zaczęto doszukiwać się w Babilonii. Nie tylko Biblia, lecz także kultury Lewantu i Persji, a nawet Egipcjanie, miały być jedynie „odbiorcami kultury” lub „pośrednikami w przekazywaniu kultury” wywodzącej się z pierwotnej cywilizacji babilońskiej. Ta naukowa krótkowzroczność wkrótce zyskała prześmiewczą nazwę, którą zaczęli posługiwać się nawet jej zwolennicy: panbabilonizm."
 lepsius.1111.g: "Niech cały świat archeologii będzie naszym gościem."
 lepsius.1112.d: "[SCOPE.sCountry('lepsius_congress_host_country').GetName] zaprosiło nas na Kongres Archeologiczny. Głównym tematem obrad będzie pytanie o to, gdzie po raz pierwszy narodziła się cywilizacja. Według najnowszych ustaleń najprawdopodobniej była to Babilonia. Rodzi to kolejne pytanie o to, w jakim stopniu kultura babilońska wpłynęła na inne kultury. Nasz Archeolog, profesor [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName], otrzymał serdeczne zaproszenie."
 lepsius.1112.g: "Znowu te niekończące się spory o to, kto ma najlepsze skórzane kurtki..."
 lepsius.1113.d_laughed: "Wystąpienie profesora [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] zostało przyjęte z rozbawieniem. [ROOT.GetCountry.GetNameNoFlag] nie cieszy się szczególną reputacją w dziedzinie asyriologii, ponieważ nie może poszczycić się żadnymi wybitnymi osiągnięciami. Za zamkniętymi drzwiami wyraźnie nie brakowało żartów."
 lepsius.1113.d_respected: "Przed rozpoczęciem Kongresu Archeologicznego nasz Archeolog został serdecznie powitany, a uczestnicy wymienili się zwyczajowymi uprzejmościami. [ROOT.GetCountry.GetNameNoFlag] cieszy się uznaniem w świecie nauki."
 lepsius.1113.d_lauded: "Przybycie profesora [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] zostało powitane z wielką radością. Uważano go za jednego z najbardziej wyczekiwanych gości. Wokół profesora szybko zgromadził się tłum, gdyż [ROOT.GetCountry.GetNameNoFlag] jest uznawane za pioniera w dziedzinie asyriologii."
 lepsius.1114.t: "Babilon: Kolebka Cywilizacji?"
 lepsius.1114.d: "W trakcie kongresu dyskusja o początkach cywilizacji coraz bardziej przeradzała się w debatę nad tym, czy i w jakim stopniu Babilon wpłynął na wszystkie kultury Bliskiego Wschodu i wschodniej części basenu Morza Śródziemnego. Niektórzy zakładają, że niemal każda idea, która odegrała później jakąś rolę, narodziła się w starożytnym Babilonie!"
 lepsius.1114.f: "Profesor [SCOPE.sCharacter('lepsius_babylon_defender_scope').GetLastName] rozpoczął debatę niezwykle interesującym wystąpieniem na temat osiągnięć kulturowych i wysokiego poziomu wiedzy Babilończyków sprzed ponad 4000 lat: „Sumeryjsko-babiloński krąg kulturowy opiera się na teorii świata, zgodnie z którą regulowano wszelkie struktury państwowe i społeczne. Wszystkie nauki i sztuki wywodzą się z pierwotnej mądrości objawionej przez niebiosa, według której zarządza się własnością i zapewnia jej ochronę. Panbabilonizm dąży do wykazania, że ten astralny światopogląd odcisnął swoje piętno na wszystkich kulturach i religiach świata”. Pogląd ten wywołał jednak zdecydowany sprzeciw licznych uczonych, których rzecznikiem wkrótce został [SCOPE.sCharacter('lepsius_babylon_attacker_scope').GetFullName]. Odrzucił on twierdzenie, jakoby wszystkie mity wywodziły się od Babilończyków. „To, co przedstawił [SCOPE.sCharacter('lepsius_babylon_defender_scope').GetLastName], jest raczej zbiorem spekulacji niż faktów. Przekonanie, że niezależny rozwój podobnych zjawisk nie jest możliwy, jest daleko idącą przesadą. Na przykład egipskie hieroglify nie powstały pod wpływem pisma klinowego”. Podczas gdy panbabiloniści próbowali dowieść nadrzędnej roli Mezopotamii, stawiając ją w centrum, a wszystkie pozostałe mitologie spychając na peryferie, całkowicie przeoczyli fakt, że kultury mogą współistnieć w obrębie wspólnego kręgu kulturowego."
 lepsius.1114.g: "Babilon jest Kolebką Cywilizacji."
 lepsius.1114.h: "Cywilizacja narodziła się w kilku miejscach."
 lepsius.1119.t_panbabylonism: "Powstanie Cywilizacji: Triumf Panbabilonizmu"
 lepsius.1119.t_antipanbabylonism: "Powstanie Cywilizacji: Obalenie Panbabilonizmu"
 lepsius.1119.d_panbabylonism: "Po burzliwej debacie, która doprowadziła do podziałów wśród licznych uczonych, uczestnikom kongresu udało się uzgodnić końcową deklarację. Zgodnie z nią Mezopotamia jest nie tylko kolebką cywilizacji, lecz także miejscem narodzin wszystkich koncepcji mitologicznych Bliskiego Wschodu."
 lepsius.1119.d_antipanbabylonism: "Spory dobiegły końca, a po kilku burzliwych wymianach zdań uczeni zdołali dojść do porozumienia i podpisać końcową deklarację, która przypieczętowała ostateczną porażkę obozu panbabilonistów. Wprawdzie Mezopotamię uznano za jedną z najważniejszych kolebek cywilizacji, lecz nie za jedyną. Próby wywodzenia wszystkich mitologii od Babilończyków zostały zduszone w zarodku."
 lepsius.1119.f_panbabylonism: "Końcowa deklaracja potwierdziła wszystkie teorie wysuwane przez zwolenników panbabilonizmu: zależność mitologii i literatury Orientu od kultury babilońskiej była oczywista. Zarówno Biblia, jak i mity egipskie wyraźnie czerpią ze znanych koncepcji babilońskich, takich jak te zawarte w Eposie o Gilgameszu. Ostatecznie cały rozwój Bliskiego Wschodu pozostawał pod silnym wpływem kulturowym astronomii i astrologii tej pierwotnej cywilizacji, której idee przejawiały się w sposób mniej lub bardziej widoczny."
 lepsius.1119.f_antipanbabylonism: "Zwolennicy panbabilonizmu znaleźli się ostatecznie w mniejszości. Uczeni uznali wprawdzie, że wiele osiągnięć kultur mezopotamskich stanowiło jeden z fundamentów życia intelektualnego Bliskiego Wschodu. Jednak w końcowej deklaracji odrzucili roszczenia panbabilonistów do wyłączności, a nawet samo twierdzenie o istnieniu „kultury pierwotnej”. Badania astronomiczne, uważane za punkt wyjścia myśli babilońskiej, okazały się późniejszym osiągnięciem, które błędnie umieszczano u jej początków. Uczeni nie znaleźli również podstaw do uznania pierwszeństwa tradycji babilońskiej. Przeciwnie, okazało się, że rozmaite „babilońskie” opowieści stanowiły w rzeczywistości wspólne dziedzictwo tradycji całego regionu, które Babilończycy jedynie jako pierwsi spisali. Szczególnie gorzko zabrzmiało jedno ze zdań, w którym bez ogródek uznano panbabilonizm za pseudonaukę: „Ta mistyczna mądrość ma nie większe znaczenie naukowe niż «pierwotne objawienie» wszystkich wymiarów świata zawarte w Wielkiej Piramidzie, które niestety wciąż znajduje swoich wyznawców”."
 lepsius.1119.g: "Wszystko zaczęło się w Mezopotamii."
 lepsius.1119.h: "Nie istnieje tylko jedno źródło."
 lepsius.1121.t: "Kongres Archeologiczny: Status Troi"
 lepsius.1121.d: "Nasz kraj poczynił wszelkie niezbędne przygotowania do zorganizowania kolejnego Kongresu Archeologicznego. Konferencja ma na celu ostateczne rozstrzygnięcie kwestii Troi. Pomimo spektakularnych wykopalisk Heinricha Schliemanna w pełni uzasadnione pozostaje pytanie, co właściwie odkrył, czy rzeczywiście była to Troja i czy w ogóle istniała ona w takiej postaci. Zaproszenia zostaną wysłane do wszystkich wybitnych archeologów na świecie. Obradom będzie przewodniczył profesor [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName]."
 lepsius.1121.f: "Po tym, jak Schliemann ogłosił odkrycie Troi, minęło trochę czasu, zanim bardziej sceptyczni uczeni otrząsnęli się z szoku. Późniejsze badania wykazały nie tylko, że Schliemann prowadził wykopaliska w niewłaściwej warstwie archeologicznej, lecz także, że odnaleziony przez niego rzekomy „Skarb Priama” był znacznie starszy niż Troja opisana przez Homera. Wkrótce zaczęły krążyć pogłoski, że Schliemann mógł odkopać niewłaściwe miasto. Inni upierali się, że nie można odkopać czegoś, co nigdy nie istniało. Jeszcze inni bronili odkrycia Schliemanna, uznając, że dostarczył wystarczających dowodów, ponieważ opierał się na starożytnych opisach. Znaleziska z czasów rzymskich również dowodziły, że Grecy i Rzymianie uważali to miejsce za teren, na którym rozegrała się wojna trojańska. Odkrycie Troi nie zakończyło naukowego sporu, lecz jedynie zapoczątkowało jego nowy etap."
 lepsius.1121.g: "Niech świat archeologii będzie naszym gościem."
 lepsius.1122.d: "[SCOPE.sCountry('lepsius_congress_host_country').GetName] zaprosiło nas na Kongres Archeologiczny. Konferencja ma na celu ostateczne rozstrzygnięcie kwestii Troi. Pomimo spektakularnych wykopalisk Heinricha Schliemanna w pełni uzasadnione pozostaje pytanie, co właściwie odkrył, czy rzeczywiście była to Troja i czy w ogóle istniała ona w takiej postaci. Nasz Archeolog, profesor [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName], otrzymał serdeczne zaproszenie."
 lepsius.1122.g: "Wiecznie te spory o to, kto ma najwspanialsze skórzane kurtki..."
 lepsius.1123.d_laughed: "Wystąpienie profesora [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] zostało przyjęte z rozbawieniem. [ROOT.GetCountry.GetNameNoFlag] nie cieszy się szczególną reputacją w dziedzinie archeologii egejskiej, ponieważ nie może poszczycić się żadnymi wybitnymi osiągnięciami. Za zamkniętymi drzwiami wyraźnie nie brakowało żartów."
 lepsius.1123.d_respected: "Przed rozpoczęciem Kongresu Archeologicznego nasz Archeolog został serdecznie powitany, a uczestnicy wymienili się zwyczajowymi uprzejmościami. [ROOT.GetCountry.GetNameNoFlag] cieszy się uznaniem w świecie nauki."
 lepsius.1123.d_lauded: "Przybycie profesora [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] zostało powitane z wielką radością. Uważano go za jednego z najbardziej wyczekiwanych gości. Wokół profesora szybko zgromadził się tłum, gdyż [ROOT.GetCountry.GetNameNoFlag] jest uznawane za pioniera w dziedzinie archeologii egejskiej."
 lepsius.1124.t: "Troja: Tylko Mit?"
 lepsius.1124.d: "Debata na temat statusu Troi budzi jeszcze większe kontrowersje, niż się spodziewano. Wyłoniły się nie dwa, lecz trzy obozy. Pierwszą grupę stanowią zagorzali zwolennicy Schliemanna, całkowicie przekonani o słuszności wszystkich wysuniętych przez niego tez. Naprzeciw nich stoi nieprzejednany obóz przeciwników, który dostrzega jedynie bardzo nikłe dowody na to, że Troja opisana przez Homera ma cokolwiek wspólnego z miejscem wykopalisk Schliemanna. Trzecia grupa uważa, że Schliemann popełnił poważne błędy, ale rzeczywiście odnalazł miasto, którego poszukiwał."
 lepsius.1124.f: "„Jeśli Schliemann nie odnalazł Troi, to co właściwie odkrył? Odnalazł miejsce odpowiadające opisom zawartym w Iliadzie i dziełach starożytnych autorów. Odkrył budowlę pochodzącą z odpowiedniego okresu. Znaleźliśmy również ślady wskazujące na to, że została ona zniszczona przez wrogów. Jakich jeszcze dowodów potrzeba?” – tak profesor [SCOPE.sCharacter('lepsius_troy_defender_scope').GetLastName] rozpoczął swój wykład, jednak wkrótce został zasypany licznymi pytaniami przez swojego kolegę [SCOPE.sCharacter('lepsius_troy_attacker_scope').GetLastName]. Zwrócił on na przykład uwagę, że już w okresie klasycznym starożytni Grecy nie wiedzieli, gdzie znajdowała się Troja, i błędnie utożsamiali z nią to miejsce. Podkreślił również, że nazwa odkrytego miasta pozostaje nieznana i nie ma żadnych wskazówek dotyczących jego związków ze światem greckim. Ponadto nigdy nie odnaleziono żadnych wiarygodnych źródeł historycznych potwierdzających przebieg wojny trojańskiej w jakiejkolwiek formie przypominającej opisy Homera. Wówczas do dyskusji włączył się pan [SCOPE.sCharacter('lepsius_troy_mediator_scope').GetLastName]: „Drodzy koledzy, Schliemann z pewnością popełnił błędy, ale czy naprawdę chcemy stracić z oczu szerszy obraz sytuacji?”"
 lepsius.1124.g: "Schliemann rzeczywiście odnalazł Troję."
 lepsius.1124.h: "Schliemann rzeczywiście odnalazł „Troję”, ale sprawa jest bardziej skomplikowana."
 lepsius.1124.i: "Nie ma żadnych wiarygodnych dowodów na to, że rzeczywiście jest to Troja."
 lepsius.1129.t_homeric: "Troja: Historia, a nie Mit"
 lepsius.1129.t_historical: "Troja: Historia i Mit"
 lepsius.1129.t_myth: "Troja: Mit, a nie Historia"
 lepsius.1129.t_disputed: "Troja: Nierozwiązana Zagadka"
 lepsius.1129.d_homeric: "Po wyczerpujących debatach i licznych wykładach zwyciężył obóz zwolenników Schliemanna, którzy rozpoznali w położonym na wzgórzu Hisarlık stanowisku archeologicznym homerycki Ilion. Za rzeczywistość historyczną uznano nie tylko istnienie Troi, lecz także wojnę trojańską i inne elementy eposów Homera."
 lepsius.1129.d_historical: "Archeolodzy zgromadzeni na kongresie w [SCOPE.sCountry('lepsius_congress_host_country').GetName] doszli do wniosku, że przynajmniej część tradycji homeryckiej zawiera ziarno prawdy. Nawet jeśli Schliemann popełnił błędy podczas wykopalisk, istnieją pewne dowody wskazujące na to, że Hisarlık odpowiada miejscu powszechnie utożsamianemu z Troją w literaturze i historiografii. Pozostaje jedynie wyjaśnić szczegóły."
 lepsius.1129.d_myth: "Kongres doszedł do wniosku, że po wiekach debata na temat Troi dobiegła końca. Rzekome odkrycie Troi umocniło stanowisko sceptyków, którzy z jeszcze większym przekonaniem podejrzewają, że eposy Homera są czystą fikcją. Cokolwiek odkopał Schliemann, nie może to być Troja, ponieważ nigdy nie istniała."
 lepsius.1129.d_disputed: "Przeciągające się spory między uczonymi doprowadziły w ostatnim czasie do głębokiego rozczarowania i apatii. Nie widać żadnego rozwiązania kwestii Troi – uczestnicy nie zdołali nawet uzgodnić wspólnej deklaracji końcowej. Niektórzy przedstawiciele opuścili kongres przed jego zakończeniem, inni zaś spędzili pozostały czas na kolejnych bezowocnych dyskusjach."
 lepsius.1129.f_homeric: "Zwolennicy Schliemanna świętują dziś wielki triumf. Z entuzjazmem wysłali telegram do odkrywcy Troi, informując go, że wszystkie jego tezy zostały potwierdzone, a on sam zostanie nawet honorowym członkiem towarzystwa. Bez wątpienia odkopał Troję, dostarczając tym samym dowodów na to, że wojna trojańska opisana w eposach Homera nie była wymysłem ani mglistym wspomnieniem, lecz rzeczywistym wydarzeniem historycznym. Teraz jeszcze ważniejsze staje się poszukiwanie kolejnych artefaktów w regionie Morza Egejskiego, które mogłyby dostarczyć więcej informacji o epoce niegdyś uznawanej za „mityczną”. Entuzjazm badaczy powinien sprawić, że wkrótce rozpoczną się intensywniejsze wykopaliska mające potwierdzić tezy Schliemanna. Być może niebawem uda się odnaleźć dom Odyseusza, grób Achillesa albo wannę, w której zamordowano Agamemnona? Zaskakujące, że Schliemann nie odpowiedział jeszcze na telegram..."
 lepsius.1129.f_historical: "Po długich dyskusjach i usilnych próbach przekonywania udało się osiągnąć kompromis wśród większości uczestników kongresu. Zdecydowana większość międzynarodowego zgromadzenia archeologów uważa, że Schliemann popełnił poważne błędy podczas wykopalisk w Troi. Między innymi nie ulega wątpliwości, że prowadził poszukiwania w niewłaściwej warstwie archeologicznej. Oznacza to jednak jedynie, że Schliemann odnalazł „niewłaściwą” Troję we „właściwym” miejscu. W innej warstwie może rzeczywiście znajdować się miasto pochodzące z czasów wojny trojańskiej. Archeolodzy ostatecznie nie zdołali ustalić, czy wojna ta była rzeczywistym wydarzeniem historycznym. Faktem pozostaje jednak, że miasto położone na wzgórzu, na którym znajduje się Troja, wielokrotnie padało ofiarą pożarów i wojen. Jeśli chodzi o tożsamość miasta, potwierdzona została teza o wpływach hetyckich. Uczeni zapowiedzieli, że wykorzystają te ustalenia jako impuls do podjęcia bardziej intensywnych badań i będą nadal prowadzić ożywione dyskusje nad kwestią Troi."
 lepsius.1129.f_myth: "Po burzliwych sporach archeolodzy i historycy zdołali w końcu podpisać wspólną deklarację, choć niektórzy uczynili to z wielką niechęcią. Zgodnie z nią eposy Homera uznano jedynie za dzieła literackie, które być może nawiązują do dawnych wydarzeń, jednak ich odtworzenie jest niezwykle trudne dla współczesnej archeologii. Niewykluczone, że wojna trojańska stanowi raczej obraz „wojny jako takiej”, odzwierciedlający ogół ludzkich doświadczeń. Troja mogłaby zatem zawierać mniej więcej tyle samo prawdy historycznej co Atlantyda: być swego rodzaju utopią, literackim miejscem, w którym ścierają się różne idee. Kongres zasadniczo uznał badania nad Troją za działalność „na pograniczu pseudonauki”, zarówno bezsensowną, jak i pozbawioną konkretnego celu. Archeologia powinna zająć się bardziej wartościowymi dziedzinami badań."
 lepsius.1129.f_disputed: "„Cóż, przynajmniej jedzenie było dobre!”"
 lepsius.1129.g: "A więc Schliemann naprawdę odnalazł Troję!"
 lepsius.1129.h: "Schliemann odkopał niewłaściwą Troję, ale miejsce jest właściwe."
 lepsius.1129.i: "Troja jest najprawdopodobniej jedynie literacką fikcją."
 lepsius.1129.j: "Cały ten kongres był kompletną stratą czasu!"
 lepsius.1201.t: "Lokalne Wykopaliska w [SCOPE.sState('lepsius_excavation_site').GetName]"
 lepsius.1201.d: "[SCOPE.sCharacter('lepsius_archaeologist_scope').GetFullName] odkrył nowe stanowisko archeologiczne w [SCOPE.sState('lepsius_excavation_site').GetName]. Wraz ze swoim zespołem natychmiast rozpoczął prace wykopaliskowe. Nie wiadomo jednak jeszcze, jak długo wykopaliska będą finansowane."
 lepsius.1201.f: "Wykopaliska można zatwierdzić na okres 5, 7 lub 10 lat. W przeciwieństwie do wykopalisk prowadzonych za granicą nie można ich przerwać w dowolnym momencie. Główny Archeolog pozostanie na stanowisku archeologicznym przez 6, 12 lub 18 miesięcy, w zależności od wybranego okresu, po czym powróci. W tym czasie będzie niedostępny."
 lepsius.1201.g: "10 lat."
 lepsius.1201.h: "7 lat."
 lepsius.1201.i: "5 lat."
 lepsius.1202.t: "Prof. [SCOPE.sCharacter('lepsius_archaeologist_scope').GetLastName] powraca z Wykopalisk"
 lepsius.1202.d: "[SCOPE.sCharacter('lepsius_archaeologist_scope').GetFullName] przez ostatnie kilka miesięcy pomagał w organizacji stanowiska archeologicznego w [SCOPE.sState('lepsius_excavation_site').GetName] i dokonał już kilku wstępnych odkryć. Teraz powraca na swoją uczelnię, aby przeanalizować wyniki badań, podczas gdy jego zespół będzie samodzielnie kontynuował wykopaliska przez kilka kolejnych lat, aż do wyczerpania funduszy."
 lepsius.1202.f: "„Niewiele jest rodzajów pracy, w których wyniki zależą tak bezpośrednio od osobowości wykonującego ją człowieka, jak w przypadku wykopalisk. Stare powiedzenie, że człowiek znajduje w badanym przedmiocie to, czego szuka, jest aż nazbyt prawdziwe. A jeśli brakuje mu przenikliwości, by odnaleźć to, czego poszukuje, to przynajmniej smutną prawdą pozostaje, że nie znajdzie niczego, czego nie szukał”. – Flinders Petrie"
 lepsius.1202.g: "Witamy z powrotem."
 lepsius.1203.t: "Lokalne Wykopaliska Zakończone"
 lepsius.1203.d: "Zespół archeologiczny zakończył lokalne wykopaliska i zabezpieczył ostatnie znaleziska. Jest teraz ponownie dostępny i może uczestniczyć w kolejnych wykopaliskach lub wyprawach."
 lepsius.1203.f: "Mroczne są ścieżki przeznaczenia,\nniepewna gwiazda przyszłości,\nzanim udam się na spoczynek,\nchętnie wypiję kieliszek koniaku. – Robert Koldewey"
 lepsius.1203.g: "Powinniśmy wkrótce przeprowadzić kolejne wykopaliska."
 lepsius.2000.t: "[SCOPE.sCharacter('lepsius_new_archaeologist_scope').GetLastName] opracowuje System Trzech Epok"
 lepsius.2000.d: "Dyrektor Duńskiego Muzeum Narodowego, [SCOPE.sCharacter('lepsius_new_archaeologist_scope').GetFullName], opracował system klasyfikacji znalezisk archeologicznych, dzielący je na trzy okresy: #b Epokę Kamienia#!, #b Epokę Brązu#! i #b Epokę Żelaza#!. To prawdziwa rewolucja w Archeologii!"
 lepsius.2000.f: "„Widzicie, niektóre artefakty zawsze występują razem, podczas gdy pewne materiały nigdy nie pojawiają się na tych samych stanowiskach archeologicznych. Na przykład srebro znajduje się wyłącznie tam, gdzie odkrywane są również żelazne narzędzia i broń. Z kolei złoto można znaleźć zarówno wśród narzędzi żelaznych, jak i brązowych.\nFascynujące jest również to, że niektóre materiały występują tylko w określonych rodzajach grobów. Narzędzia kamienne można znaleźć wyłącznie przy niespalonych szczątkach ludzkich oraz w grobowcach komorowych zbudowanych z kamienia. Żelazo natomiast odnajduje się w grobowcach komorowych ukrytych pod kurhanami.\nWszystko to pozwala nam znacznie dokładniej datować nasze znaleziska. Najpierw używano narzędzi kamiennych, następnie brązowych, a dopiero później żelaznych”."
 lepsius.2000.g: "Tak wybitny umysł musi pracować dla nas!"
 lepsius.2000.h: "Niech zostanie w swoim muzeum..."
