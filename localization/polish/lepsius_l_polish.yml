 lepsius_has_ark_clue_tt: "[GetPlayer.GetName] posiada #V Tajemniczą Wskazówkę#! dotyczącą Arki Przymierza."
 lepsius_has_atlantis_clue_tt: "[GetPlayer.GetName] posiada #V Tajemniczą Wskazówkę#! dotyczącą Atlantydy."
 lepsius_has_eldorado_clue_tt: "[GetPlayer.GetName] posiada #V Tajemniczą Wskazówkę#! dotyczącą El Dorado."
 lepsius_has_discovery_tt: "[GetPlayer.GetName] dokonało #V Odkrycia Archeologicznego#!."
 lepsius_specialization_egypt_button: "Egiptologia"
 lepsius_specialization_egypt_button_desc: "Egiptologia bada wszystkie aspekty cywilizacji starożytnego Egiptu (życie codzienne, język i literaturę, historię, religię, kulturę i sztukę, gospodarkę, prawo, etykę oraz życie intelektualne) od pradziejów V tysiąclecia p.n.e. (na przykład kultury Nagada i Badari) aż do końca panowania rzymskiego w IV wieku n.e."
 lepsius_specialization_mesopotamia_button: "Asyriologia"
 lepsius_specialization_mesopotamia_button_desc: "Asyriologia, zwana również nauką o piśmie klinowym lub nauką o starożytnym Bliskim Wschodzie, zajmuje się badaniami archeologicznymi, antropologicznymi, historycznymi i językoznawczymi kultur posługujących się pismem klinowym. Obejmuje Mezopotamię okresu przeddynastycznego, Sumer, wczesne sumeryjsko-akadyjskie miasta-państwa, Imperium Akadyjskie, Eblę, państwa Asyrii, Babilonii i Dynastii Kraju Nadmorskiego, w których używano języka akadyjskiego oraz aramejskiego imperialnego, a także obce dynastie przybyłe do południowej Mezopotamii, w tym Gutejczyków, Amorytów, Kasytów, Aramejczyków, Sutejczyków i Chaldejczyków."
 lepsius_specialization_aegean_button: "Archeologia Egejska"
 lepsius_specialization_aegean_button_desc: "Cywilizacja egejska to ogólne określenie cywilizacji epoki brązu rozwijających się na ziemiach greckich wokół Morza Egejskiego. Termin ten obejmuje trzy odrębne, lecz utrzymujące ze sobą kontakty i wzajemnie na siebie oddziałujące regiony: Kretę, Cyklady i Grecję kontynentalną. Kreta jest związana z cywilizacją minojską od wczesnej epoki brązu. Cywilizacja cykladzka zbliża się kulturowo do Grecji kontynentalnej w okresie wczesnohelladzkim, a do Krety w okresie średniominojskim. Od około 1450 roku p.n.e. (okres późnohelladzki i późnominojski) grecka cywilizacja mykeńska rozprzestrzenia się na Kretę, prawdopodobnie w wyniku podboju militarnego."
 lepsius_specialization_precolumbian_button: "Archeologia Prekolumbijska"
 lepsius_specialization_precolumbian_button_desc: "W dziejach obu Ameryk epoka prekolumbijska obejmuje okres od ich pierwszego zasiedlenia w górnym paleolicie po europejską kolonizację, zapoczątkowaną wyprawą Krzysztofa Kolumba w 1492 roku. Zazwyczaj termin ten odnosi się do historii kultur rdzennych ludów do momentu, gdy znalazły się pod znaczącym wpływem Europejczyków. W przypadku niektórych kultur nastąpiło to dopiero dziesiątki, a nawet setki lat po wyprawie Kolumba."
 lepsius_alexander_search_clue_button: "Znajdź więcej Wskazówek"
 lepsius_alexander_search_clue_button_desc: "Możemy zorganizować specjalną wyprawę archeologiczną, aby odnaleźć kolejną wskazówkę dotyczącą Grobowca Aleksandra Wielkiego."
 lepsius_ark_search_clue_button: "Znajdź więcej Wskazówek"
 lepsius_ark_search_clue_button_desc: "Możemy zorganizować specjalną wyprawę archeologiczną, aby odnaleźć kolejną wskazówkę dotyczącą Arki Przymierza."
 lepsius_atlantis_search_clue_button: "Znajdź więcej Wskazówek"
 lepsius_atlantis_search_clue_button_desc: "Możemy zorganizować specjalną wyprawę archeologiczną, aby odnaleźć kolejną wskazówkę dotyczącą Atlantydy."
 lepsius_eldorado_search_clue_button: "Znajdź więcej Wskazówek"
 lepsius_eldorado_search_clue_button_desc: "Możemy zorganizować specjalną wyprawę archeologiczną, aby odnaleźć kolejną wskazówkę dotyczącą El Dorado."
 lepsius_legendary_expedition_modifier: "Legendarna Wyprawa Archeologiczna"
 lepsius_alexander_intensive_study_button: "Siwa"
 lepsius_alexander_intensive_study_button_desc: "Oaza Siwa uchodzi za jedno z najważniejszych miejsc w życiu Aleksandra. Niektórzy twierdzą nawet, że pochowano go tutaj, a nie w Aleksandrii, ze względu na jego silny związek z egipskim bogiem Amonem, którego wyrocznia znajdowała się w tej oazie. Dzięki naszej rozległej wiedzy z zakresu egiptologii z łatwością odnajdziemy tu dodatkową wskazówkę. Nasz archeolog uda się tam prywatnie i w tajemnicy, bez rozgłosu towarzyszącego wyprawie."
 lepsius_ark_intensive_study_button: "Jerozolima"
 lepsius_ark_intensive_study_button_desc: "Wzgórze Świątynne w Jerozolimie uchodzi za ostatnie miejsce, w którym przechowywano Arkę Przymierza przed jej zaginięciem. Bardzo możliwe, że pod wzgórzem wciąż kryją się ważne wskazówki pozwalające ustalić, co tak naprawdę wydarzyło się w chaosie babilońskiego podboju. Dzięki naszej rozległej wiedzy z zakresu asyriologii z łatwością odnajdziemy tu dodatkową wskazówkę. Nasz archeolog uda się tam prywatnie i w tajemnicy, bez rozgłosu towarzyszącego wyprawie."
 lepsius_atlantis_intensive_study_button: "Santoryn"
 lepsius_atlantis_intensive_study_button_desc: "Santoryn (Thera) słynie z potężnej erupcji wulkanu, która dotkliwie zniszczyła minojskie miasto na wyspie i mogła poważnie zaszkodzić całej cywilizacji minojskiej. Przypuszczenie, że erupcja dała początek platońskiej opowieści o zatonięciu Atlantydy, jest jedną z wielu hipotez dotyczących jej położenia. Dzięki naszej rozległej wiedzy z zakresu Archeologii Egejskiej z łatwością odnajdziemy tu dodatkową wskazówkę. Nasz archeolog uda się tam prywatnie i w tajemnicy, bez rozgłosu towarzyszącego wyprawie."
 lepsius_eldorado_intensive_study_button: "Bogotá"
 lepsius_eldorado_intensive_study_button_desc: "Bogota uchodzi za dawną stolicę ludu Muisca, którego cywilizacja wiąże się z legendą o złotym El Dorado. Każdy nowy władca Muisca, obejmując władzę, składał ofiarę bogu słońca, a jego nagie ciało pokrywano pastą ze złotego pyłu. Dzięki naszej rozległej wiedzy z zakresu Archeologii Prekolumbijskiej z łatwością odnajdziemy tu dodatkową wskazówkę. Nasz archeolog uda się tam prywatnie i w tajemnicy, bez rozgłosu towarzyszącego wyprawie."
 lepsius_2_sub_archaeological_team_tt: "Stracisz #R 2#! Zespoły Wykopaliskowe."
 lepsius_egypt_specialist: "Specjalizacja: Egiptologia"
 lepsius_egypt_specialist_desc: "Ten archeolog jest ekspertem w dziedzinie Starożytnego Egiptu, dzięki czemu łatwiej odnajduje artefakty i wskazówki."
 lepsius_mesopotamia_specialist: "Specjalizacja: Asyriologia"
 lepsius_mesopotamia_specialist_desc: "Ten archeolog jest ekspertem w dziedzinie Starożytnej Mezopotamii, dzięki czemu łatwiej odnajduje artefakty i wskazówki."
 lepsius_aegean_specialist: "Specjalizacja: Archeologia Egejska"
 lepsius_aegean_specialist_desc: "Ten archeolog jest ekspertem w dziedzinie Cywilizacji Mykeńskiej i Minojskiej, dzięki czemu łatwiej odnajduje artefakty i wskazówki."
 lepsius_precolumbian_specialist: "Specjalizacja: Archeologia Prekolumbijska"
 lepsius_precolumbian_specialist_desc: "Ten archeolog jest ekspertem w dziedzinie Cywilizacji Prekolumbijskich, dzięki czemu łatwiej odnajduje artefakty i wskazówki."
 lepsius_state_trait_alexander: "Ślady Aleksandra"
 lepsius_state_trait_ark: "Ślady Arki"
 lepsius_state_trait_atlantis: "Ślady Atlantydy"
 lepsius_state_trait_eldorado: "Ślady El Dorado"
 lepsius.1001.t: "Zew Aleksandra"
 lepsius.1001.d: "Uroczyste otwarcie znakomitej kolekcji egipskich artefaktów, należącej do światowej czołówki, przywołuje wspomnienie, które niektórzy naukowcy z Muzeum Archeologicznego już dawno wyparli z pamięci..."
 lepsius.1001.f: "Wspomnienie macedońskiej świątyni pośród piasków odżywa, gdy [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetFullName] ogląda wystawę. Są tu bowiem kolejne zabytki z okresu ptolemejskiego, a niektóre nawet z czasów greckiego podboju. Elementy układanki, których wcześniej nie sposób było zrozumieć, nagle zaczynają do siebie pasować. Sugerują, że egipska pustynia może skrywać coś jeszcze. Coś tak wielkiego i potężnego, że cała Sahara nie wystarczy, by to pogrzebać. Miejsce ostatecznego spoczynku Aleksandra Wielkiego do dziś pozostaje tajemnicą. Jednak liczne znaleziska, ogrom zgromadzonej wiedzy i wybitne umiejętności archeologiczne Dr. [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] tworzą połączenie, jakiego historia jeszcze nie znała. Archeolog jest pewien: Aleksander był człowiekiem należącym do żywych, nie do umarłych. A ktokolwiek odnajdzie miejsce jego wiecznego spoczynku — zdobędzie wieczną sławę."
 lepsius.1001.g: "Marzenie każdego archeologa..."
 lepsius.1002.t: "Arka"
 lepsius.1002.d: "Uroczyste otwarcie znakomitej kolekcji mezopotamskich artefaktów, należącej do światowej czołówki, przywołuje wspomnienie, które niektórzy naukowcy z Muzeum Archeologicznego już dawno wyparli z pamięci..."
 lepsius.1002.f: "Arkę Przymierza zdobiły cherubiny — istoty łączące cechy różnych stworzeń, podobne do tych znanych z Mezopotamii. Abraham, praojciec Izraela i trzech religii światowych, pochodził z Ur. Biblijny opis stworzenia wykazuje podobieństwa do mitów babilońskich. Babilon to zarazem miejsce tragicznie splecione z losem Izraela: to władcy Mezopotamii zniszczyli pierwsze państwa żydowskie, obrócili Świątynię w popiół i uprowadzili ludność. Od tamtej pory bez śladu zaginęła również Arka Przymierza, w której Mojżesz miał złożyć tablice z Dziesięciorgiem Przykazań. Jest ona jednym z najważniejszych zaginionych artefaktów w dziejach świata. Przyglądając się doskonałej kolekcji, [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetFullName] odnajduje wskazówki sugerujące, że Arka Przymierza być może nie przepadła na zawsze — i od 2,500 lat czeka na odnalezienie."
 lepsius.1003.t: "Największy Mit wszech czasów"
 lepsius.1003.d: "Uroczyste otwarcie znakomitej kolekcji egejskich artefaktów, należącej do światowej czołówki, przywołuje wspomnienie, które niektórzy naukowcy z Muzeum Archeologicznego już dawno wyparli z pamięci..."
 lepsius.1003.f: "[GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetFullName] przyglądał się orichalkowi spoczywającemu między [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] palcami. Mała, lśniąca kulka. Materiał, który nie powinien istnieć. Trafił w [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] ręce po otwarciu wspaniałej wystawy w Muzeum Archeologicznym. Wystawy, na której inne eksponaty z obszaru minojsko-egejskiego również utwierdzały [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] przekonanie, że oto nauka styka się z mitem. Czy archeologowi wolno było marzyć? Nikt nie wierzył Schliemannowi, gdy szukał Troi. Wieżę Babel również uznawano za zwykłą metaforę. A co z największym mitem wszech czasów? Mitem tak potężnym, że już w starożytności nie potrafiono rozstrzygnąć, gdzie kończy się opowieść, a zaczyna historia.\nDr. [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] wpatruje się w lśniącą kulkę, w której odbija się [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] twarz. Z jej głębi spogląda los całej zaginionej cywilizacji."
 lepsius.1004.t: "Klątwa Złota"
 lepsius.1004.d: "Uroczyste otwarcie znakomitej kolekcji prekolumbijskich artefaktów, należącej do światowej czołówki, przywołuje wspomnienie, które niektórzy naukowcy z Muzeum Archeologicznego już dawno wyparli z pamięci..."
 lepsius.1004.f: "Od przybycia Europejczyków do Ameryki krążyły pogłoski. Śmiercionośne pogłoski. Niezliczeni mężczyźni ginęli, gnani żądzą złota: wpadali w ręce wojowniczych plemion, zapuszczali się na malaryczne bagna i padali ofiarą morskich sztormów. Ponce de León szukał źródła młodości. Vázquez de Coronado poszukiwał Siedmiu Złotych Miast. Hernando de Soto przemierzył znaczną część Ameryki Północnej w pogoni za nieznanymi bogactwami. Nadzieja na sławę i majątek na miarę Cortésa i Pizarra była zbyt kusząca, choć złudna. Teraz jednak, gdy [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetFullName] pod wpływem fascynacji rzekomo inkaskim bożkiem porównuje go z innymi artefaktami z bogatej wystawy prekolumbijskiej, [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] przyłapuje [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerselfHimself] na niepokojącej myśli, że [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] może ulec tej samej gorączce złota. Czyżby ostatecznie to nauka miała skierować [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHim] na drogę do El Dorado?"
 je_lepsius_archaeology_start_in_egypt: "Narodziny Egiptologii"
 je_lepsius_archaeology_start_in_egypt_reason: "Pustynie Egiptu wciąż skrywają wiele skarbów czekających na odkrycie. Czy któryś z naszych archeologów zapoczątkuje nową erę Egiptologii i umożliwi [Concept('concept_lepsius_expedition','$concept_lepsius_expeditions|q$')] do Egiptu?"
 lepsius.22.t: "Narodziny Egiptologii"
 lepsius.22.d_egyptology: "Po wyprawie do Egiptu Dr. [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] przedstawił wyniki [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] badań. Dzięki odczytaniu Hieroglifów [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] zdołał odnaleźć szereg nowych stanowisk, a [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] odkrycia rozbudziły również na nowo zainteresowanie tym regionem."
 lepsius.22.f_egyptology: "#b Kontekst Historyczny:#! Po śmierci François Champolliona badania nad hieroglifami utknęły w martwym punkcie. W 1837 roku młody niemiecki filolog Karl Richard Lepsius napisał list do Ippolita Roselliniego, bliskiego współpracownika Champolliona i współorganizatora francusko-toskańskiej wyprawy do Egiptu z 1829 roku. Lepsius usystematyzował i przedstawił wiedzę zgromadzoną przez Champolliona, znacząco przyczyniając się do uznania egiptologii za pełnoprawną naukę. Przekonał również europejskie elity polityczne do organizowania kolejnych wypraw do Egiptu."
 notification_lepsius_birth_of_egyptology_notification_name: "Narodziny Egiptologii"
 notification_lepsius_birth_of_egyptology_notification_desc: "Archeolog z państwa [GetGlobalVariable('lepsius_egyptology_invented_country_global_var').GetCountry.GetName] wyruszył na wyprawę do Egiptu, zapoczątkowując nową erę Egiptologii. My również powinniśmy wysłać Archeologa do Egiptu, jak przystało na wielkie narody!"
 je_lepsius_yucatan_expedition: "Wyprawa na Jukatan"
 je_lepsius_yucatan_expedition_reason: "Krążą pogłoski o starożytnych ruinach w dżunglach Jukatanu. Podobno na śmiałego odkrywcę czekają tam bajeczne skarby. Może jakiś Archeolog odnajdzie dla nas skarby Majów? Umożliwiłoby to nam i innym narodom organizowanie [Concept('concept_lepsius_expedition','$concept_lepsius_expeditions|q$')] na Jukatan."
 lepsius.23.t: "Wyprawa [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetLastName]"
 lepsius.23.d: "Dr. [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] i [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] zespół spędzili wiele miesięcy w dżunglach Jukatanu. Teraz powrócili ze skarbami, informacjami i licznymi rysunkami odkrytych ruin. Zapoczątkuje to nową erę archeologii w Ameryce Środkowej."
 lepsius.23.f: "#b Kontekst Historyczny:#! Czy przed przybyciem Europejczyków Nowy Świat zamieszkiwali jedynie dzicy i barbarzyńcy? Odkrywcy John Lloyd Stephens i Frederick Catherwood poważnie zachwiali tym wyobrażeniem. Przez kilka lat Amerykanin i Brytyjczyk przemierzali dżungle półwyspu Jukatan i, według własnych relacji, odwiedzili 44 stanowiska dawno wymarłej kultury mezoamerykańskiej. Miejscowi od dawna opowiadali o zapomnianych miastach i świątyniach skrytych w dżungli, lecz dopiero relacje Stephensa, a zwłaszcza zachwycające litografie Catherwooda, odsłaniają zupełnie nieznany dotąd świat. Wizerunki świątyń, posągów i stel rozpalają wyobraźnię nie tylko romantyków. Przez Stany Zjednoczone i Europę przetacza się fala zainteresowania nieznaną cywilizacją — od ciekawości, przez jej idealizowanie, aż po autentyczne zainteresowanie naukowe."
 notification_lepsius_yucatan_expedition_notification_name: "Wyprawa na Jukatan"
 notification_lepsius_yucatan_expedition_notification_desc: "Archeolog z państwa [GetGlobalVariable('lepsius_yucatan_expedition_country_global_var').GetCountry.GetName] powrócił z pełnej przygód podróży po półwyspie Jukatan i opowiada o legendarnych ruinach w dżungli. Naukowcy wyrazili zainteresowanie dokładniejszym zbadaniem kultury Majów."
 lepsius.1011.t: "[SCOPE.sState('lepsius_location_state').GetNameNoFormatting]"
 lepsius.1011.d_alexander: "Rozpoczyna się kolejny rozdział poszukiwań grobowca najpotężniejszego człowieka starożytności. Dotychczasowe informacje sugerują, że na obszarze [SCOPE.sState('lepsius_location_state').GetName] może znajdować się trop, który pomoże ustalić położenie Mauzoleum Aleksandra. Zespoły wykopaliskowe i Dr. [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] są gotowi."
 lepsius.1011.d_ark: "Ciepły pustynny wiatr muska uczestników wyprawy i Dr. [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetLastName], gdy docierają do celu poszukiwań na obszarze [SCOPE.sState('lepsius_location_state').GetName]. To tutaj ponownie podejmą próbę rozwikłania tajemnicy Arki Przymierza."
 lepsius.1011.d_atlantis: "Czy [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] był głupcem? Jednym z tysięcy na przestrzeni tysiącleci? Ilu już uwierzyło w opowieść Platona i nigdy nie wróciło — albo powróciło ze wstydem i rozpaczą? Dr. [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] wie jedno: ta podróż musi zakończyć się sukcesem. Każdy inny wynik oznaczałby koniec [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] kariery."
 lepsius.1011.d_eldorado: "Uczestnicy wyprawy narzekają na tropikalny klimat. Dr. [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] chłodzi się wachlarzem. Trop prowadzi w odległe strony. Wśród tragarzy krążą pogłoski, że mogą zaginąć jak tyle oddziałów hiszpańskich konkwistadorów poszukujących złota..."
 lepsius.1011.f: "„Zadaj sobie pytanie: dlaczego szukasz Kielicha Chrystusa? Dla Jego chwały czy dla własnej?”"
 lepsius.1011.g: "Kop głębiej!"
 lepsius.1012.t: "Zwycięski Powrót"
 lepsius.1012.d_alexander: "Nieznośny upał na chwilę przestaje dawać się we znaki. Dr. [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] przegląda [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] notatki. Nowo dostrzeżone powiązania rzucają nowe światło na poszukiwania mauzoleum Aleksandra Wielkiego. Przez [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHis] umysł przemyka myśl. Już niedługo [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] stanie twarzą w twarz z historią... i sam ją stworzy."
 lepsius.1012.d_ark: "Poszukiwania Arki Przymierza były czymś więcej niż poszukiwaniami archeologicznego artefaktu. Były poszukiwaniami zaginionego przedmiotu kultu, który miał zapewniać kontakt z Bogiem. Dr. [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] przekonywał się o tym wielokrotnie podczas tej podróży. Ale ile jeszcze archeologicznych pielgrzymek musiał [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] odbyć, zanim dojdzie do tego spotkania?"
 lepsius.1012.d_atlantis: "Mit Atlantydy wciąż żyje. Dr. [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] wie, że podróż jeszcze się nie skończyła. Gdy [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] spogląda z portu na morze i krążące nad nim ptaki, [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] snuje rozważania o tym, ile wyzwań trzeba jeszcze pokonać, zanim wyprawa wreszcie dotrze do celu."
 lepsius.1012.d_eldorado: "Ku zaskoczeniu pozostałych uczestników wyprawy naukowcy wracają cali i zdrowi. Na chwilę wszyscy zdają się zapominać, że Dr. [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] wysłał ich na samobójczą misję. Pomyślne zakończenie tego etapu podróży do El Dorado dowodzi, że racja była po stronie [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHim]."
 lepsius.1012.f: "„Poszukiwanie Graala to poszukiwanie boskiego pierwiastka w każdym z nas. Ale jeśli chcesz faktów, nie mam żadnych do zaoferowania. W moim wieku jestem gotów przyjąć pewne rzeczy na wiarę”."
 lepsius.1012.g: "Kolejny fragment wielkiej mozaiki."
 lepsius.1013.t_alexander: "Siwa"
 lepsius.1013.d_alexander: "W przebraniu Beduina Dr. [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] zdołał samodzielnie odnaleźć wejście do zniszczonej Wyroczni Amona. Podczas badań [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] odkrył w niedostępnej dotąd części zachowane papirusy z początków panowania Ptolemeuszy, dostarczające informacji o kulcie Aleksandra."
 lepsius.1013.t_ark: "Jerozolima"
 lepsius.1013.d_ark: "Gdzie, jeśli nie w Świętym Mieście, można było mieć większą nadzieję na odnalezienie wskazówki dotyczącej losów Arki Przymierza? Dzięki łapówkom i łamaniu prawa Dr. [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] zdołał przeszukać ukryty system tuneli pod Kopułą na Skale i odnaleźć kluczową wskazówkę dotyczącą miejsca przechowywania bezcennego artefaktu."
 lepsius.1013.t_atlantis: "Santoryn"
 lepsius.1013.d_atlantis: "Na Santorynie pod warstwami gruzu po potężnej erupcji sprzed tysięcy lat wciąż można odnaleźć ślady kultury minojskiej. Dr. [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] zbadał starożytny pałac zniszczony podczas tego kataklizmu; [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetSheHe] odsłonił i odrestaurował całą serię zasypanych fresków. Jeden z nich przedstawia mapę, która z zaskakującą dokładnością odwzorowuje Morze Śródziemne i zachodnie wybrzeże Atlantyku."
 lepsius.1013.t_eldorado: "Bogotá"
 lepsius.1013.d_eldorado: "Dr. [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] zbadał okolice Bogoty, gdzie niegdyś żył tajemniczy lud Muisca. Wskazówki miejscowych zaprowadziły [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetHerHim] do nieznanego dotąd miejsca, w którym liczne artefakty Muisca dostarczają nowych informacji o rytuale „Złotego Człowieka”."
 lepsius.1013.f: "Państwa specjalizujące się w dziedzinie archeologii zgodnej z celem Legendarnej Wyprawy zyskują znaczną przewagę w poszukiwaniu archeologicznej sensacji. Korzyści te wykraczają poza zdobycie dodatkowej wskazówki, która przyspieszy poszukiwania."
 lepsius.1013.g: "Kolejny fragment wielkiej mozaiki."
 lepsius_discovery_vilcabamba_modifier: "Odkrycie Vilcabamby"
 lepsius_peru_inspection_modifier: "Nasz archeolog odwiedza nasz zespół wykopaliskowy w Peru, aby założyć nowe stanowisko wykopaliskowe."
 lepsius_add_1_vilcabamba_clue_tt: "Zdobądź #G 1#! nową wskazówkę dotyczącą ważnego odkrycia archeologicznego w Peru."
 lepsius_add_2_vilcabamba_clue_tt: "Zdobądź #G 2#! nowe wskazówki dotyczące ważnego odkrycia archeologicznego w Peru."
 lepsius_add_3_vilcabamba_clue_tt: "Zdobądź #G 3#! nowe wskazówki dotyczące ważnego odkrycia archeologicznego w Peru."
 je_lepsius_discovery_vilcabamba: "Badania w Peru"
 je_lepsius_discovery_vilcabamba_reason: "Mamy wszelkie powody, by sądzić, że nie wszystkie tajemnice Inków zostały już wyjaśnione. Poszukiwania mogą zająć nam lata. Ten, komu uda się dokonać tego odkrycia, z pewnością zapisze się na kartach historii."
 je_lepsius_discovery_vilcabamba_goal: ""
 je_lepsius_disovery_vilcabamba_success: "Jeśli uda nam się odnaleźć dziesięć wskazówek w Peru, zgromadzimy wystarczająco dużo materiału, by ponownie odkryć zaginione miejsce o wielkim znaczeniu historycznym."
 je_lepsius_disovery_vilcabamba_fail: "Nasze wysiłki pójdą na marne, jeśli inne państwo odnajdzie przed nami dziesięć wskazówek w Peru."
 lepsius.801.n: "Peru"
 lepsius.811.t_per: "Grób Konkwistadora"
 lepsius.811.f_per: "Wielkie zainteresowanie archeologów wzbudziła zamknięta brama, za którą miał znajdować się zaginiony grobowiec inkaskiego księcia, a być może nawet władcy. Niestety okazało się, że spoczywał tam hiszpański konkwistador, a nie wysoko postawiony Inkaski dostojnik. Dr. [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] ustalił jednak, że przynajmniej wnętrze i część artefaktów pochodzą z czasów Inków, co pozwala wyciągnąć pewne wnioski."
 lepsius.812.t_per: "Kopalnia Inków"
 lepsius.812.f_per: "W głębi Andów Dr. [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] odnalazł zapomnianą ścieżkę prowadzącą do zagłębienia w ziemi. Początkowo nie wydawało się ono niczym szczególnym, dopóki zespół ostrożnie nie usunął gruzu. Okazało się wówczas, że było to wejście do rozległego systemu sztucznie wydrążonych podziemi. Dalsze badania ujawniły narzędzia górnicze, przedmioty codziennego użytku i malowidła na ścianach. Czy było to jedno z wielkich miejsc wydobycia złota i srebra, z których Inkowie pozyskiwali kruszce do swoich kunsztownych wyrobów?"
 lepsius.813.t_per: "Świątynia Słońca"
 lepsius.813.f_per: "Szczęśliwy traf dla archeologii: Dr. [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] donosi o odnalezieniu zupełnie nieznanego dotąd kompleksu świątynnego w górach Peru. Najwyraźniej jest to miejsce kultu boga słońca Inti. Naukowcy znaleźli tam nie tylko liczne artefakty, lecz także malowidła i szaty obrzędowe. Odkrycie to stanowi niemałą sensację w archeologii prekolumbijskiej."
 lepsius.971.t: "Odkrycie Vilcabamby"
 lepsius.971.d: "To sensacyjny dzień dla światowej nauki. Dokonaliśmy wielkiego odkrycia: Zaginione Miasto Vilcabamba zostało dziś odnalezione przez archeologów reprezentujących państwo [ROOT.GetCountry.GetAdjectiveNoFlag]!"
 lepsius.971.f: "Vilcabamba była stolicą Państwa Nowoinkaskiego w latach 1539–1572. Państwo to stanowiło ostatnią ostoję Imperium Inków, aż w 1572 roku zostało podbite przez Hiszpanów i ich rdzennych sprzymierzeńców, co położyło kres inkaskiemu oporowi wobec hiszpańskiego panowania. Następnie Vilcabambę opuszczono, a jej położenie popadło w zapomnienie. W 1911 roku odkrywca Hiram Bingham błędnie uznał opuszczone ruiny Machu Picchu za Vilcabambę, ale odwiedził również ruiny nazywane przez miejscowych Peruwiańczyków Espíritu Pampa. W 1964 roku Gene Savoy zidentyfikował Espíritu Pampa jako legendarną Vilcabambę, co zostało powszechnie zaakceptowane przez archeologów i historyków."
 lepsius.971.g: "Dokonaliśmy tego, czego nie zdołali dokonać nawet konkwistadorzy."
 lepsius.972.d: "[SCOPE.sCountry('lepsius_vilcabamba_discoverer').GetName] dokonało wielkiego odkrycia: Zaginione Miasto Vilcabamba zostało dziś odnalezione!"
 lepsius.972.f: ""
 lepsius.972.g: "Szkoda, że sami nie zaginęli."
 je_lepsius_nazca: "Dziwne Linie Nazca"
 je_lepsius_nazca_reason: "Dziwne linie w krajobrazie w pobliżu miasta Nazca budzą pytania od czasów hiszpańskiego podboju. Niektórzy uważają je za pozostałości sieci dróg lub kanałów wodnych. Archeolog mógłby spojrzeć na nie z właściwej perspektywy — z pomocą pilota."
 lepsius.76.t: "Tajemnica Nazca z Lotu Ptaka"
 lepsius.76.d: "[GetPlayer.MakeScope.Var('curtiss_pilot_var').GetCharacter.GetLastName] zabrał Dr. [GetPlayer.MakeScope.Var('lepsius_archaeologist_var').GetCharacter.GetLastName] na lot samolotem. Teraz naukowiec znacznie lepiej rozumie znaczenie linii na ziemi. Oglądane z odpowiedniej wysokości okazują się czymś bardziej złożonym. Układają się w dziesiątki wyrytych w podłożu wizerunków zwierząt i postaci z czasów prekolumbijskich. Niesamowite odkrycie archeologiczne!"
 lepsius.76.f: "Rysunki z Nazca to ponad 1,500 ogromnych figur wyrytych w podłożu (geoglifów) na pustyni w pobliżu Nazca i Palpy w Peru, które można dostrzec i rozpoznać jedynie z powietrza oraz okolicznych wzgórz. Linie, pustynia i kultura zawdzięczają swoją nazwę miastu Nazca, położonemu niedaleko równiny. Za twórców rysunków uznaje się przedstawicieli kultur Paracas i Nazca. Na obszarze 500 km² równinę Nazca pokrywają idealnie proste linie, trójkąty i trapezowate powierzchnie o długości do 20 km, a także figury mierzące od około dziesięciu do kilkuset metrów, przedstawiające między innymi ludzi, małpy, ptaki i wieloryby. Linie tworzące figury mają często zaledwie kilka centymetrów głębokości. Ze względu na ogromne rozmiary rysunki można rozpoznać dopiero z dużej odległości — z okolicznych wzgórz lub samolotów. W tym sensie Rysunki z Nazca odkryto dopiero w latach 20., a najpóźniej w latach 30. XX wieku, gdy samoloty zaczęły regularnie przelatywać nad pustynią Nazca. W 1926 roku po raz pierwszy opisano je naukowo."
 lepsius.76.g: "Ale jakie może być prawdziwe znaczenie tych wizerunków?"
