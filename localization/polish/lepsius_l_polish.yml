 lepsius.5000.t: "Ruiny Palmyry"
 lepsius.5000.d: "Na terenie naszego kraju znajdują się Ruiny starożytnego miasta Palmyra. Nasi Archeolodzy nie mogą się doczekać rozpoczęcia wykopalisk i zgłębienia jak największej liczby jego tajemnic."
 lepsius.5000.f: "Palmyra to starożytne miasto w Syrii, które istniało przez wiele stuleci. Słynęło ze swoich kupców. Zamożni kupcy wznieśli liczne monumentalne budowle, które przetrwały próbę czasu. Wiele starożytnych budynków podlegało jednak przebudowom, co utrudnia pracę archeologom.\nMiasto słynie nie tylko z kupców, lecz także z Zenobii, królowej krótkotrwałego Imperium Palmyreńskiego. Na pewien czas przejęła ona kontrolę nad wschodnią częścią Cesarstwa Rzymskiego, aż cesarz Aurelian odzyskał te ziemie i zniszczył Palmyrę."
 lepsius.5000.g: "Ciekawe, co znajdziemy!"
 lepsius.5001.t: "Świątynia Bela odrestaurowana"
 lepsius.5001.d: "Nasi archeolodzy niestrudzenie pracowali nad odrestaurowaniem Świątyni Bela. Trzeba było usunąć dobudówki i przeróbki z okresu muzułmańskiego panowania w mieście oraz odsłonić zasypane części budowli."
 lepsius.5001.f: "Jak wykazała nasza analiza stratygraficzna, Tell, czyli wzgórze, na którym wzniesiono świątynię, był użytkowany przez ludzi już w 3000 roku p.n.e. Świątynia, którą udało nam się odtworzyć w możliwie największym stopniu, jest budowlą rzymską pochodzącą z końca I i pierwszej połowy II wieku n.e.\nPóźniej przekształcono ją w kościół chrześcijański, a po podboju regionu przez Arabów stała się meczetem.\n\n#V Obecnie:#! Niestety Świątynia Bela została zniszczona przez ISIS w 2015 roku. Istnieją jednak plany jej rekonstrukcji z wykorzystaniem zachowanych elementów."
 lepsius.5001.g: "Ciekawe, co znajdziemy!"
 lepsius.5002.t: "Dolina Grobów odkopana"
 lepsius.5002.d: "Na zachód od Palmyry znajdują się liczne grobowce. Wśród nich wyróżniają się imponujące grobowce wieżowe, które nasi archeolodzy odkopali i częściowo odrestaurowali."
 lepsius.5002.f: "Nekropolia zwana Doliną Grobów mieści liczne grobowce wieżowe. Najstarszy z nich pochodzi z 9 roku p.n.e. i nosi nazwę Wieży Atenatena. Inną Wieżę, Wieżę Elahbela, wzniósł za panowania cesarza Trajana palmyreński arystokrata Marek Ulpiusz Elahbelus. Elahbelus prawdopodobnie otrzymał obywatelstwo rzymskie za panowania Trajana, o czym świadczą ich wspólne imiona: Marek Ulpiusz.\nInnym interesującym znaleziskiem są fragmenty jedwabiu, który prawdopodobnie sprowadzono z Chin.\n\n#V Obecnie:#! Wiele Grobowców zostało zniszczonych, gdy ISIS kontrolowało Palmyrę. Wśród nich znalazły się Wieża Elahbela i Wieża Jamblicha."
 lepsius.5002.g: "Imponujące!"
 lepsius.5003.t: "Palmyra - Miasto Palm"
 lepsius.5003.d: "Nasi Archeolodzy przez wiele lat odkopywali pozostałości Palmyry i odbudowywali wszystko, co było możliwe. Teraz to niegdyś zamożne miasto znów jest miejscem wartym odwiedzenia."
 lepsius.5003.f: "Ruiny Palmyry znów przyciągają zwiedzających. Wielu pragnie zobaczyć pozostałości niegdyś potężnego miasta, które rzuciło wyzwanie samemu Rzymowi, choć ostatecznie poniosło klęskę. Majestatyczne Grobowce Wieżowe, Wielka Kolumnada, Świątynia Bela i Świątynia Baalszamina świadczą o dawnym bogactwie miasta. Miasto Palm w czasach swojej świetności musiało przedstawiać wspaniały widok!"
 lepsius.5003.g: "Wspaniałe miejsce do zwiedzania!"
