 lepsius.714.t: "Igła Kleopatry"
 lepsius.714.d: "Teraz, gdy zakończono ostateczne negocjacje z lokalnymi władzami, nic nie stoi już na przeszkodzie, aby zdemontować, przetransportować i ponownie wznieść „Igłę Kleopatry”. To ogromne przedsięwzięcie archeologiczne i inżynieryjne!"
 lepsius.714.f: "Przed ich historycznym wywiezieniem obie „Igły” przez stulecia pozostawały na wpół zapomnianymi zabytkami na terenie Cezareum w Aleksandrii. Tylko jedna z nich wciąż stała pionowo, podczas gdy druga zdążyła już zapaść się w pustynny piasek. W epoce wczesnego kolonializmu i egiptomanii pojawiały się liczne pomysły przetransportowania tych monolitów do zachodnich stolic jako potężnych symboli suwerenności państwowej i naukowego triumfu. Początkowo jednak plany te kończyły się niepowodzeniem z powodu ogromnych trudności logistycznych. W oczach europejskich podróżników Igły Kleopatry wraz z imponującą Kolumną Pompejusza, jednym z największych monolitycznych filarów starożytności, tworzyły charakterystyczną trójkę monumentów dominujących w panoramie Aleksandrii, symbolizując przejście od świetności epoki faraonów do wspaniałości świata grecko-rzymskiego. Podczas gdy Kolumna Pompejusza, ze względu na swoje ogromne rozmiary i solidne osadzenie na wzgórzu Serapeum, zawsze pozostawała na miejscu jako nieruchomy monument, obeliski coraz częściej traktowano jako przedmioty negocjacji dyplomatycznych, aż w końcu wyruszyły w podróż przez morze jako prestiżowe dary wicekróla Muhammada Alego Paszy."
 lepsius.714.g: "Przetransportujcie obelisk do [ROOT.GetCountry.GetCapital.GetCityHubName]!"
 lepsius.715.t: "Igła Kleopatry"
 lepsius.715.d: "Obelisk został dziś uroczyście powitany w [ROOT.GetCountry.GetCapital.GetCityHubName] podczas wielkiej publicznej ceremonii, a mieszkańcy przyjęli go z ogromnym entuzjazmem."
 lepsius.715.f: "Londyńska „Igła” dotarła do miasta w 1878 roku w specjalnie skonstruowanym pływającym żelaznym cylindrze, który omal nie zatonął podczas gwałtownego sztormu w Zatoce Biskajskiej. W katastrofie zginęło sześciu marynarzy. Nowojorski obelisk wzniesiono w Central Parku w 1881 roku, po przetransportowaniu go na specjalnie przebudowanym parowcu, a następnie przesuwaniu centymetr po centymetrze na miejsce ustawienia za pomocą ogromnego drewnianego rusztowania. Oba monumenty po przybyciu uroczyście witano podczas wielkich publicznych ceremonii i do dziś pozostają imponującymi symbolami starożytnego Egiptu pośród współczesnych metropolii."
 lepsius.715.g: "To umocni nasze imperialne ambicje na arenie międzynarodowej!"
 lepsius.773.t: "Stela z Piedras Negras"
 lepsius.773.d: "Teraz, gdy zakończono ostateczne negocjacje z lokalnymi władzami, nic nie stoi już na przeszkodzie, aby zdemontować, przetransportować i ponownie wznieść stelę z Piedras Negras. To ogromne przedsięwzięcie archeologiczne i inżynieryjne!"
 lepsius.773.f: "Stele z Piedras Negras to zespół monumentalnych kamiennych rzeźb pochodzących ze starożytnego miasta Majów Piedras Negras, położonego na terenie dzisiejszej Gwatemali. Wykonane w stylu Petén stele często przedstawiają władców w bogato zdobionych strojach, niekiedy siedzących w niszach lub stojących nad pojmanymi jeńcami. Monumenty te słyną na całym świecie z wyjątkowego kunsztu artystycznego i ogromnego znaczenia historycznego. Obecnie wiele z tych stel jest przechowywanych w Narodowym Muzeum Archeologii i Etnologii w mieście Gwatemala oraz w Muzeum Uniwersytetu Pensylwanii."
 lepsius.773.g: "Przetransportuj stelę do [ROOT.GetCountry.GetCapital.GetCityHubName]!"
 lepsius.774.t: "Stela z Piedras Negras"
 lepsius.774.d: "Podczas dzisiejszej publicznej wystawy w [ROOT.GetCountry.GetCapital.GetCityHubName] Muzeum Archeologiczne zaprezentowało Stelę z Piedras Negras szerokiej publiczności i zainteresowanym zwiedzającym."
 lepsius.774.f: "Po przybyciu do Muzeum Uniwersytetu Pensylwanii (Penn Museum) w Filadelfii stele stały się główną atrakcją nowo zaaranżowanych galerii poświęconych kulturze Majów, gdzie po raz pierwszy zaprezentowano je szerokiej zachodniej publiczności. Monumentalne rzeźby ustawiono na stałe przy użyciu specjalistycznego sprzętu, aby zabezpieczyć ich misterne płaskorzeźby przed dalszym niszczeniem i umożliwić prowadzenie badań naukowych. Do dziś stanowią one kluczowe zabytki pomocne w odczytywaniu hieroglifów Majów i świadczą o dawnej świetności miasta Piedras Negras."
 lepsius.774.g: "Gigantyczne zabytki. To mi się podoba!"
 lepsius.2256.t: "Obelisk z Aksum"
 lepsius.2256.d: "Obelisk został dziś uroczyście powitany w [ROOT.GetCountry.GetCapital.GetCityHubName] podczas wielkiej publicznej ceremonii, a mieszkańcy przyjęli go z ogromnym entuzjazmem."
 lepsius.2256.f: "Obelisk z Aksum przybył do Rzymu w 1937 roku jako łup wojenny faszystowskich Włoch, po tym jak na rozkaz Mussoliniego został zdemontowany w Etiopii i przetransportowany statkiem w ramach niezwykle skomplikowanej operacji logistycznej. Ponownie wzniesiono go przed budynkiem Ministerstwa Kolonii, gdzie przez dziesięciolecia stanowił symbol imperialnego triumfu w panoramie Rzymu. Dopiero po długotrwałych negocjacjach dyplomatycznych i przygotowaniach technicznych 150-tonowy monument powrócił do Etiopii w 2005 roku, a w 2008 roku został ponownie ustawiony na terenie pierwotnego parku archeologicznego."
 lepsius.2256.g: "To umocni nasze imperialne ambicje na arenie międzynarodowej!"
