l_polish:
 glossary_curie_complex_analysis: "$curie_complex$ $curie_analysis$"
 glossary_curie_complex_analysis_desc: "#b;italic $glossary_curie_complex_analysis$#! to dziedzina matematyki zajmująca się badaniem funkcji operujących na liczbach zespolonych, które łączą część rzeczywistą i urojoną. Znajduje szerokie zastosowanie w fizyce i inżynierii do analizy zjawisk falowych, dynamiki płynów oraz obwodów elektrycznych."
 glossary_curie_differential_equation: "$curie_differential$ $curie_equation$"
 glossary_curie_differential_equation_desc: "#b;italic $glossary_curie_differential_equation$#! to równania wiążące funkcje z szybkością ich zmian. Opisują, jak wielkości fizyczne zmieniają się w czasie lub przestrzeni, dzięki czemu są niezbędne do modelowania ruchu planet, wzrostu populacji, systemów klimatycznych oraz przepływu ciepła."
 glossary_curie_fourier_analysis: "$mr_fourier$-$curie_analysis$"
 glossary_curie_fourier_analysis_desc: "#b;italic $glossary_curie_fourier_analysis$#! to metoda pozwalająca rozłożyć złożone sygnały, fale lub funkcje na proste składowe sinusowe i cosinusowe. Ma fundamentalne znaczenie we współczesnym przetwarzaniu sygnałów, kompresji obrazów, strumieniowym przesyłaniu dźwięku oraz telekomunikacji."
 glossary_curie_non_euclidean_geometry: "Geometria Nieeuklidesowa $curie_geometry$"
 glossary_curie_non_euclidean_geometry_desc: "#b;italic $glossary_curie_non_euclidean_geometry$#! obejmuje geometrię opartą na zakrzywionych powierzchniach, na których linie równoległe mogą się przecinać lub rozbiegać. Geometria sferyczna opisuje zakrzywione powierzchnie planet, natomiast geometria hiperboliczna pomaga wyjaśniać czasoprzestrzeń w ogólnej teorii względności."
 glossary_curie_group_theory: "Teoria Grup $curie_theory$"
 glossary_curie_group_theory_desc: "#b;italic $glossary_curie_group_theory$#! to dziedzina matematyki zajmująca się badaniem struktur algebraicznych opisujących symetrie i przekształcenia. Dostarcza formalnego języka do analizy symetrii figur geometrycznych, cząsteczek chemicznych, cząstek subatomowych oraz algorytmów kryptograficznych."
 glossary_curie_linear_algebra: "Algebra Liniowa"
 glossary_curie_linear_algebra_desc: "#b;italic $glossary_curie_linear_algebra$#! to dziedzina matematyki zajmująca się badaniem przestrzeni wektorowych, wektorów i macierzy. Stanowi podstawę matematyczną trójwymiarowej grafiki komputerowej, algorytmów uczenia maszynowego, mechaniki kwantowej oraz analizy danych na dużą skalę."
 glossary_curie_abstract_algebra: "Algebra Abstrakcyjna"
 glossary_curie_abstract_algebra_desc: "#b;italic $glossary_curie_abstract_algebra$#! to dziedzina matematyki zajmująca się badaniem struktur algebraicznych, takich jak grupy, pierścienie i ciała, zamiast konkretnych liczb. Analizuje leżące u ich podstaw reguły i symetrie, stanowiąc fundament współczesnej kryptografii, teorii kodowania oraz fizyki teoretycznej."
 glossary_curie_navier_stokes_equations: "Równania Naviera-Stokesa"
 glossary_curie_navier_stokes_equations_desc: "#b;italic $glossary_curie_navier_stokes_equations$#! to układ równań różniczkowych cząstkowych opisujących ruch płynów. Równania te modelują zachowanie płynów lepkich i mają kluczowe znaczenie w prognozowaniu pogody, przewidywaniu prądów oceanicznych, aerodynamice oraz symulacji przepływu w rurociągach."
 glossary_curie_mathematical_logic: "Logika Matematyczna"
 glossary_curie_mathematical_logic_desc: "#b;italic $glossary_curie_mathematical_logic$#! to dziedzina matematyki zajmująca się badaniem logiki formalnej i jej zastosowań w matematyce. Analizuje systemy dowodzenia, prawdę oraz granice obliczalności, stanowiąc teoretyczną podstawę projektowania oprogramowania i sztucznej inteligencji."
 glossary_curie_analytical_number_theory: "Analityczna Teoria Liczb $curie_theory$"
 glossary_curie_analytical_number_theory_desc: "#b;italic $glossary_curie_analytical_number_theory$#! to dziedzina matematyki wykorzystująca narzędzia analizy matematycznej i analizy zespolonej do rozwiązywania problemów dotyczących liczb całkowitych. Koncentruje się przede wszystkim na rozmieszczeniu liczb pierwszych, formach modularnych oraz addytywnych własnościach liczb."
 glossary_curie_algebraic_number_theory: "Algebraiczna Teoria Liczb $curie_theory$"
 glossary_curie_algebraic_number_theory_desc: "#b;italic $glossary_curie_algebraic_number_theory$#! to dziedzina matematyki wykorzystująca algebrę abstrakcyjną do badania liczb całkowitych i algebraicznych. Zajmuje się rozwiązywaniem problemów rozkładu na czynniki w ciałach liczbowych i stanowi podstawę współczesnej kryptografii klucza publicznego, w tym systemów szyfrowania opartych na krzywych eliptycznych."
 glossary_curie_em_field_equations: "Równania Pola Elektromagnetycznego"
 glossary_curie_em_field_equations_desc: "#b;italic $glossary_curie_em_field_equations$#! to układ równań różniczkowych cząstkowych, znanych jako równania Maxwella, opisujących oddziaływanie pól elektrycznych i magnetycznych z materią. Wyjaśniają one zjawiska związane z falami elektromagnetycznymi, światłem, obwodami elektrycznymi oraz komunikacją bezprzewodową."
 glossary_curie_set_theory: "Teoria Mnogości $curie_theory$"
 glossary_curie_set_theory_desc: "#b;italic $glossary_curie_set_theory$#! to fundamentalna dziedzina matematyki zajmująca się badaniem kolekcji obiektów, zwanych zbiorami. Wprowadza podstawowe pojęcia, takie jak nieskończoność, relacje i funkcje, stanowiąc podstawę strukturalną niemal całej współczesnej logiki matematycznej."
 glossary_curie_topology: "Topologia"
 glossary_curie_topology_desc: "#b;italic $glossary_curie_topology$#! to dziedzina matematyki zajmująca się badaniem własności przestrzennych, które pozostają niezmienione podczas ciągłych odkształceń, takich jak rozciąganie czy zginanie, bez rozrywania. Znajduje zastosowanie w analizie sieci, analizie danych oraz fizyce materiałowej."
 glossary_curie_functional_analysis: "Analiza Funkcjonalna"
 glossary_curie_functional_analysis_desc: "#b;italic $glossary_curie_functional_analysis$#! to dziedzina matematyki zajmująca się badaniem nieskończenie wymiarowych przestrzeni wektorowych oraz przekształceń między nimi. Rozszerza metody algebry liniowej na analizę matematyczną, dostarczając aparatu matematycznego niezbędnego w mechanice kwantowej i teorii równań różniczkowych."
 glossary_curie_lie_theory: "Teoria Liego $curie_theory$"
 glossary_curie_lie_theory_desc: "#b;italic $glossary_curie_lie_theory$#! to dziedzina matematyki zajmująca się badaniem ciągłych symetrii i przekształceń geometrycznych. Łączy analizę matematyczną z algebrą abstrakcyjną w celu opisywania ruchu ciągłego, odgrywając kluczową rolę w mechanice kwantowej i ogólnej teorii względności."
 glossary_curie_representation_theory: "Teoria Reprezentacji $curie_theory$"
 glossary_curie_representation_theory_desc: "#b;italic $glossary_curie_representation_theory$#! to dziedzina matematyki zajmująca się przedstawianiem abstrakcyjnych struktur algebraicznych za pomocą konkretnych operacji na liniowych przestrzeniach wektorowych. Umożliwia badanie złożonych symetrii algebraicznych za pomocą macierzy, upraszczając rozwiązywanie problemów z zakresu fizyki cząstek elementarnych i chemii."
 glossary_curie_algebraic_topology: "Topologia Algebraiczna"
 glossary_curie_algebraic_topology_desc: "#b;italic $glossary_curie_algebraic_topology$#! to dziedzina matematyki wykorzystująca narzędzia algebry abstrakcyjnej do badania przestrzeni topologicznych i kształtów ciągłych. Przekształca geometryczne cechy kształtów w niezmienniki algebraiczne, wspomagając analizę danych."
 glossary_curie_class_field_theory: "Teoria Ciał Klas $curie_theory$"
 glossary_curie_class_field_theory_desc: "#b;italic $glossary_curie_class_field_theory$#! to ważna dziedzina algebraicznej teorii liczb zajmująca się opisywaniem abelowych rozszerzeń ciał liczbowych. Łączy własności arytmetyczne z prawami wzajemności, stanowiąc podstawę zaawansowanej teorii liczb i współczesnej geometrii arytmetycznej."
 glossary_curie_relativity_theory: "Teoria Względności $curie_theory$"
 glossary_curie_relativity_theory_desc: "#b;italic $glossary_curie_relativity_theory$#! to fundamentalna teoria fizyczna opisująca grawitację, przestrzeń i czas. Wykazuje, że przestrzeń i czas są ze sobą nierozerwalnie związane, tworząc czasoprzestrzeń, a obiekty o dużej masie powodują jej zakrzywienie. Stanowi podstawę astrofizyki i nawigacji satelitarnej."
 glossary_curie_quantum_mechanics: "Mechanika Kwantowa"
 glossary_curie_quantum_mechanics_desc: "#b;italic $glossary_curie_quantum_mechanics$#! to teoria fizyczna opisująca przyrodę w skali atomowej i subatomowej. Zastępuje klasyczny determinizm opisem probabilistycznym, wyjaśniając zjawiska takie jak dualizm korpuskularno-falowy i splątanie kwantowe, które stanowią podstawę działania półprzewodników i komputerów kwantowych."
 glossary_curie_proof_theory: "Teoria Dowodu $curie_theory$"
 glossary_curie_proof_theory_desc: "#b;italic $glossary_curie_proof_theory$#! to dziedzina logiki matematycznej, która traktuje dowody matematyczne jako formalne obiekty matematyczne. Analizuje strukturę dowodów, niesprzeczność systemów formalnych oraz granice dowodliwości."
 glossary_curie_cryptography: "Kryptografia"
 glossary_curie_cryptography_desc: "#b;italic $glossary_curie_cryptography$#! to nauka zajmująca się zabezpieczaniem komunikacji przed nieautoryzowanym dostępem za pomocą matematycznych kodów i szyfrów."
 glossary_curie_algorithm_theory: "Teoria Algorytmów $curie_theory$"
 glossary_curie_algorithm_theory_desc: "#b;italic $glossary_curie_algorithm_theory$#! to dziedzina matematyki zajmująca się badaniem systematycznych procedur rozwiązywania problemów obliczeniowych krok po kroku. Opierając się na obliczeniach wykonywanych za pomocą kartki i ołówka, analizuje mechaniczne reguły w celu ustalenia, które problemy można rozwiązać w skończonej liczbie kroków."
 glossary_curie_lambda_calculus: "Rachunek Lambda"
 glossary_curie_lambda_calculus_desc: "#b;italic $glossary_curie_lambda_calculus$#! to formalny system logiczny wprowadzony w latach 30. XX wieku w celu badania funkcji matematycznych, wiązania zmiennych oraz podstawiania. Został stworzony do badania fundamentalnych granic rozstrzygalności i formalnego rozumowania w czystej logice i matematyce."