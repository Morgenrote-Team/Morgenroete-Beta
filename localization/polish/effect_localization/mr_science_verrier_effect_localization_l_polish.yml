l_polish:
 VERRIER_ASTRONOMICAL_OBJECT_CONCEPT: "[concept_verrier_astronomical_object]"
 VERRIER_ASTRONOMICAL_OBJECTS_CONCEPT: "[Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects$')]"
 VERRIER_ADD_X_ASTRONOMICAL_OBJECTS_EFFECT_POSITIVE: "The country $MR_GAINS$ $VALUE|0+$ @verrier_astronomicalobject! [SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE$','(CFixedPoint)1'),'VERRIER_ASTRONOMICAL_OBJECT_CONCEPT','VERRIER_ASTRONOMICAL_OBJECTS_CONCEPT')]"
 VERRIER_ADD_X_ASTRONOMICAL_OBJECTS_EFFECT_NEGATIVE: "The country $MR_LOSES$ [Negate_CFixedPoint('(CFixedPoint)$VALUE$')|0+] @verrier_astronomicalobject! [SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE$','(CFixedPoint)1'),'VERRIER_ASTRONOMICAL_OBJECT_CONCEPT','VERRIER_ASTRONOMICAL_OBJECTS_CONCEPT')]"
 VERRIER_ADD_X_ASTRONOMICAL_OBJECTS_EFFECT_FIRST_POSITIVE: "[COUNTRY.GetNameNoFlag] $MR_GAINS$ $VALUE|+0$ @verrier_astronomicalobject! [SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE$','(CFixedPoint)1'),'VERRIER_ASTRONOMICAL_OBJECT_CONCEPT','VERRIER_ASTRONOMICAL_OBJECTS_CONCEPT')] (currently [COUNTRY.MakeScope.GetVariable('verrier_astronomical_objects').GetValue|0|V])"
 VERRIER_ADD_X_ASTRONOMICAL_OBJECTS_EFFECT_FIRST_NEGATIVE: "[COUNTRY.GetNameNoFlag] $MR_LOSES$ [Negate_CFixedPoint('(CFixedPoint)$VALUE$')|+0] @verrier_astronomicalobject! [SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE$','(CFixedPoint)1'),'VERRIER_ASTRONOMICAL_OBJECT_CONCEPT','VERRIER_ASTRONOMICAL_OBJECTS_CONCEPT')] (currently [COUNTRY.MakeScope.GetVariable('verrier_astronomical_objects').GetValue|0|V])"
 VERRIER_ADD_X_ASTRONOMICAL_OBJECTS_EFFECT_THIRD_POSITIVE: "[COUNTRY.GetName] $MR_GAINS$ $VALUE|+0$ @verrier_astronomicalobject! [SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE$','(CFixedPoint)1'),'VERRIER_ASTRONOMICAL_OBJECT_CONCEPT','VERRIER_ASTRONOMICAL_OBJECTS_CONCEPT')]"
 VERRIER_ADD_X_ASTRONOMICAL_OBJECTS_EFFECT_THIRD_NEGATIVE: "[COUNTRY.GetName] $MR_LOSES$ [Negate_CFixedPoint('(CFixedPoint)$VALUE$')|+0] @verrier_astronomicalobject! [SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE$','(CFixedPoint)1'),'VERRIER_ASTRONOMICAL_OBJECT_CONCEPT','VERRIER_ASTRONOMICAL_OBJECTS_CONCEPT')]"
