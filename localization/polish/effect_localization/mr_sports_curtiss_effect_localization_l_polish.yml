l_polish:
 CURTISS_FLIGHT_ROUTE: "Trasa lotu"
 CURTISS_FLIGHT_ROUTES: "Trasy lotu"
 CURTISS_ADD_X_FLIGHT_ROUTE_EFFECT_POSITIVE: "Kraj $MR_GAINS$ $VALUE|0+$ @curtiss_airlines! [SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE|q$','(CFixedPoint)1'),'CURTISS_FLIGHT_ROUTES','CURTISS_FLIGHT_ROUTE')]"
 CURTISS_ADD_X_FLIGHT_ROUTE_EFFECT_NEGATIVE: "Kraj $MR_LOSES$ [Negate_CFixedPoint('(CFixedPoint)$VALUE|q$')|0+] @curtiss_airlines! [SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE|q$','(CFixedPoint)1'),'CURTISS_FLIGHT_ROUTES','CURTISS_FLIGHT_ROUTE')]"
 CURTISS_ADD_X_FLIGHT_ROUTE_EFFECT_FIRST_POSITIVE: "[COUNTRY.GetNameNoFlag] $MR_GAINS$ $VALUE|+0$ @curtiss_airlines! [SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE|q$','(CFixedPoint)1'),'CURTISS_FLIGHT_ROUTES','CURTISS_FLIGHT_ROUTE')] (obecnie [COUNTRY.MakeScope.GetVariable('curtiss_flight_route').GetValue|0|V])"
 CURTISS_ADD_X_FLIGHT_ROUTE_EFFECT_FIRST_NEGATIVE: "[COUNTRY.GetNameNoFlag] $MR_LOSES$ [Negate_CFixedPoint('(CFixedPoint)$VALUE|q$')|+0] @curtiss_airlines! [SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE|q$','(CFixedPoint)1'),'CURTISS_FLIGHT_ROUTES','CURTISS_FLIGHT_ROUTE')] (obecnie [COUNTRY.MakeScope.GetVariable('curtiss_flight_route').GetValue|0|V])"
 CURTISS_ADD_X_FLIGHT_ROUTE_EFFECT_THIRD_POSITIVE: "[COUNTRY.GetName] $MR_GAINS$ $VALUE|+0$ @curtiss_airlines! [SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE|q$','(CFixedPoint)1'),'CURTISS_FLIGHT_ROUTES','CURTISS_FLIGHT_ROUTE')]"
 CURTISS_ADD_X_FLIGHT_ROUTE_EFFECT_THIRD_NEGATIVE: "[COUNTRY.GetName] $MR_LOSES$ [Negate_CFixedPoint('(CFixedPoint)$VALUE|q$')|+0] @curtiss_airlines! [SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE|q$','(CFixedPoint)1'),'CURTISS_FLIGHT_ROUTES','CURTISS_FLIGHT_ROUTE')]"
 CURTISS_ADD_X_SCHNEIDER_TROPHY_POINTS_EFFECT_POSITIVE: "Kraj $MR_GAINS$ $VALUE|0+$ @curtiss_schneider_point! Punktów Pucharu Schneidera"
 CURTISS_ADD_X_SCHNEIDER_TROPHY_POINTS_EFFECT_NEGATIVE: "Kraj $MR_LOSES$ [Negate_CFixedPoint('(CFixedPoint)$VALUE|q$')|0+] @curtiss_schneider_point! Punktów Pucharu Schneidera"
 CURTISS_ADD_X_SCHNEIDER_TROPHY_POINTS_EFFECT_FIRST_POSITIVE: "[COUNTRY.GetNameNoFlag] $MR_GAINS$ $VALUE|+0$ @curtiss_schneider_point! Punktów Pucharu Schneidera (obecnie [COUNTRY.MakeScope.GetVariable('curtiss_schneider_trophy_point_var').GetValue|0|V])"
 CURTISS_ADD_X_SCHNEIDER_TROPHY_POINTS_EFFECT_FIRST_NEGATIVE: "[COUNTRY.GetNameNoFlag] $MR_LOSES$ [Negate_CFixedPoint('(CFixedPoint)$VALUE|q$')|+0] @curtiss_schneider_point! Punktów Pucharu Schneidera (obecnie [COUNTRY.MakeScope.GetVariable('curtiss_schneider_trophy_point_var').GetValue|0|V])"
 CURTISS_ADD_X_SCHNEIDER_TROPHY_POINTS_EFFECT_THIRD_POSITIVE: "[COUNTRY.GetName] $MR_GAINS$ $VALUE|+0$ @curtiss_schneider_point! Punktów Pucharu Schneidera"
 CURTISS_ADD_X_SCHNEIDER_TROPHY_POINTS_EFFECT_THIRD_NEGATIVE: "[COUNTRY.GetName] $MR_LOSES$ [Negate_CFixedPoint('(CFixedPoint)$VALUE|q$')|+0] @curtiss_schneider_point! Punktów Pucharu Schneidera"