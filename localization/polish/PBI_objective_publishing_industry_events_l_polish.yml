l_polish:
 pbi_objective_publishing_industry_events.200.t: "Udana powieść odcinkowa w gazecie"
 pbi_objective_publishing_industry_events.200.d: "Powieść [SCOPE.sCharacter('target_character').GetFullName] była publikowana w odcinkach w gazecie w [SCOPE.sState('target_state').GetName], a po bardzo popularnym okresie publikacji seria dobiegła końca."
 pbi_objective_publishing_industry_events.200.f: "W okresie publikacji w odcinkach sprzedaż gazety ostatecznie wzrosła trzykrotnie. Wydawca opublikował następnie książkę zbierającą całą serię, a nawet przetłumaczył ją z myślą o rynku międzynarodowym. Sprzedaż tych książek stale rosła."
 pbi_objective_publishing_industry_events.200.a: "Dobra robota!"
 pbi_objective_publishing_industry_events.200.good: "Postęp w pisaniu powieści zostanie #positive_value zwiększony#!"
 pbi_objective_publishing_industry_events.200.bad: "Postęp w pisaniu powieści zostanie #negative_value zmniejszony#!"
 pbi_objective_publishing_industry_events.200.stop: "#negative_value Zwiększa prawdopodobieństwo utraty postępu w pisaniu powieści w przyszłości#!"
 pbi_objective_publishing_industry_events.201.t: "Przerwanie publikacji w odcinkach"
 pbi_objective_publishing_industry_events.201.d: "Powieść publikowana w odcinkach w gazecie w [SCOPE.sState('target_state').GetName] pozostała niedokończona, gdy pisarz nie był już w stanie kontynuować pracy nad nią."
 pbi_objective_publishing_industry_events.201.f: "Wielu czytelników nie będzie już mogło poznać dalszego ciągu powieści publikowanych w odcinkach, na które tak niecierpliwie czekali."
 pbi_objective_publishing_industry_events.201.a: "Jaka szkoda"
 pbi_objective_publishing_industry_events.202.t: "Wielki pisarz przyszłości"
 pbi_objective_publishing_industry_events.202.d: "Wydawnictwo prasowe w [SCOPE.sState('target_state').GetName] planuje rozpocząć wydawanie nowej gazety.\nPoszukuje nowego powieściopisarza do tego ambitnego przedsięwzięcia."
 pbi_objective_publishing_industry_events.202.f: "W dzisiejszych czasach o sprzedaży gazety nie decyduje już jej stanowisko polityczne, błyskotliwy artykuł redakcyjny naczelnego redaktora ani sensacyjny trzystronicowy materiał, lecz zainteresowanie powieścią publikowaną w odcinkach."
 pbi_objective_publishing_industry_events.202.a: "[SCOPE.sCharacter('target_character_1').GetFullName] to wielki pisarz przyszłości!"
 pbi_objective_publishing_industry_events.202.a.tt: "Rozpocznij pisanie serii powieści"
 pbi_objective_publishing_industry_events.202.b: "Wyczuwam niezwykłą inteligencję u [SCOPE.sCharacter('target_character_2').GetFullName]!"
 pbi_objective_publishing_industry_events.202.c: "Twórczość [SCOPE.sCharacter('target_character_3').GetFullName] ma nieodparty urok!"
 pbi_objective_publishing_industry_events.202.e: "Na pewno kryją się gdzieś inne nieoszlifowane diamenty, które mogą zabłysnąć!"
 pbi_objective_publishing_industry_events.202.e.tt: "Poszukamy innych kandydatów"
 pbi_objective_publishing_industry_events.203.t: "Nie może kontynuować pisania"
 pbi_objective_publishing_industry_events.203.d: "[SCOPE.sCharacter('target_character').GetFullName] ma trudności z poczynieniem postępów w pisaniu [SCOPE.sCharacter('target_character').GetHerHis] powieści. Jeśli tak dalej pójdzie, publikacja w odcinkach prawdopodobnie zostanie przerwana."
 pbi_objective_publishing_industry_events.203.f: "Redaktor odpowiedzialny za publikację odwiedził wcześnie rano dom [SCOPE.sCharacter('target_character').GetLastName], aby sprawdzić postępy nad rękopisem, lecz [SCOPE.sCharacter('target_character').GetSheHe] nie było na miejscu. Służący powiedział, że pan domu nie wracał od trzech dni i nie wie, gdzie [SCOPE.sCharacter('target_character').GetSheHe] się znajduje."
 pbi_objective_publishing_industry_events.203.a: "Przywiąż [SCOPE.sCharacter('target_character').GetHerHim] do krzesła, ale niech [SCOPE.sCharacter('target_character').GetHerHim] dalej pisze!"
 pbi_objective_publishing_industry_events.203.b: "[SCOPE.sCharacter('target_character').GetFullName] potrzebuje zmiany otoczenia"
 pbi_objective_publishing_industry_events.204.t: "Kto jest właścicielem manuskryptu?"
 pbi_objective_publishing_industry_events.204.d: "Autor odmawia wydawcy prawa do zapoznania się z treścią powieści, którą [SCOPE.sCharacter('target_character').GetFullName] publikuje w odcinkach."
 pbi_objective_publishing_industry_events.204.f: "Wydawca obawia się, że sposób przedstawienia niektórych postaci w powieści może zostać odebrany jako wyśmiewanie określonych polityków."
 pbi_objective_publishing_industry_events.204.a: "Wydawcy mają prawo do wglądu"
 pbi_objective_publishing_industry_events.204.b: "Wola autora powinna być uszanowana"
 pbi_objective_publishing_industry_events.205.t: "Niemoralna Treść"
 pbi_objective_publishing_industry_events.205.d: "[SCOPE.gsInterestGroup('target_ig').GetName] domaga się poprawek w publikowanych w odcinkach powieściach [SCOPE.sCharacter('target_character').GetFullName] z powodu ich niemoralnej treści."
 pbi_objective_publishing_industry_events.205.f: "Treść kontrowersyjnej powieści [SCOPE.sCharacter('target_character').GetLastName], publikowanej w odcinkach w gazetach, jest nie do zaakceptowania"
 pbi_objective_publishing_industry_events.205.a: "Wielkie dzieła są nieakceptowalne dla starych wartości"
 pbi_objective_publishing_industry_events.205.b: "Musimy przejrzeć treść"
 pbi_objective_publishing_industry_events.206.t: "Podejrzenie plagiatu"
 pbi_objective_publishing_industry_events.206.d: "Kilku powieściopisarzy twierdzi, że ich dzieła zostały splagiatowane w publikowanej w odcinkach powieści [SCOPE.sCharacter('target_character').GetFullName]."
 pbi_objective_publishing_industry_events.206.f: "Rzekoma kreatywność waszego tak wielce cenionego pisarza to zwykłe oszustwo. Scena, którą twierdzi, że sam wymyślił, jest oparta na rozdziale jednej z moich książek. Jak możecie temu zaprzeczyć? Scena z kąpiącą się kobietą jest całkowicie wyjątkowa. Domagam się uznania moich praw autorskich!"
 pbi_objective_publishing_industry_events.206.a: "To fałszywe oskarżenie"
 pbi_objective_publishing_industry_events.207.t: "Powieść niczym proroctwo"
 pbi_objective_publishing_industry_events.207.d: "Treść publikowanych w odcinkach powieści [SCOPE.sCharacter('target_character').GetFullName] zwróciła uwagę ze względu na uderzające podobieństwo do niedawnego osobliwego morderstwa w [SCOPE.sState('target_state').GetName]."
 pbi_objective_publishing_industry_events.207.f: "Nie ma wątpliwości, że problem ubóstwa, z którym obecnie zmaga się nasze społeczeństwo, stoi za występowaniem takich zdarzeń. Zaskakujące jest jednak to, że powieść [SCOPE.sCharacter('target_character').GetLastName], która jest obecnie publikowana w odcinkach, zawiera dokładnie taki sam opis, jakby przepowiadała wystąpienie takiej sytuacji."
 pbi_objective_publishing_industry_events.207.a: "To dzieło, które uchwyciło ducha epoki"
 pbi_objective_publishing_industry_events.208.t: "Przychylne recenzje książki autorstwa znanych osobistości"
 pbi_objective_publishing_industry_events.208.d: "[SCOPE.sCharacter('target_character_1').GetFullName], wpływowy członek [SCOPE.gsInterestGroup('target_ig_1').GetName], opublikował przychylną recenzję powieści [SCOPE.sCharacter('target_character').GetFullName], która jest publikowana w odcinkach."
 pbi_objective_publishing_industry_events.208.f: "Wszystkie gazety publikują powieści, ale powieść [SCOPE.sCharacter('target_character').GetFullName] jest najciekawszą z nich wszystkich. Szczerze mówiąc, jestem zdumiony, że [SCOPE.sCharacter('target_character').GetSheHe] posiada taki talent literacki."
 pbi_objective_publishing_industry_events.208.a: "[SCOPE.sCharacter('target_character_1').GetLastName] ma oko do szczegółów"
 pbi_objective_publishing_industry_events.208.b: "Nie potrzebuję [SCOPE.sCharacter('target_character_1').GetHerHis] przysługi"
 pbi_objective_publishing_industry_events.209.t: "Krytyczne recenzje książki autorstwa znanych osobistości"
 pbi_objective_publishing_industry_events.209.d: "[SCOPE.sCharacter('target_character_1').GetFullName], prominentny członek [SCOPE.gsInterestGroup('target_ig_1').GetName], opublikował krytyczną recenzję powieści, którą [SCOPE.sCharacter('target_character').GetFullName] publikuje w odcinkach."
 pbi_objective_publishing_industry_events.209.f: "Brzydota publikowanych w odcinkach powieści [SCOPE.sCharacter('target_character').GetLastName] wyróżnia się na tle powieści wydawanych w ostatnich latach. W szczególności powieść opublikowana w tym tygodniu była pozbawiona wyrazu. Nie da się już naprawić tej zepsutej historii. Czuję nawet współczucie dla [SCOPE.sCharacter('target_character').GetLastName], który musi nadal pisać powieści, mimo że [SCOPE.sCharacter('target_character').GetSheHe] stał się pośmiewiskiem świata."
 pbi_objective_publishing_industry_events.209.a: "[SCOPE.sCharacter('target_character_1').GetLastName] ujawnia własną ignorancję"
 pbi_objective_publishing_industry_events.210.t: "Powieści publikowane w odcinkach przyciągają uwagę"
 pbi_objective_publishing_industry_events.210.d: "Powieści [SCOPE.sCharacter('target_character').GetFullName], publikowane w odcinkach w gazetach w [SCOPE.sState('target_state').GetName], z każdym kolejnym odcinkiem zyskują coraz większą uwagę."
 pbi_objective_publishing_industry_events.210.f: "Historia trudów i wysiłków głównego bohatera, oparta na jego własnym życiu, poruszyła serca wielu czytelników."
 pbi_objective_publishing_industry_events.210.a: "Nie mogę się doczekać dalszej części!"
 pbi_objective_publishing_industry_events.211.t: "Zagorzały fan"
 pbi_objective_publishing_industry_events.211.d.rich: "Powieści [SCOPE.sCharacter('target_character').GetFullName], publikowane w odcinkach, cieszą się popularnością wśród [concept_upper_strata] w [SCOPE.sState('target_state').GetName]."
 pbi_objective_publishing_industry_events.211.d.middle: "Powieści [SCOPE.sCharacter('target_character').GetFullName], publikowane w odcinkach, cieszą się popularnością wśród [concept_middle_strata] w [SCOPE.sState('target_state').GetName]."
 pbi_objective_publishing_industry_events.211.d.poor: "Powieści [SCOPE.sCharacter('target_character').GetFullName], publikowane w odcinkach, cieszą się popularnością wśród [concept_lower_strata] w [SCOPE.sState('target_state').GetName]."
 pbi_objective_publishing_industry_events.211.f: "Choć w [SCOPE.sState('target_state').GetName] można cieszyć się powieściami z różnych gazet, twórczość [SCOPE.sCharacter('target_character').GetFullName] w ostatnich latach cieszyła się ogromną popularnością."
 pbi_objective_publishing_industry_events.211.a: "Czy masz zaplanowane jakieś spotkania autorskie?"
 pbi_objective_publishing_industry_events.212.t: "Zawieszenie publikacji w odcinkach"
 pbi_objective_publishing_industry_events.212.d: "Sąd nakazał wstrzymanie publikacji w odcinkach powieści [SCOPE.sCharacter('target_character').GetFullName], ponieważ uznano, że zawarte w nich postacie zniesławiają określonych polityków."
 pbi_objective_publishing_industry_events.212.f: "Każdy, kto przeczytał tę powieść, wie, że postacie w powieści [SCOPE.sCharacter('target_character').GetFullName] są wzorowane na określonych politykach."
 pbi_objective_publishing_industry_events.212.a: "O mój Boże"
 pbi_objective_publishing_industry_events.300.t: "Dziennikarze na polu walki"
 pbi_objective_publishing_industry_events.300.d: "Artykuły wysyłane z [SCOPE.sFront('target_front').GetName] przez reportera, który służył podczas wojny [SCOPE.sWar('target_war').GetName], wzbudziły ogromne zainteresowanie."
 pbi_objective_publishing_industry_events.300.f: "Generał [SCOPE.sCharacter('target_character').GetFullName] rozkazał przeprowadzić wielokrotne natarcia i ostatecznie zdołał zmusić wroga do odwrotu, lecz nasze siły również poniosły ogromne straty. Rezultatem tej trwającej pół dnia bitwy było jedynie przesunięcie naszej pozycji o 100 metrów naprzód."
 pbi_objective_publishing_industry_events.300.a: "Ogłośmy nabór ochotników"
 pbi_objective_publishing_industry_events.300.b: "Zbierzmy datki"
 pbi_objective_publishing_industry_events.400.t: "Wygranie bitwy dyplomatycznej"
 pbi_objective_publishing_industry_events.400.d: "Nasze nagłośnione rozmowy z [SCOPE.sCountry('target_country').GetName] były szeroko relacjonowane w prasie [SCOPE.sCountry('target_country').GetName]. Chociaż nadało to rozpędu [Concept('concept_radical', '$concept_radicals$')] w [SCOPE.sCountry('target_country').GetName], wywołało również potępienie [SCOPE.sCountry('target_country').GetName] wśród zaangażowanych krajów."
 pbi_objective_publishing_industry_events.400.f: "W odpowiedzi na #bold bezczelną prośbę#! dyplomaty z [SCOPE.sCountry('target_country').GetName], [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] #bold odmówił spotkania#! z dyplomatą i za pośrednictwem #bold młodszego urzędnika#! poinformował go, że #bold nie ma już nic więcej do powiedzenia#!."
 pbi_objective_publishing_industry_events.400.a: "Nawet głupcy i gazety mogą być użyteczni w rękach sprytnej osoby"
 pbi_objective_publishing_industry_events.402.t: "Wojna informacyjna"
 pbi_objective_publishing_industry_events.402.d: "Gazety mają teraz większą siłę oddziaływania niż jakiekolwiek przemówienie polityka. Jeśli skutecznie wykorzystamy tę siłę, powinniśmy być w stanie zaszkodzić naszym wrogom."
 pbi_objective_publishing_industry_events.402.f: "„Ty dostarczysz ilustracje, a ja dostarczę wojnę.”\nWilliam Randolph Hearst"
 pbi_objective_publishing_industry_events.402.a: "[SCOPE.sCountry('target_country_1').GetName] jest naszym wrogiem"
 pbi_objective_publishing_industry_events.402.b: "Nie możemy pozwolić, aby [SCOPE.sCountry('target_country_2').GetName] nadal się rozwijało"
 pbi_objective_publishing_industry_events.402.c: "Musimy zająć się problemem z [SCOPE.sCountry('target_country_3').GetName]"
 pbi_objective_publishing_industry_events.402.e: "Powinniśmy to dokładnie rozważyć"
 pbi_objective_publishing_industry_events.402.tt: "Odłożymy decyzję dotyczącą kraju docelowego o jeden miesiąc"
 pbi_objective_publishing_industry_events.403.t: "Prochownia"
 pbi_objective_publishing_industry_events.403.d: "Gazety [SCOPE.sCountry('target_country').GetName] skrytykowały nasze roszczenia do regionu [SCOPE.sState('target_state').GetStateRegion.GetStrategicRegion.GetName], uznając je za nieuzasadnione."
 pbi_objective_publishing_industry_events.403.f: "W przypadku [SCOPE.sState('target_state').GetStateRegion.GetStrategicRegion.GetName], [concept_strategic_region]u ważnego zarówno dla nas, jak i dla [SCOPE.sCountry('target_country').GetName], gazety [SCOPE.sCountry('target_country').GetName] nieustannie powołują się na zasadność swoich praw do tego obszaru. Konflikt w tym regionie silnie pobudzi nastroje społeczne w [SCOPE.sCountry('target_country').GetName]."
 pbi_objective_publishing_industry_events.403.a: "Nie ma sposobu, aby nie wykorzystać tej okazji"
 pbi_objective_publishing_industry_events.404.t: "Bezczelna prośba"
 pbi_objective_publishing_industry_events.404.d: "Rząd [SCOPE.sCountry('target_country').GetName], za pośrednictwem swoich dyplomatów, zabiega o ustępstwa z naszej strony i dąży do zorganizowania tajnego spotkania z [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName]."
 pbi_objective_publishing_industry_events.404.f: "Opinia publiczna [SCOPE.sCountry('target_country').GetName] zaczyna domagać się rozpoczęcia wojny, jeśli ich przewaga w regionie [SCOPE.sState('target_state').GetStateRegion.GetStrategicRegion.GetName] nie zostanie uznana. Niemal pewne jest, że najnowsze żądanie rządu [SCOPE.sCountry('target_country').GetName] odzwierciedla jego pragnienie uniknięcia wojny poprzez stłumienie krajowej opinii publicznej, która zaczyna być zdominowana przez zwolenników otwartej wojny."
 pbi_objective_publishing_industry_events.404.a: "Chcą podnieść kurtynę.\nI zrobić to w sposób, który najbardziej im odpowiada!"
 pbi_objective_publishing_industry_events.405.t: "Telegram Przeznaczenia"
 pbi_objective_publishing_industry_events.405.d: "Do [SCOPE.sCharacter('target_character').GetFullName] dostarczono telegram informujący [SCOPE.sCharacter('target_character').GetHerHim] o treści tajnego spotkania z dyplomatami [SCOPE.sCountry('target_country').GetName] w willi [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName] w [SCOPE.sState('target_state_2').GetName]. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] powiedział, że [ROOT.GetCountry.GetRuler.GetSheHe] pozostawi rządowi decyzję, czy ujawnić jego treść publicznie."
 pbi_objective_publishing_industry_events.405.f: "Dyplomaci [SCOPE.sCountry('target_country').GetName] nie tylko stanowczo zażądali spotkania z [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullName], lecz także poprosili o wycofanie naszego [concept_interest] do regionu [SCOPE.sState('target_state').GetStateRegion.GetStrategicRegion.GetName] oraz, jako dowód ich zaangażowania, o abdykację. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] odpowiedział, informując dyplomatów, że [ROOT.GetCountry.GetRuler.GetSheHe] nie może i nie powinien składać takiego zobowiązania, a także że [ROOT.GetCountry.GetRuler.GetSheHe] nie ma już nic więcej do powiedzenia na tym spotkaniu i że negocjacje zostały zerwane."
 pbi_objective_publishing_industry_events.405.a: "Upublicznijmy to. Ale dodajmy temu trochę emocji"
 pbi_objective_publishing_industry_events.405.a.tt: "Sprawy przeradzają się w [concept_diplomatic_incident]"
 pbi_objective_publishing_industry_events.405.b: "Materiał nieprzeznaczony do publikacji"
 pbi_objective_publishing_industry_events.405.b.tt: "Sytuacja zostanie rozwiązana polubownie"
 pbi_objective_publishing_industry_events.500.t: "Rzucić światło na"
 pbi_objective_publishing_industry_events.500.d: "Gdy gazety zaczynają publikować zdjęcia zamiast ilustracji, surowa rzeczywistość naszego społeczeństwa zostaje ujawniona."
 pbi_objective_publishing_industry_events.500.f: "Zdjęcie przedstawia fawelę o słabym bezpieczeństwie i niewystarczających warunkach sanitarnych. Wielu pracowników jest zmuszonych wykonywać niebezpieczną pracę za niskie wynagrodzenie. Dzieci są zmuszane do pracy, ponieważ nie mogą uczęszczać do szkoły."
 pbi_objective_publishing_industry_events.500.a: "Musimy skupić się na rozwoju opieki społecznej."
 pbi_objective_publishing_industry_events.500.b: "[SCOPE.sCharacter('target_character_1').GetLastName] wydaje się, że zmienił zdanie w sprawie [GetLawGroup('lawgroup_childrens_rights').GetName]"
 pbi_objective_publishing_industry_events.500.c: "[SCOPE.sCharacter('target_character_2').GetLastName] wydaje się, że zmienił zdanie w sprawie [GetLawGroup('lawgroup_welfare').GetName]"
 pbi_objective_publishing_industry_events.500.e: "[SCOPE.sCharacter('target_character_3').GetLastName] wydaje się, że zmienił zdanie w sprawie [GetLawGroup('lawgroup_citizenship').GetName]"
 gaudi_transatlantic_cable_expedition_modifier: "Transatlantycka ekspedycja kablowa"
 gaudi_transatlantic_cable_expedition_failed_modifier: "Nieudana transatlantycka ekspedycja kablowa"