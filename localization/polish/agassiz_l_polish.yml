 agassiz_deep_sea_research_tech: "Badania Głębin Morskich"
 agassiz_deep_sea_research_tech_desc: "W latach 30. XX wieku Otis Barton i William Beebe byli pionierami wykorzystania batysfery – kulistej, stalowej komory ciśnieniowej zaprojektowanej tak, aby wytrzymać ogromne ciśnienie panujące w morskich głębinach. Wynalazek ten po raz pierwszy umożliwił ludziom bezpośrednią obserwację głębin oceanicznych, a w 1934 roku u wybrzeży Bermudów osiągnięto rekordową głębokość 923 metrów. Zainspirowany tymi sukcesami oraz własnymi lotami balonowymi na dużych wysokościach szwajcarski fizyk Auguste Piccard rozpoczął prace nad przystosowaniem swoich projektów kabin ciśnieniowych do stworzenia batyskafu – samobieżnego pojazdu przeznaczonego do eksploracji morskich głębin."
