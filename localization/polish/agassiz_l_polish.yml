 je_agassiz_overlord_geological_team_reason: "Asystenci geologiczni z innego kraju prowadzą obecnie poszukiwania formacji geologicznych na naszym terytorium."
 je_agassiz_overlord_geological_team_goal: "Zespół geologiczny pozostanie u nas przez około rok."
