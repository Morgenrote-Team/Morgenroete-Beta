 agassiz.801.t: "Sejsmometr"
 agassiz.801.d: "[GetPlayer.MakeScope.Var('tesla_engineer_var').GetCharacter.GetFullName] oraz [GetPlayer.MakeScope.Var('agassiz_geologist_var').GetCharacter.GetFullName] zaprezentowali dziś swój nowy przyrząd do rejestrowania aktywności sejsmicznej. Sejsmometr stanowi pierwszy krok w kierunku skuteczniejszego wykrywania trzęsień ziemi."
 agassiz.801.f: "W odpowiedzi na serię trzęsień ziemi, które nawiedziły okolice Comrie w Szkocji w 1839 roku, w Wielkiej Brytanii powołano komisję mającą na celu opracowanie skuteczniejszych urządzeń do wykrywania wstrząsów sejsmicznych. Rezultatem jej prac był sejsmometr z odwróconym wahadłem, skonstruowany przez Jamesa Davida Forbesa i po raz pierwszy przedstawiony w raporcie Davida Milne'a-Home'a w 1842 roku. Urządzenie rejestrowało aktywność sejsmiczną za pomocą ołówka zapisującego pomiary na papierze umieszczonym nad wahadłem. Według raportów Milne'a zaproponowane rozwiązania nie okazały się skuteczne. To właśnie Milne w 1841 roku wprowadził termin „sejsmometr” na określenie tego przyrządu."
 agassiz.801.g: "Z pewnością przyda się to naszym uczonym."
 agassiz.801.h: "Z pewnością przyda się to nauce."
 agassiz.802.t: "Sejsmograf"
 agassiz.802.d: "[GetPlayer.MakeScope.Var('tesla_engineer_var').GetCharacter.GetFullName] oraz [GetPlayer.MakeScope.Var('agassiz_geologist_var').GetCharacter.GetFullName] zaprezentowali dziś swój nowy przyrząd do rejestrowania aktywności sejsmicznej. Jest on znacznie doskonalszy od poprzedniego sejsmometru i pozwala o wiele skuteczniej wykrywać obszary zagrożone trzęsieniami ziemi. Dzięki temu możemy dokładniej przygotować się na sytuacje kryzysowe."
 agassiz.802.f: "Pierwsze sejsmografy wynaleziono w latach 70. i 80. XIX wieku. Pierwszy sejsmograf został skonstruowany przez Filippo Cecchiego około 1875 roku. Urządzenie nie było jednak wystarczająco czułe, a pierwszy sejsmogram zarejestrowano za jego pomocą dopiero w 1887 roku, kiedy John Milne zdążył już zaprezentować swój projekt w Japonii. W 1880 roku zespół Johna Milne'a, Jamesa Alfreda Ewinga i Thomasa Graya, którzy w latach 1880–1895 pracowali w Japonii jako zagraniczni doradcy rządowi, opracował pierwszy sejsmometr z wahadłem poziomym. Milne, Ewing i Gray, zatrudnieni przez rząd epoki Meiji w ciągu poprzednich pięciu lat w celu wspierania modernizacji Japonii, założyli Japońskie Towarzystwo Sejsmologiczne w odpowiedzi na trzęsienie ziemi, które nawiedziło Jokohamę 22 lutego 1880 roku."
 agassiz.802.g: "Z pewnością przyda się to geologii."
 je_agassiz_seismometer: "Sejsmometr"
 je_agassiz_seismometer_reason: "Sejsmometr jest udoskonaloną wersją sejsmoskopu. Nadal jest to urządzenie o bardzo ograniczonych możliwościach wykrywania wstrząsów sejsmicznych, ale pozwala przynajmniej zarejestrować fakt wystąpienia trzęsienia ziemi.\n\nBędziesz zyskiwać postęp, jeśli posiadasz zarówno [concept_tesla_engineer], jak i [concept_agassiz_geologist]"
 je_agassiz_seismometer_goal: "Geolog i inżynier muszą wspólnie pracować nad nowym przyrządem przez [JournalEntry.GetTotalGoalValue|V0] tygodni."
 je_agassiz_seismograph: "Sejsmograf"
 je_agassiz_seismograph_reason: "Zastosowanie sejsmografu w połączeniu z sejsmometrem pozwala w niezwykły sposób udoskonalić rejestrowanie trzęsień ziemi i wstrząsów sejsmicznych. Umożliwiłoby to wreszcie rozwój nowocześniejszej sejsmologii. Sejsmoskop uruchamiałby urządzenie rejestrujące, a następnie na powierzchni zapisu automatycznie powstawałoby graficzne przedstawienie wstrząsów (sejsmogram).\n\nBędziesz zyskiwać postęp, jeśli posiadasz zarówno [concept_tesla_engineer], jak i [concept_agassiz_geologist]"
 je_agassiz_seismograph_goal: "Geolog i inżynier muszą wspólnie pracować nad nowym przyrządem przez [JournalEntry.GetTotalGoalValue|V0] tygodni."
 agassiz_seismometer_done_tt: "Geolog i inżynier kończą wstępne rozważania teoretyczne dotyczące urządzenia i rozpoczynają budowę sejsmometru."
 agassiz_seismograph_done_tt: "Geolog i inżynier kończą wstępne rozważania teoretyczne dotyczące urządzenia i rozpoczynają budowę sejsmografu."
 agassiz.302.t: "Gejzer"
 agassiz.302.d: "Podczas [GetPlayer.MakeScope.Var('agassiz_geologist_var').GetCharacter.GetHerHis] poszukiwań niezwykłych obiektów geologicznych [GetPlayer.MakeScope.Var('agassiz_geologist_var').GetCharacter.GetFullName] natrafił na zdumiewające widowisko przyrodnicze w odległych zakątkach regionu [SCOPE.sState('agassiz_geyser_state').GetName]. Wygląda na to, że w okolicy znajdują się gejzery!"
 agassiz.302.f: "Gejzer to gorące źródło, które wyrzuca wodę w postaci fontanny w regularnych lub nieregularnych odstępach czasu. Nazwa gejzerów pochodzi od Wielkiego Gejzeru (Geysir) na Islandii. Do ich powstania niezbędne jest szczególne połączenie warunków geologicznych i klimatycznych, które na większą skalę występują jedynie w nielicznych miejscach. Działanie gejzerów zależy od trzech czynników: dopływu wody z warstwy wodonośnej, źródła ciepła oraz co najmniej jednego podziemnego zbiornika połączonego z systemem kanałów, w którym występuje przewężenie. W Parku Narodowym Yellowstone znajduje się ponad 300 aktywnych gejzerów, co stanowi około połowy wszystkich gejzerów na świecie."
 agassiz.302.g: "Czy gejzer wybucha w odstępach minutowych czy godzinnych?"
