l_polish:
 agassiz_geology_tech: "Geologia"
 agassiz_geology_tech_desc: "W 1815 roku budowniczy kanałów William Smith opublikował mapę geologiczną Anglii i Walii, uwzględniającą zarówno występujące skamieliny, jak i litologię skał. Smith zauważył, że określone sekwencje warstw skalnych charakteryzują się również bardzo specyficznym, niepowtarzalnym następstwem zespołów fauny. W 1827 roku Leopold von Buch wprowadził termin „skamielina przewodnia” na określenie skamielin umożliwiających datowanie względne. Od tej pory ustalenie rzeczywistego wieku Ziemi stało się przedmiotem badań naukowych."
 notification_agassiz_yearly_minerals_notification_name: "Roczny raport geologiczny"
 notification_agassiz_yearly_minerals_notification_desc: "W tym roku znaleźliśmy i skatalogowaliśmy [GetPlayer.MakeScope.Var('agassiz_generic_minerals_notification_var').GetValue|0+=] nowych [Concept('concept_agassiz_mineral','$concept_agassiz_minerals|q$')]."
 agassiz_sounding_tech: "Echosonda"
 agassiz_sounding_tech_desc: "Echosonda została po raz pierwszy wynaleziona jako odpowiedź na wojnę podwodną. Później jednak znalazła również zastosowanie w wielu cywilnych dziedzinach: na przykład w lokalizowaniu ławic ryb oraz w badaniach głębin morskich."
 building_agassiz_volcano_observatory: "Obserwatorium Wulkanologiczne"
 agassiz_volcano_observatory_can_construct_volcano_tt: "Stan posiada #ORANGE wulkan#!."
 agassiz_volcano_observatory_can_construct_geologist_tt: "#default_text [GetPlayer.GetName] posiada [concept_agassiz_geologist].#!"
 pmg_agassiz_volcanology: "Wulkanologia"
 pm_agassiz_basic_volcanology: "Podstawowa Wulkanologia"
 agassiz_building_production_mult_modifier: "Nowa żyła rudy"
 agassiz_building_production_2_mult_modifier: "Nowy szyb naftowy"
 agassiz_ore_search_cost_modifier: "Koszt poszukiwania rudy"
 agassiz_mineralogist: "Mineralog"
 agassiz_mineralogist_desc: "Mineralodzy są ekspertami od rzadkich skał i są szczególnie przydatni w odnajdywaniu rzadkich minerałów."
 agassiz_geophysicist: "Geofizyk"
 agassiz_geophysicist_desc: "Geofizycy są ekspertami w zakresie budowy wnętrza Ziemi i najlepiej znają historię Ziemi oraz zachodzące w niej procesy."
 agassiz_prospector: "Poszukiwacz"
 agassiz_prospector_desc: "Poszukiwacze posiadają specjalne zdolności, które pomagają odnajdywać nowe żyły rudy lub źródła ropy."
 agassiz_oceanographer: "Oceanograf"
 agassiz_oceanographer_desc: "Oceanografowie specjalizują się w badaniu natury i procesów oceanicznych"
 agassiz_volcanologist: "Wulkanolog"
 agassiz_volcanologist_desc: "Wulkanolodzy są ekspertami od wulkanów i są szczególnie pomocni w ich badaniu."
 agassiz.100.t: "Poszukiwanie rud"
 agassiz.100.d: "Dr [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] spakował [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis] sprzęt i odwołał wszystkie zajęcia, aby rozpocząć poszukiwanie rud. Pozostaje pytanie, jakie złoża surowców [ROOT.Var('agassiz_geologist_var').GetCharacter.GetSheHe] powinien zbadać?"
 agassiz.100.f: ""
 agassiz.100.g: "Dr [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] powinien wrócić na uniwersytet."
 agassiz.100.h: "Węgiel."
 agassiz.100.i: "Żelazo."
 agassiz.100.j: "Ołów."
 agassiz.100.k: "Siarka."
 agassiz.100.l: "Złoto."
 agassiz.100.m: "Uran."
 agassiz.101.t: "Nowe żyły rudy"
 agassiz.101.d: "Po tym, jak dr [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] odkrył nowe żyły rudy dla przedsiębiorstw górniczych, [ROOT.Var('agassiz_geologist_var').GetCharacter.GetSheHe] wraca. Dalsza rozbudowa obiektów nie jest jego [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis] zmartwieniem."
 agassiz.101.f: "„Wszystko ma swoje granice. Rudy żelaza nie da się przemienić w złoto.” - Mark Twain"
 agassiz.101.g: "Dobra robota."
 agassiz.102.t: "Ropa!"
 agassiz.102.d: "Po tym, jak dr [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] odkrył nowe źródła ropy, czarne złoto zaczęło tryskać. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetSheHe] uważa, że [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis] praca jest na razie zakończona.\n\nŁączna liczba ulepszonych budynków: [GetPlayer.MakeScope.Var('mr_num_improved_oil_rigs_buildings_var').GetValue|V0]"
 agassiz.102.f: "„Przepis na sukces: wcześnie wstawać, ciężko pracować, znaleźć ropę.” - J. Paul Getty"
 agassiz.102.g: "Ropy nigdy za wiele."
 je_agassiz_find_oil_project: "Poszukuj Ropy"
 je_group_agassiz_geology: "Morgenröte: [concept_agassiz_geology]"
 je_geologist_dies_tt: "Dr [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] umiera"
 agassiz_stop_geologist_project_button: "Zatrzymaj projekt geologiczny"
 agassiz_stop_geologist_project_button_desc: "Zatrzymaj obecny projekt geologiczny. Twój postęp geologiczny zostanie utracony."
 agassiz_stop_geologist_improving_project_tt: "Zdecydowałeś się zatrzymać projekt, klikając przycisk #italic Zatrzymaj projekt geologiczny#!."
 agassiz_mid_atlantic_ridge_cost_modifier: "Koszt ekspedycji atlantyckiej"
 je_agassiz_mid_atlantic_ridge: "Podwodne góry"
 je_agassiz_mid_atlantic_ridge_reason: "[concept_agassiz_geologist] dr [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] znajduje się obecnie na pokładzie nowoczesnego statku badawczego, który wykorzystuje echosondę do skanowania podłoża Atlantyku. Powinno to dostarczyć nowych informacji na temat historii Ziemi."
 je_agassiz_mid_atlantic_ridge_goal: "Po 12 miesiącach dr [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] powinien przedstawić wyniki."
 agassiz.201.t: "Grzbiet Śródatlantycki"
 agassiz.201.d: "Dr [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] zapoznał się z częścią pierwszych danych. Wynik ekspedycji jest zdumiewający: nie tylko na północy Atlantyku, ale w całym Oceanie Atlantyckim podwodne wzniesienie można dostrzec jako ciągły pas, który jest przerwany jedynie na wysokości równika. Geolog nazwał to zjawisko Grzbietem Śródatlantyckim. Dalsza analiza danych odbędzie się w nadchodzących miesiącach i latach."
 agassiz.201.f: "Grzbiet Śródatlantycki to pasmo górskie w Oceanie Atlantyckim, które w większości znajduje się poniżej poziomu morza i rozciąga się na około 20 000 km. Czyni go to najdłuższym z grzbietów śródoceanicznych, systemu obejmującego całą Ziemię i mającego ponad 60 000 km długości. Wyniesienie dna morskiego na środkowym Atlantyku zostało po raz pierwszy opisane przez oficera marynarki Matthew Fontaine'a Maury'ego w 1853 roku i potwierdzone przez ekspedycję Challengera w 1872 roku. Powodem tych badań były wstępne prace nad układaniem pierwszych transatlantyckich kabli głębinowych. Podczas niemieckiej ekspedycji Meteor w latach 1925–1927 utworzono szczegółowy profil Grzbietu Śródatlantyckiego za pomocą pomiarów echosondą. Odkrycie śródatlantyckiego pasma górskiego dostarczyło wczesnej wskazówki dotyczącej procesów geodynamicznych związanych z tektoniką płyt oraz teorią dryfu kontynentów Wegenera."
 agassiz.201.g: "To poprawi geofizyczne zrozumienie geologa."
 agassiz.201.h: "To poprawi oceanograficzne zrozumienie geologa."
 agassiz.201.i: "To poprawi ogólne zrozumienie geologa."
 agassiz.202.t: "Sympozjum Geologiczno-Paleontologiczne"
 agassiz.202.d: "Akademia Nauk zaprosiła ludzi na wydarzenie zorganizowane przez prof. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetFullName] oraz prof. [ROOT.Var('dubois_paleontologist_var').GetCharacter.GetFullName]. Sympozjum jest uważane za kamień milowy w badaniach nad historią Ziemi. Obaj szczególnie podkreślili uderzające podobieństwa w geologicznej i kopalnej budowie wybrzeży Ameryki Południowej i Afryki Zachodniej."
 agassiz.202.f: "O tym, jak ściśle geologia i paleontologia są ze sobą powiązane, świadczą liczni naukowcy, którzy wyróżnili się osiągnięciami w obu dziedzinach. Wzajemna zależność między warstwami geologicznymi a zawartymi w nich skamielinami, wykorzystywana do ustalania chronologii, sprawia, że obie nauki są ze sobą nierozerwalnie związane. Georges Cuvier jest uważany za ojca paleontologii, ale także za jednego z ojców założycieli geologii. Nawet podczas sporów naukowych, takich jak debata Cuviera z Geoffroyem w 1830 roku, której przedmiotem był konflikt między gradualizmem a katastrofizmem, głównymi argumentami były odkrycia geologiczne i paleontologiczne. Bez wzajemnego oddziaływania i współpracy obu dziedzin nie byłoby możliwe powstanie ani współczesnej geologii, ani współczesnej paleontologii."
 agassiz.202.g: "Owocna wymiana akademicka."
 agassiz.311.t: "Kamień z Kosmosu"
 agassiz.311.d: "W jednym z bardziej odległych obszarów naszego kraju dr [ROOT.Var('agassiz_geologist_var').GetCharacter.GetFullName] odkrył niezwykły kamień podczas [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis] poszukiwań nowych minerałów. Po wstępnym badaniu stało się jasne: zawierający żelazo monolit jest meteorytem!"
 agassiz.311.f: "Pierwsze kolekcje meteorytów powstały już w XVIII wieku, zanim wiedziano, że meteoryty mają pozaziemskie pochodzenie. Najstarsza kolekcja meteorytów na świecie znajduje się w Muzeum Historii Naturalnej w Wiedniu, gdzie jej fundament położono wraz z meteorytem Hraschina (który spadł w 1751 roku). Obecnie mieści się tam największa kolekcja wystawowa na świecie, licząca około 1100 obiektów. Do XX wieku odkryto zaledwie kilkaset znalezisk meteorytów. Powodem, dla którego w światowych kolekcjach znajduje się obecnie ponad 30 000 znalezisk meteorytów, było odkrycie Harveya H. Niningera, że meteoryty występują na powierzchni Ziemi znacznie częściej, niż wcześniej sądzono. Strategia Niningera polegała na poszukiwaniu meteorytów na Wielkich Równinach Stanów Zjednoczonych, gdzie ziemia była w dużej mierze uprawiana, a gleba zawierała niewiele skał."
 agassiz.311.g: "Skąd pochodzi?"
 agassiz_seismology_tech: "Sejsmologia"
 agassiz_seismology_tech_desc: "W odpowiedzi na serię trzęsień ziemi w pobliżu Comrie w Szkocji w 1839 roku w Wielkiej Brytanii powołano komitet w celu opracowania lepszych metod wykrywania trzęsień ziemi. Rezultatem jego działań było stworzenie jednego z pierwszych nowoczesnych sejsmometrów przez Jamesa Davida Forbesa. Od 1857 roku Robert Mallet położył fundamenty pod współczesną sejsmologię instrumentalną i przeprowadzał eksperymenty sejsmologiczne z użyciem materiałów wybuchowych. Jest również odpowiedzialny za ukucie słowa „sejsmologia”."
 agassiz_geologist_demotivated_modifier: "Geolog pozbawiony motywacji"
 agassiz_set_new_age_of_earth_effect_tt: "[GetPlayer.GetName] opracowuje najnowsze badanie dotyczące wieku Ziemi. Wiek Ziemi jest ponownie obliczany."
 agassiz.401.tt: "Wszystkie państwa posiadające [concept_agassiz_geologist] głosują nad badaniem."
 notification_agassiz_new_earth_age_notification_name: "Ponowne oszacowanie wieku Ziemi"
 notification_agassiz_new_earth_age_notification_desc: "[concept_agassiz_geologist] zdołał przekonać wielu kolegów, że Ziemia jest znacznie starsza, niż wcześniej sądzono.\n\n[SCOPE.GetRootScope.GetCountry.GetCustom('agassiz_age_of_earth_type')]"
 je_agassiz_geological_research: "Badania geologiczne"
 je_agassiz_geological_research_reason: "[ROOT.GetCountry.GetCustom('je_agassiz_geological_research_active_type')][concept_agassiz_geologist], który nie jest zajęty innym zadaniem, będzie prowadzić Badania Geologiczne.\n\nPodczas badań mogą wystąpić następujące efekty:\n- Jeśli twój Geolog ma $agassiz_mineralogist$ jako [concept_character_trait], liczba pozyskiwanych rocznie [Concept('concept_agassiz_mineral','$concept_agassiz_minerals|q$')] zostanie podwojona.\n- Twój Geolog może odkryć [Concept('concept_dubois_formation','$concept_dubois_formations|q$')], [Concept('concept_andersson_cave','$concept_andersson_caves|q$')] oraz Uran.\n- Po 5 latach badań otrzymasz @agassiz_mineral! #p 25,000#! [Concept('concept_agassiz_mineral','$concept_agassiz_minerals|q$')] oraz @agassiz_rare_mineral! #p 1#! [Concept('concept_agassiz_rare_mineral','$concept_agassiz_rare_minerals|q$')]. Ponadto twój Geolog może zyskać $agassiz_mineralogist$ jako [concept_character_trait]"
 agassiz.401.t: "Najnowsze Obliczenia"
 agassiz.401.d: "[ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] zebrał wszystkie [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis] wcześniejsze doświadczenia i wiedzę zdobytą w ciągu [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis] życia, aby przedstawić nowe oszacowanie wieku Ziemi. Pozostaje pytanie, czy teoria ta zostanie również uznana przez środowisko naukowe."
 agassiz.401.f: "Od początku XIX wieku do połowy XX wieku określenie wieku Ziemi pozostawało kwestią niejasną i w dużej mierze było przedmiotem nieustających debat oraz sporów. Kwestia wieku Ziemi często wiązała się z zagadnieniem ewolucji, ponieważ teoria ewolucji wymagała odpowiednio długiego okresu, aby mogła być uznana za wiarygodną. Aż do przełomu XIX i XX wieku wielu naukowców uważało, że Ziemia ma zaledwie kilka milionów lat — pod koniec życia Lord Kelvin szacował jej wiek na zaledwie 20 milionów lat. Nawet Karol Darwin, który należał do „maksymalistów” broniących swojej teorii, uważał, że Ziemia ma około 300 milionów lat. Dopiero odkrycie promieniotwórczości umożliwiło prawidłowe określenie wieku Ziemi i ujawniło jej rzeczywisty wiek, a tym samym wiek całego Układu Słonecznego."
 agassiz.401.g: "Wyślij pracę naukową do wszystkich znanych geologów na całym świecie."
 agassiz.402.t: "Geolog Przedstawia Nowe Obliczenia"
 agassiz.402.d: "[SCOPE.sCharacter('agassiz_geologist_scope').GetLastName] przedstawił nowe obliczenia rzeczywistego wieku Ziemi. Uczony uważa wcześniejsze pomiary za błędne i szacuje, że wiek Ziemi jest znacznie większy, niż dotychczas sądzono. Ponieważ nasz Geolog należy do cenionych przedstawicieli tej dziedziny nauki, również otrzymaliśmy kopię jego pracy naukowej."
 agassiz.402.g: "Te obliczenia są przekonujące."
 agassiz.402.h: "Kto miałby uwierzyć w te pseudogeologiczne bzdury?"
 agassiz.403.t_yes: "Badania Geologiczne Zaakceptowane"
 agassiz.403.d_yes: "Na szczęście większość członków Międzynarodowego Towarzystwa Geologicznego uznała nowe obliczenia naszego Geologa za przełomowe osiągnięcie i zaakceptowała jego teorię jako słuszną."
 agassiz.403.f_yes: "Oszacowanie wieku Ziemi przedstawione przez [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] zostało zaakceptowane przez większość uczonych. [GetGlobalVariable('agassiz_age_of_earth_yes_global_var').GetValue|+0] naukowców #G zaakceptowało#! badania, a [GetGlobalVariable('agassiz_age_of_earth_no_global_var').GetValue|+0] je #R odrzuciło#!. Oznaczało to, że teoria została oficjalnie uznana, a szacowany wiek Ziemi znacznie zwiększony."
 agassiz.403.g: "Triumf Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName], triumfem dla geologii!"
 agassiz.403.t_no: "Badania Geologiczne Odrzucone"
 agassiz.403.d_no: "Ignoranci z tak zwanej „elity” międzynarodowego środowiska geologów odrzucili nowe badania naszego Geologa. Musimy jeszcze ustalić, czy podczas głosowania doszło do oszustwa, czy też był to wrogi manewr mający na celu podważenie pozycji naszego dumnego narodu."
 agassiz.403.f_no: "Szacunki [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] dotyczące wieku Ziemi zostały odrzucone przez większość. [GetGlobalVariable('agassiz_age_of_earth_yes_global_var').GetValue|+0] naukowców #G zaakceptowało#! badania, a [GetGlobalVariable('agassiz_age_of_earth_no_global_var').GetValue|+0] #R odrzuciło#! je. Dotychczasowe oszacowanie wieku Ziemi pozostaje zatem bez zmian."
 agassiz.403.h: "Porażka Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName], porażką dla geologii..."
 je_agassiz_advanced_oceanography: "Zaawansowana Oceanografia"
 je_agassiz_advanced_oceanography_reason: "Podczas gdy wcześniejsze badania oceanograficzne miały przede wszystkim przynieść praktyczne korzyści wojsku, umożliwiając strategiczne wykorzystanie warunków panujących na Pacyfiku, naukowcy opowiedzieli się teraz za wykorzystaniem wyników badań morskich do lepszego poznania naszej planety – wyłącznie w imię poszerzania wiedzy."
 je_agassiz_advanced_oceanography_success: "Zakończymy nasze badania, gdy zdobędziemy #G 50#! @rapanui_oceanographic_knowledge! punktów #E Wiedzy Oceanograficznej#!."
 je_agassiz_advanced_oceanography_goal: "Zakończymy nasze badania, gdy zdobędziemy #G 50#! @rapanui_oceanographic_knowledge! punktów #E Wiedzy Oceanograficznej#!."
 agassiz.312.t: "Badania Geologiczne"
 agassiz.312.d: "Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] opracował profil geologiczny rozległego obszaru lądowego i udostępnił mapę opinii publicznej."
 agassiz.312.f: "Współczesna stratygrafia rozwinęła się w XIX wieku: geolodzy z całej Europy i Ameryki Północnej, wzorem Williama Smitha, badali, klasyfikowali i porównywali warstwy skalne w swoich krajach, a następnie publikowali mapy, tabele stratygraficzne i rozprawy naukowe przedstawiające wyniki swoich prac."
 agassiz.312.g: "Wykorzystaj wiedzę w teorii."
 agassiz.312.h: "Wykorzystaj wiedzę w praktyce."
 agassiz.313.t: "Złoże Minerałów"
 agassiz.313.d: "Badania geologiczne na dotychczas niezagospodarowanym obszarze ujawniły bogate złoże minerałów. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetFullName] nie jest jeszcze pewien, na czym powinny się koncentrować [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis] poszukiwania."
 agassiz.313.f: "Minerał to pierwiastek lub związek chemiczny, zazwyczaj o budowie krystalicznej, powstały w wyniku procesów geologicznych. Większość spośród około 6000 znanych obecnie i uznanych za odrębne gatunków minerałów ma charakter nieorganiczny, jednak niektóre substancje organiczne, takie jak mellit i ewenkit, a także minerały tworzące kamienie nerkowe, takie jak whewellit i weddellit, również są uznawane za minerały, ponieważ w ich powstawaniu uczestniczyły procesy geologiczne. Uwzględniając wszystkie znane odmiany minerałów, nazwy synonimiczne oraz gatunki minerałów, które nie zostały jeszcze oficjalnie uznane, liczba nazw minerałów przekracza 7000."
 agassiz.313.g: "Ilość."
 agassiz.313.h: "Jakość."
 agassiz.314.t: "Inspirujący Geolog"
 agassiz.314.d: "[ROOT.Var('agassiz_geologist_var').GetCharacter.GetFullName] zdobył już uznanie w świecie geologii. Na zajmowanej przez [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis] katedrze często zwracano się do [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHim] po radę, a w skrzynce pocztowej piętrzyły się listy od kolegów po fachu z całego świata. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerselfHimself]"
 agassiz.314.f: "„Uważam, że najlepszym geologiem jest ten, który widział najwięcej skał”. – Herbert Harold Read"
 agassiz.314.g: "To zwiększy reputację [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis]."
 agassiz.314.h: "To zwiększy reputację uniwersytetu, z którym związany jest [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis]."
 agassiz.315.t: "Odkrycia Geologiczne"
 agassiz.315.d: "Obecna wyprawa badawcza, podczas której [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHim] odwiedził wiele różnych miejsc o znaczeniu geologicznym w naszym kraju, otworzyła nowe perspektywy przed [ROOT.Var('agassiz_geologist_var').GetCharacter.GetFullName]. W przygotowywanej właśnie pracy naukowej [ROOT.Var('agassiz_geologist_var').GetCharacter.GetSheHe] przedstawia nowe odkrycia dotyczące praw rządzących procesami geologicznymi."
 agassiz.315.f: "„Świat jest dla geologa ogromną układanką. Stoi przed nim niczym dziecko, dla którego poszczególne elementy pozostają zagadką, dopóki nie odkryje, jak się ze sobą łączą i gdzie jest ich miejsce. Wówczas fragmenty te zaczynają pod jego ręką tworzyć spójny obraz”. – Louis Agassiz"
 agassiz.315.g: "Doskonale."
 agassiz.11.t: "Dynamika Trzęsień Ziemi"
 agassiz.11.d: "[ROOT.Var('agassiz_geologist_var').GetCharacter.GetFullName] przyciągnął dziś uwagę międzynarodowego środowiska naukowego, ponieważ [ROOT.Var('agassiz_geologist_var').GetCharacter.GetSheHe] swoją książką o trzęsieniach ziemi zrewolucjonizował dotychczasową wiedzę w tej dziedzinie geologii. Terminy wprowadzone przez [ROOT.Var('agassiz_geologist_var').GetCharacter.GetSheHe], takie jak „epicentrum” i „sejsmologia”, zdążyły już na stałe wejść do języka nauki."
 agassiz.11.f: "9 lutego 1846 roku Robert Mallet przedstawił Królewskiej Akademii Irlandzkiej swoją pracę „Dynamika Trzęsień Ziemi”, uznawaną za jeden z fundamentów współczesnej sejsmologii. W latach 1852–1858, z pomocą swojego syna Johna Williama Malleta, opracował Katalog Trzęsień Ziemi Brytyjskiego Towarzystwa Naukowego, który ukazał się w 1858 roku i zawierał wykaz znanych trzęsień ziemi wraz z opisami ich skutków. W tym okresie przeprowadzał również eksperymenty z użyciem materiałów wybuchowych, aby określić czas rozchodzenia się fal sejsmicznych w luźnych osadach i litych skałach."
 pmg_agassiz_seismology: "Sejsmologia"
 pm_agassiz_basic_seismology: "Podstawowa Sejsmologia"
 pm_agassiz_advanced_seismology: "Zaawansowana Sejsmologia"
 pm_agassiz_advanced_volcanology: "Zaawansowana Wulkanologia"
 agassiz_congress_host_modifier: "Zorganizowano Kongres Geologiczny"
 agassiz_laughed_congress_modifier: "Wyśmiany na Kongresie Geologicznym"
 agassiz_respected_congress_modifier: "Szanowany na Kongresie Geologicznym"
 agassiz_lauded_congress_modifier: "Chwalony na Kongresie Geologicznym"
 agassiz.316.f: "Jeśli na własnym terytorium nie ma interesujących obiektów geologicznych, geolodzy mogą poszukiwać formacji skalnych lub jaskiń na obszarach przygranicznych bądź poza granicami kraju."
 agassiz.317.t: "Zagraniczny Geolog"
 agassiz.317.d: "Zagranicznemu geologowi udało się w jakiś sposób przedostać na nasze terytorium podczas prowadzonych badań i sporządzić dokumentację geologiczną. W ramach „podziękowania” przesłał nam wyniki swoich badań."
 agassiz.317.g: "No i...?"
 agassiz.501.t: "Czy Kontynenty się Przemieszczają?"
 agassiz.501.d: "[ROOT.Var('agassiz_geologist_var').GetCharacter.GetFullName] opublikował właśnie książkę, w której [ROOT.Var('agassiz_geologist_var').GetCharacter.GetSheHe] przedstawia tezę budzącą już ogromne kontrowersje. Zgodnie z nią kontynenty w swoim obecnym kształcie powstały stosunkowo niedawno w skali czasu geologicznego. Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] twierdzi, że dzisiejsze kontynenty tworzyły niegdyś jedną całość, którą [ROOT.Var('agassiz_geologist_var').GetCharacter.GetSheHe] nazywa „Pangeą”. Aby przekonać międzynarodowe środowisko geologiczne do swojej teorii, [ROOT.Var('agassiz_geologist_var').GetCharacter.GetSheHe] zaprosił jego przedstawicieli na kongres."
 agassiz.501.f: "Pierwszą sugestię, że przyczyną tego zjawiska był dryf kontynentów, wysunął flamandzki kartograf Abraham Ortelius. Już w wydaniu jego atlasu „Theatrum Orbis Terrarum” z 1596 roku można wyraźnie dostrzec podobieństwo obu linii brzegowych. Alexander von Humboldt w 1801 i 1845 roku opisywał podobieństwo przeciwległych wybrzeży Ameryki Południowej i Afryki oraz występującej na nich roślinności, przypuszczając, że Ocean Atlantycki powstał wskutek działania katastrofalnego prądu wodnego. W 1858 roku geograf Antonio Snider-Pellegrini poszedł o krok dalej, publikując pierwszą mapę przedstawiającą Stary i Nowy Świat bez rozdzielającego je oceanu. Jednak to przede wszystkim Alfred Wegener swoją teorią dryfu kontynentów doprowadził do zmiany sposobu myślenia, odchodząc od fiksizmu (poglądu zakładającego, że kontynenty są trwale zakotwiczone w skorupie ziemskiej) na rzecz mobilizmu. Za jego życia proponowany przez niego model wyjaśniający pozostawał jednak poglądem mniejszościowym w środowisku naukowym, a powszechne uznanie zyskał dopiero w drugiej połowie XX wieku."
 agassiz.501.g: "Zaproś czołowe potęgi geologiczne!"
 agassiz.502.t: "Zaproszenie Geologiczne"
 agassiz.502.d: "[SCOPE.sCountry('agassiz_congress_host_country').GetName] zaprosiło przedstawicieli środowiska naukowego na międzynarodowy kongres geologiczny. Gospodarz wydarzenia, wybitny geolog, twierdzi, że kontynenty się przemieszczają...!"
 agassiz.502.g: "Zapowiada się niezła rozrywka."
 agassiz.503.t_laughed: "Drwiny Towarzystwa Geologicznego"
 agassiz.503.t_respected: "Pewne siebie Wystąpienie"
 agassiz.503.t_lauded: "Podziw i Gratulacje"
 agassiz.503.d_laughed: "Wystąpienie Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] zostało przyjęte z rozbawieniem. [ROOT.GetCountry.GetNameNoFlag] nie cieszy się szczególną reputacją w dziedzinie geologii, ponieważ nie może poszczycić się żadnymi wybitnymi osiągnięciami. Za zamkniętymi drzwiami wyraźnie nie brakowało żartów."
 agassiz.503.d_respected: "Przed rozpoczęciem Kongresu Geologicznego [ROOT.Var('agassiz_geologist_var').GetCharacter.GetFullName] został serdecznie powitany, a uczestnicy zgodnie ze zwyczajem wymienili się podarunkami. [ROOT.GetCountry.GetNameNoFlag] cieszy się uznaniem w świecie nauki."
 agassiz.503.d_lauded: "Przybycie Profesora [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] zostało powitane z wielką radością, ponieważ był on uważany za jednego z najbardziej wyczekiwanych gości. Wokół [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHim] szybko zgromadził się tłum, gdyż [ROOT.GetCountry.GetNameNoFlag] jest uznawane za pioniera w dziedzinie geologii."
 agassiz.503.f_laughed: "„Dlaczego geolodzy z [ROOT.GetCountry.GetAdjectiveNoFlag] nie mają powodzenia u dziewczyn?\n\nBo jest między nimi zbyt duże tarcie!”"
 agassiz.503.f_respected: "Po przybyciu [ROOT.Var('agassiz_geologist_var').GetCharacter.GetFullName] odbył kilka miłych rozmów z kolegami po fachu, głównie na temat nudnych formacji skalnych, podczas których [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis] obecność spotkała się z życzliwym przyjęciem."
 agassiz.503.f_lauded: "Prof. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] wydawał się niemal przytłoczony zainteresowaniem. Tak wielu kolegów po fachu pragnęło porozmawiać z [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHim] i czerpać wiedzę z wypraw oraz doświadczeń, którymi [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis] mógł się podzielić dzięki [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis] wieloletniej pracy. Niektórzy nawet namawiali [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHim] do wygłoszenia prywatnego wykładu."
 agassiz.503.g: "Co za wstyd!"
 agassiz.503.h: "Wreszcie wśród ludzi o podobnych poglądach."
 agassiz.503.i: "Jesteśmy czołową potęgą geologiczną!"
 agassiz.504.t: "Fiksizm czy Mobilizm?"
 agassiz.504.d: "[SCOPE.sCharacter('agassiz_alfred_wegener_scope').GetFullName] wygłosił przed zgromadzonym międzynarodowym środowiskiem geologicznym niezwykle entuzjastycznie przyjęty wykład, w którym [SCOPE.sCharacter('agassiz_alfred_wegener_scope').GetSheHe] stanowczo opowiada się za odejściem od dotychczasowych poglądów na rzecz mobilizmu, czyli teorii dryfu kontynentów. Przeciwników tej koncepcji jest jednak wielu i nie zamierzają oni odstępować od dominującej doktryny fiksizmu."
 agassiz.504.f: "Fiksizm był dominującą hipotezą geotektoniczną aż do lat 60. XX wieku. Zakładano, że skorupa ziemska jest trwale związana z leżącym pod nią podłożem, a procesy tektoniczne zachodzą jedynie lokalnie. Wynikało z tego przekonanie, że rozwój Ziemi charakteryzował się przede wszystkim pionowymi ruchami skorupy ziemskiej, podczas gdy ruchy poziome odgrywały znikomą rolę. Większość teorii klasycznej geologii opierała się na założeniach fiksizmu. Na początku XIX wieku w Ameryce Południowej i Afryce odkryto skamieliny należące do tych samych gatunków. W ramach fiksizmu wysunięto hipotezę pomostów lądowych, zgodnie z którą Afrykę i Amerykę Południową łączyły niegdyś pasy lądu umożliwiające zwierzętom migrację między kontynentami. W latach 1924–1927 statek badawczy Meteor przeprowadził pomiary echolotem, podczas których odkryto Grzbiet Śródatlantycki – podwodny łańcuch górski rozciągający się z północy na południe. Zamiast spodziewanych pozostałości pomostu lądowego, który powinien przebiegać ze wschodu na zachód, odnaleziono więc zupełnie inną strukturę geologiczną. Odkrycie to zaczęło podważać hipotezę pomostów lądowych, choć ostatecznie porzucono ją dopiero w latach 60. XX wieku. Przeciwieństwem fiksizmu jest mobilizm, który przypisuje decydujące znaczenie poziomym ruchom skorupy ziemskiej. Teoria mobilizmu rozwinęła się na podstawie odkrycia dryfu kontynentów przez Alfreda Wegenera."
 agassiz.504.g: "Kontynenty nie zmieniły się od milionów lat."
 agassiz.504.h: "Wszystko wskazuje na tektonikę płyt."
 agassiz.505.t: "Geolodzy we własnym gronie"
 agassiz.505.d: "Na marginesie wielkiego Kongresu Geologicznego [ROOT.Var('agassiz_geologist_var').GetCharacter.GetFullName] ma okazję wymienić się poglądami z kolegami po fachu. Na czym [ROOT.Var('agassiz_geologist_var').GetCharacter.GetSheHe] powinien się skupić w czasie wolnym od obrad, który pozostaje do [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis] dyspozycji?"
 agassiz.505.f: "„Zadziwiające jest to, jak wiele mówi o niepełnym stanie naszej obecnej wiedzy fakt, że w zależności od tego, czy do zagadnienia podchodzimy z punktu widzenia biologii, czy geofizyki, wyciągamy całkowicie sprzeczne wnioski na temat prehistorycznych warunków panujących na naszej planecie”. – Alfred Wegener"
 agassiz.505.g: "Wiedza Geologiczna"
 agassiz.505.h: "Wiedza Oceanograficzna"
 agassiz.505.i: "Rzadkie Minerały"
 agassiz.505.j: "Nowe Talenty."
 agassiz.509.t_fix: "Triumf Fiksizmu"
 agassiz.509.d_fix: "Pomimo wszelkich starań podejmowanych przez [SCOPE.sCharacter('agassiz_alfred_wegener_scope').GetHerHis] [SCOPE.sCharacter('agassiz_alfred_wegener_scope').GetFullName] nie zdołał przekonać większości swoich kolegów, z którymi [SCOPE.sCharacter('agassiz_alfred_wegener_scope').GetHerHis] przyszło dyskutować. Prof. [SCOPE.sCharacter('agassiz_alfred_wegener_scope').GetLastName] zarzuca się, że nie potrafi przedstawić wystarczających dowodów na poparcie swoich tez. Fakt pozostaje niezmienny: kontynenty są stabilne."
 agassiz.509.f_fix: "„Newton teorii dryfu kontynentów jeszcze się nie pojawił. Jego nieobecność nie powinna jednak budzić niepokoju. Teoria ta jest wciąż młoda i nadal często traktowana z podejrzliwością. Ostatecznie trudno winić teoretyka za to, że waha się poświęcić czas i wysiłek na wyjaśnienie prawa, którego słuszność nie jest jeszcze powszechnie uznawana”. – Alfred Wegener"
 agassiz.509.g: "A jednak się porusza."
 agassiz.509.t_tectonics: "Triumf Mobilizmu"
 agassiz.509.d_tectonics: "[SCOPE.sCharacter('agassiz_alfred_wegener_scope').GetFullName] zdołał przekonać środowisko naukowe do swojej tezy, na poparcie której [SCOPE.sCharacter('agassiz_alfred_wegener_scope').GetHerHis] przedstawił przekonujące argumenty. Dryf kontynentów jest obecnie uznawany za najbardziej prawdopodobną teorię wyjaśniającą wiele dotychczas niezrozumiałych zjawisk geologicznych."
 agassiz.509.f_tectonics: "„Naukowcy wciąż zdają się nie rozumieć dostatecznie, że wszystkie nauki o Ziemi muszą dostarczać dowodów pozwalających odkryć, jak wyglądała nasza planeta w dawnych epokach, i że do prawdy można dotrzeć jedynie poprzez połączenie wszystkich tych dowodów. ... Tylko łącząc informacje dostarczane przez wszystkie nauki o Ziemi, możemy mieć nadzieję na ustalenie „prawdy”, czyli stworzenie obrazu, który w możliwie najlepszy sposób łączy wszystkie znane fakty i tym samym cechuje się najwyższym stopniem prawdopodobieństwa. Co więcej, musimy zawsze być przygotowani na to, że każde nowe odkrycie, niezależnie od dziedziny nauki, z której pochodzi, może zmienić wyciągnięte przez nas wnioski”. – Alfred Wegener"
 agassiz.509.h: "Chwileczkę... to zaskakujące!"
 agassiz_conference_geologist_double_vote_tt: "Dzięki naszemu doświadczonemu Geologowi mamy #G dwukrotnie większą#! siłę głosu."
 agassiz_conference_geologist_triple_vote_tt: "Dzięki naszemu słynnemu Geologowi mamy #G trzykrotnie większą#! siłę głosu."
 agassiz.601.t: "Lokalizacja Wulkanu"
 agassiz.601.d: "Grupa naukowców i asystentów zebrała się, aby wziąć udział w nadchodzącej wyprawie wulkanologicznej. Pojawia się jednak pytanie: który wulkan powinien zbadać zespół pod kierownictwem [ROOT.Var('agassiz_geologist_var').GetCharacter.GetFullName]? Do wyboru mamy kilka regionów."
 agassiz.601.f: "„Muszę prosić, aby mówiąc o teorii Dr. Huttona, nie używać słowa „ogień\". Znacznie właściwszym określeniem jest „ciepło\". Ogień w powszechnym rozumieniu tego słowa zakłada obecność paliwa, które ulega spalaniu. Nie mamy jednak żadnych podstaw, by sądzić, że w centrum Ziemi istnieje ogień tego rodzaju”. – Maria Hack"
 agassiz.601.g: "[SCOPE.sState('agassiz_volcano_1').GetName]"
 agassiz.601.h: "[SCOPE.sState('agassiz_volcano_2').GetName]"
 agassiz.601.i: "[SCOPE.sState('agassiz_volcano_3').GetName]"
 agassiz.602.t: "U Stóp Wulkanu"
 agassiz.602.d: "Wyprawa wulkanologiczna dotarła do podnóża wulkanu w regionie [SCOPE.sState('agassiz_volcano_state').GetName] i rozpoczyna właściwe badania naukowe."
 agassiz.602.f: "„Istnienie podziemnego ciepła potwierdzają takie zjawiska jak gorące źródła, wulkany i trzęsienia ziemi. Obserwacje te nie pozostawiają wątpliwości co do istnienia ciepła we wnętrzu Ziemi. Jednak na jakiej głębokości, na jakim obszarze i z jaką intensywnością ono oddziałuje?” – John Playfair"
 agassiz.602.g: "To chyba nie jest tak niebezpieczne, jak się wydaje, prawda?"
 agassiz.603.t: "Udana Wyprawa Wulkanologiczna"
 agassiz.603.d: "[ROOT.Var('agassiz_geologist_var').GetCharacter.GetFullName] dokonał śmiałego wyczynu, nie tylko prowadząc swoich asystentów, za których [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis] odpowiadał, na szczyt wulkanu, lecz także przeprowadzając liczne eksperymenty i zbierając okazy. Wyprawa wulkanologiczna wniosła cenny wkład w lepsze poznanie procesów zachodzących we wnętrzu Ziemi."
 agassiz.603.f: "„Wszystkie dzikie przejawy natury opowiadają tę samą historię: wstrząsy i gwałtowne wybuchy towarzyszące trzęsieniom ziemi, wulkanom i gejzerom, ryczące, grzmiące fale i powodzie, cichy wzrost soków w roślinach, wszelkiego rodzaju burze – każde z tych zjawisk jest uporządkowanym, tworzącym piękno biciem miłującego serca Natury”. – John Muir"
 agassiz.603.g: "I to wszystko bez oparzeń trzeciego stopnia."
 agassiz.604.t: "Wyprawa Wulkanologiczna Kończy się Katastrofą"
 agassiz.604.d: "Straszne wieści! Pomimo licznych sygnałów ostrzegawczych – toksycznych oparów, niewielkich trzęsień ziemi i ciemnego dymu – [ROOT.Var('agassiz_geologist_var').GetCharacter.GetFullName] najwyraźniej uparcie nalegał na kontynuowanie wyprawy. Erupcja całkowicie zaskoczyła uczestników, a cały obszar stał się strefą katastrofy. Lawa wciąż zalewa zbocza wulkanu i okoliczne wioski. Tylko z ogromnym trudem części ocalałych udało się dotrzeć w bezpieczne miejsce, zabierając ze sobą wyniki badań i pobrane próbki. Jednak Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] zaginął. Musimy przygotować się na najgorsze."
 agassiz.604.f: "Gazety donoszą już o licznych rannych i ofiarach śmiertelnych. Konieczna była ewakuacja znacznej części okolicznych terenów. Budynki zostały uszkodzone, a ulice zalane lawą. Szanse na to, że ktokolwiek znajdujący się w pobliżu krateru wulkanu przeżył starcie z tą potęgą natury, są bliskie zeru."
 agassiz.604.g: "Okropne!"
 agassiz.605.t: "Wyprawa Wulkanologiczna kończy się Bez Rezultatów"
 agassiz.605.d: "Wyprawa wulkanologiczna wyczerpała wszystkie fundusze przeznaczone na badania i powróciła. Niestety, przyniosła jedynie kilka przydatnych wyników. Być może kierujący nią Geolog był zbyt ostrożny?"
 agassiz.605.f: "„Nie sposób zbadać wulkanu, nie zatańczywszy na nim choć odrobinę.\""
 agassiz.605.g: "Rozczarowujące"
 agassiz.611.t: "Odkrycia Chemiczne"
 agassiz.611.d: "Podczas wyprawy w regionie [SCOPE.sState('agassiz_volcano_state').GetName] [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] zdołał dokładniej zbadać kilka interesujących procesów chemicznych zachodzących w kraterze wulkanu. Niektóre związki mineralne pozostają wciąż całkowicie nieznane."
 agassiz.611.f: "Większość pierwiastków chemicznych występuje w postaci związków chemicznych, które cechują się ogromną różnorodnością, zwłaszcza wśród minerałów. W początkowym okresie rozwoju nowoczesnej chemii geolodzy nieustannie poszukiwali nowych próbek, z których chemicy mogliby wyizolować nieznane dotąd pierwiastki."
 agassiz.611.g: "To może pomóc Dr. [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName]."
 agassiz.612.t: "Pułapka Lawowa"
 agassiz.612.d: "Wyprawa wulkanologiczna najwyraźniej posunęła się nieco zbyt śmiało w kierunku krateru: uczestnicy znaleźli się niemal ze wszystkich stron otoczeni przez lawę. Wycofanie się z dotychczasowej trasy oznaczałoby ogromną stratę czasu."
 agassiz.612.f: "„Sama lawa ma ponury wygląd, jaki poeci przypisują rzekom krainy piekieł. Płynie powoli niczym strumień piasku, za dnia czarniawa, nocą zaś czerwona. Gdy się zbliża, słychać osobliwy trzask, który budzi największą trwogę właśnie dlatego, że trudno rozpoznać jego źródło. Jej blask jest tak intensywny, że po raz pierwszy to ziemia rozświetla niebo, sprawiając, że wygląda ono, jakby nieustannie rozbłyskiwały na nim błyskawice. Niebo z kolei odbija tę łunę na powierzchni wody i w ten sposób natura zdaje się stawać w płomieniach, potęgowanych przez ten trojaki obraz ognia”. – Germaine de Staël"
 agassiz.612.g: "Znajdź inną drogę."
 agassiz.612.h: "Spróbuj ją przekroczyć."
 agassiz.613.t: "Zahartowany Przywódca"
 agassiz.613.d: "[ROOT.Var('agassiz_geologist_var').GetCharacter.GetFullName] jest doświadczonym wulkanologiem, który doskonale wie, jak radzić sobie w trudnych warunkach panujących na wulkanie. Dzięki wiedzy, którą [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis] posiada, wyprawa przebiega sprawnie i bezpiecznie."
 agassiz.613.f: "„Wydarzenie, którego tak bardzo pragnąłem być świadkiem, wreszcie nastąpiło. Wezuwiusz od kilku dni znajduje się w stanie erupcji. Przeprowadziłem już wiele eksperymentów na lawie w chwili, gdy wydobywa się ona z wulkanu, i zdołałbym je ukończyć, gdyby nie poważne niedomaganie spowodowane zbyt długim przebywaniem w tym wspaniałym, lecz niebezpiecznym miejscu, zaledwie pięć lub sześć stóp od strumienia rozżarzonej materii, płynnej niczym woda i spadającej kaskadą ognia”. – Humphry Davy"
 agassiz.613.g: "Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] jest znakomitym przywódcą."
 agassiz.614.t: "Toksyczne Gazy"
 agassiz.614.d: "Zespół wyprawy pod kierownictwem Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] odkrył w jednym z miejsc na wulkanie obfite emisje gazów wulkanicznych. Geolog chciałby pobrać kilka próbek, choć nie jest to całkowicie bezpieczne."
 agassiz.614.f: "Gazy wulkaniczne to gazy wydobywające się na powierzchnię Ziemi podczas aktywności wulkanicznej. Mogą wydostawać się zarówno w ściśle określonych miejscach, jak i w sposób rozproszony na rozległych obszarach zboczy wulkanu. Już w 1790 roku Scipione Breislak zbierał i analizował gazy wulkaniczne we Włoszech. Skład gazów wulkanicznych zależy od przemieszczania się magmy wewnątrz wulkanu. Dlatego nagłe zmiany ich składu często zwiastują zmianę aktywności wulkanicznej."
 agassiz.614.g: "Musimy zbadać te gazy."
 agassiz.614.h: "To szaleństwo!"
 agassiz.615.t: "Materiał Piroklastyczny"
 agassiz.615.d: "Nagły huk na chwilę przeraził uczestników wyprawy wulkanologicznej. Gdy zespół uznał, że najgorsze już minęło, wulkan niespodziewanie wyrzucił rozżarzone odłamki skalne, które spadły na uczestników niczym deszcz meteorytów. Dwóch asystentów zostało rannych, a jeden muł juczny zginął."
 agassiz.615.f: "„Nad naszymi głowami i nad całą wyspą rozległ się dziwny odgłos, przypominający potężny trzask płomieni lub wystrzały ciężkiej artylerii, następujące co jedną lub dwie sekundy. O piątej huk nie ustawał, niebo spowiła ciemność, a na nas spadł grad pumeksu, którego wiele odłamków miało znaczne rozmiary i było jeszcze wyraźnie ciepłych”. – Kapitan Watson"
 agassiz.615.g: "Niefortunny obrót wydarzeń."
 agassiz.616.t: "Próbka Lawy"
 agassiz.616.d: "Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] zarządził krótki postój wyprawy. W pobliżu znajduje się miejsce, które wydaje się odpowiednie do pobrania próbek lawy. To przedsięwzięcie cenne z naukowego punktu widzenia, ale wiążące się z dużym ryzykiem."
 agassiz.616.f: "„Lawa była uwięziona między wysokimi brzegami szerokiego koryta i spływała w dół, nie przypominając cieczy, lecz raczej górę koksu, a chwilami silnie odgazowujący węgiel. Pękała, trzeszczała, iskrzyła, dymiła i buchała płomieniami, nieustannie posuwając się naprzód jako jedna ogromna, zwarta masa. Odrywające się od niej fragmenty staczały się w dół, odsłaniając blask tak oślepiający, że mogłem wyobrazić sobie, iż stoję u wylotu pieca hutniczego. A gdy każda kolejna bryła spadała z hukiem przypominającym grzmot, drzewa stawały w płomieniach, a zgromadzone tłumy wznosiły okrzyki podziwu i ubolewania”. – Luigi Palmieri"
 agassiz.616.g: "Właśnie po to tu jesteśmy, by przeprowadzać takie eksperymenty."
 agassiz.617.t: "Próbka Lawy – Sukces!"
 agassiz.617.d: "Naszemu Geologowi udało się pobrać próbkę lawy podczas ryzykownego przedsięwzięcia. Uzyskany materiał ma niezwykle wysoką wartość naukową."
 agassiz.617.f: ""
 agassiz.617.g: "Gorąca Nauka!"
 agassiz.618.t: "Próbka Lawy – Niepowodzenie!"
 agassiz.618.d: "Ku przerażeniu pozostałych uczestników wyprawy próba pobrania próbki zakończyła się niepowodzeniem. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetFullName] doznał poważnych oparzeń i naraził cały zespół na niebezpieczeństwo!"
 agassiz.618.f: ""
 agassiz.618.g: "Nauka, która potrafi poparzyć ręce..."
 agassiz.619.t: "Kryształy"
 agassiz.619.d: "Wyjątkowe procesy geologiczne zachodzące na obszarze wulkanicznym doprowadziły do powstania całej gamy rzadkich minerałów o budowie krystalicznej. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetFullName] nie może się doczekać, aż wzbogaci kolekcję, którą [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis] posiada, o te okazy..."
 agassiz.619.f: "Większość skał wulkanicznych zawiera szereg wspólnych minerałów. W procesie różnicowania się skał wulkanicznych zawartość krzemionki (SiO2) zazwyczaj wzrasta, głównie w wyniku krystalizacji frakcyjnej. Dlatego bardziej rozwinięte skały wulkaniczne są zwykle bogatsze w minerały o większej zawartości krzemionki, takie jak krzemiany warstwowe i przestrzenne, w tym skalenie, odmiany polimorficzne kwarcu oraz muskowit. Z kolei bardziej pierwotne skały wulkaniczne, choć również zdominowane przez krzemiany, zawierają zespoły minerałów o mniejszej zawartości krzemionki, takich jak oliwin i pirokseny. Szereg reakcyjny Bowena prawidłowo przewiduje kolejność powstawania najczęściej występujących minerałów w skałach wulkanicznych. Zdarza się, że magma przechwytuje kryształy, które wykrystalizowały z innej magmy. Kryształy te nazywane są ksenokryształami. Diamenty występujące w kimberlitach są rzadkimi, lecz dobrze znanymi przykładami ksenokryształów. Kimberlity nie tworzą diamentów, lecz przechwytują je i transportują na powierzchnię Ziemi."
 agassiz.619.g: "Jedna próbka wystarczy."
 agassiz.619.h: "Pobierz jak najwięcej próbek!"
 agassiz.619.i: "Kilka kamieni nie jest warte życia naukowca."
 agassiz.620.t: "Rzeka Ognia"
 agassiz.620.d: "Rzeka lawy blokuje drogę zespołowi. Podczas gdy część uczestników uważa tę przeszkodę za niebezpieczne wyzwanie, które może zagrozić całej wyprawie wulkanologicznej, [ROOT.Var('agassiz_geologist_var').GetCharacter.GetFullName] dostrzega w tej sytuacji przede wszystkim okazję do przeprowadzenia eksperymentów naukowych i wypróbowania przyrządów, z których [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis] nie miał jeszcze okazji skorzystać..."
 agassiz.620.f: "„W większości przypadków wyraźnie widać, że światło pochodzi od rozżarzonych, lecz niepłonących ciał. To właśnie blask rozżarzonej lawy tworzy ogromną kolumnę pozornych płomieni, wznoszącą się nad Wezuwiuszem”. – John Philipps"
 agassiz.620.g: "Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] powinien zbadać tę rzekę lawy."
 agassiz.620.h: "To zdecydowanie zbyt niebezpieczne!"
 agassiz.621.t: "Teorie Wulkanizmu"
 agassiz.621.d: "Podczas [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis] pobytu na wulkanie [ROOT.Var('agassiz_geologist_var').GetCharacter.GetFullName] pragnie wreszcie zweryfikować niektóre z [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis] wcześniejszych teorii dotyczących wulkanizmu, zbierając dowody i badając okolicę. W tym celu [ROOT.Var('agassiz_geologist_var').GetCharacter.GetSheHe] potrzebuje mnóstwo czasu na obszarze, który [ROOT.Var('agassiz_geologist_var').GetCharacter.GetSheHe] nazywa „niezwykle fascynującym i inspirującym miejscem”, podczas gdy [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis] koledzy zgrzytają zębami, obserwując, jak w tle unoszą się coraz gęstsze kłęby ciemnego dymu..."
 agassiz.621.f: "„W kulminacyjnym momencie erupcji kolumna popiołu wzniosła się wysoko, przybierając kształt ogromnej sosny, aż w końcu zaczęła się pochylać ku ziemi. Pod ciężarem gęstej materii, z której się składała, runęła na ziemię. Wówczas ze zboczy góry zaczęły spływać potoki rozżarzonej lawy o przerażających rozmiarach, zwiastujące nieuchronną katastrofę”. – Mariana Starke"
 agassiz.621.g: "Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] powinien poświęcić czas na dokładne zbadanie tego zjawiska."
 agassiz.621.h: "Nie trać czasu!"
 agassiz.622.t: "Trzęsienie Ziemi"
 agassiz.622.d: "Wczesnym rankiem, gdy wyprawa znajdowała się bardzo blisko krateru, doszło do wstrząsu sejsmicznego, któremu towarzyszyły spadające odłamki skalne i osuwisko błotne. To niewielkie trzęsienie ziemi wyraźnie wskazuje, że wulkan jest znacznie bardziej aktywny, niż uczestnicy wyprawy dotychczas przypuszczali."
 agassiz.622.f: "„W innym miejscu ten uczony geograf, nawiązując do przekazu, według którego Sycylia została oddzielona od Italii wskutek gwałtownych wstrząsów, zauważa, że obecnie tereny nadmorskie w tych okolicach rzadko nawiedzają trzęsienia ziemi, ponieważ istnieją tam otwarte ujścia, przez które wydostają się ogień, rozżarzona materia i woda. Dawniej jednak, gdy wulkany Etny, Wysp Liparyjskich, Ischii i innych miejsc pozostawały zamknięte, uwięzione pod ziemią ogień i gazy mogły wywoływać znacznie gwałtowniejsze wstrząsy. Pogląd, że wulkany pełnią funkcję zaworów bezpieczeństwa, a podziemne wstrząsy są prawdopodobnie najgwałtowniejsze wtedy, gdy aktywność wulkaniczna po raz pierwszy przenosi się w nowe miejsce, nie jest zatem niczym nowym”. – Charles Lyell"
 agassiz.622.g: "Czy ta cała wyprawa na pewno była dobrym pomysłem...?"
 agassiz.623.t: "Wszędzie Minerały"
 agassiz.623.d: "Wyprawa pod kierownictwem [ROOT.Var('agassiz_geologist_var').GetCharacter.GetFullName], prowadząca badania wulkanu w regionie [SCOPE.sState('agassiz_volcano_state').GetName], natrafiła na bogate złoże minerałów."
 agassiz.623.f: "Minerały są najlepszym przyjacielem Geologa."
 agassiz.623.g: "Minerały!"
 agassiz.623.h: "Nie"
 agassiz.624.t: "Egzotyczny Okaz"
 agassiz.624.d: "Może się to wydawać zaskakujące, ale podczas wyprawy wulkanologicznej w regionie [SCOPE.sState('agassiz_volcano_state').GetName] rzeczywiście odkryto rzadkie okazy zwierząt należących do wyjątkowej fauny zamieszkującej tereny w bezpośrednim sąsiedztwie wulkanu. Niektóre z tych okazów z pewnością wzbudziłyby ogromne zainteresowanie miejscowych zoologów."
 agassiz.624.f: "„Humphrey! Zbierz, proszę, kilka jaj wulkanicznych papużek karłowatych. Śniadanie było skromne, a mnie marzy się niedzielne jajko sadzone”."
 agassiz.624.g: "Okaz!"
 agassiz.625.t: "Nieznane Skamieliny"
 agassiz.625.d: "Niektóre rzadkie skamieliny, które [ROOT.Var('agassiz_geologist_var').GetCharacter.GetFullName] odkrył podczas wyprawy wulkanologicznej w regionie [SCOPE.sState('agassiz_volcano_state').GetName], mogą pomóc w znalezieniu odpowiedzi na ważne pytania z zakresu paleontologii i geologii."
 agassiz.625.f: "„Jeśli obejdziemy żyzne tereny u podnóża Etny od południa i wschodu, ujrzymy warstwy morskich osadów ilastych i piaszczystych oraz tufów wulkanicznych, wyłaniające się spod współczesnych potoków lawy. Skamieniałe muszle organizmów morskich występujące w tych warstwach są w całości lub niemal w całości identyczne z muszlami gatunków zamieszkujących obecnie Morze Śródziemne. Ponieważ w pobliżu Katanii znajdują się one na wysokości od 600 do 800 stóp nad poziomem morza, stanowią wyraźny dowód na to, że w tym regionie, podobnie jak w innych częściach Sycylii położonych dalej na południe, doszło do wypiętrzenia dawnego dna morskiego. Można zatem słusznie wnioskować, że cała góra, z wyjątkiem jej części powstałych stosunkowo niedawno, również uległa temu wypiętrzeniu”. – Charles Lyell"
 agassiz.625.g: "Skamieliny!"
 agassiz.626.t: "Dane Geomagnetyczne"
 agassiz.626.d: "Dziś rano uczestnicy wyprawy wulkanologicznej w regionie [SCOPE.sState('agassiz_volcano_state').GetName] otrzymali telegram ze stolicy. Obserwatorium Geomagnetyczne poprosiło o zebranie danych dotyczących krateru wulkanu. Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] spełnił tę prośbę."
 agassiz.626.f: "„Skoro te dane są tak ważne dla Instytutu Geomagnetycznego, to dlaczego sami tu nie przyjedziecie, żeby je zebrać?”"
 agassiz.626.g: "Doskonale"
 agassiz.627.t: "Słoneczny Pierwiastek na Ziemi"
 agassiz.627.d: "Podczas analizy niektórych wcześniej pomijanych skał [ROOT.Var('agassiz_geologist_var').GetCharacter.GetFullName] dokonał zdumiewającego odkrycia. Dzięki przeprowadzonej na miejscu analizie widmowej [ROOT.Var('agassiz_geologist_var').GetCharacter.GetSheHe] zdołał udowodnić, że skały wulkaniczne zawierają hel – pierwiastek, który dotychczas uważano za występujący wyłącznie w przestrzeni kosmicznej."
 agassiz.627.f: "Luigi Palmieri był włoskim fizykiem, meteorologiem, sejsmologiem i wulkanologiem. W 1845 roku przejął po Pasquale Galluppim stanowisko wykładowcy logiki i metafizyki na Uniwersytecie Neapolitańskim. Po śmierci Galluppiego w 1847 roku powierzono mu kierownictwo tej katedry. W 1860 roku zrezygnował z niej, obejmując kierownictwo utworzonej z jego inicjatywy katedry geofizyki i meteorologii. Z katedrą związane były obserwatorium meteorologiczne oraz założone w 1842 roku Obserwatorium Wezuwiusza, którego kierownictwo również objął Palmieri. Kierował katedrą i oboma obserwatoriami aż do śmierci. Palmieri zasłynął przede wszystkim z udoskonalania przyrządów pomiarowych, takich jak sejsmograf elektromagnetyczny oraz urządzenia do pomiaru napięcia elektrycznego w atmosferze. W 1882 roku jako pierwszy zdołał wykryć hel na Ziemi dzięki analizie widmowej lawy Wezuwiusza."
 agassiz.627.g: "To otwiera... interesujące możliwości."
 agassiz.628.t: "Zespół błaga o odpoczynek"
 agassiz.628.d: "Po ponad roku trwania wyprawy wulkanologicznej członkowie zespołu coraz częściej domagają się przerw na odpoczynek. Wielu z nich jest na skraju wyczerpania. Zaczynają pojawiać się pierwsze stanowcze głosy wzywające do powrotu do domu."
 agassiz.628.f: "„Boisz się? Z całym szacunkiem, ale to właśnie dla takich zjawisk sejsmicznych wspinamy się na ten wulkan! Jesteś naukowcem czy dezerterem?”"
 agassiz.628.g: "Pozwól im odpoczywać tak długo, jak tego potrzebują."
 agassiz.628.h: "Krótka przerwa, nic więcej."
 agassiz.628.i: "Ci bezużyteczni asystenci mają pracować, a nie się obijać!"
 agassiz.629.t: "Piekło"
 agassiz.629.d: "Sytuacja na wulkanie w regionie [SCOPE.sState('agassiz_volcano_state').GetName] znacznie się pogorszyła. Wulkan nagle zaczął wyrzucać kłęby czarnego dymu, a strumienie lawy zdają się przybierać na sile. Wyprawa znalazła się teraz w trudnym położeniu. Czy jej uczestnicy powinni zachować ostrożność, ryzykując uwięzienie przez lawę, czy też działać szybko, narażając się na nieznane niebezpieczeństwa?"
 agassiz.629.f: "„Ognisty podmuch uderzył w miasto i nabrzeże z siłą wystrzału armatniego. Rozżarzone drobiny popiołu uderzały nas w twarze, powodując dotkliwe pieczenie. Powietrze wypełniły płomienie. Odruchowo unieśliśmy ręce, aby osłonić twarze. Ten sam gest zauważyłem później, gdy ujrzałem na brzegu ciała ofiar”. – Hrabia de Fitz-James"
 agassiz.629.g: "Zachowaj ostrożność."
 agassiz.629.h: "Podejmij ryzyko."
 agassiz.630.t: "Piekło na Ziemi"
 agassiz.630.d: "Wygląda na to, że na wulkanie w regionie [SCOPE.sState('agassiz_volcano_state').GetName] rozpętało się prawdziwe piekło. Fontanny lawy wystrzeliwują w górę, a rozszalałe żywioły ścierają się ze sobą w strumieniach ognia. Dla większości uczestników wyprawy jest to przerażające widowisko. Jedynie Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] nie potrafi oprzeć się zachwytowi i fascynacji."
 agassiz.630.f: "„Nocą ogniste widowisko stało się jeszcze piękniejsze. Otaczały nas strumienie i kaskady czerwonego, promieniującego blaskiem ognia. Pośród nich, z kolumny smolistego dymu wzbijającego się w powietrze, spadały ogromne bryły skalne, rozżarzone do białości od niezwykle wysokiej temperatury, pozostawiając za sobą wspaniale rozświetlone smugi pary”. – George Gordon Byron"
 agassiz.630.g: "To fascynujące widowisko i powinniśmy zrobić jego zdjęcia!"
 agassiz.630.h: "Przerażające,"
 agassiz.630.i: "Wycofaj się!"
 agassiz.631.t: "Dość Aktywny Wulkan"
 agassiz.631.d: "Najwyraźniej wulkan, który bada Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName], jest znacznie bardziej aktywny, niż się spodziewano. Prawdopodobnie wkrótce dojdzie do erupcji. To sprawia, że wyprawa staje się bardziej niebezpieczna. Jednak wraz ze wzrostem ryzyka pojawiają się również większe możliwości prowadzenia badań naukowych..."
 agassiz.631.f: "„Ludzie nigdy nie wierzą w zagrożenie ze strony wulkanów, dopóki lawa ich nie dosięgnie”. – George Santayana"
 agassiz.631.g: "Więcej wiedzy!"
 agassiz.631.h: "Więcej doświadczenia!"
 agassiz.631.i: "Więcej minerałów!"
 agassiz.632.t: "Doniesienie Prasowe"
 agassiz.632.d: "#YELLOW [SCOPE.sState('manzoni_publisher_state').GetNameNoFormatting] Chronicle#!, jedna z czołowych gazet regionu, na bieżąco informuje swoich czytelników o przebiegu wyprawy wulkanologicznej. Dzięki temu ta niszowa dziedzina nauki wzbudziła zainteresowanie szerszej części społeczeństwa. Szczególnie chłopcy i młodzi mężczyźni są zafascynowani pełnymi przygód opowieściami."
 agassiz.632.f: "„Przeczytaj w najnowszym numerze: Brawurowa wspinaczka na krater Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastNameNoFormatting]! Odważni naukowcy stają twarzą w twarz z lawą, toksycznymi oparami i piekielnym żarem. Człowiek przekracza kolejną granicę na skraju miejsca, które starożytni uważali za wejście do świata podziemnego. Nasi reporterzy nadal towarzyszą wyprawie, przygotowując ilustracje. Czwartek to dzień Chronicle!”"
 agassiz.632.g: "To zainspiruje nowe pokolenie naukowców."
 agassiz.633.t: "Bezpieczne Miejsce Odpoczynku"
 agassiz.633.d: "Uczestnicy wyprawy znaleźli bezpieczne schronienie pośród siarkowych oparów, czarnego dymu i strumieni lawy."
 agassiz.633.f: "„Mój drogi kolego, profesorze Schabernack!\n\nDziękuję Ci za Twoje pouczające spostrzeżenia dotyczące dynamicznego rozwoju wody w próżni wulkanicznej, jednak swoje zastrzeżenia przedstawię bardziej szczegółowo w późniejszym terminie. Chodzi mi jednak przede wszystkim o to, że z korespondencji z Dr. Dr. Sauerspeckiem dowiedziałem się, iż rozpowszechniasz na uniwersytecie haniebną plotkę, jakobyśmy bawili się na tym wulkanie. Żądam, abyś zaprzestał wysuwania takich bezpodstawnych przypuszczeń. Odkryte przeze mnie niedawno Gorące Źródła [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastNameNoFormatting] osiągają maksymalną temperaturę zaledwie 32°C, a nie 35°C, jak ostatnio twierdziłeś. Są więc de facto lodowato zimne. Proszę, abyś sprostował te skandaliczne przekłamania!”"
 agassiz.633.g: "Relaks!"
 agassiz_volcano_tourist_modifier: "Turystyka Wulkaniczna"
 agassiz_small_volcano_eruption_modifier: "Niewielka Erupcja Wulkanu"
 agassiz_medium_volcano_eruption_modifier: "Erupcja Wulkanu"
 agassiz_big_volcano_eruption_modifier: "Potężna Erupcja Wulkanu"
 agassiz_medium_earthquake_modifier: "Trzęsienie Ziemi"
 agassiz_big_earthquake_modifier: "Potężne Trzęsienie Ziemi"
 agassiz.711.t: "Wulkaniczne Widowisko"
 agassiz.711.d: "Mieszkańcy [SCOPE.sState('agassiz_volcano_state').GetName] są obecnie świadkami imponującego widowiska: fontanny lawy tego wulkanu stanowią fascynujący widok, szczególnie nocą. Wśród obserwatorów można dostrzec turystów i naukowców."
 agassiz.711.f: "„Najwznioślejszy z wulkanów! Płomień Etny\nBlednie przy twoim, a niegasnący ogień Hekli zdaje się łagodny;\nWezuwiusz ukazuje swój żar, widok już pospolity\nDla gapiów wśród turystów, ze swych nazbyt dobrze znanych wyżyn”.\n\n– Lord Byron"
 agassiz.711.g: "Wspaniale!"
 agassiz.712.t: "Niewielka Erupcja Wulkanu"
 agassiz.712.d: "Wulkan w regionie [SCOPE.sState('agassiz_volcano_state').GetName] wybuchł. Kilka mniejszych wiosek zostało zniszczonych, a pola zalane lawą, jednak skala katastrofy była ograniczona."
 agassiz.712.f: "„Cóż ja wtedy zobaczyłam! Tysiące języków ognia rozświetlały okolicę. Na wierzchołkach drzew dostrzegłam płomienie. Usłyszałam trzask i ujrzałam tuż obok siebie ścianę ognia. Morza nie było już widać. Wszystko pokrywał popiół. Nie widziałam nawet własnej dłoni przed oczami. Ostatnią rzeczą, jaką zobaczyłam, był popiół tryskający niczym fontanna przez szczeliny między deskami podłogi. Poczułam potężny napór, który powalił mnie na ziemię. Potem miałam wrażenie, jakby powietrze zostało wyssane, i nie mogłam oddychać”. – Johanna Beyerinck"
 agassiz.712.f_basic: "\n\n#YELLOW Dzięki naszym naukowcom z Obserwatorium Wulkanologicznego katastrofa nie zaskoczyła nas całkowicie. Mogliśmy więc podjąć środki ostrożności i #G nieco ograniczyć skalę zniszczeń#!.#!"
 agassiz.712.f_advanced: "\n\n#YELLOW Dzięki naszym znakomitym naukowcom z Obserwatorium Wulkanologicznego mogliśmy szybko rozpocząć ewakuację i podjąć działania ochronne. Udało nam się #G znacznie ograniczyć skalę zniszczeń#!."
 agassiz.712.g: "To tylko trochę lawy."
 agassiz.712.h: "Jakieś wieści z obserwatorium?"
 agassiz.712.i: "To może zainteresować Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] oraz studentów, których [ROOT.Var('agassiz_geologist_var').GetCharacter.GetHerHis] naucza."
 agassiz.713.t: "Erupcja Wulkanu"
 agassiz.713.d: "Gwałtowna erupcja wstrząsnęła regionem [SCOPE.sState('agassiz_volcano_state').GetName]. Odłamki materiału piroklastycznego i popiół wulkaniczny zniszczyły budynki oraz uprawy, pozbawiając życia część naszych mieszkańców."
 agassiz.713.f: "'We heard above us and about the island a strange sound, as a mighty crackling fire, or the discharge of heavy artillery at one or two second intervals. At five, the roaring noise continued, darkness spread over the sky and a hail of pumice stone fell on us, or which many pieces were of considerable size and quite warm.\n\nThat night was one of blackness - from the continuing fall of ash - broken by incessant flashes of lightning, both in the sky, and around the island.' -Captain Watson"
 agassiz.713.g: "Ci biedni ludzie."
 agassiz.713.j: "Wyślij jak najwięcej pomocy, aby wesprzeć poszkodowanych!"
 agassiz.714.t: "Potężna Erupcja Wulkanu"
 agassiz.714.d: "Erupcja o niespotykanej dotąd sile zrujnowała życie wielu mieszkańców regionu [SCOPE.sState('agassiz_volcano_state').GetName]. Huk eksplozji słychać było z odległości setek mil, a wszystko, co miało nieszczęście znajdować się w pobliżu wulkanu, zostało natychmiast zniszczone."
 agassiz.714.f: "„Słychać było przeraźliwe krzyki kobiet, płacz niemowląt i wołania mężczyzn. Jedni nawoływali rodziców, inni dzieci lub żony, próbując rozpoznać ich po głosach. Ludzie opłakiwali własny los lub los swoich bliskich, a niektórzy, tak bardzo przerażeni perspektywą śmierci, wręcz pragnęli umrzeć. Wielu błagało bogów o pomoc, lecz jeszcze więcej osób było przekonanych, że bogowie przestali istnieć, a cały wszechświat na zawsze pogrążył się w wiecznej ciemności”. – Pliniusz Młodszy"
 agassiz.714.g: "Tragedia!"
 agassiz.715.t: "Dym i Huk"
 agassiz.715.d: "Wulkan w regionie [SCOPE.sState('agassiz_volcano_state').GetName] dudni. Nad kraterem unosi się dym. I to wszystko. Mieszkańcy odetchnęli z ulgą, a turyści i naukowcy są rozczarowani."
 agassiz.715.f: "„Zbyt wiele do zbadania, zbyt mało do podziwiania. Co za paskudny, kapryśny wulkan!\""
 agassiz.715.g: "Obudzi się czy pozostanie uśpiony?"
 agassiz.721.t: "Fale Sejsmiczne"
 agassiz.721.d: "Drobne wstrząsy sejsmiczne wyrwały dziś rano mieszkańców regionu [SCOPE.sState('agassiz_earthquake_state').GetName] ze snu. Niewielkie trzęsienie ziemi spowodowało jedynie nieznaczne szkody, ale wzbudziło zainteresowanie sejsmologów."
 agassiz.721.f: "„Dziennikarz: Gdyby budynek, w którym się teraz znajdujemy, zaczął się trząść, a pan wiedziałby, że właśnie następuje trzęsienie ziemi, co by pan zrobił?”\nCharles Richter: „Poszedłbym – nie pobiegł – do najbliższego sejsmografu”."
 agassiz.721.g: "Interesujące."
 agassiz.722.t: "Trzęsienie Ziemi w Regionie [SCOPE.sState('agassiz_earthquake_state').GetName]"
 agassiz.722.d: "Trzęsienie ziemi nawiedziło region [SCOPE.sState('agassiz_earthquake_state').GetName], niszcząc budynki, powodując obrażenia wśród mieszkańców, a nawet pochłaniając ofiary śmiertelne."
 agassiz.722.f: "„Rozległ się głęboki, przerażający huk, a potem zobaczyłem, jak wstrząsy przemieszczają się wzdłuż ulicy Washington. Cała ulica falowała. Wyglądało to tak, jakby zbliżały się do mnie fale oceanu, piętrząc się jedna za drugą”. – Jesse Cook"
 agassiz.722.f_basic: "\n\n#YELLOW Dzięki naszym wyszkolonym sejsmologom wiedzieliśmy już, że region [SCOPE.sState('agassiz_earthquake_state').GetName] jest narażony na trzęsienia ziemi. Dzięki środkom zapobiegawczym, zastosowanym na przykład w budownictwie, udało się znacznie ograniczyć szkody.#!"
 agassiz.722.g: "Tragedia!"
 agassiz.722.h: "Jak obserwatorium ocenia sytuację?"
 agassiz.722.i: "Idealne miejsce do badań geologicznych."
 agassiz.722.j: "Wyślij jak najwięcej pomocy, aby wesprzeć poszkodowanych!"
 agassiz.723.t: "Wielkie Trzęsienie Ziemi w Regionie [SCOPE.sState('agassiz_earthquake_state').GetName]"
 agassiz.723.d: "Region [SCOPE.sState('agassiz_earthquake_state').GetName] został obrócony w ruinę przez trzęsienie ziemi o niespotykanej dotąd skali. Niezliczone budynki zostały zniszczone, a liczba ofiar śmiertelnych jest niemożliwa do oszacowania."
 agassiz.723.f: "„Trzęsienie ziemi zniszczyło w San Francisco mury i kominy o wartości setek tysięcy dolarów. Jednak pożar, który po nim nastąpił, strawił majątek wart setki milionów dolarów. Rzeczywistych strat nie sposób oszacować nawet z dokładnością do setek milionów. Nigdy dotąd w historii żadne nowoczesne miasto o tak wielkim znaczeniu nie zostało tak doszczętnie zniszczone. San Francisco przestało istnieć. Pozostały po nim jedynie wspomnienia i pas domów mieszkalnych na obrzeżach. Dzielnica przemysłowa została zmieciona z powierzchni ziemi. Dzielnica handlowa została zmieciona z powierzchni ziemi. Dzielnice reprezentacyjne i mieszkalne zostały zmiecione z powierzchni ziemi. Fabryki i magazyny, wielkie sklepy i siedziby gazet, hotele i pałace bogaczy – wszystko przepadło. Ocalał jedynie pas domów mieszkalnych na obrzeżach tego, co niegdyś było San Francisco”. – Jack London"
