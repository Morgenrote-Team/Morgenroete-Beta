 agassiz.812.t: "Nowy Najwyższy Szczyt?"
 agassiz.812.d: "Przez lata Dhaulagiri uznawano za najwyższą zmierzoną dotychczas górę, jednak [ROOT.Var('agassiz_geologist_var').GetCharacter.GetFullName] nie był do tego przekonany. Po miesiącach pomiarów triangulacyjnych i nieustannych obliczeń z mgły wyłonił się nowy kandydat do tego miana: Kanczendzonga."
 agassiz.812.f: "Przyrządy Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName], choć mocno nadwyrężone przez burze, nie pozostawiały większych wątpliwości. Ten odległy szczyt na granicy Sikkimu i Nepalu, wznoszący się na wysokość ponad 28 000 stóp, przewyższał wszystkie dotychczasowe rekordy. Odkrycie to miało ogromne znaczenie dla geografii, kartografii i dumy narodowej."
 agassiz.812.g: "Czy ta góra nie mogła mieć prostszej nazwy?"
 agassiz.812.tt: "#V Kanczendzonga#! jest obecnie uznawana za najwyższą górę świata."
 agassiz.813.t: "Król Szczytu"
 agassiz.813.d: "It began with silent figures on a hilltop in Bengal, leveling brass instruments against the sky. Among them was [ROOT.Var('agassiz_geologist_var').GetCharacter.GetFullName], whose calculations confirmed the impossible: Peak XV - obscure, remote, unnamed - stood higher than any summit ever measured."
 agassiz.813.f: "Ogłoszenie tego odkrycia wywołało prawdziwe poruszenie w środowisku naukowym. Ten himalajski olbrzym, wznoszący się na wysokość 29 000 stóp, znacznie przewyższał Kanczendzongę i Dhaulagiri. Choć wciąż pozostawał bezimienny, uczeni zaczęli już nazywać go „Dachem Świata”."
 agassiz.813.g: "Nazwij to na cześć jakiegoś przypadkowego brytyjskiego geodety, którego nikt nie pamięta!"
 agassiz.813.tt: "#V Mount Everest#! jest obecnie uznawany za najwyższą górę świata."
