 agassiz.11.g: "Czy możemy nazwać [GetPlayer.MakeScope.Var('agassiz_geologist_var').GetCharacter.GetHerHim] twórcą sejsmologii?"
 agassiz.301.d: "Dr. [GetPlayer.MakeScope.Var('agassiz_geologist_var').GetCharacter.GetLastName] zakończył pięcioletnie badania nad niezwykle nudnymi formacjami skalnymi i przygnębiająco wyglądającymi pagórkowatymi krajobrazami. Teraz, gdy [GetPlayer.MakeScope.Var('agassiz_geologist_var').GetCharacter.GetHerHis] obowiązki badawcze dobiegły końca, może spokojnie powrócić na uniwersytet, aby w wolnym czasie, którym [GetPlayer.MakeScope.Var('agassiz_geologist_var').GetCharacter.GetHerHis] dysponuje, dręczyć tamtejszych studentów równie fascynującymi wykładami."
 agassiz.316.t: "Badania Geologiczne w sąsiednim kraju"
 agassiz.316.d: "[GetPlayer.MakeScope.Var('agassiz_geologist_var').GetCharacter.GetFullName] nie traktował zbyt rygorystycznie wyznaczonego obszaru badań i poszukiwał formacji geologicznych oraz jaskiń w sąsiednim kraju, wykraczając poza teren, na którym [GetPlayer.MakeScope.Var('agassiz_geologist_var').GetCharacter.GetHerHis] miał prowadzić badania. Oczywiście uzyskane wyniki badań geologicznych zachowujemy dla siebie."
 agassiz.316.g: "Jak [GetPlayer.MakeScope.Var('agassiz_geologist_var').GetCharacter.GetSheHe] zdołał się tam niepostrzeżenie zakraść?"
 je_agassiz_find_oil_project_reason: "Twój [concept_agassiz_geologist] Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] gorączkowo poszukuje złóż ropy naftowej w [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] w regionie [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName].\n$mr_divider_for_je$\nProjekt będzie co miesiąc zyskiwał punkty postępu. Gdy postęp osiągnie #V 24 Punkty#!, budynek otrzyma nowy [concept_modifier] $agassiz_building_has_production_modifier_2_tt$.\n$mr_divider_for_je$\nObecny Budynek: [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] w regionie [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_agassiz_improve_oil_rigs_project_modifier_1_type')]\n\nŁączna Liczba Pozostałych Budynków (bez obecnego): [JournalEntry.MakeScope.Var('mr_number_of_remaining_list_entries_var').GetValue|V0]\n\nObecny miesięczny postęp: #underline #tooltip:[GetRawTextTooltipTag('agassiz_monthly_geologist_improvement_progress_var_tt')] [GetPlayer.MakeScope.ScriptValue('agassiz_monthly_geologist_project_progress_value')|+2] #!#!"
