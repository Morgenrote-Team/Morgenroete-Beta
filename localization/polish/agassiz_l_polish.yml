 agassiz_journey_coe_preparation_modifier: "Przygotowania do Podróży do Wnętrza Ziemi"
 agassiz_tragic_subterranean_accident_modifier: "Tragiczny Wypadek w Podziemiach"
 je_agassiz_journey_coe: "Podróż do Wnętrza Ziemi"
 je_agassiz_journey_coe_reason: "Dr. [GetPlayer.MakeScope.Var('agassiz_geologist_var').GetCharacter.GetLastName] odnalazł tajemnicze zapiski niemieckiego geologa Ottona Lidenbrocka, które wskazują drogę do podziemnego systemu jaskiń. Już w XVI wieku korzystał z nich islandzki alchemik imieniem Arne Saknussemm. Według księgi wejście do tego systemu znajduje się w jednym z islandzkich wulkanów."
 je_agassiz_journey_coe_fail: "Jeśli Dr. [GetPlayer.MakeScope.Var('agassiz_geologist_var').GetCharacter.GetLastName] umrze lub przejdzie na emeryturę, przeprowadzenie wyprawy nie będzie już możliwe."
 agassiz.901.t: "Dziennik Profesora Lidenbrocka"
 agassiz.901.d: "Podczas wyprawy wulkanologicznej Dr. [GetPlayer.MakeScope.Var('agassiz_geologist_var').GetCharacter.GetLastName] dokonał niezwykłego odkrycia, o którym [GetPlayer.MakeScope.Var('agassiz_geologist_var').GetCharacter.GetSheHe] opowiedział dopiero po powrocie z [GetPlayer.MakeScope.Var('agassiz_geologist_var').GetCharacter.GetHerHis] wyprawy."
 agassiz.901.f: "[GetPlayer.MakeScope.Var('agassiz_geologist_var').GetCharacter.GetFullName] dokonał odkrycia, które przyćmiło obecnie całą wyprawę wulkanologiczną. W jaskini, która prawdopodobnie była niegdyś częścią wygasłego wulkanu w okolicy, [GetPlayer.MakeScope.Var('agassiz_geologist_var').GetCharacter.GetSheHe] odkrył opuszczoną stację obserwacji geologicznych. Jednak zapytane o nią lokalne władze nie potrafiły udzielić żadnych informacji na temat tego, czy odbyła się tu jakaś wyprawa, a jeśli tak, to jaka. Podczas dokładniejszych oględzin komina wulkanicznego Dr. [GetPlayer.MakeScope.Var('agassiz_geologist_var').GetCharacter.GetLastName] odkrył skrzynie i worki z rzeczami osobistymi, wśród których znajdowała się torba należąca do pewnego uczonego. W jej wnętrzu znajdował się dziennik profesora Ottona Lidenbrocka. Lidenbrock był geologiem i mineralogiem z Hamburga, specjalizującym się w wulkanizmie i podziemnych systemach jaskiń. Uważano go za jedną z najwybitniejszych postaci w swojej dziedzinie, ale jednocześnie za człowieka kłótliwego i porywczego. Po sporze na uniwersytecie wyruszył w swoją ostatnią podróż, podczas której zaginął bez śladu. Dziennik może stanowić ostatnią wskazówkę dotyczącą miejsca, w którym przebywał przed zaginięciem, a ze względu na bogactwo zawartych w nim badań mineralogicznych i geologicznych ma nieocenioną wartość naukową! Jednak Dr. [GetPlayer.MakeScope.Var('agassiz_geologist_var').GetCharacter.GetLastName] nie zgadza się na natychmiastowe przekazanie księgi najbliższemu uniwersytetowi, pragnąc najpierw dokładniej ją zbadać. Kierownik wyprawy przekonuje, że dziennik Lidenbrocka może otworzyć drogę do czegoś znacznie większego niż zwykłe katalogowanie nudnych formacji skalnych..."
 agassiz.901.g: "Odkrycie, które przyniesie korzyści wszystkim."
 agassiz.901.h: "Dr. [GetPlayer.MakeScope.Var('agassiz_geologist_var').GetCharacter.GetLastName] powinien zachować księgę i dokładnie ją zbadać."
 agassiz.902.t: "Tajemnica Profesora Ottona Lidenbrocka"
 agassiz.902.d: "Księga odnaleziona podczas wyprawy wulkanologicznej ma zły wpływ na naszego Geologa."
 agassiz.902.f: "Odkąd [SCOPE.sCharacter('agassiz_journey_coe_leader').GetFullName] powrócił z Grecji, [SCOPE.sCharacter('agassiz_journey_coe_leader').GetSheHe] zajmuje się niemal wyłącznie tajemniczym dziennikiem, który [SCOPE.sCharacter('agassiz_journey_coe_leader').GetSheHe] odnalazł w zagłębieniu wulkanicznym. W rezultacie [SCOPE.sCharacter('agassiz_journey_coe_leader').GetSheHe] zaniedbuje [SCOPE.sCharacter('agassiz_journey_coe_leader').GetHerHis] obowiązki polityczne i naukowe. Pracownicy donoszą, że przez całe tygodnie światło paliło się do późnych godzin nocnych. Co dziwne, ostatnio Geolog zamawia niemal wyłącznie literaturę skandynawską. [SCOPE.sCharacter('agassiz_journey_coe_leader').GetSheHe|U] podobno nawet zamknął [SCOPE.sCharacter('agassiz_journey_coe_leader').GetHerselfHimself] w [SCOPE.sCharacter('agassiz_journey_coe_leader').GetHerHis] domu wraz z [SCOPE.sCharacter('agassiz_journey_coe_leader').GetHerHis] bratankiem i kucharką, dopóki nie udało się rozwiązać szczególnie trudnej zagadki. Im bardziej nasz Geolog zagłębia się w treść księgi, tym bardziej obsesyjnie [SCOPE.sCharacter('agassiz_journey_coe_leader').GetSheHe] się zachowuje. Wszystko wskazuje na to, że [SCOPE.sCharacter('agassiz_journey_coe_leader').GetSheHe] coraz bardziej popada w chorobę psychiczną."
 agassiz.902.g: "Niepokojące."
 agassiz.903.t: "Podróż do Wnętrza Ziemi"
 agassiz.903.d: "Po długotrwałym badaniu dziennika profesora Lidenbrocka [SCOPE.sCharacter('agassiz_journey_coe_leader').GetFullName] dokonał przełomowego odkrycia."
 agassiz.903.f: "[SCOPE.sCharacter('agassiz_journey_coe_leader').GetSheHe|U] odizolował [SCOPE.sCharacter('agassiz_journey_coe_leader').GetHerselfHimself] od świata zewnętrznego, aby w samotności poświęcić się studiowaniu dziennika Lidenbrocka. Jak [SCOPE.sCharacter('agassiz_journey_coe_leader').GetSheHe] miał nam później wyznać, pewien fragment od miesięcy nie dawał [SCOPE.sCharacter('agassiz_journey_coe_leader').GetHerHim] spokoju. Pomiędzy kartami dziennika, oprócz osobistych zapisków, znajdowała się znacznie starsza karta rękopisu. Jej autorem był islandzki alchemik z XVI wieku imieniem Arne Saknussemm. Pozostawił on tajemniczy napis sporządzony runami, którego rozszyfrowanie okazało się trudniejsze, niż [SCOPE.sCharacter('agassiz_journey_coe_leader').GetFullName] początkowo przypuszczał. W końcu, jakby kierowany intuicją, [SCOPE.sCharacter('agassiz_journey_coe_leader').GetSheHe] rozwiązał zagadkę. Jak się okazało, [SCOPE.sCharacter('agassiz_journey_coe_leader').GetSheHe] miał rację. Księga skrywała sekret – tajemnicę tak wielką i niepojętą, że wstrząsnęła [SCOPE.sCharacter('agassiz_journey_coe_leader').GetHerHim] do głębi. Przesłanie alchemika brzmiało bowiem: \n\n„Zejdź do krateru Snæfellsjökull, który cień Scartarisa muska tuż przed kalendami lipcowymi, o śmiały podróżniku, a dotrzesz do wnętrza Ziemi. Ja tego dokonałem”.\n\nJeszcze większe podekscytowanie ogarnęło [SCOPE.sCharacter('agassiz_journey_coe_leader').GetFullName], gdy odkrył, że Lidenbrock własnoręcznie dopisał do tekstu kolejne runy. Brzmiały one: „Ja również”. Dla Geologa stało się jasne, że te sensacyjne twierdzenia wymagają naukowej weryfikacji. [SCOPE.sCharacter('agassiz_journey_coe_leader').GetSheHe|U] zażądał więc, abyśmy sfinansowali [SCOPE.sCharacter('agassiz_journey_coe_leader').GetHerHis] podróż na Islandię – [SCOPE.sCharacter('agassiz_journey_coe_leader').GetSheHe] pragnie osobiście dotrzeć do wnętrza Ziemi, czego [SCOPE.sCharacter('agassiz_journey_coe_leader').GetHerselfHimself] zamierza dokonać!"
 agassiz.903.g: "[SCOPE.sCharacter('agassiz_journey_coe_leader').GetSheHe|U] zupełnie postradał zmysły!"
 agassiz.903.h: "Doktor wie, co [SCOPE.sCharacter('agassiz_journey_coe_leader').GetSheHe] robi. Udziel [SCOPE.sCharacter('agassiz_journey_coe_leader').GetHerHim] wsparcia!"
 agassiz.909.t: "Nieszczęśliwy Koniec [SCOPE.sCharacter('agassiz_journey_coe_leader').GetFullName]"
 agassiz.909.d: "Z powodu niefortunnej zmiany sytuacji życiowej [SCOPE.sCharacter('agassiz_journey_coe_leader').GetFullName] musimy zrezygnować z planowanej wyprawy do wnętrza Ziemi."
 agassiz.909.f: ""
 agassiz.909.g: "Godne ubolewania."
 agassiz.911.t: "Islandia"
 agassiz.911.d: "Wyprawa do Wnętrza Ziemi pod kierownictwem [SCOPE.sCharacter('agassiz_journey_coe_leader').GetFullName] dotarła do portu w Reykjavíku."
 agassiz.911.f: "Zgubienie się w Reykjavíku nie było łatwe. Nie musiałem więc pytać o drogę, co mogłoby prowadzić do nieporozumień, gdy jedynym sposobem porozumiewania się były gesty. Miasto rozciągało się na niskim, bagnistym terenie pomiędzy dwoma wzgórzami. Z jednej strony ograniczało je rozległe pole lawowe, łagodnie opadające ku morzu. Z drugiej rozciągała się ogromna zatoka Faxa, zamknięta od północy przez potężny lodowiec Snæfell, na której w tym czasie jedynym statkiem była Valkyria. Zazwyczaj w zatoce tej cumowały angielskie i francuskie statki służb ochrony rybołówstwa, lecz właśnie wtedy patrolowały zachodnie wybrzeża wyspy. Dłuższa z zaledwie dwóch ulic Reykjavíku biegła równolegle do plaży. Wkrótce przemierzyłem te ponure uliczki. Tu i ówdzie dostrzegałem wyblakłą darń, przypominającą kawałek wytartego dywanu, albo coś na kształt ogródka warzywnego, którego skąpe plony nadawałyby się w sam raz na stół Liliputów. Kilka mizernych kwiatów próbowało korzystać ze świeżego powietrza i promieni słonecznych. W ciągu trzech godzin zwiedziłem nie tylko całe miasto, ale również jego okolice. Ogólny widok był niezwykle przygnębiający. Żadnych drzew i niemal zupełny brak roślinności. Wszędzie nagie skały, świadczące o dawnej aktywności wulkanicznej."
 agassiz.911.g: "A więc zaczyna się."
 agassiz.912.t: "Snaefells Jökull"
 agassiz.912.d: "Zespół dotarł do krateru islandzkiego wulkanu i przygotowuje się do zejścia w jego głąb."
 agassiz.912.f: "Kolację pochłonęliśmy w pośpiechu, po czym nasza niewielka grupa urządziła się na nocleg najlepiej, jak potrafiła. Posłania były twarde, schronienie niezbyt solidne, a nasze położenie budziło niepokój, znajdowaliśmy się bowiem na wysokości pięciu tysięcy stóp nad poziomem morza. Następnego ranka obudziliśmy się niemal zamarznięci od przenikliwego chłodu, lecz powitały nas promienie wspaniałego słońca. Podniosłem się z mojego granitowego posłania i wyszedłem, aby podziwiać roztaczający się przede mną niezwykły widok. Uniosłem głowę i ujrzałem wysoko nad sobą górny otwór stożka wulkanicznego, obramowujący niewielki, niemal idealnie okrągły skrawek nieba. Tuż przy jego krawędzi wznosił się ośnieżony szczyt Saris, wyraźnie odcinający się od bezkresnej przestrzeni. Nie odważyłem się jeszcze spojrzeć w bezdenną otchłań, w którą wkrótce miałem się zagłębić. Nadeszła decydująca chwila. Jak już wspomniałem, otwór miał sto stóp średnicy i trzysta stóp obwodu. Pochyliłem się nad wystającą skałą i spojrzałem w dół. Włosy stanęły mi dęba ze strachu. Ogarnęło mnie oszałamiające uczucie pustki. Poczułem, jak przesuwa się mój środek ciężkości, a zawroty głowy uderzają mi do głowy niczym alkoholowe upojenie."
 agassiz.912.g: "Czy to wszystko na pewno było dobrym pomysłem?"
 agassiz.913.t: "Poszukaj Wody"
 agassiz.913.d: "Po zejściu w głąb wulkanu zapasy wody wyczerpują się. Już po kilku dniach wyprawa znajduje się w poważnym niebezpieczeństwie."
 agassiz.913.f: "Nigdy dotąd mineralodzy nie znaleźli się w tak niezwykłym położeniu, które pozwalałoby im badać przyrodę bezpośrednio w jej naturalnym środowisku. To, czego maszyna wiertnicza, bezwładne i pozbawione czucia narzędzie, nie była w stanie wydobyć na powierzchnię z wnętrza Ziemi, my mogliśmy oglądać na własne oczy i dotykać własnymi rękami. Przez warstwy łupków, mieniących się delikatnymi odcieniami zieleni, wiły się żyłki miedzi i manganu, z domieszkami platyny i złota. Pomyślałem, jakież bogactwa spoczywają tutaj, pogrzebane na niedostępnych głębokościach Ziemi, na zawsze ukryte przed chciwymi oczami ludzkości! Około szóstej to olśniewające widowisko świetlne zaczęło wyraźnie tracić swój blask, aż w końcu niemal całkowicie zgasło. Tak jak przewidywałem, pod koniec pierwszego dnia marszu powrotnego wyczerpały się wszystkie zapasy wody. Jedynym płynem, jaki nam pozostał, był gin, lecz ten piekielny trunek palił mnie w gardło i nie mogłem znieść nawet jego widoku. Temperatura była nieznośna, a powietrze duszne. Zmęczenie paraliżowało moje kończyny. Niejednokrotnie padałem na ziemię, niezdolny do ruchu. Wówczas zarządzano postój, a mój wuj i Islandczyk robili wszystko, co w ich mocy, aby przywrócić mi siły. Widziałem jednak, że wuj sam z trudem znosił potworne wyczerpanie i męki pragnienia. Wreszcie, na czworakach i na wpół martwi, dotarliśmy do miejsca, w którym łączyły się dwie drogi. Tam osunąłem się bezwładnie niczym martwe ciało, rozciągając się na podłożu z zastygłej lawy."
 agassiz.913.g: "Po zejściu w głąb wulkanu zapasy wody wyczerpują się. Już po kilku dniach wyprawa znajduje się w poważnym niebezpieczeństwie."
 agassiz.913.h: "Musimy wrócić na powierzchnię i tam poszukać wody."
 agassiz.914.t: "Morze Wewnętrzne"
 agassiz.914.d: "Podążając wzdłuż strumienia przez system jaskiń, podróżnicy natrafiają na rozległe podziemne morze."
 agassiz.914.f: "Jakimś cudem znaleźliśmy wodę: rwący strumień niósł zimną wodę w głąb Ziemi, pozwalając nam uzupełnić zapasy. Kiedy jednak podążyliśmy wzdłuż niego i dotarliśmy do jego końca, czekała nas jeszcze większa niespodzianka. Początkowo niemal nic nie widziałem. Moje oczy, nieprzyzwyczajone do światła, natychmiast się zamknęły. Kiedy zdołałem je ponownie otworzyć, ogarnęło mnie osłupienie większe nawet niż zdumienie. Przede mną rozciągała się ogromna tafla wody, początek jeziora lub oceanu, sięgająca daleko poza zasięg wzroku. Widok ten nieodparcie przywodził mi na myśl otwarte morze, na którego widok dziesięć tysięcy Greków Ksenofonta, po długim odwrocie, wydało jednoczesny okrzyk: „Thalatta! Thalatta!” – „Morze! Morze!”. Wzdłuż głęboko powcinanej linii brzegowej rozciągał się szeroki pas drobnego, lśniącego piasku, delikatnie obmywanego przez fale i usianego niewielkimi muszlami, w których niegdyś żyły pierwsze stworzenia. Fale rozbijały się o brzeg z głuchym, rozbrzmiewającym echem szumem, charakterystycznym dla rozległych, zamkniętych przestrzeni. Był to prawdziwy ocean, otoczony nieregularnymi brzegami, lecz pusty i przerażająco dziki w swoim wyglądzie. Łatwo sobie wyobrazić, że po czterdziestu siedmiu dniach spędzonych w ciasnym korytarzu oddychanie wilgotnym powietrzem przesyconym drobinami soli było dla nas szczytem fizycznej rozkoszy."
 agassiz.914.g: "Zbuduj tratwę."
 agassiz.915.t: "Olbrzym"
 agassiz.915.d: "Runiczne znaki na tajemniczych, pradawnych olbrzymich grzybach sugerują, że Arne Saknussemm był tutaj. Jednak aby znaleźć dowody potwierdzające tę tezę, trzeba byłoby przejść obok gigantycznego, budzącego grozę prehistorycznego człowieka."
 agassiz.915.f: "Rozproszone światło odsłaniało najmniejszy nawet szczegół w gęstych i odległych zaroślach. Wydawało mi się, że dostrzegłem — nie! rzeczywiście ujrzałem na własne oczy — poruszające się olbrzymie, kolosalne kształty. Były to gigantyczne zwierzęta; całe stado mastodontów — nie kopalne szczątki, lecz żywe stworzenia, przypominające te, których kości odnaleziono na bagnach Ohio w 1801 roku. Widziałem te ogromne słonie, których długie, giętkie trąby ryły i rozgarniały ziemię pod drzewami niczym legion węży. Słyszałem trzask ich długich kłów z kości słoniowej, wwiercających się w stare, spróchniałe pnie. Patrzyłem, potrząsając głową z niedowierzaniem. Lecz choć z początku nie chciałem wierzyć, musiałem ulec świadectwu własnych zmysłów. Istotnie, w odległości około ćwierci mili, oparty o pień olbrzymiego kauri, stał człowiek — Proteusz tych podziemnych krain, nowy syn Neptuna — doglądający niezliczonego stada mastodontów. Tak, człowiek, a przy tym jeszcze większy od nich. Nie był to już kopalny stwór podobny do tego, którego wyschnięte szczątki bez trudu podnieśliśmy na polu kości; był to olbrzym, zdolny panować nad tymi potworami. Miał co najmniej dwanaście stóp wzrostu. Jego głowa, ogromna i niezgrabna niczym bawola, była do połowy skryta w gęstwinie zaniedbanych, splątanych włosów. Najbardziej przypominały one grzywę pradawnego słonia. W dłoni z łatwością dzierżył potężną gałąź — laskę godną tego pasterza z epoki geologicznej."
 agassiz.915.g: "Musimy podjąć ryzyko."
 agassiz.915.h: "To zbyt niebezpieczne – natychmiast wracajmy na powierzchnię!"
 agassiz.916.t: "Rękopis Arne Saknussemmа"
 agassiz.916.d: "Po ucieczce przed olbrzymim prehistorycznym człowiekiem podróżnicy natrafili na galerię, w której wszędzie widniały inicjały Arne Saknussemmа. Po pewnym czasie poszukiwań odnaleźli dowód na to, że islandzki alchemik rzeczywiście tu był – legendarny rękopis został odnaleziony głęboko we wnętrzu Ziemi!"
 agassiz.916.f: "Po kolejnych piętnastu minutach nasze szybkie nogi wyniosły nas poza zasięg tego przerażającego potwora. A jednak teraz, gdy mogę już spokojnie rozmyślać, gdy mój umysł odzyskał równowagę, a od tego dziwnego, niemal nadprzyrodzonego spotkania minęły całe miesiące, co mam o tym sądzić? W co mam wierzyć? Muszę dojść do wniosku, że niemożliwe, aby nasze zmysły nas oszukały, aby nasze oczy nie widziały tego, co wydawało nam się, że widzimy. Żaden człowiek nie żyje w tym podziemnym świecie. Żadne pokolenia ludzi nie zamieszkują tych głębokich jaskiń we wnętrzu Ziemi, nieznanych jej powierzchniowym mieszkańcom i niemających z nimi żadnego kontaktu. Wiara w coś takiego byłaby absurdem! Wolałbym raczej przyjąć, że było to jakieś zwierzę o budowie przypominającej człowieka, małpa lub pawian z wczesnych epok geologicznych, jakiś protopitek czy mezopitek, pradawna małpa podobna do tej, którą pan Lartet odkrył w jaskini pełnej kości w Sansau. Jednak wzrost tego stworzenia przekraczał wszelkie rozmiary znane współczesnej paleontologii. Lecz żeby człowiek, żywy człowiek, a zatem zapewne również całe pokolenia ludzi, miał żyć ukryty głęboko we wnętrzu Ziemi – to niemożliwe. Tymczasem pozostawiliśmy już za sobą świetlisty las, oniemiali ze zdumienia, przytłoczeni i obezwładnieni przerażeniem graniczącym z osłupieniem. Biegliśmy dalej, obawiając się, że straszliwy potwór może podążać naszym tropem. Była to rozpaczliwa ucieczka, pełna potknięć i upadków, przypominająca przerażające uczucie szarpania i wleczenia, jakiego doświadcza się podczas koszmarnego snu. Jednocześnie z niezwykłym zainteresowaniem przyglądaliśmy się całej wysokiej ścianie, zaglądając w każdą szczelinę, która mogła prowadzić do jakiejś galerii. Wtem na granitowej płycie dostrzegliśmy dwie tajemnicze wyryte litery, częściowo zatarte przez upływ czasu. Były to inicjały śmiałego i nieustraszonego podróżnika. „A. S.!” – wykrzyknął mój wuj. „Arne Saknussemm! Arne Saknussemm wszędzie!”"
 agassiz.916.g: "Wreszcie – jest nasz!"
 agassiz.917.t: "Podróż do Wnętrza Ziemi Przepada"
 agassiz.917.d: "Podróż do Wnętrza Ziemi zakończyła się niepowodzeniem. Podejrzewamy, że wszyscy członkowie wyprawy zmarli z pragnienia z powodu braku wody."
 agassiz.917.f: "Była ósma wieczorem. Wciąż nie natrafiliśmy na żaden ślad wody. Cierpiałem straszliwie. Mój wuj maszerował dalej, nie zamierzając się zatrzymywać. Z niepokojem nasłuchiwał szmeru odległych źródeł. Lecz nie, wokół panowała martwa cisza. Tymczasem nogi zaczynały odmawiać mi posłuszeństwa. Znosiłem ból i męczarnie, aby nie zmuszać wuja do zatrzymania się, co doprowadziłoby go do rozpaczy, ponieważ dzień zbliżał się ku końcowi, a był to jego ostatni dzień. W końcu całkowicie opadłem z sił. Wydałem okrzyk i upadłem. „Podejdź do mnie, umieram”. Wuj zawrócił. Spojrzał na mnie ze skrzyżowanymi ramionami, po czym wymamrotał: „To już koniec!”. Ostatnią rzeczą, jaką ujrzałem, był przerażający gest gniewu, a potem moje oczy się zamknęły."
 agassiz.917.g: "Co za tragedia!"
 agassiz.918.t: "Stromboli"
 agassiz.918.d: "Podróż do Wnętrza Ziemi zakończyła się pełnym sukcesem – po erupcji wulkanu Stromboli nasi naukowcy bezpiecznie powrócili jako bohaterowie!"
 agassiz.918.f: "Zachowałem jedynie mgliste wspomnienie nieustannych eksplozji, ogłuszających detonacji, ogólnego drżenia otaczających nas skał oraz wirowania, w którym nasza tratwa była bezradnie obracana. Kołysała się na potoku lawy pośród gęstego opadu popiołu. Parskające płomienie ciskały ku nam swoje ogniste języki. Z dołu buchały dzikie, gwałtowne podmuchy burzowego wiatru, podobne do tchnień ogromnych hutniczych pieców, dmących jednocześnie z całej mocy; dostrzegłem też sylwetkę Hansa, oświetloną blaskiem ognia. Jedynym uczuciem, jakie jeszcze we mnie pozostało, było to, które – jak sądzę – musi odczuwać nieszczęsny skazaniec, przeznaczony do tego, by zostać wystrzelonym żywcem z lufy armaty, tuż przed naciśnięciem spustu, gdy rozrzucone w powietrzu szczątki ciała i strzępy skóry mają za chwilę opaść na zbroczoną krwią ziemię. \n\n Kiedy ponownie otworzyłem oczy, poczułem, że silna dłoń naszego przewodnika trzyma mnie za pas. Leżałem na pochyłym zboczu góry, zaledwie dwa jardy od ziejącej przepaści, która pochłonęłaby mnie, gdybym tylko przechylił się w jej stronę. Nad naszymi głowami, na wysokości pięciuset stóp lub więcej, widzieliśmy krater wulkanu, z którego mniej więcej co piętnaście minut, z donośnym hukiem, wydobywały się wysokie słupy ognia, zmieszane z pumeksem, popiołem i płynącą lawą. Czułem, jak góra faluje, zdając się oddychać niczym ogromny wieloryb i wyrzucać ogień oraz wiatr ze swych potężnych otworów niczym z nozdrzy. Poniżej, w dół dość stromego zbocza, spływały przez osiemset czy dziewięćset stóp strumienie lawy, co pozwalało ocenić wysokość góry na jakieś 1300 lub 1400 stóp. Podnóże góry skrywał jednak prawdziwy gąszcz bujnej zieleni, wśród której potrafiłem rozróżnić oliwki, figi oraz winorośle obwieszone soczystymi, purpurowymi gronami."
 agassiz.918.g: "Co za przygoda!"
 agassiz.919.t: "Pożarty przez Olbrzyma"
 agassiz.919.d: "Podróż do Wnętrza Ziemi zakończyła się niepowodzeniem. Podejrzewamy, że wszyscy członkowie wyprawy zostali pożarci żywcem przez olbrzyma."
 agassiz.919.f: "Przynajmniej tak podejrzewamy."
