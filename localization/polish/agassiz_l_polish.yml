 je_agassiz_volcano_expedition: "Wyprawa Wulkanologiczna"
 je_agassiz_volcano_expedition_reason: "Profesor [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] prowadzi wyprawę wulkanologiczną w regionie [SCOPE.sState('agassiz_volcano_state').GetName] wraz z zespołem ekspertów i asystentów. Budżet wyprawy pozwala na jej prowadzenie przez maksymalnie 2 lata. Zazwyczaj wyprawa czyni pewne postępy każdego miesiąca, a prace badawcze powinny zakończyć się po półtora roku. Jednak nieprzewidziane wydarzenia – zarówno te przynoszące cenne odkrycia naukowe, jak i te prowadzące do katastrofy – mogą wpłynąć na przebieg wyprawy. Podstawowa zasada jest prosta: poziom zagrożenia nigdy nie powinien wzrosnąć tak bardzo, aby osiągnąć maksimum. To nie jest zwykły spacerek. Nie igra się z wulkanami."
 agassiz.21.t: "Obserwatorium Wezuwiusza"
 agassiz.21.d: "W geologii Wezuwiusz uznawany jest za wzorcowy wulkan, którego badania pozwalają wyciągać wnioski dotyczące całej dziedziny wulkanologii. Ze względu na jego wzmożoną aktywność od XVII wieku oraz nadzieję na możliwość przewidywania i naukowego badania kolejnych erupcji, rząd wydał dekret o budowie obserwatorium wulkanologicznego na jego zboczu."
 agassiz.21.f: "Obserwatorium Wezuwiusza (wł. Osservatorio Vesuviano) jest ośrodkiem nadzorującym aktywność trzech obszarów wulkanicznych we włoskiej Kampanii: Wezuwiusza, Pól Flegrejskich i Ischii. Założone w 1841 roku na zboczach Wezuwiusza przez Ferdynanda II Burbona, króla Obojga Sycylii, jest najstarszym instytutem wulkanologicznym na świecie."
 agassiz.21.g: "Jesteśmy pionierami wulkanologii."
