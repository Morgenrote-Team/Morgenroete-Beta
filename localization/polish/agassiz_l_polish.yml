 subject_geological_team_action_notification_desc: ""
 subject_uranium_team_action_notification_name: ""
 subject_uranium_team_action_notification_desc: ""
 agassiz.103.t: "Zespół Geologiczny Wyrusza"
 agassiz.103.d: "Po zakończeniu prac zespołu geologicznego asystenci badawczy powracają do ojczyzny. Odkryte przez nich formacje geologiczne są teraz dostępne również dla naszych naukowców."
 agassiz.103.f: "„Pozwolę sobie zakończyć ten rozdział, przytaczając powiedzenie profesora Agassiza, że ilekroć w nauce wychodzi na jaw nowy, zdumiewający fakt, ludzie najpierw mówią: «To nieprawda», potem: «To sprzeczne z religią», a na koniec: «Przecież wszyscy od dawna o tym wiedzieli»”. – Charles Lyell"
 agassiz.103.g: "To była cenna pomoc z zagranicy."
 agassiz.104.t: "Zespół Poszukiwawczy Uranu Wyrusza"
 agassiz.104.d: "Po zakończeniu prac zespołu poszukiwawczego uranu asystenci badawczy powracają do ojczyzny. Odkryte przez nich złoża uranu mogą być również eksploatowane przez nasze przedsiębiorstwa."
