 subject_geological_team: "Wyślij Zespół Geologiczny"
 subject_geological_team_desc: "Krążą pogłoski, że na terytorium tego zależnego kraju znajdują się interesujące formacje geologiczne. Nasz [concept_agassiz_geologist] może wyszkolić zespół, który wyruszy na poszukiwanie tych obiektów geologicznych."
 subject_uranium_team: "Wyślij Zespół Poszukiwawczy Uranu"
 subject_uranium_team_desc: "Krążą pogłoski, że na terytorium tego zależnego kraju znajdują się złoża uranu. Nasz [concept_agassiz_geologist] może wyszkolić zespół, który wyruszy na poszukiwanie tego surowca."
