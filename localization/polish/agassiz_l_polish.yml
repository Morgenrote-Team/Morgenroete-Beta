 je_agassiz_improve_mines_project_reason: "Twój [concept_agassiz_geologist] Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] gorączkowo poszukuje żył rud i innych sposobów na ulepszenie obiektu [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] w regionie [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName].\n$mr_divider_for_je$\nProjekt będzie zyskiwać postęp co miesiąc. Gdy postęp osiągnie #V 24 Punkty#!, budynek otrzyma $agassiz_building_production_mult_modifier_with_tooltip$ jako nowy [concept_modifier]. Ponadto otrzymasz #p 2500#! @agassiz_mineral! [Concept('concept_agassiz_mineral','$concept_agassiz_minerals|q$')]\n$mr_divider_for_je$\nObecny Budynek: [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] w regionie [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_agassiz_improve_mines_project_modifier_1_type')]\n\nŁączna liczba pozostałych budynków (bez obecnego): [JournalEntry.MakeScope.Var('mr_number_of_remaining_list_entries_var').GetValue|V0]\n$concept_agassiz_minerals$ z Projektu: [JournalEntry.MakeScope.ScriptValue('agassiz_generic_minderals_from_mine_project_value')|+0] @agassiz_mineral!\n\nObecny miesięczny postęp: #underline #tooltip:[GetRawTextTooltipTag('agassiz_monthly_geologist_improvement_progress_var_tt')] [GetPlayer.MakeScope.ScriptValue('agassiz_monthly_geologist_project_progress_value')|+2] #!#!"
