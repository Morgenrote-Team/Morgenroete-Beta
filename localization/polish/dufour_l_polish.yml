 dufour.2100.t: "Martin Disteli - Karykaturzysta"
 dufour.2100.d: "[SCOPE.sCharacter('character_1_scope').GetFullName], malarz i karykaturzysta z Olten, bardzo interesuje się sprawą liberałów. Jego polityczne karykatury mogłyby okazać się dla nich wielkim wsparciem, więc może byłby dla nas bardziej użyteczny jako agitator?"
 dufour.2100.f: "„Chciałbyś kolejną karykaturę o rozwścieczonych katolickich księżach? Och, jestem pewien, że tak!”"
 dufour.2100.g: "Sprawa liberałów potrzebuje dobrych karykatur!"
 dufour.2100.h: "On jest malarzem!"
