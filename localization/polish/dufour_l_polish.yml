l_polish:
 dufour_celebrate_schwingfest_decision: "Zorganizuj pierwsze Eidgenössisches Schwing- und Älplerfest"
 dufour_celebrate_schwingfest_decision_desc: "Schwingen stało się czymś w rodzaju szwajcarskiego sportu narodowego. Uczyńmy z niego prawdziwy sport narodowy, organizując Schwing- und Älplerfest!"
 dufour_schwingfest_modifier: "Eidgenössisches Schwing- und Älplerfest"
 dufour_schwingerkonig: "Schwingerkönig"
 dufour_schwingerkonig_desc: "Ta postać wygrała Eidgenössisches Schwingfest w Szwajcarii. Jest postrzegana przez społeczeństwo jako mistrz."
 dufour.1000.t: "Oba kantony Appenzell nie wprowadzają praw wyborczych dla kobiet"
 dufour.1000.d: "W Szwajcarii wprowadzono prawa wyborcze dla kobiet. Niestety niektóre kantony nieco się z tym ociągają. W kantonach Appenzell Innerrhoden i Appenzell Ausserrhoden kobiety mogą brać udział w głosowaniach i wyborach federalnych, ale nie w wyborach i głosowaniach na szczeblu gminnym ani kantonalnym. Najpierw konieczna byłaby zmiana konstytucji kantonalnej, która następnie musiałaby zostać zatwierdzona przez Landsgemeinde. Proces ten może potrwać kilka lat. Czy powinniśmy interweniować i zmusić mieszkańców Appenzell do wprowadzenia praw wyborczych dla kobiet, czy poczekać z nadzieją, że zrobią to sami?"
 dufour.1000.f: "„Na pewno nasi mężczyźni robią to jak należy!”\n\n#b Historycznie#! wprowadzenie praw wyborczych dla kobiet w Szwajcarii trwało bardzo długo. Dopiero w 1971 roku uzyskały one prawo udziału w szwajcarskich głosowaniach i wyborach. W niektórych kantonach trwało to jeszcze dłużej. Najdłużej opierały się oba kantony Appenzell. Appenzell Ausserrhoden wprowadził prawa wyborcze dla kobiet w 1989 roku podczas Landsgemeinde. Appenzell Innerrhoden natomiast został zmuszony do ich wprowadzenia w 1990 roku przez Sąd Federalny.\nSzwajcaria należy więc do krajów, które najpóźniej wprowadziły prawa wyborcze dla kobiet. Wcześniej zrobiły to między innymi Afganistan, Finlandia, Stany Zjednoczone i wiele innych państw."
 dufour.1000.g: "Zmuśmy ich, by pozwolili kobietom głosować."
 dufour.1000.h: "Na pewno wkrótce zdecydują się przyznać kobietom prawa wyborcze."
 dufour_womens_suffrage_appenzell_effects_tt:0 "Nie zmuszasz obu kantonów do wprowadzenia praw wyborczych dla kobiet. Otrzymasz wydarzenie, jeśli w tej sprawie nastąpi postęp lub jeśli konieczna będzie twoja decyzja."
 dufour.1001.t: "Porażka w głosowaniu nad prawami wyborczymi kobiet w obu kantonach Appenzell"
 dufour.1001.d: "Rządy Appenzell Ausserrhoden i Appenzell Innerrhoden zaproponowały wprowadzenie praw wyborczych dla kobiet na szczeblu kantonalnym. Projekt ustawy został odrzucony. Oznacza to, że kobiety w Appenzell nadal nie mają prawa głosu. Moglibyśmy zmusić oba kantony Appenzell do przyznania kobietom tego prawa, ale z pewnością obróciłoby to miejscową ludność przeciwko nam."
 dufour.1001.f: "„Podnieście rękę, jeśli chcecie wprowadzenia praw wyborczych dla kobiet na szczeblu kantonalnym!” Wiele rąk uniosło się w górę. Ale czy było ich wystarczająco dużo? „Odrzuciliście wprowadzenie praw wyborczych dla kobiet na szczeblu kantonalnym!”\n\n#b Historycznie#! wprowadzenie praw wyborczych dla kobiet w Szwajcarii trwało bardzo długo. Dopiero w 1971 roku uzyskały one prawo udziału w szwajcarskich głosowaniach i wyborach. W niektórych kantonach trwało to jeszcze dłużej. Najdłużej opierały się oba kantony Appenzell. Appenzell Ausserrhoden wprowadził prawa wyborcze dla kobiet w 1989 roku podczas Landsgemeinde. Appenzell Innerrhoden natomiast został zmuszony do ich wprowadzenia w 1990 roku przez Sąd Federalny.\nSzwajcaria należy więc do krajów, które najpóźniej wprowadziły prawa wyborcze dla kobiet. Wcześniej zrobiły to między innymi Afganistan, Finlandia, Stany Zjednoczone i wiele innych państw."
 dufour.1001.g: "Mam już tego dość! Po prostu zmuśmy ich do wprowadzenia praw wyborczych dla kobiet!"
 dufour.1001.h: "Poczekajmy troszkę dłużej."
 dufour.1002.t: "Oba kantony Appenzell wprowadzają prawa wyborcze dla kobiet"
 dufour.1002.d: "Kto by pomyślał? Oba kantony Appenzell wprowadziły prawa wyborcze dla kobiet poprzez głosowanie przez podniesienie ręki na swoich zgromadzeniach regionalnych. Oznacza to, że kobiety mogą teraz głosować w całej Szwajcarii."
 dufour.1002.f: "„Podnieście rękę, jeśli chcecie wprowadzenia praw wyborczych dla kobiet na szczeblu kantonalnym!” Wiele rąk uniosło się w górę. Ale czy było ich wystarczająco dużo? „Zatwierdziliście wprowadzenie praw wyborczych dla kobiet na szczeblu kantonalnym!” Rozległy się okrzyki radości!\n\n#b Historycznie#! wprowadzenie praw wyborczych dla kobiet w Szwajcarii trwało bardzo długo. Dopiero w 1971 roku uzyskały one prawo udziału w szwajcarskich głosowaniach i wyborach. W niektórych kantonach trwało to jeszcze dłużej. Najdłużej opierały się oba kantony Appenzell. Appenzell Ausserrhoden wprowadził prawa wyborcze dla kobiet w 1989 roku podczas Landsgemeinde. Appenzell Innerrhoden natomiast został zmuszony do ich wprowadzenia w 1990 roku przez Sąd Federalny.\nSzwajcaria należy więc do krajów, które najpóźniej wprowadziły prawa wyborcze dla kobiet. Wcześniej zrobiły to między innymi Afganistan, Finlandia, Stany Zjednoczone i wiele innych państw."
 dufour.1002.g: "Zajęło im to dłużej, niż się spodziewałem!"
 dufour.1003.t: "Kolejna porażka we wprowadzaniu praw wyborczych dla kobiet w obu kantonach Appenzell"
 dufour.1003.d: "To była już druga próba podjęta przez część postępowych mieszkańców Appenzell, by wprowadzić prawa wyborcze dla kobiet. Jednak i tym razem zakończyła się niepowodzeniem. Nadal możemy wymusić ich wprowadzenie albo poczekać jeszcze dłużej i mieć nadzieję, że mieszkańcy Appenzell sami dobrowolnie przyznają kobietom prawa wyborcze."
 dufour.1003.f: "„Podnieście rękę, jeśli chcecie wprowadzenia praw wyborczych dla kobiet na szczeblu kantonalnym!” Wiele rąk uniosło się w górę. Ale czy było ich wystarczająco dużo? „Odrzuciliście wprowadzenie praw wyborczych dla kobiet na szczeblu kantonalnym!”\n\n#b Historycznie#! wprowadzenie praw wyborczych dla kobiet w Szwajcarii trwało bardzo długo. Dopiero w 1971 roku uzyskały one prawo udziału w szwajcarskich głosowaniach i wyborach. W niektórych kantonach trwało to jeszcze dłużej. Najdłużej opierały się oba kantony Appenzell. Appenzell Ausserrhoden wprowadził prawa wyborcze dla kobiet w 1989 roku podczas Landsgemeinde. Appenzell Innerrhoden natomiast został zmuszony do ich wprowadzenia w 1990 roku przez Sąd Federalny.\nSzwajcaria należy więc do krajów, które najpóźniej wprowadziły prawa wyborcze dla kobiet. Wcześniej zrobiły to między innymi Afganistan, Finlandia, Stany Zjednoczone i wiele innych państw."
 dufour.1003.g: "Cholerni wieśniacy. Mieli swoją szansę, teraz ich do tego zmusimy!"
 dufour.1003.h: "Nie możemy tak po prostu podważać procesu demokratycznego."
 dufour.1004.t: "Sąd Federalny zmusza Appenzell Innerrhoden do wprowadzenia praw wyborczych dla kobiet"
 dufour.1004.d: "Po tym, jak Appenzell Ausserrhoden przyjął prawa wyborcze dla kobiet podczas ostatniego Landsgemeinde, Sąd Federalny wydał decyzję w sprawie Appenzell Innerrhoden. Appenzell Innerrhoden musi wprowadzić prawa wyborcze dla kobiet. Tym samym sprawa została rozstrzygnięta raz na zawsze."
 dufour.1004.f: "„Sąd Federalny stwierdza, że Appenzell narusza konstytucję Konfederacji Szwajcarskiej. Kobiety mają takie same prawa jak mężczyźni. Appenzell Innerrhoden jest zobowiązany do natychmiastowego wprowadzenia praw wyborczych dla kobiet!”\n\n#b Historycznie#! wprowadzenie praw wyborczych dla kobiet w Szwajcarii trwało bardzo długo. Dopiero w 1971 roku uzyskały one prawo udziału w szwajcarskich głosowaniach i wyborach. W niektórych kantonach trwało to jeszcze dłużej. Najdłużej opierały się oba kantony Appenzell. Appenzell Ausserrhoden wprowadził prawa wyborcze dla kobiet w 1989 roku podczas Landsgemeinde. Appenzell Innerrhoden natomiast został zmuszony do ich wprowadzenia w 1990 roku przez Sąd Federalny.\nSzwajcaria należy więc do krajów, które najpóźniej wprowadziły prawa wyborcze dla kobiet. Wcześniej zrobiły to między innymi Afganistan, Finlandia, Stany Zjednoczone i wiele innych państw."
 dufour.1004.g: "W końcu!"
 dufour.2000.t: "Pierwsze Eidgenössisches Schwing- und Älplerfest w Biel"
 dufour.2000.d: "W pierwszym Eidgenössisches Schwing- und Älplerfest wzięło udział wielu zawodników Schwingen. Wydarzenie odbyło się w mieście Biel i zostało zorganizowane przez szwajcarskie kluby Schwingen po tym, jak sport ten stawał się coraz bardziej popularny. Po ogromnym sukcesie uczestnicy i organizatorzy z niecierpliwością oczekują kolejnej edycji za trzy lata. Wielu zawodników Schwingen pragnie również zwyciężyć i zdobyć główną nagrodę — silnego byka."
 dufour.2000.f: "Dwa potężne ciała zmagają się ze sobą, żaden z zawodników nie chce upaść. Obaj przeciwnicy padają na ziemię przy wiwatach publiczności. Alfred Niklaus jest na górze. Został pierwszym Schwingerkönig! Najpierw jednak pomaga swojemu przeciwnikowi wstać i otrzepuje jego plecy z trocin.\n\n#b Historycznie #! Schwingen — forma zapasów o bardzo rygorystycznych zasadach — było popularnym sportem w Szwajcarii, choć jego początki trudno dokładnie prześledzić. Pierwszy lokalny Schwingfest odbył się jednak na Unspunnenmatte w Interlaken. Pierwsze Eidgenössisches Schwing- und Älplerfest odbyło się w 1895 roku w Biel, a następnie organizowano je regularnie co dwa lub trzy lata. Podczas Schwing- und Älplerfest rozgrywane są również dwa inne szwajcarskie sporty narodowe: Hornussen (sport drużynowy polegający na odbijaniu krążka zwanego „Hornuss”) oraz Steinstossen (forma pchnięcia kamieniem).\n\nEidgenössisches Schwing- und Älplerfest jest obchodzone do dziś. Ostatnie wydarzenie odbyło się w 2022 roku w Pratteln niedaleko Bazylei, a kolejne odbędzie się w Mollis w 2025 roku. Zwycięzca otrzymuje w nagrodę byka; Schwingerkönig z 2022 roku — Joel Wicki — wygrał byka „Magnus” rasy Red Holstein."
 dufour.2000.g: "Nie mogę się doczekać kolejnego wydarzenia!"
 dufour.2001.t: "[SCOPE.sCharacter('dufour_schwingerkonig_scope').GetLastName] [SCOPE.sCharacter('dufour_schwingerkonig_scope').GetFirstName] wygrał Eidgenössisches Schwingfest!"
 dufour.2001.d: "Po zaciętej walce [SCOPE.sCharacter('dufour_schwingerkonig_scope').GetLastName] [SCOPE.sCharacter('dufour_schwingerkonig_scope').GetFirstName] został zwycięzcą tegorocznego Eidgenössisches Schwingfest."
 swiss_flavor_events.21.f1: "Dwa potężne ciała zmagają się ze sobą, żaden z zawodników nie chce upaść. Obaj przeciwnicy padają na ziemię przy wiwatach publiczności. Jeden z nich jest na górze — wygrał ten „Gang”. Pomaga przeciwnikowi wstać i otrzepuje jego plecy z trocin."
 swiss_flavor_events.21.f2: "\n\nCo ciekawe, w Schwingen kolejność imienia i nazwiska zawodnika jest odwrócona i najpierw podaje się nazwisko. Gdyby Abraham Lincoln był zawodnikiem Schwingen, nazywano by go Lincoln Abraham."
 swiss_flavor_events.21.f3: "\n\nJeśli przeciwnik ma tyle samo punktów co Schwingerkönig, otrzymuje tytuł „Erstgekrönter”, co oznacza „pierwszy ukoronowany”."
 swiss_flavor_events.21.f4: "\n\nNajlepsze 15 procent uczestników Eidgenössisches otrzymuje wieniec. Zwykle nazywa się ich „Eidgenossen”."
 swiss_flavor_events.21.f5: "\n\nPozostali uczestnicy również otrzymują nagrody. Umieszcza się je w specjalnym pawilonie nagród. Każda z nich została ufundowana przez jakąś osobę lub organizację."
 swiss_flavor_events.21.f6: "\n\nJak dotąd trzech różnych zawodników trzykrotnie zdobyło tytuł Schwingerkönig. Hans Stucki zwyciężył w 1900, 1902 i 1905 roku. Rudolf Hunsperger wygrał w 1966, 1969 i 1974 roku. Jörg Abderhalden zwyciężył w 1998, 2004 i 2007 roku."
 swiss_flavor_events.21.f7: "\n\nW Szwajcarii odbywają się również inne Schwingfeste. Dwa z najważniejszych to „Unspunnen-Schwinget” w pobliżu Interlaken oraz „Kilchberger Schwinget” w kantonie Zurych. Jeśli Schwinger wygra oba te zawody oraz Eidgenössisches, nazywa się to „Schwinger-Grand-Slam”."
 swiss_flavor_events.21.f8: "\n\nW Schwingen punkty przyznaje się nie tylko za zwycięstwo. Jeśli dwóch przeciwników remisuje, ale stoczy atrakcyjną walkę, otrzymują o 0,25 punktu więcej niż w przypadku nudnego pojedynku. Nawet jeśli przegrasz, ale walczysz odważnie i dobrze, otrzymujesz o 0,75 punktu więcej."
 swiss_flavor_events.21.f9: "\n\nDo najbardziej prestiżowych Schwingfeste należą „Bergschwingfeste”, które odbywają się w górach. Są to festyny ludowe, podczas których można również usłyszeć tradycyjną muzykę. Najbardziej znane Bergschwingfeste to „Stoos-Schwinget”, „Rigi Schwing- und Älplerfest”, „Brünigschwinget”, „Schwarzsee-Schwinget”, „Weissenstein-Schwinget” oraz „Schwägalp-Schwinget”."
 dufour.2001.g: "Gratulacje!"
