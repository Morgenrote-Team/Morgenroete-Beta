 je_dufour_carte_dufour: "Mapa topograficzna Szwajcarii"
 je_dufour_carte_dufour_reason: "Od 1822 roku pomiary geodezyjne należą do kompetencji Konfederacji Szwajcarskiej, a nie kantonów. Generał Dufour otrzymał zadanie przeprowadzenia pomiarów Szwajcarii według jednolitych standardów i naniesienia ich wyników na mapę. Zajmie to dużo czasu i będzie nieco kosztować, ale pomoże w dalszym rozwoju Szwajcarii."
 je_dufour_carte_dufour_goal: "Pomiary zostały zakończone, a mapa opublikowana."
 dufour_creating_carte_dufour_modifier: "Tworzenie Carte Dufour"
 dufour.900.t: "Publikacja Carte Dufour"
 dufour.900.d: "Po latach ciężkiej pracy mapa topograficzna Szwajcarii została wreszcie ukończona, a wszystkie 25 arkuszy zostało już opublikowanych lub zostanie opublikowanych w najbliższym czasie."
 dufour.900.f: "Wreszcie można zobaczyć pierwszy wydruk Carte Dufour. Cienkie linie przedstawiają góry, miasta, a nawet domy. Nigdy wcześniej nie istniała tak dokładna mapa Szwajcarii!\n\n#b Historycznie #! Dufour i jego zespół pracowali nad mapą od 1832 do 1865 roku. Pierwsze dwa arkusze opublikowano w 1845 roku, a ostatni z 25 arkuszy ukazał się w 1865 roku. Mapę topograficzną wydrukowano techniką miedziorytniczą w skali 1:100 000. Co ciekawe, Dufour był pierwszym generałem współczesnej Szwajcarii i dowodził armią szwajcarską przeciwko Sonderbundowi podczas szwajcarskiej wojny domowej (Sonderbundskrieg) w 1848 roku.\n\n#b Dzisiaj #! Carte Dufour znajduje się w Schweizer Landesmuseum w Zurychu. Mapę można jednak znaleźć również w internecie, ponieważ została udostępniona wraz z wieloma innymi mapami narodowymi Szwajcarii."
 dufour.900.g: "Powinniśmy nazwać górę imieniem Dufoura!"
 dufour_carte_dufour_modifier: "Carte Dufour"
