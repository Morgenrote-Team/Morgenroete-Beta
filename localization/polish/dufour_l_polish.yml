 dufour.901.t: "Mieszkańcy zaniepokojeni pomiarami"
 dufour.901.d: "Podczas prac pomiarowych w [SCOPE.sState('dufour_mapping_scope').GetName] nasi geodeci popadli w konflikt z wiejskimi mieszkańcami regionu. Najwyraźniej swoją pracą zakłócali pogrzeb."
 dufour.901.f: "„Najlepiej już idźcie! Nie słyszeliście? Nie potrzebujemy waszej mapy, zawsze sami potrafiliśmy znaleźć drogę do domu!”"
 dufour.901.g: "Moje kondolencje."
 dufour.901.h: "Kontynuuj!"
 dufour.902.t: "Geodeta zginął w górach"
 dufour.902.d: "Podczas prowadzenia pomiarów z jednego z wysokich szczytów [SCOPE.sState('dufour_mapping_scope').GetName] nasi geodeci zostali zaskoczeni przez burzę. Szalała burza i lał deszcz. Geodeci schronili się w namiocie, ale uderzenie pioruna zabiło jednego z nich i zraniło drugiego."
 dufour.902.f: "„Piorun trafił mnie w nogę, ale po kilku dniach poczułem się lepiej. W końcu udało mi się zejść z góry i dotrzeć w bezpieczne miejsce. To była prawdziwa gehenna!”"
 dufour.902.g: "Mój Boże!"
 dufour.903.t: "Mieszkańcy pomagają geodetom"
 dufour.903.d: "Nasi geodeci omal nie zgubili się w [SCOPE.sState('dufour_mapping_scope').GetName], ale kilku miejscowych zdołało im pomóc, a nawet zaoferowało nocleg i wskazało najszybsze szlaki. To z pewnością pomoże szybciej ukończyć mapę!"
 dufour.903.f: "„Popracować możecie później. Najpierw musimy się razem napić. To nasz najlepszy Kirsch!”"
 dufour.903.g: "Doceniamy pomoc!"
 dufour.904.t: "Sprzęt utracony!"
 dufour.904.d: "Jeden z naszych geodetów zgubił swój sprzęt podczas wspinaczki na górę w [SCOPE.sState('dufour_mapping_scope').GetName]. Albo zapewnimy mu nowy sprzęt, albo postęp prac zostanie spowolniony."
 dufour.904.f: "„Po prostu spadł... Nie mogłem go utrzymać... Kto by pomyślał, że trzeba przymocować sprzęt do plecaków?”"
 dufour.904.g: "Muszą sobie z tym poradzić."
 dufour.904.h: "Zdobądź nowe instrumenty!"
 dufour.905.t: "Blüemlisalp albo Frau"
 dufour.905.d: "Mieszkańcy [SCOPE.sState('dufour_mapping_scope').GetName] używają dwóch nazw dla tej samej góry: Blüemlisalp i Frau. Którą nazwę powinniśmy wybrać?"
 dufour.905.f: "„Nie możemy po prostu rzucić monetą?”"
 dufour.905.g: "Blüemlisalp!"
 dufour.905.h: "Frau!"
 dufour.906.t: "Geodeta przyspiesza prace nad mapą"
 dufour.906.d: "Dzięki wsparciu [SCOPE.sCharacter('surveyor_scope').GetFullName], znanego geodety, prace nad stworzeniem mapy topograficznej znacznie przyspieszyły."
 dufour.906.f: "„Tak, ten przyrząd służy do pomiarów, a nie do gapienia się w gwiazdy.”"
 dufour.906.g: "Świetna robota!"
 dufour.907.t: "Matematyk pomaga w obliczeniach"
 dufour.907.d: "[SCOPE.sCharacter('mathematician_scope').GetFullName], który ma wykształcenie matematyczne, pomógł naszemu zespołowi w rozwiązaniu różnych obliczeń. Dzięki temu mapa zostanie ukończona szybciej."
 dufour.907.f: "„Kto by pomyślał, że matematyka jest naprawdę przydatna!”"
 dufour.907.g: "Dobrze, że mamy matematyków!"
 dufour.908.t: "Lot balonem inspiruje artystów"
 dufour.908.d: "Dzięki [SCOPE.sCharacter('balloonist_scope').GetFullName], znanemu baloniarzowi, kilku artystów i geodetów mogło zobaczyć świat z góry. Artyści zostali zainspirowani zapierającym dech w piersiach widokiem i mają teraz bardziej realistyczne wyobrażenie o tym, jak przedstawić nasz kraj na mapie."
 dufour.908.f: "„O Boże! Mam nadzieję, że się nie rozbijemy!”"
 dufour.908.g: "Widok świata z góry robi ogromne wrażenie!"
 dufour.910.t: "Opublikowano pierwsze arkusze: Jura i Bazylea"
 dufour.910.d: "Opublikowano pierwsze arkusze naszej nowej mapy topograficznej. Obejmują one okolice Bazylei i Jury."
 dufour.910.f: "Jura to pasmo niewielkich gór rozciągające się od Sabaudii aż po Bazyleę, a jego pogórze sięga nawet Jeziora Bodeńskiego. Obejmuje części Vaud, Neuchâtel, Berna, obu Bazylei, Solury i Argowii. W pobliżu Jury znajduje się wiele dużych miast.\nBazylea na przykład jest jednym z najważniejszych miast Szwajcarii. Graniczy zarówno z Alzacją, jak i Badenią, a dzięki Renowi ma dobre połączenia komunikacyjne.\nZaledwie kilka lat temu kanton Bazylea został podzielony na kantony Basel Stadt (Miasto) i Basel Land (Wieś). Co ciekawe, w tamtym okresie bardziej liberalne były tereny wiejskie, podczas gdy miastem rządzili patrycjusze. Bazylea ma dość międzynarodowy charakter i posiada stary uniwersytet, z którym związani byli wybitni myśliciele, tacy jak Leonhard Euler i Daniel Bernoulli.\nGenewa natomiast jest dużym miastem otoczonym przez Francję. Za panowania Napoleona należała do Francji, a do Szwajcarii powróciła w 1815 roku. Obecnie powstają tam pierwsze prywatne banki i Genewa powoli staje się centrum sektora finansowego. Ponadto była domem Voltaire'a i Jean-Jacques'a Rousseau, dwóch z największych filozofów związanych ze Szwajcarią."
 dufour.910.g: "Interesujące!"
 dufour.910.h: "Nie chcę nic słyszeć o Szwajcarii!"
 dufour.910.no_more_information_tt: "Nie będziesz #n już#! otrzymywać wydarzeń, które jedynie opisują Szwajcarię i nie mają żadnych efektów."
 dufour.911.t: "Opublikowano nowe arkusze: Szafuza, Turgowia i St. Gallen"
 dufour.911.d: "Opublikowano kolejne arkusze. Tym razem skupiają się one na północnej i wschodniej Szwajcarii, obejmując kantony Szafuza, Turgowia i St. Gallen."
 dufour.911.f: "Szafuza leży w północno-wschodniej Szwajcarii i jest niemal całkowicie otoczona przez Niemcy. Samo miasto położone jest tuż nad Renem i bardzo blisko wodospadów Renu w Neuhausen. Dzięki energii rzeki Szafuza mogła dość wcześnie się uprzemysłowić, a dzięki ludności wiejskiej w 1831 roku stała się liberalnym kantonem.\nTurgowia była zarządzana przez inny kanton, który zmieniał się co roku, aż do czasu, gdy rewolucja francuska dotarła do Szwajcarii. Od 1815 roku jest pełnoprawnym kantonem oraz ośrodkiem przemysłu włókienniczego i rolnictwa. Duża liczba grusz zaowocowała przydomkiem „Mostindien”, czyli „Cydrowe Indie”, będącym grą słów między Ost (wschód) a Most (cydr). Turgowia od 1831 roku należy do liberalnych kantonów i opowiada się za większą centralizacją Szwajcarii.\nSt. Gallen jest kantonem podzielonym pod względem religijnym i niegdyś było siedzibą klasztoru oraz księstwa biskupiego. Jest ośrodkiem przemysłu włókienniczego i liberalnym kantonem. Kanton St. Gallen otacza oba kantony Appenzell oraz charakterystyczne pasmo Säntis, będące częścią Alp."
 dufour.912.t: "Opublikowano nowe arkusze: Gryzonia i Alpy Retyckie"
 dufour.912.d: "Opublikowano kolejne arkusze. Tym razem skupiają się one na rozległym kantonie Gryzonia i Alpach Retyckich."
 dufour.912.f: "Gryzonia jest nie tylko największym kantonem Szwajcarii, ale także ojczyzną ludności retoromańskojęzycznej, stanowiącej mniejszość w Szwajcarii i jedną z grup posługujących się alpejskimi językami romańskimi, spotykanymi również w Południowym Tyrolu i Friuli.\nGryzonia jest słabo zaludniona, ponieważ dominuje w niej krajobraz alpejski, w szczególności Alpy Retyckie, nazwane od starożytnych plemion Retów. Gryzonia jest przede wszystkim kantonem rolniczym, który czerpie również korzyści z transportu towarów przez przełęcze alpejskie. Utrata części ziem, należących dziś do Włoch, po wojnach napoleońskich była katastrofą, ale Gryzonia nadal posiada obszary zamieszkane w większości przez ludność włoskojęzyczną, co czyni ją kantonem z trzema grupami językowymi: niemiecką, retoromańską i włoską.\nPod względem politycznym Gryzonia jest zdominowana przez swoje gminy, które posiadają dużą władzę. Ostatnio jednak na znaczeniu zyskały siły liberalne, które chcą większej centralizacji kantonu."
 dufour.913.t: "Opublikowano nowe arkusze: Szwajcaria Centralna"
 dufour.913.d: "Opublikowano kolejne arkusze. Tym razem skupiają się one na licznych kantonach Szwajcarii Centralnej."
 dufour.913.f: "Szwajcaria Centralna jest kolebką „Eidgenossenschaft”, czyli Konfederacji Szwajcarskiej. Początkowo kantony Uri, Schwyz i Unterwalden (dziś podzielony na Nidwalden i Obwalden) utworzyły luźny sojusz, który później stopniowo rozszerzano.\nGłówną gałęzią gospodarki wielu małych kantonów Szwajcarii Centralnej był transport towarów, przede wszystkim szlakiem przez Przełęcz Świętego Gotarda. Poza tym istotne znaczenie w regionie miały rolnictwo, wyrąb lasów oraz pewna produkcja tekstylna.\nPod względem politycznym Szwajcaria Centralna była zdominowana przez konserwatywnych katolików. Kanton Lucerna był najbardziej liberalny spośród kantonów Szwajcarii Centralnej dzięki miastu Lucerna, natomiast mniejsze kantony Uri, Schwyz, Obwalden i Nidwalden, Glarus oraz Zug były jeszcze bardziej konserwatywne i zdominowane przez lokalne elity.\nSchwyz omal nie został podzielony na dwa kantony w latach 30. XIX wieku, gdy zewnętrzne części kantonu zażądały równości i udziału w życiu politycznym. Po zajęciu wewnętrznej części Schwyz przez wojska Tagsatzung („rządu” Szwajcarii) ostatecznie zgodzono się na te postulaty i Schwyz pozostał jednym kantonem."
 dufour.914.t: "Opublikowano nowe arkusze: Ticino"
 dufour.914.d: "Opublikowano kolejne arkusze. Tym razem skupiają się one na najbardziej wysuniętym na południe kantonie Szwajcarii, Ticino."
 dufour.914.f: "Ticino jest jedyną pozostałą posiadłością Konfederacji Szwajcarskiej we Włoszech. Jako ziemie podbite w XV i XVI wieku obszar ten pozostawał pod władzą dawnych kantonów aż do utworzenia Republiki Helweckiej. Od 1803 roku jest jednak pełnoprawnym kantonem.\nDominującymi sektorami gospodarki Ticino były rolnictwo i wyrąb lasów. Dochodowym zajęciem była również produkcja jedwabiu. W Ticino można było uprawiać produkty rolne, które nie rosły w innych częściach Szwajcarii, na przykład kasztany, tytoń, morwy na potrzeby produkcji jedwabiu oraz różne owoce.\nW 1830 roku Ticino było jednym z pierwszych kantonów, które uzyskały liberalną konstytucję. Sytuacja polityczna w kantonie jest jednak niestabilna, ponieważ liberałowie chcą większej centralizacji państwa, podczas gdy konserwatyści opowiadają się za autonomią regionalną."
 dufour.915.t: "Opublikowano nowe arkusze: Berno i Fryburg"
 dufour.915.d: "Opublikowano kolejne arkusze. Tym razem skupiają się one na Bernie i Fryburgu."
 dufour.915.f: "Zarówno kanton Berno, jak i kanton Fryburg mają części francusko- i niemieckojęzyczne. Berno jest ogromnym kantonem, podczas gdy Fryburg jest znacznie mniejszy. Berno rozciąga się od pasma Jury aż po Alpy na południu. Fryburg leży na zachód od Berna i obejmuje miejscowości takie jak Fryburg i Gruyère, skąd pochodzi dobrze znany ser.\nKanton Berno jest zdominowany głównie przez rolnictwo, ale zegarmistrzostwo powoli rozprzestrzeniło się z sąsiedniego Neuchâtel do Jury Berneńskiej. Miejmy nadzieję, że industrializacja wkrótce pomoże w rozwoju kantonu.\nPod względem politycznym Berno przez długi czas było zdominowane przez patrycjuszy z samego miasta, ale w latach 30. XIX wieku liberałom z mniejszych miast kantonu udało się opracować nową konstytucję, która równoważyła prawa mieszkańców Berna i ludności wiejskiej.\nFryburg jest kantonem zdominowanym przez rolnictwo, zwłaszcza produkcję zbóż i sera. Szczególnie dobrze znany jest ser z Gruyère.\nPod względem politycznym Fryburg był zdominowany przez konserwatywnych patrycjuszy i duchowieństwo. Nawet po wprowadzeniu nowej konstytucji w 1831 roku kanton pozostał konserwatywny, a w wyborach konserwatyści nadal zdobywali większość głosów."
 dufour.916.t: "Opublikowano nowe arkusze: Zurych i Argowia"
 dufour.916.d: "Opublikowano kolejne arkusze. Tym razem skupiają się one na Zurychu i Argowii."
 dufour.916.f: "Zarówno Zurych, jak i Argowia leżą na północy Szwajcarii, głównie na stosunkowo płaskiej Wyżynie Szwajcarskiej. Oba kantony szybko się industrializują i wkrótce mogą stać się potęgami przemysłowymi.\nZurych jest jednym ze starych kantonów i przez długi czas pozostawał zdominowany przez samo miasto. Zurych jest ośrodkiem zmechanizowanego przemysłu włókienniczego oraz przemysłu maszynowego. Wiele fabryk znajduje się nad rzekami i czerpie z nich energię.\nPod względem politycznym Zurych był zdominowany przez patrycjuszy miejskich aż do lat 1830–1831, kiedy ludność wiejska wymusiła uchwalenie nowej konstytucji. W kolejnych wyborach liberałowie i radykałowie zdobyli większość i obecnie dominują w polityce Zurychu.\nArgowia była rządzona przez inne kantony aż do czasów Republiki Helweckiej. Teraz, jako pełnoprawny kanton, szybko się industrializuje, zwłaszcza dzięki fabrykom włókienniczym. Liczne rzeki Argowii pozwalały fabrykom czerpać energię z wody i sprzyjały rozwojowi wielu rozproszonych zakładów przemysłowych.\nArgowia stanowiła w zasadzie przeciwwagę dla kantonów Zurych i Berno i omal nie została pozbawiona statusu pełnoprawnego kantonu w latach 1814–1815. Nawet po 1815 roku Argowia pozostała dość liberalna, w przeciwieństwie do innych kantonów. W 1831 roku nowa konstytucja przyznała ludności jeszcze więcej praw. Na opór katolickiej ludności wobec zwiększonej kontroli państwa nad Kościołem rząd odpowiedział zajęciem zbuntowanych regionów."
 dufour.917.t: "Opublikowano nowe arkusze: Vaud i Valais"
 dufour.917.d: "Opublikowano kolejne arkusze. Tym razem skupiają się one na Vaud i Valais."
 dufour.917.f: "Valais to rozległa dolina na samym południu Szwajcarii, w dużej mierze oddzielona od reszty kraju przez Alpy. Przez dolinę przepływa Rodan, który następnie wpada do Jeziora Genewskiego. Północny brzeg jeziora należy do Vaud, ale kanton rozciąga się od Genewy i Alp aż po Jurę.\nVaud nadal jest zdominowane przez rolnictwo, ale od 1826 roku liberałowie zaczęli wprowadzać zmiany mające pobudzić rozwój przemysłu. Czas pokaże, czy Vaud pozostanie kantonem rolniczym, czy stanie się ośrodkiem przemysłowym.\nDzięki umiejętnej dyplomacji kanton Vaud został utrzymany po klęsce Napoleona. W zamian musiał jednak zaakceptować bardziej konserwatywną konstytucję. Autorytarne rządy sprawiły, że liberałowie zyskali na znaczeniu i w 1830 roku zdołali przeforsować nową konstytucję. W międzyczasie coraz większe wpływy zdobywali radykałowie, którzy dążyli do dalszej demokratyzacji.\nValais jest zdominowane przez rolnictwo i ludność wiejską. Nie ma tam znaczącego przemysłu, a kontakty zewnętrzne są ograniczone.\nGłówny konflikt polityczny w Valais przebiegał między niemieckojęzycznym Górnym Valais a francuskojęzycznym Dolnym Valais. Górne Valais pozostawało dominującą częścią kantonu, mimo że Dolne Valais miało większą liczbę mieszkańców. Pytanie brzmi, czy liberałowie i radykałowie z dolnej części doliny będą w stanie doprowadzić do demokratyzacji Valais, czy też dawne siły zdołają ustabilizować swoje rządy."
 dufour.920.t: "Coraz więcej głosów opowiada się za przywróceniem koziorożca do Szwajcarii"
 dufour.920.d: "Robert Mader, hotelarz i właściciel hotelu „Walhalla” w St. Gallen, chce przywrócić koziorożca alpejskiego do Szwajcarii. Proponuje utworzenie parku zwierząt w St. Gallen, gdzie przygotowałby wybieg do hodowli koziorożców, aby później wypuścić je z powrotem na wolność."
 dufour.920.f: "„Koziorożec jest narodowym symbolem Szwajcarii. Musimy go przywrócić!”"
 dufour.920.g: "Przywrócimy koziorożca!"
 dufour.920.h: "Co za strata czasu!"
