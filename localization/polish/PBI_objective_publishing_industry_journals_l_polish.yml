 pbi_je_objective_bestseller: "Popularna powieść gazetowa"
 pbi_je_objective_bestseller_reason: "„Jak powszechnie wiadomo, działalność spekulacyjna niewiele lub zgoła nic nie wie o duchowej wartości sprzedawanych towarów. Dopóki towary dobrze się sprzedają, a interes przynosi zyski, nie ma znaczenia, czy zdrowie publiczne zostaje przez to poprawione, czy pogorszone. Ze swej natury spekulacja jest ślepa i niewrażliwa, sprzedając Chińczykom opium, a Francuzom powieści.”\nCzłonek Francuskiej Izby Deputowanych"
 pbi_je_objective_bestseller_flag_character_in_writing: "Istnieje [concept_character] z kraju [THIS.GetCountry.GetName], który pisze powieść w odcinkach."
