 pbi_je_objective_from_the_battlefield_reason: "„O godzinie 11:35 przed tymi krwawymi moskiewskimi działami nie pozostał już żaden brytyjski żołnierz, poza zabitymi i rannymi…”\nWilliam Howard Russell (Szarża Lekkiej Brygady)"
 pbi_je_objective_from_the_battlefield_goal: "Upływa pewien okres czasu, podczas którego utrzymywany jest [concept_front] poza krajem."
