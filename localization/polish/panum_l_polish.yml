 je_panum_measles: "Epidemia odry"
 je_panum_measles_reason: "Odra jest wysoce zaraźliwą chorobą znaną z charakterystycznych czerwonych plam na skórze. Może mieć katastrofalne konsekwencje, szczególnie w populacjach pozbawionych wcześniejszej odporności. Jako choroba ponadregionalna odra może rozprzestrzeniać się na inne obszary.\n\nWynalezienie #ORANGE antybiotyków#! ma szczególne znaczenie w walce z odrą. Dzięki tej technologii [concept_panum_physician] może znaleźć #V Leczenie odry#!. Tylko bardzo dobry system opieki zdrowotnej może pomóc. Wszystko to prowadzi do lepszej profilaktyki i leczenia choroby.\n\nNiestety wynalezienie #V szczepionki przeciwko odrze#! wykracza poza ramy czasowe epoki wiktoriańskiej."
 je_panum_scarlet: "Epidemia szkarlatyny"
 je_panum_scarlet_reason: "Szkarlatyna jest powszechną chorobą, która do początku XX wieku była jedną z najczęstszych przyczyn śmierci wśród dzieci.\n\nWynalezienie #ORANGE antytoksyn#! ma szczególne znaczenie w walce ze szkarlatyną. Dzięki tej technologii [concept_panum_physician] może znaleźć #V Leczenie szkarlatyny#!. Dobry system opieki zdrowotnej pomoże. Wszystko to prowadzi do lepszej profilaktyki i leczenia choroby.\n\nOpracowanie #V szczepionki przeciwko szkarlatynie#! przez [concept_theiler_biologist] jest możliwe, ale bardzo trudne."
 je_panum_plague: "Epidemia dżumy"
 je_panum_plague_reason: "Dżuma jest utożsamiana ze „Śmiercią Czarną” z czasów średniowiecza, która jest jedną z najgorszych katastrof w historii. Uważano, że zniknęła, dopóki nie pojawiła się ponownie pod koniec XIX wieku. W krajach o niskim poziomie zamożności i słabych systemach opieki zdrowotnej dżuma może rozprzestrzeniać się na wiele obszarów.\n\nWynalezienie #ORANGE Antytoksyn#! ma szczególne znaczenie w walce z dżumą. Dzięki tej technologii [concept_panum_physician] może znaleźć #V Leczenie dżumy#!. Już podstawowy system opieki zdrowotnej będzie pomocny. Wszystko to prowadzi do lepszego zapobiegania i leczenia choroby.\n\nAby raz na zawsze pokonać dżumę, potrzebna jest #V Szczepionka przeciwko dżumie#! opracowana przez [concept_theiler_biologist]."
 je_panum_diphteria: "Epidemia błonicy"
 je_panum_diphteria_reason: "Błonica jest niebezpieczną chorobą, która może prowadzić do zagrażających życiu powikłań i długotrwałych konsekwencji. Ze względu na śmiertelność wśród dzieci oraz problemy z oddychaniem z nią związane, błonica nosi przydomek „anioła dusiciela dzieci”. Skutki choroby pozostają ograniczone do danego obszaru.\n\nWynalezienie #ORANGE antytoksyn#! ma szczególne znaczenie w walce z błonicą. Dzięki tej technologii [concept_panum_physician] może znaleźć #V Leczenie błonicy#!. Pomoże tylko dobry system opieki zdrowotnej. Wszystko to prowadzi do lepszej profilaktyki i leczenia choroby.\n\nAby pokonać błonicę raz na zawsze, potrzebna jest #V szczepionka przeciwko błonicy#! opracowana przez [concept_theiler_biologist]."
 je_panum_polio: "Polio"
 je_panum_polio_reason: "Poliomyelitis is a disease that primarily affects children, often resulting in death or lifelong physical complications. While it only occurred sporadically in the past, polio became endemic during the 19th century. Polio does not spread beyond the state where it occurs.\n\nThe invention of #ORANGE Antitoxins#! has particular significance in combating polio. With this technology, a `[concept_panum_physician]` can find a #V Treatment for Polio#!. Only a good health system will help. This all leads to better prevention and cure of the disease.\n\nUnfortunately, the invention of a #V Vaccine against Polio#! is beyond the scope of the Victorian time frame."
