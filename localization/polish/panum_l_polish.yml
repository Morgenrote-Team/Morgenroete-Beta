 panum.61.t: "Zespół medyczny opuszcza kraj"
 panum.61.d: "Po tym, jak asystenci naukowi zapoznali naszych lokalnych lekarzy z nowoczesnymi metodami leczenia z kraju naszego zwierzchnika, żegnają się i wracają do swojej ojczyzny."
 panum.61.f: "„Jedyną rzeczą, która będzie miała znaczenie, gdy odejdziemy, będą ślady miłości, które po sobie zostawiliśmy.” — Albert Schweitzer"
 panum.61.g: "Nasz zwierzchnik się o nas troszczy?"
 panum.62.t: "Zespół szczepień medycznych opuszcza kraj"
 panum.62.d: "Po tym, jak asystenci naukowi zapoznali naszych lokalnych lekarzy z nowoczesnymi szczepionkami z kraju naszego zwierzchnika, żegnają się i wracają do swojej ojczyzny."
