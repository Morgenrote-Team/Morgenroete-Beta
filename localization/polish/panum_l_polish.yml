 je_panum_cholera_treatment_reason: "Dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] bada obecnie kilku pacjentów, aby ustalić przyczynę #YELLOW cholery#!. Tylko poznanie prawdziwych przyczyn występowania tej choroby pozwoli opracować środki zapobiegawcze, które doprowadzą do stworzenia nowoczesnej metody leczenia. Po zakończeniu pracy lekarz przedstawi swoje wnioski opinii publicznej. Nie zapobiegnie to przyszłym epidemiom — do tego konieczne jest zidentyfikowanie patogenu i być może opracowanie szczepionki — ale skutki kolejnej epidemii będą znacznie łagodniejsze."
