 je_panum_medical_system_project: "Rozwiń system medyczny"
 je_panum_medical_system_project_reason: "Lekarz, który ma za zadanie rozbudować system medyczny, działa przede wszystkim lokalnie, aby poprawić opiekę zdrowotną. Potrzebna jest jednak również infrastruktura administracyjna. Pomocny jest tutaj lekarz z korzystnymi talentami, które robią wrażenie na biurokracji. Jego umiejętności i doświadczenie napędzają miesięczny postęp w tworzeniu i budowie nowych szpitali oraz klinik.\n\nLekarze najpierw będą próbowali zakładać kliniki na szczególnie dobrze rozwiniętych obszarach, zanim zwrócą się ku klinikom w mniej rozwiniętych regionach. Lekarze będą preferować region, który posiada najwyższy poziom budynków administracyjnych.\n\nZa każdym razem, gdy pasek postępu się wypełni, nowa klinika/szpital zostaje aktywowana, a praca jest kontynuowana w kolejnym odpowiednim regionie. Lekarze będą aktywować tyle klinik i szpitali jako metod produkcji, ile będzie możliwe, aż albo nie pozostaną żadne regiony spełniające wymagania, albo praca zostanie zatrzymana ręcznie."
 panum.2101.t: "System medyczny rozbudowany"
 panum.2101.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zakończył swoją pracę i rozbudował oraz zmodernizował lokalne placówki medyczne. Doktor jest teraz ponownie dostępny do innych działań."
 panum.2101.f: "„Medycyna jest nauką społeczną, a polityka to nic innego jak medycyna na wielką skalę.” — Rudolf Virchow"
 panum.2101.g: "Wracajmy do pracy."
 panum.2102.t: "Klinika specjalistyczna w [SCOPE.sState('panum_clinic_state').GetName]"
 panum.2102.d: "Dzięki gorliwej pomocy doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] w [SCOPE.sState('panum_clinic_state').GetCityHubName] powstała pierwsza klinika specjalistyczna w naszym kraju. Doktor ogłosił, że [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] będzie nią zarządzać [ROOT.Var('panum_physician_var').GetCharacter.GetHerselfHimself] i specjalizować się w jednej dziedzinie — chociaż nie jest jeszcze jasne, na czym specjaliści powinni się skupić."
 panum.2102.f: "„Edukacja medyczna nie istnieje po to, aby zapewnić studentowi sposób na zarabianie na życie, lecz aby zapewnić zdrowie społeczności.” — Rudolf Virchow"
 panum.2102.g: "Chirurgia"
 panum.2102.h: "Psychiatria"
 panum.2102.i: "Epidemiologia"
 panum.2102.j: "Medycyna wojskowa"
 panum.2102.k: "Medycyna ogólna"
 panum.2103.t: "Szpital w [SCOPE.sState('panum_clinic_state').GetName]"
 panum.2103.d: "Dziś, przy wielkim zainteresowaniu społecznym i obecności prasy, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] otworzył w [SCOPE.sState('panum_clinic_state').GetCityHubName] pierwszy nowoczesny szpital w kraju, który dzięki salom operacyjnym i nowoczesnemu wyposażeniu medycznemu zapowiada przełomowy moment."
 panum.2103.f: "„Przekleństwem ludzkości jest to, że poprzez przyzwyczajenie uczy się tolerować nawet najstraszniejsze sytuacje.” — Rudolf Virchow"
