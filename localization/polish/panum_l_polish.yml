 panum.165.t: "Serce zakażenia"
 panum_physician_health_bonus_modifier: "Lepiej dmuchać na zimne"
 panum.168.f: "„Stać! Kto się tu włóczy o tej porze... Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName]! Co pan robi tak późno?”\n\n„Mam pacjentów do odwiedzenia, a oni nie mogą czekać do wschodu słońca. Każda minuta jest cenna, nawet ta po północy”.\n\n„Wielkie nieba! Te ulice nie są bezpieczne nocą!”\n\n„Za dnia również nie są bezpieczne, przynajmniej dopóki nie uporamy się z tą cholerą. Proszę mi wybaczyć, panie posterunkowy, ale mam jeszcze wiele pracy, zanim zabraknie mi oliwy w latarni. Muszę napełnić kilkanaście fiolek wodą z kanałów i pomp, odwiedzić domy i zbadać rowy”.\n\n„Ano tak, no dobrze. Nie robi pan nic złego, ale mimo wszystko lepiej będzie, jeśli zapewnię panu eskortę”."
 panum.3033.d: "Zdecydowana większość członków Czerwonego Krzyża zgodziła się na przyjęcie Trzeciej Międzynarodowej Konwencji o Użyciu Broni Chemicznej. Od teraz jest ona wiążąca dla wszystkich członków."
 notification_panum_technology_boost_from_physician_notification_name: "Przyspieszenie badań nad [GetPlayer.MakeScope.GetCountry.GetCustom('panum_medical_research_next_technology_type')]"
 notification_panum_technology_boost_from_physician_notification_desc: "Dzięki doktorowi [GetPlayer.MakeScope.GetVariable('panum_physician_var').GetCharacter.GetLastName] badania nad [GetPlayer.MakeScope.GetCountry.GetCustom('panum_medical_research_next_technology_type')] zostały przyspieszone."
 je_panum_medical_research_project_reason: "[ROOT.GetCountry.GetCustom('panum_medical_research_project_active_type')] Oprócz opracowywania innowacji medycznych [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] może również odkrywać metody leczenia chorób, które nie należą do dziesięciu klasycznych chorób epidemicznych.\n\nJest to domyślny projekt [concept_panum_physician]. Jest aktywny, gdy lekarz nie zajmuje się innym projektem.\nZa każdym razem, gdy postęp osiągnie [JournalEntry.GetTotalGoalValue|V0], otrzymamy niewielkie przyspieszenie badań nad technologią.\n\nTechnologia, której dotyczy następne przyspieszenie badań: [GetPlayer.MakeScope.GetCountry.GetCustom('panum_medical_research_next_technology_type')]"
 panum.2611.t: "Instytucjonalizacja"
 panum.2611.d: "W obliczu niedopuszczalnych warunków panujących w niektórych zakładach psychiatrycznych lekarze i politycy domagają się reformy stosowanych tam praktyk. Opowiadają się za tworzeniem odosobnionych placówek, w których psychiatrzy mogliby prowadzić spokojne, odizolowane życie wraz ze swoimi pacjentami, z dala od miejskiego zgiełku."
 panum.2611.f: "Współczesna era zinstytucjonalizowanej opieki nad osobami chorymi psychicznie rozpoczęła się na początku XIX wieku wraz z zakrojonymi na szeroką skalę działaniami państwa. W Wielkiej Brytanii zaczęto tworzyć publiczne zakłady psychiatryczne po uchwaleniu ustawy o zakładach dla osób chorych psychicznie z 1808 roku (County Asylums Act). Ustawa ta upoważniała lokalnych urzędników sądowych do budowania w każdym hrabstwie zakładów finansowanych z podatków lokalnych, przeznaczonych dla licznych ubogich osób chorych psychicznie. Ważnym przełomem w leczeniu chorób psychicznych była ustawa z 1845 roku (Lunacy Act 1845), która wyraźnie zmieniła status osób chorych psychicznie, uznając je za pacjentów wymagających leczenia. Na mocy tej ustawy powołano Komisję ds. Chorób Psychicznych, na której czele stanął lord Shaftesbury, a której zadaniem było reformowanie przepisów dotyczących opieki psychiatrycznej. Warto również wspomnieć o „Ogólnym Czasopiśmie Psychiatrii”, które w latach 1830–1860 pełniło funkcję organu niemieckiej psychiatrii instytucjonalnej. Czasopismo zostało założone w 1844 roku przez Heinricha Damerowa wspólnie z Carlem Friedrichem Flemmingiem i Christianem Friedrichem Wilhelmem Rollerem."
 panum.2611.g: "Badania psychiatryczne i psychologiczne czynią postępy."
 panum.2612.t: "Choroba mózgu"
 panum.2612.d: "W psychiatrii teoria ewolucji przynosi znaczące zmiany. Nowe pokolenie psychiatrów głosi, że choroby psychiczne są chorobami mózgu. Psychiatria oparta na metodach naukowych zastępuje dominujące dotychczas podejście humanistyczne."
 panum.2612.f: "Wilhelm Griesinger jest uważany za jedną z najważniejszych postaci naukowego przełomu w psychiatrii. Poznał François Magendiego, twórcę fizjologii eksperymentalnej i autora pierwszego nowoczesnego podręcznika fizjologii, którego podejście badawcze wywarło na niego ogromny wpływ. W 1839 roku przeniósł się do Friedrichshafen nad Jeziorem Bodeńskim, gdzie rozpoczął praktykę lekarską. W następnym roku, 1840, otrzymał propozycję pracy na stanowisku lekarza pomocniczego w zakładzie psychiatrycznym w Winnenthal. W ciągu kolejnych dwóch lat pracy w tej placówce Griesinger zdobył bogate doświadczenie praktyczne, które stało się podstawą jego najważniejszego dzieła „Patologia i terapia chorób psychicznych”, opublikowanego w 1845 roku i zapoczątkowującego nową erę w psychiatrii. W pracy tej podjął próbę oparcia psychiatrii na podstawach fizjologii medycznej i patologii. Na pierwszej stronie dzieła znajduje się słynne stwierdzenie Griesingera, zgodnie z którym zrozumienie każdego objawu chorobowego wymaga ustalenia, gdzie zachodzi dane zjawisko, oraz uznania wszystkich chorób psychicznych za choroby mózgu."
 panum.2613.t: "Klasyfikacja zaburzeń psychicznych"
 panum.2613.d: "Psychiatrzy i psychologowie zaczęli klasyfikować choroby psychiczne według schematu, jaki wcześniej stosowano jedynie w innych dziedzinach medycyny. Podczas gdy dawniej rozróżniano jedynie „niedorozwój umysłowy” i „obłęd”, obecnie wyróżnia się siedem kategorii: manię, melancholię, monomanię, porażenie postępujące, otępienie, dipsomanię i epilepsję."
 panum.2613.f: "System triadyczny niemieckiej tradycji psychiatrycznej to system klasyfikacji chorób psychicznych oparty na ich przyczynach. Jego pierwszy opis pochodzi od Emila Kraepelina, który z kolei opierał się na wcześniejszych pracach Karla Ludwiga Kahlbauma. Kraepelin ogłosił, że znalazł nowy sposób postrzegania chorób psychicznych, określając tradycyjne podejście mianem „objawowego”, a własne jako „kliniczne”. Jego koncepcja okazała się przełomową syntezą setek zaburzeń psychicznych sklasyfikowanych w XIX wieku. Zamiast grupować choroby wyłącznie na podstawie podobieństwa ich głównych objawów, jak czynili to jego poprzednicy, Kraepelin łączył je według zespołów objawów, czyli charakterystycznych wzorców symptomów i ich przebiegu w czasie."
 panum.2614.t: "Terapia rozmową"
 panum.2614.d: "Pomimo licznych zastrzeżeń podejście psychologiczne zyskuje coraz większą popularność wśród psychiatrów. Przypadek młodej kobiety, która najwyraźniej została wyleczona dzięki długotrwałym rozmowom, jest postrzegany jako zwiastun nowego przełomu w leczeniu pacjentów z zaburzeniami psychicznymi."
 panum.2614.f: "Doświadczenia zdobyte przez Josefa Breuera podczas leczenia Berthy Pappenheim (pseudonim: Anna O.) w latach 1880–1881 stały się podstawą „Studiów nad histerią”, opublikowanych wspólnie z Zygmuntem Freudem w 1895 roku. Freud określał to dzieło (oraz opisany w nim przypadek) jako źródło i punkt wyjścia psychoanalizy. W następstwie pionierskich prac Zygmunta Freuda idee wywodzące się z teorii psychoanalitycznej zaczęły również zakorzeniać się w psychiatrii. Teoria psychoanalityczna zyskała popularność wśród psychiatrów, ponieważ umożliwiała leczenie pacjentów w prywatnych gabinetach zamiast przetrzymywania ich w zakładach psychiatrycznych."
 panum.2615.t: "Psychologia i filozofia"
 panum.2615.d: "Oprócz wpływu szkół psychologicznych na psychiatrię coraz większe znaczenie zyskuje również zrozumienie wpływów filozoficznych. Dominacja nauk przyrodniczych wydaje się dobiegać końca."
 panum.2615.f: "Karl Jaspers był jednym z pierwszych psychiatrów XX wieku, którzy podjęli się analizy i refleksji nad filozoficznymi założeniami swojej dyscypliny. Jego „Psychopatologia ogólna” (1913) jest uznawana za początek metodologicznie ugruntowanych badań psychopatologicznych. W rozwoju psychiatrii istotną rolę odegrali również Wilhelm Griesinger, który definiował choroby psychiczne jako choroby mózgu, oraz Emil Kraepelin, który jako pierwszy wprowadził użyteczny system klasyfikacji chorób psychicznych. Jaspers odwoływał się do wczesnych prac Husserla poświęconych psychologii opisowej oraz szeroko dyskutowanego rozróżnienia Wilhelma Diltheya między „wyjaśnianiem” a „rozumieniem”, wzbogacając w ten sposób psychopatologię o nowe podstawy metodologiczne."
 panum.2131.t: "Talerz na wagę zwycięstwa"
 panum.2131.d: "Wraz z odkryciem roli, jaką ubóstwo może odgrywać w rozwoju krzywicy, związkowcy podjęli walkę o bezpłatne posiłki i mleko dla uczniów!"
 panum.2131.f: "Początkowo wszystko rozwijało się powoli – tu i ówdzie przed szkołami zatrzymywały się wozy, z których rozdawano dzieciom mleko, zupę i trochę chleba. Z czasem jednak inicjatywa przerodziła się w coś znacznie większego: związki zawodowe, socjaliści i działacze robotniczy w całym kraju postanowili walczyć nie tylko o prawa proletariatu, ale również o dobro jego dzieci. Na ulicach coraz częściej pojawiają się plakaty przedstawiające dzieci z pustymi miskami i błagalnym spojrzeniem, a niezdolność rządu do zapewnienia opieki najmłodszym i najbardziej bezbronnym obywatelom stała się łatwym argumentem do potępiania zarówno władz, jak i całego systemu.\n\nIdea bezpłatnych posiłków i mleka dla uczniów rozprzestrzenia się niczym pożar, znajdując poparcie nawet w najbardziej radykalnych odłamach ruchu. Jeśli rządowi nie można zaufać w kwestii zapewnienia podstawowych potrzeb dzieciom tego narodu, to komu właściwie ma on służyć?"
 panum.2131.g: "Wywalczymy ustawę o darmowym mleku, tak, wywalczymy, na pewno wywalczymy!"
 panum.2131.h: "Nie ma czegoś takiego jak darmowe mleko."
 panum_free_milk_modifier: "Darmowe mleko"
 panum_no_free_milk_modifier: "Brak darmowego mleka"
 panum_medical_techniques_level_rises_tt: "Poziom Technik Medycznych w [GetPlayer.GetName] wzrasta."
 panum.561.t: "Droga do szczepionki?"
 panum.561.d: "Zgodnie z poleceniem otrzymanym ze stolicy doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] rozpoczął badania nad metodami leczenia, a nawet całkowitego wyleczenia żółtej febry."
 panum.561.f: "„...a jednak zastanawiam się, czy nie wykazałem się zbytnią pewnością siebie, sądząc, że rzeczywiście zdołam pokonać żółtą febrę. Niewiele wiadomo o tej chorobie, a nawet sposób jej przenoszenia pozostaje tajemnicą, nie wspominając już o jej pochodzeniu. Czyżby, jak mogliby niektórzy sugerować, należało powrócić do dawnej teorii miazmatów? Któż może twierdzić, że zna odpowiedzi w obliczu tak wielkiej niewiadomej?\n\nJednak pomimo tych wszystkich tajemnic jedno wiemy na pewno. Nie każdy, kto zetknie się z tą zagadkową, śmiertelną chorobą, pada jej ofiarą. U niektórych zakażenie przebiega niemal bezobjawowo, a wielu innych wraca do zdrowia, zanim choroba zdąży zagrozić ich życiu. Zetknięcie się z żółtą febrą jest niewątpliwie tańcem ze śmiercią, ale nie oznacza, że śmierć musi zwyciężyć...”"
 panum.561.g: "...a jeśli uda nam się powstrzymać ją choćby w jednym miejscu, być może zdołamy powstrzymać ją wszędzie."
 panum.562.t: "Sierociniec"
 panum.562.d: "Badając wszystkie przypadki wyzdrowienia z żółtej febry, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] dotarł do placówki, w której przebywa wyjątkowo wielu ozdrowieńców – sierocińca."
 panum.562.f: "„Ach, dzień dobry. Pani musi być kierowniczką tego sierocińca... Widzę, że dzieci bawiły się dziś farbami”.\n„Proszę mi wierzyć, nie mam pojęcia, skąd je wzięły... Och, pan musi być tym lekarzem, którego wizytę zapowiadano! Obawiam się, że kaszel już im przeszedł, więc nie ma...”\n„Niestety, nie jestem tym lekarzem, proszę pani. Przybyłem ze stolicy, aby zbadać przypadki żółtej febry. Powiedziano mi, że choroba... pojawiła się również tutaj?”\n„Och, tak, wśród naszych maluchów. Bardzo wiele z nich na nią chorowało. Niektóre pochodzą z rodzin, które choroba doszczętnie wyniszczyła, biedactwa. Wygląda jednak na to, że dzieci częściej oszczędza”.\n„Fascynujące. Czy ma pani jakieś przypuszczenia...”\n„Dzieci! Chodźcie, chodźcie! Przyjechał do nas miły pan ze stolicy, który chciałby z wami porozmawiać!”\n„Och... witajcie, dzieci. Nazywam się doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] i chciałbym porozmawiać z wami o żółtej febrze...”"
 panum.562.g: "Dlaczego rodzice umierają, a dzieci przeżywają?"
 panum.563.t_america: "Stara krew"
 panum.563.d_america: "Aby dowiedzieć się więcej o żółtej febrze, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] postanowił odwiedzić rodziny niektórych z pierwszych osadników, którzy przybyli na te ziemie."
 panum.563.f_america: "„...a jednak nie wszystkie rody pierwszych osadników na tych ziemiach wymarły. Nadal istnieją rodziny, które potrafią prześledzić swoje dzieje aż do pierwszych wypraw w te strony, zarówno tych wielkich, jak i niewielkich. To właśnie na tych rodzinach skupiłem swoje badania, ponieważ niektóre z nich wciąż przechowują cenne dzienniki i zapiski, pozwalające nam zajrzeć w przeszłość sprzed czasów prowadzenia rzetelnych archiwów historycznych. Dokumenty te ujawniają coś szczególnie fascynującego: pierwsze przypadki żółtej febry pojawiły się na tych ziemiach około 1685 roku.\n\nJednak od czasu pojawienia się choroby niektórzy z tych wybitnych przedstawicieli [ROOT.GetCountry.GetNameNoFlag] podróżowali za granicę jako odkrywcy i poszukiwacze przygód..."
 panum.563.g_america: "To ta sama choroba. Odporność na jedną oznacza odporność na drugą."
 panum.563.t_africa: "Członkowie plemion"
 panum.563.d_africa: "Aby dowiedzieć się więcej o żółtej febrze, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] postanowił zwrócić się do tych, którzy mają największe doświadczenie z tą chorobą – rdzennych mieszkańców Afryki."
 panum.563.f_africa: "„...a jednak podczas gdy my możemy szybko umrzeć, rdzenni mieszkańcy Afryki potrafią przetrwać. Doskonale znają tę chorobę. Choć bariera językowa stanowi poważną przeszkodę, wystarczy kilka opisów objawów, by zrozumieli, o jakiej chorobie mówię. Czy posiadają naturalną odporność na żółtą febrę, podobnie jak Europejczycy mogą być bardziej odporni na ospę prawdziwą, która spustoszyła obie Ameryki? Być może, lecz osoby pochodzenia afrykańskiego pracujące w naszych miastach umierają równie często jak my. Musi więc istnieć jakiś inny czynnik. Dieta? Kultura?\n\nKluczem może być kontakt z chorobą w dzieciństwie, w społecznościach plemiennych. Możliwe, że już w młodym wieku stykają się z żółtą febrą i dzięki temu nabywają trwałą odporność, podobnie jak przechorowanie ospy krowiej może zapewnić ochronę przed ospą prawdziwą”."
 panum.563.g_africa: "A jeśli można uodpornić ich na tę chorobę... to opracowanie szczepionki również powinno być możliwe."
 panum.564.t: "Natura wroga"
 panum.564.d: "Walka z chorobą wymaga lepszego poznania jej natury, a doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] opracował fascynujący eksperyment."
 panum.564.f: "„...jednak odkąd odkryto, że cholera rozprzestrzenia się za pośrednictwem wody, pojawiła się możliwość zbadania, czy odpowiednia filtracja pozwala usunąć z niej czynniki wywołujące takie choroby. Musiałem trochę poczekać na dostawę, ale w końcu w moje ręce trafił filtr Berkefelda, niezwykłe urządzenie pozwalające filtrować wodę przez ziemię okrzemkową. Jest to niezwykle precyzyjny przyrząd, zdolny do usuwania nawet bakterii. Przygotowałem fiolkę zawierającą krew pobraną od kilku zakażonych osób, rozcieńczyłem ją wodą destylowaną, a następnie przepuściłem przez filtr. Otrzymałem klarowną, czystą ciecz... a przynajmniej tak mi się wydawało.\n\nI tu pojawiło się zaskoczenie: czymkolwiek jest czynnik wywołujący chorobę, zdołał przedostać się przez filtr. Potwierdził to ochotnik na tyle odważny, by zgodzić się na wstrzyknięcie przefiltrowanej cieczy. Zachorował i teraz walczy o życie. Dowodzi to jednak, że żółtej febry nie wywołuje zwykły drobnoustrój, lecz coś jeszcze mniejszego od bakterii, coś, czego nie jesteśmy w stanie zobaczyć.\n\nUznałbym to za niemożliwe, gdybym nie natrafił na wzmiankę o czymś takim w czasopiśmie medycznym. Nazywają to wirusem”."
 panum.564.g: "Poznaj wroga, zniszcz wroga."
 panum.565.t: "Nieuleczalna?"
 panum.565.d: "W nadziei na znalezienie jakichkolwiek oznak skutecznego leczenia doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] odwiedził miejscowe kliniki i szpitale, aby zbadać stosowane w nich metody leczenia."
 panum.565.f: "„Ach, doktorze [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], miło pana poznać! My tutaj, w naszej klinice...”\n„Obawiam się, że musimy pominąć uprzejmości, doktorze. Muszę odwiedzić jeszcze inne kliniki, szpitale i oddziały, w sumie około dwóch tuzinów przed zapadnięciem zmroku. Proszę mi powiedzieć, jak skuteczne są stosowane przez was metody leczenia”.\n„Ach, cóż... stosujemy się do ustalonych wytycznych...”\n„Z powodzeniem? Proszę pozwolić, że zanotuję”.\n„Hmm... niestety bez powodzenia”.\n„Śmiertelność?”\n„Dość... wysoka”.\n„Ilu pacjentów straciliście w tym tygodniu?”\n„Stu siedemdziesięciu sześciu”.\n„Licząc waszą placówkę i sześć poprzednich klinik, daje nam to już znacznie ponad trzy tysiące zgonów. Postępujecie zgodnie z wytycznymi dotyczącymi leczenia, prawda?”\n„Tak, doktorze!”\n„To wyklucza zatem skuteczność ziołolecznictwa, elektroterapii, radioterapii, hydroterapii, medycyny ludowej, współczesnej medycyny i... hmm, właściwie wszystkich znanych nam metod leczenia, włącznie z osłanianiem pacjentów przed nocnym niebem, na wypadek gdyby choroba miała podłoże astrologiczne”.\n„Więc... czy to oznacza, że nie ma żadnego sposobu leczenia, doktorze?”\n„Istotnie, wygląda na to, że jakiekolwiek leczenie najprawdopodobniej nie przyniesie żadnego rezultatu. Wielka szkoda”."
 panum.565.g: "A zatem zmiana taktyki – musimy opracować szczepionkę."
 panum.566.t: "Pierwszy wyłom"
 panum.566.d: "Chociaż jego dotychczasowe badania zakończyły się niepowodzeniem, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] rozpoczął eksperymenty na małpach, próbując opracować szczepionkę."
 panum.566.f: "Dla wielu widok martwej małpy w klatce nie byłby powodem do świętowania, ale dla doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] i [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] zespołu oznaczał niezwykły postęp. Opracowanie szczepionki przeciwko tej straszliwej chorobie wymagało możliwości wywoływania jej w warunkach laboratoryjnych na żądanie. Jednak pomimo wszelkich starań badaczom nie udawało się tego osiągnąć... aż do dzisiaj. Ponieważ małpy i szympansy pochodzące z Afryki wydawały się odporne na tę chorobę, dopiero sprowadzenie makaka z Indii pozwoliło znaleźć odpowiednie zwierzę do badań. Po wstrzyknięciu surowicy pobranej z żył zakażonego człowieka makak zachorował, a ostatecznie zdechł.\n\nNiektórym mogłoby się to wydawać bezsensownym okrucieństwem, ale w tym przypadku oznaczało ogromny krok naprzód. Wreszcie dysponowali zwierzętami, na których mogli przeprowadzać eksperymenty."
 panum.566.g: "Hmm. To jakiś postęp... przynajmniej w zabijaniu małp."
 panum.567.t: "Tajemnica surowicy"
 panum.567.d: "Dysponując już niezawodnym „obiektem doświadczalnym”, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] rozpoczął badania nad możliwością uodparniania za pomocą krwi pobranej od pacjentów powracających do zdrowia."
 panum.567.f: "„1. Transfuzja krwi z makaka do makaka: przeniesienie choroby, brak odporności, makak zdechł. Potwierdza przenoszenie choroby przez krew. Prawdopodobnie jest ona roznoszona przez owady – komary?\n2. Transfuzja krwi z człowieka do makaka: przeniesienie choroby, brak odporności, makak przeżył. Potwierdza możliwość bezpośredniego przenoszenia zakażenia między gatunkami.\n3. Narażenie makaka, który przeżył, na południowoamerykańską i afrykańską odmianę żółtej febry: odporność, makak przeżył. Potwierdza odporność na obie odmiany choroby.\n4. Martwy patogen w surowicy, unieszkodliwiony za pomocą bardzo wysokiej temperatury: nie zapewnił ochrony, makak zdechł po zakażeniu żywym patogenem. Poważne niepowodzenie, wyklucza możliwość opracowania szczepionki opartej na martwym patogenie.\n5. Podanie makakowi surowicy pobranej od pacjenta powracającego do zdrowia: zapobiegło późniejszemu zakażeniu! Obiecujące! Potencjalny punkt wyjścia do opracowania szczepionki?”"
 panum.567.g: "Nie da się zrobić omletu bez rozbicia kilku makaków..."
 panum.568.t: "Prototyp"
 panum.568.d: "Po dalszych pracach nad szczepionką doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] osiągnął przełomowy etap – opracował prototyp szczepionki."
 panum.568.f: "„To powinna być niezwykła chwila, ale z trudem udaje mi się zachować trzeźwość umysłu. Wykorzystując duże ilości ludzkiej surowicy pobranej od wielu pacjentów powracających do zdrowia, wraz z moim zespołem zdołaliśmy przetworzyć ją do postaci oczyszczonego preparatu, który potencjalnie mógłby zapewnić odporność ochotnikom. Była to obiecująca pierwsza wersja, mogąca stanowić przełomowy krok naprzód, dlatego rozpoczęliśmy testy na makakach. Wiele z nich zdechło, wiele przeżyło, ale makak to nie człowiek.\n\nKonieczne były próby na ludziach. Dziesięciu ochotników zebranych z różnych stron. Kilku żołnierzy z miejscowego garnizonu, członek mojego własnego zespołu, paru bezrobotnych mężczyzn z miasta skuszonych obietnicą kilku pensów. Łącznie około dwóch tuzinów ochotników i niemal tyle samo zastrzyków. Rezultaty? U siedmiu nie wystąpiły żadne objawy, a tydzień później potwierdzono u nich odporność. Pięciu przeszło chorobę łagodnie, po czym nabyło odporność. Kolejnych sześciu zachorowało poważniej, ale również uzyskało odporność. A pozostali? U wszystkich rozwinęła się pełnoobjawowa żółta febra, a jeden z nich zmarł. To niezaprzeczalnie krok we właściwym kierunku, ale... co z tymi, którzy zginęli?”"
 panum.568.g: "Cena postępu jest wysoka."
 panum.569.t: "Nowy obiekt badań"
 panum.569.d: "Ponieważ pierwsza próba opracowania szczepionki zakończyła się jedynie częściowym sukcesem, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] jest zdeterminowany, by udoskonalić tę metodę."
 panum.569.f: "Ku uldze niektórych opiekunów zwierząt laboratoryjnych i przerażeniu innych doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] dokonał przełomowego odkrycia – makaki nie były jedynymi zwierzętami, w których organizmach mógł namnażać się wirus. Znaleziono nowego, bardziej odpowiedniego gospodarza: zwykłą mysz laboratoryjną. Rola, jaką myszy mogą odegrać w rozwijającej się dziedzinie badań medycznych, jest nie do przecenienia, ale w tym przypadku mają one szczególnie istotne znaczenie: ich płyn mózgowo-rdzeniowy, otaczający maleńkie mózgi, stanowi odpowiednie środowisko do namnażania wirusa żółtej febry. Proces ten ma jednak jeszcze jedną wyraźną zaletę.\n\nKażdy kolejny pasaż wirusa z myszy na mysz trwa krócej niż poprzedni, a sam wirus stopniowo słabnie. Powoli, lecz nieuchronnie ten śmiertelny wróg ludzkości zostaje ujarzmiony – jedna mysz po drugiej."
 panum.569.g: "No pięknie, najpierw makaki, teraz myszy..."
 panum.570.t: "Drugi prototyp"
 panum.570.d: "Dalsze prace nad udoskonaleniem szczepionki doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] doprowadziły do opracowania jej ulepszonej wersji."
 panum.570.f: "„Chociaż poprzednia próba nie zakończyła się porażką, nie śmiem nazwać jej sukcesem. Ci biedni chłopcy oddali życie w nadziei na uwolnienie ludzkości od tej choroby, a ja jestem im winien dołożenie wszelkich starań, by udoskonalić szczepionkę. Wierzę, że właśnie tego dokonałem. Przenosząc materiał zakaźny z makaków na myszy, zdołałem powoli, lecz systematycznie osłabiać wirusa, znacznie zmniejszając z czasem jego zjadliwość. Po ponad trzydziestu pasażach otrzymany wirus żółtej febry jest już znacznie osłabiony i o wiele lepiej nadaje się do wykorzystania w szczepionce niż podczas pierwszych prób.\n\nStosując tę samą metodę co poprzednio, przygotowałem mieszaninę surowicy odpornościowej oraz żywego, lecz osłabionego wirusa wyhodowanego w laboratorium. Surowica ma zmniejszać ryzyko wystąpienia pewnych powikłań związanych z reakcją układu odpornościowego. Tym razem ochotników było mniej, ale jeden z moich współpracowników postanowił podjąć ryzyko. Nie był wcześniej szczepiony ani nie miał kontaktu z żółtą febrą, a przed podaniem preparatu przez tydzień przebywał w ścisłej kwarantannie. Poza niewielkim zaczerwienieniem w miejscu wstrzyknięcia nie wystąpiły u niego objawy żółtej febry. Dotychczasowe wyniki są bardzo obiecujące”."
 panum.570.g: "Wygląda na to, że wreszcie zaczynamy robić postępy..."
 panum.570.h: "...więc rozpocznijmy kampanię szczepień!"
 panum.571.t: "Pożar"
 panum.571.d: "Katastrofa! Rozprowadzanie szczepionki opartej na surowicy, opracowanej przez doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], nieumyślnie doprowadziło do przeniesienia chorób przenoszonych przez krew!"
 panum.571.f: "Z perspektywy czasu wydaje się całkiem oczywiste, że opracowanie szczepionki z wykorzystaniem ludzkiej surowicy krwi było, delikatnie mówiąc, fatalnym pomysłem. Tajemnice ludzkiej krwi zostały już częściowo zgłębione, lecz w świecie, w którym mikroskop pozwalał odkrywać coraz to nowe drobnoustroje, a teoria dotycząca istnienia wirusów dopiero zaczynała się rozwijać, nieustannie istniała obawa, że może wydarzyć się coś nieprzewidzianego, coś katastrofalnego.\n\nI oto katastrofa nadeszła: dziesiątkom tysięcy ludzi nieświadomie wstrzyknięto surowicę skażoną wirusem, który wywołał żółtaczkę zarówno u żołnierzy, jak i urzędników państwowych. Wirus ten był dotąd nieznany naszej nauce i nadal wymyka się próbom wykrycia podejmowanym przez wiele naszych najwybitniejszych umysłów... w przeciwieństwie do szkód wyrządzonych wizerunkowi naszego kraju. Choć liczba ofiar śmiertelnych jest niewielka, o ile w ogóle ktokolwiek zmarł, oczywista porażka tego programu szczepień pogrążyła nasze środowisko medyczne w chaosie, czyniąc je pośmiewiskiem na całym świecie."
 panum.571.g: "To katastrofa dla naszych badań medycznych..."
 panum.572.t: "Ostatnie poprawki?"
 panum.572.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] jest bliski ukończenia prac nad szczepionką i znajduje się na końcowym etapie jej opracowywania."
 panum.572.f: "Gdyby nie znało się prawdy, można by pomyśleć, że laboratorium doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] przypomina wyjątkowo dziwną kuchnię. Na blatach walały się sól, woda, olej i jajka, a obok nich stały płyty grzewcze, rozmaite naczynia szklane oraz najnowocześniejsza lodówka. Wszystko wyglądało tak, jakby szykowano się do przygotowania śniadania, a nie dokonania przełomu w medycynie. A jednak właśnie taki przełom był bliski. Surowica była zbyt kosztowna, by można było na jej podstawie produkować szczepionkę przeznaczoną do masowego stosowania, a posługiwanie się nią na skalę niezbędną do zaszczepienia całej kolonii czy miasta nastręczało zbyt wielu trudności. Trzeba było z niej zrezygnować, ale czym ją zastąpić?\n\nMamrocząc coś pod nosem, jakby znajdował się na skraju obłędu, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] pracował niestrudzenie. Starannie przygotowane fragmenty tkanek myszy ostrożnie zanurzał w żółtku jaja, a następnie, równie ostrożnie, zawsze z najwyższą ostrożnością, umieszczał je w komorze do liofilizacji. Z urządzenia wyjęto wcześniejszą partię preparatu, której zawartość zamieniła się w drobny proszek. Wystarczy dodać go do roztworu soli fizjologicznej...\n\nDoktor się uśmiechnął.\n\n„Nareszcie” – powiedział zadowolony lekarz. „Mam to”."
 panum.572.g: "Eureka!"
 panum.573.t: "Ostateczny prototyp"
 panum.573.d: "Po zakończeniu prac nad szczepionką doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] rozpoczął jej podawanie ostatniej grupie testowej."
 panum.573.f: "„To była długa i trudna droga, ale wreszcie widać jej kres. Ostatnim etapem było opracowanie szczepionki, która byłaby łatwiej dostępna, i teraz w końcu się to udało. Dzięki zastąpieniu surowicy roztworem soli fizjologicznej otrzymaliśmy preparat podobny do szczepionki przeciwko ospie prawdziwej. Nie ma potrzeby wykonywania zastrzyku, wystarczy zastosować tę samą metodę skaryfikacji, czyli nacięcia skóry. Co więcej, obie szczepionki można by nawet podawać jednocześnie. Wszystko wskazuje na to, że będzie to niezawodny, bezpieczny i skuteczny sposób szczepienia nie tylko kilku tysięcy, lecz milionów ludzi.\n\nJednak wspomnienia wcześniejszych prób napełniają moje serce niepokojem. Ochotników jest niewielu, zdecydowanie zbyt mało, by utworzyć odpowiednią grupę testową... ale jeśli uwzględnić również mnie, będzie ich wystarczająco wielu. Poczyniłem już odpowiednie przygotowania. Generał może wysyłać swoich żołnierzy pod ostrzał tylko do pewnego momentu, zanim sam będzie musiał stanąć na polu bitwy. Dziś wieczorem, o godzinie ósmej, zostanę zaszczepiony tym preparatem. Jeśli zadziała, to gdy za dwa tygodnie zostanie mi wstrzyknięty czynnik wywołujący żółtą febrę, nie powinienem doświadczyć niczego więcej niż łagodnych dolegliwości”."
 panum.573.g: "Życzmy [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim] powodzenia."
 panum.574.t: "Szczepionka przeciw Żółtej Febrze"
 panum.574.d: "Do stolicy dotarła wiadomość: doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] z powodzeniem opracował szczepionkę przeciwko żółtej febrze!"
 panum.574.f: "„...ale ostatecznie mnie i mojemu zespołowi udało się odnieść sukces wbrew wszelkim przeciwnościom. Choć wiele tajemnic żółtej febry wciąż pozostaje nierozwiązanych, zdołaliśmy opracować skuteczną szczepionkę, gotową do produkcji na masową skalę. Może ona wymagać specjalistycznych placówek obsługiwanych przez wybitnych naukowców, ale można ją wytwarzać w dużych ilościach, a miliony ludzi mogłyby skorzystać z szybkiej kampanii szczepień, która pozwoliłaby odesłać żółtą febrę do przeszłości.\n\nJednak wiele osób straciło życie, w tym również członkowie mojego własnego zespołu, od skromnych asystentów, którzy oddali życie w imię badań naukowych, po ochotników biorących udział w próbach. Wszyscy oni zasługują na uznanie ich za bohaterów. Słowa uznania należą się również makakom i myszom, które odegrały kluczową rolę w tym przedsięwzięciu.\n\nDzięki ich poświęceniu i naszym wspólnym wysiłkom dysponujemy teraz szczepionką, która w ciągu kilku lat może położyć kres endemicznemu występowaniu żółtej febry, a być może pewnego dnia pozwoli nawet całkowicie wyeliminować tę plagę raz na zawsze”."
 panum.574.g: "Dobra robota, doktorze! A teraz przystąpmy do natychmiastowego wdrożenia!"
 panum_wildfire_modifier: "Całkowicie nieudany eksperyment ze szczepionką"
 panum_physician_invented_yellow_fever_vaccine_modifier: "Lekarz wykonał pracę biologa"
 ACHIEVEMENT_biologist_job: "Praca dla biologa?"
 ACHIEVEMENT_DESC_biologist_job: "Opracuj szczepionkę przeciwko żółtej febrze we współpracy z lekarzem."
 je_panum_yellow_fever_vaccine: "Szczepionka przeciwko żółtej febrze"
 je_panum_yellow_fever_vaccine_reason: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] podjął się ambitnego zadania pokonania żółtej febry raz na zawsze. Czy [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] odniesie sukces, czy też [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] poniesie spektakularną porażkę?"
