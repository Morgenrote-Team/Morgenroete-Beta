 panum.101.t: "Trzecia pandemia cholery"
 panum.101.d: "Niepokojące doniesienia z delty Gangesu dotarły dziś do stolicy. Liczba zachorowań gwałtownie tam wzrosła. Po krótkich badaniach przeprowadzonych przez miejscowych lekarzy z szokiem odkryto, że cholera ponownie podniosła swoją ohydną głowę."
 panum.101.g: "W jakiś sposób cholera powróciła."
 panum.1000.t: "Epidemia polio"
 panum.1000.d: "W jednym z naszych stanów wybuchła epidemia: #YELLOW Polio#! sieje spustoszenie w [SCOPE.sState('panum_disease_state').GetName]!"
 panum.1000.f: "Istnieją już wizerunki ze starożytnego Egiptu sugerujące, że poliomyelitis istniało od dawna i miało charakter endemiczny. Jednak dopiero pod koniec XIX wieku osiągnęło status choroby epidemicznej, gdy nagle wybuchło w Szwecji i Stanach Zjednoczonych. Do 1910 roku częste epidemie stały się regularnym zjawiskiem w całym rozwiniętym świecie, przede wszystkim w miastach w miesiącach letnich. W szczytowym okresie w latach 40. i 50. XX wieku polio każdego roku paraliżowało lub zabijało ponad pół miliona ludzi na całym świecie. Strach oraz zbiorowa reakcja na te epidemie doprowadziły do niezwykłego zaangażowania społeczeństwa i mobilizacji, przyspieszając rozwój nowych metod zapobiegania i leczenia choroby oraz rewolucjonizując działalność dobroczynną w medycynie."
 panum.1000.g: "Kule i wózki inwalidzkie stają się przedmiotami codziennego użytku..."
 je_panum_germ_theory_success: "[GetPlayer.GetName] zebrał co najmniej #V 20 dowodów#! wzmacniających teorię zarazków i obalających teorię miazmy."
