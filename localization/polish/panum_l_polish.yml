 panum.301.t: "Ospa prawdziwa rozprzestrzenia się na [SCOPE.sState('panum_disease_state').GetName]"
 panum.301.d: "Według najnowszych doniesień ospa prawdziwa szerzy się teraz również w [SCOPE.sState('panum_disease_state').GetName]. Nasze wysiłki zmierzające do powstrzymania epidemii okazały się nieskuteczne."
 panum.301.g: "Ospa prawdziwa wszędzie!"
 panum.302.t: "Epidemia ospy prawdziwej dociera do [SCOPE.sCountry('panum_infected_country').GetName]"
 panum.302.d: "Otrzymaliśmy doniesienia, że dziś w [SCOPE.sCountry('panum_infected_country').GetName] odnotowano pierwsze przypadki ospy prawdziwej. Tamtejsze władze obwiniają nas o to, że nie zrobiliśmy wystarczająco dużo, aby zapobiec rozprzestrzenianiu się choroby."
 panum.302.g: "Kto mógł to przewidzieć...?"
 panum.303.t: "Epidemia ospy prawdziwej wymyka się spod kontroli"
 panum.303.d: "System opieki zdrowotnej w [SCOPE.sState('panum_disease_state').GetName] znalazł się na skraju załamania. Lekarze zaczynają już opuszczać ten obszar, ponieważ sami są narażeni na zakażenie. Niestety, musimy skorygować liczbę ofiar śmiertelnych w regionie w górę."
 panum.303.f: "„Nie podjęto żadnej próby policzenia ofiar, nie jest też możliwe dokładne ustalenie ich liczby w żadnym z tych plemion. Uważa się, że nawet gdyby podwoić liczbę 17 200 ofiar wśród Indian znad górnego biegu Missouri, łączna liczba zmarłych na wschód od Gór Skalistych nie byłaby zawyżona”."
 panum.303.g: "Czy nie ma lekarstwa na tę straszliwą chorobę?"
 panum.401.t: "Tyfus rozprzestrzenia się na [SCOPE.sState('panum_disease_state').GetName]"
 panum.401.d: "Niebezpieczny tyfus najwyraźniej rozprzestrzenił się na kolejny stan. Doniesienia z [SCOPE.sState('panum_disease_state').GetName] wskazują, że coraz więcej osób pada ofiarą tej choroby."
 panum.401.g: "Tyfus wydaje się niepowstrzymany..."
 panum.402.t: "Choroba będąca skutkiem zepsucia moralnego?"
 panum.402.d: "Ze względu na ograniczoną wiedzę o tym, czym jest tyfus, co go wywołuje i jak skutecznie z nim walczyć, istnieje wiele teorii na temat czynników sprzyjających zachorowaniu. Dominuje pogląd, że jest to choroba związana ze stylem życia, a nie przenoszeniem się zakażenia."
 panum.402.f: "Podobnie jak w przypadku gruźlicy, wielu lekarzy uważało, że tyfus nie jest chorobą zakaźną. O ile gruźlicę postrzegano w niemal romantyczny sposób – jako chorobę romantyków, a więc ludzi o „szlachetnych” duszach – o tyle tyfus uznawano za piętno moralnego zepsucia. Przekonanie, że wyższe warstwy społeczne nie były dotknięte tą chorobą, prowadziło do pewnego poczucia wyższości. Podobnie jak w średniowieczu, gdy choroby często przypisywano boskiej interwencji lub karze, za udowodniony fakt uznawano istnienie związku między wadami charakteru czy rozwiązłością a niektórymi chorobami. Pogląd ten zaczął się zmieniać dopiero od lat 30. XIX wieku."
 panum.402.g: "Nie bez powodu tyfus dotyka przede wszystkim przestępców, prostytutki i niemoralnych żołnierzy."
 panum.402.h: "Prawdopodobnie większe znaczenie ma nie to, kim są ci ludzie, lecz to, gdzie mieszkają."
 panum.403.t: "Kwarantanna"
 panum.403.d: "Szczególnie wśród średnich i wyższych warstw społecznych pojawiają się postulaty utworzenia specjalnych placówek dla przedstawicieli niższych warstw społecznych dotkniętych tyfusem. Te „domy gorączkowe” miałyby być finansowane również przez organizacje non-profit. Jednak część przedstawicieli uboższych warstw społecznych postrzega to raczej jako formę wykluczenia niż opieki zdrowotnej. Z kolei niektórzy członkowie rządu domagają się wprowadzenia całkowitej kwarantanny, którą zwłaszcza klasa średnia uważa za zdecydowanie przesadny środek."
 panum.403.f: "Podobnie jak wiele innych epidemii, tyfus przyczyniał się do segregacji społecznej. Dlatego też wezwania do wprowadzenia powszechnej kwarantanny były w wielu miejscach niepopularne, ponieważ uważano, że choroba dotyka jedynie określone grupy ludzi, zwłaszcza że wielu wierzyło w jej dziedziczny charakter. Mimo to obawa przed zakażeniem odgrywała istotną rolę, dlatego w wielu miejscach budowano domy gorączkowe. Podczas wielkiej epidemii tyfusu w Ameryce Północnej w 1847 roku przekonanie o zakaźnym charakterze choroby stało się tak powszechne, że masowo kierowano zakażonych irlandzkich imigrantów do takich placówek, co w praktyce oznaczało ich przymusowe odosobnienie."
 panum.403.g: "Cały obszar powinien zostać objęty kwarantanną."
 panum.403.h: "Przenieśmy chorych na tyfus do specjalnych placówek."
 panum.403.i: "Tyfus nie jest chorobą zakaźną, więc kwarantanna nie ma sensu."
 panum.404.t: "Brudne baraki"
 panum.404.d: "Sytuacja w rzekomych domach gorączkowych, które coraz bardziej przypominają przepełnione trumny pełne odchodów i ludzkiego cierpienia, stała się już poważnym problemem w [SCOPE.sState('panum_disease_state').GetName]. Duchowni i opiekunowie chorych wystosowali list, w którym domagają się likwidacji tych straszliwych placówek."
 panum.404.f: "Baraki dla chorych z gorączką były brudne i zatłoczone. Pacjenci leżeli na dwupoziomowych pryczach, przez co brud z górnych łóżek spadał na osoby leżące poniżej. Według raportu komisji senackiej na jednej pryczy umieszczano dwóch lub trzech chorych, niezależnie od ich wieku czy płci. Brakowało chleba, a posiłki składały się z herbaty, kleiku lub bulionu, podawanych trzy razy dziennie. Ponieważ wodę pitną trzeba było dowozić, nigdy nie wystarczało jej dla wszystkich chorych. Pewien katolicki ksiądz, ojciec Moylan, opowiadał, że podawał wodę chorym w namiocie, którzy nie mieli nic do picia od 18 godzin. Baraki pierwotnie nie były przeznaczone do przyjmowania chorych z gorączką i nie miały wentylacji, a nowe budowano bez latryn. Komisja senacka stwierdziła, że z powodu braku personelu i miejsca chorzy przez wiele dni leżeli we własnych odchodach, a pracowników było zbyt mało, by usuwać ciała osób zmarłych w nocy."
 panum.404.g: "Nie możemy ryzykować, że kolejne osoby zostaną zakażone."
 panum.404.h: "Poprawmy warunki życia chorych na tyfus i zapewnijmy im opiekę medyczną."
 panum.404.i: "Zlikwidujmy te nieludzkie placówki!"
 panum.405.t: "Zamieszki przeciwko barakom dla chorych z gorączką"
 panum.405.d: "Strach przed rozprzestrzenianiem się tyfusu w [SCOPE.sState('panum_disease_state').GetName] doprowadził niektórych mieszkańców do takiej radykalizacji, że utworzyli rozwścieczony tłum. Krążą pogłoski, że zamierzają zepchnąć baraki dla chorych wraz z pacjentami do najbliższej rzeki!"
 panum.405.f: "W 1847 roku liczba baraków dla chorych w Montrealu wzrosła do 22, a wojsko otoczyło cały teren, aby uniemożliwić chorym ucieczkę. Gdy rozwścieczony tłum zagroził zepchnięciem baraków do rzeki, burmistrz Montrealu John Easton Mills stłumił zamieszki i osobiście zajął się chorymi, podając im wodę i zmieniając pościel. Zmarł w listopadzie, pełniąc urząd przez niespełna rok."
 panum.405.g: "Nie ma miejsca na takie barbarzyństwo w naszym kraju!"
 panum.405.h: "Tak czy inaczej umrą."
 panum.406.t: "Niepochowane zwłoki"
 panum.406.d: "Liczba zgonów w [SCOPE.sState('panum_disease_state').GetName] rośnie tak szybko, że grabarze ledwo nadążają z pochówkami. Istnieje obawa, że niepochowane zwłoki mogą doprowadzić do jeszcze poważniejszych problemów."
 panum.406.f: "W latach 60. XIX wieku wyjątkowo trudne warunki pogodowe i nieurodzaj dotknęły ówczesne Wielkie Księstwo Finlandii, prowadząc do klęski głodu i epidemii chorób zakaźnych. W latach 1866–1868 głód, a zwłaszcza choroba uznawana wówczas za tyfus, pochłonęły w tym regionie 270 000 ofiar."
 panum.406.g: "Wykorzystajmy wszelkie dostępne środki, aby nie dopuścić do tego, by sytuacja wymknęła się spod kontroli."
 panum.406.h: "Wykopmy zwykłe masowe groby."
 panum.406.i: "Nasze możliwości zostały wyczerpane, musicie radzić sobie sami!"
 panum.407.t: "Tyfus w koszarach"
 panum.407.d: "Tyfus szerzy się obecnie przede wszystkim w obiektach wojskowych w [SCOPE.sState('panum_disease_state').GetName], zbierając tam śmiertelne żniwo."
 panum.407.f: "Wielu historyków uważa, że to właśnie epidemia tyfusu wśród żołnierzy Napoleona, a nie głód czy mróz, była prawdziwą przyczyną zahamowania jego kampanii wojennej w Rosji. Tyfus pochłonął wiele ofiar podczas wojny secesyjnej w Stanach Zjednoczonych, choć to dur brzuszny był częstszą przyczyną tak zwanej „gorączki obozowej”. Podczas wojny krymskiej w latach 1853–1856 tyfusowi przypisuje się nawet 900 000 zgonów. Przed wybuchem I wojny światowej (1914–1918) tyfus występował endemicznie w Polsce i kilku sąsiednich krajach, jednak w czasie wojny przybrał rozmiary epidemii. Choroba dziesiątkowała armie walczące na froncie wschodnim, a w samej Serbii pochłonęła ponad 150 000 ofiar. Śmiertelność wśród zakażonych wynosiła zazwyczaj od 10% do 40%, a choroba była jedną z głównych przyczyn zgonów wśród osób opiekujących się chorymi."
 panum.407.g: "Niewidzialny wróg bardziej zabójczy niż jakakolwiek armia..."
 panum.408.t: "Cierpienie z powodu choroby, nie wojny"
 panum.408.d: "Epidemia tyfusu w naszych koszarach z każdym dniem coraz bardziej się rozprzestrzenia. W [SCOPE.sState('panum_disease_state').GetName] żołnierze należą obecnie do najczęstszych ofiar śmiertelnych, choć nie giną z rąk wroga."
 panum.408.f: "„Wojna nie jest przygodą. Jest chorobą. Jest jak tyfus”. – Antoine de Saint-Exupéry"
 panum.408.g: "Straszne!"
 panum.501.t: "Żółta febra rozprzestrzenia się na [SCOPE.sState('panum_disease_state').GetName]"
 panum.501.d: "Doniesienia o nowych przypadkach żółtej febry potwierdziły nasze najgorsze obawy. Choroba szaleje teraz również w [SCOPE.sState('panum_disease_state').GetName]!"
 panum.501.g: "Dlaczego nie udało się tego powstrzymać?"
 panum.502.t: "Choroba zakaźna?"
 panum.502.d: "Chociaż nie jest jasne, czy żółta febra jest chorobą zakaźną, czy też ma inne przyczyny, wielu mieszkańców obawiających się o swoje bezpieczeństwo domaga się wprowadzenia kwarantanny, aby powstrzymać jej rozprzestrzenianie się. Jeśli tego nie zrobimy, mogą uznać, że lekceważymy ich obawy lub nie interesujemy się ich potrzebami."
 panum.502.f: "Pierwsze epidemie żółtej febry w XVII wieku wywoływały panikę i dezorientację. Nawet w XVIII wieku nie było powszechnej zgody co do tego, co powoduje zakażenie. Choć rządy i poszczególne osoby podejmowały surowe środki zaradcze i zapobiegawcze, nie przynosiły one rezultatów. Strach przed żółtą febrą sprawiał, że wykorzystywano każdą okazję, by zapobiec jej dalszemu rozprzestrzenianiu się, niekiedy uciekając się do eksperymentalnych lub drakońskich metod. Niektóre działania mogły więc wynikać raczej z pobudek psychologicznych niż medycznych, a ich celem było zapobieżenie narastaniu niezadowolenia wśród ludności."
 panum.502.g: "Nie ma dowodów na to, że jest to choroba zakaźna."
 panum.503.t: "Żółta febra dotyka plantacji"
 panum.503.d: "Codziennie napływają doniesienia, że szczególnie na plantacjach w [SCOPE.sState('panum_disease_state').GetName] odnotowuje się wysoki odsetek osób chorych na żółtą febrę. Niektórzy doradcy rządowi nalegają na całkowite wstrzymanie tam prac, aby ograniczyć rozprzestrzenianie się choroby."
 panum.503.f: "„Ubogi czarnoskóry mężczyzna imieniem Sampson nieustannie chodził od domu do domu, niosąc pomoc tam, gdzie panowało cierpienie i brakowało wsparcia, nie żądając za to żadnej zapłaty ani nagrody. Sam zapadł na tę chorobę i zmarł. Po jego śmierci rodzina została zaniedbana przez tych, którym wcześniej pomagał. Sarah Bass, uboga czarnoskóra wdowa, udzielała wszelkiej możliwej pomocy kilku rodzinom, nie otrzymując za to niczego. Gdy zaś proponowano jej jakąkolwiek zapłatę, pozostawiała decyzję o jej przyjęciu tym, którym pomagała”. – Richard Allen"
 panum.503.g: "Wycofajmy robotników z pól!"
 panum.503.h: "Plantacja musi nadal funkcjonować, za wszelką cenę!"
 panum.504.t: "Ewakuacja"
 panum.504.d: "Sytuacja zdrowotna w [SCOPE.sState('panum_disease_state').GetName] nadal się pogarsza. Członkowie lokalnych władz i administracji zwrócili się z prośbą o zgodę na opuszczenie miasta i kierowanie sprawami administracyjnymi z terenów wiejskich. Niektórzy uważają to za rozsądną propozycję, inni za zwykłe tchórzostwo."
 panum.504.f: "Podczas epidemii żółtej febry w Filadelfii w 1793 roku, między 1 sierpnia a 9 listopada, w rejestrze zgonów odnotowano co najmniej 5000 osób. Zdecydowana większość z nich zmarła na żółtą febrę, co sprawiło, że epidemia w liczącym 50 000 mieszkańców mieście stała się jedną z najtragiczniejszych w historii Stanów Zjednoczonych. Do końca września miasto opuściło 20 000 osób, w tym członkowie Kongresu oraz urzędnicy federalnej władzy wykonawczej. Większość z nich powróciła dopiero po ustąpieniu epidemii pod koniec listopada. Prezydent George Washington opuścił miasto i udał się do swojej posiadłości w Mount Vernon. Śmiertelność osiągnęła szczyt w październiku, zanim nadejście mrozów ostatecznie nie doprowadziło do wyginięcia komarów i zakończenia epidemii. Niektóre sąsiednie miejscowości odmawiały przyjmowania uchodźców z Filadelfii w obawie, że mogą oni przenosić chorobę. W dużych miastach portowych, w tym w Baltimore i Nowym Jorku, wprowadzono kwarantannę dla uchodźców i towarów przybywających z Filadelfii, choć Nowy Jork udzielił miastu pomocy finansowej."
 panum.504.g: "Ewakuujmy władze."
 panum.504.h: "Lokalna administracja nie może przestać funkcjonować."
 panum.505.t: "Żółta febra rozprzestrzenia się w koszarach"
 panum.505.d: "Żółta febra szerzy się obecnie przede wszystkim w obiektach wojskowych w [SCOPE.sState('panum_disease_state').GetName], zbierając tam śmiertelne żniwo."
 panum.505.f: "Dla powstańców na Haiti na przełomie XVIII i XIX wieku, a niemal 100 lat później również na Kubie, żółta febra była wielkim sprzymierzeńcem w walce z armiami kolonialnymi wysyłanymi z Europy. Przywódca kubańskiej walki o niepodległość mówił o swoich „niezwyciężonych generałach: czerwcu, lipcu i sierpniu” – miesiącach, w których nadchodziły deszcze, a wraz z nimi komary. Podobne doświadczenia mieli Brytyjczycy podczas oblężenia Cartageny w 1741 roku. Twierdzę oblegało 29 000 brytyjskich żołnierzy. Gdy rozpoczęły się deszcze, w ciągu zaledwie kilku tygodni 22 000 z nich zmarło w straszliwych warunkach. Śmiertelność w brytyjskich garnizonach na Jamajce była siedmiokrotnie wyższa niż w garnizonach w Kanadzie, głównie z powodu żółtej febry i innych chorób tropikalnych."
 panum.505.g: "Nie! Było im przeznaczone zginąć honorowo na polu bitwy!"
 panum.506.t: "Choroba marynarzy"
 panum.506.d: "Działalność portowa w [SCOPE.sState('panum_disease_state').GetName] niemal całkowicie zamarła z powodu żółtej febry. Z jednej strony wielu robotników portowych i marynarzy choruje. Z drugiej zaś jak najwięcej statków stara się omijać ten przeklęty region."
 panum.506.f: "„Żółta febra sieje w Nowym Orleanie przerażające spustoszenie. Tysiące ludzi padły jej ofiarą, a każdego dnia do tej makabrycznej statystyki dochodzi kolejnych 200 zmarłych. Zwłoki grzebane są w rowach przez grupy czarnoskórych robotników pracujących pod przymusem, wynajmowanych za gwineę na godzinę. I tak, wśród śpiewów i sprośnych żartów grabarzy, brzęczenia much, śpiewnych okrzyków przekupek sprzedających słodycze, ochrypłych przekleństw woźniców przewożących zmarłych, wesołego pogwizdywania chłopców i duszącego odoru unoszącego się nad dziesiątkami sczerniałych zwłok, dzień szybko przemija, praca przy pochówkach dobiega końca, a noc opuszcza swoją zasłonę. Tymczasem zabawy, regaty, bale i inne rozrywki odbywają się jak zwykle, jak gdyby w tym skazanym na zagładę mieście nie panowała żadna tak przerażająca zaraza”. – Cambridge Weekly News, 1853 r."
 panum.506.g: "Katastrofa dla żeglugi!"
 panum.507.t: "Czarne wymioty"
 panum.507.d: "W [SCOPE.sState('panum_disease_state').GetName] żółta febra zbiera jeszcze większe żniwo, niż się spodziewano. Lekarze donoszą, że z powodu tej choroby zmarło więcej osób niż dotychczas."
 panum.507.f: "„Ci, którzy odważali się wychodzić z domu, przykładali do nosa chusteczki lub gąbki nasączone octem kamforowym albo flakoniki z tak zwanym octem złodziei. Inni nosili w dłoniach lub kieszeniach kawałki smołowanej liny albo woreczki z kamforą zawieszone na szyi... Na widok nadjeżdżającego karawanu ludzie pospiesznie zmieniali kierunek marszu. Wielu w ogóle nie chodziło chodnikami, lecz schodziło na środek ulicy, by uniknąć zakażenia podczas mijania domów, w których ktoś zmarł. Znajomi i przyjaciele unikali się na ulicach, okazując sobie względy jedynie chłodnym skinieniem głowy. Dawny zwyczaj podawania sobie rąk niemal całkowicie zanikł, a wielu cofało się przerażonych nawet na sam widok wyciągniętej dłoni. Osoby noszące żałobną krepę lub w jakikolwiek sposób zdradzające żałobę omijano jak żmije”. – Mathew Carey"
 panum.507.g: "Kiedy wreszcie uwolnimy się od tej plagi?"
