 je_panum_military_medicine_project_reason: "Lekarze wojskowi i sanitariusze Czerwonego Krzyża mają wyjątkową możliwość poprawy opieki medycznej na polu bitwy, a tym samym uratowania wielu istnień — i być może zadecydowania o wyniku wojny. W zależności od cech charakteru i doświadczenia ta poprawa następuje z różną szybkością. Po [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] reformie medycyny wojskowej zostanie odblokowana [concept_mobilization_option] lub wyższy poziom."
