 panum.2007.t: "Wynalazki Medyczne"
 panum.2007.d: "Na kongresie rozeszła się wieść, że istnieją specjaliści, którym udało się dokonać medycznych innowacji. Są gotowi podzielić się swoją wiedzą."
 panum.2007.f: "Unikalne innowacje w medycynie, takie jak przeszczepy, rozwój promieni rentgenowskich czy chemioterapia, mają tak ogromne znaczenie dla ludzkości, że ich twórcy bez wahania dzielą się swoją wiedzą. Ostatecznie chodzi przecież o dobro wszystkich ludzi."
 panum.2007.g: "Za zdrowie ludzkości!"
 panum.2205.t: "Testy na zwierzętach"
 panum.2205.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] jest uważany za bezwzględnego naukowca z pewną skłonnością do okrucieństwa. Mówi się, że liczba zwierząt, które [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] zabił „dla dobra nauki”, sięga setek. Mimo to eksperymenty te przynoszą swoje sukcesy."
 panum.2205.f: "Choć testy na zwierzętach prowadzone w celu rozwoju medycyny istniały już od czasów starożytnych, dopiero w XIX wieku zaczęto przeprowadzać je na niespotykaną wcześniej skalę. Szczególnie podczas odkrywania teorii zarazków — a także później — przeprowadzono niezliczone eksperymenty, w których zwierzęta były celowo zakażane patogenami i dosłownie stawały się „królikami doświadczalnymi” dla nowych leków. W tym okresie testy na zwierzętach oraz wiwisekcja zostały również szeroko wprowadzone na uniwersytetach jako część kształcenia studentów."
 panum.2205.g: "Doktor może postępować, jak [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] uważa za stosowne."
 panum.2205.h: "Studenci powinni nauczyć się przeprowadzania sekcji zwierząt."
 panum.2205.i: "To zdecydowanie posuwa się za daleko."
 panum.2411.t: "Aspiryna"
 panum.2411.d: "Nasz chemik, doktor [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName], wynalazł prawdziwy medyczny cud, który może zrewolucjonizować farmację: aspirynę. Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] potwierdził jej działanie przeciwbólowe."
 panum.2411.f: "Kwas salicylowy był wykorzystywany w medycynie już od czasów starożytnych. Leki wytwarzane z kory wierzby oraz innych roślin bogatych w salicylany pojawiają się na glinianych tabliczkach starożytnych Sumerów oraz w Papirusie Ebersa ze starożytnego Egiptu. Hipokrates wspominał około 400 r. p.n.e. o stosowaniu herbaty z wierzby w celu obniżania gorączki. Rośliny bogate w salicylany stanowiły część farmakopei medycyny zachodniej w okresie starożytności klasycznej i średniowieczu. Ekstrakt z kory wierzby stał się znany w połowie XVIII wieku ze względu na swoje szczególne działanie przeciwgorączkowe, przeciwbólowe i przeciwzapalne. W XIX wieku farmaceuci eksperymentowali z różnymi związkami związanymi z salicyną, aktywnym składnikiem ekstraktu z wierzby, oraz przepisywali je pacjentom. W 1853 roku chemik Charles Frédéric Gerhardt po raz pierwszy poddał działaniu chlorku acetylu salicylan sodu, aby wytworzyć kwas acetylosalicylowy. W 1897 roku naukowcy z fabryk leków i farb firmy Bayer rozpoczęli badania nad kwasem acetylosalicylowym jako mniej drażniącym dla żołądka zamiennikiem powszechnie stosowanych leków salicylanowych i opracowali nową metodę syntezy pozbawioną zanieczyszczeń. Do 1899 roku firma Bayer nadała mu nazwę aspiryna i rozpoczęła sprzedaż na całym świecie."
 panum.2411.g: "Lek ten stanie się punktem wyjścia do dalszych badań medycznych."
 panum.2411.h: "Chemia z pewnością otworzy drogę do jeszcze bardziej spektakularnych odkryć."
 panum.2411.i: "Przemysł farmaceutyczny odniesie z tego korzyści."
 panum.2412.t: "Promienie rentgenowskie"
 panum.2412.d: "Nasz fizyk, doktor [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName], dokonał spektakularnego odkrycia: [ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe] odkrył wcześniej nieznane promienie, które można wykorzystać do prześwietlania ciała. Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] wskazał na ich możliwości w medycynie."
 panum.2412.f: "Promienie rentgenowskie to fale elektromagnetyczne o energii kwantów powyżej około 100 eV, odpowiadające długościom fal poniżej około 10 nm. W widmie elektromagnetycznym promieniowanie rentgenowskie znajduje się w zakresie energii wyższym niż światło ultrafioletowe. Promienie rentgenowskie zostały odkryte w 1895 roku przez niemieckiego naukowca Wilhelma Conrada Röntgena, który nazwał je promieniowaniem X, aby podkreślić ich nieznany wówczas charakter. Promienie rentgenowskie mogą przenikać przez wiele stałych substancji, takich jak materiały budowlane i żywe tkanki, dlatego radiografia rentgenowska jest szeroko stosowana w diagnostyce medycznej (np. przy wykrywaniu złamań kości) oraz w naukach o materiałach (np. przy identyfikacji niektórych pierwiastków chemicznych i wykrywaniu słabych punktów w konstrukcjach)."
 panum.2412.g: "Przerażające — niczym ujrzenie własnej śmierci."
 panum.2413.t: "Grupy krwi"
 panum.2413.d: "Doktor [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] dokonał zdumiewającego odkrycia, które wyjaśnia, dlaczego ludzka krew czasami się ze sobą łączy, a czasami zlepia: najwyraźniej istnieją różne grupy krwi. Jest to przełomowe odkrycie dla krwiodawstwa i transfuzji krwi."
 panum.2413.f: "„Niedawno zaobserwowałem i stwierdziłem, że surowica krwi zdrowych ludzi jest zdolna do zlepiania czerwonych krwinek innych zdrowych osób... Jak powszechnie się to ujmuje, można powiedzieć, że w tych przypadkach istnieją co najmniej dwa różne rodzaje aglutynin: jeden rodzaj w A, drugi w B, a oba razem w C. Krwinki są naturalnie niewrażliwe na aglutyniny obecne we własnej surowicy.” — Karl Landsteiner"
 panum.2413.g: "Badania nad grupami krwi muszą być rozwijane."
 panum.2413.h: "Klinika powinna gromadzić informacje o grupach krwi i zbierać krew do transfuzji."
 panum.2414.t: "Elektrokardiografia"
 panum.2414.d: "Doktor [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] wynalazł niezwykłe urządzenie rejestrujące aktywność elektryczną włókien mięśnia sercowego. Doktor nazwał to urządzenie elektrokardiografem — EKG."
 panum.2414.f: "W 1843 roku Carlo Matteucci odkrył dzięki eksperymentom na sercach gołębi, że aktywność serca opiera się na procesach elektrycznych. W 1882 roku fizjolog Augustus Desiré Waller wykonał pierwsze EKG na swoim psie Jimmy'm, zanurzając jego cztery łapy w przewodzącym roztworze chlorku sodu. W 1887 roku po raz pierwszy udało mu się zarejestrować prądy sercowe za pomocą elektrometru kapilarnego. Urządzenia te zostały znacznie ulepszone w 1903 roku przez Willema Einthovena, który na podstawie opracowanego przez siebie w 1895 roku galwanometru strunowego rozwinął EKG w użyteczną procedurę diagnostyczną i wprowadził je do kliniki. Wprowadzona przez niego terminologia jest używana do dziś."
 panum.2414.g: "To urządzenie powinno znajdować się w każdym szpitalu."
 panum.2415.t: "Pierwszy przeszczep"
 panum.2415.d: "Umiejętności chirurgiczne doktora [SCOPE.sCharacter('panum_physician_scope').GetLastName] są znane w całym kraju, lecz [SCOPE.sCharacter('panum_physician_scope').GetSheHe] niedawno zaskoczył ekspertów odważnym zabiegiem: lekarz przeszczepił ludzką tkankę tarczycy pod skórę oraz do jamy brzusznej młodego mężczyzny."
 panum.2415.f: "Pierwszym przeszczepem w nowoczesnym znaczeniu tego słowa — czyli wszczepieniem tkanki narządu w celu zastąpienia jego funkcji — był przeszczep tarczycy w 1883 roku. Wykonał go szwajcarski chirurg, a późniejszy laureat Nagrody Nobla, Theodor Kocher. W poprzednich dekadach Kocher udoskonalił usuwanie nadmiaru tkanki tarczycy w przypadkach wola do tego stopnia, że był w stanie usunąć cały narząd bez śmierci pacjenta podczas operacji. W niektórych przypadkach Kocher przeprowadzał całkowite usunięcie narządu jako środek zapobiegający nawrotom wola. W kolejnych latach Kocher oraz inni chirurdzy wykorzystywali przeszczepy tarczycy również do leczenia samoistnie występującej niedoczynności tarczycy, niezwiązanej z wcześniejszym usunięciem narządu. Przeszczepy tarczycy stały się wzorem dla całkowicie nowej strategii terapeutycznej: transplantacji narządów."
 panum.2415.g: "A ludzie myśleli, że Frankenstein był powieścią grozy!"
 panum.2416.t: "Metoda stereotaktyczna"
 panum.2416.d: "Genialne umiejętności chirurgiczne doktora [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] nie znają granic: lekarz zrewolucjonizował neurochirurgię dzięki nowej operacji mózgu."
 panum.2416.f: "Stereotaktyczna chirurgia mózgu odnosi się do małoinwazyjnych zabiegów neurochirurgicznych i radioterapeutycznych, w których głowa pacjenta oraz narzędzia medyczne są unieruchamiane w precyzyjnie zamocowanej ramie, aby osiągnąć maksymalną dokładność. Po raz pierwszy w ostatnich latach XIX wieku przeprowadzono pojedyncze operacje na odsłoniętym mózgu przy użyciu procedury znanej już wówczas jako stereotaksja. Podczas zabiegu ciało pacjenta, a zwłaszcza głowa, były sztywno unieruchamiane w specjalnym, stabilnym systemie ramowym. W tamtym okresie badanie możliwości tej metody, zarówno z naukowej ciekawości, jak i w kontekście chirurgii psychiatrycznej, było nadal bardzo ograniczone i proste. W kolejnych dekadach narzędzia oraz metodologia były stopniowo udoskonalane."
 panum.2416.g: "Genialne!"
 panum.2417.t: "Krążenie pozaustrojowe"
 panum.2417.d: "Dzięki opracowaniu krążenia pozaustrojowego doktor Hasenbein dokonał arcydzieła współczesnej medycyny. Już niedługo ludzie będą mogli przechodzić operacje serca bez większych problemów."
 panum.2417.f: "Podczas krążenia pozaustrojowego krew opuszcza ciało przez system kaniul i przewodów, zostaje wzbogacona w tlen, a następnie jest ponownie pompowana do organizmu. Nazywa się to krążeniem pozaustrojowym. Droga przepływu krwi zazwyczaj prowadzi z żył głównych lub prawego przedsionka, a także z komór serca i otwartych tętnic wieńcowych w obszarze operowanym, a po przefiltrowaniu, wzbogaceniu w tlen i usunięciu dwutlenku węgla, ogrzaniu oraz dalszej filtracji wraca przez tętnicę główną lub tętnicę udową. Francuski fizjolog Le Gallois opublikował ideę krążenia pozaustrojowego w 1812 roku. W 1885 roku Maximilian von Frey i jego współpracownik Max von Gruber z Uniwersytetu w Lipsku zbudowali poprzednika dzisiejszych urządzeń płuco-serce, wykorzystując natleniacza błonowego z pompą tłokową do pierwszego zastosowania krążenia krwi w zamkniętym układzie pozaustrojowym."
 panum.2417.g: "To narodziny nowoczesnej chirurgii serca!"
 panum.2418.t: "Endoskop"
 panum.2418.d: "Nowy wynalazek doktora [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] może zapewnić nieocenione możliwości badań medycznych — można go wykorzystać do oglądania wnętrza ciała!"
 panum.2418.f: "Endoskop to urządzenie, które może być wykorzystywane do badania i manipulowania wnętrzem organizmów lub technicznych przestrzeni. Zastosowanie endoskopu, znane jako endoskopia, zostało pierwotnie opracowane na potrzeby diagnostyki medycznej u ludzi. Po wynalezieniu przez Thomasa Edisona wykorzystanie światła elektrycznego stało się ważnym krokiem w udoskonalaniu endoskopu. Pierwsze tego typu źródła światła znajdowały się na zewnątrz, jednak były wystarczająco skuteczne, aby umożliwić wykonywanie cystoskopii, histeroskopii i sigmoidoskopii, a także badanie jamy nosowej (a później również klatki piersiowej), co rutynowo przeprowadzał u pacjentów Sir Francis Cruise, korzystając z własnego dostępnego komercyjnie endoskopu, już w 1865 roku w szpitalu Mater Misericordiae w Dublinie w Irlandii."
 panum.2418.g: "Przydatne urządzenie medyczne."
 panum.2419.t: "Oftalmoskop"
 panum.2419.d: "Doktor [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] wynalazł urządzenie ułatwiające badanie chorób oczu, oddając tym samym nieocenione zasługi okulistyce."
 panum.2419.f: "Oftalmoskopia lub badanie dna oka to oglądanie widocznych części oka przeprowadzane za pomocą oftalmoskopu. W szczególności można w ten sposób badać siatkówkę oraz naczynia krwionośne, które ją zaopatrują. Oftalmoskop, wynaleziony w 1850 roku, został po raz pierwszy opisany przez swojego twórcę Hermanna von Helmholtza na początku października 1851 roku. Za pomocą oftalmoskopu można wykrywać choroby nerwu wzrokowego, siatkówki, naczyniówki oraz ciała szklistego. Był to początek historii okulistyki jako niezależnej dziedziny medycznej i naukowej. Następnie oftalmoskop zyskiwał coraz większe znaczenie w diagnostyce chorób wewnętrznych."
 panum.2419.g: "Interesujące urządzenie medyczne."
 panum.2420.t: "Chemioterapia"
 panum.2420.d: "Nowa procedura medyczna, którą obecnie testuje doktor [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName], może dać iskierkę nadziei wielu chorym — nawet rak nie byłby już całkowicie nieuleczalny, lecz przynajmniej możliwy do częściowego leczenia."
 panum.2420.f: "Chemioterapia to leczenie farmakologiczne nowotworów lub zakażeń. Paul Ehrlich użył terminu chemioterapia do opisania leczenia chorób zakaźnych za pomocą substancji chemicznych działających bezpośrednio przeciwko patogenom. W 1904 roku odkrył trypan czerwień, pierwszy skuteczny lek chemioterapeutyczny, którego użył do wyleczenia myszy cierpiących na śpiączkę afrykańską. Ehrlich rozpoczął dalsze eksperymenty 31 sierpnia 1909 roku we Frankfurcie nad Menem, wstrzykując szczurom patogeny kiły, a następnie lecząc je za pomocą metod chemioterapeutycznych. Eksperymenty te przyniosły tak przekonujące rezultaty, że uznano je za nową „broń” medycyny przeciwko chorobom zakaźnym. Ehrlich został później nazwany „twórcą chemioterapii”. Stosowane leki są albo wytwarzane sztucznie, albo stanowią pochodne naturalnie występujących substancji."
 panum.2420.g: "Czy może to być odpowiedź na cierpienie pacjentów chorych na raka?"
 panum.2100.t: "Rekrutacja lekarzy"
 panum.2100.d: "Jednym z najbardziej obiecujących lekarzy w Szpitalu Generalnym jest [SCOPE.sCharacter('panum_new_physician_scope').GetFullName]. [SCOPE.sCharacter('panum_new_physician_scope').GetSheHe|U] byłby doskonałym kandydatem na nowego ordynatora. [SCOPE.sCharacter('panum_new_physician_scope').GetHerHis|U] specjalizacja to..."
 panum.2100.f: "$concept_panum_physician_desc$\n\n#V Nowy#! lekarz, [SCOPE.sCharacter('panum_new_physician_scope').GetFullName], jest lekarzem typu #tooltip:[SCOPE.sCharacter('panum_new_physician_scope').GetTooltipTag],panum_physician_rating_tt_loc [SCOPE.sCharacter('panum_new_physician_scope').GetCustom('panum_physician_rating_new_physician_icon_text_type')]#!.[GetPlayer.GetCustom('panum_physician_rating_display_existing_physician_type')]"
 panum.2100.g: "Epidemiologia"
 panum.2100.h: "Chirurgia"
 panum.2100.i: "Psychiatria"
 panum.2100.j: "Medycyna wojskowa"
 panum_cholera_condition: "Cholera"
 panum_cholera_condition_desc: "Cholera jest niebezpieczną chorobą jelita cienkiego. Uznaje się ją za jedną z najbardziej charakterystycznych epidemii XIX wieku, która spowodowała miliony zgonów na całym świecie."
 panum_tuberculosis_condition: "Gruźlica"
 panum_tuberculosis_condition_desc: "Gruźlica jest uważana, obok cholery, za jedną z najczęstszych przyczyn zgonów w epoce wiktoriańskiej. Znana również jako suchoty, dotyka przede wszystkim płuc."
 panum_smallpox_condition: "Ospa prawdziwa"
 panum_smallpox_condition_desc: "Znana z krost, które oszpecają twarz i ciało, ospa prawdziwa przez długi czas była jedną z najbardziej śmiercionośnych chorób w historii."
 panum_typhus_condition: "Tyfus"
 panum_typhus_condition_desc: "Tyfus przez stulecia siał postrach wśród żołnierzy, szczególnie podczas wojen napoleońskich, kiedy zabił tysiące członków armii. Po klęskach żywiołowych ponownie wielokrotnie wybuchał."
 panum_yellow_fever_condition: "Żółta febra"
 panum_yellow_fever_condition_desc: "Żółta febra występuje głównie na tropikalnych obszarach Ameryki Południowej i Afryki. Na Karaibach choroba ta pochłonęła więcej istnień wśród stacjonujących tam żołnierzy niż jakakolwiek wojna."
 panum_measles_condition: "Odra"
 panum_measles_condition_desc: "Odra jest wysoce zakaźną chorobą znaną z charakterystycznych czerwonych plam na skórze. Może mieć katastrofalne skutki, szczególnie w populacjach pozbawionych wcześniejszej odporności."
 panum_scarlet_condition: "Szkarlatyna"
 panum_scarlet_condition_desc: "Szkarlatyna jest powszechną chorobą, która aż do początku XX wieku była jedną z najczęstszych przyczyn zgonów wśród dzieci."
 panum_plague_condition: "Dżuma"
 panum_plague_condition_desc: "Dżuma dymienicza jest utożsamiana z „czarną śmiercią” średniowiecza, która stanowi jedną z największych katastrof w historii. Jej nazwa pochodzi od opuchniętych i bolesnych guzów."
 panum_diphteria_condition: "Błonica"
 panum_diphteria_condition_desc: "Błonica jest niebezpieczną chorobą, która może prowadzić do zagrażających życiu powikłań oraz długotrwałych konsekwencji."
 panum_polio_condition: "Polio"
 panum_polio_condition_desc: "Poliomyelitis jest chorobą, która dotyka przede wszystkim dzieci, często prowadząc do śmierci lub dożywotnich powikłań fizycznych."
