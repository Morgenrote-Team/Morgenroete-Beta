 je_panum_cholera_description_expedition_reason: "Dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] prowadzi wyprawę medyczną w [SCOPE.sCountry('target').GetName], aby zdobyć cenną wiedzę na temat #YELLOW cholery#!. Dopóki choroba szaleje w tym kraju, [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] ma co miesiąc szansę na dokonanie nowych odkryć, które pozwolą opracować kompleksowe naukowe opracowanie na temat tej choroby.\n\nJeśli epidemia wygaśnie, dotychczasowe postępy naukowe nie przepadną, lecz zostaną uwzględnione również podczas kolejnych badań."
