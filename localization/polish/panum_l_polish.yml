 panum.139.d: "Po wielkim wysiłku doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] w końcu napisał [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] traktat na temat skutecznej metody leczenia choroby [SCOPE.GetRootScope.GetCountry.GetCustom('panum_custom_disease_title')]. Jest on uważany za kamień milowy w [ROOT.GetCountry.GetAdjectiveNoFlag] medycynie."
