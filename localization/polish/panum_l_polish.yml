 je_panum_plague_treatment_expedition_reason: "Dr. [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] leads a medical expedition in [SCOPE.sCountry('target').GetName] to find treatment methods against #YELLOW Plague#!. As long as the disease rages in the country, [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] has a monthly chance to track down the causes of the disease and to contain it.\n\nIf the disease subsides, the scientific progress will not be lost, but will also be present in the next examination."
