 panum_congress_host_modifier: "Niedawno zorganizowano Kongres Medyczny"
 panum_congress_attend_modifier: "Uczestniczy w Kongresie Medycznym"
 panum.2000.t: "Przygotowania do kongresu medycznego"
 panum.2000.d: "Przed kolejnym Międzynarodowym Kongresem Medycznym, który odbędzie się w naszym kraju, pojawia się pytanie, czy kongres powinien skupić się na konkretnej chorobie, czy też nie."
 panum.2000.f: "Konferencje medyczne mogą skupiać się na konkretnej chorobie, jeśli państwo-gospodarz posiada co najmniej jej opis. Kongres może zostać zorganizowany tylko raz dla każdej choroby. Obecni lekarze i mikrobiolodzy otrzymują dodatkowe wskazówki, dzięki którym mogą szybciej rozwijać swoje badania. Podczas ogólnego kongresu uczestniczące państwa otrzymują jedynie premię do postępów akademickich."
 panum.2000.g: "To ma być ogólna konferencja medyczna."
 panum.2001.t: "Kongres Medyczny"
 panum.2001.d: "Stolica przygotowuje się na międzynarodowe spotkanie specjalistów medycznych. [ROOT.Var('panum_physician_var').GetCharacter.GetFullName] będzie przewodniczyć obradom jako przewodniczący. [SCOPE.GetRootScope.GetCountry.GetCustom('panum_custom_congress_title')]"
 panum.2001.f: "Konferencje medyczne są doskonałą okazją do wymiany wiedzy medycznej. Osiągnięcia, które wcześniej były zarezerwowane tylko dla jednego kraju, są tutaj dzielone w braterski sposób. Konferencje medyczne mogą być organizowane wyłącznie przez lekarzy, ale zapraszani są również biolodzy ze specjalizacją w mikrobiologii i mogą dzielić się swoją wiedzą w zakresie patogenów oraz szczepionek. Jeśli państwo posiada zarówno lekarza, jak i mikrobiologa, obaj mogą uczestniczyć."
 panum.2001.g: "Wyślij zaproszenia!"
 panum.2002.t: "Zaproszenie na kongres medyczny"
 panum.2002.d: "[SCOPE.sCountry('panum_congress_host_country').GetName] zaprasza czołowe państwa medyczne na międzynarodowy kongres w swojej stolicy. Zaproszeni są zarówno lekarze, jak i mikrobiolodzy. [SCOPE.GetRootScope.GetCountry.GetCustom('panum_custom_congress_title')]"
 panum.2002.g: "Nie zapomnij o stetoskopach i mikroskopach!"
 panum.2003.t: "Opisy i leczenie"
 panum.2003.d: "Dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] ma wyjątkową okazję zdobyć przełomowe spostrzeżenia epidemiologiczne podczas Kongresu Medycznego w [SCOPE.sCountry('panum_congress_host_country').GetName]. Która choroba powinna być w centrum uwagi?"
 panum.2003.f: "Jeśli państwo uczestniczące w Kongresie Medycznym zna opis choroby lub leczenie choroby, których inne państwo nie posiada, to drugie może nauczyć się tego podczas kongresu. Wiedza może zostać ulepszona tylko w zakresie jednej choroby. Jeśli podczas kongresu nie jest możliwe zdobycie nowej wiedzy, nadal istnieje możliwość gromadzenia ogólnej wiedzy i ulepszenia technologii medycznej. Kluczowy jest w tym udział lekarza."
 panum.2003.g: "Lekarz powinien zdobyć od kolegów ogólną wiedzę medyczną."
 panum.2003.h: "Cholera."
 panum.2003.i: "Gruźlica."
 panum.2003.j: "Ospa prawdziwa"
 panum.2003.k: "Tyfus."
 panum.2003.l: "Żółta Febra."
 panum.2003.m: "Odra."
 panum.2003.n: "Szkarlatyna."
 panum.2003.o: "Dżuma."
 panum.2003.p: "Błonica."
 panum.2003.q: "Polio."
 panum.2004.t: "Patogen i szczepionka"
 panum.2004.d: "Dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] z radością odkrył, że na kongresie w [SCOPE.sCountry('panum_congress_host_country').GetName] było wielu ludzi o podobnych poglądach, którzy byli gotowi dzielić się swoją wiedzą mikrobiologiczną. Pozostaje tylko pytanie, o której z tych wspaniałych chorób [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] chciałby dowiedzieć się więcej w przyszłości?"
 panum.2004.f: "Jeśli państwo uczestniczące w Kongresie Medycznym zna patogen choroby lub szczepionkę na chorobę, których inne państwo nie posiada, to drugie może nauczyć się tego podczas kongresu. Wiedza może zostać ulepszona tylko w zakresie jednej choroby. Jeśli podczas kongresu nie jest możliwe zdobycie nowej wiedzy, nadal istnieje możliwość gromadzenia ogólnej wiedzy i ulepszenia technologii biologicznej. Kluczowy jest w tym udział biologa z cechą mikrobiologa."
 panum.2004.g: "Nasz naukowiec powinien zdobyć od kolegów ogólną wiedzę biologiczną."
 panum.2005.t: "Wizja medyczna"
 panum.2005.d_general: "Lekarze i biolodzy na kongresie zdecydowali w szczególności zmodernizować i ulepszyć szkolenie przyszłych studentów medycyny oraz napisali w tej sprawie wspólną deklarację."
 panum.2005.d_special: "Biorąc pod uwagę główny cel konferencji, lekarze i biolodzy zagłosowali za skierowaniem wszystkich wysiłków na walkę z konkretną chorobą w ciągu najbliższych kilku lat."
 panum.2005.f: "Jeśli na początku kongresu medycznego określony temat zostanie uznany za główny temat, wszystkie uczestniczące państwa otrzymają dodatkowe wskazówki dotyczące tej choroby — w zależności od tego, czy obecny jest fizyk, mikrobiolog, czy obaj. Jeśli jest to ogólny kongres, nacisk kładzie się na szkolenie nowego personelu medycznego."
 panum.2005.g: "To wydarzenie było warte zachodu."
 panum.2009.t: "Kongres Medyczny dobiega końca"
 panum.2009.d: "Kongres medyczny w [SCOPE.sCountry('panum_congress_host_country').GetName] zakończył się wczoraj. Lekarze i mikrobiolodzy są już w drodze powrotnej do domu i przywożą ze sobą liczne odkrycia."
 panum.2009.f: "Międzynarodowy Kongres Medyczny (fr. Congrès International de Médecine) był serią międzynarodowych konferencji naukowych poświęconych medycynie, które odbywały się cyklicznie od 1867 do 1913 roku. Pomysł zorganizowania takiego kongresu pojawił się w 1865 roku, podczas trzeciego dorocznego Kongresu Medycznego Francji; profesor Henri Giutrac zaproponował zorganizowanie międzynarodowej konferencji medycznej w 1867 roku, wykorzystując fakt, że lekarze i chirurdzy z całego świata z pewnością będą w Paryżu, aby uczestniczyć w ówczesnej Wystawie Światowej."
 panum.2009.g: "Mam nadzieję, że bufet był dobry?"
 panum_surgeon: "Chirurg"
 panum_surgeon_desc: "Chirurdzy są u siebie w codziennej praktyce medycznej, ale mogą być pomocni w badaniach medycznych lub traktatach anatomicznych."
 panum_psychiatrist: "Psychiatra"
 panum_psychiatrist_desc: "Psychiatrzy są zainteresowani poprawą warunków życia osób chorych psychicznie oraz napędzają badania i nowe metody leczenia w tej dziedzinie."
 panum_military_physician: "Lekarz wojskowy"
 panum_military_physician_desc: "Ten lekarz specjalizuje się w opiece nad rannymi na polu bitwy i odnosi szczególne sukcesy w doskonaleniu pierwszej pomocy."
 panum_yellow_fever: "Żółta febra"
