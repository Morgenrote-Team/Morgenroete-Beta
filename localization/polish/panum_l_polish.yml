 je_panum_measles_treatment_reason: "Dr. [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] obecnie bada kilku pacjentów w [SCOPE.sState('panum_disease_state').GetName], aby określić przyczynę #YELLOW odry#!. Tylko prawdziwe przyczyny występowania choroby mogą pomóc w opracowaniu środków zapobiegawczych prowadzących do nowoczesnej metody leczenia. Gdy lekarz zakończy swoją pracę, przedstawi swoją tezę publicznie. Nie zapobiegnie to przyszłym epidemiom — do tego potrzebna jest identyfikacja patogenu i ewentualnie szczepionka — ale skutki nowej epidemii będą stosunkowo niewielkie."
