 panum.840.t: "Tajemnica Czarnej Śmierci"
 panum.840.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] napisał obszerny traktat na temat przyczyn, przenoszenia i środków zwalczania dżumy. Szczególnie godna uwagi jest dygresja dotycząca roli szczurów i pcheł."
 panum.840.f: "W swoim traktacie o dżumie doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] podsumował wiele nowych odkryć. Oprócz zalecenia systemu rotacyjnej dezynfekcji oraz specjalnie opracowanej przez [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim] surowicy, [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] wskazuje na związek między pchłami jako nosicielami pałeczki dżumy a zakażaniem szczurów. Przenoszenie odbywa się od pchły do szczura, od szczura do szczura oraz od szczura do człowieka."
 panum.840.g: "Starożytny wróg nagle staje się możliwy do okiełznania."
 panum.841.t: "Niezwykłe rozprzestrzenienie"
 panum.841.d: "W ostatnich tygodniach doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] szczegółowo badał pierwsze pojawienie się oraz miejsca, w których rozprzestrzeniała się dżuma."
 panum.841.f: "„W ostatnich tygodniach otrzymałem mapy przesłane mi przez Departament Handlu i porównałem je z aktami moich kolegów z zagranicy. Lekarze twierdzący, że choroba jest związana z określonym klimatem lub geografią, są w błędzie. Można raczej zaobserwować falowe rozprzestrzenianie się na lądzie oraz rozprzestrzenianie się przez najwęższe porty. Nie powinno to dziwić, ponieważ Wielka Epidemia Dżumy w średniowieczu również szalała w Skandynawii, na Morzu Śródziemnym i na Bliskim Wschodzie. Ale czy przekona to moich kolegów?”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], [TimeKeeper.GetCurrentDate.Format('y')]"
 panum.841.g: "Czyli ma to niewiele wspólnego z geografią."
 panum.842.t: "Rotacyjne oczyszczanie"
 panum.842.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] przetestował nową procedurę w [SCOPE.sState('panum_disease_state').GetName], która okazała się niezwykle skuteczna."
 panum.842.f: "„Podjęto próbę systematycznej dezynfekcji miasta, ale okazała się ona bardzo kosztownym przedsięwzięciem i została porzucona na rzecz programu „ogólnego oczyszczania domów”, w którym stale zatrudniano zespół europejskich inspektorów sanitarnych oraz robotników. Dzielnice były oczyszczane rotacyjnie, tak aby każdy budynek mieszkalny został wyczyszczony co najmniej trzy razy w roku. Metoda ta ma wszystkie zalety prostoty, skuteczności i oszczędności. Każdemu inspektorowi przydzielano codziennie określoną liczbę pięter; mieszkańcy wynosili swoje rzeczy gospodarstwa domowego, podłogi i pomieszczenia były myte, a deski łóżek czyszczono w przenośnych żelaznych zbiornikach. Przeprowadzano kontrolę pod kątem drobnych nieprawidłowości konstrukcyjnych, przejścia dla szczurów i podobne otwory natychmiast wypełniano cementem, a wszelkie śmieci były wywożone.”\n\nZ instrukcji doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] dotyczących lepszej dezynfekcji [SCOPE.sState('panum_disease_state').GetName]"
 panum.842.g: "Ten system powinien zostać wdrożony wszędzie."
 panum.843.t: "Interesująca śmiertelność"
 panum.843.d: "Przeglądając statystyki, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] odkrył, że liczba zgonów wśród łapaczy szczurów jest nadzwyczaj wysoka."
 panum.843.f: "„Szef urzędu powiedział mi, że mylę korelację z przyczynowością. Jego zdaniem zbyt duży nacisk kładzie się na zakażenie szczurów przed wybuchem dżumy, jak niemal dosłownie stwierdził. Poważnie zastanawiam się teraz, czy gdyby większość władz uznała, że wybuchy dżumy mają coś wspólnego ze szczurami, trzymałaby się swojej teorii, gdyby istniała podobna liczba przesłanek wskazujących na chorobę wyłącznie tropikalną. Rażąco wyższa śmiertelność wśród łapaczy szczurów w porównaniu z resztą populacji to dla mnie już o jedną „korelację” za dużo.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], [TimeKeeper.GetCurrentDate.Format('y')]"
 panum.843.g: "Ile jeszcze potrzeba dowodów?"
 panum.844.t: "To szczury, głupcze!"
 panum.844.d: "Podczas dokładniejszego badania wybuchu dżumy w [SCOPE.sState('panum_disease_state').GetName] doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] dowiedział się, że przed wybuchem epidemii wszystkie szczury na tym obszarze wyginęły."
 panum.844.f: "„Widzę wiele martwych szczurów leżących na ziemi” — napisał Alexandre Yersin po przybyciu do Hongkongu 15 czerwca 1894 roku. „Szczury są z pewnością prawdziwymi roznosicielami epidemii.”"
 panum.844.g: "Odważna teza."
 panum.845.t: "Próbka"
 panum.845.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zdołał pobrać próbkę tkanki od ofiary dżumy w kostnicy. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] musiał wiele osób przekonywać. A właściwie [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] musiał przekupić kilka osób, aby ją zdobyć."
 panum.845.f: "„Leżą w swoich trumnach, które są całkowicie pokryte wapnem. Jedna trumna zostaje otwarta. Odsuwam wapno, aby odsłonić okolice pachwiny. Guz jest wyraźnie widoczny. Wycinam go w mniej niż minutę.” — Alexandre Yersin"
 panum.845.g: "Zwrócimy koszty."
 panum.851.t: "„Po prostu bieda i brud”"
 panum.851.d: "Lekarz powiatowy w [SCOPE.sState('panum_disease_state').GetName], działając w imieniu lokalnych władz, odrzucił obecne badania doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] jako pozbawione podstaw. Przyczyny i metody leczenia dżumy są „dobrze znane”."
 panum.851.f: "„Musimy wyrazić nasze zdziwienie, że rząd centralny w [ROOT.GetCountry.GetCapital.GetCityHubName] uznał za konieczne wysłanie urzędnika medycznego, mimo że sytuacja jest przez nas wystarczająco opanowana. Środki dezynfekcji i sanitarne przyniosły efekty, szczególnie czyszczenie domów i poprawa warunków życia mieszkańców. Trucizna prawdopodobnie powstaje z warunków atmosferycznych panujących pod domami w niektórych dzielnicach i jest spowodowana po prostu biedą i brudem. W zwykłym znaczeniu choroba nie jest zakaźna ani zaraźliwa.”\n\nZ listu lekarza powiatowego do rządu"
 panum.851.g: "Sukces mówi sam za siebie..."
 panum.852.t: "Zanieczyszczona żywność"
 panum.852.d: "Kilku naukowców, pozostając w bezpośrednim sporze z doktorem [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], jasno stwierdziło, że dżuma jest chorobą jelitową wywołaną przez złe odżywianie."
 panum.852.f: "„Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastNameNoFormatting] może mieć kilka ekscytujących teorii, ale [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] ma zdecydowanie zbyt małe doświadczenie w zajmowaniu się tą chorobą. Lokalni lekarze w [SCOPE.sState('panum_disease_state').GetName] wielokrotnie apelowali do władz, aby nie podważać ustalonych ustaleń. Fakty przedstawiają się następująco: 40 procent pacjentów chorych na dżumę cierpi na wymioty, kolejne 30 procent na biegunkę, a prawie 20 procent na bóle brzucha. Ogólnie dolegliwości żołądkowo-jelitowe udokumentowano u niemal 60 procent pacjentów. Jest więc jasne, że jest to infekcja przewodu pokarmowego, a jeszcze bardziej oczywiste jest, że najwyraźniej wynika ona zepsutego, złego lub w inny sposób niedostatecznego odżywiania.”\n\n"
 panum.852.g: "Doktorze — co pan odpowie?"
 panum.853.t: "Choroba tropikalna"
 panum.853.d: "Kilku światowej sławy lekarzy przedstawiło teorię, że dżuma jest kolejną chorobą tropikalną, która prawie nie występowałaby poza określonymi strefami klimatycznymi, a jeśli już, to jedynie sporadycznie. Jest więc chorobą zależną od klimatu."
 panum.853.f: "„Już w przeszłości odkryliśmy, że chłodniejszy klimat powodował ustępowanie fali dżumy. Wnioski są jasne: dżuma jest chorobą silnie powiązaną ze zmianami klimatycznymi. Dane meteorologiczne oraz zachowane obrazy wskazują, że ostatnia fala dżumy miała miejsce w znacznie cieplejszym środowisku niż obecnie. Zanik dżumy od końca XVII wieku koreluje z ochłodzeniem pogody, aż do całkowitego jej zniknięcia. Z kolei wzrost temperatur w ostatnich latach koreluje z rozprzestrzenianiem się dżumy na obszarach, które wcześniej uważano za chłodniejsze. Czy muszę rozwijać ten temat dalej?”\n\nList doktor Angeliki Hasenbein do doktora [ROOT.Var('panum_physician_var').GetCharacter.GetFullNameNoFormatting]"
 panum.853.g: "Czyli po prostu odmiana żółtej febry."
 panum.854.t: "Fałszywa dżuma"
 panum.854.d: "W ciągu ostatnich kilku dni doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] został wysłany do kilku szpitali, aby zbadać znajdujących się tam pacjentów. Jak się okazało, nie byli oni chorzy na dżumę, lecz na tyfus."
 panum.854.f: "„Czarna Śmierć, tyfus, cholera, gruźlica, dżuma... Och, to były czasy.” — Nieznany grabarz"
 panum.854.g: "Godne ubolewania."
 panum.854.h: "Skoro marnujemy czas, może doktor może go wykorzystać?"
 panum.861.t: "Opium nie jest rozwiązaniem."
 panum.861.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] dokładnie zbadał rzekome lecznicze działanie opium przeciwko chorobom dżumowym i doszedł do jednoznacznego wniosku."
 panum.861.f: "„To nie działa.”\n\nWniosek doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] dotyczący stosowania opium"
 panum.861.g: "To trochę rozczarowujące, a jednocześnie pouczające."
 panum.862.t: "Posocznica"
 panum.862.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] był w stanie udowodnić, że kilka eksperymentów, które miały wskazywać na chorobę przewodu pokarmowego jako przyczynę dżumy, zostało całkowicie błędnie zinterpretowanych."
 panum.862.f: "Pogląd o zakażeniu przez przewód pokarmowy, wywołanym przez konkretnie skażoną żywność, był szeroko akceptowany przez kilka lat, choć istnieli również tacy, którzy uważali „wyziewy z oddechu i skóry” za najważniejszy czynnik etiologiczny. Przeprowadzono wiele eksperymentów żywieniowych na zwierzętach z użyciem materiału dżumowego, a hipoteza żołądkowo-jelitowa zyskała na znaczeniu, ponieważ wiele zwierząt i ptaków zmarło na chorobę posocznicową przypominającą dżumę. Jednak wyniki nie były rozstrzygające i ostatecznie zostały podważone w Hongkongu w 1904 roku przez ówczesnego lekarza sanitarnego, który wyraził całkowity sprzeciw wobec tego poglądu."
 panum.862.g: "To poważny cios dla teorii, że dżuma była wywoływana przez skażoną żywność."
 panum.863.t: "Antybiotyki"
 panum.863.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] był w stanie wykazać w kilku eksperymentach, że pacjenci chorzy na dżumę doskonale reagują na leczenie antybiotykami i zdecydowanie zaleca to podejście."
 panum.863.f: "„Nazywanie moich eksperymentów całkowitym sukcesem byłoby niedopowiedzeniem. W rzeczywistości byłem zaskoczony tym, jak działały antybiotyki. Kilku pacjentów stwierdziło nawet, że czuli się tak, jakby zostali wyleczeni. Jeśli ten efekt zostanie potwierdzony, poszukiwanie szczepionki przeciwko dżumie może stać się niepotrzebne.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], [TimeKeeper.GetCurrentDate.Format('y')]"
 panum.863.g: "Czy antybiotyki nie mają żadnych wad?"
 panum.864.t: "Środki owadobójcze"
 panum.864.d: "Masowe użycie środków owadobójczych w ognisku dżumy nie przyniosło żadnego efektu. Według doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] jest to zaskakujący sukces."
 panum.864.f: "„Słusznie pytacie, dlaczego cieszę się z tej porażki. Ale naukowcy uczą się również z pozornych przegranych. W tym sensie nie była to porażka, lecz dowód. Wielu moich kolegów sugerowało, że dżuma może być chorobą tropikalną podobną do malarii, o której stwierdzono, że jest przenoszona przez komary. Przynajmniej możemy odłożyć to założenie na bok.”\n\nZ wywiadu z doktorem [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] w lokalnej gazecie"
 panum.864.g: "Jedna opcja mniej."
 panum.865.t: "Latryny"
 panum.865.d: "Podczas badania środków higienicznych w [SCOPE.sState('panum_disease_state').GetName] doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] odkrył, że nowoczesna infrastruktura kanalizacyjna i latryny pozostawiają wiele do życzenia, szczególnie w dzielnicy dotkniętej dżumą, i skontaktował się z lokalnymi władzami."
 panum.865.f: "„Nawet jeśli nie zostało jeszcze ostatecznie wyjaśnione, jak najlepiej radzić sobie z dżumą, i niezależnie od tego, jak wyglądają moje osobiste teorie oraz teorie moich kolegów — doświadczenie wykazało, że podłogi skażone odchodami oraz stojąca zanieczyszczona woda powinny zostać usunięte, czy to ze względu na podejrzewane powstawanie z nich miazmatów, czy dlatego, że stanowią ogniska zarazków. Jeśli chcemy w przyszłości kontrolować nie tylko dżumę, ale również inne źródła chorób, musimy podjąć działania zapobiegawcze.”\n\nDoktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] w liście do lokalnego rządu"
 panum.865.g: "Będzie to kosztowne, ale jest nieuniknione."
 panum.870.t: "Pałeczka dżumy"
 panum.870.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zbadał próbkę tkanki pod swoim mikroskopem i ostatecznie ustalił: dżuma jest przenoszona przez pałeczkę!"
 panum.870.f: "„20 czerwca 1894 roku. Guzy zawierają, wyraźnie i doskonale widoczne, ogromną liczbę pałeczek. Są małe, krótkie i mają zaokrąglone końce. To bez wątpienia drobnoustrój dżumy.” — Alexandre Yersin"
 panum.870.g: "To zmienia wszystko!"
 panum.871.t: "Pchły"
 panum.871.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] mógł dokonać jednego z najważniejszych odkryć w historii badań nad dżumą: związku między pchłami, szczurami i wybuchem epidemii dżumy."
 panum.871.f: "W [TimeKeeper.GetCurrentDate.Format('y')] [ROOT.Var('panum_physician_var').GetCharacter.GetFullName] odkrył wektor przenoszenia choroby przez pchły szczurze. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] zauważył, że osoby, które zachorowały, nie musiały mieć ze sobą bliskiego kontaktu, aby zarazić się chorobą. W chińskim Yunnanie mieszkańcy uciekali ze swoich domów, gdy tylko zobaczyli martwe szczury, a na wyspie Formoza (Tajwan) mieszkańcy uważali obchodzenie się z martwymi szczurami za czynność zwiększającą ryzyko zachorowania na dżumę. Obserwacje te doprowadziły [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim] do podejrzenia, że pchła może być pośrednim czynnikiem w przenoszeniu dżumy, ponieważ ludzie zarażali się dżumą tylko wtedy, gdy mieli kontakt ze szczurami, które padły mniej niż 24 godziny wcześniej. W klasycznym już eksperymencie [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] wykazał, jak zdrowy szczur zmarł na dżumę po tym, jak zakażone pchły przeskoczyły na niego ze szczura, który niedawno padł na tę chorobę."
 panum.871.g: "Fascynujące."
 panum.872.t: "Surowica przeciw dżumie"
 panum.872.d: "Na podstawie wcześniejszej wiedzy o przenoszeniu i pochodzeniu dżumy, a także eksperymentów z pałeczką dżumy, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] opracował wysoce skuteczną surowicę przeciw dżumie i z powodzeniem przetestował ją na pierwszym pacjencie."
 panum.872.f: "„Od północy pacjent staje się spokojniejszy, a o szóstej rano (…) budzi się i oświadcza, że czuje się wyleczony.” — Alexandre Yersin"
 panum.872.g: "Działa!"
