 je_panum_cholera_treatment_expedition_reason: "Dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] prowadzi wyprawę medyczną w [SCOPE.sCountry('target').GetName], aby znaleźć metody leczenia #YELLOW cholery#!. Dopóki choroba szaleje w tym kraju, [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] ma co miesiąc szansę odkryć przyczyny choroby i znaleźć sposób na jej powstrzymanie.\n\nJeśli epidemia wygaśnie, dotychczasowe postępy naukowe nie przepadną, lecz zostaną uwzględnione również podczas kolejnych badań."
