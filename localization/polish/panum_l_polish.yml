 panum_medical_techniques_level_2_modifier: "Techniki Medyczne: Poziom 2"
 panum_medical_techniques_level_3_modifier: "Techniki Medyczne: Poziom 3"
 panum_medical_techniques_level_4_modifier: "Techniki Medyczne: Poziom 4"
 panum_medical_techniques_level_5_modifier: "Techniki Medyczne: Poziom 5"
 panum_medical_techniques_level_6_modifier: "Techniki Medyczne: Poziom 6"
 panum_medical_techniques_level_7_modifier: "Techniki Medyczne: Poziom 7"
