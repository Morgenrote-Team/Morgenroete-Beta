 panum.3000.t: "Czerwony Krzyż"
 panum.3000.d: "W obliczu okropieństw współczesnej wojny w [SCOPE.sState('panum_red_cross_state').GetName] powołano „Międzynarodowy Komitet Pomocy Towarzystw Opieki nad Rannymi”. Ma on działać ponad granicami państw, aby pomagać osobom rannym podczas wojny."
 panum.3000.f: "Czerwony Krzyż przyjął następujące uchwały:\n- ustanowienie krajowych towarzystw pomocy dla rannych żołnierzy\n- neutralność rannych\n- wysyłanie ochotniczych pielęgniarek na pola bitew w celu udzielania pomocy\n- organizowanie i przeprowadzanie kolejnych międzynarodowych konferencji\n- wprowadzenie symbolu identyfikacyjnego i ochronnego w postaci białej opaski z czerwonym krzyżem"
 panum.3000.g: "Decydujący krok naprzód we współpracy międzynarodowej."
 panum.3001.d: "W obliczu okropieństw współczesnej wojny w [SCOPE.sState('panum_red_cross_state').GetName] powołano „Międzynarodowy Komitet Pomocy Towarzystw Opieki nad Rannymi”. Ma on działać ponad granicami państw, aby pomagać osobom rannym podczas wojny. Wysłannik zapytał, czy nasz naród również chciałby dołączyć do tego stowarzyszenia."
 panum.3001.g: "Dołączamy do tej organizacji jako członek założyciel."
 panum.3001.h: "Interesujące."
 panum.3002.d: "Uznając okropieństwa współczesnej wojny, szwajcarski kupiec Henry Dunant założył „Międzynarodowy Komitet Pomocy Towarzystw Opieki nad Rannymi”. Ma on działać ponad granicami państw, aby pomagać osobom rannym podczas wojny."
 panum.3002.f: "W 1859 roku szwajcarski kupiec Henry Dunant przypadkiem trafił na pole bitwy pod Solferino. Wstrząśnięty wołaniami o pomoc około 40 000 umierających i rannych żołnierzy zaczął zachęcać ochotników z okolicy do niesienia pomocy ofiarom — niezależnie od tego, czy byli przyjaciółmi, czy wrogami. Jego książka „Wspomnienie Solferino” z 1862 roku zwróciła uwagę mas na okropieństwa współczesnej wojny. Zarówno rządy, jak i obywatele zaczęli interesować się ograniczeniem skutków wojen. 17 lutego 1863 roku pięcioosobowy komitet, którego członkiem był Dunant, założył Międzynarodowy Komitet Czerwonego Krzyża. Delegaci z 16 państw spotkali się na pierwszej Konferencji Genewskiej w dniach od 26 do 29 października 1863 roku, aby dalej rozwijać idee Dunanta. Czerwony Krzyż na białej fladze stał się międzynarodowym symbolem ochrony dla niosących pomoc. W 1901 roku Dunant otrzymał pierwszą na świecie Pokojową Nagrodę Nobla."
 panum.3011.t: "Konwencja [SCOPE.GetRootScope.GetCountry.GetCustom('panum_custom_convention_title')]"
 panum.3011.d: "W [SCOPE.GetRootScope.GetCountry.GetCustom('panum_custom_convention_title')] zwołano międzynarodową konferencję w celu ustanowienia ochrony rannych, neutralności personelu medycznego oraz Czerwonego Krzyża jako symbolu ochrony."
 panum.3011.f: "„Ale kobiety z Castiglione, widząc, że nie czyniłem żadnych rozróżnień między narodowościami, poszły za moim przykładem, okazując tę samą życzliwość tym ludziom, których pochodzenie było tak różne i którzy wszyscy byli dla nich obcymi. „Tutti fratelli” — powtarzały ze wzruszeniem. Cała cześć tym kobietom, tym dziewczętom z Castiglione! Niewzruszone, niestrudzone, niezachwiane, ich ciche poświęcenie sprawiało, że zmęczenie, okropności i własne oddanie schodziły na dalszy plan.” — Henry Dunant"
 panum.3011.g: "Konwencja [SCOPE.GetRootScope.GetCountry.GetCustom('panum_custom_convention_title')]. Brzmi dobrze."
 panum.3012.t: "Traktaty [SCOPE.GetRootScope.GetCountry.GetCustom('panum_custom_convention_title')]"
 panum.3012.d: "W [SCOPE.GetRootScope.GetCountry.GetCustom('panum_custom_convention_title')] zaplanowano międzynarodową konferencję w celu promowania rozbrojenia oraz rozszerzenia wcześniejszych zasad prawa międzynarodowego dotyczących wojny lądowej na wojnę morską."
 panum.3012.f: "„Moralne poczucie znaczenia ludzkiego życia; humanitarne pragnienie, by choć trochę ulżyć cierpieniom tych wszystkich biednych nieszczęśników lub przywrócić im utraconą odwagę; gwałtowna i niestrudzona aktywność, którą człowiek wyzwala w takich chwilach — wszystko to łączy się, tworząc rodzaj energii, która wywołuje nieodparte pragnienie niesienia pomocy tak wielu osobom, jak tylko jest to możliwe.\n\nNie ma już miejsca na żal przy licznych scenach tej straszliwej i wzniosłej tragedii.” — Henry Dunant"
 panum.3012.g: "Traktaty [SCOPE.GetRootScope.GetCountry.GetCustom('panum_custom_convention_title')]. Brzmi dobrze."
 panum.3013.t: "Protokół [SCOPE.GetRootScope.GetCountry.GetCustom('panum_custom_convention_title')]"
 panum.3013.d: "W [SCOPE.GetRootScope.GetCountry.GetCustom('panum_custom_convention_title')] zwołano międzynarodową konferencję w celu zakazania użycia gazów trujących podczas wojny."
 panum.3013.f: "„Ponieważ nowe i straszliwe metody zniszczenia są wynajdywane każdego dnia z wytrwałością godną lepszego celu, a ponieważ wynalazcy tych narzędzi zagłady są w większości wielkich państw europejskich, zaangażowanych w wyścig zbrojeń, oklaskiwani i zachęcani; oraz ponieważ w końcu stan umysłów w Europie, wraz z wieloma innymi oznakami, wskazuje na możliwość przyszłych wojen, których uniknięcie wcześniej czy później wydaje się niemal niemożliwe — wobec tego wszystkiego, dlaczego nie można by wykorzystać czasu względnego spokoju i ciszy, aby zbadać i spróbować rozwiązać kwestię o tak ogromnym i światowym znaczeniu, zarówno z punktu widzenia humanitarnego, jak i chrześcijańskiego?” — Henry Dunant"
 panum.3013.g: "Protokół [SCOPE.GetRootScope.GetCountry.GetCustom('panum_custom_convention_title')]. Brzmi dobrze."
 panum.3021.t: "Sanitariusz Czerwonego Krzyża"
 panum.3021.d: "Po niezwykle krwawej porażce sanitariusz wyróżnił [SCOPE.sCharacter('panum_new_physician_scope').GetHerselfHimself] w szpitalu polowym. [SCOPE.sCharacter('panum_new_physician_scope').GetSheHe|U] należy do Czerwonego Krzyża i być może jest przeznaczony do czegoś większego niż zwykła służba polowa."
 panum.3021.f: "„W jednym ze szpitali w Cremonie włoski lekarz powiedział: Zachowujemy dobre rzeczy dla naszych przyjaciół z armii sprzymierzonych, a naszym wrogom dajemy tylko to, co niezbędne. Jeśli umrą, tym gorzej dla nich! Aby usprawiedliwić te barbarzyńskie słowa, dodał, że słyszał od niektórych włoskich żołnierzy powracających z Werony i Mantui, iż Austriacy pozwalali rannym z armii francusko-sardyńskiej umierać bez opieki. Szlachetna dama z Cremony, hrabina..., która usłyszała słowa lekarza i z największym zapałem poświęcała się pracy w szpitalach, pospieszyła wyrazić swoją dezaprobatę, oświadczając, że poświęcała Austriakom dokładnie tyle samo uwagi co sprzymierzeńcom i nie czyniła żadnej różnicy między przyjaciółmi a wrogami. Jak bowiem powiedziała, nasz Pan Jezus Chrystus nie czynił takich rozróżnień między ludźmi, czyniąc dobro.” — Henry Dunant"
 panum.3021.g: "Witaj, doktorze [SCOPE.sCharacter('panum_new_physician_scope').GetLastName]."
 panum.740.t: "O jedno zmartwienie mniej dla rodziców."
 panum.740.d: "Po wielkim wysiłku doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] w końcu napisał [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] traktat o skutecznej metodzie leczenia [SCOPE.GetRootScope.GetCountry.GetCustom('panum_custom_disease_title')]. Jest on uważany za kamień milowy w [ROOT.GetCountry.GetAdjectiveNoFlag] medycynie."
 panum.740.f: "Wydział Lekarski z niecierpliwością oczekiwał na pracę naukową dotyczącą metody leczenia autorstwa [ROOT.Var('panum_physician_var').GetCharacter.GetFullName]. W [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] traktacie doktor opisuje całą serię skutecznych środków do zwalczania szkarlatyny. Współczesna medycyna oferuje cały szereg możliwości skutecznego powstrzymywania szkarlatyny nawet po wystąpieniu choroby. Kluczową rolę odgrywa nowo wynaleziony antytoksyn. Praca doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] nosi nazwę [SCOPE.GetRootScope.GetCountry.GetCustom('panum_custom_treatment_title')]."
 panum.740.g: "Niezliczeni rodzice będą teraz spać spokojniej."
 panum.741.t: "Test [ROOT.Var('panum_physician_var').GetCharacter.GetLastNameNoFormatting]"
 panum.741.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] opracował procedurę nazwaną na cześć [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim], która określa, czy pacjent ma odporność na szkarlatynę."
 panum.741.f: "Test Dicka, opracowany w 1924 roku przez George'a F. Dicka i Gladys Dick, był stosowany do identyfikowania osób podatnych na szkarlatynę. Test Dicka polegał na wstrzyknięciu rozcieńczonego szczepu paciorkowców znanych jako przyczyna szkarlatyny; reakcja skóry w miejscu wstrzyknięcia wskazywała osoby podatne na zachorowanie na szkarlatynę. Reakcję można było zaobserwować cztery godziny po wstrzyknięciu, ale była ona bardziej widoczna po 24 godzinach. Jeśli na skórze nie pojawiła się żadna reakcja, uznawano, że dana osoba nie jest zagrożona chorobą, ponieważ rozwinęła na nią odporność."
 panum.741.g: "Przydatna procedura."
 panum.742.t: "Surowica przeciw szkarlatynie"
 panum.742.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] opracował skuteczną surowicę przeciw szkarlatynie, którą [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] uzyskał z krwi konia."
 panum.742.f: "Surowica przeciw szkarlatynie była stosowana od listopada 1900 roku po jej opracowaniu w Laboratorium Seroterapeutycznym Szpitala Rudolfa w Wiedniu w Austrii. Surowicę pozyskiwano z krwi koni. Zakażonym dzieciom wstrzykiwał ją pod skórę brzucha doktor Paul Moser. Śmiertelność z powodu szkarlatyny (znanej również jako scarlatina) znacznie spadła po zastosowaniu surowicy krwi. Antytoksyna Mosera zmniejszyła śmiertelność szkarlatyny o 40%."
 panum.742.g: "Krew konia? Fuj."
 panum.743.t: "Antytoksyna"
 panum.743.d: "Po kilku testach doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] jest pewien, że [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] stworzył antytoksynę skuteczną przeciwko szkarlatynie."
 panum.743.f: "„Pomimo ostatnich ważnych postępów w poznaniu i leczeniu szkarlatyny ta budząca ogromny strach choroba znacznie przekroczyła swoje sezonowe występowanie. Podana odpowiednio wcześnie antytoksyna zmniejszy zagrożenie związane ze szkarlatyną oraz jej częstymi późniejszymi powikłaniami. Choroba nadal jednak posiada cechy, które sprawiają, że jej całkowite wyeliminowanie jest niezwykle pożądane. Stwierdzono, że zwiększające się dawki toksyny podawane osobom podatnym sprawiają, że osoby te stają się odporne.”"
 panum.743.g: "Decydujący przełom!"
