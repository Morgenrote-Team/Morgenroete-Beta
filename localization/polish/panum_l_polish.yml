 panum_vitamins_tech: "Witaminy"
 panum_vitamins_tech_desc: "Poprzez wyizolowanie określonych składników odżywczych, których potrzebuje organizm, można sprawić, że więcej ludzi będzie miało zdrową i zbilansowaną dietę."
 panum.2006.t: "Teoria zarazków zostaje wzmocniona"
 panum.2006.d: "Teoria zarazków zostaje wzmocniona Kongres medyczny stworzył również okazję dla kilku lekarzy do wymiany poglądów na temat przyczyn choroby. Staje się coraz bardziej widoczne, że coraz mniej badaczy wierzy w tradycyjną teorię miazmatów. Teoria zarazków jest teraz uznawana za standard wśród najbardziej cenionych uczonych."
 panum.2006.f: "„W ostatnim czasie pewne dostosowanie rzeczywiście zaczęło się pojawiać, ponieważ poszczególne kraje nie postępują już w tak uprzedzony sposób jak wcześniej, a jeden przejmuje od drugiego te środki ochrony, które wydają się dobrze sprawdzone. Jednak pośród wciąż ogromnej różnorodności sposobów i środków zwalczania gruźlicy nadal konieczne jest zapytać, jakie działania rzeczywiście najlepiej spełniają naukowe wymagania i ogólne ustalenia w walce z chorobami zakaźnymi.\n\nLecz zanim przejdziemy do odpowiedzi na to pytanie, musimy jasno uświadomić sobie, w jaki sposób dochodzi do zakażenia gruźlicą, czyli jak prątki gruźlicy przedostają się do ludzkiego organizmu; ponieważ wszystkie środki zapobiegawcze przeciwko chorobie zakaźnej mogą być skierowane jedynie na powstrzymanie zarazków choroby przed wtargnięciem do ciała.” — Robert Koch"
 panum.2006.g: "Tych dowodów nie można tak po prostu odrzucić."
 panum.2201.t: "Teoria miazmatów traci dominującą pozycję interpretacyjną"
 panum.2201.d: "Z każdym dniem, gdy doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] coraz bardziej skupia się na nowych metodach badawczych, tradycyjna teoria miazmatów staje się coraz mniej istotna. Teoria zarazków wydaje się bardziej przekonująca."
 panum.2201.f: "„Panowie, to mikroby będą miały ostatnie słowo!” — Louis Pasteur"
 panum.2201.g: "Czyli teoria miazmatów jest wątpliwa?"
