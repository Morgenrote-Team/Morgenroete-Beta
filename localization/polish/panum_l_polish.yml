 panum.55.t: "Dr [ROOT.Var('panum_physician_var').GetCharacter.GetFullName] potrafi opisać obcą chorobę"
 panum.55.d: "W innym kraju wybuchła epidemia, którą twój [concept_panum_physician] może zbadać, aby opisać chorobę."
 panum.55.g: "Natychmiast wyślijmy naszego lekarza!"
 panum.55.h: "Nie teraz."
 panum.55.i: "Powiadamiaj mnie w mniej natarczywy sposób."
 panum.55.j: "Nie informuj mnie już o tym."
 panum_foreign_disease_research_only_notification_tt: "Od teraz będziesz otrzymywać #V powiadomienia#! o możliwości wysłania swojego [concept_panum_physician] do krajów dotkniętych epidemiami."
 panum_foreign_disease_research_no_notification_tt: "Nie będziesz już #n otrzymywać#! powiadomień o możliwości wysłania swojego [concept_panum_physician] do krajów dotkniętych epidemiami."
 panum.56.t: "Dr [ROOT.Var('panum_physician_var').GetCharacter.GetFullName] może znaleźć metodę leczenia obcej choroby"
 panum.56.d: "W innym kraju wybuchła epidemia, którą twój [concept_panum_physician] może zbadać, aby znaleźć metodę leczenia tej choroby."
 notification_panum_foreign_description_possible_notification_name: "Możliwa wyprawa obserwacyjna"
 notification_panum_foreign_description_possible_notification_desc: "Możesz wysłać swojego [concept_panum_physician] na wyprawę obserwacyjną, aby opisał chorobę."
 notification_panum_foreign_treatment_possible_notification_name: "Możliwa wyprawa badawcza"
 notification_panum_foreign_treatment_possible_notification_desc: "Możesz wysłać swojego [concept_panum_physician] na wyprawę badawczą, aby opisał chorobę."
 panum.131.t: "Przerwane badania nad chorobami"
 panum.131.d: "Ponieważ groźna epidemia w kraju [GetPlayer.GetName] dobiegła końca, a ostatni pacjenci wyzdrowieli, dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] na razie zakończył [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] badania. Lekarzowi udało się zebrać kilka ważnych informacji, które powinny ułatwić przyszłe naukowe opisanie choroby, ale [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] nie dokonał jeszcze przełomowego odkrycia."
 panum.131.f: "„Wszelkie rozważania na temat pochodzenia tej choroby i jej przyczyn, o ile można znaleźć przyczyny zdolne wywołać tak wielkie spustoszenie, pozostawiam innym autorom, zarówno świeckim, jak i zawodowym. Sam ograniczę się do opisania jej natury i wyjaśnienia objawów, dzięki którym być może uczeni będą mogli ją rozpoznać, gdyby kiedykolwiek wybuchła ponownie. Mogę to uczynić tym łatwiej, że sam przeszedłem tę chorobę i obserwowałem jej przebieg u innych”. – Tukidydes"
 panum.131.g: "Kolejny krok został wykonany."
 panum.133.t: "Przerwana wyprawa medyczna"
 panum.133.d: "Wyprawa medyczna zakończyła na razie swoje działania, ponieważ epidemia dobiegła końca. Dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] nie zdołał ukończyć naukowego opisu choroby, ale [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] badania mogą okazać się cenne w przyszłości."
 panum.134.d: "Straszliwa epidemia, która nawiedziła nasz kraj, dobiegła końca. Oznacza to jednak, że dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] musi na razie przerwać [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] badania, ponieważ [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] nie może już przeprowadzać kolejnych eksperymentów mających na celu znalezienie metody leczenia tej choroby. Mimo to lekarz zdobył cenną wiedzę, która z pewnością przyda się w przyszłości."
 panum.134.f: "„Zakażenie przenosi się z jednej rzeczy na drugą, a jego pierwotną przyczyną jest wniknięcie niewidzialnej cząsteczki”. – Girolamo Fracastoro"
 panum.134.g: "To tylko kwestia czasu, zanim znajdziemy lekarstwo."
 panum.136.d: "Niestety, wyprawa badawcza została na razie zakończona bez uzyskania ostatecznych wyników. Ponieważ epidemia opuściła kraj, dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] nie zdołał zweryfikować [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] teorii. Wstępne wyniki badań będą jednak dostępne dla [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim] i przyszłych pokoleń, aby ostatecznie znaleźć metodę leczenia."
