 panum.51.t: "Dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] udaje się do stanu dotkniętego epidemią"
 panum.51.f: "Dokładny opis choroby to pierwszy krok do jej zrozumienia, a następnie zwalczania. Same opisy nie przynoszą jeszcze bezpośredniej poprawy stanu chorych, ale stanowią podstawę do opracowania późniejszych metod leczenia. Lekarze badający epidemię we własnym kraju pracują skuteczniej niż ci, którzy udają się w tym celu za granicę."
 je_panum_cholera_description: "Rozpoznanie cholery"
 je_panum_tuberculosis_description: "Rozpoznanie gruźlicy"
 je_panum_smallpox_description: "Rozpoznanie ospy prawdziwej"
 je_panum_typhus_description: "Rozpoznanie tyfusu"
 je_panum_yellow_fever_description: "Rozpoznanie żółtej febry"
 je_panum_cholera_description_reason: "Dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] bada obecnie kilku pacjentów, aby określić objawy #YELLOW cholery#!. Kluczowe znaczenie ma umiejętność odróżniania jej od innych, podobnych lub współistniejących chorób. Po zakończeniu pracy lekarz udostępnia swoje opracowanie publicznie, aby przyszłe pokolenia miały większe szanse na rozpoznanie przyczyn choroby i opracowanie metod jej leczenia."
 je_panum_tuberculosis_description_reason: "Dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] bada obecnie kilku pacjentów, aby określić objawy #YELLOW gruźlicy#!. Kluczowe znaczenie ma umiejętność odróżniania jej od innych, podobnych lub współistniejących chorób. Po zakończeniu pracy lekarz udostępnia swoje opracowanie publicznie, aby przyszłe pokolenia miały większe szanse na rozpoznanie przyczyn choroby i opracowanie metod jej leczenia."
 je_panum_smallpox_description_reason: "Dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] bada obecnie kilku pacjentów, aby określić objawy #YELLOW ospy prawdziwej#!. Kluczowe znaczenie ma umiejętność odróżniania jej od innych, podobnych lub współistniejących chorób. Po zakończeniu pracy lekarz udostępnia swoje opracowanie publicznie, aby przyszłe pokolenia miały większe szanse na rozpoznanie przyczyn choroby i opracowanie metod jej leczenia."
 je_panum_typhus_description_reason: "Dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] bada obecnie kilku pacjentów, aby określić objawy #YELLOW tyfusu#!. Kluczowe znaczenie ma umiejętność odróżniania go od innych, podobnych lub współistniejących chorób. Po zakończeniu pracy lekarz udostępnia swoje opracowanie publicznie, aby przyszłe pokolenia miały większe szanse na rozpoznanie przyczyn choroby i opracowanie metod jej leczenia."
 je_panum_yellow_fever_description_reason: "Dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] bada obecnie kilku pacjentów, aby określić objawy #YELLOW żółtej febry#!. Kluczowe znaczenie ma umiejętność odróżniania jej od innych, podobnych lub współistniejących chorób. Po zakończeniu pracy lekarz udostępnia swoje opracowanie publicznie, aby przyszłe pokolenia miały większe szanse na rozpoznanie przyczyn choroby i opracowanie metod jej leczenia."
 panum.52.t: "Wyprawa badawcza w celu obserwacji medycznych"
 panum.52.d: "Dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zebrał niewielki zespół ekspertów i asystentów, którzy mają odpowiednie kwalifikacje, by dokładnie obserwować epidemię za granicą i wyciągać z niej wnioski. Teraz trzeba zdecydować, jaką chorobę i w którym kraju należy badać."
 panum.52.f: "Lekarz może wyruszyć na dwa rodzaje wypraw medycznych: wyprawy obserwacyjne i wyprawy badawcze. Wyprawy obserwacyjne pomagają uzupełnić opis choroby, natomiast wyprawy badawcze służą odkryciu metody jej leczenia. Wyprawa nie jest jednak tak skuteczna jak badania prowadzone na miejscu i pełne zbadanie choroby może wymagać kilku prób."
 panum.52.g: "Epidemia cholery w [SCOPE.sCountry('panum_cholera_country_scope').GetName]"
