 panum_physician_experienced: "Doświadczony lekarz"
 panum_physician_experienced_desc: "Po wielu latach pracy przy leczeniu pacjentów ten $panum_physician$ zdobył bogate doświadczenie w swojej dziedzinie."
 panum_physician_famous: "Słynny lekarz"
 panum_physician_famous_desc: "Innowacje medyczne i odkrycia dokonane przez tego $panum_physician$ przyniosły mu sławę w dziedzinie medycyny."
