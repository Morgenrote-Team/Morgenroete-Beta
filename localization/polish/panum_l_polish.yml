 panum_psychologist: "Psycholog"
 panum_psychologist_desc: "Ta osoba uważa, że miałeś jakieś problemy z mamusią i tatusiem."
 panum_metamphetamine_army_modifier: "Żołnierze pod wpływem metamfetaminy"
 panum.2621.t: "Pojęcie lęku"
 panum.2621.d: "Søren Kierkegaard, czołowy duński filozof, opublikował „Pojęcie lęku”, dzieło o charakterze estetycznym, filozoficznym i psychologicznym, które przyciągnęło uwagę kopenhaskiej publiczności."
 panum.2621.f: "„Możliwość wolności nie polega na zdolności wyboru dobra lub zła. Możliwość polega na tym, by móc. W systemie logicznym wygodnie jest powiedzieć, że możliwość przechodzi w rzeczywistość. Jednak w rzeczywistości nie jest to już takie proste i potrzebne jest pojęcie pośrednie. Tym pojęciem jest lęk, lecz nie wyjaśnia on jakościowego skoku, podobnie jak nie może go usprawiedliwić etycznie. Lęk nie należy ani do kategorii konieczności, ani do kategorii wolności; jest wolnością uwikłaną, w której wolność nie jest sama w sobie wolna, lecz uwikłana – nie przez konieczność, ale w samą siebie”. – Søren Kierkegaard"
 panum.2621.g: "Jeden z najwybitniejszych umysłów Danii."
 panum.2621.h: "Kierkegaard zostanie nowym pisarzem narodowym Danii."
 panum.2622.t: "Dziwny przypadek [SCOPE.sCharacter('panum_phineas_gage').GetFullName]"
 panum.2622.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zbadał niezwykły przypadek brygadzisty [SCOPE.sCharacter('panum_phineas_gage').GetFullName]. Podczas eksplozji żelazny pręt przebił jego czaszkę od dołu ku górze, pozostawiając rozległy kanał rany. Według doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] po kilku tygodniach mężczyzna odzyskał sprawność fizyczną, a jego zdolności poznawcze, w tym percepcja, pamięć, inteligencja i zdolności językowe, a także sprawność ruchowa, pozostały całkowicie nienaruszone. Jednak w okresie po wypadku u [SCOPE.sCharacter('panum_phineas_gage').GetLastName] zaobserwowano wyraźne zmiany osobowości."
 panum.2622.f: "„Straszliwy wypadek. – Wczoraj, gdy [SCOPE.sCharacter('panum_phineas_gage').GetFullName], brygadzista pracujący przy budowie linii kolejowej w [SCOPE.sState('panum_phineas_gage_state').GetName], ubijał ładunek wybuchowy, doszło do eksplozji prochu, która wyrzuciła żelazny pręt o obwodzie jednego i jednej czwartej cala oraz długości trzech stóp i ośmiu cali, używany przez niego podczas pracy. Pręt wbił się w prawą stronę jego twarzy, roztrzaskał górną szczękę, przeszedł za lewym okiem i wyszedł przez szczyt czaszki.\n\nNajbardziej niezwykłą okolicznością tego tragicznego zdarzenia jest fakt, że dziś o godzinie drugiej po południu poszkodowany wciąż żył, zachowując pełną świadomość i zdolność rozumowania, a przy tym nie odczuwał bólu”.\n\nKronika [ROOT.GetCountry.GetCapital.GetCityHubName]"
 panum.2622.g: "Czy zatem istnieje związek między psychiką a poszczególnymi obszarami mózgu?"
 panum.2623.t: "Psychologia transkulturowa"
 panum.2623.d: "Podczas wizyty w [SCOPE.sState('panum_colonial_state').GetName] doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] ze zdumieniem odkrył, że choroby psychiczne, takie jak te często występujące w [ROOT.GetCountry.GetCapital.GetCityHubName], na tym obszarze niemal w ogóle nie występują."
 panum.2623.f: "W 1904 roku Emil Kraepelin odbył czteromiesięczną podróż na Jawę, podczas której przebadał 225 osób przebywających w zakładzie psychiatrycznym w Buitenzorg (obecnie Bogor). Jako jedyny spośród czołowych psychiatrów swoich czasów interesował się badaniem zjawisk transkulturowych w psychiatrii. Z jednej strony chciał ustalić, czy pewne formy obłędu, stanowiące główną przyczynę pobytu pacjentów w naszych zakładach, występują również w zupełnie odmiennych warunkach życia i wśród całkowicie różnych społeczności plemiennych, a jeśli tak, to czy przybierają taką samą postać i występują z taką samą częstotliwością jak u nas. Z drugiej strony przewidywał, że „częstotliwość występowania i formy obłędu staną się pewnego dnia bogatym źródłem wiedzy, pozwalającym na głębsze zrozumienie osobliwości poszczególnych ludów”."
 panum.2623.g: "Najwyraźniej niektóre nerwice są związane z uwarunkowaniami kulturowymi."
 panum.2624.t: "Narkotyki"
 panum.2624.d: "Główny chemik [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] przeprowadził ostatnio, za namową doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], szereg eksperymentów z różnymi substancjami w celu opracowania skutecznych leków psychotropowych. Rezultat okazał się jednak... zaskakujący."
 panum.2624.f: "„Chciał się pan ze mną pilnie zobaczyć?”\n„Tak. Podejrzewam, że eksperyment zakończył się sukcesem”.\n„Podejrzewa pan?”\n„Nowy lek zdecydowanie działa przeciwbólowo. Skutecznie zwalcza zmęczenie. Pomaga też przezwyciężyć strach. Być może nawet trochę zbyt skutecznie”."
 panum.2624.g: "Dietyloamid kwasu lizergowego? Co to takiego?"
 panum.2624.h: "Naszym żołnierzom przydałaby się czekolada pancerna."
 panum.2625.t: "Psychofizyka"
 panum.2625.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] przedstawił kilka interesujących teorii dotyczących wzajemnych zależności między subiektywnymi doznaniami psychicznymi a bodźcami fizycznymi, które można zmierzyć ilościowo."
 panum.2625.f: "Psychofizyka zajmuje się ilościowym badaniem zależności między bodźcami fizycznymi a wywoływanymi przez nie wrażeniami i spostrzeżeniami. Określa się ją jako „naukowe badanie związku między bodźcem a wrażeniem”. Wiele klasycznych metod i teorii psychofizyki sformułował w 1860 roku Gustav Theodor Fechner. To on wprowadził termin „psychofizyka”, określając nim badania mające na celu powiązanie bodźców fizycznych z treściami świadomości, takimi jak wrażenia zmysłowe. Jako fizyk i filozof Fechner dążył do opracowania metody pozwalającej powiązać materię z umysłem, łącząc obiektywnie obserwowalny świat z subiektywnymi doznaniami jednostki. Prace Fechnera badał i rozwijał Charles S. Peirce, któremu pomagał jego uczeń Joseph Jastrow, wkrótce uznany za wybitnego psychologa eksperymentalnego."
 panum.2625.g: "Nie zrozumiałem ani słowa, ale bonusy wyglądają nieźle!"
