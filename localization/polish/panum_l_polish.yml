 panum.2500.t: "Zaawansowane wsparcie medyczne"
 panum.2500.d: "Nasz [concept_panum_physician] doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] przez lata pracował nad poprawą wsparcia medycznego podczas wojny. Nowe metody i środki mogą być teraz wykorzystywane na polu bitwy!"
 panum.2500.f: "\n„Zwracaj uwagę na dokładne użycie tej strzykawki. I zawsze miej pod ręką wystarczającą ilość surowicy. Oraz bandaży. Najlepiej apteczkę pierwszej pomocy. Czy w ogóle wiesz, co oznacza sterylizacja?”"
 panum.2500.g: "Żołnierze pewnego dnia wzniosą doktorowi pomnik."
