 panum.1100.t: "Grypa [GetGlobalVariable('panum_spanish_flu_originator_country').GetCountryDefinition.GetAdjective]"
 panum.1100.d: "Wiele szpitali, klinik i gabinetów lekarskich zgłasza niezwykle dużą liczbę przypadków tajemniczej choroby, którą początkowo brano za zwykłą grypę. Łóżka szpitalne są już przepełnione, a pomieszczenia ogólnodostępne trzeba przekształcać w dodatkowe sale dla chorych. Potwierdzają się najgorsze obawy: najwyraźniej dotarła do nas budząca postrach grypa [GetGlobalVariable('panum_spanish_flu_originator_country').GetCountryDefinition.GetAdjective], która zaatakowała już sąsiednie kraje."
 panum.1100.f: "Początkowo lekarze mówili o zwykłej epidemii grypy. W pierwszych dniach prasa donosiła o dziwnej chorobie o charakterze epidemicznym, zapewniając jednak, że jest niegroźna i nie powoduje zgonów.\n\nRzeczywistość okazała się zupełnie inna. Każdego dnia epidemia grypy dociera do kolejnych miast i regionów, wymuszając całkowitą reorganizację opieki medycznej. Tam, gdzie jeszcze wczoraj objawy choroby wykazywało zaledwie dwóch żołnierzy w koszarach, dziś chorych jest już 700. Złowrogi charakter tej choroby przejawia się w tym, że jej ofiarami padają nie tyle dzieci i osoby starsze, jak zazwyczaj bywa w przypadku grypy, lecz przede wszystkim ludzie młodzi, w wieku od 20 do 40 lat. Co dwudziesty chory nie przeżywa zakażenia. Skąd się wzięła, jak do nas dotarła i czym właściwie jest? Ta pandemia wciąż pozostaje zagadką.\n\nJedno staje się jednak coraz bardziej oczywiste: ta grypa może całkowicie odmienić życie, jakie dotąd znaliśmy. Coraz głośniej rozlegają się wezwania do podjęcia działań przez władze. Jak na to zagrożenie zareaguje [GetPlayer.GetName]?"
 panum.1100.g: "To niegroźna choroba, prawda?"
 panum.1101.t: "Hiszpanka"
 panum.1101.d: "Wiele szpitali, klinik i gabinetów lekarskich zgłasza niezwykle dużą liczbę przypadków tajemniczej choroby, którą początkowo brano za zwykłą grypę. Łóżka szpitalne są już przepełnione, a pomieszczenia ogólnodostępne trzeba przekształcać w dodatkowe sale dla chorych. Potwierdzają się najgorsze obawy: najwyraźniej mamy do czynienia z pandemią o niespotykanej dotąd skali."
 panum.1101.f: "Hiszpanka była pandemią grypy wywołaną przez wyjątkowo zjadliwą odmianę wirusa grypy, która rozprzestrzeniła się w trzech falach w latach 1918–1920, pochłaniając od 20 do 50 milionów istnień ludzkich. Niektóre szacunki wskazują nawet na 100 milionów ofiar przy ówczesnej liczbie ludności świata wynoszącej około 1,8 miliarda.\nOznacza to, że z powodu hiszpanki zmarło więcej ludzi niż w wyniku działań wojennych podczas I wojny światowej (około 17 milionów zabitych). Szacuje się, że łącznie zakażeniu uległo około 500 milionów osób, a śmiertelność wśród chorych wynosiła od 5 do 10 procent, czyli znacznie więcej niż w przypadku zachorowań wywoływanych przez inne szczepy wirusa grypy.\n\nCechą charakterystyczną hiszpanki było to, że dotykała przede wszystkim ludzi młodych, w wieku od 20 do 40 lat, podczas gdy inne wirusy grypy stanowią największe zagrożenie dla małych dzieci i osób starszych. Grypę zaczęto nazywać „hiszpańską”, gdy 29 czerwca 1918 roku hiszpański dyrektor służby zdrowia Martín Salazar ogłosił, że nie otrzymał doniesień o występowaniu porównywalnej choroby w pozostałych częściach Europy. Od końca czerwca 1918 roku prasa międzynarodowa coraz częściej posługiwała się określeniem „hiszpanka”, do czego przyczyniały się również niektóre rządy państw uczestniczących w wojnie, chcąc ukryć rzeczywistą skalę rozprzestrzeniania się epidemii. Hiszpanka jest uznawana za „matkę wszystkich pandemii”."
 panum.1101.g: "Czyli już mówi się o hiszpance?"
 panum.1102.t: "Wielka pandemia"
 panum.1102.d: "Wiele szpitali, klinik i gabinetów lekarskich zgłasza niezwykle dużą liczbę przypadków tajemniczej choroby, którą początkowo brano za zwykłą grypę. Łóżka szpitalne są już przepełnione, a pomieszczenia ogólnodostępne trzeba przekształcać w dodatkowe sale dla chorych. Potwierdzają się najgorsze obawy: najwyraźniej mamy do czynienia z pandemią o niespotykanej dotąd skali."
 panum.1102.f: "Początkowo lekarze mówili o zwykłej epidemii grypy. W pierwszych dniach prasa donosiła o dziwnej chorobie o charakterze epidemicznym, zapewniając jednak, że jest niegroźna i nie powoduje zgonów.\n\nRzeczywistość okazała się zupełnie inna. Każdego dnia epidemia grypy dociera do kolejnych miast i regionów, wymuszając całkowitą reorganizację opieki medycznej. Tam, gdzie jeszcze wczoraj objawy choroby wykazywało zaledwie dwóch żołnierzy w koszarach, dziś chorych jest już 700. Złowrogi charakter tej choroby przejawia się w tym, że jej ofiarami padają nie tyle dzieci i osoby starsze, jak zazwyczaj bywa w przypadku grypy, lecz przede wszystkim ludzie młodzi, w wieku od 20 do 40 lat. Co dwudziesty chory nie przeżywa zakażenia. Skąd się wzięła, jak do nas dotarła i czym właściwie jest? Ta pandemia wciąż pozostaje zagadką.\n\nJedno staje się jednak coraz bardziej oczywiste: ta grypa może całkowicie odmienić życie, jakie dotąd znaliśmy. Coraz głośniej rozlegają się wezwania do podjęcia działań przez władze. Jak na to zagrożenie zareaguje [GetPlayer.GetName]?"
 panum.1102.g: "Czyli już mówi się o grypie [GetGlobalVariable('panum_spanish_flu_originator_country').GetCountryDefinition.GetAdjective]?"
 panum.1103.t: "Polityka pandemiczna"
 panum.1103.a.tt: "Rygorystyczne środki zduszą gospodarkę, ale zwiększą szanse na szybsze opanowanie pandemii i powstrzymanie jej przynajmniej w niektórych stanach."
 panum.1103.b.tt: "Zastosowane środki zaczną przynosić efekty znacznie później, ale gospodarka poniesie mniejsze straty."
 panum.1103.c.tt: "Pandemia będzie przebiegać swoim naturalnym torem, a wszystkie dotychczasowe środki zostaną całkowicie zniesione."
 panum.1104.t: "Grypa [GetGlobalVariable('panum_spanish_flu_originator_country').GetCountryDefinition.GetAdjective] ustępuje w [SCOPE.sState('panum_flu_fading_state').GetName]"
 panum.1104.d: "Wygląda na to, że ograniczenia w [SCOPE.sState('panum_flu_fading_state').GetName] zaczynają przynosić pierwsze efekty. Po wielu tygodniach widać tam wreszcie spadek liczby zgonów."
 panum.1104.f: "W określonych warunkach pandemia może ustąpić w danym stanie po kilku tygodniach. Rygorystyczne środki, sprawnie działający system opieki zdrowotnej, wybitny lekarz lub wysoko rozwinięte Techniki Medyczne pomagają przyspieszyć ten proces."
 panum.1104.g: "Promyk nadziei."
 panum.1105.t: "Grypa [GetGlobalVariable('panum_spanish_flu_originator_country').GetCountryDefinition.GetAdjective] znika z [SCOPE.sState('panum_flu_disappearing_state').GetName]"
 panum.1105.d: "Po tym, jak w ostatnich tygodniach pandemia w [SCOPE.sState('panum_flu_disappearing_state').GetName] wyraźnie osłabła, od kilku dni nie odnotowano tam żadnych nowych przypadków zachorowań. Region jest już całkowicie wolny od grypy!"
 panum.1105.f: "Aby pandemia całkowicie zniknęła z danego stanu, musi najpierw wyraźnie osłabnąć. Dzięki temu niektóre regiony mogą uwolnić się od grypy jeszcze przed zakończeniem samej pandemii. Rygorystyczne środki, sprawnie działający system opieki zdrowotnej, wybitny lekarz lub wysoko rozwinięte Techniki Medyczne pomagają zwalczyć grypę."
 panum.1105.g: "Czy zastosowane środki się do tego przyczyniły?"
 panum.1106.t: "Ofiara grypy [GetGlobalVariable('panum_spanish_flu_originator_country').GetCountryDefinition.GetAdjective]"
 panum.1106.d: "[SCOPE.sCharacter('panum_pandemic_victim').GetFullName] kilka dni temu zaraził się grypą [GetGlobalVariable('panum_spanish_flu_originator_country').GetCountryDefinition.GetAdjective], a choroba ma ciężki przebieg. Lekarze obawiają się najgorszego."
 panum.1106.f: "„Około dwunastej zaczęło mi się robić gorąco. Miałem tak wysoką gorączkę, że bałem się, iż moje ubranie zaraz stanie w płomieniach. Dręczył mnie kaszel, który niemal rozrywał mi wnętrzności, ilekroć nie udawało mi się go powstrzymać. Było ciemno. Byłem pewien, że mam zapalenie płuc. Nigdy w życiu nie czułem się tak opuszczony i wyczerpany. … Potem oblały mnie strugi potu i choć powinienem był poczuć ulgę, cierpiałem jeszcze bardziej niż wcześniej. Kiedy wreszcie nastał świt, byłem obrazem nędzy i rozpaczy. Nie mogłem zaczerpnąć oddechu bez ataku rozdzierającego kaszlu i nie miałem już żadnej nadziei”.— Franklin Martin, osoba, która przeżyła grypę [GetGlobalVariable('panum_spanish_flu_originator_country').GetCountryDefinition.GetAdjective]"
 panum.1106.g: "Nic nie możemy zrobić."
 panum.1107.t: "Doniesienia o grypie wzmagają nastroje antywojenne"
 panum.1107.d: "Doniesienia o licznych zgonach spowodowanych grypą [GetGlobalVariable('panum_spanish_flu_originator_country').GetCountryDefinition.GetAdjective] w [SCOPE.sState('panum_disease_state').GetName] osłabiają poparcie społeczne dla naszych działań wojennych."
 panum.1107.f: "„To szaleństwo, że wysyłamy ludzi na wojnę, podczas gdy ta zaraza pustoszy nasze domy. Czy państwo nie powinno przedkładać życia swoich obywateli nad posyłanie ich na śmierć?”"
 panum.1107.g: "Nie będziemy ingerować w wolność prasy."
 panum.1107.h: "Rozpowszechniaj uspokajającą propagandę popartą wiedzą medyczną."
 panum.1107.i: "Cenzuruj doniesienia o śmiertelności i zakażeniach."
 panum.1108.t: "Środki przeciwpandemiczne przyczyniają się do wzrostu ubóstwa"
 panum.1108.d: "Ponieważ wielu mieszkańców nie może pracować z powodu wprowadzonych przez nas środków przeciwpandemicznych, ubożsi obywatele w [SCOPE.sState('panum_disease_state').GetName] mają trudności z opłaceniem czynszu. Robotnikom, którzy niedawno stracili pracę, grozi eksmisja, gdyż właściciele nieruchomości odrzucają ich prośby o odroczenie płatności."
 panum.1108.f: "„Powiedzieli mi, że nie mogę pracować, bo w fabryce jest zbyt wielu ludzi. Przecież w każdej fabryce jest tłok! Kamienicznik, niechaj płonie w ogniu piekielnym, ani trochę nie przejmuje się naszym losem i żąda zapłaty czynszu przed końcem tygodnia, grożąc eksmisją. Moja rodzina z pewnością zostanie wyrzucona na bruk.”"
 panum.1108.g: "Wprowadź zamrożenie czynszów i zakaz eksmisji."
 panum.1108.h: "Tymczasowo zwiększ świadczenia socjalne."
 panum.1108.i: "Nic nie możemy na to poradzić."
 panum.1109.t: "Liga przeciwników maseczek"
 panum.1109.d: "[SCOPE.sCharacter('anti_mask_ig_leader').GetFullName] założył Ligę przeciwników maseczek, sprzeciwiającą się wprowadzonym przez nas środkom przeciwpandemicznym. Jej członkowie podważają skuteczność naszej polityki i domagają się zniesienia ograniczeń w trosce o borykającą się z trudnościami gospodarkę."
 panum.1109.f: "„Noś maseczkę i ratuj życie! Zagrożenie, przed którym stoi obecnie nasz kraj, przekracza możliwości służby zdrowia.\nCi, którzy nie noszą maseczek, chorują. Każdy mężczyzna, każda kobieta i każde dziecko, którzy odmawiają teraz noszenia maseczki, wykazują się niebezpieczną nieodpowiedzialnością!”"
 panum.1109.g: "Zignoruj Ligę."
 panum.1109.h: "Zrezygnuj ze środków przeciwpandemicznych."
 panum.1109.i: "Podważ wiarygodność Ligi, powołując się na wiedzę medyczną."
 panum.1120.t: "Grypa [GetGlobalVariable('panum_spanish_flu_originator_country').GetCountryDefinition.GetAdjective] dobiega końca"
 panum.1120.d: "Wielu straciło już nadzieję, że ten dzień kiedykolwiek nadejdzie. Po wielu miesiącach, w których [GetPlayer.GetName] zmagał się z bezprecedensowym kryzysem, grypa [GetGlobalVariable('panum_spanish_flu_originator_country').GetCountryDefinition.GetAdjective] powoli ustępuje w naszym kraju. Doprawdy, była to matka wszystkich pandemii!"
 panum.1120.f: "„Dziś zniesiono zakaz. Koniec z tymi przeklętymi... maseczkami. Wszystko też jest już otwarte. W Coliseum (kinie) znów grają »Romans Tarzana«, tak jak jakieś sześć tygodni temu. Strasznie chciałabym to zobaczyć. Szkoła zaczyna się w tym tygodniu — w czwartek! Wyobrażasz sobie? Jakby nie mogli poczekać do poniedziałku!”— Violet Harris, osoba, która przeżyła grypę [GetGlobalVariable('panum_spanish_flu_originator_country').GetCountryDefinition.GetAdjective]"
 panum.1120.g: "Miejmy nadzieję, że nigdy nie powróci."
 je_panum_spanish_flu: "Grypa [GetGlobalVariable('panum_spanish_flu_originator_country').GetCountryDefinition.GetAdjective]"
 je_panum_spanish_flu_reason: "Grypa [GetGlobalVariable('panum_spanish_flu_originator_country').GetCountryDefinition.GetAdjective] była pandemią wywołaną przez wyjątkowo zjadliwą odmianę wirusa grypy, która pojawiła się na początku XX wieku i pochłonęła od 20 do 50 milionów istnień ludzkich. Niektóre szacunki wskazują nawet na 100 milionów ofiar przy ówczesnej liczbie ludności świata wynoszącej około 1,8 miliarda. Szacuje się, że łącznie zakażeniu uległo około 500 milionów osób, a śmiertelność wśród chorych wynosiła od 5 do 10 procent, czyli znacznie więcej niż w przypadku zachorowań wywoływanych przez inne szczepy wirusa grypy.\n\nCechą charakterystyczną grypy [GetGlobalVariable('panum_spanish_flu_originator_country').GetCountryDefinition.GetAdjective] było to, że dotykała przede wszystkim ludzi młodych, w wieku od 20 do 40 lat, podczas gdy inne wirusy grypy stanowią największe zagrożenie dla małych dzieci i osób starszych. Uznaje się ją za „matkę wszystkich pandemii”. Grypę zaczęto nazywać „[GetGlobalVariable('panum_spanish_flu_originator_country').GetCountryDefinition.GetAdjective]”, gdy dyrektor służby zdrowia [GetGlobalVariable('panum_spanish_flu_originator_country').GetCountryDefinition.GetAdjective] ogłosił, że nie otrzymał doniesień o występowaniu porównywalnej choroby w pozostałych częściach świata. Od tego czasu prasa międzynarodowa coraz częściej posługiwała się określeniem „grypa [GetGlobalVariable('panum_spanish_flu_originator_country').GetCountryDefinition.GetAdjective]”, do czego przyczyniały się również niektóre rządy, chcąc ukryć rzeczywistą skalę rozprzestrzeniania się epidemii."
 panum_remove_spanish_flu_effect_tt: "Znosi wszystkie środki przeciwpandemiczne i ich skutki."
 panum_recent_pandemic_policy_change_modifier: "Niedawna zmiana polityki przeciwpandemicznej"
 panum_spanish_flu_lockdown_modifier: "Lockdown pandemiczny"
 panum_spanish_flu_measures_modifier: "Środki przeciwpandemiczne"
 panum_spanish_flu_fading_modifier: "Wygasanie pandemii"
 panum.2600.t: "Nowy szpital psychiatryczny"
 panum.2600.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] wygłosił dziś przemówienie z okazji uroczystego otwarcia nowego szpitala psychiatrycznego."
 panum.2600.f: "W uroczystym otwarciu uczestniczyło również wiele prominentnych osobistości, w tym politycy opozycji. Podczas gdy doktor przedstawiał nowe metody leczenia oraz szereg wyraźnych objawów stanowiących podstawę do przyjęcia pacjentów do placówki, sceptyczni przedstawiciele opozycji obawiali się, że taka instytucja może również stać się narzędziem nadużyć."
 panum.2600.g: "Wreszcie odpowiednie miejsce dla polityków, dziennikarzy, aktorów..."
 panum.2601.t: "Pilne przyjęcie do szpitala psychiatrycznego"
 panum.2601.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] sporządził raport, z którego wynika, że [SCOPE.sCharacter('chosen_character').GetFullName] pilnie potrzebuje opieki psychiatrycznej. Niestety, [SCOPE.sCharacter('chosen_character').GetLastName] spędzi wiele lat w szpitalu psychiatrycznym. Być może... bardzo wiele lat."
 panum.2601.f: "„Bo gdy pewnego dnia ofiarę trzeba będzie znaleźć,\nMam już małą listę — mam już małą listę!\nTych, co społeczeństwu wadzą i mogliby pod ziemią spocząć,\nA nikt by za nimi nie tęsknił — nikt by za nimi nie tęsknił!\nSą na niej nieznośni natręci, co proszą o autografy,\nWszyscy o wiotkich dłoniach i irytującym śmiechu,\nWszystkie dzieci, co datami sypią i wprawiają człowieka w osłupienie,\nWszyscy, którzy przy powitaniu tak właśnie ściskają ci rękę,\nI wszyscy ci, co za wszelką cenę psują rozmowy w cztery oczy.\nNikt by za nimi nie tęsknił — nikt by za nimi nie tęsknił!”"
 panum.2601.g: "[ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] ma ich na liście — i za żadnym nikt nie zatęskni!"
 panum.2601.tt: "[SCOPE.sCharacter('chosen_character').GetFullName] znika na zawsze w korytarzach szpitala psychiatrycznego..."
 panum_physician_recent_asylum_conducted_modifier: "Niedawne przyjęcie do szpitala psychiatrycznego"
 panum_send_leader_to_asylum_modifier: "Polityczne nadużywanie psychiatrii"
 panum_checkmark_loc: "@green_checkmark!"
 panum_cross_loc: "@red_cross!"
 panum.21.t: "Rozproszenie chorych"
 panum.21.d: "Doktorowi Hasnebeinowi przypisuje się opracowanie nowoczesnego systemu segregacji chorych i rannych według stopnia ciężkości ich obrażeń, zwiększając tym samym szanse pacjentów na przeżycie."
 panum.21.f: "Na podstawie doświadczeń zdobytych podczas wojny kaukaskiej i wojny krymskiej rosyjski chirurg Nikołaj Iwanowicz Pirogow opracował system stopniowanego leczenia chirurgicznego oraz zasadę „rozproszenia chorych” (rozmieszczania rannych i chorych w różnych miejscach leczenia), aby uporządkować przepełnione punkty opatrunkowe i podzielić rannych na pięć kategorii (zasada segregacji Pirogowa). Armia pruska przyjęła tę rosyjską zasadę w 1866 roku, a później zastosowano ją również w wojskowych służbach medycznych innych sprzymierzonych armii europejskich. W miarę dalszego rozwoju liczne osiągnięcia medycyny i technik chirurgicznych znajdowały również zastosowanie w organizacji wojskowej służby medycznej. Jednak zasada Pirogowa pozostała niezmieniona podczas I wojny światowej."
 panum.21.g: "A więc istnieje hierarchia wśród chorych?"
 panum.22.t: "Lek na malarię"
 panum.22.d: "Dzięki skutecznemu pozyskiwaniu chininy z kory drzewa chinowego doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] opracował metodę leczenia malarii."
 panum.22.f: "Jezuici już we wczesnej epoce nowożytnej mieli faktyczny monopol na stosowanie kory chinowca w leczeniu malarii, choć początkowo w niektórych krajach protestanckich budziło to zastrzeżenia. Na początku XIX wieku, wkrótce po odkryciu morfiny, zidentyfikowano chininę jako substancję odpowiedzialną za lecznicze właściwości kory chinowca, co uczyniło ją jednym z fundamentów rozwijającej się chemii roślinnej. W 1792 roku Antoine François de Fourcroy otrzymał chininę w postaci nieoczyszczonej, a w 1820 roku Pierre Joseph Pelletier i Joseph Bienaimé Caventou wyizolowali ją z kory chinowca metodą ekstrakcji alkoholem. W 1823 roku aptekarz Friedrich Koch z Oppenheim jako pierwszy rozpoczął pozyskiwanie chininy z kory drzew z rodzaju Cinchona na skalę przemysłową. Chinina przyczyniła się następnie do rozwoju badań nad chemią roślinną."
 panum.22.g: "Cenny lek."
 panum.23.t: "Po prostu inna kategoria pacjentów"
 panum.23.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] wysłał dziś pilny list do rządu. W liście tym [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] krytykuje sposób traktowania osób chorych psychicznie i opowiada się za uznaniem ich za pacjentów zasługujących na lepszą opiekę medyczną, a nie za osoby aspołeczne, które należy wykluczyć ze społeczeństwa."
 panum.23.f: "Pierwszy zdecydowany krok w kierunku leczenia psychiatrycznego pacjentów nastąpił w XVIII wieku, kiedy zaprzestano przetrzymywania osób chorych psychicznie i zwykłych skazańców w tych samych pomieszczeniach, a zaczęto tworzyć dla nich oddzielne zakłady. Warunki panujące w tych placówkach nadal jednak znacznie odbiegały od jakichkolwiek humanitarnych standardów. Kolejnym krokiem było zniesienie ciężkich żelaznych łańcuchów, którymi krępowano osoby chore psychicznie, i zapewnienie im większej swobody poruszania się. Od początku XIX wieku coraz powszechniej uznawano, że osoby te również są chore i mają prawo do leczenia. W Anglii ważnym przełomem była ustawa o osobach chorych psychicznie z 1845 roku (Lunacy Act 1845), która wyraźnie zmieniła ich status, uznając je za pacjentów."
 panum.23.g: "Życie psychiczne tych ludzi również ma znaczenie."
 panum.24.t: "Wiedza medyczna i pielęgniarska"
 panum.24.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] przypomniał nam, że personel o niższych kwalifikacjach może czasami okazać się niezwykle pomocny w opiece nad licznymi ofiarami na polu bitwy, i opowiada się za szerszym zatrudnianiem kobiet w charakterze pielęgniarek."
 panum.24.f: "Podczas gdy w innych krajach europejskich, zwłaszcza we Francji i Niemczech, zakony katolickie stawiały sobie za cel kształcenie pielęgniarek, w Wielkiej Brytanii i innych krajach protestanckich podejmowano niewiele takich działań. Bardzo niewiele klasztorów i zakonów przetrwało angielską reformację. Brytyjska opinia publiczna boleśnie uświadomiła sobie ten fakt dzięki publikacjom Florence Nightingale. Kształcenie personelu pielęgniarskiego zaczęto wówczas postrzegać jako zadanie o znaczeniu narodowym, na które zbierano darowizny. Założona przez Nightingale szkoła pielęgniarstwa przy szpitalu św. Tomasza w Londynie stała się kolebką profesjonalizacji tego zawodu. Przypisuje się jej słowa: „Lekarze zajmują się chorobami, pielęgniarki zajmują się ludźmi”, które miały położyć podwaliny pod filozofię pielęgniarstwa."
 panum.24.g: "Kobiety na front."
 je_panum_spanish_flu_research: "Grypa [GetGlobalVariable('panum_spanish_flu_originator_country').GetCountryDefinition.GetAdjective]: Badania"
 je_panum_spanish_flu_research_reason: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] postanowił dokładniej zbadać tajemniczą pandemię. Trudno przewidzieć, jakie sukcesy uda się [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] osiągnąć. Jednak doświadczony lekarz powinien mieć większe szanse na uzyskanie wyników."
 je_panum_spanish_flu_research_complete_tt: "[concept_panum_physician] może zdobyć nową wiedzę na temat pandemii, na przykład ustalić miejsce jej pochodzenia, opisać chorobę, a nawet zidentyfikować wywołujący ją patogen."
 state_harvest_condition_panum_spanish_flu_condition_impact_mult: "Wpływ [GetHarvestConditionType('panum_spanish_flu_condition').GetName] [concept_panum_disease]"
 state_harvest_condition_panum_spanish_flu_condition_impact_mult_desc: "Zwiększenie lub zmniejszenie wpływu pandemii."
 panum_spanish_flu_physician_help_modifier: "Lekarz walczy z pandemią"
 panum.1110.t: "Lekarz i pandemia"
 panum.1110.d: "Wybuch pandemii to chwila próby dla doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName]: teraz [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] może się wykazać! Pojawia się jednak pytanie: czy lepiej aktywnie zwalczać pandemię, czy skupić się na jej badaniu?"
 panum.1110.f: "„W dniu, w którym stało się jasne, że nie mamy do czynienia ze zwykłą falą grypy, poczułem ogromną motywację, by wnieść swój wkład w walkę z chorobą. Jednocześnie poczułem przytłaczający ciężar spoczywający na moich barkach. Oczekiwania były ogromne. Czy kiedykolwiek zdołam spełnić pokładane we mnie nadzieje?”\n\nWpis z dziennika [ROOT.Var('panum_physician_var').GetCharacter.GetFullName]"
 panum.1110.g: "Zwalczać pandemię."
 panum.1110.h: "Badać pandemię."
 panum.1111.t: "Patogen wywołujący pandemię"
 panum.1111.d: "Nasz naczelny lekarz, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], oraz nasz główny biolog, doktor [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName], dokonali dziś przełomowego odkrycia: zidentyfikowali patogen wywołujący grypę [GetGlobalVariable('panum_spanish_flu_originator_country').GetCountryDefinition.GetAdjective]!"
 panum.1111.f: "Wirus grypy A podtypu H1N1 (A/H1N1) należy do wirusów grypy typu A (gatunek Alphainfluenzavirus influenzae) z rodziny Orthomyxoviridae. Występuje u kaczek, ludzi i świń, ale zakaża również wiele innych gatunków ssaków. Wirusy grypy H1N1 zadomowiły się w populacjach ludzi i świń w następstwie pandemii grypy hiszpanki z 1918 roku. Ten podtyp wirusa spowodował śmierć dziesiątek milionów ludzi.\n\nW czasie pandemii grypy hiszpanki czynnik chorobotwórczy pozostawał nieznany. Niektórzy badacze podejrzewali już wówczas istnienie „wirusa przesączalnego”. W podręcznikach za przyczynę grypy uznawano bakterię znaną obecnie jako Haemophilus influenzae. Jednak przy użyciu standardowych metod bakteriologicznych nie udawało się wykryć czynnika chorobotwórczego: nie można go było ani zabarwić, ani wyhodować na sztucznych pożywkach. Jeśli pandemia grypy hiszpanki przyczyniła się do postępu wiedzy medycznej, to przede wszystkim poprzez wykazanie, że rzeczywisty czynnik wywołujący tę odmianę grypy pozostawał wówczas nieznany, co pozwoliło wykluczyć Haemophilus influenzae jako jej przyczynę. Dopiero w 1996 roku zsekwencjonowano genom wirusa."
 panum.1111.g: "Eureka!"
 panum.1112.t: "Pochodzenie pandemii"
 panum.1112.d_historical: "Po przeprowadzeniu niezwykłych badań naukowych, łączących wiedzę historyczną, kryminalistyczną i medyczną, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] dokonał przełomowego odkrycia: pandemia nie wybuchła w Hiszpanii, jak często się twierdzi, lecz w Ameryce!"
 panum.1112.f_historical: "Odkrycie doktora poprzedziło drobiazgowe śledztwo. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] porównał dokumentację medyczną pacjentów i prześledził pierwsze przypadki zachorowań w naszym kraju, aby odtworzyć sieć zakażeń. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] gromadził również dane od swoich zagranicznych kolegów, a niekiedy osobiście ich odwiedzał. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] przeanalizował także ustalenia innych lekarzy, którzy podjęli podobne działania w swoich krajach. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] nie potrafi z całą pewnością stwierdzić, gdzie doszło do pierwszego zakażenia, ale wszystko wskazuje na stan Kansas. To, że choroba rzeczywiście wybuchła w Ameryce, jest już naukowo potwierdzonym faktem."
 panum.1112.g_historical: "Czy to oznacza, że powinniśmy mówić o grypie amerykańskiej?"
 panum.1112.d_dynamic: "Po przeprowadzeniu niezwykłych badań naukowych, łączących wiedzę historyczną, kryminalistyczną i medyczną, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] dokonał przełomowego odkrycia: pandemia nie wybuchła w [GetGlobalVariable('panum_spanish_flu_originator_country').GetCountryDefinition.GetName], jak często się twierdzi, lecz w [SCOPE.sCountry('panum_pandemic_country').GetName]!"
 panum.1112.f_dynamic: "Odkrycie doktora poprzedziło drobiazgowe śledztwo. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] porównał dokumentację medyczną pacjentów i prześledził pierwsze przypadki zachorowań w naszym kraju, aby odtworzyć sieć zakażeń. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] gromadził również dane od swoich zagranicznych kolegów, a niekiedy osobiście ich odwiedzał. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] przeanalizował także ustalenia innych lekarzy, którzy podjęli podobne działania w swoich krajach. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] nie potrafi z całą pewnością stwierdzić, gdzie doszło do pierwszego zakażenia. To, że choroba rzeczywiście wybuchła w [SCOPE.sCountry('panum_pandemic_country').GetNameNoFormatting], jest już naukowo potwierdzonym faktem."
 panum.1112.g_dynamic: "Czy to oznacza, że powinniśmy mówić o grypie [SCOPE.sCountry('panum_pandemic_country').GetAdjectiveNoFormatting]?"
 panum.1113.t: "Leczenie podczas pandemii"
 panum.1113.d: "Podczas [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] badań nad grypą [GetGlobalVariable('panum_spanish_flu_originator_country').GetCountryDefinition.GetAdjective] doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] opracował szereg środków leczniczych i metod postępowania oraz plan działania mający na celu powstrzymanie rozprzestrzeniania się choroby. Choć wszystkie te odkrycia pojawiły się zbyt późno, mogą okazać się pomocne dla przyszłych pokoleń."
 panum.1113.f: "„Mell czuje się dziś znacznie lepiej i jest już ubrany. Jestem niemal wyczerpana zmartwieniami i brakiem snu. Tyle chorób i śmierci w tym tygodniu, ale pojawił się jeden wielki promyk światła i nadziei związany z zakończeniem wojny, gdy nastał pokój jedenastego dnia tego miesiąca”. – Helen Viola Jackson Kent, osoba, która przeżyła grypę [GetGlobalVariable('panum_spanish_flu_originator_country').GetCountryDefinition.GetAdjective]"
 panum.1113.g: "Cóż, przynajmniej czegoś się nauczyliśmy."
 panum.1114.t: "Opis pandemii"
 panum.1114.d: "Niestety doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] poczynił niewielkie postępy podczas pandemii. Jednak [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] sporządził opis choroby, który może okazać się pomocny w rozpoznawaniu objawów różnych odmian grypy [GetGlobalVariable('panum_spanish_flu_originator_country').GetCountryDefinition.GetAdjective]."
 panum.1114.f: "„U tych mężczyzn choroba zaczyna się od objawów przypominających grypę, lecz po przyjęciu do szpitala bardzo szybko rozwija się u nich najcięższa postać zapalenia płuc, jaką kiedykolwiek widziano. Już dwie godziny po przyjęciu na ich kościach policzkowych pojawiają się mahoniowe plamy, a kilka godzin później można zaobserwować sinicę, która rozprzestrzenia się od uszu na całą twarz, aż trudno odróżnić czarnoskórych mężczyzn od białych. Od tej chwili do śmierci pozostaje zaledwie kilka godzin, podczas których rozpaczliwie walczą o każdy oddech, aż w końcu się duszą. To przerażające. Można znieść widok śmierci jednego, dwóch czy nawet dwudziestu ludzi, ale patrzenie, jak ci biedacy padają niczym muchy, naprawdę wystawia nerwy na próbę”. – N. Roy Grist, osoba, która przeżyła grypę [GetGlobalVariable('panum_spanish_flu_originator_country').GetCountryDefinition.GetAdjective]"
 panum.1114.g: "Spodziewaliśmy się nieco więcej."
 panum.1115.t: "Tajemnica pandemii"
 panum.1115.d: "Niestety doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] nie sprostał wyzwaniom pandemii. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] nie zdołał znaleźć odpowiedzi na pytania dotyczące pochodzenia choroby, sposobów jej zwalczania ani jej charakterystyki. Doktor napisał jednak krótki wiersz."
 panum.1115.f: "„Miałem ptaszka małego,\nEnza zwał się, kolego.\nOtworzyłem okno raz,\na grypa dopadła nas”."
 panum.1115.g: "Rozczarowujące."
