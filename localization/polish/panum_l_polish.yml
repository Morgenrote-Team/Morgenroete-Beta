 panum_character_treatment_fatal_fallback_loc: "„Kto by pomyślał, że przecięcie tego naczynia krwionośnego zabije pacjenta?”"
 panum_character_treatment_fatal_tripple_death_loc: "Dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zaplanował szybką operację, aby wyleczyć [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] pacjenta. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] zdołał przeprowadzić zabieg w niewiele ponad 2 minuty, lecz obciął przy tym palce asystentowi – który zmarł później w wyniku zakażenia. Niestety pacjent również zmarł wkrótce z powodu infekcji. Dodatkowo jeden z obserwatorów, któremu przypadkowo rozcięto poły fraka, zemdlał, przekonany, że naruszono jego narządy wewnętrzne – później okazało się, że zmarł z szoku."
 panum_character_treatment_fatal_unwashed_hands_loc: "Operacja przebiegła idealnie. Pacjent żył, wszystkie problemy zostały rozwiązane i wszyscy myśleli, że powrót do zdrowia nastąpi błyskawicznie. Jednak kilka dni później wykryto infekcję, która rozprzestrzeniała się niczym pożar. Zaledwie kilka godzin później pacjent zmarł. Dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] był niezwykle zdezorientowany, jak mogło do tego dojść, skoro [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] zmienił nóż po poprzedniej operacji zaledwie kilka minut wcześniej."
 panum_character_treatment_fatal_forgotten_snack_loc: "Po śmierci pacjenta przeprowadzono sekcję zwłok. Wewnątrz jego ciała, ku zaskoczeniu wszystkich, odnaleziono po części zjedzoną kanapkę. Nikt nie wiedział, jak się tam znalazła, dopóki jeden z asystentów nie przypomniał sobie, że dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] jadł kanapkę podczas operacji."
 panum_character_treatment_fatal_blood_loss_loc: "Początkowo operacja przebiegała pomyślnie. Wydawało się, że dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zdołał skutecznie wyleczyć pacjenta. Pacjent jednak nigdy nie wrócił do zdrowia. Wygląda na to, że utrata krwi była zbyt duża, co niezwykle go osłabiło i doprowadziło do śmierci po kolejnych trzech dniach."
 panum_character_treatment_fatal_morphine_overdose_loc: "Zabieg wydawał się przebiegać pomyślnie – dzięki zastosowaniu morfiny pacjent nie odczuwał żadnego bólu w trakcie procedury. Niestety pacjent nie poczuł już nigdy więcej jakiegokolwiek bólu, ponieważ dawka morfiny okazała się zbyt duża, co doprowadziło do jego śmierci."
 panum_character_treatment_fatal_drunken_doctor_loc: "Wszyscy byli nieco zdezorientowani, gdy dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zaczął pić alkohol medyczny podczas zabiegu. Sytuacji nie poprawił fakt, że [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] zaczął naciinać ciało w złych miejscach, krzyczeć na asystentów i wreszcie uszkodził główną tętnicę. Niestety pacjenta nie udało się uratować, nawet gdy na pomoc wezwano innego lekarza."
 panum_character_treatment_fatal_forgotten_instruments_loc: "Po udanym zabiegu stan pacjenta Dr. [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zaczął się poprawiać. Jednak zaledwie dzień później pacjent zmarł. Sekcja zwłok ujawniła skalpel, który w jakiś sposób zapomniano wyciągnąć z wnętrza ciała. Gdy pacjent zaczął się poruszać, skalpel zaczął przecinać tkanki i naczynia krwionośne, co doprowadziło do krwotoku wewnętrznego."
 panum_character_treatment_fatal_deadly_anaesthesia_loc: "Niezwykle udana operacja skończyła się niestety tragicznie. Pacjent nigdy nie wybudził się z narkozy. Nikt nie wie, co mogło być tego przyczyną, lecz Dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] przypuszcza, że organizm pacjenta był już zbyt wycieńczony."
 panum_character_treatment_fatal_fake_doctor_loc: "Początkowo zabieg wydawał się przebiegać całkiem pomyślnie. Gdy tylko lekarz opuścił salę, sytuacja szybko uległa pogorszeniu. Nagle do pomieszczenia wtargnął Dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] i powiedział, że [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] bardzo przeprasza za spóźnienie. Wszyscy byli zdezorientowani, gdyż lekarz przed chwilą przeprowadził operację. Okazało się, że przypadkowa osoba podszyła się pod chirurga i wykonała zabieg. Niestety pacjent ostatecznie zmarł, a nikt nie wie, kto jest odpowiedzialny za tę śmierć."
 panum_character_treatment_fatal_slippery_floor_loc: "To była udana operacja, dopóki stopa Dr. [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] nie trafiła na kałużę krwi na podłodze. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] poślizgnął się i upadł prosto na pacjenta. Niestety skalpel przebił serce pacjenta, co spowodowało jego śmierć."
 panum.242.t: "Śmierć wśród widowni"
 panum.242.d: "Dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zwraca szczególną uwagę na fakt, że gruźlica występuje stale na obszarach gęsto zaludnionych, podczas gdy rzadko pojawia się w rejonach ze słabym zaludnieniem."
 panum.242.f: "„Przyjrzałem się bliżej niektórym rozprawom naukowym, które zalecają kuracje klimatyczne w leczeniu gruźlicy. Jeden z artykułów wydał mi się tak nieprzekonujący, że moim zdaniem kolega pomylił korelację z przyczynowością. Zakłada on, że mieszkańcy gór są zdrowsi, ponieważ tutejsze powietrze służy zdrowiu, a co za tym idzie – nie zapadają na gruźlicę. Czyż nie jest jednak oczywiste, że w górach rzadziej obserwujemy gruźlicę po prostu dlatego, że żyje tam mniej ludzi? Przemawia to za interpretacją z południa Europy, że mamy do czynienia nie tyle z miazmatem, ile z czynnikiem zakaźnym. Gruźlica może być jednak chorobą zakaźną.”\n\nZ dziennika Dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastNameNoFormatting], [TimeKeeper.GetCurrentDate.Format('y')], [SCOPE.sState('panum_disease_state').GetCityHubName]"
 panum.242.g: "Jest to teoria podważająca dotychczasowe przekonania i popierająca tezę, że gruźlica jest chorobą zakaźną."
 panum.242.h: "Jest to teoria podważająca słuszność teorii miazmatycznej."
 panum.243.t: "Pustelnik z gruźlicą"
 panum.243.d: "Dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] dokonał interesującego odkrycia podczas rozmowy z osobą, która przeżyła gruźlicę."
 panum.243.f: "„Mówi pan, że pana brat zmarł na gruźlicę?”\n„Zgadza się. Miałem wtedy dziewiętnaście lat. Zmarł na moich oczach.”\n„A pan również zachorował później na gruźlicę?”\n„Właśnie tak. Byłem przekonany, że tak jak on wkrótce umrę. Byłem tego pewien. Zaszyłem się więc w głuszy, by tam dokonać żywota. Chciałem spędzić ostatnie dni na łonie natury, z dala od cywilizacji.”\n„Jednak pan przeżył. Jak pan myśli, co było tego przyczyną?”\n„Zdrowe odżywianie i ruch. W pewnym momencie nabrałem wystarczająco dużo sił, by pokonać chorobę.”\n„Hm.”"
 panum.243.g: "Czy to naprawdę wszystko?"
 panum.244.t: "Brak obciążeń dziedzicznych"
 panum.244.d: "Po długotrwałych badaniach Dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] dochodzi do wniosku, że niewiele wskazuje na to, by gruźlica była w rzeczywistości chorobą dziedziczną."
 panum.244.f: "„Gdyby podczas studiów ktoś mi powiedział, że pewnego dnia zajmę się pracą genealogiczną, byłbym niemało zaskoczony. Nie było jednak innego sposobu na potwierdzenie mojej teorii niż wywiady z samymi dotkniętymi rodzinami, a także z władzami i duchowieństwem. Jeśli gruźlica rzeczywiście jest chorobą dziedziczną, to taką, która potrafi pozostawać w ukryciu przez pokolenia. Istnieją całe drzewa rodowe bez ani jednego przypadku gruźlicy, by nagle choroba ta spustoszyła całą rodzinę. Co więcej, zwraca uwagę fakt, że gruźlica nie jest schorzeniem statycznym i przewidywalnym, lecz dopiero w ostatnich dekadach urosła do rangi zagrożenia, jakim jest dzisiaj. Ujmę to tak: jeśli gruźlica jest chorobą dziedziczną, to najwyraźniej wszyscy mamy do niej predyspozycje. Jak zresztą widać w załączniku do mojej rozprawy, statystyki mówią same za siebie.”\n\nWykład dr. [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] na Wydziale Medycznym"
 panum.244.g: "Czyli teoretycznie każdy może zostać zakażony?"
 panum.245.t: "Guzki gruźlicze"
 panum.245.d: "Podczas badania anatomicznego doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zdobył nowe informacje na temat guzów w tkance płucnej, od których choroba wzięła swoją nazwę."
 panum.245.f: "René Laennec opracował stetoskop, początkowo w celu badania gruźlicy. W kolejnych latach pomogło to w tym, że chorobę można było wykrywać wcześniej, dzięki możliwości wsłuchiwania się we wczesnym stadium w zmiany zachodzące w układzie oddechowym. Jednocześnie rosła wiedza na temat rozwoju gruźlicy wewnątrz organizmu."
 panum.245.g: "Mały postęp — ale jednak postęp."
 panum.246.t: "Styl życia i odporność"
 panum.246.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] ma poważne wątpliwości co do tradycyjnych teorii dotyczących przyczyny gruźlicy po dokładnym zbadaniu kilku pacjentów i ich historii życia."
 panum.246.f: "„Badanie kilku pacjentów w [SCOPE.sState('panum_disease_state').GetCityHubName], w tym ich osobistych historii, rodzi więcej pytań niż odpowiedzi; pod warunkiem że oczekuje się prawd tak prostych, jak to tylko możliwe, a nie jedynie fragmentów prawdy. To prawda, że szczególnie proletariat jest silnie dotknięty gruźlicą, ale uważam za wątpliwe, czy osoba zamożna z tego samego środowiska również nie padłaby ofiarą tej choroby. Jestem przekonany, że dobre odżywianie, świeże powietrze i aktywność fizyczna zapewniają pewien poziom odporności na choroby — ale nie wierzę, że można je z tego powodu całkowicie wykluczyć. Krótko mówiąc: uważam, że twierdzenie, iż ktoś zapada na gruźlicę, ponieważ jest artystą lub proletariuszem, jest naukowo nie do utrzymania. Gdyby tak było, gruźlica w ostatnich latach wybrałaby sobie przynależność i teraz wolałaby robotników fabrycznych jako swoje wysoko wybrane duchowo ofiary zamiast muzyków i poetów. Nikt nie może poważnie w to uwierzyć.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastNameNoFormatting] z [TimeKeeper.GetCurrentDate.Format('y')], [SCOPE.sState('panum_disease_state').GetCityHubName]"
 panum.246.g: "Dla niektórych niedocenianych geniuszy będzie to wielkie rozczarowanie."
 panum.247.t: "Choroba podlegająca zgłoszeniu"
 panum.247.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] eksperymentuje z systemem zgłaszania w [SCOPE.sState('panum_disease_state').GetCityHubName], który mógłby pomóc ograniczyć gruźlicę."
 panum.247.f: "„Uznanie gruźlicy za chorobę podlegającą zgłoszeniu w [SCOPE.sState('panum_disease_state').GetCityHubName] wywołało pewne niezadowolenie wśród ludności, ponieważ wiele osób uważa tę chorobę za sprawę prywatną. Jednak tak nie jest, szczególnie gdy przybiera ona formę epidemii. W chwili, gdy choroba zostaje uznana za zakaźną — a w przypadku gruźlicy wiele wskazuje na to, że tak jest — staje się sprawą publiczną, która może zagrażać dobru ogółu. Lepiej mieć chorobę podlegającą zgłoszeniu niż kwarantannę. Izolowanie pojedynczych źródeł zakażenia pokazało, że można zapobiegać rozprzestrzenianiu się gruźlicy bez wprowadzania całego miasta w stan wyjątkowy. Niestety piętno, jakie gruźlica zaczyna teraz nosić, będzie miało nieprzyjemne osobiste konsekwencje. Chorych na gruźlicę traktuje się teraz jak trędowatych.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastNameNoFormatting] z [TimeKeeper.GetCurrentDate.Format('y')], [SCOPE.sState('panum_disease_state').GetCityHubName]"
 panum.247.g: ""
 panum.248.t: "Zabijanie drobnoustrojów"
 panum.248.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] opracował proces chemiczny oparty na wcześniejszej wiedzy o mikroorganizmach. W przyszłości mógłby on zapobiec gruźlicy."
 panum.248.f: "Pasteryzacja oznacza krótkotrwałe podgrzewanie płynnych lub półpłynnych produktów spożywczych do temperatury co najmniej 72°C, maksymalnie do 100°C, w celu zabicia wegetatywnych form mikroorganizmów i łagodnego utrwalenia żywności. Proces ten stosowano w przypadku wina od połowy XIX wieku. Dopiero później zaczęto go stosować do surowego mleka, za którego pośrednictwem patogeny gruźlicy bydła mogły być przenoszone na ludzi. Pasteryzacja surowego mleka odegrała więc rolę w ograniczeniu gruźlicy. To odkrycie jest ważniejsze, niż mogłoby się początkowo wydawać: przez długi czas lekarze, biolodzy i chemicy zakładali, że gruźlica bydła nie może być przenoszona na ludzi. Nawet ekspert od gruźlicy Robert Koch mylił się w tej kwestii i dopiero później zmienił swoje zdanie — w okresie, gdy wiele dzieci zostało zakażonych przez gruźlicze mleko i masło."
 panum.248.g: "A ja myślałem, że mleko jest zasadniczo zdrowe!"
 panum.249.t: "Osobista spluwaczka"
 panum.249.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zauważył akcesorium, które stało się szczególnie popularne wśród kobiet chorych na gruźlicę. Ma ono wyrafinowaną niebieską szklaną obudowę, która wygląda tak modnie, że można zapomnieć, iż jest to spluwaczka."
 panum.249.f: "„Większość z nas ma coś takiego tutaj na górze. Ma to również swoją nazwę, przydomek, całkiem zabawny.” Bez żadnych oporów, z uparcie nieświadomym wyrazem twarzy, wypowiedziała ponure określenie „Niebieski Heinrich”. — Thomas Mann, Czarodziejska góra"
 panum.249.g: "Gdyby każda chora osoba nosiła coś takiego..."
 panum.251.t: "Choroba komórkowa?"
 panum.251.d: "Szeroko komentowane badanie niemieckiego specjalisty dotyczące gruźlicy podważa wcześniejsze ustalenia doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], ponieważ [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] nie jest jeszcze w stanie znaleźć odpowiedniej odpowiedzi na kontrargumenty."
 panum.251.f: "„Istnieją koledzy, którzy z pasją twierdzą, że gruźlica może być przenoszona przez zakażenie. Gdy konfrontuje się ich z faktem, że wielu pacjentów zachorowało bez przebywania w pobliżu chorego na gruźlicę, twierdzą, że prawdopodobnie zostali zakażeni gdzieś wiele lat wcześniej. Jak można to udowodnić? Moje własne badania wskazują raczej, że guzki tkanki płucnej należy interpretować jako rozrost komórek. Gruźlicę należy zatem rozumieć, podobnie jak raka, jako skutek rozrostu miejscowych komórek. Można ją jednoznacznie określić jako chorobę konstytucyjną.”\n\nDoktor Angelika Hasenbein, „Gruźlica, choroba podobna do raka”"
 panum.251.g: "Czyli gruźlica działa jak guz komórkowy?"
 panum.252.t: "Rozstrzenie oskrzeli"
 panum.252.d: "Jak odkrył doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], niektóre rzekome ustalenia, które [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] uważał, że [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] uzyskał od pacjentów chorych na gruźlicę, były błędne. Cierpieli oni na zupełnie inną chorobę."
 panum.252.f: "„Niestety, niektóre badania okazały się ślepą uliczką. Wierzyłem więc, że w pewnych okolicznościach niektórzy pacjenci chorzy na gruźlicę wyzdrowieli. W rzeczywistości nie mieli gruźlicy, lecz rozstrzenie oskrzeli. Nie można wykluczyć, że gruźlica może sprzyjać rozwojowi rozstrzeni oskrzeli, ale są to dwie różne choroby i dlatego nie wszystkie wyniki mają zastosowanie. Prawdopodobnie znacznie opóźni to poszukiwania skutecznej metody leczenia.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastNameNoFormatting] z [TimeKeeper.GetCurrentDate.Format('y')], [SCOPE.sState('panum_disease_state').GetCityHubName]"
 panum.252.g: "Zmarnowany czas!"
 panum.253.t: "Szarlataneria"
 panum.253.d: "Wizyta w sanatorium w [SCOPE.sState('panum_disease_state').GetCityHubName] okazała się dla doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] całkowitym rozczarowaniem."
 panum.253.f: "„Wielu kolegów i uznanych specjalistów medycznych polecało mi sanatorium w [SCOPE.sState('panum_disease_state').GetCityHubName]. To wzorowa instytucja, która zajmuje się gruźlicą za pomocą niezwykle poważnych metod — twierdzili. Kilku pacjentów mówiło o medycznych cudach, które miały tam miejsce.\n\nJednak po tygodniach odwiedzin zdałem sobie sprawę, że była to głównie reklama. Podczas gdy lekarze na miejscu zapewniali mnie, jak wielkie są szanse na wyzdrowienie, odkryłem coś zupełnie przeciwnego. Kiedy przejrzałem karty pacjentów, znalazłem, że niemal 50 procent przyjętych pacjentów zmarło w pierwszym tygodniu. Całe to sanatorium to oszustwo!\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastNameNoFormatting] z [TimeKeeper.GetCurrentDate.Format('y')], [SCOPE.sState('panum_disease_state').GetCityHubName]"
 panum.253.g: "Ale... ale... kolacja powinna być wyśmienita!"
 panum.254.t: "Kontakt z Białą Śmiercią"
 panum.254.d: "Najwyraźniej liczne wizyty u pacjentów chorych na gruźlicę przyniosły niezamierzony skutek: doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] wypluł dziś krew!"
 panum.254.f: "„Co za nieszczęśliwy dzień. Moje obcowanie z gruźlicą i moja rzekoma wiedza na temat tej choroby teraz mszczą się na mnie. Z jednej strony myliłem się w tak wielu kwestiach, że słuszne jest, iż moja duma zostaje ukarana. Z drugiej strony jest to dowód na to, że jest to choroba zakaźna. Ale jakim kosztem musiałem dokonać tego odkrycia?\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastNameNoFormatting] z [TimeKeeper.GetCurrentDate.Format('y')], [SCOPE.sState('panum_disease_state').GetCityHubName]"
 panum.254.g: "Doktor wyzdrowieje z tego — prawda?"
 panum.264.t: "De Contagione"
 panum.264.d: "Zainteresowania historyczne doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] doprowadziły [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim] do odnalezienia starożytnej księgi z epoki renesansu — mającej nieocenioną wartość."
 panum.264.f: "Już w 1546 roku weroński lekarz Girolamo Fracastoro wysunął teorię, że choroby są powodowane głównie przez zakażenie drobnymi cząsteczkami przypominającymi późniejsze zarazki. Z tego powodu podważał teorię miazmy ponad 300 lat temu. W odniesieniu do gruźlicy Fracastoro również twierdził, że jest to choroba zakaźna przenoszona przez te patogeny. Księga ta jest czasami bardziej przekonująca niż wiele współczesnych traktatów. Rewolucyjne jest to, że Fracastoro zakładał, iż te tak zwane „fomity” dostają się przez układ oddechowy lub pory ciała, aby poszukiwać pożywienia. To miałoby przyspieszać rozwój choroby."
 panum.264.g: "To nada nowy kierunek poszukiwaniom leczenia."
 panum.264.h: "To jest o wiele bardziej przekonujące niż teoria miazmy."
 panum.264.i: "Czy mały patogen może powodować gruźlicę?"
 panum.240.t: "Gruźlica — choroba zakaźna"
 panum.240.d: "Dzięki kilku eksperymentom i badaniom pacjentów doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] był w stanie ostatecznie udowodnić, że gruźlica jest nie tylko chorobą zakaźną, ale również wyprowadzić z tego kilka metod zapobiegania w [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] traktacie „[SCOPE.GetRootScope.GetCountry.GetCustom('panum_custom_treatment_title')]”."
 panum.240.f: "„Wiedza, że gruźlica jest chorobą, która może być przenoszona z osoby na osobę, a także ze zwierzęcia na człowieka, prowadzi do całej serii działań mających zapobiegać chorobie.\nPo pierwsze, osoby chore na gruźlicę muszą być trzymane z dala od tłumów.\nPo drugie, choroba musi podlegać zgłoszeniu, aby można było ograniczyć jej rozprzestrzenianie się.\nPo trzecie, należy wydać przepisy zapewniające higienę publiczną — takie jak zakaz plucia w miejscach publicznych lub przynajmniej nakaz używania publicznych i osobistych spluwaczek.\nPo czwarte, należy poprawić zdrowie publiczne, aby zminimalizować zakażenia wśród proletariuszy.\nPo piąte, pasteryzacja surowego mleka jest niezbędna.”\n\nZ: „[SCOPE.GetRootScope.GetCountry.GetCustom('panum_custom_treatment_title')]”"
 panum.240.g: "Gruźlica nie jest już wyrokiem."
 panum_add_dubious_yellow_fever_treatment_clues_effect_tt: "To daje wskazówkę... prawdopodobnie."
 panum.540.t: "Zapobiegać? Zapobiegnięto!"
 panum.540.d: "Po tygodniach badań i studiów nasz doktor opracował sposób na powstrzymanie rozprzestrzeniania się żółtej febry!"
 panum.540.f: "„...ale ostatecznie pozostał jeden dowód, pewny i niepodważalny. Niezależnie od tego, czy używano siatek, dymu czy pestycydów, moje badania wykazały, że za każdym razem, gdy z jakiegokolwiek powodu przerywano drogę komarów, rozprzestrzenianie się żółtej febry było zatrzymywane. Musi więc być to choroba przenoszona przez owady. Jeśli możemy przerwać proces rozmnażania, możemy z powodzeniem zapobiec pojawianiu się nowych komarów zdolnych do zakażenia naszych ludzi. To jedynie kwestia środków, a ja opracowałem trzyczęściowy plan.\n\nI: Spryskać lokalne stawy, bagna i mokradła pestycydem, aby uczynić je nieodpowiednimi do rozmnażania. Jeśli to możliwe, całkowicie osuszyć mniejsze zbiorniki wodne.\nII: Rozmieścić moskitiery, pokrycia z tkaniny nasączone pestycydem, na wszystkich otworach budynków publicznych, szczególnie szpitali.\nIII: Poinformować ludzi o naturze tej choroby jako przenoszonej przez komary oraz zachęcać do używania siatek, środków owadobójczych i dymu do odkażania ich domów.\n\nWierzę z całego serca, że jeśli te metody zostaną wprowadzone w życie, możemy doczekać końca endemicznej żółtej febry za naszego życia oraz końca tego najbardziej uporczywego z wrogów.”\n\nZ: „[SCOPE.GetRootScope.GetCountry.GetCustom('panum_custom_treatment_title')]” autorstwa doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName]"
 panum.540.g: "Dobra robota, doktorze. Teraz trzeba zdobyć trochę moskitier i środka na owady..."
 panum.541.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], nasz główny lekarz, przybył do [SCOPE.sState('panum_disease_state').GetName], aby zbadać tajemniczą żółtą febrę."
 panum.541.f_america: "„Przybyliśmy do [SCOPE.sState('panum_disease_state').GetCityHubName] długo przed świtem, a nasz pociąg dotarł na stację, na której peron był pozbawiony pasażerów, a dla maszynisty i jego kolegów w lokomotywie czekała jedynie butelka gorącej zupy. Niewielu ludzi opuszczałoby pociąg tak wcześnie rano, ale ja ledwo byłem w stanie odpocząć; listy i notatki lokalnego rządu ciążyły mi na umyśle, ponieważ mówiły o dziwnej chorobie — żółtej febrze. Nazwa pochodzi od żółtaczki towarzyszącej tej chorobie, choć to zaledwie początek cierpień — wymioty, bóle brzucha, krwawienie z oczu — a te objawy zabijają wielu.\n\nLecz choć skutki choroby są nam dobrze znane, opisane w relacjach sięgających pierwszej kolonizacji tych ziem, sama natura tej choroby przez długi czas wymykała się nauce. To właśnie tam znalazłem cel i energię, by obudzić moich kolegów i poprowadzić ich z pociągu do miasta, pod blaskiem lamp gazowych, wokół których komary nieustannie brzęczały. Jeśli kiedykolwiek mamy pokonać tę chorobę, musimy poznać najważniejsze pytanie ze wszystkich. Z czym walczymy?”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], piszącego o żółtej febrze w [SCOPE.sState('panum_disease_state').GetName], [TimeKeeper.GetCurrentDate.Format('y')]"
 panum.541.f_africa: "„Było już krótko po południu, gdy nasz statek wpłynął do portu, a kapitan poinformował nas, że dotarliśmy do celu. Jeden z wielkich posterunków naszego kolonialnego imperium, lokalna administracja przesłała do stolicy wiadomość o dziwnej, śmiertelnej chorobie, którą trudno było im zrozumieć — nie była to zwykła grypa, lecz niesławna żółta febra. Nie jest mi ona zupełnie obca, podobnie jak każdemu dobrze obeznanemu z historią chorób tropikalnych... ale mimo całej naszej wiedzy o jej licznych sposobach zabijania, tak niewiele wiemy o samej chorobie.\n\nWraz z moimi asystentami i uzbrojoną eskortą założyliśmy laboratorium niedaleko centrum miasta. Tam możemy przechowywać nasze próbki, zamieszkać i prowadzić niezbędne badania, aby rozwikłać tajemnice żółtej febry... ale najpierw musimy znaleźć te próbki, a nieustanna obecność komarów jest niepożądaną przeszkodą. Mimo to nie powstrzyma nas to przed pracą.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], piszącego o żółtej febrze w [SCOPE.sState('panum_disease_state').GetName], [TimeKeeper.GetCurrentDate.Format('y')]"
 panum.541.g: "Chodźcie, panowie... ziew."
 panum.541.h: "...przeklęte komary."
 panum.542.t: "Wojny minionych dni"
 panum.542.d: "Aby dowiedzieć się więcej o historii żółtej febry na tych ziemiach, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] postanowił skonsultować się z dowódcą lokalnego garnizonu."
 panum.542.f: "„Ach, dobrze pana widzieć, doktorze. Moi ludzie zawsze cieszą się, wiedząc, że są w dobrych rękach, jeśli nadejdzie choroba. W czym mogę pomóc?”\n„To moja przyjemność, pułkowniku. Powiedziano mi, że może pan posiadać zapisy z dawnych kampanii tutaj. Czy ma pan jakieś, w których odnotowano wybuch żółtej febry wśród żołnierzy?”\n„Och, z całą pewnością... proszę. To była straszna kampania, zapewniam pana, i nie chodziło tylko o wroga. Wielu chłopców, którzy giną na wojnie, umiera z powodu warunków, chorób i wyczerpania. Nazywają to wyniszczeniem.”\n„To... wyniszczenie było więc szczególnie dotkliwe?”\n„Gorsze niż dotkliwe. Między chorobami a porą deszczową człowiek miał więcej powodów do obaw w obozie niż na polu bitwy. Upał również był straszny, podobnie jak owady.”"
 panum.542.g: "Owady, choroby, deszcz... można by rzec, że to piekło stworzone przez samą naturę."
 panum.543.t: "Pola nieszczęścia"
 panum.543.d: "Kontynuując [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] misję poznania większej ilości informacji o żółtej febrze, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] udał się poza osadę do miejsca będącego pozornym siedliskiem zakażeń — wiejskiej farmy."
 panum.543.f: "„Przyznam, że niemal godzinę zajęło mi nauczenie się rozumienia tego wiejskiego akcentu, ale właściciel farmy okazał się bardzo pomocny. Chociaż ten region jest często dość wilgotny, nadal istnieje potrzeba prowadzenia prac irygacyjnych. Jednak kopanie tych rowów wymaga znacznej siły, którą zapewniają dziesiątki lokalnych robotników, często mieszkających razem w ciasnych, zagraconych barakach. Takie warunki mogą sprzyjać chorobom i nie jest zaskoczeniem, że wkrótce znaleziono tam żółtą febrę.\n\nSam rolnik uważa, że przybyła ona z jakimś podróżującym kupcem albo z handlarzami odbierającymi plony lub dostarczającymi narzędzia. Nie może stwierdzić tego z całą pewnością, ale sam miałbym co do tego wątpliwości. Bardziej wygląda na to, że żółta febra pojawiła się tutaj samoistnie... ale jeśli tak, to jak?”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], piszącego o żółtej febrze w [SCOPE.sState('panum_disease_state').GetName], [TimeKeeper.GetCurrentDate.Format('y')]"
 panum.543.g: "Jak choroba może tak po prostu... pojawić się znikąd?"
 panum.544.t: "Woda...?"
 panum.544.d: "Badając możliwość, że żółta febra może być chorobą przenoszoną przez wodę, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zebrał próbki z lokalnych cieków wodnych i studni."
 panum.544.f: "„Jedną z możliwości, którą brałem pod uwagę, było to, że choroba ta może mieć naturę podobną do cholery, która może być przenoszona przez skażoną wodę. Postanowiłem sprawdzić, czy tak jest w rzeczywistości, i poleciłem moim asystentom zebrać próbki, zanim znalazłem spokojne miejsce dla mojego mikroskopu, gdzie mógłbym pracować bez zakłóceń. Wilgotne i tropikalne powietrze rozprasza uwagę, podobnie jak nieustanny brzęk komarów, ale wkrótce próbki zaczęły pojawiać się pod soczewką, pozwalając mi zajrzeć do tego najmniejszego ze światów.\n\nNiestety, było to bezowocne przedsięwzięcie. Niektóre próbki były bardziej zanieczyszczone niż inne, zawierały nawet drobne robaki i tym podobne organizmy, ale nie odpowiadały one wzorcowi zakażonych, których przypadki rozprzestrzeniają się po mapie niczym rozrzucone śrutem. Niezależnie od tego, jak jest naprawdę, nie mogę znaleźć w tej wodzie żadnych wskazówek dotyczących natury żółtej febry...”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], piszącego o żółtej febrze w [SCOPE.sState('panum_disease_state').GetName], [TimeKeeper.GetCurrentDate.Format('y')]"
 panum.544.g: "...ale jeśli ich tam nie ma, to gdzie się ukrywają?"
 panum.545.t: "Wyspa"
 panum.545.d: "Zaintrygowany pozornym „przerwaniem” wzorca zakażeń, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] udał się w nietypowe miejsce — na wyspiarską osadę rybacką."
 panum.545.f: "„Ach, pan musi być doktorem... och. Proszę wybaczyć ten smród, doktorze. Proszę też uważać, żeby pan nie wpadł. Ryby, które zjadają wyrzucane przez nas wnętrzności, równie chętnie zjadłyby pana, gdyby mogły.”\n„...proszę się pospieszyć. Proszę mi opowiedzieć o tym miejscu.”\n„Ano, cóż, myślę, że ucieszy pana wiadomość, iż nie ma tu żadnej choroby. Przynajmniej nie ma żółtej febry.”\n„Jak to możliwe? Czy jest coś, co może chronić pańskich ludzi?”\n„Może dlatego, że spędzają tak mało czasu na lądzie. Większość dni spędzają na morzu, a niektórzy wypływają dalej i nie wracają przez dzień lub dłużej. Ale myślę, że musi być w tym coś więcej. Wolny czas spędzają tutaj, na wyspie, w barakach albo w swoich domach, a mimo to nie ma tu w ogóle gorączki.”\n„Zajmę się tym... nie, moi asystenci mogą to zrobić po moim powrocie.”\n„Na pewno przekażę wszystkim, doktorze... a on nawet się nie pożegnał.”"
 panum.545.g: "...ale najpierw kąpiel z dużą ilością mydła. Bardzo, bardzo dużą ilością mydła."
 panum.546.t: "Gaz bagienny"
 panum.546.d: "W tym, co może być upiornym powrotem do starej teorii miazmy, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] znalazł zaskakujące doniesienia — żółta febra może być powiązana z oparami bagiennymi!"
 panum.546.f: "„Boli mnie to, jak niewiele tutaj zdaje się mieć sens. Nic nie pasuje do ustalonych teorii, które znamy, a ja sam chwytam się ostatnich nadziei. Jednak istnieje jedna obiecująca wskazówka — bagna. Moi asystenci przygotowali preparaty do mikroskopu, a one aż roją się od drobnoustrojów, lecz nie od takich, które moglibyśmy zidentyfikować. A mimo to, pomimo tego, plaga wybucha na wybrzeżach. Domy w pobliżu tych mokradeł są najbardziej dotknięte żółtą febrą. Niektórzy wspominają nawet, że chorowali na nią w dzieciństwie.\n\nA jednak nie ma żadnego śladu... jak. Nie piją tej wody, nie jedzą ryb złowionych w niej, a mimo to jej odór niesie się z wiatrem do ich domów, wypełnia je smrodem, a wkrótce potem pojawia się choroba. Stare teksty krzyczałyby „miazma”, ale to nie może być prawdą... lecz jeśli nie, to jak inaczej choroba mogłaby rozprzestrzeniać się z bagna do domu?\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], piszącego o żółtej febrze w [SCOPE.sState('panum_disease_state').GetName], [TimeKeeper.GetCurrentDate.Format('y')]"
 panum.546.g: "...a może ma to związek z astrologią... nie, to nie ma sensu... prawda?"
 panum.547.t: "Rywal"
 panum.547.d: "Decydując się poszukać lokalnej wiedzy, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] postanowił odwiedzić potencjalnego sojusznika — miejscowego koronera."
 panum.547.f: "„Ach, miło pana poznać, doktorze. Proszę wybaczyć, że nie podamy sobie rąk, mam ciało na stole sekcyjnym w drugim pomieszczeniu.”\n„Żółta febra?”\n„Tak by pan pomyślał, ale nie. Malaria, uwierzyłby pan? Ze wszystkich możliwych momentów na wybuch epidemii, musiała nastąpić właśnie teraz, w tym samym czasie.”\n„Niefortunny zbieg okoliczności?”\n„Być może, ale jestem tutaj wystarczająco długo, by dostrzec pewien wzorzec. Te dwie choroby zwykle pojawiają się razem, a co gorsza, mają podobne objawy i podobny przebieg śmierci. To sprawia, że rozróżnienie ich jest strasznym zadaniem, zapewniam pana. Uznałbym je za tę samą chorobę.”\n„To jest... właściwie bardzo fascynujące. Czy ma pan dobre zapisy na ten temat?”\n„Och, oczywiście. Poproszę mojego asystenta, aby je panu przesłał, choć nie wiem, jak bardzo mogą być pomocne. Nie wiem, jak to coś się rozprzestrzenia, doktorze, ale założyłbym się, że jeśli znajdzie pan jedną z tych chorób, może pan znaleźć i drugą.”"
 panum.547.g: "W takim razie być może upieczemy dwie pieczenie na jednym ogniu."
 panum.548.t: "Rozdroże"
 panum.548.d: "Zdezorientowany naturą żółtej febry, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] napisał z powrotem do stolicy z prośbą o dalsze instrukcje."
 panum.548.f: "„...a jednak, choćbym nie wiem jak próbował, nie wiem, jak dalej postępować. Jest niewiele „wskazówek”, które mogłyby pokierować moim śledztwem, i choć przejrzałem wiele czasopism medycznych oraz skonsultowałem się z lokalnymi ekspertami, nie jestem całkowicie pewien, czym tak naprawdę jest żółta febra. Choroba, co do tego nie ma wątpliwości, ale jakiego rodzaju? Choroba powietrza, jak miazma? Coś w wodzie lub pożywieniu? Jak rozprzestrzenia się z człowieka na człowieka, a może z bagna na człowieka?\n\nTo pytania, na które nie potrafię odpowiedzieć i być może nigdy nie odkryję prawdy. Jeśli nie odnajdę choroby, nie mogę mieć nadziei na bezpośrednią walkę z nią, jednak moje badania nie są całkowicie bezowocne. Być może znalazłem dwie możliwe drogi badań, które należy rozważyć:\n\nPo pierwsze, możemy spróbować znaleźć pewien wzorzec w sposobie jej rozprzestrzeniania się. Być może dzięki ukierunkowanemu śledztwu uda nam się odkryć logikę tego, jak choroba jest przekazywana, a następnie ją przerwać. Być może zatrzymanie rozprzestrzeniania się ujawni prawdziwą przyczynę.\n\nPo drugie, możemy spróbować opracować jakąś formę leczenia lub szczepionkę, być może badając dzieci, które zostały zakażone w młodości, ale w pełni wyzdrowiały, a także tych, którzy przeżyli. Możemy nie znać jej pochodzenia, ale być może mimo wszystko możemy ją pokonać.\n\nDlatego piszę do stolicy, do was, szanowni panowie nauki i wiedzy, i pytam: na czym powinien skupić się mój dalszy kierunek badań tutaj?\n\nList od doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] z [SCOPE.sState('panum_disease_state').GetName], [TimeKeeper.GetCurrentDate.Format('y')]"
 panum.548.g: "Lepiej zapobiegać, niż leczyć."
 panum.548.h: "Gramy o wszystko. Będziemy mieć szczepionkę."
 panum.551.t: "Droga do zapobiegania"
 panum.551.d: "Postępując zgodnie z instrukcjami ze stolicy, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] rozpoczął badania nad sposobami zapobiegania rozprzestrzenianiu się żółtej febry."
 panum.551.f: "„...oczywiście trudno określić, co dokładnie należy zrobić, aby zapobiec rozprzestrzenianiu się choroby, o której niewiele wiemy poza tym, w jaki sposób może prowadzić do śmierci. Jednak jeśli to jest wyzwanie, któremu muszę stawić czoła, niech tak będzie. Do tej pory odkryłem kilka obiecujących tropów; moja mapa zakażeń jest chaotyczna, ale tu i ówdzie pojawiają się pewne wyspy nieregularności... miejsca, w których wybuch epidemii znacznie słabnie, a nawet całkowicie zanika.\n\nNie mogę udawać, że naprawdę rozumiem naturę tej choroby, ale choroba z pewnością nie jest pozbawiona prawidłowości. Istnieje tu pewien wzorzec, który czeka na odkrycie, a jeśli uda nam się go znaleźć, możemy bardzo dobrze rozwiązać tę zagadkę i na dobre pozbyć się żółtej febry.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], piszącego o żółtej febrze w [SCOPE.sState('panum_disease_state').GetName], [TimeKeeper.GetCurrentDate.Format('y')]"
 panum.551.g: "Budujemy fortecę, cegła po cegle."
 panum.552.t: "Porcja faktów"
 panum.552.d: "Podczas pracy nad sposobem zapobiegania rozprzestrzenianiu się żółtej febry doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] został odwiedzony przez jednego z [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] asystentów."
 panum.552.f: "„Ach, dobrze cię znowu widzieć, mój chłopcze, i — na litość boską! Co to za smród?”\n„Przepraszam, doktorze... właśnie wróciłem z osady rybackiej, tej, do której wysłał mnie pan na badania. Znalazłem coś bardzo interesującego!”\n„Tak interesującego, że nie mogłeś znaleźć czasu na kąpiel, jak widzę...”\n„Proszę mi wybaczyć, ale tak. Badałem, dlaczego żółta febra nie dotknęła ludzi w osadzie rybackiej, i zacząłem podążać tym śladem z powrotem na ląd. Na brzegu znajduje się wędzarnia, a pracujący tam ludzie wychodzą stamtąd i nikt z nich nie zapada na żółtą febrę. I wtedy zacząłem się zastanawiać... może dym trzyma ją z dala? Zacząłem więc szukać miejsc, gdzie jest dużo dymu, i znalazłem tego mydlarza, który dodaje zioła i oleje do swojego pieca. W jego domu nie odnotowano ani jednego przypadku żółtej febry.”\n„Hmm... to fascynujące odkrycie. „Hmm... to fascynujące odkrycie. Kontynuuj swoje obserwacje i informuj mnie o postępach i... dobra robota.”"
 panum.552.g: "Podekscytowany asystent odchodzi... pozostawiając doktora pogrążonego w myślach."
 panum.553.t_america: "Misja"
 panum.553.d_america: "Podążając tropem miejsc, w których epidemia nie wystąpiła, badania doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] doprowadziły go do starej kolonialnej misji."
 panum.553.f_america: "„Nie minęło wiele czasu, zanim odnaleźliśmy tutejszą misję. Był to jeden z pierwszych budynków wzniesionych po kolonizacji, przez naszych przodków świeżo przybyłych z ziem, których być może już nigdy nie mieli ujrzeć. Nie jest to żadna wielka katedra, ale zbudowano ją z miłością, a z czasem misjonarze i przedstawiciele Kościoła rozbudowali ją, dodając kolejne oddziały i sale. Było to jedno z pierwszych miejsc, do których sprowadzano chorych, gdzie opiekowały się nimi zakonnice i wszyscy pobożni ochotnicy gotowi pomagać.\n\nWedług wszelkich przewidywań powinna stać się kolejnym miejscem masowej śmierci... a jednak tak się nie stało. Podczas gdy inne szpitale liczą swoich zmarłych i patrzą, jak choroba przenosi się z oddziału na oddział, tutaj nie dzieje się nic. Pewna rodzina została przyjęta po pożarze domu, ale po tygodniu nikt z nich nie zachorował na żółtą febrę, mimo że przebywali zaledwie kilka pomieszczeń dalej. Zastanawia mnie to, ponieważ zarówno misja, jak i szpital są do siebie podobne, ale istnieje jedna zasadnicza różnica: siatki. Kazanie jest rzeczą świętą i nie może być przerywane przez brzęczące komary i inne owady, dlatego duchowni założyli siatki na każdym oknie, aby nie dopuścić komarów, nawet na oddziałach.\n\nI wtedy żółta febra zdaje się po prostu całkowicie znikać.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], piszącego o żółtej febrze w [SCOPE.sState('panum_disease_state').GetName], [TimeKeeper.GetCurrentDate.Format('y')]"
 panum.553.g: "Albowiem przywrócę ci zdrowie..."
 panum.553.t_africa: "Slumsy"
 panum.553.d_africa: "Podążając tropem przerw w rozprzestrzenianiu się epidemii, badania doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] doprowadziły go w ciekawe miejsce — do slumsów."
 panum.553.f_africa: "„Slumsy znajdowały się na tyle blisko, że każdy człowiek mógłby zacząć wątpić w sens naszej wielkiej kolonialnej misji na tych ziemiach. Brudne i nędzne, wypełnione po brzegi kobietami i dziećmi czekającymi na powrót swoich mężczyzn z plantacji, kopalni lub innych miejsc pracy. Ciągle używane pompy wodne napełniały garnki, muchy brzęczały, a wyraźny brak higieny sprawiał, że miejsce to wydawało się kotłem chorób. I rzeczywiście nim było.\n\nRzadki widok w takich miejscach — lekarz taki jak ja został z entuzjazmem prowadzony od domu do domu przez miejscowych przewodników, w towarzystwie policji kolonialnej, proszony o pomoc przy różnych chorobach. W zamian zadawałem im pytania: co z żółtą febrą? Widziałem przypadki cholery i dyzenterii, ale nie chorobę, której szukam. Jedna kobieta wskazała na okna, a właściwie na miejsca, gdzie powinny się znajdować — zamiast szkła były tam siatki. Dla nich chroniły przed malarią, ale być może także przed żółtą febrą... która, jak wierzą, może być roznoszona przez owady.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], piszącego o żółtej febrze w [SCOPE.sState('panum_disease_state').GetName], [TimeKeeper.GetCurrentDate.Format('y')]"
 panum.553.h: "...a może, tylko może, miejscowi mają rację?"
 panum.554.t: "Największy zabójca"
 panum.554.d: "Przeglądając zapisy przekazane mu przez lokalne siły wojskowe, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] dokonał odkrycia."
 panum.554.f: "„Ach, dobrze znów pana widzieć, pułkowniku. Mam kilka pytań dotyczących tych zapisów, które mi pan przekazał. Czy ma pan chwilę?”\n„Ależ oczywiście! Wszystko, co mogę zrobić, aby pomóc.”\n„Wspomniano tutaj, że ostatnią kampanią dowodził oficer, który, jak się wydaje, bardzo cierpiał z powodu ukąszeń owadów.”\n„Cierpiał i był przy tym bardzo, bardzo zirytowany, obawiam się. Ukąszenia są po prostu częścią życia na tych ziemiach, ale skąd pochodziły... tego nie wiadomo.”\n„Rozumiem, rozumiem... ale wspomniano również, że armia zmagała się zarówno z malarią, jak i żółtą febrą, które zabiły więcej ludzi przez choroby niż podczas walk.”\n„Wyniszczenie od dawna jest częścią działań wojennych, obawiam się.”\n„...ale gdy tylko zarządzono użycie pyretrum, liczba przypadków żółtej febry i malarii gwałtownie spadła. Następnie, tydzień później, nakazał opryskanie okolicy i ponownie liczba zachorowań spadła. Czym dokładnie jest to pyretrum?”"
 panum.554.g: "„Och, pyretrum? Używa się go do odwszawiania żołnierzy. Zabija owady, wie pan.”"
 panum.555.t_america: "Wspomnienia z dawnych lat"
 panum.555.d_america: "Zmagając się z chorobą, która od wieków nęka Amerykę Południową, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] szuka odpowiedzi w niezwykłym miejscu — w przeszłości."
 panum.555.f_america: "„Niektórzy mówią, że przeszłość jest niczym obcy kraj. W Amerykach być może jest to prawdziwsze niż gdziekolwiek indziej, ponieważ od czasów Kolumba wiele się zmieniło, lecz ku mojemu zaskoczeniu choroba, z którą walczę, nie jest jedną z tych rzeczy. Tygodniami poszukiwałem dzienników i zapisów pierwszych kolonistów tych ziem, aż w końcu trafiły one w moje ręce. To niezwykle cenne znalezisko. Dzięki nim poznałem relacje dawnych lekarzy, wybitnych umysłów, którym brakowało narzędzi, które dziś uważamy za coś oczywistego.\n\nChoć odziedziczyliśmy po nich ich niedokończoną walkę, pozostawili nam bezcenne informacje, które mogą pozwolić mi dokończyć to, co rozpoczęli. W tych zapisach kryje się ważna wskazówka, trudna do dostrzeżenia bez tak szczegółowych relacji. Co pewien czas w tym regionie dochodzi do nagłych wybuchów żółtej febry, niemal z regularnością godną zegara. Samo to niewiele by znaczyło, lecz niemal idealnie pokrywa się z zapisami opisującymi gwałtowne deszcze, a nawet powodzie — domy zmywane przez wodę, po których następowały wybuchy żółtej febry. Czy te dwa zjawiska mogą być ze sobą powiązane?”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], piszącego o żółtej febrze w [SCOPE.sState('panum_disease_state').GetName], [TimeKeeper.GetCurrentDate.Format('y')]"
 panum.555.g: "Wszyscy stoimy na ramionach gigantów... oni po prostu mieli mniej gigantów, na których mogli stanąć."
 panum.555.t_africa: "Ludowe sposoby leczenia"
 panum.555.d_africa: "Być może kontrowersyjnie, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zwrócił się po radę do ludzi, którzy mogą najlepiej znać żółtą febrę — rdzennych mieszkańców."
 panum.555.f_africa: "„Niektórzy uznaliby mnie za szaleńca za to, że zamiast szukać odpowiedzi w czasopismach medycznych, postanowiłem zwrócić się po radę do rdzennych mieszkańców, lecz uważam, że taki osąd nie ma podstaw. Żółta febra jest chorobą występującą tutaj, w Afryce, a ci ludzie żyją na tych ziemiach znacznie dłużej niż my. Co więcej, istnieje możliwość, że właśnie tutaj choroba ta miała swój początek. Być może tak jest, ponieważ wiele epidemii potrafi z łatwością zdziesiątkować Europejczyków i innych przybyszów, podczas gdy miejscowym Afrykanom powoduje jedynie objawy przypominające łagodną grypę.\n\nMimo to istnieje tu pewna wiedza. Rozmawiałem z wieloma miejscowymi uzdrowicielami, a nawet z przedstawicielami plemion zamieszkujących dalsze tereny, i wspominają oni o pewnych sposobach zapobiegania... paleniu odchodów słoni oraz różnych roślin, a także wprowadzaniu tego dymu do wnętrz domów, co odpędza komary, które według nich mają związek z malarią, a być może również z żółtą febrą. Co więcej, potrafią obserwować otaczającą ich przyrodę i przewidywać nadejście „pory deszczowej”, którą uważają za okres największego zagrożenia zarówno malarią, jak i żółtą febrą. Wymaga to dalszych badań i rozważenia, ale jest to niezwykle obiecujące.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], piszącego o żółtej febrze w [SCOPE.sState('panum_disease_state').GetName], [TimeKeeper.GetCurrentDate.Format('y')]"
 panum.555.h: "Mądrość w miejscu, w którym najmniej można było się jej spodziewać."
 panum.556.t: "Prosta tkanina?"
 panum.556.d: "Choć nowe tkaniny nasączone środkami owadobójczymi miały wspierać nasze wojska w przygranicznym garnizonie, trafiły one do tego samego miasta, które bada doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName]."
 panum.556.f: "„Co ty tu robisz? — och, widzę, że jesteś lekarzem ze stolicy. Nie wiem, czy znajdziesz tu coś dla siebie, doktorze. „Nie ma tu ani jednego przypadku tej febry.”\n„...przynajmniej z tego, co widzę. Co to jest?”\n„Dowództwo w kraju odkryło, że można nasączać tkaniny środkami owadobójczymi i trzymać te przeklęte robale z dala. Widzisz? Spójrz na ziemię. Dziesiątki tych skurczybyków już leżą martwe.”\n„To musi być niezwykle skuteczne, skoro zabija je tak szybko. Ilu ludzi stacjonuje w tych namiotach?”\n„Prawie cały batalion, pewnie jakieś sześćset osób. Ta tkanina jest nowa, bo stare namioty zostały zniszczone podczas zeszłorocznego monsunu. To był straszny czas — febra była wszędzie, a malaria również dawała się we znaki. Teraz mamy te namioty i nic.”"
 panum.556.g: "...czy właśnie powiedziałeś, że odkąd macie tę nową tkaninę, nie było ani jednego przypadku febry?"
