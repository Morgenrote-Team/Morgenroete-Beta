 je_panum_medical_techniques_project: "Wprowadź Techniki Medyczne"
 je_panum_medical_techniques_project_reason: "Celem doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] jest rozpowszechnianie najnowszych technologii medycznych w [GetPlayer.GetName]. To, jak szybko ten proces przebiega, zależy od cech charakteru i doświadczenia [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis]. Po ukończeniu reformy medycznej nasz naród otrzyma lepszy modyfikator zastępujący stary. W niektórych przypadkach [concept_panum_physician] może opracować własne wynalazki, które zrewolucjonizują historię medycyny."
 panum_medical_techniques_advance_tt: "Techniki Medyczne w [GetPlayer.GetName] poprawiają się o poziom."
 panum.2401.t: "Szczepienia"
 panum.2401.d: "Wprowadzenie powszechnego programu szczepień początkowo spotkało się ze sceptycyzmem wśród ludności, ale po tym, jak doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] odwiedził kilka prowincji kraju i zademonstrował tę procedurę, większość pacjentów przyzwyczaiła się do niej."
 panum.2401.f: "Początkowo istniał pewien opór wobec pomysłu kampanii szczepień. Zaniepokojone matki ze swoimi przestraszonymi dziećmi, pomarszczeni starsi panowie sceptyczni wobec tego nowego cudu, bardzo pobożni ludzie obawiający się, że nauka ingeruje w coś, czego nie są w stanie pojąć. Edukacja rozwiązała ten problem — wyjaśnienia, jak to działa i dlaczego — ale jeszcze ważniejsze były rezultaty. Dzieci, które zachowały wzrok i zdrowie, a nie zostały dotknięte przerażającymi skutkami jednej z najgroźniejszych chorób, z jakimi ludzkość kiedykolwiek się zmierzyła. Niewielu trzeba było przekonywać, gdy widzieli je bez blizn i pełne życia."
 panum.2401.g: "To jest medyczna rewolucja!"
 panum.2401.h: "Nasze standardy medyczne i higieniczne rosną."
 panum.2402.t: "Znieczulenie"
 panum.2402.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zaprezentował nową metodę znieczulenia w kilku klinikach. Jest ona obecnie uważana za standardową metodę podczas szczególnie nieprzyjemnych operacji."
 panum.2402.f: "'Zzz.'"
 panum.2402.g: "Operacje medyczne bez świadomości? Czy to dozwolone?"
 panum.2403.t: "Strzykawki i kleszcze"
 panum.2403.d: "Nowy sprzęt medyczny, który wprowadził doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], wymagał pewnego przyzwyczajenia, ale obecnie jest standardem w każdym gabinecie lekarskim."
 panum.2403.f: "„Co to za narzędzie, doktorze?”\n„Nie narzędzie, lecz strzykawka. Można nią wstrzykiwać płyny.”\n„A to jest do operacji dentystycznych, jak rozumiem?”\n„Nie, to kleszcze.”\n„Dobrze, dobrze. A to nowy skalpel?”\n„Moje sztućce do obiadu.”"
 panum.2403.g: "Profesjonalizacja w tej dziedzinie jest po prostu zdumiewająca."
 panum.2404.t: "Sterylizacja"
 panum.2404.d: "Po pomyślnym udowodnieniu znaczenia sterylizacji doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] sprawił, że mycie rąk i czyszczenie narzędzi stało się standardową praktyką wszystkich lekarzy w [GetPlayer.GetName]!"
 panum.2404.f: "„Oczywiście wciąż są tacy, którzy uważają, że te praktyki są niepotrzebne, a wielu z nich to uczeni panowie, którzy wcześniej uratowali wiele istnień. Do tych szanowanych ludzi mówię: posłuchajcie dowodów. Odkrycie teorii zarazków udowodniło, że choroby powstają przez mikroskopijne stworzenia, które można zniszczyć jeszcze przed zakażeniem, ratując życia, które w przeciwnym razie mogłyby zostać utracone. Nigdzie nie jest to bardziej widoczne niż na oddziale położniczym największego szpitala w [ROOT.GetCountry.GetCapital.GetCityHubName], gdzie śmiertelność wśród młodych matek została tak znacznie zmniejszona — z 18,3% do zaledwie 2,2% zaledwie miesiąc później.”\n„Najmilsi panowie, wyniki mówią same za siebie.”"
 panum.2404.g: "Kto by pomyślał, że mycie rąk po kontakcie z chorymi osobami jest tak ważne?"
 panum.2404.h: "Ach, więc lekarz ma kolejny powód, by mieć butelkę alkoholu!"
 panum.2404.i: "Hmm. To brzmi jak wygodna wymówka..."
 panum.2405.t: "Dokumentacja medyczna"
 panum.2405.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] w dużej mierze zmodernizował pobyt pacjentów, zarówno w gabinecie lekarskim, jak i w szpitalu, dzięki lepszej rejestracji oraz tworzeniu dokumentacji medycznej."
 panum.2405.f: "Dokumentacja medyczna opisuje systematyczne zapisywanie historii choroby i opieki nad pojedynczym pacjentem w czasie, w ramach jurysdykcji konkretnego świadczeniodawcy opieki zdrowotnej. Historia choroby jest podłużnym zapisem tego, co wydarzyło się z pacjentem od urodzenia. Dokumentuje choroby, zarówno poważne, jak i drobne dolegliwości, a także etapy rozwoju. Pozwala lekarzowi zrozumieć, co wcześniej wydarzyło się z pacjentem. Dzięki temu często może dostarczyć wskazówek dotyczących obecnego stanu chorobowego. Historia choroby obejmuje kilka elementów, takich jak historia zabiegów chirurgicznych, przyjmowane leki i alergie na leki, nawyki lub historia szczepień. W ramach dokumentacji medycznej poszczególne wizyty lekarskie są oznaczane osobnymi podsumowaniami historii choroby pacjenta sporządzanymi przez lekarza, pielęgniarkę specjalistyczną lub asystenta lekarza i mogą przybierać różne formy. Gdy pacjent jest hospitalizowany, codzienne aktualizacje są wpisywane do dokumentacji medycznej, opisując zmiany w stanie klinicznym."
 panum.2405.g: "Statystyka, matematyka, biurokracja i medycyna — wreszcie zjednoczone!"
 panum.2406.t: "Wprowadzenie ambulansu"
 panum.2406.d: "Kilka dni temu zamożny przedsiębiorca z [ROOT.GetCountry.GetCapital.GetCityHubName] hojnie podarował miejscowemu szpitalowi nowy pojazd: pierwszy samobieżny ambulans w całym [GetPlayer.GetName]."
 panum.2406.f: "„...i wtedy ją zobaczyłem. Pomalowany na olśniewającą biel i dumnie ozdobiony krzyżem, nowy ambulans nie potrzebował zamieszania związanego z końmi ani siły ludzi, lecz zamiast tego korzystał z mocy własnego silnika. Po raz pierwszy ranni mężczyźni i kobiety w najpilniejszej potrzebie mogli zostać szybko przewiezieni do szpitala, do jego wygód i opieki, co z pewnością uratuje życie niezliczonych osób, które w przeciwnym razie mogłyby zginąć. Poruszyło to moje serce, gdy to zobaczyłem, ponieważ oto najlepsze cechy człowieka, miłość, jaką może on darzyć obcych, zostały ukazane wszystkim.”\n\nFragment lokalnej gazety, „Gazeta [ROOT.GetCountry.GetCapital.GetCityHubName]”, [TimeKeeper.GetCurrentDate.Format('y')]."
 panum.2406.g: "Wspaniale! Teraz potrzebuje już tylko syreny..."
 panum.2406.h: "Wspaniale! Nasze szpitale zrobią z nich świetny użytek!"
 panum.2407.t: "Lotniczy ambulans"
 panum.2407.d: "Do stolicy właśnie dotarły wieści o czymś niezwykłym: pilot przewiózł kobietę rodzącą z odległej wsi do szpitala, co jest pierwszym lotem medycznym w historii [GetPlayer.GetName]!"
 panum.2407.f: "„...oczywiście, dość trudno było się skupić. Samolot nie ma przecież miejsc dla wielu osób, a wycie rodzącej kobiety niemal zagłuszało dźwięk śmigła i silnika. Oczywiście są to jednak drobiazgi w porównaniu z samym czynem — nie ma na tej Ziemi duszy, która mogłaby odmówić pomocy kobiecie w potrzebie, więc kiedy zaczęła rodzić na terenie widokowym, zrobiłem to, co zrobiłaby każda dobra osoba, i dostarczyłem ją tak szybko, jak tylko mogłem, w ręce wykwalifikowanych i zdolnych lekarzy w szpitalu. Powiedziano mi, że byłby to niebezpieczny poród pośladkowy, ale dzięki temu, że dotarła tam tak szybko, lekarz mógł zmienić położenie dziecka przed zdrowym, naturalnym porodem.\nTak, wierzę, że dziecko zostało nazwane moim imieniem.”\n\nWywiad z lokalnej gazety, „Gazeta [ROOT.GetCountry.GetCapital.GetCityHubName]”, [TimeKeeper.GetCurrentDate.Format('y')]."
 panum.2407.g: "Więc dzieci rzeczywiście przylatują z powietrza!"
 panum.2407.h: "Westchnienie ulgi dla matek na całym świecie!"
 panum.52.l: "Epidemia odry w [SCOPE.sCountry('panum_measles_country_scope').GetName]."
 panum.52.n: "Epidemia dżumy w [SCOPE.sCountry('panum_plague_country_scope').GetName]."
 panum.52.o: "Epidemia błonicy w [SCOPE.sCountry('panum_diphteria_country_scope').GetName]."
 panum.52.p: "Epidemia polio w [SCOPE.sCountry('panum_polio_country_scope').GetName]."
 country_panum_surgical_treatment_success_chance_mult: "Szansa powodzenia leczenia chirurgicznego"
 country_panum_psychological_treatment_success_chance_mult: "Szansa powodzenia leczenia psychologicznego"
 panum.641.t: "Choroba podlegająca obowiązkowi zgłoszenia"
 panum.641.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] napisał pilny list do władz, aby zaprzestać traktowania odry jako łagodnej choroby i uczynić ją chorobą podlegającą obowiązkowi zgłoszenia."
 panum.641.f: "„Musiałem wysłuchiwać oskarżeń ze strony kolegów, nawet bardzo wpływowych kolegów w najwyższych organach państwowych i uniwersyteckich, że wyolbrzymiam zagrożenie stwarzane przez odrę. Zarzucano mi nawet, że rozdmuchuję problem odry bardziej, niż jest w rzeczywistości, tylko po to, aby poprawić swoją pozycję. To prawda, że śmiertelność w przypadku odry wynosi od 2 do 5 procent. Ale jeśli założymy tylko, że około 2 na 100 osób umiera na odrę, to w kraju liczącym 10 milionów mieszkańców oznacza to kilka tysięcy zgonów. Na całym świecie dochodzi do milionów zgonów, których można by uniknąć dzięki prostym środkom ochronnym. Czy nie byłoby lepiej, gdybyśmy wszyscy po prostu zwracali nieco większą uwagę i przestrzegali zasad, aby ratować ludzkie życie? Czy chcemy popełniać te same błędy co kobiety, które niedawno rodziły, oraz lekarze przejawiający arogancję, nie myjąc rąk, mimo że wymaga to niewielkiego nakładu czasu i przynosi ogromne skutki?”\n\nFragment listu doktora [ROOT.Var('panum_physician_var').GetCharacter.GetFullName] do władz lokalnych w [SCOPE.sState('panum_disease_state').GetName]"
 panum.641.g: "Małe rzeczy mogą mieć duży wpływ."
 panum.642.t: "Zakażenia zwierząt odrą"
 panum.642.d: "W szeroko nagłośnionym eksperymencie na zwierzętach doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zaraził małpy odrą."
 panum.642.f: "„Ze względu na ogromne znaczenie tego zagadnienia oraz pozorną niewrażliwość innych zwierząt, uznaliśmy za wysoce pożądane dalsze zbadanie kwestii podatności małp na zakażenie odrą.\nRozpoczęliśmy pracę rok temu i pragniemy teraz przedstawić wyniki, które naszym zdaniem dowodzą, że makak rezus może zostać zakażony krwią pobraną z ogólnego krążenia osoby chorej na odrę oraz że tak zakażona małpa może wykazywać wyraźną reakcję gorączkową przypominającą przebieg temperatury w niektórych typach odry u człowieka, z uogólnioną wysypką lub bez niej.\nPełne szczegóły naszych badań zostaną przedstawione w pracy, która jest obecnie przygotowywana.”\n\nRaport doktora [ROOT.Var('panum_physician_var').GetCharacter.GetFullName] dla Wydziału Lekarskiego."
 panum.642.g: "To pomoże w znalezieniu skutecznego leczenia."
 panum.642.h: "To pomoże w poszukiwaniu patogenu."
 panum.643.t: "Choroba zależna od wieku"
 panum.643.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] przeanalizował kilka przypadków zachorowań w [SCOPE.sState('panum_disease_state').GetName] i zauważył znaczne różnice w śmiertelności pacjentów."
 panum.643.f: "„Odra jest uważana za nieszkodliwą chorobę wieku dziecięcego. Moje badania wykazały jednak, że jest to prawdą tylko w przypadku dzieci w wieku przedszkolnym. Natomiast śmiertelność jest szczególnie wysoka u dzieci między 6. miesiącem a 3. rokiem życia. Później śmiertelność dość szybko spada. Chociaż odra u dorosłych jest uważana za nieszkodliwą, doniesienia Ludviga Panuma z Wysp Owczych wykazały, że lepiej, aby uodpornienie nastąpiło w dzieciństwie — nawet doświadczeni rybacy zgłaszają ciężki przebieg choroby, a nawet śmierć.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], [TimeKeeper.GetCurrentDate.Format('y')]"
 panum.643.g: "Czyli istnieją szczególne grupy ryzyka."
 panum.644.t: "Wysoce zaraźliwa"
 panum.644.d: "Podczas wizyty w szkole w [SCOPE.sState('panum_disease_state').GetName] doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] mógł samemu [ROOT.Var('panum_physician_var').GetCharacter.GetHerselfHimself] przekonać się, że gdy choroba już wybuchnie, rozprzestrzenia się niemal niepowstrzymanie."
 panum.644.f: "„Dziękuję za przybycie, doktorze.”\n„Radość po mojej stronie, proszę pani. Ile przypadków odry ma teraz szkoła?”\n„Niestety, całkowicie straciliśmy rachubę. Wczoraj było ich 35, ale do tej pory powinniśmy już przekroczyć 40.”\n„Kiedy odnotowano pierwszy przypadek odry?”\n„W zeszłym tygodniu.”"
 panum.644.g: "Niepokojące."
 panum.645.t: "Kichanie i kaszel"
 panum.645.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zaleca środki kwarantanny, takie jak te stosowane w przypadku grypy lub gruźlicy, aby ograniczyć rozprzestrzenianie się odry."
 panum.645.f: "„Odra nie jest postrzegana jako choroba układu oddechowego, ale moje podejrzenia zostały potwierdzone — jest to jedyny sposób, aby powstrzymać jej rozprzestrzenianie się. Odra — jedna z najbardziej zaraźliwych chorób człowieka — najwyraźniej przenosi się drogą kropelkową. Istnieją doniesienia, że osoby przebywające w pomieszczeniu, w którym znajdowała się chora osoba, zostały zakażone, mimo że opuściły je dwie godziny wcześniej. Najwyraźniej zakaźne wydzieliny pozostają później nadal zaraźliwe.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], [TimeKeeper.GetCurrentDate.Format('y')]"
 panum.645.g: "Na szczęście są to dobrze znane metody."
 panum.646.t: "Antybiotyki"
 panum.646.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] dostrzega w nowych antybiotykach możliwość zmniejszenia niektórych skutków ubocznych odry."
 panum.646.f: "„Fakt, że odra często nie jest traktowana poważnie jako choroba, wynika również z tego, że często nie powoduje dalszych skutków ubocznych. Niestety, nie zawsze tak jest. Choroby wtórne, takie jak infekcje ucha lub płuc, często decydowały o tym, czy przebieg choroby był łagodny, ciężki czy śmiertelny. Antybiotyki nie mogą wyleczyć odry, ale mogą odebrać jej grozę.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], [TimeKeeper.GetCurrentDate.Format('y')]"
 panum.646.g: "Zdobądź więcej antybiotyków!"
 panum.646.h: "Te odkrycia powinny pomóc w poszukiwaniu właściwego patogenu."
 panum.647.t: "Statystyka"
 panum.647.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] szczególnie wyróżnił się w statystycznym rejestrowaniu przypadków odry, opracowywaniu danych dotyczących zakażonych gospodarstw domowych oraz analizie zebranych informacji."
 panum.647.f: "„W drobiazgowych badaniach dostępnych danych z ostatnich kilku lat przeanalizowałem śmiertelność osób chorych na odrę w 22 krajach i doszedłem do następujących wniosków:”\n\nChile 4,84%, Węgry 4,43%, Australia 0,24%, Szkocja 0,35%, Hiszpania 3,85%, Włochy, Anglia i Walia 2,91%, USA 1,08%. W krajach, w których odra była endemiczna, ogniska epidemiczne występowały co trzy do pięciu lat wraz z odnowieniem populacji. Następnie odnotowywano znacznie wyższe wskaźniki, sięgające 10%, szczególnie na wyspach Pacyfiku i w Afryce.”\n\nRaport doktora [ROOT.Var('panum_physician_var').GetCharacter.GetFullName] dla Wydziału Lekarskiego."
 panum.647.g: "Przydatne."
 panum.647.h: "Doktor ma talent, [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] powinien pogłębić [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] badania."
 panum.648.t: "Mnożenie"
 panum.648.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] opublikował zdumiewające dane dotyczące rozprzestrzeniania się i zakaźności odry."
 panum.648.f: "„Odra jest niezwykle zaraźliwa i szacuje się, że 90% osób nieuodpornionych, które miały kontakt z zakaźną osobą, zachoruje. Modele matematyczne szacują podstawową liczbę reprodukcji na 12–18; jest to średnia liczba wtórnych zakażeń, które następują po pojedynczym wprowadzeniu choroby do podatnej populacji. Jest ona niezwykle zakaźna: dziewięć na dziesięć osób, które nie są odporne i dzielą przestrzeń życiową z zakażoną osobą, zostanie zakażonych.”\n\nRaport doktora [ROOT.Var('panum_physician_var').GetCharacter.GetFullName] dla Wydziału Lekarskiego."
 panum.648.g: "To, co wcześniej było jedynie dostrzegane intuicyjnie, zostało teraz udowodnione przez naukę."
 panum.649.t: "Zakażenie bez objawów"
 panum.649.d: "Po kilku obserwacjach na miejscu doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] doszedł do rozsądnego wniosku, że odra jest również przenoszona przez pacjentów bezobjawowych, jeszcze zanim pojawią się u nich zewnętrzne oznaki choroby."
 panum.649.f: "„Wysoka zachorowalność na odrę jest dobrze znanym zjawiskiem, a ryzyko zakażenia znane jest od czasów starożytnych. Dużym problemem jest to, że najwyraźniej również osoby zdrowe przenoszą chorobę, nawet jeśli nie wydaje się jeszcze, aby się rozwinęła. Podważa to wiele założeń, które wcześniej uznawano za prawdziwe. Zakaźność — jak wykazało kilka obserwacji w [SCOPE.sState('panum_disease_state').GetName] — rozpoczyna się 4 dni przed pojawieniem się wysypki i zazwyczaj trwa do 4 dni po jej wystąpieniu. Wydaje się, że najwyższa zakaźność występuje tuż przed pojawieniem się wysypki.”\n\nRaport doktora [ROOT.Var('panum_physician_var').GetCharacter.GetFullName] dla Wydziału Lekarskiego."
 panum.649.g: "Dlatego uzasadnione są dokładniejsze badania."
 panum.650.t: "Dezynfekcja koszar"
 panum.650.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] odwiedził koszary w [SCOPE.sState('panum_disease_state').GetName], które wdrożyły wzorcowe środki mające zapobiegać rozprzestrzenianiu się odry wśród młodych mężczyzn."
 panum.650.f: "„Niektóre z tych środków obejmowały dłuższą i bardziej rygorystyczną izolację przybywających rekrutów niż wcześniej; kontrolę mającą zapobiegać gromadzeniu się ludzi w koszarach, stołówkach, teatrach i innych miejscach; naprzemienne ustawienie łóżek w sąsiednich pryczach od strony głowy do stóp; ciągłe mokre mycie i dezynfekcję podłóg, ścian, stołów oraz klamek. Cały personel nosił fartuchy i maski z gazy, zmieniał je oraz mył ręce wodą z mydłem lub środkami dezynfekującymi po kontakcie z pacjentami, co wcześniej było rzadko stosowaną praktyką. W niektórych oddziałach wymagano od personelu noszenia gumowych rękawic. Pacjentów umieszczano w izolacji w osobnych kabinach, zawieszając prześcieradła na drutach rozciągniętych wokół łóżka, oraz wymagano od nich noszenia masek. Prześcieradła oddzielające kabiny były czasami okresowo spryskiwane środkami dezynfekującymi. Pacjenci w maskach mogli korzystać z toalet tylko pojedynczo, pod nadzorem personelu.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], [TimeKeeper.GetCurrentDate.Format('y')]"
 panum.650.g: "Nowoczesne metody zwalczania odry."
 panum.651.t: "Nieudane zaszczepienie"
 panum.651.d: "Próba uodpornienia przeciwko odrze przez doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] za pomocą procedury podobnej do wariolacji ospy prawdziwej okazała się całkowitą porażką."
 panum.651.f: "W 1757 roku szkocki lekarz Francis Home odkrył, że odrę wywołuje patogen: przeniósł chorobę na zdrowe osoby za pomocą krwi zakażonych pacjentów i wykazał, że jest ona powodowana przez czynnik zakaźny. Przebadał grupę 12 dzieci, z których u 10 po okresie inkubacji trwającym 6–7 dni wystąpiła charakterystyczna umiarkowana gorączkowa wysypka, a dwoje pozostało niezakażonych. Podejście to szybko zarzucono ze względu na trudności techniczne, szczególnie z uzyskaniem materiału odrowego w odpowiednim czasie do przeprowadzenia zaszczepienia choroby."
 panum.651.g: "Strata czasu."
 panum.652.t: "Płukanie gardła"
 panum.652.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] wypróbował kilka środków do płukania gardła, które od lat były zachwalane przez innych lekarzy jako lekarstwo na odrę. Wszystkie okazały się porażką."
 panum.652.f: "„Po ostatnim eksperymencie pozostał mi nie tylko gorzki posmak. Z jednej strony dlatego, że nawet olej wężowy przynosi lepsze efekty. Z drugiej strony dlatego, że tolerujemy w naszym cechu lekarskim zbyt wielu sprzedawców cudownych specyfików i szarlatanów, których pilnie należy wyeliminować.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], [TimeKeeper.GetCurrentDate.Format('y')]"
 panum.652.g: "Co masz na myśli, że olej wężowy jest bezużyteczny?"
 panum.653.t: "Spray dezynfekujący"
 panum.653.d: "W jednych z koszar żołnierze cierpiący z powodu wybuchu epidemii odry zaczęli ostatnio spożywać środek dezynfekujący. Doktor uważa to za głupie przedsięwzięcie i musiał poświęcić wiele czasu na przekonywanie ich."
 panum.653.f: "„Naprawdę powinniśmy umieszczać na etykietach produktów chemicznych i medycznych małe obrazki, które pokazywałyby nawet największemu głupcowi, czego zdecydowanie NIE należy robić z płynem, sprayem lub inną substancją.”\n\nZ listu doktora [ROOT.Var('panum_physician_var').GetCharacter.GetFullName] do doktor Angeliki Hasenbein"
 panum.653.g: "To cenny czas, który tracimy na próby znalezienia leczenia!"
 panum.661.t: "Bierzcie witaminy!"
 panum.661.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] odkrył, że przyjmowanie witamin podczas zachorowania na odrę pomaga w łagodzeniu nieprzyjemnych skutków ubocznych."
 panum.661.f: "„Działanie witamin jest dobrze znane, ale w przypadku odry ich wpływ mnie zaskoczył. Dzieci z niedoborem witaminy A są narażone na ciężki przebieg choroby, a nawet ślepotę. Suplementy witaminy A mogą wzmocnić ogólny układ odpornościowy, choć nie mogą wyleczyć choroby.”\n\nRaport doktora [ROOT.Var('panum_physician_var').GetCharacter.GetFullName] dla Wydziału Lekarskiego."
 panum.661.g: "Bardzo dobrze."
 panum.900.t: "Epidemia błonicy"
 panum.900.d: "W jednym z naszych stanów wybuchła epidemia: #YELLOW błonica#! pustoszy [SCOPE.sState('panum_disease_state').GetName]!"
 panum.900.f: "Błonica jest ostrą chorobą zakaźną, która występuje głównie u dzieci i jest wywoływana przez zakażenie górnych dróg oddechowych (błonica gardłowa). Pierre Fidèle Bretonneau wprowadził termin błonica do użytku medycznego w 1826 roku jako „diphterite” („dyfteryt”). Słowo to odnosi się do nalotu na gardle, ciemnych rzekomych błon (skórzastych brązowych osadów w krtani i tchawicy) złożonych z martwej błony śluzowej i składników krwi. Błonica jest znana od czasów starożytnych; Hipokrates opisał już tę chorobę. Błonica kończy się śmiercią w 5–10% przypadków. U dzieci poniżej piątego roku życia oraz dorosłych powyżej 40. roku życia śmiertelność może wynosić nawet 20%."
 panum.900.g: "Mnie też ściska się gardło."
 panum.920.t: "Koniec epidemii błonicy"
 panum.920.d: "Ciężka epidemia błonicy, która trzymała nasz kraj w uścisku, dobiegła końca. Lekarze i władze ogłaszają koniec zagrożenia, dzieci odważają się ponownie wyjść na ulice, a starsi ludzie odczuwają ulgę."
 panum.920.f: "„W wilgotnej, zimnej porze roku w Kingston, śródlądowym mieście w New Hampshire, położonym na niskiej równinie, pojawiła się wśród dzieci choroba powszechnie nazywana „dyfterytem gardła”, niezwykle złośliwa i zdecydowanie najbardziej śmiertelna ze wszystkich dotychczas znanych w tym kraju.” — Noah Webster"
