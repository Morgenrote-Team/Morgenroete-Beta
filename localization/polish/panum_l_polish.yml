 je_panum_functionalism: "Szkoła psychologiczna funkcjonalizmu"
 je_panum_functionalism_reason: "Psychologia funkcjonalna, zwana również funkcjonalizmem, to nurt psychologiczny wywodzący się bezpośrednio z myśli darwinowskiej, który koncentruje się na użyteczności i celowości zachowań kształtowanych przez tysiące lat istnienia człowieka. Edward L. Thorndike, znany przede wszystkim z eksperymentów nad uczeniem się metodą prób i błędów, stał się czołowym przedstawicielem tego niezbyt ściśle zdefiniowanego nurtu. Funkcjonalizm odrzuca zasadę introspekcji, która skupia się na badaniu wewnętrznych mechanizmów ludzkiego myślenia, zamiast na zrozumieniu procesów biologicznych leżących u podstaw ludzkiej świadomości.\n\nKażdy kraj może ustanowić tylko #R jedną#! szkołę psychologiczną."
 je_panum_psychoanalysis: "Szkoła psychologiczna psychoanalizy"
 je_panum_psychoanalysis_reason: "Psychoanaliza to teoria psychologiczna, teoria kultury, forma leczenia psychoterapeutycznego oraz metoda samopoznania, której podstawy stworzył około 1890 roku wiedeński lekarz Zygmunt Freud. Termin psychoanaliza odnosi się zarówno do modelu opisu i wyjaśniania ludzkiej psychiki, opartego na teoriach Freuda dotyczących psychodynamiki nieświadomości, jak i do psychoterapii analitycznej oraz metodologii psychoanalitycznej, zajmującej się również badaniem zjawisk kulturowych. We wszystkich trzech tych obszarach psychoanaliza jest do dziś rozwijana i modyfikowana przez klinicystów oraz badaczy.\n\nKażdy kraj może ustanowić tylko #R jedną#! szkołę psychologiczną."
 je_panum_analytical_psychology: "Szkoła psychologii analitycznej"
 je_panum_analytical_psychology_reason: "Psychologia analityczna to szkoła psychologiczna oparta na psychoanalizie, założona w 1913 roku przez szwajcarskiego psychiatrę Carla Gustava Junga. Podobnie jak psychoanaliza zajmuje się nieświadomymi obszarami ludzkiej psychiki, wychodząc z założenia, że nieświadomość wywiera znacznie większy wpływ na człowieka niż świadome postrzeganie. Jung i jego następcy kładli szczególny nacisk na możliwości symbolicznego wyrażania treści nieświadomości i starali się wykorzystywać je w psychoterapii.\n\nKażdy kraj może ustanowić tylko #R jedną#! szkołę psychologiczną."
 je_panum_behaviorism: "Szkoła psychologiczna behawioryzmu"
 je_panum_behaviorism_reason: "Behawioryzm to nurt naukowy zajmujący się badaniem i wyjaśnianiem zachowań ludzi i zwierząt za pomocą metod naukowych, a więc bez odwoływania się do introspekcji czy empatii. Behawioryzm został zapoczątkowany przez Johna B. Watsona na początku XX wieku, po wcześniejszych istotnych pracach Edwarda Lee Thorndike'a. Ważną rolę w jego rozwoju odegrał również Iwan Pietrowicz Pawłow, prowadząc pionierskie eksperymenty nad warunkowaniem klasycznym zachowań. W Stanach Zjednoczonych zwolennicy behawioryzmu przez dziesięciolecia byli najbardziej wpływowymi badaczami zachowania na uniwersytetach i zagorzałymi przeciwnikami rozwijających się w tym samym czasie szkół psychoanalitycznych.\n\nKażdy kraj może ustanowić tylko #R jedną#! szkołę psychologiczną."
