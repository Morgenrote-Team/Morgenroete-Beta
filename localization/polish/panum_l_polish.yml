 panum.2111.t: "Anatomia [ROOT.Var('panum_physician_var').GetCharacter.GetLastNameNoFormatting]"
 panum.2111.d: "W [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] walce z lokalnymi władzami o rozszerzenie opieki medycznej doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] odkrył, jak słabe jest szkolenie młodych chirurgów. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] napisał więc dzieło wzorcowe, aby zaradzić temu problemowi."
 panum.2111.f: "Anatomia ciała ludzkiego Henry'ego Graya, zwykle nazywana po prostu „Anatomią Graya”, to książka poświęcona anatomii człowieka. Jest uważana za klasyczne dzieło w tej dziedzinie, szczególnie w krajach anglojęzycznych. Pierwsze wydanie ukazało się w 1858 roku w Wielkiej Brytanii, a rok później w USA pod nazwą „Gray's Anatomy: Descriptive and Surgical”."
 panum.2111.g: "Każdy student powinien przeczytać tę książkę podczas swojego szkolenia."
 panum.2111.h: "Praktyczne zastosowanie jest ważniejsze niż nauczanie."
 panum.2112.t: "Diagram przyczyn zgonów"
 panum.2112.d: "Podczas wizyt w szpitalach wojskowych doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zauważył, jak niewiele materiałów statystycznych wykorzystywano do edukowania młodych lekarzy na temat zagrożenia chorobami zakaźnymi na polu bitwy. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] stworzył więc dużą liczbę znaczących diagramów."
 panum.2112.f: "Z powodu choroby, którą zaraziła się podczas wojny krymskiej, Florence Nightingale nie mogła sama zobaczyć, jak wygląda sytuacja w koszarach, szpitalu lub przytułku dla ubogich. Skupiła się więc na zbieraniu danych, ich przygotowywaniu i analizowaniu, a następnie wyciąganiu z nich wniosków. Ankiety były ważnym narzędziem w jej pracy, a także korzystała z istniejących danych. Między innymi wykazała poważne problemy z wojskową opieką zdrowotną. W swoim raporcie dla brytyjskiego rządu Nightingale wyraziła się na ten temat jasno. Jeśli co roku umierało 11 na 1000 cywilów, ale wśród żołnierzy piechoty liniowej, artylerii i gwardii stacjonujących w Anglii umierało odpowiednio 17, 19 i 20 na 1000, byłoby to równie karygodne, jak gdyby co roku prowadzono 1100 ludzi na równinę Salisbury i tam ich rozstrzeliwano. Florence Nightingale jest uważana za jedną z pionierek graficznego przedstawiania takich danych."
 panum.2112.g: "Te statystyki powinny być dokładnie studiowane przez medyków na polu bitwy."
 panum.2112.h: "Praktyczne zastosowanie jest ważniejsze niż nauczanie."
 panum.2113.t: "Omnis cellula e cellula"
 panum.2113.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] rozszerzył wcześniej znaną teorię komórkową o zasadę, że każda komórka powstaje z innej komórki oraz że choroby również powstają z chorych komórek. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] szczegółowo opisał tę tezę w swoim dziele dotyczącym patologii komórkowej, które jest wykorzystywane jako podręcznik w nowych klinikach i szpitalach."
 panum.2113.f: "Patologia komórkowa to teoria chorób, według której choroby opierają się na zaburzeniach komórek organizmu lub ich funkcji. Została opracowana w latach 50. XIX wieku przez Rudolfa Virchowa, który również stworzył termin „patologia komórkowa” w 1855 roku. Jego dzieło o tej samej nazwie stało się podręcznikiem wzorcowym. Jako koncepcja choroby oparta na teorii komórkowej zastąpiła obowiązującą od czasów starożytnych patologię humoralną i tym samym odpowiada za całkowitą rewolucję w sposobie postrzegania rozwoju chorób i zachorowań w ogóle. Wraz z farmakologią eksperymentalną, fizjologią i mikrobiologią tworzy jednolitą podstawę medycyny klinicznej oraz fundament medycyny opartej na nauce."
 panum.2113.g: "Wiedza o chorych komórkach powinna być standardem na uniwersytetach."
 panum.2113.h: "To niezwykle ważne odkrycie."
 panum.2114.t: "Urodzony przestępca"
 panum.2114.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] intensywnie badał psychikę przestępców oraz genetykę człowieka i odkrył, że elementy przestępcze można rozpoznać na podstawie ich fizjonomii. [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis|U] liczne kontakty z chorymi pacjentami, szaleńcami i leniwymi urzędnikami podczas prób reformowania systemu medycznego były dla [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim] nieustanną inspiracją."
 panum.2114.f: "Zainspirowany teorią ewolucji doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] przeprowadził badania setek osób w zakładach karnych i szpitalach psychiatrycznych oraz odkrył, że wśród przestępców powszechny jest typ atawistyczny. Pewne formy przestępczości można więc rozpoznać po typach twarzy i kształtach czaszki. Przestępca nie staje się przestępcą z własnej woli, lecz z powodu swoich genetycznych predyspozycji ma problem, któremu „nie może zaradzić”. Przestępca reprezentuje odrębny typ antropologiczny, homo deliquens. Jest ewolucyjnie zacofanym, wcześniejszym i bardziej prymitywnym typem człowieka, który wydaje się niemoralny i kierowany instynktami."
 panum.2114.g: "Czyli jesteś przestępcą od urodzenia."
 panum.2121.t: "Zamiłowanie doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] do czaszek"
 panum.2121.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] kontynuował swoją tezę z zakresu kryminologii antropologicznej i dlatego zmierzył tysiące czaszek w całym kraju. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] przechowuje nawet niektóre z nich w domu."
 panum.2121.f: "„Kryminologia jest poważną nauką empiryczną, która zbyt długo pozostawała przesiąknięta filozofią. Moja rewolucja polega na wyposażeniu jej w ten sam empiryzm, którym charakteryzuje się każda nowoczesna nauka tego stulecia. Biologia i matematyka są niezawodnymi dziedzinami, a psychiatria i kryminologia mogą się od nich uczyć. Jeśli zmierzysz i porównasz każdą pojedynczą czaszkę — a zrobiłem to w przypadku tysięcy przestępców, osób chorych psychicznie i straconych — możesz zebrać dane statystyczne, które wciąż pokazują ten sam rezultat. Na tej podstawie można wyprowadzić niemal doskonałe wartości pozwalające określić asymetrię twarzy przestępcy. Te precyzyjne pomiary są znacznie bezpieczniejsze niż całkowicie bezpodstawne założenia dotyczące ludzkiego umysłu: tutaj mamy liczby, fakty, krótko mówiąc badania empiryczne, a tam bezpodstawne rozważania.”\n\nZ „Człowiek zbrodniarz” autorstwa [ROOT.Var('panum_physician_var').GetCharacter.GetFullName]"
 panum.2121.g: "A... urocze hobby."
 panum.2122.t: "Determinizm biologiczny"
 panum.2122.d: "Po kolejnych miesiącach swoich badań doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] pogłębił swoje wcześniejsze tezy dotyczące „urodzonego przestępcy” i opublikował kolejne szokujące odkrycia."
 panum.2122.f: "„Przestępca jest degeneratem. Podczas gdy człowiek ewoluuje, przestępca reprezentuje regresję, formę upadku człowieka. Jest „współczesnym dzikusem”, pozwala nam spojrzeć wstecz na człowieka z epoki kamienia, który był mniej subtelny, mniej wrażliwy na ból i mniej empatyczny. Przestępca nie dostrzega cierpienia drugiego człowieka, ponieważ posiada jedynie ograniczoną zdolność do współczucia. Ponieważ przestępca działa z powodu swojej skłonności przestępczej, można założyć, że ta skłonność jest dziedziczna. Można by więc uznać, że jeśli ludzie nie popełniają swoich czynów z własnej woli, lecz raczej z powodu determinizmu biologicznego, powinno to być czynnikiem łagodzącym przy wymierzaniu kary. Jednak jest odwrotnie, ponieważ przestępcy nie można odstraszyć karą, nie można go ani przywrócić społeczeństwu, ani przewidzieć jego zachowania. Najważniejsza jest ochrona społeczeństwa. Dlatego lepiej rozważyć dożywotnie więzienie lub karę śmierci. Nie możemy pozwolić, aby ci niebezpieczni przestępcy krzywdzili niewinnych ludzi.”\n\nZ „Człowieka zbrodniarza” autorstwa [ROOT.Var('panum_physician_var').GetCharacter.GetFullName]"
 panum.2122.g: "Czy mamy inny wybór niż zaakceptować to jako dominującą teorię?"
 panum.2123.t: "Niebezpieczny przestępca podlegający"
 panum.2123.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] dokładnie zbadał fizjonomię [SCOPE.sCharacter('panum_victim_scope').GetFullName], a w szczególności kształt [SCOPE.sCharacter('panum_victim_scope').GetHerHis] czaszki, i doszedł do wniosku, że [SCOPE.sCharacter('panum_victim_scope').GetSheHe] jest niezwykle niebezpieczną osobą o przestępczej energii, którą należy natychmiast usunąć ze wszystkich służb — dla ochrony społeczeństwa!"
 panum.2123.f: "„Złodzieje mają zazwyczaj bardzo ruchliwe rysy twarzy i dłonie; ich oczy są małe, niespokojne, często mrużące się; brwi ściągnięte i zrośnięte; nos jest krzywy lub tępy, broda rzadka, włosy rzadko gęste, czoło prawie zawsze małe i cofnięte, a ucho często odstaje jak uchwyt...\n\nMordercy mają szkliste, lodowate, nieruchome spojrzenie; ich oczy są czasem przekrwione. Nos jest duży, często orli lub jastrzębi; szczęki są o mocnej budowie, uszy długie, policzki szerokie, włosy kręcone, gęste i ciemne, broda często rzadka; usta cienkie, kły duże... Ogólnie u urodzonych przestępców uszy odstają jak uchwyty, włosy są gęste, broda rzadka, zatoki czołowe wysklepione, szczęka ogromna, podbródek kwadratowy lub wystający, a kości policzkowe szerokie.” — Cesare Lombroso"
 panum.2123.g: "Ta osoba rzeczywiście ma twarz przestępcy."
 panum.2123.h: "Doktor posuwa się za daleko ze [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] oskarżeniami!"
 panum.2124.t: "Kolejny miłośnik czaszek!"
 panum.2124.d: "Dzisiaj doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] przedstawił obiecującego naukowca, który kocha czaszki niemal tak samo jak [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe]. Jednak doktor [SCOPE.sCharacter('andersson_new_anthropologist_scope').GetLastName] bardziej interesuje się czaszkami zmarłych ludzi."
 panum.2124.f: "„[SCOPE.sCharacter('andersson_new_anthropologist_scope').GetFullName] jest wybitnym naukowcem, który rozumie znaczenie badania czaszek w celu wyciągania wniosków na temat osoby, do której należała czaszka. Niestety, [SCOPE.sCharacter('andersson_new_anthropologist_scope').GetSheHe] zajmuje się wyłącznie czaszkami osób, które zmarły niezliczoną ilość lat temu. Niewiarygodne! Nie można mieć pewności, czy rzeczywiście byli przestępcami. Jak miałoby to pomóc?”"
 panum.2124.g: "To... niespodziewanie przyjemna niespodzianka."
 panum.4003.t: "Koniec ospy prawdziwej"
 panum.4003.d: "Wbrew wszelkim przeciwnościom nasza kampania przeciwko ospie prawdziwej zakończyła się niewyobrażalnym sukcesem — choroba została wyeliminowana."
 panum.4003.f: "Dla wielu jest to dzień, który zaczyna się jak każdy inny, nieświadomi tego, jak wspaniały poranek naprawdę nastał. Dla tych, którzy wiedzą, jest to zwieńczenie całych pokoleń pracy, spełnienie marzenia, które jeszcze niedawno wydawało się niemal niemożliwe. Wielu nie wierzyło, że uda się tego dokonać za ich życia, że będzie to jakieś legendarne dzieło końca XX wieku, a nawet XXI wieku, a jednak tutaj, teraz, dokonano tego w roku [TimeKeeper.GetCurrentDate.Format('y')]. Ostatni potwierdzony przypadek zakończył się bez ani jednego nowego zakażenia, zamykając tę chorobę w kartach historii. Po raz pierwszy w dziejach zagrożenie tą chorobą nie spoczywa już nad żadną osobą.\n\nA to oznacza tylko jedno: ospa prawdziwa już nie istnieje.\n\nWielu uważało, że będzie to niemożliwe... ale nawet ci, którzy nie są tego świadomi, nie mogą nie usłyszeć świętowania na uniwersytetach i w szpitalach, nie zobaczyć toastów lekarzy i naukowców oraz nie wiedzieć, że jest to dobry dzień."
 panum.4003.g: "Człowiek stworzył dziś własny cud."
 panum.2211.t: "Badania nad chorobami"
 panum.2211.d: "Podczas [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] badań medycznych doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zdał sobie sprawę, że [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] chce szczegółowo zbadać chorobę, o której w naszym kraju opublikowano bardzo niewiele informacji, ale która stała się powszechną chorobą w niektórych regionach."
 panum.2211.f: "Oprócz wielkich chorób epidemicznych istnieje wiele codziennych i powszechnych chorób, a także od dawna znanych plag ludzkości, których przyczyny i metody leczenia wciąż pozostają nieznane. Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zastanawia się, czy nie powinien skupić się na konkretnej chorobie."
 panum.2211.g: "Zbadaj chorobę sortowników wełny."
 panum.2211.h: "Zbadaj chorobę wola."
 panum.2211.i: "Zbadaj chorobę kamieni nerkowych."
 panum.2211.j: "Zbadaj pelagrę."
 panum.2211.k: "Zbadaj krzywicę."
 panum.2211.l: "Zbadaj kiłę."
 panum.2211.m: "Zbadaj tężec."
 panum.2211.z: "Doktor powinien wykorzystać ten czas, aby bardziej skupić się na szkoleniu."
 panum_disease_investigation_project_progress_bar: "Badanie choroby"
 panum_disease_investigation_project_progress_bar_desc: "Postęp badania choroby: #v `[JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|1%]`#! (`[JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]`/60)"
 panum_disease_investigation_project_progress_physician_positive_character_trait_tt: "#default_text [concept_panum_physician] ma cechę #V `$persistent$`#!, #V `$meticulous$`#! lub #V `$innovative$`#! [concept_character_trait].#!"
 panum_disease_investigation_progress_bar_at_full_tt: "Pasek badania choroby osiągnął #variable 100%#!"
 je_panum_disease_investigation: "Badanie choroby"
 je_panum_disease_investigation_reason: "Czasami zdarza się, że lekarz podczas swoich zwykłych badań medycznych poświęca się badaniu konkretnej choroby. Nie jest to choroba epidemiczna, lecz raczej codzienne dolegliwości, choroby wieku dziecięcego lub powszechne schorzenia. Przykładami są krzywica, kamienie nerkowe lub kiła.\n\nW przeciwieństwie do innych przypadków lekarz prowadzi te badania dodatkowo, co oznacza, że nie jest zajęty i pozostaje dostępny do dalszych działań. Jeśli lekarz umrze, projekt nie zostaje utracony, lecz zostaje wstrzymany do czasu, aż inny lekarz go przejmie."
 panum_woolsorters_disease_modifier: "Choroba sortowników wełny"
 panum_litholapaxy_modifier: "Litolapaksja"
 panum_salvarsan_modifier: "Salwarsan"
 panum_tetanus_antitoxin_modifier: "Antytoksyna przeciwtężcowa"
 goods_output_meat_mult: "Produkcja budynku @meat! mięsa"
 goods_output_meat_mult_desc: "Premia lub kara do ilości produkowanego przez budynki @meat! mięsa"
 panum.2221.t: "Choroba sortowników wełny"
 panum.2221.d: "Podczas badania tak zwanej „choroby sortowników wełny” doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] odkrył, że była to w rzeczywistości wąglik."
 panum.2221.f: "Wąglik u ludzi występował przede wszystkim jako choroba zawodowa pracowników garbarni oraz osób zajmujących się obróbką futer, szczeciny i sierści, ale także pracowników portowych i transportowych mających kontakt z tymi materiałami, a także osób zajmujących się skórowaniem zwierząt. Szczyt zachorowań przypadał na okresy kryzysu w przemyśle skórzanym, gdy importowano coraz większą liczbę tanich skór zwierzęcych z regionów, w których kontrola weterynaryjna uboju była niewielka lub nie istniała. Przez długi czas tajemnicze pochodzenie choroby pozostawało nieznane. Uważano, że była to forma zatrucia, a ludzie nazywali ją „chorobą sortowników wełny”. Wraz z rozwojem mikrobiologii i wdrożeniem teorii zarazków ustalono rzeczywiste powiązania między niezwykle szkodliwą ekonomicznie chorobą zwierząt a śmiertelną chorobą ludzi, co doprowadziło do wprowadzenia nowych zasad i regulacji mających zapewnić ochronę pracowników."
 panum.2221.g: "Wprowadź rygorystyczne środki ochronne."
 panum.2222.t: "Choroba wola"
 panum.2222.d: "Po zbadaniu kilku osób z odległych górskich dolin, u których występowało ogromne wole, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] przeprowadził eksperyment z leczeniem za pomocą jodu. Po kilku próbach terapia okazała się skuteczna."
 panum.2222.f: "W alpejskich regionach Styrii, Tyrolu i Szwajcarii, ale także w innych obszarach górskich oraz angielskich Midlands, wole były codzienną dolegliwością. Już wcześnie podejrzewano, że powstawanie wola ma związek z wodą na danym obszarze. Paracelsus podejrzewał niedobór pewnych minerałów i zalecał picie wody zawierającej ołów. W starożytnych Chinach lekarze zalecali spożywanie alg i gąbek. Wraz z lepszym zrozumieniem funkcji tarczycy oraz znaczenia jodu rozpoczęły się w końcu pierwsze próby leczenia. Od 1918 roku szwajcarski lekarz Otto Bayard wprowadził sól jodowaną poprzez odpowiednio dawkowane dodawanie jodku potasu do soli kuchennej w społecznościach na obszarze swojej praktyki lekarskiej w Nikolaital i wykazał, że dzięki temu zaburzenia rozwojowe, powiększenie tarczycy oraz powstawanie wola i guzków można skutecznie leczyć bez niepożądanych skutków i uszkodzeń."
 panum.2222.g: "Czyli jest to choroba związana z dietą!"
 panum.2223.t: "Kamica nerkowa"
 panum.2223.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] opracował metodę pozwalającą na skuteczne operowanie pacjentów z kamieniami nerkowymi."
 panum.2223.f: "Kamienie nerkowe są zjawiskiem znanym w całej historii ludzkości; cierpiał na nie nawet Napoleon. Chociaż od czasów renesansu opracowano kilka metod usuwania kamieni nerkowych, operacja nadal pozostawała niebezpieczna. Amerykański chirurg Henry Jacob Bigelow dokonał przełomu: wprowadził technikę medyczną zwaną litotrypsją. W 1878 roku opublikował „Lithotrity by a Single Operation”, w którym opisał swoją technikę „kruszenia i usuwania kamienia z pęcherza podczas jednego zabiegu”. Wcześniej chirurdzy rozbijali kamień pęcherzowy, a następnie poświęcali tylko kilka minut na usunięcie jego fragmentów. Dzięki tej nowej metodzie śmiertelność spadła z około 24% do 2,4%."
 panum.2223.g: "Aż mnie ciarki przechodzą na samą myśl o tym."
 panum.2224.t: "Pelagra"
 panum.2224.d: "Jak doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] odkrył po latach badań, pelagra jest chorobą spowodowaną niedoborem kwasu nikotynowego."
 panum.2224.f: "Po odkryciu Ameryki przez Krzysztofa Kolumba kukurydza była jedną z pierwszych roślin sprowadzonych do Europy, gdzie szybko się rozpowszechniła ze względu na wysokie plony. Wkrótce na obszarach o wysokim spożyciu kukurydzy pojawiła się dziwna choroba zwana pelagrą („szorstką skórą”) od jej głównego objawu. Związek między pelagrą a dużym spożyciem kukurydzy (np. w postaci polenty) po raz pierwszy podejrzewano w XVIII wieku. Ówczesne wyjaśnienia obejmowały spleśniałą lub zatrutą kukurydzę, zakażenie albo dziedziczność. Joseph Goldberger wraz ze współpracownikami udowodnił następnie na początku XX wieku, że zarówno pelagra u ludzi, jak i choroba czarnego języka u psów wynikają z niedożywienia, co Conrad Elvehjem zdołał przypisać niedoborowi kwasu nikotynowego. Odkrycie, że pelagrę można leczyć drożdżami browarniczymi, doprowadziło do nagłego zmniejszenia liczby pensjonariuszy szpitali psychiatrycznych na dotkniętych obszarach."
 panum.2224.g: "Jedynie skutek niezrównoważonej diety?"
 panum.2225.t: "Krzywica"
 panum.2225.d: "Po wielu latach badania pacjentów z krzywicą doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] dochodzi do wniosku, że choroba kości ma związek z niedoborem składników odżywczych — i zaleca olej z wątroby dorsza oraz światło słoneczne jako środki zapobiegawcze."
 panum.2225.f: "Chociaż z biegiem czasu powstało wiele naukowych opracowań dotyczących krzywicy, jej przyczyny przez długi czas pozostawały nieznane. Czołowi patolodzy XIX wieku proponowali różnorodne przyczyny krzywicy, w tym kiłę wrodzoną oraz gruźlicę u ojca. Prawdziwe współczesne zrozumienie fizjologicznych podstaw krzywicy rozpoczęło się dopiero na początku XX wieku. W 1919 roku Edward Mellanby odkrył i opisał „czwartą witaminę”, stwierdzając: „Krzywica jest chorobą niedoborową, która rozwija się w wyniku braku pewnego dodatkowego składnika lub składników odżywczych. Wydaje się zatem prawdopodobne, że przyczyną krzywicy jest niedostateczne dostarczanie czynnika przeciwkrzywiczego, którym jest albo rozpuszczalny w tłuszczach czynnik A, albo substancja o podobnym rozmieszczeniu”."
 panum.2225.g: "Czy mówimy o witaminie D?"
 panum.2226.t: "Kiła"
 panum.2226.d: "Kiła, starożytna plaga ludzkości, wydaje się wkrótce zostać ujarzmiona przez naukę — doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] twierdzi, że wynalazł cudowne lekarstwo wykorzystujące najnowocześniejsze metody medyczne."
 panum.2226.f: "Do początku XX wieku kiłę leczono głównie toksyczną rtęcią, którą nanoszono na duże obszary ciała pacjenta, co poza innymi niepożądanymi skutkami zazwyczaj prowadziło do całkowitej utraty owłosienia ciała i wszystkich zębów oraz szybkiego wyniszczenia wszystkich funkcji organizmu. Rtęć była już kilka wieków wcześniej stosowana jako mniej lub bardziej skuteczny środek leczniczy przeciwko trądowi i różnym innym chorobom skóry. Próby zastosowania preparatów arsenu, takich jak atoksyl i arsacetyna, a także preparatu 418 (arsenofenylglicyna), który odnosił sukcesy jedynie w eksperymentach na zwierzętach i został opracowany oraz przetestowany przez Paula Uhlenhutha i Paula Ehrlicha w latach 1907/1908, zakończyły się niepowodzeniem, głównie ze względu na poważne skutki uboczne. W 1909 roku Sahachiro Hata i Paul Ehrlich opracowali organiczny związek arsenu — arsfenaminę (Salwarsan), która jako pierwsza podjęła próbę ukierunkowanego leczenia chemioterapeutycznego kiły."
 panum.2226.g: "Salvavw... co?"
 panum.2227.t: "Tężec"
 panum.2227.d: "Po kilku próbach doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] ogłosił dziś, że odkrył antytoksynę przeciw tężcowi."
 panum.2227.f: "Tężec był dobrze znany starożytnym cywilizacjom, które dostrzegały związek między ranami a śmiertelnymi skurczami mięśni. W 1884 roku Arthur Nicolaier wyizolował przypominającą strychninę toksynę tężca z wolno żyjących, beztlenowych bakterii glebowych. Wykrył patogen tężca w glebie, wstrzykując ziemię ogrodową zwierzętom doświadczalnym. Etiologia choroby została dalej wyjaśniona w 1884 roku przez Antonia Carle'a i Giorgia Rattone'a, dwóch patologów z Uniwersytetu Turyńskiego, którzy po raz pierwszy wykazali możliwość przenoszenia tężca. W 1891 roku C. tetani został wyizolowany z ludzkiej ofiary przez Kitasato Shibasaburō, który później wykazał, że organizm ten może wywoływać chorobę po wstrzyknięciu zwierzętom oraz że toksyna może zostać zneutralizowana przez swoiste przeciwciała. W 1890 roku Kitasato i Emil von Behring ostatecznie zdołali uzyskać swoistą antytoksynę przeciwtężcową, która mogła zapewnić odporność na tężec u zwierząt. Dzięki produkcji tej antytoksyny Behring położył fundamenty pod „terapię surowiczą” (podobnie jak dzięki odkryciu antytoksyny błoniczej, również w 1890 roku)."
 panum.2227.g: "Kto by pomyślał, że ziemia ogrodowa może być tak niebezpieczna?"
 country_panum_kidney_stone_treatment_success_chance_mult: "Szansa powodzenia leczenia kamieni nerkowych"
 country_panum_syphilis_treatment_success_chance_mult: "Szansa powodzenia leczenia kiły"
 panum.922.t: "Krup"
 panum.922.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] odkrył, że wielu lekarzy zazwyczaj nie potrafi odróżnić stosunkowo nieszkodliwego krupu od niebezpiecznej błonicy i opisał różnice między nimi w artykule."
 panum.922.f: "Kiedy urodzony w Prusach lekarz Abraham Jacobi zauważył na konferencji medycznej w 1860 roku, że w Nowym Jorku odnotowano około 122 przypadki błonicy, jego koledzy byli zdumieni: w tym samym okresie nie zdiagnozowali ani jednego przypadku błonicy. Brak wiedzy w dziedzinie chorób wieku dziecięcego był jednym z powodów założenia pierwszych szpitali dziecięcych w USA, w których błonica odgrywała szczególną rolę. Jacobi jest uważany za ojca amerykańskiej pediatrii."
 panum.923.t: "Skórzasta krtań"
 panum.923.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zidentyfikował jedną z głównych cech błonicy jako skórzastą rzekomą błonę, która rozprzestrzenia się do krtani i powoduje uduszenie. Ta cecha jest charakterystyczna dla tej choroby i pozwala odróżnić ją od innych."
 panum.923.f: "„Możemy ustalić rozpoznanie złośliwej anginy na cztery sposoby:\n\nPoprzez szeroko zakrojone badania nad anatomią patologiczną choroby, podczas których w ciągu kilku miesięcy przeprowadzono sześćdziesiąt sekcji zwłok;\n\npoprzez obserwacje kliniczne, dzięki którym wykazaliśmy, że angina pozostawiona sama sobie niemal zawsze prowadziła do zajęcia krtani i tym samym powodowała objawy krupu;\n\npoprzez badania chemiczne, dzięki którym wykazano zgodność składu fałszywej błony w gardle z tą znajdującą się w tchawicy;\n\npoprzez badanie prac wcześniejszych autorów.”"
 panum.940.t: "Antytoksyna przeciw błonicy"
 panum.940.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] ogłosił dziś publicznie, że eksperymenty z antytoksyną przeciw błonicy, które [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] przeprowadził, zakończyły się pełnym sukcesem."
 panum.940.f: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] wyjaśnił zdumionemu tłumowi, że [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] wykorzystał osłabioną toksynę błonicy do zakażenia koni, a następnie uzyskał z ich krwi surowicę, która była niezwykle skuteczna w zwalczaniu błonicy. Chociaż jest to wielki postęp, [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] podkreślił również, że nie należy mylić tego ze szczepionką, ponieważ nie aktywuje ona układu odpornościowego pacjenta. „Wciąż jest tutaj wiele pracy do wykonania” — powiedział [ROOT.Var('panum_physician_var').GetCharacter.GetLastName]. Jednak wszyscy rodzice, którzy obawiali się o życie swoich duszących się nocami dzieci, będą mogli od teraz spać znacznie spokojniej."
 panum.940.g: "Odcinamy błonicy dopływ powietrza, zanim ona zrobi to samo nam."
 panum.941.t: "Nadchloran żelaza"
 panum.941.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] odkrył w starszych zapiskach, że nadchloran żelaza był zalecany jako środek przeciwko błonicy. W rzeczywistości wydaje się, że rzeczywiście działa."
 panum.941.f: "„Co zaskakujące, ten alchemicznie wyglądający przepis przyniósł efekt u niektórych pacjentów. Najwyraźniej jest to jeden z nielicznych środków przeciwko błonicy.”\n\nKrótka notatka doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] dotycząca błonicy"
 panum.941.g: "Ale czy to rzeczywiście dokądś nas prowadzi?"
 panum.942.t: "Intubacja"
 panum.942.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] próbował dostarczyć pacjentowi powietrze poprzez intubację. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] odniósł niewielki sukces w walce z błonicą."
 panum.942.f: "„Proces jest skomplikowany i krytyczny, ale obecnie każda wskazówka dotycząca walki z błonicą jest dla mnie cenna.”\n\nKrótka notatka doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] dotycząca błonicy"
 panum.942.g: "Ale przecież nie może to być rozwiązanie długoterminowe?"
 panum.943.t: "Tracheotomia"
 panum.943.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] miał dość mieszane doświadczenia z tracheotomią, chociaż wszyscy koledzy po fachu [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] stosują ten zabieg chirurgiczny w leczeniu błonicy."
 panum.943.f: "„Za nic w świecie nie potrafię zrozumieć, dlaczego wszyscy ci eksperci od błonicy — a przynajmniej ci, którzy za takich się uważają — byli w stanie odnotować jakiekolwiek sukcesy. Trousseau twierdzi, że uratował życie niemal połowie swoich pacjentów z błonicą, ale z mojego zawodowego doświadczenia wynika, że jest to mniej niż jeden na dziesięciu.”\n\nKrótka notatka doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] dotycząca błonicy"
 panum.943.g: "A teraz?"
 panum.944.t: "Rtęć"
 panum.944.d: "Niestety, leczenie błonicy rtęcią zakończyło się dokładnie tak, jak przewidywał doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] — zatruciem."
 panum.944.f: "„Czy powinienem był wiedzieć lepiej? Tak! Ale literatura specjalistyczna nie pozostawia wątpliwości, że rtęć pomagała przeciwko błonicy przez całe wieki. Podobno! Od teraz znajdę inne środki, które rzekomo pomagają: na przykład azotan srebra. Albo kwas solny! Czy ktoś naprawdę zajął się tą chorobą?”\n\nKrótka notatka doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] dotycząca błonicy"
 panum.944.g: "To wszystko brzmi jeszcze groźniej niż błonica."
 panum.945.t: "Upuszczanie krwi"
 panum.945.d: "Eksperci zalecają solidne upuszczanie krwi w leczeniu błonicy. Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] wypróbował tę metodę [ROOT.Var('panum_physician_var').GetCharacter.GetHerselfHimself] w dwóch przypadkach i stwierdził, że przyniosła ona raczej odwrotny skutek od zamierzonego."
 panum.945.f: "„Dalsze osłabianie i tak już osłabionego pacjenta byłoby niczym zburzenie kolejnego filaru mostu, którego jedyny pozostały filar ledwo się trzyma. To, co dla każdego inżyniera jest oczywiste, w medycynie uchodzi za herezję.”\n\nKrótka notatka doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] dotycząca błonicy"
 panum.945.g: "Czy nie ma żadnej poprawy?"
 panum.951.t: "Rzężenie w nocy"
 panum.951.d: ""
 panum.951.f: "Słońce skryło się już za domami. [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] szedł pogrążonymi w cieniu ulicami. Kolejny dzień pełen niepowodzeń. Troje kolejnych martwych dzieci. Jak zawsze ta sama przyczyna śmierci. Nawet po ustąpieniu szczytu epidemii wciąż istniało ryzyko, że śmierć dzieci znów przemierzy ulice i zatopi swą kosę w ich gardłach. Utonięcie i uduszenie należały do najokrutniejszych sposobów umierania.\n\n[ROOT.Var('panum_physician_var').GetCharacter.GetLastName] od lat zajmował się chorobami epidemicznymi. Ale błonica była inna. Nie była zwykłą chorobą wieku dziecięcego, jak odra czy szkarlatyna, które mogły mieć łagodny przebieg. Błonica sprawiała, że dzieci rozpaczliwie łapały powietrze. Błonica dusiła je nocą niczym anioł zemsty.\n\n[ROOT.Var('panum_physician_var').GetCharacter.GetLastName] wypowiedział błonicy wojnę. Wydawała się jednak walką bez nadziei na zwycięstwo. Z każdym krokiem, jaki [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] stawiał, choroba podążała za nim i zmuszała [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim] do odwrotu. Wszystkie przekazywane z pokolenia na pokolenie metody okazywały się bezużyteczne. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] zmagał się ze śmiercią. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] zmagał się z samym diabłem.\n\nA oni sprawili, że [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim] ogarnęły [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] rozpacz i bezsilność. Tej nocy, gdy [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] wrócił do domu. Gdy z ciemności dobiegł [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim] rozpaczliwy oddech. Czekał tam bowiem pacjent, którego [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim] nie spodziewał się zastać, którego [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] nie miał na swojej liście. Błonica dotarła dalej. Aż na [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] ulicę. Aż do [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] domu.\n\nAż do łóżka [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] syna."
 panum.951.g: "Czy eksperymenty doktora...?"
 panum.952.t: "Leczenie błonicy"
 panum.952.d: ""
 panum.952.f: "Rozpaczliwa próba przełknięcia śliny. [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zdążył już przywyknąć do tego dźwięku. Zwykle przełykanie śliny przez innych ludzi było niemal niesłyszalne. Ale towarzyszyła mu ta sama męka, którą [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] słyszał już tyle razy. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] znał ten odgłos na pamięć. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] mógł położyć zimny okład na głowie [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] syna. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] mógł przemawiać do niego kojącym głosem.\n\nAle [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] nie mógł mu w żaden sposób pomóc. Tak samo jak [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] nie zdołał pomóc innym dzieciom. Tym wszystkim pozostałym, dziesiątkom zmarłych dzieci.\n\nJeśli ktokolwiek wiedział, jak niewiele warte były te wszystkie lekarstwa na błonicę, to właśnie [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim]. Rtęć, która zatruwała organizm. Azotan srebra i chlorek żelaza(III), których działanie przynosiło różne rezultaty. Tracheotomia, uważana za szczyt kunsztu chirurgicznego, która niemal zawsze kończyła się niepowodzeniem.\n\n[ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] przeprowadzał ją już tyle razy. A jednak teraz wszystko było inne. Nie chodziło już o samą chorobę. Teraz chodziło o [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim]. Ta znienawidzona epidemia mściła się na [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim]. Za to, że [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] odważył się jej przeciwstawić. Za to, że [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] chciał ją unicestwić, tak jak ona unicestwiała małe dzieci. Teraz brała odwet. Chciała odebrać to, co [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] miał najcenniejszego. Nie [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] honor lekarza ani nie [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] nadzieję na znalezienie lekarstwa.\n\nW nocnej ciszy znów rozlega się rzężenie. W małych fiolkach połyskują płyny. Skalpel lśni w blasku księżyca."
 panum.952.g: "Podaj chłopcu nadchloran żelaza."
 panum.952.h: "Przeprowadź tracheotomię."
 panum.952.i: "Zbadaj próbkę tkanki pod mikroskopem."
 panum.953.t: "Anioł dusiciel"
 panum.953.d: ""
 panum.953.f: "Rzężenie ustało. Dźwięk, który dręczył [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim], który towarzyszył [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim] i nauczył [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim] strachu — zniknął. Ale nie było w tym żadnego triumfu. [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] nienawidził tego odgłosu.\n\nTeraz jednak [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] oddałby wszystko, by znów go usłyszeć.\n\nCisza. Śmiertelna cisza, którą [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] znał już od miesięcy. To była ta chwila, w której można było usłyszeć samą ciszę. Złowroga, cmentarna cisza, która rozlewała się wokół i wysysała wszelkie siły życiowe. Ciszę można było usłyszeć i poczuć. Wypełniała ciało pustką. Nie było w tym żadnej sprzeczności. To było logiczne. Potwierdzone doświadczeniem.\n\nAle tej nocy logika i doświadczenie zawiodły [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim]. Palce [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis|U] zaciskały się na zimnej dłoni dziecka. Bladej niczym światło księżyca wpadające przez okna. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] rzucił wyzwanie błonicy.\n\nA błonica wdeptała [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] w ziemię i z rozkoszą dręczyła [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim], ponieważ [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] pycha zaślepiła [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim]."
 panum.953.g: "Doktorowi trudno będzie się z tym pogodzić."
 panum.954.t: "Nie krtań, lecz serce i oczy"
 panum.954.d: ""
 panum.954.f: "Księżyc zaszedł. Słońce znów wzeszło. Mijały kolejne dni, w których nocne ciemności ustępowały miejsca zasłoniętym oknom. [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] czuwał przy łóżku. Do tej pory [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] nie leczył pacjentów. Przedmiotem [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] pracy nie byli ludzie, lecz choroby. Łatwo było podawać azotan srebra, gdy służył jedynie do eksperymentów. Łatwo było wstrzykiwać surowicę, gdy chodziło tylko o próbę jej działania. Łatwo było też operować tchawicę, gdy nie widziało się człowieka, a jedynie skórę, mięśnie, ciało i kości.\n\n[ROOT.Var('panum_physician_var').GetCharacter.GetLastName] dotąd leczył choroby. Błonica zamieniała ludzi w pacjentów, ich życiowe historie w dokumentację medyczną, a cierpienie w objawy. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] pragnął uwolnić ludzi od duszności. A jednak to [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] sam potrzebował uzdrowienia. Nie krtani, lecz [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] oczu i serca.\n\n[ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] znów potrafił dostrzec człowieka. A w odpowiedzi [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim] ujrzał łagodny uśmiech."
 panum.954.g: "[ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] dokonał tego!"
 panum.955.t: "Poświęcenie"
 panum.955.d: ""
 panum.955.f: "Jedna dusza stracona. Cały świat zyskany. Pod mikroskopem roiło się od drobnoustrojów. Takich samych, jakie znajdowano już w wielu innych przypadkach. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] dotąd odrzucał tę możliwość. A jednak było to najbardziej logiczne wyjaśnienie. Syn [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis|U] nie miał żadnego kontaktu z chorymi na błonicę.\n\nTylko [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] miał z nimi kontakt. [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] [ROOT.Var('panum_physician_var').GetCharacter.GetHerselfHimself] przyniósł zarazki do własnego domu. Przez wiele dni. Być może nawet tygodni. Nie zdając sobie z tego sprawy. Od dziesiątków innych chorych dzieci. Od dziesiątków innych dzieci, które już nie żyły.\n\nDo których dołączyła teraz kolejna ofiara.\n\n[ROOT.Var('panum_physician_var').GetCharacter.GetLastName] miał próbkę. A [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] miał świnki morskie i króliki, którymi żadne dziecko już się nie opiekowało i z którymi żadne dziecko już się nie bawiło. One miały zostać złożone w ofierze. Tak jak [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] sam poniósł ofiarę. Jeśli zachorują, będzie to dowód. Chodziło przecież o wyeliminowanie błonicy. Cel ważniejszy niż [ROOT.Var('panum_physician_var').GetCharacter.GetHerselfHimself].\n\nWażniejszy niż jakikolwiek inny cel."
 panum.955.g: "Poświęcenie, które nie pozostanie bez kary."
 panum.956.t: "Radykalna zmiana teorii"
 panum.956.d: ""
 panum.956.f: "Ostatnie tygodnie stały się dla [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] prawdziwym punktem zwrotnym. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] z pewnością nie nazwałby tego przewrotem kopernikańskim. Rzadko jednak zdarzało się, by jakieś wydarzenie skłoniło [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim] do tak głębokiego zakwestionowania [ROOT.Var('panum_physician_var').GetCharacter.GetHerselfHimself] i [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] metod. Bezsilność wobec błonicy pozostawiła trwały ślad. A [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] wie, że choroba powróci.\n\nTylko znalezienie skutecznego, trwałego rozwiązania może zapobiec powtórzeniu się tej tragedii.\n\nDlatego w gabinecie lekarskim piętrzą się szklane naczynia. Stosy książek medycznych i rozpraw naukowych. A także lekarstwa. Ręka [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis|U] gorączkowo sięga po wszystko, co rzekomo wiadomo o błonicy.\n\nKażde domniemane lekarstwo. Każdy rzekomo pomocny podręcznik. Każdą rozprawę, która podobno zawiera odpowiedź.\n\n[ROOT.Var('panum_physician_var').GetCharacter.GetLastName] uprząta stół. Wszystko, co na nim leży, wyrzuca do kosza. Wszyscy się mylili. Bretonneau. Guersant. Trousseau. Bochut. Daviot!\n\nOdkrycie przyczyny błonicy oznaczałoby wreszcie możliwość jej wyleczenia. A po wszystkim, co [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] dotąd przeczytał i wypróbował, pozostało już tylko jedno możliwe wyjaśnienie. Błonica była chorobą zakaźną. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] zaraził [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] własnego syna po kontakcie z innymi pacjentami. Musiał istnieć czynnik wywołujący chorobę. Nieważne, co twierdzili eksperci.\n\nMusiał istnieć patogen."
 panum.956.g: "Wszystkie wysiłki skupiają się teraz na znalezieniu patogenu."
 panum.956.h: "Badania powinny już teraz koncentrować się na opracowaniu potencjalnej szczepionki."
 panum.961.t: "Toksyna błonicza"
 panum.961.d: ""
 panum.961.f: "Kluczem była trucizna. Taka, jaką wydzielał patogen wywołujący błonicę. [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] słyszał o pewnym biologu, który prowadził nad nią eksperymenty. Toksyna była zbyt silna, by można było powstrzymać jej działanie. Zwierzęta, którym ją podawano, umierały.\n\nAle [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] wiedział, że to odkrycie wstrząśnie światem nauki. Można już było o nim przeczytać w czasopismach specjalistycznych. Na całym świecie pojawiali się badacze, którzy również izolowali toksynę błoniczą w nadziei na wywołanie u zwierząt odpowiedzi immunologicznej bez doprowadzania ich do śmierci. Takiej samej śmierci, która zabrała miliony dzieci, a ich ciała pozostawiła niczym ofiary złożone na ołtarzu błonicy.\n\n[ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] postanowił zbadać tę sprawę. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] musiał zdobyć toksynę i przeprowadzić [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] własne eksperymenty."
 panum.961.g: "To być może decydujący krok..."
 panum.961.h: "Proces ten jest już znany z produkcji toksyny tężcowej..."
 panum.961.i: "Odpowiednia ilość jodu mogłaby w tym pomóc."
 panum.962.t: "Antytoksyna błonicza"
 panum.962.d: ""
 panum.962.f: "Przełom. Decydujący przełom, który wynagradzał wszystkie poświęcenia, całe cierpienie i wszystkie śmierci, których [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] był świadkiem. A także rozpacz pogrążonych w żałobie rodziców i krewnych. Pożegnania pełne łez. Rozpacz i beznadzieję.\n\nTo było takie proste. A zarazem tak skuteczne. Wystarczyło osłabić toksynę. Ostatecznie pomocny okazał się roztwór jodu. Konie były idealnymi zwierzętami doświadczalnymi. Reszta była już prosta. Organizm zwierzęcia wytwarzał odporność na toksynę, dzięki czemu można było pozyskać z niego surowicę. Antytoksynę przeciwko błonicy.\n\nKiedy tego dnia [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] trzymał w dłoni fiolkę, [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] poczuł głęboką satysfakcję. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] przeprowadził już pierwsze próby. Nie wszystkie dzieci reagowały na leczenie. Ale liczba tych, którym udało się pomóc, przekraczała wszystko, o czym [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] śmiał marzyć. Teraz tę broń przeciwko niewidzialnemu wrogowi należało produkować na masową skalę i rozpowszechniać. W każdej klinice. W każdym gabinecie lekarskim.\nWojna, którą [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] wypowiedział błonicy, jeszcze się nie skończyła. Dopiero się zaczynała."
 panum.962.g: "Zamów jak najwięcej tej surowicy!"
 panum.963.t: "Cień"
 panum.963.d: ""
 panum.963.f: "Błonica musi zostać wyeliminowana! Musi zniknąć!\n\nByć może była to obsesyjna myśl. Ale to właśnie ona trzymała doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] przy życiu. Wojna [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis|U] z błonicą przynosiła owoce. Tyle uratowanych istnień. Tyle dzieci, które w innych okolicznościach umierałyby w straszliwych męczarniach!\n\nDobro ogółu było ważniejsze niż dobro jednostki. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] oddałby własne życie, gdyby [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] mógł w ten sposób unicestwić błonicę. Ale los nie był dla [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim] łaskawy. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] nie zaprzedał diabłu [ROOT.Var('panum_physician_var').GetCharacter.GetHerselfHimself], lecz [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] syna. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] podjął tę decyzję. Za niego.\n\nOd tamtej nocy [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim] spowijał mrok. Towarzyszył mu gniew na chorobę. Ale [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] zdołał go stłumić. Racjonalnymi myślami, pracą i pragnieniem zemsty zagłuszał żal, jaki [ROOT.Var('panum_physician_var').GetCharacter.GetHerselfHimself] budził we własnym sumieniu. Jednak kilka dni temu ten gniew zniknął. Paradoksalnie, im więcej dzieci [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] ratował, tym wyraźniej [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] zaczynał widzieć prawdę.\n\n[ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] ujrzał [ROOT.Var('panum_physician_var').GetCharacter.GetHerselfHimself] w prawdziwym świetle. A [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] poczuł odrazę do tego, co [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] zobaczył.\n\nPycha [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis|U] zaślepiła [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim]. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] wierzył, że [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] ratuje ludzkie życie. A jednak [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] przesądził o jednym z tych istnień. Niczym kat. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] nawet nie sięgnął po skalpel. Ani choćby po niewielką fiolkę azotanu srebra. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] uznał próbkę i patogen za ważniejsze niż [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] pacjenta. Człowieka.\n\nCiało i krew [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis|U]. Własne dziecko.\n\nOd tamtej pory [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim] przepełniała odraza. W [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] samotnym mieszkaniu [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] jedynymi towarzyszami były dyplomy, nagrody i fotografie z wpływowymi politykami oraz uczonymi. Poza nimi nie było nic, tylko puste łóżko. I myśl, która stawała się coraz silniejsza. W głowie [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis|U] pulsował ból. Przerodził się w nieznośne cierpienie: Muszę zostać wyeliminowany. Muszę zniknąć.\n\n„Mój synu. Mój drogi synu...”"
 panum.963.g: "Doktorze [ROOT.Var('panum_physician_var').GetCharacter.GetLastName]... Doktorze!"
 panum.640.t: "„Obserwacje poczynione podczas epidemii odry”"
 panum.640.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] przedstawił [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] zalecenia dotyczące leczenia odry, które mają pomóc lepiej zrozumieć przyczyny choroby i sposoby jej rozprzestrzeniania się, aby w przyszłości ograniczać skalę epidemii i zapobiegać kolejnym wybuchom."
 panum.640.f: "„Zaraza rozprzestrzeniała się bardzo szybko w gęsto zaludnionym Thorshavn, skąd łodziami przeniesiono ją na pozostałe wyspy. Podróże do ośrodków handlowych i z powrotem, uczestnictwo w nabożeństwach i zajęciach szkolnych oraz obławy na grindwale przyczyniły się do rozprzestrzenienia zakażenia na kolejne wsie. Do Suderø zarazę przywiozła z Thorshavn konkretna, zidentyfikowana osoba, a dzięki przeprowadzonemu dochodzeniu niemal wszędzie udało się ustalić, w jaki sposób i przez kogo zakażenie zostało zawleczone do poszczególnych miejscowości. Wydaje się raczej wątpliwe, by choroba mogła przenosić się za pośrednictwem takich przedmiotów jak odzież, pranie czy listy. Podczas epidemii nie widziałem ani nie słyszałem o żadnym przypadku takiego przeniesienia zakażenia”.— Peter Panum, „Obserwacje poczynione podczas epidemii odry na Wyspach Owczych w 1846 roku”"
 panum.640.g: "Nowy Peter Panum!"
 panum.52.m: "Epidemia szkarlatyny w [SCOPE.sCountry('panum_scarlet_country_scope').GetName]."
 panum.52.q: "Właściwie to kiepski plan..."
 panum_no_expedition_effect_tt: "Twój [concept_panum_physician] może znów zająć się innymi sprawami."
 panum.51.d: "[ROOT.Var('panum_physician_var').GetCharacter.GetFullName], jedna z czołowych postaci środowiska medycznego w [GetPlayer.GetName], zgodził się udać do stanu dotkniętego epidemią, aby zbadać chorobę na miejscu. Doktor ma nadzieję, że pozwoli to sporządzić wyczerpujący opis choroby."
 panum.53.d: "Szalejąca epidemia skłoniła [ROOT.Var('panum_physician_var').GetCharacter.GetFullName] do dokładniejszego zbadania choroby, aby ustalić jej przyczyny i opracować nowe metody leczenia tej straszliwej przypadłości."
 rule_panum_spanish_flu_rule: "#tooltip:[GetRawTextTooltipTag('mr_morgenroete_tt')] @mr_morgenroete_icon! #! Hiszpanka"
 setting_panum_dynamic_spanish_flu_rule: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_panum_dynamic_spanish_flu_rule_desc Dynamiczna epidemia hiszpanki#!#!"
 setting_panum_dynamic_spanish_flu_rule_desc: "W pierwszej tercji XX wieku w jednym z uprzemysłowionych państw wybuchnie epidemia grypy, która obejmie cały świat. [Concept('concept_panum_disease','$concept_panum_pandemic$')] otrzyma nazwę od miejsca, w którym się rozpoczęła."
 setting_panum_historical_spanish_flu_rule: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_panum_historical_spanish_flu_rule_desc Historyczna epidemia hiszpanki#!#!"
 setting_panum_historical_spanish_flu_rule_desc: "[Concept('concept_panum_disease','$concept_panum_pandemic$')] rozpocznie się w 1918 roku i będzie znana jako hiszpanka."
 setting_panum_no_spanish_flu_rule: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_panum_no_spanish_flu_rule_desc Bez epidemii hiszpanki#!#!"
 setting_panum_no_spanish_flu_rule_desc: "Nie wystąpi żadna [Concept('concept_panum_disease','$concept_panum_pandemic$')] podobna do hiszpanki."
