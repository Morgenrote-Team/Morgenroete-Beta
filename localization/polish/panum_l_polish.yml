 panum.138.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('panum_custom_description_title')]"
 panum.138.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] przedstawił dziś [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] opis choroby [SCOPE.GetRootScope.GetCountry.GetCustom('panum_custom_disease_title')]. Wydział Medyczny już uznaje go za klasykę."
 panum.138.f: "W [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] traktacie [SCOPE.GetRootScope.GetCountry.GetCustom('panum_custom_description_title')] [ROOT.Var('panum_physician_var').GetCharacter.GetFullName] opisuje chorobę bardziej szczegółowo niż jakikolwiek inny lekarz w naszym kraju wcześniej. Edukuje czytelnika na temat objawów, okresu inkubacji i odróżniania od innych chorób, a także przedstawia chronologię dawnych epidemii oraz inne tradycyjne opisy epidemiologiczne."
 panum.138.g: "Teraz lepiej znamy tę bestię."
 panum.139.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('panum_custom_treatment_title')]"
 panum.139.f: "Wydział Medyczny z niecierpliwością oczekiwał pracy naukowej dotyczącej metody leczenia autorstwa [ROOT.Var('panum_physician_var').GetCharacter.GetFullName]. Czy ta praca może przynieść przełom? [SCOPE.GetRootScope.GetCountry.GetCustom('panum_custom_treatment_title')] może potencjalnie uratować życie niezliczonej liczby ludzi. Opisane w niej przyczyny wybuchu [SCOPE.GetRootScope.GetCountry.GetCustom('panum_custom_disease_title')] oraz sposoby zapobiegania jej i późniejszego leczenia mogą całkowicie zmienić sposób, w jaki postrzegano tę chorobę."
 panum.139.g: "[SCOPE.GetRootScope.GetCountry.GetCustom('panum_custom_disease_title')] traci swój przerażający charakter."
 panum.140.t: "Cholera — choroba przenoszona przez wodę!"
 panum.140.d: "Dzięki bohaterskiej pracy doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] wybuch cholery w [SCOPE.sState('panum_disease_state').GetCityHubName] został zdecydowanie powstrzymany!"
 panum.140.f: "„Od początku mojego pobytu tutaj, w [SCOPE.sState('panum_disease_state').GetCityHubName], zebrałem ogromną ilość informacji, które wszystkie prowadzą do jednego wniosku: cholera jest chorobą przenoszoną przez wodę. Choroba, która przez wieki uśmierciła tak wielu ludzi, nie znajduje się w powietrzu jako miasmat, lecz czai się i roi w kroplach wody. Po spożyciu rozwija się w jelitach i przejawia się jako cholera, z którą nauczyliśmy się walczyć. To lekcja okupiona wieloma ofiarami, lecz szybko wykorzystana w praktyce. W zeszłym tygodniu usunięto uchwyty z pompy wodnej będącej źródłem tej epidemii. Dziś wieczorem odchodzę na spoczynek bez ani jednego nowego przypadku na moim stole. To niepodważalne. Bestia została pokonana.\n\nMimo to odczuwam ukłucie żalu z tego powodu. Nie chciałbym przypisywać sobie pełnej, wyłącznej odpowiedzialności za odkrycia, których tutaj dokonaliśmy, lecz jedynie żałuję, że nie mogły zostać odkryte jeszcze wcześniej. Wiele istnień stracono z powodu braku czystej wody pitnej, zarówno młodych, jak i starych. Jeśli mamy szczęście, niech będzie to ostatnie nasze spotkanie z cholerą.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], opisującego Wielką Epidemię Cholery z roku [TimeKeeper.GetCurrentDate.Format('y')], podsumowującego śledztwo w [SCOPE.sState('panum_disease_state').GetCityHubName]."
 panum.140.g: "Niesamowite! To śmiertelny cios dla teorii miazmatów!"
 panum.141.t: "Browar"
 panum.141.d: "Śledztwo doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zaprowadziło [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim] na wyspę bezpieczeństwa podczas epidemii — browar."
 panum.141.f: "„Witaj! Powiedziano mi, że musi pan być brygadzistą tutaj w browarze. Jestem doktorem [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] i przybyłem zbadać epidemię. Proszę, opowiedz mi więcej.”\n\n„Cóż, tutaj nie był to zbyt wielki problem. Większość innych fabryk została zamknięta, ale nie my.”\n\n„Cholera nie dotyka was tutaj zbytnio? Czy ma pan pojęcie dlaczego?”\n\n„Niestety nie mam najmniejszego pojęcia. Ale gdybym miał zgadywać, powiedziałbym, że to dlatego, że chłopaki nie wracają do domu, do tego całego smrodu.”\n\n„Jedzą w browarze?”\n\n„Ano, a piją też! Szef pozwala nam wszystkim podczas lunchu dostać trochę starszych partii, które nie sprzedają się zbyt dobrze, żeby chłopaki mogli się trochę pokrzepić za grosze. Żadnej tej wody ze studni dla nas, tylko kufel piwa za prawie tyle, ile kosztuje jego wyprodukowanie.”"
 panum.141.g: "Hmm... więc nie pijecie lokalnej wody. Bardzo fascynujące."
 panum.142.t: "Istoty przyzwyczajenia"
 panum.142.d: "Śledztwo doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] trwa — [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] znalazł coś, co może być centrum epidemii."
 panum.142.f: "„...ale przypadków w okolicy było tak wiele, że zdałem sobie sprawę, iż potrzebuję lepszego rozeznania. Na szczęście lokalny urząd koronera okazał się niezwykle pomocny: zapisali adres każdego domu, z którego zabrali ciało lub w którym zauważyli chorobę, co dało mi możliwość dokładnego naniesienia każdego takiego przypadku na prostą mapę. Powstały obszar jest ogromny, obejmuje ponad sto domów, ale jednocześnie tworzy wielki okrąg.\n\nTo przeczy tradycyjnemu myśleniu. Gdyby była to miazma, z pewnością byłaby niesiona przez bryzę, podążając za dominującymi wiatrami. Zamiast tego wykracza poza zasięg wiatrów, tworząc coś dziwnie uporządkowanego i niepokojąco równego. Udałem się do samego centrum tego wszystkiego, być może mając nadzieję znaleźć jakiś ślad... i nie znalazłem niczego poza pompą wodną. Każdy dom zaznaczony na mapie znajdował się w zasięgu spaceru. Musi istnieć jakieś powiązanie.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], opisującego Wielką Epidemię Cholery z roku [TimeKeeper.GetCurrentDate.Format('y')], prowadzącego śledztwo w [SCOPE.sState('panum_disease_state').GetCityHubName]."
 panum.142.g: "Czy to... może być w pompie?"
 panum.143.t: "Dziwacy"
 panum.143.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] odkrył coś interesującego — odstępstwo od wzorca."
 panum.143.f: "„Och, dzięki niebiosom! Musi pan być tym doktorem, o którym wszyscy mówią, doktorze [ROOT.Var('panum_physician_var').GetCharacter.GetLastName]! Proszę, musi nam pan pomóc.”\n\n„Mam taki zamiar, proszę pani. Proszę opowiedzieć mi wszystko, co tylko może pani o sobie i swoich bliskich, i nie pomijać nawet najmniejszego szczegółu, jeśli to możliwe. Wygląda na to, że wasz przypadek jest jednym z nielicznych w tej okolicy?”\n\n„Tak, tak, jesteśmy! To po prostu pojawiło się znikąd! Zachowaliśmy wszelkie środki ostrożności, nawet nosiliśmy te kwieciste maski z wszystkimi kwiatami, żeby powstrzymać smród!”\n\n„W takim razie weszła pani na obszar epidemii? W jakim celu?”\n\n„Moja matka, moja droga matka... zawsze bardziej lubiła wodę z tamtej pompy, ale kiedy ją przyniosłam, choroba musiała przylgnąć do moich ubrań i wróciła ze mną do domu.”"
 panum.143.g: "...czy powiedziała pani, że przyniosła pani wodę z tamtej pompy?"
 panum.144.t: "Filtry"
 panum.144.d: "W [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] dążeniu do odkrycia większej liczby wskazówek dotyczących epidemii doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] odkrył, że wszyscy poszkodowani otrzymują wodę od tej samej firmy!"
 panum.144.f: "„...ale to jest najbardziej osobliwa rzecz ze wszystkich. Kiedy podróżowałem drogą lub w górę rzeki, do domów zaopatrywanych przez New River Company, liczba przypadków cholery dramatycznie spadała. Było ich nie więcej niż zwykle, jeśli w ogóle. Wracając na południe, można było znaleźć ulice płonące od cholery, wypełnione odorem nieopanowanych jelit i śmierci. Czy może to być lokalizacja miazmatycznej gleby?\n\nMyślę, że nie. Wydaje się to zbyt precyzyjnie wyznaczone. Skontaktowałem się z szanownymi panami z New River Company, a oni poinformowali mnie, że ich rury zostały niedawno zamknięte, gdyż w stacji pomp, dużym kosztem, dodawali nowe filtry. Czy te filtry mogą odgrywać w tym jakąś nieznaną rolę? Czy to zwykła czystość wody powstrzymuje miazmaty, czy może chodzi o coś więcej?”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], opisującego Wielką Epidemię Cholery z roku [TimeKeeper.GetCurrentDate.Format('y')], prowadzącego śledztwo w [SCOPE.sState('panum_disease_state').GetCityHubName]."
 panum.144.g: "...czy w wodzie znajduje się coś, co powoduje chorobę?"
 panum.145.t: "Brunatna woda"
 panum.145.d: "Wyposażony w najnowsze instrumenty do [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] badań, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] użył [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] mikroskopu do zbadania próbek z epidemii cholery."
 panum.145.f: "Nie było łatwo sprowadzić mikroskop aż do [SCOPE.sState('panum_disease_state').GetCityHubName], ponieważ wyboista droga omal nie roztrzaskała wszystkich soczewek... ale teraz, gdy już tu był, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] miał do dyspozycji jedno z największych narzędzi współczesnej medycyny. Kilkadziesiąt próbek zebranych z lokalnej wody, starannie przygotowanych, a następnie każda obejrzana pod mikroskopem. Niektóre pochodziły z obszarów z mniejszą liczbą przypadków cholery. To były te czystsze, zauważył [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe].\n\nAle te brudne? Te przepełnione najohydniejszym rodzajem zanieczyszczeń?\n\nTo właśnie one pochodziły z obszarów najbardziej dotkniętych chorobą. Zmarszczone czoło, chwila namysłu. Drobinki brudu unoszące się w cieczy niczym płatki brudnego śniegu. Tutaj, tam, drobne ruchy nieszkodliwych mikrobów, niewinnie poruszających się w tej nędznej zupie."
 panum.145.g: "...czy może nie jesteście tak nieszkodliwe, jak się wydajecie?"
 panum.145.h: "Więcej dowodów na rzecz innej teorii."
 panum.145.i: "Musi być w tym coś więcej."
 panum.146.t: "Pierwszy zgon"
 panum.146.d: "Po niestrudzonej pracy i śledztwie doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] prześledził epidemię aż do pierwszego odnotowanego przypadku — noworodka."
 panum.146.f: "Niewiele rzeczy przypominało doktorowi [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] o tym, co zrobił, bardziej niż wizyta w domu kobiety pogrążonej w najgłębszej żałobie, kobiety, która niegdyś była żoną i matką, lecz teraz nie była już żadną z tych rzeczy. Już ledwo schodząc ze stopni jej drzwi, doktor robił swoje notatki.\n\nNoworodek zabrany z ulicy do odwiedzin u babci. Wrócił z cholerą. Pieluchy wyprane, prawdopodobnie przenosiły chorobę.\n\nMąż wrócił z pracy. Spragniony po zmianie w hucie stali. Jadł dobrze, pił dobrze, zmarł pod koniec tygodnia, cholera.\n\nZa nimi zawodzenie. Przed nimi deszczowe, opustoszałe ulice. Pośród tego wszystkiego — wyszeptane zdanie."
 panum.146.g: "Proszę, niech to wszystko wreszcie się skończy."
 panum.147.t: "Otchłań"
 panum.147.d: "Podczas prowadzenia [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] śledztwa doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] odkrył coś przeoczonego — szambo."
 panum.147.f: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] nie był zwolennikiem teorii miazmatów, ale [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] był bardzo wdzięczny za kwieciste maski mające powstrzymywać je przed rozprzestrzenianiem się. Szambo było pełne gnijących odpadów i całkowicie, absolutnie cuchnące. Nawet inspektor policji odsunął się od jego krawędzi.\n\n„Doktorze! Taki dół musi być źródłem tych miazmatów i tej przeklętej cholery, którą nam przynosi!”\n\n„Być może, ale proszę spojrzeć tutaj, inspektorze. Czy widzi pan, jak deszcz spływa tutaj w głąb ziemi?”\n\n„Owszem, widzę, ale co z tego?”\n\n„Woda deszczowa spływa z tego szamba tam, w kierunku rynien. Musi przez nie przepływać, a jeśli tak, popłynie blisko pompy. Jeśli połączenia są uszkodzone...”\n\n„...wtedy wepchnęłoby ścieki prosto do uchwytu. Ugh. Dobrze, że choroby nie rozprzestrzeniają się przez wodę...”"
 panum.147.g: "...prawda?"
 panum.147.h: "Nieprawda!"
 panum.148.t: "Posiadłość"
 panum.148.d: "Śledztwo doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zaprowadziło [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim] do osobliwej luki w zasięgu epidemii — domu bogatego człowieka."
 panum.148.f: "„Dziś odwiedziłem rezydencję miejscowego dżentelmena, wspanialszy dom w obrębie miasta, niebezpiecznie blisko centrum epidemii. Wydaje się być pozostałością po wcześniejszym okresie historii tego miasta, kiedy ta część była bogatsza niż zwykłe slumsy. Gospodarz domu był niezwykle zainteresowany śledztwem i przekazał mi wiele ksiąg dotyczących lokalnej historii, mając nadzieję, że rzucą one światło na dawne epidemie. Co bardziej interesujące, jasno stwierdził, że cholera wciąż nie dotarła za ich mury.\n\nByło to dla mnie niezwykle fascynujące, ponieważ zgodnie z założeniami teorii miazmatów choroba znajduje się w powietrzu, w zapachu, i nie powinna w taki sposób rozróżniać między bogatymi a biednymi. Nawet jego służba nie jest dotknięta chorobą, przynajmniej ta mieszkająca w pomieszczeniach dla służby. Jedzą ze spiżarni i piją z artezyjskiej studni znajdującej się w obrębie murów, a mimo to pozostają nietknięci. Osobliwa zagadka. Czy mają coś, czego nie posiadają inni?”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], opisującego Wielką Epidemię Cholery z roku [TimeKeeper.GetCurrentDate.Format('y')], prowadzącego śledztwo w [SCOPE.sState('panum_disease_state').GetCityHubName]."
 panum.148.g: "Albo... być może służbie brakuje czegoś, co mogą mieć chorzy?"
 panum.149.t: "Mała śmierć"
 panum.149.d: "Śledztwo doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] być może ujawniło winowajcę — mikroba!"
 panum.149.f: "„...ale mimo wszystko musiałem być absolutnie pewien. Wezwałem świeże próbki, pobrane zarówno z wody, jak i specjalnie przygotowanych wydzielin chorych. Umieszczone na szkiełku mojego mikroskopu pozwoliły mi zajrzeć do wnętrza tych cieczy i potwierdzić obecność tego, co musi być naszym wielkim przeciwnikiem w tej walce: przecinkowców.\n\nNa pierwszy rzut oka te mikroby wydają się nieszkodliwe, bardziej przypominają rurki niż jakiegokolwiek wielkiego drapieżnika. Jednak każda próbka od chorych potwierdza ich obecność i można z przekonaniem stwierdzić, że te stworzenia odgrywają pewną rolę w tej chorobie. Czy one są... samą cholerą? Być może. Jeśli tak, jest to mocny dowód na rzecz teorii, że takie zarazki powodują choroby.\n\nAle jedno jest pewne: znaleźliśmy wroga. Teraz musimy go pokonać.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], opisującego Wielką Epidemię Cholery z roku [TimeKeeper.GetCurrentDate.Format('y')], prowadzącego śledztwo w [SCOPE.sState('panum_disease_state').GetCityHubName]."
 panum.149.g: "Oczyszczać i leczyć, aż będzie po wszystkim."
 panum.149.h: "To odkrycie wykracza daleko poza cholerę."
 panum.150.t: "Sprawa wymagająca praktycznego podejścia"
 panum.150.d: "Rzadki sojusznik w walce z chorobą, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] spotyka się z koronerem w [SCOPE.sState('panum_disease_state').GetCityHubName], aby omówić swoje odkrycia."
 panum.150.f: "„Ach, pan musi być doktorem [ROOT.Var('panum_physician_var').GetCharacter.GetLastName]! Proszę mi wybaczyć, że nie uścisnę panu dłoni, od kilku dni grzebię w martwych ciałach.”\n\n„...proszę mi wierzyć, nie musi pan prosić o wybaczenie. Jest pan miejscowym koronerem, proszę, opowiedz mi pan o swoich odkryciach.”\n\n„Jak pan wie, cholera jest chorobą jelit. Poza tym nie muszę nic dodawać. Wymioty, przeczyszczenie, jelita tak zatkane, że wyglądają jak białka jaj — ktoś tak wykształcony jak pan zna tę listę.”\n\n„Oczywiście, ale co takiego uważa pan za interesujące?”\n\n„Cóż... ciągle mi mówią, że to miazmaty, że ta śmierć jest w powietrzu... ale szczerze mówiąc, nie sądzę. Gdyby tak było, już bym nie żył. Miałem wiele ciał na tym stole, doktorze. To pachnie zatruciem pokarmowym, ale nim nie jest.”"
 panum.150.g: "To niezwykle interesująca myśl. Proszę opowiedzieć mi więcej."
 panum_physician_health_malus_modifier: "Niespokojna praca"
 panum.151.t: "Fabryka Narzędzi"
 panum.151.d: "Podczas prowadzenia [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] śledztwa podróż doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] do lokalnej fabryki narzędzi rodzi więcej pytań, niż przynosi odpowiedzi."
 panum.151.f: "„Kiedy kilka dni temu udałem się do fabryki narzędzi, początkowo wszystko zaczęło nabierać sensu. Ta fabryka specjalizuje się w nożach, narzędziach rzeźniczych i podobnych wyrobach, dlatego posiada stanowisko do ostrzenia. Wykorzystuje ono koła wodne do obracania wielkiej liczby osełek i kół ostrzących, aby wykończyć krawędź każdego ostrza. Każdy robotnik leżał na brzuchu blisko szlifierki i mógł zostać ochlapany wodą. Wszystko to miało sens i gdyby epidemia w fabryce ograniczała się tylko do tego miejsca, wszystko by się zgadzało.\n\nDziwne staje się jednak to, że przeczy to wzorcowi widocznemu wszędzie indziej. W fabryce są mężczyźni, którzy zachorowali, mimo że nigdy nie znajdowali się blisko ulicy będącej centrum tej epidemii ani przy kołach ostrzących. Jak to w ogóle może być możliwe?”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], opisującego Wielką Epidemię Cholery z roku [TimeKeeper.GetCurrentDate.Format('y')], prowadzącego śledztwo w [SCOPE.sState('panum_disease_state').GetCityHubName]."
 panum.151.g: "Najwyraźniej błędna wskazówka."
 panum.151.h: "Najwyraźniej błędna teoria."
 panum.152.t: "Słoik"
 panum.152.d: "Niestety doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] podążał fałszywym tropem — lokalnym przypadkiem zatrucia pokarmowego, niezwiązanym z cholerą."
 panum.152.f: "„Dzisiejszy dzień był niezwykle frustrujący. Wezwano mnie przez policję, abym zbadał nagły wybuch zachorowań w popularnym hotelu, który wyglądał na nagły wybuch cholery. Zebrałem wszystkie swoje rzeczy do śledztwa, powiadamiając odpowiednie władze, aby znalazły łóżka i opiekę dla chorych, jednak w chwili, gdy przybyłem na miejsce, wiedziałem, że to nie cholera. Objawy się nie zgadzały, a nagły początek był zbyt szybki. Winna musiała być bardziej lokalna przyczyna i, co nie było zaskoczeniem, wszyscy dotknięci chorobą zjedli ten sam posiłek.\n\nWyprawa do kuchni ujawniła sprawcę: z pewnością przeterminowany słoik pasztetu z kaczki, rozsmarowany na wybornym pieczywie przez kucharza, którego nos był zbyt zatkany przez przeziębienie, by wyczuć zepsucie. Strata czasu, jeśli kiedykolwiek taka była. Zatrucie pokarmowe nie jest cholerą.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], opisującego Wielką Epidemię Cholery z roku [TimeKeeper.GetCurrentDate.Format('y')], prowadzącego śledztwo w [SCOPE.sState('panum_disease_state').GetCityHubName]."
 panum.152.g: "...cóż, przynajmniej wiemy, żeby opróżnić spiżarnie."
 panum.153.t: "Błędne tropy"
 panum.153.d: "Podczas śledztwa doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] doszło do wypadku — [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] pomylił swoje próbki!"
 panum.153.f: "„Ale w samym środku pracy doszło do przerwania. Krzyki, wrzaski, odgłos bójki na ulicy. Pijacka burda, o jeden kielich za dużo. Policja szybko zaprowadziła porządek, odciągając ich, gdy wciąż krzyczeli.\n\nMinęła zaledwie chwila, by wstać z miejsca i zamknąć okiennice, a jeszcze mniej, by wrócić do pracy. Tym większym głupcem jestem, że nie zauważyłem, iż odłożyłem próbki w złej kolejności, a następnie wykonałem swoją pracę w złej kolejności i zapisałem każdą z nich w niewłaściwej kolejności.\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], opisującego Wielką Epidemię Cholery z roku [TimeKeeper.GetCurrentDate.Format('y')], prowadzącego śledztwo w [SCOPE.sState('panum_disease_state').GetCityHubName]."
 panum.153.g: "Tygodnie pracy zmarnowane. Przekleństwo."
 panum.154.t: "Naśladowca mordercy?"
 panum.154.d: "Śledztwo w sprawie epidemii cholery w [SCOPE.sState('panum_disease_state').GetCityHubName] przybrało niepokojący obrót — wygląda na to, że może chodzić o inną chorobę!"
 panum.154.f: "„Ach, dobrze znów pana widzieć, doktorze [SCOPE.sCharacter('panum_physician_scope').GetLastName]. Mój stół był zajęty przez cały ostatni tydzień.”\n\n„Nie nazwałbym tego dobrym spotkaniem, koronerze. Co mamy?”\n\n„Napływa więcej ciał. Myślałem, że to kolejna cholera i być może tak jest, ale coś tu się nie zgadza.”\n\n„Zatrucie pokarmowe?”\n\n„Nie, nie przy tempie, w jakim ich zabiera. W większości dzieci, a także osoby starsze.”\n\n„Cholera jest jeszcze bardziej śmiertelna dla osób narażonych niż dla kogokolwiek innego. Jest pan pewien, że to nie ona?”\n\n„Nie jest tak, że wypisuje swoje imię od środka na ich żyłach. Czerwonka, cholera, tyfus? Zwykłe zatrucie pokarmowe? Kto może to stwierdzić? Jedyne, co wiem, to że nie wydaje się taka sama. Nie ma tego białego koloru jak przy cholerze, ale śmierć jest taka sama.”\n\n„W takim razie możemy mieć do czynienia z drugą chorobą... do licha i nieszczęścia. Jak mamy odróżnić te dwie?”\n\n„To pan jest doktorem, nie ja.”"
 panum.154.g: "Nie mogę stworzyć planu, jeśli nie wiem, z czym walczę."
 panum.155.t: "Miazmat...?"
 panum.155.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] i [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] śledztwo napotkali problem — czy miazmaty mogą być prawdziwe?"
 panum.155.f: "„...ale wyniki tej najnowszej części śledztwa przeczą rozumowaniu teorii zarazków i za nic nie potrafię zrozumieć dlaczego. Domy znajdują się przy płytkim kanale, często przemierzanym przez barki dostarczające węgiel do odlewni. Nie znajdują się w łatwym zasięgu żadnych pomp wodnych, poza starą studnią. Jest ona czysta, być może najczystsza w całym mieście.\n\nA jednak z jakiegoś niepojętego dla mnie powodu cholera jest tutaj. Już teraz pracują nad tym, by powstrzymać smród, a ten smród, ta miazma, rzeczywiście tutaj jest. Kanał cuchnie ściekami... ale jeśli nie piją tej wody, to w jaki inny sposób mogą zostać zarażeni, jeśli nie przez sam zapach?”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], opisującego Wielką Epidemię Cholery z roku [TimeKeeper.GetCurrentDate.Format('y')], prowadzącego śledztwo w [SCOPE.sState('panum_disease_state').GetCityHubName]."
 panum.155.g: "Miazmaty nie mogą być poprawne... prawda?"
 panum.156.t: "Rozłożone na czynniki pierwsze"
 panum.156.d: "Z głodem na coraz większą ilość terenów pod zabudowę rozwój [SCOPE.sState('panum_disease_state').GetCityHubName] nie ma czasu się zatrzymać, nawet na potrzeby śledztwa doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName]."
 panum.156.f: "„...kim pan właściwie jest?”\n\n„Doktorem prowadzącym śledztwo w sprawie tej epidemii. Ta ulica była pełna chorych ludzi. Gdzie oni są?”\n\n„Nie mam pojęcia. Ja i moi chłopcy jesteśmy tutaj tylko po to, żeby zacząć rozbierać te domy.”\n\n„Rozbierać je? Co? Te domy były miejscem zamieszkania dla tuzina rodzin, z których wszystkie były zarażone cholerą!”\n\n„Cóż, już nimi nie są. Właściciel wyrzucił ich wszystkich na ulicę.”\n\n„On CO zrobił?”\n\n„Wyrzucił ich! Przy takim czymś nie płacą czynszu, ale i tak nie miałoby to znaczenia. Teren idzie pod budowę fabryki włókienniczej, a jeśli pan wybaczy, ja i chłopaki musimy zacząć pracę przy rozbiórce tych domów.”"
 panum.156.g: "Na litość boską. Teraz znowu muszę znaleźć chorych... tylko nie pijcie niczego."
 panum.157.t: "Skażone"
 panum.157.d: "Straszne wieści! Doktor został zarażony cholerą!"
 panum.157.f: "„Nie wiem, jak do tego doszło. Miazmaty? Przez tygodnie przebywałem wśród chorych, zmarłych i umierających, bardziej niż ktokolwiek inny. Zarazki? Nie piłem tej wody, ale co ze skażeniem? Czy mogą się rozprzestrzeniać przez dotyk? W powietrzu, na powierzchniach? Nie wiem.\n\nAle znam objawy. Rozstrój żołądka i to, że nigdy się nie kończy. Równie dobrze mógłbym nic nie jeść i nie pić, bo niewiele by to zmieniło. Mówi tysiąc prawd i jedną.\n\nMam cholerę.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], opisującego Wielką Epidemię Cholery z roku [TimeKeeper.GetCurrentDate.Format('y')], prowadzącego śledztwo w [SCOPE.sState('panum_disease_state').GetCityHubName]."
 panum.157.g: "Och, mam nadzieję, że [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] wkrótce wyzdrowieje."
 panum.161.t: "Odrobina ginu"
 panum.161.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] poświęcił trochę czasu z dala od swojej pracy, aby „zbadać” swoją drugą pasję: alkohol."
 panum.161.f: "„...ale podczas drugiej szklanki tego najwspanialszego napoju zacząłem dostrzegać coś niezwykle dziwnego. Im więcej ludzi przychodziło tutaj pić, tym mniejsze było prawdopodobieństwo, że zostaną dotknięci cholerą. Tak! Moja własna mapa pokazuje, że domy znajdujące się najbliżej tego miejsca mają znacznie mniejszą szansę na dotknięcie tą przeklętą chorobą.\n\nCzuję, że istnieje tu pewien wzorzec. Porozmawiałem więcej z właścicielem oraz kilkoma bardziej rozmownymi miejscowymi i wydają się zgadzać. Jest coś w tym miejscu, co pomaga odpierać chorobę. Powinienem zbadać to dokładniej.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], opisującego Wielką Epidemię Cholery z roku [TimeKeeper.GetCurrentDate.Format('y')], prowadzącego śledztwo w [SCOPE.sState('panum_disease_state').GetCityHubName]."
 panum.161.g: "Ach, cuda biznesu i przyjemności w jednym."
 panum.162.t: "Dno!"
 panum.162.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] podjął najodważniejszy krok ze wszystkich — [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] zaraził [ROOT.Var('panum_physician_var').GetCharacter.GetHerselfHimself] cholerą, pijąc skażoną wodę!"
 panum.162.f: "„...oczywiście, nawet najlepsza teoria na świecie jest niczym bez praktyki. Mimo całej pracy pozostaje ona dla moich przeciwników jedynie zbiegiem okoliczności, a oni wciąż twierdzą, że nie istnieją niepodważalne dowody, które mogłyby ugruntować moje poglądy. Bardzo dobrze. Stawię im czoła bezpośrednio i w najbardziej dosłowny sposób ze wszystkich: pijąc tę samą wodę, która znajduje się w samym centrum tej epidemii, dostarczoną przez wiernego posłańca. Jeśli mają rację, nie zachoruję nawet po opuszczeniu tego miejsca. Jeśli to ja mam rację, wkrótce będę walczył o życie, ale czym jest jedno życie w porównaniu z tak wieloma, które mogą zostać uratowane, jeśli uda mi się udowodnić swoje twierdzenia?\n\nA więc, mój najdroższy dzienniku, toast za zdrowie.\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], opisującego Wielką Epidemię Cholery z roku [TimeKeeper.GetCurrentDate.Format('y')], prowadzącego śledztwo w [SCOPE.sState('panum_disease_state').GetCityHubName]."
 panum.162.g: "„Och, drogi mój, czuję się... o nie.”"
 panum.162.h: "Odwieść doktora od tego nierozważnego posunięcia!"
 panum.163.t: "Mapa do sukcesu"
 panum.163.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zdołał stworzyć znakomitą mapę centrum epidemii, ułatwiając śledzenie postępów choroby."
 panum.163.f: "„Panowie, panowie, przedstawiam wam moją mapę zakażeń w [SCOPE.sState('panum_disease_state').GetName]. Zawiera ona z niezwykłą szczegółowością położenie każdego pojedynczego przypadku zakażenia w regionie, odpowiednio oznaczonego datą i czasem, wraz z nazwiskiem oraz liczbą zgonów, zakażeń i tak dalej. Przedstawia pisemną oś czasu całego przebiegu epidemii cholery w tej dzielnicy. Przykład: tutaj widzimy pompę wodną oraz liczbę domów znajdujących się w zasięgu spaceru.\n\nPonadto przedstawiam następujące tabele, sporządzone poprzez zestawienie informacji z tej mapy. Jeśli szanowni panowie zechcą przyjrzeć się im osobiście, zauważą, że obszary obsługiwane przez tę pompę wodną mają najwyższe wskaźniki śmiertelności ze wszystkich. Tutaj, w tej tabeli, widzimy, że przedsiębiorstwo wodociągowe, studnie [SCOPE.sState('panum_disease_state').GetName], wykazuje bezpośrednią korelację z tymi pompami, co z kolei pokazuje, że przedsiębiorstwo to ma najwyższe ryzyko cholery spośród wszystkich obsługiwanych obszarów..."
 panum.163.g: "To pewnego dnia stanie się nauką."
 panum.164.t: "Ogień i furia"
 panum.164.d: "Brak postępów w walce z epidemią cholery w [SCOPE.sState('panum_disease_state').GetName] wyczerpał cierpliwość doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName]."
 panum.164.f: "Krzyki było słychać niemal z odległości całej przecznicy, a odgłosy książek i filiżanek rzucanych ze stołu dochodziły z daleka od drzwi. Lawina przekleństw, gorączkowe, rozpaczliwe przeprosiny przestraszonych asystentów, a potem kolejne krzyki i jeszcze więcej.\n\n„Wy głupcy! Absolutni, kompletni idioci! Jesteśmy tutaj Z JAKIEGOŚ POWODU! Ludzie umierają za naszymi drzwiami, patrzą na nas, abyśmy ich uratowali, i uratujemy ich!”\n\nDłoń doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zacisnęła się w pięść.\n\n„Jeśli nie potraficie wykonać nawet najprostszych poleceń, to nie powinniście tutaj być! Ci z was, którzy potrafią, mają wykonywać moje rozkazy co do litery i POKONAMY tę przeklętą zarazę! Słyszycie mnie?”\n\n„Tak, doktorze!”\n\n„A teraz wracajcie tam i znajdźcie mi więcej próbek! Tym razem WŁAŚCIWYCH!”"
 panum.164.g: "I tak oto doktor wprowadza swoją armię do boju, gotową wypowiedzieć wojnę samej chorobie."
 panum.165.d: "W chwili całkowitej odwagi doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] odwiedził jeden z najbardziej dotkniętych chorobą szpitali w [SCOPE.sState('panum_disease_state').GetCityHubName], aby przeprowadzić wywiady z przebywającymi tam pacjentami."
 panum.165.f: "Oddział tego prowizorycznego szpitala był zatłoczonym miejscem, pełnym widoków i dźwięków, ale przede wszystkim zapachów. Zapach choroby. Zapach śmierci. Przyniesiono kwiaty, aby spróbować powstrzymać odór, a także kadzidła, lecz mimo to niewielu przychodziło do tej sali potępionych. Mówiono, że było to zbyt ryzykowne, zbyt niebezpieczne dla ich własnego zdrowia. Jak mogliby mieć nadzieję pomóc innym, jeśli sami również leżeliby umierający w łóżku?\n\nPrzychodziło niewielu, ale nie nikt. Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] był jednym z nich i przemierzał to miejsce śmierci i umierania z nieustającą odwagą oraz niewyczerpaną energią. Siadał przy boku cierpiących i samotnych, zadawał pytania, robił notatki. Każda myśl, każda odpowiedź była cenna. Były to wskazówki prowadzące do ocalenia, podpowiedzi, skąd może pochodzić ta śmierć i jak można ją również uśmiercić."
 panum.165.g: "A w tej sali śmierci kroczył anioł życia, z dziennikiem w dłoni."
 panum.166.t: "Siła Modlitwy"
 panum.166.d_christian: "W poszukiwaniu zarówno wiedzy, jak i być może pocieszenia, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] udał się do kapłana w miejscowej katedrze."
 panum.166.d_muslim: "W poszukiwaniu zarówno wiedzy, jak i być może pocieszenia, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] udał się do imama w miejscowym meczecie."
 panum.166.d_other: "W poszukiwaniu zarówno wiedzy, jak i być może pocieszenia, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] udał się do kapłana w miejscowej świątyni."
 panum.166.f_christian: "„Witaj, ojcze. Jestem doktorem [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], wysłanym przez stolicę, aby zbadać tę epidemię i zaoferować wszelką pomoc, jaką mogę. Chciałbym prosić o twoją pomoc w tej sprawie, jeśli możesz jej udzielić.”\n\n„Jestem tylko pokornym kapłanem, nie Wszechmogącym, ale zrobię, co mogę. Powiedz mi, dziecko. Czego potrzebujesz?”\n\n„Chciałbym dowiedzieć się wszystkiego, co możesz mi powiedzieć o początkowych dniach tego zakażenia. Kto był pierwszą osobą, która zachorowała? Gdzie? Czy masz jakieś przypuszczenia, skąd mogło się to wziąć?”\n\n„Tylko Bóg może znać odpowiedź na niektóre z tych pytań, ale tak, wiem wiele o mojej trzodzie. Chodź, chodź. W końcu sam prowadziłem własne zapiski.”"
 panum.166.f_muslim: "„As-salamu alaykum, imamie. Jestem doktorem [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], wysłanym przez stolicę, aby zbadać tę epidemię i zaoferować wszelką pomoc, jaką mogę. Chciałbym prosić o twoją pomoc w tej sprawie, jeśli możesz jej udzielić.”\n\n„Jestem tylko pokornym duchownym, nie Wszechmogącym, ale zrobię, co mogę. Powiedz mi, czego potrzebujesz?”\n\n„Chciałbym dowiedzieć się wszystkiego, co możesz mi powiedzieć o początkowych dniach tego zakażenia. Kto był pierwszą osobą, która zachorowała? Gdzie? Czy masz jakieś przypuszczenia, skąd mogło się to wziąć?”\n\n„Tylko Allah może znać odpowiedź na niektóre z tych pytań, ale tak, wiem wiele o tutejszej społeczności. Chodź, chodź. W końcu sam prowadziłem własne zapiski.”"
 panum.166.f_other: "„Pozdrawiam cię, kapłanie. Jestem doktorem [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], wysłanym przez stolicę, aby zbadać tę epidemię i zaoferować wszelką pomoc, jaką mogę. Chciałbym prosić o twoją pomoc w tej sprawie, jeśli możesz jej udzielić.”\n\n„Jestem tylko pokornym strażnikiem tej świątyni, nie jednym z Bogów, ale zrobię, co mogę. Powiedz mi, doktorze. Czego potrzebujesz?”\n\n„Chciałbym dowiedzieć się wszystkiego, co możesz mi powiedzieć o początkowych dniach tego zakażenia. Kto był pierwszą osobą, która zachorowała? Gdzie? Czy masz jakieś przypuszczenia, skąd mogło się to wziąć?”\n\n„Tylko istoty boskie mogą znać odpowiedź na niektóre z tych pytań, ale tak, wiem wiele o tutejszych ludziach. Chodź, chodź. W końcu sam prowadziłem własne zapiski.”"
 panum.166.g_christian: "Czystość jest bliska boskości."
 panum.166.g_muslim: "Na każdą chorobę istnieje lekarstwo."
 panum.166.g_other: "Dobrze poznaj to, co prowadzi cię naprzód, i to, co cię powstrzymuje."
 panum.167.t: "Lepiej dmuchać na zimne"
 panum.167.d: "Aby zachować bezpieczeństwo podczas prowadzenia śledztwa, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] bezpiecznie odizolował [ROOT.Var('panum_physician_var').GetCharacter.GetHerselfHimself] od zarażonych."
 panum.167.f: "„Niektórzy nazwaliby to tchórzostwem. Ja nazwałbym to pragmatyzmem. To nie jest bitwa, którą można wygrać szybko, gdzie można po prostu wbić bagnet w brzuch wroga i pozwolić mu szybko umrzeć. To trudniejsza walka, przeciwko przeciwnikowi, którego nie możemy zobaczyć ani usłyszeć, a który może znajdować się wszędzie wokół nas.\n\nBrak odpowiedniej ochrony jest głupotą. Izolacja jest największym kluczem. Żywność i woda z bezpiecznych obszarów, czyste miejsce do badań oraz wszelki kontakt z zarażonymi i ich dobytkiem odbywający się za pośrednictwem pośredników. Bezpieczny od choroby mogę spokojnie prowadzić badania i skupić wszystkie swoje wysiłki na odkryciu prawdy stojącej za tą chorobą.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], opisującego Wielką Epidemię Cholery z roku [TimeKeeper.GetCurrentDate.Format('y')], prowadzącego śledztwo w [SCOPE.sState('panum_disease_state').GetCityHubName]."
 panum.167.g: "...ale nawet [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] będzie musiał w końcu pobrudzić [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] ręce."
 panum.168.t: "Niespokojna praca"
 panum.168.d: "Zdeterminowany, by dotrzeć do sedna epidemii cholery, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] pracuje szczególnie do późnych godzin."
 panum.168.g: "W takim razie pozwól, konstablu, że wspólnie przemierzymy te ulice."
 je_panum_cholera_treatment_goal: ""
 je_panum_germ_theory: "Zarazki i miazmaty"
 je_panum_germ_theory_reason: "Hipokrates z Kos uważany jest za twórcę teorii miazmatów, czyli toksycznych wyziewów z gleby, które unoszą się w powietrzu i tym samym przyczyniają się do rozprzestrzeniania chorób. W XIX wieku, z powodu braku wiedzy o bakteriach i wirusach, lekarze i badacze po prostu przypisywali epidemie takie jak cholera złym zapachom, które rozprzestrzeniały się poprzez „miazmaty”. Teoria ta później okazała się błędną drogą w medycynie, chociaż model miazmatów częściowo wyjaśniał już, skąd pochodzą epidemie i w jaki sposób się rozprzestrzeniają. Konflikt między kontagionistami, którzy twierdzili, że dochodzi do zakażenia między ludźmi, a antykontagionistami, zwolennikami teorii miazmatów, bywał w połowie XIX wieku niezwykle zaciekły. Słabości modelu miazmatów zostały dostrzeżone w Londynie, choć prowizoryczne zasady radzenia sobie z miazmatami, takie jak czystość i izolacja, ograniczały epidemie do pewnego stopnia.\n\nJeśli naród znajdzie wystarczające dowody przemawiające za teorią zarazków i przeciwko teorii miazmatów, ta zmiana paradygmatu pozwoli na występowanie mniejszej liczby negatywnych wydarzeń podczas poszukiwania metod leczenia lub w czasie epidemii. Pierwszy odkrywca teorii zarazków otrzymuje dodatkową premię do badań."
 je_panum_germ_theory_goal: ""
 notification_panum_germ_theory_notification_name: "Przełom teorii zarazków"
 notification_panum_germ_theory_notification_desc: "[concept_panum_physician] z [GetGlobalVariable('panum_germ_theory_invented_global_var').GetCountryDefinition.GetName] po raz pierwszy zdołał ostatecznie potwierdzić teorię zarazków we wszystkich jej aspektach. Teoria miazmatów została całkowicie odrzucona."
 panum.11.t: "Teoria Drobnoustrojów "
 panum.11.d: "Ze względu na przytłaczające dowody przemawiające za teorią zarazków oraz równie przytłaczające dowody przeciwko teorii miazmatów nastąpiła zmiana paradygmatu w medycynie. Nie jest to w najmniejszym stopniu zasługą doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], że teoria zarazków została teraz ugruntowana."
 panum.11.f: "Teoria miazmatów jest typowym przykładem tezy naukowej, którą trudno obalić, ponieważ przypuszczalnie znajduje potwierdzenie wszędzie. Fakt, że czyszczenie i zasady higieny dotyczące „czystego powietrza” sprawiały, iż niektóre choroby rzeczywiście znikały, wydawał się w XIX wieku potwierdzać tę teorię. Jednocześnie powstrzymywała ona nauki medyczne przed przełomami w wielu różnych dziedzinach, ponieważ prawdziwe przyczyny, a tym samym rzeczywiste metody leczenia, pozostawały nieznane. Od teraz lekarze będą odnosić większe sukcesy w poszukiwaniu metod leczenia — a droga do badań nad patogenami i szczepionkami stoi otworem."
 panum.11.g: "Ale czy naprawdę chcieliśmy wiedzieć, co dzieje się w wodzie...?"
 panum.53.t: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] udaje się do regionu epidemii"
 panum.53.f: "Metody leczenia są najważniejszym krokiem w walce z chorobą. Stanowią podstawę dla możliwej przyszłej szczepionki, która może zapobiec epidemii. Jednak nawet skuteczna metoda leczenia jest wystarczająco silna, aby powstrzymać przyszłe epidemie i ograniczyć ich długość oraz nasilenie — co skutkuje znacznie mniejszą liczbą ofiar. Lekarze badający epidemię we własnym kraju pracują skuteczniej niż lekarze podczas podróży zagranicznej."
 panum.53.g: "Ten koszmar musi się skończyć!"
 panum.54.t: "Wyprawa badań medycznych"
 panum.54.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zebrał niewielki zespół ekspertów i asystentów, którzy nadają się do intensywnego badania epidemii za granicą i ewentualnego opracowania nowej metody leczenia. Teraz pojawia się pytanie, którą chorobę należy obserwować i w jakim kraju."
 notification_panum_epidemic_spread_notification_name: "Epidemia się rozprzestrzenia"
 notification_panum_epidemic_spread_notification_desc: "Epidemia rozprzestrzeniła się na inny region pomimo naszych najlepszych wysiłków."
 panum_add_germ_theory_effect_tt: "[concept_panum_germ_theory] zastępuje #ORANGE Teorię miazmatów#! jako powszechny paradygmat medyczny."
