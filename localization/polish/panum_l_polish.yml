 panum_cholera_desc: "Cholera to niebezpieczna choroba zakaźna jelita cienkiego. Uznaje się ją za jedną z najbardziej charakterystycznych epidemii XIX wieku, która pochłonęła miliony istnień ludzkich na całym świecie."
 panum.2626.t: "Występ doktora [ROOT.Var('panum_physician_var').GetCharacter.GetFullName]"
 panum.2626.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] otrzymał [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] własną audycję radiową, w której [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] udziela porad osobom pragnącym porozmawiać o swoich problemach. Audycja cieszy się ogromną popularnością."
 panum.2626.f: "„Witaj, Ethanie. Słucham cię”.\n„Dzień dobry, doktorze [ROOT.Var('panum_physician_var').GetCharacter.GetLastName]”.\n„Ile masz lat?”\n„Trzynaście”.\n„No dobrze, w czym mogę ci pomóc?”\n„Cóż, mam mnóstwo problemów z innymi dzieciakami w szkole. Ciągle mnie biją”.\n„Jak myślisz, dlaczego tak się dzieje?”\n„Pewnie dlatego, że jestem inteligentny. Mam IQ wynoszące 160. Należę do klubu astronomicznego i nienawidzę sportu”.\n„Wiesz, Ethanie, inne dzieci zachowują się tak z zazdrości i niedojrzałości. Wiem, że teraz niewiele ci to pomoże, ale za kilka lat nadejdzie dzień, w którym to ty będziesz śmiał się ostatni”.\n„I to wszystko?”\n„Tak”.\n„Szczerze mówiąc, doktorze [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], uważam tę radę za protekcjonalną, banalną i, mówiąc całkiem otwarcie, pozbawioną polotu. Najbardziej zdumiewa mnie to, że ktoś płaci za wygadywanie takich bredni”.\n„Ethanie, skąd dzwonisz?”\n„Z domu”.\n„Cóż, jeśli słucha nas któryś z kolegów Ethana ze szkoły, to już wiecie, gdzie go znaleźć. A przecież nie może siedzieć tam wiecznie. Dziękuję za telefon”."
 panum.2626.g: "Zaraz, znam tę audycję!"
 ACHIEVEMENT_panum_biologist_job: "Praca dla biologa?"
 ACHIEVEMENT_DESC_panum_biologist_job: "Opracuj szczepionkę przeciwko żółtej febrze we współpracy z lekarzem."
 panum.1007.t: "Klinika leczenia polio"
 panum.1007.d: "Siostra [SCOPE.sCharacter('panum_polio_nurse').GetFirstName] założyła klinikę leczenia polio w [SCOPE.sState('panum_disease_state').GetName], aby zapewnić opiekę licznym pacjentom."
 panum.1007.f: "„Była bardzo wysoką i elegancką kobietą, a samym swoim zachowaniem i sposobem, w jaki się poruszała, wzbudzała zaufanie. Miała uroczy akcent, który sprawiał, że przyjemnie było jej słuchać. Kiedy zamykam oczy, wciąż widzę ją stojącą obok mojego łóżka w długiej, czarnej sukni i dużym kapeluszu z pięknym strusim piórem... Nie nosiła biżuterii ani makijażu. Pamiętam jej twarz jako silną i kanciastą, a jej oczy były niezwykle przenikliwe. Kiedy patrzyła ci w oczy, ta intensywność wymagała całej twojej uwagi, a gdy mówiła, ludzie jej słuchali... Wszyscy wiedzieli, kto tu dowodzi, i otrzymywaliśmy każde leczenie, które zaleciła. Nigdy nie znałem nikogo tak stanowczego jak ona.”\n\nRay G., osoba po przebyciu polio"
 panum.1007.g: "Dziękujemy, siostro [SCOPE.sCharacter('panum_polio_nurse').GetFirstName]."
 panum.1008.t: "Depresja spowodowana polio"
 panum.1008.d: "Liczne dzieci, które wskutek choroby pozostają niepełnosprawne do końca życia, wpływają nie tylko na stan zdrowia fizycznego następnego pokolenia, ale także na nastroje rodziców, którzy oskarżają rząd o podejmowanie zbyt słabych działań."
 panum.1008.f: "„Doskonale pamiętam pierwszy dzień, kiedy założyłem ortezę do szkoły. Było to w trakcie lekcji. Prawdopodobnie tego ranka poszedłem do lekarza, aby dopasować ortezę. Mama wysadziła mnie przy wejściu i pamiętam, że miała łzy w oczach, gdy odchodziłem.”\n\nEdmund Sass, osoba po przebyciu polio"
 panum.1008.g: "Irracjonalne, ale nie niezrozumiałe."
