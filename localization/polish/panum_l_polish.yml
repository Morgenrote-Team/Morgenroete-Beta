 je_panum_polio_treatment_expedition: "Ekspedycja badań medycznych: Polio"
 je_panum_measles_treatment_expedition_reason: "Dr. [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] prowadzi ekspedycję medyczną w [SCOPE.sCountry('target').GetName], aby znaleźć metody leczenia przeciwko #YELLOW odrze#!. Dopóki choroba szaleje w kraju, [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] ma co miesiąc szansę odkryć przyczyny choroby i powstrzymać jej rozprzestrzenianie.\n\nJeśli choroba ustąpi, postęp naukowy nie zostanie utracony, lecz będzie również obecny podczas następnego badania."
