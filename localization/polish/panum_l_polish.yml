 je_group_panum_medicine: "Morgenröte: #ORANGE Medycyna#!"
 je_panum_cholera: "Epidemia cholery"
 je_panum_cholera_reason: "Cholera jest uważana za najgroźniejszą epidemię XIX wieku. Dla epoki wiktoriańskiej ma podobne znaczenie jak dżuma dla średniowiecza. Rozprzestrzenia się szybciej niż jakakolwiek inna choroba i występuje również w śmiertelnej postaci.\n\nWynalezienie #ORANGE Nowoczesnej kanalizacji#! ma szczególne znaczenie w walce z cholerą. Dzięki tej technologii [concept_panum_physician] może opracować #V leczenie cholery#!. Pomóc może nawet przeciętnie rozwinięty system opieki zdrowotnej. Wszystko to prowadzi do skuteczniejszego zapobiegania chorobie i jej leczenia. Stolice, które [concept_gaudi_architect] wyposaży w nowoczesny system kanalizacyjny, są zasadniczo chronione przed wybuchami cholery.\n\nAby raz na zawsze pokonać cholerę, potrzebna jest #V szczepionka przeciw cholerze#! opracowana przez [concept_theiler_biologist]."
 je_panum_tuberculosis: "Epidemia gruźlicy"
 je_panum_tuberculosis_reason: "Obok cholery gruźlica była jedną z najczęstszych przyczyn śmierci w XIX wieku. „Biała śmierć” zaczynała jako romantyczna choroba, by ostatecznie coraz bardziej stawać się chorobą proletariatu. Gruźlica ogranicza się głównie do kilku stanów o niskim poziomie życia i wysokim stopniu urbanizacji.\n\nWynalezienie #ORANGE pasteryzacji#! ma szczególne znaczenie w walce z gruźlicą. Dzięki tej technologii [concept_panum_physician] może opracować #V leczenie gruźlicy#!. Pomóc może dobrze rozwinięty system opieki zdrowotnej. Wszystko to prowadzi do skuteczniejszego zapobiegania chorobie i jej leczenia. W rzadkich przypadkach w odpowiedzi na gruźlicę mogą powstawać uzdrowiska klimatyczne, choć skuteczność takiego leczenia jest wątpliwa.\n\nAby raz na zawsze pokonać gruźlicę, potrzebna jest #V szczepionka przeciw gruźlicy#! opracowana przez [concept_theiler_biologist]."
 je_panum_smallpox: "Epidemia Ospy"
 je_panum_smallpox_reason: "Ospa prawdziwa jest jedną z największych plag ludzkości, która dziesiątkowała całe narody. Dzięki wariolizacji i szczepieniom przeciw ospie w ciągu XVIII wieku straciła wiele ze swojej grozy, ale bez odpowiednich środków ostrożności wciąż może pokazać swoje najgorsze oblicze.\n\nWynalezienie #ORANGE szczepień#! ma szczególne znaczenie w walce z ospą. Dzięki tej technologii [concept_panum_physician] może opracować #V leczenie ospy#!. Pomóc może już nawet podstawowy system opieki zdrowotnej. Wszystko to prowadzi do skuteczniejszego zapobiegania chorobie i jej leczenia.\n\nAby raz na zawsze pokonać ospę, potrzebna jest #V szczepionka przeciw ospie#! opracowana przez [concept_theiler_biologist]."
 je_panum_typhus: "Epidemia tyfusu"
 je_panum_typhus_reason: "Although typhus has been known since the late Middle Ages, its most devastating effects occurred during the Napoleonic Wars. It therefore retained its horror for the generations after 1815. Typhoid fever can spread quickly to several countries. Regions with high devastation are particularly affected. It is therefore considered a classic war disease and particularly affects soldiers and their cramped barracks.\n\nThe invention of #ORANGE Antibiotics#! has particular significance in combating typhus. With this technology, a [concept_panum_physician] can find a #V Treatment for Typhus#!. Already a rudimentary health system will help. This all leads to better prevention and cure of the disease.\n\nIn order to defeat typhus once and for all, a #V Vaccine against Typhus#! is needed that is developed by a [concept_theiler_biologist]."
 je_panum_yellow_fever: "Epidemia Żółtej febry"
 je_panum_yellow_fever_reason: "Żółta febra jest chorobą występującą regionalnie w pobliżu stref tropikalnych, ale w XIX wieku rozprzestrzeniła się również na południe Stanów Zjednoczonych i do Europy. Zwykle obejmuje tylko kilka stanów, ale mimo to zbiera równie śmiertelne żniwo.\n\nWynalezienie #ORANGE profilaktyki malarii#! ma szczególne znaczenie w walce z żółtą febrą. Dzięki tej technologii [concept_panum_physician] może opracować #V leczenie żółtej febry#!. Pomóc może już nawet podstawowy system opieki zdrowotnej. Wszystko to prowadzi do skuteczniejszego zapobiegania chorobie i jej leczenia.\n\nAby raz na zawsze pokonać żółtą febrę, potrzebna jest #V szczepionka przeciw żółtej febrze#! opracowana przez [concept_theiler_biologist]."
 panum.100.t: "Epidemia cholery z [TimeKeeper.GetCurrentDate.Format('y')] roku"
 panum.100.d: "#YELLOW Cholera#!, jedna z najgorszych plag ludzkości, dotarła do jednego z naszych miast. Nadeszły mroczne czasy. Musimy liczyć się z tym, że rozprzestrzeni się po całym kraju i zbierze swoje żniwo."
 panum.100.f: "Cholera, endemicznie występująca w Azji Wschodniej, prawdopodobnie przez kilka stuleci pojawiała się na subkontynencie indyjskim w postaci lokalnych epidemii, lecz na innych kontynentach pozostawała nieznana. Pierwsza pandemia miała miejsce w latach 1817–1824 i objęła część Azji, a także Afrykę Wschodnią i Azję Mniejszą, a następnie Rosję i Europę. W 1830 roku pojawiła się we wschodniej Galicji i na Węgrzech, a w czerwcu 1831 roku w Wiedniu. W sumie nawiedziła świat w postaci sześciu pandemii i stała się plagą rodzącego się społeczeństwa przemysłowego. Chociaż większość zakażeń, około 85 procent, przebiega bezobjawowo, początkowa śmiertelność w przypadku nieleczonej choroby wynosi od 20 do 70 procent."
 panum.100.g: "Ponury Żniwiarz stoi u naszych drzwi."
 panum.102.t: "Epidemia cholery dociera do [SCOPE.sCountry('panum_infected_country').GetName]"
 panum.102.d: "Otrzymaliśmy doniesienia, że dziś w [SCOPE.sCountry('panum_infected_country').GetName] zgłoszono pierwsze przypadki cholery. Tamtejsze władze obwiniają nas o to, że nie zrobiliśmy wystarczająco dużo, by zapobiec jej rozprzestrzenianiu się."
 panum.102.g: "To ma być nasza wina...?"
 panum.103.t: "To ma być nasza wina...?"
 panum.103.d: "Kilka fabryk w [SCOPE.sState('panum_disease_state').GetName] zgłasza pierwsze przypadki cholery wśród robotników. Lokalne władze proponują wprowadzenie przepisów mających ograniczyć jej rozprzestrzenianie się. Miałoby to jednak ogromny wpływ na przemysł."
 panum.103.f: "Pierwszy przypadek cholery pojawił się w zeszłym tygodniu w młynie wodnym na obrzeżach miasta. Chociaż budynek objęto kwarantanną, w kilku manufakturach położonych dalej w dół rzeki doszło do kolejnych przypadków. Nadal nie wiadomo dokładnie, w jaki sposób choroba się rozprzestrzeniła, ale część lokalnych polityków uważa, że należy wprowadzić surowe ograniczenia, aby odzyskać utracone zaufanie ludności."
 panum.103.g: "Poddaj fabryki kwarantannie!"
 panum.103.h: "Fabryki muszą działać dalej, za wszelką cenę!"
 panum.104.t: "[SCOPE.sCharacter('disease_victim_scope').GetFullName] zachorował na cholerę!"
 panum.104.d: "Jeszcze kilka dni temu [SCOPE.sCharacter('disease_victim_scope').GetFullName] wydawał się całkowicie zdrowy, ale zeszłej nocy [SCOPE.sCharacter('disease_victim_scope').GetSheHe] zaczął wykazywać pierwsze objawy straszliwej choroby, która ogarnęła [ROOT.GetCountry.GetNameNoFlag]. [SCOPE.sCharacter('disease_victim_scope').GetHerHis|U] stan zdrowia jest opłakany."
 panum.104.f: "Pierwsze dwie fale cholery w XIX wieku pochłonęły również życie znanych osób. W Prusach podczas epidemii cholery w 1831 roku zmarli filozof Georg Friedrich Wilhelm Hegel oraz generał August Neidhardt von Gneisenau. Za ofiarę cholery uznaje się również kompozytora Piotra Iljicza Czajkowskiego, choć okoliczności jego śmierci — świadome lub nieświadome spożycie skażonej wody — pozostają przedmiotem sporu."
 panum.104.g: "Zapewnij najlepsze możliwe leczenie!"
 panum.104.h: "Nasz najlepszy lekarz osobiście zaopiekuje się [SCOPE.sCharacter('disease_victim_scope').GetHerHim]."
 panum.104.i: "[SCOPE.sCharacter('disease_victim_scope').GetSheHe|U] nie jest aż tak ważny..."
 panum.105.t: "Exodus bogatych"
 panum.105.d: "Klasa wyższa w [SCOPE.sState('panum_disease_state').GetName] wykorzystuje swoje zasoby finansowe, by jak najszybciej opuścić ten obszar lub schronić się na wsi. Zapłacono wiele łapówek, aby ominąć przepisy dotyczące kwarantanny. Zwykli ludzie patrzą na ten rozwój wydarzeń z pogardą."
 panum.105.f: "Jedną z cech cholery było to, że zabijała zarówno bogatych, jak i biednych, przez co przypominała dżumę ze średniowiecza. Wpływowe i zamożne rodziny starały się więc za wszelką cenę uniknąć zarazy. Arystokracja postrzegała cholerę jako swego rodzaju „chorobę rewolucyjną”, ponieważ nie rozróżniała klas społecznych. Pobłażliwe środki stosowane wobec klasy wyższej sprawiły, że ze względu na te konflikty społeczne cholera stała się również kwestią polityczną. Często wskazywano, że epidemie cholery z początku lat 30. XIX wieku w Europie pozostawały w związku z ruchami rewolucyjnymi."
 panum.105.g: "Niech odejdą."
 panum.105.h: "Nie bez powodu nazywamy ją WIELKIM WYRÓWNYWACZ."
 panum.106.t: "Opozycja próbuje wykorzystać epidemię cholery"
 panum.106.d: "Opozycja wykorzystuje epidemię do wyrównania rachunków: oskarża rząd o popełnienie ogromnych błędów w walce z epidemią."
 panum.106.f: "Ze względu na swoje społeczne i polityczne konsekwencje epidemie cholery były obszarem, w którym zwłaszcza liberałowie mogli obwiniać konserwatystów. Jako alternatywę dla „zacofanych” elit proponowano bardziej postępowe działania i nowe metody. Nie powinno dziwić, że ten podział między konserwatystami a liberałami powtarzał się później w innych okolicznościach i z udziałem innych ugrupowań."
 panum.106.g: "Macie rację, my się mylimy. A teraz walczmy z epidemią!"
 panum.106.h: "Ten rząd ma sytuację całkowicie pod kontrolą."
 panum.107.t: "Masowe Pochówki"
 panum.107.d: "Narasta krytyka nowo wykopanych masowych grobów w [SCOPE.sState('panum_disease_state').GetName]. Zwłaszcza niższe warstwy społeczne postrzegają ten proces jako niemal mechaniczne postępowanie zamiast należytej troski o zmarłych."
 panum.107.f: "W obliczu masowej liczby zgonów i możliwego ryzyka zakażenia zbiorowe grzebanie zmarłych stało się zjawiskiem nieuniknionym. Fakt, że zamożniejsi obywatele mogli sobie pozwolić na pogrzeb w tradycyjnej formie, podczas gdy ciała biednych po prostu grzebano, prowadził do silnych napięć społecznych."
 panum.107.g: "Nie mamy czasu do stracenia na pogrzeby!"
 panum.107.h: "Nie mamy czasu do stracenia na pogrzeby!"
 panum.108.t: "Szpitale choleryczne"
 panum.108.d: "Kilka partii politycznych, kierując się własnymi interesami, postanowiło utworzyć szpitale choleryczne, aby zapewnić opiekę niższym warstwom społecznym. Nie cieszą się one jednak zbyt dużą popularnością."
 panum.108.f: "Tworzenie masowych miejsc hospitalizacji podczas epidemii, takich jak cholera czy gruźlica, często budziło kontrowersje. Rodziny wolały opiekować się chorymi w domu, zamiast oddawać ich do anonimowych placówek, gdzie tłoczono ich na niewielkiej przestrzeni razem z innymi chorymi, przez co wielu ludzi było przekonanych, że właśnie tam zachorują i umrą. Krążyły oskarżenia, że środki te służyły przede wszystkim odizolowaniu biednych od bogatych, a tym samym ochronie tych drugich."
 panum.108.g: "W razie potrzeby bijcie ich w szpitalach!"
 panum.108.h: "W razie potrzeby bijcie ich w szpitalach!"
 panum.109.t: "Powszechna Panika"
 panum.109.d: "Pomimo najlepszych starań lokalnych władz w [SCOPE.sState('panum_disease_state').GetName] ludność zaczęła ulegać jednej z najgroźniejszych części każdej epidemii: panice."
 panum.109.f: "„Łatwo jest myśleć, że stoimy ponad wszystkimi innymi stworzeniami na tej Ziemi, lecz wystarczy zedrzeć cienką warstwę rozumu, by odkryć, że człowiek wciąż jest zwierzęciem, kierowanym strachem i lękiem przed nieznanym jutrem. Wybuch i rozprzestrzenianie się choroby potrafią napełnić przerażeniem serca nawet doświadczonych żołnierzy, bo jak walczyć z wrogiem, którego nie da się nawet zobaczyć? Nie, terror potrafi wgryźć się w ich serca i sprawić, że zaczną dostrzegać przeciwników na każdym kroku, a tam, gdzie są wrogowie, pojawia się potrzeba walki. Chory człowiek obrzucany kamieniami, by trzymał się z dala. Szepty o rodzinie, która od dawna nie wychodzi z domu. Spokojny i uczciwy człowiek przynosi do domu broń, obawiając się, że następne pukanie do drzwi oznaczać będzie drobną kradzież lub rabunek, a nie pomoc.\n\nTo nie jest koniec świata. To koniec złudzeń: człowiek jest zwierzęciem i się boi.”\n\nFragment artykułu prasowego o wybuchu epidemii w [TimeKeeper.GetCurrentDate.Format('y')] roku, opublikowanego w [SCOPE.sState('panum_disease_state').GetName] Times."
 panum.109.g: "Przeklęty strach! Jak mamy im pomóc, skoro nie chcą kierować się rozsądkiem?"
 panum.110.t: "Wspólny cel"
 panum.110.d: "Wybuch cholery w [SCOPE.sState('panum_disease_state').GetName] zdaje się wzmacniać poczucie jedności narodowej, a mieszkańcy regionu jednoczą się, by wspólnie walczyć z epidemią."
 panum.110.f: "„Sala szpitalna to ponure miejsce, ponieważ przypomina nam, że żyjemy w świecie pełnym chorób. Lecz choroba nie zważa na to, kim jesteś: nie obchodzi jej twoja religia, pan, któremu służysz, kolor twojej skóry ani poglądy polityczne, które są ci bliskie. Spójrz na łóżko, a zobaczysz mężczyznę, kobietę albo dziecko. Zobaczysz ludzi potrzebujących pomocy. Nie obchodzi ich, kto ją przyniesie. Nie obchodzi ich, czy lekarz jest księdzem, żołnierzem czy zwykłym robotnikiem, który poświęca odrobinę swojego wolnego czasu i naraża się, by pomóc nieznajomemu. Nie patrzą na niego jak na monarchistę, republikanina, agitatora czy kogokolwiek innego poza tym, kim naprawdę jest.\n\nPatrzą na niego i widzą człowieka. Brata, syna, rodaka, ale przede wszystkim drugiego człowieka.”\n\nFragment artykułu prasowego o wybuchu epidemii w [TimeKeeper.GetCurrentDate.Format('y')] roku, opublikowanego w [SCOPE.sState('panum_disease_state').GetName] Times."
 panum.110.g: "Stoimy zjednoczeni przeciwko cholerze!"
 panum.111.t: "Horror"
 panum.111.d: "Góry zwłok w [SCOPE.sState('panum_disease_state').GetName] piętrzą się coraz wyżej. Nie ma już nikogo, kto nie znałby przynajmniej jednej osoby zakażonej cholerą. Region stał się epicentrum epidemii."
 panum.111.f: "Sam Berlin został dotknięty cholerą trzynaście razy w ciągu 42 lat, między 1831 a 1873 rokiem. Szczególnie ciężki przebieg w całych Prusach miały epidemie z lat 1848/49, 1852, 1855 i 1866. W tym ostatnim przypadku oficjalnie zmarły na cholerę 114 683 osoby. Epidemia cholery w Londynie w latach 1848/1849 była znacznie poważniejsza niż epidemia z lat 1832/1832. Podczas tego wybuchu zmarło w Londynie 15 000 osób, czyli ponad 0,5 procent ówczesnej populacji miasta liczącej około 2,5 miliona mieszkańców. W pierwszym tygodniu września 1849 roku umierało 300 osób dziennie. Podczas trzeciej pandemii, w latach 1852–1860, w Rosji zmarło około miliona osób, czemu sprzyjała trwająca w tym samym czasie wojna krymska. Na tę chorobę zmarli brytyjski naczelny dowódca lord Raglan oraz dowódca francuskiej floty Armand Joseph Bruat. Uważa się, że więcej osób zmarło na cholerę niż w wyniku działań wojennych."
 panum.111.g: "Ilu jeszcze musi umrzeć?!"
 panum.120.t: "Epidemia cholery dobiega końca"
 panum.120.d: "Całe [ROOT.GetCountry.GetNameNoFlag] oddycha z ulgą: władze właśnie poinformowały, że na ostatnim obszarze dotkniętym chorobą nie ma już przypadków cholery. Stan wyjątkowy dobiegł końca. Teraz czas policzyć zmarłych i wrócić do normalności."
 panum.120.f: "„Niech Bóg będzie ze mną! Niech Niebo pobłogosławi ten Nowy Rok. Niech będzie to rok urodzaju, pokoju i pomyślności; niech będzie to rok pokoju i jedności dla całej ludzkości; niech świat zostanie uwolniony od cholery.” -Giacomo Meyerberr"
 panum.120.g: "Ale jakim kosztem?"
 panum.200.t: "Epidemia gruźlicy"
 panum.200.d: "W jednym z naszych stanów wybuchła epidemia: #YELLOW Gruźlica#! pustoszy [SCOPE.sState('panum_disease_state').GetName]!"
 panum.200.f: "We wczesnym średniowieczu gruźlica odgrywała w Europie niewielką rolę ze względu na niską gęstość zaludnienia. Silniej występowała jedynie w nielicznych dużych ośrodkach miejskich. Po wcześniejszym wybuchu we Włoszech w drugiej połowie XV wieku, w XVII wieku rozpoczęła się największa i najdłuższa fala gruźlicy w historii. W XIX i na początku XX wieku gruźlica stała się szeroko znana jako choroba endemiczna miejskiej biedoty. W 1815 roku w Anglii odpowiadała za jedną czwartą wszystkich zgonów, a w 1918 roku we Francji za jedną szóstą. Około 1880 roku w Niemczech co drugi zgon w grupie wiekowej od 15 do 40 lat był spowodowany tą chorobą. Gruźlica była również najczęstszą przyczyną śmierci na obszarach wiejskich."
 panum.200.g: "Czy jest chociaż czas na romantyczną śmierć?"
 panum.220.t: "Epidemia gruźlicy dobiega końca"
 panum.220.d: "Lekarze miejscy i wiejscy informują, że szczyt zachorowań na gruźlicę minął już kilka tygodni temu. Chociaż choroba nie zniknęła całkowicie, liczba przypadków wróciła do zwykłego poziomu."
 panum.220.f: "„Nie mogę się mylić co do tego koloru;\nta kropla krwi jest moim wyrokiem śmierci;\nmuszę umrzeć.” -John Keats"
 panum.300.t: "Epidemia Ospy"
 panum.300.d: "W jednym z naszych stanów wybuchła epidemia: #YELLOW Ospa prawdziwa#! pustoszy [SCOPE.sState('panum_disease_state').GetName]!"
 panum.300.f: "Ospa prawdziwa jest prawdopodobnie znana ludzkości od tysięcy lat i pojawiła się w pierwszych osadach w północno-wschodniej Afryce już 12 000 lat temu. Stamtąd mogła zostać przeniesiona do Indii przez egipskich kupców. Europejscy zdobywcy przywieźli ospę do Ameryki, gdzie od 1518 roku wywoływała wyniszczające epidemie wśród Indian, powodując miliony zgonów. W Europie ospę prawdziwą uważano czasem za chorobę wieku dziecięcego, a schorzenie, na które do końca XVIII wieku umierało nawet 10% wszystkich małych dzieci, nazywano również „chorobą dziecięcą”. Od XVIII wieku liczba przypadków ospy zaczęła rosnąć, a choroba zastąpiła dżumę jako najgroźniejszą epidemię. Szacuje się, że każdego roku na ospę umierało 400 000 osób, a jedna trzecia tych, którzy przeżyli, traciła wzrok. Często dzieci uznawano za pełnoprawnych członków rodziny dopiero wtedy, gdy przeżyły ospę. Mimo skutecznego wprowadzenia szczepień przeciw ospie około 1800 roku choroba pozostawała zagrożeniem epidemicznym aż do drugiej połowy XIX wieku."
 panum.300.g: "Zakładam, że kosmetyki wkrótce staną się popularne."
 panum.320.t: "Epidemia ospy prawdziwej dobiega końca"
 panum.320.d: "Straszliwa ospa prawdziwa, jedna z najgorszych plag ludzkości, powoli znika z [ROOT.GetCountry.GetNameNoFlag]. Ci, którzy przeżyli, pozostaną oszpeceni bliznami do końca życia."
 panum.320.f: "„Przyszłe narody będą wiedzieć jedynie z historii, że odrażająca ospa prawdziwa kiedyś istniała i że to dzięki wam została wytępiona.” -Thomas Jefferson"
 panum.400.t: "Epidemia tyfusu"
 panum.400.d: "W jednym z naszych stanów wybuchła epidemia: #YELLOW Tyfus#! pustoszy [SCOPE.sState('panum_disease_state').GetName]!"
 panum.400.f: "Tyfus plamisty, który prawdopodobnie występował już w starożytności, ale został wiarygodnie opisany dopiero w XVI wieku, pojawiał się przede wszystkim jako typowa epidemia towarzysząca wojnom i nędzy. Tyfus stał się poważnym problemem dla armii Napoleona podczas kampanii rosyjskiej. Gdy Wielka Armia, która wkroczyła do Rosji w czerwcu 1812 roku, wycofywała się jesienią 1813 roku, Moguncja była jej pierwszym przystankiem na ziemiach francuskich. Zmarło tam od 15 000 do 17 000 francuskich żołnierzy i równie wielu cywilów. Choroba, nazywana wówczas również „gorączką nerwową” ze względu na wywoływane przez nią objawy neurologiczne, zapisała się w języku francuskim jako Typhus de Mayence. Do końca października 1814 roku na frankońskich terenach wokół Wielkiego Księstwa Würzburga odnotowano 14 000 przypadków tyfusu, z czego 2500 zakończyło się śmiercią. Kolejna epidemia, która pochłonęła około dwóch i pół miliona ofiar, wybuchła w Rosji w latach 1918–1922 w wyniku wojny i wojny domowej."
 panum.400.g: "Może zmienisz ubranie?"
 panum.420.t: "Epidemia tyfusu dobiega końca"
 panum.420.d: "Wygląda na to, że najgorsza faza epidemii tyfusu dobiegła końca. Chociaż nie zakończono jeszcze liczenia ofiar, już teraz wiadomo, że nikogo nie można obarczyć odpowiedzialnością za ten straszliwy wybuch epidemii."
 panum.420.f: "„Jedynymi angielskimi pacjentami, jakich kiedykolwiek znałam, którzy odmawiali picia herbaty, byli chorzy na tyfus. Pierwszą oznaką ich powrotu do zdrowia było to, że znów zaczynali pragnąć herbaty”. – Florence Nightingale"
 panum.500.t: "Epidemia Żółtej febry"
 panum.500.d: "W jednym z naszych stanów wybuchła epidemia: #YELLOW żółta febra#! szerzy się w [SCOPE.sState('panum_disease_state').GetName]!"
 panum.500.f: "Żółta febra występuje endemicznie na obszarach tropikalnych i subtropikalnych Ameryki Południowej i Afryki. W XVIII i XIX wieku choroba dotknęła również Amerykę Środkową, Karaiby oraz południowe tereny dzisiejszych Stanów Zjednoczonych. Prawdopodobnie wywodzi się z Afryki, skąd dotarła do Nowego Świata za pośrednictwem atlantyckiego handlu trójkątnego. Pierwszy prawdopodobny wybuch epidemii miał miejsce na Jukatanie w 1648 roku, gdzie chorobę nazywano xekik (czarne wymioty). Później doszło do co najmniej 25 dużych epidemii, między innymi w Filadelfii w 1793 roku, kiedy zmarło kilka tysięcy osób, a amerykański rząd i ówczesny prezydent George Washington zostali zmuszeni do opuszczenia miasta. Jeden z najwcześniejszych medycznych opisów żółtej febry w Ameryce Północnej sporządził w 1756 roku John Lining, lekarz z Charlestonu, gdzie choroba wystąpiła w latach 1728 i 1732. Sporadyczne epidemie odnotowywano również w Europie, na przykład w Barcelonie w 1821 roku, gdzie zmarło kilka tysięcy osób. W 1867 roku epidemia wybuchła w Forcie Jefferson na Florydzie. W 1878 roku epidemia w dolinie Missisipi pochłonęła 20 000 ofiar, a ostatni wybuch żółtej febry w Stanach Zjednoczonych miał miejsce w Nowym Orleanie w 1905 roku."
 panum.500.g: "Czy winne są zepsute owoce?"
 panum.520.t: "Epidemia żółtej febry dobiega końca"
 panum.520.d: "Po tym, jak podstępna żółta febra zdziesiątkowała całe ulice i rodziny, lekarze i władze ogłaszają koniec zagrożenia: epidemia wreszcie dobiegła końca."
 panum.520.f: "„Nazywa się ją żółtą febrą, ale nie przypomina niczego, co lekarze dotąd znali lub o czym czytali”. – Thomas Jefferson"
