 panum_tuberculosis_hospital_modifier: "Szpital przeciwgruźliczy"
 panum.201.t: "Gruźlica rozprzestrzenia się na [SCOPE.sState('panum_disease_state').GetName]"
 panum.201.d: "Pomimo naszych usilnych starań epidemia gruźlicy rozprzestrzeniła się na kolejne obszary. Teraz szaleje również w [SCOPE.sState('panum_disease_state').GetName]."
 panum.201.g: "Biała śmierć wydaje się niepowstrzymana."
 panum.202.t: "Choroba dziedziczna?"
 panum.202.d: "Pomimo wszelkich badań medycznych pochodzenie gruźlicy nadal pozostaje przedmiotem sporów. Część naszego personelu medycznego zakłada, że jest to choroba dziedziczna lub przynajmniej wynikająca z „czynników wewnętrznych”. Inni lekarze uważają natomiast, że jest to typowa choroba zakaźna i zalecają podjęcie radykalnych środków."
 panum.202.f: "W XVIII i XIX wieku w krajach europejskich istniały różne poglądy na temat patogenezy chorób. Wielu ówczesnych autorów prac medycznych uważało gruźlicę, zwaną również suchotami, choć oba te pojęcia nie zawsze były ze sobą utożsamiane, za najgroźniejszą ze znanych wówczas chorób epidemicznych. Jej przyczyn upatrywano w zaburzeniach równowagi płynów ustrojowych, złowrogich wyziewach wydobywających się z ziemi, urbanizacji lub upadku obyczajów. We Włoszech natomiast tradycyjnie skłaniano się ku przekonaniu, że choroba ma charakter zakaźny, a więc może przenosić się z człowieka na człowieka. W związku z tym w połowie XVIII wieku Republika Wenecka wprowadziła obowiązek pisemnego zgłaszania przypadków suchot (wyniszczenia organizmu spowodowanego gruźlicą płuc). Rzeczy osobiste zmarłych na tę chorobę palono, aby ograniczyć ryzyko zakażenia. Z kolei w Anglii i krajach nordyckich powszechnie uważano, że choroba ma podłoże dziedziczne."
 panum.202.g: "To choroba dziedziczna i nic nie możemy na to poradzić."
 panum.202.h: "To choroba zakaźna i musimy zrobić wszystko, co w naszej mocy, aby powstrzymać jej rozprzestrzenianie się!"
 panum.203.t: "Plucie na ulicach"
 panum.203.d: "Ze względu na brak wiedzy o przyczynach gruźlicy podejmowane środki również budziły kontrowersje. Zwolennicy teorii o zakaźnym charakterze choroby opowiadali się za radykalnymi zakazami, w tym zakazem plucia w miejscach publicznych, aby zapobiec jej rozprzestrzenianiu się. Ograniczenia te dotykały szczególnie niższych warstw społecznych. Sceptycy postrzegali takie przepisy jedynie jako sposób na szykanowanie zwykłych ludzi."
 panum.203.f: "Choć zasady etykiety obowiązujące w XVIII wieku wyeliminowały niektóre „złe nawyki” wśród wyższych i średnich warstw społecznych, wiele wątpliwych pod względem higieny przyzwyczajeń przez długi czas pozostawało powszechnych wśród mas. Na początku XIX wieku chusteczki do nosa i spluwaczki nie były jeszcze szeroko rozpowszechnione w społeczeństwie, a zakazy plucia, na przykład w środkach transportu publicznego, zaczęto powszechnie wprowadzać dopiero na przełomie XIX i XX wieku."
 panum.203.g: "Zakażmy tego obrzydliwego nawyku!"
 panum.203.h: "Ogłośmy drakoński zakaz i niech winowajcy za to zapłacą!"
 panum.203.i: "Plucie leży w ludzkiej naturze i nie można go zakazać."
 panum.204.t: "[SCOPE.sCharacter('disease_victim_scope').GetFullName] zachorował na gruźlicę!"
 panum.204.d: "Epidemia gruźlicy dotknęła również naszego artystę [SCOPE.sCharacter('disease_victim_scope').GetFullName]! Co zaskakujące, [SCOPE.sCharacter('disease_victim_scope').GetSheHe] nie uważa tego za najgorszy cios od losu."
 panum.204.f: "Na początku XIX wieku, a także przez wiele kolejnych dziesięcioleci, gruźlicę uważano za „chorobę romantyczną”. Dawała ona chorym wystarczająco dużo czasu, by przygotować się na śmierć, a towarzyszącą jej bladość wielu postrzegało wręcz jako oznakę szlachetności. Pisarze uwieczniali ją w swoich dziełach, czego przykładem jest „Dama kameliowa” Aleksandra Dumasa syna. Podobną idealizację choroby można odnaleźć w operach Verdiego („La Traviata”) i Pucciniego („La Bohème”). George Sand, partnerka Chopina, miała podobno zauważyć: „Chopin kaszle z nieskończonym wdziękiem”."
 panum.204.i: "Czyż nie byłaby to inspirująca okazja do skomponowania requiem?"
 panum.204.j: "Ale czy gruźlica nie od zawsze była tematem dzieł literackich?"
 panum.204.k: "Ale czyż ta właśnie choroba nie skłania do ukazywania ludzkiego cierpienia?"
 panum.205.t: "Sanatorium przeciwgruźlicze"
 panum.205.d: "W obliczu epidemii gruźlicy szalejącej w [SCOPE.sState('panum_disease_state').GetName] jeden z tamtejszych lekarzy zaproponował, aby część zamożnych pacjentów przenieść w góry. Uważa się, że wysokogórski klimat i czyste powietrze mogą wyleczyć ich z choroby. W tym celu należałoby utworzyć specjalne sanatorium przeciwgruźlicze. [SCOPE.sState('panum_davos_scope').GetName] wydaje się idealnym miejscem na taką placówkę."
 panum.205.f: "Kuracja powietrzna jest formą klimatoterapii, którą od XIX wieku przez długi czas uważano za standardową metodę leczenia gruźlicy. Pacjenci spędzali kilka godzin dziennie, leżąc na leżakach na świeżym powietrzu lub w otwartych werandach wypoczynkowych. Kuracje powietrzne prowadzono w specjalnych sanatoriach przeciwgruźliczych. W Niemczech lekarz Hermann Brehmer jako pierwszy uznał gruźlicę, dotychczas uważaną za chorobę nieuleczalną, za możliwą do wyleczenia dzięki terapii powietrznej. W 1856 roku napisał rozprawę doktorską poświęconą możliwości leczenia przewlekłej gruźlicy płuc. Zakładał istnienie „miejsc odpornych na gruźlicę”, których klimat z jednej strony skutecznie chronił mieszkańców przed zachorowaniem, a z drugiej miał właściwości lecznicze w przypadku wystąpienia choroby. W Szwajcarii pionierem terapii powietrznej był pochodzący z Niemiec lekarz Alexander Spengler. W 1853 roku rozpoczął praktykę jako lekarz wiejski w Davos i wkrótce doszedł do wniosku, że mieszkańcy tego regionu na ogół nie chorują na gruźlicę, co przypisywał wysokogórskiemu klimatowi. Thomas Mann rozsławił Davos jako uzdrowisko klimatyczne w swojej powieści „Czarodziejska góra”."
 panum.205.g: "Wybudujmy sanatorium w [SCOPE.sState('panum_davos_scope').GetName]!"
 panum.205.h: "To wszystko zwykła szarlataneria dla bogaczy."
 panum.206.t: "Choroba proletariuszy"
 panum.206.d: "Epidemia gruźlicy w [SCOPE.sState('panum_disease_state').GetName] najdotkliwiej uderza w niższe warstwy społeczne. W związku z tym [SCOPE.sCharacter('union_leader').GetFullName] ostro skrytykował panujące warunki i wezwał do daleko idących zmian."
 panum.206.f: "W XIX i na początku XX wieku gruźlica przyciągała powszechną uwagę jako choroba endemiczna dotykająca ubogich mieszkańców miast. W 1815 roku w Anglii odpowiadała za jedną czwartą wszystkich zgonów, a w 1918 roku we Francji za jedną szóstą. Około 1880 roku w Niemczech co drugi zgon wśród osób w wieku od 15 do 40 lat był spowodowany tą chorobą."
 panum.206.g: "Może biedni powinni po prostu częściej się myć?"
 panum.206.h: "Uzasadnione jest wprowadzenie wybranych usprawnień w tym zakresie."
 panum.206.i: "Kwestia opieki zdrowotnej to sprawa całego narodu."
 panum.206.j: "Brawa za tę inicjatywę!"
 panum.207.t: "Inicjatywa religijna"
 panum.207.d: "[SCOPE.sCharacter('devout_leader').GetFullName] osobiście zaangażował się w pomoc licznym chorym w [SCOPE.sState('panum_disease_state').GetName]. [SCOPE.sCharacter('devout_leader').GetSheHe|U] pragnie wkrótce założyć tam szpital działający na zasadach non-profit."
 panum.207.f: "„Nie ma już niemal kraju, w którym w taki czy inny sposób nie podjęto by walki z gruźlicą. Niezwykle budujące jest obserwowanie, jak powszechnie i z jak wielką determinacją prowadzi się obecnie walkę z tym niebezpiecznym wrogiem”. – Robert Koch"
 panum.207.g: "Ci kaznodzieje próbują jedynie zdobyć wpływy!"
 panum.208.t: "Biała zaraza zbiera swoje żniwo"
 panum.208.d: "Epidemia gruźlicy w [SCOPE.sState('panum_disease_state').GetName] przybrała na sile. Liczba chorych i zmarłych rośnie z każdym dniem. Żaden z lekarzy nie spodziewał się takiego rozwoju wydarzeń."
 panum.208.f: "„Jakże blado wyglądam! Myślę, że chciałbym umrzeć na suchoty… bo wtedy wszystkie kobiety mówiłyby: «Spójrzcie na biednego Byrona – jakże interesująco wygląda, umierając!»” – Lord Byron"
 panum.208.g: "Czy to się nigdy nie skończy?"
