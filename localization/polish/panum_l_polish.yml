 panum.1001.t: "Nowa epidemia"
 panum.1001.d: "Poliomyelitis była chorobą znaną w XIX wieku pod wieloma różnymi nazwami. Szokujące doniesienia o przypadkach polio kończących się kalectwem i śmiercią w [SCOPE.sState('panum_disease_state').GetName] pojawiają się coraz częściej. To, co wcześniej było chorobą występującą jedynie w odosobnionych przypadkach, teraz wydaje się pojawiać regularnie. Polio stało się chorobą epidemiczną."
 panum.1001.g: "Niepokojące wieści."
 panum.1002.d: "Kilka gazet niezależnie od siebie donosi, że w [SCOPE.sState('panum_disease_country').GetName] szaleje ciężka epidemia polio. Choroba, która wcześniej występowała jedynie w odosobnionych przypadkach, wydaje się teraz przybrać formę epidemii!"
 panum.1003.t: "Gwałtowna epidemia"
 panum.1003.d: "Epidemia polio w [SCOPE.sState('panum_disease_state').GetName] okazała się szczególnie dotkliwa. Liczba zgonów rośnie z każdym dniem."
 panum.1003.f: "„Rankiem trzeciego dnia mojego pobytu w szpitalu, który przypadał na pierwszy lub drugi dzień września, dostałam na śniadanie płatki, sok i mleko czekoladowe. Pamiętam, że próbowałam podnieść mleko czekoladowe, ale prześlizgnęło mi się prosto przez dłoń. Czułam się tak źle, ponieważ nie mogłam już się ruszać. Pielęgniarki natychmiast wbiegły do sali i posprzątały bałagan. Pamiętam, że chciałam napić się mleka czekoladowego, ale nie dostałam go. Zamiast tego przyniosły mi słomkę i wypiłam trochę soku. Potem do mojego pokoju przyszli lekarze i kazali mi odliczać wspak: 10-9-8-7-6, tak długo, jak tylko pamiętam. Wtedy leżałam, ponieważ miałam trudności z utrzymaniem pozycji siedzącej.”\n\nMarilynne R., osoba, która przeżyła polio"
 panum.1003.g: "Czy nie ma na to lekarstwa?"
 panum.1004.t: "Złamane pokolenie"
 panum.1004.d: "Im dłużej trwa epidemia w [SCOPE.sState('panum_disease_state').GetName], tym bardziej staje się to oczywiste: całe pokolenie będzie musiało żyć z okaleczeniami i paraliżem."
 panum.1004.f: "„Bardzo dobrze pamiętam dzień, w którym zdiagnozowano u mnie polio. Tego ranka byłem na lekcji wychowania fizycznego w szkole, a my byliśmy na boisku do futbolu, grając w bezkontaktową odmianę tej gry. Zauważyłem, że podczas biegu moja noga stawała się słaba albo jakby się pode mną uginała. Nie przywiązywałem do tego większej wagi, ale później tego samego dnia grałem z licealną orkiestrą marszową podczas parady charytatywnej na rzecz chorych na polio w Hibbing, około 30 mil od Coleraine, gdzie dorastałem. Podczas marszu moje nogi ponownie zaczęły słabnąć. W rzeczywistości były tak słabe, że musiałem opuścić kolumnę marszową i wróciłem do autobusu szkolnego, żeby się położyć.”\n\nDavid K., osoba, która przeżyła polio"
 panum.1004.g: "Ten skutek będzie trwał przez długi czas..."
 panum.1005.t: "Osoby, które przeżyły polio"
 panum.1005.d: "Mówi się, że ci, którzy przeżyli tę epidemię, noszą w sobie głęboki gniew. Jest to forma zemsty na chorobie, która tak bardzo ich wyniszczyła. W naszym kraju powstaje coraz więcej stowarzyszeń osób, które przeżyły polio."
 panum.1005.f: "„Bycie innym jest naprawdę trudne, gdy jest się w liceum. Skończyło się na tym, że nie brałam udziału w wielu rzeczach, w których prawdopodobnie brałabym udział, gdyby nie moja niepełnosprawność. Chciałabym spróbować dostać się do drużyny cheerleaderek, ale ludzie wyśmiewali mnie już za samo mówienie o tym. W rezultacie zaczęłam ukrywać w sobie wiele uczuć. Nie chciałam iść na potańcówkę, ponieważ czułam skrępowanie z powodu mojego utykania. Nie chciałam, żeby ludzie patrzyli na mnie, gdy przechodziłam przez parkiet. Nienawidziłam, gdy ludzie gapili się na mnie i śmiali się ze mnie. Myślę, że wszyscy nastolatkowie są niepewni siebie, ale kiedy ma się jakąś fizyczną niepełnosprawność, ta niepewność staje się jeszcze silniejsza. Do dziś nie znoszę, gdy ludzie patrzą na moją nogę, kiedy noszę krótkie spodenki.”\n\nGail B., osoba, która przeżyła polio"
 panum.1005.g: "Społeczeństwo obywatelskie jednoczy się przeciwko polio."
 panum.1006.t: "Polityk zakłada fundację na rzecz polio"
 panum.1006.d: "W obliczu szalejącej epidemii polio, pogrążonych w żałobie rodziców, okaleczonych i zmarłych, [SCOPE.sCharacter('panum_opposition_leader').GetFullName] wpadł na pomysł założenia fundacji mającej na celu walkę z chorobą. Krytycy twierdzą, że próbuje jedynie poprawić swoją reputację polityczną."
 panum.1006.f: "Prezydent Stanów Zjednoczonych Franklin D. Roosevelt regularnie przebywał w uzdrowisku Warm Springs od 1924 roku i zmarł tam w 1945 roku. W 1921 roku doznał paraliżu nóg, który uznano za rdzeniowe polio; według nowszych badań była to choroba Guillaina-Barrégo, która w tamtym czasie była jeszcze mało znana. Roosevelt założył Georgia Warm Springs Foundation w 1927 roku, której główną misją miało być początkowo leczenie paraliżu rdzeniowego. Obecnie placówka nosi nazwę Roosevelt Warm Springs Institute for Rehabilitation i opiekuje się pacjentami z różnymi rodzajami niepełnosprawności w dwudziestu sześciu różnych oddziałach."
 panum.1006.g: "Prawdziwy filantrop."
 panum.1006.h: "A nadchodzące wybory to oczywiście czysty przypadek, prawda?"
 panum.1009.t: "Publiczna panika"
 panum.1009.d: "Pomimo najlepszych wysiłków lokalnego rządu w [SCOPE.sState('panum_disease_state').GetName], ludność zaczęła ulegać jednej z najgroźniejszych części każdej epidemii: panice."
 panum.1009.f: "W sobotę 17 czerwca 1916 roku w Brooklynie w Nowym Jorku oficjalnie ogłoszono istnienie epidemii polio. W tym samym roku w Stanach Zjednoczonych odnotowano 27 363 przypadki oraz 7 130 zgonów z powodu polio, z czego ponad 2 000 zgonów miało miejsce w samym Nowym Jorku. Epidemia z 1916 roku wywołała powszechną panikę, a tysiące osób uciekły z miasta do pobliskich górskich kurortów; kina zostały zamknięte, spotkania odwołano, zgromadzenia publiczne niemal całkowicie zanikły, a dzieci ostrzegano przed piciem wody z publicznych kranów oraz nakazywano im unikać parków rozrywki, basenów i plaż."
 panum.1009.g: "Przeklęty strach!"
 panum.1010.t: "Kwarantanna"
 panum.1010.d: "Chociaż nie jest jasne, czy polio jest chorobą zakaźną, w [SCOPE.sState('panum_disease_state').GetName] pojawia się coraz więcej głosów za wprowadzeniem kwarantanny, aby zapobiec jego rozprzestrzenianiu się."
 panum.1010.f: "Choroba uderzała bez ostrzeżenia i wymagała długich okresów kwarantanny, podczas których rodzice byli oddzielani od dzieci: nie można było przewidzieć, kto zachoruje, a kto uniknie choroby. Nazwiska i adresy osób z potwierdzonymi przypadkami polio były codziennie publikowane w prasie, ich domy oznaczano tabliczkami, a ich rodziny poddawano kwarantannie."
 panum.1010.g: "To przyniesie więcej szkody niż pożytku."
 panum.1010.h: "Wprowadź ścisły nakaz kwarantanny."
 panum.1020.t: "Koniec epidemii polio"
 panum.1020.d: "Kliniki w [SCOPE.sState('panum_disease_state').GetName] donoszą, że liczba przypadków polio wyraźnie spadła. Skutki epidemii będą jednak przez wiele lat nadal dotykać tego regionu."
 panum.1020.f: "„Nie jestem chora. Jestem złamana. Ale cieszę się, że żyję, dopóki mogę malować.” — Frida Kahlo"
 panum.1022.t: "Początki poliomyelitis"
 panum.1022.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] przesłał dziś krótkie podsumowanie objawów występujących podczas początkowego stadium poliomyelitis."
 panum.1022.f: "„Zdrowe i zazwyczaj dobrze wyglądające dzieci w wieku od 6 do 36 miesięcy, w wyjątkowych przypadkach nieco starsze, po wcześniejszym okresie bezproblemowego zdrowia zaczynają chorować, z wcześniejszymi oznakami niedyspozycji lub bez nich, takimi jak: przewracanie oczami, nagłe występowanie stanów gorączkowych, przekrwienia i podrażnienia, gorączka, pragnienie, rozdrażnienie, płacz, senność bez rzeczywistego snu, a czasami również objawy zaburzonego przebiegu ostrych procesów chorobowych z wysypką. Wkrótce potem pojawiają się drgawki o łagodnym lub cięższym nasileniu, powtarzające się w krótszych lub dłuższych odstępach czasu.\n\nW innych przypadkach choroba pojawia się nagle, bez wymienionych objawów, wraz z drgawkami lub nudnościami, osłabieniem ciała, pienieniem się z ust i nosa, sinieniem itd.\n\nCzasami jednak wszystkie te objawy nie występują albo pojawiają się jedynie w bardzo łagodnym stopniu, a paraliż rozwija się powoli i niezauważalnie.”"
 panum.1040.t: "Wkład w poznanie choroby Heinego-Medina"
 panum.1040.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] przedstawił dziś Wydziałowi Medycyny przełomową pracę, która posłuży jako punkt wyjścia do opanowania epidemii polio — oraz poprawy leczenia osób, które przeżyły polio."
 panum.1040.f: "W [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] „Badaniach nad chorobą Heinego-Medina” doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] wspomniał o kilku aspektach, które powinny pomóc w zapobieganiu poliomyelitis i jego rozprzestrzenianiu się. Kluczowym odkryciem jest to, że polio jest chorobą zakaźną. Oprócz wynikających z tego środków zapobiegawczych istnieje również wiele metod pomagających pacjentom. Diety bogate w białko, programy fizjoterapii oraz nowe wynalazki, takie jak żelazne płuco, dają nową nadzieję, że polio może nie zostać całkowicie wyeliminowane, ale w przyszłości będzie można lepiej nad nim panować."
 panum.1040.g: "Potrzebujemy Galerii Sław Polio."
 panum.1041.t: "Fizjoterapia"
 panum.1041.d: "Doktor spotyka pielęgniarkę, która wywraca [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] dotychczasową wiedzę o leczeniu polio do góry nogami."
 panum.1041.f: "„I od jak dawna zajmuje się pan tym teraz?”\n„Od dziesięciu lat, doktorze.”\n„Podkłada pan pacjentom termofory?”\n„Tak, doktorze.”\n„I twierdzi pan, że to pomaga?”\n„Pański sceptycyzm nie może przesłonić sukcesu. Nie chodzi tylko o termofor. Potrzebne są masaże i ćwiczenia relaksacyjne. Mięsień, który jest unieruchomiony, przestaje się rozwijać. Potrzebuje ruchu.”\n„Hmm...”"
 panum.1041.g: "Ale... pacjenci z polio potrzebują odpoczynku i unieruchomienia!"
 panum.1042.t: "Ulica"
 panum.1042.d: "Podczas badania obszaru występowania epidemii polio doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] postępuje metodycznie."
 panum.1042.f: "„Jeśli ktoś prześledzi rozprzestrzenianie się poliomyelitis szalejącego w [SCOPE.sState('panum_disease_state').GetCityHubName], nie może przeoczyć interesującego odkrycia. Zachorowania układają się niczym sznur pereł. Można podążać wzdłuż drogi i obserwować przypadki jeden obok drugiego. Udało mi się prześledzić chronologiczne występowanie choroby na linii kolejowej w tym regionie. To nie jest przypadek.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], [SCOPE.sState('panum_disease_state').GetCityHubName]"
 panum.1042.g: "Ale czy to wystarczający dowód na zakaźność?"
 panum.1043.t: "Parafia"
 panum.1043.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] odwiedził odległą społeczność na obszarze dotkniętym epidemią, aby kontynuować swoje badania nad przyczynami choroby polio."
 panum.1043.f: "„49 przypadków w tej społeczności?”\n„Jako burmistrz żałuję, że muszę to powiedzieć, doktorze.”\n„Kiedy sporządzał pan mapę miejsc, w których wystąpiły te przypadki w parafii, zauważył pan coś?”\n„Z całym szacunkiem, nie jestem naukowcem.”\n„Choroba rozprzestrzenia się od jednego punktu. To wiejska szkoła.”"
 panum.1043.g: "Czy polio nie jest przypadkiem chorobą zakaźną, a nie dziedziczną?"
 panum.1044.t: "Filantropia"
 panum.1044.d: "Osoby, które przeżyły polio, zwróciły się do doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName]. Chcą wesprzeć za pomocą fundacji prace naukowe związane z badaniami nad polio."
 panum.1044.f: "Na początku XX wieku polio było chorobą, która niepokoiła znaczną część społeczeństwa, ponieważ jej przyczyny były nieznane, a dotknąć mogła nawet klasy średnie i osoby zamożne. Niektóre osoby, które przeżyły polio i zdobyły majątek, przez całe życie angażowały się w walkę z chorobą oraz wspierały prywatne i rządowe inicjatywy. Polio jest chorobą, w której zwalczaniu filantropia odegrała bardzo ważną rolę."
 panum.1044.g: "Cenne wsparcie."
 panum.1044.h: "Pieniądze powinny być również przeznaczone na badania nad szczepionkami."
 panum.1044.i: "Pieniądze z fundacji przysłużyłyby się również ogólnym badaniom naukowym."
 panum.1045.t: "Antybiotyki"
 panum.1045.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] osiągnął sukces w leczeniu polio dzięki zastosowaniu antybiotyków."
 panum.1045.f: "„Nie ma lekarstwa na polio. I niestety nie widzę, jak mogłoby się to stać możliwe w przyszłości. Pozostaje jedynie zapobieganie, badanie przyczyn i unikanie rozprzestrzeniania się choroby — oraz leczenie mające na celu łagodzenie objawów. Antybiotyki mogą pomóc chronić osłabione mięśnie przed infekcjami. To krok we właściwym kierunku. Miejmy nadzieję, że za nim pójdą kolejne.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], [SCOPE.sState('panum_disease_state').GetCityHubName]"
 panum.1045.g: "Za antybiotyki!"
 panum.1046.t: "Wykluczenie społeczne"
 panum.1046.d: "W artykule dotyczącym reform doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] wskazał swoim akademickim kolegom, że ponowna integracja osób, które przeżyły polio, oznacza coś więcej niż tylko wyleczenie, leczenie lub łagodzenie skutków choroby. Należy zmniejszyć — a następnie całkowicie wyeliminować — społeczne piętno dotykające tych osób."
 panum.1046.f: "„Pamiętam, że największym wyzwaniem dla mnie było wejście do szkolnego autobusu. Ten pierwszy stopień do autobusu wydawał się oddalony o milę i po prostu nie byłam w stanie tego zrobić. Przez pewien czas moja mama wychodziła ze mną i było to tak krępujące, ponieważ przynosiła ze sobą stołek. Ale nie mogłam znieść tego zakłopotania, więc mój tata i kierowca autobusu (miał na imię Bill i bardzo dobrze go pamiętam) usiedli razem i zastanowili się, jak rozwiązać ten problem. Mój tata zrobił tak, że wyszedł tam, gdzie zatrzymywał się autobus, i wykopał w ziemi rów. Bill wjeżdżał przednim kołem autobusu do tego rowu, co obniżało stopień tak, że znajdował się on naprawdę blisko ziemi. Wtedy mogłam po prostu wejść do autobusu bez problemu. I tak naprawdę nikt tego nie zauważał...”\n\nJennifer W., osoba, która przeżyła polio"
 panum.1046.g: "Osoby, które przeżyły polio, nie są obywatelami drugiej kategorii."
 panum.1047.t: "Cena postępu"
 panum.1047.d: "Podczas swojego śledztwa w sprawie przyczyn trwających od lat epidemii polio doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] doszedł do nieprzyjemnej prawdy."
 panum.1047.f: "„Polio jest znane od czasów starożytnych, ale — o ile pozwalają mi stwierdzić moje badania — aż do końca XIX wieku nie było chorobą epidemiczną taką, jaką jest dziś. Powód tego, jeśli zostanie potwierdzony, jest paradoksalny: lepsza opieka zdrowotna. Przed wprowadzeniem kanalizacji i zasad sanitarnych dzieci były narażone na polio znacznie wcześniej, mniej więcej między 6 miesiącem a 4 rokiem życia. W tym okresie choroba ma łagodniejszy przebieg i zapewnia odporność. Im starsza jest osoba zakażona polio, tym większe prawdopodobieństwo wystąpienia paraliżu. Poprawa standardów higieny sprawiła, że mniej osób nabrało odporności i stało się bardziej podatnych na niebezpieczne skutki choroby.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], [SCOPE.sState('panum_disease_state').GetCityHubName]"
 panum.1047.g: "Choroba rozprzestrzenia się, ponieważ zdrowie publiczne się poprawiło?"
 panum.1048.t: "Bakteria czy wirus?"
 panum.1048.d: "Nic nie wiadomo jeszcze o czynniku wywołującym poliomyelitis. Z tego powodu doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] znajduje [ROOT.Var('panum_physician_var').GetCharacter.GetHerselfHimself] w ożywionym sporze z kolegami."
 panum.1048.f: "Chociaż poliomyelitis było znane od dawna, a wraz z rozwojem mikrobiologii stało się jasne, że jest wywoływane przez czynnik chorobotwórczy, przez długi czas nadal istniały różne poglądy na temat tego, czy za polio odpowiadają bakterie, czy wirusy."
 panum.1048.g: "Wszystko wskazuje na wirusa."
 panum.1048.h: "Te bezużyteczne pogadanki odciągają doktora od jego pracy!"
 panum.1049.t: "Akceptacja wózków inwalidzkich"
 panum.1049.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] odkrył, że ważne jest nie tylko zapewnienie pacjentom wózków inwalidzkich — muszą one również zostać zaakceptowane społecznie, aby osoby, które przeżyły polio, mogły łatwo powrócić do normalnego życia."
 panum.1049.f: "„Byłem naprawdę dość naiwny, jeśli chodzi o pójście na studia, i byłem zaskoczony, gdy odkryłem, że uniwersytet nie był przystosowany dla osoby poruszającej się na wózku inwalidzkim. Ale wtedy tak po prostu było. Wszędzie były schody i nie było tak jak w liceum, gdzie miałem grupę przyjaciół, którzy mogli mnie nosić... Wiele razy musiałem prosić grupę wolontariuszy albo po prostu zaczepiać ludzi, gdy spieszyli się z zajęć na zajęcia, a czasami odpowiadali: „Po prostu nie mam czasu. Nie mogę ci pomóc”. Musiałem mieszkać w mieszkaniu poza kampusem, ponieważ żaden z akademików nie był przystosowany.”\n\nDavid K., osoba, która przeżyła polio"
 panum.1049.g: "Wspieramy kampanię na rzecz większej akceptacji wózków inwalidzkich."
 panum.1049.h: "Sfinansuj program budowy podjazdów dla wózków inwalidzkich przy budynkach publicznych."
 panum.1051.t: "Porady dotyczące polio"
 panum.1051.d: "W środowisku akademickim krąży obecnie zalecenie dotyczące postępowania w przypadku choroby polio, które sprawia doktorowi [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] wiele trudności w forsowaniu [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] własnych tez dotyczących leczenia polio."
 panum.1051.f: "„Podawać tlen przez kończyny dolne za pomocą dodatniej elektryczności. Częste kąpiele z użyciem mączki migdałowej lub utlenianie wody. Stosować okłady z rumianku rzymskiego, wiązu śliskiego, arniki, gorczycy, kantarydyny, oleju ze słodkich migdałów, a szczególnie godne polecenia oleju nardowego i Xanthoxolinum. Wewnętrznie stosować kofeinę, Fl. Kola, suchy chlorek chininy, eliksir chinowy, wodę radową, chlorek złota, liquor calcis oraz wino pepsynowe.”\n\nDr Angelika Hasenbein, „Monografia epidemii poliomyelitis (porażenia dziecięcego)”"
 panum.1051.g: "To właściwie brzmi bardzo przekonująco."
 panum.1052.t: "Gipsy i aparaty ortopedyczne"
 panum.1052.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] dowiedział się od kilku „ekspertów od polio”, że szyny na nogi są najlepszym sposobem na poprawę początkowego stanu pacjentów — ale [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] nie jest o tym przekonany."
 panum.1052.f: "Pacjentów z pozostałościami porażenia leczono za pomocą aparatów ortopedycznych i uczono ich kompensowania utraconych funkcji przy pomocy szyn, kul oraz wózków inwalidzkich. Stosowanie urządzeń takich jak sztywne aparaty ortopedyczne i gipsowe opatrunki na całe ciało, które ze względu na ograniczenie ruchu użytkownika często prowadziły do zaniku mięśni, również przedstawiano jako skuteczne metody leczenia. Większość z tych metod okazała się mieć niewielką wartość terapeutyczną."
 panum.1052.g: "Może to pomaga...?"
 panum.1053.t: "Bezużyteczna operacja"
 panum.1053.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] został zapewniony przez chirurgów, że zabiegi chirurgiczne mają pozytywny wpływ na polio."
 panum.1053.f: "„Spędziłem niezliczone godziny, przeprowadzając rozmowy z kolegami, studiując książki i badając pacjentów, aby przekonać się o skuteczności interwencji chirurgicznych w przypadku polio. Lekarze są bardzo dumni ze swoich wyników. Sposób, w jaki radzą sobie z okaleczeniami, przypomina precyzyjnych mechaników, którzy wierzą, że składają mechanizm zegarowy. Używają precyzyjnych narzędzi do pracy nad ludzkimi maszynami. Jednak moje wrażenie jest takie, że nie skupiają się tutaj na chorobie ani na pacjencie — lecz na reputacji lekarzy. Jak dotąd nie znam żadnego przypadku, w którym ta metoda rzeczywiście doprowadziła do skutecznego leczenia polio.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], [SCOPE.sState('panum_disease_state').GetCityHubName]"
 panum.1053.g: "Fałszywy trop."
 panum.1054.t: "Surowica rekonwalescentów"
 panum.1054.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] wypróbował wysoko cenioną surowicę, która jest uważana za skuteczny środek w obecnej medycynie zajmującej się polio. Chociaż [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] koledzy są przekonani do tej metody, doktor uważa ją za stratę czasu."
 panum.1054.f: "„W tamtym czasie sądzono, że jest to choroba zakaźna, więc podano mi coś, co nazywano „surowicą rekonwalescentów”, wytwarzaną z krwi osób, które wyzdrowiały z polio. Ta forma leczenia była wtedy popularna. Wydaje się mało prawdopodobne, aby miała jakikolwiek wpływ, ponieważ choroba postępowała, prowadząc do znacznego paraliżu — bez ruchu w żadnej nodze i bez ruchu mięśni brzucha. Umieszczono mnie w izolacji i wydaje mi się, że mogłem zostać poinformowany, że mam poliomyelitis. Nie wiedziałem jednak, czym jest poliomyelitis. Nikt nie powiedział mi, że mam porażenie dziecięce, które rozpoznałbym, ponieważ w tamtym czasie prezydentem był Roosevelt i wiedziałem, że cierpiał z powodu znacznego paraliżu wywołanego tą chorobą.”\n\nRichard O., osoba, która przeżyła polio"
 panum.1054.g: "Ale przecież każdy lekarz to przepisuje?"
 panum.1055.t: "Izolacja"
 panum.1055.d: "Oprócz unieruchamiania kończyn niektórzy eksperci od polio uważają, że wskazane jest całkowite izolowanie pacjentów. Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] sam przeprowadził takie eksperymenty — i doszedł do wniosku, że była to nieskuteczna i nieludzka terapia."
 panum.1055.f: "„Po wykonaniu nakłucia lędźwiowego i postawieniu diagnozy polio natychmiast umieszczono mnie w izolacji i powiedziano mi, że nie powinnam podnosić głowy. Pamiętam, że położyli mnie w łóżeczku! Miałam dziewięć lat i nie mogłam zrozumieć, dlaczego umieszczono mnie w łóżeczku. Było to bardzo upokarzające. Z pewnością nie miałam zamiaru wychodzić z łóżka ani prawdopodobnie przekręcić się i z niego wypaść. W rzeczywistości ledwo mogłam się poruszać. Leżąc tam w tym łóżeczku, czułam, jak wirus naprawdę zaczyna działać. To było jak zatrzaśnięcie drzwi. Czułam, jakby mój świat całkowicie się zmienił. Żeby było jeszcze gorzej, było strasznie gorąco i wilgotno, a oczywiście było to jeszcze przed wynalezieniem klimatyzacji; pamiętam, że czułam się bardzo niekomfortowo...”\n\nSharon K., osoba, która przeżyła polio"
 panum.1055.g: "To jest nie do zaakceptowania!"
 panum.1055.h: "To może być początek drugiej kariery."
 panum.1055.i: "Niech te zapisy szybko znikną."
 panum.1056.t: "Zespół post-polio"
 panum.1056.d: "Podczas niedawnego badania doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] odkrył, że po przebyciu właściwej infekcji polio, wraz z jej skutkami, mogą wystąpić późniejsze następstwa w postaci zespołu post-polio. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] jest całkowicie zrozpaczony tym odkryciem."
 panum.1056.f: "„Kiedy miałam około 35 lub 40 lat, zaczęłam odczuwać straszny ból stawów i mięśni. Bardzo szybko się męczyłam. Poszłam do lekarza i miałam wykonane zdjęcia rentgenowskie oraz badania krwi. Dostałam jakieś tabletki i przeszłam fizjoterapię. Nic nie pomogło.\nCzekając, aż odnajdą dokumentację, wyjaśniłam osobie, która mi pomagała, że odczuwam wszystkie te nowe bóle i miałam nadzieję, że dokumentacja pomoże wyjaśnić, dlaczego tak się dzieje. Wtedy zapytała, czy słyszałam o zespole post-polio. Odpowiedziałam: „Nie, co to takiego?” Wyjaśniła, że około 30 lub 40 lat po przebyciu polio jest tak, jakby choroba wracała ponownie.\nMyśl o ponownym zmaganiu się z polio była dla mnie nie do zniesienia. Całkowicie się załamałam. Zadzwoniłam do swojej szwagierki i powiedziałam jej, czego się dowiedziałam. Powiedziałam też mojej rodzinie. Dużo płakałam. Pokazałam moim miejscowym lekarzom moją dokumentację medyczną i wyjaśniłam sprawę mojej wizyty w Sister Kenny Institute. Oni ponownie powiedzieli mi, że polio należy już do przeszłości. Odpowiedziałam: „Tak, ale ja jestem tutaj teraz i znowu przez to przechodzę!”\n\nJanice G., osoba, która przeżyła polio"
 panum.1056.g: "Cóż za beznadziejna sytuacja."
 panum.1061.t: "Eksperymenty"
 panum.1061.d: "W wątpliwym, lecz nie mniej udanym eksperymencie doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zaraził małpy polio."
 panum.1061.f: "„Niedawno przeczytałem o procedurze, którą Jean-Antoine Villemin wykorzystał do udowodnienia zakaźności gruźlicy. Przeprowadził eksperymenty na królikach, celowo doprowadzając do ich kontaktu z tkankami osób chorych na gruźlicę. Po dziesiątkach martwych zwierząt udało mu się udowodnić swoją tezę. Mój eksperyment z małpami opiera się na podobnym założeniu.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], [SCOPE.sState('panum_disease_state').GetCityHubName]"
 panum.1061.g: "Jeśli można zarazić zwierzęta, to ludzie również mogą zarażać się między sobą."
 panum.1062.t: "Żelazne płuco"
 panum.1062.d: "Genialny inżynier [ROOT.Var('tesla_engineer_var').GetCharacter.GetFullName] pomógł doktorowi [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zbudować genialne urządzenie, które zrewolucjonizowało leczenie polio."
 panum.1062.f: "Żelazne płuco było jednym z pierwszych urządzeń klinicznych umożliwiających mechaniczną wentylację człowieka. Około 1920 roku amerykański inżynier Philip Drinker opracował je w celu wentylacji pacjentów z chorobami płuc. Ciało pacjenta, z wyjątkiem głowy, znajduje się całkowicie wewnątrz pustego cylindra. Urządzenie szczelnie zamyka szyję i wytwarza podciśnienie. Powoduje to, że ciśnienie otoczenia wtłacza powietrze przez nos i usta pacjenta do płuc. Wydech odbywa się odpowiednio poprzez wytworzenie nadciśnienia w komorze. Wielu pacjentów z polio potrzebowało żelaznego płuca jedynie w ostrej fazie choroby, dopóki nie powróciła funkcja mięśni. Niektórzy pacjenci korzystali z niego tylko w nocy, inni używali go nieprzerwanie."
 panum.1062.g: "To może uratować wiele istnień."
 panum.1063.t: "Wsparcie psychologiczne"
 panum.1063.d: "Jako psychiatra doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] wykorzystał [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] doświadczenie, aby ułatwić życie pacjentom z polio."
 panum.1063.f: "„Słusznie zwracamy uwagę na fizyczny aspekt choroby, gdy mówimy o poliomyelitis. Ale obok uszkodzonego ciała znajduje się również zraniona dusza. Polio pozostawia po sobie nie tylko fizyczne ślady. Szczególnie podczas pracy z dziećmi doświadczyłem wpływu, jaki ta straszna choroba wywiera na ich życie prywatne i społeczne. Słowa nie mogą uleczyć. Ale mogą przynieść ulgę. Musimy dać osobom, które przeżyły chorobę, perspektywę, aby nie tylko przetrwały, ale miały wolę dalszego życia.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], [SCOPE.sState('panum_disease_state').GetCityHubName]"
 panum.1063.g: "Dziękujemy, doktorze [ROOT.Var('panum_physician_var').GetCharacter.GetLastName]."
 panum.1064.t: "Dieta"
 panum.1064.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zaleca pacjentom z polio dietę bogatą w składniki odżywcze."
 panum.1064.f: "„Poprzednie sukcesy w zwalczaniu krzywicy, niedoboru jodu, szkorbutu i pelagry pokazały, że nasza dieta może odgrywać decydującą rolę w walce z chorobami. Polio nie jest chorobą wynikającą z niedoboru składników odżywczych. Wiadomo jednak, że białka odgrywają ważną rolę w budowie mięśni, dlatego należy podkreślić, że dieta pacjentów z polio musi być bogatsza niż dieta zwykłych ludzi.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], [SCOPE.sState('panum_disease_state').GetCityHubName]"
 panum.1064.g: "Wreszcie lekarskie usprawiedliwienie dla jedzenia steków z kością."
