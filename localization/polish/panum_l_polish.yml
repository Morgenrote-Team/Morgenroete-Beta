 panum.112.t: "Iskra nadziei"
 panum.112.d: "W szpitalach cholery w [SCOPE.sState('panum_disease_state').GetName] jeden z lekarzy szczególnie wyróżnił [SCOPE.sCharacter('panum_new_physician_scope').GetHerselfHimself] podczas obecnej epidemii. Sposób, w jaki [SCOPE.sCharacter('panum_new_physician_scope').GetFullName] pracuje, zyskał już znaczenie na skalę krajową. Ten lekarz mógłby potencjalnie odegrać ważną rolę w walce z epidemią w [GetPlayer.GetName]."
 panum.209.t: "Dr Gruźlica"
 panum.209.d: "Kierownik sanatorium gruźliczego, dr [SCOPE.sCharacter('panum_new_physician_scope').GetLastName], zaoferował [SCOPE.sCharacter('panum_new_physician_scope').GetHerHis] usługi w obliczu szalejącej epidemii."
 panum.112.f: "„Bóg przemówił do mnie i powołał mnie do swojej służby. Głos nie powiedział jednak, jaką formę ta służba miała przyjąć”. – Florence Nightingale"
 panum.112.g: "Nadaj [SCOPE.sCharacter('panum_new_physician_scope').GetHerHim] oficjalne stanowisko natychmiast!"
 panum.112.h: "Lekarz powinien szkolić przyszłe pokolenia do walki z kolejną epidemią."
 panum.122.t: "Inkubacja cholery"
 panum.122.d: "Po kilku obserwacjach i wywiadach dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] odkrył, że przed pojawieniem się typowych objawów cholery u pacjenta upływa pewien czas."
 panum.122.f: "Lekarz szacuje, że okres ten trwa od około pół dnia do pięciu dni, przy czym średnia wynosi trzy dni. [ROOT.Var('panum_physician_var').GetCharacter.GetFullName] przeprowadził kilka rozmów z ofiarami choroby i ich krewnymi. [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] był dzięki temu w stanie odtworzyć przebieg wydarzeń na podstawie kilku relacji świadków. Nawet jeśli przyczyna pozostaje nieznana, później będzie można wyciągnąć wnioski z tych obserwacji dotyczące tego, co dokładnie wydarzyło się pierwszego dnia."
 panum.122.g: "Dobrze zaobserwowane."
 panum.124.g: "Precyzyjnie zaobserwowane."
 panum.123.t: "Objawy cholery"
 panum.123.d: "Dziś dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] przesłał Wydziałowi Medycznemu obszerną listę objawów cholery."
 panum.123.f: "Jak już wiadomo, choć do tej pory zbadana jedynie w podstawowym zakresie, cholera jest chorobą ludzkiego jelita cienkiego. Jej skutkami są skrajna biegunka z charakterystycznym niebieskawym „stolcem ryżowej wody” oraz silne wymioty. Mówi się, że dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] ma pewne sadystyczne skłonności, ponieważ [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] przesłał pełny opis tych oraz innych wyjątkowo niesmacznych objawów w samą porę na akademicką kolację."
 panum.124.t: "Cholera azjatycka"
 panum.124.d: "W wysoko cenionym raporcie dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] opracował różnice między cholerą a innymi chorobami przypominającymi cholerę, co uznaje się za kamień milowy w przyszłych opisach chorób."
 panum.124.f: "Nazwa cholera, która wywodzi się od greckiego słowa oznaczającego żółć, pierwotnie odnosiła się do wszelkich możliwych form biegunki lub problemów jelitowych („przepływ żółci”). Chociaż Jakob de Bondt już w 1642 roku opisał konkretną indyjską chorobę cholery, cholera pozostawała jedynie pojęciem zbiorczym. Dopiero wraz z pojawieniem się wielkich pandemii cholery w XIX wieku ten konkretny, nowy rodzaj cholery, który okazał się najbardziej wyniszczającą chorobą stulecia, został również określony własną nazwą, aby wyraźnie go odróżnić: Cholera Asiatica."
 panum.222.t: "Inkubacja gruźlicy"
 panum.222.d: "Podczas swoich badań nad gruźlicą dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zauważył pewne osobliwości związane z tą chorobą. Najwyraźniej może minąć kilka tygodni, zanim chory zacznie wykazywać typowe objawy."
 panum.222.f: "Niezależnie od tego, czy chodzi o teorię miazmatów, czy teorię zarazków: gruźlica nadal pozostaje zagadką. Jeśli jest chorobą zakaźną, najwyraźniej może minąć wiele tygodni, zanim pojawią się objawy: lekarz zakłada okres od dwóch do nawet dwunastu tygodni! Co więcej, nie każdy, kto mieszka z osobą chorą, wydaje się od razu zarażać, jak [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] odkrył podczas licznych ankiet przeprowadzonych wśród pacjentów i ich krewnych. Albo uczeni mają rację ze swoją teorią, że gruźlica nie jest chorobą zakaźną i odpowiadają za nią inne czynniki, albo ryzyko zakażenia jest mniejsze, niż początkowo sądzono."
 panum.223.t: "Objawy gruźlicy"
 panum.223.d: "Po tym, jak dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] intensywnie zbadał objawy gruźlicy, [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] doszedł do wniosku, który zaskoczył nawet niektórych jego akademickich kolegów: gruźlica jest znacznie bardziej złożoną chorobą o szerokiej gamie objawów, które wykraczają daleko poza problemy z płucami."
 panum.223.f: "Chociaż atak na płuca oraz ich bolesne, powolne niszczenie są jednymi z najbardziej znanych cech gruźlicy, kaszel jest tylko jednym z wielu objawów. Gruźlica płucna jest jedynie jednym z rodzajów gruźlicy, która może również atakować inne narządy. Zmęczenie, gorączka, utrata apetytu, nocne poty czy odkrztuszanie krwi były już wcześniej znanymi objawami. Fakt, że gruźlica nie tylko atakuje organizm poza płucami, ale także że dwa różne rodzaje gruźlicy mogą występować jednocześnie, znacząco zmienił poglądy niektórych członków Wydziału Medycznego."
 panum.224.t: "Gruźlica i skrofuły"
 panum.224.d: "Dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] intensywnie badał różne formy możliwych chorób gruźliczych i pomimo licznych podobieństw do objawów innych chorób opracował konkretne różnice między gruźlicą a skrofułami, jednocześnie podkreślając istniejące między nimi powiązania."
 panum.224.f: "Opisy gruźlicy istniały od wieków, ale choroba ta nie miała porównywalnie wyniszczających skutków aż do XIX wieku ze względu na mniejszy stopień urbanizacji. Przez długi czas była znana również pod innymi nazwami — w świecie anglojęzycznym termin „consumption” był używany jeszcze do XX wieku. René Laennec jest uważany za jednego z pionierów badań nad gruźlicą, który wynalazł stetoskop do badania płuc. Johann Lukas Schönlein ukuł termin gruźlica w 1832 roku i powiązał go z konkretnym obrazem klinicznym. Ważnym odkryciem tamtych lat było ustalenie, że skrofuły i gruźlica są dwiema różnymi chorobami, jednak ze względu na dużą liczbę objawów gruźlicy trudno było je od siebie odróżnić."
 panum.322.t: "Inkubacja i objawy ospy prawdziwej"
 panum.322.d: "W niedawnym podsumowaniu dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zauważył, że początkowe objawy ospy prawdziwej nie różnią się zbytnio od objawów grypy, zanim pojawią się słynne krosty. Można założyć, że od zakażenia do wystąpienia objawów mija od jednego do dwóch tygodni."
 panum.322.f: "„Ci, którzy łatwo odzyskują zdrowie po zarazie, wydają mi się być wcześniej wysuszeni i oczyszczeni w odniesieniu do całego ciała, ponieważ u niektórych z nich występowały wymioty, a u wszystkich zaburzenia żołądka. W ten sam sposób u tych, którzy zostali już oczyszczeni i mieli zostać uratowani, na całym ciele wyraźnie pojawiają się ciemne krosty, u większości z nich owrzodziałe, u wszystkich suche. (...) Zewnętrznie ciało nie było gorące w dotyku ani blade; skóra była raczej czerwona, sino zabarwiona i pokryta małymi pęcherzami oraz wrzodami”. – Galen"
 panum.323.t: "Ospa wietrzna czy ospa prawdziwa?"
 panum.323.d: "Podczas [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] obserwacji pacjentów chorych na ospę prawdziwą dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] był w stanie przedstawić częściowy raport, że ospa wietrzna jest niezależną, nieszkodliwą chorobą. Jak dotąd teoria ta była bardzo kontrowersyjna."
 panum.323.f: "„Ospa wietrzna pojawia się u wielu osób bez żadnej choroby ani wcześniejszych oznak: u innych poprzedza ją niewielki stopień dreszczy, osłabienia, kaszel, przerywany sen, wędrujące bóle, utrata apetytu i gorączkowość trwająca trzy dni. Większość z nich ma rozmiar typowy dla ospy prawdziwej, ale niektóre są mniejsze. Nigdy nie widziałem, aby zlewały się ze sobą ani aby było ich bardzo wiele. Największa liczba, jaką kiedykolwiek zaobserwowałem, wynosiła około dwunastu na twarzy i dwustu na reszcie ciała. Drugiego, a najpóźniej trzeciego dnia od początku wysypki tyle krost, które nie zostały przerwane, wydaje się osiągać pełną dojrzałość, a te, które są wypełnione największą ilością żółtego płynu, bardzo przypominają prawdziwą ospę prawdziwą w piątym lub szóstym dniu, szczególnie tam, gdzie przez przypadek większą niż zwykle przestrzeń zajmuje wynaczyniona surowica”. – William Heberden"
 panum.324.t: "Różnica między odrą a ospą prawdziwą"
 panum.324.d: "Dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] z niezwykłą dokładnością porównał objawy pacjentów chorych na ospę prawdziwą, odrę i ospę wietrzną oraz był w stanie bardzo precyzyjnie je sklasyfikować."
 panum.324.f: "„Wysypkę ospy prawdziwej poprzedza utrzymująca się gorączka, ból pleców, swędzenie nosa oraz koszmary senne podczas snu. Są to ostrzejsze objawy jej nadejścia, wraz z wyraźnym bólem pleców połączonym z gorączką oraz swędzeniem odczuwanym przez pacjenta na całym ciele. Pojawia się obrzęk twarzy, który ustępuje i powraca, a także zauważalne jest ogólne zabarwienie zapalne, widoczne jako silne zaczerwienienie obu policzków i okolic obu oczu. Odczuwana jest ciężkość całego ciała oraz wielki niepokój, który objawia się częstym przeciąganiem i ziewaniem. Występuje ból gardła i klatki piersiowej, a także trudności z oddychaniem i kaszlem. Dodatkowymi objawami są: suchość oddechu, gęsta plwocina, chrypka głosu, ból i ciężkość głowy, niepokój, nudności oraz lęk. Należy zwrócić uwagę na różnicę: niepokój, nudności i lęk występują częściej przy odrze niż przy ospie prawdziwej. Z drugiej strony ból pleców jest bardziej wyraźny przy ospie prawdziwej niż przy odrze”. – Rhazes"
 panum.422.t: "Objawy i inkubacja tyfusu"
 panum.422.d: "W pierwszym raporcie wstępnym dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] wymienił objawy tyfusu, a także przedstawił pierwsze oszacowanie, kiedy pojawiają się one po raz pierwszy w przebiegu choroby."
 panum.422.f: "„Gorączka, dreszcze, ból głowy, kaszel, wysypka, wymioty — wszystkie te objawy są oznakami tyfusu. Jednak wszystkie te symptomy można znaleźć również w podobnych chorobach. Nudności i dezorientacja z kolei są typowe dla klasycznego tyfusu. Charakterystyczny przebieg gorączki obejmuje wzrost temperatury trwający od dwóch do trzech dni, następnie utrzymującą się gorączkę przez około dziesięć dni oraz późniejszy spadek temperatury w ciągu kilku kolejnych dni. Według moich obliczeń od zakażenia do pierwszych objawów mija około dziesięciu do czternastu dni”."
 panum.423.t: "Gorączka obozowa"
 panum.423.d: "Po tym, jak dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] porównał historyczne raporty o epidemiach w wojsku z obecnymi objawami chorych na tyfus, doszedł do wniosku, że utożsamianie tyfusu z „gorączką obozową” niewiele pomaga."
 panum.423.f: "„To z pewnością jest gorączka obozowa — ale czy to TA gorączka obozowa?” Dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zadawał takie pytania, które skłoniły członków Wydziału Medycznego do refleksji. Historycznie znana jako „gorączka obozowa” od dawna była kojarzona z epidemiami w wielkich armiach lub koszarach, szczególnie jako choroba, która spowodowała ogromne straty w Armii Napoleona. Jednak nie wszystkie choroby występujące w wojsku, określane jako „gorączka obozowa”, można utożsamiać z tyfusem. Gorączka nawrotowa i gorączka okopowa to inne choroby, o których wiadomo, że dotykały personel wojskowy przebywający w zamkniętych przestrzeniach. Choroba, która szczególnie szalała podczas wojny secesyjnej w Stanach Zjednoczonych, jest natomiast często określana jako tyfus, ale w rzeczywistości była gorączką tyfusową."
 panum.424.t: "Tyfus: dwie choroby w jednej?"
 panum.424.d: "Podczas badania pacjentów chorych na tyfus dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] odkrył, że wiele założeń było zasadniczo błędnych. Jeśli wcześniejsi lekarze diagnozowali „chorobową zmianę” w jelitach, [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] nie był w stanie wykryć niczego takiego u osób zmarłych na tyfus. Lekarz zakłada raczej, że choroba jelit jest schorzeniem, które należy odróżnić od tyfusu, który [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] nazywa „gorączką tyfusową”."
 panum.424.f: "Do połowy XIX wieku lekarze nie rozróżniali tyfusu i gorączki tyfusowej. Uważano je po prostu za przejawy tej samej choroby o różnym nasileniu objawów. W 1836 roku amerykański lekarz William Gerhard zaobserwował, że u niektórych chorych na tyfus jelita nie były dotknięte chorobą, mimo że do tego momentu był to jeden z powszechnie diagnozowanych objawów. Dalsze podobne obserwacje doprowadziły go do przekonania, że tyfus nie jest chorobą jelit, lecz atakuje raczej inne narządy: zaburzenia psychiczne i bóle mięśni występowały znacznie częściej niż problemy z układem trawiennym. Wielowiekowe utożsamianie tyfusu i gorączki tyfusowej doprowadziło nie tylko do podobieństwa nazw, ale także do tego, że w niektórych językach gorączka tyfusowa jest określana jako tyfus, na przykład w języku niemieckim."
 panum.522.t: "Dwa przebiegi żółtej febry"
 panum.522.d: "Podczas [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] dokładnych obserwacji żółtej febry dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] odkrył, że choroba może przebiegać na dwa sposoby."
 panum.522.f: "Lekarz odkrył, że w wielu znanych przypadkach żółta febra ma łagodny przebieg, który ustępuje po kilku dniach. Szacuje się, że pięciu na sześciu pacjentów doświadcza tej łagodnej formy żółtej febry. Drugi przebieg choroby jest natomiast niebezpieczny i może zakończyć się śmiercią. Pacjenci przechodzą drugi, toksyczny etap choroby. Charakteryzuje się on ponowną gorączką, której towarzyszy żółtaczka spowodowana uszkodzeniem wątroby, a także ból brzucha. Krwawienia z ust, nosa, oczu oraz przewodu pokarmowego powodują wymioty zawierające krew, stąd jedna z hiszpańskich nazw żółtej febry, vómito negro („czarne wymioty”). Może również wystąpić niewydolność nerek, czkawka i majaczenie. Szacuje się, że od 20 do 50 procent ofiar żółtej febry, które osiągnęły ten drugi etap choroby, zmarło — podsumowuje uczony w przedstawionym raporcie."
 panum.523.t: "Pory roku żółtej febry"
 panum.523.d: "Dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] odkrył, że epidemie żółtej febry podążają za określonym wzorcem czasowym."
 panum.523.f: "Zapisy historyczne i obecne dane sugerują, że żółta febra występuje przede wszystkim latem. Dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] nie był jeszcze w stanie wyjaśnić, dlaczego choroba nie występuje co roku, tak jak grypa, lecz całkowicie zanika na długie okresy. Zauważalne jest, że żółta febra szczególnie szerzyła się w latach deszczowych."
 panum.524.t: "Lokalna choroba?"
 panum.524.d: "Opisując chorobę żółtej febry, dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] podkreśla fakt, że żółta febra jest chorobą ograniczoną do określonych terytoriów i rozprzestrzenia się głównie na terenach podmokłych oraz tropikalnych, z nielicznymi wyjątkami."
 panum.524.f: "Dr [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] przejrzał kilka raportów i zapisów dotyczących innych epidemii żółtej febry. Uwagę zwraca fakt, że miały one miejsce na bardzo ograniczonym obszarze. Przede wszystkim dotknięte są regiony tropikalne i tereny podmokłe w Afryce oraz Ameryce. Chociaż w niektórych przypadkach epidemia przesuwa się dalej na północ — na przykład do Filadelfii w USA i Barcelony w Hiszpanii — lekarz jest przekonany, że określone strefy klimatyczne mają związek z występowaniem choroby. Fakt, że w angielskich portach występowały pojedyncze ogniska choroby, nie przeszkadza [ROOT.Var('panum_physician_var').GetCharacter.GetHerHim] — ponieważ choroba nie rozprzestrzeniła się znacznie dalej niż okolice miasta portowego."
 notification_panum_description_progress_notification_name: "Postęp opisu choroby"
 notification_panum_description_progress_notification_desc: "Nasz [concept_panum_physician] dr [GetPlayer.MakeScope.Var('panum_physician_var').GetCharacter.GetLastName] zdobył nowe spostrzeżenia dzięki obserwacji choroby epidemicznej i uzyskał dodatkową wskazówkę."
 panum_antitoxins_tech: "Antytoksyny"
 panum_antitoxins_tech_desc: "Antytoksyna jest przeciwciałem zdolnym do neutralizowania określonej toksyny. Antytoksyny przeciwko toksynom błonicy i tężca były produkowane przez Emila Adolfa von Behringa i jego współpracowników od 1890 roku. Są one uważane za jeden z wielkich kamieni milowych w historii medycyny."
