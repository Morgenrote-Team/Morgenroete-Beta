 panum_stop_medical_project_button: "Zatrzymaj projekt medyczny"
 panum_stop_medical_project_button_desc: "Zatrzymaj swój obecny projekt medyczny. Twój postęp medyczny zostanie utracony."
 panum_stop_medical_project_tt: "Zdecydowałeś się zatrzymać projekt, klikając przycisk #italic Zatrzymaj projekt medyczny#!."
