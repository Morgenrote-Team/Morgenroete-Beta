 panum.3031.t: "Pierwsza Konwencja staje się wiążącą konwencją"
 panum.3031.d: "Przytłaczająca większość członków Czerwonego Krzyża zgodziła się na Pierwszą Międzynarodową Konwencję dotyczącą opieki nad rannymi wojennymi. Jest ona teraz wiążąca dla wszystkich członków."
 panum.3031.f: "Konwencje międzynarodowe są zazwyczaj niewiążącymi deklaracjami intencji. Jednak jeśli wystarczająca liczba członków Czerwonego Krzyża je podpisze, z czasem stanie się ona obowiązującym prawem międzynarodowym, którego wszyscy sygnatariusze będą musieli przestrzegać — a pozostali członkowie również ją podpiszą. Dzieje się tak, gdy 65 procent wszystkich członków oraz większość wielkich mocarstw zgodzi się na tę konwencję — wtedy wszyscy pozostali członkowie są zobowiązani do jej przestrzegania. Takiej konwencji nie można już znieść w zwykły sposób. Aby uniknąć wiążących konwencji, konieczne jest całkowite wycofanie się z Czerwonego Krzyża — ze wszystkimi tego konsekwencjami."
 panum.3031.g: "Powstaje obowiązujące na całym świecie prawo międzynarodowe."
 panum.3032.t: "Druga Konwencja staje się wiążącą konwencją"
 panum.3032.d: "Przytłaczająca większość członków Czerwonego Krzyża zgodziła się na Drugą Międzynarodową Konwencję dotyczącą rozbrojenia i wojny morskiej. Jest ona teraz wiążąca dla wszystkich członków."
 panum.3033.t: "Trzecia Konwencja staje się wiążącą konwencją"
 panum.3034.t: "Konwencja międzynarodowa staje się wiążąca"
 panum.3034.d: "Przytłaczająca większość członków Czerwonego Krzyża zgodziła się na konwencję. Jest ona teraz wiążąca dla wszystkich członków."
 panum.3034.g: "Sprawdzimy, czy leży to w naszym interesie."
