 panum_physician_recent_treatment_conducted_modifier: "Przeprowadzono najnowsze leczenie"
 panum_physician_botched_treatment_modifier: "Nieudane leczenie"
 panum_physician_botched_treatment_ig_modifier: "Nieudane leczenie"
 panum.2301.t: "Skuteczne leczenie [SCOPE.sCharacter('chosen_character').GetFullName] z powodu [SCOPE.GetRootScope.GetCountry.GetCustom('panum_character_treatment_illness_type')]"
 panum.2301.d: "Doktor [GetPlayer.MakeScope.Var('panum_physician_var').GetCharacter.GetLastName] skutecznie wyleczył [SCOPE.sCharacter('chosen_character').GetFullName] z [SCOPE.GetRootScope.GetCountry.GetCustom('panum_character_treatment_illness_type')]."
 panum.2301.f: "„Bez obaw, proszę pana, to leczenie z pewnością zadziała! Przeprowadziłem je przynajmniej 2 razy i tylko jeden pacjent zmarł!”"
 panum.2301.g: "Dobrze!"
 panum.2302.t: "Neutralne leczenie [SCOPE.sCharacter('chosen_character').GetFullName] z powodu [SCOPE.GetRootScope.GetCountry.GetCustom('panum_character_treatment_illness_type')]"
 panum.2302.d: "Doktor [GetPlayer.MakeScope.Var('panum_physician_var').GetCharacter.GetLastName] leczył [SCOPE.sCharacter('chosen_character').GetFullName] z powodu [SCOPE.GetRootScope.GetCountry.GetCustom('panum_character_treatment_illness_type')], ale tak naprawdę nic się nie zmieniło."
 panum.2302.f: "„Naprawdę myślałem, że wypicie wystarczającej ilości wody załatwi sprawę!”"
 panum.2302.g: "Przynajmniej nie zaszkodziło."
 panum.2303.t: "Nieudane leczenie [SCOPE.sCharacter('chosen_character').GetFullName] z powodu [SCOPE.GetRootScope.GetCountry.GetCustom('panum_character_treatment_illness_type')]"
 panum.2303.d: "Doktor [GetPlayer.MakeScope.Var('panum_physician_var').GetCharacter.GetLastName] tak źle leczył [SCOPE.sCharacter('chosen_character').GetFullName] z powodu [SCOPE.GetRootScope.GetCountry.GetCustom('panum_character_treatment_illness_type')], że stan [SCOPE.sCharacter('chosen_character').GetHerHis] jeszcze się pogorszył."
 panum.2303.f: "„To trzeci raz, kiedy wydarzyło się to w tym tygodniu...”"
 panum.2303.g: "To nie powinno było się wydarzyć!"
 panum.2304.t: "Śmiertelne leczenie [SCOPE.GetRootScope.GetCountry.GetCustom('panum_character_treatment_illness_type')]"
 panum.2304.d: "Doktor [GetPlayer.MakeScope.Var('panum_physician_var').GetCharacter.GetLastName] niestety spowodował śmierć pacjenta podczas leczenia [SCOPE.GetRootScope.GetCountry.GetCustom('panum_character_treatment_illness_type')]."
 panum.2304.f: "[SCOPE.GetRootScope.GetCountry.GetCustom('panum_character_treatment_fatal_flavor_text_type')]"
 panum.2304.g: "Tragedia!"
 panum_foreign_medical_expedition_modifier: "Zagraniczna wyprawa medyczna"
 panum.137.t: "Wyprawa chce zbadać chorobę"
 panum.137.d: "Zagraniczna wyprawa dotarła do granic naszego kraju. Składa się głównie z lekarzy, naukowców i ich asystentów. Najwyraźniej chcą zbadać szalejącą epidemię."
 panum.137.f: "Wyprawy medyczne mogą podróżować do innych krajów, aby naukowo badać metody leczenia chorób i tworzyć opisy chorób dla swojej ojczyzny. Kraje goszczące z kolei odnoszą z tego korzyści, ponieważ lekarze badają pacjentów na obszarach dotkniętych epidemią."
 panum.137.g: "Powitajmy tych odważnych mężczyzn i kobiety."
 panum.2202.t: "Starożytna choroba"
 panum.2202.d: "Nasz doktor wniósł cenne spostrzeżenia do pracy naszego antropologa!"
 panum.2202.f: "„...ale oczywiście, jeśli przyjrzy się pan tej części ich czaszki, może pan zauważyć, że faktycznie zaczęli już goić się po swoich obrażeniach.”\n\n„Czyli to zdecydowanie nie było przyczyną śmierci?”\n\n„Najprawdopodobniej! Nieprzyjemny cios, ale nie śmiertelny. Oszacowałbym, że przeżyli jeszcze jakieś sześć miesięcy, zanim kolejny uraz ich pokonał, albo rana po prostu się pogorszyła.”\n\n„Hmmmm. Fascynujące. Sądząc po charakterze ciosu, uznałem, że najprawdopodobniej było to jakieś... tępe narzędzie.”\n\n„Najpewniej maczuga albo narzędzie z tępym kamieniem. Uważam, że to żebro wskazuje prawdziwą przyczynę śmierci. Proszę zwrócić uwagę na zwężenie kości, tutaj i tutaj.”\n\n„Obrażenie?”\n\n„Najprawdopodobniej gruźlica. Założyłbym się, że pański człowiek zmarł po latach walki z tą białą śmiercią.”"
 panum.2202.g: "Nauka interdyscyplinarna pozostaje najlepszą nauką."
 panum.2203.t: "Dziwna medycyna"
 panum.2203.d: "Mając trochę wolnego czasu razem, nasz doktor i archeolog podzielili się swoimi badaniami!"
 panum.2203.f: "„Ach, ale właśnie tutaj sprawy zaczynają być interesujące, doktorze! Te dzbany pochodzą z Egiptu i zawierają to, co uważamy za próbki starożytnej medycyny.”\n\n„Fascynujące, fascynujące. Czy to olej mumia?”\n\n„...czy to nie jest coś znajdowanego na ciałach, posiadającego właściwości lecznicze? Żywica wokół ich bandaży?”\n\n„Och, nie, wcale nie! Mumia to rodzaj oleju wydobywanego z ziemi, podobnego do ropy naftowej. Dlaczego pytasz?”\n\n„...myślę, że powinniśmy dokładniej zbadać te lekarstwa. Jest tu wszelkiego rodzaju nalewki. Proszę, przyjrzyj się im, a ja wrócę za chwilę. Muszę pozbyć się... czegoś.”\n\n„Cóż, wydają się być perfumowane i — czy ty coś tam jesz?”"
 panum.2203.g: "...nie jesz chyba tej mumii, prawda?"
 panum.2204.t: "Ziołowe lekarstwa"
 panum.2204.d: "Poświęciwszy trochę czasu na zbadanie swoich znalezisk, nasz przyrodnik dostarczył do gabinetu naszego doktora rośliny o potencjalnych właściwościach leczniczych."
 panum.2204.f: "„Ach, jesteś! Katalogowałem niektóre próbki, które przywieźliśmy z ostatniej wyprawy botanicznej, i znalazłem kilka, które mogą cię zainteresować.”\n\n„Och, naprawdę? W jaki sposób?”\n\n„Niektóre z nich są spokrewnione z roślinami o znanych właściwościach leczniczych, takich jak zwalczanie stanów zapalnych lub gorączki. Niektóre z nich są nam zupełnie obce, ale mają dobre opinie od tubylców i warto je dokładniej zbadać.”\n\n„Medycyna ziołowa nie jest zbyt dobrą nauką... ale nigdy nic nie wiadomo. Może kryje się w nich coś interesującego. W końcu wiesz, jakie cuda odkryto w roślinie maku.”\n\n„Ach, morfina!”\n\n„Rzeczywiście, rzeczywiście! Każę moim asystentom przygotować sproszkowane próbki do dokładniejszego zbadania.”"
 panum.2204.g: "Uważam, że liść koki jest szczególnie fascynujący, doktorze."
 panum_germ_theory_loc: "Obecna teoria: #V Zarazki#!"
 panum_miasma_theory_loc: "Obecna teoria: #V Miazmat#!"
 panum_no_epidemic_corruption_modifier: "Brak skażenia epidemią"
 panum_measles_depression_modifier: "Depresja odry"
 panum_sailor_quarantine_modifier: "Odra paraliżuje marynarzy"
 panum.600.t: "Epidemia odry"
 panum.600.d: "W jednym z naszych regionów wybuchła epidemia: #YELLOW Odra#! pustoszy [SCOPE.sState('panum_disease_state').GetName]!"
 panum.600.f: "Podobnie jak ospa prawdziwa, odra została wspomniana przez perskiego lekarza Razesa w X wieku i wydaje się, że była szeroko rozpowszechniona w regionie Eurazji przez całe średniowiecze. Odra była endemiczna w Europie aż do XIX wieku i zyskała jeszcze większe znaczenie wraz ze wzrostem urbanizacji. Szczególną cechą odry jest wysypka, która zaczyna się na twarzy i szyi, a w ciągu kilku dni rozprzestrzenia się na całe ciało. Wraz z ospą prawdziwą odra jest uznawana za jedną z chorób, które w XVI wieku dotknęły znaczną część rdzennej ludności Indii."
 panum.600.g: "Ale to tylko nieszkodliwa choroba wieku dziecięcego... prawda?"
 panum.620.t: "Epidemia odry kończy się"
 panum.620.d: "Epidemia odry najwyraźniej dobiegła końca. Ostatnia para rodziców pochowała swoje zmarłe dziecko."
 panum.620.f: "„Podobnie jak odra, miłość jest najbardziej niebezpieczna, gdy przychodzi późno w życiu.” — Lord Byron"
 panum.602.t: "Epidemia odry dociera do [SCOPE.sCountry('panum_infected_country').GetName]"
 panum.602.d: "Otrzymaliśmy doniesienia, że dzisiaj w [SCOPE.sCountry('panum_infected_country').GetName] odnotowano pierwsze przypadki odry. Władze obwiniają nas za to, że nie zrobiliśmy wystarczająco dużo, aby zapobiec jej rozprzestrzenianiu się."
 panum.602.g: "Nie było sposobu, aby temu zapobiec."
 panum.603.t: "Odra zabija dzieci"
 panum.603.d: "W [SCOPE.sState('panum_disease_state').GetName] epidemia odry była znacznie poważniejsza, niż się spodziewano. Epidemia szczególnie mocno dotknęła niemowlęta i małe dzieci, trwale osłabiając całe pokolenie."
 panum.603.f: "Odra zawsze była postrzegana jako choroba wieku dziecięcego, choć może również dotykać dorosłych. Najbardziej niszczycielskie skutki wywołuje między 2. a 3. rokiem życia. Następnie śmiertelność gwałtownie spada. W 1963 roku, przed wynalezieniem szczepionki, oficjalne statystyki szacowały, że każdego roku na całym świecie dochodziło do 2 milionów zgonów z powodu odry. Około 5–10 procent przypadków tej choroby kończyło się śmiercią."
 panum.603.g: "Czy nie ma lekarstwa na tę straszną chorobę?"
 panum.604.t: "Odra paraliżuje marynarzy"
 panum.604.d: "Z tajemniczych powodów odra w [SCOPE.sState('panum_disease_state').GetName] szczególnie dotknęła rybaków i marynarzy. Wskaźnik zgonów jest znikomy, ale utrata siły roboczej jest odczuwalna w zakładach rybnych i wśród wielorybników."
 panum.604.f: "Podczas swoich badań na Wyspach Owczych Peter Panum odkrył, że odra dotykała również dorosłych, szczególnie w bardziej odizolowanych społecznościach. Przyczyny tego zjawiska przez długi czas pozostawały niejasne; w zasadzie jednak zauważono, że szczególnie dotknięci byli rybacy i ich rodziny mieszkający z dala od bardziej ruchliwych miast."
 panum.604.g: "Ale kto teraz wypływa w morze?"
 panum.605.t: "Klinika dziecięca dla odry"
 panum.605.d: "[SCOPE.sCharacter('panum_government_leader').GetFullName] zauważył dużą liczbę dzieci cierpiących na odrę w [SCOPE.sState('panum_disease_state').GetName], szczególnie wśród biedniejszych rodzin, gdzie wskaźnik zgonów jest wyższy. Polityk chciałby sfinansować klinikę dziecięcą dla odry i zwrócił się o publiczną zbiórkę darowizn."
 panum.605.f: "„To wstyd widzieć dobrych rodziców z [SCOPE.sState('panum_disease_state').GetName] pozostawionych na łaskę tej strasznej choroby. Politycy muszą działać i wziąć odpowiedzialność. Przez zdecydowanie zbyt długi czas zbyt wielu zrobiło zdecydowanie zbyt mało. Szpital dziecięcy powinien pomóc chronić najcenniejszą rzecz, jaką mają rodzice. Pomożemy. Obiecuję wam to. Tak długo, jak moje imię brzmi [SCOPE.sCharacter('panum_government_leader').GetFullNameNoFormatting]... co masz na myśli, mówiąc, że wygłaszam przemówienia wyborcze?”"
 panum.605.g: "Inicjatywa warta poparcia."
 panum.605.h: "Ta partia chce jedynie wykorzystać chorobę do celów politycznych."
 panum.606.t: "Depresja odry"
 panum.606.d: "„Wiele chorych i zmarłych dzieci w [SCOPE.sState('panum_disease_state').GetName] odcisnęło swoje piętno na wielu rodzicach. Niektórzy mówią o licznych osobach, które przechodzą kryzys życiowy.”"
 panum.606.f: "„Pani Miller musiała pochować swoje trzecie dziecko w tym miesiącu. Jest tylko jedną z wielu matek, które zostały teraz bezdzietne. Pan Miller, który prowadzi piekarnię w mieście, zamknął swój zakład na kilka tygodni. Wiele rodzin w tej okolicy jest podobnych do Millerów. Prawie nie ma rodu, który nie straciłby dziecka. Jednak fatalizm od tygodni zamienia się w niezadowolenie. Ludzie w tym regionie stali się znacznie bardziej wrażliwi, jeśli okoliczności nadal będą się pogarszać. Wiele osób obwinia teraz rząd za swoje cierpienie.”\n\nArtykuł z gazety [SCOPE.sState('panum_disease_state').GetCityHubName] Herald"
 panum.606.g: "Nie jest to całkowicie niezrozumiałe, biorąc pod uwagę sytuację."
 panum.622.t: "Inkubacja odry"
 panum.622.d: "Doktor [GetPlayer.MakeScope.Var('panum_physician_var').GetCharacter.GetLastName] sporządził skrupulatną listę przypadków odry, która właściwie ukazuje okres inkubacji odry."
 panum.622.f: "„Nie można zaprzeczyć, że etap złuszczania może być zakaźny, ale należy zachować ostrożność przy przyjmowaniu tego poglądu, ponieważ ogólne przesłanki wskazywałyby raczej na coś przeciwnego. Wydaje się niemal, że ponieważ nie można było wyobrazić sobie tak długiego okresu utajenia, za zakaźny uznano późniejszy etap choroby. W wioskach Hove i Lobre na Suderø, pod koniec epidemii, wystąpił odstęp dłuższy niż czternaście dni między kolejnymi pokoleniami wysypki w tym samym gospodarstwie domowym, bez możliwości wykazania przeze mnie nowego zakażenia z zewnątrz; jednak te dwa przypadki można wyjaśnić zakażeniem przeniesionym podczas okresu rekonwalescencji. Na podstawie przedstawionych tutaj danych uważam, że okres inkubacji odry można z dużą pewnością oszacować na około czternaście dni, nie twierdząc jednak, że jest to odstęp, którego nie mogą zmienić szczególne okoliczności, jak na przykład podróż; wiele czynników przemawia z góry przeciwko takiemu absolutnemu twierdzeniu, podobnie jak analogia z niepewnością okresów utajenia innych chorób.” — Peter Panum"
 panum.623.t: "Wyjątkowość odry"
 panum.623.d: "W nowym etapie pośrednim doktor [GetPlayer.MakeScope.Var('panum_physician_var').GetCharacter.GetLastName] rozróżnił różne formy odry i nie tylko odnotował różnice względem innych podobnych chorób, takich jak ospa prawdziwa, różyczka i odra, ale także wyróżnił unikalne objawy."
 panum.623.f: "„Literatura dotycząca odry jest skromna i niepełna w porównaniu z literaturą dotyczącą innych ostrych chorób wysypkowych, takich jak na przykład szkarlatyna i ospa prawdziwa. Poza rozproszonymi doniesieniami w czasopismach dotyczącymi pojedynczych ognisk epidemicznych istnieje tylko kilka monografii, z których wiele pochodzi jeszcze z poprzedniego wieku. Ta gorączka wysypkowa, z pewnością nieznana greckim i arabskim lekarzom, była nawet w ostatnim stuleciu tak niedostatecznie rozróżniana, że de Haën, opierając się na objawach, utrzymywał tożsamość odry i ospy prawdziwej, a autorzy sprzed końca XVII wieku opisywali obie choroby jako należące do tej samej rodziny.” — Peter Panum"
 panum.624.t: "Dziewicze populacje i dożywotnia odporność"
 panum.624.d: "Doktor [GetPlayer.MakeScope.Var('panum_physician_var').GetCharacter.GetLastName] niedawno był w stanie bardzo wyraźnie wykazać, że gdy odra dotknie daną osobę, nie występuje u niej ponownie. Populacje, które nigdy nie miały kontaktu z chorobą, są zatem szczególnie zagrożone."
 panum.624.f: "„W związku z tym niezwykle godne uwagi jest jednak to, że spośród wielu wciąż żyjących starszych ludzi na Wyspach Owczych, którzy przeszli odrę w 1781 roku, ani jedna osoba, o ile udało mi się ustalić poprzez dokładne badania, nie zachorowała na nią po raz drugi. Sam widziałem dziewięćdziesięciu ośmiu takich starszych ludzi, którzy byli odporni, ponieważ przebyli tę chorobę w młodości. Było to tym bardziej godne uwagi, że podeszły wiek wcale nie zmniejszał podatności na odrę, ponieważ, o ile mi wiadomo, wszyscy starsi ludzie, którzy nie przeszli odry we wcześniejszym życiu, zostali zaatakowani, gdy byli narażeni na zakażenie; podczas gdy niektóre młode osoby, mimo stałego narażenia, pozostały odporne. Jeśli wyzdrowienie z odry sześćdziesiąt pięć lat wcześniej mogło zapewnić ludziom ochronę przed ponownym zachorowaniem, można przypuszczać, że jeszcze większą ochronę zapewniłoby przebycie tej choroby w krótszym odstępie czasu.” — Peter Panum"
 panum.700.t: "Epidemia szkarlatyny"
 panum.700.d: "W jednym z naszych regionów wybuchła epidemia: #YELLOW Szkarlatyna#! pustoszy [SCOPE.sState('panum_disease_state').GetName]!"
 panum.700.f: "Szkarlatyna była znana od czasów starożytnych i została dobrze opisana w XVII wieku, szczególnie przez Thomasa Sydenhama. Chociaż wydaje się, że szkarlatyna stała się mniej niebezpieczna w XVIII wieku, w XIX wieku powróciła w nowej formie. Pierre Fidèle Bretonneau na przykład twierdził, że około 1800 roku nie znał ani jednego śmiertelnego przypadku szkarlatyny, podczas gdy w 1824 roku zaobserwował epidemię w Tours o tak wysokiej śmiertelności, że zrównał szkarlatynę z dżumą i cholerą. Szkarlatynie towarzyszy charakterystyczna wysypka. W przeciwieństwie do ospy prawdziwej lub odry, szkarlatyna charakteryzuje się obrzękiem okolic migdałów i językiem o truskawkowym zabarwieniu."
 panum.700.g: "Każde dziecko musi kiedyś przez to przejść. Miejmy nadzieję."
 panum.720.t: "Epidemia szkarlatyny kończy się"
 panum.720.d: "Epidemia szkarlatyny, która ogarnęła nasz kraj, powoli opuszcza miasta i wsie. Niezliczeni rodzice odetchnęli z ulgą."
 panum.720.f: "„To jak ze szkarlatyną: trzeba ją po prostu przejść.”\n\n„W takim razie powinno się wynaleźć sposób na zaszczepianie miłości, tak jak szczepienia.” — Lew Tołstoj"
 panum.722.t: "Starożytna wiedza"
 panum.722.d: "Dzięki handlarzowi antykami [GetPlayer.MakeScope.Var('panum_physician_var').GetCharacter.GetLastName] był w stanie znaleźć kilka starych ksiąg, które podsumowują opisy szkarlatyny z przeszłości i mogą być również przydatne obecnie."
 panum.722.f: "Nie można z całą pewnością stwierdzić, czy szkarlatyna była znana w czasach starożytnych, czy też mylono ją z podobnymi chorobami, takimi jak błonica, odra i różyczka. Dowody na istnienie choroby podobnej do szkarlatyny znajdują się już u Celsusa, Caeliusa Aurelianusa, Areteusza z Kapadocji i Aecjusza z Amidy. Podobne opisy można znaleźć w regionie arabsko-perskim od średniowiecza, między innymi u Awicenny, Alego Abbasa i Razesa. Pierwszy jednoznaczny opis szkarlatyny pochodzi od Giovanniego Filippa Ingrassii z 1553 roku. Inną ważną pozycję zajmuje lekarz Daniel Sennert, również z XVI wieku. Nazwa „Scarlatina” pochodzi od Thomasa Sydenhama i jego opisu z 1675 roku. Chociaż opis Sydenhama jest uznawany za autorytatywny, zawiera on znaczące luki, a termin szkarlatyna wydaje się być również powszechnie używany w Anglii już w połowie XVI wieku."
 panum.723.t: "Objawy szkarlatyny"
 panum.723.d: "Doktor [GetPlayer.MakeScope.Var('panum_physician_var').GetCharacter.GetLastName] poczynił postępy w opisie szkarlatyny i po raz pierwszy podsumował jej objawy."
 panum.723.f: "„Pacjenci odczuwają dreszcze i drżenie, podobnie jak przy innych gorączkach. Objawy są jednak umiarkowane; następnie cała skóra pokrywa się małymi czerwonymi plamkami, gęstszymi niż te występujące przy odrze, a także szerszymi, bardziej czerwonymi i mniej jednolitymi. Utrzymują się one przez dwa lub trzy dni, a następnie znikają. Pacjent ma nie tylko wysypkę, ale również zapalenie migdałków. Mogą wystąpić powikłania, takie jak reumatyzm i obrzęki.”\n\nList doktora [GetPlayer.MakeScope.Var('panum_physician_var').GetCharacter.GetLastNameNoFormatting] do Wydziału Medycznego"
 panum.724.t: "Szkarlatyna nie atakuje krtani"
 panum.724.d: "Doktor [GetPlayer.MakeScope.Var('panum_physician_var').GetCharacter.GetLastName] zidentyfikował konkretne różnice między chorobami: szkarlatyną i błonicą."
 panum.724.f: "„W przypadku szkarlatyny zapalenie obejmuje szeroko migdałki, podniebienie i gardło, a nie jest, jak w przypadku błonicy, początkowo ograniczone do jednego miejsca; po drugie, szkarlatynowe zapalenie gardła nie ma tendencji do rozprzestrzeniania się na drogi oddechowe. Krótko mówiąc: szkarlatyna nie lubi krtani.”\n\nList doktora [GetPlayer.MakeScope.Var('panum_physician_var').GetCharacter.GetLastNameNoFormatting] do Wydziału Medycznego"
 panum_plague_quarantine_modifier: "Kwarantanna z powodu dżumy"
 panum_plague_hospitals_modifier: "Domy zarazy"
 panum_plague_burn_everything_modifier: "Spalcie wszystko!"
 panum_plague_rat_killer_modifier: "Zabijcie wszystko!"
 panum_plague_loss_of_trust_modifier: "Utrata zaufania"
 panum.800.t: "Powrót dżumy"
 panum.800.d: "Od kilku lat krążą pogłoski, że dżuma powróciła do części naszego kraju. Wcześniej ograniczało się to do odległych obszarów wiejskich. Jednak wraz z wybuchem epidemii w [SCOPE.sState('panum_disease_state').GetName] stało się w końcu jasne: dżuma ponownie wyciąga swoje sękate palce!"
 panum.800.f: "Trzecia pandemia dżumy (po dżumie Justyniana w VI wieku i „czarnej śmierci” w XIV wieku) rozpoczęła się w Chinach pod koniec XIX wieku. Uważa się, że pandemia wywodziła się z Junnanu, gdzie wybuchy choroby miały miejsce już w 1792 roku, w 1855 roku i ponownie w 1866 roku. Epidemia w sąsiednim mieście Kanton, która rozpoczęła się w styczniu 1894 roku, pochłonęła 80 000 ofiar. Od marca 1894 roku brytyjscy naukowcy i lekarze w Hongkongu dowiedzieli się o wybuchu epidemii. Po falach cholery z poprzednich dekad oczekiwano, że fala dżumy spowoduje wiele zgonów, szczególnie w Chinach i Indiach, a ostatecznie doprowadzi do destabilizacji państw. Szacowano, że na całym świecie pochłonie około 15 milionów istnień ludzkich."
 panum.800.g: "Niemożliwe! Dżuma jest chorobą zapomnianej przeszłości!"
 panum.820.t: "Epidemia dżumy kończy się"
 panum.820.d: "Straszliwa dżuma, jedna z najgorszych plag ludzkości, ponownie opuściła nasz kraj. Miejmy nadzieję, że wróci tam, gdzie jej miejsce: w otchłań historii."
 panum.820.f: "„Ale czymże jest dżuma? To życie, nic więcej.” — Albert Camus"
 panum.802.t: "Dżuma rozprzestrzenia się na [SCOPE.sCountry('panum_infected_country').GetName]"
 panum.802.d: "Przypadki dżumy są teraz zgłaszane również poza naszymi granicami. Najwyraźniej władze nie były w stanie powstrzymać choroby. Ambasador [SCOPE.sCountry('panum_infected_country').GetAdjectiveNoFlag] wysunął przeciwko nam poważne oskarżenia."
 panum.802.g: "W dłuższej perspektywie dżuma dopada każdego..."
 panum.803.t: "Epidemia dżumy"
 panum.803.d: "W jednym z naszych regionów wybuchła epidemia: #YELLOW Dżuma#! pustoszy [SCOPE.sState('panum_disease_state').GetName]!"
 panum.803.g: "Czarna śmierć puka do drzwi."
 panum.804.t: "Dżuma: trzecia fala"
 panum.804.d: "Niepokojące wieści docierają do nas z [SCOPE.sCountry('panum_plague_country').GetName]. Mówi się, że kilka tygodni temu wybuchła tam gwałtowna epidemia. Lekarze są zaniepokojeni: ma to być osławiona dżuma."
 panum.804.g: "Powinniśmy zorganizować wyprawę medyczną, aby się na to przygotować."
 panum.805.t: "Kwarantanna z powodu dżumy"
 panum.805.d: "Sytuacja w [SCOPE.sState('panum_disease_state').GetName] grozi wymknięciem się spod kontroli. Wpływowi politycy, przywódcy władz i osoby prywatne domagają się kwarantanny, aby zapobiec dalszemu rozprzestrzenianiu się dżumy. Są to przede wszystkim osoby, które nie mieszkają w [SCOPE.sState('panum_disease_state').GetName]."
 panum.805.f: "Rozległe, surowe kwarantanny już wcześniej okazały się skuteczne w średniowieczu. W rzeczywistości termin kwarantanna pochodzi od słowa oznaczającego 40 w języku włoskim i najwyraźniej został po raz pierwszy użyty w czasach zarazy. Szczególnie Republika Wenecka, jako państwo handlowe z rozległym ruchem morskim, była znana z tego środka, ponieważ porty i miasta handlowe były szczególnie dotknięte epidemiami."
 panum.805.g: "Cały obszar powinien zostać objęty kwarantanną."
 panum.805.h: "Nie powinniśmy przesadzać."
 panum.806.t: "Domy zarazy"
 panum.806.d: "Władze lokalne w [SCOPE.sState('panum_disease_state').GetName] przedstawiły propozycję utworzenia domów zarazy, aby lepiej odizolować zdrową ludność od chorych. Dotknęłoby to szczególnie biedniejsze warstwy społeczeństwa, które nie mogą uciec tak jak zamożni."
 panum.806.f: "Dom zarazy służył do opieki nad chorymi na dżumę podczas epidemii tej choroby. Ponieważ w szczytowym okresie tych fal choroby, w późnym średniowieczu i w czasach nowożytnych, epidemię uważano za nieuleczalną, a opieka medyczna mogła jedynie przynosić ulgę, domy zarazy miały przede wszystkim na celu odizolowanie chorych od zdrowej ludności. W tym celu domy zarazy, podobnie jak leprozoria, zazwyczaj budowano poza miastem lub na jego obrzeżach. Inny rodzaj domu zarazy miał służyć profilaktyce w formie okresu kwarantanny. Do domu zarazy kierowano osoby, w których bezpośrednim otoczeniu wystąpiła dżuma, i mogły go opuścić dopiero wtedy, gdy okazało się, że nie są zakażone."
 panum.806.g: "To tylko dla ich własnego dobra. Nawet jeśli tego nie chcą."
 panum.806.h: "To wywołałoby jedynie niepokoje."
 panum.807.t: "Lekarz dżumy"
 panum.807.d: "Główny lekarz w jednym z naszych domów zarazy w [SCOPE.sState('panum_disease_state').GetName] zdobył tak duże doświadczenie w tej dziedzinie, że mógłby być cenną pomocą na poziomie krajowym."
 panum.807.f: "„Przepuśćcie mnie! Jestem lekarzem. I dokładnie wiem, jak radzić sobie z tą chorobą.”"
 panum.807.g: "Nadaj lekarzowi wysokie stanowisko jako medykowi."
 panum.808.t: "Ucieczka bogatych"
 panum.808.d: "Liczba emigrantów w [SCOPE.sState('panum_disease_state').GetName] rośnie każdego dnia. W szczególności te rodziny, które mogą sobie na to pozwolić, próbują uciec przed dżumą. Wśród tych, którzy nie mogą sobie pozwolić na taką ucieczkę, panuje ogromne niezadowolenie. Inni ostrzegają, że spowoduje to dalsze rozprzestrzenianie się dżumy."
 panum.808.f: "„Niektórzy z nich, być może najrozsądniejsi w osądzie, jako że byli również najbardziej surowi w usposobieniu, ze wszystkich twierdzili, że nie ma lekarstwa na tę chorobę lepszego ani równie skutecznego jak ucieczka; kierując się tą radą, wielu mężczyzn i kobiet, nie dbając o nic poza sobą, opuściło swoje miasto, domy, majątek, krewnych i dobytek, udając się na dobrowolne wygnanie lub przenosząc się na wieś, jak gdyby Bóg, zsyłając na ludzi tę zarazę w odpłacie za ich grzechy, nie miał zamiaru ścigać ich swoim gniewem, gdziekolwiek by się znajdowali, lecz zamierzał zgładzić jedynie tych, którzy pozostali w obrębie murów miasta; albo też uznali być może, że nadszedł już czas, aby wszyscy z niego uciekli, a jego ostatnia godzina wybiła.” — Boccaccio"
 panum.809.t: "Stosy zwłok"
 panum.809.d: "Liczba zgonów z powodu dżumy osiągnęła takie rozmiary, że ledwo można było nad nią zapanować. Niektórzy już zalecają publiczne palenie zwłok i masowe groby."
 panum.809.f: "W szczytowym okresie epidemii dżumy w Hongkongu w 1894 roku liczba przyjęć do szpitali wynosiła średnio 80 dziennie, a liczba zgonów osiągnęła szczyt na poziomie ponad 100 dziennie. Poprzez ruch morski epidemia rozprzestrzeniła się po reszcie kraju po 1894 roku, a ostatecznie dotarła do Indii Brytyjskich, gdzie zginęło około dziesięciu milionów Hindusów. Główne środki zapobiegawcze obejmowały tworzenie szpitali dla chorych na dżumę i wysyłanie personelu medycznego w celu leczenia oraz izolowania chorych; przeprowadzanie kontroli dom po domu, wykrywanie i przenoszenie chorych na dżumę oraz czyszczenie i dezynfekcję zakażonych domów i obszarów; a także tworzenie wyznaczonych cmentarzy i wyznaczanie osób odpowiedzialnych za transport oraz pochówek zmarłych na dżumę."
 panum.810.t: "Czarna śmierć zbiera swoje żniwo"
 panum.810.d: "Epidemia dżumy szczególnie szaleje obecnie w [SCOPE.sState('panum_disease_state').GetName]. Odnotowano liczne zgony, nawet więcej niż zwykle."
 panum.810.f: "Choroba przez kilka lat pozostawała ograniczona do południowo-zachodnich Chin, zanim zaczęła się rozprzestrzeniać. W mieście Kanton, począwszy od stycznia 1894 roku, do czerwca choroba pochłonęła 80 000 ofiar. Codzienny ruch wodny z pobliskim miastem Hongkong szybko przeniósł dżumę tam, gdzie podczas epidemii dżumy w Hongkongu w 1894 roku w ciągu dwóch miesięcy zginęło ponad 2400 osób"
 panum.810.g: "Nikt nie ucieknie przed Ponurym Żniwiarzem!"
 panum.811.t: "Spalcie wszystko!"
 panum.811.d: "Czyszczenie i dezynfekcja domów osób dotkniętych chorobą jest często jedynym sposobem na powstrzymanie rozprzestrzeniania się dżumy. Często obejmuje to spalanie wszystkiego, co miało kontakt z chorym na dżumę."
 panum.811.f: "„Twierdzę więc, że siła zaraźliwości wspomnianej zarazy była tak wielka, iż nie tylko przenosiła się ona z człowieka na człowieka, lecz, co jest znacznie bardziej zdumiewające, często zauważano, że rzeczy należące do osoby chorej lub zmarłej na tę chorobę, jeśli zostały dotknięte przez inne żywe stworzenie, niebędące człowiekiem, powodowały nie tylko zachorowanie, ale niemal natychmiastową śmierć. O czym moje własne oczy (jak wspomniałem nieco wcześniej) przekonały się pewnego dnia dzięki następującemu doświadczeniu. Szmaty biedaka, który zmarł na tę chorobę, leżały porzucone na otwartej ulicy, gdy podeszły do nich dwie świnie i, jak to mają w zwyczaju, po niemałym obwąchiwaniu ryjami, chwyciły szmaty w zęby i zaczęły nimi rzucać na wszystkie strony wokół swoich pysków; po czym niemal natychmiast wykonały kilka obrotów i padły martwe, jakby zatrute, na tych samych szmatach, które w nieszczęsnym momencie poruszyły.” — Boccaccio"
 panum.811.g: "Spalcie ubrania, meble, a nawet domy, jeśli będzie to konieczne!"
 panum.811.h: "To nie jest konieczne."
 panum.812.t: "Zabijcie wszystko!"
 panum.812.d: "Już wcześniej podejrzewano, że szczury mogą być nosicielami dżumy. W [SCOPE.sState('panum_disease_state').GetName] pojawiają się wezwania do celowej eksterminacji zwierząt i szkodników, aby zapobiec rozprzestrzenianiu się choroby."
 panum.812.f: "W następstwie trzeciej pandemii dżumy europejskie miasta stworzyły prawdziwe „korpusy przeciw szczurom”, których zadaniem było specjalne wyszukiwanie i zabijanie tych zwierząt lub zanurzanie ich w wiadrach z benzyną. Jednak często sugerowano, że inne źródła dżumy, takie jak zakażone pasożyty żywiące się wyłącznie ludźmi lub gryzące ludzi, na przykład pchły i wszy, odgrywały ważną rolę w przenoszeniu choroby w Europie podczas trzeciej pandemii. Niewielka liczba szczurów zakażonych dżumą wykrytych podczas europejskich epidemii sugeruje, że odgrywały one stosunkowo niewielką rolę w przenoszeniu dżumy. Jednak niektórzy badacze argumentowali, że władze prawdopodobnie nie znajdowały zakażonych szczurów, ponieważ ukrywały się one."
 panum.812.g: "Wytępić szczury."
 panum.812.h: "To zbyt kosztowne."
 panum.813.t: "Utrata zaufania"
 panum.813.d: "Wielu mieszkańców [SCOPE.sState('panum_disease_state').GetName] uważa obecną sytuację medyczną za skandaliczną. Liczne zgony i oczywista porażka rządu doprowadziły do powszechnej utraty zaufania do władz."
 panum.813.f: "Epidemia dżumy w XIX wieku spowodowała dużą liczbę ofiar, szczególnie w Chinach, co poważnie zachwiało zaufaniem do rządu i Niebiańskiego Mandatu cesarzy Qing."
 panum.813.g: "To radź sobie z tym bałaganem sam!"
 panum.822.t: "Czarna śmierć"
 panum.822.d: "Korzystając z kilku źródeł historycznych, doktor [GetPlayer.MakeScope.Var('panum_physician_var').GetCharacter.GetLastName] był w stanie udowodnić, że nowa fala dżumy jest w rzeczywistości chorobą odpowiadającą czarnej śmierci z czasów średniowiecza."
 panum.822.f: "Odkrycie rozprzestrzeniania się dżumy w Indiach miało dominujące znaczenie dla postrzegania dżumy w jej obecnym rozumieniu jako współczesnej choroby. Początkowo doprowadziło to do poglądu, że istnieje tylko jeden sposób rozprzestrzeniania się choroby. Badania zostały teraz rozszerzone o dużą liczbę gryzoni i wiele gatunków pcheł. Wysoka śmiertelność w koloniach doprowadziła do wzmożonych wysiłków badawczych mających na celu poznanie cech epidemii. Fakt, że zawsze była to dżuma, nie był kwestionowany jako punkt wyjścia. Chorobie nadano historyczną nazwę dżuma. Przyjęto tożsamość średniowiecznej dżumy z dżumą badaną w Indiach."
 panum.823.t: "Sezon dżumy"
 panum.823.d: "Doktor [GetPlayer.MakeScope.Var('panum_physician_var').GetCharacter.GetLastName] przejrzał wszystkie zapisy. Niezależnie od tego, czy chodzi o tę epidemię, czy wcześniejsze, czy o niedawną, czy odległą przeszłość: zimą nie występują epidemie dżumy. Dlaczego tak się dzieje, pozostaje niejasne, ale może to odegrać rolę w poszukiwaniu przyczyn wybuchu choroby."
 panum.823.f: "„Tak kończy się ten rok... To prawda, że przeszliśmy przez wielki smutek z powodu wielkiej zarazy, a ja poniosłem przez nią ogromne koszty, utrzymując przez długi czas moją rodzinę w Woolwich, a siebie i inną część mojej rodziny, moich urzędników, na własny koszt w Greenwich... Ale teraz zaraza niemal całkowicie osłabła... Jednak wielu spośród tych, których bardzo dobrze znałem, zmarło. Mimo to, ku naszej wielkiej radości, miasto szybko się zapełnia, a sklepy zaczynają ponownie otwierać. Módlmy się do Boga, aby dalszy spadek zarazy trwał nadal — ponieważ to właśnie trzyma Dwór z dala od miejsca prowadzenia interesów, a przez to wszystko w sprawach publicznych popada w ruinę, gdyż oni, będąc tak daleko, nie myślą o tym.” — Samuel Pepys"
 panum.824.t: "Dżuma dymienicza i dżuma płucna"
 panum.824.d: "Doktor [GetPlayer.MakeScope.Var('panum_physician_var').GetCharacter.GetLastName] był w stanie wykazać, że istnieje więcej niż jedna forma dżumy."
 panum.824.f: "Przez dżumę zazwyczaj rozumie się dżumę dymieniczą. Okres inkubacji wynosi od kilku godzin do siedmiu dni. Objawami są gorączka, ból głowy i bóle ciała, silne uczucie choroby oraz zawroty głowy. Zaburzenia świadomości pojawiają się później. Nazwa dżuma dymienicza pochodzi od silnie opuchniętych, bardzo bolesnych guzów na szyi, pod pachami i w pachwinach. Dżuma płucna występuje znacznie rzadziej. Prawdopodobnie przypomina grypę, chociaż jej zdolność do rozprzestrzeniania się jest znacznie słabsza. Rozprzestrzenianie jest tak specyficzne, że może doprowadzić do epidemii jedynie w szczególnie sprzyjających okolicznościach. Przede wszystkim źródła zakażenia są rzadkie. Tylko niewielka część populacji zakażonej dżumą zapada na dżumę płucną, na przykład w przypadku dżumy dymieniczej i słabej odporności."
 panum.241.t: "Eksperyment z królikami"
 panum.241.d: "Doktor [GetPlayer.MakeScope.Var('panum_physician_var').GetCharacter.GetLastName] opracowuje śmiały eksperyment, który ostatecznie udowodni zakaźność gruźlicy. Chodzi o zaszczepianie. I o mnóstwo małych martwych królików."
 panum.241.f: "„Do mojego pierwszego eksperymentu zakupiłem parę uroczych, trzytygodniowych królików w celu określenia zakaźności gruźlicy. Jednego z nich posypałem wyciągiem gruźliczym z tkanki pacjenta chorego na gruźlicę, który zmarł 33 godziny wcześniej. Powtórzyłem tę procedurę dwukrotnie. Po kilku dniach przeprowadziłem sekcję zwierząt i odkryłem, że królik był zakażony gruźlicą.\n\nMiesiąc później powtórzyłem eksperyment z trzema pięknymi małymi królikami. Ponownie powtórzyłem procedurę, później dodając kolejnego królika. Następnie przez cztery kolejne dni przeprowadzałem sekcję jednego z królików każdego dnia. Wszystkie cierpiały na gruźlicę, choć w czterech różnych stadiach choroby. Zaszczepiłem jedynie pierwszego z nich.\n\nW mojej trzeciej próbie nabyłem cztery pary młodych, uroczych, trzymiesięcznych królików... ”\n\nZ zeszytu eksperymentalnego doktora [GetPlayer.MakeScope.Var('panum_physician_var').GetCharacter.GetLastNameNoFormatting] „Przyczyna i natura gruźlicy”"
 panum.241.g: "Powstrzymajcie te okropne eksperymenty na zwierzętach!"
 panum.241.h: "Powtórzmy eksperyment, aby mieć pewność."
 panum.241.i: "Trzeci eksperyment z królikami dla nauki!"
 panum.241.j: "[GetPlayer.MakeScope.Var('panum_physician_var').GetCharacter.GetSheHe|U] może zabić tyle królików, ile to możliwe, aby udowodnić teorię."
 panum.261.t: "Sztuczna odma opłucnowa"
 panum.261.d: "Doktor [GetPlayer.MakeScope.Var('panum_physician_var').GetCharacter.GetLastName] wynalazł urządzenie, które sztucznie zapada płuco i może pomóc w walce z gruźlicą."
 panum.261.f: "Przy pomocy swojego brata Carlo Forlanini zaprojektował i skonstruował proste urządzenie zdolne do podawania gazów do jamy opłucnej. Obecność gazu w płynie wewnątrzopłucnowym powodowała zapadnięcie się płuca, tworząc w ten sposób sztuczną odmę opłucnową. Po zbudowaniu urządzenia Forlanini spróbował leczyć dwa przypadki gruźlicy, wywołując odmę opłucnową u dwóch pacjentów, i uzyskał pozytywne wyniki. Z biegiem lat technika Forlaniniego była dalej rozwijana i udoskonalana, zwiększając tym samym skuteczność zabiegu. Sztuczna odma opłucnowa pozostawała metodą leczenia aż do wprowadzenia streptomycyny."
 panum.262.t: "Torakoplastyka"
 panum.262.d: "Dzięki [GetPlayer.MakeScope.Var('panum_physician_var').GetCharacter.GetHerHis] umiejętnościom chirurgicznym doktor [GetPlayer.MakeScope.Var('panum_physician_var').GetCharacter.GetLastName] wynalazł procedurę, która zrewolucjonizowała chirurgię płuc, umożliwiając tym samym skuteczniejsze leczenie pacjentów chorych na gruźlicę."
 panum.262.f: "Torakoplastyka to zabieg chirurgiczny, podczas którego żebra lub części żeber po jednej stronie klatki piersiowej są chirurgicznie usuwane w celu zapadnięcia się płuca lub jego części. Procedura ta wywodzi się od Edouarda de Cérenville'a i była głównie stosowana w leczeniu gruźlicy płuc, ale później jej znaczenie stopniowo malało wraz z wprowadzeniem skutecznych antybiotyków."
 panum.263.t: "Doktor znowu tego dokonał!"
 panum.263.d: "Aby ponownie udowodnić zakaźność gruźlicy, doktor [GetPlayer.MakeScope.Var('panum_physician_var').GetCharacter.GetLastName] znów zabił niezliczone ilości uroczych królików."
 panum.263.f: "„Z czterech par, które tym razem nabyłem, pierwsze zwierzę z pierwszej pary zabiłem natychmiast. Nie wykazywało ono żadnych zmian chorobowych w płucach.”\n\nZ zeszytu eksperymentalnego doktora [GetPlayer.MakeScope.Var('panum_physician_var').GetCharacter.GetLastNameNoFormatting] „Przyczyna i natura gruźlicy”"
 panum.263.g: "Chodzi o ratowanie ludzkiego życia."
 panum.263.h: "Ten doktor ma poważny problem."
