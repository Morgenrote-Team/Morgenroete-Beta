 panum.440.t: "Tyfus — problem społeczny"
 panum.440.d: "W swoim traktacie [SCOPE.GetRootScope.GetCountry.GetCustom('panum_custom_treatment_title')] doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] położył szczególny nacisk na fakt, że tyfus jest chorobą, której można zapobiec, gdy siły polityczne i społeczne współpracują ze sobą."
 panum.440.f: "'Cramped conditions, lice-filled clothing and run-down apartments or soldiers' rooms presented a memorable image to me. Typhus fever was everywhere there. Wherever people lived in the same cramped conditions but under the hygienic conditions of the hospital room, no spread could be observed. Medicine must not be thought of as caring for the individual, but rather in terms of public health, which also implies solving social problems. There can be no doubt that such an epidemic spread of typhus as we have recently seen only occurred under living conditions such as poverty and lack of education. Take these circumstances away and I am sure we will see significant improvements in the fight against the disease.'\n\nDr. [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] in his memorandum to the government"
 panum.440.g: "Tyfus traci swój postrach."
 panum.441.t: "Sekcja zwłok"
 panum.441.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] przeprowadził kilka sekcji zwłok ofiar tyfusu w [SCOPE.sState('panum_disease_state').GetCityHubName] i dokonał kluczowych odkryć."
 panum.441.f: "„Od dawna wiadomo, że dur brzuszny i tyfus to dwie różne choroby. Nadal jednak istnieje kilku badaczy, którzy uważają, że złe odżywianie, zakażenie przewodu pokarmowego lub przynajmniej niedobór składników odżywczych mogą być związane z wystąpieniem tyfusu. Przyczyny dietetyczne wciąż są uznawane za możliwą przyczynę wielu chorób. Podczas moich badań nie znalazłem niczego, co w jakikolwiek sposób wskazywałoby na zaburzenia trawienia. Tyfus nie ma nic wspólnego z dietą ani trawieniem.”\n\nZ raportu z sekcji zwłok doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastNameNoFormatting] z [TimeKeeper.GetCurrentDate.Format('y')], [SCOPE.sState('panum_disease_state').GetCityHubName]"
 panum.441.g: "Ale co to może być?"
 panum.442.t: "Nieumyci i skołtunieni"
 panum.442.d: "W [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] poszukiwaniach przyczyny epidemii tyfusu doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zdał sobie sprawę, że wcześniejsze ustalenia należy zakwestionować."
 panum.442.f: "„W swojej karierze wielokrotnie słyszałem, że zła higiena jest sposobem, dzięki któremu miazmy lub zarazki — niezależnie od tego, w co ludzie wierzą — mogą osiadać na ubraniach i przyczyniać się do choroby. Uważam, że jest to wątpliwe w szczegółach, ale nie w samym podstawowym stwierdzeniu. Żołnierze, skazańcy, biedni, przestępcy i prostytutki należą do klasycznych ofiar epidemii tyfusu. Ale czy nieumyci biedni są nieumyci dlatego, że tego chcą, czy raczej nie jest tak, że są nieumyci, ponieważ są biedni? Nie chcę wierzyć, że gruźlica jest chorobą artystów, tak samo jak tyfus dotyka wyłącznie przestępców dlatego, że są moralnie zepsuci. Istnieje wielu bogatych przestępców, którzy nie zostali dotknięci przez tę epidemię tyfusu. W slumsach są niewinni kapłani, którzy poświęcają się dla innych i sami padają ofiarą choroby. Jaki jest więc bardziej przekonujący związek między ofiarami?”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastNameNoFormatting] z [TimeKeeper.GetCurrentDate.Format('y')], [SCOPE.sState('panum_disease_state').GetCityHubName]"
 panum.442.g: "Czy [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] próbuje twierdzić, że tyfus może również dotknąć uczciwych ludzi?"
 panum.443.t: "Ciepło i zimno"
 panum.443.d: "Po kilku wizytach w domach rodzin cierpiących na tyfus doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] dochodzi do wniosku, że nie jest to, jak często twierdzono, choroba sezonowa."
 panum.443.f: "„Istnieją choroby sezonowe i wydaje się, że dotyczy to również tyfusu. Wcześniejsze doniesienia wskazują na wzrost zachorowań w chłodniejszych porach roku, do których może zaliczać się również wilgotna wiosna lub jesień. Uważam, że udowodniono, iż zimno i ciepło mają wpływ na zachorowania. To, czy zależy to od pór roku, jest wątpliwe. W zatłoczonym, ogrzewanym pomieszczeniu może być równie ciepło. Choroba nie pojawiała się we wszystkich miejscach o tej samej porze roku. Gdyby tak było, nie tylko określone obszary miasta, ale całe miasto musiałoby być dotknięte w równym stopniu. Jednak zawsze pojawiała się tam, gdzie ludzie byli stłoczeni. Byłem w stanie to ustalić podczas kilku wizyt domowych.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastNameNoFormatting] z [TimeKeeper.GetCurrentDate.Format('y')], [SCOPE.sState('panum_disease_state').GetCityHubName]"
 panum.443.g: "To przeczy wcześniejszym badaniom."
 panum.444.t: "Pot i oddech"
 panum.444.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] jest teraz całkowicie przekonany, że tyfus musi być chorobą zakaźną, nawet jeśli wszystkie okoliczności nie zostały jeszcze wyjaśnione."
 panum.444.f: "„Na początku mojego badania byłem głęboko przekonany, że tyfus nie jest chorobą zakaźną. Jednak gdy liczba przypadków tyfusu w mojej rodzinie wzrosła, zacząłem mocno wierzyć w zakaźność tej choroby i podkreślam zaraźliwy charakter potu. Widziałem sanitariusza, który podczas golenia umierającego pacjenta wdychał oddech chorego. Sanitariusz opisał oddech pacjenta jako mający „mdły smak” i niemal natychmiast zachorował. Podobnie pomocnik wspierał innego pacjenta, który wkrótce potem zmarł; poczuł na swojej skórze ostry zapach potu chorego i natychmiast pojawiły się u niego objawy tyfusu. Jest jasne, że bliskość pacjentów chorych na tyfus naraża człowieka na ryzyko zachorowania.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastNameNoFormatting] z [TimeKeeper.GetCurrentDate.Format('y')], [SCOPE.sState('panum_disease_state').GetCityHubName]"
 panum.444.g: "To może być pomocne, ale czy rzeczywiście przenosi się z człowieka na człowieka?"
 panum.445.t: "Czy to głód?"
 panum.445.d: "Podczas gorącej dyskusji z kolegą w [SCOPE.sState('panum_disease_state').GetCityHubName] doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] obalił jego teorie."
 panum.445.f: "„Czy jest to szczególny rodzaj tyfusu, tyfus głodowy?”\n\n„Tyfus głodowy?”\n\n„Można zaobserwować, że wszędzie tam, gdzie występuje tyfus, panuje niedożywienie. W związku z tym głód, a raczej klęska głodu, jest wyzwalaczem tyfusu. Prawdopodobnie mają z tym również coś wspólnego zmiany we krwi.”\n\n„Lata 1726, 1727 i 1728 były latami głodu, ale nie było tyfusu. Rok 1829 był rokiem dobrobytu, ale występował tyfus. Zrozumiałe jest, że osłabiony organizm łatwiej zapada na choroby — ale jaka jest przyczyna?”"
 panum.445.g: "Termin „gorączka głodowa” jest zatem nieprawidłowy."
 panum.446.t: "Not Location, but Situation"
 panum.446.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] uważa, że [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] odkrył, iż nie tyle liczy się to, jak żyją ludzie chorzy na tyfus, lecz gdzie mieszkają."
 panum.446.f: "„Podczas mojej wizyty w [SCOPE.sState('panum_disease_state').GetCityHubName] odkryłem, że cała choroba dotknęła jedynie jednej części miasta. Obszar ten jest znany z ubóstwa i moralnego upadku, co wsparło niektóre teorie, że tyfus jest chorobą osób moralnie gorszych. Jednak, o ile mogę stwierdzić, chodzi o gęsto zaludnioną dzielnicę i sytuację ekonomiczną dotkniętych osób. Moim zdaniem rozprzestrzenianie się choroby nie wynika z zepsucia moralnego, lecz z fizycznej bliskości.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastNameNoFormatting] z [TimeKeeper.GetCurrentDate.Format('y')], [SCOPE.sState('panum_disease_state').GetCityHubName]"
 panum.446.g: "To przynajmniej oznacza, że chorobę można teoretycznie pokonać..."
 panum.447.t: "Wszy"
 panum.447.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] przedstawił niezwykle kontrowersyjną teorię, która, choć [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] nie może jej udowodnić, może w przyszłości zmienić rozumienie choroby tyfusowej."
 panum.447.f: "„Jeśli jest jedna rzecz, którą zauważyłem podczas moich licznych obserwacji, to fakt, że niemal wszyscy pacjenci byli zarażeni wszami. Niezależnie od tego, czy byli to żołnierze w przepełnionych koszarach, rodziny z niezliczonymi dziećmi czy skazańcy w podupadłych celach. Nie wierzę już, że jest to przypadek. Oczywiście brakuje mi dowodów. W ostatnich latach kilku naukowcom udało się wielokrotnie udowodnić, że choroby mogą być przenoszone między zwierzętami a ludźmi. Jeśli w tej sytuacji jest inaczej, z przyjemnością przyjmę dowód przeciwko mojej teorii. Na razie uważam, że tajemnicy tyfusu nie można rozwiązać bez dokładniejszego przyjrzenia się roli wszy.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastNameNoFormatting] z [TimeKeeper.GetCurrentDate.Format('y')], [SCOPE.sState('panum_disease_state').GetCityHubName]"
 panum.447.g: "Jak coś tak małego może powodować tak wielkie spustoszenie?"
 panum.447.h: "Coś tak małego musi powodować tak wielkie spustoszenie."
 panum.448.t: "Higieniczny szpital"
 panum.448.d: "Podczas wizyty w wzorcowym szpitalu doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] był w stanie przekonać [ROOT.Var('panum_physician_var').GetCharacter.GetHerselfHimself], że przenoszenie choroby jest minimalne w sprzyjających warunkach."
 panum.448.f: "„Kiedy chorzy zaczęli być zabierani do szpitali tu i ówdzie, obawiano się, że sytuacja może się pogorszyć z powodu możliwego zakażenia. Zakładano, że mogą powstać nowe źródła zakażenia, z których epidemia uderzyłaby z jeszcze większą siłą. Nic takiego się nie wydarzyło, mimo że taki efekt zaobserwowano w wielu barakach dla chorych na gorączkę. Jak zauważyłem w innych przypadkach, różnicę stanowiły bardziej sprzyjające warunki higieniczne.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastNameNoFormatting] z [TimeKeeper.GetCurrentDate.Format('y')], [SCOPE.sState('panum_disease_state').GetCityHubName]"
 panum.448.g: "Czyli nie sama ciasnota, lecz warunki mają znaczenie."
 panum.449.t: "Pomoc podczas epidemii"
 panum.449.d: "Dostarczając żywność, koce i lekarstwa do [SCOPE.sState('panum_disease_state').GetCityHubName], doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] był w stanie sprawić, że epidemia nieco osłabła."
 panum.449.f: "„Może zabrzmieć to banalnie, ale wraz z dostawą towarów mających złagodzić nędzę mieszkańców, liczba zachorowań spadła w zeszłym tygodniu. Coś podobnego zaobserwowano już wcześniej na innych obszarach, gdzie w przeszłości szalał tyfus. Pracownicy pomocy rozprowadzali ryż i groch, budowali prowizoryczne szpitale namiotowe, a także dostarczali lekarstwa i nowe ubrania. Ten przypadek dowodzi przede wszystkim jednego: tyfus nie jest chorobą dziedziczną. Zdecydowanie zależy od czynników środowiskowych.”\n\nList doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastNameNoFormatting] do doktora Dementive"
 panum.449.g: "Czasami jedynym sposobem na zbliżenie się do rozwiązania jest zastosowanie kryteriów wykluczenia."
 panum.450.t: "Zakażone ubrania?"
 panum.450.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zauważył dziwny przypadek w baraku dla chorych na gorączkę, który odpowiada podobnym doświadczeniom."
 panum.450.f: "„Czy jest to dowód na rzekome zakażenie? Nie ma wątpliwości, że ten przypadek odpowiada bardzo podobnym doświadczeniom, które miałem w innych miejscach. Czasami są to płaszcze, czasami kurtki lub koszule. Chory na tyfus miał brata, który zabrał jego płaszcz. Kilka dni później również zachorował. Mówi się, że dzieci, które bawiły się płaszczem, również zostały w podobny sposób zakażone. W biedniejszych warstwach społeczeństwa przekazywanie ubrań po krewnych jest dość powszechne, szczególnie w chłodniejszych porach roku. Niezależnie od tego, czy ubrania są skażone, czy nie — zmiana ubrań wydaje się jednym z rozsądnych środków pozwalających uniknąć tyfusu.”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastNameNoFormatting] z [TimeKeeper.GetCurrentDate.Format('y')], [SCOPE.sState('panum_disease_state').GetCityHubName]"
 panum.450.g: "Mężczyźni mieliby zmieniać skarpety i bieliznę? Niemożliwe!"
 panum.451.t: "Klimat tyfusu"
 panum.451.d: "Po tym, jak zagraniczny lekarz przedstawił nową hipotezę dotyczącą pochodzenia tyfusu, doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] zaczyna wątpić w [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] własne badania."
 panum.451.f: "„Pewien „kolega” przesłał mi dwa dni temu swój tom dotyczący przyczyn tyfusu. Jestem dość zdumiony, żeby nie powiedzieć zniechęcony. Bardzo precyzyjnie i rygorystycznie sformułował, w jaki sposób pogoda i warunki atmosferyczne są powiązane z rozwojem choroby. Zgodnie z tym miazma powstaje, gdy w ziemi znajduje się wilgoć, a następnie unosi się w powietrze. Wyjaśniałoby to częste występowanie tyfusu w zimnych i wilgotnych miesiącach. Czyli jednak miazma?”\n\nZ dziennika [ROOT.Var('panum_physician_var').GetCharacter.GetFullName]"
 panum.451.g: "Ale czy to naprawdę jest właściwe rozwiązanie?"
 panum.452.t: "Gnicie"
 panum.452.d: "Niektóre z ustaleń, które doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] niedawno podsumował, po prostu nie pasują do [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] wcześniejszej teorii."
 panum.452.f: "„Do tej pory niewiele myślałem o teorii, według której procesy gnilne odgrywają kluczową rolę w rozprzestrzenianiu się chorób. Jednak gdziekolwiek się udaję, gdziekolwiek szaleje tyfus, znajduję zwierzęta, znajduję wyziewy, znajduję ludzką, zwierzęcą i roślinną materię. Czy rzeczywiście może ona ulegać rozkładowi i pozostawiać po sobie miazmę — a może nawet trucizny?”\n\nZ dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] z [TimeKeeper.GetCurrentDate.Format('y')], [SCOPE.sState('panum_disease_state').GetCityHubName]"
 panum.452.g: "Nieprzyjemne niepowodzenie."
 panum.453.t: "Ujemne prądy powietrza"
 panum.453.d: "Publikacja uznanego niemieckiego lekarza podważa dotychczasowe postępy doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName]. Wykazano zatem, że prądy powietrza są odpowiedzialne za występowanie tyfusu."
 panum.453.f: "„Takie ciepłe i wilgotne powietrze może być przenoszone przez równikowy prąd powietrza na północne szerokości geograficzne, a wtedy zobaczymy wybuchy tyfusu pod wpływem południowych i zachodnich wiatrów w stosunkowo ciepłych porach roku. Taka zależność musi być najbardziej wyraźna latem, gdy słońce znajduje się na północnej pozycji, wybrzeża Morza Śródziemnego są objęte zasięgiem pasatów, a w naszym kraju walka z północnym prądem odbywa się w porze deszczowej o zmiennym charakterze. W ten sposób można wyjaśnić epidemie tyfusu latem i wczesną jesienią.”\n\nDoktor Angelika Hasenbein, „Jak prądy powietrza powodują tyfus, a jesienne deszcze grypę”"
 panum.453.g: "To jest naprawdę przekonujące."
 panum.454.t: "Chory"
 panum.454.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] od kilku dni czuje się coraz gorzej. Czy [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] zostało zakażone?"
 panum.454.f: "„Gdzie jest doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName]? [ROOT.Var('panum_physician_var').GetCharacter.GetSheHe|U] miał dziś odwiedzić pacjenta chorego na tyfus w sali piątej?”\n\n„Wygląda na to, że sam doktor [ROOT.Var('panum_physician_var').GetCharacter.GetHerselfHimself] jest chory.”"
 panum.454.g: "Doktor powinien odpocząć."
 panum.454.h: "Doktor powinien kontynuować pracę!"
 panum.455.t: "Utracone dokumenty"
 panum.455.d: "Doktor zmarnował część [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] notatek, które mogłyby pomóc w opracowaniu leczenia tyfusu."
 panum.455.f: "- - - - - - - - -\n\n- - - - - - - - -\n\n- - - - - - - - -\n\nNIE z dziennika doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName]"
 panum.455.g: "Ale wstyd."
 panum.461.t: "Klasy i domy"
 panum.461.d: "Doktor [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] stworzył tabelę różnych osób chorych na tyfus mieszkających w [SCOPE.sState('panum_disease_state').GetCityHubName], w której uwzględnił miejsce ich zamieszkania i standard życia. Tyfus jest więc chorobą „społeczną”."
 panum.461.f: "„Tabele statystyczne pokazują, jak wielki wpływ mają mieszkania na zdrowie mieszkańców. Na przykład podczas badania przedmieścia MIASTA odkryłem, że śmiertelność na ulicach drugiej klasy była o 18 procent większa, a na ulicach trzeciej klasy o 68 procent większa niż na ulicach pierwszej klasy; oraz że śmiertelność w domach drugiej klasy była o 31 procent większa, a w domach trzeciej klasy o 78 procent większa niż w domach pierwszej klasy. Śmiertelność zmniejszyła się o 25 procent na tych biednych ulicach, które zostały ulepszone.”\n\n„Od doktora [ROOT.Var('panum_physician_var').GetCharacter.GetLastName]” „Tabele i statystyki dotyczące epidemii tyfusu w [SCOPE.sState('panum_disease_state').GetCityHubName]”"
 panum.461.g: "Czyli doktor jest również krytykiem społecznym?"
 panum_typhus: "Tyfus"
 panum_typhus_desc: "Ta osoba cierpi na tyfus, niebezpieczną chorobę."
 panum.12.t: "Pierwsza szczepionka"
 panum.12.d: "[SCOPE.sCharacter('panum_physician_scope').GetFullName] dokonał przełomowego wynalazku. Wykorzystując nową metodę, szczepienie, udało mu się wynaleźć skuteczny środek ochrony przed przerażającą ospą prawdziwą."
 panum.12.f: "Według biografa Edwarda Jennera, Johna Barona, Jenner miał wykorzystać popularne przekonanie, że dojarki zakażone krowianką zazwyczaj nie chorowały na ospę prawdziwą („mit dojarki”). John Fewster zaobserwował, że pacjent, który wcześniej przebył (niegroźną) krowiankę, nie mógł zostać zarażony ospą prawdziwą poprzez wariolację. Jenner wysunął więc hipotezę, że zaszczepienie krowianką zapewni taką samą odporność jak przebycie krowianki, a tym samym ochronę przed ospą prawdziwą. Jenner najpierw zebrał przypadki i badania obserwacyjne osób, które wcześniej przebyły krowiankę lub ospę końską, a następnie okazały się odporne podczas późniejszej wariolacji lub prawdziwej epidemii ospy prawdziwej. 14 maja 1796 roku zaszczepił ośmioletniego Jamesa Phippsa wirusami krowianki, czyli wirusami vaccinia, pobranymi z krosty krowianki znajdującej się na dłoni dojarki Sarah Nelmes, która chorowała na krowiankę. Około sześć tygodni później, 1 lipca 1796 roku, Jenner poddał chłopca wariolacji ospą prawdziwą; okazał się odporny."
 panum.12.g: "Bohater medycyny!"
 je_panum_vaccine: "Szczepionka"
 je_panum_vaccine_reason: "Nasz naród po raz pierwszy wprowadza do kraju znaną szczepionkę i rozpoczyna jej krajową dystrybucję."
 je_panum_vaccine_success: "[GetPlayer.GetName] zgromadził co najmniej #ORANGE 4 wskazówki dotyczące szczepionki#!."
 je_panum_smallpox_treatment_success: "[GetPlayer.GetName] zgromadził co najmniej #ORANGE 3 wskazówki dotyczące leczenia#!."
 panum.351.t: "Stary wróg"
 panum.351.d: "Ospa prawdziwa, być może najbardziej śmiercionośna choroba znana ludzkości, ponownie pojawiła się na naszych ziemiach."
 panum.351.f: "Ospa prawdziwa jest znanym wrogiem i to niebezpiecznym. Przemierzając ziemie [GetPlayer.GetName], może odebrać życie nawet jednej trzeciej zakażonych, a innych pozostawić ślepymi do końca ich dni. Niemal wszyscy zakażeni na zawsze będą nosić na swoim ciele znak rozpoznawczy tego mordercy — charakterystyczne blizny na twarzy i ciele, nieśmiertelny, ponadczasowy symbol choroby niemal tak starej jak sama cywilizacja. Przemierzyła każdy zakątek świata, od starożytnego Bliskiego Wschodu po Nowy Świat, niczym armia, której pochód spustoszył imperia, pochłonął miliony istnień i upokorzył największych przywódców, jacy kiedykolwiek stąpali po ziemi. Tam, gdzie pojawił się człowiek, podążała za nim ospa prawdziwa — łowca wiecznie ścigający swoją zdobycz.\n\nTeraz, na naszych ziemiach, znalazła nowych ofiar, wystarczająco wiele, by wyrwać się ze swojej endemicznej formy i ponownie stać się epidemią."
 panum.351.g: "I tak ponownie stajemy do walki z ospą prawdziwą..."
 panum.352.t: "Plotki o leczeniu ospy prawdziwej"
 panum.352.d: "W wyniku plotek o leczeniu ospy prawdziwej nasi ludzie zaczęli stosować dziwne praktyki związane z samymi krostami!"
 panum.352.f: "Widok uczonego dżentelmena jedzącego strupy od osób zakażonych ospą prawdziwą może być równie odrażający, co przerażający, ale jest to desperackie lekarstwo, po które sięga zdesperowany człowiek. Gdzieś indziej na świecie krążą plotki o leczeniu tej straszliwej choroby i podobno działa ono w podobny sposób... ale jak? Jakie czary, jaka nauka mogą uwolnić ich od tej straszliwej plagi? Z odległych ziem Europy nadchodzą wieści, że plaga ospy prawdziwej została zmuszona do odwrotu, a całe miasta mogą żyć bez ani jednego przypadku choroby.\n\nDla niektórych jest to źródło nadziei. Jeśli można ją pokonać tam, być może pokonamy ją również tutaj.\n\nDla niektórych jest to kłamstwo. Nasze największe umysły wciąż nie zdołały znaleźć lekarstwa, ale być może, być może..."
 panum.352.g: "...czyżby powiodło im się tam, gdzie my ponieśliśmy porażkę?"
 panum.353.t: "Plaga ospy"
 panum.353.d: "Nieleczona i bezlitosna ospa dziesiątkuje nasze społeczeństwo... zbierając obfite żniwo zwłaszcza wśród dzieci."
 panum.353.f: "Płacz. Łkanie. Szaleńczy krzyk zrozpaczonych, którzy zaledwie sekundę po ostatnim, rzężącym oddechu pogrążają się w żalu, z którego żadna dłoń nie zdoła ich podnieść. Ojcowie walą pięściami w ściany, aż ich dłonie spłyną krwią, a kłykcie ulegną zdruzgotaniu. Matki odpychają sanitariuszy z siłą olbrzymów, by choć raz jeszcze dotknąć, choć raz jeszcze pogłaskać zimny, blady policzek. To powszechny widok w [GetPlayer.GetName], bowiem ospa łaknie tych najbardziej bezbronnych pośród nas: naszych dzieci, zarówno narodzonych, jak i tych w łonach matek. Ponad osiemdziesiąt procent niemowląt zarażonych ospą umrze, a choroba ta bezlitośnie wycina sobie drogę w przyszłość naszych ziem.\n\nA bez leczenia nie pozostaje nam nic innego, jak tylko płakać nad życiami, które mogły nadejść."
 panum.353.g: "Musi nadejść koniec tego koszmaru..."
 panum.354.t: "Szczepionka przeciw ospie prawdziwej"
 panum.354.d: "Nasi dyplomaci przywożą coś więcej niż wieści - przywożą próbki „szczepionki” przeciwko ospie prawdziwej!"
 panum.354.f_generic: "Podczas wizyty w odległej Europie nasi dostojnicy odkryli coś fascynującego — posiadają tam coś, co wydaje się *działającym* leczeniem ospy prawdziwej. Rzeczywiście, poznali historię tej choroby! Najwyraźniej praktyka wariolacji, czyli używania próbek wysuszonych strupów ospy prawdziwej od osób powracających do zdrowia, aby wywołać u dzieci „łagodniejszą” formę tej choroby, była znana w Imperium Osmańskim... jednak było to niedoskonałe rozwiązanie, niebezpieczne, ponieważ był to taniec z diabłem — zbliż się zbyt mocno, a ospa prawdziwa zabierze cię tak samo łatwo, jak możesz ją pokonać.\n\nJednak dziś Europejczycy opracowali sposób wykorzystania krowianki, niemal nieszkodliwej choroby, jako metody ochrony przed jej śmiertelnym starszym bratem. Zapewnia to bezpieczną, ekonomiczną i praktycznie gwarantowaną ochronę przed plagą ospy prawdziwej.\n\nPoczątkowo zbyt piękne, by w to uwierzyć, nasi sceptyczni lekarze sami przetestowali to lekarstwo... i ono *działa*. Po raz pierwszy w naszej historii możemy przeciwstawić się ospie prawdziwej."
 panum.354.g_generic: "My... musimy to natychmiast sprowadzić!"
 panum.354.f_fareast: "Podczas wizyty w odległej Europie nasi dostojnicy odkryli coś fascynującego — posiadają tam coś, co wydaje się *działającym* leczeniem ospy prawdziwej. Rzeczywiście, poznali historię tej choroby! Chociaż nasi lekarze są dobrze zaznajomieni z praktyką wariolacji, która może wykorzystywać wysuszone strupy od osób powracających do zdrowia, aby chronić niezakażonych, wydaje się, że odkryli oni jeszcze lepszą ochronę. Wykorzystując próbki pochodzące od stosunkowo łagodnej krowianki, Europejczycy opracowali „szczepionkę”, zdolną do uodparniania dzieci, a nawet osób niedawno zakażonych... szczepionkę, która może znacznie zwiększyć ich szanse na przeżycie.\n\nNasi najlepiej wykształceni lekarze z trudem mogli w to uwierzyć. Jedynie osoby wykształcone w europejski sposób i posiadające tytuł „doktora” mogły potwierdzić jej potencjał jako bezpiecznej, ekonomicznej i skutecznej ochrony przed ospą prawdziwą. Co więcej, już rozpoczęli oni testowanie jej wśród naszych ludzi i odkryli, że te twierdzenia nie są jedynie twierdzeniami, o nie, lecz faktami.\n\nDzięki temu mamy broń do walki z ospą prawdziwą."
 panum.354.g_fareast: "Wygląda na to, że nasi nowi... lekarze... udowodnili swoją wartość. Natychmiast to sprowadźmy."
 panum.354.f_latino: "Podczas wizyty w ojczyźnie w Europie nasi dostojnicy odkryli coś fascynującego — posiadają tam coś, co wydaje się *działającym* leczeniem ospy prawdziwej. Chociaż od dawna znaliśmy praktykę wariolacji, w której nasi lekarze mogli wykorzystywać próbki pobrane od osób powracających do zdrowia i podawać je tym, którzy rozpaczliwie potrzebowali ochrony, od tego czasu opracowali oni znacznie bardziej zaawansowane leczenie. Zamiast używać strupów ospy prawdziwej i ryzykować zakażenie tą śmiertelną chorobą, wykorzystują materiały pobrane z krowianki, powszechnej i zazwyczaj nieszkodliwej choroby. To nowe serum jest tanie, powszechnie dostępne, a co najważniejsze — skuteczne.\n\nTeraz, mając dostęp do najnowszych czasopism medycznych, nasi lekarze mogą jedynie świętować to odkrycie. Ospa prawdziwa nie jest obca obu Amerykom, ponieważ zdziesiątkowała rdzenną ludność tych ziem... ale teraz mamy potężną broń, aby uczynić tę plagę przeszłością."
 panum.354.g_latino: "Wyślijmy podziękowania do ojczyzny oraz prośbę o sprowadzenie dostawy do natychmiastowego użycia."
 panum.355.t: "Rozpoczęcie szczepień"
 panum.355.d: "Mając już dostępną skuteczną szczepionkę przeciw ospie prawdziwej w [GetPlayer.GetName], rząd rozpoczął kampanię szczepień."
 panum.355.f: "Początkowo istniał pewien opór wobec pomysłu kampanii szczepień. Zaniepokojone matki z przestraszonymi dziećmi, zgarbieni starzy dżentelmeni sceptyczni wobec tego nowego cudu, głęboko wierzący, którzy obawiali się, że nauka ingeruje w coś wykraczającego poza ich zrozumienie. Edukacja rozwiązała ten problem — wyjaśnienia, jak to działa i dlaczego — ale jeszcze więcej przekonały rezultaty. Dzieci, które zachowały wzrok i zdrowie, a nie zostały naznaczone straszliwymi następstwami jednej z najgroźniejszych chorób, z jakimi ludzkość kiedykolwiek się spotkała. Niewielu trzeba było przekonywać, gdy widzieli je wolne od blizn i pełne życia.\n\nKrok po kroku, jeden po drugim, kolejki zaczęły się wydłużać. W szkołach, gabinetach lekarskich, miejscach pracy kampania szczepień zaczyna nabierać tempa... a wraz z nią ospa prawdziwa zaczyna ustępować."
 panum.355.g: "Auć. Nienawidzę igieł, ale jeśli zapewni mi to bezpieczeństwo..."
 panum.356.t: "Choroba w odwrocie"
 panum.356.d: "Po niezliczonych stuleciach śmierci i cierpienia, niedawne upowszechnienie szczepień przeciw ospie prawdziwej zmusiło tego dawnego wroga do całkowitego odwrotu."
 panum.356.f: "Wymagało to ogromu niezłomnego wysiłku nieprzeliczonych rąk i umysłów, lecz w granicach naszego ukochanego kraju ([GetPlayer.GetName]) ospa prawdziwa staje się powoli, lecz nieuchronnie, jedynie wspomnieniem przeszłości. W wyniku zakrojonej na szeroką skalę kampanii szczepień młodzieży oraz wszystkich gotowych przyjąć ukłucie igły, zdolność ospy do dziesiątkowania naszych rodzin i społeczności ulega załamaniu. Niesie to ze sobą obietnicę, że dzisiejsze dzieci nie poniosą ze sobą blizn swoich dziadków. Z każdym ukłuciem igły ostrze ospy staje się coraz bardziej stępione, a natura tej plagi przechodzi do historii. \n \nTo wiekopomne osiągnięcie i chwalebny dzień w naszej historii: choć bitwa nie została jeszcze wygrana, zwycięstwo jest już w zasięgu wzroku. Ospa prawdziwa tu zginie – a jeśli nie z naszej ręki, to z ręki naszych spadkobierców."
 panum.356.g: "Pewnego dnia, pewnego dnia powalimy tę szkaradną bestię raz na zawsze."
 panum_smallpox_vaccination_character_modifier: "Zaszczepiono"
 panum.340.t: "Wariolizacja"
 panum.340.d: "Dr. [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] odkrył metodę leczenia ospy prawdziwej – choć nie jest ona całkowicie bezpieczna."
 panum.340.f: "Wariolizacja (inaczej inokulacja) to przenoszenie zawartości krost ospy prawdziwej z człowieka na człowieka poprzez szczepienie. Jest to technika uodparniania przeciw chorobom wirusowym, którą stosowano u ludzi – głównie w Chinach i na Bliskim Wschodzie – do XVIII wieku. Do tego celu wykorzystywano populacje wirusów pochodzące z ran osób, które przeżyły ospę. Zazwyczaj za pomocą lancetu pobierano materiał z krosty chorego, a następnie wprowadzano go podskórnie, czyli poprzez niewielkie nacięcia, w ramię lub nogę zdrowej osoby. W ten sposób zdrowym ludziom podawano osłabione wirusy, a reakcja odpornościowa miała zostać wywołana przez ich namnażanie się. Jednak w trakcie namnażania wirusy mogły w wyniku rewersem mutacyjnej ponownie stać się zjadliwe, co prowadziło do stosunkowo wysokiej śmiertelności (2–3%) wśród tak leczonych osób."
 panum.340.g: "Cóż... postęp."
