 MR_RED_CROSS_BUTTON: "Załóż [concept_panum_red_cross]"
 MR_RED_CROSS_BUTTON_TT: "#T Załóż [concept_panum_red_cross]#!\nMiędzynarodowy Czerwony Krzyż jest jedną z pierwszych instytucji ponadnarodowych. Utworzenie tej organizacji stanowiło ważny krok w rozwoju prawa międzynarodowego. Została założona w celu ochrony życia i zdrowia ludzi, zapewnienia poszanowania każdej istoty ludzkiej oraz zapobiegania cierpieniu i łagodzenia jego skutków.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_IRC_INFAMY_TRIGGER_TT: "#default_text [GetPlayer.GetName] posiada mniej niż #V 35 [concept_infamy]#!.#!"
 MR_JOIN_RED_CROSS_BUTTON: "Dołącz do [concept_panum_red_cross]"
 MR_JOIN_RED_CROSS_BUTTON_TT: "#T Dołącz do [concept_panum_red_cross]#!\nNasze państwo może dołączyć do Międzynarodowego Czerwonego Krzyża i poprawić swoją reputację dzięki międzynarodowym porozumieniom – kosztem możliwości prowadzenia bezwzględnych działań wojennych.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_SIGN_FIRST_CONVENTION_BUTTON: "Podpisz pierwszą konwencję"
 MR_SIGN_FIRST_CONVENTION_BUTTON_TT: "#T Podpisz pierwszą konwencję#!\nPierwsza konwencja genewska, oficjalnie nosząca nazwę „Konwencja o polepszeniu losu rannych wojskowych w armiach w polu będących”, ustanawia podstawy prawa międzynarodowego dotyczącego ochrony ofiar konfliktów zbrojnych. Jednym z jej najważniejszych postanowień jest ochrona wszystkich placówek zajmujących się leczeniem rannych i chorych żołnierzy przed zajęciem i zniszczeniem, a także obowiązek przyjmowania i leczenia wszystkich uczestników walk bez względu na przynależność do walczących stron.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_SIGN_SECOND_CONVENTION_BUTTON: "Podpisz drugą konwencję"
 MR_SIGN_SECOND_CONVENTION_BUTTON_TT: "#T Podpisz drugą konwencję#!\nKonwencje haskie z 1899 i 1907 roku to zbiór międzynarodowych traktatów i deklaracji wynegocjowanych podczas dwóch międzynarodowych konferencji pokojowych w Hadze, w Holandii. Podczas obu konferencji prowadzono negocjacje dotyczące rozbrojenia, prawa wojennego oraz zbrodni wojennych. Na konferencji w 1907 roku większy nacisk położono na kwestie wojny morskiej.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_SIGN_THIRD_CONVENTION_BUTTON: "Podpisz trzecią konwencję"
 MR_SIGN_THIRD_CONVENTION_BUTTON_TT: "#T Podpisz trzecią konwencję#!\nProtokół dotyczący zakazu używania podczas wojny gazów duszących, trujących lub innych oraz metod prowadzenia wojny opartych na środkach bakteriologicznych, zwykle nazywany Protokołem genewskim, jest traktatem zakazującym stosowania broni chemicznej i biologicznej w międzynarodowych konfliktach zbrojnych. Został podpisany w Genewie 17 czerwca 1925 roku.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_LEAVE_RED_CROSS_BUTTON: "Opuść Czerwony Krzyż"
 MR_LEAVE_RED_CROSS_BUTTON_TT: "#T Opuść Czerwony Krzyż#!\nHomo homini lupus.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIAN_INTRODUCE_MEDICAL_TECHNIQUES_LEVEL_BUTTON_TT: "#T Wprowadź Techniki Medyczne#!\nNakazuje lekarzowi wprowadzenie nowoczesnego sprzętu, metod oraz innowacyjnych metod leczenia w placówkach medycznych w całym kraju. Czasami lekarz może opracować spektakularne nowe wynalazki.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIAN_INTRODUCE_MEDICAL_TECHNIQUES_LEVEL_BUTTON_ACTIVE_TT: "#T Wprowadzanie Technik Medycznych#!\nTwój lekarz obecnie wprowadza nowoczesny sprzęt, metody oraz innowacyjne metody leczenia w placówkach medycznych w całym kraju. Czasami lekarz może opracować spektakularne nowe wynalazki."
