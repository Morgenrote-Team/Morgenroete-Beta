 MR_TRIASSIC_SCENERY_BUTTON_TT: "#T Stwórz Dioramę z Okresu Triasowego#!\nGdy globalna wiedza geologiczna osiągnie odpowiedni poziom, paleontolodzy będą mogli urządzać na uniwersytetach sale z prehistorycznymi dioramami. Na jednym uniwersytecie może znajdować się tylko jedna taka diorama. Pozwól swojemu Paleontologowi stworzyć dioramę przedstawiającą Okres Triasowy.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
