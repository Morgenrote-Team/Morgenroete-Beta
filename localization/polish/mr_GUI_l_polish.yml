 MR_PAINTER_WAS_NOT_RECENTLY_SENT_AWAY_TT: "#default_text Ten malarz jest niedostępny dla [GetPlayer.GetName], ponieważ [GetPlayer.GetNameNoFormatting] odrzucił jego kandydaturę w ciągu ostatnich 5 lat.#!"
