 MR_STOP_CREATING_MASTERWORK_BUTTON_TT: "#T Przestań tworzyć arcydzieło muzyczne#!\nTwój [concept_elgar_composer] przestanie tworzyć arcydzieło muzyczne. #n Ważne:#! dotychczasowe postępy w tworzeniu arcydzieła zostaną utracone.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_MOZART_MONUMENT_BUTTON: "Zbuduj pomnik Mozarta"
 MR_MOZART_MONUMENT_BUTTON_TT: "#T Zbuduj pomnik Mozarta#!\nWolfgang Amadeus Mozart jest jednym z najważniejszych kompozytorów wszech czasów, choć niektórzy wciąż odmawiają mu należnego uznania. W ostatnich latach całe pokolenie kompozytorów odkryło go na nowo, uznając jego twórczość za punkt wyjścia dla muzyki współczesnej. Wzniesienie pomnika Mozarta w jego rodzinnym Salzburgu zainspiruje przyszłe pokolenia do podążania jego śladami.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
