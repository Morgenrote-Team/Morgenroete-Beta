 MR_ELECTRICAL_ENGINEER_POWER_PLANT_BUTTON: "Modernizacja elektrowni"
 MR_ELECTRICAL_ENGINEER_POWER_PLANT_BUTTON_TT: "#T Modernizacja elektrowni#!\nPozwól swojemu [concept_tesla_engineer] skupić się na modernizacji [GetBuildingType('building_power_plant').GetName]. Z czasem $building_power_plant$ otrzyma następujące modyfikatory: $tesla_power_plant_1_modifier$, $tesla_power_plant_2_modifier$ i $tesla_power_plant_3_modifier$.\n\nSpowoduje to dodatkowe #n wydatki#! dla twojego kraju.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ELECTRICAL_ENGINEER_POWER_PLANT_TRIGGER_TT: "#default_text [GetPlayer.GetName] posiada [GetBuildingType('building_power_plant').GetName] na poziomie 1 lub wyższym, która nie ma jeszcze wszystkich trzech [Concept('concept_modifier','$concept_modifiers$')].#!"
 MR_TESLA_BUILDING_CHOOSER_POWER_PLANT_MULTIPLE_HEADER: "Projekt modernizacji elektrowni"
 MR_GEOLOGIST_GEOLOGICAL_RESEARCH_BUTTON_ACTIVE_TT: "#T Trwają badania geologiczne#!\nTwój geolog podróżuje po kraju, prowadząc badania geologiczne. W ten sposób może również odkrywać formacje geologiczne, jaskinie, a nawet (w późniejszym czasie) uran. Geolodzy posiadający cechę Mineralog podwajają liczbę minerałów pozyskiwanych każdego roku."
 MR_ASTRONOMER_SEARCHING_THE_SKIES_BUTTON_ACTIVE_TT: "#T Trwają obserwacje nieba#!\nTwój [concept_verrier_astronomer] prowadzi obecnie obserwacje nieba w poszukiwaniu nowych [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects$')]. Zwiększa to roczną liczbę odkrywanych obiektów astronomicznych w zależności od umiejętności i [Concept('concept_character_trait','$concept_character_traits$')] astronoma."
 MR_SYSTEMIZE_FOSSILS_BUTTON_TT: "#T Systematyzuj skamieniałości#!\nPaleontolodzy, którzy nie uczestniczą w wyprawach, mogą poświęcić się pracy teoretycznej, próbując usystematyzować skamieniałości, odtworzyć drzewa rodowe zwierząt lub prześledzić rozwój roślin na przestrzeni dziejów Ziemi.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_SYSTEMIZE_FOSSILS_BUTTON_ACTIVE_TT: "#T Trwa systematyzacja skamieniałości#!\nTwój paleontolog zajmuje się obecnie pracą teoretyczną, próbując usystematyzować skamieniałości, odtworzyć drzewa rodowe zwierząt oraz prześledzić rozwój roślin na przestrzeni dziejów Ziemi."
 MR_CAN_DOCUMENT_ANIMAL_TRIGGER_OR_TT: "#default_text Jeden z poniższych warunków:\n#!$MR_CAN_DOCUMENT_ANIMAL_TRIGGER_TT$\n$MR_CAN_DOCUMENT_ANIMAL_FILM_TRIGGER_TT$#!"
