 MR_CHEMIST_CONGRESS_BUTTON_TT: "#T Kongres Chemików#!\nKongres w Karlsruhe był pierwszym międzynarodowym sympozjum poświęconym nowoczesnej chemii. Odbył się w dniach 3–5 września 1860 roku z inicjatywy Friedricha Augusta Kekulégo von Stradonitza, Charles’a Adolphe’a Wurtza i Karla Weltziena w budynku Ständehaus w Karlsruhe. Poruszano na nim zagadnienia dotyczące nazewnictwa związków chemicznych i sposobów przedstawiania ich wzorów, a także kwestii mas atomowych i cząsteczkowych. Była to pierwsza na świecie międzynarodowa konferencja chemiczna.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
