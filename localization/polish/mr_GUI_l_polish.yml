 TOTAL_GEOLOGICAL_KNOWLEDGE_VAR: "@agassiz_geological_knowledge!  [GetPlayer.MakeScope.Var('agassiz_geological_knowledge_var').GetValue|V0] / #V [GetGlobalVariable('agassiz_geological_knowledge_global_var').GetValue|0]#!"
 TOTAL_GEOLOGICAL_KNOWLEDGE_VAR_TT: "#header [concept_agassiz_geological_knowledge]#!\n[GetPlayer.GetName] zgromadził @agassiz_geological_knowledge! [GetPlayer.MakeScope.GetVariable('agassiz_geological_knowledge_var').GetValue|V0] z łącznej liczby @agassiz_geological_knowledge! [GetGlobalVariable('agassiz_geological_knowledge_global_var').GetValue|V0] [concept_agassiz_geological_knowledge] zgromadzonej przez wszystkie kraje."
 mr_geologist_ore_vein_stop_effect_tt: "Twój [concept_agassiz_geologist] zakończy poszukiwania złóż rudy."
 TOTAL_RARE_MINERALS_VAR: "@agassiz_rare_mineral!  [GetPlayer.MakeScope.Var('agassiz_rare_minerals_var').GetValue|*V0]"
 TOTAL_RARE_MINERALS_VAR_TT: "#header [Concept('concept_agassiz_rare_mineral','$concept_agassiz_rare_minerals$')]#!\n[GetPlayer.GetName] zgromadził @agassiz_rare_mineral! [GetPlayer.MakeScope.GetVariable('agassiz_rare_minerals_var').GetValue|V0] [Concept('concept_agassiz_rare_mineral','$concept_agassiz_rare_minerals$')]."
 MR_GEOLOGIST_AGE_EARTH_BUTTON_TT: "#T Oblicz Wiek Ziemi#!\nGeolog może raz w życiu obliczyć wiek Ziemi i przedstawić swoją teorię wszystkim pozostałym geologom. Jeśli ją zaakceptują, jego oszacowanie wieku Ziemi zostanie uznane za obowiązujące. Jeśli teoria zostanie odrzucona, będzie mógł spróbować ponownie po okresie przygnębienia. Aby przedstawić nową teorię, krajowa Punktacja Geologiczna musi być wyższa od punktacji wykorzystanej do ostatniego ustalenia wieku Ziemi.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_GEOLOGIST_AGE_EARTH_ACTIVE_TT: "#T Oblicz Wiek Ziemi#!\n#p Twój Geolog obecnie oblicza wiek Ziemi.#!"
 MR_GEOLOGIST_CAN_CALCULATE_TRIGGER_TT: "#default_text [GetPlayer.MakeScope.Var('agassiz_geologist_var').GetCharacter.GetFullName] nie przedstawił jeszcze uznanego na arenie międzynarodowej oszacowania wieku Ziemi.#!"
 MR_GEOLOGIST_CALCULATE_AGE_TRIGGER_TT: "#default_text Krajowa Punktacja Geologiczna jest wyższa od punktacji wykorzystanej do ostatniego ustalenia wieku Ziemi.#!"
 MR_GEOLOGIST_NO_AGE_DEBATE_TRIGGER_TT: "#default_text Obecnie nie toczy się żadna debata na temat wieku Ziemi.#!"
 MR_GEOLOGIST_NOT_DEMOTIVATED_TRIGGER_TT: "#default_text [GetPlayer.MakeScope.Var('agassiz_geologist_var').GetCharacter.GetFullName] nie jest zniechęcony.#!"
 MR_GEOLOGIST_OIL_STOP_BUTTON_TT: "#T Zakończ Poszukiwanie Złóż Ropy Naftowej#!\nTwój [concept_agassiz_geologist] obecnie poszukuje nowych złóż ropy naftowej w pobliżu istniejących już wież wiertniczych, zwiększając w ten sposób wydobycie.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 mr_geologist_oil_stop_button_effect_tt: "Twój [concept_agassiz_geologist] zakończy poszukiwania złóż ropy naftowej."
 MR_GEOLOGIST_GEOLOGICAL_RESEARCH_BUTTON_TT: "#T Badania Geologiczne#!\nGeolog może podróżować po kraju, prowadząc Badania Geologiczne. W ten sposób może również odkrywać formacje geologiczne, jaskinie, a na późniejszym etapie nawet złoża uranu. Geolodzy posiadający cechę Mineralog podwajają liczbę minerałów pozyskiwanych każdego roku.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 mr_geologist_geological_research_stop_effect_tt: "Twój [concept_agassiz_geologist] zakończy swoje Badania Geologiczne."
 MR_GEOLOGIST_UNDERWATER_MOUNTAINS_ACTIVE_TT: "#T Badanie Gór Atlantyckich#!\n#p Twój [concept_agassiz_geologist] obecnie bada Góry Atlantyckie.#!"
 MR_GEOLOGIST_TECTONICS_CONGRESS_BUTTON: "Kongres poświęcony dryfowi kontynentów"
 MR_GEOLOGIST_TECTONICS_CONGRESS_BUTTON_TT: "#T Kongres poświęcony dryfowi kontynentów#!\nPrzez stulecia panowało niezachwiane przekonanie, że kontynenty są nieruchome i pozostają na swoich miejscach. Wybitny geolog dysponujący rozległą wiedzą geologiczną mógłby obalić ten utrwalony dogmat. Czy jednak uda mu się tego dokonać? To pozostaje wysoce wątpliwe.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_GEOLOGIST_CONGRESS_KNOWLEDGE_TRIGGER_TT: "#default_text [GetPlayer.GetName] posiada #V 50 lub więcej#! @agassiz_geological_knowledge! [concept_agassiz_geological_knowledge] (obecnie [GetPlayer.MakeScope.Var('agassiz_geological_knowledge_var').GetValue|0+]).#!"
 MR_ASTRONOMER_ACTIVE_TRIGGER_TT: "#default_text [GetPlayer.GetName] posiada [concept_verrier_astronomer], który #V nie jest zajęty#!.#!"
 MR_ASTRONOMER_MOON_MAP_BUTTON_TT: "#T Sporządź Mapę Księżyca#!\nDzięki wykorzystaniu aparatu fotograficznego i nowoczesnych teleskopów możliwe jest sporządzenie mapy całego naturalnego satelity Ziemi z niespotykaną dotąd dokładnością. Mapa Księżyca stanowiłaby kamień milowy w astronomii. Jednak astronom zajmujący się badaniami selenograficznymi będzie odkrywał mniej obiektów astronomicznych.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ASTRONOMER_MOON_MAP_ACTIVE_TT: "Sporządź Mapę Księżyca\n#p Twój [concept_verrier_astronomer] obecnie sporządza mapę Księżyca, wykonując [Concept('concept_verrier_moon_photo','$concept_verrier_moon_photos$')].#!"
 NUMBER_MOONS_VAR: "@verrier_moons!  [GetPlayer.MakeScope.Var('verrier_num_discovered_moons_var').GetValue|V0] / #V [GetGlobalVariable('verrier_moon_number_global_var').GetValue]#!"
 NUMBER_MOONS_VAR_TT: "#header [Concept('concept_verrier_satellite','$concept_verrier_satellites$')]#!\n[GetPlayer.GetName] odkrył @verrier_moons! [GetPlayer.MakeScope.Var('verrier_num_discovered_moons_var').GetValue|V0] spośród wszystkich @verrier_moons! [GetGlobalVariable('verrier_moon_number_global_var').GetValue|V0] znanych [Concept('concept_verrier_satellite','$concept_verrier_satellites$')]."
 MR_ASTRONOMER_DISCOVER_SATELLITES_BUTTON_TT: "#T Odkryj nowe Satelity#!\nWiele planet Układu Słonecznego posiada jeszcze nieodkryte naturalne [Concept('concept_verrier_satellite','$concept_verrier_satellites$')], podobne do ziemskiego Księżyca. W zależności od poziomu technologii, metod produkcji stosowanych w naszym obserwatorium oraz umiejętności astronoma może pojawić się możliwość odkrycia zupełnie nieznanego dotąd naturalnego satelity planety. Jednak astronom poszukujący nowych satelitów będzie odkrywał mniej obiektów astronomicznych.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ASTRONOMER_CAN_DISCOVER_SATELLITES_TRIGGER_TT: "#default_text Istnieją naturalne [Concept('concept_verrier_satellite','$concept_verrier_satellites$')], które można odkryć.#!"
