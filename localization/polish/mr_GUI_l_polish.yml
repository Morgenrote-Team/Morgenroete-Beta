 MR_AUTOMATE_PALEONTOLOGIST_TT: "#T Zautomatyzuj [concept_dubois_paleontologist]#!\n Jeśli zautomatyzujesz zadania, nie będziesz już musiał zlecać ich inżynierowi.\n Będzie on pracować samodzielnie i wykonywać zadania, które są w danym momencie sensowne. Nadal jednak będziesz musiał zdobyć [Concept('concept_dubois_paleontological_expedition','$concept_dubois_paleontological_expeditions$')] lub ustanowić [Concept('concept_dubois_paleontological_team','$concept_dubois_paleontological_teams$')]. Jednocześnie nadal będziesz otrzymywać informacje o niektórych zdarzeniach."
