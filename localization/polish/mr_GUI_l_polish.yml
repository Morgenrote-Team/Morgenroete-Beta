 MR_NO_MORE_BALLOON_FLIGHT_EVENTS_BUTTON_TT: "Nie będziesz już otrzymywać powiadomień o wydarzeniach związanych z lotami Twoich [Concept('concept_curtiss_balloonist_role','$concept_curtiss_balloonists_role$')]. Wydarzenia nadal będą miały miejsce, ale nie będą wyświetlane. W każdej chwili możesz ponownie włączyć ich wyświetlanie.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
