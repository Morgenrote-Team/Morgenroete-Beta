 MR_VENUS_TRANSIT_1874_EXPEDITION_BUTTON_TT: "#T Obserwuj tranzyt Wenus#!\nObserwacja tranzytu Wenus, jednego z najważniejszych wydarzeń astronomicznych XIX wieku, jest możliwa w latach 1872 i 1884. Przygotowania można rozpocząć dwa lata przed planowaną obserwacją, aby nie przegapić tej okazji.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
