 MR_ACADEMICS_PROMOTE_UNIVERSITY_INVESTMENT_TT: "#T Inwestycje Akademickie#!\nOgólnokrajowe inwestycje rządowe w nasze uniwersytety zwiększą #O Postęp Akademicki#! o #G +1#! miesięcznie. Finansowanie przewidziano na 10 lat.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ACADEMICS_PROMOTE_UNIVERSITY_INVESTMENT_TRIGGER_TT: "[GetPlayer.GetAdjective] rząd nie finansuje obecnie inwestycji w naukę."
 MR_ACADEMICS_AVANTGARDE_TT: "#T Awangardowa Inteligencja#!\nGrupa wpływowych uczonych o wyraźnie sprecyzowanych poglądach kulturowych, socjologicznych i antropologicznych nadaje kierunek codziennej działalności naukowej. Dziedziny praktyczne mają natomiast mniejsze znaczenie.\n#R Uwaga#!: Zwiększa liczbę pojawiających się uczonych o jeden punkt miesięcznie.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ACADEMICS_NO_AVANTAGRDE_OR_CONFUSION_TT: "#default_text [GetPlayer.GetName] nie ma jeszcze ukierunkowania #b Awangardowa inteligencja#! i nie zmieniło ostatnio ukierunkowania.#!"
 MR_ACADEMICS_AVANTGARDE_BUILDING_REQUIREMENT_TT: "#default_text Co najmniej #p 50%#! uniwersytetów w państwie [GetPlayer.GetAdjective] ma [concept_pm_academics_university_humanities].#!"
 MR_ACADEMICS_PRACTICAL_TT: "#T Praktyczna Akademia#!\nNaukowcy w naszym kraju niestrudzenie starają się znajdować praktyczne zastosowania odkryć ze wszystkich dziedzin nauki w codziennym życiu. Ma to służyć ogólnemu postępowi i pokojowi całej ludzkości.\n#R Uwaga#!: Zwiększa liczbę pojawiających się uczonych o jeden punkt miesięcznie.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ACADEMICS_NO_PRACTICAL_OR_CONFUSION_TT: "#S [GetPlayer.GetName] nie ma jeszcze ukierunkowania #b Nauka w praktyce#! i nie zmieniło ostatnio ukierunkowania.#!"
 MR_ACADEMICS_PRACTICAL_BUILDING_REQUIREMENT_TT: "#default_text Co najmniej #p 50%#! uniwersytetów w państwie [GetPlayer.GetAdjective] ma [concept_pm_academics_university_natural_history].#!"
 MR_ACADEMICS_MILITARY_TT: "#T Kompleks Wojskowo-Przemysłowy#!\nWspółpraca prywatnych przemysłowców z wojskiem doprowadziła do powstania niezwykle wpływowej sieci powiązań, osobistych więzi i znajomości, z ledwie wyczuwalną nutą korupcji. Najlepiej opisuje ją określenie „Kompleks Wojskowo-Przemysłowy”.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ACADEMICS_NO_MILITARY_OR_CONFUSION_TT: "#default_text [GetPlayer.GetName] nie ma jeszcze ukierunkowania #b Kompleks Wojskowo-Przemysłowy#! i nie zmieniło ostatnio ukierunkowania.#!"
 MR_ACADEMICS_MILITARY_BUILDING_REQUIREMENT_TT: "#default_text Co najmniej #p 50%#! uniwersytetów w państwie [GetPlayer.GetAdjective] ma [concept_pm_academics_university_mathematics].#!"
 MR_ACADEMICS_MILITARY_BUILDING_REQUIREMENT_2_TT: "#default_text [GetPlayer.GetName] ma co najmniej jeden budynek typu [GetBuildingType('building_automotive_industry').GetName], [GetBuildingType('building_arms_industry').GetName], [GetBuildingType('building_munition_plant').GetName] lub [GetBuildingType('building_artillery_foundry').GetName] na poziomie #p 5#! lub wyższym.#!"
 MR_ACADEMICS_MILITARY_ARMY_SIZE_REQUIREMENT_TT: "#default_text [GetPlayer.GetAdjective] armia liczy co najmniej #b 50#! batalionów.#!"
 MR_ACADEMICS_BUSINESS_TT: "#T Szkoły Biznesu i Kapitalizm Magnatów#!\nPołączenie indywidualnej przedsiębiorczości z okresem dynamicznego rozwoju i postępu doprowadziło do ukształtowania się sposobu myślenia, w którym szkoły zawodowe, średnie przedsiębiorstwa i wielkie korporacje wywierają decydujący wpływ na naukę w kraju. Z kolei uniwersytety dążą do pomnażania osiągniętego przez naród dobrobytu dzięki nowym technologiom oraz propagowania idei społecznych poprzez postęp.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ACADEMICS_NO_BUSINESS_OR_CONFUSION_TT: "\#default_text [GetPlayer.GetName] nie ma jeszcze ukierunkowania #b Szkoły Biznesu i Kapitalizmu Magnackiego#! i nie zmieniło ostatnio ukierunkowania.#!"
 MR_ACADEMICS_BUSINESS_BUILDING_REQUIREMENT_TT: "#default_text Co najmniej #p 35%#! uniwersytetów w państwie [GetPlayer.GetAdjective] ma [concept_pm_academics_university_mathematics].#!"
 MR_ACADEMICS_BUSINESS_BUILDING_REQUIREMENT_2_TT: "#default_text Co najmniej #p 35%#! uniwersytetów w państwie [GetPlayer.GetAdjective] ma [concept_pm_academics_university_humanities].#!"
 MR_ACADEMICS_BUSINESS_BUILDING_REQUIREMENT_3_TT: "#default_text [GetPlayer.GetName] ma budynek typu [GetBuildingType('building_textile_mill').GetName] lub [GetBuildingType('building_furniture_manufactory').GetName] na poziomie co najmniej #p 15#! albo budynek typu [GetBuildingType('building_tooling_workshop').GetName] lub [GetBuildingType('building_steel_mill').GetName] na poziomie co najmniej #p 10#! albo budynek typu [GetBuildingType('building_motor_industry').GetName] lub [GetBuildingType('building_electrics_industry').GetName] na poziomie co najmniej #p 5#!.#!"
 MR_ACADEMICS_SEAPOWER_TT: "#T Potęga Morska i Marynarka Handlowa#!\nMarynarka wojenna i handel międzynarodowy odgrywają niezwykle ważną rolę w naszym kraju. Zwiększanie dobrobytu dzięki zaawansowanej produkcji i światowemu handlowi naszymi towarami jest równie istotne, jak obrona tego, co już udało nam się osiągnąć.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ACADEMICS_NO_SEAPOWER_OR_CONFUSION_TT: "#default_text [GetPlayer.GetName] nie ma jeszcze ukierunkowania #b Potęga Morska i Marynarka Handlowa#! i nie zmieniło ostatnio ukierunkowania.#!"
 MR_ACADEMICS_SEAPOWER_BUILDING_REQUIREMENT_TT: "#default_text Co najmniej #p 35%#! uniwersytetów w państwie [GetPlayer.GetAdjective] ma [concept_pm_academics_university_mathematics].#!"
 MR_ACADEMICS_SEAPOWER_BUILDING_REQUIREMENT_2_TT: "#default_text Co najmniej #p 35%#! uniwersytetów w państwie [GetPlayer.GetAdjective] ma [concept_pm_academics_university_natural_history].#!"
 MR_ACADEMICS_SEAPOWER_NAVY_SIZE_REQUIREMENT_TT: "#default_text [GetPlayer.GetAdjective] marynarka wojenna liczy co najmniej #b 50#! flotylli.#!"
 MR_ACADEMICS_USEFUL_TT: "#T Pożyteczna Wieża z Kości Słoniowej#!\nW naszym kraju środowisko akademickie postrzegane jest jako azyl dla ekscentrycznych umysłów, które liczą chrząszcze, polerują stare wazy i zajmują się najróżniejszymi dziwactwami. Nie można jednak zaprzeczyć, że odizolowanie wieży z kości słoniowej od społeczeństwa ma również swoje zalety. Wielu profesorów pracuje lepiej, gdy nikt im nie przeszkadza.\n#R Uwaga#!: Zwiększa liczbę pojawiających się uczonych o jeden punkt miesięcznie.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ACADEMICS_NO_USEFUL_OR_CONFUSION_TT: "#default_text [GetPlayer.GetName] nie ma jeszcze ukierunkowania #b Użyteczna wieża z kości słoniowej#! i nie zmieniło ostatnio ukierunkowania.#!"
 MR_ACADEMICS_USEFUL_BUILDING_REQUIREMENT_TT: "#default_text Co najmniej #p 35%#! uniwersytetów w państwie [GetPlayer.GetAdjective] ma [concept_pm_academics_university_humanities].#!"
 MR_ACADEMICS_USEFUL_BUILDING_REQUIREMENT_2_TT: "#default_text Co najmniej #p 35%#! uniwersytetów w państwie [GetPlayer.GetAdjective] ma [concept_pm_academics_university_natural_history].#!"
 MR_ACADEMICS_USEFUL_BUILDING_REQUIREMENT_3_TT: "#default_text [GetPlayer.GetName] ma budynek typu [GetBuildingType('building_lepsius_archaeological_museum').GetName], [GetBuildingType('building_verrier_observatory').GetName] lub [GetBuildingType('building_dubois_zoo').GetName].#!"
 MR_MOUNTAIN_EXPEDITION_TT: "#T Wyprawa Górska#!\nZdobycie Mont Blanc w 1786 roku zapoczątkowało nową erę podboju najwyższych szczytów Ziemi. Dążenie to przybierało na sile w XIX i XX wieku. Jeśli na którymś z naszych terytoriów znajduje się pasmo górskie z niezdobytymi jeszcze szczytami, możemy powierzyć ich zdobycie zdolnemu generałowi o odpowiednich umiejętnościach.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_MOUNTAIN_UNCONQUERED_SUMMIT_TRIGGER_TT: "#default_text [GetPlayer.GetName] posiada co najmniej jeden #V Niezdobyty szczyt#! lub ma #V Zezwolenie na wspinaczkę#! od państwa, które taki szczyt posiada.#!"
 MR_MOUNTAIN_RECENT_EXPEDITION_TRIGGER_TT: "#default_text [GetPlayer.GetName] nie zdobył ostatnio nowego szczytu ani nie poniósł porażki podczas wyprawy górskiej.#!"
 MR_ZEPPELIN_EXPEDITION_TT: "#T Wyprawa Sterowcowa#!\nAeroarctic, czyli „Międzynarodowe Towarzystwo Badań nad Eksploracją Arktyki za Pomocą Sterowców”, było pozarządowym stowarzyszeniem naukowym, którego celem było wykorzystanie sterowców w badaniach polarnych. Powstało ono głównie z inicjatywy aeronauty Walthera Brunsa, późniejszego sekretarza generalnego towarzystwa. Pierwszym prezesem organizacji został w 1924 roku Fridtjof Nansen. Po kilku latach przygotowań stowarzyszeniu udało się w 1931 roku po raz pierwszy wykorzystać sterowiec do wyprawy polarnej o charakterze wyłącznie naukowym. Dzięki arktycznemu lotowi sterowca LZ 127 Graf Zeppelin znacznie poszerzono wiedzę geograficzną o obszarach polarnych, nad którymi przeleciał. Już w 1926 roku Umberto Nobile przeleciał nad biegunem północnym na pokładzie sterowca „Norge”, a później podjął kolejną wyprawę na sterowcu „Italia”.\n\n [ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ZEPPELIN_OBSERVATORY_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma budynek typu [GetBuildingType('building_verrier_observatory').GetName] z metodą produkcji #V Stacja meteorologiczna#!.#!"
 MR_ZEPPELIN_ACCESS_TRIGGER_TT: "#default_text [GetPlayer.GetName] posiada co najmniej jeden z następujących obszarów lub ma do niego dostęp na mocy [concept_curtiss_airspace_convention]: #V Grenlandia#!, #V Północna Norwegia#!, #V Alaska#!, #V Nunavut #! lub #V Nieniecja#!.#!"
 MR_ZEPPELIN_RECENT_EXPEDITION_TRIGGER_TT: "#default_text [GetPlayer.GetName] nie prowadzi obecnie #V wyprawy sterowcowej#! ani #V nie prowadziło jej ostatnio#!.#!"
 MR_PACIFIC_EXPEDITION_TT: "#T Wyprawa na Pacyfik#!\nObok obszarów polarnych Ocean Spokojny jest jednym z ostatnich miejsc na Ziemi, które wciąż skrywają tajemnice. Uczeni reprezentujący różne dyscypliny naukowe są zainteresowani misją badawczą, podczas której mogliby prowadzić badania przyrodnicze, paleontologiczne, astronomiczne i oceanograficzne. Dla mocarstw taka wyprawa mogłaby również stać się prestiżowym przedsięwzięciem, pozwalającym zademonstrować swoje wpływy na krańcach świata.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PACIFIC_RANK_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma rangę #V mocarstwa regionalnego#! lub #V wielkiego mocarstwa#!.#!"
 MR_PACIFIC_PORT_BUILDING_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma budynek typu [GetBuildingType('building_port').GetName].#!"
 MR_PACIFIC_UNIVERSITY_BUILDING_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma budynek typu [GetBuildingType('building_university').GetName].#!"
 MR_PACIFIC_15_FLOTILLAS_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma #V co najmniej 15 flotylli#!.#!"
 MR_PACIFIC_ADMIRAL_AVAILABLE_TRIGGER_TT: "#default_text [GetPlayer.GetName] posiada #V admirała#!, który #V nie jest zajęty#!.#!"
 MR_PACIFIC_RECENT_EXPEDITION_TRIGGER_TT: "#default_text [GetPlayer.GetName] nie prowadzi obecnie #V wyprawy na Pacyfik#! ani #V nie prowadziło jej ostatnio#!.#!"
