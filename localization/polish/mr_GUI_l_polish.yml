 MR_CIVIL_ENGINEER_TOPOGRAPHIC_MAP_BUTTON_TT: "#T Sporządź Mapę Topograficzną#!\nTwój [concept_tesla_engineer] skupi się na sporządzeniu mapy topograficznej państwa [GetPlayer.GetName]. Obszary otrzymają $gaudi_topographic_state_map_modifier_with_tooltip$ jako [concept_modifier], co ułatwi budowę i transport. Projekt ten wiąże się z #n wydatkami#! dla Twojego państwa.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
