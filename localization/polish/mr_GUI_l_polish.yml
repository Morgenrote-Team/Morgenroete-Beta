 curtiss_pilot_speed_record_gui_loc: "Rekord Prędkości: [GetGlobalVariable('curtiss_airplane_speed_record_global_var').GetValue|V0] km/h [GetGlobalVariable('curtiss_airplane_speed_record_holder_global_var').GetCountry.GetFlagTextIcon]"
 MR_PROMOTING_ENGINEER_TT: "#T Promuj Inżyniera#!\n#p Obecnie promujesz Inżyniera.#!\n[Concept('concept_tesla_engineer','$concept_tesla_engineers$')] to wszechstronni specjaliści techniczni działający w wojsku i budownictwie. Przyspieszają również budowę pomników dwukrotnie."
 MR_PROMOTING_ASTRONOMER_TT: "#T Promuj Astronoma#!\n#p Obecnie promujesz Astronoma.#!\n[Concept('concept_verrier_astronomer','$concept_verrier_astronomers$')] odkrywają nowe obiekty astronomiczne, gwiazdy i planety, a także mogą uczestniczyć w kongresach astronomicznych."
 MR_PROMOTING_NATURALIST_TT: "#T Promuj Przyrodnika#!\n#p Obecnie promujesz Przyrodnika.#!\n[Concept('concept_dubois_naturalist','$concept_dubois_naturalists$')] mogą chwytać zwierzęta w kraju lub za granicą, znajdować okazy oraz prowadzić wyprawy botaniczne."
 MR_PROMOTING_PALEONTOLOGIST_TT: "#T Promuj Paleontologa#!\n#p Obecnie promujesz Paleontologa.#!\n[Concept('concept_dubois_paleontologist','$concept_dubois_paleontologists$')] mogą badać formacje geologiczne w poszukiwaniu skamieniałości i kości dinozaurów lub odnajdywać je podczas wypraw."
 MR_PROMOTING_ARCHAEOLOGIST_TT: "#T Promuj Archeologa#!\n#p Obecnie promujesz Archeologa.#!\n[Concept('concept_lepsius_archaeologist','$concept_lepsius_archaeologists$')] mogą odnajdywać artefakty, dokonywać przełomowych odkryć oraz uczestniczyć w konferencjach archeologicznych.\n"
 MR_PROMOTING_ANTHROPOLOGIST_TT: "#T Promuj Antropologa#!\n#p Obecnie promujesz Antropologa.#!\n[Concept('concept_andersson_anthropologist','$concept_andersson_anthropologists$')] badają pochodzenie człowieka, od początków ewolucji człowieka aż po epokę kamienia.#T Inwestycje Akademickie#!"
 MR_ACADEMICS_INVESTMENT_ACTIVE_TT: "#T Inwestycje Akademickie#!\n#p Obecnie inwestujesz w środowisko akademickie.#!\nOgólnokrajowe inwestycje rządowe w nasze uniwersytety zwiększą #O Postęp Akademicki#! o #G +1#! miesięcznie. Finansowanie przewidziano na 10 lat."
 MR_PROMOTING_COMPOSER_TT: "#T Promuj Kompozytora#!\n#p Obecnie promujesz Kompozytora.#!\n[Concept('concept_elgar_composer','$concept_elgar_composers$')] są niezbędni do rozwoju kwitnącej Kultury Muzycznej. Pomagają państwu zwiększać [concept_elgar_musical_tradition]."
 MR_PROMOTING_WRITER_TT: "#T Promuj Pisarza#!\n#p Obecnie promujesz Pisarza.#!\n[Concept('concept_manzoni_writer','$concept_manzoni_writers$')] są mistrzami opowiadania historii i zajmują się tworzeniem książek oraz innych dzieł literackich. Swoją twórczością wzmacniają [concept_manzoni_literary_tradition] państwa."
 MR_PROMOTING_PAINTER_TT: "#T Promuj Malarza#!\n#p Obecnie promujesz Malarza.#!\n[Concept('concept_klimt_painter','$concept_klimt_painters$')] uwieczniają na płótnie wrażenia, krajobrazy i cuda świata. Poprzez swoje arcydzieła wzmacniają [concept_klimt_painting_tradition] państwa."
 MR_AVANTGARDE_INTELLIGENTSIA_ACTIVE_TT: "#T Awangardowa Inteligencja#!\n#p Awangardowa Inteligencja jest obecnie twoim aktywnym priorytetem naukowym.#!\nGrupa wpływowych uczonych o wyraźnie sprecyzowanych poglądach kulturowych, socjologicznych i antropologicznych nadaje kierunek codziennej działalności naukowej. Dziedziny praktyczne mają natomiast mniejsze znaczenie.\n#R Uwaga#!: Zwiększa liczbę pojawiających się uczonych o jeden punkt miesięcznie."
 MR_PRACTICAL_ACADEMIA_ACTIVE_TT: "#T Praktyczna Akademia#!\n#p Praktyczna Akademia jest obecnie twoim aktywnym Priorytetem Naukowym.#!\nNaukowcy w naszym kraju niestrudzenie starają się znajdować praktyczne zastosowania odkryć ze wszystkich dziedzin nauki w codziennym życiu. Ma to służyć ogólnemu postępowi i pokojowi całej ludzkości.\n#p Uwaga#!: Zwiększa liczbę pojawiających się uczonych o jeden punkt miesięcznie."
 MR_MILITARY_INDUSTRIAL_COMPLEX_ACTIVE_TT: "#T Kompleks Wojskowo-Przemysłowy#!\n#p Kompleks Wojskowo-Przemysłowy jest obecnie twoim aktywnym Priorytetem Naukowym.#!\nWspółpraca między prywatnymi przemysłowcami a wojskiem doprowadziła do powstania niezwykle rozbudowanej sieci powiązań, osobistych relacji i znajomości, z ledwie zauważalną domieszką korupcji, którą najlepiej określa mianem Kompleksu Wojskowo-Przemysłowego."
 MR_BUSINESS_AND_TYCOON_ACTIVE_TT: "#T Szkoły Biznesu i Kapitalizm Magnatów#!\n#p Szkoły Biznesu i Kapitalizm Magnatów są obecnie twoim aktywnym Priorytetem Naukowym.#!\nPołączenie indywidualnej przedsiębiorczości z okresem dynamicznego rozwoju i postępu doprowadziło do ukształtowania się sposobu myślenia, w którym szkoły zawodowe, średnie przedsiębiorstwa i wielkie korporacje wywierają decydujący wpływ na naukę w kraju. Z kolei uniwersytety dążą do pomnażania osiągniętego przez naród dobrobytu dzięki nowym technologiom oraz propagowania idei społecznych poprzez postęp."
 MR_SEA_POWER_AND_MERCHANT_ACTIVE_TT: "#T Potęga Morska i Marynarka Handlowa#!\n#p Potęga Morska i Marynarka Handlowa są obecnie twoim aktywnym Priorytetem Naukowym.#!\nMarynarka wojenna i handel międzynarodowy odgrywają niezwykle ważną rolę w naszym kraju. Zwiększanie dobrobytu dzięki zaawansowanej produkcji i światowemu handlowi naszymi towarami jest równie istotne, jak obrona tego, co już udało nam się osiągnąć."
 MR_IVORY_TOWER_ACTIVE_TT: "#T Pożyteczna Wieża z Kości Słoniowej#!\n#p Pożyteczna Wieża z Kości Słoniowej jest obecnie twoim aktywnym Priorytetem Naukowym.#!\nW naszym kraju środowisko akademickie postrzegane jest jako azyl dla ekscentrycznych umysłów, które liczą chrząszcze, polerują stare wazy i zajmują się najróżniejszymi dziwactwami. Nie można jednak zaprzeczyć, że odizolowanie wieży z kości słoniowej od społeczeństwa ma również swoje zalety. Wielu profesorów pracuje lepiej, gdy nikt im nie przeszkadza.\n#p Uwaga#!: Zwiększa liczbę pojawiających się uczonych o jeden punkt miesięcznie."
 MR_ON_PACIFIC_EXPEDITION_TT: "#T Wyprawa na Pacyfik#!\n#p Obecnie trwa Wyprawa na Pacyfik.#!\nObok obszarów polarnych Ocean Spokojny jest jednym z ostatnich miejsc na Ziemi, które wciąż skrywają tajemnice. Uczeni reprezentujący różne dyscypliny naukowe są zainteresowani misją badawczą, podczas której mogliby prowadzić badania przyrodnicze, paleontologiczne, astronomiczne i oceanograficzne. Dla mocarstw taka wyprawa mogłaby również stać się prestiżowym przedsięwzięciem, pozwalającym zademonstrować swoje wpływy na krańcach świata."
 MR_ON_NORTHWEST_EXPEDITION_TT: "#T Przejście Północno-Zachodnie#!\n#p Obecnie trwa wyprawa w poszukiwaniu Przejścia Północno-Zachodniego.#!\nJuż na przełomie ubiegłego stulecia śmiali podróżnicy badali odległe zakątki Morza Arktycznego. Jednak odwieczne marzenie wciąż pozostaje niespełnione: odkrycie Przejścia Północno-Zachodniego między Kanadą a Oceanem Arktycznym. Kto jednak odważyłby się podjąć tak niebezpieczną wyprawę?"
 MR_ON_ARCTICA_EXPEDITION_TT: "#T Wyprawa Sterowcowa#!\n#p Obecnie trwa Wyprawa sterowcem Zeppelin.#!\nAeroarctic, czyli „Międzynarodowe Towarzystwo Badań nad Eksploracją Arktyki za Pomocą Sterowców”, było pozarządowym stowarzyszeniem naukowym, którego celem było wykorzystanie sterowców w badaniach polarnych. Powstało ono głównie z inicjatywy aeronauty Walthera Brunsa, późniejszego sekretarza generalnego towarzystwa. Pierwszym prezesem organizacji został w 1924 roku Fridtjof Nansen. Po kilku latach przygotowań stowarzyszeniu udało się w 1931 roku po raz pierwszy wykorzystać sterowiec do wyprawy polarnej o charakterze wyłącznie naukowym. Dzięki arktycznemu lotowi sterowca LZ 127 Graf Zeppelin znacznie poszerzono wiedzę geograficzną o obszarach polarnych, nad którymi przeleciał. Już w 1926 roku Umberto Nobile przeleciał nad biegunem północnym na pokładzie sterowca „Norge”, a później podjął kolejną wyprawę na sterowcu „Italia”."
 MR_IS_CIVIL_ENGINEER_TT: "#T [concept_tesla_civil_engineer]#!\nTwój [concept_tesla_engineer] specjalizuje się w [Concept('concept_tesla_civil_engineer','$concept_tesla_civil_engineering$')]."
 MR_IS_MECHANICAL_ENGINEER_TT: "#T [concept_tesla_mechanical_engineer]#!\nTwój [concept_tesla_engineer] specjalizuje się w [Concept('concept_tesla_mechanical_engineer','$concept_tesla_mechanical_engineering$')]."
 MR_IS_MILITARY_ENGINEER_TT: "#T [concept_tesla_military_engineer]#!\nTwój [concept_tesla_engineer] specjalizuje się w [Concept('concept_tesla_military_engineer','$concept_tesla_military_engineering$')]."
 MR_IS_ELECTRICAL_ENGINEER_TT: "#T [concept_tesla_electrical_engineer]#!\nTwój [concept_tesla_engineer] specjalizuje się w [Concept('concept_tesla_electrical_engineer','$concept_tesla_electrical_engineering$')]."
 MR_IS_AERONAUTICAL_ENGINEER_TT: "#T [concept_tesla_aeronautical_engineer]#!\nTwój [concept_tesla_engineer] specjalizuje się w [Concept('concept_tesla_aeronautical_engineer','$concept_tesla_aeronautical_engineering$')]."
 MR_SAFARI_ACTIVE_TT: "#T Heia Safari#!\n#p Twój Przyrodnik uczestniczy obecnie w Safari.#!\nPodczas afrykańskiego safari, dzięki nieustannemu tropieniu i zastawianiu pułapek, można schwytać duże dzikie zwierzęta, a następnie przetransportować je do [concept_dubois_zoo]. Podczas jednego safari można schwytać tylko jedno zwierzę. W zależności od gatunku konieczne może być zastawianie pułapek lub podążanie jego tropem. Zasadniczo duże, powolne zwierzęta wymagają większej liczby pułapek, natomiast szybkie zwierzęta wymagają intensywniejszego tropienia."
 MR_ZOOLOGICAL_EXPEDITION_ACTIVE_TT: "#T Schwytaj Lokalne Zwierzęta#!\n#p Twój Przyrodnik zajmuje się obecnie chwytaniem lokalnych zwierząt.#!\nNa terenie naszego kraju znajdują się siedliska fascynujących gatunków zwierząt, które mogłyby zostać zaprezentowane w [concept_dubois_zoo]. [concept_dubois_naturalist] ma przez rok podróżować po kraju, aby pozyskać [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals$')] dla ogrodu zoologicznego."
 MR_CHEMIST_IMPROVE_FERTILIZER_BUTTON: "Ulepsz Nawozy"
 MR_CHEMIST_IMPROVE_FERTILIZER_TRIGGER_TT: "#default_text Co najmniej jedna Fabryka Nawozów na poziomie 1 lub wyższym nie posiada wszystkich trzech [Concept('concept_modifier','$concept_modifiers$')].#!"
 MR_CHEMIST_IMPROVE_EXPLOSIVES_BUTTON: "Ulepsz Materiały Wybuchowe"
 MR_CHEMIST_IMPROVE_EXPLOSIVES_TRIGGER_TT: "#default_text Co najmniej jedna Fabryka Materiałów Wybuchowych na poziomie 1 lub wyższym nie posiada wszystkich trzech [Concept('concept_modifier','$concept_modifiers$')].#!"
 MR_CHEMIST_IMPROVE_SYNTHETICS_BUTTON: "Ulepsz Materiały Syntetyczne"
 MR_CHEMIST_IMPROVE_SYNTHETICS_TRIGGER_TT: "#default_text Co najmniej jedna Fabryka Materiałów Syntetycznych na poziomie 1 lub wyższym nie posiada wszystkich trzech [Concept('concept_modifier','$concept_modifiers$')].#!"
 MR_CHEMIST_CONGRESS_BUTTON: "Kongres Chemików"
 MR_CHEMIST_TRIGGER_TT: "#default_text Posiada [concept_mendelejew_chemist].#!"
 MR_CHEMIST_CONGRESS_5_CHEMISTS_TRIGGER_TT: "#default_text Co najmniej #V 5 państw#! posiada [concept_mendelejew_chemist].#!"
 MR_CHEMIST_CONGRESS_ELEMENTS_TRIGGER_TT: "#default_text Na całym świecie zweryfikowano łącznie co najmniej #V 60#! [Concept('concept_mendelejew_element','$concept_mendelejew_elements$')] (wyizolowano [GetGlobalVariable('mendelejew_isolated_elements_global_number_var').GetValue|+0]).#!"
 MR_MOUNT_SKELETON_ACTIVE_TT: "#T Zbuduj Szkielet Dinozaura#!\n#p Twój Paleontolog zajmuje się obecnie budową Szkieletu Dinozaura.#!\nTwój [concept_dubois_paleontologist] może zbudować nowy [concept_dubois_dinosaur_skeleton], wykorzystując 5 [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones$')] pochodzących z tego samego kontynentu."
 MR_REMOUNT_SKELETON_ACTIVE_TT: "#T Zrekonstruuj Szkielet Dinozaura#!\n#p Twój Paleontolog zajmuje się obecnie rekonstrukcją Szkieletu Dinozaura.#!\nJeśli posiadasz niedoskonałe [Concept('concept_dubois_dinosaur_skeleton','$concept_dubois_dinosaur_skeletons$')], możesz zlecić swojemu [concept_dubois_paleontologist] próbę ich ponownego złożenia. Jeśli twój Paleontolog ma wystarczające doświadczenie, zrekonstruowany szkielet może być lepszej jakości."
 MR_UPPER_EGYPT_EXPEDITION_ACTIVE_TT: "#T Wyprawa do Doliny Królów#!\n#p Twój Archeolog uczestniczy obecnie w wyprawie do Doliny Królów.#!\nGórny Egipt, ze starożytną stolicą w Tebach i Doliną Królów, uważany jest za Mekkę egiptologii. Powinniśmy uzyskać pozwolenie na prowadzenie wykopalisk na tym obszarze i rozpocząć poszukiwania egipskich skarbów."
 MR_LOWER_EGYPT_EXPEDITION_ACTIVE_TT: "#T Wyprawa do Piramid#!\n#p Twój Archeolog uczestniczy obecnie w wyprawie do Piramid.#!\nOd zarania dziejów egipskie piramidy fascynują ludzkość. Mówi się, że inne grobowce, świątynie, a nawet całe miasta, które zaginęły w piaskach Dolnego Egiptu, wciąż czekają na ponowne odkrycie."
 MR_BABYLONIA_EXPEDITION_ACTIVE_TT: "#T Wyprawa do Babilonii#!\n#p Twój Archeolog uczestniczy obecnie w wyprawie do Babilonii.#!\nBabilonia, południowa część Mezopotamii, zawdzięcza swoją nazwę niegdyś potężnemu miastu Babilon. Region ten uważany jest za „kolebkę cywilizacji”, w której raz po raz odkrywane są cenne artefakty archeologiczne. Zdecydowanie zasługują one na miejsce w muzeum."
 MR_ASSYRIA_EXPEDITION_ACTIVE_TT: "#T Wyprawa do Asyrii#!\n#p Twój Archeolog uczestniczy obecnie w wyprawie do Asyrii.#!\nAsyria obejmuje północną część Mezopotamii, w której znajdują się dwa ważne miasta: Aszur i Niniwa. Nasza skromna wiedza o tym kraju wciąż opiera się głównie na przekazach biblijnych. Być może jednak istnieją bardziej wiarygodne świadectwa historyczne?"
 MR_ARGOLIS_EXPEDITION_ACTIVE_TT: "#T Wyprawa do Argolidy#!\n#p Twój Archeolog uczestniczy obecnie w wyprawie do Argolidy.#!\nPo odkryciu Troi nawet sceptyczni naukowcy zaczynają dostrzegać, że mity starożytnych Greków są czymś więcej niż tylko baśniami. Mówi się, że w Argolidzie do dziś spoczywają pozostałości miast z epoki brązu, z których najbardziej znane są Mykeny. Powinniśmy przekonać się o tym na własne oczy."
 MR_CRETE_EXPEDITION_ACTIVE_TT: "#T Wyprawa na Kretę#!\n#p Twój Archeolog uczestniczy obecnie w wyprawie na Kretę.#!\nWedług legendy na Krecie panował niegdyś król Minos. Podobnie jak w przypadku Troi i Myken, wydaje się, że również w tej opowieści kryje się ziarno prawdy. Na wyspie odkrywa się coraz więcej artefaktów pochodzących z legendarnej kultury minojskiej. Nasz kraj również powinien zdobyć kilka z nich."
 MR_YUCATAN_EXPEDITION_ACTIVE_TT: "#T Wyprawa na Jukatan#!\n#p Twój Archeolog uczestniczy obecnie w wyprawie na Jukatan.#!\nPojawia się coraz więcej doniesień o nieznanych, ogromnych miastach ukrytych w głębi dżungli. Powinniśmy dokładniej zbadać te doniesienia i wysłać wyprawę archeologiczną na Jukatan."
 MR_PERU_EXPEDITION_ACTIVE_TT: "#T Wyprawa do Peru#!\n#p Twój Archeolog uczestniczy obecnie w wyprawie do Peru.#!\nPiloci donoszą o tajemniczych fortecach i otoczonych murami budowlach w Andach, które dostrzegli podczas lotów nad Peru. Być może Hiszpanie nie zniszczyli całkowicie kultury Inków? Niektóre osady rdzennej ludności, stawiającej opór najeźdźcom, do dziś nie zostały odnalezione."
 MR_FOSSIL_IDENTIFICATION_ACTIVE_TT: "#T Zidentyfikuj Skamieniałości#!\n#p Twój Antropolog zajmuje się obecnie identyfikacją skamieniałości.#!\n[concept_andersson_anthropologist] potrafi przeanalizować nieznaną kość i po pewnym czasie przypisać ją do określonego gatunku człowieka lub jego przodków. Jeśli uda mu się przypisać trzy kości do tego samego gatunku, może skutecznie usystematyzować ten gatunek. Czas potrzebny do prawidłowej identyfikacji kości zależy od doświadczenia antropologa."
 MR_CONDUCTING_ACTIVE_TT: "#p Twój Kompozytor prowadzi obecnie Sezon Operowy.#!\n[Localize('concept_elgar_conducting_desc')]"
 MR_MUSIC_TOUR_ACTIVE_TT: "#p Twój Kompozytor jest obecnie w Trasie Muzycznej.#!\n[Localize('concept_elgar_musical_tour_desc')]"
 MR_NEWSPAPER_NOVEL_ACTIVE_TT: "#T Powieść w Odcinkach#!\n#p Twój Pisarz pisze obecnie Powieść w Odcinkach.#!\nW XIX wieku publikowanie powieści w odcinkach na łamach gazet zapewniało wielu autorom stały dochód i ogólnokrajową sławę. Wielu znanych pisarzy tamtej epoki, takich jak Tołstoj, Dostojewski, Flaubert czy Dumas, publikowało swoje powieści najpierw w odcinkach na łamach gazet, zanim ukazały się one w formie książkowej."
 MR_READNG_TOUR_ACTIVE_TT: "#T Trasa Czytelnicza#!\n#p Twój Pisarz jest obecnie w Trasie Czytelniczej.#!\nPisarz cieszący się międzynarodowym uznaniem i utrzymujący kontakty z zagranicznymi wydawcami może zwiększyć sławę swojego kraju, wyruszając w trasę czytelniczą. Pozwoli to nie tylko zacieśnić wzajemne stosunki, ale również zwiększyć jego reputację."
 MR_PAINTER_TRIP_ACTIVE_TT: "#T Podróż Edukacyjna#!\n#p Twój Malarz odbywa obecnie Podróż Edukacyjną.#!\nPodczas [concept_klimt_painter_trip] artysta może poznać nieznany mu wcześniej styl artystyczny, zwiększając tym samym roczny przyrost [concept_klimt_painting_tradition]. Podczas pobytu w zagranicznym [concept_artists_center_of_arts] może również zdobyć inne pozytywne i negatywne cechy."
 MR_MOUNTAIN_EXPEDITION_ACTIVE_TT: "#T Wyprawa Górska#!\n#p Obecnie trwa Wyprawa Górska.#!\nWraz ze zdobyciem Mont Blanc w 1786 roku rozpoczęła się nowa era podboju najwyższych szczytów Ziemi. Zainteresowanie wspinaczką górską stale rosło w XIX i XX wieku. Jeśli na jednym z naszych terytoriów znajduje się pasmo górskie, którego szczyty nie zostały jeszcze zdobyte, moglibyśmy powierzyć ich zdobycie zdolnemu generałowi posiadającemu odpowiednie umiejętności."
 MR_AIR_COMBAT_MISSION_ACTIVE_TT: "#T Lotnicza Misja Bojowa#!\n#p Twój Pilot uczestniczy obecnie w Lotniczej Misji Bojowej.#!"
 MR_AIRCRAFT_PARADE_ACTIVE_TT: "#T Parada Lotnicza#!\n#p Twój Pilot uczestniczy obecnie w Paradzie Lotniczej.#!"
