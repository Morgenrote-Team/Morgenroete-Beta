 MR_FIRST_EXCAVATION_TEAM_BUTTON: "Pierwszy Zespół Archeologiczny"
 MR_FIRST_EXCAVATION_TEAM_BUTTON_TT: "#T Pierwszy Zespół Archeologiczny#!\nMożemy wyszkolić dodatkowy zespół archeologów. Pozwoli to prowadzić kilka wykopalisk jednocześnie.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
