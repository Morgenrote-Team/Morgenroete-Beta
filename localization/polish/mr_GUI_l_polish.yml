 MR_CRETACEOUS_SCENERY_BUTTON_TT: "#T Stwórz Dioramę z Okresu Kredowego#!\nGdy globalna wiedza geologiczna osiągnie odpowiedni poziom, paleontolodzy będą mogli urządzać na uniwersytetach sale z prehistorycznymi dioramami. Na jednym uniwersytecie może znajdować się tylko jedna taka diorama. Pozwól swojemu Paleontologowi stworzyć dioramę przedstawiającą Okres Kredowy.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_CRETACEOUS_SCENERY_BUTTON_STOP_TT: "#T Przerwij Tworzenie Dioramy z Okresu Kredowego#!\nPozwól swojemu Paleontologowi #n przerwać#! tworzenie Dioramy z Okresu Kredowego i ponownie udostępnić go do innych zadań.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_JURASSIC_SCENERY_BUTTON_TT: "#T Stwórz Dioramę z Okresu Jurajskiego#!\nGdy globalna wiedza geologiczna osiągnie odpowiedni poziom, paleontolodzy będą mogli urządzać na uniwersytetach sale z prehistorycznymi dioramami. Na jednym uniwersytecie może znajdować się tylko jedna taka diorama. Pozwól swojemu Paleontologowi stworzyć dioramę przedstawiającą Okres Jurajski.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_JURASSIC_SCENERY_BUTTON_STOP_TT: "#T Przerwij Tworzenie Dioramy z Okresu Jurajskiego#!\nPozwól swojemu Paleontologowi #n przerwać#! tworzenie Dioramy z Okresu Jurajskiego i ponownie udostępnić go do innych zadań.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
