 MR_IMPROVE_FORESTRY_ACTIVE_TT: "#T Ulepsz Leśnictwo#!\n#p Twój Przyrodnik obecnie usprawnia działanie budynku typu [GetBuildingType('building_logging_camp').GetName].#!"
 MR_NATURALIST_IMPROVE_RUBBER_BUTTON_TT: "#T Ulepsz Plantacje Kauczuku#!\nTwój Przyrodnik może wykorzystać swoje umiejętności do usprawnienia działania budynków typu [GetBuildingType('building_rubber_plantation').GetName] w Twoim kraju.\n\nModyfikatory, które otrzyma budynek:\n$dubois_building_throughput_add_modifier_with_tooltip$\n$dubois_building_production_mult_modifier_with_tooltip$\n$dubois_building_goods_input_mult_modifier_with_tooltip$\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_NATURALIST_IMPROVE_RUBBER_TRIGGER_TT: "#default_text Co najmniej jeden budynek typu [GetBuildingType('building_rubber_plantation').GetName] na poziomie 1 lub wyższym nie posiada wszystkich trzech [Concept('concept_modifier','$concept_modifiers$')].#!"
 MR_IMPROVE_RUBBER_ACTIVE_TT: "#T Ulepsz Plantacje Kauczuku#!\n#p Twój Przyrodnik obecnie usprawnia działanie budynków typu [GetBuildingType('building_rubber_plantation').GetName].#!"
 MR_CHEMIST_SYNTHETIC_RUBBER_BUTTON: "Kauczuk Syntetyczny"
 MR_CHEMIST_SYNTHETIC_RUBBER_BUTTON_TT: "#T Kauczuk Syntetyczny#!\nProdukcja kauczuku jest ograniczona do bardzo wąskiej strefy klimatycznej. Bez kolonii lub importu pozyskanie tego cennego surowca jest niezwykle trudne. Być może jednak możliwości chemii pozwolą nam zrekompensować to, czego brakuje nam gdzie indziej?\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ANIMAL_DOCUMENTATION_BUTTON: "Udokumentuj Lokalną Faunę"
 MR_ANIMAL_DOCUMENTATION_BUTTON_TT: "#T Udokumentuj Lokalną Faunę#!\nW dążeniu do badania jak najbardziej egzotycznych zwierząt nie należy zaniedbywać rodzimej fauny. Przyrodnik może dokładnie badać zwierzęta żyjące w ich naturalnych siedliskach na terenach naszych prowincji rdzennych i publikować na ich temat prace naukowe.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ANIMAL_DOCUMENTATION_ACTIVE_TT: "#T Udokumentuj Lokalną Faunę#!\n#p Twój Przyrodnik obecnie dokumentuje lokalną faunę.#!\nW dążeniu do badania jak najbardziej egzotycznych zwierząt nie należy zaniedbywać rodzimej fauny. Przyrodnik może dokładnie badać zwierzęta żyjące w ich naturalnych siedliskach na terenach naszych prowincji rdzennych i publikować na ich temat prace naukowe."
 MR_CAN_DOCUMENT_ANIMAL_TRIGGER_TT: "#indent_newline:6 #default_text $mr_simple_checkbox_loc$ [GetPlayer.GetName] posiada co najmniej jeden zintegrowany obszar z siedliskiem zwierząt, w którym występują nieudokumentowane [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals$')].#!#!"
 MR_GEOLOGIST_ACTIVE_TRIGGER_TT: "#default_text [GetPlayer.GetName] posiada [concept_agassiz_geologist], który #V nie jest zajęty#!.#!"
 MR_GEOLOGIST_FIND_ORE_TRIGGER_TT: "#default_text Co najmniej jeden budynek kopalni na poziomie 1 lub wyższym nie posiada [Concept('concept_modifier','$concept_modifiers$')] $agassiz_building_production_mult_modifier_with_tooltip$.#!"
 MR_GEOLOGIST_FIND_OIL_TRIGGER_TT: "#default_text Co najmniej jedna wieża wiertnicza na poziomie 1 lub wyższym nie posiada [Concept('concept_modifier','$concept_modifiers$')] $agassiz_building_production_2_mult_modifier_with_tooltip$.#!"
 MR_SELL_MINERALS_FOR_RARE_MINERAL_BUTTON: "Sprzedaj Minerały w zamian za Rzadkie Minerały"
 MR_SELL_MINERALS_FOR_RARE_MINERAL_TRIGGER: "#default_text [GetPlayer.GetName] posiada #V 20 000 lub więcej#! [Concept('concept_agassiz_mineral','$concept_agassiz_minerals$')].#!"
 MR_MINERAL_CABINET_BUTTON: "Załóż Gabinet Mineralogiczny"
 MR_MINERAL_CABINET_BUTTON_TT: "#T Załóż Gabinet Mineralogiczny#!\nGabinet Mineralogiczny w naszym Ogrodzie Zoologicznym dodatkowo zwiększy jego prestiż. Będziemy mogli wystawiać w nim wszystkie minerały zebrane przez naszego [concept_agassiz_geologist].\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_MINERAL_CABINET_NUMBER_TRIGGER_TT: "#default_text [GetPlayer.GetName] posiada #V 50 lub więcej#! [Concept('concept_agassiz_rare_mineral','$concept_agassiz_rare_minerals$')] (obecnie [GetPlayer.MakeScope.Var('agassiz_rare_minerals_var').GetValue|0+]).#!"
 MR_MINERAL_CABINET_EFFECT_TT: "Twój [GetBuildingType('building_dubois_zoo').GetName] otrzyma #V Gabinet Mineralogiczny#!, który zapewni 50 punktów prestiżu oraz niewielki wzrost poziomu życia."
 MR_GEOLOGIST_UNDERWATER_MOUNTAINS_BUTTON_TT: "#T Zbadaj Góry Atlantyckie#!\nPo odkryciu podmorskich wzniesień podczas układania kabla transatlantyckiego czołowi geolodzy zaczęli zastanawiać się nad przyczyną ich powstania. Nowoczesny sprzęt pomiarowy i doświadczony geolog mogliby rozwikłać tę zagadkę.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_GEOLOGIST_EXPERIENCED_TRIGGER_TT: "#default_text [GetPlayer.GetName] posiada #O doświadczonego#! lub #O sławnego#! [concept_agassiz_geologist].#!"
 MR_PALEONTOLOGIST_FAMOUS_TRIGGER_TT: "#default_text [GetPlayer.GetName] posiada #O sławnego#! [concept_dubois_paleontologist].#!"
 MR_GEOLOGIST_ORE_VEIN_BUTTON_TT: "#T Poszukuj Złóż Rudy#!\n[concept_agassiz_geologist] może poszukiwać nowych złóż surowców w pobliżu istniejących już kopalń, zwiększając w ten sposób wydobycie rudy.\n\nBudynek otrzyma [concept_modifier] $agassiz_building_production_mult_modifier_with_tooltip$\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_GEOLOGIST_ORE_VEIN_STOP_BUTTON_TT: "#T Zakończ Poszukiwanie Złóż Rudy#!\nTwój [concept_agassiz_geologist] obecnie poszukuje nowych złóż surowców w pobliżu istniejących już kopalń, zwiększając w ten sposób wydobycie rudy.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_GEOLOGIST_OIL_BUTTON_TT: "#T Poszukuj Złóż Ropy Naftowej#!\n[concept_agassiz_geologist] może poszukiwać nowych złóż ropy naftowej w pobliżu istniejących już wież wiertniczych, zwiększając w ten sposób wydobycie.\n\nBudynek otrzyma [Concept('concept_modifier','$concept_modifiers$')] $agassiz_building_production_2_mult_modifier_with_tooltip$\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 VISIT_OBSERVATORY_BUTTON: "Odwiedź Planetarium"
 VISIT_OBSERVATORY_BUTTON_TT: "#T Odwiedź Planetarium#!\nPlanetarium oferuje przegląd wiedzy astronomicznej Twojego kraju, innych państw oraz społeczności naukowej."
 MR_SELL_MINERALS_FOR_RARE_MINERAL_BUTTON_TT: "#T Sprzedaj Minerały w zamian za Rzadkie Minerały#!\n[concept_agassiz_geologist] może pozyskiwać [Concept('concept_agassiz_rare_mineral','$concept_agassiz_rare_minerals$')] od swoich współpracowników, kolekcjonerów i innych miłośników geologii. W zamian musi jednak oddać znaczną ilość pospolitych minerałów.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_GEOLOGIST_PALEONTOLOGIST_SYMPOSIUM_BUTTON: "Sympozjum Interdyscyplinarne"
 MR_GEOLOGIST_PALEONTOLOGIST_SYMPOSIUM_BUTTON_TT: "#T Sympozjum Geologiczno-Paleontologiczne#!\nGeologia i paleontologia mają ze sobą wiele wspólnego. Powinniśmy zgromadzić najwybitniejszych przedstawicieli obu dziedzin i wykorzystać możliwości wynikające z wymiany wiedzy do opracowania nowych teorii naukowych dotyczących historii Ziemi.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PROMOTING_GEOLOGIST_TT: "#T Promuj Geologa#!\n#p Obecnie promujesz Geologa.#!\n[Concept('concept_agassiz_geologist','$concept_agassiz_geologists$')] badają minerały, wulkany i inne formacje geologiczne."
