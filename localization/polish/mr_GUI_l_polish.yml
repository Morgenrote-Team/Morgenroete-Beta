 MR_ASTEROID_CONGRESS_BUTTON: "Kongres poświęcony planetoidom"
 MR_ASTEROID_CONGRESS_BUTTON_TT: "#T Kongres poświęcony planetoidom#!\nOd odkrycia Ceres w 1801 roku astronomowie znajdowali coraz więcej ciał niebieskich, przez co liczba planet w Układzie Słonecznym stale rosła. Odkrycie Neptuna nasunęło pytanie, czy nie rozsądniej byłoby utworzyć osobną kategorię dla licznych, mniejszych obiektów znajdowanych przede wszystkim między Marsem a Jowiszem. Zwłaszcza konieczność tworzenia nowych symboli astronomicznych oraz niewielkie rozmiary tych ciał skłaniały astronomów do uznania ich raczej za „małe gwiazdy” lub „małe planety”. Oczywiście taka klasyfikacja oznaczałaby, że część obiektów dotąd uznawanych za planety utraciłaby ten status i została zdegradowana do zwykłych głazów.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ASTEROID_CONGRESS_NEPTUNE_TT: "#default_text #V Neptun#! został odkryty.#!"
 MR_ASTEROID_CONGRESS_OBSERVATORY_BUILDING_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma budynek typu [GetBuildingType('building_verrier_observatory').GetName].#!"
 MR_ASTEROID_CONGRESS_ASTRONOMER_TRIGGER_TT: "#default_text Ma [concept_verrier_astronomer].#!"
 MR_ASTEROID_CONGRESS_OBJECTS_TRIGGER_TT: "#default_text Na całym świecie odkryto łącznie co najmniej #BLUE 1500#! @verrier_astronomicalobject! [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects$')] (obecnie odkryto [GetGlobalVariable('verrier_total_astronomical_objects').GetValue|+0] @verrier_astronomicalobject!).#!"
 MR_CARTE_DE_CIEL_CONGRESS_BUTTON: "Carte du Ciel"
 MR_CARTE_DE_CIEL_CONGRESS_BUTTON_TT: "#T Kongres poświęcony Carte du Ciel#!\nW 1887 roku dyrektor Obserwatorium Paryskiego Amédée Mouchez zainicjował zakrojony na niespotykaną dotąd skalę międzynarodowy projekt mapowania gwiazd. Dostrzegł bowiem, że nowa technika fotografii na suchych płytach może zrewolucjonizować tworzenie map nieba. W wyniku Kongresu Astrograficznego, który odbył się w Paryżu w kwietniu 1887 roku z udziałem ponad 50 astronomów, do projektu zgodziło się przystąpić 20 obserwatoriów z całego świata. Możemy zorganizować taki kongres, aby umożliwić międzynarodowej społeczności wymianę wiedzy astronomicznej.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ASTRONOMY_CONGRESS_5_YEARS_TRIGGER_TT: "#default_text #V Nie odbył się żaden Kongres Astronomiczny#! w ciągu #V ostatnich 5 lat#! (ostatni gospodarz nie ma modyfikatora „Organizacja Kongresu Astronomicznego”).#!"
 MR_CARTE_DE_CIEL_CONGRESS_OBJECTS_TRIGGER_TT: "#default_text Na całym świecie odkryto łącznie co najmniej #BLUE 7000#! @verrier_astronomicalobject! [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects$')] (obecnie odkryto [GetGlobalVariable('verrier_total_astronomical_objects').GetValue|+0] @verrier_astronomicalobject!).#!"
 MR_CARTE_DE_CIEL_CONGRESS_UNIVERSITY_BUILDING_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma budynek typu [GetBuildingType('building_university').GetName] na #V poziomie 10 lub wyższym#!.#!"
 MR_GREAT_DEBATE_CONGRESS_BUTTON: "Wielka Debata"
 MR_GREAT_DEBATE_CONGRESS_BUTTON_TT: "#T Wielka Debata#!\nDebata Shapleya i Curtisa, znana również jako Wielka Debata, skupiła w sobie dyskusje z początku XX wieku, które ostatecznie doprowadziły do nowego rozumienia natury galaktyk i rozmiarów Wszechświata. Dotyczyła wielkości Drogi Mlecznej oraz tego, czy galaktyki, nazywane wówczas mgławicami spiralnymi, są niewielkimi obiektami w jej obrębie, czy też leżą znacznie dalej i są od niej odrębne. Tego dnia obaj naukowcy przedstawili niezależne referaty naukowe dotyczące skali rozmiarów Wszechświata, po czym wieczorem odbyła się publiczna dyskusja. Możemy zorganizować taki kongres, aby przedyskutować najgłębsze tajemnice Wszechświata.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_GREAT_DEBATE_CONGRESS_OBJECTS_TRIGGER_TT: "#default_text Na całym świecie odkryto łącznie co najmniej #BLUE 12000#! @verrier_astronomicalobject! [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects$')] (obecnie odkryto [GetGlobalVariable('verrier_total_astronomical_objects').GetValue|+0] @verrier_astronomicalobject!).#!"
 SPECIMEN_VAR: "@dubois_specimen!  [GetPlayer.MakeScope.Var('dubois_specimen').GetValue|*V0]"
 SPECIMEN_VAR_TT: "#header [Concept('concept_dubois_specimen','$concept_dubois_specimens$')]#!\n[GetPlayer.GetName] zgromadziło @dubois_specimen! [GetPlayer.MakeScope.GetVariable('dubois_specimen').GetValue|V0] [Concept('concept_dubois_specimen','$concept_dubois_specimens$')]."
 MR_SAFARI_EXPEDITION_BUTTON_TT: "#T Heia Safari#!\nPodczas afrykańskiego safari można dzięki wytrwałemu tropieniu i zastawianiu pułapek schwytać duże zwierzęta, a następnie przetransportować je do [concept_dubois_zoo]. W trakcie jednego safari można schwytać tylko jedno zwierzę. W zależności od gatunku większe znaczenie ma zastawianie pułapek lub podążanie tropem zwierzęcia. Z reguły duże, powolne zwierzęta wymagają większej liczby pułapek, a szybkie — dłuższego tropienia.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_SAFARI_EXPEDITION_NATURALIST_TRIGGER_TT: "#default_text [GetPlayer.GetName] posiada [concept_dubois_naturalist], który #V nie jest zajęty#!.#!"
 MR_SAFARI_EXPEDITION_HAS_SMALL_OR_BIGGER_ZOO_TRIGGER_TT: "#default_text Masz [concept_dubois_zoo] o co najmniej #V małych rozmiarach#!.#!"
 MR_SAFARI_EXPEDITION_HABITAT_TRIGGER_TT: "#default_text [GetPlayer.GetName] #V posiada co najmniej jedno siedlisko dużych zwierząt afrykańskich#! lub takie siedlisko znajduje się w obszarze #V należącym do państwa zdecentralizowanego#!.#!"
 MR_SAFARI_EXPEDITION_RECENT_TRIGGER_TT: "#default_text [GetPlayer.GetName] nie prowadzi obecnie #V safari#! ani #V nie prowadziło go ostatnio#!.#!"
 MR_ZOOLOGICAL_EXPEDITION_BUTTON_TT: "#T Schwytaj Lokalne Zwierzęta#!\nNa terenie naszego kraju znajdują się siedliska fascynujących gatunków zwierząt, które mogłyby zostać zaprezentowane w [concept_dubois_zoo]. [concept_dubois_naturalist] ma przez rok podróżować po kraju, aby pozyskać [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals$')] dla ogrodu zoologicznego.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ZOOLOGICAL_EXPEDITION_LOCAL_ANIMALS_TRIGGER_TT: "#default_text [GetPlayer.GetName] posiada co najmniej jedno siedlisko, w którym żyją [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals$')], jakich nie ma w naszym [concept_dubois_zoo].#!"
 MR_ZOOLOGICAL_EXPEDITION_CURRENT_EXPEDITION_TRIGGER_TT: "#default_text [GetPlayer.GetName] nie prowadzi #V obecnie odłowu miejscowych zwierząt#!.#!"
 MR_HIPPOCAMPUS_CONGRESS_BUTTON: "Kongres Hipokampa"
 MR_HIPPOCAMPUS_CONGRESS_BUTTON_TT: "#T Kongres Hipokampa#!\nJak bardzo wyjątkowy jest człowiek? Ile jest w nim zwierzęcia? Już starożytni Grecy dostrzegali podobieństwo między ludźmi a małpami. Fakt, że Karol Linneusz zaliczył małpy i ludzi do naczelnych — „najwyższego” rzędu wśród zwierząt — pokazuje, że zagadnienie to nie budziło niegdyś aż takich kontrowersji. Jednak sformułowanie teorii ewolucji i przypuszczenie, że człowiek pochodzi od małpopodobnego przodka, wywołały spory, które trzeba teraz rozstrzygnąć.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_NATURALIST_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma [concept_dubois_naturalist]#!"
 MR_HIPPOCAMPUS_CONGRESS_5_NATURALISTS_TRIGGER_TT: "#default_text Co najmniej #V 5 państw#! ma [concept_dubois_naturalist].#!"
 MR_HIPPOCAMPUS_CONGRESS_SPECIMEN_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma #V co najmniej 20000#! [Concept('concept_dubois_specimen','$concept_dubois_specimens$')] (obecnie [GetPlayer.MakeScope.Var('dubois_specimen').GetValue|0+]).#!"
 MR_HIPPOCAMPUS_CONGRESS_GLOBAL_SPECIMEN_TRIGGER_TT: "#default_text #V Co najmniej 100000#! [Concept('concept_dubois_specimen','$concept_dubois_specimens$')] zgromadzono na całym świecie (obecnie [GetGlobalVariable('dubois_global_specimen').GetValue|0+]).#!"
 MR_EXTEND_ZOO_SMALL_BUTTON: "Rozbuduj [concept_dubois_zoo] (małe)"
 MR_EXTEND_ZOO_SMALL_BUTTON_TT: "#T Rozbuduj Zoo do Małych Rozmiarów#!\n[Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals$')] cieszą wszystkich: zwiedzający miło spędzają czas w zoo, naukowcy mogą kontynuować badania zoologiczne, a ci, którzy zgromadzą jak najwięcej gatunków obcej fauny, zyskują międzynarodowy prestiż. Każda rozbudowa zwiększa prestiż państwa. Niektóre etapy rozbudowy wymagają zgromadzenia nie tylko wielu zwierząt, lecz także okazów z różnych części świata.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_EXTEND_ZOO_SMALL_10_TOTAL_ANIMALS_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma #V łącznie 10#! [Concept('concept_dubois_zoo_animal','$concept_dubois_zoo_animals$')]. Obecnie masz [GetPlayer.MakeScope.Var('dubois_zoo_animal_total').GetValue|0+].#!"
 MR_EXTEND_ZOO_SMALL_2_SPECIAL_ANIMALS_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma #V 2 afrykańskie#! [Concept('concept_dubois_zoo_animal','$concept_dubois_zoo_animals$')] (obecnie [GetPlayer.MakeScope.Var('dubois_zoo_animal_africa').GetValue|0+]), #V 2 azjatyckie#! [Concept('concept_dubois_zoo_animal','$concept_dubois_zoo_animals$')] (obecnie [GetPlayer.MakeScope.Var('dubois_zoo_animal_asia').GetValue|0+]) lub #V 2 oceaniczne#! [Concept('concept_dubois_zoo_animal','$concept_dubois_zoo_animals$')] (obecnie [GetPlayer.MakeScope.Var('dubois_zoo_animal_australia').GetValue|0+])."
 MR_EXTEND_ZOO_SMALL_CURRENT_EXPANSION_TRIGGER_TT: "#default_text [GetPlayer.GetName] #V nie rozbudowuje obecnie#! [concept_dubois_zoo].#!"
 MR_EXTEND_ZOO_MEDIUM_BUTTON: "Rozbuduj [concept_dubois_zoo] (średnie)"
 MR_EXTEND_ZOO_MEDIUM_BUTTON_TT: "#T Rozbuduj Zoo do Średnich Rozmiarów#!\n[Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals$')] cieszą wszystkich: zwiedzający miło spędzają czas w zoo, naukowcy mogą kontynuować badania zoologiczne, a ci, którzy zgromadzą jak najwięcej gatunków obcej fauny, zyskują międzynarodowy prestiż. Każda rozbudowa zwiększa prestiż państwa. Niektóre etapy rozbudowy wymagają zgromadzenia nie tylko wielu zwierząt, lecz także okazów z różnych części świata.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_EXTEND_ZOO_SMALL_20_TOTAL_ANIMALS_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma #V łącznie 20#! [Concept('concept_dubois_zoo_animal','$concept_dubois_zoo_animals$')]. Obecnie masz [GetPlayer.MakeScope.Var('dubois_zoo_animal_total').GetValue|0+].#!"
 MR_EXTEND_ZOO_SMALL_5_SPECIAL_ANIMALS_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma #V 5 afrykańskich#! [Concept('concept_dubois_zoo_animal','$concept_dubois_zoo_animals$')] (obecnie [GetPlayer.MakeScope.Var('dubois_zoo_animal_africa').GetValue|0+]), #V 5 azjatyckich#! [Concept('concept_dubois_zoo_animal','$concept_dubois_zoo_animals$')] (obecnie [GetPlayer.MakeScope.Var('dubois_zoo_animal_asia').GetValue|0+]), #V 5 oceanicznych#! [Concept('concept_dubois_zoo_animal','$concept_dubois_zoo_animals$')] (obecnie [GetPlayer.MakeScope.Var('dubois_zoo_animal_australia').GetValue|0+]) lub #V 5 południowoamerykańskich#! [Concept('concept_dubois_zoo_animal','$concept_dubois_zoo_animals$')] (obecnie [GetPlayer.MakeScope.Var('dubois_zoo_animal_south_america').GetValue|0+]).#!"
 MR_EXTEND_ZOO_LARGE_BUTTON: "Rozbuduj [concept_dubois_zoo] (duże)"
 MR_EXTEND_ZOO_LARGE_BUTTON_TT: "#T Rozbuduj Zoo do Dużych Rozmiarów#!\n[Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals$')] cieszą wszystkich: zwiedzający miło spędzają czas w zoo, naukowcy mogą kontynuować badania zoologiczne, a ci, którzy zgromadzą jak najwięcej gatunków obcej fauny, zyskują międzynarodowy prestiż. Każda rozbudowa zwiększa prestiż państwa. Niektóre etapy rozbudowy wymagają zgromadzenia nie tylko wielu zwierząt, lecz także okazów z różnych części świata.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_EXTEND_ZOO_SMALL_30_TOTAL_ANIMALS_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma #V łącznie 30#! [Concept('concept_dubois_zoo_animal','$concept_dubois_zoo_animals$')]. Obecnie masz [GetPlayer.MakeScope.Var('dubois_zoo_animal_total').GetValue|0+].#!"
 MR_EXTEND_ZOO_FAMOUS_BUTTON: "Rozbuduj [concept_dubois_zoo] (słynne)"
 MR_EXTEND_ZOO_FAMOUS_BUTTON_TT: "#T Rozbuduj Zoo do Rangi Słynnego#!\n[Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals$')] cieszą wszystkich: zwiedzający miło spędzają czas w zoo, naukowcy mogą kontynuować badania zoologiczne, a ci, którzy zgromadzą jak najwięcej gatunków obcej fauny, zyskują międzynarodowy prestiż. Każda rozbudowa zwiększa prestiż państwa. Niektóre etapy rozbudowy wymagają zgromadzenia nie tylko wielu zwierząt, lecz także okazów z różnych części świata.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_EXTEND_ZOO_SMALL_40_TOTAL_ANIMALS_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma #V łącznie 40#! [Concept('concept_dubois_zoo_animal','$concept_dubois_zoo_animals$')]. Obecnie masz [GetPlayer.MakeScope.Var('dubois_zoo_animal_total').GetValue|0+]#!"
 MR_SPECIMEN_GARDEN_BUTTON: "Załóż Ogród Botaniczny"
 MR_SPECIMEN_GARDEN_BUTTON_TT: "#T Załóż Ogród Botaniczny#!\nOgród botaniczny w Twoim zoo jeszcze bardziej podniesie jego prestiż. Możemy w nim posadzić wszystkie egzotyczne rośliny zebrane przez naszego [concept_dubois_naturalist].\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_SPECIMEN_GARDEN_SPECIMEN_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma #V co najmniej 50000#! [Concept('concept_dubois_specimen','$concept_dubois_specimens$')] (obecnie [GetPlayer.MakeScope.Var('dubois_specimen').GetValue|0+]).#!"
 MR_SPECIMEN_GARDEN_NO_BOTANICAL_GARDEN_TRIGGER_TT: "#default_text [GetPlayer.GetName] nie ma jeszcze #V Ogrodu Botanicznego#!.#!"
 MR_SPECIMEN_GARDEN_EFFECT_TT: "[GetBuildingType('building_dubois_zoo').GetName] zyska #V Ogród Botaniczny#!, który zapewni Ci 50 punktów prestiżu i nieznacznie podniesie poziom życia."
 MR_SPECIMEN_COLLECTION_BUTTON: "Załóż Kolekcję Okazów"
 MR_SPECIMEN_COLLECTION_BUTTON_TT: "#T Załóż Kolekcję Okazów#!\nUporządkowanie wszystkich naszych egzotycznych owadów, motyli i innych [Concept('concept_dubois_specimen','$concept_dubois_specimens$')] pokazałoby światu, jak zaawansowana jest nauka w naszym kraju.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_SPECIMEN_GARDEN_NO_SPECIMEN_COLLECTION_TRIGGER_TT: "#default_text [GetPlayer.GetName] nie ma jeszcze #V Kolekcji Okazów#!.#!"
 MR_SPECIMEN_COLLECTION_EFFECT_TT: "[GetBuildingType('building_dubois_zoo').GetName] zyska #V Kolekcję Okazów#!, która zapewni Ci 50 punktów prestiżu i niewielkie premie do badań."
 MR_BAN_ANIMAL_EXPORT_BUTTON: "Zakaż Eksportu Zwierząt"
 MR_BAN_ANIMAL_EXPORT_BUTTON_TT: "#T Zakaż Eksportu Zwierząt#!\nZakazując eksportu zwierząt, jasno dajemy do zrozumienia, że nie zamierzamy sprzedawać żadnych naszych zwierząt za granicę. Inne państwa przestaną składać zapytania w tej sprawie.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ALLOW_ANIMAL_EXPORT_BUTTON: "Zezwól na Eksport Zwierząt"
 MR_ALLOW_ANIMAL_EXPORT_BUTTON_TT: "#T Zezwól na Eksport Zwierząt#!\nZezwalając na eksport zwierząt, możemy zapewnić sobie pokaźny dodatkowy dochód.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BREEDING_ANIMALS_BUTTON: "Rozmnażaj Zwierzęta"
 MR_BREEDING_ANIMALS_BUTTON_TT: "#T Rozmnażaj Zwierzęta w Swoim Rezerwacie Przyrody#!\nSpróbuj utworzyć dla [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animal$')] nowe [concept_dubois_habitat] w obszarze z [concept_dubois_nature_reserve].\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BREEDING_ANIMALS_TRIGGER: "#default_text Możesz rozmnażać [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals$')], jeśli posiadasz obszar z [concept_dubois_nature_reserve], w którym nie występuje jeszcze dany gatunek pochodzący z tego samego regionu co #V Rezerwat Przyrody#!, a masz go w swoim [concept_dubois_zoo].\nJeśli na przykład masz #b Rezerwat Przyrody#! w obszarze europejskim i chcesz rozmnażać w nim #b koziorożca alpejskiego#!, możesz to zrobić tylko wtedy, gdy obszar nie ma jeszcze [concept_dubois_habitat] koziorożców, a w Twoim #b Zoo#! żyją #b koziorożce alpejskie#!.#!"
 FOSSIL_VAR: "@dubois_fossil!  [GetPlayer.MakeScope.Var('dubois_fossil').GetValue|V0]"
