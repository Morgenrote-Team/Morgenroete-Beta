 MR_PHYSICIAN_DESCRIBE_DISEASE_BUTTON_TT: "#T Opis choroby#!\nLekarz może sporządzić bardziej szczegółowy, naukowy opis wcześniej nieopisanej choroby, jeśli szerzy się ona jako epidemia na terytorium kraju. Jest to ważny wstępny krok w kierunku opracowania metody jej leczenia.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIAN_DESCRIBE_DISEASE_ACTIVE_TT: "#T Opis choroby#!\n#p Twój $concept_panum_physician$ pracuje obecnie nad pierwszym opisem choroby.#!\nLekarz może sporządzić bardziej szczegółowy, naukowy opis wcześniej nieopisanej choroby, jeśli szerzy się ona jako epidemia na terytorium kraju. Jest to ważny wstępny krok w kierunku opracowania metody jej leczenia."
 MR_ACTIVE_PHYSICIAN_TRIGGER: "#default_text [GetPlayer.GetName] posiada [concept_panum_physician], który jest #V wolny#!.#!"
 MR_PHYSICIAN_CAN_DESCRIBE_LOCAL_DISEASE_TRIGGER_TT: "#default_text [GetPlayer.GetName] zmaga się z chorobą epidemiczną, która nie została jeszcze w pełni opisana.#!"
 MR_PHYSICIAN_DESCRIBE_DISEASE_FOREIGN_BUTTON_TT: "#T Medyczna ekspedycja obserwacyjna#!\nLekarz może wyruszyć na ekspedycję do odległego kraju, w którym szerzy się epidemia, aby opisać występującą tam chorobę. Proces ten trwa dłużej niż postawienie diagnozy we własnym kraju.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIAN_DESCRIBE_DISEASE_FOREIGN_ACTIVE_TT: "#T Medyczna ekspedycja obserwacyjna#!\n#p Twój $concept_panum_physician$ uczestniczy obecnie w medycznej ekspedycji obserwacyjnej.#!\nLekarz może wyruszyć na ekspedycję do odległego kraju, w którym szerzy się epidemia, aby opisać występującą tam chorobę. Proces ten trwa dłużej niż postawienie diagnozy we własnym kraju."
 MR_PHYSICIAN_CAN_DESCRIBE_FOREIGN_DISEASE_TRIGGER_TT: "#default_text [GetPlayer.GetName] posiada interes w kraju, który zmaga się z chorobą epidemiczną, która nie została jeszcze w pełni opisana.#!"
 MR_PHYSICIAN_FIND_TREATMENT_BUTTON_TT: "#T Leczenie choroby#!\nLekarz może opracować metodę leczenia choroby szerzącej się jako epidemia na terytorium kraju. Chociaż leczenie nie zapobiegnie chorobie, znacznie ograniczy jej skutki. W przypadku niektórych chorób opracowanie metody leczenia wymaga wcześniejszego zbadania określonej technologii.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIAN_FIND_TREATMENT_ACTIVE_TT: "#T Leczenie choroby#!\n#p Twój $concept_panum_physician$ poszukuje obecnie metody leczenia choroby.#!\nLekarz może opracować metodę leczenia choroby szerzącej się jako epidemia na terytorium kraju. Chociaż leczenie nie zapobiegnie chorobie, znacznie ograniczy jej skutki. W przypadku niektórych chorób opracowanie metody leczenia wymaga wcześniejszego zbadania określonej technologii."
 MR_PHYSICIAN_CAN_FIND_LOCAL_TREATMENT_TRIGGER_TT: "#default_text [GetPlayer.GetName] zmaga się z epidemią choroby, która została już opisana, ale dla której nie opracowano jeszcze metody leczenia, i posiada technologię niezbędną do jej opracowania.#!"
 MR_PHYSICIAN_FIND_TREATMENT_FOREIGN_BUTTON_TT: "#T Medyczna ekspedycja badawcza#!\nLekarz może wyruszyć na ekspedycję do odległego kraju, w którym szerzy się epidemia, aby zbadać występującą tam chorobę i opracować metodę jej leczenia. Proces ten trwa dłużej niż prowadzenie badań we własnym kraju. W przypadku niektórych chorób opracowanie metody leczenia wymaga wcześniejszego zbadania określonej technologii.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIAN_FIND_TREATMENT_FOREIGN_ACTIVE_TT: "#T Medyczna ekspedycja badawcza#!\n#p Twój $concept_panum_physician$ poszukuje obecnie metody leczenia choroby.#!\nLekarz może wyruszyć na ekspedycję do odległego kraju, w którym szerzy się epidemia, aby zbadać występującą tam chorobę i opracować metodę jej leczenia. Proces ten trwa dłużej niż prowadzenie badań we własnym kraju. W przypadku niektórych chorób opracowanie metody leczenia wymaga wcześniejszego zbadania określonej technologii."
 MR_PHYSICIAN_CAN_FIND_FOREIGN_TREATMENT_TRIGGER_TT: "#default_text [GetPlayer.GetName] posiada interes w kraju, który zmaga się z epidemią choroby, która została już opisana, ale dla której nie opracowano jeszcze metody leczenia, i posiada technologię niezbędną do jej opracowania.#!"
