 MR_MEDICAL_CONGRESS_BUTTON_TT: "#T Zorganizuj Kongres Medyczny#!\nWraz z rewolucją w badaniach medycznych i jednoczesnym rozprzestrzenianiem się niebezpiecznych epidemii rosła potrzeba dzielenia się odkryciami na międzynarodowych kongresach dla dobra ludzkości. Przy odrobinie szczęścia możliwa będzie wymiana wiedzy na temat opisów chorób, patogenów, metod leczenia oraz szczepionek. W wydarzeniu dominują lekarze, ale obecni są również mikrobiolodzy.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
