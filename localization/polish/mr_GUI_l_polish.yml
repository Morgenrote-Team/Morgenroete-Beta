 MR_PALEONTOLOGICAL_EXPEDITION_BUTTON_TT: "#T Wyprawa paleontologiczna#!\nWyślij swojego [concept_dubois_paleontologist] na [concept_dubois_paleontological_expedition]. Wyprawa trwa 1 rok i pozwala zdobyć określoną liczbę [Concept('concept_dubois_fossil','$concept_dubois_fossils$')] oraz [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones$')].\n\nPo zakończeniu wyprawy możesz pozostawić [concept_dubois_paleontological_team], aby założyć [concept_dubois_paleontological_excavation].\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
