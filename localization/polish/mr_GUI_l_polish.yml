 MR_IMPRESSIONISM_BUTTON: "Impresjonizm"
 MR_IMPRESSIONISM_BUTTON_TT: "#T Wybierz Impresjonizm#!\n[concept_elgar_impressionism] to styl w historii sztuki, którego istotą jest uchwycenie nastroju i ulotnego wrażenia danej chwili. Wywodzi się z nurtu malarskiego powstałego we Francji w drugiej połowie XIX wieku. Terminem tym określa się również niektóre nurty w muzyce, literaturze, filmie i fotografii. Podczas gdy wielu naturalistów, takich jak Heinrich Hart, odrzucało muzykę jako środek wyrazu „aktywizmu dążącego do prawdy”, impresjoniści często znajdowali przyjemność w „bezcelowym snuciu marzeń” przy subtelnie zróżnicowanych, barwnych akordach.\n\n[GetPlayer.GetCustom('artists_center_of_arts_impressionism_active_custom_loc')]\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_POWERFUL_LANDOWNERS_TRIGGER_TT: "#default_text [GetPlayer.GetAdjective] grupa [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName] ma status [concept_powerful].#!"
 MR_NOT_POWERFUL_INTELLIGENTSIA_TRIGGER_TT: "#default_text [GetPlayer.GetAdjective] grupa [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] nie ma statusu [concept_powerful].#!"
 MR_HAPPY_INTELLIGENTSIA_TRIGGER_TT: "#default_text [GetPlayer.GetAdjective] grupa [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] ma [concept_approval] na poziomie #V 5 lub wyższym#!.#!"
 MR_EXPRESSIONISM_BUTTON: "Ekspresjonizm"
 MR_EXPRESSIONISM_BUTTON_TT: "#T Wybierz Ekspresjonizm#!\n[concept_elgar_expressionism] to kierunek w sztuce, którego początki i prekursorzy sięgają schyłku XIX wieku. Podobnie jak impresjonizm, symbolizm i fowizm powstał w sprzeciwie wobec tendencji naturalistycznych. W ekspresjonizmie wyrażanie przeżyć przeważa nad estetyką, oddziaływaniem na odbiorcę i wiernym przedstawianiem rzeczywistości. Artysta pragnie przekazać widzowi własne doświadczenia. W odróżnieniu od impresjonizmu muzycznego, który oddaje wrażenia wywołane zewnętrznym wyglądem rzeczy, nurty ekspresjonistyczne wyrażają emocje ludzkiej duszy.\n\n[GetPlayer.GetCustom('artists_center_of_arts_expressionism_active_custom_loc')]\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_POWERFUL_INTELLIGENTSIA_OR_TRADE_UNIONS_TRIGGER_TT: "#default_text [GetPlayer.GetAdjective] grupa [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] lub [GetInterestGroupVariant('ig_trade_unions',GetPlayer).GetName] ma status [concept_powerful].#!"
 MR_NOT_POWERFUL_LANDOWNERS_TRIGGER_TT: "#default_text [GetPlayer.GetAdjective] grupa [GetInterestGroupVariant('ig_landowners',GetPlayer).GetName] nie ma statusu [concept_powerful].#!"
 MR_HAPPY_INTELLIGENTSIA_OR_TRADE_UNIONS_TRIGGER_TT: "#default_text [GetPlayer.GetAdjective] grupa [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] lub [GetInterestGroupVariant('ig_trade_unions',GetPlayer).GetName] ma [concept_approval] na poziomie #V 5 lub wyższym#!.#!"
 MR_ART_NOUVEAU_BUTTON: "Secesja"
 MR_ART_NOUVEAU_BUTTON_TT: "\#T Wybierz Secesję#!\n[concept_elgar_art_nouveau], znana we Włoszech również jako Stile liberty, to epoka w historii sztuki przypadająca na przełom XIX i XX wieku. Do nurtów zaliczanych do secesji należą styl reformistyczny (związany z ruchem reformatorskim), styl secesyjny (związany z Secesją Wiedeńską), Modernisme w Katalonii, Style Sapin w Szwajcarii oraz Tiffany Style w Stanach Zjednoczonych. Oprócz określenia Art nouveau, dominującego w języku francuskim, angielskim i włoskim, w języku angielskim używa się również terminu Modern Style, a we włoskim Stile Floreale. Pod względem chronologicznym secesja należy do epoki fin de siècle.\n\n[GetPlayer.GetCustom('artists_center_of_arts_art_nouveau_active_custom_loc')]\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_POWERFUL_INDUSTRIALISTS_TRIGGER_TT: "#default_text [GetPlayer.GetAdjective] grupa [GetInterestGroupVariant('ig_industrialists',GetPlayer).GetName] ma status [concept_powerful].#!"
