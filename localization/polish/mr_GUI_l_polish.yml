 MR_HOLD_SCHNEIDER_TROPHY_RACE_BUTTON_TT: "#T Zorganizuj Kolejny Wyścig o Puchar Schneidera#!\nJako zwycięzcy ostatniego wyścigu mamy zaszczyt zorganizować kolejną edycję w przyszłym roku. Jeśli wygramy trzy wyścigi z rzędu, legendarny Puchar Schneidera pozostanie u nas na zawsze.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
