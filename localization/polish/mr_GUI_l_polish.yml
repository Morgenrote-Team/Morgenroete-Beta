 MR_AERONAUTICAL_ENGINEER_GIANT_AIRPLANE_BUTTON_EVENT_TT: "Triggers the Event #V The Dream#!"
 MR_AIR_COMBAR_MISSION_BUTTON_TT: "#T Air Combat Mission#!\nSend your pilot to the front of the war.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
