 MR_STOP_ENGINEERING_PROJECT_BUTTON: "Zatrzymaj Projekt"
 MR_STOP_ENGINEERING_PROJECT_BUTTON_TT: "#T Przerwij Projekt Inżynieryjny#!\nPrzerwij bieżący projekt inżynieryjny. Utracisz dotychczasowy postęp prac.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_CIVIL_ENGINEER_RESEARCH_BUTTON: "Badania nad Inżynierią Budownictwa"
 MR_CIVIL_ENGINEER_INFRASTRUCTURE_BUTTON: "Projekt Infrastrukturalny"
 MR_CIVIL_ENGINEER_INFRASTRUCTURE_BUTTON_TT: "#T Projekt Infrastrukturalny#!\nTwój [concept_tesla_engineer] skupi się na rozbudowie infrastruktury w państwie [GetPlayer.GetName]. Dostępne są różne projekty zapewniające [Concept('concept_modifier','$concept_modifiers$')], które zwiększają [concept_infrastructure] w Twoich obszarach. Za każdym razem modyfikator otrzyma obszar z najmniejszą infrastrukturą. Projekt ten wiąże się z #n wydatkami#! dla Twojego państwa.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_CIVIL_ENGINEER_INFRASTRUCTURE_TRIGGER_TT: "#default_text Co najmniej jeden obszar w Twoim kraju nie ma jeszcze wszystkich [Concept('concept_modifier','$concept_modifiers$')] infrastruktury. Aby otrzymać modyfikator kolejowy, obszar musi mieć budynek typu [GetBuildingType('building_railway').GetName].#!"
 MR_CIVIL_ENGINEER_CONSTRUCTION_BUTTON: "Projekt Budowlany"
 MR_CIVIL_ENGINEER_CONSTRUCTION_BUTTON_TT: "#T Projekt Budowlany#!\nTwój [concept_tesla_engineer] skupi się na modernizacji budynku typu [GetBuildingType('building_construction_sector').GetName] w państwie [GetPlayer.GetName].\n\nZ czasem budynek otrzyma trzy modyfikatory: $gaudi_new_construction_methods_modifier_with_tooltip$, $gaudi_faster_construction_methods_modifier_with_tooltip$ i $gaudi_efficient_construction_methods_modifier_with_tooltip$.\n\nProjekt ten wiąże się z #n wydatkami#! dla Twojego państwa.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_CIVIL_ENGINEER_CONSTRUCTION_TRIGGER_TT: "#default_text Co najmniej jeden budynek typu [GetBuildingType('building_construction_sector').GetName] na poziomie 1 lub wyższym nie ma jeszcze wszystkich trzech [Concept('concept_modifier','$concept_modifiers$')].#!"
 MR_MECHANICAL_ENGINEER_RESEARCH_BUTTON: "Badania nad Mechaniką"
 MR_MECHANICAL_ENGINEER_LOCOMOTIVES_BUTTON: "Nowe Lokomotywy"
 MR_MECHANICAL_ENGINEER_LOCOMOTIVES_BUTTON_TT: "#T Opracuj Nowe Lokomotywy#!\nTwój [concept_tesla_engineer] skupi się na projektowaniu nowych lokomotyw, które zapewnią premię Twoim budynkom typu [GetBuildingType('building_railway').GetName]. Projekt ten wiąże się z #n wydatkami#! dla Twojego państwa.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_MECHANICAL_ENGINEER_LOCOMOTIVES_TRIGGER_TT: "#default_text Co najmniej jeden budynek typu [GetBuildingType('building_railway').GetName] na poziomie 1 lub wyższym nie ma jeszcze wszystkich pięciu [Concept('concept_modifier','$concept_modifiers$')] lokomotyw.#!"
 MR_MECHANICAL_ENGINEER_INDUSTRIES_BUTTON: "Modernizacja Przemysłu"
 MR_MECHANICAL_ENGINEER_INDUSTRIES_BUTTON_TT: "#T Modernizacja Przemysłu#!\nTwój [concept_tesla_engineer] skupi się na modernizacji metod produkcji w wybranym budynku. Zapewni mu to niewielkie premie do [concept_throughput], [concept_good_production] i [concept_input_mult]. Projekt ten wiąże się z #n wydatkami#! dla Twojego państwa.\n\nModyfikatory, które otrzyma budynek:\n$gaudi_building_throughput_add_modifier_with_tooltip$\n$gaudi_building_production_mult_modifier_with_tooltip$\n$gaudi_building_goods_input_mult_modifier_with_tooltip$\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_MECHANICAL_ENGINEER_INDUSTRIES_TRIGGER_TT: "#default_text Co najmniej jeden budynek przemysłowy na poziomie 1 lub wyższym nie ma jeszcze wszystkich trzech [Concept('concept_modifier','$concept_modifiers$')].#!"
 MR_MILITARY_ENGINEER_RESEARCH_BUTTON: "Badania Wojskowe"
 MR_MILITARY_ENGINEER_NAVAL_RESEARCH_BUTTON: "Badania Morskie"
 MR_MILITARY_ENGINEER_ADVANCED_WEAPONS_BUTTON: "Zaawansowane Karabiny"
 MR_MILITARY_ENGINEER_ADVANCED_WEAPONS_BUTTON_TT: "#T Opracuj Zaawansowane Karabiny#!\nTwój [concept_tesla_engineer] skupi się na opracowaniu zaawansowanych karabinów. Pozwoli to wykorzystać nową [concept_mobilization_option] lub podnieść jej poziom. Projekt ten wiąże się z #n wydatkami#! dla Twojego państwa.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_MILITARY_ENGINEER_ADVANCED_TANKS_BUTTON: "Zaawansowane Czołgi"
 MR_MILITARY_ENGINEER_ADVANCED_TANKS_BUTTON_TT: "#T Opracuj Zaawansowane Czołgi#!\nTwój [concept_tesla_engineer] skupi się na opracowaniu zaawansowanych czołgów. Pozwoli to wykorzystać nową [concept_mobilization_option] lub podnieść jej poziom. Projekt ten wiąże się z #n wydatkami#! dla Twojego państwa.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_MILITARY_ENGINEER_ADVANCED_DEFENCE_BUTTON: "Zaawansowane Umocnienia Polowe"
 MR_MILITARY_ENGINEER_ADVANCED_DEFENCE_BUTTON_TT: "#T Opracuj Zaawansowane Umocnienia Polowe#!\nTwój [concept_tesla_engineer] skupi się na opracowaniu zaawansowanych technik budowy umocnień polowych. Pozwoli to wykorzystać nową [concept_mobilization_option] lub podnieść jej poziom. Projekt ten wiąże się z #n wydatkami#! dla Twojego państwa.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ELECTRICAL_ENGINEER_RESEARCH_BUTTON: "Badania nad Elektrotechniką"
 MR_ELECTRICAL_ENGINEER_MAGNETIC_RESEARCH_STATION_BUTTON: "Dołącz do Towarzystwa Geomagnetycznego"
 MR_ELECTRICAL_ENGINEER_MAGNETIC_RESEARCH_STATION_BUTTON_TT: "#T Dołącz do Towarzystwa Geomagnetycznego#!\nPrzystąpienie do Towarzystwa Magnetycznego w Getyndze jest warunkiem rozpoczęcia badań nad magnetyzmem ziemskim i założenia Obserwatorium Geomagnetycznego.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ELECTRICAL_ENGINEER_TELEGRAPH_BUTTON: "Sieć Telegraficzna"
 MR_ELECTRICAL_ENGINEER_TELEGRAPH_BUTTON_TT: "#T Utwórz Sieć Telegraficzną#!\nTelegrafia rewolucjonizuje łączność w kraju, usprawniając usługi i infrastrukturę w regionach objętych siecią telegraficzną. Im większy kraj, tym trudniej połączyć go siecią przewodów. Słupy telegraficzne można stawiać tylko w obszarze sąsiadującym z takim, w którym już się znajdują. Do układania kabli podmorskich umożliwiających łączność z terytoriami zamorskimi potrzebne są zarówno telegraf elektryczny, jak i elektromagnetyzm.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ELECTRICAL_ENGINEER_TELEGRAPH_RAILWAY_CAPITAL_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma w stolicy budynek typu [GetBuildingType('building_railway').GetName].#!"
 MR_ELECTRICAL_ENGINEER_TELEGRAPH_RAILWAY_65_PERCENT_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma budynek typu [GetBuildingType('building_railway').GetName] w #p 65%#! wszystkich obszarów.#!"
 MR_ELECTRICAL_ENGINEER_RADIO_BUTTON: "Sieć Radiowa"
 MR_ELECTRICAL_ENGINEER_RADIO_BUTTON_TT: "#T Zbuduj Sieć Stacji Radiowych#!\nKoniec z uciążliwą plątaniną kabli! Dzięki wynalezieniu technologii radiowej wiadomości można teraz przesyłać za pomocą anten. Pozwala to nie tylko wymieniać informacje, lecz także nadawać audycje radiowe. Najpierw trzeba jednak stworzyć ogólnokrajową sieć stacji radiowych.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ELECTRICAL_ENGINEER_MAGNETIC_RESSOURCE_1_BUTTON: "Szukaj Złoża Żelaza"
 MR_ELECTRICAL_ENGINEER_MAGNETIC_RESSOURCE_1_BUTTON_TT: "#T Szukaj Złoża Żelaza#!\nGeofizyka i geomagnetyzm mają wiele praktycznych zastosowań. Szczególne korzyści z wykrywania potencjalnych złóż odnosi górnictwo. Wielkie przedsiębiorstwa wykorzystują wiedzę geofizyczną do poszukiwania nieznanych dotąd złóż żelaza, ołowiu i ropy naftowej. Dzięki odpowiednim technologiom i mapom ziemskiego pola magnetycznego z łatwością powinniśmy móc wykorzystać obecną wiedzę teoretyczną w praktyce.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ELECTRICAL_ENGINEER_OBSERVATORY_WITH_MAGNETIC_OBSERVATORY_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma budynek typu [GetBuildingType('building_verrier_observatory').GetName] z #V Obserwatorium Geomagnetyczne#! jako [concept_production_method].#!"
 MR_ELECTRICAL_ENGINEER_MAGNETIC_RESSOURCE_2_BUTTON: "Szukaj Złoża Ołowiu"
 MR_ELECTRICAL_ENGINEER_MAGNETIC_RESSOURCE_2_BUTTON_TT: "#T Szukaj Złoża Ołowiu#!\nGeofizyka i geomagnetyzm mają wiele praktycznych zastosowań. Szczególne korzyści z wykrywania potencjalnych złóż odnosi górnictwo. Wielkie przedsiębiorstwa wykorzystują wiedzę geofizyczną do poszukiwania nieznanych dotąd złóż żelaza, ołowiu i ropy naftowej. Dzięki odpowiednim technologiom i mapom ziemskiego pola magnetycznego z łatwością powinniśmy móc wykorzystać obecną wiedzę teoretyczną w praktyce.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ELECTRICAL_ENGINEER_MAGNETIC_RESSOURCE_3_BUTTON: "Szukaj Złoża Ropy Naftowej"
 MR_ELECTRICAL_ENGINEER_MAGNETIC_RESSOURCE_3_BUTTON_TT: "#T Szukaj Złoża Ropy Naftowej#!\nGeofizyka i geomagnetyzm mają wiele praktycznych zastosowań. Szczególne korzyści z wykrywania potencjalnych złóż odnosi górnictwo. Wielkie przedsiębiorstwa wykorzystują wiedzę geofizyczną do poszukiwania nieznanych dotąd złóż żelaza, ołowiu i ropy naftowej. Dzięki odpowiednim technologiom i mapom ziemskiego pola magnetycznego z łatwością powinniśmy móc wykorzystać obecną wiedzę teoretyczną w praktyce.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_AERONAUTICAL_ENGINEER_RESEARCH_BUTTON: "Badania nad Aeronautyką"
 MR_AERONAUTICAL_ENGINEER_AIRPORT_BUTTON: "Modernizacja Lotnisk"
 MR_AERONAUTICAL_ENGINEER_AIRPORT_BUTTON_TT: "#T Modernizacja Lotnisk#!\nTwój [concept_tesla_engineer] skupi się na modernizacji Twoich budynków typu [GetBuildingType('building_airport').GetName]. Lotniska otrzymają modyfikatory zwiększające [concept_throughput] i [concept_good_production] oraz zmniejszające [concept_input_mult]. Projekt ten wiąże się z #n wydatkami#! dla Twojego państwa.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_AERONAUTICAL_ENGINEER_AIRPORT_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma budynek typu [GetBuildingType('building_airport').GetName] na poziomie 1 lub wyższym, który nie ma jeszcze wszystkich trzech [Concept('concept_modifier','$concept_modifiers$')].#!"
 MR_AERONAUTICAL_ENGINEER_ADVANCED_AIRCRAFTS_BUTTON: "Samoloty Wojskowe"
 MR_AERONAUTICAL_ENGINEER_ADVANCED_AIRCRAFTS_BUTTON_TT: "#T Opracuj Zaawansowane Samoloty Wojskowe#!\nTwój [concept_tesla_engineer] skupi się na opracowaniu zaawansowanych samolotów wojskowych. Pozwoli to wykorzystać nową [concept_mobilization_option] lub podnieść jej poziom. Projekt ten wiąże się z #n wydatkami#! dla Twojego państwa.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_SCHNEIDER_TROPHY_INFORMATION: "#T Puchar Schneidera#!\nZwycięstwa: @curtiss_schneider_point! [GetPlayer.MakeScope.Var('curtiss_schneider_trophy_victories_var').GetValue|V0][GetPlayer.GetCustom('GUI_curtiss_last_trophy_winner_for_gui_type')]\n\n[GetPlayer.GetCustom('curtiss_schneider_trophy_current_rank_1_global_type')][GetPlayer.GetCustom('curtiss_schneider_trophy_current_rank_2_global_type')][GetPlayer.GetCustom('curtiss_schneider_trophy_current_rank_3_global_type')][GetPlayer.GetCustom('curtiss_schneider_trophy_current_rank_4_global_type')][GetPlayer.GetCustom('curtiss_schneider_trophy_current_rank_5_global_type')][GetPlayer.GetCustom('curtiss_schneider_trophy_current_rank_6_global_type')][GetPlayer.GetCustom('curtiss_schneider_trophy_current_rank_7_global_type')][GetPlayer.GetCustom('curtiss_schneider_trophy_current_rank_8_global_type')]"
