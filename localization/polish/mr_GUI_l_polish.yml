 MR_FOUND_ASYLUM_BUTTON: "Załóż szpital psychiatryczny"
 MR_FOUND_ASYLUM_BUTTON_TT: "#T Założono szpital psychiatryczny#!\nOddzielenie więźniów w zakładach karnych od osób z zaburzeniami psychicznymi w osobnej placówce było pierwszym krokiem w kierunku nowoczesnej psychiatrii. Wyspecjalizowany szpital psychiatryczny pomoże zapewnić lepsze warunki osobom potrzebującym pomocy.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
