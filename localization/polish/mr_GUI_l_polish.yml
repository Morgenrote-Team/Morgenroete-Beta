 MR_MILITARY_ENGINEER_RESEARCH_BUTTON_TT: "#T Badania nad inżynierią wojskową#!\nPozwól swojemu [concept_tesla_engineer] skupić się na opracowywaniu nowych innowacji wojskowych. Spowoduje to dodatkowe #n wydatki#! dla twojego kraju, ale będzie regularnie zapewniać premie do badań naukowych.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_MILITARY_ENGINEER_NAVAL_RESEARCH_BUTTON_TT: "#T Badania nad inżynierią morską#!\nPozwól swojemu [concept_tesla_engineer] skupić się na opracowywaniu nowych innowacji w dziedzinie techniki morskiej. Spowoduje to dodatkowe #n wydatki#! dla twojego kraju, ale będzie regularnie zapewniać premie do badań naukowych.\nTechnologia zapewniająca kolejne wzmocnienie: [GetPlayer.MakeScope.GetCountry.GetCustom('tesla_military_engineering_next_technology_type')]\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ELECTRICAL_ENGINEER_RESEARCH_BUTTON_TT: "#T Badania nad elektrotechniką#!\nPozwól swojemu [concept_tesla_engineer] skupić się na opracowywaniu nowych zastosowań elektryczności. Spowoduje to dodatkowe #n wydatki#! dla twojego kraju, ale będzie regularnie zapewniać premie do badań naukowych.\nTechnologia zapewniająca kolejne wzmocnienie: [GetPlayer.MakeScope.GetCountry.GetCustom('tesla_electrical_engineering_next_technology_type')]\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_AERONAUTICAL_ENGINEER_RESEARCH_BUTTON_TT: "#T Badania nad inżynierią lotniczą#!\nPozwól swojemu [concept_tesla_engineer] skupić się na badaniu technologii związanych z inżynierią lotniczą. Projekt ten spowoduje dodatkowe #n wydatki#! dla twojego kraju, ale będzie regularnie zapewniać premie do badań naukowych.\nTechnologia zapewniająca kolejne wzmocnienie: [GetPlayer.MakeScope.GetCountry.GetCustom('tesla_aeronautical_engineering_next_technology_type')]\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIAN_MEDICAL_RESEARCH_BUTTON_TT: "#T Badania Medyczne#!\nTen projekt jest aktywny, gdy [concept_panum_physician] nie jest zajęty innym projektem.\n\nProwadząc badania medyczne, [concept_panum_physician] może nie tylko zapewniać krajowi premie technologiczne, ale także badać powszechne choroby i opracowywać metody ich leczenia.\nTechnologia zapewniająca kolejne wzmocnienie: [GetPlayer.MakeScope.GetCountry.GetCustom('panum_medical_research_next_technology_type')]\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
