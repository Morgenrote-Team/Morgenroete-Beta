 MR_TOTAL_MASTERWORKS_COUNTRY_TT: "#T Arcydzieła [GetPlayer.GetAdjectiveNoFormatting]:#!\n@klimt_masterwork_classicism! [GetPlayer.MakeScope.Var('klimt_classic_masterwork_var').GetValue] Klasycyzm\n@klimt_masterwork_romanticism! [GetPlayer.MakeScope.Var('klimt_romantic_masterwork_var').GetValue] Romantyzm\n@klimt_masterwork_realism! [GetPlayer.MakeScope.Var('klimt_realistic_masterwork_var').GetValue] Realizm\n@klimt_masterwork_impressionism! [GetPlayer.MakeScope.Var('klimt_impressionistic_masterwork_var').GetValue] Impresjonizm\n@klimt_masterwork_expressionism! [GetPlayer.MakeScope.Var('klimt_expressionistic_masterwork_var').GetValue] Ekspresjonizm\n@klimt_masterwork_art_nouveau! [GetPlayer.MakeScope.Var('klimt_art_nouveau_masterwork_var').GetValue] Secesja"
 MR_VISIT_GALLERY_BUTTON: "Odwiedź Galerię"
 MR_VISIT_GALLERY_BUTTON_TT: "#T Odwiedź Galerię#!\nW galerii można sprawdzić łączną wartość naszej tradycji malarskiej oraz należących do niej dzieł sztuki.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_VISIT_GALLERY_BUTTON_TRIGGER_TT: "#default_text Obecnie #V nie odwiedzasz#! galerii.#!"
 MR_PAINTER_TRIP_BUTTON: "Podróż Edukacyjna"
 MR_PAINTER_TRIP_BUTTON_TT: "#T Podróż Edukacyjna#!\nPodczas [concept_klimt_painter_trip] artysta może poznać nieznany mu wcześniej styl artystyczny, zwiększając tym samym roczny przyrost [concept_klimt_painting_tradition]. Podczas pobytu w zagranicznym [concept_artists_center_of_arts] może również zdobyć inne pozytywne i negatywne cechy.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ACQUIRE_MASTERWORK_BUTTON: "Pozyskaj arcydzieło"
 MR_ACQUIRE_MASTERWORK_BUTTON_TT: "#T Pozyskaj arcydzieło#!\nMożemy zakupić za granicą arcydzieło reprezentujące styl artystyczny, którego dzieła jeszcze nie posiadamy. Warunkiem jest jednak, aby inne państwo posiadało co najmniej dwa arcydzieła w tym stylu. Ponadto potrzebujemy Galerii Narodowej, w której będziemy mogli wystawić obraz. Oprócz kosztów zakupu musimy również oddać część naszych obrazów w ramach wymiany, co kosztuje nas #R 100#! [concept_klimt_painting_tradition].\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_VERNISSAGE_BUTTON: "Wernisaż"
 MR_VERNISSAGE_BUTTON_TT: "#T Wernisaż#!\nPodczas wernisażu [concept_klimt_painter] może wystawić część swoich obrazów, zyskując w zamian reputację oraz [concept_klimt_painting_tradition]. Malarz może zorganizować wernisaż tylko raz w życiu.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_INDEPENDENT_PAINTER: "Niezależni Malarze"
 MR_INDEPENDENT_PAINTER_EXPERIENCE_TOOLTIP: "[Character.GetFullName] ma reputację na poziomie [FixedPointToFloat(Character.MakeScope.GetVariable('klimt_painter_experience').GetValue)|+0]"
 GUI_klimt_independent_painter_experience_text_progressing_loc: "[ROOT.GetVariable('klimt_painter_experience').GetValue|V0]#b  / 500#!"
 GUI_klimt_independent_painter_experience_text_500_loc: "#V 500#!#b  / 500#!"
 MR_INVITE_INDEPENDENT_PAINTER: "Zaproś Malarza"
 MR_INVITE_INDEPENDENT_PAINTER_TT: "#T Zaproś tego Malarza#!\nZaproszenie [concept_klimt_painter] to sposób na pozyskanie nowego malarza, jeśli w twoim kraju brakuje odpowiednio utalentowanego artysty lub obecny malarz nie spełnia twoich oczekiwań.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).AddScope('chosen_painter', Scope.GetCharacter.MakeScope ).End)]"
