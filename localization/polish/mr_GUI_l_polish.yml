 MR_CIVIL_ENGINEER_RESEARCH_BUTTON_TT: "#T Badania nad inżynierią lądową#!\nPozwól swojemu [concept_tesla_engineer] skupić się na badaniu technologii związanych z inżynierią lądową. Projekt ten spowoduje dodatkowe #n wydatki#! dla twojego kraju, ale będzie regularnie zapewniać premie do badań naukowych.\nTechnologia zapewniająca kolejne wzmocnienie: [GetPlayer.MakeScope.GetCountry.GetCustom('tesla_civil_engineering_next_technology_type')]\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
