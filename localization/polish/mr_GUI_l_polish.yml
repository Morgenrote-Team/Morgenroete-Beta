 MR_PROMOTE_ENGINEER_TT: "#T Promuj Inżyniera#!\n[Concept('concept_tesla_engineer','$concept_tesla_engineers$')] to wszechstronni specjaliści techniczni działający w wojsku i budownictwie. Przyspieszają również dwukrotnie budowę monumentów.\n\n#n Uwaga:#! Możesz mieć tylko jednego Inżyniera naraz.[GetPlayer.GetCustom('mr_promote_has_engineer_type')]\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PROMOTE_ASTRONOMER_TT: "#T Promuj Astronoma#!\n[Concept('concept_verrier_astronomer','$concept_verrier_astronomers$')] odnajdują nowe obiekty astronomiczne, odkrywają gwiazdy i planety oraz mogą uczestniczyć w kongresach astronomicznych.\n\n#n Uwaga:#! Możesz mieć tylko jednego Astronoma naraz.[GetPlayer.GetCustom('mr_promote_has_astronomer_type')]\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PROMOTE_CHEMIST_TT: "#T Promuj Chemika#!\n[Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists$')] to naukowcy zajmujący się odkrywaniem nowych pierwiastków oraz doskonaleniem Twojego przemysłu chemicznego.\n\n#n Uwaga:#! Możesz mieć tylko jednego Chemika naraz.[GetPlayer.GetCustom('mr_promote_has_chemist_type')]\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PROMOTE_GEOLOGIST_TT: "#T Promuj Geologa#!\n[Concept('concept_agassiz_geologist','$concept_agassiz_geologists$')] badają minerały, wulkany i inne formacje geologiczne.\n\n#n Uwaga:#! Możesz mieć tylko jednego Geologa naraz.[GetPlayer.GetCustom('mr_promote_has_geologist_type')]\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PROMOTE_NATURALIST_TT: "#T Promuj Przyrodnika#!\n[Concept('concept_dubois_naturalist','$concept_dubois_naturalists$')] mogą odławiać zwierzęta w kraju i za granicą, znajdować okazy lub prowadzić wyprawy botaniczne.\n\n#n Uwaga:#! Możesz mieć tylko jednego Przyrodnika naraz.[GetPlayer.GetCustom('mr_promote_has_naturalist_type')]\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PROMOTE_PALEONTOLOGIST_TT: "#T Promuj Paleontologa#!\n[Concept('concept_dubois_paleontologist','$concept_dubois_paleontologists$')] mogą badać formacje geologiczne w poszukiwaniu skamieniałości i kości dinozaurów lub odnajdywać je podczas wypraw.\n\n#n Uwaga:#! Możesz mieć tylko jednego Paleontologa naraz.[GetPlayer.GetCustom('mr_promote_has_paleontologist_type')]\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PROMOTE_ARCHAEOLOGIST_TT: "#T Promuj Archeologa#!\n[Concept('concept_lepsius_archaeologist','$concept_lepsius_archaeologists$')] mogą znajdować artefakty, dokonywać wielkich odkryć i uczestniczyć w konferencjach archeologicznych.\n\n#n Uwaga:#! Możesz mieć tylko jednego Archeologa naraz.[GetPlayer.GetCustom('mr_promote_has_archaeologist_type')]\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PROMOTE_ANTHROPOLOGIST_TT: "#T Promuj Antropologa#!\n[Concept('concept_andersson_anthropologist','$concept_andersson_anthropologists$')] badają pochodzenie człowieka, od początków ewolucji człowieka aż po epokę kamienia.\n\n#n Uwaga:#! Możesz mieć tylko jednego Antropologa naraz.[GetPlayer.GetCustom('mr_promote_has_anthropologist_type')]\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PROMOTE_COMPOSER_TT: "#T Promuj Kompozytora#!\n[Concept('concept_elgar_composer','$concept_elgar_composers$')] są niezbędni do rozwoju prężnie działającej Kultury Muzycznej. Pomogą krajowi rozwijać [concept_elgar_musical_tradition].\n\n#n Uwaga:#! Możesz mieć tylko jednego Kompozytora naraz.[GetPlayer.GetCustom('mr_promote_has_composer_type')]\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PROMOTE_WRITER_TT: "#T Promuj Pisarza#!\n[Concept('concept_manzoni_writer','$concept_manzoni_writers$')] są mistrzami opowiadania historii i tworzą książki oraz inne dzieła literackie. Swoją twórczością wzmacniają [concept_manzoni_literary_tradition] danego kraju.\n\n#n Uwaga:#! Możesz mieć jednego Pisarza Krajowego i 3 Pisarzy Lokalnych naraz.[GetPlayer.GetCustom('mr_promote_has_writers_type')]\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PROMOTE_PAINTER_TT: "#T Promuj Malarza#!\n[Concept('concept_klimt_painter','$concept_klimt_painters$')] uwieczniają na płótnie wrażenia, krajobrazy i cuda świata. Swoimi arcydziełami wzmacniają [concept_klimt_painting_tradition] danego kraju.\n\n#n Uwaga:#! Możesz mieć tylko jednego Malarza naraz.[GetPlayer.GetCustom('mr_promote_has_painter_type')]\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
