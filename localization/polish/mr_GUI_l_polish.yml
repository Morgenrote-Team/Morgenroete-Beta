 MR_NEWSPAPER_NOVEL_BUTTON: "Powieść w Odcinkach"
 MR_NEWSPAPER_NOVEL_BUTTON_TT: "#T Napisz powieść w Odcinkach#!\nW XIX wieku publikowanie powieści w odcinkach na łamach gazet zapewniało wielu autorom stały dochód i ogólnokrajową sławę. Wielu znanych pisarzy tamtej epoki, takich jak Tołstoj, Dostojewski, Flaubert czy Dumas, publikowało swoje powieści najpierw w odcinkach na łamach gazet, zanim ukazały się one w formie książkowej.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
