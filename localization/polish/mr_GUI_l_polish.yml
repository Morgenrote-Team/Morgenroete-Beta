 MR_CHEMIST_SYNTHETIC_OIL_BUTTON_TT: "#T Syntetyczna Ropa Naftowa#!\nWystępowanie ropy naftowej ogranicza się do regionów posiadających jej złoża. A co, gdybyśmy mogli sami ją wytwarzać? Nie musielibyśmy już podbijać obcych regionów wyłącznie dla ich ropy. Pozwól swojemu [concept_mendelejew_chemist] spróbować wytworzyć syntetyczną ropę naftową.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_CHEMIST_FERTILIZER_BUTTON: "#T Ulepsz Nawozy#!\nPozwól swojemu [concept_mendelejew_chemist] udoskonalić produkcję nawozów w [GetBuildingType('building_chemical_plant').GetName].\nZ czasem doda to do Twojego budynku trzy modyfikatory: $mendelejew_building_throughput_add_modifier_with_tooltip$, $mendelejew_building_production_mult_modifier_with_tooltip$ oraz $mendelejew_building_goods_input_mult_modifier_with_tooltip$.\n\nTen projekt spowoduje #n dodatkowe wydatki#! dla Twojego kraju.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_CHEMIST_FERTILIZER_ACTIVE_TT: "#T Ulepsz Nawozy#!\n#p Twój [concept_mendelejew_chemist] pracuje obecnie nad udoskonaleniem produkcji nawozów w [GetBuildingType('building_chemical_plant').GetName].#!"
 MR_CHEMIST_EXPLOSIVES_BUTTON: "#T Ulepsz Materiały Wybuchowe#!\nPozwól swojemu [concept_mendelejew_chemist] udoskonalić produkcję materiałów wybuchowych w [GetBuildingType('building_explosives_factory').GetName].\nZ czasem doda to do Twojego budynku trzy modyfikatory: $mendelejew_building_throughput_add_modifier_with_tooltip$, $mendelejew_building_production_mult_modifier_with_tooltip$ oraz $mendelejew_building_goods_input_mult_modifier_with_tooltip$.\n\nTen projekt spowoduje #n dodatkowe wydatki#! dla Twojego kraju.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_CHEMIST_EXPLOSIVES_ACTIVE_TT: "#T Ulepsz Materiały Wybuchowe#!\n#p Twój [concept_mendelejew_chemist] pracuje obecnie nad udoskonaleniem produkcji materiałów wybuchowych w [GetBuildingType('building_explosives_factory').GetName].#!"
 MR_CHEMIST_SYNTHETICS_BUTTON: "#T Ulepsz Produkcję Materiałów Syntetycznych#!\nPozwól swojemu [concept_mendelejew_chemist] udoskonalić produkcję materiałów syntetycznych w [GetBuildingType('building_synthetics_plant').GetName] lub [GetBuildingType('building_mendelejew_hydrogenation_plants').GetName].\nZ czasem doda to do Twojego budynku trzy modyfikatory: $mendelejew_building_throughput_add_modifier_with_tooltip$, $mendelejew_building_production_mult_modifier_with_tooltip$ oraz $mendelejew_building_goods_input_mult_modifier_with_tooltip$.\n\nTen projekt spowoduje #n dodatkowe wydatki#! dla Twojego kraju.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_CHEMIST_SYNTHETICS_ACTIVE_TT: "#T Ulepsz Produkcję Materiałów Syntetycznych#!\n#p Twój [concept_mendelejew_chemist] pracuje obecnie nad udoskonaleniem produkcji materiałów syntetycznych w [GetBuildingType('building_synthetics_plant').GetName] lub [GetBuildingType('building_mendelejew_hydrogenation_plants').GetName].#!"
 MR_CHEMIST_THEORY_BUTTON: "#V Przewidź Istnienie Pierwiastka#!\nTwój [concept_mendelejew_chemist] może spróbować opracować teorię dotyczącą pierwiastka, którego istnienia jeszcze nie przewidziano. Gdy istnienie pierwiastka zostanie teoretycznie uzasadnione, chemik będzie mógł rozpocząć prace nad jego odkryciem.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_CHEMIST_THEORIZE_ACTIVE_TT: "#V Przewidź Istnienie Pierwiastka#!\n Twój [concept_mendelejew_chemist] próbuje obecnie opracować teorię dotyczącą pierwiastka, którego istnienia jeszcze nie przewidziano. Gdy istnienie pierwiastka zostanie teoretycznie uzasadnione, chemik będzie mógł rozpocząć prace nad jego odkryciem."
 MR_CHEMIST_DISCOVERY_BUTTON: "#V Odkryj Pierwiastek#!\nTwój [concept_mendelejew_chemist] może spróbować odkryć pierwiastek, którego istnienie zostało już teoretycznie przewidziane. Po odkryciu pierwiastka chemik będzie mógł rozpocząć prace nad jego wyizolowaniem.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_CHEMIST_DISCOVERY_ACTIVE_TT: "#V Odkryj Pierwiastek#!\nTwój [concept_mendelejew_chemist] próbuje obecnie odkryć pierwiastek, którego istnienie zostało już teoretycznie przewidziane. Po odkryciu pierwiastka chemik będzie mógł rozpocząć prace nad jego wyizolowaniem."
 MR_CHEMIST_ISOLATION_BUTTON: "#V Wyizoluj Pierwiastek#!\nTwój [concept_mendelejew_chemist] może spróbować wyizolować pierwiastek, którego dotąd nie wyizolowano. Wyizolowanie pierwiastka przynosi ogromny prestiż.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
