 MR_GERMAN_MUSIC_ASSOCIATION_BUTTON_TT: "#T Załóż Powszechne Niemieckie Towarzystwo Muzyczne#!\nAllgemeiner Deutscher Musikverein (ADMV, „Powszechne Niemieckie Towarzystwo Muzyczne”) było niemieckim stowarzyszeniem muzycznym założonym w 1861 roku przez Franza Liszta i Franza Brendela w celu propagowania ideałów muzycznych Nowej Szkoły Niemieckiej. ADMV zajmowało się zarówno organizowaniem występów muzycznych, jak i udzielaniem praktycznego wsparcia muzykom. W ramach działalności artystycznej stowarzyszenia planowano organizowanie corocznych zgromadzeń muzyków, zwanych Tonkünstler-Versammlungen, w różnych miejscowościach. Podczas tych spotkań miały być wykonywane ważne, rzadko prezentowane, a przede wszystkim nowe utwory muzyczne wszelkiego rodzaju. Zamierzano również wykonywać starsze dzieła, które rzadko lub wcale nie pojawiały się w repertuarze koncertowym, lecz zasługiwały na uwagę ze względu na swoje znaczenie.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_CIVIL_ENGINEER_RAILWAY_BUTTON_TT: "#T Projekt Kolejowy#!\nTwój [concept_tesla_engineer] skupi się na ulepszaniu budynków typu [GetBuildingType('building_railway').GetName] w państwie [GetPlayer.GetName]. Możesz wskazać obszary priorytetowe, a tamtejsze koleje otrzymają $tesla_modernized_railway_lines_building_modifier_with_tooltip$ jako [concept_modifier], zwiększający [concept_throughput] budynku.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_CIVIL_ENGINEER_RAILWAY_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma budynek typu [GetBuildingType('building_railway').GetName] bez $tesla_modernized_railway_lines_building_modifier_with_tooltip$ jako [concept_modifier].#!"
 MR_CIVIL_ENGINEER_IRRIGATION_BUTTON_TT: "#T Projekt Irygacyjny#!\nTwój [concept_tesla_engineer] skupi się na usprawnieniu nawadniania w państwie [GetPlayer.GetName]. Możesz wskazać obszary priorytetowe, które otrzymają cechę obszaru #V $tesla_state_trait_irrigation$#!, zwiększającą [concept_throughput] budynków rolniczych oraz odporność na różne [Concept('concept_harvest_condition', '$concept_harvest_conditions$')]\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_CIVIL_ENGINEER_IRRIGATION_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma [concept_state] bez cechy obszaru #V $tesla_state_trait_irrigation$#!.#!"
