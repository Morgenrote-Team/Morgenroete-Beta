 MR_SHOW_BALLOON_FLIGHT_EVENTS_BUTTON_TT: "Znów będziesz otrzymywać powiadomienia o wydarzeniach związanych z lotami balonowymi.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_NO_MORE_BALLOONIST_DEATH_EVENTS_BUTTON: "#n Ukryj#! Wydarzenia Śmierci Baloniarzy"
 MR_NO_MORE_BALLOONIST_DEATH_EVENTS_BUTTON_TT: "Nie będziesz już otrzymywać powiadomień o śmierci swojego [Concept('concept_santos_balloonist_role','$concept_santos_balloonist_role_only_balloonist$')]. Twój #b baloniarz#! nadal będzie jednak mógł umrzeć. Nowy #b baloniarz#! zostanie automatycznie objęty sponsoringiem. W każdej chwili możesz ponownie włączyć powiadomienia.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_SHOW_BALLOONIST_DEATH_EVENTS_BUTTON: "#p Pokaż#! Wydarzenia Śmierci Baloniarzy"
