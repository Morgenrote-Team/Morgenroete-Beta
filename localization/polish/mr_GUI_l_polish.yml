 MR_CURTISS_FOUND_PILOT_SCHOOL_BUTTON: "Załóż Szkołę Pilotów"
 MR_CURTISS_FOUND_PILOT_SCHOOL_BUTTON_TT: "#T Załóż Szkołę Pilotów#!\nSzkoła pilotów zwiększy szansę, że losowo pojawiające się postacie będą miały cechę pilota.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_CURTISS_FOUND_PILOT_SCHOOL_BUTTON_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma [concept_character] z #V cechą#! asa [concept_curtiss_pilot] #p LUB#! postać będącą weteranem Wyścigu o Puchar Schneidera oraz budynek typu [GetBuildingType('building_automotive_industry').GetName] na poziomie #V 3#! lub wyższym #p LUB#! postać z cechą pilota, budynek typu [GetBuildingType('building_automotive_industry').GetName] na poziomie #V 5#! lub wyższym oraz budynek typu [GetBuildingType('building_airport').GetName] na poziomie #V 2#! lub wyższym.#!"
 MR_CHANGE_TO_CIVIL_EGINEER_BUTTON_TT: "#T Zmień Specjalizację Swojego Inżyniera na [concept_tesla_civil_engineer]#!\nTwój [concept_tesla_engineer] skupi się na [Concept('concept_tesla_civil_engineer','$concept_tesla_civil_engineering$')]. Może to zmniejszyć jego wydajność. Ponowna zmiana specjalizacji będzie możliwa dopiero za #n 5 lat#!.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
