 MR_PANDEMIC_POLICY_BUTTON_TT: "#T Polityka pandemiczna#!\nWybuch pandemii może postawić rozwinięte państwa przed wyborem wprowadzenia środków ograniczających w nadziei na ratowanie życia ludzkiego. Sukces nie zawsze jest gwarantowany.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
