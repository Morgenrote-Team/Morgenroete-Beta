 MR_AERONAUTICAL_ENGINEER_GIANT_ZEPPELIN_BUTTON_TT: "#T Gigantyczny Zeppelin#!\nPodróże sterowcami osiągnęły szczyt swojego rozwoju. Nasz kraj uchodzi za kolebkę największych i budzących największą grozę sterowców na świecie. Nadszedł czas, aby zadziwić cały świat gigantycznym sterowcem i odbyć podróż dookoła globu.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
