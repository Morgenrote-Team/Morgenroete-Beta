 MR_LOCAL_WRITER_NAME: "#tooltip:[GetRawTextTooltipTag('manzoni_official_writer_rating_tt_loc')] [Character.GetCustom('manzoni_writer_rating_new_writer_icon_type')] #! [Character.GetLastName]"
 MR_AERONAUTICAL_ENGINEER_SPEED_AIRPLANE_BUTTON: "Samolot Dużej Prędkości"
 MR_AERONAUTICAL_ENGINEER_SPEED_AIRPLANE_BUTTON_TT: "#T Samolot Dużej Prędkości#!\nNasz inżynier lotniczy może zbudować szybki samolot, aby pobić dotychczasowy rekord prędkości. Do skonstruowania najszybszego samolotu na świecie potrzebny jest nie tylko inżynier, ale również pilot, który zasiądzie za jego sterami. Sukces zależy od doświadczenia inżyniera i pilota, a także od poziomu zaawansowania technologicznego.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
