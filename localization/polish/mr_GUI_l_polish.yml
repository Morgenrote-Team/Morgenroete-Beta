 MR_AERONAUTICAL_ENGINEER_GIANT_AIRPLANE_BUTTON: "Gigantyczny samolot"
 MR_AERONAUTICAL_ENGINEER_GIANT_AIRPLANE_BUTTON_TT: "#T Gigantyczny samolot#!\nNiebo jest ostatnią granicą. To, czym we wczesnej epoce nowożytnej był wiek wielkich odkryć geograficznych, dziś stało się podbojem przestworzy. Jednak w porównaniu z galeonami Hiszpanów dzisiejsze podniebne statki przypominają zaledwie łupiny orzecha. Po morzach pływają już prawdziwe olbrzymy, lecz na niebie jak dotąd dominują jedynie niewielkie maszyny. Marzenie o zbudowaniu gigantycznego samolotu, który mógłby przewozić nie dziesiątki, lecz setki ludzi, wydaje się utopią. Jednak prężnie rozwijający się przemysł lotniczy i potężne linie lotnicze kierowane przez odpowiedniego człowieka mogłyby wywrócić świat do góry nogami...\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_AERONAUTICAL_ENGINEER_PRIVATE_AIRLINE_TRIGGER_TT: "#default_text [GetPlayer.GetName] posiada [Concept('concept_curtiss_airline','$concept_curtiss_private_airline$')].#!"
 MR_AERONAUTICAL_ENGINEER_AIRLINE_LEVEL_6_TRIGGER_TT: "#default_text [GetPlayer.GetName] posiada [concept_curtiss_airline] na poziomie #V 6 lub wyższym#!.#!"
