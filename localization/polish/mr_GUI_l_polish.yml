 MR_SEND_CHARACTER_TO_ASYLUM_BUTTON: "Umieść kogoś w szpitalu psychiatrycznym"
 MR_SEND_CHARACTER_TO_ASYLUM_BUTTON_TT: "#T Umieść kogoś w szpitalu psychiatrycznym#!\nIstnieje wielu polityków, agitatorów, a nawet władców, którzy z powodu zaburzeń psychicznych, uzależnień lub demencji zasadniczo nie nadają się już do pełnienia swoich obowiązków. Psychiatra może uznać takie osoby za niepoczytalne – nawet jeśli w ogóle ich nie zbadał. Jednak polityczne nadużycie psychiatrii może zostać przejrzane przez ludność i opozycję oraz może mieć konsekwencje...\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
