 MR_RECRUIT_PHYSICIAN_BUTTON: "Zwerbuj lekarza"
 MR_RECRUIT_PHYSICIAN_BUTTON_TT: "#T Zrekrutuj lekarza#!\nPosiadanie dużego szpitala ogólnego daje wyjątkową możliwość natychmiastowego rekrutowania lekarzy spośród personelu medycznego. Ponadto można wybrać lekarza na podstawie jego specjalizacji. Pozwala to na prowadzenie znacznie bardziej ukierunkowanych badań medycznych.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
