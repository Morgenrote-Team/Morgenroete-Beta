 MR_GREAT_POWER_TRIGGER_TT: "#default_text [GetPlayer.GetName] jest [concept_great_power].#!"
 MR_BEETHOVEN_MONUMENT_BUTTON: "Zbuduj pomnik Beethovena"
 MR_BEETHOVEN_MONUMENT_BUTTON_TT: "#T Zbuduj pomnik Beethovena#!\nNie ulega wątpliwości, że Ludwig van Beethoven był największym kompozytorem wszech czasów, a cała muzyka romantyczna wywodzi się z jego twórczości. Każdy współczesny artysta powinien oddać mu hołd. Tym bardziej zdumiewające jest to, że wciąż nie cieszy się on należnym uznaniem. Jednak po apelu Roberta Schumanna liczne stowarzyszenia, miasta, książęta i rządy zebrały fundusze na wzniesienie pomnika w jego rodzinnym Bonn.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
