 MR_ARCHAEOLOGY_RANK_OR_AIRPORT_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma rangę #V mocarstwa regionalnego#! lub #V wielkiego mocarstwa#! albo ma budynek typu [GetBuildingType('building_airport').GetName].#!"
 MR_ARCHAEOLOGY_MODERN_ARCHAEOLOGY_EXPERIENCED_OR_FAMOUS_TRIGGER: "#default_text [GetPlayer.GetName] ma #V doświadczonego lub słynnego [concept_lepsius_archaeologist]#!.#!"
 MR_ARCHAEOLOGY_HAS_ARCHAEOLOGIST_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma [concept_lepsius_archaeologist].#!"
 MR_ARCHAEOLOGY_5_COUNTRIES_WITH_ARCHAEOLOGIST_TRIGGER_TT: "#default_text Co najmniej 5 państw ma [concept_lepsius_archaeologist].#!"
 MR_ARCHAEOLOGY_10_COUNTRIES_WITH_ARCHAEOLOGIST_TRIGGER_TT: "#default_text Co najmniej 10 państw ma [concept_lepsius_archaeologist].#!"
 MR_ARCHAEOLOGY_15_COUNTRIES_WITH_ARCHAEOLOGIST_TRIGGER_TT: "#default_text Co najmniej 15 państw ma [concept_lepsius_archaeologist].#!"
 MR_UPPER_EGYPT_EXPEDITION_TT: "#T Wyślij Wyprawę do Doliny Królów#!\nGórny Egipt, gdzie znajdują się dawna stolica Teby i Dolina Królów, uchodzi za mekkę egiptologii. Powinniśmy uzyskać zezwolenie na wykopaliska w tym rejonie i poszukać egipskich skarbów.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_EGYPT_EXPEDITION_POSSIBLE_TRIGGER_TT: "#default_text #V Lepsius napisał list do Roselliniego#!, co zapoczątkowało badania archeologiczne w Egipcie.#!"
 MR_UPPER_EGYPT_EXPEDITION_POSSIBLE_TRIGGER_TT: "#default_text [GetPlayer.GetName] #V nie finansuje obecnie#! [concept_lepsius_expedition] do Górnego Egiptu.#!"
 MR_UPPER_EGYPT_EXPEDITION_ACCESS_TRIGGER_TT: "#default_text [GetPlayer.GetName] #V posiada obszar Górnego Egiptu#! lub ma [concept_mr_research_charter] od jego właściciela.#!"
 MR_LOWER_EGYPT_EXPEDITION_TT: "#T Wyślij Wyprawę do Piramid#!\nOd zarania dziejów egipskie piramidy fascynują ludzkość. Podobno inne grobowce, świątynie, a nawet całe miasta, które zniknęły w piaskach Dolnego Egiptu, czekają na ponowne odkrycie.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_LOWER_EGYPT_EXPEDITION_POSSIBLE_TRIGGER_TT: "#default_text [GetPlayer.GetName] #V nie finansuje obecnie#! [concept_lepsius_expedition] do Dolnego Egiptu.#!"
 MR_LOWER_EGYPT_EXPEDITION_ACCESS_TRIGGER_TT: "#default_text [GetPlayer.GetName] #V posiada obszar Dolnego Egiptu#! lub ma [concept_mr_research_charter] od jego właściciela.#!"
 MR_BABYLONIA_EXPEDITION_TT: "#T Wyślij Wyprawę do Kolebki Cywilizacji#!\nBabilonia, południowa część Mezopotamii, zawdzięcza swoją nazwę niegdyś potężnemu miastu Babilon. Region ten uchodzi za „kolebkę cywilizacji”, w której raz po raz odkrywane są cenne artefakty archeologiczne. Ich miejsce jest bez wątpienia w muzeum.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_MESOPOTAMIA_EXPEDITION_POSSIBLE_TRIGGER_TT: "#default_text #V Odczytano język akadyjski#!, co umożliwia prowadzenie badań archeologicznych w Mezopotamii.#!"
 MR_BABYLONIA_EXPEDITION_POSSIBLE_TRIGGER_TT: "#default_text [GetPlayer.GetName] #V nie finansuje obecnie#! [concept_lepsius_expedition] do Babilonii.#!"
 MR_BABYLONIA_EXPEDITION_ACCESS_TRIGGER_TT: "#default_text [GetPlayer.GetName] #V posiada obszar Bagdadu#! lub ma [concept_mr_research_charter] od jego właściciela.#!"
 MR_ASSYRIA_EXPEDITION_TT: "#T Wyślij Wyprawę do Ogrodów Asyrii#!\nAsyria obejmuje północną część Mezopotamii z dwoma ważnymi miastami: Aszur i Niniwą. Skąpa wiedza o tej krainie nadal opiera się na Biblii — może jednak istnieją bardziej wiarygodne świadectwa historyczne?\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ASSYRIA_EXPEDITION_POSSIBLE_TRIGGER_TT: "#default_text [GetPlayer.GetName] #V nie finansuje obecnie#! [concept_lepsius_expedition] do Asyrii.#!"
 MR_ASSYRIA_EXPEDITION_ACCESS_TRIGGER_TT: "#default_text [GetPlayer.GetName] #V posiada obszar Mosulu#! lub ma [concept_mr_research_charter] od jego właściciela.#!"
 MR_ARGOLIS_EXPEDITION_TT: "#T Wyślij Wyprawę do Miasta Agamemnona#!\nPo odkryciu Troi nawet sceptyczni naukowcy zaczynają dostrzegać, że mity starożytnych Greków to coś więcej niż tylko bajki. Podobno w Argolidzie do dziś znajdują się pozostałości miast z epoki brązu, z których najbardziej znane są Mykeny. Powinniśmy przekonać się o tym na własne oczy.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_GREECE_EXPEDITION_POSSIBLE_TRIGGER_TT: "#default_text #V Schliemann odkrył Troję#!, co umożliwia prowadzenie badań archeologicznych w Grecji.#!"
 MR_ARGOLIS_EXPEDITION_POSSIBLE_TRIGGER_TT: "#default_text [GetPlayer.GetName] #V nie finansuje obecnie#! [concept_lepsius_expedition] do Argolidy.#!"
 MR_ARGOLIS_EXPEDITION_ACCESS_TRIGGER_TT: "#default_text [GetPlayer.GetName] #V posiada obszar Peloponezu#! lub ma [concept_mr_research_charter] od jego właściciela.#!"
 MR_CRETE_EXPEDITION_TT: "#T Wyślij Wyprawę do Pałaców Krety#!\nPodobno niegdyś Kretą władał legendarny król Minos. Podobnie jak w przypadku Troi i Myken, również w tej opowieści zdaje się tkwić ziarno prawdy: na wyspie coraz częściej znajdowane są artefakty legendarnej kultury minojskiej. Nasze państwo również powinno pozyskać kilka z nich.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_CRETE_EXPEDITION_POSSIBLE_TRIGGER_TT: "#default_text [GetPlayer.GetName] #V nie finansuje obecnie#! [concept_lepsius_expedition] na Kretę.#!"
 MR_CRETE_EXPEDITION_ACCESS_TRIGGER_TT: "#default_text [GetPlayer.GetName] #V posiada obszar Krety#! lub ma [concept_mr_research_charter] od jego właściciela.#!"
 MR_YUCATAN_EXPEDITION_TT: "#T Wyślij Wyprawę do Zaginionych Miast Majów#!\nMnożą się doniesienia o nieznanych, ogromnych miastach pośród dżungli. Powinniśmy zbadać tę sprawę i wysłać wyprawę archeologiczną na Jukatan.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_YUCATAN_EXPEDITION_DISCOVERED_TRIGGER_TT: "#default_text #V Stephens i Catherwood odbyli wyprawę#!, co umożliwia prowadzenie badań archeologicznych na Jukatanie.#!"
 MR_YUCATAN_EXPEDITION_POSSIBLE_TRIGGER_TT: "#default_text [GetPlayer.GetName] #V nie finansuje obecnie#! [concept_lepsius_expedition] na Jukatan.#!"
 MR_YUCATAN_EXPEDITION_ACCESS_TRIGGER_TT: "#default_text [GetPlayer.GetName] #V posiada obszar Jukatanu#! lub ma [concept_mr_research_charter] od jego właściciela.#!"
 MR_PERU_EXPEDITION_TT: "#T Wyślij Wyprawę na Poszukiwanie Ukrytego Dziedzictwa Inków#!\nPiloci donoszą o tajemniczych fortecach i otoczonych murami budowlach w Andach, które widzieli podczas lotów nad Peru. Może Hiszpanie nie zniszczyli całkowicie kultury Inków? Do dziś nie odnaleziono niektórych miast będących ośrodkami oporu rdzennej ludności.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PERU_EXPEDITION_DISCOVERED_TRIGGER_TT: "#default_text #V Bingham odkrył Machu Picchu#!, co umożliwia prowadzenie badań archeologicznych w Peru.#!"
 MR_PERU_EXPEDITION_POSSIBLE_TRIGGER_TT: "#default_text [GetPlayer.GetName] #V nie finansuje obecnie#! [concept_lepsius_expedition] do Peru.#!"
 MR_PERU_EXPEDITION_ACCESS_TRIGGER_TT: "#default_text [GetPlayer.GetName] #V posiada obszar $STATE_ICA$#! lub ma [concept_mr_research_charter] od jego właściciela.#!"
 MR_EXODUS_CONGRESS_BUTTON: "Kongres poświęcony Wyjściu z Egiptu"
 MR_EXODUS_CONGRESS_BUTTON_TT: "#T Kongres poświęcony Wyjściu z Egiptu#!\nWraz z rozwojem badań nad Egiptem i Lewantem powraca pytanie o historyczność wydarzeń biblijnych. Zwłaszcza brak wzmianek o wyjściu Hebrajczyków z Egiptu budzi wątpliwości, czy Pięcioksiąg Mojżesza nie jest jedynie wytworem wyobraźni. Radykalni naukowcy domagają się wręcz całkowitego pomijania opowieści biblijnych. Inna grupa przekonuje, że choć nie można ich traktować dosłownie, mają one wartość naukową.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_EXODUS_CONGRESS_EGYPTIAN_ARTIFACTS_TT: "#default_text [GetPlayer.GetName] potrzebuje co najmniej #V 25#! @lepsius_egypt_minor! egipskich [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')] (obecnie [GetPlayer.MakeScope.Var('lepsius_egyptian_artifact_minor').GetValue|0+]).#!"
 MR_EXODUS_CONGRESS_GLOBAL_ARTIFACTS_TT: "#default_text Co najmniej #V 150#! @lepsius_egypt_minor! [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')] znaleziono na całym świecie (obecnie znaleziono [GetGlobalVariable('lepsius_global_artifacts').GetValue|+0] @lepsius_egypt_minor!).#!"
 MR_CIVILIZATION_CONGRESS_BUTTON: "Kongres poświęcony Cywilizacji"
 MR_CIVILIZATION_CONGRESS_BUTTON_TT: "#T Kongres poświęcony Narodzinom Cywilizacji#!\nPrzez stulecia nie tylko w Europie, lecz także w innych krajach basenu Morza Śródziemnego i Bliskiego Wschodu uważano Egipt za najstarszą cywilizację. Jednak rosnąca z dnia na dzień liczba znalezisk z Asyrii i Babilonii wyraźnie zachwiała tą teorią. Okazuje się bowiem, że to najprawdopodobniej w Mezopotamii wynaleziono pismo, podobnie jak wiele innych zdobyczy towarzyszących narodzinom cywilizacji. Czyżby każda cywilizacja wywodziła się ostatecznie z Babilonu, a każda religia miała swoje korzenie w babilońskich mitach? Czy epos o Gilgameszu mógł być inspiracją dla wszelkiej literatury — od Biblii po eposy Homera?\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_CIVILIZATION_CONGRESS_MESOPOTAMIAN_ARTIFACTS_TT: "#default_text [GetPlayer.GetName] potrzebuje co najmniej #V 25#! @lepsius_mesopotamia_minor! mezopotamskich [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')] (obecnie [GetPlayer.MakeScope.Var('lepsius_mesopotamian_artifact_minor').GetValue|0+]).#!"
 MR_CIVILIZATION_CONGRESS_GLOBAL_ARTIFACTS_TT: "#default_text Co najmniej #V 300#! @lepsius_mesopotamia_minor! [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')] znaleziono na całym świecie (obecnie znaleziono [GetGlobalVariable('lepsius_global_artifacts').GetValue|+0] @lepsius_mesopotamia_minor!).#!"
 MR_TROY_CONGRESS_BUTTON: "Kongres Trojański"
 MR_TROY_CONGRESS_BUTTON_TT: "#T Kongres Trojański#!\nSchliemann odnalazł Troję. Przynajmniej tak twierdzi. Choć przycichły głosy krytyków uznających Troję za zwykły wymysł, wiele pytań pozostaje bez odpowiedzi. Czy Troja odnaleziona przez Schliemanna to Troja Homera? I czym właściwie była Troja? Wielu uczonych nadal zachowuje sceptycyzm. A nowe znaleziska z Anatolii mogą rzucić zupełnie nowe światło na te odkrycia.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_TROY_CONGRESS_AEGEAN_ARTIFACTS_TT: "#default_text [GetPlayer.GetName] potrzebuje co najmniej #V 25#! @lepsius_aegean_minor! egejskich [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')] (obecnie [GetPlayer.MakeScope.Var('lepsius_aegean_artifact_minor').GetValue|0+]).#!"
 MR_TROY_CONGRESS_GLOBAL_ARTIFACTS_TT: "#default_text Co najmniej #V 300#! @lepsius_aegean_minor! [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')] znaleziono na całym świecie (obecnie znaleziono [GetGlobalVariable('lepsius_global_artifacts').GetValue|+0] @lepsius_aegean_minor!).#!"
 MR_INSPECT_EXCAVATION_BUTTON: "Przeprowadź Inspekcję Wykopalisk"
 MR_INSPECT_EXCAVATION_BUTTON_TT: "#T Przeprowadź Inspekcję Wykopalisk#!\nMożemy wysłać doświadczonego archeologa do rejonu, w którym prowadzimy wykopaliska, aby zintensyfikować tam nasze prace. W ciągu około roku nasz archeolog otworzy nowe stanowisko wykopaliskowe i przeprowadzi intensywne badania, podczas których możemy znaleźć kolejne wskazówki prowadzące do nieznanych dotąd, ważnych odkryć archeologicznych. Powodzenie zależy w dużej mierze od doświadczenia naszego archeologa. Założenie Towarzystwa Archeologicznego również zwiększa nasze szanse.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_INSPECT_EXCAVATION_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma #V co najmniej jedno trwające [concept_lepsius_excavation]#! w rejonie, w którym nie dokonano jeszcze żadnego ważnego odkrycia archeologicznego.#!"
 MR_INSPECT_EXCAVATION_ARTIFACT_FOR_DISCOVERY_TRIGGER_TT: "#default_text [GetPlayer.GetName] musi mieć #V przebadanych co najmniej 30 [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')]#! z danego regionu, zanim rozpocznie tam poszukiwanie wskazówek.#!"
 MR_CANCEL_EXCAVATION_BUTTON: "Anuluj Wykopaliska"
 MR_CANCEL_EXCAVATION_BUTTON_TT: "#T Anuluj Wykopaliska#!\nW niektórych sytuacjach warto odwołać zespół wykopaliskowy. Zachowamy zdobyte artefakty i kolekcje, ale zakończymy stałe wykopaliska.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ARCHAEOLOGY_ON_ARCHAEOLOGICAL_EXCAVATION_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma co najmniej #V 1#! [Concept('concept_lepsius_archaeological_team','$concept_lepsius_excavation_team$')] prowadzący [concept_lepsius_excavation].#!"
 MR_LOCAL_EXCAVATION_BUTTON: "Miejscowe Wykopaliska"
 MR_LOCAL_EXCAVATION_BUTTON_TT: "#T Miejscowe Wykopaliska#!\nArcheologiczne skarby czekają na odkrycie nie tylko w odległych krainach. Choć miejscowe wykopaliska uchodzą za mniej prestiżowe niż poszukiwania słynnych artefaktów, pozwalają poznać przeszłość naszych rodzimych ziem, przede wszystkim z czasów prehistorycznych. W przeciwieństwie do wykopalisk prowadzonych po wyprawie, miejscowe wykopaliska można zakończyć dopiero po wyczerpaniu funduszy.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ARCHAEOLOGICAL_MUSEUM_BUILDING_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma budynek typu [GetBuildingType('building_lepsius_archaeological_museum').GetName].#!"
 MR_LITERACY_RATE_33_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma wskaźnik [concept_literacy] na #V poziomie 33%#! lub wyższym.#!"
 MR_LITERACY_RATE_66_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma wskaźnik [concept_literacy] na #V poziomie 66%#! lub wyższym.#!"
 MR_ARCHAEOLOGY_EXPERIENCED_ARCHAEOLOGIST_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma #V doświadczonego [concept_lepsius_archaeologist]#!.#!"
