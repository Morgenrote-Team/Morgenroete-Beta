 concept_tesla_engineering: "Inżynieria"
 concept_tesla_engineering_desc: "#b Inżynieria#! jest jedną z głównych funkcji moda [concept_morgenroete].\n\nAby uzyskać dostęp do #b Inżynierii#!, musisz posiadać [concept_tesla_engineer]. #b Inżynierowie#! mogą rozpoczynać #b Projekty Inżynieryjne#! w zależności od swojej specjalizacji. Istnieje pięć specjalizacji #b Inżynierów#!:\n- [concept_tesla_civil_engineer] koncentruje się na rozwoju infrastruktury kraju.\n- [concept_tesla_mechanical_engineer] koncentruje się na wynalazkach mechanicznych, które przynoszą korzyści między innymi przemysłowi.\n- [concept_tesla_military_engineer] koncentruje się na ulepszaniu armii i floty kraju.\n- [concept_tesla_electrical_engineer] koncentruje się na rozwoju infrastruktury elektrycznej kraju.\n- [concept_tesla_aeronautical_engineer] koncentruje się na umożliwieniu ludziom latania oraz ulepszaniu samolotów i innych statków powietrznych."
 concept_tesla_engineer_desc: "#b #ORANGE Inżynierowie#!#! to Uczeni, którzy dzięki swojej wiedzy specjalistycznej wspomagają budowę specjalnych budynków.\nPonadto #b #ORANGE Inżynierowie#!#! zapewniają premię do [concept_technology_spread] Twojego kraju. Wysokość tej premii zależy od liczby krajów, które mają zbadanych więcej technologii niż Twój kraj."
 concept_tesla_civil_engineer_desc: "#b Inżynierowie Budownictwa#! koncentrują się na rozwoju infrastruktury kraju.\nMogą rozpoczynać #b Projekty Inżynieryjne#!, aby dodawać do stanów [Concept('concept_modifier','$concept_modifiers$')] zwiększające [concept_infrastructure], ulepszać Twoje #b Sektory Budowlane#! lub badać [Concept('concept_technology', '$concept_technologies$')]."
 concept_tesla_mechanical_engineer_desc: "#b Inżynierowie Mechanicy#! koncentrują się na innowacjach mechanicznych, które usprawniają przemysł, maszyny lub życie ludności.\nMogą rozpoczynać #b Projekty Inżynieryjne#!, aby dodawać do budynków przemysłowych [Concept('concept_modifier','$concept_modifiers$')] zwiększające [concept_throughput], [concept_good_production] i [concept_input_mult], ulepszać Twoje #b Koleje#! poprzez wprowadzanie nowych lokomotyw lub badać przemysłowe [Concept('concept_technology', '$concept_technologies$')]."
 concept_tesla_military_engineer_desc: "#b Inżynierowie Wojskowi#! koncentrują się na ulepszaniu naszej armii i floty poprzez wprowadzanie nowych innowacji.\nMogą rozpoczynać #b Projekty Inżynieryjne#!, aby zdobywać nowe [Concept('concept_mobilization_option','$concept_mobilization_options$')] poprzez wynajdywanie broni, nowych umocnień polowych i lepszych czołgów, a także badać wojskowe lub morskie [Concept('concept_technology', '$concept_technologies$')]."
 concept_tesla_electrical_engineer_desc: "#b Inżynierowie Elektrycy#! koncentrują się na rozwoju kraju poprzez innowacje w dziedzinie elektryczności.\nMogą rozpoczynać #b Projekty Inżynieryjne#!, aby badać pole geomagnetyczne Ziemi, budować sieci telegraficzne lub radiowe albo badać [Concept('concept_technology', '$concept_technologies$')] z dziedziny elektrotechniki."
 concept_tesla_aeronautical_engineer_desc: "#b Inżynierowie Lotniczy#! koncentrują się na rozwijaniu sposobów latania oraz udoskonalaniu samolotów i sterowców.\nMogą rozpoczynać #b Projekty Inżynieryjne#!, aby dodawać do Twoich #V Lotnisk#! [Concept('concept_modifier','$concept_modifiers$')] zwiększające [concept_throughput], [concept_good_production] i [concept_input_mult], odblokowywać #V Zaawansowane Statki Powietrzne#! jako [Concept('concept_mobilization_option','$concept_mobilization_options$')] lub badać [Concept('concept_technology', '$concept_technologies$')] związane z lotnictwem."
 concept_vikelas_national_sport: "Sport narodowy"
 concept_vikelas_national_sport_desc: "Każdy kraj może ogłosić jedną z następujących dyscyplin sportowych swoim sportem narodowym: krykiet, baseball, piłkę nożną lub koszykówkę. Trzy z tych czterech dyscyplin (z wyjątkiem krykieta) zostały wynalezione dopiero w XIX wieku. Kraj, który jako pierwszy wynajdzie daną dyscyplinę sportową, jest uznawany za jej „ojczyznę”. Od tego momentu sport rozprzestrzenia się na całym świecie, ale nie wszędzie na tych samych zasadach: rozprzestrzenianie się krykieta i baseballu jest bardziej ograniczone, podczas gdy w przypadku piłki nożnej i koszykówki obowiązują mniej rygorystyczne warunki. Suweren może rozpowszechniać dyscyplinę sportową wśród swoich poddanych, aby poprawić wzajemne relacje. W jednym kraju może współistnieć kilka dyscyplin sportowych, ale aby dana dyscyplina była uprawiana w każdym obiekcie sportowym w całym kraju, musi zostać uznana za sport narodowy."
 concept_theiler_microorganism: "Mikroorganizm"
 concept_theiler_microorganisms: "Mikroorganizmy"
 concept_theiler_microorganism_desc: "Mikroorganizmy to maleńkie organizmy, takie jak bakterie, wirusy i organizmy jednokomórkowe.\nMoże je odkrywać [concept_theiler_biologist] w ramach $je_theiler_microorganism_research$ — [concept_journal_entry], którym biolodzy zajmują się, gdy nie są zajęci innymi zadaniami.\nMikroorganizmy służą przede wszystkim do odkrywania [Concept('concept_theiler_pathogen','$concept_theiler_pathogens$')] i [Concept('concept_theiler_vaccine','$concept_theiler_vaccines$')], które pomagają państwu chronić ludność przed [Concept('concept_panum_disease','$concept_panum_diseases$')]."
 concept_theiler_biology: "Biologia"
 concept_theiler_biology_desc: "W [concept_morgenroete] #b biologia#! odgrywa kluczową rolę we wspieraniu medycyny i rolnictwa. Szczególnie ważne są badania mikrobiologiczne: [concept_theiler_biologist] może identyfikować [Concept('concept_theiler_microorganism','$concept_theiler_microorganisms$')], zwłaszcza [Concept('concept_theiler_pathogen','$concept_theiler_pathogens$')]. Te ostatnie są przydatne przy opracowywaniu [Concept('concept_theiler_vaccine','$concept_theiler_vaccines$')]. Przy dobrze rozwiniętym systemie opieki zdrowotnej szczepionki mogą całkowicie zapobiec wystąpieniu [Concept('concept_panum_disease','$concept_panum_diseases$')]. Ponadto biolodzy pomagają w zwalczaniu [concept_theiler_pest], takich jak owocówka jabłkóweczka, oraz zwiększają wydajność gospodarstw rolnych."
 concept_ito_medicinal_plants: "Rośliny Lecznicze"
 concept_ito_medicinal_plants_desc: "Rośliny Lecznicze to rośliny o właściwościach leczniczych, które można wykorzystać do tworzenia leków i innych przydatnych substancji chemicznych.\nRośliny Lecznicze można zbierać, wysyłając [concept_dubois_naturalist] na [concept_dubois_botanical_expedition]. Po zgromadzeniu wystarczającej ilości Roślin Leczniczych [concept_mendelejew_chemist] może rozpocząć izolowanie substancji chemicznej. Gdy ten etap zostanie zakończony, [concept_theiler_biologist] będzie mógł rozpocząć produkcję leku."
 concept_academics_academic_confusion: "Zamęt Akademicki"
 concept_academics_academic_confusion_desc: "Zmiana [concept_academics_university_specialization] Uniwersytetu doprowadzi do dezorientacji wielu uczonych. W rezultacie na krótki czas zmniejszy się dorobek naukowy."
