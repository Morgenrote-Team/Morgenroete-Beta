 concept_andersson_palaeanthropus_fossil: "Skamieniałość Paleoantropa"
 concept_andersson_pithecanthropus_fossil: "Skamieniałość Pitekantropa"
 concept_andersson_australopithecus_fossil: "Skamieniałość Australopiteka"
 concept_andersson_anthropological_prestige: "Prestiż Antropologiczny"
 concept_andersson_anthropological_prestige_desc: "#b Prestiż Antropologiczny#! oznacza łączny prestiż zgromadzony dzięki osiągnięciom antropologicznym. Osiągnięcia te przedstawiają się następująco:\n\n#b Prehistoryczny Artefakt#!: 1 punkt Prestiżu\n#b Skamieniałość Neoantropa, Paleoantropa, Pitekantropa lub Australopiteka#!: 1 punkt Prestiżu\n#b Figurka Wenus#!: 5 punktów Prestiżu\n#b Malowidła Jaskiniowe#!: 10 punktów Prestiżu\n#b Odkrywca Antropologii#!: 15 punktów Prestiżu\n#b Nowy Typ Neoantropa#!: 20 punktów Prestiżu\nn#b Nowy Typ Paleoantropa#!: 40 punktów Prestiżun\n#b Nowy Typ Pitekantropa#!: 60 punktów Prestiżu\n#b Nowy Typ Pitekantropa#!: 80 punktów Prestiżu\n#b Szkielet Neoantropa#!: 25 punktów Prestiżu\n#b Szkielet Paleoantropa#!: 50 punktów Prestiżu\n#b Szkielet Pitekantropa#!: 75 punktów Prestiżu\n#b Szkielet Australopiteka#!: 100 punktów Prestiżu\n#b Wprowadzenie Homo sapiens#!: 40 punktów Prestiżu\n#b Wprowadzenie Homo neanderthalensis#!: 50 punktów Prestiżu\n#b Wprowadzenie Homo erectus#!: 50 punktów Prestiżu"
 concept_andersson_anthropology: "Antropologia"
 concept_andersson_anthropology_desc: "#b Antropologia#! koncentruje się przede wszystkim na prehistorycznych przodkach ludzkości — od neolitu aż po australopiteki. [Concept('concept_andersson_anthropologist','$concept_andersson_anthropologists$')] badają przede wszystkim [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] oraz [Concept('concept_andersson_prehistoric_artifact','$concept_andersson_prehistoric_artifacts$')], aby odtworzyć odległą przeszłość. Antropolodzy nadal postrzegają [concept_andersson_human_evolution] jako proces przechodzenia od człowieka małpoluda, przez człowieka pierwotnego, aż po człowieka współczesnego (Pitekantrop, Paleoantrop, Neoantrop). W związku z tym poszukują na całym świecie przedstawicieli tych gatunków, nadając poszczególnym typom nazwy na podstawie miejsc ich odkrycia. Dysponując wystarczającą liczbą skamieniałości, mogą zrekonstruować [concept_andersson_skeleton]. Ponadto odkrywają malowidła jaskiniowe, wykonują pomiary kraniometryczne lub organizują wystawy poświęcone neolitowi, mezolitowi i górnemu paleolitowi. Do ich kompetencji należą również dwie konferencje: poświęcona zasiedleniu obu Ameryk oraz pochodzeniu współczesnego człowieka."
