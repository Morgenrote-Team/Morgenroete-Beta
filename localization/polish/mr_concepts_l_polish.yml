 concept_theiler_pest: "Szkodnik"
 concept_theiler_pests: "Szkodniki"
 concept_theiler_pest_desc: "SzkodnikSzkodniki to przede wszystkim szkodniki upraw — najczęściej owady — które mogą mieć znaczący wpływ na produkcję rolną kraju. W przeciwieństwie do wielu innych czynników wpływających na uprawy mogą utrzymywać się przez lata, choć później mogą również całkowicie zniknąć na pewien czas. [concept_theiler_biologist], a niekiedy także [concept_mendelejew_chemist], mogą opracować sposoby ograniczenia tego zagrożenia lub całkowitego jego wyeliminowania. Do szkodników należą:\n\n- [GetHarvestConditionType('locust_swarm').GetName]"
 concept_vikelas_mechanical_innovation_desc: "Innowacje Mechaniczne są wykorzystywane przez [concept_vikelas_mechanic] do ulepszania [concept_vikelas_race_car]. Można je wykorzystać do zwiększenia prędkości, niezawodności i bezpieczeństwa samochodu wyścigowego."