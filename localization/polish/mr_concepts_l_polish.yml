l_polish:
 ag_morgenroete_name: "[concept_morgenroete]"
 ag_morgenroete_tooltip: "Mamy co najmniej jedną dostępną akcję związaną z funkcją moda [concept_morgenroete]."
 concept_morgenroete: "#r Morgenröte#!"
 concept_morgenroete_mr: "MR"
 concept_morgenroete_concept: "Pojęcie"
 concept_pm_academics_university_humanities: "#b #BLUE Kierunek Humanistyczno-Antropologiczny#!#!"
 concept_pm_academics_university_natural_history: "#b #GREEN Kierunek Historii Naturalnej#!#!"
 concept_pm_academics_university_mathematics: "#b #ORANGE Kierunek Matematyczno-Techniczny#!#!"
 concept_academics_university_specialization: "Kierunek uniwersytetu"
 concept_academics_academic: "Uczony"
 concept_academics_academics: "Uczeni"
 concept_academics_scientist: "Naukowiec"
 concept_academics_scientists: "Naukowcy"
 concept_academics_academic_desc: "W modzie [concept_morgenroete] #b Uczeni#! to wyjątkowe postacie, które umożliwiają korzystanie z określonych mechanik moda. Możesz pozyskać #b Uczonych#! podczas niektórych wydarzeń lub po zgromadzeniu wystarczającej ilości [concept_academics_progress].\nObecnie dostępni są następujący #b Uczeni#!:\n - [concept_tesla_engineer]\n - [concept_mendelejew_chemist]\n - [concept_verrier_astronomer]\n - [concept_agassiz_geologist]\n - [concept_dubois_paleontologist]\n - [concept_dubois_naturalist]\n - [concept_theiler_biologist]\n - [concept_panum_physician]\n - [concept_lepsius_archaeologist]\n - [concept_andersson_anthropologist]"
 concept_academics_progress: "Postęp Akademicki"
 concept_academics_progress_desc: "Zdobywając 360 punktów #b Postępu Akademickiego#!, możesz pozyskać nowego [concept_academics_academic]. Aby w ogóle uzyskać dostęp do #b Postępu Akademickiego#!, musisz posiadać technologię #b Akademia#! oraz co najmniej jeden #b Uniwersytet#!.\nNa przyrost #b Postępu Akademickiego#! wpływa wiele czynników. Na przykład im wyższy poziom [concept_literacy], tym szybciej zdobywasz #b Postęp Akademicki#!. Kolejnym czynnikiem jest odsetek uczonych wśród ludności Twojego kraju. Maksymalny #b Postęp Akademicki#! uzyskasz, gdy uczeni stanowią #p 2%#! lub więcej ludności. Lepsze szkoły i zadowolona grupa interesu inteligencji również pomagają zwiększyć #b Postęp Akademicki#!. Ponadto niektóre kierunki badań technologicznych oraz specjalne budynki, takie jak [concept_dubois_zoo] lub [concept_verrier_observatory], zapewniają dodatkowy #b Postęp Akademicki#!."
 concept_academics_scientific_society: "Towarzystwo Naukowe"
 concept_academics_scientific_societies: "Towarzystwa Naukowe"
 concept_academics_scientific_society_desc: "#b Towarzystwo Naukowe#! skupia najwybitniejsze umysły Twojego kraju. Reprezentuje krajowych naukowców i uczonych, a także umożliwia odwiedzanie Twoich [Concept('concept_academics_academic','$concept_academics_academics$')].\n\n#b Towarzystwo Naukowe#! może zlecać Ci [Concept('concept_academics_academic_mission','$concept_academics_missions$')], za które otrzymasz przydatne nagrody."
 concept_academics_experience: "Doświadczenie"
 concept_academics_experience_desc: "Niektórzy Uczeni gromadzą #b Doświadczenie#! w ciągu swojego życia. W modzie [concept_morgenroete] postacie otrzymują #b Doświadczenie#! już w chwili utworzenia. Zazwyczaj otrzymują 10 punktów #b Doświadczenia#! za każdy rok życia powyżej 30 lat.\nPonadto zdobywają #b Doświadczenie#! podczas wykonywania swoich obowiązków, na przykład za odkrywanie nowych [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects$')]. Każdego roku otrzymują również dodatkowe #b Doświadczenie#!.\nPostać, która zdobędzie 100 punktów #b Doświadczenia#!, otrzyma cechę #b Doświadczony#!. Jeśli osiągnie 300 punktów #b Doświadczenia#!, otrzyma cechę #b Sławny#!.\nIm większe #b Doświadczenie#! postaci, tym lepiej wykonuje ona swoje obowiązki. Na przykład doświadczony lub sławny [concept_dubois_paleontologist] znajduje więcej [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones$')] i sprawniej buduje [concept_dubois_dinosaur_skeleton]."
 concept_academics_academic_mission: "Zadanie Akademickie"
 concept_academics_academic_missions: "Zadania Akademickie"
 concept_academics_mission: "Zadanie"
 concept_academics_missions: "Zadanie"
 concept_academics_academic_mission_desc: "Twoje [concept_academics_scientific_society] będzie czasami zlecać Ci osiągnięcie określonego celu. Może on polegać na znalezieniu określonej liczby [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects$')], [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')] lub podobnych rzeczy. Inne #b Misje#! mogą wymagać odnalezienia Planety X lub zorganizowania [Concept('concept_lepsius_exhibition','$concept_lepsius_excellent_exhibition$')].\nJeśli nie uda Ci się wykonać #b Misji#!, Twoje #b Towarzystwo Naukowe#! będzie niezadowolone, ale jej ukończenie przyniesie Ci przydatne nagrody."
 concept_curtiss_aviation: "Lotnictwo"
 concept_curtiss_aviation_desc: "#b Lotnictwo#! jest jedną z głównych funkcji moda [concept_morgenroete]. W XIX i XX wieku nastąpił rozwój lotnictwa. Początkowo latano za pomocą #b Balonów#! i #b Sterowców#!, a później także #b Samolotów#!. Latanie było prestiżowym zajęciem i pozwalało docierać do nowych horyzontów.\n\nWiele krajów rozpoczyna swoją przygodę z przestworzami już na początku gry, gdy zaczynają sponsorować [Concept('concept_curtiss_balloonist_role','$concept_curtiss_balloonist_role_only_balloonist$')], aby bić rekordy. Pobijanie rekordów zapewni Twojemu krajowi zarówno przyspieszenie badań technologicznych, jak i modyfikator prestiżu.\nZbadanie technologii sterowców pozwoli Ci zorganizować [concept_curtiss_arctic_expedition], jeśli masz dostęp do bieguna północnego oraz [concept_curtiss_pilot].\nDalsze badania w dziedzinie lotnictwa odblokują wiele nowych mechanik. Będziesz mógł budować [concept_curtiss_airport], które będą wytwarzać nowe dobro #b Loty#!, a także #b Usługi#!. #b Lotniska#! umożliwią rozwój [concept_curtiss_airline], co pozwoli Ci korzystać z akcji dyplomatycznej [concept_curtiss_airspace_convention]. #b Konwencja Przestrzeni Powietrznej#! zapewni Ci dostęp do stanów i [Concept('concept_lepsius_excavation_site','$concept_lepsius_excavation_sites$')], a także do bieguna północnego. Jeśli Twoje #b Linie Lotnicze#! odpowiednio się rozwiną, będziesz mógł zbudować gigantyczny sterowiec lub największy samolot na świecie.\nNajbardziej ekscytująca funkcja pojawia się na początku XX wieku: będziesz mógł rywalizować o [concept_curtiss_schneider_trophy]. #b Puchar Schneidera#! to wyścig wodnosamolotów, w którym rywalizują ze sobą różne kraje. Zwycięstwo zapewni Ci prestiż i możliwość zorganizowania kolejnej edycji zawodów. Jeśli uda Ci się wygrać wyścig trzy razy, zatrzymasz #b Puchar Schneidera#!."
 concept_curtiss_balloonist_role: "Rola baloniarza"
 concept_curtiss_balloonist_role_only_balloonist: "Baloniarz"
 concept_curtiss_balloonists_role: "Baloniarze"
 concept_curtiss_balloonist_role_desc: "#b Baloniarz#! to wyjątkowa postać, którą może sponsorować kraj. Zazwyczaj kraje wysoko rozwinięte lub zachodnie sponsorują #b Baloniarzy#! i rywalizują o rekordy oraz nowe odkrycia. #b Baloniarze#! odbywają losowe loty i ustanawiają rekordy w trzech kategoriach: najdłuższy dystans, najdłuższy czas lotu lub największa osiągnięta wysokość. Za każdy lot balonem #b Baloniarz#! zdobywa doświadczenie i awansuje w rankingu, co zwiększa szansę na ustanowienie nowych rekordów. Należy jednak pamiętać, że loty balonem są niebezpieczne i wielu baloniarzy umiera przedwcześnie, szczególnie jeśli chorują, nadużywają alkoholu lub zażywają narkotyki."
 concept_curtiss_arctic_expedition: "Wyprawa Polarna"
 concept_curtiss_arctic_expeditions: "Wyprawy Polarne"
 concept_curtiss_arctic_expedition_desc: "Jeśli opracowałeś technologię #b Zeppelin#!, posiadasz [concept_verrier_observatory] ze #b Stacją Meteorologiczną#!, [concept_curtiss_pilot] oraz dostęp do stanu położonego w pobliżu bieguna północnego, możesz zorganizować #b Wyprawę Arktyczną#!. Są to następujące stany: #b Grenlandia#!, #b Północna Norwegia#!, #b Alaska#!, #b Nunavut#! i #b Nieniecka#!. Dostęp do nich możesz uzyskać, posiadając dany stan lub zawierając z jego właścicielem [concept_curtiss_airspace_convention].\nPodczas #b Wyprawy Arktycznej#! możesz organizować wyprawy badawcze, budować stacje polarne, zdobywać nową wiedzę z zakresu geografii, meteorologii i biologii Arktyki, a także jako pierwszy przelecieć sterowcem nad biegunem północnym!"
 concept_curtiss_pilot: "Pilot"
 concept_curtiss_pilots: "Piloci"
 concept_curtiss_pilot_desc: "#b Pilot#! to postać posiadająca #b Cechę Pilota#!. #b Piloci#! mają niewielką szansę na pojawienie się po odkryciu technologii #b Wczesne Lotnictwo#!. Ponadto podczas bitew na froncie, na którym stosowana jest metoda produkcji Rozpoznanie Powietrzne, istnieje szansa, że w wyniku wydarzenia pojawi się #b Pilot#!. Lepsze technologie, takie jak Samoloty i Nowoczesne Lotnictwo, a także założenie Szkoły Pilotów za pomocą decyzji zwiększają szansę na pojawienie się postaci z cechą #b Pilota#!.\n#b Piloci#! pomagają na różne sposoby. #b Linie Lotnicze#! mogą być zainteresowane #b Pilotami#!, aby poprawić swój wizerunek; podczas rywalizacji o [concept_curtiss_schneider_trophy] doświadczeni #b Piloci#! mają większe szanse na zwycięstwo; a #b Pilot#! jest niezbędny do zorganizowania [concept_curtiss_arctic_expedition]. #b Piloci#! mogą również awansować do rangi asów lotnictwa w wyniku wydarzenia, jeśli zostaną przydzieleni na front."
 concept_curtiss_airport: "Lotnisko"
 concept_curtiss_airports: "Lotniska"
 concept_curtiss_airport_desc: "#b Lotnisko#! to budynek odblokowywany dzięki technologii #b Nowoczesne Lotnictwo#!. Jest to budynek wyłącznie cywilny, który zapewnia [GetGoods('air_travel').GetName] i #b Usługi#!, ale zużywa różne towary, począwszy od [GetGoods('tools').GetName], [GetGoods('paper').GetName], [GetGoods('aeroplanes').GetName] i [GetGoods('oil').GetName]. Później wymaga również [GetGoods('electricity').GetName], [GetGoods('telephones').GetName] i [GetGoods('radios').GetName].\nGdy posiadasz wystarczającą liczbę #b Lotnisk#!, powstanie [concept_curtiss_airline]. Wraz z rozbudową #b Lotnisk#! będą rozwijać się również #b Linie Lotnicze#!, oferując coraz więcej premii."
 concept_curtiss_airline: "Linia lotnicza"
 concept_curtiss_airlines: "Linie lotnicze"
 concept_curtiss_airline_desc: "#b Linia Lotnicza#! to przedsiębiorstwo lub instytucja zarządzana przez rząd, która oferuje [GetGoods('air_travel').GetName] — od połączeń lokalnych aż po loty międzynarodowe pod koniec gry. #b Linie Lotnicze#! zapewniają również różne dodatkowe premie. #b Linie Lotnicze#! potrzebują [Concept('concept_curtiss_airport','$concept_curtiss_airports$')], aby obsługiwać te połączenia. Wraz z rozbudową #b Lotnisk#! będą rozwijać się również #b Linie Lotnicze#!.\nJeśli Twoja #b Linia Lotnicza#! jest zarządzana przez rząd, otrzymasz możliwość zbudowania ogromnego sterowca i wysyłania go na dalekie trasy. Jeśli Twoja #b Linia Lotnicza#! jest własnością publiczną lub prywatną, możesz zamiast tego otrzymać możliwość zbudowania największego samolotu, jaki kiedykolwiek powstał."
 concept_curtiss_airspace_convention: "Konwencja przestrzeni powietrznej"
 concept_curtiss_airspace_conventions: "Konwencjae przestrzeni powietrznej"
 concept_curtiss_airspace_convention_desc: "#b Konwencja Przestrzeni Powietrznej#! to ważny [concept_diplomatic_pact], który pozwala Ci nawiązywać kontakty z regionami położonymi daleko poza obszarem Twoich wpływów. Jeśli zawrzesz #b Konwencję Przestrzeni Powietrznej#! z innym krajem posiadającym [concept_lepsius_excavation_site], będziesz mógł zorganizować [concept_lepsius_expedition] bez konieczności posiadania wystarczająco wysokiego poziomu [concept_interest_tier] w danym regionie.\n#b Konwencja Przestrzeni Powietrznej#! pozwoli Ci również zorganizować [concept_curtiss_arctic_expedition], jeśli nie posiadasz żadnego z wymaganych stanów."
 concept_curtiss_schneider_trophy: "Puchar Schneidera"
 concept_curtiss_schneider_trophy_desc: "Walka o to prestiżowe trofeum, które Francuz Jacques Schneider ufundował krótko przed I wojną światową, miała przede wszystkim stymulować rozwój wodnosamolotów. Z czasem rywalizacja o to trofeum przerodziła się w wyścig narodów, w którym szczególnie Wielka Brytania, USA i Włochy udzielały swoim zespołom ogromnego wsparcia, aby zdobyć upragnione trofeum. Rozwój technologiczny rzeczywiście skorzystał na #b Pucharze Schneidera#!, w ramach którego wykorzystywano coraz szybsze i bardziej zaawansowane wodnosamoloty.\n#b Puchar Schneidera#! może zostać ustanowiony, jeśli 5 krajów opracowało technologię #b Wodnosamoloty#!, a Ty posiadasz port i centrum miejskie na poziomie 10 w jednym ze swoich stanów.\nZwycięzca Pucharu jest wybierany za pośrednictwem wpisu w Dzienniku, a na wynik wpływa wiele czynników. Przykładowo kraj posiadający szkołę pilotów i duże [concept_curtiss_airline] będzie miał przewagę. W zdobyciu trofeum pomogą również znakomity [concept_curtiss_pilot] oraz ogromne nakłady finansowe.\nZwycięzca poprzedniej edycji Pucharu będzie mógł zorganizować kolejną, jeśli posiada port lub jest Szwajcarią, która ma liczne jeziora. Jeszcze lepiej jest wygrać Puchar 3 razy z rzędu, ponieważ wtedy kraj zatrzyma trofeum na zawsze i otrzyma za to premię do prestiżu."
 concept_curtiss_balloonist: "Baloniarz"
 concept_curtiss_balloonist_desc: "Ta postać jest baloniarzem, który często wyrusza na pełne przygód loty balonem."
 concept_curtiss_experienced_balloonist: "Doświadczony Baloniarz"
 concept_curtiss_experienced_balloonist_desc: "Ta postać jest doświadczonym baloniarzem, który często wyrusza na pełne przygód loty balonem. Postacie z tą cechą mają większą szansę na ustanawianie lepszych rekordów."
 concept_curtiss_famous_balloonist: "Słynny Baloniarz"
 concept_curtiss_famous_balloonist_desc: "Ta postać jest słynnym baloniarzem, który często wyrusza na pełne przygód loty balonem. Postacie z tą cechą mają większą szansę na ustanawianie lepszych rekordów."
 concept_dubois_natural_history: "Historia Naturalna"
 concept_dubois_natural_history_desc: "#b Historia Naturalna#! jest jedną z głównych funkcji moda [concept_morgenroete]. W XIX wieku dokonano wielu wielkich odkryć w dziedzinie historii naturalnej: odbyło się wiele słynnych wypraw, takich jak wyprawa statku Beagle, sformułowano teorię ewolucji, odkryto setki tysięcy nowych gatunków i oczywiście odkryto dinozaury.\n\nMocarstwa Główne i Wielkie Mocarstwa posiadające flotę oraz admirała mogą wysłać statek na [concept_dubois_pacific_expedition]. Podczas #b Wyprawy na Pacyfik#! możesz odnajdywać rzadkie rośliny, zwierzęta i skamieniałości, prowadzić badania oceanograficzne lub obserwować zjawiska astronomiczne, takie jak zaćmienia Słońca.\n\nDuże zwierzęta, które możesz odnaleźć, czyli [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals$')], można wykorzystać do utworzenia [concept_dubois_zoo] i prezentowania tych zwierząt. Im więcej zwierząt, tym większy efekt przynosi #b Ogród Zoologiczny#!. #b Zwierzęta#! te możesz odnajdywać podczas wypraw, pozyskiwać na własnym terytorium lub prosić inne kraje o ich sprzedaż.\n\nMniejsze zwierzęta, rośliny i inne organizmy określa się mianem [concept_dubois_specimen]. [concept_dubois_naturalist] może zbierać takie #b Okazy#!. #GREEN #b Przyrodnik#!#! może zostać wysłany na [Concept('concept_dubois_botanical_expedition','$concept_dubois_botanical_expeditions$')] do stanów z modyfikatorem stanu oznaczającym las deszczowy. Jeśli nie posiadasz takiego stanu, możesz uzyskać [concept_dubois_botanical_licence] od innego kraju. #GREEN #b Przyrodnik#!#! zdobywa [concept_academics_experience] za odnajdywanie rzadkich okazów.\n\n[Concept('concept_dubois_fossil','$concept_dubois_fossils$')] to dziedzina [concept_dubois_paleontologist] obejmująca skamieniałości roślin, owadów i innych małych zwierząt. #b Skamieniałości#! można odnajdywać podczas #b Wypraw#! lub w stanach, na których terenie występują [Concept('concept_dubois_formation','$concept_dubois_formations$')]. Jeśli posiadasz #b Wielką Formację#!, możesz nawet odnaleźć [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones$')]. W przeciwnym razie możesz uzyskać dostęp do takiej formacji, kupując [concept_dubois_paleontological_licence].\n\nJeśli Twój kraj ma dostęp do pasma górskiego, generał może wziąć udział w [concept_douglas_mountaineering], zdobyć lepsze cechy i premię do prestiżu."
 concept_dubois_naturalist: "#b #GREEN Przyrodnik #! #!"
 concept_dubois_naturalists: "#b #GREEN Przyrodnicy #! #!"
 concept_dubois_naturalist_desc: "#b #GREEN Przyrodnicy#!#! to Uczeni, którzy mogą zbierać [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals$')] oraz [concept_dubois_specimen]. Można wysyłać ich na [concept_dubois_pacific_expedition] lub [concept_dubois_botanical_expedition], gdzie mogą odnajdywać rzadkie rośliny i zwierzęta zapewniające niewielką premię. #b #GREEN Przyrodnicy#!#! zdobywają [concept_academics_experience] za odnajdywanie nowych, rzadkich okazów."
 concept_dubois_paleontologist: "#b #GREEN Paleontolog #! #!"
 concept_dubois_paleontologists: "#b #GREEN Paleontolodzy #! #!"
 concept_dubois_paleontologist_desc: "#b #GREEN Paleontolodzy#!#! to Uczeni, którzy poszukują [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones$')] oraz [Concept('concept_dubois_fossil','$concept_dubois_fossils$')]. Aby je zbierać, potrzebujesz dostępu do [concept_dubois_formation]. Jeśli masz dostęp do #b Formacji#!, dzięki jej posiadaniu lub [concept_dubois_paleontological_licence], możesz wysłać swojego #b Paleontologa#! na [concept_dubois_paleontological_expedition].\nPo zebraniu lub zrekonstruowaniu 5 #b Kości Dinozaurów#! Twój #b Paleontolog#! może zbudować [concept_dubois_dinosaur_skeleton]. Wraz ze zdobywaniem [concept_academics_experience] przez #b #GREEN Paleontologów#!#! rosną ich umiejętności rekonstruowania #b Szkieletów Dinozaurów#!, a same #b szkielety#! stają się coraz lepsze. Im lepsze są #b Szkielety Dinozaurów#!, tym więcej prestiżu zapewnia Twoja [concept_dubois_paleontological_collection]."
 concept_dubois_pacific_expedition: "Wyprawa Pacyficzna"
 concept_dubois_pacific_expeditions: "Wyprawy Pacyficzne"
 concept_dubois_pacific_expedition_desc: "Jako Mocarstwo lub Wielkie Mocarstwo możesz wysłać Wyprawę na Ocean Spokojny. Musisz opracować technologie #b Empiryzm#!, #b Fregata Śrubowa#! i #b Dialektyka#!, posiadać port i uniwersytet, a także flotę o sile co najmniej 15 oraz admirała.\nPodczas #b Wyprawy na Pacyfik#! możesz odnaleźć rzadkie rośliny, [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals$')] i [Concept('concept_dubois_fossil','$concept_dubois_fossils$')], prowadzić badania oceanograficzne lub obserwować zjawiska astronomiczne, takie jak zaćmienia Słońca. Na początku #b Wyprawy#! możesz również wybrać #b Naukowca#!, który weźmie w niej udział: #b Geodetę#!, [concept_dubois_naturalist], [concept_dubois_paleontologist] lub [concept_verrier_astronomer]. Każdy z nich pomoże uzyskać lepsze wyniki w określonych wydarzeniach związanych z jego specjalizacją.\nMożesz wybrać konkretny cel badawczy swojej wyprawy. Może ona koncentrować się wyłącznie na tajemnicach mórz i rozwijaniu wiedzy oceanograficznej oraz astronomicznej — w takim przypadku będą występować tylko wydarzenia oceanograficzne. Jeśli zdecydujesz się badać cuda natury, napotkasz wydarzenia botaniczne, zoologiczne i paleontologiczne. Wielkie Mocarstwa będą miały również możliwość podjęcia misji prestiżowej, podczas której można odnaleźć artefakty, zakładać placówki handlowe lub tworzyć misje. Jest to szczególnie przydatne, jeśli nie masz interesów dyplomatycznych w Oceanii, ale chcesz spróbować zdobyć przynajmniej niewielką kolonię za pośrednictwem misjonarzy.\nBędziesz również musiał wybrać dokładny obszar, do którego uda się wyprawa: Oceanię, Australię lub Indonezję. Każdy z tych obszarów oferuje inne wydarzenia i nagrody."
 concept_dubois_habitat: "Siedlisko"
 concept_dubois_habitats: "Siedliska"
 concept_dubois_animal_habitat: "Siedlisko Naturalne"
 concept_dubois_habitat_desc: "#b Siedlisko#! to obszar w stanie, na którym żyje określony [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animal$')]. W modzie #r Morgenröte#! #b Siedliska#! różnych zwierząt występują w różnych regionach stanów. Jeśli posiadasz #b Siedlisko#!, możesz przewozić #b Zwierzęta#! do [concept_dubois_zoo] lub nawet sprzedawać je innym krajom.\n\nJeśli poziom [concept_urbanization] w Twoim stanie osiągnie 2000 lub więcej albo w stanie zabraknie [concept_arable_land], #b Egzotyczne Zwierzęta#! #n wyginą po 10 latach#!.\n\nAby uchronić #b Zwierzęta#! przed wyginięciem, możesz zbudować [concept_dubois_nature_reserve] w stanie, w którym znajduje się #b Siedlisko#!."
 concept_dubois_nature_reserve: "Rezerwat Przyrody"
 concept_dubois_nature_reserves: "Rezerwaty Przyrody"
 concept_dubois_royal_hunting_reserve: "Królewski rezerwat łowiecki"
 concept_dubois_nature_reserve_desc: "#b Rezerwat Przyrody#! to obszar chroniony, na którym można chronić lub tworzyć [Concept('concept_dubois_habitat','$concept_dubois_habitats$')].\n\nJeśli posiadasz już #b Siedlisko#!, możesz chronić je przed zniszczeniem spowodowanym działalnością człowieka, budując budynek #b Rezerwatu Przyrody#! w stanie, w którym znajduje się #b Siedlisko#!. Aby zbudować #b Rezerwat Przyrody#!, musisz odblokować technologię #b Genetyka#! oraz posiadać zintegrowany stan z #b Siedliskiem#!, który jest ojczyzną jednej z Twoich kultur podstawowych.\n\nJeśli nie posiadasz żadnego #b Siedliska#!, możesz zbudować #b Rezerwat Przyrody#!, poszukując odpowiedniej lokalizacji na terenie swojego kraju, pod warunkiem że odblokowałeś technologię #b Genetyka#! i posiadasz w swoim [concept_dubois_zoo] co najmniej jedno [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animal$')] pochodzące z Twojego kontynentu.\n\n#b Rezerwat Przyrody#! nie tylko chroni zwierzęce #b Siedliska#!, ale pozwala również osiedlać w nich #b Egzotyczne Zwierzęta#! pochodzące z Twojego kontynentu. Dzięki temu możesz chronić wszystkie #b Egzotyczne Zwierzęta#! z Twojego kontynentu w jednym stanie."
 concept_dubois_zoo_animal: "Zwierze w Zoo"
 concept_dubois_zoo_animals: "Zwierzęta w Zoo"
 concept_dubois_exotic_animal: "Egzotyczne Zwierzę "
 concept_dubois_exotic_animals: "Egzotyczne Zwierzęta"
 concept_dubois_zoo_animal_desc: "Na świecie żyje wiele zwierząt, które Twój [concept_dubois_naturalist] może schwytać. Aby schwytać #b Egzotyczne Zwierzę#!, potrzebujesz stanu z [concept_dubois_habitat]. Alternatywnie możesz kupić #b Egzotyczne Zwierzę#! od kraju posiadającego #b Siedlisko#!.\nPo schwytaniu #b Zwierzęta do Zoo#! można wysłać do [concept_dubois_zoo], co pozwoli Ci rozbudować #b Ogród Zoologiczny#!."
 concept_dubois_zoo: "Zoo"
 concept_dubois_zoos: "Ogrody Zoologiczne"
 concept_dubois_zoo_desc: "#b Zoo#! to specjalny budynek, który możesz wybudować po zgromadzeniu 5 [concept_dubois_zoo_animal]. W #b Zoo#! znajdują się Twoje #b Zwierzęta#!, kolekcja [concept_dubois_specimen] oraz Twoja Kolekcja Paleontologiczna."
 concept_dubois_specimen: "Okaz"
 concept_dubois_specimens: "Okazy"
 concept_dubois_specimen_desc: "Różne owady, rośliny i mniejsze zwierzęta, które [concept_dubois_naturalist] może zbierać, nazywane są #b Okazami#!. Możesz wykorzystać #b Okazy#! do utworzenia Ogrodu Botanicznego lub Kolekcji Okazów w swoim [concept_dubois_zoo]."
 concept_dubois_botanical_expedition: "Wyprawa Botaniczna"
 concept_dubois_botanical_expeditions: "Wyprawy Botaniczne"
 concept_dubois_botanical_expedition_desc: "Możesz wysłać [concept_dubois_naturalist] na #b Wyprawę Botaniczną#!, jeśli masz dostęp do stanu, w którym występują [concept_ito_medicinal_plants], dzięki posiadaniu takiego stanu lub uzyskaniu [concept_dubois_botanical_licence].\nTwój #b Przyrodnik#! będzie zbierać [concept_ito_medicinal_plants] oraz [Concept('concept_dubois_specimen','$concept_dubois_specimens$')] podczas rocznej wyprawy. Czasami znajdzie rzadką roślinę, która będzie cennym dodatkiem do kolekcji botanicznej w [concept_dubois_zoo]."
 concept_dubois_botanical_licence: "Licencja Botaniczna"
 concept_dubois_botanical_licences: "Pozwolenia Botaniczne "
 concept_dubois_botanical_licence_desc: "Jeśli nie masz dostępu do stanu z modyfikatorem stanu oznaczającym las deszczowy, nadal możesz zorganizować [concept_dubois_botanical_expedition], uzyskując #b Licencję Botaniczną#! od kraju, który posiada taki stan. Będzie Cię to kosztować niewielką sumę pieniędzy, ale pozwoli Ci zbierać [Concept('concept_dubois_specimen','$concept_dubois_specimens$')] i odnajdywać rzadkie rośliny."
 concept_dubois_fossil: "Skamielina"
 concept_dubois_fossils: "Skamieliny"
 concept_dubois_fossil_desc: "[concept_dubois_paleontologist] może odkrywać #b Skamieniałości#! dawno wymarłych roślin i zwierząt, jeśli odkryłeś [concept_dubois_formation]."
 concept_dubois_dinosaur_bone: "Kości Dinozaurów"
 concept_dubois_dinosaur_bones: "Kości Dinozaurów"
 concept_dubois_dinosaur_bone_desc: "[concept_dubois_paleontologist] może odnajdywać Kości Dinozaurów w Wielkich [Concept('concept_dubois_formation','$concept_dubois_formations$')].\n#b Doświadczony Paleontolog#! może również podjąć próbę odtworzenia #b Kości Dinozaura#! z 20 fragmentów [Concept('concept_dubois_fossil','$concept_dubois_fossils$')]. #b Kość Dinozaura#! można odtworzyć tylko wtedy, gdy dostępna jest co najmniej jedna kość dinozaura, która posłuży jako wzór.\nAby wykonać dowolną z tych czynności, paleontolog nie może być wyczerpany ani zajęty. Powodzenie zależy w dużej mierze od [concept_academics_experience] w dziedzinie paleontologii.\n#b Kości Dinozaurów#! służą do odtwarzania [Concept('concept_dubois_dinosaur_skeleton','$concept_dubois_dinosaur_skeletons$')]."
 concept_dubois_dinosaur_skeleton: "Szkielet Dinozaura"
 concept_dubois_dinosaur_skeletons: "Szkielety Dinozaurów "
 concept_dubois_dinosaur_skeleton_desc: "Z pięciu [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones$')] pochodzących z jednego regionu kontynentalnego [concept_dubois_paleontologist] może zrekonstruować kompletnego dinozaura. Aby odtworzyć #b Szkielet Dinozaura#!, potrzebujesz 5 #b Kości Dinozaurów#! z tego samego regionu.\nMiejmy nadzieję, że Twój #b Paleontolog#! ma wystarczające doświadczenie, aby prawidłowo zrekonstruować #b Szkielet Dinozaura#!. W przeciwnym razie możesz stracić prestiż swojej [concept_dubois_paleontological_collection]. Jeśli jednak #b Szkielet Dinozaura#! zostanie nieprawidłowo zrekonstruowany, możesz spróbować go poprawić, co pozwoli uzyskać nieco lepszą rekonstrukcję."
 concept_dubois_paleontological_collection: "Kolekcja Paleontologiczna"
 concept_dubois_paleontological_collections: "Kolekcje Paleontologiczne"
 concept_dubois_paleontological_collection_desc: "#b Kolekcja Paleontologiczna#! to domena Twojego [concept_dubois_paleontologist]. Znajdziesz w niej wszystkie [Concept('concept_dubois_fossil','$concept_dubois_fossils$')], [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones$')] oraz [Concept('concept_dubois_dinosaur_skeleton','$concept_dubois_dinosaur_skeletons$')] zgromadzone przez Twój kraj.\nIm lepiej Twój #b Paleontolog#! zmontował te #b Szkielety Dinozaurów#!, tym więcej prestiżu zapewni Twoja #b Kolekcja#!. Jeśli Twój #b Paleontolog#! zmontował #b Szkielety#! wyjątkowo nieudolnie, możesz nawet stracić prestiż. Być może jednak ten sam lub inny #b Paleontolog#! zdoła zamontować je lepiej!"
 concept_dubois_formation: "Formacja"
 concept_dubois_formations: "Formacje"
 concept_dubois_geological_formation: "Formacja Geologiczna"
 concept_dubois_formation_desc: "Istnieją dwa rodzaje #b Formacji#!. Zwykłe formacje pozwalają Twojemu [concept_dubois_paleontologist] zbierać [Concept('concept_dubois_fossil','$concept_dubois_fossils$')], natomiast Wielkie Formacje umożliwiają odkrywanie [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones$')].\n#b Formacje#! mogą zostać odkryte przez Twojego paleontologa lub w wyniku opracowania technologii Paleontologii.\nJeśli nie posiadasz własnej #b Wielkiej Formacji#!, możesz kupić [concept_dubois_paleontological_licence] od kraju, który ją posiada, i uzyskać do niej dostęp."
 concept_dubois_paleontological_expedition: "Wyprawa Paleontologiczna"
 concept_dubois_paleontological_expeditions: "Wyprawy Paleontologiczne"
 concept_dubois_paleontological_licence: "Licencja Paleontologiczna"
 concept_dubois_paleontological_licences: "Licencje Paleontologiczne"
 concept_dubois_paleontological_licence_desc: "Jeśli nie masz dostępu do [concept_dubois_formation], możesz spróbować go uzyskać za pomocą #b Licencji Paleontologicznej#!. Ta akcja dyplomatyczna pozwala uzyskać dostęp do #b Wielkiej Formacji#!. Aby móc z niej skorzystać, musisz być Mocarstwem Głównym lub Wielkim Mocarstwem, a drugi kraj musi posiadać #b Wielką Formację#!. Będziesz musiał płacić drugiemu krajowi niewielką część swoich dochodów, ale miejmy nadzieję, że będzie to opłacalne."
 concept_dubois_mountain: "Góra"
 concept_dubois_mountains: "Góry"
 concept_dubois_mountain_desc: "Istnieje wiele #b Gór#!, które można zdobywać.\n\n#V Ameryka Północna:#!\n#b Mount McKinley#! (Alaska), 6190 metrów\n#b Mount Logan#! (Terytorium Jukonu), 5959 metrów\n#b Citlaltépetl#! (Meksyk), 5636 metrów\n#b Mount Whitney#! (Kalifornia), 4421 metrów\n\n#V Ameryka Południowa:#!\n#b Aconcagua#! (Mendoza), 6267 metrów\n#b Huascarán#! (Terytorium Limy), 6768 metrów\n#b Illimani#! (La Paz), 6438 metrów\n#b Chimborazo#! (Ekwador), 6267 metrów\n\n#V Europa:#!\n#b Shkara#! (Wielki Kaukaz), 5642 metrów\n#b Dufourspitze#! (Zachodnia Szwajcaria), 4634 metrów\n#b Matterhorn#! (Zachodnia Szwajcaria), 4478 metrów\n#b Aiguille Verte#! (Sabaudia), 4122 metrów\n#b Pico de Aneto#! (Aragonia), 3404 metrów\n\n#V Afryka:#!\n#b Kibo#! (Tanganika), 5895 metrów\n#b Mount Kenya#! (Kenia), 5199 metrów\n#b Mount Stanley#! (Uganda), 5109 metrów\n#b Kamerunberg#! (Południowy Kamerun), 4095 metrów\n\n#V Azja:#!\n#b Kamet#! (Delhi), 7756 metrów\n#b Chogolisa#! (Kaszmir), 7665 metrów\n#b Kabru#! (Himalaje), 7412 metrów\n#b Kaufmann Peak#! (Tadżykistan), 7134 metrów\n\n#V Australia i Oceania:#!\n#b Mount Wilhelm#! (Wschodnia Nowa Gwinea), 4121 metrów\n#b Mount Cook#! (Wyspa Południowa), 3724 metrów"
 concept_elgar_music: "Kultura muzyczna"
 concept_elgar_opera: "Opera"
 concept_elgar_operas: "Opery"
 concept_elgar_opera_house: "Gmach Opery"
 concept_elgar_opera_houses: "Gmachy Opery"
 concept_elgar_musical_tradition: "Tradycja Muzyczna "
 concept_elgar_impressionism: "Impresjonizm"
 concept_elgar_expressionism: "Ekspresjonizm"
 concept_elgar_art_nouveau: "Secesja"
 concept_elgar_architecture: "Architektura "
 concept_elgar_architectural_project: "Projekt Architektoniczny"
 concept_elgar_architectural_projects: "Projekty Architektoniczne "
 concept_lepsius_archaeology: "Archeologia"
 concept_lepsius_archaeology_desc: "#b Archeologia#! jest jedną z głównych funkcji moda [concept_morgenroete].\n\nNa mapie znajduje się 8 [Concept('concept_lepsius_excavation_site','$concept_lepsius_excavation_sites$')].\n\nAby móc wysłać [concept_lepsius_expedition], musisz opracować technologię Antykwaryzmu, posiadać [concept_lepsius_archaeological_team] oraz mieć dostęp do jednego ze stanowisk wykopaliskowych. Możesz uzyskać do niego dostęp, posiadając stanowisko na własność lub prosząc kraj, który je posiada, o [concept_lepsius_excavation_licence].\n\nMożesz teraz wysłać wyprawę archeologiczną na jedno ze stanowisk wykopaliskowych. Twój zespół będzie odkrywać [Concept('concept_lepsius_artifact','$concept_lepsius_minor_artifacts$')], a w bardzo rzadkich przypadkach, dzięki pomocy doświadczonego [concept_lepsius_archaeologist], może nawet odnaleźć [concept_lepsius_major_artifact].\n\nGdy Twój zespół powróci z artefaktami, być może będziesz mógł zbudować [concept_lepsius_museum]. W Muzeum Archeologicznym będziesz mógł oglądać swoje artefakty, tworzyć [concept_lepsius_exhibition] i odwiedzać swojego #b #BLUE Archeologa#!#!.\n\nIm więcej artefaktów i wystaw posiadasz, tym więcej Prestiżu zdobędziesz.\n\n#b Antropologia#! to kolejna dziedzina archeologii. Jeśli posiadasz [concept_andersson_anthropologist] oraz [concept_andersson_cave], możesz odnajdywać [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] i rekonstruować prehistoryczne gatunki człowieka. Każdy szkielet zapewni Ci więcej Prestiżu Antropologicznego. Po zgromadzeniu wystarczającej ilości Prestiżu Antropologicznego Twój kraj otrzyma modyfikator prestiżu."
 concept_lepsius_archaeologist: "#b #BLUE Archeolog #! #!"
 concept_lepsius_archaeologists: "#b #BLUE Archeologowie #! #!"
 concept_lepsius_archaeologist_desc: "#b #BLUE Archeolodzy#!#! to Uczeni, których możesz wysyłać na [Concept('concept_lepsius_expedition','$concept_lepsius_expeditions$')]. Będą tam zbierać [Concept('concept_lepsius_artifact','$concept_lepsius_minor_artifacts$')]. Czasami mogą nawet odnaleźć [concept_lepsius_major_artifact].\nArcheolodzy zdobywają [concept_academics_experience] podczas pracy oraz pasywnie każdego roku. Mogą uzyskiwać wyższe poziomy cechy archeologa dzięki zdobywaniu wystarczającej liczby punktów #b Doświadczenia#!."
 concept_lepsius_museum: "Muzeum Archeologiczne"
 concept_lepsius_museum_desc: "#b Muzeum Archeologiczne#! to budynek, który możesz wybudować, aby prezentować wszystkie [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')] odnalezione przez Twój kraj."
 concept_lepsius_excavation_site: "Wykopalisko Archeologiczne"
 concept_lepsius_excavation_sites: "Wykopaliska Archeologiczne"
 concept_lepsius_excavation_site_desc: "W różnych krajach znajduje się wiele #b Historycznych Stanowisk Wykopaliskowych#!, w tym w Górnym i Dolnym Egipcie, Babilonii, Asyrii, na Krecie, w Argolidzie, na Jukatanie i w Peru. Każde #b Historyczne Stanowisko#! oferuje różne [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')] oraz wydarzenia. Oprócz tych dużych, historycznie istotnych stanowisk wykopaliskowych istnieją również [Concept('concept_lepsius_minor_excavation_site', '$concept_lepsius_minor_excavation_sites$')]."
 concept_lepsius_expedition: "Wyprawa Archeologiczna"
 concept_lepsius_expeditions: "Wyprawy Archeologiczne"
 concept_lepsius_expedition_desc: "#b Wyprawa Archeologiczna#! to wyprawa [concept_lepsius_archaeologist] wraz z jego [concept_lepsius_archaeological_team]. Potrwa kilka miesięcy, podczas których uczestnicy będą starali się zgromadzić jak najwięcej [Concept('concept_lepsius_artifact','$concept_lepsius_minor_artifacts$')]. #b Wyprawy#! są jedynym sposobem na zdobycie [Concept('concept_lepsius_major_artifact','$concept_lepsius_major_artifacts$')].\nJeśli opracowałeś technologię Wczesna Archeologia, po udanej #b Wyprawie#! możesz pozostawić swój zespół na stanowisku, aby utworzyć [concept_lepsius_excavation]."
 concept_lepsius_archaeological_team: "Zespół Archeologiczny"
 concept_lepsius_archaeological_teams: "Zespoły Archeologiczne"
 concept_lepsius_excavation_team: "Zespół Wykopaliskowy"
 concept_lepsius_archaeological_team_desc: "Potrzebujesz co najmniej jednego #b Zespołu Archeologicznego#!, aby móc organizować [Concept('concept_lepsius_expedition','$concept_lepsius_expeditions$')]. Możesz posiadać maksymalnie 3 #b Zespoły Archeologiczne#!, ale każdy kolejny wymaga spełnienia wyższych wymagań.\n\nPierwszy #b Zespół#! możesz uzyskać po opracowaniu technologii Antykwaryzmu, osiągnięciu co najmniej 3. poziomu Uniwersytetu oraz poziomu alfabetyzacji wynoszącego 33%.\n\nKolejny Zespół możesz uzyskać po opracowaniu technologii Nowoczesnej Archeologii, osiągnięciu co najmniej 15. poziomu Uniwersytetu oraz poziomu alfabetyzacji wynoszącego 66%.\n\nMożesz uzyskać kolejny #b Zespół#!, jeśli opracowałeś technologię Antykwaryzmu i posiadasz doświadczonego [concept_lepsius_archaeologist].\n\nPotrzebujesz #b Zespołów#! do organizowania [Concept('concept_lepsius_expedition','$concept_lepsius_expeditions$')] oraz prowadzenia [Concept('concept_lepsius_excavation','$concept_lepsius_excavations$')]."
 concept_lepsius_excavation_licence: "Pozwolenie na wykopaliska"
 concept_lepsius_excavation_licences: "Pozwolenie na wykopaliska"
 concept_lepsius_excavation_licence_desc: "Jeśli nie posiadasz na własność niektórych [Concept('concept_lepsius_excavation_site','$concept_lepsius_excavation_sites$')], nadal możesz uzyskać do nich dostęp za pomocą akcji dyplomatycznej #b Pozwolenie na Wykopaliska#!.\nAby uzyskać #b Pozwolenie na Wykopaliska#!, musisz być co najmniej Wielkim Mocarstwem i posiadać odpowiednio wysoki poziom [concept_interest_tier] w danym regionie.\nZa utrzymanie #b Pozwolenia na Wykopaliska#! będziesz musiał płacić drugiemu krajowi niewielką sumę pieniędzy."
 concept_lepsius_artifact: "Artefakt"
 concept_lepsius_artifacts: "Artefakty"
 concept_lepsius_minor_artifact: "Mniejszy Artefakt"
 concept_lepsius_minor_artifacts: "Mniejsze Artefakty"
 concept_lepsius_oceanic_artifact: "Artefakt Oceanii"
 concept_lepsius_oceanic_artifacts: "Artefakty Oceanii"
 concept_lepsius_artifact_desc: "Możesz zdobywać artefakty, wysyłając [Concept('concept_lepsius_archaeological_team','$concept_lepsius_archaeological_teams$')] na [Concept('concept_lepsius_expedition','$concept_lepsius_expeditions$')], [Concept('concept_lepsius_excavation','$concept_lepsius_excavations$')], [Concept('concept_dubois_pacific_expedition','$concept_dubois_pacific_expeditions$')] lub zdobywając je podczas wydarzeń.\n\nZazwyczaj będziesz zdobywać mniejsze #b Artefakty#!. Możesz wykorzystywać te mniejsze #b Artefakty#! do organizowania [Concept('concept_lepsius_exhibition','$concept_lepsius_exhibitions$')] w swoim [concept_lepsius_museum].\n\n[Concept('concept_lepsius_major_artifact','$concept_lepsius_major_artifacts$')] to natomiast unikatowe #b Artefakty#!, które można znaleźć tylko raz i które mają własne, niepowtarzalne nazwy. Zazwyczaj można je odnaleźć podczas wypraw, wykopalisk oraz jako odkrycia archeologiczne."
 concept_lepsius_major_artifact: "Wielki Artefakt"
 concept_lepsius_major_artifacts: "Wielkie Artefakty"
 concept_lepsius_major_artifact_desc: "#b Wielkie Artefakty#! to wyjątkowe [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')], które posiadają własną nazwę i tożsamość.\nWielkie #b Artefakty#! można zdobyć na różne sposoby. Niektóre z nich znajdziesz podczas [Concept('concept_lepsius_expedition','$concept_lepsius_expeditions$')]. Inne wymagają prowadzenia nieprzerwanych [concept_lepsius_excavation] aż do ich odnalezienia. Jeszcze inne zostaną odkryte podczas Wielkiego Odkrycia.\nNielegalne wywiezienie #b Wielkiego Artefaktu#! z danego kraju może wywołać incydent dyplomatyczny, który przyniesie Ci więcej szkód niż korzyści z posiadania #b Wielkiego Artefaktu#!. Z drugiej strony #b Wielkie Artefakty#! pozwalają organizować [Concept('concept_lepsius_exhibition','$concept_lepsius_excellent_exhibition$')], które zapewniają ogromną premię do prestiżu i są wymagane do wykonania niektórych [Concept('concept_academics_academic_mission','$concept_academics_academic_missions$')]."
 concept_lepsius_exhibition: "Wystawa"
 concept_lepsius_exhibitions: "Wystawy"
 concept_lepsius_excellent_exhibition: "Wspaniała Wystawa"
 concept_lepsius_excavation: "Wykopalisko"
 concept_lepsius_excavations: "Wykopaliska"
 concept_lepsius_excavation_desc: "Jeśli opracowałeś technologię Wczesna Archeologia i ukończyłeś [concept_lepsius_expedition], możesz zdecydować się na pozostawienie [concept_lepsius_archaeological_team] na stanowisku, aby zespół mógł samodzielnie wydobywać [Concept('concept_lepsius_artifact','$concept_lepsius_minor_artifacts$')]. Zawsze możesz odwołać swój zespół z #b Wykopalisk#!."
 concept_verrier_astronomy: "Astronomia"
 concept_verrier_observatory: "Obserwatorium"
 concept_verrier_observatories: "Obserwatoria"
 concept_verrier_astronomer: "#b #ORANGE Astronom #! #!"
 concept_verrier_astronomers: "#b #ORANGE Astronomowie #! #!"
 concept_verrier_astronomical_object: "Objekt Astronomiczny"
 concept_verrier_astronomical_objects: "Objekty Astronomiczne"
 concept_verrier_astronomical_object_icon: "@verrier_astronomicalobject!"
 concept_verrier_celestial_body: "Ciało Niebieskie"
 concept_verrier_celestial_bodies: "Ciała Niebieskie"
 concept_verrier_comet: "Wielka Kometa"
 concept_verrier_comets: "Wielkie Komety"
 concept_verrier_comet_desc: "W epoce wiktoriańskiej pojawiło się kilka #b Wielkich Komet#!, które przyciągnęły powszechną uwagę opinii publicznej. Jeśli posiadasz [concept_verrier_astronomer], istnieje szansa, że jako pierwszy odkryjesz jedną z tych #b Wielkich Komet#!, co zapewni premię do prestiżu i badań."
 concept_verrier_moon_photo: "Zdjęcie Księżyca"
 concept_verrier_moon_photos: "Zdjęcia Księżycowe"
 concept_rapanui_christian_mission: "Misja Chrześcijańska"
 concept_rapanui_christian_missions: "Misje Chrześcijańskie"
 concept_rapanui_christian_mission_desc: "[Concept('concept_major_power','$concept_major_powers$')] lub [Concept('concept_great_power','$concept_great_powers$')] posiadające [Concept('concept_interest','$concept_interests$')] w Oceanii mogą podjąć próbę nawrócenia zdecentralizowanego państwa wyspiarskiego w tym regionie. Jest to jednak możliwe tylko wtedy, gdy Twój kraj nie jest zbyt zsekularyzowany, a grupa interesu „Pobożni” nie jest zbyt słaba.\n\nProces nawracania przebiega w trzech etapach. Wysłany misjonarz może zostać życzliwie przyjęty, zignorowany lub natychmiast zabity. Jeśli misja zakończy się niepowodzeniem, będziesz musiał poczekać kilka lat, zanim pojawi się kolejny misjonarz gotowy szerzyć słowo Boże. Następnie Twój misjonarz będzie nawracał 1% ludności rocznie. Mogą pojawiać się wydarzenia, które ułatwią lub utrudnią nawracanie.\n\nDrugi etap rozpoczyna się po nawróceniu 30% tubylców. Wówczas Twoja Stacja Misyjna stanie się stała. Gdy 51% tubylców wyznaje chrześcijaństwo, wódz przyjmie Twoją religię i odda się pod Twoją ochronę jako [concept_protectorate]. Po upływie kolejnych lat obszary te mogą zostać nawet zaanektowane, jeśli posiadasz technologię pozwalającą zapobiegać malarii.\n\nW trzecim etapie możesz podejmować aktywne działania za pomocą wpisu w Dzienniku. Możesz bezpośrednio wzmocnić misję, wysyłając dodatkowych misjonarzy, albo spróbować handlu. Możesz zdobyć rzadkie [Concept('concept_lepsius_artifact','$concept_lepsius_oceanic_artifacts$')], [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals$')] lub perły, które podnoszą poziom życia bogatych."
 concept_manzoni_literary_tradition: "Tradycja Literacka"
 concept_klimt_painters: "#PURPLE #b Malarze #! #!"
 concept_klimt_painting_tradition: "Tradycja Malarska"
 concept_vikelas_sports: "Sporty"
 concept_vikelas_sports_desc: "#b Sport#! jest jedną z głównych funkcji moda [concept_morgenroete].\n\nPo odkryciu technologii #b Sport Zorganizowany#! kraj uzyskuje dostęp do różnych aktywności sportowych. Najważniejszą z nich jest utworzenie [concept_vikelas_ioc], który rozpocznie organizację [concept_vikelas_olympic_games]. Igrzyska Olimpijskie dają szansę na zdobycie złotych medali, które zapewnią Twojemu krajowi [concept_prestige]."
 concept_vikelas_olympic_games: "Igrzyska Olimpijskie"
 concept_vikelas_olympic_games_desc: "Po założeniu [concept_vikelas_ioc] #b Igrzyska Olimpijskie#! mogą odbywać się co 4 lata. Za każdym razem Komitet będzie głosował nad wyborem #b Gospodarza#!. Kraj-gospodarz otrzyma dużą premię do [concept_prestige].\nPodczas Igrzysk Olimpijskich Twoi Sportowcy będą rywalizować o medale. Na liczbę zdobytych medali wpływa wiele czynników. Ludność ma niewielki wpływ, [concept_sol] ma większy, a niektóre wydarzenia również wpływają na Twoje szanse. Znaczenie mają także wybitni [Concept('concept_general', '$concept_generals$')] oraz wybitni [Concept('concept_admiral', '$concept_admirals$')]. Ponadto postacie z cechą #b Sportowiec#! oraz Centra Miejskie posiadające #b Obiekty Sportowe#! zapewniają niewielkie premie.\nWszystkie te czynniki wpływają na to, ile z 12 Złotych Medali zdobędzie Twój kraj. Każdy Złoty Medal zapewni Ci 5 punktów [concept_prestige]."
 concept_vikelas_ioc: "Międzynarodowy Komitet Olimpijski"
 concept_vikelas_ioc_desc: "Kraj, który opracował technologię #V $vikelas_international_sports_tech$#!, może założyć #b Międzynarodowy Komitet Olimpijski#!, w skrócie #b MKOl#!. Komitet rozpocznie wówczas organizację [concept_vikelas_olympic_games]. Każdy członek MKOl może uczestniczyć w Igrzyskach Olimpijskich.\nNajważniejszymi członkami MKOl są #b Członkowie Zarządu#!. Założyciel MKOl zostaje #b Prezesem#! i zachowuje miejsce w zarządzie na zawsze, podczas gdy pozostali członkowie są wybierani co 4 lata. W zarządzie jest miejsce dla 5 Wielkich Mocarstw, 2 państw europejskich, 2 azjatyckich, 2 amerykańskich, 1 afrykańskiego i 1 oceanicznego.\nGłównym zadaniem Członków Zarządu jest wybór kolejnego Gospodarza Igrzysk. Do wyboru będą 3 kandydatury (lub 4, jeśli jakiś kraj zdecyduje się przekupić zarząd).\nJeśli Grecja założy MKOl, Igrzyska Olimpijskie będą odbywać się wyłącznie w Grecji, co zmniejszy znaczenie zarządu, ponieważ nie będzie on wybierał Gospodarza."
 concept_lepsius_exhibition_desc: "Twoje [concept_lepsius_museum] będzie automatycznie tworzyć Wystawy (w formie [concept_production_method] dla każdego regionu), jeśli posiadasz wystarczającą liczbę [Concept('concept_lepsius_artifact','$concept_lepsius_minor_artifacts$')] tego samego rodzaju. W przypadku zwykłych Artefaktów pierwsza Wystawa zostanie utworzona po zgromadzeniu co najmniej 10 artefaktów. Kolejne poziomy Wystaw wymagają 25 artefaktów (Wystawa Średnia), 50 (Wystawa Duża) i 100 pomniejszych Artefaktów (Wystawa Doskonała). Wystawa Doskonała wymaga dodatkowo jednego [concept_lepsius_major_artifact].\n\nArtefakty Lokalne oferują mniej zróżnicowany zestaw Wystaw, ponieważ dostępne są tylko Wystawa Zwykła i Wystawa Wielka. Wystawa Zwykła wymaga 25 lokalnych Artefaktów, a Wystawa Wielka — 50."
 concept_vikelas_racer: "Rajdowiec"
 concept_vikelas_racers: "Rajdowcy"
 concept_vikelas_racer_desc: "#b Rajdowiec#! to wyjątkowa [concept_character], która bierze udział w [concept_vikelas_car_racing]. Oprócz [concept_vikelas_race_car], kierowca jest najważniejszym czynnikiem decydującym o zwycięstwie w wyścigu samochodowym. Kluczowe znaczenie mają jego indywidualne cechy."
 concept_vikelas_car_racing: "Wyścigi Samochodowe"
 concept_vikelas_car_racing_desc: "Wyścigi samochodowe to dyscyplina sportu, w której [Concept('concept_vikelas_racer','$concept_vikelas_racers$')] rywalizują ze sobą na torach wyścigowych lub zwykłych drogach."
 concept_lepsius_archaeological_exhibition: "Wystawa Archeologiczna"
 concept_elgar_opera_desc: "#b Opera#! jest muzycznym centrum kraju. To tutaj gromadzą się najważniejsi muzycy i występują przed szeroką publicznością.\n#b Opera#! to osobny budynek, który można wznieść w stanach, jeśli Centrum Miejskie osiągnęło co najmniej 5. poziom. #b Opera#! będzie wytwarzać Muzykę i zużywać Instrumenty. Im wyższy poziom #b Opery#!, tym więcej [concept_elgar_musical_tradition] będzie wytwarzane każdego roku.\nPonadto posiadanie #b Opery#! zapewnia dostęp do niektórych decyzji, takich jak odwiedzenie własnej Opery."
 concept_elgar_impressionism_desc: "#b Impresjonizm#! to nurt w historii sztuki, który charakteryzuje się nastrojowym przedstawianiem ulotnych chwil i wrażeń. Wywodzi się z ruchu malarskiego, który narodził się we Francji w drugiej połowie XIX wieku. Termin impresjonizm stosuje się również do określonych nurtów w muzyce, literaturze, filmie i fotografii. Podczas gdy wielu naturalistów, takich jak Heinrich Hart, odrzucało muzykę jako środek wyrazu dla „akcjonizmu poszukującego prawdy”, impresjoniści często czerpali przyjemność z „bezprzedmiotowego wybiegania myślą naprzód” ku subtelnie zróżnicowanym, barwnym akordom.\n\nW grze #b Impresjonizm#! można odblokować wyłącznie za pomocą wpisu w Dzienniku, który wymaga 1000 [concept_elgar_musical_tradition], [concept_elgar_opera], wpływowych właścicieli ziemskich, niewpływowych przemysłowców oraz Inteligencji z poziomem poparcia wynoszącym co najmniej 5. Wybór #b Impresjonizmu#! uniemożliwi odblokowanie dwóch pozostałych gałęzi.\n\nW grze #b Impresjonizm#! koncentruje się na muzyce. Dlatego zapewnia największą premię do [concept_elgar_musical_tradition]."
 concept_elgar_expressionism_desc: "#b Ekspresjonizm#! to nurt w sztuce, którego początki i prekursorskie formy sięgają końca XIX wieku. Podobnie jak impresjonizm, symbolizm i fowizm, ekspresjonizm jest ruchem przeciwstawiającym się tendencjom naturalizmu. W ekspresjonizmie ekspresja przeważa nad poziomem estetycznym, apelatywnym i rzeczowym. Artysta pragnie przedstawić odbiorcy własne doświadczenia. W przeciwieństwie do impresjonizmu muzycznego, który ukazuje sposób postrzegania zewnętrznego wyglądu rzeczy, ekspresjonistyczne nurty artystyczne wyrażają emocje ludzkiej duszy.\n\nW grze #b Ekspresjonizm#! można odblokować wyłącznie za pomocą wpisu w Dzienniku, który wymaga 1000 [concept_elgar_musical_tradition], [concept_elgar_opera], wpływowej Inteligencji lub Związków Zawodowych, niewpływowych właścicieli ziemskich oraz poparcia na poziomie co najmniej 5 ze strony Inteligencji lub Związków Zawodowych. Wybór #b Ekspresjonizmu#! uniemożliwi odblokowanie dwóch pozostałych gałęzi.\n\nW grze #b Ekspresjonizm#! miałby koncentrować się na literaturze, ale ta funkcja nie została jeszcze zaimplementowana."
 concept_elgar_art_nouveau_desc: "#b Secesja#! to styl artystyczny, który rozwinął się z #italic Ruchu Arts and Crafts#! i czerpał inspirację z form występujących w naturze. Często koncentrował się na dynamice i ruchu oraz wykorzystywał nowoczesne materiały.\n\nW grze #b Secesję#! można odblokować wyłącznie za pomocą wpisu w Dzienniku, który wymaga 1000 [concept_elgar_musical_tradition], [concept_elgar_opera], wpływowych przemysłowców oraz Inteligencji z poziomem poparcia wynoszącym co najmniej 5. Wybór #b Secesji#! uniemożliwi odblokowanie dwóch pozostałych gałęzi.\n\n#b Secesja#! i #b Art Déco#!, kolejna technologia w tej gałęzi, koncentrują się na architekturze. Będziesz otrzymywać różne wydarzenia i wpisy w Dzienniku dotyczące osiągnięć architektonicznych, a także zyskasz możliwość zdobycia [concept_gaudi_architectural_splendour]."
 concept_elgar_composer: "#PURPLE #b Kompozytor #! #!"
 concept_elgar_composers: "#PURPLE #b Kompozytorzy #! #!"
 concept_elgar_composer_desc: "#b Kompozytorzy#! to mężczyźni i kobiety, którzy komponują muzykę. Kompozytorzy są specjalnym typem postaci, których można pozyskać podczas wydarzeń, po zgromadzeniu wystarczającej ilości [concept_artistic_progress], aby stworzyć kompozytora w swoim kraju, lub poprzez zaoferowanie stanowiska [concept_elgar_travelling_composer].\nGdy posiadasz już #b Kompozytora#!, możesz zlecić mu [Concept('concept_elgar_composing','$concept_elgar_composing_lower_case$')], [Concept('concept_elgar_conducting','$concept_elgar_conducting_lower_case$')], wysłać go na [Concept('concept_elgar_musical_tour','$concept_elgar_musical_tours$')] lub zlecić mu skomponowanie [Concept('concept_elgar_musical_masterwork','$concept_elgar_musical_masterwork_masterworks$')]. Każde działanie różni się pod względem tego, czym zajmuje się kompozytor, jakie są wymagania i jakie korzyści można uzyskać. Po każdym zadaniu #b Kompozytor#! będzie [Concept('concept_elgar_composer_exhaustion','$concept_elgar_composer_exhaustion_exhausted$')] i będzie musiał odpocząć przez pewien czas, zanim znów będzie mógł pracować.\nW ciągu życia #b Kompozytorzy#! będą zdobywać [concept_artists_experience], a czasami również ją tracić. Im wyższa #b Reputacja#!, tym większe korzyści przynoszą działania #b Kompozytora#!. #b Kompozytorzy#!, którzy osiągną #b Reputację#! na poziomie 500, staną się [Concept('concept_elgar_great_composer','$concept_elgar_great_composers$')], Tytanami Muzyki znanymi na całym świecie."
 concept_elgar_great_composer: "#PURPLE #b Wielki Kompozytor #! #!"
 concept_elgar_great_composers: "#PURPLE #b Wielcy Kompozytorzy #! #!"
 concept_elgar_great_composer_desc: "#b Wielcy Kompozytorzy#! to tytani muzyki. Ich imiona będą znane przez całą wieczność. [Concept('concept_elgar_composer','$concept_elgar_composers$')], którzy osiągną 500 punktów [concept_artists_experience], staną się #b Wielkimi Kompozytorami#!. Znacząco zwiększy to ich wydajność i pozwoli Twojemu krajowi zdobywać znacznie więcej [concept_elgar_musical_tradition]. Na przykład #b Wielki Kompozytor#! może znacznie szybciej stworzyć [concept_elgar_musical_masterwork]."
 concept_elgar_travelling_composer: "Podróżujący kompozytor"
 concept_elgar_travelling_composers: "Podróżujący kompozytor"
 concept_elgar_travelling_composer_desc: "#b Wędrowni Kompozytorzy#! to [Concept('concept_elgar_composer','$concept_elgar_composers$')], którzy nie są zatrudnieni przez żadne państwo. Zamiast tego podróżują po świecie, odbywając trasy koncertowe. Możesz pozyskać #b Wędrownego Kompozytora#!, ale im więcej ma [concept_artists_experience], tym większe będą jego wymagania.\nAby zaprosić #b Wędrownego Kompozytora#!, musisz posiadać co najmniej [Concept('concept_elgar_opera','$concept_elgar_opera_house$')]. #b Kompozytorzy#! o wyższej #b Reputacji#! będą wymagać większych Gmachów Operowych, nowoczesnych [Concept('concept_technology', '$concept_technologies$')] związanych z muzyką oraz określonego poziomu [concept_elgar_musical_tradition]. Niektórzy mogą dołączyć wyłącznie do [Concept('concept_major_power', '$concept_major_power_short$')] lub [Concept('concept_great_power', '$concept_great_powers$')].\nSzczególnym przypadkiem są [Concept('concept_elgar_national_composer','$concept_elgar_national_composers$')], dostępni wyłącznie dla państw o takiej samej lub bardzo zbliżonej tożsamości narodowej."
 concept_elgar_national_composer: "Kompozytor Narodowy"
 concept_elgar_national_composers: "Kompozytor Narodowy"
 concept_elgar_national_composer_desc: "#b Kompozytorzy Narodowi#! to [Concept('concept_elgar_composer','$concept_elgar_composers$')], którzy bardzo cenią swój naród. Nie mogą zostać zatrudnieni przez inne państwa.\nDostępność #b Kompozytora Narodowego#! zależy od [Concept('concept_discrimination_trait', '$concept_cultural_traits$')] jego kultury. Jedna z Twoich kultur podstawowych musi mieć wspólną zarówno niebędącą dziedzictwem #b Cechę#!, jak i [concept_language_trait]. Oznacza to, że północnoniemiecki #b Kompozytor Narodowy#! będzie dostępny zarówno dla państw niemieckich, jak i dla Szwajcarii."
 concept_elgar_composing: "Komponowanie"
 concept_elgar_composing_lower_case: "komponuje"
 concept_elgar_composing_compose: "komponujący "
 concept_elgar_composing_desc: "[concept_elgar_composer], który #b komponuje#!, otrzymuje 5 punktów [concept_artists_experience] rocznie i zapewnia krajowi 5 punktów [concept_elgar_musical_tradition]. Ponadto każdego roku tworzy losową liczbę kompozycji. #b Kompozytor#! posiadający specjalne umiejętności, takie jak Dyrygent, Wirtuoz, Innowacyjny lub Skrupulatny, tworzy jedną dodatkową kompozycję rocznie. Liczba kompozycji ma kluczowe znaczenie dla powodzenia późniejszych [Concept('concept_elgar_musical_tour','$concept_elgar_musical_tour_tours$')]. #b Kompozytor#! komponuje do momentu anulowania tej czynności we wpisie w Dzienniku. #b Kompozytor#! zajmujący się komponowaniem wiąże się dla kraju z niewielkimi rocznymi kosztami utrzymania."
 concept_elgar_conducting: "Dyryguje"
 concept_elgar_conducting_lower_case: "dyryguje"
 concept_elgar_conducting_conduct: "dyrygować "
 concept_elgar_conducting_desc: "[concept_elgar_composer] będzie przez 24 miesiące zajmować się #b dyrygowaniem#! i organizować sezon koncertowy. Zwiększy to produkcję muzyki w losowo wybranej [concept_elgar_opera] na okres od 5 do 10 lat, zapewni Twojemu krajowi niewielki przyrost [concept_elgar_musical_tradition] oraz da #b Kompozytorowi#! umiarkowany przyrost [concept_artists_experience]. Jeśli Twój #b Kompozytor#! nie posiada jeszcze cechy Dyrygenta, może zdobyć [concept_character_trait] pod koniec sezonu. Podczas #b dyrygowania#! będziesz musiał opłacać #b Kompozytora#!."
 concept_elgar_musical_tour: "Trasa Koncertowa"
 concept_elgar_musical_tours: "Trasy Koncertowe"
 concept_elgar_musical_tour_tour: "Trasa"
 concept_elgar_musical_tour_tours: "Trasy"
 concept_elgar_musical_tour_desc: "[concept_elgar_composer] może wyruszyć na zagraniczną #b Trasę Koncertową#! na 30 miesięcy. #b Trasy Koncertowe#! zwiększają [concept_prestige] kraju danego #b Kompozytora#!. Ponadto #b Kompozytor#! otrzymuje premię do [concept_artists_experience] po zakończeniu #b Trasy#!, której wysokość zależy od liczby kompozycji #b Kompozytora#! oraz jego cech.\n#b Kompozytorzy#! posiadający mniej niż 20 kompozycji raczej nie powinni wyruszać na #b Trasy#!, a #b Kompozytorzy#! z cechą #b Powściągliwy#! nie mogą wyruszać na #b Trasy#!."
 concept_elgar_musical_masterwork: "Arcydzieło Muzyczne"
 concept_elgar_musical_masterworks: "Arcydzieła Muzyczne"
 concept_elgar_musical_masterwork_masterwork: "Arcydzieło"
 concept_elgar_musical_masterwork_masterworks: "Arcydzieła"
 concept_elgar_musical_masterwork_of_music: "Arcydzieło Muzyki"
 concept_elgar_musical_masterworks_of_music: "Arcydzieła Muzyki"
 concept_elgar_musical_masterwork_desc: "[concept_elgar_composer] może rozpocząć komponowanie #b Arcydzieła#!, co zajmie kilka lat. Im więcej [concept_artists_experience] ma #b Kompozytor#!, tym szybciej ukończy pracę. Po skomponowaniu #b Arcydzieła#! #b Kompozytor#! otrzyma 50 punktów [concept_artists_experience], a kraj zyska do 150 punktów [concept_elgar_musical_tradition], w zależności od swojej [concept_rank].\n#b Kompozytor#! może stworzyć maksymalnie 3 #b Arcydzieła#! i podczas pracy nad nimi będzie potrzebował wsparcia finansowego swojego kraju."
 concept_elgar_composer_exhaustion: "Wyczerpanie kompozytora"
 concept_elgar_composer_exhaustion_exhausted: "Wyczerpany"
 concept_elgar_composer_exhaustion_desc: "Gdy [concept_elgar_composer] zakończy [Concept('concept_elgar_composing','$concept_elgar_composing_lower_case$')], [Concept('concept_elgar_conducting','$concept_elgar_conducting_lower_case$')], komponowanie [Concept('concept_elgar_musical_masterwork','$concept_elgar_musical_masterwork_masterworks$')] lub [Concept('concept_elgar_musical_tour','$concept_elgar_musical_tours$')], będzie #b wyczerpany#! pracą. #b Wyczerpany Kompozytor#! nie będzie mógł pracować przez pewien czas. Im starszy #b Kompozytor#!, tym więcej czasu zajmie mu pozbycie się #b Wyczerpania#!."
 concept_manzoni_writer: "#PURPLE #b Pisarz #! #!"
 concept_manzoni_writers: "#PURPLE #b Pisarze #! #!"
 concept_klimt_painter: "#PURPLE #b Malarz #! #!"
 concept_pm_artists_academy_conservatory: "#PURPLE #b Konserwatorium #! #!"
 concept_pm_artists_academy_conservatory_desc: "Konserwatorium pozwala wyspecjalizować Akademię Sztuki w dziedzinie muzyki. Jeśli posiadasz Konserwatorium, będziesz mógł promować [Concept('concept_elgar_composer','$concept_elgar_composers$')]. Zmiana tej metody produkcji spowoduje zastosowanie #n ujemnego modyfikatora przepustowości#! dla Akademii Sztuki, a także #n negatywnie wpłynie#! na Twój [concept_artistic_progress]."
 concept_pm_artists_academy_salon: "#PURPLE #b Salon Literacki #! #!"
 concept_pm_artists_academy_salon_desc: "Salon Literacki pozwala wyspecjalizować Akademię Sztuki w dziedzinie literatury. Jeśli posiadasz Salon Literacki, będziesz mógł promować [Concept('concept_manzoni_writer','$concept_manzoni_writers$')]. Zmiana tej metody produkcji spowoduje zastosowanie #n ujemnego modyfikatora przepustowości#! dla Akademii Sztuki, a także #n negatywnie wpłynie#! na Twój [concept_artistic_progress]."
 concept_pm_artists_academy_studio: "#PURPLE #b Pracownia Artystyczna #! #!"
 concept_pm_artists_academy_studio_desc: "Pracownia Artystyczna pozwala wyspecjalizować Akademię Sztuki w dziedzinie malarstwa. Jeśli posiadasz Pracownię Artystyczną, będziesz mógł promować [Concept('concept_klimt_painter','$concept_klimt_painters$')]. Zmiana tej metody produkcji spowoduje zastosowanie #n ujemnego modyfikatora przepustowości#! dla Akademii Sztuki, a także #n negatywnie wpłynie#! na Twój [concept_artistic_progress]."
 concept_pm_artists_academy_specialization: "Specjalizacja Akademii Sztuk Pięknych"
 concept_pm_artists_academy_specialization_desc: "Każdą Akademię Sztuki można wyspecjalizować poprzez zmianę jej metody produkcji.\nAkademia Sztuki z [concept_pm_artists_academy_conservatory] umożliwia promowanie [Concept('concept_elgar_composer','$concept_elgar_composers$')].\nAkademia Sztuki z [concept_pm_artists_academy_salon] umożliwia promowanie [Concept('concept_manzoni_writer','$concept_manzoni_writers$')].\nAkademia Sztuki z [concept_pm_artists_academy_studio] umożliwia promowanie [Concept('concept_klimt_painter','$concept_klimt_painters$')].\nZmiana specjalizacji wywoła #n krótkotrwały negatywny efekt#! dla budynku oraz Twojego [concept_artistic_progress]."
 concept_artists_artist: "Artysta"
 concept_artists_artists: "Artyści"
 concept_artistic_progress: "Postęp Artystyczny"
 concept_artistic_progress_desc: "Po zgromadzeniu 1000 punktów #b Postępu Artystycznego#! możesz pozyskać nowego [concept_artists_artist]. Aby w ogóle uzyskać dostęp do #b Postępu Artystycznego#!, musisz posiadać #b Akademię Sztuki#! lub #b Operę#!.\nNa tempo zdobywania #b Postępu Artystycznego#! wpływa wiele czynników. Przykładowo, im wyższy poziom [concept_literacy], tym szybciej zdobywasz #b Postęp Artystyczny#!. Szczegółowe informacje na temat wszystkich czynników wpływających na Postęp Artystyczny znajdziesz na pasku narzędziowym paska Postępu Artystycznego w Panelu Sztuki."
 concept_artists_experience: "Reputacja"
 concept_artists_experience_desc: "Każdy [concept_artists_artist] ma określoną #b Reputację#!. Reputacja odzwierciedla to, jak ceniony jest dany artysta. Artyści rozpoczynają z niewielką Reputacją i mogą zdobywać kolejne punkty, pracując w swojej dziedzinie. Artyści, którzy osiągną 500 punktów Reputacji, stają się #b Wielkimi Artystami#! i otrzymują odpowiednią [concept_character_trait]."
 concept_manzoni_great_writer: "Wielki Pisarz"
 concept_manzoni_local_writer: "Lokalny Pisarz"
 concept_artists_center_of_arts: "Centrum Sztuki"
 concept_artists_centers_of_arts: "Centrum Sztuki"
 concept_artists_center_of_classicism: "Centrum Klasycyzmu"
 concept_artists_center_of_romanticism: "Centrum Romantyzmu"
 concept_artists_center_of_realism: "Centrum Realizmu"
 concept_artists_center_of_impressionism: "Centrum Impresjonizmu"
 concept_artists_center_of_expressionism: "Centrum Ekspresjonizmu"
 concept_artists_center_of_art_nouveau: "Centrum Secesji"
 concept_klimt_great_painter: "#PURPLE #b Wielki Malarz #! #!"
 concept_klimt_great_painters: "#PURPLE #b Wielcy Malarze #! #!"
 concept_klimt_great_painter_desc: "#b Wielcy Malarze#! to [Concept('concept_klimt_painter','$concept_klimt_painters$')], których imiona będą znane przez całą wieczność. #b Malarze#!, którzy osiągną 500 punktów [concept_artists_experience], staną się #b Wielkimi Malarzami#!. Znacząco zwiększy to ich wydajność i pozwoli Twojemu krajowi zdobywać znacznie więcej [concept_klimt_painting_tradition]."
 concept_klimt_independent_painter: "Niezależny Malarz"
 concept_klimt_independent_painters: "Niezależni Malarze"
 concept_klimt_painter_trip: "Poznanie Ruchu Artystycznego"
 concept_klimt_painter_trip_journeys: "Podróże"
 concept_elgar_music_desc: "#b Kultura Muzyczna#! jest jedną z głównych funkcji moda [concept_morgenroete]. W XIX i XX wieku muzyka odgrywała ważną rolę w zapewnianiu rozrywki ludności oraz ukazywaniu potęgi narodu.\n\nAby uzyskać dostęp do większości zawartości muzycznej w modzie #r Morgenröte#!, musisz zbudować [concept_elgar_opera]. #b Opera#! będzie wytwarzać muzykę, ale do działania potrzebuje instrumentów. Oprócz wytwarzania #b Muzyki #! przeznaczonej dla ludności, #b Opery#! będą stopniowo zwiększać [concept_elgar_musical_tradition] Twojego kraju.\n\n#b Tradycja Muzyczna#! odzwierciedla osiągnięcia i tradycje muzyczne danego narodu. Ilość #b Tradycji Muzycznej#! zapewnia premię do prestiżu i pozwala wybrać kierunek dalszego rozwoju sztuki w Twoim kraju. Możesz obrać jedną z trzech dróg: [concept_elgar_impressionism], [concept_elgar_expressionism] lub [concept_elgar_art_nouveau]. Każdy z tych Stylów Artystycznych ma inny profil.\n\nDobrym sposobem na zdobycie jeszcze większej ilości #b Tradycji Muzycznej#! jest pozyskanie [concept_elgar_composer]. Kompozytor może [Concept('concept_elgar_composing','$concept_elgar_composing_compose$')], [Concept('concept_elgar_conducting','$concept_elgar_conducting_conduct$')], wyruszać na [Concept('concept_elgar_musical_tour','$concept_elgar_musical_tours$')] i tworzyć [Concept('concept_elgar_musical_masterwork','$concept_elgar_musical_masterworks_of_music$')]. Działania te pozwalają zwiększać [concept_artists_experience] #b Kompozytora#! lub rozwijać #b Tradycję Muzyczną#! Twojego kraju."
 concept_artists_center_of_arts_desc: "#b Centrum Sztuki#! to centrum [concept_artists_art_style], które powstaje w [concept_state_region] po wynalezieniu danego #b Stylu Artystycznego#!. Dla każdego #b Stylu Artystycznego#! istnieje tylko jedno #b Centrum Sztuki#!.\n#b Centra Sztuki#! są szczególnie ważne dla [Concept('concept_klimt_painter','$concept_klimt_painters$')], którzy mogą odbywać [concept_klimt_painter_trip], aby studiować tamtejszy #b Styl Artystyczny#!. Ponadto niektóre #b Centra Sztuki#! oferują wyjątkowe wydarzenia, które odbywają się na ich terenie. Niektóre z nich umożliwiają na przykład zdobycie [Concept('concept_klimt_art_prize','$concept_klimt_art_prizes$')]."
 concept_klimt_painting_culture: "Kultura Malarska"
 concept_klimt_painting_culture_desc: "#b Kultura Malarska#! jest jedną z głównych funkcji moda [concept_morgenroete]. W XIX i XX wieku malarstwo rozwijało się bardzo szybko, co doprowadziło do powstania wielu nowych [Concept('concept_artists_art_style','$concept_artists_art_styles$')], które przyczyniły się do znacznego postępu zarówno jednostek, jak i całych krajów.\n\nAby uzyskać dostęp do większości zawartości związanej z malarstwem w modzie #r Morgenröte#!, musisz zbudować #b Akademię Sztuk Pięknych#!. #b Akademie Sztuk Pięknych#! umożliwiają rozpoczęcie zdobywania [concept_klimt_painting_tradition] oraz rekrutowanie nowych [Concept('concept_klimt_painter','$concept_klimt_painters$')].\n\n#b Malarze#! będą tworzyć obrazy i #b Arcydzieła#! dla Twojego kraju, zapewniając mu dużą ilość #b Tradycji Malarskiej#!. Ponieważ #b Malarze#! mogą specjalizować się w różnych [Concept('concept_artists_art_style','$concept_artists_art_styles$')], możesz wysyłać ich na [concept_klimt_painter_trip], aby poznawali dodatkowe #b Style Artystyczne#!. Po ukończeniu 40 lat #b Malarze#! wyspecjalizują się w jednym ze swoich #b Stylów Artystycznych#! i skupią się na tworzeniu obrazów w tym #b Stylu Artystycznym#!."
 concept_artists_art_style: "Styl Artystyczny"
 concept_artists_art_styles: "Style Malarskie"
 concept_artists_art_style_style: "Styl"
 concept_artists_art_style_desc: "#b Styl Artystyczny#! to określony kierunek w sztuce. Niektóre #b Style Artystyczne#! są dostępne od początku gry, takie jak #b Klasycyzm#! i #b Romantyzm#!. Pozostałe, czyli #b Realizm#!, #b Irracjonalizm#!, [concept_elgar_impressionism], [concept_elgar_expressionism] i [concept_elgar_art_nouveau], pojawiają się dopiero później, po spełnieniu określonych warunków. Każdy #b Styl Artystyczny#! ma odpowiadające mu [concept_artists_center_of_arts] w regionie stanu [concept_state_region], w którym się narodził."
 concept_klimt_painter_desc: "#PURPLE #b Malarze#!#! to mężczyźni i kobiety tworzący obrazy oraz inne dzieła sztuki. #b Malarze#! są specjalnym typem postaci, których możesz pozyskać podczas wydarzeń, po zgromadzeniu wystarczającej ilości [concept_artistic_progress], aby stworzyć malarza w swoim kraju, lub poprzez zaoferowanie stanowiska [concept_klimt_independent_painter].\n#b Malarze#! od razu rozpoczynają malowanie i tworzą co roku określoną liczbę obrazów, zależną od ich [Concept('concept_character_trait','$concept_character_traits$')]. Czasami mogą nawet stworzyć #b Arcydzieło#!, które zapewni Ci jeszcze więcej [concept_klimt_painting_tradition].\n#b Malarze#! mogą poznawać różne [Concept('concept_artists_art_style','$concept_artists_art_styles$')] podczas [Concept('concept_klimt_painter_trip','$concept_klimt_painter_trip_journeys$')]. Każdy #b Malarz#! wyspecjalizuje się w jednym #b Stylu Artystycznym#! po ukończeniu 40 lat, co pozwoli mu tworzyć #b Arcydzieła#! w określonym stylu."
 concept_klimt_independent_painter_desc: "[Concept('concept_klimt_painter','$concept_klimt_painters$')], którzy nie są zatrudnieni przez żadne państwo, to #b Niezależni Malarze#!. #b Niezależnych Malarzy#! mogą zatrudniać państwa, których [Concept('concept_primary_cultures','$concept_primary_culture$')] mają wspólną [concept_discrimination_trait] z kulturą danego #b Malarza#!.\n#b Niezależni Malarze#! mają różne wymagania wobec państwa, które chce ich zatrudnić. W zależności od [concept_artists_experience] danego #b Malarza#! potrzebne będą #b Akademie Sztuk Pięknych#!, określone [Concept('concept_technology', '$concept_technologies$')] lub odpowiedni poziom [concept_klimt_painting_tradition]. Ponadto trzeba będzie zapłacić im określoną sumę pieniędzy, zależną zarówno od ich #b Renomy#!, jak i możliwości finansowych Twojego kraju."
 concept_klimt_painter_trip_desc: "[concept_klimt_painter] może poznawać nowe [Concept('concept_artists_art_style','$concept_artists_art_styles$')] podczas #b Podróży Edukacyjnej#! do jednego z [Concept('concept_artists_center_of_arts','$concept_artists_centers_of_arts$')].\nPodczas takiej #b Podróży#! malarz może zdobyć pozytywne i negatywne [Concept('concept_character_trait','$concept_character_traits$')], które wpłyną na jego pracę oraz liczbę tworzonych obrazów. Każde #b Centrum Sztuki#! oferuje nieco inne wydarzenia i zapewni #b Malarzowi#! unikalną #b Cechę#! na zakończenie podróży, która później może stać się specjalizacją #b Malarza#!."
 concept_klimt_art_prize: "Nagroda Artystyczna"
 concept_klimt_art_prizes: "Nagrody Artystyczne"
 concept_klimt_art_prize_desc: "Od czasu do czasu organizowane są konkursy artystyczne, w których przyznaje się nagrody zwiększające renomę artystów. Państwa posiadające [concept_artists_center_of_arts] związane z Irracjonalizmem lub [concept_elgar_impressionism] wybierają najlepszych muzyków w konkursie odbywającym się co pięć lat. Właściciele [concept_klimt_art_gallery] lub #b Centrum Sztuki Realizmu#! organizują konkurs malarski, który również odbywa się co pięć lat. Kraj, z którego pochodzą zwycięzcy, otrzymuje dodatkowo Tradycję Muzyczną lub Tradycję Malarską. Szczególną formą konkursu artystycznego jest Biennale, które co dwa lata przyznaje wszechstronną nagrodę artystyczną krajowi, którego artyści cieszą się najwyższą renomą. Zwiększa to wszystkie wartości tradycji kulturowych."
 concept_klimt_art_gallery: "Galeria Sztuki"
 concept_klimt_art_gallery_desc: "#b Galeria Sztuki#! to specjalny budynek w stolicy kraju, dostępny od momentu odkrycia technologii #b Realizm#!. Można ją wybudować tylko wtedy, gdy kraj posiada [concept_klimt_painter] ze specjalizacją. #b Malarze#! ze specjalizacją odblokowują kolekcję odpowiadającą ich [Concept('concept_artists_art_style','$concept_artists_art_style_style$')] — na przykład artysta specjalizujący się w romantyzmie odblokowuje kolekcję romantyzmu. Aby ulepszyć kolekcję do poziomu doskonałego, potrzebne jest arcydzieło danego rodzaju, które musi zostać namalowane przez malarza lub pozyskane z zagranicy."
 concept_manzoni_writer_novelist: "Powieściopisarz"
 concept_manzoni_writer_desc: "#b Pisarz#! to specjalny typ postaci, który tworzy dzieła literackie dla Twojego kraju. #b Pisarze#! zazwyczaj zaczynają jako [concept_manzoni_local_writer] i piszą #b Publikacje#!, a czasami nawet [Concept('concept_manzoni_bestseller','$concept_manzoni_bestsellers$')]. #b Bestseller#! zapewni #b Pisarzowi#! dużą ilość [concept_artists_experience] oraz zwiększy [concept_manzoni_literary_tradition] Twojego kraju. Każdego roku istnieje szansa na napisanie #b Bestsellera#!, zależna od tego, jak bardzo [concept_manzoni_genre] #b Pisarza#! odpowiada [concept_manzoni_popular_taste].\n\nZnany #b Pisarz#!, którego [concept_interest_group] jest wystarczająco zadowolona, może zostać Twoim [concept_manzoni_national_writer]. #b Pisarz Narodowy#! może uzyskiwać [Concept('concept_manzoni_book_licence','$concept_manzoni_book_licences$')] lub stworzyć Powieść Gazetową. Jeśli #b Pisarz#! osiągnie 500 punktów #b Reputacji#!, może zostać [concept_manzoni_great_writer] i zapewniać Twojemu krajowi jeszcze więcej #b Tradycji Literackiej#!.\n\nUważaj, ponieważ jeśli #b Pisarze#! będą niezadowoleni z sytuacji politycznej w kraju, mogą zdecydować się zostać [Concept('concept_agitator', '$concept_agitators$')] lub ingerować w debatę polityczną."
 concept_manzoni_great_writer_desc: "#b Wielki Pisarz#! to [concept_manzoni_writer] znany na całym świecie. #b Pisarz#! może zostać #b Wielkim Pisarzem#!, gdy jego [concept_artists_experience] osiągnie poziom #V 500#!. Jeśli Twój #b Wielki Pisarz#! jest Twoim [concept_manzoni_national_writer], otrzymasz premię do rocznego przyrostu [concept_manzoni_literary_tradition]."
 concept_manzoni_local_writer_desc: "Prawie każdy [concept_manzoni_writer] rozpoczyna karierę jako #b Pisarz Lokalny#!. Każdy kraj może mieć maksymalnie 3 #b Pisarzy Lokalnych#!, którzy tworzą #b Publikacje#!, zapewniają Ci [concept_manzoni_literary_tradition], jeśli ich [concept_manzoni_genre] odpowiada [concept_manzoni_popular_taste], oraz zdobywają [concept_artists_experience].\n#b Pisarz Lokalny#! z #b Reputacją#! wynoszącą 150, którego [concept_interest_group] nie jest niezadowolona, może zostać [concept_manzoni_national_writer] danego kraju, co zapewni Ci więcej #b Tradycji Literackiej#! oraz inne dodatkowe korzyści.\nPamiętaj, że #b Pisarze Lokalni#! niezadowoleni z aktualnej sytuacji politycznej mogą zacząć ingerować w debatę polityczną, a nawet zostać [concept_agitator]."
 concept_manzoni_national_writer: "Pisarz Narodowy"
 concept_manzoni_national_writer_desc: "#b Pisarz Narodowy#! to typ [concept_manzoni_writer], który jest uważany za twarz literatury Twojego kraju. #b Pisarze Narodowi#! zapewniają od 1 do 5 punktów [concept_manzoni_literary_tradition].\nMożesz pozyskać #b Pisarza Narodowego#!, mianując jednego ze swoich [Concept('concept_manzoni_local_writer','$concept_manzoni_local_writers$')]. Aby mianować jednego ze swoich #b Pisarzy Lokalnych#!, musi on mieć co najmniej #V 150#! punktów [concept_artists_experience], a jego [concept_interest_group] musi mieć dodatni poziom [concept_approval].\n"
 concept_manzoni_bestseller: "Bestseller"
 concept_manzoni_bestsellers: "Bestsellery"
 concept_manzoni_bestseller_desc: "#b Bestseller#! to #b Publikacja#! autorstwa [concept_manzoni_writer], która cieszy się bardzo dużą popularnością, zazwyczaj dlatego, że [concept_manzoni_genre] #b Pisarza#! odpowiada aktualnemu [concept_manzoni_popular_taste] lub jest do niego zbliżony.\nKażdego roku istnieje szansa, że [concept_manzoni_national_writer] lub [concept_manzoni_local_writer] napisze #b Bestseller#!. Pierwszy #b Bestseller#! zapewni dużą ilość [concept_manzoni_literary_tradition], a każdy kolejny #b Bestseller#! zapewni krajowi znaczną ilość #b Tradycji Literackiej#!."
 concept_manzoni_genre: "Gatunek"
 concept_manzoni_genres: "Gatunki literackie"
 concept_manzoni_genre_desc: "Każdy [Concept('concept_manzoni_writer','$concept_manzoni_writer_novelist$')] ma określony #b Gatunek#! swojej twórczości. #b Gatunek#! jest przypisywany w momencie utworzenia #b Pisarza#! i zależy od wielu czynników.\n#b Pisarze#! zdobywają więcej [concept_artists_experience] i piszą więcej [Concept('concept_manzoni_bestseller','$concept_manzoni_bestsellers$')], gdy ich #b Gatunek#! odpowiada [concept_manzoni_popular_taste] danego kraju lub jest do niego zbliżony."
 concept_manzoni_popular_taste: "Popularny gust"
 concept_manzoni_popular_taste_audience: "Gust Publiczności "
 concept_manzoni_popular_tastes_audience: "Gusta Publiczności"
 concept_manzoni_popular_taste_desc: "Ludność każdego kraju ma określony #b Gust#! dotyczący konkretnego [concept_manzoni_genre]. Mniej więcej co 10 lat ten #b Gust#! będzie się zmieniał w zależności od przemian politycznych, społecznych i kulturowych zachodzących w samym kraju.\n[Concept('concept_manzoni_writer','$concept_manzoni_writers$')], których #b Gatunek#! odpowiada temu #b Gustowi#! lub jest do niego zbliżony, będą zdobywać więcej [concept_artists_experience] i pisać więcej [Concept('concept_manzoni_bestseller','$concept_manzoni_bestsellers$')].\n\n#V Zbliżone Gusta:#!\n- #b `$manzoni_taste_adventure_var_loc$`#!: `$manzoni_genre_science_fiction$`, `$manzoni_genre_juvenile$`, `$manzoni_genre_crime_mystery$`\n- #b `$manzoni_taste_crime_var_loc$`#!: `$manzoni_genre_science_fiction$`, `$manzoni_genre_adventure$`, `$manzoni_genre_romance$`\n- #b `$manzoni_taste_devotional_var_loc$`#!: `$manzoni_genre_juvenile$`, `$manzoni_genre_romance$`, `$manzoni_genre_adventure$`\n- #b `$manzoni_taste_juvenile_var_loc$`#!: `$manzoni_genre_adventure$`, `$manzoni_genre_devout$`, `$manzoni_genre_crime_mystery$`\n- #b `$manzoni_taste_literary_var_loc$`#!: `$manzoni_genre_social_critic$`, `$manzoni_genre_science_fiction$`, `$manzoni_genre_romance$`\n- #b `$manzoni_taste_romance_var_loc$`#!: `$manzoni_genre_devout$`, `$manzoni_genre_juvenile$`, `$manzoni_genre_literary_fiction$`\n- #b `$manzoni_taste_science_var_loc$`#!: `$manzoni_genre_adventure$`, `$manzoni_genre_social_critic$`, `$manzoni_genre_literary_fiction$`\n- #b `$manzoni_taste_social_var_loc$`#!: `$manzoni_genre_literary_fiction$`, `$manzoni_genre_juvenile$`, `$manzoni_genre_crime_mystery$`"
 concept_manzoni_book_licence: "Licencja Wydawnicza"
 concept_manzoni_book_licences: "Licencje Wydawnicze"
 concept_manzoni_book_licence_desc: "Zagraniczni wydawcy mogą zawierać umowy z [concept_manzoni_national_writer] i oferować jego książki w tłumaczeniu na swoich rynkach. Dzieje się tak, gdy twórczość pisarza odpowiada [Concept('concept_manzoni_popular_taste','$concept_manzoni_popular_tastes_audience$')] za granicą. Jeśli autor uzyska co najmniej pięć licencji na książki, jego dzieła zostaną uznane za literaturę światową. Będzie mógł wtedy wyruszyć w trasę czytelniczą."
 concept_manzoni_local_writers: "Lokalni pisarze"
 concept_manzoni_library: "Biblioteka Narodowa"
 concept_manzoni_library_desc: "Twoja #b Biblioteka Narodowa#! będzie automatycznie tworzyć Kolekcje Książek (w formie [concept_production_method]), jeśli zgromadzisz wystarczającą liczbę [concept_manzoni_publications]. Pierwsza Kolekcja Książek zostanie utworzona po zgromadzeniu co najmniej 1.000 publikacji. Kolejne poziomy kolekcji wymagają 2.500 publikacji (Bardzo Mała Kolekcja Książek), 5.000 (Mała Kolekcja Książek), 10.000 (Średnia Kolekcja Książek), 25.000 (Duża Kolekcja Książek), 50.000 (Doskonała Kolekcja Książek) i 100.000 (Wielka Kolekcja Książek)."
 concept_manzoni_publications: "Publikacje"
 concept_manzoni_publications_desc: "#b Publikacje#! obejmują wszystkie nowo wydane tytuły książek, gazety, eseje i inne podobne materiały pisemne w danym kraju. Nie należy ich utożsamiać z @manzoni_prints! $manzoni_prints$ krążącymi w obiegu jako towary. Publikacje mogą powstawać również niezależnie od przemysłu wydawniczego, na przykład dzięki własnym drukarniom działającym przy budynkach rządowych lub uniwersytetach. Naukowcy i osoby prywatne również tworzą publikacje, w zależności od poziomu umiejętności czytania i pisania. Jednak największy udział w ich powstawaniu ma przemysł wydawniczy, a decydujące znaczenie ma stosowanie nowoczesnej metody produkcji. Duża liczba publikacji jest niezbędna do rozbudowy [concept_manzoni_library]."
 concept_curtiss_tourism: "Turystyka"
 concept_curtiss_tourism_desc: "Turystyka zapewnia dodatkowe dochody krajowi o wyższym poziomie rozwoju kulturowego. Unikalne pomniki, muzea i galerie sztuki, stanowiska archeologiczne, Centra Sztuki, a także wysokie wartości poszczególnych tradycji kulturowych sprawiają, że kraj staje się atrakcyjnym celem podróży. Prawa zwiększające swobodę przemieszczania się i prowadzenia działalności gospodarczej również przyczyniają się do wzrostu dochodów z turystyki. Infrastruktura odgrywa kluczową rolę — w końcu do odległych miejsc nie da się dotrzeć bez odpowiednich połączeń. Szczególnie lotnisko rewolucjonizuje turystykę i zapewnia znaczny wzrost przychodów."
 concept_curtiss_private_airline: "Prywatna linia lotnicza"
 concept_mendelejew_chemist: "#b #ORANGE Chemik #! #!"
 concept_manzoni_literature: "Kultura Literacka"
 concept_manzoni_literature_desc: "#b Kultura Literacka#! jest jedną z głównych funkcji moda [concept_morgenroete]. Kultura druku, a w szczególności prasy, przeszła znaczące przemiany w XIX i XX wieku. Masowa produkcja materiałów drukowanych i ich codzienne wykorzystanie są odzwierciedlone przez przemysł poligraficzny. Wartość kulturowa powstającej literatury znajduje odzwierciedlenie w [concept_manzoni_literary_tradition]. Ta ostatnia zależy w dużej mierze od [Concept('concept_manzoni_writer','$concept_manzoni_writers$')] danego kraju. Występują [Concept('concept_manzoni_local_writer','$concept_manzoni_national_writers$')] oraz [Concept('concept_manzoni_national_writer','$concept_manzoni_local_writers$')]. To, czy pozostaną w cieniu, czy staną się cenionymi autorami, zależy od [concept_manzoni_popular_taste]."
 concept_morgenroete_desc: "#r Morgenröte – Dawn of Flavor #! to modyfikacja stworzona w celu poszerzenia kulturowych i naukowych aspektów gry Victoria 3. Zawiera treści dotyczące różnych dziedzin epoki wiktoriańskiej:\n\n#V Nauka:#!\n #indent_newline:3 • Tesla: [concept_tesla_engineering]#!\n #indent_newline:3 • Mendelejew: [concept_mendelejew_chemistry]#!\n #indent_newline:3 • Verrier: [concept_verrier_astronomy]#!\n #indent_newline:3 • Agassiz: [concept_agassiz_geology]#!\n #indent_newline:3 • Dubois: [Concept('concept_dubois_natural_history','$concept_dubois_natural_history_paleontology$')]#!\n #indent_newline:3 • Ito: [concept_dubois_natural_history]#!\n #indent_newline:3 • Theiler: [concept_theiler_biology]#!\n #indent_newline:3 • Panum: [concept_panum_medicine]#!\n #indent_newline:3 • Lepsius: [concept_lepsius_archaeology]#!\n #indent_newline:3 • Andersson: [concept_andersson_anthropology]#!\n\n#V Sztuka:#!\n#indent_newline:3 • Gaudí: [concept_elgar_architecture]#!\n#indent_newline:3 • Elgar: [concept_elgar_music]#!\n#indent_newline:3 • Manzoni: [concept_manzoni_literature]#!\n#indent_newline:3 • Klimt: [concept_klimt_painting_culture]#!\n\n#V Sport:#!\n#indent_newline:3 • Douglas: [concept_douglas_mountaineering]#!\n#indent_newline:3 • Vikelas: [concept_vikelas_sports] i [concept_vikelas_car_racing]#!\n#indent_newline:3 • Curtiss: [concept_curtiss_aviation]#!"
 concept_agassiz_mineral: "Minerał"
 concept_agassiz_minerals: "Minerały"
 concept_agassiz_mineral_desc: "Minerały to różne rodzaje szczególnych skał, które nie zaliczają się do znanych surowców wykorzystywanych w przemyśle. Kraj otrzymuje określoną liczbę minerałów rocznie po opracowaniu technologii #b Geologia#!. Jeśli w służbie tego kraju znajduje się [Concept('concept_agassiz_geologist','$concept_agassiz_geologists$')], może on odnaleźć dodatkowe minerały. Występowanie minerałów zależy od modyfikatorów stanów: gór, pustyń, obszarów arktycznych, złóż surowców (na przykład węgla, żelaza i siarki), a także geologicznych [Concept('concept_dubois_formation','$concept_dubois_formations$')] oraz wulkanów. Pustynie i obszary arktyczne uznaje się za ubogie w minerały, natomiast wielkie formacje geologiczne i wulkany są szczególnie bogate w minerały. Cenniejszą odmianą minerałów są [Concept('concept_agassiz_rare_mineral','$concept_agassiz_rare_minerals$')]."
 concept_agassiz_rare_mineral: "Rzadki Minerał"
 concept_agassiz_rare_minerals: "Rzadkie Minerały"
 concept_agassiz_rare_mineral_desc: "[Concept('concept_agassiz_geologist','$concept_agassiz_geologists$')] mogą odnajdywać Rzadkie Minerały podczas swoich wypraw, takich jak [Concept('concept_dubois_pacific_expedition','$concept_dubois_pacific_expeditions$')], wyprawy związane z [concept_douglas_mountaineering], wyprawy do [concept_agassiz_volcano] lub podczas poszukiwania minerałów. W przeciwieństwie do zwykłych [Concept('concept_agassiz_mineral','$concept_agassiz_minerals$')], występują one w bardzo ograniczonych ilościach. Rzadkie Minerały służą do budowy Gabinetu Mineralogicznego."
 concept_agassiz_geologist: "#b #GREEN Geolog #! #!"
 concept_agassiz_geologists: "#b #GREEN Geologowie #! #!"
 concept_agassiz_geologist_desc: "#b #GREEN Geolodzy#!#! to [Concept('concept_academics_academic','$concept_academics_academics$')], którzy zajmują się przede wszystkim badaniem skał i historii Ziemi. Lokalizują złoża [Concept('concept_dubois_formation','$concept_dubois_formations$')] oraz [Concept('concept_curie_uranium','$concept_curie_uranium$')], dzięki czemu są niezastąpionymi współpracownikami [Concept('concept_dubois_paleontologist','$concept_dubois_paleontologists$')] i [Concept('concept_curie_physicist','$concept_curie_physicists$')]. Podczas swoich wypraw mogą odnaleźć dodatkowe [Concept('concept_agassiz_mineral','$concept_agassiz_minerals$')], które [concept_mendelejew_chemist] może wykorzystać do odkrywania lub izolowania [Concept('concept_mendelejew_element','$concept_mendelejew_elements$')]. Mogą również odkrywać nowe złoża surowców. Zajmują się także wulkanologią i mogą wyruszać na wyprawy do lokalnych [Concept('concept_agassiz_volcano','$concept_agassiz_volcanoes$')], aby dokładniej je badać. Wspólnie z [Concept('concept_tesla_engineer','$concept_tesla_engineers$')] mogą opracowywać nowe urządzenia, takie jak sejsmografy, które pozwalają lepiej poznać wnętrze Ziemi. Geolodzy mogą uczestniczyć w wyprawach [Concept('concept_dubois_pacific_expedition','$concept_dubois_pacific_expeditions$')] oraz [concept_douglas_mountaineering]."
 concept_agassiz_volcano: "Wulkan"
 concept_agassiz_volcanoes: "Wulkany"
 concept_curie_physicist: "#b #ORANGE Fizyk#!#!"
 concept_curie_physicists: "#b #ORANGE Fizycy#!#!"
 concept_curie_physicist_desc: "#n Wkrótce w Morgenröte! #!"
 concept_curie_uranium: "Uran"
 concept_curie_uranium_desc: "Uran jest niezwykle rzadkim surowcem, który [Concept('concept_agassiz_geologist','$concept_agassiz_geologists$')] mogą znaleźć jedynie w kilku wybranych, historycznych prowincjach. Wymaga to wcześniejszego opracowania technologii Fizyki Współczesnej. Na pierwszy rzut oka uran jest surowcem wtórnym, wykorzystywanym wyłącznie w produkcji ceramiki. Jednak z czasem staje się niezbędny, szczególnie w [concept_verrier_observatory]. Dopiero gdy najlepsze metody produkcji związane z fizyką i chemią zostaną zaopatrzone w uran, będą mogły spełniać swoje zadania, zarówno w dziedzinie fizyki jądrowej, jak i badań nad nieznanymi dotąd pierwiastkami. Bez uranu wszelka działalność naukowa w dziedzinie promieniotwórczości jest po prostu niemożliwa. Dlatego pod koniec rozgrywki w Victoria 3 uran staje się szczególnie istotny dla [Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists$')] oraz [Concept('concept_curie_physicist','$concept_curie_physicists$')]."
 concept_mendelejew_chemistry: "Chemia"
 concept_mendelejew_chemistry_desc: "#b Chemia#! jest jedną z głównych funkcji moda [concept_morgenroete]. Począwszy od XVIII wieku, #b Chemia#! szybko rozwijała się jako nowoczesna dziedzina nauki. Nagle odkryto wiele nowych pierwiastków i wynaleziono nowe procesy chemiczne. W XIX i XX wieku dokonano jeszcze więcej odkryć w dziedzinie Chemii, od nowych pierwiastków po wynalezienie dynamitu i opracowanie procesu Habera-Boscha.\n\nW modzie #b Morgenröte#! #b Chemią#! zajmują się [Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists$')], którzy mogą koncentrować się na różnych zadaniach.\nJednym z nich jest ulepszanie Twoich krajowych zakładów: #b $building_chemical_plant$#!, #b $building_explosives_factory$#! lub #b $building_synthetics_plant$#!, co zwiększy wydajność tych [Concept('concept_building', '$concept_buildings$')].\nJeśli zależy Ci na bardziej prestiżowym zadaniu, możesz zlecić #b Chemikowi#! teoretyzowanie na temat, odkrywanie lub izolowanie [Concept('concept_mendelejew_element','$concept_mendelejew_elements$')]. Każdy pierwiastek zapewni niewielką ilość [concept_prestige], zależnie od tego, czy został poddany teoretyzowaniu, odkryty, czy wyizolowany.\nW dalszej części gry #b Chemik#! będzie mógł również wynaleźć #b Olej Syntetyczny#! i #b Kauczuk Syntetyczny#!. Odblokuje to #b $building_mendelejew_hydrogenation_plants$#! lub #b $building_mendelejew_synthetic_rubber_factory$#!."
 concept_mendelejew_chemists: "#b #ORANGE Chemicy #! #!"
 concept_mendelejew_chemist_desc: "#b #ORANGE Chemicy#!#! to [Concept('concept_academics_academic','$concept_academics_academics$')], którzy teoretyzują na temat, odkrywają i izolują [Concept('concept_mendelejew_element','$concept_mendelejew_elements$')].\n#b #ORANGE Chemicy#!#! zdobywają [concept_academics_experience], badając #b Pierwiastki#! lub uczestnicząc w Kongresach. Mogą również udoskonalać nawozy, materiały wybuchowe i substancje syntetyczne. Chemicy mogą opracować układ okresowy pierwiastków lub wynaleźć paliwo syntetyczne, dzięki czemu są cenni dla krajów bez dostępu do złóż ropy naftowej. Co roku zdobywają również #b Doświadczenie#! pasywnie. Pozwala to #b #ORANGE Chemikom#!#! uzyskiwać lepsze cechy chemika. Mogą również otrzymać specjalizację (teoretyk, analityk lub inspektor) w chwili utworzenia albo w wyniku wydarzenia."
 concept_mendelejew_element: "Pierwiastek Chemiczny"
 concept_mendelejew_element_no_chemical: "Pierwiastek"
 concept_mendelejew_elements: "Pierwiastki Chemiczne"
 concept_mendelejew_element_desc: "W starożytności powszechnie wierzono, że świat składa się z czterech żywiołów: ognia, ziemi, wody i powietrza. Wraz z początkiem uniezależniania się chemii od alchemii rozpoczęła się naukowa analiza pierwiastków chemicznych. Proces ten był daleki od zakończenia w XIX wieku.\n\n[Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists$')] mogą kontynuować te badania, teoretyzując na temat pierwiastków, odkrywając je i izolując je pojedynczo. Dopiero po wyizolowaniu pierwiastek zostaje w pełni uznany i otrzymuje nazwę; wcześniej jest jedynie numerem. Klasyfikacja pierwiastków przyczynia się do postępu naukowego i zapewnia chemikom [concept_academics_experience].\nNie wszystkie pierwiastki można od początku poddawać teoretyzowaniu, odkrywać i izolować.\n Warunkiem jest odpowiednie wyposażenie laboratorium chemicznego w [concept_verrier_observatory], a w niektórych przypadkach również posiadanie Instytutu Fizyki Współczesnej. Wiele pierwiastków można właściwie zbadać dopiero przy użyciu spektrografii; pod koniec gry może być konieczny cyklotron. [Concept('concept_agassiz_mineral','$concept_agassiz_minerals$')] są niezbędne do odkrywania i izolowania pierwiastków chemicznych. Oprócz metod produkcji doświadczenie i cechy charakteru chemika mają decydujący wpływ na czas trwania badań.\n\nZbadane pierwiastki są niezbędne do opracowania układu okresowego oraz zorganizowania Kongresu Chemicznego."
 concept_verrier_meteorite: "Meteoryt"
 concept_verrier_meteorites: "Meteoryty"
 concept_manzoni_national_writers: "Pisarze Narodowi"
 concept_verrier_astronomy_desc: "#b Astronomia#! jest jedną z głównych funkcji moda [concept_morgenroete].\n\nAby uzyskać dostęp do #b Astronomii#!, potrzebujesz [concept_verrier_observatory] lub [concept_verrier_astronomer].\n\nGdy posiadasz Obserwatorium, będziesz pasywnie odkrywać [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects$')].\n\nJeśli posiadasz [concept_verrier_astronomer], będziesz mógł również odkrywać nowe planety, [Concept('concept_verrier_satellite','$concept_verrier_satellites$')], [Concept('concept_verrier_comet','$concept_verrier_comets$')] oraz wykonywać [Concept('concept_verrier_moon_photo','$concept_verrier_moon_photos$')].\nCzasami Twój [concept_agassiz_geologist] może również odnaleźć [Concept('concept_verrier_meteorite','$concept_verrier_meteorites$')], które mogą zostać zbadane przez #b Astronomów#! i [Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists$')].\n\nKażde odkrycie astronomiczne zapewni Ci [concept_verrier_astronomical_prestige], które zostanie dodane do Twojego [concept_prestige]. Sprawdź modyfikator [concept_modifier] $verrier_astronomical_prestige_modifier$, aby zobaczyć swoją #b Prestiż Astronomiczny#!."
 concept_verrier_observatory_desc: "#b Obserwatorium#! stanowi podstawę rozwoju [concept_verrier_astronomy] i [concept_mendelejew_chemistry] w kraju. To właśnie tam [Concept('concept_verrier_astronomer','$concept_verrier_astronomers$')] mogą odkrywać planety, [Concept('concept_verrier_satellite','$concept_verrier_satellites$')], [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects$')], [Concept('concept_verrier_comet','$concept_verrier_comets$')] oraz wykonywać [Concept('concept_verrier_moon_photo','$concept_verrier_moon_photos$')].\nAby zbudować #b Obserwatorium#!, musisz posiadać Uniwersytet oraz mieć opracowaną technologię `$verrier_astronomy_tech$` lub `$verrier_chemistry_tech$` [concept_technology]. Ponadto #b Obserwatorium#! można zbudować tylko raz i wyłącznie w stolicy kraju."
 concept_verrier_astronomer_desc: "#b Astronomowie#! to Uczeni, którzy badają niebo i odkrywają [Concept('concept_verrier_satellite','$concept_verrier_satellites$')], [Concept('concept_verrier_comet','$concept_verrier_comets$')] oraz [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects$')].\n#b Astronomowie#! zdobywają [concept_academics_experience], odkrywając #b Obiekty Astronomiczne#! lub uczestnicząc w Konferencjach. Co roku otrzymują również #b Doświadczenie#! pasywnie. Dzięki temu #b Astronomowie#! mogą uzyskiwać lepsze cechy astronomów.\n\n#b Astronom#! może skupić się na odkrywaniu nowych #b Satelitów#! lub #b Fotografowaniu Księżyca#!. Ograniczy to jednak liczbę odkrywanych #b Obiektów Astronomicznych#!."
 concept_verrier_astronomical_prestige: "Prestiż Astronomiczny"
 concept_verrier_astronomical_prestige_desc: "#b Prestiż Astronomiczny#! to ilość [concept_prestige] zdobywana dzięki astronomii. Na #b Prestiż Astronomiczny#! wpływa wiele czynników:\n- Odkrycie nowej planety zapewni Ci od #V 15#! do #V 100#! punktów prestiżu, w zależności od trudności jej odnalezienia.\n- Każdy odkryty [concept_verrier_satellite] zapewni Ci 10 punktów prestiżu.\n- Ukończona [Concept('concept_verrier_moon_photo','$concept_verrier_moon_map$')] zapewni Ci #V 25#! punktów prestiżu.\n- Wielka Kometa zapewni Ci 10 punktów prestiżu.\n- Każdy [concept_verrier_meteorite] zapewni Ci #V 1#! punkt prestiżu.\n- Każde #V 100#! [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects$')] zapewni Ci #V 1#! punkt prestiżu."
 concept_verrier_astronomical_object_desc: "#b Obiekty Astronomiczne#! to asteroidy i gwiazdy, które zostały przez Ciebie odkryte. Można je odkrywać, jeśli posiadasz [concept_verrier_observatory]. Im bardziej zaawansowana jest Twoja technologia astronomiczna, tym więcej obiektów znajdziesz. Odkryjesz również więcej #b Obiektów#!, jeśli posiadasz [concept_verrier_astronomer].\nMając wystarczającą liczbę #b Obiektów Astronomicznych#!, będziesz mógł odkrywać nowe planety lub technologię Astrofizyki."
 concept_verrier_moon_map: "Mapa Księżyca"
 concept_verrier_moon_photo_desc: "Jeśli posiadasz [concept_verrier_observatory] i opracowałeś technologię Aparat Fotograficzny, będziesz mógł zlecić swojemu [concept_verrier_astronomer] rozpoczęcie fotografowania Księżyca. Ograniczy to liczbę [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects$')] odkrywanych przez Twojego #b Astronoma#!, ale każdego roku będziesz otrzymywać #b Zdjęcia Księżyca#!.\nJeśli zgromadzisz wystarczającą liczbę #b Zdjęć Księżyca#!, stworzysz dokładną mapę naturalnego satelity Ziemi. Ukończenie Mapy Księżyca zapewni Twojemu krajowi [concept_verrier_astronomical_prestige]."
 concept_verrier_satellite: "Satelita"
 concept_verrier_satellites: "Satelity"
 concept_verrier_satellite_desc: "#b Satelity#! lub księżyce to [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects$')], które krążą wokół planety. Niektóre #b Satelity#!, takie jak Księżyc Ziemi, zostały już odkryte, ale [concept_verrier_astronomer] może spróbować odnaleźć kolejne.\nKażdy #b Satelita#! odkryty przez Twój kraj zapewni mu niewielką ilość [concept_verrier_astronomical_prestige]."
 concept_verrier_meteorite_desc: "Meteoryty to stosunkowo niewielkie ciała stałe pochodzenia kosmicznego, które przeszły przez atmosferę Ziemi i dotarły do jej powierzchni. W rzadkich przypadkach fragmenty meteorytów można odnaleźć po deszczu meteorów. Meteoryty, które spadły na Ziemię tysiące lat temu, mogą być również odnajdywane przez [Concept('concept_agassiz_geologist','$concept_agassiz_geologists$')] w trudno dostępnych terenach, takich jak pustynie i obszary arktyczne. Szczególnie zainteresowani meteorytami są [Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists$')] oraz [Concept('concept_verrier_astronomer','$concept_verrier_astronomers$')], którzy mogą chcieć poddać je analizie.\n\nPonadto #b Meteoryty#! pomagają zwiększyć [concept_agassiz_geological_score] i umożliwiają dokładniejsze oszacowanie [concept_agassiz_age_of_earth]."
 concept_agassiz_volcano_desc: "#b Wulkany#! to nowa cecha stanu w modzie #r Morgenröte#!. W przeciwieństwie do podstawowej wersji gry Victoria 3, o tym, czy dojdzie do erupcji wulkanu, decydują nie regiony strategiczne, lecz stany, na których terenie znajdują się wulkany. Aktywność wulkaniczna jest znacznie większa, ale nie zawsze prowadzi do zniszczeń. W krajach posiadających wulkany można wybudować #b `$building_agassiz_volcano_observatory$`#!, który nie tylko pomaga przewidywać erupcje i ograniczać ich skutki dzięki obserwacjom, ale jest również punktem wyjścia do wyprawy wulkanologicznej. Podczas wyprawy na wulkan [Concept('concept_agassiz_geologist','$concept_agassiz_geologists$')] mogą zdobywać nową [concept_agassiz_geological_knowledge], [Concept('concept_agassiz_rare_mineral','$concept_agassiz_rare_minerals$')], doświadczenie oraz cechę wulkanologa."
 concept_agassiz_geological_knowledge: "Wiedza Geologiczna"
 concept_agassiz_geological_knowledge_desc: "#b Wiedza Geologiczna#! obejmuje ogólną wiedzę danego kraju na temat natury Ziemi. Jest to bardzo rzadki zasób, który można zdobyć przede wszystkim podczas osiągania kamieni milowych w dziedzinie geologii. #b Wiedza Geologiczna#! nie jest tym samym co [concept_agassiz_geological_score], ale stanowi jego najważniejszy składnik i jest uznawana za szczególnie cenną."
 concept_agassiz_geological_score: "Punktacja Geologiczna"
 concept_agassiz_geological_score_desc: "#b Punktacja Geologiczna#! obejmuje wszystkie osiągnięcia i zasoby wiedzy danego kraju związane z geologią. Najważniejszym jej składnikiem jest [concept_agassiz_geological_knowledge], ale istnieje również wiele innych istotnych czynników, takich jak doświadczenie [concept_agassiz_geologist], [concept_agassiz_oceanographic_knowledge], liczba posiadanych [Concept('concept_agassiz_mineral','$concept_agassiz_minerals$')], [Concept('concept_dubois_fossil','$concept_dubois_fossils$')] lub [Concept('concept_dubois_specimen','$concept_dubois_specimens$')], a także technologie geologiczne. Punktacja Geologiczna ma kluczowe znaczenie przy ponownym ustalaniu [concept_agassiz_age_of_earth]."
 concept_agassiz_oceanographic_knowledge: "Wiedza Oceanograficzna"
 concept_agassiz_oceanographic_knowledge_desc: "#b Wiedza Oceanograficzna#! stanowi część [concept_agassiz_geological_knowledge] i obejmuje wiedzę o morzach, w szczególności o prądach oceanicznych, a także ogólne badania morskie połączone z rozważaniami geofizycznymi. #b Wiedzę Oceanograficzną#! zdobywa się głównie podczas [Concept('concept_dubois_pacific_expedition','$concept_dubois_pacific_expeditions$')]. Do zdobycia [concept_agassiz_geological_knowledge] potrzeba 50 punktów #b Wiedzy Oceanograficznej#!."
 concept_agassiz_age_of_earth: "Wiek Ziemi"
 concept_agassiz_age_of_earth_desc: "Jednym z wielkich pytań XIX wieku była kwestia #b Wieku Ziemi#!. Miała ona istotne znaczenie dla historii naturalnej, szczególnie w kontekście wiarygodności teorii ewolucji i kolejności wydarzeń geologicznych. Tylko [concept_agassiz_geologist] może ustalić nowy wiek Ziemi. Aby tego dokonać, jego kraj musi mieć wyższy [concept_agassiz_geological_score] niż kraj, który jako ostatni określił wiek Ziemi. Następnie podzieli się wynikami swoich badań z innymi uczonymi. Nie oznacza to jednak, że musi odnieść sukces — geolodzy, którzy są zbyt młodzi i niedoświadczeni, nie zostaną wysłuchani. Jednak zagraniczne kraje są nieco bardziej przychylne, gdy od wielu lat nie przedstawiono żadnej nowej teorii. Geolodzy mogą oszacować wiek Ziemi tylko raz w życiu, ale ograniczenie to dotyczy wyłącznie tych, którym się powiedzie. W przypadku porażki można spróbować ponownie po okresie motywacji."
 concept_agassiz_geology: "Geologia"
 concept_agassiz_geology_desc: "#b Geologia#! jest jedną z głównych funkcji moda [concept_morgenroete]. Jeszcze przed początkiem epoki wiktoriańskiej geologia przeżywała znaczący rozkwit, dlatego na początku gry jest dostępna dla wielu krajów.\n\n[Concept('concept_agassiz_geologist','$concept_agassiz_geologists$')] można wykorzystywać na wiele sposobów: mogą odnajdywać [Concept('concept_dubois_formation','$concept_dubois_formations$')], [Concept('concept_andersson_cave','$concept_andersson_caves$')] oraz złoża [concept_curie_uranium] podczas poszukiwań geologicznych, brać udział w wyprawach na [concept_agassiz_volcano], określać [concept_agassiz_age_of_earth], odkrywać nowe złoża rud i ropy naftowej, a także uczestniczyć w wyprawach [concept_dubois_pacific_expedition] i [concept_douglas_mountaineering] jako przydatni towarzysze naukowi. [concept_agassiz_geological_score] określa ogólny poziom wiedzy danego kraju i ma kluczowe znaczenie przy ustalaniu wieku Ziemi. [Concept('concept_agassiz_mineral','$concept_agassiz_minerals$')] oraz [Concept('concept_agassiz_rare_mineral','$concept_agassiz_rare_minerals$')] stanowią nieodłączną część geologii. Te drugie można wykorzystać do utworzenia gabinetu mineralogicznego w [concept_dubois_zoo]. Specjalnym obiektem geologicznym jest #b $building_agassiz_volcano_observatory$#!, w którym prowadzi się badania wulkanologiczne i sejsmiczne."
 concept_theiler_biologist: "#b #GREEN Biolog #! #!"
 concept_theiler_biologists: "#b #GREEN Biolodzy #! #!"
 concept_theiler_biologist_desc: "Biolog to [concept_academics_academic], który bada wszystkie aspekty życia.\nW modzie [concept_morgenroete] biolog zajmuje się przede wszystkim badaniem [Concept('concept_theiler_microorganism','$concept_theiler_microorganisms$')], ulepszaniem rolnictwa, zwalczaniem [Concept('concept_theiler_pest','$concept_theiler_pests$')] oraz odkrywaniem [Concept('concept_theiler_pathogen','$concept_theiler_pathogens$')] i [Concept('concept_theiler_vaccine','$concept_theiler_vaccines$')].\nBiolodzy zdobywają [concept_academics_experience] pasywnie lub poprzez ukończenie projektów."
 concept_gaudi_architect: "#b #PURPLE Architekt #! #!"
 concept_gaudi_architects: "#b #PURPLE Architekci #! #!"
 concept_academics_university_specialization_desc: "Każdy Uniwersytet można wyspecjalizować poprzez zmianę jego metody produkcji.\nUniwersytet z [concept_pm_academics_university_humanities] pozwala ukierunkować badania krajowe na innowacje społeczne oraz umożliwia rekrutowanie [Concept('concept_panum_physician','$concept_panum_physicians$')], [Concept('concept_lepsius_archaeologist','$concept_lepsius_archaeologists$')] i [Concept('concept_andersson_anthropologist','$concept_andersson_anthropologists$')].\nUniwersytet z [concept_pm_academics_university_natural_history] pozwala ukierunkować badania krajowe na innowacje społeczne oraz umożliwia rekrutowanie [Concept('concept_agassiz_geologist','$concept_agassiz_geologists$')], [Concept('concept_dubois_paleontologist','$concept_dubois_paleontologists$')], [Concept('concept_dubois_naturalist','$concept_dubois_naturalists$')] i [Concept('concept_theiler_biologist','$concept_theiler_biologists$')].\nUniwersytet z [concept_pm_academics_university_mathematics] pozwala ukierunkować badania krajowe na innowacje w dziedzinie produkcji i wojskowości oraz umożliwia rekrutowanie [Concept('concept_tesla_engineer','$concept_tesla_engineers$')], [Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists$')] i [Concept('concept_verrier_astronomer','$concept_verrier_astronomers$')].\nZmiana specjalizacji prowadzi do wystąpienia [concept_academics_academic_confusion], która wywołuje #n krótkotrwały negatywny efekt#! dla budynku oraz Twojego [concept_academics_progress].\nWyspecjalizowane Uniwersytety mogą również wpływać na przebieg różnych projektów. Przykładowo, Uniwersytety z profilem `$concept_pm_academics_university_mathematics$` wspierają projekty inżynieryjne."
 concept_pm_academics_university_humanities_desc: "Profil Humanistyczno-Antropologiczny pozwala wyspecjalizować Uniwersytet, ukierunkować badania krajowe na badania społeczne oraz umożliwia rekrutowanie [Concept('concept_lepsius_archaeologist','$concept_lepsius_archaeologists$')] i [Concept('concept_andersson_anthropologist','$concept_andersson_anthropologists$')]. Zmiana tej metody produkcji spowoduje zastosowanie #n ujemnego modyfikatora przepustowości#! dla Uniwersytetu, a także #n negatywnie wpłynie#! na Twój [concept_academics_progress].\nSpecjalizacja Uniwersytetów w ramach Profilu Humanistyczno-Antropologicznego zwiększy szanse powodzenia Wypraw (maksymalnie o +4 przy 40 poziomach specjalizacji) oraz przyspieszy postępy w niektórych innych projektach."
 concept_pm_academics_university_natural_history_desc: "Profil Historii Naturalnej pozwala wyspecjalizować Uniwersytet, ukierunkować badania krajowe na badania społeczne oraz umożliwia rekrutowanie [Concept('concept_agassiz_geologist','$concept_agassiz_geologists$')], [Concept('concept_dubois_paleontologist','$concept_dubois_paleontologists$')], [Concept('concept_dubois_naturalist','$concept_dubois_naturalists$')] i [Concept('concept_theiler_biologist','$concept_theiler_biologists$')]. Zmiana tej metody produkcji spowoduje zastosowanie #n ujemnego modyfikatora przepustowości#! dla Uniwersytetu, a także #n negatywnie wpłynie#! na Twój [concept_academics_progress].\nSpecjalizacja Uniwersytetów w ramach Profilu Historii Naturalnej zapewni premie do różnych projektów realizowanych przez naukowców przyrodniczych."
 concept_pm_academics_university_mathematics_desc: "Profil Matematyczno-Techniczny pozwala wyspecjalizować Uniwersytet i ukierunkować badania krajowe na produkcję oraz badania wojskowe, a także umożliwia rekrutowanie [Concept('concept_tesla_engineer','$concept_tesla_engineers$')] lub [Concept('concept_verrier_astronomer','$concept_verrier_astronomers$')]. Zmiana tej metody produkcji spowoduje zastosowanie #n ujemnego modyfikatora przepustowości#! dla Uniwersytetu, a także #n negatywnie wpłynie#! na Twój [concept_academics_progress].\nSpecjalizacja Uniwersytetów w ramach Profilu Matematyczno-Technicznego zapewni premie do różnych projektów realizowanych przez [Concept('concept_tesla_engineer','$concept_tesla_engineers$')] oraz [Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists$')]."
 concept_panum_physician: "#b #BLUE Lekarz#!#!"
 concept_panum_physicians: "#b #BLUE Lekarze #!#!"
 concept_panum_physician_desc: "#b #BLUE Lekarze#!#! to [Concept('concept_academics_academic','$concept_academics_academics$')], którzy pracują i prowadzą badania w dziedzinie [concept_panum_medicine]. Ich głównym zadaniem jest opracowywanie [Concept('concept_panum_disease_description','$concept_panum_disease_descriptions$')] oraz odkrywanie [Concept('concept_panum_disease_treatment','$concept_panum_disease_treatments$')]. Mogą również rozwijać badania medyczne, ulepszać opiekę zdrowotną i leczyć inne postacie.\nLekarze zdobywają [concept_academics_experience] podczas pracy oraz pasywnie każdego roku. Zdobycie wystarczającej liczby punktów #b Doświadczenia#! pozwala im uzyskiwać wyższe poziomy cechy lekarza."
 concept_panum_medicine: "Medycyna"
 concept_panum_medicine_desc: "Medycyna jest jednym z największych rozszerzeń moda [concept_morgenroete] do gry Victoria 3. Jednym z jej głównych obszarów są epidemiczne [Concept('concept_panum_disease','$concept_panum_diseases$')], takie jak cholera, gruźlica i tyfus, które nękały ludzkość przez stulecia i ostatecznie udało się opanować dzięki postępowi naukowemu. Choroby epidemiczne są więc jednym z negatywnych wydarzeń w modzie [concept_morgenroete]. Dlatego jeszcze ważniejsze jest ich zwalczanie poprzez poszukiwanie [concept_panum_disease_treatment]. Centralną postacią w dziedzinie medycyny jest [concept_panum_physician], należący do grona uczonych dostępnych w ramach antropologiczno-humanistycznego profilu uniwersyteckiego. Może on opisywać choroby epidemiczne i opracowywać metody ich leczenia. Metoda leczenia zazwyczaj wymaga [concept_panum_disease_description] oraz odpowiedniej technologii. Lekarz może również usprawniać badania nad technologiami medycznymi, rozwijać opiekę zdrowotną poprzez budowę szpitali, wprowadzać nowe Techniki Medyczne i leczyć inne postacie. Kongresy Medyczne pomagają szerzyć wiedzę medyczną na arenie międzynarodowej. Ważnym krokiem w modernizacji medycyny jest również przejście od teorii miazmatycznej do [concept_panum_germ_theory]. Kraj przodujący w odkryciach medycznych może także osiągnąć wysoki poziom [concept_panum_medical_prestige]."
 concept_panum_disease: "Choroba"
 concept_panum_diseases: "Choroby"
 concept_panum_disease_desc: "Termin choroba odnosi się zazwyczaj do chorób epidemicznych, które mogą dotykać kraj co kilka lat. [concept_panum_physician] może im przeciwdziałać, opracowując [Concept('concept_panum_disease_description','$concept_panum_disease_descriptions$')] i zapewniając [Concept('concept_panum_disease_treatment','$concept_panum_disease_treatments$')]. Choroby epidemiczne zazwyczaj nie występują jednocześnie, a pomiędzy kolejnymi epidemiami upływa pewien czas. W zależności od rodzaju choroby epidemie mogą mieć katastrofalne skutki i rozprzestrzeniać się na wiele stanów. Istnieją różne metody [concept_panum_disease_prevention], które pozwalają opóźnić wybuch epidemii lub złagodzić jej skutki. Czynniki wywołujące choroby mogą być bardzo różne. Żółta febra występuje wyłącznie w regionach tropikalnych, natomiast cholera i gruźlica wymagają osiągnięcia minimalnego poziomu urbanizacji, aby mogły się rozprzestrzeniać. Znaczenie mają również poziom życia ludności oraz poziom dewastacji stanu.\n\nOprócz tych szczególnie groźnych chorób epidemicznych istnieją także choroby występujące na co dzień, które lekarz może losowo badać w ramach badań medycznych. Należą do nich krzywica, pelagra i kiła.\n\nChoroby to:\n #indent_newline:3 • [GetHarvestConditionType('panum_cholera_condition').GetName]#!\n #indent_newline:3 • [GetHarvestConditionType('panum_tuberculosis_condition').GetName]#!\n #indent_newline:3 • [GetHarvestConditionType('panum_smallpox_condition').GetName]#!\n #indent_newline:3 • [GetHarvestConditionType('panum_typhus_condition').GetName]#!\n #indent_newline:3 • [GetHarvestConditionType('panum_yellow_fever_condition').GetName]#!\n #indent_newline:3 • [GetHarvestConditionType('panum_measles_condition').GetName]#!\n #indent_newline:3 • [GetHarvestConditionType('panum_scarlet_condition').GetName]#!\n #indent_newline:3 • [GetHarvestConditionType('panum_plague_condition').GetName]#!\n #indent_newline:3 • [GetHarvestConditionType('panum_diphteria_condition').GetName]#!\n #indent_newline:3 • [GetHarvestConditionType('panum_polio_condition').GetName]#!"
 concept_panum_disease_description: "Opis Choroby"
 concept_panum_disease_descriptions: "Opisy Choroby"
 concept_panum_disease_description_desc: "Opisy są pierwszym krokiem do zrozumienia [concept_panum_disease]. Nie mają wpływu na dotkliwość epidemii, ale są niezbędne do odkrywania [Concept('concept_panum_disease_treatment','$concept_panum_disease_treatments$')], [Concept('concept_theiler_pathogen','$concept_theiler_pathogens$')] oraz [Concept('concept_theiler_vaccine','$concept_theiler_vaccines$')]. Opisy chorób nie wymagają spełnienia żadnych dodatkowych warunków — potrzebna jest jedynie choroba epidemiczna oraz [concept_panum_physician]."
 concept_panum_disease_treatment: "Leczenie Choroby"
 concept_panum_disease_treatments: "Leczenie Choroby"
 concept_panum_disease_treatment_desc: "[concept_panum_physician], dysponując odpowiednią technologią i [concept_panum_disease_description], może w długotrwałym procesie opracować metodę leczenia [concept_panum_disease]. Metody leczenia nie są tym samym co lekarstwo całkowicie eliminujące chorobę. Lekarz ustala przyczynę choroby, a następnie opracowuje na tej podstawie sposoby zapobiegania epidemii lub znacznego ograniczania jej skutków. Metody leczenia chorób skracają czas trwania epidemii do kilku miesięcy lub tygodni, a także zapobiegają jej rozprzestrzenianiu się na wiele stanów. Metody leczenia chorób stanowią jeden z możliwych sposobów [concept_panum_disease_prevention] chroniących przed wybuchem epidemii."
 concept_panum_disease_prevention: "Zapobieganie Chorobie"
 concept_panum_disease_prevention_no_disease: "Zapobieganie"
 concept_panum_disease_prevention_desc: "Istnieje kilka sposobów, aby uniknąć epidemii [concept_panum_disease] lub przynajmniej złagodzić jej skutki. Najbardziej znanym sposobem jest [concept_panum_disease_treatment] opracowana przez [concept_panum_physician]. Znacząco skraca ona czas trwania choroby i zmniejsza prawdopodobieństwo jej rozprzestrzenienia się na inny kraj. Wpływ mają również poziom życia, szpitale, technologie oraz wysoki poziom rozwoju instytucji opieki zdrowotnej. Najskuteczniejszą metodą zapobiegania jest [concept_theiler_vaccine], która zapobiega wystąpieniu choroby. Szczepionki są opracowywane przez [Concept('concept_theiler_biologist','$concept_theiler_biologists$')]. Są jednak skuteczne tylko wtedy, gdy instytucja opieki zdrowotnej osiągnie co najmniej poziom określony dla Wydziału Medycznego. Dystrybucja szczepionki musi być bowiem odpowiednio zorganizowana i nadzorowana."
 concept_panum_disease_type: "Rodzaj choroby"
 concept_panum_disease_types: "Rodzaje Choroby"
 concept_panum_disease_type_desc: "Epidemiczne [Concept('concept_panum_disease','$concept_panum_diseases$')] można podzielić w zależności od zasięgu ich rozprzestrzeniania się. #V Choroby Lokalne#!, takie jak szkarlatyna, ograniczają się do stanu, w którym wybuchły. #V Choroby Regionalne#!, takie jak gruźlica, mogą rozprzestrzeniać się na kilka sąsiednich stanów, ale nie poza ich granice. #V Choroby Ponadregionalne#! — z których najbardziej znaną jest cholera — mogą rozprzestrzeniać się na terenie całego kraju, nawet jeśli poszczególne stany nie graniczą ze sobą."
 concept_panum_local_disease: "Lokalna choroba"
 concept_panum_local_diseases: "Lokalne choroby"
 concept_panum_regional_disease: "Choroba regionalna"
 concept_panum_regional_diseases: "Choroby regionalne"
 concept_panum_transregional_disease: "Epidemia międzyregionalna"
 concept_panum_transregional_diseases: "Epidemia międzyregionalna"
 concept_panum_germ_theory: "Teoria Zarazków"
 concept_panum_germ_theory_desc: "Teoria zarazków jest jednym z fundamentalnych osiągnięć naukowych medycyny XIX wieku. Zastąpiła wcześniejsze, bardziej archaiczne teorie, takie jak teoria miazmatyczna, rozpowszechniona w Europie, która stanowiła jedną z tradycyjnych prób wyjaśnienia przyczyn [Concept('concept_panum_disease','$concept_panum_diseases$')]. Odkrycie teorii zarazków przynosi korzyści nie tylko temu, kto dokonał go jako pierwszy. Podczas poszukiwania [Concept('concept_panum_disease_treatment','$concept_panum_disease_treatments$')] szanse powodzenia są nieco większe, ponieważ teoria ta zapobiega niektórym negatywnym wydarzeniom i odblokowuje więcej pozytywnych wydarzeń."
 concept_panum_medical_prestige: "Prestiż medyczny"
 concept_panum_medical_prestige_desc: "Prestiż Medyczny składa się z odkrytych dotychczas [Concept('concept_panum_disease_description','$concept_panum_disease_descriptions$')] (2 punkty), [Concept('concept_panum_disease_treatment','$concept_panum_disease_treatments$')] (4 punkty), [Concept('concept_theiler_pathogen','$concept_theiler_pathogens$')] (3 punkty) oraz [Concept('concept_theiler_vaccine','$concept_theiler_vaccines$')] (4 punkty). Pierwsze odkrycia zapewniają dwukrotnie więcej punktów. Dodatkowy Prestiż Medyczny można zdobyć dzięki leczeniu powszechnych chorób, wynajdywaniu specjalnych metod leczenia lub ogólnemu usprawnianiu systemu opieki zdrowotnej za pomocą [concept_panum_physician]."
 concept_theiler_pathogen: "Patogen"
 concept_theiler_pathogens: "Patogeny"
 concept_theiler_pathogen_desc: "Patogen to określenie czynnika wywołującego [concept_panum_disease]. Może nim być zarówno organizm, jak i [concept_theiler_microorganism]. Najczęściej jest to bakteria, pasożyt lub wirus.\n[concept_theiler_biologist], dysponując wystarczającą liczbą Mikroorganizmów, może podjąć próbę odkrycia Patogenu wywołującego daną Chorobę. Może to pomóc w zapobieganiu chorobie, a także w odkryciu i opracowaniu [concept_theiler_vaccine]."
 concept_theiler_vaccine: "Szczepionka"
 concept_theiler_vaccines: "Szczepionki"
 concept_theiler_vaccine_desc: "Odkrycie szczepionek pozwoliło ludziom uzyskać odporność na [Concept('concept_panum_disease','$concept_panum_diseases$')] bez konieczności przechodzenia tych chorób i może potencjalnie uratować miliony istnień.\nAby opracować szczepionkę, [concept_theiler_biologist] musi najpierw odkryć [concept_theiler_pathogen] wywołujący daną chorobę. Następnie można rozpocząć prace nad szczepionką, jeśli dostępna jest wystarczająca liczba [Concept('concept_theiler_microorganism','$concept_theiler_microorganisms$')]."
 concept_panum_red_cross: "Czerwony Krzyż"
 concept_panum_red_cross_desc: "Czerwony Krzyż jest jedną z pierwszych organizacji międzynarodowych i w rzadkich przypadkach umożliwia otrzymanie medyków Czerwonego Krzyża podczas wojny. Jego członkowie otrzymują również określone premie. W zależności od reguł gry Czerwony Krzyż może zostać założony historycznie lub dynamicznie. Uznane państwa mogą do niego dołączyć po spełnieniu określonych wymagań technologicznych. Założyciel otrzymuje siedzibę Czerwonego Krzyża w swojej stolicy. Członkowie mogą przystąpić do maksymalnie trzech [Concept('concept_panum_convention','$concept_panum_conventions$')], które są wiążące na mocy prawa międzynarodowego."
 concept_panum_convention: "Konwencja międzynarodowa"
 concept_panum_conventions: "Konwencje międzynarodowe"
 concept_panum_convention_desc: "Konwencja międzynarodowa to wspólna deklaracja woli państw, mająca na celu ustanowienie określonych zasad postępowania w stosunkach międzynarodowych. W XIX wieku powstało kilka takich porozumień, między innymi Konwencja Genewska i Regulamin haski dotyczący wojny lądowej. Wszystkie konwencje łączy dążenie do ograniczenia okrucieństw wojny. Ograniczają one zatem działania wojenne na rzecz zapewnienia rannym bezpiecznej opieki medycznej oraz zakazują stosowania broni ostatecznej, co prowadzi do pewnego ograniczenia skali konfliktu. Ich zaletą jest większa elastyczność. Podpisanie konwencji jest postrzegane pozytywnie, natomiast jej zniesienie może wywołać międzynarodowe oburzenie.\n\nKonwencje międzynarodowe są zazwyczaj niewiążącymi deklaracjami woli. Jeśli jednak podpisze je wystarczająca liczba członków [concept_panum_red_cross], z czasem stają się obowiązującym prawem międzynarodowym, którego przestrzegania oczekuje się od wszystkich sygnatariuszy — a pozostali członkowie również do nich przystępują. Dzieje się tak, gdy za daną konwencją opowie się 65% wszystkich członków oraz większość Wielkich Mocarstw. Wówczas wszystkie pozostałe państwa członkowskie zostają zobowiązane do jej przestrzegania. Takiej konwencji nie można już znieść w zwykły sposób. Aby uniknąć wiążących konwencji, konieczne jest całkowite wystąpienie z Czerwonego Krzyża — ze wszystkimi tego konsekwencjami."
 concept_manzoni_literary_tradition_desc: "#b Tradycja Literacka#! odzwierciedla dorobek literacki i tradycje danego kraju.\nIstnieje kilka sposobów na zdobywanie #b Tradycji Literackiej#!. Posiadanie co najmniej jednej `$building_art_academy$`, jednego lub więcej [Concept('concept_manzoni_local_writer','$concept_manzoni_local_writers$')], [concept_manzoni_national_writer] oraz niektórych [Concept('concept_artists_center_of_arts','$concept_artists_centers_of_arts$')] zapewnia Twojemu krajowi pasywny przyrost #b Tradycji Literackiej#!.\nIm więcej #b Tradycji Literackiej#! zdobywa Twój kraj, tym większą premię do prestiżu otrzymuje. Ponadto pozwala ona odblokować [concept_artists_art_style] [concept_elgar_expressionism]."
 concept_elgar_musical_tradition_desc: "#b Tradycja Muzyczna#! odzwierciedla dorobek muzyczny i tradycje danego kraju.\nIstnieje kilka sposobów na zdobywanie #b Tradycji Muzycznej#!. Posiadanie co najmniej jednej [concept_elgar_opera] zapewnia pasywny przyrost #b Tradycji Muzycznej#!. Im więcej #b Oper#! posiadasz, tym większy jest ten przyrost. Możesz również zdobywać #b Tradycję Muzyczną#! dzięki technologiom związanym z muzyką i sztuką. Każda technologia zapewnia inną premię. #b Tradycję Muzyczną#! można zdobywać także podczas wydarzeń, szczególnie jeśli posiadasz [concept_elgar_composer].\nIm więcej #b Tradycji Muzycznej#! zdobywa Twój kraj, tym większą premię do prestiżu otrzymuje. Ponadto pozwala ona odblokować styl artystyczny [concept_elgar_impressionism] [concept_artists_art_style]."
 concept_klimt_painting_tradition_desc: "#b Tradycja Malarska#! odzwierciedla dorobek malarski i tradycje danego kraju. Można ją zdobywać dzięki posiadaniu #b Akademii Sztuki#!, [concept_klimt_painter], określonym [Concept('concept_technology', '$concept_technologies$')] lub wydarzeniom.\n#b Tradycja Malarska#! pozwala odblokować [concept_elgar_art_nouveau] [concept_artists_art_style] i jest wykorzystywana do obliczania #b Tradycji Kulturowej#!."
 concept_mendelejew_theorized_elements: "Przewidziane Pierwiastki"
 concept_mendelejew_discovered_elements: "Odkryte pierwiastki"
 concept_mendelejew_isolated_elements: "Wyizolowane pierwiastki"
 concept_panum_psycho_point: "Punkty psychoterapeutyczne"
 concept_panum_psycho_points: "Punkty psychoterapeutyczne"
 concept_panum_psycho_point_desc: "Punkty Psychoterapeutyczne to abstrakcyjna waluta odzwierciedlająca postępy danego kraju w dziedzinie psychiatrii i psychologii. Są generowane co miesiąc dzięki technologiom, szpitalowi psychiatrycznemu lub [concept_panum_physician] posiadającemu cechę [concept_character_trait] #V Psychiatra#!. Punkty Psychoterapeutyczne można również zdobywać podczas wydarzeń. Duża liczba Punktów Psychoterapeutycznych zwiększa szanse na wyleczenie postaci cierpiących na choroby psychiczne. Awans na wyższy poziom psychoterapeutyczny zapewnia również premie do badań oraz [concept_academics_progress]. Określona liczba Punktów Psychoterapeutycznych jest wymagana do odblokowania większości szkół psychologicznych."
 concept_vikelas_mechanic: "Mechanik"
 concept_vikelas_mechanic_desc: "#b Mechanicy#! odpowiadają za budowę [concept_vikelas_race_car], a ich cechy i doświadczenie wpływają na czas potrzebny do zbudowania lub ulepszenia samochodu. Nie odpowiadają jednak wyłącznie za sam pojazd, lecz mają również bezpośredni wpływ na [concept_vikelas_mechanical_innovation]. Dobrzy mechanicy dbają o to, aby prędkość samochodu (uwzględniająca również skłonność kierowcy do poszukiwania dreszczyku emocji związanego z dużą prędkością) nie przekraczała poziomu bezpieczeństwa, co pozwala zapobiegać śmiertelnym wypadkom. To samo dotyczy niezawodności: jeśli parametr prędkości jest wyższy niż parametr niezawodności, istnieje 50% szans, że samochód nie dotrze do celu."
 concept_vikelas_mechanical_innovation: "Innowacja mechaniczna"
 concept_vikelas_race_car: "Bolid"
 concept_vikelas_race_car_desc: "Oprócz [concept_vikelas_racer], #b Samochód Wyścigowy#! jest kluczowym czynnikiem w [concept_vikelas_car_racing]. Samochody te są budowane przez [concept_vikelas_mechanic]. Najważniejszymi parametrami samochodu wyścigowego są prędkość, niezawodność i bezpieczeństwo. Szybki samochód, który nie spełnia norm bezpieczeństwa, może mieć spore szanse na zwycięstwo, ale wiąże się również z wysokim ryzykiem śmiertelnego wypadku. Z kolei bezpieczny, lecz zbyt wolny samochód nie jest w stanie zapewnić zwycięstwa. Zespół wyścigowy musi więc znaleźć odpowiednią równowagę między tymi parametrami."
 concept_vikelas_race_car_reliability: "Niezawodność"
 concept_vikelas_race_car_safety: "Bezpieczeństwo"
 concept_vikelas_race_car_speed: "Prędkość"
 concept_dubois_dinosaur_bone_no_dinosaur: "Kość"
 concept_dubois_dinosaur_bones_no_dinosaur: "Kości"
 concept_dubois_paleontological_expedition_desc: "[concept_dubois_paleontologist] może zostać wysłany do [Concept('concept_dubois_formation','$concept_dubois_formations$')]. Wyprawa potrwa 1 rok, a w zależności od jej powodzenia otrzymasz [Concept('concept_dubois_fossil','$concept_dubois_fossils$')] oraz [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones$')]. Po zakończeniu Wyprawy, jeśli posiadasz wolny [concept_dubois_paleontological_team], możesz założyć [concept_dubois_paleontological_excavation], aby pasywnie pozyskiwać Skamieniałości i Kości z tego regionu.\nNajłatwiejszym sposobem na uzyskanie dostępu do formacji jest kontrolowanie powiązanego z nią stanu. Dostęp można jednak uzyskać również pokojowo, dzięki [Concept('concept_dubois_paleontological_licence','$concept_dubois_paleontological_licences$')]."
 concept_dubois_paleontological_team: "Drużyna Paleontologiczna"
 concept_dubois_paleontological_teams: "Drużyny Paleontologiczne"
 concept_dubois_paleontological_team_desc: "Zespoły Paleontologiczne można wykorzystać do założenia [concept_dubois_paleontological_excavation] po ukończeniu [concept_dubois_paleontological_expedition]. Pozwoli to na pasywne pozyskiwanie [Concept('concept_dubois_fossil','$concept_dubois_fossils$')] oraz [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones$')]."
 concept_dubois_paleontological_excavation: "Wykopalisko Paleontologiczne"
 concept_dubois_paleontological_excavations: "Wykopaliska Paleontologiczne"
 concept_dubois_paleontological_excavation_desc: "Możesz założyć Wykopaliska Paleontologiczne po ukończeniu [concept_dubois_paleontological_expedition], jeśli masz wolny [concept_dubois_paleontological_team]. Wykopaliska Paleontologiczne pozwolą Twojemu zespołowi pasywnie pozyskiwać [Concept('concept_dubois_fossil','$concept_dubois_fossils$')] oraz [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones$')]."
 concept_verrier_venus_transit: "Tranzyt Wenus"
 concept_verrier_venus_transit_desc: "Tranzyt Wenus to rzadkie zjawisko, podczas którego Wenus przechodzi między Ziemią a Słońcem. W XIX wieku doszło do niego jednak dwukrotnie: w 1874 i 1882 roku. Ponieważ obserwacje tranzytu Wenus pozwalają wyciągać wnioski na temat rozmiarów Układu Słonecznego oraz dokładniej określić długość jednostki astronomicznej (AU), wydarzenia te miały ogromne znaczenie naukowe. Kraje położone w [concept_verrier_venus_transit_zone] mogą obserwować to zjawisko na swoim terytorium, natomiast pozostałe kraje muszą wysyłać wyprawy. Powodzenie obserwacji zależy od doświadczenia [concept_verrier_astronomer], dostępności [concept_tesla_engineer] oraz odrobiny szczęścia — czasami warunki pogodowe uniemożliwiają uzyskanie dobrego obrazu. Im lepsza obserwacja, tym większa premia."
 concept_verrier_venus_transit_zone: "Strefa Tranzytu Wenus"
 concept_verrier_venus_transit_zone_desc: "Strefa Tranzytu Wenus obejmuje te obszary Ziemi, z których można zaobserwować pełny tranzyt Wenus, a nie tylko jego część. W 1874 roku dotyczyło to przede wszystkim regionu Azji Wschodniej i Pacyfiku, a w 1882 roku — niemal całego kontynentu amerykańskiego. Szczegółowy wykaz regionów strategicznych znajduje się poniżej.\n\n#V Tranzyt Wenus w 1874 roku:#!\nIndonezja, Indochiny, Oceania, Południowe Chiny, Północne Chiny, Mandżuria, Japonia, Indie Środkowe, Madras, Bengal, Himalaje; a także stan Terytorium Oceanu Indyjskiego.\n\n#V Tranzyt Wenus w 1882 roku:#!\nBrazylia, La Plata, Andy, Wielka Kolumbia, Meksyk, Ameryka Środkowa, Karaiby, Środkowy Zachód, Dixie, Nowa Anglia; a także stany Ontario i Quebec."
 concept_vikelas_coach: "Trenera"
 concept_vikelas_coaches: "Trenerzy"
 concept_vikelas_coach_desc: "Trenerzy są narodowymi szkoleniowcami danego kraju w określonej dyscyplinie sportowej. Do sportów narodowych należą [concept_vikelas_football], baseball, koszykówka i krykiet. Trenerzy zapewniają premie odpowiednim drużynom podczas rozgrywek — zarówno na międzynarodowych Mistrzostwach Świata, jak i w meczach międzynarodowych. Te drugie rozgrywane są regularnie w ukryciu, a zwycięstwa zwiększają poziom doświadczenia trenera. Wysoka liczba punktów doświadczenia oraz pozytywne [Concept('concept_character_trait','$concept_character_traits$')] zwiększają szanse na zwycięstwo w Mistrzostwach Świata. Pozytywne cechy to te, które szczególnie motywują zawodników, takie jak ambicja czy charyzma, natomiast cechy demotywujące zmniejszają szanse na wygranie meczu. Należą do nich między innymi bezwzględność i okrucieństwo."
 concept_vikelas_football: "Piłka Nożna "
 concept_vikelas_football_desc: "Piłka Nożna jest jedną z możliwych dyscyplin sportu narodowego. Pierwsze kluby piłkarskie mogą powstawać w Europie i Ameryce Południowej, ale wymaga to stosunkowo liberalnego systemu prawnego, silnej drobnomieszczaństwa lub odpowiednio wysokiego przeciętnego poziomu życia. Następnie mogą odbywać się okazjonalne mecze piłkarskie. Utworzenie FIFA umożliwia rozgrywanie meczów międzynarodowych oraz organizację Mistrzostw Świata. Osiem najlepszych drużyn automatycznie kwalifikuje się do Mistrzostw Świata. Siła drużyn jest obliczana na podstawie Wartości Reprezentacji Narodowej w Piłce Nożnej (NFTV), która zależy od poziomu życia (kondycji fizycznej ludności), siły drobnomieszczaństwa (systemu klubowego), alfabetyzacji (taktyki) oraz tradycji (czy piłka nożna jest sportem narodowym). Podczas meczów uwzględnia się nie tylko NFTV, lecz także cechy charakteru i doświadczenie [concept_vikelas_coach]."
 concept_gaudi_architectural_splendour: "Architektoniczny przepych"
 concept_gaudi_architectural_splendour_desc: "Splendor Architektoniczny to zbiorcze określenie spektakularnego postępu w nowoczesnej architekturze, odnoszące się przede wszystkim do stylów Art Deco, Bauhausu i Neoklasycyzmu, które rozwinęły się na początku XX wieku. Wartość ta odzwierciedla przemianę przestarzałych form w architekturę gotową na wyzwania przyszłości. Styl Art Deco wymaga osiągnięcia wyższego progu, aby spełnić marzenie o mieście w stylu Art Deco, ale zapewnia też większe korzyści."
 concept_artists_artist_desc: "W modzie [concept_morgenroete] #b Artyści#! to wyjątkowe postacie, które umożliwiają korzystanie z określonych mechanik moda. Możesz pozyskać #b Artystów#! podczas niektórych wydarzeń lub po zgromadzeniu wystarczającej ilości [concept_artistic_progress]. Artyści posiadają [concept_artists_experience], które odzwierciedla ich pozycję w danej dziedzinie.\nObecnie dostępni są następujący #b Artyści#!:\n - [concept_elgar_composer]\n - [concept_klimt_painter]\n - [concept_manzoni_writer]\n - [concept_gaudi_architect]"
 concept_elgar_architecture_desc: "Architektura jest jednym z głównych elementów moda [concept_morgenroete]. Dzieli się na dwie główne części.\n\nZ jednej strony [concept_gaudi_monuments] zostały całkowicie przeprojektowane: nie buduje się ich już bezpośrednio, lecz rozbudowuje etapami za pomocą decyzji. Z drugiej strony dodano wiele nowych pomników — niektóre trzeba wybudować, a inne istnieją już na początku gry.\n\nDrugim kluczowym elementem jest wprowadzenie [concept_gaudi_architect], który może rozbudowywać miasta i projektować do 15 nowych, unikatowych budynków poprzez opracowywanie [Concept('concept_gaudi_architectural_blueprint','$concept_gaudi_architectural_blueprints$')]. Architekci mogą również przebudowywać kraj w stylu Bauhausu, neoklasycyzmu lub Art Deco. [concept_gaudi_great_architect] może nawet zaprojektować własny [concept_gaudi_custom_monument]!"
 concept_gaudi_architect_desc: "#PURPLE #b Architekci#!#! to [Concept('concept_artists_artist','$concept_artists_artists$')], których umiejętności dotyczą planowania urbanistycznego, projektowania budynków i budownictwa. Są specjalnym typem postaci, które można pozyskać w wyniku wydarzeń, po zgromadzeniu wystarczającej ilości [concept_artistic_progress], aby stworzyć architekta w swoim kraju, lub poprzez zaoferowanie stanowiska [concept_gaudi_independent_architect].\nW przeciwieństwie do innych artystów, którzy częściej przyczyniają się do wzrostu tradycji kulturowej, architekci rzadko generują niezwykle cenny [concept_gaudi_architectural_splendour]. Mogą go zdobywać podczas planowania urbanistycznego, rozbudowy stolicy lub całkowitego przeprojektowywania kraju w określonym stylu architektonicznym. Ich główne zadania mają jednak bardziej praktyczny charakter. Pracują przy budownictwie publicznym, zapewniając krajowi dodatkowe punkty budowy. Poprzez planowanie ulepszają infrastrukturę i przekształcają stolice w miejsca przyjazne do życia. Architekci mogą również doskonalić swoje umiejętności podczas podróży studyjnej lub napisać traktat architektoniczny.\nNajważniejszym zadaniem architektów jest projektowanie nowych, unikatowych budynków, do których opracowują [concept_gaudi_architectural_blueprint]. Łącznie można opracować plany 15 takich [concept_gaudi_blueprint_buildings]. Ponieważ badania te zajmują dużo czasu, warto dobrze przemyśleć, które budynki będą najbardziej przydatne.\nArchitekci zapewniają również pasywną premię: sama ich obecność przyspiesza budowę [concept_gaudi_monuments] o 100%. Największym osiągnięciem architekta jest zaprojektowanie własnego [concept_gaudi_custom_monument]. Jest to możliwe wyłącznie w przypadku [concept_gaudi_great_architect]."
 concept_douglas_mountaineering: "Wspinaczka"
 concept_douglas_mountaineering_desc: "Kraje, które posiadają co najmniej jeden [concept_douglas_mountain_summit] lub mają #b Licencję Alpinistyczną#! zawartą z krajem, który posiada taki szczyt, mogą uprawiać alpinizm. Aby rozpocząć #b Wyprawę Górską#!, potrzebujesz technologii #b Poszukiwanie Surowców#! i #b Nacjonalizm#!, a także generała posiadającego jedną z następujących cech: #b Alpinista#!, #b Odkrywca#!, #b Dowódca Górski#! lub #b Geodeta#!.\nGdy rozpoczniesz #b Wyprawę Górską#!, najpierw musisz wybrać generała, który będzie głównym alpinistą. Następnie wybierzesz szczyt, na który chcesz się wspiąć.\nIm wyższe góry, tym bardziej niebezpieczna jest wspinaczka. Góry klasyfikuje się według wysokości, od poniżej 4000 metrów do ponad 8000 metrów. Powodzenie zależy od opracowanych technologii wojskowych, wieku i stanu zdrowia przywódcy wyprawy oraz jego cech. Lawiny i strome zbocza mogą stanowić poważne zagrożenie dla całego przedsięwzięcia.\nMożesz również wysłać na wyprawę dodatkowego [Concept('concept_academics_academic','$concept_academics_scientist$')]. Zarówno [concept_dubois_naturalist], jak i [concept_dubois_paleontologist] pomogą Ci odkryć więcej tajemnic zdobytej góry.\nNa koniec otrzymasz premię do prestiżu, a Twój generał rozwinie lepsze cechy, które pomogą mu zarówno w walce, jak i podczas wypraw alpinistycznych."
 concept_gaudi_great_architect: "#PURPLE #b Wielki Architekt #! #!"
 concept_gaudi_great_architects: "#PURPLE #b Wielcy Architekci #! #!"
 concept_gaudi_great_architect_desc: "#b Wielcy Architekci#! to [Concept('concept_gaudi_architect','$concept_gaudi_architects$')], uznawani za najwybitniejsze umysły w swojej dziedzinie. #b Architekci#!, którzy osiągną 500 punktów [concept_artists_experience], staną się #b Wielkimi Architektami#!. Jeśli artysta osiągnie ten wyjątkowy status, będzie mógł zaprojektować wyjątkowy [concept_gaudi_custom_monument], który ucieleśni ducha narodu."
 concept_gaudi_monuments: "Monumenty w #R Morgenröte #!"
 concept_gaudi_monuments_desc: "Wiele państw otrzymało w modzie [concept_morgenroete] nowe #b Pomniki#!: #b Katedrę Kolońską#! w Niemczech, #b Kolej Gottharda#! w Szwajcarii, #b Chrystusa Odkupiciela#! w Brazylii, #b Mole Antonelliana#! we Włoszech, #b Pałac Letni#! w Chinach, #b Sagrada Família#! w Hiszpanii, #b Zamek Neuschwanstein#! w Bawarii, #b Pałac Sztuk Pięknych#! w Meksyku oraz #b Pałac Gyeongbokgung#! w Korei.\nWszystkie budowle z wyjątkiem #b Pałacu Letniego#! i #b Campanile#! muszą zostać wzniesione przez ich właściciela. #b Pałac Saski#! może zostać ponownie udostępniony przez polskie państwo. Na początku gry istnieją również nowe pomniki, takie jak #b Posągi Buddy z Bamianu#! czy #b Pałac Potala#!.\nIstnieje również możliwość zlecenia [concept_gaudi_great_architect] zaprojektowania [concept_gaudi_custom_monument].\n\nW przeciwieństwie do podstawowej wersji gry #b Pomniki#! nie są budowane bezpośrednio, lecz za pomocą decyzji. Budowa przebiega w kilku etapach, zależnie od rozmiaru budowli, i może trwać latami, a nawet dziesięcioleciami — jest też znacznie droższa."
 concept_athletes_athlete: "Sportowiec"
 concept_athletes_athletes: "Sportowcy"
 concept_athletes_athlete_desc: "W modzie [concept_morgenroete] #b Sportowcy#! to wyjątkowe postacie, które umożliwiają korzystanie z określonych mechanik moda. #b Sportowcy#! są zazwyczaj tworzeni w wyniku wydarzeń lub za pomocą przycisku. Podobnie jak inne postacie, #b Sportowcy#! zdobywają doświadczenie, które zwiększa ich szanse na sukces w swojej dziedzinie.\nObecnie dostępni są następujący #b Sportowcy#!:\n - [concept_curtiss_balloonist]\n - [concept_curtiss_pilot]\n - [concept_vikelas_olympian]\n - [concept_douglas_mountaineer]\n - [concept_vikelas_coach]\n - [concept_vikelas_racer]"
 concept_gaudi_independent_architect: "Niezależny Architekt"
 concept_gaudi_independent_architects: "Niezależni Architekci"
 concept_gaudi_independent_architect_desc: "[Concept('concept_gaudi_architect','$concept_gaudi_architects$')], którzy nie są zatrudnieni przez żaden kraj, to #b Niezależni Architekci#!.\nW przeciwieństwie do wielu innych artystów, rekrutacja #b Niezależnego Architekta#! wiąże się z niewieloma wymaganiami, poza minimalnym wymogiem technologicznym. Są oni prawdziwymi obieżyświatami i zazwyczaj oczekują jedynie dobrego wynagrodzenia."
 concept_gaudi_architectural_blueprint: "Projekt Architektoniczny"
 concept_gaudi_architectural_blueprints: "Projekty Architektoniczne"
 concept_gaudi_architectural_blueprint_desc: "Plany Architektoniczne mogą być opracowywane przez [Concept('concept_gaudi_architect','$concept_gaudi_architects$')]. Są niezbędne do budowy specjalnych [concept_gaudi_blueprint_buildings], które można wznieść tylko raz w danym kraju. Istnieje łącznie 15 różnych budynków podzielonych na pięć kategorii. Niektóre plany wymagają wcześniejszego opracowania określonych technologii. Ponieważ badania mogą czasami trwać latami, warto wcześniej zdecydować, które plany są najważniejsze. Budynki można potencjalnie wznieść w dowolnym stanie, ale wymagają one określonego poziomu urbanizacji. W niektórych przypadkach mogą obowiązywać również dodatkowe wymagania."
 concept_gaudi_blueprint_buildings: "Projekty Budynków"
 concept_gaudi_blueprint_buildings_desc: "Budynki oparte na planach to budowle, które wymagają opracowania planu przez [Concept('concept_gaudi_architect','$concept_gaudi_architects$')]. Każdy z tych budynków można wznieść tylko raz w danym kraju. Istnieje 15 różnych budynków:\n\n#b Pomniki#!\n- [GetBuildingType('building_gaudi_statue').GetName]\n- [GetBuildingType('building_gaudi_fountain').GetName]\n- [GetBuildingType('building_gaudi_arch').GetName]\n\n#b Place Publiczne#!\n- [GetBuildingType('building_gaudi_park').GetName]\n- [GetBuildingType('building_gaudi_luna').GetName]\n- [GetBuildingType('building_gaudi_parade').GetName]\n\n#b Budynki Usług Publicznych#!\n- [GetBuildingType('building_gaudi_almshouse').GetName]\n- [GetBuildingType('building_gaudi_school').GetName]\n- [GetBuildingType('building_gaudi_prison').GetName]\n\n#b Placówki Ochrony Zdrowia#!\n- [GetBuildingType('building_gaudi_canalization').GetName]\n- [GetBuildingType('building_gaudi_hospital').GetName]\n- [GetBuildingType('building_gaudi_health').GetName]\n\n#b Akademie Narodowe#!\n- [GetBuildingType('building_gaudi_science').GetName]\n- [GetBuildingType('building_gaudi_arts').GetName]\n- [GetBuildingType('building_gaudi_sports').GetName]"
 concept_gaudi_custom_monument: "Własny Monument"
 concept_gaudi_custom_monument_desc: "Monument Autorski to największe możliwe arcydzieło [concept_gaudi_architect]. Może konkurować ze zwykłymi pomnikami. Tylko [concept_gaudi_great_architect] może opracować taki projekt. Wymaga to zbadania najnowocześniejszych technologii architektonicznych. Rodzaj projektowanego monumentu zależy w dużej mierze od stylu architektonicznego danego architekta. Architekci tworzący w stylu Art Deco projektują [GetBuildingType('building_gaudi_people_monument').GetName], architekci Bauhausu — [GetBuildingType('building_gaudi_people_forum').GetName], a architekci neoklasycystyczni — [GetBuildingType('building_gaudi_people_palace').GetName]."
 concept_douglas_mountaineer: "Alpinista"
 concept_douglas_mountaineers: "Alpiniści"
 concept_douglas_mountaineer_desc: "#b Alpiniści#! to [Concept('concept_athletes_athlete','$concept_athletes_athletes$')], którzy mogą zdobywać niezdobyte [concept_douglas_mountain_summit]. Można ich rekrutować za [concept_douglas_alpine_heritage] po założeniu klubu alpinistycznego. Kraje posiadające cechy geograficzne, takie jak góry, szczyty czy wulkany, mają zatem przewagę w rekrutacji. Cechy alpinistyczne i doświadczenie są najważniejszymi czynnikami wpływającymi na postępy w zdobywaniu gór oraz pokonywaniu niebezpiecznych sytuacji."
 concept_vikelas_olympian: "Olimpijczyk"
 concept_vikelas_olympian_desc: "#n Ten wpis jest w trakcie opracowywania. #!"
 concept_douglas_mountain_summit: "Szczyt Górski"
 concept_douglas_mountain_summits: "Szczyty Górskie"
 concept_douglas_mountain_summit_desc: "Szczyty Górskie są upragnionym celem wszystkich alpinistów. Wyznaczają najwyższy punkt góry. Każdy szczyt posiada trzy odrębne cechy, które określają poziom trudności jego zdobycia.\n\n#V Wysokość#!: Wysokość określa liczbę etapów wymaganych do zdobycia góry, odzwierciedlając całkowitą długość wyprawy. Na każde 1000 metrów przypada jeden etap postępu. Wynik jest zaokrąglany w górę, co oznacza, że Mount Whitney o wysokości 4421 metrów wymaga 5 etapów, podczas gdy Kaufmann Peak o wysokości 7134 metrów wymaga ich 8. Prestiż góry oblicza się na podstawie jej wysokości: całkowitą wysokość dzieli się przez 300. Idealna góra o wysokości 4500 metrów zapewnia zatem 15 punktów prestiżu.\n\n#V Poziom#!: Poziom góry określa wymagania dotyczące wyposażenia niezbędnego do jej zdobycia. Nie jest on ściśle związany z wysokością. Przykładowo, mimo wysokości 5636 metrów Citlaltépetl ma zaledwie 1. poziom i wymaga jedynie podstawowego wyposażenia. Z kolei Matterhorn, mierzący zaledwie 4478 metrów, jest uznawany za znacznie trudniejszy — ma 3. poziom i wymaga co najmniej przygotowania z zakresu pierwszej pomocy na wypadek zagrożeń w Alpach.\n\n#V Ryzyko#!: Poziom ryzyka góry wskazuje prawdopodobieństwo wystąpienia negatywnych wydarzeń podczas wyprawy. Jest niezależny zarówno od wysokości, jak i poziomu góry. Największe zagrożenia stanowią lawiny, mgła i trudne warunki pogodowe. Popocatépetl można było zdobywać już we wczesnym okresie nowożytnym dzięki sprzyjającym warunkom terenowym. Natomiast znacznie niższy Großvenediger, mierzący zaledwie 3666 metrów, jeszcze na początku XIX wieku stanowił poważne zagrożenie dla austriackich wypraw.\n\nWięcej informacji o poszczególnych szczytach można znaleźć w sekcji [concept_douglas_mountain_summit_list]."
 concept_douglas_mountain_range: "Pasmo Górskie"
 concept_douglas_mountain_ranges: "Pasma Górskie"
 concept_douglas_mountain_range_desc: "Pasmo górskie definiuje się jako formację górską, która umożliwia trening w zakresie [concept_douglas_mountaineering] na długich dystansach. Do klasycznych pasm górskich należą Góry Skaliste, Andy, Alpy i Kaukaz. Oprócz [Concept('concept_douglas_mountain_summit','$concept_douglas_mountain_summits$')], które należy zdobyć, istnieje również wiele mniej wymagających gór, na których [concept_douglas_mountaineer] nie grozi śmiertelny upadek. Należy je raczej traktować jako trasy treningowe. Kraje posiadające pasma górskie mają większe szanse na pojawienie się alpinistów niż kraje pozbawione tego ukształtowania terenu."
 concept_douglas_alpine_heritage: "Alpejskie Dziedzictwo"
 concept_douglas_alpine_heritage_desc: "Dziedzictwo Alpejskie to zbiorcze określenie więzi z górami oraz specjalizacji w ich zdobywaniu. Odnosi się również do możliwości rekrutowania nowych [Concept('concept_douglas_mountaineer','$concept_douglas_mountaineers$')] — ponieważ w większości przypadków doświadczeni alpiniści pochodzą z obszarów górskich. Daje to stałą przewagę krajom posiadającym [Concept('concept_douglas_mountain_range','$concept_douglas_mountain_ranges$')] lub [Concept('concept_douglas_mountain_summit','$concept_douglas_mountain_summits$')]. Rekrutacja nowego alpinisty, podobnie jak wiele innych działań, kosztuje punkty Dziedzictwa Alpejskiego."
 concept_douglas_mountain_summit_list: "Lista Szczytów Górskich"
 concept_douglas_mountain_summit_list_desc: "Istnieje wiele [Concept('concept_douglas_mountain_summit','$concept_douglas_mountain_summits$')], które można zdobyć.\n\n#V Ameryka Północna:#!\n#b Mount McKinley#! (Alaska), Wysokość 6190 metrów, Poziom 4\n#b Mount Logan#! (Terytorium Jukonu), Wysokość 5959 metrów, Poziom 4\n#b Citlaltépetl#! (Meksyk), Wysokość 5636 metrów, Poziom 1\n#b Mount Whitney#! (Kalifornia), Wysokość 4421 metrów, Poziom 1\n\n#V Ameryka Południowa:#!\n#b Aconcagua#! (Mendoza), Wysokość 6267 metrów, Poziom 3\n#b Huascarán#! (Terytorium Limy), Wysokość 6768 metrów, Poziom 5\n#b Illimani#! (La Paz), Wysokość 6438 metrów, Poziom 4\n#b Chimborazo#! (Ekwador), Wysokość 6267 metrów, Poziom 1\n\n#V Europa:#!\n#b Shkara#! (Wielki Kaukaz), Wysokość 5642 metrów, Poziom 4\n#b Dufourspitze#! (Zachodnia Szwajcaria), Wysokość 4634 metrów, Poziom 2\n#b Matterhorn#! (Zachodnia Szwajcaria), Wysokość 4478 metrów, Poziom 3\n#b Aiguille Verte#! (Sabaudia), Wysokość 4122 metrów, Poziom 3\n#b Pico de Aneto#! (Aragonia), Wysokość 3404 metrów, Poziom 1\n\n#V Afryka:#!\n#b Kibo#! (Tanganika), Wysokość 5895 metrów, Poziom 2\n#b Mount Kenya#! (Kenia), Wysokość 5199 metrów, Poziom 3\n#b Mount Stanley#! (Uganda), Wysokość 5109 metrów, Poziom 3\n#b Mount Cameroon#! (Południowy Kamerun), Wysokość 4095 metrów, Poziom 1\n\n#V Azja:#!\n#b Kamet#! (Delhi), Wysokość 7756 metrów, Poziom 4\n#b Chogolisa#! (Kaszmir), Wysokość 7665 metrów, Poziom 5\n#b Kabru#! (Himalaje), Wysokość 7412 metrów, Poziom 5\n#b Kaufmann Peak#! (Tadżykistan), Wysokość 7134 metrów, Poziom 4\n\n#V Australia i Oceania:#!\n#b Mount Wilhelm#! (Wschodnia Nowa Gwinea), Wysokość 4121 metrów, Poziom 2\n#b Mount Cook#! (Wyspa Południowa), Wysokość 3724 metrów, Poziom 2"
 concept_panum_disease_description_describe: "opisz"
 concept_panum_disease_description_described: "opisany"
 concept_panum_disease_treatment_treat: "lecz"
 concept_panum_disease_treatment_treated: "leczony"
 concept_roy_ethnologist: "#b #BLUE Etnolog#!#!"
 concept_roy_ethnologists: "#b #BLUE Etnolodzy#!#!"
 concept_roy_ethnologist_desc: "#n Wkrótce w Morgenröte!#!"
