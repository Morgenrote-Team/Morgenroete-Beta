 concept_andersson_anthropologist: "#b #BLUE Antropolog#!#!"
 concept_andersson_anthropologists: "#b #BLUE Antropolodzy#!#!"
 concept_andersson_anthropologist_desc: "#b #BLUE Antropolodzy#!#! to uczeni badający prehistorię człowieka zarówno z perspektywy paleontologicznej, jak i archeologicznej. Poszukują [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')], [Concept('concept_andersson_prehistoric_artifact','$concept_andersson_prehistoric_artifacts$')], odkrywają nowe gatunki człowieka i rekonstruują [Concept('concept_andersson_skeleton','$concept_andersson_skeletons$')]. Antropolodzy często pracują jako speleolodzy (badacze jaskiń), a z czasem mogą rozwijać różnorodne specjalizacje. Należą do nich między innymi monogeniści, poligeniści, dyfuzjoniści i ewolucjoniści, których stanowiska podczas konferencji często przesądzają o jej wyniku. Szczególnie uzdolnieni antropolodzy mogą zreformować istniejącą terminologię antropologiczną dotyczącą [concept_andersson_human_evolution] lub rzucić nowe światło na fałszerstwo z Piltdown."
 concept_andersson_human_fossil: "Skamieniałość Człowieka"
 concept_andersson_human_fossils: "Skamieniałości Człowieka"
 concept_andersson_human_bones: "Kości Człowieka"
 concept_andersson_human_fossil_desc: "Istnieją zasadniczo dwa rodzaje #b Skamieniałości Człowieka#!: skamieniałości niespecyficzne i specyficzne. Skamieniałości niespecyficzne obejmują wszelkie pozostałości biologiczne człowieka, w tym również te pochodzące z niedawnych czasów historycznych. Mogą być odnajdywane także przez osoby niezajmujące się antropologią, ale są ważne na przykład przy tworzeniu [GetBuildingType('building_andersson_institute').GetName]. Specyficzne skamieniałości człowieka należą do jednej z czterech grup: Neoanthropus, Palaeanthropus, Pithecanthropus i Australopithecus. Można je odnaleźć podczas badań nad hominidami lub w trakcie wyprawy poświęconej hominidom. [Concept('concept_andersson_anthropologist','$concept_andersson_anthropologists$')] mogą również odkrywać w ten sposób zupełnie nowe typy. Łącznie istnieje 16 różnych rodzajów specyficznych skamieniałości człowieka. Można z nich również rekonstruować [Concept('concept_andersson_skeleton','$concept_andersson_skeletons$')], aby prześledzić [concept_andersson_human_evolution]."
 concept_andersson_cave: "Jaskinia"
 concept_andersson_caves: "Jaskinie"
 concept_andersson_cave_desc: "#b Jaskinie Prehistoryczne#! to miejsca, w których wczesne gatunki człowieka lub gatunki przedludzkie pozostawiły [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')]. Zapewniają one zatem premię podczas prowadzenia badań antropologicznych. Jaskinie mogą być odkrywane i eksplorowane przez [Concept('concept_andersson_anthropologist','$concept_andersson_anthropologists$')]. Niektóre Jaskinie są również odblokowywane w wyniku wydarzeń historycznych."
 concept_andersson_human_evolution: "Ewolucja Człowieka"
 concept_andersson_human_evolution_desc: "W epoce wiktoriańskiej istniała tendencja do klasyfikowania [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] oraz etapów ewolucji według stopnia ich rozwoju. Rozróżniano obdarowanych talentem artystycznym Homo sapiens oraz ich przodków o bardziej prymitywnych rysach lub podobnych do małp. W ten sposób przodków człowieka dzielono na kategorie takie jak Neoanthropus (Człowiek Współczesny), Palaeanthropus (Człowiek Jaskiniowy) i Pithecanthropus (Człowiek Małpolud); ten ostatni miał stanowić właściwe „ogniwo brakujące” między zwierzętami a ludźmi. Choć późniejsi uczeni często odrzucali te koncepcje, stanowiły one punkt wyjścia do dalszych badań nad najdawniejszymi dziejami ludzkości. Odkrycie w Afryce Australopithecus (Małpy Południowej) było więc z wielu powodów wydarzeniem, które zachwiało dotychczasowym poglądem."
 concept_andersson_prehistoric_artifact: "Prehistoryczny Artefakt"
 concept_andersson_prehistoric_artifacts: "Prehistoryczne Artefakty"
 concept_andersson_prehistoric_artifact_desc: "#b Prehistoryczne Artefakty#! stanowią dowód obecności człowieka w [concept_andersson_cave] lub na innych stanowiskach archeologicznych. W przeciwieństwie do niespecyficznych [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')], bezpośrednio zapewniają [concept_andersson_anthropological_prestige]. W rzadkich przypadkach są również wymagane do organizowania wystaw poświęconych życiu człowieka w neolicie, mezolicie lub górnym paleolicie. [concept_andersson_anthropologist] posiadający cechę [concept_lepsius_archaeologist] znajduje więcej prehistorycznych artefaktów podczas badań antropologicznych."
 concept_andersson_skeleton: "Szkielet Prehistoryczny"
 concept_andersson_skeletons: "Szkielety Prehistoryczne"
 concept_andersson_skeleton_desc: "Rekonstrukcja #b Prehistorycznego Szkieletu#! wymaga wybudowania [GetBuildingType('building_andersson_institute').GetName]. Gdy [Concept('concept_andersson_anthropologist','$concept_andersson_anthropologists$')] odnajdą pięć [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] należących do określonego gatunku, mogą rozpocząć rekonstrukcję — [Concept('concept_character_trait','$concept_character_traits$')] i doświadczenie antropologa wpływają na czas trwania tego procesu. Pierwszy szkielet Neoanthropusa, Palaeanthropusa lub Pithecanthropusa odblokowuje odpowiednią metodę produkcji w instytucie. Antropolog może jednak z łatwością rekonstruować również pozostałe szkielety, o ile posiada odpowiednie skamieniałości, aby zdobyć dodatkowy [concept_andersson_anthropological_prestige]."
 concept_lepsius_minor_excavation_site: "Pomniejsze Stanowisko Wykopaliskowe"
 concept_lepsius_minor_excavation_site_desc: "Oprócz dużych [Concept('concept_lepsius_excavation_site', '$concept_lepsius_excavation_sites$')], z których dzięki licencjom mogą korzystać kraje z całego świata i które oferują egipskie, mezopotamskie, egejskie oraz prekolumbijskie [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')], istnieją również „mniejsze” stanowiska wykopaliskowe. Z tych ostatnich może korzystać wyłącznie ich właściciel, a można na nich znaleźć jedynie lokalne artefakty. Są odblokowywane za pośrednictwem wpisu do Dziennika, który zazwyczaj wymaga [concept_lepsius_archaeologist] oraz specjalnej technologii. Dopiero wtedy stanowisko wykopaliskowe zostaje faktycznie aktywowane, co jest widoczne dzięki cesze stanu w regionie stanu. Po aktywacji Pomniejsze Stanowiska Wykopaliskowe generują dodatkowy Lokalny Artefakt, o ile archeolog prowadzi projekt archeologiczny. Przykładami takich stanowisk wykopaliskowych są Pompeje, Tikal i Harappa."
