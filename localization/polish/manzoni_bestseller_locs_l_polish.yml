 manzoni_writer_crime_book_bestseller_title_14_loc: "„Śmierć Żebraka w Zaułku Opiumowym”"
 manzoni_writer_crime_book_bestseller_flavor_14_loc: "Od wystawnych rezydencji elit po nędzne kamienice zamieszkiwane przez najuboższych, Zaułek Opiumowy jest miejscem, w którym występek miesza się z cnotą. „Śmierć Żebraka w Zaułku Opiumowym” zaprasza czytelników do zagłębienia się w mroczny świat przestępczego półświatka, gdzie w obliczu desperacji granice między dobrem a złem zaczynają się zacierać. Przygotuj się na porywającą opowieść o zbrodni, współczuciu i poszukiwaniu sprawiedliwości w świecie, który pogrążył się w szaleństwie."
