 manzoni_writer_juvenile_book_bestseller_flavor_2_loc: "Na mglistych wyżynach Szkocji żyła sobie dziewczyna równie zadziorna, co pełna temperamentu. Dołącz do młodej Fiony w jej niezwykłych przygodach pośród łagodnych wzgórz i pradawnych zamków rodzinnych stron. Od spotkań z psotnymi wróżkami po przechytrzanie niezdarnych olbrzymów, każda opowieść to urocza podróż pełna śmiechu, przyjaźni i odrobiny magii. Przygotuj się na nieodparty urok „Opowieści o Zadziornej Szkockiej Dziewczynie”, gdy przygody Fiony podbiją serca zarówno młodszych, jak i starszych czytelników."
