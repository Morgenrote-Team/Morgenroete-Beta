 manzoni_writer_mystery_book_bestseller_title_12_loc: "„Cicha Szanta Bezdusznego Marynarza”"
 manzoni_writer_mystery_book_bestseller_flavor_12_loc: "Kapitan Elyas Upton stał na pokładzie swojego solidnego statku, z brwiami zmarszczonymi w głębokim skupieniu wpatrując się w mroczny horyzont. W powietrzu panowała złowroga cisza, przerywana jedynie cichym pluskiem fal uderzających o kadłub. Członkowie jego załogi uwijali się gorączkowo, z twarzami naznaczonymi strachem, próbując powstrzymać tych, których zdawało się przyciągać tajemnicze wezwanie.\n\nW głębinach Morza Karaibskiego, pośród szeptów pradawnych legend i cieni zapomnianych klątw, kryje się tajemnica wymykająca się wszelkim wyjaśnieniom. Opowieści o zaginionych duszach i widmowych zjawach od stuleci nawiedzają te wody, lecz żadna nie budzi takiego przerażenia jak legenda o Cichej Szancie — upiornej melodii, która zwabia niczego niepodejrzewających marynarzy ku zagładzie.\n\nGdy kapitan Upton zapuszcza się coraz głębiej w samo serce ciemności, odkrywa sekrety, które grożą rozerwaniem samej tkanki rzeczywistości. Z każdym krokiem przybliżającym go do prawdy ryzykuje, że podzieli los tych, którzy przybyli tu przed nim. Albowiem w królestwie Bezdusznego Marynarza, gdzie zaciera się granica między żywymi a umarłymi, tylko najodważniejsze dusze ośmielą się stawić czoła mrokowi czającemu się pod falami."
