 manzoni_writer_crime_book_bestseller_title_8_loc: "„Nikczemni Bandyci z Bazaru w Beni Suef”"
 manzoni_writer_crime_book_bestseller_flavor_8_loc: "Na zakurzonych ulicach Boujdour, gdzie słońce praży bezlitośnie, a nawoływania kupców rozbrzmiewają na zatłoczonym bazarze, banda wyrzutków próbuje wykuć własny los. Urodzeni jako niechciani synowie bogatego szejka, wygnani z rodzinnego domu i pozostawieni na pastwę losu pośród bezlitosnej pustyni, stają się bohaterami opowieści „Nikczemni Bandyci z Bazaru w Boujdour”.\n\nGnani głodem i bólem zdrady, wkraczają na drogę przestępstwa, obierając za cel kupców przemierzających tętniące życiem targowisko. Jednak w miarę jak rośnie ich zuchwałość, a ambicje sięgają coraz wyżej, uświadamiają sobie, że są przeznaczeni do czegoś więcej niż drobne kradzieże i rozboje. Zjednoczeni wspólnym pochodzeniem i pragnieniem zemsty na ojcu, który ich odtrącił, knują plan zdobycia władzy, przysięgając odzyskać to, co prawnie im się należy."
