 manzoni_writer_crime_book_bestseller_title_12_loc: "„Bandyci z Dzikiego Zachodu”"
 manzoni_writer_crime_book_bestseller_flavor_12_loc: "Gdy słońce zachodzi nad surowymi krajobrazami Dzikiego Zachodu, z tumanów kurzu wyłaniają się mroczne sylwetki bandytów, których imiona wypowiadane są szeptem, zarówno ze strachem, jak i podziwem. Na kartach tej porywającej opowieści czytelnicy wyruszą u boku osławionych banitów, doświadczając na własnej skórze pełnych adrenaliny starć i brawurowych ucieczek, które stały się symbolem epoki bezprawia."
