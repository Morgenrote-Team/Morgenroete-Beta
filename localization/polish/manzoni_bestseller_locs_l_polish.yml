 manzoni_bestseller_doyle_arthur_conan_1_t: "„Studium w szkarłacie” autorstwa [ROOT.GetCharacter.GetFullName]"
 manzoni_bestseller_doyle_arthur_conan_1_d: "Detektyw rozwiązujący zagadki kryminalne dzięki logice i własnemu intelektowi. Ten Sherlock Holmes to fascynująca postać. Arthur Conan Doyle wpadł na naprawdę interesujący pomysł."
 manzoni_bestseller_doyle_arthur_conan_1_f: "„Łatwiej było to wiedzieć, niż wyjaśnić, skąd się to wie. Gdyby poproszono cię o udowodnienie, że dwa razy dwa to cztery, mógłbyś napotkać pewne trudności, a przecież jesteś tego całkowicie pewien.”\n– Arthur Conan Doyle, Studium w szkarłacie"