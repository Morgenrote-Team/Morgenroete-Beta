 manzoni_writer_crime_book_bestseller_title_6_loc: "„Tajemnice i Zaginięcia w Blackwood”"
 manzoni_writer_crime_book_bestseller_flavor_6_loc: "Wśród oświetlonych gazowymi latarniami zaułków Blackwood seria zagadkowych zaginięć wstrząsa lokalną społecznością. Zanurz się w mrocznych odmętach tej przerażającej tajemnicy, gdzie nic nie jest takie, jakim się wydaje, a prawda skrywa się w cieniu."
