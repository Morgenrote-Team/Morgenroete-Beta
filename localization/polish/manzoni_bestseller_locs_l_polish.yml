 manzoni_writer_science_fiction_book_bestseller_title_1_loc: "„Galera Odkrywająca Gwiazdy”"
 manzoni_writer_science_fiction_book_bestseller_flavor_1_loc: "Opowieść o statku zdolnym podróżować do gwiazd oraz jego niezwykłym kapitanie i załodze, którzy stawiają czoła niewyobrażalnym wyzwaniom w miejscach, do których nie dotarł jeszcze żaden człowiek. Przemierzają ogromne odległości w mroku kosmosu, prowadzeni blaskiem gwiazd i niezwykłymi urządzeniami nawigacyjnymi przyszłości. Odkrywają odległe planety, zarówno cudowne, jak i niebezpieczne — zachwycające swym pięknem i kryjące niewyobrażalne zagrożenia. Dowiedz się na kartach tej książki, jakie wyzwania na nich czekają, co odkryją poza granicami znanego ludzkości świata i kogo mogą spotkać podczas swojej niebezpiecznej podróży wśród gwiazd!"
