 manzoni_writer_literary_fiction_book_bestseller_title_1_loc: "„Rodzina Królewska w Domu Pracy”"
 manzoni_writer_literary_fiction_book_bestseller_flavor_1_loc: "Opowieść ta przedstawia losy niegdyś królewskiej rodziny, która rządziła żelazną ręką, narzucając surowy reżim terroru, w którym nikt poza nią nie mógł zaznać bogactwa ani dobrobytu. Nakładała na poddanych podatki z najbardziej błahych powodów, surowo karała za nieposłuszeństwo, a nawet wymierzała kary bez żadnej przyczyny. Jej tyrania doprowadziła Wielkie Dominium Imperii, niegdyś zamożne i potężne, do ruiny, przemieniając je w wyniszczone wojną królestwo, nękane głodem, ubóstwem i plagami.\n\nMimo to władcy wciąż żądali więcej, doprowadzając mieszkańców Imperii do buntu i protestów, które ostatecznie przerodziły się w krwawą rewolucję. W jej wyniku ustanowiono nowy rząd, a dawną rodzinę królewską pojmano.\n\nPozostało jednak pytanie, co z nimi zrobić. Jedni domagali się natychmiastowego ścięcia, inni opowiadali się za dłuższą karą.\n\nPo krótkiej debacie postanowiono więc, że dawni możnowładcy spędzą resztę życia w koszmarnym domu pracy.\n\nTak rozpoczyna się nasza opowieść o zasłużonej sprawiedliwości, zemście i odrodzeniu niegdyś wspaniałego narodu Imperii!"
