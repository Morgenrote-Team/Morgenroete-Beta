 manzoni_writer_crime_book_bestseller_title_1_loc: "„Sprawa Szalonego Kucharza”"
 manzoni_writer_crime_book_bestseller_flavor_1_loc: "Na pełnym morzu, gdzie niebezpieczeństwo czai się na każdym kroku, okrętowy kucharz niepodzielnie włada swoim kuchennym królestwem. Kiedy jednak seria tajemniczych zaginięć wstrząsa załogą, podejrzenia padają na jedynego człowieka, który dzierży w swych rękach władzę nad życiem i śmiercią.\n\n„Kurczak twój suchy jest niczym pieprz, aż wody morskiej mi się zachciewa” – rzecze jeden z marynarzy i odwraca się, nieświadomy, że właśnie w tej chwili jego los został przypieczętowany. Kucharz zaczyna ostrzyć swój tasak, a jego głos ocieka jadem, gdy odpowiada ze złowrogim uśmiechem: „Nie lękaj się, dobry panie. Jutro o poranku ucztować będziesz niczym sam król”.\n\nDołącz do naszego nieustraszonego kucharza, który przyrządza prawdziwą ucztę z oszustwa i zdrady w „Sprawie Szalonego Kucharza” – trzymającej w napięciu opowieści o morderstwie na pełnym morzu."
