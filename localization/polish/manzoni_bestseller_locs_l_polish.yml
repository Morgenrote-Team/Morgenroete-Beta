 manzoni_writer_mystery_book_bestseller_title_2_loc: "„Karmazynowy Sztylet”"
 manzoni_writer_mystery_book_bestseller_flavor_2_loc: "W skąpanych w blasku księżyca cieniach nocy karmazynowy błysk przeszywa ciemność, zwiastując grozę i rozpacz. „Karmazynowy Sztylet” rozbrzmiewa niczym syreni śpiew, wabiąc niczego niepodejrzewające dusze w swoje śmiercionośne objęcia. Wykute w płomieniach pradawnej magii przeklęte ostrze łaknie krwi, a jego złowroga moc zatruwa serca tych, którzy odważą się nim władać. Zanurz się w otchłani szaleństwa i obsesji w tej mrożącej krew w żyłach opowieści o nadprzyrodzonej grozie i mrocznym uroku władzy."
