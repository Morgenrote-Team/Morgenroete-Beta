 khaldun.101.t: "Al-Karawijjin: Centrum nauki"
 khaldun.101.d: "Wieki temu Al-Karawijjin było centrum nauki i wiedzy. Teraz ponownie zajęło należne mu miejsce wśród najważniejszych uniwersytetów świata."
 khaldun.101.f: "„Al-Karawijjin jest uniwersytetem dłużej niż wszystkie uniwersytety w Europie. Przechowywano tu wiele ksiąg, lecz z czasem uczelnia zaczęła podupadać. Dzisiejszy dzień wyznacza moment, w którym ten uniwersytet ponownie zajmuje należne mu miejsce!”"
 khaldun.101.g: "Al-Karawijjin będzie latarnią wiedzy!"
 khaldun.101.h: "Al-Karawijjin będzie latarnią matematyki i inżynierii!"
 khaldun.101.i: "Al-Karawijjin będzie latarnią historii naturalnej!"
 khaldun.101.j: "Al-Karawijjin będzie latarnią nauk humanistycznych!"