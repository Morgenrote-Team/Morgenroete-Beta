 academics.1010.t: "Kobiety na studiach?"
 academics.1010.d: "Kilka kobiet złożyło podania o przyjęcie na studia na jednym z naszych uniwersytetów. Pojawiło się więc pytanie, czy mogą legalnie studiować i jakie jest oficjalne stanowisko naszego rządu wobec kształcenia kobiet."
 academics.1010.f: "„Mózgi kobiet nie są stworzone do logicznego myślenia, lecz raczej do kierowania się emocjami. Nie powinno się im pozwalać studiować!”\n\n„Po prostu boisz się, że kobieta okaże się bardziej zdolnym naukowcem od ciebie. A to z pewnością się stanie, skoro twoim argumentom brakuje jakichkolwiek podstaw naukowych! Pozwólmy kobietom studiować na takich samych warunkach jak mężczyznom!”"
 academics.1010.g: "Pozwólmy im studiować!"
 academics.1010.h: "Chwila, do tej pory nie mogły studiować?"
 academics.1010.i: "Miejsce kobiety jest przy domowym ognisku!"
 academics.1011.t: "Genialna naukowczyni"
 academics.1011.d: "[SCOPE.sCharacter('academics_female_scientist').GetFullName] ukończyła studia z najlepszym wynikiem na swoim roku na jednym z naszych uniwersytetów. W dziedzinie zdominowanej przez mężczyzn zdołała ukończyć studia w rekordowym czasie i z niecierpliwością czeka, by rozpocząć pracę w swojej specjalizacji. Jest genialną..."
 academics.1011.f: "Moje najszczersze gratulacje z okazji zdobycia tak niezwykłego dyplomu! Kto by pomyślał, że kobieta może tego dokonać!"
 academics.1011.g: "...inżynierką"
 academics.1011.h: "...astronomką"
 academics.1011.i: "...przyrodniczką"
 academics.1011.j: "...paleontolożką"
 academics.1011.k: "...archeolożką"
 academics.1011.l: "...antropolożką"
 academics.1011.m: "Nie potrzebujemy jej."
