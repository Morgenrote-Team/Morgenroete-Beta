 academics.6.d: "Po spędzeniu dziesięcioleci [SCOPE.sCharacter('academics_retired_person_scope').GetHerHis] życia na odkrywaniu nowych [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals$')], roślin i innych form życia, [SCOPE.sCharacter('academics_retired_person_scope').GetFullName] postanowił przejść na emeryturę. [SCOPE.sCharacter('academics_retired_person_scope').GetSheHe|U] nie będzie już pracować jako nasz [concept_dubois_naturalist]."
 academics.7.d: "Po spędzeniu dziesięcioleci [SCOPE.sCharacter('academics_retired_person_scope').GetHerHis] życia na odkrywaniu nowych skamieniałości, rekonstrukcji dinozaurów i innych wymarłych gatunków, [SCOPE.sCharacter('academics_retired_person_scope').GetFullName] postanowił przejść na emeryturę. [SCOPE.sCharacter('academics_retired_person_scope').GetSheHe|U] nie będzie już pracować jako nasz [concept_dubois_paleontologist]."
 academics.7.f: "[GetPlayer.MakeScope.Var('dubois_paleontologist_var').GetCharacter.GetCustom('dubois_paleontologist_achievements_switch_to_character_scope_type')]"
 academics.9.d: "Po spędzeniu dziesięcioleci [SCOPE.sCharacter('academics_retired_person_scope').GetHerHis] życia na odkrywaniu pozostałości starożytnych cywilizacji, [SCOPE.sCharacter('academics_retired_person_scope').GetFullName] postanowił przejść na emeryturę. [SCOPE.sCharacter('academics_retired_person_scope').GetSheHe|U] nie będzie już pracować jako nasz [concept_lepsius_archaeologist]."
