 rule_academics_mission_rule: "#tooltip:[GetRawTextTooltipTag('mr_morgenroete_tt')] @mr_morgenroete_icon! #!Misje akademickie"
 setting_academics_missions_rule: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_academics_missions_rule_desc #p Uruchomione #! #! #!"
 setting_academics_missions_rule_desc: "Co dziesięć lat otrzymasz [Concept('concept_academics_academic_mission','$concept_academics_mission$')] dla twojej Akademii. Te misje mogą przykładowo obejmować wybudowanie budynku akademickiego lub odnalezienie określonej ilości okazów. Te misje dadzą ci niewielką nagrodę."
 setting_academics_no_missions_rule: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_academics_no_missions_rule_desc #n Niedostępne #!#!#!"
