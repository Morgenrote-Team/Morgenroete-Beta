 academics.2004.f: "Drogi Doktorze `[ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName]`\n\n   Mamy wielką nadzieję, że będzie Pan w stanie stworzyć nową mapę gwiazd z wieloma nowymi gwiazdami. Sądząc po Pańskich doskonałych umiejętnościach, nie powinno to stanowić żadnego problemu. Dlatego oczekujemy doskonałej nowej mapy gwiazd w ciągu 10 lat.\n\nPodpisano, Pańscy koledzy z [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')]"
 academics.1.d: "Po spędzeniu dziesięcioleci [SCOPE.sCharacter('academics_retired_person_scope').GetHerHis] życia na projektowaniu i konstruowaniu mostów, maszyn oraz budynków, [SCOPE.sCharacter('academics_retired_person_scope').GetFullName] przechodzi teraz na emeryturę. [SCOPE.sCharacter('academics_retired_person_scope').GetSheHe|U] nie będzie już aktywnie pełnić roli naszego [concept_tesla_engineer]."
 academics.1.g: "[SCOPE.sCharacter('academics_retired_person_scope').GetSheHe|U] zasłużył na [SCOPE.sCharacter('academics_retired_person_scope').GetHerHis] emeryturę!"
 academics.2.d: "Po spędzeniu dziesięcioleci [SCOPE.sCharacter('academics_retired_person_scope').GetHerHis] życia na odkrywaniu nowych gwiazd, mgławic i innych zjawisk astronomicznych, [SCOPE.sCharacter('academics_retired_person_scope').GetFullName] postanowił przejść na emeryturę. [SCOPE.sCharacter('academics_retired_person_scope').GetSheHe|U] nie będzie już pracować jako nasz [concept_verrier_astronomer]."
