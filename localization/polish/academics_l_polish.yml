 academics.2401.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('academics_railway_line_title_custom_loc')]"
 academics_spanisch_broetli_title_loc: "Spanisch-Brötli-Bahn"
 academics_ferrovia_torino_genova_title_loc: "Ferrovia Torino-Genova"
 academics_generic_title_loc: "Pierwsza linia kolejowa w [SCOPE.GetRootScope.GetCountry.GetName]"
 academics.2401.d: "[SCOPE.GetRootScope.GetCountry.GetCustom('academics_railway_line_desc_custom_loc')]"
 academics_spanisch_broetli_desc_loc: "Szwajcaria uruchomiła swoje pierwsze połączenie kolejowe z Zurychu do Baden. Miejmy nadzieję, że ta linia kolejowa ułatwi transport towarów, ludzi i poczty oraz przyczyni się do rozwoju przemysłu w Baden i Zurychu. Przynajmniej pozwala zamożnym ziemianom z Zurychu wysyłać rano swoich służących do Baden po świeże Spanisch Brötli — słynne słodkie bułeczki wypiekane przez znanego piekarza z Baden. Przemysłowcy są bardzo zadowoleni z tej nowej linii kolejowej."
 academics_ferrovia_torino_desc_title_loc: "Linia kolejowa Ferrovia Torino-Genova została oficjalnie otwarta w obecności [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullNameNoFormatting]. Linia kolejowa z Torino do Genovy jest arcydziełem włoskiej inżynierii. Ta dwutorowa trasa ma 169 kilometrów długości, ponad 30 mostów, a dzięki liczącemu 3259 metrów tunelowi Giovi posiada najdłuższy tunel na świecie.\nMiejmy nadzieję, że linia kolejowa przyspieszy transport towarów i pasażerów między Torino a Genovą oraz przyczyni się do rozwoju naszego przemysłu. Oczywiście nasi najważniejsi przemysłowcy są zachwyceni tą pierwszą linią kolejową."
 academics_generic_desc_loc: "Budowa naszej pierwszej linii kolejowej nie była ani łatwa, ani tania. Jednak dzięki doskonałej [SCOPE.GetRootScope.GetCountry.GetAdjectiveNoFormatting] inżynierii ukończono ją w rekordowym czasie. Przemysłowcy są bardzo zadowoleni, ponieważ linia ta zapewnia im szybki sposób transportu towarów i surowców."
 academics.2401.f: "[SCOPE.GetRootScope.GetCountry.GetCustom('academics_railway_line_flavor_custom_loc')]"
 academics_spanisch_broetli_flavor_loc: "Apetyczny zapach Spanisch Brötli dociera do twojego nosa. Ten pyszny wypiek został dostarczony pierwszym pociągiem w Szwajcarii, łączącym Zurych z Baden.\n\n#b Historycznie#! linia kolejowa z Zurychu do Baden została ukończona w 1847 roku, krótko przed wybuchem szwajcarskiej wojny domowej, „Sonderbundskrieg”. Cztery lokomotywy umożliwiały cztery połączenia dziennie. Pokonanie 23 kilometrów zajmowało im około 45 minut. Schweizerische Nordbahn, jak oficjalnie ją nazwano, odniosła niewielki sukces gospodarczy i wkrótce porzucono plany przedłużenia linii do Aarau, a jedno z codziennych połączeń zlikwidowano.\n\nRekonstrukcja „Spanisch-Brötli-Bahn” istnieje do dziś i czasami kursuje jako pociąg historyczny po współczesnych torach kolejowych w Szwajcarii."
 academics_ferrovia_torino_genova_flavor_loc: "Arcybiskup Genovy ochrzcił pierwszą lokomotywę. Następnie ten kolos ruszył z miejsca. Był to pierwszy pociąg, który miał przejechać z Genovy aż do Torino.\n\n#b Historycznie,#! linia ta była pierwszą linią kolejową w Sardynii-Piemoncie. Jej budowę zlecił król Karol Albert I 18 lipca 1844 roku. Jeszcze przed ukończeniem całej trasy kolejne jej odcinki były stopniowo otwierane jako jednotorowe. 6 grudnia 1853 roku linia została oficjalnie otwarta.\nLinia kolejowa szybko stała się najczęściej używaną trasą we Włoszech. Szczególnie ważna była możliwość transportu towarów z portu w Genovie. W 1889 roku przez przełęcz Giovi zbudowano alternatywną linię o mniejszych nachyleniach niż stara trasa.\nW 1898 roku załoga pociągu udusiła się w tunelu Giovi, a lokomotywa jechała dalej bez maszynisty. Uderzyła w oczekujący pociąg, w wyniku czego zginęło łącznie 13 osób. W rezultacie linię zelektryfikowano."
 academics_generic_flavor_loc: "„Najwyższy czas, żebyśmy i my mieli własną linię kolejową! Zostajemy daleko w tyle za konkurencją! Teraz wreszcie możemy transportować wszystkie nasze produkty w przyzwoity sposób!”"
 academics.2401.g: "Tak, możemy!"
 academics.2402.t: "Nie udało nam się zbudować naszej pierwszej linii kolejowej"
 academics.2402.d: "Minęło 5 lat, odkąd przemysłowcy zwrócili się do nas z żądaniem budowy pierwszej linii kolejowej w naszym kraju. Nie udało nam się ukończyć jej na czas. Z pewnością wpłynie to na opinię przemysłowców o naszym rządzie."
 academics.2402.f: "„Nie potraficie nawet zbudować linii kolejowej. Wasz rząd to kompletna porażka. Wstydźcie się!”"
 academics.2402.g: "Nie, nie udało nam się."
