 je_academics_found_archaeological_museum: "Skupienie na archeologii: Załóż muzeum"
 je_academics_found_archaeological_museum_reason: "[SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] chce, abyśmy zbudowali Muzeum Archeologiczne, które poszerzy wiedzę, ale także poprawi poziom życia naszych intelektualistów. Budowa muzeum wymaga #p 5#! [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')], które musi odnaleźć [concept_lepsius_archaeologist] podczas [concept_lepsius_expedition], chyba że dopisze nam niewiarygodne szczęście i zdobędziemy je dzięki przypadkowemu darowi lub lokalnym wykopaliskom.\nJest to również bardzo ważne, ponieważ zawodowe archeologiczne powiedzenie „To powinno trafić do muzeum!” nie miałoby większego sensu bez prawdziwego muzeum.\n\nWłaściwie byłoby to dość krępujące."
