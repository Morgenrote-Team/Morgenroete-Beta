 academics.4001.t: "Akademia Mihăileană"
 academics.4001.d: "W 1834 roku [SCOPE.sCharacter('character_scope').GetFullName] uzyskał pozwolenie na utworzenie akademii od [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('ruler_scope').GetFullName]. Academia Mihăileană została zainaugurowana w 1835 roku. Teraz musimy zdecydować, na czym [SCOPE.sCharacter('character_scope').GetLastName] powinien skupić się przez resztę swojej kariery."
 academics.4001.f: "„Tak, mój [SCOPE.sCharacter('ruler_scope').GetPrimaryRoleTitle], namalowałem to własnoręcznie. Jest to romantyczna scena przedstawiająca Świątynię Miłości. Oczywiście piszę również książki i wiersze oraz zajmowałem się pracami inżynieryjnymi. A jeśli się nudzę, często tłumaczę lub zagłębiam się w historię.”"
 academics.4001.g: "Powinien skupić się na inżynierii."
 academics.4001.h: "Powinien skupić się na pisaniu."
 academics.4001.i: "Powinien skupić się na malarstwie."
 academics.4001.j: "Nie potrzebujemy go."