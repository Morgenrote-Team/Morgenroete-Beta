 je_academics_first_railway: "Skupienie na przemyśle: Zbuduj pierwszą linię kolejową w [SCOPE.GetRootScope.GetCountry.GetName]"
 je_academics_first_railway_reason: "Teraz, gdy wynalazek kolei dotarł do [SCOPE.GetRootScope.GetCountry.GetName], wielu naszych przemysłowców chce, abyśmy zbudowali taką linię, by ułatwić transport towarów. Pomogłoby nam to stać się potęgą przemysłową."
 academics.2400.t: "Potrzebujemy kolei!"
 academics.2400.d: "Koleje umożliwiają łatwiejszy transport towarów. Dlatego najważniejsi przemysłowcy z [SCOPE.GetRootScope.GetCountry.GetName] domagają się budowy linii kolejowej w naszym kraju w ciągu najbliższych 5 lat."
 academics.2400.f: "„Nadal transportujemy nasze produkty po drogach gruntowych i rzekami. Ta sytuacja jest nie do przyjęcia. Gdybyśmy mieli lepszy sposób transportowania towarów i surowców, nasze zyski gwałtownie by wzrosły, a my moglibyśmy budować więcej fabryk, co przełożyłoby się na lepsze warunki życia dla wszystkich. Zbudujcie kolej natychmiast!”"
 academics.2400.g: "Czy możemy ją zbudować?"
 academics_industrialists_happy_modifier: "Przemysłowcy są zadowoleni"
 academics_industrialists_discontent_modifier: "Niezadowolenie przemysłowców"
