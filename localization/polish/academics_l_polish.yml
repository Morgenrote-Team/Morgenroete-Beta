 academics_recruit_foreign_scientist: "Zwerbuj zagranicznego naukowca"
 academics_recruit_foreign_scientist_action_name: "Zwerbuj zagranicznego naukowca"
 academics_recruit_foreign_scientist_desc: "Zwerbuj [Concept('concept_academics_academic','$concept_academics_scientist$')] z obcego kraju, który jest bardziej rozwinięty od nas. Ponieważ najlepsi naukowcy pozostaną w swoich krajach pochodzenia, nie będziemy mogli pozyskać najlepszych z nich. Dlatego zwerbowany naukowiec będzie potrzebował więcej czasu, aby zdobywać doświadczenie."
 academics_recruit_foreign_scientist_proposal_notification_name: "Wyślij naukowca do [INITIATOR_COUNTRY.GetName]"
 academics_recruit_foreign_scientist_proposal_notification_desc: "[INITIATOR_COUNTRY.GetName] prosi nas o wysłanie im jednego z naszych mniej znaczących [Concept('concept_academics_academic','$concept_academics_scientists$')] w zamian za pewną sumę pieniędzy, ponieważ sami nie są w stanie ich zwerbować. Nie spowoduje to utraty żadnego z twoich naukowców, lecz wyśle im nowego, niedoświadczonego naukowca."
