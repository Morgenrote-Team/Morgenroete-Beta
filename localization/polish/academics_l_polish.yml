 academics.2104_reward_tt: "W nagrodę zyskamy #p 5% prestiżu#! na 5 lat, dodatkowo [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] otrzyma #p 5 poparcia#!, a koszt technologii produkcyjnych zostanie zmniejszony o #p 5%#! na 3 lata. Nasz archeolog otrzyma #p 15 doświadczenia#!."
 academics.2110_reward_tt: "W nagrodę zyskamy #p 5% prestiżu#! na 5 lat, dodatkowo [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] otrzyma #p 5 poparcia#!, a koszt technologii produkcyjnych zostanie zmniejszony o #p 5%#!. Nasz archeolog otrzyma #p 25 doświadczenia#!."
 academics.2112_reward_tt: "W nagrodę zyskamy #p 10% prestiżu#! na 5 lat, dodatkowo [GetInterestGroupVariant('ig_intelligentsia',GetPlayer).GetName] otrzyma #p 5 poparcia#!, a koszt technologii produkcyjnych zostanie zmniejszony o #p 5%#!. Nasi ludzie będą również cieszyć się o #p 1 wyższym standardem życia#!. Nasz archeolog otrzyma #p 50 doświadczenia#!."
 academics.2309.t: "Ambicja [SCOPE.sCharacter('dubois_paleontologist_scope').GetFullName]"
 academics.2309.d: "Profesor [SCOPE.sCharacter('dubois_paleontologist_scope').GetLastName] jest uważany za krajowy autorytet w dziedzinie paleontologii. Towarzystwo Naukowe chciałoby uczynić [SCOPE.sCharacter('dubois_paleontologist_scope').GetHerHim] osobistością poszukiwaną na arenie międzynarodowej, aby wykorzystać [SCOPE.sCharacter('dubois_paleontologist_scope').GetHerHim] jako akademicką twarz reprezentacyjną."
 academics.2309.f: "Doszliśmy do stanowczego wniosku, że nasz kolega, prof. [SCOPE.sCharacter('dubois_paleontologist_scope').GetLastNameNoFormatting], idealnie nadawałby się do reprezentowania naszego narodu jako naukowa wizytówka. [SCOPE.sCharacter('dubois_paleontologist_scope').GetSheHe] powinien otrzymać wszelkie możliwe wsparcie, aby zwiększyć [SCOPE.sCharacter('dubois_paleontologist_scope').GetHerHim] renomę. Szczególnie młodych ludzi zmotywowałoby to do samodzielnego podążania ścieżką kariery naukowej.\n\nPodpisano, członkowie [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')]"
 academics.2309.g: "[SCOPE.sCharacter('dubois_paleontologist_scope').GetSheHe|U] stanie się sławny."
 academics.2309.h: "[SCOPE.sCharacter('dubois_paleontologist_scope').GetSheHe|U] nie powinien stać się megalomanem."
 academics.2310.t: "Paleontologiczna chwała"
 academics.2310.d: "Wraz z [SCOPE.sCharacter('dubois_paleontologist_scope').GetHerHis] wzrostem sławy jako paleontologa, [SCOPE.sCharacter('dubois_paleontologist_scope').GetFullName] jest teraz naukową wizytówką, której pragnęło Towarzystwo Naukowe."
 academics.2310.f: "Otrzymujemy teraz wielu nowych studentów, których inspiruje wielkość i sława profesora [SCOPE.sCharacter('dubois_paleontologist_scope').GetLastNameNoFormatting]. [SCOPE.sCharacter('dubois_paleontologist_scope').GetSheHe|U] nie tylko ożywił [SCOPE.sCharacter('dubois_paleontologist_scope').GetHerHis] własną dziedzinę, ale także fundamentalnie rozbudził fascynację naukami. Bycie naukowcem nie jest już tylko dziwaczną karierą o niewielkich perspektywach, lecz raczej ekscytującym zawodem, który obiecuje sławę i przygodę.\n\nPodpisano, członkowie [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')]"
