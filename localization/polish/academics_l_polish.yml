 academics_rating_age_information_tt: "Im starszy jest Uczony, tym mniej czasu z nim pozostaje. Uczeni mogą zacząć przechodzić na emeryturę w wieku 65 lat i niemal na pewno przejdą na nią w wieku 70 lat.\n#V Wskazówka:#! Staraj się rekrutować młodszych Uczonych, aby mieć pewność, że będziesz mógł korzystać z ich usług przez dłuższy czas."
 academics_rating_experience_information_tt: "Im więcej $concept_academics_experience$, tym lepiej. $concept_academics_experience$ znacznie zwiększy zdolności i efektywność twoich Uczonych.\n#V Wskazówka:#! Potraktuj to jako najważniejszy czynnik przy wyborze Uczonego."
