 je_academics_egyptian_artifacts_reason: "[SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] chce, abyśmy odnaleźli co najmniej #p 25#! egipskich [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')], które musi odkryć [concept_lepsius_archaeologist] podczas [concept_lepsius_expedition] lub [concept_lepsius_excavation], chyba że dopisze nam niewiarygodne szczęście i zdobędziemy je dzięki przypadkowemu darowi lub lokalnym wykopaliskom."
