 academics_competition_with_rival_won_specimen: "Wygraliśmy wyścig o okazy"
 je_academics_rivalry_for_specimen: "Skupienie na naturalizmie: Wyścig o okazy"
 je_academics_rivalry_for_specimen_reason: "[SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] chce, abyśmy odnaleźli więcej [Concept('concept_dubois_specimen','$concept_dubois_specimens$')] niż nasz rywal [SCOPE.sCountry('target').GetName].\n\nNasze #b łączne okazy#!: [ROOT.Var('dubois_specimen').GetValue|0+]\n#b Łączne okazy#! kraju [SCOPE.sCountry('target').GetName]: [ROOT.Var('je_specimen_rival_nation_var').GetVariable('dubois_specimen').GetValue|0+]"
 je_academics_rivalry_for_specimen_success: "Ty ([GetPlayer.MakeScope.Var('dubois_specimen').GetValue|0+]) masz więcej [Concept('concept_dubois_specimen','$concept_dubois_specimens$')] niż [SCOPE.sCountry('target').GetName] ([GetPlayer.MakeScope.Var('je_specimen_rival_nation_var').GetVariable('dubois_specimen').GetValue|0+])."
 academics.2201.t: "Zdumiewająca kolekcja okazów"
 academics.2201.d_rival: "Zgromadziliśmy większą kolekcję [Concept('concept_dubois_specimen','$concept_dubois_specimens$')] niż nasz rywal [ROOT.Var('je_specimen_rival_nation_var').GetCountry.GetName]. [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] oraz nasi obywatele są podekscytowani tym zwycięstwem naszego narodu!"
 academics.2201.d_rival_gone: "Nasz rywal w dążeniu do stworzenia ogromnej kolekcji biologicznej odpadł z rywalizacji. [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] oraz nasi obywatele są podekscytowani tym zwycięstwem naszego narodu!"
 academics.2201.f: "Wreszcie mamy #b kolekcję okazów#! godną naszego wielkiego narodu. Nadszedł czas, abyśmy mogli prezentować najbardziej fascynujące istoty żyjące na tej planecie. [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] jest na razie zadowolone z naszej kolekcji. Oczywiście będziemy musieli nadal ją powiększać, aby zapobiec temu, by inne narody mordowały te biedne zwierzęta i rośliny.\n\nPodpisano, członkowie [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')]"
 academics.2201.g: "Godna kolekcja!"
 academics.2202.t: "Nie udało nam się zgromadzić więcej okazów niż [ROOT.Var('je_specimen_rival_nation_var').GetCountry.GetName]"
 academics.2202.d: "Nie udało nam się powiększyć naszej kolekcji okazów bardziej niż nasi rywale z [ROOT.Var('je_specimen_rival_nation_var').GetCountry.GetName]. Członkowie [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] są całkowicie zdruzgotani."
 academics.2202.f: "Teraz znaleźli także najbardziej fascynujące zwierzę na świecie. Latającą jaszczurkę. Nazwali ją na cześć prezesa swojej Akademii Nauk. Zawiodłeś.\n\n[SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')]"
 academics.2202.g: "Nigdy się po tym naukowo nie pozbieram!"
 academics.2203.t: "[ROOT.Var('academics_mission_interest_group_var').GetInterestGroup.GetName] chce [SCOPE.GetRootScope.GetCountry.GetCustom('je_academics_get_exotic_animal_custom_loc')] dla naszego zoo"
 academics.2203.d: "[ROOT.Var('academics_mission_interest_group_var').GetInterestGroup.GetName] zwróciła się do naszego rządu z petycją o pozyskanie [SCOPE.GetRootScope.GetCountry.GetCustom('je_academics_get_exotic_animal_custom_loc')] dla naszego [concept_dubois_zoo] w ciągu 10 lat."
 academics.2203.f: "Istnieje [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animal$')], którego brakuje w naszym zoo. Potrzebujemy, aby nasz rząd odnalazł [SCOPE.GetRootScope.GetCountry.GetCustom('je_academics_get_exotic_animal_custom_loc')] i sprowadził go do naszego zoo. W końcu nie możemy pozwolić, aby w naszym zoo zabrakło tego wspaniałego zwierzęcia.\n\nPodpisano, przedstawiciele [ROOT.Var('academics_mission_interest_group_var').GetInterestGroup.GetName]"
 academics.2203_goal_tt: "Będziesz musiał pozyskać [GetPlayer.MakeScope.GetCountry.GetCustom('je_academics_get_exotic_animal_custom_loc')] dla naszego [concept_dubois_zoo] w ciągu 10 lat."
 academics.2203_reward_tt: "W nagrodę [GetPlayer.MakeScope.Var('academics_mission_interest_group_var').GetInterestGroup.GetName] zyska #p 5#! aprobaty wobec twojego rządu oraz #p 5%#! większą atrakcyjność dla populacji, a twój kraj otrzyma #p 5%#! więcej prestiżu na 5 lat."
 academics.2203.g: "Trzeba złapać je wszystkie!"
 academics.2203.h: "Przewodzę wielkiemu narodowi. Nie zajmuję się sprawami zoo!"
 je_academics_get_exotic_animal: "Skupienie na naturalizmie: Pozyskaj [GetPlayer.MakeScope.GetCountry.GetCustom('je_academics_get_exotic_animal_custom_loc')] dla naszego zoo"
 je_academics_get_exotic_animal_reason: "[ROOT.Var('academics_mission_interest_group_var').GetInterestGroup.GetName] chce, abyśmy pozyskali [SCOPE.GetRootScope.GetCountry.GetCustom('je_academics_get_exotic_animal_custom_loc')] dla naszego [concept_dubois_zoo].\nIstnieje wiele sposobów na zdobycie takiego [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animal$')]."
 academics.2204.t: "Nowy dom dla [SCOPE.GetRootScope.GetCountry.GetCustom('je_academics_get_exotic_animal_custom_loc')]"
 academics.2204.d: "Udało nam się pozyskać [SCOPE.GetRootScope.GetCountry.GetCustom('je_academics_get_exotic_animal_custom_loc')] dla naszego [concept_dubois_zoo]. Z pewnością ucieszy to [ROOT.Var('academics_mission_interest_group_var').GetInterestGroup.GetName]."
 academics.2204.f: "Twój rząd z powodzeniem pozyskał [SCOPE.GetRootScope.GetCountry.GetCustom('je_academics_get_exotic_animal_custom_loc')] dla naszego wspaniałego kraju. Pokazuje to, że nasz kraj jest na tyle potężny, by przeznaczać swoje zasoby na rozrywkę dla naszej ludności. Dziękujemy!\n\nPodpisano, przedstawiciele [ROOT.Var('academics_mission_interest_group_var').GetInterestGroup.GetName]"
 academics.2204.g: "Wspaniałe zwierzę!"
 academics.2205.t: "Nowe zwierzę w naszym zoo"
 academics.2205.d: "Nie udało nam się pozyskać [SCOPE.GetRootScope.GetCountry.GetCustom('je_academics_get_exotic_animal_custom_loc')] dla naszego zoo. [ROOT.Var('academics_mission_interest_group_var').GetInterestGroup.GetName] nie będzie zadowolona."
 academics.2205.f: "Nie potraficie nawet pozyskać zwierzęcia dla naszego zoo. Jak mamy wam ufać, że potraficie kierować tym krajem?\n\nPodpisano, przedstawiciele [ROOT.Var('academics_mission_interest_group_var').GetInterestGroup.GetName]"
 academics.2205.g: "Nie mamy czasu na jakieś przypadkowe zwierzęta!"
 academics_exotic_animal_acquired_ig_modifier: "Pozyskano egzotyczne zwierzę"
 academics_exotic_animal_not_acquired_ig_modifier: "Nie pozyskano egzotycznego zwierzęcia"
 academics_exotic_animal_acquired_country_modifier: "Pozyskano egzotyczne zwierzę"
 academics.2206.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] domaga się zoo"
 academics.2206.d: "Dotychczasowe sukcesy naukowe w dziedzinie badań przyrodniczych można określić jako skromne. Dlatego niektórzy wpływowi przedstawiciele świata nauki zwrócili się do rządu z petycją."
 academics.2206.f: "Aby wzmocnić badania biologiczne w ogóle, a badania zoologiczne w szczególności, niezbędne jest zoo z kolekcją rzadkich zwierząt. Taka placówka znacznie poprawiłaby również dobrobyt ludności. [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] sugeruje zatem wykorzystanie wszelkich dostępnych środków w celu utworzenia narodowego zoo i zaoferowałoby również pomoc w wyszkoleniu energicznego zoologa.\n\nPodpisano, Rada [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')]"
 academics.2206.g: "Z pewnością uda się znaleźć kilka zwierząt."
 academics.2206.h: "Czy ci ludzie nie mają nikogo innego, komu mogliby działać na nerwy?"
 academics.2207.t: "Nowe zoo"
 academics.2207.d: "Niektórzy przedstawiciele Towarzystwa Naukowego osobiście uczestniczyli w inauguracji nowego zoo."
 academics.2207.f: "Doskonałe, naprawdę doskonałe jest to nowe zoo. Członkowie spędzili wspaniały dzień i są szczególnie zadowoleni z darmowej karmy dla zwierząt. Mamy nadzieję, że to dopiero początek i że nowo otwarte zoo zostanie wkrótce rozbudowane oraz zapełnione kolejnymi cennymi, egzotycznymi i wspaniałymi stworzeniami.\n\nPodpisano, Rada [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')]"
 academics.2207.g: "Zostawcie mi trochę orzeszków!"
 academics.2208.t: "Brak zoo"
 academics.2208.d: "[SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] napisało dziś pełen goryczy list, skarżąc się, że życzenie dotyczące nowego zoo nie zostało spełnione."
 academics.2208.f: "Ku naszemu wielkiemu ubolewaniu stwierdziliśmy, że obecny rząd zdaje się składać z jawnych wrogów nauki, biologii w ogóle, a zoologii w szczególności, albo przynajmniej z bandy bezdusznych ludzi nienawidzących zwierząt. Być może w takim środowisku te wspaniałe zwierzęta i tak zostałyby zmarnowane.\n\nPodpisano, Rada [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')]"
 academics.2208.g: "Jeśli będziecie się upierać, z pewnością nie spełni się żadne z waszych życzeń."
 academics.2206_goal_tt: "Będziesz musiał zebrać #p 5#! [Concept('concept_dubois_zoo_animal','$concept_dubois_zoo_animals$')] i zbudować [concept_dubois_zoo] w ciągu #n 5#! lat."
 academics.2206_reward_tt: "W nagrodę nasz przyrodnik otrzyma #p 50 doświadczenia#!. Jeśli nie mamy jeszcze przyrodnika, otrzymamy jednego."
 academics.2209.t: "Rozbudowa zoo"
 academics.2209.d: "List otwarty od [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] ubolewa nad tym, że Narodowe Zoo oferuje niewielką różnorodność."
 academics.2209.f: "Chociaż nasza stolica ma już zoo, które zapewnia pewną różnorodność zarówno naukowcom badającym zwierzęta, jak i odwiedzającym je mieszkańcom, placówka ta ledwie osiąga standard godny wielkości miasta i znaczenia naszego kraju. Aby zwiększyć prestiż, zapewnić rozrywkę ludności i przyczynić się do rozwoju nauki, zalecamy więc rozbudowę obecnego zoo przynajmniej do średnich rozmiarów.\n\nPodpisano, Rada [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')]"
 academics.2209.g: "Sprowadźcie więcej zwierząt!"
 academics.2209.h: "Mamy ważniejsze rzeczy do roboty."
 academics.2210.t: "Jeszcze większe zoo"
 academics.2210.d: "List otwarty od [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] ubolewa nad tym, że Narodowe Zoo oferuje niewielką różnorodność."
 academics.2210.f: "Chociaż w przeszłości pozwoliliśmy naszemu zoo rozrosnąć się do przyzwoitych rozmiarów, wciąż nie cieszy się ono międzynarodowym znaczeniem, jakie mogłoby i powinno mieć, aby imponować innym narodom naszą pasją do zoologii. Potrzebujemy coraz więcej egzotycznych zwierząt. Stawką jest tu nie tylko nauka, lecz także nasz prestiż. Zdecydowanie zalecamy rozbudowę naszego zoo do dużych rozmiarów.\n\nPodpisano, Rada [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')]"
 academics.2211.t: "Tętniący życiem ogród zoologiczny"
 academics.2211.d: "Rozbudowany Ogród Zoologiczny jest jedną z głównych atrakcji stolicy i cieszy się dużą popularnością zarówno wśród uczonych, jak i zwykłych obywateli. Towarzystwo Naukowe z zadowoleniem odnotowuje, że jego życzenie zostało spełnione."
 academics.2211.f: "Dobra robota! Nowe zoo jest bardziej przestronne i spełnia wymóg prezentowania szerszego przekroju światowej fauny. Mam nadzieję, że pomyśleliście też o dziobaku? Chcielibyśmy objąć go patronatem. Czy przypadkiem nie ma na imię Perry?\n\nPodpisano, Rada [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')]"
 academics.2211.g: "Zwierzęta świata w naszym domu!"
 academics.2212.t: "Zoologiczne rozczarowanie"
 academics.2212.d: "Towarzystwo Naukowe zastanawia się, czy zwracanie się do rządu ma jeszcze jakikolwiek sens, skoro jego postulaty są w taki sposób lekceważone — nawet tak drobna prośba jak zapewnienie kilku zwierząt dla zoo."
 academics.2212.f: "Jesteśmy bardzo, bardzo rozczarowani.\n\nPodpisano, Rada [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')]"
 academics.2212.g: "Powinni prowadzić badania, zamiast bawić się w zoo."
 academics.2209_goal_tt: "Będziesz musiał rozbudować swój [concept_dubois_zoo] do #p rozmiaru 3#! (średniej wielkości zoo) w ciągu #n 10#! lat."
 academics.2210_goal_tt: "Będziesz musiał rozbudować swój [concept_dubois_zoo] do #p rozmiaru 4#! (dużego zoo) w ciągu #n 10#! lat."
 academics.2209_reward_tt: "W nagrodę nasz przyrodnik otrzyma #p 50 doświadczenia#!. Jeśli nie mamy jeszcze przyrodnika, otrzymamy jednego."
 je_academics_found_zoo: "Skupienie na naturalizmie: Załóż zoo"
 je_academics_found_zoo_reason: "[SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] chce, abyśmy zbudowali [concept_dubois_zoo], które poszerzy wiedzę, ale także poprawi poziom życia naszych intelektualistów. Budowa zoo wymaga #p 5#! [Concept('concept_dubois_zoo_animal','$concept_dubois_zoo_animals$')], które może schwytać [concept_dubois_naturalist] podczas lokalnej Ekspedycji Zoologicznej lub safari Heia. Zwierzęta można również kupować od innych krajów."
 je_academics_medium_zoo: "Skupienie na naturalizmie: Rozbuduj zoo"
 je_academics_medium_zoo_reason: "[SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] poprosiło o rozbudowę [concept_dubois_zoo]. Mamy łącznie dziesięć lat, aby rozbudować nasze zoo do #p średniej wielkości zoo#!. Wymaga to większej liczby [Concept('concept_dubois_zoo_animal','$concept_dubois_zoo_animals$')], które może schwytać [concept_dubois_naturalist] podczas lokalnej Ekspedycji Zoologicznej lub safari Heia. Zwierzęta można również kupować od innych krajów."
 je_academics_large_zoo: "Skupienie na naturalizmie: Rozbuduj zoo"
 je_academics_large_zoo_reason: "[SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] poprosiło o rozbudowę [concept_dubois_zoo]. Mamy łącznie dziesięć lat, aby rozbudować nasze zoo do #p dużego zoo#!. Wymaga to większej liczby [Concept('concept_dubois_zoo_animal','$concept_dubois_zoo_animals$')], które może schwytać [concept_dubois_naturalist] podczas lokalnej Ekspedycji Zoologicznej lub safari Heia. Zwierzęta można również kupować od innych krajów."
 academics.2300.t: "Musimy znaleźć więcej skamieniałości niż [SCOPE.sCountry('rival_scope').GetName]"
 academics.2300.d: "Brakuje nam wystarczającej liczby [Concept('concept_dubois_fossil','$concept_dubois_fossils$')], aby stworzyć większą kolekcję niż [SCOPE.sCountry('rival_scope').GetName]. Dlatego [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] chce, abyśmy zgromadzili łącznie więcej #b skamieniałości#! niż [SCOPE.sCountry('rival_scope').GetName]. Z pewnością bardzo by to docenili, gdyby udało nam się pokonać tego rywala."
 academics.2300.f: "Podczas gdy nasi rywale z [SCOPE.sCountry('rival_scope').GetName] posiadają różnorodne skamieniałości z różnych epok i miejsc na całym świecie, nasza kolekcja jest dość ograniczona zarówno pod względem okresu, jak i zasięgu geograficznego. To ogromny wstyd i coś nie do zaakceptowania dla tak wielkiego narodu jak nasz.\nMusimy natychmiast powiększyć naszą kolekcję skamieniałości!\n\nPodpisano, członkowie [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')]"
 academics.2300_goal_tt: "Będziesz musiał zgromadzić więcej [Concept('concept_dubois_fossil','$concept_dubois_fossils$')] niż twój rywal, [SCOPE.sCountry('rival_scope').GetName], w ciągu #n 10#! lat. Oni mają [GetPlayer.MakeScope.Var('je_fossil_rival_nation_var').GetVariable('dubois_fossil').GetValue|0+], a my mamy [GetPlayer.MakeScope.Var('dubois_fossil').GetValue|0+]."
 academics.2300_reward_tt: "W nagrodę Inteligencja otrzyma #p 5 aprobaty#!, a ty zyskasz #p 10%#! więcej prestiżu na 4 lata."
 academics.2300.g: "Ach, skamieniałościowa waśń!"
 academics.2300.h: "Nie potrzebujemy żadnych zakurzonych kamieni..."
 academics_no_competition_with_rival_fossils: "Przegraliśmy waśń o skamieniałości"
 academics_competition_with_rival_won_fossils: "Wygraliśmy waśń o skamieniałości"
 je_academics_rivalry_for_fossils: "Skupienie na paleontologii: Waśń o skamieniałości"
 je_academics_rivalry_for_fossils_reason: "[SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] chce, abyśmy zgromadzili więcej [Concept('concept_dubois_fossil','$concept_dubois_fossils$')] niż nasz rywal [SCOPE.sCountry('target').GetName].\n\nNasze #b łączne skamieniałości#!: [ROOT.Var('dubois_fossil').GetValue|0+]\n#b Łączne skamieniałości#! kraju [SCOPE.sCountry('target').GetName]: [ROOT.Var('je_fossil_rival_nation_var').GetVariable('dubois_fossil').GetValue|0+]"
 je_academics_rivalry_for_fossils_success: "Ty ([GetPlayer.MakeScope.Var('dubois_fossil').GetValue|0+]) masz więcej [Concept('concept_dubois_fossil','$concept_dubois_fossils$')] niż [SCOPE.sCountry('target').GetName] ([GetPlayer.MakeScope.Var('je_fossil_rival_nation_var').GetVariable('dubois_fossil').GetValue|0+])."
 academics.2301.t: "Fantastyczna kolekcja skamieniałości"
 academics.2301.d_rival: "Zgromadziliśmy większą kolekcję [Concept('concept_dubois_fossil','$concept_dubois_fossils$')] niż nasz rywal [ROOT.Var('je_fossil_rival_nation_var').GetCountry.GetName]. [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] oraz nasi obywatele są podekscytowani tym zwycięstwem naszego narodu!"
 academics.2301.d_rival_gone: "Nasz rywal w dążeniu do stworzenia ogromnej kolekcji skamieniałości odpadł z rywalizacji. [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] oraz nasi obywatele są podekscytowani tym zwycięstwem naszego narodu!"
 academics.2301.f: "Od samego początku było jasne, że potrzebujemy większej kolekcji skamieniałości niż nasz rywal. Teraz, gdy zgromadziliśmy tak wiele skamieniałości — od kambru aż po czwartorzęd oraz od Ameryki po wyspy Pacyfiku — naprawdę mamy kolekcję godną naszego narodu! Oczywiście tak powinno być już wiele lat temu, a naszą kolekcję należałoby rozbudować jeszcze bardziej. Na razie sytuacja jest „wystarczająco dobra”, jak mawiają chłopi.\n\nPodpisano, członkowie [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')]"
 academics.2301.g: "To kończy tę waśń!"
 academics.2302.t: "Nie udało nam się zgromadzić więcej skamieniałości niż [ROOT.Var('je_fossil_rival_nation_var').GetCountry.GetName]"
 academics.2302.d: "Nie udało nam się powiększyć naszej kolekcji skamieniałości bardziej niż nasi rywale z [ROOT.Var('je_fossil_rival_nation_var').GetCountry.GetName]. Członkowie [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] nie są tym zachwyceni."
 academics.2302.f: "Ich kolekcja obejmuje całe eony, mają wszystko, a my zaledwie kilka zakurzonych kamieni z ledwo widocznymi skamieniałościami... To okropne. To haniebny czas dla naszego narodu! Obrzydliwe.\n\n[SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')]"
 academics.2302.g: "I tak nie potrzebuję starych kamieni..."
