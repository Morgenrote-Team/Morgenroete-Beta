 ademics_our_own_dinosaur_modifier: "Nasz nowy dinozaur"
 ademics_no_dinosaur_modifier: "Brak dinozaura"
 academics.2303_goal_tt: "Zbuduj #G 1#! [concept_dubois_dinosaur_skeleton]"
 academics.2303_reward_tt: "W nagrodę Inteligencja otrzyma #p 5 poparcia#!, a ty zyskasz #p 5%#! więcej prestiżu na 4 lata. Otrzymamy również średnią inwestycję technologiczną."
 je_academics_giant_of_the_past: "Skupienie na paleontologii: Olbrzym przeszłości"
 je_academics_giant_of_the_past_reason: "[SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] poprosiło o zebranie [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones$')] i zrekonstruowanie [concept_dubois_dinosaur_skeleton]. Stan, w jakim się znajduje, ma drugorzędne znaczenie — najważniejsze, byśmy mieli okazały eksponat w naszej kolekcji. Kości dinozaurów można znaleźć w Wielkich Formacjach. Jeśli nie mamy żadnej na swoim terytorium, [concept_dubois_paleontological_licence] byłaby korzystna, ponieważ pozwoliłaby naszemu paleontologowi prowadzić poszukiwania za granicą."
 academics.2303.t: "Olbrzym przeszłości"
 academics.2303.d: "Niektórzy czołowi naukowcy ubolewają nad tym, że pomimo naszych postępów w paleontologii nadal nie wystawiliśmy kompletnego szkieletu dinozaura. Nasze Towarzystwo Naukowe również wyraziło w liście głębokie ubolewanie z powodu tej niefortunnej sytuacji i chciałoby, aby została ona naprawiona."
 academics.2303.f: "CHCEMY DINOZAURA I CHCEMY GO TERAZ!\n\nPodpisano, członkowie [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')]"
 academics.2303.g: "Doskonała inicjatywa!"
 academics.2303.h: "To nie park rozrywki dla małych chłopców, tylko instytut naukowy."
 academics.2304.t: "Straszliwy jaszczur"
 academics.2304.d: "Nowy dinozaur jest najbardziej spektakularnym eksponatem w kolekcji paleontologicznej. Każdego dnia na wystawę przybywają nowi zwiedzający, aby zobaczyć szkielet."
 academics.2304.f: "Czy możemy mieć jeszcze jednego?\n\nPodpisano, członkowie [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')]"
 academics.2304.g: "Nasz własny dinozaur!"
 academics.2305.t: "Brak jaszczura"
 academics.2305.d: "Platforma przeznaczona na planowany szkielet dinozaura pozostaje pusta. Towarzystwo Naukowe zareagowało na to z wielką irytacją."
 academics.2305.f: "Czy musimy wyrazić się jeszcze jaśniej?\n\nPodpisano, członkowie [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')]"
 academics.2305.g: "Znajdźcie sobie inną zabawkę!"
 academics.2306_goal_tt: "Znajdź #G 3#! #O specjalne skamieniałości#!"
 academics.2306_reward_tt: "W nagrodę nasz [concept_dubois_paleontologist] otrzyma #p 50 doświadczenia#!. Jeśli nie mamy jeszcze [concept_dubois_paleontologist], otrzymamy jednego. Otrzymamy również dużą inwestycję technologiczną."
 je_academics_special_fossils: "Skupienie na paleontologii: Specjalne skamieniałości"
 je_academics_special_fossils_reason: "Specjalne skamieniałości to unikatowe skamieniałości, które ze względu na swój wyjątkowy status są traktowane oddzielnie. Należą do nich formy przejściowe, takie jak Archeopteryx czy Ichthyostega, ale także duże wymarłe gatunki ssaków, takie jak olbrzymi leniwiec Megatherium, czy podobny do delfina Ichthyosaurus. Do tej kategorii należą również mniejsze skamieniałości wykorzystywane do określania epok — najbardziej znane to amonity i trylobity. Łącznie istnieje kilkanaście specjalnych skamieniałości, które można znaleźć nie tylko w formacjach, ale także podczas ekspedycji naukowych."
 je_academics_special_fossils_success: "Znajdź #G 3#! #O specjalne skamieniałości#!"
 academics.2306.t: "Niezwykłe skamieniałości"
 academics.2306.d: "Towarzystwo Naukowe ma wobec nas niezwykłą prośbę dotyczącą niezwykłych skamieniałości."
 academics.2306.f: "Historia pochodzenia zwierząt jest tajemnicą natury, którą nasi badacze każdego dnia odkrywają coraz bardziej. Szczególną rolę odgrywają formy znajdujące się na granicy między gatunkami, tak zwane „brakujące ogniwa”. Jednocześnie na naszej planecie istnieją niezwykłe stworzenia, które nie muszą być dinozaurami, by robić wrażenie: wymarłe ssaki, takie jak tygrysy szablozębne czy olbrzymie leniwce. Gdybyśmy zebrali co najmniej 3 specjalne skamieniałości, moglibyśmy jeszcze bardziej wzmocnić światową renomę naszego instytutu.\n\nPodpisano, członkowie [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')]"
 academics.2306.g: "Specjalne skamieniałości do specjalnej kolekcji."
 academics.2306.h: "Czy nie możemy przeznaczyć naszych możliwości naukowych na coś bardziej sensownego?"
 academics.2307.t: "Zdumiewająca kolekcja skamieniałości"
 academics.2307.d: "Nie ma wątpliwości, że Narodowy Instytut Paleontologiczny posiada jedną z najważniejszych kolekcji na świecie. Trudno znaleźć inne porównywalne miejsce z tak niezwykłymi eksponatami."
 academics.2307.f: "Specjalne skamieniałości nie zawsze są tak imponujące, jak mogłoby się początkowo wydawać, ale mają ogromną wartość naukową. Towarzystwo Naukowe przesłało więc list z podziękowaniami. W najbliższych dniach odbędzie się specjalna wystawa."
 academics.2307.g: "Wspaniale."
 academics.2308.t: "Szczególne rozczarowanie"
 academics.2308.d: "Towarzystwo Naukowe wyraziło zaniepokojenie ostatnim niepowodzeniem paleontologicznym."
 academics.2308.f: "To narodowa tragedia, że kwestie historii naturalnej naszego kraju są całkowicie ignorowane. Badania paleontologiczne są zbywane jako bzdury o martwych ptakach i jaszczurach, wsparcie finansowe dla specjalnych ekspedycji przyznaje się niezwykle rzadko, a nawet najmniejsze życzenia są ignorowane. Oskarżam!\n\nPodpisano, członkowie [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')]"
 academics.2308.g: "O rety."
 ademics_no_paleontological_hero_modifier: "Brak bohatera paleontologii"
 academics.2309_goal_tt: "Miej #o słynnego#! [concept_dubois_paleontologist]"
 academics.2309_reward_tt: "W nagrodę zyskamy #p 120#! [concept_academics_progress]."
 je_academics_famous_paleontologist: "Skupienie na paleontologii: Słynny paleontolog"
 je_academics_famous_paleontologist_reason: "Rozwój [concept_dubois_paleontologist] wiąże się ze zwiększaniem jego doświadczenia. Jak każdy uczony, paleontolog otrzymuje 5 punktów doświadczenia rocznie. Dodatkowe doświadczenie zdobywa za udane badania paleontologiczne formacji. Paleontolog może również brać udział w ekspedycjach wysokogórskich oraz ekspedycjach na Pacyfik. Pomyślne składanie i ponowne składanie szkieletów dinozaurów także pomaga zwiększać doświadczenie paleontologa."
 academics.2310.g: "Inspiracja dla młodzieży."
 academics.2311.t: "Brak bohatera paleontologii"
 academics.2311.d: "Z jakiegoś powodu nie udało nam się wypromować paleontologa i doprowadzić go do światowej sławy."
 academics.2311.f: "Niestety niepowodzenie sprawiło, że dyscypliny naukowe nadal są lekceważone jako niszowe dziedziny bez praktycznego znaczenia, a zainteresowanie studiami akademickimi i podjęciem czynnej pracy badawczej pozostaje ograniczone. Członkowie [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] odczuwają to niezadowolenie w rozmowach. Elita intelektualna obwinia za tę sytuację rząd."
 academics.2311.g: "Rozczarowujące."
 academics_splendid_dinosaur_collection_modifier: "Wspaniała kolekcja dinozaurów"
 academics.2312_goal_tt: "Miej #o ocenę dinozaurów#! wynoszącą co najmniej #G 5 #!"
 academics.2312_reward_tt: "W nagrodę Inteligencja otrzyma #p 5 poparcia#!. Dodatkowo zyskasz #p 10%#! więcej prestiżu, a koszt technologii społecznych zostanie obniżony o #p 5%#! na 10 lat."
 je_academics_dinosaur_rating: "Skupienie na paleontologii: Ocena dinozaurów"
 je_academics_dinosaur_rating_reason: "Aby poprawić #O ocenę dinozaurów#!, potrzebne są nie tylko nowe szkielety dinozaurów, ale także ich perfekcyjna rekonstrukcja. Może to potrwać wiele lat. [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] postanowiło więc nie wyznaczać limitu czasu."
 je_academics_dinosaur_rating_success: "Miej #o ocenę dinozaurów#! wynoszącą co najmniej #G 5 #!"
 academics.2312.t: "Splendor paleontologii"
 academics.2312.d: "Paleontologiczna gałąź naszych badań naukowych cieszy się już dobrą reputacją. Teraz nadszedł czas, aby rozsławić ją na całym świecie poprzez znaczną poprawę naszej wystawy dinozaurów."
 academics.2312.f: "Być może warto byłoby zaprezentować na naszej wystawie innego dinozaura. Większa liczba szkieletów przyniosłaby korzyści nie tylko badaniom naukowym, ale także naszej reputacji narodowej. Cały świat poszukuje kości dinozaurów i fascynuje się dotąd nieznaną prehistorią. Nie powinno jednak chodzić wyłącznie o ilość, lecz także o jakość. Powinniśmy dążyć do objęcia czołowej pozycji w rekonstrukcji szkieletów dinozaurów.\n\nPodpisano, członkowie [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')]"
 academics.2312.g: "To będzie kolosalne przedsięwzięcie!"
 academics.2312.h: "Nie znowu te paleontologiczne bzdury."
 academics.2313.t: "Wspaniała kolekcja"
 academics.2313.d: "Towarzystwo Naukowe z dumą ogłosiło dziś specjalną wystawę szkieletów dinozaurów."
 academics.2313.f: "Jesteśmy głęboko wdzięczni rządowi za to, że wreszcie posiadamy kolekcję dinozaurów, która podkreśla wysoki poziom badań paleontologicznych w naszym kraju. Niewiele jest kolekcji dorównujących tej pod względem wyjątkowości. Wymagało to ogromu ciężkiej pracy i wysiłku, a także pasji badawczej i wytrwałości. Społeczeństwo może patrzeć na to dzieło z dumą, podczas gdy zagranica spogląda na nie z zazdrością. Panowie: to wielki dzień dla nauki w ogóle, a dla paleontologii w szczególności!\n\nPodpisano, członkowie [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')]"
 academics.2313.g: "Wspaniale!"
 academics_royalist_reaction_modifier: "Reakcja rojalistów"
 academics_royalist_weakness_modifier: "Słabość rojalistów"
 academics_constitution_suspended_modifier: "Zawieszono Staatsgrundgesetz"
 academics_constitution_confirmed_modifier: "Potwierdzono Staatsgrundgesetz"
 academics_academic_purge_modifier: "Czystka akademicka\n #R -1#! #o Postępu akademickiego#!"
 academics_good_to_be_british_modifier: "Dobrze być Brytyjczykiem"
 academics_supported_hanover_modifier: "Poparto Hanower"
 academics_supported_goettinger_seven_modifier: "Poparto Siedmiu z Getyngi"
 academics_kneeling_decree_modifer: "Dekret o klękaniu (Kniebeugungsordre)"
 academics_germanistentag_modifier: "Germanistentag"
 je_goettinger_seven_monument: "Pomnik Siedmiu z Getyngi"
 je_goettinger_seven_monument_reason: "Zjednoczony naród niemiecki mógłby uczcić pamięć Siedmiu z Getyngi — pod warunkiem, że wiodąca siła jednocząca już wcześniej historycznie stanęła w ich obronie. Pomnik inspirowałby kolejne pokolenia uczonych! Oczywiście zakłada to, że niemiecki rząd podziela liberalne idee legendarnych profesorów."
 academics.3101.t: "Konstytucja Hanoweru"
 academics.3101.d: "Jako jeden ze swoich pierwszych oficjalnych aktów król ogłosił, że zniesie konstytucję, tak zwane Staatsgrundgesetz („Ustawę zasadniczą państwa”). Ernest August podkreślił, że nie czuje się nią związany."
 academics.3101.f: "Hanower otrzymał swoją pierwszą konstytucję, nadaną przez księcia regenta, w 1819 roku; w praktyce oznaczała ona niewiele więcej niż zmianę statusu Hanoweru z elektoratu w królestwo, zagwarantowaną przez kongres wiedeński. Książę Cambridge, jako namiestnik króla Wilhelma w Hanowerze, zalecił gruntowną reorganizację hanowerskiego rządu. Wilhelm IV wyraził zgodę na nową konstytucję w 1833 roku; zgody księcia Cumberland ani nie zażądano, ani jej nie uzyskano, a on sam formalnie zaprotestował przeciwko przyjęciu konstytucji bez jego zgody. Natychmiast po przybyciu do Hanoweru król rozwiązał hanowerski parlament, który został zwołany na mocy spornej konstytucji. Ogłosił zawieszenie konstytucji, argumentując, że nie zwrócono się do niego o zgodę i że nie odpowiada ona potrzebom królestwa."
 academics.3101.g: "Zawieś konstytucję."
 academics.3101.h: "Król nie stoi ponad prawem."
 academics.3102.t: "Siedmiu z Getyngi"
 academics.3102.d: "Historyk i polityk Friedrich Christoph Dahlmann sprzeciwił się planom Ernesta, który chciał zmienić konstytucję według własnego uznania, zwłaszcza że sam Dahlmann uczestniczył w jej opracowaniu. Do protestu dołączyło sześciu innych znanych profesorów Uniwersytetu w Getyndze, którzy stanęli w obronie konstytucji z 1833 roku. Wkrótce zaczęto ich nazywać „Siedmioma z Getyngi” — i stali się utrapieniem dla króla."
 academics.3102.f: "Dokument Dahlmanna wywołał ogromny oddźwięk — studenci uniwersytetu sporządzili setki, a nawet tysiące kopii i rozpowszechnili je w całych Niemczech. Pozostałymi sześcioma protestującymi byli bracia germaniści Wilhelm i Jacob Grimm (słynni autorzy i zbieracze baśni oraz opowieści ludowych, znani wspólnie jako bracia Grimm), prawnik Wilhelm Eduard Albrecht, historyk Georg Gottfried Gervinus, fizyk Wilhelm Eduard Weber oraz teolog i orientalista Heinrich Georg August Ewald. Skala protestu zmusiła króla do działania, a siedmiu niepokornych profesorów wezwano przed sąd uniwersytecki."
 academics.3102.g: "Powinni zostać usunięci ze swoich stanowisk i wygnani!"
 academics.3102.h: "Ustąp przed ich żądaniami, zanim sytuacja się zaogni."
 academics.3103.d: "Po objęciu brytyjskiego tronu przez królową Wiktorię pojawił się pewien żal z powodu zakończenia unii personalnej z Hanowerem, która trwała ponad 120 lat. Jednak po ostatnich wydarzeniach w Niemczech można śmiało powiedzieć: dobrze, że nasze drogi się rozeszły."
 academics.3103.f: "Zaledwie kilka miesięcy po objęciu tronu przez nowego króla Hanower zniósł konstytucję uchwaloną za rządów brytyjskich. Nowy król Ernest August musi teraz mierzyć się z całym środowiskiem akademickiej opozycji. O tym sporze mówi się już w całych Niemczech. Doprawdy, gdy tylko jakiś kraj opuszcza dobroczynną brytyjską strefę wpływów, natychmiast popada w barbarzyństwo."
 academics.3103.g: "Jak dobrze być Brytyjczykiem."
 academics.3104.d: "Państwa Związku Niemieckiego są wstrząśnięte konfliktem między królem Hanoweru a siedmioma niepokornymi profesorami: po tym, jak król Ernest August zniósł konstytucję, „Siedmiu z Getyngi” wystąpiło przeciwko niemu. Stracili swoje stanowiska — ale zyskali ogromną sympatię w liberalnych kręgach niemieckich."
 academics.3104.f: "Historyk i polityk Friedrich Christoph Dahlmann sprzeciwił się planom Ernesta, który chciał zmienić konstytucję według własnego uznania, zwłaszcza że sam Dahlmann uczestniczył w jej opracowaniu. Do protestu dołączyło sześciu innych znanych profesorów Uniwersytetu w Getyndze, którzy stanęli w obronie konstytucji z 1833 roku. Pozostałymi sześcioma protestującymi byli bracia germaniści Wilhelm i Jacob Grimm (słynni autorzy i zbieracze baśni oraz opowieści ludowych, znani wspólnie jako bracia Grimm), prawnik Wilhelm Eduard Albrecht, historyk Georg Gottfried Gervinus, fizyk Wilhelm Eduard Weber oraz teolog i orientalista Heinrich Georg August Ewald. Bezpośrednie skutki protestu były ograniczone, jednak wydarzenie wywołało ogromne poruszenie opinii publicznej i duże zainteresowanie mediów w Niemczech oraz w znacznej części Europy, a cała siódemka cieszyła się dużą popularnością wśród społeczeństwa."
 academics.3104.g: "Z całym szacunkiem, król posunął się za daleko."
 academics.3104.h: "Ta akademicka hołota otrzymała zasłużoną karę."
 academics.3105.t: "Gorąca debata o Hanowerze"
 academics.3105.d: "Konflikt z „Siedmioma z Getyngi” nie przeszedł bez echa w innych państwach Związku Niemieckiego. Nawet w Wielkiej Brytanii ludzie są oburzeni tym, że król uchylił konstytucję."
 academics.3105.f: "[SCOPE.sCountry('academics_anti_hanover_country').GetName] jest jednym z licznych państw niemieckich, które skrytykowały działania Ernesta Augusta. Nadal jednak są kraje, zwłaszcza te o autorytarnych rządach, które wykazały zrozumienie dla jego postępowania. Należy do nich [SCOPE.sCountry('academics_pro_hanover_country').GetName]."
 academics.3105.g: "To nie ich sprawa!"
 academics.3106.t: "Propaganda studencka"
 academics.3106.d: "Pomimo wszelkich wysiłków państwa mających zapobiec rozprzestrzenianiu propagandy popierającej „Siedmiu z Getyngi”, liberalnym środowiskom studenckim udało się na szeroką skalę rozprowadzać ulotki w dużych miastach."
 academics.3106.f: "„Pamiętajcie o naszych bohaterach! Pamiętajcie o Siedmiu z Getyngi! Chwała ich cnotom!” Kiedy profesor Dahlmann opublikował swoje pisma wymierzone przeciwko królowi Hanoweru, spotkały się one z szerokim poparciem niemieckich studentów i liberałów. Wywarły ogromny wpływ na państwa Związku Niemieckiego. Studenci Uniwersytetu w Getyndze sporządzili setki, a nawet tysiące kopii i rozpowszechnili je w całych Niemczech."
 academics.3106.g: "Ta buntownicza studencka hołota!"
 academics.3107.t: "Jacob Grimm w [ROOT.GetCountry.GetNameNoFlag]"
 academics.3107.d: "Po wygnaniu z Hanoweru słynny niemiecki uczony i prawnik Jacob Grimm szuka nowego domu. Nasza sympatia dla „Siedmiu z Getyngi” objęła również jego, dlatego liczy na nowe stanowisko."
 academics.3107.f: "Jacob Ludwig Karl Grimm był niemieckim pisarzem, językoznawcą, filologiem, prawnikiem i folklorystą. Sformułował prawo Grimma w językoznawstwie, był współautorem Deutsches Wörterbuch, autorem Deutsche Mythologie oraz redaktorem Baśni braci Grimm. Był starszym bratem Wilhelma Grimma; razem tworzyli duet literacki znany jako bracia Grimm."
 academics.3107.g: "Powitaj go."
 academics.3107.h: "Nie potrzebujemy kolejnego zrzędliwego uczonego."
 academics.3108.t: "Wilhelm Eduard Weber w [ROOT.GetCountry.GetNameNoFlag]"
 academics.3108.d: "Po wygnaniu z Hanoweru słynny fizyk Wilhelm Eduard Weber szuka nowego domu. Nasza sympatia dla „Siedmiu z Getyngi” objęła również jego, dlatego liczy na nowe stanowisko."
 academics.3108.f: "Wilhelm Eduard Weber był niemieckim fizykiem i wraz z Carlem Friedrichem Gaussem wynalazcą pierwszego telegrafu elektromagnetycznego."
 academics.3111.t: "Der Grimm"
 academics.3111.d: "Bracia Jacob i Wilhelm Grimm przedstawili pierwszy tom niemieckiego słownika, który ma obejmować całe słownictwo języka niemieckiego. To gigantyczne przedsięwzięcie, ale takie, które jeszcze bardziej jednoczy niemiecki naród kulturowy."
 academics.3111.f: "Das Deutsche Wörterbuch (Niemiecki słownik) jest jednym z najważniejszych słowników języka niemieckiego. Dla języka niemieckiego pełni podobną rolę jak Oxford English Dictionary dla języka angielskiego, zawierając szczegółowe informacje historyczne o pochodzeniu i zmianach w użyciu niemieckich słów na przestrzeni czasu, wraz z przykładami zaczerpniętymi z autentycznych dokumentów. W języku niemieckim słownik ten znany jest również jako „Der Grimm”. Prace nad nim rozpoczęli bracia Grimm w 1838 roku. Początkowo zakładali, że projekt zajmie dziesięć lat i obejmie 6 lub 7 tomów. W rzeczywistości pierwszy tom ukazał się dopiero w 1854 roku. Wilhelm Grimm zmarł w 1859 roku, a Jacob w 1863 roku, podczas pracy nad hasłem „Frucht” (owoc). Po ich śmierci w prace zaangażowało się wiele instytucji, w tym Pruska Akademia Nauk i Akademia Berlińska, a także ośrodek w Getyndze. Ostatecznie ukończony w 1961 roku słownik będzie liczył 32 tomy i obejmie około 350 000 haseł głównych. „Grimm” był nie tylko dziełem naukowym, lecz także narodowym."
 academics.3111.g: "To powinno zostać opublikowane w każdym państwie niemieckim!"
 academics.3112.g: "Miałem nadzieję, że zamiast tego napiszą nową książkę z baśniami..."
 academics.3113.t: "Pierwszy Germanistentag we Frankfurcie"
 academics.3113.d: "Kilku niemieckich intelektualistów zaprosiło ludzi o podobnych poglądach na konferencję we Frankfurcie, „Germanistentag”. Podczas gdy wielu chce postrzegać to zgromadzenie jedynie jako wydarzenie kulturalne, jego polityczne przesłanie jest równie wyraźne."
 academics.3113.f: "„Dni germanistów”, wbrew temu, co sugeruje nazwa, nie były wydarzeniem przeznaczonym wyłącznie dla germanistów. Były inicjatywą niemieckich naukowców uniwersyteckich w ramach rozwoju niemieckiej świadomości narodowej. W przeciwieństwie do dzisiejszych czasów termin germanistyka miał w okresie Vormärz szersze znaczenie: łączył historyków, prawników oraz językoznawców i literaturoznawców zajmujących się niemiecką historią, niemieckim prawem i językiem niemieckim. Podczas pierwszego Germanistentagu, zorganizowanego we Frankfurcie w 1846 roku z inicjatywy tybińskiego prawnika Augusta Ludwiga Reyschera, Friedrich Christoph Dahlmann, Georg Waitz i Johann Gustav Droysen przemawiali na temat niepodzielności Szlezwiku-Holsztynu. Jacob Grimm mówił o „wartości nauk nieprecyzyjnych”, a jego brat Wilhelm o niemieckim słowniku. Konferencje odbywały się w Römerze we Frankfurcie. Drugi Germanistentag odbył się w Lubece w 1847 roku. Trzeci Germanistentag, który miał odbyć się w Norymberdze w 1848 roku, nie doszedł do skutku z powodu rewolucji marcowej."
 academics.3113.g: "Niemcy są narodem kulturowym."
 academics.3113.h: "Ich liberalne ideały służą nam za drogowskaz."
 academics.3115.t: "Spór o klękanie"
 academics.3115.d: "W wyniku aneksji okolicznych ziem w epoce napoleońskiej Bawaria zyskała rozległe terytoria zamieszkane przez protestantów. W tym czasie król prowadził bardziej tolerancyjną politykę wobec swoich poddanych. Przykładem był edykt, zgodnie z którym protestanccy żołnierze nie musieli klękać przed katolicką mszą ani procesją. Jednak minister Karl von Abel zaproponował zmianę tego stanu rzeczy."
 academics.3115.f: "Tak zwany spór o klękanie miał miejsce w Królestwie Bawarii w pierwszej połowie XIX wieku. Rozpoczął się od dekretu bawarskiego ministra Karla von Abela, który nakazywał również protestanckim żołnierzom klękać przed Najświętszym Sakramentem podczas nabożeństw wojskowych. Edykt ten stał się znany jako „Kniebeugungsordre”. Doprowadziło to do gorącej debaty w Izbie Deputowanych, która trwała kilka lat."
 academics.3115.g: "Jesteśmy krajem katolickim i tutaj ludzie klękają!"
 academics.3115.h: "Ale co z naszymi protestanckimi rodakami?"
