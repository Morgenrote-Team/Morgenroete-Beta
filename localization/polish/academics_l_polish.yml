 academics.2110.t: "Dyrektor muzeum chce głównego artefaktu"
 academics.2110.d: "Dyrektor Muzeum Archeologicznego napisał dziś w imieniu [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] list otwarty do rządu."
 academics.2110.f: "Z wielkim żalem muszę stwierdzić, że pomimo bogatych zbiorów artefaktów naszemu muzeum wciąż brakuje głównej atrakcji, którą można by uznać za wizytówkę kolekcji. Niestety rząd jak dotąd nie zdołał skupić się na jakości jako archeologicznym wyznaczniku wartości obiektów, zamiast na ich ilości. Zdecydowanie zalecam więc, aby w ciągu najbliższych kilku lat naprawić to zaniedbanie, w przeciwnym razie nasz naród w najlepszym razie będzie uchodził w świecie nauki za zwykłych rachmistrzów.\n\nPodpisano, Dyrektor Muzeum Archeologicznego"
 academics.2110.g: "Prestiżowe przedsięwzięcie."
 academics.2110.h: "Nie warto zachodu."
 academics.2110_goal_tt: "Będziesz musiał zebrać #p 1#! [concept_lepsius_major_artifact] w ciągu #n 15#! lat."
 academics.2111.t: "Splendor muzeum"
 academics.2111.d: "[SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] wyraziło dziś w swoim liście wdzięczność."
 academics.2111.f: "Gratuluję decyzji o uczynieniu archeologii narodowym priorytetem kraju. Niedawno pozyskany, wyjątkowy okaz będzie prezentowany na specjalnej wystawie przez najbliższe kilka tygodni. Cały świat nam zazdrości!\n\nPodpisano, Dyrektor Muzeum Archeologicznego"
 academics.2111.g: "Cudownie."
 academics.2112.t: "Zakurzone miejsce"
 academics.2112.d: "W dzisiejszym liście otwartym, napisanym w imieniu [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')], dyrektor Muzeum Archeologicznego wyraził ubolewanie, że archeologia nie znajduje posłuchu w naszym kraju."
 academics.2112.f: "Nigdy wcześniej tak niewielu nie zrujnowało tak wiele w tak krótkim czasie.\n\nPodpisano, Dyrektor Muzeum Archeologicznego"
 academics.2112.g: "I co?"
 je_academics_major_artifact: "Skupienie na archeologii: Główny artefakt"
 je_academics_major_artifact_reason: "[SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] chce, abyśmy odnaleźli co najmniej #p 1#! [concept_lepsius_major_artifact]. Główne artefakty można zdobyć dzięki wielkim odkryciom, stałym wykopaliskom lub losowym łańcuchom wydarzeń podczas ekspedycji."
 je_academics_major_artifact_success: "Posiadaj #p 1#! [concept_lepsius_major_artifact]."
 academics.2113.t: "Dyrektor muzeum domaga się doskonałości w archeologii"
 academics.2113.d: "Dyrektor Muzeum Archeologicznego zauważył, że niewiele brakuje, aby wystawa była niemal doskonała."
 academics.2113.f: "Jestem skromnym człowiekiem. Jak wiecie, moje żądania nie są szczególnie wygórowane. Nigdy nie prosiłem tego rządu o żadne wymyślne przysługi. Zawsze się powstrzymywałem, jak przystało na kustosza tak wspaniałej instytucji. A jednak brakuje jeszcze jednej drobnej wisienki na torcie, która wyniosłaby naszą piękną kolekcję na światowy poziom. Wystarczy doskonała wystawa. Nic więcej. Zdobycie 100 artefaktów z jednego regionu oraz jednego głównego artefaktu nie powinno być chyba trudne, prawda?\n\nPodpisano, Dyrektor Muzeum Archeologicznego"
 academics.2113.g: "Mile widziane wyzwanie."
 academics.2113.h: "To zbyt ryzykowne."
 academics.2112_goal_tt: "Będziesz musiał zorganizować Doskonałą Wystawę w ciągu #n 20#! lat."
 academics.2114.t: "Archeologia u szczytu"
 academics.2114.d: "Rozmoknięty, ledwie czytelny list dotarł dziś do nas z Muzeum Archeologicznego."
 academics.2114.f: "Udało się odczytać jedynie nadawcę. Podpis wyraźnie należał do dyrektora muzeum. Sekretarz podejrzewa, że podczas pisania listu uronił łzy radości."
 academics.2114.g: "On jest szczęśliwy i my również."
 academics.2115.t: "Niepowodzenie archeologii"
 academics.2115.d: "Rozmoknięty, ledwie czytelny list dotarł dziś do nas z Muzeum Archeologicznego."
 academics.2115.f: "Udało się odczytać jedynie nadawcę. Podpis wyraźnie należał do dyrektora muzeum. Sekretarz przypuszcza, że podczas pisania listu napłynęły mu łzy do oczu. Nasze niepowodzenie podczas ostatniej misji archeologicznej musiało wpędzić go w głęboką depresję."
 academics.2115.g: "On jest smutny i my również."
 je_academics_excellent_collection: "Skupienie na archeologii: Doskonała kolekcja"
 je_academics_excellent_collection_reason: "[SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] chce, abyśmy stworzyli Doskonałą Wystawę. Potrzebujemy do tego #G 100#! [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')] oraz #p 1#! [concept_lepsius_major_artifact] z jednego regionu archeologicznego."
 academics.2116.t: "Musimy znaleźć więcej artefaktów niż [SCOPE.sCountry('rival_scope').GetName]"
 academics.2116.d: "Członkowie [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] są niezadowoleni, że [SCOPE.sCountry('rival_scope').GetName] zgromadziło więcej [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')] niż nasz kraj. Proszą nas, abyśmy w ciągu 10 lat zgromadzili łącznie więcej #b artefaktów#! niż [SCOPE.sCountry('rival_scope').GetName]."
 academics.2116.f: "To wstyd, że tak mało znaczący naród jak [SCOPE.sCountry('rival_scope').GetName] posiada większą kolekcję artefaktów niż my. Musimy prześcignąć tych rabusiów grobowców, którzy kopią wyłącznie w poszukiwaniu skarbów i nawet nie prowadzą prawdziwych badań archeologicznych! Ile wiedzy zostało utraconej przez tych barbarzyńców?\n\nPodpisano, członkowie [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')]"
 academics.2116_goal_tt: "Będziesz musiał zgromadzić więcej [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')] niż twój rywal, [SCOPE.sCountry('rival_scope').GetName], w ciągu #n 10#! lat. Oni mają [GetPlayer.MakeScope.Var('je_artifacts_rival_nation_var').GetVariable('lepsius_total_artifacts').GetValue|0+], a my mamy [GetPlayer.MakeScope.Var('lepsius_total_artifacts').GetValue|0+]."
 academics.2116_reward_tt: "W nagrodę Inteligencja otrzyma #p 5 aprobaty#!, a ty zyskasz #p 10%#! więcej prestiżu na 4 lata."
 academics.2116.g: "Jestem archeologiem i kopię dół!"
 academics.2116.h: "Archeologia to nie poszukiwanie skarbów!"
 academics_no_competition_with_rival_total_artifacts: "Przegraliśmy poszukiwanie skarbów"
 academics_competition_with_rival_won_total_artifacts: "Wygraliśmy poszukiwanie skarbów"
 je_academics_rivalry_for_artifacts: "Skupienie na archeologii: Poszukiwanie skarbów"
 je_academics_rivalry_for_artifacts_reason: "[SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] chce, abyśmy odnaleźli więcej [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')] niż nasz rywal [SCOPE.sCountry('target').GetName].\n\nNasze #b łączne artefakty#!: [ROOT.Var('lepsius_total_artifacts').GetValue|0+]\n#b Łączne artefakty#! kraju [SCOPE.sCountry('target').GetName]: [ROOT.Var('je_artifacts_rival_nation_var').GetVariable('lepsius_total_artifacts').GetValue|0+]"
 je_academics_rivalry_for_artifacts_success: "Ty ([GetPlayer.MakeScope.Var('lepsius_total_artifacts').GetValue|0+]) masz więcej [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')] niż [SCOPE.sCountry('target').GetName] ([GetPlayer.MakeScope.Var('je_artifacts_rival_nation_var').GetVariable('lepsius_total_artifacts').GetValue|0+])."
 academics.2117.t: "Kolekcja archeologiczna pełna cudów!"
 academics.2117.d_rival: "Zgromadziliśmy większą kolekcję artefaktów niż nasz rywal [ROOT.Var('je_artifacts_rival_nation_var').GetCountry.GetName]. [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] oraz nasi obywatele są podekscytowani tym zwycięstwem naszego narodu!"
 academics.2117.d_rival_gone: "Nasz archeologiczny rywal odpadł z rywalizacji. [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] oraz nasi obywatele są podekscytowani tym zwycięstwem naszego narodu!"
 academics.2117.f: "Powinno być oczywiste, że nasz naród musi posiadać lepszą kolekcję archeologiczną niż ci barbarzyńcy. [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] jest zadowolone z tej kolekcji. Chociaż wciąż pozostaje wiele artefaktów, które trzeba ocalić przed takimi dzikusami.\n\nPodpisano, członkowie [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')]"
 academics.2117.g: "Tyle ocalonych artefaktów!"
 academics.2118.t: "Nie udało nam się powiększyć naszej kolekcji archeologicznej"
 academics.2118.d: "Nie udało nam się powiększyć naszej kolekcji archeologicznej bardziej niż nasi rywale z [ROOT.Var('je_artifacts_rival_nation_var').GetCountry.GetName]. Członkowie [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] są całkowicie rozczarowani."
 academics.2118.f: "Brudne ręce tych dzikusów plugawią samą historię ludzkości. Jak mogliście pozwolić, by wszystkie te artefakty zostały zrabowane przez tych rabusiów grobowców? Tak wiele wiedzy zostanie utracone tylko dlatego, że wolą skarby od zachowania naszej historii. Obrzydliwe!\n\n[SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')]"
 academics.2118.g: "Nie potrzebujemy tych zakurzonych artefaktów."
 academics.2200.t: "Musimy znaleźć więcej okazów niż [SCOPE.sCountry('rival_scope').GetName]"
 academics.2200.d: "Członkowie [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')] są niezadowoleni, że [SCOPE.sCountry('rival_scope').GetName] zgromadziło więcej [Concept('concept_dubois_specimen','$concept_dubois_specimens$')] niż nasz kraj. Proszą nas, abyśmy w ciągu 10 lat zgromadzili łącznie więcej #b okazów#! niż [SCOPE.sCountry('rival_scope').GetName]."
 academics.2200.f: "Nasze kolekcje okazów są niczym w porównaniu z tymi w [SCOPE.sCountry('rival_scope').GetName]. Mają wszystko, czego my pragniemy! Słyszałem nawet, że posiadają gigantyczny kwiat, który pachnie jak rozkładające się zwłoki. Całą naszą dumą jest pomarańczowy motyl. Musimy znaleźć nowe okazy, takie, których nikt nie odkrył przed nami! W przeciwnym razie mogą wpaść w ręce tych rzeźników zwierząt!\n\nPodpisano, członkowie [SCOPE.GetRootScope.GetCountry.GetCustom('academics_scientific_society_name_custom_loc')]"
 academics.2200_goal_tt: "Będziesz musiał zgromadzić więcej [Concept('concept_dubois_specimen','$concept_dubois_specimens$')] niż twój rywal, [SCOPE.sCountry('rival_scope').GetName], w ciągu #n 10#! lat. Oni mają [GetPlayer.MakeScope.Var('je_specimen_rival_nation_var').GetVariable('dubois_specimen').GetValue|0+], a my mamy [GetPlayer.MakeScope.Var('dubois_specimen').GetValue|0+]."
 academics.2200_reward_tt: "W nagrodę Inteligencja otrzyma #p 5 aprobaty#!, a ty zyskasz #p 10%#! więcej prestiżu na 4 lata."
 academics.2200.g: "Musimy natychmiast wysłać naszego przyrodnika!"
 academics.2200.h: "Co za strata czasu!"
