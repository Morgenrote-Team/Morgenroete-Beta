 ito_state_trait_madagascar_forest: "Lasy deszczowe Madagaskaru"
 je_ito_improve_forestry_project: "Usprawnij gospodarkę leśną"
 je_ito_improve_forestry_project_reason: "Twój [concept_dubois_naturalist] dr [ROOT.Var('ito_naturalist_var').GetCharacter.GetLastName] skupia się na poprawie produkcji [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] w [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName].\n$mr_divider_for_je$\nProjekt będzie zyskiwać postęp każdego miesiąca. Za każdym razem, gdy postęp osiągnie 24, obecny budynek otrzyma nowy modyfikator. Gdy wszystkie wybrane budynki w ramach tego projektu otrzymają modyfikatory, projekt się zakończy.\nŁącznie dostępne są 3 modyfikatory. Każdy nowy modyfikator wymaga ponownego wypełnienia postępu.\nGdy [GetBuildingType('building_logging_camp').GetName] otrzyma wszystkie modyfikatory, zyskasz również #p 500#! @dubois_specimen! [Concept('concept_dubois_specimen','$concept_dubois_specimens$')].\n$mr_divider_for_je$\nObecny budynek: [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] w [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_ito_improve_forestry_project_modifier_1_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_ito_improve_forestry_project_modifier_2_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_ito_improve_forestry_project_modifier_3_type')]\n\nŁączna liczba pozostałych budynków (z wyłączeniem obecnego): [JournalEntry.MakeScope.Var('mr_number_of_remaining_list_entries_var').GetValue|V0]\n$concept_dubois_specimens$ z projektu: [JournalEntry.MakeScope.ScriptValue('ito_specimens_from_forestry_project_value')|+0] @dubois_specimen!\n\nObecny miesięczny postęp: #underline #tooltip:[GetRawTextTooltipTag('dubois_monthly_naturalist_improvement_progress_var_tt')] [GetPlayer.MakeScope.ScriptValue('ito_naturalist_improvement_project_progress_value')|+2] #!#!"
