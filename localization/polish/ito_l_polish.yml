l_polish:
 mr_botanical_expedition_no_current_expedtion_tt: "#default_text [GetPlayer.GetName] nie prowadzi aktywnej [concept_dubois_botanical_expedition].#!"
 je_ito_botanical_expedition: "Wyprawa Botaniczna"
 je_ito_botanical_expedition_reason: "Twój [concept_dubois_naturalist] przebywa obecnie na [concept_dubois_botanical_expedition], której celem jest zebranie [ROOT.Var('ito_botanical_expedition_target_var').GetFlagName|V] oraz nowych [Concept('concept_dubois_specimen','$concept_dubois_specimens$')].\n$mr_divider_for_je$\nKażdego miesiąca ekspedycja będzie zdobywać postęp w zbieraniu [ROOT.Var('ito_botanical_expedition_target_var').GetFlagName|V]. Podczas jednej ekspedycji botanicznej można zebrać maksymalnie 10 [concept_ito_medicinal_plants].\n\nDodatkowo ekspedycja będzie co miesiąc pozyskiwać [Concept('concept_dubois_specimen','$concept_dubois_specimens$')] oraz może wywołać wydarzenia, które zapewnią dodatkowe [Concept('concept_dubois_specimen','$concept_dubois_specimens$')] lub nawet wyjątkowe rośliny.\n$mr_divider_for_je$\nObecny uzysk ekspedycji: @dubois_specimen! [GetPlayer.MakeScope.Var('ito_total_specimen_current_botanical_expedition_var').GetValue|*V0] [Concept('concept_dubois_specimen','$concept_dubois_specimens$')]\nSzacowany miesięczny uzysk: @dubois_specimen! [GetPlayer.MakeScope.Var('ito_estimated_specimen_on_botanical_expedition_var').GetValue|=+0] [Concept('concept_dubois_specimen','$concept_dubois_specimens$')]"
 je_ito_botanical_expedition_goal_tt: "Pasek $ito_botanical_expedition_progress_bar$ osiągnął #V 12#!."
 ito_botanical_expedition_progress_bar: "Postęp ekspedycji"
 ito_botanical_expedition_progress_bar_desc: "Postęp ekspedycji: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)]/12)"
 ito_botanical_expedition_progress_bar_monthly_progress_tt: "Miesięczny postęp"
 ito_naturalist_is_dead_tt: "#default_text Nie masz [concept_dubois_naturalist]."
 dubois.390.t: "Powrót ekspedycji botanicznej"
 dubois.390.d: "Nasza [concept_dubois_botanical_expedition] prowadzona przez [SCOPE.sCharacter('dubois_naturalist_scope').GetFullName] powróciła. Łącznie zebrano [SCOPE.GetValue('medicinal_herbs_scope_value')|0+] [ROOT.Var('ito_botanical_expedition_target_var').GetFlagName|V] oraz  @dubois_specimen! [GetPlayer.MakeScope.Var('ito_total_specimen_current_botanical_expedition_var').GetValue|*0+] [Concept('concept_dubois_specimen','$concept_dubois_specimens$')]"
 dubois.390.f: "Znalazłem tu tę fascynującą roślinę, której nikt jeszcze nie nazwał! Nazwę ją [SCOPE.sCharacter('dubois_naturalist_scope').GetLastNameNoFormatting]a!"
 dubois.390.g: "Witajcie z powrotem!"
