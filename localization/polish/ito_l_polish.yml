 ito_state_trait_madagascar_forest: "Lasy deszczowe Madagaskaru"
 je_ito_improve_forestry_project: "Ulepsz Leśnictwo"
 je_ito_improve_forestry_project_reason: "Twój [concept_dubois_naturalist] Dr. [ROOT.Var('ito_naturalist_var').GetCharacter.GetLastName] koncentruje się na ulepszaniu produkcji budynku [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] w stanie [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName].\n$mr_divider_for_je$\nProjekt będzie postępował co miesiąc. Za każdym razem, gdy postęp osiągnie 24, obecny budynek otrzyma nowy modyfikator. Gdy wszystkie budynki wybrane do tego projektu otrzymają modyfikatory, projekt dobiegnie końca.\nŁącznie dostępne są 3 modyfikatory. Uzyskanie każdego kolejnego modyfikatora wymaga ponownego zapełnienia paska postępu.\nGdy [GetBuildingType('building_logging_camp').GetName] otrzyma wszystkie modyfikatory, zyskasz również #p 500#! @dubois_specimen! [Concept('concept_dubois_specimen','$concept_dubois_specimens|q$')].\n$mr_divider_for_je$\nObecny Budynek: [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] w stanie [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_ito_improve_forestry_project_modifier_1_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_ito_improve_forestry_project_modifier_2_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_ito_improve_forestry_project_modifier_3_type')]\n\nPozostałe Budynki (bez obecnego): [JournalEntry.MakeScope.Var('mr_number_of_remaining_list_entries_var').GetValue|V0]\n$concept_dubois_specimens$ z Projektu: [JournalEntry.MakeScope.ScriptValue('ito_specimens_from_forestry_project_value')|+0] @dubois_specimen!\n\nObecny miesięczny postęp: #underline #tooltip:[GetRawTextTooltipTag('dubois_monthly_naturalist_improvement_progress_var_tt')] [GetPlayer.MakeScope.ScriptValue('ito_naturalist_improvement_project_progress_value')|+2] #!#!"
