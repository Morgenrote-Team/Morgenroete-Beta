 curtiss_air_war_doctrin_tech: "Doktryna Wojny Powietrznej"
 curtiss_air_war_doctrin_tech_desc: "Powiedzenie „Bombowiec zawsze dotrze do celu!” przypisuje się włoskiemu generałowi Giulio Douhetowi. Stanley Baldwin wypowiedział je przed brytyjskim parlamentem w 1932 roku. Słowa te wyrażają przełomowe poglądy Douheta na temat współczesnej wojny powietrznej. Jako pionier bombardowań strategicznych wywarł on ogromny wpływ, szczególnie na rozwój teorii wojny powietrznej w Wielkiej Brytanii i Stanach Zjednoczonych."
 curtiss_airlines_tech: "Linie lotnicze"
 curtiss_airlines_tech_desc: "DELAG (Deutsche Luftschiffahrts-Aktiengesellschaft) była pierwszą na świecie pasażerską i komercyjną linią lotniczą. Została założona w 1909 roku, a działalność rozpoczęła w czerwcu 1910 roku, oferując regularne przewozy pasażerskie drogą powietrzną. DELAG eksploatowała sterowce produkowane przez Przedsiębiorstwo Zeppelin."
 curtiss.1.t: "Nasz Pilot Zginął"
 curtiss.1.d: "Po całym życiu spędzonym na pilotowaniu najnowocześniejszych samolotów i ściganiu się w przestworzach nasz najbardziej ceniony [concept_curtiss_pilot] odszedł. Kto będzie teraz podbijał dla nas przestworza?"
 curtiss.1.g: "Wielka Strata!"
