 curtiss.40.d: "Młody pilot [SCOPE.sCharacter('curtiss_new_pilot_scope').GetFullName] jako pierwszy pokonał trasę między Nowym Jorkiem a Paryżem bez międzylądowania, całkowicie sam i na [SCOPE.sCharacter('curtiss_new_pilot_scope').GetHerHis] własną rękę. Podczas gdy niektórzy nazywają [SCOPE.sCharacter('curtiss_new_pilot_scope').GetHerHim] „latającym szaleńcem”, [SCOPE.sCharacter('curtiss_new_pilot_scope').GetSheHe] wywołuje falę entuzjazmu wśród mieszkańców za oceanem i jest czczony jako bohater narodowy."
 curtiss.40.f: "Po niezwykle wymagającym locie nieznany dotąd pilot [SCOPE.sCharacter('curtiss_new_pilot_scope').GetFullName] dokonał wspaniałego wyczynu lotniczego. Tłumy, dowiedziawszy się o [SCOPE.sCharacter('curtiss_new_pilot_scope').GetHerHis] sukcesie, powitały [SCOPE.sCharacter('curtiss_new_pilot_scope').GetHerHim] z ogromnym entuzjazmem. Podczas trwającego 33,5 godziny lotu [SCOPE.sCharacter('curtiss_new_pilot_scope').GetLastName] musiał stawić czoła wielu wyzwaniom, w tym przelatywaniu tuż nad chmurami burzowymi na wysokości 10 000 stóp (3000 m) oraz zaledwie 10 stóp (3,0 m) nad powierzchnią fal. Samolot zmagał się z oblodzeniem i przez kilka godzin leciał na ślepo we mgle, a [SCOPE.sCharacter('curtiss_new_pilot_scope').GetLastName] polegał wyłącznie na nawigacji zliczeniowej ([SCOPE.sCharacter('curtiss_new_pilot_scope').GetSheHe] nie potrafił sprawnie nawigować według położenia Słońca i gwiazd, a wyposażenie do nawigacji radiowej odrzucił jako zbyt ciężkie i zawodne). [SCOPE.sCharacter('curtiss_new_pilot_scope').GetLastName] miał szczęście, ponieważ wiatry nad Atlantykiem wzajemnie się znosiły, zapewniając [SCOPE.sCharacter('curtiss_new_pilot_scope').GetHerHim] zerowy znos wiatrowy, a tym samym umożliwiając precyzyjną nawigację podczas długiego lotu nad pozbawionym punktów orientacyjnych oceanem. Ten wyczyn wzbudzi znaczące zainteresowanie na całym świecie zarówno lotnictwem komercyjnym, jak i pocztą lotniczą, rewolucjonizując światowy przemysł lotniczy."
 curtiss.42.t: "Lot [SCOPE.sCharacter('curtiss_new_pilot_scope').GetLastName]"
 curtiss.42.d: "Transatlantycki lot charyzmatycznego młodego pilota [SCOPE.sCharacter('curtiss_new_pilot_scope').GetFullName] rozpalił entuzjazm wśród mieszkańców naszego kraju i obudził dotąd nieznaną pasję do lotnictwa. Już mówi się o boomie na punkcie [SCOPE.sCharacter('curtiss_new_pilot_scope').GetLastName]."
 curtiss.314.t: "As Lotnictwa"
 curtiss.314.d: "Dzięki licznym sukcesom lotniczym [GetPlayer.MakeScope.Var('curtiss_pilot_var').GetCharacter.GetFullName] cieszy się obecnie opinią niekwestionowanego mistrza przestworzy: [GetPlayer.MakeScope.Var('curtiss_pilot_var').GetCharacter.GetSheHe] uchodzi za asa lotnictwa!"
