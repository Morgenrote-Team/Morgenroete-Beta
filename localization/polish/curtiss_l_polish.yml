 curtiss_montgolfier_balloon_tech: "Balon Montgolfiera"
 curtiss_montgolfier_balloon_tech_desc: "Montgolfière to nazwa pierwszego balonu na ogrzane powietrze, pochodząca od nazwiska francuskich wynalazców Josepha-Michela i Jacques’a-Étienne’a Montgolfierów. Wieści o „maszynach aerostatycznych” szybko rozprzestrzeniły się po całej Europie. Pierwsze wojskowe zastosowanie statków powietrznych miało miejsce podczas wojen rewolucyjnej Francji, kiedy to Francuzi wykorzystali balon wodorowy na uwięzi do obserwowania ruchów armii austriackiej podczas bitwy pod Fleurus (1794)."
 curtiss_messenger_pidgeons_tech: "Gołębie Pocztowe"
 curtiss_messenger_pidgeons_tech_desc: "Przed wynalezieniem telegrafu i radia gołębie pocztowe były najszybszym znanym sposobem przekazywania wiadomości na świecie i nieodłącznym elementem działań wojennych. Nawet podczas wojny francusko-pruskiej wykorzystywano gołębie do przenoszenia poczty między oblężonym Paryżem a nieokupowanymi terenami Francji. W grudniu 1870 roku gołąb przenoszący mikrofilmy pokonał trasę z Perpignan do Brukseli w ciągu dziesięciu godzin."
 curtiss_reconnaissance_balloon_tech: "Balon Rozpoznawczy"
 curtiss_reconnaissance_balloon_tech_desc: "Balon rozpoznawczy to balon wypełniony mieszaniną gazów i wyposażony w sprzęt do prowadzenia rozpoznania wojskowego. Balony wykorzystywano jako punkty obserwacyjne podczas wojny secesyjnej oraz wojny francusko-pruskiej. Załogowe balony na uwięzi wznoszono na linach, aby obserwować pozycje wroga i przekazywać informacje o sytuacji własnym oddziałom znajdującym się na ziemi."
 curtiss_early_aviation_tech: "Wczesne Lotnictwo"
 curtiss_early_aviation_tech_desc: "W latach 1867–1896 niemiecki pionier lotnictwa Otto Lilienthal rozwijał technikę lotu statków powietrznych cięższych od powietrza. Był pierwszym człowiekiem, który wielokrotnie wykonywał udane, dobrze udokumentowane loty szybowcowe. Prace Lilienthala doprowadziły do opracowania przez niego koncepcji współczesnego skrzydła, która wywarła ogromny wpływ na dalszy rozwój lotnictwa. Loty amerykańskich braci Wright w 1903 roku uznaje się za „pierwszy długotrwały i kontrolowany lot z napędem maszyny cięższej od powietrza”."
 curtiss_seaplanes_tech: "Wodnosamoloty"
 curtiss_seaplanes_tech_desc: "28 marca 1910 roku Francuz Henri Fabre odbył pierwszy udany lot wodnosamolotem z napędem silnikowym. Był to wodnosamolot pływakowy o konstrukcji trimaranu, napędzany silnikiem Gnome Omega. Pierwszy udany start i lądowanie Fabre’a na wodzie zainspirowały innych lotników. Pierwsze zawody wodnosamolotów odbyły się w Monako w marcu 1912 roku. Uczestniczyły w nich samoloty wyposażone w pływaki konstrukcji Fabre’a, Curtissa, Telliera i Farmana. W tym samym roku francuska marynarka wojenna zamówiła swój pierwszy wodnosamolot pływakowy."
 curtiss_modern_aviation_tech: "Nowoczesne Lotnictwo"
 curtiss_modern_aviation_tech_desc: "Lotnictwo cywilne jest jedną z dwóch głównych kategorii lotnictwa i obejmuje wszystkie loty niewojskowe i niezwiązane z działalnością państwa, zarówno prywatne, jak i komercyjne. W Złotej Erze Lotnictwa stało się powszechne. Po raz pierwszy możliwe stały się dalekodystansowe podróże lotnicze dla zamożnych pasażerów. Początkowo wykorzystywano do nich sterowce, jednak po katastrofie Hindenburga zaczęto od nich odchodzić, a dominującą rolę przejęły łodzie latające."
