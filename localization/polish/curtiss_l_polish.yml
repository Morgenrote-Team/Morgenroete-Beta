 curtiss.231.t: "Nowość: Posiłki Serwowane na Pokładzie Samolotu"
 curtiss.231.d: "Na pokładach samolotów dostępna jest nowa usługa! Po raz pierwszy pasażerowie mogli kupić kanapkę na pokładzie samolotu za niewielką cenę. Może to uczynić nasze Przedsiębiorstwo Lotnicze jednym z najbardziej innowacyjnych przedsiębiorstw na świecie!"
 curtiss.231.f: "„Czy ma Pan ochotę na kanapkę podczas naszej podróży?”\n„Kanapka brzmi wspaniale! Czy sprzedajecie również napoje?”"
 curtiss.231.g: "Przynajmniej nie umrę z głodu!"
 curtiss.231.h: "Ile oni sobie życzą za kanapkę?!"
