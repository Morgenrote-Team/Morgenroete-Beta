 curtiss.533.g: "Spróbuj wylądować."
 curtiss.533.h: "To zbyt ryzykowne."
 curtiss.534.t: "Silne Wiatry"
 curtiss.534.d: "Nagle nadciągające polarne wiatry utrudniają przelot."
 curtiss.534.f: "Zjawiska naturalne, takie jak silne wiatry i burze, mogą stanowić dla statków powietrznych zarówno zagrożenie, jak i szansę. Państwa, które zdecydowały się na rozwój budowy sterowców lub posiadają asa lotnictwa, lepiej radzą sobie z takimi wyzwaniami. Dla państw pozbawionych tych atutów siły natury stanowią poważne niebezpieczeństwo."
 curtiss.534.g: "Te wiatry dodadzą wiatru w żagle naszemu zeppelinowi i nauce!"
 curtiss.534.h: "To szaleństwo! Zmień kurs!"
 curtiss.534.i: "Nasz doskonały sterowiec z łatwością sprosta temu wyzwaniu."
 curtiss.535.t: "Burza Polarna"
 curtiss.535.d: "Wyprawa zeppelinowa znalazła się w niebezpiecznej burzy polarnej."
 curtiss.535.f: "Zjawiska naturalne, takie jak silne wiatry i burze, mogą stanowić dla statków powietrznych zarówno zagrożenie, jak i szansę. Państwa, które zdecydowały się na rozwój budowy sterowców lub posiadają asa lotnictwa, lepiej radzą sobie z takimi wyzwaniami. Dla państw pozbawionych tych atutów siły natury stanowią poważne niebezpieczeństwo."
 curtiss.535.g: "Musimy zaryzykować przelot."
 curtiss.535.h: "Spróbuj wyprowadzić nas z niebezpieczeństwa, bez względu na koszty!"
 curtiss.535.i: "[SCOPE.sCharacter('curtiss_expedition_leader').GetFullName] uratuje sytuację."
 curtiss.536.t: "Bezchmurna Pogoda"
 curtiss.536.d: "Bezchmurna pogoda i spokojny lot pozwalają załodze zeppelina wykorzystać dodatkowy czas."
 curtiss.536.f: "„Kto nie widział krain polarnych w całej okazałości ich lodowców, w bogatej symfonii barw ich lśniących pól lodowych oraz często fantastycznie ukształtowanych wysp i podnóży górskich, ten nie zna najpiękniejszych rzeczy, jakie nasza Ziemia ma do zaoferowania”. — Hugo Eckener"
 curtiss.536.g: "Przeprowadź Eksperyment."
 curtiss.536.h: "Naprawia Sterowiec."
 curtiss.537.t: "Oblodzone Śmigła"
 curtiss.537.d: "Mróz daje się we znaki: śmigła pokryły się lodem i grozi im pęknięcie."
 curtiss.537.f: "Lód na śmigłach oznacza nie tylko konieczność ograniczenia obrotów silników, aby je odmrozić. Gdyby twardy lód odpadł, mógłby uszkodzić powłokę zeppelina lub przyrządy pokładowe. Zeppelin wyraźnie traci już wysokość. Niektórzy uważają, że lepiej pozbyć się „niepotrzebnego balastu”, aby nabrać wysokości — ku wielkiemu niezadowoleniu badaczy."
 curtiss.537.g: "Zachowaj spokój i rób swoje."
 curtiss.537.h: "Zrzuć Balast!"
 curtiss.538.t: "Kotwicowisko Zeppelinów"
 curtiss.538.d: "Wyprawa Polarna znalazła dogodne miejsce na postój oraz przeprowadzenie prac konserwacyjnych lub eksperymentów."
 curtiss.538.f: "Już w 1910 roku niemieccy badacze wyruszyli na wyprawę na Spitsbergen, aby przygotować podróż badawczą z wykorzystaniem zeppelina. W tamtym czasie ważną rolę odgrywały poszukiwania odpowiednich portów dla zeppelinów. Jednym z następstw tej wyprawy było założenie pierwszej całorocznej niemieckiej stacji meteorologicznej na Spitsbergenie."
 curtiss.538.g: "Dobre Miejsce na Odpoczynek"
 curtiss.538.h: "Powinniśmy założyć stałą stację badawczą."
 curtiss.539.t: "Awaria Silnika!"
 curtiss.539.d: "Jeden z silników Zeppelina nagle przestał dziś działać! Załoga nie widzi możliwości jego naprawy."
 curtiss.539.f: "Awaria pojedynczego silnika nie musi oznaczać katastrofy, ponieważ sterowce zazwyczaj mają kilka silników. Jednak takie zdarzenie w połączeniu z innymi awariami może mieć dramatyczne konsekwencje."
 curtiss.539.g: "Ta podróż jest pechowa."
 curtiss.540.t: "Schwytano Niedźwiedzia Polarnego"
 curtiss.540.d: "Po krótkim lądowaniu załodze naszego zeppelina udało się schwytać i zamknąć niedźwiedzia polarnego. Wyślemy go prosto do domu."
 curtiss.540.f: "Dzięki ogromnej cierpliwości i zastosowaniu pułapek załodze zeppelina udało się urządzić zasadzkę na wspaniałe [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animal|q$')] i schwytać je pomimo jego ogromnych rozmiarów. Aby nie narażać dalszej wyprawy, niedźwiedź zostanie przewieziony osobno, pod opieką niewielkiej grupy, do najbliższego portu na Spitsbergenie, skąd prywatni kupcy za opłatą dostarczą go do stolicy."
 curtiss.541.t: "Niedźwiedź Polarny Dokonuje Masakry!"
 curtiss.541.d: "Krótkie lądowanie w celu schwytania niedźwiedzia polarnego okazało się samobójczą misją – podczas próby kilku naszych ludzi odniosło poważne obrażenia, a jeden z nich nawet zginął!"
 curtiss.541.f: "W przeciwieństwie do większości znanych gatunków niedźwiedzi niedźwiedzie polarne postrzegają ludzi jako potencjalną zdobycz. Zdarzają się nawet niesprowokowane ataki, choć należą one do rzadkości. W tym przypadku spełnił się najczarniejszy scenariusz: [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animal|q$')] stawił zaciekły opór i zadał badaczom poważne obrażenia, pomimo użycia broni palnej. Jeden z nieszczęsnych pomocników został rozszarpany przez potężne zwierzę i odciągnięty w nieznane. Nie udało się odnaleźć jego ciała."
 curtiss.541.g: "Cholera."
