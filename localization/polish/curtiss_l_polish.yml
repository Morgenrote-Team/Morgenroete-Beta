 je_curtiss_schneider_trophy_race_contextless_reason: "[concept_curtiss_schneider_trophy] był zawodami, w których rywalizowano o najbardziej zaawansowaną technologię i najlepszych pilotów swoich czasów. Celem jest trzykrotne zwycięstwo w wyścigu z rzędu, aby zachować fizyczny Puchar Schneidera na wieczność.\n\n[AddLocalizationIf( JournalEntry.MakeScope.Var('curtiss_schneider_trophy_race_active_var').IsSet , 'CURTISS_SCHNEIDER_TROPHY_ONGOING_RACE_INFORMATION')][AddLocalizationIf( Not(JournalEntry.MakeScope.Var('curtiss_schneider_trophy_race_active_var').IsSet) , 'CURTISS_SCHNEIDER_TROPHY_NO_CURRENT_RACE')]"
