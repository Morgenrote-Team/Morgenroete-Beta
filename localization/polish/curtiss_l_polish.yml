 je_curtiss_found_schneider_trophy_contextless: "Ustanów Puchar Schneidera"
 je_curtiss_found_schneider_trophy_contextless_reason: "Jacques Schneider był francuskim menedżerem przemysłowym, licencjonowanym pilotem samolotowym i balonowym, a przez długi czas dzierżył rekord wysokości lotu balonem. Po poważnym wypadku, który uniemożliwił mu dalsze latanie, wspierał finansowo różne zawody i kluby lotnicze. Pełniąc funkcję sędziego wyścigu podczas zawodów w Monako w 1912 roku, zauważył, że konstrukcja wodnosamolotów pozostaje daleko w tyle za innymi typami statków powietrznych. Ponieważ wodnosamoloty zapowiadały się na najlepsze rozwiązanie w dalekodystansowym transporcie pasażerskim, pan Schneider uznał, że wyścigi wodnosamolotów pozwolą na szybsze doskonalenie tych maszyn."
