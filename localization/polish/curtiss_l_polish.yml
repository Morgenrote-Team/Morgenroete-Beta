 je_curtiss_airline_company_reason: "Założenie Przedsiębiorstwa Lotniczego, na którego czele stoi charyzmatyczny, ambitny i ekscentryczny przedsiębiorca, otwiera szczególne możliwości rozwoju lotnictwa."
 je_curtiss_air_combat: "Walka Powietrzna"
 je_curtiss_air_combat_reason: "[concept_curtiss_pilot] może zostać skierowany do działań na froncie, o ile przynajmniej jedna jednostka dysponuje wsparciem lotniczym. W zależności od posiadanej cechy zapewnia jednostce dodatkową siłę ofensywną. Podczas działań na froncie piloci otrzymują 10 Punktów Doświadczenia miesięcznie. W tym czasie mogą wystąpić dodatkowe wydarzenia, z których niektóre wiążą się z ryzykownymi konsekwencjami. Po przydzieleniu do służby na froncie piloci muszą pozostać tam przez co najmniej sześć miesięcy, zanim będzie można ich ponownie wycofać. Ranni piloci nie zdobywają doświadczenia."
