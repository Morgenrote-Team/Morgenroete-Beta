 curtiss.140.t: "Dr. [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastNameNoFormatting] konstruuje nowy silnik do naszego samolotu"
 curtiss.140.d: "Dr. [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName], nasz [concept_tesla_aeronautical_engineer], wynalazł nowy silnik do naszego samolotu. Z pewnością zwiększy to nasze szanse na zdobycie Pucharu."
 curtiss.140.f: "Ten nowy silnik jest fantastyczny! Nigdy nie doświadczyłem czegoś podobnego. Jest taaaaki szybki! Chciałbym podziękować Dr. [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastNameNoFormatting] za ten niesamowity silnik!"
