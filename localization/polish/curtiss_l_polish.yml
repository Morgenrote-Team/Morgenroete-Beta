 curtiss_mobilization_option_balloon_recon_desc: "Balony wykorzystywano już podczas wojen napoleońskich, a ich znaczenie jako środka rozpoznania stale rosło od czasu amerykańskiej wojny secesyjnej."
 curtiss_mobilization_option_balloon_recon: "Wczesne Rozpoznanie Balonowe"
 utility_mod_curtiss_seaplane: "Wodnosamolot Rozpoznawczy"
 utility_mod_curtiss_seaplane_desc: "Samolot rozpoznawczy lokalizujący pozycje obcych okrętów.\n\nTa modyfikacja zapewnia również #G 15%#! [concept_screening] i #G 15%#! [concept_detection]"
 utility_mod_curtiss_sonar: "Sonar"
 utility_mod_curtiss_sonar_desc: "Sonar umożliwia skuteczniejsze wykrywanie okrętów podwodnych."
 curtiss_meteorology_tech: "Meteorologia"
 curtiss_meteorology_tech_desc: "Pierwsza klasyfikacja chmur opracowana przez Luke’a Howarda stanowiła przełomowy moment w dziejach meteorologii. Dziewiętnastowieczny entuzjazm dla pomiarów, statystyki i gromadzenia danych sprawił, że w kolejnych latach meteorologia stała się prawdziwą nauką."
 curtiss_high_altitude_balloon_tech: "Balon Wysokiego Pułapu"
 curtiss_high_altitude_balloon_tech_desc: "„Ogromny żółty balon wzbił się kilka tygodni temu w niebo nad Augsburgiem w Niemczech. Zamiast kosza ciągnął za sobą szczelną aluminiową kulę w czarno-srebrnym kolorze. W jej wnętrzu fizyk prof. Auguste Piccard i Charles Kipfer zamierzali zbadać atmosferę na wysokości 50 000 stóp. Siedemnaście godzin później, gdy uznano ich już za zmarłych, powrócili bezpiecznie z szacowanej wysokości ponad 52 000 stóp, czyli niemal dziesięciu mil, bijąc wszelkie dotychczasowe rekordy wysokości lotu”."
 curtiss_military_cartography_tech: "Kartografia Wojskowa"
 curtiss_military_cartography_tech_desc: "Widok z lotu ptaka – czy to z gór, wież kościelnych, czy pierwszych balonów na ogrzane powietrze – zrewolucjonizował tworzenie precyzyjnych map wojskowych. Dzięki temu sztaby wojskowe mogły dokładnie ustalać położenie wojsk nieprzyjaciela."