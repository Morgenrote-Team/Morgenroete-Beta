 je_curtiss_found_private_airline: "[ROOT.GetCountry.GetAdjectiveNoFormatting] Przedsiębiorstwo Lotnicze"
 je_curtiss_found_private_airline_reason: "Wraz z upowszechnieniem się samolotów w życiu codziennym lotnictwo przestaje być domeną wyłącznie wojska. Choć transport lotniczy jest kosztowny, istnieje wiele powodów, by przewozić drogą powietrzną zarówno towary, jak i pasażerów. Przy sprzyjających warunkach wkrótce powinno powstać pierwsze prywatne przedsiębiorstwo lotnicze."
 je_curtiss_found_state_airline: "Narodowe Przedsiębiorstwo Lotnicze"
 je_curtiss_found_state_airline_reason: "W światowej rywalizacji o podbój przestworzy [ROOT.GetCountry.GetNameNoFlag] musi zająć ważne miejsce. Aby zapewnić naszym obywatelom szybki transport, dobrym pomysłem jest utworzenie państwowej linii lotniczej."
 je_curtiss_spruce_goose_plan: "Herkules Przestworzy"
 je_curtiss_spruce_goose_plan_reason: "Niebo jest ostatnią granicą. To, co we wczesnej epoce nowożytnej było epoką wielkich odkryć, dziś stało się podbojem przestworzy. Jednak w porównaniu z hiszpańskimi galeonami dzisiejsze statki powietrzne są zaledwie łupinkami orzecha. Po morzach pływają dziś prawdziwe oceaniczne olbrzymy, podczas gdy na niebie wciąż królują niewielkie maszyny. Marzenie o zbudowaniu gigantycznego samolotu, który mógłby przewozić nie dziesiątki, lecz setki ludzi, wydaje się utopią. Jednak prężnie rozwijający się przemysł lotniczy i potężna linia lotnicza, na której czele stanie odpowiedni człowiek, mogą wywrócić świat do góry nogami..."
 je_curtiss_spruce_goose_build_reason: "Czym jest szaleństwo? Czym jest megalomania? Czym jest geniusz? Cokolwiek [SCOPE.sCharacter('howard_hughes').GetFullName] zamierzał osiągnąć za pomocą tego projektu, przerasta on wszystko, o czym technologia i ludzka pomysłowość odważyły się dotąd marzyć. To po prostu największy samolot w historii świata, zdolny przewieźć całą wieś. Rząd, kierując się względami prestiżowymi, obiecał wesprzeć ten projekt kwotą do @money! #R 200K#!. To grosze w porównaniu z tym, co robi jego firma. Jeśli [SCOPE.sCharacter('howard_hughes').GetLastName] odniesie sukces z [ROOT.GetCountry.GetCapital.GetCityHubName], będzie to oznaczać rewolucję w lotnictwie. Jeśli poniesie porażkę, będzie to miało katastrofalne konsekwencje dla jego firmy i całego lotnictwa. Ale właśnie na tym polega problem z ekscentrykami takimi jak [SCOPE.sCharacter('howard_hughes').GetLastName]: dopiero na samym końcu okazuje się, czy mamy do czynienia z szaleńcem, czy geniuszem."
 je_curtiss_spruce_goose_build_goal: "Najlepsi inżynierowie w kraju pracują bez wytchnienia nad gigantycznym samolotem. Szacują, że całkowity czas budowy wyniesie około #BLUE 36#! miesięcy. Od rozpoczęcia budowy upłynęło już #G [ROOT.Var('curtiss_spruce_goose_progress').GetValue]#! miesięcy."
 je_curtiss_hindenburg_plan: "Podróż z Klasą"
 je_curtiss_hindenburg_plan_reason: "Podróże zeppelinami osiągnęły szczyt rozwoju. Nasz kraj uchodzi za ojczyznę największych i najbardziej ponurych zeppelinów na świecie. Czas zadziwić cały świat gigantycznym zeppelinem i odbyć podróż dookoła globu."
 je_curtiss_hindenburg_build_reason: "Nasza prężnie rozwijająca się linia lotnicza zleciła realizację ogromnego projektu, który pozwoli przewozić więcej pasażerów niż kiedykolwiek wcześniej. Podróżni mają mieć zapewnione wszelkie luksusy, od własnego baru z fortepianem koncertowym po znakomitą restaurację oferującą najwyższej jakości wina z całego świata."
 je_curtiss_hindenburg_build_goal: "Najlepsi inżynierowie w kraju pracują bez wytchnienia nad gigantycznym zeppelinem. Szacują, że całkowity czas budowy wyniesie około #BLUE 60#! miesięcy. Od rozpoczęcia budowy upłynęło już #G [ROOT.Var('curtiss_hindenburg_progress').GetValue]#! miesięcy."
 je_curtiss_lindbergh_generic: "Nagroda Orteiga"
 je_curtiss_lindbergh_generic_reason: "Nagroda Orteiga była wyróżnieniem przyznawanym pierwszemu lotnikowi lub grupie lotników, którym udałoby się odbyć nieprzerwany lot z Nowego Jorku do Paryża lub w przeciwnym kierunku. Zanim stosunkowo mało znany Amerykanin Charles Lindbergh zdobył nagrodę w 1927 roku, pokonując tę trasę na pokładzie swojego samolotu Spirit of St. Louis, kilka słynnych osobistości lotnictwa podejmowało nieudane próby przelotu na trasie Nowy Jork–Paryż. W rywalizacji o nagrodę zginęło jednak wiele osób. Sześciu mężczyzn poniosło śmierć w trzech osobnych katastrofach, a kolejnych trzech zostało rannych w czwartej. Nagroda przyczyniła się do znacznych inwestycji w lotnictwo, niekiedy wielokrotnie przewyższających jej wartość, a także do wzrostu zainteresowania lotnictwem wśród społeczeństwa i rozwoju technologii lotniczej. Po raz pierwszy została ufundowana w 1919 roku przez Raymonda Orteiga, właściciela nowojorskiego hotelu. Przez pięć lat nagroda pozostawała do zdobycia, jednak jej cel wydawał się wówczas poza zasięgiem ówczesnych samolotów, dlatego nie zgłosił się żaden uczestnik. Po wygaśnięciu pierwotnego terminu Orteig ponownie ustanowił nagrodę 1 czerwca 1925 roku, deponując 25 000 dolarów amerykańskich w zbywalnych papierach wartościowych w Bryant Bank. Nadzór nad przyznaniem nagrody powierzono siedmioosobowej radzie powierniczej."
 je_curtiss_lindbergh_usa: "Nagroda Orteiga"
 je_curtiss_lindbergh_usa_reason: "Nagroda Orteiga była wyróżnieniem przyznawanym pierwszemu lotnikowi lub grupie lotników, którym udałoby się odbyć nieprzerwany lot z Nowego Jorku do Paryża lub w przeciwnym kierunku. Zanim stosunkowo mało znany Amerykanin Charles Lindbergh zdobył nagrodę w 1927 roku, pokonując tę trasę na pokładzie swojego samolotu Spirit of St. Louis, kilka słynnych osobistości lotnictwa podejmowało nieudane próby przelotu na trasie Nowy Jork–Paryż. W rywalizacji o nagrodę zginęło jednak wiele osób. Sześciu mężczyzn poniosło śmierć w trzech osobnych katastrofach, a kolejnych trzech zostało rannych w czwartej. Nagroda przyczyniła się do znacznych inwestycji w lotnictwo, niekiedy wielokrotnie przewyższających jej wartość, a także do wzrostu zainteresowania lotnictwem wśród społeczeństwa i rozwoju technologii lotniczej. Po raz pierwszy została ufundowana w 1919 roku przez Raymonda Orteiga, właściciela nowojorskiego hotelu. Przez pięć lat nagroda pozostawała do zdobycia, jednak jej cel wydawał się wówczas poza zasięgiem ówczesnych samolotów, dlatego nie zgłosił się żaden uczestnik. Po wygaśnięciu pierwotnego terminu Orteig ponownie ustanowił nagrodę 1 czerwca 1925 roku, deponując 25 000 dolarów amerykańskich w zbywalnych papierach wartościowych w Bryant Bank. Nadzór nad przyznaniem nagrody powierzono siedmioosobowej radzie powierniczej."
 je_curtiss_zeppelin_expedition: "Wyprawa Zeppelinem na Biegun Północny"
 je_curtiss_zeppelin_expedition_reason: "Aeroarctic, czyli „Międzynarodowe Towarzystwo Badań nad Arktyką z Wykorzystaniem Sterowców”, było pozarządowym stowarzyszeniem naukowym, którego celem było wykorzystanie sterowców w badaniach polarnych. Powstało głównie z inicjatywy aeronauty, a późniejszego sekretarza generalnego stowarzyszenia, Walthera Brunsa. Pierwszym prezesem, wybranym w 1924 roku, został Fridtjof Nansen. Po kilku latach przygotowań w 1931 roku organizacji udało się po raz pierwszy wykorzystać sterowiec do przeprowadzenia wyprawy polarnej o charakterze czysto naukowym. Dzięki arktycznemu lotowi LZ 127 Graf Zeppelin znacznie poszerzono wiedzę na temat geografii przemierzonych obszarów polarnych. Już w 1926 roku Umberto Nobile przeleciał nad Biegunem Północnym swoim sterowcem „Norge”, a później zorganizował kolejną wyprawę na pokładzie „Italii”."
 je_curtiss_zeppelin_expedition_goal: "Nasza Wyprawa Zeppelinowa powróci za #BLUE 16#! tygodni. Obecnie upłynęło już #G [ROOT.Var('curtiss_zeppelin_progress').GetValue]#! tygodni."
 je_zeppelin_expedition_fail: "Wyprawa zakończy się niepowodzeniem, jeśli poziom ryzyka osiągnie #R 3#! lub więcej."
 je_curtiss_lost_horizon: "Zaginiony Horyzont"
 je_curtiss_lost_horizon_reason: "Według objaśnień zawartych w rękopisie gdzieś w Himalajach znajduje się tajemnicze miejsce, do którego nie prowadzą żadne drogowskazy ani szlaki. Podobno jednak w wysokich górach Tybetu znajdują się trzy artefakty, które – przy pomocy doświadczonego archeologa – powinny wskazać drogę do sekretnej doliny."
 je_curtiss_lost_horizon_goal: "Dotychczas odnaleźliśmy #G [ROOT.Var('curtiss_shangrila_progress').GetValue]#! z #BLUE 3#! artefaktów."
 curtiss.10.t: "Władca Powietrza i Wody"
 curtiss.10.d: "Era wodnosamolotów i łodzi latających nie tylko rewolucjonizuje transport i otwiera nieznane dotąd możliwości, lecz także rozbudza ducha dążącego do pokonania ostatnich barier."
 curtiss.10.f: "Wynalezienie wodnosamolotu przyniosło nieoczekiwane korzyści na początku XX wieku. Samoloty te mogły lądować na jeziorach, rzekach i w portach, umożliwiając lądowanie zarówno w pobliżu ośrodków miejskich, jak i na niezbadanych terenach dzikiej przyrody – bez konieczności posiadania lotniska czy pasa startowego. Jednocześnie państwa rywalizowały o ustanawianie nowych rekordów w wyścigach wodnosamolotów."
 curtiss.10.g: "To ostatnia Epoka Heroiczna."
 curtiss.12.t: "Henri Fabre"
 curtiss.12.d: "Pionier lotnictwa Henri Fabre przetestował dziś wodnosamolot w Zatoce Marsylskiej, dokonując przełomu w dziejach lotnictwa."
 curtiss.12.f: "Henri Fabre był inżynierem, który badał samoloty konstrukcji Louisa Blériota i Gabriela Voisina. W 1909 roku postanowił rozpocząć budowę pierwszego prototypu wodnosamolotu. Fabre poświęcił wiele czasu na skonstruowanie pływaków. Zdobyta w ten sposób wiedza pomogła mu później wyposażać w pływaki również samoloty innych konstrukcji. Pierwszy prototyp był jednak wyposażony w słaby silnik o mocy 18 kW (25 KM), przez co nie zdołał wzbić się w powietrze. Kolejna maszyna otrzymała znacznie mocniejszy, 37-kilowatowy (50-konny) silnik gwiazdowy Gnôme. Samolotowi nadano nazwę „Hydravion” (wodnosamolot). 28 marca 1910 roku rozpoczęto próby startu na wodach Étang de Berre w Martigues, niedaleko Marsylii. Druga próba zakończyła się sukcesem, a samolot przeleciał około 600 metrów. Następnego dnia pokonał już nawet 6 kilometrów. Delikatna konstrukcja Hydraviona okazała się bardzo stabilna. Po katastrofie podczas lądowania samolot przeszedł gruntowny remont. W kwietniu 1911 roku jego nowa wersja wystartowała w Monako z pilotem Jeanem Bécue za sterami. Wkrótce z Henrim Fabre'em skontaktowali się Glenn Curtiss i Gabriel Voisin, którzy wykorzystali jego wynalazek do opracowania własnych wodnosamolotów. Henri Fabre zmarł w 1984 roku w biblijnie sędziwym wieku 101 lat, będąc jednym z ostatnich żyjących pionierów lotnictwa. Jeszcze w 1971 roku Fabre twierdził, że nadal samodzielnie żegluje własną łodzią po porcie w Marsylii."
 curtiss.12.g: "Uwielbiam ten wodnosamolot... a może to łódź latająca?"
 curtiss.13.t: "Lotnisko Wodne w [SCOPE.sState('curtiss_water_airport_state').GetName]"
 curtiss.13.d: "Dobra infrastruktura w stanie [SCOPE.sState('curtiss_water_airport_state').GetName], w połączeniu z tamtejszym portem i wysokim stopniem urbanizacji, doprowadziła do rozwoju prężnego ruchu wodnosamolotowego."
 curtiss.13.f: "W 1923 roku uruchomiono pierwsze udane komercyjne połączenie obsługiwane przez łodzie latające, realizujące loty na Wyspy Normandzkie i z powrotem. W 1928 roku cztery łodzie latające Supermarine Southampton należące do wyprawy RAF na Daleki Wschód dotarły do Melbourne w Australii. Lot ten uznano za dowód, że łodzie latające stały się niezawodnym środkiem transportu dalekodystansowego. W latach 30. XX wieku łodzie latające umożliwiły uruchomienie regularnych połączeń lotniczych między Stanami Zjednoczonymi a Europą, otwierając nowe trasy do Ameryki Południowej, Afryki i Azji. Foynes w Irlandii oraz Botwood w Nowej Fundlandii i Labradorze były portami docelowymi wielu pierwszych lotów transatlantyckich. Na obszarach pozbawionych lotnisk dla samolotów lądowych łodzie latające mogły zatrzymywać się na niewielkich przystaniach rzecznych, jeziornych lub nadmorskich, aby uzupełnić paliwo i zapasy. Łodzie latające Boeing 314 „Clipper” należące do Pan Am sprawiły, że nowe, egzotyczne kierunki, takie jak Daleki Wschód, stały się osiągalne, a same maszyny zaczęły symbolizować romantyzm podniebnych podróży."
 curtiss.13.g: "Wodnosamoloty to Przyszłość."
 curtiss.20.t: "[ROOT.GetCountry.GetAdjectiveNoFormatting] Założono Przedsiębiorstwo Lotnicze"
 curtiss.20.d: "Wybitny przedsiębiorca [SCOPE.sCharacter('howard_hughes').GetFullName] uruchomił pierwsze w kraju przedsiębiorstwo lotnicze. Już teraz pojawiają się wątpliwości, czy ten ekscentryczny biznesmen nie bierze na siebie zbyt wiele, podejmując się tak kosztownego przedsięwzięcia. Dla [ROOT.GetCountry.GetName] jest to bez wątpienia znaczący krok ku przyszłości."
 curtiss.20.f: "„Nie jestem paranoicznym, obłąkanym milionerem. Do cholery, jestem miliarderem!” – Howard Hughes"
 curtiss.20.g: "Gratulacje!"
 curtiss.20.h: "Przyszłość należy do lotnictwa – wesprzyj przedsiębiorstwo!"
 curtiss.21.t: "Założono Narodowe Przedsiębiorstwo Lotnicze"
 curtiss.21.d: "Dzięki utworzeniu narodowej linii lotniczej [ROOT.GetCountry.GetNameNoFlag] stało się siłą napędową postępu ludzkości."
 curtiss.21.f: "Państwowe linie lotnicze są droższe w utrzymaniu niż ich prywatne odpowiedniki i nie oferują takich samych korzyści. Nie popadają jednak w trudności finansowe, dzięki czemu są nieco lepiej chronione przed ryzykiem."
 curtiss.21.g: "Szampan!"
 curtiss.22.t: "Prywatyzacja Narodowego Przedsiębiorstwa Lotniczego"
 curtiss.22.d: "Po niedawnej zmianie konstytucji rząd ogłosił, że państwowe przedsiębiorstwo lotnicze zostanie rozwiązane i przekształcone w prywatną spółkę."
 curtiss.22.f: "Liberalizacja gospodarki sprawiła, że nasze państwowe przedsiębiorstwo lotnicze nie ma już przyszłości w obecnej formie. Wielu polityków odczuwa wręcz ulgę, ponieważ linie lotnicze stanowią kosztowny luksus. Znaleziono również zamożnego inwestora, [SCOPE.sCharacter('howard_hughes').GetFullName], który w przyszłości będzie zarządzał przedsiębiorstwem. Sprzedaż przyniesie wysokie wpływy z prywatyzacji, jednak niektórzy lobbyści argumentują, że należy z nich zrezygnować, aby pomóc nowym przedsiębiorstwom rozpocząć działalność. Powinniśmy zadowolić się samym pozbyciem się kosztów bieżącego utrzymania."
 curtiss.22.g: "Wpływy z prywatyzacji powinny zasilić nasz budżet."
 curtiss.22.h: "Przedsiębiorstwo powinno zachować te środki, aby móc się rozwijać i prosperować."
 curtiss.23.t: "Nacjonalizacja [ROOT.GetCountry.GetAdjectiveNoFormatting] Linii Lotniczych"
 curtiss.23.d: "[ROOT.GetCountry.GetAdjectiveNoFormatting] Linie Lotnicze nadal uchodzą za jedno z największych prywatnych przedsiębiorstw w całym kraju. Pojawiają się głosy, że powinny zostać objęte kontrolą państwa."
 curtiss.23.f: "Jest całkowicie jasne, że tak duże przedsiębiorstwo jak [ROOT.GetCountry.GetAdjectiveNoFormatting] Przedsiębiorstwo Lotnicze należące do [SCOPE.sCharacter('howard_hughes').GetFullName] powinno zostać albo podzielone, albo znacjonalizowane. W związku z tym wysocy rangą urzędnicy przedstawili już plany przejęcia prywatnego przedsiębiorstwa przez państwo. Jedna grupa opowiada się za przeprowadzeniem transakcji w możliwie najbardziej zgodny z prawem sposób, aby zapewnić całej procedurze pozory legalności. Inni dostrzegają natomiast okazję do dania przykładu i skonfiskowania majątku [SCOPE.sCharacter('howard_hughes').GetFullName], by przeznaczyć go na dobro publiczne."
 curtiss.23.g: "Znacjonalizuj Przedsiębiorstwo zgodnie z prawem."
 curtiss.23.h: "Te tłuste pasożyty od zdecydowanie zbyt dawna żerują na ludzie."
 curtiss.30.t: "Il Vate"
 curtiss.30.d: "Wielki pisarz [SCOPE.sCharacter('curtiss_dannunzio').GetFullName] usłyszał wezwanie wojny i zgłosił się do służby jako pilot."
 curtiss.30.f: "Gabriele D'Annunzio był włoskim poetą, dramaturgiem, mówcą, dziennikarzem, arystokratą i oficerem Królewskiej Armii Włoskiej podczas I wojny światowej. Zajmował poczesne miejsce we włoskiej literaturze w latach 1889–1910, a następnie w życiu politycznym w latach 1914–1924. Często określano go przydomkiem Il Vate („Wieszcz”). W swojej twórczości literackiej D'Annunzio był związany z dekadentyzmem, łączącym się ściśle z francuskim symbolizmem i brytyjskim estetyzmem. Jego dzieła stanowiły zwrot przeciwko naturalizmowi wcześniejszej epoki romantyzmu, odznaczając się zmysłowością i mistycyzmem. Duży wpływ wywarła na niego filozofia Friedricha Nietzschego, której oddziaływanie znalazło odzwierciedlenie zarówno w jego twórczości literackiej, jak i późniejszej działalności politycznej. Podczas I wojny światowej postrzeganie D'Annunzia we Włoszech zmieniło się – z postaci literackiej stał się bohaterem narodowym. Był związany z elitarnymi oddziałami szturmowymi włoskiej armii, zwanymi Arditi, i brał udział w takich akcjach jak Lot nad Wiedniem."
 curtiss.30.g: "Iterum rudit leo!"
 curtiss.31.t: "Der Rote Baron"
 curtiss.31.d: "Dzięki [SCOPE.sCharacter('curtiss_richthofen').GetFullName] Niemcy mogą poszczycić się jednym z najwybitniejszych asów lotnictwa w historii świata."
 curtiss.31.f: "Manfred Albrecht Freiherr von Richthofen był niemieckim oficerem i pilotem myśliwskim podczas I wojny światowej. Odniósł najwięcej zwycięstw powietrznych spośród wszystkich pilotów biorących udział w tej wojnie. Richthofen stał się jednym z najsłynniejszych pilotów na świecie i do dziś pozostaje postacią obecną w filmach, książkach i innych mediach. Przydomki takie jak Czerwony Baron nawiązują do jego arystokratycznego pochodzenia oraz czerwonego malowania jego samolotu."
 curtiss.31.g: "Rodzą się Legendy."
 curtiss.40.t: "Przez Atlantyk bez Międzylądowania"
 curtiss.40.g: "Przygotuj Paradę z Konfetti!"
 curtiss.42.g: "Popis Asa Lotnictwa"
 curtiss.50.t: "Przyszłość Aeronautyki"
 curtiss.50.d: "Wraz z dalszym rozwojem technologii lotniczej i lotnictwa cywilnego pojawia się pytanie, czy nasz kraj powinien inwestować w rozwój samolotów, czy sterowców."
 curtiss.50.f: "„To prawda, kruche ciała jego towarzyszy nie obciążają jego samolotu; to prawda, niespokojne umysły słabszych ludzi nie zajmują miejsca w jego zatłoczonej kabinie; lecz gdy jego sterowiec podąża wyznaczonym kursem, obcuje z tymi nielicznymi duchami, które napełniają go odwagą, a dzięki swej podtrzymującej sile dodają mocy jego ramieniu, pomysłowości jego umysłowi i spokoju jego duszy. Samotny? Z jakimi innymi towarzyszami miałby latać człowiek, gdyby dano mu wybór?” – Charles Lindbergh"
 curtiss.50.g: "Samoloty."
 curtiss.50.h: "Sterowce."
 curtiss.51.t: "Odkryto Hel"
 curtiss.51.d: "Podczas wierceń w poszukiwaniu ropy nasi robotnicy natrafili na złoże gazu zawierające hel w stanie [SCOPE.sState('curtiss_helium_state').GetName]. Odkrycie to może okazać się przydatne dla naszego przemysłu lotniczego."
 curtiss.51.f: "Pierwsze dowody na obecność helu zaobserwowano 18 sierpnia 1868 roku w postaci jasnożółtej linii o długości fali 587,49 nanometra w widmie chromosfery Słońca. Linię tę wykrył francuski astronom Jules Janssen podczas całkowitego zaćmienia Słońca w Guntur w Indiach. Lockyer i angielski chemik Edward Frankland nadali pierwiastkowi nazwę pochodzącą od greckiego słowa oznaczającego Słońce (helios). 26 marca 1895 roku szkocki chemik Sir William Ramsay wyizolował hel na Ziemi. W 1903 roku podczas odwiertów w poszukiwaniu ropy w stanie Kansas natrafiono na gejzer gazowy, którego płomień nie chciał się palić. Geolog stanowy Kansas, Erasmus Haworth, pobrał próbki wydobywającego się gazu. Po dalszych analizach Hamilton Cady i David McFarland odkryli, że hel stanowił 1,84% badanej próbki gazu. Dowiodło to, że mimo ogólnej rzadkości helu na Ziemi, jego duże ilości gromadziły się pod Wielkimi Równinami Amerykańskimi, skąd można go było pozyskiwać jako produkt uboczny wydobycia gazu ziemnego. Chociaż proces jego pozyskiwania z wykorzystaniem skraplania gazu w niskiej temperaturze nie został opracowany na czas, by odegrać znaczącą rolę podczas I wojny światowej, produkcja była kontynuowana. Hel wykorzystywano przede wszystkim jako gaz nośny w statkach powietrznych lżejszych od powietrza."
 curtiss.51.g: "Potrzebujemy Rezerwy Strategicznej."
 curtiss.52.t: "Utracono Rezerwę Helu"
 curtiss.52.d: "Bez dostępu do złóż ropy i gazu nie jesteśmy już w stanie wydobywać helu."
 curtiss.52.g: "To chyba nie powinien być duży problem... prawda?"
 curtiss.53.t: "Hrabia [SCOPE.sCharacter('tesla_new_engineer_scope').GetFullName] poszukuje wsparcia w budowie sterowca."
 curtiss.53.d: "Nikt nie wie, czy Hrabia [SCOPE.sCharacter('tesla_new_engineer_scope').GetFullName] jest szaleńcem, czy geniuszem, ale poszukuje wsparcia dla swojego planu budowy sterowca. Czy powinniśmy go wesprzeć?"
 curtiss.53.f: "„Balony mają oczywiście jedną zasadniczą wadę: nie można nimi sterować. Przekonałem się o tym podczas różnych wojen i zauważyłem, że da się rozwiązać ten problem. Potrzebuję jedynie wystarczających środków, aby zbudować sterowiec zdolny do lotu z pełną kontrolą nad kierunkiem lotu”."
 curtiss.53.g: "Nowy Ikar. Strata pieniędzy."
 curtiss.53.h: "Wspaniały pomysł! Wesprzyj go!"
 curtiss.54.t: "Zeppelin LZ 1 hrabiego von Zeppelina wzbił się w powietrze!"
 curtiss.54.d: "Dzisiejszy lot sterowca Ferdinanda von Zeppelina zapoczątkował nową erę w lotnictwie."
 curtiss.54.f: "13 sierpnia 1898 roku Zeppelin uzyskał patent Rzeszy nr 98580 na „sterowny statek powietrzny z kilkoma elementami nośnymi rozmieszczonymi jeden za drugim”. Najważniejszymi cechami konstrukcji Zeppelina były sztywna aluminiowa rama złożona z pierścieni i podłużnic, solidne przymocowanie dwóch gondoli do ramy, podział przestrzeni gazowej na cylindryczne komory jednakowej wielkości oraz umieszczenie śmigieł na wysokości środka oporu powietrza. Sterowce te nazwano zeppelinami. Pomysły Zeppelina nadal spotykały się z powszechnym odrzuceniem i drwinami ze strony ekspertów oraz opinii publicznej. Cesarz Wilhelm II określił hrabiego mianem „najgłupszego ze wszystkich południowych Niemców”. W tym okresie Zeppelin powiedział: „Oczywiście nikt mnie nie popiera, ponieważ nikt nie chce skoczyć w nieznane. Jednak mój cel jest jasny, a moje obliczenia są prawidłowe”. W 1900 roku LZ 1 odbył trzy loty nad Jeziorem Bodeńskim, a funkcję dyrektora technicznego Zeppelina pełnił inżynier Fritz Burr. Coraz lepsze wyniki wywołały spontaniczny entuzjazm wśród ludności, co w decydującym stopniu przyczyniło się do umożliwienia hrabiemu dalszego rozwijania technologii sterowców i ich eksploatacji."
 curtiss.54.g: "Wiedziałem, że mu się uda!"
 curtiss.100.t: "Puchar Schneidera"
 curtiss.100.d: "Przygotowania dobiegły końca, ufundowano nagrodę pieniężną i przekazano trofeum. Za 3 miesiące rozpocznie się walka o Puchar Schneidera – najbardziej prestiżową nagrodę, jaką kiedykolwiek ufundowano w wyścigach lotniczych!"
 curtiss.100.f: "Coupe d'Aviation Maritime Jacques Schneider, znane również jako Puchar Schneidera, Nagroda Schneidera lub Trofeum Schneidera, było trofeum przyznawanym corocznie (a później co dwa lata) zwycięzcy wyścigu wodnosamolotów i łodzi latających. Wyścig odegrał istotną rolę w rozwoju konstrukcji samolotów, szczególnie w dziedzinie aerodynamiki i projektowania silników, a jego osiągnięcia znalazły później odzwierciedlenie w najlepszych myśliwcach II wojny światowej. Opływowe kształty oraz chłodzone cieczą silniki o niewielkim oporze aerodynamicznym, opracowane na potrzeby konstrukcji biorących udział w Pucharze Schneidera, są wyraźnie widoczne w brytyjskim Supermarine Spitfire, amerykańskim North American P-51 Mustang oraz włoskim Macchi C.202 Folgore. Zawody cieszyły się ogromną popularnością, a niektóre z nich przyciągały ponad 200 000 widzów."
 curtiss.100.g: "Roześlij Zaproszenia!"
 curtiss.101.d: "Otrzymaliśmy zaproszenie do udziału w Wyścigu o Puchar Schneidera! Organizatorem Wyścigu jest [SCOPE.sCountry('curtiss_schneider_trophy_host').GetName]."
 curtiss.101.g: "Rzućcie mi te gogle lotnicze, chłopaki!"
 curtiss.101.h: "Nie, dopóki czerwone świnie nie nauczą się latać..."
 curtiss.102.d: "Przygotowania dobiegły końca. Za 3 miesiące cały świat zjedzie się do [SCOPE.sState('curtiss_schneider_trophy_state').GetName], aby być świadkiem wyścigu światowej klasy, w którym zmierzą się najnowocześniejsze wodnosamoloty."
 curtiss.103.t: "Wsparcie dla Naszego Zespołu"
 curtiss.103.d: "Wyścig o Puchar Schneidera wkrótce się rozpocznie. Cały świat będzie obserwował poczynania naszych pilotów, a wraz z nimi także naszego kraju. Możemy zwiększyć szanse naszego zespołu, zapewniając mu wsparcie finansowe. Oczywiście wszystko to ma swoją cenę..."
 curtiss.103.f: "Rywalizacja o Puchar Schneidera początkowo rozpoczęła się jako wyścig pomiędzy różnymi pilotami i ich samolotami, przy niewielkim wsparciu ze strony rządów. Jednak w latach 20. XX wieku zawody zyskały tak wielki rozgłos, że uczestniczyły w nich setki tysięcy widzów. Wraz z tym wyścig i jego znaczenie nabrały zupełnie nowego wymiaru. Gdy Stany Zjednoczone i Włochy wkrótce potem oficjalnie zadeklarowały wsparcie dla swoich zespołów, rywalizacja przekształciła się w turniej narodów. Początkowo takie zaangażowanie państw uznawano za niedopuszczalne, jednak groźba utraty przewagi nad konkurencją zmusiła inne kraje, takie jak Wielka Brytania, do oficjalnego wsparcia swoich zespołów, aby nie pozostać w tyle."
 curtiss.103.g: "Dla Honoru Narodowego żadna cena nie jest zbyt wysoka!"
 curtiss.103.h: "Nasz zespół jest dobry taki, jaki jest."
 curtiss.104.t: "Trening przed Pucharem Schneidera"
 curtiss.104.d: "W związku ze zbliżającymi się zawodami o prestiżowy Puchar Schneidera rozważa się, czy nasi piloci powinni przejść dodatkowe szkolenie."
 curtiss.104.f: "Żaden sportowiec nie przystępuje do zawodów nieprzygotowany – to samo dotyczy pilotów przed nadchodzącym wyścigiem. Zawsze jednak toczą się dyskusje na temat treningów poprzedzających zawody. Duże prędkości i ryzykowne manewry dają gwarancję, że nasz zespół zajmie wyższe miejsce. Podczas niektórych sesji treningowych pobito nawet rekordy. Jednocześnie ćwiczenia te uznawane są za niebezpieczne. W przeciwieństwie do samego wyścigu o Puchar Schneidera, podczas którego nie doszło do żadnych poważnych wypadków, w latach 1923–1931 podczas przygotowań zginęło aż dziesięciu pilotów."
 curtiss.104.g: "Nasi piloci potrzebują lepszego przeszkolenia!"
 curtiss.104.h: "To zbyt niebezpieczne."
 curtiss.105.t: "Nowy Rekord!"
 curtiss.105.d: "Dodatkowy trening przed Pucharem Schneidera okazał się opłacalny. Nasz zespół nie tylko bezbłędnie pokonał całą trasę, ale także ustanowił nowy rekord prędkości. To dobrze rokuje przed nadchodzącym wyścigiem!"
 curtiss.105.f: "„Lataję, ponieważ uwalnia to mój umysł od tyranii błahostek”. – Antoine de Saint-Exupéry"
 curtiss.105.g: "Świetna robota, chłopaki!"
 curtiss.106.t: "Przeciętny występ"
 curtiss.106.d: "Być może winna była pogoda, a może brak motywacji – niestety nasz zespół osiągnął jedynie przeciętne wyniki podczas treningów przed Pucharem Schneidera. To może i lepsze niż nic, ale oczekiwaliśmy od naszych pilotów znacznie więcej."
 curtiss.106.f: "„Każdemu trudno jest wyznaczyć sobie plan działania i konsekwentnie się go trzymać, zwłaszcza w obliczu oczekiwań przyjaciół. Dla lotnika jest to jednak dwa razy trudniejsze, gdy musi pozostać na ziemi i czekać na odpowiedni moment, by wzbić się w powietrze”. – Glenn Curtiss"
 curtiss.106.g: "Lepsze to niż nic."
 curtiss.107.t: "Wypadek podczas Treningu!"
 curtiss.107.d: "Ostatnia sesja treningowa przed Pucharem Schneidera zakończyła się katastrofą – z niewyjaśnionych dotąd przyczyn jeden z naszych pilotów stracił kontrolę nad samolotem i z ogromną siłą uderzył w taflę wody. Choć poszkodowanego udało się uratować z wielkim trudem, naprawa uszkodzeń i ustalenie przyczyny wypadku zajmą kilka tygodni. Fakt, że podczas nadchodzącego wyścigu zabraknie również jednego z naszych najbardziej utalentowanych pilotów, zmniejsza nasze szanse w walce o Puchar Schneidera."
 curtiss.107.f: "„Samolot utrzymuje się w powietrzu, ponieważ nie ma czasu spaść”. – Orville Wright"
 curtiss.107.g: "Katastrofa!"
 curtiss.108.t: "Pilot Pucharu Schneidera"
 curtiss.108.d: "Wciąż nie wiadomo, który pilot stanie na czele zespołu biorącego udział w wyścigu o Puchar Schneidera."
 curtiss.108.f: "Zazwyczaj Puchar Schneidera nie był rywalizacją narodów, lecz pojedynczych pilotów. Wkrótce jednak powszechną praktyką stało się wystawianie przez poszczególne kraje kilku pilotów startujących w jednym zespole, zazwyczaj składającym się z trzech pilotów i trzech samolotów. Szybko narodził się kult poszczególnych pilotów, jednak w późniejszych latach coraz większe znaczenie zaczęła odgrywać praca zespołowa."
 curtiss.108.g: "[SCOPE.sCharacter('curtiss_schneider_pilot_1').GetFullName]"
 curtiss.108.h: "[SCOPE.sCharacter('curtiss_schneider_pilot_2').GetFullName]"
 curtiss.108.i: "[SCOPE.sCharacter('curtiss_schneider_pilot_3').GetFullName]"
 curtiss.108.j: "[SCOPE.sCharacter('curtiss_schneider_pilot_4').GetFullName]"
 curtiss.108.k: "Debiutant"
 curtiss.110.t: "Wyścig o Puchar Schneidera w stanie [SCOPE.sState('curtiss_schneider_trophy_state').GetName]"
 curtiss.110.d: "W powietrzu rozbrzmiewa ryk silników! Wreszcie nadszedł wielki dzień wyścigu – cały świat przybywa do [SCOPE.sCountry('curtiss_schneider_trophy_host').GetNameNoFlag], aby być świadkiem walki o Puchar Schneidera. Pozostaje tylko pytanie: który Uczestnik zwycięży?"
 curtiss.110.f: "„Przede wszystkim latanie daje poczucie doskonałego spokoju, połączonego z ekscytacją, która napina każdy nerw do granic możliwości. O ile potrafisz sobie wyobrazić takie połączenie”. – Wilbur Wright"
 curtiss.110.g: "Kręć śmigłem!"
 curtiss.111.t: "Zwycięstwo!"
 curtiss.111.d: "Po zaciętej walce o zwycięstwo [ROOT.GetCountry.GetNameNoFormatting] zdobyło w tym roku Puchar Schneidera! W związku z tym organizacja kolejnego wyścigu przypadnie naszemu krajowi."
 curtiss.111.f: "Kraj, który odniesie trzy zwycięstwa z rzędu, będzie mógł zatrzymać Puchar Schneidera na zawsze. To prestiżowe trofeum jest czymś więcej niż tylko nagrodą w zawodach sportowych – stanowi symbol przewagi technologicznej oraz dążenia narodu do przekraczania własnych granic i podboju przestworzy. Posiadacz Pucharu Schneidera będzie obiektem zazdrości całego świata. Podczas historycznych zawodów o Puchar Schneidera wystarczyły trzy zwycięstwa w ciągu pięciu lat, jednak w tej grze wymagane są trzy zwycięstwa z rzędu. Kraj, który jako ostatni zdobędzie Puchar Schneidera, będzie miał zaszczyt zorganizować kolejny wyścig."
 curtiss.111.g: "Wspaniały dzień dla naszego kraju."
 curtiss.112.t: "[SCOPE.sCountry('curtiss_schneider_trophy_recent_winner').GetNameNoFlag] zdobywa Puchar Schneidera"
 curtiss.112.d: "Niestety, nasze najlepsze starania nie wystarczyły. Zespół z kraju [SCOPE.sCountry('curtiss_schneider_trophy_recent_winner').GetName] zdobył w tym roku Puchar Schneidera."
 curtiss.112.f: "Kraj, który odniesie trzy zwycięstwa z rzędu, będzie mógł zatrzymać Puchar Schneidera na zawsze. To prestiżowe trofeum jest czymś więcej niż tylko nagrodą w zawodach sportowych – stanowi symbol przewagi technologicznej oraz dążenia narodu do przekraczania własnych granic i podboju przestworzy. Posiadacz Pucharu Schneidera będzie obiektem zazdrości całego świata. Podczas historycznych zawodów o Puchar Schneidera wystarczyły trzy zwycięstwa w ciągu pięciu lat, jednak w tej grze wymagane są trzy zwycięstwa z rzędu. Kraj, który jako ostatni zdobędzie Puchar Schneidera, będzie miał zaszczyt zorganizować kolejny wyścig."
 curtiss.112.g: "Gratulacje..."
 curtiss.113.t: "Puchar Schneidera"
 curtiss.113.d: "Trzecie zwycięstwo z rzędu zakończyło rywalizację o Puchar Schneidera. [ROOT.GetCountry.GetNameNoFormatting] udowodniło całemu światu swoją wyższość pod względem personelu, sprzętu i technologii. Nasi piloci przejdą do historii jako bohaterowie narodowi, a nawet za kilkadziesiąt lat ludzie wciąż będą wspominać odważnych lotników, którzy umożliwili odniesienie tego ostatecznego zwycięstwa. Puchar Schneidera należy teraz do nas, a cały świat patrzy na nas z zazdrością!"
 curtiss.113.f: "Dzięki trzeciemu zwycięstwu Puchar Schneidera ostatecznie trafił w ręce jednego narodu. Z jednej strony jest to wielki dzień dla lotnictwa, z drugiej jednak pozostaje melancholijna myśl, że wraz z rekordowym tempem rozwoju lotnictwa pionierska epoka awiacji dobiega końca, ustępując miejsca epoce srebra, w której nie ludzkie ambicje, lecz czysta mechanika odgrywa główną rolę."
 curtiss.113.g: "Podbiliśmy Przestworza!"
 curtiss.114.t: "Trofeum Utracone na Zawsze"
 curtiss.114.d: "Dzięki trzeciemu zwycięstwu z rzędu krajowi [SCOPE.sCountry('curtiss_schneider_trophy_winner').GetName] udało się zdobyć na własność najbardziej pożądane trofeum na świecie. Puchar na zawsze pozostanie teraz w brudnych rękach niegodnych pilotów."
 curtiss.114.f: "Dzięki trzeciemu zwycięstwu Puchar Schneidera ostatecznie trafił w ręce jednego narodu. Z jednej strony jest to wielki dzień dla lotnictwa, z drugiej jednak pozostaje melancholijna myśl, że wraz z rekordowym tempem rozwoju lotnictwa pionierska epoka awiacji dobiega końca, ustępując miejsca epoce srebra, w której nie ludzkie ambicje, lecz czysta mechanika odgrywa główną rolę."
 curtiss.114.g: "Gorzka porażka. Bardzo gorzka."
 curtiss.121.t: "Problemy Mechaniczne"
 curtiss.121.d: "Puchar Schneidera słynął z tego, że wielu pilotów nie było nawet w stanie wziąć udziału w zawodach, ponieważ już sama podróż stanowiła problem. Niektóre maszyny ulegały uszkodzeniom, inne borykały się z problemami silnikowymi, których przyczyn nie udawało się usunąć przed sygnałem startu. Awarie mechaniczne doprowadzały do wycofywania się całych zespołów."
 curtiss.121.f: "Pojedyncze, zupełnie nieistotne głosy twierdzą, że Puchar Schneidera okazał się całkowitą porażką. Utrzymujące się problemy z silnikami, trudności z podróżą oraz śmierć pilotów doświadczalnych miały sprawić, że wiele zespołów nie mogło wziąć udziału w zawodach, co doprowadziło do znacznego uszczuplenia stawki. Francja, historyczna kolebka wodnosamolotów, z powodu takich problemów niemal nie mogła uczestniczyć w wyścigu. Kraje takie jak Wielka Brytania czy Włochy odnosiły zwycięstwa wielokrotnie, ponieważ wystawiały jedyne samoloty, które w ogóle były w stanie wystartować."
 curtiss.121.g: "Partacze!"
 curtiss.122.t: "Katastrofa!"
 curtiss.122.d: "Podczas wykonywania manewru nasz pilot przecenił swoje możliwości i rozbił się o taflę wody!"
 curtiss.122.f: "Pomimo licznych wyzwań, w ciągu dwudziestu lat istnienia wyścigu o Puchar Schneidera nie doszło do żadnego śmiertelnego ani poważnego wypadku. Nie oznacza to jednak, że przy tak dużych prędkościach i konstrukcji samolotów, która wciąż znajdowała się na pionierskim etapie rozwoju, nie mogło dojść do takiej tragedii."
 curtiss.122.g: "O rany!"
 curtiss.123.t: "Przeoczona Boja"
 curtiss.123.d: "Nasz zespół pokonał dobre okrążenie podczas wyścigu o Puchar Schneidera, jednak jednemu z pilotów grozi odjęcie punktów, ponieważ jeden z sędziów zgłosił, że przeoczył on boję."
 curtiss.123.f: "W 1919 roku włoski zespół zwyciężył w Bournemouth w Wielkiej Brytanii, w warunkach gęstej mgły. Sędziowie przy zakręcie w Swanage stwierdzili, że Guido Janello, zwycięzca wyścigu, nie okrążył prawidłowo boi. Janello twierdził jednak, że błąd wynikał ze złej organizacji zawodów, a nieoficjalna łódź wprowadziła go w błąd. Mimo to został zdyskwalifikowany, a Puchar Schneidera nie został w tym roku przyznany. Włochom zrekompensowano to, powierzając im organizację kolejnego wyścigu w Wenecji. Do dziś wspomnienie tej dyskwalifikacji wywołuje ogromną frustrację wśród włoskich miłośników lotnictwa, ponieważ Włochy zwyciężyły również w 1920 i 1921 roku, a gdyby uwzględniono zwycięstwo z 1919 roku, zdobyłyby Puchar Schneidera na zawsze."
 curtiss.123.g: "To oczywiście pech."
 curtiss.123.h: "Spróbuj przekupić sędziego..."
 curtiss.124.t: "Prędkość Maksymalna"
 curtiss.124.d: "Na trasie nasi piloci mogą pokazać, na co stać nasze [ROOT.GetCountry.GetAdjectiveNoFormatting] maszyny."
 curtiss.124.f: "Puchar Schneidera był przede wszystkim wyścigiem szybkościowym, w którym kluczową rolę odgrywały najnowsze technologie lotnicze oraz indywidualne osiągnięcia pilotów. Aby osiągnąć dobry wynik, liczą się najnowocześniejsze technologie, krajowe ukierunkowanie na budowę samolotów oraz indywidualne cechy pilota. Asy lotnictwa i weterani Pucharu Schneidera radzą sobie lepiej, podobnie jak postacie odznaczające się szczególną śmiałością lub innowacyjnością."
 curtiss.124.g: "Pełna Moc!"
 curtiss.125.t: "Manewry Slalomowe"
 curtiss.125.d: "Puchar Schneidera jest znany przede wszystkim jako wyścig szybkościowy, jednak na trasie znajdowały się trzy lub cztery boje, które przy dużej prędkości można było łatwo przeoczyć, co mogło skutkować dyskwalifikacją."
 curtiss.125.f: "Większość wyścigów o Puchar Schneidera odbywała się na trasie w kształcie trójkąta, dlatego manewry skrętu zdarzały się stosunkowo rzadko. Nie oznacza to jednak, że nie miały one znaczenia – jeden błędny manewr potrafił pozbawić pilota zwycięstwa. W takich sytuacjach kluczowe znaczenie mają umiejętności pilota: doświadczeni lotnicy, a także postacie odznaczające się ostrożnością, osiągają lepsze wyniki niż ci nadmiernie porywczy. Dodatkową zaletą jest ukończenie szkolenia w szkole pilotów."
 curtiss.125.g: "Lataj z Elegancją"
 curtiss.126.t: "Mgła"
 curtiss.126.d: "Mgła częściej dawała się we znaki nad akwenami. Nawet doświadczeni piloci mogli nie poradzić sobie z tym nagłym wyzwaniem."
 curtiss.126.f: "Wyścigi wodnosamolotów mają tę istotną wadę, że mgła stanowi dodatkowe wyzwanie. Podobnie jak w przypadku wszystkich manewrów, kluczowe znaczenie mają tu cechy pilota i jego doświadczenie. Lepsze wyniki mogą osiągać piloci stosujący niekonwencjonalne metody, a także postacie odznaczające się ostrożnością."
 curtiss.126.g: "Nasz pilot odnajdzie drogę."
 curtiss.127.t: "Doskonałe Osiągi w Locie"
 curtiss.127.d: "Wyjątkowe umiejętności naszego pilota znacząco zwiększyły nasze szanse na zdobycie Pucharu Schneidera!"
 curtiss.127.f: "„Cóż, zawsze bardzo lubiłem rywalizację i jest to przydatne niezależnie od uprawianej dyscypliny sportu. W tamtych czasach latanie było w dużej mierze sportem, to prawda. Jednak tym, co naprawdę pomogło mi w lotnictwie, był szybki refleks i dobre poczucie równowagi. Myślę, że zawdzięczam je ćwiczeniom akrobatycznym, a nie boksowi”. – James Harold Doolittle"
 curtiss.127.g: "Doskonale!"
 curtiss.128.t: "Pojedynek Wody i Nieba"
 curtiss.128.d: "W walce o najszybsze okrążenie [SCOPE.sCharacter('duel_participant_1').GetFullName] i [SCOPE.sCharacter('duel_participant_2').GetFullName] niebezpiecznie się do siebie zbliżyli. Dzięki odpowiednio wykonanemu manewrowi możemy zwiększyć nasze szanse i osłabić bezpośredniego rywala."
 curtiss.128.f: "„Nie uciekaj, bo wszystkim o tym opowiem!” – Donald Curtis"
 curtiss.128.g: "Walka Powietrzna!"
 curtiss.128.h: "Leć Naprzód."
 curtiss.129.t: "A wygrał Pojedynek Powietrzny"
 curtiss.129.d: "Pilot jednego z konkurencyjnych krajów próbował wyeliminować [SCOPE.sCharacter('curtiss_schneider_pilot').GetFullName] z wyścigu, ale sam stracił cenny czas, dając nam przewagę w walce o trofeum!"
 curtiss.129.f: "„Jesteś głupi. Lubię to u mężczyzny”. – Madame Gina"
 curtiss.130.t: "Rywalizacja o Puchar Schneidera"
 curtiss.130.d: "Nasz as lotnictwa, [SCOPE.sCharacter('duel_participant_1').GetFullName], ma stare porachunki ze swoim rywalem, [SCOPE.sCharacter('duel_participant_2').GetFullName]. Wykonując śmiały manewr, próbuje wyeliminować znienawidzonego przeciwnika z wyścigu!"
 curtiss.130.f: "„Nie uciekaj, bo wszystkim o tym opowiem!” – Donald Curtis"
 curtiss.130.g: "Ku chwale [ROOT.GetCountry.GetNameNoFormatting]!"
 curtiss.131.t: "Zacięta Rywalizacja"
 curtiss.131.d: "Podczas Pucharu Schneidera musimy liczyć się z prześladowaniami i zaciekłą wrogością ze strony kraju [SCOPE.sCountry('curtiss_schneider_failed_rival').GetName], ale tym razem przeciwnik poniósł porażkę! Jeden z jego pilotów próbował wyeliminować naszego asa lotnictwa, [SCOPE.sCharacter('curtiss_schneider_pilot').GetFullName], z wyścigu, lecz sam uległ wypadkowi."
 curtiss.131.f: "„Jesteś głupi. Lubię to u mężczyzny”. – Madame Gina"
 curtiss.132.t: "Korzystne Warunki Pogodowe"
 curtiss.132.d: "Dobre warunki pogodowe zwiększają nasze szanse na zwycięstwo."
 curtiss.132.f: "Morze jest spokojne, niebo bezchmurne, a wiatr łagodny. Od tygodni nie widziano mgły. Idealne warunki do bezpiecznego wyścigu!"
 curtiss.132.g: "Pogoda nam sprzyja."
 curtiss.133.t: "Chory Pilot"
 curtiss.133.d: "Jeden z pilotów naszego zespołu startującego w Pucharze Schneidera zgłosił chorobę tuż przed wyścigiem."
 curtiss.133.f: "Jeden z pilotów naszego zespołu startującego w Pucharze Schneidera zgłosił chorobę tuż przed wyścigiem."
 curtiss.133.g: "Zły omen."
 curtiss.134.t: "Wielki Wyścig"
 curtiss.134.d: "Piloci i widzowie są zgodni: tegoroczny wyścig o Puchar Schneidera jest wyjątkowy."
 curtiss.134.f: "Zagraniczni dygnitarze, przedstawiciele wyższych sfer, piloci i turyści pogratulowali organizatorom tegorocznego wyścigu. Wydarzenie okazało się pełnym sukcesem, tłumy są większe niż zwykle, a ludzie zapewne będą wspominać te dni z zachwytem jeszcze przez wiele lat. Wielu widzów opuszcza [SCOPE.sState('curtiss_schneider_trophy_state').GetName] zadowolonych, zapominając o codziennych troskach dzięki udziałowi w tym wyjątkowym widowisku."
 curtiss.134.g: "Świetnie!"
 curtiss.135.t: "Sabotaż"
 curtiss.135.d: "Czasami w tak ważnym wyścigu jak Puchar Schneidera potrzeba czegoś więcej niż tylko wyjątkowych umiejętności czy doskonałych samolotów, potrzeba także... specjalnych środków."
 curtiss.135.f: "Historycznie nie udowodniono żadnych aktów sabotażu wymierzonych w państwa uczestniczące w Pucharze Schneidera. Częste awarie maszyn dały jednak początek pogłoskom, że nie chodzi wyłącznie o problemy mechaniczne. Mamy 50% szans na powodzenie próby poważnego zaszkodzenia rywalowi. Jeśli jednak nasz manewr się nie powiedzie, otrzymamy karę w postaci odjęcia takiej samej liczby punktów. Który kraj powinniśmy sabotować?"
 curtiss.135.g: "Takie nieczyste zagrywki są poniżej naszej godności."
 curtiss.135.h: "[SCOPE.sCountry('curtiss_schneider_sabotage_country_1').GetName]"
 curtiss.135.i: "[SCOPE.sCountry('curtiss_schneider_sabotage_country_2').GetName]"
 curtiss.135.j: "[SCOPE.sCountry('curtiss_schneider_sabotage_country_3').GetName]"
 curtiss.135.k: "[SCOPE.sCountry('curtiss_schneider_sabotage_country_4').GetName]"
 curtiss.135.l: "[SCOPE.sCountry('curtiss_schneider_sabotage_country_5').GetName]"
 curtiss.135.m: "[SCOPE.sCountry('curtiss_schneider_sabotage_country_6').GetName]"
 curtiss.135.n: "[SCOPE.sCountry('curtiss_schneider_sabotage_country_7').GetName]"
 curtiss.135.o: "[SCOPE.sCountry('curtiss_schneider_sabotage_country_8').GetName]"
 curtiss.135.p: "[SCOPE.sCountry('curtiss_schneider_sabotage_country_9').GetName]"
 curtiss.136.t: "Dziwna Awaria Silnika"
 curtiss.136.d: "Tajemnicza awaria silnika doprowadza naszych inżynierów do rozpaczy."
 curtiss.136.f: "Jeszcze kilka dni temu mechanicy sprawdzili naszą maszynę, która miała zapewnić nam zwycięstwo w wyścigu o Puchar Schneidera, z dokładnością do ostatniej śrubki. Jednak od dzisiejszego poranka samolot po prostu nie chce już odpalić. Niektórzy eksperci uważają, że problemy mechaniczne mogą być wynikiem sabotażu, choć nie da się tego udowodnić. Z drugiej strony nie ulega wątpliwości, że te uszkodzenia opóźnią nas o kilka tygodni."
 curtiss.136.g: "Poważny cios dla naszych szans na zwycięstwo."
 curtiss.137.t: "Sabotaż Udaremniony!"
 curtiss.137.d: "Próba sabotażu ze strony innego uczestnika wyścigu została udaremniona w ostatniej chwili."
 curtiss.137.f: "Nasi mechanicy przyłapali zeszłej nocy zagranicznego szpiega, który próbował sabotować silnik naszego samolotu wyścigowego. Przekazaliśmy go władzom i zgłosiliśmy to poważne naruszenie organizatorom wyścigu. Kraj uczestniczący w zawodach, który ponosi odpowiedzialność za ten czyn, zostanie ukarany odjęciem punktów."
 curtiss.137.g: "Było blisko!"
 curtiss.138.t: "Udany Sabotaż"
 curtiss.138.d: "Nasz szpieg zdołał zeszłej nocy niepostrzeżenie dostać się do hangaru zespołu i skutecznie dokonać sabotażu znajdującego się tam samolotu."
 curtiss.138.f: "Szanse przeciwnego zespołu na zwycięstwo zostały znacznie ograniczone."
 curtiss.138.g: "Uwielbiam, kiedy wszystko idzie zgodnie z planem."
 curtiss.139.t: "Wykryto Sabotaż!"
 curtiss.139.d: "Niestety, nasz szpieg został przyłapany na gorącym uczynku podczas próby sabotowania samolotu drużyny przeciwnika."
 curtiss.139.f: "Organizatorzy wyścigu ukarali nas odjęciem punktów, a pozostałe zespoły są – i słusznie – oburzone."
 curtiss.139.g: "Cholera."
 curtiss.201.t: "Linia Lotnicza Inwestuje w Lotnisko"
 curtiss.201.d: "Linia Lotnicza należąca do [SCOPE.sCharacter('howard_hughes').GetFullName] przekroczyła wszelkie oczekiwania i przyniosła solidny zysk. Rozważana jest budowa nowego lotniska w [SCOPE.sState('curtiss_new_airport_state').GetName]."
 curtiss.201.f: "Czasami, aby uczynić ryzykowny biznes, jakim jest lotnictwo, dochodowym, potrzeba megalomańskiej pewności siebie, a co za tym idzie, bardzo specyficznego typu człowieka. [SCOPE.sCharacter('howard_hughes').GetFullName] udowodnił, że należy właśnie do tego grona. Jego interesy idą tak dobrze, że mógłby nawet zbudować własne lotnisko albo znacznie powiększyć swoją flotę samolotów."
 curtiss.201.g: "Zbuduj Nowe Lotnisko."
 curtiss.201.h: "Rozbuduj Linię Lotniczą, ale zainwestuj kapitał gdzie indziej."
 curtiss.202.t: "Linia Lotnicza się Rozwija"
 curtiss.202.d: "Niedawno uruchomiona Linia Lotnicza odniosła pierwszy sukces i nabyła kilka nowych samolotów."
 curtiss.202.f: "Pomimo wielu nieprzewidywalnych czynników związanych z prowadzeniem działalności w branży lotniczej, nie brakowało historii sukcesu."
 curtiss.202.g: "Doskonale."
 curtiss.203.t: "Linia Lotnicza w Stagnacji"
 curtiss.203.d: "Rozwój nowo założonej Linii Lotniczej niestety nie spełnia oczekiwań."
 curtiss.203.f: "Pomimo ogromnej fascynacji, jaką budziło lotnictwo na początku XX wieku, oraz euforii związanej z technologią i postępem, prowadzenie Linii Lotniczych nadal wiązało się z ryzykiem gospodarczym. Większość Linii Lotniczych osiągała niewielkie zyski lub nie przynosiła ich wcale. W niektórych przypadkach musiały minąć lata, a nawet dziesięciolecia, zanim działalność stała się rentowna, ponieważ ruch pasażerski był niewielki, a koszty wysokie."
 curtiss.203.g: "Rozczarowujące."
 curtiss.203.h: "Wyślij jednego z naszych pilotów, aby zareklamował Linię Lotniczą."
 curtiss.204.t: "Pilot Ponownie w Służbie"
 curtiss.204.d: "Po zakończeniu udanej trasy promocyjnej Linii Lotniczej nasz pilot [SCOPE.sCharacter('curtiss_pilot').GetFullName] jest ponownie do dyspozycji."
 curtiss.204.f: ""
 curtiss.204.g: "Dobra robota."
 curtiss.211.t: "Nowa Trasa Lotnicza do Zagranicznego Lotniska"
 curtiss.211.d: "Linia Lotnicza naszego kraju uruchomiła nową trasę lotniczą do kraju [SCOPE.sCountry('curtiss_airline_country').GetName]."
 curtiss.211.f: "„Kiedy wyruszałem z Nowego Jorku, miałem ze sobą cztery kanapki. Podczas całej podróży zjadłem tylko półtorej i wypiłem trochę wody. Chyba nie miałem czasu zjeść więcej, bo, wiecie, zaskoczyło mnie, jak niewielka odległość dzieli nas od Europy”. – Charles Lindbergh"
 curtiss.211.g: "Miejmy nadzieję, że ta inwestycja się opłaci."
 curtiss.212.t: "Zagraniczna Linia Lotnicza Uruchamia Nową Trasę Lotniczą"
 curtiss.212.d: "Zagraniczna Linia Lotnicza uruchomiła nową trasę lotniczą. Samoloty lądują w stanie [SCOPE.sState('curtiss_foreign_airline_state').GetName]."
 curtiss.213.t: "Trasa Przelotu Zeppelina między Wieżowcami"
 curtiss.213.d: "Dziś uruchomiono ekskluzywną trasę przelotu zeppelina do kraju [SCOPE.sCountry('curtiss_airline_country').GetName]. Punktami cumowniczymi są wieżowce w poszczególnych krajach."
 curtiss.213.f: "Istniały koncepcje cumowania sterowców przy wieżowcach. Szczyt Empire State Building, otwartego w 1931 roku, pierwotnie miał służyć jako maszt cumowniczy. Maszt został tak solidnie wzmocniony, że mógł wytrzymać siłę naciągu wynoszącą 50 ton, wywieraną przez cumujący sterowiec. Niektóre wyciągarki były już zamontowane, a 86. piętro przygotowano jako poczekalnię odlotów z kasą biletową i kontrolą celną. Pomysł ten wpisywał się w ówczesną fascynację powietrznymi olbrzymami. Przy projektowaniu nie uwzględniono jednak, że sterowce są bardzo mało zwrotne, a wokół wieżowców nieustannie powstają zawirowania powietrza, które mogłyby poważnie utrudniać manewrowanie sterowcem."
 curtiss.213.g: "Zeppeliny to najbardziej ekstrawagancki sposób podróżowania."
 curtiss.214.t: "Loty Widokowe"
 curtiss.214.d: "Linie Lotnicze [ROOT.GetCountry.GetAdjectiveNoFormatting] mają nowy pomysł na biznes: wzbogacają swoją ofertę o loty widokowe dla turystów."
 curtiss.214.f: "Flieger, grüß mir die Sonne\nGrüß mir die Sterne und grüß mir den Mond\nDein Leben, das ist ein Schweben\nDurch die Ferne, die keiner bewohnt.\n\nLotnicy, pozdrówcie słońce\nPozdrówcie gwiazdy i pozdrówcie księżyc\nWasze życie to unoszenie się w przestworzach\nPrzez bezkresne przestrzenie, których nikt nie zamieszkuje."
 curtiss.214.g: "Czy ja też mogę dostać bilet?"
 curtiss.215.t: "Towary Kolonialne Drogą Lotniczą"
 curtiss.215.d: "W jednej z naszych afrykańskich kolonii otwarto niewielkie lotnisko, z którego samoloty transportują towary kolonialne bezpośrednio do stanu [SCOPE.sState('curtiss_colonial_goods_state').GetName]."
 curtiss.215.f: "Dzięki ustanowieniu bezpośredniego połączenia lotniczego między stanami [SCOPE.sState('curtiss_airport_state').GetName] i [SCOPE.sState('curtiss_colonial_goods_state').GetName] afrykańskie społeczności zyskują bliższy kontakt z krajem [ROOT.GetCountry.GetNameNoFlag]. A na kokosy, banany i diamenty też nie trzeba już tak długo czekać."
 curtiss.215.g: "Nawet najbardziej odległe zakątki świata są połączone drogą lotniczą z krajem macierzystym."
 curtiss.216.t: "Turystyka"
 curtiss.216.d: "Uruchomienie trasy lotniczej do kraju [SCOPE.sCountry('curtiss_tourist_country').GetName] okazało się niezwykle dochodowe. Przedsiębiorstwo Lotnicze musi podwoić swoje możliwości przewozowe, ponieważ liczba pasażerów gwałtownie wzrosła. Najwyraźniej kraj ten przyciąga turystów."
 curtiss.216.f: "Porozumienia dotyczące przestrzeni powietrznej z krajami posiadającymi znane zabytki mogą okazać się bardzo dochodowe."
 curtiss.216.g: "Ah, [SCOPE.sCountry('curtiss_tourist_country').GetName]!"
 curtiss.217.t: "Kampania Wyborcza z Powietrza"
 curtiss.217.d: "Linia Lotnicza oferuje przewóz kandydatów do władz."
 curtiss.217.f: "Wraz z pojawieniem się samolotu jako potencjalnego środka transportu zmieniła się również kampania wyborcza. Kandydaci dysponujący własnymi samolotami byli postrzegani nie tylko jako bardziej mobilni, ale także jako symbol nowoczesności. Taka forma reklamy powinna przynajmniej zapewnić partii rządzącej niewielką przewagę."
 curtiss.217.g: "Chętnie skorzystamy z tej oferty."
 curtiss.217.h: "A co, jeśli ktoś rozbije samolot?"
 curtiss.218.t: "Pilot do Reklamy?"
 curtiss.218.d: "Linia Lotnicza przechodzi obecnie niewielki kryzys. Jej kierownictwo zwróciło się do nas z nietypowym pomysłem: chcieliby zobowiązać [SCOPE.sCharacter('curtiss_pilot').GetFullName] do latania dla ich Linii Lotniczej i wykorzystać go do celów reklamowych."
 curtiss.218.f: "We wczesnych latach lotnictwa sławni piloci pomagali w promocji, pełniąc rolę ambasadorów. Charles Lindbergh odegrał w ten sposób znaczącą rolę w popularyzacji poczty lotniczej. Na przykład na prośbę Basila L. Rowe’a, właściciela West Indian Aerial Express, przewiózł około 3000 specjalnych przesyłek okolicznościowych między Santo Domingo, Port-au-Prince i Hawaną. Dwa tygodnie po swojej podróży po Ameryce Łacińskiej Lindbergh wykonał serię specjalnych lotów. Z całego świata nadesłano dziesiątki tysięcy kopert okolicznościowych zaadresowanych do samych nadawców. Następnie ostemplowano je i odesłano nadawcom w ramach promocji usług poczty lotniczej."
 curtiss.218.g: "Jasne!"
 curtiss.218.h: "Nie możemy się bez niego obejść, ale pomożemy w inny sposób."
 curtiss.218.i: "Niestety, nic nie możemy zrobić."
 curtiss.219.t: "Nowe Lotnisko Połączone z Siecią Lotniczą"
 curtiss.219.d: "Linia Lotnicza podjęła działania na rzecz rozbudowy swojej obecnej siatki połączeń."
 curtiss.219.f: "„Latanie nie zawsze jest usłane różami, ale przyjemność, jaką daje, jest warta swojej ceny”. – Amelia Earhart"
 curtiss.219.g: "Doskonale."
 curtiss.219.h: "Nie stać nas na to."
 curtiss.220.t: "Lotnisko się Rozrasta"
 curtiss.220.d: "Lotnisko w stanie [SCOPE.sState('curtiss_airport_state').GetName] stało się centrum międzynarodowego ruchu lotniczego."
 curtiss.220.f: "Jedno z naszych krajowych lotnisk polowych, dzięki modernizacji ruchu lotniczego i rozwojowi lokalnej gospodarki, przekształciło się w ważny ośrodek przeładunkowy. Lokalne stowarzyszenia przedsiębiorców oraz władze miejskie postanowiły więc rozbudować je do rangi pełnoprawnego lotniska."
 curtiss.220.g: "[SCOPE.sState('curtiss_airport_state').GetName] stanie się centrum świata!"
 curtiss.221.t: "Nowy Samolot"
 curtiss.221.d: "Największa Linia Lotnicza w kraju ogłosiła plany powiększenia swojej floty samolotów."
 curtiss.221.f: "„Gdy raz zakosztujesz latania, na zawsze będziesz stąpać po ziemi ze wzrokiem zwróconym ku niebu, bo tam już byłeś i zawsze będziesz tęsknić za powrotem”. – Leonardo da Vinci"
 curtiss.222.t: "Katastrofa Lotnicza"
 curtiss.222.d: "Poważna katastrofa lotnicza podważyła zaufanie do lotnictwa jako takiego, a zwłaszcza do Linii Lotniczych."
 curtiss.222.f: "Katastrofa lotnicza, w której zginęło kilka osób, pogrążyła główną Linię Lotniczą kraju w kryzysie. Odszkodowania dla rodzin ofiar, utrata samolotu i spadek liczby pasażerów mogą doprowadzić do ograniczenia inwestycji. Zwolennicy interwencjonizmu opowiadają się za zastrzykiem finansowym, aby zapobiec pogłębieniu się kryzysu."
 curtiss.222.g: "Nie bez powodu nazywa się to Wolnym Rynkiem."
 curtiss.222.h: "Państwo Zainterweniuje."
 curtiss.223.t: "[ROOT.GetCountry.GetAdjectiveNoFormatting] Linie Lotnicze w Trudnej Sytuacji"
 curtiss.223.d: "Poważny kryzys wstrząsnął główną Linią Lotniczą kraju. [SCOPE.sCharacter('howard_hughes').GetFullName] ogłosił znaczną redukcję rozmiarów przedsiębiorstwa, aby uniknąć bankructwa."
 curtiss.223.f: "Kryzys w [ROOT.GetCountry.GetAdjectiveNoFormatting] Liniach Lotniczych dominuje na pierwszych stronach gazet. Kilkaset miejsc pracy jest poważnie zagrożonych, a kurs akcji gwałtownie spada. Aby uratować swoje przedsiębiorstwo, [SCOPE.sCharacter('howard_hughes').GetFullName] ogłosił surowe środki, które wyprowadzą związki zawodowe na ulice. Popularność magnata gwałtownie spadła. Interwencja rządu mogłaby zażegnać kryzys, ale wymagałaby długoterminowego zaangażowania finansowego."
 curtiss.223.h: "To Przedsiębiorstwo ma znaczenie dla całego kraju!"
 curtiss.224.t: "Długie Ramię [ROOT.GetCountry.GetAdjectiveNoFormatting] Linii Lotniczych"
 curtiss.224.d: "Machinacje [SCOPE.sCharacter('howard_hughes').GetFullName] stają się coraz bardziej oczywiste: magnat zdołał w międzyczasie zbudować sprawnie działający system politycznych układów i protekcji."
 curtiss.224.f: "Niewielu ludzi w kraju dysponuje tak wielką władzą jak [SCOPE.sCharacter('howard_hughes').GetFullName]. Magnat zdołał w międzyczasie stworzyć w strukturach rządowych system, który niektórych napawa niepokojem. Udowodniono, że posługiwał się łapówkami, aby uzyskać korzyści w jednej z prowincji i zapewnić tamtejszemu lotnisku ulgi podatkowe. W rządzie przybywa głosów domagających się wyjaśnień i ponownego rozpatrzenia sprawy. Inni uważają, że tak bezpośrednie powiązania z przemysłem przynoszą wyjątkowo wiele korzyści."
 curtiss.224.g: "W czym problem? Znacie się i pomagacie sobie nawzajem."
 curtiss.224.h: "Korupcja to zło, które należy wyeliminować wszędzie."
 curtiss.225.t: "Nierentowny Transport Lotniczy"
 curtiss.225.d: "Ze względu na rosnące koszty i spadającą liczbę pasażerów linie lotnicze [ROOT.GetCountry.GetAdjectiveNoFormatting] muszą ograniczyć swoją działalność na jednym z lotnisk."
 curtiss.225.f: "Czy ostatnie przedsięwzięcie okazało się nietrafioną inwestycją? Czy [SCOPE.sCharacter('howard_hughes').GetFullName] stracił swój instynkt biznesowy? Tak czy inaczej, z powodu nierentownej działalności lotniska przedsiębiorstwo musi ograniczyć tam swoje inwestycje, aby uniknąć poważnego kryzysu. Miejscowi pracownicy, którym grozi eksmisja, zwracają się do rządu z prośbą o interwencję i zapobieżenie katastrofie."
 curtiss.225.g: "To lotnisko ma znaczenie dla całego kraju!"
 curtiss.226.t: "Konkurencyjna Linia Lotnicza z [SCOPE.sCountry('curtiss_rival_airline_country').GetNameNoFlag]"
 curtiss.226.d: "Naszym liniom lotniczym coraz trudniej utrzymać konkurencyjność po tym, jak konkurencyjna linia lotnicza zrujnowała naszą działalność za granicą."
 curtiss.226.f: "Dyrektorzy zarządzający naszych krajowych linii lotniczych zakładali, że mają duże szanse na sukces w [SCOPE.sCountry('curtiss_third_country').GetName]. W rzeczywistości dobra passa trwała tylko do czasu, gdy [SCOPE.sCountry('curtiss_rival_airline_country').GetName] rozpoczęło ekspansję za pośrednictwem swoich lokalnych linii lotniczych. Od tego momentu przedsiębiorstwo prowadzi wojnę cenową. Ze względu na niewielką liczbę pasażerów rozważa się już ograniczenie przepustowości jednego z krajowych lotnisk i wprowadzenie oszczędności. Kierownictwo naciska na nasz rząd, aby podjął interwencję w [SCOPE.sCountry('curtiss_third_country').GetName] i dyskretnie nałożył sankcje na konkurencję."
 curtiss.226.g: "Nie będziemy ingerować w tę delikatną sprawę."
 curtiss.226.h: "Podejmij próbę interwencji dyplomatycznej w [SCOPE.sCountry('curtiss_third_country').GetNameNoFlag]."
 curtiss.227.t: "[SCOPE.sCharacter('howard_hughes').GetFullName] w tarapatach"
 curtiss.227.d: "Słynny magnat lotniczy znalazł się pod presją po tym, jak linie lotnicze [ROOT.GetCountry.GetAdjectiveNoFormatting] nie osiągnęły obiecywanych zysków."
 curtiss.227.f: "W rzeczywistości czołowemu przemysłowcowi kraju zagraża jedynie niewielki kryzys. Jednak z biegiem lat w przedsiębiorstwie narastały ambicje tych, którzy domagają się odsunięcia odnoszącego sukcesy biznesmena. Nietrafiona inwestycja na jednym z krajowych lotnisk ma posłużyć za pretekst do pozbycia się wpływowego magnata i zastąpienia go nowym człowiekiem. Moglibyśmy wykorzystać tę sytuację na naszą korzyść."
 curtiss.227.g: "Powinien ustąpić."
 curtiss.227.h: "[SCOPE.sCharacter('howard_hughes').GetFullName] poradzi sobie z tym niewielkim kryzysem."
 curtiss.228.t: "Prężnie Działająca Fabryka Samolotów w [SCOPE.sState('curtiss_factory_state').GetName]"
 curtiss.228.d: "Jedna z naszych fabryk samolotów znacznie zwiększyła swoje moce produkcyjne i wydajność dzięki nawiązaniu współpracy z linią lotniczą."
 curtiss.228.f: "W [SCOPE.sState('curtiss_factory_state').GetName] wykorzystywane są dotąd nieznane możliwości współpracy. Lokalny przemysł czerpie ogromne korzyści z działalności miejscowego lotniska i linii lotniczej. Dzięki niedawno podpisanej umowie [SCOPE.sState('curtiss_factory_state').GetName] ma stać się centrum kultury lotniczej kraju [ROOT.GetCountry.GetNameNoFlag]. Możliwości i potrzeby stron umowy będą ściśle ze sobą koordynowane."
 curtiss.228.g: "Wielki Dzień dla Lotnictwa!"
 curtiss.229.t: "Nowa Fabryka Samolotów w [SCOPE.sState('curtiss_factory_state').GetName]"
 curtiss.229.d: "Dotychczas magnat [SCOPE.sCharacter('howard_hughes').GetFullName] koncentrował się głównie na liniach lotniczych, ale teraz zamierza produkować samoloty bezpośrednio na potrzeby własnego przedsiębiorstwa."
 curtiss.229.f: "Branża lotnicza w [ROOT.GetCountry.GetNameNoFlag] przeżywa rozkwit. Aby sprostać rosnącemu zapotrzebowaniu na coraz więcej nowych samolotów i uniezależnić się od podwykonawców, czołowy magnat lotniczy kraju postanowił rozpocząć działalność w nowej dziedzinie. Przedsiębiorstwo Lotnicze [SCOPE.sCharacter('howard_hughes').GetLastName] ma stać się nowym konkurentem na rynku światowym. Niektórzy zastanawiają się jednak, czy skupienie tak wielkiej władzy w rękach jednej osoby nie jest niebezpieczne."
 curtiss.229.h: "To oczywista pułapka."
 curtiss.230.t: "[SCOPE.sCharacter('howard_hughes').GetLastName], Mecenas"
 curtiss.230.d: "Znany miliarder [SCOPE.sCharacter('howard_hughes').GetFullName] uchodzi za miłośnika muzyki i kina. Zamierza wybudować ogromny nowy teatr w [SCOPE.sState('curtiss_opera_state').GetName]."
 curtiss.230.f: "[SCOPE.sCharacter('howard_hughes').GetFullName] od dawna ubolewa nad rzekomym brakiem życia kulturalnego w mieście stanowiącym główny węzeł komunikacyjny jego linii lotniczych. Miastu przydałoby się bardziej wystawne życie nocne, które przyciągnęłoby również więcej turystów. Jednocześnie magnat słynie z zamiłowania do muzyki i fascynacji rozwijającą się kinematografią. Krążą nawet pogłoski, że zamierza nakręcić własny film. Rozbudowa infrastruktury kulturalnej w [SCOPE.sState('curtiss_opera_state').GetName] powinna zatem leżeć w jego własnym interesie, a także przyczynić się do poprawy jego reputacji."
 curtiss.230.g: "Wielki Dzień dla Kultury!"
 curtiss.251.t: "Zaginiony Horyzont"
 curtiss.251.d: ""
 curtiss.251.f: "Ludzkość odarła świat z jego tajemnic. Postęp i technologia sprawiły, że zniknęły. Jedynie w najdalszych i najbardziej niedostępnych zakątkach świata pozostały miejsca, w których mogły się jeszcze ukryć. Miejsca, które przyciągały [SCOPE.sCharacter('curtiss_conway_scope').GetFullName]. Pozostawił niezatarte wrażenie na ludziach, którzy go znali. Należał do tych poszukiwaczy przygód, którzy pojawiają się tu i ówdzie, lecz na długo zapadają w pamięć, ponieważ są jednymi z ostatnich oryginałów pośród szarej masy naśladowców. Jednak [SCOPE.sCharacter('curtiss_conway_scope').GetLastName] nie był jedynie człowiekiem, który przemierzał świat. Pełnił funkcję konsula honorowego naszego kraju w Indiach, a kilka miesięcy temu zaginął bez śladu. Gdzieś w Himalajach, na pograniczu Nepalu i Tybetu. To bolesna strata, z którą można by się pogodzić, gdyby nie jeden istotny szczegół. [SCOPE.sCharacter('curtiss_conway_scope').GetLastName] czegoś poszukiwał. Czegoś wielkiego. Czegoś cenniejszego niż niejeden skarb. Szaleństwo — jak twierdzą niektórzy. Jednak w tym szaleństwie może kryć się ziarno prawdy, ponieważ dziś rano były asystent [SCOPE.sCharacter('curtiss_conway_scope').GetLastName] przekazał Departamentowi Stanu pewien rękopis. Osobiste zapiski wskazujące na istnienie tajemniczej, nieznanej doliny w górach. Doliny, której istnienia świat dotąd nie odkrył. Podejrzewamy, że konsul honorowy zmierzał właśnie do tej doliny i że mogło mu się coś przydarzyć, skoro od tygodni nie daje znaku życia."
 curtiss.251.g: "Powinniśmy zorganizować misję ratunkową i go odnaleźć."
 curtiss.251.h: "Nie mamy czasu na takie eskapistyczne fanaberie."
 curtiss.252.t: "Ratowanie [SCOPE.sCharacter('curtiss_conway_scope').GetLastName]"
 curtiss.252.d: ""
 curtiss.252.f: "Po dokładnym zbadaniu rękopisu potwierdziły się przypuszczenia, że [SCOPE.sCharacter('curtiss_conway_scope').GetLastName] mógł zaginąć w Himalajach. Pomimo kierowania zapytań do innych ambasadorów i przekupywania informatorów nie udało się odnaleźć żadnego śladu konsula honorowego. Sam rękopis, najwyraźniej sporządzony odręcznie przez [SCOPE.sCharacter('curtiss_conway_scope').GetLastName], wspomina o trzech artefaktach wskazujących drogę do ukrytego miejsca. Nie wiemy, dlaczego [SCOPE.sCharacter('curtiss_conway_scope').GetLastName] chciał tam dotrzeć ani czego tam szukał. Jednak nawet jeśli wszystko to jest jedynie gorączkowym majaczeniem szaleńca, [SCOPE.sCharacter('curtiss_conway_scope').GetLastName] bezwzględnie musi zostać sprowadzony do [ROOT.GetCountry.GetCapital.GetCityHubName]. Tylko doświadczony pilot może podjąć się tej misji. Nadzieja na odnalezienie [SCOPE.sCharacter('curtiss_conway_scope').GetLastName] żywego wydaje się znikoma. Jeśli jednak nie uda się go uratować, musimy przynajmniej ustalić, co spotkało [SCOPE.sCharacter('curtiss_conway_scope').GetLastName]. Być może jednak odpowiedź kryje się w samej tajemniczej dolinie. Jej nazwa brzmi: Shangri-La."
 curtiss.252.g: "[SCOPE.sCharacter('curtiss_expedition_leader_1').GetFullName] powinien wyruszyć na jego poszukiwania."
 curtiss.252.h: "[SCOPE.sCharacter('curtiss_expedition_leader_2').GetFullName] poradzi sobie z tym zadaniem."
 curtiss.252.i: "[SCOPE.sCharacter('curtiss_expedition_leader_3').GetFullName] to nasz człowiek."
 curtiss.253.t: "Poszukiwania Się Rozpoczynają"
 curtiss.253.d: ""
 curtiss.253.f: "[SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] leci już od kilku godzin. Potężne, ośnieżone szczyty niekończących się pasm górskich wyłaniają się z morza chmur. Pada na nie delikatny blask świtu. Dysponujemy jedynie przybliżonymi wskazówkami dotyczącymi miejsca, w którym mogą znajdować się trzy artefakty. Jednak rękopis pozostawiony przez [SCOPE.sCharacter('curtiss_conway_scope').GetLastName] wskazuje kilka możliwych miejsc ich odnalezienia. Silnik samolotu dudni nad rozległymi przestrzeniami Tybetu, podczas gdy [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] wyznacza ostateczny kurs, mając nadzieję na odnalezienie jakiegokolwiek śladu [SCOPE.sCharacter('curtiss_conway_scope').GetLastName] lub doliny, której poszukiwał."
 curtiss.253.g: "Ladakh."
 curtiss.253.h: "Lhasa."
 curtiss.253.i: "Ngari."
 curtiss.253.j: "Zakończ te bezcelowe poszukiwania."
 curtiss.254.t: "Poszukiwania Trwają"
 curtiss.254.d: ""
 curtiss.255.t: "Tajemnica Artefaktów"
 curtiss.255.d: ""
 curtiss.255.f: "Po odnalezieniu wszystkich trzech artefaktów Shangri-La przez [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] konieczne jest ich dokładniejsze zbadanie. Pilot wraca więc na krótko do [ROOT.GetCountry.GetNameNoFormatting], aby wykwalifikowany archeolog mógł na miejscu zbadać i przeanalizować artefakty."
 curtiss.255.g: "Potrzebujemy do tego odpowiedniego człowieka."
 curtiss.260.t: "Milczący Starzec"
 curtiss.260.d: ""
 curtiss.260.f: "Cisza. Starzec spuszcza wzrok. Składa dłonie i nie patrzy już na [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName].\n„Myślę, że będzie lepiej, jeśli teraz odejdziesz”."
 curtiss.260.g: "Czy poczuł się urażony?"
 curtiss.261.t: "Ladakh"
 curtiss.261.d: ""
 curtiss.261.f: "Minęło wiele godzin lotu. Przez cały ten czas towarzyszył mu las górskich szczytów. Śmigła dwusilnikowego samolotu wciąż się obracają, gdy [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] przygląda się niewielkiemu miasteczku w Himalajach, położonemu między Kaszmirem a Tybetem. Niedługo później, gdy przechadza się uliczkami, w uszach rozbrzmiewa mu dźwięk obracających się młynków modlitewnych. Przy wejściu do osady czeka grupa najemników. Trudno powiedzieć, dla kogo lub przeciw komu walczą. Ich broń i zbroje wyglądają, jakby pochodziły z innej epoki, ale nie czyni ich to mniej niebezpiecznymi. W centrum osady znajduje się niewielki targ, na którym sprzedaje się wełnę i tkaniny z pobliskiego Kaszmiru. Jaskrawo pomalowany dom z powiewającymi flagami wskazuje, że mieszka w nim starszy wioski."
 curtiss.261.g: "Odwiedź najemników."
 curtiss.261.h: "Odwiedź targ."
 curtiss.261.i: "Odwiedź starszego wioski."
 curtiss.261.j: "Wróć samolotem do cywilizacji."
 curtiss.262.t: "Najemnicy?"
 curtiss.262.d: ""
 curtiss.262.f: "Uzbrojeni mężczyźni pilnują domu. Ich ponure spojrzenia jasno dają do zrozumienia, że nie ufają nie tylko obcym, ale także każdemu, kto zbytnio zbliży się do progu. [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] spełnia oba te warunki. Wystarczy, że strażnicy obnażają zęby w groźnym grymasie, by zrozumiał, że lepiej będzie się oddalić."
 curtiss.262.g: "Spróbuj z nimi porozmawiać."
 curtiss.262.h: "Spróbuj ich przekupić."
 curtiss.262.i: "Pokaż im korę."
 curtiss.262.k: "Pokaż im broń."
 curtiss.262.j: "Wróć do wioski."
 curtiss.263.t: "Najemnicy nie są pod wrażeniem"
 curtiss.263.d: ""
 curtiss.263.f: "Żadnych emocji. Najemnicy — czy kimkolwiek są — milczą. Nawet negatywna reakcja byłaby lepsza od lodowatego chłodu, z jakim został potraktowany, zimniejszego niż ośnieżone szczyty Himalajów. Wkrótce [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] czuje, jak zimny dreszcz przebiega mu od karku aż po czubki palców u stóp. Najwyraźniej lepiej ruszyć dalej."
 curtiss.263.g: "Dziwne typy..."
 curtiss.264.t: "Strażnicy Shangri-La"
 curtiss.264.d: ""
 curtiss.264.f: "Tradycyjny miecz lśni w lodowatych promieniach słońca. Wzrok [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] wędruje od jednego najemnika do drugiego. Początkowo sądzi, że znów nie doczeka się żadnej reakcji, opuszcza miecz — i nagle słyszy głos.\n„Niezwykłe”.\n[SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] mruga ze zdumienia. Z jednej strony zaskakuje go sam fakt, że najemnicy w ogóle się do niego odezwali. Jeszcze większe wrażenie robi na nim jednak to, że nieznajomy nie mówi do niego po tybetańsku, lecz w jego ojczystym języku. Bez najmniejszego akcentu. Tak wyraźnie, jakby od dzieciństwa nie posługiwał się żadnym innym językiem.\n„Jesteś [ROOT.GetCountry.GetAdjectiveNoFormatting]?” — pyta [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName], lecz nie otrzymuje odpowiedzi.\n„Starzec cię tu przysłał. Przeszedłeś próbę. A teraz chodź”.\nW tej samej chwili [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] zostaje owładnięty fascynującą i zarazem niepokojącą myślą, która dopada go niczym dzikie zwierzę. Jeśli ci ludzie rzeczywiście są strażnikami Shangri-La, niewykluczone, że sami odwiedzili tę dolinę. Być może posiedli niezmierzoną mądrość i potrafią przemawiać w najróżniejszych językach. Być może zostali obdarzeni szczególnym darem, dzięki któremu mogą zajrzeć w serce każdego nieznajomego i odczytać jego myśli. Ale możliwe również, że nie jest pierwszym człowiekiem, który przybył z daleka w poszukiwaniu legendarnej doliny. [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] ma tysiące pytań i pragnie poznać dziesiątki tysięcy odpowiedzi, lecz nie udaje mu się uzyskać ani jednej. Jeden z mężczyzn w milczeniu prowadzi go do domu, składającego się zaledwie z jednego pomieszczenia, w którym znajduje się pojedynczy artefakt pochodzenia tybetańskiego. Mężczyzna wskazuje na niego tonem niezbyt nieprzyjaznym, lecz stanowczym.\n„Nie ukrywamy Shangri-La przed ludzkością. Chronimy ludzkość przed nią samą. Ci, którzy nie okażą się godni, zginą po drodze” — oznajmia strażnik, po czym wyprowadza [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] na zewnątrz i ponownie pogrąża się w wiecznym milczeniu, zlewającym się z ciszą spowijającą całą jego tajemniczą straż."
 curtiss.264.g: "Wygląda na to, że starzec wystawił nas na próbę..."
 curtiss.265.t: "Broń"
 curtiss.265.d: ""
 curtiss.265.f: "[SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] wyciąga broń i kieruje ją w stronę strażników. Czeka, by przekonać się, czy dokonał właściwego wyboru, aż w końcu jeden z mężczyzn występuje z szeregu. Podchodzi do niego, spogląda na [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName], a następnie na broń.\nRozlega się przeraźliwy, metaliczny zgrzyt.\nNa ścieżce połyskują fragmenty zmiażdżonego żelaza, które po chwili tracą swój blask. Nieznajomy chwycił broń gołymi rękami i ją złamał. Trudno o wyraźniejszy znak, że [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] utracił prawo wstępu do domu."
 curtiss.265.g: "To było... brutalne."
 curtiss.266.t: "Targ Wełny"
 curtiss.266.d: ""
 curtiss.266.f: "Zapach masła z mleka jaka przytłacza inne aromaty unoszące się nad targiem. Między niewielkimi straganami kręci się zaledwie garstka ludzi. Uwagę przyciąga bogaty wybór tkanin, a zwłaszcza wełny. Towary z pobliskiego Kaszmiru trafiają przez to miasteczko do Tybetu, gdzie cieszą się dużym popytem. Gdy [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] mija kupców, jeden ze sprzedawców podchodzi do niego i proponuje mu całą belę wełny w korzystnej cenie. Trudno oprzeć się takiej ofercie."
 curtiss.266.g: "Wełna wygląda na dobrej jakości."
 curtiss.267.t: "Starszy Wioski"
 curtiss.267.d: ""
 curtiss.267.f: "Otuleni zapachem herbaty z masłem spędzają długie godziny w sali, którą w innych okolicznościach można by uznać za ubogą, lecz tutaj, w Himalajach, olśniewa niemal książęcym przepychem. Na ścianach wiszą dywany, maski i proporce, górujące nad niskim stołem, przy którym starszy wioski i [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] kończą kolejną miseczkę herbaty. Przywódca osady okazuje się niezwykle gościnny. Chociaż [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] niewiele mówi i ogranicza się do najważniejszych spraw, starzec zdaje się okazywać mu szczególne zainteresowanie. Początkowo [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] sądzi, że wynika to wyłącznie z jego pochodzenia, ponieważ ludzie tacy jak on są rzadkością w tej odległej okolicy. Jednak starszy wioski sprawia wrażenie, jakby domyślał się, dlaczego przybysz się tu znalazł. Pada nazwisko [SCOPE.sCharacter('curtiss_conway_scope').GetLastName], a [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] daje do zrozumienia, czego naprawdę poszukuje. Przyjazna atmosfera, w której dobiega końca wizyta, ośmiela [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] do dalszego poruszenia pewnej kwestii..."
 curtiss.267.g: "Kim są ci najemnicy?"
 curtiss.267.h: "Co wiesz o Shangri-La?"
 curtiss.268.t: "Tajemnica Najemników"
 curtiss.268.d: ""
 curtiss.268.f: "Starszy wioski odchyla się na chwilę do tyłu. Zdaje się starannie rozważać, co powiedzieć dalej. [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] zna takie chwile. Zdarzają się ludziom, którzy dokładnie ważą każde słowo i świadomie decydują, co powiedzieć, a co przemilczeć.\n„Nazywają ich najemnikami, ale nimi nie są. To Strażnicy” —\noznajmia starzec. „Strzegą Doliny Błękitnego Księżyca”.\n„Doliny Błękitnego Księżyca? Przecież pilnują domu, a nie doliny”.\n„Droga do doliny prowadzi przez ten dom. Czasem, aby dotrzeć prosto do celu, trzeba wybrać okrężną drogę” — wyjaśnia starszy wioski. „Przepuszczają tylko tych, którzy udowodnią, że są godni. Aby tego dokonać, trzeba się wykazać. Należy posiadać broń taką, jaką nosili dawni wojownicy. Broń godną honorowego wojownika, jakiej używa się również w Dolinie Błękitnego Księżyca”.\n„Czy ktoś już zdołał przekonać Strażników, by przepuścili go przez dom?”\nStarszy wioski uśmiecha się.\n„Udało się to człowiekowi, którego nazywasz [SCOPE.sCharacter('curtiss_conway_scope').GetLastName]”."
 curtiss.268.g: "Ten dom jest kluczem do Shangri-La."
 curtiss.269.t: "O Shangri-La"
 curtiss.269.d: ""
 curtiss.269.f: "Serdeczna atmosfera nagle znika. Starszy wioski odstawia miseczkę herbaty z masłem. Jego wzrok spoczywa na [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName]. Głos starca staje się surowszy. Przygląda się uważnie przybyszowi.\n„Czego szukasz w Shangri-La?”"
 curtiss.269.g: "Szukam spokoju."
 curtiss.269.h: "Szukam prawdy."
 curtiss.269.i: "Szukam [SCOPE.sCharacter('curtiss_conway_scope').GetLastName]."
 curtiss.269.j: "Szukam oświecenia."
 curtiss.270.t: "Rada"
 curtiss.270.d: ""
 curtiss.270.f: "Starszy wioski uśmiecha się.\n„Prawda jest najszlachetniejszą siłą napędową. Ratowanie życia to szlachetny czyn, ale jaki ma sens, jeśli nie wiesz, dlaczego to robisz? Podobnie jest z Shangri-La. Przez stulecia niezliczeni ludzie poszukiwali Doliny Błękitnego Księżyca. Wielu z nich kierowało niespokojne pragnienie odnalezienia spokoju. Tęsknota za spełnieniem. A nawet chęć zapewnienia długiego życia ukochanej osobie cierpiącej na nieuleczalną chorobę. Niezależnie od motywów, czy nie powinni najpierw zadać sobie pytania, czym właściwie jest Shangri-La?\n„Słyszałem, że to miejsce doskonałe”.\n„A jeśli to tylko kolejna górska dolina, dotknięta tymi samymi nieszczęściami, plagami i grzechami, w której życie jest równie nędzne jak wszędzie indziej?”\n„Nie obchodzi mnie to” — odpowiada [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName]. „Chcę mieć pewność. I muszę odnaleźć [SCOPE.sCharacter('curtiss_conway_scope').GetLastName]”.\nStarszy wioski kiwa głową.\n„Istnieje konkretny powód, dla którego [SCOPE.sCharacter('curtiss_conway_scope').GetLastName] zdołał wejść do domu, podczas gdy innym się to nie udało. Wiedział, że tradycyjna broń Doliny Błękitnego Księżyca nie pochodzi z Tybetu, lecz z Nepalu. To miecz zwany korą”.\n[SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] nie kryje zdumienia. „Ale skąd mógł o tym wiedzieć?”\n„Ponieważ [SCOPE.sCharacter('curtiss_conway_scope').GetLastName] nie odwiedził Shangri-La po raz pierwszy...”"
 curtiss.270.g: "Kora..."
 curtiss.271.t: "Lhasa"
 curtiss.271.d: ""
 curtiss.271.f: "Lhasa. Mistyczne miejsce. Nad miastem góruje Pałac Potala, siedziba Dalajlamy. Bajkowy widok sprawia, że [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] zapomina, w jak odległym zakątku świata się znajduje. Niektórzy mogliby uznać to miejsce za ostoję cywilizacji pośród dzikich pustkowi, lecz określenie Lhasy mianem cywilizacji byłoby błędem. W pewnym momencie czas jakby się tutaj zatrzymał. Dla zwolennika postępu to zacofane miejsce pogrążone w barbarzyństwie, dla romantyka zaś schronienie przed światem przesiąkniętym technologią i megalomanią. [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] przemierza ulice miasta, gdzie pośród wąskich zaułków i tawern znajduje się również warsztat tradycyjnego płatnerza. Nie wie, czy którekolwiek z tych miejsc okaże się pomocne w jego poszukiwaniach, ale być może znajdzie w nich odpowiedzi na pytania, których dotąd nawet nie potrafił zadać."
 curtiss.271.g: "Odwiedź Pałac Potala."
 curtiss.271.h: "Odwiedź kowala."
 curtiss.271.i: "Napij się czegoś w tawernie."
 curtiss.271.k: "Przejdź się ulicami miasta."
 curtiss.271.j: "Wróć samolotem do cywilizacji."
 curtiss.272.t: "Pałac Potala"
 curtiss.272.d: ""
 curtiss.272.f: "[SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] nie zachodzi daleko. Strażnicy zatrzymują go przy wejściu do majestatycznego pałacu i odmawiają mu wstępu. Gdy [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] próbuje wyjaśnić powód swojej wizyty, daje mu się do zrozumienia, że żadna z jego spraw nie jest na tyle ważna, by niepokoić Dalajlamę. [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] dostrzega wyraźną nieufność, jaką go darzą. Najwyraźniej wzięto go za szpiega."
 curtiss.272.g: "Pokaż Talizman."
 curtiss.272.h: "Wróć do Lhasy."
 curtiss.273.t: "Lama"
 curtiss.273.d: ""
 curtiss.273.f: "Talizman lśni w stronę strażników. Ci szeroko otwierają oczy. „Amulet Wielkiego Piątego!” — wykrzykuje jeden z nich. Teraz nie próbują już zatrzymywać [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName]. Wręcz przeciwnie: pośpiesznie wprowadzają go do pałacu. Prowadzą go obok barwnie malowanych ścian, wystawnych tkanin i demonicznych posągów, szybciej, niż mógł się spodziewać — prosto przed oblicze Dalajlamy. [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] nie spodziewał się takiego obrotu spraw. Nie może też uwierzyć własnym uszom, gdy strażnicy prowadzą go niczym więźnia, oskarżając o kradzież ważnego artefaktu z pałacu. Kopniak zmusza go do uklęknięcia. Wtedy w sali zapada cisza.\n„Nie zrobił nic złego”.\nDalajlama przemówił. [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] może jedynie powoli podnieść wzrok, wciąż pozostając w pokornej pozycji. Duchowy przywódca Tybetu emanuje spokojem i przemawia z zamkniętymi oczami. Ożywia go dopiero blask talizmanu. Jeden ze strażników wyrywa pamiątkę z rąk [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] i przekazuje ją lamie.\n„Ten talizman zaginął w Pałacu Potala przed wieloma laty. Od dawna czekam na kogoś, kto mi go zwróci. Tak właśnie miało być”.\n[SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] podnosi głowę. Mistrz daje mu znak, by wstał. Mężczyzna kiwa głową, lecz nadal niczego nie rozumie.\n„Mówi Wasza Świątobliwość o przeznaczeniu?”\n„Przeznaczenie to tak abstrakcyjne pojęcie. Wolę coś żywego, z krwi i kości” — odpowiada Dalajlama.\n„Nie rozumiem” — mówi [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName].\n„Twoje przeznaczenie nazywa się [SCOPE.sCharacter('curtiss_conway_scope').GetLastName]. A ja mam tutaj coś, co możesz mu przekazać, jeśli ktoś zwróci mi talizman...”"
 curtiss.273.g: "To jeden ze słynnych artefaktów Shangri-La!"
 curtiss.274.t: "Bez Żelaza"
 curtiss.274.d: ""
 curtiss.274.f: "„Zamknięte! Nie ma żelaza — nie ma pracy. Wróć za kilka miesięcy!”\nLedwie wszedł do warsztatu, gdy po pomieszczeniu rozległ się szorstki głos. Uprzejmość wobec klientów najwyraźniej nie była priorytetem w tej kuźni."
 curtiss.274.g: "„Tak się składa, że mam przy sobie żelazo”."
 curtiss.275.t: "Kowal"
 curtiss.275.d: ""
 curtiss.275.f: "Dotychczas nieprzyjazny kowal jest zaskoczony, gdy widzi całą sztabę żelaza otrzymaną za darmo. Przygląda się towarowi, następnie [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName], po czym zaciera ręce. Wyjaśnia, że w stolicy panuje obecnie niedobór wyrobów metalowych, i pokazuje podróżnikowi kilka swoich wyśmienitych, tradycyjnych tybetańskich rodzajów broni. Następnie padają zwyczajowe zapewnienia, że nie ma na świecie lepszego kowala, który mógłby zaoferować taką jakość. Pomija przy tym fakt, że jest również jedynym. [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] korzysta z okazji, by przejść do konkretów. Ale jaką broń powinien wykuć kowal?"
 curtiss.275.g: "Dpa'dam."
 curtiss.275.h: "Ke-tri."
 curtiss.275.i: "Tsep-tsa."
 curtiss.275.j: "Kora"
 curtiss.276.t: "Nowa Broń"
 curtiss.276.d: ""
 curtiss.276.f: "Mijają dni, zanim ostrze nowo wykutej broni spocznie w świetle lampy. [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] przygląda mu się. Po zakończeniu pracy kowal żąda zapłaty i zaznacza, że w żadnej innej dolinie nie znajdzie tak pięknego egzemplarza."
 curtiss.276.g: "To nauczy innych szacunku!"
 curtiss.277.t: "Kora"
 curtiss.277.d: ""
 curtiss.277.f: "Zamówienie zaskoczyło kowala. Nepalska broń? Początkowo poczuł się urażony na honorze. Jednak [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] obstawał przy swoim zamówieniu. Cóż, w końcu to było jego żelazo i jego pieniądze. I choć kowal przez wiele dni pracy milczał, odpowiadając na pytania jedynie pomrukami lub lekceważącymi bądź twierdzącymi odgłosami, efekt końcowy okazał się równie przekonujący. Miecz kora nie różnił się niczym od tradycyjnej broni spotykanej w Katmandu."
 curtiss.278.t: "Żebrak"
 curtiss.278.d: ""
 curtiss.278.f: "Chłodne himalajskie powietrze hula po ulicach. Mieszkańcy pochowali się w swoich domach. Na ścianach wiszą brudne flagi i stare dywany. Przy drodze śnieg sięga kostek. Żebrak drży w cieniu, wyciągając drewnianą miskę, w której leży pół miedzianej monety."
 curtiss.278.g: "Naprzód"
 curtiss.278.h: "Daj Jałmużnę."
 curtiss.278.i: "Podaruj Wełnę."
 curtiss.279.t: "Tajemnica Mnicha"
 curtiss.279.d: ""
 curtiss.279.f: "Żebrak z entuzjazmem przyjmuje wełnę. Otula nią ramiona, owija nią pierś i obwiązuje się nią w pasie, po czym zaciera dłonie. [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] chce kontynuować rozmowę, ale mężczyzna go powstrzymuje.\n„Podzieliłeś się ze mną czymś. Teraz ja chcę podzielić się czymś z tobą”.\n[SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] odpowiada, że nie sądzi, by żebrak miał cokolwiek, czym mógłby się z nim podzielić. Żebrak przyznaje mu rację: nie, rzeczywiście niczego nie posiada. Zna jednak kogoś, kto może mu coś ofiarować. Samotnego mnicha żyjącego w górach Ngari. Świętego męża. Daje ludziom to, czego potrzebują, choć sami nie wiedzą, czego pragną. Żyje na odludziu i każdy, kto próbowałby go odnaleźć, zgubiłby drogę, gdyby jej nie znał. Jednak ten, komu uda się go znaleźć, otrzyma sowitą nagrodę. O ile uzna, że jest jej godzien.\n„A co mam zrobić, by okazać się godnym?” — pyta [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName].\nŻebrak pociera wełnę.\n„Już to zrobiłeś”."
 curtiss.279.g: "Wkrótce nie będzie już takim tajemniczym mnichem."
 curtiss.280.t: "Tawerna"
 curtiss.280.d: ""
 curtiss.280.f: "Za długim barem, na ścianie hałaśliwej i zatłoczonej tawerny, wisi ogromny wypchany kruk z szeroko rozpostartymi skrzydłami. Wśród gości o późnej porze można dostrzec barwną mieszankę osobistości: tybetańskich tubylców, nieustraszonych szerpów pełniących rolę górskich przewodników, podejrzanych przemytników i zbiegów z różnych stron świata, a także, rzecz jasna, alpinistów ze wszystkich zakątków globu. Za barem stoi wysoki Nepalczyk. [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] daje mu do zrozumienia, że szuka informacji. Informacji o zaginionej dolinie w górach. Barman odsyła go do jednego z szerpów. Ten zna wszystkie przełęcze i doliny w okolicy. Alkohol leje się strumieniami. Szerpa nie zna jednak żadnej doliny pasującej do opisu. Wtedy [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] wspomina o Shangri-La. Szerpa nadstawia uszu, ale po chwili znów milknie. Następnie rozmowa schodzi na temat trzech artefaktów, które podobno wskazują drogę do ukrytej doliny. Alkohol znów leje się strumieniami. I jeszcze raz. I kolejny.\n„W świątyni w Ngari” — mówi w końcu szerpa — „znajduje się mały posążek Buddy. Można go wcisnąć w ścianę...”"
 curtiss.280.g: "Cenna Informacja"
 curtiss.281.t: "Ngari"
 curtiss.281.d: ""
 curtiss.281.f: "Osada. Gdzieś w niedostępnej dolinie. Nad grzbietem górskim góruje święta góra Kailaś ze swoim charakterystycznym szczytem. Przyciąga pielgrzymów. Niczym kryształowa piramida wyrastająca pośród bezkształtnych, surowych gór, przyćmiewa dolinę wraz z jej niewielkimi osadami. Znalezienie miejsca do lądowania w tej odludnej okolicy było trudnym zadaniem. [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] pozostawił więc samolot w bezpiecznej odległości i musiał odbyć długi marsz, zanim dotarł do skupiska domów. Można tu spotkać wędrownego kupca handlującego żelazem. Tuż za osadą znajduje się starożytna świątynia. Poza tym rozciąga się bezkresna dzicz."
 curtiss.281.g: "Wyrusz na Pustkowie."
 curtiss.281.h: "Odwiedź Handlarza Żelazem."
 curtiss.281.i: "Odwiedź Świątynię."
 curtiss.282.t: "Niedostępne Góry"
 curtiss.282.d: ""
 curtiss.282.f: "Wiatr nieustannie smaga góry. Niczym potwór pożera wszystko wokół. Śnieg przetacza się przez krajobraz. Ciemne niebo i płatki śniegu ograniczają widoczność do zaledwie kilku metrów. W promieniu wielu kilometrów nie ma ani domów, ani ludzi. Nawet ptaków. Żadnych oznak życia. Pośród walki z żywiołami nie pozostał już żaden ślad romantyzmu wspinaczki górskiej. Wokół nie ma najmniejszej oznaki życia. Nogi [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] stają się coraz cięższe. Nie tylko dlatego, że wędruje już od wielu dni. Śnieg przyrasta z każdym krokiem i sięga coraz wyżej, aż po kolana. Od wielu godzin idzie na oślep."
 curtiss.282.g: "Idź Dalej."
 curtiss.282.h: "Poszukaj Mnicha."
 curtiss.282.j: "Powrót "
 curtiss.283.t: "Zagubiony na Pustkowiu"
 curtiss.283.d: ""
 curtiss.283.f: "Lód, piargi i śnieg ciągną się aż po horyzont. Samotny szerpa przemierza przełęcz, prowadząc zwierzę juczne obładowane bagażami. Zaspy śnieżne z ostatnich dni zdążyły już opaść. Wokół panuje cisza. Niebo jest bezchmurne. Na zboczu powiewa skrawek materiału. Szerpa dostrzega go i podchodzi bliżej — po czym natychmiast reaguje. Odnajduje nieprzytomne ciało [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName], dotknięte ciężką hipotermią. Oznaki życia są słabe — ale wciąż żyje."
 curtiss.283.g: "O włos uniknął śmierci..."
 curtiss.284.t: "Godzien czy nie?"
 curtiss.284.d: ""
 curtiss.284.f: "W zamieci śnieżnej wyłania się sylwetka. Tuż przed chwilą, gdy [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] ma się poddać i osunąć na ziemię, by oddać się na pastwę żywiołów, ukazują mu się czerwone i pomarańczowe szaty mnicha idącego przez śnieżną zawieję; zawieję, która z jednej chwili na drugą traci swą siłę, grozę i dzikość, aż pozostaje po niej jedynie lekki powiew. Pozostają już tylko [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] i Mnich. Jednak [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] nie jest w stanie nic powiedzieć, więc mnich unosi dłoń.\n„Jak sądzisz, dlaczego właśnie tobie miałaby zostać ukazana droga do miejsca, którego pragniesz? Jak myślisz, jaki człowiek byłby godny wejść do tego miejsca?”\nŻadnego przedstawienia się. Żadnego powitania. Żadnego pytania, kim jest i czego chce. [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] odnosi się do tego z nieufnością; ten człowiek nie może wiedzieć, kim on jest ani czego pragnie. Aż nagle dociera do niego, że mnich musiał mieć jakąś wskazówkę — czy wiedział, że mógł go tu skierować jedynie żebrak z Lhasy?"
 curtiss.284.g: "Pokutnik"
 curtiss.284.h: "Wierny"
 curtiss.284.i: "Pokorny"
 curtiss.284.j: "Odważny"
 curtiss.285.d: ""
 curtiss.285.f: "„Kto szuka jakiegoś miejsca, musi również wiedzieć, co go tam czeka. Cel, który przyświeca poszukiwaniom, nie zawsze odpowiada temu, co można tam znaleźć. Co charakteryzuje miejsce, którego szukasz?”"
 curtiss.285.g: "Pokoju i Długiego Życia."
 curtiss.285.h: "Wspólnota i Radość."
 curtiss.285.i: "Mądrość i Prawda."
 curtiss.285.j: "Oświecenie i Uzdrowienie."
 curtiss.286.d: ""
 curtiss.286.f: "„Miejsce, którego szukasz, ma wiele nazw. Podobnie jak jedna siła, która spaja wszechświat. Ludzie nadają nazwy, ale to nie znaczy, że powołują te rzeczy do istnienia. Raczej intuicyjnie wyczuwają, że one istnieją. A nawet jeśli nazwy oznaczają to samo, niekoniecznie odnoszą się do tej samej rzeczy. Jeśli chcesz mieć nad czymś władzę, możesz nad tym zapanować tylko wtedy, gdy znasz właściwą, prawdziwą nazwę. Jak więc nazywa się miejsce, którego szukasz?”"
 curtiss.286.g: "Miejsce znane jako Shangri-La."
 curtiss.286.h: "Góra Zaginionego Horyzontu."
 curtiss.286.i: "Królestwo Szambali."
 curtiss.286.j: "Dolina Błękitnego Księżyca."
 curtiss.287.t: "Talizman"
 curtiss.287.d: ""
 curtiss.287.f: "„Widzę, że przybywasz w pełni przygotowany. Nie jesteś pierwszą osobą, która szuka doliny. Poszukiwali jej mężczyźni i kobiety ze wszystkich stron świata. Nie mogę wskazać ci drogi, ale mogę ułatwić ci wędrówkę. Kto szuka Doliny Błękitnego Księżyca, potrzebuje czegoś znacznie więcej niż własnych sił”.\nMnich wkłada coś w dłonie [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName]. To talizman.\n„Piąty Dalajlama podbił te ziemie. Ponoć ten ochronny talizman należał właśnie do niego. Udowodniłeś, że jesteś godzien go nosić”.\n[SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] miał jeszcze wiele pytań. Chciał się dowiedzieć, co mnich wie o Shangri-La. Przyszło mu też na myśl, że wręczony mu przedmiot jest czymś więcej niż tylko błyskotką, której moc bierze się z przesądów miejscowej ludności. Mnich uznaje jednak swoje zadanie za zakończone. Odchodzi wśród śniegu niesionego coraz silniejszym wiatrem. [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] pozostaje z wątpliwościami. Przedmiot nie jest artefaktem z Shangri-La. Czy przybył tu na próżno? Czy został wprowadzony w błąd?"
 curtiss.287.g: "Talizman? Ale jak to ma pomóc...?"
 curtiss.288.t: "Handlarz Żelazem"
 curtiss.288.d: ""
 curtiss.288.f: "Kudłate jaki parskają wśród łagodnych podmuchów wiatru niosącego śnieg. Wędrowny handlarz poprawia rękawice. Najwyraźniej szykuje się do drogi. Niewielkie sztabki żelaza leżą ułożone w stosy pod prowizorycznym zadaszeniem z drewna i tkaniny, przypominającym zniszczony namiot. Gdy dostrzega [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName], wita go gestem."
 curtiss.288.g: "Kup żelazo."
 curtiss.289.t: "Kapliczka"
 curtiss.289.d: ""
 curtiss.289.f: "Za osadą stoi samotna kapliczka. To najbardziej charakterystyczne dzieło ludzkich rąk w promieniu wielu mil. Oprócz kilku barwnych kwiatów, młynków modlitewnych, powiewających wstęg i posążka Buddy uwagę [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] przyciąga przede wszystkim inskrypcja. Co zdumiewające, zapisano ją alfabetem łacińskim — i to w jednym z europejskich języków. [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] mógłby przysiąc, że to buddyjska kapliczka, lecz po chwili uświadamia sobie, że tego rodzaju budowle są w Tybecie niezwykle rzadkie. Miejscowi wolą przypominające pagórki czorteny. A jednak inskrypcja wygląda na starą, liczącą co najmniej kilka stuleci. Jak zdołał ustalić [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName], napis jest po francusku. Nie wie, skąd wzięła się ta tablica ani dlaczego się tu znalazła, ale korzystając z przyrdzewiałej znajomości języka, próbuje odczytać jej treść. Niektóre litery zatarły się już pod wpływem czasu i pogody.\n„Tylko poszukujący prawdy okaże się godzien. Tylko szczodry okaże się godzien. Tylko wierny okaże się godzien. Będzie żył przez długie lata i odnajdzie pokój wśród mądrych i oświeconych. Lecz tych, którymi kieruje chciwość, pochłonie ziemia”."
 curtiss.289.g: "Popchnij figurkę Buddy."
 curtiss.290.t: "Tajemnica Kapliczki"
 curtiss.290.d: ""
 curtiss.290.f: "Posążek Buddy zagłębia się w ścianie kapliczki. Rozlega się terkot mechanizmu. Otwiera się tajny schowek, odsłaniając misternie zdobioną szkatułkę. [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] pochyla się nad skarbem. Domyśla się, co może kryć się w środku — i szybko otwiera zamek."
 curtiss.290.g: "Artefakt z Shangri-La!"
 curtiss.291.t: "Droga do Shangri-La"
 curtiss.291.d: ""
 curtiss.291.f: "Po kilku dniach analiz renomowany archeolog [SCOPE.sCharacter('curtiss_shangrila_archaeologist').GetFullName] zakończył badania. Jak wyjaśnił gronu wykładowców podczas imponującego wykładu, jest to swego rodzaju szyfr, który można odczytać jedynie poprzez właściwą interpretację trzech artefaktów. Oczywiście znalezienie rozwiązania w ciągu zaledwie kilku dni było wyłącznie zasługą jego wybitnego intelektu. Sam opis jest dość prymitywny i opiera się na kilku górach, przełęczach i rzekach, ale dzięki najnowocześniejszym metodom kartograficznym można na jego podstawie wyznaczyć również proste współrzędne. Nic już nie stoi na przeszkodzie zbadaniu legendarnej doliny.\nJednak po rozwlekłym wystąpieniu archeologa zarówno przedstawiciele rządu, jak i [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] dochodzą do wniosku, że lepiej będzie, jeśli nie weźmie on udziału w wyprawie."
 curtiss.291.g: "Powinno o tym wiedzieć jak najmniej osób."
 curtiss.292.t: "Turbulencje"
 curtiss.292.d: ""
 curtiss.292.f: "Mniej niż sto mil. [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] nie pamiętał już dokładnej odległości. Od godziny przedzierał się przez nieprzeniknioną ścianę chmur. Maszyna nabierała wysokości, lecz wciąż nie mogła przebić się ponad pokrywę chmur. Gdy schodził niżej, zasłona się rozstępowała, ale jednocześnie samolot zbliżał się niebezpiecznie do górskich grani i ośnieżonych szczytów. Nie widział doliny. Choć wiedział, czym to grozi, musiał obniżyć lot. Inaczej minąłby cel. Rozważał znalezienie miejsca do lądowania na noc i ponowny lot pod wskazane współrzędne następnego ranka, ale coś mu mówiło, że miejsca takie jak ta dolina zawsze spowija tajemnicza mgła, która chroni je przed odkryciem. Nie miało znaczenia, czy szukałby tutaj dzisiaj, jutro, czy za miesiąc: chmury i mgła zawsze stawałyby mu na drodze. Lecz gdy [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] porusza drążkiem sterowym, cała maszyna zaczyna drżeć, a silnik wyje — samolot wpadł w turbulencje! Górskie wiatry igrają z wirującą w powietrzu maszyną niczym zabawką, a pilot rozpaczliwie próbuje zapanować nad sterami..."
 curtiss.292.g: "Co się dzieje?!"
 curtiss.293.t: "Lądowanie awaryjne"
 curtiss.293.d: ""
 curtiss.293.f: "Odłamane metalowe skrzydło połyskuje na himalajskiej skale. Szczątki leżą porozrzucane wśród trawy i ziemi. Połamane śmigło utkwiło w krzewie. Przez kwietne łąki ciągnie się pas zrytej ziemi, na którego końcu dymi kadłub samolotu, a silnik wydaje ostatnie westchnienie. Drzwi samolotu otwierają się gwałtownie — po czym odpadają i z hukiem uderzają o ziemię. [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] chwiejnym krokiem wydostaje się z maszyny i chwyta metalowego kadłuba. Przytłacza go natłok wrażeń. Awaryjne lądowanie jest tylko jednym ze szczegółów. Mgła, chmury, śnieg, zimno — wszystko to już minęło. Śnieg widać jedynie na górskich szczytach, poniżej których rozciągają się lasy, rzeki i wodospady. Na błękitnym niebie świeci słońce. Z pobliskich gorących źródeł unosi się para. [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] zdejmuje kurtkę lotniczą. Jest nie tylko przyjemnie łagodnie, ale wręcz ciepło. W powietrzu unosi się woń herbaty i miodu. Spogląda na zbocza porośnięte brzoskwiniami. Na wzgórzu wznosi się pagoda, a gong obwieszcza południe. W oddali rysują się zabudowania miasta, nad którym góruje budowla przypominająca klasztor. Zauważa, że miasto nie ma murów, a klasztor, co w Tybecie dość niezwykłe, pozbawiony jest umocnień. Wokół rozciągają się łany pszenicy, których kłosy kołyszą się na wietrze. Gdzie indziej rolnicy przemierzają podmokłe pola ryżowe. Z barwnie zdobionych okien dobiega odległa muzyka."
 curtiss.293.g: "Czy to... ta dolina?"
 curtiss.294.t: "Dolina Błękitnego Księżyca."
 curtiss.294.d: ""
 curtiss.294.f: "Wędrował wzdłuż murów i straganów. Panowała tu atmosfera beztroski i swobody, jakiej [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] nigdy wcześniej nie zaznał. Choć był obcy, ludzie na ulicach pozdrawiali go, jakby był po prostu kimś, kogo od dawna nie widzieli. Karczmarz zaprasza go do swojej izby, a dziewczyna sprzedająca pomarańcze częstuje go owocem. Uwagę [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] zwraca również zaskakująco europejski charakter miasta. Spodziewał się buddyjskich świątyń. Zamiast nich czekają na niego kościoły we francuskim stylu. W twarzach nie dostrzega śladów starości ani cierpienia, jedynie życzliwy spokój. Jest też pewien, że wśród tej mieszaniny ludów znalazłby kilku rodaków, gdyby tylko zagadnął przechodniów. Shangri-La nie jest tybetańskim miastem. To miejsce dla wszystkich.\n„A więc wreszcie przybyłeś...”\nPrzychodzi mu na myśl, że to nie on szukał [SCOPE.sCharacter('curtiss_conway_scope').GetFullName], lecz raczej [SCOPE.sCharacter('curtiss_conway_scope').GetFullName] szukał jego. Stoi teraz przed mężczyzną o [ROOT.GetCountry.GetAdjectiveNoFormatting] rysach twarzy, odzianym jednak w habit przeora kapucynów."
 curtiss.294.g: "[SCOPE.sCharacter('curtiss_conway_scope').GetFullName] jest panem tego miejsca?"
 curtiss.295.t: "[SCOPE.sCharacter('curtiss_conway_scope').GetFullName]"
 curtiss.295.d: ""
 curtiss.295.f: "Potwierdzają się przypuszczenia [SCOPE.sCharacter('curtiss_conway_scope').GetFullName]. Całe poszukiwanie Shangri-La było próbą. Nie był pierwszym, który odnalazł trzy artefakty, później odkładane na swoje miejsca. Obowiązek ich ponownego ukrycia spoczywał na tym, kto jako ostatni dotarł do Shangri-La. W ten sposób przyciągał do doliny kolejną osobę godną poznania jej tajemnic. A [SCOPE.sCharacter('curtiss_conway_scope').GetFullName] wcale nie zamierzał dać się uratować: po śmierci poprzedniego władcy sam objął rządy, oparte na uznaniu i zasługach, a nie na sile. Górujący nad Shangri-La pałac był czymś więcej niż wygodną siedzibą: mieścił wszystkie pisma, jakie kiedykolwiek powstały, skarby sztuki z całego świata oraz obiekty sportowe, takie jak kort tenisowy, basen, a nawet pole golfowe. [SCOPE.sCharacter('curtiss_conway_scope').GetFullName] nie ukrywał, że chce przyjąć [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] jak członka rodziny. Miałby tu zgłębić wszelką wiedzę, zostać uleczony ze wszystkich chorób i cieszyć się długim życiem. Pod warunkiem, że pozostałby w dolinie."
 curtiss.295.g: "Może... trzeba było uratować [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName]..."
 curtiss.296.t: "Decyzja"
 curtiss.296.d: ""
 curtiss.296.f: "„Nie jesteśmy cudotwórcami; nie pokonaliśmy śmierci ani nawet starzenia się. Wszystko, czego dokonaliśmy i co niekiedy potrafimy uczynić, to spowolnienie biegu tej krótkiej chwili zwanej życiem. Osiągamy to metodami, które tutaj są równie proste, co gdzie indziej niemożliwe do zastosowania. Nie miej jednak złudzeń: kres czeka nas wszystkich. Będziesz miał czas na lekturę — już nigdy nie będziesz pobieżnie przeglądał stron, by zaoszczędzić kilka minut, ani unikał zgłębiania jakiejś dziedziny z obawy, że zbytnio cię pochłonie. Masz również upodobanie do muzyki — oto więc nuty i instrumenty, a wraz z nimi Czas, spokojny i nieodmierzany, dzięki któremu w pełni zaznasz ich piękna. Mamy marzenie i wizję. Wizję, która po raz pierwszy ukazała się staremu Perraultowi, gdy w roku 1789 leżał w tej komnacie na łożu śmierci. Spoglądał wówczas wstecz na swoje długie życie, jak już ci opowiadałem, i zdawało mu się, że wszystko, co najpiękniejsze, jest ulotne i nietrwałe, a wojna, żądza i okrucieństwo mogą pewnego dnia zniszczyć to doszczętnie, aż nic z tego nie pozostanie na świecie. Przywoływał obrazy, które widział na własne oczy, a inne podsuwała mu wyobraźnia. Widział narody rosnące w siłę za sprawą pospolitych namiętności i woli zniszczenia zamiast mądrości; widział, jak zwielokrotnia się potęga ich machin, aż jeden uzbrojony człowiek mógłby dorównać całej armii Króla Słońce. Przewidział czasy, gdy ludzie, upojeni kunsztem zabijania, z taką furią pustoszyć będą świat, że zagrożone stanie się wszystko, co cenne: każda księga, każdy obraz i każda harmonia, każdy skarb zgromadzony przez dwa tysiąclecia. Wszystko, co drobne, delikatne i bezbronne — wszystko przepadnie bezpowrotnie. I właśnie dlatego, mój synu, ja tu jestem, dlatego TY tu jesteś i dlatego możemy modlić się o to, by przetrwać zagładę”."
 curtiss.296.g: "To miejsce powinno pozostać tajemnicą. [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] będzie zgłębiać wiedzę."
 curtiss.296.h: "To miejsce powinno być chronione. [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] zostanie."
 curtiss.296.i: "To miejsce będzie nasze. W imię [ROOT.GetCountry.GetNameNoFormatting]!"
 curtiss.298.t: "Zła Karma"
 curtiss.298.d: ""
 curtiss.298.f: "Wyprawa wreszcie powróciła po tym, jak [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] wskazał naszym ludziom drogę do Doliny Błękitnego Księżyca, a oni splądrowali bezcenne skarby Shangri-La. Jednak [SCOPE.sCharacter('curtiss_shangrila_leader').GetLastName] zaginął w tajemniczych okolicznościach. Pozostali członkowie wyprawy nie potrafią z całą pewnością powiedzieć, co się z nim stało. Oddalił się od grupy podczas odpoczynku i runął ze zbocza, a ślad po nim zaginął w głębokim wąwozie. Nasze muzeum wzbogaciło się o liczne skarby, lecz straciliśmy obiecującego patriotę, który poświęcił własną uczciwość, by wzbogacić zbiory archeologiczne naszego narodu."
 curtiss.298.g: "Pochłonięty przez ziemię..."
 curtiss.311.t: "Nowy Pilot"
 curtiss.311.f: "„Trafiam pociskami w cel tak, jakbym umieszczał je tam własnoręcznie”. — René Fonck"
 curtiss.311.g: "To będzie początek wyjątkowej kariery."
 curtiss.311.h: "Potrzebujemy go do propagandy krajowej."
 curtiss.312.t: "As Lotnictwa"
 curtiss.312.d: "Nasz pilot [SCOPE.sCharacter('curtiss_ace').GetFullName] wielokrotnie dowiódł swoich umiejętności podczas obecnej wojny, zestrzeliwując znaczną liczbę wrogich samolotów. Towarzysze broni widzą w nim wschodzącego asa lotnictwa."
 curtiss.312.f: "„Nie każdy potrafi w ostatniej chwili zachować pełną przytomność umysłu, spokojnie zgrać szczerbinkę z muszką i utrzymać głowę nieruchomo”. — Manfred von Richthofen"
 curtiss.312.g: "Nowy bohater narodowy!"
 curtiss.500.t: "Marzenie [SCOPE.sCharacter('howard_hughes').GetFullName]"
 curtiss.500.d: "Szef linii lotniczych [ROOT.GetCountry.GetAdjectiveNoFormatting] ogłosił swój wizjonerski i ekscentryczny plan budowy największego samolotu na świecie. Do jego realizacji brakuje jedynie niewielkiego wsparcia ze strony rządu."
 curtiss.500.f: "To była niezwykła konferencja prasowa, którą [SCOPE.sCharacter('howard_hughes').GetFullName] zorganizował wczoraj wieczorem w siedzibie swojej firmy w mieście [ROOT.GetCountry.GetCapital.GetCityHubName]. Od pewnego czasu dziennikarze powątpiewają w jego zdrowie psychiczne. Ponoć [SCOPE.sCharacter('howard_hughes').GetLastName] cierpi na natręctwa i psychozy. Jego obrońcy przekonywali jednak, że mimo wszystko z powodzeniem prowadzi swoje przedsiębiorstwo. Lecz nawet oni zamilkli, gdy usłyszeli, co potentat miał do powiedzenia: zamierza zbudować największy samolot na świecie, zdolny przewieźć przez Atlantyk nawet tysiąc osób. W budowę tego powietrznego kolosa zainwestuje cały swój majątek. Liczy również na niewielki wkład ze strony rządu, gdyż urzeczywistnienie jego wizji przysłużyłoby się rozwojowi lotnictwa i infrastruktury, a także podniosło prestiż kraju. Wspomniał o niewielkiej sześciocyfrowej kwocie. Samolot otrzyma nazwę naszej stolicy: [ROOT.GetCountry.GetCapital.GetCityHubName]."
 curtiss.500.g: "Wspaniała wizja! Samolot [ROOT.GetCountry.GetCapital.GetCityHubName] stanie się rzeczywistością."
 curtiss.500.h: "To szaleństwo."
 curtiss.501.t: "Typ Samolotu"
 curtiss.501.d: "Konstruktorzy samolotu [ROOT.GetCountry.GetCapital.GetCityHubName] nie zdecydowali jeszcze, czy maszyna ma być klasycznym samolotem, czy łodzią latającą."
 curtiss.501.f: "Wodnosamoloty nie były jedynie przelotną modą. Od lat dziesiątych do lat czterdziestych XX wieku miały znaczną przewagę nad konwencjonalnymi samolotami. Nie potrzebowały pasów startowych i mogły lądować na dowolnym akwenie — zarówno na morzu, jak i na większych jeziorach. Podczas gdy lotniska znajdowały się poza miastami, wodnosamoloty mogły korzystać z istniejących portów morskich. Kraje o długiej linii brzegowej, takie jak Włochy, uważały więc wodnosamoloty i łodzie latające za znacznie bardziej użyteczne. Nawet położony w głębi lądu Mediolan miał wodne lotnisko ze sztucznym jeziorem w pobliżu Linate. Wodnosamoloty zapewniały zatem korzyści również państwom położonym nad Atlantykiem, takim jak Wielka Brytania i USA."
 curtiss.501.g: "To będzie klasyczny samolot."
 curtiss.501.h: "To będzie łódź latająca."
 curtiss.502.t: "Materiały konstrukcyjne"
 curtiss.502.d: "Podczas projektowania samolotu [ROOT.GetCountry.GetCapital.GetCityHubName] wciąż trwają spory o to, jakiego materiału należy użyć."
 curtiss.502.f: "U zarania lotnictwa w konstrukcji samolotów dominowały drewno i płótno. Już podczas pierwszej wojny światowej doceniano lekkość tych materiałów, lecz jednocześnie dostrzegano ich wady. Były mało odporne na warunki atmosferyczne i szybko niszczały. Dlatego w kolejnych latach upowszechniły się konstrukcje częściowo metalowe, a ostatecznie całkowicie metalowe. Gdy aluminium było niedostępne, stosowane metale często ważyły więcej niż drewno. Wytrzymałość metalu sprawiała jednak, że był chętniej wybieranym materiałem, nawet gdy pojawiały się nowe problemy, takie jak korozja czy zmęczenie metalu."
 curtiss.502.g: "Metalu należy używać tylko tam, gdzie to konieczne. Ten samolot będzie wykonany głównie z drewna."
 curtiss.502.h: "Pokryj go w całości metalem."
 curtiss.503.t: "Problemy z silnikami"
 curtiss.503.d: "Prace nad samolotem [ROOT.GetCountry.GetCapital.GetCityHubName] posunęły się naprzód. Maszyna powoli nabiera kształtów. Kwestia silników nie została jeszcze ostatecznie rozstrzygnięta: do wyboru są dwa warianty."
 curtiss.503.f: "Podczas drugiej wojny światowej i aż do połowy lat pięćdziesiątych XX wieku produkowano tłokowe silniki lotnicze o mocy startowej ponad 3680 kW (5000 KM) i pojemności skokowej przekraczającej 70 litrów, przeznaczone do napędzania myśliwców, bombowców i dużych samolotów pasażerskich. Wyróżniały się wśród nich silniki Wright R-3350 i Pratt & Whitney R-4360. Do dziś uchodzą za szczytowe osiągnięcie w konstrukcji tłokowych silników lotniczych przed triumfem samolotów odrzutowych. Wright R-3350 to silnik 18-cylindrowy, a Pratt & Whitney R-4360 — 28-cylindrowy."
 curtiss.503.g: "Dziesięć 18-cylindrowych silników będzie w sam raz."
 curtiss.503.h: "Potrzebujemy ośmiu 28-cylindrowych silników."
 curtiss.504.t: "Śmigła"
 curtiss.504.d: "Prace nad samolotem [ROOT.GetCountry.GetCapital.GetCityHubName] przebiegają nadzwyczaj pomyślnie. Jak zapewnia [SCOPE.sCharacter('howard_hughes').GetLastName], budowa zakończy się w przewidzianym terminie, choć nie wszystkie kwestie zostały jeszcze rozstrzygnięte. Niedawno ponownie rozpatrzono kwestię liczby łopat śmigieł."
 curtiss.504.f: "Zasadniczo największą sprawność ma śmigło jednołopatowe, ponieważ strumień powietrza napływający na obracającą się łopatę jest w najmniejszym stopniu zakłócany przez turbulencje wywołane przez łopatę poprzedzającą. Wymaga ono jednak przeciwwagi, niesymetrycznie obciąża wał napędowy i wywołuje stosunkowo silne drgania, dlatego konstrukcje tego typu są rzadko stosowane. Większa liczba łopat ogranicza drgania, zwłaszcza gdy poszczególne łopaty napotykają odmienne warunki przepływu powietrza w różnych częściach kręgu zakreślanego przez śmigło. W samolotach z silnikami tłokowymi najczęściej stosuje się śmigła dwułopatowe. Natomiast w większych samolotach z silnikami turbośmigłowymi lub śmigłowentylatorowymi śmigła mają od 3 do 7 łopat, a nawet więcej."
 curtiss.504.g: "Śmigła 4-łopatowe będą odpowiednie."
 curtiss.504.h: "Będziemy potrzebować śmigieł 5-łopatowych."
 curtiss.505.t: "Najwspanialszy Dzień w Historii"
 curtiss.505.d: "Samolot [ROOT.GetCountry.GetCapital.GetCityHubName] wkrótce wyruszy w swój dziewiczy lot. Wiąże się z tym wiele niewiadomych. [SCOPE.sCharacter('howard_hughes').GetFullName] nalega, by osobiście pilotować maszynę i zaprosić na pokład przedstawicieli biznesu, polityki i prasy. Inni zalecają większą ostrożność, domagając się dopuszczenia jedynie wybranych przedstawicieli lub przeprowadzenia lotu całkowicie bez udziału publiczności — na wypadek, gdyby podczas pierwszego lotu coś poszło nie tak..."
 curtiss.505.f: "„Hercules był monumentalnym przedsięwzięciem. To największy samolot, jaki kiedykolwiek zbudowano. Ma ponad pięć pięter wysokości, a rozpiętość jego skrzydeł przekracza długość boiska do futbolu amerykańskiego. To więcej niż długość kwartału miejskiej zabudowy. Włożyłem w tę maszynę cały trud mojego życia. Postawiłem na nią całą swoją reputację i kilkakrotnie oświadczyłem, że jeśli okaże się porażką, prawdopodobnie opuszczę ten kraj i nigdy nie wrócę. I mówię to poważnie”. — Howard Hughes"
 curtiss.505.g: "Zaproście przedstawicieli prasy, biznesu i polityki. Pan [SCOPE.sCharacter('howard_hughes').GetLastName] osobiście poprowadzi samolot."
 curtiss.505.h: "Zapraszamy prasę. Samolot poprowadzi znany pilot."
 curtiss.505.i: "Ten lot ma się odbyć w tajemnicy. Samolot ma przetestować anonimowy pilot."
 curtiss.506.t: "„400.000 Funtów w Powietrzu”"
 curtiss.506.d: "Dokonał się cud techniki: samolot [ROOT.GetCountry.GetCapital.GetCityHubName] potrafi latać mimo swoich gigantycznych rozmiarów!"
 curtiss.506.f_hughes: "To był jego dzień. Dzień jego życia. Jego sukces. Jego wizja. [SCOPE.sCharacter('howard_hughes').GetFullName] postawił wszystko na jedną kartę. Tutaj zwyciężyć — albo tutaj przegrać i upaść. Nie uznawał półśrodków. Zaprosił całą prasę, szefów największych przedsiębiorstw, a nawet parlamentarzystów i ministrów. Nie mieli zasiąść na trybunach. Mieli polecieć razem z nim. A cały świat miał go wyśmiać i pociągnąć jego przedsiębiorstwo w otchłań — albo miał zatriumfować niczym starożytny Cezar.\n[SCOPE.sCharacter('howard_hughes').GetLastName] siedział za sterami. Uruchomił silniki. Wydał maszynie [ROOT.GetCountry.GetCapital.GetCityHubName] rozkaz. Kolos zagrzmiał. Wzburzył fale. Tytan pędził po wodzie przez czas zdający się ciągnąć w nieskończoność, a biała zasłona rozbryzgów nie pozwalała stwierdzić, czy samolot [ROOT.GetCountry.GetCapital.GetCityHubName] wciąż sunie po powierzchni, czy już jest w powietrzu. Potem: tylko donośny huk silników. Żadnych fal. Samolot [ROOT.GetCountry.GetCapital.GetCityHubName] wzbił się w powietrze. Dziennikarze zrobili coś, co rzadko im się zdarzało. Zamilkli. Politycy z trudem zachowywali opanowanie. Przedsiębiorcy wodzili wzrokiem dookoła. Natomiast [SCOPE.sCharacter('howard_hughes').GetLastName] się uśmiechał. Gdy obecni pojęli wreszcie, że stało się coś niewyobrażalnego, jeden z reporterów zapytał: „[SCOPE.sCharacter('howard_hughes').GetFirstName], czy spodziewał się pan tego?”. [SCOPE.sCharacter('howard_hughes').GetLastName] odpowiedział zagadkowo:\n„Lubię sprawiać niespodzianki”."
 curtiss.506.f_pilot: "Historyczny dzień dla [ROOT.GetCountry.GetNameNoFlag]. Samolot [ROOT.GetCountry.GetCapital.GetCityHubName] wzbił się w powietrze z cesarską godnością i pokazał, do czego zdolne są ludzka pomysłowość i postęp. [SCOPE.sCharacter('howard_hughes').GetFullName] już żałuje, że sam nie zasiadł za sterami. Zaproszeni dziennikarze sami byli zaskoczeni, że kolos oderwał się od wody, a dzięki ich relacjom pojawili się już pierwsi nabywcy."
 curtiss.506.f_test: "Cóż za widok! Cóż za cud! Szkoda, że tylko nieliczni mogli podziwiać ten pokaz. Lot samolotu [ROOT.GetCountry.GetCapital.GetCityHubName] mógł być wydarzeniem promocyjnym, które przyciągnęłoby licznych klientów. Liczą się jednak same osiągi. Choć model będzie potrzebował czasu, by zdobyć pozycję na rynku, [SCOPE.sCharacter('howard_hughes').GetFullName] może z satysfakcją stwierdzić, że od początku miał rację. A [ROOT.GetCountry.GetNameNoFlag] oficjalnie staje się krajem, który zbudował największy samolot — i ustanowił rekord, którego przez lata nikt nie pobije."
 curtiss.506.g: "To zaskakujące... w bardzo pozytywnym sensie!"
 curtiss.507.t: "Jak kamień"
 curtiss.507.d: "Potwierdziły się najgorsze obawy. Samolot [ROOT.GetCountry.GetCapital.GetCityHubName] nadaje się do latania równie dobrze jak kamień. Brakuje tylko katapulty, żeby choć na chwilę posłać go w powietrze."
 curtiss.507.f_hughes: "Samolot [ROOT.GetCountry.GetCapital.GetCityHubName] dudnił. Jego silniki ryczały. Na twarzy [SCOPE.sCharacter('howard_hughes').GetLastName] narastało napięcie. 75 mil. 85 mil. 95 mil — ale potwór nie wzbijał się w powietrze. Kolos tkwił przy ziemi. Po kilku minutach pokazu jeden z dziennikarzy rzucił pierwszą uszczypliwą uwagę. Zaraz potem odezwali się krytycy, którzy przecież od początku wiedzieli, jak to się skończy. Politycy zaczęli wysuwać oskarżenia. Przedstawiciele wielkich korporacji również zakwestionowali wcześniejsze ustalenia. Potentat lotniczy po raz ostatni spróbował poderwać swoje dzieło w powietrze — na próżno. Był to najczarniejszy dzień w jego karierze. W końcu [SCOPE.sCharacter('howard_hughes').GetLastName] przerwał próbę. Zapytany, co ta porażka oznacza dla jego firmy, odparł jedynie, że nie jest już prezesem linii lotniczych [ROOT.GetCountry.GetAdjectiveNoFormatting].\n Dzień później [SCOPE.sCharacter('howard_hughes').GetLastName] odwołał wszystkie swoje zobowiązania i na zawsze opuścił [ROOT.GetCountry.GetNameNoFlag]."
 curtiss.507.f_pilot: "Są dni, o których chce się zapomnieć — albo sprawić, by inni zapomnieli, czyniąc następny dzień jeszcze bardziej pamiętnym. Zaledwie dzień po rozczarowaniu nieudanym startem samolotu [ROOT.GetCountry.GetCapital.GetCityHubName], [SCOPE.sCharacter('howard_hughes').GetFullName] ogłosił swoją rezygnację w oświadczeniu, które odbiło się szerokim echem. Ustąpi nie tylko ze stanowiska w swoich liniach lotniczych, lecz także ze wszystkich pozostałych funkcji. Akcje lecą na łeb na szyję, zamówienia zostały anulowane, a zaufanie po prostu przestało istnieć. Wydatki na samolot [ROOT.GetCountry.GetCapital.GetCityHubName] były tak ogromne, że firma stoi na skraju bankructwa i przeżywa najgorszy kryzys w swojej historii. Tymczasem [SCOPE.sCharacter('howard_hughes').GetLastName] zapowiedział, że opuszcza [ROOT.GetCountry.GetNameNoFlag]. Cel jego podróży pozostaje nieznany. Odleciał prywatnym samolotem i zniknął."
 curtiss.507.f_test: "Przeprowadzenie prób samolotu [ROOT.GetCountry.GetCapital.GetCityHubName] za zamkniętymi drzwiami było mądrą decyzją. Na szczęście nie doszło do budzącego obawy wypadku, który mógłby wywołać poruszenie. Nie było jednak również żadnego sukcesu do ogłoszenia. Nawet po kilku próbach samolotu [ROOT.GetCountry.GetCapital.GetCityHubName] nie udało się poderwać w powietrze. Przyczyną niepowodzenia są błędy konstrukcyjne. Dla [SCOPE.sCharacter('howard_hughes').GetLastName] to osobista porażka. Nie skompromitował się publicznie. Za kilka miesięcy ludzie zaczną jednak pytać, co stało się z projektem samolotu [ROOT.GetCountry.GetCapital.GetCityHubName], i wyciągną własne wnioski. Prawda nigdy nie wyjdzie w pełni na jaw, a rząd również zadba o to, by marnotrawstwo pieniędzy podatników nie przerodziło się w skandal korzystny dla opozycji. To pomoc, której [SCOPE.sCharacter('howard_hughes').GetLastName] tak naprawdę nie chce. Nagle stał się człowiekiem bardzo małomównym. Milczącym człowiekiem, który wycofał się z życia publicznego."
 curtiss.507.g: "To było prawdopodobnie drugie największe marnotrawstwo pieniędzy podatników w historii."
 curtiss.508.t: "Koszmar"
 curtiss.508.d: "[SCOPE.sCharacter('howard_hughes').GetFullName] jest nowym Ikarem. Jego dzieło postawiło świat w płomieniach. W straszliwej katastrofie lotniczej zginęły dziesiątki ludzi, a po rozbitej maszynie pozostało jedynie morze szczątków. Liczne błędy konstrukcyjne doprowadziły do tragedii."
 curtiss.508.f_hughes: "Gdy [SCOPE.sCharacter('howard_hughes').GetLastName] uruchamiał silniki, instynkt podpowiadał mu, że coś jest nie tak. Ale plany były poprawne. Obliczenia były poprawne. Nie mogło być mowy o pomyłce. Samolot [ROOT.GetCountry.GetCapital.GetCityHubName] rzeczywiście spisywał się lepiej, niż oczekiwano. [SCOPE.sCharacter('howard_hughes').GetLastName] wierzył, że osiągnął cel. Tak właśnie musiało być. Odrzucił wszelkie wątpliwości. Zaślubił olbrzymi samolot z niebem — i jako jedyny dostrzegł jedynkę po przecinku, podczas gdy za jego plecami dziennikarze i przedstawiciele biznesu świętowali i wiwatowali. Instynkt go jednak nie zawiódł. Pozostali członkowie załogi potrzebowali kilku chwil więcej, by ich okrzyki radości zmieniły się we wrzaski przerażenia. Potem były już tylko huk i ogień. Samolot [ROOT.GetCountry.GetCapital.GetCityHubName] wbijał się w dachy, roztrzaskiwał ściany, zalewał całe szeregi domów olejem i niczym upadający tytan pustoszył ogarniętą pożarem dzielnicę. Maszyna [ROOT.GetCountry.GetCapital.GetCityHubName] stała się piekłem [SCOPE.sCharacter('howard_hughes').GetLastName]. Pociągnął za sobą na śmierć zarówno niewinnych ludzi, którzy przypadkiem znaleźli się na jego drodze, jak i swoich najbliższych współpracowników. Oprócz gruzów i zwłok [SCOPE.sCharacter('howard_hughes').GetLastName] pozostawia po sobie zbankrutowaną firmę i przemysł lotniczy, który przez lata nie podźwignie się z ruiny. [ROOT.GetCountry.GetNameNoFlag] prawdopodobnie nigdy w pełni nie otrząśnie się po tym dniu."
 curtiss.508.f_pilot: "[SCOPE.sCharacter('howard_hughes').GetLastName] przeżył ten dzień, ponieważ nie siedział za sterami samolotu. Czasami jednak lepiej było nie żyć. Zapytany, czy cieszy się, że wbrew wcześniejszym planom nie pilotował maszyny, odpowiedział przecząco. Bo [SCOPE.sCharacter('howard_hughes').GetLastName] odpowiadał nie tylko za jedną z największych katastrof lotniczych w historii. To jedna z największych katastrof w dziejach [ROOT.GetCountry.GetNameNoFlag]. Na jego barkach spoczywała wina za dziesiątki ofiar śmiertelnych i pozostawiony pas zniszczeń. Wraz z samolotem [ROOT.GetCountry.GetCapital.GetCityHubName] legł w gruzach nie tylko dorobek jego życia. Zniszczone zostało wszystko. W ciągu kilku minut, gdy olbrzymi samolot wymknął się spod kontroli i niczym kometa runął na dzielnicę miasta, jego firma poniosła straty, których niemal nie sposób było udźwignąć. Jego marzenie legło w gruzach. Jego firma legła w gruzach. Jego reputacja legła w gruzach. [SCOPE.sCharacter('howard_hughes').GetLastName] zamierzał udać się na wygnanie, gdyby poniósł porażkę. Po tej tragedii wielu domaga się jednak jego głowy, a nie tylko wygnania. Wraz z upadkiem [SCOPE.sCharacter('howard_hughes').GetLastName] zamyka się rozdział w historii lotnictwa — rozdział, w którym [ROOT.GetCountry.GetNameNoFlag] niegdyś przodował."
 curtiss.508.f_test: "Ograniczanie szkód. Nie sposób inaczej opisać tego, co wydarzyło się podczas pierwszego lotu samolotu [ROOT.GetCountry.GetCapital.GetCityHubName]. Ku zaskoczeniu nielicznych widzów maszyna rzeczywiście oderwała się od ziemi — lecz chwilę później wymknęła się spod kontroli. Pilot doświadczalny zginął, próbując skierować powietrznego tytana z dala od szeregu domów. Manewr ten powiódł się tylko częściowo, a kilka budynków zostało poważnie uszkodzonych. Wielu ludzi odniosło obrażenia, a pilot doświadczalny poniósł śmierć. Samolot [ROOT.GetCountry.GetCapital.GetCityHubName] został bezpowrotnie zniszczony. Wskutek katastrofy nie udało się również zachować próby w tajemnicy. Opinia publiczna wie o porażce [SCOPE.sCharacter('howard_hughes').GetLastName]. Potentat ogłosił, że wycofuje się z działalności, i opuścił kraj. Pozostała pogrążona w kłopotach firma, stojąca na skraju bankructwa. Mogło jednak być gorzej. W obliczu poniesionych strat to marne pocieszenie, ale przynajmniej ekscentryczne ambicje szalonego miliardera nie pochłoną już kolejnych ofiar."
 curtiss.508.g: "Lotnictwo nigdy nie zaznało czarniejszego dnia."
 curtiss.510.t: "[ROOT.GetCountry.GetNameNoFormatting]"
 curtiss.510.d: "Po rozbudowie naszych linii lotniczych i niezbędnych fabryk rozpoczęły się prace nad gigantycznym sterowcem. Państwo wniesie swój wkład."
 curtiss.510.f: "„Wystarczy tylko chcieć, wierzyć, a wtedy się uda”. — Ferdinand Graf von Zeppelin"
 curtiss.510.g: "Kamień milowy w historii techniki!"
 curtiss.511.t: "Dziewiczy rejs sterowca [ROOT.GetCountry.GetNameNoFormatting]"
 curtiss.511.d: "Po dwóch latach budowy wreszcie nadszedł ten moment: sterowiec [ROOT.GetCountry.GetNameNoFormatting] majestatycznie wznosi się ku niebu, gotowy do dziewiczego lotu. Wszystkie bilety wyprzedano już kilka miesięcy temu. Pozostaje tylko podjąć ostateczną decyzję, czy pierwszy lot ma się odbyć na trasie krajowej, czy międzynarodowej."
 curtiss.511.f: "Pierwszy udany lot sterowca szkieletowego odbył się w Niemczech w 1900 roku. Był to LZ1 Ferdinanda von Zeppelina. W latach 1910–1914 Deutsche Luftschiffahrts-Aktiengesellschaft (DELAG) przewiozła sterowcami tysiące pasażerów. W 1917 roku niemiecki LZ 104 (L 59) jako pierwszy sterowiec odbył lot międzykontynentalny z Jambołu w Bułgarii do Chartumu i z powrotem, pokonując bez międzylądowania 6,800 kilometrów (4,200 mil; 3,700 mil morskich). Podczas wojny i tuż po niej Wielka Brytania i Stany Zjednoczone budowały sterowce, a Francja i Włochy eksperymentowały ze skonfiskowanymi maszynami niemieckimi. W październiku 1924 roku firma Luftschiffbau Zeppelin dostarczyła marynarce wojennej Stanów Zjednoczonych sterowiec LZ 126 w ramach reparacji wojennych. Lotem dostawczym dowodził prezes firmy, Dr. Hugo Eckener, a jednostka weszła do służby jako USS Los Angeles (ZR-3). W 1925 roku alianci złagodzili ograniczenia wynikające z traktatu wersalskiego, co pozwoliło prezesowi Zeppelin Luftschiffbau, Dr. Hugonowi Eckenerowi, przystąpić do realizacji wizji sterowca zdolnego obsługiwać międzykontynentalne przewozy pasażerskie. Firma Zeppelin Luftschiffbau rozpoczęła więc budowę pierwszego sterowca nowej generacji, LZ 127 Graf Zeppelin. Ukończona maszyna wzbiła się po raz pierwszy w powietrze 18 września 1928 roku. W trakcie swojej służby Graf Zeppelin przeleciał nad południowym Atlantykiem łącznie 136 razy."
 curtiss.511.g: "Pierwszy rejs ma się odbyć na trasie krajowej."
 curtiss.511.h: "Dziewiczy rejs ma się odbyć na trasie międzynarodowej."
 curtiss.512.t: "Podróż sterowca [ROOT.GetCountry.GetNameNoFormatting]"
 curtiss.512.d: "Flagowy sterowiec naszej floty powrócił z ostatniego rejsu. Jaki cel podróży wybrać tym razem?"
 curtiss.512.g: "Zeppelin powinien latać przede wszystkim w granicach naszego kraju."
 curtiss.512.h: "Zeppelin ma latać za granicę i rozsławiać nasz kraj."
 curtiss.513.t: "Katastrofa zeppelina [ROOT.GetCountry.GetNameNoFormatting]"
 curtiss.513.d: "Podczas manewru lądowania na pokładzie zeppelina [ROOT.GetCountry.GetNameNoFormatting] z nieznanych przyczyn wybuchł pożar i maszyna runęła na ziemię! Dziesiątki osób odniosły obrażenia lub zginęły, a katastrofa już jest uznawana za jedną z najtragiczniejszych w historii lotnictwa!"
 curtiss.513.f: "„Zeppelin sunie majestatycznie w naszą stronę niczym olbrzymie pióro, jakby był dumny — niezmiernie dumny ze swojej roli w światowym lotnictwie. Na pokładzie bez wątpienia wre praca, jak możemy zauważyć. Załodze wykrzykuje się rozkazy, pasażerowie zapewne tłoczą się przy oknach, spoglądając na rozciągające się przed nimi lądowisko i wypatrując masztu cumowniczego. Teraz zeppelin niemal stoi w miejscu; z dziobu zrzucono liny, które pochwyciła grupa ludzi na lądowisku. Znów zaczyna padać — deszcz wcześniej trochę zelżał. Tylne silniki utrzymują go w miejscu, akurat na tyle, żeby nie —\nStanął w płomieniach! Odsuńcie się! Odsuńcie się! Płonie i spada! To straszna katastrofa! O Boże, proszę się odsunąć. Płonie, ogarniają go płomienie i on — i spada na maszt cumowniczy, a wszyscy są zgodni, że to straszne. To jedna z najgorszych katastrof na świecie! Teraz wszędzie dym i płomienie, a szkielet wali się na ziemię, tuż obok masztu cumowniczego. Och, ci biedni ludzie i wszyscy pasażerowie, krzyczący wokół mnie!” — Herbert Morrison"
 curtiss.513.g: "Dotkliwy cios dla przemysłu zeppelinowego."
 curtiss.514.t: "Hel zamiast Wodoru"
 curtiss.514.d: "Dzięki naszym zasobom helu możemy całkowicie zrezygnować z użycia łatwopalnego wodoru przy budowie naszego zeppelina [ROOT.GetCountry.GetNameNoFormatting]."
 curtiss.514.f: "Zeppelin wypełniony helem jest znacznie bezpieczniejszy od swojego odpowiednika wypełnionego wodorem. Zapewni to znacznie bezpieczniejszą podróż. Ryzyko katastrofy zostanie więc istotnie ograniczone, choć w lotnictwie nigdy nie można całkowicie wykluczyć wypadków."
 curtiss.514.g: "A ja myślałem, że to nadaje się tylko do robienia śmiesznych głosów."
 curtiss.520.t: "Dowódca Wyprawy Zeppelinem"
 curtiss.520.d: "Wyprawa na Biegun Północny nadal potrzebuje zdolnego pilota sterowca."
 curtiss.520.f: "Do wyprawy zeppelinem można wybrać jednego z maksymalnie trzech pilotów. W niektórych sytuacjach asy lotnictwa mają większe szanse na zażegnanie niebezpieczeństwa. W razie wypadku zeppelina istnieje jednak ryzyko śmierci pilota."
 curtiss.520.g: "[SCOPE.sCharacter('curtiss_expedition_leader_1').GetFullName]."
 curtiss.520.h: "[SCOPE.sCharacter('curtiss_expedition_leader_2').GetFullName]."
 curtiss.520.i: "[SCOPE.sCharacter('curtiss_expedition_leader_3').GetFullName]."
 curtiss.521.t: "Misja Zeppelina"
 curtiss.521.d: "Po wybraniu zdolnego pilota musimy teraz sprecyzować cel badań."
 curtiss.521.f: "Udana wyprawa przyczyni się do rozwoju badań w naszym kraju. Możemy z góry zdecydować, której dziedzinie poświęcimy podczas wyprawy szczególną uwagę. Geografia poszerza naszą wiedzę wojskową, meteorologia wspomaga badania nad produkcją, a biologia — badania społeczne. Im więcej badań naukowych przeprowadzimy podczas podróży, tym większa będzie premia."
 curtiss.521.g: "Geografia."
 curtiss.521.h: "Meteorologia"
 curtiss.521.i: "Biologia"
 curtiss.522.t: "Wyprawa Zeppelinem rozpoczyna się!"
 curtiss.522.d: "Nasz sterowiec odcumował dziś od masztu cumowniczego i obrał kurs prosto ku obszarom polarnym."
 curtiss.522.f: "„Przygoda to po prostu skutek złego planowania”. — Roald Amundsen"
 curtiss.522.g: "Ruszajmy na mroźną północ! W imię Nauki!"
 curtiss.523.t: "Wyprawa Zeppelinem powraca"
 curtiss.523.d: "Nasza wyprawa zeppelinem na biegun północny zakończyła się pomyślnym powrotem, przynosząc wiele nowych odkryć naukowych."
 curtiss.523.f: "„Mogę powiedzieć, że najważniejsze jest to, jak wyprawa zostanie wyposażona, jak przewidzi się każdą trudność i jakie środki ostrożności zostaną podjęte, by jej sprostać lub jej uniknąć. Zwycięstwo czeka tego, kto ma wszystko w należytym porządku — ludzie nazywają to szczęściem. Klęska jest pewna dla tego, kto zaniedbał podjęcie na czas niezbędnych środków ostrożności — to nazywa się pechem”. — Roald Amundsen"
 curtiss.523.g: "Witajcie w domu, chłopcy."
 curtiss.524.t: "Katastrofa wyprawy"
 curtiss.524.d: "Ostatni błąd był prawdopodobnie o jeden za dużo: kontakt z naszą wyprawą zeppelinem się urwał. Spodziewamy się najgorszego."
 curtiss.524.f: "Wypadki podczas lotów zeppelinami na biegun północny nie należały niestety do rzadkości. W 1928 roku zeppelin Italia pod dowództwem Umberta Nobilego rozbił się na paku lodowym niecałe 30 kilometrów na północ od Ziemi Północno-Wschodniej, we wschodniej części Svalbardu. Spośród 16 członków załogi dziesięciu zostało wyrzuconych na lód, gdy gondola uległa rozbiciu. Pozostałych sześciu zostało uwięzionych w unoszącej się konstrukcji zeppelina, która po utracie gondoli wzbiła się ku niebu. Ich los nigdy nie został wyjaśniony. Jeden z dziesięciu mężczyzn na lodzie, Pomella, zginął wskutek uderzenia. Nobile doznał złamania ręki, nogi i żebra oraz urazu głowy. Cecioni doznał ciężkich złamań obu nóg, Malmgren poważnego urazu barku i prawdopodobnie uszkodzenia nerki, a Zappi miał kilka złamanych żeber. Po katastrofie kilka państw, w tym Związek Radziecki, Norwegia, Szwecja, Finlandia i Włochy, podjęło pierwszą w historii polarną akcję ratunkową z udziałem lotnictwa i jednostek morskich."
 curtiss.524.g: "Możemy tylko czekać i mieć nadzieję."
 curtiss.524.h: "Musimy za wszelką cenę nakłonić inne kraje do poszukiwań załogi!"
 curtiss.525.t: "Członkowie wyprawy nie żyją"
 curtiss.525.d: "Po wielu dniach mamy już pewność: misja zeppelina zakończyła się całkowitą klęską, a wszyscy jej uczestnicy nie żyją, w tym pilot [SCOPE.sCharacter('curtiss_expedition_leader').GetFullName]."
 curtiss.525.f: ""
 curtiss.525.g: "Zaginieni i zamarznięci w wiecznych lodach..."
 curtiss.526.t: "Dowódca wyprawy żyje!"
 curtiss.526.d: "Ku zaskoczeniu wszystkich pilot zeppelina [SCOPE.sCharacter('curtiss_expedition_leader').GetFullName] najwyraźniej zdołał wydostać się ze zniszczonego sterowca wraz z kilkoma innymi ocalałymi."
 curtiss.526.f: ""
 curtiss.526.g: "Co za ulga!"
 curtiss.527.t: "Przelot nad Biegunem Północnym"
 curtiss.527.d: "Załoga naszej wyprawy zeppelinem pod dowództwem [SCOPE.sCharacter('curtiss_expedition_leader').GetFullName] jako pierwsza przeleciała nad biegunem północnym."
 curtiss.527.f: "„To, że innym się nie udało, było głównym powodem, który skłonił mnie do podjęcia wyprawy na biegun północny. Byłem ambitnym człowiekiem. Pragnąłem czegoś nowego. Zbudowałem nowy typ sterowca, ale nie byłem zadowolony ze sposobu, w jaki wykorzystywali go piloci i oficerowie sił powietrznych. Chciałem sam nim latać, ponieważ wiedziałem, że potrafi znacznie więcej, niż sądzili”. — Umberto Nobile"
 curtiss.527.g: "Mam dla ciebie lód."
 curtiss.528.t: "Spotkanie z zeppelinem [ROOT.GetCountry.GetNameNoFormatting]"
 curtiss.528.d: "W Arktyce doszło do od dawna planowanego spotkania naszej wyprawy z luksusowym zeppelinem [ROOT.GetCountry.GetNameNoFormatting]. Obie załogi miały okazję do owocnej wymiany doświadczeń."
 curtiss.528.f: "W 1928 roku niemiecki rząd zgodził się udostępnić budowany sterowiec LZ 127 na potrzeby dwóch wypraw badawczych. Od dawna planowana podróż do Arktyki odbyła się ostatecznie w dniach od 24 do 31 lipca 1931 roku. Oprócz załogi na pokładzie znajdowało się 15 uczestników wyprawy. Zeppelin wyruszył z Friedrichshafen i przez Berlin oraz Leningrad dotarł do Ziemi Franciszka Józefa. W zatoce Tichaja u wybrzeży Wyspy Hookera spotkał się z radzieckim lodołamaczem Małygin. Wymieniono tam pocztę, z której przewozu dochód przeznaczono na sfinansowanie wyprawy. Po krótkim okrążeniu Ziemi Franciszka Józefa Eckener skierował sterowiec na wschód, ku nie w pełni jeszcze zmapowanej wyspie Komsomolec, a następnie leciał wzdłuż zachodniego wybrzeża Ziemi Północnej aż do przylądka Czeluskin. Trasa powrotna wiodła nad górami Byrranga na półwyspie Tajmyr ku Morzu Karskiemu i północnemu krańcowi Nowej Ziemi w pobliżu Diksonu. Lecąc wzdłuż południowo-wschodniego wybrzeża obu wysp Nowej Ziemi, a następnie nad Archangielskiem i Leningradem, zeppelin powrócił do Friedrichshafen, zatrzymując się ponownie w Berlinie. LZ 127 pokonał łącznie około 10,600 kilometrów. Podróż dowiodła, że sterowce doskonale nadają się do transportu i prowadzenia badań w Arktyce. Przyniosła również bogaty dorobek naukowy."
 curtiss.528.g: "Witaj, piękna damo."
 curtiss.531.t_geo: "Odkrycie przejścia wolnego od lodu"
 curtiss.531.t_meo: "Zorza Polarna"
 curtiss.531.t_bio: "Niedźwiedzie Polarne"
 curtiss.531.d_geo: "Podczas przelotu nad nieznanym dotąd regionem Arktyki badacze uczestniczący w wyprawie zeppelinem odkryli nowe przejście."
 curtiss.531.d_meo: "Badacze uczestniczący w wyprawie zeppelinem mieli okazję obserwować przez kilka nocy wyjątkowo intensywne zorze polarne."
 curtiss.531.d_bio: "Z pokładu sterowca badacze mogli przez wiele dni obserwować grupę niedźwiedzi polarnych i badać ich zachowanie."
 curtiss.531.f_geo: "W początkach eksploracji obszarów polarnych jednym z głównych celów było odkrywanie nowych szlaków, w tym otwarcie Przejścia Północno-Wschodniego i Przejścia Północno-Zachodniego. Choć obie trasy okazały się nieopłacalne z powodu lodu, mapy obszarów polarnych miały zachować swoją przydatność podczas kolejnych wypraw badawczych."
 curtiss.531.f_meo: "Zorze polarne powstają wskutek zaburzeń magnetosfery wywołanych przez wiatr słoneczny. Silne zaburzenia są skutkiem wzrostu prędkości wiatru słonecznego pochodzącego z dziur koronalnych oraz koronalnych wyrzutów masy. Zaburzenia te zmieniają tory ruchu naładowanych cząstek w plazmie magnetosferycznej. Zorze tworzą zmienne układy jaskrawych świateł, przybierające postać kurtyn, promieni, spiral lub migoczących rozbłysków obejmujących całe niebo."
 curtiss.531.f_bio: "Constantine John Phipps jako pierwszy opisał niedźwiedzia polarnego jako odrębny gatunek w 1774 roku, w relacji ze swojej wyprawy ku biegunowi północnemu z 1773 roku. Jest to największy współcześnie żyjący gatunek niedźwiedzia, a zarazem największy żyjący lądowy ssak drapieżny. Choć jest gatunkiem siostrzanym niedźwiedzia brunatnego, w toku ewolucji przystosował się do węższej niszy ekologicznej. Liczne cechy jego budowy umożliwiają mu życie w niskich temperaturach, poruszanie się po śniegu i lodzie oraz pływanie w otwartych wodach, a także polowanie na foki, które stanowią podstawę jego pożywienia. Choć większość niedźwiedzi polarnych rodzi się na lądzie, większą część życia spędzają na lodzie morskim."
 curtiss.531.g: "Wspaniale!"
 curtiss.531.h: "To majestatyczne zwierzę powinno trafić do [concept_dubois_zoo]!"
 curtiss.532.t_geo: "Nowe mapy"
 curtiss.532.t_meo: "Badania magnetyczne"
 curtiss.532.t_bio: "Narwal"
 curtiss.532.d_geo: "Kartografowie uczestniczący w wyprawie sterowcem na biegun północny opracowują nowe mapy Arktyki. Proszą o dodatkowy czas, aby móc kontynuować prowadzone badania."
 curtiss.532.d_meo: "Meteorolodzy na pokładzie trwającej wyprawy polarnej chcą dokładniej zbadać zjawisko magnetyczne występujące w jednym z regionów."
 curtiss.532.d_bio: "Badacze morscy na pokładzie polarnego zeppelina dostrzegli narwala. Planują poświęcić dwa dni na dokładniejsze zbadanie zachowania tego zwierzęcia."
 curtiss.532.f_geo: "Możliwość przelatywania zeppelinami nad rozległymi obszarami Arktyki stanowiła ogromną przewagę w porównaniu z wcześniejszymi wyprawami morskimi: nie istniało po prostu ryzyko, że statek utknie w lodzie. Rozległy widok z góry umożliwiał również zupełnie nowe sposoby wygodnego sporządzania map tego obszaru."
 curtiss.532.f_meo: "Wskutek ruchu płynnej materii w zewnętrznym jądrze Ziemi rzeczywiste bieguny magnetyczne nieustannie się przemieszczają. Jednak w perspektywie tysięcy lat ich uśredniony kierunek pokrywa się z osią obrotu Ziemi. Mniej więcej raz na pół miliona lat bieguny zamieniają się miejscami, choć odstępy między takimi zmianami mogą wynosić od 10 tysięcy do nawet 50 milionów lat. Chociaż biegun geomagnetyczny jest jedynie konstrukcją teoretyczną i nie można go bezpośrednio zlokalizować, prawdopodobnie ma większe znaczenie praktyczne niż biegun magnetyczny (inklinacyjny). Wynika to z faktu, że bieguny dostarczają wielu informacji na temat pola magnetycznego Ziemi, określając między innymi obszary, w których można obserwować zorze polarne."
 curtiss.532.f_bio: "Narwal, występujący głównie w wodach kanadyjskiej Arktyki, u wybrzeży Grenlandii i Rosji, jest wyjątkowo wyspecjalizowanym arktycznym drapieżnikiem. Zimą żywi się organizmami dennymi, głównie płastugami, pod grubą pokrywą zwartego lodu morskiego. Latem jego pokarm stanowią przede wszystkim dorsze arktyczne i halibuty grenlandzkie, a pozostałą część diety uzupełniają inne ryby, takie jak dorsze polarne. Najbardziej charakterystyczną cechą samca narwala jest pojedynczy, długi kieł, który w rzeczywistości jest zębem kłowym. Niektórzy średniowieczni Europejczycy wierzyli, że kły narwali to rogi pochodzące od legendarnego jednorożca."
 curtiss.532.g: "Powinniśmy zostać dłużej."
 curtiss.532.h: "Ryzykujemy zmianę pogody — lećmy dalej!"
 curtiss.533.t_geo: "Kartowanie Arktyki"
 curtiss.533.t_meo: "Stacja Meteorologiczna"
 curtiss.533.t_bio: "Poszukiwanie Skamielin"
 curtiss.533.d_geo: "Członkowie wyprawy zeppelinowej bardzo chcą zweryfikować swoje teorie i dokonać pomiarów w niektórych częściach Arktyki. Wymaga to jednak lądowania, które wiąże się z niemałym ryzykiem."
 curtiss.533.d_meo: "Meteorolodzy na pokładzie statku powietrznego zadeklarowali gotowość do założenia prowizorycznej stacji meteorologicznej w Arktyce, aby przeprowadzić badania naziemne. Wymaga to jednak wykonania manewru lądowania przez zeppelina."
 curtiss.533.d_bio: "Biolodzy na pokładzie polarnego zeppelina są przekonani, że w wiecznym lodzie mogą spoczywać skamieliny prehistorycznych zwierząt i roślin, i namawiają pilota do lądowania. Wiąże się to jednak z pewnymi niebezpieczeństwami."
 curtiss.533.f_geo: "Lądowania w regionach polarnych należały do rzadkości, ale nie były niemożliwe. W 1931 roku „Graf Zeppelin” dokonał niezwykłego wyczynu podczas wyprawy po Morzu Arktycznym. Wylądował na wodzie pomiędzy dryfującymi krami lodowymi. Ten nie całkiem bezpieczny manewr zakończył się pełnym sukcesem. Worek pocztowy zawierający 50 000 listów, opatrzonych specjalnym stemplem pocztowym zeppelina, przekazano radzieckiemu lodołamaczowi zakotwiczonemu w pobliżu. Zysk z tej dodatkowej działalności był znaczny. Wyniki badań geodezyjnych, meteorologicznych i geograficznych okazały się imponujące: „W ciągu 106 godzin lotu nad Arktyką statek powietrzny wykonał pracę, którą zwykłe wyprawy na lodołamaczach realizują dopiero w ciągu dwóch do trzech lat” — stwierdził kierownik naukowy ekspedycji badawczej, dyrektor Leningradzkiego Instytutu Arktycznego, profesor Samojłowicz."
 curtiss.533.f_meo: "Lądowania w regionach polarnych należały do rzadkości, ale nie były niemożliwe. W 1931 roku „Graf Zeppelin” dokonał niezwykłego wyczynu podczas wyprawy po Morzu Arktycznym. Wylądował na wodzie pomiędzy dryfującymi krami lodowymi. Ten nie całkiem bezpieczny manewr zakończył się pełnym sukcesem. Worek pocztowy zawierający 50 000 listów, opatrzonych specjalnym stemplem pocztowym zeppelina, przekazano radzieckiemu lodołamaczowi zakotwiczonemu w pobliżu. Zysk z tej dodatkowej działalności był znaczny. Wyniki badań geodezyjnych, meteorologicznych i geograficznych okazały się imponujące: „W ciągu 106 godzin lotu nad Arktyką statek powietrzny wykonał pracę, którą zwykłe wyprawy na lodołamaczach realizują dopiero w ciągu dwóch do trzech lat” — stwierdził kierownik naukowy ekspedycji badawczej, dyrektor Leningradzkiego Instytutu Arktycznego, profesor Samojłowicz."
