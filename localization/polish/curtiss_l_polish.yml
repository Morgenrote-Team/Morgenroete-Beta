 mr_seriously_injured_desc: "Ta postać odniosła poważne obrażenia i przez pewien czas będzie niedostępna."
 curtiss_recalled_pilot_tt: "Misja kończy się, jeśli [GetPlayer.MakeScope.Var('curtiss_pilot_var').GetCharacter.GetFullName] zostanie przedwcześnie wycofany z frontu."
 curtiss.300.t: "Pilot Przybywa na Front"
 curtiss.300.d: "[GetPlayer.MakeScope.Var('curtiss_pilot_var').GetCharacter.GetFullName] dotarł na front i dołączył do grupy bojowej [SCOPE.sCharacter('flying_circus_general').GetFullName]."
 curtiss.300.f: "Walka Powietrzna to bohaterskie i niebezpieczne zajęcie. Tylko zdrowi piloci mogą zdobywać doświadczenie. Dla niektórych doświadczenia wojenne mogą pozostawić trwały ślad – zarówno pozytywny, jak i negatywny."
 curtiss.300.g: "Niech [GetPlayer.MakeScope.Var('curtiss_pilot_var').GetCharacter.GetSheHe|U] wspiera go z powietrza!"
 curtiss.301.t: "Pilot Wraca z Frontu"
 curtiss.301.d: "[GetPlayer.MakeScope.Var('curtiss_pilot_var').GetCharacter.GetFullName] powrócił z działań bojowych i jest teraz ponownie w pełni do naszej dyspozycji."
 curtiss.301.f: "„To samo poczucie pewności siebie również ucierpiało: skoro można zestrzelić Baraccę, co ja mogę zrobić, aby nie podzielić jego losu? Jednocześnie ogarnęło nas pewnego rodzaju pocieszenie, którego się nie spodziewaliśmy: Baracca nie został zestrzelony przez wrogie myśliwce. Jego prestiż jako łowcy nie został podważony. Podobnie jak Zygfryda, mogło go pokonać jedynie podstępne uderzenie. Wróg nie mógł się chełpić takim zwycięstwem. A to miało dla nas największe znaczenie”. – Mario Fucini"
 curtiss.301.g: "Wolę, żeby nasi piloci wracali cali i zdrowi."
 curtiss.321.t: "Wrota Piekieł"
 curtiss.321.d: "[SCOPE.sCharacter('curtiss_bomber_general').GetFullName] zgodził się wykorzystać swoją eskadrę bombowców do zbombardowania znacznych obszarów stanu [SCOPE.sState('curtiss_bomber_state').GetName], tak aby istniejąca infrastruktura uległa poważnym zniszczeniom. Straty wśród ludności cywilnej byłyby przy tym stosunkowo wysokie."
 curtiss.321.f: "„Przede mną nie było żadnych rzeczy stworzonych,\nJedynie to, co wieczne, a ja trwam wiecznie.\nPorzućcie wszelką nadzieję, wy, którzy tu wchodzicie!” – Dante Alighieri"
 curtiss.321.g: "Zbombarduj Sektor, aż stanie się nie do poznania."
 curtiss.321.h: "Nawet Wojna ma swoje Granice."
 curtiss.322.t: "Groźne Potwory ze Stali"
 curtiss.322.d: "Zeppeliny uchodzą za nowoczesną i budzącą grozę broń w tej wojnie. Ukierunkowanie naszego kraju na te maszyny przynosi efekty: flota zeppelinów [SCOPE.sCharacter('curtiss_zeppelin_general').GetFullName] cieszy się tak złą sławą, że wróg drży na sam dźwięk jej nazwy!"
 curtiss.322.f: "Chociaż ataki zeppelinów powodowały stosunkowo niewielkie szkody, wywoływały nieproporcjonalnie duży strach i przerażenie wśród wojskowych i ludności cywilnej przeciwnika, a także angażowały ogromne zasoby, które były istotne dla prowadzenia działań wojennych. Aby zwalczać niemieckie sterowce wojskowe, Ententa, dysponująca około 15 000 żołnierzy i średnio około 25 sterowcami, musiała zapewnić broń, sprzęt i personel w proporcji wynoszącej niemal 1:33. Choć inne rodzaje sił zbrojnych, takie jak marynarka wojenna, również stosowały podobne strategie wiązania sił przeciwnika, skuteczność zeppelinów pozostawała niezrównana, nawet przez niemieckie okręty podwodne. Mimo to ataki zeppelinów nie zdołały ani trwale złamać morale zaatakowanych, ani poważnie utrudnić im prowadzenia działań wojennych."
 curtiss.322.g: "Jak coś tak pięknego może być tak niebezpieczne..."
 curtiss.323.t: "Zraniona Zdobycz"
 curtiss.323.d: "Eskadra [GetPlayer.MakeScope.Var('curtiss_pilot_var').GetCharacter.GetFullName] odparła atak powietrzny wroga i zadała mu ciężkie straty. Pilot chce teraz ruszyć w pościg za uciekającym przeciwnikiem, aby ostatecznie go dobić."
 curtiss.323.f: "„Wielu ówczesnych pilotów uważało, że pilot myśliwca w zamkniętej kabinie to niemożliwe rozwiązanie, ponieważ trzeba wyczuwać zapach wroga. Można go było wyczuć dzięki zapachowi spalanego przez niego oleju”. – Adolf Galland"
 curtiss.323.g: "Nie zostawaj w tyle!"
 curtiss.323.h: "To może być pułapka."
 curtiss.324.t: "Przejęto Wrogi Samolot"
 curtiss.324.d: "Podczas krótkiej operacji naszej armii na terytorium wroga udało się zdobyć prowizoryczne lotnisko. Wojska przejęły kilka samolotów."
 curtiss.324.f: ""
 curtiss.324.g: "Zbadaj ich maszyny latające!"
 curtiss.325.t: "Pojedynek na Niebie"
 curtiss.325.d: "Niebezpieczeństwo czai się na horyzoncie. [SCOPE.sCharacter('duel_participant_2').GetFullName], najbardziej osławiony pilot wroga, pojawił się wraz ze swoją eskadrą, aby zaatakować pozycje naszych wojsk. Czy [SCOPE.sCharacter('duel_participant_1').GetFullName] zdoła stawić mu czoła i zostać bohaterem przestworzy?"
 curtiss.325.f: "Szanse na zwycięstwo w pojedynku powietrznym zależą w dużej mierze od cech i doświadczenia obu pilotów."
 curtiss.325.g: "Atakuj!"
 curtiss.325.h: "Odwołaj Atak!"
 curtiss.325.i: "Wymanewruj!"
 curtiss.325.tt: "Jest to możliwe dzięki #YELLOW Cechy Akrobatycznej#! [GetPlayer.MakeScope.Var('curtiss_pilot_var').GetCharacter.GetFullName]."
 curtiss.326.t: "Inżynier Lotnictwa w Czasach Wojny"
 curtiss.326.d: "Nasz inżynier lotnictwa pomagał na froncie naprawiać uszkodzone samoloty i zastępować zniszczone maszyny nowymi. Dzięki temu [GetPlayer.MakeScope.GetVariable('tesla_engineer_var').GetCharacter.GetLastName] zdobył cenne doświadczenie na froncie."
 curtiss.326.f: "„Lotnictwo nie było ani gałęzią przemysłu, ani nauką. Było cudem”. – Igor Sikorsky"
 curtiss.326.g: "Istotna Pomoc"
 curtiss.327.t: "Specjalne Rozpoznanie Lotnicze"
 curtiss.327.d: "W śmiałym manewrze nasz pilot kontynuował lot nad sektorami wroga, wykonując liczne zdjęcia obozów przeciwnika oraz warunków geograficznych i infrastrukturalnych. Cenne prace rozpoznawcze [GetPlayer.MakeScope.Var('curtiss_pilot_var').GetCharacter.GetFullName] pomagają naszej armii znacznie szybciej przejmować terytorium wroga."
 curtiss.327.f: "„Na początku ludzie prawdopodobnie nie pokładali wielkich nadziei w sukcesach rozpoznania lotniczego, ale szybko przekonali się, że są w błędzie. Lotnisko znajduje się zawsze kilka kilometrów za polem bitwy, mniej więcej w pobliżu sztabu głównego. To właśnie na lotnisku otrzymujesz rozkazy. Następnie wznosisz się na wysokość około 1200 metrów nad pozycjami wroga. Niższy lot jest raczej niewskazany, ponieważ pociski francuskiej piechoty sięgają dość wysoko. Mam już kilka dziur od nich w skrzydłach. Przy takiej wysokości można całkiem dobrze obserwować teren, o ile pogoda jest w miarę dobra. Nasze dwupłatowce są bardzo szybkie (osiągają około 110 kilometrów na godzinę), dzięki czemu w krótkim czasie można pokonać całkiem spory dystans. Obserwator zapisuje następnie to, co zobaczył, a ty wracasz na lotnisko. Stamtąd raport jest przewożony samochodem do sztabu głównego”. – Anonimowy pilot, „Die Woche”, Berlin, 26 września 1914 roku"
 curtiss.327.g: "To będzie dla nas bardzo przydatne."
 curtiss.328.t: "Ranny Pilot"
 curtiss.328.d: "Po ostatniej bitwie powietrznej [GetPlayer.MakeScope.Var('curtiss_pilot_var').GetCharacter.GetFullName] musiał tymczasowo przerwać misję z powodu odniesionych ran. Lekarze odkryli następnie, że obrażenia były poważniejsze, niż początkowo sądzono. Nasz pilot przez pewien czas nie będzie mógł latać."
 curtiss.328.f: "Ranny pilot nie może wykonywać misji, a tym samym nie może zaliczać zestrzeleń ani zdobywać doświadczenia. Rany goją się w ciągu od jednego do trzech miesięcy."
 curtiss.328.g: "Czyli kilka tygodni w szpitalu..."
 curtiss.329.t: "Katastrofa Lotnicza!"
 curtiss.329.d: "Podczas ostatniej misji samolot [GetPlayer.MakeScope.Var('curtiss_pilot_var').GetCharacter.GetFullName] został trafiony i uległ poważnej katastrofie. Awaryjne lądowanie było twarde, ale odbyło się po naszej stronie frontu – ratownicy zdołali wydostać pilota z wraku żywego, jednak odniesione obrażenia są poważne."
 curtiss.329.f: "Ciężko ranni piloci będą wyłączeni ze służby przez co najmniej sześć miesięcy, a w najgorszym przypadku nawet przez cały rok. Istnieje również ryzyko, że rozwinie się u nich poważna trauma wojenna."
 curtiss.329.g: "Okropne!"
 curtiss.331.t: "Trauma Wojenna"
 curtiss.331.d: "[GetPlayer.MakeScope.Var('curtiss_pilot_var').GetCharacter.GetFullName] doszedł do siebie po poważnej katastrofie. Jednak nie tylko fizyczne rany pozostały. Od tamtej pory nasz pilot nie jest już sobą."
 curtiss.331.f: "„Wszyscy jesteście straconym pokoleniem”. – Ernest Hemingway"
 curtiss.331.g: "Niepokojące."
 curtiss.400.t: "Pokaz Lotniczy"
 curtiss.400.d: "Prawdziwa parada lotnicza obejmuje również pokaz lotniczy z widowiskowymi formacjami i manewrami. Te ryzykowne występy demonstrują kunszt lotniczy naszych sił zbrojnych i zachwycają publiczność. Czy [GetPlayer.MakeScope.Var('curtiss_pilot_var').GetCharacter.GetFullName] powinien spróbować śmiałego, ale bardziej efektownego manewru, czy też wybrać ostrożniejszy wariant ze standardowego repertuaru?"
 curtiss.400.f: "Pilot może zdobyć cechę Pilota Akrobacyjnego, wykonując znakomity manewr podczas pokazu lotniczego. Jednak w przypadku śmiałych manewrów występ może się również nie powieść i doprowadzić do katastrofalnego wypadku. Aby temu zapobiec, pilot powinien mieć odpowiednie doświadczenie oraz pozytywne cechy, takie jak Pilot Myśliwski, Weteran Pucharu Schneidera, Odważny lub Taktowny. Piloci Akrobacyjni zawsze wykonują znakomite manewry."
 curtiss.400.g: "Wykonaj Efektowny Manewr."
 curtiss.400.h: "Wykonaj Standardowy Manewr."
 curtiss.411.t: "Znakomity Pokaz Lotniczy"
 curtiss.411.d: "[GetPlayer.MakeScope.Var('curtiss_pilot_var').GetCharacter.GetFullName] wykonał zapierający dech w piersiach, a zarazem perfekcyjny manewr lotniczy podczas pokazu, zachwycając zarówno oficerów, jak i publiczność."
 curtiss.411.g: "Fantastyczny!"
 curtiss.412.t: "Udany Manewr"
 curtiss.412.d: "[GetPlayer.MakeScope.Var('curtiss_pilot_var').GetCharacter.GetFullName] zaprezentował wysoko oceniany manewr lotniczy podczas pokazu. Od absolutnej perfekcji dzieliło go zaledwie kilka drobnych szczegółów."
 curtiss.412.g: "Dobrze."
 curtiss.413.t: "Przeciętny Manewr"
 curtiss.413.d: "Pokaz lotniczy okazał się raczej nudnym wydarzeniem. [GetPlayer.MakeScope.Var('curtiss_pilot_var').GetCharacter.GetFullName] nie zdołał zachwycić publiczności swoim standardowym manewrem."
 curtiss.413.g: "Nic szczególnego..."
 curtiss.414.t: "Katastrofalny Manewr"
 curtiss.414.d: "Pokaz lotniczy zamienił się w prawdziwy koszmar: [GetPlayer.MakeScope.Var('curtiss_pilot_var').GetCharacter.GetFullName] stracił kontrolę nad samolotem podczas wykonywania ryzykownego manewru i rozbił się! Kilku widzów odniosło obrażenia, a pechowy pilot zginął podczas pokazu. Wydarzenie natychmiast odwołano."
 curtiss.414.g: "Katastrofa!"
 curtiss.411.f: "Pokaz lotniczy to wydarzenie plenerowe, podczas którego piloci prezentują swoje samoloty w locie. Często demonstrują widowiskowe manewry i techniki lotnicze, na przykład akrobacje powietrzne. Prezentują je zarówno indywidualnie, jak i w locie grupowym. W ten sposób demonstrują swoje umiejętności pilotażu oraz możliwości swoich maszyn. Szybko następujące po sobie manewry mają dostarczyć publiczności rozrywki i wywrzeć na niej wrażenie. Wiele manewrów prezentowanych przez pilotów wojskowych to standardowe manewry lotnicze stosowane w lotnictwie wojskowym. Piloci regularnie je ćwiczą, między innymi w ramach przygotowań do walk powietrznych. Pierwszym międzynarodowym pokazem lotniczym otwartym dla publiczności, podczas którego zaprezentowano i oblatano wiele różnych typów samolotów, był Grande Semaine d'Aviation de la Champagne, który odbył się w Reims w dniach od 22 do 29 sierpnia 1909 roku. Kolejny pokaz lotniczy odbył się we wrześniu tego samego roku w Brescii we Włoszech. W przeszłości podczas pokazów lotniczych i przygotowań do nich dochodziło do licznych, niekiedy bardzo poważnych wypadków. Sprzyjały im między innymi niewielkie odległości między samolotami, małe wysokości lotu oraz duże prędkości."
 curtiss.421.t: "Zespół Akrobacyjny"
 curtiss.421.d: "[SCOPE.sCharacter('curtiss_general_scope').GetFullName] jest nie tylko zdolnym dowódcą, ale także słynie ze swoich umiejętności pilotażu. Generał utworzył zespół akrobacyjny złożony z kilku oficerów, aby zaprezentować manewr w locie grupowym podczas parady lotniczej."
 curtiss.421.f: "Zespoły akrobacyjne to grupy pilotów, którzy opanowali sztukę akrobacji lotniczej i prezentują swoje umiejętności. Kilka statków powietrznych tworzy jednostkę zwaną eskadrą. Wiele zespołów akrobacyjnych stanowi jednostki sił powietrznych o sile eskadry. Anglia uchodzi za kolebkę akrobacji lotniczej. W latach 20. XX wieku doskonalono tam sztukę pilotażu, zarówno indywidualnego, jak i zespołowego. Właśnie w tym okresie zaczęto również organizować pierwsze publiczne pokazy na lotniskach, które już wtedy przyciągały tysiące widzów."
 curtiss.421.g: "Udany Pokaz"
 curtiss.422.t: "Nowy Prototyp na Paradzie Lotniczej"
 curtiss.422.d: "Z okazji odbywającej się parady lotniczej [SCOPE.sCharacter('gaudi_engineer_scope').GetFullName] zbudował prototyp nowego samolotu."
 curtiss.422.f: "Parady lotnicze służyły nie tylko do prezentowania akrobacji i demonstrowania potencjału militarnego sił powietrznych, ale także do ukazywania osiągnięć technologicznych i kunsztu inżynieryjnego."
 curtiss.422.g: "Inspiracje Lotnicze"
 curtiss.423.t: "[ROOT.GetCountry.GetCapital.GetCityHubName] podczas Parady Lotniczej"
 curtiss.424.t: "[ROOT.GetCountry.GetNameNoFormatting] na Paradzie Lotniczej"
 curtiss.423.d: "[GetPlayer.MakeScope.Var('curtiss_airline_tycoon_var').GetCharacter.GetFullName] pojawił się na paradzie lotniczej ze swoim ogromnym samolotem, wprawiając zgromadzonych widzów w zdumienie."
 curtiss.424.d: "Ogromny sterowiec wprawił widzów w zachwyt podczas parady lotniczej. Ludzie są zafascynowani tym, co można osiągnąć dzięki postępowi technicznemu i sile woli."
 curtiss.423.f: "Nie ma lepszego sposobu na przekonanie ludzi o potędze i wielkości kraju niż gigantyczny statek powietrzny."
 curtiss.423.g: "Leć, kochanie, leć!"
 curtiss.425.t: "Wpływanie na Masy"
 curtiss.425.d: "Parada lotnicza budzi w coraz większej liczbie ludzi niezwykłe uczucia. To połączenie fascynacji i strachu: z jednej strony statki powietrzne ukazują wielkość i potęgę naszego narodu, z drugiej zaś w ich pięknie kryje się utajone pragnienie zniszczenia. Czy panowanie w powietrzu jest przejawem wyższości człowieka?"
 curtiss.425.f: "„Aeronautyka otworzyła przed ludźmi nowy obszar działania – przestrzeń powietrzną. Tym samym nieuchronnie stworzyła nowe pole bitwy, ponieważ wszędzie tam, gdzie spotyka się dwóch ludzi, konflikt jest nieunikniony. W rzeczywistości aeronautykę wykorzystywano na szeroką skalę w działaniach wojennych na długo przed jej zastosowaniem do celów cywilnych. W chwili wybuchu wojny światowej ta nowa dziedzina nauki znajdowała się jeszcze w powijakach, lecz wojna nadała potężny impuls jej rozwojowi militarnemu”. – Giulio Douhet"
 curtiss.425.g: "W końcu jesteśmy wielkim krajem."
 curtiss.431.t: "Parada Lotnicza Dobiegła Końca"
 curtiss.431.d: "Parada lotnicza dobiegła końca. Wrażenia z tego wydarzenia jeszcze długo będą oddziaływać na ludzi, rozbudzając ducha żołnierzy, cywilów oraz obecnych i przyszłych pilotów, a także ukazując obcym państwom wielkość naszego narodu."
 curtiss.431.f: "„Miejmy nadzieję, że wkrótce odbędzie się kolejny pokaz lotniczy”"
 curtiss.431.g: "To było podniosłe wydarzenie."
 curtiss_airplane_speed_record_modifier: "Rekord Prędkości Samolotu"
 curtiss_testplane_cost_modifier: "Budowa Samolotu Testowego"
 je_curtiss_testplane_build: "Budowa Samolotu Testowego"
 je_curtiss_testplane_build_reason: "Możliwości samolotu testowego zależą przede wszystkim od doświadczenia inżyniera lotniczego oraz zbadanych technologii. Technologie mające kluczowy wpływ na możliwości samolotu to #O Nowoczesna Fizyka#!, #O Spawanie Łukowe#!, #O Wodnosamoloty#! oraz #O Nowoczesne Lotnictwo#!. Aby w pełni wykorzystać potencjał samolotu, potrzebujesz #V aktywnego pilota #!, którego doświadczenie również bezpośrednio wpływa na maksymalną prędkość."
 je_curtiss_testplane_build_goal: "Budowa nowego samolotu trwa około roku."
 notification_curtiss_speed_record_broken_notification_name: "[SCOPE.sCountry('curtiss_record_breaking_country').GetName] pobił nasz Rekord Prędkości!"
 notification_curtiss_speed_record_broken_notification_desc: "[SCOPE.sCountry('curtiss_record_breaking_country').MakeScope.GetVariable('curtiss_pilot_var').GetCharacter.GetFullName], pilot z kraju [SCOPE.sCountry('curtiss_record_breaking_country').GetName], pobił nasz Światowy Rekord Prędkości. Nowy Rekord wynosi [GetGlobalVariable('curtiss_airplane_speed_record_global_var').GetValue|V0] km/h."
 curtiss.60.t: "[SCOPE.sCharacter('curtiss_cook_scope').GetFullNameNoFormatting] & Syn"
 curtiss.60.d: "[SCOPE.sCharacter('curtiss_cook_scope').GetFullName] założył pierwsze w naszym kraju przedsiębiorstwo turystyczne, kładąc tym samym podwaliny pod rozwój miejscowej branży turystycznej. Dochody są niewielkie, ale im ciekawszy jest kraj, tym więcej gości może przyciągnąć."
 curtiss.60.f: "Turystyka zapewnia dodatkowe dochody narodom o wyższym poziomie kulturowym. Wyjątkowe zabytki, muzea i galerie sztuki, stanowiska archeologiczne, ośrodki sztuki, a także wysokie wartości w zakresie różnych tradycji kulturowych to czynniki, które sprawiają, że dany kraj staje się atrakcyjnym celem turystycznym. Prawa zwiększające swobodę przemieszczania się i prowadzenia działalności gospodarczej również przyczyniają się do wzrostu dochodów z turystyki. Infrastruktura także odgrywa kluczową rolę – w końcu do odległych miejsc nie da się dotrzeć bez odpowiednich połączeń. Szczególnie lotnisko rewolucjonizuje turystykę i zapewnia znaczny wzrost dochodów."
 curtiss.60.g: "Turyści płacą za Sztukę i Kulturę?"
 curtiss.700.t: "Nowy Samolot Testowy Gotowy!"
 curtiss.700.d: "Nasz inżynier, [ROOT.Var('tesla_engineer_var').GetCharacter.GetFullName], zakończył prace nad nowym samolotem testowym. Samolot otrzymał oznaczenie techniczne [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_testplane_letter_name')]-[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_testplane_first_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_testplane_second_number_name')]. [GetPlayer.MakeScope.Var('curtiss_pilot_var').GetCharacter.GetFullName] właśnie nadał mu nazwę [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_testplane_nick_name')]."
 curtiss.700.f: "#V Dane Samolotu #!\n\nNazwa: [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_testplane_letter_name')]-[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_testplane_first_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_testplane_second_number_name')] [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_testplane_nick_name')]\nTyp: [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_testplane_type')]\nCharakterystyka: [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_testplane_plane')]\nMateriał: [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_testplane_material')]\nSilnik: [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_testplane_engine')]\nPrzewidywana Prędkość: [ROOT.Var('test_airplane_speed_var').GetValue] km/h"
 curtiss.700.g: "Przygotuj Samolot do Startu!"
 curtiss.700.h: "To zbyt ryzykowne."
 curtiss.701.t: "Lot [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_testplane_nick_name')]"
 curtiss.701.d1: "Przy prędkości zaledwie #b #n [ROOT.Var('new_airplane_speed_var').GetValue]#! km/h#! [SCOPE.sCharacter('curtiss_pilot_scope').GetSheHe] ma za sobą nieudaną próbę pobicia dotychczasowego rekordu naszego kraju, wynoszącego #b #p [ROOT.Var('curtiss_airplane_speed_record_var').GetValue]#! km/h#!. To rozczarowujący dzień dla lotnictwa naszego kraju."
 curtiss.701.d2: "[ROOT.Var('curtiss_pilot_var').GetCharacter.GetFullName] ustanowił nowy rekord prędkości naszego kraju, lecąc samolotem [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_testplane_letter_name')]-[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_testplane_first_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_testplane_second_number_name')]! Z prędkością #b #p [ROOT.Var('new_airplane_speed_var').GetValue]#! km/h#! [SCOPE.sCharacter('curtiss_pilot_scope').GetSheHe] pobił dotychczasowy rekord naszego kraju, wynoszący #b #p [ROOT.Var('curtiss_airplane_speed_record_var').GetValue]#! km/h#!. Niestety, to wciąż za mało, by pobić rekord świata wynoszący #b #p [GetGlobalVariable('curtiss_airplane_speed_record_global_var').GetValue]#! km/h#! [GetGlobalVariable('curtiss_airplane_speed_record_holder_global_var').GetCountry.GetFlagTextIcon]."
 curtiss.701.d3: "Geniusz mechaniczny [ROOT.Var('tesla_engineer_var').GetCharacter.GetFullName] i niezwykłe umiejętności pilotażowe [ROOT.Var('curtiss_pilot_var').GetCharacter.GetFullName] zaowocowały przełomowym osiągnięciem: samolot [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_testplane_nick_name')] nie tylko pobił krajowy rekord prędkości wynoszący #b #p [ROOT.Var('curtiss_airplane_speed_record_var').GetValue] km/h#!, lecz także rekord świata wynoszący #b #p [GetGlobalVariable('curtiss_airplane_speed_record_global_var').GetValue]#! km/h, należący do [GetGlobalVariable('curtiss_airplane_speed_record_holder_global_var').GetCountry.GetFlagTextIcon]. Samolot osiągnął zawrotną prędkość #b #p [ROOT.Var('new_airplane_speed_var').GetValue]#! km/h#!. Dzięki temu [ROOT.GetCountry.GetName] jest obecnie uznawany za światowego lidera lotnictwa!"
 curtiss.701.f1: "„Chcę być zapamiętany tylko z jednego powodu: mojego wkładu w rozwój lotnictwa”. – Howard Hughes"
 curtiss.701.f2: "„Dokonuj niemożliwego, ponieważ niemal wszyscy mówili mi, że moje pomysły to jedynie fantazje”. – Howard Hughes"
 curtiss.701.f3: "„Jeśli popełniłem błąd w projekcie, to ja powinienem ponieść jego konsekwencje. Z pewnością nie poprosiłbym kogoś innego o pilotowanie samolotu, gdybym sam bał się nim polecieć”. – Howard Hughes"
 curtiss.701.g: "Czy zawinił Samolot, czy Pilot?"
 curtiss.701.h: "To było zadowalające, ale niewystarczające."
 curtiss.701.i: "Wspaniale! Gratulacje!"
 curtiss.702.t: "Lot Prędkościowy Kończy się Katastrofą"
 curtiss.702.d: "Próba pobicia rekordu prędkości kończy się tragedią. [ROOT.Var('curtiss_pilot_var').GetCharacter.GetFullName] stracił kontrolę nad samolotem [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_testplane_letter_name')]-[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_testplane_first_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_testplane_second_number_name')] podczas lotu prędkościowego! Samolot [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_testplane_nick_name')] pociągnął [SCOPE.sCharacter('curtiss_pilot_scope').GetHerHim] za sobą w płomienie. Cała załoga lotnicza jest w szoku."
 curtiss.702.f: "„Nie był złym człowiekiem. Złym pilotem – owszem, ale nie złym człowiekiem”."
 curtiss.702.g: "Nie. Nie! Nieeeee!"
 alert_curtiss_zeppelin_expedition_possible_alert_hint: "Nasz kraj może wysłać Wyprawę Zeppelinową na Biegun Północny. Aby wysłać Wyprawę, otwórz Przegląd Akademicki w #V Oknie Morgenröte#!."
