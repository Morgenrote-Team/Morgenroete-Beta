 curtiss_arctica_expedition_decision: "Wyprawa Zeppelinem na Biegun Północny"
 curtiss_arctica_expedition_decision_desc: "Aeroarctic, czyli „Międzynarodowe Towarzystwo Badań nad Arktyką z Wykorzystaniem Sterowców”, było pozarządowym stowarzyszeniem naukowym, którego celem było wykorzystanie sterowców w badaniach polarnych. Powstało głównie z inicjatywy aeronauty, a późniejszego sekretarza generalnego stowarzyszenia, Walthera Brunsa. Pierwszym prezesem, wybranym w 1924 roku, został Fridtjof Nansen. Po kilku latach przygotowań w 1931 roku organizacji udało się po raz pierwszy wykorzystać sterowiec do przeprowadzenia wyprawy polarnej o charakterze czysto naukowym. Dzięki arktycznemu lotowi LZ 127 Graf Zeppelin znacznie poszerzono wiedzę na temat geografii przemierzonych obszarów polarnych. Już w 1926 roku Umberto Nobile przeleciał nad Biegunem Północnym swoim sterowcem „Norge”, a później zorganizował kolejną wyprawę na pokładzie „Italii”."
