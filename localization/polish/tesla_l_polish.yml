 je_tesla_improve_power_plants_project_reason: "Twój [concept_tesla_electrical_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] pracuje nad modernizacją [GetBuildingType('building_power_plant').GetName] w [ROOT.GetCountry.GetName].\n$mr_divider_for_je$\nProjekt będzie zyskiwał Postęp każdego miesiąca. Za każdym razem, gdy Postęp osiągnie #V 24 Punkty#!, budynek otrzyma nowy modyfikator. Łącznie można uzyskać 3 modyfikatory. Zdobycie każdego kolejnego modyfikatora wymaga ponownego zapełnienia paska Postępu.\n$mr_divider_for_je$\nObecny Budynek: [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] w [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_tesla_improve_power_plants_project_modifier_1_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_tesla_improve_power_plants_project_modifier_2_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_tesla_improve_power_plants_project_modifier_3_type')]\n\nŁączna Liczba Pozostałych Budynków (z wyłączeniem obecnego): [JournalEntry.MakeScope.Var('mr_number_of_remaining_list_entries_var').GetValue|V0]\n\nObecny miesięczny Postęp: #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_electrical_research_progress_tt')] [GetPlayer.MakeScope.ScriptValue('tesla_monthly_electrical_engineering_progress_for_research_value')|+2] #!#!"
