 je_gaudi_magnetic_station_reason: "Korzystając z przyrządów i instrukcji otrzymanych z Getyngi, nasz inżynier zbuduje Obserwatorium Geomagnetyczne w ciągu najbliższych dwóch lat. Jest to przedsięwzięcie międzynarodowe: im więcej danych z różnych krajów będzie przesyłanych do Getyngi, tym szybciej tamtejsi uczeni będą mogli dokonywać nowych odkryć dotyczących pola magnetycznego Ziemi."
