 je_tesla_transpacific_cable_reason: "Budowa podmorskiego kabla telegraficznego przebiega w trzech etapach. W pierwszym poszukuje się dodatkowych inwestorów i rozpoczyna planowanie przedsięwzięcia. W drugim układany jest kabel. Trzeci obejmuje końcowe przygotowania do oddania go do użytku.\n\nO powodzeniu projektu decydują dwa kluczowe wskaźniki: #O Postęp Układania Kabla#! oraz #O Zaufanie Akcjonariuszy#!. Postęp określa, jak długo potrwa budowa, a umiejętności [concept_tesla_engineer] odgrywają tutaj kluczową rolę. Zaufanie zależy w dużej mierze od [concept_executive] przedsiębiorstwa. Jeśli spadnie do zera, projekt zostanie uznany za beznadziejny i skazany na niepowodzenie. Dlatego za wszelką cenę należy zapobiec całkowitej utracie zaufania.\n\nSamo ułożenie kabla na dnie morza nie gwarantuje sukcesu. Historycznie pierwsza próba uruchomienia kabla transatlantyckiego zakończyła się niepowodzeniem. Przedsiębiorstwo może jednak podnieść się po takiej porażce, jeśli zaufanie akcjonariuszy pozostanie wysokie. Wówczas zostanie ułożony nowy kabel. Jeśli pierwsza próba zakończy się niepowodzeniem, sukces drugiej będzie gwarantowany."
 je_engineer_dies_tt: "Wpis w Dzienniku zostanie unieważniony, jeśli [concept_tesla_engineer] umrze."
 tesla.3001.t: "Kabel przez Morze"
 tesla.3001.d: "[SCOPE.sCharacter('tesla_telegraph_boss_scope').GetFullName], dyrektor jednego z czołowych przedsiębiorstw telegraficznych, przedstawił ambitny plan: budowę podmorskiego kabla telegraficznego, który połączyłby odległe wybrzeża i zbliżył do siebie narody dzięki błyskawicznej komunikacji. Aby sfinansować to przedsięwzięcie, rozpoczęto sprzedaż akcji nowo utworzonej spółki zajmującej się układaniem kabli podmorskich. Chcąc okazać zaufanie do państwa, spółka oficjalnie zwróciła się do rządu z prośbą o udział w inwestycji, argumentując, że projekt służy zarówno interesom gospodarczym, jak i narodowym."
 tesla.3001.f: "Wszystko zaczyna się nie od statków czy linii telegraficznych, lecz od atramentu i zaufania. Podpisuje się umowy, drukuje prospekty emisyjne, a w salonach i na giełdach wygłasza przemówienia. Na razie kabel istnieje jedynie jako obietnica, której towarzyszy pytanie: kto zechce zainwestować w przyszłość? Dyrektor spółki mówi o jedności, wizji i postępie. Inni wskazują na ryzyko. Teraz państwo musi zdecydować, jaką rolę odegra w tym przedsięwzięciu, które ma połączyć odległe lądy siecią przewodów biegnących przez morskie głębiny."
 tesla.3001.g: "Państwo weźmie udział w tym przedsięwzięciu."
 tesla.3001.h: "Skoro spółka chce zbudować kabel, niech sama za niego zapłaci."
 tesla.3002.t: "Entuzjastyczni Inwestorzy"
 tesla.3002.d: "Grupa ambitnych przemysłowców i finansistów z [SCOPE.sState('tesla_fund_state').GetName] połączyła siły, aby wesprzeć przedsięwzięcie polegające na ułożeniu podmorskiego kabla telegraficznego. Ich inwestycja jest postrzegana jako strategiczne posunięcie, które ma zapewnić rozwój przyszłej infrastruktury komunikacyjnej i umożliwić wczesny dostęp do rynków transoceanicznych."
 tesla.3002.f: "Inwestorzy nie są filantropami ani wizjonerami w romantycznym znaczeniu tego słowa. Doskonale jednak rozumieją wartość informacji – to, jak szybko dociera do odbiorcy, jak bezpiecznie jest przekazywana i kto kontroluje jej przepływ. Łącząc swoje kapitały i inwestując w spółkę zajmującą się układaniem kabli podmorskich, stawiają na świat, w którym odległość będzie mierzona w milisekundach. Jedni dostrzegają w ich entuzjazmie oznakę postępu, inni zaś dowód na to, że nawet komunikacja stała się przedmiotem spekulacji. Tak czy inaczej, dzięki napływowi nowych funduszy przedsięwzięcie nabiera rozpędu."
 tesla.3002.g: "Inicjatywa godna pochwały!"
 tesla.3003.t: "Kabel o Politycznym Znaczeniu?"
 tesla.3003.d: "Kilku wpływowych członków [SCOPE.gsInterestGroup('tesla_fund_ig').GetName] publicznie zadeklarowało zamiar zainwestowania w przedsięwzięcie związane z budową kabla podmorskiego. Choć dotychczas nie byli związani z Towarzystwem Telegraficznym, ich poparcie wydaje się mieć zarówno podłoże ideologiczne, jak i strategiczne. Przedstawiają się jako orędownicy nowoczesności, a jednocześnie zyskują wpływ na kluczowe połączenie komunikacyjne."
 tesla.3003.f: "Na pierwszy rzut oka oferta wydaje się mile widzianym zastrzykiem kapitału i wyrazem politycznej przychylności. Jednak za inwestycją kryje się kwestia wpływów. Jeśli potężna partia opozycyjna zdobędzie udziały w kluczowej infrastrukturze, może to zmienić nie tylko układ sił na rynku, lecz także kierunek polityki państwa. Kontrola nad łącznością – nad tym, kto buduje sieci, kto je utrzymuje i kto za nie płaci – nigdy nie była wyłącznie sprawą techniczną. Niektórzy przedstawiciele spółki ostrzegają, że jeśli teraz otworzymy im drzwi, później może być trudno je zamknąć."
 tesla.3003.g: "To zwiększy zaufanie do projektu."
 tesla.3003.h: "To wesprze pracę naszego inżyniera."
 tesla.3003.i: "Ta grupa interesu jest zdecydowanie zbyt potężna"
 tesla.3004.t: "Niechętni Inwestorzy"
 tesla.3004.d: "Kapitaliści w [SCOPE.sState('tesla_fund_state').GetName] wykazują niewielkie zainteresowanie projektem budowy kabla podmorskiego. Choć nie są mu otwarcie przeciwni, mają poważne wątpliwości co do jego rentowności i długoterminowych perspektyw. Niektórzy członkowie zarządu proponują rozpoczęcie kampanii promocyjnej, która rozwiałaby obawy miejscowych elit finansowych. Wymagałoby to jednak przesunięcia części środków przeznaczonych na realizację samego projektu."
 tesla.3004.f: "Mówią o ryzyku inwestycyjnym, kosztach utraconych możliwości i niepewności technologicznej. Dla nich kabel nie jest cudem techniki, lecz ryzykownym przedsięwzięciem o niepewnych zyskach. Dopóki nie zobaczą przekonujących dowodów na jego powodzenie, wolą poczekać lub całkowicie zrezygnować z udziału. Jednak pieniądze niosą ze sobą wpływy, a brak ich zaangażowania może podważyć wiarygodność projektu. Starannie przygotowana kampania informacyjna mogłaby ich przekonać, lecz każda moneta wydana na perswazję oznacza mniej środków na stal, kable i statki."
 tesla.3004.g: "Niech ta okazja przejdzie im koło nosa. My i tak działamy dalej."
 tesla.3004.h: "Przeznacz część funduszy projektu na kampanię promocyjną!"
 tesla.3005.t: "Przemysłowcy Udzielają Poparcia"
 tesla.3005.d: "Dzięki osobistym staraniom dyrektora przedsiębiorstwa telegraficznego oraz jego wieloletnim kontaktom w rządzie wpływowe stronnictwo przemysłowców postanowiło poprzeć inicjatywę budowy kabla podmorskiego. Ich pozycja polityczna pozwala im skierować na realizację projektu zarówno prywatny kapitał, jak i zaufanie społeczne, nadając całemu przedsięwzięciu nowy impuls."
 tesla.3005.f: "Sukces w interesach często zależy nie tylko od planów i wyliczeń, lecz także od zaufania. Gdy odpowiedni ludzie podają sobie ręce, nawet najbardziej nieufni inwestorzy zaczynają inaczej patrzeć na bilanse finansowe. Dzięki poparciu przemysłowców projekt budowy kabla zyskuje potężnego sojusznika, dysponującego środkami i wpływami, by go finansować, chronić i promować. Niektórzy mogą krytykować zacieranie się granic między interesem publicznym a prywatnym, lecz niewielu kwestionuje osiągnięte rezultaty."
 tesla.3005.g: "Dziękujemy, [SCOPE.sCharacter('tesla_telegraph_boss_scope').GetFullName]!"
 tesla.3006.t: "Nerwowi akcjonariusze"
 tesla.3006.d: "W [SCOPE.sState('tesla_fund_state').GetName] grupa miejscowych akcjonariuszy jest coraz bardziej zaniepokojona powolnymi postępami i rosnącymi kosztami projektu budowy kabla podmorskiego. Obawiając się długoterminowych strat, rozważają sprzedaż swoich udziałów. Zarząd spółki sugeruje, że częściowy wykup akcji przez państwo mógłby przywrócić zaufanie inwestorów. Taki krok może jednak stworzyć precedens i rozbudzić podobne oczekiwania w przyszłości."
 tesla.3006.f: "To, co zaczęło się od szeptów w sali zarządu, przerodziło się w głośne żądania wycofania się z inwestycji. Inwestorzy wskazują na opóźnienia w realizacji projektu, nieprzewidziane koszty prac inżynieryjnych i niepewne zyski. Jedni dostrzegają w tym panikę, inni zaś uzasadnioną ostrożność. Jeśli akcjonariusze wycofają się teraz, zaufanie do przedsięwzięcia może załamać się również w innych regionach. Jeśli jednak państwo wkroczy jako nabywca ostatniej szansy, może uspokoić rynki, ale za cenę uwikłania się w sprawy spółki."
 tesla.3006.g: "Ustabilizuj rynek – wykup akcje za pośrednictwem państwa."
 tesla.3006.h: "Jeśli brakuje im wizji, mogą się wycofać."
 tesla.3007.t: "Przełom Inżynieryjny"
 tesla.3007.d: "Główny inżynier projektu budowy kabla przedstawił poprawione plany, które rozwiewają kilka najważniejszych wątpliwości technicznych. Ustalenia [ROOT.Var('tesla_engineer_var').GetCharacter.GetFullName] szczegółowo opisują udoskonalenia metod układania kabla, trwałości izolacji oraz stabilności sygnału. Zarząd spółki jednogłośnie poparł nowe rozwiązania, uznając je za znaczący krok naprzód."
 tesla.3007.f: "Schematy techniczne zostały opracowane z niezwykłą starannością. Uwzględniono każdy odcinek kabla, każdą stację przekaźnikową i wszelkie ograniczenia napięcia. To, co niegdyś wydawało się odległą i niepewną wizją, zaczyna teraz nabierać kształtów sprawnie działającego systemu. Inwestorzy, którzy wcześniej zaczynali tracić wiarę w przedsięwzięcie, znów mówią o długoterminowej strategii i trwałym dziedzictwie infrastrukturalnym. Gdy ambitna wizja idzie w parze z solidną wiedzą inżynieryjną, zaufanie zwykle przychodzi samo."
 tesla.3007.g: "Cudowne wieści!"
 tesla.3007.h: "To uspokoi akcjonariuszy."
 tesla.3011.t: "Wypłynięcie Statku do Układania Kabli Podmorskich"
 tesla.3011.d: "Statek przeznaczony do układania kabli podmorskich opuścił port, co oznacza przejście od etapu planowania do realizacji przedsięwzięcia. Na jego pokładzie znajdują się precyzyjne przyrządy pomiarowe, izolowany przewód oraz niezbędne zapasy. W rejs wyruszył również główny inżynier projektu, [ROOT.Var('tesla_engineer_var').GetCharacter.GetFullName], który osobiście nadzoruje prace techniczne. Teraz, gdy statek wypłynął w morze, powodzenie całego przedsięwzięcia zależy od starannego prowadzenia prac na przestrzeni tysięcy kilometrów otwartego oceanu."
 tesla.3011.f: "Nie było żadnej uroczystej ceremonii – jedynie powolne naprężanie lin i odgłos obracającej się śruby napędowej, gdy statek ostrożnie wpływał do kanału. Dla [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] była to chwila skupienia, a nie świętowania. Ponownie sprawdzano schematy, weryfikowano dopuszczalne odchylenia, a na wilgotnych drewnianych stołach rozkładano mapy morskie. Ciężar stali i wielkich ambicji spoczywa teraz na statku oddalającym się od brzegu. To, co dotąd istniało jedynie na papierze i w przemówieniach, stało się rzeczywistością – zwinięte w zwoje, załadowane na pokład i opuszczane w morskie głębiny."
 tesla.3011.g: "Bon voyage!"
 tesla.3012.t: "Pasażer na Gapę pod Pokładem"
 tesla.3012.d: "Kilka dni po rozpoczęciu wyprawy mającej na celu ułożenie kabla podmorskiego załoga odkrywa młodego mężczyznę ukrywającego się w dolnych pomieszczeniach magazynowych statku. Przedstawia się jako student historii naturalnej i twierdzi, że zakradł się na pokład, aby badać faunę głębinową. Nie było go bowiem stać na sfinansowanie takich badań oficjalną drogą. Podczas gdy niektórzy oficerowie uznają jego obecność za przejaw naiwnej ciekawości, inni podejrzewają go o szpiegostwo na rzecz zagranicznego konkurenta."
 tesla.3012.f: "Młodzieniec mówi rzeczowo i spokojnie, wymieniając nazwy gatunków, przywołując warstwy geologiczne oraz nerwowo powołując się na książki i wykłady. Jednak na statku, gdzie bezpieczeństwo ma najwyższe znaczenie, a najmniejsze zakłócenie może okazać się tragiczne w skutkach, podejrzenia rozprzestrzeniają się błyskawicznie. Krążą pogłoski, że wcale nie jest studentem, lecz agentem wysłanym, by sabotować wyprawę. Kapitan staje teraz przed trudnym wyborem. Wyrzucenie młodzieńca za burtę szybko zakończyłoby sprawę. Pozostawienie go na pokładzie grozi natomiast opóźnieniami, podziałami wśród załogi, a nawet czymś znacznie gorszym."
 tesla.3012.g: "Pozwól mu pozostać na pokładzie pod ścisłym nadzorem."
 tesla.3012.h: "Pozbądź się problemu. Za burtę."
 tesla.3013.t: "Dodatkowy Pasażer z Wykopalisk"
 tesla.3013.d: "Tuż przed wypłynięciem wyprawy mającej na celu ułożenie kabla podmorskiego z Suezu młody asystent europejskiej ekipy archeologicznej prosi o możliwość wejścia na pokład. Jego praca przy wykopaliskach w Delcie Nilu dobiegła końca, a teraz pragnie dostać się do Bombaju, gdzie zamierza kontynuować badania nad architekturą porównawczą świątyń i starożytnymi szlakami handlowymi. Posiada list polecający i oferuje pomoc przy katalogowaniu znalezisk lub tłumaczeniu tekstów, jeśli zajdzie taka potrzeba."
 tesla.3013.f: "Jego ubranie pokrywa kurz, po arabsku mówi płynnie, a notes ma pełen szkiców kolumn, kartuszy i posągów nadgryzionych zębem czasu. O Totmesie i Aśoce opowiada jednym tchem, przekonany, że przeszłość wciąż żyje w architekturze budowli i przebiegu dróg. Oficerowie uznają go za nieszkodliwego, choć nieco gadatliwego. Dr. [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] nazywa go „zbieraczem ech przeszłości”. Ostatecznie ktoś wyraża zgodę na jego podróż – być może z ciekawości, a może ze współczucia dla tych, którzy wśród ruin poszukują sensu."
 tesla.3013.g: "Pozwól mu wejść na pokład. Niech historia wyruszy razem z nami."
 tesla.3013.h: "Odmów. Ten statek służy do układania kabli, a nie zaspokajania ciekawości."
 tesla.3014.t: "Uczony z Pacyfiku"
 tesla.3014.d: "Krótko przed wypłynięciem młody etnolog poprosił o możliwość wejścia na pokład statku przeznaczonego do układania kabli podmorskich, który ma przemierzyć Pacyfik. Jego celem jest zbadanie struktur społecznych, tradycji ustnych oraz praktyk religijnych społeczności zamieszkujących wyspy Polinezji, które statek napotka na swojej trasie. Młodzieniec dysponuje materiałami źródłowymi, notatkami językowymi oraz listem polecającym z zagranicznego uniwersytetu, popierającego jego badania terenowe."
 tesla.3014.f: "Przedstawia się łagodnym głosem, trzymając podniszczony notes pełen rodowodów i tradycyjnych pieśni. Niewiele pyta o mechanizmy statku, za to żywo interesuje się postojami na wyspach wzdłuż trasy. Dla jednych jest nieszkodliwym ekscentrykiem, dla innych pełnym szacunku obserwatorem tego, czego nie zdołała jeszcze zatrzeć nowoczesność. Kapitan przydziela mu koję pod warunkiem, że pozostanie zwykłym pasażerem i nie będzie wtrącał się w sprawy związane z układaniem kabli."
 tesla.3014.g: "Wpuść go na pokład. Kultura rozprzestrzenia się inaczej niż prąd elektryczny."
 tesla.3014.h: "To nie jest statek wycieczkowy!"
 tesla_cable_student_gains_experience_tt: "[ROOT.Var('rapanui_adventurer_var').GetCharacter.GetFullName] zdobywa doświadczenie, zyskując szansę na zostanie [concept_academics_academic] po zakończeniu misji układania kabla."
 tesla.3021.t: "Kabel się zerwał!"
 tesla.3021.d: "Podczas układania doszło do zerwania głównego kabla. Awaria nastąpiła kilkaset mil morskich od brzegu, prawdopodobnie wskutek nadmiernego naprężenia, nierówności dna morskiego lub wady produkcyjnej."
 tesla.3021.f: "Zaczęło się od zakłóceń sygnału – najpierw pojawiło się opóźnienie, a potem zapadła cisza. Gdy załoga uruchomiła wyciągarkę i wciągnęła kabel na pokład, potwierdziły się najgorsze obawy: poszarpana izolacja i postrzępione miedziane przewody. Gdzieś na dnie oceanu połączenie zostało przerwane."
 tesla.3021.g: "Teraz nadeszła chwila próby dla Dr. [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName]!"
 tesla.3022.t: "Kabel Naprawiony"
 tesla.3022.d: "Dr. [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] dokonał cudu, naprawiając kabel na pełnym morzu."
 tesla.3022.f: "Dzięki kawałkowi sznurka, złamanemu ołówkowi i gumie do żucia nasz inżynier po mistrzowsku naprawił kabel podmorski, udowadniając wszystkim niedowiarkom, że się mylili."
 tesla.3022.g: "Dzięki Bogu za Dr. [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName]!"
 tesla.3023.t: "Kabla nie udało się naprawić..."
 tesla.3023.d: "Pomimo wszelkich starań Dr. [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] nie zdołał uratować kabla podmorskiego."
 tesla.3023.f: "Inżynierowie na pokładzie spierają się teraz o dopuszczalne naprężenia i miejsca łączenia kabla. Inwestorzy w kraju dyskutują o odpowiedzialności za straty. Zarząd spółki zastanawia się natomiast, ile prawdy należy ujawnić opinii publicznej."
 tesla.3023.g: "Wydobądź uszkodzony odcinek kabla i napraw go, bez względu na koszty."
 tesla.3023.h: "Omiń uszkodzony odcinek i kontynuuj prace – zaakceptuj pewne straty sygnału."
 tesla.3024.t: "Nadciąga Front Burzowy"
 tesla.3024.d: "Ciśnienie atmosferyczne gwałtownie spadło, a na horyzoncie gromadzą się ciemne chmury. Załoga donosi, że w kierunku obecnej pozycji statku zbliża się front burzowy. Prace nad układaniem kabla są w pełnym toku, więc ich przerwanie opóźniłoby realizację projektu. Kontynuowanie prac może jednak narazić kabel na uszkodzenie lub utratę."
 tesla.3024.f: "Wiatr wzmaga się, uderzając nierównymi porywami, a horyzont znika za ołowianoszarymi chmurami. Deszcz jeszcze nie zaczął padać, ale morze już kołysze się niespokojnie pod stopami. Kapitan analizuje mapy morskie, a inżynier sprawdza odczyty naprężenia kabla. Przedstawiciele zarządu rozważają, jak opóźnienie wpłynie na wizerunek spółki i czy warto ryzykować katastrofę. Z burzą, w przeciwieństwie do rynku, nie da się negocjować. Decyzja musi zapaść – i to natychmiast."
 tesla.3024.g: "Kontynuuj prace mimo burzy. Nie możemy sobie pozwolić na opóźnienia."
 tesla.3024.h: "Wstrzymaj prace i powróć na bezpieczniejsze wody."
 tesla.3025.t: "Nieoczekiwane Warunki na Dnie Morskim"
 tesla.3025.d: "Załoga donosi, że trasa układania kabla przebiega przez niezbadaną dotąd głębinową rozpadlinę, co znacznie zwiększa naprężenie kabla. Dr. [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] nie jest pewien, czy kabel wytrzyma dodatkowe obciążenie. Można zmienić trasę, ale wiązałoby się to z kosztownym objazdem."
 tesla.3025.f: "Dno morskie, które w teorii zostało już dokładnie zbadane i naniesione na mapy, w praktyce okazało się nieprzewidywalne. Mapy batymetryczne są nieaktualne lub błędne, a teren, który na papierze wydawał się stabilny, w rzeczywistości kryje poważne zagrożenia. Głębokość rozpadliny gwałtownie wzrasta, zmuszając kabel do opadania wzdłuż niebezpiecznie ukształtowanego dna. Z każdą kolejną milą morską inżynierowie muszą rozważać ryzyko i koszty. Zmiana trasy może ocalić kabel, ale z pewnością nie budżet."
 tesla.3025.g: "Kontynuujcie zgodnie z planem. Akceptujemy ryzyko."
 tesla.3025.h: "Zmień trasę, aby ominąć rozpadlinę."
 tesla.3026.t: "Awaria Kabla"
 tesla.3026.d: "Jeden z pracowników zginął podczas obsługi wadliwie działającego bębna kablowego. Wypadek wstrząsnął załogą i wzbudził obawy dotyczące przestrzegania zasad bezpieczeństwa. Choć była to nieszczęśliwa tragedia, prasa w kraju już donosi o śmierci pracownika."
 tesla.3026.f: "Bęben nagle zaczął się obracać i w ciągu kilku sekund było po wszystkim – pracownik został zmiażdżony przez pętlę żelaznego kabla, wprawionego w ruch z ogromną siłą. Nie było czasu na reakcję. Jego śmierć pozostawiła po sobie nie tylko ciszę, lecz także strach. Morze nie wybacza błędów. Być może opinia publiczna również ich nie wybaczy."
 tesla.3026.g: "Publicznie potwierdź zobowiązanie do zapewnienia bezpieczeństwa. Ogłoś nowe procedury."
 tesla.3026.h: "Skup się na kontynuowaniu misji."
 tesla.3027.t: "Epidemia wśród członków załogi"
 tesla.3027.d: "Kilku marynarzy zachorowało, wykazując objawy gorączki i osłabienia. Zapasy środków medycznych są ograniczone, a przyczyna choroby pozostaje nieznana. Wśród chorych znajduje się również Dr. [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName]."
 tesla.3027.f: "Prace zwalniają. Rozmowy stają się coraz cichsze. Kaszel jednego z techników rozbrzmiewa głośniej niż szum wyciągarki. Wobec braku odpowiedzi strach rozprzestrzenia się niczym zaraza. Ocean może oddzielać od siebie narody, ale nie zapewnia ochrony przed epidemią."
 tesla.3027.g: "Tymczasowo wstrzymaj prace do czasu wyzdrowienia chorych."
 tesla.3028.t: "Podejrzana Działalność pod Pokładem"
 tesla.3028.d: "[ROOT.Var('rapanui_adventurer_var').GetCharacter.GetFullName] został przyłapany późną nocą na manipulowaniu przy czułej aparaturze pomiarowej. Twierdzi, że kierowała nim jedynie ciekawość, i zaprzecza, jakoby zrobił coś niewłaściwego, ale oficerowie nie dają mu wiary. Nie można wykluczyć próby sabotażu."
 tesla.3028.f: "Przyłapany na gorącym uczynku, potrafił jedynie nieudolnie się tłumaczyć: „Sprawdzałem tylko odczyty”, „Chciałem się upewnić, że wszystko działa”. Nikt nie przypomina sobie, by udzielono mu pozwolenia na wejście do strefy o ograniczonym dostępie. Teraz inżynierowie szepczą o sabotażu. Kabel może ciągnąć się przez całe oceany, ale do zdrady wystarczy zaledwie kilka metrów przewodu."
 tesla.3028.g: "Tym razem nam się nie wymkniesz!"
 tesla.3028.h: "On jest niewinny."
 tesla.3029.t: "Niewłaściwy Człowiek"
 tesla.3029.d: "Pojawiły się nowe dowody wskazujące na to, że zwolniony członek załogi wcale nie zamierzał sabotować wyprawy mającej na celu ułożenie kabla podmorskiego. Zagubione zlecenie konserwacji, odnalezione wśród sterty nieuporządkowanych dokumentów, potwierdza, że rzeczywiście przydzielono mu zadanie sprawdzenia wspomnianego sprzętu. Incydent, który próbowano po cichu załatwić na morzu, wyszedł od tamtej pory na jaw za sprawą krytycznych doniesień prasowych."
 tesla.3029.f: "Gazety piszą teraz o tym, o czym załoga dotąd mówiła jedynie szeptem: człowieka usunięto ze statku bez procesu, na podstawie błędnych podejrzeń i brakującej dokumentacji. Choć nowe dowody oczyszczają go z zarzutów, szkody już zostały wyrządzone – ucierpiał nie tylko on sam, lecz także reputacja całego przedsięwzięcia. Inwestorzy zaczynają się zastanawiać, czy wyprawą kieruje dyscyplina, czy raczej panika."
 tesla.3029.g: "Och... eee... Chyba nic mu nie jest?"
 tesla.3030.t: "Sprawny Przebieg Prac na Trudnych Wodach"
 tesla.3030.d: "Szczególnie trudny odcinek trasy kabla, który według wcześniejszych przewidywań wymagał specjalnych rozwiązań, udało się ułożyć bez żadnych opóźnień ani komplikacji. Sprawność i przygotowanie zespołu przerosły wszelkie oczekiwania."
 tesla.3030.f: "Spodziewano się, że dno oceanu na tym odcinku będzie wyjątkowo nierówne, jednak staranne przygotowania i spokojna pogoda pozwoliły na niezakłócony przebieg prac. Załoga pracowała niemal w całkowitej ciszy, a kabel rozwijał się niczym nić ze szpuli. Inżynierowie wymieniali krótkie, pełne satysfakcji skinienia głową i tym razem nie trzeba było wprowadzać żadnych poprawek. Jak zauważył z przekąsem jeden z oficerów, był to „ten rodzaj sukcesu bez niespodzianek, o który zawsze się modlimy, ale którego rzadko doświadczamy”. Wraz ze wzrostem ciśnienia atmosferycznego rośnie również pewność siebie załogi."
 tesla.3030.g: "Świetnie!"
 tesla.3031.t: "Wieloryby i Delfiny"
 tesla.3031.d: "Gdy wieloryby i delfiny przecinają trasę statku, załodze ukazuje się niezwykły spektakl natury. [SCOPE.sCharacter('rapanui_adventurer_var').GetFullName] liczy, że ich obserwacja dostarczy nowych odkryć biologicznych, jednak załoga nie wykazuje większego zainteresowania tego rodzaju naukową dociekliwością."
 tesla.3031.f: "Na pokładzie wybucha kłótnia, gdy student zaczyna również potępiać okrutne metody polowań, podczas których zabija się te urzekające morskie stworzenia. Dla większości marynarzy, którzy postrzegają wieloryby jedynie jako pływające zbiorniki tłuszczu, jego wykład jest dodatkowo irytujący."
 tesla.3031.g: "Zbadajcie te niesamowite istoty."
 tesla.3031.h: "Nie mamy na to czasu."
 tesla.3032.t: "Ależ Mnóstwo Ryb!"
 tesla.3032.d: "[SCOPE.sCharacter('rapanui_adventurer_var').GetFullName] nie może uwierzyć w [SCOPE.sCharacter('rapanui_adventurer_var').GetHerHis] szczęście, gdy [SCOPE.sCharacter('rapanui_adventurer_var').GetSheHe] dostrzega na północnym Atlantyku ławice ryb należących do nieznanych dotąd gatunków. Student prosi kapitana o wstrzymanie prac i złowienie kilku okazów. Dr. [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] przypomina jednak, że jest to statek do układania kabli podmorskich, a nie jednostka badawcza."
 tesla.3032.f: "„No uwierzcie mi! Przepuszczamy okazję do przeprowadzenia badań naukowych! Te delikatne rybki należą do zupełnie nieodkrytego gatunku. Nie widzieliście tego? Jak to, mogę już teraz wskoczyć do wody i popływać razem z nimi?!”"
 tesla.3032.g: "Złów kilka ryb."
 tesla.3033.t: "Eksperymenty na Oceanie Atlantyckim"
 tesla.3033.d: "Dr. [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] wykorzystał czas spędzony na morzu, aby przygotować część swoich przyrządów do prowadzenia badań naukowych na pokładzie statku układającego kable podmorskie. Nie zdecydował jeszcze, na czym skupi swoje badania."
 tesla.3033.atlantic: "„W oceanie płynie rzeka. Nawet podczas największych susz nigdy nie wysycha, a podczas najpotężniejszych powodzi nigdy nie występuje z brzegów. Jej brzegi i dno tworzy zimna woda, podczas gdy jej nurt jest ciepły. Jej źródłem jest Zatoka Meksykańska, a ujściem Morze Arktyczne. To Prąd Zatokowy”. -Matthew Fontaine Maury"
 tesla.3033.indian: "„Choć Ocean Indyjski obfituje w drogocenne i rzadkie klejnoty, nie może poszczycić się czystszym niebem ani spokojniejszym morzem. Jeśli istnieje wybrzeże, które nie lęka się gniewu zdradliwych fal, musi to być jakaś uboga, wąska zatoczka, do której nie docierają nawet wiatry”. -Pietro Metastasio"
 tesla.3033.pacific: "„Pacyfik jest moim rodzinnym oceanem. Poznałem go jako pierwszy, dorastałem na jego brzegu i zbierałem morskie stworzenia wzdłuż wybrzeża. Znam jego nastroje, barwy i naturę”. -John Steinbeck"
 tesla.3033.g: "Skup się na eksperymentach magnetycznych."
 tesla.3033.h: "Skup się na eksperymentach oceanograficznych."
 tesla.3034.t: "Tajemnica w głębinach"
 tesla.3034.d: "Dr. [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] dokonuje niezwykłego odkrycia podczas analizy danych pomiarowych. W pewnej części Atlantyku dno oceaniczne wznosi się na niespotykaną wysokość. Jak dotąd [SCOPE.sCharacter('tesla_engineer_var').GetSheHe] ma jedynie teorię wyjaśniającą to zjawisko."
 tesla.3034.f: "Dotychczas sądzono, że morza powinny być szczególnie głębokie w swojej środkowej części. Dzisiejsze odkrycie wywraca jednak to przekonanie do góry nogami. Zamiast rekordowej głębokości zaobserwowano zmniejszającą się odległość między dnem a powierzchnią wody. To dobra wiadomość dla spółki, ponieważ oznacza, że potrzeba mniej kabla, niż początkowo zakładano. Dla Dr. [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] jest jednak jasne, że odkrycie to wymaga zrewidowania wszystkich dotychczasowych poglądów na temat oceanicznych głębin. Najwyraźniej na dnie oceanu znajdują się wzgórza i doliny. A to wzniesienie jest czymś znacznie większym niż zwykłe wzgórze."
 tesla.3034.g: "Czy tam jest podwodne pasmo górskie?"
 tesla.3035.t: "Świątynia Awwam"
 tesla.3035.d: "[SCOPE.sCharacter('rapanui_adventurer_var').GetFullName] zwrócił się do kapitana z prośbą o krótką wyprawę w głąb lądu znad Zatoki Adeńskiej, aby odwiedzić ruiny Świątyni Awwam w pobliżu Ma'rib. Miejsce to, znane uczonym jako jeden z ośrodków starożytnej cywilizacji sabejskiej, od dawna pozostaje poza zasięgiem systematycznych badań. Przekonuje, że okazja do osobistego zbadania ruin, skoro znajdują się tak blisko, może się prędko nie powtórzyć. Taka wyprawa opóźniłaby jednak prace przy układaniu kabla."
 tesla.3035.f: "[SCOPE.sCharacter('rapanui_adventurer_var').GetLastName] opowiada o kultach księżyca, szlakach handlu kadzidłem i wciąż nierozwiązanych zagadkach starożytnych inskrypcji. Opisując cyklopowe mury i na wpół zasypane piaskiem kolumny, kreśli palcami w powietrzu wyimaginowane napisy. Dla niego Świątynia Awwam to zagadka czekająca na rozwiązanie pod warstwami pyłu. Dla Dr. [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] to tylko kolejne niepotrzebne opóźnienie."
 tesla.3035.g: "Zezwól na zmianę trasy."
 tesla.3035.h: "Układanie kabla musi przebiegać zgodnie z harmonogramem."
 tesla.3036.t: "Sokotra"
 tesla.3036.d: "Podczas gdy statek stoi na kotwicy u wybrzeży Sokotry, aby uzupełnić zapasy, [SCOPE.sCharacter('rapanui_adventurer_var').GetFullName] dyskretnie prosi o pozwolenie na zejście na ląd. Dotarły do niego informacje o przemycanym przez wyspę ładunku antyków – niewielkich posążków i przedmiotów grobowych, rzekomo pochodzących z Egiptu. Przemytnicy zamierzają dostarczyć je do prywatnej kolekcji jednego z dworów książęcych na Wschodzie. Przekonuje, że gdyby udało się je teraz pozyskać, można byłoby je zabezpieczyć, skatalogować i ostatecznie przekazać w ręce odpowiednich uczonych."
 tesla.3036.f: "[SCOPE.sCharacter('rapanui_adventurer_var').GetLastName] nie zaprzecza, że transakcja ma nieoficjalny charakter – podkreśla jedynie, jak pilna jest sprawa. „Lepiej, żeby zabytki spoczywały w opisanej skrzyni w archiwum, niż żeby niemy posążek kurzył się na pałacowej półce” – przekonuje. Załoga jest zaniepokojona, a kapitan ostrzega przed możliwymi komplikacjami dyplomatycznymi. Asystent mówi jednak o dziedzictwie, o zabytkach ocalonych od zapomnienia i o wiedzy, która w przeciwnym razie zostałaby bezpowrotnie utracona."
 tesla.3036.g: "Pozwól mu działać – dyskretnie."
 tesla.3036.h: "To nie jest cel naszej wyprawy."
 tesla.3040.t: "Gigantyczny Cień"
 tesla.3040.d: "Członkowie załogi donoszą, że podczas rutynowego układania kabla dostrzegli pod statkiem ogromny, powoli przemieszczający się cień. Obiekt nie przypominał ani prądu morskiego, ani zachowania żadnego znanego zwierzęcia i zniknął bez śladu. Choć oficerowie uznali, że najprawdopodobniej był to wieloryb lub złudzenie optyczne, doniesienie wywołało falę plotek zarówno na pokładzie, jak i w prasie."
 tesla.3040.f: "Poruszał się bezszelestnie i jednostajnie, głęboko pod powierzchnią wody – zbyt regularnie, by mógł być prądem morskim, i zbyt ogromnie, by mógł być jakimkolwiek wielorybem znanym nauce. Niektórzy twierdzą, że dostrzegli metaliczny połysk. Inni utrzymują, że widzieli światła. W dzienniku okrętowym odnotowano jedynie „gęstą masę morską o nieustalonym pochodzeniu”. Plotki zdążyły się już jednak rozprzestrzenić. Co jeszcze przemierza głębiny pod układanymi przez nas kablami? A może coś już nas obserwuje?"
 tesla.3040.g: "Przekaż prasie doniesienie o niezwykłym spotkaniu z morskim stworzeniem."
 tesla.3041.t: "Powrót Floty Układającej Kable Podmorskie"
 tesla.3041.d: "Flota układająca kable podmorskie powróciła do portu. Po wielu tygodniach spędzonych na morzu udało się ułożyć kabel podmorski na całej długości zaplanowanej trasy. Jednak końcowe testy jeszcze się nie rozpoczęły. Teraz należy podłączyć kabel do stacji lądowych i sprawdzić poprawność przesyłania sygnału. Dopiero wtedy okaże się, czy przedsięwzięcie rzeczywiście zakończyło się sukcesem."
 tesla.3041.f: "Na wyciągarkach osiadły drobinki rdzy, a kadłub pokrywają smugi soli. Załoga wraca wyczerpana, a inżynier milczy. Kabel spoczywa tam, gdzie powinien – ułożony na dnie morskim, rozciągnięty ponad podmorskimi grzbietami, połączony i zabezpieczony. A jednak wciąż nie przesłano ani jednej wiadomości z jednego kontynentu na drugi. Statki mogły powrócić do domu, lecz wraz z nimi nie nadeszła pewność sukcesu. Teraz wszystkie oczy zwrócone są na ostateczną próbę."
 tesla.3041.g: "Hurra!"
 tesla.3042.t: "Ekspert od Oceanów"
 tesla.3042.d: "Pomimo niepewności związanej z misją układania kabla podmorskiego jeden człowiek zdołał przekuć tę podróż w nieoczekiwany triumf naukowy. Młody pasażer na gapę, początkowo traktowany z podejrzliwością i niemal wyrzucony ze statku, przez całą wyprawę dokumentował organizmy zamieszkujące morskie głębiny, gromadząc setki okazów i sporządzając szczegółowe szkice. Po powrocie jego odkrycia przyciągnęły uwagę towarzystw przyrodniczych z całego kontynentu."
 tesla.3042.f: "Pracując przy świetle lampy naftowej i oszczędnie gospodarując przydzielonym papierem, student katalogował bioluminescencyjny plankton, szkielety kostne ryb oraz skorupiaki nieznane dotąd badaczom fauny przybrzeżnej. To, co zaczęło się jako akt desperacji, zakończyło się zdobyciem uznania w świecie nauki. Prasa nazywa go „przyrodnikiem z otchłani”. On sam uważa, że wszystko sprowadza się do uważnej obserwacji."
 tesla.3042.g: "Student? Przyznajcie mu doktorat!"
 tesla.3042.h: "Potrzebujemy tych dokumentów naukowych."
 tesla.3043.t: "Kronika Ruin i Szlaków"
 tesla.3043.d: "Podczas wyprawy związanej z układaniem kabla podmorskiego z Suezu do Bombaju młody asystent archeologa sporządzał obszerne notatki dotyczące architektury, inskrypcji i pozostałości dawnych kultur, które napotkał lub o których słyszał w trakcie podróży. Korzystając z doświadczeń zdobytych podczas wcześniejszych badań terenowych oraz bogactwa geograficznego przemierzanych obszarów, opracował wyczerpujący raport, który obecnie krąży w środowiskach naukowych, zdobywając powszechne uznanie."
 tesla.3043.f: "Dostrzegał znacznie więcej niż tylko linie brzegowe. W swoim notatniku utrwalał zarysy opuszczonych świątyń, stacji postojowych i zapomnianych miast portowych – pozostałości cywilizacji niegdyś połączonych więzami handlu i wiary. Teraz, dzięki jego zapiskom, te świadectwa przeszłości przemawiają na nowo. Publikacja, ceniona za przejrzystość i umiejętne ukazanie ciągłości dziejów, uznawana jest za dzieło łączące świat nauki z tradycją żeglarską. Kabel może połączyć teraźniejszość, lecz jego kronika przywraca do życia przeszłość."
 tesla.3043.h: "Potrzebujemy tych artefaktów archeologicznych."
 tesla.3044.t: "Katedra Etnologii"
 tesla.3044.d: "Po zakończeniu wyprawy związanej z układaniem kabla podmorskiego student, który podróżował na pokładzie statku, opublikował serię prac poświęconych systemom pokrewieństwa, tradycjom ustnym oraz kosmologicznym podstawom nawigacji ludów polinezyjskich, z którymi zetknął się podczas zejść na ląd i postojów. Jego prace spotkały się z uznaniem uczonych z wielu krajów. Jeden z uniwersytetów zamierza teraz powierzyć mu kierownictwo nowo utworzonej Katedry Etnologii Porównawczej."
 tesla.3044.f: "Jego prace stronią od romantyzmu, lecz pobrzmiewa w nich rytm tradycyjnych pieśni i logika więzów rodowych. Opisuje bogów przybierających postać wiatru oraz drzewa genealogiczne przypominające morskie fale. W salonach naukowych jego nazwisko wymienia się dziś w jednym tchu z pojęciem „epistemologii oceanicznej”. Tym, którzy pamiętają go z pokładu statku, trudno uwierzyć, że tak niepozorne sporządzanie notatek mogło wpłynąć na kształt całej dziedziny nauki. On sam nazywa to po prostu słuchaniem."
 tesla.3044.h: "Potrzebujemy tych polinezyjskich artefaktów."
 tesla.3051.t: "Pierwsze Słowo przez Atlantyk"
 tesla.3051.d: "Wiadomość wysłana za pośrednictwem transoceanicznego kabla podmorskiego przez [SCOPE.sCountry('tesla_country_1').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCharacter('tesla_leader_1').GetFullName] z [SCOPE.sCountry('tesla_country_1').GetName] dotarła 16 godzin później do [SCOPE.sCountry('tesla_country_2').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCharacter('tesla_leader_2').GetFullName] z [SCOPE.sCountry('tesla_country_2').GetName]."
 tesla.3051.f: "„Jest to triumf wspanialszy, ponieważ przynoszący ludzkości znacznie większy pożytek, niż jakiekolwiek zwycięstwo odniesione przez zdobywcę na polu bitwy. Niech telegraf atlantycki, z błogosławieństwem Niebios, stanie się więzią wiecznego pokoju i przyjaźni między bratnimi narodami oraz narzędziem, któremu Opatrzność Boża przeznaczyła szerzenie religii, cywilizacji, wolności i prawa na całym świecie”. – James Buchanan"
 tesla.3051.g: ".... . .-.. .-.. --- -.-.--"
 tesla.3052.t: "Cisza"
 tesla.3052.d: "Kabel został podłączony do stacji brzegowej. Podjęto pierwsze próby przesłania wiadomości, lecz nie otrzymano odpowiedzi. Jak dotąd nie udało się potwierdzić odbioru sygnału na drugim końcu kabla. Technicy nadal testują i ponownie kalibrują urządzenia, jednak z każdą mijającą godziną nadzieja na sukces słabnie. Wszystko wskazuje na to, że misja zakończyła się niepowodzeniem."
 tesla.3052.f: "Linia milczy. Żadnego trzasku, żadnego kliknięcia, żadnego drgnienia wskazówki świadczącego o przepływie prądu – jedynie cisza zbyt doskonała, by mogła być naturalna. Jedni obwiniają aparaturę, inni stacje przekaźnikowe, a jeszcze inni sam ocean. Inżynierowie pracują w napiętym milczeniu, inwestorzy szepczą o stratach, a prasa zaczyna snuć domysły. Być może sygnał jest jedynie opóźniony. Być może coś poszło nie tak. A może od samego początku oczekiwano zbyt wiele – przesyłania wiadomości pod dnem morza."
 tesla.3052.g: "Cała fortuna poszła na dno morza..."
 tesla.3052.tt: "Spółka podejmie próbę przeprowadzenia nowej rundy zbiórki funduszy, jeśli Zaufanie Akcjonariuszy nie spadnie do zera."
 tesla.3053.t: "Załamanie Zaufania"
 tesla.3053.d: "Panika ogarnęła rynki finansowe. Zaufanie inwestorów załamało się. Akcje spółki telegraficznej gwałtownie straciły na wartości, wywołując szerszy kryzys zaufania do innowacji przemysłowych oraz zaangażowania rządu w przedsięwzięcia spekulacyjne. Kryzys rozprzestrzenia się na banki, przedsiębiorstwa i gospodarstwa domowe."
 tesla.3053.f: "Wszystko zaczęło się od niepewności – potem nastała cisza, a teraz przyszła pora zapłacić za jej konsekwencje. Akcje, niegdyś będące symbolem przyszłości, są dziś warte mniej niż papier, na którym je wydrukowano. Biura zamykają podwoje, banki wstrzymują wypłaty, a nazwa spółki telegraficznej pada już tylko z goryczą. Tysiące drobnych inwestorów w ciągu kilku godzin tracą oszczędności całego życia. Przedsięwzięcie, które miało połączyć kontynenty, doprowadziło zamiast tego do załamania gospodarki całego kraju. Kabel spoczywa w milczeniu na dnie morza, lecz na powierzchni panuje ogłuszający zgiełk."
 tesla.3053.g: "Z pewnością rynki same się ustabilizują. Przecież zawsze tak się dzieje... prawda?"
 tesla.3054.t: "Pokonany"
 tesla.3054.d: "Dotarły do nas wieści, że obce mocarstwo pomyślnie ukończyło i uruchomiło własne transoceaniczne połączenie kablowe. Sygnały telegraficzne są już przesyłane przez morze – tyle że nie naszym kablem. Ogłoszenie tego sukcesu wstrząsnęło rynkami i wywołało trudne pytania o tempo realizacji oraz sens naszego własnego przedsięwzięcia."
 tesla.3054.f: "Nagłówki gazet są jednoznaczne i bezlitosne: wiadomość przemierzyła ocean, lecz nie na naszych warunkach. Wyścig, który jeszcze niedawno trwał, ma już zwycięzcę – i nie jesteśmy nim my. Inwestorzy wstrzymują się z decyzjami, urzędnicy uchylają się od odpowiedzialności, a rywale po cichu wyciągają wnioski. Zagraniczny kabel przesyła coś więcej niż tylko sygnały – zapewnia wpływy, wiarygodność i przewagę wynikającą z pierwszeństwa. Nasze statki wciąż dryfują po morzu, a nasi inżynierowie nadal prowadzą obliczenia. Tymczasem świat idzie naprzód – połączony, lecz nie za naszą sprawą."
 tesla.3054.g: "To... jest problem."
 tesla.3061.t: "Ukończenie Telegrafu Wschodniego"
 tesla.3061.d: "Bezpośredni podmorski kabel telegraficzny łączy teraz Egipt z Indiami, biegnąc przez Suez. Po latach przygotowań, badań hydrograficznych i układania kabla na płytkich morzach oraz spornych wodach terytorialnych połączenie zostało ukończone. Operatorzy telegrafu potwierdzają, że sygnały są odbierane wyraźnie i bez opóźnień."
 tesla.3061.f: "„Kabel do Indii został ukończony”. – Anonim"
 tesla.3061.g: "-... --- -- -... .- -.-- ..--.."
 tesla.3071.t: "Pierwsza Wiadomość przez Pacyfik"
 tesla.3071.d: "Po raz pierwszy w historii wiadomość przemierzyła bezkresny Ocean Spokojny za pośrednictwem nieprzerwanego połączenia kabli podmorskich – od Australii aż po Kanadę. Kabel rozciąga się na tysiące mil morskich i pozwala teraz przesyłać wiadomości między półkulami w ciągu zaledwie kilku sekund. Pierwsza oficjalna depesza była krótka, uroczysta i historyczna."
 tesla.3071.f: "„Kabel Pacyficzny został pomyślnie ułożony. Imperium jest teraz połączone siecią komunikacyjną, która stanowi jego własność i pozostaje pod jego wyłączną kontrolą. To osiągnięcie umocni więzi jedności i współpracy między wszystkimi częściami posiadłości Jego Królewskiej Mości”. – Edmund Barton"
 tesla.3071.g: ".... --- --- .-. .- -.-- -.-.--"
