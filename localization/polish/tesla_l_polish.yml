l_polish:
 tesla_prototype_mechanical_computer_modifier: "Prototyp mechanicznego komputera"
 tesla.223.t: "Pierwszy prototyp"
 tesla.223.d: "Podczas [ROOT.Var('tesla_engineer_var').GetCharacter.GetHerHis] prac nad skonstruowaniem Komputera Mechanicznego Dr. [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] zdołał ukończyć pierwszy prototyp urządzenia, które potrafi wykonywać proste obliczenia. Choć nie dorównuje ono możliwościami prawdziwemu komputerowi, mogłoby pomóc naszym uczonym w ich pracy."
 tesla.223.f: "Nie potrafi jeszcze wykonywać wszystkich obliczeń, ale przynajmniej niektóre. Dodawanie, odejmowanie, mnożenie i dzielenie nie powinny stanowić problemu. Proszę jednak zachować ostrożność – jeden z moich asystentów omal nie stracił palca podczas pracy maszyny."
 tesla.223.g: "Mam nadzieję, że [ROOT.Var('tesla_engineer_var').GetCharacter.GetSheHe] zdoła stworzyć coś więcej niż tylko prototyp..."
 tesla.224.t: "Nieustanne Rozszerzanie Projektu"
 tesla.224.d: "Wygląda na to, że Dr. [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] ma głowę pełną pomysłów. Nie ma dnia, by nie wprowadzał kolejnych zmian do planów Komputera Mechanicznego. Pozostaje tylko pytanie, czy ten projekt kiedykolwiek zostanie ukończony."
 tesla.224.f: "„Ale wyobraźcie sobie, że mógłby również grać muzykę! Czy to nie byłoby wspaniałe?”"
 tesla.224.g: "Czy mógłby pan wreszcie po prostu zbudować ten komputer?"
 tesla.224.h: "Zagróź obcięciem funduszy"
 tesla.225.t: "Pożar Uszkadza Komputer Mechaniczny"
 tesla.225.d: "Ogromny pożar uszkodził część Komputera Mechanicznego konstruowanego przez Dr. [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] i zniszczył niektóre plany konstrukcyjne. Nie wiemy jeszcze, jak bardzo opóźni to realizację projektu."
 tesla.225.f: "Pożar wybuchł w module drukarki Komputera Mechanicznego. Nikt nie wie dokładnie, co go spowodowało, ale wygląda na to, że drukarka wytwarzała ogromne ilości papieru."
 tesla.225.g: "Czy ten komputer kiedykolwiek zostanie skonstruowany?"
 tesla.225.h: "Przyznaj im dodatkowe fundusze."
