 tesla_topographic_map_project_new_priority_button: "Zmień Priorytetowe Stany"
 tesla_topographic_map_project_new_priority_button_desc: "#T Zmień Priorytetowe Stany#!\nZmień [Concept('concept_state', '$concept_states$')], które mają priorytet w ramach tego projektu.\n#n Uwaga: Wstrzymaj grę, aby upewnić się, że priorytetyzacja działa prawidłowo.#!"
 tesla_state_trait_irrigation: "System Irygacji"
 je_tesla_irrigation_project: "System Irygacji"
 tesla_states_with_irrigation_tt: "Wszystkie [GetPlayer.GetAdjective] Stany posiadają cechę Stanu $tesla_state_trait_irrigation$ (obecnie [GetPlayer.MakeScope.GetVariable('tesla_num_states_irrigation_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('tesla_num_states_var').GetValue|V0])."
 tesla_irrigation_project_finished_engineer_loc: "\nDr. [GetPlayer.MakeScope.GetVariable('tesla_engineer_var').GetCharacter.GetLastName] pracował nad nowymi #b Systemami Nawadniania#! w [GetPlayer.GetName] i zdołał je rozbudować, co znacząco usprawniło nasz sektor rolniczy."
 gaudi.1111.t: "System Nawadniania [GetPlayer.GetName]"
 gaudi.1111.d: "Nasz [concept_tesla_civil_engineer][GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')] wreszcie ukończył projekt budowy nowoczesnego systemu nawadniania w [GetPlayer.GetNameNoFormatting]. Teraz, gdy ujarzmiliśmy rzeki i doprowadziliśmy wodę na pola uprawne, nasze rolnictwo z pewnością rozkwitnie!"
 gaudi.1111.f: "„Dzikie rzeki zostały ujarzmione. Cały ich urok prysł. Teraz to już tylko proste kanały wodne. Nawet bobry zniknęły...”"
 gaudi.1111.g: "Mam nadzieję, że nie przyniesie to nieprzewidzianych konsekwencji..."
