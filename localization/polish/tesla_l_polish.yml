 je_tesla_transatlantic_cable: "Kabel Transatlantycki"
 je_tesla_transatlantic_cable_reason: "Budowa podmorskiego kabla telegraficznego przebiega w trzech etapach. W pierwszym poszukuje się dodatkowych inwestorów i rozpoczyna planowanie przedsięwzięcia. W drugim układany jest kabel. Trzeci obejmuje końcowe przygotowania do oddania go do użytku.\n\nO powodzeniu projektu decydują dwa kluczowe wskaźniki: #O Postęp Układania Kabla#! oraz #O Zaufanie Akcjonariuszy#!. Postęp określa, jak długo potrwa budowa, a umiejętności [concept_tesla_engineer] odgrywają tutaj kluczową rolę. Zaufanie zależy w dużej mierze od [concept_executive] przedsiębiorstwa. Jeśli spadnie do zera, projekt zostanie uznany za beznadziejny i skazany na niepowodzenie. Dlatego za wszelką cenę należy zapobiec całkowitej utracie zaufania.\n\nSamo ułożenie kabla na dnie morza nie gwarantuje sukcesu. Historycznie pierwsza próba uruchomienia kabla transatlantyckiego zakończyła się niepowodzeniem. Przedsiębiorstwo może jednak podnieść się po takiej porażce, jeśli zaufanie akcjonariuszy pozostanie wysokie. Wówczas zostanie ułożony nowy kabel. Jeśli pierwsza próba zakończy się niepowodzeniem, sukces drugiej będzie gwarantowany."
