 tesla.101.t: "Powrót [SCOPE.sCharacter('tesla_new_engineer_scope').GetLastName] do Francji"
 tesla.101.d: "[SCOPE.sCharacter('tesla_new_engineer_scope').GetFullName] przybył do Grecji na zaproszenie Kapodistriasa. Teraz, gdy zakończył prace pomiarowe na Peloponezie, pragnie powrócić do Francji."
 tesla.101.f: "Kiedy Grecja zwróciła się do Francji o wsparcie, Francuzi wysłali tam Wyprawę Morejską. Francuskie wojska udzieliły pomocy podczas greckiej wojny o niepodległość, a towarzyszyła im wyprawa naukowa. Jednym z jej uczestników był Pierre Peytier, oficer, geograf i inżynier, który przeprowadził pomiary geodezyjne Argolidy oraz Peloponezu."
 tesla.101.g: "Dziękujemy za twoją służbę!"
 tesla.101.h: "Nie możemy stracić [SCOPE.sCharacter('tesla_new_engineer_scope').GetLastName]!"
 tesla.102.t: "Powrót Księcia"
 tesla.102.d: "[SCOPE.sCharacter('tesla_new_engineer_scope').GetFullName] został wysłany do Niderlandów w 1837 roku. A co, jeśli powrócił?"
 tesla.102.f: "[SCOPE.sCharacter('tesla_new_engineer_scope').GetFullNameNoFormatting] został wysłany do Niderlandów jako zakładnik w ramach porozumienia zawartego między Imperium Aszanti a Holendrami. Tam zdobył wykształcenie w dziedzinie inżynierii górniczej i przeszedł na wyznanie Holenderskiego Kościoła Reformowanego.\nPóźniej, zamiast wrócić do ojczyzny, jak mu wcześniej obiecano, podjął pracę w Holenderskich Indiach Wschodnich. A co, jeśli jednak powróciłby do rodzinnych stron?"
 tesla.102.g: "To on jest prawowitym następcą tronu!"
 tesla.102.h: "W końcu pochodzi ze szlacheckiego rodu..."
 tesla.102.i: "Słyszałem, że został Inżynierem."
 tesla.102.j: "Słyszałem, że został Inżynierem Górniczym."
 tesla.102.k: "Ale nigdy nie powrócił..."
 tesla_western_influence_modifier: "Wpływy Zachodnie"