 pm_curie_magnetic_observatory: "[Concept('concept_curie_geomagnetism','$concept_curie_geomagnetic_observatory|q$')]"
 je_curie_magnetic_observation: "Obserwacja Geomagnetyczna"
 je_curie_magnetic_observation_reason: "Carl Friedrich Gauß zbudował w Getyndze pierwsze obserwatorium geofizyczne i w 1832 roku skonstruował na jego potrzeby czuły magnetometr. Zrozumiał, że pomiary prowadzone w tym samym czasie w różnych miejscach na świecie są niezbędne do ustalenia przyczyn wahań pola magnetycznego i dokładniejszego zmierzenia jego stałej składowej. Od 1836 roku dane dostarczały założone w tym celu Stowarzyszenie Magnetyczne oraz brytyjskie Towarzystwo Królewskie. Analizowali je Gauß i Wilhelm Weber. Celem przedsięwzięcia było skoordynowane mierzenie wahań ziemskiego pola magnetycznego za pomocą licznych stacji pomiarowych rozmieszczonych na całym świecie. W projekcie uczestniczyło nawet 50 obserwatoriów, w tym 35 w Europie, sześć w Azji, dwa w Afryce, trzy w Ameryce Północnej i cztery w Oceanii. Wyniki przesyłano do Getyngi, gdzie Gauß i Weber opracowywali je naukowo."
 je_curie_magnetic_observation_goal: "Zbierz #G 100#! @curie_magnetic_data_var! [concept_curie_magnetic_data]. To międzynarodowe przedsięwzięcie, w którym udział wezmą wszyscy członkowie Towarzystwa Magnetycznego."
 je_curie_magnetic_atlas: "Atlas Geomagnetyczny"
 je_curie_magnetic_atlas_reason: "W latach 30. XIX wieku Gauß i Weber założyli Getyńskie Stowarzyszenie Magnetyczne. Stworzyli światową sieć stacji obserwacyjnych, które jednocześnie mierzyły natężenie i kierunek ziemskiego pola magnetycznego, stosując ujednolicone procedury pomiarowe. Gauß opracował teorię potencjału, aby opisać ziemskie pole magnetyczne. Dzięki tej metodzie matematycznej był w stanie obliczyć pole magnetyczne dla całej powierzchni Ziemi, nawet w regionach, dla których nie były dostępne żadne bezpośrednie pomiary."
 je_curie_magnetic_atlas_progress_complete_tt: "Postęp osiągnął #V 24#!."
 curie_set_magnetic_association_effect_tt: "Załóż Towarzystwo Magnetyczne. Inne kraje mogą do niego dołączyć i również zbudować [Concept('concept_curie_geomagnetism','$concept_curie_geomagnetic_observatory|q$')], aby zbierać @curie_magnetic_data_var! [concept_curie_magnetic_data]."
 curie_add_magnetic_association_member_tt: "Dołącz do Towarzystwa Magnetycznego. Jego członkowie będą przesyłać @curie_magnetic_data_var! [concept_curie_magnetic_data] do [GetPlayer.GetCustom('curie_magnetic_association_city')] i czerpać korzyści z wyników badań naukowych."
