 je_curie_mathematical_innovation_reason: "[ROOT.GetCountry.GetCustom('je_curie_mathematical_innovation_active_type')][concept_curie_mathematical_physicist], który nie jest zatrudniony przy innym zadaniu, przyczynia się do rozwoju innowacji matematycznych państwa. Innowacje matematyczne stanowią sumę międzynarodowych i krajowych innowacji matematycznych. Międzynarodowe innowacje matematyczne oblicza się na podstawie łącznej liczby odkrytych wzorów matematycznych. Krajowe innowacje matematyczne oblicza się na podstawie wszystkich wzorów odkrytych samodzielnie przez dane państwo.\n\nInnowacje matematyczne zwiększają maksymalny limit innowacji i zmniejszają karę za badanie technologii wyprzedzających swoją epokę. Po odkryciu nowego wzoru modyfikator jest aktualizowany pod koniec roku, aby zwiększyć innowacje matematyczne."
