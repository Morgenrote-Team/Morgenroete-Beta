 je_curie_magnetic_station_reason: "Dzięki przyrządom i instrukcjom otrzymanym z [GetPlayer.GetCustom('curie_magnetic_association_city')] nasz fizyk założy Obserwatorium Geomagnetyczne w ciągu najbliższych dwóch lat. Jest to przedsięwzięcie międzynarodowe: im więcej danych z różnych państw będzie przesyłanych do [GetPlayer.GetCustom('curie_magnetic_association_city')], tym szybciej pracujący tam naukowcy będą mogli zdobywać nową wiedzę na temat pola magnetycznego Ziemi."
