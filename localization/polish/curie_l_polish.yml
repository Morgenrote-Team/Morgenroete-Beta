 alert_curie_geomagnetics_possible_alert_name: "Twój [concept_curie_physicist] może prowadzić Badania Geomagnetyczne."
 alert_curie_geomagnetics_possible_alert_hint: "Twój [concept_curie_physicist] może prowadzić #b Badania Geomagnetyczne#!. Obejmują one takie działania jak założenie Towarzystwa Magnetycznego, dołączenie do Towarzystwa Magnetycznego, utworzenie Obserwatorium Geomagnetycznego lub opracowanie Atlasu Geomagnetycznego.\n\nPrzejdź do Fizyka w zakładce Matematyka i otwórz przegląd w sekcji Wzory Matematyczne/Atlas Chmur/Rakietnictwo/Fizyka Jądrowa."
