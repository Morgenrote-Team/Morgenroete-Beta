 curie_mathematical_physicist: "Matematyk"
 curie_mathematical_physicist_desc: "Postać ta dokonała niezwykłych odkryć matematycznych, dzięki czemu cieszy się dużym szacunkiem społecznym."
 curie_meteorological_physicist: "Meteorolog"
 curie_meteorological_physicist_desc: "Meteorolodzy to naukowcy, którzy obserwują pogodę i próbują opracowywać prognozy jej przyszłych zmian."
 curie_rocket_physicist: "Fizyk Rakietowy"
 curie_rocket_physicist_desc: "Fizycy rakietowi znani są z niezwykle niewymagającej dziedziny badań, obejmującej teorię, projektowanie i budowę nowych typów rakiet."
 curie_nuclear_physicist: "Fizyk Jądrowy"
 curie_nuclear_physicist_desc: "Takiemu fizykowi nigdy nie należy pozwalać na swobodne przebywanie wśród ludzi. Powinien pozostawać zamknięty w laboratorium, pod ścisłym nadzorem i przy zachowaniu najwyższych środków bezpieczeństwa."
