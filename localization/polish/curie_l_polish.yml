 curie.301.t: "Zreformowany Wydział Matematyki i Inżynierii"
 curie.301.d: "Dr. [SCOPE.sCharacter('curie_physicist_scope').GetLastName] osiągnął [SCOPE.sCharacter('curie_physicist_scope').GetHerHis] cel. Podczas wizyty na Wydziale Matematyki i Inżynierii [SCOPE.sCharacter('curie_physicist_scope').GetSheHe] wprowadził nowe metody badawcze i zapoznał kolejne pokolenie naukowców z najnowszymi osiągnięciami matematyki.\n\nŁączna liczba ulepszonych budynków: [GetPlayer.MakeScope.Var('mr_num_improved_mathematics_buildings_var').GetValue|V0]\n$concept_curie_physical_data$ z Projektu: [GetPlayer.MakeScope.ScriptValue('curie_physical_data_from_mathematics_project_for_event_value')|+0] @curie_physical_data!"
 curie.301.f: "„Właśnie skończyłem prowadzić seminarium z Algebry Boole’a 101 i nikt nie zrozumiał żartu! Co za banda ignorantów”."
 curie.301.g: "Powiew świeżości ogarnia świat nauki!"
 je_curie_physics_experiment: "Eksperyment Fizyczny"
 je_curie_physics_experiment_reason: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] pracuje nad eksperymentem fizycznym. Jego powodzenie lub niepowodzenie zależy w dużej mierze od [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis] osobistej [concept_character_trait]. Jeśli eksperyment się powiedzie, będzie miał charakter rutynowy lub znaczenie historyczne. Ten drugi rezultat jest możliwy, jeśli żaden naukowiec nie przeprowadził wcześniej takiego eksperymentu i spełnione zostaną odpowiednie warunki, które zazwyczaj wymagają określonej technologii. Każdy fizyk może z powodzeniem przeprowadzić tylko jeden historyczny eksperyment w ciągu swojego życia."
