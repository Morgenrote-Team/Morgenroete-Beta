 curie.201.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]"
 curie.201.d: "Czy to prawda, czy tylko kolejny z tych dziwnych snów, które kłębiły się w umyśle Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetFullName] i ukazały [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHim] ukończony wzór? Po wielu nieprzespanych nocach [ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe] może z dumą wskazać na [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis] dzieło. [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis|U] badania nad [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')] dobiegły końca."
 curie.201.f: "„Zawsze zastanawia fakt, że wszyscy, którzy poważnie zgłębiają tę naukę, rozwijają w sobie swego rodzaju pasję do niej”. -Carl Friedrich Gauß"
 curie.201.g: "No to kto teraz zetrze tablicę?"
 curie.202.t: "Wzór Matematyczny"
 curie.202.d: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetFullName] podjął się odkrycia nowej dziedziny matematyki. [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis|U] badania koncentrują się na [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]."
 curie.202.f: "Począwszy od XIX wieku, podstawy pojęć matematycznych poddawano wnikliwej analizie i precyzowano. Augustin-Louis Cauchy opracował definicję granicy z wykorzystaniem ε. Położył również podwaliny pod teorię funkcji. Ścisły związek między rozwojem fizyki i mechaniki a XVIII-wiecznym rachunkiem różniczkowym i całkowym utrzymywał się nadal, a wielu matematyków było jednocześnie fizykami teoretycznymi – rozróżnienie między tymi dziedzinami nie było jeszcze wówczas stosowane."
 curie.202.g: "Miejmy nadzieję, że wyniknie z tego coś pożytecznego...?"
 curie.203.t: "Obce państwo opracowuje [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]"
 curie.203.d: "Dzięki wymianie listów Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetFullName] dowiedział się dziś, że zagraniczny kolega wyprzedził [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHim] w [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis] badaniach nad [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]! Rywal zdążył już wyprowadzić wzór."
 curie.203.f: "„Nic nie zdradza braku wykształcenia matematycznego dobitniej niż przesadna dokładność w rachunkach”. -Wilhelm Weber"
 curie.203.g: "Ta matematyczna chwała powinna przypaść nam!"
