 curie.503.t: "Krajowa Sieć Stacji Meteorologicznych"
 curie.503.d: "Dr. [SCOPE.sCharacter('curie_physicist_scope').GetLastName] osiągnął [SCOPE.sCharacter('curie_physicist_scope').GetHerHis] cel. Dzięki ogólnokrajowej sieci stacji meteorologicznych można podejmować działania zapobiegawcze w obliczu zjawisk pogodowych, zarówno w ramach zarządzania kryzysowego, jak i na potrzeby rolnictwa.\n\nŁączna liczba ulepszonych budynków: [GetPlayer.MakeScope.Var('mr_num_improved_meteorology_buildings_var').GetValue|V0]"
 curie.503.f: "Siedem słonecznych dni czerwca, lecz wystarczyło, by rozkwitły\nKwiaty na letniej sukience, którą nosiłaś wiosną\nTo, jak śmialiśmy się razem, a potem rzuciłaś tę bombę\nŻe znam cię zbyt długo, by mogło być między nami coś więcej"
 curie.503.g: "Czy jutro będzie świecić słońce?"
