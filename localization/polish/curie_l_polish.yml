 je_curie_improve_meteorology_project: "Sieć Stacji Meteorologicznych"
 je_curie_improve_meteorology_project_reason: "Twój [concept_curie_physicist] Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] koncentruje się na dodaniu stacji meteorologicznej do budynku [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] w regionie [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName].\n$mr_divider_for_je$\nPostęp projektu będzie zwiększał się co miesiąc. Za każdym razem, gdy osiągnie wartość 24, do obecnego budynku zostanie dodany nowy modyfikator. Projekt zakończy się, gdy wszystkie wybrane budynki zostaną wyposażone w przypisane im modyfikatory.\nŁącznie dostępne są 3 modyfikatory. Aby uzyskać każdy kolejny modyfikator, pasek postępu musi ponownie się zapełnić.\n$mr_divider_for_je$\nObecny Budynek: [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] w regionie [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_meteorology_project_modifier_1_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_meteorology_project_modifier_2_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_meteorology_project_modifier_3_type')]\n\nŁączna Liczba Pozostałych Budynków (bez obecnego): [JournalEntry.MakeScope.Var('mr_number_of_remaining_list_entries_var').GetValue|V0]!#!"
