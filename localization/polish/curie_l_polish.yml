 curie.13.t: "Outokumpu"
 curie.13.d: "Dzięki pomocy Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] i najnowocześniejszym technologiom udało nam się odkryć nieznaną dotąd żyłę miedzi w Outokumpu. To może być największe złoże w Europie Północno-Wschodniej!"
 curie.13.f: "Po odkryciu bogatego złoża rudy w 1910 roku i budowie zintegrowanych zakładów przemysłowych (hut i rafinerii) Outokumpu stało się w latach 30. XX wieku jednym z pięciu największych producentów miedzi w Europie i położyło podwaliny pod nowoczesny fiński przemysł metalowy."
 curie.13.g: "Outokumpu stanie się ośrodkiem produkcji miedzi!"
 je_curie_meteorological_observation: "Obserwacja Meteorologiczna"
 je_curie_meteorological_observation_reason: "[ROOT.GetCountry.GetCustom('je_curie_meteorological_observation_active_type')][concept_curie_meteorological_physicist] poświęca się całkowicie badaniom meteorologicznym. Obejmują one obserwację pogody i temperatury, badanie i opisywanie chmur oraz prowadzenie zapisów klimatycznych.\n\nObserwacje meteorologiczne mają bezpośredni wpływ na gromadzone dane. Doświadczenie meteorologa ma tutaj kluczowe znaczenie. Dobrze wyposażona stacja meteorologiczna zapewnia dodatkowe punkty.\nMeteorolog może zebrać od #R 1#! do #G 10#! @curie_physical_data!#! [concept_curie_physical_data] rocznie.\n\n$mr_divider_for_je$\nOczekuje się, że nasz meteorolog zbierze [GetPlayer.MakeScope.ScriptValue('curie_meteorological_observation_yearly_physical_data_value')|+=0] @curie_physical_data!#! [concept_curie_physical_data]."
