 curie_physics_experiment_successful_modifier: "Eksperyment Fizyczny: Sukces!"
 curie.401.t: "Eksperyment Fizyczny"
 curie.401.d: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] rozpoczyna nowy etap [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis] eksperymentu. Nie jest jeszcze jasne, czy [ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe] przyjmuje ostrożne, czy rewolucyjne podejście."
 curie.401.f: "Po pewnym czasie od rozpoczęcia eksperymentu fizyk spróbuje jak najszybciej doprowadzić go do końca. To, czy zawsze mu się to uda, jest zupełnie inną kwestią. Szczególnie fizycy posiadający cechy charakteru #G $cautious$#! i #G $meticulous$#! mają duże szanse na pomyślny wynik eksperymentu. W przypadku fizyków posiadających cechy #R $wrathful$#!, #R $reckless$#! i #R $senile$#! istnieje szczególnie duże ryzyko, że ich badania zakończą się katastrofą."
 curie.401.g: "Ostrożne podejście."
 curie.401.h: "Rewolucyjne podejście."
 curie.402.t: "Eksperyment o Historycznym Znaczeniu"
 curie.402.d_1: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] przepuścił światło przez dwie wąskie szczeliny na ekran. Powstały wzór interferencyjny złożony z jasnych i ciemnych prążków dowiódł, że światło zachowuje się jak fala, skutecznie obalając dominującą teorię korpuskularną Isaaca Newtona."
 curie.402.d_2: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] umieścił przewód, przez który płynął prąd, nad kompasem magnetycznym. Wychylenie igły dowiodło, że prąd elektryczny wytwarza pole magnetyczne, dając początek elektromagnetyzmowi jako dziedzinie łączącej elektryczność i magnetyzm."
 curie.402.d_3: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] wykorzystał opadające ciężarki do obracania mieszadeł łopatkowych w wodzie umieszczonej w izolowanym termicznie naczyniu. Wynikający z tego wzrost temperatury wykazał, że praca mechaniczna zamienia się bezpośrednio w ciepło, potwierdzając zasadę zachowania energii."
 curie.402.d_4: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] sprawdził teorię Dopplera z udziałem trębaczy jadących pociągiem. Zaobserwowana zmiana wysokości dźwięku podczas przejazdu pociągu potwierdziła efekt Dopplera, dowodząc, że ruch zmienia częstotliwość odbieranego dźwięku."
 curie.402.d_5: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] zawiesił ciężkie wahadło na długim drucie. Stopniowy obrót jego płaszczyzny drgań względem podłogi dostarczył bezpośredniego, widocznego dowodu obrotu Ziemi wokół własnej osi bez konieczności prowadzenia obserwacji astronomicznych."
 curie.402.d_6: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] skierował światło przez obracające się koło zębate ku odległemu zwierciadłu. Blokowanie powracającego światła przy znanych prędkościach obrotowych pozwoliło po raz pierwszy zmierzyć prędkość światła metodą ziemską."
 curie.402.d_7: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] zmierzył ładunek elektryczny za pomocą butelki lejdejskiej i galwanometru. Stosunek jednostek elektrostatycznych do elektromagnetycznych dał wartość prędkości światła, dowodząc elektromagnetycznej natury światła."
 curie.402.d_8: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] rozdzielił wiązkę światła na dwie prostopadłe drogi za pomocą czułego interferometru. Brak oczekiwanego przesunięcia prążków interferencyjnych obalił hipotezę eteru światłonośnego, torując drogę Szczególnej Teorii Względności."
 curie.402.d_9: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] wykorzystał obwody z iskiernikami do wytwarzania i wykrywania niewidzialnych fal radiowych. Wykazanie, że rozchodzą się one z prędkością światła i mają takie same właściwości falowe, potwierdziło teorię elektromagnetyczną Maxwella i dało początek łączności bezprzewodowej."
 curie.402.d_10: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] odchylił promienie katodowe za pomocą pól elektrycznego i magnetycznego w lampie próżniowej. Pomiar stosunku ich ładunku do masy ujawnił istnienie ujemnie naładowanych cząstek subatomowych, elektronów, obalając pogląd o niepodzielności atomów."
 curie.402.d_11: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] zawiesił naładowane elektrycznie kropelki oleju między dwiema metalowymi płytkami. Zrównoważenie siły ciężkości siłą elektryczną dowiodło, że ładunek jest skwantowany i występuje w całkowitych wielokrotnościach stałej jednostki, pozwalając dokładnie wyznaczyć ładunek elektronu."
 curie.402.d_12: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] skierował strumień cząstek alfa na cienką złotą folię. Nieoczekiwane odchylenia pod dużymi kątami dowiodły, że masa atomu i jego dodatni ładunek są skupione w niewielkim jądrze w centrum, zastępując dotychczasowy model atomu o jednorodnej budowie."
 curie.402.d_13: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] przepuścił przyspieszone elektrony przez pary rtęci. Okresowe spadki natężenia prądu przy określonych napięciach dowiodły, że atomy pochłaniają energię w odrębnych kwantach, potwierdzając model Bohra ze skwantowanymi poziomami energetycznymi."
 curie.402.d_14: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] sfotografował gwiazdy widoczne w pobliżu Słońca podczas całkowitego zaćmienia. Zaobserwowane ugięcie światła gwiazd pod wpływem grawitacji dostarczyło pierwszego empirycznego dowodu słuszności Ogólnej Teorii Względności."
 curie.402.d_15: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] skierował atomy srebra przez niejednorodne pole magnetyczne. Wiązka rozdzieliła się na dwa wyraźne tory zamiast utworzyć ciągłe pasmo, dowodząc kwantowania przestrzennego i ujawniając istnienie spinu jako wewnętrznej właściwości kwantowej cząstek."
 curie.402.f_1: "W 1801 roku Thomas Young przeprowadził doświadczenie z dwiema szczelinami, aby ustalić fizyczną naturę światła. Skierował pojedynczą wiązkę światła przez dwie wąskie, położone blisko siebie szczeliny na ciemny ekran. Zamiast utworzyć dwie wyraźne jasne linie, wychodzące ze szczelin fale świetlne nałożyły się na siebie, tworząc na ekranie naprzemienne jasne i ciemne prążki. Ten obraz interferencyjny wykazał, że wiązki światła mogą się wzajemnie wzmacniać lub wygaszać, zachowując się tak samo jak fale na wodzie. Wynik dostarczył rozstrzygającego dowodu na rzecz falowej teorii światła, bezpośrednio podważając ugruntowany model korpuskularny Isaaca Newtona."
 curie.402.f_2: "W 1820 roku duński fizyk Hans Christian Ørsted odkrył fundamentalny związek między elektrycznością a magnetyzmem. Podczas pokazu na wykładzie przepuścił prąd elektryczny z baterii przez prosty przewód umieszczony bezpośrednio nad igłą kompasu magnetycznego. Za każdym razem, gdy zamykał obwód, igła kompasu odchylała się prostopadle do przewodu, zamiast wskazywać północ. Po odwróceniu kierunku przepływu prądu igła obracała się w przeciwną stronę. Ten nieoczekiwany wynik dowiódł, że prądy elektryczne wytwarzają pola magnetyczne, łącząc dwie wcześniej odrębne dziedziny fizyki w jedną z jej podstawowych gałęzi, elektromagnetyzm."
 curie.402.f_3: "W 1843 roku James Prescott Joule zmierzył przemianę pracy mechanicznej w energię cieplną za pomocą specjalnego aparatu z mieszadłem łopatkowym. Opadające ciężarki wprawiały w ruch mosiężne mieszadło zanurzone w wodzie w izolowanym termicznie naczyniu. Siła ciężkości wykonywała mierzalną pracę mechaniczną nad układem, a tarcie między łopatkami a cieczą powodowało dokładnie określony wzrost temperatury wody. Porównując ubytek grawitacyjnej energii potencjalnej ciężarków z ciepłem uzyskanym przez ciecz, Joule obliczył stały współczynnik przeliczeniowy. Eksperyment wykazał, że ciepło jest formą energii, ustanawiając zasadę zachowania energii."
 curie.402.f_4: "W 1845 roku holenderski meteorolog Christoph Buys Ballot przeprowadził eksperyment, aby zweryfikować teorię Christiana Dopplera z 1842 roku dotyczącą zmian wysokości dźwięku. Umieścił trębaczy w otwartym wagonie kolejowym, podczas gdy muzycy stojący na ziemi utrzymywali stały dźwięk odniesienia. Gdy lokomotywa przejeżdżała z różnymi prędkościami, trębacze grali jeden ciągły dźwięk. Słuchacze na peronie wyraźnie słyszeli, jak jego wysokość wzrasta podczas zbliżania się pociągu i obniża się podczas jego oddalania. Próba potwierdziła doświadczalnie efekt Dopplera dla fal dźwiękowych, który później zyskał kluczowe znaczenie w astronomii przy pomiarach ruchu gwiazd."
 curie.402.f_5: "W 1851 roku francuski fizyk Léon Foucault zademonstrował obrót Ziemi za pomocą masywnego wahadła zawieszonego w paryskim Panteonie. Na stalowym drucie o długości 67 metrów zawiesił mosiężną kulę o masie 28 kilogramów, umożliwiając jej swobodne wahania w dowolnej płaszczyźnie pionowej przez wiele godzin. W miarę ruchu wahadła jego płaszczyzna drgań stopniowo obracała się względem podłogi zgodnie z ruchem wskazówek zegara. Ponieważ na drut nie działały żadne siły boczne, w rzeczywistości obracała się znajdująca się pod nim podłoga, podczas gdy płaszczyzna drgań pozostawała nieruchoma w przestrzeni. Był to pierwszy prosty dowód obrotu Ziemi wokół własnej osi, uzyskany bez obserwacji astronomicznych."
 curie.402.f_6: "W 1849 roku Hippolyte Fizeau przeprowadził pierwszy udany pomiar prędkości światła metodą ziemską. Skierował silną wiązkę światła między zębami szybko obracającego się koła zębatego ku zwierciadłu oddalonemu o 8.6 kilometra. Odbite światło wracało tą samą drogą. Zwiększając prędkość obrotową koła do momentu, w którym powracający impuls świetlny został całkowicie zablokowany przez sąsiedni ząb, Fizeau ustalił dokładny czas przelotu światła na znanej odległości. Obliczona przez niego prędkość wynosząca około 315,000 kilometrów na sekundę dowiodła, że prędkość światła można dokładnie zmierzyć na Ziemi bez danych astronomicznych."
 curie.402.f_7: "W 1856 roku Wilhelm Weber i Rudolf Kohlrausch zmierzyli stosunek elektrostatycznych i elektromagnetycznych jednostek ładunku elektrycznego. Za pomocą butelki lejdejskiej o dużej pojemności wyznaczyli bezwzględną ilość zgromadzonego ładunku elektrostatycznego. Następnie rozładowali ją przez galwanometr balistyczny, aby zmierzyć siłę magnetyczną wytwarzaną przez przepływający prąd. Ku ich zaskoczeniu stosunek siły elektrostatycznej do elektromagnetycznej odpowiadał prędkości około 310,000 kilometrów na sekundę. Ta stała, niemal identyczna z prędkością światła, stworzyła doświadczalne podstawy teorii Jamesa Clerka Maxwella, zgodnie z którą światło jest falą elektromagnetyczną."
 curie.402.f_8: "W 1887 roku Albert Michelson i Edward Morley podjęli próbę wykrycia ruchu Ziemi względem hipotetycznego eteru światłonośnego. Zbudowali czuły interferometr optyczny umieszczony na ciężkiej kamiennej płycie unoszącej się na rtęci, aby odizolować go od drgań. Dzielnik wiązki rozdzielał światło na dwie prostopadłe drogi, wzdłuż których odbijało się ono od zwierciadeł, po czym obie wiązki ponownie łączyły się na ekranie. Gdyby eter istniał, prędkość orbitalna Ziemi powodowałaby różnicę prędkości światła na obu drogach, wywołując przesunięcie prążków interferencyjnych podczas obracania aparatury. Nie zaobserwowano żadnego przesunięcia, co dowodziło stałości prędkości światła i obalało hipotezę nieruchomego eteru."
 curie.402.f_9: "W 1887 roku Heinrich Hertz zbudował elektryczny nadajnik iskrowy, aby sprawdzić teorię elektromagnetyzmu Jamesa Clerka Maxwella. Iskry powstające pod wpływem wysokiego napięcia w iskierniku nadajnika wytwarzały niewidzialne promieniowanie elektromagnetyczne, które przemieszczało się przez pomieszczenie i wzbudzało drobne iskry w odbiorniku w postaci drucianego pierścienia. Hertz wykazał, że fale te rozchodzą się z prędkością światła i podobnie jak fale świetlne ulegają odbiciu, załamaniu oraz polaryzacji. Eksperyment jednoznacznie dowiódł istnienia fal radiowych, potwierdzając teorię Maxwella łączącą elektryczność i magnetyzm oraz tworząc podstawy współczesnej telekomunikacji bezprzewodowej."
 curie.402.f_10: "W 1897 roku J.J. Thomson badał promienie katodowe wewnątrz szklanej lampy, z której niemal całkowicie usunięto powietrze. Poddając wiązkę działaniu pól elektrycznego i magnetycznego, obserwował jej odchylenie i mierzył stosunek ładunku do masy poruszających się cząstek. Thomson odkrył, że niezależnie od materiału użytego do wykonania katody promienie składały się z ujemnie naładowanych cząstek ponad 1,000 razy lżejszych od atomu wodoru. Dowiodło to, że atomy nie są niepodzielnymi kulami, lecz mają złożoną strukturę. Odkrycie elektronu, pierwszej zidentyfikowanej cząstki subatomowej, zasadniczo odmieniło fizykę atomową."
 curie.402.f_11: "W 1909 roku Robert A. Millikan zmierzył ładunek pojedynczego elektronu za pomocą szczelnej komory wyposażonej w płytki elektrodowe. Rozpylił w niej drobne kropelki oleju i zjonizował je promieniami rentgenowskimi. Regulując napięcie między płytkami, Millikan równoważył skierowaną ku górze siłę elektrostatyczną z siłą ciężkości, utrzymując pojedyncze naładowane kropelki nieruchomo w powietrzu. Analiza setek kropelek wykazała, że każdy ładunek elektryczny jest całkowitą wielokrotnością jednej podstawowej jednostki. Eksperyment dowiódł kwantowania ładunku i pozwolił dokładnie wyznaczyć wartość ładunku elementarnego."
 curie.402.f_12: "W 1911 roku Ernest Rutherford skierował wiązkę dodatnio naładowanych cząstek alfa na cienką złotą folię otoczoną ekranem detekcyjnym pokrytym siarczkiem cynku. Większość cząstek przeszła przez nią bez zmiany kierunku, lecz niewielka część odchyliła się pod dużymi kątami, a około 1 na 8,000 odbiła się wprost do tyłu. Ten zaskakujący wynik obalił model „ciasta z rodzynkami” Thomsona, zakładający równomierne rozmieszczenie ładunku. Rutherford doszedł do wniosku, że niemal cała masa atomu i jego dodatni ładunek są skupione w niewielkim, gęstym jądrze położonym w centrum, otoczonym niemal pustą przestrzenią, w której krążą elektrony."
 curie.402.f_13: "W 1914 roku James Franck i Gustav Hertz dostarczyli bezpośredniego dowodu słuszności kwantowego modelu atomu Nielsa Bohra. Przyspieszali elektrony w szklanej rurze wypełnionej parami rtęci, kierując je ku siatce zbierającej. Wraz ze wzrostem napięcia przyspieszającego natężenie prądu elektronowego rosło, lecz gwałtownie spadało w regularnych odstępach co 4.9 wolta. Wykazało to, że podczas zderzeń z atomami rtęci elektrony traciły energię wyłącznie w określonych porcjach. Okresowe spadki potwierdziły, że atomy pochłaniają energię w stałych porcjach kwantowych, dostarczając pierwszego wyraźnego dowodu istnienia skwantowanych poziomów energetycznych atomów."
 curie.402.f_14: "Podczas całkowitego zaćmienia Słońca w maju 1919 roku Arthur Eddington kierował wyprawami na Wyspę Książęcą i do Brazylii, aby sprawdzić Ogólną Teorię Względności Alberta Einsteina. Gdy Księżyc przesłonił blask Słońca, astronomowie sfotografowali gromady gwiazd widoczne w pobliżu krawędzi tarczy słonecznej. Porównanie tych zdjęć z fotografiami odniesienia wykonanymi nocą wykazało, że wskutek przejścia światła gwiazd przez pole grawitacyjne Słońca ich pozorne położenie przesunęło się nieznacznie na zewnątrz. Zmierzone ugięcie światła odpowiadało matematycznym przewidywaniom Einsteina, a nie fizyce newtonowskiej, dostarczając pierwszego obserwacyjnego potwierdzenia Ogólnej Teorii Względności."
 curie.402.f_15: "W 1922 roku Otto Stern i Walther Gerlach skierowali wiązkę atomów srebra w stanie gazowym przez niejednorodne pole magnetyczne na szklaną płytkę detekcyjną. Fizyka klasyczna przewidywała, że atomowe dipole magnetyczne będą ustawione losowo, tworząc gładki, ciągły rozkład osadu srebra. Tymczasem wiązka atomów rozdzieliła się wyraźnie na dwie odrębne składowe, tworząc na płytce dwie oddzielne linie. To nieoczekiwane rozszczepienie wykazało kwantowanie przestrzenne i dostarczyło wczesnych dowodów na istnienie wewnętrznego momentu pędu, później rozpoznanego jako spin elektronu, zasadniczo zmieniając mechanikę kwantową."
 curie.402.g: "Eureka!"
 curie.403.t: "Udany Eksperyment"
 curie.403.d: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] ogłosił dziś z wielką satysfakcją, że [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis] eksperyment przebiegł dokładnie zgodnie z planem. Choć nie jest to odkrycie, które wstrząśnie światem, znacząco poszerzyło zasób wiedzy światowej fizyki."
 curie.403.f: "„Nic nie jest zbyt niezwykłe, by mogło być prawdziwe, jeśli pozostaje w zgodzie z prawami natury”. -Michael Faraday"
 curie.403.g: "Dobrze."
 curie.404.t: "Eksperyment Fizyczny nie powiódł się!"
 curie.404.d: "Eksperyment przeprowadzony przez Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] zakończył się katastrofalnym niepowodzeniem. Teraz pora posprzątać odłamki."
 curie.404.f: "„Pełna świadomość własnej niewiedzy jest wstępem do każdego rzeczywistego postępu w nauce”. -James Clerk Maxwell"
 curie.404.g: "BUM!"
