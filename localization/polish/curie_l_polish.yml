 curie_nuclear_reactor_tech: "Reaktor jądrowy"
 curie_nuclear_reactor_tech_desc: "Droga do kontrolowanego rozszczepienia jądrowego rozpoczęła się w 1942 roku wraz z Chicago Pile-1, pierwszym na świecie sztucznym reaktorem jądrowym, który pod trybunami stadionu zademonstrował samopodtrzymującą się reakcję łańcuchową. Na tej podstawie powstał następnie grafitowy reaktor X-10 w Tennessee, służący jako instalacja pilotażowa do testowania produkcji plutonu na dużą skalę oraz metod postępowania z intensywnym promieniowaniem. Kulminacją tej epoki był reaktor B w Hanford, pierwszy na świecie pełnoskalowy reaktor produkcyjny, który ostatecznie uczynił przemysłowe wykorzystanie energii jądrowej rzeczywistością."
 curie_the_bomb_tech: "Bomba"
 curie_the_bomb_tech_desc: "„Teraz stałem się Śmiercią, niszczycielem światów.”"
 curie_nuclear_fission_tech: "Rozszczepienie jądrowe"
 curie_nuclear_fission_tech_desc: "Pod koniec lat 30. XX wieku naukowcom po raz pierwszy udało się rozszczepić ciężkie jądra atomowe poprzez bombardowanie ich neutronami, uwalniając tym samym niewyobrażalne wcześniej źródło energii ukryte w materii. Ten przełom naukowy wyznaczył przejście od fizyki teoretycznej do praktycznego opanowania sił spajających wszechświat."
 curie_facility_can_construct_only_facility_tt: "Nie mamy jeszcze Ośrodka Badań Jądrowych."
 curie_rocket_science_tech: "Nauka Rakietowa"
 curie_rocket_science_tech_desc: "Na przełomie XIX i XX wieku nauka o rakietach przeszła od fantastyki naukowej do rygorystycznych podstaw teoretycznych, w dużej mierze dzięki pionierskim pracom rosyjskiego wizjonera Konstantina Ciołkowskiego. W swojej przełomowej pracy z 1903 roku Ciołkowski wyprowadził podstawowe równanie rakietowe, dowodząc matematycznej możliwości podróży kosmicznych z wykorzystaniem rakiet wielostopniowych i paliw ciekłych. Transylwańsko-niemiecki fizyk Hermann Oberth niezależnie rozwinął zasady astronautyki w latach 20. XX wieku, tworząc podstawy inżynieryjne, które później zainspirowały pierwsze pokolenie konstruktorów praktycznych rakiet."
 curie_modern_rockets_tech: "Nowoczesne rakiety"
 curie_modern_rockets_tech_desc: "Robert Goddard wprowadził naukę o rakietach w erę praktyczną, wystrzeliwując pierwsze rakiety napędzane paliwem ciekłym i opracowując kluczowe systemy, takie jak stabilizacja żyroskopowa. W Niemczech badania nabrały tempa za sprawą Verein für Raumschiffahrt, gdzie młody Wernher von Braun zaczął doskonalić rozwiązania inżynieryjne niezbędne do budowy dużych systemów napędowych. Okres ten doprowadził ostatecznie do przejścia od prywatnych eksperymentów do ogromnych projektów finansowanych przez państwo, czego kulminacją było opracowanie pierwszych rakiet zdolnych dotrzeć do granic przestrzeni kosmicznej."
 alert_curie_physicist_will_retire_soon_alert_name: "[concept_curie_physicist] bliski emerytury"
 alert_curie_physicist_will_retire_soon_alert_desc: "Twój [concept_curie_physicist] zbliża się do emerytury. Warto rozważyć znalezienie zastępcy."
 curie_physicist_will_retire_soon_alert_setting_name: "#tooltip:[GetRawTextTooltipTag('mr_morgenroete_tt')] @mr_morgenroete_icon! #! [concept_curie_physicist] bliski emerytury"
 alert_curie_physicist_will_retire_soon_alert_hint: "Twój [concept_curie_physicist] przejdzie na emeryturę w ciągu najbliższych #V 5 lat#!. Warto rozważyć znalezienie nowego fizyka, który go zastąpi."
 alert_curie_physicist_will_retire_soon_alert_action: "$mr_alert_send_to_science_mathematics$"
 curie_differential_geometry_tech: "Geometria Różniczkowa"
 curie_differential_geometry_tech_desc: "Zapoczątkowana przez Gaussa w XIX wieku geometria różniczkowa wykorzystuje zaawansowaną matematykę do opisywania zachowania krzywych i powierzchni w świecie rzeczywistym. Pierwotnie rozwijana w celu tworzenia dokładniejszych map i pomiarów Ziemi, pozwoliła naukowcom obliczać kształty i odległości za pomocą wzorów, zamiast opierać się wyłącznie na obserwacji."
