 je_curie_improve_mathematics_project: "Ulepsz Matematykę"
 je_curie_improve_mathematics_project_reason: "Twój [concept_curie_physicist] Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] skupia się na usprawnieniu produkcji w budynku [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] w regionie [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName].\n$mr_divider_for_je$\nProjekt będzie zyskiwać postęp co miesiąc. Za każdym razem, gdy postęp osiągnie 24, obecny budynek otrzyma nowy modyfikator. Projekt zakończy się, gdy wszystkie wybrane do niego budynki otrzymają komplet modyfikatorów.\nŁącznie dostępne są 3 modyfikatory. Uzyskanie każdego kolejnego wymaga ponownego zapełnienia paska postępu.\nGdy budynek [GetBuildingType('building_university').GetName] otrzyma wszystkie modyfikatory, zyskasz również #p 1#! @curie_physical_data! [concept_curie_physical_data].\n$mr_divider_for_je$\nObecny Budynek: [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] w regionie [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_mathematics_project_modifier_1_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_mathematics_project_modifier_2_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_mathematics_project_modifier_3_type')]\n\nŁączna liczba pozostałych budynków (bez obecnego): [JournalEntry.MakeScope.Var('mr_number_of_remaining_list_entries_var').GetValue|V0]\n$concept_curie_physical_data$ z Projektu: [JournalEntry.MakeScope.ScriptValue('curie_physical_data_from_mathematics_project_value')|+0] @curie_physical_data!#!#!"
