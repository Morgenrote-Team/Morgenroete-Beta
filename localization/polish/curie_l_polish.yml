 curie.100.t: "Towarzystwo Magnetyczne"
 curie.100.d: "Dr. [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetLastName] oddał dziś do użytku Obserwatorium Geomagnetyczne. Będzie ono sercem nowo założonego Stowarzyszenia Magnetycznego i wzorem dla podobnych placówek na całym świecie. Trzykrotne hurra dla nauki!"
 curie.100.f: "Stowarzyszenie Magnetyczne (Magnetischer Verein) było pierwszym międzynarodowym stowarzyszeniem naukowym. Zostało założone w 1834 roku w Getyndze przez Carla Friedricha Gaussa i Wilhelma Webera. Koordynowało prowadzone na całym świecie, zsynchronizowane pomiary ziemskiego pola magnetycznego w sieci obserwatoriów rozmieszczonych na całym globie."
 curie.101.t: "Nowy Członek Stowarzyszenia Magnetycznego"
 curie.101.d: "[GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetFullName] dołączył dziś do Stowarzyszenia Magnetycznego w [GetPlayer.GetCustom('curie_magnetic_association_city')]. Pozostali członkowie serdecznie powitali [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetHerHim]."
 curie.101.f: "Dzięki dołączeniu do stowarzyszenia Dr. [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetLastName] zdobył również niezbędną wiedzę do budowy sprawnego Obserwatorium Geomagnetycznego. Przewodniczący przekazał naszemu fizykowi plany takiej stacji oraz magnetometr. Całe stowarzyszenie nalegało, aby jak najszybciej rozpocząć budowę i przesłać pierwsze dane do [GetPlayer.GetCustom('curie_magnetic_association_city')]."
 curie.101.g: "Powinniśmy natychmiast zbudować stację pomiarową."
 curie.102.t: "Ukończono Budowę Obserwatorium Geomagnetycznego"
 curie.102.d: "Budowa Obserwatorium Geomagnetycznego została dziś ukończona. W ciągu ostatnich miesięcy zgromadzono wiele danych i przekazano je do [GetPlayer.GetCustom('curie_magnetic_association_city')]."
 curie.102.f: "Uzyskane dane pomiarowe służą nie tylko badaniom naukowym ziemskiego pola magnetycznego, ale mają również praktyczne zastosowanie. Mapy deklinacji magnetycznej były wykorzystywane w przeszłości i nadal są używane do nawigacji w żegludze i lotnictwie. Dane z pomiarów geomagnetycznych mają również istotne znaczenie przy poszukiwaniu złóż surowców, takich jak rudy metali i ropa naftowa."
 curie.102.g: "Za naukę geomagnetyczną!"
 curie.103.t: "Międzynarodowe Gromadzenie Danych Magnetycznych"
 curie.103.d: "Po latach gromadzenia i porównywania danych geomagnetycznych z całego świata naukowcy w [GetPlayer.GetCustom('curie_magnetic_association_city')] doszli do interesującego wniosku."
 curie.103.f: "Geofizyka i geomagnetyzm mają wiele praktycznych zastosowań. Szczególne korzyści odniosło górnictwo dzięki możliwości odkrywania potencjalnych złóż. Duże przedsiębiorstwa wykorzystywały wiedzę geofizyczną do lokalizowania nieznanych wcześniej złóż żelaza, ołowiu i ropy naftowej. Dzięki odpowiednim technologiom oraz mapowaniu ziemskiego pola magnetycznego powinniśmy bez trudu móc praktycznie wykorzystać obecną wiedzę teoretyczną."
 curie.103.g: "Potrzebujemy więcej danych naukowych."
 curie.103.h: "Pomoże to w poszukiwaniu złóż żelaza."
 curie.103.i: "Pomoże to w poszukiwaniu złóż ołowiu."
 curie.103.j: "Pomoże to w poszukiwaniu złóż miedzi."
 curie.103.k: "Pomoże to w poszukiwaniu złóż ropy naftowej."
 curie.104.t: "Zainteresowanie Żeglugą"
 curie.104.d: "[SCOPE.sCharacter('curie_admiral_scope').GetFullName] wyraził duże zainteresowanie badaniami geomagnetycznymi prowadzonymi przez [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetFullName]. Przeprowadził udany eksperyment w Obserwatorium Geomagnetycznym, które jest obecnie w budowie."
 curie.104.f: "„Co zrobię z żabimi udkami? Och, nic szczególnego, absolutnie nic...”"
 curie.104.g: "Nowa wiedza powinna mu się przydać."
 curie.104.h: "Ta wiedza powinna przynieść korzyści wszystkim."
 curie.105.t: "Anomalia"
 curie.105.d: "Pomimo ponowienia pomiarów wyniki dotyczące ziemskiego pola magnetycznego, które odnotował Dr. [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetLastName], znacznie odbiegają od oczekiwanych. Jak dotąd nie udało mu się znaleźć przyczyny tego zjawiska."
 curie.105.f: "Istnieje wiele przyczyn, dla których ziemskie pole magnetyczne może różnić się w poszczególnych miejscach. Takie zjawiska często prowadziły do przypuszczeń, że w danym miejscu może znajdować się duże złoże metali, dlatego badania geomagnetyczne miały niemałe znaczenie dla górnictwa."
 curie.105.g: "Powinniśmy przesłać dane bezpośrednio do [GetPlayer.GetCustom('curie_magnetic_association_city')]."
 curie.106.t: "Astronom Konsultuje się z Obserwatorium Geomagnetycznym"
 curie.106.d: "Dr. [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetFullName] i Dr. [GetPlayer.MakeScope.GetVariable('verrier_astronomer_var').GetCharacter.GetFullName] odbyli kilka inspirujących rozmów podczas zwiedzania nowo wybudowanego Obserwatorium Geomagnetycznego. Ta wymiana myśli znacznie poszerzyła wiedzę naukową Dr. [GetPlayer.MakeScope.GetVariable('verrier_astronomer_var').GetCharacter.GetLastName]."
 curie.106.f: "„A więc TO dlatego kromka chleba z dżemem zawsze spada na podłogę stroną posmarowaną dżemem!”"
 curie.106.g: "Pomoże to [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetHerHim] w [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetHerHis] badaniach praktycznych."
 curie.106.h: "Pomoże to [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetHerHim] w [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetHerHis] badaniach teoretycznych."
 curie.107.t: "Atlas Magnetyczny"
 curie.107.d: "Dr. [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetFullName] opublikował pierwszy Atlas Geomagnetyczny Ziemi. Książka ma szansę stać się podstawowym dziełem naukowym z zakresu fizyki!"
 curie.107.f: "XIX-wieczny Atlas Geomagnetyczny, znany zazwyczaj pod oficjalnym tytułem „Atlas Magnetyzmu Ziemskiego”, to pionierskie dzieło z zakresu geofizyki i kartografii. Został wydany w Lipsku w 1840 roku pod redakcją matematyka Carla Friedricha Gaussa i fizyka Wilhelma Webera. Po raz pierwszy zebrano w nim globalne pomiary ziemskiego pola magnetycznego, opierając je na ścisłych podstawach matematycznych i przedstawiając na mapach. Atlas zawiera 18 szczegółowych map i diagramów Ziemi oraz wykazał, że główne źródło ziemskiego pola magnetycznego znajduje się we wnętrzu naszej planety."
 curie.107.g: "Tę wiedzę należy wykorzystać w rozważaniach teoretycznych."
 curie.107.h: "Tę wiedzę należy wykorzystać w praktyce."
