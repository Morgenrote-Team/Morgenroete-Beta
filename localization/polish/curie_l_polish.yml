 je_curie_agricultural_weather_service: "Rolnicza Służba Meteorologiczna"
 je_curie_agricultural_weather_service_reason: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] poświęcił [ROOT.Var('curie_physicist_var').GetCharacter.GetHerselfHimself] całkowicie meteorologii rolniczej, a [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis] raporty pogodowe skupiają się na prognozach szczególnie ważnych dla rolników w kraju. Niezależnie od tego, czy chodzi o susze, burze czy powodzie, wcześniejsze ostrzeżenia pozwalają miejscowemu sektorowi rolniczemu odpowiednio się przygotować, dzięki czemu skutki warunków meteorologicznych i klimatycznych są mniej dotkliwe.\n\nSiła [concept_modifier] zależy w dużej mierze od doświadczenia [concept_curie_meteorological_physicist]."
 je_curie_marine_weather_service: "Prognoza Pogody dla Żeglugi"
 je_curie_marine_weather_service_reason: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] zobowiązał się wobec Ministerstwa Marynarki Wojennej do zwiększenia bezpieczeństwa żeglugi, a przede wszystkim floty, oraz do prognozowania potencjalnych sztormów i innych zagrożeń na morzu. Może się to okazać szczególnie przydatne w czasie wojny.\n\nSiła [concept_modifier] zależy w dużej mierze od doświadczenia [concept_curie_meteorological_physicist]."
 curie.501.t: "Koniec Prognozy Pogody"
 curie.501.d: "Po kilku latach spędzonych głównie na przygotowywaniu prognoz pogody dla społeczeństwa na zlecenie państwa Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] powraca do świata nauki. [ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe|U] coraz gorzej znosił zainteresowanie opinii publicznej."
 curie.501.f: "Nasz meteorolog wkrótce znów będzie w [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis] dawnej formie, gdy [ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe] ponownie znajdzie czas na [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis] zupełnie niezrozumiałe przyrządy i całkowicie bezsensowne badania. Kto w ogóle traktuje tę naukę poważnie?"
 curie.501.a: "To facet od pogody!"
 curie.501.b: "To kobieta od pogody!"
 curie_weather_station_expansion_cost_modifier: "Koszt Rozbudowy Stacji Meteorologicznej"
 je_curie_weather_station_expansion: "Rozbudowa Stacji Meteorologicznej"
 je_curie_weather_station_expansion_reason: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] niestrudzenie pracuje w obserwatorium nad unowocześnieniem znajdującej się tam stacji meteorologicznej. Stan krajowej stacji meteorologicznej ma kluczowe znaczenie dla prognozowania zjawisk pogodowych w całym kraju."
 je_curie_weather_station_expansion_progress_complete_tt: "Postęp osiągnął #V 36#!."
 curie_weather_station_expansion_progress_bar: "Rozbudowa Stacji Meteorologicznej"
 curie_weather_station_expansion_progress_bar_desc: "Postęp Rozbudowy Stacji Meteorologicznej: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|1%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/36)"
 curie.502.t: "Stacja Meteorologiczna Rozbudowana"
 curie.502.d: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] z dumą ogłasza ukończenie nowej stacji meteorologicznej przy obserwatorium. Stanowi ona teraz bijące serce krajowego systemu meteorologicznego i usprawni ostrzeganie przed groźnymi zjawiskami pogodowymi w całym kraju!"
 curie.502.f: "Pierwsze sieci obserwacyjne stosujące jednolite standardy powstały w XVII i XVIII wieku. Wynalezienie telegrafu elektrycznego zrewolucjonizowało obserwacje, umożliwiając zbieranie danych w czasie rzeczywistym z rozległych obszarów. Później rządy zaczęły tworzyć wyspecjalizowane instytucje krajowe, takie jak brytyjskie Biuro Meteorologiczne (1854) i amerykańskie Biuro Pogodowe (1870)."
 curie.502.g: "Jaka będzie jutro pogoda?"
 curie.511.g: "[ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe|U] to prawdziwy łowca chmur!"
 curie.521.g: "To druga najwspanialsza chmura, jaką kiedykolwiek widziałem!"
 curie.511.d: "Przy dobrej pogodzie Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] zdołał dokładnie zaobserwować i zbadać #V Chmury Cirrus#! oraz wyciągnąć na tej podstawie nowe wnioski meteorologiczne. Po raz pierwszy opisano ten rodzaj chmur w państwie [GetPlayer.GetName]!"
 curie.512.d: "Przy dobrej pogodzie Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] zdołał dokładnie zaobserwować i zbadać #V Chmury Cirrocumulus#! oraz wyciągnąć na tej podstawie nowe wnioski meteorologiczne. Po raz pierwszy opisano ten rodzaj chmur w państwie [GetPlayer.GetName]!"
 curie.513.d: "Przy dobrej pogodzie Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] zdołał dokładnie zaobserwować i zbadać #V Chmury Cirrostratus#! oraz wyciągnąć na tej podstawie nowe wnioski meteorologiczne. Po raz pierwszy opisano ten rodzaj chmur w państwie [GetPlayer.GetName]!"
 curie.514.d: "Przy dobrej pogodzie Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] zdołał dokładnie zaobserwować i zbadać #V Chmury Altocumulus#! oraz wyciągnąć na tej podstawie nowe wnioski meteorologiczne. Po raz pierwszy opisano ten rodzaj chmur w państwie [GetPlayer.GetName]!"
 curie.515.d: "Przy dobrej pogodzie Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] zdołał dokładnie zaobserwować i zbadać #V Chmury Altostratus#! oraz wyciągnąć na tej podstawie nowe wnioski meteorologiczne. Po raz pierwszy opisano ten rodzaj chmur w państwie [GetPlayer.GetName]!"
 curie.516.d: "Przy dobrej pogodzie Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] zdołał dokładnie zaobserwować i zbadać #V Chmury Nimbostratus#! oraz wyciągnąć na tej podstawie nowe wnioski meteorologiczne. Po raz pierwszy opisano ten rodzaj chmur w państwie [GetPlayer.GetName]!"
 curie.517.d: "Przy dobrej pogodzie Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] zdołał dokładnie zaobserwować i zbadać #V Chmury Stratocumulus#! oraz wyciągnąć na tej podstawie nowe wnioski meteorologiczne. Po raz pierwszy opisano ten rodzaj chmur w państwie [GetPlayer.GetName]!"
 curie.518.d: "Przy dobrej pogodzie Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] zdołał dokładnie zaobserwować i zbadać #V Chmury Stratus#! oraz wyciągnąć na tej podstawie nowe wnioski meteorologiczne. Po raz pierwszy opisano ten rodzaj chmur w państwie [GetPlayer.GetName]!"
 curie.519.d: "Przy dobrej pogodzie Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] zdołał dokładnie zaobserwować i zbadać #V Chmury Cumulus#! oraz wyciągnąć na tej podstawie nowe wnioski meteorologiczne. Po raz pierwszy opisano ten rodzaj chmur w państwie [GetPlayer.GetName]!"
 curie.520.d: "Przy dobrej pogodzie Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] zdołał dokładnie zaobserwować i zbadać #V Chmury Cumulonimbus#! oraz wyciągnąć na tej podstawie nowe wnioski meteorologiczne. Po raz pierwszy opisano ten rodzaj chmur w państwie [GetPlayer.GetName]!"
 curie.521.d: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] nie wierzy [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis] własnym oczom: podczas spaceru po [SCOPE.sState('curie_cloud_state').GetCityHubName] [ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe] nagle dostrzega srebrzyste pasma na niebie. Czyżby był to rodzaj chmur, który do tej pory pozostawał zupełnie nieznany?"
 curie.522.d: "Podczas wyprawy polarnej załoga sterowca dokonała niezwykłego odkrycia: nagle na niebie pojawiły się tęczowo mieniące się chmury! Wyglądało to tak, jakby na niebie zawisła masa perłowa!"
