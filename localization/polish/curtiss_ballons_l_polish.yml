 curtiss_distance_description_distance_record_country: "[ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] ustanowił nowy rekord odległości dla naszego kraju swoim [SCOPE.sCharacter('curtiss_balloonist_scope').GetHerHis] balonem! Z wynikiem #b #p [ROOT.Var('new_balloon_distance_var').GetValue]#! kilometrów#! [SCOPE.sCharacter('curtiss_balloonist_scope').GetSheHe] zdołał wyraźnie pobić dotychczasowy rekord naszego kraju wynoszący #b #p [ROOT.Var('curtiss_balloon_distance_record_var').GetValue]#! kilometrów#!. Niestety nie wystarczyło to jednak do pobicia rekordu świata wynoszącego #b #p [GetGlobalVariable('curtiss_balloon_distance_record_global_var').GetValue]#! kilometrów#! [GetGlobalVariable('curtiss_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon]. Czas #b #n [ROOT.Var('new_balloon_time_var').GetValue]#! godzin#! niestety nie wystarczył do pobicia naszego rekordu krajowego wynoszącego #b #p [ROOT.Var('curtiss_balloon_time_record_var').GetValue]#! godzin#!"
 curtiss_distance_description_time_record_country: "[ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] ustanowił nowy rekord czasu lotu dla naszego kraju swoim [SCOPE.sCharacter('curtiss_balloonist_scope').GetHerHis] balonem! Z wynikiem #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! godzin#! [SCOPE.sCharacter('curtiss_balloonist_scope').GetSheHe] zdołał pobić dotychczasowy rekord naszego kraju wynoszący #b #p [ROOT.Var('curtiss_balloon_time_record_var').GetValue]#! godzin#!. Niestety nie wystarczyło to jednak do pobicia rekordu świata wynoszącego #b #p [GetGlobalVariable('curtiss_balloon_time_record_global_var').GetValue]#! godzin#! [GetGlobalVariable('curtiss_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon] Rekordu odległości naszego kraju wynoszącego #b #p [ROOT.Var('curtiss_balloon_distance_record_var').GetValue]#! kilometrów#! również nie udało się pobić przy wyniku #b #n [ROOT.Var('new_balloon_distance_var').GetValue]#! kilometrów#!."
 curtiss_distance_description_both_records_country: "[ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] ustanowił nowy rekord odległości oraz nowy rekord ciągłości lotu dla naszego kraju swoim [SCOPE.sCharacter('curtiss_balloonist_scope').GetHerHis] balonem! Z wynikiem #b #p [ROOT.Var('new_balloon_distance_var').GetValue]#! kilometrów#! [SCOPE.sCharacter('curtiss_balloonist_scope').GetSheHe] zdołał wyraźnie pobić dotychczasowy rekord naszego kraju wynoszący #b #p [ROOT.Var('curtiss_balloon_distance_record_var').GetValue]#! kilometrów#!. Nie wystarczyło to jednak do pobicia rekordu świata wynoszącego #b #p [GetGlobalVariable('curtiss_balloon_distance_record_global_var').GetValue]#! kilometrów#! [GetGlobalVariable('curtiss_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon]. Z czasem #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! godzin#! pobity został również krajowy rekord wynoszący #b #p [ROOT.Var('curtiss_balloon_time_record_var').GetValue]#! godzin#!, ale nie rekord świata wynoszący #b #p [GetGlobalVariable('curtiss_balloon_time_record_global_var').GetValue]#! godzin#! [GetGlobalVariable('curtiss_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon]"
 curtiss_distance_description_distance_record_global: "[ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] ustanowił nowy rekord świata odległości lotu swoim [SCOPE.sCharacter('curtiss_balloonist_scope').GetHerHis] balonem! Z wynikiem #b #p [ROOT.Var('new_balloon_distance_var').GetValue]#! kilometrów#! [SCOPE.sCharacter('curtiss_balloonist_scope').GetSheHe] zdołał pobić dotychczasowy rekord naszego kraju wynoszący #b #p [ROOT.Var('curtiss_balloon_distance_record_var').GetValue]#! kilometrów#! i wyraźnie poprawić rekord świata wynoszący #b #p [GetGlobalVariable('curtiss_balloon_distance_record_global_var').GetValue]#! kilometrów#! [GetGlobalVariable('curtiss_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon]. Czas lotu wynoszący #b #n [ROOT.Var('new_balloon_time_var').GetValue]#! godzin#! niestety nie wystarczył do pobicia rekordu świata wynoszącego #b #p [GetGlobalVariable('curtiss_balloon_time_record_global_var').GetValue]#! godzin#! [GetGlobalVariable('curtiss_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon]"
 curtiss_distance_description_time_record_global: "[ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] ustanowił nowy rekord świata czasu lotu swoim [SCOPE.sCharacter('curtiss_balloonist_scope').GetHerHis] balonem! Z wynikiem #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! godzin#! [SCOPE.sCharacter('curtiss_balloonist_scope').GetSheHe] zdołał pobić dotychczasowy rekord naszego kraju wynoszący #b #p [ROOT.Var('curtiss_balloon_time_record_var').GetValue]#! godzin#! i wyraźnie poprawić rekord świata wynoszący #b #p [GetGlobalVariable('curtiss_balloon_time_record_global_var').GetValue]#! godzin#! [GetGlobalVariable('curtiss_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon]. Odległość wynosząca #b #n [ROOT.Var('new_balloon_distance_var').GetValue]#! kilometrów#! niestety nie wystarczyła do pobicia rekordu świata wynoszącego #b #p [GetGlobalVariable('curtiss_balloon_distance_record_global_var').GetValue]#! kilometr#! [GetGlobalVariable('curtiss_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon]"
 curtiss_distance_description_both_records_global: "[ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] ustanowił nowy rekord świata odległości i czasu lotu swoim [SCOPE.sCharacter('curtiss_balloonist_scope').GetHerHis] balonem! Z wynikiem #b #p [ROOT.Var('new_balloon_distance_var').GetValue]#! kilometrów#! [SCOPE.sCharacter('curtiss_balloonist_scope').GetSheHe] zdołał pobić dotychczasowy rekord naszego kraju wynoszący #b #p [ROOT.Var('curtiss_balloon_distance_record_var').GetValue]#! kilometrów#! i wyraźnie poprawić rekord świata wynoszący #b #p [GetGlobalVariable('curtiss_balloon_distance_record_global_var').GetValue]#! kilometrów#! [GetGlobalVariable('curtiss_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon]. Rekord świata czasu lotu wynoszący #b #p [GetGlobalVariable('curtiss_balloon_time_record_global_var').GetValue]#! godzin#! [GetGlobalVariable('curtiss_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon] został również pobity dzięki lotowi trwającemu #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! godzin#!."
 curtiss.655.t1: "[ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] nie zdołał pobić rekordu ciągłości lotu balonem"
 curtiss.655.t2: "[ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] ustanowił nowy rekord najdłuższego lotu balonem dla naszego kraju"
 curtiss.655.t3: "[ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] latał swoim [SCOPE.sCharacter('curtiss_balloonist_scope').GetHerHis] balonem dłużej niż jakikolwiek człowiek kiedykolwiek wcześniej!"
 curtiss.655.d1: "[ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] próbował latać swoim [SCOPE.sCharacter('curtiss_balloonist_scope').GetHerHis] balonem jak najdłużej. Z czasem lotu wynoszącym #b #n [ROOT.Var('new_balloon_time_var').GetValue]#! godzin#! [SCOPE.sCharacter('curtiss_balloonist_scope').GetSheHe] nie zdołał pobić dotychczasowego rekordu naszego kraju wynoszącego #b #p [ROOT.Var('curtiss_balloon_time_record_var').GetValue]#! godzin#!. [SCOPE.sCharacter('curtiss_balloonist_scope').GetSheHe|U] z pewnością spróbuje ponownie."
 curtiss.655.d2: "[ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] has set a new record for the longest lasting flight for our country with [SCOPE.sCharacter('curtiss_balloonist_scope').GetHerHis] balloon! With a flight time of #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! hours#!, [SCOPE.sCharacter('curtiss_balloonist_scope').GetSheHe] beat our country's previous record of #b #p [ROOT.Var('curtiss_balloon_time_record_var').GetValue]#! hours#!. But unfortunately it was not enough for the world record of #b #p [GetGlobalVariable('curtiss_balloon_time_record_global_var').GetValue]#! hours#! [GetGlobalVariable('curtiss_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon]."
 curtiss.655.d3: "[ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] ustanowił nowy rekord świata najdłuższego lotu swoim [SCOPE.sCharacter('curtiss_balloonist_scope').GetHerHis] balonem! Z czasem lotu wynoszącym #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! godzin#! [SCOPE.sCharacter('curtiss_balloonist_scope').GetSheHe] zdołał pobić dotychczasowy rekord naszego kraju wynoszący #b #p [ROOT.Var('curtiss_balloon_time_record_var').GetValue]#! godzin#! i wyraźnie poprawić rekord świata wynoszący #b #p [GetGlobalVariable('curtiss_balloon_time_record_global_var').GetValue]#! godzin [GetGlobalVariable('curtiss_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon].#!"
 curtiss.655.f1: "„Tym razem mi się nie udało. Ale następnym razem na pewno dam radę!”"
 curtiss.655.f2: "„Kogo obchodzi taki rekord? Chcę rekordu świata!”"
 curtiss.655.f3: "„To była bułka z masłem!”"
 curtiss.655.g: "Powodzenia następnym razem!"
 curtiss.655.h: "Dobra robota!"
 curtiss.655.i: "Wspaniale! Gratulacje!"
 curtiss.656.t: "[SCOPE.sCharacter('curtiss_balloonist_scope').GetFullName] boi się wysokości i rezygnuje z baloniarstwa"
 curtiss.656.d: "Chociaż twierdził, że odbył już całkiem sporo lotów balonem, [SCOPE.sCharacter('curtiss_balloonist_scope').GetFullName] odkrył, że boi się wysokości, gdy podczas swojego pierwszego lotu dla naszego kraju znalazł się na wysokości dziesięciu metrów. Dlatego rezygnuje z baloniarstwa."
 curtiss.656.f: "„To straszne! Dwa tygodnie temu latałem na ogromnych wysokościach, a teraz... Teraz nie potrafię nawet wejść po drabinie!”"
 curtiss.656.g: "Co za pech..."
 curtiss.656.h: "Argh! Czy jest jeszcze jakiś baloniarz, którego moglibyśmy sponsorować?"
 curtiss.670.t: "[SCOPE.sCharacter('curtiss_balloonist_scope').GetFullName] ginie w wypadku balonowym"
 curtiss.670.d: "[SCOPE.sCharacter('curtiss_balloonist_scope').GetFullName] rozbił się podczas [SCOPE.sCharacter('curtiss_balloonist_scope').GetHerHis] lotu balonem i zginął. Tym samym tracimy bohatera lotnictwa."
 curtiss.670.f: "[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloonist_death_type')]"
 curtiss.670.g: "Jakie to straszne!"
 curtiss.670.h: "Straszne! Czy jest jeszcze jakiś baloniarz, którego moglibyśmy sponsorować?"
 curtiss.671.t: "[SCOPE.sCharacter('curtiss_balloonist_scope').GetFullName] jest teraz doświadczonym baloniarzem"
 curtiss.671.d: "[SCOPE.sCharacter('curtiss_balloonist_scope').GetFullName] odbył już wiele lotów balonem i zdobył duże doświadczenie w baloniarstwie. Jest teraz uznawany za doświadczonego baloniarza, który wie, co robi."
 curtiss.671.f: "„Nie bójcie się! Robiłem to już dziesiątki razy!”"
 curtiss.671.g: "Dobrze to słyszeć!"
 curtiss.672.t: "[SCOPE.sCharacter('curtiss_balloonist_scope').GetFullName] jest teraz słynnym baloniarzem"
 curtiss.672.d: "[SCOPE.sCharacter('curtiss_balloonist_scope').GetFullName] odbył już setki lotów balonem, podczas których pobił także kilka rekordów. Obecnie jest już sławny, i to nie tylko w naszym kraju."
 curtiss.672.f: "„[SCOPE.sCharacter('curtiss_balloonist_scope').GetFullName]? Czy to nie ten baloniarz? Naprawdę chcę go poznać!”"
 curtiss.672.g: "Wspaniale!"
 curtiss.673.t: "[SCOPE.sCharacter('curtiss_balloonist_scope').GetFullName] trafiony przez kometę podczas lotu"
 curtiss.673.d: "[SCOPE.sCharacter('curtiss_balloonist_scope').GetFullName] został trafiony przez kometę podczas lotu balonem i zginął."
 curtiss.673.f: "Krótko po starcie balonem [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')] rozległ się głośny huk. Ludzie na ziemi zobaczyli błysk światła przecinający niebo i uderzający prosto w kosz [SCOPE.sCharacter('curtiss_balloonist_scope').GetFullName]. Balon stanął w płomieniach i runął w dół. Po usunięciu szczątków odnaleziono ciało [SCOPE.sCharacter('curtiss_balloonist_scope').GetFullName]. Jedynie nasi astronomowie byli zadowoleni z tego wydarzenia, ponieważ mogli zbadać pozostałości komety."
 curtiss.673.g: "Gdyby tylko [SCOPE.sCharacter('curtiss_balloonist_scope').GetSheHe] miał wyczucie komet..."
 curtiss.673.h: "O kometo, diabelski pomiocie... Czy jest jeszcze jakiś baloniarz, którego moglibyśmy sponsorować?"
 curtiss.674.t: "[SCOPE.sCharacter('curtiss_balloonist_scope').GetFullName] rozbił się i zginął podczas lotu balonem nad plażą"
 curtiss.674.d: "[SCOPE.sCharacter('curtiss_balloonist_scope').GetFullName] rozbił się na plaży podczas lotu balonem i zginął. Co dziwne, na wraku balonu znaleziono wieloryba."
 curtiss.674.f: "[SCOPE.sCharacter('curtiss_balloonist_scope').GetFullName] leciał wzdłuż plaży podczas pięknego dnia. Ponieważ [SCOPE.sCharacter('curtiss_balloonist_scope').GetSheHe] nie wrócił, wysłano ekipy poszukiwawcze. Po krótkim czasie odnaleziono wrak. Co dziwne, balon i kosz znaleziono pod szczątkami mocno zmiażdżonego wieloryba. Alkoholik z pobliskiej wioski twierdził, że widział spadającego wieloryba i doniczkę z petunią oraz że wieloryb trafił prosto w balon. Oczywiście nikt nie dał wiary tej historii. Co ciekawe, w pobliżu znaleziono nienaruszoną doniczkę z petunią. Petunia wyglądała na nieco zmarnowaną i została powierzona fachowej opiece miejscowego botanika.\n\n[SCOPE.sCharacter('curtiss_balloonist_scope').GetFullName] zostanie zapamiętany za swoje złote serce i zdolność zachowania spokoju w każdej sytuacji."
 curtiss.674.g: "O nie! Tylko nie znowu!"
 curtiss.674.h: "Halo, Ziemia! Czy jest jeszcze jakiś baloniarz, którego moglibyśmy sponsorować?"
 curtiss.676.t: "Nasz baloniarz zmarł"
 curtiss.676.d: "Po dziesięcioleciach spędzonych jako [concept_curtiss_balloonist] nasz były #b #r Baloniarz#!#! zmarł. Czy kiedykolwiek uda nam się zastąpić tak niezwykłego odkrywcę?"
