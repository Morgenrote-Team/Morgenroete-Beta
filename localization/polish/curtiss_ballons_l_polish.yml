 curtiss_altitude_under_5000_custom_1: "[ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] wyruszył na lot na dużej wysokości. Z możliwie najmniejszym obciążeniem [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] wszedł do balonu [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]. Wznoszenie przebiegało szybko. Wkrótce [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] z trudem dostrzegał ludzi na dole. Panorama zapierała dech w piersiach. Pomimo dość dużej wysokości [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFirstName] wciąż znajdował się daleko od warstwy chmur. Gdy barometr wskazał #p [ROOT.Var('new_balloon_altitude_var').GetValue]#! metrów, [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFirstName] najpierw wykonał różne pomiary za pomocą aparatury meteorologicznej, po czym [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] otworzył zawór i powoli opadł z powrotem na ziemię."
 curtiss_altitude_under_9000_custom_1: "Balon [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')] wystrzelił w powietrze. Musiał być lekki, ponieważ [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] postawił sobie za cel wznieść się jak najwyżej. Początkowo domy stawały się coraz mniejsze, aż w końcu wyglądały jak drobne punkciki. Następnie balon wpłynął w chmury, które przypominały mgłę, a na aparaturze meteorologicznej zaczęły osadzać się drobne krople wody. Stopniowo robiło się coraz zimniej. Na szczęście [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFirstName] ubrał się ciepło. Powoli [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFirstName] czuł, że oddychanie przychodzi mu z coraz większym trudem.\nNa wysokości #p [ROOT.Var('new_balloon_altitude_var').GetValue]#! metrów [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] rozpoczął niezbędne pomiary. Następnie rozpoczęło się długie opadanie."
 curtiss_altitude_under_12000_no_tools_custom_1: "Powietrze stawało się coraz rzadsze. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] miał trudności z koncentracją. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetHerHis] głowa pulsowała z bólu. Rzut oka na barometr ujawnił, że [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] znajdował się teraz wyżej niż jakakolwiek góra na świecie. Ludzie mogli dostać się tak wysoko tylko dzięki lataniu. Tymczasem [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetHerHis] ciało zaczynało drżeć. Ubranie było przemoczone od chmur, a temperatura spadła już znacznie poniżej zera.\nW końcu [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFirstName] upadł na [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetHerHis] kolana. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] z trudem zdołał poluzować zawór, aby rozpocząć opadanie. Potem [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFirstName] stracił przytomność.\nPo znalezieniu się na ziemi [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFirstName] odzyskał przytomność. A dokładniej, w ciepłym łóżku. Na szczęście [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] został odnaleziony."
 curtiss_altitude_under_12000_tools_custom_1: "Nawet z butlą z powietrzem nie było łatwo. Zimno przenikało ciało [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName]. Powietrze było lodowate i trudno było ustać na nogach. Jednak dane z tej wysokości były ważne. Dlatego [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFirstName] rozpoczął pomiary. Barometr wskazywał wysokość #p [ROOT.Var('new_balloon_altitude_var').GetValue]#! metrów. Wyżej niż jakakolwiek góra na świecie. Niestety z tej wysokości prawie nic nie było widać. Gęste chmury zasłaniały widok.\n Gdy pomiary zostały zakończone, [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFirstName] zaczął wypuszczać powietrze z powłoki [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]. Balon zaczął opadać."
 curtiss_altitude_under_16000_no_tools_custom_1: "[ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] prawie nie był w stanie poruszać [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetHerHis] własnym ciałem. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] nie czuł już nawet zimna. Tylko ciężki oddech. Tutaj, na tej wysokości, powietrze było niezwykle rozrzedzone. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] nie wiedział, czy [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] przeżyje tę przygodę. Z trudem [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFirstName] podciągnął [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetHerHim] po jednej z lin. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] musiał dosięgnąć zaworu. Był już tak blisko. Powoli wszystko zaczynało pogrążać się w ciemności. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetHerHis] zębami [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFirstName] chwycił zawór. Zaczął go obracać. Wtedy [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] stracił przytomność.\nTak ciepło. Gdzie był [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe]? Przed [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetHerHim] przemykały cienie. Powoli zaczęły przybierać postać ludzi. Kobieta podała [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetHerHim] miskę zupy. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] najwyraźniej przeżył."
 curtiss_altitude_under_16000_tools_custom_1: "Butla z powietrzem pomagała przy rozrzedzonym powietrzu. Jednak zimno przenikało przez grube ubranie. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] drżał z zimna. Wyglądało jednak na to, że [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] wzbił się tak wysoko, jak tylko pozwalał na to balon [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFirstName] rozpoczął pomiary dla towarzystwa naukowego. Barometr wskazywał #p [ROOT.Var('new_balloon_altitude_var').GetValue]#! metrów. Niewiarygodna wysokość. Niestety z powodu chmur widoczność nie była zbyt dobra.\nPo tym, jak [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] zakończył pomiary, [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] zaczął wypuszczać powietrze z powłoki balonu. Powoli balon opadł z powrotem na ziemię."
 curtiss_altitude_over_16000_custom_1: "W komorze ciśnieniowej było stosunkowo ciepło. Temperatura na zewnątrz była jednak nie do zniesienia. Dobrze, że [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] siedział w komorze, a nie na zewnątrz. Oddychanie tutaj również było łatwe. Przez okno [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] spoglądał na kulę ziemską. Z tej wysokości krzywizna Ziemi była wyraźnie widoczna. Im wyżej się patrzyło, tym bardziej błękit nieba przechodził w czerń. Nad Ziemią przesuwały się chmury. Z tej wysokości wyglądały jak wata cukrowa. Gdy barometr wskazał #p [ROOT.Var('new_balloon_altitude_var').GetValue]#! metrów, [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFirstName] z bezpiecznego wnętrza komory ciśnieniowej otworzył zawór, przez co balon zaczął powoli opadać z powrotem na ziemię."
 curtiss_distance_under_400_custom_1: "[ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] postawił sobie za cel przelecieć balonem [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')] jak najdalej. Gdy balon unosił się nad krajobrazem, [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFirstName] zajmował się wszystkim, co należało zrobić. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] musiał znaleźć odpowiednią wysokość, aby jak najlepiej wykorzystać wiatr, obserwować pogodę i nawigować. Po #p [ROOT.Var('curtiss_balloon_time_record_var').GetValue]#! godzinach lotu balon łagodnie wylądował na ziemi. Gdy [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFirstName] zapytał miejscowego mieszkańca, gdzie [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] wylądował, [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] użył mapy, aby obliczyć przebytą odległość. Musiało to być około #p [ROOT.Var('new_balloon_distance_var').GetValue]#! kilometrów."
 curtiss_distance_under_800_custom_1: "Przelecieć balonem jak najdalej wcale nie było tak łatwo. Trzeba było poczekać na dobrą pogodę, mieć dobry balon i skutecznie nawigować. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] uważał, że w [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetHerHim] przypadku wszystkie te warunki były spełnione. Dlatego [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] wystartował balonem [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')], aby ustanowić nowy rekord odległości. Po drodze [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] przelatywał nad różnymi krajobrazami, niewielkimi górami i rzekami. Przez cały lot pogoda dopisywała, więc [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFirstName] po #p [ROOT.Var('curtiss_balloon_time_record_var').GetValue]#! godzinach mógł bez problemu wylądować.\nNa ziemi [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] zapytał miejscowego mieszkańca, gdzie [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] wylądował. Dzięki temu udało się ustalić, że przebyta odległość wyniosła około #p [ROOT.Var('new_balloon_distance_var').GetValue]#! kilometrów."
 curtiss_distance_under_2000_custom_1: "Pogoda była idealna do lotu i taka pozostała przez cały czas. Podczas podróży w przestworzach [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] mógł podziwiać najróżniejsze krajobrazy. Od ogromnych miast, przez małe osady, aż po niezamieszkane połacie ziemi. Przy tak długim locie nie wystarczało jednak podróżować balonem tylko za dnia — [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')] sunął po niebie również nocą. Dopiero po #p [ROOT.Var('curtiss_balloon_time_record_var').GetValue]#! godzinach [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFirstName] zdecydował się wylądować. Balon powoli opadł na ziemię, gdzie [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFirstName] dowiedział się od miejscowych, gdzie [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] się teraz znajdował. Wyglądało na to, że [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] przebył #p [ROOT.Var('new_balloon_distance_var').GetValue]#! kilometrów. Całkiem spory dystans."
 curtiss_distance_over_2000_custom_1: "Na tak długi lot, jaki zaplanował [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName], potrzebne były odpowiednie zapasy, kilka osób i idealna pogoda. Balon [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')] miał wystarczające zapasy, a baloniarzowi towarzyszyły jeszcze 2 osoby. Na szczęście tego dnia pogoda również była bardzo dobra. Balon wystartował więc z [ROOT.GetCountry.GetCapital.GetCityHubName] i przez wiele godzin sunął w powietrzu. Wieczorem cała trójka delektowała się pysznym posiłkiem składającym się z wina i grillowanego kurczaka, którego zabrali ze sobą. Podczas gwiaździstej nocy na zmianę pełnili wachtę. W trakcie tego #p [ROOT.Var('curtiss_balloon_time_record_var').GetValue]#!-godzinnego lotu balon pokonał ogromną odległość. Łącznie [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFirstName] przebył #p [ROOT.Var('new_balloon_distance_var').GetValue]#! kilometrów. Niemal niewyobrażalny dystans."
 curtiss_custom_death_sea: "[ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] podjął próbę ustanowienia nowego rekordu lotu. W jej trakcie zboczył z kursu i został zniesiony nad morze. Wszystkie próby odnalezienia [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetHerHim] zakończyły się niepowodzeniem. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] prawdopodobnie utonął w morzu."
 curtiss_custom_death_hydrogen_ignition: "Kiedy balon [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')] z [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] wzbił się wysoko w niebo, nikt nie spodziewał się, że będzie to ostatni lot [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName]. Na wysokości około 900 metrów doszło do wypadku. W jakiś sposób wodór w balonie zapalił się. W mgnieniu oka cała powłoka stanęła w płomieniach, a gondola runęła na ziemię. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] zginął w chwili uderzenia."
 curtiss_custom_death_firework: "Lecąc wieczorem nad [ROOT.GetCountry.GetCapital.GetCityHubName], balon [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')] wleciał w pokaz fajerwerków. Wybuchające rakiety mieniły się wszystkimi kolorami tęczy, a balon odwzajemnił się fajerwerkom tym samym. Płonąc, runął w dół i rozbił się. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] zginął w katastrofie."
 curtiss_custom_death_redneck: "Podczas lotu nad wiejskim regionem [ROOT.GetCountry.GetName] balon [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')] został trafiony kilkoma kulami wystrzelonymi przez mieszkańca regionu w geście radości. W rezultacie balon szybko stracił gaz i runął na ziemię. Wraz z [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] zginął również strzelec."
 curtiss_custom_death_belltower: "Podczas podejścia do lądowania balon [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] został zniesiony nad miasto. Aby uniknąć zderzenia z jednym z domów, [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] próbował ponownie nabrać wysokości. Rozproszony tym manewrem nie zauważył, że leci prosto na wieżę. Balon uderzył w wieżę, a [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFirstName] został wyrzucony z balonu. Wygląda na to, że w wyniku tego [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFirstName] złamał kark."
 curtiss_custom_death_stork: "Niewiarygodny wypadek wydarzył się dziś na niebie nad [ROOT.GetCountry.GetName]! [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')], balon [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName], został trafiony przez bociana lub innego ptaka. W każdym razie dziób ptaka przebił powłokę balonu. Gdy ptak próbował wydostać się z tej sytuacji, rozdarł w powłoce coraz większy otwór, przez który uchodziło coraz więcej gazu. Następnie balon opadł na ziemię, a [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] zginął w chwili uderzenia."
 curtiss_custom_death_balloon_duel: "W sporze o serce słynnej śpiewaczki operowej między naszym baloniarzem [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] a innym baloniarzem nie udało się dojść do porozumienia. Uznano, że jedynym sposobem rozwiązania sytuacji będzie pojedynek balonowy. Wsiedli więc do swoich balonów i zaczęli do siebie strzelać. Zacięta wymiana ognia trwała niemal godzinę — zapewne dlatego, że trafienie celu z lecącego balonu nie należy do łatwych. W końcu jedna z kul trafiła [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] i zabiła [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetHerHim]. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetHerHis] balon, [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')], odpłynął wraz z ciałem i został odnaleziony dopiero kilka godzin później na otwartym terenie."
 curtiss_custom_death_stray_bullet: "W jakiś sposób [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] zbliżył się swoim balonem zbyt blisko linii frontu [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetHerHis]. Wtedy wrogie oddziały zaczęły strzelać do balonu. Kule chybiły balon, [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')], ale śmiertelnie trafiły [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName]. Balon jeszcze przez długi czas unosił się nad polem bitwy, aż w końcu rozbił się po naszej stronie."
 curtiss_custom_death_power_line: "Podczas lądowania [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetHerHis] balonem [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')] [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] zbliżył się zbyt blisko linii energetycznej. Balon zahaczył o przewód, przez co prąd przepłynął przez ciało [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName], a sam balon stanął w płomieniach. Nie wiadomo dokładnie, od czego [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] zginął, ale z pewnością nie była to przyjemna śmierć."
 curtiss_custom_death_seagull: "Podczas lotu w pobliżu wybrzeża [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] wpadł w stado mew, które zainteresowały się rybami zabranymi przez [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] jako zapasy. Chociaż balon, [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')], nie został uszkodzony, jedna z mew uderzyła [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] w głowę tak mocno, że [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] stracił przytomność i wypadł z balonu. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] zmarł w wyniku [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetHerHis] obrażeń, podczas gdy [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetHerHis] balon odpłynął przy skrzeku mew."
 curtiss_custom_death_lightning: "Lot balonem podczas burzy może nie być najlepszym pomysłem. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] przekonał się o tym na własnej skórze, gdy [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] został trafiony piorunem. Balon, [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')], stanął w płomieniach i w rezultacie rozbił się. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] zginął w katastrofie."
 curtiss_custom_death_sabotage: "To, co miało być zwykłym lotem, szybko zamieniło się w koszmar. W trakcie lotu kilka lin balonu pękło, przez co kosz [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')] runął na ziemię i roztrzaskał się. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] zginął na miejscu. Podczas oględzin wraku zauważono ślady przecięcia na linach. Najwyraźniej był to sabotaż. Nie wiadomo jeszcze, kto za niego odpowiada."
 curtiss_custom_death_updraft: "Podczas lotu balon [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName], [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')], został porwany przez bardzo silny prąd wznoszący. Balon wznosił się coraz wyżej. Wraz ze wzrostem wysokości oddychanie stawało się coraz trudniejsze, a temperatura coraz niższa. Nie wiadomo, czy [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] udusił się, czy zamarzł na śmierć, ale jego życie zakończyło się na tej ekstremalnej wysokości."
 curtiss_custom_death_stampede: "[ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] wylądował na pastwisku podczas jednego ze swoich lotów balonem. Podczas składania balonu, [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')], musiał spłoszyć konie. Ślady wskazują, że zwierzęta rozbiegły się we wszystkich kierunkach, a kilka z nich staranowało [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName], po czym stratowało go na śmierć."
 curtiss_custom_death_failed_fixing: "Jeszcze na niewielkiej wysokości [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] zauważył problem z balonem [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]. Z boku ulatniał się gaz, a balon nieznacznie tracił wysokość. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] postanowił naprawić problem w trakcie lotu i wspiął się na powłokę balonu. Jak relacjonowali niektórzy świadkowie, [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] stracił oparcie i runął na ziemię, gdzie [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] został znaleziony martwy. Balon opadł na ziemię jakiś czas później, gdy ulotniła się wystarczająca ilość gazu."
 curtiss_custom_death_weak_spot: "Dziś [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] spadł z nieba i zginął w chwili uderzenia. Początkowo nie było jasne, co się stało, ale nieco później odnaleziono wrak balonu [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]. W koszu znajdowała się duża dziura, co wskazuje na to, że został źle wykonany i pękł pod ciężarem [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName]. Śmierć [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] jest wielką stratą dla naszego narodu."
 curtiss_custom_death_heart_attack: "Balon [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')] rozbił się dzisiaj. Z wraku wydobyto ciało [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName]. Przyczynę wypadku trudno było ustalić. Początkowo podejrzewano, że [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] celowo uruchomił zawór upustowy, ponieważ z powłoki uchodziło powietrze. Jakiś czas później lekarz stwierdził, że [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] zmarł jeszcze przed katastrofą. Wygląda na to, że w powietrzu doznał zawału serca. Spowodowało to skurcz jego mięśni, który uruchomił zawór."
 curtiss_custom_death_balloon_crash: "Niewiarygodny wypadek wydarzył się dziś na niebie nad [ROOT.GetCountry.GetName]. Choć może to brzmieć nieprawdopodobnie, dwa balony zderzyły się ze sobą w powietrzu. Balon [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')] należący do [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] został uszkodzony i szybko stracił wysokość. Odbił się od ziemi, w wyniku czego [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] zginął. Drugi balon zdołał wylądować, ale jego baloniarz był całkowicie zdruzgotany wypadkiem i próbował pomóc [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName]. Niestety wszelkie próby okazały się bezskuteczne."
 curtiss_custom_death_fighter_intercepted: "Kiedy nasz baloniarz [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] przypadkowo przekroczył granicę naszego kraju, został zaatakowany przez nieznany samolot. Balon [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')] został kilkakrotnie trafiony i szybko tracił wysokość. Zanim balon zdążył uderzyć w ziemię, samolot zaatakował ponownie i śmiertelnie trafił [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName]. Władze naszego sąsiedniego kraju zaprzeczają, jakoby miały cokolwiek wspólnego z tym atakiem."
 curtiss_custom_death_tornado: "Choć nad Wielkimi Równinami szalała burza, [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] postanowił wzbić się w powietrze swoim [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetHerHis] balonem [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]. Balon był miotany w powietrzu, ale [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] nie dał się zniechęcić i kontynuował [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetHerHis] lot. Niezauważenie za [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetHerHim] utworzyło się tornado, które przyciągało balon coraz bliżej. Dopiero tuż przed tym, jak wir pochwycił balon, [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] zauważył niebezpieczeństwo. Niestety było już za późno. Ciało odnaleziono dopiero kilka dni później, ponieważ zostało zasypane gruzem."
 curtiss_custom_death_fall: "Nie jest jasne, jak dokładnie do tego doszło, ale [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] w jakiś sposób wypadł z balonu [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')] i zginął w chwili uderzenia. Balon odnaleziono kilka dni później, gdy powoli opadł z powrotem na ziemię. W balonie nie znaleziono żadnych śladów, które pozwoliłyby ustalić, co dokładnie przydarzyło się [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName]."
 curtiss_custom_death_envelope_falls_apart: "Krótko po starcie [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] rozbił się swoim [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetHerHis] balonem [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]. Na pierwszy rzut oka wyglądało na to, że powłoka została rozerwana. Po dokładniejszych oględzinach stwierdzono jednak, że szwy powłoki rozeszły się w powietrzu. W rezultacie balon rozpadł się i runął na ziemię. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] niestety zginął w chwili uderzenia."
 curtiss_custom_killed_by_indigenous_people: "[ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] wylądował swoim [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetHerHis] balonem [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')] na terytorium tubylców. Nigdy wcześniej nie widzieli balonu i uznali go za złego demona. Zanim [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] zdążył się choćby pokazać, [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] został zastrzelony. Kilka dni później jeden z naszych patroli odnalazł ciało w zniszczonym balonie."
 curtiss_custom_death_cigar: "[ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] rozbił się podczas [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetHerHis] ostatniego lotu. Balon [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')] płonął jasno, spadając z nieba. Wygląda na to, że [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] palił cygaro podczas lotu i w jakiś sposób podpalił kosz. W rezultacie powłoka balonu również zaczęła się palić, co doprowadziło do katastrofy. W tym przypadku palenie zdecydowanie okazało się śmiertelne."
 curtiss_custom_killed_crash_mountainside: "[ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] próbował pokonać góry balonem [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]. W trakcie lotu [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] wpadł w śnieżycę, która całkowicie ograniczyła widoczność. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] próbował wznieść się ponad zamieć, ale balon został porwany przez silny wiatr i uderzył w skalną ścianę góry. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] odniósł w katastrofie śmiertelne obrażenia, a ciało odnaleziono dopiero kilka dni później."
 curtiss_custom_death_hail_storm: "Wszyscy odradzali [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] lot balonem przy tak złej pogodzie, ale on nalegał. Gdy [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] wzbił się w powietrze balonem [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')], pogoda zaczęła się coraz bardziej pogarszać. Najpierw z ponurych chmur lunął ulewny deszcz, który wkrótce przerodził się w grad. Niektóre gradziny były wielkości pięści i coraz bardziej rozdzierały powłokę balonu. Balon runął w dół i rozbił się o ziemię. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] zginął w katastrofie."
 curtiss_custom_killed_alcohol: "[ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] wypił kilka butelek wina przed startem balonem [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]. Oczywiście alkohol nie pomaga w lataniu, a bycie pijanym czyni baloniarstwo jeszcze bardziej niebezpiecznym. [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')] zginął jednak nie dlatego, że wypadł z balonu lub przypadkowo go podpalił — nie, przyczyną było zrzucenie wszystkich worków z balastem krótko po starcie. Balon wystrzelił w górę i w mgnieniu oka zniknął. Dopiero kilka dni później odnaleziono wrak. [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')] nadal znajdował się w koszu, najwyraźniej umierając z pragnienia po wypiciu ostatniej butelki wina."
 curtiss_custom_killed_opium: "Ciało [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] znaleziono na polu po tym, jak [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] odleciał balonem [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]. Początkowo nie było jasne, dlaczego [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] wypadł z balonu, ale gdy kilka dni później balon również wylądował, znaleziono w nim opium. Najwyraźniej [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] zażywał opium podczas lotu, a następnie z niewyjaśnionych przyczyn wypadł z balonu."
 curtiss_custom_death_acrobatics: "Na oczach dużego tłumu [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] próbował przejść po linie z jednego balonu na uwięzi do drugiego. Początkowo wyglądało na to, że uda mu się to bez trudu. Wtedy jednak porwał go silny podmuch wiatru, który strącił go z liny. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] spadł w sam środek tłumu i zmarł na miejscu wskutek odniesionych obrażeń."
 curtiss_custom_death_goose: "Jak podczas każdego lotu, [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] zabrał ze sobą na pokład gęś na szczęście. Oboje odlecieli na pokładzie [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]. Kilka godzin później balon bezpiecznie wylądował. Ku zaskoczeniu wszystkich w balonie pozostał tylko jeden pasażer. Gęś. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] zniknął. Nawet po kilku dniach poszukiwań [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] nie został odnaleziony."
 curtiss_custom_death_mile_high_club: "Kosz balonu [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')] znaleziono na polu. W środku leżeli [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] oraz kobieta. Co dziwne, oboje byli nadzy. Pojawiło się wiele spekulacji na temat przyczyn tego stanu rzeczy. Większość ludzi zakłada, że oboje zmarli z wychłodzenia i krótko wcześniej zdjęli ubrania. Często zdarza się to podczas zamarzania, gdy nagle pojawia się uczucie silnego gorąca. Istnieją jednak również przypuszczenia, że oboje robili coś... nieprzyzwoitego."
 curtiss_custom_death_zoo_crocodile: "Lot zakończył się pełnym sukcesem. Z wyjątkiem lądowania... ze wszystkich miejsc na świecie wybieg dla krokodyli w zoo był prawdopodobnie jednym z najgorszych miejsc do lądowania balonem. Kiedy balon [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')] znalazł się pośrodku wody, życie [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] szybko dobiegło końca. Zanim ktokolwiek zdążył zareagować, krokodyle rzuciły się na przekąskę."
 curtiss_custom_death_cheap_parts: "Oszczędność zwykle jest cnotą. Ale nie w przypadku elementów konstrukcyjnych balonu. Liny balonu [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')] zakupiono u najtańszego dostawcy, oszczędzając kilka funtów. Niestety ich jakość była znacznie gorsza, niż obiecywano. Podczas lotu kilka lin pękło, gondola przechyliła się, a [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')] wypadł z balonu i zginął w chwili uderzenia."
 curtiss_custom_death_disappearance: "Minął już miesiąc, odkąd [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] odleciał balonem [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]. Krótko po starcie wszelki ślad po nim zaginął. Nie zauważono ani balonu, ani wraku, ani ciała. Nasze poszukiwania również nie przyniosły rezultatu. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] zniknął wraz ze swoim balonem i nikt nie wie, co się stało."
 curtiss_custom_death_train: "W wyniku splotu niefortunnych zbiegów okoliczności balon [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')] został podczas lądowania uderzony przez pociąg i zniszczony. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] zginął na miejscu. Wygląda na to, że balon wylądował w gęstej mgle, a [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] nie zauważył, że znalazł się na torach. Zaledwie kilka sekund później pociąg uderzył w balon z pełną prędkością. Pociąg nie został uszkodzony, a poza [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] nikt nie odniósł obrażeń."
 curtiss_custom_death_skyscraper: "Podczas lotu nad miastem balon [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')] został porwany przez silny prąd powietrzny i zniesiony prosto w stronę wieżowca. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] nie mógł nic na to poradzić i bezradnie patrzył, jak budynek zbliża się coraz bardziej. Balon uderzył w fasadę i zaplątał się. Chwilę później powłoka została rozerwana, a balon runął w dół. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] spadł prosto na stragan warzywniaka, niszcząc świeże kapusty. Niestety nie zamortyzowały one wystarczająco [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetHerHis] upadku i [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] zginął na miejscu."
 curtiss_custom_death_disease: "Ze słowami: „To tylko przeziębienie!”, [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] pożegnał się i wszedł do balonu [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]. Wygląda jednak na to, że nie było to tylko przeziębienie, ponieważ kilka dni później odnaleziono balon wraz z martwym ciałem [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]. [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')] najwyraźniej zmarł wskutek poważnej choroby. Biorąc pod uwagę wszystkie zagrożenia związane z baloniarstwem, była to dość mało prawdopodobna przyczyna śmierci."
 curtiss_custom_death_slipped: "[ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] wybrał się w podróż balonem [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] podróżował w towarzystwie przyjaciela. W trakcie lotu [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] musiał się w jakiś sposób poślizgnąć. Być może winny był lekki deszcz, który zmoczył kosz, a może zwykła nieostrożność. W każdym razie [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] stracił równowagę i wypadł z balonu. W wyniku tego [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] zginął. Przyjaciel z wielkim trudem zdołał ponownie wylądować balonem, ale nie odniósł żadnych obrażeń."
 curtiss_custom_death_ladder: "[ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] nie zginął podczas jakiejś przygody, jak można by się spodziewać po baloniarzu. Nie, [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] zginął podczas pracy przy balonie [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]. Gdy [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] sprawdzał pod ciśnieniem powłokę balonu w poszukiwaniu słabych punktów, [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] stracił chwyt na drabinie i spadł. Niestety był to wyjątkowo pechowy upadek, który doprowadził do śmierci [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName]."
 curtiss_custom_death_angry_worker: "Podczas ostatniego lotu kilka lin balonu [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')] pękło, przez co gondola runęła na ziemię. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] zginął w chwili uderzenia. Gdy zbadano wrak balonu, na linach znaleziono ślady przecięcia. Okazało się, że pracownik [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] uszkodził liny w nocy, aby zabić [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetHerHim]. Pracownik stwierdził: „Ten krwiopijca sam się o to prosił! Wyzyskiwał nas, żeby móc oddawać się baloniarstwu!”"
 curtiss_custom_death_sabotage_slaver: "Gdy tylko balon [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')] wylądował na polu, a [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] z niego wysiadł, [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] został obezwładniony i zabity przez grupę najemników. Nasze śledztwo wykazało, że właściciel niewolników zlecił zabójstwo [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName], aby osłabić ruch przeciwko niewolnictwu. Co za straszna śmierć!"
 curtiss_custom_death_shot_over_prison: "Podczas lotu balonem z klientem [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName] znalazł się balonem [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')] nad terenem więzienia Sisika. Strażnicy otworzyli ogień do balonu. [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFirstName] wyszedł z tego bez szwanku, ale w pobliżu Annesburga wdał się w kolejną strzelaninę z gangiem O'Driscoll. W jej trakcie [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetSheHe] został postrzelony i wypadł z kosza. Pasażer najwyraźniej zdołał następnie awaryjnie wylądować w pobliżu rzeki. Jak dotąd nie ma po nim żadnego śladu."
 curtiss.600.t: "Lot balonem z Vauxhall Gardens do Weilburga"
 curtiss.600.d: "Charles Green, angielski baloniarz, wyruszył wraz z dwoma członkami załogi z Vauxhall Gardens w Londynie balonem Royal Vauxhall. Dzięki sprzyjającym wiatrom balon przeleciał nad kanałem La Manche i dotarł do Weilburga w Nassau w Niemczech. Pokonując około 500 mil, czyli 800 kilometrów, ustanowił najdłuższy lot balonem w historii."
 curtiss.600.f: "Lot balonu Royal Fauxhall okazał się niezwykłym sukcesem. Rekord odległości miał utrzymać się przez 80 lat.\nLot nie był pozbawiony ryzyka. Baloniarstwo w XIX wieku było szczególnie niebezpieczne, ponieważ nigdy nie było wiadomo, gdzie się wyląduje. Dlatego Green zabrał ze sobą w podróż sporo zapasów. Miał również tonę piasku jako balast, linę o długości 1000 stóp, barometry, teleskopy, różne napoje alkoholowe, płaszcze i wszelkiego rodzaju inne rzeczy. Oprócz całego bagażu Green i jego dwaj towarzysze, Thomas Monck Mason i Robert Hollond, musieli jeszcze zmieścić się w gondoli.\nPo dotarciu do Weilburga, z pomocą miejscowych — i przy użyciu przywiezionej ze sobą brandy — opróżniono balon i przygotowano go do drogi powrotnej. W Weilburgu cała trójka została serdecznie przyjęta, między innymi przez księcia Nassau. Podróż powrotną musieli odbyć powozem, ponieważ nie było dostępnego gazu węglowego do napełnienia balonu."
 curtiss.600.g: "Kolejny rekord dla Wielkiej Brytanii!"
 curtiss.601.t: "Wynalezienie panelu zrywnego"
 curtiss.601.d: "Miłośnik baloniarstwa i wynalazca [SCOPE.sCharacter('curtiss_balloonist_scope').GetFullName] zaprezentował swój najnowszy wynalazek, który ma znacznie zwiększyć bezpieczeństwo lotów balonem. Panel zrywny to fragment powłoki balonu, który jest przymocowany do niej jedynie lekko. Podczas lądowania można go oderwać. Pozwala to gazowi znajdującemu się w balonie ulotnić się błyskawicznie. Dzięki temu balon nie jest ciągnięty po ziemi, nie zaczepia się o przeszkody ani w nic nie uderza."
 curtiss.601.f: "Przed wynalezieniem panelu zrywnego baloniarze musieli albo zabezpieczać balon kotwicami, albo wspinać się na jego szczyt i otwierać tam zawór, aby wypuścić gaz z balonu. Było to niezwykle niebezpieczne, ponieważ gaz uchodzi szybko, a balon zapada się. Wielokrotnie zdarzało się, że baloniarze zaplątywali się w powłokę i tam ginęli. Wynalezienie panelu zrywnego 27 kwietnia 1839 roku znacznie zwiększyło bezpieczeństwo baloniarstwa."
 curtiss.601.g: "Świetna robota! Miejmy nadzieję, że jeszcze o nim usłyszymy!"
 curtiss.601.h: "Właściwie potrzebujemy nowego baloniarza!"
 curtiss.601.h.tt: "Doświadczony baloniarz [SCOPE.sCharacter('curtiss_balloonist_scope').GetFullName] zostaje naszym nowym sponsorowanym baloniarzem"
 curtiss.602.t: "Pierwsze przekroczenie Alp balonem przez Francisque'a Arbana"
 curtiss.602.d: "Francuski baloniarz Francisque Arban jako pierwszy człowiek przekroczył Alpy balonem wodorowym. Wieczorem 2 września 1849 roku wystartował z Marsylii i poleciał na wschód. Aby przekroczyć Alpy Kotyjskie, jego balon wzniósł się na wysokość około 15 000 stóp, czyli 4600 metrów. Następnego ranka wylądował w pobliżu Turynu o wpół do trzeciej nad ranem."
 curtiss.602.f: "Przekroczenie Alp było rekordem, który przez długi czas pozostawał niepobity. Dopiero w 1924 roku udało się tego dokonać ponownie.\nArban zdobył doświadczenie w baloniarstwie jeszcze przed przekroczeniem Alp. Pierwsze próby podejmował w wieku 17 lat, około 1832 roku, jednak większość swoich lotów balonem odbył w latach 1845 i 1849 we Włoszech. W 1846 roku musiał zostać uratowany z morza przez rybaków po tym, jak zboczył z kursu w pobliżu Triestu."
 curtiss.602.g: "Magnifique! Prawdziwy bohater Francji!"
 curtiss.603.t: "Francisque Arban zaginął podczas lotu balonem nad Morzem Śródziemnym"
 curtiss.603.d: "Zaledwie miesiąc po przekroczeniu Alp balonem Francisque Arban zaginął. Po starcie z Barcelony wiatr zniósł go w kierunku Morza Śródziemnego. Od tamtej pory nie ma po nim żadnego śladu. Czy powinniśmy wysłać ekipy ratunkowe na poszukiwanie Arbana?"
 curtiss.603.f: "Historycznie balon Francisque'a Arbana został zniesiony nad otwarte morze 7 października 1849 roku. Od tamtej pory nie ma po nim żadnego śladu. Przypuszczalnie zginął podczas tego lotu balonem. Nie wiadomo jednak, co dokładnie się wydarzyło."
 curtiss.603.g: "Straszne! Natychmiast wyślijcie statki, żeby go szukać!"
 curtiss.603.h: "Był świadomy ryzyka. Nic nie możemy zrobić."
 curtiss.604.t: "Francisque Arban uratowany"
 curtiss.604.d1: "Nasze poszukiwania zakończyły się sukcesem! Francisque Arban został odnaleziony przez jeden z naszych statków! Na szczęście Arban zachował zimną krew i wyrzucał z balonu różne przedmioty, które unosiły się na powierzchni wody. Jeden z naszych statków odnalazł ten ślad i podążył za nim. Arban przez kilka dni trzymał się kosza, który odłączył od powłoki balonu. Dzięki zapasom znajdującym się w balonie zdołał przetrwać tę próbę."
 curtiss.604.d2: "Łódź rybacka odnalazła balon Francisque'a Arbana u wybrzeży Barcelony. Biorąc pod uwagę okoliczności, czuje się dobrze, ale jest poważnie odwodniony. Miejmy nadzieję, że wkrótce poczuje się lepiej!"
 curtiss.604.f: "„To był najbardziej ekscytujący lot balonem w moim życiu! Mam nadzieję, że przy okazji pobiłem jakiś rekord!”"
 curtiss.604.g: "Co za szczęście! Witaj z powrotem, Arban!"
 curtiss.605.t: "Dodatek: Arban zniewolony w Afryce!"
 curtiss.605.d: "Różne hiszpańskie gazety donoszą, że Arban nie utonął w Morzu Śródziemnym, lecz dotarł swoim balonem do Afryki i został tam zniewolony. Dociera do nas coraz więcej listów od obywateli proszących, byśmy odnaleźli Arbana i uwolnili go z niewoli."
 curtiss.605.f: "Historycznie w 1853 roku rzeczywiście pojawiały się artykuły w różnych gazetach, które twierdziły, że Arban został zniewolony w Afryce. Nie było jednak na to żadnych dowodów. Nie wiadomo dokładnie, co stało się z Arbanem, ale najbardziej prawdopodobne jest, że utonął w Morzu Śródziemnym."
 curtiss.605.g: "Musimy odnaleźć Arbana!"
 curtiss.605.h: "To niewiarygodne historie, w które nikt nie powinien wierzyć."
 curtiss.606.t: "Arban został zniewolony w [SCOPE.sCountry('curtiss_arban_slaver_scope').GetName]"
 curtiss.606.d: "Nasze poszukiwania wykazały, że Arban rzeczywiście wciąż żyje. Odnaleziono go w [SCOPE.sCountry('curtiss_arban_slaver_scope').GetName], gdzie musi pracować jako niewolnik na polach. Właściciele zaproponowali, że moglibyśmy go od nich wykupić za ogromną sumę. Oczywiście moglibyśmy też po prostu uwolnić go siłą."
 curtiss.606.f: "Historycznie doniesienia prasowe nie zostały później zweryfikowane. Nie da się więc jednoznacznie stwierdzić, że Arban nie został zniewolony. Jest to jednak bardzo mało prawdopodobne."
 curtiss.606.g: "Uwolnimy go z niewoli!"
 curtiss.606.h: "Po prostu zapłaćmy i miejmy to z głowy..."
 curtiss.607.t: "Arban uwolniony z niewoli i sprowadzony do domu"
 curtiss.607.d1: "Niewielki oddział otrzymał zadanie uwolnienia Arbana z niewoli. Po krótkiej potyczce udało im się uwolnić Arbana oraz kilku innych Europejczyków, po czym uciekli konno. Zanim [SCOPE.sCountry('curtiss_arban_slaver_scope').GetAdjective] władze zdążyły zareagować, byli już na pokładzie statku, który zabrał ich do domu. Z powodu długiej niewoli Arban jest wyczerpany i osłabiony, ale zdołał opowiedzieć nam o swoim pełnym przygód locie balonem. Jego wiedza z pewnością nam pomoże."
 curtiss.607.d2: "Arban wrócił do domu. Z powodu długiej niewoli jest wyczerpany i osłabiony, ale zdołał opowiedzieć nam o swoim pełnym przygód locie balonem. Jego wiedza z pewnością nam pomoże."
 curtiss.607.f: "„Wiatr zniósł mnie nad otwarte morze. Ponieważ pchał mnie na południe, postanowiłem spróbować dotrzeć do Balearów. Wiatr jednak nie sprzyjał i zostałem zniesiony aż ku wybrzeżom Afryki Północnej, gdzie udało mi się wylądować. Niestety tamtejsi mieszkańcy nie byli zbyt przyjaźni. Czy ktoś wcześniej przeleciał nad Morzem Śródziemnym? Czy ustanowiłem rekord?”"
 curtiss.607.g: "Udana akcja ratunkowa!"
 curtiss.607.h: "Witaj z powrotem, Arban!"
 curtiss.608.t: "Brak śladów Arbana"
 curtiss.608.d: "Po miesiącach poszukiwań wciąż nie znaleźliśmy żadnego śladu Arbana. Wygląda na to, że opowieści o jego zniewoleniu w Afryce Północnej były zmyślone. Francisque Arban bez wątpienia nie żyje."
 curtiss.608.f: "„Francuzi? Oczywiście! Sprzedajemy wielu Francuzów. Którego chcecie? Wszyscy są silni, byli marynarzami!”"
 curtiss.608.g: "Odwołaj poszukiwania."
 curtiss.609.t: "Nadar wykonuje pierwsze zdjęcia lotnicze z balonu"
 curtiss.609.d: "Francuski fotograf Nadar połączył swoje dwie pasje: baloniarstwo i fotografię. Udało mu się wykonać zdjęcia z powietrza. Ukazują one świat z góry, tak jak dotąd widziało go niewielu ludzi."
 curtiss.609.f: "Nadar wykonał swoje pierwsze zdjęcia lotnicze w 1859 roku podczas bitwy pod Solferino. W 1863 roku Nadar został prezesem #b Société d'encouragement pour la locomotion aérienne au moyen d'appareils plus lourds que l'air#!, stowarzyszenia zajmującego się rozwojem lotnictwa. Sekretarzem Société był nie kto inny jak Jules Verne, którego balony Nadara zainspirowały do napisania opowieści „#b Pięć tygodni w balonie#!”."
 curtiss.609.g: "Świat z góry wygląda zupełnie inaczej!"
 curtiss.610.t: "„Le Géant” Nadara rozbija się w Hanowerze"
 curtiss.610.d: "Po pełnym napięcia i niezwykle trudnym locie z Paryża do Hanoweru Nadar rozbił swój ogromny balon „Le Géant” na polu w Hanowerze. Został ciężko ranny, podobnie jak jego żona. Miejmy nadzieję, że szybko wyzdrowieje i nadal będzie latał balonami!"
 curtiss.610.f: "„Le Géant” był balonem o wysokości 60 metrów (196 stóp), trafnie nazwanym „Olbrzymem”. Zbudował go Eugène Godard, a latał nim Nadar. Już podczas swojego drugiego lotu Nadar rozbił „Le Géant”. Pomimo własnych poważnych obrażeń i mocno uszkodzonego balonu Nadar naprawił „Le Géant” i ponownie nim latał. W 1867 roku zabierał na pokład podczas lotów balonem nawet tuzin pasażerów i serwował im zimnego kurczaka oraz wino."
 curtiss.610.g: "Co za straszny wypadek!"
 curtiss.611.t: "Glaisher i Coxwell ustanawiają rekord najwyższego lotu balonem"
 curtiss.611.d: "Meteorolog James Glaisher i baloniarz Henry Tracey Coxwell ustanowili rekord najwyższego lotu balonem. Wspólnie wznieśli się balonem na szacowaną wysokość 11 270 metrów (37 000 stóp). Na wysokości 8800 metrów Glaisher stracił już przytomność. Coxwell z wielkim trudem zdołał zmusić balon do opadania. Na szczęście obaj przeżyli tę przygodę."
 curtiss.611.f: "W 1862 roku Glaisher i Coxwell wznieśli się balonem „Mammoth”. Otrzymali zlecenie od British Association for the Advancement of Science na przeprowadzenie eksperymentów w górnych warstwach atmosfery. Na wysokości 8800 metrów (29 000 stóp) Glaisher zemdlał, a Coxwell stracił czucie w dłoniach. Ponieważ lina zaworu zaplątała się, Coxwell nie mógł z kosza zmusić balonu do opadania. Musiał wspiąć się na olinowanie i otworzyć tam zawór zębami. Następnie stracił przytomność, ale balon zaczął opadać. W ciągu 15 minut balon zniżył się do ziemi, gdzie bezpiecznie wylądował."
 curtiss.611.g: "Mieli szczęście, że przeżyli!"
 curtiss.612.t: "Eduard Spelterini przewozi pasażerów przez Alpy"
 curtiss.612.d: "Podczas lotu z pasażerami Szwajcar Eduard Spelterini przewiózł ich nad Alpami. W trakcie lotu przekroczył niektóre z najwyższych punktów Alp. Spelterini jest teraz gwiazdą baloniarstwa."
 curtiss.612.f: "Eduard Spelterini, urodzony jako Albert Schweizer, już w młodości szkolił się na baloniarza. Po zbudowaniu swojego pierwszego własnego balonu o nazwie „Urania” podróżował po Europie, pokazując przedstawicielom wyższych sfer świat z góry. Zwykle lot obejmował również niewielki piknik składający się z kotletów i szampana. Spelterini zaczął także wykonywać zdjęcia lotnicze, jednak to pasażerskie loty nad Alpami najbardziej przyczyniły się do jego sławy."
 curtiss.612.g: "Niesamowity widok!"
 curtiss.613.t: "Pierwszy lot sterowca zbudowanego przez Giffarda"
 curtiss.613.d: "Dużym problemem lotów balonem jest to, że zawsze zależą od sprzyjających wiatrów. Balon bardzo łatwo może zostać zniesiony z kursu, co wielokrotnie prowadzi do wypadków. Henri Giffard próbował znaleźć rozwiązanie tego problemu, konstruując wydłużony sterowiec z silnikiem parowym i sterem. Swoim „Giffard dirigible” Giffard odbył 27-kilometrowy lot z Paryża do Élancourt. Ponieważ sterowiec jest bardzo powolny, lot pod wiatr nie jest na razie możliwy. Kto wie, w jakim kierunku rozwiną się te sterowce?"
 curtiss.613.f: "Dzięki swojemu lotowi z 24 września 1852 roku Giffard jako pierwszy odbył lot napędzanym i sterowalnym sterowcem. Napęd w postaci silnika parowego był jednak bardzo słaby, przez co sterowiec nie zyskał jeszcze szerszego zastosowania. Dopiero później, wraz z wynalezieniem silnika spalinowego, marzenie o sterowcach mogło naprawdę się urzeczywistnić."
 curtiss.613.g: "Może te sterowalne balony wkrótce podbiją niebo!"
 curtiss.614.t_brussels: "[SCOPE.sCharacter('curtiss_balloonist_scope').GetFullName] rozważa przeprowadzkę do Brukseli"
 curtiss.614.t_capital: "[SCOPE.sCharacter('curtiss_balloonist_scope').GetFullName] rozważa przeprowadzkę do [SCOPE.sCountry('curtiss_august_piccard_destination').GetCapital.GetCityHubName]"
 curtiss.614.d_brussels: "Jeden z naszych najważniejszych naukowców, [SCOPE.sCharacter('curtiss_balloonist_scope').GetFullName], otrzymał propozycję objęcia stanowiska profesora na Wolnym Uniwersytecie Brukselskim. Uniwersytet obiecuje duże środki finansowe, które pozwoliłyby Piccardowi jeszcze dokładniej badać stratosferę przy użyciu balonów. Piccard wydaje się skłonny przyjąć tę ofertę. Oznaczałoby to utratę wybitnego naukowca, który ma również ogromne doświadczenie w baloniarstwie."
 curtiss.614.d_capital: "Jeden z naszych najważniejszych naukowców, [SCOPE.sCharacter('curtiss_balloonist_scope').GetFullName], otrzymał propozycję objęcia stanowiska profesora na Wolnym Uniwersytecie [SCOPE.sCountry('curtiss_august_piccard_destination').GetCapital.GetCityHubName]. Uniwersytet obiecuje duże środki finansowe, które pozwoliłyby Piccardowi jeszcze dokładniej badać stratosferę przy użyciu balonów. Piccard wydaje się skłonny przyjąć tę ofertę. Oznaczałoby to utratę wybitnego naukowca, który ma również ogromne doświadczenie w baloniarstwie."
 curtiss.614.f: "Piccard został mianowany profesorem Wolnego Uniwersytetu Brukselskiego w 1922 roku, gdzie oprócz nauczania poświęcił się badaniom stratosfery z wykorzystaniem balonów. W swoich badaniach stratosferycznych współpracował również ze swoim przyjacielem Albertem Einsteinem, z którym opracowywał eksperymenty.\nOprócz badań stratosfery Piccard wynalazł przyrząd do pomiaru promieniotwórczości oraz bardzo precyzyjny sejsmograf. Zajmował się także fizyką atomową i przewidział istnienie trzeciego izotopu uranu, który później odkryto i który dziś znany jest jako uran-235.\nW Brukseli jego wykłady sprawiły również, że stał się inspiracją dla komiksowej postaci profesora Calculusa."
 curtiss.614.g: "Nie możemy stracić Piccarda — zaproponujmy mu sponsoring!"
 curtiss.614.h: "Mamy już świetnego baloniarza!"
 curtiss.614.g.tt: "Doświadczony baloniarz [SCOPE.sCharacter('curtiss_balloonist_scope').GetFullName] zostaje naszym nowym sponsorowanym baloniarzem."
 curtiss.615.t: "[SCOPE.sCharacter('curtiss_balloonist_scope').GetFullName] przeprowadził się do [SCOPE.sCountry('curtiss_august_piccard_destination').GetCapital.GetCityHubName]"
 curtiss.615.d: "Szwajcarski naukowiec [SCOPE.sCharacter('curtiss_balloonist_scope').GetFullName] przeprowadził się do [SCOPE.sCountry('curtiss_august_piccard_destination').GetCapital.GetCityHubName], aby objąć stanowisko profesora na Wolnym Uniwersytecie [SCOPE.sCountry('curtiss_august_piccard_destination').GetCapital.GetCityHubName]. Uniwersytet obiecał duże środki finansowe, które pozwolą Piccardowi jeszcze dokładniej badać stratosferę przy użyciu balonów. Jako wybitny naukowiec i baloniarz Piccard może być w stanie ustanowić nowe rekordy w baloniarstwie."
 curtiss.615.f: "Piccard został mianowany profesorem Wolnego Uniwersytetu Brukselskiego w 1922 roku, gdzie oprócz nauczania poświęcił się badaniom stratosfery z wykorzystaniem balonów. W swoich badaniach stratosferycznych współpracował również ze swoim przyjacielem Albertem Einsteinem, z którym opracowywał eksperymenty.\nOprócz badań stratosfery Piccard wynalazł przyrząd do pomiaru promieniotwórczości oraz bardzo precyzyjny sejsmograf. Zajmował się także fizyką atomową i przewidział istnienie trzeciego izotopu uranu, który później odkryto i który dziś znany jest jako uran-235.\nW Brukseli jego wykłady sprawiły również, że stał się inspiracją dla komiksowej postaci profesora Calculusa."
 curtiss.615.g: "Baloniarz o takiej renomie powinien zostać naszym oficjalnym baloniarzem!"
 curtiss.615.h: "Życzymy mu powodzenia w dalszej karierze!"
 curtiss.615.g.tt: "Doświadczony baloniarz [SCOPE.sCharacter('curtiss_balloonist_scope').GetFullName] zostaje naszym nowym sponsorowanym baloniarzem."
 curtiss.650.t: "Przedstawiamy naszego nowego baloniarza"
 curtiss.650.d: "[SCOPE.sCharacter('curtiss_balloonist_scope').GetFullName] jest odnoszącym sukcesy baloniarzem, który chce wykorzystać nasze wsparcie, aby przesuwać granice baloniarstwa. Rekordy czekają na pobicie, a odkrycia naukowe na dokonanie. [SCOPE.sCharacter('curtiss_balloonist_scope').GetSheHe] jest pewien, że [SCOPE.sCharacter('curtiss_balloonist_scope').GetSheHe] zdoła wznieść się na nowe wyżyny swoim [SCOPE.sCharacter('curtiss_balloonist_scope').GetHerHis] balonem [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]."
 curtiss.650.f: "„Przysporzę chwały naszemu krajowi!”"
 curtiss.650.g: "Miejmy nadzieję, że wspieranie [SCOPE.sCharacter('curtiss_balloonist_scope').GetHerHim] okaże się tego warte! Przenieś mnie do panelu baloniarstwa."
 curtiss.650.h: "Powodzenia!"
 curtiss.651.t: "Baloniarstwo w naszym kraju"
 curtiss.651.balloonist: "Sponsorujemy [ROOT.Var('curtiss_balloonist_var').GetCharacter.GetFullName], baloniarza, który podejmuje coraz śmielsze próby lotów [SCOPE.sCharacter('curtiss_balloonist_scope').GetHerHis] balonem [SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]."
 curtiss.651.noballoonist: "Obecnie nie sponsorujemy żadnego baloniarza. Dlatego bardzo rzadko, o ile w ogóle, będziemy ustanawiać nowe rekordy balonowe. Moglibyśmy zacząć sponsorować baloniarza z naszego kraju, który będzie próbował ustanawiać nowe rekordy i opracowywać dla nas lepsze balony."
 curtiss.651.f: "[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloonist_trait_level_type')]\n\n#b Aktualne rekordy [ROOT.GetCountry.GetAdjective]:#!\n - Rekord wysokości: #b #p [ROOT.Var('curtiss_balloon_altitude_record_var').GetValue]#! metrów#!\n - Rekord odległości: #b #p [ROOT.Var('curtiss_balloon_distance_record_var').GetValue]#! kilometrów#!\n - Rekord czasu: #b #p [ROOT.Var('curtiss_balloon_time_record_var').GetValue]#! godzin#!\n\n#b Aktualne rekordy świata:#!\n - Rekord wysokości: #b #p [GetGlobalVariable('curtiss_balloon_altitude_record_global_var').GetValue]#! metrów#! [GetGlobalVariable('curtiss_balloon_altitude_record_holder_global_var').GetCountry.GetFlagTextIcon]\n - Rekord odległości: #b #p [GetGlobalVariable('curtiss_balloon_distance_record_global_var').GetValue]#! kilometrów#! [GetGlobalVariable('curtiss_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon]\n - Rekord czasu: #b #p [GetGlobalVariable('curtiss_balloon_time_record_global_var').GetValue]#! godzin#! [GetGlobalVariable('curtiss_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon]"
 curtiss.651.g: "Zacznij sponsorować baloniarza!"
 curtiss.651.h: "Przestań sponsorować swojego baloniarza"
 curtiss.651.htt: "Po wybraniu tej opcji baloniarz zostanie usunięty z gry."
 curtiss.651.l: "Wracam do swoich spraw!"
 curtiss.651.w: "Nie informuj mnie już o #yellow lotach#! mojego baloniarza!"
 curtiss.651.w.tt: "Nie będziesz już otrzymywać wydarzeń dotyczących #yellow lotów#! twojego baloniarza ani jego #yellow nowych cech#!. Możesz włączyć je ponownie w dowolnym momencie."
 curtiss.651.x: "Opowiadaj mi znowu o #yellow lotach#! mojego baloniarza!"
 curtiss.651.x.tt: "Ponownie będziesz otrzymywać wydarzenia dotyczące #yellow lotów#! twojego baloniarza oraz jego #yellow cech#!. Możesz je ponownie wyłączyć w dowolnym momencie."
 curtiss.651.y: "Nie informuj mnie już o #yellow śmierci#! mojego baloniarza"
 curtiss.651.y.tt: "Nie będziesz już otrzymywać wydarzeń dotyczących #yellow śmierci#! twojego baloniarza. Nowy baloniarz zostanie automatycznie objęty sponsoringiem. Możesz włączyć je ponownie w dowolnym momencie."
 curtiss.651.z: "Opowiadaj mi znowu o #yellow śmierci#! baloniarza."
 curtiss.651.z.tt: "Ponownie będziesz otrzymywać wydarzenia dotyczące #yellow śmierci#! twojego baloniarza. Możesz je ponownie wyłączyć w dowolnym momencie."
