 manzoni.711.t: "Pochwała dla [SCOPE.gsInterestGroup('target_ig_1').GetName]"
 manzoni.711.d: "Gazeta należąca do imperium wydawniczego [SCOPE.sCharacter('target_character_1').GetFullName] wyróżniła działania [SCOPE.gsInterestGroup('target_ig_1').GetName] na rzecz sprawowania rządów, wyrażając się o nich szczególnie pochlebnie. Nie jest przypadkiem, że [SCOPE.sCharacter('target_character_1').GetLastName] [SCOPE.sCharacter('target_character_1').GetHerselfHimself] należy do tej grupy interesu."
 manzoni.711.f: "„Prasa jest jak kobieta: wzniosła, gdy kłamie, nie odpuści, dopóki nie zmusi cię, byś jej uwierzył. Opinia publiczna, niczym głupi mąż, zawsze ulega.”— Honoré de Balzac"
 manzoni.711.g: "Artykuł należy rozpowszechnić jak najszerzej!"
 manzoni.711.h: "To obrzydliwa próba przypodobania się."
 manzoni.712.t: "Kruchy Związek"
 manzoni.712.d: "Niedawne małżeństwo [SCOPE.sCharacter('target_character_1').GetFullName] już wcześniej przyciągało uwagę. Teraz wyszło na jaw, że [SCOPE.sCharacter('target_character_1').GetHerHis] małżonek należy do rodziny [SCOPE.sCharacter('target_character_2').GetLastNameNoFormatting], z której wywodzi się [SCOPE.sCharacter('target_character_2').GetFullName], przywódca [SCOPE.gsInterestGroup('target_ig_1').GetName]. Rodzi to pytania o niezależność gazety, jej powiązania z rządem oraz rzeczywistą potęgę imperium [SCOPE.sCharacter('target_character_1').GetLastName]."
 manzoni.712.f: "Gdy wyszło na jaw, że żona ministra finansów pracuje w gazecie należącej również do wydawnictwa [SCOPE.sCharacter('target_character_1').GetLastName], niektórzy urzędnicy zaczęli się zastanawiać, co takiego zrobili w życiu nie tak, że sami nie znaleźli sobie równie dobrych partii."
 manzoni.712.g: "Tam, gdzie rodzi się miłość!"
 manzoni.712.h: "Taki rozwój wydarzeń zasługuje na krytykę."
 manzoni.713.t: "Propaganda Rządowa"
 manzoni.713.d: "W jednym z regionów gazety należące do [SCOPE.sCharacter('target_character_1').GetFullName] stały się tak dominującą siłą w codziennym życiu, że praktycznie wszystkie informacje o bieżących wydarzeniach pochodzą wyłącznie z tego źródła. W praktyce [SCOPE.sCharacter('target_character_1').GetLastName] może decydować o tym, co jest prawdą. Na szczęście publikowane tam treści są prorządowe."
 manzoni.713.f: "„To ja jestem prasą”. -[SCOPE.sCharacter('target_character_1').GetFullNameNoFormatting]"
 manzoni.713.g: "Po co cenzura, skoro prasa służy rządowi?"
 manzoni.714.t: "Dyskretne Dotacje"
 manzoni.714.d: "Gazety należące do [SCOPE.sCharacter('target_character_1').GetFullName] od lat otrzymują ukryte dotacje ze Skarbu Państwa. Rząd kupuje sobie przychylność prasy. Pośrednikiem jest partyjny kolega [SCOPE.sCharacter('target_character_1').GetLastName], [SCOPE.sCharacter('target_character_2').GetFullName]. Cała sprawa podważyła zaufanie do prasy."
 manzoni.714.f: "„Spotykam dziennikarzy w teatralnych foyer i aż mnie wzdryga na ich widok. Dziennikarstwo to piekło, bezdenna otchłań nieprawości, zdrady i kłamstw; nikt nie może przez nią przejść nieskalany, chyba że, niczym Dante, chroni go święty wawrzyn Wergiliusza.”— Honoré de Balzac"
 manzoni.714.g: "Współpraca układa się dobrze, o co chodzi?"
 manzoni.714.h: "Ta współpraca między prasą a państwem musi się skończyć!"
 manzoni.721.t: "[SCOPE.gsInterestGroup('target_ig_2').GetName] na Celowniku"
 manzoni.721.d: "[SCOPE.sCharacter('target_character_1').GetFullName] polecił(a) [SCOPE.sCharacter('target_character_1').GetHerHis] gazecie wziąć na celownik [SCOPE.gsInterestGroup('target_ig_2').GetName], która obecnie obsadza stanowiska ministerialne w rządzie. [SCOPE.sCharacter('target_character_1').GetSheHe|U] rozpętał(a) prawdziwe polowanie na czarownice, a gazety sprzedają się coraz lepiej z każdym sensacyjnym nagłówkiem."
 manzoni.721.f: "„Kto majstruje przy kodach pocztowych?\nKto knuje wzdłuż kolejowych torów?\nKto szepcze „Prawdę” zza wachlarza\nI kwestionuje koronę, Kościół i człowieka?\n[SCOPE.gsInterestGroup('target_ig_2').GetName]! Ci uczeni szkodnicy!\nNie ustają w swych próżnych protestach!”"
 manzoni.721.g: "Kłamstwa! Nic prócz kłamstw!"
 manzoni.721.h: "Ten artykuł nie zostanie ponownie rozpowszechniony."
 manzoni.721.i: "Ale skoro gazeta tak twierdzi?"
 manzoni.722.t: "Głos Opozycji"
 manzoni.722.d: "Wykorzystując [SCOPE.sCharacter('target_character_1').GetHerHis] wpływy medialne, [SCOPE.sCharacter('target_character_1').GetFullName] pochwalił(a) [SCOPE.gsInterestGroup('target_ig_1').GetName] w wpływowym artykule. Powiązane z nim imperium medialne już przejęło ton przekazu i bije w propagandowy bęben."
 manzoni.722.f: "„Dziennikarstwo, zamiast pozostawać w rękach kapłańskiej kasty, stało się najpierw bronią partyjną, a następnie przedmiotem handlowej spekulacji, prowadzonej bez sumienia i skrupułów, podobnie jak inne przedsięwzięcia tego rodzaju. Każda gazeta, jak mówi Blondet, jest sklepem, do którego ludzie przychodzą po opinie w odpowiednim odcieniu. Gdyby istniała gazeta dla garbusów, głosiłaby otwarcie, rano i wieczorem, na swoich łamach piękno, użyteczność i konieczność deformacji.” — Honoré de Balzac"
 manzoni.722.g: "Co nas obchodzi ta tania propaganda?"
 manzoni.722.h: "Sfinansowano polemikę w przychylnej nam gazecie."
 manzoni.723.t: "Afera [SCOPE.sCharacter('target_character_2').GetLastName]"
 manzoni.723.d: "[SCOPE.sCharacter('target_character_1').GetFullName] wywołał(a) ogólnokrajowy kryzys, publikując obszerny artykuł redakcyjny poparty serią reportaży śledczych. Wygląda na to, że [SCOPE.sCharacter('target_character_2').GetFullName] sprzeniewierzył(a) środki finansowe. Opinia publiczna jest oburzona marnotrawstwem pieniędzy podatników, rząd pogrąża się w kryzysie, [SCOPE.gsInterestGroup('target_ig_2').GetName] ogarnia panika, a wydawnictwo [SCOPE.sCharacter('target_character_1').GetLastName] przeżywa bezprecedensowy rozkwit."
 manzoni.723.f: "[SCOPE.sCharacter('target_character_1').GetSheHe|U] był(a) niedoceniany(a). Przez lata [SCOPE.sCharacter('target_character_1').GetLastName] uchodził(a) za kolejnego zwykłego wydawcę. Jednak [SCOPE.sCharacter('target_character_1').GetHerHis] ambicja, by zwiększyć wpływy [SCOPE.gsInterestGroup('target_ig_1').GetName] i odsunąć od władzy rząd, którym [SCOPE.sCharacter('target_character_1').GetSheHe] gardził(a), zaczyna przynosić owoce. Od miesięcy [SCOPE.sCharacter('target_character_1').GetSheHe] wysyła [SCOPE.sCharacter('target_character_1').GetHerHis] najlepszych dziennikarzy do badania działalności urzędów i przedstawicieli rządu, by ujawnić historyczny skandal defraudacyjny. Nawet dawni krytycy muszą przyznać, że była to znakomita praca dziennikarska, która jeszcze przez wiele lat będzie służyć innym dziennikarzom. Dla przedstawicieli państwa i rządu ten atak ma jednak nieobliczalne konsekwencje. Mówi się o dymisjach, rekonstrukcji rządu, a nawet możliwych nowych wyborach."
 manzoni.723.g: "To tylko propaganda opozycji!"
 manzoni.723.h: "Ta dymisja jest już dawno spóźniona."
 manzoni.723.i: "Przeprowadź Rekonstrukcję Całego Rządu."
 manzoni.723.j: "Niech naród zdecyduje przy urnach wyborczych!"
 manzoni.731.t: "Większy Nakład za Wszelką Cenę"
 manzoni.731.d: "[SCOPE.sCharacter('target_character_1').GetFullName] żywi głębokie przekonanie, że nakład spada wyłącznie dlatego, że [SCOPE.sCharacter('target_character_1').GetHerHis] czasopismo nie jest wystarczająco brukowcowe."
 manzoni.731.f: "„Mam wrażenie, że straciliśmy kontakt ze zwykłymi ludźmi. Nie możemy zamykać się w wieży z kości słoniowej. Musimy znów przyspieszyć. Potrzebujemy krótkich, dynamicznych tekstów — najwyżej trzy, cztery akapity. Więcej hitów! HITÓW! Więcej artykułów o atakach nożem — krew musi tryskać!” -[SCOPE.sCharacter('target_character_1').GetFullNameNoFormatting]"
 manzoni.731.g: "OHYA!"
 manzoni.731.h: "Czy nie ma choć jakichś zasad etyki dziennikarskiej?"
