 manzoni.3.d: "Zasadnicze zmiany w [Concept('concept_manzoni_popular_taste','$concept_manzoni_popular_tastes_audience|q$')], wynikające z przemian politycznych, społecznych i kulturowych w kraju, doprowadziły do zmiany preferencji dotyczących literackiego [concept_manzoni_genre] w [GetPlayer.GetName]."
 manzoni.3.f_juvenile: "W XVII i XVIII wieku purytanie w Anglii i Ameryce publikowali książki dla dzieci przesiąknięte etyką protestancką. Jedne z pierwszych książek dla dzieci, które łączyły cele czysto edukacyjne z rozrywką, zostały wydane przez Johna Newbery'ego w latach 40. XVIII wieku. Kilka lat wcześniej Thomas Boreman napisał „Gigantick Histories”. Niemniej jednak wartości moralistyczne nadal kształtowały treść wielu książek dla dzieci aż do końca XIX wieku, choć od połowy XVIII wieku przekaz czysto religijny był coraz częściej zastępowany racjonalnym moralizmem propagowanym przez Locke'a i Rousseau. Od połowy XIX wieku literatura fantastyczna i opowieści przygodowe zyskiwały coraz większą akceptację jako literatura dziecięca."
 manzoni.3.f_crime: "Choć początki powieści kryminalnej sięgają znacznie wcześniejszych czasów, dopiero w XIX wieku ugruntowała ona swoją pozycję jako gatunek literacki. Zazwyczaj koncentruje się na przestępstwie oraz ściganiu sprawcy i prowadzeniu śledztwa przez policję, detektywa lub osobę prywatną. Możliwości ukazania psychologicznych motywów kierujących przestępcą, przedstawienia otoczenia czy zmagań śledczego z własnym sumieniem wykorzystywano również do tworzenia wyrafinowanych dzieł literackich. „Zbrodnię i karę” Fiodora Dostojewskiego można uznać za powieść kryminalną. Granice między powieścią kryminalną a thrillerem czy powieścią sensacyjną bywają płynne."
 manzoni.3.f_adventure: "Literatura przygodowa jest równie stara jak sama literatura. Jej korzenie sięgają starożytności, a nawet czasów starożytnego Bliskiego Wschodu. Za kolejnych prekursorów współczesnych powieści przygodowych uważa się średniowieczne romanse arturiańskie i rycerskie. Od XIX wieku zaczęły powstawać liczne dzieła literatury przygodowej, której najbardziej znanymi przedstawicielami byli Aleksander Dumas, Robert Louis Stevenson, Karl May i Juliusz Verne."
 manzoni.3.f_science: "Jeszcze zanim powstało pojęcie science fiction, wizje przyszłego rozwoju techniki pojawiały się w literaturze co najmniej od średniowiecza. Sam termin został po raz pierwszy użyty w 1851 roku przez brytyjskiego poetę i eseistę Williama Wilsona. W XIX wieku równolegle z wiarą w naukę narastał lęk przed nauką i techniką. Wiara ta i towarzyszący jej lęk połączyły się, tworząc charakterystyczną dla nowej epoki, wewnętrznie sprzeczną postawę człowieka postrzegającego siebie jako nowego, mitycznego tytana, który obawia się własnej potęgi. Właśnie dlatego zaczęły powstawać dystopie, takie jak dzieła Aldousa Huxleya i George’a Orwella. Ta dwoistość stanowi cechę charakterystyczną literatury science fiction."
 manzoni.3.f_social: "Początki współczesnej krytyki społecznej sięgają co najmniej epoki oświecenia. Literatura piękna może wywierać znaczący wpływ na społeczeństwo. Na przykład powieść „Chata wuja Toma” autorstwa Harriet Beecher Stowe, wydana w 1852 roku, przyczyniła się do rozwoju ruchu na rzecz zniesienia niewolnictwa w Stanach Zjednoczonych. George Orwell i Charles Dickens napisali odpowiednio „Folwark zwierzęcy” i „Opowieść o dwóch miastach”, aby wyrazić swoje rozczarowanie społeczeństwem i naturą ludzką."
 manzoni.3.f_literary: "Termin „literatura piękna” jest często używany jako synonim literatury w węższym znaczeniu, obejmującym utwory uznawane za szczególnie wartościowe pod względem artystycznym. Literatura piękna obejmuje również dzieła klasyczne, czyli utwory z różnych dziedzin uznane za wzorcowe lub szczególnie godne uwagi. Choć literatura piękna jest powszechnie uważana za bardziej wartościową artystycznie niż literatura gatunkowa, obie te kategorie nie wykluczają się wzajemnie."
 manzoni.3.f_devotional: "Literatura religijna pierwotnie oznaczała popularne pisma o charakterze religijnym. Nie była to jednak literatura teologiczna, ponieważ nie podejmowała naukowych rozważań ani nie miała na celu formułowania dogmatów. Wraz z przemianami epoki nowożytnej coraz większy nacisk kładziono na życie duchowe i wewnętrzne przeżycia, czemu towarzyszył wzrost pobożności. Literatura ta stanowiła przewodnik po cnotliwym życiu, mający na celu duchowe pokrzepienie i emocjonalne podniesienie na duchu czytelnika."
 manzoni.3.f_romance: "Popularna powieść romantyczna należy do rozległego nurtu literatury trywialnej, skierowanego przede wszystkim do czytelniczek, a jej fabuła zazwyczaj opiera się na prostych, łatwo przyswajalnych schematach. Nie każdą powieść romantyczną można jednak zaliczyć do literatury trywialnej, ponieważ takich tematów jak śmierć dzieci, przemoc, śmiertelne choroby czy inne równie złożone zagadnienia nie da się łatwo sprowadzić do banalnych schematów."
 manzoni.3.g: "Gusta i mody przychodzą i odchodzą."
 manzoni.10.t: "Nowy Wydawca"
 manzoni.10.d: "Nowe wydawnictwo [SCOPE.sCharacter('manzoni_publisher_scope').GetLastNameNoFormatting] otworzyło dziś swoje podwoje w [SCOPE.sState('manzoni_publisher_state').GetName]. Już od południa rozlega się tam stukot maszyn drukarskich. Życie społeczne w [GetPlayer.GetName] wzbogaciło się o nowy wymiar."
 manzoni.10.f: "Nowe wydawnictwo w [SCOPE.sState('manzoni_publisher_state').GetName] wzbudza obecnie duże zainteresowanie opinii publicznej. [SCOPE.sCharacter('manzoni_publisher_scope').GetFullName] ogłosił dziś w specjalnie wydanej ulotce, że jego przedsiębiorstwo będzie odtąd wprowadzać na rynek liczne nowe publikacje. Wiadomość rozeszła się więc niezwykle szybko, a przed budynkiem zgromadził się tłum gapiów. Już teraz pojawiają się pytania o to, w jakiej dziedzinie będzie specjalizować się nowe wydawnictwo."
 manzoni.10.g: "Z pewnością wydawca literatury wysokiej."
 manzoni.10.h: "To wydawca naukowy, prawda?"
 manzoni.10.i: "Myślę, że to wydawnictwo zapewni ludziom dobrą rozrywkę."
 manzoni.10.j: "Wydawnictwo artystyczne, to byłoby wspaniałe!"
 manzoni.11.t: "Wydawca Publiczny"
 manzoni.11.d: "Dzięki wydawnictwu [SCOPE.sCharacter('manzoni_publisher_scope').GetLastNameNoFormatting] region [SCOPE.sState('manzoni_publisher_state').GetName] może poszczycić się jednym z najciekawszych i najbardziej dynamicznych wydawnictw w [GetPlayer.GetName]. Przedsiębiorstwo zamierza w przyszłości jeszcze bardziej rozszerzyć swoją działalność, a jego właściciel, [SCOPE.sCharacter('manzoni_publisher_scope').GetFullName], już teraz należy do najważniejszych przedstawicieli branży."
 manzoni.11.f: "Wydawnictwo komercyjne może przedkładać ilość nad jakość, ale stanowi jedną z pionierskich instytucji XIX wieku: literatura przestaje być przywilejem wąskiej, zamożnej warstwy społeczeństwa, mającej dostęp do nielicznych tytułów, a staje się produktem dostępnym dla coraz szerszych kręgów ludności, w tym również dla mniej zamożnych warstw społecznych. Rozwój wydawnictw komercyjnych oznacza nie tylko zaspokajanie potrzeb masowego odbiorcy, lecz także możliwość osiągnięcia sukcesu na masową skalę."
 manzoni.11.g: "To wydawnictwo stanowi filar naszego przemysłu wydawniczego."
 manzoni.12.t: "Wydawca Literacki"
 manzoni.12.d: "[SCOPE.sCharacter('manzoni_writer_scope').GetFullName] podpisał dziś umowę wydawniczą z wydawnictwem [SCOPE.sCharacter('manzoni_publisher_scope').GetLastNameNoFormatting]. Przedsiębiorstwo, którego siedziba znajduje się w [SCOPE.sState('manzoni_publisher_state').GetName], ma szansę stać się jednym z najbardziej cenionych wydawnictw literackich."
 manzoni.12.f: "Prestiżowe wydawnictwo literackie stanowi ukoronowanie rozwoju każdego przemysłu wydawniczego. Jego powstanie jest w pełni uzasadnione, gdy [concept_manzoni_national_writer] zdobywa sławę Wielkiego Pisarza. Jako instytucja dbająca o zachowanie i rozpowszechnianie jego dzieł, wydawnictwo pozostanie ważnym ośrodkiem życia literackiego nawet po śmierci pisarza."
 manzoni.12.g: "To wydawnictwo stanowi filar naszych standardów literackich."
 manzoni.13.t: "Wydawca Naukowy"
 manzoni.13.d: "Przełomowe odkrycia [SCOPE.sCharacter('manzoni_scientist_scope').GetFullName] od pewnego czasu odbijają się szerokim echem w świecie nauki. Jego rozprawy naukowe i książki są regularnie publikowane przez wydawnictwo [SCOPE.sCharacter('manzoni_publisher_scope').GetLastNameNoFormatting]. Wydawnictwo ogłosiło właśnie, że zamierza dalej rozwijać swoją działalność i stać się jednym z czołowych wydawnictw naukowych w [GetPlayer.GetName]."
 manzoni.13.f: "Wydawnictwa naukowe mogą powstawać dzięki współpracy przemysłu wydawniczego ze środowiskiem naukowym, na przykład gdy naukowiec napisze rozprawę naukową. Wydawnictwo specjalizujące się w publikacjach naukowych będzie również stanowić ważne wsparcie dla studentów, rzetelnie przekazując im najnowszą wiedzę o nowych odkryciach i technologiach."
 manzoni.13.g: "To wydawnictwo stanowi filar naszego środowiska naukowego."
 manzoni.14.t: "Wydawca Artystyczny"
 manzoni.14.d: "Wydawnictwo [SCOPE.sCharacter('manzoni_publisher_scope').GetLastNameNoFormatting] ogłosiło, że w przyszłości będzie publikować dzieła naszego wysoko cenionego artysty [SCOPE.sCharacter('manzoni_artist_scope').GetFullName]. Prawdopodobnie jest to początek działalności obiecującego wydawnictwa artystycznego o znaczeniu ogólnokrajowym."
 manzoni.14.f: "Jeśli arcydzieło wielkiego artysty zyskuje na tyle duże znaczenie, że ktoś decyduje się je opublikować, może to zapoczątkować wspaniały rozwój świata sztuki. Zbiory nut czy książki ilustrowane są nie tylko pięknymi dziełami, które mogą podziwiać wykształceni miłośnicy sztuki – stanowią również źródło inspiracji i wiedzy dla kolejnych pokoleń artystów pragnących podążać śladami wielkiego mistrza."
 manzoni.14.g: "To wydawnictwo stanowi filar naszego życia kulturalnego."
 artists.52.h: "Z wielkim zainteresowaniem będziemy śledzić rozwój [SCOPE.sCharacter('manzoni_new_writer_scope').GetHerHis] kariery!"
 manzoni.101.t: "[SCOPE.sCharacter('manzoni_writer_scope').GetCustom('manzoni_writer_bestseller_title_work_type')] autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName]"
 manzoni.101.d: "[SCOPE.sCharacter('manzoni_writer_scope').GetCustom('manzoni_writer_local_or_national_short_text_type')] stworzył bestsellerowe dzieło typu [SCOPE.sCharacter('manzoni_writer_scope').GetCustom('manzoni_writer_work_type')]. Utwór zatytułowany „[SCOPE.sCharacter('manzoni_writer_scope').GetCustom('manzoni_writer_bestseller_title_work_type')]” należy do gatunku [SCOPE.sCharacter('manzoni_writer_scope').GetCustom('manzoni_writer_work_genre_type')] i reprezentuje formę literacką [SCOPE.sCharacter('manzoni_writer_scope').GetCustom('manzoni_writer_work_type')]."
 manzoni.101.f: "[SCOPE.sCharacter('manzoni_writer_scope').GetCustom('manzoni_writer_bestseller_flavor_work_type')]"
 manzoni.101.g: "Fantastyczny!"
 manzoni.201.g: "Uwielbiam tę książkę!"
 manzoni.102.t: "Światowa Sława dla [SCOPE.sCharacter('manzoni_writer_scope').GetFullName]"
 manzoni.102.d: "Nasz pisarz [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] cieszy się wielkim uznaniem nie tylko w kraju, ale również za granicą. [SCOPE.sCharacter('manzoni_writer_scope').GetHerHis|U] dzieła są obecnie uznawane za część literatury światowej!"
 manzoni.102.f: "Renomowane wydawnictwa na całym świecie włączyły dzieła naszego artysty do swoich planów wydawniczych. Dzięki temu dociera on do odbiorców daleko poza granicami naszego kraju. Licencje na książki stały się obecnie niezwykle poszukiwanym towarem."
 manzoni.102.g: "Miejmy nadzieję, że sława nie uderzy [SCOPE.sCharacter('manzoni_writer_scope').GetHerHis] do głowy."
 manzoni_universal_writer: "Wszechstronny Pisarz"
 manzoni_universal_writer_desc: "Ten pisarz jest uznawany za twórcę literatury światowej."
 manzoni_writer_local_or_national_short_text_national_writer_loc: "Nasz Pisarz Narodowy, [ROOT.GetCharacter.GetFullName],"
 manzoni_writer_local_or_national_short_text_local_writer_loc: "[ROOT.GetCharacter.GetFullName], lokalny pisarz [GetPlayer.GetAdjective]"
 manzoni.301.t: "Bibliomania [SCOPE.sCulture('print_addict_culture').GetName]"
 manzoni.301.d: "[GetPlayer.GetName] może poszczycić się prężnie rozwijającym się przemysłem wydawniczym oraz znakomitą elitą literacką. Dobrze wykształceni obywatele kraju coraz bardziej interesują się życiem kulturalnym. Niektórzy mówią już o prawdziwym uzależnieniu od słowa pisanego – głód wszelkich drukowanych i pisanych materiałów wydaje się nie mieć granic. Obywatele należący do kultury [SCOPE.sCulture('print_addict_culture').GetName] są szczególnie podatni na tę rodzącą się modę."
 manzoni.301.f: "Termin bibliomania odnosi się do nadmiernej pasji kolekcjonowania książek, wykazującej cechy uzależnienia lub zaburzenia obsesyjno-kompulsyjnego. W przeciwieństwie do nieszkodliwej bibliofilii, której często towarzyszy gromadzenie prywatnego księgozbioru, bibliomania wiąże się z przymusowym gromadzeniem książek, popadaniem w ruinę finansową wskutek kolekcjonerstwa lub popełnianiem przestępstw w celu zaspokojenia swojej obsesji. Pierwszym znanym przypadkiem bibliomana dopuszczającego się przestępstw w Niemczech był saksoński duchowny Johann Georg Tinius. Sprzeniewierzał on fundusze kościelne i dopuścił się kilku prób zabójstwa na tle rabunkowym, podczas których posługiwał się środkami odurzającymi, aby sfinansować swoją kolekcjonerską pasję. Sam katalog aukcyjny pozostałości biblioteki Tiniusa obejmował 16 650 dzieł. Przykładem bibliotafa, czyli osoby ukrywającej swój księgozbiór przed innymi, był hrabia de Lignerolles, który podobno od 1848 roku całkowicie wycofał się z życia towarzyskiego i poświęcił się wyłącznie powiększaniu oraz pielęgnowaniu swojej kolekcji książek, przechowywanej w specjalnie urządzonym mieszkaniu w Paryżu. Nie dzielił się swoją wiedzą z innymi, a nawet zaprzeczał, jakoby posiadał niektóre książki. Rozmiary i wartość jego kolekcji wyszły na jaw dopiero wtedy, gdy po jego śmierci książki wystawiono na aukcję."
 manzoni.301.g: "Ale przecież wszyscy wiedzą, jak niebezpieczne jest czytanie!"
 manzoni.302.t: "Czy Bibliomania ma już swój szczyt za sobą?"
 manzoni.302.d: "W przemyśle wydawniczym zaczyna się kryzys: najwyraźniej znaczna część społeczeństwa straciła zainteresowanie czytaniem, czy to z powodu niskiej jakości książek, czy też zmieniających się sposobów spędzania wolnego czasu."
 manzoni.302.f: "Istnieje świat poza książkami. Pomoc jest możliwa. Filmy, sport, uzależnienie od alkoholu i hazard dostarczają podobnych bodźców i mogą pomóc osobom dotkniętym bibliomanią powrócić do życia społecznego."
 manzoni.302.g: "Książki i tak są nudne."
 manzoni.302.h: "Rozpocznij kampanię na rzecz rozbudzenia miłości do czytania!"
 manzoni.303.t: "Klub Książki Madame [SCOPE.sCharacter('manzoni_bookmadame_scope').GetLastNameNoFormatting]"
 manzoni.303.d: "Wpływowa i wykształcona dama w [SCOPE.sState('manzoni_book_state').GetName] założyła klub książki, który stał się miejscem spotkań miłośników literatury. Przyciąga on ludzi spragnionych lektury."
 manzoni.303.f: "Choć kobiety tworzyły grupy zajmujące się studiowaniem Biblii już od XVII wieku, świeckie kręgi czytelnicze zaczęły powstawać w Ameryce i Europie dopiero pod koniec XVIII wieku. Kręgi czytelnicze nie były ograniczone do określonych ras ani klas społecznych. Jedna z pierwszych grup czytelniczych dla czarnoskórych kobiet powstała w 1827 roku w Lynn w stanie Massachusetts. Przez cały XIX wiek kobiece kręgi czytelnicze rozwijały się, a niektóre z nich zaczęły otwarcie zabierać głos w kwestiach społecznych, takich jak zniesienie niewolnictwa, zapowiadając rozwój ruchu klubowego pod koniec stulecia. Jeszcze w XX wieku kluby książki nadal służyły zarówno jako przestrzeń wymiany myśli, jak i narzędzie radykalnej działalności politycznej."
 manzoni.303.g: "Fantastyczna inicjatywa."
 manzoni.304.t: "Kwitnący Przemysł Książkowy"
 manzoni.304.d: "Prężnie rozwijające się wydawnictwo [SCOPE.sCharacter('manzoni_publisher_scope').GetLastNameNoFormatting]&[SCOPE.sCharacter('manzoni_publisher_scope').GetLastNameNoFormatting] w [SCOPE.sState('manzoni_book_state').GetName] stało się znaczącym graczem na rynku. Najwyraźniej jego właściciel [SCOPE.sCharacter('manzoni_publisher_scope').GetFullName] doskonale wyczuł ducha epoki."
 manzoni.304.f: "W przeszłości wydawnictwo [SCOPE.sCharacter('manzoni_publisher_scope').GetLastNameNoFormatting]&[SCOPE.sCharacter('manzoni_publisher_scope').GetLastNameNoFormatting] było znane jedynie wąskiemu gronu wtajemniczonych, zdobywając uznanie dzięki niewielkim publikacjom. Jednak książki wydawane dotąd w małych nakładach stały się ulubionymi lekturami czytelników, dlatego przedsiębiorstwo rozszerzyło zakres swojej działalności i zamierza teraz w większym stopniu dostosować ofertę do gustów masowego odbiorcy. Krytycy już dostrzegają obniżenie dotychczasowego poziomu artystycznego publikacji, ale być może jest to po prostu znak czasów."
 manzoni.304.g: "Produkuj jeszcze więcej książek!"
 manzoni.304.h: "Wydawaj książki wysokiej jakości."
 manzoni.311.t: "Wydawnictwo jako Pionek"
 manzoni.311.d: "Tradycyjne wydawnictwo w [SCOPE.sState('manzoni_book_state').GetName] stoi na skraju bankructwa. Konkurencyjny wydawca złożył ofertę, która pozwoliłaby uratować liczne miejsca pracy. Jest on jednak blisko związany z partią opozycyjną, a dokładniej z grupą interesu [SCOPE.sCharacter('publisher_ig_leader').GetInterestGroup.GetName]."
 manzoni.311.f: "W świecie mediów zapanowało poruszenie, gdy w zeszłym tygodniu duże wydawnictwo ogłosiło, że stoi na skraju bankructwa i będzie musiało zwolnić wielu pracowników. Znalezienie wkrótce innego wydawnictwa, które chciało przejąć całe przedsiębiorstwo i obiecało, że nie dojdzie do żadnych redukcji zatrudnienia, wydawało się prawdziwym zrządzeniem losu. Jest jednak pewien haczyk. Za hojną ofertą stoi grupa interesu [SCOPE.sCharacter('publisher_ig_leader').GetInterestGroup.GetName], która posiada znaczne udziały w wydawnictwie. Fuzja przedsiębiorstw odbyłaby się zatem pod kierownictwem ugrupowania politycznego. Krytycy już zauważyli, że mogłoby to doprowadzić do wywierania znaczącego wpływu na rynek medialny, wykraczającego poza granice regionu. Niektórzy podejrzewają nawet, że za całą sprawą kryje się plan opracowany przez [SCOPE.sCharacter('publisher_ig_leader').GetFullName]."
 manzoni.311.g: "Jeśli ratują przedsiębiorstwo, dlaczego mielibyśmy rzucać im kłody pod nogi?"
 manzoni.311.h: "Nie możemy dopuścić do takich wpływów politycznych!"
 manzoni.312.t: "Wydawca Opozycyjny"
 manzoni.312.d: "W [SCOPE.sState('manzoni_book_state').GetName] jedno z wydawnictw zyskało znaczącą pozycję. Najwyraźniej zamierza w najbliższej przyszłości rozszerzyć swoją działalność, a swoją rolę postrzega przede wszystkim jako przeciwwagę dla polityki rządu, utrzymując bliskie związki z partiami opozycyjnymi. Niektórzy członkowie rządu uważają, że można by utrudnić działalność tego kłopotliwego przedsiębiorstwa, stawiając na jego drodze kilka przeszkód biurokratycznych."
 manzoni.312.f: "„Opinie innych i wolność słowa są niezwykle cenne. Czy jednak nie powinniśmy jeszcze bardziej cenić własnych słów, sir?”"
 manzoni.312.g: "Kilka decyzji administracyjnych mogłoby utrudnić im prowadzenie działalności."
 manzoni.312.h: "Nie potrzebujemy takich brudnych sztuczek."
 manzoni.321.t: "Licencja na Książkę"
 manzoni.321.d: "Wydawnictwo [SCOPE.sCharacter('manzoni_publisher_scope').GetLastNameNoFormatting] podpisało dziś umowę na wyłączność z pisarzem [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] z kraju [SCOPE.sCountry('manzoni_country_scope').GetName]. Dzieła, których autorem jest [SCOPE.sCharacter('manzoni_writer_scope').GetHerHis], cieszą się ogromną popularnością wśród czytelników."
 manzoni.321.f: "Wydawnictwa nie mogą ignorować gustów czytelników. Odnoszący sukcesy zagraniczni autorzy, których twórczość odpowiada duchowi epoki, mają szansę na publikację swoich dzieł w naszym kraju."
 manzoni.321.g: "Ale dlaczego ludzie nie czytają dzieł rodzimych autorów?"
 manzoni.322.t: "Zagraniczna Literatura Brukowa"
 manzoni.322.d: "Od pewnego czasu jedno z lokalnych wydawnictw publikuje dzieła zagranicznego autora [SCOPE.sCharacter('manzoni_writer_scope').GetFullName]. Krytycy są zgodni, że ta literatura brukowa ma bardzo wątpliwą wartość i negatywnie wpływa na poziom naszego rynku wydawniczego. Mimo to ten kicz sprzedaje się jak świeże bułeczki."
 manzoni.322.f: "„Czy naprawdę warto publikować wszystko, co zostanie napisane? Czy zagralibyście każdy utwór tylko dlatego, że ktoś zapisał kilka nut na flet? I dlaczego dziecięce rysunki trafiają na lodówkę, a nie do galerii sztuki? Niektóre wypociny literackie są po prostu tym, czym są: śmieciami!”"
 manzoni.322.g: "Zakazać tego zagranicznego chłamu!"
 manzoni.322.h: "Skoro ludzie chcą to czytać, nie może być aż tak złe."
 manzoni.323.t: "Pirackie Kopie"
 manzoni.323.d: "Przedstawiciel Departamentu Handlu kraju [SCOPE.sCountry('manzoni_country_scope').GetName] złożył nam dziś skargę. Podobno wydawnictwo w [SCOPE.sState('manzoni_book_state').GetName] publikuje bez licencji ważne dzieła ich Pisarza Narodowego [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] i zbija na tym fortunę. Poproszono nas o położenie kresu temu piractwu."
 manzoni.323.f: "Niestety w XVIII wieku wciąż powszechną praktyką było pozbawianie autorów i ich wydawców należnych dochodów przez konkurencję, która kopiowała dzieła bez zgody twórców. Od XIX wieku zaczęto wprowadzać udoskonalone przepisy chroniące prawa autorów i wydawców, jednak często obowiązywały one wyłącznie na szczeblu krajowym. Zagraniczne wydawnictwa nadal nierzadko drukowały kopie i tłumaczenia bez zgody autorów. Dotykało to nawet pisarzy o międzynarodowej sławie, takich jak Juliusz Verne, którego książki rozpowszechniano w krajach anglojęzycznych bez zezwolenia, a niekiedy poddawano daleko idącym przeróbkom."
 manzoni.323.g: "Wstrzymaj pracę maszyn drukarskich do czasu wynegocjowania umowy."
 manzoni.323.h: "Wstrzymaj pracę maszyn drukarskich do czasu wynegocjowania umowy."
 manzoni.331.t: "Międzynarodowe Tournée Literackie [SCOPE.sCharacter('manzoni_writer_scope').GetLastName]"
 manzoni.331.d: "Najwybitniejszy pisarz kraju [GetPlayer.GetNameNoFlag], [SCOPE.sCharacter('manzoni_writer_scope').GetFullName], po wstępnych rozmowach z zagranicznym wydawcą postanowił również uhonorować [SCOPE.sCharacter('manzoni_writer_scope').GetHerHis] czytelników za granicą, osobiście odczytując [SCOPE.sCharacter('manzoni_writer_scope').GetHerHis] własne dzieła. Pierwszym celem podróży będzie [SCOPE.sCountry('manzoni_writer_destination_scope').GetName]."
 manzoni.331.f: "Pisarze mogą odbyć tournée literackie raz w swojej karierze. Celem podróży są kraje, w których gusta czytelników odpowiadają gatunkowi literackiemu uprawianemu przez autora. Każdy kolejny przystanek pozwala zwiększyć reputację, rozwinąć tradycję literacką i poprawić stosunki dyplomatyczne. Podczas tournée pisarz może odwiedzić maksymalnie 5 krajów. Podróż kończy się również wtedy, gdy nie ma już innych krajów, w których jego gatunek literacki cieszyłby się zainteresowaniem."
 manzoni.331.g: "Powodzenia!"
 manzoni.332.t: "[SCOPE.sCharacter('manzoni_writer_scope').GetLastName] przybywa do [GetPlayer.GetNameNoFlag]"
 manzoni.332.g: "Zorganizuj spotkanie z lokalnym wydawcą."
 manzoni.332.h: "Zorganizuj publiczne spotkanie autorskie w salonie literackim."
 manzoni.332.i: "Monarcha pragnie prywatnej prezentacji dzieł, których autorem jest [SCOPE.sCharacter('manzoni_writer_scope').GetHerHis]."
 manzoni.332.j: "Zgotuj [SCOPE.sCharacter('manzoni_writer_scope').GetHerHim] serdeczne powitanie."
 manzoni.333.t: "Spotkanie Gigantów Literatury"
 manzoni.333.d: "Światowej sławy pisarz [SCOPE.sCharacter('manzoni_writer_2_scope').GetFullName] oraz nasz Pisarz Narodowy [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] spotkali się podczas premiery książki. Wymiana poglądów okazała się niezwykle owocna."
 manzoni.333.f: "„Jesteś naprawdę świetny.”\n„Dziękuję, ty też jesteś świetny.”\n„Nie, to ty jesteś świetny.”\n„Nie, właśnie ty.”"
 manzoni.333.g: "Inspirujące!"
 manzoni.334.t: "Kolejny Cel Podróży?"
 manzoni.334.d: "[SCOPE.sCharacter('manzoni_writer_scope').GetFullName] zakończył swój pobyt za granicą. Pojawia się pytanie, czy [SCOPE.sCharacter('manzoni_writer_scope').GetSheHe] powinien wrócić do kraju, czy też wybrać kolejny cel podróży."
 manzoni.334.f: "Pisarze mogą odbyć tournée literackie raz w swojej karierze. Celem podróży są kraje, w których gusta czytelników odpowiadają gatunkowi literackiemu uprawianemu przez autora. Każdy kolejny przystanek pozwala zwiększyć reputację, rozwinąć tradycję literacką i poprawić stosunki dyplomatyczne. Podczas tournée pisarz może odwiedzić maksymalnie 5 krajów. Podróż kończy się również wtedy, gdy nie ma już innych krajów, w których jego gatunek literacki cieszyłby się zainteresowaniem."
 manzoni.334.g: "[SCOPE.sCountry('manzoni_writer_destination_scope').GetName] byłby dobrym celem podróży."
 manzoni.334.h: "[SCOPE.sCharacter('manzoni_writer_scope').GetLastName] powinien wrócić."
 manzoni.341.t: "Krąg Literacki"
 manzoni.341.d: "[SCOPE.sCharacter('manzoni_writer_scope').GetFullName] założył w [ROOT.GetCountry.GetCapital.GetCityHubName] krąg literacki skupiający czołowych pisarzy kraju. Wydarzenie wzbudziło ogromne zainteresowanie opinii publicznej. Z tymi cyklicznymi spotkaniami wiązane są wielkie nadzieje."
 manzoni.341.f: "Kręgi literackie od zawsze były wpływowymi instytucjami kulturalnymi. Mogły mieć dość formalny charakter, jak francuscy parnasiści czy niemiecki Georgekreis. Przykładem nieformalnego towarzystwa literackiego byli Inklingowie, grupa dyskusyjna związana z J. R. R. Tolkienem i C. S. Lewisem, działająca na Uniwersytecie Oksfordzkim przez niemal dwie dekady, od początku lat 30. XX wieku do końca 1949 roku. Inklingowie byli miłośnikami literatury, którzy podkreślali wartość narracji w prozie fabularnej i zachęcali do tworzenia literatury fantastycznej. Najbardziej znanymi członkami grupy, poza Tolkienem i Lewisem, byli Charles Williams oraz Owen Barfield, choć ten ostatni mieszkał w Londynie."
 manzoni.341.g: "To znacząco podniesie poziom kultury literackiej naszego kraju."
 manzoni.341.h: "To zainspiruje nowe pokolenie artystów."
 manzoni.341.i: "Ten krąg literacki będzie wywierał silny wpływ na nasze społeczeństwo."
 manzoni.400.t: "[SCOPE.sCharacter('manzoni_writer_scope').GetFullName] krytykuje nasz rząd"
 manzoni.400.d: "[SCOPE.sCharacter('manzoni_writer_scope').GetFullName] jest niezadowolony z sytuacji politycznej w [GetPlayer.GetName]. Jeśli nie zmienimy naszej polityki, [SCOPE.sCharacter('manzoni_writer_scope').GetSheHe] może rozważyć rezygnację z pełnienia funkcji [concept_manzoni_national_writer]."
 manzoni.400.f: "„To oburzające! To niesprawiedliwe!” – [SCOPE.sCharacter('manzoni_writer_scope').GetFullNameNoFormatting]"
 manzoni.400.g: "Może powinniśmy coś zmienić..."
 manzoni.400_tt: "Jeśli [concept_approval] [concept_interest_group], do której należy [concept_manzoni_national_writer], spadnie poniżej #n -2#!, pisarz rozważy rezygnację. Masz rok na zwiększenie poziomu aprobaty."
 manzoni.401.t: "[SCOPE.sCharacter('manzoni_writer_scope').GetFullName] nie jest już Pisarzem Narodowym"
 manzoni.401.d: "Sytuacja w [GetPlayer.GetName] stała się nie do zniesienia dla [SCOPE.sCharacter('manzoni_writer_scope').GetFullName]. Dlatego [SCOPE.sCharacter('manzoni_writer_scope').GetSheHe] postanowił zrezygnować z roli naszego [concept_manzoni_national_writer] i nie być dłużej reprezentantem naszego narodu."
 manzoni.401.f: "„Mam już dość! Jesteście niekompetentnymi kretynami! Nie dbacie o nas! Nie pomagacie nam! To absolutnie niedopuszczalne!” – [SCOPE.sCharacter('manzoni_writer_scope').GetFullNameNoFormatting]"
 manzoni.401.g: "O nie! No cóż, nieważne!"
 manzoni.500.t: "[SCOPE.sCharacter('manzoni_writer_scope').GetFullName] ma dość rządu"
 manzoni.500.f: "„Potrzebujemy zmian! Ludzie cierpią! Od tej pory poświęcę swoją twórczość wyłącznie zmienianiu świata! Precz z dyktatorami!” – [SCOPE.sCharacter('manzoni_writer_scope').GetFullNameNoFormatting]"
 manzoni.500.g: "Dobrze."
 manzoni.500.h: "Zrób wszystko, co możliwe, aby powstrzymać [SCOPE.sCharacter('manzoni_writer_scope').GetHerHim]"
 manzoni.500.i: "Nie."
 manzoni.500.j: "Dobry Żart!"
 manzoni.510.t: "[SCOPE.sCharacter('manzoni_writer_scope').GetFullName] skupia się na pisaniu"
 manzoni.510.d: "Ponieważ sytuacja polityczna jest obecnie dość korzystna dla [SCOPE.gsInterestGroup('manzoni_writer_ig_scope').GetName], [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] uznał, że nadszedł odpowiedni moment, aby ustąpić ze stanowiska i całkowicie poświęcić się pisarstwu, które jest jedną z [SCOPE.sCharacter('manzoni_writer_scope').GetHerHis] pasji."
 manzoni.510.f: "„Wreszcie znów czuję natchnienie! Po tylu latach walki w słusznej sprawie mogę nareszcie wrócić do pisania! Och, moje opowieści będą fantastyczne! Może napiszę coś o polityce!” – [SCOPE.sCharacter('manzoni_writer_scope').GetFullNameNoFormatting]"
 manzoni.510.g: "Mam nadzieję, że [SCOPE.sCharacter('manzoni_writer_scope').GetSheHe] stworzy wspaniałe dzieła!"
 manzoni.510.h: "Myślę, że [SCOPE.sCharacter('manzoni_writer_scope').GetSheHe] powinien pozostać w polityce."
 set_character_as_local_writer_scope_effect_tt: "[SCOPE.sCharacter('wannabe_writer_scope').GetFullName] zostaje [concept_manzoni_local_writer]."
 manzoni.590.t: "Pojawia się Lokalny Pisarz"
 manzoni.590.d: "[SCOPE.sCharacter('manzoni_new_writer_scope').GetFullName], [concept_manzoni_local_writer], zdobywa coraz większą rozpoznawalność. Z pewnością [SCOPE.sCharacter('manzoni_new_writer_scope').GetSheHe] ma przed sobą wspaniałą przyszłość!"
 manzoni.590.f: "„Och, nie mogę się doczekać, aż zostanę najsłynniejszym pisarzem w [GetPlayer.GetName]! Chcę być najlepszy ze wszystkich!” – [SCOPE.sCharacter('manzoni_new_writer_scope').GetFullNameNoFormatting]"
 manzoni.590.g: "Im więcej pisarzy, tym lepiej!"
 manzoni.600.t: "Otwarcie Biblioteki Narodowej"
 manzoni.600.d: "Wraz z otwarciem Biblioteki Narodowej kraju [GetPlayer.GetNameNoFlag] uczyniono ważny krok w kierunku rozwoju wymiany wiedzy i edukacji społeczeństwa. [SCOPE.sCharacter('manzoni_librarian_scope').GetFullName] został mianowany pierwszym bibliotekarzem nowej instytucji."
 manzoni.600.f: "Biblioteki narodowe zaczęły powstawać w Europie pod koniec XVIII wieku, a okres ich największego rozkwitu przypadł na długi XIX wiek. Głównym celem było zapewnienie szerokim kręgom społeczeństwa obywatelskiego równego dostępu do edukacji, co uznawano za zadanie o znaczeniu narodowym. Jednocześnie instytucje angielskie i francuskie, uważane za wzór do naśladowania, służyły podkreślaniu aspiracji poszczególnych narodów do dominacji kulturowej oraz ich światowej misji. W ślad za nimi poszły instytucje amerykańskie i rosyjskie. Wraz z rozwojem i postępującą specjalizacją nauki biblioteki narodowe zaczęły również wypierać prywatne biblioteki akademickie."
 manzoni.600.g: "Szampan! Szampan!"
 manzoni.601.t: "Likwidacja Biblioteki"
 manzoni.601.d: "Administracja dąży do zgromadzenia w stolicy kompletnego księgozbioru narodowego. Podjęto zatem decyzję o zamknięciu biblioteki w [SCOPE.sState('manzoni_library_state').GetName] i przeniesieniu jej zbiorów."
 manzoni.601.f: "Jeśli z jakiegoś powodu [concept_manzoni_library] znajduje się poza stolicą, połowa jej księgozbioru zostanie automatycznie przeniesiona do stolicy. Biblioteki poza stolicą zostaną zamknięte."
 manzoni.601.g: "Ten znakomity księgozbiór wzbogaci naszą Bibliotekę Narodową."
 manzoni.601.h: "Wykorzystaj księgozbiór jako podstawę do utworzenia nowej Biblioteki Narodowej."
 manzoni.610.t: "Biblioteka Narodowa kraju [SCOPE.sCountry('manzoni_library_country').GetName]"
 manzoni.610.d: "Wraz z zajęciem stolicy wroga pod naszą kontrolą znalazła się również Biblioteka Narodowa kraju [SCOPE.sCountry('manzoni_library_country').GetName]. W chaosie kilku żołnierzy przyłapano już na kradzieży rzadkich książek. Coraz silniejsza staje się pokusa skonfiskowania księgozbioru i przeniesienia go do naszej własnej Biblioteki Narodowej."
 manzoni.610.f: "Guglielmo Libri był włoskim hrabią i matematykiem, który zasłynął ze swojego zamiłowania do dawnych i cennych rękopisów, a następnie z ich kradzieży. Jego oryginalne badania opierały się częściowo na około 1800 rękopisach i książkach autorstwa Galileusza, Fermata, Kartezjusza, Leibniza i innych wybitnych uczonych, które, jak twierdził, zgromadził w trakcie swojej kariery. W rzeczywistości, jak się później okazało, część z nich została skradziona z florenckiej Biblioteki Laurenziana. W 1841 roku Libri, dzięki przyjaźni z wpływowym francuskim szefem policji François Guizotem, otrzymał stanowisko Głównego Inspektora Bibliotek Francuskich. Praca ta, obejmująca między innymi katalogowanie cennych książek i rękopisów, pozwoliła hrabiemu Libriemu zaspokajać swoją kolekcjonerską pasję poprzez ich kradzież. Nadużywając swoich uprawnień i udając chorobę (kaszląc i nosząc obszerną pelerynę niezależnie od pogody), zdołał uzyskać możliwość przebywania bez nadzoru w archiwach bibliotek w całym kraju. Tam „wypożyczał” przedmioty, których nigdy nie zwracał. Udało mu się ukraść ponad 30 000 książek."
 manzoni.610.g: "Skonfiskuj książki."
 manzoni.610.h: "To byłby grzech przeciwko sztuce i kulturze!"
 manzoni.611.t: "Biblioteka Narodowa Splądrowana!"
 manzoni.611.d: "Wrogie wojska splądrowały naszą Bibliotekę Narodową! Przywrócenie tej prestiżowej instytucji do dawnej świetności zajmie całe lata!"
 manzoni.611.f: "Guglielmo Libri był włoskim hrabią i matematykiem, który zasłynął ze swojego zamiłowania do dawnych i cennych rękopisów, a następnie z ich kradzieży. Jego oryginalne badania opierały się częściowo na około 1800 rękopisach i książkach autorstwa Galileusza, Fermata, Kartezjusza, Leibniza i innych wybitnych uczonych, które, jak twierdził, zgromadził w trakcie swojej kariery. W rzeczywistości, jak się później okazało, część z nich została skradziona z florenckiej Biblioteki Laurenziana. W 1841 roku Libri, dzięki przyjaźni z wpływowym francuskim szefem policji François Guizotem, otrzymał stanowisko Głównego Inspektora Bibliotek Francuskich. Praca ta, obejmująca między innymi katalogowanie cennych książek i rękopisów, pozwoliła hrabiemu Libriemu zaspokajać swoją kolekcjonerską pasję poprzez ich kradzież. Nadużywając swoich uprawnień i udając chorobę (kaszląc i nosząc obszerną pelerynę niezależnie od pogody), zdołał uzyskać możliwość przebywania bez nadzoru w archiwach bibliotek w całym kraju. Tam „wypożyczał” przedmioty, których nigdy nie zwracał. Udało mu się ukraść ponad 30 000 książek."
 manzoni.611.g: "Oni zrobili CO?!"
