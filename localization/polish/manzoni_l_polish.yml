 manzoni_writer_masterpiece_newspaper_report_desc_loc: "[GetPlayer.MakeScope.Var('manzoni_writer_var').GetCharacter.GetFullName] napisał znakomity artykuł do gazety, który przykuł uwagę wszystkich czytelników. Dzięki temu artykułowi cały nakład wyprzedano w niespełna godzinę."
 manzoni_writer_good_newspaper_report_desc_loc: "[GetPlayer.MakeScope.Var('manzoni_writer_var').GetCharacter.GetFullName] opublikował w gazecie nowy reportaż, który był dość wciągający i interesujący."
 manzoni_writer_mediocre_newspaper_report_desc_loc: "[GetPlayer.MakeScope.Var('manzoni_writer_var').GetCharacter.GetFullName] napisał nowy artykuł, który nie jest szczególnie wyjątkowy, ale też nie jest fatalny. To przyzwoity tekst dziennikarski, lecz wkrótce zostanie zapomniany."
 manzoni_writer_bad_newspaper_report_desc_loc: "Aż dziw, że jakakolwiek gazeta opublikowała artykuł autorstwa [GetPlayer.MakeScope.Var('manzoni_writer_var').GetCharacter.GetFullName], ale niektóre gazety najwyraźniej uważają się za papier toaletowy. Tak czy inaczej, artykuł jest okropny i ledwie da się go czytać."
 manzoni_rotary_press_tech: "Prasa Rotacyjna"
 manzoni_rotary_press_tech_desc: "Obracanie cylindrycznej formy drukowej i przesuwanie przez nią papieru pozwala drukować znacznie szybciej niż dotychczas."
 manzoni_linotype_tech: "Linotyp"
 manzoni_linotype_tech_desc: "Zamiast dobierać i układać czcionki litera po literze, skład przygotowuje się za pomocą klawiatury, co zmniejsza zapotrzebowanie na wykwalifikowanych pracowników i przyspiesza pracę zecerską."
