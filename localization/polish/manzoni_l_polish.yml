 manzoni_je_pro_government_newspaper: "Gazeta Prorządowa"
 manzoni_je_pro_government_newspaper_reason: "Czwarta władza istnieje po to, by kontrolować rząd. Zdarzało się jednak, że pewien rodzaj dworskiego dziennikarstwa prowadził do zbyt bliskich relacji między rządzącymi a dziennikarzami. Może to być niekorzystne dla rzetelności dziennikarskiej i wolności prasy, ale kto chciałby, by przeszkadzano mu nieprzyjemnymi wiadomościami?\n\n„Gazeta Prorządowa” uruchamia się, gdy [concept_executive] wydawnictwa należy do grupy interesu, która #G wchodzi w skład rządu#!. Zaczyna on wówczas publikować artykuły popierające rząd."
 manzoni_has_publisher_ig_in_government_tt: "Grupa interesu, do której należy [concept_executive] wydawnictwa, wchodzi w skład #G rządu#!."
