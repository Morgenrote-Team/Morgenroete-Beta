 manzoni.921.t: "Włoska kultura muzyczna"
 manzoni.921.d: "Włochy są uważane za jeden z krajów, które odegrały decydującą rolę w rozwoju kultury muzycznej — zarówno w dziedzinie budowy instrumentów, rozwoju opery, kształcenia słynnych śpiewaków, jak i działalności wielkich kompozytorów. Pod względem muzycznym, najpóźniej od czasów renesansu, półwysep wyróżniał się wyjątkową kulturą, która zachwyciła całą Europę i nadawała jej nowe impulsy. O wielkości tego dziedzictwa świadczy fakt, że aż do XIX wieku włoski był jedynym językiem opery."
 manzoni.921.f: "„Dajcie mi rachunek praczki, a nawet to ubiorę w muzykę.” — Gioachino Rossini"
 manzoni.921.g: "Włochy mają bogatą historię muzyczną."
 manzoni.921.h: "Przyszłość należy do włoskiej kultury muzycznej!"
 manzoni.922.t: "Kult Dantego"
 manzoni.922.d: "Dante Alighieri jest uważany za najważniejszy symbol kultury włoskiej, a jego „Boska komedia” za jedno z klasycznych dzieł literatury światowej i najważniejsze literackie świadectwo średniowiecza. Kult Dantego urósł wśród patriotów do rangi prawdziwego zjawiska, a zarazem jest postrzegany jako dowód dla świata, że poczucie ogólnowłoskiej wspólnoty istniało na długo przed Risorgimentem — w końcu to Dante jako pierwszy określił granice Włoch jako obszar, na którym mówi się językiem „Sì”. We Florencji ma stanąć pomnik upamiętniający „najwyższego poetę”."
 manzoni.922.f: "W połowie drogi naszego życia\nznalazłem się w ciemnym lesie,\nbo prosta droga została zagubiona. — Dante Alighieri"
 manzoni.922.g: "Wspieraj kult Dantego i zbuduj pomnik we Florencji."
 manzoni.922.h: "I dręczyć przyszłe pokolenia tercynami?"
 manzoni_italian_consiousness_2_tt: "Miejscowa ludność korsykańska, ticzyńska, maltańska i retoromańska staje się ludnością włoską. Jej ziemie ojczyste zostaną przekształcone we włoskie ziemie ojczyste."
 je_manzoni_italian_greater_national_identity: "Dziedzictwo Dantego"
 je_manzoni_italian_greater_national_identity_reason: "Gdzie przebiegają granice włoskiej tożsamości? Dla Dantego odpowiedź była jasna: tam, gdzie granice języka! Również wielu patriotów żyjących z dala od kolebki włoskiej kultury nie miało wątpliwości ani co do prawdziwych granic, ani co do prawdziwego języka. Odstępcze ludy Alp ze swoją nieokrzesaną łaciną oraz Korsykanie pod francuskim jarzmem, posługujący się mową toskańską, także muszą stać się częścią narodu — nie tylko politycznie, lecz również duchowo. Malta stanowi wyjątek — lecz zagubiony lud włoski wkrótce na nowo nauczy się swojego języka, niczym dziecko zbyt długo oddzielone od matki."
 manzoni.924.t: "Lingua del Sì"
 manzoni.924.d: "Ponad 500 lat po tym, jak Dante Alighieri wyznaczył językowe granice Włoch, wspólnota językowa stała się wspólnotą narodową. Od alpejskich dolin po Maltę, od wybrzeży Sardynii i Korsyki po Istrię istnieje jedna włoska wspólnota językowa, która pielęgnuje dziedzictwo największego poety."
 manzoni.924.f: "Neapolitański? Włoski dialekt. Wenecki? Włoski dialekt. Korsykański? Włoski dialekt. Ladyński? Włoski dialekt. Retoromański? Włoski dialekt. Maltański? Coś w rodzaju włoskiego dialektu z semickim słownictwem."
 manzoni.924.g: "Włochy są teraz zjednoczone również językowo!"
 manzoni_italian_irredenta_decision_tt: "Podjęto decyzję #YELLOW Italia irredenta#!."
 manzoni.925.t: "Korsykanie zintegrowani"
 manzoni.925.d: "Język i kultura Korsykanów zostały w pełni włączone do języka i kultury włoskiej. Odizolowana włoska kultura powróciła do domu."
 manzoni.926.t: "Tessyńczycy zintegrowani"
 manzoni.926.d: "Język i kultura Tessyńczyków zostały w pełni włączone do języka i kultury włoskiej. Odizolowana włoska kultura powróciła do domu."
 manzoni.927.t: "Maltańczycy zintegrowani"
 manzoni.927.d: "Język i kultura Maltańczyków zostały w pełni włączone do języka i kultury włoskiej. Odizolowana włoska kultura powróciła do domu."
 manzoni.928.t: "Retoromanie zintegrowani"
 manzoni.928.d: "Język i kultura Retoromanów zostały w pełni włączone do języka i kultury włoskiej. Odizolowana włoska kultura powróciła do domu."
 manzoni.925.f: "„Jedni bowiem na potwierdzenie mówią Oc, inni Oil, jeszcze inni Si, mianowicie Hiszpanie, Francuzi i Latynowie. O tym zaś, że języki tych trzech ludów wywodzą się z jednej i tej samej mowy, świadczy fakt, iż wiele rzeczy nazywają tymi samymi słowami, na przykład Deum, Caelum, Amorem, Mare, Terram, a także Vivit, Moritur, Amat i niemal wszystko inne. Spośród nich ci, którzy mówią Oc, zajmują zachodnią część południowej Europy, począwszy od granic ziem Genueńczyków. Ci zaś, którzy mówią Si, zajmują część na wschód od wspomnianych granic, aż po ów przylądek Italii, gdzie zaczyna się zatoka Morza Adriatyckiego, i aż po Sycylię”. — Dante Alighieri"
 manzoni.925.g: "Witajcie, bracia!"
 je_manzoni_italian_greater_national_identity_tt: "Wszystkie korsykańskie, tessyńskie, maltańskie i retoromańskie Ziemie Ojczyste zostały przekształcone we włoskie Ziemie Ojczyste."
