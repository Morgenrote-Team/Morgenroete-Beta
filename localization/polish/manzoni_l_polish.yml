l_polish:
 manzoni.1000.t: "„Studium w szkarłacie” Arthura Conana Doyle’a"
 manzoni.1000.d: "Detektyw rozwiązujący zagadki kryminalne dzięki logice i własnemu intelektowi. Ten Sherlock Holmes to fascynująca postać. Arthur Conan Doyle wpadł na naprawdę interesujący pomysł."
 manzoni.1000.f: "„Łatwiej było to wiedzieć, niż wyjaśnić, skąd się to wie. Gdyby poproszono cię o udowodnienie, że dwa razy dwa równa się cztery, mógłbyś napotkać pewne trudności, a przecież jesteś tego całkowicie pewien”.\n– Arthur Conan Doyle, Studium w szkarłacie"
 manzoni.1000.a: "Elementarne, mój drogi Watsonie."
 manzoni.1100.g: "Chciałbym móc zamieszkać na alpejskiej hali!"
 manzoni.1101.g: "Czy oceniam ludzi po wyglądzie, czy po osobowości?"
 manzoni.1102.g: "Może odnalazłbym spełnienie, gdybym również słuchał autorytetów?"
 manzoni.1103.g: "Czy mój wewnętrzny wilk również wyje?"
 manzoni.1104.g: "Czy mogę przeczytać więcej komiksów?"
 manzoni.1200.t: "„Narzeczeni” Alessandra Manzoniego"
 manzoni.1200.d: "„I promessi sposi” (Narzeczeni) to włoska powieść historyczna Alessandra Manzoniego, opublikowana po raz pierwszy w 1827 roku w trzech tomach. Była to pierwsza włoska powieść historyczna, która stała się wzorem dla późniejszej włoskiej prozy literackiej oraz jednym z fundamentów współczesnego języka włoskiego. Na początku XIX wieku wciąż trwały spory dotyczące tego, jaką formę powinien przyjąć standardowy język literacki Włoch. Manzoni, pochodzący z Mediolanu, zdecydowanie opowiadał się za dialektem florenckim i po „wypraniu swojego słownictwa w wodach Arno” (jak sam to określił) zrewidował język powieści na potrzeby jej ponownego wydania w 1842 roku."
 manzoni.1200.f: "Akcja powieści rozgrywa się w północnych Włoszech w 1628 roku i opowiada historię dwojga młodych ludzi, Renza i Lucii, którzy mieszkają w wiosce nad jeziorem Como i pragną się pobrać. Na przeszkodzie staje im jednak miejscowy pan feudalny, który upatrzył sobie Lucię i zaczyna ich prześladować, zmuszając do ucieczki z rodzinnej wioski. Wiele wyrażeń, cytatów i imion z powieści jest do dziś powszechnie używanych w języku włoskim, takich jak Perpetua (określenie gospodyni księdza) czy „Questo matrimonio non s'ha da fare” („Do tego ślubu nie może dojść”, używane ironicznie). Sama powieść nadal uznawana jest za prawdziwe arcydzieło literatury światowej. Ponieważ jej akcja rozgrywa się w okresie panowania hiszpańskiego, „I promessi sposi” często interpretowano jako ukrytą krytykę austriackich rządów w XIX-wiecznych Włoszech."
 manzoni.1200.g: "Kogo obchodzi jakaś głupia włoska powieść?"
 manzoni.1200.h: "Szczyt włoskiej kultury!"
 manzoni.1202.t: "„Janowiec” Giacoma Leopardiego"
 manzoni.1202.d: "Giacomo Leopardi stworzył niezwykły i ceniony dorobek poetycki, związany z epoką romantyzmu. Wraz z Alessandrem Manzonim wywarł ogromny wpływ na język włoski i stał się jedną z czołowych postaci włoskich ruchów patriotycznych, choć sam odnosił się z pewną rezerwą do nacjonalizmu i wiary w postęp. Często pisał o poezji jako takiej oraz o własnej koncepcji poezji, jej języka i zakresu. Leopardi zmarł w 1837 roku, mając zaledwie 38 lat."
 manzoni.1202.f: "„La Ginestra” (Żarnowiec) to przedostatni utwór liryczny Giacoma Leopardiego. Rozpoczyna się opisem zboczy Wezuwiusza, wulkanu, którego erupcja w 79 roku n.e. przyniosła zniszczenie i śmierć tam, gdzie niegdyś wznosiły się wille, rozciągały ogrody i kwitły wielkie, bogate miasta. Następnie poeta zwraca się do żarnowca, który staje się głównym adresatem jego poetyckich rozważań. Oddając się wspomnieniom, Leopardi opowiada kwiatowi, że widział go już wcześniej na opustoszałych terenach. Żarnowiec staje się zatem symbolem piękna i wytrwałości w obliczu zniszczenia. Jednak nawet on będzie musiał kiedyś ugiąć się przed nieuchronnym losem, przez co utwór podkreśla przemijanie ludzkiego istnienia w zestawieniu z potęgą sił natury. Leopardi wyśmiewa przy tym przekonanie, że człowiek może zapanować nad przyrodą, a także stawianie bogactwa materialnego i władzy ponad wyższymi ideałami."
 manzoni.1202.g: "Jakie to melancholijne."
 manzoni.1203.t: "„Nowe Rymy” Giosuè Carducciego"
 manzoni.1203.d: "Giosuè Carducci był uznawany za oficjalnego poetę narodowego nowoczesnych Włoch i aktywnie uczestniczył w życiu kulturalnym oraz politycznym kraju. Był popularnym wykładowcą i bezkompromisowym krytykiem literatury oraz społeczeństwa. Jego zbiory „Rime Nuove” (Nowe rymy) i „Odi Barbare” (Ody barbarzyńskie) zawierają jego najwybitniejsze utwory. Przetłumaczył również na język włoski niektóre dzieła Goethego i Heinego. Na rok przed śmiercią Carducci został pierwszym Włochem uhonorowanym Literacką Nagrodą Nobla."
 manzoni.1203.f: "W zbiorze „Rime Nuove”, poprzedzonym Intermezzem, pobrzmiewają echa twórczości Hugo, von Platena, Goethego, Heinego, Baudelaire’a i Poego oraz charakterystyczne dla nich motywy. Treść i forma zawartych w nim utworów w dużej mierze wywodzą się z wcześniejszej twórczości Carducciego, lecz cechują się większą głębią i dojrzałością. Wśród tematów podejmowanych w „Rime Nuove” ważne miejsce zajmują kult przeszłości i pamięć historyczna. Marzenie o stworzeniu egalitarnego i liberalnego społeczeństwa wyraża się przede wszystkim w gloryfikacji epoki średniowiecznych komun miejskich, przedstawianych jako wzór zdrowia moralnego i życia obywatelskiego. Innym przykładem rozwoju idei demokratycznych, do którego odwołuje się Carducci, jest rewolucja francuska, przywołana w dwunastu sonetach cyklu „Ça ira”."
 manzoni.1203.g: "Ale czy można ufać człowiekowi, który pisze hymn satanistyczny?"
 manzoni.1204.t: "„Myricae” Giovanniego Pascolego"
 manzoni.1204.d: "Giovanni Pascoli studiował na Uniwersytecie Bolońskim, gdzie jego nauczycielem i mentorem był Giosuè Carducci. Nawet w epoce pozytywizmu i rozwoju nauki Pascoli wierzył, że życie pozostaje tajemnicą. Uważał, że jedynie symboliczne skojarzenia odnajdywane w niepozornych elementach przyrody pozwalają dostrzec prawdę kryjącą się za pozorami. Jego późniejsze wiersze podejmowały podobne tematy, lecz miały bardziej eksperymentalny charakter i odzwierciedlały jego znajomość kultury antycznej. Wywarły ogromny wpływ na późniejszych poetów włoskich, którzy włączali jego melancholijne motywy do własnej twórczości. Pascoli pisał zarówno po włosku, jak i po łacinie."
 manzoni.1204.f: "„Myricae” to zbiór wierszy Giovanniego Pascolego. Tytuł zbioru pochodzi z fragmentu drugiego wersu IV eklogi „Bukolik” Wergiliusza. „Myricae” obejmuje niemal cały okres twórczości poetyckiej autora, dlatego można powiedzieć, że historia powstawania zbioru pokrywa się z rozwojem świadomości poetyckiej samego Pascolego. Poezja zawarta w „Myricae” przedstawia symboliczną wizję świata, opartą na intuicji i odkrywaniu analogii oraz tajemniczych powiązań między rzeczami, a także poczuciu życia pełnego niepewności i zagubienia. Tajemnica życia, lęk, śmierć i melancholia to motywy często powracające w poezji Pascolego, w której pojawia się również motyw gniazda jako metafory domu."
 manzoni.1204.g: "Mały wielki poeta."
 manzoni.1205.g: "Czy autor naśmiewa się z Zygmunta Freuda?"
 manzoni.1206.t: "„Il Piacere” Gabriela D’Annunzia"
 manzoni.1206.d: "Gabriele D’Annunzio zajmował znaczące miejsce we włoskiej literaturze i życiu politycznym. Nazywano go Il Vate (Wieszczem) oraz Il Profeta (Prorokiem). W swojej twórczości literackiej D’Annunzio był związany z dekadentyzmem, który pozostawał w ścisłym związku z francuskim symbolizmem i brytyjskim estetyzmem. U szczytu sławy ceniono go za oryginalność, siłę wyrazu i dekadencki charakter jego pisarstwa. Jego twórczość wywarła ogromny wpływ na literaturę europejską oraz kolejne pokolenia włoskich pisarzy."
 manzoni.1206.f: "„Il Piacere” było pierwszą powieścią D’Annunzia. Podobnie jak sto lat wcześniej „Ostatnie listy Jacopa Ortisa” Uga Foscola rozpowszechniły we Włoszech idee romantyzmu i romantyczną wrażliwość, tak „Il Piacere” i jego główny bohater, Andrea Sperelli, wprowadzili do włoskiej kultury końca XIX wieku tendencje dekadenckie i estetyzm. D’Annunzio zapoczątkował nowy rodzaj prozy psychologicznej i introspektywnej, któremu pisany był wielki sukces i który pozwolił mu zgłębiać błędy życiowe oraz przeciwności losu „ostatniego potomka rodu intelektualistów”."
 manzoni.1206.g: "Czy to jeszcze symbolizm, czy już dekadentyzm?"
 manzoni.1207.g: "Ta bajka dla dzieci z pewnością odniosłaby większy sukces jako film."
 manzoni.1208.g: "Powieść patriotyczna dla młodych Włochów!"
 manzoni_great_writer: "Wielki Pisarz"
 manzoni_great_writer_desc: "Ta postać jest jednym z najwybitniejszych pisarzy swoich czasów, znanym na całym świecie ze swojej twórczości literackiej."
