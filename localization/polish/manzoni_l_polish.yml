 je_manzoni_literary_circle: "Krąg Literacki"
 je_manzoni_literary_circle_reason: "Gdyby nasze życie literackie rozkwitło, czego wyrazem byłyby nie tylko salon literacki i liczni pisarze, lecz także powszechna atmosfera fin de siècle, powstanie towarzystwa literackiego byłoby jedynie kwestią czasu."
