 manzoni_writer_poem_bestseller_title_15_loc: "Tam, Gdzie Szepczą Polne Kwiaty"
 manzoni.2600.t: "„Lew Flandrii, czyli bitwa pod Złotymi Ostrogami”"
 manzoni.2600.d: "„Lew Flandrii, czyli bitwa pod Złotymi Ostrogami” autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] to powieść historyczna skupiająca się na bitwie pod Złotymi Ostrogami, w której flamandzka milicja pokonała najeźdźcze wojska francuskie. Książka jest uznawana za flamandzką epopeję narodową."
 manzoni.2600.f: "„Ty, Flamandzie, który przeczytałeś tę książkę, rozważ, wspominając opisane w niej chwalebne czyny, czym niegdyś była Flandria, czym jest dzisiaj, a przede wszystkim, czym się stanie, jeśli zapomnisz o świętych przykładach swoich przodków!”\n— Hendrik Conscience, „Lew Flandrii, czyli bitwa pod Złotymi Ostrogami”"
 manzoni.2600.g: "Za Flandrię!"
 manzoni.1601.t: "\"Röda rummet\""
 manzoni.1601.d: "„Czerwony pokój” to powieść autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName], stanowiąca krytykę szwedzkiego społeczeństwa. Idealistyczny urzędnik Arvid Falk zostaje w niej pisarzem i popada w konflikt ze swoim konserwatywnym bratem, Carlem Nikolausem Falkiem. Sztokholmskie społeczeństwo zostało przedstawione w satyrycznym świetle."
 manzoni.1601.f: "„...gdy tylko dzieło sztuki zaczyna służyć praktycznym celom, zdradza określony zamiar lub tendencję, jego piękno znika.”\n— August Strindberg, „Czerwony pokój”"
 manzoni.1601.g: "Społeczeństwo musi się zmienić!"
 manzoni.1602.t: "\"Det går an\""
 manzoni.1602.d: "„Det går an”, czyli „Tak też można”, to powieść autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName], stanowiąca krytykę instytucji małżeństwa zawieranego na całe życie oraz niemożności osiągnięcia przez kobiety niezależności finansowej. W powieści sierżant Albert zakochuje się w Sarze Videbeck, córce szklarza, podczas podróży parowcem ze Sztokholmu do Lidköping. Sara odwzajemnia jego uczucia, lecz przedstawia wizję związku opartego na równouprawnieniu, bez formalnej ceremonii ślubnej i wspólnoty majątkowej. Powieść kończy się jej pytaniem: „Czy to wszystko ci odpowiada, Albercie?” („Går allt detta an, Albert?”), na które Albert odpowiada: „Tak, odpowiada mi” („Det går an”)."
 manzoni.1602.f: "„...kto chce ciąć szkło, mój panie, musi mieć diament!”\n— Carl Jonas Love Almqvist, „Tak też można”"
 manzoni.1602.g: "Tak też można!"
 manzoni.1603.t: "„Pieniądze”"
 manzoni.1603.d: "„Pieniądze” to powieść autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName], stanowiąca krytykę ówczesnego prawa małżeńskiego. Książka przedstawia losy Selmy od szesnastego do dwudziestego trzeciego roku życia. W tym czasie dziewczyna przeobraża się z pełnej życia nastolatki o artystycznych marzeniach w zahartowaną przez doświadczenia kobietę, której jedynym celem staje się wolność. W wieku szesnastu lat Selma wychodzi za znacznie starszego Påla Kristerssona, zamożnego mężczyznę, który dorobił się fortuny ciężką pracą, głównie dlatego, że jest przekonana, iż pod względem finansowym stanowi on dobrą partię. Nigdy jednak nie darzy go miłością i zdaje się stopniowo zapominać, czym w ogóle jest to uczucie. Jej mąż zostaje opisany jako „ogolona świnia”. Z biegiem lat małżeństwa Selma zaczyna dostrzegać wszystkie niedoskonałości ich związku, a także szersze problemy społeczne dotyczące pozycji kobiet, braku ich niezależności prawnej oraz przysługujących im praw."
 manzoni.1603.f: "„...oszukując samą siebie, stworzyła zniekształcony obraz rzeczywistości, który łudząco przypominał szczęście.”\n— Victoria Benedictsson, „Pieniądze”"
 manzoni.1603.g: "Wolność dla Selmy!"
 manzoni.1604.t: "„Hertha”"
 manzoni.1604.d: "„Hertha” to powieść autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName], opowiadająca się za niezależnością prawną kobiet i ich dostępem do edukacji. Główna bohaterka powieści, młoda i nieustępliwa Hertha, mieszka w domu zdominowanym przez despotycznego ojca. Żyją w patriarchalnym miasteczku o nazwie Kungsköping, będącym miniaturowym odbiciem Szwecji. Pewnej nocy wybucha pożar, który zagraża zniszczeniem całego miasta. Pożar staje się wydarzeniem, które obnaża prawdziwe oblicza mieszkańców i ukazuje zaściankowość szwedzkiego społeczeństwa. Podczas akcji ratunkowej jednak po raz pierwszy kobiety i mężczyźni, bogaci i biedni, pracują ramię w ramię. Stare spłonęło i na jego miejscu można zbudować coś nowego. Hertha staje się siłą napędową tych przemian, a w nowej rzeczywistości miasta po pożarze kobietom obiecuje się centralną rolę."
 manzoni.1604.f: "„Z pewnością chciałabym wyjść za mąż jeszcze dziś wieczorem, gdybym tylko jutro mogła już być wdową!”\n— Fredrika Bremer, „Hertha”"
 manzoni.1604.g: "Spalić to wszystko!"
 manzoni.1605.t: "„Rozpryski i odpryski”"
 manzoni.1605.d: "„Rozpryski i odpryski” to zbiór wierszy autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName]. Zawarty w nim erotyczny poemat miłosny „En morgondröm”, czyli „Poranny sen”, jest utworem wielowarstwowym. W swej istocie stanowi krytykę ówczesnych poglądów na moralność, nagość i seksualność, zwłaszcza tych wyznawanych przez Kościół."
 manzoni.1605.f: "„Leżała naga, nie kryjąc swego piękna, a z rozchylonymi kolanami i drżącym ciałem ponownie wyszła naprzeciw pragnieniu swego ukochanego.”\n— Gustaf Fröding, „Rozpryski i odpryski”"
 manzoni.1605.g: "Ocenzuruj to!"
 manzoni.1606.t: "„W Nowy Rok”"
 manzoni.1606.d: "„På nyårsdagen” lub „W Nowy Rok” to krótki, pełen ekspresji wiersz autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName]. Bywa określany mianem hymnu bojowego zatwardziałych indywidualistów."
 manzoni.1606.f: "„Samotny na kruchym statku żeglarz ośmiela się wypłynąć na bezkresne morze...”\n— Erik Gustaf Geijer, „W Nowy Rok”"
 manzoni.1606.g: "Naprzód! — taki jest rozkaz jego przeznaczenia."
 manzoni.1607.t: "„Dobranoc, Ziemio”"
 manzoni.1607.d: "„Godnatt, jord” lub „Dobranoc, Ziemio” to powieść zbiorowa autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName], przedstawiająca życie dzierżawców niewielkich gospodarstw w majątku ziemskim w Södermanlandii — codzienny trud, życie w ubóstwie, tłumione pragnienia i nieskomplikowaną radość. Wśród tętniącej życiem zbiorowości wyłaniają się indywidualne historie poszczególnych osób, ukazane z niezwykłą intymnością. Wszystkie otacza zapach krajobrazu Södermanlandii, pełnego bujnych dębów i rozkwitających maków."
 manzoni.1607.f: "„Mówi się, że liście babki zwyczajnej najczęściej rosną na ścieżkach, po których się depcze. To samo można powiedzieć o dzierżawcach niewielkich gospodarstw.”\n— Ivar Lo-Johansson, „Dobranoc, Ziemio”"
 manzoni.1607.g: "Dobranoc!"
 manzoni.1608.t: "„Kat”"
 manzoni.1608.d: "„Kat” to powieść autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName]. Historia rozgrywa się na dwóch płaszczyznach czasowych: w średniowieczu oraz współcześnie. Wspólnym elementem obu części jest miejsce akcji — karczma — oraz kat, który pojawia się w obu okresach. Książka kończy się przemową kata skierowaną do gości, w której wyraża on swoją ponurą wizję ludzkości."
 manzoni.1608.f: "„Przemoc jest ostatecznym wyrazem zarówno fizycznych, jak i duchowych sił ludzkości.”\n— Pär Lagerkvist, „Kat”"
 manzoni.1608.g: "Co za okropność!"
 manzoni.1609.t: "„Kwitną pokrzywy”"
 manzoni.1609.d: "„Kwitną pokrzywy” to częściowo autobiograficzna powieść autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName]. Książka opowiada historię osieroconego chłopca Martina, będącego alter ego autora. Została napisana z perspektywy dziecka. Ojciec Martina umiera, a matka opuszcza swoje dzieci, by rozpocząć nowe życie w Kalifornii. Już we wczesnym dzieciństwie chłopiec traci wszystko, co jest mu drogie. Dorasta, pracując w różnych gospodarstwach rolnych, skąd jest odsyłany lub z których sam odchodzi, doświadczając ciężkiego życia parobka. Martin zostaje przedstawiony jako samolubny, głupi, dziecinny, użalający się nad sobą, służalczy, tchórzliwy i fałszywy. Nie ma tu zatem miejsca na idealizowanie dziecka."
 manzoni.1609.f: "„Myślał zbyt wiele, ale niewiele rozumiał.”\n— Harry Martinson, „Kwitną pokrzywy”"
 manzoni.1609.g: "Biedne dziecko."
 manzoni.1610.t: "„Matka wychodzi za mąż”"
 manzoni.1610.d: "„Matka wychodzi za mąż” to częściowo autobiograficzna powieść autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName]. Książka opowiada historię siedmioletniej Mii, która aż nazbyt dobrze rozumie świat, a jednocześnie nie rozumie z niego niczego. Nie potrafi pojąć, dlaczego jej matka chce poślubić przystojnego, lecz zupełnie niezaradnego mężczyznę, który pije, wdaje się w bójki i zdradza. Jej matka ciężko pracuje na chleb i stara się uczynić życie w wynajmowanych, pełnych przeciągów pokojach znośnym. Życie tej rodziny staje się pasmem bolesnych i upokarzających przeprowadzek, podczas których Mia jest stopniowo wtłaczana w społeczeństwo klasowe. Dziewczynka marzy o spokojnym domu z niebieskimi kwiatami na pobielonej ścianie pieca, lecz przekonuje się, że świat nie ma miejsca na marzenia wszystkich ludzi, a wielu nie zapewnia nawet dachu nad głową."
 manzoni.1610.f: "„Gdy rozpacz staje się przytłaczająca i grozi człowiekowi zniszczeniem, umarli powstają z grobów, by podać mu pomocną dłoń.”\n— Moa Martinson, „Matka wychodzi za mąż”"
 manzoni.1610.g: "Doprawdy radosne małżeństwo!"
 manzoni.1611.t: "„Rodzina Raska”"
 manzoni.1611.d: "„Rodzina Raska” to powieść autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName]. Akcja rozgrywa się w drugiej połowie XIX wieku w południowo-wschodniej części Smalandii. Opowiada historię Gustava, ubogiego parobka, który zostaje żołnierzem w ramach systemu wojskowego opartego na przydzielaniu żołnierzom gospodarstw. Otrzymuje własne gospodarstwo żołnierskie oraz nazwisko Rask, po czym żeni się z Idą, służącą również żyjącą w ubóstwie. Powieść ukazuje ich zmagania i wytrwałość w prowadzeniu gospodarstwa, a zarazem stanowi barwny obraz historyczny życia w Szwecji."
 manzoni.1611.f: "„No dalej! Mogę walczyć z tobą przez osiem dni, nawet nie zdejmując kamizelki!”\n— Vilhelm Moberg, „Rodzina Raska”"
 manzoni.1611.g: "Przeklęty drapiący kot!"
 manzoni.1612.t: "„Doktor Glas”"
 manzoni.1612.d: "„Doktor Glas” to powieść epistolarna autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName], opowiadająca o lekarzu żyjącym w XIX-wiecznej Szwecji, który zmaga się z dylematami moralnymi i miłosnymi. Głównym bohaterem jest Dr. Tyko Gabriel Glas, ceniony lekarz ze Sztokholmu. Historia przedstawiona jest w formie dziennika i ukazuje zmagania Doktora Glasa z depresją. Antagonistą jest pastor Gregorius, duchowny zepsuty moralnie. Jego piękna, młoda żona zwierza się Dr. Glasowi, że jej życie seksualne jest źródłem cierpienia, i prosi go o pomoc. Glas zakochuje się w niej i postanawia jej pomóc, mimo że kobieta ma już innego kochanka. Próbuje interweniować, lecz pastor odmawia zrzeczenia się swoich „praw małżeńskich” – kobieta musi z nim współżyć, niezależnie od tego, czy ma na to ochotę. Chcąc uszczęśliwić ukochaną, Glas zaczyna więc planować morderstwo jej męża."
 manzoni.1612.f: "„Człowiek pragnie być kochany, a jeśli nie, to podziwiany; jeśli nie podziwiany, to budzić strach; a jeśli i to się nie uda, być znienawidzonym i pogardzanym.”\n— Hjalmar Söderberg, „Doktor Glas”"
 manzoni.1612.g: "Przynieś mi cyjanek potasu!"
 manzoni.1613.t: "„Singoalla”"
 manzoni.1613.d: "„Singoalla” to powieść autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName]. Akcja rozgrywa się w średniowiecznej Szwecji. Jest to romantyczna opowieść historyczna łącząca elementy przygody, tragedii i folkloru. Fabuła koncentruje się na Singoalli, pięknej i tajemniczej młodej Romce, oraz Jöranie, szlachcicu, który się w niej zakochuje. Historia rozgrywa się w czasach politycznych intryg, gdy miłość Singoalli i Jörana splata się z konfliktem między warstwami społecznymi, siłami przeznaczenia i osobistymi pragnieniami."
 manzoni.1613.f: "„Idź! Precz! Idź do tego swojego obcego!”\n— Viktor Rydberg, „Singoalla”"
 manzoni.1613.g: "Cóż za romantyzm!"
 manzoni.1614.t: "„Nowe wiersze”"
 manzoni.1614.d: "„Nowe wiersze” lub „New Poems” to zbiór poezji autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName], podejmujący tematykę historii Szwecji, przyrody i tożsamości narodowej. Zbiór ten jest często postrzegany jako wyraz przyjęcia przez poetę idei romantycznego nacjonalizmu, w ramach którego skupia się on na pięknie i sile narodu szwedzkiego oraz jego dziedzictwie. Wyraźny nacisk położono na oddawanie czci przeszłości i celebrowanie dorobku kraju, przy jednoczesnej refleksji nad przyszłością."
 manzoni.1614.f: "„Piękniej jest usłyszeć strunę, która pękła, niż nigdy nie pociągnąć smyczkiem.”\n— Verner von Heidenstam, „Nowe wiersze”"
 manzoni.1614.g: "Cóż za chlubna historia!"
 manzoni.1504.t: "„Przygody Tomka Sawyera”"
 manzoni.1504.d: "Nad brzegami rzeki Missisipi niesforny chłopiec o imieniu Tomek Sawyer i jego najlepszy przyjaciel Huck Finn przeżywają ekscytujące przygody, obejmujące różne psoty, poszukiwania skarbów, a nawet bycie świadkami morderstwa. W trakcie swoich przygód Tomek uczy się ważnych życiowych lekcji dotyczących przyjaźni, moralności i odpowiedzialności."
 manzoni.1504.f: "„Praca polega na wykonywaniu tego, co człowiek musi robić, a zabawa na wykonywaniu tego, do czego nikt nie jest zobowiązany.”\n— Samuel „Mark Twain” Clemens, „Przygody Tomka Sawyera”"
 manzoni.1504.g: "Mały urwis!"
