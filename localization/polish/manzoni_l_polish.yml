 notification_manzoni_anthology_meets_taste_notification_desc: "Nasz [concept_manzoni_writer] trafił w gusta czytelników swoim zbiorem wierszy. Zyskujemy #G 30#! [concept_manzoni_literary_tradition], a [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] zyskuje #G 50#! #V Reputacji#!."
 notification_manzoni_anthology_close_taste_notification_name: "Nowa Antologia"
 notification_manzoni_anthology_close_taste_notification_desc: "Nasz [concept_manzoni_writer] opublikował nowy zbiór wierszy, który przyciągnął uwagę krytyków. Zyskujemy #G 15#! [concept_manzoni_literary_tradition], a [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] zyskuje #G 25#! #V Reputacji#!."
 notification_manzoni_anthology_no_taste_notification_name: "Niezauważona Antologia"
 notification_manzoni_anthology_no_taste_notification_desc: "Nasz [concept_manzoni_writer] nie zdołał przekonać czytelników swoim nowym zbiorem wierszy. Zyskujemy #G 5#! [concept_manzoni_literary_tradition], a [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] zyskuje #G 10#! #V Reputacji#!."
 manzoni.1001.t: "„Hobbit, czyli tam i z powrotem”"
 manzoni.1001.d: "[SCOPE.sCharacter('manzoni_writer_scope').GetFullName] stworzył opowieść, która szybko stała się bestsellerem. Historia skupia się na przygodach hobbita i rozgrywa się w fantastycznym świecie wykreowanym przez [SCOPE.sCharacter('manzoni_writer_scope').GetLastName]. Miejmy nadzieję, że [SCOPE.sCharacter('manzoni_writer_scope').GetSheHe] napisze więcej książek o tym świecie zwanym Śródziemiem!"
 manzoni.1001.f: "„W pewnej norze pod ziemią mieszkał hobbit. Nie była to paskudna, brudna, wilgotna nora, pełna robaczych szczątków i cuchnącego błota, ani też sucha, pusta, piaszczysta dziura, w której nie było na czym usiąść ani czego zjeść. Była to nora hobbita, a to oznacza wygodę.”\n– J.R.R. Tolkien, „Hobbit, czyli tam i z powrotem”"
 manzoni.1001.g: "Jakże niezwykły świat stworzył [SCOPE.sCharacter('manzoni_writer_scope').GetSheHe]!"
 manzoni.1002.t: "„Wojna światów”"
 manzoni.1002.d: "„Wojna światów” autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] to opowieść science fiction o inwazji obcych na Ziemię. Poznaj zniszczenie i cierpienie, jakie najeźdźcy sieją za pomocą swoich trójnożnych machin wojennych. Czy ludzkość zdoła zwyciężyć, czy też zostanie unicestwiona przez Marsjan?"
 manzoni.1002.f: "„To nie jest wojna” – powiedział artylerzysta. „Nigdy nią nie była, tak samo jak nie ma wojny między człowiekiem a mrówkami.”\n– H.G. Wells, „Wojna światów”"
 manzoni.1002.g: "Czy naprawdę istnieją gdzieś tam obcy najeźdźcy?"
 manzoni.1100.t: "„Heidi”"
 manzoni.1100.d: "[SCOPE.sCharacter('manzoni_writer_scope').GetFullName] opublikował opowieść o młodej osieroconej dziewczynce, która mieszka ze swoim dziadkiem na alpejskiej hali. Książka zatytułowana „Heidis Lehr- und Wanderjahre”, czyli „Heidi: Lata nauki i wędrówek”, przedstawia rozwijającą się więź między Heidi a jej dziadkiem oraz ich szczęśliwe wspólne życie. Wkrótce jednak zostają rozdzieleni, ponieważ Heidi musi przeprowadzić się do Frankfurtu nad Menem, aby zamieszkać z Klarą Streseman, córką przedsiębiorcy. Czy kiedykolwiek jeszcze zobaczy swojego dziadka?"
 manzoni.1100.f: "„Chcę biegać tak zwinnie jak kozy.”\n– Johanna Spyri, „Heidi: Lata nauki i wędrówek”"
 manzoni.1101.t: "„Szata zdobi człowieka”"
 manzoni.1101.d: "[SCOPE.sCharacter('manzoni_writer_scope').GetFullName] nie jest nieznanym pisarzem. Opublikował już takie dzieła jak „Der grüne Heinrich” i „Die Leute von Seldwyla”. Jego najnowsze opowiadanie „Kleider machen Leute”, czyli „Szata zdobi człowieka”, jest jednym z utworów zawartych w drugiej części zbioru „Die Leute von Seldwyla”. Pewien czeladnik krawiecki, któremu pracodawca nie wypłacił należnego wynagrodzenia, zostaje po drodze zabrany przez przejeżdżający powóz. Kiedy przybywa do miasteczka Goldach, mieszkańcy biorą go za szlachcica, ponieważ przyjechał powozem, nosi eleganckie ubranie i ma starannie wypielęgnowane wąsy. Ponieważ jest dość nieśmiały, nie wyprowadza nikogo z błędu. Czy mieszkańcy odkryją jego tajemnicę?"
 manzoni.1101.f: "„Kiedy książę obejmuje w posiadanie ziemię i lud, kiedy duchowny głosi naukę swojego Kościoła bez przekonania, lecz z godnością korzysta z dochodów swojej synekury, kiedy zarozumiały nauczyciel cieszy się zaszczytami i korzyściami płynącymi ze swojego stanowiska, nie zastanawiając się ani przez chwilę nad znaczeniem własnej wiedzy i w najmniejszym stopniu jej nie rozwijając, kiedy artysta zdobywa sławę nie dzięki swoim zaletom, lecz przez niepoważne machinacje i puste sztuczki, odbierając chleb i dobre imię tym, którzy uczciwie pracują, albo kiedy oszust dziedziczy lub podstępem zdobywa nazwę wielkiego domu handlowego, a następnie pozbawia tysiące ludzi ich oszczędności, wszyscy ci ludzie nie rozpaczają nad swoim losem, lecz przeciwnie, cieszą się swoim szczęściem i nie przepuszczają ani jednego wieczoru bez wesołego towarzystwa i dobrych przyjaciół.”\n– Gottfried Keller, „Szata zdobi człowieka”"
 manzoni.1102.t: "„Uli, parobek”"
 manzoni.1102.d: "Albert Bitzius, szwajcarski pastor, opublikował pod pseudonimem [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] swoją książkę „Uli der Knecht”, czyli „Uli, parobek”. Jest to dzieło typowe dla twórczości Gotthelfa, którego bohaterem jest parobek Uli (Ulryk), zmuszony przezwyciężyć swoją niedbałość, aby odnaleźć spełnienie w życiu. Aby osiągnąć ten cel, musi brać przykład z różnych wzorców osobowych i podporządkowywać się rozmaitym autorytetom."
 manzoni.1102.f: "„Posłuchaj, Uli” – powiedział gospodarz – „tak dalej być nie może. Jesteś dla mnie zbyt niesforny, a twoje pijackie wybryki zdarzają się coraz częściej. Nie chcę powierzać koni i krów komuś, kto ma głowę zamroczoną jedzeniem lub winem. Nie mogę też pozwolić, by taki człowiek wchodził do stajni z latarnią, zwłaszcza jeśli do tego jest pijany jak ty. Zbyt wiele domostw poszło już z dymem z tego powodu. Nie wiem, co sobie myślisz i do czego zmierzasz”. Uli odparł, że jeszcze o niczym nie myślał, że zawsze wykonywał swoją pracę i nikt nie musiał go w niej wyręczać, a także że nikt nie płacił za to, co wypijał. To, co pił, było wyłącznie jego sprawą, ponieważ pił za własne pieniądze. „Ale jesteś moim parobkiem” – odpowiedział gospodarz.\n– Jeremias Gotthelf, „Uli, parobek”"
 manzoni.1103.t: "„Wilk stepowy”"
 manzoni.1103.d: "[SCOPE.sCharacter('manzoni_writer_scope').GetFullName] opublikował swoją najnowszą książkę „Der Steppenwolf”, czyli „Wilk stepowy”, którą napisał podczas pobytu w Bazylei. Hesse jest już znany z innych dzieł, takich jak „Siddhartha”. Bohaterem jego najnowszej powieści jest Harry Haller, mężczyzna w średnim wieku, niezadowolony z mieszczańskiego społeczeństwa. Rozważa nawet popełnienie samobójstwa, jednak spotkanie z młodą Herminą i jej znajomymi odmienia jego życie. Hermina nie uchodziłaby za najlepszy wzór do naśladowania, ponieważ od czasu do czasu trudni się prostytucją, ale pomaga Harry'emu odkrywać nieznane mu dotąd doświadczenia i uwolnić drzemiącego w nim „wilka stepowego”."
 manzoni.1103.f: "„Bo tym, czego zawsze najbardziej nienawidziłem, czym gardziłem i co przeklinałem, było to samozadowolenie, to zdrowie i wygoda, ten starannie pielęgnowany optymizm mieszczaństwa, ta tłusta i dostatnio żyjąca zgraja przeciętniaków.”\n– Hermann Hesse, „Wilk stepowy”"
 manzoni.1104.t: "„Historia Alberta”"
 manzoni.1104.d: "[SCOPE.sCharacter('manzoni_writer_scope').GetFullName] opublikował swój najnowszy komiks „Histoire d'Albert”, czyli „Historia Alberta”. Nie jest to tradycyjna książka, lecz dzieło składające się z kolejnych ilustracji opatrzonych krótkimi tekstami umieszczonymi pod nimi. Opowieść stanowi karykaturalny obraz młodego człowieka, który próbuje odnaleźć własną drogę życiową, lecz ostatecznie staje się radykałem w burzliwych czasach niepokojów politycznych w Genewie."
 manzoni.1104.f: "„Niech nieczysta krew\nNapoi nasze bruzdy!\nNapoi nasze bruzdy!”\n– Rodolphe Töpffer, „Historia Alberta”"
 manzoni.1105.t: "„Wielki strach w górach”"
 manzoni.1105.d: "[SCOPE.sCharacter('manzoni_writer_scope').GetFullName] stworzył arcydzieło literackie, którego akcja rozgrywa się w Alpach Szwajcarskich. W swoim utworze [SCOPE.sCharacter('manzoni_writer_scope').GetSheHe] zgłębia wpływ strachu na człowieka. Niektórzy krytycy twierdzą, że książka „La Grande Peur dans la montagne”, czyli „Wielki strach w górach”, odzwierciedla niepewność panującą w [GetPlayer.GetNameNoFormatting]."
 manzoni.1105.f: "„Słońce zniknęło. Pozostał tylko ten ogromny cień, który zawisł nad nami. Potem zobaczyliśmy, jak pędzi za nami, z wielką szybkością wspinając się po zboczach, najpierw porośniętych trawą, a następnie po pierwszych skałach. Wszystko zmieniało swój wygląd, zmieniały się barwy wszystkiego wokół, a nawet klimat.”\n– C.F. Ramuz, „Wielki strach w górach”"
 manzoni.1105.g: "Jak wpływa na nas strach?"
 manzoni.1400.t: "„W osiemdziesiąt dni dookoła świata”"
 manzoni.1400.d: "„Le Tour du monde en quatre-vingts jours”, czyli „W osiemdziesiąt dni dookoła świata”, to znakomita powieść autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName]. Jej bohaterowie, Phileas Fogg i jego kamerdyner Passepartout, muszą okrążyć świat w ciągu 80 dni lub krócej, aby wygrać zakład. Wyruszają w niezwykłą podróż pełną przygód, podczas której odwiedzają wiele krajów."
 manzoni.1400.f: "„Wszystko, co jeden człowiek potrafi sobie wyobrazić, inni mogą urzeczywistnić.”\n– Juliusz Verne, „W osiemdziesiąt dni dookoła świata”"
 manzoni.1400.g: "Ciekawe, czy pewnego dnia uda nam się okrążyć świat w jeden dzień?"
 manzoni.1401.t: "„Komedia ludzka”"
 manzoni.1401.d: "„La Comédie humaine”, czyli „Komedia ludzka”, to wielotomowy zbiór powiązanych ze sobą opowieści autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName]. Poprzez te historie [SCOPE.sCharacter('manzoni_writer_scope').GetLastNameNoFormatting] stara się przybliżyć nam codzienne życie mieszkańców Francji."
 manzoni.1401.f: "„Człowiek nie może przez cały czas czynić zła i nawet wśród piratów muszą zdarzać się na ich złowrogim statku chwile tak przyjemne, że można się poczuć, jakby płynęło się na pokładzie luksusowego jachtu.”\n– Honoré de Balzac, „Komedia ludzka”"
 manzoni.1401.g: "A więc jak żyją zwykli ludzie we Francji?"
 manzoni.1402.t: "„Trzej muszkieterowie”"
 manzoni.1402.d: "Powieść „Les Trois Mousquetaires”, czyli „Trzej muszkieterowie”, opowiada o przygodach trzech muszkieterów: Atosa, Portosa i Aramisa, a także d'Artagnana, rozgrywających się za panowania Ludwika XIII. Książka autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] zdobyła znaczną popularność już w ciągu kilku dni od publikacji."
 manzoni.1402.f: "„Łotr nie śmieje się tak samo jak człowiek uczciwy; obłudnik nie roni takich samych łez jak człowiek szczery. Każdy fałsz jest maską, a choćby była ona najdoskonalej wykonana, przy odrobinie uwagi zawsze zdołamy odróżnić ją od prawdziwej twarzy.”\n– Aleksander Dumas, „Trzej muszkieterowie”"
 manzoni.1402.g: "Jeden za wszystkich, wszyscy za jednego!"
 manzoni.1500.t: "„Kruk”"
 manzoni.1500.d: "„Kruk” to poemat narracyjny autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName]. Opowiada o mężczyźnie pogrążonym w żałobie po zmarłej ukochanej Lenorze, którego odwiedza kruk. Mężczyzna próbuje rozmawiać z ptakiem, lecz ten odpowiada jedynie: „Nigdy więcej”."
 manzoni.1500.f: "Pewnej ponurej północy, gdy rozmyślałem, słaby i znużony,\nNad niejednym dziwnym, osobliwym tomem zapomnianej wiedzy —\nGdy głowa mi opadała i niemal zapadałem w drzemkę, nagle rozległo się pukanie,\nJakby ktoś cicho stukał, stukał do drzwi mojej komnaty.\n„To jakiś gość” – mruknąłem – „puka do drzwi mojej komnaty —\nTylko tyle i nic więcej”.\n– Edgar Allan Poe, „Kruk”"
 manzoni.1500.g: "Mroczny cień zawisł nad tym człowiekiem..."
 manzoni.1600.t: "„Cudowna podróż Nilsa Holgerssona przez Szwecję”"
 manzoni.1600.d: "„Nils Holgerssons underbara resa genom Sverige”, czyli „Cudowna podróż Nilsa Holgerssona przez Szwecję”, to książka dla dzieci autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName]. W opowieści Nils Holgersson zostaje przemieniony w tomte, czyli krasnoludka, i nagle zyskuje zdolność rozmawiania ze zwierzętami. Wkrótce potem wraz z domowym gąsiorem Marcinem dołącza do stada dzikich gęsi i wyrusza w podróż przez całą Szwecję. Podczas tej wyprawy Nils zmienia się na lepsze."
 manzoni.1600.f: "„Niewiele było pożytku z tego chłopca. Największą przyjemność sprawiało mu jedzenie i spanie, a zaraz potem najbardziej lubił psocić.”\n– Selma Lagerlöf, „Cudowna podróż Nilsa Holgerssona przez Szwecję”"
 manzoni.1600.g: "To brzmi jak niesamowita podróż!"
 manzoni.1700.t: "„Przemiana”"
 manzoni.1700.d: "Wyobraź sobie, że nagle przemieniasz się w ogromnego robaka. „Die Verwandlung”, czyli „Przemiana”, autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] przedstawia właśnie taki scenariusz. Gdy Gregor Samsa, jedyny żywiciel swojej rodziny, pewnego dnia zamienia się w karalucha i nie może już zarabiać pieniędzy, okazuje się, jak niewiele tak naprawdę znaczy dla swoich bliskich."
 manzoni.1700.f: "„Co za los: być skazanym na pracę w firmie, w której najmniejsze zaniedbanie natychmiast budziło najcięższe podejrzenia! Czy wszyscy pracownicy byli jedynie bandą łajdaków? Czy nie było wśród nich ani jednego uczciwego, oddanego człowieka, którego sumienie dręczyłoby tak bardzo, gdyby zmarnował choćby godzinę czy dwie porannego czasu pracy, że niemal postradałby zmysły i naprawdę nie byłby w stanie podnieść się z łóżka?”\n– Franz Kafka, „Przemiana”"
 manzoni.1700.g: "Fuj! Robal!"
 manzoni.1701.t: "„Człowiek bez właściwości”"
 manzoni.1701.d: "„Der Mann ohne Eigenschaften”, czyli „Człowiek bez właściwości”, autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] to wielka powieść idei, której akcja rozgrywa się w Wiedniu w przededniu I wojny światowej. Opowiada historię Ulricha, byłego żołnierza i naukowca, uwodziciela i sceptyka, który zostaje wciągnięty w szeroko zakrojone przygotowania do obchodów 70. jubileuszu panowania cesarza Franciszka Józefa."
 manzoni.1701.f: "„Sekret dobrego bibliotekarza polega na tym, że z powierzonej mu literatury nigdy nie czyta niczego poza tytułem i spisem treści. Każdy, kto da się ponieść i zacznie czytać książkę, jest stracony jako bibliotekarz... Nieuchronnie traci szerszą perspektywę.”\n– Robert Musil, „Człowiek bez właściwości”"
 manzoni.1701.g: "Człowiek bez właściwości?"
 manzoni.1702.t: "„Gwiazdy ludzkości”"
 manzoni.1702.d: "„Sternstunde der Menschheit”, czyli „Gwiazdy ludzkości”, autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] to zbiór 14 miniatur historycznych. W opowieściach tych Zweig przedstawia serię przełomowych chwil, które zmieniły bieg historii, tak zwanych „minut dziejowych”, w których bohaterskie postacie wypełniały swoje przeznaczenie, kształtując tym samym losy świata na kolejne pokolenia."
 manzoni.1702.f: "„W tej chwili Balboa rozkazuje załodze się zatrzymać. Nikt nie powinien za nim podążać, ponieważ nie chce z nikim dzielić tej pierwszej chwili, w której ujrzy nieznany ocean. Pragnie samotnie, jako jedyny, zostać pierwszym Hiszpanem, pierwszym Europejczykiem, pierwszym chrześcijaninem, który po przepłynięciu jedynego dotąd znanego wielkiego oceanu naszego świata, Atlantyku, dostrzegł również drugi, wciąż nieznany Pacyfik. I Vasco Núñez de Balboa patrzy, patrzy i patrzy, z dumą i błogością rozkoszując się świadomością, że jego oczy są pierwszymi oczami Europejczyka, w których odbija się bezkresny błękit tego morza.”\n– Stefan Zweig, „Gwiazdy ludzkości”"
 manzoni.1702.g: "Prawdziwie przełomowe chwile!"
 manzoni.1800.t: "„Mała syrenka”"
 manzoni.1800.d: "Syrenka, którą przyciąga świat na lądzie – o tym właśnie opowiada baśń „Den lille Havfrue”, czyli „Mała syrenka”, autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName]. Najmłodsza córka Króla Mórz ratuje księcia przed śmiercią i zakochuje się w nim. Oddaje swój syreni ogon w zamian za ludzkie nogi, mając nadzieję, że książę odwzajemni jej uczucie. Czy jej historia zakończy się szczęśliwie?"
 manzoni.1800.f: "„Wiem, czego pragniesz. To bardzo niemądre z twojej strony, ale niech będzie po twojemu. Sprowadzi to na ciebie nieszczęście, moja śliczna księżniczko.”\n– Hans Christian Andersen, „Mała syrenka”"
 manzoni.1800.g: "Zaraz, ona nie ma na imię Ariel?!"
 manzoni.1900.t: "„Drakula”"
 manzoni.1900.d: "Historia „Drakuli” autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] opowiedziana jest z wielu różnych perspektyw, między innymi poprzez zapiski kapitana, artykuły prasowe i fragmenty pamiętników. Wampir Drakula żeruje na swoich ofiarach, lecz wkrótce sam staje się celem grupy łowców wampirów. Czy łowcy zdołają przetrwać, czy też Drakula nadal będzie terroryzował ludzkość?"
 manzoni.1900.f: "„Czy nie sądzisz, że istnieją rzeczy, których nie potrafisz zrozumieć, a które mimo to istnieją? Że niektórzy ludzie dostrzegają rzeczy niewidoczne dla innych? Istnieją jednak rzeczy stare i nowe, których ludzkie oczy nie powinny oglądać, ponieważ ludzie wiedzą – a przynajmniej sądzą, że wiedzą – pewne rzeczy, o których opowiedzieli im inni. Ach, to wina naszej nauki, że pragnie wszystko wyjaśnić, a jeśli czegoś wyjaśnić nie potrafi, twierdzi, że nie ma niczego do wyjaśnienia.”\n– Bram Stoker, „Drakula”"
 manzoni.1900.g: "Muszę teraz kupić trochę czosnku..."
 manzoni.2000.t: "„Max Havelaar”"
 manzoni.2000.d: "„Max Havelaar” to rozrachunek [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] z holenderskim systemem kolonialnym w Indonezji. W powieści tej były urzędnik kolonialny przedstawia historię obnażającą niekompetencję i korupcję panujące w administracji kolonialnej. Jednocześnie uprzedza krytykę ze strony mieszczańskiego establishmentu, przedstawiając go w karykaturalnym świetle."
 manzoni.2000.f: "„Sumienie wszystkich narodów woła o sprzeciw wobec tej okrutnej tyranii sprawowanej przez kupieckich książąt Europy.”\n– Eduard Douwes „Multatuli” Dekker, „Max Havelaar”"
 manzoni.2000.g: "To brzmi okropnie! Musimy coś zrobić!"
