 manzoni_je_freedom_of_the_press: "Wolność Prasy"
 manzoni_je_freedom_of_the_press_reason: "Kierowani niepohamowaną wolą głoszenia prawdy — lub po prostu faktem, że ich własna partia polityczna nie sprawuje władzy — wydawcy niejednokrotnie występowali przeciwko państwu. W takich czasach wolność prasy jest ważniejsza niż kiedykolwiek.\n\n„Wolność Prasy” uruchamia się, gdy [concept_executive] wydawnictwa należy do grupy interesu, która #R nie wchodzi w skład rządu#!. Zaczyna on wówczas prowadzić działalność opozycyjną."
 manzoni_has_publisher_ig_in_opposition_tt: "Grupa interesu, do której należy [concept_executive] wydawnictwa, znajduje się w #R opozycji#!."
