 manzoni.1300.t: "„Niemcy. Baśń zimowa” Heinricha Heinego"
 manzoni.1300.d: "Heinrich Heine, jeden z najwybitniejszych poetów niemieckojęzycznych, napisał satyryczny poemat epicki wymierzony w sytuację polityczną w Niemczech. Podczas gdy liberałowie entuzjastycznie przyjmują dzieło, niektórzy politycy domagają się jego zakazania."
 manzoni.1300.f: "W 1843 roku niemiecki poeta Heinrich Heine, który w 1831 roku opuścił Niemcy i wyjechał do Francji, powrócił na kilka tygodni do ojczyzny, odwiedzając swoją matkę oraz wydawcę Juliusa Campego w Hamburgu. Heine nie był typowym przedstawicielem romantyzmu, lecz raczej poetą satyrycznym, który krytykował reakcyjną politykę i cenzurę autorytarnych państw niemieckich, a także nacjonalizm i szowinizm swoich rodaków. Podczas podróży powrotnej do Paryża powstał pierwszy szkic poematu „Deutschland. Ein Wintermärchen” (Niemcy. Baśń zimowa). Zgodnie z przepisami cenzury ustanowionymi na konferencji karlsbadzkiej w 1819 roku rękopisy liczące ponad dwadzieścia arkuszy nie podlegały kontroli cenzorskiej. Dlatego poemat opublikowano wraz z innymi utworami w tomie zatytułowanym „Nowe wiersze”. Dzieło to ukazywało w zwartej formie bogactwo obrazowania Heinego oraz jego styl poetycki przypominający pieśni ludowe, łącząc je z ironiczną krytyką sytuacji panującej w ojczyźnie."
 manzoni.1300.g: "Należy to opublikować."
 manzoni.1300.h: "Zakaż publikacji i skonfiskuj dzieło!"
 manzoni.1300.i: "Ocenzuruj to..."
 manzoni.1301.t: "Heinrich Heine Drwi z Katedry Kolońskiej"
 manzoni.1301.d: "W swoim najnowszym dziele Heinrich Heine bezlitośnie wyśmiał wznowienie budowy katedry kolońskiej."
 manzoni.1301.f: "Heine, dawny obywatel Prus (urodził się w Düsseldorfie), sprzeciwiał się militaryzmowi panującemu w jego ojczyźnie. W swoim poemacie epickim krytykował „pruskie obyczaje”, ale występował również przeciwko idealizującemu rzeczywistość niemieckiemu romantyzmowi. Wyśmiewał bowiem anachronicznych Niemców, którzy zamiast patrzeć w przyszłość, woleli dokończyć budowę średniowiecznej katedry."
 manzoni.1301.g: "Niech cię diabli, Heine!"
 manzoni.1302.t: "„Noc księżycowa” Josepha von Eichendorffa"
 manzoni.1302.d: "Nowy wiersz Josepha von Eichendorffa jest uznawany za jedno ze szczytowych osiągnięć poezji niemieckiej."
 manzoni.1302.f: "Joseph Freiherr von Eichendorff był niemieckim poetą i powieściopisarzem, przedstawicielem późnego romantyzmu niemieckiego. Przewodnią ideą jego poezji było przekonanie, że człowiek powinien odnajdywać szczęście, całkowicie oddając się podziwianiu piękna natury i jej zmiennych nastrojów. Liryzm poezji Eichendorffa cieszy się ogromnym uznaniem, a jego wiersze były wykorzystywane jako teksty utworów muzycznych przez wielu kompozytorów, w tym Schuberta, Schumanna, Mendelssohna, Brahmsa, Hugona Wolfa, Richarda Straussa, Friedricha Nietzschego, Hansa Pfitznera i Alexandra Zemlinsky’ego. W 1837 roku opublikowano jego wiersz „Mondnacht” (Noc księżycowa), często uznawany za „perłę nad perłami” niemieckiej liryki romantycznej."
 manzoni.1302.g: "Przepiękne!"
 manzoni.1302.h: "Zamiast walczyć o swoją wolność polityczną, Niemcy pozwalają odwracać swoją uwagę głupimi wierszami?"
 manzoni.1303.t: "Powstanie Tkaczy"
 manzoni.1303.d: "W [SCOPE.sState('manzoni_weberaufstand_state').GetName] wyraźnie widoczne są problemy społeczne, gospodarcze i polityczne. Rozprzestrzeniające się idee liberalne oraz narastające ubóstwo wśród tradycyjnych rzemieślników doprowadziły do powstania groźnej sytuacji konfliktowej. Krążą pogłoski o zbliżającym się buncie, na którego czele mają stanąć miejscowi tkacze."
 manzoni.1303.f: "Początki industrializacji wpędziły wielu tkaczy w nędzę. Właściciel miejscowej fabryki włókienniczej skupuje od nich przędzę, lecz dzięki dużej podaży może dyktować coraz niższe ceny. Tkacze nie są zatem typowymi robotnikami fabrycznymi, lecz zubożałymi, samodzielnymi rzemieślnikami uzależnionymi od fabryki. Cierpiąc z powodu wyzysku i obawiając się, że w przyszłości ich sytuacja jeszcze się pogorszy, część mieszkańców regionu zjednoczyła siły i zaczęła grozić przedsiębiorcy, którego obwinia za swoją niedolę. Elity polityczne już teraz interpretują tę trudną sytuację na swój sposób. Szczególnie przemysłowcy domagają się zdecydowanych działań, aby zapobiec podobnym incydentom w przyszłości. Zwolennicy poprawy warunków płacowych uznaliby oczywiście takie postępowanie za zniewagę."
 manzoni.1303.g: "Wyślij wojsko."
 manzoni.1303.h: "Negocjuj."
 manzoni.1304.t: "„Pieśń tkaczy” Heinricha Heinego"
 manzoni.1304.d: "Stłumienie powstania tkaczy w [SCOPE.sCountry('manzoni_weberaufstand_country').GetAdjectiveNoFlag] [SCOPE.sState('manzoni_weberaufstand_state').GetName] stało się symbolem nierozwiązanych problemów społecznych i politycznych na obszarze Związku Niemieckiego. Heinrich Heine skrytykował odpowiedzialne za to władze w swoim wierszu."
 manzoni.1304.f: "Nie płyną łzy z ich ponurych oczu,\nSiedzą przy krosnach, szczerząc białe zęby:\nCałun dla ciebie, o Niemcy, tkamy,\nPotrójne przekleństwo w niego wplatamy,\n—Tkamy, tkamy!\n\nPrzekleństwo na Boga, do którego nasze modły\nDaremnie wznosiliśmy, gdy głód nas trawił;\nDaremnie mieliśmy nadzieję, daremnie czekaliśmy,\nOn tylko szydził i drwił z naszego nędznego losu,\n—Tkamy, tkamy!\n\nPrzekleństwo na króla bogaczy, którego tak często\nNasza nędza daremnie próbowała wzruszyć;\nKtóry odbiera nam nawet ostatni grosz,\nI każe nas zastrzelić na drodze jak psy,\n—Tkamy, tkamy!\n\nPrzekleństwo na naszą ojczyznę, fałszywą i podstępną,\nGdzie kwitną jedynie hańba i nikczemność,\nGdzie kwiaty zrywa się, nim zdążą rozkwitnąć,\nGdzie robactwo tuczy się na zgniliźnie i pleśni,\n—Tkamy, tkamy!"
 manzoni.1304.g: "Znowu ty, Heine?"
 manzoni.1304.h: "Cenzura! Cenzura!"
 manzoni.1305.t: "„Tkacze” Gerharta Hauptmanna"
 manzoni.1305.d: "Gerhart Hauptmann zaprezentował najważniejszy dramat w swojej karierze. Dzieło to umocniło jego reputację jako wybitnego przedstawiciela literatury niemieckiej zarówno w kraju, jak i za granicą. W 1912 roku Hauptmann otrzymał Literacką Nagrodę Nobla za „bogatą, różnorodną i wybitną twórczość w dziedzinie poezji dramatycznej”."
 manzoni.1305.f: "Większość postaci występujących w dramacie „Die Weber” (Tkacze) to proletariusze walczący o swoje prawa. W przeciwieństwie do większości dramatów z różnych epok, co wielokrotnie podkreślano w krytyce literackiej i opracowaniach, utwór nie ma jednego głównego bohatera, dzięki czemu stwarza szerokie możliwości gry zespołowej. Zamiast bohatera Hauptmann stworzył zbiorowość. To właśnie ona jest protagonistą, czyli głównym bohaterem dramatu, a jeśli poszczególne postacie wyłaniają się z tłumu, nie pozostają długo na pierwszym planie. Tło historyczne utworu stanowiło powstanie tkaczy w latach czterdziestych XIX wieku w [SCOPE.sState('manzoni_weberaufstand_state').GetName]."
 manzoni.1305.g: "W Niemczech nawet krwawa tragedia staje się dziedzictwem kulturowym."
 maria_luigia_died_tt: "#O Maria Luisa z Parmy#! umiera."
 je_manzoni_lucca: "Los Lukki"
 je_manzoni_lucca_reason: "Kongres Wiedeński musiał rozstrzygnąć kilka problemów związanych z restauracją dawnych dynastii w 1815 roku. Należały do nich kwestia przywrócenia Burbonów na tron Parmy oraz zapewnienia apanażu żonie Napoleona, Marii Luizie, pochodzącej z dynastii Habsburgów. Burbonowie parmeńscy otrzymali wcześniej Królestwo Etrurii po tym, jak Bonaparte włączył Parmę do Cesarstwa Francuskiego. Etruria musiała jednak ustąpić miejsca przywróconemu Wielkiemu Księstwu Toskanii pod panowaniem przedstawiciela dynastii Habsburgów. Ostatecznie osiągnięto kompromis, zgodnie z którym książęta z dynastii Burbonów parmeńskich mogli objąć Księstwo Lukki, natomiast Maria Luiza miała zachować Parmę jako apanaż aż do swojej śmierci. Po śmierci Marii Luizy Burbonowie parmeńscy mieli powrócić do Parmy, a Lukka miała zostać przyłączona do Toskanii."
 manzoni.901.t: "Los Lukki"
 manzoni.901.d: "Zgodnie z postanowieniami Kongresu Wiedeńskiego, po śmierci Marii Luizy Habsburżanki dynastia Burbonów parmeńskich ponownie objęła tron w Parmie. W zamian Lukka musi zostać przekazana Toskanii."
 manzoni.901.f: "Kongres Wiedeński musiał rozstrzygnąć kilka problemów związanych z restauracją dawnych dynastii w 1815 roku. Należały do nich kwestia przywrócenia Burbonów na tron Parmy oraz zapewnienia apanażu żonie Napoleona, Marii Luizie, pochodzącej z dynastii Habsburgów. Burbonowie parmeńscy otrzymali wcześniej Królestwo Etrurii po tym, jak Bonaparte włączył Parmę do Cesarstwa Francuskiego. Etruria musiała jednak ustąpić miejsca przywróconemu Wielkiemu Księstwu Toskanii pod panowaniem przedstawiciela dynastii Habsburgów. Ostatecznie osiągnięto kompromis, zgodnie z którym książęta z dynastii Burbonów parmeńskich mogli objąć Księstwo Lukki, natomiast Maria Luiza miała zachować Parmę jako apanaż aż do swojej śmierci. Po śmierci Marii Luizy Burbonowie parmeńscy mieli powrócić do Parmy, a Lukka miała zostać przyłączona do Toskanii."
 manzoni.901.g: "Niech żyje [SCOPE.sCharacter('manzoni_ruler_scope').GetPrimaryRoleTitle] [SCOPE.sCharacter('manzoni_ruler_scope').GetFullName]!"
 manzoni.902.g: "Lukka jest wreszcie nasza."
 manzoni_italian_irredenta_decision: "Italia irredenta"
 manzoni_italian_irredenta_decision_desc: "Historycznie Dalmacja, Wyspy Jońskie, Malta i Korsyka stanowiły część włoskiej ojczyzny. Korsyka należała do Genui, Malta do Sycylii, a Dalmacja i Wyspy Jońskie były częścią Republiki Weneckiej. Na tych obszarach nadal istnieją społeczności włoskie. Po chwalebnym zjednoczeniu Włoch i wielkich postępach, jakich dokonaliśmy, nadszedł czas, aby odzyskać ostatnie włoskie ziemie, które wciąż pozostają pod obcym panowaniem. Raz jeszcze powinniśmy wznieść okrzyk: „Va fuori, stranier!” — „Precz, cudzoziemcze!”."
 united_italian: "Włoski"
 je_manzoni_italianization: "Italianizacja"
 je_manzoni_italianization_reason: "Po zjednoczeniu Włoch Massimo d’Azeglio powiedział: „Stworzyliśmy Włochy, teraz musimy stworzyć Włochów”. Choć autentyczność tego powiedzenia budzi wątpliwości historyków, trafnie oddaje ono fakt, że po politycznym zjednoczeniu Włoch wewnętrzna jedność kraju była daleka od stabilności. Dotyczyło to nie tylko południa, gdzie grasowali bandyci — również na północy, poza elitami mieszczańskimi, większość mieszkańców nadal silnie utożsamiała się ze swoją tożsamością regionalną. Wspólnie prowadzone wojny, ogólnokrajowy system edukacji, powszechna służba wojskowa oraz budowa instytucji państwowych, takich jak koszary, porty wojenne i obiekty administracyjne, prawdopodobnie sprawią, że w ciągu najbliższych kilku lat z mozolnego procesu jednoczenia narodu wyłoni się znacznie silniejsza, ogólnowłoska tożsamość narodowa."
 manzoni_italian_consiousness_capital_tt: "Miejscowa ludność północnowłoska i południowłoska w naszym regionie stołecznym połączy się w jedną ludność włoską. Region ten stanie się ojczyzną kultury włoskiej. Nasza kultura podstawowa zmieni się na włoską i będziemy mogli przeprowadzić italianizację całego kraju."
 je_manzoni_italianization_goal: "#O Postęp Tożsamości Narodowej#! osiąga #G 250#!."
 je_manzoni_italianization_ai: "Italianizacja"
 je_manzoni_italianization_ai_reason: "Po zjednoczeniu Włoch Massimo d’Azeglio powiedział: „Stworzyliśmy Włochy, teraz musimy stworzyć Włochów”. Choć autentyczność tego powiedzenia budzi wątpliwości historyków, trafnie oddaje ono fakt, że po politycznym zjednoczeniu Włoch wewnętrzna jedność kraju była daleka od stabilności. Dotyczyło to nie tylko południa, gdzie grasowali bandyci — również na północy, poza elitami mieszczańskimi, większość mieszkańców nadal silnie utożsamiała się ze swoją tożsamością regionalną. Wspólnie prowadzone wojny, ogólnokrajowy system edukacji, powszechna służba wojskowa oraz budowa instytucji państwowych, takich jak koszary, porty wojenne i obiekty administracyjne, prawdopodobnie sprawią, że w ciągu najbliższych kilku lat z mozolnego procesu jednoczenia narodu wyłoni się znacznie silniejsza, ogólnowłoska tożsamość narodowa."
 je_manzoni_italianization_ai_goal: "#O Postęp Tożsamości Narodowej#! osiąga #G 250#!."
 je_manzoni_italian_national_identity: "Tożsamość Włoska"
 je_manzoni_italian_national_identity_reason: "Po kilku latach stopniowego zbliżania się do siebie oraz przeprowadzeniu szeregu reform wśród ogółu ludności coraz bardziej rozpowszechnia się poczucie przynależności do wspólnej, ogólnowłoskiej tożsamości narodowej. Poczucie to będzie rozprzestrzeniać się z regionu na region, zależnie od tego, jak państwo stworzy odpowiednie warunki: regiony z dobrze rozwiniętą administracją państwową, uniwersytetami, koszarami lub bazami morskimi mają większe szanse na wykształcenie ogólnowłoskiej tożsamości dzięki integracyjnej roli tych instytucji. Na obszarach silnie zurbanizowanych mieszkańcy łatwiej przyswajają ideę, która wcześniej była przedmiotem rozważań jedynie intelektualistów. W idealnych warunkach co roku jeden region może przyjąć nową tożsamość. Jeśli wszyscy Włosi zamieszkujący nasze państwo narodowe zaczną utożsamiać się z narodem włoskim, wpłynie to również na Włochów za granicą, którzy coraz częściej będą postrzegać siebie jako naszych rodaków żyjących poza granicami kraju, a nie jako Lombardczyków, Sycylijczyków czy Toskańczyków."
 manzoni.911.t: "Świadomość Włoska w [SCOPE.sState('united_italian_culture_state').GetName]"
 manzoni.911.d: "Po latach oddziaływania czynników społecznych i politycznych ludność w [SCOPE.sState('united_italian_culture_state').GetName] wykształciła poczucie przynależności do całego Półwyspu Apenińskiego. Jej mieszkańcy w pełni utożsamiają się teraz z ogólnowłoską tożsamością narodową."
 manzoni.911.f: "„Włosi chcieli stworzyć nowe Włochy, a sami pozostać dawnymi Włochami, ze wszystkimi obawami i moralną nędzą odziedziczonymi po minionych wiekach; myślą bowiem o zreformowaniu Włoch, lecz nikt nie dostrzega, że aby tego dokonać, muszą najpierw zreformować samych siebie”. – Massimo d’Azeglio"
 manzoni.911.g: "Odwieczne marzenie Machiavellego staje się rzeczywistością!"
 manzoni_italian_consiousness_tt: "Miejscowa ludność północnowłoska i południowłoska połączy się w jedną ludność włoską. Ojczyzny kultur północnowłoskiej i południowłoskiej zostaną przekształcone w ojczyzny kultury włoskiej."
 manzoni.912.t: "Świadomość Ogólnowłoska"
 manzoni.912.d: "Teraz, gdy cała ludność Włoch utożsamia się przede wszystkim nie ze swoją tożsamością regionalną, lecz z narodową, ma to wpływ na Włochów nie tylko w ojczyźnie, ale także na całym świecie."
 manzoni.912.f: "Wraz z utworzeniem włoskiego państwa narodowego i ugruntowaniem się ogólnowłoskiej tożsamości narodowej również Włosi żyjący poza jego granicami — zarówno emigranci rozsiani po świecie, jak i ludność od pokoleń zamieszkująca ziemie pod obcym panowaniem — będą utożsamiać się przede wszystkim z narodem włoskim."
 manzoni.912.g: "Stworzyliśmy Włochów!"
 manzoni_pan_italian_identity_tt: "Na całym świecie ludność północnowłoska i południowłoska będzie odtąd utożsamiać się ze wspólną, ogólnowłoską tożsamością narodową. Wszystkie ojczyzny kultur północnowłoskiej i południowłoskiej na świecie staną się wyłącznie ojczyznami kultury włoskiej."
 manzoni.913.d: "Teraz, gdy cała ludność Włoch utożsamia się przede wszystkim z narodem, a nie ze swoim regionem, wpływa to nie tylko na Włochów w ojczyźnie, lecz także na tych rozsianych po całym świecie. Również w naszym kraju pojawia się pragnienie, by określać się mianem Włochów, zamiast — jak dotychczas — wskazywać jedynie na swoje regionalne pochodzenie."
 manzoni.913.g: "Chcesz powiedzieć, że nie ma żadnych różnic między sycylijskim rybakiem a pasterzem z Trydentu?"
 rule_manzoni_united_cultures_rule: "#tooltip:[GetRawTextTooltipTag('mr_morgenroete_tt')] @mr_morgenroete_icon! #! Połączenie Kultur"
 setting_manzoni_united_cultures_rule: "Połączenie Kultur: #G włączone#!"
 setting_manzoni_united_cultures_rule_desc: "Możliwa jest italianizacja, germanizacja i helwetyzacja: poszczególne kultury mogą połączyć się w kulturę włoską, niemiecką i szwajcarską. Poprawia to wydajność w trakcie rozgrywki, ale może prowadzić do niezgodności z innymi modami."
 setting_manzoni_no_united_cultures_rule: "Połączenie Kultur: #R wyłączone#!"
 setting_manzoni_no_united_cultures_rule_desc: "Italianizacja, germanizacja i helwetyzacja #R nie są#! możliwe. Poprawia to zgodność z innymi modami, ale nie wpływa pozytywnie na wydajność w trakcie rozgrywki."
 manzoni_brigants_modifier: "Rozbójnictwo"
 manzoni_anti_regionalism_ig_modifier: "Antyregionalizm"
 manzoni_anti_regionalism_country_modifier: "Antyregionalizm"
 manzoni_linguistic_impurity_modifier: "Nieczystość Językowa"
 manzoni_no_foscolo_modifier: "Odmowa dla Foscola"
 manzoni.914.t: "[SCOPE.sCharacter('manzoni_character_scope').GetLastName] wspiera Sprawę Włoską"
 manzoni.914.d: "W obliczu rosnącego poparcia dla wspólnej włoskiej tożsamości [SCOPE.sCharacter('manzoni_character_scope').GetFullName] w pełni utożsamił się z ideałami Risorgimenta. Własne pochodzenie uznaje za drugorzędne i podkreśla swoją włoską tożsamość narodową."
 manzoni.914.f: "Jeszcze przed zjednoczeniem Włoch przede wszystkim elity intelektualne w większości uważały się za Włochów, traktując regionalne pochodzenie jedynie jako element folkloru. Po zjednoczeniu świadomość ta upowszechniała się zwłaszcza we włoskich siłach zbrojnych — armia i marynarka wojenna stały się „szkołą narodu”. W polityce zwolennicy centralizmu wcześnie zyskali przewagę nad regionalistami."
 manzoni.914.g: "Czasy lokalnych partykularyzmów dobiegły końca."
 manzoni.915.t: "Rozbójnicy w [SCOPE.sState('manzoni_brigant_state').GetName]"
 manzoni.915.d: "Trudne warunki życia w [SCOPE.sState('manzoni_brigant_state').GetName] sprawiły, że coraz więcej ludzi pozbawionych perspektyw dołącza do bandy [SCOPE.sCharacter('manzoni_brigant_character').GetFullName]. Rozbójnicy sieją teraz spustoszenie w okolicy na taką skalę, że stali się poważnym problemem. Znajdują nawet zwolenników wśród prostego ludu, który widzi w nich przeciwników rządu i postępującej italianizacji, a tym samym obrońców regionu stawiających opór polityce władz."
 manzoni.915.f: "Rozbójnictwo w południowych Włoszech istniało w różnych formach już od starożytności. Z czasem jednak działalność wyjętych spod prawa band napadających na przypadkowych podróżnych uległa znacznym przeobrażeniom, przybierając postać politycznego ruchu oporu. Po podboju Królestwa Obojga Sycylii w 1861 roku przez rządzone przez dynastię sabaudzką Królestwo Sardynii (późniejsze Królestwo Włoch) rozwinęła się najbardziej znana forma rozbójnictwa w tym regionie. Rozbójnicy wywodzili się z różnych środowisk i kierowali rozmaitymi pobudkami. Byli wśród nich byli więźniowie, bandyci i inni ludzie uznawani przez włoski rząd za pospolitych przestępców, ale także dawni żołnierze armii Burbonów i zwolennicy tej dynastii. Atakowali nie tylko włoskie władze i elity ziemiańskie, lecz również zwykłych ludzi. Często plądrowali wsie, miasta i gospodarstwa oraz dokonywali napadów z bronią w ręku zarówno na pojedyncze osoby, jak i całe grupy, w tym rolników, mieszkańców miast i rywalizujące bandy rozbójników."
 manzoni.915.g: "Kolejny bandyta udający Robin Hooda!"
 manzoni.916.t: "Obawa o dziedzictwo regionalne"
 manzoni.916.d: "Zwykli mieszkańcy [SCOPE.sState('manzoni_regionalist_state').GetName] obawiają się, że nowe ogólnowłoskie instytucje i upowszechnianie języka włoskiego mogą zniszczyć ich tradycyjny sposób życia. [SCOPE.sCharacter('manzoni_rural_leader_scope').GetFullName] przekonuje, że nie należy lekceważyć wyjątkowego dziedzictwa regionu, a ujednolicanie Włoch zaszło już zbyt daleko."
 manzoni.916.f: "Po klęsce rewolucji 1848/1849 roku neogwelfowie, stanowiący czołowy nurt ruchu na rzecz jedności Włoch, faktycznie utracili wpływy. Początkowo opowiadali się za federacyjnymi Włochami pod przewodnictwem papieża jako pierwszego wśród równych. W następstwie ich porażki całkowitą przewagę zdobyły środowiska centralistyczne — stan ten utrzymywał się jeszcze długo w XX wieku. Przestano uwzględniać regionalne odrębności, a przywiązanie do regionu zaczęto wręcz postrzegać jako niebezpieczną tendencję, która mogła zniweczyć włoskie dążenia zjednoczeniowe."
 manzoni.916.g: "[SCOPE.sState('manzoni_regionalist_state').GetName] to włoski region jak każdy inny."
 manzoni.916.h: "Powinniśmy uwzględnić to wyjątkowe dziedzictwo."
 manzoni.917.t: "Dialekty czy języki?"
 manzoni.917.d: "Czołowi nauczyciele, wykładowcy i profesorowie w naszym kraju opowiedzieli się za szczególnym wspieraniem upowszechniania języka włoskiego nie tylko w instytucjach publicznych, ale także w życiu codziennym. Powinno to znacznie usprawnić procesy naukowe i polityczne w nowych Włoszech — jednak wśród ogółu społeczeństwa, zwłaszcza ludności wiejskiej, jest to wyjątkowo niepopularny postulat, ponieważ ludzie ci nadal posługują się wyłącznie dialektami."
 manzoni.917.f: "Jeszcze w XVIII wieku nie było wątpliwości, że poszczególne odmiany językowe Półwyspu Apenińskiego stanowiły odrębne języki. Wielkim prestiżem cieszył się nie tylko język toskański za sprawą Dantego Alighieriego. Wenecki był językiem urzędowym i literackim Republiki Weneckiej; po wenecku pisano sztuki, między innymi Carla Goldoniego, a także dzieła literackie, a sam język nadal odgrywał szczególną rolę jako lingua franca w regionie Adriatyku. Podobnie można powiedzieć o języku neapolitańskim. W XIX wieku przeważył jednak pogląd, że istnieje tylko jeden standardowy język włoski, a wszystkie pozostałe języki Włoch są jedynie dialektami — mimo że włoszczyzna używana na północy miała już odrębny status językowy. Z czasem jednak, wraz z rozwojem ruchów politycznych, coraz wyraźniej ujawniała się rzeczywistość: język różni się od dialektu tym, że ten pierwszy ma marynarkę wojenną i armię."
 manzoni.917.g: "Nasza różnorodność językowa jest źródłem prestiżu."
 manzoni.917.h: "Mów po włosku, mów jasno. Reszta to tylko dialekty."
 manzoni.918.t: "Los Foscola"
 manzoni.918.d: "W miarę jak nastroje narodowe stają się coraz bardziej widoczne, pojawiają się głosy domagające się sprowadzenia ciała wielkiego włoskiego poety Ugo Foscola z Wielkiej Brytanii do Włoch."
 manzoni.918.f: "Nowy naród włoski poszukiwał punktów odniesienia: zarówno wydarzeń historycznych, jak i wybitnych postaci. Już wcześniej pojawiła się idea stworzenia miejsca spoczynku artystów, naukowców i innych wielkich osobistości na wzór Panteonu, podobnego do tego we Francji. Bazylika Santa Croce we Florencji, która wcześniej służyła jako miejsce pochówku znamienitych obywateli, wydawała się do tego odpowiednim miejscem. Postacie takie jak Machiavelli, Michał Anioł i Galileusz od dawna były bardziej włoskie niż toskańskie. Ugo Foscolo, poeta weneckiego pochodzenia z wyspy Zakintos, żył w czasach rewolucyjnych i jest uznawany za jedną z kluczowych postaci wczesnego włoskiego liberalizmu i nacjonalizmu. Byłby doskonałym uzupełnieniem tej galerii wielkich włoskich umysłów. Foscolo zmarł jednak na wygnaniu w 1827 roku — w Turnham Green pod Londynem."
 manzoni.918.g: "Poprośmy ich, by oddali nam Foscola."
 manzoni.918.h: "Byłoby nam wstyd, gdyby odmówili."
 manzoni.919.d: "Rząd włoski zwrócił się z prośbą o wydanie mu ciała słynnego poety i orędownika włoskiego nacjonalizmu, Ugo Foscola."
 manzoni.919.g: "Niech sobie zabiorą swojego marnego poetę. Jak on się właściwie nazywał?"
 manzoni.919.h: "Ten cały Foscolo zostaje tutaj."
 manzoni.920.t_foscolo: "Foscolo powraca"
 manzoni.920.d_foscolo: "Rząd brytyjski wyraził zgodę — ciało Foscola wkrótce powróci na włoską ziemię i znajdzie swoje ostateczne miejsce spoczynku w bazylice Santa Croce!"
 manzoni.920.f_foscolo: "Powrót Ugo Foscola do Włoch jest uznawany za jeden z pierwszych przełomowych momentów dla młodego państwa narodowego. Foscola witano niczym powracającego bohatera; jego pogrzeb przybrał formę uroczystego pochodu, podczas którego ludzie płakali i wiwatowali. Wraz z utworzeniem w Santa Croce „Panteonu” wielkich włoskich osobistości powstał trwały punkt odniesienia dla włoskiego nacjonalizmu. To włoscy bohaterowie, a nie katoliccy święci, mieli stać się głównymi postaciami tej ideologii."
 manzoni.920.g: "Wielki Włoch powraca do ojczyzny!"
 manzoni.920.t_no_foscolo: "Foscolo pozostaje na wygnaniu"
 manzoni.920.d_no_foscolo: "Niestety rząd brytyjski uniemożliwił powrót Ugo Foscola do Włoch, posługując się kilkoma obłudnymi wymówkami."
 manzoni.920.f_no_foscolo: "Naprawdę mieli czelność nazwać wielkiego włoskiego poetę „tym całym Fosco”!"
 manzoni.920.h: "Te syny kulawej krowy odmawiają nam naszego Foscola!"
 manzoni_gbr_hits_ita_prestige_tt: "To nadszarpnie prestiż Włoch."
 manzoni_roma_aeterna_decision: "Roma Aeterna"
 manzoni_roma_aeterna_decision_desc: "Rzym, Wieczne Miasto, jest jedyną prawdziwą stolicą Włoch od czasów Cesarstwa Rzymskiego. Możemy zatem przenieść tam siedzibę rządu bez żadnych negatywnych konsekwencji. Jeśli w dotychczasowej stolicy mamy zoo, muzeum lub obserwatorium, zostaną one tam zlikwidowane, ale natychmiast otrzymamy odpowiadające im placówki w nowej stolicy."
 manzoni.910.t: "Roma Aeterna"
 manzoni.910.d: "Dopiero po przeniesieniu stolicy do Rzymu Włochy zyskają prawdziwą stolicę wszystkich Włochów. Zaiste, teraz Italia może przywdziać hełm Scypiona!"
 manzoni.910.f: "„Gdy runie Koloseum, runie Rzym;\nA gdy runie Rzym — runie świat”. — Lord Byron"
 manzoni.910.g: "Roma Caput Mundi."
