 manzoni_company_basic_publishing_industries_dynamic_name_tag_plural: "Działalność Wydawnicza"
 manzoni.500.d: "[SCOPE.sCharacter('manzoni_writer_scope').GetFullName], lokalny pisarz, ma już dość naszego rządu. [SCOPE.sCharacter('manzoni_writer_scope').GetSheHe|U] postanowił zaangażować się w politykę, aby zmienić nasz kraj na lepsze. Pozostaje pytanie, czy powinniśmy na to pozwolić?"
 manzoni.801.t: "Piękne Ilustracje"
 manzoni.801.d: "[SCOPE.sCharacter('manzoni_writer_scope').GetFullName] zdołał przekonać malarza [SCOPE.sCharacter('klimt_painter_scope').GetFullName] do przygotowania ilustracji do [SCOPE.sCharacter('manzoni_writer_scope').GetHerHis] najnowszego dzieła. Pierwsze ukończone ilustracje są niezrównanie piękne i wzbudziły ogromny zachwyt u [SCOPE.sCharacter('manzoni_writer_scope').GetLastName]."
 manzoni.801.f: "„To wspaniała ilustracja! Ciekawe, czy artysta ukrył w niej jakieś drobne szczegóły, które zdradzą nam więcej o tej historii?”"
 manzoni.801.g: "„To wspaniała ilustracja! Ciekawe, czy artysta ukrył w niej jakieś drobne szczegóły, które zdradzą nam więcej o tej historii?”"
 manzoni.801.h: "To będzie bestseller!"
 manzoni.801.h_tt: "Zwiększy to szansę, że [GetPlayer.MakeScope.Var('manzoni_writer_var').GetCharacter.GetLastName] napisze [concept_manzoni_bestseller]"
 manzoni.802.t: "Teorie o Życiu Pozaziemskim"
 manzoni.802.d: "[SCOPE.sCharacter('manzoni_writer_scope').GetFullName], pisarz tworzący literaturę science fiction, oraz nasz Astronom, Dr. [SCOPE.sCharacter('verrier_astronomer_scope').GetLastName], spotkali się, aby omówić możliwość istnienia życia pozaziemskiego. Wspólnie wysunęli przypuszczenia dotyczące tego, jak mogłoby wyglądać takie życie i gdzie mogłoby istnieć. Swoje teorie opublikowali pod nazwą hipotezy [SCOPE.sCharacter('verrier_astronomer_scope').GetLastName]–[SCOPE.sCharacter('manzoni_writer_scope').GetLastName]."
 manzoni.802.f: "„Oczywiście istoty te żyłyby w gazowych oceanach gazowego olbrzyma. Przypuszczam, że nie mogłyby komunikować się ze światem zewnętrznym, ale co, gdyby znalazły sposób na kolonizację kolejnych gazowych olbrzymów? Moglibyśmy nawet być świadkami rewolucji w jednej z takich kolonii!”"
 manzoni.802.g: "Może powinniśmy poszukać istot pozaziemskich?"
 manzoni.802.h: "Powinni napisać książkę o swoich teoriach!"
 manzoni.802.i: "Fascynujące!"
 manzoni.803.t: "Przygody [SCOPE.sCharacter('manzoni_adventurer_scope').GetFullName]"
 manzoni.803.d: "[SCOPE.sCharacter('manzoni_writer_scope').GetFullName] usłyszał o przygodach Dr. [SCOPE.sCharacter('manzoni_adventurer_scope').GetLastName] i postanowił spotkać się z [SCOPE.sCharacter('manzoni_adventurer_scope').GetHerHim], aby przeprowadzić wywiad. Odbyli długą rozmowę, dzięki której [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] zyskał wiele pomysłów na [SCOPE.sCharacter('manzoni_writer_scope').GetHerHis] kolejną książkę."
 manzoni.803.f: "„Tak, teraz, kiedy o tym wspomniałeś, przypominam sobie, że byli tam piraci! Właściwie to byli piraci, którzy trzymali piranie jako zwierzęta domowe!”"
 manzoni.803.g: "Mam nadzieję, że przyniesie to owoce!"
 manzoni.804.t: "[SCOPE.sCharacter('manzoni_writer_scope').GetFullName] zainspirowany Lotem Balonem"
 manzoni.804.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] zabrał naszego poetę [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] na Lot Balonem. Po powrocie [SCOPE.sCharacter('manzoni_writer_scope').GetLastName] wydaje się pełen inspiracji zaczerpniętych z tej podróży."
 manzoni.804.f: "„Chmury wyglądały jak biały ocean, a ludzie na ziemi wydawali się tacy malutcy. To było niesamowite!”"
 manzoni.804.g: "Ach, piękno latania!"
 manzoni.804.h: "Może teraz wiersze [SCOPE.sCharacter('manzoni_writer_scope').GetHerHis] autorstwa staną się lepsze!"
 manzoni.804.i: "Ileż bym dał, żeby samemu zostać baloniarzem!"
 manzoni.805.t: "Piękno Gór"
 manzoni.805.d: "[SCOPE.sCharacter('manzoni_writer_scope').GetFullName] wybrał się na górską wyprawę w towarzystwie znanego alpinisty [SCOPE.sCharacter('mountaineer_scope').GetFullName]. Wspinaczka była trudna, ale po dotarciu na szczyt [SCOPE.sCharacter('manzoni_writer_scope').GetLastName] zachwycił się roztaczającym się stamtąd widokiem."
 manzoni.805.f: "„Otoczony morzem mgły, z którego wyłaniało się zaledwie kilka szczytów, wpatrywałem się we wschodzące słońce. Cudowny widok.”"
 manzoni.805.g: "Góry zainspirowały wielu poetów!"
 manzoni.805.h: "Mam nadzieję, że górskie powietrze pomoże [SCOPE.sCharacter('manzoni_writer_scope').GetHerHim] pisać lepsze wiersze!"
 manzoni.805.i: "Może [SCOPE.sCharacter('manzoni_writer_scope').GetHerselfHimself] powinien spróbować swoich sił jako alpinista?"
 manzoni.1003.t: "„Wyspa skarbów”"
 manzoni.1003.d: "„Wyspa skarbów”, napisana przez [SCOPE.sCharacter('manzoni_writer_scope').GetFullName], opowiada o przygodach Jima Hawkinsa, młodego chłopca, który wyrusza na poszukiwanie skarbu. Wraz z doktorem Liveseyem i dziedzicem Johnem Trelawneyem płynie statkiem na wyspę. Okazuje się jednak, że większość załogi stanowią piraci, którzy zamierzają zabić pozostałych członków załogi, aby zagarnąć cały skarb dla siebie. Czy Jim przeżyje tę przygodę?"
 manzoni.1003.f: "„To był skarb Flinta, po który przybyliśmy z tak daleka i który kosztował już życie siedemnastu ludzi z »Hispanioli«. Ilu ludzi straciło życie podczas jego gromadzenia, ile krwi przelano i ile cierpienia zadano, ile wspaniałych statków zatopiono na pełnym morzu, ilu dzielnych ludzi z zawiązanymi oczami zmuszono do przejścia po desce, ile oddano strzałów armatnich, ile było hańby, kłamstw i okrucieństwa — tego być może nie potrafiłby powiedzieć żaden żyjący człowiek.”\n— Robert Louis Stevenson, „Wyspa skarbów”"
 manzoni.1003.g: "Arrr!"
 manzoni.1004.t: "„Frankenstein, czyli współczesny Prometeusz”"
 manzoni.1004.d: "„Frankenstein, czyli współczesny Prometeusz”, autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName], to powieść, w której doktor Frankenstein próbuje ożywić istotę stworzoną z części ludzkich ciał. Dzięki wyładowaniu atmosferycznemu udaje mu się przywrócić ciało do życia. Kiedy potwór ożywa, doktor Frankenstein nie potrafi znieść jego odrażającego wyglądu i porzuca go na pastwę losu. Oblicze potwora budzi strach i przerażenie wśród mieszkańców wioski, przez co dobroduszna istota zaczyna coraz bardziej pogrążać się w samotności."
 manzoni.1004.f: "„Choć jego duch jest złamany, nikt nie potrafi odczuwać piękna przyrody głębiej niż on. Rozgwieżdżone niebo, morze i wszystkie widoki, jakie oferują te cudowne krainy, wciąż zdają się mieć moc odrywania jego duszy od ziemskich trosk. Taki człowiek wiedzie podwójne życie: może cierpieć niedolę i uginać się pod ciężarem rozczarowań, lecz gdy zamknie się w sobie, staje się niczym niebiański duch otoczony aureolą, do której wnętrza nie śmie przeniknąć żaden smutek ani szaleństwo.”\n— Mary Shelley, „Frankenstein, czyli współczesny Prometeusz”"
 manzoni.1004.g: "Przywracanie zmarłych do życia, czyż nie byłoby to wspaniałe?"
 manzoni.1005.t: "„Alicja w Krainie Czarów”"
 manzoni.1005.d: "W „Alicji w Krainie Czarów” mała Alicja wpada do króliczej nory i trafia do dziwacznego świata. Książka, której autorem jest [SCOPE.sCharacter('manzoni_writer_scope').GetFullName], przedstawia fantastyczne stworzenia i absurdalne zasady ustanowione przez dorosłych. Opowieść wyśmiewa moralizatorski świat epoki wiktoriańskiej."
 manzoni.1005.f: "„Gdybym miała własny świat, wszystko byłoby w nim na opak. Nic nie byłoby tym, czym jest, ponieważ wszystko byłoby tym, czym nie jest. I odwrotnie: to, co jest, nie byłoby tym, czym jest, a to, czym coś nie jest, właśnie tym by było. Rozumiesz?”\n— Lewis Carroll, „Alicja w Krainie Czarów”"
 manzoni.1005.g: "Cóż za niezwykła kraina!"
 manzoni.1006.t: "„Kubuś Puchatek”"
 manzoni.1006.d: "[SCOPE.sCharacter('manzoni_writer_scope').GetFullName] napisał „Kubusia Puchatka”, inspirując się swoim synem Krzysiem oraz jego pluszowymi zabawkami. Jest to zbiór krótkich opowieści o misiu Kubusiu Puchatku i jego przyjaciołach. Kubuś przeżywa w nich rozmaite przygody."
 manzoni.1006.f: "„— No cóż — powiedział Puchatek — najbardziej lubię... — I tu musiał przerwać, żeby się zastanowić. Bo chociaż jedzenie miodu było bardzo przyjemne, to jednak chwila tuż przed rozpoczęciem jedzenia była jeszcze przyjemniejsza niż samo jedzenie. Tylko Puchatek nie wiedział, jak się ta chwila nazywa.”\n— A.A. Milne, „Kubuś Puchatek”"
 manzoni.1006.g: "Mieć pluszowego misia za przyjaciela — to brzmi wspaniale!"
 manzoni.1007.t: "„Tajemnicza historia w Styles”"
 manzoni.1007.d: "„Tajemnicza historia w Styles” to powieść kryminalna autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName]. Pojawia się w niej postać Herkulesa Poirota, Belga, który przeprowadził się do Anglii i musi rozwiązać zagadkę morderstwa pani Inglethorp, u której obecnie mieszka. Poirot wystąpi później łącznie w 33 powieściach autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetLastNameNoFormatting]."
 manzoni.1007.f: "„Zbytnio puściłeś wodze fantazji. Wyobraźnia jest dobrym sługą, lecz złym panem. Najprostsze wyjaśnienie jest zawsze najbardziej prawdopodobne.”\n— Agatha Christie, „Tajemnicza historia w Styles”"
 manzoni.1007.g: "Ciekawe, czy jeszcze spotkam Herkulesa Poirota?"
 manzoni.1008.t: "„Księga dżungli”"
 manzoni.1008.d: "„Księga dżungli” to książka dla dzieci autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName]. Jej głównym motywem jest porzucenie i wychowanie przez przybranych opiekunów, ukazane poprzez losy Mowgliego, chłopca pozostawionego w dziczy i wychowanego przez wilki. Innym ważnym elementem książki jest prawo dżungli, którego przestrzegają zamieszkujące ją zwierzęta. Książka uczy dzieci, by znały swoje miejsce i przestrzegały zasad oraz prawa."
 manzoni.1008.f: "„Jedną z zalet prawa dżungli jest to, że kara wyrównuje wszystkie rachunki. Potem nikt już nie wypomina dawnych przewinień.”\n— Rudyard Kipling, „Księga dżungli”"
 manzoni.1008.g: "Szukaj tylko tego, co niezbędne!"
 manzoni.1009.t: "„Piotruś Królik”"
 manzoni.1009.d: "„Piotruś Królik” opowiada historię króliczka Piotrusia, który zakrada się do ogrodu pana McGregora, a następnie jest przez niego ścigany. Opowieść autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] jest nowatorska i przełomowa jak na książkę dla dzieci, wprowadzając wiele rozwiązań dotąd niespotykanych w literaturze dziecięcej."
 manzoni.1009.f: "„Dawno, dawno temu żyły sobie cztery małe króliczki, a nazywały się: Flopsy, Mopsy, Bawełniany Ogonek i Piotruś.”\n— Beatrix Potter, „Piotruś Królik”"
 manzoni.1009.g: "Zakraść się do zakazanego ogrodu? Brzmi interesująco!"
 manzoni.1010.t: "„Do latarni morskiej”"
 manzoni.1010.d: "„Do latarni morskiej” to powieść modernistyczna autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName]. Przedstawia wakacje rodziny Ramsayów na wyspie Skye i skupia się na myślach oraz obserwacjach bohaterów, zamiast na dialogach i wydarzeniach."
 manzoni.1010.f: "„Jaki jest sens życia? Oto całe pytanie — proste pytanie, które z biegiem lat coraz bardziej człowieka nurtowało. Wielkie objawienie nigdy nie nadeszło. Być może nigdy nie miało nadejść. Zamiast niego zdarzały się drobne, codzienne cuda, nagłe olśnienia, zapałki niespodziewanie zapalane w ciemności. Oto jedno z nich.”\n— Virginia Woolf, „Do latarni morskiej”"
 manzoni.1010.g: "Rodziny..."
 manzoni.1307.t: "„Buddenbrookowie. Dzieje upadku rodziny”"
 manzoni.1307.d: "„Buddenbrookowie. Dzieje upadku rodziny” to pierwsza niemieckojęzyczna powieść społeczno-obyczajowa. [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] opisuje w niej upadek zamożnej rodziny kupieckiej na przestrzeni czterech pokoleń w hanzeatyckim mieście Lubece."
 manzoni.1307.f: "„Często zewnętrzne, widoczne oznaki i symbole szczęścia oraz sukcesu pojawiają się dopiero wtedy, gdy proces upadku już się rozpoczął. Zewnętrzne przejawy potrzebują czasu, by stać się dostrzegalne — podobnie jak światło tamtej gwiazdy, która w rzeczywistości mogła już zgasnąć, choć nam wydaje się, że świeci najjaśniej.”\n— Thomas Mann, „Buddenbrookowie”"
 manzoni.1307.g: "Mam nadzieję, że moja rodzina nie chyli się ku upadkowi."
 manzoni.1404.t: "„Dama kameliowa”"
 manzoni.1404.d: "„Dama kameliowa” to historia miłosna inspirowana osobistymi przeżyciami [SCOPE.sCharacter('manzoni_writer_scope').GetFullName]. Opowiada o niezłomnej miłości Armanda i kurtyzany Małgorzaty, której na drodze staje ojciec Armanda, obawiający się, że związek syna może przekreślić szanse jego córki na zamążpójście. Dlatego przekonuje Małgorzatę, by opuściła Armanda. Czy Armand kiedykolwiek pozna prawdę?"
 manzoni.1404.f: "„Cieszyła się najdrobniejszymi rzeczami niczym dziecko. Bywały dni, kiedy biegała po ogrodzie jak dziesięcioletnia dziewczynka, uganiając się za motylem lub ważką. Ta kurtyzana, która wydała na bukiety więcej pieniędzy, niż potrzeba byłoby do zapewnienia dostatniego życia całej rodzinie, potrafiła czasem siedzieć przez godzinę na trawie, przyglądając się prostemu kwiatowi, od którego wzięła swoje miano.”\n— Aleksander Dumas (syn), „Dama kameliowa”"
 manzoni.1404.g: "Ach, miłość, która nigdy nie umiera!"
 manzoni.1405.t: "„Pani Bovary”"
 manzoni.1405.d: "„Pani Bovary” to powieść realistyczna autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName]. Emma Bovary jest znudzona życiem na francuskiej prowincji oraz swoim małżeństwem i zaczyna wdawać się w romanse z innymi mężczyznami. Wydaje również znacznie więcej pieniędzy, niż posiada, przez co popada w coraz większe długi. Czy uda jej się spłacić zadłużenie?"
 manzoni.1405.f: "„W głębi serca czekała jednak, aż coś się wydarzy. Niczym rozbitkowie wpatrywała się z rozpaczą w pustkę swojego życia, wypatrując gdzieś w oddali białego żagla pośród mgieł na horyzoncie. Nie wiedziała, czym będzie ta sposobność, jaki wiatr ją przyniesie, ku jakiemu brzegowi ją poniesie, czy okaże się małą łodzią, czy trójpokładowym okrętem, pełnym udręki albo szczęścia aż po same iluminatory. Lecz każdego ranka, gdy się budziła, miała nadzieję, że właśnie tego dnia nadejdzie. Nasłuchiwała każdego dźwięku, zrywała się gwałtownie, dziwiąc się, że wciąż nic się nie wydarzyło. A o zachodzie słońca, coraz bardziej zasmucona, tęsknie wyczekiwała następnego dnia.”\n— Gustave Flaubert, „Pani Bovary”"
 manzoni.1405.g: "Ta książka jest trochę... dziwna."
 manzoni.1406.t: "„Baryłeczka”"
 manzoni.1406.d: "„Baryłeczka” to opowiadanie autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName]. Kiedy Prusacy zajmują część Normandii, grupa Francuzów ucieka ze swoich domów. Przypadkowo trafiają jednak na okupowane tereny, gdzie zostają zatrzymani na czas nieokreślony. Wówczas Baryłeczka, prostytutka podróżująca wraz z nimi, wyjaśnia, że niemiecki oficer pozwoli im odjechać dopiero wtedy, gdy zgodzi się z nim przespać. Początkowo pozostali podróżni wspierają Baryłeczkę, lecz po kilku dniach ich nastawienie zaczyna się zmieniać..."
 manzoni.1406.f: "„Mieszkańcy miasta, zamknięci w zaciemnionych pokojach, byli oszołomieni, jakby dotknął ich jakiś kataklizm, niszczycielskie trzęsienie ziemi, wobec którego wszelka mądrość i wszelki opór okazywały się bezsilne. Takie uczucie pojawia się zawsze, gdy ustalony porządek rzeczy zostaje zachwiany, gdy znika poczucie bezpieczeństwa, a wszystko, co dotąd chroniły prawa ludzkie lub prawa natury, nagle zostaje wydane na pastwę ślepego, bezrozumnego okrucieństwa.”\n— Guy de Maupassant, „Baryłeczka”"
 manzoni.1406.g: "Tak potraktować osobę, która ich ocaliła..."
 manzoni.1407.t: "„Arsène Lupin, dżentelmen włamywacz”"
 manzoni.1407.d: "„Arsène Lupin, dżentelmen włamywacz” to zbiór opowiadań, których bohaterem jest Arsène Lupin, włamywacz o manierach dżentelmena. W opowieściach autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] Lupin najpierw zostaje aresztowany, następnie ucieka z więzienia, a w ostatnim opowiadaniu musi zmierzyć się z Sherlockiem Holmesem."
 manzoni.1407.f: "„Jaka szkoda, że nie jestem uczciwym człowiekiem!”\n— Maurice Leblanc, „Arsène Lupin, dżentelmen włamywacz”"
 manzoni.1407.g: "Ciekawe, kto jest lepszy, Sherlock Holmes czy Arsène Lupin?"
 manzoni.1408.t: "Ciekawe, kto jest lepszy, Sherlock Holmes czy Arsène Lupin?"
 manzoni.1408.d: "„W poszukiwaniu straconego czasu” przedstawia wspomnienia narratora z dzieciństwa oraz jego doświadczenia z dorosłego życia w kręgach francuskich wyższych sfer na przełomie XIX i XX wieku. Autor, [SCOPE.sCharacter('manzoni_writer_scope').GetFullName], wykorzystuje zwłaszcza pamięć mimowolną jako środek służący rozwijaniu fabuły."
 manzoni.1408.f: "„Więzi łączące nas z drugim człowiekiem istnieją jedynie w naszych umysłach. W miarę jak pamięć blaknie, więzi te słabną. I pomimo złudzeń, którym sami pragniemy ulegać i którymi, powodowani miłością, przyjaźnią, uprzejmością, szacunkiem czy poczuciem obowiązku, łudzimy innych, istniejemy w samotności. Człowiek jest istotą, która nie może uciec od samej siebie, która poznaje innych ludzi jedynie poprzez własne wnętrze, a gdy twierdzi inaczej, kłamie.”\n— Marcel Proust, „W poszukiwaniu straconego czasu”"
 manzoni.1408.g: "Ta książka coś mi przypomina..."
 manzoni.1409.t: "„Mała Fadeta”"
 manzoni.1409.d: "W „Małej Fadecie” dwaj bracia bliźniacy z szanowanej rodziny chłopskiej zakochują się w Fadecie. Początkowo ich relacje z dziewczyną stoją w sprzeczności z patriarchalnymi normami i oczekiwaniami mieszkańców wioski, lecz gdy Fadeta dziedziczy fortunę, wszystko się zmienia. [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] wykorzystuje swoje wiejskie pochodzenie, aby szczegółowo opisać wieś i jej mieszkańców."
 manzoni.1409.f: "„Bóg opuszcza tylko tych, którzy sami siebie opuszczają, a kto ma odwagę zamknąć swój smutek we własnym sercu, ma więcej siły, by z nim walczyć, niż ten, kto się skarży.”\n— George Sand, „Mała Fadeta”"
 manzoni.1409.g: "Sprytni młodzi ludzie!"
 manzoni.1501.t: "„Chata wuja Toma”"
 manzoni.1501.d: "„Chata wuja Toma” autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] to książka ukazująca zło i okrucieństwo niewolnictwa. Przedstawia losy różnych niewolników, których życie naznaczone jest niedolą i cierpieniem."
 manzoni.1501.f: "„...serce nie ma już łez do wylania — sączy jedynie krew, wykrwawiając się w milczeniu.”\n— Harriet Beecher Stowe, „Chata wuja Toma”"
 manzoni.1501.g: "To brzmi przerażająco!"
 manzoni.1502.t: "„Ben-Hur. Opowieść z czasów Chrystusa”"
 manzoni.1502.d: "W „Ben-Hurze. Opowieści z czasów Chrystusa” [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] przedstawia losy Judy Ben-Hura, żydowskiego księcia, który zostaje zniewolony przez Rzymian, a następnie staje się woźnicą rydwanu. Opowieść ta odzwierciedla życie Jezusa."
 manzoni.1502.f: "„O ileż piękniej jest ufać Bogu. Wszystko, co piękne na tym świecie, pochodzi z Jego ręki i świadczy o doskonałości Jego smaku. On jest twórcą wszelkich kształtów, On przyodziewa lilie, nadaje barwy różom, tworzy krople rosy i muzykę natury. Słowem, to On stworzył nas do tego życia i ustanowił jego warunki. Są one dla mnie tak wielką rękojmią, że ufny niczym małe dziecko powierzam Mu ukształtowanie mojej duszy i wszelkie przygotowania do życia po śmierci. Wiem, że mnie kocha.”\n— Lew Wallace, „Ben-Hur. Opowieść z czasów Chrystusa”"
 manzoni.1502.g: "Prawdziwy chrześcijanin!"
 manzoni.1503.t: "„Moby Dick, czyli wieloryb”"
 manzoni.1503.d: "„Moby Dick, czyli wieloryb” autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] ukazuje obsesję kapitana Ahaba na punkcie białego wieloryba z perspektywy młodego marynarza Izmaela. Odkąd wieloryb odgryzł Ahabowi nogę aż do kolana, kapitan ma w życiu tylko jeden cel: zemstę."
 manzoni.1503.f: "„Ilekroć zaczynam przybierać ponurą minę, ilekroć w mojej duszy zapada wilgotny, dżdżysty listopad, ilekroć mimowolnie zatrzymuję się przed składami trumien i dołączam do końca każdego napotkanego konduktu pogrzebowego, a zwłaszcza gdy melancholia ogarnia mnie do tego stopnia, że tylko silne zasady moralne powstrzymują mnie przed rozmyślnym wyjściem na ulicę i metodycznym strącaniem ludziom kapeluszy z głów — wtedy uznaję, że najwyższy czas jak najszybciej wyruszyć w morze.”\n— Herman Melville, „Moby Dick, czyli wieloryb”"
 manzoni.1503.g: "Co jest moim wielorybem?"
 manzoni.2100.t: "\"Tang Thương Ngẫu Lục\""
 manzoni.2100.d: "„Tang Thương Ngẫu Lục – Przypadkowe zapiski o smutku” to zbiór opowieści autorstwa Phama Dinha Ho i Nguyena Ana, dokumentujących wydarzenia religijne i społeczne w Wietnamie na przełomie XVIII i XIX wieku. Zbiór obejmuje łącznie 89 opowieści, podzielonych na dwie księgi: Górną i Dolną. Znajdują się w nim historie wybitnych postaci, opisy malowniczych podróży, zabytków oraz miejscowych legend. Zapiski te dają wyjątkowy wgląd w życie Wietnamczyków w burzliwym okresie schyłku późnej dynastii Lê i początków panowania dynastii Nguyễn."
 manzoni.2100.f: "Od czasów dynastii Lý, Trần, Lê i Trịnh aż po dzień dzisiejszy minęły setki lat. Istnieją opowieści, których nie zapisali oficjalni kronikarze ani nie zachowały miejscowe legendy. Dlatego obaj autorzy postanowili zebrać je jako świadectwa bolesnych przemian. Gdyby uznali te historie za zbyt smutne i zdecydowali się o nich zapomnieć, prędzej czy później przepadłyby one w niepamięci. Na szczęście, utrwalone na piśmie, mogą stać się tratwą, która przeniesie nas z brzegu obłędu ku ocaleniu, oraz światłem rozpraszającym ciemności. Stąd tytuł „Tang Thương Ngẫu Lục – Przypadkowe zapiski o smutku”, którego znaczenie staje się tym samym zrozumiałe."
 manzoni.2100.g: "Opowieści z mroczniejszych czasów. Musimy dążyć do tego, by stać się lepszymi."
 manzoni.2200.t: "Pojedynek o Honor"
 manzoni.2200.d: "Po tym, jak [SCOPE.sCharacter('manzoni_writer_scope').GetLastName] wysłał do Georges’a d’Anthèsa, domniemanego adoratora swojej żony, niezwykle obraźliwy list, ten wyzwał go na pojedynek. Teraz nadszedł czas, by obaj stanęli naprzeciw siebie."
 manzoni.2200.f: "„Zasady pojedynku przewidują, że obaj przeciwnicy ustawią się w uzgodnionej odległości od siebie, plecami do siebie. Na dany sygnał obaj pojedynkowicze odwrócą się i ruszą ku sobie. Każdy sam zdecyduje, kiedy oddać strzał. Ten, kto wystrzeli jako pierwszy, musi pozostać nieruchomo w tym samym miejscu.\nCzy obaj zgadzacie się na te zasady?”"
 manzoni.2200.g: "Mam nadzieję, że przeżyje!"
 manzoni.2200.h: "Mam nadzieję, że ten awanturnik zginie!"
 manzoni.2201.t: "„Zbrodnia i kara”"
 manzoni.2201.d: "„Zbrodnia i kara” autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] przedstawia udręki psychiczne i dylematy moralne Rodiona Raskolnikowa, zubożałego byłego studenta mieszkającego w Petersburgu, który planuje zamordować pozbawioną skrupułów lichwiarkę, starszą kobietę przechowującą w swoim mieszkaniu pieniądze i kosztowności."
 manzoni.2201.f: "„Ból i cierpienie są zawsze nieuniknione dla ludzi obdarzonych wielkim rozumem i głębokim sercem. Sądzę, że naprawdę wielcy ludzie muszą zaznawać na ziemi wielkiego smutku.”\n— Fiodor Dostojewski, „Zbrodnia i kara”"
 manzoni.2201.g: "Dobrze, że nie mam żadnych długów!"
 manzoni.2202.t: "\"Voyna i mir\""
 manzoni.2202.d: "„Wojna i pokój” autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] przedstawia losy wielu postaci pochodzących z różnych warstw społecznych, od chłopów po arystokrację. Akcja powieści rozgrywa się w czasie wojen napoleońskich, które odmieniają życie trójki głównych bohaterów."
 manzoni.2202.f: "„Nie ludziom dane jest osądzać, co jest dobre, a co złe. Ludzie od zawsze się mylili i nadal będą się mylić, a najbardziej właśnie w tym, co uważają za dobre i złe.”\n— Lew Tołstoj, „Wojna i pokój”"
 manzoni.2202.g: "Prawdziwe arcydzieło! Tylko trochę przydługie..."
 manzoni.2300.t: "\"Tōsei Shosei Katagi\""
 manzoni.2300.d: "„Tōsei Shosei Katagi”, czyli „Portrety współczesnych studentów”, autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName], to jedna z pierwszych nowoczesnych powieści japońskich. Wraz z „Shōsetsu Shinzui”, rozprawą krytycznoliteracką tego samego autora, dzieło to przyczyniło się do wzrostu akceptacji dla powieści i dramatów w Japonii."
 manzoni.2300.f: ""
 manzoni.2300.g: "Teraz Japonia również będzie miała swoje powieści!"
 manzoni.2400.t: "\"Memorias Posthumas de Braz Cubas\""
 manzoni.2400.d: "W „Pośmiertnych wspomnieniach Brása Cubasa” [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] pozwala głównemu bohaterowi, Brásowi Cubasowi, opowiedzieć historię swojego życia już po śmierci. Dzięki temu Cubas może swobodnie krytykować brazylijskie społeczeństwo. Jest to pierwsza realistyczna powieść Machado, a niektóre postacie i wątki pojawiają się ponownie w jego późniejszych dziełach."
 manzoni.2400.f: "„Robakowi, który jako pierwszy nadgryzł zimne ciało moich zwłok, poświęcam z czułym wspomnieniem te Pośmiertne wspomnienia.”\n— Machado de Assis, „Pośmiertne wspomnienia Brása Cubasa”"
 manzoni.2400.g: "Być krytykowanym przez nieboszczyka!"
 manzoni.2401.t: "„Iracema”"
 manzoni.2401.d: "„Iracema” to opowieść autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName], która próbuje ukazać narodziny pierwszego Brazylijczyka. Przedstawia historię rdzennej mieszkanki Iracemy i portugalskiego kolonisty Martima, którym później rodzi się syn o imieniu Moacir. Tytuł książki jest anagramem słowa „Ameryka”, co doskonale pasuje do tematyki kolonizacji."
 manzoni.2401.f: "„Zielone, nieokiełznane morza mojej ojczystej ziemi, gdzie wśród liści palmy karnauba rozbrzmiewa śpiew papugi jandaia.”\n— José de Alencar, „Iracema”"
 manzoni.2401.g: "Opowieść, która ma stworzyć naród..."
 manzoni.2402.t: "„Kamienica”"
 manzoni.2402.d: "„Kamienica” to powieść naturalistyczna autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName]. [SCOPE.sCharacter('manzoni_writer_scope').GetLastName] przedstawia w niej życie różnych imigrantów, zarówno Portugalczyków, jak i przybyszów z innych krajów, zamieszkujących ubogą dzielnicę. Ludzie ci przystosowują się do życia w nowej ojczyźnie i stopniowo się zmieniają."
 manzoni.2402.f: "„I w tej rozmokłej, parującej ziemi, w tym gorącym, błotnistym zaduchu zaczął się roić, kiełkować i rozrastać cały świat, żywa istota, nowe pokolenie, które zdawało się rodzić samoistnie, właśnie tam, z owego błota, i mnożyć się niczym larwy w gnoju.”\n— Aluísio Azevedo, „Kamienica”"
 manzoni.2402.g: "Jak możemy pozwalać na istnienie takich slumsów?"
 manzoni.2500.t: "„Dziennik szaleńca”"
 manzoni.2500.d: "„Dziennik szaleńca” to współczesne chińskie opowiadanie autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName], napisane w większości potocznym językiem chińskim. Przedstawia historię brata narratora, który stopniowo popada w coraz większy obłęd. Podejrzewa, że otaczający go ludzie są kanibalami i próbują zmusić go do popełnienia samobójstwa."
 manzoni.2500.f: "„Wiedziałem, że w tym śmiechu kryły się odwaga i prawość. Zarówno starzec, jak i mój brat pobledli, onieśmieleni moją odwagą i prawością.”\n— Lu Xun, „Dziennik szaleńca”"
 manzoni.2500.g: "Przynajmniej wokół mnie nie ma żadnych kanibali!"
 manzoni_beautiful_illustrations_modfier: "Piękne Ilustracje"
 manzoni_alien_theories_modfier: "Teorie o Życiu Pozaziemskim"
 manzoni_adventure_idea_modifier: "Pomysły na Przygody"
 manzoni.332.d: "Światowej sławy pisarz zaszczycił nasz kraj swoją wizytą. [SCOPE.sCharacter('manzoni_writer_scope').GetSheHe|U] odbywa obecnie tournée literackie."
 manzoni.332.f: "[SCOPE.sCharacter('manzoni_writer_scope').GetFullName] to pisarz pochodzący z kraju [SCOPE.sCharacter('manzoni_writer_scope').GetHomeCountry.GetName], którego reputacja wynosi [SCOPE.sCharacter('manzoni_writer_scope').MakeScope.GetVariable('manzoni_writer_experience').GetValue|V0]. Spośród licznych dzieł [SCOPE.sCharacter('manzoni_writer_scope').GetHerHis] autorstwa aż [SCOPE.sCharacter('manzoni_writer_scope').MakeScope.GetVariable('manzoni_num_bestsellers_var').GetValue|V0] uznaje się za bestsellery, a książki [SCOPE.sCharacter('manzoni_writer_scope').GetHerHis] autorstwa są wydawane w [SCOPE.sCharacter('manzoni_writer_scope').MakeScope.GetVariable('manzoni_num_book_licenses_var').GetValue|V0] krajach."
