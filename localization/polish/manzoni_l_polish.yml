 manzoni.1205.t: "„Zeno Cosini”"
 manzoni.1205.d: "Aron Ettore Schmitz, lepiej znany pod pseudonimem [SCOPE.sCharacter('manzoni_writer_scope').GetFullName], był włoskim pisarzem i przedsiębiorcą, autorem powieści, sztuk teatralnych i opowiadań. Svevo, bliski przyjaciel irlandzkiego powieściopisarza i poety Jamesa Joyce’a, był uważany za pioniera powieści psychologicznej we Włoszech. Największą sławę przyniosła mu modernistyczna powieść „La Coscienza di Zeno”, czyli „Zeno Cosini”, która stała się powszechnie cenionym klasykiem literatury włoskiej. Svevo posłużył również jako pierwowzór Leopolda Blooma, głównego bohatera „Ulissesa” Joyce’a."
 manzoni.1205.f: "„W przeciwieństwie do innych chorób życie zawsze kończy się śmiercią. Nie poddaje się żadnej terapii. To tak, jakbyśmy zatykali otwory w naszych ciałach, uznając je za rany. Umarłoby się z uduszenia w chwili, gdy poddano by nas takiemu leczeniu.”\n– Italo Svevo, „Zeno Cosini”"
 manzoni.1207.t: "„Przygody Pinokia. Historia pajacyka”"
 manzoni.1207.d: "Carlo Lorenzini, lepiej znany jako [SCOPE.sCharacter('manzoni_writer_scope').GetFullName], był dziennikarzem i pisarzem, którego najbardziej pamięta się dzięki opowieści o ożywionej kukiełce imieniem Pinokio. „Przygody Pinokia. Historia pajacyka” ukazywały się początkowo w odcinkach na łamach czasopisma „Giornale dei Bambini” od 1880 roku, zanim zostały wydane w dwóch tomach w 1883 roku. Opowieść przedstawia pełne psot przygody ożywionej drewnianej marionetki imieniem Pinokio oraz losy jej twórcy i przybranego ojca, ubogiego rzeźbiarza w drewnie imieniem Dżeppetto."
 manzoni.1207.f: "„Sumienie to ten cichy, wewnętrzny głos, którego ludzie nie chcą słuchać.”\n– Carlo Collodi, „Przygody Pinokia. Historia pajacyka”"
 manzoni.1208.t: "„Serce”"
 manzoni.1208.d: "[SCOPE.sCharacter('manzoni_writer_scope').GetFullName] był włoskim pisarzem i dziennikarzem, który później zasłynął jako autor literatury dziecięcej. De Amicis był patriotą i walczył w wojnach o niepodległość Włoch, jednak zrezygnował ze służby wojskowej, rozczarowany armią. Jako zdeklarowany wolnomularz De Amicis starał się w swoich dziełach zastąpić głęboko zakorzeniony we włoskiej duszy katolicyzm świeckimi cnotami i oddaniem państwu. W późniejszych latach idee socjalistyczne wywarły znaczący wpływ na jego poglądy i twórczość."
 manzoni.1208.f: "„Książka ta jest przeznaczona przede wszystkim dla uczniów szkół podstawowych w wieku od 9 do 13 lat i mogłaby nosić tytuł: Historia roku szkolnego napisana przez ucznia trzeciej klasy szkoły miejskiej we Włoszech. Mówiąc, że została napisana przez trzecioklasistę, nie mam na myśli, że rzeczywiście napisał ją w takiej postaci, w jakiej została wydrukowana. Chłopiec stopniowo zapisywał w zeszycie, tak jak potrafił, wszystko, co widział, słyszał i myślał w szkole i poza nią. Pod koniec roku jego ojciec opracował te zapiski, starając się nie zmieniać myśli syna i w miarę możliwości zachować jego własne słowa. Cztery lata później chłopiec, będąc już uczniem szkoły średniej, ponownie przeczytał rękopis i dodał coś od siebie, korzystając z wciąż żywych wspomnień o ludziach i wydarzeniach. A teraz przeczytajcie tę książkę, chłopcy. Mam nadzieję, że sprawi wam radość i przyniesie wam wiele pożytku.”\n– Edmondo de Amicis, „Serce”"
 manzoni.1208.h: "Co za wspaniała książka!"
 manzoni.1306.t: "„Berlin Alexanderplatz”"
 manzoni.1306.d: "„Berlin Alexanderplatz” autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] opowiada historię robotnika Franza Biberkopfa, który po wyjściu z więzienia nie potrafi odnaleźć się w normalnym życiu i ponownie wkracza na drogę przestępstwa. Biberkopf zmaga się nie tylko z wewnętrznymi i zewnętrznymi demonami, lecz także z samą wielką metropolią, w której grozi mu zatracenie."
 manzoni.1306.f: "„Nie powinieneś przejmować się swoim losem. Jestem przeciwnikiem przeznaczenia. Nie jestem Grekiem, jestem berlińczykiem.”\n– Alfred Döblin, „Berlin Alexanderplatz”"
 manzoni.1306.g: "Przełomowe dzieło modernizmu."
 manzoni.1403.t: "„Mały Książę”"
 manzoni.1403.d: "W „Le Petit Prince”, czyli „Małym Księciu”, [SCOPE.sCharacter('manzoni_writer_scope').GetFullName] przedstawia podróż małego księcia pochodzącego z niewielkiej planety, który odwiedza inne planety i spotyka na nich rozmaite postacie będące karykaturami różnych typów dorosłych. Podczas swojej wędrówki książę pragnie zrozumieć wszechświat. Czy uda mu się znaleźć odpowiedź na nurtujące go pytanie?"
 manzoni.1403.f: "„Wszyscy dorośli byli kiedyś dziećmi... ale niewielu z nich o tym pamięta.”\n– Antoine de Saint-Exupéry, „Mały Książę”"
 manzoni.1403.g: "Zrozumieć wszechświat? To brzmi jak coś niemożliwego..."
 manzoni.1901.t: "„Ulisses”"
 manzoni.1901.d: "„Ulisses” to powieść modernistyczna autorstwa [SCOPE.sCharacter('manzoni_writer_scope').GetFullName]. Autor zabiera w niej czytelnika w podróż po Dublinie, podczas której główny bohater, Leopold Bloom, odwiedza rozmaite miejsca. Szczególną cechą powieści jest sposób przedstawiania ludzkich myśli i skojarzeń. Autor opisuje je tak, jak pojawiają się w umyśle człowieka."
 manzoni.1901.f: "„Byłam kwiatem gór tak kiedy wpięłam różę we włosy jak to robiły andaluzyjskie dziewczęta a może powinnam założyć czerwoną tak i jak całował mnie pod mauretańskim murem i pomyślałam sobie cóż równie dobrze on jak każdy inny a potem dałam mu oczami znak żeby zapytał jeszcze raz tak i wtedy zapytał czy zechcę tak powiedzieć tak mój górski kwiecie a ja najpierw objęłam go ramionami tak i przyciągnęłam do siebie żeby poczuł moje piersi całe pachnące perfumami tak a jego serce biło jak oszalałe i tak powiedziałam tak chcę Tak.”\n– James Joyce, „Ulisses”"
 manzoni.1901.g: "To interesujący nowy styl pisania!"
