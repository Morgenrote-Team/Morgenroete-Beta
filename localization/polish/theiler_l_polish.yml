 theiler.42.f.strychnine: "#V Strychnina#! została po raz pierwszy wyizolowana z nasion Strychnos Ignatii, drzewa pochodzącego z Azji Południowo-Wschodniej. Znalazła zastosowanie jako pestycyd, a w bardzo małych dawkach także jako środek pobudzający mięśnie, serce i jelita. Jest jednak znana przede wszystkim ze swojej neurotoksyczności. Przedawkowanie powoduje drgawki, pocenie się, szczękościsk i inne bolesne objawy, które mogą prowadzić do śmierci. Z tego względu stała się trucizną chętnie wykorzystywaną przez niedoszłych morderców i autorów powieści kryminalnych."
 theiler.42.f.emetine: "#V Emetyna#! to substancja lecznicza występująca w Carapichea ipecacuanha, znanej również jako ipekakuana, roślinie kwitnącej pochodzącej z Ameryki Środkowej i Południowej. Początkowo stosowano ją w leczeniu czerwonki pełzakowej, zakażenia jelit. Jej nazwa nawiązuje bezpośrednio do działania niepożądanego w postaci wywoływania nudności i wymiotów."
 theiler.42.f.atropine: "#V Atropina#! to lek otrzymywany z Atropa Belladonna, znanej również jako pokrzyk wilcza jagoda, rośliny występującej naturalnie w Europie i zachodniej Azji. Atropina w różnych postaciach była stosowana w leczeniu astmy, blokowaniu skutków ubocznych pobudzenia układu nerwowego, ograniczaniu wydzielania śliny oraz leczeniu niektórych zatruć. Kobiety stosowały ją również w celu rozszerzania źrenic dla efektu kosmetycznego."
 theiler.42.f.aloin: "#V Aloina#! to naturalny związek występujący w różnych ilościach przede wszystkim w roślinach z rodzaju Aloe. Stosowano ją jako środek przeczyszczający, w leczeniu oparzeń słonecznych i opatrywaniu ran, a także ze względu na jej właściwości przeciwutleniające i przeciwzapalne."
 theiler.42.f.digitoxin: "#V Digitoksyna#! to naturalny związek występujący w Digitalis Purpurea, znanej również jako naparstnica purpurowa, roślinie występującej w całej Europie, a także w Maroku. Digitoksyna była stosowana w celu zmniejszenia zatrzymywania płynów w tkankach (puchliny), ułatwienia oddawania moczu oraz w leczeniu zaburzeń rytmu serca i niewydolności serca. Jak jednak sugeruje jej nazwa, ma właściwości toksyczne, które mogą prowadzić do nieregularnego rytmu serca, nudności, zatrzymania akcji serca, a nawet śmierci."
 theiler.42.f.quinine: "#V Chinina#! to lek po raz pierwszy wyizolowany z kory drzewa Cinchoha, pochodzącego z Peru. Chinina ma bogatą historię. Kora tego drzewa była początkowo stosowana przez lud Keczua jako środek rozluźniający mięśnie, a następnie została sprowadzona do Europy przez jezuitów, którzy wykorzystywali ją w leczeniu malarii. Chinina, otrzymywana z tej kory w procesie oczyszczania, szybko zyskała szerokie zastosowanie, umożliwiając Europejczykom dalszą kolonizację i podboje na kontynencie afrykańskim. Można ją również stosować w leczeniu szkarlatyny, żółtej febry i grypy."
 theiler.42.f.thymol: "#V Tymol#! to substancja lecznicza pozyskiwana przede wszystkim z Thymus vulgaris, czyli tymianku pospolitego, rośliny pochodzącej z Europy Południowej, choć występuje również w różnych innych roślinach na całym świecie. Ceniono go za właściwości przeciwdrobnoustrojowe, przeciwgrzybicze i antyseptyczne, dlatego powszechnie stosowano go do leczenia ran, higieny jamy ustnej oraz zwalczania pasożytów."
 theiler.42.f.pilocarpine: "#V Pilokarpina#! to lek pozyskiwany z roślin należących do rodzaju Pilocarpus, występujących w tropikalnych regionach Ameryki Południowej. Stosowano ją do pobudzania wydzielania śliny i potu, dlatego jest powszechnie wykorzystywana w leczeniu suchości w ustach spowodowanej różnymi schorzeniami lub będącej skutkiem ubocznym innego leczenia. Stosowano ją również w leczeniu różnych chorób oczu."
 theiler.42.f.ephedrine: "#V Efedryna#! to środek pobudzający pozyskiwany z rośliny Ephedra Sinica, pochodzącej z wyżynnych obszarów północnych Chin, Mongolii i Rosji. Stosowano ją w leczeniu astmy, narkolepsji, otyłości i niedrożności nosa. Wywołuje liczne skutki uboczne, w tym problemy ze snem, bóle głowy, niepokój, halucynacje, wysokie ciśnienie krwi i przyspieszone tętno. Dwa ostatnie działania sprawiły, że zaczęto ją stosować jako środek pobudzający poprawiający wyniki sportowe."
 theiler.42.f.strophantine: "#V Strofantyna#! to lek otrzymywany z roślin należących do rodzaju Strophantus, występujących w Afryce. Strofantynę stosowano w celu poprawy pracy serca, leczenia niewydolności serca i usprawnienia funkcjonowania układu nerwowego. W wysokich stężeniach wykorzystywano ją również do zatruwania strzał."
 theiler.42.g: "Kamień Milowy Farmacji!"
