 je_theiler_medicinal_plant_strychnine: "Strychnos Nux-Vomica"
 je_theiler_medicinal_plant_strychnine_reason: "Proces opracowywania nowego leku zazwyczaj przebiega następująco: w zależności od poziomu Technik Medycznych [concept_panum_physician] proponuje pozyskanie określonych [concept_ito_medicinal_plants] do celów leczniczych, w tym przypadku co najmniej #V 5 [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]#!. [concept_dubois_naturalist] otrzymuje zadanie zebrania wystarczającej liczby próbek do wyizolowania substancji czynnej. Następnie [concept_mendelejew_chemist] wyodrębnia tę substancję chemiczną. Po jej uzyskaniu [concept_theiler_biologist] może wyprodukować lek.\n\nStrychnos nux-vomica to tropikalne drzewo pochodzące z Indii i Azji Południowo-Wschodniej. Jego nasiona zawierają dwa silnie toksyczne alkaloidy: strychninę i brucynę. Strychnina oddziałuje na układ nerwowy, wywołując silne skurcze mięśni i mogąc doprowadzić do śmierci. Pomimo toksyczności wyciągi z tej rośliny stosowano dawniej w medycynie w małych, ściśle kontrolowanych dawkach jako środek pobudzający oraz w leczeniu zaburzeń trawiennych i nerwowych."
 je_theiler_medicinal_plant_strychnine_success: "[GetPlayer.GetName] ma w zbiorach co najmniej #V 5 okazów Strychnos Nux-Vomica#!."
