 theiler.11.t: "Mikroskop Achromatyczny"
 theiler.11.d: "[GetPlayer.MakeScope.Var('tesla_engineer_var').GetCharacter.GetFullName] i [GetPlayer.MakeScope.Var('theiler_biologist_var').GetCharacter.GetFullName] zaprezentowali dziś swój nowy mikroskop."
 theiler.11.f: "W 1868 roku Ernst Abbe wynalazł soczewkę apochromatyczną do mikroskopu, która eliminuje zarówno pierwotne, jak i wtórne zniekształcenia barwne. Do 1870 roku Abbe wynalazł kondensor Abbego, wykorzystywany do oświetlania preparatów pod mikroskopem. W 1871 roku zaprojektował pierwszy refraktometr, który opisał w broszurze opublikowanej w 1874 roku. Do 1872 roku opracował prawa obrazowania obiektów nieświecących. Zakłady Optyczne Zeissa rozpoczęły sprzedaż jego ulepszonych mikroskopów w 1872 roku. Oferta obejmowała modele z obiektywem immersyjnym o jednorodnej immersji, wprowadzone do 1877 roku, a także mikroskopy z obiektywami apochromatycznymi, wprowadzone w 1886 roku."
 theiler.11.g: "Rewolucja w Mikrobiologii."
 theiler.12.t: "Mikroskop Elektronowy"
 theiler.12.d: "[GetPlayer.MakeScope.Var('tesla_engineer_var').GetCharacter.GetFullName] i [GetPlayer.MakeScope.Var('theiler_biologist_var').GetCharacter.GetFullName] zaprezentowali dziś swój nowy mikroskop."
 theiler.12.f: "Do dziś kwestia tego, kto wynalazł transmisyjny mikroskop elektronowy, pozostaje przedmiotem sporów. W 1928 roku Adolf Matthias powierzył Maxowi Knollowi kierowanie zespołem badawczym w Technische Hochschule w Charlottenburgu, którego zadaniem było rozwijanie badań nad wiązkami elektronów i oscyloskopami katodowymi. W skład zespołu wchodziło kilku doktorantów, w tym Ernst Ruska. W 1931 roku Max Knoll i Ernst Ruska z powodzeniem uzyskali powiększone obrazy siatek umieszczonych nad otworem w anodzie. Niezależnie od tych prac podobne badania prowadził Reinhold Rüdenberg w zakładach Siemens-Schuckert. Zgodnie z prawem patentowym to on jest uznawany za wynalazcę mikroskopu elektronowego, jednak nie jest jasne, kiedy dysponował działającym urządzeniem."
 theiler.12.g: "Podobno ma nawet umożliwiać wykrywanie wirusów!"
