 theiler_cell_culture_tech: "Hodowla Komórkowa"
 theiler_cell_culture_tech_desc: "Hodowla komórkowa polega na namnażaniu komórek zwierzęcych lub roślinnych w pożywce odżywczej poza organizmem. W 1885 roku Wilhelm Roux jako pierwszy z powodzeniem utrzymał komórki zarodkowe kurczaka w roztworze soli fizjologicznej przez kilka dni, demonstrując w ten sposób podstawową zasadę tej metody. W 1907 roku Ross Granville Harrison prowadził hodowlę rdzenia kręgowego płazów i wykazał, że aksony rozwijają się jako wypustki poszczególnych komórek nerwowych. W 1913 roku Edna Steinhardt, Chai Israeli i Robert A. Lambert wyhodowali wirusa krowianki na fragmentach rogówki świnki morskiej."
 theiler.51.t: "Badania nad Patogenami"
 theiler.51.d: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] postanowił dokładniej zbadać niebezpieczny patogen, aby zdobyć nową wiedzę na temat tej plagi ludzkości. Projekt badawczy jest nadal otwarty."
 theiler.51.f: "Badanie patogenu, obejmujące jego odkrycie i wyizolowanie, jest ważnym krokiem w kierunku opracowania skutecznej szczepionki. Zbadanie konkretnego patogenu wymaga opisu choroby, mikroskopu achromatycznego lub mikroskopu elektronowego (w zależności od tego, czy jest to bakteria, czy wirus) oraz określonej liczby znanych mikroorganizmów. Ostatecznie biolog musi być w stanie rozpoznać drobnoustrój."
