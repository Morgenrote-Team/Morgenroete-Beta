 theiler.101.t: "Vibrio Cholerae"
 theiler.101.d: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] zdołał zidentyfikować i wyizolować patogen cholery. To ważny krok na drodze do rozpoczęcia prac nad skuteczną szczepionką."
 theiler.101.f: "Bakteria Vibrio cholerae została po raz pierwszy opisana przez włoskiego anatoma Filippa Paciniego w 1854 roku, jednak jej rolę w epidemiach cholery potwierdził później Robert Koch w 1884 roku. Jest to zakrzywiona bakteria o pałeczkowatym kształcie, rozwijająca się w środowisku wodnym, szczególnie w ciepłych wodach słonawych. V. cholerae jest bakterią Gram-ujemną, posiada pojedynczą wić biegunową umożliwiającą poruszanie się i wydziela toksynę choleryczną, która zaburza równowagę wodną w jelitach i powoduje ciężką biegunkę."
 theiler.101.g: "Ależ paskudztwo."
 theiler.201.t: "Mycobacterium Tuberculosis"
 theiler.201.d: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] zdołał zidentyfikować i wyizolować patogen gruźlicy. To ważny krok na drodze do rozpoczęcia prac nad skuteczną szczepionką."
 theiler.201.f: "Bakterię tę zidentyfikował Robert Koch w 1882 roku, a za swoje odkrycia otrzymał Nagrodę Nobla w 1905 roku. M. tuberculosis to wolno rosnąca bakteria o pałeczkowatym kształcie. Jej woskowata ściana komórkowa, bogata w kwasy mykolowe, sprawia, że nie poddaje się standardowemu barwieniu metodą Grama i jest odporna na wiele antybiotyków. Zalicza się ją do bakterii kwasoodpornych. Patogen ten jest bezwzględnym tlenowcem i atakuje przede wszystkim płuca, choć może rozprzestrzeniać się również na inne narządy."
 theiler.201.g: "Twój czas dobiegł końca, milczący prześladowco."
 theiler.301.t: "Orthopoxvirus Variolae"
 theiler.301.d: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] zdołał zidentyfikować i wyizolować patogen ospy prawdziwej. Długo po przeprowadzeniu pierwszego szczepienia czynnik wywołujący chorobę można wreszcie obserwować i sklasyfikować."
 theiler.301.f: "Czynnikiem wywołującym ospę prawdziwą jest wirus Variola, należący do rodziny Poxviridae. W przeciwieństwie do większości wirusów namnaża się on wyłącznie w cytoplazmie komórek gospodarza. Jest to duży wirus o kształcie cegiełki, zawierający dwuniciowe DNA. Wirus Variola był celem pierwszego skutecznego szczepienia, wprowadzonego przez Edwarda Jennera w 1796 roku, a w 1980 roku stał się pierwszym ludzkim patogenem, który został wyeliminowany dzięki szczepieniom."
 theiler.301.g: "Jak coś tak małego mogło obalić imperia?"
 theiler.401.t: "Rickettsia Prowazekii"
 theiler.401.d: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] zdołał zidentyfikować i wyizolować patogen tyfusu. To ważny krok na drodze do rozpoczęcia prac nad skuteczną szczepionką."
 theiler.401.f: "Henrique da Rocha Lima odkrył tę bakterię w 1916 roku. Nazwał ją na cześć swojego kolegi Stanislausa von Prowazeka, który zmarł na tyfus w 1915 roku. Zarówno Prowazek, jak i Rocha Lima zarazili się tyfusem podczas badania czynnika wywołującego tę chorobę w szpitalu obozu jenieckiego w Cottbus w Niemczech. Bakteria ta nie posiada wici i jest tlenowcem. Zaliczana jest do bakterii Gram-ujemnych, ponieważ jej ściana komórkowa nie zatrzymuje fioletu krystalicznego stosowanego w barwieniu metodą Grama. Bakterie Gram-ujemne są na ogół bardziej odporne na wiele antybiotyków, takich jak penicylina."
 theiler.401.g: "Mały, ponury pasażer na gapę!"
 theiler.501.t: "Orthoflavivirus Flavi"
 theiler.501.d: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] zdołał zidentyfikować i wyizolować patogen żółtej febry. To ważny krok na drodze do rozpoczęcia prac nad skuteczną szczepionką."
 theiler.501.f: "Wirus żółtej febry został po raz pierwszy wyizolowany w 1927 roku od pacjenta w Ghanie. Należy do rodziny Flaviviridae i posiada genom RNA o pojedynczej nici i dodatniej polarności. Wirus jest przenoszony przez komary z rodzaju Aedes, przede wszystkim Aedes aegypti. Zakażenie może powodować gorączkę, bóle mięśni i żółtaczkę, a w ciężkich przypadkach prowadzi do krwotoków i niewydolności narządów."
 theiler.501.g: "Odkryto jedną z najokrutniejszych sztuczek natury."
 theiler.601.t: "Measles Morbillivirus"
 theiler.601.d: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] zdołał zidentyfikować i wyizolować patogen odry. To ważny krok na drodze do rozpoczęcia prac nad skuteczną szczepionką."
 theiler.601.f: "Wirus odry należy do rodzaju Morbillivirus w obrębie rodziny Paramyxoviridae. Jest wirusem otoczkowym, posiadającym jednoniciowy genom RNA o ujemnej polarności. Do zakażenia dochodzi drogą kropelkową, a wirus ten należy do najbardziej zaraźliwych patogenów znanych człowiekowi. Odra powoduje gorączkę, kaszel, zapalenie spojówek i charakterystyczną wysypkę, a także może prowadzić do ciężkich powikłań, takich jak zapalenie płuc lub zapalenie mózgu."
 theiler.601.g: "Mały terrorysta przeprowadzający ataki na układ odpornościowy."
 theiler.701.t: "Streptococcus Pyogenes"
 theiler.701.d: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] zdołał zidentyfikować i wyizolować patogen szkarlatyny. To ważny krok na drodze do rozpoczęcia prac nad skuteczną szczepionką."
 theiler.701.f: "Bakteria Streptococcus pyogenes to Gram-dodatnia bakteria kulista, występująca w łańcuszkach. Zaliczana jest do paciorkowców β-hemolizujących grupy A, a jej związek ze szkarlatyną został po raz pierwszy opisany w XIX wieku. Jej zjadliwość wynika z wydzielanych egzotoksyn, w tym toksyny erytrogennej odpowiedzialnej za powstawanie wysypki. Drobnoustrój ten wywołuje również paciorkowcowe zapalenie gardła, liszajec zakaźny i gorączkę reumatyczną."
 theiler.701.g: "Co za przebiegły mały łobuz..."
 theiler.801.t: "Yersinia Pestis"
 theiler.801.d: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] zdołał zidentyfikować i wyizolować patogen dżumy. To ważny krok na drodze do rozpoczęcia prac nad skuteczną szczepionką."
 theiler.801.f: "Yersinia pestis została odkryta przez Alexandre'a Yersina w 1894 roku podczas epidemii w Hongkongu. Jest Gram-ujemną, nieruchliwą bakterią o kształcie pałeczkowato-kulistym. Bakteria jest przenoszona przez pchły żerujące na zakażonych gryzoniach, przede wszystkim na szczurach wędrownych. Wywołuje trzy postacie dżumy: dymieniczą, posocznicową i płucną. Bez leczenia śmiertelność jest niezwykle wysoka."
 theiler.801.g: "A więc to mikroskopijny Żniwiarz Śmierci?"
 theiler.901.t: "Corynebacterium diphtheriae"
 theiler.901.d: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] zdołał zidentyfikować i wyizolować patogen błonicy. To ważny krok na drodze do rozpoczęcia prac nad skuteczną szczepionką."
 theiler.901.f: "Ta Gram-dodatnia bakteria o maczugowatym kształcie została zidentyfikowana jako czynnik wywołujący błonicę przez Edwina Klebsa w 1883 roku, a rok później Friedrich Löffler wyhodował ją w warunkach laboratoryjnych. C. diphtheriae jest bakterią tlenową i nieruchliwą. Jej najgroźniejszą cechą jest toksyna błonicza, kodowana przez bakteriofaga, która uszkadza tkanki serca i układu nerwowego. Błonica była niegdyś jedną z głównych przyczyn zgonów wśród dzieci, ale obecnie jest kontrolowana dzięki szczepieniom."
 theiler.901.g: "Pozornie prosta, a zarazem bezlitośnie okrutna."
 theiler.1001.t: "Poliovirus"
 theiler.1001.d: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] zdołał zidentyfikować i wyizolować patogen polio. To ważny krok na drodze do rozpoczęcia prac nad skuteczną szczepionką."
 theiler.1001.f: "Poliowirus należy do rodziny Picornaviridae i został po raz pierwszy wyizolowany w 1909 roku. Jest to niewielki wirus bezotoczkowy, posiadający jednoniciowy genom RNA o dodatniej polarności. Wirus przenosi się głównie drogą fekalno-oralną i atakuje neurony ruchowe w rdzeniu kręgowym, niekiedy prowadząc do nieodwracalnego paraliżu. Światowe kampanie szczepień doprowadziły do tego, że poliowirus znalazł się na progu eradykacji."
 theiler.1001.g: "Jak coś niewidzialnego może siać tak wielkie spustoszenie?"
 theiler.102.t: "Szczepionka przeciwko Cholerze"
 theiler.102.d: "Po licznych eksperymentach, niepowodzeniach i próbach Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] dokonał przełomu: szczepionka przeciwko cholerze nie jest już jedynie marzeniem, lecz rzeczywistością. Rewolucja Medyczna i Biologiczna!"
 theiler.102.f: "Pierwsza szczepionka przeciwko cholerze została opracowana w 1885 roku przez hiszpańskiego lekarza Jaime Ferrána, który wykorzystał żywe, atenuowane szczepy Vibrio cholerae. Jego próby terenowe przeprowadzone podczas epidemii w Walencji stanowiły jeden z najwcześniejszych przykładów masowych szczepień przeciwko chorobie bakteryjnej. Późniejsze szczepionki opierały się na preparatach zawierających całe, zabite komórki bakterii, a ostatecznie opracowano nowoczesne szczepionki doustne łączące zabite bakterie z rekombinowaną podjednostką B toksyny cholerycznej."
 theiler.102.g: "Nauka Kontratakuje"
 theiler.202.t: "Szczepionka przeciwko Gruźlicy"
 theiler.202.d: "Po licznych eksperymentach, niepowodzeniach i próbach Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] dokonał przełomu: szczepionka przeciwko gruźlicy nie jest już jedynie marzeniem, lecz rzeczywistością. Rewolucja Medyczna i Biologiczna!"
 theiler.202.f: "Szczepionka Bacillus Calmette-Guérin (BCG) została wprowadzona w 1921 roku przez francuskich naukowców Alberta Calmette'a i Camille'a Guérina. Oparta jest na żywym, atenuowanym szczepie Mycobacterium bovis, bakterii spokrewnionej z M. tuberculosis. Szczepionka zapewnia zróżnicowaną ochronę przed gruźlicą płuc, ale jest bardzo skuteczna w zapobieganiu ciężkim postaciom gruźlicy u dzieci, takim jak gruźlica prosówkowa i gruźlicze zapalenie opon mózgowo-rdzeniowych."
 theiler.202.g: "Iskra Obrony przed Cichym Prześladowcą"
 theiler.402.t: "Szczepionka przeciwko Tyfusowi"
 theiler.402.d: "Po licznych eksperymentach, niepowodzeniach i próbach Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] dokonał przełomu: szczepionka przeciwko tyfusowi nie jest już jedynie marzeniem, lecz rzeczywistością. Rewolucja Medyczna i Biologiczna!"
 theiler.402.f: "Pierwsza skuteczna szczepionka przeciwko tyfusowi została opracowana w latach 30. XX wieku przez polskiego biologa Rudolfa Weigla. Hodował on Rickettsia prowazekii wewnątrz jelit wszy i wykorzystywał inaktywowane bakterie do uodparniania. Podczas II wojny światowej jego laboratorium we Lwowie potajemnie wykorzystywało produkcję szczepionek do zapewniania schronienia i zatrudnienia osobom zagrożonym prześladowaniami nazistowskimi. Współcześnie szczepionki przeciwko tyfusowi epidemicznemu są rzadko stosowane."
 theiler.402.g: "Przechytrzyliśmy pasażera na gapę."
 theiler.502.t: "Szczepionka przeciwko Żółtej Febrze"
 theiler.502.d: "Po licznych eksperymentach, niepowodzeniach i próbach Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] dokonał przełomu: szczepionka przeciwko żółtej febrze nie jest już jedynie marzeniem, lecz rzeczywistością. Rewolucja Medyczna i Biologiczna!"
 theiler.502.f: "Szczepionka przeciwko żółtej febrze została opracowana w latach 30. XX wieku przez południowoafrykańskiego wirusologa Maxa Theilera, który później otrzymał Nagrodę Nobla w 1951 roku. Osłabił on wirusa poprzez jego wielokrotne pasażowanie w zarodkach kurzych, uzyskując szczep 17D. Ta żywa, atenuowana szczepionka pozostaje jedną z najskuteczniejszych szczepionek, jakie kiedykolwiek opracowano, zapewniając długotrwałą odporność już po podaniu jednej dawki."
 theiler.502.g: "Cios wymierzony w chorobę przenoszoną przez komary"
 theiler.602.t: "Szczepionka przeciwko Odrze"
 theiler.602.d: "Po licznych eksperymentach, niepowodzeniach i próbach Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] dokonał przełomu: szczepionka przeciwko odrze nie jest już jedynie marzeniem, lecz rzeczywistością. Rewolucja Medyczna i Biologiczna!"
 theiler.602.f: "Szczepionka przeciwko odrze została dopuszczona do użytku w 1963 roku. Opracował ją John Enders wraz ze współpracownikami po tym, jak udało im się wyhodować wirusa w komórkach zarodków kurzych. Żywa, atenuowana szczepionka znacznie zmniejszyła liczbę zgonów z powodu odry na całym świecie. Później połączono ją ze szczepionkami przeciwko śwince i różyczce, tworząc szczepionkę MMR, która pozostaje podstawą rutynowych szczepień ochronnych dzieci."
 theiler.602.g: "Mały potwór wreszcie trafił na godnego przeciwnika."
 theiler.802.t: "Szczepionka przeciwko Dżumie"
 theiler.802.d: "Po licznych eksperymentach, niepowodzeniach i próbach Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] dokonał przełomu: szczepionka przeciwko dżumie nie jest już jedynie marzeniem, lecz rzeczywistością. Rewolucja Medyczna i Biologiczna!"
 theiler.802.f: "Pierwsza szczepionka przeciwko dżumie została wprowadzona w 1897 roku przez Waldemara Haffkine'a, który pracował w Bombaju podczas epidemii. Do przygotowania szczepionki podawanej w zastrzyku wykorzystał bakterie Yersinia pestis zabite przez ogrzewanie. Chociaż szczepionka zmniejszała śmiertelność, zapewniana przez nią ochrona była ograniczona i krótkotrwała. Nowsze badania koncentrują się na szczepionkach podjednostkowych ukierunkowanych na antygeny F1 i V tej bakterii."
 theiler.802.g: "Nadeszła ostatnia godzina Żniwiarza!"
 theiler.902.t: "Szczepionka przeciwko Błonicy"
 theiler.902.d: "Po licznych eksperymentach, niepowodzeniach i próbach Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] dokonał przełomu: szczepionka przeciwko błonicy nie jest już jedynie marzeniem, lecz rzeczywistością. Rewolucja Medyczna i Biologiczna!"
 theiler.902.f: "Szczepionka przeciwko błonicy zawierająca toksoid została opracowana w latach 20. XX wieku, po tym jak Gaston Ramon we Francji i Alexander Glenny w Anglii odkryli, że toksyna błonicza poddana działaniu formaldehydu może wywołać odporność bez powodowania choroby. Szczepionka ta, często łączona z antygenami tężca i krztuśca (szczepionka DTP), drastycznie zmniejszyła śmiertelność wśród dzieci w połowie XX wieku."
 theiler.902.g: "Nocne świszczenie dobiegło końca."
 theiler.1002.t: "Szczepionka przeciwko Polio"
 theiler.1002.d: "Po licznych eksperymentach, niepowodzeniach i próbach Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] dokonał przełomu: szczepionka przeciwko polio nie jest już jedynie marzeniem, lecz rzeczywistością. Rewolucja Medyczna i Biologiczna!"
 theiler.1002.f: "W XX wieku opracowano dwie skuteczne szczepionki przeciwko polio. Jonas Salk opracował inaktywowaną szczepionkę przeciwko polio (IPV) w 1955 roku, wykorzystując poliowirusy inaktywowane chemicznie. Kilka lat później Albert Sabin wprowadził doustną szczepionkę przeciwko polio (OPV), opartą na żywych, atenuowanych szczepach, którą łatwiej było podawać i która zapewniała odporność jelitową. Obie szczepionki odegrały kluczową rolę w światowych działaniach na rzecz wyeliminowania polio."
 theiler.1002.g: "Bez litości dla tego mordercy dziecięcych marzeń!"
 theiler_microbiological_institute_modifier: "Instytut Mikrobiologiczny"
 theiler_microbiological_promotion_modifier: "Rozwój Mikrobiologii"
 theiler_military_vaccine_modifier: "Szczepionka Wojskowa"
 theiler_failed_vaccine_experiment_modifier: "Nieudany Eksperyment ze Szczepionką"
 theiler_vaccine_guinea_pigs_modifier: "Króliki Doświadczalne do Testów Szczepionek"
 theiler_vaccine_subsidy_modifier: "Dofinansowanie Szczepionek"
 theiler.2101.t: "Instytut Mikrobiologiczny"
 theiler.2101.d: "Intensywne badania nad patogenem skłoniły czołowych uczonych z zespołu pod kierownictwem [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] do założenia instytutu mikrobiologii, aby usprawnić dalsze badania."
 theiler.2101.f: "Po sukcesach w identyfikacji patogenów (wąglika w 1876 roku, gruźlicy w 1882 roku i cholery w 1884 roku) Robert Koch otrzymał wsparcie rządu pruskiego na utworzenie własnego instytutu. Był to pierwszy ośrodek badawczy prowadzący systematyczne, zorganizowane badania nad drobnoustrojami jako przyczyną chorób. Już „Laboratoire de Chimie Physiologique” Louisa Pasteura w Paryżu (od 1887 roku) miało charakter takiej placówki badawczej. Oficjalnie jednak to Instytut Roberta Kocha (1891) uznaje się za pierwszy instytut mikrobiologiczny we współczesnym rozumieniu tego pojęcia."
 theiler.2101.g: "Instytut powinien zajmować się badaniami ogólnymi."
 theiler.2101.h: "Instytut powinien zajmować się badaniami nad patogenami."
 theiler.2102.t: "Udoskonalona Metoda Laboratoryjna"
 theiler.2102.d: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] zmodernizował wyposażenie laboratorium mikrobiologicznego i wprowadził nowe barwniki oraz udoskonalone mikroskopy, co doprowadziło do przełomu w badaniach nad patogenami."
 theiler.2102.f: "Od lat 60. XIX wieku syntetyczne barwniki anilinowe rewolucjonizowały mikrobiologię. Błękit metylenowy, fuksyna, a później metody barwienia Grama (1884) i Ziehla-Neelsena po raz pierwszy umożliwiły różnicowanie bakterii. Około 1900 roku wprowadzono specjalne metody barwienia przetrwalników, otoczek i maczugowców błonicy; od 1920 roku upowszechniły się barwienie metodą Giemsy oraz metody srebrzenia, a w latach 40. XX wieku pojawiły się pierwsze metody fluorescencyjne."
 theiler.2102.g: "Dobrze."
 theiler.2103.t: "Współpraca Międzynarodowa"
 theiler.2103.d: "Dr. [SCOPE.sCharacter('theiler_biologist_scopet').GetLastName] z kraju [SCOPE.sCountry('theiler_country_scope').GetName] napisał list. Biolog ten, przyjaciel Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName], przekazał kilka wskazówek pomocnych w [ROOT.Var('theiler_biologist_var').GetCharacter.GetHerHis] badaniach nad patogenami."
 theiler.2103.f: "Od 1885 roku japoński lekarz Shibasaburo Kitasato pracował w berlińskim instytucie Roberta Kocha. Pod jego kierunkiem uzyskał w 1889 roku pierwszą czystą hodowlę patogenu wywołującego tężec, co stanowiło kamień milowy w bakteriologii. Wspólnie położyli podwaliny pod terapię surowicą, którą później stosowano w leczeniu tężca i błonicy. Ich współpracę uznaje się za wczesny przykład udanej międzynarodowej współpracy naukowej."
 theiler.2103.g: "To przyspieszy badania nad patogenami."
 theiler.2103.h: "Ta wiedza pozwala nam lepiej zrozumieć badane zjawiska."
 theiler.2104.t: "Wypadek w Laboratorium"
 theiler.2104.d: "Podczas poszukiwań patogenu doszło do poważnego incydentu — wskutek niedostatecznych środków bezpieczeństwa nasi badacze ulegli zakażeniu. Wielu pracowników musi zostać objętych kwarantanną, a prace naukowe mogą zostać zakłócone na wiele miesięcy."
 theiler.2104.f: "Praca z patogenami była niezwykle ryzykowna. Wielu mikrobiologów uległo zakażeniu podczas badań: Robert Koch wielokrotnie zarażał się wąglikiem i gruźlicą, Emil von Behring zakaził się podczas eksperymentów z toksyną błoniczą, a Max von Pettenkofer połknął bakterie cholery, aby sprawdzić swoją teorię. Środki ochronne były bardzo prymitywne, przez co wielu badaczy przechodziło zakażenia o przebiegu od łagodnego po ciężki. Doświadczenia te przyczyniły się później do opracowania nowoczesnych standardów bezpieczeństwa laboratoryjnego."
 theiler.2104.g: "Katastrofa!"
 theiler.2104.h: "Musimy za wszelką cenę zreorganizować laboratorium!"
 theiler.2105.t: "Zanieczyszczone Próbki"
 theiler.2105.d: "Jak się okazało, część próbek, nad którymi pracował zespół naukowy pod kierownictwem doktora [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName], była zanieczyszczona, co niestety opóźniło poszukiwania patogenu."
 theiler.2105.f: "Podczas badań nad wąglikiem, gruźlicą czy błonicą często dochodziło do zanieczyszczenia materiału pleśnią, innymi bakteriami lub nieczystymi próbkami surowicy. Problem ten dotykał również wczesnych eksperymentów Pasteura nad szczepionkami. Takie zanieczyszczenia prowadziły do błędnych wniosków na temat patogenów i znacznie przyczyniły się do rozwoju technik uzyskiwania czystych hodowli, sterylizacji oraz procedur aseptycznych. Badania nad hodowlami komórkowymi zmniejszają prawdopodobieństwo takiego incydentu."
 theiler.2105.g: "Który uczony był za to odpowiedzialny?"
 theiler.2106.t: "Spór Badaczy"
 theiler.2106.d: "Wśród czołowych uczonych wybuchł spór dotyczący poszukiwań patogenów. Dr. [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], jeden z najwybitniejszych lekarzy naszego kraju, w dyskusji z Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] skrytykował dotychczasowe odkrycia swojego rozmówcy. [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] twierdzi, że biolog podąża całkowicie błędnym tropem. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] utrzymuje natomiast, że lekarz nie ma najmniejszego pojęcia o tym zagadnieniu."
 theiler.2106.f: "'Pańskie eksperymenty cuchną gorzej niż szalka Petriego po dwóch tygodniach!'\n'A pan rozpoznaje choroby równie trafnie, co rzut monetą!'\n'Proszę pana, ja ratuję życie, podczas gdy pan głaszcze bakterie niczym domowe zwierzątka!'\n'Ha! Lepsze zwierzątka niż pacjenci, którzy w panice łykają pańskie pigułki!'\nMaruderze spod mikroskopu!'\n'Sodomito ze stetoskopem!'"
 theiler.2106.g: "Dr. [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] ma rację."
 theiler.2106.h: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] ma rację."
 theiler.2106.i: "Powinni prowadzić badania, a nie się kłócić!"
 theiler.2107.t: "Asystenci Badawczy"
 theiler.2107.d: "Nasz biolog Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] zaproponował oddelegowanie części studentów i asystentów z uczelni do laboratorium, aby wsparli [ROOT.Var('theiler_biologist_var').GetCharacter.GetHerHis] badania."
 theiler.2107.f: "'Możemy zrujnować im kariery, ale cóż, wszystko w imię NAUKI!'"
 theiler.2107.g: "Zatrudnij dodatkowych asystentów."
 theiler.2107.h: "Młodzi uczeni są potrzebni gdzie indziej."
 theiler.2111.t: "Wojskowe Zastosowanie Szczepionek"
 theiler.2111.d: "Szczepionka, nad którą pracuje Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName], przyniosła już znaczące sukcesy. Wojsko wykazuje nią duże zainteresowanie, widząc w niej sposób na zapewnienie zdrowia żołnierzom i ograniczenie strat w kolejnej wojnie."
 theiler.2111.f: "Szczepienia zapewniały decydującą przewagę na wojnie: wojska brytyjskie w Indiach stosowały wariolizację i szczepienia przeciw ospie prawdziwej, co chroniło je przed epidemiami. Podobnie szczepienia przeciw żółtej febrze w strefach tropikalnych na początku XX wieku ograniczały straty spowodowane epidemiami. Zaszczepieni żołnierze pozostawali zdolni do służby, podczas gdy choroby osłabiały niezaszczepione oddziały — szczepionki działały zatem niczym broń strategiczna."
 theiler.2111.g: "Wojsko ma pierwszeństwo w szczepieniach."
 theiler.2111.h: "Wykorzystaj wiedzę zdobytą podczas tego badania terenowego, aby udoskonalić szczepionkę."
 theiler.2112.t: "Szczęśliwe Odkrycie"
 theiler.2112.d: "Asystent niespodziewanie znalazł w słoju na odpady próbkę zawierającą zaskakująco skuteczny preparat."
 theiler.2112.f: "Louis Pasteur odkrył, że 'stara' hodowla bakterii wywołujących cholerę drobiu nie powodowała choroby u kur. Ten przypadek doprowadził do opracowania szczepionki zawierającej osłabione drobnoustroje, która zapewniała ochronę przed zakażeniem. Jonas Salk wykorzystał odkrycie, że wirusy polio można namnażać w hodowlach komórkowych i jednocześnie inaktywować. Doprowadziło to do powstania pierwszej bezpiecznej szczepionki przeciw polio. Alexander Fleming przypadkowo zauważył, że pleśń zabija bakterie, co doprowadziło do odkrycia penicyliny."
 theiler.2112.g: "Nagrodź asystenta."
 theiler.2113.t: "Udana Próba"
 theiler.2113.d: "Pierwsza próba nowej szczepionki wykazała jej niespodziewanie wysoką skuteczność. Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] rozważa znacznie wcześniejsze rozpoczęcie masowej produkcji i szczepień na szeroką skalę. To radosny dzień dla wakcynologii!"
 theiler.2113.f: "Znakomitym przykładem udanej próby pilotażowej szczepionki są szczepionki przeciw cholerze i dżumie opracowane przez Waldemara Haffkine’a pod koniec XIX wieku. Haffkine, rosyjski mikrobiolog żydowskiego pochodzenia, przeprowadził w Indiach w 1892 roku pierwsze badania kliniczne szczepionki przeciw cholerze, którą później stosowano na szeroką skalę. W 1897 roku opracował szczepionkę przeciw dżumie, którą przetestowano w Indiach w 1898 roku i która doprowadziła do znacznego spadku liczby zgonów. Jego prace uznaje się za kamień milowy w rozwoju nowoczesnych szczepionek."
 theiler.2113.g: "Wielki krok naprzód w rozwoju szczepionek!"
 theiler.2113.h: "To nowe wskazówki dla badań medycznych."
 theiler.2114.t: "Nieoczekiwane Skutki Uboczne"
 theiler.2114.d: "W mieście [SCOPE.sState('theiler_state_scope').GetCityHubName] nowa szczepionka opracowana przez Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] wywołała poważne skutki uboczne. Wielu uczestników badania ciężko zachorowało, a niektórzy nawet zmarli. Próba nie tylko zachwiała zaufaniem społeczeństwa, lecz także może znacznie opóźnić prace nad szczepionką."
 theiler.2114.f: "W latach 30. XX wieku w Lubece doszło do tragicznego incydentu związanego ze szczepieniami: 251 noworodków otrzymało szczepionkę BCG przeciw gruźlicy, która wskutek błędów produkcyjnych była zanieczyszczona zjadliwymi prątkami gruźlicy. Zachorowało 208 dzieci, a 77 zmarło. 'Lübecker Impfunglück' (tragedia szczepień w Lubece) wywołała publiczny skandal, opóźniła wprowadzenie szczepionki BCG w Niemczech i doprowadziła do zaostrzenia standardów bezpieczeństwa przy produkcji szczepionek."
 theiler.2114.g: "Kto mógł to przewidzieć?"
 theiler.2114.h: "Mimo to kontynuuj eksperymenty w tym rejonie."
 theiler.2115.t: "Zarzut Plagiatu"
 theiler.2115.d: "Zagraniczny biolog z kraju [SCOPE.sCountry('theiler_country_scope').GetName] dokładnie zbadał sposób produkcji nowej szczepionki, nad którą obecnie pracuje Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName]. [SCOPE.sCharacter('theiler_biologist_scope').GetSheHe] wysuwa poważne zarzuty: [SCOPE.sCharacter('theiler_biologist_scope').GetSheHe] twierdzi, że jest to plagiat bardzo podobnej surowicy, którą Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] zamierzał opatentować."
 theiler.2115.f: "W XIX i na początku XX wieku brak ochrony patentowej i międzynarodowych standardów prowadził do sporów o autorstwo odkryć w wakcynologii. Pasteur przypisywał sobie zasługi za opracowanie szczepionki przeciw cholerze bydła, choć jego współpracownik Toussaint prowadził eksperymenty wcześniej. Później kontrowersje wzbudzały szczepy BCG oraz szczepionki Haffkine’a przeciw cholerze i dżumie. Spory o pierwszeństwo i 'plagiat' były typowe dla epoki, w której metody szczepień stanowiły niezwykle cenną i pilnie strzeżoną wiedzę."
 theiler.2115.g: "Przeproś."
 theiler.2115.h: "To zwykły zbieg okoliczności."
 theiler.2116.t: "Gwałtowny Wzrost Kosztów"
 theiler.2116.d: "Wygląda na to, że Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] nie doszacował kosztów nowej szczepionki. [SCOPE.sCharacter('theiler_biologist_scope').GetHerHis|U] optymistyczne szacunki mogą teraz zagrozić całemu procesowi jej opracowywania."
 theiler.2116.f: "'Pieniądze? Pieniądze?! Brudna mamona! Czy nie macie pojęcia, że poświęcam życie nauce? Przecież chodzi o ostateczne zwycięstwo nad śmiercią! O wykorzenienie plagi ludzkości! A wy macie czelność przychodzić do mnie z wykazami, tabelami i bilansami? Kim jesteście? Księgowymi? Wynoście się z mojego laboratorium!'"
 theiler.2116.g: "Dofinansowuje nową szczepionkę."
 theiler.2116.h: "Zatrudnij więcej uczonych jako pracowników tymczasowych."
 theiler.2116.i: "Poradź sobie z tym."
 theiler_state_trait_cochliomyia: "Cochliomyia hominivorax"
 theiler_state_trait_cydia: "Cydia pomonella"
 je_theiler_cochliomyia_eredication: "Wytępienie Cochliomyia"
 je_theiler_cochliomyia_eredication_reason: "Dzięki najnowocześniejszym dostępnym metodom wytępienie niebezpiecznej muchówki Cochliomyia hominivorax może okazać się możliwe, uwalniając ludzi i zwierzęta od tej plagi. Biolog może opracować teorię i przeprowadzić eksperymenty terenowe, aby znaleźć odpowiednie rozwiązanie tego problemu.\n\nJeśli biolog umrze w trakcie prac, działania zmierzające do wytępienia pasożyta zostaną wstrzymane, lecz będą wznowione, gdy tylko znów będzie dostępny biolog."
 je_theiler_cochliomyia_eredication_success: "[concept_theiler_biologist] pracuje od co najmniej #ORANGE 12 miesięcy#! nad znalezieniem metody wytępienia Cochliomyia."
 je_theiler_cochliomyia_eredication_goal: ""
 theiler.21.t: "Technika Sterylnych Owadów"
 theiler.21.d: "Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] opracował niekonwencjonalny, lecz przełomowy pomysł: zamiast zwalczać pasożyty pestycydami, obiecującą metodą byłoby wyhodowanie bezpłodnych samców, z którymi samice nie mogłyby wydać potomstwa."
 theiler.21.f: "Technika Sterylnych Owadów (SIT) została opracowana w latach 50. XX wieku przez Raymonda C. Bushlanda i Edwarda F. Kniplinga. Samce muchówek poddaje się sterylizacji promieniowaniem gamma, którego źródłem jest zazwyczaj kobalt-60 lub cez-137. To wysokoenergetyczne promieniowanie niszczy DNA w komórkach rozrodczych, nie wpływając znacząco na żywotność owadów ani ich zdolność do kopulacji. Wysterylizowane samce są następnie masowo wypuszczane na wolność. Ponieważ nadal skutecznie kojarzą się z dzikimi samicami, lecz nie dają zdolnego do życia potomstwa, populacja stopniowo zanika. Metoda ta okazała się szczególnie skuteczna w zwalczaniu muchówki Cochliomyia hominivorax, której wytępienie w Ameryce Północnej i Środkowej zapobiegło ogromnym stratom gospodarczym i szkodom w hodowli zwierząt."
 theiler.21.g: "Dosłownie potraktujemy je atomem?"
 theiler.22.t: "Wytępienie Cochliomyia w regionie [SCOPE.sState('theiler_state_scope').GetName]"
 theiler.22.d: "Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] donosi, że muchówka Cochliomyia hominivorax została wytępiona w kolejnym regionie."
 theiler.22.g: "Do diabła z robalami!"
 theiler_cochliomyia_experiment_lab_modifier: "Laboratorium Doświadczalne Cochliomyia"
 je_theiler_sti: "Technika Sterylnych Owadów"
 je_theiler_sti_reason: "Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] próbuje wytępić muchówkę Cochliomyia hominivorax w jednym z regionów przy użyciu nowoczesnej technologii."
 je_theiler_sti_success: "[concept_theiler_biologist] pracuje od co najmniej #ORANGE 36 miesięcy#! nad wytępieniem Cochliomyia."
 je_theiler_sti_goal: ""
 je_theiler_cydia_pesticide: "Pestycyd przeciw Cydia"
 je_theiler_cydia_pesticide_reason: "Dysponując podstawową wiedzą o środkach owadobójczych, biolog we współpracy z chemikiem może znaleźć skuteczny środek przeciw owocówce jabłkóweczce.\n\nJeśli biolog lub chemik umrze w trakcie prac, badania nad pestycydem zostaną wstrzymane, lecz będą wznowione, gdy tylko obaj uczeni znów będą dostępni."
 je_theiler_cydia_pesticide_success: "[concept_theiler_biologist] pracuje od co najmniej #ORANGE 12 miesięcy#! nad nowym pestycydem."
 je_theiler_cydia_pesticide_goal: ""
 je_theiler_lead_arsenate: "Arsenian Ołowiu"
 je_theiler_lead_arsenate_reason: "Nasi sadownicy mogą zwalczać owocówkę jabłkóweczkę i inne szkodniki za pomocą nowo opracowanego arsenianu ołowiu, o ile na rynku nie zabraknie ołowiu. Powinno być możliwe opanowanie tego szkodnika w jednym regionie co miesiąc."
 theiler.31.t: "Arsenian Ołowiu"
 theiler.31.d: "We współpracy z Dr. [SCOPE.sCharacter('mendelejew_chemist_scope').GetLastName], Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] opracował skuteczny pestycyd, którego masowa produkcja mogłaby zrewolucjonizować rolnictwo. Owocówka jabłkóweczka zjadła już swój ostatni posiłek w jabłkach!"
 theiler.31.f: "Arsenian ołowiu (PbHAsO₄) został opracowany w 1892 roku przez Melville’a Thurstona Cooka w Massachusetts do zwalczania owocówki jabłkóweczki (Cydia pomonella) w sadach. Stanowił stabilniejszą i mniej szkodliwą dla roślin alternatywę dla toksycznego arseninu miedzi ('zieleni paryskiej'). Proszek zabijał owady podczas żerowania, długo utrzymywał się na liściach i owocach oraz po raz pierwszy umożliwił skuteczne zwalczanie szkodników w sadownictwie towarowym. Arsenian ołowiu pozostawał w powszechnym użyciu aż do wprowadzenia syntetycznych pestycydów, takich jak DDT, mimo szkodliwego wpływu na środowisko i zdrowie ludzi."
 theiler.31.g: "Dosłownie je otrujemy?"
 theiler.31.tt: "Od teraz sadownicy będą stosować arsenian ołowiu w swoich sadach, aby pozbyć się modyfikatora Cydia."
 theiler.32.t: "Owocówka jabłkóweczka rozprzestrzenia się w regionie [SCOPE.sState('theiler_state_scope').GetName]!"
 theiler.32.d: "Owocówka jabłkóweczka rozszerzyła swój zasięg: z sąsiedniego regionu przedostała się również do regionu [SCOPE.sState('theiler_state_scope').GetName], gdzie zaatakowała miejscowe sady."
 theiler.32.f: "Owocówka jabłkóweczka (Cydia pomonella) pochodzi z Eurazji i w XIX wieku wraz z rozwojem upraw jabłoni rozprzestrzeniła się w Europie Środkowej, północnych Włoszech, na Bałkanach, Węgrzech, obszarach Rosji na zachód od Uralu, w Ameryce Północnej i Australii. Regiony północne, bardzo gorące lub suche w dużej mierze uniknęły jej inwazji. W XX wieku dotarła do niemal wszystkich obszarów uprawy jabłoni w strefie umiarkowanej na świecie, w tym do Skandynawii, krajów bałtyckich i Ameryki Południowej, stając się jednym z najgroźniejszych szkodników sadów."
 theiler.32.g: "Wygląda na to, że ceny owoców wzrosną."
 theiler.33.t: "Owocówka jabłkóweczka rozprzestrzenia się w Ameryce Południowej!"
 theiler.33.d: "Przyrodnicy i biolodzy przedstawili dziś raport, który budzi niepokój zarówno rolników, jak i kupców. W naszych sadach po raz pierwszy odkryto owocówkę jabłkóweczkę — cieszącego się złą sławą szkodnika pochodzącego z Europy i Azji Zachodniej. To pierwszy stwierdzony przypadek jej występowania w Ameryce Południowej!"
 theiler.33.g: "Nie tak wyobrażałem sobie korzyści z handlu międzynarodowego..."
 theiler.34.t: "Owocówka jabłkóweczka rozprzestrzenia się w Afryce Południowej!"
 theiler.34.d: "Przyrodnicy i biolodzy przedstawili dziś raport, który budzi niepokój zarówno rolników, jak i kupców. W naszych sadach po raz pierwszy odkryto owocówkę jabłkóweczkę — cieszącego się złą sławą szkodnika pochodzącego z Europy i Azji Zachodniej. To pierwszy stwierdzony przypadek jej występowania w Afryce Południowej!"
 theiler.35.t: "Owocówka jabłkóweczka rozprzestrzenia się w Oceanii!"
 theiler.35.d: "Przyrodnicy i biolodzy przedstawili dziś raport, który budzi niepokój zarówno rolników, jak i kupców. W naszych sadach po raz pierwszy odkryto owocówkę jabłkóweczkę — cieszącego się złą sławą szkodnika pochodzącego z Europy i Azji Zachodniej. To pierwszy stwierdzony przypadek jej występowania w Oceanii!"
 theiler.41.t: "[AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]"
 theiler.41.d: "Dr. [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] podczas kilku kuracji z użyciem #V [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]#! odkrył znaczny potencjał leczniczy tego środka. Jego wykorzystanie wymaga jednak zakupu większej ilości oraz dokładnych badań w celu wyizolowania substancji czynnej. Pozwoliłoby to opracować zupełnie nowy lek!"
 theiler.41.g: "A więc [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)] to nowa cudowna roślina?"
