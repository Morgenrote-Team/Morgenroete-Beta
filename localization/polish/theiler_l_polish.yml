 je_theiler_improve_agriculture_project_reason: "Twój [concept_theiler_biologist] Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] skupia się na usprawnieniu produkcji w budynku [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] w regionie [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName].\n$mr_divider_for_je$\nPostęp projektu będzie zwiększał się co miesiąc. Za każdym razem, gdy osiągnie 24, bieżący budynek otrzyma nowy modyfikator. Projekt zakończy się, gdy wszystkie wybrane do niego budynki otrzymają komplet modyfikatorów.\n\nŁącznie dostępne są 3 modyfikatory. Uzyskanie każdego kolejnego wymaga ponownego zapełnienia paska postępu.\n\nUkończenie prac nad każdym budynkiem zapewnia pewną liczbę [Concept('concept_theiler_microorganism','$concept_theiler_microorganisms$')]. Ponadto twój Biolog może zyskać cechę $ito_botanist$ lub $ito_zoologist$ po zakończeniu usprawniania budynku.\n$mr_divider_for_je$\nBieżący Budynek: [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] w regionie [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_theiler_improve_agriculture_project_modifier_1_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_theiler_improve_agriculture_project_modifier_2_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_theiler_improve_agriculture_project_modifier_3_type')]\n\nŁączna Liczba Pozostałych Budynków (bez bieżącego): [JournalEntry.MakeScope.Var('mr_number_of_remaining_list_entries_var').GetValue|V0]\n$concept_theiler_microorganisms$ z Projektu: [JournalEntry.MakeScope.ScriptValue('theiler_microorganisms_from_agriculture_project_value')|+0] @theiler_microorganisms_texticon!\n\nBieżący miesięczny postęp: #underline #tooltip:[GetRawTextTooltipTag('theiler_monthly_biologist_improvement_progress_var_tt')] [GetPlayer.MakeScope.ScriptValue('theiler_improve_agriculture_project_progress_value')|+2] #!#!"
