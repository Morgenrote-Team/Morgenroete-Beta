 je_group_theiler_biology: "Morgenröte: [concept_theiler_biology]"
 je_theiler_microorganism_research_reason: "[ROOT.GetCountry.GetCustom('je_theiler_microorganism_research_active_type')]Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] bada obecnie fascynujący świat mikroorganizmów. W zależności od swoich umiejętności i używanego mikroskopu, [ROOT.Var('theiler_biologist_var').GetCharacter.GetSheHe] będzie odkrywać nowe mikroorganizmy każdego miesiąca. Wszechstronna wiedza na temat mikroorganizmów jest niezbędna do wykrywania [Concept('concept_theiler_pathogen','$concept_theiler_pathogens$')].\n\nJeśli nasz [concept_theiler_biologist] nie zdobył jeszcze tej umiejętności, istnieje również możliwość, że Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] zdobędzie cechę $theiler_microbiologist$. Cecha zostanie zdobyta po maksymalnie 60 miesiącach Badań nad Mikroorganizmami.\n$mr_divider_for_je$\nSzacowana obecnie wydajność wynosi @theiler_microorganisms_texticon! [ROOT.Var('theiler_estimated_microorganisms_on_microorganisms_research_var').GetValue|+=0] [Concept('concept_theiler_microorganism','$concept_theiler_microorganisms$')] miesięcznie.[ROOT.GetCountry.GetCustom('je_theiler_microorganism_research_num_months_type')]"
 je_theiler_microorganism_research: "Badania nad Mikroorganizmami"
 theiler_biologist_dies_tt: "Wpis w Dzienniku zakończy się niepowodzeniem, jeśli [concept_theiler_biologist] umrze."
 je_theiler_microscope_achromatic: "Mikroskop Achromatyczny"
 je_theiler_microscope_achromatic_reason: "Ernst Abbe opracował w latach 70. XIX wieku zaawansowany mikroskop achromatyczny, który dzięki precyzyjnej konstrukcji optycznej znacznie poprawił ostrość i rozdzielczość obrazu. Jego prace w firmie Carl Zeiss położyły podwaliny pod nowoczesną mikroskopię naukową i standaryzację konstrukcji soczewek.\n\nLepsze mikroskopy umożliwiają skuteczniejszą obserwację [Concept('concept_theiler_pathogen','$concept_theiler_pathogens$')] oraz innych [Concept('concept_theiler_microorganism','$concept_theiler_microorganisms$')]. Postęp będzie osiągany, jeśli masz zarówno [concept_tesla_engineer], jak i [concept_theiler_biologist]."
 je_theiler_microscope_achromatic_goal: "Biolog i inżynier muszą spędzić [JournalEntry.GetTotalGoalValue|V0] tygodni, wspólnie pracując nad nowym mikroskopem."
 je_theiler_microscope_electron: "Mikroskop Elektronowy"
 je_theiler_microscope_electron_reason: "Mikroskop elektronowy, opracowany w latach 30. XX wieku przez Ernsta Ruskę i Maxa Knolla, wykorzystuje wiązki elektronów zamiast światła, aby uzyskać znacznie wyższą rozdzielczość. Odegrał kluczową rolę w historii nauki, umożliwiając badaczom obserwację struktur w skali nanometrów, daleko wykraczającej poza możliwości mikroskopów optycznych.\n\nLepsze mikroskopy umożliwiają skuteczniejszą obserwację [Concept('concept_theiler_pathogen','$concept_theiler_pathogens$')] oraz innych [Concept('concept_theiler_microorganism','$concept_theiler_microorganisms$')]. Postęp będzie osiągany, jeśli masz zarówno [concept_tesla_engineer], jak i [concept_theiler_biologist]."
 je_theiler_microscope_electron_goal: "Biolog i inżynier muszą spędzić [JournalEntry.GetTotalGoalValue|V0] tygodni, wspólnie pracując nad nowym mikroskopem."
