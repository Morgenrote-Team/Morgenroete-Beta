 je_theiler_medicinal_plant_emetine_reason: "Proces opracowywania nowego leku zazwyczaj przebiega następująco: w zależności od poziomu Technik Medycznych [concept_panum_physician] proponuje pozyskanie określonych [concept_ito_medicinal_plants] do celów leczniczych, w tym przypadku co najmniej #V 5 [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]#!. [concept_dubois_naturalist] otrzymuje zadanie zebrania wystarczającej liczby próbek do wyizolowania substancji czynnej. Następnie [concept_mendelejew_chemist] wyodrębnia tę substancję chemiczną. Po jej uzyskaniu [concept_theiler_biologist] może wyprodukować lek.\n\nCarapichea ipecacuanha to tropikalna roślina pochodząca z Ameryki Południowej, zwłaszcza z Brazylii. Jej korzenie zawierają alkaloidy emetynę i cefaleinę, które wywołują wymioty i działają przeciwpasożytniczo. Tradycyjnie korzeń wymiotnicy stosowano jako środek wymiotny w leczeniu zatruć oraz jako składnik wykrztuśny syropów na kaszel."
