 theiler.2201.t: "Modernizacje Rolnictwa"
 theiler.2201.d: "Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] osiągnął [SCOPE.sCharacter('theiler_biologist_scope').GetHerHis] cel. Dzięki starannemu doborowi i wykorzystaniu [SCOPE.sCharacter('theiler_biologist_scope').GetHerHis] wiedzy biologicznej, [SCOPE.sCharacter('theiler_biologist_scope').GetSheHe] trwale wzmocnił krajowe rolnictwo.\n\nŁączna liczba zmodernizowanych budynków: [GetPlayer.MakeScope.Var('mr_num_improved_agriculture_buildings_var').GetValue|V0]\n$concept_theiler_microorganisms$ z projektu: [GetPlayer.MakeScope.ScriptValue('theiler_microorganisms_from_agriculture_project_for_event_value')|+0] @theiler_microorganisms_texticon!"
 theiler.2201.f: "'Ci idioci wciąż sądzą, że udomowili wszystkie te rośliny. W rzeczywistości to rośliny udomowiły nas, ludzi. Wystarczy spojrzeć, jak bardzo o nie dbamy!'"
 theiler.2201.g: "Nasza gospodarka się rozwija!"
