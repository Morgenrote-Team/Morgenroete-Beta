 theiler.2000.t: "Przygotowania do Kongresu Biologicznego"
 theiler.2000.d: "Przed zorganizowaniem kolejnego Międzynarodowego Kongresu Biologicznego w naszym kraju pojawia się pytanie, czy obrady powinny koncentrować się na konkretnej chorobie, czy też nie."
 theiler.2000.f: "Kongresy biologiczne mogą koncentrować się na konkretnej chorobie, jeśli państwo organizujące dysponuje przynajmniej jej opisem. Każdej chorobie można poświęcić tylko jeden kongres. Obecni na nim biolodzy otrzymują dodatkowe wskazówki, dzięki którym mogą szybciej prowadzić swoje badania. Podczas kongresu o tematyce ogólnej uczestniczące państwa otrzymują po prostu premię do Postępu Naukowego."
 theiler.2000.g: "To ma być kongres biologiczny o tematyce ogólnej."
 theiler.2001.t: "Kongres Biologiczny"
 theiler.2001.d: "Stolica przygotowuje się do międzynarodowego spotkania specjalistów w dziedzinie biologii. [ROOT.Var('theiler_biologist_var').GetCharacter.GetFullName] będzie przewodniczyć obradom jako prezes kongresu. [SCOPE.GetRootScope.GetCountry.GetCustom('theiler_custom_congress_title')]"
 theiler.2001.f: "Kongresy biologiczne stanowią doskonałą okazję do wymiany wiedzy biologicznej. Osiągnięcia, które dotychczas były dostępne tylko jednemu krajowi, są tutaj dzielone w duchu braterstwa. Podczas kongresów biologicznych można wymieniać się wiedzą na temat patogenów, szczepionek i pestycydów."
 theiler.2001.g: "Wyślijmy zaproszenia!"
 theiler.2002.t: "Zaproszenie na Kongres Biologiczny"
 theiler.2002.d: "[SCOPE.sCountry('theiler_congress_host_country').GetName] zaprasza kraje przodujące w dziedzinie biologii na międzynarodowy kongres w swojej stolicy. [SCOPE.GetRootScope.GetCountry.GetCustom('theiler_custom_congress_title')]"
 theiler.2002.g: "Nie zapomnijcie o mikroskopach!"
 theiler.2004.t: "Patogen i Szczepionka"
 theiler.2004.d: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] z radością odkrył, że na kongresie w [SCOPE.sCountry('theiler_congress_host_country').GetName] znalazło się wielu podobnie myślących naukowców, gotowych dzielić się swoją wiedzą mikrobiologiczną. Pozostaje jedynie pytanie, o której z tych niezwykłych chorób [ROOT.Var('theiler_biologist_var').GetCharacter.GetSheHe] chciałby w przyszłości dowiedzieć się więcej?"
 theiler.2004.f: "Jeśli państwo uczestniczące w Kongresie Biologicznym posiada wiedzę o patogenie lub szczepionce przeciwko chorobie, której nie posiada inne państwo, to drugie może zdobyć tę wiedzę podczas kongresu. Wiedzę można poszerzyć tylko w odniesieniu do jednej choroby. Jeśli podczas kongresu nie ma możliwości zdobycia nowej wiedzy w tym zakresie, nadal można gromadzić wiedzę ogólną i rozwijać technologię biologiczną."
 theiler.2004.g: "Nasz naukowiec powinien zdobyć od swoich kolegów trochę ogólnej wiedzy biologicznej."
 theiler.2005.t: "Wizja Biologiczna"
 theiler.2005.d_general: "Biolodzy uczestniczący w kongresie postanowili przede wszystkim unowocześnić i udoskonalić kształcenie przyszłych studentów biologii, a następnie opracowali w tej sprawie wspólną deklarację."
 theiler.2005.d_special: "Ze względu na główny temat konferencji naukowcy przegłosowali decyzję o skoncentrowaniu wszystkich wysiłków na zwalczaniu konkretnej choroby w ciągu najbliższych kilku lat."
 theiler.2005.f: "Jeśli na początku Kongresu Biologicznego określono konkretny temat jako główny przedmiot obrad, wszystkie uczestniczące państwa otrzymają dodatkowe wskazówki dotyczące danej choroby. Jeśli natomiast kongres ma charakter ogólny, nacisk zostanie położony na kształcenie nowych kadr naukowych."
 theiler.2005.g: "Warto było zorganizować to wydarzenie."
 theiler.2007.t: "Pestycydy"
 theiler.2007.d: "Podczas kongresu rozeszła się wieść, że niektórym specjalistom udało się opracować nowe pestycydy. Są oni gotowi podzielić się swoją wiedzą."
 theiler.2007.f: "Pestycydy zwalczające szkodniki, takie jak owocówka jabłkóweczka, mają tak ogromne znaczenie dla ludzkości, że ich wynalazcy bez zastrzeżeń dzielą się swoją wiedzą. Ostatecznie chodzi przecież o dobro wszystkich ludzi."
 theiler.2007.g: "Na zdrowie całej ludzkości!"
 theiler.2009.t: "Kongres Medyczny dobiega końca"
 theiler.2009.d: "Kongres Medyczny w [SCOPE.sCountry('theiler_congress_host_country').GetName] zakończył się wczoraj. Naukowcy ponownie wyruszyli w drogę do domu, zabierając ze sobą liczne odkrycia i wyniki badań."
 theiler.2009.f: "Międzynarodowy Kongres Medyczny (fr. Congrès International de Médecine) był cyklem międzynarodowych konferencji naukowych poświęconych medycynie, organizowanych okresowo w latach 1867–1913. Pomysł zorganizowania takiego kongresu narodził się w 1865 roku, podczas trzeciego dorocznego Kongresu Medycznego Francji. Profesor Henri Giutrac zaproponował wówczas zwołanie międzynarodowej konferencji medycznej w 1867 roku, wykorzystując fakt, że lekarze i chirurdzy z całego świata z pewnością przybędą do Paryża na odbywającą się w tym samym roku Wystawę Światową."
 theiler.2009.g: "Mam nadzieję, że bufet był dobry?"
 theiler.81.t: "Choroba Panamska"
 theiler.81.d: "Dziwny grzyb zaatakował znaczną część plantacji bananów w [SCOPE.sState('theiler_state_scope').GetName]. Chociaż podobne przypadki odnotowano w Azji Południowo-Wschodniej i Australii, skala zniszczeń jest nieporównywalnie większa. Wygląda na to, że rolnicy stoją w obliczu zupełnie nowego zagrożenia: choroby panamskiej!"
 theiler.81.f: "The Panama Disease (Fusarium oxysporum f. sp. cubense) is a soil-borne fungal disease that attacks banana plants, particularly the Gros Michel variety. First reported in the late 19th century in Central America, it became one of the most economically destructive plant diseases in agricultural history. Its significance lies in its mode of infection: the fungus enters through the roots and spreads through the plant's vascular system, blocking the flow of water and nutrients. Infected plants gradually wilt, turn yellow, and eventually die. By the 1950s, it had devastated Gros Michel plantations across Central and South America, forcing the banana industry to replace the variety with disease-resistant Cavendish bananas."
 theiler.81.g: "Moje bezcenne banany!"
 theiler.81.tt: "Od teraz [GetHarvestConditionType('theiler_panama_disease_condition').GetName] będzie występować wszędzie."
