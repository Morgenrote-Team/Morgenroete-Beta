 theiler_boll_weevil_condition: "Kwieciak Bawełniany"
 theiler_boll_weevil_condition_desc: "Na przełomie XIX i XX wieku kwieciak bawełniany był uważany za jednego z najgroźniejszych szkodników w Ameryce Północnej, niszczącego całe uprawy bawełny."
 theiler_codling_moth_condition: "Owocówka Jabłkóweczka"
 theiler_codling_moth_condition_desc: "Owocówka jabłkóweczka była jedną z największych plag europejskiego sadownictwa jabłoniowego, regularnie niszcząc całe plony."
 theiler_grape_phylloxera_condition: "Filoksera Winiec"
 theiler_grape_phylloxera_condition_desc: "Pod koniec XIX wieku epidemia filoksery zniszczyła większość europejskich winnic, w których uprawiano winorośl na wino, szczególnie we Francji."
 theiler_potato_beetle_condition: "Stonka Ziemniaczana"
 theiler_potato_beetle_condition_desc: "Około 1840 roku chrząszcz ten zaczął żerować na uprawianych ziemniakach i szybko stał się jednym z najgroźniejszych szkodników tych upraw."
 theiler_screwworm_fly_condition: "Mucha Śrubowa Nowego Świata"
 theiler_screwworm_fly_condition_desc: "Cochliomyia hominivorax to gatunek pasożytniczej muchy, której larwy są znane z żerowania na żywych tkankach organizmów i ich uszkadzania, przede wszystkim u zwierząt stałocieplnych, takich jak bydło i inne zwierzęta gospodarskie."
 theiler_tea_mosquito_condition: "Pluskwiak Herbaciany"
 theiler_tea_mosquito_condition_desc: "Rodzaj Helopeltis, którego przedstawiciele bywają również nazywani pluskwiakami komarowatymi, obejmuje szkodniki różnych upraw, w tym kakaowca, nerkowca, bawełny i herbaty."
