 theiler_pharmaceutical_strophantine_flag: "Strophantus Gratus"
 theiler.41.strychnine: "Strychnos nux-vomica to tropikalne drzewo występujące naturalnie w Indiach i Azji Południowo-Wschodniej. Jego nasiona zawierają alkaloidy: strychninę i brucynę, które są wysoce toksyczne. Strychnina oddziałuje na układ nerwowy, wywołując silne skurcze mięśni, które mogą prowadzić do śmierci. Pomimo swojej toksyczności, w niewielkich, kontrolowanych dawkach ekstrakty z tej rośliny były dawniej stosowane w medycynie jako środki pobudzające oraz w leczeniu zaburzeń trawiennych i nerwowych."
 theiler.41.emetine: "Carapichea ipecacuanha to tropikalna roślina pochodząca z Ameryki Południowej, szczególnie z Brazylii. Jej korzenie zawierają alkaloidy: emetynę i cefalinę, które wywołują wymioty i wykazują działanie przeciwpasożytnicze. Tradycyjnie korzeń ipekakuany stosowano jako środek wymiotny w leczeniu zatruć oraz jako środek wykrztuśny w syropach na kaszel."
 theiler.41.atropine: "Atropa belladonna, znana również jako pokrzyk wilcza jagoda, to wieloletnia roślina występująca naturalnie w Europie, Afryce Północnej i zachodniej Azji. Zawiera toksyczne alkaloidy, takie jak atropina, skopolamina i hioscyjamina, które oddziałują na układ nerwowy, blokując receptory acetylocholinowe. Dawniej stosowano ją jako środek uspokajający i przeciwbólowy, a także do rozszerzania źrenic. We współczesnej medycynie oczyszczona atropina jest wykorzystywana w okulistyce oraz w leczeniu bradykardii i zatruć związkami fosforoorganicznymi."
 theiler.41.aloin: "Aloe vera to sukulent pochodzący z Afryki Północnej i Półwyspu Arabskiego. Jego grube liście zawierają żel bogaty w polisacharydy, witaminy i enzymy, który ma właściwości łagodzące i nawilżające. Żel ten jest szeroko stosowany w kosmetyce i medycynie do leczenia oparzeń, ran i podrażnień skóry. Wysuszony lateks z wewnętrznej warstwy liści zawiera aloinę, związek o silnym działaniu przeczyszczającym."
 theiler.41.digitoxin: "Digitalis purpurea, znana również jako naparstnica purpurowa, to dwuletnia roślina występująca naturalnie w Europie. Jej liście zawierają glikozydy nasercowe, takie jak digoksyna i digitoksyna, które wzmacniają skurcze serca i regulują jego rytm. Tradycyjnie ekstrakty z tej rośliny stosowano w leczeniu niewydolności serca i zaburzeń rytmu serca. Oczyszczone glikozydy nasercowe są stosowane w medycynie w ściśle kontrolowanych dawkach w leczeniu chorób serca, natomiast surowej rośliny unika się ze względu na wysokie ryzyko ciężkiego zatrucia."
 theiler.41.quinine: "Cinchona pubescens to drzewo pochodzące z Ameryki Południowej, szczególnie z regionów andyjskich. Jego kora zawiera chininę i inne alkaloidy o silnych właściwościach przeciwmalarycznych. Tradycyjnie kora była stosowana w leczeniu gorączki i malarii. Do dziś chinina i jej pochodne pozostają ważnymi środkami stosowanymi w medycynie do leczenia malarii. Drzewo jest również uprawiane w regionach tropikalnych ze względu na swoją leczniczą korę."
 theiler.41.thymol: "Thymus vulgaris, znany również jako tymianek pospolity, to niewielka bylina pochodząca z regionu Morza Śródziemnego. Jego liście i olejek zawierają tymol, karwakrol oraz inne olejki eteryczne o właściwościach przeciwdrobnoustrojowych, przeciwutleniających i przeciwzapalnych. Tradycyjnie tymianek stosowano w leczeniu infekcji dróg oddechowych, kaszlu i dolegliwości trawiennych. Jest szeroko wykorzystywany w ziołolecznictwie, aromaterapii oraz jako naturalny środek konserwujący i aromatyzujący żywność."
 theiler.41.pilocarpine: "Pilocarpus pennatifolius to tropikalny krzew pochodzący z Brazylii. Jego liście zawierają alkaloid pilokarpinę, który pobudza gruczoły ślinowe i potowe. Tradycyjnie roślinę stosowano w leczeniu suchości w ustach i schorzeń oczu. We współczesnej medycynie pilokarpina jest wykorzystywana w leczeniu jaskry poprzez obniżanie ciśnienia wewnątrzgałkowego, a także w leczeniu kserostomii (suchości w ustach) spowodowanej radioterapią lub stosowaniem leków. Roślina jest ceniona przede wszystkim ze względu na zawarte w niej alkaloidy o działaniu farmakologicznym."
 theiler.41.ephedrine: "Ephedra sinica, znana również jako ma huang, to krzew pochodzący z Chin i Azji Środkowej. Jego łodygi zawierają efedrynę i pseudoefedrynę, alkaloidy, które pobudzają układ nerwowy i rozszerzają oskrzela. Roślina była stosowana w medycynie chińskiej w leczeniu astmy, zapalenia oskrzeli i niedrożności nosa. Jej stosowanie jest ograniczone ze względu na ryzyko nadciśnienia, problemów z sercem i innych skutków ubocznych."
 theiler.41.strophantine: "Strophanthus gratus to pnąca roślina pochodząca z Afryki Zachodniej. Jej nasiona zawierają glikozydy nasercowe, takie jak ouabaina, które silnie wpływają na skurcze serca. Tradycyjnie ekstrakty z tej rośliny stosowano jako truciznę do zatruwania strzał, a w niewielkich dawkach także w leczeniu chorób serca. Ouabaina była badana pod kątem zastosowania w leczeniu niewydolności serca i zaburzeń rytmu serca."
