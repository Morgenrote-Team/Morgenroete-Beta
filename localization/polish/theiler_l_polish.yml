 theiler.79.t: "Zespół Biologiczny Odchodzi"
 theiler.79.d: "Po zapoznaniu miejscowych rolników z nowoczesnymi metodami stosowania pestycydów z państwa zwierzchniego asystenci naukowi żegnają się i wracają do swojej ojczyzny."
 theiler.79.f: "„Jedyną rzeczą, która będzie miała znaczenie, gdy odejdziemy, będą ślady miłości, które po sobie pozostawiliśmy”. -Albert Schweitzer"
 theiler.79.g: "Może jednak posiadanie państwa zwierzchniego nie jest takie złe."
