 theiler.10.t: "Narodziny Mikrobiologii"
 theiler.10.d: "Nowe badanie wywołuje poruszenie w środowiskach biologicznych i medycznych. Jego autor, Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName], dokonał odkryć dotyczących bakterii, które mogą zmienić nasze spojrzenie na świat."
 theiler.10.f: "Systematyczne prace Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] nad klasyfikacją bakterii przyniosły znakomite rezultaty. [SCOPE.sCharacter('theiler_biologist_scope').GetHerHis|U] „Badania nad bakteriami” ustanowiły bakterie odrębną grupą taksonomiczną o powtarzalnych cechach. [SCOPE.sCharacter('theiler_biologist_scope').GetSheHe|U] wykazał, że bakterie można hodować, badać i klasyfikować równie rygorystycznie jak rośliny czy zwierzęta. Co najważniejsze, metody [SCOPE.sCharacter('theiler_biologist_scope').GetHerHis] pozwalają badaczom odróżniać bakterie nieszkodliwe od chorobotwórczych. Metody [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] mogą stać się podstawą zupełnie nowej dziedziny medycyny — takiej, która być może wreszcie wyjaśni mechanizmy powstawania chorób zakaźnych."
 theiler.10.g: "Przełom w Poszukiwaniach Mikroorganizmów"
 theiler.10.h: "Przełom w Teorii Zarazków"
