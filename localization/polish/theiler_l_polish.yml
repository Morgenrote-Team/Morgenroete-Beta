 theiler_early_pesticides_tech: "Wczesne Pestycydy"
 theiler_early_pesticides_tech_desc: "Po odkryciu, że pigment do tapet znany jako „zieleń paryska” ma właściwości owadobójcze, nastąpił rozwój chemicznych środków ochrony roślin. Opracowano między innymi takie substancje jak arsenian ołowiu, który był znacznie skuteczniejszy w zwalczaniu szkodników."
 theiler_modern_pesticides_tech: "Nowoczesne Pestycydy"
 theiler_modern_pesticides_tech_desc: "Na przełomie XIX i XX wieku wraz z rozwojem monokultur coraz bardziej nasilały się problemy związane z plagami szkodników. Odpowiedzią było rolnictwo przemysłowe, które wypowiedziało im wojnę chemiczną: arsenian wapnia, siarczyn nikotyny i arsenin sodu to tylko niektóre z wykorzystywanych w niej rodzajów broni."
 je_theiler_pesticide_development: "Rozwój Pestycydów"
 je_theiler_pesticide_development_reason: "Dzięki podstawowej wiedzy o środkach owadobójczych Biolog we współpracy z Chemikiem może opracować skuteczny środek do zwalczania [concept_theiler_pest]. Obecnie trwają prace nad pestycydem przeciwko #V [AddLocalizationIf( Scope.Var('theiler_pesticide_type_var').IsSet , Scope.Var('theiler_pesticide_type_var').GetFlagName)]#!.\n\nJeśli Biolog lub Chemik umrze w trakcie prac, opracowywanie pestycydu zostanie wstrzymane, ale będzie kontynuowane, gdy tylko obaj uczeni będą ponownie dostępni."
 je_theiler_pesticide_development_success: "[concept_theiler_biologist] pracował nad nowym pestycydem przez co najmniej #ORANGE 12 miesięcy#!."
 je_theiler_grafting: "Szczepienie Roślin"
 je_theiler_grafting_reason: "Nasz Biolog [ROOT.Var('theiler_biologist_var').GetCharacter.GetFullName] niestrudzenie pracuje nad techniką szczepienia winorośli, która pozwoli uratować europejskie odmiany dzięki wykorzystaniu amerykańskich podkładek."
 je_theiler_grafting_success: "[concept_theiler_biologist] pracował nad nowym pestycydem przez co najmniej #ORANGE 12 miesięcy#!."
 je_theiler_pest_control: "Zwalczanie Szkodników"
 je_theiler_pest_control_reason: "Odkrycie i produkcja pestycydów oraz opracowanie metod biologicznych – od stosowania arsenianu ołowiu i arsenianu wapnia po szczepienie roślin – zapewniają Biologowi środki do zwalczania gwałtownych plag szkodników, pod warunkiem że na rynku dostępny jest niezbędny towar, zazwyczaj ołów. Dzięki temu można całkowicie wyeliminować szkodnika z regionu w ciągu zaledwie jednego miesiąca."
 je_theiler_sterile_insect_technique: "Technika Sterylizacji Owadów"
 je_theiler_sterile_insect_technique_reason: "Dzięki zastosowaniu najnowocześniejszych dostępnych metod możliwe może stać się wytępienie groźnej muchy śrubowej Nowego Świata, uwalniając ludzi i zwierzęta od tej plagi. Biolog może opracować teorię i przeprowadzić eksperymenty terenowe, aby znaleźć odpowiednie rozwiązanie tego problemu.\n\nJeśli Biolog umrze w trakcie prac, działania mające na celu wytępienie pasożyta zostaną wstrzymane, ale będą kontynuowane, gdy tylko ponownie będzie dostępny Biolog."
 je_theiler_sterile_insect_technique_success: "[concept_theiler_biologist] pracował przez co najmniej #ORANGE 12 miesięcy#! nad znalezieniem metody wytępienia muchy śrubowej."
 theiler.71.t: "Arsenian Ołowiu"
 theiler.71.d: "We współpracy z Dr. [SCOPE.sCharacter('mendelejew_chemist_scope').GetLastName] Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] opracował skuteczny pestycyd, którego masowa produkcja mogłaby zrewolucjonizować rolnictwo. Owocówka jabłkóweczka zjadła już swój ostatni posiłek w jabłkach, a stonce ziemniaczanej kolejny posiłek stanie kością w gardle!"
 theiler.71.f: "Arsenian ołowiu (PbHAsO₄) został opracowany w 1892 roku przez Melville’a Thurstona Cooka w stanie Massachusetts w celu zwalczania owocówki jabłkóweczki (Cydia pomonella) w sadach. Stanowił bardziej stabilną i mniej szkodliwą dla roślin alternatywę dla toksycznego arseninu miedzi („zieleni paryskiej”). Preparat w postaci proszku zabijał owady podczas żerowania, długo utrzymywał się na liściach i owocach oraz po raz pierwszy umożliwił skuteczne zwalczanie szkodników w sadownictwie towarowym. Pomimo szkodliwego wpływu na środowisko i zdrowie ludzi arsenian ołowiu pozostawał w powszechnym użyciu aż do wprowadzenia syntetycznych pestycydów, takich jak DDT."
 theiler.71.g: "Dosłownie je trujemy?"
 theiler.71.tt: "Od teraz rolnicy będą stosować arsenian ołowiu w swoich gospodarstwach, aby pozbyć się szkodników takich jak [GetHarvestConditionType('theiler_potato_beetle_condition').GetName] i [GetHarvestConditionType('theiler_codling_moth_condition').GetName]."
 theiler.72.t: "Technika Sterylizacji Owadów"
 theiler.72.d: "Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] opracował niekonwencjonalny, ale przełomowy pomysł: zamiast zwalczać pasożyty za pomocą pestycydów, obiecującą metodą byłaby hodowla bezpłodnych samców, z którymi samice nie mogłyby wydać na świat potomstwa."
 theiler.72.f: "Technika sterylnych owadów (SIT) została opracowana w latach 50. XX wieku przez Raymonda C. Bushlanda i Edwarda F. Kniplinga. Samce much poddaje się sterylizacji za pomocą promieniowania gamma, zwykle pochodzącego ze źródeł zawierających kobalt-60 lub cez-137. To wysokoenergetyczne promieniowanie uszkadza DNA w komórkach rozrodczych, nie wpływając znacząco na żywotność owadów ani ich zdolność do kopulacji. Następnie wysterylizowane samce są masowo wypuszczane na wolność. Ponieważ nadal skutecznie kopulują z dziko żyjącymi samicami, ale nie mogą wydać na świat zdolnego do życia potomstwa, populacja stopniowo zanika. Metoda ta okazała się szczególnie skuteczna w zwalczaniu muchy śrubowej Nowego Świata, której wytępienie w Ameryce Północnej i Środkowej pozwoliło zapobiec ogromnym stratom gospodarczym i szkodom w hodowli zwierząt."
 theiler.72.g: "Dosłownie traktujemy je bronią atomową?"
 theiler.72.tt: "Od teraz Biolog, jeśli będzie dostępny, będzie co roku zwalczać plagę [GetHarvestConditionType('theiler_screwworm_fly_condition').GetName] w jednym regionie."
 theiler.73.t: "Arsenin Sodu"
 theiler.73.d: "We współpracy z Dr. [SCOPE.sCharacter('mendelejew_chemist_scope').GetLastName] Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] opracował skuteczny pestycyd, którego masowa produkcja mogłaby zrewolucjonizować rolnictwo. Chmary szarańczy, które dotąd siały postrach wśród ludzi, teraz same poznają, czym jest prawdziwy strach!"
 theiler.73.f: "Arsenin sodu to wysoce toksyczna nieorganiczna sól, która na początku XX wieku była stosowana jako jeden z podstawowych nieselektywnych pestycydów i herbicydów. Ze względu na wyjątkowo dobrą rozpuszczalność w wodzie stanowiła podstawowy środek chemicznego zwalczania szkodników w rolnictwie na całym świecie. Wykorzystywano ją między innymi w kąpielach przeciwkleszczowych dla bydła, stosowanych w kolonialnych Indiach i Australii, w kąpielach przeciwpasożytniczych owiec oraz do zwalczania szarańczy. Na azjatyckich plantacjach kauczukowca i herbaty była standardowym środkiem do ograniczania rozwoju niepożądanej roślinności. Pomimo swojej skuteczności jej wyjątkowo wysoka toksyczność dla ssaków i długotrwała obecność w środowisku stanowiły poważne zagrożenie dla zdrowia robotników i zwierząt hodowlanych. Po wprowadzeniu w połowie XX wieku syntetycznych związków organicznych oraz wzroście świadomości na temat jej rakotwórczych właściwości arsenin sodu został objęty surowymi ograniczeniami lub zakazany, a jego miejsce zajęły mniej niebezpieczne środki."
 theiler.73.g: "Dosłownie zastawiamy na nie przynętę?"
 theiler.73.tt: "Od teraz rolnicy będą stosować arsenin sodu w swoich gospodarstwach, aby pozbyć się [GetHarvestConditionType('locust_swarm').GetName]."
 theiler.74.t: "Arsenian Wapnia"
 theiler.74.d: "We współpracy z Dr. [SCOPE.sCharacter('mendelejew_chemist_scope').GetLastName], Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] opracował skuteczny pestycyd, którego masowa produkcja mogłaby zrewolucjonizować rolnictwo. Smacznego, małe kwieciaki bawełniane!"
 theiler.74.f: "Arsenian wapnia to wysoce toksyczna sól nieorganiczna, która na początku XX wieku stała się jednym z podstawowych środków chemicznego zwalczania szkodników. Wprowadzony do użytku około 1906 roku jako tańsza i bardziej stabilna alternatywa dla arsenianu ołowiu, był stosowany przede wszystkim jako trucizna żołądkowa przeciwko owadom gryzącym i żerującym na roślinach. Jego najważniejszym zastosowaniem historycznym było masowe opylanie pól bawełny w celu zwalczania kwieciaka bawełnianego w Stanach Zjednoczonych i Indiach Brytyjskich. W przeciwieństwie do arseninu sodu jego mniejsza rozpuszczalność w wodzie pozwalała na bezpośrednie stosowanie preparatu na liście, przy mniejszym ryzyku poparzenia roślin. W Indiach Brytyjskich był szeroko wykorzystywany w uprawach bawełny i ziemniaków, często rozpylany z samolotów. Jednak ze względu na wyjątkowo długotrwałe utrzymywanie się w środowisku, wysoką toksyczność dla zapylaczy i właściwości rakotwórcze w latach 40. XX wieku został zastąpiony przez syntetyczne pestycydy organiczne, takie jak DDT."
 theiler.74.g: "Dosłownie wywracamy im żołądki?"
 theiler.74.tt: "Od teraz rolnicy będą stosować arsenian wapnia w swoich gospodarstwach, aby zwalczać [GetHarvestConditionType('theiler_boll_weevil_condition').GetName]."
 theiler.75.t: "Szczepienie Roślin"
 theiler.75.d: "Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] badał amerykańskie odmiany winorośli odporne na filokserę. Dzięki technice szczepienia [SCOPE.sCharacter('theiler_biologist_scope').GetSheHe] może uodpornić winorośle Starego Świata na tego szkodnika pochodzącego z Nowego Świata."
 theiler.75.f: "Szczepienie Roślin to technika ogrodnicza, która uratowała światowe winiarstwo po zniszczeniach spowodowanych pod koniec XIX wieku przez Wielką Plagę Francuskich Winnic. Kryzys wywołała Daktulosphaira vitifoliae (filoksera), szkodnik pochodzący z Ameryki Północnej, który niszczy systemy korzeniowe europejskiej winorośli właściwej (Vitis vinifera). Na początku XX wieku odbudowa winnic polegała na szczepieniu podatnych na szkodnika europejskich zrazów na odpornych amerykańskich podkładkach (np. Vitis riparia lub Vitis rupestris). W ten sposób powstaje roślina chimeryczna, której amerykańskie korzenie zapewniają odporność biologiczną na szkodnika, podczas gdy europejska część nadziemna zachowuje pożądane właściwości winogron. Metoda ta pozostaje standardem w branży, ponieważ żadna metoda chemicznego zwalczania szkodników nie okazała się równie skuteczna ani trwała jak ta genetyczno-mechaniczna bariera."
 theiler.75.g: "Dosłownie... Chwileczkę...-to nie będziemy zabijać tych stworzeń?"
 theiler.75.tt: "Od teraz rolnicy będą stosować szczepienie winorośli w swoich gospodarstwach, aby zwalczać [GetHarvestConditionType('theiler_grape_phylloxera_condition').GetName]."
 theiler.76.t: "Siarczan Nikotyny"
 theiler.76.d: "We współpracy z Dr. [SCOPE.sCharacter('mendelejew_chemist_scope').GetLastName] Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] opracował skuteczny pestycyd, którego masowa produkcja mogłaby zrewolucjonizować rolnictwo. Pluskwiak wypił właśnie swoją ostatnią herbatkę!"
 theiler.76.f: "Siarczan nikotyny to silnie działająca pochodna alkaloidu roślinnego, która na początku XX wieku stała się ważnym środkiem owadobójczym stosowanym na plantacjach kolonialnych. W przeciwieństwie do surowych ekstraktów tytoniowych ta standaryzowana postać siarczanu zapewniała bardziej przewidywalną toksyczność i mniejszą lotność, dzięki czemu była bardzo skuteczna przeciwko owadom kłująco-ssącym, takim jak pluskwiak herbaciany (Helopeltis theivora). Na plantacjach herbaty w Asamie i na Cejlonie stosowano go jako truciznę kontaktową, która po aplikacji paraliżowała układ nerwowy szkodników. Sprzedawany często pod nazwą „Black Leaf 40”, był zazwyczaj mieszany z mydłem, aby lepiej przylegał do pokrytych woskową warstwą liści herbaty. Choć ceniono go za szybki rozkład, ograniczający długotrwałe pozostawanie pozostałości pestycydu, jego wysoka cena i skrajna toksyczność dla ssaków ograniczały stosowanie do upraw o wysokiej wartości, aż do pojawienia się syntetycznych alternatyw w latach 40. XX wieku."
 theiler.76.g: "Dosłownie je wykurzamy?"
 theiler.76.tt: "Od teraz rolnicy będą stosować siarczan nikotyny w swoich gospodarstwach, aby zwalczać [GetHarvestConditionType('theiler_tea_mosquito_condition').GetName]."
 goods_output_tea_mult: "Produkcja @tea! Herbaty w Budynkach"
 goods_output_tea_mult_desc: "Premia lub kara do ilości @tea! Herbaty produkowanej przez budynki"
 theiler.60.t: "Kwieciak Bawełniany"
 theiler.60.d: "Kwieciak bawełniany, który dotychczas żywił się wyłącznie dziko rosnącą meksykańską bawełną, najwyraźniej zmienił swoje zwyczaje: zagraża całemu przemysłowi bawełnianemu wzdłuż wybrzeży Zatoki Meksykańskiej!"
 theiler.60.f: "Kwieciak bawełniany (Anthonomus grandis) to chrząszcz żywiący się pąkami kwiatowymi i kwiatami bawełny. Przywędrował z Meksyku do Stanów Zjednoczonych pod koniec XIX wieku i stał się jednym z najbardziej wyniszczających gospodarczo szkodników w historii rolnictwa. Jego szczególna szkodliwość wynika z cyklu rozrodczego: samice składają jaja wewnątrz pąków kwiatowych i torebek nasiennych bawełny. Wylęgające się larwy zjadają ich wewnętrzne tkanki, uniemożliwiając rozwój włókien bawełnianych i powodując opadanie owoców. Do lat 20. XX wieku szkodnik ten zrujnował gospodarkę opartą na „Królu Bawełny”, przyczyniając się do ogromnych przemian społecznych, takich jak Wielka Migracja, i zmuszając rolników do dywersyfikacji upraw, między innymi poprzez uprawę orzeszków ziemnych."
 theiler.60.g: "Moja bezcenna bawełna!"
 theiler.60.tt: "Od teraz [GetHarvestConditionType('theiler_boll_weevil_condition').GetName] będzie występować w Ameryce Północnej."
 theiler.61.t: "Filoksera Winiec"
 theiler.61.d: "Straszne wieści dla naszych winiarzy: w jakiś sposób filokserze udało się przedostać z Ameryki do Europy. Już rozpoczęła swoje niszczycielskie działania w regionie [SCOPE.sState('theiler_state_scope').GetName]. To katastrofa!"
 theiler.61.f: "Filoksera Winiec (Daktulosphaira vitifoliae) to mikroskopijny owad przypominający mszycę, zaliczany do najbardziej wyniszczających szkodników w historii uprawy winorośli. Pochodzi z Ameryki Północnej i pod koniec XIX wieku wywołał światowy kryzys rolniczy, niemal doprowadzając do zagłady europejskiego przemysłu winiarskiego. Jego szczególna szkodliwość wynika ze specyficznego sposobu żerowania na korzeniach winorośli. W przeciwieństwie do gatunków amerykańskich europejska winorośl właściwa (Vitis vinifera) nie posiada naturalnej odporności na toksyczną ślinę tego owada, która powoduje powstawanie galasów, a ostatecznie martwicę korzeni. Prowadzi to do całkowitego zahamowania pobierania przez roślinę wody i składników odżywczych."
 theiler.61.g: "Moje bezcenne wino!"
 theiler.61.tt: "Od teraz [GetHarvestConditionType('theiler_grape_phylloxera_condition').GetName] będzie występować w Europie."
 theiler.62.t: "Pluskwiak Herbaciany"
 theiler.62.d: "Tajemnicze obumieranie krzewów herbacianych w Asamie wywołało powszechny niepokój. Najwyraźniej liczne rośliny zostały zaatakowane przez pluskwiaka herbacianego! Wygląda na to, że ten szkodnik rozprzestrzenia się w sposób niepowstrzymany!"
 theiler.62.f: "Pluskwiak herbaciany (rodzaj Helopeltis) to wyjątkowo groźny szkodnik należący do rodziny tasznikowatych (Miridae) i rzędu pluskwiaków (Hemiptera). Pomimo swojej nazwy nie jest komarem, lecz prawdziwym pluskwiakiem, choć jego wydłużone odnóża i czułki nadają mu podobną sylwetkę. Stanowi poważne zagrożenie dla różnych upraw plantacyjnych, przede wszystkim herbaty, kakao i nerkowca. Jego szkodliwość wynika ze specyficznego sposobu żerowania: za pomocą kłująco-ssącego aparatu gębowego atakuje soczyste młode pędy i liście. Podczas żerowania wprowadza do tkanek toksyczną ślinę, która powoduje ich szybką martwicę, objawiającą się charakterystycznymi, zapadniętymi, brunatnoczarnymi plamami. Ze względu na dużą mobilność i szybkie tempo rozmnażania stanowi poważne wyzwanie dla wydajności rolnictwa w regionach tropikalnych."
 theiler.62.g: "Moja bezcenna herbata!"
 theiler.62.tt: "Od teraz [GetHarvestConditionType('theiler_tea_mosquito_condition').GetName] będzie występować w Azji Południowej i Wschodniej."
 theiler.63.t: "Stonka Ziemniaczana w [SCOPE.sState('theiler_state_scope').GetName]!"
 theiler.63.d: "Przyrodnicy i biolodzy przedstawili dziś raport, który zaniepokoił zarówno rolników, jak i handlarzy. Osławiona stonka ziemniaczana, pochodząca z Ameryki Północnej, została po raz pierwszy odkryta na naszych polach. Jeśli jej nie powstrzymamy, może opanować całą Europę!"
 theiler.63.f: "Stonka ziemniaczana została odkryta w latach 20. XIX wieku, a już pod koniec lat 50. XIX wieku rozpoczęła swój niszczycielski marsz od Gór Skalistych aż po wybrzeże Atlantyku. Pokonywała przy tym około 140 kilometrów rocznie, stając się prawdziwą plagą amerykańskich rolników. Przez całe lata 70. XIX wieku i kolejne dekady jej próby przedostania się do Europy wielokrotnie kończyły się niepowodzeniem. Udało jej się pokonać ocean dopiero w latach 20. XX wieku, krótko po tym, jak I wojna światowa poważnie nadwyrężyła zasoby Starego Kontynentu."
 theiler.63.g: "Moje bezcenne ziemniaki!"
 theiler.63.tt: "Od teraz [GetHarvestConditionType('theiler_potato_beetle_condition').GetName] będzie występować w Ameryce Północnej."
 theiler.64.t: "Stonka Ziemniaczana"
 theiler.64.d: "W regionie [SCOPE.sState('theiler_state_scope').GetName] pojawił się nowy szkodnik: stonka ziemniaczana, która dotychczas żywiła się psianką rożkową, lecz wskutek kontaktu z amerykańskim rolnictwem nabrała wilczego apetytu na ziemniaki. Najwyraźniej nic nie jest w stanie powstrzymać tego żarłocznego owada!"
 theiler.64.f: "Stonka ziemniaczana (Leptinotarsa decemlineata) to osławiony szkodnik rolniczy należący do rodziny stonkowatych (Chrysomelidae). Można ją łatwo rozpoznać po żółtopomarańczowym pancerzu i dziesięciu czarnych podłużnych pasach. Stanowi poważne zagrożenie dla roślin z rodziny psiankowatych, zwłaszcza ziemniaków. Jej status groźnego szkodnika wynika z niszczycielskiego sposobu żerowania: zarówno dorosłe osobniki, jak i larwy są niezwykle żarłoczne i potrafią ogołocić całe rośliny z liści, doprowadzając do całkowitej utraty plonów. Oprócz bezpośrednich szkód gatunek ten ma znaczenie w skali globalnej ze względu na szybkie przystosowywanie się i wysoką odporność na chemiczne środki owadobójcze. Pochodzi z Ameryki Północnej, ale stał się szkodnikiem o zasięgu niemal ogólnoświatowym, wywierając znaczący wpływ na globalne bezpieczeństwo żywnościowe.\n\n #p Szanse na powstrzymanie inwazji szkodnika zwiększają następujące czynniki: Biolog, Chemik i technologie pestycydowe. #!"
 theiler.65.t: "Owocówki Jabłkóweczki Szaleją!"
 theiler.65.d: "Owocówka jabłkóweczka rozszerzyła swój zasięg występowania: z sąsiedniego regionu rozprzestrzeniła się również na [SCOPE.sState('theiler_state_scope').GetName], by zaatakować tamtejsze sady. Wygląda na to, że nic nie jest w stanie powstrzymać tego szkodnika w jego marszu przez całą Amerykę Północną!"
 theiler.65.f: "Owocówka jabłkóweczka (Cydia pomonella) pochodzi z Eurazji i w XIX wieku rozprzestrzeniła się wraz z uprawą jabłoni w Europie Środkowej, północnych Włoszech, na Bałkanach, Węgrzech, zachodnich częściach Rosji położonych na zachód od Uralu, w Ameryce Północnej i Australii. Regiony nordyckie, obszary o bardzo gorącym klimacie oraz tereny suche w dużej mierze uniknęły jej występowania. W XX wieku dotarła do niemal wszystkich umiarkowanych regionów świata, w których uprawiano jabłonie, w tym do Skandynawii, krajów bałtyckich i Ameryki Południowej, stając się jednym z najważniejszych szkodników sadowniczych."
 theiler.65.g: "Zmobilizuj wszystkie dostępne środki, aby powstrzymać rozprzestrzenianie się szkodnika!"
 theiler.65.h: "Nasi naukowcy znajdą rozwiązanie."
 theiler.65.i: "Będziemy musieli przyzwyczaić się do życia z tym szkodnikiem."
 theiler.66.t: "Owocówki Jabłkóweczki w [SCOPE.sState('theiler_state_scope').GetName]!"
 theiler.66.d: "Przyrodnicy i biolodzy przedstawili dziś raport, który zaniepokoił zarówno rolników, jak i handlarzy. Osławiona owocówka jabłkóweczka, pochodząca z Europy i zachodniej Azji, została po raz pierwszy odkryta w naszych sadach. Jeśli jej nie powstrzymamy, może opanować całą Oceanię!"
 theiler.66.f: "Owocówka jabłkóweczka (Cydia pomonella) pochodzi z Eurazji i w XIX wieku rozprzestrzeniła się wraz z uprawą jabłoni w Europie Środkowej, północnych Włoszech, na Bałkanach, Węgrzech, zachodnich częściach Rosji położonych na zachód od Uralu, w Ameryce Północnej i Australii. Regiony nordyckie, obszary o bardzo gorącym klimacie oraz tereny suche w dużej mierze uniknęły jej występowania. W XX wieku dotarła do niemal wszystkich umiarkowanych regionów świata, w których uprawiano jabłonie, w tym do Skandynawii, krajów bałtyckich i Ameryki Południowej, stając się jednym z najważniejszych szkodników sadowniczych.\n\n #p Szanse na powstrzymanie inwazji szkodnika zwiększają następujące czynniki: Biolog, Chemik i Technologie Pestycydowe. #!"
 theiler.67.d: "Przyrodnicy i biolodzy przedstawili dziś raport, który zaniepokoił zarówno rolników, jak i handlarzy. Osławiona owocówka jabłkóweczka, pochodząca z Europy i zachodniej Azji, została po raz pierwszy odkryta w naszych sadach. Jeśli jej nie powstrzymamy, może opanować całą Afrykę Południową!"
 theiler.68.d: "Przyrodnicy i biolodzy przedstawili dziś raport, który zaniepokoił zarówno rolników, jak i handlarzy. Osławiona owocówka jabłkóweczka, pochodząca z Europy i zachodniej Azji, została po raz pierwszy odkryta w naszych sadach. Jeśli jej nie powstrzymamy, może opanować całą Amerykę Południową!"
 theiler.69.t: "Powstrzymano Szkodnika"
 theiler.69.d: "Zwalczanie szkodnika w regionie [SCOPE.sState('theiler_state_scope').GetName] zakończyło się spektakularnym sukcesem. Społeczeństwo z aprobatą ocenia działania mające na celu powstrzymanie jego rozprzestrzeniania się i przypisuje ich powodzenie zdecydowanym działaniom rządu. Przez co najmniej kilka najbliższych lat możemy czuć się bezpieczni przed kolejną inwazją."
 theiler.69.f: "Po skutecznym wytępieniu szkodnika zaatakowany region pozostaje bezpieczny przez dziesięć lat. Po upływie tego czasu szkodnik może ponownie podjąć próbę opanowania nowych obszarów w tym regionie, potencjalnie za pośrednictwem innego kraju posiadającego port i preferowane przez niego źródło pożywienia."
 theiler.69.g: "Chwała rządowi!"
 theiler.70.t: "Inwazja Szkodnika"
 theiler.70.d: "Próby powstrzymania nowo przybyłego szkodnika w regionie [SCOPE.sState('theiler_state_scope').GetName] zakończyły się całkowitym fiaskiem. Najwyraźniej nic nie jest w stanie zatrzymać jego triumfalnego marszu przez cały kraj i poza jego granice. Nasza reputacja legła w gruzach, a społeczeństwo obwinia rząd za tę katastrofalną porażkę."
 theiler.70.f: "Gdy szkodnikowi uda się już dokonać inwazji, nie można go powstrzymać: dopóki nie zostanie wynaleziony skuteczny środek zaradczy, będzie regularnie siać spustoszenie, tak jak na obszarze swojego naturalnego występowania."
 theiler.70.g: "Precz z rządem!"
