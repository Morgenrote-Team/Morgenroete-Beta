 je_theiler_medicinal_plant_quinine: "Cinchona Pubescens"
 je_theiler_medicinal_plant_quinine_reason: "Proces opracowywania nowego leku zazwyczaj przebiega następująco: w zależności od poziomu Technik Medycznych [concept_panum_physician] proponuje pozyskanie określonych [concept_ito_medicinal_plants] do celów leczniczych, w tym przypadku co najmniej #V 5 [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]#!. [concept_dubois_naturalist] otrzymuje zadanie zebrania wystarczającej liczby próbek do wyizolowania substancji czynnej. Następnie [concept_mendelejew_chemist] wyodrębnia tę substancję chemiczną. Po jej uzyskaniu [concept_theiler_biologist] może wyprodukować lek.\n\nCinchona pubescens to drzewo pochodzące z Ameryki Południowej, zwłaszcza z obszarów andyjskich. Jego kora zawiera chininę i inne alkaloidy o silnym działaniu przeciwmalarycznym. Tradycyjnie korę stosowano w leczeniu gorączki i malarii. Także dziś chinina i jej pochodne odgrywają ważną rolę w leczeniu malarii. Drzewo to uprawia się również w regionach tropikalnych w celu pozyskiwania kory o właściwościach leczniczych."
 je_theiler_medicinal_plant_quinine_success: "[GetPlayer.GetName] ma w zbiorach co najmniej #V 5 okazów Cinchona Pubescens#!."
 je_theiler_medicinal_plant_thymol: "Thymus Vulgaris"
 je_theiler_medicinal_plant_thymol_reason: "Proces opracowywania nowego leku zazwyczaj przebiega następująco: w zależności od poziomu Technik Medycznych [concept_panum_physician] proponuje pozyskanie określonych [concept_ito_medicinal_plants] do celów leczniczych, w tym przypadku co najmniej #V 5 [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]#!. [concept_dubois_naturalist] otrzymuje zadanie zebrania wystarczającej liczby próbek do wyizolowania substancji czynnej. Następnie [concept_mendelejew_chemist] wyodrębnia tę substancję chemiczną. Po jej uzyskaniu [concept_theiler_biologist] może wyprodukować lek.\n\nThymus vulgaris, czyli tymianek pospolity, to niewielka wieloletnia roślina zielarska pochodząca z rejonu Morza Śródziemnego. Jej liście i pozyskiwany z niej olejek zawierają tymol, karwakrol oraz inne składniki olejków eterycznych o właściwościach przeciwdrobnoustrojowych, przeciwutleniających i przeciwzapalnych. Tradycyjnie tymianek stosowano w leczeniu zakażeń dróg oddechowych, kaszlu i dolegliwości trawiennych. Jest powszechnie wykorzystywany w ziołolecznictwie i aromaterapii, a także jako naturalny środek konserwujący lub dodatek smakowy do żywności."
 je_theiler_medicinal_plant_thymol_success: "[GetPlayer.GetName] ma w zbiorach co najmniej #V 5 okazów Thymus Vulgaris#!."
 je_theiler_medicinal_plant_pilocarpine: "Pilocarpusp Pennatifolius"
 je_theiler_medicinal_plant_pilocarpine_reason: "Proces opracowywania nowego leku zazwyczaj przebiega następująco: w zależności od poziomu Technik Medycznych [concept_panum_physician] proponuje pozyskanie określonych [concept_ito_medicinal_plants] do celów leczniczych, w tym przypadku co najmniej #V 5 [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]#!. [concept_dubois_naturalist] otrzymuje zadanie zebrania wystarczającej liczby próbek do wyizolowania substancji czynnej. Następnie [concept_mendelejew_chemist] wyodrębnia tę substancję chemiczną. Po jej uzyskaniu [concept_theiler_biologist] może wyprodukować lek.\n\nPilocarpus pennatifolius to tropikalny krzew pochodzący z Brazylii. Jego liście zawierają alkaloid pilokarpinę, która pobudza pracę gruczołów ślinowych i potowych. Tradycyjnie stosowano go w leczeniu suchości jamy ustnej i chorób oczu. We współczesnej medycynie pilokarpinę wykorzystuje się w leczeniu jaskry, ponieważ obniża ciśnienie wewnątrzgałkowe, oraz kserostomii (suchości jamy ustnej) wywołanej napromienianiem lub lekami. Roślina ta jest ceniona przede wszystkim ze względu na zawarte w niej alkaloidy o działaniu farmakologicznym."
 je_theiler_medicinal_plant_pilocarpine_success: "[GetPlayer.GetName] ma w zbiorach co najmniej #V 5 okazów Pilocarpusp Pennatifolius#!."
 je_theiler_medicinal_plant_ephedrine: "Ephedra Sinica"
 je_theiler_medicinal_plant_ephedrine_reason: "Proces opracowywania nowego leku zazwyczaj przebiega następująco: w zależności od poziomu Technik Medycznych [concept_panum_physician] proponuje pozyskanie określonych [concept_ito_medicinal_plants] do celów leczniczych, w tym przypadku co najmniej #V 5 [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]#!. [concept_dubois_naturalist] otrzymuje zadanie zebrania wystarczającej liczby próbek do wyizolowania substancji czynnej. Następnie [concept_mendelejew_chemist] wyodrębnia tę substancję chemiczną. Po jej uzyskaniu [concept_theiler_biologist] może wyprodukować lek.\n\nEphedra sinica, znana również jako ma huang, to krzew pochodzący z Chin i Azji Środkowej. Jego łodygi zawierają efedrynę i pseudoefedrynę, alkaloidy pobudzające układ nerwowy i rozszerzające oskrzela. W medycynie chińskiej stosowano go w leczeniu astmy, zapalenia oskrzeli i niedrożności nosa. Jego stosowanie jest ograniczone ze względu na ryzyko nadciśnienia, zaburzeń pracy serca i innych skutków ubocznych."
 je_theiler_medicinal_plant_ephedrine_success: "[GetPlayer.GetName] ma w zbiorach co najmniej #V 5 okazów Ephedra Sinica#!."
 je_theiler_medicinal_plant_strophantine: "Strophanthus Gratus"
 je_theiler_medicinal_plant_strophantine_reason: "Proces opracowywania nowego leku zazwyczaj przebiega następująco: w zależności od poziomu Technik Medycznych [concept_panum_physician] proponuje pozyskanie określonych [concept_ito_medicinal_plants] do celów leczniczych, w tym przypadku co najmniej #V 5 [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]#!. [concept_dubois_naturalist] otrzymuje zadanie zebrania wystarczającej liczby próbek do wyizolowania substancji czynnej. Następnie [concept_mendelejew_chemist] wyodrębnia tę substancję chemiczną. Po jej uzyskaniu [concept_theiler_biologist] może wyprodukować lek.\n\nStrophanthus gratus to pnącze pochodzące z Afryki Zachodniej. Jego nasiona zawierają glikozydy nasercowe, takie jak ouabaina, które silnie oddziałują na skurcze serca. Tradycyjnie wyciągi z tej rośliny stosowano jako truciznę do zatruwania strzał, a w małych dawkach także w leczeniu chorób serca. Badano zastosowanie ouabainy w leczeniu niewydolności serca i zaburzeń jego rytmu."
 je_theiler_medicinal_plant_strophantine_success: "[GetPlayer.GetName] ma w zbiorach co najmniej #V 5 okazów Strophanthus Gratus#!."
