 theiler.52.t: "Badania nad Szczepionkami"
 theiler.52.d: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] podjął się opracowania przełomowej szczepionki, która pozwoli uwolnić ludzkość od jednej z jej plag. Nie ustalono jednak jeszcze, przeciwko której chorobie zostanie opracowana szczepionka."
 theiler.52.f: "Szczepionki są najpotężniejszą bronią medycyny i biologii w walce z chorobami. Przy sprawnie działającym systemie opieki zdrowotnej mogą całkowicie zapobiegać występowaniu chorób. Zanim będzie można opracować szczepionkę, biologowie muszą zbadać odpowiedni patogen. Niektóre szczepionki wymagają spełnienia dodatkowych warunków technologicznych — na przykład szczepionki przeciwko tyfusowi, żółtej febrze i błonicy wymagają genetyki."
