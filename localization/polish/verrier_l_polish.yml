 verrier.90.many_universe_loc: "We wszechświecie istnieją różne galaktyki (Głosy: [GetGlobalVariable('verrier_galaxies_yes').GetValue|+0] do [GetGlobalVariable('verrier_galaxies_no').GetValue|V0])\n"
 verrier.90.sun_center_loc: "Słońce znajduje się w centralnym obszarze Drogi Mlecznej (Głosy: [GetGlobalVariable('verrier_sun_center_yes').GetValue|+0] do [GetGlobalVariable('verrier_sun_center_no').GetValue|V0])"
 verrier.90.sun_outer_loc: "Słońce znajduje się w zewnętrznym obszarze Drogi Mlecznej (Głosy: [GetGlobalVariable('verrier_sun_center_no').GetValue|+0] do [GetGlobalVariable('verrier_sun_center_yes').GetValue|V0])"
 verrier.90.g: "Nauka nigdy nie mówi ostatniego słowa."
