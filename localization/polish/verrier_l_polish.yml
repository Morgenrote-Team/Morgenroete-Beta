 verrier_academic_synergies_modifier: "Synergia Naukowa"
 verrier_neptune_buy_additional_instruments_button: "Kup dodatkowe Instrumenty"
 verrier_neptune_buy_additional_instruments_button_desc: "Astronom może kupić nowe urządzenia pomiarowe i instrumenty naukowe, aby znacznie usprawnić badania astronomiczne."
 verrier_neptune_star_chart_button: "Wymień Mapy Nieba"
 verrier_neptune_star_chart_button_desc: "Jeśli jesteśmy w sojuszu z obcym mocarstwem, które również posiada obserwatorium i astronoma, obaj astronomowie mogą jednorazowo wymienić się mapami nieba."
 verrier_neptune_modern_telescope_button: "Ulepsz Teleskop"
 verrier_neptune_academic_synergies_button: "Synergia Naukowa"
 verrier_neptune_academic_synergies_button_desc: "Skupiając cały wysiłek naukowy na poszukiwaniu nieznanej planety, możemy znacznie szybciej osiągnąć sukces i wyprzedzić konkurentów. Oczywiście odbije się to na innych dziedzinach nauki rozwijanych na naszych uczelniach technicznych. Awansowanie astronoma na tym etapie przyspieszy również pozyskiwanie funduszy."
 verrier_neptune_star_chart_tt: "Sojuszniczy kraj musi odkryć co najmniej #G 5#! @verrier_astronomicalobject! [concept_verrier_astronomical_object]."
 verrier.142.t: "Rozbłysk słoneczny"
 verrier.142.d: "Podczas obserwacji rozbłysków słonecznych [GetPlayer.MakeScope.Var('verrier_astronomer_var').GetCharacter.GetFullName] dostrzegł niezwykle nietypowe zjawisko. Jeśli [SCOPE.sCharacter('verrier_astronomer_var').GetHerHis] teoria jest słuszna, ku Ziemi pędzi burza słoneczna. Z jednej strony jest to sensacyjne odkrycie o przełomowym znaczeniu naukowym. Z drugiej jednak może oznaczać niebezpieczeństwo."
 verrier.142.f: "Rozbłysk słoneczny to zjawisko wzmożonej emisji promieniowania w chromosferze Słońca, zasilane energią pola magnetycznego. W widmie absorpcyjnym obszaru rozbłysku oprócz wodoru widoczne są zwykle hel i wapń. Obszary te emitują wzmożone promieniowanie krótkofalowe w zakresie ultrafioletowym i rentgenowskim, a także protony, elektrony i jony. Na Ziemi powoduje to zaburzenia jonosfery, które zakłócają łączność radiową. Gdy cząstki docierają do ziemskiej atmosfery, wywołują burze magnetyczne. Burze jonosferyczne występują, gdy cząstki powoli przenikające do stref zorzowych sprawiają, że nocą widoczne są zorze polarne, a silnie zmienne prądy elektryczne powodują zaburzenia geomagnetyczne."
 verrier.142.g: "Co to oznacza, Profesorze?"
 verrier.143.t: "Zdarzenie [SCOPE.sCharacter('verrier_carrington_discoverer').GetLastName]"
 verrier.143.d: "Ziemię nawiedziła burza magnetyczna! To niezwykłe zjawisko przyrodnicze sprawiło, że zorze polarne są widoczne nawet w Rzymie, Hawanie i Chinach. Ludzie z zachwytem podziwiają to niebiańskie widowisko. Najwyraźniej ma ono związek z rozbłyskiem słonecznym odkrytym przez Astronoma [SCOPE.sCharacter('verrier_carrington_discoverer').GetFullName]."
 verrier.143.f: "Od 28 sierpnia do 4 września 1859 roku doszło do kilku potężnych rozbłysków słonecznych, obserwowanych między innymi przez astronoma Richarda Carringtona. Materia wyrzucona podczas koronalnych wyrzutów masy poruszała się z prędkością ponad 2000 km/s. Dotarła do Ziemi około 17.5 godziny później. W nocy z 1 na 2 września odnotowano najsilniejszą dotychczas burzę geomagnetyczną. Zorze polarne obserwowano na całym świecie, zarówno na półkuli północnej, jak i południowej. Zorza nad Górami Skalistymi w Stanach Zjednoczonych była tak jasna, że jej blask obudził poszukiwaczy złota, którzy zaczęli przygotowywać śniadanie, sądząc, że nastał poranek. Mieszkańcy północno-wschodniej części Stanów Zjednoczonych mogli przy jej świetle czytać gazety. Zorza była widoczna od biegunów aż po obszary o niskich szerokościach geograficznych, takie jak południowo-środkowy Meksyk, Kuba, Hawaje, Queensland, południowa Japonia i Chiny, a nawet jeszcze bliżej równika, między innymi w Kolumbii."
 verrier.143.g: "To przerażające i fantastyczne zarazem."
 verrier.144.t: "Sieć Telegraficzna przestaje działać"
 verrier.144.d: "Prądy indukowane geomagnetycznie przez pole elektromagnetyczne spowodowały awarie sieci telegraficznych w całej Europie i Ameryce Północnej, a niektórzy operatorzy zostali porażeni prądem. W liniach telegraficznych indukowały się tak wysokie napięcia, że iskry zapalały papierowe taśmy w odbiornikach. Niektórzy operatorzy mogli nadal wysyłać i odbierać wiadomości mimo odłączenia źródeł zasilania."
 verrier.144.f: "Operator z Bostonu (do operatora z Portland): „Proszę całkowicie odłączyć baterię na piętnaście minut”.\nOperator z Portland: „Tak zrobię. Bateria jest już odłączona”.\nBoston: „Moja też jest odłączona i pracujemy dzięki prądowi wywołanemu przez zorzę. Jak odbieracie mój przekaz?”\nPortland: „Lepiej niż przy włączonych bateriach. Natężenie prądu stopniowo rośnie i maleje”.\nBoston: „U mnie prąd bywa bardzo silny i możemy pracować lepiej bez baterii, ponieważ zorza zdaje się na przemian osłabiać i wzmacniać ich działanie, przez co prąd bywa zbyt silny dla elektromagnesów naszych przekaźników. Proponuję pracować bez baterii, dopóki utrzymują się te zakłócenia”.\nPortland: „Bardzo dobrze. Czy mam przystąpić do przesyłania wiadomości?”\nBoston: „Tak. Proszę zaczynać”."
 verrier.144.g: "Telegrafy działają bez prądu?! To zupełnie niemożliwe!"
 verrier.9010.t: "Dźwięk Nauki"
 verrier.9010.d: "Profesor uniwersytetu w mieście [SCOPE.sState('sound_of_science_state').GetCityHubName] wykazał słuszność teorii, którą sformułował #variable Christian Doppler#!: obserwowana częstotliwość dźwięku lub światła zmienia się, jeśli źródło lub obserwator znajduje się w ruchu."
 verrier.9010.f: "Pędzący pociąg, donośnie brzmiący blaszany róg i tuzin osób obdarzonych słuchem absolutnym spotkały się na linii kolejowej #bold #variable [SCOPE.sState('sound_of_science_state').GetFarmHubName]-[SCOPE.sState('sound_of_science_state').GetCityHubName]#!#!, by przeprowadzić pomysłowy eksperyment. Co było stawką? Teoria Dopplera dotycząca ruchu gwiazd. Jeśli bowiem teoria, według której częstotliwość fali zmienia się wraz z prędkością obiektu, jest słuszna, to gdy pociąg przemknie obok widzów, powinni oni usłyszeć wyraźne obniżenie tonu rogu.\nWybrani ze względu na zdolność wychwycenia nawet 1/8 tonu różnicy, widzowie starannie zapisują swoje obserwacje, gdy pociąg pędzi obok nich. Teraz, po 3 dniach zestawiania danych, są już wyniki... I... Wszyscy zgodnie odnotowali obniżenie tonu!"
 verrier.9010.g: "Obserwacja i eksperymentowanie stanowią fundament wiedzy."
 verrier.9010.h: "Nigdy nie wiadomo, jak nieoczekiwane zastosowanie może znaleźć nowo odkryta prawda."
 verrier_sound_of_science_prestige_modifier: "Dźwięk Nauki"
 verrier_sound_of_science_tech_spread_modifier: "Dźwięk Nauki"
 je_verrier_uranus: "Kolejna Planeta?"
 je_verrier_uranus_reason: "Czy to możliwe, że istnieje jeszcze jedna planeta? Przez stulecia znano tylko 6 planet, ale dzięki niedawnym udoskonaleniom teleskopów odkrycie kolejnej jest całkiem prawdopodobne. A dlaczego mielibyśmy poprzestać na 7? Może jest ich jeszcze więcej! Odkrywanie kolejnych planet może nawet pomóc rozwikłać tajemnice wszechświata.\n\n#b Kontekst Historyczny:#! Te 6 planet znano od dawna, ponieważ dzięki ich jasności łatwo było je obserwować nawet gołym okiem. Uran, Neptun i Pluton są natomiast mniej jasne. Choć w odpowiednich warunkach Urana można dostrzec gołym okiem, jego powolny ruch orbitalny sprawiał, że wielu astronomów uważało go za gwiazdę stałą."
 je_verrier_uranus_goal: "Aby ustalić, czy istnieje kolejna planeta, musimy odkryć [JournalEntry.GetTotalGoalValue|0+] @verrier_astronomicalobject! [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects|q$')]."
 je_verrier_uranus_fail: "Jeśli inny kraj spełni wymagania przed nami, może odkryć nową planetę lub dojść do wniosku, że istnieje tylko 6 planet."
 verrier.12.t: "Nowa Planeta!"
 verrier.12.d: "[SCOPE.sCharacter('verrier_astronomer_scope').GetFullName] odkrył nieznaną dotąd planetę, którą nazwano Uranem! Nikt nie spodziewał się takiego wydarzenia."
 verrier.12.f: "[SCOPE.sCharacter('verrier_astronomer_scope').GetFullName] początkowo sądził, że odkrył nową kometę. Dopiero po kilku tygodniach stało się jasne, że to w rzeczywistości nowa planeta! Aż trudno uwierzyć, że wcześniej właściwie nie dopuszczano możliwości istnienia kolejnej planety. Teraz jednak, po odkryciu Urana, wielu zastanawia się, czy planet może być jeszcze więcej.\n\n#b Kontekst Historyczny:#! Dopiero w 1781 roku Wilhelm Herschel przypadkowo natknął się na Urana. Początkowo uznał go za kometę, bo dlaczego miałoby istnieć więcej planet niż te powszechnie znane? W ciągu kolejnych 3 miesięcy środowisko naukowe zrozumiało jednak, że rzeczywiście jest to nowa planeta."
 verrier.12.g: "Niewiarygodne! Czy możliwe, że planet jest jeszcze więcej?"
 verrier.13.d: "Sensacja! Astronom z [SCOPE.sCountry('verrier_uranus_discoverer_country').GetName] odkrył nową planetę, którą nazwano Uranem. A skoro istnieje jeszcze jedna, być może uda nam się odkryć kolejne!"
 verrier.13.g: "Skoro jest ich więcej niż 6, być może czekają na nas kolejne planety do odkrycia!"
 verrier_uranus_discoverer_modifier: "Odkrywca Urana"
 je_verrier_dwarf_planets: "Niebiańska Policja"
 je_verrier_dwarf_planets_reason: "Uwaga: Ten Wpis w Dzienniku można ukończyć wielokrotnie.\n\nOdkrycie Urana otworzyło perspektywę odnalezienia kolejnych planet. Ponieważ w rozległym obszarze między Marsem a Jowiszem nie ma żadnej znanej planety, astronomowie mają nadzieję właśnie tam odkryć następną. W tym celu powołali Niebiańską Policję — sieć obserwatoriów współpracujących przy jej poszukiwaniu.\n\n#b Kontekst Historyczny:#! Niebiańska Policja (niem. Himmelspolizey) była porozumieniem licznych europejskich astronomów z początku XIX wieku. Znana jest przede wszystkim z poszukiwań obiektów, których istnienia spodziewano się między orbitami Marsa i Jowisza. Powstała w 1800 roku podczas drugiego europejskiego kongresu astronomów."
 je_verrier_dwarf_planets_goal: "Aby mieć szansę na odnalezienie nowej planety, musimy odkryć [JournalEntry.GetGoalAddValue|0+] @verrier_astronomicalobject! [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects|q$')]."
 verrier.14.t: "Odkrycie Ceres"
 verrier.14.d: "[SCOPE.sCharacter('verrier_astronomer_scope').GetFullName] odkrył nieznaną dotąd planetę w Obszarze między Marsem a Jowiszem. To wielkie odkrycie!"
 verrier.14.f: "#b Kontekst Historyczny:#! Astronomowie od dawna podejrzewali istnienie kolejnej planety w luce między Marsem a Jowiszem. Dlatego powołano Niebiańską Policję, a obszar nieba podzielono na części i przydzielono poszczególnym obserwatoriom.\nW noc noworoczną 1801 roku Giuseppe Piazzi przypadkowo odkrył Ceres podczas pracy nad katalogiem gwiazd."
 verrier.14.g: "Ciekawe, ile jeszcze planet istnieje?"
 verrier_ceres_discoverer_modifier: "Odkrywca Ceres"
 notification_verrier_ceres_discovered_notification_name: "Odkrycie Ceres"
 notification_verrier_ceres_discovered_notification_desc: "Dr. [SCOPE.sCharacter('verrier_astronomer_scope').GetLastName] dokonał niezwykłego odkrycia — odnalazł nową planetę w Układzie Słonecznym. Otrzyma ona nazwę Ceres i znajduje się między Marsem a Jowiszem."
 verrier.15.t: "Odkryto Pallas"
 verrier.15.d: "[SCOPE.sCharacter('verrier_astronomer_scope').GetFullName] odkrył nieznaną dotąd planetę w Obszarze między Marsem a Jowiszem. To wielkie odkrycie!"
 verrier.15.f: "#b Kontekst Historyczny:#! Gdy odkryto Ceres między Marsem a Jowiszem, nikt nie spodziewał się istnienia kolejnej planety w tym samym obszarze. Wielkim zaskoczeniem było więc odkrycie nowej planety przez Heinricha Wilhelma Olbersa podczas poszukiwań Ceres. Odkrycie Pallas skłoniło Niebiańską Policję do poszukiwania innych planet w tym samym obszarze, co przyniosło rezultaty już kilka lat później."
 verrier_pallas_discoverer_modifier: "Odkrywca Pallas"
 notification_verrier_pallas_discovered_notification_name: "Odkryto Pallas"
 notification_verrier_pallas_discovered_notification_desc: "Dr. [SCOPE.sCharacter('verrier_astronomer_scope').GetLastName] dokonał niezwykłego odkrycia — odnalazł nową planetę w Układzie Słonecznym. Otrzyma ona nazwę Pallas i znajduje się między Marsem a Jowiszem."
 verrier.16.t: "Odkryto Westę"
 verrier.16.d: "[SCOPE.sCharacter('verrier_astronomer_scope').GetFullName] odkrył nieznaną dotąd planetę w Obszarze między Marsem a Jowiszem. To wielkie odkrycie!"
 verrier.16.f: "#b Kontekst Historyczny:#! Gdy Heinrich Wilhelm Olbers odkrył swoją drugą planetę w 1807 roku, poprosił Carla Friedricha Gaußa o nadanie jej nazwy. Nazwana Westą, była czwartą planetą odkrytą w obszarze między Marsem a Jowiszem i przez około 40 lat pozostawała ostatnią."
 verrier_vesta_discoverer_modifier: "Odkrycie Westy"
 notification_verrier_vesta_discovered_notification_name: "Odkryto Westę"
 notification_verrier_vesta_discovered_notification_desc: "Dr. [SCOPE.sCharacter('verrier_astronomer_scope').GetLastName] dokonał niezwykłego odkrycia — odnalazł nową planetę w Układzie Słonecznym. Otrzyma ona nazwę Westa i znajduje się między Marsem a Jowiszem."
 verrier.17.t: "Juno odkryte"
 verrier.17.d: "[SCOPE.sCharacter('verrier_astronomer_scope').GetFullName] odkrył nieznaną dotąd planetę w Obszarze między Marsem a Jowiszem. To wielkie odkrycie!"
 verrier.17.f: "#b Kontekst Historyczny:#! Po odkryciu Ceres w 1801 roku i Pallas w 1802 roku minęły zaledwie 2 kolejne lata, zanim Karl Ludwig Hardwig odnalazł Juno w tym samym obszarze między Marsem a Jowiszem. Wszystkie trzy, podobnie jak Westa (odkryta w 1807 roku), przez pewien czas zachowały status planet. Z czasem odkrywano jednak coraz więcej planetoid, które również uznawano za planety. Wówczas astronomowie zdecydowali, że żaden z tych obiektów nie jest prawdziwą planetą."
 verrier_juno_discoverer_modifier: "Odkrywca Juno"
 notification_verrier_juno_discovered_notification_name: "Odkryto Juno"
 notification_verrier_juno_discovered_notification_desc: "Dr. [SCOPE.sCharacter('verrier_astronomer_scope').GetLastName] dokonał niezwykłego odkrycia — odnalazł nową planetę w Układzie Słonecznym. Otrzyma ona nazwę Juno i znajduje się między Marsem a Jowiszem."
 je_verrier_neptune_goal: "Odkrycie Nieznanej Planety wymaga szczegółowego zbadania gwiaździstego nieba. Po odkryciu [JournalEntry.GetTotalGoalValue|0+] @verrier_astronomicalobject! [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects|q$')] być może uda nam się odnaleźć planetę."
 je_verrier_pluto_goal: "Odkrycie Planety X wymaga szczegółowego zbadania gwiaździstego nieba. Po odkryciu [JournalEntry.GetTotalGoalValue|0+] @verrier_astronomicalobject! [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects|q$')] być może uda nam się odnaleźć planetę."
 MR_ASTEROID_CONGRESS_DWARF_PLANETS_TT: "#default_text #V Ceres#!, #V Pallas#!, #V Westa#! i #V Juno#! zostały odkryte.#!"
 je_verrier_astro_physics: "Astrofizyka"
 je_verrier_astro_physics_reason: "Nowe odkrycia w dziedzinie fizyki zrewolucjonizowały świat nauki. Nie pozostały bez wpływu również na astronomię. Obie dyscypliny łączy owocna wymiana wiedzy, a fizyka teoretyczna i obserwacyjna mogą przyczynić się do lepszego zrozumienia wszechświata."
 verrier_astro_physics_tech: "Astrofizyka"
 verrier_astro_physics_tech_desc: "Astrofizyka to nauka wykorzystująca metody i zasady fizyki oraz chemii do badania obiektów i zjawisk astronomicznych. Jak powiedział jeden z twórców tej dyscypliny, James Keeler, astrofizyka „dąży do poznania natury ciał niebieskich, a nie ich położenia czy ruchu w przestrzeni — tego, czym są, a nie tego, gdzie się znajdują”."
 verrier_modern_physics_tech: "Fizyka Współczesna"
 verrier_modern_physics_tech_desc: "Fizyka współczesna to dziedzina fizyki, która rozwinęła się na początku XX wieku. Do jej najważniejszych gałęzi należą mechanika kwantowa, szczególna teoria względności i ogólna teoria względności. Zajmuje się zjawiskami zachodzącymi w skrajnych warunkach, takich jak prędkości porównywalne z prędkością światła, odległości porównywalne z promieniem atomu i bardzo wysokie energie."
 verrier_nuclear_physics_tech: "Fizyka Jądrowa"
 verrier_nuclear_physics_tech_desc: "Fizyka jądrowa to dziedzina fizyki zajmująca się budową i zachowaniem jąder atomowych. Jej celem jest poznanie szczegółowej struktury jąder oraz reakcji, którym podlegają. W tym celu bada się doświadczalnie i teoretycznie między innymi samorzutne przemiany jąder (promieniotwórczość), procesy rozpraszania na jądrach oraz reakcje jądrowe. Badania z zakresu fizyki jądrowej stanowią podstawę technologii wykorzystujących rozszczepienie i syntezę jąder atomowych."
 verrier_first_sun_photo_modifier: "Pierwsze Zdjęcie Zaćmienia Słońca"
 verrier_helium_discovered_modifier: "Słoneczny Pierwiastek"
 verrier_comet_observer: "Obserwator Komet"
 verrier_comet_observer_desc: "Ten astronom odkrył Wielką Kometę, którą nazwano na jego cześć."
 verrier_magnetic_storm_observer: "Obserwator Burz Magnetycznych"
 verrier_magnetic_storm_observer_desc: "Ten astronom uważnie obserwował i badał burzę magnetyczną wywołaną rozbłyskiem słonecznym."
 verrier_solar_observer: "Obserwator Słońca"
 verrier_solar_observer_desc: "Ten astronom obserwował zaćmienie Słońca i zdobył cenną wiedzę naukową."
 verrier.152.t: "Zaćmienie Słoneczne"
 verrier.152.d: "W tym roku miało miejsce rzadkie zjawisko: nad miastem [ROOT.GetCountry.GetCapital.GetCityHubName] nastąpiło całkowite zaćmienie Słońca. [GetPlayer.MakeScope.Var('verrier_astronomer_var').GetCharacter.GetFullName] miał wyjątkową okazję, by dokładniej je obserwować."
 verrier.152.f: "Zaćmienie Słońca to zjawisko astronomiczne, podczas którego Księżyc częściowo lub całkowicie zasłania Słońce widziane z określonych obszarów Ziemi. Cień Księżyca przesuwa się wówczas po powierzchni Ziemi, co jest możliwe jedynie podczas nowiu. Zaćmienia Słońca często wykorzystywano do zdobywania nowej wiedzy o samym Słońcu, a także o całym wszechświecie. Szczególną uwagę przyciągnęło całkowite zaćmienie Słońca z 29 maja 1919 roku, obserwowane na afrykańskiej Wyspie Książęcej przez wyprawę pod kierunkiem Arthura Stanleya Eddingtona. Wiązało się ono z opracowaną kilka lat wcześniej przez Alberta Einsteina teorią względności, która przewidywała między innymi ugięcie światła odległych gwiazd w polu grawitacyjnym Słońca — co potwierdziły obserwacje."
 verrier.152.g: "Bardzo rzadkie zjawisko!"
 verrier.153.t: "Perły [GetPlayer.MakeScope.Var('verrier_astronomer_var').GetCharacter.GetLastName]"
 verrier.153.d: "Nasz astronom, [GetPlayer.MakeScope.Var('verrier_astronomer_var').GetCharacter.GetFullName], miał podczas ostatniego zaćmienia Słońca wyjątkową okazję do dokładniejszego przyjrzenia się koronie słonecznej i wyraźnie widocznym obiektom. Uczony uznał je za części atmosfery słonecznej."
 verrier.153.f: "Perły Baily’ego, pierścień z diamentem i rzadszy podwójny pierścień z diamentem to efekty towarzyszące całkowitym i obrączkowym zaćmieniom Słońca. Choć mają wspólną przyczynę, stanowią odrębne zjawiska występujące podczas tych zaćmień. Gdy Księżyc zasłania Słońce, nierówności terenu na jego krawędzi pozwalają światłu słonecznemu prześwitywać w niektórych miejscach, tworząc świetliste perły, podczas gdy w innych je blokują. Nazwa upamiętnia Francisa Baily’ego, który wyjaśnił te efekty w 1836 roku. Efekt pierścienia z diamentem pojawia się, gdy pozostaje tylko jedna lub dwie perły, przypominające lśniące „diamenty” osadzone w jasnym pierścieniu wokół sylwetki Księżyca."
 verrier.153.g: "To zjawisko powinno zostać nazwane na cześć Dr. [GetPlayer.MakeScope.Var('verrier_astronomer_var').GetCharacter.GetLastName]."
 verrier.154.t: "Pierwsze Zdjęcie Zaćmienia Słońca"
 verrier.154.d: "Dzięki nowej technice Dr. [GetPlayer.MakeScope.Var('verrier_astronomer_var').GetCharacter.GetLastName] zdołał wykonać pierwsze zdjęcie zaćmienia Słońca."
 verrier.154.f: "Fotografowanie tak rzadkiego zjawiska jak całkowite zaćmienie stawiało przed pionierami fotografii szczególne wyzwania, między innymi ogromny kontrast między koroną słoneczną a ciemnym cieniem Księżyca oraz nietypowy kąt, pod którym należało ustawić sprzęt fotograficzny. Przed zaćmieniem z 28 lipca 1851 roku nie wykonano jeszcze żadnego prawidłowo naświetlonego zdjęcia korony słonecznej. Z tej okazji Królewskie Obserwatorium Pruskie w Królewcu zleciło jednemu z najzdolniejszych dagerotypistów w mieście, Johannowi Juliusowi Friedrichowi Berkowskiemu, utrwalenie tego zjawiska na zdjęciu. Obserwatorzy przymocowali niewielki teleskop soczewkowy o średnicy obiektywu sześciu centymetrów do heliometru Fraunhofera o średnicy 15.8 centymetra, a Berkowski wykonał osiemdziesięcioczterosekundową ekspozycję krótko po rozpoczęciu fazy całkowitej."
 verrier.154.g: "Doskonale."
 verrier.155.t: "Słoneczny Pierwiastek"
 verrier.155.d: "Wykorzystując nową technikę spektrograficzną, Dr. [GetPlayer.MakeScope.Var('verrier_astronomer_var').GetCharacter.GetLastName] dokonał niezwykłego odkrycia podczas ostatniego zaćmienia Słońca. Wygląda na to, że [GetPlayer.MakeScope.Var('verrier_astronomer_var').GetCharacter.GetSheHe] odkrył nowy pierwiastek. Początkowo nikt nie traktował [GetPlayer.MakeScope.Var('verrier_astronomer_var').GetCharacter.GetHerHim] poważnie, ale chemik Dr. [GetPlayer.MakeScope.Var('mendelejew_chemist_var').GetCharacter.GetLastName] właśnie potwierdził to odkrycie."
 verrier.155.f: "Pierwszą oznaką istnienia helu była jasna żółta linia widmowa o długości fali 587.49 nanometra, zaobserwowana w widmie chromosfery Słońca. Francuski astronom Jules Janssen dostrzegł ją w Indiach podczas całkowitego zaćmienia Słońca 18 sierpnia 1868 roku. Gdy ogłosił swoje odkrycie, początkowo nikt mu nie uwierzył, ponieważ nigdy wcześniej nie odkryto nowego pierwiastka w kosmosie, zanim potwierdzono jego obecność na Ziemi. 20 października tego samego roku Anglik Norman Lockyer potwierdził obecność żółtej linii w widmie słonecznym i uznał, że odpowiada za nią nieznany dotąd pierwiastek. Ponieważ linia ta znajdowała się bardzo blisko podwójnej linii D Fraunhofera charakterystycznej dla sodu (1.8 nm od jej środka; D2 = 589.00 nm, D1 = 589.60 nm), oznaczył ją jako D3, aby odróżnić ją od linii sodu D1 i D2. Wraz ze swoim angielskim kolegą Edwardem Franklandem zaproponował dla nowego pierwiastka nazwę hel (od greckiego helios — słońce)."
 verrier.155.g: "Hel? Trafna nazwa dla słonecznego pierwiastka!"
