 verrier.142.t: "Rozbłysk słoneczny"
 verrier.142.d: "While observing solar flares, [GetPlayer.MakeScope.Var('verrier_astronomer_var').GetCharacter.GetFullName] noticed a highly unusual phenomenon. If [SCOPE.sCharacter('verrier_astronomer_var').GetHerHis] theory is correct, then a solar storm is racing toward Earth. On the one hand, this is a sensation of groundbreaking scientific significance. However, it could also be dangerous."
 verrier.142.f: "A solar flare is a structure of increased radiation within the Sun's chromosphere that is powered by magnetic field energy. An absorption spectrum of a flare region typically shows helium and calcium in addition to hydrogen. The areas emit increased short-wave radiation in the ultraviolet and X-ray ranges as well as protons, electrons and ions. On Earth, this causes disturbances in the ionosphere with corresponding impairments in radio traffic. When the particles enter the Earth's atmosphere, they cause magnetic storms. Ionospheric storms occur when particles slowly penetrating the aurora zones cause the auroras to be visible at night and strongly fluctuating electrical currents cause geomagnetic disturbances."
 verrier.142.g: "What does that mean, Professor?"
 verrier.143.t: "The [SCOPE.sCharacter('verrier_carrington_discoverer').GetLastName] Event"
 verrier.143.d: "A magnetic storm has hit the Earth! This unique natural event has resulted in the Northern Lights being visible even in Rome, Havana and China. People are amazed by that celestial spectacle. Apparently it has something to do with a solar flare discovered by the Astronomer [SCOPE.sCharacter('verrier_carrington_discoverer').GetFullName]."
 verrier.143.f: "From August 28 to September 4, 1859, several powerful solar flares occurred, observed in particular by the astronomer Richard Carrington. The material ejected from the coronal mass ejections had a speed of over 2000 km/s. This reached Earth about 17.5 hours later. The most powerful geomagnetic storm to date was recorded on the night of September 1st to 2nd. Auroras were seen around the world in both northern and southern hemispheres. The aurora over the Rocky Mountains in the United States was so bright that the glow woke gold miners, who began preparing breakfast because they thought it was morning. People in the northeastern United States could read a newspaper by the aurora's light. The aurora was visible from the poles to low latitude areas such as south-central Mexico, Cuba, Hawaii, Queensland, southern Japan and China, and even at lower latitudes very close to the equator, such as in Colombia."
 verrier.143.g: "This is terrible and fantastic at the same time."
 verrier.144.t: "The Telegraphy System collapses"
 verrier.144.d: "Because of the geomagnetically induced current from the electromagnetic field, telegraph systems all over Europe and North America failed, in some cases giving their operators electric shocks. Such high voltages were induced in telegraph lines that strips of paper in the receivers were set on fire by sparks. Some operators were able to continue to send and receive messages despite having disconnected their power supplies."
 verrier.144.f: "Boston operator (to Portland operator): 'Please cut off your battery entirely for fifteen minutes.'\nPortland operator: 'Will do so. It is now disconnected.'\nBoston: 'Mine is disconnected, and we are working with the auroral current. How do you receive my writing?'\nPortland: 'Better than with our batteries on. Current comes and goes gradually.'\nBoston: 'My current is very strong at times, and we can work better without the batteries, as the aurora seems to neutralize and augment our batteries alternately, making current too strong at times for our relay magnets. Suppose we work without batteries while we are affected by this trouble.'\nPortland: 'Very well. Shall I go ahead with business?'\nBoston: 'Yes. Go ahead.'"
 verrier.144.g: "The telegraphs work without electricity?! That's completely impossible!"
 verrier.9010.t: "The Sound of Science"
 verrier.9010.d: "A professors at [SCOPE.sState('sound_of_science_state').GetCityHubName] University has demonstrated the the validity of #variable Christian Doppler#!'s theory that the observed frequency of sound or light changes if either the source or the observer is moving."
 verrier.9010.f: "A racing train, a blaring brass horn and a dozen perfect pitch ears have come together on the #bold #variable [SCOPE.sState('sound_of_science_state').GetFarmHubName]-[SCOPE.sState('sound_of_science_state').GetCityHubName]#!#! railway for an imaginative experiment. At stake? Doppler's theory on the movement of stars. For if the theory that the frequency of a wave changes with the speed of an object is correct, then a noticable drop in pitch from the blaring horn should be observed as the train races past the spectators.\nSelected for their ability to hear even a 1/8th difference in pitch, the spectators carefully record their observations as the train races by. Now; after 3 days of tabulation the results are in... And... Uniformly a drop in pitch is recorded!"
 verrier.9010.g: "Observation and experimentation is the foundation of knowledge."
 verrier.9010.h: "One cannot know how unexpectedly a new truth can find a purpose."
 verrier_sound_of_science_prestige_modifier: "The Sound of Science"
 verrier_sound_of_science_tech_spread_modifier: "The Sound of Science"
 je_verrier_uranus: "Another Planet?"
 je_verrier_uranus_reason: "Could it be that there is another planet out there? For centuries, there were only 6 planets, but with the recent improvements of telescopes, it is very much possible that we might find another one. And why stop at 7, maybe there are even more! Finding more planets might even help to unravel the mysteries of the universe.\n\n#b Historical Context:#! The 6 planets were known for a long time, as they were easy to observe even with bare eyes thanks to their brightness. Uranus, Neptune and Pluto on the other hand were less bright and even though Uranus is visible for eyes in the right circumstances, Its slow orbital speed has led many astronomers to believe that the planet is a fixed star."
 je_verrier_uranus_goal: "To determine whether there is another planet or not, we need to discover [JournalEntry.GetTotalGoalValue|0+] @verrier_astronomicalobject! [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects|q$')]."
 je_verrier_uranus_fail: "If another nation meets the requirements before us they might find a new planet or maybe realise that there are only 6 planets."
 verrier.12.t: "A new Planet!"
 verrier.12.d: "[SCOPE.sCharacter('verrier_astronomer_scope').GetFullName] has discovered an unknown planet that is now called Uranus! An event no one has seen coming."
 verrier.12.f: "[SCOPE.sCharacter('verrier_astronomer_scope').GetFullName] first thought to have found a new comet. Only weeks later was it clear that it was in fact a new planet! It is incredible that another planet was basically not considered possible before. But now that Uranus was found, many ask, if there could be even more planets.\n\n#b Historical Context:#! It was not until 1781 that Wilhelm Herschel stumbled across Uranus by chance. At first he thought it was a comet, because why should there be more planets than the well-known ones? Within the next 3 months, however, the scientific community realized that it was indeed a new planet."
 verrier.12.g: "Unbelieveable! Are there possibly even more planets?"
 verrier.13.d: "A sensation happened! An astronomer from [SCOPE.sCountry('verrier_uranus_discoverer_country').GetName] has found a new planet called Uranus. And if there is one more, maybe we can find eben more!"
 verrier.13.g: "If there are more than 6, maybe there are even more for us to discover!"
 verrier_uranus_discoverer_modifier: "Odkrywca Urana"
 je_verrier_dwarf_planets: "Celestial Police"
 je_verrier_dwarf_planets_reason: "Note: This Journal Entry can be completed multiple times.\n\nAfter the discovery of Uranus the possibility of finding other planets could exist. As there are no planets in a huge region between Mars and Jupiter, astronomers hope to find another planet there. Therefore they founded the Celestial Police, multiple observatories working together to find a planet.\n\n#b Historical Context:#! The Celestial Police (German: Himmelspolizey) was a cooperation of numerous European astronomers in the early 19th century. It is mainly known in relation to the search for objects expected between the orbits of Mars and Jupiter. It was formed in 1800 at the second European congress of astronomers."
 je_verrier_dwarf_planets_goal: "To possibly find a new planet, we need to discover [JournalEntry.GetGoalAddValue|0+] @verrier_astronomicalobject! [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects|q$')]."
 verrier.14.t: "Odkrycie Ceres"
 verrier.14.d: "[SCOPE.sCharacter('verrier_astronomer_scope').GetFullName] has discovered an unknown planet in the Region between Mars and Jupiter. A huge discovery!"
 verrier.14.f: "#b Historical Context:#! Astronomers have long suspected another planet in the gap between Mars and Jupiter. Therefore, the Celestial Police was founded and the space was divided up and transferred piece by piece to different observatories.\nOn New Year's night in 1801, Giuseppe Piazzi discovered Ceres by chance in a star catalog."
 verrier.14.g: "I wonder how many more planets there are?"
 verrier_ceres_discoverer_modifier: "Discoverer of Ceres"
 notification_verrier_ceres_discovered_notification_name: "Odkrycie Ceres"
 notification_verrier_ceres_discovered_notification_desc: "Dr. [SCOPE.sCharacter('verrier_astronomer_scope').GetLastName] has made a incredible discovery and found a new planet in the solar system. The planet will be named Ceres and is located between Mars and Jupiter."
 verrier.15.t: "Pallas discovered"
 verrier.15.d: "[SCOPE.sCharacter('verrier_astronomer_scope').GetFullName] has discovered an unknown planet in the Region between Mars and Jupiter. A huge discovery!"
 verrier.15.f: "#b Historical Context:#! When Ceres was found between Mars and Jupiter, no one expected there to be another planet in the same region. It was a huge suprise, when Heinrich Wilhelm Olbers discovered a new planet while looking for Ceres. The discovery of Pallas lead the Celestial Police to search for other planets in the same region which proved fruitful only a few years later."
 verrier_pallas_discoverer_modifier: "Discoverer of Pallas"
 notification_verrier_pallas_discovered_notification_name: "Pallas discovered"
 notification_verrier_pallas_discovered_notification_desc: "Dr. [SCOPE.sCharacter('verrier_astronomer_scope').GetLastName] has made a incredible discovery and found a new planet in the solar system. The planet will be named Pallas and is located between Mars and Jupiter."
 verrier.16.t: "Vesta discovered"
 verrier.16.d: "[SCOPE.sCharacter('verrier_astronomer_scope').GetFullName] has discovered an unknown planet in the Region between Mars and Jupiter. A huge discovery!"
 verrier.16.f: "#b Historical Context:#! When Heinrich Wilhelm Olbers found his second planet in 1807 he asked Carl Friedrich Gauß to name it. The newly named Vesta was the fourth planet found in the region between Mars and Jupiter and would be the las for about 40 years."
 verrier_vesta_discoverer_modifier: "Odkrycie Westy"
 notification_verrier_vesta_discovered_notification_name: "Vesta discovered"
 notification_verrier_vesta_discovered_notification_desc: "Dr. [SCOPE.sCharacter('verrier_astronomer_scope').GetLastName] has made a incredible discovery and found a new planet in the solar system. The planet will be named Vesta and is located between Mars and Jupiter."
 verrier.17.t: "Juno odkryte"
 verrier.17.d: "[SCOPE.sCharacter('verrier_astronomer_scope').GetFullName] has discovered an unknown planet in the Region between Mars and Jupiter. A huge discovery!"
 verrier.17.f: "#b Historical Context:#! After the discovery of Ceres in 1801 and Pallas in 1802, it only took 2 more years until Karl Ludwig Hardwig found Juno in the same region between Mars and Jupiter. All three planets as well as Vesta (discovered in 1807) remained planets for a while until more and more asteroids were found and considered planets. Then astronomers decided that none of them were actual planets."
 verrier_juno_discoverer_modifier: "Odkrywca Juno"
 notification_verrier_juno_discovered_notification_name: "Juno discovered"
 notification_verrier_juno_discovered_notification_desc: "Dr. [SCOPE.sCharacter('verrier_astronomer_scope').GetLastName] has made a incredible discovery and found a new planet in the solar system. The planet will be named Juno and is located between Mars and Jupiter."
 je_verrier_neptune_goal: "The successful discovery of the Unknown Planet requires a detailed study of the starry sky. After finding [JournalEntry.GetTotalGoalValue|0+] @verrier_astronomicalobject! [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects|q$')], we might have success to reveal the planet."
 je_verrier_pluto_goal: "The successful discovery of Planet X requires a detailed study of the starry sky. After finding [JournalEntry.GetTotalGoalValue|0+] @verrier_astronomicalobject! [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects|q$')], we might have success to reveal the planet."
 MR_ASTEROID_CONGRESS_DWARF_PLANETS_TT: "#default_text #V Ceres#!, #V Pallas#!, #V Vesta#! and #V Juno#! have been discovered.#!"
 je_verrier_astro_physics: "Astrophysics"
 je_verrier_astro_physics_reason: "The new physical findings have revolutionized the world of science. Astronomy is not unaffected by this either. Both scientific disciplines are in fruitful exchange and theoretical and observational physics can make their contribution to a better understanding of the universe."
 verrier_astro_physics_tech: "Astrofizyka"
 verrier_astro_physics_tech_desc: "Astrophysics is a science that employs the methods and principles of physics and chemistry in the study of astronomical objects and phenomena. As one of the founders of the discipline, James Keeler, said, Astrophysics 'seeks to ascertain the nature of the heavenly bodies, rather than their positions or motions in space - what they are, rather than where they are'."
 verrier_modern_physics_tech: "Modern Physics"
 verrier_modern_physics_tech_desc: "Modern physics is a branch of physics that developed in the early 20th century. Notable branches of modern physics include quantum mechanics, special relativity and general relativity. It is concerned with extreme conditions, such as high velocities that are comparable to the speed of light, small distances comparable to the atomic radius, and very high energies."
 verrier_nuclear_physics_tech: "Fizyka Jądrowa"
 verrier_nuclear_physics_tech_desc: "Nuclear physics is the branch of physics that deals with the structure and behavior of atomic nuclei. Nuclear physics deals with the elucidation of the nuclear structure, i.e. the details of the structure of the atomic nuclei and their reactions. For this purpose, for example, spontaneous transformations of nuclei (radioactivity), scattering processes on nuclei and reactions with nuclei are investigated experimentally and theoretically. Technologies based on nuclear fission and nuclear fusion are based on nuclear physics research."
 verrier_first_sun_photo_modifier: "First Photo of Sun Eclipse"
 verrier_helium_discovered_modifier: "The Solar Element"
 verrier_comet_observer: "Comet Observer"
 verrier_comet_observer_desc: "This astronomer discovered a Great Comet that was named after him."
 verrier_magnetic_storm_observer: "Magnetic Storm Observer"
 verrier_magnetic_storm_observer_desc: "This astronomer closely observed and studied a magnetic storm triggered by a solar flare."
 verrier_solar_observer: "Solar Observer"
 verrier_solar_observer_desc: "This astronomer observed a solar eclipse and gained valuable scientific knowledge."
 verrier.152.t: "Zaćmienie Słoneczne"
 verrier.152.d: "A rare phenomenon occurred this year: a total solar eclipse appeared over [ROOT.GetCountry.GetCapital.GetCityHubName]. [GetPlayer.MakeScope.Var('verrier_astronomer_var').GetCharacter.GetFullName] had the unique opportunity to observe it more closely."
 verrier.152.f: "A terrestrial solar eclipse is an astronomical event in which the Sun is partially or completely obscured by the Moon when viewed from certain areas on Earth. The moon's shadow passes over the earth, which is only possible during a new moon. Solar eclipses were often used to learn new insights about the sun in particular and the universe in general. The total solar eclipse of May 29, 1919, as observed on the African island of Príncipe by an expedition led by Arthur Stanley Eddington, gained particular attention in connection with the theory of relativity, developed a few years earlier by Albert Einstein, which, among other things, deflection of the light of distant stars through the gravitational field of the sun - which was confirmed by the observations."
 verrier.152.g: "A very rare phenomenon!"
 verrier.153.t: "[GetPlayer.MakeScope.Var('verrier_astronomer_var').GetCharacter.GetLastName]'s Beads"
 verrier.153.d: "Our astronomer, [GetPlayer.MakeScope.Var('verrier_astronomer_var').GetCharacter.GetFullName], had the extraordinary opportunity to observe the solar corona and prominent objects more closely during the last solar eclipse. The scientist assigned these as parts of the solar atmosphere."
 verrier.153.f: "The Baily's beads, diamond ring or more rarely double diamond ring effects, are features of total and annular solar eclipses. Although caused by the same phenomenon, they are distinct events during these types of solar eclipses. As the Moon covers the Sun during a solar eclipse, the rugged topography of the lunar limb allows beads of sunlight to shine through in some places while not in others. They are named for Francis Baily, who explained the effects in 1836. The diamond ring effects are seen when only one or two beads are left, appearing as shining 'diamonds' set in a bright ring around the lunar silhouette."
 verrier.153.g: "This phenomenon should be named after Dr. [GetPlayer.MakeScope.Var('verrier_astronomer_var').GetCharacter.GetLastName]."
 verrier.154.t: "First Photo of a Solar Eclipse"
 verrier.154.d: "With a new technical process, Dr. [GetPlayer.MakeScope.Var('verrier_astronomer_var').GetCharacter.GetLastName] succeeded in taking the first photograph of a solar eclipse."
 verrier.154.f: "Photographing a rare event such as a total eclipse posed unique challenges for early photography, including the extreme contrast between the corona and the dark shadow of the Moon, as well as the unusual angle to which photographic equipment had to be oriented. Prior to the eclipse of July 28, 1851, no properly exposed photograph of the solar corona had yet been produced. For this occasion, the Royal Prussian Observatory at Königsberg commissioned one of the city's most skilled daguerreotypists, Johann Julius Friedrich Berkowski, to record a still image of the event. The observers attached a small six-centimeter refracting telescope to a 15.8 centimeter Fraunhofer heliometer, and Berkowski made an eighty-four second exposure shortly after the beginning of totality."
 verrier.154.g: "Doskonale."
 verrier.155.t: "The Solar Element"
 verrier.155.d: "Using a new spectographic technique, Dr. [GetPlayer.MakeScope.Var('verrier_astronomer_var').GetCharacter.GetLastName] made a remarkable discovery during the last solar eclipse. It looks like [GetPlayer.MakeScope.Var('verrier_astronomer_var').GetCharacter.GetSheHe] has discovered a new element. Nobody wanted to believe [GetPlayer.MakeScope.Var('verrier_astronomer_var').GetCharacter.GetHerHim] at first, but the chemist Dr. [GetPlayer.MakeScope.Var('mendelejew_chemist_var').GetCharacter.GetLastName] has just confirmed this discovery."
 verrier.155.f: "Evidence of the element helium was first obtained from a bright yellow spectral line at a wavelength of 587.49 nanometers in the spectrum of the Sun's chromosphere. The French astronomer Jules Janssen made this observation in India during the total solar eclipse of August 18, 1868. When he announced his discovery, no one initially believed him because no new element had ever been found in space before it was proven on the planet Earth could be guided. On October 20 of the same year, the Englishman Norman Lockyer confirmed that the yellow line was indeed present in the solar spectrum and concluded that it was caused by a previously unknown element. Since this spectral line was very close (1.8 nm from the center) to the Fraunhofer double-D line (D2 = 589.00 nm, D1 = 589.60 nm) of the metal sodium, he named the line D3 to describe it to be distinguished from these lines D1 and D2 of sodium. He and his English colleague Edward Frankland suggested naming the new element helium (from the Greek helios, sun)."
 verrier.155.g: "Helium? An apt name for the solar element!"
