 verrier.300.t: "Tranzyt Wenus"
 verrier.300.d: "Astronomowie przewidzieli zaćmienie Słońca w regionie Australii, Indonezji i Pacyfiku w #ORANGE 1874#! roku. Środowisko naukowe [ROOT.GetCountry.GetNameNoFlag] apeluje o zorganizowanie [concept_dubois_pacific_expedition], aby obserwować to wyjątkowe zjawisko astronomiczne, które zdarza się raz w życiu."
 verrier.300.f: "Tranzyt Wenus to przejście planety Wenus na tle tarczy Słońca. Zjawisko to występuje zaledwie cztery razy w ciągu około 243 lat. W przeszłości dokładne pomiary takich przejść miały ogromne znaczenie dla wyznaczania odległości między Ziemią a Słońcem (jednostki astronomicznej) i były powodem organizowania licznych wypraw oraz kampanii pomiarowych przez czołowe instytuty i uczonych. Tranzyt Wenus w 1874 roku był stosunkowo niekorzystny dla pomiarów astronomicznych. Pozostawał niewidoczny z niemal całej Europy. Długi czas przejścia można było obserwować jedynie z Azji, a krótki — z Australii oraz wysp południowego Pacyfiku i południowej części Oceanu Indyjskiego (zwłaszcza z archipelagu Kerguelena). Mimo to wysłano około 60 wypraw.\n\n#R Uwaga: Wyprawa na Pacyfik prowadząca obserwacje tranzytu Wenus musi mieć na pokładzie [concept_verrier_astronomer].#!"
 verrier.300.g: "Nie powinniśmy przegapić tej okazji."
 verrier.301.t: "Tranzyt Wenus roku 1874"
 verrier.301.d: "#YELLOW Wyprawa [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]#! miała okazję obserwować tranzyt Wenus. [SCOPE.sCharacter('rapanui_scientist').GetFullName] sporządził ważne zapiski astronomiczne, których analiza będzie zajmować naukowców przez wiele kolejnych lat."
 verrier.301.f: "Tranzyt Wenus z 9 grudnia 1874 roku był pierwszym z dwóch przejść tej planety na tle tarczy Słońca w XIX wieku. Podobnie jak poprzednie tranzyty, stwarzał okazję do przeprowadzenia dokładniejszych pomiarów i obserwacji. Zaplanowano i wysłano liczne wyprawy, które miały obserwować zjawisko z różnych miejsc na świecie, a kilka państw powołało oficjalne komitety koordynujące przygotowania. Wysłano sześć oficjalnych wypraw francuskich, pięć brytyjskich, osiem finansowanych przez Kongres Stanów Zjednoczonych, trzy niemieckie (w tym wyprawę „Gazelle”) i dwie meksykańskie. Również Włochy, Rosja i Austria wysłały po jednej wyprawie, aby obserwować to wydarzenie astronomiczne. Szczególną sławę zyskał zapis francuskiej wyprawy, która zestawiła kilka fotografii w sekwencję, tworząc w ten sposób pierwszy „film”. Zapis tranzytu Wenus należy do najwcześniejszych ruchomych obrazów w historii ludzkości."
 verrier.301.g: "Zapierające dech w piersiach widowisko."
 verrier.401.t: "Pułtuski Deszcz Meteorytów"
 verrier.401.d: "Mieszkańcy Mazowsza byli świadkami niezwykłego zjawiska na niebie."
 verrier.401.f: "Położony w sercu Mazowsza malowniczy Pułtusk skrywa tajemnicę z kosmosu. To właśnie tutaj, pewnego mroźnego zimowego dnia, rozegrało się niebiańskie widowisko o niespotykanej skali, na zawsze łącząc tę spokojną miejscowość z bezkresnym, tajemniczym wszechświatem. Był rok 1868. 30 stycznia mieszkańcy Pułtuska zajmowali się codziennymi sprawami, nieświadomi, że niebawem staną się świadkami niezwykłego zjawiska. Gdy popołudnie ustępowało wieczorowi, nad miastem zapadła niezwykła cisza. Nagle niebo przeszyło olśniewające światło. Ognista kula, jaśniejsza od Słońca, przemknęła po nieboskłonie. Świadkowie opisywali ją jako płonącą sferę ciągnącą za sobą świetlisty ogon i rozdzierającą niebo ogłuszającym hukiem. Ognista kula, rozpoznana później jako meteoryt, rozpadła się gwałtownie podczas wejścia w ziemską atmosferę. Tysiące fragmentów spadły na Pułtusk i okoliczne tereny, tworząc deszcz meteorytów. Wydarzenie to przeszło do historii jako pułtuski deszcz meteorytów."
 verrier.401.g: "Cóż za wspaniały widok!"
 verrier.402.t: "Deszcz Meteorytów w Holbrook"
 verrier.402.d: "Mieszkańcy Arizony byli świadkami niezwykłego zjawiska na niebie."
 verrier.402.f: "Gdy nad Holbrook zapadał zmrok, około godziny 7:15 wieczorem niebo rozbłysło kaskadą świetlistych kul ognia. Setki jasnych meteorów, różniących się wielkością i blaskiem, przecinały nieboskłon, wybiegając z jednego punktu i rozpraszając się we wszystkich kierunkach. Pozostawiały smugi jaskrawobiałego i złocistożółtego światła, tworząc zapierające dech w piersiach widowisko. Większe fragmenty o ognistych rdzeniach rozpadały się na drobniejsze kawałki, zanim znikały w niższych warstwach atmosfery. Z oddali dobiegały odgłosy przypominające wystrzały armatnie, świadczące o ogromnej energii uwalnianej podczas rozpadu. Początkowo przerażeni mieszkańcy wkrótce zaczęli się gromadzić, by podziwiać niebiański spektakl. Późniejsze poszukiwania ujawniły liczne drobne fragmenty meteorytów rozrzucone po okolicy, złożone głównie z żelaza i niklu."
 verrier.403.t: "Deszcz Meteorytów w Kniahini"
 verrier.403.d: "Mieszkańcy wschodniej Słowacji byli świadkami niezwykłego zjawiska na niebie."
 verrier.403.f: "Upadek meteorytu Kniahynia był najdonioślejszym uderzeniem meteoroidu w Europie w czasach historycznych. Przez długi czas uznawano go za najcięższy meteoryt kamienny na świecie. Spadł w górach na północ od miejscowości Kniahinia 9 czerwca 1866 roku, między godziną 4:00 a 5:00 po południu. Zachowały się liczne relacje naocznych świadków, które później posłużyły do sporządzenia rysunków. Podczas wejścia w ziemską atmosferę meteor rozpadł się na ponad 1,000 fragmentów."
 verrier.411.t: "Meteoryt z Przylądka York"
 verrier.411.d: "Podczas [GetPlayer.MakeScope.Var('agassiz_geologist_var').GetCharacter.GetHerHis] poszukiwań geologicznych Dr. [GetPlayer.MakeScope.Var('agassiz_geologist_var').GetCharacter.GetLastName] dokonał ważnego, przypadkowego odkrycia. Dziwny kamień, który [GetPlayer.MakeScope.Var('agassiz_geologist_var').GetCharacter.GetSheHe] badał, po dokładnej analizie okazał się materią pochodzącą z kosmosu. Meteoryt ma znaczne, niemal rekordowe rozmiary."
 verrier.411.f: "Wśród lodowych pustkowi Grenlandii geolog [GetPlayer.MakeScope.Var('agassiz_geologist_var').GetCharacter.GetFullName] odkrył meteoryt z Przylądka York — kosmiczny skarb, który może poszerzyć nasze horyzonty naukowe. Potwierdzono pozaziemskie pochodzenie tych ogromnych fragmentów żelaza, od dawna wykorzystywanych przez Inuitów do wyrobu narzędzi. Wyróżniają je charakterystyczne figury Widmanstättena i wrostki troilitu. Meteoryty te, ważące nawet 31 ton, dają wyjątkową możliwość poznania pierwotnej materii, z której powstał nasz Układ Słoneczny. Odkrycie pogłębia naszą wiedzę o początkach jego formowania się i uwydatnia ścisły związek między historią ludzkości a wydarzeniami kosmicznymi. Przewiezienie meteorytów do instytucji naukowych umożliwi szczegółowe analizy, które rzucą światło na tajemnice budowy wszechświata. Badając te kosmiczne relikty, coraz pełniej doceniamy złożoność kosmosu i nasze miejsce w jego strukturze."
 verrier.411.g: "To niezwykłe odkrycie!"
 verrier.412.t: "Meteoryt Bacubirito"
 verrier.412.f: "Meteoryt Bacubirito jest największym meteorytem znalezionym w Meksyku. Odkrył go w 1863 roku geolog Gilbert Ellis Bailey we wsi Ranchito, w pobliżu miasta Sinaloa de Leyva. Jest to meteoryt żelazny o masie od 20 do 22 ton. Ma 4.25 metra długości, 2 metry szerokości i 1.75 metra wysokości."
 verrier.413.t: "Meteoryt Mundrabilla"
 verrier.413.f: "Meteoryt Mundrabilla to meteoryt żelazny, który spadł na równinę Nullarbor w Australii Zachodniej, rozpadłszy się na fragmenty jeszcze w ziemskiej atmosferze. Uważa się, że deszcz meteorytów spadł tam kilka milionów lat temu. Przy łącznej masie 24 ton jest to jedno z największych znalezisk meteorytowych na świecie. Przypuszcza się, że meteoryt spadł na Ziemię 60 milionów lat temu, co czyni go jednym z najstarszych znanych meteorytów na naszej planecie."
 verrier.414.t: "Meteoryt Willamette"
 verrier.414.f: "Willamette to nazwa meteorytu oficjalnie odkrytego w 1902 roku w amerykańskim stanie Oregon. Spadł on jednak na Ziemię już kilka tysięcy lat wcześniej. W chwili odkrycia uznawano go za trzeci co do wielkości meteoryt na świecie, a obecnie zajmuje szóste miejsce. Waży 15.5 tony. Obliczono, że w ciągu ostatnich 13,000 lat wskutek wietrzenia utracił nawet 6 t masy. Lud Clackamas otaczał meteoryt Willamette czcią na długo przed zabraniem go z doliny Willamette, z okolic dzisiejszego miasta West Linn w Oregonie. W 1902 roku Ellis Hughes jako pierwszy europejski osadnik rozpoznał znaczenie meteorytu."
 verrier.415.t: "Meteoryt Hoba"
 verrier.415.f: "Meteoryt Hoba jest największym meteorytem odkrytym dotąd na Ziemi. Znajduje się na terenie farmy „Hoba” w górach Otavi, około 20 kilometrów na zachód od Grootfontein w Namibii. Szacunki jego masy wahają się od 50 do 60 ton. Jego pierwotne wymiary wynosiły 2.70 metra x 2.70 metra x 0.90 metra. Ten żelazny meteoryt spadł na Ziemię około 80,000 lat temu i nadal spoczywa w miejscu upadku. Jego wiek szacuje się na 190 do 410 milionów lat."
 verrier.421.t: "[GetPlayer.MakeScope.Var('verrier_astronomer_var').GetCharacter.GetFullName] chce zbadać Meteoryty"
 verrier.421.d: "Dzięki wytrwałości naszego astronoma [GetPlayer.MakeScope.Var('verrier_astronomer_var').GetCharacter.GetFullName] kilka dni po upadku meteorytu udało się odnaleźć liczne fragmenty. Znalezisko prawdopodobnie rzuci światło na niektóre tajemnice wszechświata, ale Dr. [GetPlayer.MakeScope.Var('verrier_astronomer_var').GetCharacter.GetLastName] nalega na zatrzymanie okazów, które [GetPlayer.MakeScope.Var('verrier_astronomer_var').GetCharacter.GetSheHe] odnalazł."
 verrier.421.f: "Wśród zapału epoki wiktoriańskiej astronom skierował wzrok ku niebu, co doprowadziło do odkrycia fragmentów meteorytu. Jego wyjątkowy zmysł obserwacji i metodyczne podejście pozwoliły mu zebrać i zbadać te kosmiczne szczątki. Każdy fragment poddano drobiazgowej analizie, pogłębiając wiedzę o składzie i pochodzeniu meteorytów. Jego praca była przykładem wiktoriańskiego oddania nauce, napędzanego nienasyconą ciekawością i głębokim pragnieniem odkrywania tajemnic wszechświata."
 verrier.421.g: "Wszystkie fragmenty muszą zostać przekazane Akademii Nauk!"
 verrier.421.h: "[GetPlayer.MakeScope.Var('verrier_astronomer_var').GetCharacter.GetFullName] może zbadać jeden z meteorytów."
 verrier.422.t: "[GetPlayer.MakeScope.Var('mendelejew_chemist_var').GetCharacter.GetFullName] chce przeanalizować Meteoryty"
 verrier.422.d: "Dr. [GetPlayer.MakeScope.Var('mendelejew_chemist_var').GetCharacter.GetLastName], czołowy chemik naszego kraju, zwrócił się do rządu o zgodę na zbadanie niedawno odnalezionego meteorytu. Ponadto w [SCOPE.sCharacter('mendelejew_chemist_var').GetHerHis] laboratorium będzie on bezpieczniejszy niż w słabo zabezpieczonym sejfie."
 verrier.422.f: "„Pozaziemska materia! Z nieznanej odległości! To naukowa sensacja i niepowtarzalna okazja, by szczegółowo zbadać skład chemiczny meteorytu”."
 verrier.422.g: "Dlaczego każdy napotkany uczony sądzi, że może wyprosić ode mnie meteoryt?"
 verrier.422.h: "Jestem pewien, że przyczyni się to do rozwoju chemii."
 verrier.1013.f: "Georgios Konstantinos Vouris, znany [concept_verrier_astronomer], prowadził wykłady dla pierwszej garstki greckich studentów nowo powstałego uniwersytetu. W Grecji nastawała nowa era — epoka nauki i postępu.\n\n#b Historycznie,#! utworzenie uniwersytetu zaplanowano w 1836 roku, a oficjalnie założono go 3 maja 1837 roku. Był to pierwszy uniwersytet w kontynentalnej Grecji. Po ukończeniu Głównego Gmachu w 1841 roku uczelnia przeniosła się do nowego budynku. Budowa jej skrzydeł trwała do 1864 roku.\n Othóneion Panepistímion przemianowano później na Uniwersytet Narodowy, gdyż po zamachu stanu w 1862 roku Otton musiał uciec z Grecji.\n\nDziś Narodowy Uniwersytet im. Kapodistriasa w Atenach jest jedną z czołowych greckich uczelni. Dwaj jego absolwenci, obaj poeci, otrzymali za swoją twórczość Nagrody Nobla. Studiowało tu również piętnastu greckich premierów i trzech prezydentów Grecji."
 je_verrier_meteorites: "Kolekcja Meteorytów"
 je_verrier_meteorites_reason: "Meteoryty, zarówno te, które dopiero spadły z nieba, jak i te odnalezione po milionach lat, pozwalają w fascynujący sposób zgłębiać przeszłość naszej planety i wszechświata. Odpowiednia liczba odkryć umożliwia postęp naukowy."
