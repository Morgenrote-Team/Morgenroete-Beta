 ACHIEVEMENT_verrier_moon: "Zabierz Mnie na Księżyc"
 ACHIEVEMENT_DESC_verrier_moon: "Poleć na Księżyc jako USA przed latem '69."
 verrier_national_space_disaster_modifier: "Narodowa Katastrofa Kosmiczna"
 verrier_great_national_space_disaster_modifier: "Wielka Narodowa Katastrofa Kosmiczna"
 verrier_national_space_success_modifier: "Z Ziemi na Księżyc"
 verrier_astronaut_modifier: "Astronauta"
 je_from_the_earth_to_the_moon: "Z Ziemi na Księżyc"
 je_from_the_earth_to_the_moon_reason: "Klub Artyleryjski w Baltimore chce zbudować gigantyczną armatę, która wystrzeli pocisk na Księżyc. Planowany aluminiowy pocisk ma ważyć 10,000 kg, a grubość jego ścian ma wynosić 60 cm. Uzgodniono również, że żeliwna lufa będzie miała 270 m długości, 2.70 m średnicy wewnętrznej i ściany o grubości 1.80 m. Przedsięwzięcie wymaga odpowiednio rozwiniętego przemysłu zbrojeniowego oraz zdolnych ludzi, którzy zaprojektują i zbudują to urządzenie. Floryda wydaje się idealnym miejscem wystrzału. Ze względu na transport materiałów region potrzebuje własnej linii kolejowej."
 verrier_baltimore_president_alive_tt: "Prezes Klubu Artyleryjskiego w Baltimore, [SCOPE.sCharacter('verrier_club_president').GetFullName], nadal żyje"
 verrier.131.t: "Z Ziemi na Księżyc"
 verrier.131.d: "Klub Artyleryjski w Baltimore powstał pod patronatem [SCOPE.sCharacter('verrier_club_president').GetFullName] i uchodzi za miejsce spotkań miłośników artylerii. Najnowsza propozycja towarzystwa trafiła na pierwsze strony gazet w całym kraju."
 verrier.131.f: "Klub Artyleryjski w Baltimore powstał podczas wojny secesyjnej i skupia w swoich szeregach specjalistów od artylerii. Jego prezes [SCOPE.sCharacter('verrier_club_president').GetLastName] oraz sekretarz, inżynier [SCOPE.sCharacter('gaudi_engineer_scope').GetFullName], czują się po zakończeniu wojny niewykorzystani. Zwołują zebranie, aby znaleźć nowe pole działania. Po propozycjach wywołania kolejnej wojny, która pozwoliłaby wykorzystać nowe uzbrojenie, zgadzają się na pomysł wystrzelenia pocisku z Ziemi na Księżyc za pomocą armaty. Planowany aluminiowy pocisk ma ważyć 10,000 kg, a grubość jego ścian ma wynosić 60 cm. Uzgodniono również, że żeliwna lufa będzie miała 270 m długości, 2.70 m średnicy wewnętrznej i ściany o grubości 1.80 m. Jako ładunek miotający ma posłużyć bawełna strzelnicza."
 verrier.131.g: "USA wyślą pierwszego człowieka na Księżyc przed końcem dekady!"
 verrier.131.h: "Znacznie bezpieczniej będzie poczekać na następną wojnę..."
 verrier.132.t: "Załoga lotu na Księżyc"
 verrier.132.d: "Przygotowania zostały zakończone, ale pozostaje jeszcze ważne pytanie: kto powinien wejść do kapsuły?"
 verrier.132.f: "Można by sądzić, że trudno będzie znaleźć ochotników do samobójczej misji polegającej na wystrzeleniu człowieka w kosmos w gigantycznym pocisku armatnim. Jednak dla niektórych członków Klubu Artyleryjskiego w Baltimore to wielki zaszczyt. Zarówno prezesowi, jak i głównemu inżynierowi przysługuje miejsce na pokładzie, inni zaś opowiadają się za udziałem renomowanego astronoma. Ostrożniejsi przekonują, że w ramach próby należy wysłać w kosmos jedynie dwa psy, aby nie narażać ludzkiego życia."
 verrier.132.g: "[SCOPE.sCharacter('gaudi_engineer_scope').GetFullName], Inżynier"
 verrier.132.h: "[SCOPE.sCharacter('verrier_astronomer_scope').GetFullName], Astronom."
 verrier.132.i: "[SCOPE.sCharacter('verrier_club_president').GetFullName], Prezes Klubu."
 verrier.132.j: "Po prostu wsadźcie tam psy."
 verrier.132.k: "WSZYSTKICH!"
 verrier.133.t: "Interwencja [SCOPE.sCharacter('verrier_astronomer_scope').GetLastName]"
 verrier.133.d: "Podczas ostatnich przygotowań do budowy i ustawienia gigantycznej armaty [SCOPE.sCharacter('verrier_astronomer_scope').GetFullName] ostrzegł inicjatorów przedsięwzięcia: według [SCOPE.sCharacter('verrier_astronomer_scope').GetHerHis] obliczeń [SCOPE.sCharacter('gaudi_engineer_scope').GetFullName] popełnił błąd rachunkowy."
 verrier.133.f: "Renomowany astronom obliczył, że przy obecnych rozmiarach armaty i planowanym sposobie wycelowania pocisku kapsuła miałaby nikłe szanse na wyrwanie się z ziemskiego pola grawitacyjnego. [SCOPE.sCharacter('verrier_astronomer_scope').GetSheHe] przedstawił poprawione plany konstrukcyjne, które znacznie zwiększają szanse powodzenia podróży."
 verrier.133.g: "[SCOPE.sCharacter('verrier_astronomer_scope').GetSheHe|U] mógł zapobiec katastrofie."
 verrier.134.t: "Odliczanie"
 verrier.134.d: "Iluż ludzi nie zaznało spoczynku w noc poprzedzającą ten długo wyczekiwany dzień! Wszystkie serca biły niespokojnie. Kolumbiada jest gotowa do lotu na Księżyc."
 verrier.134.f: "Po świcie niezliczone tłumy pokryły prerię rozciągającą się jak okiem sięgnąć wokół Stones Hill. Co kwadrans kolej przywoziła nowych widzów, a według doniesień „Tampa Town Observer” na Florydzie zgromadziło się nie mniej niż pięć milionów ludzi. Księżyc wznosił się po nieskazitelnie czystym niebie, przyćmiewając po drodze migotliwy blask gwiazd. Minął gwiazdozbiór Bliźniąt i zbliżał się już do połowy drogi między horyzontem a zenitem. Nad całym tym widokiem ciążyła straszliwa cisza! Ani podmuchu wiatru nad ziemią! Ani szmeru oddechu z niezliczonych piersi widzów! Ich serca zdawały się bać uderzyć! Wszystkie oczy były utkwione w ziejącym wylocie Kolumbiady.\n„Trzydzieści pięć! — trzydzieści sześć! — trzydzieści siedem! — trzydzieści osiem! — trzydzieści dziewięć! — czterdzieści!”"
 verrier.134.g: "OGNIA!"
 verrier.135.t: "Katastrofa"
 verrier.135.d_humans_dead: "Pierwsza misja kosmiczna ludzkości okazała się jej pierwszą katastrofą kosmiczną. Całe przedsięwzięcie zakończyło się kolosalną porażką! Widzowie wciąż drżą z przerażenia."
 verrier.135.d_dogs_dead: "Cała misja zakończyła się kolosalną porażką! Cierpienie biednych zwierząt budzi żal, ale z drugiej strony wielu odczuwa ulgę, że w kapsule nie było żadnego człowieka."
 verrier.135.f: "Gdy piramida ognia wzniosła się na niebywałą wysokość, blask płomieni rozświetlił całą Florydę i na chwilę dzień zastąpił noc na znacznej połaci kraju. Tę olbrzymią łunę dostrzeżono na morzu w odległości stu mil od brzegu, a niejeden kapitan odnotował w dzienniku pokładowym pojawienie się tego gigantycznego meteoru. Wystrzałowi Kolumbiady towarzyszyło istne trzęsienie ziemi. Floryda zadrżała aż po najgłębsze pokłady. Rozprężone pod wpływem gorąca gazy prochowe z ogromną siłą rozepchnęły warstwy atmosfery, a ten sztuczny huragan przemknął przez powietrze niczym trąba wodna.\nWtedy jednak eksperyment wymknął się spod kontroli: najwyraźniej armata nie zdołała nadać pociskowi wystarczającej siły, by wynieść go w kosmos. Po wszystkich tych widowiskowych efektach kapsuła wytraciła prędkość, runęła z powrotem na ziemię i rozbiła się z głośnym hukiem."
 verrier.135.g: "I tak lepiej niż Kerbal Space Program 2."
 verrier.136.t: "Lot na Księżyc"
 verrier.136.d_humans_in_space: "Start Kolumbiady zakończył się pełnym sukcesem. Człowiek po raz pierwszy znalazł się w kosmosie! Pozostaje pytanie, czy powróci..."
 verrier.136.d_dogs_in_space: "Start Kolumbiady zakończył się pełnym sukcesem. Po raz pierwszy obiekt stworzony przez człowieka dotarł w kosmos! Niestety psy raczej nie zdołają sprowadzić Kolumbiady z powrotem na Ziemię..."
 verrier.136.f: "Gdy piramida ognia wzniosła się na niebywałą wysokość, blask płomieni rozświetlił całą Florydę i na chwilę dzień zastąpił noc na znacznej połaci kraju. Tę olbrzymią łunę dostrzeżono na morzu w odległości stu mil od brzegu, a niejeden kapitan odnotował w dzienniku pokładowym pojawienie się tego gigantycznego meteoru. Wystrzałowi Kolumbiady towarzyszyło istne trzęsienie ziemi. Floryda zadrżała aż po najgłębsze pokłady. Rozprężone pod wpływem gorąca gazy prochowe z ogromną siłą rozepchnęły warstwy atmosfery, a ten sztuczny huragan przemknął przez powietrze niczym trąba wodna.\nEksperyment się powiódł."
 verrier.136.g: "To naprawdę zadzia... GRATULACJE!"
 verrier.136.h: "Szkoda, że nie wysłaliśmy prawdziwych pilotów."
 verrier.137.t: "Powrót z Księżyca!"
 verrier.137.d: "Kapsuła misji księżycowej bezpiecznie wodowała na Oceanie Spokojnym i została podjęta przez amerykańską korwetę. Wieść obiegła cały kraj: człowiek dotarł na Księżyc i powrócił!"
 verrier.137.f_person: "Miejsce, w którym pocisk zatonął pod falami, było dokładnie znane, brakowało jednak urządzenia, które pozwoliłoby go uchwycić i wydobyć na powierzchnię oceanu. Trzeba je było najpierw wynaleźć, a potem zbudować. Takie drobnostki nie mogły stanowić przeszkody dla amerykańskich inżynierów. Gdy tylko zamocują haki, z pewnością zdołają go podnieść mimo jego ciężaru, zmniejszonego dzięki wyporowi cieczy, w której był zanurzony.\nPamiętamy zapewne ogromną życzliwość, jaka towarzyszyła wyprawie w chwili jej rozpoczęcia. Skoro już na początku przedsięwzięcia przygoda wzbudziła takie emocje zarówno w Starym, jak i Nowym Świecie, z jakim entuzjazmem miano powitać bohatera po powrocie! Podróżował więc od miasta do miasta, zastając po drodze całe społeczności przy biesiadnych stołach, witające go równie gorącymi okrzykami i równie hojnymi brawami."
 verrier.137.f_team: "Miejsce, w którym pocisk zatonął pod falami, było dokładnie znane, brakowało jednak urządzenia, które pozwoliłoby go uchwycić i wydobyć na powierzchnię oceanu. Trzeba je było najpierw wynaleźć, a potem zbudować. Takie drobnostki nie mogły stanowić przeszkody dla amerykańskich inżynierów. Gdy tylko zamocują haki, z pewnością zdołają go podnieść mimo jego ciężaru, zmniejszonego dzięki wyporowi cieczy, w której był zanurzony.\nPamiętamy zapewne ogromną życzliwość, jaka towarzyszyła wyprawie w chwili jej rozpoczęcia. Skoro już na początku przedsięwzięcia przygoda wzbudziła takie emocje zarówno w Starym, jak i Nowym Świecie, z jakim entuzjazmem miano powitać ich po powrocie! Podróżowali więc od miasta do miasta, zastając po drodze całe społeczności przy biesiadnych stołach, witające ich równie gorącymi okrzykami i równie hojnymi brawami."
 verrier.137.g: "Powinniśmy to uczcić!"
 verrier.1051.t: "Powrót Gaussa"
 verrier.1051.d: "[SCOPE.sCharacter('verrier_new_astronomer_scope').GetFullName], niegdyś uznawany za jednego z najwybitniejszych Astronomów, w ostatnich latach skupiał się na innych dziedzinach, takich jak matematyka i magnetyzm. Teraz jednak powrócił do Astronomii."
 verrier.1051.f: "Wróciłem."
 verrier.1051.g: "Ma coś wspólnego z dzwonami, prawda?"
 verrier.1051.h: "Odkryje nowe planety!"
 verrier.90.f: "Kongres doszedł do następującego wniosku:\n\n"
