 ACHIEVEMENT_verrier_gmt: "To Greenwich... prawda?"
 ACHIEVEMENT_DESC_verrier_gmt: "Upewnij się, że południk zerowy przebiega przez twoje obserwatorium."
 verrier.171.t: "Czas Kolejowy"
 verrier.171.d: "Pojawienie się nowych technologii nie tylko zmieniło ludzkie postrzeganie czasu, lecz także uwidoczniło jego ograniczenia. Wraz z rozwojem kolei i telegrafu ludzie coraz wyraźniej uświadamiają sobie, że czas nie jest wszędzie taki sam."
 verrier.171.f: "Na początku XIX wieku na świecie nie istniał jeden standardowy system odmierzania czasu. Każde miasto i każda wieś posługiwały się lokalnym czasem słonecznym, wyznaczanym na podstawie momentu, w którym Słońce osiągało najwyższe położenie nad danym miejscem. Przez stulecia praktyka ta nie sprawiała problemów, dopóki podróżowanie i komunikacja pozostawały stosunkowo powolne. Jednak gwałtowny rozwój połączeń między odległymi miejscowościami sprawił, że różnice czasu stawały się coraz bardziej odczuwalne: między Londynem a Bristolem wynosiły na przykład około 11 minut, a między Nowym Jorkiem a Chicago niemal godzinę. Ta mnogość czasów lokalnych stanowiła poważny problem przy układaniu rozkładów jazdy, które wymagały precyzyjnego uzgadniania godzin odjazdów i przyjazdów.\n\nW odpowiedzi na te trudności brytyjskie przedsiębiorstwa kolejowe zaczęły w latach czterdziestych XIX wieku opracowywać system znany jako Czas Kolejowy. Początkowo stosowano go wyłącznie na potrzeby wewnętrzne, a zegary na stacjach nadal wskazywały czas lokalny. Ostatecznie jednak przeważyły praktyczne korzyści płynące z ujednolicenia czasu. Już w 1847 roku niemal wszystkie główne przedsiębiorstwa kolejowe przyjęły czas Greenwich (GMT) jako obowiązujący w swoich rozkładach jazdy, a do 1855 roku dostosowały się do niego niemal wszystkie brytyjskie miasta. Czas Kolejowy stał się tym samym faktycznym krajowym czasem standardowym, mimo że nie istniała jeszcze żadna podstawa prawna regulująca jego stosowanie."
 verrier.171.g: "To przedsiębiorstwa kolejowe i stacje telegraficzne wyznaczają teraz czas?"
 verrier.172.t: "Czas Standardowy"
 verrier.172.d: "Wraz z uchwaleniem ustawy ujednolicającej czas w [GetPlayer.GetName] system odmierzania czasu, stosowany dotychczas jedynie przez przedsiębiorstwa kolejowe i stacje telegraficzne, stał się częścią codziennego życia. Proces racjonalizacji zwiększa wydajność gospodarki i administracji, choć niektóre miasta z żalem żegnają się z własnym czasem lokalnym."
 verrier.172.f: "Czas Kolejowy był jedynie pragmatycznym prekursorem późniejszych krajowych czasów standardowych. Powstał z konieczności gospodarczej, a nie z inicjatywy rządu. Dopiero później wiele państw ustanowiło prawnie krajowy czas standardowy, który stał się obowiązujący nie tylko w rozkładach jazdy pociągów, lecz także we wszystkich dziedzinach życia społecznego. Wielka Brytania uczyniła to w 1880 roku, Niemcy poszły w jej ślady w 1893 roku, wprowadzając czas środkowoeuropejski, a Francja ostatecznie w 1911 roku, dostosowując swój czas do czasu Greenwich powiększonego o jedną godzinę.\n\nZasadnicza różnica między Czasem Kolejowym a Czasem Standardowym polegała na zakresie ich stosowania oraz mocy obowiązującej: Czas Kolejowy był rozwiązaniem przeznaczonym dla konkretnej branży, które początkowo usprawniało jedynie funkcjonowanie kolei, podczas gdy Krajowy Czas Standardowy oznaczał kompleksowe ujednolicenie czasu narzucone przez państwo. Oba te procesy były również pośrednio związane z późniejszym ustanowieniem południka zerowego podczas Międzynarodowej Konferencji Południkowej w 1884 roku."
 verrier.172.g: "Max Weber z pewnością miałby coś do powiedzenia na temat tego rozwoju wydarzeń."
 verrier.173.t: "Międzynarodowa Konferencja Południkowa"
 verrier.173.d: "Podczas konferencji w [ROOT.GetCountry.GetCapital.GetCityHubName], w obecności przedstawicieli kilku państw, zdecydowano, że południk zerowy powinien przebiegać przez [GetGlobalVariable('verrier_prime_meridian_global_var').GetCountry.GetName]. Już teraz mówi się o „czasie średnim [GetPlayer.GetCustom('verrier_prime_meridian_city')]”."
 verrier.173.f: "Międzynarodowa Konferencja Południkowa była konferencją mającą na celu wyznaczenie południka zerowego do użytku międzynarodowego. Przedmiotem obrad był wybór „południka, który miałby służyć jako wspólny punkt odniesienia dla długości geograficznej oraz standard pomiaru czasu na całym świecie”. Historycznie konferencja zakończyła się zaleceniem przyjęcia południka Greenwich jako międzynarodowego standardu zerowej długości geograficznej. Jednak ustanowienie południka zerowego nie było już wyłącznie kwestią kartografii, lecz stanowiło początek międzynarodowego porozumienia w sprawie stref czasowych, które musiały być wyznaczane względem określonego punktu odniesienia.\n\nHistoryczna przewaga Greenwich wynikała przede wszystkim ze statusu Wielkiej Brytanii jako mocarstwa oraz jej dominacji w handlu. Potęga państwa, technologie fizyczne, wiodąca pozycja w żegludze handlowej, pomyślne ułożenie kabla transatlantyckiego, wsparcie przedsiębiorstw w dziedzinie telegrafii lub kolejnictwa, a także posiadanie wybitnego astronoma — wszystko to odgrywa rolę w określeniu kraju, przez który przebiega południk zerowy."
 verrier.173.g: "Czy można umiędzynarodowić czas?"
 verrier.174.t: "Strefy Czasowe"
 verrier.174.d: "Po ustanowieniu [GetPlayer.GetCustom('verrier_prime_meridian_city')] jako południka zerowego oraz czasu średniego [GetPlayer.GetCustom('verrier_prime_meridian_city')] jako czasu odniesienia Międzynarodowa Konferencja Południkowa skupia się na wyznaczeniu stref czasowych."
 verrier.174.f: "Podział na strefy czasowe nie odpowiadał wszystkim państwom. Podczas gdy Stany Zjednoczone bez trudu przyjęły koncepcję podziału kraju na cztery strefy, nie wszędzie spotkała się ona z podobną akceptacją. Niektóre państwa obstawały przy jednej strefie czasowej dla całego kraju, opartej na czasie obowiązującym w stolicy, mimo że prowadziło to do problematycznych różnic czasu na granicach. W niektórych przypadkach zamiast zaokrąglać różnicę czasu do pełnej godziny, stosowano przesunięcia o pół godziny, aby lepiej dostosować system do szczególnych potrzeb danego państwa. Niektóre kraje wybierały nawet strefę czasową odbiegającą od ich rzeczywistego położenia geograficznego."
 verrier.174.g: "Opieramy się przede wszystkim na standardach międzynarodowych."
 verrier.174.h: "[GetPlayer.GetName] potrzebuje przede wszystkim korzystnej dla siebie strefy czasowej — nawet jeśli nie będzie ona w pełni zgodna z międzynarodowym systemem."
 verrier_radioactivity_tech: "Promieniotwórczość"
 verrier_radioactivity_tech_desc: "Promieniotwórczość naturalna została odkryta w 1895 roku przez Antoine’a Henriego Becquerela na podstawie zaczernienia płyty fotograficznej, jednak dopiero około 1915 roku prawidłowo zaklasyfikowano ją jako zjawisko fizyczne. Do ważnych odkryć, dokonywanych początkowo głównie przez Pierre’a Curie i Marię Curie, należało stwierdzenie istnienia różnych pierwiastków promieniotwórczych, z których część powstaje również w wyniku samego procesu rozpadu promieniotwórczego. W 1903 roku Becquerel oraz małżeństwo Curie otrzymali Nagrodę Nobla w dziedzinie fizyki za badania nad promieniotwórczością, które można uznać za historyczny początek badań jądrowych."
 verrier_spectroscopy_tech: "Spektroskopia"
 verrier_spectroscopy_tech_desc: "Spektroskopia obejmuje grupę metod fizycznych służących do analizy promieniowania na podstawie określonych właściwości, takich jak długość fali, energia, masa itp. Uzyskany rozkład natężenia nazywany jest widmem. Po wynalezieniu spektroskopu Robert Bunsen i Gustav Kirchhoff odkryli nowe pierwiastki, obserwując ich widma emisyjne."
