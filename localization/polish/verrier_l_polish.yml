 je_verrier_venus_transit_1874: "Tranzyt Wenus w 1874 roku w [SCOPE.sCountry('target').GetName]"
 je_verrier_venus_transit_1874_reason: "Zbliża się rzadkie zjawisko astronomiczne. Planeta Wenus przejdzie dokładnie między Ziemią a Słońcem, rzucając swój niewielki cień na tarczę słoneczną. Obserwatoria na całym świecie przygotowują się do obserwacji tego krótkotrwałego zjawiska, które może pomóc w określeniu rzeczywistych rozmiarów naszego Układu Słonecznego.\n$mr_divider_for_je$\nPodczas tej wyprawy będziesz zwiększać szansę na sukces. Po zakończeniu wyprawy otrzymasz modyfikator. Im większa będzie twoja szansa na sukces, tym silniejszy będzie efekt modyfikatora.\n#V Aktualna Szansa na Sukces:#! [GetPlayer.MakeScope.Var('verrier_venus_transit_success_var').GetValue|0+]"
 je_verrier_venus_transit_1874_on_complete_tt: "Pod koniec wyprawy istnieje #n 25% ryzyka wystąpienia złej pogody#!, która obniży twoją wartość sukcesu. Po zakończeniu wyprawy otrzymasz #V modyfikator#!, którego #V siła będzie zależeć od twojej wartości sukcesu#!."
