 verrier.9000.t: "Nauczycielka z Michigan próbuje pokonać wodospad Niagara w beczce"
 verrier.9000.d: "Próba pokonania szalejącego wodospadu w jakikolwiek sposób graniczy z szaleństwem. Ale w beczce? Kobieta? Annie Edson Taylor zamierza właśnie tego dokonać. Chce spłynąć wodospadem Niagara w beczce.\nCzy powinniśmy powstrzymać ją przed realizacją tego planu, czy pozwolić jej podjąć ryzyko?"
 verrier.9000.f: "„Pięć dolców, że utonie!”\n„Dziesięć dolarów, że dotrze na dół żywa!”\n\n#b Historycznie#! podejmowano rozmaite próby przeprawienia się przez wodospad Niagara, spłynięcia nim lub skoku z jego krawędzi. Większość kończyła się śmiercią. Ci, którzy przeżyli, zazwyczaj musieli liczyć się z grzywnami i innymi karami."
 verrier.9000.g: "Natychmiast powstrzymajcie to szaleństwo!"
 verrier.9000.h: "To nie mój problem. Niech robi, co chce..."
 verrier_niagara_falls_not_allow_barrel_tt: "Jeśli powstrzymasz nauczycielkę przed realizacją jej planu, z pewnością nie stanie się nic złego."
 verrier_niagara_falls_allow_barrel_tt: "Być może nauczycielka zostanie pierwszą osobą, która przeżyje spływ wodospadem Niagara w beczce. A może w ogóle tego nie przeżyje."
 verrier.9001.t: "Annie Edson Taylor jako pierwsza osoba pokonała wodospad Niagara w beczce"
 verrier.9001.d: "Choć wielu sądziło, że próba Annie Edson Taylor zakończy się śmiercią, przeżyła ona upadek z wodospadu Niagara. Odniosła pewne obrażenia, w tym krwawiące rany, ale jej stan jest dobry. Mimo to przestrzega wszystkich przed podobnymi próbami. Miejscowe władze przygotowały już rozporządzenie, na mocy którego takie wyczyny będą karalne."
 verrier.9001.f: "„Nikt nigdy nie powinien tego powtarzać”.\n\n   #b Historycznie#! Annie Edson Taylor przeżyła swoją próbę w 1901 roku. Po dotarciu na dół krwawiła jednak i przestrzegała potencjalnych naśladowców.\n   Mimo to znaleźli się ludzie, którzy próbowali dokonać tego samego. Charles Stephens był pierwszą osobą, która zginęła podczas takiej próby w 1920 roku."
 verrier.9001.g: "Miała szczęście. Teraz zabrońcie podejmowania kolejnych prób!"
 verrier.9002.t: "Annie Edson Taylor ginie podczas próby pokonania wodospadu Niagara"
 verrier.9002.d: "Stało się to, czego wielu się spodziewało. Annie Edson Taylor zginęła podczas próby pokonania wodospadu Niagara w beczce. Wygląda na to, że dotarła na dół żywa, lecz ciężko ranna. Nie zdołała jednak wydostać się z beczki i utonęła, gdy do środka wdarła się woda. Z pewnością nie była to lekka śmierć."
 verrier.9002.f: "„Kobieta z Michigan ginie podczas próby spłynięcia ogromnym wodospadem w beczce”.\n\n   #b Historycznie#! Annie Edson Taylor przeżyła swoją próbę w 1901 roku. Po dotarciu na dół krwawiła jednak i przestrzegała potencjalnych naśladowców.\n   Mimo to znaleźli się ludzie, którzy próbowali dokonać tego samego. Charles Stephens był pierwszą osobą, która zginęła podczas takiej próby w 1920 roku."
 verrier.9002.g: "Głupie zabawy, głupie nagrody... Zabrońcie wszystkim podejmowania takich prób raz na zawsze."
 verrier_barrel_successful_modifier: "Udany spływ wodospadem Niagara w beczce"
 verrier_barrel_unsuccessful_modifier: "Śmiertelna Wyprawa w Beczce"
 verrier.9003.t: "Wodospad Niagara zamarza"
 verrier.9003.d: "Mroźna zima sprawia, że wodospady Niagary coraz bardziej zamarzają. Pod jednym z nich utworzył się już lodowy most. Ludzie tłumnie przybywają, by podziwiać to widowisko, a przedsiębiorczy handlarze rozstawiają już na lodzie pierwsze przenośne kramy. Słychać jednak również ostrzeżenia, że lód może w każdej chwili pęknąć. Czy powinniśmy podjąć działania, aby zapewnić ludziom bezpieczeństwo?"
 verrier.9003.f: "„Cóż za lodowa kraina czarów! Wygląda magicznie! Jestem pewien, że ta zimowa kraina na zawsze pozostanie w pamięci jako piękne wspomnienie!”\n\n#b Historycznie,#! wody Ameryki Północnej wielokrotnie zamarzały. Wodospad Niagara nie był wyjątkiem. Spadające bryły lodu często tworzyły pod wodospadem „lodowy most”, a od lat osiemdziesiątych XIX wieku ludzie gromadzili się tam na swego rodzaju ludowym festynie z rozrywkami i napitkami."
 verrier.9003.g: "Musimy zadbać o bezpieczeństwo. Zablokujcie dostęp do lodowego mostu."
 verrier.9003.h: "Ludzie z pewnością są świadomi ryzyka i zachowują ostrożność!"
 verrier_niagara_falls_no_security_tt: "Nie blokujesz dostępu do lodowego mostu. Miejmy nadzieję, że nic się nie stanie, ale #n nigdy nic nie wiadomo#!...."
 verrier.9004.t: "Lodowy most pod wodospadem Niagara runął — kilka ofiar śmiertelnych"
 verrier.9004.d: "Dotarły do nas straszne wieści znad wodospadu Niagara. Lodowy most rozpadł się, a jego fragmenty popłynęły w dół rzeki z zawrotną prędkością. Większość przebywających na moście ludzi zdołała się uratować, lecz kilkoro nieszczęśników zostało uwięzionych na krze. Podczas próby ratunku podjętej przez strażaków zginęli w szalejącej mieszaninie lodu i wody.\nOstra krytyka spada na władze [SCOPE.sState('niagara_falls_state_scope').GetName], ponieważ katastrofie można było łatwo zapobiec."
 verrier.9004.f: "„Rozległ się huk niczym salwa baterii artylerii, gdy wielki lodowy most w wąwozie tuż poniżej potężnego wodospadu nagle ruszył z miejsca, unosząc znajdujących się na nim ludzi. Niektórzy wskoczyli do wody i zdołali dotrzeć do brzegu, drżąc z zimna. Inni byli zbyt powolni i musieli bezradnie patrzeć, jak ogromna masa lodu pędzi w dół rzeki”.\n\n#b Historycznie,#! wody Ameryki Północnej wielokrotnie zamarzały. Wodospad Niagara nie był wyjątkiem. Spadające bryły lodu często tworzyły pod wodospadem „lodowy most”, a od lat osiemdziesiątych XIX wieku ludzie gromadzili się tam na swego rodzaju ludowym festynie z rozrywkami i napitkami. W 1912 roku lodowy most oderwał się, powodując śmierć trzech osób. Od tamtej pory odwiedzających ostrzega się, by nie wchodzili na lód."
 verrier.9004.g: "Cóż za niepotrzebna tragedia!"
 verrier.9005.t: "Lód przy wodospadzie Niagara stopniał"
 verrier.9005.d: "Nad wodospadem Niagara znów zrobiło się spokojniej. Lód utrzymał się tylko przez krótki czas i zdążył już ustąpić. Teraz woda jak zwykle z hukiem spada do niecki u podnóża wodospadu. Po tych krótkich chwilach pozostały urzekające wspomnienia i pokaźne zyski kilku miejscowych przedsiębiorców. Kto wie, kiedy wodospad Niagara zamarznie ponownie?"
 verrier.9005.f: "„Pewnego dnia opowiem dzieciom, jak stałem na lodowym moście i usłyszałem trzask. Na szczęście nie było to nic groźnego. Zamiast tego tańczyłem na lodzie z żoną!”\n\n#b Historycznie,#! wody Ameryki Północnej wielokrotnie zamarzały. Wodospad Niagara nie był wyjątkiem. Spadające bryły lodu często tworzyły pod wodospadem „lodowy most”, a od lat osiemdziesiątych XIX wieku ludzie gromadzili się tam na swego rodzaju ludowym festynie z rozrywkami i napitkami. W 1912 roku lodowy most oderwał się, powodując śmierć trzech osób. Od tamtej pory odwiedzających ostrzega się, by nie wchodzili na lód."
 verrier.9005.g: "Wspaniale!"
