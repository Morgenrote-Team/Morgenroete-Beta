 verrier.22.t: "Sfotografowano Niezwykły Obiekt"
 verrier.22.d: "Dr. [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] odkrył dziwny obiekt na [ROOT.Var('verrier_astronomer_var').GetCharacter.GetHerHis] ostatniej fotografii nocnego nieba. Nie wydaje się on ani planetą, ani planetoidą, ani kometą, ale nie jest też poszukiwaną Planetą X."
 verrier.22.f: "Niektórzy asystenci próbowali już przekonać astronoma, że może to być pozaziemski środek transportu, podobny do tych opisywanych w popularnych powieściach sensacyjno-fantastycznych, lecz Dr. [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] odrzucił tak niedorzeczne pomysły. [ROOT.Var('verrier_astronomer_var').GetCharacter.GetSheHe|U] uważał pojawienie się kosmicznego anioła za bardziej prawdopodobne."
 verrier.22.g: "Dr. [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] otrzyma dodatkowych asystentów i zasoby do zbadania nieznanego obiektu."
 verrier.22.h: "Obserwatorium powinno zintensyfikować wysiłki na rzecz odkrywania nowych obiektów!"
 verrier.22.i: "Prawdopodobnie zwykłe oszustwo bez żadnej wartości."
 verrier.22g.tt: "Obserwatorium przeznaczy wszystkie swoje zasoby na dokładne zbadanie nieznanego obiektu. Przez rok nie zostaną odkryte żadne nowe obiekty astronomiczne."
 verrier.22h.tt: "Obserwatorium zignoruje nieznany obiekt i będzie kontynuować swoją normalną działalność."
 verrier.23.t: "Centaur"
 verrier.23.d: "Po dokładnym zbadaniu nieznanego obiektu nasz główny astronom jest pewien: sfotografowane ciało niebieskie należy do zupełnie nowej klasy planetoid! Ta nowa klasa otrzyma nazwę „Centaury”. Teraz pozostaje jedynie wybrać odpowiednią nazwę dla odkrytego obiektu."
 verrier.23.f: "Centaur, którego nazwa pochodzi od centaurów z mitologii greckiej, jest przedstawicielem klasy planetoid, których orbity znajdują się między orbitami Jowisza i Neptuna. Orbity centaurów wykazują duże zróżnicowanie mimośrodu. Chociaż pierwszy potwierdzony centaur, Chiron, został odkryty dopiero w 1977 roku, jego fotografie pochodzą już z 1895 roku. Centaur Hidalgo został odkryty w 1920 roku, lecz nie zaliczono go wówczas do odrębnej klasy."
