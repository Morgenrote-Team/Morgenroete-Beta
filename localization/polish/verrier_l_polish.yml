 verrier.501.t: "Satelita odkryty przez inny kraj"
 verrier.501.d: "Niestety inny kraj odnalazł satelitę, którego zamierzał odkryć Dr. [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName]. Wiadomość obiegła już wszystkie gazety."
 verrier.501.f: "„Patrzenie jest w pewnym sensie sztuką, której trzeba się nauczyć”. — William Herschel"
 verrier.501.g: "Rozczarowujące."
 verrier.511.t: "Deimos odkryty"
 verrier.511.d: "Wielomiesięczne poszukiwania prowadzone przez [ROOT.Var('verrier_astronomer_var').GetCharacter.GetFullName] przyniosły owoce: [ROOT.Var('verrier_astronomer_var').GetCharacter.GetSheHe] odkrył nieznanego dotąd satelitę na orbicie Marsa! Ciało niebieskie otrzymało nazwę #YELLOW Deimos#!."
 verrier.511.f: "„Ponowiłem obserwacje na początku nocy 11 (sierpnia 1877 roku) i znów niczego nie znalazłem, lecz gdy spróbowałem ponownie kilka godzin później, dostrzegłem słaby obiekt po stronie podążającej za planetą i nieco na północ od niej. Ledwie zdążyłem ustalić jego położenie, gdy mgła znad rzeki przerwała pracę. Było to o wpół do trzeciej w nocy 11 sierpnia. Przez kilka kolejnych dni obserwacje uniemożliwiało zachmurzenie. 16 sierpnia obiekt odnaleziono ponownie po stronie podążającej za planetą, a obserwacje z tej nocy wykazały, że porusza się wraz z nią i — jeśli jest satelitą — znajduje się w pobliżu jednej ze swoich elongacji. Do tej pory nikomu w Obserwatorium nie wspominałem o poszukiwaniu satelity Marsa. Jednak gdy po obserwacjach z 16 sierpnia opuszczałem obserwatorium około trzeciej nad ranem, powiedziałem swojemu asystentowi, George’owi Andersonowi, któremu pokazałem ten obiekt, że moim zdaniem odkryłem satelitę Marsa”. — Asaph Hall"
 verrier.511.g: "Jeszcze jeden księżyc w naszej kolekcji."
 verrier.512.t: "Fobos odkryty"
 verrier.512.d: "Wielomiesięczne poszukiwania prowadzone przez [ROOT.Var('verrier_astronomer_var').GetCharacter.GetFullName] przyniosły owoce: [ROOT.Var('verrier_astronomer_var').GetCharacter.GetSheHe] odkrył nieznanego dotąd satelitę na orbicie Marsa! Ciało niebieskie otrzymało nazwę #YELLOW Fobos#!."
 verrier.512.f: "„17 sierpnia (1877 roku), między pierwszą a drugą, gdy opracowywałem wyniki obserwacji, profesor Newcomb wszedł do mojego pokoju, aby zjeść obiad. Pokazałem mu pomiary słabego obiektu w pobliżu Marsa, które dowodziły, że porusza się on wraz z planetą. Tego samego dnia, podczas oczekiwania na pojawienie się zewnętrznego księżyca i wypatrywania go, odkryto księżyc wewnętrzny. Obserwacje z 17 i 18 sierpnia rozwiały wszelkie wątpliwości co do natury tych obiektów, a odkrycie zostało publicznie ogłoszone przez admirała Rodgersa”. — Asaph Hall"
 verrier.521.t: "Odkryto Amalteę"
 verrier.521.d: "Wielomiesięczne poszukiwania prowadzone przez [ROOT.Var('verrier_astronomer_var').GetCharacter.GetFullName] przyniosły owoce: [ROOT.Var('verrier_astronomer_var').GetCharacter.GetSheHe] odkrył nieznanego dotąd satelitę na orbicie Jowisza! Ciało niebieskie otrzymało nazwę #YELLOW Amaltea#!."
 verrier.521.f: "Amalteę odkrył 9 września 1892 roku astronom Edward E. Barnard podczas systematycznych poszukiwań kolejnych księżyców Jowisza, korzystając z teleskopu o średnicy 91 cm w Obserwatorium Licka na Mount Hamilton (Kalifornia, USA). Był to piąty odkryty księżyc Jowisza, po pierwszej obserwacji czterech księżyców galileuszowych w 1610 roku. Jako piąty odkryty księżyc tej planety Amaltea otrzymała oznaczenie systematyczne Jowisz V, ponieważ rzymska cyfra V oznacza liczbę 5. Francuski astronom Camille Flammarion zaproponował nazwę Amaltea, która pozostawała w nieoficjalnym użyciu przez dziesięciolecia, zanim została oficjalnie przyjęta."
 verrier.522.t: "Odkryto Himalię"
 verrier.522.d: "Wielomiesięczne poszukiwania prowadzone przez [ROOT.Var('verrier_astronomer_var').GetCharacter.GetFullName] przyniosły owoce: [ROOT.Var('verrier_astronomer_var').GetCharacter.GetSheHe] odkrył nieznanego dotąd satelitę na orbicie Jowisza! Ciało niebieskie otrzymało nazwę #YELLOW Himalia#!."
 verrier.522.f: "Himalia jest największym z zewnętrznych, nieregularnych księżyców Jowisza. Odkrył ją 3 grudnia 1904 roku astronom Charles Dillon Perrine w Obserwatorium Licka (San Jose, Kalifornia). Księżyc nazwano na cześć nimfy Himalii, kochanki Zeusa z mitologii greckiej."
 verrier.523.t: "Odkryto Elarę"
 verrier.523.d: "Wielomiesięczne poszukiwania prowadzone przez [ROOT.Var('verrier_astronomer_var').GetCharacter.GetFullName] przyniosły owoce: [ROOT.Var('verrier_astronomer_var').GetCharacter.GetSheHe] odkrył nieznanego dotąd satelitę na orbicie Jowisza! Ciało niebieskie otrzymało nazwę #YELLOW Elara#!."
 verrier.523.f: "Elarę odkrył 2 stycznia 1905 roku astronom Charles Dillon Perrine w Obserwatorium Licka (San Jose, Kalifornia). Jest drugim co do wielkości z zewnętrznych, nieregularnych księżyców Jowisza i ósmym co do wielkości spośród wszystkich księżyców tej planety. Księżyc nazwano na cześć Elary, kochanki Zeusa z mitologii greckiej."
 verrier.524.t: "Odkryto Pazyfae"
 verrier.524.d: "Wielomiesięczne poszukiwania prowadzone przez [ROOT.Var('verrier_astronomer_var').GetCharacter.GetFullName] przyniosły owoce: [ROOT.Var('verrier_astronomer_var').GetCharacter.GetSheHe] odkrył nieznanego dotąd satelitę na orbicie Jowisza! Ciało niebieskie otrzymało nazwę #YELLOW Pazyfae#!."
 verrier.524.f: "Pazyfae odkrył 27 stycznia 1908 roku astronom Philibert Jacques Melotte. Po raz pierwszy dostrzeżono ją na płytach fotograficznych naświetlonych w Królewskim Obserwatorium w Greenwich (Anglia) w nocy 28 lutego 1908 roku. Analiza innych płyt wykazała, że obiekt zarejestrowano już 27 stycznia. Ponieważ początkowo nie było jasne, czy jest to planetoida, czy księżyc, otrzymał tymczasowe oznaczenie planetoidy 1908 CJ. Odkrycie ósmego księżyca Jowisza ostatecznie potwierdzono 10 kwietnia. Księżyc nazwano na cześć Pazyfae, żony Minosa i matki Minotaura z mitologii greckiej. Od Pazyfae pochodzi nazwa grupy księżyców Jowisza poruszających się po podobnych orbitach. Grupa Pazyfae liczy trzynastu członków, z których Pazyfae jest największa."
 verrier.525.t: "Odkryto Sinope"
 verrier.525.d: "Wielomiesięczne poszukiwania prowadzone przez [ROOT.Var('verrier_astronomer_var').GetCharacter.GetFullName] przyniosły owoce: [ROOT.Var('verrier_astronomer_var').GetCharacter.GetSheHe] odkrył nieznanego dotąd satelitę na orbicie Jowisza! Ciało niebieskie otrzymało nazwę #YELLOW Sinope#!."
 verrier.525.f: "Sinope odkrył 1 lipca 1914 roku astronom Seth Barnes Nicholson w Obserwatorium Licka. Księżyc nazwano na cześć Sinope, nimfy z mitologii greckiej, o której względy zabiegał Zeus i którą porwał Apollo. Ze względu na właściwości orbity Sinope zalicza się do grupy Pazyfae."
 verrier.526.t: "Odkryto Lizyteę"
 verrier.526.d: "Wielomiesięczne poszukiwania prowadzone przez [ROOT.Var('verrier_astronomer_var').GetCharacter.GetFullName] przyniosły owoce: [ROOT.Var('verrier_astronomer_var').GetCharacter.GetSheHe] odkrył nieznanego dotąd satelitę na orbicie Jowisza! Ciało niebieskie otrzymało nazwę #YELLOW Lizytea#!."
 verrier.526.f: "Lizyteę odkrył 6 lipca 1938 roku astronom Seth Barnes Nicholson w Obserwatorium Mount Wilson. Księżyc nazwano na cześć Lizytei, kochanki Zeusa z mitologii greckiej. Ze względu na właściwości orbity zalicza się go do grupy Himalii, nazwanej od księżyca Jowisza — Himalii."
 verrier.527.t: "Odkryto Karme"
 verrier.527.d: "Wielomiesięczne poszukiwania prowadzone przez [ROOT.Var('verrier_astronomer_var').GetCharacter.GetFullName] przyniosły owoce: [ROOT.Var('verrier_astronomer_var').GetCharacter.GetSheHe] odkrył nieznanego dotąd satelitę na orbicie Jowisza! Ciało niebieskie otrzymało nazwę #YELLOW Karme#!."
 verrier.527.f: "Karme odkrył 30 lipca 1938 roku astronom Seth Barnes Nicholson w Obserwatorium Mount Wilson w Kalifornii. Nicholson fotografował Jowisza od 5 lipca do 25 sierpnia, a Karme była widoczna na płycie fotograficznej naświetlonej 30 lipca. Odkrycie nowego księżyca Jowisza ogłoszono pod koniec sierpnia tego samego roku. Księżyc nazwano na cześć Karme, kochanki Zeusa z mitologii greckiej."
 verrier.531.t: "Odkryto Enceladusa"
 verrier.531.d: "Wielomiesięczne poszukiwania prowadzone przez [ROOT.Var('verrier_astronomer_var').GetCharacter.GetFullName] przyniosły owoce: [ROOT.Var('verrier_astronomer_var').GetCharacter.GetSheHe] odkrył nieznanego dotąd satelitę na orbicie Saturna! Ciało niebieskie otrzymało nazwę #YELLOW Enceladus#!."
 verrier.531.f: "Enceladusa odkrył 28 sierpnia 1789 roku niemiecko-brytyjski astronom Wilhelm Herschel. Był szóstym odkrytym księżycem Saturna i dwunastym odkrytym księżycem w całym Układzie Słonecznym (nie licząc Księżyca Ziemi). Ponieważ jego orbita była wówczas drugą najbliższą Saturnowi, uznano go za drugi od wewnątrz spośród siedmiu znanych wówczas dużych księżyców tej planety. Księżyc nazwano na cześć giganta Enkeladosa (forma łacińska: Enceladus) z mitologii greckiej. Nazwę Enceladus, podobnie jak nazwy siedmiu innych księżyców Saturna, zaproponował syn Wilhelma Herschela, astronom John Herschel."
 verrier.532.t: "Odkryto Mimasa"
 verrier.532.d: "Wielomiesięczne poszukiwania prowadzone przez [ROOT.Var('verrier_astronomer_var').GetCharacter.GetFullName] przyniosły owoce: [ROOT.Var('verrier_astronomer_var').GetCharacter.GetSheHe] odkrył nieznanego dotąd satelitę na orbicie Saturna! Ciało niebieskie otrzymało nazwę #YELLOW Mimas#!."
 verrier.532.f: "„Nieustannie prowadziłem obserwacje, ilekroć pozwalała na to pogoda, a wielka zdolność zbierania światła przez czterdziestostopowy teleskop zwierciadlany okazała się tak przydatna, że 17 września odkryłem również siódmego satelitę, gdy znajdował się w największej elongacji po stronie poprzedzającej planetę”. — William Herschel"
 verrier.533.t: "Odkryto Hyperiona"
 verrier.533.d: "Wielomiesięczne poszukiwania prowadzone przez [ROOT.Var('verrier_astronomer_var').GetCharacter.GetFullName] przyniosły owoce: [ROOT.Var('verrier_astronomer_var').GetCharacter.GetSheHe] odkrył nieznanego dotąd satelitę na orbicie Saturna! Ciało niebieskie otrzymało nazwę #YELLOW Hyperion#!."
 verrier.533.f: "Hyperiona odkryli niezależnie we wrześniu 1848 roku William Cranch Bond i jego syn George Phillips Bond w Stanach Zjednoczonych oraz William Lassell w Wielkiej Brytanii. Księżyc nazwano na cześć tytana Hyperiona, boga czujności i obserwacji, starszego brata Kronosa (greckiego odpowiednika rzymskiego boga Saturna)."
 verrier.534.t: "Febe odkryta"
 verrier.534.d: "Wielomiesięczne poszukiwania prowadzone przez [ROOT.Var('verrier_astronomer_var').GetCharacter.GetFullName] przyniosły owoce: [ROOT.Var('verrier_astronomer_var').GetCharacter.GetSheHe] odkrył nieznanego dotąd satelitę na orbicie Saturna! Ciało niebieskie otrzymało nazwę #YELLOW Febe#!."
 verrier.534.f: "Febe odkrył William Henry Pickering 18 marca 1899 roku na płytach fotograficznych, które DeLisle Stewart naświetlał od 16 sierpnia 1898 roku w Obserwatorium Boydena w pobliżu Arequipy w Peru. Był to pierwszy satelita odkryty za pomocą fotografii. Febe zawdzięcza nazwę tytanidzie z mitologii greckiej, związanej z Księżycem i będącej siostrą Kronosa. „W 1900 roku nawet ja — stwierdził Pickering — zacząłem się zastanawiać, czy cztery obrazy z 1898 roku nie były jednak wadami płyt lub słabymi gwiazdami, które pojawiły się wskutek osobliwego zbiegu okoliczności”. Pickering odnalazł jednak Febe ponownie. Uważał również, że w 1905 roku odkrył dziesiąty księżyc Saturna na płytach wykonanych w 1904 roku, i nadał mu nazwę „Temida”. Za to odkrycie otrzymał w 1905 roku Nagrodę Lalande’a Francuskiej Akademii Nauk. Później wykazano, że „Temida” nie istnieje."
 verrier.541.t: "Odkryto Tytanię"
 verrier.541.d: "Wielomiesięczne poszukiwania prowadzone przez [ROOT.Var('verrier_astronomer_var').GetCharacter.GetFullName] przyniosły owoce: [ROOT.Var('verrier_astronomer_var').GetCharacter.GetSheHe] odkrył nieznanego dotąd satelitę na orbicie Urana! Ciało niebieskie otrzymało nazwę #YELLOW Tytania#!."
 verrier.541.f: "Tytania jest największym księżycem Urana i ósmym co do wielkości księżycem Układu Słonecznego. Odkrył ją William Herschel 11 stycznia 1787 roku, tego samego dnia, w którym odkrył drugi co do wielkości księżyc Urana, Oberona. Później donosił o odkryciu czterech kolejnych satelitów, lecz z czasem okazało się, że były to błędne obserwacje. Przez niemal 50 kolejnych lat Tytanię i Oberona obserwowano wyłącznie za pomocą instrumentów Williama Herschela, choć dziś księżyc ten można dostrzec z Ziemi przez wysokiej klasy teleskop amatorski. Wszystkie księżyce Urana noszą imiona postaci stworzonych przez Williama Shakespeare’a lub Alexandra Pope’a. Nazwa Tytania pochodzi od imienia królowej wróżek ze „Snu nocy letniej”."
 verrier.542.t: "Odkryto Oberona"
 verrier.542.d: "Wielomiesięczne poszukiwania prowadzone przez [ROOT.Var('verrier_astronomer_var').GetCharacter.GetFullName] przyniosły owoce: [ROOT.Var('verrier_astronomer_var').GetCharacter.GetSheHe] odkrył nieznanego dotąd satelitę na orbicie Urana! Ciało niebieskie otrzymało nazwę #YELLOW Oberon#!."
 verrier.542.f: "Oberon jest najbardziej zewnętrznym i drugim co do wielkości księżycem Urana. Zajmuje również drugie miejsce pod względem masy wśród księżyców tej planety i dziesiąte w całym Układzie Słonecznym. Odkrył go William Herschel 11 stycznia 1787 roku, tego samego dnia, w którym odkrył największy księżyc Urana, Tytanię. Później donosił o odkryciu czterech kolejnych satelitów, lecz z czasem okazało się, że były to błędne obserwacje. Przez niemal 50 kolejnych lat Tytanię i Oberona obserwowano wyłącznie za pomocą instrumentów Williama Herschela, choć dziś księżyc ten można dostrzec z Ziemi przez wysokiej klasy teleskop amatorski. Wszystkie księżyce Urana noszą imiona postaci stworzonych przez Williama Shakespeare’a lub Alexandra Pope’a. Nazwa Oberon pochodzi od imienia króla wróżek ze „Snu nocy letniej”."
 verrier.543.t: "Odkryto Ariela"
 verrier.543.d: "Wielomiesięczne poszukiwania prowadzone przez [ROOT.Var('verrier_astronomer_var').GetCharacter.GetFullName] przyniosły owoce: [ROOT.Var('verrier_astronomer_var').GetCharacter.GetSheHe] odkrył nieznanego dotąd satelitę na orbicie Urana! Ciało niebieskie otrzymało nazwę #YELLOW Ariel#!."
 verrier.543.f: "Ariel jest najjaśniejszym i czwartym co do wielkości spośród znanych księżyców Urana. Ariela i Umbriela odkrył 24 października 1851 roku brytyjski astronom William Lassell jako trzeci i czwarty księżyc Urana, korzystając z teleskopu zwierciadlanego o średnicy 60 cm w samodzielnie zbudowanym obserwatorium w Liverpoolu. Księżyc nazwano na cześć sylfa z poematu heroikomicznego Alexandra Pope’a „Pukiel włosów ucięty”."
 verrier.544.t: "Odkryto Umbriela"
 verrier.544.d: "Wielomiesięczne poszukiwania prowadzone przez [ROOT.Var('verrier_astronomer_var').GetCharacter.GetFullName] przyniosły owoce: [ROOT.Var('verrier_astronomer_var').GetCharacter.GetSheHe] odkrył nieznanego dotąd satelitę na orbicie Urana! Ciało niebieskie otrzymało nazwę #YELLOW Umbriel#!."
 verrier.544.f: "Umbriel jest trzecim co do wielkości księżycem Urana. Odkrył go William Lassell 24 października 1851 roku. Został odkryty jednocześnie z Arielem i nazwany na cześć postaci z poematu Alexandra Pope’a „Pukiel włosów ucięty” z 1712 roku. Choć William Herschel, odkrywca Tytanii i Oberona, twierdził pod koniec XVIII wieku, że zaobserwował cztery dodatkowe księżyce Urana, jego obserwacji nie potwierdzono i obecnie uważa się, że te cztery obiekty były wynikiem błędnych obserwacji."
 verrier.545.t: "Odkryto Mirandę"
 verrier.545.d: "Wielomiesięczne poszukiwania prowadzone przez [ROOT.Var('verrier_astronomer_var').GetCharacter.GetFullName] przyniosły owoce: [ROOT.Var('verrier_astronomer_var').GetCharacter.GetSheHe] odkrył nieznanego dotąd satelitę na orbicie Urana! Ciało niebieskie otrzymało nazwę #YELLOW Miranda#!."
 verrier.545.f: "Mirandę odkrył 16 lutego 1948 roku astronom planetarny Gerard Kuiper za pomocą 82-calowego (2,080 mm) teleskopu Ottona Struvego w Obserwatorium McDonalda. Jej ruch wokół Urana potwierdzono 1 marca 1948 roku. Był to pierwszy satelita Urana odkryty od niemal 100 lat. Kuiper postanowił nadać obiektowi nazwę „Miranda” na cześć postaci z „Burzy” Shakespeare’a, ponieważ cztery wcześniej odkryte księżyce Urana — Ariel, Umbriel, Tytania i Oberon — nosiły imiona postaci z utworów Shakespeare’a lub Alexandra Pope’a. Jednak poprzednie księżyce nazwano na cześć istot nadprzyrodzonych, podczas gdy Miranda była człowiekiem."
 verrier.551.t: "Odkryto Trytona"
 verrier.551.d: "Wkrótce po odkryciu Neptuna [ROOT.Var('verrier_astronomer_var').GetCharacter.GetFullName] odkrył nieznanego dotąd satelitę na jego orbicie! Ciało niebieskie otrzymało nazwę #YELLOW Tryton#!."
 verrier.551.f: "Tryton jest największym naturalnym satelitą Neptuna. To jedyny księżyc tej planety o masie wystarczającej, by pod wpływem własnej grawitacji przybrać zaokrąglony kształt. Ma też rzadką, lecz wyraźnie uwarstwioną atmosferę. Jako jedyny duży księżyc w Układzie Słonecznym porusza się po orbicie wstecznej — w kierunku przeciwnym do obrotu macierzystej planety. Trytona odkrył brytyjski astronom William Lassell 10 października 1846 roku, zaledwie 17 dni po odkryciu Neptuna. Gdy John Herschel otrzymał wiadomość o odkryciu planety, napisał do Lassella, sugerując poszukiwanie jej ewentualnych księżyców. Osiem dni później Lassell odkrył Trytona. Będący z zawodu piwowarem Lassell dostrzegł go za pomocą samodzielnie zbudowanego teleskopu zwierciadlanego z metalowym zwierciadłem o średnicy 61 cm (24 cale), znanego również jako reflektor „dwustopowy”. Tryton zawdzięcza nazwę greckiemu bogu morskiemu Trytonowi, synowi Posejdona (greckiego odpowiednika rzymskiego Neptuna)."
 verrier.552.t: "Odkryto Nereidę"
 verrier.552.d: "Wielomiesięczne poszukiwania prowadzone przez [ROOT.Var('verrier_astronomer_var').GetCharacter.GetFullName] przyniosły owoce: [ROOT.Var('verrier_astronomer_var').GetCharacter.GetSheHe] odkrył nieznanego dotąd satelitę na orbicie Neptuna! Ciało niebieskie otrzymało nazwę #YELLOW Nereida#!."
 verrier.552.f: "Nereida jest trzecim co do wielkości księżycem Neptuna. Odkrył ją 1 maja 1949 roku Gerard P. Kuiper na płytach fotograficznych wykonanych za pomocą 82-calowego teleskopu w Obserwatorium McDonalda. Nazwę zaproponował w raporcie ze swojego odkrycia. Pochodzi ona od nereid, nimf morskich z mitologii greckiej, towarzyszących bogu Neptunowi. Był to drugi i zarazem ostatni księżyc Neptuna odkryty przed przybyciem sondy Voyager 2."
 verrier.49.t: "Plamy Słoneczne"
 verrier.49.d: "Badacze z naszego obserwatorium zaobserwowali niezwykłą aktywność słoneczną związaną z plamami słonecznymi."
 verrier.49.f: "Plamy słoneczne to ciemne obszary na widocznej powierzchni Słońca (fotosferze), które są chłodniejsze od otoczenia i dlatego emitują mniej światła widzialnego. Ich liczba i rozmiary stanowią najprostszą miarę tak zwanej aktywności słonecznej. Częstotliwość występowania plam zmienia się w cyklu trwającym średnio jedenaście lat, zwanym cyklem plam słonecznych. Przyczyną powstawania plam i zachodzących w ich pobliżu erupcji są silne pola magnetyczne, które w niektórych obszarach utrudniają transport ciepła z wnętrza Słońca na jego powierzchnię. Odkryto kilka nieznanych dotąd plam."
