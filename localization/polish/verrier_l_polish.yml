 verrier_astronomer: "Astronom"
 verrier_astronomer_desc: "Ten naukowiec bada zjawiska na gwiaździstym niebie i niestrudzenie obserwuje obiekty astronomiczne przez teleskop."
 verrier_astronomer_experienced: "Doświadczony Astronom"
 verrier_astronomer_experienced_desc: "Ta postać dokonała niezwykłych odkryć astronomicznych i dlatego cieszy się wielkim uznaniem społeczeństwa."
 verrier_astronomer_famous: "Sławny Astronom"
 verrier_astronomer_famous_desc: "Dzięki licznym odkryciom i wkładowi w lepsze zrozumienie wszechświata ten astronom uchodzi za jeden z najbardziej cenionych umysłów epoki."
 verrier_physics_tech: "Fizyka Klasyczna"
 verrier_physics_tech_desc: "Fizyka wyodrębniła się jako samodzielna nauka, gdy Europejczycy we wczesnej epoce nowożytnej zaczęli stosować metody doświadczalne i ilościowe do odkrywania praw uznawanych dziś za prawa fizyki. Do najważniejszych osiągnięć tego okresu należą zastąpienie geocentrycznego modelu Układu Słonecznego heliocentrycznym modelem Kopernika, sformułowanie praw ruchu planet (przez Keplera w latach 1609–1619), pionierskie prace Galileusza nad teleskopami i astronomią obserwacyjną w XVI i XVII wieku oraz odkrycie i ujęcie w spójną teorię praw ruchu i powszechnego ciążenia przez Isaaca Newtona (które później nazwano jego imieniem)."
 verrier_astronomy_tech: "Współczesna Astronomia"
 verrier_astronomy_tech_desc: "W XVIII i XIX wieku badania nad zagadnieniem trzech ciał prowadzone przez Leonharda Eulera, Alexisa Claude’a Clairauta i Jeana le Ronda d’Alemberta umożliwiły dokładniejsze przewidywanie ruchów Księżyca i planet. Prace te rozwinęli następnie Joseph-Louis Lagrange i Pierre Simon Laplace, co pozwoliło szacować masy planet i ich księżyców na podstawie perturbacji ich ruchu."
 verrier_electromagnetism_tech: "Elektromagnetyzm"
 verrier_electromagnetism_tech_desc: "W 1864 roku James Clerk Maxwell z Edynburga ogłosił elektromagnetyczną teorię światła, co było być może największym pojedynczym krokiem w rozwoju wiedzy o elektryczności. Teoria Maxwella zakładała istnienie fal elektromagnetycznych w wolnej przestrzeni, a jego następcy postawili sobie za cel doświadczalne potwierdzenie jej słuszności. Odkrycie fal elektromagnetycznych rozchodzących się w przestrzeni doprowadziło do powstania radia u schyłku XIX wieku."
 verrier_chemistry_tech_desc: "Elektrochemiczna teoria powstawania związków chemicznych rozwinęła się na początku XIX wieku przede wszystkim dzięki pracom dwóch uczonych: Jönsa Jacoba Berzeliusa i Humphry’ego Davy’ego. Ich badania umożliwiło wcześniejsze wynalezienie stosu Volty przez Alessandra Voltę. Brytyjczyk William Prout jako pierwszy zaproponował uporządkowanie wszystkich pierwiastków według mas atomowych, zakładając, że masa każdego atomu jest całkowitą wielokrotnością masy atomu wodoru. J.A.R. Newlands opracował wczesną tablicę pierwiastków, którą następnie rozwinięto we współczesny układ okresowy pierwiastków."
 je_verrier_neptune: "Nieznana Planeta"
 je_verrier_neptune_reason: "W 1821 roku Alexis Bouvard opublikował tablice astronomiczne opisujące orbitę Urana i przewidujące jego przyszłe położenie na podstawie praw ruchu i ciążenia Newtona. Późniejsze obserwacje ujawniły znaczne rozbieżności względem tablic, co skłoniło Bouvarda do wysunięcia hipotezy o istnieniu ciała zaburzającego ruch planety. Nieprawidłowości te, dotyczące zarówno długości ekliptycznej planety, jak i jej promienia wodzącego (odległości od Słońca), można było wyjaśnić kilkoma hipotezami: oddziaływanie grawitacyjne Słońca na tak wielką odległość mogło odbiegać od opisu Newtona; rozbieżności mogły być po prostu skutkiem błędów obserwacyjnych; być może jednak Uran był przyciągany przez nieodkrytą planetę, która zaburzała jego ruch. John Couch Adams dowiedział się o tych nieprawidłowościach jeszcze podczas studiów i nabrał przekonania o słuszności hipotezy perturbacyjnej. Uważał, że na podstawie danych obserwacyjnych Urana i prawa ciążenia Newtona zdoła wyznaczyć masę, położenie i orbitę ciała zaburzającego jego ruch. Tymczasem 10 listopada 1845 roku Urbain Le Verrier przedstawił paryskiej Akademii Nauk rozprawę o Uranie, wykazując, że dotychczasowa teoria nie wyjaśnia w pełni jego ruchu. Nie wiedząc o pracach Adamsa, podjął podobne badania i 1 czerwca 1846 roku, w drugiej rozprawie przedstawionej na publicznym posiedzeniu Akademii, podał położenie domniemanego ciała zaburzającego, lecz nie jego masę ani orbitę. Le Verrier wyznaczył położenie nieznanej planety z dokładnością do jednego stopnia względem miejsca, w którym została później odkryta. Nie wiedział, że publiczne potwierdzenie przez niego nieopublikowanych obliczeń Adamsa zapoczątkowało brytyjskie poszukiwania domniemanej planety. 31 sierpnia Le Verrier przedstawił trzecią rozprawę, podając już masę i orbitę nowego ciała. Pozostawało jedynie odnaleźć to ciało niebieskie i tym samym dowieść jego istnienia."
 je_verrier_neptune_fail: "Kraj zajmujący drugie miejsce pod względem liczby obiektów astronomicznych otrzyma nagrodę pocieszenia. Wysiłki wszystkich pozostałych pójdą na marne."
 je_verrier_pluto: "Planeta X"
 je_verrier_pluto_reason: "W latach czterdziestych XIX wieku Urbain Le Verrier, po przeanalizowaniu perturbacji orbity Urana, wykorzystał mechanikę Newtona do przewidzenia położenia nieodkrytego jeszcze Neptuna. Późniejsze obserwacje Neptuna pod koniec XIX wieku skłoniły astronomów do przypuszczeń, że ruch Urana jest zaburzany przez jeszcze inną planetę. W 1906 roku Percival Lowell — zamożny mieszkaniec Bostonu, który w 1894 roku założył Obserwatorium Lowella we Flagstaff w Arizonie — rozpoczął zakrojone na szeroką skalę poszukiwania hipotetycznej nieznanej planety, nazwanej przez niego „Planetą X”. Do 1909 roku Lowell i William H. Pickering wskazali kilka możliwych położeń takiej planety na niebie. Lowell wraz ze swoim obserwatorium prowadził bezowocne poszukiwania aż do śmierci w 1916 roku. Nie wiedział, że na zdjęciach wykonanych 19 marca i 7 kwietnia 1915 roku zarejestrowano dwa słabo widoczne obrazy Planety X, których jednak nie rozpoznano. Wdowa po Percivalu, Constance Lowell, wdała się z Obserwatorium Lowella w dziesięcioletni spór sądowy o spadek po mężu, a poszukiwania Planety X wznowiono dopiero w 1929 roku. Dyrektor obserwatorium, Vesto Melvin Slipher, powierzył zadanie jej odnalezienia 23-letniemu Clyde’owi Tombaughowi, który właśnie przybył do placówki po tym, jak próbki jego rysunków astronomicznych zrobiły na Slipherze duże wrażenie. Zadaniem Tombaugha było systematyczne fotografowanie nocnego nieba, wykonywanie par zdjęć tych samych obszarów, a następnie porównywanie każdej pary w poszukiwaniu obiektów, które zmieniły położenie. Za pomocą komparatora błyskowego szybko przełączał widok między dwiema płytami fotograficznymi, wywołując wrażenie ruchu obiektów, których położenie lub wygląd zmieniły się między zdjęciami. 18 lutego 1930 roku, po niemal roku poszukiwań, Tombaugh dostrzegł na płytach fotograficznych obiekt, który zdawał się przemieszczać."
 je_verrier_pluto_fail: "Jeśli inny kraj spełni wymagania przed nami i odkryje Planetę X, wszystkie nasze wysiłki pójdą na marne."
 je_verrier_charter_moon: "Mapuj Księżyc"
 je_verrier_charter_moon_reason: "Selenografia zajmuje się badaniem powierzchni i cech fizycznych Księżyca (nazywana jest również geografią Księżyca lub selenodezją). Podobnie jak geografia i areografia jest jedną z dziedzin planetologii. Dawniej głównym zadaniem selenografów było sporządzanie map powierzchni Księżyca oraz nadawanie nazw morzom, kraterom, pasmom górskim i innym formom terenu. Systematyczne mapowanie Księżyca rozpoczęło się w 1779 roku, gdy Johann Schröter podjął drobiazgowe obserwacje i pomiary jego topografii. W 1834 roku Johann Heinrich von Mädler opublikował pierwszą wielkoformatową mapę Księżyca, obejmującą 4 arkusze, a następnie wydał „Selenografię powszechną”. Wszystkie pomiary Księżyca opierały się na bezpośrednich obserwacjach aż do marca 1840 roku, kiedy J.W. Draper za pomocą 5-calowego teleskopu zwierciadlanego wykonał dagerotyp Księżyca, wprowadzając tym samym fotografię do astronomii. Początkowo obrazy były bardzo słabej jakości, lecz podobnie jak w przypadku teleskopu 200 lat wcześniej ich jakość szybko się poprawiała. Do 1890 roku fotografia księżycowa stała się uznaną dziedziną astronomii."
 je_verrier_charter_moon_success: "Po zebraniu #G 10#! @verrier_moon_photo! #T zdjęć Księżyca#! powinniśmy być w stanie opracować mapę Księżyca."
 je_verrier_charter_moon_goal: ""
 je_verrier_astro_physics_success: "Musimy odkryć co najmniej #G 1000#! @verrier_astronomicalobject! obiektów astronomicznych."
 je_verrier_astro_physics_goal: ""
 verrier_hide_astronomical_decisions: "Ukryj Decyzje Astronomiczne"
 verrier_hide_astronomical_decisions_desc: "Ukryj wszystkie decyzje astronomiczne, aby zachować większą przejrzystość."
 verrier_show_astronomical_decisions: "Pokaż Decyzje Astronomiczne"
 verrier_show_astronomical_decisions_desc: "Pokaż wszystkie decyzje astronomiczne."
 verrier_found_observatory_decision: "Załóż Obserwatorium"
 verrier_found_observatory_decision_desc: "W XIX wieku astronomia poczyniła ogromne postępy, w dużej mierze dzięki mecenatowi państw narodowych. Poszukiwania ciał niebieskich podejmowano również dlatego, że nadawanie nazw nowym gwiazdom, planetom i planetoidom przynosiło prestiż krajom i władcom. Dzięki coraz nowocześniejszym metodom, takim jak udoskonalanie teleskopów czy wprowadzenie fotografii, liczba odkryć ogromnie wzrosła. Budowa obserwatorium pozwoli co roku automatycznie odkrywać nowe ciała niebieskie. Dokładną liczbę można sprawdzić w samym obserwatorium po ukończeniu jego budowy. Nowe technologie oraz [concept_verrier_astronomer] zwiększają liczbę odkryć."
 verrier_charter_moon_decision: "Mapuj Księżyc"
 verrier_charter_moon_decision_desc: "Atlasy Księżyca i towarzyszące im próby kartowania ziemskiego satelity mają wielowiekową tradycję. Wynalezienie teleskopu zrewolucjonizowało tę naukę, zwaną „selenografią”, lecz wynalezienie fotografii otworzyło przed nami zupełnie nowe możliwości dokładnego mapowania Księżyca."
 verrier_visit_observatory_decision: "Odwiedź Obserwatorium"
 verrier_visit_observatory_decision_desc: "Odwiedź główne obserwatorium naszego kraju, aby zapoznać się ze wszystkimi ważnymi krajowymi i międzynarodowymi informacjami z dziedziny astronomii."
 verrier_asteroid_congress_decision: "Kongres Astronomiczny w sprawie Planetoid"
 verrier_asteroid_congress_decision_desc: "Od odkrycia Ceres w 1801 roku astronomowie odnajdywali coraz więcej ciał niebieskich, przez co liczba planet w Układzie Słonecznym stale rosła. Odkrycie Neptuna nasunęło pytanie, czy nie należałoby utworzyć osobnej kategorii dla licznych mniejszych obiektów, znajdowanych zwłaszcza między Marsem a Jowiszem. Konieczność wymyślania nowych symboli astronomicznych oraz stosunkowo niewielkie rozmiary tych ciał skłoniły astronomów do uznania ich raczej za „małe gwiazdy” lub „małe planety”. Oczywiście taki podział oznaczałby, że część obiektów uznawanych dotąd za planety utraciłaby swój status i została zdegradowana do rangi zwykłych głazów."
 verrier_asteroid_congress_decision_tt: "Im więcej ciał niebieskich zostaje odkrytych, tym pilniejsza staje się potrzeba zmiany dotychczasowej definicji planet. Przy ponad #BLUE 1,500#! obiektach sytuacja prawdopodobnie stanie się tak niejasna, że zwołanie konferencji będzie nieuniknione."
 verrier_carte_congress_decision: "Carte du Ciel"
 verrier_carte_congress_decision_desc: "W 1887 roku dyrektor Obserwatorium Paryskiego, Amédée Mouchez, zainicjował zakrojony na ogromną skalę, bezprecedensowy międzynarodowy projekt mapowania gwiazd. Dostrzegł bowiem, że nowa technika fotografii na suchych płytach może zrewolucjonizować tworzenie map nieba. W wyniku Kongresu Astrograficznego, który odbył się w Paryżu w kwietniu 1887 roku z udziałem ponad 50 astronomów, do projektu zgodziło się przystąpić 20 obserwatoriów z całego świata. Możemy zorganizować podobny kongres, aby umożliwić międzynarodowej społeczności wymianę wiedzy astronomicznej."
 verrier_great_debate_decision: "Wielka Debata"
 verrier_great_debate_decision_desc: "Debata Shapleya–Curtisa, znana również jako Wielka Debata, skupiła w sobie dyskusje z początku XX wieku, które ostatecznie doprowadziły do nowego rozumienia natury galaktyk i rozmiarów Wszechświata. Dotyczyła wielkości Drogi Mlecznej oraz tego, czy galaktyki, nazywane wówczas mgławicami spiralnymi, są niewielkimi obiektami w jej obrębie, czy też leżą znacznie dalej i są od niej odrębne. Tego dnia obaj uczeni przedstawili niezależne referaty naukowe na temat skali Wszechświata, a wieczorem odbyła się publiczna dyskusja. Możemy zorganizować podobny kongres, aby omówić najgłębsze tajemnice wszechświata."
 notification_verrier_astronomical_observation_notification_name: "Roczny Raport Astronomiczny"
 notification_verrier_astronomical_observation_notification_desc: "Nasi [Concept('concept_verrier_astronomer','$concept_verrier_astronomers|q$')] odkryli i skatalogowali w tym roku [GetPlayer.MakeScope.Var('verrier_astronomical_objects_notification_var').GetValue|0+=] nowych [Concept('concept_verrier_astronomical_object','$concept_verrier_celestial_bodies|q$')]."
 verrier.10.t: "Odkryto Neptuna"
 verrier.10.d: "[SCOPE.sCharacter('verrier_astronomer_scope').GetFullName] odkrył Neptuna ku chwale naszego narodu!"
 verrier.10.f: "Neptuna odkryto tuż po północy, po niespełna godzinie poszukiwań, w odległości mniejszej niż 1 stopień od położenia przewidzianego przez Le Verriera — była to niezwykła zgodność. Po kolejnych dwóch nocach obserwacji, podczas których potwierdzono położenie i ruch planety, [SCOPE.sCharacter('verrier_astronomer_scope').GetFullName] odpisał Le Verrierowi ze zdumieniem: „Planeta, której położenie pan (obliczył), naprawdę istnieje!”."
 verrier.10.g: "Inne kraje zzielenieją z zazdrości!"
 verrier.5.t: "Uroczyste Otwarcie Obserwatorium"
 verrier.5.d: "Podczas dzisiejszej uroczystości otwarto obserwatorium, które stanowi serce badań astronomicznych w naszym kraju."
 verrier.5.f: ""
 verrier.5.g: "Odwiedź nowe Obserwatorium."
 verrier.6.t: "Likwidacja Obserwatorium"
 verrier.6.d: "Astronomowie z naszego kraju postanowili zamknąć jedno z obserwatoriów."
 verrier.6.f: "W wyniku ostatnich wydarzeń politycznych w granicach naszego kraju znalazło się kilka obserwatoriów. Aby wyeliminować konkurencję i zapewnić państwowe finansowanie głównemu obserwatorium w stolicy, badacze postanowili zakończyć działalność filii i zamknąć placówkę. Wszystkie wyniki badań zostają przeniesione do stolicy wraz z doświadczoną kadrą naukową."
 verrier.6.g: "Godne ubolewania, ale konieczne."
 verrier.6.h: "Eee... Nie mamy jeszcze Obserwatorium w stolicy. Przenieście je tam!"
 verrier.11.d: "Naukowcy z [SCOPE.sCountry('verrier_neptune_discoverer_country').GetName] poinformowali nas dziś, że jeden z ich kolegów odkrył nieznaną dotąd planetę Neptun."
 verrier.11.g: "Gratulacje..."
 verrier.20.t: "Odkryto Pluton"
 verrier.20.d: "[SCOPE.sCharacter('verrier_astronomer_scope').GetFullName] odkrył Plutona ku chwale naszego narodu!"
 verrier.20.f: "Po odkryciu Plutona jego niewielka jasność i brak dostrzegalnej tarczy wzbudziły wątpliwości, czy rzeczywiście jest on Planetą X. Dla niektórych uczonych to ciało niebieskie okazało się wręcz gorzkim rozczarowaniem. Przez cały XX wiek szacowaną masę Plutona korygowano w dół. Początkowo astronomowie obliczali ją na podstawie jego domniemanego wpływu na Neptuna i Urana. W 1931 roku oszacowano, że Pluton ma masę zbliżoną do Ziemi, lecz kolejne obliczenia z 1948 roku obniżyły ją do wartości zbliżonej do masy Marsa. Mimo to odkrycie trafiło na pierwsze strony gazet na całym świecie."
 verrier.20.g: "Może i jest mały, ale nadal jest planetą."
 verrier.21.d: "Naukowcy z [SCOPE.sCountry('verrier_pluto_discoverer_country').GetName] poinformowali nas dziś, że jeden z ich kolegów odkrył nieznaną dotąd planetę Pluton."
 verrier.21.g: "Czy to w ogóle prawdziwa planeta?"
 verrier.30.t: "Kongres Astronomiczny w sprawie Planetoid"
 verrier.30.d: "Na międzynarodowej konferencji ma rozstrzygnąć się los niektórych ciał niebieskich uznawanych dotąd za planety."
 verrier.30.f: "Szybko upowszechnił się pogląd, że mniejsze obiekty astronomiczne odkrywane od początku XIX wieku w większości nie odpowiadają temu, co rzeczywiście rozumiano pod pojęciem planet — zwłaszcza po odkryciu Neptuna, znacznie bardziej przypominającego planety znane od dawna. Dopiero po pewnych wahaniach do nowej kategorii planetoid zaliczono również Pallas, Westę i Juno, przez pół wieku nazywane planetami. Dotąd nie osiągnięto jednak porozumienia w sprawie małej planety Ceres, odkrytej przez Giuseppe Piazziego w 1801 roku. Grupa tradycjonalistów chce zachować jej status planety. Choć jest znacznie mniejsza od wszystkich pozostałych planet, jest zbyt duża jak na planetoidę. Niektórzy uczestnicy Kongresu domagają się zatem głosowania."
 verrier.30.f_astraea: "Szybko upowszechnił się pogląd, że mniejsze obiekty astronomiczne odkrywane od początku XIX wieku w większości nie odpowiadają temu, co rzeczywiście rozumiano pod pojęciem planet — zwłaszcza po odkryciu Neptuna, znacznie bardziej przypominającego planety znane od dawna. Dopiero po pewnych wahaniach do nowej kategorii planetoid zaliczono również Pallas, Westę, Juno i Astraeę, przez pół wieku nazywane planetami. Dotąd nie osiągnięto jednak porozumienia w sprawie małej planety Ceres, odkrytej przez Giuseppe Piazziego w 1801 roku. Grupa tradycjonalistów chce zachować jej status planety. Choć jest znacznie mniejsza od wszystkich pozostałych planet, jest zbyt duża jak na planetoidę. Niektórzy uczestnicy Kongresu domagają się zatem głosowania."
 verrier.30.g: "Lubię tę planetę. Rozstrzygnijmy los Ceres w głosowaniu."
 verrier.30.h: "Nie ma potrzeby zwoływania kolejnego spotkania."
 verrier.31.t: "Status Ceres"
 verrier.31.d: "Nasz kraj został zaproszony na kongres astronomiczny organizowany przez [SCOPE.sCountry('verrier_congress_host_country').GetName]. Najważniejsza kwestia dotyczy losu (byłej?) planety Ceres."
 verrier.31.f: "Szybko upowszechnił się pogląd, że mniejsze obiekty astronomiczne odkrywane od początku XIX wieku w większości nie odpowiadają temu, co rzeczywiście rozumiano pod pojęciem planet — zwłaszcza po odkryciu Neptuna, znacznie bardziej przypominającego planety znane od dawna. Dopiero po pewnych wahaniach do nowej kategorii planetoid zaliczono również Pallas, Westę i Juno, przez pół wieku nazywane planetami. Dotąd nie osiągnięto jednak porozumienia w sprawie małej planety Ceres, odkrytej przez Giuseppe Piazziego w 1801 roku. Grupa tradycjonalistów chce zachować jej status planety. Choć jest znacznie mniejsza od wszystkich pozostałych planet, jest zbyt duża jak na planetoidę. Druga strona argumentuje, że jeśli Ceres zachowa status planety, wiele większych obiektów również będzie można zaliczyć do planet, co utrudni badania astronomiczne."
 verrier.31.f_astraea: "Szybko upowszechnił się pogląd, że mniejsze obiekty astronomiczne odkrywane od początku XIX wieku w większości nie odpowiadają temu, co rzeczywiście rozumiano pod pojęciem planet — zwłaszcza po odkryciu Neptuna, znacznie bardziej przypominającego planety znane od dawna. Dopiero po pewnych wahaniach do nowej kategorii planetoid zaliczono również Pallas, Westę, Juno i Astraeę, przez pół wieku nazywane planetami. Dotąd nie osiągnięto jednak porozumienia w sprawie małej planety Ceres, odkrytej przez Giuseppe Piazziego w 1801 roku. Grupa tradycjonalistów chce zachować jej status planety. Choć jest znacznie mniejsza od wszystkich pozostałych planet, jest zbyt duża jak na planetoidę. Druga strona argumentuje, że jeśli Ceres zachowa status planety, wiele większych obiektów również będzie można zaliczyć do planet, co utrudni badania astronomiczne."
 verrier.31.g: "Ceres jest planetą."
 verrier.31.h: "Ceres nie jest planetą"
 verrier.32.t_demoted: "Ceres zdegradowana"
 verrier.32.t_saved: "Ceres uratowana"
 verrier.32.d_demoted: "Kongres Astronomiczny pozbawił Ceres statusu planety."
 verrier.32.d_saved: "Kongres Astronomiczny potwierdził status Ceres jako planety."
 verrier.32.f_demoted: "Wynik nie był zaskoczeniem: skoro pozostałe mniejsze ciała niebieskie są planetoidami, to logicznie rzecz biorąc, Ceres również musi nią być. Astronomowie zgodzili się, że Ceres jest prawdopodobnie największym ciałem niebieskim w tak zwanym pasie planetoid, i przyznali dawnej planecie zaszczytny numer 1 wśród planetoid — ale na tym poprzestali. Choć niektórzy wskazują, że status planety ma znaczenie zarówno kulturowe, jak i naukowe, takie argumenty wynikają raczej z irracjonalnej nostalgii niż z nauki.\n\n Ostateczny wynik wyniósł #G [GetGlobalVariable('verrier_ceres_yes').GetValue]#! głosów za wobec #R [GetGlobalVariable('verrier_ceres_no').GetValue]#! głosów przeciw."
 verrier.32.f_saved: "Wynik zaskoczył wielu: większość astronomów opowiedziała się za zachowaniem przez Ceres statusu planety! Jak przekonywali tradycjonaliści, kształt i masa odróżniają Ceres od pozostałych obiektów w pasie planetoid. Planeta wyraźnie się wyróżnia. W oświadczeniu uczeni dodali, że Ceres od dziesięcioleci jest uznawana za część Układu Słonecznego nie tylko w nauce, lecz także w świadomości społecznej i kulturze. Zdegradowanie planety, do której tak wielu ludzi się przywiązało, do rangi planetoidy i odebranie jej tym samym tożsamości graniczy z pychą.\n\n Ostateczny wynik wyniósł #G [GetGlobalVariable('verrier_ceres_yes').GetValue]#! głosów za wobec #R [GetGlobalVariable('verrier_ceres_no').GetValue]#! głosów przeciw."
 verrier.32.g: "Ceres była zaledwie karzełkiem wśród planet."
 verrier.32.h: "Ceres uratowana!"
 verrier.33.t: "Cztery planety zdegradowane"
 verrier.33.t_astraea: "Pięć planet zdegradowanych"
 verrier.33.d: "Kongres Astronomiczny sporządził deklarację końcową: cztery ciała niebieskie uznawane niegdyś za planety zostały teraz zaliczone do planetoid."
 verrier.33.f: "Kongres wprowadził nową kategorię ciał niebieskich — planetoidy — aby usprawnić dalsze badania astronomiczne. Od tej pory nie każdy kamień w kosmosie będzie uznawany za planetę. Oprócz niektórych nowo odkrytych obiektów do planetoid zaliczono również „planety” odkrywane od 1801 roku: Ceres, Pallas, Westę i Juno."
 verrier.33.f_astraea: "Kongres wprowadził nową kategorię ciał niebieskich — planetoidy — aby usprawnić dalsze badania astronomiczne. Od tej pory nie każdy kamień w kosmosie będzie uznawany za planetę. Oprócz niektórych nowo odkrytych obiektów do planetoid zaliczono również „planety” odkrywane od 1801 roku: Ceres, Pallas, Westę, Juno i Astraeę."
 verrier.33.g: "Układ Słoneczny ma 8 planet."
 verrier.34.t: "Trzy planety zdegradowane"
 verrier.34.t_astraea: "Cztery planety zdegradowane"
 verrier.34.d: "Kongres Astronomiczny sporządził deklarację końcową: trzy ciała niebieskie uznawane niegdyś za planety zostały teraz zaliczone do planetoid."
 verrier.34.f: "Kongres wprowadził nową kategorię ciał niebieskich — planetoidy — aby usprawnić dalsze badania astronomiczne. Od tej pory nie każdy kamień w kosmosie będzie uznawany za planetę. Oprócz niektórych nowo odkrytych obiektów do planetoid zaliczono również „planety” odkrywane od 1801 roku: Pallas, Westę i Juno. Ceres pozostaje planetą."
 verrier.34.f_astraea: "Kongres wprowadził nową kategorię ciał niebieskich — planetoidy — aby usprawnić dalsze badania astronomiczne. Od tej pory nie każdy kamień w kosmosie będzie uznawany za planetę. Oprócz niektórych nowo odkrytych obiektów do planetoid zaliczono również „planety” odkrywane od 1801 roku: Pallas, Westę, Juno i Astraeę. Ceres pozostaje planetą."
 verrier.34.g: "Układ Słoneczny ma 9 planet."
 verrier.35.t: "Sporny status planety"
 verrier.35.d: "Niedawne oświadczenie kongresu astronomicznego ma wpływ na prestiż naszego kraju."
 verrier.35.f: "Liczne sprzeciwy na nic się zdały. Pozbawienie jednej lub kilku odkrytych przez nas planet statusu planety negatywnie wpływa na naszą pozycję w świecie. Dziś niemal każdy może odkryć planetoidę i nie przynosi to żadnego międzynarodowego uznania. Dawniej szczyciliśmy się tym, że jeden z naszych naukowców odkrył takie ciało niebieskie, lecz w świetle ostatniej decyzji podobne powody do dumy straciły znaczenie."
 verrier.35.g: "To głosowanie było ewidentnie ustawione!"
 verrier.40.t: "Dostrzeżono kometę!"
 verrier.40.d: "Naukowcy z naszego obserwatorium odkryli nową kometę."
 verrier.40.f: "Na niebie dostrzeżono Kometę. Niektórzy wierzą, że zwiastuje ona nadejście złowrogich czasów. Inni uważają, że to w istocie wróżki unoszące się na niebie. Są też tacy, którzy sądzą, że kometa jest najprawdopodobniej olbrzymią bryłą lodu przemierzającą niebo, a jej długi warkocz powstaje pod wpływem energii słonecznej. Spory między zwolennikami tych trzech równie wiarygodnych teorii pobudzają w naszym kraju dążenie do wiedzy."
 verrier.40.g: "Dzięki Bogu żyjemy w tak oświeconych czasach."
 verrier.41.t: "Nowa Asteroida"
 verrier.41.d: "Astronomowie odkryli nowe ciało niebieskie w pasie planetoid i nanieśli je na nasze mapy nieba."
 verrier.41.f: "W XIX wieku mapowanie ciał niebieskich, zwłaszcza planetoid, nabrało ogromnego tempa. O ile do około 1850 roku naukowcy odkryli zaledwie tuzin planetoid, o tyle na przełomie wieków znano ich już około 300. Odkrycia te przyczyniły się między innymi do ponownego przemyślenia dotychczasowych kategorii i utworzenia nowych."
 verrier.41.g: "Ile jeszcze?"
 verrier.42.t: "Deszcz Meteorytów"
 verrier.42.d: "Sezonowy rój meteorów pozwala naszym astronomom zaobserwować w tym roku szczególnie dużą liczbę obiektów astronomicznych."
 verrier.42.f: "Rój meteorów to zjawisko astronomiczne, podczas którego liczne meteory zdają się wybiegać z jednego punktu na nocnym niebie. Powstają, gdy strumienie kosmicznych drobin zwanych meteoroidami wpadają w ziemską atmosferę z ogromną prędkością, poruszając się po równoległych torach. Większość tych drobin jest mniejsza od ziarnka piasku, dlatego niemal wszystkie rozpadają się i nigdy nie docierają do powierzchni Ziemi. Wyjątkowo intensywne lub nietypowe przejawy aktywności rojów określa się jako wybuchy aktywności i deszcze meteorów. Te ostatnie przynoszą co najmniej 1,000 meteorów na godzinę, a ich najbardziej znanym przykładem są Leonidy."
 verrier.42.g: "Oby niebo było bezchmurne, a widoczność dobra!"
 verrier.43.t: "Mgławica"
 verrier.43.d: "Nasze obserwatorium odkryło piękną, nieznaną dotąd mgławicę z licznymi nieznanymi gwiazdami."
 verrier.43.f: "Pierwsza wzmianka o prawdziwej mgławicy, odróżnianej od gromady gwiazd, pochodzi od perskiego astronoma muzułmańskiego Abd ar-Rahmana as-Sufiego. Odnotował on „małą chmurkę” w miejscu, w którym znajduje się Galaktyka Andromedy. W latach 1751–1753 Nicolas-Louis de Lacaille skatalogował podczas obserwacji z Przylądka Dobrej Nadziei 42 mgławice, z których większość była wcześniej nieznana. Liczba znanych mgławic znacznie wzrosła następnie dzięki pracy Williama Herschela i jego siostry Caroline Herschel, którzy skatalogowali ich około 2,000. Począwszy od 1864 roku, William Huggins zbadał widma około 70 mgławic. Około 1923 roku, po Wielkiej Debacie, stało się jasne, że wiele „mgławic” to w rzeczywistości galaktyki położone daleko poza Drogą Mleczną."
 verrier.43.g: "Wspaniale!"
 verrier.44.t: "Nadanie nazwy gwieździe"
 verrier.44.d: "[SCOPE.sCharacter('verrier_star_discoverer').GetFullName] odkrył nową gwiazdę dość przypadkowo. Obecnie wciąż trwa debata nad tym, na czyją lub czego cześć należy ją nazwać."
 verrier.44.f: "Choć astronomowie początkowo przestrzegali niepisanej zasady nadawania ciałom niebieskim nazw zaczerpniętych z mitologii, z czasem pojawiła się moda na upamiętnianie władców lub nawiązywanie do ojczystego kraju, podobnie jak przy nazywaniu nieznanych dotąd zakątków świata. Na przykład planeta Uran miała początkowo nosić nazwę „Jerzy” na cześć ówczesnego króla Wielkiej Brytanii. Piazzi zaś, odkrywając Ceres, dodał do jej nazwy przydomek „Ferdinandea” na cześć swojego mecenasa i władcy."
 verrier.44.g: "Gwiazda powinna otrzymać nazwę na cześć naszego kraju."
 verrier.44.h: "Gwiazda otrzyma nazwę na cześć naszego władcy."
 verrier.44.i: "Gwiazda otrzyma nazwę na cześć swojego odkrywcy."
 verrier.45.t: "Na scenę wkracza nowy [concept_verrier_astronomer]"
 verrier.45.d: "[SCOPE.sCharacter('verrier_new_astronomer_scope').GetFullName] już wcześniej wielokrotnie wykazywał wielkie zainteresowanie astronomią i obserwuje gwiaździste niebo, poświęcając na to [SCOPE.sCharacter('verrier_new_astronomer_scope').GetHerHis] wolny czas."
 verrier.45.f: "Do dziś wielu astronomów amatorów położyło wybitne zasługi dla rozwoju astronomii jako nauki. Ogromna liczba obiektów sprawiała, że pasjonaci bez formalnego wykształcenia niejednokrotnie wspomagali uczonych swoimi obserwacjami i zapiskami. Nic dziwnego, skoro niektórzy słynni astronomowie sami zaczynali od pełnego pasji podziwiania gwiazd."
 verrier.45.g: "[SCOPE.sCharacter('verrier_new_astronomer_scope').GetFullName] powinien podjąć pracę jako zawodowy [concept_verrier_astronomer]."
 verrier.45.h: "Badania są interesujące, nic więcej, nic mniej."
 verrier.46.t: "Błędne mapy nieba"
 verrier.46.d: "Niestety po przejrzeniu starszych map nieba odkryliśmy, że niektóre z naniesionych na nie gwiazd w ogóle nie istnieją."
 verrier.46.f: "Niestety błędy w zapisach astronomicznych nie należą do rzadkości. Zdarzały się nie tylko we wczesnej epoce nowożytnej, lecz nawet w XIX wieku, mimo udoskonalenia i dopracowania metod badawczych. Na przykład w 1861 roku Hermann Goldschmidt twierdził, że odkrył kolejny księżyc Saturna, który nazwał „Chironem”, lecz jego istnienia nigdy nie udało się potwierdzić."
 verrier.46.g: "Chcesz powiedzieć, że to był tylko brud na teleskopie?"
 verrier.47.t: "Odkryto nieznane dotąd księżyce Saturna"
 verrier.47.d: "Po udoskonaleniu teleskopu w jednym z naszych głównych obserwatoriów nasi astronomowie zdołali odkryć dwa nowe księżyce Saturna."
 verrier.47.f: "Księżyce Saturna są liczne i zróżnicowane: od maleńkich satelitów o średnicy zaledwie kilkudziesięciu metrów po ogromnego Tytana, większego od planety Merkury. Saturn ma 83 księżyce o potwierdzonych orbitach, znajdujące się poza jego pierścieniami, a także gęste pierścienie zawierające miliony drobnych księżyców i niezliczone mniejsze cząstki. Siedem księżyców Saturna jest na tyle dużych, że pod wpływem własnej grawitacji przybrało kształt elipsoidalny, choć tylko jeden lub dwa z nich — Tytan i być może Rea — znajdują się obecnie w równowadze hydrostatycznej. Wśród księżyców Saturna szczególnie wyróżnia się Tytan, drugi co do wielkości księżyc w Układzie Słonecznym po Ganimedesie, krążącym wokół Jowisza."
 verrier.47.g: "Doskonale."
 verrier.48.t: "Niezwykła Nowa!"
 verrier.48.d: "Nasz [concept_verrier_astronomer], Dr. [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName], odkrył nową Nową, znacznie jaśniejszą od otaczających ją gwiazd. Takie obserwacje są niezwykle rzadkie i zazwyczaj udają się jedynie najlepszym astronomom."
 verrier.48.f: "Jako pierwsi zauważyliśmy pojawienie się Nowej. Wkrótce jednak wiele innych obserwatoriów również skierowało ku niej swoje teleskopy. Nowa była znacznie jaśniejsza od otaczających ją gwiazd, a zjawisko utrzymywało się przez niemal dwa tygodnie. Choć z czasem jej blask słabł, pozostawała wyraźnie widoczna przez dłuższy czas. Nie wiemy jeszcze, co było przyczyną tego zjawiska, ale obserwacje z pewnością pomogą nam lepiej je zrozumieć!"
 verrier.48.g: "Niesamowite!"
 verrier.50.t: "Mapa Księżyca"
 verrier.50.d: "Po wielu latach intensywnych obserwacji i prac kartograficznych, przy wykorzystaniu najnowocześniejszych technik fotograficznych, nasi astronomowie zdołali stworzyć dokładną mapę Księżyca."
 verrier.50.f: "Systematyczne mapowanie Księżyca rozpoczęło się w 1779 roku, gdy Johann Schröter podjął drobiazgowe obserwacje i pomiary jego topografii. W 1834 roku Johann Heinrich von Mädler opublikował pierwszą wielkoformatową mapę Księżyca, obejmującą 4 arkusze, a następnie wydał „Selenografię powszechną”. Wszystkie pomiary Księżyca opierały się na bezpośrednich obserwacjach aż do marca 1840 roku, kiedy J.W. Draper za pomocą 5-calowego teleskopu zwierciadlanego wykonał dagerotyp Księżyca, wprowadzając tym samym fotografię do astronomii. Początkowo obrazy były bardzo słabej jakości, lecz podobnie jak w przypadku teleskopu 200 lat wcześniej ich jakość szybko się poprawiała. Do 1890 roku fotografia księżycowa stała się uznaną dziedziną astronomii."
 verrier.50.g: "Znakomicie."
 verrier.51.t: "Kanał księżycowy"
 verrier.51.d: "Projekt mapowania Księżyca za pomocą fotografii posunął się naprzód."
 verrier.51.f: "Termin „bruzda” jest zwykle używany do opisywania długich, wąskich zagłębień na powierzchni Księżyca, przypominających kanały. Łacińska nazwa to rima, w liczbie mnogiej rimae. Bruzda może mieć kilka kilometrów szerokości i setki kilometrów długości. Terminu tego używa się również w szerszym znaczeniu do opisywania podobnych struktur na niektórych planetach Układu Słonecznego, w tym na Marsie i Wenus, a także na licznych księżycach. Wszystkie te formy wykazują podobieństwo budowy."
 verrier.51.g: "Fascynujące."
 verrier.52.t: "Krater księżycowy"
 verrier.52.f: "Kratery na bardzo starych powierzchniach — takich jak powierzchnia Księżyca — stanowią zapis okresu intensywnego bombardowania wewnętrznej części Układu Słonecznego około 3.9 miliarda lat temu. Ponieważ procesy erozji na Księżycu są znikome, kratery zachowują się przez długi czas. W 1893 roku Grove Karl Gilbert jako pierwszy wysunął przypuszczenie, że kratery księżycowe powstały wskutek uderzeń dużych planetoid."
 verrier.53.t: "Morza księżycowe"
 verrier.53.f: "Morza księżycowe to rozległe, ciemne równiny bazaltowe na Księżycu, powstałe wskutek dawnych uderzeń planetoid w jego niewidoczną stronę, które wywołały aktywność wulkaniczną po stronie przeciwnej, widocznej z Ziemi. Dawni astronomowie nazwali je maria, co po łacinie oznacza „morza”, ponieważ mylnie uznawali je za prawdziwe zbiorniki wodne. Ze względu na dużą zawartość żelaza odbijają mniej światła niż tereny wyżynne, dlatego oglądane gołym okiem wydają się ciemne. Morza zajmują około 16% powierzchni Księżyca, głównie po stronie widocznej z Ziemi. Nieliczne morza po niewidocznej stronie są znacznie mniejsze i znajdują się przeważnie w bardzo dużych kraterach. Tradycyjne nazewnictwo księżycowe obejmuje również jeden oceanus („ocean”), a także formy terenu określane jako lacus („jezioro”), palus („bagno”) i sinus („zatoka”). Te trzy ostatnie są mniejsze od mórz, lecz mają taki sam charakter i właściwości."
 verrier.54.t: "Wyżyny księżycowe"
 verrier.54.f: "Jaśniejsze obszary Księżyca nazywane są terrae, czyli lądami, lub częściej wyżynami, ponieważ leżą wyżej niż większość mórz księżycowych. Ustalono, że powstały 4.4 miliarda lat temu i mogą stanowić nagromadzenia kryształów plagioklazów z księżycowego oceanu magmy. Skupienie mórz po stronie widocznej z Ziemi prawdopodobnie wynika ze znacznie większej grubości skorupy wyżyn po stronie niewidocznej. Ta grubsza skorupa mogła powstać wskutek zderzenia z drugim księżycem Ziemi przy niewielkiej prędkości, kilkadziesiąt milionów lat po uformowaniu się Księżyca."
 verrier.61.t: "Kometa [SCOPE.sCharacter('verrier_1843_discoverer').GetLastName]"
 verrier.61.d: "[SCOPE.sCharacter('verrier_1843_discoverer').GetFullName] odkrył @verrier_comet! Wielką Kometę!"
 verrier.61.f: "Wielka Kometa z 1843 roku była kometą długookresową, która w marcu 1843 roku osiągnęła bardzo dużą jasność (znana jest również jako Wielka Kometa Marcowa). Odkryto ją 5 lutego 1843 roku, a jej blask szybko wzrósł na tyle, że zyskała miano wielkiej komety. Należała do rodziny komet muskających Słońce z grupy Kreutza, powstałych wskutek rozpadu komety macierzystej na liczne fragmenty około 1106 roku. Komety te przelatują niezwykle blisko powierzchni Słońca — w odległości zaledwie kilku promieni słonecznych — i często osiągają przez to bardzo dużą jasność. Najbliżej Ziemi znalazła się 6 marca 1843 roku, a największy blask osiągnęła następnego dnia. Niestety dla obserwatorów na północ od równika w okresie największej jasności była najlepiej widoczna z półkuli południowej. Po raz ostatni zaobserwowano ją 19 kwietnia 1843 roku. W tamtym czasie kometa ta zbliżyła się do Słońca bardziej niż jakikolwiek inny znany obiekt."
 verrier.61.g: "Chwała [ROOT.GetCountry.GetNameNoFlag]!"
 verrier.62.t_name: "Kometa [SCOPE.sCharacter('verrier_1843_discoverer').GetLastName]"
 verrier.62.t_year: "Wielka Kometa roku 1843"
 verrier.62.d: "Od wielu dni niebo rozświetla wspaniała Wielka Kometa."
 verrier.62.g: "Nie przestawajcie patrzeć w niebo!"
 verrier.64.t: "Kometa [SCOPE.sCharacter('verrier_1858_discoverer').GetLastName]"
 verrier.64.d: "[SCOPE.sCharacter('verrier_1858_discoverer').GetFullName] odkrył @verrier_comet! Wielką Kometę!"
 verrier.64.f: "Wielka Kometa z 1858 roku była najjaśniejszą kometą XIX wieku po Wielkiej Komecie z 1811 roku. Była również pierwszą kometą, którą sfotografowano. Najbliżej Ziemi znalazła się 10 października 1858 roku i przez większą część tego miesiąca stanowiła jasny obiekt z długim, zakrzywionym niczym szabla warkoczem pyłowym oraz wyraźnym warkoczem gazowym. Dla obserwatorów na półkuli południowej pozostawała widoczna gołym okiem aż do listopada. Uznaje się ją za jedną z najpiękniejszych zaobserwowanych komet. Należała też do najjaśniejszych w tym stuleciu, wywierając ogromne wrażenie zarówno na artystach, jak i na ogóle społeczeństwa. Po wcześniejszej fali histerii związanej z kometami, zwłaszcza w Paryżu (wywołanej częściowo błędnymi obliczeniami Johna Russella Hinda, które sugerowały, że jedna z nich uderzy w Ziemię w czerwcu 1857 roku), stała się najczęściej obserwowaną kometą stulecia. Sprzyjały temu jej doskonała widoczność na ciemnym niebie półkuli północnej, szczególnie w Europie, oraz dobra pogoda we wrześniu i październiku. Angielski astronom William Henry Smyth wspominał ją jako „jeden z najpiękniejszych obiektów, jakie kiedykolwiek widziałem”. Została uwieczniona na licznych szkicach i co najmniej jednym obrazie Williama Turnera z Oksfordu."
 verrier.65.t_name: "Kometa [SCOPE.sCharacter('verrier_1858_discoverer').GetLastName]"
 verrier.65.t_year: "Wielka Kometa roku 1858"
 verrier.67.t: "Kometa [SCOPE.sCharacter('verrier_1861_discoverer').GetLastName]"
 verrier.67.d: "[SCOPE.sCharacter('verrier_1861_discoverer').GetFullName] odkrył @verrier_comet! Wielką Kometę!"
 verrier.67.f: "„Wieczorem 13 maja 1861 roku, podczas poszukiwania komet w zachodniej części nieba, dostrzegłem słaby, mglisty obiekt w pobliżu gwiazdy Lacaille 1316 w gwiazdozbiorze Erydanu. W mojej lunecie morskiej obiekt wydawał się bardzo rozmyty i z najwyższym trudem oszacowałem jego odległość kątową od trzech dobrze znanych gwiazd stałych. W małej lunecie przymocowanej do sekstantu był ledwie dostrzegalny. Musiałem umieścić barwne szkło między zwierciadłem indeksowym a horyzontalnym, ponieważ znacznie jaśniejsze gwiazdy odniesienia — Procjon, Syriusz i Kanopus — po wprowadzeniu do pola widzenia całkowicie przyćmiewały jego nikły blask. Każdy łowca komet wie, jak niezbędny w jego pracy jest obszerny katalog mgławic, lecz ja niestety nie posiadałem tej cennej pomocy. Nie znalazłem jednak tego obiektu w skromnych katalogach, którymi dysponowałem. Postanowiłem zatem dalej go obserwować i dobrze się stało, gdyż w przeciwnym razie straciłbym jedną z najlepszych sposobności, by dać się poznać światu astronomicznemu”."
 verrier.68.t_name: "Kometa [SCOPE.sCharacter('verrier_1861_discoverer').GetLastName]"
 verrier.68.t_year: "Wielka Kometa roku 1861"
 verrier.70.t: "Kometa [SCOPE.sCharacter('verrier_1874_discoverer').GetLastName]"
 verrier.70.d: "[SCOPE.sCharacter('verrier_1874_discoverer').GetFullName] odkrył @verrier_comet! Wielką Kometę!"
 verrier.70.f: "Wielka Kometa z 1874 roku jest kometą nieokresową, którą latem 1874 roku można było dostrzec gołym okiem. Bez wątpienia była piękna — prawdziwa wielka kometa. W okresie największego blasku prawdopodobnie była jaśniejsza niż pierwsza wielkość gwiazdowa, a w jej komie widoczne były liczne otoczki, które astronomowie porównywali z tymi u Wielkiej Komety sprzed 16 lat. Gdy w lipcu kometa przelatywała w pobliżu Ziemi, obserwatorzy znajdujący się w dogodnych miejscach odnotowywali również widoczny gołym okiem warkocz o długości kątowej dochodzącej do 70 stopni. Strach, jaki kometa wzbudziła wśród ludności, stał się przedmiotem satyry Marka Twaina w opowiadaniu „A Curious Pleasure Excursion”."
 verrier.71.t_name: "Kometa [SCOPE.sCharacter('verrier_1874_discoverer').GetLastName]"
 verrier.71.t_year: "Wielka Kometa roku 1874"
 verrier.73.t: "Kometa [SCOPE.sCharacter('verrier_1882_discoverer').GetLastName]"
 verrier.73.d: "[SCOPE.sCharacter('verrier_1882_discoverer').GetFullName] odkrył @verrier_comet! Wielką Kometę!"
 verrier.73.f: "Wielka Kometa z 1882 roku osiągnęła bardzo dużą jasność we wrześniu 1882 roku. Należała do rodziny komet muskających Słońce z grupy Kreutza. W peryhelium była na tyle jasna, że można ją było dostrzec obok Słońca na dziennym niebie. Pojawiła się na porannym niebie we wrześniu 1882 roku. Według doniesień po raz pierwszy zaobserwowano ją już 1 września 1882 roku, zarówno z Przylądka Dobrej Nadziei, jak i z Zatoki Gwinejskiej. W ciągu kolejnych kilku dni wielu obserwatorów na półkuli południowej zgłaszało dostrzeżenie nowej komety. Astronom Jej Królewskiej Mości na Przylądku, David Gill, donosił, że 18 września obserwował wschód komety kilka minut przed wschodem Słońca, i opisał ją następująco: „Jądro było wówczas niewątpliwie pojedyncze, a jego średnica z pewnością wynosiła raczej mniej niż więcej niż 4 sekundy łuku. W istocie, jak już opisałem, bardzo przypominało gwiazdę 1. wielkości widzianą za dnia”. Fragmenty Wielkiej Komety z 1882 roku powrócą za kilkaset lat, zapewne w odstępach rozciągniętych na dwa lub trzy stulecia."
 verrier.74.t_name: "Kometa [SCOPE.sCharacter('verrier_1882_discoverer').GetLastName]"
 verrier.74.t_year: "Wielka Kometa roku 1882"
 verrier.80.t: "Kongres Carte du Ciel"
 verrier.80.d: "Przygotowania do Kongresu Astronomicznego zostały zakończone. Czas zaprosić inne kraje."
 verrier.80.f: "Podczas trzech kongresów (1887, 1889 i 1891) opracowano jednolite metody obserwacji i obliczeń, oparte na najlepszych ówczesnych technikach. W tym zgromadzeniu Carte du Ciel uczestniczyli astronomowie z aż 38 krajów. Ostatecznie pasy deklinacji rozdzielono między 18 obserwatoriów zgodnie z ich szerokością geograficzną. Planowany czas naświetlania wynoszący 40 minut trzeba było jednak częściowo dostosować do warunków klimatycznych, a metody opracowywania wyników — do dostępnych komparatorów. Od około 1895 roku kilka instytutów chciało również wykorzystać doświadczenia zdobyte podczas projektu do udoskonalenia i przyspieszenia metod pracy oraz wprowadzenia nowszej aparatury laboratoryjnej. Do tego dochodziła chęć przeznaczenia części zasobów na rozwój rodzącej się astrofizyki."
 verrier.80.g: "Zaproś kraje przodujące w astronomii."
 verrier.81.t: "Zaproszenie do Carte du Ciel"
 verrier.81.d: "Nasi astronomowie zostali zaproszeni na kongres poświęcony dokładniejszemu badaniu i mapowaniu gwiaździstego nieba."
 verrier.81.f: "Podczas trzech kongresów (1887, 1889 i 1891) opracowano jednolite metody obserwacji i obliczeń, oparte na najlepszych ówczesnych technikach. W tym zgromadzeniu Carte du Ciel uczestniczyli astronomowie z aż 38 krajów. Ostatecznie pasy deklinacji rozdzielono między 18 obserwatoriów zgodnie z ich szerokością geograficzną. Planowany czas naświetlania wynoszący 40 minut trzeba było jednak częściowo dostosować do warunków klimatycznych, a metody opracowywania wyników — do dostępnych komparatorów. Od około 1895 roku kilka instytutów chciało również wykorzystać doświadczenia zdobyte podczas projektu do udoskonalenia i przyspieszenia metod pracy oraz wprowadzenia nowszej aparatury laboratoryjnej. Do tego dochodziła chęć przeznaczenia części zasobów na rozwój rodzącej się astrofizyki."
 verrier.81.g: "Przybędziemy."
 verrier.82.t_laughed: "Pośmiewisko Kongresu Astronomicznego"
 verrier.82.t_respected: "Uznanie na Kongresie Astronomicznym"
 verrier.82.t_lauded: "Pochwały na Kongresie Astronomicznym"
 verrier.82.d_laughed: "Nasza delegacja została wyśmiana na Kongresie Astronomicznym z powodu braku wiedzy astronomicznej!"
 verrier.82.d_respected: "Nasza delegacja została przyjęta z szacunkiem na Kongresie Astronomicznym."
 verrier.82.d_lauded: "Zaawansowana wiedza naszego kraju w dziedzinie astronomii przyciągnęła uwagę innych naukowców."
 verrier.82.f_laughed: "„Jak to teoria eteru jest przestarzała?”"
 verrier.82.f_respected: "„Mam nadzieję, że w bufecie zostało jeszcze kilka przekąsek w kształcie Saturna”."
 verrier.82.f_lauded: "„Dobry wieczór, panie Wielki Obłoku Magellana — wreszcie wiem, skąd ta nazwa”."
 verrier.82.g: "Straszne..."
 verrier.82.h: "Dobrze."
 verrier.82.i: "Fantastyczny!"
 verrier.83.t: "Wymiana Map Nieba"
 verrier.83.d: "Nasi astronomowie chcieliby wymienić się mapami nieba z zagranicznymi kolegami."
 verrier.83.f: "Astronomia należała do dziedzin nauki, w których współpraca międzynarodowa rozpoczęła się bardzo wcześnie. Dopiero pierwsza wojna światowa położyła jej tymczasowy kres. Wyzwanie, jakim było zbadanie całego nieba i rozwikłanie tajemnic wszechświata, sprawiło, że naukowcy ze wszystkich krajów poświęcili się wspólnemu celowi. Jedynie polityka mogła stanąć im na drodze."
 verrier.83.g: "Chcemy udostępnić nasze mapy."
 verrier.83.h: "Nie jesteśmy zainteresowani."
 verrier.84.t: "Wymiana map"
 verrier.84.d: "Astronomowie wymienili się częścią map nieba z zagranicznymi naukowcami bez konsultacji z nami."
 verrier.84.f: "Astronomia należała do dziedzin nauki, w których współpraca międzynarodowa rozpoczęła się bardzo wcześnie. Dopiero pierwsza wojna światowa położyła jej tymczasowy kres. Wyzwanie, jakim było zbadanie całego nieba i rozwikłanie tajemnic wszechświata, sprawiło, że naukowcy ze wszystkich krajów poświęcili się wspólnemu celowi. Jedynie polityka mogła stanąć im na drodze — choć nie musiała."
 verrier.84.g: "Powinni byli najpierw mnie zapytać!"
 verrier.85.t: "Kongres Astronomiczny dobiega końca"
 verrier.85.d: "Kongres dobiegł końca, a my uzyskaliśmy ostatnio ważne informacje o gwiaździstym niebie."
 verrier.85.f: "Projekt stworzenia mapy nieba przy współpracy międzynarodowej sieci obserwatoriów okazał się w kolejnych dziesięcioleciach gigantycznym zadaniem, któremu niełatwo było sprostać. Carte du Ciel miała pozostać niedokończona. Mimo to międzynarodowe spotkania umożliwiły wymianę wiedzy i położyły podwaliny pod przyszłą współpracę międzynarodową oraz konferencje poświęcone badaniom astronomicznym."
 verrier.85.g: "To było całkiem pouczające."
 verrier.86.t: "Wielka Debata"
 verrier.86.d: "Przygotowania do Kongresu Astronomicznego zostały zakończone. Czas zaprosić inne kraje."
 verrier.86.f: "Wielka Debata, zwana również debatą Shapleya–Curtisa, odbyła się między astronomami Harlowem Shapleyem i Heberem Curtisem. Dotyczyła natury tak zwanych mgławic spiralnych oraz rozmiarów wszechświata. Shapley uważał, że mgławice te są stosunkowo niewielkie i znajdują się na obrzeżach Drogi Mlecznej (uznawanej wówczas za cały wszechświat), natomiast Curtis twierdził, że są w istocie odrębnymi galaktykami, a zatem muszą być niezwykle duże i odległe. Znaczna część wiedzy o Wielkiej Debacie pochodzi z dwóch artykułów opublikowanych przez Shapleya i Curtisa w majowym numerze „Biuletynu Narodowej Rady Badawczej” z 1921 roku. Po publicznej debacie naukowcy zdołali zweryfikować poszczególne dowody przedstawione przez obu astronomów."
 verrier.86.g: "Zaproś kraje przodujące w astronomii."
 verrier.87.t: "Wielka Debata"
 verrier.87.d: "Nasi astronomowie zostali zaproszeni na kongres mający na celu wyjaśnienie kwestii rozmiarów i natury wszechświata."
 verrier.87.f: "Wielka Debata, zwana również debatą Shapleya–Curtisa, odbyła się między astronomami Harlowem Shapleyem i Heberem Curtisem. Dotyczyła natury tak zwanych mgławic spiralnych oraz rozmiarów wszechświata. Shapley uważał, że mgławice te są stosunkowo niewielkie i znajdują się na obrzeżach Drogi Mlecznej (uznawanej wówczas za cały wszechświat), natomiast Curtis twierdził, że są w istocie odrębnymi galaktykami, a zatem muszą być niezwykle duże i odległe. Znaczna część wiedzy o Wielkiej Debacie pochodzi z dwóch artykułów opublikowanych przez Shapleya i Curtisa w majowym numerze „Biuletynu Narodowej Rady Badawczej” z 1921 roku. Po publicznej debacie naukowcy zdołali zweryfikować poszczególne dowody przedstawione przez obu astronomów."
 verrier.87.g: "Zakładam, że odpowiedź to 42?"
 verrier.88.t: "Jeden Wszechświat czy różne Galaktyki?"
 verrier.88.d: "Debata na Kongresie Astronomicznym dotyczy tego, czy Droga Mleczna stanowi cały wszechświat."
 verrier.88.f: "Shapley opowiadał się za poglądem, że Droga Mleczna stanowi cały wszechświat. Uważał, że „mgławice spiralne”, takie jak Andromeda, są po prostu jej częścią. Uzasadniał to porównaniem rozmiarów — gdyby Andromeda nie należała do Drogi Mlecznej, musiałaby znajdować się w odległości rzędu 100,000,000 lat świetlnych, czego większość ówczesnych astronomów nie była skłonna zaakceptować. Curtis natomiast twierdził, że Andromeda i inne podobne „mgławice” są odrębnymi galaktykami, czyli „wyspowymi wszechświatami” (termin ten ukuł XVIII-wieczny filozof Immanuel Kant, który również uważał, że „mgławice spiralne” znajdują się poza naszą Galaktyką). Wykazał, że w Andromedzie występuje więcej gwiazd nowych niż w Drodze Mlecznej. Na tej podstawie stawiał pytanie: dlaczego w jednym niewielkim obszarze Galaktyki miałoby pojawiać się więcej nowych niż w pozostałych jej częściach, gdyby Andromeda była jedynie mgławicą w obrębie naszej Galaktyki, a nie odrębną galaktyką? Przemawiało to za uznaniem Andromedy za osobną galaktykę, o własnym wieku i charakterystycznej częstości pojawiania się nowych."
 verrier.88.g: "Wszechświat składa się z różnych galaktyk."
 verrier.88.h: "Istnieje tylko jedna Droga Mleczna, reszta to obłoki gazu."
 verrier.89.t: "Słońce we Wszechświecie"
 verrier.89.d: "Kolejną kwestią poruszaną w debacie jest to, czy Słońce znajduje się w centrum Drogi Mlecznej, czy w jej zewnętrznym obszarze."
 verrier.89.f: "„Dzięki wyjątkowemu rozwojowi i intensywnej działalności wielkich obserwatoriów, dysponujących potężnymi metodami analizy gwiazd i sondowania przestrzeni kosmicznej, dotarliśmy, jak sądzę, do epoki, w której konieczny jest kolejny krok naprzód. Nasze wyobrażenie układu galaktycznego musi zostać poszerzone, aby właściwie ujmować wzajemne położenie obiektów odkrywanych przez nasze teleskopy. Układ Słoneczny nie może już zajmować centralnego miejsca”.\n\n „Podobna ogólna zgodność panowała również w kwestii wniosków dotyczących kształtu i struktury Galaktyki:\n 1. Liczba gwiazd nie jest nieskończona, a ich rozmieszczenie nie jest równomierne.\n 2. Nasza Galaktyka, której zarys wyznaczają dla nas widoczne na niebie kontury Drogi Mlecznej, zawiera być może miliard słońc.\n 3. Galaktyka ta przypomina kształtem soczewkę lub cienki zegarek, a jej grubość wynosi prawdopodobnie mniej niż jedną szóstą średnicy.\n 4. Nasze Słońce znajduje się dość blisko geometrycznego środka Galaktyki."
 verrier.89.g: "Słońce znajduje się w wewnętrznej części Drogi Mlecznej."
 verrier.89.h: "Słońce znajduje się na obrzeżach Drogi Mlecznej."
 verrier.90.t: "Wielka Debata dobiega końca"
 verrier.90.d: "Wielka Debata dobiegła końca i wyłoniły się stanowiska przyjęte przez większość naukowców."
 verrier.91.t: "Prace z Annus Mirabilis"
 verrier.91.d: "Uczony Albert Einstein zrewolucjonizował fizykę klasyczną kilkoma teoriami."
 verrier.91.f: "Prace z Annus Mirabilis to cztery artykuły, które Albert Einstein opublikował w 1905 roku w czasopiśmie naukowym „Annalen der Physik” („Roczniki Fizyki”). Wniosły one ogromny wkład w powstanie podstaw fizyki współczesnej. Zrewolucjonizowały naukowe rozumienie fundamentalnych pojęć przestrzeni, czasu, masy i energii. Pierwszy artykuł wyjaśniał efekt fotoelektryczny, a drugi — ruchy Browna. Trzeci przedstawiał szczególną teorię względności Einsteina, która ustanawiała stałą, uniwersalną prędkość światła we wszystkich układach odniesienia oraz teorię czasoprzestrzeni. Czwarty, będący konsekwencją szczególnej teorii względności, rozwijał zasadę równoważności masy i energii, wyrażoną słynnym równaniem E = mc^2, która doprowadziła do odkrycia i wykorzystania energii atomowej. Te cztery prace, wraz z mechaniką kwantową i późniejszą ogólną teorią względności Einsteina, stanowią fundament fizyki współczesnej."
 verrier.91.g: "Czyli teraz wszystko jest względne?"
 verrier.92.t: "Einstein przeprowadza się do [ROOT.GetCountry.GetNameNoFlag]"
 verrier.92.d: "Słynny fizyk Albert Einstein otrzymał propozycję objęcia stanowiska profesora na jednym z naszych uniwersytetów — i ją przyjął."
 verrier.92.f: "Albert Einstein był fizykiem teoretycznym urodzonym w Niemczech, powszechnie uznawanym za jednego z najwybitniejszych i najbardziej wpływowych fizyków wszech czasów. Najbardziej zasłynął z opracowania teorii względności, ale wniósł również istotny wkład w rozwój mechaniki kwantowej. Teoria względności i mechanika kwantowa stanowią dwa filary fizyki współczesnej. Jego prace wywarły także wpływ na filozofię nauki. Einstein urodził się w Cesarstwie Niemieckim, lecz w 1895 roku przeniósł się do Szwajcarii, a rok później zrzekł się niemieckiego obywatelstwa. W 1901 roku uzyskał obywatelstwo szwajcarskie, które zachował do końca życia. W 1914 roku przeprowadził się do Berlina, aby dołączyć do Pruskiej Akademii Nauk i podjąć pracę na Uniwersytecie Humboldtów w Berlinie. W 1917 roku został dyrektorem Instytutu Fizyki im. Cesarza Wilhelma. Ponownie uzyskał również obywatelstwo niemieckie, tym razem pruskie. W 1933 roku, gdy Einstein przebywał w Stanach Zjednoczonych, Adolf Hitler doszedł do władzy w Niemczech. Einstein, będący Żydem, sprzeciwiał się polityce nowo wybranego nazistowskiego rządu. Osiedlił się w Stanach Zjednoczonych, a w 1940 roku uzyskał obywatelstwo amerykańskie."
 verrier.92.g: "Witamy!"
 verrier.93.t: "Teoria grawitacji Einsteina"
 verrier.93.d: "Dzięki rewolucyjnej teorii Albert Einstein po raz kolejny zmienił nasze postrzeganie grawitacji, a także całego wszechświata."
 verrier.93.f: "Ogólna teoria względności to geometryczna teoria grawitacji opublikowana przez Alberta Einsteina w 1915 roku, stanowiąca obecnie obowiązujący opis grawitacji w fizyce współczesnej. Uogólnia szczególną teorię względności i udoskonala prawo powszechnego ciążenia Newtona, przedstawiając spójny opis grawitacji jako geometrycznej właściwości przestrzeni i czasu, czyli czterowymiarowej czasoprzestrzeni. W szczególności krzywizna czasoprzestrzeni jest bezpośrednio związana z energią i pędem obecnej w niej materii oraz promieniowania. Teoria Einsteina ma istotne konsekwencje dla astrofizyki, między innymi przewiduje istnienie czarnych dziur — obszarów przestrzeni, w których przestrzeń i czas są zniekształcone tak silnie, że nic, nawet światło, nie może się z nich wydostać. Czarne dziury stanowią końcowe stadium ewolucji masywnych gwiazd. Uważa się, że mikrokwazary i aktywne jądra galaktyk są odpowiednio czarnymi dziurami o masach gwiazdowych i supermasywnymi czarnymi dziurami. Teoria przewiduje również soczewkowanie grawitacyjne, w którym zakrzywienie toru światła prowadzi do powstawania wielu obrazów tego samego odległego zjawiska astronomicznego."
 verrier.93.g: "Ten człowiek jest geniuszem."
 verrier.94.t: "Einstein emigruje"
 verrier.94.d: "W związku ze zmianami politycznymi w naszym kraju wybitny fizyk Albert Einstein oddał dziś paszport i opuścił nasz kraj!"
 verrier.94.f: "Albert Einstein za życia był znany przede wszystkim z opracowania teorii względności i ogółu prac w dziedzinie fizyki. Jednak ze względu na jego sławę oraz zaangażowanie w przedsięwzięcia polityczne, humanitarne i naukowe na całym świecie jego poglądy polityczne budziły zainteresowanie opinii publicznej aż do połowy XX wieku. Einstein był zwolennikiem praw obywatelskich i wykorzystywał swoją rozpoznawalność, by potępiać dyskryminację w Stanach Zjednoczonych. Po przybyciu do Ameryki sprzeciwiał się złemu traktowaniu Afroamerykanów. Sam doświadczył dotkliwej dyskryminacji antysemickiej w Niemczech przed drugą wojną światową i współpracował z wieloma czołowymi działaczami oraz organizacjami walczącymi o prawa obywatelskie. Popierał socjalizm, zwłaszcza w późniejszych latach życia, a swoje poglądy gospodarcze szczegółowo przedstawił w artykule „Dlaczego socjalizm?”, opublikowanym w 1949 roku na łamach „Monthly Review”. Jego opinia o bolszewikach również zmieniała się z czasem. W 1925 roku krytykował ich za brak „dobrze zorganizowanego systemu rządów”, a ich panowanie określił jako „reżim terroru i tragedię w dziejach ludzkości”."
 verrier.94.g: "I tak go nie potrzebujemy."
 verrier.95.t: "Einstein, polityk"
 verrier.95.d: "Fizyk Albert Einstein zdobył uznanie w kraju i za granicą i najwyraźniej rozważa aktywne zaangażowanie się w politykę."
 verrier.95.f: "W 1918 roku Einstein był jednym z założycieli Niemieckiej Partii Demokratycznej, ugrupowania liberalnego. Ze względu na jego sławę oraz zaangażowanie w przedsięwzięcia polityczne, humanitarne i naukowe na całym świecie jego poglądy polityczne budziły zainteresowanie opinii publicznej aż do połowy XX wieku. Einstein działał na rzecz pokoju i był zdecydowanym zwolennikiem światowego federalizmu oraz prawa o zasięgu ogólnoświatowym. Popierał socjalizm, zwłaszcza w późniejszych latach życia, a swoje poglądy gospodarcze szczegółowo przedstawił w artykule „Dlaczego socjalizm?”, opublikowanym w 1949 roku na łamach „Monthly Review”. Jego opinia o bolszewikach zmieniała się z czasem. W 1925 roku krytykował ich za brak „dobrze zorganizowanego systemu rządów”, a ich panowanie określił jako „reżim terroru i tragedię w dziejach ludzkości”. Jego znacząca pozycja społeczna pozwalała mu wypowiadać się i pisać otwarcie, a nawet prowokacyjnie, w czasach, gdy wielu ludzi w Europie zmuszano do milczenia w związku ze wzrostem znaczenia nazizmu w Niemczech. Einstein był zwolennikiem praw obywatelskich i wykorzystywał swoją rozpoznawalność, by potępiać dyskryminację w Stanach Zjednoczonych. Przez całe życie pozostawał pacyfistą i uważał, że wojny stoją na przeszkodzie postępowi ludzkości."
 verrier.95.g: "Jest ważną postacią życia publicznego."
 verrier.95.h: "Jest naukowcem, a nie politykiem."
 verrier.100.t: "Obserwatorium"
 verrier.100.d: "Przegląd najważniejszych statystyk astronomicznych."
 verrier.100.planets: "Następujące #G [GetGlobalVariable('verrier_planets_number').GetValue]#! ciała niebieskie są uznawane za #T Planety#! Układu Słonecznego:\n"
 verrier.100.mercury: "\n#V Merkury#!, znany od starożytności."
 verrier.100.venus: "\n#V Wenus#!, znana od starożytności."
 verrier.100.earth: "\n#V Ziemia#!, znana również jako Terra, nasz dom."
 verrier.100.mars: "\n#V Mars#!, znany od starożytności."
 verrier.100.jupiter: "\n#V Jowisz#!, znany od starożytności."
 verrier.100.saturn: "\n#V Saturn#!, znany od starożytności."
 verrier.100.moon: "\n\n#T @verrier_moon_photo! Zdjęcia Księżyca#! zebrane: #G [ROOT.Var('verrier_moon_photo').GetValue]#!/#BLUE 10#!.\n"
 verrier.100.comets: "\n#T @verrier_comet! Wielkie Komety#! zaobserwowane: #G [ROOT.Var('verrier_great_comet').GetValue]#!/#BLUE [GetGlobalVariable('verrier_total_verrier_great_comet').GetValue]#!.\n"
 verrier.100.objects: "\nMiędzynarodowa społeczność astronomiczna odkryła łącznie #BLUE [GetGlobalVariable('verrier_total_astronomical_objects').GetValue]#! @verrier_astronomicalobject! [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects|q$')], z czego my odkryliśmy #G [ROOT.Var('verrier_astronomical_objects').GetValue]#!.\n"
 verrier.100.no_galaxies: "\nDroga Mleczna obejmuje #E cały wszechświat#!. Obiekty takie jak Mgławica Andromedy to #E jedynie obłoki gazu#!."
 verrier.100.galaxies: "\nDroga Mleczna jest zaledwie #E jedną z wielu galaktyk#! tworzących wszechświat. Obiekty takie jak Mgławica Andromedy to w rzeczywistości #E inne galaktyki#!."
 verrier.100.sun_center: "Słońce znajduje się w #E centralnym obszarze#! Drogi Mlecznej."
 verrier.100.sun_outer: "Słońce znajduje się w #E zewnętrznym obszarze#! Drogi Mlecznej."
 verrier.100.g: "Per aspera ad astra."
 verrier.100.h: "Odwiedź [concept_verrier_astronomer]!"
 verrier.100.i: "Pokaż mi kraje z największą liczbą Odkryć Astronomicznych!"
 verrier_leave_observatory_tt: "Opuścisz Obserwatorium"
 verrier.101.t: "[ROOT.Var('verrier_astronomer_var').GetCharacter.GetFullName]"
 verrier.101.d: "Nasz [concept_verrier_astronomer], [ROOT.Var('verrier_astronomer_var').GetCharacter.GetFullName], niestrudzenie pracuje nad odkrywaniem tajemnic nieba."
 verrier.101.g: "Per aspera ad astra."
 verrier.101.h: "Wróć do obserwatorium."
 verrier.111.t: "Cuda Nieba"
 verrier.111.d: "Joseph Johann von Littrow, jeden z najwybitniejszych żyjących astronomów w Europie, opublikował nowe fundamentalne dzieło z dziedziny astronomii."
 verrier.111.f: "Joseph Johann von Littrow był austriackim astronomem i inicjatorem budowy nowego obserwatorium uniwersyteckiego w Wiedniu. Jako dyrektor obserwatorium uniwersyteckiego, a od 1838 roku również dziekan, zdołał do 1825 roku całkowicie przebudować przestarzałą placówkę i wyposażyć ją w dobrej jakości instrumenty średniej wielkości. W latach 1834–1836 Littrow opublikował popularnonaukowe dzieło „Cuda Nieba”, którego w ciągu kilku lat wydrukowano 14,000 egzemplarzy. Trzytomowa praca stała się klasyką literatury astronomicznej i uczyniła Littrowa najpoczytniejszym niemieckojęzycznym astronomem XIX wieku. Początkowo planował on wydać obszerną historię astronomii jako ostatnią część „Cudów Nieba”. Nie zdołał jednak ukończyć tego przedsięwzięcia. Jego historia astronomii pozostała w rękopisie. Littrow zmarł w listopadzie 1840 roku."
 verrier.111.g: "Ta książka ma praktyczne zastosowanie."
 verrier.111.h: "Ta książka ma wartość teoretyczną."
 verrier.111.i: "Ta książka ma wartość edukacyjną."
 verrier.112.t: "Bonner Durchmusterung"
 verrier.112.d: "Pruscy astronomowie zaprezentowali obszerny katalog gwiazd zawierający nieznane dotąd obiekty astronomiczne."
 verrier.112.f: "Bonner Durchmusterung (BD) to katalog gwiazd (oraz opracowany na jego podstawie atlas obejmujący 36 arkuszy), oparty na wizualnych pomiarach gwiazd północnego nieba. Przegląd prowadził [SCOPE.sCharacter('verrier_new_astronomer_scope').GetFullName] w obserwatorium Uniwersytetu w Bonn. Prace prowadzono, a ich wyniki publikowano w latach 1846–1863 przy wsparciu Adalberta Krügera i Eduarda Schönfelda. Łącznie zmierzono położenia około 324,198 gwiazd w zakresie deklinacji od 89° do −2°, do wielkości gwiazdowej 9.5 (niekiedy do 10). Do pomiarów służyła luneta do poszukiwania komet, wykonana przez Josepha von Fraunhofera, o średnicy obiektywu 7.7 cm i ogniskowej 65 cm."
 verrier.112.g: "Świetnie!"
 verrier.112.h: "Z pewnością [SCOPE.sCharacter('verrier_new_astronomer_scope').GetLastName] odkryje jeszcze więcej cudów nieba!"
 verrier.113.t: "Kanały Marsjańskie"
 verrier.113.d: "Jeden z naszych astronomów dokonał osobliwych obserwacji na powierzchni sąsiadującej z nami Czerwonej Planety."
 verrier.113.f: "[SCOPE.sCharacter('verrier_new_astronomer_scope').GetFullName] uchodzi za najbystrzejszego obserwatora nieba swojego stulecia jako [concept_verrier_astronomer] i jest najbardziej znany z obserwacji Merkurego, Wenus i Marsa. Na tej ostatniej planecie odkrył w 1877 roku coś, co przypominało delikatne bruzdy, wkrótce nazwane przez prasę kanałami marsjańskimi i badane przez kolejnych 80 lat. Te liniowe struktury znajdowały się na granicy widoczności ówczesnych teleskopów soczewkowych o średnicy obiektywu od 30 do 50 cm, a ich dostrzeżenie wymagało szczególnego doświadczenia obserwacyjnego. Dopiero podczas kolejnej opozycji Marsa w 1879 roku ich zaobserwowanie potwierdzili inni astronomowie. [SCOPE.sCharacter('verrier_new_astronomer_scope').GetLastName] uważał je za naturalne, prostoliniowe zagłębienia o długości do 2000 km i szerokości około 100 km, którymi woda mogłaby rozprzestrzeniać się po suchej poza tym powierzchni. Błędne tłumaczenie na angielski (canals zamiast poprawnego channels) nasunęło jednak wielu dziennikarzom skojarzenia z budowlami inżynieryjnymi. Dało to początek powieściom fantastycznonaukowym i utrzymującemu się przez dziesięciolecia mitowi o Marsjanach."
 verrier.113.g: "Zdumiewające odkrycie."
 verrier.113.h: "Musimy wyszkolić generała, by stawił czoła przyszłemu zagrożeniu ze strony Marsjan!"
 verrier.113.i: "Może uda nam się nazwać więcej rzeczy na cześć [SCOPE.sCharacter('verrier_new_astronomer_scope').GetLastName]!"
 verrier.114.t: "Kometa Halleya"
 verrier.114.d: "Kometa Halleya ponownie pojawiła się na niebie po około 75 latach."
 verrier.114.f: "Kometa Halleya jest jedyną znaną kometą krótkookresową regularnie widoczną z Ziemi gołym okiem, a tym samym jedyną kometą dostrzegalną bez przyrządów, która może pojawić się dwukrotnie w ciągu ludzkiego życia. Jej okresowe powroty do wewnętrznej części Układu Słonecznego były obserwowane i odnotowywane przez astronomów na całym świecie co najmniej od 240 roku p.n.e. Dopiero jednak w 1705 roku angielski astronom Edmond Halley zrozumiał, że za każdym razem pojawiała się ta sama kometa. W uznaniu tego odkrycia nazwano ją jego nazwiskiem. Powrót w 1910 roku był niezwykły z kilku powodów: po raz pierwszy wykonano zdjęcia komety i uzyskano dane spektroskopowe. Amerykański satyryk i pisarz Mark Twain urodził się 30 listopada 1835 roku, dokładnie dwa tygodnie po przejściu komety przez peryhelium. W autobiografii opublikowanej w 1909 roku powiedział: „Przyszedłem na świat wraz z kometą Halleya w 1835 roku. Powróci w przyszłym roku i spodziewam się odejść razem z nią. Jeśli tak się nie stanie, będzie to największe rozczarowanie mojego życia. Wszechmogący bez wątpienia powiedział: «Oto te dwa nieobliczalne dziwadła. Przyszły razem, więc razem muszą odejść»”. Twain zmarł 21 kwietnia 1910 roku, dzień po kolejnym przejściu komety przez peryhelium"
 verrier.114.g: "Do zobaczenia za 75 lat!"
 verrier.115.t: "Rozszerzający się wszechświat Lemaître’a"
 verrier.115.d: "Katolicki ksiądz sformułował intrygującą i rewolucyjną teorię dotyczącą stanu i pochodzenia wszechświata, która może obalić nasz dotychczasowy obraz świata."
 verrier.115.f: "Georges Lemaître był belgijskim księdzem katolickim, fizykiem teoretycznym, matematykiem, astronomem i profesorem fizyki na Katolickim Uniwersytecie w Lowanium. Jako pierwszy wysunął teorię, że oddalanie się pobliskich galaktyk można wyjaśnić rozszerzaniem się wszechświata, co wkrótce potem potwierdziły obserwacje Edwina Hubble’a. Jako pierwszy wyprowadził „prawo Hubble’a”, nazywane obecnie przez Międzynarodową Unię Astronomiczną prawem Hubble’a–Lemaître’a, i w 1927 roku opublikował pierwsze oszacowanie stałej Hubble’a, dwa lata przed artykułem Hubble’a. Lemaître zaproponował również teorię Wielkiego Wybuchu, wyjaśniającą pochodzenie wszechświata. Nazwał ją „hipotezą pierwotnego atomu”, a później „początkiem świata”. W pracy „Jednorodny wszechświat o stałej masie i rosnącym promieniu, wyjaśniający prędkości radialne mgławic pozagalaktycznych” (1927), która miała mu później przynieść międzynarodową sławę, przedstawił nowatorską koncepcję rozszerzającego się wszechświata, wyprowadzoną z ogólnej teorii względności."
 verrier.115.g: "Czyli tę całą historię z „wielkim wybuchem” wymyślił jezuita? Wiedziałem!"
 verrier.116.t: "Teoria Kwantowa"
 verrier.116.d: "Swoją teorią kwantową fizyk [SCOPE.sCharacter('verrier_new_astronomer_scope').GetFullName] na trwałe zmienił ludzkie rozumienie procesów atomowych i subatomowych."
 verrier.116.f: "„Z natury był umysłem konserwatywnym; nie miał w sobie nic z rewolucjonisty i podchodził do spekulacji z głębokim sceptycyzmem. Jednak jego wiara w nieodpartą siłę logicznego rozumowania opartego na faktach była tak wielka, że nie zawahał się ogłosić najbardziej rewolucyjnej idei, jaka kiedykolwiek wstrząsnęła fizyką”. — Max Born o Maksie Plancku \n\n Głównym założeniem jego nowego wyprowadzenia było przypuszczenie, znane dziś jako postulat Plancka, że energia elektromagnetyczna może być emitowana wyłącznie w postaci skwantowanej. Fizycy nazywają obecnie te kwanty fotonami. Założenie to, niezgodne z fizyką klasyczną, uznaje się za początek fizyki kwantowej i największe osiągnięcie intelektualne w karierze Plancka. Odkrycie stałej Plancka pozwoliło mu zdefiniować nowy, uniwersalny układ jednostek fizycznych, oparty w całości na fundamentalnych stałych fizycznych, na których opiera się znaczna część teorii kwantowej. W uznaniu jego fundamentalnego wkładu w nową dziedzinę fizyki przyznano mu Nagrodę Nobla z fizyki za 1918 rok."
 verrier.116.g: "Historyczny przełom w nauce!"
 verrier.116.h: "Ten genialny człowiek powinien dla nas pracować!"
 verrier.117.t: "Poza Drogą Mleczną"
 verrier.117.d: "Astronom [SCOPE.sCharacter('verrier_new_astronomer_scope').GetFullName] dowiódł, że wiele obiektów uznawanych dotąd za obłoki pyłu i gazu i klasyfikowanych jako „mgławice” to w rzeczywistości galaktyki leżące poza Drogą Mleczną"
 verrier.117.f: "[SCOPE.sCharacter('verrier_new_astronomer_scope').GetFullName] był amerykańskim astronomem. Odegrał kluczową rolę w powstaniu astronomii pozagalaktycznej i kosmologii obserwacyjnej. Hubble przedstawił dowody na to, że prędkość oddalania się galaktyki rośnie wraz z jej odległością od Ziemi. Zależność ta jest dziś znana jako „prawo Hubble’a”, choć dwa lata wcześniej zaproponował ją Georges Lemaître. Korzystając z teleskopu Hookera na Mount Wilson, Hubble rozpoznał cefeidy — gwiazdy zmienne służące jako świece standardowe dzięki zależności odkrytej przez Henriettę Leavitt. Porównanie ich jasności obserwowanej z jasnością rzeczywistą pozwala wyznaczyć ich odległość od Ziemi. Hubble odnalazł cefeidy w kilku mgławicach, w tym w Mgławicy Andromedy i Mgławicy Trójkąta. Jego obserwacje z 1924 roku jednoznacznie dowiodły, że obiekty te znajdują się zbyt daleko, by należeć do Drogi Mlecznej, i są w rzeczywistości całymi galaktykami poza naszą własną. Dlatego dziś nie zalicza się ich już do mgławic. Hubble opracował również najpowszechniej stosowany system klasyfikacji galaktyk, dzieląc je według wyglądu na zdjęciach. Poszczególne grupy uporządkował w układ nazwany sekwencją Hubble’a."
 verrier.117.h: "[SCOPE.sCharacter('verrier_new_astronomer_scope').GetLastName] będzie wspaniałym dodatkiem do mojej kolekcji!"
 verrier.118.t: "Fizyka Jądrowa"
 verrier.118.d: "Badania i prace prowadzone pod kierunkiem Ernesta Rutherforda pozwalają ustalić jądrową budowę atomu oraz wykazać, że rozpad promieniotwórczy jest procesem zachodzącym w jądrze atomowym."
 verrier.118.f: "Ernest Rutherford był nowozelandzkim fizykiem, który zyskał miano ojca fizyki jądrowej. Poza pracą w ojczyźnie znaczną część kariery spędził za granicą, w Kanadzie i Wielkiej Brytanii. Na początku swojej działalności badawczej odkrył okres połowicznego rozpadu oraz promieniotwórczy pierwiastek radon, a także rozróżnił i nazwał promieniowanie alfa i beta. Za te osiągnięcia otrzymał w 1908 roku Nagrodę Nobla z chemii „za badania nad rozpadem pierwiastków i chemią substancji promieniotwórczych”. Rutherford przeniósł się do Wielkiej Brytanii, gdzie wraz z Thomasem Roydsem dowiódł, że promieniowanie alfa składa się z jąder helu. Później wysunął teorię, że ładunek atomu jest skupiony w bardzo małym jądrze. Odkrywając i interpretując zjawisko rozpraszania Rutherforda w doświadczeniu Hansa Geigera i Ernesta Marsdena ze złotą folią, stworzył podstawy modelu atomu nazwanego jego imieniem. Przeprowadził pierwszą sztucznie wywołaną reakcję jądrową w doświadczeniach polegających na bombardowaniu jąder azotu cząstkami alfa. W ich wyniku odkrył emisję cząstki subatomowej, którą nazwał protonem."
 verrier.119.t: "Układ Okresowy Pierwiastków"
 verrier.119.d: "Chemik Dmitrij Mendelejew opracował wersję układu okresowego pierwiastków."
 verrier.119.f: "W 1863 roku znano 56 pierwiastków, a nowe odkrywano w tempie około jednego rocznie. Inni uczeni już wcześniej dostrzegli okresowość właściwości pierwiastków. Po objęciu posady nauczyciela w 1867 roku Mendelejew napisał „Podstawy chemii”, które stały się najważniejszym podręcznikiem swojej epoki. Dzieło ukazało się w dwóch tomach w latach 1868–1870 i powstawało z myślą o prowadzonym przez niego kursie. Próbując sklasyfikować pierwiastki według ich właściwości chemicznych, zauważył prawidłowości, które doprowadziły go do opracowania układu okresowego. Twierdził, że pełny układ pierwiastków ujrzał we śnie: „Zobaczyłem we śnie tablicę, w której wszystkie pierwiastki znalazły się na właściwych miejscach. Po przebudzeniu natychmiast zapisałem ją na kartce papieru. Później tylko w jednym miejscu konieczna okazała się poprawka”. Dodając kolejne pierwiastki zgodnie z tym wzorcem, Mendelejew opracował rozszerzoną wersję układu okresowego. Na łamach rosyjskojęzycznego czasopisma opublikował układ obejmujący wszystkie znane pierwiastki i przewidział istnienie kilku nowych, które miały wypełnić pozostawione w nim luki."
 verrier.120.t: "[SCOPE.sCharacter('verrier_new_astronomer_scope').GetFullName]"
 verrier.120.d: "Najsłynniejszy [concept_verrier_astronomer] Francji napisał kompendium poświęcone ciałom niebieskim Układu Słonecznego."
 verrier.120.f: "[SCOPE.sCharacter('verrier_new_astronomer_scope').GetFullName] był francuskim astronomem i matematykiem specjalizującym się w mechanice nieba, najbardziej znanym z przewidzenia istnienia i położenia Neptuna wyłącznie za pomocą matematyki. Obliczenia miały wyjaśnić rozbieżności między obserwowaną orbitą Urana a przewidywaniami wynikającymi z praw Keplera i Newtona. Le Verrier przesłał współrzędne Johannowi Gottfriedowi Gallemu w Berlinie, prosząc o ich sprawdzenie. Galle odnalazł Neptuna tej samej nocy, której otrzymał list Le Verriera, w odległości nie większej niż 1° od przewidzianego położenia. Następnie Le Verrier podjął się zadania, by „... objąć jednym dziełem cały układ planetarny i, jeśli to możliwe, uzgodnić wszystkie jego elementy, a w przeciwnym razie stwierdzić z całą pewnością, że istnieją jeszcze nieznane przyczyny perturbacji...”. Praca ta miała go zajmować do końca życia. Le Verrier rozpoczął od ponownego opracowania funkcji perturbacyjnej, służącej do obliczania zaburzeń ruchu planet, uwzględniając wyrazy do 7. rzędu. Wyprowadzenie to, obejmujące 469 wyrazów matematycznych, ukończył do 1849 roku. Następnie zebrał obserwacje położeń planet sięgające 1750 roku. Ich analiza oraz korygowanie niezgodności z najnowszymi danymi zajęły mu czas do 1852 roku. Opracowane tablice stanowiły podstawę efemeryd publikowanych w „Connaissance des Temps”, almanachu astronomicznym Biura Długości Geograficznej, aż do około 1912 roku."
 verrier.120.h: "Powinien nam służyć."
 verrier_congress_attend_modifier: "Udział w Kongresie Astronomicznym"
 verrier.121.t: "Odkryto Astraeę"
 verrier.121.d: "Pruski astronom amator Karl Ludwig Hencke przypadkowo odkrył nową planetę i nazwał ją „Astraea”."
 verrier.121.f: "Karl Ludwig Hencke — z zawodu były sekretarz pocztowy — na emeryturze poświęcił się swojej pasji, astronomii. 8 grudnia 1845 roku odkrył piątą planetoidę Układu Słonecznego, Astraeę. Nastąpiło to niemal 40 lat po odkryciu ostatniej „planety”, Westy. Król Prus przyznał mu za to odkrycie dożywotnią rentę w wysokości 1,200 marek rocznie. Odkrycie Astraei miało zapoczątkować kolejne odkrycia w pasie planetoid i było ostatnim wielkim odkryciem ciała niebieskiego przed odnalezieniem Neptuna. Jednocześnie „Astraea” nasiliła wątpliwości, czy tak małe obiekty w przestrzeni kosmicznej rzeczywiście zasługują na miano „planet”. Alexander von Humboldt zaproponował wówczas zaliczenie tych ciał niebieskich do osobnej kategorii: planetoid."
 verrier.121.g: "Dwunasta planeta!"
 verrier.122.g: "Wygląda na to, że w dzisiejszych czasach każdy napotkany kamień ogłasza się planetą."
 verrier.200.t: "[SCOPE.sCharacter('verrier_astronomer_scope').GetFullName] ustala, że odległość do 61 Cygni wynosi 11.4 lat świetlnych"
 verrier.200.d: "Za jednym zamachem wszechświat stał się znacznie większy. Wykorzystując paralaksę 61 Cygni, [SCOPE.sCharacter('verrier_astronomer_scope').GetFullName] ustalił, że odległość do tej gwiazdy wynosi 11.4 lat świetlnych. Metoda ta umożliwi ogromny postęp w badaniach wszechświata."
 verrier.200.f: "W 1836 roku niemiecki astronom Friedrich Bessel jako pierwszy zdołał wyznaczyć odległość do gwiazdy. Wykorzystał w tym celu paralaksę, czyli pozorną zmianę położenia gwiazdy względem tła, wynikającą z ruchu Ziemi. Przypomina to patrzenie na przedmiot najpierw prawym, a następnie lewym okiem.\n\nNa podstawie tej zmiany położenia można następnie obliczyć odległość."
 verrier.200.g: "Wielki dzień dla Astronomii!"
 verrier_modern_astronomy_invented_modifier: "Pierwszy Pomiar Odległości do Gwiazdy"
 verrier.201.t: "[SCOPE.sCharacter('verrier_astronomer_scope').GetFullName] odkrył przyczynę powstawania Linii Fraunhofera"
 verrier.201.d: "Przez długi czas przyczyna występowania cienkich czarnych linii w widmie Słońca pozostawała przedmiotem spekulacji. Teraz jednak Dr. [SCOPE.sCharacter('verrier_astronomer_scope').GetFullName] wreszcie ją odkrył: za powstawanie tych linii odpowiadają określone Pierwiastki Chemiczne. Pozwala to ustalić, jakie Pierwiastki występują w gwiazdach."
 verrier.201.f: "Joseph Fraunhofer zauważył wyraźne linie w widmie Słońca w 1813 roku. Dopiero kilkadziesiąt lat później Gustav Robert Kirchhoff i Robert Bunsen odkryli przyczynę ich powstawania. Spalając różne pierwiastki i związki chemiczne, zaobserwowali, że pochłaniają one określone części widma. Uznali zatem, że pochłanianie określonych części widma świadczy o obecności danego związku chemicznego lub pierwiastka w zewnętrznych warstwach gwiazdy.\n\nSpektroskopia umożliwiła nie tylko klasyfikowanie gwiazd według ich typów, lecz także analizę spektroskopową materiałów i substancji chemicznych. Nawet odkrycie Helu zawdzięczamy spektroskopii Słońca."
 verrier.201.g: "Kolejna tajemnica wszechświata została rozwiązana!"
 verrier.1001.t: "Budowa Tara Wali Kothi"
 verrier.1001.d: "Budowa naszego obserwatorium Tara Wali Kothi postępuje powoli. W zeszłym roku podpułkownik [ROOT.Var('verrier_astronomer_var').GetCharacter.GetFullName] objął stanowisko Królewskiego Astronoma ([concept_verrier_astronomer]) w nadziei na przyspieszenie prac. Budowa potrwa zapewne jeszcze kilka lat, jeśli nie wesprzemy Wilcoxa pieniędzmi i wiedzą. Najpierw musimy jednak zdecydować, czy w ogóle chcemy ją kontynuować."
 verrier.1001.f: "Tara Wali Kothi było obserwatorium wzniesionym na zlecenie króla Nasir-ud-Dina Haidera, który interesował się astronomią i astrologią, a nawet studiował astronomię w Kalkucie.\nBudowa Tara Wali Kothi, czyli „Rezydencji Gwiazd”, rozpoczęła się w 1832 roku i trwała 9 lat, aż do ukończenia w 1841 roku. Obserwatorium działało zaledwie przez kilka lat, a później służyło jako kwatera główna podczas powstania w Indiach. Następnie budynek wykorzystywano jako bank."
 verrier.1001.g: "Pod kierunkiem [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] szybko poczynimy postępy!"
 verrier.1001.h: "To strata pieniędzy!"
 stop_constructing_tara_wali_kothi_tt: "Nie będziemy kontynuować budowy obserwatorium Tara Wali Kothi. Nigdy nie otrzymasz ponownej szansy na jego zbudowanie."
 verrier.1002.t: "Ukończono Tara Wali Kothi"
 verrier.1002.d: "Po latach budowy obserwatorium Tara Wali Kothi zostało wreszcie ukończone. Pomieści najnowocześniejsze instrumenty astronomiczne i otworzy przed nami drogę do wielkich odkryć."
 verrier.1002.f: "[ROOT.GetCountry.GetRuler.GetFullName] spoglądał przez wielki teleskop, wypatrując gwiazd i planet. Teraz, gdy budowa Tara Wali Kothi wreszcie dobiegła końca, obserwatorium miało stać się siedzibą najwybitniejszych umysłów [ROOT.GetCountry.GetName] i miejscem prowadzenia zajęć dla studentów. Był to ogromny krok ku przyszłości."
 verrier.1002.g: "Rezydencja Gwiazd poprowadzi nas ku nowym odkryciom!"
 je_verrier_tara_wali_kothi: "Budowa Tara Wali Kothi"
 je_verrier_tara_wali_kothi_reason: "W królestwie Awadh trwa budowa Obserwatorium Tara Wali Kothi. Na postęp prac można wpływać na różne sposoby."
 je_verrier_tara_wali_kothi_goal: "Postęp budowy musi osiągnąć co najmniej 60."
 je_verrier_tara_wali_kothi_success: "Postęp budowy wynosi co najmniej 60."
 verrier_add_20_tara_wali_kothi_progress_tt: "Zwiększ postęp budowy Tara Wali Kothi o #p 20 punktów #!."
 verrier_add_10_tara_wali_kothi_progress_tt: "Zwiększ postęp budowy Tara Wali Kothi o #p 10 punktów #!."
 verrier_kothe_buy_additional_instruments_button: "Kup nowoczesne instrumenty astronomiczne"
 verrier_kothe_buy_additional_instruments_button_desc: "Kup nowoczesne instrumenty astronomiczne dla Tara Wali Kothi. Pomoże nam to wcześniej ukończyć budowę."
 verrier_kothe_employ_physics_teachers_button: "Zatrudnij Nauczycieli Fizyki"
 verrier_kothe_employ_physics_teachers_button_desc: "Zatrudnij w swoich szkołach nauczycieli, którzy będą przekazywać wiedzę o najnowszych odkryciach fizyki i astronomii. Pomoże nam to szybciej ukończyć budowę Tara Wali Kothi i przyspieszy nasze badania."
 verrier_kothe_employ_foreign_engineers_button: "Zatrudnij Zagranicznych Inżynierów"
 verrier_kothe_employ_foreign_engineers_button_desc: "Zatrudnij zagranicznych inżynierów do wykonania niezbędnych instrumentów astronomicznych i wzniesienia budynków Tara Wali Kothi. Pomoże nam to wcześniej ukończyć budowę."
 verrier_kothe_pay_workers_extra_button: "Wypłać Robotnikom premię"
 verrier_kothe_pay_workers_extra_button_desc: "Aby przyspieszyć prace, wypłacimy robotnikom dodatkowe wynagrodzenie. Pomoże nam to wcześniej ukończyć budowę."
 verrier.1011.t: "Rozpoczęto budowę Ethniko Asterosokopio Athinon"
 verrier.1011.d: "Pierwsze greckie Obserwatorium było kolejnym krokiem Grecji ku nowoczesności. Na Wzgórzu Nimf zgromadził się ogromny tłum, by być świadkiem tego przełomowego wydarzenia w historii kraju. [ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullNameNoFormatting] również przybył w towarzystwie członków Rządu i przedstawicieli greckiego Kościoła. Wszyscy świętowali, wygłaszali przemówienia i spoglądali w niebo."
 verrier.1011.f: "   Wśród wiwatów zgromadzonych wmurowano kamień węgielny pod budowę. Wyryto na nim wizerunek Układu Słonecznego, stosowny dla nowego Obserwatorium Grecji.\n\n   #b Historycznie #! budowa Ethniko Asterosokopio Athinon rozpoczęła się 26 czerwca 1842 roku, w dniu zaćmienia Słońca. Poprzedziły ją wieloletnie starania greckiego astronoma Georgiosa Konstantinosa Vourisa, prawdopodobnie najbardziej znanego greckiego uczonego tamtych czasów.\n   Ponieważ Vouris przez dłuższy czas mieszkał w Austrii, miał dobre kontakty zarówno wśród Austriaków, jak i Greków. Przekonał grecko-austriackiego bankiera i przedsiębiorcę Georgiosa Sinasa do wsparcia przedsięwzięcia darowizną. Pierwszy budynek obserwatorium nazwano na cześć Sinasa."
 verrier.1011.a: "Wkrótce będziemy mogli obserwować gwiazdy z niespotykaną dotąd dokładnością."
 verrier.1012.t: "Astronomowie rozpoczynają obserwacje nieba w Ethniko Asterosokopio Athinon"
 verrier.1012.d: "Dziś ukończono budowę Ethniko Asterosokopio Athinon, pierwszego obserwatorium w Grecji. Placówka jest pierwszym instytutem badawczym w kraju, a jej powstanie stanowi ogromny krok naprzód dla greckiego środowiska naukowego. Pracujący w niej astronomowie skupią się na obserwacjach Słońca, Księżyca i gwiazd. Miejmy nadzieję, że ich praca zaowocuje nowymi odkryciami w dziedzinie astronomii."
 verrier.1012.f: "Księżyc był doskonale widoczny przez teleskop. Wyglądał niesamowicie. Można było dostrzec nawet niewielkie kratery na jego powierzchni.\n\n#b Historycznie #! obserwatorium rozpoczęło działalność w 1856 roku pod kierunkiem greckiego astronoma Georgiosa Konstantinosa Vourisa. Dwa lata później Vouris zachorował i osiadł na emeryturze w Wiedniu. Jego następca, Johann Friedrich Julius Schmidt, rozbudował bibliotekę obserwatorium i prowadził obserwacje wielu obiektów astronomicznych. Szczególną uwagę poświęcał Księżycowi. Jego główne dzieło, „Chaptre der Gebirge des Mondes” („Mapa topograficzna Księżyca”), przedstawiało całą widoczną powierzchnię Księżyca w postaci precyzyjnych rysunków. Zauważył również zmiany w ukształtowaniu krateru Linné.\n   Schmidt publikował także prace dotyczące trzęsień ziemi i meteorologii oraz próbował ustalić położenie Troi.\n\n   Obserwatorium na Wzgórzu Nimf nadal działa, lecz w skład Narodowego Obserwatorium w Atenach wchodzą jeszcze trzy placówki: Stacja Astronomiczna Penteli, Stacja Astronomiczna Kryoneri i Obserwatorium Chelmos."
 verrier.1012.g: "Jakie cuda odkryjemy?"
 verrier.1012.h: "Jestem pewien, że Vouris dokona wielkich odkryć!"
 verrier.1013.t: "Pierwsi studenci na Othóneion Panepistímion"
 verrier.1013.d: "Król Otton wykorzystał swoje kontakty z europejskimi uczonymi, aby założyć nową uczelnię — Othóneion Panepistímion, czyli Uniwersytet Ottoński. Wielu nowych profesorów to Grecy wykształceni na Zachodzie. Ci naukowcy i uczeni wnoszą do Grecji rozległą wiedzę i będą kształcić kolejne pokolenie. Obecnie uniwersytet mieści się w domu architektów Stamatiosa Kleanthisa i Eduarda Schauberta, lecz przeniesie się do Głównego Gmachu, gdy tylko jego budowa dobiegnie końca."
 verrier.1013.g: "Ta wiedza pomoże nam zmniejszyć dystans do wielkich mocarstw!"
 verrier.1013.h: "Nie potrzebujemy pomocy cudzoziemców!"
 verrier.1050.t: "[SCOPE.sCharacter('verrier_new_astronomer_scope').GetFullName]"
 verrier.1050.d: "Matematyk i Astronom [SCOPE.sCharacter('verrier_new_astronomer_scope').GetFullName] pracuje jako obserwator w Obserwatorium w Lipsku. Właśnie w tym roku opublikował swoją najnowszą pracę z dziedziny astronomii, „Die Hauptsätze der Astronomie”, czyli „Podstawowe zasady astronomii”. Z pewnością przydałby się nam na oficjalnym stanowisku Astronoma."
 verrier.1050.f: "[SCOPE.sCharacter('verrier_new_astronomer_scope').GetFullName] był zarówno matematykiem, jak i astronomem. Opublikował wiele książek poświęconych astronomii, której nauczał również na Uniwersytecie w Lipsku. W matematyce zajmował się głównie topologią, działem geometrii badającym położenie i wzajemny układ obiektów geometrycznych. Najbardziej znana jest wstęga Möbiusa, którą Möbius opracował, aby pokazać, że powierzchnia nie musi mieć dwóch stron."
 verrier.1050.g: "Wspaniale!"
 verrier.1050.h: "Powinien objąć u nas stanowisko głównego astronoma ([concept_verrier_astronomer])!"
 verrier.1060.t: "Kometa muskająca Słońce zasila kasę Harvardu"
 verrier.1060.d: "Po tym, jak jasna kometa stała się widoczna nawet za dnia, mieszkańcy Bostonu przekazali Uniwersytetowi Harvarda liczne darowizny. Pieniądze zostaną przeznaczone na budowę obserwatorium. Dotychczasowy obserwator uniwersytecki, William Cranch Bond, jest zachwycony perspektywą powstania nowoczesnego obserwatorium."
 verrier.1060.f: "William Cranch Bond był początkowo zegarmistrzem, a zarazem astronomem amatorem. W swoim pierwszym domu zbudował obserwatorium, w którym prowadził pomiary nieba. W 1839 roku został mianowany nieopłacanym obserwatorem na Uniwersytecie Harvarda i musiał korzystać z własnego sprzętu. Gdy w 1843 roku uczelnia otrzymała darowizny w wysokości 25,730 dolarów amerykańskich, mógł zbudować nowoczesne obserwatorium.\nBond odkrył między innymi księżyc Saturna, Hyperiona, a wspólnie z synem także najbardziej wewnętrzny pierścień tej planety. Był również pionierem astrofotografii. Udało mu się wykonać pierwsze w Ameryce zdjęcie gwiazdy."
 verrier.1060.g: "Rozpocznijmy budowę Obserwatorium!"
 verrier.1060.h: "Tak, z całą pewnością przeznaczymy te pieniądze na Astronomię!"
 verrier.1060.i: "Nie potrzebujemy żadnych darowizn!"
 verrier.1100.t: "Stresująca praca"
 verrier.1100.d: "Twój [concept_verrier_astronomer], [SCOPE.sCharacter('verrier_astronomer_scope').GetFullName], jest dość zestresowany. Może powinniśmy wysłać [SCOPE.sCharacter('verrier_astronomer_scope').GetHerHim] na odpoczynek?"
 verrier.1100.f: "MUSZĘ znaleźć więcej gwiazd! Jest ich tam tyle! Jak to możliwe, że nie mogę znaleźć żadnej, której nikt jeszcze nie odkrył? A co z kometami i planetoidami? Muszę coś znaleźć!\nMoże jakichś Marsjan? Zaraz, czy Marsjanie istnieją naprawdę? A może chodziło mi o kanały marsjańskie? Nie pamiętam. I gdzie ja znowu podziałem notatki?"
 verrier.1100.g: "[SCOPE.sCharacter('verrier_astronomer_scope').GetLastName] potrzebuje odpoczynku!"
 verrier.1100.h: "To [SCOPE.sCharacter('verrier_astronomer_scope').GetHerHis] praca. [SCOPE.sCharacter('verrier_astronomer_scope').GetSheHe|U] dostaje wynagrodzenie za odkrywanie gwiazd, a nie za odpoczynek!"
 astronomer_on_break_tt: "Twój [concept_verrier_astronomer] uda się na odpoczynek na #n 1#! rok. W tym czasie nie będą pojawiać się żadne ze zwykłych wydarzeń."
 verrier.1101.t: "Czy Dr. [SCOPE.sCharacter('verrier_astronomer_scope').GetLastName] traci [SCOPE.sCharacter('verrier_astronomer_scope').GetHerHis] rozum?"
 verrier.1101.d: "Twój [concept_verrier_astronomer], [SCOPE.sCharacter('verrier_astronomer_scope').GetFullName], zdaje się zapominać coraz więcej rzeczy. Może pora odwołać [SCOPE.sCharacter('verrier_astronomer_scope').GetHerHim] ze stanowiska Astronoma?"
 verrier.1101.f: "Gdzie położyłem te notatki? Zaraz, gdzie położyłem obiad? I co to za dziwna rzecz na moim teleskopie? Czy to... czy to mój obiad?\nZaraz, co to za zapach? Czy coś się pali? Jak do tego doszło!?"
 verrier.1101.g: "Moim zdaniem [SCOPE.sCharacter('verrier_astronomer_scope').GetSheHe] nie powinien dalej pracować."
 verrier.1101.h: "Pff, to zupełnie normalne!"
 verrier.1110.t: "Bliźniacza Gwiazda zniknęła"
 verrier.1110.d: "Nasz [concept_verrier_astronomer], [SCOPE.sCharacter('verrier_astronomer_scope').GetFullName], był pewien, że zidentyfikował dwie bliźniacze gwiazdy, które nocą zachowywały się dokładnie tak samo. Gdy inni Astronomowie próbowali je odnaleźć, zdołali dostrzec tylko jedną. Wygląda na to, że [SCOPE.sCharacter('verrier_astronomer_scope').GetLastName] ma poważny problem — albo [SCOPE.sCharacter('verrier_astronomer_scope').GetHerHis] wzrok szwankuje, albo nadużywa alkoholu."
 verrier.1110.f: "Przysięgam! *hik* Była tam druga gwiazda! *hik* Było ją wyraźnie widać *hik* i była identyczna jak ta pierwsza. *hik* Musiała zniknąć. *hik* A może moi koledzy kłamią! *hik* Kto wie!"
 verrier.1110.g: "[SCOPE.sCharacter('verrier_astronomer_scope').GetSheHe|U] musi wrócić na właściwe tory!"
 verrier.1111.t: "Notatki Badawcze zniszczone"
 verrier.1111.d: "W [concept_verrier_observatory] doszło do strasznego incydentu, który wywołał pożar i zniszczył część notatek badawczych naszego [concept_verrier_astronomer], [SCOPE.sCharacter('verrier_astronomer_scope').GetFullName]. Wygląda na to, że notatki zajęły się od płomienia świecy, ale nie wiemy, dlaczego [SCOPE.sCharacter('verrier_astronomer_scope').GetLastName] nie ugasił ognia."
 verrier.1111.f: "Nie wiem, jak do tego doszło! Tak ciężko pracowałem i musiałem być tak pochłonięty obserwacjami przez teleskop, że po prostu niczego nie zauważyłem!"
 verrier.1111.g: "Czy [SCOPE.sCharacter('verrier_astronomer_scope').GetSheHe] był pijany czy co?"
 verrier.1111.h: "Czy [SCOPE.sCharacter('verrier_astronomer_scope').GetSheHe] był pod wpływem narkotyków?"
 verrier.1111.i: "Czy [SCOPE.sCharacter('verrier_astronomer_scope').GetSheHe] znów przeszedł załamanie nerwowe?"
 verrier.1111.j: "Czy [SCOPE.sCharacter('verrier_astronomer_scope').GetSheHe] znowu zapomniał o świecach?"
 verrier.1112.t: "Zaginione Gwiazdy"
 verrier.1112.d: "Kilka dni temu nasz [concept_verrier_astronomer], [SCOPE.sCharacter('verrier_astronomer_scope').GetFullName], odkrył kilka nowych gwiazd. Niestety [SCOPE.sCharacter('verrier_astronomer_scope').GetSheHe] nie potrafi ich ponownie odnaleźć, ponieważ [SCOPE.sCharacter('verrier_astronomer_scope').GetHerHis] notatki na ich temat zaginęły. Nie wiemy, czy gwiazdy zniknęły, czy też [SCOPE.sCharacter('verrier_astronomer_scope').GetSheHe] zapomniał, gdzie [SCOPE.sCharacter('verrier_astronomer_scope').GetSheHe] je odkrył."
 verrier.1112.f: "Gdzie są te notatki? Wszędzie szukałem! W kuchni, w śmieciach, na biurku... Wszędzie!\nI gwiazdy też zniknęły! Jak mogło do tego dojść!"
 verrier.1112.g: "Oby [SCOPE.sCharacter('verrier_astronomer_scope').GetSheHe] ponownie odnalazł te gwiazdy!"
