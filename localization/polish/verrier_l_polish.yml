 je_verrier_venus_transit_1882_tt: "Dodaje #V Tranzyt Wenus w 1882 roku#! do Dziennika [GetPlayer.GetName]"
 verrier.308.t: "Tranzyt Wenus w 1874 roku"
 verrier.308.d: "Astronomowie przewidzieli tranzyt Wenus w rejonie Australii, Indonezji i Pacyfiku w #ORANGE 1874 roku#!. Środowisko naukowe [ROOT.GetCountry.GetNameNoFlag] domaga się możliwości obserwacji tego niezwykle rzadkiego zjawiska astronomicznego."
 verrier.308.f: "Tranzyt Wenus to przejście planety Wenus na tle tarczy Słońca. Zjawisko to występuje zaledwie cztery razy w ciągu około 243 lat. Historycznie dokładne pomiary takich przejść miały ogromne znaczenie dla wyznaczenia odległości między Ziemią a Słońcem (jednostki astronomicznej) i były przyczyną organizowania licznych wypraw oraz kampanii pomiarowych przez renomowane instytuty naukowe i wybitnych uczonych. Tranzyt Wenus w 1874 roku był stosunkowo niekorzystny dla prowadzenia pomiarów astronomicznych. Zjawisko pozostawało niewidoczne z niemal całej Europy. Długi czas trwania tranzytu można było zaobserwować jedynie z Azji, natomiast krótki — z Australii, wysp południowego Pacyfiku oraz południowej części Oceanu Indyjskiego (zwłaszcza z archipelagu Kerguelena). Mimo to zorganizowano około 60 wypraw."
 verrier.308.g: "Nie powinniśmy przegapić tej okazji."
 verrier.309.t: "Tranzyt Wenus w 1882 roku"
 verrier.309.d: "Astronomowie przewidzieli kolejny tranzyt Wenus, który nastąpi w #ORANGE 1882 roku#! i będzie widoczny z obszarów Ameryki Południowej, Ameryki Środkowej oraz północno-wschodniej części Ameryki Północnej. Środowisko naukowe [ROOT.GetCountry.GetNameNoFlag] domaga się możliwości obserwacji tego niezwykle rzadkiego zjawiska astronomicznego."
 verrier.309.f: "Tranzyt Wenus to przejście planety Wenus na tle tarczy Słońca. Zjawisko to występuje zaledwie cztery razy w ciągu około 243 lat. Historycznie dokładne pomiary takich przejść miały ogromne znaczenie dla wyznaczenia odległości między Ziemią a Słońcem (jednostki astronomicznej) i były przyczyną organizowania licznych wypraw oraz kampanii pomiarowych przez renomowane instytuty naukowe i wybitnych uczonych. Tranzyt Wenus w 1882 roku miał pewne zalety w porównaniu z tranzytem z 1874 roku, ponieważ był widoczny z niektórych łatwiej dostępnych regionów. Zjawisko można było zatem obserwować na całym kontynencie amerykańskim, z wyjątkiem północnej i północno-wschodniej części Ameryki Północnej."
 verrier.311.t: "Przygotowania do Tranzytu Wenus"
 verrier.311.d: "Zbliża się rzadkie zjawisko astronomiczne: planeta Wenus przejdzie na tle tarczy Słońca. Obserwatoria i rządy na całym świecie rozpoczynają przygotowania."
 verrier.311.f: "Datę wyznaczono z dokładnością co do sekundy. Teleskopy są pakowane. Zegary synchronizowane. Planeta Wenus przejdzie na tle tarczy Słońca. Astronomowie wierzą, że tranzyt umożliwi precyzyjne wyznaczenie jednostki astronomicznej, stanowiącej podstawową miarę odległości w Układzie Słonecznym. Powodzenie całego przedsięwzięcia zależy jednak wyłącznie od warunków obserwacji — miejsca, pogody i koordynacji działań."
 verrier.311.g: "Obserwujemy tranzyt z własnego kraju."
 verrier.311.h: "Wysyłamy wyprawę do jednego z naszych protektoratów."
 verrier.311.i: "Wysyłamy wyprawę do odległego kraju."
 verrier.311.j: "Powinniśmy to jeszcze raz przemyśleć."
 verrier.319.t: "Obce Spojrzenia Ku Niebu"
 verrier.319.d: "Na nasze terytorium przybyła wyprawa z [SCOPE.sCountry('verrier_venus_transit_leader').GetName], aby obserwować rzadkie zjawisko astronomiczne, jakim jest tranzyt Wenus."
 verrier.319.f: "Przybyli ze skrzyniami pełnymi soczewek, zegarów i map astronomicznych. Ich przedstawiciele spotkali się z władzami uniwersyteckimi, proponując przyjazną wymianę korespondencji oraz przekazanie informacji technicznych. Asystenci obserwatorium są zaciekawieni, a gazety zachowują neutralność, choć uważnie śledzą rozwój wydarzeń.\n\nW kilku resortach trwa debata nad konsekwencjami tej wizyty: współpraca naukowa — owszem, ale w grę wchodzą również wymiana danych, suwerenność w zakresie logistyki oraz prestiż na arenie międzynarodowej."
 verrier.319.g: "Niech nauka będzie naszym wspólnym językiem."
 verrier.321.t: "Burza nad Tranzytem"
 verrier.321.d: "Podczas rejsu w statek wyprawy uderzył gwałtowny sztorm. Wśród rozbijających się fal i miotanych wiatrem lin olinowania kilka skrzyń zostało porwanych z pokładu i pochłoniętych przez morze — w tym skrzynie z delikatnymi przyrządami do obserwacji tranzytu."
 verrier.321.f: "[ROOT.Var('verrier_astronomer_var').GetCharacter.GetFullName] kurczowo trzymał się relingu, gdy niebo zdawało się rozpadać na kawałki. Morze wzburzyło się niczym wróg, miotając linami i beczkami po pokładzie. Dwie skrzynie przesunęły się po pokładzie, zataczając złowieszczy łuk, po czym zniknęły w ciemności.\n\nPóźniej, gdy sztorm ucichł i zapanowała cisza, przystąpiono do oceny strat. Główny heliometr. Podwójna soczewka z Królewca. Kilka precyzyjnych chronometrów.\n\nDr. [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] stał pośród przemoczonych członków załogi i połamanych desek, wpatrując się w puste miejsce, w którym wcześniej znajdował się sprzęt. Mieli przyrządy zapasowe. Żaden z nich nie był jednak pozbawiony wad.\n\nA czas — podobnie jak Wenus — na nikogo nie czeka."
 verrier.321.g: "Kontynuujmy. Wciąż mamy wystarczająco dużo sprzętu, by działać dalej."
 verrier.322.t: "Nieoczekiwane Światła"
 verrier.322.d: "Podczas nocnej kalibracji pola gwiazdowego astronom wyprawy zauważył nietypowe ruchy oraz nieruchome punkty świetlne w miejscach, w których nie powinno ich być. Dalsze porównania z dostępnymi mapami nieba potwierdziły przypuszczenia: zespół mógł odkryć nowe, niezarejestrowane dotąd ciała niebieskie."
 verrier.322.f: "Statek dryfował pod aksamitnym niebem. Chmury rozstąpiły się kilka godzin wcześniej, pozostawiając po sobie tak niezwykłą przejrzystość nieba, że wydawała się wręcz nienaturalna. Dr. [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] ponownie spojrzał przez okular teleskopu. Tam — między Altairem a krawędzią siatki sekstantu — dostrzegł ruch. Zbyt powolny jak na kometę. Zbyt regularny, by był wynikiem błędu.\n\nNoc po nocy [ROOT.Var('verrier_astronomer_var').GetCharacter.GetSheHe] powracał do tego samego fragmentu nieba, sporządzając szkice, wykonując obliczenia i porównując wyniki. W końcu notatki [ROOT.Var('verrier_astronomer_var').GetCharacter.GetHerHis] potwierdziły odkrycie: niewielkie ciało planetarne. Być może nawet dwa. Dotąd nieskatalogowane.\n\nWenus mogła poczekać. Gwiazdy zdążyły już jednak zaoferować coś innego."
 verrier.322.g: "Niech wszyscy wiedzą, że niebiosa wciąż skrywają tajemnice."
 verrier.323.t: "Ogród Pośród Gwiazd"
 verrier.323.d: "Podczas przerwy w podróży członkowie wyprawy zapuścili się w głąb lądu, aby zbadać potencjalne wzniesienia nadające się do prowadzenia obserwacji astronomicznych. Zamiast tego natrafili na zagajnik nieznanych roślin, z których żadna nie figuruje w dostępnych opracowaniach botanicznych."
 verrier.323.f: "Wszystko zaczęło się od zapachu. Delikatnego, o ostrej cytrusowej nucie, unoszącego się znad paproci na skraju lasu. Dr. [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] podążył za nim przez gęste podszycie i dotarł na polanę, gdzie światło rozlewało się niczym woda.\n\nRosły tam rośliny o ciemnofioletowych łodygach, których kwiaty układały się w idealne spirale. Czerwony mech pokrywał kamienie o barwie obsydianu. Wysoko nad głowami kołysały się na wietrze kiście pnączy przypominające zwisające gwiazdy. Nikt nie potrafił rozpoznać tych roślin.\n\nJeden z młodszych asystentów wyszeptał: „Wygląda to tak, jakby niebo spadło na ziemię”.\n\nPrzybyli tu, by obserwować planetę Wenus. Lecz właśnie tutaj, w nieruchomym powietrzu i świetle przesączającym się przez korony drzew, odkryli cud zupełnie innego rodzaju."
 verrier.323.g: "Zbierz próbki i zabezpiecz je do dalszych badań."
 verrier.324.t: "Kamień Spoza Czasu"
 verrier.324.d: "Podczas poszukiwania wzniesienia odpowiedniego do prowadzenia obserwacji wyprawa natrafiła na miejsce o ogromnym znaczeniu geologicznym. Okoliczne skały wykazują struktury i inkluzje, jakie dotąd obserwowano niezwykle rzadko — o ile w ogóle."
 verrier.324.f: "Dr. [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] przesunął [ROOT.Var('verrier_astronomer_var').GetCharacter.GetHerHis] dłonią po warstwowej powierzchni wychodni skalnej. Skała delikatnie połyskiwała w porannym świetle, poprzecinana żyłkami o metalicznym blasku. Ciemnozielone smugi wiły się wokół pomarańczowych kryształowych rdzeni, tworząc wzór, który wyglądał niemal na celowo uformowany.\n\nNieopodal inna płyta skalna odsłoniła skamieniały pęcherz — pusty w środku, lecz wciąż nienaruszony. Jeden z geologów uczestniczących w wyprawie zasugerował pochodzenie wulkaniczne. Inny pokręcił głową: „To starsze niż cokolwiek, co dotąd widziałem”.\n\nPrzyrządy, które ze sobą zabrali, służyły do obserwacji nieba. Tymczasem tutaj, w skale pod ich stopami, krył się fragment pradawnej pamięci samej Ziemi."
 verrier.324.g: "To odkrycie stanowi część historii samej Ziemi."
 verrier.325.t: "Przeszkody pod Niebem"
 verrier.325.d: "Wyprawa dotarła do portu docelowego, jednak władze celne odmawiają natychmiastowej odprawy. Kilka skrzyń ze sprzętem naukowym zatrzymano do kontroli, a urzędnicy żądają dodatkowych dokumentów, których wcześniej nigdy nie wymagano."
 verrier.325.f: "Dr. [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] stał obok wykazu ładunku, zaciskając zęby. Soczewki rtęciowe, precyzyjne zegary, obudowy z polerowanego mosiądzu — wszystko to leżało bezużytecznie w magazynie za zamkniętą bramą, czekając na podpisy i pieczęcie.\n\nUrzędnik celny był uprzejmy, lecz stanowczy: „Niezależnie od tego, czy służą celom naukowym, wszystkie zagraniczne przyrządy muszą zostać zgłoszone, skontrolowane i oclone, chyba że umowa międzynarodowa przewiduje zwolnienie z cła”.\n\nNie było czasu na zawieranie umów.\n\nNa zewnątrz słońce wciąż wschodziło. A Wenus nie zamierzała czekać na biurokrację."
 verrier.325.g: "Zapłać opłatę i przyspiesz odprawę celną."
 verrier.340.t: "Obserwatorium Gotowe do Obserwacji Tranzytu Wenus"
 verrier.340.d: "Po tygodniach przygotowań stanowisko do obserwacji tranzytu Wenus jest gotowe. Przyrządy zostały skalibrowane. Mapy astronomiczne sprawdzone. Jedyną niewiadomą pozostaje teraz pogoda."
 verrier.340.f: "Kopuła wznosiła się niczym latarnia morska z mosiądzu i cichej determinacji. Niezależnie od tego, czy została wzniesiona z kamienia na ojczystej ziemi, czy z płótna i nitów na obcym polu, mieściła teraz w sobie pełną napięcia ciszę oczekiwania. Wewnątrz heliometr połyskiwał w blasku lamp. Tryby obracały się z ledwie słyszalnym szelestem. Stopery cykały w oczekiwaniu. Na zewnątrz asystenci ścierali kurz z soczewek. Nawet powietrze zdawało się wstrzymywać oddech. Dr. [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] stał w progu i dotknął go dłonią. Przez wiele miesięcy wszystko zmierzało ku tej chwili. Teraz nie pozostało już nic do zbudowania, trzeba było jedynie czekać. Ponad nimi, gdzieś na niewidocznym niebie, Wenus podążała swoją drogą."
 verrier.340.g: "Precyzja zaczyna się od spokojnych dłoni."
 verrier.341.t: "Cicha Regulacja"
 verrier.341.d: "Dr. [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] zaproponował niewielką, lecz istotną modyfikację wewnętrznego stabilizatora głównego teleskopu. Zmiana ta mogłaby ograniczyć drgania wewnętrzne i poprawić ostrość obrazu w chwili kontaktu."
 verrier.341.f: "Wydarzyło się to nie w kopule obserwatorium, lecz w namiocie warsztatowym stojącym za nią. Dr. [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] studiował właśnie mapy astronomiczne, gdy podszedł do niego Dr. [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName], trzymając w dłoni poplamiony smarem notatnik. Ponownie obliczone napięcie elementu amortyzującego. Udoskonalona podpora wewnętrznego mosiężnego pierścienia.\n\nPozostali słuchali z pełnym szacunku sceptycyzmem — dopóki próby nie potwierdziły skuteczności zmian: obraz stał się stabilniejszy o ułamki stopnia. Wystarczająco, by zatrzeć granicę między rozmyciem a wyrazistością."
 verrier.341.g: "Niewielka zmiana, wielka precyzja."
 verrier.342.t: "Równanie Precyzji"
 verrier.342.d: "Niedawny przełom w teorii elektromagnetyzmu umożliwił zastosowanie nowej metody filtrowania optycznego podczas obserwacji teleskopowych. Teraz można lepiej uwzględniać zakłócenia wynikające z rozpraszania światła w atmosferze, co pozwala uzyskać wyraźniejsze dane obserwacyjne."
 verrier.342.f: "Pomysł nie narodził się ani pod kopułą obserwatorium, ani przy warsztacie szlifierza soczewek, lecz na kartce papieru. Polegał na udoskonaleniu równań falowych — opisujących zachowanie światła nie tylko jako cząstek czy promieni, lecz także jako oscylującego pola. Dzięki temu można było przewidzieć nowy model interferencji i zastosować odpowiednią korektę. Filtry przycięto na nowo. Skorygowano czasy ekspozycji. Inżynierowie ponownie przeanalizowali swoje wątpliwości.\n\nGdy Dr. [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] spojrzał tej nocy przez soczewkę testową, gwiazdy przestały drżeć. Trwały nieruchomo — wyraźne, zimne, rzeczywiste. Niebo przestało się trząść."
 verrier.342.g: "Matematyka wyostrza spojrzenie."
 verrier.351.t: "Tranzyt w 1874 roku"
 verrier.351.d: "Na różnych kontynentach i oceanach, od Jokohamy po Reunion, od Wysp Kerguelena po Pekin, astronomowie obserwowali, jak planeta Wenus przechodzi na tle tarczy Słońca. Tranzyt w 1874 roku dobiegł końca — a wiele zespołów donosi o pomyślnych obserwacjach."
 verrier.351.f: "Przybywali parowcami, na grzbietach wielbłądów, koleją i pieszo. Inżynierowie, botanicy, kartografowie. Budowali obserwatoria w dżunglach i na pustyniach. Badali pogodę, mierzyli czas przemieszczania się cieni, polerowali soczewki tak długo, aż drżały im w dłoniach.\n\nI przez sześć godzin, 9 grudnia 1874 roku, obserwowali, jak czarna kropka przesuwa się po tarczy Słońca.\n\nWenus pojawiła się niczym szept i zniknęła niczym tajemnica. Pomiary nie były doskonałe, ale wystarczające. Można było rozpocząć triangulację. Po raz pierwszy ludzkość mogła poznać rzeczywiste rozmiary swojego Układu Słonecznego — nie poprzez mity czy metafory, lecz dzięki liczbom wyznaczonym przez cień. Dr. [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] zamknął [ROOT.Var('verrier_astronomer_var').GetCharacter.GetHerHis] notatnik i odetchnął z ulgą: dokonało się."
 verrier.351.g: "To piękne."
 verrier.352.t: "Tranzyt w 1882 roku"
 verrier.352.d: "6 grudnia 1882 roku planeta Wenus ponownie przeszła na tle tarczy Słońca. Po raz ostatni w tym stuleciu obserwatorzy na całym świecie skierowali swoje przyrządy ku niebu — i uchwycili czarną tarczę Wenus przemieszczającą się na tle Słońca."
 verrier.352.f: "Tym razem statki wypłynęły wcześniej. Obserwatoria były solidniejsze. Zegary dokładniejsze. Doświadczenia zdobyte w 1874 roku kierowały każdym ruchem dłoni, każdą obserwacją cienia i każdym obliczeniem.\n\nOd New Jersey po Patagonię, od Meksyku po Australię, świat zamarł, by obserwować niewielką kropkę na tarczy Słońca.\n\nDr. [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] wyregulował ostatni filtr. Ukazała się tarcza Wenus, powoli przesuwająca się na tle oślepiającej bieli. Nie było wiwatów, jedynie szelest piór, trzask migawek i ciche westchnienia triumfu. Minie kolejnych 121 lat, zanim Wenus powróci. Lecz tutaj, w tej właśnie chwili, zmierzono sam czas."
 verrier.352.g: "Nie doczekamy następnego tranzytu."
 verrier.353.t: "Przez Zasłony Światła"
 verrier.353.d: "W miarę zbliżania się długo wyczekiwanej chwili warunki pogodowe zaczynają się pogarszać. Nadciągają chmury — nie na tyle gęste, by całkowicie przesłonić niebo, lecz wystarczające, by pogorszyć widoczność i utrudnić precyzyjne pomiary czasu."
 verrier.353.f: "Niebo nie zasnuło się całkowicie, lecz przestało być przewidywalne. Warstwy dryfujących chmur przesuwały się przed Słońcem niczym gaza. Światło przygasało i rozbłyskiwało w nieregularnych odstępach. Każda soczewka wymagała ciągłej regulacji, a każdy asystent z trudem łapał oddech.\n\nDr. [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] nie odrywał [ROOT.Var('verrier_astronomer_var').GetCharacter.GetHerHis] oka od filtra. Wyłoniła się sylwetka Wenus — niewyraźna, zniekształcona przez załamanie światła, tańcząca pośród obłoków pary i astronomicznych obliczeń.\n\nNie był to wyraźny łuk. Nie była to podręcznikowa obserwacja. Ale uzyskano dane. Dane zdobyte z wielkim trudem pod kapryśnym niebem."
 verrier.353.g: "Jeśli niebiosa dają nam jedynie fragmenty, musimy połączyć je w całość."
 verrier.354.t: "Ruchomy Cień"
 verrier.354.d: "Podczas tranzytu Wenus zespół obserwatorów zarejestrował nie tylko precyzyjne dane, lecz także obrazy. Wykonano kolejno dziesiątki naświetleń płyt fotograficznych, a uzyskane obrazy połączono później w ruchomą sekwencję. Po raz pierwszy w historii tranzyt planety został zarejestrowany na filmie."
 verrier.354.f: "Obraz migocze. Drży. Ale się porusza. Na serii odpowiednio przygotowanych płyt fotograficznych Wenus pojawia się przy krawędzi tarczy Słońca, a następnie przesuwa się po niej niczym idealnie czarna kropka. To nie tylko obliczenia ani szkic — to ruch. Utrwalony w czasie. Dr. [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] stał w ciemni fotograficznej z uniesioną latarnią, obserwując krótką sekwencję odtwarzaną raz za razem. Sześć godzin pomiarów zamkniętych w kilku sekundach zachwytu. Astronomowie bili brawo. Wiedzieli, że dokonali czegoś nowego. Sprawili, że niebiosa ożyły w ruchu."
 verrier.354.g: "Przeanalizuj klatki, aby udoskonalić modele ruchu planet."
 verrier.355.t: "Marsz Wenus"
 verrier.355.d: "Zainspirowany powszechnym entuzjazmem towarzyszącym tranzytowi Wenus w 1882 roku kompozytor [ROOT.Var('elgar_composer_var').GetCharacter.GetFullName] skomponował nowy utwór ceremonialny. Marsz, którego premiera odbyła się przed liczną publicznością, oddaje zarówno majestat tego wydarzenia, jak i rytm nowego stulecia nauki."
 verrier.355.f: "Rok po tranzycie Wenus w 1882 roku John Philip Sousa otrzymał zlecenie skomponowania marsza uroczystego na odsłonięcie brązowego pomnika amerykańskiego fizyka Josepha Henry’ego, który zmarł w 1878 roku. Sousa, będący masonem, fascynował się mistycznymi właściwościami, jakie członkowie masonerii przypisywali zjawiskom przyrodniczym. Utwór nie zdobył popularności za życia Sousy. Przez wiele lat pozostawał niewykonywany, ponieważ rękopiśmienne kopie partytury sporządzone przez kompozytora zostały zniszczone podczas powodzi."
 verrier.355.g: "Niektóre utwory muzyczne powstają dla historii, a nie dla tłumów."
 verrier_venus_transit_modifier: "Zaobserwowano Tranzyt Wenus"
 building_verrier_observatory_throughput_add: "[concept_throughput] budynku Obserwatorium"
 building_verrier_observatory_throughput_add_desc: "Zwiększa [concept_throughput] Obserwatorium."
 verrier.161.t: "Wyrwane z Ziemi"
 verrier.161.d: "Dr. [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] przedstawił nowatorską teorię, według której Księżyc był niegdyś częścią Ziemi, lecz oddzielił się od niej wskutek szybkiego obrotu planety i działania sił pływowych we wczesnym okresie jej historii."
 verrier.161.f: "Wbrew powszechnie akceptowanemu modelowi Kanta-Laplace’a, według którego Ziemia i Księżyc powstały jednocześnie z wirującego obłoku gazu, Dr. [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] sugeruje, że Księżyc został wyrzucony z zewnętrznych warstw Ziemi w okresie jej niezwykle szybkiego obrotu. Teoria opiera się na dynamice sił pływowych i zakłada, że całkowity moment pędu układu Ziemia–Księżyc pozostaje zachowany, co byłoby zgodne z takim przebiegiem wydarzeń. Stosunkowo niska gęstość Księżyca oraz jego skład zbliżony do składu zewnętrznych warstw Ziemi przemawiają za hipotezą, że powstał on z materii pochodzącej z okolic jej powierzchni. Choć brakuje próbek materiału, które mogłyby potwierdzić tę teorię, model ten dostarcza mechanicznego wyjaśnienia ścisłego związku między orbitą Księżyca a stopniowym spowalnianiem obrotu Ziemi."
 verrier.161.g: "Fascynujące."
 verrier.162.t: "Schwytany Księżyc"
 verrier.162.d: "Dr. [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] wysunął śmiałą hipotezę, według której Księżyc nie powstał razem z Ziemią, lecz został przechwycony przez jej grawitację po uformowaniu się w innym miejscu Układu Słonecznego."
 verrier.162.f: "Odchodząc od obecnych modeli zakładających wspólne powstanie Ziemi i Księżyca, Dr. [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] twierdzi, że Księżyc był niegdyś niezależnym ciałem niebieskim. Według obliczeń [ROOT.Var('verrier_astronomer_var').GetCharacter.GetHerHis] siły grawitacyjne — być może wspomagane przez opór atmosferyczny we wczesnym okresie historii Ziemi lub oddziaływania z trzecim ciałem niebieskim — mogły przechwycić Księżyc i wprowadzić go na orbitę okołoziemską długo po uformowaniu się obu ciał. Wyjaśniałoby to nachylenie orbity Księżyca oraz specyfikę jego ruchu, choć krytycy wskazują, że bez spełnienia ściśle określonych warunków takie przechwycenie byłoby niestabilne z punktu widzenia dynamiki orbitalnej. Jak dotąd nie udało się wskazać mechanizmu, który wyjaśniałby niezbędną utratę energii. Mimo to teoria wzbudziła zainteresowanie ze względu na śmiałe zakwestionowanie tradycyjnych poglądów."
 verrier.162.g: "To tylko hipoteza, ale warta zbadania."
 verrier.163.t: "Zderzenie u Zarania Dziejów"
 verrier.163.d: "Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] przedstawił śmiałą hipotezę geologiczną, według której Księżyc powstał z materii ziemskiej wyrzuconej w wyniku gwałtownego zderzenia we wczesnym okresie historii Ziemi."
 verrier.163.f: "Sfrustrowany nierozwiązanymi sprzecznościami w dominujących teoriach pochodzenia Księżyca, Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] proponuje radykalnie odmienne wyjaśnienie. We wczesnym okresie formowania się Ziemi masywne ciało niebieskie — ani niewielkie, ani rozmiarów planety, lecz dostatecznie duże — uderzyło w nią pod kątem. Powstałe w wyniku zderzenia szczątki materii, pochodzące głównie z zewnętrznych warstw Ziemi, znalazły się na orbicie i stopniowo połączyły się, tworząc Księżyc. Scenariusz ten jest zgodny z mniejszą gęstością Księżyca, jego pozornym podobieństwem do ziemskiego płaszcza oraz nietypowym momentem pędu układu Ziemia–Księżyc. Hipoteza pozostaje spekulatywna i trudna do udowodnienia, lecz wyróżnia się połączeniem rozumowania geologicznego z mechaniką nieba — a także odwagą przedstawienia formowania się planet jako procesu gwałtownych zderzeń, a nie stopniowego, harmonijnego rozwoju."
 verrier.163.g: "Ta teoria może zrewolucjonizować naukę o planetach."
