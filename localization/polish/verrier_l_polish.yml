 verrier.161.t: "Torn from the Earth"
 verrier.161.d: "Dr. [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] has proposed a novel theory: that the Moon was once part of the Earth, separated by rapid rotation and tidal forces in the planet's early history."
 verrier.161.f: "At odds with the widely accepted Kant-Laplace model — which holds that Earth and Moon formed simultaneously from a rotating gas cloud — Dr. [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] suggests that the Moon was expelled from the Earth's outer layers due to a period of extreme rotational velocity. The theory is based on tidal dynamics, suggesting that the Earth-Moon system conserves angular momentum that would be consistent with such an event. The Moon's relatively low density and similar composition to Earth's outer layers support the idea that it originated from near the surface. Though lacking physical samples, the model offers a mechanical explanation for why the Moon's orbit and Earth's slowing rotation are so closely linked."
 verrier.161.g: "Fascinating."
 verrier.162.t: "A Captive Moon"
 verrier.162.d: "Dr. [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] has put forward a bold hypothesis: that the Moon did not form with the Earth, but was captured by its gravity after forming elsewhere in the solar system."
 verrier.162.f: "In a departure from current models of co-formation, Dr. [ROOT.Var('verrier_astronomer_var').GetCharacter.GetLastName] argues that the Moon was once an independent celestial body. According to [ROOT.Var('verrier_astronomer_var').GetCharacter.GetHerHis] calculations, gravitational forces — possibly aided by early atmospheric drag or third-body interactions — could have drawn the Moon into Earth orbit long after both objects had already formed. This would explain the Moon's inclined orbit and distinct motion, though critics point out that such a capture would be dynamically unstable without precise conditions. No mechanism yet accounts for the required loss of energy. Nonetheless, the theory has drawn interest for its bold challenge to traditional views."
 verrier.162.g: "Speculative, but worth examining."
 verrier.163.t: "Collision at the Dawn of Time"
 verrier.163.d: "Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] has presented a bold geological hypothesis: the Moon formed from terrestrial material ejected by a violent impact in Earth's earliest history."
 verrier.163.f: "Frustrated by the unresolved contradictions in prevailing lunar origin theories, Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] proposes a dramatic alternative. In Earth's formative phase, a massive celestial body — neither tiny nor planetary in scale, but substantial enough — struck the planet at an oblique angle. The resulting debris, largely from Earth's outer layers, entered orbit and gradually coalesced into the Moon. This scenario aligns with the Moon's lower density, its apparent similarity to Earth's mantle, and the unusual momentum of the Earth-Moon system. The idea remains speculative and difficult to prove, but it is notable for bridging geological reasoning with celestial mechanics — and for daring to treat planetary formation as a process of impact, not gradual harmony."
 verrier.163.g: "This theory could reshape planetary science."
