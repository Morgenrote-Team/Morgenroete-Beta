 verrier.55.t: "Ciemna Strona"
 verrier.55.d: "Dzięki szczęściu i umiejętnościom nasz Astronom zdołał uchwycić na zdjęciu Librację Księżyca!"
 verrier.55.f: "To subtelne, niemal niezauważalne zjawisko, ale Księżyc nie jest zwrócony ku Ziemi zawsze dokładnie tą samą stroną. Nieregularności jego orbity wystarczają, by odsłonić maleńki skrawek niewidocznej zwykle półkuli — subtelne wskazówki pozwalające zgłębić najpilniej strzeżone tajemnice Księżyca. Sfotografowanie takich widoków, które w przeciwnym razie mogłyby pozostać niezauważone, wymaga tyleż szczęścia, co umiejętności. Oznacza bowiem długie godziny spędzone samotnie z aparatem i nieustanne modlitwy o uchwycenie właściwej chwili na idealne zdjęcie.\n\nJeśli jednak wszystko się powiedzie, można zobaczyć fragment odwiecznego towarzysza Ziemi, którego nikt dotąd naprawdę nie oglądał — nigdy w całej historii."
 verrier.55.g: "Pewnego dnia zobaczymy całą niewidoczną stronę Księżyca."
