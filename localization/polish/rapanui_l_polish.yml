 je_rapanui_northwest_expedition: "Wyprawa [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetLastNameNoFormatting]"
 je_rapanui_northwest_expedition_reason: "Wyprawa [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetLastNameNoFormatting] poszukuje Przejścia Północno-Zachodniego w Arktyce. Rząd spodziewa się, że przedsięwzięcie to potrwa kilka lat. Każdego lata wyprawa będzie podejmować próbę przedarcia się przez lody, a każdej zimy załoga będzie zimować w Wiecznych Lodach. Jeśli po czterech latach nie uda się odnaleźć przejścia, wyprawa zostanie uznana za zaginioną. To, czy uda się pokonać Przejście Północno-Zachodnie, czy zaginiona wyprawa powróci, czy też cała misja zakończy się narodową katastrofą, zależy w dużej mierze od jej #V Szansy na Sukces#!. #V Szansa na Sukces#! wynosząca co najmniej #G 80#! gwarantuje przepłynięcie przez Przejście Północno-Zachodnie. #V Szansa na Sukces#! wynosząca #YELLOW 60#! oznacza, że wyprawie nie uda się odnaleźć przejścia, ale przynajmniej przywiezie ona nową wiedzę. Jeśli #V Szansa na Sukces#! wynosi #R mniej niż 30#!, należy spodziewać się narodowej tragedii.\n\nObecnie nasza #V Szansa na Sukces#! wynosi #ORANGE [ROOT.Var('rapanui_northwest_success').GetValue]#!."
 je_rapanui_northwest_expedition_fail: "Wyprawa zakończy się niepowodzeniem, jeśli w ciągu czterech lat nie uda się przedrzeć przez Przejście Północno-Zachodnie."
 je_rapanui_northwest_expedition_success: "Przy #V Szansie na Sukces#! wynoszącej co najmniej #G 80#! możliwe jest przedarcie się przez Przejście Północno-Zachodnie, pod warunkiem że wartość ta utrzyma się przez rok."
 je_rapanui_northwest_expedition_invalid: "Jeśli inne państwo odkryje Przejście Północno-Zachodnie przed nami, załoga powróci, niczego nie osiągnąwszy."
 rapanui.401.t: "Przejście Północno-Zachodnie: Szansa na Sukces"
 rapanui.401.d: "Rozpoczęły się przygotowania do wyprawy. Okręt flagowy „[SCOPE.sCharacter('rapanui_ship_scope').GetLastNameNoFormatting]” jest już gotowy. Naukowcy i marynarze po raz pierwszy obliczają nasze aktualne szanse na sukces."
 rapanui.401.f: "Szansa na pomyślne i bezpieczne przedarcie się przez Przejście Północno-Zachodnie zależy od kilku czynników. Wartość podstawowa, ustalana podczas przygotowań, jest sumą opracowanych technologii morskich. Postępy w dziedzinie konserwowania żywności – puszkowania próżniowego i pasteryzacji – również mają bardzo korzystny wpływ. Ukończenie Badań Oceanograficznych podczas Wyprawy na Pacyfik lub posiadanie Awangardowej Marynarki Wojennej zapewnia dodatkowe premie. Obecność naukowców, takich jak inżynierowie i astronomowie, pozwala zwiększyć tę wartość początkową. Podczas podróży losowe wydarzenia, takie jak zmiany pogody, mogą wpływać na Szansę na Sukces – zarówno pozytywnie, jak i negatywnie."
 rapanui.401.g: "Odkryjemy Przejście Północno-Zachodnie – ku chwale [ROOT.GetCountry.GetNameNoFormatting]!"
 rapanui.401.h: "Po dokładniejszym przyjrzeniu się okazuje się, że to przedsięwzięcie jest znacznie bardziej niebezpieczne, niż początkowo sądzono."
 rapanui.402.t: "Sprzeciw!"
 rapanui.402.d: "[SCOPE.sCharacter('rapanui_ig_leader').GetFullName], którego partia wchodzi w skład obecnej koalicji rządowej, stanowczo sprzeciwił się wyprawie w poszukiwaniu Przejścia Północno-Zachodniego. [SCOPE.sCharacter('rapanui_ig_leader').GetSheHe] nazywa ją „misją samobójczą”."
 rapanui.402.f: "Wczoraj przedstawiciele partii [SCOPE.sCharacter('rapanui_ig_leader').GetLastName] ogłosili protest przeciwko przedsięwzięciu, które, jak twierdzą, zorganizowano za ich plecami. Uważają wyprawę przez Arktykę za kosztowną, bezcelową i niezwykle ryzykowną. Ich zdaniem pieniądze te można byłoby znacznie lepiej wykorzystać na inne cele. Wyprawa naraziłaby również życie ważnych osobistości, które w przeciwnym razie mogłyby służyć naszemu krajowi."
 rapanui.402.g: "Będą musieli się z tym pogodzić."
 rapanui.402.h: "Przyznaj im ustępstwa polityczne."
 rapanui.403.t: "Przejście Północno-Zachodnie: Dowódca Wyprawy"
 rapanui.403.d: "Wyprawa do Arktyki jest jednym z najniebezpieczniejszych przedsięwzięć morskich. Potrzeba dobrego kapitana, który podejmie to wyzwanie i doprowadzi wyprawę do szczęśliwego zakończenia."
 rapanui.403.f: "Dowodzenie tą wyprawą należy powierzać wyłącznie doświadczonym kapitanom: dobrzy dowódcy zwiększają jej szanse na sukces. Pomagają w tym cechy takie jak #YELLOW Doświadczony lub Ekspert w Dowodzeniu Flotą#!. #YELLOW Odkrywcy#! są szczególnie predysponowani do tego zadania, a jeśli kapitan #YELLOW opłynął już świat#!, uznaje się go za najlepszego kandydata. Ale uwaga: jeśli wyprawa zakończy się katastrofą, istnieje ryzyko, że kapitan również pójdzie na dno wraz ze statkiem..."
 rapanui.403.g: "[SCOPE.sCharacter('rapanui_northwest_expedition_leader_1').GetFullName]"
 rapanui.403.h: "[SCOPE.sCharacter('rapanui_northwest_expedition_leader_2').GetFullName]"
 rapanui.403.i: "[SCOPE.sCharacter('rapanui_northwest_expedition_leader_3').GetFullName]"
 rapanui.404.t: "Kapelani Okrętowi"
 rapanui.404.d: "Zbliżająca się wyprawa morska w nieznane oznacza długi okres odosobnienia. [SCOPE.sCharacter('rapanui_ig_leader').GetFullName] zaproponował wykorzystanie [SCOPE.sCharacter('rapanui_ig_leader').GetHerHis] kontaktów do mianowania kapelanów okrętowych, którzy podniosą morale załogi."
 rapanui.404.f: "„To sprawa czysto duszpasterska, chodzi jedynie o opiekę nad zagubionymi duszami na morzu. Inuici? Skąd przyszło wam do głowy, że chcemy nawracać Inuitów? To haniebne oskarżenia!\nOczywiście wcześniej uprzejmie ich zapytamy”."
 rapanui.404.g: "Marynarze potrzebują kapelanów podczas tak niebezpiecznej wyprawy."
 rapanui.404.h: "To technologia i umiejętności, a nie Bóg, ocalą nas na morzu."
 rapanui.405.t: "Inżynier Ulepsza Statki Wyprawy"
 rapanui.405.d: "[SCOPE.sCharacter('rapanui_engineer_scope').GetFullName] zaoferował wykorzystanie [SCOPE.sCharacter('rapanui_engineer_scope').GetHerHis] wiedzy technicznej do modernizacji naszej floty przed wyprawą na Morze Arktyczne."
 rapanui.405.f: "Przed wyruszeniem niesławnej wyprawy Franklina w poszukiwaniu Przejścia Północno-Zachodniego zmodernizowano okręty „Erebus” i „Terror”, wzmacniając między innymi ich dzioby i burty dodatkowymi stalowymi elementami, które miały zapobiec zmiażdżeniu kadłubów pod naporem lodu pakowego. Aby „Erebus” i „Terror” mogły manewrować wśród dryfującego lodu nawet podczas bezwietrznej pogody lub przy niekorzystnym kierunku wiatru, na każdym z okrętów zainstalowano ważącą około 15 ton maszynę parową, napędzającą specjalnie zaprojektowaną śrubę o średnicy dwóch metrów. Były to pierwsze okręty Królewskiej Marynarki Wojennej wyposażone w napęd parowy i śruby napędowe. Śruby i stery zamontowano w taki sposób, aby w razie utknięcia w lodzie pakowym można je było zdemontować i zabezpieczyć przed uszkodzeniem. Z perspektywy czasu okazało się jednak, że ten dodatkowy napęd był zdecydowanie zbyt słaby."
 rapanui.405.g: "Postęp przełamie lody."
 rapanui.406.t: "Astronom oferuje badania meteorologiczne"
 rapanui.406.d: "[SCOPE.sCharacter('rapanui_astronomer_scope').GetFullName] zaoferował wykorzystanie [SCOPE.sCharacter('rapanui_astronomer_scope').GetHerHis] wiedzy meteorologicznej do przygotowania dokładniejszej prognozy pogody i wyznaczenia dogodnego terminu wypłynięcia."
 rapanui.406.f: "„Korzystałem ze stacji meteorologicznej obserwatorium i po wielu tygodniach eksperymentów, skrupulatnych obserwacji oraz badań prowadzonych do późnych godzin nocnych doszedłem do wniosku, że niska temperatura raczej nie sprzyja powodzeniu tej wyprawy”."
 rapanui.406.g: "Nauka pomaga nam odnieść triumf."
 rapanui.407.t: "Rozpoczyna się Wyprawa [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetLastNameNoFormatting]"
 rapanui.407.d: "Okręty przeznaczone do wyprawy w poszukiwaniu Przejścia Północno-Zachodniego są gotowe. Potoczna nazwa #YELLOW Wyprawa [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetLastNameNoFormatting]#!, pochodząca od nazwiska jej dowódcy [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetFullName], zdążyła się już przyjąć."
 rapanui.407.f: "W pierwszej połowie XIX wieku poszczególne odcinki Przejścia Północno-Zachodniego były badane przez liczne wyprawy, w tym ekspedycje Johna Rossa, Elishy Kenta Kane’a, Williama Edwarda Parry’ego i Jamesa Clarka Rossa. Organizowano również wyprawy lądowe pod dowództwem Johna Franklina, George’a Backa, Petera Warrena Dease’a, Thomasa Simpsona i Johna Rae. W 1826 roku Frederick William Beechey zbadał północne wybrzeże Alaski, odkrywając przylądek Barrow. W 1845 roku bogato wyposażona wyprawa złożona z dwóch okrętów, dowodzona przez sir Johna Franklina, wyruszyła do kanadyjskiej Arktyki, aby sporządzić mapy ostatnich niezbadanych odcinków Przejścia Północno-Zachodniego. Panował wielki optymizm, ponieważ szacowano, że do zbadania pozostało mniej niż 500 km (310 mil) wybrzeża arktycznego lądu stałego. Gdy okręty nie powróciły, wyprawy ratunkowe i grupy poszukiwawcze rozpoczęły badania kanadyjskiej Arktyki, co doprowadziło do szczegółowego skartografowania regionu oraz wytyczenia potencjalnej drogi przez Przejście Północno-Zachodnie."
 rapanui.407.g: "Powodzenia!"
 rapanui.410.t: "Amundsen Pokonuje Przejście Północno-Zachodnie"
 rapanui.410.d: "Norweski poszukiwacz przygód Roald Amundsen jako pierwszy człowiek przepłynął statkiem Przejście Północno-Zachodnie. Wyprawa trwała trzy lata. To wielki dzień dla naszego kraju!"
 rapanui.410.f: "W latach 1903–1906 Amundsen zdołał przepłynąć Przejście Północno-Zachodnie od Atlantyku do Pacyfiku na pokładzie drewnianego statku „Gjøa”, z sześcioosobową załogą. Wybrana trasa, prowadząca z Zatoki Baffina przez Cieśninę Lancastera i Cieśninę Peela, a następnie przez Cieśninę Jamesa Rossa i Cieśninę Simpsona, nie nadawała się jednak do regularnej żeglugi, ponieważ miejscami głębokość wody wynosiła mniej niż metr. Nie umniejsza to jednak osiągnięcia żeglarskiego i odkrywczego sześciu Norwegów oraz Duńczyka Godfreda Hansena, którzy jako pierwsi pokonali Przejście Północno-Zachodnie ze wschodu na zachód, czego przez ponad cztery stulecia bezskutecznie próbowały dokonać liczne wyprawy. Podczas podróży członkowie wyprawy Amundsena odnaleźli szczątki szkieletów oraz wyposażenie pochodzące z zaginionej wyprawy Johna Franklina."
 rapanui.410.g: "Chwała Norwegii!"
 rapanui.411.t: "Przejście Północno-Zachodnie Odkryte!"
 rapanui.411.d: "#YELLOW Wyprawa [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetLastNameNoFormatting]#! zdołała przedrzeć się przez lody Oceanu Arktycznego na północ od Kanady, dowodząc tym samym, że ten szlak morski nie stanowi przeszkody nie do pokonania dla postępu. [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetFullName] jest świętowany jako bohater wyprawy!"
 rapanui.411.f: "Wbrew nadziejom pokładanym w teoretycznych przewidywaniach pokonanie Przejścia Północno-Zachodniego nie doprowadziło do otwarcia nowego, dochodowego szlaku handlowego. Żegluga przez gruby lód była na to zdecydowanie zbyt ryzykowna. Konieczność przezimowania mogła dodatkowo opóźnić przeprawę. Mimo to odkrycie stanowiło kamień milowy. Sporządzono mapy nieznanych dotąd obszarów, a wyprawy na biegun północny czy południowy przestały wydawać się niemożliwe. Poszerzono wiedzę z zakresu żeglugi, kartografii, meteorologii, geomagnetyzmu i biologii. Dla niektórych odważnych poszukiwaczy przygód region ten przestał być terra incognita."
 rapanui.411.g: "Ku chwale [ROOT.GetCountry.GetNameNoFormatting]!"
 rapanui.412.t: "Zaginiona Wyprawa [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetLastNameNoFormatting]"
 rapanui.412.d: "Minęły już około cztery lata, odkąd otrzymaliśmy ostatnie wieści o #YELLOW Wyprawie [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetLastNameNoFormatting]#!. Admiralicja oficjalnie uznała więc wyprawę za zaginioną. Powszechnie uważa się, że załoga i okręt utknęły w lodzie pakowym."
 rapanui.412.f: "Uznanie wyprawy za zaginioną nie musi oznaczać najgorszego możliwego scenariusza. Pewne jest jednak, że jej główny cel, czyli odkrycie i pokonanie Przejścia Północno-Zachodniego, nie został osiągnięty. Los załogi to zupełnie inna sprawa. Jeśli #V Szansa na Sukces#! wyprawy nie była zbyt niska, wciąż istnieje nadzieja, że nie wszystko stracone."
 rapanui.412.g: "To niedobre wieści."
 rapanui.413.t: "Zaginiona Wyprawa Powraca!"
 rapanui.413.d: "Ku radosnemu zaskoczeniu wszystkich mieszkańców [ROOT.GetCountry.GetNameNoFormatting] #YELLOW Wyprawa [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetLastNameNoFormatting]#! powróciła. Wśród członków załogi było kilka ofiar śmiertelnych, a okręt znajduje się w złym stanie, jednak wyprawa przywiozła cenną wiedzę naukową."
 rapanui.413.f: "Arktyczna Wyprawa McClure’a, będąca jedną z wielu prób odnalezienia zaginionej wyprawy Franklina, zapisała się w historii jako pierwsza, której udało się odkryć i pokonać Przejście Północno-Zachodnie, częściowo statkiem, a częściowo na saniach. Jednak właśnie z tego powodu wątpliwe jest, czy można uznać to osiągnięcie za rzeczywiste przepłynięcie całego przejścia. Dopiero Roald Amundsen dokonał pierwszego prawdziwego przepłynięcia Przejścia Północno-Zachodniego w latach 1903–1905."
 rapanui.413.g: "Co za ulga!"
 rapanui.414.t: "Członkowie Wyprawy Powracają"
 rapanui.414.d: "Nieliczni ocalali członkowie #YELLOW Wyprawy [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetLastNameNoFormatting]#! dotarli kilka dni temu do zamieszkanych obszarów Kanady. Wychudzeni rozbitkowie wyjaśnili, że musieli porzucić okręty uwięzione w lodzie pakowym. Na kilku mizernych saniach zabrali jedynie najpotrzebniejsze rzeczy. Kapitan [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetFullName] przez pewien czas był ciężko chory, ale teraz bezpiecznie powrócił do ojczyzny. Pozostali członkowie załogi nie przetrwali zimna, głodu, chorób i wyczerpania."
 rapanui.414.f: "W 1852 roku Edward Belcher otrzymał dowództwo nad rządową wyprawą arktyczną, której celem było odnalezienie zaginionej wyprawy Franklina. Przedsięwzięcie zakończyło się niepowodzeniem. Niezdolność Belchera do zdobycia sympatii podwładnych okazała się szczególnie dotkliwa w trudnych warunkach Arktyki, a on sam nie był w pełni przygotowany do dowodzenia okrętami wśród lodów. Cztery z pięciu okrętów („HMS Resolute”, „Pioneer”, „Assistance” i „Intrepid”) porzucono w lodzie pakowym, za co Belcher stanął przed sądem wojskowym, lecz został uniewinniony. Jeden z tych okrętów, „HMS Resolute”, został ostatecznie odnaleziony w nienaruszonym stanie przez amerykański statek wielorybniczy i zwrócony Wielkiej Brytanii."
 rapanui.414.g: "Przynajmniej żyją."
 rapanui.415.t: "Ani Śladu po Wyprawie [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetLastNameNoFormatting]"
 rapanui.415.d: "Po wielu tygodniach oczekiwania najgorsze przypuszczenia zdają się potwierdzać: wyprawa poszukująca Przejścia Północno-Zachodniego już nie powróci. Prawdopodobnie musimy pogodzić się ze straszliwą świadomością, że jest to jedna z największych tragedii w historii żeglugi [ROOT.GetCountry.GetAdjectiveNoFormatting]."
 rapanui.415.f: "Wyprawa Franklina była trzecią wielką i zarazem ostatnią wyprawą badawczą brytyjskiego polarnika sir Johna Franklina. Jej celem było pierwsze w historii przepłynięcie całego Przejścia Północno-Zachodniego ze wschodu na zachód, sporządzenie jego map oraz odnalezienie w ten sposób krótszego szlaku morskiego z Europy do Azji. Wyprawa zakończyła się katastrofą. W latach 1845–1848 wszyscy jej uczestnicy zginęli na obszarze kanadyjskiego Archipelagu Arktycznego. Ostatnie ślady członków wyprawy odnaleziono dopiero wiele lat później w pobliżu Wyspy Króla Williama. Tragiczne losy wyprawy Franklina, przez długi czas owiane tajemnicą, wzbudziły w połowie XIX wieku ogromne zainteresowanie. Gazety osiągały wysokie nakłady dzięki doniesieniom i spekulacjom na temat losu Franklina, wykorzystując tę historię zgodnie ze wszystkimi prawidłami nowoczesnych mediów masowych. Sama wyprawa, a także usilne starania lady Jane Franklin, która próbowała ocalić męża, organizując kolejne wyprawy poszukiwawcze, przez wiele lat zaprzątały uwagę brytyjskiej opinii publicznej."
 rapanui.415.g: "Musimy pogodzić się z tym, że wszyscy zginęli..."
 rapanui.415.h: "Wyślij misję ratunkową!"
 rapanui.415.tt: "Istnieje niewielka szansa na odnalezienie żywych członków wyprawy. W większości przypadków nie znajdziemy niczego lub co najwyżej nieliczne szczątki. Istnieje jednak również, choć bardzo niewielkie, ryzyko, że ta wyprawa także zaginie."
 rapanui.416.t: "Ślady Wyprawy [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetLastNameNoFormatting]"
 rapanui.416.d: "[SCOPE.sCharacter('rapanui_northwest_expedition_hero').GetFullName] zdołał odnaleźć pozostałości zaginionej wyprawy podczas wyczerpującej podróży przez północną Kanadę. Zebrane dowody wskazują, że wszyscy członkowie wyprawy zginęli. [SCOPE.sCharacter('rapanui_northwest_expedition_hero').GetSheHe] zdołał jednak zabezpieczyć kilka znalezisk, a [SCOPE.sCharacter('rapanui_northwest_expedition_hero').GetHerHis] misja przyniosła nową wiedzę do [ROOT.GetCountry.GetNameNoFormatting]."
 rapanui.416.f: "Po wielu tygodniach członkowie misji ratunkowej odnaleźli kilka ukrytych wiadomości pozostawionych przez załogę zaginionych okrętów. Zawierały one raporty o sytuacji załogi oraz informacje o jej położeniu. Okręty pod dowództwem [SCOPE.sCharacter('rapanui_northwest_expedition_hero').GetFullName] zdołały ostatecznie ustalić obszar, na którym musiała zaginąć #YELLOW Wyprawa [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetLastNameNoFormatting]#!. Udało im się nawet odkupić od kilku Inuitów przedmioty pochodzące z jednego z zaginionych okrętów. Śmierć załogi i jej kapitana jest już smutną pewnością. Misja ratunkowa sporządziła jednak mapy nieznanych dotąd obszarów, uzyskała nowe wyniki badań i odzyskała również zaginione dane pomiarowe. Kapitan [SCOPE.sCharacter('rapanui_northwest_expedition_hero').GetLastName] zdobył cenne doświadczenie."
 rapanui.416.g: "Przynajmniej udało nam się rzucić nieco światła na tę sprawę."
 rapanui.417.t: "Tajemnica Zaginionej Wyprawy"
 rapanui.417.d: "Nawet po wielu tygodniach poszukiwań [SCOPE.sCharacter('rapanui_northwest_expedition_hero').GetFullName] nie zdołał odnaleźć żadnych śladów, które pozwoliłyby ustalić losy #YELLOW Wyprawy [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetLastNameNoFormatting]#!. Złe warunki pogodowe zmusiły do przerwania misji, aby uniknąć podobnego losu."
 rapanui.417.f: "Członkowie zaginionej wyprawy najprawdopodobniej nie żyją, a ich okręty zatonęły. Jednak niepewność co do ich losu nie pozostaje bez echa. W prasie krążą rozmaite opowieści. Mówi się o kanibalizmie i demonach, o szanowanych dżentelmenach, którzy zamienili się w dzikie bestie i popadli w obłęd. Los #YELLOW Wyprawy [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetLastNameNoFormatting]#! prawdopodobnie nigdy nie zostanie wyjaśniony i stanie się inspiracją dla wielu mrożących krew w żyłach opowieści."
 rapanui.417.g: "Przypuszczalnie puszki z żywnością były źle zalutowane?"
 rapanui.418.t: "Arktyczny Cud"
 rapanui.418.d: "Nikt się tego nie spodziewał. Aż pewnego dnia do stolicy dotarł telegram: kapitan [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetLastName] żył. Był straszliwie wychudzony, chory i osłabiony. Ale żył. Niedługo później [SCOPE.sCharacter('rapanui_northwest_expedition_hero').GetFullName] powrócił do portu macierzystego wraz z ocalałymi członkami załogi. Misja ratunkowa zakończyła się pełnym sukcesem."
 rapanui.418.f: "Wszystkie okręty #YELLOW Wyprawy [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetLastNameNoFormatting]#! utknęły w lodzie pakowym. Porzucono je wiele miesięcy temu. Pozostawieni na nich chorzy i osłabieni członkowie załogi byli skazani na pewną śmierć. Inni zginęli podczas marszu z prowizorycznymi saniami wykonanymi z drewna pochodzącego z okrętów. Głód i zimno pochłonęły kolejne ofiary. Zginął mniej więcej co trzeci uczestnik wyprawy. Tym większa była jednak radość, że przynajmniej pozostałym udało się wrócić do ojczyzny. Niczym za sprawą cudu [SCOPE.sCharacter('rapanui_northwest_expedition_hero').GetFullName] odnalazł ich w zatoce wolnej od lodu i zabrał na pokład. Udało się również ocalić cenne wyniki badań naukowych przeprowadzonych podczas wyprawy. Chociaż [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetFullName] stracił [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetHerHis] flotę, [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetSheHe] jest w ojczyźnie witany wraz z [SCOPE.sCharacter('rapanui_northwest_expedition_hero').GetLastName] jak bohater, jak gdyby [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetSheHe] zdołał przepłynąć Przejście Północno-Zachodnie."
 rapanui.418.g: "Ci ludzie są bohaterami!"
 rapanui.419.t: "Misja Ratunkowa Zakończona Niepowodzeniem!"
 rapanui.419.d: "Doszło do najgorszego z możliwych zwrotów wydarzeń: po zaginięciu #YELLOW Wyprawy [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetLastNameNoFormatting]#! zaginęła również misja ratunkowa pod dowództwem [SCOPE.sCharacter('rapanui_northwest_expedition_hero').GetFullName]. Należy się obawiać, że obie wyprawy spotkał ten sam los."
 rapanui.419.f: "„W kwietniu 1854 roku w zatoce Pelly (69° szerokości geograficznej północnej, 72° długości geograficznej zachodniej) Rae dowiedział się od Eskimosów, że w odległości 10–12 dni drogi dalej na zachód ponad 40 białych ludzi zmarło z braku pożywienia. Kontynuując podróż, ustalił, że wiosną 1850 roku pewni Eskimosi, którzy wyruszyli na polowanie na foki w pobliżu północnego wybrzeża Wyspy Króla Williama, widzieli około 40 białych ludzi przemierzających lód w kierunku południowym. Kilka tygodni później na wybrzeżu kontynentu amerykańskiego, dzień drogi na północny zachód od dużej rzeki, odnaleziono ciała 30 białych ludzi, a kolejnych pięć na pobliskiej wyspie. Okazało się, że Eskimosi znaleźli również proch, kule, śrut, zegarki, kompasy, lunety i broń palną, ponieważ Rae odnalazł i odkupił przynajmniej część tych przedmiotów, a także srebrne łyżki, widelce i inne rzeczy”."
 rapanui.419.g: "To morze lodu jest przeklęte!"
 rapanui.420.t: "Wyprawa [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetLastNameNoFormatting] Powraca"
 rapanui.420.d: "Po tym, jak inne państwo zdołało odnaleźć drogę przez Przejście Północno-Zachodnie, nasza wyprawa powróciła do ojczyzny. Chociaż nie odniosła żadnego przełomowego sukcesu, przywiozła ze sobą cenną wiedzę. To ostatnia wyprawa tego rodzaju."
 rapanui.420.f: ""
 rapanui.420.g: "Witajcie w domu."
 rapanui.421.t: "Łagodna Pogoda"
 rapanui.421.d: "Nietypowa odwilż sprawiła, że niektóre zwykle skute lodem szlaki morskie stały się w tym roku żeglowne wcześniej niż zazwyczaj. Dzięki temu #YELLOW Wyprawa [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetLastNameNoFormatting]#! posuwa się naprzód szybciej, niż planowano."
 rapanui.421.f: "Kaprysy pogody są nieposkromione i kosztowały już życie niejednego badacza Arktyki. Astronom służący naszemu państwu może jeszcze przed rozpoczęciem wyprawy pomóc w wyznaczeniu dogodniejszego terminu podróży, zwiększając szansę na wystąpienie sprzyjających warunków pogodowych."
 rapanui.421.g: "Dobrze."
 rapanui.422.t: "Surowe Warunki Pogodowe"
 rapanui.422.d: "Niestety w tym roku zima w Arktyce zdaje się trwać dłużej, a okres zamarzania wód rozpoczyna się wcześniej, bo już we wrześniu. Znacznie zmniejsza to szanse powodzenia #YELLOW Wyprawy [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetLastNameNoFormatting]#!."
 rapanui.422.g: "Źle."
 rapanui.423.t: "Inuicki Przewodnik"
 rapanui.423.d: "Podczas [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetHisHer] podróży przez północną Kanadę [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetFullName] zdołał zatrudnić Inuita jako przewodnika wyprawy. Zna on nie tylko geografię regionu, lecz także kilka sposobów na przetrwanie w tym surowym klimacie."
 rapanui.423.f: "Europejczycy korzystali z wiedzy Inuitów już podczas wypraw arktycznych w pierwszej połowie XIX wieku. Niektórzy uczestnicy tych wypraw znali nawet ich język. Na przykład losy uczestników zaginionej wyprawy Franklina udało się odtworzyć dzięki relacjom naocznych świadków spośród Inuitów. Jednak szacunek okazywany rdzennej ludności pozostawiał wiele do życzenia. To Roald Amundsen w dużym stopniu wykorzystał techniki przetrwania stosowane przez mieszkańców obszarów polarnych, dzięki czemu zdołał pomyślnie ukończyć zarówno swoją wyprawę przez Przejście Północno-Zachodnie, jak i wyprawę na biegun południowy."
 rapanui.423.g: "Świetnie!"
 rapanui.424.t: "Dziczyzna"
 rapanui.424.d: "Niektórzy członkowie załogi poprosili o pozwolenie na zejście na ląd na kilka dni, aby polować na foki, karibu lub ptaki."
 rapanui.424.f: "Jałowy krajobraz tundry północnej Kanady, a zwłaszcza obszary położone w strefie arktycznej, stwarza większym dzikim zwierzętom niewielkie szanse na przetrwanie. Istnieją jednak wyjątki. Jedną z przyczyn niepowodzenia wyprawy Franklina było to, że jej uczestnicy polegali w dużej mierze na własnych zapasach żywności, w niewielkim stopniu korzystając z miejscowych źródeł pożywienia. Późniejsze wyprawy znacznie częściej wykorzystywały możliwość polowania na miejscowe zwierzęta, uzupełniając w ten sposób dietę załogi. Nie każde polowanie kończy się jednak sukcesem."
 rapanui.424.g: "Powinni wykorzystać ten czas na polowanie."
 rapanui.424.h: "To strata czasu."
 rapanui.425.t: "Zatrucie"
 rapanui.425.d: "Kilku członków #YELLOW Wyprawy [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetLastNameNoFormatting]#! cierpi na objawy zatrucia. Nie wiadomo, czy przyczyną było zepsucie się zapasów żywności, czy też inne czynniki. Na pokładzie okrętu flagowego wybuchł już spór o to, co zrobić z pozostałym pożywieniem – możliwości uzupełnienia zapasów są bardzo ograniczone."
 rapanui.425.f: "Do dziś trwają dyskusje na temat rzeczywistych przyczyn niepowodzenia wyprawy Franklina. Często przytaczanym argumentem jest to, że puszki z żywnością były niewłaściwie zalutowane, co doprowadziło do zatrucia ołowiem, które przynajmniej przyczyniło się do osłabienia załogi. Inni badacze wysuwali hipotezę zatrucia rtęcią. Nie można jednak wykluczyć również zatrucia pokarmowego, które nie jest zjawiskiem wyjątkowym."
 rapanui.425.g: "Czy zapasy żywności były aż tak złe?"
 rapanui.425.h: "Wyrzuć zapasy żywności za burtę i poszukaj czegoś do jedzenia na lądzie."
 rapanui.426.t: "Gruźlica"
 rapanui.426.d: "[SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetFullName] stoi przed trudną decyzją w Arktyce: na pokładzie jednego z okrętów wyprawy szerzy się gruźlica. W tak ciasnej przestrzeni ryzyko zakażenia zdrowych członków załogi jest wysokie."
 rapanui.426.f: "„Wszystko więc, co byście chcieli, żeby wam ludzie czynili, i wy im czyńcie! Albowiem na tym polega Prawo i Prorocy.” – Ewangelia według św. Mateusza 7,12"
 rapanui.426.g: "Zaopiekuj się nimi najlepiej, jak potrafisz."
 rapanui.426.h: "Wyrzuć ich za burtę!"
 rapanui.427.t: "Lód Pakowy"
 rapanui.427.d: "Nic już nie działa. Po pewnym czasie okręt całkowicie się zatrzymuje. Drewniany kadłub nie przesuwa się nawet o szerokość palca. Wkrótce nadejdą mrozy: #YELLOW Wyprawa [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetLastNameNoFormatting]#! została całkowicie otoczona przez lód pakowy!"
 rapanui.427.f: "„Silny człowiek to nie ten, który dokonuje wielkich czynów, lecz ten, który z ogromną determinacją stawia czoła trudnościom, niepowodzeniom i zniechęceniu.” – Ernest Shackleton"
 rapanui.427.g: "To najgorszy możliwy obrót wydarzeń."
 rapanui.427.h: "Na szczęście nasz inżynier przygotował okręt na taką sytuację."
 rapanui.428.t: "Dane Geomagnetyczne"
 rapanui.428.d: "Zespół fizyków #YELLOW Wyprawy [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetLastNameNoFormatting]#! zdobył nową wiedzę naukową w pobliżu polarnych czap lodowych."
 rapanui.428.f: "„Historia rodzaju ludzkiego to nieustanna walka o wydobycie się z ciemności ku światłu. Dlatego rozważania nad użytecznością wiedzy są bezcelowe. Człowiek pragnie wiedzieć, a kiedy przestaje tego pragnąć, przestaje być człowiekiem.” – Fridtjof Nansen"
 rapanui.428.g: "Świetnie!"
 rapanui.429.t: "Polarna Flora i Fauna"
 rapanui.429.d: "Pomimo nieprzyjaznych warunków badaczom z #YELLOW Wyprawy [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetLastNameNoFormatting]#! udało się zebrać próbki roślin i zwierząt, aby poszerzyć wiedzę o tym odległym regionie."
 rapanui.429.f: "„Wielu ludziom wydaje się, że długi pobyt w rejonach polarnych czyni człowieka bardziej odpornym na zimno niż innych śmiertelników. Są oni jednak w całkowitym błędzie.” – Roald Amundsen"
 rapanui.430.t: "Nieznane Krainy"
 rapanui.430.d: "#YELLOW Wyprawa [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetLastNameNoFormatting]#! odkryła nieznane dotąd wyspy i zatoki w północnej Kanadzie, poszerzając tym samym wiedzę oceanograficzną i kartograficzną."
 rapanui.430.f: "Po wyprawach Jamesa Cooka panowało przekonanie, że nie pozostało już nic do odkrycia. Jednak bez względu na to, jak niegościnne są te ziemie, [SCOPE.sCharacter('rapanui_northwest_expedition_leader').GetFullName] sporządził mapy nowych, nieznanych dotąd obszarów lądowych, dowodząc tym samym, że nie dotarliśmy jeszcze do ostatnich granic poznania."
 rapanui.431.d: "Norweski poszukiwacz przygód Roald Amundsen jako pierwszy człowiek przepłynął statkiem Przejście Północno-Zachodnie. Wyprawa trwała trzy lata."
 rapanui.431.g: "Gratulacje..."
 rapanui.432.d: "Wyprawa z [SCOPE.sCountry('rapanui_northwest_country_scope').GetName] dokonała dziś niezwykłego wyczynu, pokonując Przejście Północno-Zachodnie."
 rapanui.433.t: "Zaginiona Wyprawa [SCOPE.sCountry('rapanui_franklin_country').GetAdjectiveNoFormatting]"
 rapanui.433.d: "Jedna z największych katastrof w historii żeglugi dotknęła [SCOPE.sCountry('rapanui_franklin_country').GetName]: cała wyprawa wyposażona w najnowocześniejszy sprzęt zaginęła w Arktyce. Jej celem było odnalezienie i przepłynięcie Przejścia Północno-Zachodniego. Od czterech lat nie ma z nią żadnego kontaktu. Podczas gdy cały kraj pogrążony jest w głębokiej żałobie, niektórzy przypuszczają, że wszyscy członkowie załogi mogli zginąć."
 rapanui.433.g: "Wyślij telegram z wyrazami naszego szczerego współczucia."
 rapanui.433.h: "Kto szuka niebezpieczeństwa, niech w nim ginie."
 rapanui.434.t: "Ślady Wyprawy [SCOPE.sCountry('rapanui_franklin_country').GetAdjectiveNoFormatting]"
 rapanui.434.d: "[SCOPE.sCharacter('rapanui_northwest_expedition_hero').GetFullName] zdołał odnaleźć pozostałości zaginionej wyprawy podczas wyczerpującej podróży przez północną Kanadę. Zebrane dowody wskazują, że wszyscy członkowie wyprawy zginęli. [SCOPE.sCharacter('rapanui_northwest_expedition_hero').GetSheHe] zdołał jednak zabezpieczyć kilka znalezisk, a [SCOPE.sCharacter('rapanui_northwest_expedition_hero').GetHerHis] misja przyniosła nową wiedzę do [ROOT.GetCountry.GetNameNoFormatting]."
 rapanui.434.f: "Po wielu tygodniach członkowie misji ratunkowej odnaleźli kilka ukrytych wiadomości pozostawionych przez załogę zaginionych okrętów. Zawierały one raporty o sytuacji załogi oraz informacje o jej położeniu. Okręty pod dowództwem [SCOPE.sCharacter('rapanui_northwest_expedition_hero').GetFullName] zdołały ostatecznie ustalić obszar, na którym musiała zaginąć wyprawa [SCOPE.sCountry('rapanui_franklin_country').GetAdjectiveNoFormatting]. Udało im się nawet odkupić od kilku Inuitów przedmioty pochodzące z jednego z zaginionych okrętów. Śmierć załogi i jej kapitana jest już smutną pewnością. Misja ratunkowa sporządziła jednak mapy nieznanych dotąd obszarów, uzyskała nowe wyniki badań i odzyskała również zaginione dane pomiarowe. Kapitan [SCOPE.sCharacter('rapanui_northwest_expedition_hero').GetLastName] zdobył cenne doświadczenie."
 rapanui.435.t: "Tajemnica Zaginionej Wyprawy"
 rapanui.435.d: "Nawet po wielu tygodniach poszukiwań [SCOPE.sCharacter('rapanui_northwest_expedition_hero').GetFullName] nie zdołał odnaleźć żadnych śladów, które pozwoliłyby ustalić losy wyprawy [SCOPE.sCountry('rapanui_franklin_country').GetAdjectiveNoFormatting]. Złe warunki pogodowe zmusiły do przerwania misji, aby uniknąć podobnego losu."
 rapanui.435.f: "Członkowie zaginionej wyprawy najprawdopodobniej nie żyją, a ich okręty zatonęły. Jednak niepewność co do ich losu nie pozostaje bez echa. W prasie krążą rozmaite opowieści. Mówi się o kanibalizmie i demonach, o szanowanych dżentelmenach, którzy zamienili się w dzikie bestie i popadli w obłęd. Losy tej wyprawy prawdopodobnie nigdy nie zostaną wyjaśnione i staną się inspiracją dla wielu mrożących krew w żyłach opowieści."
 rapanui.436.t: "Odnaleziono Zaginiony Okręt!"
 rapanui.436.d: "To prawdziwa sensacja: jeden z okrętów zaginionej wyprawy pojawił się niczym statek widmo u wybrzeży Ameryki Północnej. [SCOPE.sCharacter('rapanui_northwest_expedition_hero').GetFullName] zdołał go zabezpieczyć. Okręt jest niemal całkowicie nienaruszony, ale odnaleziono go około 1200 mil od miejsca, w którym przypuszczalnie zaginął. Rozgorzała dyskusja, czy należy uznać go za dryfujący wrak, czy za cudzą własność."
 rapanui.436.f: "HMS Resolute był XIX-wiecznym okrętem Królewskiej Marynarki Wojennej Wielkiej Brytanii, o ożaglowaniu barkowym, specjalnie przystosowanym do badań Arktyki. Podczas poszukiwań zaginionej wyprawy Franklina „Resolute” utknął w lodzie i został porzucony w 1854 roku. Rząd brytyjski ogłosił w „The London Gazette”, że okręt nadal pozostaje własnością Jej Królewskiej Mości, jednak nie podjęto żadnej próby jego odzyskania. Ostatecznie okręt uwolnił się z lodów i 16 września 1855 roku został dostrzeżony jako statek widmo w Zatoce Baffina przez załogę amerykańskiego statku wielorybniczego „George Henry”, niemal 2000 kilometrów od miejsca, w którym go porzucono. Następnie „Resolute” ponownie został uwięziony przez lód pakowy w Cieśninie Davisa, w pobliżu Wyspy Baffina, lecz wciąż nadawał się do żeglugi. Wielorybnicy zdołali więc przejąć go jako zdobycz i doprowadzić do portu New London w stanie Connecticut. Ostatecznie Kongres Stanów Zjednoczonych zakupił okręt za 40 000 dolarów amerykańskich, poddał go remontowi i 17 grudnia 1856 roku oficjalnie przekazał brytyjskiej królowej Wiktorii jako symbol pokoju między oboma państwami."
 rapanui.436.g: "Zwróć okręt prawowitemu właścicielowi."
 rapanui.436.h: "Wiedza naukowa zgromadzona na pokładzie mogłaby nam się przydać..."
 rapanui_add_x_oceanographic_understanding_minus_x_tt: "Zmniejsz @rapanui_oceanographic_knowledge! Wiedzę Oceanograficzną o [SCOPE.GetValue('understanding_amount')|0+]."
 rapanui_add_x_oceanographic_understanding_0_tt: "Nie zmienia @rapanui_oceanographic_knowledge! Wiedzy Oceanograficznej"
 rapanui_add_x_oceanographic_understanding_x_tt: "Zwiększ @rapanui_oceanographic_knowledge! Wiedzę Oceanograficzną o [SCOPE.GetValue('understanding_amount')|0+]."
 rapanui.501.t: "Nowe Atlantyckie Towarzystwo Telegraficzne"
 rapanui.501.d: "Pod patronatem [SCOPE.sCharacter('rapanui_telegraph_boss_scope').GetFullName] powstała wpływowa spółka akcyjna. Magnat telegraficzny ma zgromadzić fundusze na ryzykowne przedsięwzięcie polegające na ułożeniu kabla telegraficznego przez Atlantyk. Atlantyckie Towarzystwo Telegraficzne [SCOPE.sCharacter('rapanui_telegraph_boss_scope').GetLastNameNoFormatting] podejmie próbę dokonania niemożliwego."
 rapanui.501.f: "Gdy [SCOPE.sCharacter('rapanui_telegraph_boss_scope').GetLastName] po raz pierwszy przedstawił [SCOPE.sCharacter('rapanui_telegraph_boss_scope').GeHerHis] pomysł, [SCOPE.sCharacter('rapanui_telegraph_boss_scope').GeSheHe] spotkał się z drwinami – twierdzono, że [SCOPE.sCharacter('rapanui_telegraph_boss_scope').GeSheHe] dosłownie utopi [SCOPE.sCharacter('rapanui_telegraph_boss_scope').GeHerHis] fortunę w oceanie. Tymczasem udało się znaleźć innych sponsorów, którzy uznali przedsięwzięcie za możliwe do zrealizowania."
 rapanui.501.g: "Połączmy kontynenty!"
 rapanui.502.t: "Wsparcie Naukowe"
 rapanui.502.d: "Na krótko przed wypłynięciem statku mającego ułożyć kabel telegraficzny pojawia się możliwość dołączenia do misji naukowca, który wesprze realizację przedsięwzięcia."
 rapanui.502.f: "[concept_tesla_engineer] może pomóc w razie wypadków na morzu, chroniąc tym samym przedsięwzięcie układania kabla transoceanicznego przed niepowodzeniem. Zwiększa również szansę, że po ułożeniu kabel będzie rzeczywiście działał. Z kolei [concept_dubois_naturalist] wykorzystuje pobyt na Atlantyku do obserwacji przyrody."
 rapanui.502.g: "[SCOPE.sCharacter('gaudi_engineer_scope').GetFullName], nasz Inżynier."
 rapanui.502.h: "[SCOPE.sCharacter('dubois_naturalist_scope').GetFullName], nasz Przyrodnik."
 rapanui.511.t: "Wieloryby i Delfiny"
 rapanui.511.d: "Gdy wieloryby i delfiny przecinają trasę statku, załoga staje się świadkiem niezwykłego widowiska przyrody. [SCOPE.sCharacter('rapanui_cable_guy_scope').GetFullName] spodziewa się, że obserwacja tych zwierząt dostarczy nowej wiedzy biologicznej, jednak załoga nie wykazuje większego zainteresowania tego rodzaju naukową ciekawością."
 rapanui.511.f: "Na pokładzie wybucha kłótnia, gdy profesor zwraca również uwagę na odrażające metody polowań, za pomocą których zabija się te urzekające stworzenia morskie. Dla większości marynarzy, którzy postrzegają wieloryby wyłącznie jako źródło cennego oleju, wykład ten jest dodatkowo irytujący."
 rapanui.511.g: "Zbadaj te wspaniałe stworzenia."
 rapanui.511.h: "Nie mamy na to czasu."
 rapanui.512.t: "Ależ Tu Ryb!"
 rapanui.512.d: "[SCOPE.sCharacter('rapanui_cable_guy_scope').GetFullName] nie może uwierzyć w [SCOPE.sCharacter('rapanui_cable_guy_scope').GetHerHis] szczęście, gdy [SCOPE.sCharacter('rapanui_cable_guy_scope').GetSheHe] dostrzega na północnym Atlantyku ławice ryb należących do nieznanych dotąd gatunków. Profesor prosi kapitana o wstrzymanie prac i schwytanie kilku okazów. [SCOPE.sCharacter('target_character').GetFullName] zwraca uwagę, że jest to statek przeznaczony do układania kabli, a nie jednostka badawcza."
 rapanui.512.f: "„Proszę mi wierzyć! Przepuszczamy okazję do przeprowadzenia badań naukowych! Te delikatne rybki należą do zupełnie nieodkrytego dotąd gatunku. Czy pan tego nie widział? Jak to, co pan ma na myśli, mówiąc, że mogę już teraz popływać z nimi w wodzie?!”"
 rapanui.512.g: "Złap kilka ryb."
 rapanui.513.t: "Eksperymenty na Oceanie Atlantyckim"
 rapanui.513.d: "[SCOPE.sCharacter('rapanui_cable_guy_scope').GetFullName] wykorzystał czas spędzony na morzu na przygotowanie części swoich przyrządów do prowadzenia badań naukowych na pokładzie statku układającego kabel telegraficzny. Nie wybrał jeszcze głównego przedmiotu badań."
 rapanui.513.f: "„W oceanie płynie rzeka. Nawet podczas najdotkliwszych susz nigdy nie wysycha, a podczas największych powodzi nigdy nie występuje z brzegów. Jej brzegi i dno tworzą zimne wody, podczas gdy jej nurt jest ciepły. Jej źródłem jest Zatoka Meksykańska, a ujściem Morze Arktyczne. To Prąd Zatokowy.” – Matthew Fontaine Maury"
 rapanui.513.g: "Skup się na eksperymentach magnetycznych."
 rapanui.513.h: "Skup się na eksperymentach oceanograficznych."
 rapanui.521.t: "Tajemnica w głębinach"
 rapanui.521.d: "[SCOPE.sCharacter('rapanui_cable_guy_scope').GetFullName] dokonuje niezwykłego odkrycia podczas analizy danych pomiarowych. W pewnej części Atlantyku dno morskie wznosi się na wyjątkowo niewielką głębokość. Jak dotąd [SCOPE.sCharacter('rapanui_cable_guy_scope').GetSheHe] ma jedynie teorię wyjaśniającą to zjawisko."
 rapanui.521.f: "Dotychczas sądzono, że morza powinny być szczególnie głębokie w swoich środkowych częściach. Dzisiejsze odkrycie wywraca jednak to przekonanie do góry nogami. Zamiast rekordowej głębokości odległość między dnem a powierzchnią wody maleje. To dobra wiadomość dla towarzystwa, ponieważ oznacza, że potrzeba mniej kabla, niż początkowo zakładano. Dla [SCOPE.sCharacter('rapanui_cable_guy_scope').GetFullName] jest jednak jasne, że odkrycie to wymaga zrewidowania wszystkich dotychczasowych poglądów na temat głębin morskich. Najwyraźniej na dnie oceanu znajdują się wzgórza i doliny. A to wzniesienie jest czymś więcej niż zwykłym wzgórzem."
 rapanui.521.g: "Czy pod wodą znajduje się pasmo górskie?"
 rapanui_cable_guy.option: "[SCOPE.sCharacter('rapanui_cable_guy_scope').GetFullName] się tym zajmie."
 rapanui_transatlantic_cable_start_button: "Rozpocznij układanie kabla przez Atlantyk"
 rapanui_transatlantic_cable_start_button_desc: "Po pozyskaniu wystarczającej liczby inwestorów dla przedsięwzięcia można rozpocząć właściwe układanie kabla podmorskiego."
 rapanui_transatlantic_cable_start_tt: "[GetPlayer.GetName] osiągnęło co najmniej #G 8#! #V punktów postępu#!."
 subject_type_rapanui_protectorate: "#O Protektorat Oceaniczny#!"
 alert_rapanui_pacific_expedition_possible_alert_hint: "Nasz kraj może wysłać [concept_dubois_pacific_expedition]. Aby ją wysłać, przejdź do Przeglądu Naukowego w #V Oknie Morgenröte#!."
 rapanui.248.t: "Minerały"
 rapanui.248.d: "Załoga [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')] odkryła podczas podróży formacje skalne bogate w surowce naturalne. Zespół prowadzi obecnie szczegółowe badania tych skał."
 rapanui.248.f: "Na pokładzie Galathei podczas duńskiej wyprawy na Pacyfik znajdował się również geolog Hinrich Johannes Rink. Zajmował się on przede wszystkim badaniami geograficznymi Wysp Nikobarskich, które były wówczas kolonizowane przez Danię. Po pięciu miesiącach zachorował na gorączkę nikobarską, która osłabiła jego organizm na resztę życia i zmusiła go do powrotu do Danii. W rezultacie większość materiału geologicznego zebrał nie na Pacyfiku ani na Oceanie Indyjskim, lecz w Kairze i na Malcie podczas podróży powrotnej."
 rapanui.248.g: "Zbierz jak najwięcej minerałów."
 rapanui.248.h: "Zbadaj dokładniej ten obszar pod względem geologicznym."
 rapanui.249.t: "Dziwna Bryła"
 rapanui.249.d: "Podczas ostatniego zarzucania sieci w celu zebrania materiału z dna morskiego załoga wyłowiła dziwną bryłę metalu. Wyraźnie widać, że składa się ona z różnych materiałów. Na pokładzie [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')] wciąż nie wiadomo, co zrobić ze znaleziskiem."
 rapanui.249.f: "„Na całym dnie Pacyfiku (...) znajdujemy czerwony ił, szczególnie w północnej części oceanu, gdzie wody są bardzo głębokie. W całej masie czerwonego iłu występują konkrecje o rozmiarach od ziaren sago lub nasion kanaru po wielkość głowy dziecka czy pomarańczy, złożone niemal z czystego nadtlenku manganu. Występują one w ogromnych ilościach. Włok (...) wydobywa całe masy konkrecji, bardzo przypominających bryły minerału znanego jako wad. Niemal każda z nich zawiera w swoim wnętrzu jądro w postaci zęba ryby, niewielkiego fragmentu gąbki lub jakiejś skamieliny, która stała się zalążkiem, wokół którego nagromadził się mangan.” – Charles Wyville Thomson"
 rapanui.249.g: "Rozbij ją i wykorzystaj surowce."
 rapanui.249.h: "Dr. [SCOPE.sCharacter('rapanui_scientist').GetLastName] powinien ostrożnie rozebrać ją na części."
 rapanui.249.i: "Tę dziwną konkrecję należy zbadać i wystawić w instytucie naukowym."
 rapanui.249.j: "Dr. [SCOPE.sCharacter('rapanui_scientist').GetLastName] powinien zachować ten okaz na pamiątkę i wyciągnąć z niego wnioski."
 rapanui.269.t: "Cenny Kamień"
 rapanui.269.d: "Podczas postoju w Australii współpracujący z wyprawą naukowiec [SCOPE.sCharacter('rapanui_scientist').GetFullName] miał okazję zbadać kilka słabo dotąd poznanych masywów górskich. Oprócz opali i kryształów [SCOPE.sCharacter('rapanui_scientist').GetSheHe] znalazł również inne rzadkie minerały."
 rapanui.269.f: "Australia do dziś pozostaje krainą bogatą w surowce naturalne, z której pierwiastki ziem rzadkich, minerały i metale trafiają na cały świat. Nieprzypadkowo więc właśnie na tym kontynencie Dr. [SCOPE.sCharacter('rapanui_scientist').GetLastName] natrafił na rzadki minerał, którego nie potrafił jeszcze przyporządkować do żadnego z okazów w [SCOPE.sCharacter('rapanui_scientist').GetHerHis] kolekcji."
 rapanui.269.g: "Mój Skarb!"
 rapanui.270.t: "Pierścień Ognia"
 rapanui.270.d: "Im dłużej [SCOPE.sCharacter('rapanui_scientist').GetFullName] przebywa na pokładzie [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')] i im dłużej [SCOPE.sCharacter('rapanui_scientist').GetSheHe] żegluje po Oceanie Spokojnym, tym wyraźniej [SCOPE.sCharacter('rapanui_scientist').GetSheHe] uświadamia sobie, jak bardzo ta część świata naznaczona jest aktywnością wulkaniczną. Wulkany tworzą pierścień wokół wybrzeży oceanu. Towarzyszący wyprawie naukowiec zdołał zbliżyć się do tych ziejących dymem skalnych potworów i sporządzić ważne notatki."
 rapanui.270.f: "Pacyficzny Pierścień Ognia to pas wulkaniczny otaczający Ocean Spokojny z trzech stron. Na tym obszarze miało miejsce około dwóch trzecich wszystkich erupcji wulkanicznych w holocenie oraz około 90% trzęsień ziemi na świecie. Pierścień Ognia obejmuje około 850–1000 wulkanów, które były aktywne w ciągu ostatnich 11 700 lat."
 rapanui.270.g: "Czy Ocean Spokojny jest w rzeczywistości jednym ogromnym kraterem wulkanicznym z bocznymi kominami?"
 rapanui.203.l: "Niezwykła okazja dla [SCOPE.sCharacter('dubois_geologist_scope').GetFullName], [concept_agassiz_geologist]."
 rapanui.280.t: "Dziwny Wilk"
 rapanui.280.d: "Do załogi #YELLOW Wyprawy [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]#! zgłosił się myśliwy. Przyniósł ze sobą dziwnego wilka, którego schwytał, i proponuje nam jego sprzedaż."
 rapanui.280.f: "„Te bestie zabijają nasze cenne zwierzęta gospodarskie! Początkowo chciałem go zabić, ale wtedy zobaczyłem wasz statek. Pomyślałem, że może was zainteresować...”"
 rapanui.280.g: "Tak egzotyczne zwierzę musi trafić do naszego Zoo!"
 rapanui.280.h: "Wolelibyśmy obserwować go w jego naturalnym środowisku."
 rapanui.280.i: "Nie, dziękujemy."
 rapanui.502.i: "Nasi naukowcy są potrzebni gdzie indziej."
