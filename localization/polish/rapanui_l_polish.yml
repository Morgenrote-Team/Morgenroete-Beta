 rapanui_pacific_expedition_changes_location_tt: "Wyprawa opuści obecny region i uda się do innego."
 dubois_sub_zoo_animal_stoat_tt: "Utracisz #O Gronostaja#!."
 rapanui_send_new_missionaries_button: "Wyślij nowych Misjonarzy"
 rapanui_send_new_missionaries_button_desc: "Dzięki nowym misjonarzom możemy zwiększyć szanse na nawrócenie miejscowej ludności. Skuteczność tej inicjatywy będzie zależeć od przypadku."
 rapanui_trade_with_natives_button: "Handluj z Rdzenną Ludnością"
 rapanui_trade_with_natives_button_desc: "Zamiast kontynuować nawracanie miejscowej ludności, możemy wykorzystać nasze wpływy, aby otrzymać egzotyczne podarunki."
 rapanui_sabotage_rival_missionaries_button: "Zdeprecjonuj Konkurencyjnych Misjonarzy"
 rapanui_sabotage_rival_missionaries_button_desc: "Jeśli na miejscu działa konkurencyjna misja, możemy spróbować podważyć jej wiarygodność i na wiele lat ograniczyć jej szanse na prowadzenie działalności misyjnej. Nasze szanse na sukces wynoszą 50:50. Wpłynie to jedynie na roczne tempo nawracania."
 rapanui_change_course_button: "Zmienia kurs wyprawy"
 rapanui_change_course_button_desc: "Podczas [concept_dubois_pacific_expedition] można jednokrotnie zmienić kurs statku. Opuści on wówczas pierwotnie wybrany region i skieruje się do jednego z dwóch pozostałych miejsc docelowych."
 je_rapanui_catholic_mission_oceania: "Ustanów Misję Katolicką w Oceanii"
 je_rapanui_catholic_mission_oceania_reason: "Nasz misjonarz, ojciec [SCOPE.sCharacter('rapanui_missionary_scope').GetFirstName], niestrudzenie pracuje nad nawracaniem rdzennej ludności na wiarę chrześcijańską. Przewiduje się, że każdego roku około 1 procent ludności będzie przechodzić na katolicyzm. Losowe wydarzenia mogą poprawić ten wynik. Jeśli jednak zbyt nachalne działania misyjne wywołają gniew rdzennej ludności, całe przedsięwzięcie może zakończyć się niepowodzeniem. Gdy 30 procent mieszkańców wyrzeknie się dawnej wiary w imię Chrystusa, będziemy mogli ustanowić stałą placówkę misyjną."
 je_rapanui_protestant_mission_oceania: "Ustanów Misję Protestancką w Oceanii"
 je_rapanui_protestant_mission_oceania_reason: "Nasz misjonarz, pastor [SCOPE.sCharacter('rapanui_missionary_scope').GetFullName], niestrudzenie pracuje nad nawracaniem rdzennej ludności na wiarę chrześcijańską. Przewiduje się, że każdego roku około 1 procent ludności będzie przechodzić na katolicyzm. Losowe wydarzenia mogą poprawić ten wynik. Jeśli jednak zbyt nachalne działania misyjne wywołają gniew rdzennej ludności, całe przedsięwzięcie może zakończyć się niepowodzeniem. Gdy 30 procent mieszkańców wyrzeknie się dawnej wiary w imię Chrystusa, będziemy mogli ustanowić stałą placówkę misyjną."
 je_rapanui_mission_fail: "Chrystianizacja [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] zakończy się niepowodzeniem, jeśli agresywność rdzennej ludności osiągnie 5 Punktów lub więcej."
 je_rapanui_catholic_conversion_oceania: "Nawróć Władcę na Katolicyzm"
 je_rapanui_catholic_conversion_oceania_reason: "Nawrócenie wodza plemienia jest decydującym krokiem w ostatecznym zakorzenieniu chrześcijaństwa wśród rdzennej ludności i uczynieniu go religią państwową. Aby jednak było to możliwe, większość mieszkańców musi wyznawać katolicyzm. Jeśli w tym państwie działa konkurencyjna placówka misyjna heretyckich przeciwników kultu maryjnego, musimy zrobić wszystko, co w naszej mocy, aby nie dopuścić ich do zdobycia władzy politycznej. Nasz misjonarz, ojciec [SCOPE.sCharacter('rapanui_missionary_scope').GetFirstName], zadba o to, by do tego nie doszło, i każdego roku będzie nawracał jeden procent ludności na prawdziwą wiarę. Co trzy lata można podjąć jedno działanie."
 je_rapanui_protestant_conversion_oceania: "Nawróć Władcę na Protestantyzm"
 je_rapanui_protestant_conversion_oceania_reason: "Nawrócenie wodza plemienia jest decydującym krokiem w ostatecznym zakorzenieniu chrześcijaństwa wśród rdzennej ludności i uczynieniu go religią państwową. Aby jednak było to możliwe, większość mieszkańców musi wyznawać protestantyzm. Jeśli w tym państwie działa konkurencyjna placówka misyjna bluźnierczych papistów, musimy zrobić wszystko, co w naszej mocy, aby nie dopuścić ich do zdobycia władzy politycznej. Nasz misjonarz, pastor [SCOPE.sCharacter('rapanui_missionary_scope').GetFullName], zadba o to, by do tego nie doszło, i każdego roku będzie nawracał jeden procent ludności na prawdziwą wiarę. Co trzy lata można podjąć jedno działanie."
 je_rapanui_crisis_in_paradise: "Nawrócenie zakończy się niepowodzeniem, jeśli państwo wyznające inną religię nawróci władcę przed nami."
 je_rapanui_pacific_expedition: "Wyprawa [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]"
 je_rapanui_pacific_expedition_reason: "Obok biegunów Ocean Spokojny jest jednym z ostatnich obszarów na Ziemi, które wciąż skrywają tajemnice. Uczeni z wielu dziedzin nauki są zainteresowani wyprawą badawczą, która pozwoli przeprowadzić badania z zakresu historii naturalnej, archeologii, astronomii i oceanografii. Dla wielkich mocarstw byłoby to również prestiżowe przedsięwzięcie, pozwalające zademonstrować ich wpływy na krańcu świata."
 je_rapanui_pacific_expedition_success: "Wyprawa powróci po odwiedzeniu siedmiu różnych miejsc podczas podróży ogólnej lub pięciu podczas wyprawy specjalistycznej."
 je_rapanui_pacific_expedition_goal: "Wyprawa powróci po odwiedzeniu siedmiu różnych miejsc podczas podróży ogólnej lub pięciu podczas wyprawy specjalistycznej."
 je_rapanui_oceanographic_studies: "Badania Oceanograficzne"
 je_rapanui_oceanographic_studies_reason: "Badania oceanograficzne nie tylko pomogą nam lepiej zrozumieć ocean i rządzące nim zjawiska, ale także, jeśli zakończą się sukcesem, przyniosą nam znaczące korzyści. Państwo, które zna każdy prąd morski i potrafi właściwie interpretować zmiany zachodzące na morzu, zawsze wyprzedza swoich rywali o krok."
 je_rapanui_oceanographic_studies_success: "Zakończymy nasze badania, gdy zdobędziemy #G 25#! punktów #E Wiedzy Oceanograficznej#!."
 je_rapanui_oceanographic_studies_goal: "Zakończymy nasze badania, gdy zdobędziemy #G 25#! punktów #E Wiedzy Oceanograficznej#!."
 notification_rapanui_challenger_notification_name: "[SCOPE.sCountry('country_scope').GetName] odkrywa najgłębszy punkt dna morskiego"
 notification_rapanui_challenger_notification_desc: "Wyprawa z [SCOPE.sCountry('country_scope').GetName] odkryła na dnie Oceanu Spokojnego najgłębszy punkt na Ziemi, jaki kiedykolwiek zmierzono."
 notification_rapanui_wallace_notification_name: "Badacz z [SCOPE.sCountry('country_scope').GetName] potwierdza teorię ewolucji"
 notification_rapanui_wallace_notification_desc: "Naukowiec z [SCOPE.sCountry('country_scope').GetName] wniósł istotny wkład w potwierdzenie teorii ewolucji, wyznaczając granicę faunistyczną na obszarze Indonezji."
 rapanui.101.t_cat: "Misja Katolicka do [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag]"
 rapanui.101.t_pro: "Misja Protestancka do [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag]"
 rapanui.101.d_cat: "Odważny ojciec [SCOPE.sCharacter('rapanui_missionary_scope').GetFirstName] zgodził się udać do [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] jako misjonarz, aby nawracać miejscowych pogan na wiarę w Jezusa Chrystusa."
 rapanui.101.d_pro: "Odważny pastor [SCOPE.sCharacter('rapanui_missionary_scope').GetFullName] zgodził się udać do [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] jako misjonarz, aby nawracać miejscowych pogan na wiarę w Jezusa Chrystusa."
 rapanui.101.f: "W XIX wieku wyspy Oceanii pozostawały w dużej mierze odizolowane od cywilizacji zachodniej. Misjonarze odegrali znaczącą rolę w szerzeniu na tych obszarach nie tylko wiary, lecz także edukacji i technologii. Choć do połowy XX wieku Oceania została w pełni schrystianizowana, początkowo misjonarze spotykali się z nieufnością i ponosili liczne porażki. Stereotyp „dzikich Mórz Południowych” wynikał również z faktu, że wielu misjonarzy poniosło męczeńską śmierć w wyjątkowo makabrycznych okolicznościach."
 rapanui.101.g_cat: "Vade cum Deo."
 rapanui.101.g_pro: "Idź z Bogiem."
 rapanui.102.t_cat: "Misja Katolicka z [SCOPE.sCountry('rapanui_mission_departure_country').GetNameNoFlag]"
 rapanui.102.t_pro: "Misja Protestancka z [SCOPE.sCountry('rapanui_mission_departure_country').GetNameNoFlag]"
 rapanui.102.d: "Dziś do naszych wybrzeży dotarł misjonarz z obcego kraju. Niektórzy uważają go za wichrzyciela, inni zaś wierzą, że może przynieść korzyści naszemu państwu."
 rapanui.102.f: "Relacje między mieszkańcami wysp Pacyfiku a przybywającymi chrześcijańskimi misjonarzami były niezwykle skomplikowane. Słusznie postrzegano ich jako zwiastunów nadejścia mocarstw kolonialnych i potencjalne zagrożenie dla tradycyjnej kultury. Jednak w wielu przypadkach wyspiarze korzystali z doświadczenia i wiedzy Europejczyków. Misjonarze zakładali szkoły, sprowadzali nowoczesne metody leczenia i wprowadzali nowe sposoby uprawy roli. Dla wielu plemion przybycie misjonarzy oznaczało pierwszy krok w kierunku centralizacji władzy. Oczywiście nie wszyscy mieszkańcy wysp Pacyfiku byli skłonni podjąć takie ryzyko i niekiedy szybko rozprawiali się z nieproszonymi gośćmi."
 rapanui.102.g: "Zabijcie go!"
 rapanui.102.h: "Oszczędźcie go, ale ignorujcie."
 rapanui.102.i: "Przyjmijcie go życzliwie."
 rapanui.104.t: "Misjonarz ponosi śmierć męczeńską!"
 rapanui.104.d_cat: "Misja do [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] zakończyła się całkowitym niepowodzeniem. [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_missionary_death_type')]"
 rapanui.104.d_pro: "Misja do [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] zakończyła się całkowitym niepowodzeniem. [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_missionary_death_type')]"
 rapanui.104.f: "Niestety, wiele prób nawracania kończyło się zabiciem misjonarzy, między innymi z powodu nieporozumień i nieznajomości miejscowych zwyczajów. Ksiądz Pierre Chanel został zamordowany na Futunie; John Williams i jego towarzysz, misjonarz James Harris, zostali zjedzeni przez kanibali na wyspie Erromango; natomiast Carl Völkner został najpierw ścięty w Nowej Zelandii, po czym wódz wydłubał mu oczy i je połknął.\nPo takim niepowodzeniu minie około pięciu lat, zanim znajdzie się kolejny ochotnik gotowy wyruszyć na misję. Im więcej podejmiemy prób nawracania, tym większa będzie szansa, że następna zakończy się sukcesem."
 rapanui.104.g_cat: "Requiem aeternam dona eis, Domine."
 rapanui.104.g_pro: "Niech spoczywa w pokoju wiecznym."
 rapanui.105.t: "Misjonarz przybywa do [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag]"
 rapanui.105.d_cat: "Ojciec [SCOPE.sCharacter('rapanui_missionary_scope').GetFirstName] szczęśliwie dotarł do [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag]. Jak dotąd spotkał się z brakiem zainteresowania ze strony rdzennej ludności. Sam fakt, że wciąż żyje, można uznać za niewielki sukces. Jednak nadal czeka go wiele pracy."
 rapanui.105.d_pro: "Pastor [SCOPE.sCharacter('rapanui_missionary_scope').GetFullName] szczęśliwie dotarł do [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag]. Jak dotąd spotkał się z brakiem zainteresowania ze strony rdzennej ludności. Sam fakt, że wciąż żyje, można uznać za niewielki sukces. Jednak nadal czeka go wiele pracy."
 rapanui.105.f: "Po przybyciu niektórzy misjonarze musieli liczyć się z wrogością mieszkańców, którzy chcieli jak najszybciej ich przepędzić. Inni z kolei okazywali zainteresowanie, licząc na handel bronią lub dostęp do nowych technologii. Zdarzało się jednak również, że przesłanie Chrystusa spotykało się po prostu z obojętnością. Dla misjonarzy był to mimo wszystko dobry znak: w końcu żywi misjonarze mogli jeszcze czegoś dokonać, w przeciwieństwie do martwych."
 rapanui.105.g_cat: "Deo gratias."
 rapanui.105.g_pro: "Bogu niech będą dzięki."
 rapanui.106.t: "Życzliwe Przyjęcie Misjonarza"
 rapanui.106.d_cat: "Misja do [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] odniosła ogromny sukces. Ojciec [SCOPE.sCharacter('rapanui_missionary_scope').GetFirstName] został serdecznie przyjęty przez rdzenną ludność i mógł już ogłosić pierwsze chrzty."
 rapanui.106.d_pro: "Misja do [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] odniosła ogromny sukces. Pastor [SCOPE.sCharacter('rapanui_missionary_scope').GetFullName] został serdecznie przyjęty przez rdzenną ludność i mógł już ogłosić pierwsze chrzty."
 rapanui.106.f: "Stosunek rdzennej ludności do misjonarzy różnił się w zależności od wyspy. Oprócz wrogości i strachu niektórzy mieszkańcy okazywali również spontaniczne zainteresowanie. W Królestwie Mangarevy francuskim misjonarzom udało się w bardzo krótkim czasie nawrócić znaczną część ludności i ochrzcić tamtejszego króla. W ciągu roku od przybycia misjonarze nawrócili na chrześcijaństwo mieszkańców wysp Taravai, Aukena i Akamuru, wznieśli kościoły, a nawet przekonali wyspiarzy do noszenia tunik. W Rikitei zbudowano katedrę św. Michała, która stała się największym kościołem na wyspach południowego Pacyfiku."
 rapanui.106.g_cat: "Ad maiorem Dei gloriam!"
 rapanui.106.g_pro: "Na większą chwałę Bożą!"
 rapanui.111.t_cat: "Triumf Katolicyzmu"
 rapanui.111.t_pro: "Triumf Protestantyzmu"
 rapanui.111.d_cat: "Działalność naszego dobrego ojca [SCOPE.sCharacter('rapanui_missionary_scope').GetFirstName] w [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] trafiła na podatny grunt. Z początkowo skromnej działalności misyjnej rozwinęła się prężnie działająca wspólnota chrześcijańska."
 rapanui.111.d_pro: "Działalność naszego dobrego pastora [SCOPE.sCharacter('rapanui_missionary_scope').GetFullName] w [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] trafiła na podatny grunt. Z początkowo skromnej działalności misyjnej rozwinęła się prężnie działająca wspólnota chrześcijańska."
 rapanui.111.f: "Wraz z powstaniem silnej wspólnoty chrześcijańskiej misjonarzy nie można już tak łatwo wypędzić z kraju. Nawet miejscowy władca wkrótce będzie musiał ponownie rozważyć swój stosunek do chrześcijaństwa. Odtąd pytanie nie brzmi już, czy [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] przejdzie na chrześcijaństwo, lecz kiedy to nastąpi. Następnym celem musi być nawrócenie władcy, aby uczynić chrześcijaństwo religią państwową i tym samym przyspieszyć chrystianizację całego kraju."
 rapanui.112.t: "Misja katolicka ustanowiona na stałe"
 rapanui.113.t: "Misja protestancka ustanowiona na stałe"
 rapanui.112.d: "Misji chrześcijańskiej udało się na stałe zadomowić w naszym kraju. Od tej pory pozbycie się przybyszów będzie znacznie trudniejsze."
 rapanui.112.f: "Teraz, gdy niemal jedna trzecia ludności porzuciła dawną wiarę na rzecz chrześcijaństwa, pojawia się uzasadnione pytanie o to, jaka przyszłość czeka [ROOT.GetCountry.GetNameNoFlag]. Szybkie postępy chrystianizacji nie ustaną również w przyszłości. Podczas gdy szamani wyczekują dalszego rozwoju wydarzeń, niektórzy nawróceni na chrześcijaństwo przywódcy plemienni zaproponowali wykorzystanie tej okazji do modernizacji kraju."
 rapanui.112.g: "Powinniśmy uważnie obserwować ten rozwój wydarzeń."
 rapanui.112.h: "Powinniśmy być bardziej otwarci na obcych."
 rapanui.114.t: "Gniew Pogan"
 rapanui.114.d_cat: "Straszne wieści! Niedyplomatyczne zachowanie ojca [SCOPE.sCharacter('rapanui_missionary_scope').GetFirstName] w [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] sprowokowało bunt rdzennej ludności przeciwko niemu. Buntownicy podpalili placówkę misyjną i zabili księdza!"
 rapanui.114.d_pro: "Straszne wieści! Niedyplomatyczne zachowanie pastora [SCOPE.sCharacter('rapanui_missionary_scope').GetFullName] w [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] sprowokowało bunt rdzennej ludności przeciwko niemu. Buntownicy podpalili placówkę misyjną i zabili misjonarza!"
 rapanui.114.f: "Działalność misyjna często wymaga odpowiedniego wyważenia stanowczego egzekwowania zasad i zręcznej dyplomacji. W wielu przypadkach nadgorliwi misjonarze ginęli, zanim zdołali ukończyć swoje dzieło. Na Morzach Południowych szczególnie misjonarze ewangeliccy słynęli ze stosowania radykalnych metod nawracania ludności, co prowadziło albo do wielkich sukcesów, albo do tragicznych niepowodzeń. W przypadku naszego misjonarza doszło niestety do tego drugiego."
 rapanui.115.t: "Misja katolicka zlikwidowana"
 rapanui.115.d: "Niewłaściwe postępowanie zagranicznych misjonarzy już zbyt długo wystawiało cierpliwość naszego ludu na próbę. Powstanie ludowe obróciło placówkę misyjną w gruzy, a wraz z nią zginął misjonarz."
 rapanui.115.f: "Najwyraźniej Europejczycy postępowali zbyt nieostrożnie. Zamiast nawrócić miejscową ludność, nastawili ją przeciwko sobie. Po tych wydarzeniach wielu naszych rodaków powróciło do dawnej wiary. Wygląda na to, że całe to chrześcijaństwo jest zwykłym szarlataństwem."
 rapanui.115.g: "Zasłużyli sobie na to."
 rapanui.116.t: "Misja Protestancka Zlikwidowana"
 rapanui.122.t: "Tłumaczenie Biblii"
 rapanui.122.d: "[SCOPE.sCharacter('rapanui_missionary_scope').GetFullName], nasz misjonarz w [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag], przetłumaczył Biblię na język rdzennej ludności. Ułatwi to nawracanie mieszkańców na wiarę chrześcijańską."
 rapanui.122.f: "Już na początku działalności pierwsi misjonarze na wyspach Pacyfiku sporządzali zapiski, na podstawie których tworzyli słowniki, a później również tłumaczyli Biblię na miejscowe języki. Nadmierna gorliwość mogła jednak przynieść niektórym misjonarzom więcej szkody niż pożytku."
 rapanui.122.g: "Pomoże to w nawracaniu miejscowej ludności."
 rapanui.122.h: "To odpowiedni moment, aby rozpocząć nową inicjatywę misyjną."
 rapanui.123.t: "Handlarze Niewolników Napadają na Wyspę Misyjną"
 rapanui.123.d: "Handlarze niewolników z [SCOPE.sCountry('rapanui_slaver_country').GetNameNoFlag] najechali [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag]. Nasz misjonarz [SCOPE.sCharacter('rapanui_missionary_scope').GetFullName] pilnie apeluje do nas o interwencję w celu powstrzymania najazdów."
 rapanui.123.f: "Aż do drugiej połowy XIX wieku handlarze niewolników, zwłaszcza peruwiańscy, nierzadko uprowadzali całą ludność poszczególnych wysp. Ten sposób pozyskiwania taniej siły roboczej był znacznie brutalniejszy niż proceder zwany „blackbirdingiem”, szczególnie rozpowszechniony w północnej Australii. Najazdy te stanowiły poważny problem dla misjonarzy, ponieważ trudno było przekonać wyspiarzy do przyjęcia chrześcijaństwa, gdy ludzie nominalnie wyznający tę religię bez skrupułów polowali na niewolników. Wydarzenia te nadały nowy impuls ruchowi abolicjonistycznemu, który cieszył się szerokim poparciem zarówno wśród duchowieństwa katolickiego, jak i protestanckiego."
 rapanui.123.g: "To nie nasza sprawa."
 rapanui.123.h: "Musimy natychmiast położyć kres temu nieludzkiemu procederowi!"
 rapanui.124.t: "Bałwochwalstwo"
 rapanui.124.d: "W [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] wciąż żyje wielu przedstawicieli rdzennej ludności, którzy oddają cześć bożkom. [SCOPE.sCharacter('rapanui_missionary_scope').GetFullName] zamierza pójść za przykładem świętego Bonifacego."
 rapanui.124.f: "Niszczenie bożków lub miejsc świętych zawsze głęboko wstrząsało ludami pierwotnymi. Niektórzy postrzegali to jako dowód, że chrześcijański Bóg musi być potężniejszy od ich bóstw, inni zaś uznawali to za powód do jeszcze zacieklejszej walki z chrześcijaństwem. Niektórzy miłośnicy sztuki zwracali jednak uwagę, że pogańskie wizerunki mogłyby znaleźć lepsze miejsce gdzie indziej."
 rapanui.124.g: "Zniszczcie bożki!"
 rapanui.124.h: "Pozbądźcie się ich dyskretnie."
 rapanui.124.i: "Nie dotykajcie ich."
 rapanui.125.t: "Kult Przodków"
 rapanui.125.d: "W [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] zaostrza się spór o to, jak należy postępować z miejscowym kultem przodków. Utrzymywanie się tego kultu znacznie utrudnia działalność misyjną."
 rapanui.125.f: "Podobnie jak w wielu innych częściach świata, kult przodków stanowił centralny element życia duchowego. Misjonarze katoliccy musieli zmierzyć się z tym problemem już kilka stuleci wcześniej i początkowo pomijali kwestię przyszłości tego kultu. Natomiast misjonarze protestanccy wykazywali się szczególną nieustępliwością wobec kultu przodków. Mimo to w niektórych częściach Polinezji kult ten pozostaje rozpowszechniony do dziś."
 rapanui.125.g: "Podobnie jak w wielu innych częściach świata, kult przodków stanowił centralny element życia duchowego. Misjonarze katoliccy musieli zmierzyć się z tym problemem już kilka stuleci wcześniej i początkowo pomijali kwestię przyszłości tego kultu. Natomiast misjonarze protestanccy wykazywali się szczególną nieustępliwością wobec kultu przodków. Mimo to w niektórych częściach Polinezji kult ten pozostaje rozpowszechniony do dziś."
 rapanui.125.h: "Znajdziemy możliwe do zastosowania rozwiązanie tymczasowe."
 rapanui.126.t: "Synkretyzm"
 rapanui.126.d: "Pomimo wszelkich wysiłków, by temu zapobiec, misjonarz [SCOPE.sCharacter('rapanui_missionary_scope').GetFullName] musi przyznać w swoim ostatnim raporcie, że w [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] powstała wspólnota synkretyczna, łącząca elementy animizmu i chrześcijaństwa."
 rapanui.126.f: "Synkretyzm od zawsze stanowił problem dla misjonarzy. Niektórzy postrzegali go jako etap przejściowy, który można przezwyciężyć w dalszym procesie nawracania. Inni widzieli w tej herezji zło jeszcze większe niż sama religia, od której starano się odwieść miejscową ludność. Niemniej jednak ruchy synkretyczne stanowiły i nadal stanowią ważny element tożsamości wielu ludzi, dlatego tłumienie takich wierzeń prowadzi do napięć. Zjawiska te mają również interesujące cechy kulturowe i artystyczne, które od zawsze fascynowały antropologów i miłośników sztuki."
 rapanui.126.g: "Tę herezję trzeba wykorzenić!"
 rapanui.126.h: "Potrzebują więcej czasu, aby to zrozumieć."
 rapanui.126.i: "Ta synkretyczna kultura jest bardzo interesująca."
 rapanui.127.t: "Chór Chłopięcy Pana [SCOPE.sCharacter('rapanui_missionary_scope').GetLastName]"
 rapanui.127.d: "Chór kościelny w [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag], złożony z miejscowych chłopców, prezentuje zaskakująco wysoki poziom."
 rapanui.127.f: "'Vita vita nostra tellus nostra sic clamant sic\nVita vita nostra tellus nostra vita nostra clamant\nPoena poena nostra vires nostra poena nostra sic\nPoena poena nostra vires nostra poena nostra clamant\nIra ira nostra fides nostra ira nostra sic.\nIra ira nostra fides nostra ira nostra clamant.\nVita vita nostra tellus nostra vita nostra sic.'"
 rapanui.127.g: "Ukaże to miejscowej ludności piękno wiary."
 rapanui.127.h: "Przyniesie to ukojenie duszom miejscowej ludności."
 rapanui.127.i: "Ta muzyka musi zabrzmieć w Europie!"
 rapanui.128.t: "Masowy Chrzest"
 rapanui.128.d_cat: "Ojciec [SCOPE.sCharacter('rapanui_missionary_scope').GetFirstName] donosi z [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] o niezwykłym masowym chrzcie, który odbył się po tym, jak miejscowy klan wraz ze wszystkimi swoimi członkami przyjął wiarę w Jezusa Chrystusa."
 rapanui.128.d_pro: "Pastor [SCOPE.sCharacter('rapanui_missionary_scope').GetFullName] donosi z [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] o niezwykłym masowym chrzcie, który odbył się po tym, jak miejscowy klan wraz ze wszystkimi swoimi członkami przyjął wiarę w Jezusa Chrystusa."
 rapanui.128.f_cat: "Credo in unum Deum,\nPatrem omnipotentem,\nfactorem caeli et terrae,\nvisibilium omnium, et invisibilium\net in unum Dominum Iesum, Christum,\nFilium Dei unigenitum\net ex Patre natum ante omnia saecula."
 rapanui.128.f_pro: "Wierzę w jednego Boga,\nOjca wszechmogącego,\nStworzyciela nieba i ziemi,\nwszystkich rzeczy widzialnych i niewidzialnych.\nI w jednego Pana, Jezusa Chrystusa,\nSyna Bożego Jednorodzonego,\nktóry z Ojca jest zrodzony przed wszystkimi wiekami."
 rapanui.128.g: "Amen."
 rapanui.129.t: "Choroby w [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag]"
 rapanui.129.d: "Mieszkańcy [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] skarżą się na tajemniczą chorobę, która pustoszy wyspy, i obwiniają naszych misjonarzy o sprowadzenie jej na wyspę."
 rapanui.129.f: "Wraz z przybyciem europejskich osadników, misjonarzy i kupców na wyspy dotarły również nieznane wcześniej choroby. Należały do nich grypa, zapalenie płuc, odra, świnka, szkarlatyna, ospa prawdziwa, krztusiec i zwykłe przeziębienie. Tradycyjna medycyna nie była jednak w stanie wiele zdziałać przeciwko tym chorobom. Zbieżność pojawienia się epidemii z początkiem chrześcijańskiej działalności misyjnej sprawiła, że wielu mieszkańców zaczęło wątpić w sens przyjmowania chrztu, skoro chrześcijański Bóg najwyraźniej niewiele mógł zdziałać w obliczu zarazy."
 rapanui.129.g: "To dzieło diabła."
 rapanui.130.t: "Misjonarz Umiera na Malarię"
 rapanui.130.d_cat: "Smutne wieści z [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag]: ojciec [SCOPE.sCharacter('rapanui_missionary_scope').GetFirstName] zmarł na chorobę tropikalną. Jego odważne zaangażowanie i kierowanie tamtejszą działalnością misyjną nie zostaną zapomniane."
 rapanui.130.d_pro: "Smutne wieści z [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag]: pastor [SCOPE.sCharacter('rapanui_missionary_scope').GetFullName] zmarł na chorobę tropikalną. Jego odważne zaangażowanie i kierowanie tamtejszą działalnością misyjną nie zostaną zapomniane."
 rapanui.130.f: "Misjonarze w Oceanii nie tylko ponosili śmierć męczeńską. Podobnie jak rdzenna ludność umierała na choroby przywiezione z Europy, tak Europejczycy ginęli z powodu chorób występujących na wyspach. Działalność misyjna będzie kontynuowana, a następca został już wyznaczony. Jednak w tym roku nie będą prowadzone żadne działania mające na celu nawracanie ludności."
 rapanui.132.t: "Skuteczni Misjonarze"
 rapanui.132.d: "Nowi misjonarze, których wysłaliśmy do [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag], okazali się wyjątkowo uzdolnieni. Ich działalność misyjna przynosi lepsze rezultaty, niż oczekiwano."
 rapanui.132.f: "'Przypomnijcie sobie, czego Ewangelia dokonała dla bliskich krewnych tych samych tubylców. Na naszej wyspie Aneityum 3500 kanibali porzuciło swoje pogańskie wierzenia... Na Fidżi 79 000 kanibali znalazło się pod wpływem Ewangelii, a 13 000 członków Kościołów deklaruje, że żyje i pracuje dla Jezusa. Na Samoa 34 000 kanibali przyjęło chrześcijaństwo, a tamtejsze kolegium w ciągu dziewiętnastu lat wykształciło i wysłało 206 miejscowych nauczycieli i ewangelizatorów. Na naszych Nowych Hebrydach ponad 12 000 kanibali przyprowadzono do stóp Chrystusa, choć nie twierdzę, że wszyscy są wzorowymi chrześcijanami. Ponadto 133 mieszkańców wysp przeszkolono i wysłano jako nauczycieli i głosicieli Ewangelii.' – John G. Paton"
 rapanui.132.g: "Wykonują dzieło Boże."
 rapanui.133.t: "Nowi Misjonarze w [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag]"
 rapanui.133.d: "Po przybyciu do placówki misyjnej nowi misjonarze od razu przystąpili do pracy i mogą już pochwalić się pierwszymi sukcesami."
 rapanui.133.f: "Cały ich kult opierał się na strachu, a jego celem było przebłaganie tego czy innego złego ducha, aby zapobiec nieszczęściu lub zapewnić sobie zemstę. Ubóstwiali swoich wodzów, przez co niemal każda wioska lub plemię miały własnego świętego męża. Ci wioskowi i plemienni kapłani wywierali niezwykle zgubny wpływ na ludność, a wierzono, że dzięki swoim świętym obrzędom mają władzę nad życiem i śmiercią. Oddawali również cześć duchom zmarłych przodków i bohaterów za pośrednictwem drewnianych i kamiennych bożków. Bali się duchów i zabiegali o ich pomoc, szczególnie starając się przebłagać te, które sprawowały władzę nad wojną i pokojem, głodem i dostatkiem, zdrowiem i chorobą, zagładą i pomyślnością, życiem i śmiercią. Cały ich kult był przepełniony niewolniczym strachem, a z tego, co udało mi się ustalić, nie mieli żadnego pojęcia o Bogu miłosiernym i łaskawym. – John G. Paton"
 rapanui.133.g: "Wykonują dobrą pracę."
 rapanui.134.t: "Niekompetentni Misjonarze?"
 rapanui.134.d: "Pomimo wysłania nowej grupy misjonarzy do [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] nasze wysiłki na rzecz nawracania miejscowej ludności przyniosły jedynie niewielkie rezultaty."
 rapanui.134.f: "Moi wrogowie rzadko porzucali swoje nienawistne zamiary pozbawienia mnie życia, nawet jeśli na pewien czas udawało się ich uspokoić lub udaremnić ich plany... Pewien dziki wódz przez cztery godziny chodził za mną z naładowanym muszkietem i choć wielokrotnie mierzył do mnie z broni, Bóg powstrzymywał jego rękę. Przemawiałem do niego życzliwie i zajmowałem się swoją pracą, jakby w ogóle go tam nie było, głęboko przekonany, że mój Bóg postawił mnie w tym miejscu i będzie mnie chronił, dopóki nie wypełnię powierzonego mi zadania. Nieustannie wznosząc modlitwy do naszego drogiego Pana Jezusa, powierzyłem wszystko w Jego ręce i czułem się nieśmiertelny, dopóki moje dzieło nie zostanie ukończone. Próby i ocalenia o włos od śmierci umacniały moją wiarę i zdawały się jedynie dodawać mi sił do stawienia czoła kolejnym niebezpieczeństwom, które następowały jedno po drugim. – John G. Paton"
 rapanui.134.g: "Co oni w ogóle robią?"
 rapanui.135.t: "Handluj z Rdzenną Ludnością"
 rapanui.135.d: "Po nawiązaniu kontaktu z miejscowym władcą pojawia się pytanie, czym możemy z nim handlować. Oferuje on cenny artefakt, [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animal|q$')] lub drogocenne perły."
 rapanui.135.f: "Handel przynosi korzyści obu stronom: w zamian rdzenne państwo otrzymuje premię technologiczną."
 rapanui.135.g: "Interesuje nas artefakt."
 rapanui.135.h: "Wybieramy zwierzę."
 rapanui.135.i: "Podobają nam się perły."
 rapanui.136.t: "Manta"
 rapanui.136.d: "Rdzenna ludność przysłała nam wspaniałą olbrzymią płaszczkę, którą jeszcze tego samego dnia wysłaliśmy do kraju."
 rapanui.136.f: "Olbrzymia manta to fascynujące i egzotyczne zwierzę, które stało się nową atrakcją w naszym Zoo. Jest jednym z charakterystycznych przedstawicieli fauny Australii i Oceanii."
 rapanui.136.g: "Wspaniale!"
 rapanui.137.t: "Żółw Jadalny"
 rapanui.137.d: "Rdzenna ludność przysłała nam wspaniałego żółwia morskiego, którego jeszcze tego samego dnia wysłaliśmy do kraju."
 rapanui.137.f: "Żółw zielony to fascynujące i egzotyczne zwierzę, które stało się nową atrakcją w naszym Zoo. Jest jednym z charakterystycznych przedstawicieli fauny Australii i Oceanii."
 rapanui.138.t: "Dyskredytacja Zakończona Sukcesem"
 rapanui.138.d: "Dzięki pomocy kilku przekupionych świadków spośród rdzennej ludności oraz umiejętnościom retorycznym naszego misjonarza udało nam się przekonać niektóre miejscowe klany o złowrogich zamiarach konkurencyjnej placówki misyjnej."
 rapanui.138.f: "Spory między konkurencyjnymi placówkami misyjnymi, zwłaszcza protestanckimi i katolickimi, często przeradzały się w konflikty, które kończyły się wypędzeniem jednej ze stron przez miejscowego władcę po jego nawróceniu. Na Tahiti zatargi doprowadziły nawet do wojny na pełną skalę, gdy protestanccy mieszkańcy wyspy wystąpili przeciwko katolickim misjonarzom, którzy znajdowali się pod ochroną Francji. Wydarzenia te stały się wstępem do francuskiej interwencji wojskowej na Tahiti. Tymczasem Wielka Brytania, uważana za protektora schrystianizowanego przez siebie Tahiti, nie zamierzała dać się wciągnąć w konflikt z powodu kilku wysp."
 rapanui.139.t: "Dyskredytacja Obraca się Przeciwko Nam"
 rapanui.139.d: "Pomimo naszych najlepszych intencji, by ostrzec nasze owieczki – oraz tych, które wkrótce mają dołączyć do naszej owczarni – przed złowrogimi zamiarami konkurencyjnej placówki misyjnej, niestety nie chciano nam uwierzyć. Wręcz przeciwnie: teraz jesteśmy postrzegani jako obłudni wichrzyciele, którzy pragną zakłócić spokój na wyspie!"
 rapanui.139.g: "Nie poszło zgodnie z planem."
 rapanui.140.t: "Wrobieni!"
 rapanui.140.d: "Konkurencyjna placówka misyjna w [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] zaszkodziła naszej dobrej reputacji, oskarżając nas o wykorzystywanie działalności misyjnej wyłącznie do wywierania wpływów politycznych i manipulowania miejscową ludnością. Nasze szanse na nawracanie mieszkańców znacznie się zmniejszyły!"
 rapanui.140.g: "I ci ludzie nazywają siebie chrześcijanami?"
 rapanui.141.t_cat: "[SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] przyjmuje Wiarę Katolicką"
 rapanui.141.t_pro: "[SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] przyjmuje Wiarę Protestancką"
 rapanui.141.d_cat: "Podczas uroczystej mszy świętej władca [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] wyznał wiarę w Jezusa Chrystusa i przyjął katolicyzm. Tym samym działalność misyjna ojca [SCOPE.sCharacter('rapanui_missionary_scope').GetLastName] osiągnęła swój szczyt."
 rapanui.141.d_pro: "Nasz misjonarz, pastor [SCOPE.sCharacter('rapanui_missionary_scope').GetFullName], ochrzcił dziś w imię Pana władcę [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag]. Tym samym misja chrześcijańska w tym kraju pokonała ostatnią przeszkodę."
 rapanui.141.f: "Po nawróceniu władcy niegdyś pogańskiego kraju sam podejmie on starania, aby nawrócić swój lud na prawdziwą wiarę. [SCOPE.sCharacter('rapanui_missionary_scope').GetFullName] pozostanie jeszcze przez pewien czas na miejscu, aby wspierać ten proces jako doradca, lecz w niedalekiej przyszłości powróci do ojczyzny. Wraz z przyjęciem chrześcijaństwa [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] zwróciło się również do nas z prośbą o ochronę i wydaliło z kraju misjonarzy innych wyznań. Wielkie mocarstwa uznają nasze wpływy w tym kraju, które w przyszłości możemy przekształcić w bezpośrednie panowanie. Nasza bezpośrednia działalność misyjna na miejscu dobiegła końca, ale być może istnieją inne zakątki świata, które pilnie potrzebują teraz przesłania Jezusa Chrystusa."
 rapanui.141.g_cat: "In Nomine Domini Nostri, Iesu Christi."
 rapanui.141.g_pro: "W imię naszego Pana, Jezusa Chrystusa."
 rapanui.142.t: "Chrzest [SCOPE.sCharacter('rapanui_ruler').GetFullName]"
 rapanui.142.d: "Wraz z przejściem [SCOPE.sCharacter('rapanui_ruler').GetFullName] na katolicyzm chrystianizacja naszego kraju stała się przesądzona. Nawrócony władca uczynił nawrócenie swojego ludu najwyższym priorytetem."
 rapanui.143.d: "Wraz z przejściem [SCOPE.sCharacter('rapanui_ruler').GetFullName] na protestantyzm chrystianizacja naszego kraju stała się przesądzona. Nawrócony władca uczynił nawrócenie swojego ludu najwyższym priorytetem."
 rapanui.142.f: ""
 rapanui.144.t_cat: "[SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] przechodzi na heretycki Protestantyzm"
 rapanui.144.t_pro: "[SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] przechodzi na heretycki Katolicyzm"
 rapanui.144.d_cat: "Po tym, jak władca [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] przyjął chrzest z rąk protestanckiego misjonarza, nasze wysiłki na rzecz nawrócenia miejscowej ludności można ostatecznie uznać za niepowodzenie."
 rapanui.144.d_pro: "Po tym, jak władca [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] przyjął chrzest z rąk katolickiego misjonarza, nasze wysiłki na rzecz nawrócenia miejscowej ludności można ostatecznie uznać za niepowodzenie."
 rapanui.144.f: "Wszelkie wysiłki mające na celu nawrócenie miejscowej ludności na prawdziwą wiarę poszły na marne. Wraz z nawróceniem władcy mocarstwo wspierające tych fałszywych kaznodziejów również zyskało wpływy na wyspach i wkrótce może doprowadzić do wypędzenia naszych misjonarzy. Po tej zmianie polityki będziemy musieli wycofać naszych misjonarzy i przekonać się, czy inne państwo okaże się bardziej otwarte na przyjęcie prawdziwej wiary."
 rapanui.144.g_cat: "To dzieło diabła."
 rapanui.144.g_pro: "To dzieło diabła."
 rapanui.146.t: "Handluj z Cudzoziemcami"
 rapanui.146.d: "Negocjatorzy z placówki misyjnej obcego państwa przedstawili nam ofertę handlową. Możemy wybrać to, co najbardziej nas interesuje."
 rapanui.146.f: "Handel przynosi korzyści obu stronom: w zamian obce państwo otrzymuje artefakt, zwierzę lub perły."
 rapanui.146.g: "Nowe techniki rolnicze."
 rapanui.146.h: "Nowoczesna broń."
 rapanui.146.i: "Więcej edukacji."
 rapanui.151.t: "Misjonarz Zbiera Materiały Folklorystyczne"
 rapanui.151.d: "Nasz misjonarz w [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] zebrał opowieści, pieśni i mity miejscowej ludności, aby lepiej zrozumieć jej sposób myślenia oraz kulturowe uwarunkowania."
 rapanui.151.f: "Podczas gdy niektórzy misjonarze uważali się za kontynuatorów dzieła świętego Bonifacego i zaciekle zwalczali osobliwości kultury rdzennej ludności, istnieli również uczeni, którzy najpierw starali się poznać miejscową kulturę, aby odnaleźć w niej punkty wspólne z chrześcijaństwem, które mogliby później wykorzystać do skuteczniejszego nawracania mieszkańców na wiarę w Chrystusa. Metodę tę stosowali między innymi jezuici. Gromadzone materiały często miały ogromne znaczenie dla późniejszego poznawania miejscowych tradycji, ponieważ misjonarze jako pierwsi utrwalali je na piśmie. Jednocześnie w Europie rosło zainteresowanie egzotycznymi kulturami i ich zwyczajami."
 rapanui.151.g: "Wykorzystaj tę wiedzę do nawracania miejscowej ludności."
 rapanui.151.h: "Ta kolekcja powinna trafić do muzeum."
 rapanui.152.t: "Szkoła Chrześcijańska"
 rapanui.152.d: "Wraz z założeniem szkoły misyjnej w [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] poczyniono ważny krok na drodze do chrystianizacji kraju i rozwoju oświaty."
 rapanui.152.f: "Szkoły chrześcijańskie odegrały ważną rolę w stopniowym wprowadzaniu do odizolowanej od reszty świata Oceanii zachodniego modelu edukacji, przyczyniając się tym samym do upowszechnienia umiejętności czytania i pisania wśród rdzennej ludności. Obok zaniku kanibalizmu i waśni plemiennych zakładanie szkół uznaje się za jeden z najważniejszych pozytywnych skutków ubocznych działalności misyjnej."
 rapanui.152.g: "Non scholae, sed vitae discimus."
 rapanui.153.t: "Konflikt z Heretyckim Misjonarzem"
 rapanui.153.d: "Agresywne działania jednego z misjonarzy zaostrzyły istniejący konflikt z konkurencyjną placówką misyjną. Twierdzi on, że grupa rdzennej ludności należy do jego katechumenów, a nie do naszej wspólnoty."
 rapanui.153.f: "Niestety, chrześcijańska opowieść o tym, jak wraz z przybyciem misjonarzy położono kres krwiożerczym praktykom kanibali i waśniom plemiennym, miała również oczywiste słabości: antagonizmy między wyznaniami prowadziły do sporów, które wcześniej nie istniały."
 rapanui.153.g: "To nasi katechumeni."
 rapanui.153.h: "Nadstaw drugi policzek."
 rapanui.154.t: "Placówka Handlowa"
 rapanui.154.d: "W działaniu wyraźnie wymierzonym przeciwko nam konkurencyjna placówka misyjna w [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] wsparła utworzenie placówki handlowej swojego państwa, prawdopodobnie w nadziei na silniejsze związanie ze sobą rdzennej ludności poprzez nikczemne pokusy konsumpcji."
 rapanui.154.f: "Czasami świąteczne prezenty mają większe znaczenie w nawracaniu na chrześcijaństwo niż nudna Biblia."
 rapanui.154.g: "Zbudujemy własną placówkę handlową!"
 rapanui.155.t: "Przywilej dla Rywala"
 rapanui.155.d: "Konkurencyjny misjonarz otrzymał przywilej pełnienia funkcji doradcy władcy na jego dworze. Jest to nie tylko poważna zniewaga, ale może również podważyć naszą pozycję w [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag]."
 rapanui.155.f: "Misjonarze, którym udało się zdobyć zaufanie władcy, często byli zatrudniani jako doradcy ze względu na swoje wykształcenie, kontakty dyplomatyczne, a także nadzieję na przekazanie wiedzy. Nie oznaczało to koniecznie rzeczywistej chęci przyjęcia chrześcijaństwa, ale przynajmniej wzmacniało pozycję państwa, z którego pochodził misjonarz. Budziło to wielkie niezadowolenie konkurencyjnych wyznań, które poprzez wywieranie wpływu na władcę liczyły na ustanowienie nieformalnych protektoratów."
 rapanui.155.g: "Domagamy się takich samych przywilejów."
 rapanui.171.t: "Kryzys w Raju"
 rapanui.171.d: "Konflikt między zagranicznymi misjonarzami osiągnął niebezpieczny poziom. Spór polityczny wydaje się nieunikniony."
 rapanui.171.f: "W pewnym momencie nieporozumienia między misjonarzami różnych wyznań mogły przerodzić się w konflikt polityczny. Najbardziej znanym tego przykładem jest Tahiti. W obawie przed interwencją miejscowy władca mógł zdecydować się na przyjęcie jednego z dwóch wyznań, licząc przynajmniej na wsparcie mocarstwa będącego jego protektorem w razie interwencji zbrojnej, wobec której jego państwo byłoby bezsilne. Ochrona ze strony protektora nie była gwarantowana, ale dawała przynajmniej szansę na przetrwanie, zamiast zostać sprowadzonym do roli zwykłej kolonii."
 rapanui.171.g: "Przejdź na Katolicyzm"
 rapanui.171.h: "Przejdź na Protestantyzm"
 rapanui.172.t: "Kryzys w Raju"
 rapanui.172.d: "Sytuacja w [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] uległa zaostrzeniu. Miejscowy władca przyjął heretyckie wyznanie konkurencyjnej placówki misyjnej. Niektórzy politycy już domagają się interwencji morskiej."
 rapanui.172.f: "Wraz z przejściem władcy na inne wyznanie wypędzenie naszych misjonarzy jest tylko kwestią czasu: wkrótce nowo ustanowiona religia państwowa zakaże im dalszego pobytu w kraju. Nasze ambicje trwałego nawrócenia mieszkańców wyspiarskiego państwa na prawdziwą wiarę i zdobycia tam wpływów doznały poważnego ciosu, ale sytuacja nie jest całkowicie beznadziejna. Sprawa ta daje nam doskonały pretekst do bezpośredniej interwencji zbrojnej w [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] i narzucenia naszych przekonań – zarówno politycznych, jak i religijnych. Oczywiście, jeśli nowy protektor tego państwa stanie w obronie swoich świeżo pozyskanych współwyznawców, konflikt może przerodzić się w otwartą wojnę, wykraczającą daleko poza wybrzeża [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag]..."
 rapanui.172.g: "Te odległe wyspy nie są warte nawet kości jednego [ROOT.GetCountry.GetAdjectiveNoFlag] marynarza."
 rapanui.172.h: "Prestiż naszego narodu jest zagrożony!"
 rapanui.173.t: "Kryzys w Raju"
 rapanui.173.d: "W wyniku zaostrzenia sytuacji w [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] tamtejszy władca przeszedł na naszą wiarę. Jednak państwo prowadzące konkurencyjną placówkę misyjną nie zamierza się z tym pogodzić i grozi inwazją zbrojną, aby narzucić swoje przekonania."
 rapanui.173.f: "Pytanie o to, ile warta jest dla nas kontrola nad kilkoma wyspami na Pacyfiku, stało się dziś bardziej aktualne niż kiedykolwiek: czy jesteśmy gotowi przystąpić do wojny w obronie nowo zdobytego protektoratu? W każdym razie nasz rywal pokazuje pazury. W tej sytuacji utrzymanie kontroli nad [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] może stać się kwestią honoru narodowego."
 rapanui.173.g: "Niestety, taki konflikt nadmiernie obciążyłby nasze zasoby."
 rapanui.173.h: "Oczywiście, że przyjdziemy z pomocą naszemu nowemu protegowanemu."
 rapanui.174.t: "Protektor, który nie zapewnia ochrony"
 rapanui.174.d: "Nasze rzekome „mocarstwo opiekuńcze” uznało, że obrona nas w nadchodzącej wojnie byłaby zbyt niebezpieczna."
 rapanui.174.f: "Nawet po udanych misjach i przyjaznym, wzajemnym wsparciu podczas lokalnych konfliktów państwo, które nawróciło jeden z ludów południowego Pacyfiku, niekoniecznie było zainteresowane jego ochroną przed innymi wielkimi mocarstwami. Dlatego gdy katolicka Francja uznała, że naruszono jej strefę wpływów w tym regionie, Wielka Brytania powstrzymała się od obrony Tahiti, którego mieszkańców nawróciła na protestantyzm. Londyn uznał roszczenia Francuzów, również dlatego, że nie chciał rozpoczynać wojny światowej z powodu kilku odległych wysp."
 rapanui.174.g: "Mimo wszystko będziemy walczyć o naszą wolność!"
 rapanui.174.h: "Poddajemy się, zanim stanie się coś gorszego."
 rapanui.175.t: "Zwycięstwo Dyplomatyczne"
 rapanui.175.d: "Nasze zastraszanie wystarczyło, by złamać wolę władcy [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag]. Przyjmie on naszą religię i zwróci się do nas z prośbą o ochronę."
 rapanui.175.f: "Jeśli mocarstwo opiekuńcze nie zdecyduje się na interwencję, a miejscowy władca cofnie swoją decyzję dotyczącą religii, pojawia się rzadka szansa na bezkrwawe zakończenie konfliktu."
 rapanui.175.g: "Najlepszy możliwy wynik."
 rapanui.176.t: "[SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] przygotowuje się do wojny"
 rapanui.176.d: "Pomimo zdrady ze strony nowego protektora rdzenna ludność jest gotowa stanąć przeciwko nam do wojny w obronie swojej wolności."
 rapanui.176.f: "Chociaż nasza interwencja nie doprowadzi do konfliktu między wielkimi mocarstwami, walka rdzennej ludności o wolność może okazać się znacznie bardziej zaciekła, niż można by oczekiwać po zwykłym powstaniu ludów pierwotnych."
 rapanui.176.g: "A więc wojna."
 rapanui.177.t: "Nowy Brat w Chrystusie"
 rapanui.177.d: "W obliczu narastającego konfliktu między misjonarzami protestanckimi a katolickimi władca COUNTRY zdecydował się przyjąć nasze wyznanie, aby zwrócić się do nas z prośbą o ochronę."
 rapanui.177.f: "Udało nam się przeforsować nasze interesy bez rozlewu krwi. Konkurencyjni misjonarze uznali nasze roszczenia do tej strefy wpływów i już pakują swoje rzeczy. W przyszłości nie będą już stać nam na drodze."
 rapanui.177.g: "Nawrócenie to nawrócenie."
 rapanui.178.t: "Koniec Wojny w Raju"
 rapanui.178.d: "Udało nam się przeforsować nasze interesy w [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag]. Władca wraz ze swoim narodem podda się naszemu panowaniu i przyjmie naszą religię. [SCOPE.sCountry('rapanui_mission_country').GetRuler.GetHerHis]"
 rapanui.178.f: "Niektórzy muszą dostać bolesną nauczkę. Później podziękują nam za ten akt miłosierdzia."
 rapanui.201.t: "Przywódca Wyprawy"
 rapanui.201.d: "[concept_dubois_pacific_expedition] wymaga doświadczonego admirała. Do udziału w tym przedsięwzięciu może zgłosić się maksymalnie trzech kandydatów."
 rapanui.201.f: "Admirał powracający z wyprawy powinien znacznie zwiększyć swoje doświadczenie podczas podróży, jednak w czasie swojej nieobecności nie będzie dostępny, gdyby wybuchła wojna."
 rapanui.201.g: "[SCOPE.sCharacter('rapanui_pacific_expedition_leader_1').GetFullName]"
 rapanui.201.h: "[SCOPE.sCharacter('rapanui_pacific_expedition_leader_2').GetFullName]"
 rapanui.201.i: "[SCOPE.sCharacter('rapanui_pacific_expedition_leader_3').GetFullName]"
 rapanui.202.t: "Priorytet Wyprawy"
 rapanui.202.d: "Nadal nie ma zgody co do tego, czy wyprawa badawcza powinna mieć określony priorytet, a jeśli tak, na której dziedzinie powinna się koncentrować."
 rapanui.202.f: "Specjalizacja zapewni nam przewagę w odpowiednich dziedzinach badań. Zwiększy się prawdopodobieństwo wystąpienia określonych wydarzeń. Wojsko odniosłoby szczególne korzyści z poszerzenia naszej wiedzy oceanograficznej, a nauki społeczne z badań biologicznych. Wielkie mocarstwa mogą również realizować swoje imperialne ambicje i podejmować działania zwiększające ich prestiż oraz wpływy w regionie."
 rapanui.202.g: "To ogólna wyprawa badawcza."
 rapanui.202.h: "Prowadzimy głównie badania oceanograficzne."
 rapanui.202.i: "Chcemy dowiedzieć się więcej o cudach natury."
 rapanui.202.j: "Reputacja naszego narodu jest ważniejsza niż robaki czy eksperymenty."
 rapanui.203.t: "Naukowiec Towarzyszący"
 rapanui.203.d: "Istnieje możliwość dołączenia do wyprawy naukowca specjalisty, pod warunkiem że posiada on odpowiednie kwalifikacje. Poszukiwani są geodeci, przyrodnicy, paleontolodzy oraz [Concept('concept_verrier_astronomer','$concept_verrier_astronomers|q$')]."
 rapanui.203.f: "Wyprawy na Pacyfik słynęły z zabierania na pokład licznych uczonych reprezentujących najróżniejsze dziedziny nauki, którzy po powrocie poszerzali horyzonty swoich kolegów pozostających w ojczyźnie. Wprawdzie podczas wypraw zajmowano się przede wszystkim obserwacjami i gromadzeniem zbiorów, a analiza zgromadzonych materiałów odbywała się zazwyczaj dopiero po powrocie do kraju. Choć marynarze spoglądali na „zbieraczy robaków” z pewną pogardą, to właśnie ci skrupulatni badacze często dokonywali wybitnych odkryć naukowych dzięki pomiarom głębin morskich, eksperymentom magnetycznym czy obserwacjom tranzytu Wenus."
 rapanui.203.g: "Nie potrzebujemy kolejnego naukowca."
 rapanui.203.h: "Potrzebujemy geodety. [SCOPE.sCharacter('rapanui_surveyor').GetFullName] posiada odpowiednie kwalifikacje, aby wziąć udział w wyprawie."
 rapanui.203.i: "[concept_dubois_naturalist] taki jak [SCOPE.sCharacter('dubois_naturalist_scope').GetFullName] wydaje się odpowiednią osobą."
 rapanui.203.j: "Wybór pada na [SCOPE.sCharacter('dubois_paleontologist_scope').GetFullName], [concept_dubois_paleontologist]."
 rapanui.203.k: "[SCOPE.sCharacter('verrier_astronomer_scope').GetFullName] jest [concept_verrier_astronomer], a taka wyprawa będzie potrzebować właśnie takiego specjalisty."
 rapanui.204.t: "Rozpoczyna się Wyprawa [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]"
 rapanui.204.d: "Przygotowania do [concept_dubois_pacific_expedition] zostały zakończone. [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetFullName] wybrał [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')] na okręt flagowy wyprawy. Podróż przejdzie do historii pod nazwą #Yellow Wyprawa [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]#!."
 rapanui.204.f: "W pogodny dzień sylwetka [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')] odbija się w tafli wody. Na nabrzeżu stoją wybitni przedstawiciele elity naukowej, a jeden z profesorów wygłasza przemówienie, w którym nie tylko zagłębia się w naukowe szczegóły, lecz także podkreśla historyczną doniosłość tej chwili. To wyjątkowy dzień nie tylko dla nauki, ale również dla [ROOT.GetCountry.GetNameNoFormatting]. Niezależnie od wyniku przedsięwzięcia z wyprawą wiązane są ogromne nadzieje. Wkrótce [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetFullName] wydaje rozkaz odcumowania. Na pożegnanie działa oddają donośną salwę honorową, a okręt wyprawy stopniowo znika w oddali."
 rapanui.204.g: "Od cum – ku Oceanii!"
 rapanui.204.h: "Wyrusz w rejs do Australii i Nowej Zelandii."
 rapanui.204.i: "Kurs na Indonezję i Melanezję."
 rapanui.205.t: "Wyprawa [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')] przybywa do Oceanii"
 rapanui.205.d: "Załoga okrętu #YELLOW [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]#!, dowodzona przez komandora [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetLastName], bezpiecznie dotarła na wody Polinezji Wschodniej i wkrótce rozpocznie prace badawcze."
 rapanui.205.f: "[concept_dubois_pacific_expedition] może zostać skierowana do jednego z trzech regionów położonych nad Pacyfikiem: Oceanii, Australii lub Indonezji. Znaczenie ma nie tylko wybrany priorytet wyprawy, ale również region, do którego się udaje. Na przykład kangury można spotkać wyłącznie w Australii. Wielkie mocarstwa imperialistyczne mogą wysyłać misjonarzy i zakładać placówki handlowe w Oceanii bez konieczności posiadania interesów dyplomatycznych w tym regionie, ale nie w Indonezji ani Australii. Podczas wyprawy można jednokrotnie zmienić region docelowy za pomocą wpisu w dzienniku."
 rapanui.205.g: "Ach, Tahiti."
 rapanui.206.t: "Wyprawa [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')] przybywa do Australii"
 rapanui.206.d: "Załoga okrętu #YELLOW [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]#!, dowodzona przez komandora [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetLastName], bezpiecznie dotarła na wody Tasmanii i wkrótce rozpocznie prace badawcze."
 rapanui.206.g: "Ach, Australia."
 rapanui.207.t: "Wyprawa [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')] przybywa do Indonezji"
 rapanui.207.d: "Załoga okrętu #YELLOW [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]#!, dowodzona przez komandora [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetLastName], bezpiecznie dotarła na wody Jawy i wkrótce rozpocznie prace badawcze."
 rapanui.207.g: "Ach, Batawia."
 rapanui.210.t: "Zmień Kurs"
 rapanui.210.d: "Komandor [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetLastName] wydaje rozkaz zmiany kursu i opuszczenia dotychczasowego obszaru wyprawy. W którym regionie powinien teraz żeglować [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]?"
 rapanui.210.f: "„Cokolwiek robisz bez przekonania, zrobisz to źle.” – James Cook"
 rapanui.210.g: "Polinezja."
 rapanui.210.h: "Australia."
 rapanui.210.i: "Indonezja."
 rapanui.210.j: "Utrzymaj kurs."
 rapanui.211.t: "Wyprawa [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')] powraca"
 rapanui.211.d: "Wyprawa dowodzona przez [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetFullName] powróciła po latach podróży. Przyszłe pokolenia będą czerpać korzyści z jej osiągnięć."
 rapanui.211.f: "Powrót dużej wyprawy badawczej do ojczyzny często nie oznaczał końca, lecz dopiero początek wieloletnich badań. Przykładem może być duńska wyprawa Galathea. Statek przywiózł 93 skrzynie zawierające zbiory zoologiczne, entomologiczne, botaniczne i geologiczne. Przywieziono również 21 skrzyń materiałów etnograficznych, bogatą kolekcję z Jawy oraz podarunki od naukowców z wielu miast i portów odwiedzonych przez wyprawę. Niestety, z powodów politycznych wyniki badań nigdy nie zostały w pełni opublikowane. Zgromadzone zbiory służyły później głównie jako materiał porównawczy."
 rapanui.211.g: "Witajcie w domu."
 rapanui.212.t: "Nowy Przyrodnik"
 rapanui.212.d: "Po długiej wyprawie i związanych z nią intensywnych badaniach podróżnik-badacz [SCOPE.sCharacter('dubois_naturalist_scope').GetFullName] jest obecnie uznawany za wybitnego przyrodnika i eksperta w swojej dziedzinie, której [SCOPE.sCharacter('dubois_naturalist_scope').GetHerHis] poświęca swoje badania."
 rapanui.212.f: "„Podsumowując, wydaje mi się, że nic nie może być bardziej pouczające dla młodego przyrodnika niż podróż do odległych krajów. Zarówno zaostrza ona, jak i częściowo zaspokaja tę potrzebę i tęsknotę, których, jak zauważa sir J. Herschel, człowiek doświadcza nawet wtedy, gdy wszystkie jego zmysły cielesne są w pełni zaspokojone. Emocje wywołane nowością poznawanych rzeczy oraz szansa na dokonanie odkrycia pobudzają go do wzmożonej aktywności. Co więcej, ponieważ liczne odosobnione fakty szybko przestają być interesujące, nawyk porównywania prowadzi do formułowania uogólnień. Z drugiej strony, ponieważ podróżnik przebywa w każdym miejscu jedynie przez krótki czas, jego opisy muszą zazwyczaj ograniczać się do pobieżnych szkiców zamiast szczegółowych obserwacji. Stąd bierze się, jak przekonałem się na własnej skórze, nieustanna skłonność do wypełniania rozległych luk w wiedzy niedokładnymi i powierzchownymi hipotezami.” – Charles Darwin"
 rapanui.212.g: "[SCOPE.sCharacter('dubois_naturalist_scope').GetSheHe|U] przyda się nam w realizacji przyszłych planów."
 rapanui.213.t: "Towarzyszący naukowiec sporządza raport"
 rapanui.213.d: "Po powrocie z wyprawy badawczej [SCOPE.sCharacter('rapanui_scientist').GetFullName] sporządził pierwszy raport z podróży na Pacyfik. W ciągu najbliższych kilku lat wyniki badań zostaną opisane bardziej szczegółowo."
 rapanui.213.f: "Udane wyprawy badawcze często prowadziły do powstawania obszernych opracowań naukowych, których przygotowanie trwało zazwyczaj wiele lat. Wiedza zdobyta przez Charlesa Darwina podczas podróży na pokładzie „Beagle” znalazła odzwierciedlenie w kilku pracach naukowych opublikowanych w kolejnych latach. Wyniki wyprawy austriackiej „Novary” przedstawiono w 21 tomach. Rezultaty badań wyprawy „Challengera” były publikowane aż do 1895 roku, czyli przez dziewiętnaście lat po zakończeniu podróży, przez utworzone w tym celu biuro Challenger Office w Edynburgu. Całe sprawozdanie liczyło 50 tomów i ponad 29 500 stron."
 rapanui.213.g: "Jeszcze jeden artykuł naukowy do biblioteki."
 rapanui.221.t: "Prądy Morskie"
 rapanui.221.d: "[SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')] wpłynął w wyjątkowo silny prąd morski."
 rapanui.221.f: "Badanie prądów morskich było jedną z podstawowych dziedzin nauki, z których wyrosła oceanografia. Już w epoce wielkich odkryć geograficznych hiszpańscy i portugalscy żeglarze rozpoznali prądy morskie, które mogły ułatwić szybkie przemierzanie oceanów świata. Znanym przykładem jest handel między Manilą na Filipinach a Acapulco w Meksyku. W XIX wieku wiedzę oceanograficzną pogłębiano, aby uzyskać dokładniejszy i pełniejszy obraz funkcjonowania globalnego systemu prądów morskich."
 rapanui.221.g: "Naukowcy powinni przeprowadzić tylko najniezbędniejsze eksperymenty."
 rapanui.221.h: "Podążaj z prądem, aby zdobyć więcej wiedzy."
 rapanui.222.t: "Badania Oceanograficzne"
 rapanui.222.d: "#YELLOW Wyprawa [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]#! prowadzi obecnie badania nad składem wody oceanicznej i jej temperaturą na dotychczas stosunkowo słabo zbadanym obszarze."
 rapanui.222.f: "Wody oceanów świata pozostają w nieustannym ruchu. Głównymi siłami napędzającymi ten ruch są pływy morskie i wiatr. Ponadto istotną rolę w przemieszczaniu się wód morskich odgrywają różnice temperatury i zasolenia, ponieważ wynikające z nich różnice gęstości wody powodują powstawanie prądów morskich. Zmiany temperatury i zasolenia wody, a tym samym prędkości przepływu prądów morskich, wpływają również na obszary lądowe, między innymi na ich klimat. Najbardziej znanym tego przykładem jest Prąd Zatokowy."
 rapanui.222.g: "Świeża sól morska!"
 rapanui.223.t: "Magnetyzm"
 rapanui.223.d: "Naukowcy na pokładzie [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')] przeprowadzają różnorodne eksperymenty, aby potwierdzić teorie dotyczące magnetyzmu ziemskiego."
 rapanui.223.f: "Teodolit podróżny to instrument geodezyjny przeznaczony do użytku podczas wypraw, skonstruowany tak, aby był możliwie jak najmniejszy i najwytrzymalszy, a jego regulacja była możliwa również w terenie. Wiadomo, że wykorzystywano go podczas austriackiej „Wyprawy Novary”. Aby określić parametry pola geomagnetycznego na lądzie, zazwyczaj zakładano stanowiska pomiarowe, na których stabilne podłoże tworzono z przywiezionych ze sobą cegieł. Seriom pomiarów, trwającym często wiele godzin, zawsze musiały towarzyszyć astronomiczne pomiary pozwalające ustalić dokładne położenie geograficzne. W ten sposób udało się zbadać ziemskie pole magnetyczne w łącznie 17 miejscach na całym świecie."
 rapanui.223.g: "Poszerzy to naszą wiedzę z zakresu fizyki."
 rapanui.223.h: "[SCOPE.sCharacter('rapanui_scientist').GetCustom('getMsMr')] [SCOPE.sCharacter('rapanui_scientist').GetLastName] powinien przeprowadzić specjalny eksperyment."
 rapanui.223.i: "Poszerzy to naszą wiedzę oceanograficzną."
 rapanui.224.t: "Pomiary Głębin Morskich"
 rapanui.224.d: "#YELLOW Wyprawa [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]#! prowadzi trudne badania głębinowe mające na celu określenie gęstości, temperatury i zasolenia w niższych warstwach morza. Z głębin mają również zostać wyłowione nieznane dotąd formy życia."
 rapanui.224.f: "Od połowy XIX wieku badania głębin morskich odgrywały coraz ważniejszą rolę. Z jednej strony wiązało się to z badaniem dna morskiego pod kątem układania kabli w początkowym okresie rozwoju telegrafii. Z drugiej strony dążono do weryfikacji teorii fizycznych i biologicznych. Przez długi czas zakładano, że poniżej określonej głębokości nie mogą istnieć żadne organizmy żywe albo że mogły się tam zachować „żywe skamieliny”. Naukowcy tacy jak C.W. Thomson uważali, że warunki panujące w głębinach, takie jak stale niska temperatura, ciemność oraz brak prądów morskich, fal i zjawisk sejsmicznych, tworzą na tyle stabilne środowisko, że ewolucja ulega spowolnieniu lub całkowicie ustaje. To sprawiło, że badania głębin morskich stały się ważną dziedziną dla przyrodników, paleontologów i zwolenników teorii ewolucji."
 rapanui.224.g: "Skoncentruj się na pomiarach."
 rapanui.224.h: "Skoncentruj się na odławianiu głębinowych [Concept('concept_dubois_specimen','$concept_dubois_specimens|q$')]."
 rapanui.225.t: "Antarktyda"
 rapanui.225.d: "Silny prąd morski zniósł [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')] z kursu, wskutek czego okręt znalazł się pośród wiecznych lodów Antarktydy. Naukowcy są mile zaskoczeni, natomiast marynarze obawiają się uwięzienia w lodzie."
 rapanui.225.f: "Jeśli [concept_dubois_pacific_expedition] dotrze do Antarktydy, będzie to doskonała okazja do zintensyfikowania badań. Istnieje jednak ryzyko, że statek straci cenny czas, jeśli zapuści się zbyt daleko w krainę lodu. Choć w XIX wieku kilka wypraw dotarło do rejonów podbiegunowych, nawet uczestnicy wyprawy „Challengera” starali się nie spędzać zbyt wiele czasu w tym nieprzyjaznym środowisku."
 rapanui.225.g: "Doskonała okazja do badań oceanograficznych."
 rapanui.225.h: "Doskonała okazja do badań meteorologicznych."
 rapanui.225.i: "Doskonała okazja do badań zoologicznych."
 rapanui.225.j: "Doskonała okazja do badań ogólnych."
 rapanui.226.t: "Lód"
 rapanui.226.d: "Podróż [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')] znacznie się opóźni. Najwyraźniej okręt utknął w wiecznych lodach."
 rapanui.226.f: "#YELLOW Wyprawa [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]#! nie może przeprowadzać eksperymentów."
 rapanui.226.g: "Tracą cenny czas!"
 rapanui.227.t: "Nieznana Wyspa"
 rapanui.227.d: "#YELLOW Wyprawa [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]#! odkryła nieznaną dotąd wyspę. Komandor [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetLastName] rozkazał dokładniej ją zbadać."
 rapanui.227.f: "„Mówią, że tchórzostwo jest zaraźliwe, ale z drugiej strony rozsądna argumentacja potrafi dodać wielkiej odwagi.” – Robert Louis Stevenson"
 rapanui.227.g: "Wyślij Pana [SCOPE.sCharacter('rapanui_scientist').GetLastName] na Zbadanie Wyspy"
 rapanui.227.h: "Wyślij niewielką wyprawę lądową."
 rapanui.229.t: "Prąd Morski Znosi Statek z Kursu"
 rapanui.229.d: "Być może cena ostatniego eksperymentu naukowego była nieco zbyt wysoka. [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')] jest znoszony przez prąd morski, a wiatr jest wyjątkowo niesprzyjający."
 rapanui.229.f: "Jeśli statek wyprawy zostanie porwany przez prąd morski, opuści swój pierwotny obszar badań i zostanie zniesiony do jednego z dwóch pozostałych regionów. Kierunek, w którym zdryfuje statek, jest losowy."
 rapanui.229.g: "Wygląda na to, że tracimy z oczu cel naszej wyprawy."
 rapanui.230.t: "Głębia [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]"
 rapanui.230.d: "Podczas pomiarów głębin morskich #YELLOW Wyprawa [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]#! odkryła najgłębszy punkt oceanu. W uznaniu tego odkrycia głębia ta będzie odtąd nosić nazwę statku!"
 rapanui.230.f: "23 marca 1875 roku, na stacji pomiarowej numer 225, położonej w południowo-zachodniej części Oceanu Spokojnego między Guam a Palau, wyprawa „Challengera” dokonała pomiaru głębokości wynoszącej 4475 sążni (26 850 stóp; 8184 m), który potwierdzono dodatkowym pomiarem. Jak wykazały późniejsze wyprawy wykorzystujące nowoczesny sprzęt, obszar ten stanowi południowy kraniec Rowu Mariańskiego i jest jednym z najgłębszych znanych miejsc na dnie oceanu. Od tego czasu w pobliżu miejsca pierwotnego pomiaru „Challengera” współczesne sondowania wykazały głębokość sięgającą 6012 sążni (36 070 stóp; 10 994 m). Odkrycie tej głębokości przez „Challengera” było jednym z najważniejszych osiągnięć wyprawy, znacząco poszerzającym wiedzę oceanograficzną o głębokości i rozmiarach oceanu. Miejsce to nosi obecnie nazwę Głębi Challengera, nadaną na cześć statku."
 rapanui.230.g: "Historyczny dzień."
 rapanui.231.t: "Wyspa Żółwi"
 rapanui.231.d: "Podczas swojej podróży #YELLOW Wyprawa [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]#! natknęła się na kolonię żółwi. Wyspa aż roi się od tych gadów."
 rapanui.231.f: "Już z daleka załoga mogła dostrzec, że plaża na wyspie zdawała się poruszać. Najwyraźniej było to ulubione miejsce składania jaj przez żółwie zielone. Gdy tylko marynarze zeszli na ląd, niektórzy zapragnęli zabawić się kosztem niczego niepodejrzewających zwierząt, czy to podkradając żółwie jaja, czy też otwarcie oznajmiając, że wreszcie chcą sami spróbować słynnej zupy z żółwia. Jednak pilny apel naukowców do komandora [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetLastName] sprawił, że marynarze, choć niechętnie, porzucili swoje kulinarne zamiary."
 rapanui.231.g: "Powinniśmy schwytać jednego z żółwi."
 rapanui.231.h: "Zbadaj żółwie i pobierz kilka próbek."
 rapanui.232.t: "Manta"
 rapanui.232.d: "Podczas poszukiwań nowych egzotycznych ryb naukowcy z #YELLOW Wyprawy [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]#! zauważyli wspaniałą, olbrzymią mantę."
 rapanui.232.f: "[SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')] zarzucił kotwicę w zatoce jedynie na krótko, aby o poranku przeprowadzić badania miejscowej populacji ryb. Podczas gdy część naukowców zbierała próbki z niewielkiej łodzi, przed dziobem okrętu przepłynęła olbrzymia płaszczka o tak niezwykłej urodzie, że uczeni nie mogli uwierzyć własnym oczom. Tak wyjątkowy okaz znali dotąd jedynie z dawnych marynarskich opowieści. Jednak wiadomość przekazana reszcie załogi wywołała mieszane reakcje. Niektórzy zoolodzy upierali się, że najlepiej będzie schwytać zwierzę i przewieźć je do kraju w zbiorniku z wodą. Inni uczeni przekonywali, że należy dokładniej obserwować zwierzę w jego naturalnym środowisku, aby wyciągnąć trafniejsze wnioski naukowe. Jeszcze inna grupa opowiadała się za pozostawieniem płaszczki w spokoju i kontynuowaniem zbierania próbek. Komandor [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetLastName] miał jednak zupełnie inne plany: [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetSheHe] zaproponował zastrzelenie zwierzęcia i przesłanie go jako trofeum [SCOPE.sCharacter('rapanui_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('rapanui_ruler').GetFullName] w dowód uznania. Czy kierowała nim wdzięczność za wsparcie finansowe ze strony rządu, czy też względy związane z własną karierą, pozostaje kwestią otwartą."
 rapanui.232.g: "Powinniśmy spróbować schwytać to niezwykłe zwierzę."
 rapanui.232.h: "To byłoby wspaniałe trofeum dla naszego władcy."
 rapanui.232.i: "Pan [SCOPE.sCharacter('rapanui_scientist').GetLastName] powinien zbadać to zwierzę."
 rapanui.232.j: "Zamiast tego po prostu podziwiaj przyrodę i zbierz kilka próbek."
 rapanui.233.t: "Schwytaj Kangura"
 rapanui.233.d: "Podczas postoju u wybrzeży Australii zwiadowcy z [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')] nawiązali kontakt z miejscową ludnością. Zwróciła ona uwagę załogi na występujące w okolicy kangury rude."
 rapanui.233.f: "„Ależ to wielkie, włochate potwory!” – powiedział walijski osadnik, gdy zoolog, prof. [SCOPE.sCharacter('rapanui_scientist').GetLastName], ochoczo wyruszył na polowanie na kangura rudego. [SCOPE.sCharacter('rapanui_scientist').GetSheHe|U] nie zdawał sobie jednak sprawy, że australijskie kangury rude należą do największych awanturników w królestwie zwierząt, a walijski osadnik wręcz nie doszacował zagrożenia. Choć osadnik wielokrotnie wspominał o krwawych skutkach spotkań z osławionym kangurem rudym z Dead Cat Gully, opowieści te w niewielkim stopniu przygotowały prof. [SCOPE.sCharacter('rapanui_scientist').GetLastName] na to, co rzeczywiście zamierzał zrobić. Gorliwi koledzy zwracali szczególną uwagę na fakt, że przed #YELLOW Wyprawą [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]#! prof. [SCOPE.sCharacter('rapanui_scientist').GetLastName] spędził 33 lata w obskurnej piwnicy uniwersyteckiej i był zaledwie w znośnej kondycji, by zmierzyć się z największym zwierzęciem lądowym Australii. Jedyny trening siłowy, jaki [SCOPE.sCharacter('rapanui_scientist').GetSheHe] wykonywał w ostatnich latach, polegał na układaniu stosów talerzy z okruchami ciasta wiśniowego. Choć jego koledzy zgadzali się, że poszukiwanie olbrzymiego kangura przyniesie korzyści badaniom zoologicznym, niektórzy odważyli się wyrazić wątpliwości, czy obrano właściwą metodę."
 rapanui.233.g: "Potrzebujemy tego kangura – co może pójść nie tak?"
 rapanui.234.t: "Interes z Koalą"
 rapanui.234.d: "Podczas postoju na lądzie skontaktował się z nami australijski wędrowny handlarz zwierzętami. Twierdzi, że ma dla nas „puszystego niedźwiadka”, którego nie spotkamy nigdzie indziej na świecie..."
 rapanui.234.f: "Naukowcy z #YELLOW Wyprawy [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]#! szybko ustalili, że rzekomy niedźwiedź jest w rzeczywistości koalą, a więc torbaczem. Mimo to zainteresowanie zoologów i biologów jest ogromne. Jest jednak pewien haczyk: handlarz nie chce pieniędzy, lecz żąda w zamian innego zwierzęcia. Domaga się gronostaja. Żądanie to zaskoczyło niektórych członków załogi, ale handlarz zwierzętami podkreśla, że łasice, fretki i podobne zwierzęta są bardzo poszukiwane w Australii i Nowej Zelandii. Powód jest prosty: osadnicy sprowadzili króliki, które z powodu braku naturalnych wrogów zaczęły wyrządzać szkody nie tylko miejscowej florze i faunie, lecz także gospodarstwom rolnym. Obecnie zwierzęta z rodziny łasicowatych są bardzo poszukiwane do zwalczania królików. Czy mogłoby to mieć jakieś konsekwencje? Handlarz zwierzętami tylko wzrusza ramionami i pyta, czy mamy gronostaja, czy nie."
 rapanui.234.g: "Chętnie wymienimy naszego gronostaja na jego koalę."
 rapanui.234.h: "Szkody, jakie taki gronostaj mógłby wyrządzić w Australii, byłyby straszliwe!"
 rapanui.234.i: "Co za dziwna propozycja. Bardziej interesują nas okazy przyrodnicze."
 rapanui.235.t: "Co za dziwna propozycja. Bardziej interesują nas okazy przyrodnicze."
 rapanui.235.d: "W pewnym mieście portowym osoba kontaktowa skontaktowała nas z cenionym myśliwym i traperem, który zaprezentował naukowcom niezwykłe zwierzę."
 rapanui.235.f: "Nikt z członków zespołu naukowego nigdy nie słyszał o takim zwierzęciu, nie mówiąc już o zobaczeniu go na własne oczy. Choć spekulowano na temat fascynującej fauny Australii, ostrzegano również, że Aborygeni opowiadali wcześniej Europejczykom o fantastycznych stworzeniach, takich jak bunyip, które okazały się jedynie wytworami ludowych podań. Jednak dwie kwestie wzbudziły wśród naukowców dalsze wątpliwości. Po pierwsze, łowca zwierząt stanowczo zabraniał dotykania tej chimery będącej połączeniem kaczki, bobra i wydry, a nawet zbliżania się do niej. Wzbudziło to podejrzenia niektórych zoologów, że może być to spreparowany okaz. Pewien biolog odkrył, że kaczkę umieszczono w wydrzym futrze i przymocowano do niej bobrzy ogon. Drugim powodem do wątpliwości była cena: pokrycie kosztów wymagałoby dotacji ze stolicy. Nie można też wykluczyć, że łowca zwierząt zażądałby kolejnych pieniędzy."
 rapanui.235.g: "KUP TO!"
 rapanui.235.h: "To zwierzę jest ewidentnie fałszywką. Podejrzewam, że za tą ofertą kryje się wątpliwy model biznesowy."
 rapanui.236.t: "Tajemnice Borneo"
 rapanui.236.d: "#YELLOW Wyprawa [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]#! dokonała interesującego odkrycia w lasach Borneo."
 rapanui.236.f: "Zespół naukowców, miejscowych przewodników i pomocników, któremu towarzyszyła uzbrojona eskorta, natknął się na samotnego orangutana podczas wędrówki przez lasy Borneo. Istnieje kilka możliwości postępowania z odkrytym zwierzęciem. Orangutany zazwyczaj prowadzą samotniczy tryb życia, a od czasu przybycia Europejczyków stały się znacznie rzadsze i bardziej płochliwe. Entomologom natomiast okaz bardzo się podoba, ale chcą kontynuować poszukiwania chrząszczy."
 rapanui.236.g: "Idealne zwierzę do Zoo."
 rapanui.236.h: "Pan [SCOPE.sCharacter('rapanui_scientist').GetLastName] powinien zbadać to wspaniałe stworzenie."
 rapanui.237.t: "Smok"
 rapanui.237.d: "Na Wyspach Sundajskich załoga [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')] staje oko w oko z gadem przypominającym prehistoryczne stworzenie."
 rapanui.237.f: "Na Wyspach Sundajskich komandor [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetLastName] ujrzał potwornego gada czającego się na skałach. Pewien zoolog potwierdził, że była to największa i najwspanialsza waranowata jaszczurka, jaką kiedykolwiek widział, co tylko utwierdziło komandora w przekonaniu, że [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetSheHe] odkrył najbardziej odrażające stworzenie w całym [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetHerHis] życiu. Oczywiście przyrodnicy, jak zwykle, byli zachwyceni."
 rapanui.237.g: "Nam również przydałby się taki smok w kraju."
 rapanui.237.h: "Należy zbadać zachowanie tego stworzenia. Z bezpiecznej odległości."
 rapanui.237.i: "Naukowcy powinni raczej skupić się na robakach, ptakach, rybach. Albo motylach. Na czymkolwiek, byle nie na tym odrażającym stworzeniu."
 rapanui.238.t: "Kangur Schwytany!"
 rapanui.238.d: "Załodze udało się zwabić kangura rudego w pułapkę, związać go i przetransportować na statek. Teraz jest bezpiecznie zamknięty w klatce."
 rapanui.238.f: "„Proszę, zabierz mnie na swoim grzbiecie!”\nRzekła Kaczka do Kangura.\n„Będę siedzieć spokojnie i mówić tylko: Kwa!\nPrzez cały długi dzień!\nPopłyniemy nad Dee i do Jelly Bo Lee,\nPrzez lądy i morza, gdzie tylko się da;\nProszę, zabierz mnie ze sobą! Ach, zgódź się!”\nRzekła Kaczka do Kangura.\n\nNa to Kangur rzekł do Kaczki:\n„Muszę się nad tym chwilę zastanowić;\nMoże nawet przyniesie mi to szczęście,\nLecz jedna rzecz mnie niepokoi.\nJeśli wolno mi mówić tak otwarcie,\nTwoje łapki są nieznośnie mokre i zimne,\nI pewnie nabawiłbym się przez nie reuma-\nTyzmu!” – rzekł Kangur.\n– Edward Lear"
 rapanui.238.g: "Wyślij go do kraju!"
 rapanui.239.t: "Członek Załogi Zatłuczony na Śmierć Pięściami"
 rapanui.239.d: "Po krwawej masakrze, w wyniku której kilku marynarzy zostało powalonych i ciężko rannych, okulary uległy pogięciu, a profesorowie najedli się strachu, uczestnicy wyprawy muszą niestety przyznać, że próba schwytania kangura zakończyła się niepowodzeniem. Rozszalała bestia zatłukła nawet na śmierć jednego z asystentów badawczych."
 rapanui.239.g: "Co za koszmar!"
 rapanui.240.t: "Linia [SCOPE.sCharacter('rapanui_scientist').GetLastName]"
 rapanui.240.d: "Odkrywając granicę faunistyczną między Azją a Australią, [SCOPE.sCharacter('rapanui_scientist').GetFullName] wniósł istotny wkład w rozwój biologii i dostarczył dowodów na poparcie teorii ewolucji. Na [SCOPE.sCharacter('rapanui_scientist').GetHerHis] cześć linia ta będzie nosić [SCOPE.sCharacter('rapanui_scientist').GetHerHis] imię."
 rapanui.240.f: "„Po raz pierwszy zobaczyłem tutaj wiele przedstawicieli fauny australijskiej, których zupełnie brak na wyspach położonych dalej na zachód. Małe białe kakadu występowały licznie, a ich donośne krzyki, śnieżnobiałe upierzenie i okazałe żółte czuby sprawiały, że stanowiły charakterystyczny element krajobrazu. Jest to najbardziej wysunięte na zachód miejsce na Ziemi, w którym występują ptaki z tej rodziny. Przyrodnik podróżujący na wschód po raz pierwszy napotyka niewielkie miodojady z grupy Ptilotis oraz osobliwe nogale (Megapodius Gouldii). (...) Na wyspie Lombok, oddzielonej od Bali cieśniną o szerokości niespełna dwudziestu mil, spodziewałem się oczywiście ponownie spotkać niektóre z tych ptaków występujących na Bali. Jednak podczas trzymiesięcznego pobytu nie zobaczyłem ani jednego z nich. Zamiast tego odkryłem zupełnie odmienny zespół gatunków, z których większość była niemal całkowicie nieznana nie tylko na Jawie, lecz także na Borneo, Sumatrze i Półwyspie Malajskim.” – Alfred Russel Wallace"
 rapanui.240.g: "Linia [SCOPE.sCharacter('rapanui_scientist').GetLastName]? Brzmi dobrze."
 rapanui.241.t: "Rzadkie Ptaki"
 rapanui.241.d: "Asystenci naukowi #YELLOW Wyprawy [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]#! odnaleźli kilka gniazd egzotycznych ptaków."
 rapanui.241.f: "„Ptaki te są z wyglądu blisko spokrewnione z chilijską thencą lub kalandrą znad La Platy. (...) Każdy rodzaj występuje wyłącznie na określonej wyspie, choć zwyczaje wszystkich są nie do odróżnienia. Kiedy przypominam sobie, że na podstawie budowy ciała, kształtu łusek i ogólnych rozmiarów Hiszpanie potrafią od razu stwierdzić, z której wyspy przywieziono danego żółwia, i kiedy widzę te wyspy, położone w zasięgu wzroku jedna od drugiej, zamieszkane przez nieliczne gatunki zwierząt, wśród których żyją ptaki różniące się jedynie nieznacznie budową i zajmujące to samo miejsce w przyrodzie, muszę podejrzewać, że są one jedynie odmianami. Jedynym znanym mi podobnym przypadkiem są stale podkreślane różnice między lisopodobnymi zwierzętami ze wschodnich i zachodnich Falklandów. Jeśli w tych spostrzeżeniach jest choćby ziarno prawdy, zoologia archipelagów zasługuje na szczegółowe zbadanie, ponieważ takie fakty podważyłyby niezmienność gatunków.” – Charles Darwin"
 rapanui.241.g: "Obserwuj i badaj ptaki."
 rapanui.241.h: "Schwytaj ptaki i zabierz jaja."
 rapanui.242.t: "Okaz Morski"
 rapanui.242.d: "Nasi poszukiwacze okazów wyłowili wczoraj obfity połów nowych stworzeń morskich."
 rapanui.242.f: "Wyprawa Wilkesa odegrała ogromną rolę w rozwoju nauki XIX wieku, szczególnie w kształtowaniu się amerykańskiego środowiska naukowego. Wiele gatunków i innych okazów odkrytych podczas wyprawy stało się podstawą zbiorów nowo powstałej Instytucji Smithsona. Dzięki pracy naukowców uczestniczących w wyprawie, pogardliwie nazywanych przez marynarzy „zbieraczami małży” i „łowcami robaków”, zgromadzono ponad 60 000 okazów roślin i ptaków. Podczas wyprawy zebrano również ogromną ilość danych i materiałów przyrodniczych, w tym nasiona 648 gatunków, którymi później handlowano, które wysiewano i rozsyłano po całym kraju. Zasuszone okazy trafiły do Narodowego Zielnika, będącego obecnie częścią Instytucji Smithsona. Zebrano także 254 żywe rośliny, pochodzące głównie z końcowego etapu podróży. W 1850 roku umieszczono je w nowo wybudowanej szklarni, która później stała się Ogrodem Botanicznym Stanów Zjednoczonych."
 rapanui.242.g: "Złoto dla Biologów."
 rapanui.243.t: "Fantastyczne Skamieliny"
 rapanui.243.d: "Podczas swojej podróży #YELLOW Wyprawa [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]#! odkryła złoże nieznanych dotąd skamielin."
 rapanui.243.f: "Odkrycia skamielin miały ogromne znaczenie podczas wyprawy na pokładzie „Beagle”. Po powrocie Richard Owen poświęcił się przede wszystkim opisywaniu skamielin odkrytych przez Karola Darwina. Podczas wyprawy odkryto między innymi nowe gatunki olbrzymich leniwców, takich jak Mylodon, oraz olbrzymiego pancernika (Glyptodon). Wśród skamielin znalezionych w pobliżu Santa Fe znajdował się ząb konia, który wprawił Darwina w zakłopotanie, ponieważ wcześniej sądzono, że konie pojawiły się w Ameryce dopiero w XVI wieku. Owen potwierdził, że ząb należał do wymarłego południowoamerykańskiego gatunku konia, któremu w 1845 roku nadał nazwę Equus curvidens."
 rapanui.243.g: "Poszukaj skamielin."
 rapanui.244.t: "Stromatolity"
 rapanui.244.d: "Naukowcy odkryli dużą kolonię stromatolitów w zatoce, w której zakotwiczony jest [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]."
 rapanui.244.f: "Stromatolity to biogeniczne skały osadowe powstające w wyniku wychwytywania i wiązania cząstek osadu lub wytrącania substancji rozpuszczonych w wodzie wskutek wzrostu i metabolizmu mikroorganizmów żyjących w zbiornikach wodnych. Zazwyczaj mają budowę warstwową i często składają się z bardzo cienkich warstw wapienia. Niektóre przypominają kalafior dzięki swojej charakterystycznej strukturze, tworzonej przez bulwiaste narośla, kolumny lub faliste warstwy. Najstarsze znane skamieliny to w większości stromatolity, dlatego mogą one dostarczyć wskazówek dotyczących ewolucji życia od najprostszych do bardziej złożonych form. Stromatolity uważa się za pierwsze rozpoznawalne struktury wytworzone przez organizmy żywe. Powstały w prekambrze, nawet 3,5 miliarda lat temu. Licząca 3,45 miliarda lat seria Warrawoona została odkryta na stanowisku North Pole w regionie Pilbara w Australii Zachodniej. W niektórych okresach dziejów Ziemi, na długo przed pojawieniem się koralowców, organizmy tworzące stromatolity odgrywały ważną rolę w budowie raf. Jeszcze miliard lat temu stromatolity były szeroko rozpowszechnione w niemal wszystkich wodach przybrzeżnych. Około 700 milionów lat temu ich różnorodność i zasięg występowania zaczęły się zmniejszać. Stromatolity sprzed 450 milionów lat należą już do wielkich rzadkości."
 rapanui.244.g: "Zbierz te [concept_dubois_specimen]."
 rapanui.244.h: "Zbierz te skamieliny."
 rapanui.244.i: "Zbadaj stromatolity."
 rapanui.245.t: "Skamieniała Flora"
 rapanui.245.d: "Załoga [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')] znalazła na skalnej ścianie odciski paproci sprzed milionów lat."
 rapanui.245.f: "W karbonie (około 360–300 milionów lat temu) paprocie, występujące w znacznie większych formach niż obecnie i zwykle nazywane paprociami drzewiastymi, wraz ze skrzypami i widłakami tworzyły rozległe lasy, z których powstała większość dzisiejszych złóż węgla kamiennego. Najstarsze skamieliny paproci pochodzą z dolnego dewonu (sprzed około 400 milionów lat). Paprocie są zatem prawdopodobnie starsze od roślin nasiennych, które pojawiły się dopiero w górnym dewonie."
 rapanui.245.g: "Kamień Węgielny Rewolucji Przemysłowej."
 rapanui.246.t: "Bursztynowy Naszyjnik"
 rapanui.246.d: "Wódz plemienia zaoferował nam sprzedaż zabytkowego bursztynowego naszyjnika, w którym uwięzione są prehistoryczne owady. Jednak dowódca [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetLastName] nie może zdecydować, co zrobić z tym znaleziskiem."
 rapanui.246.f: "Oferta miejscowego wodza była sporym zaskoczeniem. Najwyraźniej słyszał on już o podróży [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')] i liczył na korzystny interes. Gdy naukowcy obejrzeli naszyjnik, wywiązała się burzliwa dyskusja na temat jego dalszych losów. Jedna grupa nalegała na zakup naszyjnika do muzeum, aby pokazać zwiedzającym, w jaki sposób zachowują się owady uwięzione w bursztynie. Druga domagała się rozebrania ozdoby na części i zbadania każdej skamieliny z osobna. Podczas gdy przyrodnicy i paleontolodzy spierali się o sposób postępowania z tym niewątpliwie cennym znaleziskiem paleontologicznym, antropolodzy i archeolodzy zwracali uwagę na jego znaczenie kulturowe. Z kolei korpus oficerski uważał naukową dyskusję za niepotrzebną kłótnię i opowiadał się za tym, by nie wydawać pieniędzy na bezwartościowe przedmioty, lecz kontynuować podróż."
 rapanui.246.g: "Naszyjnik ma znaczenie paleontologiczne."
 rapanui.246.h: "Naszyjnik ma znaczenie archeologiczne."
 rapanui.246.i: "Rozbij naszyjnik i zbadaj jego fragmenty."
 rapanui.246.j: "Naszyjnik nie ma żadnego znaczenia."
 rapanui.247.t: "Australijska Kość"
 rapanui.247.d: "Wczesnym rankiem marynarze #YELLOW Wyprawy [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]#! odkryli niezwykłe stanowisko paleontologiczne. Nawet amator mógł dostrzec, że miejsce to kryje w sobie coś wyjątkowego."
 rapanui.247.f: "Odsłonięta warstwa osadów już na pierwszy rzut oka wskazywała, że skamieliny zachowały się w doskonałym stanie. Spośród licznych znalezisk uwagę marynarzy, a także naukowców, którzy później do nich dołączyli, przykuła jednak osobliwa kość, którą wkrótce nazwano „Australijską Kością”. Szybko stało się jasne, że paleontolog, prowadząc metodyczne i fachowe badania, mógłby odkryć tutaj znacznie więcej niż niedoświadczeni robotnicy pracujący gołymi rękami."
 rapanui.247.g: "Prof. [SCOPE.sCharacter('rapanui_scientist').GetLastName] powinien przeprowadzić wykopaliska."
 rapanui.247.h: "Zbierz jak najwięcej skamielin."
 rapanui.250.t: "Człowiek Jawajski"
 rapanui.250.d: "Prof. [SCOPE.sCharacter('rapanui_scientist').GetLastName] odkrył podczas #YELLOW Wyprawy [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]#! niezwykłe skamieliny. To szkielet prehistorycznego człowieka, który żył milion lat temu. Prawdziwa sensacja naukowa!"
 rapanui.250.f: "Skamieliny odkryte po raz pierwszy przez Eugène’a Dubois w 1891 roku nad brzegiem rzeki Solo, w pobliżu Trinil na Jawie Wschodniej, określane są mianem Człowieka z Jawy. Według obecnego stanu wiedzy liczą około miliona lat. Były to pierwsze skamieliny homininów odkryte poza Europą, a zarazem, po neandertalczykach, drugi dowód na istnienie wymarłych krewnych człowieka anatomicznie współczesnego (Homo sapiens). Znaleziska z Jawy początkowo określano nazwą Anthropopithecus, a później Pithecanthropus erectus. Obecnie większość paleoantropologów zalicza je do gatunku Homo erectus, choć niekiedy ich pochodzenie podkreśla się, zgodnie z propozycją Franza Weidenreicha z 1940 roku, poprzez dodanie nazwy podgatunkowej: Homo erectus javanensis. Ponad 50 lat po odkryciu Dubois Ralph von Koenigswald wspominał: „Żadne inne odkrycie paleontologiczne nie wywołało tak wielkiej sensacji ani nie doprowadziło do powstania tak wielu sprzecznych opinii naukowych”."
 rapanui.250.g: "Czy to brakujące ogniwo?"
 rapanui.251.t: "Cenny Artefakt"
 rapanui.251.d: "Podczas wizyty u plemienia na odległej wyspie pozyskaliśmy cenny artefakt z Oceanii."
 rapanui.251.f: "Dowódca [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetLastName] zamierzał jedynie zatrzymać się na krótko przy brzegu, aby wraz z [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetHerHis] załogą uzupełnić zapasy żywności i słodkiej wody. Wyspa, położona raczej na uboczu szlaków handlowych, najwyraźniej miała niewielki kontakt ze światem zewnętrznym. Jednak wskutek nieporozumienia miejscowy wódz najwyraźniej uznał dowódcę za członka rodziny królewskiej i wręczył [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetHerHim] kunsztownie wykonaną drewnianą rzeźbę. Załoga [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')] podarowała mieszkańcom zwyczajowe szklane kulki, co bardzo ucieszyło miejscowego wodza."
 rapanui.251.g: "To powinno trafić do muzeum."
 rapanui.252.t: "Odkryto Nową Zatokę"
 rapanui.252.d: "#YELLOW Wyprawa [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]#! zdołała dowieść, że wyspa, za którą dotąd uważano ten obszar, jest w rzeczywistości jedynie półwyspem, odkrywając tym samym nową zatokę. Nadal jednak nie ma zgody co do jej nazwy."
 rapanui.252.f: "Podczas pobytu na Archipelagu Bismarcka na Pacyfiku w sierpniu 1875 roku załoga „Gazelle” przeprowadziła pomiary naturalnego portu w zatoce Blanche, położonej w północno-wschodniej części wyspy Nowa Brytania (dawniej Nowe Pomorze). Przy tej okazji ustalono, że wschodnia część Nowej Brytanii jest półwyspem, któremu na cześć statku nadano nazwę „Półwysep Gazelle”. Nazwa ta przetrwała do dziś. Ponadto nazwano również cieśninę między Nową Irlandią a wyspą Dyaul „Cieśniną Gazelle”, a naturalny port na zachodnim wybrzeżu wyspy Bougainville’a „Portem Gazelle”."
 rapanui.252.g: "Nazwij zatokę na cześć naukowca, który przeprowadził jej pomiary: Zatoka [SCOPE.sCharacter('rapanui_scientist').GetLastName]."
 rapanui.252.h: "Zatoka powinna nosić imię naszej głowy państwa: Zatoka [SCOPE.sCharacter('rapanui_ruler').GetFullName]."
 rapanui.252.i: "Nadaj jej imię odkrywcy: Zatoka [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetLastName]."
 rapanui.252.j: "Wyprawa nie powinna nigdy zostać zapomniana: Zatoka [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]."
 rapanui.253.t: "Placówka Handlowa"
 rapanui.253.d: "#YELLOW Wyprawa [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]#! odkryła doskonałe miejsce do zakotwiczenia."
 rapanui.253.f: "Gdy dowódca [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetLastName] wpłynął do zatoki, [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetSheHe] zauważył, że miejsce to mogłoby zapewnić doskonałe schronienie przyszłym wyprawom lub statkom handlowym. Późniejszy rekonesans na lądzie wykazał nie tylko, że gleba doskonale nadaje się pod uprawy plantacyjne, lecz także, że panuje tu przyjemny klimat. Niektórzy doradcy handlowi natychmiast zaproponowali podjęcie wszelkich możliwych działań, aby udostępnić ten obszar dla [ROOT.GetCountry.GetNameNoFlag]. Naukowcy zwrócili jednak uwagę, że takie imperialistyczne postępowanie mogłoby doprowadzić do zaniedbania naukowych celów wyprawy."
 rapanui.253.g: "Zbuduj Faktorię Handlową."
 rapanui.253.h: "Po prostu nanieś to miejsce na mapę."
 rapanui.254.t: "Misja do [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag]?"
 rapanui.254.d_cat: "Kapelan [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')], ojciec [SCOPE.sCharacter('rapanui_missionary_scope').GetLastName], dowiedział się, że rdzenni mieszkańcy [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] nigdy nie słyszeli o Jezusie Chrystusie. [SCOPE.sCharacter('rapanui_missionary_scope').GetSheHe|U] prosi o pozwolenie na opuszczenie statku i nawrócenie rdzennej ludności na wiarę katolicką."
 rapanui.254.d_pro: "Kapelan [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')], pastor [SCOPE.sCharacter('rapanui_missionary_scope').GetFullName], dowiedział się, że rdzenni mieszkańcy [SCOPE.sCountry('rapanui_mission_country').GetNameNoFlag] nigdy nie słyszeli o Jezusie Chrystusie. [SCOPE.sCharacter('rapanui_missionary_scope').GetSheHe|U] prosi o pozwolenie na opuszczenie statku i nawrócenie rdzennej ludności na wiarę protestancką."
 rapanui.254.f: "Niedawno na pokład przybyło kilku kupców, aby przekazać nam wieści z regionu i uzupełnić zapasy wyprawy. Rozmowa zeszła również na temat miejscowych kultur chrześcijańskich i pogańskich. Kapelan okrętowy przysłuchiwał się uważnie i ze zdumieniem odkrył, że współwyznawcy [SCOPE.sCharacter('rapanui_missionary_scope').GetHerHis] nie dotarli jeszcze na te tereny. Strach przed kanibalami, których raz po raz spotyka się na wyspach, powstrzymywał w ostatnich latach duchownych przed schodzeniem na ląd."
 rapanui.254.g_cat: "Vade cum Deo."
 rapanui.254.g_pro: "Idź z Bogiem."
 rapanui.254.h: "To zdecydowanie zbyt niebezpieczne!"
 rapanui.255.t: "Wroga Reakcja"
 rapanui.255.d: "W rzeczywistości, odwiedzając [SCOPE.sCountry('rapanui_hostile_country').GetNameNoFlag], zamierzaliśmy podkreślić nasze pokojowe zamiary i poprawić naszą reputację na arenie międzynarodowej. Niestety, druga strona nie przyjęła naszych gestów z życzliwością."
 rapanui.255.f: "Konsul przebywający na pokładzie [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')] doradził [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetFullName] złożenie krótkiej wizyty miejscowemu władcy i przedstawienie mu naszych stanowisk. Najwyraźniej jednak dowódca nie znał miejscowych zwyczajów. Nieświadomie [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetSheHe] obraził kilku wysokich rangą urzędników tego kraju. W gruncie rzeczy nawet nie wiemy, co nasza delegacja zrobiła niewłaściwie. Prawdopodobnie popełniliśmy poważny błąd."
 rapanui.255.g: "Poważne faux pas, które powinniśmy naprawić."
 rapanui.255.h: "Obwiń winą Dowódcę."
 rapanui.255.i: "Nie będziemy za nic przepraszać."
 rapanui.256.t: "Poławiacze Pereł"
 rapanui.256.d: "Podczas swojej podróży #YELLOW Wyprawa [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]#! odkryła spokojną, niewielką wioskę, której mieszkańcy utrzymują się głównie z połowu cennych pereł. Cała załoga jest zafascynowana tym miejscem i obfitością występujących tu pereł."
 rapanui.256.f: "Dowódca [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetLastName] odkrył wioskę rybacką, która zdążyła już zasłynąć na sąsiednich wyspach z tego, że najlepsi poławiacze pereł na Morzach Południowych wydobywają z oceanicznych głębin najpiękniejsze klejnoty. Jej mieszkańcy są biedni, lecz uczciwi i najwyraźniej mają niewielkie doświadczenie w handlu. [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetLastName] rozważa zatem zawarcie umowy z rdzennymi mieszkańcami, aby perły te mogły trafiać również do [ROOT.GetCountry.GetNameNoFlag]. Jednak niektórzy oficerowie na pokładzie, a także nieprzewidywalna marynarska hołota, zasugerowali, że nasz okręt dysponuje wystarczającym uzbrojeniem i siłą ognia, by po prostu zabrać to, co prawnie nam się należy..."
 rapanui.256.g: "Nawiąż niewielką współpracę handlową."
 rapanui.256.h: "Przyrodnik powinien zbadać to miejsce."
 rapanui.256.i: "Te perły należą do nas."
 rapanui.257.t: "Delegacja Dyplomatyczna"
 rapanui.257.d: "Spotkanie z przedstawicielami [SCOPE.sCountry('rapanui_friendly_country').GetNameNoFlag] zakończyło się pełnym sukcesem. Dowódca [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetLastName] dobrał odpowiednie słowa i spotkał się ze zrozumieniem."
 rapanui.257.f: "Po skosztowaniu orzeźwiającego małpiego mózgu podanego na lodzie dowódca [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')] udowodnił, że [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetSheHe] potrafi wykazać się nie tylko na morzu, lecz także w kontaktach osobistych, wykorzystując [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetHerHis] umiejętności dyplomatyczne. Po zwyczajowej wymianie dyplomatycznych uprzejmości wysłannicy [SCOPE.sCountry('rapanui_friendly_country').GetNameNoFlag] są zachwyceni tak nienagannym towarzystwem. [ROOT.GetCountry.GetNameNoFlag] powinno wykorzystać tę okazję do zdobycia uznania na arenie międzynarodowej."
 rapanui.257.g: "Podkreśl nasze pokojowe zamiary."
 rapanui.257.h: "Pochwal dowódcę."
 rapanui.260.t: "Opłynięcie Świata"
 rapanui.260.d: "Dowódca [SCOPE.sCharacter('rapanui_pacific_expedition_leader').GetFullName] opłynął świat na pokładzie [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]!"
 rapanui.260.f: "Wiele słynnych wypraw badawczych korzystało z okazji, by opłynąć świat. W wielu przypadkach była to również najkrótsza i najefektywniejsza trasa. Do znanych przykładów należą wyprawy na pokładach „Beagle” i „Challengera” (oba z Wielkiej Brytanii), „Novary” (Austria), „Gazelle” (Prusy) oraz „Galathei” (Dania)."
 rapanui.260.g: "Dookoła Świata!"
 rapanui.261.t: "Dokładniejsze Mapy"
 rapanui.261.d: "Współpracujący z wyprawą naukowiec [SCOPE.sCharacter('rapanui_scientist').GetLastName] poświęcił czas podczas #YELLOW Wyprawy [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]#! na poprawianie błędów pomiarowych popełnionych przez wcześniejszych kartografów, znacznie zwiększając tym samym dokładność map."
 rapanui.261.f: "Chociaż mapy z XIX wieku były już znacznie dokładniejsze niż te z poprzedniego stulecia, nadal nie były pozbawione błędów. Raz po raz nanoszono na nie nieistniejące wyspy, podczas gdy inne, jeszcze nieodkryte, pozostawały niezaznaczone. Nawet na początku XX wieku niektóre obszary Pacyfiku wciąż były przedstawiane na mapach w sposób niekompletny lub błędny. Zaginięcie pilotki Amelii Earhart w 1937 roku można również tłumaczyć tym, że położenie wyspy Howland, do której zmierzała, zostało zaznaczone na mapach z błędem wynoszącym kilka mil."
 rapanui.261.g: "Dobra robota!"
 rapanui.262.t: "Skorygowane Odległości"
 rapanui.262.d: "Podczas poprawiania map #YELLOW Wyprawy [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]#! towarzyszący jej naukowiec [SCOPE.sCharacter('rapanui_scientist').GetLastName] ustalił, że odległości podane na dotychczasowych mapach są nieprawidłowe. [SCOPE.sCharacter('rapanui_scientist').GetSheHe|U] zaktualizuje materiały kartograficzne."
 rapanui.262.f: "Postęp techniczny oraz coraz częstsze organizowanie wypraw naukowych stworzyły znacznie lepsze warunki do przeprowadzania dokładniejszych pomiarów odległości. Panowało przekonanie, że od czasu ostatniej podróży Jamesa Cooka, poza dwoma biegunami, niemal nic nie pozostało już do odkrycia. Nie zawsze jednak było jasne, jakie było wzajemne położenie odkrytych miejsc. Wraz z wprowadzeniem ścisłych harmonogramów i terminów w gospodarce światowej coraz większego znaczenia nabierało wykonywanie nie tylko przybliżonych, lecz także bardzo precyzyjnych pomiarów."
 rapanui.263.t: "Egzotyczne Nasiona"
 rapanui.263.d: "Podczas postoju na lądzie Prof. [SCOPE.sCharacter('rapanui_scientist').GetLastName] z #YELLOW Wyprawy [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')]#! znalazł kilka niezwykłych nasion o dużym znaczeniu naukowym i rolniczym."
 rapanui.263.f: "Sprowadzanie roślin z regionu Pacyfiku i Azji Wschodniej nie należało do rzadkości. Pierwotnym celem wyprawy na pokładzie „Bounty” w 1789 roku, zakończonej słynnym buntem, było przewiezienie sadzonek drzewa chlebowego w celu rozpoczęcia jego uprawy na Karaibach. Miało to zapewnić robotnikom plantacyjnym tanią, podstawową żywność i uchronić ich przed głodem. W XIX wieku do takich przedsięwzięć dołączyły jednak również gromadzenie okazów botanicznych i badania naukowe."
 rapanui.263.g: "Nasiona doskonale uzupełnią kolekcję naukową."
 rapanui.263.h: "Nowe nasiona należy wykorzystać w rolnictwie."
 rapanui.264.t: "Nowy Gatunek Chrząszcza"
 rapanui.264.d: "Prof. [SCOPE.sCharacter('rapanui_scientist').GetLastName] odkrył na jednej z wysp nowy gatunek chrząszcza i nazwał go na cześć [SCOPE.sCharacter('rapanui_scientist').GetHerselfHimself]. To wyjątkowo odrażające stworzenie, jednak dla naukowca jest to najszczęśliwszy dzień w [SCOPE.sCharacter('rapanui_scientist').GetHerHis] życiu."
 rapanui.264.f: "Któż nie chciałby, aby pewnego dnia nazwano na cześć [SCOPE.sCharacter('rapanui_scientist').GetHerselfHimself] jakiegoś brzydkiego, oślizgłego i odrażającego robaka, na zawsze kojarzonego z [SCOPE.sCharacter('rapanui_scientist').GetHerHis] nazwiskiem?"
 rapanui.264.g: "Gratu... lacje."
 rapanui.265.t: "Niewielka Formacja"
 rapanui.265.d: "Podczas wyprawy na ląd Prof. [SCOPE.sCharacter('rapanui_scientist').GetLastName] odkrył niewielką formację geologiczną, w której znajdowały się liczne skamieliny. Dotychczas złoże to nie zostało zaznaczone na żadnej mapie."
 rapanui.265.f: "„Istnieje jeszcze inna, pokrewna trudność, znacznie poważniejsza. Mam na myśli sposób, w jaki gatunki należące do kilku głównych grup królestwa zwierząt pojawiają się nagle w najstarszych znanych skałach zawierających skamieliny. (...) Na razie kwestia ta musi pozostać niewyjaśniona i rzeczywiście może być przytaczana jako uzasadniony argument przeciwko przedstawionym tutaj poglądom (ewolucyjnym).” – Karol Darwin"
 rapanui.265.g: "Skamielin nigdy za wiele."
 rapanui.266.t: "Composita"
 rapanui.266.d: "Prof. [SCOPE.sCharacter('rapanui_scientist').GetLastName] nie posiada się z radości: [SCOPE.sCharacter('rapanui_scientist').GetSheHe] zdołał zebrać kilka rzadkich okazów rodzaju Composita z późnego dewonu, należących do najstarszych form życia, jakie [SCOPE.sCharacter('rapanui_scientist').GetSheHe] kiedykolwiek odkrył!"
 rapanui.266.f: "Composita to wymarły rodzaj ramienionogów, który żył od późnego dewonu do późnego permu. Przedstawiciele rodzaju Composita występowali na całym świecie, zamieszkując wszystkie kontynenty z wyjątkiem Antarktydy. Miały gładkie muszle z mniej lub bardziej wyraźnym fałdem i bruzdą oraz okrągłym otworem na nóżkę w skorupce brzusznej. Rodzaj Composita należy do rodziny Athyrididae (rząd Athyridida) i jest zaliczany do podrodziny Spirigerellinae. Tylko filistrzy dostrzegliby w tej wiekowej skamielinie zwykłą muszlę."
 rapanui.266.g: "To takie... ekscytujące."
 rapanui.267.t: "Południowa Półkula Nieba"
 rapanui.267.d: "[concept_verrier_astronomer] [SCOPE.sCharacter('rapanui_scientist').GetFullName] intensywnie wykorzystuje podróż na pokładzie [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')] do obserwacji południowego nieba nocą. Tutaj [SCOPE.sCharacter('rapanui_scientist').GetSheHe] obserwuje zjawiska, których [SCOPE.sCharacter('rapanui_scientist').GetSheHe] niemal na pewno nie zobaczyłby na półkuli północnej."
 rapanui.267.f: "Na niebie południowym widać nieco więcej gwiazd niż na północnym, ponieważ centrum Drogi Mlecznej znajduje się około 20° na południe od równika niebieskiego, w gwiazdozbiorze Strzelca. Przy dobrej widoczności na niebie południowym można dostrzec gołym okiem ponad 2000 gwiazd stałych, a przez lornetkę od 20 000 do 40 000. Podczas gdy na równiku o każdej porze roku i nocy można zobaczyć dokładnie połowę nieba południowego i połowę północnego, na wyższych szerokościach geograficznych półkuli południowej, w Afryce Południowej lub Australii, w dowolnym momencie można dostrzec około dwóch trzecich nieba południowego, a na południu Ameryki Południowej – ponad 80 procent."
 rapanui.268.t: "Zaćmienie Słońca"
 rapanui.268.d: "Współpracujący z wyprawą naukowiec [SCOPE.sCharacter('rapanui_scientist').GetFullName] miał niezwykłą okazję obserwować zaćmienie Słońca z pokładu [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')] i przeprowadzić szczegółowe badania astronomiczne!"
 rapanui.268.f: "Od połowy XIX wieku towarzystwa astronomiczne niektórych państw uprzemysłowionych zaczęły organizować wyprawy na odległe kontynenty w celu obserwacji zaćmień Słońca. Głównym przedmiotem zainteresowania była obserwacja korony słonecznej. Podczas całkowitego zaćmienia Słońca 18 sierpnia 1868 roku francuski astronom Jules Janssen, prowadzący obserwacje w Indiach, uzyskał pierwsze wskazówki świadczące o istnieniu pierwiastka helu. Szczególną uwagę zyskało całkowite zaćmienie Słońca 29 maja 1919 roku, obserwowane z afrykańskiej wyspy Príncipe przez wyprawę pod kierownictwem Arthura Stanleya Eddingtona. Obserwacje te miały ogromne znaczenie dla opracowanej kilka lat wcześniej przez Alberta Einsteina teorii względności, która przewidywała między innymi zakrzywianie toru światła odległych gwiazd pod wpływem pola grawitacyjnego Słońca. Wyniki obserwacji potwierdziły to przewidywanie."
 rapanui.268.g: "Doskonale."
 rapanui_avantgarde_navy_modifier: "Awangardowa Marynarka Wojenna"
 rapanui.300.t: "Koniec Ery"
 rapanui.300.d: "Wraz z rozwojem nowoczesnych statków zdolnych do żeglugi po całym świecie wyprawy badawcze na Pacyfik przestały być czymś wyjątkowym i stały się niemal codziennością. Niektórzy naukowcy twierdzą już nawet, że w tym niegdyś odległym regionie odkryto i skatalogowano wszystko, co było do odkrycia."
 rapanui.300.f: "Era żaglowców i wielkich wypraw dobiegła ostatecznie końca. Wraz z triumfem imperializmu i kolonializmu oraz coraz ściślejszym powiązaniem światowej gospodarki i rozwojem globalnej komunikacji Pacyfik zaczął być postrzegany jako jeden z wielu regionów świata. Dotarcie na drugi koniec świata nie jest już przygodą, lecz jedynie kwestią czasu. Ludzkość wkracza w epokę, w której wszystko wydaje się już zbadane, a nawet Morza Południowe utraciły swój dawny urok jako odległa kraina pełna egzotyki."
 rapanui.300.g: "Nie ma już nic do odkrycia."
 rapanui.1001.t: "Tajemnice Wyspy Wielkanocnej"
 rapanui.1001.d: "Jeden z naszych statków hydrograficznych zatrzymał się na Wyspie Wielkanocnej. [SCOPE.sCharacter('rapanui_adventurer_scope').GetFullName], początkujący kartograf, interesuje się zaginioną kulturą wyspy."
 rapanui.1001.f: "Na pierwszy rzut oka niewiele miejsc wydawało się równie opustoszałych jak wyspa, której nadano nazwę Wyspa Wielkanocna. Rapa Nui, jak nazywali ją miejscowi, już dawno utraciła swoje lasy. Owoce i zboża należały tu do rzadkości. Nad wyspą, która zdaje się skrywać nieznaną, lecz wspaniałą przeszłość, góruje krater wulkaniczny. Jej mieszkańcy, niczym egipscy fellachowie, żyją w cieniu dokonań olbrzymów. [SCOPE.sCharacter('rapanui_adventurer_scope').GetFullName], ambitny poszukiwacz przygód, wierzy, że na tej wyspie położonej na krańcu świata może kryć się jakaś tajemnica. [SCOPE.sCharacter('rapanui_adventurer_scope').GetSheHe|U] zszedł na ląd i z własnej inicjatywy zebrał grupę ludzi pod [SCOPE.sCharacter('rapanui_adventurer_scope').GetHerHis] dowództwem."
 rapanui.1001.g: "Cóż za tajemnicze miejsce..."
 rapanui.1002.t: "Rapa Nui"
 rapanui.1002.d: "Załoga, która wyruszyła na wyprawę w głąb Wyspy Wielkanocnej, została powitana przez miejscowe plemię Rapa Nui."
 rapanui.1002.f: "Rdzenni mieszkańcy, którzy nazywają siebie Rapa Nui, posługują się językiem bardzo podobnym do języków używanych we wschodniej Polinezji. Chociaż wyspa leży bliżej wybrzeży Ameryki niż wiele odległych wysp polinezyjskich, członkowie załogi wyraźnie dostrzegają, że jej mieszkańcy musieli przybyć z Oceanii przed wiekami. Są gościnni i zapraszają przybyszów na posiłek. Niektórzy uczestnicy niewielkiej wyprawy ostrzegają jednak, że jeśli naprawdę chcą odnaleźć ukryte skarby, powinni unikać kontaktu z miejscową ludnością."
 rapanui.1002.g: "Przyjmijmy ich uprzejme zaproszenie."
 rapanui.1002.h: "Nie można ufać tym dzikusom."
 rapanui.1011.t: "Tańce Ceremonialne"
 rapanui.1011.d: "Ludzie pod wodzą [SCOPE.sCharacter('rapanui_adventurer_scope').GetFullName] spędzają pewien czas wśród Rapa Nui na Wyspie Wielkanocnej."
 rapanui.1011.f: "Wyspę Wielkanocną otacza wiele tajemnic. Podczas wspólnego posiłku z miejscowymi mieszkańcami ludzie dowiadują się jedynie kolejnych fragmentów historii i wierzeń Rapa Nui. Coroczny turniej, związany z rywalizacją o zdobycie jaja, wydaje się najważniejszym rytuałem Rapa Nui. Jest on ściśle związany z ich głównym bóstwem, Makemake. [SCOPE.sCharacter('rapanui_adventurer_scope').GetLastName] ma podczas spotkania okazję przyjrzeć się bliżej petroglifom przedstawiającym ludzi-ptaki oraz Makemake. [SCOPE.sCharacter('rapanui_adventurer_scope').GetSheHe|U] odnajduje znaki pisma, których sami rdzenni mieszkańcy nie potrafią już odczytać. [SCOPE.sCharacter('rapanui_adventurer_scope').GetSheHe|U] zaczyna podejrzewać, że wyspiarze mają za sobą przeszłość, o której sami niewiele wiedzą..."
 rapanui.1011.g: "Kim jest ten człowiek-ptak, o którym tyle się mówi?"
 rapanui.1021.t: "Moai Hava"
 rapanui.1021.d: "Po spędzeniu kilku dni wśród Rapa Nui [SCOPE.sCharacter('rapanui_adventurer_scope').GetFullName] wraz z załogą dokonuje ważnego odkrycia."
 rapanui.1021.f: "Jak się okazało, Rapa Nui posiadali znacznie bogatsze dziedzictwo kulturowe niż tylko prymitywny kult człowieka-ptaka. Podczas zwiedzania dawnego placu, uważanego za miejsce zgromadzeń różnych miejscowych klanów, [SCOPE.sCharacter('rapanui_adventurer_scope').GetLastName] odkrył wystającą z ziemi podstawę bazaltowego posągu. Okazało się, że jest to Moai. Posągi te miały przedstawiać żywe oblicza przodków. Figura jest uszkodzona, ale może mieć ogromną wartość, jeśli zespołowi uda się dostarczyć ją do miejscowego muzeum. Nadal jednak nie wiadomo, czy i w jaki sposób będzie to możliwe."
 rapanui.1021.g: "Przemyć artefakt z kraju, zanim rdzenni mieszkańcy się dowiedzą..."
 rapanui.1021.h: "Przekonaj Rapa Nui, aby pozwolili nam zabrać artefakt ze sobą."
 rapanui.1021.i: "Powinniśmy szanować dziedzictwo innych ludów, zamiast je kraść."
 rapanui.1022.t: "Kradzież Moai Hava"
 rapanui.1022.d: "Chociaż naszej załodze na Wyspie Wielkanocnej udało się wnieść posąg Moai na pokład, rdzenni mieszkańcy zauważyli kradzież. Nasi ludzie musieli więc przedwcześnie uciekać!"
 rapanui.1022.f: "Była to operacja przeprowadzona niczym z powieści szpiegowskiej. Chociaż [SCOPE.sCharacter('rapanui_adventurer_scope').GetFullName] dołożył wszelkich starań, aby zachować ją w jak największej tajemnicy, brak dyscypliny wśród marynarzy sprawił, że jeden z wartowników zasnął na posterunku. Rdzenni mieszkańcy mogli obserwować ze wzgórza, jak ludzie wykopywali Moai z ziemi. W chwili gdy wydawało im się, że udało się już wydobyć artefakt, miejscowi nadbiegli z oddali. Grupie nie pozostało nic innego, jak uciekać najszybciej, jak się dało."
 rapanui.1022.g: "Szybko, wracajmy do domu!"
 rapanui.1023.t: "Moai Hava Zabezpieczona"
 rapanui.1023.d: "Dzięki wyjątkowym umiejętnościom [SCOPE.sCharacter('rapanui_adventurer_scope').GetFullName] naszej wyprawie na Wyspę Wielkanocną udało się niepostrzeżenie wnieść monumentalny posąg Moai na pokład naszego statku."
 rapanui.1023.f: "[SCOPE.sCharacter('rapanui_adventurer_scope').GetFullName] dołożył wszelkich starań, aby... przeniesienie Moai pozostało możliwie jak najbardziej niezauważone. Nocą ludzie kopali przy przyćmionym świetle lamp, tak aby żaden z miejscowych mieszkańców nie zauważył łopat zagłębiających się w ziemię ani wydobywania artefaktu z jej głębi. Gdy wzeszło słońce, Moai znajdował się już bezpiecznie na pokładzie, ukryty pod ładunkiem chilijskiego guana."
 rapanui.1023.g: "Doskonale."
 rapanui.1024.t: "Z Niewielką Pomocą Przyjaciół"
 rapanui.1024.d: "Choć Rapa Nui podchodzili sceptycznie do naszej prośby, udało nam się przekonać ich, by pozwolili nam zabrać Moai Hava na pokład naszego statku."
 rapanui.1024.f: "Rozmowa nie należała do łatwych, ale ostatecznie [SCOPE.sCharacter('rapanui_adventurer_scope').GetFullName] zdołał przekonać miejscowych mieszkańców do pomocy w wykopaniu i przetransportowaniu Moai. Zdobywszy ich zaufanie, [SCOPE.sCharacter('rapanui_adventurer_scope').GetSheHe] mógł zrealizować [SCOPE.sCharacter('rapanui_adventurer_scope').GetHerHis] plan za zgodą Rapa Nui. W zamian [SCOPE.sCharacter('rapanui_adventurer_scope').GetLastName] podarował rdzennym mieszkańcom kilka najcenniejszych skarbów znajdujących się na pokładzie: bezcenne szklane kulki, dwie zużyte talie kart oraz nie do końca znoszone sombrero."
 rapanui.1025.t: "Strata czasu."
 rapanui.1025.d: "Pomimo usilnych starań, by odnaleźć na wyspie kolejne artefakty, załoga była zmuszona przerwać wyprawę."
 rapanui.1025.f: "Prawdopodobnie niewiele jest miejsc równie niegościnnych jak Wyspa Wielkanocna: poza skałami i trawą niemal niczego tu nie ma. Można to wprawdzie powiedzieć także o niektórych innych wyspach, jednak Wyspa Wielkanocna wyróżnia się tym, że z trudnych do zrozumienia powodów żyją tu tysiące ludzi. [SCOPE.sCharacter('rapanui_adventurer_scope').GetLastName] ma podstawy przypuszczać, że sami mieszkańcy mogli doprowadzić się do tej nędzy: być może wycięli wszystkie drzewa i wybili wszystkie zwierzęta. Każda kolejna minuta spędzona tutaj to strata czasu."
 rapanui.1025.g: "I naprawdę nie ma na tej wyspie niczego więcej, co byłoby godne uwagi?"
 rapanui.1026.t: "Moai Hoa Hakananai'a"
 rapanui.1026.d: "Podczas wyprawy na Wyspę Wielkanocną załoga odkryła fascynujący posąg Moai. Jest on częściowo zakopany w ziemi, ale wyróżnia się wyjątkowo wysoką jakością wykonania."
 rapanui.1026.f: "Cóż za niezwykły artefakt, pomyślał [SCOPE.sCharacter('rapanui_adventurer_scope').GetFullName], gdy [SCOPE.sCharacter('rapanui_adventurer_scope').GetSheHe] po raz pierwszy odkrył Moai. Posąg był ledwie widoczny, lecz jego odsłonięte fragmenty sugerowały, że pochodził z czasów, gdy na wyspie panowała zupełnie inna epoka – epoka, w której szczytem osiągnięć kulturowych nie były petroglify ani szamańskie rytuały i zawody, lecz istniała cywilizacja zdolna wznosić imponujące posągi i nadawać im wyraziste kształty. [SCOPE.sCharacter('rapanui_adventurer_scope').GetLastName] nie był bynajmniej naukowcem ani znawcą sztuki, ale [SCOPE.sCharacter('rapanui_adventurer_scope').GetSheHe] miał wyczucie historii. A gdy puste oczodoły Moai zwróciły się ku [SCOPE.sCharacter('rapanui_adventurer_scope').GetHerHim], [SCOPE.sCharacter('rapanui_adventurer_scope').GetSheHe] poczuł, że spogląda wprost w przeszłość. Jedyne pytanie, jakie nurtowało [SCOPE.sCharacter('rapanui_adventurer_scope').GetSheHe], brzmiało: w jaki sposób [SCOPE.sCharacter('rapanui_adventurer_scope').GetSheHe] mógłby zabrać tę historię do ojczyzny?"
 rapanui.1026.g: "Załoga powinna odkopać Moai."
 rapanui.1026.h: "Poproś miejscowych mieszkańców o odkopanie posągu."
 rapanui.1026.i: "Pozostaw artefakt w spokoju."
 rapanui.1027.t: "Spór z Rapa Nui"
 rapanui.1027.d: "Nasza prośba o pomoc skierowana do Rapa Nui przyniosła odwrotny skutek. Miejscowi mieszkańcy uważają, że wystarczająco długo nadużywaliśmy ich gościnności, i żądają, abyśmy opuścili ich wyspę!"
 rapanui.1027.f: "Nasze wcześniejsze próby zdobycia zaufania miejscowych mieszkańców najwyraźniej zostały odebrane jako mniej protekcjonalne, niż początkowo sądziliśmy. Wygląda na to, że starszyzna Rapa Nui uważa, iż nasza rzekomo życzliwa próba przekupienia ich tanimi szklanymi kulkami mogła się powieść raz, ale nie po raz drugi. Pewna starsza kobieta rzuciła również pod nogi [SCOPE.sCharacter('rapanui_adventurer_scope').GetLastName] znoszone sombrero, za pomocą którego niegdyś zdobyliśmy ich zaufanie. Gest ten był tak wymowny, że prawdopodobnie oznaczał wypowiedzenie wojny, chyba że nasza grupa natychmiast opuści wyspę."
 rapanui.1027.g: "Interesuje nas tylko ich kultura... skąd ta złość?"
 rapanui.1028.t: "Moai Uszkodzone!"
 rapanui.1028.d: "Niestety prace wykopaliskowe przy Moai zakończyły się katastrofą. Zamiast wydobyć posąg z ziemi, ludzie uszkodzili go w sposób uniemożliwiający naprawę."
 rapanui.1028.f: "Jeśli coś jest całkowicie niezamierzone, to nie można tego nazwać wandalizmem archeologicznym. A przynajmniej tak twierdzą."
 rapanui.1028.g: "Strata dla archeologii i świata sztuki."
 rapanui.1029.t: "Miejscowi Pomagają!"
 rapanui.1029.d: "Rapa Nui zgodzili się pomóc w odkopaniu Moai."
 rapanui.1029.f: "Czasami aż trudno uwierzyć, ile można zdziałać za pomocą starego kija do krykieta i słoika dżemu morelowego. Oczywiście pod warunkiem, że wie się, jak wykorzystać je razem."
 rapanui.1029.g: "Niespodzianka, której nikt się nie spodziewał."
 rapanui.1041.t: "Wyspa Człowieka-Ptaka"
 rapanui.1041.d: "[SCOPE.sCharacter('rapanui_adventurer_scope').GetFullName] postanowił zbadać Wyspę Wielkanocną na własną rękę. Miejscowi mieszkańcy mogliby przysporzyć więcej kłopotów niż pożytku."
 rapanui.1041.f: "[SCOPE.sCharacter('rapanui_adventurer_scope').GetLastName] zdołał przeforsować [SCOPE.sCharacter('rapanui_adventurer_scope').GetHerHis] decyzję o zbadaniu Wyspy Wielkanocnej na [SCOPE.sCharacter('rapanui_adventurer_scope').GetHerHis] własną rękę. [SCOPE.sCharacter('rapanui_adventurer_scope').GetSheHe|U] podejrzewał, nie bez powodu, że jeśli na wyspie znajdują się cenne znaleziska, [SCOPE.sCharacter('rapanui_adventurer_scope').GetSheHe] będzie musiał zdobyć je wbrew woli Rapa Nui. Jak dotąd członkowie wyprawy odnaleźli jedynie tajemnicze skały pokryte petroglifami przedstawiającymi osobliwe znaki i symbole, wśród których szczególne miejsce zajmowały postacie ludzi-ptaków. Kartograf był jednak przekonany, że czekają na nich znacznie cenniejsze zdobycze."
 rapanui.1041.g: "To z pewnością zapewni sukces wyprawy."
 rapanui.1042.t: "Moai Hava"
 rapanui.1042.d: "Po wielu dniach poszukiwań [SCOPE.sCharacter('rapanui_adventurer_scope').GetFullName] dokonał niezwykłego odkrycia."
 rapanui.1042.f: "Jak się okazało, Rapa Nui posiadali znacznie bogatsze dziedzictwo kulturowe niż tylko prymitywny kult człowieka-ptaka. Podczas zwiedzania dawnego placu, uważanego za miejsce zgromadzeń różnych miejscowych klanów, [SCOPE.sCharacter('rapanui_adventurer_scope').GetLastName] odkrył wystającą z ziemi podstawę bazaltowego posągu. Figura jest uszkodzona, ale może mieć ogromną wartość, jeśli zespołowi uda się dostarczyć ją do miejscowego muzeum. Nadal jednak nie wiadomo, czy i w jaki sposób będzie to możliwe."
 rapanui.1042.g: "Przenieś posąg na pokład i opuść wyspę."
 rapanui.1042.h: "Kontynuuj eksplorację wyspy."
 rapanui.1043.t: "Śmierć [SCOPE.sCharacter('rapanui_adventurer_scope').GetFullName]"
 rapanui.1043.d: "Poszukiwania polinezyjskich artefaktów okazały się nie tylko całkowicie bezowocne, lecz także trudne warunki panujące na jałowej wyspie dały się we znaki zarówno ludziom, jak i wyposażeniu."
 rapanui.1043.f: "Decyzja o rezygnacji z pomocy rdzennych mieszkańców, kontynuowanie poszukiwań skarbów pomimo braku rezultatów, a także całe przedsięwzięcie okazały się z perspektywy czasu katastrofalne w skutkach. Już po kilku dniach ludziom zaczęło brakować wody i żywności, a wyczerpanie sprawiło, że stali się bardziej podatni na choroby. [SCOPE.sCharacter('rapanui_adventurer_scope').GetLastName] zapadł na nieznaną chorobę i pewnego ranka znaleziono go martwego. Ludzie pochowali [SCOPE.sCharacter('rapanui_adventurer_scope').GetHerHim] na wyspie, która odtąd wydawała się nawiedzona, po czym wyruszyli w drogę powrotną na statek."
 rapanui.1043.g: "Nie pozostaje nic innego, jak zakończyć tę bezsensowną wyprawę."
 rapanui.1050.t: "Posągi Moai z Rapa Nui"
 rapanui.1050.d: "Zaskakująco udana przygoda na Wyspie Wielkanocnej dobiega końca dla dzielnych ludzi pod wodzą [SCOPE.sCharacter('rapanui_adventurer_scope').GetFullName]: dwa cenne artefakty z Oceanii są już w drodze powrotnej do [ROOT.GetCountry.GetNameNoFlag]. Już teraz wiadomo, że uczestnicy wyprawy zasługują na sławę i zaszczyty."
 rapanui.1050.f: "„Ta prymitywna głowa\nTak zuchwale ogromna,\nA przecież tak toporna w wykonaniu,\nPozwala równie łatwo odczytać\nCierpienia minionych czasów\nJak karta choroby.\nTylko dla jednego szczegółu,\nTak udanie wyrzeźbionych ust,\nWykrzywionych pogardliwie,\nPrzewieziono statkiem\nTe tony kamienia.” – Robert Frost."
 rapanui.1050.g: "Oba posągi Moai powinny trafić do muzeum!"
 rapanui.1051.t: "Powrót do Ojczyzny z Moai Hava"
 rapanui.1051.d: "[SCOPE.sCharacter('rapanui_adventurer_scope').GetFullName] zdobył już rozgłos i wyrobił sobie [SCOPE.sCharacter('rapanui_adventurer_scope').GetHerselfHimself] renomę. [SCOPE.sCharacter('rapanui_adventurer_scope').GetSheHe|U] odnalazł rzadki posąg Moai na niegościnnej Wyspie Wielkanocnej i już na pokładzie ogłosił, że [SCOPE.sCharacter('rapanui_adventurer_scope').GetSheHe] zamierza podarować go [SCOPE.sCharacter('rapanui_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('rapanui_ruler').GetFullName]. Marynarze otrzymają podwyżkę żołdu, ale [SCOPE.sCharacter('rapanui_adventurer_scope').GetLastName] liczy na rozwój własnej kariery."
 rapanui.1051.f: "Niezależnie od tego, jak oceniać przeciwności napotkane na Wyspie Wielkanocnej, przygoda zakończyła się sukcesem. W ojczyźnie krążą już opowieści o śmiałym poszukiwaczu przygód, który wzbogacił COUNTRY o egzotyczny skarb sztuki. To, co dla jednych jest kradzieżą, dla innych staje się materiałem na nowele."
 rapanui.1051.g: "Czy tajemnice Wyspy Wielkanocnej zostały już odkryte?"
 rapanui.1052.t: "Sanktuarium Rapa Nui"
 rapanui.1052.d: "[SCOPE.sCharacter('rapanui_adventurer_scope').GetFullName] zaprzyjaźnił się z miejscowymi mieszkańcami podczas swojej przygody. Poznał ich zwyczaje, historię i sekrety, którymi się z nim podzielili. [SCOPE.sCharacter('rapanui_adventurer_scope').GetSheHe|U] jest obecnie uznawany za eksperta w dziedzinie badań nad Wyspą Wielkanocną."
 rapanui.1052.f: "Po powrocie na morze [SCOPE.sCharacter('rapanui_adventurer_scope').GetLastName] rozmyśla o wydarzeniach na Wyspie Wielkanocnej. Być może ktoś inny postąpiłby bardziej lekkomyślnie. Być może zagarnąłby cenne artefakty, aby przyspieszyć rozwój własnej kariery. Być może przez swoją niewiedzę i lekceważenie rdzennej ludności przypłaciłby to życiem. [SCOPE.sCharacter('rapanui_adventurer_scope').GetSheHe|U] dochodzi do wniosku, że [SCOPE.sCharacter('rapanui_adventurer_scope').GetSheHe] odnalazł na wyspie coś więcej niż rzadkie skarby. Miejscowi mieszkańcy okazali bowiem swoją wdzięczność. Wtajemniczyli [SCOPE.sCharacter('rapanui_adventurer_scope').GetHerHim] w swoje tradycje. [SCOPE.sCharacter('rapanui_adventurer_scope').GetSheHe|U] znał już ich historię. Przed [SCOPE.sCharacter('rapanui_adventurer_scope').GetHerHim] odsłoniła się pradawna, wciąż żywa kultura. Odtąd [SCOPE.sCharacter('rapanui_adventurer_scope').GetSheHe] postanowił poświęcić [SCOPE.sCharacter('rapanui_adventurer_scope').GetHerselfHimself] całkowicie badaniom nad nią."
 rapanui.1052.g: "Czy to początek kariery naukowej?"
 rapanui.1053.t: "Nic poza gruzami"
 rapanui.1053.d: "W wyniku wyjątkowo niefortunnego splotu wydarzeń przygoda [SCOPE.sCharacter('rapanui_adventurer_scope').GetFullName] na Wyspie Wielkanocnej kończy się rozczarowaniem. Nie wszystko jednak poszło na marne."
 rapanui.1053.f: "Gdy żagle wypełniają się wiatrem, a statek obiera kurs powrotny do Country, [SCOPE.sCharacter('rapanui_adventurer_scope').GetLastName] trzyma w [SCOPE.sCharacter('rapanui_adventurer_scope').GetHerHis] dłoni fragmenty czegoś, co niegdyś było posągiem Moai. Oczywiście [SCOPE.sCharacter('rapanui_adventurer_scope').GetSheHe] inaczej wyobrażał sobie [SCOPE.sCharacter('rapanui_adventurer_scope').GetHerHis] wyjazd. Jednak nawet jeśli [SCOPE.sCharacter('rapanui_adventurer_scope').GetSheHe] nie zdołał przywieźć do ojczyzny artefaktu, [SCOPE.sCharacter('rapanui_adventurer_scope').GetHerHis] podróż okazała się pouczającym doświadczeniem."
 rapanui.1053.g: "Jedna gwiazda gaśnie, druga wschodzi."
 rapanui.1054.t: "Słodko-Gorzkie Pożegnanie z Wyspą Wielkanocną"
 rapanui.1054.d: "Sylwetka Moai jaśnieje w wieczornym blasku zachodzącego słońca. Tymczasem [SCOPE.sCharacter('rapanui_adventurer_scope').GetFullName] pociera o siebie kamienne odłamki tego, co niegdyś było drugim posągiem Moai. Następnie [SCOPE.sCharacter('rapanui_adventurer_scope').GetSheHe] spogląda przed siebie, w dal ponad morzem."
 rapanui.1054.f: "Czy [SCOPE.sCharacter('rapanui_adventurer_scope').GetSheHe] powinien opłakiwać stratę, czy raczej cieszyć się z tego, co udało się ocalić? Dla [SCOPE.sCharacter('rapanui_adventurer_scope').GetLastName] triumf ten ma gorzki posmak. Niektórzy członkowie załogi próbują pocieszyć [SCOPE.sCharacter('rapanui_adventurer_scope').GetHerHim]. Jednak [SCOPE.sCharacter('rapanui_adventurer_scope').GetSheHe] nie może pozbyć się myśli, że wymarzone zakończenie powinno wyglądać inaczej. Tym mocniej dojrzewa w [SCOPE.sCharacter('rapanui_adventurer_scope').GetHerHim] postanowienie: nigdy więcej! [SCOPE.sCharacter('rapanui_adventurer_scope').GetSheHe|U] wyciągnie naukę z tej historii. Następnym razem coś podobnego nie przydarzy się [SCOPE.sCharacter('rapanui_adventurer_scope').GetHerHim]. To doświadczenie utwierdza [SCOPE.sCharacter('rapanui_adventurer_scope').GetHerHis] w postanowieniu spisania relacji z tych wydarzeń. Być może nie będzie to ostatnia wyprawa w [SCOPE.sCharacter('rapanui_adventurer_scope').GetHerHis] życiu."
 rapanui.1054.g: "Lepiej mieć jeden posąg Moai niż żadnego."
 rapanui.1055.t: "Krwawy Sukces"
 rapanui.1055.d: "Załodze udało się wywieźć oba posągi Moai z Wyspy Wielkanocnej, ale [SCOPE.sCharacter('rapanui_adventurer_scope').GetFullName] stracił [SCOPE.sCharacter('rapanui_adventurer_scope').GetHerHis] życie w tragicznych okolicznościach!"
 rapanui.1055.f: "„Na statek, na statek!” – tylko to się liczyło, gdy ludzie próbowali opuścić Wyspę Wielkanocną ze skradzionymi posągami Moai. Rdzenni mieszkańcy w końcu odkryli, co zrobili przybysze, i poczuli się oszukani. Chociaż statek był już gotowy do wypłynięcia, a oba posągi Moai znajdowały się bezpiecznie na pokładzie, w ostatniej chwili doszło do tragicznego wypadku. [SCOPE.sCharacter('rapanui_adventurer_scope').GetLastName], który pozostał na brzegu jako ostatni, aby upewnić się, że nikogo nie pozostawiono, został trafiony włócznią w plecy i padł bez ruchu na ziemię. Załoga była zmuszona odpłynąć bez [SCOPE.sCharacter('rapanui_adventurer_scope').GetHerHim]. [ROOT.GetCountry.GetNameNoFlag] zyskuje tego dnia dwa cenne artefakty, ale traci równie cennego poszukiwacza przygód, przed którym rysowała się świetlana przyszłość."
 rapanui.1055.g: "[ROOT.GetCountry.GetNameNoFlag] zapamięta tego bohatera."
 rapanui.1056.t: "Tragedia na Wyspie Wielkanocnej"
 rapanui.1056.d: "Załodze udało się bezpiecznie wnieść posąg Moai na pokład – ale jakim kosztem?"
 rapanui.1056.f: "„Na statek, na statek!” – tylko to się liczyło, gdy ludzie próbowali opuścić Wyspę Wielkanocną ze skradzionymi posągami Moai. Rdzenni mieszkańcy w końcu odkryli, co zrobili przybysze, i poczuli się oszukani. Chociaż statek był już gotowy do wypłynięcia, a oba posągi Moai znajdowały się bezpiecznie na pokładzie, w ostatniej chwili doszło do tragicznego wypadku. [SCOPE.sCharacter('rapanui_adventurer_scope').GetLastName], który pozostał na brzegu jako ostatni, aby upewnić się, że nikogo nie pozostawiono, został trafiony włócznią w plecy i padł bez ruchu na ziemię. Załoga była zmuszona odpłynąć bez [SCOPE.sCharacter('rapanui_adventurer_scope').GetHerHim]. [ROOT.GetCountry.GetNameNoFlag] zyskuje tego dnia dwa cenne artefakty, ale traci równie cennego poszukiwacza przygód, przed którym rysowała się świetlana przyszłość."
 rapanui.1056.g: "[ROOT.GetCountry.GetNameNoFlag] zapamięta tego bohatera."
 rapanui.1057.t: "Ucieczka w Ostatniej Chwili"
 rapanui.1057.d: "Pod wodzą [SCOPE.sCharacter('rapanui_adventurer_scope').GetFullName] udało im się przenieść cenny posąg Moai na pokład statku, choć ściągnęli tym na siebie gniew rdzennych mieszkańców."
 rapanui.1057.f: "[SCOPE.sCharacter('rapanui_adventurer_scope').GetLastName] szybko zdał sobie sprawę, że [SCOPE.sCharacter('rapanui_adventurer_scope').GetSheHe] nadużył cierpliwości rdzennych mieszkańców. Po wydobyciu Moai zaczęli oni wykonywać wrogie gesty. Najwyraźniej poczuli się oszukani, być może dlatego, że zaoferowane im podarunki – zepsuty koń na biegunach, kilka blaszanych puszek i trzy kolorowe karty ze zwierzętami z Zoo – okazały się dokładnie takim oszustwem, na jakie wyglądały. Zachowując przytomność umysłu, [SCOPE.sCharacter('rapanui_adventurer_scope').GetSheHe] natychmiast rozkazał [SCOPE.sCharacter('rapanui_adventurer_scope').GetHerHis] ludziom wejść na pokład statku. Wkrótce po tym, jak [SCOPE.sCharacter('rapanui_adventurer_scope').GetSheHe] odpłynął, członkowie załogi mogli zobaczyć Rapa Nui zgromadzonych na plaży z bronią w rękach..."
 rapanui.1057.g: "Ten poszukiwacz przygód ma nieprzeciętne zdolności."
 rapanui.1058.t: "Zaginiony"
 rapanui.1058.d: "Grupa, która poszukiwała niezwykłych miejsc na Wyspie Wielkanocnej, zaginęła bez śladu."
 rapanui.1058.f: "Czy przyczyną była nadmierna pewność siebie zbyt ambitnego poszukiwacza przygód? Załoga, która pozostała na pokładzie statku, od wielu dni nie miała żadnych wieści od pozostałych marynarzy ani ich przywódcy [SCOPE.sCharacter('rapanui_adventurer_scope').GetLastName]. Po trzech i pół dniach trzech ludzi odważyło się wyruszyć na poszukiwania zaginionych, lecz napotkali jedynie kilku rozgniewanych rdzennych mieszkańców, dlatego przerwali poszukiwania, nie osiągnąwszy żadnych rezultatów. Statek opuścił nieszczęsną wyspę. To, co się tam wydarzyło, pozostaje nierozwiązaną tajemnicą."
 rapanui.1058.g: "Przerażające."
 rapanui.1059.t: "Powrót w Cieniu Tragedii"
 rapanui.1059.d: "Załoga opłakuje śmierć obiecującego przywódcy. Podróż powrotną do ojczyzny spowija atmosfera melancholii."
 rapanui.1059.f: "Usłyszałem, jak ojczyzna wzywa mnie zza mórz,\nPrzez bezkresne wody woła mnie wciąż i wciąż.\nU boku ma przypasany miecz, na głowie hełm,\nA u jej stóp leżą konający i polegli.\nSłyszę zgiełk bitwy i grzmot jej dział,\nSpieszę do ciebie, matko, jako jeden z twoich synów. – Cecil Spring-Rice"
 rapanui.1059.g: "Godne ubolewania."
 rapanui_custom_death_shot_arrows: "[ROOT.Var('rapanui_missionary_var').GetCharacter.GetFullName] kilkakrotnie próbował zbliżyć się do wyspy niewielką łodzią, lecz za każdym razem witał go grad strzał. Rdzenni mieszkańcy najwyraźniej nie zamierzali trafić [ROOT.Var('rapanui_missionary_var').GetCharacter.GetHerHim] strzałami, a jedynie przepędzić [SCOPE.sCharacter('rapanui_adventurer_scope').GetHerHim]. Przy trzeciej próbie najwyraźniej stracili już cierpliwość do [ROOT.Var('rapanui_missionary_var').GetCharacter.GetHerHis] kolejnych prób. Kilka strzał trafiło [ROOT.Var('rapanui_missionary_var').GetCharacter.GetFirstName], po czym [ROOT.Var('rapanui_missionary_var').GetCharacter.GetSheHe] osunął się bez życia."
 rapanui_custom_death_lunch: "Początkowo wszystko zdawało się przebiegać pomyślnie. [ROOT.Var('rapanui_missionary_var').GetCharacter.GetFullName] został serdecznie przyjęty przez rdzennych mieszkańców. Zaproponowali nawet wydanie uczty na [ROOT.Var('rapanui_missionary_var').GetCharacter.GetHerHim] cześć. Najwyraźniej jednak [ROOT.Var('rapanui_missionary_var').GetCharacter.GetFirstName] nie zrozumiał zbyt dobrze miejscowego języka. [ROOT.Var('rapanui_missionary_var').GetCharacter.GetSheHe] nie miał być gościem na uczcie. Nie, [ROOT.Var('rapanui_missionary_var').GetCharacter.GetSheHe] miał być daniem głównym."
 rapanui_custom_death_burnt: "[ROOT.Var('rapanui_missionary_var').GetCharacter.GetFullName] musiał w jakiś sposób rozgniewać rdzennych mieszkańców. Wkrótce po jego przybyciu załoga statku, którym dotarł do wybrzeża, dostrzegła na plaży wielkie ognisko. Gdy przez kilka dni nie było żadnych wieści od [ROOT.Var('rapanui_missionary_var').GetCharacter.GetFirstName], marynarze postanowili zbadać sprawę. Na plaży odnaleźli spalone szczątki [ROOT.Var('rapanui_missionary_var').GetCharacter.GetFullName], które udało się zidentyfikować jedynie dzięki krzyżowi, jaki [ROOT.Var('rapanui_missionary_var').GetCharacter.GetSheHe] zawsze nosił przy [ROOT.Var('rapanui_missionary_var').GetCharacter.GetHerHim]."
 rapanui_custom_death_shipwrecked: "Tragedia! Zanim [ROOT.Var('rapanui_missionary_var').GetCharacter.GetSheHe] zdołał dotrzeć do [ROOT.Var('rapanui_missionary_var').GetCharacter.GetHerHis] celu podróży, statek, na którego pokładzie znajdował się [ROOT.Var('rapanui_missionary_var').GetCharacter.GetFullName], wpadł w sztorm i zatonął w oceanie. Wszyscy pasażerowie z wyjątkiem [ROOT.Var('rapanui_missionary_var').GetCharacter.GetFirstName] przeżyli. Czy był to znak od Boga?"
 rapanui_custom_death_clubbed: "Niedługo po tym, jak [ROOT.Var('rapanui_missionary_var').GetCharacter.GetFullName] zszedł na ląd, [ROOT.Var('rapanui_missionary_var').GetCharacter.GetSheHe] został otoczony przez miejscowych mieszkańców. Początkowo wydawali się bardzo zainteresowani [ROOT.Var('rapanui_missionary_var').GetCharacter.GetHerHim], lecz wkrótce wybuchła gwałtowna szamotanina. Podczas zajścia wyspiarze bili [ROOT.Var('rapanui_missionary_var').GetCharacter.GetFirstName] wielkimi maczugami, aż [ROOT.Var('rapanui_missionary_var').GetCharacter.GetSheHe] osunął się bez ruchu na ziemię."
 rapanui_custom_death_beheaded: "Zaledwie dzień po tym, jak [ROOT.Var('rapanui_missionary_var').GetCharacter.GetFullName] wylądował na wyspie, załoga statku, którym przybył, dokonała makabrycznego odkrycia. Na plaży znaleziono odciętą głowę [ROOT.Var('rapanui_missionary_var').GetCharacter.GetFirstName] zatkniętą na palu. Nikt nie wie, dlaczego miejscowi mieszkańcy postąpili tak z [ROOT.Var('rapanui_missionary_var').GetCharacter.GetHerHim]."
 rapanui_custom_death_join_natives: "Przez kilka tygodni nie było żadnych wieści od [ROOT.Var('rapanui_missionary_var').GetCharacter.GetFullName]. Wysłano więc grupę ludzi do wioski, którą odwiedził [ROOT.Var('rapanui_missionary_var').GetCharacter.GetSheHe], aby dowiedzieć się, co się stało z [ROOT.Var('rapanui_missionary_var').GetCharacter.GetHerHim]. Jak się okazało, z [ROOT.Var('rapanui_missionary_var').GetCharacter.GetFirstName] wszystko było w porządku. Postanowił jedynie przyłączyć się do tych dzikusów. Jak mogło do tego dojść?"
