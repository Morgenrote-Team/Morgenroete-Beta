 rapanui_has_port_trigger_tt: "#default_text [GetPlayer.GetName] posiada przynajmniej jeden [GetBuildingType('building_port').GetName].#!"
 rapanui_destination_oceania_tt: "#b Oceania#! jest jednym z najbardziej tajemniczych regionów świata. Niewielu ludzi tam dotarło. Twoja [concept_dubois_pacific_expedition] z pewnością pomoże wypełnić białe plamy na naszych mapach."
 rapanui_destination_australia_tt: "W przeciwieństwie do pozostałych celów wyprawy na obszarze #b Australii i Nowej Zelandii#! dominują rozległe pustynie w głębi Australii. Na szczęście dla [concept_dubois_pacific_expedition] wybrzeża charakteryzują się ogromną różnorodnością klimatów, roślin i zwierząt."
 rapanui_destination_indonesia_tt: "#b Indonezja i Melanezja#! to region porośnięty dżunglami pełnymi nieznanych dotąd gatunków. Wyślij swoją [concept_dubois_pacific_expedition], aby odkryć tajemnice tego regionu."