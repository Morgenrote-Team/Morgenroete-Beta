 rapanui.290.t: "Wielka Rafa Koralowa"
 rapanui.290.d: "Gdy [SCOPE.GetRootScope.GetCountry.GetCustom('rapanui_expedition_ship_type')] przepływa obok osławionej Wielkiej Rafy Koralowej na wodach Australii, Dr. [SCOPE.sCharacter('rapanui_scientist').GetLastName] daje jasno do zrozumienia, że [SCOPE.sCharacter('rapanui_scientist').GetSheHe] chciałby dokładniej ją zbadać. Odkrycia, których [SCOPE.sCharacter('rapanui_scientist').GetSheHe] dokonuje, są zdumiewające – najwyraźniej rafy stanowią coś więcej niż tylko przeszkody dla żeglugi."
 rapanui.290.f: "Charles Darwin odwiedził Wielką Rafę Koralową w 1836 roku podczas powrotnego etapu podróży na pokładzie HMS Beagle. Zwrócił uwagę na kilka charakterystycznych cech: masywne zewnętrzne krawędzie rafy tworzyły potężne ściany koralowe, które stromo opadały ku otwartemu oceanowi, miejscami na głębokość kilkuset metrów. Natomiast wewnątrz lagun zaobserwował brak żywych formacji koralowych – tamtejsze kolonie koralowców najwyraźniej obumarły. Darwin zauważył również, że koralowce na zewnętrznych krawędziach rafy utrzymywały się blisko powierzchni morza, mimo że dno pod nimi stopniowo się obniżało, ponieważ nieustannie rosły ku górze. Obserwacje te stały się podstawą jego ogólnego modelu powstawania raf koralowych. W 1842 roku opublikował dzieło „Struktura i rozmieszczenie raf koralowych”, w którym przedstawił swoją teorię osiadania. Zgodnie z nią rafy koralowe mogły powstawać wokół powoli zapadających się wysp lub na obniżających się szelfach kontynentalnych. Wielka Rafa Koralowa posłużyła Darwinowi za najbardziej wyrazisty przykład rafy barierowej i stała się jednym z najważniejszych dowodów potwierdzających jego teorię."
 rapanui.290.g: "Atole powstają z... koralowców?"
 notification_rapanui_ring_of_fire_notification_name: "Pierścień Ognia"
 notification_rapanui_ring_of_fire_notification_desc: "Geolog opracował przełomowe ustalenia na podstawie swoich obserwacji poczynionych na Oceanie Spokojnym, dotyczące zjawiska, które nazwał „Pierścieniem Ognia”."
 notification_rapanui_great_barrier_reef_notification_name: "Wielka Rafa Koralowa"
 notification_rapanui_great_barrier_reef_notification_desc: "Zagraniczny naukowiec uczestniczący w wyprawie na Pacyfik po raz pierwszy w pełni dostrzegł znaczenie Wielkiej Rafy Koralowej u wybrzeży Australii."
