 rapanui_low_native_aggressiveness_tt: "#YELLOW Agresywność rdzennej ludności#! jest #G niska#!. Nie musimy się martwić."
 rapanui_medium_native_aggressiveness_tt: "Agresywność rdzennej ludności jest #YELLOW umiarkowana#!. Od tej chwili powinniśmy zachować ostrożność, aby nie narażać życia naszego misjonarza."
 rapanui_high_native_aggressiveness_tt: "Agresywność rdzennej ludności jest #R wysoka#!. Wystarczy jeden niewłaściwy krok, aby cała misja była zagrożona niepowodzeniem."
 rapanui_low_mission_tension_tt: "Nie ma żadnych problemów z innymi misjami w tym kraju."
 rapanui_medium_mission_tension_tt: "Doszło do kilku konfliktów z misjonarzami innych wyznań, ale sytuacja pozostaje pod kontrolą."
 rapanui_high_mission_tension_tt: "Napięcia z konkurencyjną placówką misyjną mogą w każdej chwili przerodzić się w konflikt polityczny."
