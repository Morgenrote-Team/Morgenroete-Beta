 rapanui_easter_island_decision: "Aneksja Wyspy Wielkanocnej"
 rapanui_easter_island_decision_desc: "Wyspa Wielkanocna jest kluczowym punktem strategicznym na Pacyfiku, pozwalającym Chile umocnić dominację w regionie."
 rapanui_easter_island_decision_BOL_tt: "Chile musi posiadać większą flotę niż Boliwia."
 rapanui_easter_island_decision_PEU_tt: "Chile musi posiadać większą flotę niż Peru."
 rapanui_easter_island_ai_decision: "Aneksja Wyspy Wielkanocnej"
 rapanui_easter_island_ai_decision_desc: "Wyspa Wielkanocna jest kluczowym punktem strategicznym na Pacyfiku, pozwalającym Chile umocnić dominację w regionie."
 rapanui_pacific_expedition_decision: "Wyprawa na Pacyfik"
 rapanui_pacific_expedition_decision_desc: "Obok biegunów Ocean Spokojny jest jednym z ostatnich obszarów na Ziemi, które wciąż skrywają tajemnice. Uczeni z wielu dziedzin nauki są zainteresowani wyprawą badawczą, która pozwoli przeprowadzić badania z zakresu historii naturalnej, archeologii, astronomii i oceanografii. Dla wielkich mocarstw byłoby to również prestiżowe przedsięwzięcie, pozwalające zademonstrować ich wpływy na krańcu świata."
