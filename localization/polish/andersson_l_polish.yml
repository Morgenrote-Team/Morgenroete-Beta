 andersson_stop_anthropologist_project_button_desc: "Zatrzymaj obecny Projekt Antropologa. Twój #E Postęp Antropologiczny#! zostanie utracony."
 je_andersson_our_ancestors: "Historia Naszych Przodków"
 je_andersson_our_ancestors_reason: "Dr. [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] przygotowuje obecnie na jednym z naszych uniwersytetów wystawę poświęconą historii ewolucji człowieka. Ma ona przybliżyć życie naszych przodków i poszerzyć wiedzę zainteresowanych osób na ich temat."
