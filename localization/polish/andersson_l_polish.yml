 andersson.401.t: "Obozowisko Myśliwskie"
 andersson.401.d: "Podczas poszukiwań speleologicznych Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] natrafił na terenie [SCOPE.sState('andersson_state_scope').GetName] na pozostałości przypuszczalnego obozowiska myśliwskiego, które datuje na okres mezolitu."
 andersson.401.f: "Po krótkich poszukiwaniach antropologowi udało się zabezpieczyć liczne prehistoryczne artefakty. Wśród nich znalazły się włócznie i groty strzał, a także pięściak, który może pochodzić z okresu neolitu. Bardziej szczegółowe badania zostaną przeprowadzone po powrocie na uniwersytet."
 andersson.401.g: "Dzięki temu zdobędziemy nową wiedzę o przeszłości."
 andersson.402.t: "Ceramika"
 andersson.402.d: "Antropologom i archeologom udało się odnaleźć kilka wyrobów ceramicznych na terenie [SCOPE.sState('andersson_state_scope').GetName]. Będą się pięknie prezentować w kolekcji muzealnej."
 andersson.402.f: "Naczynia odnalezione przez antropologów można by uznać za prymitywne, gdyby nie wiedza, że mają już kilka tysięcy lat. Z tej perspektywy wydają się wręcz niezwykle kunsztowne. Specjalistom powierzono już zbadanie ceramiki pod kątem pozostałości barwników."
 andersson.402.g: "Obchodźcie się z tym ostrożnie!"
 andersson.403.t: "Osada Neolityczna"
 andersson.403.d: "Zespół antropologów prowadzący badania na terenie [SCOPE.sState('andersson_state_scope').GetName] donosi o dobrych wieściach: przy odrobinie szczęścia udało mu się odnaleźć pozostałości osady z okresu neolitu. Zapewniono Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName], że odkrycie to przyniesie liczne artefakty oraz nową wiedzę o tej epoce."
 andersson.403.f: "Jak się okazało, osada była już otoczona ogrodzeniem przypominającym palisadę. Udało się również zlokalizować i nanieść na mapę studnię, stajnie oraz spichlerz. Może to być jedna z pierwszych udokumentowanych osad na terenie naszego kraju."
 andersson.403.g: "Sensacja naukowa!"
 andersson.404.t: "Kości Człowieka"
 andersson.404.d: "Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] znalazł kilka nowych kości."
 andersson.404.f: "Pod kierownictwem Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] zespół antropologów zabezpieczył miejsce pochówku, w którym znajdowały się kości sprzed tysięcy lat, w tym kilka wyjątkowo dobrze zachowanych okazów."
 andersson.404.g: "Mam nadzieję, że nie będzie to kolejne rozczarowanie, jak w przypadku kości na zupę."
 andersson.406.t: "Prehistoryczny Flet Kościany"
 andersson.406.d: "Pewien turysta natknął się na dziwną kość w jaskini na terenie [SCOPE.sState('andersson_state_scope').GetName]. Po skontaktowaniu się z miejscowym uniwersytetem do jaskini wysłano Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName]. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetSheHe|U] znalazł kość, ale nie była to zwyczajna kość, lecz prehistoryczny flet kościany!"
 andersson.406.f: "„Czysty, wysoki dźwięk fletu kościanego przypomina anielski śpiew, który w tajemniczy sposób oczarowuje każdego, kto go usłyszy”."
 andersson.406.g: "Czy nadal można na nim grać?"
 andersson.408.t: "Odnaleziono Kości i Narzędzia Kamienne"
 andersson.408.d: "Na terenie [SCOPE.sState('andersson_state_scope').GetName] odkryto dużą liczbę kamiennych narzędzi i kości. Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] został natychmiast wysłany na miejsce, aby zbadać znalezisko. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetSheHe] rzeczywiście znalazł mnóstwo kości, pochodzących, jak się zdawało, od najróżniejszych gatunków zwierząt, a także kilka kamiennych artefaktów."
 andersson.408.f: "„Myślę, że to kość jelenia. A może człowieka? Może dinozaura? Rekina? Ogromnej małpy? Kości naprawdę nie są moją specjalnością...”"
 andersson.408.g: "Zaraz! Co to za kości? Współczesne? Prehistoryczne? Dinozaurów?"
 andersson.409.t: "Odkryto Prehistoryczną Wenus"
 andersson.409.d: "W [SCOPE.sState('andersson_state_scope').GetStateRegion.GetMineHubName] odkryto prehistoryczną figurkę z epoki kamienia. Wielu osobom nie podoba się jej wygląd, ponieważ niewielka figurka z kości słoniowej ma wydatne biodra i duże piersi. Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] nie jest jeszcze pewien, jakie było przeznaczenie figurki. Czy przedstawiała boginię, czy była jedynie talizmanem?"
 andersson.409.f: "Figurki Wenus to niewielkie prehistoryczne statuetki przedstawiające kobiety, tworzone w okresie górnego paleolitu, szczególnie w kulturze graweckiej (ok. 30 000–22 000 r. p.n.e.). Odnajdywane na obszarze całej Europy, a nawet Syberii, były zazwyczaj rzeźbione w kamieniu, kości słoniowej lub kościach zwierzęcych, a także lepione z gliny. Wiele z nich przedstawia kobiety o przesadnie uwydatnionych piersiach, biodrach i brzuchach, podczas gdy szczegóły twarzy często są pomijane. Do najsłynniejszych przykładów należą Wenus z Willendorfu i Wenus z Dolních Věstonic. Ich przeznaczenie pozostaje przedmiotem dyskusji. Według różnych interpretacji mogły być symbolami płodności, przedmiotami rytualnymi, autoportretami lub wyrazem tożsamości społecznej. Figurki Wenus uznaje się za ważne przykłady wczesnej sztuki symbolicznej."
 andersson.409.g: "Przejdzie do historii jako Wenus z [SCOPE.sState('andersson_state_scope').GetStateRegion.GetMineHubName]."
