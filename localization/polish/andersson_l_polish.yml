 andersson_evolutionist: "Ewolucjonista"
 andersson_evolutionist_desc: "Ewolucjonista to antropolog, który wyjaśnia rozwój kultur poprzez ich niezależną ewolucję."
 andersson_diffusionist: "Dyfuzjonista"
 andersson_diffusionist_desc: "Dyfuzjonista to antropolog, który wyjaśnia rozwój kultur przede wszystkim poprzez rozprzestrzenianie się idei między społeczeństwami."
