l_polish:
 rule_andersson_anthropology_rule: "#tooltip:[GetRawTextTooltipTag('mr_morgenroete_tt')] @mr_morgenroete_icon! #! Zasady Antropologii"
 setting_andersson_anthropology_historical_rule: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_andersson_anthropology_historical_rule_desc Historyczne#!#!"
 setting_andersson_anthropology_historical_rule_desc: "Od określonej daty historycznej można odnajdywać [Concept('concept_andersson_human_fossil','$MR_FOSSILS|q$')]. Skamieliny ludzkie odkryte w ramach wydarzenia historycznego nie zapewniają Prestiżu Antropologicznego. Jeśli państwo dokona odkrycia skamielin ludzkich przed datą historyczną, znalezisko otrzyma ogólną nazwę pochodzącą od miejsca, w którym zostało odkryte."
 setting_andersson_anthropology_free_rule: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_andersson_anthropology_free_rule_desc Wolne#!#!"
 setting_andersson_anthropology_free_rule_desc: "Z odkryciami [concept_andersson_human_fossil] nie są związane żadne konkretne wydarzenia historyczne. Wszystkie znaleziska otrzymują ogólne nazwy pochodzące od miejsc, w których zostały odkryte."
 andersson_has_active_anthropologist_tt: "Posiada [concept_andersson_anthropologist], który nie jest zajęty."
 andersson.106.t: "Zespół Antropologiczny Wyrusza"
 andersson.106.d: "Po zakończeniu prac zespołu antropologicznego asystenci badawczy powracają do ojczyzny. Odkryte przez nich jaskinie są teraz dostępne również dla naszych naukowców."
 andersson.106.f: "„Żaden człowiek przed nami nie zapuścił się w te głębiny. Nikt nie wie, dokąd zmierzamy ani co ujrzymy. Nigdy wcześniej nie ukazało się naszym oczom nic równie niezwykłego i pięknego, a my mimowolnie zadajemy sobie nawzajem to samo pytanie: czy aby nie śnimy?” – Charles Lyell"
 andersson.106.g: "To była dotąd cenna pomoc zagraniczna."
 andersson_anthropologist_dies_tt: "Wpis w Dzienniku zakończy się niepowodzeniem, jeśli [concept_andersson_anthropologist] umrze."
 je_andersson_reconstruct_prehistoric_skeleton: "Zrekonstruuj Prehistoryczny Szkielet"
 je_andersson_reconstruct_prehistoric_skeleton_reason: "Antropolodzy rekonstruują szkielety na podstawie swojego doświadczenia i posiadanych cech. Pierwszy zrekonstruowany szkielet każdego typu człowieka — Neoantropa, Paleoantropa, Pitekantropa lub Australopiteka — zostaje dodatkowo wystawiony w instytucie i zapewnia premię do prestiżu. Antropolodzy mogą również rekonstruować wszystkie pozostałe szkielety różnych typów człowieka, zdobywając w ten sposób dodatkowy Prestiż Antropologiczny."
