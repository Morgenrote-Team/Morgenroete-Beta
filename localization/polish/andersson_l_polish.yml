 andersson.61.t: "Człowiek z [GetPlayer.GetCustom('andersson_fossil_piltdown')]"
 andersson.61.d: "Dwaj czołowi antropolodzy zaprezentowali dziś odkrycie, które może wstrząsnąć światem nauki: odnaleźli ni mniej, ni więcej, tylko pierwszego człowieka współczesnego, który bez wątpienia wywodził się z [ROOT.GetCountry.GetNameNoFlag]."
 andersson.61.f: "Podczas posiedzenia Londyńskiego Towarzystwa Geologicznego Arthur Smith Woodward i Charles Dawson ogłosili, że fragmenty czaszki wczesnego człowieka, odnalezione w żwirowni niedaleko wioski Piltdown, stanowią epokowe odkrycie. Rekonstrukcja Woodwarda, oparta na znalezionych fragmentach, w dużej mierze przypominała czaszkę człowieka współczesnego. Różnice dotyczyły jednak potylicy, czyli tylnej części czaszki znajdującej się w pobliżu połączenia z kręgosłupem, oraz wielkości mózgu, który osiągał zaledwie około dwóch trzecich rozmiarów mózgu człowieka współczesnego. Również zęby i żuchwa wykazywały jedynie przybliżone podobieństwo do ludzkich. Powołując się na ogromny autorytet naukowy Muzeum Brytyjskiego, Woodward zinterpretował znaleziska z Piltdown jako brakujące ogniwo między małpami człekokształtnymi a ludźmi. Pomimo początkowych wątpliwości naukowcy z Muzeum Historii Naturalnej w Londynie oszacowali wiek znaleziska na 200 000–500 000 lat. Oznaczałoby to, że Człowiek z Piltdown był znacznie starszy od neandertalczyków. Ogłoszenie odkrycia natychmiast wzbudziło ogromne zainteresowanie zarówno ekspertów, jak i brytyjskiego społeczeństwa. Wiadomość o znalezisku z Piltdown stała się sensacją na całym świecie."
 andersson.61.g: "A więc pierwszy człowiek współczesny pochodził z [ROOT.GetCountry.GetAdjectiveNoFormatting]. Nic dziwnego!"
 andersson.61.h: "To znalezisko budzi ogromne wątpliwości."
 andersson.62.d: "Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName], czołowy antropolog naszego kraju, zaprezentował dziś odkrycie, które może wstrząsnąć światem nauki: [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetSheHe] odnalazł ni mniej, ni więcej, tylko pierwszego człowieka współczesnego, który bez wątpienia wywodził się z [ROOT.GetCountry.GetNameNoFlag]."
 andersson.62.f: "Podczas posiedzenia Towarzystwa Antropologicznego w [ROOT.GetCountry.GetCapital.GetCityHubName] [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetFullName] ogłosił, że fragmenty czaszki wczesnego człowieka, odnalezione w żwirowni niedaleko wioski [GetPlayer.GetCustom('andersson_fossil_piltdown')], stanowią epokowe odkrycie. Rekonstrukcja przeprowadzona przez [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] na podstawie znalezionych fragmentów w dużej mierze przypominała czaszkę człowieka współczesnego. Różnice dotyczyły jednak potylicy, czyli tylnej części czaszki znajdującej się w pobliżu połączenia z kręgosłupem, oraz wielkości mózgu, który osiągał zaledwie około dwóch trzecich rozmiarów mózgu człowieka współczesnego. Również zęby i żuchwa wykazywały jedynie przybliżone podobieństwo do ludzkich. Powołując się na ogromny autorytet naukowy Muzeum [ROOT.GetCountry.GetAdjectiveNoFormatting], [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] zinterpretował znaleziska z [GetPlayer.GetCustom('andersson_fossil_piltdown')] jako brakujące ogniwo między małpami człekokształtnymi a ludźmi. Pomimo początkowych wątpliwości naukowcy z Muzeum Historii Naturalnej w [ROOT.GetCountry.GetCapital.GetCityHubName] oszacowali wiek znaleziska na 200 000–500 000 lat. Oznaczałoby to, że odkryty człowiek był znacznie starszy od neandertalczyków. Ogłoszenie odkrycia natychmiast wzbudziło ogromne zainteresowanie zarówno ekspertów, jak i ludności [ROOT.GetCountry.GetAdjectiveNoFormatting]. Wiadomość o znalezisku z [GetPlayer.GetCustom('andersson_fossil_piltdown')] stała się sensacją na całym świecie."
 andersson.63.t: "Parantrop"
 andersson.63.d: "Podczas wycieczki szkolnej do Transwalu pewien uczeń przekazał Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] kilka skamielin do zbadania. Antropolog natychmiast zapragnął dowiedzieć się, gdzie chłopiec je znalazł. Po przybyciu na miejsce [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetSheHe] zdołał dokonać niezwykłych odkryć, wskazujących na istnienie zupełnie nieznanego gatunku, który być może nie był przodkiem człowieka, lecz jego bardzo dalekim krewnym."
 andersson.63.f: "Parantrop to rodzaj wymarłych homininów, obejmujący dwa powszechnie uznawane gatunki: P. robustus i P. boisei. Jednak zasadność wyodrębnienia rodzaju Paranthropus jest przedmiotem sporów i niekiedy uznaje się go za synonim rodzaju Australopithecus. Parantropy żyły od około 2,9 do 1,2 miliona lat temu, od końca pliocenu do środkowego plejstocenu. Charakteryzowały się masywnymi czaszkami z wyraźnym grzebieniem strzałkowym, przypominającym ten występujący u goryli, co wskazuje na silnie rozwinięte mięśnie żucia. Miały również szerokie zęby przystosowane do rozcierania pokarmu roślinnego. Przypisuje się im używanie narzędzi kościanych, a także wiąże się je z kontrowersyjnymi dowodami na najwcześniejsze wykorzystanie ognia. Zamieszkiwały głównie tereny leśne i współistniały z niektórymi wczesnymi gatunkami człowieka, takimi jak A. africanus, H. habilis i H. erectus."
 andersson.63.g: "Jeśli takie są rezultaty, doktor powinien częściej wyjeżdżać na urlop."
 andersson_add_piltdown_fossil_effect_tt: "Zyskaj #G 1#! @andersson_human_fossil! [Concept('concept_andersson_human_fossil','$concept_andersson_special_human_fossil|q$')]: Człowiek z [GetPlayer.GetCustom('andersson_fossil_piltdown')]."
 andersson_add_paranthropus_fossil_effect_tt: "Zyskaj #G 1#! @andersson_human_fossil! [Concept('concept_andersson_human_fossil','$concept_andersson_special_human_fossil|q$')]: Parantrop."
 andersson.202.a: "Poszukiwanie Homininów: Miejsce Docelowe"
 andersson.202.d: "Poszukiwanie Homininów może nie być tak pełne przygód jak Wyprawa Archeologiczna czy Wyprawa na Pacyfik, ale czasami również wiąże się z trudnymi wyzwaniami. Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] już nie może się doczekać rozpoczęcia szczegółowych poszukiwań ludzkich szczątków kostnych. Pozostaje pytanie: w którym regionie zespół powinien prowadzić poszukiwania?"
 andersson.202.f: "„Szanowni Panowie, wyruszamy w fascynującą podróż do początków ludzkości! Oczekuję naukowej dociekliwości, prawdziwej pasji odkrywczej i niezachwianej dyscypliny!\n\nP.S. Proszę zostawić psy w domu. To dotyczy również pana, profesorze Schabernack!”\n\nPodpisano: [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetFullName]"
