 andersson.311.t: "Nowy Prehistoryczny Szkielet"
 andersson.311.d: "Podczas publicznej uroczystości Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] zaprezentował nowy prehistoryczny szkielet zgromadzonej publiczności. Rekonstrukcja wzbudziła zainteresowanie środowiska naukowego."
 andersson.311.f: "„Możesz spojrzeć w przyszłość tylko tak daleko, jak daleko potrafisz spojrzeć w przeszłość”. – Raymond Dart"
 andersson.311.g: "[GetPlayer.GetName] jest światowej klasy potęgą naukową!"
 andersson.911.t: "Kongres Antropologiczny: Pochodzenie Człowieka Współczesnego"
 andersson.911.d: "Nasz kraj będzie gospodarzem najważniejszego kongresu w historii antropologii. Jego celem jest wyjaśnienie jednej z największych zagadek ludzkości, a mianowicie jej pochodzenia. Antropolodzy z całego świata będą debatować nad tym, czy człowiek współczesny wywodzi się z Europy, Azji czy Afryki. Debatę poprowadzi [SCOPE.sCharacter('andersson_anthropologist_scope').GetFullName]."
 andersson.911.f: "Skąd pochodzi człowiek? Już biblijna opowieść o wygnaniu z raju zawiera sedno tego pytania – człowiek najwyraźniej nie pochodzi z miejsca, w którym obecnie żyje. Dlatego przez długi czas w Europie uważano, że pradawne ludzkie kości są szczątkami ludzi, którzy zginęli podczas potopu – podobnie jak przez wiele lat sądzono, że dinozaury były zwierzętami, dla których zabrakło miejsca na arce. Wraz z pojawieniem się teorii epok lodowcowych oraz późniejszymi badaniami geologicznymi i paleontologicznymi, które wykazały, że Ziemia jest znacznie starsza, niż przypuszczano, wzrosło zainteresowanie „jaskiniowcami”. Najpóźniej wraz z rozwojem teorii ewolucji i odkryciem prehistorycznych kości liczących więcej niż kilka tysięcy lat pytanie o miejsce pochodzenia człowieka współczesnego stało się szczególnie palące."
 andersson.911.g: "Gdzie znajduje się kolebka ludzkości?"
 andersson.912.d: "[SCOPE.sCountry('andersson_congress_host_country').GetName] zaprosiło na międzynarodowy kongres naukowy. Tematem obrad będzie pochodzenie człowieka współczesnego. Profesor [SCOPE.sCharacter('andersson_anthropologist_scope').GetLastName] otrzymał serdeczne zaproszenie."
 andersson.914.t: "Czy człowiek współczesny pojawił się w Europie, Azji czy Afryce?"
 andersson.914.d: "Świat nauki podzielił się na trzy obozy. Kwestia kolebki ludzkości wiąże się nie tylko z pewną dumą narodową, lecz także z dalszymi hipotezami dotyczącymi ewolucji człowieka."
 andersson.914.f: "Podczas ożywionej debaty zwolennicy trzech obozów wymieniali się argumentami. [SCOPE.sCharacter('andersson_europe_defender_scope').GetLastName] opowiedział się za Europą, ponieważ dotychczasowe znaleziska wskazywały, że europejskie skamieliny charakteryzowały się największą pojemnością mózgoczaszki. Skoro rozwój większego mózgu poprzedzał wykształcenie dwunożnego chodu, wniosek ten wydawał się nieunikniony. [SCOPE.sCharacter('andersson_asia_defender_scope').GetLastName] zakwestionował jednak tę teorię. W Azji odnaleziono już skamieliny przypominających człowieka istot poruszających się w pozycji wyprostowanej, co oznaczało, że mózg rozwinął się dopiero po wykształceniu dwunożnego chodu. Z kolei [SCOPE.sCharacter('andersson_africa_defender_scope').GetLastName] zwrócił uwagę, że znane gatunki małp człekokształtnych najbliżej spokrewnionych z człowiekiem pochodziły z Afryki, a nie z Azji. Jak argumentował twórca teorii ewolucji, właśnie tam należało szukać początków ludzkości."
 andersson.914.g: "Człowiek współczesny wyewoluował w Europie."
 andersson.914.h: "Wszystko wskazuje na azjatyckie pochodzenie człowieka."
 andersson.914.i: "Kolebka ludzkości znajduje się w Afryce."
 andersson.915.t: "Przemówienie Cieszące się Uznaniem"
 andersson.915.d: "[SCOPE.sCharacter('andersson_anthropologist_scope').GetFullName] wygłosił w [SCOPE.sCountry('andersson_congress_host_country').GetName] wykład dla zgromadzonych przedstawicieli środowiska naukowego, który zainspirował zarówno słuchaczy, jak i młodych uczonych."
 andersson.915.f: "„Ziemia jest kolebką ludzkości, ale ludzkość nie może wiecznie pozostawać w kolebce”.\n – Konstantin Ciołkowski."
 andersson.915.g: "Profesor [SCOPE.sCharacter('andersson_anthropologist_scope').GetLastName] robi ogromne wrażenie."
 andersson.916.t: "Cenny Wkład w Debatę"
 andersson.916.d: "Błyskotliwy wykład naukowy profesora [SCOPE.sCharacter('andersson_anthropologist_scope').GetFullName] poszerzył horyzonty środowiska naukowego podczas kongresu w [SCOPE.sCountry('andersson_congress_host_country').GetName]. Jego wpływ prawdopodobnie będzie odczuwalny przez długie lata."
 andersson.916.f: "„Głosił bardzo dziwaczne teorie na wiele tematów. Pewnego razu wystąpił nawet na zgromadzeniu Brytyjskiego Towarzystwa Popierania Nauki i oświadczył, że małpy mają w mózgach hipokamp większy, zupełnie tak samo jak ludzie. Było to stwierdzenie wręcz oburzające, bo gdyby okazało się prawdziwe, cóż stałoby się z wiarą, nadzieją i miłością nieśmiertelnych milionów? Możesz sądzić, że między tobą a małpą istnieją inne, ważniejsze różnice, takie jak umiejętność mówienia, budowania maszyn, odróżniania dobra od zła, odmawiania modlitw i inne podobne drobiazgi. Ależ to dziecinne wyobrażenia, moje drogie dziecko. Liczy się wyłącznie wielka próba hipokampa. Jeśli masz w mózgu hipokamp większy, nie jesteś małpą, choćbyś miał czworo rąk, ani jednej stopy i był bardziej małpi niż wszystkie małpy ze wszystkich małpiarni”. – Charles Kingsley"
 andersson.917.t: "Dziedzictwo Antropologiczne"
 andersson.917.d: "Podczas kongresu ogłoszono smutną wiadomość, że kilka dni wcześniej zmarł wybitny antropolog. Jego prywatna kolekcja ma zostać wystawiona na aukcję."
 andersson.917.f: "„Ten człowiek nie miał ani dzieci, ani żony, ani przyjaciół, za to mnóstwo starych kamieni i kości. Cóż za błogosławione życie!”"
 andersson.917.g: "Każda kość jest cenna dla naszej kolekcji."
 andersson.917.h: "...ale mamy już dość kości."
 andersson.919.t_europe: "Człowiek współczesny pochodzi z Europy"
 andersson.919.t_asia: "Człowiek współczesny pochodzi z Azji"
 andersson.919.t_africa: "Człowiek współczesny pochodzi z Afryki"
 andersson.919.d_europe: "Międzynarodowe środowisko naukowe zgodziło się, że człowiek współczesny wywodzi się z Europy. Uczeni spoza Europy potępili tę decyzję jako przejaw supremacjonizmu."
 andersson.919.d_asia: "Międzynarodowy Kongres Antropologiczny osiągnął niedawno kompromis, uznając, że ludzkość musi wywodzić się z Azji. Większość uczestników zgromadzenia zgodziła się z tym poglądem."
 andersson.919.d_africa: "Po bardzo burzliwej debacie końcowej naukowcy zdołali niewielką większością głosów uzgodnić, że kolebka ludzkości znajduje się w Afryce."
 andersson.919.f_europe: "Z historycznego punktu widzenia kwestia rzeczywistego miejsca pochodzenia ludzkości pozostawała nierozstrzygnięta na początku XX wieku. Niewielka grupa badaczy, częściowo wprowadzona w błąd przez odkrycie tak zwanego Człowieka z Piltdown, upatrywała początków człowieka współczesnego w Europie, kierując się raczej względami ideologicznymi niż naukowymi. Największym poparciem cieszyła się jednak teoria azjatyckiego pochodzenia ludzkości. Istotną rolę odegrały w tym odkrycia na Jawie oraz odnalezienie szczątków Człowieka Pekińskiego. Dopiero od połowy XX wieku coraz liczniejsze znaleziska z Afryki zaczęły podważać ten pogląd."
 andersson.919.f_asia: "Z historycznego punktu widzenia kwestia rzeczywistego miejsca pochodzenia ludzkości pozostawała nierozstrzygnięta na początku XX wieku. Niewielka grupa badaczy, częściowo wprowadzona w błąd przez odkrycie tak zwanego Człowieka z Piltdown, upatrywała początków człowieka współczesnego w Europie, kierując się raczej względami ideologicznymi niż naukowymi. Największym poparciem cieszyła się jednak teoria azjatyckiego pochodzenia ludzkości. Istotną rolę odegrały w tym odkrycia na Jawie oraz odnalezienie szczątków Człowieka Pekińskiego. Dopiero od połowy XX wieku coraz liczniejsze znaleziska z Afryki zaczęły podważać ten pogląd."
 andersson.919.f_africa: "Z historycznego punktu widzenia kwestia rzeczywistego miejsca pochodzenia ludzkości pozostawała nierozstrzygnięta na początku XX wieku. Niewielka grupa badaczy, częściowo wprowadzona w błąd przez odkrycie tak zwanego Człowieka z Piltdown, upatrywała początków człowieka współczesnego w Europie, kierując się raczej względami ideologicznymi niż naukowymi. Największym poparciem cieszyła się jednak teoria azjatyckiego pochodzenia ludzkości. Istotną rolę odegrały w tym odkrycia na Jawie oraz odnalezienie szczątków Człowieka Pekińskiego. Dopiero od połowy XX wieku coraz liczniejsze znaleziska z Afryki zaczęły podważać ten pogląd."
 andersson.919.g: "Zgodnie z oczekiwaniami ludzkość wyewoluowała w Europie."
 andersson.919.h: "Wszystkie dowody wskazują na to, że ludzkość wyewoluowała w Azji."
 andersson.919.i: "Teza „Poza Afryką” jest obecnie powszechnie uznawana."
