 je_andersson_anthropological_research_reason: "[ROOT.GetCountry.GetCustom('je_andersson_anthropological_default_research_active_type')]An [concept_andersson_anthropologist] who is not busy will do Anthropological Research in their country. Sometimes they may find a [concept_andersson_cave]. Anthropologists who conduct cave explorations and excavations for extended periods can acquire the #V $dubois_paleontologist$#! or the #V $lepsius_archaeologist$#! [concept_character_trait] - but only one of the two. Every year of work will result in one @andersson_human_fossil! [concept_andersson_human_fossil].\n\n$mr_divider_for_je$\nAnthropologists may also find additional @andersson_human_fossil! [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils|q$')] or @andersson_prehistoric_artifact! [Concept('concept_andersson_prehistoric_artifact','$concept_andersson_prehistoric_artifacts|q$')], depending on the following factors:\n[ROOT.GetCountry.GetCustom('je_andersson_anthropological_default_research_anthropologist_paleontologist_trait_type')][ROOT.GetCountry.GetCustom('je_andersson_anthropological_default_research_anthropologist_archaeologist_trait_type')][ROOT.GetCountry.GetCustom('je_andersson_anthropological_default_research_anthropologist_speleologist_trait_type')][ROOT.GetCountry.GetCustom('je_andersson_anthropological_default_research_cave_type')]"
 je_andersson_hominid_prospecting_neoanthropus: "Poszukiwanie Homininów: Neoantrop"
 je_andersson_hominid_prospecting_neoanthropus_reason: "#p Poszukiwanie Homininów trwa obecnie w [SCOPE.sState('target').GetName].#!\n$mr_divider_for_je$\nPoszukiwanie skamielin ludzkich przez antropologów dzieli się na trzy etapy: eksplorację, gromadzenie i identyfikację. Podczas eksploracji antropolog przeszukuje teren w poszukiwaniu odpowiedniego stanowiska antropologicznego. Dopiero potem rozpoczyna gromadzenie skamielin. Gdy odnajdzie ich wystarczająco dużo, przystępuje do identyfikacji. Etapy eksploracji i gromadzenia kończą się wydarzeniem związanym z odkryciem. Podczas identyfikacji może również zostać rozpoznany nowy typ hominina.\n\n$mr_divider_for_je$\n[GetGeographicRegion('andersson_geographic_region_neoanthropus').GetName] to gatunek występujący na całym świecie. Tradycyjnie do tej kategorii zalicza się następujące typy:\n- [GetGeographicRegion('andersson_geographic_region_vero').GetName]\n- [GetGeographicRegion('andersson_geographic_region_lagoa_santa').GetName]\n- [GetGeographicRegion('andersson_geographic_region_cro_magnon').GetName]\n- [GetGeographicRegion('andersson_geographic_region_boskop').GetName]\n- [GetGeographicRegion('andersson_geographic_region_tianyuan').GetName]\n- [GetGeographicRegion('andersson_geographic_region_talgai').GetName]"
 je_andersson_hominid_prospecting_palaeanthropus: "Poszukiwanie Homininów: Paleoantrop"
 je_andersson_hominid_prospecting_palaeanthropus_reason: "#p Poszukiwanie Homininów trwa obecnie w [SCOPE.sState('target').GetName].#!\n$mr_divider_for_je$\nPoszukiwanie skamielin ludzkich przez antropologów dzieli się na trzy etapy: eksplorację, gromadzenie i identyfikację. Podczas eksploracji antropolog przeszukuje teren w poszukiwaniu odpowiedniego stanowiska antropologicznego. Dopiero potem rozpoczyna gromadzenie skamielin. Gdy odnajdzie ich wystarczająco dużo, przystępuje do identyfikacji. Etapy eksploracji i gromadzenia kończą się wydarzeniem związanym z odkryciem. Podczas identyfikacji może również zostać rozpoznany nowy typ hominina.\n\n$mr_divider_for_je$\n[GetGeographicRegion('andersson_geographic_region_palaeanthropus').GetName] występuje w Europie i na Bliskim Wschodzie. Tradycyjnie do tej kategorii zalicza się następujące typy:\n- [GetGeographicRegion('andersson_geographic_region_neanderthal').GetName]\n- [GetGeographicRegion('andersson_geographic_region_gibraltar').GetName]\n- [GetGeographicRegion('andersson_geographic_region_spy').GetName]\n- [GetGeographicRegion('andersson_geographic_region_krapina').GetName]\n- [GetGeographicRegion('andersson_geographic_region_galilee').GetName]"
 je_andersson_hominid_prospecting_pithecanthropus: "Poszukiwanie Homininów: Pitekantrop"
 je_andersson_hominid_prospecting_pithecanthropus_reason: "#p Poszukiwanie Homininów trwa obecnie w [SCOPE.sState('target').GetName].#!\n$mr_divider_for_je$\nPoszukiwanie skamielin ludzkich przez antropologów dzieli się na trzy etapy: eksplorację, gromadzenie i identyfikację. Podczas eksploracji antropolog przeszukuje teren w poszukiwaniu odpowiedniego stanowiska antropologicznego. Dopiero potem rozpoczyna gromadzenie skamielin. Gdy odnajdzie ich wystarczająco dużo, przystępuje do identyfikacji. Etapy eksploracji i gromadzenia kończą się wydarzeniem związanym z odkryciem. Podczas identyfikacji może również zostać rozpoznany nowy typ hominina.\n\n$mr_divider_for_je$\n[GetGeographicRegion('andersson_geographic_region_pithecanthropus').GetName] występuje w Europie, Afryce i Azji. Tradycyjnie do tej kategorii zalicza się następujące typy:\n- [GetGeographicRegion('andersson_geographic_region_heidelberg').GetName]\n- [GetGeographicRegion('andersson_geographic_region_rhodesian').GetName]\n- [GetGeographicRegion('andersson_geographic_region_peking').GetName]\n- [GetGeographicRegion('andersson_geographic_region_java').GetName]"
 je_andersson_hominid_prospecting_australopithecus: "Poszukiwanie Homininów: Australopitek"
 je_andersson_hominid_prospecting_australopithecus_reason: "#p Poszukiwanie Homininów trwa obecnie w [SCOPE.sState('target').GetName].#!\n$mr_divider_for_je$\nPoszukiwanie skamielin ludzkich przez antropologów dzieli się na trzy etapy: eksplorację, gromadzenie i identyfikację. Podczas eksploracji antropolog przeszukuje teren w poszukiwaniu odpowiedniego stanowiska antropologicznego. Dopiero potem rozpoczyna gromadzenie skamielin. Gdy odnajdzie ich wystarczająco dużo, przystępuje do identyfikacji. Etapy eksploracji i gromadzenia kończą się wydarzeniem związanym z odkryciem. Podczas identyfikacji może również zostać rozpoznany nowy typ hominina.\n\n$mr_divider_for_je$\n[GetGeographicRegion('andersson_geographic_region_australopithecus').GetName] występuje w Afryce."
