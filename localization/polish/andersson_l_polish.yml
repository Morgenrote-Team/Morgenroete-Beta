 andersson.405.t: "Megality z [SCOPE.sState('andersson_state_scope').GetFarmHubName]"
 andersson.405.d: "Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] bardzo zainteresował się megalitami z [SCOPE.sState('andersson_state_scope').GetFarmHubName] i szczegółowo zbadał ich pochodzenie. Niedawno [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetSheHe|U] opublikował [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetHerHis] prace na temat tych neolitycznych konstrukcji, w dużej mierze oparte na spekulacjach, czym zwrócił na siebie uwagę środowiska antropologicznego."
 andersson.405.f: "Kultura megalityczna to zjawisko charakterystyczne dla neolitu, w którym społeczności żyjące między 4500 a 1500 r. p.n.e. wykorzystywały ogromne bloki kamienne do wznoszenia monumentalnych miejsc kultu i pochówku. Od wybrzeży Atlantyku po Morze Śródziemne konstrukcje te ukształtowały pierwszy trwały krajobraz sakralny Europy. Przybierały różne formy: od pojedynczych menhirów i ciągnących się kilometrami rzędów kamieni, takich jak te w Carnac, po przypominające stoły dolmeny, służące jako zbiorowe miejsca pochówku. Szczególnie złożone były koliste konstrukcje typu henge, z których najsłynniejsza, Stonehenge, wyróżnia się precyzyjnym ustawieniem względem zjawisk astronomicznych. Transport i wznoszenie ważących kilka ton megalitów wymagały ogromnej organizacji społecznej, a także zaawansowanej wiedzy z zakresu statyki i logistyki."
 andersson.405.g: "I nasi przodkowie naprawdę zbudowali to 5000 lat temu?"
 andersson.407.t: "Czaszki, Czaszki i jeszcze więcej Czaszek!"
 andersson.407.d: "W [SCOPE.sState('andersson_state_scope').GetName] panuje skrajna nędza. Wszyscy cierpią z powodu powszechnych zniszczeń. Wszyscy? Nie! Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] znalazł liczne czaszki współczesnych ludzi, które [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetSheHe] zebrał do badań!"
 andersson.407.f: "„Tyle pięknych czaszek do moich badań kraniologicznych!”"
 andersson.407.g: "To dość makabryczne."
 andersson_institute_can_construct_has_fossils_tt: "Potrzebujemy #G 25#! @andersson_human_fossil! [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils|q$')]  (Mamy [GetPlayer.MakeScope.Var('andersson_total_human_fossil').GetValue|0])."
