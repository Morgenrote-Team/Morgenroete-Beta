 andersson.301.a: "Wybór Typu Rekonstrukcji"
 andersson.301.d: "[ROOT.Var('andersson_anthropologist_var').GetCharacter.GetFullName] zaszył się wśród swojej kolekcji kości z kilkoma skamielinami i skrupulatnie uporządkował znaleziska według miejsca ich odkrycia oraz podobieństw. Najwyraźniej kości pasują do siebie, tworząc szkielet. Ale jaki?"
 andersson.301.f: "„Kość czaszki łączy się z kością żebrową\nKość żebrowa łączy się z kością nogi\nKość nogi łączy się z kością biodrową\nKość biodrowa łączy się z kością ramienia.\nKość ramienia łączy się z kością czaszki.\nKość czaszki łączy się z kością żebrową."
