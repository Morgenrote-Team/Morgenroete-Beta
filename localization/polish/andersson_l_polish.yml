 je_andersson_hominid_expedition: "Wyprawa po Homininy"
 je_andersson_hominid_expedition_reason: "#p Wyprawa po Homininy trwa obecnie w [SCOPE.sState('target').GetName] na terenie [SCOPE.sState('target').GetCountry.GetName].#!\n$mr_divider_for_je$\nPoszukiwanie skamielin ludzkich przez antropologów dzieli się na trzy etapy: eksplorację, gromadzenie i identyfikację. Podczas eksploracji antropolog przeszukuje teren w poszukiwaniu odpowiedniego stanowiska antropologicznego. Dopiero potem rozpoczyna gromadzenie skamielin. Gdy odnajdzie ich wystarczająco dużo, przystępuje do identyfikacji. Etapy eksploracji i gromadzenia kończą się wydarzeniem związanym z odkryciem. Podczas identyfikacji może również zostać rozpoznany nowy typ hominina."
 andersson_je_no_subject_anymore_tt: "[GetPlayer.GetName] nie jest już suwerenem państwa podległego, na którego terenie odbywa się wyprawa."
 andersson_hominid_expedition_modifier: "Wyprawa po Homininy"
 andersson.205.t: "Wyprawa po Homininy: Typ"
 andersson.205.d: "Zanim Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] będzie mógł zorganizować wyprawę, należy najpierw zdecydować, jakiego rodzaju hominida ma ona odnaleźć."
 andersson.205.f: "„Czy ewolucja jest teorią, systemem czy hipotezą? Jest czymś znacznie więcej: jest ogólnym warunkiem, któremu muszą podporządkować się wszystkie teorie, hipotezy i systemy oraz który muszą spełniać odtąd, jeśli mają być możliwe do pomyślenia i prawdziwe”. -Pierre Teilhard de Chardin"
 andersson.206.t: "Wyprawa po Homininy: Region"
 andersson.206.d: "Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] polecił już swoim asystentom przynieść mapy obcych terytoriów, które warto byłoby zbadać podczas wyprawy. Decyzja nie została jeszcze podjęta."
 andersson.206.f: "„Pozostawałem otwarty na możliwość, że hominid był obecny w Europie we wczesnym plejstocenie”. -Louis Leakey"
 andersson.213.t: "Wyprawa po Homininy: Zakończona"
 andersson.213.d: "Po wyczerpującej, ale wartej wysiłku wyprawie Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] i jego zespół powrócili cali i zdrowi. Zbiory Instytutu Antropologicznego wzbogaciły się o kilka kości."
 andersson.213.f: "„No, to już skończone... a ja razem z tym”. -Robert Broom (o ukończeniu monografii na temat australopiteków na krótko przed śmiercią)"
 andersson.225.d: "Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] dokonał spektakularnego odkrycia w jaskini na terenie [SCOPE.sCountry('andersson_cave_country_scope').GetName]!"
