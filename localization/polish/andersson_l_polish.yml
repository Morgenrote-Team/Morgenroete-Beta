 andersson.501.t: "Człowiek z [GetPlayer.GetCustom('andersson_fossil_piltdown')] to fałszerstwo!"
 andersson.501.d: "Po przeprowadzeniu szczegółowych badań Dr. [SCOPE.sCharacter('andersson_piltdown_attacker_scope').GetLastName] zdołał udowodnić, że domniemane szczątki ludzkie są fałszerstwem. To ogromna kompromitacja dla [GetGlobalVariable('andersson_piltdown_country_global_var').GetCountryDefinition.GetName]. Główny antropolog kraju [SCOPE.sCountry('andersson_piltdown_defender_country_scope').GetAdjectiveNoFormatting], Dr. [SCOPE.sCharacter('andersson_piltdown_defender_scope').GetLastName], został zdemaskowany jako oszust! [SCOPE.sCharacter('andersson_piltdown_attacker_scope').GetSheHe]"
 andersson.501.f: "Od czasu odkrycia Człowieka z [GetPlayer.GetCustom('andersson_fossil_piltdown')] wielu naukowców spoza [SCOPE.sCountry('andersson_piltdown_defender_country_scope').GetAdjectiveNoFormatting] środowiska naukowego wyrażało poważne wątpliwości co do autentyczności znaleziska, przypisując rzekome „odkrycie” raczej [SCOPE.sCountry('andersson_piltdown_defender_country_scope').GetAdjectiveNoFormatting] pragnieniu zdobycia uznania. Dotychczasowe próby udowodnienia fałszerstwa podejmowane przez szanowanych uczonych kończyły się niepowodzeniem. Jednak [SCOPE.sCharacter('andersson_piltdown_attacker_scope').GetFullName] wreszcie ujawnił światu prawdziwą naturę tego odkrycia: największą mistyfikację w historii antropologii. Czaszka nie tylko okazała się znacznie młodsza, niż twierdzono, i pochodziła zaledwie ze średniowiecza, ale również została spreparowana przez fałszerza, który połączył górną część ludzkiej czaszki ze szczękami orangutana."
 andersson.501.g: "Ostatecznie zwycięża rzetelna nauka."
 andersson.502.t: "Katastrofa Naukowa!"
 andersson.502.g: "Bezprecedensowa kompromitacja na arenie międzynarodowej!"
 andersson.503.t: "Debata Przegrana"
 andersson.503.d: "Pomimo licznych argumentów przedstawionych przez Dr. [SCOPE.sCharacter('andersson_piltdown_attacker_scope').GetLastName], [SCOPE.sCharacter('andersson_piltdown_attacker_scope').GetHerHis] starania ostatecznie nie przekonały środowiska naukowego, że Człowiek z [GetPlayer.GetCustom('andersson_fossil_piltdown')] jest w rzeczywistości fałszerstwem. Dr. [SCOPE.sCharacter('andersson_piltdown_defender_scope').GetLastName] okazał się znakomitym mówcą."
 andersson.503.f: "Najwyraźniej naukowiec z [SCOPE.sCountry('andersson_piltdown_defender_country_scope').GetAdjectiveNoFormatting] miał jeszcze kilka asów w rękawie [SCOPE.sCharacter('andersson_piltdown_defender_scope').GetHerHis] w dniu debaty. Nasz antropolog za porażkę obwinia stronniczość, łapówki i kiepskie śniadanie."
 andersson.503.g: "Może jednak to znalezisko jest autentyczne...?"
 andersson.504.t: "Triumf Naukowy"
 andersson.504.d: "Próba zdemaskowania naszego cennego Człowieka z [GetPlayer.GetCustom('andersson_fossil_piltdown')] jako fałszerstwa, podjęta przez nieznaczącego naukowca z jeszcze mniej znaczącego kraju, zakończyła się niepowodzeniem. Instytut Antropologiczny wychodzi z tego sporu wzmocniony."
 andersson.504.f: "Jest absolutnie oczywiste, że człowiek współczesny musi pochodzić z [SCOPE.sCountry('andersson_piltdown_defender_country_scope').GetName], skoro obce kraje nie mają do zaoferowania nic poza tak niedorzecznymi argumentami."
 andersson.504.g: "Następny, proszę!"
 andersson.511.t: "Człowiek z [GetPlayer.GetCustom('andersson_fossil_piltdown')]: Przygotowanie do Debaty"
 andersson.511.d: "Dr. [SCOPE.sCharacter('andersson_piltdown_attacker_scope').GetLastName] przygotowuje się do zdemaskowania ważnej skamieliny jako fałszerstwa. [SCOPE.sCharacter('andersson_piltdown_attacker_scope').GetSheHe|U] zmierzy się z Dr. [SCOPE.sCharacter('andersson_piltdown_defender_scope').GetLastName]. Oboje bronią zarówno własnego honoru, jak i honoru swoich krajów."
 andersson.511.f: "Siła antropologa w debacie zależy przede wszystkim od jego doświadczenia, a w drugiej kolejności od jego cech charakteru. Uwzględnia się również niewielki element losowości, ponieważ brane są pod uwagę codzienne wahania formy. Kraj posiadający skamielinę ma niewielką przewagę, ponieważ nowa teoria musi najpierw zwyciężyć nad już ugruntowaną. Debatę wygrywa antropolog z wyższym wynikiem siły debatowania. W przypadku remisu zwycięża obrońca.\n\n[SCOPE.sCharacter('andersson_piltdown_attacker_scope').GetFullNameNoFormatting] z kraju [SCOPE.sCountry('andersson_piltdown_attacker_country_scope').GetName]: [SCOPE.GetValue('andersson_piltdown_attacker_points_scope')|0+] #V Siła Debatowania#!\n\n[SCOPE.sCharacter('andersson_piltdown_defender_scope').GetFullNameNoFormatting] z kraju [SCOPE.sCountry('andersson_piltdown_defender_country_scope').GetName]: [SCOPE.GetValue('andersson_piltdown_defender_points_scope')|0+] #V Siła Debatowania#!"
 andersson.511.g: "Stawiamy [GetGlobalVariable('andersson_piltdown_country_global_var').GetCountryDefinition.GetName] do publicznej debaty naukowej!"
 andersson.511.h: "Po namyśle to chyba nie jest najlepszy pomysł."
