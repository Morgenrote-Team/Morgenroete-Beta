 andersson_neolithic_scenery_modifier: "Epoka Neolitu"
 andersson_mesolithic_scenery_modifier: "Epoka Mezolitu"
 andersson_upper_paleolithic_scenery_modifier: "Epoka Górnego Paleolitu"
 andersson.601.t_neolithic: "Epoka Neolitu"
 andersson.601.t_mesolithic: "Epoka Mezolitu"
 andersson.601.t_upper_paleolithic: "Epoka Górnego Paleolitu"
 andersson.601.d: "Dr. [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] zakończył przygotowania do inscenizacji życia w czasach prehistorycznych. Zarówno studenci i profesorowie, jak i zainteresowani przedstawiciele społeczeństwa oglądają rzeźby, aby wyrobić sobie wyobrażenie o życiu w dawnych czasach."
 andersson.601.f_neolithic: "Neolit, czyli młodsza epoka kamienia, przyniósł fundamentalną przemianę w życiu człowieka, polegającą na przejściu od koczowniczego trybu życia opartego na łowiectwie i zbieractwie do osiadłego rolnictwa. W tej epoce ludzie rozpoczęli systematyczne udomawianie roślin i zwierząt, co zapewniło im bardziej niezawodne źródła pożywienia. Zmiana ta umożliwiła powstawanie stałych osad, w których wznoszono trwałe domostwa z drewna, kamienia lub cegieł mułowych. Nadwyżki żywności pozwoliły na utrzymanie większej liczby ludności i przyczyniły się do rozwoju wyspecjalizowanych zajęć, takich jak garncarstwo i tkactwo. Pod względem technologicznym epokę tę charakteryzowało stosowanie gładzonej broni i narzędzi kamiennych oraz kształtowanie się hierarchii społecznych."
 andersson.601.f_mesolithic: "Mezolit, czyli środkowa epoka kamienia, stanowił okres przejściowy między paleolitem a neolitem. Rozpoczął się po ostatniej epoce lodowej i charakteryzował się ociepleniem klimatu oraz ustępowaniem lodowców, co zmusiło grupy ludzkie do przystosowania się do zmieniających się ekosystemów. W przeciwieństwie do swoich przodków ludzie mezolitu wykorzystywali mikrolity — niewielkie, zaawansowane technologicznie ostrza krzemienne, z których tworzono narzędzia złożone, takie jak włócznie z zadziorami i strzały. Choć ludzie nadal prowadzili w większości koczowniczy tryb życia, większa dostępność ryb, zwierzyny leśnej i dzikich roślin zapewniała im większą stabilność zaopatrzenia w żywność w poszczególnych porach roku i umożliwiała korzystanie z tymczasowych obozowisk bazowych."
 andersson.601.f_upper_paleolithic: "Górny paleolit, czyli późna epoka kamienia, stanowi końcowy etap paleolitu i wyróżnia się gwałtownym rozkwitem ludzkiej kreatywności oraz rozwojem zdolności poznawczych. W tym okresie Homo sapiens rozwinął wysoce wyspecjalizowane techniki wytwarzania ostrzy, tworząc zaawansowane narzędzia z krzemienia, kości i poroża. Ludzie prowadzili koczowniczy tryb życia, utrzymując się z łowiectwa i zbieractwa oraz podążając za wielkimi stadami migrujących zwierząt, takimi jak renifery i mamuty, przemierzając rozległe tundry. Epoka ta zapisała się w historii nie tylko dzięki sposobom zapewniania sobie przetrwania, lecz przede wszystkim dzięki narodzinom sztuki figuratywnej i ekspresji symbolicznej. Ludzie tworzyli kunsztowne malowidła jaskiniowe, wyszukane ozdoby osobiste oraz słynne figurki „Wenus”, co wskazuje na rozwój złożonego języka i wierzeń duchowych."
 andersson.601.g: "Wspaniale!"
 andersson.64.t: "Groty Clovis"
 andersson.64.d: "W Clovis w stanie Nowy Meksyk Dr. [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] odkrył najstarsze jak dotąd ślady obecności rdzennych mieszkańców Ameryki — groty włóczni są znacznie starsze niż jakiekolwiek inne znaleziska badaczy na tym kontynencie."
 andersson.64.f: "Odkrycie grotów Clovis na początku XX wieku zrewolucjonizowało amerykańską archeologię i antropologię. Te charakterystycznie ukształtowane, kamienne groty włóczni z rowkami zostały po raz pierwszy rozpoznane pod koniec lat 20. i na początku lat 30. XX wieku w pobliżu Clovis w stanie Nowy Meksyk. Przełom nastąpił, gdy narzędzia te znaleziono w bezpośrednim sąsiedztwie szczątków wymarłej plejstoceńskiej megafauny, a konkretnie mamutów. Przez dziesięciolecia odkrycie to stanowiło podstawę modelu „Clovis First”, zgodnie z którym wyspecjalizowani łowcy posługujący się tymi narzędziami byli pierwszymi ludźmi, którzy dotarli na kontynent około 13 000 lat temu."
 andersson.64.g: "To oznacza, że ludzie pojawili się w Ameryce ponad 10 000 lat wcześniej, niż dotychczas sądzono!"
 andersson.65.t: "Człowiek Smok"
 andersson.65.d: "Podczas budowy mostu w Harbinie jeden z robotników budowlanych natrafił na osobliwą czaszkę. Dr. [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] został natychmiast powiadomiony i zbadał znalezisko. Wstępna diagnoza jest zdumiewająca: czy oprócz neandertalczyków istniał jeszcze inny gatunek człowieka, który zamieszkiwał Chiny?"
 andersson.65.f: "Skamieniałą czaszkę odkrytą w Harbinie w Chinach, znaną jako Człowiek Smok, przypisano do gatunku Homo longi. Choć czaszkę odnaleziono już w 1933 roku, dopiero w 2021 roku wzbudziła ona szerokie zainteresowanie środowiska naukowego. Licząca co najmniej 146 000 lat czaszka pochodzi ze środkowego plejstocenu i wykazuje wyjątkowe połączenie cech pierwotnych i bardziej zaawansowanych ewolucyjnie. Homo longi charakteryzował się masywną budową ciała, dużą mózgoczaszką, wydatnymi wałami nadoczodołowymi i niemal kwadratowymi oczodołami. Niektórzy badacze twierdzą, że ta linia ewolucyjna była bliżej spokrewniona z człowiekiem współczesnym (Homo sapiens) niż nawet neandertalczycy. Obecnie większość badaczy sugeruje, że Człowiek Smok należał do populacji denisowian."
 andersson.65.g: "Smoczy ludzie? Jak bardzo byli niebezpieczni?"
 andersson.66.t: "Homo floresiensis"
 andersson.66.d: "Podczas wyprawy badawczej na Flores Dr. [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] dokonał odkrycia, które wcześniej uważano za niemożliwe — skamielina wskazuje, że na wyspie żył odrębny, karłowaty gatunek człowieka!"
 andersson.66.f: "Odkryty w 2003 roku w jaskini Liang Bua na indonezyjskiej wyspie Flores Homo floresiensis to wymarły gatunek hominina o niewielkich rozmiarach ciała, który przetrwał do około 50 000 lat temu. Osiągał zaledwie około 1,1 metra wzrostu, a objętość jego mózgu wynosiła około 400 centymetrów sześciennych, przez co zyskał przydomek „Hobbit”. Naukowcy uważają, że jego niewielkie rozmiary były wynikiem karłowatości wyspowej — procesu ewolucyjnego, w którym izolowane gatunki zamieszkujące wyspy zmniejszają swoje rozmiary z powodu ograniczonych zasobów. Pomimo niewielkich mózgów przedstawiciele tego gatunku posługiwali się zaawansowanymi narzędziami kamiennymi i polowali na słonie karłowate. Ich dokładne miejsce w drzewie genealogicznym człowieka pozostaje przedmiotem sporów, a wśród teorii pojawiają się zarówno powiązania z Homo erectus, jak i z jeszcze bardziej prymitywnymi przodkami."
 andersson.66.g: "Czy mieszkali w jaskiniach, palili zioła i mieli owłosione stopy?"
 je_andersson_craniometry: "Kraniometria"
 je_andersson_craniometry_reason: "Dr. [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] przez kilka miesięcy całkowicie poświęcał się mierzeniu licznych czaszek, a my jesteśmy absolutnie przekonani, że to zupełnie normalne, naukowe zachowanie, z którego nigdy nie mogłoby zrodzić się żadne szalone idee."
 je_andersson_craniometry_goal: "Antropolog ukończył swoje badania kraniometryczne po roku."
 andersson.701.t: "Pomiary Czaszek Zakończone"
 andersson.701.d: "Dr. [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] zdołał się odprężyć i przez wiele miesięcy mierzył, katalogował, opisywał i porównywał setki czaszek, wyciągając wnioski na potrzeby [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetHerHis] dalszych badań antropologicznych. To było przyjemne!"
 andersson.701.f: "W XIX wieku kraniometria — naukowa metoda pomiaru czaszki — stała się dominującą metodą klasyfikowania zróżnicowania ludzi. Jej zwolennicy, tacy jak Samuel Morton i Paul Broca, uważali, że pojemność i kształt czaszki bezpośrednio wskazują na inteligencję, charakter moralny i status ewolucyjny człowieka. Wskaźnik cefaliczny, opracowany przez Andersa Retziusa, służył do rozróżniania populacji „prymitywnych” i „zaawansowanych”. Chociaż kraniometria była wykorzystywana do uzasadniania polityki rasowej, liczne odkrycia okazały się przydatne w badaniach skamielin ludzkich."
 andersson.701.g: "To było dość osobliwe."
 andersson.711.t: "Monogenizm kontra Poligenizm"
 andersson.711.d: "Dr. [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] wielokrotnie dostrzegał prawidłowości podczas [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetHerHis] badań czaszek, które nie mogły być dziełem przypadku. To oczywiste, że ludzie nie mają wspólnego pochodzenia."
 andersson.711.f: "Spór między monogenizmem a poligenizmem był jednym z głównych konfliktów w antropologii XIX wieku i dotyczył pochodzenia człowieka. Monogeniści opowiadali się za jednym wspólnym pochodzeniem ludzkości, powołując się zazwyczaj na biblijny opis stworzenia lub późniejsze teorie ewolucyjnego wspólnego pochodzenia. Uważali, że różnice fizyczne między populacjami wynikają z wpływu czynników środowiskowych. Poligeniści natomiast twierdzili, że rasy ludzkie należą do odrębnych gatunków, które wywodzą się z różnych źródeł. Pogląd ten często uzasadniano wczesnymi badaniami kraniometrycznymi, które miały dowodzić istnienia „stałych” hierarchii biologicznych."
 andersson.711.g: "Badania kraniometryczne nie pozostawiają żadnych wątpliwości!"
 andersson.711.h: "[GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] musi się mylić; ludzkość ma przecież tylko jedno wspólne pochodzenie."
 andersson.712.t: "Ewolucjonizm kontra Dyfuzjonizm"
 andersson.712.d: "Badając czaszki pochodzące ze starożytnego Egiptu, Rzymu i Ameryki Północnej, Dr. [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] wielokrotnie zadawał [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetHerselfHimself] pytanie, czy istnieją kultury wyższe, z których wszelkie osiągnięcia rozprzestrzeniają się niczym z ośrodków innowacji, czy też wszystkie kultury muszą przejść przez kolejne etapy rozwoju — od barbarzyństwa do cywilizacji — a liczne społeczności są jedynie uwięzione na poziomie epoki kamienia?"
 andersson.712.f: "Ewolucjoniści opowiadali się za ewolucją jednoliniową. Uważali, że wszystkie społeczeństwa przechodzą przez te same etapy rozwoju — od „dzikości” do „cywilizacji” — pod wpływem uniwersalnej ludzkiej psychiki i niezależnych wynalazków. Dyfuzjoniści natomiast kwestionowali takie wewnętrzne uwarunkowania rozwoju. Twierdzili, że istotne cechy kulturowe i technologie rzadko były wynajdywane niezależnie w różnych miejscach. Ich zdaniem idee powstawały w określonych „ośrodkach kulturowych”, a następnie rozprzestrzeniały się po świecie za sprawą migracji, handlu lub podbojów."
 andersson.712.g: "Każda kultura przechodzi drogę od epoki kamienia do nowoczesności."
 andersson.712.h: "Istnieje kultura, z której postęp rozprzestrzenia się koncentrycznie."
