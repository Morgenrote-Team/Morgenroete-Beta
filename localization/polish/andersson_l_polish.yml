 andersson.801.t: "Homo Sapiens"
 andersson.801.d: "Dr. [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] wyjaśnił niejasności dotyczące różnych typów tak zwanego Neoanthropus i ostatecznie uznaje je jedynie za odmiany jednego typu: Homo Sapiens."
 andersson.801.f: "Przejście od Neoanthropus do Homo sapiens stanowi przełomowy etap w rozwoju paleoantropologii XX wieku. Termin Neoanthropus („nowy człowiek”), spopularyzowany początkowo w latach 20.–50. XX wieku, był kategorią typologiczną służącą do odróżniania współczesnych ludzi od archaicznych linii rozwojowych, takich jak neandertalczycy. Termin ten odgrywał kluczową rolę w obecnie zarzuconej „teorii presapiens”. Podczas kształtowania się nowoczesnej syntezy ewolucyjnej w latach 50. XX wieku biolodzy ewolucyjni, a zwłaszcza Ernst Mayr, opowiedzieli się za ścisłą taksonomią opartą na badaniu populacji. Sprzeciwiali się mnożeniu zbędnych nazw rodzajowych i postulowali powrót do nazwy linneuszowskiej Homo sapiens (1758). Ta zmiana klasyfikacji zastąpiła sztywne „typy” morfologiczne jednolitą koncepcją gatunku biologicznego. W rezultacie porzucono nazwę Neoanthropus, zaliczając wszystkich współczesnych ludzi do jednego taksonu, podkreślającego ciągłość ewolucyjną."
 andersson.801.g: "Antropologia wyrasta z wieku dziecięcego."
 andersson.802.t: "Homo Neanderthalensis"
 andersson.802.d: "Dr. [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] wyjaśnił zamieszanie wokół różnych typów tak zwanych Paleoantropów i ostatecznie uznał je za odmiany jednego gatunku: Homo neanderthalensis."
 andersson.802.f: "Przejście od określenia Paleoantrop do nazwy Homo neanderthalensis odzwierciedla ujednolicenie taksonomii homininów, które nastąpiło w połowie XX wieku. Początkowo termin Paleoantrop („człowiek pradawny”) służył jako szeroka kategoria obejmująca archaiczne formy człowieka, przede wszystkim neandertalczyków, w celu odróżnienia ich od współczesnych linii ewolucyjnych. Terminologia ta odzwierciedlała typologiczne podejście charakterystyczne dla początku XX wieku, w którym archaiczne formy często postrzegano jako odrębne, następujące po sobie „etapy ewolucji”. W okresie nowoczesnej syntezy ewolucyjnej (lata 40. i 50. XX wieku) naukowcy tacy jak Ernst Mayr opowiadali się za jednolitą klasyfikacją w obrębie rodzaju Homo. Nieprecyzyjne określenie Paleoantrop zostało porzucone na rzecz nazwy Homo neanderthalensis (lub Homo sapiens neanderthalensis), a neandertalczyków zaczęto traktować jako populację biologiczną, a nie odrębny, „prymitywny” typ człowieka. Zmiana ta podkreślała ciągłość procesów ewolucyjnych i stworzyła podstawy współczesnego systemu klasyfikacji, w którym neandertalczycy są uznawani za wyspecjalizowaną, siostrzaną linię ewolucyjną człowieka współczesnego."
 andersson.803.t: "Homo Erectus"
 andersson.803.d: "Dr. [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] wyjaśnił zamieszanie wokół różnych typów tak zwanych Pitekantropów i ostatecznie uznał je za odmiany jednego gatunku: Homo erectus."
 andersson.803.f: "Przejście od określenia Pitekantrop do nazwy Homo erectus odzwierciedla proces ujednolicania klasyfikacji różnorodnych znalezisk kopalnych z poszczególnych regionów świata w ramach jednego, szeroko rozpowszechnionego gatunku. Termin Pithecanthropus („małpolud”), wprowadzony przez Eugène'a Dubois w 1891 roku w związku z odkryciem Człowieka Jawajskiego, miał oznaczać „brakujące ogniwo” między naczelnymi innymi niż człowiek a człowiekiem współczesnym. Na początku XX wieku kolejne nazwy, takie jak Sinanthropus (Człowiek Pekiński), dodatkowo komplikowały taksonomię homininów. Decydujący przełom nastąpił w okresie nowoczesnej syntezy ewolucyjnej, około 1950 roku, głównie za sprawą Ernsta Mayra. Mayr argumentował, że różnice anatomiczne między okazami pochodzącymi z Azji i Afryki odzwierciedlały zróżnicowanie na poziomie populacji, a nie odrębność rodzajową. Przeklasyfikowując te skamieliny do gatunku Homo erectus, naukowcy odeszli od typologicznego poszukiwania „brakujących ogniw” na rzecz jednolitej biologicznej koncepcji gatunku, uznając istnienie szeroko rozpowszechnionego i wyjątkowo dobrze przystosowującego się do różnych warunków przodka człowieka należącego do rodzaju Homo."
