 andersson.10.t: "Instytut Antropologii i Etnologii"
 andersson.10.d: "Podczas uroczystej ceremonii [SCOPE.sCharacter('andersson_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('andersson_ruler').GetFullName] osobiście otworzył dziś Instytut Antropologii i Etnologii."
 andersson.10.f: "Ceremonia otwarcia miała uroczysty charakter i spotkała się z ogólnie przychylnym przyjęciem, ciesząc się uznaniem prasy, ekspertów i społeczeństwa. Nie zabrakło jednak głosów krytyki. Kolejny budynek pełen prestiżowych osobliwości, będący jedynie przejawem jakiejś obsesji kolekcjonerskiej, bez żadnej rzeczywistej wartości? Jedna z opozycyjnych gazet pisała o marnotrawstwie pieniędzy i braku oryginalności. Twierdzono, że rząd nie ma już niczego nowego do zaoferowania. Jedni kolekcjonowali artefakty, inni rośliny lecznicze, byli też ci fanatycy dinozaurów – a teraz przyszła kolej na ludzkie kości! Na szczęście te negatywne opinie stanowiły zdecydowaną mniejszość i nie ostudziły utrzymującego się entuzjazmu wobec nowego gmachu, którego znaczenie [SCOPE.sCharacter('andersson_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('andersson_ruler').GetFullName] ponownie podkreślił."
 andersson.10.g: "Odwiedź Instytut."
 andersson.21.t: "Człowiek z Vero"
 andersson.21.d: "Elias Sellards wywołał sensację w całym kraju, odkrywając na Florydzie pradawne kości."
 andersson.21.f: "Człowiek z Vero to określenie ważnego znaleziska ludzkich szczątków z plejstocenu, odkrytych przez geologa Eliasa Sellardsa w latach 1915–1916 w Vero Beach na Florydzie. Odkrycie początkowo wzbudziło ogromne kontrowersje, ponieważ szczątki znajdowały się w tej samej warstwie geologicznej co wymarła megafauna epoki lodowcowej, co podważało dominujące wówczas przekonanie naukowców, że ludzie dotarli do obu Ameryk znacznie później. Współczesne datowanie radiowęglowe i zaawansowane metody archeologiczne potwierdziły, że stanowisko to stanowi jeden z najstarszych śladów obecności człowieka w Ameryce Północnej, sięgający około 13 000 lat wstecz."
 andersson.21.g: "Fascynujące."
 andersson.22.t: "Człowiek z Lagoa Santa"
 andersson.22.d: "Duński naukowiec dokonał zaskakującego odkrycia w brazylijskiej jaskini."
 andersson.22.f: "Człowiek z Lagoa Santa to określenie zbioru szczątków szkieletowych Paleoindian, odkrytych w połowie XIX wieku przez duńskiego przyrodnika Petera Wilhelma Lunda w wapiennych jaskiniach brazylijskiego stanu Minas Gerais. Współczesne badania genetyczne i analizy archeologiczne pozwoliły ustalić, że szczątki te pochodzą z okresu jednej z najwcześniejszych fal osadnictwa ludzkiego w Ameryce Południowej, sprzed około 10 000–12 000 lat."
 andersson.23.t: "Człowiek z Cro-Magnon"
 andersson.23.d: "Louis Lartet odkrył kilka szkieletów prehistorycznych ludzi, które wykazują znacznie większe podobieństwo do współczesnego człowieka niż do neandertalczyków. Od stanowiska Abri de Cro-Magnon tych pierwszych Europejczyków nazwano kromaniończykami."
 andersson.23.f: "Człowiek z Cro-Magnon to określenie pierwszych przedstawicieli człowieka współczesnego (Homo sapiens) z okresu górnego paleolitu w Europie, których szczątki odkrył w 1868 roku geolog Louis Lartet w schronisku skalnym w Les Eyzies we Francji. Na stanowisku odnaleziono pięć szkieletów, a także narzędzia kamienne, rzeźbione poroża i szczątki zwierząt, co dostarczyło pierwszego niepodważalnego dowodu na to, że ludzie anatomicznie współcześni żyli w Europie w czasach występowania wymarłej fauny plejstoceńskiej. Odkrycia te odegrały kluczową rolę w rozwoju paleontologii człowieka, pozwalając datować szczątki na okres sprzed około 28 000–30 000 lat oraz odróżnić je od wcześniej odkrytych neandertalczyków, charakteryzujących się masywniejszą budową ciała."
 andersson.24.t: "Człowiek z Boskop"
 andersson.24.d: "Odkrycie czaszki wywołało poruszenie wśród robotników rolnych. Powiadomiono najbliższą placówkę naukową."
 andersson.24.f: "Człowiek z Boskop to określenie skamieniałego fragmentu sklepienia czaszki hominina, odkrytego w 1913 roku przez robotników rolnych w regionie Transwalu w Południowej Afryce, wyróżniającego się niezwykle dużą szacowaną pojemnością mózgoczaszki. Na początku XX wieku niektórzy antropolodzy błędnie zaklasyfikowali okaz jako odrębny gatunek, Homo capensis, wysuwając teorię, że przed pojawieniem się współczesnych populacji region ten zamieszkiwała rasa ludzi o wyjątkowo dużych mózgach. Późniejsze badania paleoantropologiczne i dokładniejsze metody datowania obaliły jednak te twierdzenia, wykazując, że szczątki należały do człowieka współczesnego (Homo sapiens), związanego z linią przodków rdzennej ludności Khoisan."
 andersson.25.t: "Człowiek z Shandingdong"
 andersson.25.d: "W jednej z jaskiń ponad stanowiskiem Zhoukoudian odnaleziono dziś ludzkie szczątki kopalne, wskazujące na wczesne osadnictwo w północnych Chinach."
 andersson.25.f: "Człowiek z Shandingdong to określenie grupy wczesnych przedstawicieli człowieka współczesnego (Homo sapiens), których szczątki odkryto w latach 1933–1934 w Górnej Jaskini na stanowisku Zhoukoudian niedaleko Pekinu w Chinach. Wykopaliska prowadzono pod kierownictwem Pei Wenzhonga, a znalezione skamieliny zostały później zbadane przez Franza Weidenreicha. Ich wiek szacuje się na około 10 000–30 000 lat. Historycznie Człowiek z Shandingdong był uznawany za azjatycki odpowiednik europejskiego kromaniończyka. Szczątki, obejmujące trzy kompletne czaszki i różne fragmenty kości, odnaleziono wraz z zaawansowanymi narzędziami, kościanymi igłami i ozdobami wykonanymi z przewierconych zębów, co świadczy o rozwiniętej kulturze. Zgodnie z pierwotną hipotezą Weidenreicha osobnicy ci mieli być „protomongoloidalnymi” przodkami współczesnych mieszkańców Azji. Współczesna paleoantropologia uznaje ich jednak za przedstawicieli szerszej i zróżnicowanej fali migracji wczesnych ludzi przez Azję Wschodnią, zanim w pełni ukształtowały się regionalne cechy anatomiczne."
 andersson.26.t: "Człowiek z Talgai"
 andersson.26.d: "W pobliżu stacji Talgai odkryto kość, która rzuca zupełnie nowe światło na najwcześniejsze osadnictwo w Australii."
 andersson.26.f: "Człowiek z Talgai to określenie prehistorycznej ludzkiej czaszki, odkrytej w 1884 roku przez robotnika stawiającego ogrodzenie na terenie stacji hodowlanej Talgai w pobliżu Allory w australijskim stanie Queensland. Znalezisko to stanowi jeden z najwcześniej odkrytych dowodów obecności człowieka w Australii. Ze względu na masywną budowę i silną mineralizację czaszkę początkowo błędnie przypisywano znacznie starszemu gatunkowi hominina, jednak późniejsze datowanie radiowęglowe węglanów zawartych w glebie pozwoliło określić jej wiek na około 13 500 lat. Odkrycie miało ogromne znaczenie historyczne, ponieważ potwierdziło, że przodkowie rdzennych Australijczyków żyli obok wymarłej megafauny, dostarczając kluczowych informacji pozwalających lepiej zrozumieć pradzieje rdzennych ludów tego kontynentu."
 andersson.31.t: "Neandertalczyk"
 andersson.31.d: "Badacz z Uniwersytetu w Bonn wraz z kolegą naukowcem ogłosił dziś odkrycie wymarłego gatunku wczesnego człowieka."
 andersson.31.f: "W połowie sierpnia 1856 roku włoscy robotnicy kamieniołomu odkryli fragmenty kości w części doliny Neandertal, która niedawno została zniszczona wskutek wydobycia wapienia. Początkowo niedbale odrzucono je na hałdę gruzu, jednak znaleziskiem zainteresowali się właściciele kamieniołomu, Wilhelm Beckershoff i Friedrich Wilhelm Pieper, którzy polecili wydobyć 16 większych fragmentów kości i przekazali je Johannowi Carlowi Fuhlrottowi do zbadania. Odkryciem zainteresował się również anatom z Bonn, Hermann Schaaffhausen, który dowiedział się o nim z doniesień prasowych. Po zbadaniu kości doszedł do tego samego wniosku co wcześniej Fuhlrott: szczątki należały do pradawnej formy człowieka współczesnego. W czerwcu 1857 roku Fuhlrott i Schaaffhausen zaprezentowali znalezisko podczas walnego zgromadzenia Towarzystwa Przyrodniczego Pruskiej Nadrenii. Ich interpretacja nie spotkała się jednak z uznaniem zgromadzonych specjalistów. Znalezisko, nazwane Neandertal 1, stanowi okaz typowy gatunku Homo neanderthal."
 andersson.32.t: "Człowiek z Gibraltaru"
 andersson.32.d: "Kapitan Edmund Flint dokonał niemal niewiarygodnego odkrycia w pobliżu Gibraltaru."
 andersson.32.f: "Człowiek z Gibraltaru (a dokładniej Gibraltar 1) to określenie wyjątkowo dobrze zachowanej czaszki dorosłej kobiety, odkrytej w 1848 roku przez kapitana Edmunda Flinta w kamieniołomie Forbes' Quarry. Była to pierwsza skamieniałość neandertalczyka odkryta przez współczesną naukę. Chociaż okaz odnaleziono osiem lat przed słynnym odkryciem w niemieckiej dolinie Neandertal, jego znaczenie jako szczątków odrębnego gatunku człowieka, spokrewnionego z człowiekiem współczesnym, zostało w pełni rozpoznane dopiero w latach 60. XIX wieku, kiedy nazwa „neandertalczyk” była już powszechnie przyjęta. Późniejsze wykopaliska na tym stanowisku oraz w pobliskiej Jaskini Gorhama wykazały, że Gibraltar stanowił jedno z ostatnich znanych schronień neandertalczyków. Niektóre dowody sugerują, że przetrwali tam aż do około 28 000–32 000 lat temu."
 andersson.33.t: "Człowiek ze Spy"
 andersson.33.d: "W pobliżu Spy naukowcy dokonali cennego odkrycia antropologicznego, które rzuca nowe światło na pradzieje Belgii w stopniu niespotykanym dotąd."
 andersson.33.f: "Człowiek ze Spy to określenie dwóch niemal kompletnych szkieletów neandertalczyków, odkrytych w 1886 roku przez archeologa Marcela de Puydta i geologa Maximina Lohesta w jaskini Betche aux Rotches niedaleko Spy w Belgii. Odkrycie to stanowiło przełomowy moment w rozwoju paleoantropologii, ponieważ szczątki odnaleziono w bezpośrednim związku z mustierskimi narzędziami kamiennymi oraz szczątkami wymarłych ssaków epoki lodowcowej. Ostatecznie dowiodło to, że neandertalczycy byli pradawnymi, prehistorycznymi ludźmi, a nie współczesnymi ludźmi dotkniętymi zmianami chorobowymi. Skamieniałości ze Spy, charakteryzujące się masywną budową szkieletu i wydatnymi wałami nadoczodołowymi, pozostają jednymi z najważniejszych znalezisk pozwalających zrozumieć anatomię i zachowanie późnych neandertalczyków europejskich. Ich wiek szacuje się na około 36 000–40 000 lat."
 andersson.34.t: "Człowiek z Krapiny"
 andersson.34.d: "W pobliżu Krapiny badacze odkryli rozległe stanowisko ze szczątkami kostnymi prehistorycznych ludzi, które wywracają dotychczasową wiedzę o pradziejach całych Bałkanów do góry nogami."
 andersson.34.f: "Człowiek z Krapiny to określenie ogromnego zbioru około 800 fragmentów skamielin neandertalczyków, odkrytych w latach 1899–1905 przez paleontologa Dragutina Gorjanovicia-Krambergera w schronisku skalnym na wzgórzu Hušnjakovo w Chorwacji. Odkrycie to było przełomowe jak na swoje czasy, ponieważ Gorjanović-Kramberger wykorzystał analizę stratygraficzną i jako jeden z pierwszych zastosował promieniowanie rentgenowskie, aby udowodnić pradawny wiek skamielin oraz wykazać, że neandertalczycy stanowili integralną część historii ewolucji człowieka. Stanowisko, datowane na około 120 000–130 000 lat temu, pozostaje największym i jednym z najważniejszych miejsc odkrycia szczątków neandertalczyków na świecie, dostarczając obszernych informacji o ich zróżnicowaniu anatomicznym, stanie zdrowia i możliwych zachowaniach rytualnych."
 andersson.35.t: "Człowiek z Galilei"
 andersson.35.d: "Wydaje się, że potwierdzono, iż Ziemia Święta jest rzeczywiście jedną z najstarszych kolebek ludzkości. To sensacyjne odkrycie zyskało właśnie rozgłos w międzynarodowym środowisku naukowym."
 andersson.35.f: "Człowiek z Galilei to określenie fragmentu czaszki, a dokładniej kości czołowej znanej jako „czaszka z Zuttiyeh”, odkrytej w 1925 roku przez Francisa Turville-Petre'a w jaskini Mugharet el-Zuttiyeh na terenie dzisiejszego Izraela. Była to pierwsza skamieniałość hominina odkryta w Azji Zachodniej. Ze względu na wyjątkowe cechy przejściowe znalezisko początkowo wywołało dyskusję, czy szczątki należały do neandertalczyka, czy też wczesnego przedstawiciela człowieka współczesnego. Według współczesnych ustaleń paleoantropologicznych okaz, którego wiek szacuje się na około 200 000–350 000 lat, często zalicza się do późnych przedstawicieli Homo heidelbergensis lub populacji będącej wspólnym przodkiem neandertalczyków i Homo sapiens."
 andersson.41.t: "Człowiek z Heidelbergu"
 andersson.41.d: "W pobliżu Heidelbergu badacze sądzą, że odnaleźli „najstarszego Niemca” w historii."
 andersson.41.f: "Człowiek z Heidelbergu to określenie gatunku Homo heidelbergensis, opisanego na podstawie skamieniałej żuchwy odkrytej w 1907 roku przez Daniela Hartmanna w żwirowni niedaleko Mauer w Niemczech. Okaz ten, znany jako żuchwa Mauer 1, liczy około 600 000 lat i charakteryzuje się masywną, mocną budową oraz brakiem wyraźnego podbródka, choć jego zęby są uderzająco podobne do zębów współczesnego człowieka. Obecnie Człowiek z Heidelbergu jest powszechnie uznawany za kluczowego przodka człowieka z okresu środkowego plejstocenu, uważanego za wspólnego przodka zarówno neandertalczyków w Europie, jak i Homo sapiens w Afryce."
 andersson.42.t: "Człowiek z Rodezji"
 andersson.42.d: "Człowiek z Rodezji"
 andersson.42.f: "Człowiek z Rodezji to określenie niemal kompletnej skamieniałej czaszki, odkrytej w 1921 roku przez szwajcarskiego górnika Toma Zwiglaara w kopalni ołowiu i cynku Broken Hill w Rodezji Północnej (obecnie Kabwe w Zambii). Okaz ten, oficjalnie oznaczony jako Kabwe 1, był pierwszym tak znaczącym znaleziskiem kopalnych szczątków człowieka w Afryce. Wyróżnia się połączeniem pierwotnych cech anatomicznych, takich jak masywne wały nadoczodołowe, z mózgiem o rozmiarach zbliżonych do mózgu współczesnego człowieka. Najnowsze badania z wykorzystaniem precyzyjnych metod datowania wskazują, że czaszka liczy około 299 000 lat, co pozwala zaliczyć ją do gatunku Homo heidelbergensis (lub Homo rhodesiensis) i uznać jej właściciela za prawdopodobnego przedstawiciela późno żyjącej populacji współczesnej najwcześniejszym przedstawicielom Homo sapiens."
 andersson.43.t: "Człowiek z Heidelbergu"
 andersson.43.d: "Nowe odkrycie szczątków wczesnych ludzi w pobliżu Pekinu wzmacnia teorię, że ludzkość wywodzi się z Azji."
 andersson.43.f: "Skamieliny odkrywane od lat 20. XX wieku w pobliżu Zhoukoudian, około 40 km na południowy zachód od centrum Pekinu, określa się mianem „Człowieka Pekińskiego” i zalicza do rodzaju Homo. W 1927 roku Davidson Black, opierając się głównie na znalezisku pojedynczego zęba, nadał odkrytym skamielinom nazwę nowego rodzaju i gatunku Sinanthropus pekinensis Black & Zdansky. W 1940 roku Wilfrid Le Gros Clark, dysponując już kilkudziesięcioma skamielinami, uznał, że szczątki te są blisko spokrewnione z „Człowiekiem Jawajskim”, i podobnie jak jego przedstawicieli przyporządkował je do rodzaju i gatunku Pithecanthropus erectus, nazwanego przez Eugène'a Dubois w 1892 roku. Oryginalne skamieliny zaginęły podczas II wojny światowej."
 andersson.44.t: "Człowiek Jawajski"
 andersson.44.d: "W Holenderskich Indiach Wschodnich lekarz i anatom Eugène Dubois odkrył skamieniałe szczątki prehistorycznego przodka człowieka, wywołując zarówno entuzjazm, jak i kontrowersje w środowisku naukowym."
 andersson.44.f: "Skamieliny odkryte po raz pierwszy przez Eugène'a Dubois w 1891 roku nad brzegiem rzeki Solo, w pobliżu Trinil we wschodniej części Jawy, określa się mianem Człowieka Jawajskiego. Według obecnego stanu wiedzy ich wiek szacuje się na około milion lat. Były to pierwsze skamieliny homininów odkryte poza Europą, a po neandertalczykach także drugi dowód istnienia kopalnych krewnych człowieka anatomicznie współczesnego (Homo sapiens). Znaleziska z Jawy początkowo określano nazwą Anthropopithecus, a później Pithecanthropus erectus. Obecnie większość paleoantropologów zalicza je do gatunku Homo erectus, przy czym ich pochodzenie bywa dodatkowo podkreślane poprzez zastosowanie nazwy podgatunkowej Homo erectus javanensis, zgodnie z propozycją Franza Weidenreicha z 1940 roku. Ponad 50 lat po odkryciu Dubois Ralph von Koenigswald wspominał: „Żadne inne odkrycie paleontologiczne nie wywołało tak wielkiej sensacji ani nie doprowadziło do powstania tak wielu sprzecznych opinii naukowych”."
 andersson.51.t: "Dziecko z Taung"
 andersson.51.d: "Australijczyk Raymond Dart dokonał niezwykłego odkrycia w Taung: czaszka dziecka przypominającego małpę wskazuje, że poruszało się ono w pozycji wyprostowanej. Uzębienie i mózg również wykazują cechy zbliżone do ludzkich. Dziecko z Taung może być „brakującym ogniwem” między człowiekiem a innymi naczelnymi."
 andersson.51.f: "Dziecko z Taung to określenie skamieniałej czaszki młodego hominina, odkrytej w 1924 roku przez robotników kamieniołomu wapienia w Taung w Południowej Afryce, a następnie opisanej przez anatoma Raymonda Darta. Okaz ten stał się okazem typowym gatunku Australopithecus africanus i po raz pierwszy w nauce zastosowano określenie „małpolud” wobec dwunożnego przodka człowieka odkrytego w Afryce. Choć odkrycie początkowo spotkało się ze sceptycyzmem środowiska naukowego, przekonanego wówczas, że ludzkość wywodzi się z Azji lub Europy, ostatecznie skierowało uwagę paleoantropologów na Afrykę. Wiek szczątków dziecka oszacowano na około 2,8 miliona lat."
 andersson.101.t: "Odkryto Prehistoryczną Jaskinię"
 andersson.101.d: "Po długim okresie eksploracji [SCOPE.sCharacter('andersson_anthropologist_scope').GetFullName] odnalazł wejście do jaskini, w której [SCOPE.sCharacter('andersson_anthropologist_scope').GetSheHe] podejrzewa obecność kości prehistorycznych ludzi lub przodków człowieka."
 andersson.101.f: "Prehistoryczne jaskinie często kryją skamieliny przedstawicieli gatunków ludzkich lub przodków człowieka, a także inne znaleziska o charakterze antropologicznym lub archeologicznym. Zbadanie tych znalezisk wymaga zorganizowania ekspedycji kierowanej przez antropologa. Badania te mogą pomóc w wyjaśnieniu zagadki pochodzenia ludzkości."
 andersson.101.g: "Ta jaskinia powinna zostać zbadana jak najszybciej."
 andersson.201.t: "Poszukiwanie Homininów: Typ"
 andersson.201.d: "Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] wpadł na znakomity pomysł zorganizowania spektakularnych – a przynajmniej w miarę udanych – poszukiwań skamielin ludzkich na terytorium [GetPlayer.GetName]. Wszystkie dostępne możliwości zostały rozłożone na [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetHerHis] biurku."
 andersson.201.f: "„Szanowni Panowie, niniejszym zapraszam wszystkich na wspólną dyskusję na temat znanych i hipotetycznych typów homininów. Mam nadzieję, że wielu z Panów weźmie w niej udział. Wszystkie propozycje nazw zostaną umieszczone w bębnie do losowania, a następnie wybrane drogą losowania. Liczę na Waszą kreatywność!”\n\nPodpisano: [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetFullName]"
 andersson.201.g: "Nieważne."
 andersson.201.h: "Neoantrop"
 andersson.201.i: "Paleoantrop"
 andersson.201.j: "Pitekantrop"
 andersson.201.k: "Australopitek"
 andersson.211.t: "Poszukiwanie Homininów: Zakończone"
 andersson.211.d: "Antropologiczna grupa badawcza pomyślnie zakończyła swoją pracę i powraca teraz do [ROOT.GetCountry.GetCapital.GetCityHubName] z wynikami badań."
 andersson.211.f: "„Mam nadzieję, że wszyscy czegoś się nauczyliśmy, panowie! Pochodzenie ludzkości pozostaje zagadką, ale udało nam się przynajmniej rzucić na nią nieco światła. Dr. Jackson zdołał wyciągnąć wnioski na temat prehistorycznej higieny jamy ustnej na podstawie śladów zużycia zębów; Dr. Fittipaldi umieścił odkryte narzędzia w odpowiednim kontekście i rozpoznał subtelne różnice w dawnych technikach ich wytwarzania; a profesor Schabernack wreszcie wie, dlaczego nie powinien ciągle siadać na stalagmitach!”\n\nZ wyrazami szacunku: [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetFullName]"
 andersson.211.g: "Osiągnięcie Antropologiczne."
 andersson.212.t: "Cuda w Jaskini"
 andersson.212.d: "Nasz antropolog odkrył jaskinię w [SCOPE.sState('andersson_cave_state_scope').GetName], której malowidła są tak niezwykłe, że wielu badaczy w kraju uważa je za fałszerstwo – ludzie na tak prymitywnym etapie rozwoju po prostu nie mogli stworzyć czegoś podobnego!"
 andersson.212.f: "„Kontynuując badania pierwszej galerii, dokładnie w miejscu, gdzie kończą się osady zawierające kości i muszle, obserwator ze zdumieniem odkryje na sklepieniu jaskini liczne malowidła przedstawiające zwierzęta. Malowidła te, znacznych rozmiarów, wydają się wykonane czarną i czerwoną ochrą. Większość z nich przedstawia zwierzęta, które ze względu na charakterystyczne garby przypominają bizony. Dwa z nich ukazano w całości, z profilu, podczas gdy inne pozbawione są głów, a niektóre przedstawiono w niezrozumiałych pozach. Możemy również dostrzec całą łanię, namalowaną z wielkim kunsztem, oraz głowę, która wydaje się należeć do konia”. – MARCELINO SANZ DE SAUTUOLA"
 andersson.212.g: "Kaplica Sykstyńska Epoki Kamienia!"
 andersson.221.t: "Człowiek z [SCOPE.sState('andersson_cave_state_scope').GetMineHubName]"
 andersson.221.d: "Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] dokonał sensacyjnego odkrycia! Skamieniałości wczesnego człowieka wskazują na osadnictwo sprzed dziesiątek tysięcy lat. Muszą to być szczątki zupełnie nieznanego przedstawiciela Neoantropów."
 andersson.221.f: "Neoantrop to historyczny termin taksonomiczny stosowany w antropologii XIX i początku XX wieku do klasyfikowania ludzi anatomicznie współczesnych jako odrębnych od bardziej „prymitywnych” kopalnych homininów. W ramach dominujących wówczas linearnych modeli ewolucji termin ten służył do wyznaczenia ostatniego etapu rozwoju człowieka i często wykorzystywano go do przeciwstawiania współczesnych populacji nowo odkrytym liniom paleoantropów. Klasyfikacja ta obejmowała przede wszystkim gatunek Homo sapiens, ze szczególnym uwzględnieniem znalezisk z późnego plejstocenu, takich jak Człowiek z Cro-Magnon, którego uznawano za bezpośredniego przodka współczesnych Europejczyków. W kontekście XIX-wiecznej myśli naukowej koncepcja Neoantropa odegrała kluczową rolę w wyznaczeniu chronologicznej granicy między „przedpotopowymi” wymarłymi gatunkami, takimi jak neandertalczycy, a pojawieniem się współczesnych cech anatomicznych człowieka."
 andersson.221.g: "Człowiek z [SCOPE.sState('andersson_cave_state_scope').GetMineHubName]? Podoba mi się."
 andersson.222.t: "Człowiek z [SCOPE.sState('andersson_cave_state_scope').GetFarmHubName]"
 andersson.222.d: "Najnowsze badania Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] przyniosły sensacyjne wyniki: najwyraźniej jaskinię zamieszkiwał nieznany dotąd gatunek Paleoantropa."
 andersson.222.f: "Paleoantrop to przestarzałe określenie antropologiczne stosowane w XIX i na początku XX wieku do klasyfikowania homininów ze środkowego i późnego plejstocenu, które wykazywały bardziej „archaiczne” lub „prymitywne” cechy niż ludzie współcześni. W hierarchicznych modelach rozwoju człowieka charakterystycznych dla nauki epoki wiktoriańskiej kategoria ta reprezentowała kluczowy, pośredni etap ewolucji, wypełniający lukę między najdawniejszymi, małpopodobnymi przodkami a późniejszym pojawieniem się Neoantropów. Termin ten najczęściej odnoszono do neandertalczyków. Dla XIX-wiecznych badaczy definicja Paleoantropa miała zasadnicze znaczenie w sporze o to, czy te wymarłe formy były bezpośrednimi przodkami człowieka współczesnego, czy też stanowiły ślepą gałąź ewolucji, wypartą przez bardziej rozwinięte linie ewolucyjne."
 andersson.222.g: "Człowiek z [SCOPE.sState('andersson_cave_state_scope').GetFarmHubName] – brzmi dobrze!"
 andersson.223.t: "Człowiek z [SCOPE.sState('andersson_cave_state_scope').GetCityHubName]"
 andersson.223.d: "Kości, które Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] odnalazł podczas [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetHerHis] ostatnich wykopalisk, mogą liczyć setki tysięcy lat. Jeśli to prawda, należą do Pitekantropa, jakiego nigdy wcześniej nie spotkaliśmy."
 andersson.223.f: "Pitekantrop to przełomowe określenie taksonomiczne, oznaczające dosłownie „małpoluda”, wprowadzone przez Ernsta Haeckla, a następnie zastosowane przez Eugène'a Dubois do opisu odkrytego przez niego w 1891 roku Człowieka Jawajskiego (Pithecanthropus erectus). W XIX-wiecznej antropologii termin ten oznaczał hipotetyczne „brakujące ogniwo” między naczelnymi innymi niż człowiek a bardziej rozwiniętymi liniami Paleoantropów i Neoantropów. Klasyfikacja ta opierała się początkowo na skamieniałych szczątkach odkrytych w Indonezji, charakteryzujących się niskim sklepieniem czaszki i masywnymi wałami nadoczodołowymi, które uznawano za dowód istnienia przejściowego etapu ewolucji. Chociaż współczesna taksonomia zalicza te okazy do gatunku Homo erectus, koncepcja Pitekantropa miała ogromne znaczenie historyczne, ponieważ dostarczyła pierwszych materialnych dowodów na to, że ewolucja człowieka zachodziła również poza Europą i obejmowała znacznie dłuższy okres, niż wcześniej przypuszczano."
 andersson.223.g: "[SCOPE.sState('andersson_cave_state_scope').GetCityHubName] ... dobrze."
 andersson.224.t: "Australopitek"
 andersson.224.d: "Najnowsze odkrycie Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] wprawia [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetHerHim] w osłupienie. Skamieniałości, które [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetSheHe] odkrył podczas [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetHerHis] ostatniej ekspedycji, muszą liczyć co najmniej milion lat, jeśli nie więcej. Ten Australopitek – czy jest bardziej małpą, czy człowiekiem?"
 andersson.224.f: "Australopitek to przedstawiciel wymarłego rodzaju homininów, który zyskał znaczenie naukowe po odkryciu „Dziecka z Taung” w 1924 roku, stając się ważnym ogniwem łączącym małpy człekokształtne z miocenu z rodzajem Homo. Choć termin ten został wprowadzony na początku XX wieku przez Raymonda Darta, odkrycie spełniło przewidywania XIX-wiecznych teorii ewolucyjnych, ujawniając istotę, która łączyła dwunożny sposób poruszania się ze stosunkowo niewielkim mózgiem, rozmiarami zbliżonym do mózgu małp człekokształtnych. W paleoantropologii rozpoznanie Australopiteków doprowadziło do przeniesienia domniemanej „kolebki ludzkości” do Afryki, zasadniczo zmieniając kierunek poszukiwań początków człowieka, które wcześniej koncentrowały się przede wszystkim na Europie i Azji."
 andersson.224.g: "Tęsknię za starymi, dobrymi czasami, kiedy wystarczyło połączyć nazwę przypadkowej wioski ze słowem „człowiek”."
 andersson.231.t: "Ślepy zaułek?"
 andersson.231.d: "Podczas eksploracji stanowiska antropologicznego w [SCOPE.sState('andersson_cave_site').GetName] zespół musiał również zmierzyć się z trudnymi do pokonania ścieżkami i wąskimi korytarzami jaskiniowymi. Jak się okazało, wejście do jaskini znajdowało się w zupełnie innym miejscu, niż przypuszczał Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName]."
 andersson.231.f: "Jak się okazuje, wejście do jaskini nie znajduje się na skalnym występie, lecz niemal 1000 metrów niżej. Aby dotrzeć do niego ze stanowiska antropologicznego, zespół musi wybrać między długą drogą okrężną a bardzo niebezpieczną trasą."
 andersson.231.g: "Zespół będzie musiał wybrać drogę okrężną, czy tego chce, czy nie."
 andersson.231.h: "Doktor powinien zaryzykować i wybrać drogę na skróty!"
 andersson.232.t: "Malowidła Jaskiniowe"
 andersson.232.d: "Jaskinia w [SCOPE.sState('andersson_cave_site').GetName] zawiera ryty i malowidła liczące tysiące lat. Ich znaczenie i pochodzenie pozostają jednak tajemnicą."
 andersson.232.f: "W początkowym okresie rozwoju archeologii prehistorycznej i antropologii zakładano, opierając się na teorii ewolucji, że ludzie żyjący w dawnych czasach nie znali pojęć abstrakcyjnych. Wykluczano zatem możliwość, by potrafili tworzyć sztukę. Przekonanie to sprawiło, że odkrywane malowidła jaskiniowe – czego najsłynniejszym przykładem jest Altamira – uznawano za fałszerstwa. Dopiero gdy około 1900 roku zaczęto odkrywać coraz więcej malowideł jaskiniowych, zwłaszcza w południowo-zachodniej Francji, naukowcy doszli do wniosku, że muszą być one autentyczne."
 andersson.232.g: "Nasi przodkowie nie byli tak prymitywni, jak sądziliśmy."
 andersson.233.t: "Owocne Badania"
 andersson.233.d: "W ciągu ostatnich kilku miesięcy [SCOPE.sCharacter('andersson_anthropologist_scope').GetFullName] pogłębił swoje badania. Skatalogował już liczne znaleziska z jaskini w [SCOPE.sState('andersson_cave_site').GetName] oraz sporządził dokumentację systemu jaskiniowego dla przyszłych pokoleń."
 andersson.233.f: "Nawet przez znaczną część XIX wieku nie było jasne, od jak dawna istnieje ludzkość. Już na początku stulecia wielu naukowców porzuciło przekonanie, że historia człowieka liczy zaledwie kilka tysięcy lat. Kiedy jednak w latach 40. XIX wieku Boucher de Perthes wskazał znacznie starsze narzędzia kamienne jako dowód na to, że ludzie żyli w tym samym czasie co wymarłe gatunki ssaków, jego argumenty nie spotkały się z zainteresowaniem. Dopiero niestrudzone gromadzenie i badanie prehistorycznych szczątków miało wkrótce dopełnić obraz przeszłości, dowodząc, że ludzie zamieszkiwali Ziemię znacznie dłużej, niż wcześniej przypuszczano."
 andersson.233.g: "Przyniesie mu to korzyści."
 andersson.233.h: "Przyniesie to korzyści nauce."
 andersson.234.t: "Wypadek w Jaskini"
 andersson.234.d: "Podczas eksploracji jaskini w [SCOPE.sState('andersson_cave_site').GetName] doszło do wypadku. Jeden z asystentów upadł wraz z osłem jucznym. Na szczęście obrażenia były jedynie nieznaczne, jednak sprzęt wymaga wymiany."
 andersson.234.f: "„Zatrudnijcie wreszcie profesjonalistów!”"
 andersson.234.g: "O nie!"
 andersson.236.t: "Labirynt Jaskiniowy"
 andersson.236.d: "Jak donosi Dr. [SCOPE.sCharacter('andersson_anthropologist_scope').GetLastName], gromadzenie kości i prehistorycznych szczątków ulega opóźnieniu. Kilka znaczących odkryć odsuwa w czasie rozpoczęcie identyfikacji kości. Są to ważne, niezwykle ważne opóźnienia. W rzeczywistości jednak od tygodni nie było żadnej korespondencji między zespołem a instytutem. Może to oznaczać tylko jedno."
 andersson.236.f: "Całkowicie się zgubili."
 andersson.236.g: "Głupcy!"
 andersson.237.t: "Narzędzia z Epoki Kamienia"
 andersson.237.d: "[SCOPE.sCharacter('andersson_anthropologist_scope').GetFullName] odnalazł w jaskini prehistoryczne narzędzia kamienne, które mogą dostarczyć informacji o przeszłości."
 andersson.237.f: "W XIX wieku antropologię rozumiano jako naukę zajmującą się przede wszystkim pradziejami ludzkości. Oprócz znalezisk kostnych przedmiotem jej badań były również broń i narzędzia z tak zwanej epoki kamienia, którą wówczas postrzegano nie tyle jako okres wyodrębniony na podstawie naukowych kryteriów, ile jako czasy barbarzyństwa. W wyobrażeniach o tej epoce dominował stereotyp prymitywnego jaskiniowca, mający niewiele wspólnego z rzeczywistością historyczną. Niemniej jednak poszukiwanie coraz liczniejszych artefaktów i szczątków z tego okresu stwarzało możliwość stopniowego weryfikowania tego obrazu w kolejnych latach i stworzenia podstaw prawdziwej archeologii prehistorycznej."
 andersson.237.g: "Zbadaj narzędzia."
 andersson.237.h: "Ich miejsce jest w muzeum!"
 andersson.238.t: "Kości Człowieka"
 andersson.238.d: "Nasz antropolog odnalazł kolejne kości podczas eksploracji jaskini."
 andersson.238.f: "Powszechnie uważa się, że w XIX i na początku XX wieku odkryto zaledwie nieliczne skamieliny ludzkie. Jest to jednak tylko częściowo prawdą. Często zdarzało się bowiem, że szczątków kostnych wczesnych ludzi nie rozpoznawano jako takich. Choć nazwa „neandertalczyk” pochodzi od miejsca odkrycia w dolinie Neandertal, kości neandertalczyków znajdowano już wielokrotnie wcześniej. Nawet po odkryciu w Neandertalu wybitni naukowcy, tacy jak Rudolf Virchow, kwestionowali autentyczność i wiek znaleziska. Problemem nie była zatem liczba odkryć, lecz potwierdzenie, że odnalezione szczątki rzeczywiście należały do ludzi żyjących w odległej przeszłości."
 andersson.238.g: "Mniam."
 andersson.239.t: "Asystent Odkrywa Skamieniałości"
 andersson.239.d: "Asystent będący studentem odegrał kluczową rolę w zabezpieczeniu znaleziska antropologicznego w jaskini w [SCOPE.sState('andersson_cave_site').GetName]. Jednak [SCOPE.sCharacter('andersson_anthropologist_scope').GetFullName] podkreśla, że jako kierownik badań to on ponosi odpowiedzialność za odkrycie."
 andersson.239.f: "„Pamiętasz historię sprytnego młodego Ateńczyka, który za wszelką cenę pragnął zdobyć rozgłos? Udał się do wyroczni i zapytał: 'Co mam zrobić, żeby zostać wielkim człowiekiem?' Wyrocznia odpowiedziała: 'Zabij jednego!'” – Richard Owen."
 andersson.239.g: "Odkrycia tego dokonał młody antropolog."
 andersson.239.h: "Odkrycia tego dokonał nasz starszy antropolog."
 andersson.240.t: "Zaginiony Kosz"
 andersson.240.d: "Nieco żenujący incydent opóźnił rozpoczęcie identyfikacji kości."
 andersson.240.f: "Kiedy zespół badawczy zakończył gromadzenie znalezisk i przystąpił do eksploracji innej części stanowiska antropologicznego, kierownik badań, Dr. [SCOPE.sCharacter('andersson_anthropologist_scope').GetLastName], zorientował się, niestety nieco za późno, że zgubiono zebrane kości i artefakty. Najwyraźniej gdzieś zapodział się kosz ekspedycyjny zawierający wszystkie dotychczas odnalezione znaleziska antropologiczne. I to już kilka tygodni temu."
 andersson.240.g: "Każda kość jest cenna."
 andersson.240.h: "Pospieszcie się!"
 andersson_conference_anthropologist_double_vote_tt: "Dzięki naszemu doświadczonemu antropologowi mamy #G dwukrotnie większą#! siłę głosu."
 andersson_conference_anthropologist_triple_vote_tt: "Dzięki naszemu sławnemu antropologowi mamy #G trzykrotnie większą#! siłę głosu."
