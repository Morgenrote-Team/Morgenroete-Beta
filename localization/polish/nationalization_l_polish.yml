l_polish:
 je_nationalization_germanization: "Germanizacja"
 je_nationalization_germanization_goal: "#O Postęp tożsamości narodowej#! osiąga #G 250#!."
 je_nationalization_german_national_identity: "Niemiecka tożsamość"
 je_nationalization_german_national_identity_reason: "Po kilku latach wspólnego rozwoju i przeprowadzeniu kilku reform poczucie przynależności do ogólnoniemieckiej tożsamości coraz szerzej rozpowszechnia się wśród ludności. Poczucie to będzie rozprzestrzeniać się z regionu na region, niezależnie od tego, w jaki sposób państwo stworzy odpowiednie warunki: regiony dobrze obsługiwane przez administrację rządową, uniwersytety, koszary lub bazy morskie mają większe szanse na rozwinięcie ogólnoniemieckiej tożsamości dzięki ich funkcji integracyjnej. Silnie zurbanizowane obszary łatwiej przyswajają koncepcję, która wcześniej była przedmiotem zainteresowania głównie intelektualistów. W idealnych warunkach jeden kraj związkowy może przyjąć nową tożsamość każdego roku."
 nationalization.101.t: "Niemiecka świadomość w [SCOPE.sState('united_german_culture_state').GetName]"
 nationalization.101.d: "Po latach wpływów społecznych i politycznych ludność [SCOPE.sState('united_german_culture_state').GetName] rozwinęła poczucie przynależności do całego narodu niemieckiego. Teraz w pełni utożsamia się z ogólnoniemiecką tożsamością."
 nationalization.101.f: "„Być Niemcem znaczy robić coś dla samej idei.” — Richard Wagner"
 nationalization.101.g: "Jedność, sprawiedliwość i wolność!"
 nationalization.102.t: "Poczucie wspólnoty germańskiej"
 nationalization.102.d: "Teraz, gdy cała ludność Niemiec nie postrzega już siebie przede wszystkim przez pryzmat tożsamości regionalnej, lecz narodowej, ma to wpływ nie tylko na Niemców w kraju, ale także na tych żyjących na całym świecie."
 nationalization.102.f: "Wraz z utworzeniem niemieckiego państwa narodowego i utrwaleniem ogólnoniemieckiej tożsamości również Niemcy żyjący poza jego granicami — czy to jako emigranci rozsiani po świecie, czy też jako ludność od dawna zamieszkująca pod obcym panowaniem — będą identyfikować się przede wszystkim jako Niemcy."
 nationalization.102.g: "Wszędzie tam, gdzie rozbrzmiewa niemiecka mowa!"
 nationalization.103.d: "Wraz z utworzeniem niemieckiego państwa narodowego i utrwaleniem ogólnoniemieckiej tożsamości również Niemcy żyjący poza jego granicami — czy to jako emigranci rozsiani po świecie, czy też jako ludność od dawna zamieszkująca pod obcym panowaniem — będą identyfikować się przede wszystkim jako Niemcy. Także w naszym kraju narasta potrzeba utożsamiania się z niemieckością, zamiast — jak dotychczas — określania siebie przede wszystkim przez regionalne pochodzenie."
 nationalization.103.g: "Ale czy ten wynalazek może być niebezpieczny dla ludzkości?"
 united_german: "Niemiecki"
 nationalization_pan_german_identity_tt: "Na całym świecie ludność północnoniemiecka i południowoniemiecka będzie odtąd identyfikować się jako ludność ogólnoniemiecka. Ojczyzny północnoniemieckie i południowoniemieckie będą odtąd po prostu ojczyznami niemieckimi."
 nationalization_german_consiousness_tt: "Lokalna ludność północnoniemiecka i południowoniemiecka stanie się ludnością niemiecką. Ojczyzny północnoniemieckie i południowoniemieckie zostaną przekształcone w ojczyzny niemieckie."
 nationalization_german_consiousness_capital_tt: "Lokalna ludność północnoniemiecka i południowoniemiecka w naszym stołecznym regionie stanie się jedną ludnością niemiecką. Region ten zostanie przekształcony w niemiecką ojczyznę. Nasza główna kultura zmieni się na niemiecką i będziemy mogli zgermanizować cały kraj."
 je_nationalization_german_national_identity_tt: "Wszystkie ojczyzny północnoniemieckie, południowoniemieckie i alemańskie zostały przekształcone w ojczyzny niemieckie."
 nationalization.104.t: "Integracja Północnych Niemiec"
 nationalization.104.d: "Kultura północnoniemiecka jest teraz w pełni zintegrowana z kulturą niemiecką."
 nationalization.105.t: "Kultura południowoniemiecka zintegrowana"
 nationalization.105.d: "Kultura południowoniemiecka jest teraz w pełni zintegrowana z kulturą niemiecką."
 nationalization.106.t: "Kultura alemańska zintegrowana"
 nationalization.106.d: "Kultura alemańska jest teraz w pełni zintegrowana z kulturą niemiecką."
 nationalization.104.f: "„Nie obawiam się, że Niemcy nie staną się jednością; nasze dobre drogi i przyszłe koleje zrobią swoje. Przede wszystkim niech łączy ich wzajemna miłość i niech zawsze występują wspólnie przeciwko obcemu wrogowi; niech niemiecki talar i grosz mają tę samą wartość w całym państwie; niech moja walizka będzie mogła przejechać przez wszystkie trzydzieści sześć państw bez otwierania.” — Johann Wolfgang von Goethe"
 nationalization.104.g: "Witajcie, bracia!"
 nationalization.111.t: "[SCOPE.sCharacter('german_character_scope').GetLastName] popiera sprawę niemiecką"
 nationalization.111.d: "W obliczu narastających wezwań do przyjęcia ogólnoniemieckiej tożsamości [SCOPE.sCharacter('german_character_scope').GetFullName] w pełni utożsamił się z ideałami zjednoczonego niemieckiego państwa narodowego. Swoje własne pochodzenie uważa za sprawę drugorzędną i podkreśla swoją niemiecką tożsamość narodową."
 nationalization.111.f: "„Nie znam już żadnych stronnictw, znam tylko Niemców!” — Wilhelm II"
 nationalization.111.g: "Czasy Kleinstaaterei dobiegły końca."
 nationalization.112.t: "Kultura niemiecka"
 nationalization.112.d: "Niemcy są znane jako kraj poetów i myślicieli. Jeszcze przed zjednoczeniem politycznym to kultura kształtowała naród. Niemiecka literatura i muzyka są słynne na całym świecie — i mogą stanowić spoiwo tożsamości narodowej."
 nationalization.112.f: "„Człowiek, a Niemiec w szczególności, tworzy własny świat i uczy się znosić to, czego nie da się ukształtować.” — Friedrich Schiller"
 nationalization.112.g: "Niemcy posiadają bogatą historię muzyczną"
 nationalization.112.h: "Niemcy mają bogatą historię literacką."
 nationalization.112.i: "Przyszłość należy do kultury niemieckiej!"
 nationalization.113.t: "Niemieckie pomniki"
 nationalization.113.d: "Liczne kluby i stowarzyszenia, a także patrioci i nacjonaliści angażują się w budowę wielu pomników sławiących niemieckich bohaterów i celebrujących nową jedność kraju. W Niederwald nad Renem ma powstać ogromny posąg Germanii."
 nationalization.113.f: "Po zjednoczeniu Niemiec rozpoczął się intensywny okres budowy, który znalazł odzwierciedlenie w niezwykłym rozkwicie kultury pomnikowej. Obok pomnika Barbarossy na Kyffhäuserbergu, Deutsches Eck w Koblencji, Hermannsdenkmal w pobliżu Detmold w południowej części Lasu Teutoburskiego, pomnika cesarza Wilhelma przy Porta Westfalica, Völkerschlachtdenkmal w Lipsku, pomnika Bismarcka w Hamburgu oraz Walhalli w pobliżu Donaustauf, pomnik Niederwald należy do monumentalnych budowli upamiętniających w Niemczech, wznoszonych głównie w czasach Cesarstwa Niemieckiego. Budowa trwała 12 lat."
 nationalization.113.g: "Wspieraj kulturę pomnikową i zbuduj Niederwalddenkmal."
 nationalization.113.h: "Nie."
 je_nationalization_frenchization: "Francuzacja "
 je_nationalization_frenchization_reason: "Od 1881 roku dzieci mówiące w szkole po oksytańsku były karane zgodnie z zaleceniami ministra Jules’a Ferry’ego; doprowadziło to do poniżenia tego języka, znanego jako la vergonha („wstyd”). Dotyczyło to również innych części Francji, które od czasów rewolucji francuskiej zmagały się z polityką centralizacyjną. Od końca XIX wieku państwo francuskie nasiliło działania mające na celu dalsze ograniczanie różnic regionalnych na rzecz jednolitej tożsamości."
 nationalization_frenchization_tt: "Lokalna ludność oksytańska, franko-prowansalska, bretońska i walońska stanie się ludnością francuską. Ich ojczyzny zostaną przekształcone w ojczyzny francuskie."
 je_nationalization_french_national_identity_tt: "Wszystkie ojczyzny oksytańskie, franko-prowansalskie, bretońskie i walońskie zostały przekształcone w ojczyzny francuskie."
 nationalization_pan_french_identity_tt: "Na całym świecie ludność oksytańska, franko-prowansalska, bretońska i walońska będzie odtąd identyfikować się jako ludność francuska."
 nationalization.201.t: "Francuzacja w [SCOPE.sState('frenchization_state').GetName]"
 nationalization.201.d: "Po latach wpływów politycznych i intensywnej edukacji ludność [SCOPE.sState('frenchization_state').GetName] stała się nieodróżnialna od pozostałych obywateli Francji. Jej styl życia i kultura odpowiadają tym z Paryża."
 nationalization.201.f: "„Paryżanin jest dla Francuzów tym, czym Ateńczyk był dla Greków: nikt nie śpi lepiej od niego, nikt nie jest bardziej otwarcie lekkomyślny i próżniaczy, nikt nie wydaje się bardziej beztroski. Ale to pozory. Bywa ospały i apatyczny, lecz gdy można zdobyć chwałę, potrafi ogarnąć go wszelka furia. Dajcie mu pikę, a odegra dziesiąty sierpnia; dajcie mu muszkiet, a otrzymacie Austerlitz. Był trampoliną Napoleona i podporą Dantona. Na okrzyk «la patrie» zaciąga się do wojska, a na wezwanie wolności wyrywa bruk z ulic. Strzeżcie się go!” — Victor Hugo"
 nationalization.201.g: "Bądź czysty, mów po francusku."
 nationalization.202.t: "Francuzacja zakończona"
 nationalization.202.d: "Lata wysiłków okazały się tego warte. Francja jest narodem o jednym języku, jednej kulturze i jednej centralnej stolicy. Czas różnic językowych i kulturowych dobiegł końca. Ukształtowanie Francuzów stanowi kamień milowy w naszej historii."
 nationalization.202.f: "Wraz z utrwaleniem francuskiej tożsamości także społeczność frankofońska żyjąca poza granicami kraju — czy to jako emigranci rozsiani po świecie, czy też jako ludność od dawna zamieszkująca pod obcym panowaniem — będzie identyfikować się przede wszystkim jako Francuzi."
 nationalization.202.g: "Nadszedł dzień chwały!"
 nationalization.204.t: "Kultura oksytańska zintegrowana"
 nationalization.204.d: "Po latach edukacji, propagandy i wypierania regionalnych niedorzeczności kultura oksytańska stała się niemal nieodróżnialna od kultury francuskiej."
 nationalization.205.t: "Kultura franko-prowansalska zintegrowana"
 nationalization.205.d: "Po latach edukacji, propagandy i wypierania regionalnych niedorzeczności kultura franko-prowansalska stała się niemal nieodróżnialna od kultury francuskiej."
 nationalization.206.t: "Kultura bretońska zintegrowana"
 nationalization.206.d: "Po latach edukacji, propagandy i wypierania regionalnych niedorzeczności kultura bretońska stała się niemal nieodróżnialna od kultury francuskiej."
 nationalization.207.t: "Kultura walońska zintegrowana"
 nationalization.207.d: "Po latach edukacji, propagandy i wypierania regionalnych niedorzeczności kultura walońska stała się niemal nieodróżnialna od kultury francuskiej."
 nationalization.204.f: "„Francja jest wielka, ponieważ jest Francją.” — Victor Hugo"
 nationalization.204.g: "Witajcie, bracia!"
 nationalization.301.t: "Szwajcarska świadomość w [SCOPE.sState('united_swiss_culture_state').GetName]"
 nationalization.301.d: "Po latach wpływów społecznych i politycznych ludność [SCOPE.sState('united_swiss_culture_state').GetName] rozwinęła poczucie przynależności do jednego szwajcarsko-niemieckiego narodu. Teraz w pełni utożsamia się ze szwajcarską tożsamością."
 nationalization.301.f: "„W razie końca świata wolałbym być w Szwajcarii.” — Albert Einstein"
 nationalization.301.g: "Jeden za wszystkich, wszyscy za jednego!"
 nationalization.302.t: "Szwajcaryzacja zakończona"
 nationalization.302.d: "Cała ludność Szwajcarii nie postrzega już siebie przede wszystkim przez pryzmat tożsamości regionalnej, lecz narodowej. Od tej pory żaden naród francuski, włoski ani niemiecki nie będzie mógł tak łatwo twierdzić, że jesteśmy jedynie mieszaniną różnych ludów."
 nationalization.302.f: "Chcemy być jednym ludem braci,\nNigdy nie rozdzielać się w niebezpieczeństwie ani niedoli.\nChcemy być wolni, jak byli nasi ojcowie,\nI raczej umrzeć, niż żyć w niewoli.\nChcemy ufać jedynemu najwyższemu Bogu\nI nigdy nie lękać się ludzkiej władzy."
 nationalization.302.g: "Jesteśmy narodem z własnej woli."
 nationalization.313.t: "Pomnik Wilhelma Tella"
 nationalization.313.d: "Wilhelm Tell jest uważany za jedną z mitycznych postaci założycielskich Szwajcarii i zajmuje w pamięci historycznej społeczeństwa miejsce porównywalne z przysięgą na Rütli. Wielu patriotów chce wznieść pomnik na jego cześć, aby inspirować nowo rozbudzoną świadomość narodową."
 nationalization.313.f: "Dobry człowiek myśli o sobie na końcu. — Friedrich Schiller"
 nationalization.313.g: "Musimy wychwalać naszą przeszłość."
 nationalization.313.h: "A kto ma za to zapłacić?"
 united_swiss: "Szwajcarski"
 nationalization_swiss_consiousness_capital_tt: "Lokalna ludność alemańska, franko-prowansalska, tessyńska i retoromańska w naszym stołecznym regionie stanie się jedną ludnością szwajcarską. Region ten zostanie przekształcony w szwajcarską ojczyznę. Nasza główna kultura zmieni się na szwajcarską i będziemy mogli zeszwajcaryzować cały kraj."
 nationalization_swiss_consiousness_tt: "Lokalna ludność alemańska, franko-prowansalska, tessyńska i retoromańska stanie się jedną ludnością szwajcarską. Ich ojczyzny zostaną przekształcone w ojczyzny szwajcarskie."
 je_nationalization_swiss_national_identity_tt: "Wszystkie ojczyzny alemańskie, franko-prowansalskie, tessyńskie i retoromańskie zostały przekształcone w ojczyzny szwajcarskie."
 nationalization_pan_swiss_identity_tt: "Cała pozostała ludność alemańska, franko-prowansalska, tessyńska i retoromańska stanie się jedną ludnością szwajcarską. Wszystkie postacie należące do tych kultur również staną się Szwajcarami."
 nationalization_disunited_italy_modifier: "Następstwa zjednoczenia Włoch"
 nationalization_disunited_germany_modifier: "Następstwa zjednoczenia Niemiec"
 nationalization_brigants_modifier: "Rozbójnictwo"
 nationalization_anti_regionalism_ig_modifier: "Antyregionalizm"
 nationalization_anti_regionalism_country_modifier: "Antyregionalizm"
 nationalization_linguistic_impurity_modifier: "Nieczystość językowa"
 nationalization_no_foscolo_modifier: "Foscolo odrzucony"
 je_nationalization_italianization: "Italianizacja"
 je_nationalization_italianization_reason: "Po zjednoczeniu Włoch Massimo d'Azeglio powiedział: „Stworzyliśmy Włochy, teraz musimy stworzyć Włochów”. Nawet jeśli autentyczność tego powiedzenia budzi wątpliwości, trafnie oddaje ono fakt, że po politycznym zjednoczeniu Włoch ich wewnętrzna jedność była daleka od stabilności. Dotyczyło to nie tylko południa, gdzie grasowali rozbójnicy — także na północy, poza elitą mieszczańską, większość ludzi nadal czuła silną więź ze swoją tożsamością regionalną. Wspólne wojny, wysoki prestiż oraz rozwój instytucji narodowych, takich jak uniwersytety, akademie sztuk pięknych czy placówki administracyjne, powinny sprawić, że w ciągu najbliższych lat z trudnego procesu jednoczenia narodu wyłoni się znacznie silniejsza tożsamość włoska."
 je_nationalization_italianization_goal: "#O Postęp tożsamości narodowej#! osiąga #G 250#!."
 je_nationalization_germanization_reason: "Po utworzeniu Cesarstwa Niemieckiego w 1871 roku poczucie jedności wśród Niemców było już bardzo rozpowszechnione w poszczególnych krajach związkowych. Pilna potrzeba zjednoczenia państw niemieckich istniała od 1848 roku. Jedynie w Bawarii silne poczucie odrębności regionalnej utrzymywało się jeszcze długo w XX wieku, choć stopniowo traciło na znaczeniu. Wspólne wojny, wysoki prestiż oraz rozwój instytucji narodowych, takich jak uniwersytety, akademie sztuk pięknych czy placówki administracyjne, powinny sprawić, że w ciągu najbliższych lat z trudnego procesu jednoczenia narodu wyłoni się znacznie silniejsza tożsamość niemiecka."
 nationalization.12.f: "Rozbójnictwo w południowych Włoszech istniało w pewnej formie już od czasów starożytnych. Jego charakter zmienił się jednak z czasem: od działalności banitów napadających na przypadkowych podróżnych po znacznie szerszy ruch oporu politycznego. Po podboju Królestwa Obojga Sycylii w 1861 roku przez sabaudzkie Królestwo Sardynii, późniejsze Królestwo Włoch, pojawiła się najbardziej znana forma rozbójnictwa w tym regionie. Wśród rozbójników znajdowali się ludzie o różnym pochodzeniu społecznym i różnych motywacjach: byli więźniowie, bandyci i inne osoby uznawane przez włoski rząd za pospolitych przestępców, ale także byli żołnierze i lojaliści armii Burbonów. Atakowali nie tylko włoskie władze i zamożnych właścicieli ziemskich, lecz także zwykłych ludzi, często plądrując wsie, miasta i gospodarstwa oraz dokonując zbrojnych napadów na pojedyncze osoby i grupy, w tym rolników, mieszkańców miast i rywalizujące bandy rozbójników."
 nationalization.12.g: "Kolejny bandyta udający Robin Hooda!"
 nationalization.13.t: "Obawa o dziedzictwo regionalne"
 nationalization.13.f: "Po upadku rewolucji lat 1848–1849 neogwelfowie, stanowiący czołowe skrzydło włoskiego ruchu zjednoczeniowego, de facto utracili znaczenie polityczne. Pierwotnie opowiadali się za federacyjnymi Włochami pod przewodnictwem papieża jako primus inter pares. W rezultacie absolutną przewagę zdobyły środowiska centralistyczne — zjawisko to utrzymywało się jeszcze długo w XX wieku. Regionalne odrębności przestały być brane pod uwagę, a wręcz przeciwnie — poczucie regionalnej tożsamości zaczęto postrzegać jako niebezpieczną tendencję, mogącą zagrozić wysiłkom na rzecz zjednoczenia Włoch."
 nationalization.13.h: "Powinniśmy uwzględnić to wyjątkowe dziedzictwo."
 nationalization.14.t: "Dialekty czy języki?"
 nationalization.14.d: "Czołowi nauczyciele, wykładowcy i profesorowie w naszym kraju opowiedzieli się za szczególnym wspieraniem upowszechniania języka włoskiego nie tylko w instytucjach publicznych, ale także w życiu codziennym. Powinno to znacznie usprawnić procesy naukowe i polityczne w nowych Włoszech — jednak wśród ogółu społeczeństwa, zwłaszcza ludności wiejskiej, jest to wyjątkowo niepopularny postulat, ponieważ ludzie ci nadal posługują się wyłącznie dialektami."
 nationalization.14.f: "Jeszcze w XVIII wieku nie było wątpliwości, że poszczególne odmiany językowe Półwyspu Apenińskiego stanowiły odrębne języki. Wielkim prestiżem cieszył się nie tylko język toskański za sprawą Dantego Alighieriego. Wenecki był językiem urzędowym i literackim Republiki Weneckiej; po wenecku pisano sztuki, między innymi Carla Goldoniego, a także dzieła literackie, a sam język nadal odgrywał szczególną rolę jako lingua franca w regionie Adriatyku. Podobnie można powiedzieć o języku neapolitańskim. W XIX wieku przeważył jednak pogląd, że istnieje tylko jeden standardowy język włoski, a wszystkie pozostałe języki Włoch są jedynie dialektami — mimo że włoszczyzna używana na północy miała już odrębny status językowy. Z czasem jednak, wraz z rozwojem ruchów politycznych, coraz wyraźniej ujawniała się rzeczywistość: język różni się od dialektu tym, że ten pierwszy ma marynarkę wojenną i armię."
 nationalization.14.g: "Nasza różnorodność językowa jest źródłem prestiżu."
 nationalization.14.h: "Mów po włosku, mów jasno. Reszta to tylko dialekty."
 nationalization.15.t: "Los Foscola"
 nationalization.15.d: "W miarę jak nastroje narodowe stają się coraz bardziej widoczne, pojawiają się głosy domagające się sprowadzenia ciała wielkiego włoskiego poety Ugo Foscola z Wielkiej Brytanii do Włoch."
 nationalization.15.f: "Nowy naród włoski poszukiwał punktów odniesienia: zarówno wydarzeń historycznych, jak i wybitnych postaci. Już wcześniej pojawiła się idea stworzenia miejsca spoczynku artystów, naukowców i innych wielkich osobistości na wzór Panteonu, podobnego do tego we Francji. Bazylika Santa Croce we Florencji, która wcześniej służyła jako miejsce pochówku znamienitych obywateli, wydawała się do tego odpowiednim miejscem. Postacie takie jak Machiavelli, Michał Anioł i Galileusz od dawna były bardziej włoskie niż toskańskie. Ugo Foscolo, poeta weneckiego pochodzenia z wyspy Zakintos, żył w czasach rewolucyjnych i jest uznawany za jedną z kluczowych postaci wczesnego włoskiego liberalizmu i nacjonalizmu. Byłby doskonałym uzupełnieniem tej galerii wielkich włoskich umysłów. Foscolo zmarł jednak na wygnaniu w 1827 roku — w Turnham Green pod Londynem."
 nationalization.15.g: "Poprośmy ich, by oddali nam Foscola."
 nationalization.15.h: "Byłoby nam wstyd, gdyby odmówili."
 nationalization.16.d: "Rząd włoski zwrócił się z prośbą o wydanie mu ciała słynnego poety i orędownika włoskiego nacjonalizmu, Ugo Foscola."
 nationalization.16.g: "Niech sobie zabiorą swojego marnego poetę. Jak on się właściwie nazywał?"
 nationalization.16.h: "Ten cały Foscolo zostaje tutaj."
 nationalization.17.t_foscolo: "Foscolo powraca"
 nationalization.17.d_foscolo: "Rząd brytyjski wyraził zgodę — ciało Foscola wkrótce powróci na włoską ziemię i znajdzie swoje ostateczne miejsce spoczynku w bazylice Santa Croce!"
 nationalization.17.f_foscolo: "Powrót Ugo Foscola do Włoch jest uznawany za jeden z pierwszych przełomowych momentów dla młodego państwa narodowego. Foscola witano niczym powracającego bohatera; jego pogrzeb przybrał formę uroczystego pochodu, podczas którego ludzie płakali i wiwatowali. Wraz z utworzeniem w Santa Croce „Panteonu” wielkich włoskich osobistości powstał trwały punkt odniesienia dla włoskiego nacjonalizmu. To włoscy bohaterowie, a nie katoliccy święci, mieli stać się głównymi postaciami tej ideologii."
 nationalization.17.g: "Wielki Włoch powraca do ojczyzny!"
 nationalization.17.t_no_foscolo: "Foscolo pozostaje na wygnaniu"
 nationalization.17.d_no_foscolo: "Niestety rząd brytyjski uniemożliwił powrót Ugo Foscola do Włoch, posługując się kilkoma obłudnymi wymówkami."
 nationalization.17.f_no_foscolo: "Naprawdę mieli czelność nazwać wielkiego włoskiego poetę „tym całym Fosco”!"
 nationalization.17.h: "Te syny kulawej krowy odmawiają nam naszego Foscola!"
 nationalization.18.t: "Włoska kultura muzyczna"
 nationalization.18.d: "Włochy są uważane za jeden z krajów, które odegrały decydującą rolę w rozwoju kultury muzycznej — zarówno w dziedzinie budowy instrumentów, rozwoju opery, kształcenia słynnych śpiewaków, jak i działalności wielkich kompozytorów. Pod względem muzycznym, najpóźniej od czasów renesansu, półwysep wyróżniał się wyjątkową kulturą, która zachwyciła całą Europę i nadawała jej nowe impulsy. O wielkości tego dziedzictwa świadczy fakt, że aż do XIX wieku włoski był jedynym językiem opery."
 nationalization.18.f: "„Dajcie mi rachunek praczki, a nawet to ubiorę w muzykę.” — Gioachino Rossini"
 nationalization.18.g: "Włochy mają bogatą historię muzyczną."
 nationalization.18.h: "Przyszłość należy do włoskiej kultury muzycznej!"
 nationalization.19.t: "Kult Dantego"
 nationalization.19.d: "Dante Alighieri jest uważany za najważniejszy symbol kultury włoskiej, a jego „Boska komedia” za jedno z klasycznych dzieł literatury światowej i najważniejsze literackie świadectwo średniowiecza. Kult Dantego urósł wśród patriotów do rangi prawdziwego zjawiska, a zarazem jest postrzegany jako dowód dla świata, że poczucie ogólnowłoskiej wspólnoty istniało na długo przed Risorgimentem — w końcu to Dante jako pierwszy określił granice Włoch jako obszar, na którym mówi się językiem „Sì”. We Florencji ma stanąć pomnik upamiętniający „najwyższego poetę”."
 nationalization.19.f: "W połowie drogi naszego życia\nznalazłem się w ciemnym lesie,\nbo prosta droga została zagubiona. — Dante Alighieri"
 nationalization.19.g: "Wspieraj kult Dantego i zbuduj pomnik we Florencji."
 nationalization.19.h: "I dręczyć przyszłe pokolenia tercynami?"
 nationalization.12.t: "Rozbójnicy w [SCOPE.sState('nationalization_brigants_modifier').GetName]"
 nationalization.12.d: "Trudne warunki w [SCOPE.sState('nationalization_brigants_modifier').GetName] sprawiły, że coraz więcej pozbawionych perspektyw ludzi dołącza do bandy [SCOPE.sCharacter('manzoni_brigant_character').GetFullName]. Teraz sieją spustoszenie w okolicy — do tego stopnia, że rozbójnicy stali się prawdziwym problemem. Mają nawet zwolenników wśród zwykłych ludzi, którzy postrzegają ich jako przeciwników rządu i postępującej italianizacji, a tym samym jako bojowników politycznego i regionalnego oporu."
 nationalization.13.d: "Zwykli mieszkańcy [SCOPE.sState('nationalization_regionalist_state').GetName] obawiają się, że nowe ogólnowłoskie instytucje oraz upowszechnianie języka włoskiego mogą zniszczyć tamtejszy tradycyjny sposób życia. [SCOPE.sCharacter('nationalization_rural_leader_scope').GetFullName] przekonuje, że wyjątkowego dziedzictwa regionu nie należy ignorować, a homogenizacja Włoch zaszła już zbyt daleko."
 nationalization.13.g: "[SCOPE.sState('nationalization_regionalist_state').GetName] to włoski region jak każdy inny."
 nationalization.11.t: "Nauka w kuchni i sztuka dobrego jedzenia"
 nationalization.11.d: "W [TimeKeeper.GetCurrentDate.Format('y')] roku we Włoszech opublikowano przełomową książkę kucharską, która na zawsze odmieniła tamtejszą kulturę kulinarną. Jej autor, Pellegrino Artusi, wniósł tym samym swój wkład w kształtowanie uznanej na całym świecie kuchni włoskiej, podkreślającej jedność i wielkość narodu."
 nationalization.11.f: "Opublikowana w 1891 roku „La scienza in cucina e l'arte di mangiare bene” Pellegrina Artusiego jest powszechnie uznawana za pierwszą nowoczesną włoską książkę kucharską. W czasach, gdy Włochy dopiero zaczynały kształtować swoją tożsamość narodową, dzieło Artusiego odegrało kluczową rolę w połączeniu różnorodnych kuchni regionalnych w spójną narodową tradycję kulinarną. Jego skrupulatny zbiór przepisów, przedstawiony z dowcipem i przejrzystością, nie tylko wyznaczył nowy standard literatury kulinarnej, ale także znacząco przyczynił się do poprawy poziomu życia w kraju, promując jakość, innowacyjność i dumę z lokalnej gastronomii."
 nationalization.11.g: "Triumf sztuki kulinarnej!"