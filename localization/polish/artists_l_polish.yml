 artists.101.t: "[ROOT.Var('elgar_composer_var').GetCharacter.GetFullName] jest teraz Wielkim Kompozytorem!"
 artists.101.d: "Koncerty na całym świecie, melodie, które zna każdy, opery wystawiane w każdej szanującej się operze. Po wszystkich tych osiągnięciach renoma naszego [concept_elgar_composer] [ROOT.Var('elgar_composer_var').GetCharacter.GetFullName] jest już na tyle duża, że [ROOT.Var('elgar_composer_var').GetCharacter.GetHerHim] można uznać za Wielkiego Kompozytora!"
 artists.101.f: ""
 artists.101.g: "Tytan Muzyki!"
 artists.102.t: "[ROOT.Var('manzoni_writer_var').GetCharacter.GetFullName] jest teraz Wielkim Pisarzem!"
 artists.102.d: "Po opublikowaniu wielu książek, artykułów i innych dzieł literackich nasz [concept_manzoni_writer] [ROOT.Var('manzoni_writer_var').GetCharacter.GetFullName] jest już na tyle sławny, że można go uznać za Wielkiego Pisarza!"
 artists.102.f: ""
 artists.102.g: "Gigant Literatury!"
