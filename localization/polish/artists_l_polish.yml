 artists.2007.t: "Centrum Realizmu"
 artists.2007.d: "[SCOPE.sState('elgar_culture_capital').GetCityHubName] staje się centrum realizmu w sztuce. [GetPlayer.MakeScope.Var('klimt_painter_var').GetCharacter.GetFullName] odegrał w tym znaczącą rolę i jest obecnie uważany za czołową postać realistycznego nurtu malarstwa."
 artists.2007.f: "W historii sztuki realizm oznacza nowe podejście do sztuki, które narodziło się w Europie w połowie XIX wieku i stanowiło sprzeciw wobec przedstawień charakterystycznych dla klasycyzmu i romantyzmu. W sztuce realizm dąży do jak najwierniejszego odtworzenia rzeczywistości. Charakterystyczne dla realizmu jest przyswajanie rzeczywistości przez artystę i jej późniejsze przekształcanie w dzieło sztuki, a także związane z tym konotacje polityczne. Realizm promuje codzienność i obiektywizm. Jego najbardziej znanym przedstawicielem był francuski malarz Gustave Courbet, który przejął określenie „sztuka realistyczna” i używał go w odniesieniu do własnej twórczości ze względu na jego prowokacyjny wydźwięk."
 artists.2007.g: "Ale czy w rzeczywistości można odnaleźć prawdziwe piękno?"
 artists.2008.t: "Centrum Irracjonalizmu"
 artists.2008.d: "Utworzenie Sali Festiwalowej [GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetFullName] jest uważane za jedno z najważniejszych wydarzeń w Kulturze Muzycznej XIX wieku."
 artists.2008.f: "Festiwal w [SCOPE.sState('elgar_culture_capital').GetCityHubName] to coroczne wydarzenie muzyczne, podczas którego wystawiane są opery XIX-wiecznego kompozytora [GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetFullName]. Sam [GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetLastName] opracował i promował ideę specjalnego festiwalu, na którym prezentowano by jego własne dzieła, w szczególności monumentalny cykl „Der Ring des Nibelungen” oraz „Parsifal”. Przedstawienia odbywają się w specjalnie zaprojektowanym teatrze, [SCOPE.sState('elgar_culture_capital').GetCityHubName] Festspielhaus. [GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetLastName] osobiście nadzorował projektowanie i budowę teatru, który wyróżniał się licznymi innowacjami architektonicznymi, umożliwiającymi pomieszczenie ogromnych orkiestr, dla których [GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetLastName] komponował, a także realizację jego szczególnej wizji inscenizacji własnych dzieł. Festiwal stał się celem pielgrzymek miłośników muzyki klasycznej."
 artists.2008.g: "Szczyt kultury [GetPlayer.GetDefinition.GetPrimaryCulture.GetName]!"
 artists.2011.t: "Fin de Siecle"
 artists.2011.d: "Wraz z początkiem nowego stulecia pewniki znikają, a niepewność narasta. Dotyczy to również sztuki. Impresjonizm, niegdyś sam będący innowacją, ustępuje miejsca nowym kierunkom artystycznym. Rezultaty są wciąż całkowicie nieprzewidywalne — podobnie jak to, jakich artystów wyłoni ten zwrot."
 artists.2011.f: "Fin de Siècle, znane również jako „Décadence”, odnosi się do nurtów artystycznych i postawy życiowej charakterystycznych dla dwóch ostatnich dekad XIX wieku, a w szerszym znaczeniu — równolegle do epoki Belle Époque — aż do początku I wojny światowej. Termin ten wskazuje na ruch kulturowy, który uczynił upadek kultury przedmiotem własnych rozważań. Epokę tę charakteryzowało wahanie między duchem optymizmu, euforią związaną z przyszłością, nieokreślonym lękiem przed przyszłością i regresem, nastrojami apokaliptycznymi, znużeniem życiem, zmęczeniem światem, fascynacją śmiercią i przemijaniem, beztroską, frywolnością oraz dekadencją. Ogólny kryzys ogarnął dominujące warstwy społeczne, ponieważ podstawowe wartości życia społecznego wydawały się zagrożone. Poczucie bezsilności stało się charakterystyczne dla intelektualistów, artystów i pisarzy, którzy odczuwali jednocześnie przyciąganie i odrazę wobec społeczeństwa wielkomiejskiego, z jednej strony zdominowanego przez prawa rynku i anonimowe masy, a z drugiej — przez świat coraz silniej kształtowany przez nauki przyrodnicze i technologię. Uciekali oni w estetyczne światy alternatywne."
 artists.2011.g: "Muzyka jest królową sztuk."
 artists.2011.h: "Malarstwo jest naszą siłą."
 artists.2011.i: "Jesteśmy całkowicie oddani literaturze."
 artists.2012.d: "Wraz z początkiem nowego stulecia pewniki znikają, a niepewność narasta. Dotyczy to również sztuki. Ekspresjonizm, niegdyś sam będący innowacją, ustępuje miejsca nowym kierunkom artystycznym. Rezultaty są wciąż całkowicie nieprzewidywalne — podobnie jak to, jakich artystów wyłoni ten zwrot."
 artists.2013.d: "Wraz z początkiem nowego stulecia pewniki znikają, a niepewność narasta. Dotyczy to również sztuki. Secesja, niegdyś sama będąca innowacją, ustępuje miejsca nowym kierunkom artystycznym. Rezultaty są wciąż całkowicie nieprzewidywalne — podobnie jak to, jakich artystów wyłoni ten zwrot."
