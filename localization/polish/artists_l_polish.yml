 artists.2003.d: "Nasza stolica [SCOPE.sState('elgar_culture_capital').GetCityHubName] staje się centrum secesji."
 artists.2003.f: "[concept_elgar_art_nouveau], znana we Włoszech również jako Stile liberty, to epoka w historii sztuki przypadająca na przełom XIX i XX wieku. Do nurtów zaliczanych do secesji należą styl reformatorski (związany z ruchem reformatorskim), styl secesyjny (związany z Secesją Wiedeńską), Modernisme w Katalonii, Style Sapin w Szwajcarii oraz Tiffany Style w Stanach Zjednoczonych. Oprócz określenia Art nouveau, dominującego w języku francuskim, angielskim i włoskim, w języku angielskim używa się również terminu Modern Style, a we włoskim Stile Floreale. Pod względem chronologicznym secesja należy do epoki fin de siècle."
