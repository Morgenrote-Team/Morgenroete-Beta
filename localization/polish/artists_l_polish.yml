 artists.2002.d: "Nasza stolica [SCOPE.sState('elgar_culture_capital').GetCityHubName] staje się centrum ekspresjonizmu."
 artists.2002.f: "[concept_elgar_expressionism] to styl w sztuce, którego początki i prekursorów można odnaleźć pod koniec XIX wieku. Podobnie jak impresjonizm, symbolizm i fowizm, ekspresjonizm jest ruchem sprzeciwiającym się tendencjom naturalizmu. W ekspresjonizmie poziom ekspresyjny przeważa nad poziomem estetycznym, apelatywnym i rzeczowym. Artysta chce przedstawić widzowi swoje przeżycia. W przeciwieństwie do impresjonizmu muzycznego, który ukazuje sposób postrzegania zewnętrznego wyglądu rzeczy, kierunki ekspresjonistyczne wyrażają emocje ludzkiej duszy."
