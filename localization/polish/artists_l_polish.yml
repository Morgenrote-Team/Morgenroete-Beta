 je_artists_realism: "Salon Sztuki"
 je_artists_realism_reason: "Realizm jako forma sztuki zyskuje coraz większą popularność. Malarze w różnych miejscach już opowiadają się za tym nowym kierunkiem. Realizm wciąż jednak nie ma własnego, prawdziwego centrum. Niechęć tradycyjnej elity artystycznej do nowego stylu sprawiła, że jak dotąd pozostaje on zjawiskiem rozwijającym się poza akademią. Potrzebujemy własnej akademii sztuki, która będzie nauczać tego stylu, oraz galerii, w której znajdzie swoje miejsce malarstwo realistyczne — a także oczywiście [concept_klimt_painter], który będzie wzorem realizmu w naszym kraju. Utworzenie salonu sztuki umożliwi nam również organizowanie konkursów malarskich."
 je_artists_realism_success: "Potrzebujemy #G 250#! @klimt_painting_tradition! [concept_klimt_painting_tradition]."
 je_artists_realism_goal: ""
 je_artists_realism_trigger: "[concept_artists_center_of_arts] dla Realizmu #G nie istnieje#!."
 je_artists_realism_fail: "[concept_artists_center_of_arts] dla Realizmu #R istnieje#!."
 je_artists_irrationalism: "Festiwal Muzyki"
 je_artists_irrationalism_reason: "Kształtuje się nowa, rewolucyjna forma muzyki, która postrzega siebie jako „dzieło totalne”. Narodziny tej formy muzyki zależą od wybitnego kompozytora. Muzyka ta mogłaby być wykonywana wyłącznie we własnej sali festiwalowej, która stałaby się miejscem pielgrzymek miłośników muzyki z całego świata — byłoby to centrum irracjonalizmu! Utworzenie festiwalu muzycznego umożliwi nam również organizowanie konkursów muzycznych."
 je_artists_irrationalism_success: "Potrzebujemy #G 500#! @elgar_music_tradition! [concept_elgar_musical_tradition]."
 je_artists_irrationalism_goal: ""
 je_artists_irrationalism_trigger: "[concept_artists_center_of_arts] dla Irracjonalizmu #G nie istnieje#!."
