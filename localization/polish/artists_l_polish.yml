 je_artists_impressionism: "Impresjonizm"
 je_artists_impressionism_reason: "[concept_elgar_impressionism] to nurt w historii sztuki, który charakteryzuje się nastrojowym przedstawianiem ulotnych chwil uchwyconych w danej scenie. Wywodzi się z ruchu w malarstwie, który narodził się we Francji w drugiej połowie XIX wieku. Termin impresjonizm stosuje się również do określonych stylów muzyki, literatury, filmu i fotografii. Podczas gdy wielu naturalistów, takich jak Heinrich Hart, odrzucało muzykę jako środek wyrazu „akcjonizmu poszukującego prawdy”, impresjoniści często postrzegali „bezprzedmiotowe wybieganie marzeniami naprzód” ku subtelnie zróżnicowanym, barwnym akordom jako źródło przyjemności."
 je_artists_impressionism_success: "Potrzebujemy #G 850#! @elgar_music_tradition! [concept_elgar_musical_tradition]."
 je_artists_expressionism: "Ekspresjonizm"
 je_artists_expressionism_reason: "[concept_elgar_expressionism] to styl w sztuce, którego początki i prekursorów można odnaleźć pod koniec XIX wieku. Podobnie jak impresjonizm, symbolizm i fowizm, ekspresjonizm jest ruchem sprzeciwiającym się tendencjom naturalizmu. W ekspresjonizmie poziom ekspresyjny przeważa nad poziomem estetycznym, apelatywnym i rzeczowym. Artysta chce przedstawić widzowi swoje przeżycia. W przeciwieństwie do impresjonizmu muzycznego, który ukazuje sposób postrzegania zewnętrznego wyglądu rzeczy, kierunki ekspresjonistyczne wyrażają emocje ludzkiej duszy."
 je_artists_expressionism_success: "Potrzebujemy #G 850#! @elgar_music_tradition! [concept_elgar_musical_tradition]."
 je_artists_art_nouveau: "Secesja"
 je_artists_art_nouveau_reason: "[concept_elgar_art_nouveau], znana głównie we Włoszech również jako Stile Liberty, to epoka w historii sztuki przypadająca na przełom XIX i XX wieku. Do nurtów zaliczanych do secesji należą styl reformistyczny (związany z ruchem reformatorskim), styl secesyjny (związany z Secesją Wiedeńską), Modernisme w Katalonii, Style Sapin w Szwajcarii oraz Tiffany Style w Stanach Zjednoczonych. Oprócz określenia Art Nouveau, dominującego we francuskim, angielskim i włoskim nazewnictwie, w języku angielskim używa się również terminu Modern Style, a we włoskim Stile Floreale. Pod względem chronologicznym secesja należy do epoki fin de siècle."
 je_artists_mass_culture: "Kultura Masowa"
 je_artists_mass_culture_reason: "„Niepojęta wrogość „mas” wobec wszystkich tradycji reprezentujących Kulturę, przenikliwy i chłodny intelekt, który podważa mądrość chłopa, nowo odkryty naturalizm, który w kwestiach seksu i społeczeństwa cofa się daleko ku całkiem pierwotnym instynktom i warunkom, ponowne pojawienie się panem et circenses w postaci sporów płacowych i stadionów sportowych — wszystko to zwiastuje ostateczny zmierzch Kultury i początek zupełnie nowej fazy ludzkiego istnienia”. — Oswald Spengler, „Zmierzch Zachodu”"
 je_artists_mass_culture_goal: ""
 je_artists_biennale: "Biennale"
 je_artists_biennale_reason: "Biennale to wystawa organizowana co dwa lata. Jej historycznym wzorem jest Biennale w Wenecji, które szybko zdobyło międzynarodową sławę i stało się mekką współczesnych artystów ze wszystkich dziedzin sztuki, przybywających tam, by ze sobą rywalizować. Artyści z całego świata mieli zapewnić swoim ojczyznom międzynarodowe uznanie i umocnić ich pozycję jako potęg kulturalnych."
 je_artists_biennale_fail_tt: "Nie możemy zorganizować Biennale, jeśli inne państwo nas uprzedzi."
 artists.1001.t: "Założono Biennale"
 artists.1001.d: "[SCOPE.sState('artists_biennale_city').GetCityHubName] jest uważane za doskonałe miejsce na międzynarodową wystawę współczesnych dzieł sztuki. Organizatorzy rozpoczęli przygotowania do zorganizowania tam pierwszego biennale w przyszłym roku."
 artists.1001.f: "Po zorganizowaniu pierwszego Biennale w naszym kraju co dwa lata będzie odbywać się kolejne, honorujące narody wyróżniające się w dziedzinie sztuki. Decydujące znaczenie będzie miała łączna wartość reputacji wszystkich artystów danego kraju. Biennale zawsze organizuje państwo, które jest właścicielem miejsca jego organizacji. Jeśli [SCOPE.sState('artists_biennale_city').GetCityHubName] zostanie podbite przez obce mocarstwa, nowi właściciele będą mogli organizować Biennale."
 artists.1001.g: "Przygotujemy pierwsze Biennale."
 artists.1002.t: "Biennale w [SCOPE.sState('artists_biennale_city').GetCityHubName] — [TimeKeeper.GetCurrentDate.Format('y')]"
 artists.1002.d: "Biennale w [SCOPE.sState('artists_biennale_city').GetCityHubName] trwa już od kilku tygodni. Wśród wystawiających artystów zaczyna się już zarysowywać pewien trend. Wystawcy z [SCOPE.sCountry('artists_biennale_first_winner_scope').GetName] są uważani za faworytów. [SCOPE.sCountry('artists_biennale_second_winner_scope').GetName] i [SCOPE.sCountry('artists_biennale_third_winner_scope').GetName] również mają kilka interesujących eksponatów, ale to nie wystarczy."
 artists.1002.f: "Biennale w Wenecji zostało ustanowione w 1895 roku i w pierwszych dekadach XX wieku zyskiwało coraz bardziej międzynarodowy charakter. Od 1907 roku kilka krajów zaczęło wznosić na terenie wystawy pawilony narodowe, a pierwszym z nich był pawilon Belgii. W 1910 roku zaprezentowano dzieła pierwszych artystów o międzynarodowej renomie: salę poświęconą Gustavowi Klimtowi, wystawę indywidualną Renoira oraz retrospektywę Courbeta. Dzieło Picassa „Rodzina Kuglarzy” zostało usunięte z hiszpańskiego salonu w centralnym Palazzo, ponieważ obawiano się, że jego nowatorski charakter może zaszokować publiczność. Do 1914 roku powstało siedem pawilonów narodowych: Belgii (1907), Węgier (1909), Niemiec (1909), Wielkiej Brytanii (1909), Francji (1912), Holandii (1912) i Rosji (1914)."
 artists.1002.g: "Sędziowie powinni się zebrać."
 artists.1003.d: "Zgodnie z jednogłośną decyzją sędziów Biennale w [SCOPE.sState('artists_biennale_city').GetCityHubName], nasi artyści zaprezentowali w tym roku najbardziej innowacyjne eksponaty o najwyższej jakości i przodują w dziedzinie malarstwa, literatury oraz muzyki. Gratulacje!"
 artists.1003.f: "[GetPlayer.GetName] bez wątpienia zdominowało tegoroczne Biennale i zajęło pierwsze miejsce. Artyści z [SCOPE.sCountry('artists_biennale_second_winner_scope').GetName] zdobyli drugą nagrodę, a artyści z [SCOPE.sCountry('artists_biennale_third_winner_scope').GetName] również zaprezentowali się przekonująco."
 artists.1003.g: "To świt nowej kultury."
 artists.2001.t: "Narodziny Impresjonizmu"
 artists.2001.d: "Nasza stolica [SCOPE.sState('elgar_culture_capital').GetCityHubName] staje się centrum impresjonizmu."
 artists.2001.f: "[concept_elgar_impressionism] to nurt w historii sztuki, który charakteryzuje się nastrojowym przedstawianiem ulotnych chwil uchwyconych w danej scenie. Wywodzi się z ruchu w malarstwie, który narodził się we Francji w drugiej połowie XIX wieku. Termin impresjonizm stosuje się również do określonych stylów muzyki, literatury, filmu i fotografii. Podczas gdy wielu naturalistów, takich jak Heinrich Hart, odrzucało muzykę jako środek wyrazu „akcjonizmu poszukującego prawdy”, impresjoniści często postrzegali „bezprzedmiotowe wybieganie marzeniami naprzód” ku subtelnie zróżnicowanym, barwnym akordom jako źródło przyjemności."
 artists.2001.g: "Jesteśmy wiodącym narodem w dziedzinie kultury."
