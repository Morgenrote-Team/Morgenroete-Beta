 artists.11.t: "Nasz Kompozytor zmarł"
 artists.11.d: "Po dziesięcioleciach kariery jako [concept_elgar_composer] nasz dawny czołowy muzyk zmarł. Czy kiedykolwiek uda nam się zastąpić tak niezwykłego artystę?"
 artists.11.g: "Tak kończy się jego melodia."
 artists.11_tt: "Czasami gra uśmierca postacie. Mod nie może temu zapobiec. To wydarzenie usuwa z gry rolę danego artysty, aby jego duch nie nawiedzał Cię w dalszej rozgrywce."
 artists.12.t: "Nasz Pisarz zmarł"
 artists.12.d: "Po dziesięcioleciach kariery jako [concept_manzoni_writer] zmarł nasz wybitny literat. Czy kiedykolwiek uda nam się zastąpić tak niezwykłego pisarza?"
 artists.12.g: "Ciekawe, jakie były jego ostatnie słowa?"
 artists.13.t: "Nasz Malarz zmarł"
 artists.13.d: "Po dziesięcioleciach kariery jako [concept_klimt_painter] zmarł nasz największy talent artystyczny. Czy kiedykolwiek uda nam się zastąpić tak niezwykłego artystę?"
 artists.13.g: "Jego farby wyschły."
