l_polish:
 MR_GEOLOGIST_ACHIEVEMENTS: "[AddLocalizationIf( Scope.IsSet , 'agassiz_geologist_achievements_loc')][AddLocalizationIf( Not(Scope.IsSet) , 'agassiz_geologist_no_geologist_loc')]"
 agassiz_geologist_achievements_loc: "$agassiz_geologist_achievements_intro_loc$[AddLocalizationIf( Scope.Var('agassiz_geologist_achievement_invented_seismology_var').IsSet , Scope.Var('agassiz_geologist_achievement_invented_seismology_var').GetFlagName)][AddLocalizationIf( Scope.Var('agassiz_geologist_achievement_invented_plate_tectonics_var').IsSet , Scope.Var('agassiz_geologist_achievement_invented_plate_tectonics_var').GetFlagName)][AddLocalizationIf( Scope.Var('agassiz_geologist_achievement_attended_geologist_congress_var').IsSet , Scope.Var('agassiz_geologist_achievement_attended_geologist_congress_var').GetFlagName)][AddLocalizationIf( Scope.Var('agassiz_geologist_achievement_explored_volcano_var').IsSet , Scope.Var('agassiz_geologist_achievement_explored_volcano_var').GetFlagName)][AddLocalizationIf( Scope.Var('agassiz_geologist_achievement_discovered_helium_on_earth_var').IsSet , Scope.Var('agassiz_geologist_achievement_discovered_helium_on_earth_var').GetFlagName)][AddLocalizationIf( Scope.Var('agassiz_geologist_achievement_finished_pacific_expedition_var').IsSet , Scope.Var('agassiz_geologist_achievement_finished_pacific_expedition_var').GetFlagName)][AddLocalizationIf( Scope.Var('aagassiz_geologist_achievement_ring_of_fire_discovered_var').IsSet , Scope.Var('agassiz_geologist_achievement_ring_of_fire_discovered_var').GetFlagName)][AddLocalizationIf( Scope.Var('agassiz_geologist_achievement_moon_impact_var').IsSet , Scope.Var('agassiz_geologist_achievement_moon_impact_var').GetFlagName)][AddLocalizationIf( Scope.Var('agassiz_geologist_achievement_returned_from_center_of_earth_var').IsSet , Scope.Var('agassiz_geologist_achievement_returned_from_center_of_earth_var').GetFlagName)]"
 agassiz_geologist_no_geologist_loc: "#V Osiągnięcia postaci [concept_agassiz_geologist]#! zostaną tutaj wyświetlone, gdy ją pozyskasz."
 agassiz_geologist_achievements_intro_loc: "#V Osiągnięcia tego Geologa#!\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] jest uznanym Geologiem, który zebrał [Scope.GetVariable('agassiz_geologist_minerals_var').GetValue|0V] [Concept('concept_agassiz_mineral','$concept_agassiz_minerals|q$')] oraz [Scope.GetVariable('agassiz_geologist_rare_minerals_var').GetValue|0V] [Concept('concept_agassiz_rare_mineral','$concept_agassiz_rare_minerals|q$')]. [Scope.GetCharacter.GetHerHis|U] badania geologiczne dostarczyły nam [Scope.GetVariable('agassiz_geologist_geological_knowledge_var').GetValue|0V] [concept_agassiz_geological_knowledge].#!"
 agassiz_geologist_achievement_invented_seismology_loc: "\n #indent_newline:3 • #V Stworzenie Sejsmologii#! to jedno z największych osiągnięć naukowca Dr. [Scope.GetCharacter.GetLastNameNoFormatting]. Pozwala ona przewidywać Trzęsienia Ziemi i Erupcje Wulkaniczne.#!"
 agassiz_geologist_achievement_invented_plate_tectonics_loc: "\n #indent_newline:3 • Czy #V opracowanie Teorii Tektoniki Płyt#! jest jednym z największych osiągnięć naukowca Dr. [Scope.GetCharacter.GetLastNameNoFormatting]? Ponieważ nie wszyscy [Scope.GetCharacter.GetHerHis] koledzy po fachu uznają tę teorię, dopiero przyszłość pokaże, czy zostanie ona uznana za [Scope.GetCharacter.GetHerHis] najważniejsze odkrycie, czy też popadnie w zapomnienie.#!"
 agassiz_geologist_achievement_attended_geologist_congress_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] #V uczestniczył w Kongresie Geologicznym poświęconym Tektonice Płyt#!.#!"
 agassiz_geologist_achievement_explored_volcano_loc: "\n #indent_newline:3 • #V Badanie Wulkanu#! to niebezpieczne przedsięwzięcie, ale Dr. [Scope.GetCharacter.GetLastNameNoFormatting] zdobył wiele cennych informacji podczas wyprawy na jeden z nich.#!"
 agassiz_geologist_achievement_discovered_helium_on_earth_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] jako pierwszy #V odkrył Hel na Ziemi#!, który z pewnością będzie w przyszłości bardzo użytecznym surowcem.#!"
 agassiz_geologist_achievement_finished_pacific_expedition_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetFullNameNoFormatting] uczestniczył w #V Wyprawie na Pacyfik#!.#!"
 agassiz_geologist_achievement_returned_from_center_of_earth_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] podobno #V dotarł do Wnętrza Ziemi#! i stamtąd powrócił. Ale czy ta historia jest naprawdę prawdziwa?#!"
 agassiz_geologist_achievement_moon_impact_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] wysunął hipotezę, że #V Księżyc powstał w wyniku zderzenia nieznanego, dużego ciała niebieskiego z Ziemią#!. Teoria wysoce spekulatywna, lecz niezwykle oryginalna.#!"
 agassiz_geologist_achievement_ring_of_fire_discovered_loc: "\n #indent_newline:3 • Podczas #V Wyprawy na Ocean Spokojny#! Dr. [Scope.GetCharacter.GetLastNameNoFormatting] zaobserwował ogromne skupisko wulkanów na obrzeżach oceanu — #V Pierścień Ognia#! — i uważa, że nie jest to przypadek. [Scope.GetCharacter.GetSheHe|U] nadał tym samym istotny impuls badaniom geologicznym.#!"