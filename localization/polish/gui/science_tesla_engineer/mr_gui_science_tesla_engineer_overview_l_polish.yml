l_polish:
 MR_AUTOMATE_ENGINEER_TT: "#T Zautomatyzuj [concept_tesla_engineer] #! \n Jeśli zautomatyzujesz zadania, nie będziesz już musiał zlecać ich inżynierowi.\n Będzie on pracować samodzielnie i wykonywać zadania, które są w danym momencie sensowne. Nadal będziesz jednak otrzymywać informacje o niektórych zdarzeniach. \n\n#n Miej na uwadze, że automatyzacja inżyniera jest prawdopodobnie mniej efektywna, aniżeli byś samemu przydzielał mu zadania. #!"
 mr_engineering_automation_gui_tt: "Rozpocznij automatyzację zadań [concept_tesla_engineer]."
 mr_stop_engineering_automation_gui_tt: "Zakończ automatyzację zadań [concept_tesla_engineer]."
 MR_STOP_AUTOMATE_ENGINEER_TT: "#T Zakończ automatyzację [concept_tesla_engineer] #!\n Twój Inżynier nie będzie już wykonywał zadań samodzielnie. "
 MR_ENGINEER_RANKING_BUTTON: "Inżynierowie"
 MR_RANKING_BY_ENGINEER: "Pokaż ranking wszystkich [Concept('concept_tesla_engineer','$concept_tesla_engineers|q$')] na świecie."
 ENGINEER_ENGINEER_RANKING_HEADER: "#V [Concept('concept_tesla_engineer','$concept_tesla_engineers|q$')] Świata rankingowani według [concept_academics_experience]"
 tesla_experience_current_specialization_civil_loc: "[Character.MakeScope.GetVariable('tesla_civil_engineer_experience_var').GetValue|V0]"
 tesla_experience_current_specialization_mechanical_loc: "[Character.MakeScope.GetVariable('tesla_mechanical_engineer_experience_var').GetValue|V0]"
 tesla_experience_current_specialization_military_loc: "[Character.MakeScope.GetVariable('tesla_military_engineer_experience_var').GetValue|V0]"
 tesla_experience_current_specialization_electrical_loc: "[Character.MakeScope.GetVariable('tesla_electrical_engineer_experience_var').GetValue|V0]"
 tesla_experience_current_specialization_aeronautical_loc: "[Character.MakeScope.GetVariable('tesla_aeronautical_engineer_experience_var').GetValue|V0]"
 MR_ELECTRICAL_ENGINEER_SAW_MILLS_BUTTON: "Modernizacja Tartaków"
 MR_ELECTRICAL_ENGINEER_SAW_MILLS_BUTTON_TT: "#T Modernizacja Tartaków#!\nNiech twój [concept_tesla_engineer] skupi się na modernizacji budynków [GetBuildingType('building_logging_camp').GetName]. Z czasem budynki typu $building_logging_camp$ otrzymają następujący modyfikator: $tesla_saw_mills_1_modifier$.\n\nZwiększy to #n wydatki#! twojego państwa.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ELECTRICAL_ENGINEER_SAW_MILLS_TRIGGER_TT: "#default_text Państwo [GetPlayer.GetName] posiada budynek [GetBuildingType('building_logging_camp').GetName] na poziomie 1 lub wyższym, w którym stosuje się #O Tartak Elektryczny#! jako [concept_production_method] i który nie ma jeszcze [concept_modifier].#!"
 MR_TESLA_BUILDING_CHOOSER_SAW_MILLS_MULTIPLE_HEADER: "Projekt Modernizacji Tartaków"
 MR_ELECTRICAL_ENGINEER_POWER_GRID_BUTTON: "Modernizacja Sieci Energetycznej"
 MR_ELECTRICAL_ENGINEER_POWER_GRID_BUTTON_TT: "#T Modernizacja Sieci Energetycznej#!\nNiech twój [concept_tesla_engineer] skupi się na modernizacji budynków [GetBuildingType('building_tesla_telegraph').GetName]. Z czasem budynki typu $building_tesla_telegraph$ otrzymają następujący modyfikator: $tesla_power_grid_1_modifier$.\n\nZwiększy to #n wydatki#! twojego państwa.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ELECTRICAL_ENGINEER_POWER_GRID_TRIGGER_TT: "#default_text Państwo [GetPlayer.GetName] posiada budynek [GetBuildingType('building_tesla_telegraph').GetName] na poziomie 1 lub wyższym, w którym stosuje się #O Linię Energetyczną#! jako [concept_production_method] i który nie ma jeszcze [concept_modifier].#!"
 MR_TESLA_BUILDING_CHOOSER_POWER_GRID_MULTIPLE_HEADER: "Projekt Modernizacji Sieci Energetycznej"