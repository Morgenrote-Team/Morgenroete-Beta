l_polish:
 MR_PHYSICIST_ACHIEVEMENTS_TT: "[AddLocalizationIf( Scope.IsSet , 'curie_physicist_achievements_loc')][AddLocalizationIf( Not(Scope.IsSet) , 'curie_physicist_achievements_no_physicist_loc')]"
 curie_physicist_achievements_loc: "$curie_physicist_achievements_intro_loc$[AddLocalizationIf( Scope.Var('curie_physicist_achievement_historical_physics_experiment_var').IsSet , Scope.Var('curie_physicist_achievement_historical_physics_experiment_var').GetFlagName)] [AddLocalizationIf( Scope.Var('curie_physicist_achievement_founded_magnetic_association_var').IsSet , Scope.Var('curie_physicist_achievement_founded_magnetic_association_var').GetFlagName)] [AddLocalizationIf( Scope.Var('curie_physicist_achievements_finished_geomagnetic_observatory_project_var').IsSet , Scope.Var('curie_physicist_achievements_finished_geomagnetic_observatory_project_var').GetFlagName)] [AddLocalizationIf( Scope.Var('curie_physicist_achievement_magnetic_atlas_var').IsSet , Scope.Var('curie_physicist_achievement_magnetic_atlas_var').GetFlagName)] [AddLocalizationIf( Scope.Var('curie_physicist_achievement_stratospheric_flight_var').IsSet , Scope.Var('curie_physicist_achievement_stratospheric_flight_var').GetFlagName)] [AddLocalizationIf( Scope.Var('curie_physicist_achievement_mathematics_improvement_finished_var').IsSet , Scope.Var('curie_physicist_achievement_mathematics_improvement_finished_var').GetFlagName)] [AddLocalizationIf( Scope.Var('curie_physicist_achievement_first_cloud_describer_var').IsSet , Scope.Var('curie_physicist_achievement_first_cloud_describer_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_weather_service_var').IsSet , Scope.Var('curie_physicist_achievement_weather_service_var').GetFlagName)] [AddLocalizationIf( Scope.Var('curie_physicist_achievement_weather_station_expansion_var').IsSet , Scope.Var('curie_physicist_achievement_weather_station_expansion_var').GetFlagName)] [AddLocalizationIf( Scope.Var('curie_physicist_achievement_meteorology_improvement_finished_var').IsSet , Scope.Var('curie_physicist_achievement_meteorology_improvement_finished_var').GetFlagName)]"
 curie_physicist_achievements_intro_loc: "#V Osiągnięcia tego Fizyka#!\n #indent_newline:3 • [Scope.GetCharacter.GetFullName] jest znanym fizykiem.#!\n #indent_newline:3 • Do tej pory [Scope.GetCharacter.GetSheHe] wyprowadził [Scope.Var('curie_discovered_formulas_character_number_var').GetValue|V0] wzorów i przeprowadził [Scope.Var('curie_discovered_experiments_character_number_var').GetValue|V0] eksperymentów. [Scope.GetCharacter.GetSheHe] opisał również [Scope.Var('curie_discovered_clouds_character_number_var').GetValue|V0] chmur.#!"
 curie_physicist_achievements_no_physicist_loc: "#V Osiągnięcia postaci [concept_curie_physicist]#! zostaną tutaj wyświetlone, gdy ją pozyskasz."
 curie_physicist_achievement_historical_physics_experiment_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetSheHe] słynie z #V Eksperymentu [Scope.GetCharacter.GetLastNameNoFormatting]#! nazwanego na [Scope.GetCharacter.GetHerHim] cześć."
 curie_physicist_achievement_founded_magnetic_association_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] jest #V założycielem Towarzystwa Magnetycznego#!, pierwszego międzynarodowego towarzystwa naukowego.#!"
 curie_physicist_achievements_finished_geomagnetic_observatory_project_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] przyczynił się do rozwoju badań geomagnetycznych poprzez #V budowę Obserwatorium Geomagnetycznego#!.#!"
 curie_physicist_achievement_magnetic_atlas_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetSheHe] odegrał kluczową rolę w #V stworzeniu atlasu magnetycznego#!."
 curie_physicist_achievement_mathematics_improvement_finished_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] niestrudzenie pracował nad #V rozwojem wydziałów matematyki#! w naszym kraju.#!"
 curie_physicist_achievement_first_cloud_describer_loc: "\n #indent_newline:3 • Dzięki #V pierwszemu opisowi pewnego rodzaju chmur#! [Scope.GetCharacter.GetSheHe] zapisał się na kartach historii meteorologii.#!"
 curie_physicist_achievement_weather_service_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] przez wiele lat #V prowadził służbę meteorologiczną#! na rzecz kraju.#!"
 curie_physicist_achievement_weather_station_expansion_loc: "\n #indent_newline:3 • Jedną z najważniejszych innowacji technicznych była modernizacja stacji meteorologicznej obserwatorium, przeprowadzona pod kierownictwem [Scope.GetCharacter.GetHerHis].#!"
 curie_physicist_achievement_meteorology_improvement_finished_loc: "\n #indent_newline:3 • Rozbudowa krajowej sieci stacji meteorologicznych przy urzędach telegraficznych znacznie zwiększyła bezpieczeństwo naszego kraju w obliczu katastrof pogodowych – a wszystko dzięki Dr. [Scope.GetCharacter.GetLastNameNoFormatting]!.#!"
 curie_physicist_achievement_stratospheric_flight_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] zorganizował i nadzorował #V pierwszy lot stratosferyczny#! naszego kraju, dlatego uchodzi za jednego z naszych najbardziej szanowanych naukowców."