 CURIE_EXPERIMENT_YOUNG_NAME: "$mr_young$"
 CURIE_EXPERIMENT_ORSTED_NAME: "$mr_orsted$"
 CURIE_EXPERIMENT_YOUNG_TT: "W [Scope.Var('year').GetValue] roku [Scope.Var('discoverer').GetFlagName] przepuścił światło przez dwie wąskie szczeliny na ekran. Powstały w ten sposób wzór interferencyjny, składający się z jasnych i ciemnych prążków, dowiódł, że światło ma naturę falową, skutecznie obalając dominującą teorię korpuskularną Isaaca Newtona."
 CURIE_EXPERIMENT_ORSTED_TT: "W [Scope.Var('year').GetValue] roku [Scope.Var('discoverer').GetFlagName] umieścił przewód, przez który płynął prąd elektryczny, nad kompasem magnetycznym. Odchylenie igły kompasu dowiodło, że prąd elektryczny wytwarza pole magnetyczne, dając początek elektromagnetyzmowi jako jednolitej dziedzinie nauki."
 CURIE_EXPERIMENT_JOULES_TT: "W [Scope.Var('year').GetValue] roku [Scope.Var('discoverer').GetFlagName] wykorzystał opadające ciężarki do napędzania łopatek obracających się w izolowanym termicznie naczyniu z wodą. Wynikający z tego wzrost temperatury wykazał, że praca mechaniczna może być bezpośrednio przekształcana w ciepło, potwierdzając zasadę zachowania energii."
 CURIE_EXPERIMENT_DOPPLER_TT: "W [Scope.Var('year').GetValue] roku [Scope.Var('discoverer').GetFlagName] sprawdził teorię Dopplera, wykorzystując trębaczy grających w jadącym pociągu. Zaobserwowana zmiana wysokości dźwięku podczas przejazdu pociągu potwierdziła efekt Dopplera, dowodząc, że ruch wpływa na częstotliwość fal dźwiękowych."
 CURIE_EXPERIMENT_FOUCAULT_TT: "W [Scope.Var('year').GetValue] roku [Scope.Var('discoverer').GetFlagName] zawiesił ciężkie wahadło na długiej linie. Stopniowy obrót płaszczyzny jego drgań względem podłogi dostarczył bezpośredniego, widocznego gołym okiem dowodu na obrót Ziemi wokół własnej osi, bez konieczności prowadzenia obserwacji astronomicznych."
 CURIE_EXPERIMENT_FIZEAU_TT: "W [Scope.Var('year').GetValue] roku [Scope.Var('discoverer').GetFlagName] skierował wiązkę światła przez obracające się koło zębate ku odległemu zwierciadłu. Zablokowanie powracającego światła przy znanych prędkościach obrotowych koła umożliwiło dokonanie pierwszego naziemnego pomiaru prędkości światła."
 CURIE_EXPERIMENT_WEBER_TT: "W [Scope.Var('year').GetValue] roku [Scope.Var('discoverer').GetFlagName] zmierzył ładunek elektryczny za pomocą butelki lejdejskiej i galwanometru. Stosunek jednostek elektrostatycznych do elektromagnetycznych pozwolił wyznaczyć prędkość światła, dowodząc jego elektromagnetycznej natury."
 CURIE_EXPERIMENT_MICHELSON_TT: "W [Scope.Var('year').GetValue] roku [Scope.Var('discoverer').GetFlagName] rozdzielił wiązkę światła na dwie prostopadłe drogi za pomocą czułego interferometru. Brak oczekiwanego przesunięcia prążków interferencyjnych podważył teorię eteru świetlnego, torując drogę szczególnej teorii względności."
 CURIE_EXPERIMENT_HERTZ_TT: "W [Scope.Var('year').GetValue] roku [Scope.Var('discoverer').GetFlagName] wykorzystał obwody z iskiernikami do wytwarzania i wykrywania niewidzialnych fal radiowych. Wykazanie, że rozchodzą się one z prędkością światła i mają takie same właściwości falowe, potwierdziło teorię elektromagnetyczną Maxwella i dało początek komunikacji bezprzewodowej."
 CURIE_EXPERIMENT_THOMSON_TT: "W [Scope.Var('year').GetValue] roku [Scope.Var('discoverer').GetFlagName] odchylił promienie katodowe za pomocą pól elektrycznego i magnetycznego w lampie próżniowej. Pomiar stosunku ich ładunku do masy ujawnił istnienie ujemnie naładowanych cząstek subatomowych – elektronów – obalając przekonanie, że atomy są niepodzielne."
 CURIE_EXPERIMENT_MILIKAN_TT: "W [Scope.Var('year').GetValue] roku [Scope.Var('discoverer').GetFlagName] umieścił naelektryzowane kropelki oleju między dwiema metalowymi płytkami. Zrównoważenie siły grawitacji siłą elektryczną dowiodło, że ładunek elektryczny jest skwantowany, czyli występuje w określonych, niepodzielnych porcjach, co pozwoliło dokładnie wyznaczyć ładunek elektronu."
 CURIE_EXPERIMENT_RUTHERFORD_TT: "W [Scope.Var('year').GetValue] roku [Scope.Var('discoverer').GetFlagName] bombardował cienką złotą folię cząstkami alfa. Nieoczekiwane odchylenia cząstek pod dużymi kątami dowiodły, że masa atomu i jego dodatni ładunek elektryczny są skupione w niewielkim jądrze, co doprowadziło do zastąpienia dotychczasowego modelu atomu o równomiernie rozłożonej masie i ładunku."
 CURIE_EXPERIMENT_FRANCK_TT: "W [Scope.Var('year').GetValue] roku [Scope.Var('discoverer').GetFlagName] przepuścił przyspieszone elektrony przez pary rtęci. Okresowe spadki natężenia prądu przy określonych wartościach napięcia dowiodły, że atomy pochłaniają energię w dyskretnych kwantach, potwierdzając model Bohra zakładający istnienie skwantowanych poziomów energetycznych."
 CURIE_EXPERIMENT_EDDINGTON_TT: "W [Scope.Var('year').GetValue] roku [Scope.Var('discoverer').GetFlagName] sfotografował gwiazdy znajdujące się w pobliżu Słońca podczas całkowitego zaćmienia. Zaobserwowane ugięcie światła gwiazd pod wpływem grawitacji dostarczyło pierwszego empirycznego dowodu potwierdzającego ogólną teorię względności."
 CURIE_EXPERIMENT_STERN_TT: "W [Scope.Var('year').GetValue] roku [Scope.Var('discoverer').GetFlagName] skierował wiązkę atomów srebra przez niejednorodne pole magnetyczne. Zamiast utworzyć ciągły rozkład, wiązka rozdzieliła się na dwa wyraźne tory, dowodząc kwantowania przestrzennego i prowadząc do odkrycia spinu jako wewnętrznej właściwości kwantowej cząstek."
