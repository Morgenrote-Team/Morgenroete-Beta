 MR_CIRRUS_CLOUD: "Chmury Cirrus występują w najróżniejszych formach, takich jak pojedyncze kępki (tabl. 35), smugi kreślące linie na błękitnym niebie (tabl. 33), rozgałęzione, pierzaste pióropusze czy zakrzywione pasma zakończone kępkami. Często układają się w pasma przecinające niebo niczym linie południków, które wskutek działania perspektywy zbiegają się w jednym punkcie na horyzoncie lub w dwóch przeciwległych punktach (w tworzeniu tych pasm często uczestniczą również chmury Cirrostratus i Cirrocumulus).\n\nChmury Cirrus zawsze składają się z kryształków lodu, a ich przezroczystość wynika z rozdrobnienia tych kryształków.\nZ reguły chmury te przesuwają się na tle tarczy słonecznej, nie osłabiając jej blasku. Jednak gdy są wyjątkowo gęste, mogą przesłonić światło Słońca i zatrzeć zarys jego tarczy. Podobny efekt mogą wywoływać fragmenty chmur Altostratus, lecz Cirrus wyróżnia się olśniewającą bielą i jedwabistymi krawędziami.\n\n#Italic Z Międzynarodowego Atlasu Chmur, 1930#!"
 MR_CIRROCUMULUS_DESCRIPTION_LOC: "#lore Chmury Cirrocumulus to drobne, puszyste skupiska kryształków lodu występujące na dużych wysokościach, tworzące delikatne wzory na niebie. Wskazują na obecność wiatrów na dużych wysokościach oraz narastającą niestabilność w górnej troposferze.#!"
 MR_CIRROCUMULUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_montgolfier_balloon_researched_type')] [GetTechnology('curtiss_montgolfier_balloon_tech').GetName]"
 MR_CIRROCUMULUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetPlayer.GetCustom('curie_extreme_winds_condition_type')] [GetHarvestConditionType('extreme_winds').GetName]"
 MR_CIRROCUMULUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ #G -10%#! $state_harvest_condition_extreme_winds_impact_mult$"
 MR_CIRROCUMULUS_CLOUD: "Na ogół chmury Cirrocumulus stanowią przekształconą postać chmur Cirrus i Cirrostratus, które mogą się w nie przeobrażać (tabl. 41). W takich przypadkach przekształcające się skupiska chmur często zachowują miejscami część swojej włóknistej struktury.\n\nPrawdziwe chmury Cirrocumulus występują rzadko. Nie należy ich mylić z niewielkimi skupiskami chmur Altocumulus pojawiającymi się na obrzeżach rozległych warstw tych chmur (tabl. 41). W rzeczywistości między chmurami Cirrocumulus a właściwymi chmurami Altocumulus występują wszystkie formy przejściowe, czego należało się spodziewać, ponieważ proces ich powstawania jest taki sam. W przypadku braku innych kryteriów nazwy Cirrocumulus należy używać wyłącznie wtedy, gdy:\n\n1) Istnieje wyraźny związek z chmurami Cirrus lub Cirrostratus (tabl. 41).\n2) Obserwowana chmura powstała w wyniku przekształcenia chmur Cirrus lub Cirrostratus (tabl. 41).\n3) Obserwowana chmura wykazuje niektóre cechy chmur zbudowanych z kryształków lodu, wymienione w opisie chmur Cirrus (s. 3).\n\n#Italic Z Międzynarodowego Atlasu Chmur, 1930#!"
 MR_CIRROSTRATUS_DESCRIPTION_LOC: "#lore Delikatna, mlecznoprzezroczysta zasłona pokrywająca niebo. Jej najbardziej charakterystyczną cechą są zjawiska halo (pierścienie lub łuki świetlne wokół Słońca albo Księżyca), powstające wskutek załamania światła w kryształkach lodu.#!"
 MR_CIRROSTRATUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_montgolfier_balloon_researched_type')] [GetTechnology('curtiss_montgolfier_balloon_tech').GetName]"
 MR_CIRROSTRATUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetPlayer.GetCustom('curie_moderate_rainfall_condition_type')] [GetHarvestConditionType('moderate_rainfall').GetName]"
 MR_CIRROSTRATUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ #G 10%#! $state_harvest_condition_moderate_rainfall_impact_mult$"
 MR_CIRROSTRATUS_CLOUD: "Warstwa chmur Cirrostratus, choć bardzo rozległa i miejscami poprzerywana prześwitami, niemal zawsze ostatecznie pokrywa całe niebo. Jej krawędź może być prosta i wyraźnie zarysowana (tabl. 40), jednak częściej jest postrzępiona lub nieregularna (tabl. 37).\n\nW ciągu dnia, gdy Słońce znajduje się dostatecznie wysoko nad horyzontem, warstwa ta nigdy nie jest na tyle gęsta, aby zatarły się cienie przedmiotów na ziemi.\nMleczną zasłonę mgły można odróżnić od podobnie wyglądającej zasłony chmur Cirrostratus dzięki zjawiskom halo, które Słońce lub Księżyc niemal zawsze wywołują w warstwie tych chmur.\n\nTo, co powiedziano wcześniej o przezroczystości i barwach chmur Cirrus, w dużej mierze odnosi się również do chmur Cirrostratus.\n\n#Italic Z Międzynarodowego Atlasu Chmur, 1930#!"
 MR_ALTOCUMULUS_DESCRIPTION_LOC: "#lore Chmury piętra średniego, tworzące skupiska lub warstwy złożone z drobnych kulek, kłębków lub wałków. Często zapowiadają nadchodzącą zmianę pogody.#!"
 MR_ALTOCUMULUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_reconnaissance_balloon_researched_type')] [GetTechnology('curtiss_reconnaissance_balloon_tech').GetName]"
 MR_ALTOCUMULUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetPlayer.GetCustom('curie_torrential_rains_condition_type')] [GetHarvestConditionType('torrential_rains').GetName]"
 MR_ALTOCUMULUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ #G -10%#! $state_harvest_condition_torrential_rains_impact_mult$"
 MR_ALTOCUMULUS_CLOUD: "Zakres wysokości, na których występują chmury Altocumulus, jest bardzo szeroki. Na największych wysokościach chmury Altocumulus, złożone z drobnych elementów (tabl. 21), przypominają chmury Cirrocumulus. Można je jednak odróżnić od tych ostatnich na podstawie braku następujących cech charakterystycznych dla chmur Cirrocumulus:\n\n1) Związku z chmurami Cirrus lub Cirrostratus.\n2) Powstawania w wyniku przekształcenia chmur Cirrus lub Cirrostratus.\n3) Właściwości wynikających z budowy fizycznej (kryształków lodu), wymienionych w opisie chmur Cirrus.\n\nNa niższych wysokościach, gdzie chmury Altocumulus mogą powstawać wskutek rozprzestrzeniania się górnych części chmur Cumulus (tabl. 25), łatwo pomylić je z chmurami Stratocumulus. Zgodnie z przyjętą zasadą chmurę klasyfikuje się jako Altocumulus, jeśli najmniejsze, wyraźnie zarysowane i regularnie rozmieszczone elementy widoczne w jej warstwie (z pominięciem odosobnionych elementów, które zazwyczaj występują na obrzeżach) mają w swoim najmniejszym wymiarze średnicę nieprzekraczającą dziesięciokrotnej pozornej średnicy tarczy słonecznej.\n\n#Italic Z Międzynarodowego Atlasu Chmur, 1930#!"
 MR_ALTOSTRATUS_DESCRIPTION_LOC: "#lore Altostratus to szarawa lub niebieskawa pokrywa chmur o warstwowej lub włóknistej strukturze, która często równomiernie rozciąga się na całym niebie. Słońce zazwyczaj prześwituje przez nią jedynie słabym blaskiem.#!"
 MR_ALTOSTRATUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_reconnaissance_balloon_researched_type')] [GetTechnology('curtiss_reconnaissance_balloon_tech').GetName]"
 MR_ALTOSTRATUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetPlayer.GetCustom('curie_frost_condition_type')] [GetHarvestConditionType('frost').GetName]"
 MR_ALTOSTRATUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ #G -10%#! $state_harvest_condition_frost_impact_mult$"
 MR_ALTOSTRATUS_CLOUD: "Zakres wysokości, na których można spotkać chmury Altostratus, jest dość szeroki (od około 5000 do 2000 metrów).\nWarstwę wysoko położonych chmur Altostratus można odróżnić od nieco podobnej warstwy chmur Cirrostratus na podstawie przyjętej zasady, zgodnie z którą w przypadku chmur Altostratus nie występują zjawiska halo ani nie są widoczne cienie przedmiotów na ziemi.\n\nWarstwę nisko położonych chmur Altostratus można odróżnić od nieco podobnej warstwy chmur Nimbostratus na podstawie następujących cech: Nimbostratus ma znacznie ciemniejszą i bardziej jednolitą szarą barwę, a nigdzie nie wykazuje białawych prześwitów ani włóknistej struktury. Nie można również wyraźnie dostrzec granicy jego dolnej powierzchni, która ma rozmyty wygląd z powodu opadów deszczu, nie zawsze docierających do ziemi.\n\nPrzyjmuje się również, że chmury Nimbostratus zawsze całkowicie przesłaniają Słońce i Księżyc, podczas gdy chmury Altostratus zasłaniają je jedynie miejscami, za swoimi ciemniejszymi fragmentami. Przez jaśniejsze partie chmur Altostratus Słońce i Księżyc stają się ponownie widoczne (tabl. 18).\n\n#Italic Z Międzynarodowego Atlasu Chmur, 1930#!"
 MR_NIMBOSTRATUS_DESCRIPTION_LOC: "#lore Ciemnoszara, bezkształtna i gruba warstwa chmur, która często znajduje się tak nisko, że całkowicie przesłania Słońce, a jej krawędzie stają się rozmyte.#!"
 MR_NIMBOSTRATUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_early_aviation_researched_type')] [GetTechnology('curtiss_early_aviation_tech').GetName]"
 MR_NIMBOSTRATUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetPlayer.GetCustom('curie_flood_condition_type')] [GetHarvestConditionType('flood').GetName]"
 MR_NIMBOSTRATUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ #G -10%#! $state_harvest_condition_flood_impact_mult$"
 MR_NIMBOSTRATUS_CLOUD: "Zazwyczaj proces przemian przebiega następująco: warstwa chmur Altostratus stopniowo gęstnieje i obniża się, aż przekształca się w warstwę chmur Nimbostratus. Pod nią na ogół zaczynają się stopniowo rozwijać bardzo nisko położone, postrzępione chmury, początkowo odosobnione, a następnie łączące się w niemal ciągłą warstwę, przez której prześwity zazwyczaj nadal można dostrzec chmury Nimbostratus. Te bardzo niskie chmury nazywa się Fractocumulus lub Fractostratus, w zależności od tego, czy ich wygląd bardziej przypomina chmury kłębiaste, czy warstwowe.\n\nNa ogół deszcz zaczyna padać dopiero po utworzeniu się tych bardzo niskich chmur, które następnie zostają przesłonięte przez opady lub mogą nawet pod ich wpływem całkowicie zaniknąć. Widzialność w pionie staje się wówczas bardzo ograniczona.\n\n#Italic Z Międzynarodowego Atlasu Chmur, 1930#!"
 MR_STRATOCUMULUS_DESCRIPTION_LOC: "#lore Szare lub białawe, często wyraźnie niejednolite skupiska chmur w postaci kłębków lub wałków, które zazwyczaj pokrywają niemal całe niebo zwartymi warstwami, choć mogą występować między nimi prześwity.#!"
 MR_STRATOCUMULUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_meteorology_researched_type')] [GetTechnology('curtiss_meteorology_tech').GetName]"
 MR_STRATOCUMULUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ Brak"
 MR_STRATOCUMULUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ Brak"
 MR_STRATOCUMULUS_CLOUD: "Elementy gęstych chmur Stratocumulus (Stratocumulus opacus) często mają tendencję do całkowitego łączenia się, a powstała warstwa może w pewnych przypadkach przekształcić się w chmury Nimbostratus. Chmurę określa się mianem Nimbostratus, gdy poszczególne elementy chmur Stratocumulus całkowicie zanikną, a wskutek smug opadających opadów atmosferycznych dolna powierzchnia chmury utraci wyraźnie zarysowaną granicę.\n\nChmury Stratocumulus mogą przekształcać się w chmury Stratus (tabl. 10) i odwrotnie. Ponieważ chmury Stratus znajdują się niżej, ich elementy wydają się bardzo duże i mają rozmyte kontury, przez co regularna struktura kulistych skupisk i fal zanika z punktu widzenia obserwatora. Chmurę określa się mianem Stratocumulus tak długo, jak długo struktura ta pozostaje widoczna (tabl. 10).\n\n#Italic Z Międzynarodowego Atlasu Chmur, 1930#!"
 MR_STRATUS_DESCRIPTION_LOC: "#lore Jednolita, szara, nisko wisząca warstwa chmur, która często przypomina unoszącą się mgłę i całkowicie zasnuwa niebo. Chmury Stratus przynoszą słabą mżawkę, szczególnie jesienią i zimą.#!"
 MR_STRATUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_montgolfier_balloon_researched_type')] [GetTechnology('curtiss_montgolfier_balloon_tech').GetName]"
 MR_STRATUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ Brak"
 MR_STRATUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ Brak"
 MR_STRATUS_CLOUD: "Zasłona utworzona z właściwych chmur Stratus nadaje niebu charakterystyczny zamglony wygląd, który jednak w pewnych przypadkach może prowadzić do pomylenia ich z chmurami Nimbostratus. Gdy występują opady atmosferyczne, różnica jest wyraźna: chmury Nimbostratus przynoszą ciągły deszcz (czasami śnieg), składający się z kropli, które mogą być małe i nieliczne albo duże (przynajmniej niektóre z nich) i gęsto rozmieszczone. Natomiast chmury Stratus powodują jedynie mżawkę, czyli opad bardzo drobnych, gęsto rozmieszczonych kropelek wody.\n\nGdy nie występują opady, ciemną i jednolitą warstwę chmur Stratus można łatwo pomylić z chmurami Nimbostratus. Dolna powierzchnia chmur Nimbostratus ma jednak zawsze rozmyty wygląd (z powodu rozległych smug opadów niedocierających do ziemi, zwanych „virga”). Jest ona całkowicie jednolita i nie można dostrzec na niej żadnych wyraźnych szczegółów. Chmury Stratus mają natomiast bardziej „suchy” wygląd i nawet gdy tworzą jednolitą warstwę, można zauważyć w niej pewne kontrasty oraz jaśniejsze, bardziej przezroczyste fragmenty. Są to miejsca, w których chmura jest cieńsza i mniej ciemna, odpowiadające prześwitom między wałkami i kulistymi skupiskami chmur Stratocumulus, lecz znacznie od nich większe. Chmury Nimbostratus sprawiają natomiast wrażenie jedynie słabo oświetlonych, jak gdyby światło przenikało je od wewnątrz.\n\n#Italic Z Międzynarodowego Atlasu Chmur, 1930#!"
 MR_CUMULUS_DESCRIPTION_LOC: "#lore Wyraźnie zarysowane, gęste chmury kłębiaste o płaskich podstawach i kopulastych, przypominających kalafior wierzchołkach, które lśnią bielą na tle nieba. Są klasyczną oznaką dobrej pogody.#!"
 MR_CUMULUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_montgolfier_balloon_researched_type')] [GetTechnology('curtiss_montgolfier_balloon_tech').GetName]"
 MR_CUMULUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetPlayer.GetCustom('curie_optimal_sunlight_condition_type')] [GetHarvestConditionType('optimal_sunlight').GetName]"
 MR_CUMULUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ #G 10%#! $state_harvest_condition_optimal_sunlight_impact_mult$"
 MR_CUMULUS_CLOUD: "Typowe chmury Cumulus (tabl. 1) rozwijają się w dni z pogodnym niebem i powstają wskutek dziennych prądów konwekcyjnych. Pojawiają się rano, stopniowo rozrastają, a następnie pod wieczór w mniejszym lub większym stopniu zanikają.\nChmury Cumulus, których podstawy są zazwyczaj szare, mają jednolitą budowę, co oznacza, że składają się z zaokrąglonych form sięgających aż po ich wierzchołki, bez jakiejkolwiek struktury włóknistej (tabl. 2). Nawet silnie rozwinięte chmury Cumulus mogą przynosić jedynie słabe opady.\n\nGdy chmury Cumulus osiągają wysokość występowania chmur Altocumulus, niekiedy nad ich wierzchołkami pojawia się delikatna, rozmyta, biała zasłona o mniej lub bardziej soczewkowatym kształcie, z subtelną, prążkowaną lub łuskowatą strukturą na krawędziach. Zazwyczaj przybiera ona kształt łuku, który może przykrywać kilka kopulastych wierzchołków chmur Cumulus, aż w końcu zostaje przez nie przebity (tabl. 2).\n\n#Italic Z Międzynarodowego Atlasu Chmur, 1930#!"
 MR_CUMULONIMBUS_DESCRIPTION_LOC: "#lore Potężne chmury kłębiaste, które wznoszą się na ogromne wysokości (aż do tropopauzy), przypominając wieże lub góry. Ich górne części często przybierają włóknisty wygląd lub przypominają lodową czapę (capillatus).#!"
 MR_CUMULONIMBUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_early_aviation_researched_type')] [GetTechnology('curtiss_early_aviation_tech').GetName]"
 MR_CUMULONIMBUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetPlayer.GetCustom('curie_hailstorm_condition_type')] [GetHarvestConditionType('hailstorm').GetName]"
 MR_CUMULONIMBUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ #G -10%#! $state_harvest_condition_hailstorm_impact_mult$"
 MR_CUMULONIMBUS_CLOUD: "Nawet jeśli chmura Cumulonimbus nie różni się kształtem od silnie rozwiniętej chmury Cumulus, jej zasadniczą cechę wyróżniającą można dostrzec w odmiennej strukturze górnych części, o ile są one widoczne (struktura włóknista w przeciwieństwie do struktury kłębiastej). Chmur Cumulus, niezależnie od tego, jak są gęste i jak znaczna jest ich rozbudowa pionowa, nigdy nie należy klasyfikować jako Cumulonimbus, dopóki ich wierzchołki nie przekształcą się w całości lub częściowo (tabl. 5) albo nie zaczną się przekształcać (tabl. 4) w masę chmur Cirrus.\n\nChociaż górne części chmur Cumulonimbus, przypominające chmury Cirrus, mogą przybierać bardzo różnorodne kształty, w niektórych przypadkach rozpościerają się na kształt kowadła (tabl. 5). Tej interesującej odmianie nadano nazwę #Italic incus#!.\n\n#Italic Z Międzynarodowego Atlasu Chmur, 1930#!"
 MR_NOCTILUCENT_DESCRIPTION_LOC: "#lore Delikatne, włókniste zasłony, faliste wzory lub pasma na nocnym niebie, często świecące w odcieniach od srebrzystobiałego po intensywny błękit. Stają się widoczne, gdy Słońce znajduje się już głęboko poniżej horyzontu.#!"
 MR_NOCTILUCENT_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_high_altitude_balloon_researched_type')] [GetTechnology('curtiss_high_altitude_balloon_tech').GetName]"
 MR_NOCTILUCENT_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetGeographicRegion('curie_geographic_region_noctilucent').GetName]."
 MR_NOCTILUCENT_BONUS_LOC: "Brak"
 MR_NOCTILUCENT_CLOUD: "Obłoki srebrzyste (NLC) przypominają cienkie chmury Cirrus, lecz zazwyczaj mają niebieskawe lub srebrzyste zabarwienie, a niekiedy przybierają odcienie od pomarańczowego do czerwonego. Wyraźnie odcinają się na tle ciemnego nocnego nieba (s. 239).\n\nFizyczna natura obłoków srebrzystych pozostaje nadal nieznana, jednak istnieją pewne przesłanki wskazujące, że składają się one z bardzo drobnego pyłu kosmicznego.\n\nŚwiecące obłoki srebrzyste obserwowano dotychczas jedynie sporadycznie, i to wyłącznie latem w północnych obszarach średnich szerokości geograficznych półkuli północnej, gdy Słońce znajduje się od 5 do 13 stopni poniżej horyzontu. Pomiary wykazały, że występują one na wysokości od 75 do 90 km.\n\n#Italic Z Międzynarodowego Atlasu Chmur, 1990#!"
 MR_NACREOUS_DESCRIPTION_LOC: "#lore Zapierające dech w piersiach, opalizujące chmury o soczewkowatych lub falistych kształtach, mieniące się olśniewającymi barwami tęczy (szczególnie różem, purpurą, błękitem i zielenią) tuż przed wschodem lub po zachodzie Słońca.#!"
 MR_NACREOUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_high_altitude_balloon_researched_type')] [GetTechnology('curtiss_high_altitude_balloon_tech').GetName]"
 MR_NACREOUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ Region Polarny."
 MR_NACREOUS_BONUS_LOC: "Brak"
 MR_NACREOUS_CLOUD: "Chmury perłowe (polarne chmury stratosferyczne, PSC) przypominają chmury Cirrus lub soczewkowate chmury Altocumulus (s. 237). Podobnie jak masa perłowa wykazują bardzo wyraźną iryzację. Najpiękniejsze barwy można zaobserwować, gdy Słońce znajduje się kilka stopni poniżej horyzontu.\n\nFizyczna natura chmur perłowych pozostaje nadal nieznana. Przypuszcza się, że chmury te składają się z bardzo drobnych kropelek wody lub kulistych cząstek lodu.\n\nChmury te występują rzadko. Dotychczas obserwowano je głównie w Szkocji i Skandynawii. Pomiary wykazały, że chmury perłowe obserwowane nad południową Norwegią występowały na wysokościach od 21 do 30 kilometrów.\n\n#Italic Z Międzynarodowego Atlasu Chmur, 1990#!"
