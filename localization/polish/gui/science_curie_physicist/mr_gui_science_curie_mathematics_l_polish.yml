 MR_AUTOMATE_PHYSICIST_TT: "#T Automatyzuj [concept_curie_physicist]#!\nPo włączeniu automatyzacji nie będziesz już musiał przydzielać zadań swojemu Fizykowi.\nBędzie on działał samodzielnie i wykonywał zadania odpowiednie do bieżącej sytuacji. Nadal jednak będziesz otrzymywać niektóre wydarzenia.\n\n#n Pamiętaj, że automatyzacja będzie prawdopodobnie mniej efektywna niż samodzielne kierowanie Fizykiem.#!"
