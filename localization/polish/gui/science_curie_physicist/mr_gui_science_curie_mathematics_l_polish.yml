 MR_MAGNETIC_PROGRESS_TOOLTIP: "Każdy członek Towarzystwa Magnetycznego przesyła dane do jego siedziby głównej. Wszyscy członkowie otrzymują premię po zapełnieniu paska postępu. Im więcej państw dołączy do Towarzystwa, tym więcej danych będzie przesyłanych. Po pomyślnym ukończeniu każdego projektu geomagnetycznego możesz wybrać premię. Ilość danych magnetycznych wymagana do uzyskania kolejnej premii wzrasta za każdym razem."
