 MR_PHYSICIST_MATHEMATICAL_INNOVATION_BUTTON: "Innowacje Matematyczne"
 MR_PHYSICIST_MATHEMATICAL_INNOVATION_BUTTON_TT: "#T Innowacje Matematyczne#!\nTen projekt jest dostępny, gdy [concept_curie_mathematical_physicist] nie jest zajęty innym zadaniem.\n\nTwój [concept_curie_physicist] pomaga zwiększyć tygodniowy limit innowacji i zmniejsza karę za badanie technologii wyprzedzających swoją epokę.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_FORMULA_DISCOVERY_BUTTON: "Nowy Wzór"
 MR_PHYSICIST_FORMULA_DISCOVERY_BUTTON_TT: "#T Nowy Wzór#!\nMatematycy mogą wyprowadzać nowe wzory, pod warunkiem że dostępna jest odpowiednia technologia i nadal istnieją niezbadane wzory. Z każdym nowo odkrytym wzorem wzrasta ilość danych fizycznych wymaganych do przeprowadzenia kolejnych badań.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_IMPROVE_MATHEMATICS_BUTTON: "Ulepsz Matematykę"
 MR_PHYSICIST_IMPROVE_MATHEMATICS_BUTTON_TT: "#T Ulepsz Matematykę#!\nMatematyk może odwiedzić [GetBuildingType('building_university').GetName], aby poprzez wykłady i seminaria upowszechniać nowe standardy naukowe.\n\nModyfikatory, które otrzyma budynek:\n$curie_building_throughput_add_modifier_with_tooltip$\n$curie_building_production_mult_modifier_with_tooltip$\n$curie_building_goods_input_mult_modifier_with_tooltip$\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_EXPERIMENT_BUTTON: "Eksperyment Fizyczny"
 MR_PHYSICIST_EXPERIMENT_BUTTON_TT: "#T Eksperyment Fizyczny#!\nFizyk może przeprowadzić eksperyment, który w przypadku powodzenia może mieć historyczne znaczenie. Taką możliwość ma każdy Fizyk, niezależnie od specjalizacji.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_EXPERIMENT_POSSIBLE_TRIGGER_TT: "#default_text [GetPlayer.GetName] #R nie#! posiada [concept_modifier] #V $curie_physics_experiment_successful_modifier$#! ani #V $curie_physics_experiment_failure_modifier$#!."
 MR_PHYSICIST_METEOROLOGICAL_OBSERVATION_BUTTON: "Obserwacja Meteorologiczna"
 MR_PHYSICIST_METEOROLOGICAL_OBSERVATION_BUTTON_TT: "#T Obserwacja Meteorologiczna#!\nTen projekt jest dostępny, gdy [concept_curie_meteorological_physicist] nie jest zajęty innym zadaniem.\n\nTwój [concept_curie_physicist] pomaga zwiększyć coroczny przyrost @curie_physical_data!#! [concept_curie_physical_data].\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_WEATHER_STATION_EXPANSION_BUTTON: "Rozb. Stacji Meteorologicznej"
 MR_PHYSICIST_WEATHER_STATION_EXPANSION_BUTTON_TT: "#T Rozbudowa Stacji Meteorologicznej#!\nPod warunkiem posiadania obserwatorium i odpowiedniej technologii [concept_curie_meteorological_physicist] może rozbudować znajdującą się tam stację meteorologiczną, aby poprawić prognozowanie pogody dla całego kraju oraz skuteczniej radzić sobie z niebezpiecznymi zjawiskami pogodowymi dzięki odpowiednio wczesnym ostrzeżeniom.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 PHYSICIST_HAS_NO_WEATHER_STATION_PM_TT: "#default_text [GetPlayer.GetName] posiada [GetBuildingType('building_verrier_observatory').GetName] z metodą produkcji #V $pm_curtiss_no_weather_station$#! [concept_production_method]."
 PHYSICIST_HAS_EARLY_WEATHER_STATION_PM_TT: "#default_text [GetPlayer.GetName] posiada [GetBuildingType('building_verrier_observatory').GetName] z metodą produkcji #V $pm_curtiss_early_weather_station$#! [concept_production_method]."
 PHYSICIST_HAS_WEATHER_STATION_PM_TT: "#default_text [GetPlayer.GetName] posiada [GetBuildingType('building_verrier_observatory').GetName] z metodą produkcji #V $pm_curtiss_weather_station$#! [concept_production_method]."
 MR_PHYSICIST_IMPROVE_METEOROLOGY_BUTTON: "Sieć Stacji Meteorologicznych"
 MR_PHYSICIST_IMPROVE_METEOROLOGY_BUTTON_TT: "#T Sieć Stacji Meteorologicznych#!\nWraz z rozwojem telegrafu meteorologia zyskała ogromne możliwości: dane pogodowe ze wszystkich części kraju można przesyłać i porównywać w mgnieniu oka, co umożliwia opracowywanie prognoz i wydawanie ostrzeżeń. [concept_curie_meteorological_physicist] może utworzyć sieć stacji meteorologicznych w stanie, w którym znajduje się [GetBuildingType('building_tesla_telegraph').GetName], aby skuteczniej radzić sobie z różnorodnymi zjawiskami pogodowymi.\n\nModyfikatory, które otrzyma budynek:\n$curie_building_throughput_add_modifier_with_tooltip$\n$curie_building_production_mult_modifier_with_tooltip$\n$curie_building_goods_input_mult_modifier_with_tooltip$\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_IMPROVE_METEOROLOGY_TRIGGER_TT: "#default_text Co najmniej jeden budynek [GetBuildingType('building_tesla_telegraph').GetName] na poziomie 1 lub wyższym nie posiada wszystkich trzech [Concept('concept_modifier','$concept_modifiers|q$')].#!"
 MR_PHYSICIST_AGRICULTURAL_WEATHER_SERVICE_BUTTON: "Rolnicza Służba Meteo."
 MR_PHYSICIST_AGRICULTURAL_WEATHER_SERVICE_BUTTON_TT: "#T Rolnicza Służba Meteorologiczna#!\n[concept_curie_meteorological_physicist] może skupić się wyłącznie na prognozowaniu pogody dla rolnictwa i przez trzy lata prowadzić służbę meteorologiczną dla rolników, ostrzegając ich przed niebezpiecznymi zjawiskami pogodowymi. Im bardziej doświadczony meteorolog, tym lepsze będą rezultaty.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_ADVANCED_WEATHER_STATION_TRIGGER_TT: "#default_text [GetPlayer.GetName] posiada [GetBuildingType('building_verrier_observatory').GetName] z metodą produkcji [concept_production_method] #V $pm_curtiss_weather_station$#! lub $pm_curtiss_modern_weather_station$. "
 MR_PHYSICIST_50_OR_MORE_EXPERIENCE_TRIGGER_TT: "#default_text [concept_curie_meteorological_physicist] posiada #V 50 lub więcej#! [concept_academics_experience].#!"
 MR_PHYSICIST_MARINE_WEATHER_SERVICE_BUTTON: "Prognoza Pogody dla Żeglugi"
 MR_PHYSICIST_MARINE_WEATHER_SERVICE_BUTTON_TT: "#T Prognoza Pogody dla Żeglugi#!\n[concept_curie_meteorological_physicist] może skupić się wyłącznie na prognozowaniu pogody dla marynarki wojennej, aby ostrzegać ją przed zagrożeniami na morzu. Projekt potrwa trzy lata. Im bardziej doświadczony meteorolog, tym lepsze będą rezultaty.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_5_FLOTILLAS_TRIGGER_TT: "#default_text [GetPlayer.GetName] posiada #V 5 lub więcej Statków#!.#!"
 MR_PHYSICIST_FOUND_MAGNETIC_ASSOCIATION_BUTTON: "Towarzystwo Magnetyczne"
 MR_PHYSICIST_FOUND_MAGNETIC_ASSOCIATION_BUTTON_TT: "#T Załóż Towarzystwo Magnetyczne#!\nMiędzynarodowe Towarzystwo Magnetyczne zajmujące się badaniem magnetyzmu Ziemi oferuje przede wszystkim swojemu założycielowi szereg korzyści związanych z gromadzeniem danych fizycznych, a także niewielką premię technologiczną. Odblokowuje również Obserwatorium Geomagnetyczne jako metodę produkcji.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_MAGNETIC_RESEARCH_STATION_BUTTON: "Obserwatorium Geomagnetyczne"
 MR_PHYSICIST_MAGNETIC_RESEARCH_STATION_BUTTON_TT: "#T Zbuduj Obserwatorium Geomagnetyczne#!\nMożemy rozbudować nasze obserwatorium o Obserwatorium Geomagnetyczne, aby dokładniej badać pole magnetyczne Ziemi. W tym celu musimy dołączyć do Towarzystwa Magnetycznego.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_NO_MAGNETIC_OBSERVATORY_TRIGGER_TT: "#default_text [GetPlayer.GetName] posiada [GetBuildingType('building_verrier_observatory').GetName] z metodą produkcji [concept_production_method] #V Brak Obserwatorium Geomagnetycznego#!."
 MAGNETIC_ASSOCIATION_TRIGGER_TT: "#default_text Towarzystwo Magnetyczne zostało założone.#!"
 MR_NO_MAGNETIC_ASSOCIATION_TRIGGER_TT: "#default_text Towarzystwo Magnetyczne #R nie#! zostało jeszcze założone."
 MR_PHYSICIST_MAGNETIC_ATLAS_BUTTON: "Atlas Geomagnetyczny"
 MR_PHYSICIST_MAGNETIC_ATLAS_BUTTON_TT: "#T Stwórz Atlas Geomagnetyczny#!\nWykorzystując nasze obszerne dane geomagnetyczne, Fizyk mógłby opracować własny atlas geomagnetyczny. Takie dzieło znacznie pogłębiłoby naszą wiedzę z zakresu fizyki.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_MAGNETIC_OBSERVATORY_TRIGGER_TT: "#default_text [GetPlayer.GetName] posiada [GetBuildingType('building_verrier_observatory').GetName] z metodą produkcji [concept_production_method] #V Obserwatorium Geomagnetyczne#!."
