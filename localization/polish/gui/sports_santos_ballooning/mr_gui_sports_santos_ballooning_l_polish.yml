 santos_time_bonus_fuel_helium_inactive_tt_loc: "\n#default_text 8 Godzin za Hel.#!"
 MR_RIP_PANEL: "#underline #T Klapa Rozrywna#!#!: [GetPlayer.GetCustom('santos_logistics_researched_type')] [GetTechnology('logistics').GetName]"
 MR_RIP_PANEL_TT: "#header Klapa Rozrywna#!\nKlapa rozrywna to odrywana część powłoki balonu. Przy lądowaniu pilot otwiera ją pociągnięciem, by szybko wypuścić gaz nośny i zapobiec wleczeniu się balonu po ziemi.\n\nPremia do Wysokości: #p +500 Metrów#!\n[concept_santos_stratospheric_flight]: #p Mniejsze prawdopodobieństwo#! Powolnego Wznoszenia"
 MR_BAGS_OF_FINE_SAND: "#underline #T Worki z Drobnym Piaskiem#!#!: [GetPlayer.GetCustom('santos_military_statistics_researched_type')] [GetTechnology('military_statistics').GetName]"
 MR_BAGS_OF_FINE_SAND_TT: "#header Worki z Drobnym Piaskiem#!\nDzięki dokładniejszemu ważeniu ładunku i zastosowaniu drobniejszego piasku jako balastu można precyzyjniej regulować tempo wznoszenia się balonu.\n\nPremia do Wysokości: #p +500 Metrów#!\n[concept_santos_stratospheric_flight]: #p Mniejsze prawdopodobieństwo#! Powolnego Wznoszenia"
 MR_OXYGEN_CYLINDERS: "#underline #T Butle Tlenowe#!#!: [GetPlayer.GetCustom('santos_electric_arc_process_researched_type')] [GetTechnology('electric_arc_process').GetName]"
 MR_OXYGEN_CYLINDERS_TT: "#header Butle Tlenowe#!\nNowe techniki lutowania pozwoliły udoskonalić metody przechowywania gazów. Jednym z wynalazków, które dzięki temu powstały, była butla tlenowa. Z jej pomocą baloniarze mogli sięgać nieosiągalnych dotąd wysokości, nawet takich, na których wcześniej czekała ich pewna śmierć.\n\nPremia do Wysokości: #p +500 Metrów#!\n[concept_santos_balloon_record]: Chroni #p przed chorobą wysokościową#!"
 MR_TRAIL_ROPE: "#underline #T Lina Wleczona#!#!: [GetPlayer.GetCustom('santos_mechanical_tools_researched_type')] [GetTechnology('mechanical_tools').GetName]"
 MR_TRAIL_ROPE_TT: "#header Lina Wleczona#!\nLina wleczona, zwana też liną prowadzącą, to długa, ciężka lina podwieszona pod balonem. Jej koniec ciągnie się po ziemi, dzięki czemu lina samoczynnie reguluje wysokość lotu. Gdy balon opada, coraz dłuższy odcinek liny spoczywa na ziemi, więc obciążenie balonu maleje. Gdy balon się wznosi, unosi coraz większą część liny, a jego obciążenie rośnie. Lina spowalnia też balon przed lądowaniem.\n\nPremia do Zasięgu: #p +200 Kilometrów#!\n[concept_santos_stratospheric_flight]: #p Mniejsze prawdopodobieństwo#! Powolnego Wznoszenia"
 MR_CANNED_FOOD: "#underline #T Konserwy#!#!: [GetPlayer.GetCustom('santos_canneries_researched_type')] [GetTechnology('canneries').GetName]"
 MR_CANNED_FOOD_TT: "#header Konserwy#!\nOdpowiedni zapas prowiantu pozwala baloniarzowi dłużej pozostawać w powietrzu. Konserwy zajmują przy tym niewiele miejsca w koszu balonu, a puszki można wygodnie układać jedną na drugiej.\n\nPremia do Zasięgu: #p +200 Kilometrów#!\n[concept_santos_stratospheric_flight]: #p Mniejsze prawdopodobieństwo#! Powolnego Wznoszenia"
 MR_RUBBERIZED_FABRICS: "#underline #T Tkaniny Gumowane#!#!: [GetPlayer.GetCustom('santos_rubber_mastication_researched_type')] [GetTechnology('rubber_mastication').GetName]"
 MR_RUBBERIZED_FABRICS_TT: "#header Tkaniny Gumowane#!\nW XIX wieku w baloniarstwie powszechnie stosowano tkaniny gumowane, które zwiększały szczelność powłoki balonu.\n\nPremia do Czasu Lotu: #p +5 Godzin#!"
 MR_VULCANIZED_COTTON: "#underline #T Wulkanizowana Bawełna#!#!: [GetPlayer.GetCustom('santos_vulcanization_researched_type')] [GetTechnology('vulcanization').GetName]"
 MR_VULCANIZED_COTTON_TT: "#header Wulkanizowana Bawełna#!\nDzięki zastosowaniu wulkanizowanej tkaniny bawełnianej baloniarze i inżynierowie mogli budować balony o większej objętości i szczelniejszej powłoce.\n\nPremia do Czasu Lotu: #p +5 Godzin#!"
 MR_VULCANIZED_SILK: "#underline #T Wulkanizowany Jedwab#!#!: [GetPlayer.GetCustom('santos_art_silk_researched_type')] [GetTechnology('art_silk').GetName]"
 MR_VULCANIZED_SILK_TT: "#header Wulkanizowany Jedwab#!\nWulkanizowany jedwab należał do najlepszych tkanin na powłoki balonów przeznaczonych do dalekich lotów. Przez długi czas uchodził w baloniarstwie za materiał bezkonkurencyjny.\n\nPremia do Czasu Lotu: #p +5 Godzin#!\n[concept_santos_stratospheric_flight]: #p Mniejsze prawdopodobieństwo#! Powolnego Wznoszenia"
 MR_REINFORCED_MATERIAL: "#underline #T Nowoczesny Materiał#!#!: [GetPlayer.GetCustom('santos_reinforced_material_researched_type')] [GetTechnology('art_silk').GetName]&[GetTechnology('vulcanization').GetName]"
 MR_REINFORCED_MATERIAL_TT: "#header Nowoczesny Materiał#!\nGdy balony zaczęły docierać do stratosfery, materiały stosowane do wyrobu ich powłok osiągnęły granice wytrzymałości. Dotychczasowe metody budowy pozwalały wprawdzie osiągać takie wysokości, ale dopiero odkrycie polietylenu sprawiło, że loty te stały się bezpieczne.\n[concept_santos_balloon_record]: Użycie wodoru lub helu jako gazu nośnego pozwoli #p znacznie poprawić#! rekordy odległości\n\n[concept_santos_stratospheric_flight]: Chroni #p przed Zmęczeniem Materiału#!"
 MR_SUN_PROTECTION: "#underline #T Ochrona przed Słońcem#!#!: [GetPlayer.GetCustom('santos_sun_protection_researched_type')] [GetTechnology('zeppelins').GetName]&[GetTechnology('curie_rocket_science_tech').GetName]"
 MR_SUN_PROTECTION_TT: "#header Ochrona przed Słońcem#!\nZ czasem fizycy, inżynierowie i baloniarze odkryli, że odpowiedni dobór farby i materiału na powłokę balonu stratosferycznego ma kluczowe znaczenie dla zapobiegania niebezpiecznemu przegrzewaniu się balonu.\n\n[concept_santos_stratospheric_flight]: Chroni #p przed Gromadzeniem się Ciepła#!"
 MR_BALLOONIST_HAS_HYDROGEN_OR_HELIUM_BALLOON_TRIGGER_TT: "#default_text [GetPlayer.GetName] ma [concept_santos_balloon] wypełniony #BLUE Wodorem#! lub #V Helem#!#!"