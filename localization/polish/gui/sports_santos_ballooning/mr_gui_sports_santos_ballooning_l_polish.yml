 MR_BALLOONIST_BALLOON_RIDE_BUTTON: "Lot Balonem"
 MR_BALLOONIST_BALLOON_RIDE_BUTTON_TT: "#T Lot Balonem#!\nLot balonem organizowany jako atrakcja dla publiczności to najbezpieczniejsze, ale zarazem nieco nudne, domyślne działanie [concept_santos_balloonist]. Może zwiększyć atrakcyjność niektórych budynków dzięki pokazom balonowym oraz zapewnić niewielką premię do badań nad technologiami baloniarskimi.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_BALLOON_ADVENTURE_BUTTON: "Wyprawa Balonowa"
 MR_BALLOONIST_BALLOON_ADVENTURE_BUTTON_TT: "#T Balonowa Przygoda#!\n[concept_santos_balloonist] może wyruszyć na przygodę poza granice naszego kraju. Przez wiele miesięcy będzie przemierzał liczne państwa i być może przywiezie ze sobą jedną lub dwie pamiątki. Istnieje niewielkie ryzyko, że zginie podczas podróży.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_BALLOON_RECORD_BUTTON: "Rekord Balonowy"
 MR_BALLOONIST_BALLOON_RECORD_BUTTON_TT: "#T Rekord Balonowy#!\n[concept_santos_balloonist] może ustanawiać rekordy wysokości, dystansu i czasu lotu, pod warunkiem że dysponuje środkami pozwalającymi mu pobić dotychczasowe rekordy świata. Istnieje umiarkowane ryzyko, że zginie podczas próby ustanowienia rekordu.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_BALLOON_CROSSING_BUTTON: "Przelot Balonem"
 MR_BALLOONIST_BALLOON_CROSSING_BUTTON_TT: "#T Przelot Balonem#!\n[concept_santos_balloonist] może przelatywać nad niebezpiecznymi cieśninami lub pasmami górskimi. Taki wyczyn jest uważany za największe wyzwanie dla każdego poszukiwacza przygód. Istnieje znaczne ryzyko, że zginie podczas próby przelotu.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_FIRE_BALLOONIST_TRIGGER_TT: "#default_text [GetPlayer.GetName] #R nie#! posiada [concept_modifier] #V $santos_balloon_contract_modifier$#!."
 SANTOS_CROSSING_ITEM_TOOLTIP: "[Scope.Var('tooltip').GetFlagName]"
 SANTOS_CROSSING_ACHIEVED_MARK: "@green_checkmark!"
 SANTOS_CROSSING_CHANNEL_TT: "Kanał La Manche stanowi klasyczną krótką trasę przelotu nad morzem, liczącą około 35–50 kilometrów. Główne zagrożenia to nieprzewidywalne wiatry przybrzeżne i nagłe znoszenie balonu w kierunku otwartego Atlantyku. Mimo to od czasów Blancharda i Greena pozostaje sprawdzonym miejscem prób dla pionierów baloniarstwa."
 SANTOS_CROSSING_ALPS_TT: "Alpy stanowią niezwykle trudną przeszkodę na dużych wysokościach. Przelot nad nimi wymaga osiągnięcia pułapu operacyjnego od 5500 do 6000 metrów, co wiąże się z poważnym ryzykiem niedotlenienia, oraz zasięgu lotu od 400 do 600 kilometrów. Szczególne niebezpieczeństwo stwarzają gwałtowne fale zawietrzne i prądy zstępujące, które mogą zepchnąć balon na niemal pionowe ściany skalne. Zagrożenia te po raz pierwszy pokonał Francisque Arban w 1849 roku."
 SANTOS_CROSSING_SKAGERRAK_TT: "Przelot nad tą cieśniną między Danią a Półwyspem Skandynawskim obejmuje od 80 do 130 kilometrów nad otwartym morzem i wymaga utrzymania wysokości przelotowej 2000 metrów oraz zapasu zasięgu wynoszącego 400 kilometrów. Baloniarze muszą zmagać się z gwałtownie nadciągającymi sztormami znad Morza Północnego, dotkliwym zimnem i niegościnnymi wybrzeżami, co wymaga szczelnych powłok balonowych oraz precyzyjnego nawigowania z uwzględnieniem kierunku i siły wiatru."
 SANTOS_CROSSING_MEDITERRANEAN_TT: "Ten rozległy basen morski, na którym znajdują się górzyste wyspy, takie jak Korsyka i Sycylia, wymaga utrzymania wysokości przelotowej 4000 metrów, aby bezpiecznie pokonać wyspiarskie szczyty, oraz zasięgu lotu wynoszącego 700 kilometrów. Intensywne promieniowanie słoneczne w strefie podzwrotnikowej powoduje znaczne rozszerzanie się gazu, a niemożność zastosowania liny wleczonej nad wodą wymaga niezwykle starannego zarządzania balastem."
 SANTOS_CROSSING_RIO_TT: "Przelot nad tym rozległym estuarium między Argentyną a Urugwajem, obejmującym do 220 kilometrów otwartych wód, wymaga utrzymania wysokości przelotowej 2000 metrów oraz zasięgu lotu wynoszącego 300 kilometrów. Główne zagrożenia stanowią nagłe szkwały, znane lokalnie jako pamperos, oraz silne turbulencje termiczne nad wodą."
 SANTOS_CROSSING_PYRENEES_TT: "Pireneje, stanowiące górską barierę między Francją a Hiszpanią, wymagają osiągnięcia minimalnej wysokości przelotowej 5000 metrów oraz zasięgu lotu wynoszącego 500 kilometrów. Silne prądy zstępujące po zawietrznej stronie szczytów przekraczających 3000 metrów sprawiają, że konieczne jest zachowanie znacznego zapasu wysokości, aby zapobiec katastrofalnemu opadaniu balonu."
 SANTOS_CROSSING_ANDES_TT: "Andy, stanowiące największą przeszkodę w żegludze balonowej, wymagają osiągnięcia niezwykłej wysokości 8000 metrów oraz zasięgu lotu wynoszącego 800 kilometrów. Baloniarze muszą zmagać się ze śmiertelnie niebezpiecznym niedoborem tlenu przy braku sprzętu ciśnieniowego, a także z przenikliwym zimnem i wiatrami górskimi o sile sztormu."
 SANTOS_CROSSING_KOREA_TT: "Ta przeprawa, łącząca Koreę z Japonią przez 180–200 kilometrów morza, wymaga osiągnięcia wysokości 2500 metrów oraz zapasu zasięgu wynoszącego 250 kilometrów. Wyspy leżące po drodze, takie jak Cuszima, ułatwiają orientację w terenie, jednak głównymi zagrożeniami pozostają zmienne wiatry monsunowe oraz ryzyko zniesienia balonu na otwarty Pacyfik."
 SANTOS_CROSSING_BAB_TT: "Ta południowa cieśnina Morza Czerwonego obejmuje od 30 do 40 kilometrów otwartych wód, jednak wymaga osiągnięcia wysokości 4000 metrów, aby bezpiecznie pokonać otaczające ją nadbrzeżne pasma górskie, oraz zapasu zasięgu wynoszącego 400 kilometrów. Ekstremalne tropikalne upały poważnie destabilizują gaz w powłoce balonu, a dodatkowe zagrożenia stanowią gwałtowne prądy termiczne znad pustyni oraz nieprzewidywalne wiatry opadające."
 SANTOS_KOREA_CROSSING_TT: "#default_text Przelot nad #V Cieśniną Koreańską#! jest uważany za #G łatwy#!.\n\n$santos_balloon_crossing_korea_possible_trigger_tt$#!"
