 santos_distance_bonus_fuel_helium_inactive_tt_loc: "\n#default_text 150 Kilometrów za Hel.#!"
 santos_distance_bonus_fuel_helium_improved_tt_loc: "\n#p 350 Kilometrów#! za Hel (po opracowaniu technologii [GetTechnology('art_silk').GetName] i [GetTechnology('vulcanization').GetName])."
