 MR_STOP_AUTOMATE_BALLOONIST_TT: "#T Zakończ automatyzację [concept_santos_balloonist]#!\nTwój Baloniarz nie będzie już wykonywał zadań automatycznie."
 MR_AUTOMATE_BALLOONIST_TT: "#T Automatyzuj [concept_santos_balloonist]#!\nPo włączeniu automatyzacji nie będziesz już musiał przydzielać zadań swojemu Baloniarzowi.\nBędzie on działał samodzielnie i wykonywał zadania odpowiednie do bieżącej sytuacji. Nadal jednak będziesz otrzymywać niektóre wydarzenia."
 MR_BALLOONIST_STRATOSPHERIC_FLIGHT_BUTTON: "Lot Stratosferyczny"
 MR_BALLOONIST_STRATOSPHERIC_FLIGHT_BUTTON_TT: "#T Lot Stratosferyczny#!\nJak wysoko może wznieść się człowiek w balonie? Dzięki rewolucyjnemu wynalazkowi kapsuły ciśnieniowej przeprowadzenie niezwykłego i niebezpiecznego eksperymentu może stać się możliwe.\n#R Uwaga:#! Podczas pierwszego lotu stratosferycznego potrzebny jest [concept_curie_meteorological_physicist], aby zbudować i zmodyfikować balon stratosferyczny. Po pierwszym locie baloniarz może latać bez meteorologa.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_HAS_HYDROGEN_BALLOON_TRIGGER_TT: "#default_text [GetPlayer.GetName] posiada [concept_santos_balloon] wypełniony #BLUE Wodorem#!#!"
