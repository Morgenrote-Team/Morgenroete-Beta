 MR_BALLOON_DISTANCE_RECORD: "#V Ostatni Wynik:#! [Scope.Var('santos_balloon_distance_record_personal_var').GetValue|0] Kilometrów"
 MR_BALLOON_TIME_RECORD: "#V Ostatni Wynik:#! [Scope.Var('santos_balloon_time_record_personal_var').GetValue|0] Godzin"
 MR_COAL_GAS_BAR: "Gaz Węglowy"
 MR_COAL_GAS_BAR_TT: "Ten balon wykorzystuje #V gaz węglowy#!."
 MR_HYDROGEN_BAR: "Wodór"
 MR_HYDROGEN_BAR_TT: "Ten balon wykorzystuje #V wodór#!."
 MR_BALLOONIST_CHANGE_TYPE_BUTTON: "Zmień Typ"
 MR_BALLOONIST_CHANGE_TYPE_BUTTON_TT: "Wyspecjalizowane balony mogą zapewniać niewielkie korzyści w jednej dziedzinie – wysokości lotu, pokonywanego dystansu lub czasu lotu – ale kosztem gorszych osiągów we wszystkich pozostałych. Balon wszechstronny nie zapewnia żadnych korzyści ani nie wiąże się z żadnymi wadami."
 MR_HEADER_MODIFICATIONS: "Modyfikacje"
 MR_BALLOONIST_MODIFICATION_POSSIBLE_TRIGGER_TT: "#default_text [GetPlayer.GetName] nie wprowadza zmian w konstrukcji swojego balonu.#!"
 MR_BALLOONIST_HYDROGEN_FACTORY_TRIGGER_TT: "#default_text [GetPlayer.GetName] posiada co najmniej jeden [GetBuildingType('building_explosives_factory').GetName], w którym stosowana jest [concept_production_method] $pm_brine_electrolysis$.#!"
 MR_BALLOONIST_COAL_GAS_BUTTON: "Użyj Gazu Węglowego"
 MR_BALLOONIST_COAL_GAS_BUTTON_TT: "#T Użyj Gazu Węglowego#!\nGaz węglowy jest powszechnie dostępnym gazem wykorzystywanym do napełniania balonów. W początkach baloniarstwa doskonale nadawał się do ustanawiania rekordów odległości i prędkości lotu, jednak ma istotne ograniczenia, jeśli chodzi o wznoszenie się na duże wysokości.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_HYDROGEN_BUTTON: "Użyj Wodoru"
 MR_BALLOONIST_HYDROGEN_BUTTON_TT: "#T Użyj Wodoru#!\nWodór wykorzystywano już w początkach baloniarstwa, a dzięki niemu ustanowiono kilka zapierających dech w piersiach rekordów wysokości lotu. Jest to po prostu gaz idealny do osiągania dużych wysokości. Jego produkcja jest jednak bardzo kosztowna i pracochłonna.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
