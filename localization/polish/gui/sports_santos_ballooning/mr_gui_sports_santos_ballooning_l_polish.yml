 santos_balloon_type_allround_flag: "Balon Wszechstronny"
 MR_BALLOONING: "[GetPlayer.GetAdjectiveNoFormatting] Towarzystwo Balonowe"
 BALLOON_HEADER_TEXT: "Balon"
 MR_BALLOON_NAME: "#V Nazwa:#! [GetPlayer.GetCustom('santos_balloon_type')]"
 MR_BALLOON_OWNER: "#V Właściciel:#! [Scope.GetCharacter.GetFullNameNoFormatting]"
 MR_BALLOON_TYPE: "#V Typ:#! [Scope.Var('santos_balloon_type_var').GetFlagName]"
