 MR_BALLOONIST_CHANGE_FUEL_BUTTON: "Zmień Paliwo"
 MR_BALLOONIST_CHANGE_FUEL_BUTTON_TT: "Każdy gaz używany do napełniania balonów ma swoje zalety i wady. Gaz świetlny dobrze sprawdza się podczas lotów na duże odległości, wodór pozwala osiągać duże wysokości, a hel jest szczególnie przydatny w zapobieganiu wypadkom."
 MR_BALLOONIST_CHANGE_FUEL_TRIGGER: "#default_text [GetPlayer.GetName] ma co najmniej jeden budynek typu [GetBuildingType('building_explosives_factory').GetName], w którym stosuje się $pm_brine_electrolysis$ ([concept_production_method])\n#R LUB#! [GetPlayer.GetName] ma budynek typu [GetBuildingType('building_mendelejew_helium_plant').GetName].#!"
 santos_set_balloon_fuel_helium_effect_tt: "Zmień gaz w balonie na #V Hel#!. Przystosowanie balonu do nowego gazu potrwa #V sześć miesięcy#!."
