 elgar_composer_achievements_intro_loc: "\#V Osiągnięcia tego kompozytora#!\n #indent_newline:3 • [Scope.GetCharacter.GetFullName] jest kompozytorem o reputacji wynoszącej [Scope.Var('elgar_composer_experience').GetValue|V0].#!\n #indent_newline:3 • Jak dotąd [Scope.GetCharacter.GetSheHe] odbył [Scope.Var('elgar_composer_num_tours_var').GetValue|V0] tras koncertowych.#!\n #indent_newline:3 • Spośród [Scope.GetCharacter.GetHerHis] licznych dzieł na szczególną uwagę zasługuje [Scope.Var('elgar_composer_num_compositions_var').GetValue|V0] z nich.#!"
 elgar_composer_achievement_is_composer_virtuoso_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetSheHe|U] jest wybitnym #V Wirtuozem #!. #!"
 elgar_composer_achievement_is_composer_conductor_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetSheHe|U] jest uznawany za sławnego #V dyrygenta #!. #!"
 elgar_composer_achievement_has_masterpiece_loc: "\n • [Scope.GetCharacter.GetSheHe|U] stworzył [Scope.Var('elgar_composer_num_masterworks_var').GetValue|V0] arcydzieł: #!"
