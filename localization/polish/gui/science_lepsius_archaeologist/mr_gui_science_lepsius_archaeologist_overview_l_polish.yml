 MR_BAN_ARTIFACT_EXPORT_BUTTON: "Zakaz eksportu artefaktów"
 MR_BAN_ARTIFACT_EXPORT_BUTTON_TT: "\#T Zakaz eksportu artefaktów#!\nWprowadzając zakaz eksportu artefaktów, jasno dajemy do zrozumienia, że wolimy, aby nasze skarby archeologiczne pozostały w ziemi, niż ryzykować, że zostaną wydobyte i wywiezione przez cudzoziemców. Z zasady nie będziemy wydawać żadnych zezwoleń na prowadzenie wykopalisk.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ALLOW_ARTIFACT_EXPORT_BUTTON: "Zezwól na eksport artefaktów"
 MR_ALLOW_ARTIFACT_EXPORT_BUTTON_TT: "\#T Zezwól na eksport artefaktów#!\nDzięki zezwoleniu na eksport artefaktów możemy uzyskać całkiem przyzwoity dodatkowy dochód.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"