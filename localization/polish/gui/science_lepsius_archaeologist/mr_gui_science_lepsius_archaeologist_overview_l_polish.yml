 ARCHAEOLOGIST_ARCHAEOLOGIST_RANKING_HEADER: "#V [Concept('concept_lepsius_archaeologist','$concept_lepsius_archaeologists$')] świata, rankingowani według [concept_academics_experience]"
 MR_NO_RECENT_INSEPCTION_TRIGGER_TT: "\#default_text [GetPlayer.GetName] nie dokonał inspekcji wykopalisk w ciągu #V ostatnich 2 lat#! (nie posiada modyfikatora #V $lepsius_recent_excavation_inspection_modifier$#!).#!"
 LEPSIUS_ARCHAEOLOGIST_IS_PHYSICIAN_TT: "\#default_text [ROOT.Var('lepsius_archaeologist_var').GetCharacter.GetFullName] posiada #V $panum_physician$#!, #V $panum_physician_experienced$#! lub #V $panum_physician_famous$#! [concept_character_trait].#!"
 EGYPTIAN_MAJOR_VAR: "@lepsius_egypt_major!  #underline [GetPlayer.MakeScope.Var('lepsius_egyptian_artifact_major').GetValue|V0]#!"
 EGYPTIAN_MAJOR_VAR_TT: "\#header Główne egipskie [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')]#!\n[GetPlayer.GetName] zebrał @lepsius_egypt_major! [GetPlayer.MakeScope.Var('lepsius_egyptian_artifact_major').GetValue|V0] głównych egipskich [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')]\n\nGłówne artefakty:\n[GetPlayer.GetCustom('lepsius_has_sarcophagus_type')][GetPlayer.GetCustom('lepsius_has_nefertiti_type')][GetPlayer.GetCustom('lepsius_has_narmer_type')][GetPlayer.GetCustom('lepsius_has_tutankhamun_type')][GetPlayer.GetCustom('lepsius_has_needle_type')]"
 MESOPOTAMIAN_MAJOR_VAR: "@lepsius_mesopotamia_major!  #underline [GetPlayer.MakeScope.Var('lepsius_mesopotamian_artifact_major').GetValue|V0]#!"
 MESOPOTAMIAN_MAJOR_VAR_TT: "\#header Główne mezopotamskie [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')]#!\n[GetPlayer.GetName] zebrał @lepsius_mesopotamia_major! [GetPlayer.MakeScope.Var('lepsius_mesopotamian_artifact_major').GetValue|V0] głównych mezopotamskich [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')]\n\nGłówne artefakty:\n[GetPlayer.GetCustom('lepsius_has_meskalamdug_type')][GetPlayer.GetCustom('lepsius_has_gilgamesh_type')][GetPlayer.GetCustom('lepsius_has_sargon_type')][GetPlayer.GetCustom('lepsius_has_lamassu_type')][GetPlayer.GetCustom('lepsius_has_ishtar_type')]"
 AEGEAN_MAJOR_VAR: "@lepsius_aegean_major!  #underline [GetPlayer.MakeScope.Var('lepsius_aegean_artifact_major').GetValue|V0]#!"
 AEGEAN_MAJOR_VAR_TT: "\#header Główne egejskie [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')]#!\n[GetPlayer.GetName] zebrał @lepsius_aegean_major! [GetPlayer.MakeScope.Var('lepsius_aegean_artifact_major').GetValue|V0] głównych egejskich [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')]\n\nGłówne artefakty:\n[GetPlayer.GetCustom('lepsius_has_priam_type')][GetPlayer.GetCustom('lepsius_has_agamemnon_type')][GetPlayer.GetCustom('lepsius_has_diskos_type')][GetPlayer.GetCustom('lepsius_has_snake_type')][GetPlayer.GetCustom('lepsius_has_rhyton_type')][GetPlayer.GetCustom('lepsius_has_ariadne_type')]"
 PRECOLUMBIAN_MAJOR_VAR: "@lepsius_precolumbian_major!  #underline [GetPlayer.MakeScope.Var('lepsius_precolumbian_artifact_major').GetValue|V0]#!"
 PRECOLUMBIAN_MAJOR_VAR_TT: "\#header Główne prekolumbijskie [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')]#!\n[GetPlayer.GetName] zebrał @lepsius_precolumbian_major! [GetPlayer.MakeScope.Var('lepsius_precolumbian_artifact_major').GetValue|V0] głównych prekolumbijskich [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')]\n\nGłówne artefakty:\n[GetPlayer.GetCustom('lepsius_has_pakal_type')][GetPlayer.GetCustom('lepsius_has_plaque_type')][GetPlayer.GetCustom('lepsius_has_raft_type')][GetPlayer.GetCustom('lepsius_has_manco_type')][GetPlayer.GetCustom('lepsius_has_stele_type')][GetPlayer.GetCustom('lepsius_has_kukulkan_type')]"
 FAR_EASTERN_MAJOR_VAR: "@lepsius_east_asian_major!  #underline [GetPlayer.MakeScope.Var('lepsius_fareastern_artifact_major').GetValue|V0]#!"
 FAR_EASTERN_MAJOR_VAR_TT: "\#header Główne dalekowschodnie [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')]#!\n[GetPlayer.GetName] zebrał @lepsius_east_asian_major! [GetPlayer.MakeScope.Var('lepsius_fareastern_artifact_major').GetValue|V0] głównych dalekowschodnich [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')]\n\nGłówne artefakty:\n[GetPlayer.GetCustom('lepsius_has_summer_type')]"
 OCEANIC_MAJOR_VAR: "@lepsius_oceanian_major!  #underline [GetPlayer.MakeScope.Var('lepsius_oceanic_artifact_major').GetValue|V0]#!"
 OCEANIC_MAJOR_VAR_TT: "\#header Główne oceaniczne [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')]#!\n[GetPlayer.GetName] zebrał @lepsius_oceanian_major! [GetPlayer.MakeScope.Var('lepsius_oceanic_artifact_major').GetValue|V0] głównych oceanicznych [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')]\n\nGłówne artefakty:\n[GetPlayer.GetCustom('lepsius_has_hoa_type')]"
 LOCAL_MAJOR_VAR: "@lepsius_local_major!  #underline [GetPlayer.MakeScope.Var('lepsius_local_artifact_major').GetValue|V0]#!"
