 theiler_biologist_no_biologist_achievements_loc: "Osiągnięcia #V tego [concept_theiler_biologist]#! zostaną wyświetlone tutaj, gdy tylko będziesz go posiadać."
 theiler_biologist_achievements_intro_loc: "\#V Osiągnięcia tego biologa#!\n #indent_newline:3 • [Scope.GetCharacter.GetFullName] jest odnoszącym sukcesy biologiem.#! "
 theiler_microbiology_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] jest uznawany za założyciela współczesnej mikrobiologii.#! "
 theiler_cholera_pathogen_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] jako pierwszy odkrył bakterię wywołującą cholerę, a następnie ją opisał i wyizolował.#! "
 theiler_tuberculosis_pathogen_achievement_loc: "\n #indent_newline:3 • Czynnik wywołujący gruźlicę został po raz pierwszy odkryty przez dr. [Scope.GetCharacter.GetLastNameNoFormatting], który również go scharakteryzował i wyizolował.#! "
 theiler_smallpox_pathogen_achievement_loc: "\n #indent_newline:3 • To dr. [Scope.GetCharacter.GetLastNameNoFormatting] jako pierwszy odkrył mikroorganizm wywołujący ospę prawdziwą, a następnie go opisał i wyizolował.#! "
 theiler_typhus_pathogen_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] zidentyfikował czynnik wywołujący tyfus, a następnie go opisał i wyizolował.#! "
 theiler_yellow_fever_pathogen_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] był pionierem w odkryciu czynnika wywołującego żółtą febrę, a także w jego opisaniu i wyizolowaniu.#! "
 theiler_measles_pathogen_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] odkrył czynnik wywołujący odrę, a następnie go opisał i wyizolował.#! "
 theiler_scarlet_pathogen_achievement_loc: "\n #indent_newline:3 • Pierwszą osobą, która odkryła bakterię wywołującą szkarlatynę, był dr. [Scope.GetCharacter.GetLastNameNoFormatting], który również ją opisał i wyizolował.#!"
 theiler_plague_pathogen_achievement_loc: "\n #indent_newline:3 • Czynnik wywołujący dżumę został po raz pierwszy odkryty przez dr. [Scope.GetCharacter.GetLastNameNoFormatting], który go opisał i skutecznie wyizolował.#! "
 theiler_diphteria_pathogen_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] jako pierwszy zidentyfikował mikroorganizm wywołujący błonicę, a następnie go opisał i wyizolował.#! "
 theiler_polio_pathogen_achievement_loc: "\n #indent_newline:3 • Odkrycia, opisania i wyizolowania czynnika wywołującego polio jako pierwszy dokonał dr. [Scope.GetCharacter.GetLastNameNoFormatting].#! "
 theiler_cholera_vaccine_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] był pionierem w opracowaniu, testowaniu i produkcji skutecznej szczepionki przeciwko cholerze.#! "
 theiler_tuberculosis_vaccine_achievement_loc: "\n #indent_newline:3 • Pierwszym naukowcem, który opracował, przetestował i wyprodukował szczepionkę przeciwko gruźlicy, był dr. [Scope.GetCharacter.GetLastNameNoFormatting].#! "
 theiler_smallpox_vaccine_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] jako pierwszy opracował, przetestował i wyprodukował skuteczną szczepionkę przeciwko ospie prawdziwej.#! "
 theiler_typhus_vaccine_achievement_loc: "\n #indent_newline:3 • Pierwszą skuteczną szczepionkę przeciwko tyfusowi opracował, przetestował i wyprodukował dr. [Scope.GetCharacter.GetLastNameNoFormatting].#! "
 theiler_yellow_fever_vaccine_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] kierował pierwszą udaną próbą opracowania, przetestowania i wyprodukowania szczepionki przeciwko żółtej febrze.#! "
 theiler_measles_vaccine_achievement_loc: "\n #indent_newline:3 • Pierwszym, który opracował, przetestował i wyprodukował skuteczną szczepionkę przeciwko odrze, był dr. [Scope.GetCharacter.GetLastNameNoFormatting].#! "
 theiler_scarlet_vaccine_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] był pionierem w opracowaniu pierwszej przetestowanej i wyprodukowanej szczepionki przeciwko szkarlatynie.#! "
 theiler_plague_vaccine_achievement_loc: "\n #indent_newline:3 • Pierwszą osobą, która opracowała, przetestowała i wyprodukowała skuteczną szczepionkę przeciwko dżumie, był dr. [Scope.GetCharacter.GetLastNameNoFormatting].#! "
 theiler_diphteria_vaccine_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] skutecznie opracował, przetestował i wyprodukował pierwszą skuteczną szczepionkę przeciwko błonicy.#! "
 theiler_polio_vaccine_achievement_loc: "\n #indent_newline:3 • Opracowania, przetestowania i wyprodukowania skutecznej szczepionki przeciwko polio jako pierwszy dokonał dr. [Scope.GetCharacter.GetLastNameNoFormatting].#! "
 theiler_pharmaceutical_strychnine_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] jest uznawany za osobę, która jako pierwsza odkryła lek na bazie strychniny.#! "
 theiler_pharmaceutical_emetine_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] jest uznawany za pioniera w opracowaniu leku na bazie emetyny.#! "
 theiler_pharmaceutical_atropine_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] jest uznawany za odkrywcę leku na bazie atropiny.#! "
 theiler_pharmaceutical_aloin_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] przypisuje się pierwsze odkrycie leku na bazie aloiny.#! "
 theiler_pharmaceutical_digitoxin_achievement_loc: "\n #indent_newline:3 • Odkrycie leku na bazie digitoksyny przypisuje się dr. [Scope.GetCharacter.GetLastNameNoFormatting].#! "
 theiler_pharmaceutical_quinine_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] jako pierwszy opracował lek z wykorzystaniem chininy.#! "
 theiler_pharmaceutical_thymol_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] przypisuje się pierwsze odkrycie leku na bazie tymolu.#! "
 theiler_pharmaceutical_pilocarpine_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] jest uznawany za odkrywcę leku na bazie pilokarpiny.#! "
 theiler_pharmaceutical_ephedrine_achievement_loc: "\n #indent_newline:3 • Pierwsze odkrycie leku na bazie efedryny przypisuje się dr. [Scope.GetCharacter.GetLastNameNoFormatting].#! "
 theiler_pharmaceutical_strophantine_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] jest uznawany za osobę, która jako pierwsza odkryła lek na bazie strofantyny.#! "