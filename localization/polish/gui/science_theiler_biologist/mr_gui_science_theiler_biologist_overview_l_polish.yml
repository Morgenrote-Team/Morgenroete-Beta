 theiler_gui_current_microscope_compound_tooltip_loc: "Twoi naukowcy obecnie korzystają z $theiler_early_compound_microscope_flag$.\n\nPo opracowaniu [GetTechnology('theiler_microbiology_tech').GetName] będziesz mógł rozpocząć prace nad $theiler_achromatic_microscope_flag$. Aby ukończyć prace, Twój [concept_tesla_engineer] i [concept_theiler_biologist] będą musieli poświęcić #V 12 miesięcy#! na jego opracowanie. Dodatkowo będziesz potrzebować budynku typu [GetBuildingType('building_glassworks').GetName] na poziomie #V 3#!."
 theiler_gui_current_microscope_achromatic_tooltip_loc: "Your scientists are currently using an `$theiler_achromatic_microscope_flag$`.\n\nOnce you research `[GetTechnology('verrier_nuclear_physics_tech').GetName]`, you will be able to start development of an `$theiler_electron_microscope_flag$`. To finish the development your `[concept_tesla_engineer]` and `[concept_theiler_biologist]` will have to spend #V 12 months#! working on it. Additionally you will need a `[GetBuildingType('building_glassworks').GetName]` building of level #V 5#!."
 theiler_gui_current_microscope_electron_tooltip_loc: "Twoi naukowcy obecnie korzystają z $theiler_electron_microscope_flag$.\n\nJest to najbardziej zaawansowany mikroskop."
 MR_AUTOMATE_BIOLOGIST_TT: "\#T Automatyzuj [concept_theiler_biologist]#!\nNie będziesz już musiał przydzielać zadań swojemu biologowi, jeśli go zautomatyzujesz.\nBędzie pracował samodzielnie i wykonywał zadania, które w danym momencie mają sens. Nadal będziesz jednak otrzymywać niektóre wydarzenia."
 mr_biologist_automation_gui_tt: "Rozpocznij automatyzację zadań [concept_theiler_biologist]."
 mr_stop_biologist_automation_gui_tt: "Zakończ automatyzację zadań [concept_theiler_biologist]."
 MR_STOP_AUTOMATE_BIOLOGIST_TT: "\#T Zatrzymaj automatyzację [concept_theiler_biologist]#!\nTwój biolog nie będzie już działał automatycznie."