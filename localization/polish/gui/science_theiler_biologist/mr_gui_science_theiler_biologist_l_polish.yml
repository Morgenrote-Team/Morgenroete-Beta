l_polish:
 MR_BIOLOGIST_MICROORGANISM_RESEARCH_BUTTON: "Badania nad Mikroorganizmami"
 MR_BIOLOGIST_MICROORGANISM_RESEARCH_BUTTON_TT: "#T Badania nad Mikroorganizmami#!\nPoszukiwanie nowych [Concept('concept_theiler_microorganism','$concept_theiler_microorganisms|q$')], ich badanie oraz związane z nimi eksperymenty stanowią istotną część pracy mikrobiologicznej. Biolodzy mogą nie tylko prowadzić wstępne badania w poszukiwaniu patogenu, lecz także dokonywać przypadkowych odkryć.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGIST_MICROORGANISM_RESEARCH_ACTIVE_TT: "#T Badania nad Mikroorganizmami#!\nTwój [concept_theiler_biologist] obecnie poszukuje nowych [Concept('concept_theiler_microorganism','$concept_theiler_microorganisms|q$')], bada je i przeprowadza na nich eksperymenty. Biolodzy mogą nie tylko prowadzić wstępne badania w poszukiwaniu patogenu, lecz także dokonywać przypadkowych odkryć.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGIST_FIND_PATHOGEN_BUTTON: "Znajdź patogen"
 MR_BIOLOGIST_FIND_PATHOGEN_BUTTON_TT: "#T Znajdź Patogen#!\nPoszukiwanie [concept_theiler_pathogen] jest warunkiem koniecznym do późniejszego opracowania szczepionki. W zależności od patogenu proces odkrywania może trwać dłużej lub rozpocząć się dopiero po spełnieniu określonych warunków.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGIST_FIND_PATHOGEN_ACTIVE_TT: "#T Znajdź Patogen#!\nTwój [concept_theiler_biologist] obecnie poszukuje [concept_theiler_pathogen], który jest warunkiem koniecznym do późniejszego opracowania szczepionki. W zależności od patogenu proces odkrywania może trwać dłużej lub rozpocząć się dopiero po spełnieniu określonych warunków.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ACTIVE_BIOLOGIST_TRIGGER: "#default_text [GetPlayer.GetName] posiada [concept_theiler_biologist], który #V nie jest zajęty#!.#!"
 MR_BIOLOGIST_CAN_FIND_PATHOGEN_TRIGGER_TT: "#default_text Dowolny z poniższych:[GetPlayer.GetCustom('GUI_theiler_can_find_cholera_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_diphtheria_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_measles_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_plague_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_polio_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_typhus_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_scarlet_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_smallpox_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_tuberculosis_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_yellow_fever_trigger_custom_loc')]#!"
 MR_BIOLOGIST_CREATE_VACCINE_BUTTON: "Opracuj szczepionkę"
 MR_BIOLOGIST_CREATE_VACCINE_BUTTON_TT: "#T Opracuj Szczepionkę#!\nTwój [concept_theiler_biologist] obecnie opracowuje szczepionkę, będącą ukoronowaniem pracy biologa. Wymaga to wcześniejszego zbadania [concept_theiler_pathogen] wywołującego daną chorobę. W pewnych okolicznościach [Concept('concept_theiler_vaccine','$concept_theiler_vaccines|q$')] mogą całkowicie zapobiec wybuchowi choroby.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGIST_CREATE_VACCINE_ACTIVE_TT: "#T Opracuj Szczepionkę#!\nOpracowanie szczepionki jest ukoronowaniem pracy biologa. Wymaga to wcześniejszego zbadania [concept_theiler_pathogen] wywołującego daną chorobę. W pewnych okolicznościach [Concept('concept_theiler_vaccine','$concept_theiler_vaccines|q$')] mogą całkowicie zapobiec wybuchowi choroby.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGIST_CAN_CREATE_VACCINE_TRIGGER_TT: "#default_text [GetPlayer.GetName] odkrył patogen, na który nie ma jeszcze szczepionki, a także posiada odpowiednią technologię.#! "
 MR_10000_SPECIMEN_TRIGGER_TT: "#default_text [GetPlayer.GetName] posiada #V 10000 lub więcej#! [Concept('concept_dubois_specimen','$concept_dubois_specimens|q$')] (obecnie [GetPlayer.MakeScope.Var('dubois_specimen').GetValue|0+]).#!"
 MR_BOTANICAL_EXPEDITION_BUTTON_TT: "#T Wyprawa Botaniczna#!\nWyprawy botaniczne (czasami nazywane „poszukiwaniem roślin”) to naukowe podróże mające na celu zbadanie flory danego regionu. [concept_dubois_naturalist] odpowiadałby za identyfikację, opis i zbieranie okazów oraz [concept_ito_medicinal_plants].\n\nPamiętaj, że potrzebujesz [GetTechnology('malaria_prevention').GetName] [concept_technology], jeśli chcesz przeprowadzić wyprawę botaniczną w stanie dotkniętym malarią.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_SAFARI_EXPEDITION_BANNED_TRIGGER_TT: "#default_text Wyprawy botaniczne zostały zakazane z #V powodów politycznych#!.#! "
 MR_SAFARI_EXPEDITION_ACCESS_RAINFOREST_TRIGGER_TT: "#default_text [GetPlayer.GetName] posiada stan z cechą stanu [concept_ito_medicinal_plants]. Jeśli ten stan jest #V stanem dotkniętym malarią#!, dodatkowo musisz mieć opracowaną technologię [GetTechnology('malaria_prevention').GetName] [concept_technology].#!"
 MR_BOTANICAL_EXPEDITION_RECALL_BUTTON_TT: "#T Odwołaj Przyrodnika z Wyprawy Botanicznej#!\nNakazuje [concept_dubois_naturalist] powrót z badań botanicznych, aby mógł zająć się innymi zadaniami, takimi jak chwytanie zwierząt.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BOTANICAL_EXPEDITION_RECALL_TRIGGER_TT: "#default_text Twój [concept_dubois_naturalist] #V ani nie podróżuje, ani nie jest chory#!.#! "
 MR_BOTANICAL_EXPEDITION_RECALL_NATURALIST_EFFECT_TT: "Twój [concept_dubois_naturalist] nie jest już zajęty."
 MR_BIOLOGIST_IMPROVE_AGRICULTURE_BUTTON: "Modernizacja rolnictwa"
 MR_BIOLOGIST_IMPROVE_AGRICULTURE_BUTTON_TT: "#T Ulepsz Rolnictwo#!\nTwój Biolog może wykorzystać swoje umiejętności do ulepszania budynków rolniczych w twoim kraju. Pozwoli to ulepszyć jeden z budynków należących do grupy [GetBuildingGroup('bg_agriculture').GetName], [GetBuildingGroup('bg_ranching').GetName] lub [GetBuildingGroup('bg_plantations').GetName].\n\nModyfikatory, które otrzyma budynek:\n$theiler_building_throughput_add_modifier_with_tooltip$\n$theiler_building_production_mult_modifier_with_tooltip$\n$theiler_building_goods_input_mult_modifier_with_tooltip$\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGIST_IMPROVE_AGRICULTURE_TRIGGER_TT: "#default_text Co najmniej jeden budynek należący do grupy [GetBuildingGroup('bg_agriculture').GetName], [GetBuildingGroup('bg_ranching').GetName] lub [GetBuildingGroup('bg_plantations').GetName] na poziomie 1 lub wyższym nie posiada wszystkich trzech [Concept('concept_modifier','$concept_modifiers|q$')].#!"
 MR_BIOLOGIST_IMPROVE_AGRICULTURE_ACTIVE_TT: "#T Modernizacja rolnictwa#!\n#p Twój biolog obecnie modernizuje budynek typu [GetBuildingGroup('bg_agriculture').GetName], [GetBuildingGroup('bg_ranching').GetName] lub [GetBuildingGroup('bg_plantations').GetName].#!"
 MR_ACHROMATIC_MICROSCOPE_TRIGGER_TT: "#default_text [GetPlayer.GetName] używa co najmniej #V achromatycznego mikroskopu#!.#! "
