l_polish:
 MR_BIOLOGIST_MICROORGANISM_RESEARCH_BUTTON: "Badania nad mikroorganizmami"
 MR_BIOLOGIST_MICROORGANISM_RESEARCH_BUTTON_TT: "\#T Badania nad mikroorganizmami#!\nPoszukiwanie nowych [Concept('concept_theiler_microorganism','$concept_theiler_microorganisms$')], ich badanie oraz związane z nimi eksperymenty stanowią istotną część pracy mikrobiologicznej. Biolodzy mogą nie tylko prowadzić wstępne badania w poszukiwaniu patogenu, lecz także dokonywać przypadkowych odkryć.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGIST_MICROORGANISM_RESEARCH_ACTIVE_TT: "\#T Badania nad mikroorganizmami#!\nTwój [concept_theiler_biologist] obecnie poszukuje nowych [Concept('concept_theiler_microorganism','$concept_theiler_microorganisms$')], bada je i przeprowadza na nich eksperymenty. Biolodzy mogą nie tylko prowadzić wstępne badania w poszukiwaniu patogenu, lecz także dokonywać przypadkowych odkryć.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGIST_FIND_PATHOGEN_BUTTON: "Znajdź patogen"
 MR_BIOLOGIST_FIND_PATHOGEN_BUTTON_TT: "\#T Znajdź patogen#!\nPoszukiwanie [concept_theiler_pathogen] jest warunkiem koniecznym do późniejszego opracowania szczepionki. W zależności od patogenu proces odkrywania może trwać dłużej lub rozpocząć się dopiero po spełnieniu określonych warunków.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGIST_FIND_PATHOGEN_ACTIVE_TT: "\#T Znajdź patogen#!\nTwój [concept_theiler_biologist] obecnie poszukuje [concept_theiler_pathogen], który jest warunkiem koniecznym do późniejszego opracowania szczepionki. W zależności od patogenu proces odkrywania może trwać dłużej lub rozpocząć się dopiero po spełnieniu określonych warunków.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ACTIVE_BIOLOGIST_TRIGGER: "\#default_text [GetPlayer.GetName] posiada [concept_theiler_biologist], który jest #V wolny#!.#!"
 MR_BIOLOGIST_CAN_FIND_PATHOGEN_TRIGGER_TT: "\#default_text Dowolny z poniższych:`[GetPlayer.GetCustom('GUI_theiler_can_find_cholera_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_diphtheria_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_measles_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_plague_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_polio_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_typhus_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_scarlet_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_smallpox_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_tuberculosis_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_yellow_fever_trigger_custom_loc')]`#! "
 MR_BIOLOGIST_CREATE_VACCINE_BUTTON: "Opracuj szczepionkę"
 MR_BIOLOGIST_CREATE_VACCINE_BUTTON_TT: "\#T Opracuj szczepionkę#!\nTwój [concept_theiler_biologist] obecnie opracowuje szczepionkę, będącą ukoronowaniem pracy biologa. Wymaga to wcześniejszego zbadania [concept_theiler_pathogen] wywołującego daną chorobę. W pewnych okolicznościach [Concept('concept_theiler_vaccine','$concept_theiler_vaccines$')] mogą całkowicie zapobiec wybuchowi choroby.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGIST_CREATE_VACCINE_ACTIVE_TT: "\#T Opracuj szczepionkę#!\nOpracowanie szczepionki jest ukoronowaniem pracy biologa. Wymaga to wcześniejszego zbadania [concept_theiler_pathogen] wywołującego daną chorobę. W pewnych okolicznościach [Concept('concept_theiler_vaccine','$concept_theiler_vaccines$')] mogą całkowicie zapobiec wybuchowi choroby.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGIST_CAN_CREATE_VACCINE_TRIGGER_TT: "\#default_text [GetPlayer.GetName] odkrył patogen, na który nie ma jeszcze szczepionki, a także posiada odpowiednią technologię.#! "
 MR_10000_SPECIMEN_TRIGGER_TT: "\#default_text [GetPlayer.GetName] posiada #V 10000 lub więcej#! [Concept('concept_dubois_specimen','$concept_dubois_specimens$')] (obecnie [GetPlayer.MakeScope.Var('dubois_specimen').GetValue|0+]).#!"
 MR_BOTANICAL_EXPEDITION_BUTTON_TT: "\#T Wyprawa botaniczna#!\nWyprawy botaniczne (czasami nazywane „poszukiwaniem roślin”) to naukowe podróże mające na celu zbadanie flory danego regionu. [concept_dubois_naturalist] odpowiadałby za identyfikację, opis i zbieranie okazów oraz [concept_ito_medicinal_plants].\n\nPamiętaj, że potrzebujesz [GetTechnology('malaria_prevention').GetName] [concept_technology], jeśli chcesz przeprowadzić wyprawę botaniczną w stanie dotkniętym malarią.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_SAFARI_EXPEDITION_BANNED_TRIGGER_TT: "#default_text Wyprawy botaniczne zostały zakazane z #V powodów politycznych#!.#! "
 MR_SAFARI_EXPEDITION_ACCESS_RAINFOREST_TRIGGER_TT: "\#default_text [GetPlayer.GetName] posiada stan z cechą stanu [concept_ito_medicinal_plants]. Jeśli ten stan jest #V stanem dotkniętym malarią#!, dodatkowo musisz mieć opracowaną technologię [GetTechnology('malaria_prevention').GetName] [concept_technology].#!"
 MR_BOTANICAL_EXPEDITION_RECALL_BUTTON_TT: "\#T Odwołaj naturalistę z wyprawy botanicznej#!\nNakazuje [concept_dubois_naturalist] powrót z badań botanicznych, aby mógł zająć się innymi zadaniami — takimi jak odławianie zwierząt.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BOTANICAL_EXPEDITION_RECALL_TRIGGER_TT: "\#default_text Twój [concept_dubois_naturalist] #V ani nie podróżuje, ani nie jest chory#!.#! "
 MR_BOTANICAL_EXPEDITION_RECALL_NATURALIST_EFFECT_TT: "Twój [concept_dubois_naturalist] nie jest już zajęty."
 MR_BIOLOGIST_COCHLIOMYIA_EREDICATION_BUTTON: "Zwalczanie muchy śrubowej"
 MR_BIOLOGIST_COCHLIOMYIA_EREDICATION_BUTTON_TT: "\#T Zwalczanie muchy śrubowej#!\nDzięki rozległym możliwościom technologicznym biolog wspierany przez rząd może opracować metodę ostatecznego wytępienia uciążliwej muchy śrubowej. Poprawiłoby to wydajność rolnictwa w dotkniętych problemem regionach.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_COCHLIOMYIA_STATE_TRIGGER: "\#default_text [GetPlayer.GetName] posiada co najmniej jeden stan z #V `$theiler_state_trait_cochliomyia$`#! [Concept('concept_modifier','$concept_modifiers$')].#!"
 MR_BIOLOGIST_STI_BUTTON: "Technika sterylnych owadów"
 MR_BIOLOGIST_STI_BUTTON_TT: "#T Sterile Insect Technique#!\nIn a state plagued by screwworm flies, a biologist can attempt to eradicate the parasite in a three-year trial.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGIST_CYDIA_PESTICIDE_BUTTON: "Cydia Pesticide"
 MR_BIOLOGIST_CYDIA_PESTICIDE_BUTTON_TT: "#T Cydia Pesticide#!\nA biologist can develop an effective pesticide to relieve our nation's fruit growers of the crop losses caused by the codling moth.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_CYDIA_STATE_TRIGGER: "#default_text [GetPlayer.GetName] has at least one state with the #V $theiler_state_trait_cydia$#! [Concept('concept_modifier','$concept_modifiers$')].#!"
 MR_BIOLOGIST_IMPROVE_AGRICULTURE_BUTTON: "Improve Agriculture"
 MR_BIOLOGIST_IMPROVE_AGRICULTURE_BUTTON_TT: "#T Improve Agriculture#!\nYour Biologist can use their skill to improve agricultural buildings in your country. This will improve one of your [GetBuildingGroup('bg_agriculture').GetName], [GetBuildingGroup('bg_ranching').GetName] or [GetBuildingGroup('bg_plantations').GetName]-Buildings.\n\nModifiers that the building will gain:\n$theiler_building_throughput_add_modifier_with_tooltip$\n$theiler_building_production_mult_modifier_with_tooltip$\n$theiler_building_goods_input_mult_modifier_with_tooltip$\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGIST_IMPROVE_AGRICULTURE_TRIGGER_TT: "#default_text At least one [GetBuildingGroup('bg_agriculture').GetName], [GetBuildingGroup('bg_ranching').GetName] or [GetBuildingGroup('bg_plantations').GetName]-Buildings of level 1 or higher does not have all three [Concept('concept_modifier','$concept_modifiers$')].#!"
 MR_BIOLOGIST_IMPROVE_AGRICULTURE_ACTIVE_TT: "#T Improve Agriculture#!\n#p Your Biologist is currently improving an [GetBuildingGroup('bg_agriculture').GetName], [GetBuildingGroup('bg_ranching').GetName] or [GetBuildingGroup('bg_plantations').GetName]-Buildings.#!"
 MR_ACHROMATIC_MICROSCOPE_TRIGGER_TT: "#default_text [GetPlayer.GetName] uses at least an #V Achromatic Microscope#!.#!"
