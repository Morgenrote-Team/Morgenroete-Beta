 MR_BIOLOGIST_SIT_BUTTON: "Technika Sterylizacji Owadów"
 MR_BIOLOGIST_SIT_BUTTON_TT: "#T Technika Sterylizacji Owadów#!\nDzięki szerokim możliwościom technologicznym biolog wspierany przez rząd mógłby opracować metodę, która pozwoliłaby ostatecznie wytępić uciążliwą muchę śrubową. Poprawiłoby to plony w dotkniętych jej występowaniem regionach.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_SCREWWORM_FLY_TRIGGER: "#default_text [GetPlayer.GetName] posiada co najmniej jeden stan położony na obszarze występowania [GetHarvestConditionType('theiler_screwworm_fly_condition').GetName].#!"
 MR_BIOLOGIST_LEAD_ARSENATE_BUTTON: "Arsenian Ołowiu"
 MR_BIOLOGIST_LEAD_ARSENATE_BUTTON_TT: "#T Arsenian Ołowiu#!\nStosowane obecnie pestycydy nieorganiczne, które wykazują już pewną skuteczność przeciwko niektórym owadom, nadal wymagają znacznego udoskonalenia. „Zieleń paryską” można by zastąpić arsenianem na bazie ołowiu. Biolog przy wsparciu chemika mógłby opracować ten nowy pestycyd, aby szybko położyć kres zagrożeniu ze strony stonki ziemniaczanej i owocówki jabłkóweczki.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_MOTH_OR_BEETLE_STATE_TRIGGER: "#default_text [GetPlayer.GetName] posiada co najmniej jeden stan położony na obszarze występowania [GetHarvestConditionType('theiler_potato_beetle_condition').GetName] lub [GetHarvestConditionType('theiler_codling_moth_condition').GetName].#!"
 MR_BIOLOGIST_SODIUM_ARSENITE_BUTTON: "Arsenin Sodu"
 MR_BIOLOGIST_SODIUM_ARSENITE_BUTTON_TT: "#T Arsenin Sodu#!\nKonwencjonalne pestycydy, środki odstraszające komary, a nawet miotacze ognia nie są w stanie ostatecznie rozprawić się z szarańczą. Trzeba więc pomyśleć na większą skalę!\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_LOCUST_STATE_TRIGGER: "#default_text [GetPlayer.GetName] posiada co najmniej jeden stan położony na obszarze występowania [GetHarvestConditionType('locust_swarm').GetName].#!"
 MR_BIOLOGIST_CALCIUM_ARSENATE_BUTTON: "Arsenian Wapnia"
 MR_BIOLOGIST_CALCIUM_ARSENATE_BUTTON_TT: "#T Arsenian Wapnia#!\nAby położyć kres ogromnym stratom w uprawach bawełny, konieczne są bardziej radykalne środki. Być może potrzebne będzie coś jeszcze skuteczniejszego niż sam arsenian ołowiu.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BOLL_WEEVIL_STATE_TRIGGER: "#default_text [GetPlayer.GetName] posiada co najmniej jeden stan położony na obszarze występowania [GetHarvestConditionType('theiler_boll_weevil_condition').GetName].#!"
 MR_BIOLOGIST_NICOTINE_SULFATE_BUTTON: "Siarczan Nikotyny"
 MR_BIOLOGIST_NICOTINE_SULFATE_BUTTON_TT: "#T Siarczan Nikotyny#!\nW przeszłości wyciągi z tytoniu uważano za domowy sposób na odstraszanie szkodników herbaty z plantacji. Potrzebna jest nowa metoda przemysłowa! Biolog przy wsparciu chemika mógłby opracować ten nowy pestycyd, aby szybko położyć kres zagrożeniu ze strony pluskwiaków atakujących krzewy herbaciane.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_TEA_MOSQUITO_STATE_TRIGGER: "#default_text [GetPlayer.GetName] posiada co najmniej jeden stan położony na obszarze występowania [GetHarvestConditionType('theiler_tea_mosquito_condition').GetName].#!"
 MR_BIOLOGIST_GRAFTING_BUTTON: "Szczepienie Roślin"
 MR_BIOLOGIST_GRAFTING_BUTTON_TT: "#T Szczepienie Roślin#!\nWszystkie środki chemiczne stosowane dotychczas przeciwko filokserze okazały się nieskuteczne. Być może rozwiązania należy szukać poza dziedziną wysoce toksycznych pestycydów?\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_GRAPE_PHYLLOXERA_STATE_TRIGGER: "#default_text [GetPlayer.GetName] posiada co najmniej jeden stan położony na obszarze występowania [GetHarvestConditionType('theiler_grape_phylloxera_condition').GetName].#!"
 BIOLOGICAL_CONGRESS_BUTTON: "Zorganizuj Kongres Biologiczny"
 BIOLOGICAL_CONGRESS_BUTTON_TT: "#T Zorganizuj Kongres Biologiczny#!\nWraz z rewolucją w badaniach mikrobiologicznych oraz jednoczesnym rozprzestrzenianiem się niebezpiecznych epidemii i szkodników rosła potrzeba dzielenia się odkryciami na międzynarodowych kongresach dla dobra ludzkości. Przy odrobinie szczęścia możliwa będzie wymiana wiedzy na temat patogenów, szczepionek i pestycydów.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGICAL_BREAKTHROUGH_TRIGGER_TT: "#default_text [GetPlayer.GetName] posiada modyfikator #V Przełom Biologiczny#!.#!"
 MR_BIOLOGY_5_COUNTRIES_WITH_BIOLOGIST_TRIGGER_TT: "#default_text Co najmniej 5 krajów posiada [concept_theiler_biologist].#!"
 MR_BIOLOGICAL_CONGRESS_COOLDOWN_TRIGGER_TT: "#default_text W ciągu #V ostatnich 5 lat#! #V nie odbył się żaden Kongres Biologiczny#! (ostatni organizator nie posiada modyfikatora „Zorganizowano Kongres Biologiczny”).#!"
 MR_BIOLOGIST_CAVENDISH_BUTTON: "Cavendish"
 MR_BIOLOGIST_CAVENDISH_BUTTON_TT: "#T Cavendish#!\nDotąd żaden środek chemiczny nie sprawdził się w walce z chorobą panamską. Może pomogłoby wprowadzenie innej odmiany bananowca?\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PANAMA_DISEASE_STATE_TRIGGER: "#default_text [GetPlayer.GetName] ma co najmniej jeden region z budynkiem typu [GetBuildingType('building_banana_plantation').GetName].#!"
 MR_BIOLOGICAL_CONGRESS_BUTTON: "Zorganizuj Kongres Biologiczny"
 MR_BIOLOGICAL_CONGRESS_BUTTON_TT: "#T Zorganizuj Kongres Biologiczny#!\nPrzełom w badaniach mikrobiologicznych zbiegł się w czasie z falą groźnych epidemii i plag szkodników. Coraz wyraźniejsza stawała się potrzeba, by uczeni dzielili się swoimi odkryciami na międzynarodowych kongresach dla dobra ludzkości. Przy odrobinie szczęścia uczestnicy kongresu będą mogli wymienić się wiedzą o patogenach, szczepionkach i środkach do zwalczania szkodników.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
