 andersson_anthropologist_achievement_total_human_fossils_anthropologist_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] odnalazł łącznie [Scope.Var('andersson_total_human_fossils_anthropologist_var').GetValue|V0] skamieniałości człowieka. Wśród tych skamieniałości znajdują się"
