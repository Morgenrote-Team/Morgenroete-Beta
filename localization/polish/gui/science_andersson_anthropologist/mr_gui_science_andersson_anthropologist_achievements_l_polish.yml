 andersson_anthropologist_achievement_invented_anthropology_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] jest pierwszym naukowcem, który skrupulatnie i niezwykle precyzyjnie dokumentował ludzkie kości i szkielety. [Scope.GetCharacter.GetSheHe|U] jest uznawany za #V pioniera antropologii#!.#!"
 andersson_anthropologist_no_anthropologist_loc: "#V Osiągnięcia tego [concept_andersson_anthropologist]#! zostaną wyświetlone tutaj, gdy tylko będziesz go posiadać."
