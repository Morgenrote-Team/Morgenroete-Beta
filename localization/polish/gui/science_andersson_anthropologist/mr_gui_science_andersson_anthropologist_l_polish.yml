l_polish:
 MR_ACTIVE_ANTHROPOLOGIST_TRIGGER_TT: "\#default_text [GetPlayer.GetName] posiada [concept_andersson_anthropologist], który #V nie jest zajęty#!.#!"
 MR_HAS_ANTHROPOLOGIST_TRIGGER_TT: "\#default_text [GetPlayer.GetName] posiada [concept_andersson_anthropologist].#!"
 MR_ANTHROPOLOGY_10_COUNTRIES_WITH_ANTHROPOLOGIST_TRIGGER_TT: "\#default_text 10 lub więcej krajów w [GetGeographicRegion('geographic_region_americas').GetName] posiada [concept_andersson_anthropologist].#!"
 MR_ANTHROPOLOGIST_CAVE_EXPLORATION_BUTTON: "Eksploracja jaskiń"
 MR_ANTHROPOLOGIST_CAVE_EXPLORATION_BUTTON_TT: "\#T Eksploracja jaskiń#!\nZ pomocą [concept_andersson_anthropologist] można zbadać wcześniej znane [Concept('concept_andersson_cave','$concept_andersson_caves$')] znajdujące się na terytorium kraju.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ANTHROPOLOGIST_HAS_CAVE_TRIGGER_TT: "\#default_text [GetPlayer.GetName] posiada [concept_andersson_cave].#!"
 MR_ANTHROPOLOGIST_NOT_HAS_CAVE_MODIFIER_TRIGGER_TT: "\#default_text [GetPlayer.GetName] #n nie#! posiada modyfikatora #V $andersson_cave_exploration_modifier$#!.#!"
 MR_ANTHROPOLOGIST_SKELETON_RECONSTRUCTION_BUTTON: "Rekonstrukcja szkieletu"
 MR_ANTHROPOLOGIST_SKELETON_RECONSTRUCTION_BUTTON_TT: "\#T Rekonstrukcja szkieletu#!\nZ pomocą [concept_andersson_anthropologist] można wykorzystać [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] do rekonstrukcji [concept_andersson_skeleton].\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ANTHROPOLOGIST_CAN_RECONSTRUCT_TRIGGER_TT: "\#default_text [GetPlayer.GetName] posiada co najmniej #V 5#! @andersson_human_fossil! [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] należących do szkieletu, który nie został jeszcze zrekonstruowany.#!"
 MR_ANTHROPOLOGIST_HAS_INTITUTE_TRIGGER_TT: "\#default_text [GetPlayer.GetName] posiada [GetBuildingType('building_andersson_institute').GetName].#!"
 MR_RECALL_ANTHROPOLOGIST_BUTTON_TT: "\#T Odwołaj antropologa#!\nCzasami okoliczności mogą wymagać przedwczesnego zakończenia eksploracji jaskini. [concept_andersson_anthropologist] będzie wtedy dostępny przed upływem wyznaczonego terminu, ale nie przyniesie ze sobą żadnych znalezisk.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ORIGIN_CONGRESS_BUTTON: "Kongres na temat pochodzenia człowieka"
 MR_ORIGIN_CONGRESS_BUTTON_TT: "\#T Kongres na temat pochodzenia współczesnego człowieka#!\nWraz z odkryciem kości prehistorycznych ludzi pojawiło się również pytanie o pierwotne pochodzenie człowieka. Podczas gdy Darwin zakładał pochodzenie afrykańskie, inni wysuwali teorię kilku równoległych linii rozwoju. Od przełomu XIX i XX wieku dominował pogląd, że współczesny człowiek wykształcił się w Azji.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ANTHROPOLOGY_INSTITUTE_TRIGGER_TT: "\#default_text [GetPlayer.GetName] posiada [GetBuildingType('building_andersson_institute').GetName].#!"
 MR_ORIGIN_CONGRESS_SPECIAL_HUMAN_FOSSIL_TT: "\#default_text [GetPlayer.GetName] posiada co najmniej #V 5#! @andersson_human_fossil! [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] jednego z tych gatunków: #V pitekantrop#! lub #V australopitek#!.#!"
 MR_ORIGIN_CONGRESS_GLOBAL_HUMAN_FOSSIL_TT: "\#default_text Na całym świecie odnaleziono co najmniej #V 250#! @andersson_human_fossil! [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] (obecnie odnaleziono [GetGlobalVariable('dubois_global_human_fossil').GetValue|+0] @andersson_human_fossil!).#!"
 NEOANTHROPUS_VAR: "@andersson_neoanthropus_fossil!  [GetPlayer.MakeScope.Var('andersson_neoanthropus_fossil_var').GetValue|V0]"
 NEOANTHROPUS_VAR_TT: "\#header Skamieniałości neoantropów [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')]#!\n[GetPlayer.GetName] odnalazł @andersson_neoanthropus_fossil! [GetPlayer.MakeScope.Var('andersson_neoanthropus_fossil_var').GetValue|V0] skamieniałości neoantropów [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')]\n\nSkamieniałości neoantropów:\n[GetPlayer.GetCustom('andersson_vero_fossil_discovered_type')][GetPlayer.GetCustom('andersson_lagoa_santa_fossil_discovered_type')][GetPlayer.GetCustom('andersson_cro_magnon_fossil_discovered_type')][GetPlayer.GetCustom('andersson_boskop_fossil_discovered_type')][GetPlayer.GetCustom('andersson_tianyuan_fossil_discovered_type')][GetPlayer.GetCustom('andersson_talgai_fossil_discovered_type')]"
 PALAEANTHROPUS_VAR: "@andersson_palaeanthropus_fossil!  [GetPlayer.MakeScope.Var('andersson_palaeanthropus_fossil_var').GetValue|V0]"
 PALAEANTHROPUS_VAR_TT: "\#header Skamieniałości paleoantropów [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')]#!\n[GetPlayer.GetName] odnalazł @andersson_palaeanthropus_fossil! [GetPlayer.MakeScope.Var('andersson_palaeanthropus_fossil_var').GetValue|V0] skamieniałości paleoantropów [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')]\n\nSkamieniałości paleoantropów:\n[GetPlayer.GetCustom('andersson_neanderthal_fossil_discovered_type')][GetPlayer.GetCustom('andersson_gibraltar_fossil_discovered_type')][GetPlayer.GetCustom('andersson_spy_fossil_discovered_type')][GetPlayer.GetCustom('andersson_krapina_fossil_discovered_type')][GetPlayer.GetCustom('andersson_galilee_fossil_discovered_type')]"
 PITHECANTHROPUS_VAR: "@andersson_pithecanthropus_fossil!  [GetPlayer.MakeScope.Var('andersson_pithecanthropus_fossil_var').GetValue|V0]"
 PITHECANTHROPUS_VAR_TT: "\#header Skamieniałości pitekantropów [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')]#!\n[GetPlayer.GetName] odnalazł @andersson_pithecanthropus_fossil! [GetPlayer.MakeScope.Var('andersson_pithecanthropus_fossil_var').GetValue|V0] skamieniałości pitekantropów [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')]\n\nSkamieniałości pitekantropów:\n[GetPlayer.GetCustom('andersson_heidelberg_fossil_discovered_type')][GetPlayer.GetCustom('andersson_rhodesian_fossil_discovered_type')][GetPlayer.GetCustom('andersson_peking_fossil_discovered_type')][GetPlayer.GetCustom('andersson_java_fossil_discovered_type')]"
 AUSTRALOPITHECUS_VAR: "@andersson_australopithecus_fossil!  [GetPlayer.MakeScope.Var('andersson_australopithecus_fossil_var').GetValue|V0]"
 AUSTRALOPITHECUS_VAR_TT: "\#header Skamieniałości australopiteków [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')]#!\n[GetPlayer.GetName] odnalazł @andersson_australopithecus_fossil! [GetPlayer.MakeScope.Var('andersson_australopithecus_fossil_var').GetValue|V0] skamieniałości australopiteków [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')]\n\nSkamieniałości australopiteków:\n[GetPlayer.GetCustom('andersson_australopithecus_fossil_discovered_type')]"
 PREHISTORIC_ARTIFACTS_VAR: "@andersson_prehistoric_artifact!  [GetPlayer.MakeScope.Var('andersson_prehistoric_artifact_var').GetValue|V0]"
 PREHISTORIC_ARTIFACTS_VAR_TT: "\#header [Concept('concept_andersson_prehistoric_artifact','$concept_andersson_prehistoric_artifacts$')]#!\n[GetPlayer.GetName] odnalazł @andersson_prehistoric_artifact! [GetPlayer.MakeScope.Var('andersson_prehistoric_artifact_var').GetValue|V0] [Concept('concept_andersson_prehistoric_artifact','$concept_andersson_prehistoric_artifacts$')]"
 MR_ANTHROPOLOGIST_ANTHROPOLOGICAL_RESEARCH_BUTTON: "Badania antropologiczne"
 MR_ANTHROPOLOGIST_ANTHROPOLOGICAL_RESEARCH_BUTTON_TT: "\#T Badania antropologiczne#!\n[concept_andersson_anthropologist] skupi się przede wszystkim na poszukiwaniu [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] oraz [Concept('concept_andersson_prehistoric_artifact','$concept_andersson_prehistoric_artifacts$')], szukając stanowisk na terenie całego kraju.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ANTHROPOLOGIST_HOMINID_PROSPECTING_BUTTON: "Poszukiwanie hominidów"
 MR_ANTHROPOLOGIST_HOMINID_PROSPECTING_BUTTON_TT: "\#T Poszukiwanie hominidów#!\n[concept_andersson_anthropologist] wraz ze swoim zespołem może poszukiwać stanowisk antropologicznych, aby odnaleźć szczątki wymarłych gatunków człowieka. Można pozyskać [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] oraz [Concept('concept_andersson_prehistoric_artifact','$concept_andersson_prehistoric_artifacts$')]. Archaiczne formy człowieka można odnaleźć wyłącznie przy użyciu nowoczesnych metod produkcji w naszym [GetBuildingType('building_andersson_institute').GetName].\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ANTHROPOLOGIST_HOMINID_PROSPECTING_POSSIBLE_TRIGGER_TT: "\#default_text [GetPlayer.GetName] posiada #n co najmniej jeden#! stan w następujących regionach geograficznych: [GetGeographicRegion('andersson_geographic_region_neoanthropus').GetName], [GetGeographicRegion('andersson_geographic_region_palaeanthropus').GetName], [GetGeographicRegion('andersson_geographic_region_pithecanthropus').GetName], [GetGeographicRegion('andersson_geographic_region_australopithecus').GetName].#!"
 MR_ANTHROPOLOGIST_IS_SPELEOLOGIST_TRIGGER_TT: "\#default_text [concept_andersson_anthropologist] posiada #V $andersson_speleologist$#! [concept_character_trait].#!"
 MR_ANTHROPOLOGIST_EXPOSE_PILTDOWN_FRAUD_BUTTON: "Zdemaskuj oszustwo związane z człowiekiem [GetPlayer.GetCustom('andersson_fossil_piltdown')]"
 MR_ANTHROPOLOGIST_EXPOSE_PILTDOWN_FRAUD_BUTTON_TT: "\#T Zdemaskuj oszustwo związane z człowiekiem [GetPlayer.GetCustom('andersson_fossil_piltdown')]#!\nIstnieje duże prawdopodobieństwo, że ciesząca się obecnie złą sławą skamieniałość [GetPlayer.GetCustom('andersson_fossil_piltdown')] jest fałszerstwem. Jednak [GetGlobalVariable('andersson_piltdown_country_global_var').GetCountryDefinition.GetName] prawdopodobnie będzie za wszelką cenę bronić tej niezwykle prestiżowej skamieniałości za pośrednictwem swoich badaczy. Czas zdemaskować to oszustwo!\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ANTHROPOLOGY_RATING_PILTDOWN_FRAUD_TT: "\#default_text [GetPlayer.GetName] posiada co najmniej #V 100#! punktów prestiżu antropologicznego.#!"
 MR_ANTHROPOLOGY_PILTDOWN_NO_RECENT_TRY_TRIGGER_TT: "\#default_text [GetPlayer.GetName] nie posiada modyfikatora #V $andersson_piltdown_debate_lost_modifier$#!.#!"
 MR_ANTHROPOLOGY_PILTDOWN_NO_CURRENT_DEBATE_TRIGGER_TT: "\#default_text Nie trwa obecnie #R żadna debata#! dotycząca człowieka [GetPlayer.GetCustom('andersson_fossil_piltdown')].#!"
 MR_ANTHROPOLOGY_PILTDOWN_CAN_BE_EXPOSED_TRIGGER_TT: "\#default_text [GetGlobalVariable('andersson_piltdown_country_global_var').GetCountryDefinition.GetName] nie obronił skutecznie człowieka [GetPlayer.GetCustom('andersson_fossil_piltdown')] w ciągu ostatnich 5 lat.#!"
 TOTAL_HUMAN_FOSSILS_VAR: "@andersson_human_fossil!  [GetPlayer.MakeScope.Var('andersson_total_human_fossil').GetValue|V0]"
 TOTAL_HUMAN_FOSSILS_VAR_TT: "\#header Łącznie [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')]#!\n[GetPlayer.GetName] odnalazł @andersson_human_fossil! [GetPlayer.MakeScope.Var('andersson_total_human_fossil').GetValue|V0] z łącznie @andersson_human_fossil! [GetGlobalVariable('andersson_global_human_fossil_global_var').GetValue|V0] [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')]"
 SPECIAL_HUMAN_FOSSILS_VAR: "@andersson_special_human_fossil_var!  [GetPlayer.MakeScope.Var('andersson_special_human_fossil_var').GetValue|V0]"
 SPECIAL_HUMAN_FOSSILS_VAR_TT: "\#header Specjalne [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')]#!\n[GetPlayer.GetName] odnalazł @andersson_special_human_fossil_var! [GetPlayer.MakeScope.Var('andersson_special_human_fossil_var').GetValue|V0] specjalnych [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')]\n\nSpecjalne skamieniałości:\n[GetPlayer.GetCustom('andersson_piltdown_fossil_discovered_type')][GetPlayer.GetCustom('andersson_paranthropus_fossil_discovered_type')][GetPlayer.GetCustom('andersson_clovis_fossil_discovered_type')][GetPlayer.GetCustom('andersson_dragon_fossil_discovered_type')][GetPlayer.GetCustom('andersson_floresiensis_fossil_discovered_type')]"
 PREHISTORIC_VENUSES_VAR: "@andersson_prehistoric_venus!  [GetPlayer.MakeScope.Var('andersson_prehistoric_venus_var').GetValue|V0]"
 PREHISTORIC_VENUSES_VAR_TT: "\#header [Concept('concept_andersson_prehistoric_artifact','$concept_andersson_prehistoric_venuses$')]#!\n[GetPlayer.GetName] odnalazł @andersson_prehistoric_venus! [GetPlayer.MakeScope.Var('andersson_prehistoric_venus_var').GetValue|V0] [Concept('concept_andersson_prehistoric_artifact','$concept_andersson_prehistoric_venuses$')]"
 MR_ANTHROPOLOGIST_HOMINID_EXPEDITION_BUTTON: "Ekspedycja w poszukiwaniu hominidów"
 MR_ANTHROPOLOGIST_HOMINID_EXPEDITION_BUTTON_TT: "\#T Ekspedycja w poszukiwaniu hominidów#!\n[concept_andersson_anthropologist] wraz ze swoim zespołem może rozpocząć ekspedycję w celu poszukiwania wymarłych gatunków człowieka w krajach zależnych. Obowiązują podobne warunki jak w przypadku poszukiwań hominidów na własnym terytorium.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ANTHROPOLOGIST_HOMINID_EXPEDITION_POSSIBLE_TRIGGER_TT: "\#default_text [GetPlayer.GetName] ma #n co najmniej jednego#! bezpośredniego poddanego, który posiada stan w następujących regionach geograficznych: [GetGeographicRegion('andersson_geographic_region_neoanthropus').GetName], [GetGeographicRegion('andersson_geographic_region_palaeanthropus').GetName], [GetGeographicRegion('andersson_geographic_region_pithecanthropus').GetName], [GetGeographicRegion('andersson_geographic_region_australopithecus').GetName].#!"
 MR_ANTHROPOLOGIST_NOT_HAS_EXPEDITION_MODIFIER_TRIGGER_TT: "\#default_text [GetPlayer.GetName] #n nie#! posiada modyfikatora #V $andersson_hominid_expedition_modifier$#!.#!"
 MR_ANTHROPOLOGIST_CRANIOMETRY_BUTTON: "Kraniometria"
 MR_ANTHROPOLOGIST_CRANIOMETRY_BUTTON_TT: "\#T Kraniometria#!\nPomiar czaszek jest uważany za jedno z najbardziej prestiżowych zadań dla antropologa. Raz w swojej karierze antropolog może całkowicie poświęcić się swoim ukochanym czaszkom, dzięki czemu zwiększa swoje doświadczenie i zdobywa nowe umiejętności.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ANDERSSON_25_BONES_TRIGGER_TT: "\#default_text [GetPlayer.GetName] posiada co najmniej #V 25#! @andersson_human_fossil! [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')].#!"
 MR_ANTHROPOLOGIST_NOT_DONE_CRANIOMETRY_TRIGGER_TT: "#default_text Nasz antropolog #R jeszcze nie przeprowadził#! żadnych badań kraniometrycznych.#!"
 MR_ANTHROPOLOGIST_NEOLITHIC_BUTTON: "Epoka neolitu"
 MR_ANTHROPOLOGIST_NEOLITHIC_BUTTON_TT: "\#T Epoka neolitu#!\nDla wielu zwykłych ludzi przeszłość pierwszych ludzi pozostaje czymś abstrakcyjnym. Antropolog może urządzić na uniwersytecie sale, które pozwolą lepiej zobrazować życie w tamtej epoce. W każdym uniwersytecie może istnieć tylko jedna taka scenografia. W tym przypadku pozwól swojemu antropologowi stworzyć scenografię z epoki neolitu.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ANTHROPOLOGIST_MESOLITHIC_BUTTON: "Epoka mezolitu"
 MR_ANTHROPOLOGIST_MESOLITHIC_BUTTON_TT: "\#T Epoka mezolitu#!\nDla wielu zwykłych ludzi przeszłość pierwszych ludzi pozostaje czymś abstrakcyjnym. Antropolog może urządzić na uniwersytecie sale, które pozwolą lepiej zobrazować życie w tamtej epoce. W każdym uniwersytecie może istnieć tylko jedna taka scenografia. W tym przypadku pozwól swojemu antropologowi stworzyć scenografię z epoki mezolitu.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ANTHROPOLOGIST_UPPER_PALEOLITHIC_BUTTON: "Górny paleolit"
 MR_ANTHROPOLOGIST_UPPER_PALEOLITHIC_BUTTON_TT: "\#T Górny paleolit#!\nDla wielu zwykłych ludzi przeszłość pierwszych ludzi pozostaje czymś abstrakcyjnym. Antropolog może urządzić na uniwersytecie sale, które pozwolą lepiej zobrazować życie w tamtej epoce. W każdym uniwersytecie może istnieć tylko jedna taka scenografia. W tym przypadku pozwól swojemu antropologowi stworzyć scenografię z górnego paleolitu.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ANDERSSON_NEOANTHROPUS_FOSSIL_TRIGGER: "\#default_text [GetPlayer.GetName] posiada co najmniej #V 1#! @andersson_neoanthropus_fossil! skamieniałość neoantropa.#!"
 MR_ANDERSSON_NEOANTHROPUS_SKELETON_TRIGGER: "\#default_text [GetPlayer.GetName] posiada co najmniej #V 1#! @andersson_neoanthropus_skeleton! szkielet neoantropa.#!"
 MR_ANDERSSON_20_BONES_TRIGGER_TT: "\#default_text [GetPlayer.GetName] posiada co najmniej #V 20#! @andersson_human_fossil! [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')].#!"
 MR_ANDERSSON_50_BONES_TRIGGER_TT: "\#default_text [GetPlayer.GetName] posiada co najmniej #V 50#! @andersson_human_fossil! [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')].#!"
 MR_ANDERSSON_100_BONES_TRIGGER_TT: "\#default_text [GetPlayer.GetName] posiada co najmniej #V 100#! @andersson_human_fossil! [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')].#!"
 MR_NO_OUR_ANCESTORS_TRIGGER_TT: "\#default_text [GetPlayer.GetName] posiada co najmniej jeden uniwersytet bez #V Historii naszych przodków#!.#! "
 MR_ANDERSSON_PALAEANTHROPUS_SKELETON_TRIGGER: "\#default_text [GetPlayer.GetName] posiada co najmniej #V 1#! @andersson_palaeanthropus_skeleton! szkielet paleoantropa.#!"
 MR_ANDERSSON_PITHECANTHROPUS_SKELETON_TRIGGER: "\#default_text [GetPlayer.GetName] posiada co najmniej #V 1#! @andersson_pithecanthropus_skeleton! szkielet pitekantropa.#!"
 MR_ANDERSSON_200_BONES_TRIGGER_TT: "\#default_text [GetPlayer.GetName] posiada co najmniej #V 200#! @andersson_human_fossil! [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')].#!"
 MR_ANDERSSON_300_BONES_TRIGGER_TT: "\#default_text [GetPlayer.GetName] posiada co najmniej #V 300#! @andersson_human_fossil! [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')].#!"
 MR_ANTHROPOLOGIST_NEW_SYSTEMATIZATION_BUTTON: "Nowa systematyka"
 MR_ANTHROPOLOGIST_NEW_SYSTEMATIZATION_BUTTON_TT: "\#T Nowa systematyka#!\nObecna klasyfikacja znalezisk jako różnych „ludzi” w zależności od miejsca ich odkrycia doprowadziła do niemal nieograniczonej liczby fragmentarycznych nazw. Doświadczony antropolog może wykorzystać nową teorię i systematykę, aby odrzucić przestarzałe kategorie i zmodernizować antropologię.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ANTHROPOLOGIST_AT_LEAST_200_EXPERIENCE_TRIGGER_TT: "\#default_text [GetPlayer.GetName] posiada [concept_andersson_anthropologist] z co najmniej #V 200#! punktami doświadczenia#!.#!"
 MR_ANTHROPOLOGIST_CAN_SYSTEMIZE_NEOANTHROPUS_TRIGGER_TT: "#default_text Odkryto wszystkie sześć różnych gatunków neoantropów.#!"
 MR_ANTHROPOLOGIST_CAN_SYSTEMIZE_PALAEANTHROPUS_TRIGGER_TT: "#default_text Odkryto wszystkie pięć różnych gatunków paleoantropów.#!"
