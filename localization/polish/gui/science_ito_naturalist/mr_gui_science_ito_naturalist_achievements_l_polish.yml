l_polish:
 MR_NATURALIST_ACHIEVEMENTS_TT: "[AddLocalizationIf( Scope.IsSet , 'ito_naturalist_achievements_loc')][AddLocalizationIf( Not(Scope.IsSet) , 'ito_naturalist_no_naturalist_loc')]"
 ito_naturalist_achievements_loc: "$ito_naturalist_achievements_intro_loc$[Scope.GetCharacter.GetCustom('ito_naturalist_achievement_total_zoo_animals_type')][Scope.GetCharacter.GetCustom('ito_naturalist_achievement_total_wildlife_documentaries_type')][AddLocalizationIf( Scope.Var('ito_naturalist_achievement_invented_evolution_theory_var').IsSet , Scope.Var('ito_naturalist_achievement_invented_evolution_theory_var').GetFlagName)][AddLocalizationIf( Scope.Var('ito_naturalist_achievement_attended_hippocampus_congress_var').IsSet , Scope.Var('ito_naturalist_achievement_attended_hippocampus_congress_var').GetFlagName)][AddLocalizationIf( Scope.Var('ito_naturalist_achievement_showed_evolution_in_peppered_moths_var').IsSet , Scope.Var('ito_naturalist_achievement_showed_evolution_in_peppered_moths_var').GetFlagName)][AddLocalizationIf( Scope.Var('ito_naturalist_achievement_finished_pacific_expedition_var').IsSet , Scope.Var('ito_naturalist_achievement_finished_pacific_expedition_var').GetFlagName)][AddLocalizationIf( Scope.Var('ito_naturalist_achievement_wallace_line_discovered_var').IsSet , Scope.Var('ito_naturalist_achievement_wallace_line_discovered_var').GetFlagName)][AddLocalizationIf( Scope.Var('ito_naturalist_achievement_great_barrier_reef_discovered_var').IsSet , Scope.Var('ito_naturalist_achievement_great_barrier_reef_discovered_var').GetFlagName)][AddLocalizationIf( Scope.Var('ito_naturalist_achievement_inaugurated_zoo_var').IsSet , Scope.Var('ito_naturalist_achievement_inaugurated_zoo_var').GetFlagName)][AddLocalizationIf( Scope.Var('ito_naturalist_achievement_found_victoria_amazonica_var').IsSet , Scope.Var('ito_naturalist_achievement_found_victoria_amazonica_var').GetFlagName)][AddLocalizationIf( Scope.Var('ito_naturalist_achievement_found_attacus_atlas_var').IsSet , Scope.Var('ito_naturalist_achievement_found_attacus_atlas_var').GetFlagName)][AddLocalizationIf( Scope.Var('ito_naturalist_achievement_found_amorphophallus_titanum_var').IsSet , Scope.Var('ito_naturalist_achievement_found_amorphophallus_titanum_var').GetFlagName)][AddLocalizationIf( Scope.Var('ito_naturalist_achievement_found_goliathus_var').IsSet , Scope.Var('ito_naturalist_achievement_found_goliathus_var').GetFlagName)][AddLocalizationIf( Scope.Var('ito_natualist_achievement_forestry_improvement_finished_var').IsSet , Scope.Var('ito_natualist_achievement_forestry_improvement_finished_var').GetFlagName)][AddLocalizationIf( Scope.Var('ito_naturalist_achievement_rubber_improvement_finished_var').IsSet , Scope.Var('ito_naturalist_achievement_rubber_improvement_finished_var').GetFlagName)]"
 ito_naturalist_no_naturalist_loc: "#V Osiągnięcia postaci [concept_dubois_naturalist]#! zostaną tutaj odnotowane, gdy zdobędzie takie zasługi."
 ito_naturalist_achievements_intro_loc: "#V Osiągnięcia tego Przyrodnika#!\n #indent_newline:3 • [Scope.GetCharacter.GetFullName] jest wybitnym Przyrodnikiem, którego wytrwała praca zaowocowała zebraniem [Scope.Var('dubois_naturalist_total_specimens_var').GetValue|0*V] [Concept('concept_dubois_specimen','$concept_dubois_specimens|q$')], poszerzając granice wiedzy naukowej.#!"
 ito_naturalist_achievement_total_zoo_animals_loc: "\n #indent_newline:3 • W trakcie [Scope.GetCharacter.GetHerHis] pracy na stanowisku Przyrodnika pozyskano łącznie [Scope.GetVariable('ito_naturalist_total_zoo_animals_var').GetValue|0+] [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals|q$')], które sprowadzono do państwa [GetPlayer.MakeScope.GetCountry.GetName], wzbogacając krajowe zbiory zoologiczne i upowszechniając wiedzę wśród społeczeństwa.#!"
 ito_naturalist_achievement_total_wildlife_documentaries_loc: "\n #indent_newline:3 • [GetPlayer.MakeScope.Var('ito_naturalist_var').GetCharacter.GetFullName] oddał nieocenione zasługi nauce, dokumentując [GetPlayer.MakeScope.Var('ito_naturalist_var').GetVariable('ito_character_num_animal_documentations_var').GetValue|0+] [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals|q$')] w ich naturalnych siedliskach, przyczyniając się tym samym do rozwoju historii naturalnej.#!"
 ito_naturalist_achievement_invented_evolution_theory_loc: "\n #indent_newline:3 • Do [Scope.GetCharacter.GetHerHis] najwybitniejszych osiągnięć należy dzieło „#V O powstawaniu gatunków#!”, w którym po raz pierwszy wyłożono teorię ewolucji, na zawsze zmieniając bieg nauk biologicznych.#!"
 ito_naturalist_achievement_attended_hippocampus_congress_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] uczestniczył w prestiżowym Kongresie Hipokampa, biorąc udział w wnikliwej debacie na temat wyjątkowości człowieka w królestwie zwierząt.#!"
 ito_naturalist_achievement_showed_evolution_in_peppered_moths_loc: "\n #indent_newline:3 • Profesor [Scope.GetCharacter.GetLastNameNoFormatting] dostarczył empirycznych dowodów przystosowania u #V Krępaka Nabrzozaka#!, potwierdzając tym samym założenia teorii ewolucji dzięki skrupulatnym obserwacjom.#!"
 ito_naturalist_achievement_finished_pacific_expedition_loc: "\n #indent_newline:3 • Podczas #V Wyprawy na Pacyfik#! Dr. [Scope.GetCharacter.GetLastNameNoFormatting] przeprowadził szczegółowe badania flory i fauny regionu, odkrywając liczne gatunki dotąd nieznane nauce.#!"
 ito_naturalist_achievement_wallace_line_discovered_loc: "\n #indent_newline:3 • Podczas podróży po Pacyfiku [Scope.GetCharacter.GetLastNameNoFormatting] dostrzegł #V Wyraźną Granicę między Florą i Fauną Azji a Australii#!. Odkrycie to potwierdziło słuszność teorii ewolucji i rzuciło światło na pradawne rozdzielenie tych lądów.#!"
 ito_naturalist_achievement_inaugurated_zoo_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetLastNameNoFormatting] odegrał kluczową rolę w #V Utworzeniu Ogrodu Zoologicznego#!, umożliwiając zwiedzającym obserwację egzotycznych gatunków i przyczyniając się do popularyzacji nauki.#!"
 ito_naturalist_achievement_found_victoria_amazonica_loc: "\n #indent_newline:3 • Podczas wyprawy botanicznej do Amazonii Profesor [Scope.GetCharacter.GetLastNameNoFormatting] odkrył #V Wiktorię Królewską#!, cud natury, którego liście mogą osiągać imponującą średnicę trzech metrów.#!"
 ito_naturalist_achievement_found_attacus_atlas_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] natrafił na #V Pawicę Atlas#!, olbrzymią ćmę z Indochin, wyróżniającą się rozmiarami i wytrzymałością jedwabiu, poszerzając tym samym wiedzę entomologiczną.#!"
 ito_naturalist_achievement_found_amorphophallus_titanum_loc: "\n #indent_newline:3 • Podczas eksploracji Borneo Profesor [Scope.GetCharacter.GetLastNameNoFormatting] rozpoznał #V Dziwidło Olbrzymie#!, ogromny kwiat osiągający wysokość trzech metrów, będący niezwykle interesującym fenomenem botanicznym.#!"
 ito_naturalist_achievement_found_goliathus_loc: "\n #indent_newline:3 • W lasach deszczowych Konga Dr. [Scope.GetCharacter.GetLastNameNoFormatting] odkrył #V Goliata#!, jednego z największych znanych owadów, którego rzadkość występowania i imponujące rozmiary wzbudziły zachwyt środowiska naukowego.#!"
 ito_natualist_achievement_forestry_improvement_finished_loc: "\n #indent_newline:3 • Profesor [Scope.GetCharacter.GetLastNameNoFormatting] słynie z [Scope.GetCharacter.GetHerHis] pionierskich badań nad leśnictwem, przyczyniających się do rozwoju metod zrównoważonego gospodarowania zasobami leśnymi i poprawy ich stanu.#!"
 ito_naturalist_achievement_rubber_improvement_finished_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetHerHis|U] staranne eksperymenty z uprawą kauczukowców znacznie zwiększyły wydajność plantacji, przynosząc państwu pokaźne korzyści.#!"
 ito_naturalist_achievement_great_barrier_reef_discovered_loc: "\n #indent_newline:3 • Podczas podróży naukowej na Pacyfik Dr. [Scope.GetCharacter.GetLastNameNoFormatting] przeprowadził szczegółowe badania #V Wielkiej Rafy Koralowej#!, jako pierwszy dostrzegając jej ogromne znaczenie ekologiczne.#!"