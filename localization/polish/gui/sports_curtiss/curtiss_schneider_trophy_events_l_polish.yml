l_polish:
 curtiss_schneider_trophy_event_mechanical_problems_icon_flag: "@curtiss_event_log_negative_mechanical_problems_icon!"
 curtiss_schneider_trophy_event_mechanical_problems_title_flag: "Problemy Mechaniczne"
 curtiss_schneider_trophy_event_mechanical_problems_flag: "#t $curtiss_schneider_trophy_event_mechanical_problems_title_flag$#!\n$curtiss.121.d$"
 curtiss_schneider_trophy_event_crash_icon_flag: "@curtiss_event_log_negative_crash_icon!"
 curtiss_schneider_trophy_event_crash_title_flag: "Katastrofa Lotnicza"
 curtiss_schneider_trophy_event_crash_flag: "#t $curtiss_schneider_trophy_event_crash_title_flag$#!\nPodczas wykonywania manewru pilot przecenił swoje umiejętności i rozbił się na wodzie!"
 curtiss_schneider_trophy_event_buoy_icon_flag: "@curtiss_event_log_negative_buoy_icon!"
 curtiss_schneider_trophy_event_buoy_title_flag: "Przeoczona Boja"
 curtiss_schneider_trophy_event_buoy_flag: "#t $curtiss_schneider_trophy_event_buoy_title_flag$#!\nZespół pokonał okrążenie w wyścigu o Puchar Schneidera z dobrym wynikiem, jednak jednemu z pilotów groziła utrata punktów, ponieważ jeden z sędziów zarzucił mu ominięcie boi."
 curtiss_schneider_trophy_event_maximum_speed_icon_flag: "@curtiss_event_log_positive_speed_icon!"
 curtiss_schneider_trophy_event_maximum_speed_title_flag: "Prędkość Maksymalna"
 curtiss_schneider_trophy_event_maximum_speed_flag: "#t $curtiss_schneider_trophy_event_maximum_speed_title_flag$#!\nNa trasie wyścigu piloci zademonstrowali prędkość, jaką mogły osiągnąć ich samoloty."
 curtiss_schneider_trophy_event_slalom_icon_flag: "@curtiss_event_log_positive_slalom_icon!"
 curtiss_schneider_trophy_event_slalom_title_flag: "Manewry Slalomowe"
 curtiss_schneider_trophy_event_slalom_flag: "#t $curtiss_schneider_trophy_event_slalom_title_flag$#!\nPuchar Schneidera znany jest przede wszystkim jako zawody szybkościowe, jednak na trasie znajdowały się trzy lub cztery punkty kontrolne, które przy dużej prędkości łatwo było ominąć, co mogło skutkować dyskwalifikacją. Na szczęście dzięki manewrom slalomowym pilot nie ominął żadnego z nich."
 curtiss_schneider_trophy_event_fog_neutral_icon_flag: "@curtiss_event_log_fog_neutral_icon!"
 curtiss_schneider_trophy_event_fog_positive_icon_flag: "@curtiss_event_log_fog_positive_icon!"
 curtiss_schneider_trophy_event_fog_title_flag: "Mgła"
 curtiss_schneider_trophy_event_fog_neutral_flag: "#t $curtiss_schneider_trophy_event_fog_title_flag$#!\nFog was more often a problem on the waterways. Even experienced pilots could fail at this sudden challenge. This time the pilot barely made it through."
 curtiss_schneider_trophy_event_fog_positive_flag: "#t $curtiss_schneider_trophy_event_fog_title_flag$#!\nMgła częściej stanowiła problem na trasach wyścigów rozgrywanych nad wodą. Nawet doświadczeni piloci mogli nie sprostać temu nagłemu wyzwaniu. Tym razem pilot poradził sobie z nią bez problemu."
 curtiss_schneider_trophy_event_superior_flight_performance_icon_flag: "@curtiss_event_log_superior_flight_performance_positive_icon!"
 curtiss_schneider_trophy_event_superior_flight_performance_title_flag: "Doskonałe Osiągi w Locie"
 curtiss_schneider_trophy_event_superior_flight_performance_flag: "#t $curtiss_schneider_trophy_event_superior_flight_performance_title_flag$#!\nWyjątkowe umiejętności pilota znacznie zwiększyły szanse na zwycięstwo w Pucharze Schneidera!"
 curtiss_schneider_trophy_event_duel_positive_icon_flag: "@curtiss_event_log_duel_positive_icon!"
 curtiss_schneider_trophy_event_duel_title_positive_flag: "Pojedynek: Zwycięstwo"
 curtiss_schneider_trophy_event_duel_positive_flag: "#t $curtiss_schneider_trophy_event_duel_title_positive_flag$#!\nPodczas rywalizacji o najszybsze okrążenie dwóch pilotów niebezpiecznie zbliżyło się do siebie. Dzięki precyzyjnemu manewrowi pilot zdołał zwiększyć swoje szanse na zwycięstwo i osłabić bezpośredniego rywala."
 curtiss_schneider_trophy_event_duel_negative_icon_flag: "@curtiss_event_log_duel_negative_icon!"
 curtiss_schneider_trophy_event_duel_title_negative_flag: "Pojedynek: Porażka"
 curtiss_schneider_trophy_event_duel_negative_flag: "#t $curtiss_schneider_trophy_event_duel_title_negative_flag$#!\nIn the race for the fastest lap, two pilots came dangerously close. With a targeted maneuver the pilot tried to improve the chances of victory but failed miserably."
 curtiss_schneider_trophy_event_rivalry_icon_positive_flag: "@curtiss_event_log_rivalry_positive_icon!"
 curtiss_schneider_trophy_event_rivalry_title_positive_flag: "Rywalizacja: Zwycięstwo"
 curtiss_schneider_trophy_event_rivalry_positive_flag: "#t $curtiss_schneider_trophy_event_rivalry_title_positive_flag$#!\nAs Pucharu Schneidera miał z dawnych czasów rachunki do wyrównania ze swoim rywalem. Podczas brawurowego manewru wyeliminował znienawidzonego przeciwnika z wyścigu!"
 curtiss_schneider_trophy_event_rivalry_icon_negative_flag: "@curtiss_event_log_rivalry_negative_icon!"
 curtiss_schneider_trophy_event_rivalry_title_negative_flag: "Rywalizacja: Przegrana"
 curtiss_schneider_trophy_event_rivalry_negative_flag: "#t $curtiss_schneider_trophy_event_rivalry_title_negative_flag$#!\nAs Pucharu Schneidera miał z dawnych czasów rachunki do wyrównania ze swoim rywalem. Podczas brawurowego manewru próbował wyeliminować znienawidzonego przeciwnika z wyścigu! Próba zakończyła się niepowodzeniem."
 curtiss_schneider_trophy_event_rivalry_fly_ahead_icon_flag: "@curtiss_event_log_fly_ahead_positive_icon!"
 curtiss_schneider_trophy_event_rivalry_fly_ahead_title_flag: "Rywalizacja: Wysunięcie się na Prowadzenie"
 curtiss_schneider_trophy_event_rivalry_fly_ahead_flag: "#t $curtiss_schneider_trophy_event_rivalry_fly_ahead_title_flag$#!\nAs Pucharu Schneidera miał z dawnych czasów rachunki do wyrównania ze swoim rywalem. Zignorował jednak przeciwnika i wysunął się na prowadzenie."
 curtiss_schneider_trophy_event_rivalry_title_positive_opponent_flag: "Rywalizacja: Pokonany Rywal"
 curtiss_schneider_trophy_event_rivalry_positive_opponent_flag: "#t $curtiss_schneider_trophy_event_rivalry_title_positive_opponent_flag$#!\nInny pilot próbował wyrównać rachunki z tym pilotem. Jednak poniósł porażkę."
 curtiss_schneider_trophy_event_favorable_conditions_icon_flag: "@curtiss_event_log_favorable_conditions_positive_icon!"
 curtiss_schneider_trophy_event_favorable_conditions_title_flag: "Sprzyjające Warunki"
 curtiss_schneider_trophy_event_favorable_conditions_flag: "#t $curtiss_schneider_trophy_event_favorable_conditions_title_flag$#!\nDobre warunki pogodowe zwiększyły szanse na zwycięstwo."
 curtiss_schneider_trophy_event_team_member_ill_icon_flag: "@curtiss_event_log_team_member_ill_negative_icon!"
 curtiss_schneider_trophy_event_team_member_ill_title_flag: "Chory Członek Zespołu"
 curtiss_schneider_trophy_event_team_member_ill_flag: "#t $curtiss_schneider_trophy_event_team_member_ill_title_flag$#!\nPilot z zespołu startującego w Pucharze Schneidera zgłosił chorobę tuż przed wyścigiem."
 curtiss_schneider_trophy_event_strange_engine_failure_icon_flag: "@curtiss_event_log_strange_engine_failure_negative_icon!"
 curtiss_schneider_trophy_event_strange_engine_failure_title_flag: "Dziwna Awaria Silnika"
 curtiss_schneider_trophy_event_strange_engine_failure_flag: "#t $curtiss_schneider_trophy_event_strange_engine_failure_title_flag$#!\nDziwna awaria silnika doprowadza inżynierów do rozpaczy."
 curtiss_schneider_trophy_event_sabotage_prevented_icon_flag: "@curtiss_event_log_sabotage_prevented_positive_icon!"
 curtiss_schneider_trophy_event_sabotage_prevented_title_flag: "Sabotaż Udaremniony!"
 curtiss_schneider_trophy_event_sabotage_prevented_flag: "#t $curtiss_schneider_trophy_event_sabotage_prevented_title_flag$#!\nPróba sabotażu podjęta przez innego uczestnika wyścigu została udaremniona w ostatniej chwili."
 curtiss_schneider_trophy_event_sabotage_discovered_icon_flag: "@curtiss_event_log_sabotage_prevented_negative_icon!"
 curtiss_schneider_trophy_event_sabotage_discovered_title_flag: "Sabotaż Wykryty!"
 curtiss_schneider_trophy_event_sabotage_discovered_flag: "#t $curtiss_schneider_trophy_event_sabotage_discovered_title_flag$#!\nThe sabotage attempt of this country was discovered causing them to be shunned by the other participants."