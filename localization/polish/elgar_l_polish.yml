 je_elgar_composer_composing: "Kompozytor Tworzy"
 je_elgar_composer_composing_reason: "[ROOT.GetCountry.GetCustom('je_elgar_composer_composing_active_type')] [concept_elgar_composer], który nie jest zajęty żadnym innym projektem, będzie komponować utwory muzyczne.\nDopóki żaden inny projekt nie jest aktywny, za każde 12 miesięcy komponowania będziesz otrzymywać #G 5#! @elgar_music_tradition! [concept_elgar_musical_tradition] oraz #G 5#! #V Reputacji#!, a także pewną liczbę #V Kompozycji#!, zależnie od różnych okoliczności.\n$mr_divider_for_je$\n[GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetFullName] będzie tworzyć [ROOT.Var('elgar_estimated_yearly_compositions_var').GetValue|+=0] #V Kompozycji#! co 12 miesięcy."
