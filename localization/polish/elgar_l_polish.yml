 elgar.91.t: "Szklana Hala Tivoli"
 elgar.91.d: "Ogrody Tivoli od lat cieszą się ogromną popularnością wśród mieszkańców Kopenhagi. Plan zakłada budowę sali koncertowej dla około 1000 osób, w której publiczność będzie mogła delektować się porywającą muzyką."
 elgar.91.f: "Sala koncertowa była jedną z atrakcji Ogrodów Tivoli już w chwili ich otwarcia w 1843 roku. Był to prostokątny, drewniany budynek zaprojektowany przez Haralda Conrada Stillinga. Hans Christian Lumbye pełnił funkcję dyrektora muzycznego i głównego dyrygenta w latach 1843–1872. Skomponował dla orkiestry niemal 700 utworów, w szczególności polek, walców i galopów. W 1863 roku Johan Andreas Stillmann rozbudował salę koncertową."
 elgar.91.g: "Mam nadzieję, że pan Lumbye zaszczyci nas swoją obecnością i zaprezentuje słynne galopy!"
 elgar.92.t: "Gran Teatro Nacional"
 elgar.92.d: "W związku z planami budowy wielkiej opery w Meksyku rząd przygotowuje się do realizacji jednego z największych przedsięwzięć budowlanych w historii kraju."
 elgar.92.f: "Teatr został zbudowany w latach 1840–1844 w Meksyku przez architekta Lorenza de la Hidalgi. Historycy uważają go za najważniejsze dzieło architektury w Meksyku powstałe między ukończeniem Katedry Metropolitalnej a budową Pałacu Sztuk Pięknych. Wielki Teatr Narodowy został zainaugurowany podczas jednej z kadencji prezydenckich Antonio Lópeza de Santa Anny. Jego nazwa zmieniała się kolejno z Wielkiego Teatru Santa Anny na Wielki Teatr Vergara, następnie na Wielki Teatr Cesarski, aż w końcu na Wielki Teatr Narodowy. W sezonie operowym 1852 roku w teatrze odbyło się 17 premier operowych i ponad 60 przedstawień."
 elgar.93.t: "Teatro Amazonas"
 elgar.93.d: "Dzięki rozkwitowi regionu napędzanemu uprawą kauczukowca w Manaus ma powstać okazały gmach opery – w samym środku dżungli!"
 elgar.93.f: "Teatr Amazonas powstał w epoce Belle Époque, w okresie kauczukowego boomu, który pozwalał zdobywać fortuny na handlu kauczukiem. Pomysł jego budowy pojawił się po raz pierwszy w 1881 roku. Wysunął go Antonio José Fernandes Júnior, członek lokalnej Izby Reprezentantów, który marzył o stworzeniu „klejnotu” w samym sercu amazońskiej dżungli. Styl architektoniczny teatru zalicza się do neorenesansu. Dachówki sprowadzono z Alzacji, stalowe elementy konstrukcyjne ze szkockiego Glasgow, a marmur karraryjski, z którego wykonano schody, posągi i kolumny, z Włoch. Kopułę pokrywa 36 000 zdobionych płytek ceramicznych w kolorach brazylijskiej flagi narodowej. Wyposażenie wnętrz sprowadzono z Francji i utrzymano w stylu Ludwika XV. Włoski malarz Domenico de Angelis Młodszy stworzył malowidła na panelach zdobiących sufity audytorium i sali audiencyjnej."
 elgar.101.t: "Pomnik Beethovena"
 elgar.101.d: "W odpowiedzi na apel kompozytora Roberta Schumanna wielu intelektualistów, a także obywateli, patriotów i miłośników sztuki opowiedziało się za wzniesieniem pomnika Ludwiga van Beethovena w Bonn."
 elgar.101.f: "„Już teraz mam przed oczami przyszłe mauzoleum pamięci – dość wysoki prostopadłościan, na nim lira z datami urodzin i śmierci, nad nim niebo, a obok kilka drzew. Czy cały naród, mający przed sobą Beethovena, który na każdej stronie uczy go wielkości i dumy, nie powinien być w stanie wznieść mu pomnika tysiąckroć wspanialszego? Gdybym był księciem, zbudowałbym mu świątynię w stylu palladiańskim! Przedstawcie go w gigantycznej postaci, niczym świętego Karola Boromeusza nad jeziorem Maggiore, aby mógł, tak jak za życia, spoglądać ponad górami i pasmami górskimi. A gdy statki przepływające po Renie będą mijać ten pomnik i cudzoziemcy zapytają: „Co oznacza ten olbrzym?”, każde dziecko będzie mogło odpowiedzieć: „To Beethoven!” – a oni pomyślą, że to cesarz niemiecki. Jednym słowem: ruszcie się, otrząśnijcie z apatii i uświadomcie sobie, że ten pomnik będzie również waszym własnym!” – Robert Schumann"
 elgar.101.g: "Beethoven był niemieckim tytanem muzyki!"
 elgar.101.h: "Z przyjemnością sfinansujemy ten cenny dla kultury projekt."
 elgar.101.i: "Nie mógł być aż tak wielki, skoro wcześniej nie miał pomnika."
 elgar.102.t: "Przygotowania do Festiwalu Beethovena"
 elgar.102.d: "Prace wykończeniowe przy pomniku Beethovena dobiegły końca. Teraz czas przygotować się do uroczystego odsłonięcia."
 elgar.102.f: "Festiwal Beethovena zorganizowany z okazji odsłonięcia pomnika kompozytora był wielkim wydarzeniem muzycznym o międzynarodowej randze. Wśród zaproszonych gości znaleźli się nie tylko król Prus, lecz także brytyjska królowa Wiktoria. W uroczystościach uczestniczyli wybitni intelektualiści, tacy jak Alexander von Humboldt, a czterodniowy program uświetnili kompozytorzy tej miary co Hector Berlioz, Giacomo Meyerbeer, a przede wszystkim Franz Liszt. W festiwalu miały wziąć udział tysiące osób, co stanowiło poważne wyzwanie dla niewielkiego miasta Bonn."
 elgar.102.g: "Wyślij zaproszenia!"
 elgar.103.t: "Zaproszenie na Festiwal Beethovena"
 elgar.103.d: "Nasz rząd otrzymał oficjalne zaproszenie na Festiwal Beethovena w Bonn, podczas którego ma zostać odsłonięty pomnik kompozytora."
 elgar.103.g: "Z przyjemnością weźmiemy udział."
 elgar.103.h: "Muzyka klasyczna jest przeceniana."
 elgar.104.t: "Zbuduj Salę Beethovena"
 elgar.104.d: "Ze względu na dużą liczbę odwiedzających Franz Liszt zaproponował skierowanie do Bonn robotników i materiałów z placu budowy katedry w Kolonii, aby w rekordowo krótkim czasie wznieść salę festiwalową."
 elgar.104.f: "Uroczyste odsłonięcie pomnika Beethovena miało być głównym punktem trzydniowego Festiwalu Beethovena. Na miesiąc przed rozpoczęciem festiwalu wciąż nie było odpowiedniego miejsca, które mogłoby pomieścić spodziewanych 3000 uczestników. Za namową Liszta, który zgodził się pokryć wszystkie koszty z własnej kieszeni, komitet zatrudnił architekta i ekipę budowlaną do wzniesienia Sali Beethovena. Gdy wreszcie rozpoczęto prace, do ich ukończenia pozostało niespełna dwa tygodnie, dlatego robotnicy musieli pracować przez całą dobę, aby zdążyć na czas. Franz Liszt zwrócił się również do budowniczych katedry w Kolonii. Drewno transportowano z Kolonii do Bonn drogą wodną przez Ren. Równie szybko dotarły do Bonn wykonane w Kolonii dekoracje. W zaledwie jedenaście dni, niemal z niczego, powstała sala festiwalowa."
 elgar.104.g: "Wspaniale."
 elgar.105.t: "Festiwal Beethovena"
 elgar.105.d: "Po czterech dniach muzyki na najwyższym poziomie Festiwal Beethovena można uznać za pełny sukces, choć wydarzenia tej rangi nie mogą obyć się bez skandali."
 elgar.105.f: "Uroczystość nie obyła się bez niezręcznych sytuacji. Pomnik Beethovena był odwrócony plecami do najważniejszych gości – króla Prus Fryderyka Wilhelma IV i brytyjskiej królowej Wiktorii, którzy zajęli miejsca na balkonie Pałacu Fürstenbergów. Alexander von Humboldt uratował sytuację, zauważając, że Beethoven zawsze był człowiekiem nieco nieokrzesanym. Jeszcze bardziej krępująca sytuacja miała miejsce podczas wznoszenia toastów na bankiecie festiwalowym w lokalu „Goldene Stern”, gdzie Liszt zlekceważył francuską delegację pod przewodnictwem Berlioza, niemal doprowadzając do zamieszek. Bankiet zakłóciło również zachowanie Loli Montez, która tańczyła na stole i wprawiła Liszta w zakłopotanie, upierając się, że jest jego gościem podczas uroczystości i domagając się miejsca odpowiadającego jej rzekomej randze. W ten sposób zburzyła wcześniej ustalony porządek miejsc przy stole."
 elgar.105.g: "Beethoven odwraca się do nas plecami?"
 elgar.105.h: "Alexander von Humboldt to prawdziwy dżentelmen."
 elgar.105.i: "Ci Niemcy nie mają za grosz elegancji."
 elgar.105.j: "To było inspirujące."
 elgar.106.t: "Kantata Liszta"
 elgar.106.d: "Franz Liszt dostąpił wielkiego zaszczytu napisania i publicznego wykonania kantaty z okazji odsłonięcia pomnika Beethovena."
 elgar.106.f: "„Tak czy inaczej, jego kantata, wykonana naprawdę znakomicie i gorąco oklaskiwana przez trzy czwarte i jeszcze połowę publiczności, jest dziełem wielkim i pięknym, które od razu wynosi Liszta na bardzo wysoką pozycję wśród kompozytorów. Wyraz muzyczny jest w niej szczery, intonacja właściwa, styl wzniosły i nowatorski, forma dobrze przemyślana i starannie zrealizowana, a instrumentacja wyróżnia się niezwykłą siłą i różnorodnością. W jego orkiestrze nie ma monotonnych powtórzeń tych samych brzmień, które sprawiają, że niektóre niegdyś cenione utwory stają się dla słuchacza tak nużące. Liszt wie, jak wykorzystywać zarówno skromne, jak i bogate środki wyrazu, nie przeciąża ani instrumentów, ani głosów. Jednym słowem, za jednym zamachem udowodnił, że ma wyczucie stylu zarówno w instrumentacji, jak i w pozostałych dziedzinach sztuki muzycznej, choć obawiano się, że jeszcze go nie odnalazł”. – Hector Berlioz"
 elgar.106.g: "Chwała! Chwała! Beethovenowi, chwała!"
 elgar.107.t: "Berlioz na Festiwalu Beethovena"
 elgar.107.d: "Uroczystości związane z odsłonięciem pomnika Beethovena stały się dla kompozytora Hectora Berlioza źródłem niemałej inspiracji."
 elgar.107.f: "„To właśnie podczas tej podróży przez Austrię, Węgry, Czechy i Śląsk rozpocząłem komponowanie mojej Legendy o Fauście, której plan od dawna nosiłem w myślach. Gdy tylko postanowiłem przystąpić do pracy, musiałem pogodzić się z koniecznością samodzielnego napisania większości libretta. Fragmenty francuskiego przekładu Fausta Goethego autorstwa Gérarda de Nervala, które już dwadzieścia lat wcześniej opracowałem muzycznie i które zamierzałem wykorzystać w nowej partyturze w zmienionej wersji, a także dwie lub trzy inne sceny napisane przed moim wyjazdem z Paryża przez pana Gandonnière'a według moich wskazówek, nie stanowiły nawet jednej szóstej całego dzieła. Podczas podróży starym niemieckim dyliżansem próbowałem więc pisać wiersze, które miały posłużyć za tekst do mojej muzyki. Zacząłem od inwokacji Fausta do natury, nie próbując tłumaczyć ani nawet naśladować arcydzieła Goethego, lecz jedynie czerpać z niego inspirację i wydobyć zawartą w nim treść muzyczną. Gdy już zacząłem, pisałem kolejne wersy w miarę napływania pomysłów muzycznych, a partyturę komponowałem z łatwością, jakiej rzadko doświadczałem podczas pracy nad innymi moimi dziełami”. – Hector Berlioz"
 elgar.107.g: "Czyli podróż była tego warta?"
 elgar.108.t: "Wiktoria odwiedza katedrę w Kolonii"
 elgar.108.d: "Królowa Wielkiej Brytanii Wiktoria wykorzystała swój pobyt w Nadrenii, aby odwiedzić katedrę w Kolonii i dowiedzieć się więcej o właśnie rozpoczętych pracach nad jej budową."
 elgar.108.f: "Wczesne opuszczenie koncertu przez królewską świtę wynikało z zaplanowanej na popołudnie wizyty w katedrze w Kolonii, która odbyła się przy uroczystym biciu dzwonów. Ich Królewskie Mości weszły następnie głównym wejściem do nawy głównej i udały się do prezbiterium, gdzie kolońskie męskie towarzystwo chóralne wykonywało uroczystą kantatę przy akompaniamencie organowym dyrektora muzycznego Webera."
 elgar.108.g: "To dla nas zaszczyt."
 elgar.111.t: "Pomnik Mozarta"
 elgar.111.d: "Przygotowania do wzniesienia pomnika Wolfganga Amadeusza Mozarta idą pełną parą. Nadal jednak zbierane są datki."
 elgar.111.f: "W 1835 roku pisarz Julius Schilling, pochodzący z Poznania, leżącego wówczas na terenie Prus, zaproponował wzniesienie pomnika Mozarta na dzisiejszym Mozartplatz. W tamtym czasie kompozytor był stosunkowo mało znany w Salzburgu. Ostatecznie budowę pomnika wsparli hojni sponsorzy z zagranicy, a także z Wiednia. Król Bawarii Ludwik I przekazał znaczną sumę pieniędzy i ufundował cokół pod brązowy posąg."
 elgar.111.g: "Mozart był niemieckim tytanem muzyki!"
 elgar.113.t: "Pomnik Mozarta"
 elgar.113.d: "Dziś w rodzinnym mieście odsłonięto pomnik najwybitniejszego syna Salzburga."
 elgar.113.f: "Pomnik zaprojektowany przez Ludwiga Schwanthalera i odlany przez Johanna Baptista Stiglmaiera został uroczyście odsłonięty 5 września 1842 roku w obecności obu żyjących synów Mozarta, Franza Xavera i Carla Thomasa. Wdowa po Mozarcie nie doczekała jednak inauguracji pomnika. Zmarła krótko wcześniej w domu przy Mozartplatz 8. Uroczystościom towarzyszył festyn obejmujący procesję z pochodniami, rejsy łodziami, wycieczki w Alpy, strzelanie do tarczy i wyścigi konne."
 elgar.114.t: "Żywy Pomnik"
 elgar.114.d: "W Austrii nasilają się starania o wzniesienie pomnika Mozarta. Niektórzy mieszkańcy Frankfurtu chcą więc zorganizować koncert charytatywny i nadać tej inicjatywie również wymiar polityczny."
 elgar.114.f: "Początkowo mieszkańcy Frankfurtu chcieli zorganizować koncert, aby zebrać wystarczające fundusze na wzniesienie pomnika Mozarta. Pomniki poświęcone wybitnym przedstawicielom mieszczaństwa były w Niemczech nowością. Wznoszenie monumentów ku czci postaci o znaczeniu narodowym, takich jak artyści czy naukowcy, stanowiło więc doskonałą okazję do wyrażenia uczuć patriotycznych. Niektórzy mieszkańcy Frankfurtu proponują nawet zorganizowanie ogólnokrajowego zjazdu chórów, z którego dochód miałby zasilić fundację niemieckich muzyków wspierającą młodych artystów."
 elgar.114.g: "Zbierz fundusze na nasz własny żywy pomnik – festiwal ku czci Mozarta!"
 elgar.114.h: "Przekaż datek na pomnik w Salzburgu."
 elgar.115.t: "Zaproszenie na Sängerfest"
 elgar.115.d: "Mieszkańcy Frankfurtu zaprosili patriotycznych śpiewaków z naszego kraju do udziału w festiwalu Mozarta."
 elgar.115.g: "Muzyczna okazja o narodowym znaczeniu."
 elgar.115.h: "Po prostu nie znoszę pieśni artystycznych."
 elgar.116.t: "Festiwal Mozarta"
 elgar.116.d: "42 towarzystwa śpiewacze z Nadrenii, Badenii, Hesji i Frankonii zebrały się we Frankfurcie, aby przez trzy dni świętować twórczość Mozarta. Wydarzenie przerodziło się jednak w manifestację na rzecz politycznego zjednoczenia Niemiec. Zebrane środki przeznaczono na fundację wspierającą młodych kompozytorów."
 elgar.116.f: "„Miasto ogarnął prawdziwy entuzjazm. Domy były wypełnione ludźmi aż po świetliki dachowe. Mieszkańcy Moguncji, Hanau i Offenbach przypływali łodziami przy huku wystrzałów armatnich, w otoczeniu udekorowanych łodzi, z których rozbrzmiewała muzyka. Wpływali przez wszystkie bramy miasta. Był to niezwykle poruszający widok. Zainteresowanie sztuką zeszło na dalszy plan, za to z wielką siłą dał się odczuć duch narodowy. Nie zaprzeczę, że po policzkach spływały mi gorące łzy”. – Heinrich Hoffmann"
 elgar.116.g: "Muzyka jednoczy naród."
 elgar.117.t: "Liberalni wichrzyciele podnoszą wrzawę we Frankfurcie"
 elgar.117.d: "Nie uszło naszej uwadze, że niektórzy „patrioci” o jakobińskich poglądach wykorzystali rzekomy Festiwal Mozarta we Frankfurcie do prowadzenia agitacji politycznej."
 elgar.117.f: "42 towarzystwa śpiewacze z Nadrenii, Badenii, Hesji i Frankonii zebrały się we Frankfurcie, aby przez trzy dni świętować twórczość Mozarta. Wydarzenie przerodziło się jednak w manifestację na rzecz politycznego zjednoczenia Niemiec. Początkowo celem wydarzenia było zebranie funduszy na pomnik Mozarta, lecz inicjatorzy szybko zmienili przeznaczenie zbiórki, kierując zgromadzone środki na rzecz własnej fundacji."
 elgar.117.g: "Spisek przeciwko porządkowi w Związku Niemieckim!"
 elgar.117.h: "Niech śpiewają."
 elgar.121.t: "Założenie Powszechnego Niemieckiego Stowarzyszenia Muzycznego"
 elgar.121.d: "Dziś w [SCOPE.sState('elgar_musikverein_capital').GetCityHubName] założono Allgemeiner Deutscher Musikverein (Powszechne Niemieckie Stowarzyszenie Muzyczne). Natychmiast wywiązała się dyskusja o tym, czy należymy do Nowej Szkoły Niemieckiej, czy też opowiadamy się za konserwatywną koncepcją muzyki."
 elgar.121.f: "Nowa Szkoła Niemiecka to termin wprowadzony w 1859 roku przez Franza Brendela, redaktora czasopisma Neue Zeitung für Musik, na określenie pewnych nurtów w muzyce niemieckiej. Na przestrzeni lat różne osoby posługiwały się nim w odmiennych znaczeniach. Panuje powszechna zgoda co do tego, że Franz Liszt i Richard Wagner należeli do najwybitniejszych przedstawicieli „Nowej Szkoły Niemieckiej”. Uznaje się również, że Johannes Brahms nie należał do tego nurtu. Poza tym interpretacje są rozbieżne. Nowy termin należy rozumieć jako określenie całego okresu od śmierci Beethovena. Według Brendela powszechnie przyjęło się nazywać epokę J.S. Bacha i Händla „Starą Szkołą Niemiecką”. Kolejny okres należał do wiedeńskich mistrzów, takich jak Mozart, na których twórczość wpływ miał styl włoski. Beethoven ponownie skierował zainteresowanie ku niemieckiej północy, otwierając tym samym epokę „Nowej Szkoły Niemieckiej”. Kompozytorzy obu obozów uznawali Beethovena za swojego duchowego i artystycznego bohatera. Konserwatyści widzieli w nim nieosiągalny szczyt, natomiast postępowcy początek nowej ery w muzyce."
 elgar.121.g: "Należymy do Nowej Szkoły Niemieckiej."
 elgar.121.h: "Bronimy Tradycyjnej Szkoły Niemieckiej."
 elgar.122.t: "Członkostwo w Powszechnym Niemieckim Stowarzyszeniu Muzycznym"
 elgar.122.d: "Artyści z naszego kraju zostali zaproszeni do nowo powstałego Powszechnego Niemieckiego Stowarzyszenia Muzycznego. Natychmiast wywiązała się dyskusja o tym, czy należymy do Nowej Szkoły Niemieckiej, czy też bronimy konserwatywnej koncepcji muzyki."
 elgar.123.t: "Miejsce kolejnego Kongresu Muzyków"
 elgar.123.d: "Członkowie Powszechnego Niemieckiego Towarzystwa Muzycznego wybrali [SCOPE.sState('elgar_musikverein_capital').GetCityHubName] na miejsce kolejnego spotkania Tonkünstler-Versammlung (Kongresu Muzyków)."
 elgar.123.f: "W 1859 roku w Lipsku odbyło się pierwsze spotkanie Tonkünstler z okazji 25. rocznicy powstania „Nowego Czasopisma Muzycznego”. Podczas drugiego spotkania Tonkünstler (1861) w Weimarze ponad 700 członków założycieli przyjęło statut Powszechnego Niemieckiego Towarzystwa Muzycznego (ADMV). „Nowe Czasopismo Muzyczne” stało się organem prasowym stowarzyszenia. Pod koniec XIX wieku ADMV znajdowało się pod protektoratem wielkiego księcia Weimaru. Towarzystwo zorganizowało szereg dużych spotkań Tonkünstler. Kierowało się przede wszystkim założeniami Nowej Niemieckiej Szkoły Muzycznej, reprezentowanej przez Franza Liszta i Richarda Wagnera. W ramach realizacji celów artystycznych ADMV planowano coroczne spotkania Tonkünstler w różnych miejscowościach, podczas których wykonywano by ważne, rzadko słyszane, a zwłaszcza nowe utwory muzyczne wszelkiego rodzaju. Prezentowane miały być również starsze dzieła, wykonywane rzadko lub wcale, lecz zasługujące na uwagę ze względu na swoje znaczenie. Ponadto zamierzano wydawać drukiem nowe utwory muzyczne i prace naukowe."
 elgar.123.g: "To dla nas zaszczyt."
 elgar.124.t: "Kongres Muzyków w [SCOPE.sState('elgar_tonkunstler_state').GetCityHubName]"
 elgar.124.d: "Tegoroczne Tonkünstler-Versammlung (Kongres Muzyków) odbędzie się w [SCOPE.sState('elgar_tonkunstler_state').GetCityHubName]. Nasi artyści zostali serdecznie zaproszeni do dyskusji o muzyce i wysłuchania wykonań nowych oraz zapomnianych utworów muzycznych."
 elgar.124.g: "Cieszmy się muzyką i wysłuchajmy wystąpień ludzi o podobnych poglądach."
 elgar.124.h: "To idealne miejsce, by wygarnąć tym muzycznym dyletantom."
 elgar.124.i: "To będzie dzień prawdy, nasza wizja muzyki jest jedyną słuszną!"
 elgar.125.t: "Wojna Romantyków"
 elgar.125.d: "Spór między przedstawicielami Nowej Niemieckiej Szkoły Muzycznej a bardziej konserwatywnymi twórcami doprowadził do publicznego skandalu. W prasie trwa już otwarta wojna między obiema frakcjami. Czas, by [ROOT.GetCountry.GetName] stanął po stronie swoich artystów."
 elgar.125.f: "„Wojna Romantyków” to określenie używane przez niektórych historyków muzyki na opisanie rozłamu wśród wybitnych muzyków w drugiej połowie XIX wieku. Główne kwestie sporne dotyczyły struktury muzycznej, granic harmoniki chromatycznej oraz przeciwstawienia muzyki programowej muzyce absolutnej. Przeciwne obozy wykrystalizowały się w latach pięćdziesiątych XIX wieku. Do najważniejszych przedstawicieli kręgu konserwatywnego należeli Johannes Brahms, Joseph Joachim, Clara Schumann oraz założone przez Feliksa Mendelssohna Konserwatorium Lipskie. Ich przeciwników, radykalnych zwolenników postępu wywodzących się głównie z Weimaru, reprezentowali Franz Liszt i członkowie tak zwanej Nowej Niemieckiej Szkoły Muzycznej (niem. Neudeutsche Schule) oraz Richard Wagner. Spór narodził się w Niemczech i Europie Środkowej, a muzycy z Francji, Włoch i Rosji uczestniczyli w nim jedynie marginalnie. Kompozytorzy obu stron uznawali Beethovena za swojego duchowego i artystycznego mistrza. Konserwatyści widzieli w nim niedościgniony szczyt, a zwolennicy postępu początek nowej epoki w muzyce."
 elgar.125.g: "Wesprzyj Nową Niemiecką Szkołę Muzyczną!"
 elgar.125.h: "Wesprzyj Tradycyjną Niemiecką Szkołę Muzyczną!"
 elgar.126.t_konservativ: "Konserwatyści wygrywają „Wojnę Romantyków”"
 elgar.126.d_konservativ: "Przytłaczająca przewaga liczebna zwolenników Tradycyjnej Szkoły zapewniła im zwycięstwo w sporze o przyszłość muzyki. Słuszność argumentów ma drugorzędne znaczenie: to liczba wypowiedzi w debatach i polemikach kształtuje obraz sporu w oczach opinii publicznej."
 elgar.126.f_konservativ: "Główną osią sporu między tymi dwiema grupami muzyków był wybór między tradycyjnymi a nowymi formami muzycznymi. Spór wyrósł z debaty nad dalszymi możliwościami rozwoju symfonii, którą Ludwig van Beethoven przekształcił z gatunku służącego rozrywce w formę wyrażającą ideały społeczne, moralne i kulturowe. Liszt i jego krąg opowiadali się za nowymi stylami kompozytorskimi i formami łączącymi muzykę z treściami narracyjnymi i obrazowymi. W tym celu Liszt stworzył poemat symfoniczny. Szkoła lipsko-berlińska broniła form stosowanych przez mistrzów klasycznych, usystematyzowanych przez muzykologów początku XIX wieku, takich jak Adolf Bernhard Marx. Przedmiotem sporu była również zasadność muzyki programowej. W książce „Vom Musikalisch-Schönen” („O pięknie w muzyce”) z 1854 roku Hanslick stwierdził, że muzyka nie przedstawia i nie może przedstawiać niczego konkretnego poza samą sobą. \n\n Ostatecznie #G [GetGlobalVariable('elgar_neudeutsch_yes').GetValue]#! Członków poparło Nową Niemiecką Szkołę Muzyczną, a #R [GetGlobalVariable('elgar_konservativ_yes').GetValue]#! Członków poparło Tradycyjną Szkołę Muzyczną."
 elgar.126.g: "Tradycyjna Szkoła Muzyczna triumfuje."
 elgar.126.t_neudeutsch: "Zwolennicy postępu wygrywają „Wojnę Romantyków”"
 elgar.126.d_neudeutsch: "Przytłaczająca przewaga liczebna zwolenników Nowej Niemieckiej Szkoły Muzycznej zapewniła im zwycięstwo w sporze o przyszłość muzyki. Słuszność argumentów ma drugorzędne znaczenie: to liczba wypowiedzi w debatach i polemikach kształtuje obraz sporu w oczach opinii publicznej."
 elgar.126.f_neudeutsch: ""
 elgar.126.h: "Nowa Niemiecka Szkoła Muzyczna triumfuje."
 elgar.131.t: "Franz Liszt rozpoczyna europejskie tournée"
 elgar.131.d: "Po niezbyt szczęśliwym okresie w Paryżu Franz Liszt postanowił wzorem swojego rywala Thalberga wyruszyć w tournée i zdobyć międzynarodową sławę jako muzyk. Pierwszym celem jego podróży będzie [SCOPE.sCountry('elgar_liszt_destination_scope').GetNameNoFlag]."
 elgar.131.f: "Franz Liszt był austro-węgierskim kompozytorem, pianistą, dyrygentem, dyrektorem teatru i nauczycielem muzyki. Należał do najwybitniejszych i najbardziej wpływowych wirtuozów fortepianu, a jego dorobek, obejmujący ponad 1300 utworów i opracowań, czynił go jednym z najpłodniejszych kompozytorów XIX wieku. Choć znaczną część jego twórczości stanowią utwory fortepianowe, Liszt nadał również wyraźny impuls rozwojowi muzyki orkiestrowej, tworząc poemat symfoniczny. Jego koncepcja muzyki programowej oraz stosowanie nowych środków harmonicznych i formalnych uczyniły go, obok Richarda Wagnera, najbardziej znanym przedstawicielem Nowej Niemieckiej Szkoły Muzycznej. W 1839 roku Liszt rozpoczął rozległe tournée po Europie, które kontynuował przez kolejnych osiem lat. Był to najświetniejszy okres jego kariery pianisty koncertowego, podczas którego zdobył liczne wyróżnienia i zaznał ogromnego uwielbienia. W tym czasie pojawiły się pierwsze doniesienia o gwałtownych reakcjach jego wielbicieli, określanych mianem lisztomanii. Zjawisko to charakteryzowało się histerycznymi reakcjami na Liszta i jego koncerty. Według relacji gra Liszta wprawiała publiczność w stan niemal mistycznej ekstazy."
 elgar.131.g: "Życzymy mu wszystkiego najlepszego."
 elgar.132.t: "Lisztomania w [ROOT.GetCountry.GetNameNoFlag]"
 elgar.132.d: "Światowej sławy pianista Franz Liszt wybrał nasz kraj na kolejny przystanek swojego europejskiego tournée. Bilety do teatrów i oper są już wyprzedane!"
 elgar.132.g: "Skąd nagle wzięły się te wszystkie piszczące kobiety?"
 elgar.133.t: "Liszt wyjeżdża"
 elgar.133.d: "Liszt zakończył swój pobyt i podziękował za gościnność. Lisztomania będzie trwać dalej w [SCOPE.sCountry('elgar_liszt_destination_scope').GetNameNoFlag]."
 elgar.133.f: "Szacuje się, że w latach 1839–1847 Liszt wystąpił publicznie znacznie ponad tysiąc razy. Jego wielka sława jako pianisty, którą cieszył się jeszcze długo po oficjalnym wycofaniu się z estrady koncertowej, opierała się głównie na osiągnięciach z tego okresu. Uznania przysparzał mu również fakt, że znaczną część dochodów ze swojej pracy przeznaczał na cele charytatywne i humanitarne. Przekazywał duże sumy na fundusze budowy katedry w Kolonii i bazyliki św. Stefana w Peszcie. Prywatnie wspierał też instytucje publiczne, takie jak szpitale i szkoły, oraz organizacje dobroczynne, między innymi Lipski Fundusz Emerytalny Muzyków. Po wielkim pożarze Hamburga w maju 1842 roku dawał koncerty na rzecz osób, które straciły dach nad głową. Aby zaspokoić pragnienie wielbicieli, którzy chcieli zdobyć pukiel jego włosów, Liszt nabył psa, którego sierść dostarczała loków, a nikt nie zauważał podstępu."
 elgar.301.t: "Udane próby"
 elgar.301.d: "Próby orkiestry prowadzone przez podróżującego kompozytora zapowiadały się bardzo obiecująco."
 elgar.301.f: "Podróżujący kompozytor zjednał sobie orkiestrę jako dyrygent i już podczas prób zrobił znakomite wrażenie!"
 elgar.301.g: "Dobrze."
 elgar.302.t: "Przeciętne próby"
 elgar.302.d: "Niestety próby orkiestry prowadzone przez podróżującego kompozytora nie wypadły tak dobrze, jak oczekiwano w sali koncertowej..."
 elgar.302.f: "Czy to z powodu niechętnych do współpracy kolegów, słabo przygotowanych wykonawców, czy warunków w sali koncertowej, próby nie wróżą udanego występu."
 elgar.302.g: "Niedobrze."
 elgar.303.t: "Miłosna dedykacja"
 elgar.303.d: "Romans w zamian za „drobną” przysługę budzi emocje."
 elgar.303.f: "Artyści od zawsze słynęli z dość „swobodnego stylu życia” i wywołali niejeden skandal obyczajowy. Tym razem uwagę przyciąga drobny gest, który może jednak wywołać prawdziwą burzę. Podróżujący kompozytor zadedykował sonatę zamężnej damie i podarował jej oryginalną partyturę. Kobieta jest jednak żoną wielce szanowanego generała naszej armii. Podarunek wywołał spekulacje i może zaszkodzić publicznemu wizerunkowi jej męża. Wojsko domaga się działania."
 elgar.303.g: "Nie widzę w tym problemu?"
 elgar.303.h: "Oburzające!"
 elgar.304.t: "Wieczorne przyjęcie"
 elgar.304.d: "Nasz monarcha zaprosił podróżującego kompozytora na wystawne przyjęcie. Kompozytor wyraził wdzięczność, tworząc utwór muzyczny."
 elgar.304.f: "Choć kultura muzyczna XIX wieku coraz usilniej dążyła do uniezależnienia się od mecenatu, arystokraci i królowie nadal należeli do najważniejszych opiekunów sztuki, a wiele utworów wciąż dedykowano książętom i monarchom. Osobiste relacje pozwalały z kolei kompozytorom wykluczonym z akademii i środowisk artystycznych znaleźć wsparcie zamożnego mecenasa, jeśli ich twórczość odpowiadała jego gustom. Na przykład cały szereg arcydzieł Wagnera nie mógłby powstać bez osobistego wsparcia króla Bawarii Ludwika II."
 elgar.304.g: "Cóż za piękna niespodzianka!"
 elgar.305.t: "Bilety wyprzedane!"
 elgar.305.d: "Awantura wokół występu wielkiego kompozytora, na który wyprzedano wszystkie bilety, wywołała publiczne oburzenie!"
 elgar.305.f: "W dniu premiery przed gmachem opery zebrał się wielki tłum oczekujących widzów, choć wszystkie bilety wyprzedano już kilka dni wcześniej. Nawet przybyły kompozytor zdołał zdobyć bilet jedynie na czarnym rynku. Ponieważ jednak jeden z pracowników teatru na własną rękę sprzedawał dodatkowe bilety, ich liczba znacznie przekroczyła liczbę miejsc. W teatrze i przed nim doszło do tumultu, w którym muzyka niemal całkowicie ginęła. Ludzie na zewnątrz krzyczeli, by ich wpuszczono, a ci w środku domagali się ciszy. Udało się jeszcze wykonać początkowe partie chóralne, lecz potem orkiestra zrezygnowała z gry i dopiero wtedy rozpętała się prawdziwa wrzawa."
 elgar.305.g: "Kto za to odpowiada?!"
 elgar.306.t: "Zaskakująca premiera"
 elgar.306.d: "Dzieło kompozytora, który poniósł porażkę w ojczyźnie, podbiło serca naszej publiczności."
 elgar.306.f: "Nawet dzieła uznane później za arcydzieła nieraz spotykały się z chłodnym przyjęciem podczas premiery. Takie doświadczenia często prowadziły nie tylko do głębokiego zwątpienia we własne możliwości i zakończenia kariery, lecz także do prób zaprezentowania tego samego utworu innej publiczności. Dzieła uznane później za klasykę nierzadko zdobywały uznanie dopiero za drugim lub trzecim podejściem. W pamięci zapisywało się wówczas nie miejsce premiery, lecz miejsce sukcesu, uznawane za prawdziwy początek ich sławy. Przykładem jest Hector Berlioz, którego utwory odnosiły większe sukcesy w Wielkiej Brytanii i Niemczech niż w rodzinnej Francji."
 elgar.306.g: "Nasza publiczność bardziej docenia sztukę."
 elgar.307.t: "Muzyczna przyjaźń"
 elgar.307.d: "Podróżujący kompozytor od razu znalazł wspólny język z miejscowymi muzykami."
 elgar.307.f: "Relacje między zagranicznymi a miejscowymi muzykami nie zawsze były łatwe. Przyczyną były nie tylko narodowe urazy i osobiste uprzedzenia. Niektóre orkiestry nie potrafiły dostosować się do sposobu dyrygowania gościa, a krótki czas przeznaczony na przygotowanie występów wymuszał nieraz kompromisy, za które przyjezdny obwiniał miejscowe środowisko muzyczne. Niejeden lokalny kompozytor czy dyrygent obawiał się również zbyt silnych wpływów zagranicznych. Mimo tych wszystkich przeszkód wciąż jednak rodziły się przyjaźnie."
 elgar.307.g: "Owocna przyjaźń."
 elgar.308.t: "Muzyczna rywalizacja"
 elgar.308.d: "Miejscowe środowisko muzyczne patrzy na przybycie podróżującego kompozytora z niechęcią i podejrzliwością."
 elgar.308.f: "„Dwa wielkie dzieła dla Opery, dwa kolejne dla Renaissance, jeszcze dwa dla Opéra-Comique i następne dla Théâtre-Italien? Zdaje się, że pan Donizetti traktuje nas jak podbity kraj, to istna inwazja. Nie można już mówić o paryskich teatrach operowych, lecz jedynie o teatrach operowych pana Donizettiego”. — Hector Berlioz"
 elgar.308.g: "Ci muzycy powinni wziąć się w garść!"
 elgar.309.t: "Inspiracje"
 elgar.309.d: "Zagraniczny kompozytor zainspirował członków państwowej orkiestry."
 elgar.309.f: "Wpływy z zewnątrz często przynosiły zmiany w lokalnym i krajowym życiu muzycznym. Nieznane utwory, obcy język muzyczny czy pojawienie się charyzmatycznego artysty nieraz pozwalały miejscowym muzykom spojrzeć na muzykę z zupełnie nowej perspektywy."
 elgar.309.g: "Inspiracja? Chcę zobaczyć rezultaty!"
 elgar.309.h: "To pozytywnie wpłynie na orkiestrę."
 elgar.310.t: "Mania"
 elgar.310.d: "Przybycie kompozytora wywołało bezprecedensowy, niemal histeryczny zachwyt publiczności jego twórczością. Ludzie nie myślą o niczym innym!"
 elgar.310.f: "„Kiedy dawniej słyszałem o omdleniach, które ogarniały publiczność w Niemczech, a zwłaszcza w Berlinie, gdy pojawiał się tam Liszt, wzruszałem z politowaniem ramionami i myślałem: spokojne, świętujące szabat Niemcy nie chcą stracić sposobności do odrobiny niezbędnego ruchu, na jaki im się pozwala... W ich przypadku, sądziłem, chodzi o widowisko dla samego widowiska... Tak tłumaczyłem sobie lisztomanię i uważałem ją za przejaw politycznego zniewolenia panującego za Renem. A jednak się myliłem i zrozumiałem to dopiero w zeszłym tygodniu, w Teatrze Włoskim, gdzie Liszt dał swój pierwszy koncert... Doprawdy, publiczność, przed którą grał zupełnie sam, a raczej jedynie w towarzystwie własnego geniuszu, nie była ani niemiecko sentymentalna, ani rozczulona na berlińską modłę. A jednak jakie spazmy wywoływało w niej samo jego pojawienie się! Jak burzliwe oklaski rozlegały się na jego powitanie!... Cóż to był za aplauz! Istne szaleństwo, niespotykane dotąd w dziejach uniesień!” — Heinrich Heine"
 elgar.310.g: "Czyli zupełnie nie mogą się skupić?"
 elgar.311.t: "Muzyka łączy ludzi"
 elgar.311.d: "Ambasador pyta, czy możemy zdobyć dla niego bilet na koncert kompozytora, który u nas gości."
 elgar.311.f: "Ambasador jednego z wielkich mocarstw jest wielbicielem twórczości podróżującego kompozytora, który obecnie gości w naszym kraju. Chciałby wybrać się na jego występ, lecz wszystkie miejsca są już zajęte. Zwrócił się więc do nas z prośbą o wykorzystanie naszych wpływów politycznych, aby mimo to mógł uczestniczyć w koncercie."
 elgar.311.g: "Haha. Nie."
 elgar.311.h: "Przydzielcie mu honorowe miejsce."
 elgar.312.t: "Próba zamachu w Operze!"
 elgar.312.d: "Straszliwy zamach na jednego z czołowych polityków naszego kraju położył się cieniem na dzisiejszym przedstawieniu operowym!"
 elgar.312.f: "Od pewnego czasu brak legitymizacji naszego rządu wywołuje niezadowolenie wśród ludności. Podstępny zamachowiec wykorzystał koncert popularnego kompozytora, by podczas występu postrzelić wysokiego rangą urzędnika państwowego. [SCOPE.sCharacter('elgar_leader_victim').GetFullName] odniósł ciężkie obrażenia. Sprawca nadal pozostaje na wolności, a ofiarę w stanie zagrożenia życia natychmiast przewieziono do najbliższego szpitala."
 elgar.312.g: "Gdzie były służby bezpieczeństwa?!"
 elgar.313.t: "Pomniejsze dzieło"
 elgar.313.d: "Niewielki utwór skomponowany przez wielkiego kompozytora podczas pobytu w naszym kraju może nie jest wielkim przebojem, ale znalazł swoich wielbicieli."
 elgar.313.f: "Okazjonalne utwory powstające obok słynnych dzieł kompozytorów wcale nie musiały być przeciętnej jakości. Niejednokrotnie drobne kompozycje przyciągały więcej uwagi niż niejeden dorobek całego życia. Mimo bogatej twórczości Nikołaj Rimski-Korsakow jest znany w kulturze popularnej przede wszystkim z „Lotu trzmiela” (z „Bajki o carze Sałtanie”), a Edvard Grieg z „W grocie Króla Gór” (z „Peer Gynta”). Niesłusznie, ale przebój to przebój."
 elgar.313.g: "Czasem to drobiazgi przynoszą radość."
 elgar.314.t: "Brak inspiracji"
 elgar.314.d: "Ku naszemu rozczarowaniu pobyt w naszym kraju zupełnie nie inspiruje naszego gościa."
 elgar.314.f: "Czasem po prostu się nie udaje."
 elgar.314.g: "Przygnębiające."
 elgar.315.t: "Prywatny Koncert"
 elgar.315.d: "Poza oficjalnymi występami nasz kompozytor dał prywatny koncert w kameralnym gronie."
 elgar.315.f: "Niewielkie prywatne koncerty wielkich kompozytorów mają długą tradycję. Najbardziej zasłynął z nich Franz Schubert, od którego nazwiska pochodzi nazwa schubertiad. Podczas pierwszych schubertiad Schubert grał na fortepianie, a barytoni Johann Michael Vogl, a później Carl von Schönstein, śpiewali jego pieśni. Wieczory obejmowały również czytanie utworów literackich i dowcipne gry towarzyskie, często poświęcone określonemu tematowi. Łączyły przyjacielskie spotkania z salonem literacko-muzycznym."
 elgar.315.g: "To było miłe."
 elgar.315.h: "Da capo!"
 elgar.316.t: "Utalentowany uczeń"
 elgar.316.d: "Goszczący w naszym kraju wielki kompozytor odkrył talent jednego z naszych przywódców politycznych i rozważa udzielenie mu lekcji kompozycji."
 elgar.316.f: "Można się dziwić, że politycy w ogóle mają talent artystyczny i że jako źli ludzie nie są z zasady całkowicie niewrażliwi na sztukę muzyczną. Z pewnością zdarzali się kompozytorzy o ambicjach politycznych, lecz znacznie rzadziej politycy o ambicjach muzycznych. Cokolwiek opętało tego polityka, być może jego dusza nie jest jednak bezpowrotnie stracona."
 elgar.316.g: "Obiecujący kandydat."
 elgar.316.h: "Lepiej, by spożytkował swoją energię gdzie indziej."
 elgar.317.t: "Muzyczna katastrofa"
 elgar.317.d: "Występ w jednej z naszych sal koncertowych może przejść do historii jako jedna z największych porażek w dziejach naszej muzyki."
 elgar.317.f: "Orkiestra była nieprzygotowana, solista przeziębiony, dyrygent niewyspany, a kompozytor, w którego obecności odbył się występ, grozi pominięciem naszego kraju podczas następnego tournée. Nie sposób nazwać tego inaczej niż katastrofą!"
 elgar.317.g: "Międzynarodowa kompromitacja!"
 elgar.318.t: "Skandaliczny koncert"
 elgar.318.d: "Skandaliczny koncert, którego „nowoczesne” brzmienia wzburzyły publiczność, nie tylko dzieli społeczeństwo, lecz także pociąga za sobą konsekwencje prawne."
 elgar.318.f: "Ówczesne doniesienia prasowe opisują gwałtowne zamieszki. Zwolennicy kompozytora, jego uczniowie i przeciwnicy przekrzykiwali się, obrzucali przedmiotami, zakłócali występ, niszczyli meble i dopuszczali się innych wybryków. Oburzeni konserwatyści z widowni kilkakrotnie wchodzili na scenę, klnąc i zamierzając spoliczkować dyrygenta. Gdy ten zagroził, że porządek zostanie przywrócony przy pomocy władz, podobno dopiero wtedy rozpętała się prawdziwa wrzawa. W końcu padł policzek. Podczas późniejszego procesu sądowego obecny na koncercie kompozytor operetek stwierdził, że odgłos policzkowania „był najbardziej melodyjną rzeczą, jaką można było usłyszeć tego wieczoru”."
 elgar.318.g: "Motłoch nie ma pojęcia o kulturze. To było znakomite!"
 elgar.318.h: "Natychmiast zdejmijcie ten utwór z afisza."
 elgar.319.t: "Duch czasu"
 elgar.319.d: "Nowoczesny utwór, którym wielki kompozytor osobiście dziś dyrygował, idealnie trafia w gusta mas."
 elgar.319.f: "Czasem po prostu trzeba mieć szczęście."
 elgar.319.g: "Doskonale."
 elgar.320.t: "Muzyczna Propaganda"
 elgar.320.d: "Niektórzy politycy rządzący rozważają, czy muzyki kompozytora, który obecnie u nas gości, nie można by... zapożyczyć do celów propagandowych."
 elgar.320.f: "Zwłaszcza od początku XX wieku, wraz z rozwojem społeczeństwa masowego, które wydało ówczesne reżimy totalitarne, upowszechniła się idea podporządkowywania mas za pomocą muzyki. Choć nawet w tych czasach niektórzy muzycy sprzeciwiali się dyktaturze, inni oddawali swoją twórczość bezpośrednio na służbę ideologii lub przynajmniej pozwalali wykorzystywać swój talent na rzecz określonego nurtu politycznego."
 elgar.320.g: "Muzyka powinna być wolna od polityki."
 elgar.320.h: "Czasami muzyka powinna służyć polityce."
 elgar.321.t: "Wielcy kompozytorzy we własnym gronie"
 elgar.321.d: "Nasz muzyczny gość spotkał się z wielkim kompozytorem zatrudnionym przez nasz kraj. Podczas wielogodzinnych rozmów i spacerów wymieniali się przemyśleniami i pomysłami muzycznymi."
 elgar.321.f: "Wielkie umysły myślą podobnie."
 elgar.321.g: "Historyczne spotkanie."
 elgar.406.t: "Śmierć Maestra [GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetLastName]"
 elgar.406.d: "[GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetFullName], najwybitniejszy autorytet muzyczny kraju [GetPlayer.GetNameNoFlag], zmarł dziś niespodziewanie. Świat muzyki opłakuje tę wielką stratę."
 elgar.406.f: "„Stojąc tutaj nad grobem zmarłego, jesteśmy niejako przedstawicielami całego narodu, opłakującego odejście jednej z dwóch tak sławionych postaci, które pozostały nam z minionej świetności rodzimej sztuki i rozkwitu ojczystej myśli. Spadkobierca i pomnożyciel nieśmiertelnej sławy Händla i Bacha, Haydna i Mozarta dopełnił żywota, a my stoimy we łzach nad zerwaną struną ucichłej gry.\nUcichłej gry! Pozwólcie mi tak go nazwać! Był bowiem artystą i wszystkim, czym był, stał się wyłącznie dzięki sztuce”. — Franz Grillparzer"
 elgar.406.g: "Ale kto teraz napisze requiem?"
 elgar.411.t: "Znakomity Koncert"
 elgar.411.d: "Sezon koncertowy pod kierunkiem naszego dyrygenta [SCOPE.sCharacter('elgar_conductor').GetFullName] znacznie przerósł oczekiwania!"
 elgar.411.f: "„Publiczność powinna być surowa, powinna gwizdać, ale jej oklaski nie powinny mnie do niczego zobowiązywać”. — Giuseppe Verdi"
 elgar.411.g: "Brawo!"
 elgar.412.t: "Przeciętny Koncert"
 elgar.412.d: "Sezon koncertowy pod kierunkiem naszego dyrygenta [SCOPE.sCharacter('elgar_conductor').GetFullName] przebiega jak zwykle. Jak dotąd nie było żadnych wyjątkowych momentów."
 elgar.412.f: "„Nie należy uważać się za kogoś tak boskiego, by nie móc od czasu do czasu poprawić własnych dzieł”. — Ludwig van Beethoven"
 elgar.412.g: "*ziew*"
 elgar.413.t: "Nieudany Koncert"
 elgar.413.d: "Tegoroczny sezon koncertowy wypada dotąd nie tylko poniżej przeciętnej, ale występy naszego dyrygenta [SCOPE.sCharacter('elgar_conductor').GetFullName] uznaje się za szczególnie rozczarowujące. Publiczność nie domaga się nawet bisu..."
 elgar.413.f: "„Po ostatnich dźwiękach Zmierzchu bogów poczułem się tak, jakby wypuszczono mnie z więzienia”. — Piotr Czajkowski"
 elgar.413.g: "Buuu!"
 elgar.414.t: "Ambasador na widowni"
 elgar.414.f: "„Preludium do Tristana i Izoldy przypomina mi dawny włoski obraz męczennika, którego jelita są powoli wyciągane z ciała i nawijane na kołowrót”. — Eduard Hanslick"
 elgar.414.g: "Ten człowiek nawet nie wie, czym jest muzyka."
 elgar.414.h: "Wreszcie ktoś to powiedział!"
 elgar.415.t: "Balet"
 elgar.415.d: "Dziś odbyła się premiera nowego, nowoczesnego baletu."
 elgar.415.f: "„Podoba mi się fabuła Dziadka do orzechów? Ani trochę”. — Piotr Czajkowski"
 elgar.415.g: "Tańczcie!"
 elgar.416.t: "Muzyka Filmowa"
 elgar.416.d: "Pod kierunkiem naszego głównego dyrygenta nagrano dziś jedną z pierwszych ścieżek dźwiękowych do filmu fabularnego."
 elgar.416.f: "„Muzyka filmowa powinna mieć taki sam związek z akcją filmu, jaki ma czyjaś gra na fortepianie w moim salonie z książką, którą właśnie czytam”. — Igor Strawiński"
 elgar.416.g: "Dawno temu miałem pomysł na scenariusz o archeologu poszukującym Arki Przymierza, ale ktoś mi go ukradł."
 elgar.417.t: "Sezon dyrygencki dobiega końca"
 elgar.417.d: "Zakończył się ostatni występ sezonu koncertowego. W prasie pojawiły się już recenzje. Wygląda na to, że [GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetLastName] dobrze się spisał i zdobył uznanie. Podobno poziom państwowej orkiestry znacznie wzrósł, co podnosi muzyczną renomę naszego kraju."
 elgar.417.f: "Kompozytorzy, którzy nie są jeszcze dyrygentami, mogą zdobyć umiejętność dyrygowania dzięki praktyce po zakończeniu sezonu koncertowego. Najpóźniej po trzecim sezonie uzyskanie statusu dyrygenta jest pewne. To dobry sposób na wyszkolenie kompozytorów niebędących wirtuozami, a następnie wysłanie ich w tournée."
 elgar.417.g: "Da capo!"
 elgar.421.d: "Nasz kompozytor zmaga się obecnie z poważną blokadą twórczą."
 elgar.422.t: "Spacer"
 elgar.422.d: "Podczas spaceru na łonie natury [SCOPE.sCharacter('elgar_conductor').GetFullName] znalazł inspirację, która pozwoliła mu posunąć pracę naprzód."
 elgar.422.f: "Natura inspirowała już wielu kompozytorów. Beethoven zaszywał się na wsi i zbierał tam wrażenia, które później zainspirowały go do napisania 6. symfonii. Gustav Mahler urządził sobie nawet niewielki domek do komponowania."
 elgar.422.g: "Śladami Beethovena."
 elgar.423.t: "Za mało wygód"
 elgar.423.f: "Gdy tylko powierzy się artystom ważne zadanie, od razu pojawiają się specjalne życzenia. Poważna osobistość życia publicznego szybko staje się diwą, gdy da się jej odczuć własną ważność. Nim się obejrzysz, sława uderza tym ludziom do głowy."
 elgar.423.g: "Zapewnijcie mu wygody"
 elgar.424.t: "Zakłócenia"
 elgar.424.f: "Pewna osoba uprzykrza życie [SCOPE.sCharacter('elgar_conductor').GetFullName]. Być może to wielbiciel, a może po prostu ktoś, kto liczy na zdobycie wpływów politycznych dzięki bliskiej znajomości ze sławną osobistością. Można by wręcz nazwać tę osobę fanatycznym wielbicielem. Natarczywość stała się już tak uciążliwa, że [SCOPE.sCharacter('elgar_conductor').GetLastName] skarży się na paranoję. Niestety „wielbiciel” jest wysoko postawioną postacią polityczną, której publiczne napiętnowanie miałoby oczywiste konsekwencje."
 elgar.424.g: "Nie przeszkadzajcie mu!"
 elgar.424.h: "Musi sobie z tym poradzić."
 elgar.431.t: "[SCOPE.sCharacter('elgar_conductor').GetCustom('elgar_composer_masterpiece_for_concerto_event_type')]"
 elgar.431.d: "Po kilku miesiącach wysiłku i pracy twórczej [SCOPE.sCharacter('elgar_conductor').GetFullName] zaprezentował dziś [SCOPE.sCharacter('elgar_conductor').GetHerHis] [SCOPE.sCharacter('elgar_conductor').GetCustom('elgar_composer_masterpiece_for_concerto_event_type')], osobiście stając za pulpitem dyrygenckim."
 elgar.431.f: "Od późnego baroku przez koncert rozumie się najczęściej kompozycję instrumentalną przeznaczoną dla jednego lub kilku solistów z towarzyszeniem orkiestry lub innego zespołu. Pierwsze utwory tego gatunku wyłoniły się z concerto grosso na początku XVIII wieku. Pełnię rozwoju osiągnął on w epoce klasycyzmu. Zazwyczaj składa się z trzech części, z wolną częścią środkową."
 elgar.432.t: "[SCOPE.sCharacter('elgar_conductor').GetCustom('elgar_composer_masterpiece_for_symphony_event_type')]"
 elgar.432.d: "Dziś wieczorem w sali koncertowej odbywa się wyjątkowy występ: wyższe sfery zgromadziły się, aby wysłuchać premiery nowego dzieła autorstwa [SCOPE.sCharacter('elgar_conductor').GetFullName], [SCOPE.sCharacter('elgar_conductor').GetCustom('elgar_composer_masterpiece_for_symphony_event_type')]."
 elgar.432.f: "Symfonia to określenie utworów instrumentalnych, których forma i obsada zmieniały się na przestrzeni wieków. Klasyczna forma symfonii wykształciła się w XVIII wieku i zachowała dominującą pozycję w muzyce orkiestrowej jeszcze długo w XX wieku. Jest to utwór na orkiestrę bez solistów, składający się z kilku części, zwykle trzech lub czterech, rzadziej pięciu. Od czasu 9. symfonii Ludwiga van Beethovena pojawiają się niekiedy również partie wokalne (solistów lub chóru), na przykład u Gustava Mahlera, choć rola orkiestry pozostaje dominująca."
 elgar.433.t: "[SCOPE.sCharacter('elgar_conductor').GetCustom('elgar_composer_masterpiece_for_opera_event_type')]"
 elgar.433.d: "Opera „[SCOPE.sCharacter('elgar_conductor').GetCustom('elgar_composer_masterpiece_for_opera_event_type')]”, skomponowana przez maestra [GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetLastName] po wielu tygodniach i miesiącach wysiłku, uchodzi za kolejne szczytowe osiągnięcie tego muzycznego geniusza. Nadchodząca premiera zapowiada się na wielki sukces."
 elgar.433.f: "Opera to gatunek teatru muzycznego, który powstał w epoce baroku. Jest muzycznym opracowaniem utworu dramatycznego, wykonywanym przez zespół śpiewaków z towarzyszeniem orkiestry, a niekiedy również chóru i zespołu baletowego. Oprócz śpiewu wykonawcy grają i tańczą na scenie teatralnej, której oprawę tworzą malarstwo, architektura, rekwizyty, oświetlenie i technika sceniczna. Maski i kostiumy podkreślają charakter odgrywanych postaci. Za ojca opery uważa się Claudia Monteverdiego, który swoim Orfeuszem wyznaczył wzorce tego gatunku. W XIX wieku nowe standardy wyznaczyły opery Richarda Wagnera."
 elgar.440.t: "Muzyka Ludowa"
 elgar.440.d: "Podróżując po wiejskich zakątkach kraju, [SCOPE.sCharacter('elgar_conductor').GetFullName] z wielkim zainteresowaniem poznaje, zapisuje i zbiera tańce oraz pieśni miejscowej ludności."
 elgar.440.f: "XIX-wieczny nacjonalizm sprawił, że wiele wcześniej pogardzanych form muzycznych nagle wzbudziło zainteresowanie, ponieważ miały rzekomo odzwierciedlać duszę narodu. Regionalni historycy i miejscowi muzycy zbierali tradycyjne pieśni. Niektórzy kompozytorzy również czerpali inspirację z twórczości ludowej, nadając jej zupełnie nową oprawę muzyczną."
 elgar.440.g: "Interesujący zbiór muzyczny."
 elgar.440.h: "[SCOPE.sCharacter('elgar_conductor').GetLastName] powinien skupić się na kulturze wysokiej, zamiast zajmować się muzyką kataryniarzy."
 elgar.441.t: "Szanta"
 elgar.441.d: "Zainspirowany czynami admirała [SCOPE.sCharacter('elgar_admiral').GetLastName], nasz kompozytor [SCOPE.sCharacter('elgar_conductor').GetFullName] napisał przy okazji niewielką szantę."
 elgar.441.f: "Dla marynarzy najważniejsza była zawsze pierwotna, praktyczna funkcja szanty jako pieśni pracy. Kwestie językowe i muzyczne odgrywały natomiast znikomą rolę. Wraz z początkiem rewolucji przemysłowej wzrosło zapotrzebowanie na szybsze statki. Pękate żaglowce wschodnioindyjskie zniknęły, ustępując miejsca kliprom i fregatom. Z czasem szanty zaczęły więc tracić praktyczne zastosowanie w żegludze i śpiewano je już tylko dla odpoczynku i rozrywki. Muzycy zbierali dawne szanty lub czerpali z nich inspirację do własnych utworów."
 elgar.441.g: "Yo Ho!"
 elgar.442.t: "Marsz"
 elgar.442.d: "Zainspirowany wartościami wyznawanymi przez generała [SCOPE.sCharacter('elgar_general').GetFullName], nasz kompozytor [SCOPE.sCharacter('elgar_conductor').GetFullName] napisał nowy marsz wojskowy."
 elgar.442.f: "Marsz przeżywał rozkwit zwłaszcza w XIX i na początku XX wieku, w czasach nacjonalistycznych i militarystycznych tendencji oraz rewolucji. Przykładem jest Gioachino Rossini, który nie tylko regularnie włączał pompatyczne marsze do swoich oper, lecz także komponował utwory dla poszczególnych władców. Należał do nich zamówiony przez tureckiego sułtana Abdülmecida I „Marcia per il Sultano”, do dziś regularnie wykonywany przez włoskie orkiestry wojskowe. Tendencje XIX wieku dobrze ilustruje również twórczość wiedeńskiej rodziny Straussów, której członkowie przy każdej stosownej okazji komponowali marsze, aby wyrazić patriotyzm lub lojalność wobec cesarza bądź uhonorować wojskowych."
 elgar.442.g: "Nowy materiał dla wojska."
 elgar.443.t: "Kunstlied"
 elgar.443.d: "Na podstawie wiersza wielkiego poety [SCOPE.sCharacter('elgar_conductor').GetFullName] skomponował przy okazji pieśń artystyczną."
 elgar.443.f: "W tradycji zachodniej muzyki klasycznej termin Lied oznacza muzyczne opracowanie poezji w formie utworu wielogłosowego. We współczesnej niemczyźnie słowo to określa wszelkiego rodzaju pieśni i piosenki, lecz w językach angielskim i francuskim często używa się go zamiennie z określeniem „pieśń artystyczna”, obejmując nim również utwory w innych językach inspirowane tą tradycją. Wiersze wykorzystywane w pieśniach tego rodzaju często poruszają tematykę sielankową lub miłości romantycznej."
 elgar.443.g: "Czy to nie mogło być coś innego...?"
 elgar.444.t: "Sonata Fortepianowa [SCOPE.GetRootScope.GetCountry.GetCustom('elgar_custom_music_chord_name')] [SCOPE.GetRootScope.GetCountry.GetCustom('elgar_custom_music_major_minor_name')]"
 elgar.444.d: "Utwory fortepianowe należą do standardowego repertuaru muzyki klasycznej. W ramach wprawki przed kolejnym wielkim dziełem [SCOPE.sCharacter('elgar_conductor').GetFullName] napisał sonatę i wykonał ją wczoraj wieczorem podczas kameralnego przyjęcia."
 elgar.444.f: "Na początku XIX wieku zdefiniowano formę sonatową na podstawie dotychczasowej praktyki oraz dzieł wybitnych kompozytorów klasycznych, zwłaszcza Haydna, Mozarta i Beethovena, ale także twórców takich jak Clementi. W tym okresie zaczęto omawiać różnice między układem trzyczęściowym a czteroczęściowym, podkreślając, że koncert składa się z trzech części, a symfonia z czterech. Do utworów wyraźnie określanych jako sonaty fortepianowe należą trzy sonaty Fryderyka Chopina, sonaty Feliksa Mendelssohna, trzy sonaty Roberta Schumanna, Sonata h-moll Franza Liszta, a także późniejsze sonaty Johannesa Brahmsa i Siergieja Rachmaninowa."
 elgar.444.g: "Klasyka."
 elgar.445.t: "Traktat o Muzyce"
 elgar.445.d: "W ostatnich miesiącach [SCOPE.sCharacter('elgar_conductor').GetFullName] intensywnie pracował nad nowym traktatem o instrumentacji i instrumentoznawstwie. Dzieło uznaje się za wkład w rozwój innowacji muzycznych."
 elgar.445.f: "„Potrzeba wiele czasu, by odnaleźć oceany muzyki, lecz jeszcze więcej, by nauczyć się po nich żeglować”. — Hector Berlioz"
 elgar.445.g: "Ważna praca teoretyczna."
 elgar.446.t: "Requiem"
 elgar.446.d: "Wpływowy przedstawiciel duchowieństwa katolickiego zwrócił się niedawno do [SCOPE.sCharacter('elgar_conductor').GetFullName] z prośbą o napisanie nowego utworu sakralnego w związku ze śmiercią powszechnie szanowanego biskupa."
 elgar.446.f: "Liturgiczną formą mszy żałobnej jest requiem. Termin ten określa zarówno liturgię mszy świętej sprawowanej podczas katolickiego nabożeństwa pogrzebowego, jak i kompozycje muzyki kościelnej służące upamiętnieniu zmarłych. Pochodzi od początkowych słów introitu Requiem aeternam dona eis, Domine („Wieczny odpoczynek racz im dać, Panie”). Części zmienne liturgii requiem odpowiadają częściom liturgii Dnia Zadusznego. Introit, jako pierwsza część muzycznego opracowania mszy, był zwykle opracowywany przez kompozytorów, podobnie jak ofertorium, w przeciwieństwie do sekwencji, którą z różnych powodów niekiedy skracano lub całkowicie pomijano. W requiem nie opracowuje się muzycznie części Gloria i Credo, ponieważ nie są one śpiewane ani recytowane w liturgii mszy żałobnej."
 elgar.446.g: "Requiem aeternam dona eis, Domine."
 elgar.447.t: "Odważna Opera"
 elgar.447.d: "Najnowsza kompozycja autorstwa [SCOPE.sCharacter('elgar_conductor').GetFullName] spotkała się z krytyką cenzury. Niewątpliwie ma wysoką wartość artystyczną, ale może wywołać wzburzenie. Inteligencja naszego kraju już protestuje."
 elgar.447.f: "Przez większą część XIX wieku nawet najwybitniejsi kompozytorzy musieli podporządkowywać się cenzurze. Liczne muzyczne opracowania Figara uznawano za szczególnie wywrotowe ze względu na rewolucyjną tematykę. Domniemane bluźnierstwa i inne przejawy niemoralności również były solą w oku cenzorów. W pewnym momencie niektórzy kompozytorzy nie wytrzymywali już szykan i opuszczali swoich mecenasów."
 elgar.447.g: "Sztuka powinna uszlachetniać, a nie wywoływać wzburzenie."
 elgar.447.h: "Powinniśmy nieco złagodzić cenzurę."
 elgar.448.t: "Pojedynek Kompozytorów"
 elgar.448.d: "[SCOPE.sCharacter('rival_composer_scope').GetFullName], kompozytor z [SCOPE.sCountry('rival_composer_country_scope').GetName], w przypływie typowej dla tego kraju arogancji nazwał naszego kompozytora [GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetFullName] „nikomu nieznaną postacią” i podważył samą pozycję naszego narodu w świecie muzyki."
 elgar.448.f: "„Rozdrobnienie i dowolność naszego stylu muzycznego zostały, jeśli nie wywołane, to przynajmniej doprowadzone do skrajności przez dążenie Mendelssohna do wyrażania niejasnej, niemal pozbawionej znaczenia treści w sposób możliwie interesujący i oszałamiający umysł. Podczas gdy Beethoven, ostatni z grona naszych prawdziwych bohaterów muzyki, miał najgorętsze pragnienie i cudowną zdolność wyrażania niewysłowionej treści z największą jasnością i pewnością poprzez wyraziste, plastyczne kształtowanie obrazów dźwiękowych, Mendelssohn przeciwnie, zaciera w swoich utworach te wypracowane formy, zmieniając je w rozpływający się, fantastyczny obraz cieni. Jego nieokreślona gra barw dowolnie pobudza naszą kapryśną wyobraźnię, lecz nasza głęboka, czysto ludzka tęsknota za jasną wizją artystyczną ledwie zaznaje nadziei na spełnienie”. — Richard Wagner o Feliksie Mendelssohnie"
 elgar.448.g: "Przyjmujemy wyzwanie."
 elgar.448.h: "Nie przetrwamy tego pojedynku."
 elgar.449.t: "Zwycięstwo w Pojedynku Kompozytorów"
 elgar.449.d: "[GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetFullName] dowiódł, że jest znacznie sławniejszym i zdolniejszym kompozytorem od swojego obłudnego rywala, broniąc tym samym renomy naszego kraju jako ośrodka kultury."
 elgar.449.f: "„Nic nie ukazuje wyraźniej potęgi Wagnera i burzy, którą rozpętał, niż dekadencja, którą jego twórczość wręcz uświęciła i która od jego czasów rozwija się w zawrotnym tempie. Jak potężny musiał być ten człowiek, skoro zniszczył z natury muzyczną formę (operę) z taką energią, że pięćdziesiąt lat po jego śmierci wciąż uginamy się pod gruzami i zgiełkiem dramatu muzycznego! Prestiż Syntezy Sztuk nadal bowiem trwa. Czy to właśnie nazywa się Postępem? Być może. Chyba że kompozytorzy znajdą siłę, by zrzucić to ciężkie dziedzictwo, idąc za godnym podziwu wezwaniem Verdiego: «Powróćmy do dawnych czasów, a będzie to postęp»”. — Igor Strawiński o Richardzie Wagnerze"
 elgar.449.g: "Teraz już wiadomo, który kraj wiedzie prym w kulturze!"
 elgar.450.t: "Porażka w Pojedynku Kompozytorów"
 elgar.450.d: "Niestety nasz kompozytor przegrał rywalizację z zagranicznym konkurentem. Cały świat jest teraz przekonany, że pozostaliśmy w tyle pod względem muzycznym!"
 elgar.450.f: "„Czy Wagner w ogóle jest człowiekiem? Czy nie jest raczej chorobą? Wszystko, czego dotknie, staje się chore, zaraził chorobą samą muzykę”. — Friedrich Nietzsche o Richardzie Wagnerze"
 elgar.450.g: "Teraz już wiadomo, który kraj wiedzie prym w kulturze..."
 elgar.451.t: "Maestro wyrusza do [SCOPE.sCountry('elgar_composer_destination_scope').GetNameNoFlag]"
 elgar.451.d: "Nasz kompozytor [GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetFullName] zakończył wszystkie przygotowania. Pierwszym celem trwającego dwa i pół roku tournée koncertowego będzie [SCOPE.sCountry('elgar_composer_destination_scope').GetName]."
 elgar.451.f: "„Jeśli kiedyś nadejdzie koniec świata, pojadę do Wiednia, bo tam wszystko dzieje się pięćdziesiąt lat później”. — Gustav Mahler"
 elgar.451.g: "Wyślij nam pocztówkę!"
 elgar.452.t: "[SCOPE.sCharacter('elgar_composer_scope').GetLastName] przybywa do [GetPlayer.GetNameNoFlag]"
 elgar.452.d: "Podróżujący kompozytor zatrzymał się w naszym kraju podczas swojego tournée i postanowił zostać na pewien czas."
 elgar.452.f: "[SCOPE.sCharacter('elgar_composer_scope').GetCustom('elgar_composer_achievements_switch_to_character_scope_type')]"
 elgar.452.g: "Witamy, witamy!"
 elgar.453.t: "Podróżujący Kompozytor wyjeżdża"
 elgar.453.d: "Po kilkutygodniowym pobycie i kilku występach, które przyniosły mu uznanie miejscowej ludności, podróżujący kompozytor ruszył w dalsze tournée."
 elgar.453.f: "Cel podróży kompozytora zależy od wielu czynników. Decydujące znaczenie mają teatry operowe i bliskość poprzedniego miejsca pobytu. Rolę odgrywają również technologie kulturalne, obecność Centrum Sztuki (Impresjonizmu, Ekspresjonizmu, Secesji) lub istnienie konserwatorium. Kompozytorzy unikają miejsc, w których niedawno występował ich rywal."
 elgar.453.g: "Mamy nadzieję, że wkrótce znów się zobaczymy!"
 elgar.455.t: "Kompozytor wraca z tournée"
 elgar.455.d: "[GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetFullName] powrócił z [GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetHerHis] tournée. Zaznaczył swoją obecność w świecie muzyki i znacznie umocnił swoją renomę."
 elgar.455.f: "Tournée służą wyłącznie zwiększaniu renomy kompozytora. Efekty zależą od jego umiejętności. Znaczenie mają własne kompozycje, ale także cechy charakteru. Postacie innowacyjne lub ambitne mają przewagę. Kompozytorzy posiadający zarówno cechę Dyrygent, jak i Wirtuoz otrzymują specjalną premię."
 elgar.455.g: "Witamy z powrotem, maestro."
 elgar.501.t: "Canto degli Italiani"
 elgar.501.d: "W atmosferze powszechnej walki o zjednoczenie i niepodległość Włoch 20-letni student i patriota Goffredo Mameli napisał porywającą pieśń, którą nazwał „Pieśnią Włochów”. W krótkim czasie zdobyła znaczną popularność."
 elgar.501.f: "Il Canto degli Italiani (Pieśń Włochów) jest najbardziej znana wśród Włochów jako „Inno di Mameli” (Hymn Mamelego), od nazwiska autora tekstu, lub „Fratelli d’Italia” (Bracia Włosi), od słów pierwszego wersu. Muzykę do tekstu skomponował Michele Novaro. Hymn cieszył się ogromną popularnością przez cały okres Risorgimenta i w kolejnych dziesięcioleciach. Wydrukowano go również na ulotkach w Genui i rozpowszechniono 10 grudnia. Manifestację oficjalnie poświęcono 101. rocznicy wyparcia Austriaków z miasta. W rzeczywistości był to pretekst do protestu przeciw obcej okupacji ziem włoskich i skłonienia Karola Alberta do poparcia włoskiej sprawy wolnościowej. Przy tej okazji pokazano trójkolorową flagę i po raz pierwszy publicznie odśpiewano hymn Mamelego."
 elgar.501.g: "Powinno istnieć prawo, które tego zabrania..."
 elgar.501.h: "Fratelli d'Italia, l'Italia s'è desta!"
 elgar.503.t: "Deutschlandlied"
 elgar.503.d: "W odpowiedzi na ponowne dążenia ekspansjonistyczne Francji, uznającej Ren za naturalną granicę, poeta Hoffmann von Fallersleben napisał pieśń, która zdobyła szeroką popularność jako „Deutschlandlied”."
 elgar.503.f: "Pieśń Niemców, znana również jako Deutschlandlied, została napisana przez Augusta Heinricha Hoffmanna von Fallerslebena na Helgolandzie. Bezpośrednim powodem jej powstania były francuskie roszczenia terytorialne do Nadrenii podczas kryzysu reńskiego. Hoffmann odrzucił je w swojej pieśni, podobnie jak autorzy innych ówczesnych niemieckich pieśni reńskich. Uzupełnił ten przekaz o dalsze idee, zwłaszcza jedność Niemiec, która jako jedyna mogła zapewnić warunki do odparcia wrogich ataków o dowolnej skali. Poeta napisał utwór specjalnie do melodii dawnego hymnu cesarskiego Josepha Haydna „Boże, zachowaj cesarza Franciszka” (1797). Pieśń zyskała większe znaczenie dopiero podczas pierwszej wojny światowej. Jej trzecia zwrotka stanowi tekst niemieckiego hymnu narodowego od 1952 roku."
 elgar.503.g: "Niemieckie wino i niemiecka pieśń!"
 elgar.503.h: "Niemcy, Niemcy ponad wszystko!"
 elgar.503.i: "Musisz się mylić, ta pieśń nosi tytuł „Gott erhalte Franz den Kaiser”."
 elgar.504.t: "Śmierć Paganiniego"
 elgar.504.d: "Śmierć słynnego wirtuoza skrzypiec Niccolò Paganiniego wywołała kontrowersje wokół jego pogrzebu."
 elgar.504.f: "Niccolò Paganini był włoskim skrzypkiem i kompozytorem. Jako najsłynniejszy wirtuoz skrzypiec swoich czasów zapisał się w historii jako jeden z twórców nowoczesnej techniki skrzypcowej. Jego 24 kaprysy na skrzypce solo op. 1 należą do najbardziej znanych kompozycji w jego dorobku i inspirowały wielu wybitnych kompozytorów. W maju 1840 roku biskup Nicei wysłał do Paganiniego miejscowego proboszcza, by udzielił mu ostatnich sakramentów. Paganini uznał, że jest na to za wcześnie, i odmówił. Tydzień później, 27 maja 1840 roku, 57-letni artysta zmarł wskutek krwotoku wewnętrznego, zanim zdążono wezwać księdza. Z tego powodu, a także ze względu na rozpowszechnione pogłoski o jego związkach z diabłem, Kościół odmówił mu katolickiego pochówku w Genui. Wywołało to publiczną dyskusję nad dalszym postępowaniem w sprawie Paganiniego. Pojawiają się głosy, by wywrzeć presję na Kościół, pochować artystę w Genui z honorami należnymi jego pozycji i przejąć jego dziedzictwo. Doprowadziłoby to jednak do otwartego sporu z władzami kościelnymi."
 elgar.504.g: "Zapewnijcie mu godny pochówek i zadbajcie o jego dziedzictwo."
 elgar.504.h: "Nie ingerujcie w tę delikatną sprawę."
 elgar.505.t: "Nabucco"
 elgar.505.d: "Giuseppe Verdi odniósł największy dotąd sukces w swojej karierze dzięki najnowszej operze. Jednocześnie dzieło to rozbudza uczucia narodowe Włochów."
 elgar.505.f: "Nabucco to włoskojęzyczna opera w czterech aktach, skomponowana w 1841 roku przez Giuseppe Verdiego do włoskiego libretta Temistoclego Solery. Najbardziej znanym fragmentem opery jest „Chór niewolników hebrajskich”, który podczas współczesnych przedstawień w wielu teatrach operowych jest regularnie bisowany. Nabucco uważa się za operę, która na trwałe ugruntowała renomę Verdiego jako kompozytora. Sam stwierdził: „To opera, od której naprawdę zaczyna się moja kariera artystyczna. I choć musiałem pokonać wiele trudności, pewne jest, że Nabucco narodził się pod szczęśliwą gwiazdą”. Opowieść o niewoli Żydów w Babilonii odniosła przełomowy sukces w całych Włoszech, między innymi dlatego, że w epoce nacjonalizmu Włosi czuli się podporządkowani obcym mocarstwom. To, w jakim stopniu Verdi rzeczywiście odwoływał się w Nabucco do włoskich uczuć narodowych, pozostaje przedmiotem sporów do dziś."
 elgar.505.g: "Va pensiero ..."
 elgar.505.h: "Znowu ci buntowniczy Włosi."
 elgar.507.t: "Aida"
 elgar.507.d: "Z okazji otwarcia Kanału Sueskiego Giuseppe Verdi zaprezentował premierę swojej opery Aida, utrzymanej w egipskim klimacie, choć z niewielkim opóźnieniem."
 elgar.507.f: "Aida to opera w czterech aktach Giuseppe Verdiego do włoskiego libretta Antonia Ghislanzoniego, opartego na scenariuszu często przypisywanym francuskiemu egiptologowi Auguste’owi Mariette’owi, choć pojawiały się opinie, że w rzeczywistości napisał go Temistocle Solera. Isma’il Pasza, kedyw Egiptu, zamówił operę u Verdiego, płacąc mu 150,000 franków, lecz premiera uległa opóźnieniu. Gdy wreszcie wystawiono ją w Kairze, spotkała się z wielkim uznaniem. Kostiumy i dodatki zaprojektował Auguste Mariette, który nadzorował również projektowanie i wykonanie dekoracji, przygotowanych w Paryżu i przewiezionych do Kairu. Choć Verdi nie uczestniczył w kairskiej premierze, był bardzo niezadowolony z faktu, że publiczność składała się z zaproszonych dostojników, polityków i krytyków, a zabrakło wśród niej zwykłych widzów. Za prawdziwą premierę uważał więc pierwsze wystawienie dzieła we Włoszech, a zarazem w Europie, w mediolańskiej La Scali, w którego przygotowanie był mocno zaangażowany na każdym etapie."
 elgar.507.g: "Triumf Włoch!"
 elgar.507.h: "Triumf [ROOT.GetCountry.GetNameNoFlag]!"
 elgar.509.t: "Franz Schubert"
 elgar.509.d: "13 lat po śmierci Franza Schuberta jego 5. symfonię zaprezentowano szerokiej publiczności."
 elgar.509.f: "5. symfonia B-dur jest być może najdoskonalszą z młodzieńczych symfonii Schuberta i powszechnie uchodzi za jego pierwszą „dojrzałą” symfonię. Jej opracowanie odznacza się doskonałością muzyki kameralnej, ponieważ obsada jest mniejsza niż w którejkolwiek z pozostałych symfonii kompozytora, a proporcje poszczególnych części są starannie wyważone. Można ją odczytywać jako twórczy dialog Schuberta z symfoniką Mozarta, ujawniający zarazem jego pełną odrębność i samodzielność. Według zapisków Schuberta na partyturze utwór powstawał od września do 3 października 1816 roku, w okresie poszukiwania własnego języka muzycznego. Pierwsze wykonanie 5. symfonii Schuberta odbyło się w Wiedniu w 1816 roku z udziałem niewielkiej orkiestry amatorskiej. Publicznie wykonano ją jednak dopiero 17 października 1841 roku, trzynaście lat po śmierci kompozytora, pod batutą Michaela Leitermayera."
 elgar.509.g: "Nawet z nieba Schubert zachwyca nas swoją muzyką."
 elgar.510.t: "Kontrowersje wokół Poliuta"
 elgar.510.d: "Niemożliwy do zażegnania spór między królem a kompozytorem Donizettim grozi zwolnieniem tego ostatniego."
 elgar.510.f: "W latach 1829–1838 Gaetano Donizetti był dyrektorem muzycznym Teatrów Królewskich w Neapolu i mimo podróży oraz zamówień z innych państw pozostawał faktycznie najważniejszą postacią życia kulturalnego królestwa i jego najsłynniejszym przedstawicielem. W Neapolu powstał cały szereg jego słynnych oper, które ugruntowały pozycję Królestwa Obojga Sycylii jako czołowego ośrodka muzycznego. Mimo licznych sukcesów Donizetti musiał jednak nieustannie zmagać się z neapolitańską cenzurą, która okaleczała jego libretta lub całkowicie zakazywała wystawiania oper. W najnowszym sporze sam król interweniował, aby uniemożliwić wystawienie opery Poliuto. Po wielu latach zatargów z cenzurą Donizetti ma już dość i poczynił przygotowania do ucieczki do Paryża. Elity polityczne zgodnie poparły króla. Powstrzymanie Donizettiego przed wyjazdem nie tylko wywołałoby wstrząs w życiu politycznym i społecznym, lecz także poważnie zaszkodziłoby autorytetowi i reputacji monarchy."
 elgar.510.g: "Król przemówił, niech się pakuje."
 elgar.510.h: "Musimy zrobić wszystko, by powstrzymać Donizettiego przed wyjazdem!"
 elgar.511.t: "Les Martyres, 1840"
 elgar.511.d: "Włoski kompozytor Gaetano Donizetti przybył do Paryża i wystawił tam swoją operę „Męczennicy”, która spotkała się z niezwykle ciepłym przyjęciem publiczności."
 elgar.511.f: "Poliuto to tragedia liryczna (opera tragiczna) w trzech aktach Gaetana Donizettiego do włoskiego libretta Salvadorego Cammarana, opartego na sztuce Pierre’a Corneille’a Polyeucte, napisanej w latach 1641/42. Przedstawia życie wczesnochrześcijańskiego męczennika, świętego Polieukta. Jeden z autorów uznał Poliuta za „najbardziej osobistą operę” Donizettiego, z muzyką należącą do „najwspanialszych, jakie skomponował”. Dzieło powstało w 1838 roku z myślą o przedstawieniach planowanych na później w tym samym roku w neapolitańskim Teatro San Carlo. Tuż przed rozpoczęciem prób król Ferdynand II nie zgodził się jednak na ukazanie na scenie męczeństwa chrześcijańskiego świętego i zakazał wystawienia opery. Rozgniewany tą decyzją Donizetti, który miał już zamówienie od Opery Paryskiej, zapłacił Teatro San Carlo karę za niedostarczenie w zamian nowego dzieła i wyjechał z Neapolu do Paryża. Jako pierwsze dzieło na paryskie zamówienie postanowił przerobić Poliuta. W latach 1839–40 opracował francuską wersję pod tytułem Męczennicy."
 elgar.511.g: "Nieźle jak na Włocha."
 elgar.512.t: "Stabat Mater"
 elgar.512.d: "Gaetano Donizetti przybył do Bolonii, aby poprowadzić premierowe wykonanie Stabat Mater Gioachina Rossiniego. Występ zakończył się pełnym sukcesem."
 elgar.512.f: "Gdy Donizetti udał się do Bolonii, by poprowadzić Stabat Mater, Rossini przybył na trzecie wykonanie. Obaj kompozytorzy, niegdysiejsi uczniowie Konserwatorium Bolońskiego, spotkali się wówczas po raz pierwszy. Rossini oświadczył, że Donizetti jest „jedynym maestrem we Włoszech, który potrafi poprowadzić moje Stabat tak, jak sobie tego życzę”. Przyjaciele Donizettiego, w tym jego szwagier Antonio Vasselli (zwany Totò), nieustannie próbowali przekonać go do objęcia posady akademickiej w Bolonii zamiast stanowiska na dworze wiedeńskim. Choćby dlatego, że zapewniłoby mu to stałą siedzibę, w której mógłby pracować i nauczać, nie wyczerpując się ciągłymi podróżami między miastami. Donizetti tak opisywał reakcję publiczności: „Tego entuzjazmu nie sposób opisać. Już po próbie generalnej, na której był obecny Rossini, w środku dnia odprowadzało go do domu z okrzykami ponad 500 osób. To samo działo się pierwszego wieczoru pod jego oknem, ponieważ nie pojawił się na sali”."
 elgar.512.g: "Rossini i Donizetti, duet jak z nieba!"
 elgar.513.t: "Czy Donizetti popada w obłęd?"
 elgar.513.d: "Coraz szybsze pogarszanie się stanu psychicznego Donizettiego doprowadziło do umieszczenia go w szpitalu psychiatrycznym w Paryżu."
 elgar.513.f: "Począwszy od lat dwudziestych XIX wieku, Donizetti przez długi czas wspominał w listach o bólach głowy, niekiedy jednodniowych napadach gorączki, a także sporadycznych stanach przygnębienia. Ogrom pracy, jaką wykonywał przez całe życie, oraz długie i szczególnie wyczerpujące w tamtych czasach podróże, zwłaszcza po przeprowadzce do Paryża, a później do Wiednia, doprowadziły w latach 1842–1843 do nasilenia objawów wyczerpania. Okresowym bólom głowy i napadom gorączki towarzyszyły zawroty głowy, a czasem także „dziwne odczucia w głowie”. W 1845 roku stan zdrowia Donizettiego gwałtownie się pogorszył, a kompozytor zasłabł na ulicy w Paryżu. Lekarze zabronili mu komponować, co jeszcze bardziej go przygnębiło. W końcu podstępem zwabiono go do szpitala psychiatrycznego w Ivry-sur-Seine, nie ujawniając mu prawdziwego celu wizyty, i przymusowo umieszczono go tam wbrew jego woli. Schorowany kompozytor szybko zrozumiał, że stał się „więźniem” uznanym za „szaleńca”, i pisał do przyjaciół oraz krewnych rozpaczliwe, rozdzierające serce listy z prośbą o pomoc."
 elgar.513.g: "Może tak będzie lepiej."
 elgar.513.h: "Zabierzcie go ze szpitala psychiatrycznego i zapewnijcie mu odpoczynek w Bergamo."
 elgar.514.f: "Uwolnienie Donizettiego ze szpitala psychiatrycznego zajęło aż 17 miesięcy. Planowany wyjazd udaremniali lekarze, a z niejasnych powodów także prefekt paryskiej policji. Dopiero naciski dyplomatyczne pozwoliły jego bratu Francescowi i bratankowi Andrei sprowadzić całkowicie już apatycznego kompozytora do ojczyzny. Córka baronowej Rosy Rota-Basoni codziennie grała mu na fortepianie i śpiewała arie z jego dzieł, przyjaciel Dolci przemawiał do niego w dialekcie bergamskim, odwiedził go też tenor Rubini, lecz Donizetti nie wykazywał już żadnych reakcji. Zmarł tydzień po udarze mózgu, któremu towarzyszyły porażenie połowicze, wysoka gorączka i późniejsze infekcje. Sekcja zwłok wykazała ślady „przebytego” zapalenia opon mózgowo-rdzeniowych oraz częściowe uszkodzenie i stan zapalny rdzenia kręgowego."
 elgar.514.g: "Tragiczna śmierć."
 elgar.515.t: "Donizetti wyleczony"
 elgar.515.d: "Kompozytor odzyskał zdrowie po intensywnej kuracji i chce znów komponować z nowym zapałem do życia."
 elgar.515.f: "Pod naciskiem naszego rządu Donizetti został szybko zwolniony ze szpitala psychiatrycznego. Z zalecenia lekarzy miał odbyć kilkumiesięczną kurację w rodzinnym Bergamo, w najlepszych możliwych warunkach. Powrót do wiejskiego życia i własnych korzeni oraz uwolnienie od stresu i presji przyniosły po wielu miesiącach owoce. Donizetti, przez wiele tygodni pogrążony w apatii, zareagował na jedną ze swoich arii, śpiewaną przez Giovannę, córkę baronowej Rosy Rota-Basoni. Rozmowy z członkami rodziny w miejscowym dialekcie również przynosiły z dnia na dzień postępy. Po latach terapii kompozytor, niegdyś uznany za śmiertelnie chorego, zdaje się wracać do życia."
 elgar.515.g: "Cud medycyny."
 elgar.516.t: "Liszt kontra Thalberg"
 elgar.516.d: "Dwaj najsłynniejsi pianiści zmierzyli się w Paryżu: Franz Liszt rzucił wyzwanie najwybitniejszemu żyjącemu pianiście, Sigismundowi Thalbergowi."
 elgar.516.f: "Zimą 1835/36 roku Sigismund Thalberg zadebiutował podczas prywatnego koncertu zorganizowanego przez sekretarza ambasady austriackiej w Paryżu. Obecni artyści, w tym Rossini i Meyerbeer, przyjęli go entuzjastycznie i okrzyknęli twórcą nowego stylu gry na fortepianie. Podczas gdy koncerty Franza Liszta w Lyonie przynosiły około 500-600 franków, Thalberg zarobił 10,000 franków za jeden koncert w Teatrze Włoskim. Zanim Thalberg wystąpił podczas swojego drugiego pobytu w Paryżu, Liszt opublikował recenzję pełną insynuacji i polemicznych uwag. Twierdził, że sukces Thalberga był wyłącznie zasługą propagandy. Od lutego 1837 roku Thalberg ponownie występował w Paryżu i znów budził zachwyt. 31 marca obaj artyści wystąpili podczas imprezy dobroczynnej zorganizowanej przez księżną Belgiojoso."
 elgar.516.g: "Thalberg był lepszy."
 elgar.516.h: "Liszt był lepszy."
 elgar.517.t: "Von der Wiege zum Grabe"
 elgar.517.d: "W Rzymie Franz Liszt ukończył swój ostatni poemat symfoniczny. Środowisko muzyczne nie wie, co sądzić o najnowszej „pomyłce” kompozytora."
 elgar.517.f: "W ostatnich latach życia Liszt coraz częściej zwracał się ku muzyce sakralnej i kościelnej. Jego ostatni poemat symfoniczny, „Od kołyski do grobu”, różnił się więc od wszystkich poprzednich. Inspiracją był rysunek węgierskiego malarza Mihálya Zichyego. Obszerne fragmenty utworu nie wymagają potężnej orkiestry, a zwłaszcza początek brzmi jak muzyka kameralna. Powstają liczne wyspy brzmieniowe o skąpym materiale muzycznym, a fragmenty solowe nie należą do rzadkości, szczególnie pod koniec poszczególnych części. Zastosowana harmonika również zapowiada nadchodzące czasy. Za życia kompozytora krytycy muzyczni oceniali jednak dzieło jako „pomyłkę starca”."
 elgar.517.g: "Przyszłe pokolenia zrozumieją."
 elgar.518.t: "Lohengrin"
 elgar.518.d: "Premiera Lohengrina Richarda Wagnera nie tylko przyciągnęła komplet widzów, ale także wywołała w Niemczech prawdziwą falę uwielbienia dla kompozytora."
 elgar.518.f: "Lohengrin to opera romantyczna w trzech aktach niemieckiego kompozytora Richarda Wagnera. W dziele tym Wagner stworzył nową formę operową, przekomponowany dramat muzyczny. Kompozycja nie dzieli się na osobne numery, lecz jest wykonywana bez przerw w obrębie każdego aktu. Wagner odchodzi tym samym od tradycyjnej struktury opery numerowej z ariami, recytatywami i partiami chóralnymi. Aby wyrazić życie wewnętrzne postaci scenicznych za pomocą czytelnych motywów muzycznych, posłużył się motywami przewodnimi (np. motywem Graala i motywem zakazu pytania). Opera zainspirowała inne dzieła sztuki. Król Bawarii Ludwik II nazwał swój zamek Neuschwanstein na cześć Rycerza Łabędzia."
 elgar.518.g: "Inspirujące."
 elgar.519.t: "Kunstwerk der Zukunft"
 elgar.519.d: "Inspirujące."
 elgar.519.f: "„Dzieło sztuki przyszłości” to rozprawa Richarda Wagnera z zakresu teorii sztuki, napisana w latach 1849–1852 w Zurychu. Podobnie jak w pracy „Sztuka i rewolucja” Wagner ubolewa nad upadkiem sztuk i rozwija swój model ich ponownego zjednoczenia, czyli „Gesamtkunstwerk”. Tak jak we wcześniejszych pismach przedstawia przekonanie, że sztuka grecka była zakorzeniona w greckiej religii i mistyce, a zniszczenie religii musiało doprowadzić również do utraty spójności sztuki i jej rozpadu na odrębne dziedziny (dramat, muzykę i taniec). Skarży się, że muzyka zubożała, stając się jedynie akompaniamentem słowa. W dalszej części wywodu szczegółowo omawia rozwój poszczególnych sztuk, od idealnego stanu w starożytności po dekadencję jego czasów. W kolejnym i najważniejszym dziele pisanym, „Operze i dramacie”, Richard Wagner bardzo dokładnie (i bardzo teoretycznie) wyjaśnia, jak wyobraża sobie optymalne „zjednoczenie” muzyki i poezji. Nieco później przystąpił do „praktycznej” realizacji tej idei i po latach pracy napisał tekst oraz skomponował muzykę do „Pierścienia Nibelunga”, wzorcowego dramatu muzycznego."
 elgar.519.g: "Kto ma zrozumieć te zawiłe, wielokrotnie złożone zdania?"
 elgar.520.t: "Tristan und Isolde"
 elgar.520.d: "Tristan i Izolda to opera w trzech aktach Richarda Wagnera do niemieckiego libretta jego autorstwa, opartego w dużej mierze na XII-wiecznym romansie Tristan i Izolda Gottfrieda von Strassburga. Opera wywarła ogromny wpływ na zachodnich kompozytorów muzyki klasycznej i stała się bezpośrednią inspiracją dla takich twórców jak Gustav Mahler, Richard Strauss, Alban Berg, Arnold Schönberg i Benjamin Britten. Inni kompozytorzy, między innymi Claude Debussy, Maurice Ravel i Igor Strawiński, kształtowali własny styl w opozycji do muzycznego dziedzictwa Wagnera. Wielu uznaje Tristana za kamień milowy w odchodzeniu od tradycyjnej harmoniki i tonalności oraz dzieło wyznaczające podstawy kierunku rozwoju muzyki klasycznej w XX wieku."
 elgar.520.f: "„Dziełem, które zawsze budziło mój największy podziw, jest Tristan. Wobec tego gigantycznego gmachu ogarnia mnie zdumienie połączone z dreszczem i wciąż wydaje mi się niewiarygodne, że człowiek mógł coś takiego wymyślić i urzeczywistnić. Drugi akt uważam za jeden z najwznioślejszych wytworów ludzkiego ducha, jakie kiedykolwiek powstały. Ten drugi akt jest cudowny, cudowny, niewysłowienie cudowny”. — Giuseppe Verdi"
 elgar.521.t: "Festiwal Richarda Wagnera"
 elgar.521.d: "Powstanie Teatru Festiwalowego Richarda Wagnera uchodzi za jedno z najważniejszych wydarzeń w kulturze muzycznej XIX wieku."
 elgar.521.f: "Festiwal w Bayreuth to coroczny festiwal muzyczny, podczas którego wystawiane są opery XIX-wiecznego niemieckiego kompozytora Richarda Wagnera. Sam Wagner wymyślił i propagował ideę specjalnego festiwalu poświęconego własnym dziełom, zwłaszcza monumentalnemu cyklowi „Pierścień Nibelunga” i „Parsifalowi”. Przedstawienia odbywają się w specjalnie zaprojektowanym Teatrze Festiwalowym w Bayreuth. Wagner osobiście nadzorował projektowanie i budowę teatru, w którym zastosowano liczne nowatorskie rozwiązania architektoniczne, aby pomieścić ogromne orkiestry przewidziane w jego kompozycjach oraz urzeczywistnić jego szczególną wizję inscenizacji. Festiwal stał się celem pielgrzymek wielbicieli Wagnera i miłośników muzyki klasycznej. W tym wyjątkowym wydarzeniu muzycznym uczestniczyli cesarz Wilhelm, cesarz Brazylii Piotr II, król Ludwik i inni przedstawiciele arystokracji, a także filozof Friedrich Nietzsche oraz wybitni kompozytorzy, tacy jak Anton Bruckner, Edvard Grieg, Piotr Czajkowski, Franz Liszt i młody Arthur Foote."
 elgar.521.g: "Szczytowe osiągnięcie niemieckiej kultury!"
 elgar.523.t: "Skandal wokół Tannhäusera"
 elgar.523.d: "Przedstawienie Tannhäusera Richarda Wagnera wywołało prawdziwy skandal, który oburzył całe paryskie towarzystwo. Oprócz naruszenia przez Wagnera zasad obowiązujących we francuskim życiu operowym rolę odegrała również wzajemna niechęć niemieckiego i francuskiego świata muzycznego."
 elgar.523.f: "Wagnerowi nigdy nie było łatwo w Paryżu, nie tylko z powodu rywalizacji z popularnym Giacomem Meyerbeerem. Aby wystawić Tannhäusera w Operze Paryskiej, musiał podporządkować się francuskim zwyczajom, takim jak włączenie baletu. Zdecydowanie sprzeciwił się jednak tym wymogom i dodał jedynie bachanalia. Jednocześnie zraził do siebie muzyków nieznośnie długimi próbami. Premiera wywołała skandal: panowie z paryskiego „Jockey Clubu” poczuli się oszukani, gdy po uwerturze nie pojawił się balet. Nie przychodzili bowiem dla muzyki, lecz po to, by oglądać piękne kobiety, a później odwiedzać je w garderobach. Ponieważ nie dostali tego, czego chcieli, sabotowali przedstawienie gwizdami i okrzykami. Nazajutrz nie było lepiej: paryska prasa nie zostawiła na przedstawieniu suchej nitki. Naszą reakcję będą uważnie obserwować nie tylko Francuzi, lecz także przyjaciele i wrogowie Wagnera w Niemczech."
 elgar.523.g: "Niech nigdy więcej nie pokazuje się w Paryżu!"
 elgar.523.h: "Musimy udobruchać pana Wagnera."
 elgar.524.t: "Suita z czasów Holberga"
 elgar.524.d: "Suita z czasów Holberga Edvarda Griega, której premiera odbyła się w Oslo, okazała się nie tylko muzycznym arcydziełem, lecz także rozbudziła norweskie uczucia narodowe."
 elgar.524.f: "Suita z czasów Holberga, z podtytułem „Suita w dawnym stylu”, składa się z pięciu części opartych na XVIII-wiecznych formach tanecznych. Edvard Grieg napisał ją w 1884 roku z okazji 200. rocznicy urodzin duńsko-norweskiego humanisty i dramaturga Ludviga Holberga (1684-1754). Jest przykładem XIX-wiecznej muzyki wykorzystującej style i formy muzyczne poprzedniego stulecia. Początkowo powstała na fortepian, lecz rok później sam Grieg opracował ją na orkiestrę smyczkową. Suita składa się ze wstępu i szeregu tańców. Stanowi wczesną próbę neoklasycyzmu, mającą przywołać muzykę epoki Holberga w takim stopniu, w jakim znano ją za czasów Griega. Choć nie jest tak słynna jak muzyka sceniczna Griega do Peer Gynta, zwykle wykonywana w postaci dwóch suit, wielu krytyków uważa oba dzieła za równie wartościowe."
 elgar.525.t: "Nowe Drogi"
 elgar.525.d: "Na łamach „Neue Magazin für Musik” Robert Schumann wspomniał o nowym artyście, który z dnia na dzień zdobył sławę. Nazywa się Johannes Brahms i wywarł ogromne wrażenie zarówno na Schumannie, jak i na jego żonie Clarze."
 elgar.525.f: "„I oto przybył, młodzieniec, nad którego kołyską czuwały gracje i bohaterowie. Nazywa się Johannes Brahms, przybył z Hamburga, gdzie pracował w cichym zapomnieniu, lecz pod okiem znakomitego i pełnego zapału nauczyciela zgłębił trudne tajniki sztuki. Niedługo wcześniej polecił mi go szanowany i znany mistrz. Także jego wygląd nosił wszelkie znamiona, które oznajmiają nam: oto człowiek powołany”. — Robert Schumann"
 elgar.525.g: "Oczekujemy wielkich rzeczy od pana Brahmsa."
 elgar.526.t: "Gesang der Parzen"
 elgar.526.d: "W Bazylei odbyło się prawykonanie „Pieśni Parek” Johannesa Brahmsa. Szwajcaria, obok Wiednia, należała do najważniejszych miejsc pobytu kompozytora."
 elgar.526.f: "Gesang der Parzen (Pieśń Parek) to ostatnia kompozycja Johannesa Brahmsa na chór i orkiestrę. Ponad 10 lat po kantacie Rinaldo op. 50 i Rapsodii na alt op. 53 Brahms ponownie sięgnął po tekst Johanna Wolfganga von Goethego. Według Maksa Kalbecka do komponowania zainspirowała go aktorka Charlotte Wolter, występująca w roli Ifigenii w wiedeńskim Burgtheater. 13 czerwca 1896 roku Brahms napisał o tym utworze: „Często słyszę filozoficzne rozważania na temat szóstej zwrotki Pieśni Parek. Sądzę, że już samo pojawienie się tonacji durowej powinno poruszyć serce niczego nieprzeczuwającego słuchacza i zwilżyć jego oczy łzami. Dopiero wtedy ogarnia go świadomość niedoli ludzkości”."
 elgar.526.g: "To równie wspaniałe, co niepokojące."
 elgar.527.t: "Komponujący właściciel plantacji pomarańczy"
 elgar.527.d: "Syn znanego przedsiębiorcy z branży wełnianej, Juliusa Deliusa, pobierał lekcje u organisty i opublikował kilka swoich pierwszych kompozycji."
 elgar.527.f: "Frederick Delius, urodzony w Anglii, był synem niemieckiego przedsiębiorcy z branży wełnianej Juliusa Deliusa. Ojciec chciał, by syn przejął po nim firmę, lecz ten nie poświęcał większej uwagi interesom w Europie, bardziej interesując się sztuką i muzyką. Dlatego wysłano młodego Deliusa na plantację pomarańczy na Florydzie, aby odciąć go od wpływów europejskich metropolii. To właśnie ten wyjazd miał jednak odegrać wyjątkową rolę w jego późniejszej twórczości muzycznej. W Jacksonville Delius poznał katolickiego organistę Thomasa Warda, który, jak twierdził sam kompozytor, był jedyną osobą, która rzeczywiście go czegoś nauczyła. Niedługo później Delius miał opublikować swoje pierwsze kompozycje w Danville w Wirginii."
 elgar.527.g: "Co miało wyrosnąć z tego nicponia?"
 elgar.528.t: "Austriak w Nowym Jorku"
 elgar.528.d: "Po sporach w rodzinnej Austrii Gustav Mahler znalazł w Nowym Jorku publiczność, która bardzo dobrze przyjęła jego dzieła. Niektóre wpływowe osoby w amerykańskim świecie muzycznym chciałyby zaangażować go na stałe."
 elgar.528.f: "Na dźwięk nazwiska Mahlera niejeden Niemiec omal nie wyskakiwał z kaftana. Niektórzy z zachwytu, lecz większość ze złości. Niektórym z podniecenia, lecz większości ze złości. Tak było od pierwszego dnia. Od razu wywierał wpływ, pobudzał, prowokował, niepokoił, mniejsza o to: należy do natur naelektryzowanych i elektryzujących, które przy najlżejszym dotknięciu sypią iskrami lub stają w płomieniach. Początkowo, rzecz jasna, popularność przyniosła mu jedynie jego szalona niepopularność. Niesiony przychylnością nienawiści, starannie oświetlany przez zawiść, tę wiecznie bezsenną i potężną opiekunkę wszystkiego, co prawdziwe, rozsławiany przez drwiny, zazdrość i oszczerstwa, rozgłaszany na każdym rogu ulicy przez najgłośniejszych krzykaczy, stał się sławny. (...) I tak codziennie słyszało się, że znęca się nad muzykami, zapędza ich do nieludzkiej pracy, niemal doprowadza do śmierci i że gdyby tylko mogli, wszyscy utopiliby go w łyżce wody. Mówiono, że ogranicza swobodę swoich śpiewaków, musztruje ich jak rekrutów, igra z nimi niczym Wielki Turek ze swoimi niewolnikami. (...) Intensywność jego osobowości zdawała się wypełniać cały Nowy Jork. — Felix Salten"
 elgar.528.g: "Cóż za dziwak."
 elgar.528.h: "Mahler powinien zostać w Ameryce."
 elgar.529.t: "Suita Scytyjska"
 elgar.529.d: "Siergiej Prokofiew, jeden z najbardziej obiecujących młodych talentów rosyjskiej muzyki, zaszokował dziś publiczność skandalicznym występem."
 elgar.529.f: "Prokofiew pierwotnie napisał tę muzykę do baletu Ała i Łołłij, którego akcja rozgrywa się wśród Scytów. Balet powstał na zamówienie Siergieja Diagilewa, według scenariusza rosyjskiego poety Siergieja Gorodieckiego. Gdy jednak Diagilew odrzucił partyturę jeszcze przed jej ukończeniem, kompozytor przerobił muzykę na suitę przeznaczoną do wykonania koncertowego. Występ wywołał największy skandal w historii premier Prokofiewa. Ówczesny dyrektor konserwatorium, Aleksandr Głazunow, opuścił salę podczas koncertu, większość publiczności była oburzona, a recenzje druzgocące. Prokofiew nie przejął się jednak zbytnio i następnego dnia napisał lakonicznie do Moskwy, że wykonanie odbyło się „wśród prawdziwej wrzawy”."
 elgar.529.g: "Arcydzieło!"
 elgar.529.h: "Odrażające."
 elgar.530.t: "Symfonia Reńska"
 elgar.530.d: "Robert Schumann podjął pracę w Düsseldorfie nad Renem, a prace budowlane przy katedrze w Kolonii niespodziewanie zainspirowały go do napisania nowego dzieła."
 elgar.530.f: "Robert Schumann uchodzi za jednego z najbardziej reprezentatywnych kompozytorów epoki romantyzmu. W 1850 roku zastąpił Ferdinanda Hillera na stanowisku dyrektora muzycznego i przeniósł się do Düsseldorfu. Choć krytykowano jego słabe umiejętności dyrygenckie i szydzono z jego „twórczego upadku”, Schumann skomponował swoją ostatnią symfonię, Reńską. Wzorował się na symfoniach Beethovena i Mendelssohna, ale czerpał też inspirację z wrażeń wyniesionych z Nadrenii. Sam twierdził, że głównym natchnieniem do napisania tej kompozycji była podróż do Kolonii i widok tamtejszej katedry. Utwór stał się jednym z jego najsłynniejszych dzieł."
 elgar.530.g: "Kontynuowanie budowy katedry było dobrym pomysłem, prawda?"
 elgar.531.t: "Próba Samobójcza Schumanna"
 elgar.531.d: "Kompozytora Roberta Schumanna uratowano dziś z rzeki w ostatniej chwili. Najwyraźniej w stanie zaburzonej świadomości próbował odebrać sobie życie. Wciąż zupełnie nie wiadomo, jak dalej postąpić w jego sprawie."
 elgar.531.f: "10 lutego 1854 roku cierpienie psychiczne Schumanna gwałtownie się nasiliło. Skarżył się przede wszystkim na „problemy ze słuchem”. W jego głowie rozbrzmiewały dźwięki, akordy i całe utwory muzyczne, pozbawiając go snu. Żona i dzieci czuwały przy nim dniem i nocą, pozostawał też pod opieką lekarską, lecz 27 lutego 1854 roku zdołał niepostrzeżenie opuścić mieszkanie. Udał się na pobliski most pontonowy, przeszedł przez barierkę, wrzucił do wody obrączkę, a następnie rzucił się do rzeki. Uratowali go zarządca mostu i inni nieznani mężczyźni. Odprowadzono go do domu, gdzie zajął się nim wezwany lekarz. Po próbie samobójczej Schumann wyraził życzenie przyjęcia do zakładu leczniczo-opiekuńczego dla osób chorych psychicznie w Endenich pod Bonn, otwartego w 1844 roku przez psychiatrę Franza Richarza."
 elgar.531.g: "Nic nie możemy zrobić."
 elgar.531.h: "Wyślijcie go do nowoczesnego szpitala psychiatrycznego w pobliżu Endenich."
 elgar.532.t: "Śmierć Schumanna"
 elgar.532.d: "Po kilku latach zaburzeń psychicznych Robert Schumann, niegdyś obiecujący talent muzyczny, zmarł w szpitalu psychiatrycznym, zapomniany przez świat."
 elgar.532.f: "Brahms odwiedził Schumanna 31 marca i 19 sierpnia 1854 roku, lecz nie mógł z nim porozmawiać. Jednak 11 stycznia, 23 lutego i 2 kwietnia 1855 roku obaj mogli już prowadzić dłuższe rozmowy. Schumann czuł się na tyle dobrze, że grał z Brahmsem na fortepianie stołowym i pod nadzorem opiekuna odprowadził go część drogi na dworzec kolejowy w Bonn. 10 kwietnia 1856 roku Brahms zastał Schumanna w bardzo złym stanie. Kompozytor nie potrafił już mówić zrozumiale. 1 maja 1856 roku po raz ostatni odnotowano w dokumentacji medycznej, że Schumann grał na fortepianie. Przez większość czasu z trudem formułował zrozumiałe wypowiedzi. Plan Clary Schumann z kwietnia 1856 roku, by zabrać męża do Düsseldorfu i samodzielnie się nim opiekować, nie został zrealizowany. Od połowy lipca 1856 roku Schumann jadł coraz mniej. 26 lipca 1856 roku wystąpiły u niego „drgania różnych mięśni, twarzy i kończyn”. Wilgotne rzężenia sugerowały zapalenie płuc. Robert Schumann zmarł 29 lipca. Nikogo przy nim nie było."
 elgar.533.t: "Cudowny powrót Roberta Schumanna do zdrowia"
 elgar.533.d: "Najwyraźniej nowoczesne metody stosowane w sanatorium w Endenich przyniosły efekty. Stan Schumanna się poprawia, choć do pracy będzie mógł wrócić dopiero za kilka miesięcy."
 elgar.533.f: "Cudowny powrót Schumanna do zdrowia rozpoczął się po tym, jak we wrześniu 1854 roku, tuż przed 14. rocznicą ślubu, powiedział Petersowi, że Düsseldorf legł w gruzach, a Clara i dzieci nie żyją. Aby rozwiać to urojenie, Peters poprosił Clarę Schumann o napisanie listu do męża. Zapoczątkowało to pierwszą wymianę korespondencji od chwili przyjęcia kompozytora do zakładu. Odtąd Schumann znów aktywnie interesował się życiem poza jego murami. Korespondował również z dziećmi, Johannesem Brahmsem, Josephem Joachimem i wydawcami. Od września 1854 roku do maja 1855 roku napisał około 25 listów. W tym czasie często wyrażał pragnienie opuszczenia Endenich. Od czasu do czasu grał na fortepianie i studiował kompozycje Brahmsa. 11 stycznia 1855 roku po raz pierwszy odwiedził go Johannes Brahms. Od tej pory stan Schumanna stale się poprawiał, aż lekarze pozwolili Clarze Schumann na odwiedziny. Dzięki jej wsparciu oraz pomocy Brahmsa Schumann wkrótce znów zaczął komponować, zapoczątkowując tym samym proces samouzdrawiania."
 elgar.533.g: "Ale jak to możliwe?"
 elgar.534.t: "Tango"
 elgar.534.d: "Wykonawca tanga Carlos Gardel nagrał swój pierwszy przebój płytowy, Mi noche triste."
 elgar.534.f: "Carlos Gardel był najwybitniejszą postacią w historii tanga. Należał do najbardziej wpływowych wykonawców światowej muzyki popularnej pierwszej połowy XX wieku. Jest najsłynniejszym śpiewakiem tanga wszech czasów, rozpoznawanym na całym świecie. W 1917 roku zapoczątkował tango-canción swoją interpretacją Mi noche triste Pascuala Contursiego i Samuela Castrioty. Wraz z „Mi noche triste” narodziło się tango sentymentalne. Nostalgiczne, melodramatyczne i smutne teksty oraz muzyka uosabiały Buenos Aires i jego mieszkańców."
 elgar.534.g: "Triumf Muzyki Argentyńskiej."
 elgar.601.t: "Śmierć [SCOPE.sCharacter('elgar_composer_scope').GetLastName]"
 elgar.601.d: "[SCOPE.sCharacter('elgar_composer_scope').GetFullName], jeden z najwybitniejszych artystów naszego kraju i lśniąca gwiazda na muzycznym firmamencie, zmarł dziś. Pozostawił po sobie pustkę, którą trudno będzie wypełnić."
 elgar.601.g: "Odszedł od nas tytan historii muzyki."
 elgar.603.t: "Rossini opuszcza Bolonię"
 elgar.603.d: "Rossini postanowił opuścić Bolonię. Wiadomość ta nie tylko zaskoczyła mieszkańców miasta, lecz także zasmuciła cały kraj."
 elgar.603.f: "Gdy Gioacchino Rossini postanowił opuścić Bolonię, a tym samym Państwo Kościelne, od jego wycofania się ze sceny operowej minęło około 20 lat. Mimo to nadal cieszył się ogromnym szacunkiem i należał do najbardziej lubianych włoskich kompozytorów. Jednym z głównych powodów powrotu Rossiniego do Paryża, po przejściowym pobycie we Florencji, był zapewne jego stan zdrowia. Już w ostatnich latach kariery europejskiej gwiazdy muzyki podupadał zarówno fizycznie, jak i psychicznie. Paryż oferował lepsze perspektywy opieki medycznej, dlatego Rossini rozważał spędzenie tam emerytury."
 elgar.603.g: "Ale przecież nie dokończył swoich tortellini!"
 elgar.609.d: "Franz Lachner ogłosił dziś zakończenie kariery dyrygenckiej. Nie widzi już dla siebie dalszych perspektyw zawodowych."
 elgar.609.f: "Cały splot okoliczności doprowadził do przedwczesnego odejścia Franza Lachnera ze świata muzyki. Decydującym czynnikiem była nowa muzyka Richarda Wagnera i triumf jego zwolenników. Lachner, który znał Schuberta i Beethovena, nie potrafił i nie chciał podążać za tymi zmianami. Podobnie jak Rossini, świadomy, że świat poszedł naprzód, a jego samego postrzegano jako relikt minionej epoki, Lachner wycofał się, między innymi z powodu drwin i złośliwości krytyków wiernych Wagnerowi."
 elgar.609.g: "Strata dla [GetPlayer.GetName]."
 elgar.613.f: "Gaetano Donizetti zmarł spokojnie dziś rano po długim i spełnionym życiu, w ramionach drugiej żony i w otoczeniu synów. Kondukt pogrzebowy z kilkoma orkiestrami, setkami ludzi niosących pochodnie i tysiącami zgromadzonych żegna człowieka, który podobno przeżył życie doskonałe."
 elgar.614.f: "W 1867 roku Berlioz otrzymał wiadomość, że jego syn zmarł w Hawanie na żółtą febrę. Macdonald sugeruje, że kompozytor mógł szukać ucieczki od żałoby, realizując zaplanowany cykl koncertów w Petersburgu i Moskwie. Podróż nie przywróciła mu jednak sił, lecz wyczerpała ich resztki. Wyjechał do Nicei, by odzyskać zdrowie w śródziemnomorskim klimacie, ale upadł na nadmorskie skały, być może wskutek udaru, i musiał wrócić do Paryża, gdzie przez kilka miesięcy dochodził do siebie. W sierpniu 1868 roku poczuł się na tyle dobrze, by na krótko udać się do Grenoble jako juror festiwalu chóralnego. Po powrocie do Paryża stopniowo słabł i zmarł 8 marca 1869 roku w swoim domu przy Rue de Calais, w wieku 65 lat. Pochowano go na cmentarzu Montmartre wraz z dwiema żonami, których szczątki ekshumowano i złożono obok niego."
 elgar.615.f: "Po nieudanej próbie zawarcia małżeństwa z Carolyne zu Sayn-Wittgenstein Liszt coraz częściej poświęcał się kompozycjom o tematyce religijnej. W Rzymie, gdzie przebywał przez większość czasu do 1870 roku, prowadził życie częściowo świeckie, częściowo zakonne. Latem 1863 roku wycofał się do klasztoru, gdzie odwiedził go również papież Pius IX. W 1865 roku Liszt przyjął tonsurę i cztery święcenia niższe. Odtąd jako duchowny nosił koloratkę i zwracano się do niego per abbé. W 1886 roku przybył na Festiwal Wagnerowski. Już podczas podróży był ciężko chory i zmarł kilka dni po przyjeździe, 31 lipca 1886 roku, wskutek zapalenia płuc. Bernhard Schnappauf, lekarz i przyjaciel Richarda Wagnera, czuwał przy jego łożu przez ostatnie dni i przekazał, że Liszt odszedł spokojnie i godnie. Zamknął mu oczy i wykonał maskę pośmiertną, za co zgodnie z dawnym zwyczajem przysługiwały mu całun i poszewka na poduszkę."
 elgar.616.f: "16 września 1882 roku Wagner wyjechał z rodziną do Wenecji, gdzie spędził kilka tygodni z Franzem Lisztem. 25 grudnia, w prezencie urodzinowym dla Cosimy, po raz ostatni dał wspólny koncert w Teatro La Fenice, dyrygując swoją młodzieńczą Symfonią C-dur. 13 lutego 1883 roku przebywał w bocznym skrzydle Palazzo Vendramin-Calergi, które zamieszkiwał wraz z rodziną. Około godziny 3 po południu rodzina czekała na niego przy stole, podczas gdy on, mimo trwającego zawału serca, pisał w gabinecie esej o pierwiastku kobiecym w człowieku. Pokojówka znalazła go osuniętego nad biurkiem, przy słowach: „Niemniej proces emancypacji kobiety postępuje jedynie wśród ekstatycznych konwulsji. Miłość - Tragedia”. Powiedział: „Moja żona i lekarz”, po czym stracił przytomność i zmarł w ramionach Cosimy około godziny 3:30 po południu."
 elgar.617.f: "Edvard Grieg zmarł 4 września 1907 roku w Szpitalu Miejskim w Bergen w Norwegii, w wieku 64 lat, wskutek niewydolności serca. Przez długi czas chorował. Jego ostatnie słowa brzmiały: „Cóż, skoro tak musi być”. Pogrzeb zgromadził na ulicach rodzinnego miasta od 30,000 do 40,000 osób, które przybyły oddać mu hołd. Zgodnie z jego życzeniem wykonano Marsz żałobny ku pamięci Rikarda Nordraaka w opracowaniu orkiestrowym jego przyjaciela Johana Halvorsena, męża siostrzenicy Griega. Zabrzmiał również Marsz żałobny z 2. sonaty fortepianowej Chopina. Griega skremowano w pierwszym norweskim krematorium, otwartym w Bergen właśnie w tym roku, a jego prochy złożono w skalnej krypcie nieopodal domu kompozytora, Troldhaugen. Po śmierci żony jej prochy umieszczono obok jego."
 elgar.618.f: "Brahms zmarł nad ranem 3 kwietnia 1897 roku, w wieku 63 lat, w swoim mieszkaniu przy Karlsgasse 4, gdzie mieszkał od 1872 roku. Według niektórych biografii przyczyną śmierci był rak wątroby, według nowszych ustaleń rak trzustki. Po raz ostatni pojawił się publicznie 7 marca 1897 roku, gdy wysłuchał swojej 4. symfonii pod batutą Hansa Richtera. Po każdej z czterech części rozlegała się owacja. Jego ciało wystawiono w domu żałoby, gdzie Carl Kundmann wykonał maskę pośmiertną, a Ludwig Michalek ostatni portret pastelowy. Nabożeństwo żałobne odbyło się 6 kwietnia w luterańskim kościele miejskim."
 elgar.619.f: "„Poranek i Wiedeń. Chaos. Człowiek kurczowo trzyma się szczegółów, których nikt jeszcze nie może znać. Ma zostać pochowany na małym cmentarzu w Grinzing, obok córeczki. Przywożą ciało. Kolejny poranek. Droga «an den Langen Lüssen» wiedzie przez pola ku cyprysom. Kaplica jest niewielka, mieści tylko trumnę i kilka wieńców. Pozostałe ustawiono wzdłuż ścieżek prowadzących do grobu. Przechodzi kobieta i mówi do drugiej: «Teraz ma w środku spokój. Wszystko było dla niego za małe». Kościół w Grinzing jest mały, cmentarz ciasny. A wiedeńczykom szykuje się widowisko. Kościół i cmentarz zostaną odgrodzone. Wstęp tylko za okazaniem karty. Dowiadujemy się, że Franz Schalk, Gregor i zarząd zwrócili się z prośbą o zamknięcie opery w dniu pogrzebu. Żadnej odpowiedzi. Dwór i władze Wiednia nie reagują. A potem uroczystość. Stoimy przed kościołem, gdy wynoszą trumnę. Pada deszcz. Ścieżką przez winnice docieramy do grobu szybciej. Nadchodzi kondukt. Deszcz ustaje. Śpiewa słowik, padają grudy ziemi. Tęcza. A setki ludzi milczą”. — Paul Stefan"
 elgar.701.g: "To był wspaniały występ."
 elgar.701.h: "Zatrudnijcie tego genialnego człowieka!"
 elgar.706.g: "Czy w wieku 20 lat nie jest trochę za młody na taką posadę?"
 elgar.701.t: "Wielka symfonia żałobna i triumfalna"
 elgar.701.d: "Z okazji dziesiątej rocznicy rewolucji lipcowej Hector Berlioz skomponował utwór, który wzbudził wielki podziw publiczności."
 elgar.701.f: "Rząd francuski zamówił symfonię na obchody dziesiątej rocznicy rewolucji lipcowej, która wyniosła do władzy Ludwika Filipa I. Z tej okazji na placu Bastylii wznoszono Kolumnę Lipcową. Berlioz nie darzył reżimu szczególną sympatią, lecz chętnie przyjął zamówienie, ponieważ rząd zaoferował mu za utwór 10,000 franków. Symfonia wojskowa (przemianowana później na Symfonię żałobną i triumfalną) nie podąża za wzorcem wypracowanym przez Berlioza w Romeo i Julii, lecz stanowi powrót do wcześniejszego, przedbeethovenowskiego stylu, zakorzenionego w tradycji monumentalnej francuskiej muzyki na uroczystości publiczne. W styczniu 1842 roku Berlioz zrewidował partyturę, dodając opcjonalną partię smyczków oraz finałowy chór do tekstu Antony’ego Deschampsa. Richard Wagner wysłuchał tej nowej wersji 1 lutego 1842 roku w Salle Vivienne. 5 lutego powiedział Robertowi Schumannowi, że niektóre fragmenty ostatniej części symfonii Berlioza uznał za tak „wspaniałe i wzniosłe, że nigdy nie da się ich przewyższyć”."
 elgar.702.t: "Liszt w Weimarze"
 elgar.702.d: "Po wielu latach tournée koncertowych wirtuoz fortepianu i kompozytor Franz Liszt rozważa osiedlenie się w Weimarze."
 elgar.702.f: "Lata spędzone w Weimarze były najbardziej twórczym okresem w życiu Franza Liszta. Powstało tam wiele jego dzieł fortepianowych, takich jak Sonata h-moll, cykl Harmonies poétiques et religieuses, piętnaście Rapsodii węgierskich, a także liczne transkrypcje, wyciągi fortepianowe i przeróbki wcześniejszych utworów, między innymi Etiud według Paganiniego. Tutaj ostateczną formę otrzymały również dwa wcześniej pomyślane koncerty fortepianowe. W Weimarze Liszt dyrygował wieloma dziełami współczesnych kompozytorów, z których część budziła wówczas kontrowersje, a także wystawiał ich opery. Prowadził wykonania utworów szczególnie mu bliskiego Richarda Wagnera, któremu wiosną 1849 roku pomógł uciec do Zurychu po powstaniu drezdeńskim. W kolejnych latach wspierał go finansowo i duchowo oraz prowadził z nim ożywioną korespondencję. Później Liszt i Wagner często występowali wspólnie jako dyrygenci. Od 1865 roku, po nawiązaniu przez Wagnera romansu z córką Liszta, Cosimą, ich stosunki na długo się ochłodziły."
 elgar.703.t: "Rienzi"
 elgar.703.d: "Młody kompozytor zachwycił publiczność w Dreźnie i zagranicznych artystów swoją operą „Rienzi”. Nazywa się Richard Wagner."
 elgar.703.f: "„Żadne późniejsze doświadczenie nie wzbudziło we mnie uczuć choćby zbliżonych do tych, których doznałem w dniu prawykonania Rienziego. Podczas wszystkich kolejnych premier moich dzieł aż nazbyt uzasadniony niepokój o ich powodzenie tak dalece panował nad moimi uczuciami, że nigdy nie mogłem naprawdę się nimi cieszyć ani zwracać większej uwagi na zachowanie publiczności. (...) Początkowy sukces Rienziego był bez wątpienia z góry zapewniony. Jednak żywiołowość, z jaką publiczność okazywała mi przychylność, była niezwykła... Widzowie byli już zdecydowanie przychylnie nastawieni, ponieważ wszyscy związani z teatrem rozpowszechniali tak pochlebne opinie... że całe miasto wyczekiwało tego, co zapowiadano jako cud... Gdy próbuję przywołać swój stan tamtego wieczoru, pamiętam go jedynie jako coś, co miało wszelkie cechy snu”. — Richard Wagner"
 elgar.704.t: "Piano Concerto in A minor"
 elgar.704.d: "Dziś w Kopenhadze odbyło się prawykonanie koncertu fortepianowego Edvarda Griega. Już teraz można przewidzieć, że będzie to jeden z jego najpopularniejszych utworów."
 elgar.704.f: "Koncert fortepianowy a-moll op. 16, skomponowany przez Edvarda Griega w 1868 roku, był jedynym koncertem, który ukończył. Należy do jego najwcześniejszych ważnych dzieł. Powstał w 1868 roku w duńskim Søllerød, podczas jednego z pobytów 24-letniego kompozytora, który przyjeżdżał tam ze względu na dobroczynny klimat. Koncert świadczy o zainteresowaniu Griega norweską muzyką ludową. Otwierający go efektowny pasaż opiera się na motywie opadającej sekundy małej, po której następuje opadająca tercja wielka, typowym dla muzyki ludowej jego ojczyzny. Prawykonanie odbyło się 3 kwietnia 1869 roku w Kopenhadze. Solistą był Edmund Neupert, a dyrygował Holger Simon Paulli. Według niektórych źródeł partię solową miał wykonać sam Grieg, znakomity pianista, lecz zobowiązania wobec orkiestry w Christianii (dzisiejszym Oslo) uniemożliwiły mu udział w premierze. Wśród obecnych byli duński kompozytor Niels Gade i rosyjski pianista Anton Rubinstein, który udostępnił na tę okazję swój fortepian. Grieg poprawiał dzieło co najmniej siedem razy, zwykle wprowadzając subtelne zmiany, które łącznie dały jednak ponad 300 różnic względem pierwotnej instrumentacji."
 elgar.705.t: "Wariacje na temat Haydna"
 elgar.705.d: "Kompozytor Johannes Brahms wykonał dziś nowe arcydzieło, a jednocześnie rozważa związanie się na stałe z Wiedniem."
 elgar.705.f: "Wariacje na temat Haydna op. 56a to utwór wariacyjny na orkiestrę Johannesa Brahmsa. Powstał latem 1873 roku w Tutzing. Prawykonanie odbyło się 2 listopada 1873 roku w Wiedniu pod batutą kompozytora. Dzieło pochodzi z okresu, w którym Brahms chciał uczcić swój pobyt w Wiedniu. Z jednej strony przed laty opuścił Detmold i Hamburg rozczarowany. Z drugiej pragnął zamieszkać tam, gdzie żyli jego wielcy klasyczni mistrzowie, i kontynuować tradycję wiedeńską."
 elgar.706.t: "Pierwszy występ Mahlera"
 elgar.706.d: "W Bad Hall młody i utalentowany dyrygent Gustav Mahler po raz pierwszy objął stanowisko kapelmistrza. W kolejnych latach miał piąć się po szczeblach kariery aż do Wiedeńskiej Opery Państwowej"
 elgar.706.f: "„I oto stał osobiście w kancelarii teatru, gdy wyszedłem po pierwszej wizycie u Polliniego: blady, szczupły, niewysoki, o pociągłej twarzy, stromym czole okolonym kruczoczarnymi włosami i przenikliwych oczach za szkłami okularów. Na jego obliczu widniały bruzdy cierpienia i humoru, a podczas rozmowy z kimś innym wyraz jego twarzy zmieniał się w najbardziej zdumiewający sposób. Był równie fascynującym, demonicznym i onieśmielającym wcieleniem kapelmistrza Kreislera, jakie mógł sobie wyobrazić młody czytelnik fantazji E.T.A. Hoffmanna. Życzliwie zapytał mnie o moje umiejętności i wiedzę muzyczną, na co odpowiedziałem, ku jego widocznemu zadowoleniu, z mieszaniną nieśmiałości i pewności siebie. Pozostawił mnie w stanie pewnego oszołomienia i wstrząsu. (...) Z twarzy i zachowania Mahler jawił mi się jako geniusz i demon (...)” — Bruno Walter"
 elgar.707.t: "Piano Concerto No. 2"
 elgar.707.d: "Po wielu niepowodzeniach kompozytor Siergiej Rachmaninow powrócił w imponującym stylu: jego II koncert fortepianowy wywołał burzę oklasków."
 elgar.707.f: "Po katastrofalnej premierze swojej I symfonii w 1897 roku Rachmaninow przeszedł załamanie psychiczne, które na trzy lata uniemożliwiło mu komponowanie. Choć depresja odbierała mu siły, nadal występował. Dyrygowanie i udzielanie lekcji gry na fortepianie stały się konieczne, by poprawić jego sytuację finansową. W 1899 roku miał wykonać w Londynie II koncert fortepianowy, którego z powodu choroby jeszcze nie skomponował. Zamiast tego z powodzeniem zadebiutował tam jako dyrygent. Krewni postanowili zapoznać go z neurologiem Nikołajem Dahlem, którego odwiedzał codziennie od stycznia do kwietnia 1900 roku. Pomogło mu to odzyskać zdrowie i wiarę we własne zdolności kompozytorskie. W podziękowaniu za skuteczne leczenie Rachmaninow zadedykował Dahlowi swój koncert. Po występie w londyńskiej Queen’s Hall w 1908 roku pod batutą Siergieja Kusewickiego w dzienniku The Times ukazała się pochlebna recenzja: „Bezpośredniość wyrazu dzieła, niezwykła precyzja i dokładność gry Rachmaninowa, a nawet ścisła oszczędność ruchów ramion i dłoni przyczyniły się do wrażenia doskonałości wykonania”."
 elgar.708.t: "Symfonia nr 1 „Klasyczna”"
 elgar.708.d: "Swoją pierwszą symfonią Siergiej Prokofiew po raz kolejny dowiódł, że jest obiecującym kompozytorem. Młodego artystę ciągnie jednak w świat w poszukiwaniu lepszego wynagrodzenia."
 elgar.708.f: "„Próba Symfonii klasycznej z Orkiestrą Państwową. Dyrygowałem sam, całkowicie improwizując, ponieważ zapomniałem partytury, a zresztą nigdy nie studiowałem jej z perspektywy dyrygenta. Sądziłem, że może dojść do kompletnej klęski, ale nic takiego się nie stało. Zresztą w głosach orkiestrowych było tyle błędów, że próba upłynęła głównie na ich poprawianiu. W Kisłowodzku obawiałem się pewnej niechęci ze strony Orkiestry Rewolucyjnej wykonującej moje nowe dzieła, lecz stało się odwrotnie: Orkiestra Państwowa, zasilona licznymi młodymi muzykami, była elastyczna i uważna, a Symfonię grała z wyraźną przyjemnością”. — Siergiej Prokofiew"
 elgar.709.t: "Romeo and Juliet"
 elgar.709.d: "Piotr Czajkowski, ambitny młody kompozytor, zaprezentował swoją uwerturę Romeo i Julia. Publiczność przyjęła utwór z mieszanymi uczuciami."
 elgar.709.f: "Nie tylko na początku, lecz przez całą karierę Czajkowski musiał stawiać czoła krytykom i konkurentom. Na przykład uwertura Romeo i Julia po ukazaniu się została uznana za porażkę. Z drugiej strony krytyka, z którą kompozytor wielokrotnie spotykał się przez całe życie, skłaniała go do przesadnie krytycznego poprawiania tego i innych dzieł. Przez całą karierę Czajkowski pozostawał jednym z najsurowszych krytyków własnej twórczości. Nie bez ironii było również to, że właśnie ten utwór chwalili kompozytorzy rosyjskiego nurtu narodowego, którzy później mieli należeć do jego najzacieklejszych krytyków. Mimo wszystko najpóźniej od tego okresu Czajkowski stawał się jednym z najważniejszych rosyjskich kompozytorów, a w ciągu zaledwie kilku lat miał zdobyć międzynarodową sławę, jakiej dostąpiło niewielu innych muzyków tego stulecia."
 elgar.710.t: "Viva Verdi"
 elgar.710.d: "Wraz z powstaniem włoskiego państwa narodowego i przyłączeniem do naszego terytorium Mediolanu, miasta opery, zyskujemy wyjątkową okazję do zatrudnienia jednej z najważniejszych postaci w historii włoskiej muzyki: Giuseppe Verdiego."
 elgar.710.f: "Giuseppe Verdi był włoskim kompozytorem i politykiem, powszechnie uznawanym za jednego z najwybitniejszych twórców operowych wszech czasów, obok innych czołowych przedstawicieli XIX-wiecznego włoskiego teatru muzycznego: Gioachina Rossiniego, Vincenza Belliniego i Gaetana Donizettiego. Sympatyzował z ruchem Risorgimenta, dążącym do zjednoczenia Włoch, i przez krótki czas aktywnie uczestniczył w życiu politycznym. W ciągu długiego życia zdobył wyjątkową pozycję wśród rodaków, stając się wyrazistym artystycznym symbolem jedności kraju. Dlatego miesiąc po jego śmierci przez Mediolan przeszedł uroczysty, zdający się nie mieć końca kondukt, towarzyszący przewiezieniu jego szczątków przy dźwiękach „Va, pensiero” z Nabucco, napisanego 60 lat wcześniej. Pieśń ta dobitnie wyrażała uczucia Włochów wobec zmarłego bohatera i pokazywała, jak głęboko muzyka Verdiego zakorzeniła się w świadomości narodowej. Jego dzieła nadal należą do najbardziej znanych i najczęściej wystawianych w teatrach całego świata, zwłaszcza Aida (1871), wspomniane Nabucco (1842) oraz tak zwana „triada Verdiego”: Rigoletto (1851), Trubadur (1853) i Traviata (1853)."
 elgar.711.t: "Symfonia Wiosenna"
 elgar.711.d: "Dziś wykonano I symfonię Roberta Schumanna pod batutą Feliksa Mendelssohna Bartholdy’ego. Schumann jest mężem wybitnej pianistki Clary (z domu Wieck) i dotychczas zwracał na siebie uwagę bardziej jako krytyk muzyczny niż kompozytor. Opinie o jego utworach fortepianowych są podzielone."
 elgar.711.f: "Z wyjątkiem Franza Schuberta żaden niemieckojęzyczny kompozytor nie był za życia tak niedoceniany jak Robert Schumann. O ile znaczenie Schuberta dostrzeżono dopiero po jego przedwczesnej śmierci, o tyle Schumannowi zarzucano, że zaczynał jako geniusz, a skończył jako zaledwie utalentowany twórca. Współcześni często nie potrafili znaleźć klucza do jego muzyki lub po prostu nie rozumieli jego dzieł. Utwory fortepianowe, którym dziś zawdzięcza część swojej sławy, były wówczas w większości nieznane. Szydercy widzieli w nim jedynie mężczyznę u boku pianistki Clary Schumann. W rodzinnej Saksonii pozostawał w cieniu Mendelssohna. Wagner później występował przeciwko niemu, natomiast Brahms stał się bliskim powiernikiem Clary i Roberta. Liszt uważał Schumanna za pioniera postępu muzycznego w Niemczech, lecz nie odnosił sukcesów u publiczności, gdy włączał jego utwory do swojego repertuaru. Nadzieje na stałą posadę w ważnej instytucji muzycznej wielokrotnie okazywały się płonne. Podobnie jak Schubert, Schumann również przedwcześnie i tragicznie zakończył życie."
 elgar.712.t: "Król Olaf"
 elgar.712.d: "Edward Elgar wyróżnił się w ostatnich latach swoimi kantatami i utworami chóralnymi. Jego najnowsze dzieło, „Sceny z sagi o królu Olafie”, zostało dobrze przyjęte przez publiczność."
 elgar.712.f: "W latach dziewięćdziesiątych XIX wieku Edward Elgar zdobywał coraz większe uznanie jako wybitny kompozytor brytyjski. Początkowo pozostawał pod silnym wpływem muzyki kontynentalnej, a w Królu Olafie również pobrzmiewają echa stylu Wagnera. Stopniowo wypracował jednak własny język muzyczny, który miał zachęcić późniejszych brytyjskich kompozytorów do obrania zupełnie nowych dróg. Elgar czuł się outsiderem nie tylko w muzyce, lecz także w życiu społecznym. W środowisku muzycznym zdominowanym przez akademików był samoukiem. W protestanckiej Wielkiej Brytanii niektóre kręgi spoglądały podejrzliwie na jego katolicyzm. Z kolei w przywiązanym do podziałów klasowych społeczeństwie epoki wiktoriańskiej i edwardiańskiej pozostawał szczególnie wrażliwy na swoje skromne pochodzenie, nawet po zdobyciu uznania. Mimo to Elgara można uznać za najważniejszego brytyjskiego kompozytora od czasów Henry’ego Purcella."
 elgar.713.t: "Dyrektor Muzyczny Balów Dworskich"
 elgar.713.d: "Stanowisko dyrektora muzycznego balów dworskich pozostaje nieobsadzone od lat. To prestiżowa posada, która miała przypaść kompozytorowi Johannowi Straussowi. Wcześniej odmówiono mu jednak tego zaszczytu z powodów politycznych. Teraz coraz częściej pojawiają się głosy, by zaproponować stanowisko synowi przedwcześnie zmarłego kompozytora."
 elgar.713.f: "Johann Strauss był austriacko-niemieckim kapelmistrzem i kompozytorem, znanym na całym świecie jako „Król Walca”. Pierwszego walca skomponował już w wieku sześciu lat i potajemnie pobierał lekcje gry na skrzypcach, ponieważ ojciec planował dla niego karierę urzędniczą. Gdy ojciec zerwał z rodziną, matka wspierała jego edukację muzyczną wbrew woli męża. Pierwszy występ Straussa w Casino Dommayer, lokalu rozrywkowym znanym w całym regionie, odniósł ogromny sukces. Początkowo ze swoją orkiestrą odbywał tournée po monarchii naddunajskiej, co zaostrzyło rywalizację z ojcem. Po jego śmierci przejął jego orkiestrę i połączył ją z własną. Ponieważ skomponował kilka utworów dla rewolucjonistów z 1848 roku, okazując tym samym sympatię dla ruchu powstańczego, zwrócił na siebie uwagę cenzury i mimo popularności popadł w niełaskę na dworze. W rezultacie aż do 1863 roku odmawiano mu stanowiska dyrektora muzycznego balów dworskich."
 elgar.713.g: "Stracił swoją szansę, ale może dalej komponować."
 elgar.713.h: "Przyznajcie Królowi Walca należne mu stanowisko!"
 elgar.714.t: "Laureat Państwowej Nagrody Kompozytorskiej"
 elgar.714.d: "Laureatem tegorocznej Państwowej Nagrody Kompozytorskiej został wyjątkowo utalentowany Czech. Nazywa się Antonín Dvořák."
 elgar.714.f: "Antonín Dvořák był czeskim kompozytorem, który często wykorzystywał rytmy i inne elementy muzyki ludowej Moraw oraz rodzinnych Czech. Już we wczesnym dzieciństwie przejawiał talent muzyczny, a od szóstego roku życia był pojętnym uczniem gry na skrzypcach. W 1874 roku zgłosił swoją kandydaturę do Austriackiej Państwowej Nagrody Kompozytorskiej, przedstawiając między innymi partytury dwóch symfonii. Choć Dvořák o tym nie wiedział, czołowym członkiem jury był Johannes Brahms, na którym jego twórczość wywarła ogromne wrażenie. Dvořák otrzymał nagrodę w 1874 roku, a następnie ponownie w latach 1876 i 1877, kiedy Brahms i wybitny krytyk Eduard Hanslick, również zasiadający w jury, nawiązali z nim kontakt. Brahms polecił Dvořáka swojemu wydawcy, Simrockowi."
 elgar.714.g: "W pełni zasłużona nagroda."
 elgar.714.h: "We shouldn't miss this talent."
 elgar.715.t: "The Bohemian Composer"
 elgar.715.d: "Claude Debussy started out as the winner of the Prix de Rome, but has so far done little with his certified talent other than writing small, provocative piano pieces. What will become of this bohemian?"
 elgar.715.f: "Even at the conservatory, assessments of Claude Debussy's talent varied widely. Some praised him as a pianist and had great hopes for him. Others described him as careless. During this time he was already a pianist in the household of Nadezhda von Meck, Tchaikovsky's patron. In 1884 Debussy won the Prix de Rome, but was unambitious during his stay in Rome. He found Italian opera boring and had little use for the prevailing style of Giuseppe Verdi. He traveled back to Paris early and lived an unstable life there: 'I am sure the Institute would not approve, for, naturally it regards the path which it ordains as the only right one. But there is no help for it! I am too enamoured of my freedom, too fond of my own ideas!'"
 elgar.715.g: "Nice piano music, but we have enough musical vagabonds."
 elgar.1011.t: "Don Pasquale"
 elgar.1011.d: "[GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetFullName] has just completed a musical masterpiece!"
 elgar.1011.f: "Don Pasquale is an opera buffa in three acts. The opera is one of the most famous of its genre and, along with L'elisir d'amore and Lucia di Lammermoor, is one of the few works by Donizetti that has had an almost continuous performance tradition since the 19th century. Based on the comedies of Carlo Goldoni, the characters are more or less closely based on types of the commedia dell'arte, but are given sentimental traits, i. H. through the ability to feel and express sadness, pain or remorse, a differentiation that goes beyond their type. Don Pasquale was an instant hit, such as only Bellini's I puritani (1835) had previously had in Paris."
 elgar.1011.g: "Bravissimo!"
 elgar.1012.t: "Dom Sébastien"
 elgar.1012.f: "Dom Sébastien is a French grand opera in five acts by Gaetano Donizetti.  It is a historic-fiction about King Sebastian of Portugal (1554-1578) and his ill-fated 1578 expedition to Morocco. At the time, Donizetti was attempting to compose an opera competitive with similar historical operas by Daniel Auber, Fromental Halévy and Giacomo Meyerbeer. One critical description of the nature of Dom Sébastien is 'a funeral in five acts'. The work was received with reluctance, which Donizetti himself felt was a fiasco. Although Donizetti considered his last opera to be one of his most important works, Dom Sébastien is largely forgotten today. It was written at a time when Donizetti 'no longer had unrestricted control over his imagination', so the opera was already marked by Donizetti's incipient illness."
 elgar.1021.t: "Les Troyens"
 elgar.1021.f: "Les Troyens is a French grand opera in five acts by Hector Berlioz. The libretto was written by Berlioz himself from Virgil's epic poem the Aeneid; the score was composed between 1856 and 1858. Les Troyens is Berlioz's most ambitious work, the summation of his entire artistic career, but he did not live to see it performed in its entirety. Under the title Les Troyens à Carthage, the last three acts were premièred with many cuts by Léon Carvalho's company, the Théâtre Lyrique, at their theatre (now the Théâtre de la Ville) on the Place du Châtelet in Paris on 4 November 1863, with 21 repeat performances. After decades of neglect, today the opera is considered by some music critics as one of the finest ever written."
 elgar.1022.t: "La damnation de Faust"
 elgar.1022.f: "La damnation de Faust is a work for four solo voices, full seven-part chorus, large children's chorus and orchestra by the French composer Hector Berlioz. He called it a 'légende dramatique' (dramatic legend). The French composer was inspired by a translation of Goethe's dramatic poem Faust and produced a musical work that, like the masterpiece on which it is based, defies easy categorisation. Conceived at various times as a free-form oratorio and as an opera its travelogue form and cosmic perspective have made it an extreme challenge to stage as an opera. Berlioz himself was eager to see the work staged, but once he did, he conceded that the production techniques of his time were not up to the task of bringing the work to dramatic life. Most of the work's fame has come through concert performances."
 elgar.1023.t: "Treatise on Instrumentation"
 elgar.1023.f: "'This Traité d'Instrumentation is a highly paradoxical work. It begins with a preface of several lines unrelated to the subject, in which the author takes a stand against musicians who abuse modulations and whose penchant for dissonance matches the taste that certain animals have for salty plants and thorny bushes. Then he turns to the orchestral instruments and mixes strange assertions with the most solid truths and valuable advice.(...) In his treatise, as in his orchestration, Berlioz, for all its oddities, is simply fabulous. To him my generation owes its education, and I dare say a good one. Berlioz possessed the invaluable gift of igniting the imagination and arousing love for the art he taught.(...) These seemingly superfluous musical examples made one dream, they opened the door to a new world, to a vast one and fascinating glimpse of the future, of the Promised Land.' - Camille Saint-Saëns"
 elgar.1031.t: "Les Préludes"
 elgar.1031.f: "Les Préludes is the third of Franz Liszt's thirteen symphonic poems. The music was composed between 1845-54, and began as an overture to Liszt's choral cycle Les quatre élémens (The Four Elements), then revised as a stand-alone concert overture, with a new title referring to a poem by Alphonse de Lamartine. Les préludes is the earliest example of an orchestral work entitled 'Symphonic Poem'. Liszt sees the phases of life as preludes to the melody of death. These phases of life are struggles and storms, love happiness and pain, consolation, experiencing nature. Despite the contrasts in these moods reflected in Les Préludes, the work is of great coherence. It begins with a melancholy melody, from which the first stormy main theme develops, which leads to the second theme via a pastoral part. These two themes are developed in glidingly changing moods. In a climax, the original theme flows into the first main theme as a majestic, glamorous fanfare."
 elgar.1032.t: "Hungarian Rhapsodies"
 elgar.1032.f: "The Hungarian Rhapsodies is a set of 19 piano pieces based on Hungarian folk themes, composed by Franz Liszt during 1846-1853, and later in 1882 and 1885. Liszt also arranged versions for orchestra, piano duet and piano trio. Some are better known than others, with Hungarian Rhapsody No. 2 being particularly famous and No. 6, No. 10, No. 12 and No. 14 (especially as arranged for piano and orchestra as the Hungarian Fantasy) also being well known. Liszt incorporated many themes he had heard in his native western Hungary and which he believed to be folk music, though many were in fact tunes written by members of the Hungarian upper middle class, or by composers such as József Kossovits. In their original piano form, the Hungarian Rhapsodies are noted for their difficulty."
 elgar.1033.t: "Dante Symphony"
 elgar.1033.f: "The 'Dante Symphony' is a choral symphony composed by Franz Liszt. Written in the high romantic style, it is based on Dante Alighieri's journey through Hell and Purgatory, as depicted in The Divine Comedy. Some critics have argued that the Dante Symphony is not so much a symphony in the classical sense as it is two descriptive symphonic poems. Liszt's original intention was to compose the work in three movements: an Inferno, a Purgatorio and a Paradiso. The first two were to be purely instrumental, and the finale choral. Wagner, however, persuaded Liszt that no earthly composer could faithfully express the joys of Paradise. Liszt dropped the third movement but added a choral Magnificat at the end of the second movement. Liszt scholar Humphrey Searle argues that while Liszt may have felt more at home portraying the infernal regions than the celestial ones, the task of portraying Paradise in music would not have been beyond his powers."
 elgar.1041.t: "Die Meistersinger von Nürnberg"
 elgar.1041.f: "'Die Meistersinger von Nürnberg' is a music drama, or opera, in three acts, by Richard Wagner. It is the longest opera commonly performed, taking nearly four and a half hours, not counting two breaks between acts, and is traditionally not cut. The Meistersinger of Nuremberg occupies a unique place in Wagner's oeuvre. It is the only comedy among his mature operas and is also unusual among his works in being set in a historically well-defined time and place rather than in a mythical or legendary setting. It is the only mature Wagner opera based on an entirely original story. It incorporates many of the operatic conventions that Wagner had railed against in his essays on the theory of opera: rhymed verse, arias, choruses, a quintet, and even a ballet."
 elgar.1042.t: "Die Walküre"
 elgar.1042.f: "'Die Walküre' forms together with the operas 'Das Rheingold', 'Siegfried' and 'Götterdämmerung' the complete work 'Der Ring des Nibelungen'. Wagner largely followed the principles related to the form of musical drama, reflecting the feelings and moods behind the work, using a system of recurring leitmotifs to represent people, ideas, and situations rather than the conventional operatic units of arias, ensembles, and choruses. The story of Die Walküre is based on the Norse mythology told in the Völsunga saga and the Poetic Edda."
 elgar.1043.t: "Parsifal"
 elgar.1043.f: "Richard Wagner's Parsifal contains religious elements such as sacred music, the unveiling of the monstrance (Grail), baptism and the Christian communion ritual. Already in his Zurich art writings, he developed the idea of using art to clarify the core of religion. Wagner explained that in order to transform his parable-like message of salvation and regeneration of mankind through compassion - represented by the searching Parsifal and the suffering Amfortas - he chose an art form which, with religious symbolism, was intended to have a 'rapturing effect on the mind'. Wagner himself described the three-act play as a stage consecration festival play and decreed that it should only be performed in the Bayreuth Festspielhaus."
 elgar.1051.t: "Peer Gynt"
 elgar.1051.f: "Peer Gynt, Op. 23, is the incidental music to Henrik Ibsen's 1867 play of the same name, written by the Norwegian composer Edvard Grieg. Although composing many short piano pieces and chamber works, the work Grieg did for Henrik Ibsen stood out. Originally composing 90 minutes of orchestral music for the play, he later went back and extracted certain sections for the suites. Peer Gynt's travels around the world and distant lands are represented by the instruments Grieg chooses to use. Grieg later created two suites from his Peer Gynt music. Some of the music from these suites has received coverage in popular culture, especially the pieces 'Morning Mood', 'In the Hall of the Mountain King' and 'Solveig's Song'."
 elgar.1052.t: "Lyric Pieces"
 elgar.1052.f: "Lyric Pieces is a collection of 66 short pieces for solo piano written by Edvard Grieg. They were published in 10 volumes, from 1867 to 1901. The collection includes several of his best known pieces, such as Wedding Day at Troldhaugen, To Spring, March of the Trolls, and Butterfly. The theme of the first piece in the set, Arietta, was one of the composer's favorite melodies. In the words of pianist Andrei Gavrilow, the Lyric Pieces are 'a very special kind of diary that Grieg kept throughout his life, or a confession, because they reflect the most intimate moments in the composer's life'."
 elgar.1053.t: "Norwegian Dances"
 elgar.1053.f: "The Norwegian Dances were the Norwegian's answer to the hugely successful Slavonic Dances of Antonín Dvořák and the Hungarian Dances of Johannes Brahms. The two colleagues had published their dance series for piano four hands in 1878 and 1881 by the Simrock publishing house. At that time Grieg did not dare to orchestrate his dances, since the terrain was occupied by his friend Johan Svendsen's 'Norwegian Rhapsodies'. The orchestral version of his Norwegian Dances was therefore arranged by Robert Henriques - much to Grieg's satisfaction. For the first dance, Grieg used the popular Sinklar march, for the last three so-called \"Hallings\", traditional Norwegian bridal dances for young men, which are fast and very acrobatic to perform."
 elgar.1061.t: "Deutsches Requiem"
 elgar.1061.f: "'There is little to tell here, but I still have to tell you that I am completely filled with your Requiem, it is a very powerful piece, it grips the whole person in a way like few other things. The deep seriousness, combined with all the magic of poetry, has a wonderful, shocking and soothing effect. As you know, I can never really put it into words, but I feel the whole rich treasure of this work to the core, and the enthusiasm that speaks from every piece moves me deeply, which is why I can't help myself pronounce … Oh, if I could hear it, what would I give for it.' - Clara Schuman"
 elgar.1062.t: "Hungarian Dances"
 elgar.1062.f: "The Hungarian Dances by Johannes Brahms are a set of 21 lively dance tunes based mostly on Hungarian themes, completed in 1879. They vary from about a minute to five minutes in length. They are among Brahms's most popular works and were the most profitable for him. Each dance has been arranged for a wide variety of instruments and ensembles. Brahms originally wrote the version for piano four hands and later arranged the first ten dances for solo piano. The violinist Joseph Joachim, who was a friend of Brahms, created a virtuoso arrangement of all Hungarian Dances for violin and piano."
 elgar.1063.t: "Symphony No. 4"
 elgar.1063.f: "Symphony No. 4 is the last symphony written by Johannes Brahms. Today it is one of the composer's most popular and most frequently performed orchestral works. At first glance, the uncompromising way in which the work is designed was disconcerting. When Brahms and Ignaz Brüll played the symphony to friends on two pianos, Clara Schumann and Brahms' later biographer Max Kalbeck, among others, reacted with rejection. Eduard Hanslick is said to have exclaimed: 'Throughout the movement I felt as if I were being beaten through by two terribly clever people.' Elisabeth von Herzogenberg described the work as 'a small world for the clever and knowledgeable, in which the people who walk in the dark could only have a small part'. When Brahms attended a performance of the symphony in 1897, shortly before his death, he received thunderous applause from the Viennese audience, which the work has received to this day."
 elgar.1071.t: "Symphony No. 5"
 elgar.1071.f: "Like some of Mahler's other symphonies, the 5th symphony was not understood after its premiere. In 1905, after an unsuccessful performance in Hamburg, Mahler complained: 'The Fifth is a cursed work. Nobody gets it.' Music reviews in the years following the premiere were mostly negative. The music critic Ferdinand Pfohl, for example, judged that the 5th symphony was one of Mahler's weaker works. Only the Neue Zeitung für Musik gave the symphony a benevolent testimony and spoke of an 'overwhelming wealth of beauty'. Especially in comparison to the 4th symphony written two years earlier, it represents a major difference in content and form. With the rougher sound world of the 5th symphony, Mahler begins a new creative phase, which is further developed in the following 6th symphony. Only after Mahler's death did the work become more and more appreciated."
 elgar.1072.t: "Lied von der Erde"
 elgar.1072.f: "'Is it really the same man who, 'in harmony with the infinite', erected the edifice of the Eighth that we now find in the drinking song of Earth's woes? Who creeps lonely in the autumn to his beloved resting place, longing for refreshment? Who looks at youth with a friendly look of old age, with gentle emotion at beauty? Who seeks to forget the meaningless earthly existence in drunkenness and finally says goodbye in melancholy? (...) It is hardly the same person and composer. All works up to that point had arisen from the feeling of life (...) The earth is disappearing, a different air is blowing in, a different light shines over it. (...) When I brought the autograph back to him, almost unable to say a word about it, he opened the 'Abschied' and said, 'What do you think? Is that bearable at all? Won't people kill themselves afterwards?' He then pointed to the rhythmic difficulties and asked jokingly, 'Any idea how to conduct that? Not me!' - Bruno Walter"
 elgar.1073.t: "Kindertotenlieder"
 elgar.1073.f: "'I can well understand that one composes such terrible lyrics when one has no children or when one has lost children. But I can't understand how you can sing about the death of children if you hugged and kissed them half an hour before, happy and healthy!' - Alma Mahler-Werfel, wife of Gustav Mahler"
 elgar.1081.t: "Piano Concerto No. 3"
 elgar.1081.f: "At that time Mahler was the only conductor whom I considered worthy to be classed with Nikisch. He devoted himself to the concerto until the accompaniment, which is rather complicated, had been practiced to perfection, although he had already gone through another long rehearsal. According to Mahler, every detail of the score was important - an attitude too rare amongst conductors. ... Though the rehearsal was scheduled to end at 12:30, we played and played, far beyond this hour, and when Mahler announced that the first movement would be rehearsed again, I expected some protest or scene from the musicians, but I did not notice a single sign of annoyance. The orchestra played the first movement with a keen or perhaps even closer appreciation than the previous time. - Sergei Rachmaninoff"
 elgar.1082.t: "Rhapsody on a Theme of Paganini"
 elgar.1082.f: "The piece consists of 24 variations on a theme that Niccolò Paganini himself used as the starting point for a series of variations. This melody has repeatedly served as a template for various composers, including Johannes Brahms and Franz Liszt. In some variations, Rachmaninoff uses another, much older melody: the sequence 'Dies irae', once an integral part of the Latin mass for the dead. Rachmaninoff used this theme again and again in his works. It appears in all the symphonies, the Symphonic Dances, the symphonic poem Die Toteninsel and the first piano sonata. The combination of a Paganini theme with the 'Dies irae' prompts the search for a programmatic background to the work. According to legend, the great violinist sold his soul to the devil in order to achieve perfection on his instrument and the love of a woman. The 'Dies irae' motif stands for the devil, the Paganini theme for the composing violinist himself."
 elgar.1083.t: "Symphony No. 3"
 elgar.1083.f: "'It was played in New York, Philadelphia, Chicago, etc. At the first two performances I was present. It was played wonderfully. Its reception by both the public and critics was sour. One review sticks painfully in my mind: that I didn't have a Third Symphony in me any more. Personally, I am firmly convinced that this is a good work. But—sometimes composers are mistaken too! Be that as it may, I am holding to my opinion so far.' - Sergei Rachmaninoff"
 elgar.1091.t: "Romeo and Juliet"
 elgar.1091.f: "Romeo and Juliet is Sergei Prokofiev's longest and best-known ballet and is widely regarded as his most important contribution to the genre. It is considered a highlight of his musical work. The rich and varied instrumentation as well as the rhythmic complexity of the score still pose challenges for orchestra and dancers. In some places, dissonances border on atonality. The famous 'Dance of the Knights', with its dotted rhythms, is now better known as a quasi-symphonic theme. In contrast, the themes associated with Juliet's awakening to love are at once tender and youthfully lively. Prokofiev reused music from the ballet in three suites for orchestra and a solo piano work."
 elgar.1092.t: "Lieutenant Kijé"
 elgar.1092.f: "Lieutenant Kijé music was originally written to accompany the film of the same name. It was Prokofiev's first attempt at film music, and his first commission. In the early days of sound cinema, among the various distinguished composers ready to try their hand at film music, Prokofiev was not an obvious choice for the commission. Based in Paris for almost a decade, he had a reputation for experimentation and dissonance. Soon after the film's release, Prokofiev received an invitation from the Moscow Radio Symphony Orchestra to create an orchestral suite from his Kijé film music - probably the first instance of a film score being adapted into a significant musical work. While Prokofiev was in the United States for the Boston premiere he was greatly sought after by film producers, but although he was flattered and attracted by their offers he never composed a Hollywood film score."
 elgar.1093.t: "Peter and the Wolf"
 elgar.1093.f: "Peter and the Wolf is a 'symphonic fairy tale for children'. It is Prokofiev's most frequently performed work and one of the most frequently performed works in the entire classical repertoire. The narrator tells a children's story, while the orchestra illustrates it by using different instruments to play a 'theme' that represents each character in the story: 'Each character of this tale is represented by a corresponding instrument in the orchestra: the bird by a flute, the duck by an oboe, the cat by a clarinet playing staccato in a low register, the grandfather by a bassoon, the wolf by three horns, Peter by the string quartet, the shooting of the hunters by the kettle drums and bass drum. Before an orchestral performance it is desirable to show these instruments to the children and to play on them the corresponding leitmotifs. Thereby, the children learn to distinguish the sounds of the instruments during the performance of this tale.'"
 elgar.1101.t: "Die Fledermaus"
 elgar.1101.f: "Johann Strauss's Fledermaus is considered one of the highlights of the operetta era. Along with The Gypsy Baron and One Night in Venice, Die Fledermaus is one of the three most famous Strauss operettas and also one of the few operettas that are regularly performed at major international opera houses. The lyrics are catchy and full of irony with timeless truths. The essential parts of the music are said to have been created within 42 days. The overture, written in free sonata form, occupies a special place and is one of Johann Strauss' greatest creations. It summarizes the numerous musical highlights of the entire work and, with its varied dynamics, is always a challenge even for top orchestras."
 elgar.1102.t: "Donauwalzer"
 elgar.1102.f: "The waltz By the Beautiful Blue Danube (often shortened to: Danube Waltz) is compositionally based on melodies that Johann Strauss had already used in earlier works. Already at its premiere it sparked enthusiasm among the audience. Due to the large number of new musical releases in the carnival season at the time, the waltz did not initially catch on. However, because Strauss appeared in Paris at the 1867 World's Fair in the same year and created new compositions for it, he remembered to include this waltz in the program. Under the name Le beau Danube bleu, the piece became a great success during this exhibition. It is assumed that the published editions of the waltz, especially the two-hand piano version, were sold almost 1,000,000 times in a short period of time. The waltz is considered Austria's secret anthem and one of the most popular pieces in the entire history of classical music."
 elgar.1103.t: "A Night in Venice"
 elgar.1103.f: "A Night in Venice is a 'comic operetta' in three acts. The action takes place in Venice around the middle of the 18th century and is a comedy of disguise and mistaken identity with love confusion between two classes. Like many other Viennese operettas, the libretto is an adaptation of a French opéra-comique. The premiere in Berlin was a failure. This was partly due to the confusing plot, but also partly due to the underlying texts. The piece was therefore reworked for the premiere at the Theater an der Wien. The overture was also reworked by Strauss. The most famous musical numbers are the lagoon waltz and the gondola song. In 1923 and again in 1931 it was significantly revised by Erich Wolfgang Korngold; another version was written by Walter Felsenstein in 1954; the original version is now only very rarely performed."
 elgar.1111.t: "Rigoletto"
 elgar.1111.f: "Rigoletto is an opera by Giuseppe Verdi with a libretto by Francesco Maria Piave. It is based on the melodrama 'Le roi s'amuse' by Victor Hugo. The opera was initially criticized by the censors; Verdi and Piave therefore had to, among other things, change the originally intended title and move the setting from Paris to Mantua. However, the elements essential to Verdi, such as the crippled main character Rigoletto and the sack into which his dying daughter is put, remained intact. The opera is considered Verdi's first masterpiece and established his world fame. Verdi himself considered Rigoletto to be one of his most accomplished works, and unlike other Verdi operas, there are no revisions or new versions. Rigoletto was an overwhelming success at its premiere and was played at almost all European opera houses over the next few years. The opera has been part of the repertoire of many opera houses for over 160 years and remains one of the most frequently performed Italian operas."
 elgar.1112.t: "La Traviata"
 elgar.1112.f: "La traviata is an opera by Giuseppe Verdi and Francesco Maria Piave based on the novel La dame aux camélias by Alexandre Dumas the Younger. As before in Rigoletto and Il trovatore, Verdi placed a person ostracized and rejected by society at the center of the action. An opera about a courtesan who dies of tuberculosis was scandalous innovation at the time. The work failed at the premiere, even though Verdi had staged it himself and, as a precaution, moved the action to the time of Louis XIV. After its revision, Verdi had it performed again a year later - after which it became one of the most successful operas in music history. In some countries it is the most performed opera ever. In terms of the number of recordings made, La traviata is only surpassed by Aida. For censorship reasons, the opera was also performed in Italy under the title Violetta."
 elgar.1113.t: "Messa da Requiem"
 elgar.1113.f: "Under the impression of the death of Gioachino Rossini in 1868, Giuseppe Verdi invited the twelve most important composers in Italy at the time to jointly compose a funeral mass, the so-called Messa per Rossini. He himself took over the setting of the final movement, 'Libera me', in this requiem. However, a performance did not take place due to adverse circumstances. Verdi once again dealt with the Requiem material after the poet Alessandro Manzoni died in 1873. Verdi deeply admired the highly respected Manzoni. He offered the city of Milan the composition of a mass to be performed a year after Manzoni's death. The 'Libera me' from the Rossini Mass now became the nucleus of the new Requiem for Manzoni. The setting of 'Dies irae' from the older composition was taken up three times for passages of the sequence with the same or similar text. The first performance, at the San Marco church in Milan on May 22, 1874, marked the first anniversary of Manzoni's death. Verdi himself conducted."
 elgar.1121.t: "Prélude à l'après-midi d'un faune"
 elgar.1121.f: "'The music of this prelude is a very free illustration of Mallarmé's beautiful poem. By no means does it claim to be a synthesis of it. Rather there is a succession of scenes through which pass the desires and dreams of the faun in the heat of the afternoon. Then, tired of pursuing the timorous flight of nymphs and naiads, he succumbs to intoxicating sleep, in which he can finally realize his dreams of possession in universal Nature.'\n\nPrelude to the Afternoon of a Faun is a symphonic poem for orchestra and one of Debussy's most famous works. The piece is considered a turning point in the history of Western art music as well as a masterpiece of Impressionist composition. Pierre Boulez considered the score to be the beginning of modern music, observing that 'the flute of the faun brought new breath to the art of music.'"
 elgar.1121.g: "Indulge, dream, enjoy the never-ending moment..."
 elgar.1122.t: "La Mer"
 elgar.1122.f: "'Last night's concert began with a lot of impressionistic daubs of color smeared higgledy-piggledy on a tonal palette, with never a thought of form or purpose except to create new combinations of sounds. … One thing only was certain, and that was that the composer's ocean was a frog-pond and that some of its denizens had got into the throat of every one of the brass instruments.'\n\nComposed between 1903 and 1905, La mer was premiered in Paris in October 1905. It was initially not well received. Even some who had been strong supporters of Debussy's work were unenthusiastic, even though the piece presented three key aspects of Debussy's aesthetic: Impressionism, Symbolism and Japonism. In the decades after the premiere La mer established itself in the core orchestral repertoire."
 elgar.1123.t: "Pelléas et Mélisande"
 elgar.1123.f: "'As a teacher he was pedantic—that's the only word. Really pedantic ... There was a core of anger and bitterness in him—I often think he was rather like Golaud in Pelléas and yet he wasn't. He was—it's in all his music—a very sensual man. No one seemed to like him. Jean Périer, who played Pelléas to my Mélisande, went white with anger if you mentioned the name of Debussy...'\n\nPelléas et Mélisande is an opera in five acts. The genre name of the composer Claude Debussy is 'Drame lyrique'. The text is an adaptation of the play Pelléas et Mélisande by Maurice Maeterlinck. Debussy avoided arias and larger solo scenes, which gave the text a realistic character. Pelléas was to be Debussy's only completed opera. For this reason it has sometimes been compared to Beethoven's Fidelio."
 elgar.1131.t: "Jezioro Łabędzie"
 elgar.1131.f: "Swan Lake is a world-famous ballet to the music of Pyotr Ilyich Tchaikovsky, which premiered in 1877 at the Bolshoi Theater in Moscow and is part of the standard repertoire of classical ballet companies. Common motifs from numerous fairy tales can be found in Swan Lake: in particular the unfortunate enchanted princess who is redeemed by the love of a prince. The unfortunate ending of the original libretto is also a well-known fairy tale motif of the swan girl or swan maiden. Tchaikovsky drew on previous compositions for his Swan Lake score. According to two of Tchaikovsky's relatives the composer had earlier created a little ballet called 'The Lake of the Swans' at their home in 1871. This ballet included the famous Leitmotif. He also made use of material from 'The Voyevoda', an opera he had abandoned in 1868. By April 1876 the score was complete, and rehearsals began. Soon the choreographer Reisinger began setting certain numbers aside that he dubbed 'undanceable'. Reisinger even began choreographing dances to other composers' music, but Tchaikovsky protested and his pieces were reinstated."
 elgar.1132.t: "Symphony No. 6 'Pathétique'"
 elgar.1132.f: "'I am now wholly occupied with the new work ... and it is hard for me to tear myself away from it. I believe it comes into being as the best of my works. I must finish it as soon as possible, for I have to wind up a lot of affairs and I must soon go to London. I told you that I had completed a Symphony which suddenly displeased me, and I tore it up. Now I have composed a new symphony which I certainly shall not tear up.'\n\nTwo years after the premiere of his Symphony No. 5 in E minor, Op. 64, Tchaikovsky planned, as he wrote to a friend, 'to write a magnificent symphony that will form the keystone of my entire work'. The composer entitled the work 'The Passionate Symphony'. Characteristic of the work is the slow final movement - unusual for symphonies - whose end is reminiscent of a requiem."
 elgar.1133.t: "Violin Concerto in D major"
 elgar.1133.f: "The Violin Concerto in D major is the only violin concerto by the Russian composer Pyotr Ilyich Tchaikovsky. Tchaikovsky wrote the concerto in March and April 1878 in Clarens, a wine-growing town on Lake Geneva. There he recovered from depression and a severe nervous breakdown. The positive effect of his stay was reflected in the concert, in which his newfound joy of life manifested itself. The composition work was completed after three weeks, although Tchaikovsky replaced the originally planned middle movement with the Andante known as 'Canzonetta'. Music critics reacted negatively to the work. Tchaikovsky reacted calmly and was convinced that the concerto would prevail. To this day, it is one of the most famous, most performed and most played violin concertos in the world."
 elgar.1141.t: "Pomp & Circumstance"
 elgar.1141.f: "The Pomp and Circumstance Military Marches are a series of five (or six) marches for orchestra. They include some of Elgar's best-known compositions. The best known of the six marches, Pomp And Circumstance March No. 1 In D had its premiere, along with March No. 2, in Liverpool on 19 October 1901. Elgar and his wife attended, and it was a 'frantic' success. The Trio contains the tune known as 'Land of Hope and Glory'. In 1902 the tune was re-used, in modified form, for the 'Land of hope and glory' section of his Coronation Ode for King Edward VII. The words were further modified to fit the original tune, and the result has since become a fixture at the Last Night of the Proms, and an English sporting anthem and general patriotic song."
 elgar.1141.g: "Land of Hope and Glory!"
 elgar.1142.t: "The Crown of India"
 elgar.1142.f: "The Crown of India, was a masque, an elaborate theatrical presentation, staged in 1912 to celebrate the visit the preceding December of King George V and Queen Mary to Delhi for their coronation as Emperor and Empress of India. For this masque, the English composer Sir Edward Elgar wrote the music , with a libretto by Henry Hamilton. The masque consisted of two tableaux: 'The Cities of Ind' and 'Ave Imperator!'. Elgar later extracted five of the pieces and added an intermezzo for solo violin to create The Crown of India Suite.  The Suite gained immediate popularity: during Elgar's lifetime, there were 102 live performances of it on the BBC."
 elgar.1143.t: "Enigma Variations"
 elgar.1143.f: "The Enigma Variations are an orchestral work that describes the people from Elgar's environment in 14 variations. They made Elgar internationally known after their premiere by the conductor Hans Richter. The 'Enigma' from the title does not refer to the assignment of which variation is dedicated to which friend, but to another puzzle. According to Elgar, there is a different and larger theme running through the whole composition, but it is not played, and the actual theme is composed as a countermelody to it. Various theories have been put forward so far. The 9th variation (Nimrod) in particular gained great popularity."
 elgar.1151.t: "The 9th Symphony"
 elgar.1151.f: "In 1892, Dvořák moved to the United States and became the director of the National Conservatory of Music of America in New York City. While in the United States, Dvořák wrote one of his most successful orchestral works: the Symphony 'From the New World', which spread his reputation worldwide. It has been said that Dvořák was inspired by the 'wide open spaces' of America, such as prairies he may have seen on his trip to Iowa in the summer of 1893. Dvořák was also influenced by the style and techniques used by earlier classical composers including Beethoven and Schubert. The falling fourths and timpani strokes in the New World Symphony's Scherzo movement evoke the Scherzo of Beethoven's Symphony No. 9. At the premiere in Carnegie Hall, the end of every movement was met with thunderous clapping and Dvořák felt obliged to stand up and bow."
 elgar.1152.t: "Slavonic Dances"
 elgar.1152.f: "The Slavonic Dances are a collection of 16 instrumental pieces by Antonín Dvořák, written for piano four hands and each shortly afterwards arranged for orchestra. They are among the Czech composer's most famous works. Dvořák's compositions use characteristic rhythmic patterns of Bohemian and Moravian folk dances as well as those of neighboring countries. However, they are still completely independent creations of the composer. In the first row there are two Furiants characterized by rhythm changes, two Sousedskás similar to the Ländler, two Skočnás (fast jumping dance), a Polka and, as the only non-Czech dance, a Ukrainian Dumka. In the second series, non-Czech dances predominate, which is why Dvořák was exposed to some hostility. He was accused of not identifying enough with his homeland and instead wanting to make himself popular abroad."
 elgar.1153.t: "Rusalka"
 elgar.1153.f: "Rusalka is Antonín Dvořák's most successful opera. It was created based on a libretto by Jaroslav Kvapil and goes back to Slavic folk myths about the rusalky (water spirits, mermaids) and is similar to the German story Undine by Friedrich de la Motte Fouqué, Hans Christian Andersen's fairy tale The Little Mermaid and the Old French Melusine saga. The opera with the subtitle Lyric Fairy Tale is also known as the 'Czech Undine'. Along with Bedřich Smetana's The Bartered Bride, Rusalka is the most famous Czech opera. The opera Rusalka occupies a prominent place in the development of Czech dramatic music."
 elgar.1161.t: "Fantasie in C-Dur"
 elgar.1161.f: "The Fantasy in C major is one of Robert Schumann's most important piano compositions. Along with the Kreisleriana and Children's Scenes, it is one of the composer's best-known pieces and is part of the core of romantic piano literature. He dedicated it to Franz Liszt, the admired virtuoso who thanked him years later by donating his great B minor sonata to him. The visionary swing of this piano fantasy and the power sustained throughout the entire composition are reminiscent of the architectural mastery of Ludwig van Beethoven, from whose song cycle 'To the distant beloved' Schumann quotes several times in the first movement, while in the third movement he uses a theme from the Allegretto of the 7th Symphony takes up."
 elgar.1162.t: "Piano Concerto in A minor"
 elgar.1162.f: "The Piano Concerto in A minor op. 54 is a romantic solo concerto for piano and orchestra that was written during the High Romantic period. It bears many characteristics of the romantic era. Like some other piano concertos of the 19th century, the A minor concerto has a symphonic character. Since the work was initially conceived as a fantasy, the entire concert has romantic and fantastic impressions. Schumann needed over five years for the delayed completion. On the title page of the autograph, Schumann points out the different times in which the movements were written. The basic ideas of the work are longing and the happiness of two people in love. In this work, Schumann translates his fight for Clara Wieck into music. The main theme of the first movement is similar to the melody of the Florestan aria from Beethoven's opera Fidelio. Congruent with Beethoven, this theme also stands for spousal loyalty and the fight for freedom in Schumann."
 elgar.1163.t: "Kinderszenen"
 elgar.1163.f: "The Kinderszenen (Children's Scenes) is a cycle by Robert Schumann consisting of thirteen short piano pieces. In contrast to the 'Album for the Youth', these are pieces that were not composed for children, but, in Schumann's own words, as a 'reflection of an older person for older people'. The most famous and longest piece in the cycle is 'Träumerei'. With a playing time of just under 20 minutes, the Children's Scenes are among the most popular Romantic piano works today. Although the Children's Scenes were not particularly successful during Schumann's lifetime, the work had a special meaning, at least for him. An exchange of letters from 1839 shows that Schumann at that time firmly believed in the possibility of a marital union with Clara Wieck and that the Children's Scenes arose from his optimistic and cheerful side."
 elgar.1171.t: "Violin Concerto in E minor"
 elgar.1171.f: "Felix Mendelssohn's Violin Concerto in E minor is his last concerto. Well received at its premiere, it has remained among the most prominent and highly-regarded violin concertos. It holds a central place in the violin repertoire and has developed a reputation as an essential concerto for all aspiring concert violinists to master, and usually one of the first Romantic era concertos they learn. The work itself was one of the foremost violin concertos of the Romantic era and was influential on many other composers.Although the concerto consists of three movements in a standard fast-slow-fast structure and each movement follows a traditional form, it was innovative and included many novel features for its time. Distinctive aspects include the almost immediate entrance of the violin at the beginning of the work - rather than following an orchestral preview of the first movement's major themes, as was typical in Classical-era concertos."
 elgar.1181.t: "Ètudes"
 elgar.1181.f: "Frédéric Chopin wrote a total of 27 études for piano: 12 études op. 10 (published in 1833), 12 études op. 25 (published in 1837) and another three études for the third part (Études de perfectionnement pour le piano, published in 1840) of the piano school Méthodes des Méthodes by Ignaz Moscheles and François-Joseph Fétis. The three études were later published separately under the title Trois nouvelles études. As the 'Magna Carta of piano playing' (Karl Schumann), they are among the most important piano compositions in music history. Great piano composers such as Alkan, Scriabin, Debussy and Rachmaninoff took their cues from them. Franz Liszt and Józef Wieniawski were the first pianists to publicly perform Chopin études."
 elgar.1191.t: "A Life for the Tsar"
 elgar.1191.f: "After years of listening to singers, romancing women with his music, and meeting famous people including Mendelssohn, Berlioz and Liszt, Glinka realized that his life's mission was to return to Russia, write in a Russian manner, and do for Russian music what Donizetti and Bellini had done for Italian music. A Life for the Tsar was the first of Glinka's two great operas. It was originally entitled Ivan Susanin. Set in 1612, it tells the story of the Russian peasant and patriotic hero Ivan Susanin who sacrifices his life for the Tsar by leading astray a group of marauding Poles who were hunting him. With this opera Glinka succeeded in creating an independent Russian music; it is considered the first Russian opera."
 elgar.1192.t: "Ruslan and Ludmila"
 elgar.1192.f: "Ruslan and Ludmila is a 'fantastic opera' in five acts with music by Mikhail Glinka with a libretto by Nestor Kukolnik and others based on the poem of the same name by Alexander Sergeyevich Pushkin. Pushkin's death in the famous duel prevented him from writing the libretto himself as planned. As with 'A Life for the Tsar', Ruslan employs some aspects of Russian folk music; it is also noted for imaginative use of dissonance, chromaticism, and Eastern elements. Of particular consequence is the use of the whole tone scale for the first time in Russian music. The rollicking overture is one of the best known orchestral showpieces in the West and known for being a nightmare for bassists."
 elgar.1193.t: "Kamarinskaya"
 elgar.1193.f: "Kamarinskaya is a traditional Russian folk dance, which is mostly known today as the Russian composer Mikhail Glinka's composition of the same name. Glinka's Kamarinskaya, written in 1848, was the first orchestral work based entirely on Russian folk song and to use the compositional principles of that genre to dictate the form of the music. It became a touchstone for the following generation of Russian composers ranging from the Western-oriented Pyotr Ilyich Tchaikovsky to the group of nationalists known collectively as The Five and was also lauded abroad, most notably by French composer Hector Berlioz. For Tchaikovsky, Kamarinskaya offered a viable example of the creative possibilities of folk songs in a symphonic structure, using a variety of harmonic and contrapuntal combinations."
 elgar_great_composer: "Great Composer"
 elgar_great_composer_desc: "Great Composers are the crème de la crème of composers. They are simply the best and are known all around the world."
 elgar.21.t: "The most Musical Nations"
 elgar.21.d: "Here you see the 10 Nations with the most @elgar_music_tradition! Musical Tradition."
