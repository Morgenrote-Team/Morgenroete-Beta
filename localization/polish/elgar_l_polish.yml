 elgar.801.t: "Hymn Narodowy"
 elgar.801.d: "Wraz z umacnianiem się poczucia przynależności narodowej rośnie pragnienie posiadania hymnu narodowego, który godnie reprezentowałby władcę, kraj i naród. Pragnienie to podzielają już nie tylko intelektualiści, lecz także szerokie rzesze zwykłych obywateli."
 elgar.801.f: "Jeszcze przed połową XIX wieku w wielu krajach Europy i Ameryki wykonywano określone pieśni podczas oficjalnych uroczystości, często ku czci monarchy. Niektóre hymny wcześnie zatwierdzono oficjalnie, inne zaś zachowały nieoficjalny status aż do XX wieku. Dlatego część krajów rozpoczyna grę z ustalonymi hymnami narodowymi, które mogą ulec zmianie wskutek rewolucji lub zmian ustrojowych. Wiele państw musi natomiast stworzyć swoje hymny od podstaw, w czym cenną pomocą mogą służyć kompozytorzy i pisarze."
 elgar.801.g: "Zajmiemy się tym później."
