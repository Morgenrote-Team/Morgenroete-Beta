 je_elgar_vivaldi_rediscovery: "Ponowne Odkrycie Vivaldiego"
 je_elgar_vivaldi_rediscovery_reason: "Antonio Vivaldi był jednym z najwybitniejszych kompozytorów epoki baroku, lecz po śmierci popadł w zapomnienie. Później o jego działalności kompozytorskiej wiedziano jedynie z dokumentów. Czy jednak mogły przetrwać jakieś kopie lub autografy jego utworów?"
 elgar.536.t: "Vivaldiana"
 elgar.536.d: "W jednej z placówek salezjańskich archiwista z naszej Biblioteki Narodowej odkrył rękopisy wielkiego kompozytora barokowego Vivaldiego, uznawane dotąd za zaginione. Nasz kompozytor, [GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetFullName], również wykazał wielkie zainteresowanie odnalezioną twórczością. Czy to początek renesansu muzyki Vivaldiego?"
 elgar.536.f: "Jesienią 1926 roku w prowadzonym przez salezjanów internacie w Piemoncie odkryto w archiwach ogromny zbiór historycznych woluminów. W obliczu typowych problemów finansowych katolickich placówek edukacyjnych administracja postanowiła sprzedać te księgi za pośrednictwem antykwariuszy. Aby ustalić ich uczciwą wartość rynkową przed rozpoczęciem negocjacji, zwrócono się do Biblioteki Narodowej w Turynie z prośbą o oficjalną wycenę. Zadanie powierzono Dr. Alberto Gentiliemu, profesorowi historii muzyki na Uniwersytecie Turyńskim. Już podczas oględzin pierwszej skrzyni Gentili dokonał niezwykłego odkrycia: znalazł niezliczone oryginalne rękopisy spisane własnoręcznie przez samego Vivaldiego. W trakcie dalszych badań Gentilini odkrył, że zbiór jest niekompletny, i musiał ustalić miejsce przechowywania pozostałych autografów, aby skompletować kolekcję Vivaldiego. Dokumenty te stały się trzonem słynnych Zbiorów Turyńskich, wywołując wielkie odrodzenie zainteresowania kompozytorem. Renesans twórczości Vivaldiego został później upamiętniony podczas specjalnego „Tygodnia Vivaldiego”, zorganizowanego we wrześniu 1939 roku w Sienie."
 elgar.536.g: "Wspaniałe dziedzictwo muzyczne!"
 elgar.536.h: "Twórczość Vivaldiego powinna stać się inspiracją do tworzenia nowych kompozycji!"