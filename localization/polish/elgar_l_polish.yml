 elgar.802.t: "Przestarzały Hymn"
 elgar.802.d: "Po ostatnich zmianach w prawie dotychczasowy hymn narodowy nie wydaje się już odpowiedni. Wielu uważa go za anachroniczną pozostałość minionego ustroju politycznego. Narasta presja, by pozbyć się tego balastu."
 elgar.802.f: "„Mamy admirała bez floty. Rządzi krajem bez dostępu do morza. To królestwo bez króla”."
 elgar.802.g: "Ten hymn nie reprezentuje już naszego kraju."
 elgar.803.t: "Hymn Reakcyjny"
 elgar.803.d: "Coraz głośniejsze stają się żądania zniesienia dotychczasowego hymnu narodowego. Czołowi politycy domagają się w jego miejsce nowego utworu, który wyraźniej podkreślałby osiągnięcia nowoczesnego państwa, jakim jest [ROOT.GetCountry.GetNameNoFormatting]."
 elgar.803.f: "„Naprzód, ludu, ku wyzwoleniu\nCzerwony Sztandar, Czerwony Sztandar\nNaprzód, ludu, ku wyzwoleniu\nCzerwony Sztandar zatriumfuje.\nCzerwony Sztandar zwycięży,\nCzerwony Sztandar zwycięży,\nCzerwony Sztandar zwycięży,\nNiech żyją komunizm i wolność”."
 elgar.811.t: "Hymn [ROOT.GetCountry.GetNameNoFormatting]"
 elgar.811.d: "[ROOT.GetCountry.GetRuler.GetPrimaryRoleTitle] [ROOT.GetCountry.GetRuler.GetFullNameNoFormatting] wydał dekret nakazujący wykonywanie określonego utworu muzycznego podczas oficjalnych uroczystości. Wybór padł na..."
 elgar.821.t: "Muzyka dla [ROOT.GetCountry.GetNameNoFormatting]"
 elgar.821.d: "[GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetFullName] zapytał, czy są jakieś szczególne życzenia dotyczące planowanej kompozycji i któremu aspektowi należy poświęcić szczególną uwagę."
 elgar.821.f: "Istnieje pięć kategorii hymnów narodowych. Hymny monarsze zwiększają legitymizację, hymny ludowe zmniejszają niepokoje, a hymny wartości zwiększają lojalność przy poprawie warunków życia i jednocześnie sprawiają, że obywatele są odporniejsi na ich pogorszenie. Hymny wojskowe wzmacniają natomiast zdolności obronne kraju. Republiki Rad mogą zamawiać hymny robotnicze, które zwiększają siłę polityczną Związków Zawodowych. Dostępność poszczególnych hymnów zależy od formy rządów."
 elgar.821.g: "Hymn ma sławić naszego monarchę."
 elgar.821.h: "Popularna pieśń ludowa ma zjednoczyć rząd i lud."
 elgar.821.i: "Skomponuj wzniosły hymn, który odzwierciedla wartości naszego kraju."
 elgar.821.j: "Potrzebujemy pieśni, która zagrzeje nasz lud do walki!"
 elgar.821.k: "Tylko pieśń robotnicza sławiąca proletariat jest do przyjęcia."
 elgar.822.t: "Melodia Hymnu ukończona"
 elgar.822.d: "Maestro [GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetLastName] przedstawił dziś partyturę. To [GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetHerHis] propozycja nowego hymnu narodowego. Wciąż nie wiadomo, czy władze rzeczywiście ją przyjmą."
 elgar.822.f: "Powstało wiele hymnów, które nigdy nie stały się hymnami narodowymi. Przyczyny tego są różne. Państwo musi jeszcze oficjalnie je zatwierdzić. Ponadto hymny narodowe, które mają zarówno oryginalną melodię, jak i tekst, wywierają silniejszy wpływ."
 elgar.822.g: "Miejmy nadzieję, że zyska uznanie wśród ludu..."
 elgar.831.t: "Tekst Hymnu ukończony"
 elgar.831.d: "[GetPlayer.MakeScope.Var('manzoni_writer_var').GetCharacter.GetFullName] od dawna rozważał, czy COUNTRY nie potrzebuje godnego tekstu hymnu narodowego. Pisarz szybko ułożył odpowiednie słowa do znanej od dawna melodii."
 elgar.831.f: "„---------” — La Marcha Real"
