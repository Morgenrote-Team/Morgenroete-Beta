 elgar.304.h: "Zapłać kompozytorowi podwójnie, aby stworzył wyjątkowy utwór dla monarchy."
 elgar.440.i: "Z pewnością istnieje pieśń ludowa, z którą każdy może się utożsamić."
 elgar.441.h: "Szanta mogłaby zachwycić nie tylko marynarzy..."
 elgar.442.h: "Marsz mógłby zachwycać nie tylko żołnierzy..."
 elgar_adopt_national_anthem_decision: "Przyjmij Hymn Narodowy"
 elgar_adopt_national_anthem_decision_desc: "Wraz z rozwojem nacjonalizmu brak hymnu narodowego zakrawa wręcz na oszustwo. Wystarczy wybrać odpowiednią muzykę ceremonialną, która będzie reprezentować państwo. Kompozytorzy mogą losowo tworzyć utwory muzyczne, które zostaną wykorzystane w przyszłości, ale można również bezpośrednio zlecić ich skomponowanie. Nie wszystkie hymny muszą mieć tekst słowny, choć jego posiadanie znacznie podnosi prestiż."
 je_elgar_composer_anthem: "Kompozytor Tworzy Melodię Hymnu"
 je_elgar_composer_anthem_reason: "[GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetFullName] powierzono niezwykle oficjalne zadanie skomponowania melodii przyszłego hymnu narodowego kraju [ROOT.GetCountry.GetNameNoFormatting]."
 je_elgar_composer_anthem_goal: "Jeśli nie wystąpią żadne komplikacje, [GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetFullName] będzie kontynuować [GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetHerHis] pracę każdego miesiąca. [GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetSheHe|U] ma za sobą #G [ROOT.Var('elgar_composer_progress').GetValue]#! miesięcy pracy."
