 elgar_classicism_tech: "Klasycyzm"
 elgar_classicism_tech_desc: "Klasycyzm w sztuce oznacza ogólnie wysoki szacunek dla epoki klasycznej, czyli starożytności klasycznej w tradycji zachodniej, traktowanej jako wyznacznik dobrego gustu, który klasycyści starają się naśladować. W swojej najczystszej postaci klasycyzm jest postawą estetyczną opartą na zasadach zakorzenionych w kulturze, sztuce i literaturze starożytnej Grecji i Rzymu. Kładzie nacisk na formę, prostotę, proporcje, przejrzystość kompozycji, doskonałość, powściągliwość emocjonalną, a także wyraźne odwołanie do intelektu."
 elgar_irrationalism_tech: "Irracjonalizm"
 elgar_modern_art_tech: "Sztuka Nowoczesna"
 elgar_modern_art_tech_desc: "#R Ta technologia jest jedynie atrapą i nie można jej zbadać. Ukończ Wpisy w Dzienniku, aby odblokować [concept_elgar_impressionism], [concept_elgar_expressionism] lub [concept_elgar_art_nouveau]!#!"
 elgar_art_nouveau_tech: "Secesja"
 elgar_art_deco_tech: "Art Déco"
 elgar_art_deco_tech_desc: "Art déco łączyło nowoczesne style z kunsztownym rzemiosłem i bogactwem materiałów. W okresie swojego rozkwitu symbolizowało luksus, przepych, ekstrawagancję oraz wiarę w postęp społeczny i technologiczny. Art déco było jednym z pierwszych prawdziwie międzynarodowych stylów, jednak jego dominacja dobiegła końca wraz z wybuchem II wojny światowej."
 elgar_impressionism_tech: "Impresjonizm"
 elgar_neoclassicism_tech: "Neoklasycyzm"
 elgar_neoclassicism_tech_desc: "Po przełomie wieków nastąpił ponowny wzrost zainteresowania ideałami klasycznymi: neoklasycyzmem. Objął on co najmniej muzykę, filozofię i literaturę. Podczas gdy architekci ponownie zaczęli wzorować się na rzymskich i greckich rozwiązaniach architektonicznych, kompozytorzy na nowo odkrywali muzykę barokową jako źródło inspiracji."
 elgar_expressionism_tech: "Ekspresjonizm"
 elgar_new_objectivity_tech: "Nowa Rzeczowość"
 elgar_new_objectivity_tech_desc: "Choć termin ten odnosił się przede wszystkim do tendencji w niemieckim malarstwie, z czasem zaczął żyć własnym życiem i określać postawę obecną w życiu publicznym Republiki Weimarskiej, a także sztukę, literaturę, muzykę i architekturę tworzone w jej duchu. Nie chodziło w nim o dążenie do filozoficznego obiektywizmu, lecz o zwrot ku praktycznemu zaangażowaniu w otaczający świat – postawę nastawioną na konkretne działania, postrzeganą przez Niemców jako typowo amerykańską."
 elgar_mass_culture_tech: "Kultura Masowa"
 elgar_mass_culture_tech_desc: "#R Ta technologia jest dostępna wyłącznie poprzez Wpis w Dzienniku!#!\n\n„Niepojmująca wrogość mas wobec wszystkich tradycji reprezentujących Kulturę, bystry i chłodny intelekt, który podważa mądrość chłopa, nowo odkryty naturalizm, który w kwestiach seksu i społeczeństwa sięga daleko wstecz, ku całkiem prymitywnym instynktom i warunkom, ponowne pojawienie się chleba i igrzysk w postaci sporów płacowych i stadionów sportowych – wszystko to zwiastuje nieuchronny schyłek Kultury i początek zupełnie nowej fazy ludzkiego istnienia”. – Oswald Spengler, „Zmierzch Zachodu”"
 elgar_stop_composing_button: "Przerwij Komponowanie"
 elgar_stop_composing_button_desc: "Kompozytor kończy komponowanie i ponownie jest dostępny do wykonywania innych zadań."
