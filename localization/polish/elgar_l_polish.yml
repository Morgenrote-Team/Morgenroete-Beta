 je_elgar_composer_touring_reason: "Przez 30 miesięcy [GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetFullName] będzie odbywać zagraniczną trasę koncertową, przyczyniając się tym samym do wzrostu naszego prestiżu. Po tym czasie znów będzie dostępny."
