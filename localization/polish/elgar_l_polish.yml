 elgar_faido_modifier: "Kultura Muzyczna Fado"
 elgar.535.t: "Brzmienie Saudade"
 elgar.535.d: "Z wąskich uliczek Lizbony i tawern Alfamy wyłania się nowa forma muzyczna — melancholijna, surowa i na wskroś portugalska. Nazywa się fado."
 elgar.535.f: "Już w pierwszych dekadach XIX wieku w robotniczych dzielnicach i portowych rejonach Lizbony zakorzenił się charakterystyczny gatunek muzyczny. Fado — dosłownie „los” — śpiewali marynarze, prostytutki i ubodzy mieszkańcy miast, często przy akompaniamencie cichego zawodzenia portugalskiej gitary. Teksty opowiadały o tęsknocie, pogodzeniu się z losem i nostalgii, czyli o tym, co miejscowi nazywali saudade — uczuciu zbyt złożonym, by można je było przetłumaczyć.\n\nChoć początkowo lekceważono je jako wulgarną muzykę uliczną, fado stopniowo zyskiwało uznanie artystyczne. Arystokraci zaczęli zapraszać wykonawców fado do swoich salonów, a w latach czterdziestych XIX wieku publiczne występy stały się powszechne w lizbońskich salach muzycznych. Kształtowała się nowa tożsamość muzyczna — wyjątkowo portugalska, będąca echem smutków i dumy zmieniającego się narodu."
 elgar.535.g: "Pozwólmy fado rozkwitać jako symbolowi tożsamości narodowej."
 elgar.535.h: "Wspieraj formalizację i profesjonalne wykonawstwo."
