 je_elgar_composer_success: "Jeśli nie wystąpią żadne komplikacje, nasz [GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetFullName] będzie kontynuował pracę każdego miesiąca. Pracował już przez #G [ROOT.Var('elgar_composer_progress').GetValue]#! miesięcy."
 je_elgar_composer_masterpiece: "Kompozytor Tworzy Arcydzieło"
 je_elgar_composer_masterpiece_reason: "[GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetFullName] poświęci się całkowicie stworzeniu arcydzieła w nadchodzących miesiącach. Czas potrzebny kompozytorowi na stworzenie arcydzieła zależy przede wszystkim od jego reputacji. Wielki kompozytor może stworzyć arcydzieło w zaledwie dwa lata. Kompozytorzy z reputacją poniżej 400 potrzebują znacznie więcej czasu; kompozytor z reputacją poniżej 250 nie powinien nawet próbować. Po zakończeniu pracy [GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetFullName] zaprezentuje przełomowe arcydzieło muzyczne naszego pokolenia."
 je_elgar_composer_masterpiece_goal: "Jeśli nie wystąpią żadne komplikacje, nasz [GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetFullName] będzie kontynuował pracę każdego miesiąca. Pracował już przez #G [ROOT.Var('elgar_composer_progress').GetValue]#! miesięcy."
 je_elgar_composer_duel: "Pojedynek Kompozytorów"
 je_elgar_composer_duel_reason: "Kompozytor [SCOPE.sCountry('target').GetAdjectiveNoFlag] [SCOPE.sCharacter('rival_composer_scope').GetFullName] stwierdził, że nasz kraj jest zacofany kulturowo, a [GetPlayer.MakeScope.Var('elgar_composer_var').GetCharacter.GetFullName] pozostaje postacią nieznaną. Musimy koniecznie zadbać o to, by stał się bardziej znany, i tym samym udowodnić światu, który kraj uchodzi za muzyczną awangardę."
 je_elgar_composer_duel_success: "Pierwszy kompozytor, któremu uda się zdobyć #V 100 dodatkowych punktów Reputacji#!, udowodni, że jego kraj cieszy się większym uznaniem kulturalnym niż kraj rywala."
 je_elgar_composer_duel_rival_death: "Przedwczesna śmierć drugiego kompozytora również oznacza zwycięstwo."
 je_elgar_composer_duel_fail: "Przegrywamy pojedynek, jeśli kompozytor rywala zdobędzie przed nami #V co najmniej 100 punktów Reputacji#! lub nasz kompozytor przedwcześnie umrze."
 elgar.9.t: "Technika Dodekafoniczna"
 elgar.9.d: "Po dziesięcioleciach stagnacji muzycznej współcześni kompozytorzy opracowali nową koncepcję, która zrewolucjonizuje świat muzyki."
 elgar.9.f: "Technika dwunastotonowa — znana również jako dodekafonia, serializm dwunastotonowy lub, w brytyjskiej terminologii, kompozycja dwunastodźwiękowa — jest metodą komponowania muzyki. Polega ona na zapewnieniu, że wszystkie 12 dźwięków skali chromatycznej pojawia się w utworze muzycznym równie często, przy jednoczesnym unikaniu wyróżniania któregokolwiek z nich. Służą do tego szeregi dźwiękowe, czyli uporządkowane sekwencje 12 klas wysokości dźwięku. W ten sposób wszystkie 12 dźwięków zyskuje mniej więcej równorzędne znaczenie, a muzyka nie jest podporządkowana żadnej tonacji. Z czasem technika ta zyskiwała coraz większą popularność, aż w końcu wywarła szeroki wpływ na kompozytorów XX wieku. Powszechnie uznaje się ją za jedną z form serializmu."
 elgar.9.g: "Nie jestem pewien, czy to był dobry pomysł."
