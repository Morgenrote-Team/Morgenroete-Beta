 elgar.1231.f: "„Suite Española” to suita na fortepian solo autorstwa hiszpańskiego kompozytora Isaaca Albéniza. Została napisana wraz z innymi utworami ku czci hiszpańskiej królowej.\nPierwotnie składała się z czterech części, z których każda przedstawiała region Hiszpanii i wykorzystywała lokalną formę muzyczną lub taniec: Granada (Serenata), Katalonia (Courante), Sewilla (Sevillanas) i Kuba (Notturno). Później dodano Kadyks (Canción), Asturię (Leyenda), Aragonię (Fantasía) i Kastylię (Seguidillas)."
 elgar.1232.f: "„Iberia” to suita fortepianowa autorstwa hiszpańskiego kompozytora Isaaca Albéniza. Składa się z czterech zeszytów, z których każdy zawiera po trzy utwory.\nUważana jest za najlepsze, ale zarazem najtrudniejsze dzieło Albéniza. Żartobliwie mawia się, że jej wykonanie jest łatwe, jeśli ma się trzy ręce."
 elgar.1233.f: "„Cataluña” to utwór fortepianowy autorstwa hiszpańskiego kompozytora Isaaca Albéniza. Choć pierwotnie został skomponowany na fortepian, z czasem stał się stałym elementem repertuaru muzyki na gitarę klasyczną."
 elgar.1241.f: "„Le lac des fées” (Jezioro Wróżek) to wielka opera francuskiego kompozytora Daniela Aubera. Opera opowiada historię Alberta, studenta, który zakochał się we wróżce Zélii."
 elgar.1251.f: "„Cudowny mandaryn” to balet pantomimiczny skomponowany przez węgierskiego kompozytora Bélę Bartóka. Dzieło wywołało skandal, który doprowadził do jego zakazania ze względów moralnych. Później wykonywano je głównie w formie suity koncertowej, co oznaczało, że odgrywano zaledwie około dwóch trzecich całego utworu."
 elgar.1252.f: "„Koncert na orkiestrę” to utwór orkiestrowy skomponowany przez węgierskiego kompozytora Bélę Bartóka. Uważany jest za jedno z najbardziej znanych i najpopularniejszych dzieł Bartóka."
 elgar.1253.f: "„Muzyka na instrumenty strunowe, perkusję i czelestę” to kompozycja węgierskiego kompozytora Béli Bartóka, zamówiona przez Paula Sachera, dyrygenta Basler Kammerorchester. Co ciekawe, zespół obejmuje nie tylko instrumenty strunowe, perkusyjne i czelestę, ale także fortepian, który w tym przypadku zaliczany jest do instrumentów perkusyjnych ze względu na mechanizm młoteczkowy."
 elgar.1261.f: "„Lao Siang Thian Thao” to tajski utwór muzyki klasycznej utrzymany w stylistyce melodycznej Lao, pochodzący z końca XIX wieku, którego pierwotny kompozytor pozostaje nieznany. W 1933 roku Luang Pradit Phairo (Sorn Silpabanleng) przekształcił wcześniejszą melodię dwupoziomową w pełną, trzypoziomową formę phleng thao, rozbudowując ją o nowo skomponowane fragmenty powracające oraz opracowania wokalne i instrumentalne. Tytuł pochodzi od starszego tekstu pieśni nawiązującego do rytuału wróżenia z płomienia świecy, a sam utwór z czasem znalazł szerokie zastosowanie w klasycznych przedstawieniach tanecznych i wykonaniach koncertowych."
 elgar.1262.f: "„Saen Kham Nueng Thao” to tajski utwór muzyki klasycznej w formie phleng thao, opracowany w 1940 roku przez Luanga Pradita Phairo (Sorna Silpabanlenga). Pierwotna melodia dwupoziomowa była starszym utworem towarzyszącym, tradycyjnie wykonywanym w parze z „Lao Toi Taling”. Luang Pradit rozbudował ją i przekształcił w pełną, trzypoziomową formę, opatrując tekstem opartym na eposie „Khun Chang Khun Phaen”. W ten sposób dawny utwór uzupełniający stał się wyrafinowanym dziełem koncertowym."
 elgar.1263.f: "„Homrong Kratae Tai Mai” to uwertura skomponowana przez Luanga Pradita Phairo (Sorna Silpabanlenga) około 1912–1913 roku. Bazując na wcześniejszej dwupoziomowej melodii „Kratae Tai Mai”, rozbudował ją do trzypoziomowego preludium ceremonialnego, wykorzystywanego do rozpoczynania występów. Utwór charakteryzuje się żywymi rytmami i zwinnym przebiegiem melodii, przywodzącym na myśl wiewiórkę wspinającą się na drzewo. Podczas wykonań często następuje po nim wiązanka Khap Nok."
 elgar.1271.f: "„Sri Ayutthaya” to suita historyczna opracowana w 1941 roku przez Phra Chenduriyanga (Piti Wathayakona) na potrzeby filmu „Phrachao Chang Phueak”. Utwór opiera się na starożytnej melodii „Sai Samon”, siedemnastowiecznej pieśni dworskiej z okresu królestwa Ajutthaja, odnotowanej w kronice La Loubère’a z 1687 roku. Przekształcona we współczesną aranżację orkiestrową suita upamiętnia wielkość i duchowe dziedzictwo Królestwa Ajutthaja, odzwierciedlając zarazem podejmowane na początku XX wieku próby odrodzenia i nadania syjamskiemu dziedzictwu muzycznemu charakteru narodowego."
 elgar.1272.f: "„Rabam Kridapiniharn” to suita taneczna stworzona w 1942 roku na potrzeby dramatu „Kiat Saksit Thai”, wystawianego przez Departament Sztuk Pięknych w Teatrze Silpakorn. Tekst pieśni opisuje niebiańskie istoty radujące się cudownymi osiągnięciami narodu tajskiego i świętujące je tańcem błogosławieństwa, podczas którego rozrzucają kwiaty. Choreografia opiera się na konwencjach klasycznego tańca tajskiego, natomiast warstwa wokalna i opracowanie melodyczne odzwierciedlają zmodernizowany styl charakterystyczny dla tamtego okresu. Suita kolejno łączy tradycyjne utwory „Rua Duekdam Ban”, „Khruan Ha” i „Chin Rua”, z aranżacją orkiestrową przygotowaną przez Phra Chenduriyanga (Piti Wathayakona) na potrzeby wykonania przez zespół instrumentów zachodnich."
 elgar.1273.f: "„Phama Prathet” to tradycyjny tajski utwór instrumentalny utrzymany w stylu birmańskim, opracowany przez Phra Chenduriyanga (Piti Wathayakona). Pierwotnie skomponowany na potrzeby przedstawień teatralnych, został później wybrany jako muzyczny sygnał czasu, nadawany przez Departament Informacji Rządu przed uroczystościami podnoszenia flagi narodowej oraz biuletynami informacyjnymi."
 elgar.1281.f: "„Phaya Sok Thao” to utwór tajskiej muzyki klasycznej, rozbudowany do trzech poziomów pod koniec panowania króla Ramy IV przez Phra Pradita Phairo (Mi Duriyangkun). Pierwotnie była to melodia dwupoziomowa, którą rozszerzono do pełnej struktury obejmującej tempo wolne, umiarkowane i szybkie, przeznaczonej do wykonywania zarówno przez zespoły mahori, jak i piphat. Utwór wyróżnia się zmiennymi rejestrami tonalnymi i ekspresyjnym przebiegiem melodii, a z czasem stał się wzorem dla instrumentalnych opracowań solowych. Kolejni mistrzowie adaptowali go do wirtuozowskich wykonań solowych na takich instrumentach jak saw sam sai, khong wong yai i ranat ek, dzięki czemu stał się jednym z najważniejszych utworów repertuaru tajskiej muzyki klasycznej."
 elgar.1282.f: "„Phra Athit Ching Duang” to ceremonialny utwór zamykający, skomponowany przez Phra Pradita Phairo (Mi Duriyangkun) na prośbę Somdeta Chao Phraya Borom Maha Si Suriyawonga (Chuang Bunnaga) pod koniec XIX wieku. W czasach, gdy powszechnie wykorzystywano zaledwie kilka tradycyjnych melodii pożegnalnych, dostojny patron poprosił o stworzenie nowego utworu przeznaczonego na zakończenie występów. Powstałe dzieło wzbudziło tak wielki podziw, że nazwano je na cześć jego honorowego tytułu i słonecznego emblematu, symbolizujących prestiż i władzę w dworskiej tradycji piphat."
 elgar.1283.f: "„Thep Ranjuan” to tajski utwór muzyki klasycznej w trójstopniowej formie, skomponowany przez Phra Pradita Phairo (Mi Duriyangkun) za panowania króla Ramy III. Dzieło zostało zaadaptowane i rozbudowane na podstawie starszej melodii związanej z dramatem „Phrom Kep Hua Waen”, przekształcając ją w pełną formę thao o tempie wolnym, umiarkowanym i szybkim. Elegancki i ekspresyjny charakter utworu sprawił, że w XIX wieku wszedł on do podstawowego repertuaru zespołów piphat i mahori."
 elgar.1291.f: "„Kulap Ruang” to pieśń teatralna, do której zarówno tekst, jak i muzykę skomponował Pranboon (Chuangchan Chankana) na potrzeby dramatu „Buppachat Nakhon”, wystawionego po raz pierwszy w 1933 roku przez trupę Chantharophas w Ban Don, w prowincji Surat Thani. Gdy w 1935 roku wznowiono przedstawienie pod tytułem „Mae Si Wiang”, pieśń zachowano jako utwór wstawiony między scenami, dzięki czemu zyskała szerszą rozpoznawalność. Po raz pierwszy została komercyjnie nagrana w 1935 roku, a później ponownie zyskała popularność dzięki współczesnym interpretacjom, umacniając swoją pozycję w tradycji tajskich pieśni teatralnych początku XX wieku."
 elgar.1292.f: "„Kluai Mai” to pieśń teatralna, do której muzykę i tekst skomponował Pranboon (Chuangchan Chankana), czołowa postać wczesnej tajskiej tradycji teatralnej lakhon rong. Utwór znalazł się w przedstawieniu „Cho Cho Sang” (Cio-Cio San / Madame Butterfly) wystawionym w 1934 roku przez trupę Si Ophas. Wykonywany w rytmie rumby inspirowanym muzyką latynoamerykańską, odzwierciedlającym ówczesne światowe trendy taneczne, stanowi przykład przenikania się tajskiej muzyki teatralnej z zachodnimi stylami muzyki popularnej w okresie międzywojennym. Jest ważnym świadectwem początków tajskiego rynku nagrań komercyjnych i popularnej muzyki teatralnej."
 elgar.1293.f: "„Khwan Khong Riam”, znana również jako „Khwan Riam”, to pieśń filmowa, do której zarówno tekst, jak i muzykę skomponował Pranboon (Chuangchan Chankana) na potrzeby filmu „Plae Kao” (Stare Rany) z 1940 roku. Kompozytor był czołowym artystą teatralnej trupy Chantharophas i wpływową postacią wczesnej tajskiej muzyki dramatycznej. Pierwszego komercyjnego nagrania dokonała Songsri Chanthraprapha (znana również jako Songsri Johnson), która w filmie wcieliła się w postać Riam, partnerując Somphongowi Chanthraprapha, odtwórcy roli Khwana. Pieśń, ściśle związana z jedną z najbardziej ikonicznych tajskich tragedii romantycznych, stała się symbolem przedwojennej kinematografii Tajlandii oraz przykładem przenikania tradycyjnych form pieśni teatralnej do wczesnych filmów dźwiękowych."
 elgar.1301.f: "„Homrong Phumi Thong, Sam Chan” to uwertura w trójstopniowej formie (sam chan), skomponowana przez Phrayę Phumisena (Chita Chittasewiego). Utwór stanowi rozbudowaną i przekształconą wersję wcześniejszej kompozycji „Nok Krachok Thong, Song Chan”, której dwustopniową strukturę rozwinięto do bardziej rozbudowanej formy trójstopniowej, charakterystycznej dla oficjalnego tajskiego repertuaru dworskiego."
 elgar.1302.f: "„Champa Thong Thao” to pełne opracowanie w formie thao, wywodzące się z wcześniejszego utworu „Champa Thong, Song Chan”. Kompozycja adaptuje materiał melodyczny z oryginału o dwustopniowej strukturze, rozwijając go do pełnej, trójstopniowej formy suity charakterystycznej dla gatunku thao. Śpiewany tekst pochodzi z „Savitri”, dramatu śpiewanego lakhon rong, napisanego przez króla Vajiravudha (Ramę VI), co odzwierciedla charakterystyczne dla początku XX wieku włączanie królewskiej literatury teatralnej do repertuaru klasycznej tajskiej muzyki artystycznej."
 elgar.1303.f: "„Sot Si Thao” to kompozycja w formie thao, której tekst stanowi poetycką refleksję nad naturą, opisując kwiaty o różnorodnych barwach. Utwór, zbudowany zgodnie z konwencjonalną trójstopniową strukturą gatunku thao, łączy kunsztowne opracowanie melodyczne z obrazowością literacką, ukazując syntezę poezji wokalnej i formalnego rozbudowania struktury metrycznej w klasycznej muzyce środkowej Tajlandii."
 elgar.1311.f: "„Lao Damnoen Sai” powstał jako utwór wokalny autorstwa sierżanta Phen Phayongying (Khoma), a później otrzymał opracowanie instrumentalne przygotowane przez Phrayę Prasana Duriyasapa (Plaeka Prasansapa), dzięki czemu wszedł do repertuaru muzyki klasycznej. Utwór utrzymany jest w dwustopniowym metrum song chan, w stylistyce laotańskiej, z charakterystycznym wzorcem rytmicznym na thap song mai, i wywarł szeroki wpływ na muzykę. Z czasem doczekał się adaptacji zarówno w tradycji klasycznej — przede wszystkim za sprawą Luanga Pradita Phairo (Sorna Silpabanlenga) — jak i w tajskiej muzyce artystycznej XX wieku. Jego nieustanne reinterpretacje w różnych gatunkach świadczą o trwałym znaczeniu tego utworu."
 elgar.1312.f: "„Anong Suchada”, wcześniej znana jako „Chin Anong Suchada”, to stara kompozycja utrzymana w dwustopniowym metrum song chan, wykorzystująca wzorzec rytmiczny na thap song mai. Utwór składa się z dwóch głównych części i pochodzi z okresu królestwa Ajutthaja. Tradycyjnie wykonywano go w teatrze khon i lakhon. Obecna aranżacja przypisywana jest Phrayi Prasanowi Duriyasapowi (Plaekowi Prasansapowi), który odegrał ważną rolę w zachowaniu tego utworu i wprowadzeniu go do repertuaru muzyki klasycznej."
 elgar.1313.f: "„Narai Plaeng Rup” pierwotnie występował w dwustopniowym metrum song chan jako część suity „Mon Plaeng”. Rozszerzenie do trójstopniowej formy sam chan skomponował Phraya Prasan Duriyasap (Plaek Prasansap) za panowania króla Ramy VI, nadając utworowi jego rozbudowaną strukturę formalną."
 elgar_rossini_leaves_bologna_tt: "[SCOPE.sCharacter('elgar_composer_scope').GetLastName] opuszcza Bolonię i przechodzi na emeryturę jako Kompozytor."
 elgar.609.t: "[SCOPE.sCharacter('elgar_composer_scope').GetLastName] przechodzi na emeryturę."
 elgar_lachner_retires_tt: "[SCOPE.sCharacter('elgar_composer_scope').GetFullName] przejdzie na emeryturę i nie będzie już dostępny jako kompozytor."
 elgar.1321.d: "Najnowsze arcydzieło Rimskiego-Korsakowa, orientalna suita w czterech częściach, zostało dziś zaprezentowane publiczności. Barwna instrumentacja przywodzi na myśl świat „Tysiąca i jednej nocy”."
 elgar.1321.f: "„Szeherezada” jest przykładem częstego sięgania przez Rimskiego-Korsakowa po tematykę baśniową i ludową. Ten utwór orkiestrowy łączy w sobie dwie cechy charakterystyczne zarówno dla muzyki rosyjskiej w ogóle, jak i dla twórczości samego Rimskiego-Korsakowa: olśniewającą, barwną instrumentację oraz zainteresowanie Wschodem, który odegrał istotną rolę w historii Imperium Rosyjskiego, a także w rozwoju orientalizmu. Nazwa „Szeherezada” nawiązuje do głównej bohaterki „Księgi tysiąca i jednej nocy”. Jest to jedno z najpopularniejszych dzieł Rimskiego-Korsakowa."
 elgar.1321.g: "Opowiedz mi kolejną historię, Szeherezado."
 elgar.1322.d: "W swoim najnowszym dziele Rimski-Korsakow łączy pogańską kulturę Słowian z chrześcijańską Rosją."
 elgar.1322.f: "„Rosyjska Uwertura Wielkanocna” Nikołaja Rimskiego-Korsakowa jest dedykowana pamięci Modesta Musorgskiego i Aleksandra Borodina, dwóch członków legendarnej Potężnej Gromadki. Nosi podtytuł „Uwertura na tematy z rosyjskiej liturgii wielkanocnej”. Melodie uwertury wywodzą się w dużej mierze z rosyjskiej liturgii prawosławnej. Ich tematy oparto na Obichodzie, zbiorze starożytnych rosyjskich hymnów prawosławnych. Rimski-Korsakow uzupełnił partyturę kilkoma cytatami biblijnymi. Charakterystyczną cechą utworu są krótkie kadencje skrzypcowe pojawiające się pomiędzy kilkoma jego częściami. Mają one symbolizować światło bijące z Grobu Pańskiego w chwili Zmartwychwstania Chrystusa."
 elgar.1322.g: "Zmartwychwstał, prawdziwie zmartwychwstał!"
 elgar.1323.d: "Najnowsza opera maestro Rimskiego-Korsakowa jest już uznawana za jego najbardziej udane dzieło sceniczne!"
 elgar.1323.f: "„Złoty Kogucik” to opera w trzech aktach Nikołaja Rimskiego-Korsakowa, oparta na baśni Aleksandra Puszkina o tym samym tytule, która z kolei nawiązuje do legendy o arabskim astrologu ze zbioru opowiadań Washingtona Irvinga „Alhambra” (1832). Ostatnie dzieło sceniczne Korsakowa uważane jest za jego najbardziej dopracowaną kompozycję. Kompozytor wykorzystuje bogactwo barw dźwiękowych, by opowiedzieć historię cara Dodona, którego trapi wiele zmartwień, mimo że pragnie oddawać się bezczynności. Astrolog ma rozwiązanie: Złotego Kogucika, który pieje, gdy zbliża się niebezpieczeństwo. Kiedy jednak rzeczywiście wybucha wojna, a kogucik zaczyna piać, car zostaje zmuszony do osobistego wyruszenia na wyprawę. W Paryżu opera odniosła sensacyjny sukces."
 elgar.1323.g: "Kukuryku!"
 elgar.1331.f: "„Scena ze stepów Azji Środkowej” to poemat symfoniczny skomponowany przez Aleksandra Borodina z okazji 25. rocznicy panowania cara Aleksandra II. Car ten zaanektował Turkiestan, region w Azji Środkowej, i włączył go do Imperium Rosyjskiego. Do dziś utwór ten uznawany jest za jeden z najsłynniejszych przykładów muzyki programowej. Sam Borodin tak go opisuje:\n„Na monotonnych stepach Azji Środkowej rozbrzmiewają nieznane dotąd dźwięki spokojnej rosyjskiej pieśni. Z oddali słychać tętent koni i wielbłądów oraz osobliwe brzmienie orientalnej melodii. Zbliża się karawana miejscowych. Pod osłoną rosyjskiej broni przemierza bezpiecznie i beztrosko długą drogę przez bezkresną pustynię. Oddala się coraz bardziej. Rosyjska pieśń i melodia Azjatów łączą się we wspólną harmonię, której echo stopniowo rozpływa się w stepowym powietrzu”."
 elgar.1332.d: "Najnowsza opera maestro Borodina jest już uznawana za dzieło jego życia."
 elgar.1332.f: "Z wykształcenia i zawodu lekarz oraz chemik, Borodin wniósł istotny wkład w rozwój wczesnej chemii organicznej. Choć obecnie jest bardziej znany jako kompozytor, sam uważał medycynę i naukę za swoje główne zajęcia, poświęcając muzyce i komponowaniu jedynie wolny czas lub okresy choroby. Nic więc dziwnego, że Borodin zmarł, zanim zdołał ukończyć „Kniazia Igora”. Kompozytor oparł libretto na staroruskim eposie „Słowo o wyprawie Igora”, opisującym wyprawę księcia ruskiego Igora Światosławicza przeciwko najeżdżającym plemionom Kumanów (Połowców) w 1185 roku. Wykorzystał również materiały zaczerpnięte z dwóch średniowiecznych kronik kijowskich. Opera pozostała niedokończona w chwili śmierci kompozytora w 1887 roku, a następnie została zredagowana i ukończona przez Nikołaja Rimskiego-Korsakowa i Aleksandra Głazunowa."
 elgar.1332.g: "Tańczcie, plemiona połowieckie!"
 elgar.1333.f: "Borodin poświęcił łącznie siedem lat pracy nad swoją Drugą Symfonią. Wiele jej motywów melodycznych przypomina zarówno „Kniazia Igora”, jak i „Mładę” — dwa dzieła sceniczne, które na przestrzeni sześciu lat komponowania wielokrotnie odciągały uwagę Borodina od pracy nad symfonią. Jak to często bywało, kolejną przyczyną opóźnień była jego codzienna praca chemika. Rimski-Korsakow wspomina:\n„Odwiedzając go, rzadko zastawałem go przy pracy w laboratorium przylegającym do jego mieszkania. Kiedy siedział nad retortami wypełnionymi jakimś bezbarwnym gazem i destylował go, przepuszczając rurką z jednego naczynia do drugiego, zwykłem mówić mu, że «przelewa pustkę w próżnię». Po skończeniu pracy szedł ze mną do swojego mieszkania, gdzie rozpoczynał muzyczne działania lub rozmowy, w trakcie których nagle zrywał się, biegł z powrotem do laboratorium, by sprawdzić, czy coś się nie wypaliło lub nie wykipiało. W międzyczasie wypełniał korytarz niewiarygodnymi sekwencjami następujących po sobie non i septym”."
 elgar.1341.f: "„Noc na Łysej Górze” to poemat symfoniczny i jedyne większe dzieło orkiestrowe Modesta Musorgskiego. W aranżacji Nikołaja Rimskiego-Korsakowa utwór ten uznawany jest za jeden z najbardziej znanych przykładów rosyjskiej muzyki programowej XIX wieku. Musorgski przedstawia taniec czarownic w wigilię św. Jana (z 23 na 24 czerwca) na Łysej Górze (Lyssaya Gora), miejscu wywodzącym się ze słowiańskiej mitologii."
 elgar.1342.f: "„Obrazki z wystawy” to suita fortepianowa Modesta Musorgskiego, uznawana za wybitny przykład muzyki programowej. Poszczególne części przedstawiają obrazy i rysunki jego przyjaciela Wiktora Hartmanna, który zmarł rok wcześniej. Musorgski zobaczył je na wystawie poświęconej pamięci artysty. Utwór powstał z inicjatywy wspólnego przyjaciela obu twórców, krytyka sztuki Władimira Stasowa. Brał on również udział w nadawaniu tytułów poszczególnym częściom, a cały cykl został mu zadedykowany. Bogactwo barw dźwiękowych już wcześnie zainspirowało innych kompozytorów do opracowania utworu na orkiestrę i inne zespoły instrumentalne. Najbardziej znana jest aranżacja Maurice'a Ravela."
 elgar.1343.d: "Modest Musorgski, najbardziej śmiały członek Potężnej Gromadki, wywarł trwałe wrażenie swoją operą „Borys Godunow”. Jedni uwielbiają to dzieło, inni go nienawidzą. Świat muzyki jest jednak zgodny, że jest to jego najważniejsze arcydzieło."
 elgar.1343.f: "„Jednocześnie uwielbiam i nie znoszę Borysa Godunowa. Uwielbiam go za oryginalność, siłę wyrazu, śmiałość, wyjątkowość i piękno; nie znoszę za brak dopracowania, surowość harmonii i, w niektórych miejscach, zwykłą niezręczność muzyki”. – Nikołaj Rimski-Korsakow"
 elgar.1351.d: "Najnowsze dzieło duetu Gilbert i Sullivan podbija świat anglojęzyczny po obu stronach Atlantyku. „Mikado” przejdzie do historii jako jedna z najbardziej udanych oper komicznych!"
 elgar.1351.f: "Opera savoyowska była gatunkiem opery komicznej, który rozwinął się w wiktoriańskiej Anglii pod koniec XIX wieku. Jej pierwszymi i najbardziej cenionymi przedstawicielami byli W. S. Gilbert i Arthur Sullivan. Nazwa pochodzi od Teatru Savoy, który impresario Richard D'Oyly Carte wybudował specjalnie po to, by wystawiać dzieła Gilberta i Sullivana, a później również utwory innych duetów kompozytorsko-librecistycznych. Gilbert, autor librett do tych oper, tworzył fantastyczne, wywrócone do góry nogami światy, w których każdy absurd doprowadzany jest do logicznego końca. Sullivan, młodszy od Gilberta o sześć lat, komponował muzykę, tworząc zapadające w pamięć melodie, które potrafiły wyrażać zarówno humor, jak i wzruszenie. Gilbert i Sullivan wprowadzili innowacje w zakresie treści i formy, które bezpośrednio wpłynęły na rozwój teatru muzycznego w XX wieku. Największym sukcesem oper savoyowskich był „Mikado”, który wyśmiewał angielską biurokrację, ukrytą pod cienką warstwą japońskiej scenerii. Fabuła koncentruje się na postaci Ko-Ko, zwykłego krawca, który zostaje awansowany na stanowisko Lorda Wielkiego Kata w miasteczku Titipu."
 elgar.1351.g: "Mam taką małą listę — mam taką małą listę!"
 elgar.1352.f: "„H.M.S. Pinafore” to opera komiczna w dwóch aktach, z muzyką Arthura Sullivana i librettem W. S. Gilberta. Dzięki 571 kolejnym przedstawieniom opera ustanowiła rekord drugiego najdłuższego okresu nieprzerwanego wystawiania spośród wszystkich ówczesnych produkcji teatru muzycznego. Operetka w humorystyczny sposób przedstawia miłość między osobami z różnych klas społecznych, satyrycznie ukazując tym samym brytyjski system klasowy. Ponadto „Pinafore” wyśmiewa patriotyzm, politykę partyjną, Królewską Marynarkę Wojenną oraz awans niekompetentnych osób na odpowiedzialne stanowiska. W 1911 roku Henry L. Mencken napisał: „Żadna inna opera komiczna, jaka kiedykolwiek powstała — a właściwie żadne inne dzieło sceniczne jakiegokolwiek rodzaju — nie zdobyło takiej popularności”."
 elgar.1352.g: "Gdy byłem chłopcem..."
 elgar.1353.f: "Jestem wręcz wzorem nowoczesnego generała-majora,\nMam wiedzę o roślinach, zwierzętach i minerałach,\nZnam królów Anglii i przytaczam historyczne bitwy\nOd Maratonu po Waterloo, w porządku kategorycznym;\nDoskonale znam się także na zagadnieniach matematycznych,\nRozumiem równania, zarówno proste, jak i kwadratowe,\nO twierdzeniu dwumianowym wiem naprawdę mnóstwo,\nI znam wiele ciekawostek o kwadracie przeciwprostokątnej.\n\nJestem biegły w rachunku całkowym i różniczkowym;\nZnam naukowe nazwy istot mikroskopijnych:\nKrótko mówiąc, w sprawach roślin, zwierząt i minerałów,\nJestem wręcz wzorem nowoczesnego generała-majora."
 elgar.1353.g: "Ten człowiek mógłby być postacią w Morgenröte."
 elgar.1361.f: "Bedřich Smetana był czeskim kompozytorem, który zapoczątkował rozwój stylu muzycznego ściśle związanego z dążeniami swojego narodu do odrodzenia kulturalnego i politycznego. W swojej ojczyźnie uznawany jest za ojca czeskiej muzyki. Na arenie międzynarodowej znany jest przede wszystkim z opery „Sprzedana narzeczona” z 1866 roku oraz cyklu symfonicznego „Má vlast” („Moja ojczyzna”), przedstawiającego historię, legendy i krajobrazy rodzinnych Czech. W jego skład wchodzi słynny poemat symfoniczny „Vltava”, znany również pod niemiecką nazwą „Die Moldau” (po angielsku „The Moldau”), przedstawiający rzekę przepływającą przez Pragę i uchodzącą do Łaby."
 elgar.1362.f: "„Sprzedana narzeczona” to opera w trzech aktach Bedřicha Smetany, z librettem Karela Sabiny. Technicznie wymagająca uwertura stanowi dynamiczne wprowadzenie do fabuły, której akcja rozgrywa się w XIX-wiecznej czeskiej wiosce. Opera początkowo odniosła jedynie umiarkowany sukces, lecz z czasem zdobyła światową popularność i jest uznawana za kamień milowy czeskiej kultury muzycznej. Smetana w swojej kompozycji szeroko wykorzystywał tradycyjne czeskie formy taneczne, takie jak polka i furiant, a choć w dużej mierze unikał bezpośredniego cytowania pieśni ludowych"
 elgar.1363.f: "Kwartet smyczkowy nr 1 („Z mojego życia”) e-moll to czteroczęściowy utwór kameralny Bedřicha Smetany. Smetana opisywał pierwszą część jako romantyczny szkic swojej młodości i początków kariery artystycznej. Pisał również o przeczuciu przyszłości oraz tęsknocie za czymś nieuchwytnym, czego nie sposób określić. Drugą część opisywał jako polkę o patriotycznym zabarwieniu. Przedstawia ona jego młodość i zamiłowanie do tańca, które towarzyszyło mu już od szóstego roku życia. Trzecia część została skomponowana ku czci jego pierwszej żony, którą Smetana określał mianem swojej „pierwszej miłości”. Ostatnia część przedstawia utratę słuchu przez Smetanę i pogarszający się stan jego zdrowia. Zawiera ona długo wybrzmiewający dźwięk e, naśladujący dzwonienie w jego uszach."
 elgar.1371.f: "„Wiosna w Appalachach” to partytura baletowa Aarona Coplanda, szczególnie znana w wersji suity orkiestrowej. Copland napisał balet przeznaczony na trzynastoosobową orkiestrę kameralną na zamówienie choreografki i tancerki Marthy Graham. Początkowo kompozytor nie nadał dziełu tytułu i określał je po prostu jako „Balet dla Marthy”. Miał wątpliwości, czy komponowanie muzyki baletowej ma sens i czy partytury przetrwają próbę czasu. Z perspektywy czasu okazało się, że utwór stał się jednym z najpopularniejszych dzieł kompozytora. Copland otrzymał za niego Nagrodę Pulitzera w dziedzinie muzyki."
 elgar.1372.f: "Po sukcesie swojego dzieła „El Salón México” Aaron Copland otrzymał od impresaria baletowego Lincolna Kirsteina zamówienie na skomponowanie muzyki do baletu opartego na legendzie o Billym the Kidzie. Po premierze wersji na dwa fortepiany w wykonaniu zespołu Ballet Caravan, w maju 1939 roku ukończono pełną partyturę orkiestrową. Balet odniósł wielki sukces: „Dopiero po Billym, gdy miałem już prawie czterdzieści lat, moja matka w końcu przyznała, że pieniądze wydane na moje lekcje gry na fortepianie nie poszły na marne”."
 elgar.1373.f: "„Rodeo” to balet skomponowany przez Aarona Coplanda, z choreografią Agnes de Mille. Choć Copland początkowo niechętnie podchodził do komponowania „kolejnego baletu kowbojskiego”, de Mille przekonała go, że to przedstawienie będzie znacząco różnić się od jego wcześniejszych dzieł. Okoliczności powstania „Rodeo” sprawiły, że utwór posiada szereg cech odróżniających go od pozostałych kompozycji Coplanda. Chociaż wiele jego dzieł zawiera tradycyjne amerykańskie melodie ludowe, „Rodeo” wyróżnia się tym, że pozostawia je w partyturze niemal w niezmienionej postaci, z bardzo niewielkimi ingerencjami kompozytora. Ostatnia część, „Hoe Down”, jest bez wątpienia jednym z klasycznych dzieł amerykańskiej muzyki symfonicznej, a jej charakterystyczne brzmienie stało się znakiem rozpoznawczym kompozytora."
 elgar.1381.f: "W 1924 roku Gershwin rozpoczął komponowanie „Błękitnej rapsodii” na dwa fortepiany. Ferde Grofé zamieszkał z nim na czas powstawania utworu i na podstawie wersji fortepianowej przygotował partyturę dla jazzowej orkiestry Whitemana. Koncert orkiestry Paula Whitemana w nowojorskiej Aeolian Hall był historycznym wydarzeniem o ogromnym znaczeniu, podczas którego odbyła się premiera kompozycji Gershwina. Koncert reklamowano pod hasłem „Eksperyment z muzyką współczesną”. Sam Gershwin zasiadł przy fortepianie podczas światowej premiery. Utwór szybko stał się jego najsłynniejszą kompozycją. Zarówno wówczas, jak i obecnie dzieło to postrzegane jest jako odpowiedź na pytanie, co definiuje muzykę amerykańską: synteza muzyki klasycznej i jazzu."
 elgar.1382.f: "„Porgy and Bess” to opera w trzech aktach George’a Gershwina, której premiera odbyła się w 1935 roku. Libretto napisał DuBose Heyward, a teksty pieśni stworzyli DuBose Heyward i brat kompozytora, Ira Gershwin. Opera przedstawia życie Afroamerykanów w zamieszkanej przez czarnoskórą ludność dzielnicy Catfish Row w Charleston w Karolinie Południowej, około 1870 roku. Ponieważ w tamtym czasie było niewielu wykształconych czarnoskórych śpiewaków operowych, zaangażowano również artystów występujących w teatrach i klubach nocnych. Krytycy zarzucali dziełu, że jest hybrydą opery i musicalu. Po 124 przedstawieniach zdjęto je z afisza, a produkcja przyniosła straty. Poszczególne utwory muzyczne szybko zdobyły jednak tak dużą popularność, że w 1936 roku Gershwin zestawił je w suitę, aby zwiększyć zainteresowanie operą. Ta próba również początkowo nie przyniosła powodzenia. Dzieło odniosło światowy sukces dopiero po śmierci Gershwina."
 elgar.1383.f: "„Amerykanin w Paryżu” to jedno z najpopularniejszych dzieł Gershwina. Podobnie jak „Błękitna rapsodia”, jest to rapsodia lub poemat dźwiękowy o swobodnej formie, w którym Gershwin przedstawia za pomocą muzyki swoje wrażenia z pobytu w Paryżu. Sam kompozytor opatrzył utwór podtytułem „Poemat dźwiękowy na orkiestrę”. Dzieło powstało na zamówienie Filharmonii Nowojorskiej. Zostało skomponowane na standardową orkiestrę symfoniczną, wzbogaconą o szereg instrumentów efektowych, takich jak klaksony paryskich taksówek, które Gershwin specjalnie przywiózł z Francji na potrzeby tego utworu. Jednak orkiestracja słyszana obecnie różni się pod wieloma względami od oryginalnego rękopisu Gershwina."
 elgar.1391.f: "I. Sosny w Villa Borghese. Dzieci bawią się wśród sosen w Villa Borghese. Tańczą w kółko, odgrywają marsze wojskowe i bitwy, radując się własnymi okrzykami niczym jaskółki o zmierzchu, po czym rozbiegają się. Niespodziewanie sceneria się zmienia …\n\nII. Sosny przy katakumbach. W cieniu sosen otaczających wejście do katakumb rozbrzmiewa dobiegająca z ich głębi tęskna pieśń. Wznosi się ona do podniosłego hymnu, po czym ponownie cichnie.\n\nIII. Sosny na Janikulum. Powietrze przeszywa drżenie: w pogodną noc przy pełni księżyca wierzchołki sosen na Janikulum łagodnie kołyszą się na wietrze. W gałęziach śpiewa słowik.\n\nIV. Sosny przy Via Appia. Poranna mgła spowija Via Appia: samotne sosny stoją na straży w tragicznym krajobrazie rzymskiej Kampanii. Niewyraźnie, lecz raz po raz zdaje się dobiegać rytm niezliczonych kroków. Oczami wyobraźni poeta widzi odradzającą się dawną chwałę: przy dźwiękach buccyn nadciąga konsul ze swoją armią, by w blasku wschodzącego słońca przemaszerować Via Sacra i w triumfie wkroczyć na Kapitol."
 elgar.1392.f: "„W tym poemacie symfonicznym kompozytor pragnął wyrazić uczucia i wizje, które zrodziły się w nim pod wpływem widoku czterech rzymskich fontann, każdej przedstawionej o takiej porze dnia, gdy jej charakter najlepiej współgra z otoczeniem lub gdy jej piękno wywiera największe wrażenie na obserwatorze. Pierwsza część poematu czerpie inspirację z fontanny w Valle Giulia i przedstawia scenę pasterską. (...) Nagły, głośny i długotrwały dźwięk rogów, rozbrzmiewający ponad drżącą orkiestrą, otwiera drugą część – Fontannę Trytona. (...) Nad falującymi dźwiękami orkiestry rozbrzmiewa podniosły temat: Fontanna di Trevi w południe. Podniosły temat przechodzi od instrumentów dętych drewnianych do blaszanych, nabierając triumfalnego charakteru. (...). Czwarta część, Fontanna w Villa Medici o zmierzchu, rozpoczyna się melancholijnym tematem, który wznosi się niczym ponad łagodnym pluskiem wody. To melancholijna pora zachodu słońca. Powietrze wypełniają dźwięki dzwonów, śpiew ptaków i szelest liści. Następnie wszystko to łagodnie rozpływa się w ciszy nocy”."
 elgar.1393.f: "„Antiche danze ed arie per liuto” (wł. „Dawne tańce i arie na lutnię”) to tytuł cyklu suit orkiestrowych włoskiego kompozytora Ottorina Respighiego. W tym neoklasycznym dziele kompozytor sięga po transkrypcje szesnasto- i siedemnastowiecznych tabulatur lutniowych i gitarowych, opracowanych przez włoskiego muzykologa Oscara Chilesottiego, i aranżuje je na współczesne instrumenty. Podtytuł utworu brzmi „Trascrizione libera per orchestra” (swobodna transkrypcja na orkiestrę)."
 elgar.1401.f: "Podobnie jak libretta wcześniejszych oper Pucciniego, „La Bohème” i „Tosca”, libretto do „Madama Butterfly” zostało napisane przez Giuseppe Giacosę i Luigiego Illicę. Tekst opiera się na opowiadaniu „Madame Butterfly” Johna Luthera Longa oraz na jednoaktowej tragedii „Madame Butterfly: A Tragedy of Japan” Davida Belasca, będącej jego adaptacją. Aby stworzyć operę, Puccini przeprowadził niezwykle drobiazgowe i wyczerpujące badania nad różnorodnymi elementami kultury orientalnej, które uznał za niezbędne do uwzględnienia w dziele. Szczególną pomoc okazała mu znana japońska aktorka Sada Yacco oraz żona japońskiego ambasadora, z którymi rozmawiał we Włoszech i które opowiedziały mu o zwyczajach i tradycjach mieszkańców Wschodu."
 elgar.1402.f: "„Turandot” to opera w trzech aktach i pięciu scenach, z librettem Giuseppe Adamiego i Renata Simoniego. Giacomo Puccini nie zdołał jej ukończyć, dlatego po jego śmierci dzieło dokończył Franco Alfano, a później powstało jeszcze kilka innych wersji opery. Turandot jest księżniczką z opowieści pochodzącej ze zbioru orientalnych baśni „Księga tysiąca i jednej nocy”, która każe ścinać głowę każdemu zalotnikowi, niepotrafiącemu rozwiązać jej zagadek. Innym, znacznie starszym źródłem tej historii jest dzieło perskiego poety Nezamiego „Siedem piękności”, w którym Turandot jest rosyjską księżniczką. Aby oddać w muzyce klimat Dalekiego Wschodu, Puccini zasięgnął rady swojego przyjaciela, barona Fassini, który posiadał rozległą wiedzę na temat chińskiej kultury. Później pożyczył od niego również pozytywkę wygrywającą chińską melodię. Puccini wielokrotnie cytuje ją w operze."
 elgar.1403.f: "„La Bohème” to opera w czterech aktach Giacoma Pucciniego, z librettem Giuseppe Giacosy i Luigiego Illici, inspirowana powieścią Henriego Murgera „Sceny z życia cyganerii”. Pomimo nieprzychylnych recenzji po premierze „La Bohème” odniosła światowy sukces. Należy do stałego repertuaru wielu teatrów operowych i jest jedną z najczęściej wystawianych oper na świecie. „La Bohème” jest ściśle związana z nurtem weryzmu: przedstawia życie, cierpienia i miłości zwykłych ludzi. Jest czwartą z dziesięciu oper Pucciniego i przez wielu uważana jest za jego arcydzieło."
 elgar.1411.f: "„«Koanga» jest jednym z tych wyjątkowych dzieł, które przyciągają uwagę w twórczości Deliusa, ale jednocześnie wyraźnie odróżniają się od pozostałej części jego dorobku. Zazwyczaj po ukończeniu utworu zainteresowanie Deliusa nim słabło. Odżywało jednak i na krótko powracało za każdym razem, gdy ponownie go słyszał. W przypadku «Koangi» wykazywał jednak szczególne przywiązanie, jak gdyby łączyła go z tym dziełem jakaś tajemna więź, spajająca go z młodością spędzoną na Florydzie. Był to jedyny utwór, którego w podeszłym wieku żałował, że prawdopodobnie nigdy więcej nie będzie miał okazji usłyszeć. I tak też się stało. Partyturę przenika mroczny majestat, który, choć zdradza tęsknotę za Wagnerem, przywodzi na myśl tragiczny rozmach Verdiego. Elementy czasu, miejsca i fabuły pozwoliły mu wykorzystać bogatszą gamę faktur i nastrojów niż w pozostałych jego operach”. – Eric Fenby"
 elgar.1412.f: "Sir Thomas Beecham, najwybitniejszy brytyjski orędownik twórczości Deliusa, określił „Słysząc pierwszą kukułkę wiosną” jako „zdecydowanie najbardziej znane spośród wszystkich dzieł naszego kompozytora”. Wraz z „Letnią nocą nad rzeką” utwór ten tworzy cykl „Dwa utwory na małą orkiestrę” Deliusa. Oba dzieła wykonano po raz pierwszy w Lipsku 23 października 1913 roku pod batutą Arthura Nikischa. Główny temat, oznaczony wskazówką „Z lekkim, płynnym ruchem”, stanowi wymianę nawoływań kukułek. Drugi temat powierzono pierwszym skrzypcom i zaczerpnięto z norweskiej pieśni ludowej „W dolinie Ola”, na którą zwrócił uwagę Deliusa kompozytor i aranżer muzyki ludowej Percy Grainger. Temat ten został wcześniej wykorzystany przez Edvarda Griega."
 elgar.1413.f: "„Romeo i Julia z wiejskiej wioski” to opera Fredericka Deliusa, czwarta z jego sześciu oper. Kompozytor wraz ze swoją żoną Jelką napisał libretto w języku angielskim, oparte na opowiadaniu „Romeo und Julia auf dem Dorfe” szwajcarskiego pisarza Gottfrieda Kellera. Choć opera jest rzadko wystawiana, orkiestrowe interludium między scenami 5 i 6, „Droga do Rajskiego Ogrodu”, wykonywane jest osobno podczas koncertów i doczekało się wielu nagrań."
 elgar.1421.f: "„Miłość czarodziejska” to tytuł jednoaktowego baletu z partiami wokalnymi Manuela de Falli, skomponowanego w 1915 roku. Libretto napisała María de la O Lejárraga García, a oryginalną choreografię stworzyła Pastora Imperio. Ze względu na ogromną popularność dzieła powstało kilka jego wersji i adaptacji. Akcja rozgrywa się w Andaluzji, wśród hiszpańskich Romów, ich obrzędów i muzyki. Premiera nie odniosła sukcesu; dopiero po dokonaniu przeróbek dzieło spotkało się z większym uznaniem publiczności. Obecnie balet, wraz ze swoim „Rytualnym Tańcem Ognia”, uznawany jest za jedno z najsłynniejszych dzieł hiszpańskiego kompozytora."
 elgar.1422.f: "Opera „La vida breve” („Krótkie życie”) to dramat liryczny w dwóch aktach i czterech scenach Manuela de Falli, oparty na libretcie Carlosa Fernándeza-Shawa. Światowa premiera odbyła się w 1913 roku w Casino Municipal w Nicei, w języku francuskim. W swojej operze, na którą wpływ miały weryzm i impresjonizm, de Falla wykorzystuje wiele elementów hiszpańskiego folkloru, takich jak cante jondo z rytmicznymi ostinatami, a także inne formy flamenco. Opera została skomponowana już w latach 1904–1905. Wówczas 28-letni de Falla stworzył ją w odpowiedzi na konkurs oper jednoaktowych ogłoszony przez Akademię Sztuk Pięknych w Madrycie. W 1905 roku de Falla zdobył pierwszą nagrodę."
 elgar.1423.f: "„Trójgraniasty kapelusz” (hiszp. „El sombrero de tres picos”) to balet Manuela de Falli. Choreografię stworzył Léonide Massine. Fabułę opracował Gregorio Martínez Sierra na podstawie noweli Pedra Antonia de Alarcóna o tym samym tytule. Dzieło zostało skomponowane przez de Fallę w drugim ważnym okresie jego twórczości, trwającym od 1914 do 1920 roku, i wykazuje silne wpływy hiszpańskich tradycji ludowych. Oprócz hiszpańskiej scenerii balet wykorzystuje również techniki hiszpańskiego tańca zamiast klasycznego baletu."
 elgar.1431.f: "„Danse macabre” („Taniec śmierci”) to poemat symfoniczny na orkiestrę. Powstał w 1872 roku jako pieśń artystyczna na głos i fortepian, z francuskim tekstem poety Henriego Cazalisa. Dwa lata po opublikowaniu wersji pieśniowej „Danse macabre” Saint-Saëns postanowił dokonać jej transkrypcji na orkiestrę z partią solowych skrzypiec. Początkowe reakcje na wersję orkiestrową były mieszane: dla jednych utwór wydawał się zbyt ekstrawagancki, dla innych zbyt powściągliwy. Doceniono jednak pomysłową instrumentację, obejmującą między innymi wykorzystanie ksylofonu."
 elgar.1432.f: "III Symfonia c-moll, znana również jako „Symfonia Organowa”, to utwór na orkiestrę i organy francuskiego kompozytora Camille’a Saint-Saënsa. Powstała na zamówienie Królewskiego Towarzystwa Filharmonicznego w Londynie i została zadedykowana Franzowi Lisztowi. Swoją III Symfonią Saint-Saëns stworzył jedno z pierwszych francuskich dzieł przeznaczonych na orkiestrę i organy. Sam kompozytor napisał o symfonii: „Dałem tu z siebie wszystko, co mogłem dać... Nigdy więcej nie napiszę dzieła podobnego do tego”."
 elgar.1433.f: "„Samson i Dalila” to opera w trzech aktach Camille’a Saint-Saënsa, z librettem Ferdinanda Lemaire’a. Fabuła opiera się na biblijnej Księdze Sędziów, a jej akcja rozgrywa się między 1100 a 1000 rokiem p.n.e. „Samson i Dalila” to jedyna spośród 13 oper Saint-Saënsa, która odniosła trwały sukces sceniczny. Mimo udanej premiery w języku niemieckim, pod batutą Eduarda Lassena i pod kierownictwem artystycznym Franza Liszta, w Weimarskim Teatrze Dworskim w grudniu 1877 roku, opera została wystawiona we Francji dopiero w 1890 roku. Saint-Saëns kontynuował poprawianie dzieła nawet po premierze, dodając kolejne fragmenty. Szczególną sławę zdobyły dwie arie Dalili: „Printemps qui commence” („Nadchodzi wiosna”) oraz „Mon cœur s'ouvre à ta voix” („Moje serce otwiera się na twój głos”), z których ta druga jest jednym z najpopularniejszych utworów w repertuarze mezzosopranowym i kontraltowym, często wykonywanym podczas recitali."
 elgar.1441.f: "„Finlandia” to poemat symfoniczny Jeana Sibeliusa. Utwór jest ściśle związany z „przebudzeniem” narodu fińskiego pod panowaniem rosyjskim oraz oporem wobec rosyjskich represji, szczególnie tych wymierzonych w prasę. W tym kontekście organizowano tak zwane „uroczystości prasowe”, których celem było wspieranie funduszu emerytalnego dziennikarzy. Podczas tych wydarzeń często wystawiano przedstawienia teatralne niosące przesłanie narodowe. Sibelius skomponował sześcioczęściową suitę jako muzykę towarzyszącą jednemu z takich widowisk, zatytułowanemu „Żywe obrazy z historii i mitologii Finlandii”. Ostatnia część była pierwszą wersją poematu symfonicznego „Finlandia”, która odniosła ogromny sukces. W ten sposób „Finlandia” szybko stała się częścią fińskiej świadomości narodowej. Poemat symfoniczny uznano za „tajny hymn narodowy” Finlandii i zyskał on tak wielką popularność, że rosyjskie władze zakazały jego wykonywania."
 elgar.1442.f: "Koncert skrzypcowy Sibeliusa powstał we wczesnym okresie jego twórczości symfonicznej, między Drugą a Trzecią Symfonią. Swoją nieprzemijającą atrakcyjność i popularność zawdzięcza połączeniu późnoromantycznego stylu z nowoczesną skandynawską estetyką brzmieniową. Obok koncertów skrzypcowych Prokofiewa, Szostakowicza, Berga, Bartóka i Brittena zalicza się do najważniejszych koncertów skrzypcowych XX wieku. Sibelius skomponował pierwszą wersję koncertu w 1903 roku na sugestię skrzypka Willy’ego Burmestera. Utwór był przeznaczony dla niego, a jego światowa premiera miała odbyć się w Berlinie. Jednak ze względów finansowych Sibelius przeniósł premierę do Helsinek, co uniemożliwiło Burmesterowi występ podczas tego wydarzenia z powodu innych zobowiązań. Premiera odbyła się więc 8 lutego 1904 roku w Helsinkach, z Viktorem Nováčkiem jako solistą i kompozytorem za pulpitem dyrygenckim. Między innymi z powodu niewystarczających umiejętności technicznych solisty koncert okazał się porażką zarówno w oczach publiczności, jak i krytyków."
 elgar.1443.f: "Ta niezwykle popularna symfonia od zawsze była w Finlandii kojarzona z walką kraju o niepodległość od Rosji, szczególnie ze względu na jej monumentalny finał. Niekiedy określano ją mianem „Symfonii Niepodległości”, zwłaszcza w okresie, gdy język i kultura fińska były tłumione w ówczesnej Finlandii okupowanej przez Rosję. Postawa Sibeliusa w tej kwestii często budziła kontrowersje. Niektórzy twierdzą, że komponując to dzieło, Sibelius wcale nie kierował się takimi patriotycznymi ambicjami, a związek symfonii z tymi dążeniami przypisano jej dopiero później."
 elgar.1451.f: "Vaughan Williams nie zdobył szerokiego uznania na początku swojej kariery kompozytorskiej, jednak do 1910 roku, mając niespełna czterdzieści lat, zaczynał już zyskiwać rozgłos. Skomponował wówczas dzieło, które jego biograf James Day określił jako „bez wątpienia pierwszy utwór Vaughana Williamsa, w którym można rozpoznać jego własny, niepowtarzalny styl, niepodobny do stylu żadnego innego kompozytora”. Kompozycja opiera się na melodii XVI-wiecznego angielskiego kompozytora Thomasa Tallisa, na którą Vaughan Williams natrafił podczas redagowania „English Hymnal”, śpiewnika opublikowanego w 1906 roku. Wcześniej Vaughan Williams czerpał najważniejsze inspiracje z muzyki francuskiej, aby następnie stworzyć angielski styl muzyczny, który miał zerwać przede wszystkim z „wpływami teutońskimi” Richarda Wagnera."
 elgar.1452.f: "„Symfonia londyńska” to druga symfonia Ralpha Vaughana Williamsa. Często oficjalnie określa się ją mianem „II Symfonii”, choć sam kompozytor nigdy tak jej nie nazywał. Vaughan Williams stwierdził kiedyś, że tytuł sugeruje pewien stopień muzyki programowej, zwłaszcza że w utworze pojawiają się dźwięki rzeczywiście obecne w Londynie, takie jak słynny kurant zegarowy z Westminsteru. Mimo to symfonię należy uznać za muzykę absolutną. W wypowiedzi programowej z 1920 roku Vaughan Williams zauważył, że właściwsze byłoby określenie „Symfonia londyńczyka”. Dzieło zostało zadedykowane przyjacielowi Vaughana Williamsa, George'owi Butterworthowi, który również był kompozytorem i zginął od kuli snajpera nad Sommą podczas I wojny światowej. To właśnie Butterworth jako pierwszy zachęcał Vaughana Williamsa do napisania bogato zinstrumentowanej symfonii."
 elgar.1453.f: "„Romans Vaughana Williamsa, nazwany «Wzlatujący skowronek» ze względu na nawiązanie do poematu Mereditha, wyróżniał się na tle pozostałych utworów jako jedyne dzieło w programie, które z pogodnym spokojem ignorowało zarówno dzisiejsze, jak i wczorajsze mody. Muzyka snuje się niczym sen, «w wielu ogniwach, nieprzerwanie», i choć nigdy nie osiąga energii zawartej w wersach\n«Jest tańcem dzieci, wdzięcznością\nSiewców, wśród brzegów pierwiosnków»\nto muzyka wiejskiej prostoty, a nie wyrafinowanej sali koncertowej”. – „The Times”"
 elgar.1461.f: "„Tako rzecze Zaratustra” to poemat symfoniczny Richarda Straussa, luźno oparty na dziele filozoficznym Friedricha Nietzschego o tym samym tytule. W 1895 roku Richard Strauss zainteresował się krytyką niemieckiego „filisterstwa” i kołtuństwa przedstawioną przez Nietzschego. Jak sam przyznawał, był również równie niechętny chrześcijaństwu. Być może język Nietzschego stanowił dla Straussa także bezpośrednie wyzwanie muzyczne: warto zauważyć, że cztery części „Tako rzecze Zaratustra” Nietzschego odpowiadają częściom symfonii. Poemat symfoniczny rozpoczyna się od decyzji Zaratustry, który przed wschodem słońca postanawia zejść do ludzi. Tremolo kontrabasów, wraz z punktem pedałowym w partii pedału organów i kontrafagotu na dźwięku podstawowym C, tworzą tło dla wschodu słońca przedstawionego za pomocą „motywu natury”. To słynne otwarcie trafiło później do kultury popularnej."
 elgar.1462.f: "„Salome” to jednoaktowa opera Richarda Straussa. Opiera się na sztuce Oscara Wilde’a o tym samym tytule i jest uznawana za jedną z pierwszych oper literackich. Muzyka „Salome” ma formę przekomponowaną i opiera się na motywach przewodnich, nawiązując tym samym do tradycji Wagnera, który zastąpił libretta oparte na wierszowanej formie oraz klasyczną strukturę okresową. Jednocześnie Richard Strauss dokonał w „Salome” rewolucyjnego odejścia zarówno od Wagnerowskiego dążenia do eufonii, jak i od jego romantycznego światopoglądu. Pojawiające się postacie są, jak ujął to sam Strauss, „wszystkie ludźmi perwersyjnymi, a według mojego gustu najbardziej perwersyjnym z całego towarzystwa jest — Jochanaan”. Pozostali zaś — jak w drodze wyjątku Narraboth — są beznadziejnie naiwni. Muzyka jest odpowiednio dzika: skala dysonansów, potęga brzmienia orkiestry i czysta kakofonia muzyczna w „Salome” nie miały wcześniej sobie równych. Dlatego dzieło to uznawane jest za pierwowzór opery nowoczesnej."
 elgar.1463.f: "„Symfonia Alpejska” opiera się na koncepcji Richarda Straussa, polegającej na przedstawieniu za pomocą muzyki wspinaczki na alpejski szczyt i powrotu do doliny w ciągu jednego dnia. Utwór jest typowym przykładem muzyki programowej. Pomysł na jego program wywodzi się z przeżycia z młodości Straussa. Latem 1879 roku zabłądził on na górze Heimgarten w Przedalpach Bawarskich i zaskoczyła go burza. Następnego dnia przedstawił to wydarzenie przy fortepianie. Na podstawie tego wspomnienia rozwinął koncepcję utworu. Wyraźnym zamiarem kompozytora było umożliwienie słuchaczowi bezpośredniego, zmysłowego przeżycia kolejnych etapów górskiej wędrówki poprzez muzyczny obraz dźwiękowy. Zdaniem wielu krytyków muzycznych dzieło realizuje ten cel w imponujący sposób."
 elgar.1471.f: "W 1930 roku Fernández skomponował trzyczęściową suitę „Reisado do Pastoreio” („Pastoralne Objawienie”). Premiera tej symfonicznej suity odbyła się w Rio de Janeiro pod batutą ówczesnego nestora muzyki brazylijskiej, Francisca Bragi. Trzecia i ostatnia część, „Batuque” (taniec), jest często wykonywana jako samodzielny utwór i znalazła się w repertuarze tak cenionych dyrygentów, jak Toscanini, Koussevitzky, Bernstein i Chávez. Jej taneczny charakter, afro-brazylijski klimat i hipnotyzująca intensywność rytmiczna, w połączeniu z niezwykłą zwięzłością melodyczną, składają się na sukces tego finału."
 elgar.1472.f: "„Światowa premiera opery «Malazarte» brazylijskiego kompozytora Oscara Lorenza Fernándeza była najciekawszym wydarzeniem tegorocznego sezonu operowego. Dzieło wystawiono 30 września w Teatrze Miejskim w Rio de Janeiro jako ostatnią pozycję w cyklu abonamentowym międzynarodowych przedstawień operowych. Dyrektor teatru operowego uznał bowiem «Malazarte» za dzieło tak wybitne, że bez wahania zaprezentował je publiczności, która zazwyczaj gromadzi się wyłącznie po to, by słuchać klasycznych przedstawień operowych. Wybór brazylijskiego dzieła, nawet autorstwa współczesnego kompozytora, wymagał niemałej odwagi, zwłaszcza że publiczność w Rio woli oglądać utwory, które zdobyły już uznanie poza granicami kraju. Tylko w bardzo rzadkich przypadkach brazylijskie dzieła sceniczne trafiają do międzynarodowego repertuaru sezonowego. Wielka renoma Lorenza Fernándeza w kraju oraz rosnące uznanie za granicą sprawiły, że z niecierpliwością oczekiwano na wystawienie jego opery. Wieczór zakończył się wielkim sukcesem. «Malazarte» jest bez wątpienia najpotężniejszym i najbardziej osobistym dziełem 44-letniego Fernándeza”. – „The New York Times”, 12 października 1941 r."
 elgar.1473.f: "„Suity brazylijskie” brazylijskiego kompozytora Oscara Lorenza Fernándeza to cykl trzech suit fortepianowych napisanych w latach 30. XX wieku, odzwierciedlających jego zainteresowanie brazylijską kulturą muzyczną. Każda z trzech suit (Suita brazylijska nr 1, nr 2 i nr 3) składa się z cyklu krótkich utworów fortepianowych, często opatrzonych opisowymi tytułami. Przykładowo pierwsza suita zawiera części zatytułowane „Dawna modinha”, „Łagodna kołysanka” i „Nostalgiczna serenada”."
 elgar.1481.f: "„Ten dramat oparty jest na powieści o tym samym tytule autorstwa znakomitego brazylijskiego pisarza José de Alencara. Nazwy Guarani i Ajmoré odnoszą się do dwóch spośród wielu rdzennych plemion zamieszkujących różne regiony terytorium Brazylii przed przybyciem Portugalczyków, którzy przynieśli ze sobą cywilizację europejską. Według autora powieści Pery był wodzem Guarani. Plemię to było bardziej pokojowo nastawione niż inne, w przeciwieństwie do Ajmoré, którzy zawsze byli najbardziej nieprzejednanymi wrogami białych. Don Antonio de Mariz, postać historyczna nie do końca nieskazitelna, był jednym z pierwszych, którzy sprawowali władzę na tych ziemiach w imieniu króla Portugalii, i padł ofiarą barbarzyństwa ludności tubylczej”. – Przedmowa do libretta"
 elgar.1482.f: "Dzieło, określane mianem dramma lirico, bywa zaliczane do gatunku opery seria, zawiera jednak również cechy grand opéra, takie jak wpleciony balet oraz wyraziste efekty dramatyczne w scenie spisku i chórze ronda. Pod względem stylistycznym „Lo schiavo” przypomina dzieła Giuseppe Verdiego z jego środkowego okresu twórczości. Dostrzegalne są również cechy weryzmu. Pomimo brazylijskiej scenerii i rdzennych bohaterów muzyka nie zawiera odpowiadających im elementów folklorystycznych. Tańce utrzymane są natomiast w bardziej ogólnie pojętej stylistyce egzotycznej. Wykorzystują one pewne modele rytmiczne zaczerpnięte ze współczesnej muzyki tanecznej. Styl melodyczny niektórych arii przywodzi na myśl sentymentalne brazylijskie pieśni modinha. Uwertura orkiestrowa znana jako „Alvorada” („Świt”) uważana jest za najlepszy utwór orkiestrowy Antônia Carlosa Gomesa. Ostateczną wersję włoskiego libretta przygotował Rodolfo Paravicini według szczegółowych wskazówek Gomesa, który nalegał również na włączenie „Hymnu do Wolności” autorstwa Francesca Gigantiego."
 elgar.1483.f: "„Fosca” to opera seria w czterech aktach brazylijskiego kompozytora Antônia Carlosa Gomesa, z włoskim librettem Antonia Ghislanzoniego, opartym na powieści Luigiego Capraniki „La festa delle Marie” z 1869 roku. Jest to druga opera Gomesa, skomponowana po jego powrocie z Brazylii. Jej fabuła opowiada o piractwie na Adriatyku, a akcja rozgrywa się w średniowieczu. Partytura ukazuje znacznie bardziej wyrafinowane wykorzystanie motywów przewodnich oraz strukturę wokalną skłaniającą się ku bardziej ciągłemu, swobodnemu stylowi narracyjnemu, wykraczającemu poza tradycyjny podział na recytatyw i arię. Mimo uznania krytyków, wśród których znalazł się obecny na premierze francuski kompozytor Charles Gounod, opera nie zdobyła szerszej popularności. Przyczyną była rywalizacja między miłośnikami bel canto a zwolennikami dramatu muzycznego wagnerowskiego."
 elgar.1491.f: "„María del Carmen” to opera w trzech aktach skomponowana przez Enrique Granadosa do hiszpańskiego libretta José Feliú i Codiny, opartego na jego sztuce z 1896 roku pod tym samym tytułem. Był to pierwszy sukces operowy Granadosa i choć dziś dzieło jest w dużej mierze zapomniane, sam kompozytor uważał je za swoją najlepszą operę. Po zakończeniu pierwszej serii przedstawień w Madrycie, gdzie opera miała premierę w 1898 roku, królowa Maria Krystyna odznaczyła Granadosa Krzyżem Orderu Karola III w uznaniu jego twórczości. Opera, określana niekiedy jako hiszpańska wersja „Rycerskości wieśniaczej” Mascagniego ze szczęśliwym zakończeniem, rozgrywa się we wsi w hiszpańskim regionie Murcji. Przedstawia trójkąt miłosny między Maríą (sopran) a jej dwoma zalotnikami: chłopem Penchem (baryton) i jego zamożnym rywalem Javierem (tenor)."
 elgar.1492.f: "W 1911 roku Enrique Granados z wielkim sukcesem zaprezentował w Barcelonie swój cykl fortepianowy „Goyescas”, inspirowany wczesnymi dziełami Francisca Goi. Następnie jego przyjaciel, pianista Ernest Schelling, poradził mu przekształcenie suity w dzieło sceniczne. Granados zinstrumentował pięć z sześciu utworów fortepianowych oraz miniaturę charakterystyczną „El Pelele”, nadając im formę scen operowych, a także skomponował dwa nowe interludia na potrzeby trzyaktowej struktury dramatu. Napisanie libretta, które wbrew zwyczajowej praktyce należało dostosować do istniejących już melodii, powierzono Fernandowi Periquetowi y Zuaznabarowi. Premiera jednoaktowej opery odbyła się w Metropolitan Opera 28 stycznia 1916 roku. Mimo początkowego sukcesu dzieło nigdy nie zajęło trwałego miejsca w repertuarze poza Hiszpanią. Po pierwszych pięciu przedstawieniach w Metropolitan Opera nie wystawiono go tam już nigdy więcej."
 elgar.1493.f: "„Doce danzas españolas” („Dwanaście tańców hiszpańskich”) to cykl dwunastu utworów fortepianowych skomponowanych przez Enrique Granadosa. Tańce te stanowią ważny wkład w XIX-wieczną hiszpańską muzykę fortepianową nurtu narodowego i doczekały się opracowań na inne instrumenty, między innymi gitarę. Cały cykl tworzy bogatą i zróżnicowaną panoramę form tanecznych, a jego poszczególne części przywołują rozmaite charaktery i nastroje. To jedno z najbardziej znanych dzieł Granadosa, wydane w czterech tomach."
 elgar.1501.f: "„Cavalleria rusticana” („Rycerskość wieśniacza”) to jednoaktowa opera Pietra Mascagniego do włoskiego libretta Giovanniego Targioniego-Tozzettiego i Guida Menasciego, uznawana za jedno z klasycznych dzieł operowego weryzmu. Choć Mascagni wcześniej rozpoczął pracę nad dwiema innymi operami („Pinotta”, wystawiona po raz pierwszy w 1932 roku, oraz „Guglielmo Ratcliff”, którego premiera odbyła się w 1895 roku), „Cavalleria rusticana” była jego pierwszą ukończoną i wystawioną operą. Pozostaje najbardziej znanym dziełem spośród jego piętnastu oper i jednej operetki. Od pierwszego przedstawienia w rzymskim Teatro Costanzi aż po dziś dzień cieszy się niezwykłym powodzeniem. Do śmierci Mascagniego w 1945 roku wystawiono ją ponad 14,000 razy w samych Włoszech. Premiera „Cavallerii rusticana” wywołała sensację, a Mascagniego wywoływano przed kurtynę 40 razy podczas premierowego wieczoru. Dzieło zdobyło również Pierwszą Nagrodę."
 elgar.1502.f: "„Iris” to opera Pietra Mascagniego do libretta Luigiego Illici. W przeciwieństwie do wielu wcześniejszych dzieł Mascagniego, utrzymanych w nurcie weryzmu, „Iris” jest operą symboliczną, najbardziej znaną z finałowego chóru „Hymn do Słońca”. Luigi Illica zaproponował Mascagniemu operę o tematyce japońskiej, która miała stanowić włoską odpowiedź na rosnące w Europie upodobanie do symbolizmu i egzotyki. Mascagni przyjął projekt „z niezrównanym entuzjazmem” i rozpoczął studia nad „japońskim stylem harmonicznym”, co doprowadziło do wykorzystania gongów i skali heksatonicznej. Z biegiem czasu krytycy na ogół dość surowo oceniali to dzieło."
 elgar.1503.f: "„L’amico Fritz” („Przyjaciel Fritz”) to komedia liryczna w trzech aktach Pietra Mascagniego. Libretto napisał głównie Nicola Daspuro na podstawie noweli pod tym samym tytułem. Choć Daspuro szybko ukończył swoją pracę, Mascagni zmagał się z komponowaniem muzyki, był niezadowolony z tekstu libretta i ukończył operę dopiero kilka tygodni przed planowaną premierą. Gdy na dworcu w Neapolu skradziono walizkę z librettem, Mascagni musiał sam niemal w całości napisać na nowo trzeci akt. Podczas premiery „L’amico Fritz” spełnił wysokie oczekiwania publiczności, która przyjęła go entuzjastycznie. Najbardziej znaną sceną opery jest „Duet wiśniowy” w drugim akcie."
 elgar.1511.f: "„Wesołe kumoszki z Windsoru” to opera w trzech aktach niemieckiego kompozytora Ottona Nicolaia i jego najbardziej znane dzieło. Jest singspielem, zawierającym liczne dialogi mówione między poszczególnymi numerami muzycznymi. Opera pozostaje popularna w Niemczech, a jej uwertura bywa wykonywana na koncertach w innych krajach. Nicolai pisał ją podczas pracy na stanowisku pierwszego dyrygenta w wiedeńskim Kärntnertortheater, gdzie był również zobowiązany umową do skomponowania niemieckiej opery. Ostatecznie przyjął sugestię swojego przyjaciela Siegfrieda Kappera, aby oprzeć dzieło na komedii Shakespeare’a „Wesołe kumoszki z Windsoru”."
 elgar.1512.f: "„Il templario” („Templariusz”) to opera w trzech aktach Ottona Nicolaia do libretta Girolama Marii Mariniego, oparta na powieści Waltera Scotta „Ivanhoe”. Jej premiera odbyła się w Turynie. Wraz z „La vestale” Saveria Mercadantego i „Saffo” Giovanniego Paciniego należała do trzech największych sukcesów włoskiego sezonu operowego 1840 roku. W swoich czasach odniosła więc światowy sukces, doczekawszy się ponad siedemdziesięciu inscenizacji. Jedynie w krajach niemieckojęzycznych nie zdołała sprostać konkurencji opery Heinricha Marschnera „Templariusz i Żydówka”."
 elgar.1513.f: "„Die Heimkehr des Verbannten” („Powrót wygnańca”) to opera w trzech aktach Ottona Nicolaia do niemieckojęzycznego libretta Siegfrieda Kappera. Opiera się na wcześniejszej operze Nicolaia „Il proscritto”, do której libretto napisał Gaetano Rossi. Akcja rozgrywa się w Anglii w 1461 roku, podczas wojny Dwóch Róż. Hector Berlioz, który wysłuchał wersji wiedeńskiej, chwalił Nicolaia, stwierdzając: „…było to w operze Nicolaia, której ostatni akt, pod każdym względem godny podziwu, stawia go moim zdaniem bardzo wysoko wśród kompozytorów”."
 elgar.1521.f: "„Orfeusz w piekle” (fr. „Orphée aux enfers”) to opera buffa w dwóch aktach, podzielonych na cztery obrazy, do libretta Ludovica Halévy’ego i Hectora Crémieux, z muzyką Jacques’a Offenbacha. Po trzech latach komponowania dla swojego teatru oper jednoaktowych z powodu ograniczeń koncesyjnych Offenbach stworzył „Orfeusza” jako pierwsze dzieło wypełniające cały wieczór, które odniosło nadzwyczajny sukces. Fabuła parodiuje grecki mit o Orfeuszu i Eurydyce. Przedstawiając bogów Olimpu odwiedzających Hades dla rozrywki, opera jednocześnie wyśmiewa podwójne standardy wyższych sfer Drugiego Cesarstwa Francuskiego. W chwili premiery wielu przedstawicieli paryskiego towarzystwa mogło rozpoznać siebie w postaciach. Najsłynniejszym fragmentem muzycznym jest kankan (pierwotnie zatytułowany „Galop infernal”) z drugiego aktu, przebój publiczności, który do dziś pozostaje powszechnie znany i często jest wykonywany osobno."
 elgar.1522.f: "„Piękna Helena” to opera buffa w trzech aktach Jacques’a Offenbacha do libretta Henriego Meilhaca i Ludovica Halévy’ego. Sukces dzieła w dużej mierze zależał od wykonawczyni roli tytułowej, w którą podczas premiery wcieliła się Hortense Schneider. Była ona słynną śpiewaczką i kurtyzaną, z myślą o której Offenbach stworzył „Piękną Helenę”, a także późniejsze operetki, takie jak „Sinobrody” (1866), „Wielka księżna Gerolstein” (1867), „La Périchole” (1868) i „La Diva” (1869). Wyróżniała się raczej niezwykłą osobowością sceniczną i erotycznym urokiem niż klasyczną techniką wokalną. Powieściopisarz Émile Zola ironicznie sportretował ją w „Nanie” jako artystkę o ograniczonym talencie, która mimo to oczarowuje paryską publiczność urodą i występami nago."
 elgar.1523.f: "„Opowieści Hoffmanna” (oryginalny tytuł francuski: „Les contes d’Hoffmann”) to „opera fantastyczna w pięciu aktach” (pierwotnie w trzech aktach z prologiem i epilogiem) Jacques’a Offenbacha. Libretto opiera się na sztuce Jules’a Barbiera i Michela Carrégo, inspirowanej różnymi opowiadaniami E. T. A. Hoffmanna, takimi jak „Piaskun”, „Radca Krespel” i „Przygody nocy sylwestrowej”. Na prośbę Offenbacha Barbier przerobił tę sztukę na libretto operowe. W operze bohaterem opowieści jest sam Hoffmann, inaczej niż w jego utworach literackich, w których męscy bohaterowie noszą inne imiona lub są fikcyjnymi narratorami pierwszoosobowymi. Offenbach zmarł podczas komponowania opery. Nie istnieje ostateczna, zatwierdzona przez niego partytura, zachowały się jednak liczne strony rękopisów zawierające różne warianty. Ponieważ rękopisy Offenbacha zostały rozdzielone między jego spadkobierców, a niektórzy z nich wielokrotnie przekazywali fragmenty autografu w darze lub sprzedawali je przyjaciołom i kolekcjonerom, nadal nie wiadomo, jak dalece kompozytor zaawansował prace nad dziełem."
 elgar.1531.f: "„Dzwon Wolności” to amerykański marsz wojskowy Johna Philipa Sousy. Sousa pierwotnie rozpoczął komponowanie marszu na potrzeby opery zatytułowanej „Zastępca diabła”, jednak porzucił ten projekt, ponieważ nie był zadowolony z oferowanego wynagrodzenia. Później, podczas oglądania przedstawienia ze swoim współpracownikiem George’em Hintonem, zauważyli oni dekorację przedstawiającą Dzwon Wolności. Hinton zasugerował wówczas, by nazwać marsz na cześć tego słynnego symbolu."
 elgar.1532.f: "„The Stars and Stripes Forever” to amerykański marsz wojskowy skomponowany przez Johna Philipa Sousę. Zachowało się oryginalne nagranie z 1897 roku, którym dyrygował sam kompozytor. 11 grudnia 1987 roku prezydent Ronald Reagan, w następstwie uchwały Kongresu, oficjalnie ustanowił ten utwór marszem narodowym Stanów Zjednoczonych."
 elgar.1533.f: "„The Washington Post” to jeden z najbardziej znanych utworów Johna Philipa Sousy, który zdobył szerokie uznanie również poza Stanami Zjednoczonymi. W 1889 roku amerykański dziennik „The Washington Post” kupili Frank Hatton i Beriah Wilkins. Zamówili oni u Sousy, ówczesnego dyrygenta United States Marine Band, marsz przeznaczony do wykonania podczas uroczystości związanej z konkursem na wypracowanie dla dzieci, sponsorowanym przez gazetę."
 elgar.1541.f: "„Galop kopenhaskiej kolei parowej” powstał z okazji otwarcia kolei Kopenhaga–Roskilde, pierwszej linii kolejowej w Królestwie Danii. Po raz pierwszy wykonano go w kopenhaskich Ogrodach Tivoli. Utwór jest dobrym przykładem lekkiej muzyki rozrywkowej, którą Lumbye chętnie komponował. Wiernie naśladuje odgłosy lokomotywy parowej, która z sapaniem opuszcza stację, a następnie z piskiem hamulców zatrzymuje się na kolejnym przystanku. Tradycyjnie kończy się okrzykiem: „Następny przystanek Roskilde, dalej pociąg nie jedzie”."
 elgar.1542.f: "Wnuk Lumbyego, dyrygent Tippe Lumbye, opowiedział historię powstania tego utworu: „Pewnego wieczoru Lumbye został zaproszony na uroczyste przyjęcie w ambasadzie brytyjskiej w Kopenhadze. Po drodze mijał jednak swój ulubiony lokal i postanowił spędzić wieczór tam, w bardziej swojskim towarzystwie. Gdy późną nocą wrócił do domu, musiał opowiedzieć, jak ambasada, do której w rzeczywistości nigdy nie dotarł, rzekomo tonęła w szampanie i zabawie. Aby zobrazować to zaciekawionej rodzinie, zasiadł do fortepianu i zaimprowizował utwór, który później stał się słynnym na całym świecie Galopem szampańskim”."
 elgar.1543.f: "W latach 1843–1872 Lumbye pełnił funkcję dyrektora muzycznego i stałego kompozytora Ogrodów Tivoli w Kopenhadze. Cieszył się w duńskiej stolicy tak wielką popularnością, że wielu Duńczyków go uwielbiało, a Johanna Straussa II nazywało „Lumbyem Południa”."
 elgar.1551.f: "„Carmen” opiera się na noweli Prospera Mériméego z 1846 roku pod tym samym tytułem. Początkowo nieprzychylnie przyjęta przez publiczność, zyskała uznanie wybitnych współczesnych twórców i myślicieli, takich jak Debussy, Nietzsche, Saint-Saëns i Czajkowski. Brahms obejrzał ponad dwadzieścia przedstawień i uważał ją za najlepszą operę wystawioną w Europie od czasu wojny francusko-pruskiej. Bizet zmarł zaledwie kilka miesięcy po premierze i za życia nie doczekał się sławy dzięki swoim dziełom. Po latach zapomnienia jego utwory zaczęto częściej wykonywać w XX wieku. Późniejsi komentatorzy uznali go za kompozytora błyskotliwego i oryginalnego, którego przedwczesna śmierć była wielką stratą dla francuskiego teatru muzycznego."
 elgar.1552.f: "„L’Arlésienne” („Arlezjanka”) Georges’a Bizeta powstała pierwotnie jako muzyka sceniczna do sztuki Alphonse’a Daudeta pod tym samym tytułem i obejmuje utwory orkiestrowe, chóry oraz melodramaty. Sztuka Daudeta nie odniosła sukcesu, lecz paryska publiczność od razu dostrzegła wyjątkowy kunszt muzyki Bizeta. Z kilku utworów kompozytor ułożył suitę orkiestrową, która spotkała się z wielkim uznaniem i przyniosła mu popularność w Paryżu jeszcze przed operą Carmen. Bizet stworzył samodzielną partyturę, tylko sporadycznie wykorzystując trzy melodie zaczerpnięte ze zbioru pieśni prowansalskich wydanego w 1864 roku. We współczesnej praktyce koncertowej wykonuje się dwie suity. Drugą opracował już po śmierci kompozytora Ernest Guiraud."
 elgar.1553.f: "„Les pêcheurs de perles” („Poławiacze pereł”) to opera w trzech aktach Georges’a Bizeta. Muzykę, składającą się z uwertury i szesnastu połączonych ze sobą numerów, kształtuje egzotyczna, dalekowschodnia tematyka, znajdująca odzwierciedlenie w rytmach, melodiach i instrumentacji, którą dziś można odtworzyć jedynie częściowo. Premiera nie odniosła większego sukcesu. Mimo przychylnej recenzji Hectora Berlioza w „Journal des débats” za życia Bizeta operę wystawiono zaledwie osiemnaście razy, a po jego śmierci popadła w zapomnienie. Dopiero po odejściu kompozytora i ogromnym sukcesie jego opery Carmen zaczęto przypominać sobie o wcześniejszych dziełach."
 elgar.1561.f: "„Sinfonía india” („Symfonia indiańska”) to 2. symfonia Carlosa Cháveza, napisana w latach 1935–1936. Choć składa się z jednej części, jej wewnętrzne odcinki odpowiadają tradycyjnej strukturze symfonii trzyczęściowej. Tytuł dzieła nawiązuje do jego materiału tematycznego, opartego na trzech melodiach rdzennych ludów północnego Meksyku. Symfonia ta pozostaje najbardziej znaną i najczęściej wykonywaną kompozycją Cháveza."
 elgar.1562.f: "„Sinfonía de Antígona” („Symfonia Antygony”) została skomponowana przez Carlosa Cháveza w 1933 roku. Jest pierwszą symfonią tego meksykańskiego kompozytora. Wywodzi się z muzyki scenicznej, którą Chávez napisał do adaptacji tragedii Sofoklesa Antygona, opracowanej przez Jeana Cocteau. Adaptację tę wystawił zespół Teatro Orientación w Palacio de Bellas Artes w mieście Meksyk w 1932 roku. Chávez później przerobił część materiału muzycznego i opracował jego instrumentację, tworząc swoją pierwszą symfonię."
 elgar.1563.f: "„Caballos de vapor, sinfonía de baile” (znane również jako „Horse-Power” i pod skrótem tego tytułu, H. P.) to muzyka baletowa skomponowana przez Carlosa Cháveza. Dzieło zrodziło się z rozmów kompozytora z malarzem Agustínem Lazo Adalidem, prowadzonych w 1922 lub 1923 roku, na temat przedsięwzięcia łączącego różne dziedziny sztuki i ukazującego wpływ mechanizacji na społeczeństwo ówczesnego Meksyku. Według innej relacji pomysł powstał jednak dopiero w 1926 roku, podczas rozmów z innym artystą plastykiem, Diegiem Riverą, który miał zaprojektować i wykonać dekoracje oraz kostiumy. Partyturę określono jako „symfonię taneczną”. Choć nie należy do numerowanych symfonii kompozytora, zachowuje tradycyjny podział na cztery części, które dodatkowo dzielą się na następujące po sobie tańce."
 elgar.1571.f: "„Le Chasseur maudit” („Przeklęty strzelec”) to poemat symfoniczny Césara Francka, inspirowany balladą Der wilde Jäger niemieckiego poety Gottfrieda Augusta Bürgera. Franck mistrzowsko oddaje mroczną i fantastyczną atmosferę niemieckiego utworu, zwłaszcza poprzez żałosne zawołania rogów i subtelną instrumentację. Zakończenie przywodzi nawet na myśl „Sen o sabacie czarownic” z Symfonii fantastycznej Berlioza. W opowieści pewnego niedzielnego poranka, gdy biją kościelne dzwony, a śpiew wiernych wzywa do modlitwy, nadreński hrabia każe zadąć w rogi myśliwskie i wyrusza na łowy, odmawiając udziału w niedzielnym nabożeństwie. Podczas szaleńczej pogoni tratuje uprawy i smaga batem napotkanych chłopów. Gdy gubi się w lesie, straszliwy głos rzuca na niego klątwę i skazuje go na wieczne potępienie, odwracając role: odtąd podczas jazdy ścigają go wyjące diabły, pędząc go prosto ku ziejącej otchłani piekła."
 elgar.1572.f: "Symfonia d-moll jest najbardziej znanym dziełem orkiestrowym Césara Francka i jedyną symfonią, którą ukończył. Składa się z trzech części: Lento - Allegro ma non troppo, Allegretto oraz Finale: Allegro non troppo. Łączy je struktura cykliczna, w której ważne tematy wprowadzone na początku powracają w całym utworze. Taka jedność tematyczna była jednym z charakterystycznych sposobów kształtowania rozbudowanych form przez Francka. Gdy kompozytor pisał symfonię, gatunek ten był rzadko obecny we francuskim życiu muzycznym i nadal postrzegano go głównie jako część tradycji niemieckiej. Powstanie dzieła często rozpatruje się w kontekście szerszego odrodzenia francuskiej twórczości symfonicznej pod koniec XIX wieku, inspirowanego wcześniejszymi sukcesami, takimi jak Symfonia organowa Saint-Saënsa."
 elgar.1573.f: "Wariacje symfoniczne to utwór na fortepian i orkiestrę Césara Francka, należący do jego najbardziej cenionych kompozycji. Stanowi przykład dojrzałego stylu kompozytora, łączącego rygor formalny z inwencją liryczną. Dzieło powstało na zamówienie pianisty Louisa Diémera, który dokonał również jego prawykonania pod batutą kompozytora. Wariacje symfoniczne mają formę jednej nieprzerwanej części, podzielonej na trzy główne odcinki: wstęp, właściwy cykl wariacji i finał. Utwór rozpoczyna się rozbudowanym wstępem orkiestrowym, przedstawiającym główne tematy, które następnie są rozwijane i przekształcane w kolejnych wariacjach. Franck łączy formę wariacyjną z rozwojem symfonicznym, tworząc spójny łuk muzyczny zamiast szeregu kontrastujących numerów. Od premiery Wariacje symfoniczne weszły na stałe do repertuaru na fortepian i orkiestrę i pozostają jednym z najczęściej wykonywanych oraz nagrywanych dzieł Francka."
 elgar.1581.f: "Concierto de Aranjuez to koncert na gitarę solo i orkiestrę Joaquína Rodriga. Jest nie tylko najpopularniejszym dziełem kompozytora, lecz także jednym z najbardziej znanych utworów muzyki klasycznej XX wieku. Rodrigo skomponował go za namową swojego przyjaciela, gitarzysty Regina Sáinza de la Mazy, który wykonał partię solową podczas premiery i któremu utwór jest dedykowany. W koncercie Rodrigo odmalowuje ogrody Pałacu Królewskiego w Aranjuez, położonego na południe od Madrytu i będącego wiosenną rezydencją hiszpańskich królów. Aranjuez symbolizowało dla niego panowanie ostatnich hiszpańskich monarchów przed Napoleonem Bonapartem. Kompozytora łączyła z pałacem silna osobista więź, ponieważ często spacerował po jego ogrodach z przyszłą żoną. W drugiej części Rodrigo wyraża emocje po martwym urodzeniu swojego pierwszego syna, w tym modlitwę do Boga o ocalenie życia ukochanej żony Victorii."
 elgar.1582.f: "Fantasia para un gentilhombre to koncert na gitarę i orkiestrę Joaquína Rodriga. Jest jego drugim najpopularniejszym koncertem po Concierto de Aranjuez. Cztery części utworu opierają się na sześciu krótkich tańcach na gitarę solo XVII-wiecznego hiszpańskiego kompozytora Gaspara Sanza, zaczerpniętych z jego trzytomowego dzieła znanego jako Instrucción de música sobre la guitarra española (1674, 1675, 1697). Większość części zachowuje oryginalne tytuły Sanza. Rodrigo zadbał o zachowanie przejrzystości i charakteru pierwotnych pomysłów Sanza, stwierdzając: „W tych tytułach ożywa cała przeszłość tańców, w których spotykają się dawne i nowe czasy. Zależało mi na tym, by język harmoniczny i atmosfera brzmieniowa nie przytłumiły ducha tych tytułów”."
 elgar.1583.f: "Concierto Serenata to koncert na harfę i orkiestrę skomponowany przez Joaquína Rodriga. Powstał z myślą o słynnym hiszpańskim harfiście Nicanorze Zabalecie, który dokonał prawykonania utworu z Hiszpańską Orkiestrą Narodową pod batutą Odóna Alonsa. Dzieło stało się cenioną pozycją XX-wiecznego repertuaru harfowego i jest podziwiane za zajmujący dialog solisty z orkiestrą."
 elgar.1591.f: "Marsz Radetzky’ego to marsz skomponowany przez Johanna Straussa i dedykowany austriackiemu feldmarszałkowi Josefowi Wenzlowi, hrabiemu Radetzky’emu von Radetz. Jego powstanie jest ściśle związane z wydarzeniami rewolucji marcowej w Austrii. Po zwycięstwie Radetzky’ego nad wojskami sardyńskimi siły konserwatywne odzyskały przewagę nie tylko w zbuntowanych Włoszech, lecz pojawiła się również perspektywa stłumienia rewolucji w Wiedniu. W tej sytuacji Strauss, którego sympatie zawsze były po stronie wiernych cesarzowi, zorganizował na terenach parkowych Wasserglacis uroczystość zwycięstwa „na cześć dzielnej armii we Włoszech i dla wsparcia rannych żołnierzy”. Zapowiedział przy tym premierę nowego marsza, który wykonano po raz pierwszy jako Marsz Radetzky’ego."
 elgar.1592.f: "Wraz z Josefem Lannerem, zanim sławę zdobył jego syn, Strauss uchodził za króla walca wiedeńskiego. Historia tego tańca zaczyna się od pierwszej odnotowanej wzmianki z 1797 roku we Wrocławiu, choć słowo „walzen” w znaczeniu „obracać się” jest znacznie starsze. Walc zyskał popularność podczas kongresu wiedeńskiego w latach 1814/15. Początkowo tańczono go bardzo szybko i dopiero na początku XX wieku wykształcił się znany dziś „płynący” styl. Loreley-Rheinklänge uchodzi za najbardziej udany walc wiedeński Straussa ojca."
 elgar.1593.f: "„Cachucha Galop” miał premierę w wiedeńskiej gospodzie Goldene Birn. Kaczucza była wówczas bardzo popularnym tańcem hiszpańskim. Na oryginalnej partyturze tego galopu, przechowywanej przez Towarzystwo Przyjaciół Muzyki w Wiedniu, widnieje następująca adnotacja: „Ten galop został skomponowany przez Johanna Straussa godzinę przed rozpoczęciem balu, przepisany przez kopistę, wykonany bez próby, przyjęty niezwykle gorącymi oklaskami i powtórzony trzykrotnie”."
