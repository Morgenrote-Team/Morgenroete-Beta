 elgar_art_nouveau_tech_desc: "#R Ta technologia jest dostępna wyłącznie za pośrednictwem przycisku w zakładce Sztuka interfejsu Morgenröte!#!\n\n[concept_elgar_art_nouveau] to międzynarodowy styl w sztuce, architekturze i sztuce użytkowej, zwłaszcza w sztukach dekoracyjnych. W różnych językach znany jest pod różnymi nazwami: Jugendstil w języku niemieckim, Stile Liberty we włoskim, Modernisme w katalońskim, a w języku angielskim również jako Modern Style. Czerpał inspirację przede wszystkim z form występujących w naturze, takich jak wijące się linie roślin i kwiatów. Architekci i projektanci dążyli do stworzenia podnoszącego na duchu Gesamtkunstwerk („dzieła totalnego”), które łączyłoby wszystkie dziedziny sztuki."
 elgar_impressionism_tech_desc: "#R Ta technologia jest dostępna wyłącznie za pośrednictwem przycisku w zakładce Sztuka interfejsu Morgenröte!#!\n\n[concept_elgar_impressionism] to styl artystyczny z XIX wieku, charakteryzujący się nastrojowym przedstawianiem ulotnych chwil. Termin impresjonizm stosuje się również w odniesieniu do określonych nurtów muzyki, literatury, filmu i fotografii."
 elgar_expressionism_tech_desc: "#R Ta technologia jest dostępna wyłącznie za pośrednictwem przycisku w zakładce Sztuka interfejsu Morgenröte!#!\n\n[concept_elgar_expressionism] to modernistyczny nurt, który początkowo rozwijał się w poezji i malarstwie. Jego charakterystyczną cechą jest przedstawianie świata wyłącznie z subiektywnej perspektywy, przy jednoczesnym radykalnym zniekształcaniu rzeczywistości w celu wywołania określonych emocji, nastrojów lub skojarzeń."
 elgar.423.d: "[SCOPE.sCharacter('elgar_conductor').GetFullName] narzeka, że [SCOPE.sCharacter('elgar_conductor').GetHerHis] warunki pracy nie są wystarczająco dobre, zważywszy na liczne funkcje, które pełni. Być może wsparcie finansowe mogłoby poprawić jego „natchnienie”."
 elgar.424.d: "[SCOPE.sCharacter('elgar_conductor').GetFullName] od pewnego czasu próbuje komponować, ale [SCOPE.sCharacter('elgar_conductor').GetSheHe] nieustannie doświadcza przerw w pracy z powodu pewnej osoby."
 elgar_irrationalism_tech_desc: "Irracjonalizm to nurt filozoficzny, który wyłonił się na początku XIX wieku i podkreśla znaczenie nieracjonalnego wymiaru ludzkiego życia. Irracjonaliści twierdzą, że sam ludzki rozum nie jest w stanie rozpoznać podstaw, powiązań i praw rządzących obiektywną rzeczywistością. Jako alternatywę dla opisowych i normatywnych wyjaśnień świata proponują odwołanie się do wyższych funkcji poznawczych, takich jak intuicja, wiara czy bezpośrednie doświadczenie."
