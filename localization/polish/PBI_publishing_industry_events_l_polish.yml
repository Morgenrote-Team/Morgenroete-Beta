 pbi_publishing_industry_events.100.t: "Whatever you like"
 pbi_publishing_industry_events.100.d.1: "W [ROOT.GetCountry.GetName] istnieją gazety popierające [SCOPE.sParty('target_party_1').GetName], gazety popierające [SCOPE.sParty('target_party_2').GetName], a nawet gazety wspierające [SCOPE.gsInterestGroup('target_ig_3').GetName], dzięki czemu obywatele mogą wybrać gazetę, która najbardziej im odpowiada."
 pbi_publishing_industry_events.100.d.2: "W [ROOT.GetCountry.GetName] istnieją gazety popierające [SCOPE.sParty('target_party_1').GetName], a nawet gazety popierające [SCOPE.sParty('target_party_2').GetName], dzięki czemu obywatele mogą wybrać gazetę, która najbardziej im odpowiada."
 pbi_publishing_industry_events.100.d.3: "W [ROOT.GetCountry.GetName] istnieją gazety popierające [SCOPE.gsInterestGroup('target_ig_1').GetName], gazety popierające [SCOPE.gsInterestGroup('target_ig_2').GetName], a nawet gazety wspierające [SCOPE.gsInterestGroup('target_ig_3').GetName], dzięki czemu obywatele mogą wybrać gazetę, która najbardziej im odpowiada."
 pbi_publishing_industry_events.100.d.4: "W [ROOT.GetCountry.GetName] istnieją gazety popierające [SCOPE.gsInterestGroup('target_ig_1').GetName] oraz gazety popierające [SCOPE.gsInterestGroup('target_ig_2').GetName], dzięki czemu obywatele mogą wybrać gazetę, która najbardziej im odpowiada."
 pbi_publishing_industry_events.100.f: "„Uważamy, że największym prawem na świecie jest prawo do bycia w błędzie, a korzystając z niego, ludzie mają nienaruszalne prawo do wyrażania swoich nieskrępowanych poglądów na wszystkie tematy i o wszystkich osobach, ponosząc odpowiedzialność jedynie za nadużycie tego prawa”\nWilliam Randolph Hearst"
 pbi_publishing_industry_events.100.a: "Dobrze mieć wybór"
 pbi_publishing_industry_events.100.b: "Ludzie chętnie pozwalają gazetom przemawiać w swoim imieniu"
 pbi_publishing_industry_events.105.t: "Rządowa gazeta propagandowa"
 pbi_publishing_industry_events.105.d.1: "[SCOPE.sCharacter('target_character_2').GetFullName] z [SCOPE.sParty('target_party_2').GetName] skrytykował [SCOPE.GetRootScope.GetCountry.GetCustom('pbi_newspaper_type')], gazetę [SCOPE.sParty('target_party_1').GetName] w [SCOPE.sState('target_state').GetName], której właścicielem jest [SCOPE.sCharacter('target_character_1').GetFullName], twierdząc, że przypomina rządową gazetę propagandową."
 pbi_publishing_industry_events.105.d.2: "[SCOPE.sCharacter('target_character_2').GetFullName] z [SCOPE.gsInterestGroup('target_ig_2').GetName] skrytykował [SCOPE.GetRootScope.GetCountry.GetCustom('pbi_newspaper_type')], gazetę [SCOPE.sParty('target_party_1').GetName] w [SCOPE.sState('target_state').GetName], której właścicielem jest [SCOPE.sCharacter('target_character_1').GetFullName], twierdząc, że przypomina rządową gazetę propagandową."
 pbi_publishing_industry_events.105.d.3: "[SCOPE.sCharacter('target_character_2').GetFullName] z [SCOPE.sParty('target_party_2').GetName] skrytykował [SCOPE.GetRootScope.GetCountry.GetCustom('pbi_newspaper_type')], gazetę [SCOPE.gsInterestGroup('target_ig_1').GetName] w [SCOPE.sState('target_state').GetName], której właścicielem jest [SCOPE.sCharacter('target_character_1').GetFullName], twierdząc, że przypomina rządową gazetę propagandową."
 pbi_publishing_industry_events.105.d.4: "[SCOPE.sCharacter('target_character_2').GetFullName] z [SCOPE.gsInterestGroup('target_ig_2').GetName] skrytykował [SCOPE.GetRootScope.GetCountry.GetCustom('pbi_newspaper_type')], gazetę [SCOPE.gsInterestGroup('target_ig_1').GetName] w [SCOPE.sState('target_state').GetName], której właścicielem jest [SCOPE.sCharacter('target_character_1').GetFullName], twierdząc, że przypomina rządową gazetę propagandową."
 pbi_publishing_industry_events.105.f: "„Skoro jest jasne, że ludzie od klasy robotniczej po klasy wyższe kierują się własnym interesem, nie ulega wątpliwości, że wola państwa powinna być realizowana przez rząd, który to państwo reprezentuje, a ludzie mają obowiązek wspierać decyzje rządu i z nim współpracować.”"
 pbi_publishing_industry_events.105.a: "To także jest rola dziennikarstwa"
 pbi_publishing_industry_events.105.b: "Powinna istnieć gazeta dla opozycji"
 pbi_publishing_industry_events.110.t: "Pierwszeństwo praw do transmisji medialnej"
 pbi_publishing_industry_events.110.d: "[SCOPE.sCharacter('target_character').GetFullName], członek [SCOPE.gsInterestGroup('target_ig').GetName], domaga się, aby jego gazeta miała pierwszeństwo w publikowaniu oficjalnych komunikatów rządowych."
 pbi_publishing_industry_events.110.f: "„Powinniśmy dokładnie poinformować opinię publiczną, co zamierzamy zrobić, zanim nasze działania zostaną oczernione przez nieodpowiedzialną i moralnie zbankrutowaną trójkę dziennikarzy.”"
 pbi_publishing_industry_events.110.a: "Mamy obowiązek przekazywać informacje w odpowiedni sposób"
 pbi_publishing_industry_events.110.b: "Taki faworytyzm jest niedopuszczalny"
 pbi_publishing_industry_events.115.t: "Gazety popierają nowe prawo"
 pbi_publishing_industry_events.115.d.1: "[SCOPE.GetRootScope.GetCountry.GetCustom('pbi_newspaper_type')], gazeta [SCOPE.sParty('target_party').GetName], której wydawcą jest [SCOPE.sCharacter('target_character').GetFullName], codziennie publikuje artykuły wychwalające ustawę [SCOPE.sLaw('target_law').GetName], lecz inne gazety krytykują ją jako przesadną."
 pbi_publishing_industry_events.115.d.2: "[SCOPE.GetRootScope.GetCountry.GetCustom('pbi_newspaper_type')], gazeta [SCOPE.gsInterestGroup('target_ig').GetName], której wydawcą jest [SCOPE.sCharacter('target_character').GetFullName], codziennie publikuje artykuły wychwalające ustawę [SCOPE.sLaw('target_law').GetName], lecz inne gazety krytykują ją jako przesadną."
 pbi_publishing_industry_events.115.f: "„Jeśli z tą ustawą jest jakiś problem, to jest nim fakt, że trudno oczekiwać od panów z opozycji, aby właściwie zrozumieli jej znaczenie.”"
 pbi_publishing_industry_events.115.a: "Opinia publiczna jest tym, czym ją uczynimy"
 pbi_publishing_industry_events.115.b: "Rolą prasy jest wskazywanie problemów związanych z ustawą"
 pbi_publishing_industry_events.120.t: "Skandal polityczny"
 pbi_publishing_industry_events.120.d: "W odpowiedzi na doniesienia niektórych gazet o skandalu związanym z [SCOPE.sCharacter('target_character').GetFullName], który należy do [SCOPE.gsInterestGroup('target_ig').GetName], [SCOPE.sCharacter('target_character').GetSheHe] twierdzi, że artykuły te są nieprawdziwe i zniesławiające."
 pbi_publishing_industry_events.120.f: "„Biorąc pod uwagę, z jakimi ludźmi [SCOPE.sCharacter('target_character').GetLastName] zadawał się, zanim [SCOPE.sCharacter('target_character').GetSheHe] osiągnął [SCOPE.sCharacter('target_character').GetHerHis] obecną szanowaną pozycję, nie jest zaskoczeniem, że [SCOPE.sCharacter('target_character').GetSheHe] był zamieszany w porwanie i morderstwo. W rzeczywistości naszej gazecie udało się porozmawiać z jedną z osób, która dobrze znała [SCOPE.sCharacter('target_character').GetHerHim] w tamtych czasach. Niesamowite szczegóły zostaną ujawnione w naszym następnym artykule!”"
 pbi_publishing_industry_events.120.a: "Powinniśmy to wykorzystać"
 pbi_publishing_industry_events.120.b: "To problem dla całego [SCOPE.gsInterestGroup('target_ig').GetName]!"
 pbi_publishing_industry_events.125.t: "Gazeta dla kogo?"
 pbi_publishing_industry_events.125.d: "Opinia publiczna w [SCOPE.sState('target_state').GetName] uważa, że gazety piszą tylko to, co jest wygodne dla rządu."
 pbi_publishing_industry_events.125.f: "„W [SCOPE.sState('target_state').GetName] wydawanych jest wiele gazet, a [SCOPE.sCharacter('target_character').GetFullName] jest udziałowcem we wszystkich z nich i decyduje, co zostanie opublikowane. Gazety mogą publikować wyłącznie artykuły zgodne z życzeniami [SCOPE.sCharacter('target_character').GetHerHis]. W tym sensie w [SCOPE.sState('target_state').GetName] istnieje tylko jedna gazeta.”"
 pbi_publishing_industry_events.125.a: "Informacja ma znaczenie tylko wtedy, gdy jest kontrolowana"
 pbi_publishing_industry_events.125.b: "Nigdy nie są zadowoleni z tego, co im dano"
 pbi_publishing_industry_events.200.t: "Czy Święty Mikołaj istnieje?"
 pbi_publishing_industry_events.200.d: "Drogi Redaktorze\nMam 8 lat. Niektórzy z moich małych przyjaciół mówią, że Święty Mikołaj nie istnieje.\nProszę, powiedz mi prawdę: czy Święty Mikołaj istnieje?\nVirginia O'Hanlon"
 pbi_publishing_industry_events.200.f: "Tak, Virginia, istnieje Święty Mikołaj. Istnieje równie pewnie jak istnieją miłość, hojność i oddanie, a ty wiesz, że są one obecne wokół ciebie i nadają twojemu życiu najwyższe piękno i radość.\nFrancis Pharcellus Church („The Sun”)"
 pbi_publishing_industry_events.200.a: "Chyba gazety czasami piszą dobre rzeczy"
 pbi_publishing_industry_events.200.b: "Miłość i szczerość nie czynią kraju silnym"
 pbi_publishing_industry_events.205.t: "Renomowana gazeta krytykuje prasę groszową"
 pbi_publishing_industry_events.205.d: "Prestiżowa gazeta w `[ROOT.GetCountry.GetName]` skrytykowała prasę groszową w `[SCOPE.sState('target_state').GetName]` za zdobywanie czytelników poprzez sensacyjne dezinformacje."
 pbi_publishing_industry_events.205.f: "„Arogancja popularnej prasy w naszym kraju tylko się pogarsza. Wszystko, co drukują, to plotki o politykach i osobach z wyższych sfer albo skandaliczne zbrodnie i procesy. A większość tych artykułów jest zmyślona bez żadnego prawdziwego dziennikarstwa ani wiedzy stojącej za nimi!”"
 pbi_publishing_industry_events.205.a: "To naprawdę godne ubolewania"
 pbi_publishing_industry_events.205.b: "Przynajmniej mogą nauczyć masy czytać"
 pbi_publishing_industry_events.210.t: "Urażony honor"
 pbi_publishing_industry_events.210.d: "Prasa groszowa w [SCOPE.sState('target_state').GetName] donosi o skandalu dotyczącym [SCOPE.sCharacter('target_character').GetPrimaryRoleTitle|l] [SCOPE.sCharacter('target_character').GetFullName], który stara się doprowadzić do usunięcia tego raportu, twierdząc, że jest on nieprawdziwy i zniesławiający."
 pbi_publishing_industry_events.210.f: "„Biorąc pod uwagę, z jakimi ludźmi [SCOPE.sCharacter('target_character').GetLastName] zadawał się, zanim [SCOPE.sCharacter('target_character').GetSheHe] osiągnął [SCOPE.sCharacter('target_character').GetHerHis] obecną szanowaną pozycję, nie jest zaskoczeniem, że [SCOPE.sCharacter('target_character').GetSheHe] był zamieszany w porwanie i morderstwo. W rzeczywistości naszej gazecie udało się porozmawiać z jedną z osób, która dobrze znała [SCOPE.sCharacter('target_character').GetHerHim] w tamtych czasach. Niesamowite szczegóły zostaną ujawnione w naszym następnym artykule!”"
 pbi_publishing_industry_events.210.a: "W tym przypadku prawdziwość doniesienia prasowego nie jest istotną kwestią"
 pbi_publishing_industry_events.210.b: "Honor [SCOPE.sCharacter('target_character').GetLastName] musi zostać przywrócony"
 pbi_publishing_industry_events.215.t: "Gazeta jak mozaika"
 pbi_publishing_industry_events.215.d: "Plagiat artykułów jest powszechny w większości prasy groszowej w [SCOPE.sState('target_state').GetName]."
 pbi_publishing_industry_events.215.f: "„Dziennikarze z [SCOPE.sState('target_state').GetName] są jak głodne hieny. Znajdują artykuł, który ich zdaniem przyciągnie kilku czytelników, i publikują go w swojej gazecie. Trudno znaleźć artykuł, który nie byłby splagiatowany. Jedna z gazet opublikowała nawet artykuł redakcyjny skopiowany prosto z innej gazety!”"
 pbi_publishing_industry_events.215.a: "Nagroda za artykuł powinna zostać przyznana osobie, która go napisała"
 pbi_publishing_industry_events.215.b: "Dobry artykuł powinien być rozpowszechniany"
 pbi_publishing_industry_events.220.t: "Bardzo ekscytujące"
 pbi_publishing_industry_events.220.d: "Brutalne morderstwa, niesmaczne kłótnie kochanków i skandale o niepewnej autentyczności. Obywatele [SCOPE.sState('target_state').GetName] są pochłonięci radykalnymi historiami, które każdego dnia trafiają do prasy groszowej."
 pbi_publishing_industry_events.220.f: "[SCOPE.GetRootScope.GetCountry.GetCustom('pbi_publishing_industry_flavor_220')]"
 pbi_publishing_industry_events.220.f.1: "„Niezwykle zaskakującego odkrycia dokonano w starym pawilonie. Właściciel wspomnianego domu zatrudnił wykonawcę budowlanego do przeprowadzenia renowacji. Robotnicy byli zaskoczeni, gdy usunęli część ściany. Odsłonięto przejście prowadzące do dużej piwnicy. Robotnicy z obawą weszli do pomieszczenia. Blask pochodni wyraźnie ukazał szczątki dwóch ludzkich ciał. Były to same szkielety, odziane w ubrania mające niemal dwa stulecia. Okoliczni mieszkańcy przekazali różnorodne informacje. Jednak w tej chwili nie można stwierdzić, czy te dwie osoby zostały zamurowane w piwnicy i pozostawione na straszną śmierć, czy też zostały początkowo zabite gdzie indziej, a następnie przeniesione w to miejsce, aby je ukryć.”"
 pbi_publishing_industry_events.220.f.2: "„Zwykle spokojne miasteczko było tego sobotniego popołudnia wyjątkowo napięte. Podobno wszystko zaczęło się od plotek o straszliwym morderstwie siedmioletniej dziewczynki. Około godziny 13:30 tego popołudnia do trojga dzieci podszedł młody urzędnik z kancelarii prawniczej. Mężczyzna zaoferował dziewczynce monetę i zaprosił ją, aby poszła z nim do zagajnika lub starą drogą prowadzącą do wioski. Dwoje pozostałych dzieci również otrzymało monety i kazano im obiecać, że nie pójdą za mężczyzną. Jednak dziewczynka nie chciała iść z mężczyzną. Wtedy mężczyzna chwycił ją za rękę i odciągnął, zmuszając ją do krzyku. O siódmej lub ósmej wieczorem nadal nigdzie nie było widać dziewczynki, a sąsiedzi zaczęli o niej rozmawiać. Niedługo po wejściu na farmę znaleźli głowę zaginionej dziewczynki leżącą na ziemi. Wyraźnie została odcięta ostrym ostrzem, a jej twarz była pokryta cięciami od ust aż do ucha oraz na lewej skroni. Był to przerażający widok. Każda część rozczłonkowanego ciała pozbawionego kończyn była rozrzucona po plantacji.”"
 pbi_publishing_industry_events.220.f.3: "„Robotnik został oskarżony o znęcanie się nad swoją żoną. Mężczyzna wrócił do domu kilka nocy wcześniej z długim batem jeździeckim i pobił swoją żonę w koszuli nocnej, gdy ta leżała w łóżku. Była w siódmym miesiącu ciąży i nie była w stanie się bronić. W wyniku jego bicia omal nie straciła życia. Następnie wszedł na łóżko i zaczął po niej deptać, łamiąc jej trzy żebra. Została przewieziona do szpitala z poważnymi obrażeniami. Podczas pierwszej rozprawy oskarżony wyszeptał, że powodem było uzależnienie żony od alkoholu. Sędzia skazał go na tydzień aresztu.”"
 pbi_publishing_industry_events.220.f.4: "„Dwudziestotrzyletni syn chłopa z niespotykaną brutalnością zamordował swoich rodziców, pięcioro rodzeństwa oraz służącą. Jego zeznanie było jedynie wyjaśnieniem motywu i sposobu dokonania zbrodni, nie wykazując żadnych oznak skruchy. Trzymając złotą sztabę długości sześciu stóp, zabijał swoich braci jednego po drugim, uderzając ich od tyłu. Następnie przyszła kolej na ojca. Powiedział mu, że krowy uciekły, i gdy ojciec wyszedł przez drzwi frontowe, zabił go na oczach pola. Umieścił ciało ojca na wozie i przewiózł je na tył domu, gdzie przekopał ziemię, aby ukryć ślady krwi. Następnie udał się do swojego pokoju, aby wykończyć młodsze rodzeństwo. Jego matka została uderzona siekierą i upadła na podłogę. Siostra wyskoczyła z łóżka, aby pomóc matce, lecz została pocięta nożem i dobita siekierą. Na koniec wbiegł do pokoju służącej i, zgadując w ciemności, dwukrotnie zamachnął się siekierą na jej łóżko. Służąca zmarła bez wydania żadnego dźwięku. Został osądzony i skazany na śmierć. Przestępca opuścił salę sądową z niezwykłym spokojem.”"
 pbi_publishing_industry_events.220.f.5: "„John Vaughty, mieszkaniec Reed Street, został oskarżony o bycie pijanym i stosowanie przemocy wobec swoich rodziców. John był niespokojnym trzydziestoośmioletnim mężczyzną — jego ojciec miał 93 lata, a matka oskarżyciela 88 lat — który wielokrotnie upijał się i zachowywał agresywnie wobec swoich rodziców. Matka współczuła swojemu synowi i nie była w stanie zdobyć się na to, aby umieścić go w więzieniu.”"
 pbi_publishing_industry_events.220.f.6: "„Kiedy pani Townsend poprosiła męża o dwa szylingi, ponieważ kupowała brandy „do przemycia głów dzieci”, nie zaufał jej i odrzucił jej prośbę. Uważał, że gdyby kupił brandy i tym podobne rzeczy, zanim trafiłyby na głowy dzieci, żona wypiłaby je sama. Natychmiast między małżonkami wybuchła kłótnia, a rozgniewana żona wyrzuciła męża z domu. Gdy mąż wrócił do domu w nocy, zastał żonę w niewypowiedzianie nieładnym stanie. Kiedy gwałtownie ją oskarżył, pani Townsend chwyciła za szczypce do ognia i uderzyła męża w głowę. Mąż nie pozostał jej dłużny i pobił żonę do nieprzytomności. Wyrok uznał, że zarówno mąż, jak i żona byli winni.”"
 pbi_publishing_industry_events.220.f.7: "„Susan Burke — pani bez lokum — od trzech miesięcy nie miała domu, w którym mogłaby mieszkać. Sędzia pokoju uznał, że nadszedł czas, aby miała własny dom, i przyznał jej mieszkanie na okres sześciu miesięcy.”"
 pbi_publishing_industry_events.220.a: "Ten zgiełk jest naszą siłą"
 pbi_publishing_industry_events.220.b: "Musimy odzyskać naszą skromność"
 pbi_publishing_industry_events.225.t: "Przełom astronomiczny"
 pbi_publishing_industry_events.225.d: "The Sun, prasa groszowa w [SCOPE.sState('target_state').GetName], donosi, że obserwatorium na afrykańskim Przylądku Dobrej Nadziei dokonało niezwykłego odkrycia przy użyciu ogromnego teleskopu działającego na zupełnie nowej zasadzie."
 pbi_publishing_industry_events.225.f: "„Korzystając z tego ogromnego teleskopu, John Herschel był w stanie wyraźnie dostrzec obiekty istniejące na Księżycu. W rezultacie był przekonany, że na Księżycu istnieje życie, i był w stanie określić prawa wszechświata, według których ono funkcjonuje.”"
 pbi_publishing_industry_events.225.a: "Nie byliśmy sami!"
 pbi_publishing_industry_events.226.t: "Nazwany nietoperz człekokształtny"
 pbi_publishing_industry_events.226.d: "Prasa groszowa [SCOPE.sState('target_state').GetName], The Sun, opublikowała kolejny raport dotyczący odkryć na Księżycu, a opinia publiczna była zachwycona zdumiewającymi szczegółami."
 pbi_publishing_industry_events.226.f: "„Nagle ujrzałem wielkie skrzydlate stworzenia powoli schodzące z klifu na równinę. Wyraźnie widziałem, że ich skrzydła przypominały skrzydła nietoperzy. Skrzydła były zbudowane z półprzezroczystej błony, zaokrąglone i wyrastające z ich grzbietów, tworząc naprawdę wspaniałą strukturę. Niektóre z nich stały naprzeciw siebie i szeroko poruszały dłońmi oraz ramionami, co wyraźnie sugerowało, że komunikowały się za pomocą gestów. Astronomowie nazwali to nieoczekiwane nowe stworzenie Vespertilio homo, czyli człowiek nietoperz. Stworzenie występowało zarówno w odmianie męskiej, jak i żeńskiej, a my kontynuowaliśmy szczegółowe obserwacje jego zwyczajów. Nie mamy wątpliwości, że są to niewinne i szczęśliwe stworzenia, lecz ich sposób czerpania przyjemności jest zbyt nieumiarkowany jak na ziemską etykietę.”"
 pbi_publishing_industry_events.226.a: "Jeśli ta historia jest prawdziwa, to jest to najwspanialsza rzecz w historii!"
 pbi_publishing_industry_events.227.t: "Prawda czy fałsz, to nie ma znaczenia"
 pbi_publishing_industry_events.227.d: "Wieść o odkryciu stworzenia na Księżycu, opublikowana przez The Sun, prasę groszową w [SCOPE.sState('target_state').GetName], stała się teraz tematem rozmów w całych Stanach Zjednoczonych, angażując zarówno naukowców, jak i intelektualistów."
 pbi_publishing_industry_events.227.f: "„Intelektualiści i czytelnicy z regionów z niespotykanym dotąd entuzjazmem i zaufaniem dzień po dniu oczekiwali poczty przychodzącej z Nowego Jorku. Czy słyszałeś już o wielkim odkryciu Johna Herschela? Czy wiesz, że na Księżycu odkryto ludzi? Gdziekolwiek się udałem, zadawano mi to samo pytanie. Był to temat, który w tamtym czasie fascynował wszystkich. Nikt nie zastanawiał się ani nie mówił, czy to prawda, czy nie.\nStudent Uniwersytetu Yale”"
 pbi_publishing_industry_events.227.a: "Nawet jeśli to kłamstwo, ten reporter zasługuje na uznanie"
 pbi_publishing_industry_events.230.t: "Niania George'a Washingtona"
 pbi_publishing_industry_events.230.d: "Gazety w [SCOPE.sState('target_state').GetName] rozpisują się o czarnoskórej kobiecie imieniem Joice Heth, która twierdzi, że była nianią George'a Washingtona."
 pbi_publishing_industry_events.230.f: "„Ta stara kobieta ma aż 161 lat. Nie ma żadnych wątpliwości co do tego faktu. Nawet gdyby powiedziała, że ma 500 lat, nikt by tego nie zakwestionował. Co więcej, P.T. Barnum, organizator tego pokazu, przedstawił nam jako dowód dokument sprzedaży, który otrzymał od niej, gdy była niewolnicą. Był on datowany na 1727 rok i stwierdzał, że Joice Heth została zakupiona przez Augustina Washingtona, ojca George'a Washingtona, gdy miała pięćdziesiąt cztery lata.”"
 pbi_publishing_industry_events.230.a: "Świat jest pełen niespodzianek!"
 pbi_publishing_industry_events.235.t: "Potwór z Loch Ness"
 pbi_publishing_industry_events.235.d: "Doniesiono o pojawieniu się niezidentyfikowanego stworzenia w Loch Ness w [SCOPE.sState('target_state').GetName], [SCOPE.sState('target_state').GetOwner.GetName], a wiadomość ta trafiła na pierwsze strony gazet."
 pbi_publishing_industry_events.235.f: "„Mieszkaniec Balnain, D. McKenzie, ujrzał obiekt przypominający kłodę lub przewróconą łódź, który wzburzał wodę podczas falistego ruchu, początkowo poruszając się powoli, a następnie stopniowo przyspieszając i znikając pod powierzchnią wody.”"
 pbi_publishing_industry_events.235.a: "Świat jest pełen niespodzianek!"
 pbi_publishing_industry_events.236.t: "Dziwne widowisko w Loch Ness"
 pbi_publishing_industry_events.236.d: "Doniesiono o pojawieniu się niezidentyfikowanego stworzenia w Loch Ness w [SCOPE.sState('target_state').GetName], [SCOPE.sState('target_state').GetOwner.GetName], a wiadomość ta trafiła na pierwsze strony gazet."
 pbi_publishing_industry_events.236.f: "„Alexander MacDonald, kamieniarz z Abriachanu, ujrzał tego dnia duże, krępe zwierzę o grubych nogach wynurzające się z Loch Ness około 50 jardów od brzegu.”"
 pbi_publishing_industry_events.236.a: "Świat jest pełen niespodzianek!"
 pbi_publishing_industry_events.237.t: "Zdjęcie chirurga"
 pbi_publishing_industry_events.237.d: "Zdjęcia niezidentyfikowanego stworzenia z Loch Ness w [SCOPE.sState('target_state').GetName], [SCOPE.sState('target_state').GetOwner.GetName], trafiają na pierwsze strony gazet."
 pbi_publishing_industry_events.237.f: "„Kontrowersje wokół obserwacji niezidentyfikowanego stworzenia w Loch Ness od dawna nie ustają, lecz to zdjęcie wykonane przez Roberta Kennetha Wilsona, londyńskiego ginekologa, kładzie kres sporom i stanowi niepodważalny dowód, że potwór z Loch Ness wciąż tam żyje.”"
 pbi_publishing_industry_events.237.a: "Świat jest pełen niespodzianek!"
 pbi_publishing_industry_events.240.t: "Wróżki z Cottingley"
 pbi_publishing_industry_events.240.d: "Zdjęcia wykonane we wsi Cottingley w [SCOPE.sState('target_state').GetName], [SCOPE.sCountry('target_country').GetName], przedstawiają wróżkę bawiącą się z młodą dziewczynką."
 pbi_publishing_industry_events.240.f: "„Niezwykłe zdjęcie zostało wykonane w [SCOPE.sCountry('target_country').GetName]. Fotografia, opublikowana za pośrednictwem Towarzystwa Teozoficznego, wyraźnie przedstawia wróżkę bawiącą się z małą dziewczynką. Towarzystwo poprosiło eksperta fotograficznego o uwierzytelnienie zdjęcia, co doprowadziło do wniosku, że nie było ono fałszerstwem. Powieściopisarz Arthur Conan Doyle twierdził w czasopiśmie spirytystycznym, że fotografia stanowiła wyraźny dowód zjawisk psychicznych.”"
 pbi_publishing_industry_events.240.a: "Świat jest pełen niespodzianek!"
 pbi_publishing_industry_events.245.t: "Mądry Hans"
 pbi_publishing_industry_events.245.d: "Koń potrafiący wykonywać obliczenia matematyczne i kalendarzowe jest tematem rozmów w [SCOPE.sState('target_state').GetName], [SCOPE.sCountry('target_country').GetName]."
 pbi_publishing_industry_events.245.f: "„Hans pytany: „Jeśli 8. dzień miesiąca przypada we wtorek, to jaka jest data następnego piątku?”, odpowiada, stukając kopytem 11 razy. Niemiecka Rada Edukacji powołała 13-osobową komisję śledczą, w której skład wchodzili weterynarz, dyrektor zoo oraz oficer kawalerii, aby zbadać tego niezwykłego konia. Komisja stwierdziła, że podczas występów Hansa nie stosowano żadnych sztuczek.”"
 pbi_publishing_industry_events.245.a: "Świat jest pełen niespodzianek!"
 pbi_publishing_industry_events.246.t: "The Secret to Wisdom"
 pbi_publishing_industry_events.246.d: "Psychologist Oskar Pfungst has unlocked the secrets of Hans, the clever horse that has become a major topic of conversation in [SCOPE.sCountry('target_country').GetName]."
 pbi_publishing_industry_events.246.f: "'When the questioner did not know the answer, Hans could rarely give the correct answer. He also found a commonality in that as the number of hoofs Hans tapped approached the answer, the questioner's facial expression and body posture gradually showed tension, which was released at the moment of the correct answer. From this, Pfungst concluded that Hans was using the questioner's physical message as a cue for his answer.'\nThe behavior of Hans to respond to the expectations of the observer by sensing the reactions of his surroundings is called the \"clever Hans effect,\" and even today the clever Hans effect has been observed to occur in the odor detection of police dogs."
 pbi_publishing_industry_events.246.a: "Clever Hans was indeed clever Hans!"
 pbi_publishing_industry_events.250.t: "Whistling Boy"
 pbi_publishing_industry_events.250.d: "Readers are amused by a small article in a [SCOPE.sState('target_state').GetName] newspaper about an untruth."
 pbi_publishing_industry_events.250.f: "'A boy in Vermont is used to working alone, and as soon as he sees that no one is around, he starts whistling. He whistles with a surprisingly loud and quiet whistling, even when he is completely unconscious and asleep, as his mouth, chest, and lungs work together of their own accord. His mother, worried, rushed to take action. She asked another boy to stay by her side at all times and hit her as soon as the whistling started.'"
 pbi_publishing_industry_events.250.a: "The world is full of surprises!"
 pbi_publishing_industry_events.300.t: "The efficacy of journalism"
 pbi_publishing_industry_events.300.d: "In [ROOT.GetCountry.GetName], everyone from the [concept_upper_strata] to the [concept_lower_strata] reads newspapers. The masses consume a wide variety of news through newspapers, from tense incidents between countries far away abroad to the bizarre murder of a local prostitute."
 pbi_publishing_industry_events.300.f: "'From this perspective, the much-mocked newspaper has made one practical contribution: it has taught people how to read and given them a taste for the printed word. It taught people how to read and gave them the hobby of reading the printed word.'\nEmile Zola (The Paris Newspaper)"
 pbi_publishing_industry_events.300.a: "We should focus on the political role newspapers play"
 pbi_publishing_industry_events.300.b: "The value of newspapers as entertainment for the people is great"
 pbi_publishing_industry_events.305.t: "Groundbreaking printing press"
 pbi_publishing_industry_events.305.d: "The performance of the new printing press introduced by [SCOPE.sCharacter('target_character').GetFullName] of [SCOPE.sCountry('target_country').GetName] at the [SCOPE.gsInterestGroup('target_ig').GetName]'s gathering has been well received as excellent."
 pbi_publishing_industry_events.305.f: "The rotary press, which rotates cylindrically distorted type plates and feeds paper into them for printing, can print more than 8,000 sheets per hour, much faster than conventional printing presses."
 pbi_publishing_industry_events.305.a: "Great idea"
 pbi_publishing_industry_events.305.b: "We don't need their help"
 pbi_publishing_industry_events.310.t: "Plans to establish a newspaper company"
 pbi_publishing_industry_events.310.d.1: "[SCOPE.sCharacter('target_character').GetFullName] plans to establish the first newspaper in [SCOPE.sState('target_state').GetName].\nThe newspaper will be a newspaper for [SCOPE.gsInterestGroup('target_ig').GetName]."
 pbi_publishing_industry_events.310.d.2: "[SCOPE.sCharacter('target_character').GetFullName] of [SCOPE.sCountry('target_country').GetName] plans to establish its first newspaper in [SCOPE.sState('target_state').GetName].\nThis will have an impact on relations with [SCOPE.sCountry('target_country').GetName]."
 pbi_publishing_industry_events.310.f: "'Our initial motivation for conceiving the idea of publishing a newspaper in [SCOPE.sState('target_state').GetName] was primarily related to the commercial demands of the various communities. That this idea met with wide agreement was amply demonstrated by the response to our offer.\nThe Advertiser'"
 pbi_publishing_industry_events.310.a: "Great idea"
 pbi_publishing_industry_events.310.b: "They should not be given a platform to speak"
 pbi_publishing_industry_events.315.t: "Argument in the newspaper"
 pbi_publishing_industry_events.315.f: "'As I am sure the wise readers of this newspaper will agree, there is no concrete basis for any of their claims, but only a bunch of lies and falsehoods to attack us. Their newspaper is at best worthless as a piece of dust paper!'"
 pbi_publishing_industry_events.315.c: "The newspapers are just making a big deal out of it"
 pbi_publishing_industry_events.320.t: "Prohibition against issuing"
 pbi_publishing_industry_events.320.d: "A court has issued a publication ban to the [SCOPE.sState('target_state').GetName] newspaper '[SCOPE.GetRootScope.GetCountry.GetCustom('pbi_newspaper_type')]' which had repeatedly made claims critical of the government."
 pbi_publishing_industry_events.320.f: "They have no political authority of any kind, yet they use newspapers to mischievously criticize the government and whisper to the public the devil's words that will lead the nation to ruin."
 pbi_publishing_industry_events.320.a: "Justice has been done"
 pbi_publishing_industry_events_320_tt.1: "The [SCOPE.sState('target_state').GetName] [GetBuildingType('building_manzoni_publishing_industry').GetName] will be inactive for 1 year."
 pbi_publishing_industry_events_320_tt.2: "The [SCOPE.sState('target_state').GetName] [GetBuildingType('building_manzoni_publishing_industry').GetName] will be inactive for 6 months."
 pbi_publishing_industry_events.320.b: "Disciplinary action should be kept to a minimum"
 pbi_publishing_industry_events.325.t: "Newsboys Strike"
 pbi_publishing_industry_events.325.d: "Newsboys in [SCOPE.sState('target_state').GetName] have launched a massive strike demanding better treatment from newspaper publishers."
 pbi_publishing_industry_events.325.f: "'Friens and feller workers. This is a time, which tries de hearts of men. Dis is de time when we've got to stick together like glue... We know what we want and we'll get it even if we are blind.'\nLouis 'Kid Blink' Baletti"
 pbi_publishing_industry_events.325.a: "This distortion must be corrected"
 pbi_publishing_industry_events.325.b: "It's just a strike, right?"
 pbi_publishing_industry_events.330.t: "Murdered prostitutes"
 pbi_publishing_industry_events.330.d: "[SCOPE.sState('target_state').GetName] newspapers have been sensationalizing the murder of a young prostitute, garnering a great deal of attention.\nSome newspapers have even published fake interviews with the real murderer."
 pbi_publishing_industry_events.330.f: "'The body of 23-year-old prostitute Helen Jewett was found in a brothel. The body was burned to a crisp in bed, having been beaten three times with a hatchet and then set on fire.\nPolice arrested Richard P. Robinson, a 19-year-old young man who was the victim's last guest, as a suspect. The suspect denies the charges. His trial is scheduled for two months from now.'"
 pbi_publishing_industry_events.330.a: "Interesting"
 pbi_publishing_industry_events.331.t: "A prejudicial trial"
 pbi_publishing_industry_events.331.d: "When the trial of Richard P. Robinson, arrested for the murder of Helen Jewett, began in a [SCOPE.sState('target_state').GetName] courtroom, the newspapers were divided in a heated debate between those sympathetic to Jewett, who came from a working-class background, and those who said prostitutes had no room for sympathy, but the trial came to a quick end."
 pbi_publishing_industry_events.331.f: "'Even though all the evidence and testimony presented suggested that the defendant was guilty, the judge instructed the jury to disregard the testimony because most of the witnesses who testified were prostitutes. As a result, the defendant was acquitted in less than 30 minutes!'"
 pbi_publishing_industry_events.331.a: "How can this be called a fair trial?"
 pbi_publishing_industry_events.331.b: "Is the life of a promising young man the same as that of a prostitute?"
 pbi_publishing_industry_events.335.t: "Mass Murder"
 pbi_publishing_industry_events.335.d: "The perpetrators of a series of murders in a [SCOPE.sState('target_state').GetName] suburb of [SCOPE.sState('target_state').GetOwner.GetName] have been caught, and the brutal descriptions of the crimes and their motives that are revealed one after another are attracting much attention."
 pbi_publishing_industry_events.335.f: "'A laborer working in a field in the suburbs of Paris dug up the bodies of a woman and her five children from the ground. The woman had been stabbed with a knife in over 30 places, and the children had been killed in various ways, including by having their throats slit, strangled, and their bellies ripped open. The perpetrator of this unbelievably brutal murder was a mechanic named Jean-Baptiste Tropmann. He confessed to committing the murder at the request of the victim's husband, who suspected the victim of infidelity. The husband, Jean-Kink, is missing and the police are still searching for him.'"
 pbi_publishing_industry_events.335.a: "The devil's work!"
 pbi_publishing_industry_events.336.t: "Public Execution"
 pbi_publishing_industry_events.336.d: "A public execution by guillotine was held for a series of murders in a suburb of [SCOPE.sState('target_state').GetName] in [SCOPE.sState('target_state').GetOwner.GetName], attracting a large crowd of onlookers."
 pbi_publishing_industry_events.336.f: "'The police found the victim's husband, who had been tracked down as a material witness, dead. Trotman admitted that his testimony was a lie and testified that the crime was committed from the beginning to rob Jean Kink of her property.'"
 pbi_publishing_industry_events.336.a: "There is no room for pity"
 pbi_publishing_industry_events.340.t: "The telegraph cord hung the culprit!"
 pbi_publishing_industry_events.340.d: "In [SCOPE.sState('target_state').GetName], [SCOPE.sState('target_state').GetOwner.GetName], a criminal who escaped by train was successfully apprehended at the station where he fled using the telegraph, which has become a hot topic of discussion."
 pbi_publishing_industry_events.340.f: "'From Slough Station to Paddington Station. A murder has occurred at Salt Hill in this area. Witnesses saw the suspect buy a first-class ticket to London and board the 7:42 a.m. train from this station. The suspect is dressed in Quaker garb, a brown cloak with a hem that reaches down to his feet, and is in the second last compartment of the second first class car of the same train.'"
 pbi_publishing_industry_events.340.a: "This is a triumph of science"
 pbi_publishing_industry_events.400.t: "Fourth Estate"
 pbi_publishing_industry_events.400.d: "[SCOPE.sCharacter('target_leader').GetFullName] of the [SCOPE.gsInterestGroup('target_ig').GetName] sounded the alarm in Congress, describing journalism as the 'Fourth Estate'."
 pbi_publishing_industry_events.400.f: "'There is now a Fourth Estate in our society that is more powerful and influential than all the royalty, clergy, nobility, and citizens combined. It is journalism.\nIts power is mighty, but it can be the power to destroy a nation or to make it prosper. It cannot be overemphasized that state power should guarantee journalism's freedom of the press, but only if they behave properly!'"
 pbi_publishing_industry_events.400.a: "They cannot control them, perhaps not even themselves!"
 pbi_publishing_industry_events.400.b: "Everything needs a guarantee"
 pbi_publishing_industry_events_400_tt: "The following amendments to all domestic [GetBuildingType('building_manzoni_publishing_industry').GetName]: "
 pbi_publishing_industry_events.405.t: "Newspaper Publisher Arrested"
 pbi_publishing_industry_events.405.d: "Local police in [SCOPE.sState('target_state').GetName] arrested [SCOPE.sCharacter('target_character').GetFullName], publisher of the newspaper [SCOPE.GetRootScope.GetCountry.GetCustom('pbi_newspaper_type')], who had repeatedly published articles critical of the government."
 pbi_publishing_industry_events.405.f: "'Sovereign voters!\nGentlemen, you have been deceived!\nConfront armed might with unyielding force!\nShut down every factory.\nShut down every company.\nShut down the stock exchanges.\nShut down the theaters!\nResign all self-respecting bureaucrats.\nAll men must go on strike.\nEmile de Girardin, People's Commissar."
 pbi_publishing_industry_events.405.a: "Let's make an example to our peers"
 pbi_publishing_industry_events.405.b: "[SCOPE.sCharacter('target_character').GetSheHe] must be protected under the law"
 pbi_publishing_industry_events.405.c: "Let's get them to cool down a little"
 pbi_publishing_industry_events.410.t: "Order to cease publication of newspaper"
 pbi_publishing_industry_events.410.d: "The court ruled against a [SCOPE.sState('target_state').GetName] newspaper that repeatedly criticizes the government excessively, suspending its publication."
 pbi_publishing_industry_events.410.f: "They have no political authority of any kind, yet they use newspapers to mischievously criticize the government and whisper to the public the devil's words that will lead the nation to ruin."
 pbi_publishing_industry_events.410.a: "Let's make an example to our peers"
 pbi_publishing_industry_events.410.b: "Freedom of the press must be protected"
 pbi_publishing_industry_events.410.c: "There is a limit to everything"
 pbi_publishing_industry_events.415.t: "Pornographic Novel"
 pbi_publishing_industry_events.415.d: "A court has ordered the removal of sexually explicit and obscene passages from a romance novel published by a [SCOPE.sState('target_state').GetName] publisher because they were too explicit and obscene."
 pbi_publishing_industry_events.415.f: "'Eventually, the man's hands @censored!@censored!@censored!@censored! the woman's @censored!@censored!@censored!@censored!, and the momentum, as it @censored!@censored!, culminated in @censored!@censored!@censored!@censored!@censored!@censored!@censored!@censored!. The woman @censored!@censored!@censored!@censored! it @censored!@censored!@censored!@censored!, and @censored!@censored!@censored!@censored!@censored!@censored!@censored!@censored! was @censored!@censored!@censored!@censored!@censored!@censored!@censored!@censored!!'"
 pbi_publishing_industry_events.415.a: "Art will only be corrupted"
 pbi_publishing_industry_events.415.b: "I don't know what this is!"
 pbi_publishing_industry_events.420.t: "Revealing State Secrets"
 pbi_publishing_industry_events.420.d: "The information published as a scoop by the [SCOPE.sState('target_state').GetName] newspaper, [SCOPE.GetRootScope.GetCountry.GetCustom('pbi_newspaper_type')], was known only to government insiders."
 pbi_publishing_industry_events.420.f: "'French newspapers are more than happy to chat about political secrets in order to increase subscriptions.'\nHonoré de Balzac (Physiology of Journalism)"
 pbi_publishing_industry_events.420.a: "Immediately remove those involved!"
 pbi_publishing_industry_events.420.b: "Best not to touch this one"
 pbi_publishing_industry_events.425.t: "Calls for legal reform"
 pbi_publishing_industry_events.425.d: "A leading [SCOPE.sState('target_state').GetName] newspaper supports the [SCOPE.gsInterestGroup('target_ig').GetName]'s claim that [SCOPE.sPoliticalMovement('target_movement').GetName]."
 pbi_publishing_industry_events.425.f: "'There is no doubt that [SCOPE.sPoliticalMovement('target_movement').GetName], which we [SCOPE.gsInterestGroup('target_ig').GetName] have been advocating for years, is what is needed for the future of this country.'"
 pbi_publishing_industry_events.425.a: "The newspaper's claims are being used for propaganda by certain groups"
 pbi_publishing_industry_events.425.b: "Let's counter with newspapers here too"
 pbi_publishing_industry_events.425.c: "It's a chance to showcase the government's generosity"
 pbi_publishing_industry_events.430.t: "Newspapers are fomenting social unrest"
 pbi_publishing_industry_events.430.d.1: "The [SCOPE.sState('target_state').GetName] newspaper, The [SCOPE.GetRootScope.GetCountry.GetCustom('pbi_newspaper_type')], is reporting nothing but speculation regarding an epidemic outbreak at a [SCOPE.sBuilding('target_building').GetName] in [SCOPE.sState('target_state_2').GetName], unnecessarily fueling social unrest."
 pbi_publishing_industry_events.430.d.2: "The [SCOPE.sState('target_state').GetName] newspaper, The [SCOPE.GetRootScope.GetCountry.GetCustom('pbi_newspaper_type')], is reporting nothing but speculation about the accident at a [SCOPE.sBuilding('target_building').GetName] in [SCOPE.sState('target_state_2').GetName], unnecessarily fueling social unrest."
 pbi_publishing_industry_events.430.d.3: "The [SCOPE.sState('target_state').GetName] newspaper, The [SCOPE.GetRootScope.GetCountry.GetCustom('pbi_newspaper_type')], is reporting nothing but speculation about the poor crop of [SCOPE.sBuilding('target_building').GetName] in [SCOPE.sState('target_state_2').GetName], unnecessarily fueling social unrest."
 pbi_publishing_industry_events.430.f.1: "'Our correspondent reports that many of the workers are dead or ill due to an outbreak of the disease, and the plantation and neighboring villages are now in ruins. The executives of the company that operates the plantation have also begun to return to their home countries, and the impact on our way of life will be unavoidable.'"
 pbi_publishing_industry_events.430.f.2: "'Our correspondent informs us that there has been a major accident due to a rock fall and the mine has been closed. We have also been informed that the capitalists who had invested in the mine have already decided to close it down, and the impact on our livelihood will be unavoidable.'"
 pbi_publishing_industry_events.430.f.3: "„Nasz korespondent informuje nas, że skutki suszy, która potrwa kilka miesięcy, będą poważne i niemal z pewnością doprowadzą do słabych zbiorów. Wpływ niedoboru żywności na nasz sposób życia będzie nieunikniony.”"
 pbi_publishing_industry_events.430.a: "Nie możemy tolerować takich fałszerstw"
 pbi_publishing_industry_events.430.b: "Musimy podjąć działania"
 pbi_publishing_industry_events.315.d.1: "W [SCOPE.sState('target_state').GetName] gazeta popierająca [SCOPE.sParty('target_party_2').GetName] skrytykowała twierdzenia gazety popierającej [SCOPE.sParty('target_party_1').GetName], co doprowadziło do gorącej wymiany krytyki między obiema gazetami na łamach codziennych wydań."
 pbi_publishing_industry_events.315.d.2: "W [SCOPE.sState('target_state').GetName] gazeta popierająca [SCOPE.gsInterestGroup('target_ig_2').GetName] skrytykowała twierdzenia gazety popierającej [SCOPE.sParty('target_party_1').GetName], co doprowadziło do gorącej wymiany krytyki między obiema gazetami na co dzień."
 pbi_publishing_industry_events.315.d.3: "W [SCOPE.sState('target_state').GetName] gazeta popierająca [SCOPE.gsInterestGroup('target_ig_2').GetName] skrytykowała twierdzenia gazety popierającej [SCOPE.gsInterestGroup('target_ig_1').GetName], co doprowadziło do gorącej wymiany krytyki między obiema gazetami na co dzień."
 pbi_publishing_industry_events.315.a: "Argumentacja [SCOPE.gsInterestGroup('target_ig_1').GetName] jest bardziej przekonująca."
