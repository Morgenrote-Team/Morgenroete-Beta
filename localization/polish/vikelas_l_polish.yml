 vikelas.100.t: "Olimpijskie Marzenie"
 vikelas.100.d: "[SCOPE.sCharacter('vikelas_ioc_president_scope').GetFullName] pragnie wskrzesić starożytne Igrzyska Olimpijskie w nowoczesnej formie. Międzynarodowe zawody sportowe miałyby odbywać się co cztery lata."
 vikelas.100.f: "Idea olimpijska rozwijała się coraz prężniej, czerpiąc inspirację ze starożytnego przekonania, że sprawny umysł potrzebuje również sprawnego ciała. Przyczyniła się do tego także archeologia: pod koniec XIX wieku Ernst Curtius prowadził wykopaliska w Olimpii, rozbudzając na nowo zainteresowanie Igrzyskami Olimpijskimi. Do tego dochodziły społeczna idea „przetrwania najlepiej przystosowanych”, wyrosła na gruncie teorii ewolucji, oraz przekonanie, że w epoce pracy fabrycznej ćwiczenia fizyczne są niezbędne. Nowożytne Igrzyska Olimpijskie jako wydarzenie międzynarodowe miały przezwyciężać narodowy egoizm i przyczyniać się do pokoju. Dążenie do bicia rekordów sportowych w myśl dewizy „Citius, altius, fortius” (Szybciej, Wyżej, Silniej) miało symbolizować postęp przełamujący bariery społeczne."
 vikelas.100.g: "Załóż Międzynarodowy Komitet Olimpijski."
 vikelas.102.t: "Międzynarodowy Komitet Olimpijski"
 vikelas.102.d: "Aby wskrzesić Igrzyska Olimpijskie, [SCOPE.sCharacter('vikelas_ioc_president_scope').GetFullName] powołał Międzynarodowy Komitet Olimpijski (MKOl), który będzie odpowiadać za organizację i zapewnienie ciągłości nowożytnej odsłony starożytnych igrzysk."
 vikelas.102.f: "W skład pierwszego MKOl wchodzili przede wszystkim zaufani ludzie osoby stojącej na jego czele — [SCOPE.sCharacter('vikelas_ioc_president_scope').GetFullName]. Początkowo tworzyli niewielki krąg. Z czasem do MKOl mieli dołączyć kolejni członkowie, a grono ludzi o wspólnych przekonaniach miało przekształcić się w międzynarodową organizację."
 vikelas.102.g: "Krok naprzód dla sportu krajowego i międzynarodowego."
 vikelas.103.t: "Igrzyska Olimpijskie: grecka sprawa?"
 vikelas.103.d: "Po założeniu Międzynarodowego Komitetu Olimpijskiego pojawia się pytanie, czy Igrzyska będą zawsze odbywać się w Grecji, czy też co cztery lata zmieniać miejsce rozgrywania."
 vikelas.103.f: "Przedstawiciele różnych państw zamierzali nadać Igrzyskom Olimpijskim prawdziwie międzynarodowy charakter, organizując je w różnych krajach. Miejsce ich rozgrywania miało zatem zmieniać się co cztery lata, a o jego wyborze miał decydować Zarząd. Ponieważ jednak to Grecja wskrzesiła igrzyska, stanowisko to budzi kontrowersje. Ostatecznie [SCOPE.sCharacter('vikelas_ioc_president_scope').GetFullName] sprowadził kwestię miejsca rozgrywania zawodów do prostej zasady: „Nasze igrzyska, nasze zasady”. Przyjęcie takiego rozwiązania nadałoby Zarządowi charakter czysto honorowy i znacznie ograniczyłoby jego uprawnienia."
 vikelas.103.g: "Igrzyska Olimpijskie to grecka sprawa."
 vikelas.103.h: "Igrzyska Olimpijskie to sprawa Międzynarodowa."
 vikelas.104.t: "Międzynarodowy Komitet Olimpijski"
 vikelas.104.d: "Aby wskrzesić Igrzyska Olimpijskie, [SCOPE.sCharacter('vikelas_ioc_president_scope').GetFullName] powołał Międzynarodowy Komitet Olimpijski (MKOl), który będzie odpowiadać za organizację i zapewnienie ciągłości nowożytnej odsłony starożytnych igrzysk. Igrzyska mają odbywać się w Grecji co cztery lata."
 vikelas.104.f: "W skład pierwszego MKOl wchodzili przede wszystkim zaufani ludzie osoby stojącej na jego czele — [SCOPE.sCharacter('vikelas_ioc_president_scope').GetFullName]. Początkowo tworzyli niewielki krąg. Z czasem do MKOl mieli dołączyć kolejni członkowie, a grono ludzi o wspólnych przekonaniach miało przekształcić się w międzynarodową organizację. Przedstawiciele różnych państw zamierzali nadać Igrzyskom Olimpijskim prawdziwie międzynarodowy charakter, organizując je w różnych krajach. Jednak ze względu na silne wpływy greckie MKOl musiał porzucić pomysł zmiany miejsca rozgrywania zawodów. Igrzyska Olimpijskie odbywają się zatem w Grecji co cztery lata."
 vikelas.104.g: "Ich Igrzyska, ich Zasady..."
 vikelas.105.t: "Odrodzenie Igrzysk Olimpijskich"
 vikelas.105.d: "Po posiedzeniu Międzynarodowego Komitetu Olimpijskiego (MKOl) Zarząd zdecydował, że pierwsze nowożytne Igrzyska odbędą się w Grecji."
 vikelas.105.f: "Jednym z pierwszych zadań MKOl było ustalenie miejsca rozgrywania nowych Igrzysk. Nawiązując do starożytnej tradycji, komitet jednogłośnie zdecydował, że Igrzyska powinny odbyć się w Grecji, aby upamiętnić ich antyczne korzenie. Następnie co cztery lata gospodarzem Igrzysk Olimpijskich będzie inne państwo. Miejsce rozgrywania zawodów wybiera Zarząd, którego skład jest odnawiany co cztery lata."
 vikelas.105.g: "Nie możemy się doczekać!"
 vikelas.106.t: "[GetRomanNumeral(FixedPointToInt(GetGlobalVariable('vikelas_olympic_games_number_global_var').GetValue))]. Igrzyska Olimpijskie Rozpoczęte"
 vikelas.106.d: "Rozpoczęły się pierwsze nowożytne Igrzyska Olimpijskie! Cały świat przybył do Grecji. W tym międzynarodowym wydarzeniu biorą udział sportowcy z #BLUE [GetGlobalVariable('vikelas_olympic_participants_global_var').GetValue]#! państw."
 vikelas.106.f: "Pierwsze nowożytne Igrzyska Olimpijskie rozpoczęły się [TimeKeeper.GetCurrentDate.Format('wy')], po tym jak w 393 roku cesarz rzymski Teodozjusz I zakazał organizowania starożytnych Igrzysk Olimpijskich ze względu na związany z nimi kult pogańskich bogów. Choć podczas zawodów niemal nie odnotowano wybitnych osiągnięć sportowych, nawet jak na ówczesne standardy, powszechnie uznano je za wielki sukces, który w znacznym stopniu przyczynił się do trwałego odrodzenia Igrzysk Olimpijskich."
 vikelas.106.g: "Igrzyska wracają do domu!"
 vikelas.107.g: "Szybciej! Wyżej! Dalej!"
 vikelas.108.t: "[GetRomanNumeral(FixedPointToInt(GetGlobalVariable('vikelas_olympic_games_number_global_var').GetValue))]. Igrzyska Olimpijskie Zakończone"
 vikelas.108.d: "Pierwsze Igrzyska Olimpijskie dobiegły końca. Widzowie, prasa i sportowcy są zachwyceni: wskrzeszono wielowiekową tradycję i nadano jej nowoczesną formę."
 vikelas.108.f: "[SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_winners_type')] Również inne państwa mogą pochwalić się znakomitymi wynikami sportowymi. Spośród [GetGlobalVariable('vikelas_olympic_participants_global_var').GetValue|0V] państw uczestniczących w Igrzyskach złote medale zdobyły:\n[SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_medal_rank_1_this_year_global_type')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_medal_rank_2_this_year_global_type')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_medal_rank_3_this_year_global_type')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_medal_rank_4_this_year_global_type')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_medal_rank_5_this_year_global_type')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_medal_rank_6_this_year_global_type')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_medal_rank_7_this_year_global_type')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_medal_rank_8_this_year_global_type')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_medal_rank_9_this_year_global_type')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_medal_rank_10_this_year_global_type')]"
 vikelas.108.g: "Citius, altius, fortius."
 vikelas.109.d: "Grecja po raz kolejny zaprosiła cały świat do udziału w Igrzyskach Olimpijskich. W tym międzynarodowym wydarzeniu biorą udział sportowcy z #BLUE [GetGlobalVariable('vikelas_olympic_participants_global_var').GetValue]#! państw."
 vikelas.109.f: "Ponieważ to Grecja założyła MKOl, było jasne, że w przyszłości, podobnie jak w przeszłości, Igrzyska będą odbywać się wyłącznie na helleńskiej ziemi. Zapewniło to ciągłość tradycji, a zarazem przyniosło Grecji międzynarodowe uznanie, dzięki któremu to niegdyś małe królestwo zyskało szczególną pozycję na arenie światowej."
 vikelas.110.t: "Olimpijski Entuzjazm"
 vikelas.110.d: "[SCOPE.sCharacter('vikelas_olympics_enthusiast_scope').GetFullName] z fascynacją wyczekuje Igrzysk Olimpijskich, które wkrótce odbędą się w Grecji. [SCOPE.sCharacter('vikelas_olympics_enthusiast_scope').GeSheHe|U] bierze sprawy w swoje ręce, by dzięki [SCOPE.sCharacter('vikelas_olympics_enthusiast_scope').GetHerHis] staraniom państwo [ROOT.GetCountry.GetName] dołączyło do nowo powstałego Międzynarodowego Komitetu Olimpijskiego."
 vikelas.110.f: "Nie powinno dziwić, że wielu uczonych angażowało się w działania na rzecz powodzenia Igrzysk Olimpijskich — wśród nich było liczne grono miłośników starożytności, których zainteresowania skłaniały do popierania odrodzenia igrzysk. Choć często sami nie brali w nich udziału, starali się nawiązać kontakt z MKOl. Uważali również, że udział reprezentacji ich kraju w tym międzynarodowym wydarzeniu jest zaszczytem dla narodu."
 vikelas.110.g: "Inicjatywa godna pochwały."
 vikelas.112.t: "Nowy Zarząd MKOl Wybrany"
 vikelas.112.d: "Wybrano nowy Zarząd MKOl."
 vikelas.112.f: "Zarząd MKOl jest wybierany co cztery lata. Stałe miejsca w Zarządzie zachowują jedynie państwo założycielskie oraz państwo, z którego pochodzi Przewodniczący. Pozostałe miejsca są przydzielane według następującego klucza: 5 Wielkich Mocarstw, 2 państwa z Europy, 2 państwa z Ameryki, 2 państwa z Azji, jedno państwo z Afryki i jedno państwo z Oceanii. Zarząd wybiera spośród państw członkowskich MKOl gospodarza następnych Igrzysk Olimpijskich."
 vikelas.113.t: "Miejsce Następnych Igrzysk Olimpijskich"
 vikelas.113.d: "Członkowie Zarządu MKOl zebrali się, aby wybrać miejsce rozgrywania następnych Igrzysk Olimpijskich."
 vikelas.113.f: "Do wyboru są trzy państwa członkowskie MKOl, które nie gościły Igrzysk Olimpijskich w ciągu ostatnich 20 lat. W wyniku korupcji do listy może dołączyć czwarte państwo. Wybór zależy od reputacji państwa i jego powiązań międzynarodowych. Państwa zależne i ich zwierzchnicy, sojusznicy oraz członkowie unii celnych będą głosować na siebie nawzajem. Znaczenie mają również stan stosunków dyplomatycznych i niesława."
 vikelas.113.g: "[SCOPE.sCountry('vikelas_olympics_candidate_1').GetName]"
 vikelas.113.h: "[SCOPE.sCountry('vikelas_olympics_candidate_2').GetName]"
 vikelas.113.i: "[SCOPE.sCountry('vikelas_olympics_candidate_3').GetName]"
 vikelas.113.j: "[SCOPE.sCountry('vikelas_olympics_candidate_4').GetName]"
 vikelas.113.k: "[SCOPE.sCountry('vikelas_olympics_candidate_fallback').GetName]"
 vikelas.114.t: "Następne Igrzyska Olimpijskie w państwie [SCOPE.sCountry('vikelas_olympics_candidate_scope').GetNameNoFlag]"
 vikelas.114.d: "MKOl podjął decyzję. Państwo [SCOPE.sCountry('vikelas_olympics_candidate_scope').GetName] ma najlepsze warunki do organizacji następnych Igrzysk Olimpijskich."
 vikelas.114.f: "Organizacja Igrzysk Olimpijskich to prestiżowe przedsięwzięcie. Przygotowania wiążą się z pewnymi kosztami, ale wysiłek się opłaca."
 vikelas.114.g: "Do zobaczenia w [SCOPE.sCountry('vikelas_olympics_candidate_scope').GetNameNoFlag]!"
 vikelas.115.g: "Do zobaczenia w... Zaraz, chwileczkę, to u nas? Hura!"
 vikelas.116.d: "Cały świat przybył do [ROOT.GetCountry.GetName]. W tym międzynarodowym wydarzeniu biorą udział sportowcy z #BLUE [GetGlobalVariable('vikelas_olympic_participants_global_var').GetValue]#! państw. Jesteśmy dumni, że możemy być gospodarzami. Oby nasi sportowcy wykorzystali przewagę własnego terenu!"
 vikelas.116.f: "„W Igrzyskach Olimpijskich liczy się nie zwycięstwo, lecz udział; w Życiu liczy się nie triumf, lecz walka; najważniejsze jest nie to, by zwyciężyć, lecz by dobrze walczyć. Krzewienie tych zasad służy budowaniu silniejszej i odważniejszej, a przede wszystkim uczciwszej i szlachetniejszej ludzkości”. -Pierre de Coubertin"
 vikelas.116.g: "Niech rozpoczną się Igrzyska!"
 vikelas.117.d: "Cały świat przybył do [SCOPE.sCountry('vikelas_olympic_country').GetName]. W tym międzynarodowym wydarzeniu biorą udział sportowcy z #BLUE [GetGlobalVariable('vikelas_olympic_participants_global_var').GetValue]#! państw."
 vikelas.118.d: "Nasi sportowcy dzielnie walczyli. Teraz czas wrócić do kraju w chwale."
 vikelas.119.t: "Międzynarodowy Komitet Olimpijski"
 vikelas.119.d: "Aby wskrzesić Igrzyska Olimpijskie, [SCOPE.sCharacter('vikelas_ioc_president_scope').GetFullName] powołał Międzynarodowy Komitet Olimpijski (MKOl), który będzie odpowiadać za organizację i zapewnienie ciągłości nowożytnej odsłony starożytnych igrzysk. Zdecydowano, że pierwsze igrzyska ery nowożytnej odbędą się w [ROOT.GetCountry.GetName]."
 vikelas.119.f: "W skład pierwszego MKOl wchodzili przede wszystkim zaufani ludzie osoby stojącej na jego czele, [SCOPE.sCharacter('vikelas_ioc_president_scope').GetFullName]. Początkowo tworzyli niewielki krąg. Z czasem do MKOl mieli dołączyć kolejni członkowie, a grono ludzi o wspólnych przekonaniach miało przekształcić się w międzynarodową organizację. Jedna z pierwszych decyzji dotyczyła miejsca rozgrywania pierwszych Igrzysk Olimpijskich. Ponieważ obecnie nie istnieje suwerenne greckie państwo narodowe, któremu można by powierzyć to zadanie, zdecydowano, że gospodarzem Igrzysk będzie kraj założycielski, [ROOT.GetCountry.GetName]. Następnie Zarząd miał co cztery lata wyznaczać inne miejsce rozgrywania zawodów."
 vikelas.119.g: "W takim razie zorganizujemy igrzyska u siebie."
 vikelas.120.t: "Międzynarodowy Komitet Olimpijski"
 vikelas.120.d: "Aby wskrzesić Igrzyska Olimpijskie, [SCOPE.sCharacter('vikelas_ioc_president_scope').GetFullName] powołał Międzynarodowy Komitet Olimpijski (MKOl), który będzie odpowiadać za organizację i zapewnienie ciągłości nowożytnej odsłony starożytnych igrzysk. Zdecydowano, że pierwsze igrzyska ery nowożytnej odbędą się w [SCOPE.sCountry('vikelas_olympics_candidate_scope').GetNameNoFormatting]."
 vikelas.120.f: "W skład pierwszego MKOl wchodzili przede wszystkim zaufani ludzie osoby stojącej na jego czele, [SCOPE.sCharacter('vikelas_ioc_president_scope').GetFullName]. Początkowo tworzyli niewielki krąg. Z czasem do MKOl mieli dołączyć kolejni członkowie, a grono ludzi o wspólnych przekonaniach miało przekształcić się w międzynarodową organizację. Jedna z pierwszych decyzji dotyczyła miejsca rozgrywania pierwszych Igrzysk Olimpijskich. Ponieważ obecnie nie istnieje suwerenne greckie państwo narodowe, któremu można by powierzyć to zadanie, zdecydowano, że gospodarzem Igrzysk będzie kraj założycielski, [SCOPE.sCountry('vikelas_olympics_candidate_scope').GetNameNoFlag]. Następnie Zarząd miał co cztery lata wyznaczać inne miejsce rozgrywania zawodów."
 vikelas.120.g: "Do zobaczenia w [SCOPE.sCountry('vikelas_olympics_candidate_scope').GetNameNoFlag]"
 vikelas_3_winners_loc: "Tegoroczne Igrzyska Olimpijskie mają nie 1 czy 2 zwycięzców, lecz aż 3! [GetGlobalVariable('vikelas_medal_rank_1_this_year_global_var').GetCountry.GetName], [GetGlobalVariable('vikelas_medal_rank_2_this_year_global_var').GetCountry.GetName] i [GetGlobalVariable('vikelas_medal_rank_3_this_year_global_var').GetCountry.GetName] zdobyły po [GetGlobalVariable('vikelas_medal_rank_1_this_year_global_var').GetVariable('vikelas_gold_medals_this_year_var').GetValue|0V] @vikelas_gold_medals! złotych medali."
 vikelas_2_winners_loc: "Zarówno [GetGlobalVariable('vikelas_medal_rank_1_this_year_global_var').GetCountry.GetName], jak i [GetGlobalVariable('vikelas_medal_rank_2_this_year_global_var').GetCountry.GetName] zdobyły po [GetGlobalVariable('vikelas_medal_rank_1_this_year_global_var').GetVariable('vikelas_gold_medals_this_year_var').GetValue|0V] @vikelas_gold_medals! złotych medali. Oznacza to, że z obu krajów pochodzą najlepsi sportowcy świata."
 vikelas_1_winner_loc: "[GetGlobalVariable('vikelas_medal_rank_1_this_year_global_var').GetCountry.GetName] dominuje na tych Igrzyskach Olimpijskich, zdobywając [GetGlobalVariable('vikelas_medal_rank_1_this_year_global_var').GetVariable('vikelas_gold_medals_this_year_var').GetValue|0V] @vikelas_gold_medals! złotych medali."
 vikelas_medal_rank_1_this_year_global_loc: "\n1.   [GetGlobalVariable('vikelas_medal_rank_1_this_year_global_var').GetVariable('vikelas_gold_medals_this_year_var').GetValue|V0] - [GetGlobalVariable('vikelas_medal_rank_1_this_year_global_var').GetCountry.GetName]"
