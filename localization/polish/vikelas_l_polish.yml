 vikelas.501.t: "[ROOT.GetCountry.GetAdjectiveNoFormatting] Klub Samochodowy"
 vikelas.501.d: "[ROOT.Var('vikelas_racer_var').GetCharacter.GetFullName] uchodzi za zapalonego kierowcę i z tej okazji założył Klub Samochodowy wraz z osobami podzielającymi jego pasję. Jego celem jest wzmocnienie krajowego przemysłu samochodowego oraz organizowanie krajowych wydarzeń motoryzacyjnych."
 vikelas.501.f: "Już w połowie lat 90. XIX wieku Automobile Club de France (ACF), założony w 1895 roku jako pierwszy klub samochodowy na świecie, organizował raz w roku wyścig stanowiący najważniejsze wydarzenie sezonu. Były to tak zwane wyścigi „z miasta do miasta”, rozgrywane na publicznych drogach pozamiejskich, w których uczestnicy startowali pojedynczo, w określonych odstępach czasu. Jednym z powodów powstania ACF była dyskwalifikacja Alberta de Diona w wyścigu Paryż–Rouen w 1894 roku. W kolejnych latach rozpoczął się okres gwałtownego rozwoju, a coraz mocniejsze pojazdy znacznie zwiększały niebezpieczeństwa związane ze sportami motorowymi. Dlatego w 1901 roku ACF po raz pierwszy wprowadził zasady, które można uznać za pierwszy na świecie regulamin sportów motorowych. Kluczową innowacją był podział pojazdów na kategorie, obowiązujący podczas wszystkich zawodów wspieranych przez ACF. Wprowadzone w ten sposób ograniczenia masy miały początkowo pomóc zmniejszyć ogromną liczbę uszkodzeń opon spowodowanych przeciążeniem."
 vikelas.501.g: "Sport pełen emocji!"
 vikelas.502.t: "Pierwszy Wyścig Grand Prix"
 vikelas.502.d: "Sporty motorowe wkraczają w rewolucyjny etap: dzięki wyścigom Grand Prix międzynarodowe zawody będą odbywać się kolejno we wszystkich krajach, w których popularne są sporty motorowe. W ten sposób narodziły się międzynarodowe mistrzostwa. [SCOPE.sCountry('vikelas_gp_founder_scope').GetName] zaprosił wszystkie kraje posiadające Klub Samochodowy do udziału w swoim pierwszym wyścigu Grand Prix w nadchodzącym roku."
 vikelas.502.f: "Coroczne wyścigi o Puchar Gordona Bennetta, rozgrywane w latach 1900–1905, były pierwszą próbą zorganizowania samochodowych mistrzostw świata. Wobec stale rosnących prędkości ACF wprowadził w 1902 roku pierwsze przepisy techniczne w postaci tak zwanej formuły wyścigowej, której musiały przestrzegać uczestniczące w zawodach samochody. Mimo to liczba wypadków nadal rosła, dlatego od 1903 roku można było organizować wyłącznie wyścigi na zamkniętych trasach okrężnych. Następcą wyścigów o Puchar Gordona Bennetta stał się główny wyścig organizowany przez ACF, który w 1906 roku po raz pierwszy odbył się pod nazwą Grand Prix. Pierwszym zwycięzcą Grand Prix w historii został węgierski kierowca Ferenc Szisz, prowadzący samochód marki Renault."
 vikelas.502.g: "A więc jest coś do wygrania?"
 vikelas.503.t: "Association Internationale des Automobile Clubs Reconnus"
 vikelas.503.d: "Dziś w [GetGlobalVariable('vikelas_aiacr_seat_global_var').GetStateRegion.GetCityHubName] założono Międzynarodowe Stowarzyszenie Automobilowe. Jego pełna nazwa brzmi Association Internationale des Automobile Clubs Reconnus (AIACR)."
 vikelas.503.f: "Aby producenci samochodów mogli uczestniczyć we wszystkich międzynarodowych wyścigach, konieczne stało się ujednolicenie przepisów technicznych i sportowych, które dotychczas Francuski Klub Samochodowy ustalał samodzielnie na potrzeby swoich zawodów w ramach poszczególnych formuł Grand Prix. Zadanie uregulowania tych zasad na szczeblu międzynarodowym miało przypaść Międzynarodowemu Stowarzyszeniu Automobilowemu. Stowarzyszenie zostało założone 20 czerwca 1904 roku w Paryżu pod nazwą Association Internationale des Automobile Clubs Reconnus (AIACR), po tym jak kilka dni wcześniej kluby samochodowe najważniejszych krajów uczestniczących w wyścigach podjęły decyzję o jego utworzeniu podczas zawodów o Puchar Gordona Bennetta w Bad Homburg. Po II wojnie światowej AIACR zmieniło nazwę na FIA."
 vikelas.503.g: "Od teraz wyścigi samochodowe mają charakter międzynarodowy!"
 vikelas.504.t: "Nowy Tor Wyścigowy Grand Prix"
 vikelas.504.d: "Kolejny członek AIACR wybudował oficjalny tor wyścigowy Grand Prix. W corocznym kalendarzu wyścigowym znajduje się obecnie #G [GetGlobalVariable('vikelas_num_grand_prix_tracks_global_var').GetValue]#! #V torów wyścigowych Grand Prix#!."
 vikelas.504.f: "„Wyścigi samochodowe, walki byków i wspinaczka górska to jedyne prawdziwe sporty… cała reszta to gry”. – Ernest Hemingway"
 vikelas.504.g: "Zarezerwuj miejsca VIP na trybunach."
 vikelas.505.t: "Lokalizacja Producenta Samochodów Wyścigowych"
 vikelas.505.d: "Dzięki [SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_race_team_name_type')] kraj [GetPlayer.GetName] posiada swój pierwszy profesjonalny zespół wyścigowy. Fabryka samochodów w [SCOPE.sState('vikelas_team_state').GetName] cieszy się obecnie dużym popytem dzięki renomie marki."
 vikelas.505.f: "Wraz ze stopniowym przechodzeniem od indywidualnych kierowców do profesjonalnych zespołów wyścigowych zatrudniających kierowców fabrycznych sporty motorowe zmieniły się na zawsze. Amatorzy startujący w samodzielnie zbudowanych samochodach stali się rzadkością. Choć wciąż zdarzało się, że ekscentryczni arystokraci posiadający licencje innych producentów samochodów poszukiwali mocnych wrażeń na torze, to rozwój konstrukcji samochodów stał się prawdziwym centrum sportów motorowych."
 vikelas.505.g: "Możemy teraz projektować własne samochody wyścigowe!"
 vikelas.506.t: "Mechanik Samochodów Wyścigowych"
 vikelas.506.d: "Główny inżynier Dr. [SCOPE.sCharacter('gaudi_engineer_scope').GetLastName] wybrał znakomitego asystenta ze swojego zespołu, [SCOPE.sCharacter('gaudi_engineer_scope').GetHerHis] zdaniem odpowiedniego do objęcia stanowiska mechanika w nowo utworzonym zespole wyścigowym: [SCOPE.sCharacter('vikelas_new_mechanic_scope').GetFullName]. Specjalizacja [SCOPE.sCharacter('vikelas_new_mechanic_scope').GetHerHis] obejmuje dziedzinę..."
 vikelas.506.f: "Mechanicy mogą wprowadzać ulepszenia w trzech obszarach samochodu: silniku, bezpieczeństwie i nadwoziu. Specjalizacja pozwala przeprowadzać modernizację w określonym obszarze dwukrotnie szybciej. Zasadniczo, choć nie zawsze, ulepszenia silnika zwiększają niezawodność (i prędkość), ulepszenia systemów bezpieczeństwa zwiększają bezpieczeństwo, a ulepszenia nadwozia zwiększają prędkość (i bezpieczeństwo)."
 vikelas.506.h: "Silnik."
 vikelas.506.i: "Bezpieczeństwo."
 vikelas.506.j: "Nadwozie."
 vikelas.511.t: "Wielki Wyścig [SCOPE.sState('vikelas_city_race_start_state').GetCityHubName]–[SCOPE.sState('vikelas_city_race_goal_state').GetCityHubName]"
 vikelas.511.d: "[ROOT.GetCountry.GetCapital.GetCityHubName] [SCOPE.GetRootScope.GetCountry.GetCustom('generic_newspaper_type')] ogłosiła w swoim najnowszym cotygodniowym wydaniu organizację wielkiego wyścigu samochodowego. Trasa wyścigu z miasta do miasta będzie prowadzić z [SCOPE.sState('vikelas_city_race_start_state').GetCityHubName] do [SCOPE.sState('vikelas_city_race_goal_state').GetCityHubName]. Spodziewany jest również udział licznych kierowców wyścigowych z zagranicy."
 vikelas.511.f: "Początki wyścigów samochodowych były zdominowane przez tak zwanych kierowców dżentelmenów, którzy uczestniczyli w wyścigach z miasta do miasta, prowadząc samodzielnie zbudowane samochody w towarzystwie swoich mechaników, często pełniących również funkcję szoferów. Wyścigi tego rodzaju były często reklamowane, organizowane i wspierane przez gazety oraz kluby samochodowe. Ponieważ technika samochodowa znajdowała się wówczas dopiero w powijakach, najważniejsze było samo dotarcie do mety. Śmiertelne wypadki, takie jak ten, w którym zginął Marcel Renault podczas wyścigu Paryż–Madryt, sprawiły, że ta forma organizacji zawodów okazała się jedynie etapem przejściowym w historii wyścigów samochodowych."
 vikelas.511.g: "Przygotuj się do wydarzenia za trzy miesiące."
 vikelas.512.t: "Udział w Wyścigu"
 vikelas.512.d: "Zbliżający się wyścig [SCOPE.sState('vikelas_city_race_start_state').GetCityHubName]–[SCOPE.sState('vikelas_city_race_goal_state').GetCityHubName] w kraju [SCOPE.sCountry('vikelas_race_country').GetName] wywołał spekulacje na temat tego, czy najlepszy kierowca wyścigowy naszego kraju, [ROOT.Var('vikelas_racer_var').GetCharacter.GetFullName], również weźmie w nim udział."
 vikelas.512.g: "Doskonała okazja!"
 vikelas.512.h: "To zbyt niebezpieczne."
 vikelas.512.tt: "[ROOT.Var('vikelas_racer_var').GetCharacter.GetFullName] rozpocznie przygotowania do wyścigu, który odbędzie się za trzy miesiące."
 vikelas.513.t: "Swobodna Jazda"
 vikelas.513.d: "[ROOT.Var('vikelas_racer_var').GetCharacter.GetLastName] ma szczęście: [ROOT.Var('vikelas_racer_var').GetCharacter.GetSheHe] może jechać pełnym gazem po otwartej drodze. Silnik pracuje bez zarzutu, a zakręty pokonuje się płynnie. To idealne warunki dla kierowcy wyścigowego."
 vikelas.513.f: "„Kiedy prędkość wejdzie człowiekowi w krew, musi on jeździć, aby żyć”. – Rudolf Caracciola"
 vikelas.513.g: "Fantastyczny!"
 vikelas.514.t: "Piękna, Nietknięta Przyroda"
 vikelas.514.d: "Gdy [ROOT.Var('vikelas_racer_var').GetCharacter.GetSheHe] podróżuje z miasta do miasta, [ROOT.Var('vikelas_racer_var').GetCharacter.GetLastName] dostrzega dziewiczą przyrodę na obszarze, przez który [ROOT.Var('vikelas_racer_var').GetCharacter.GetSheHe] przejeżdża. Może [ROOT.Var('vikelas_racer_var').GetCharacter.GetSheHe] powinien zabrać ze sobą jakąś pamiątkę?"
 vikelas.514.f: "W początkowym okresie rozwoju sportów motorowych szczególną atrakcją była jazda przez możliwie dzikie i nietknięte przez człowieka krajobrazy, które stawiały przed kierowcami liczne wyzwania. Dlatego też pierwsze tory wyścigowe spotykały się z krytyką, ponieważ rzekomo wymagały mniejszych umiejętności prowadzenia pojazdu i zdolności dostosowywania się do warunków. Oczywiście niektóre odległe doliny, plaże i tereny górskie potrafiły dostarczyć niespodzianek."
 vikelas.514.g: "Mamy wyścig do wygrania!"
 vikelas.514.h: "Zbierz trochę roślin."
 vikelas.514.i: "Zbierz trochę kamieni."
 vikelas.515.t: "Cukier w Baku"
 vikelas.515.d: "Podczas krótkiego postoju [ROOT.Var('vikelas_racer_var').GetCharacter.GetLastName] zauważa, że w pobliżu znajduje się również samochód [ROOT.Var('vikelas_racer_var').GetCharacter.GetHerHis] rywala, [SCOPE.sCharacter('vikelas_racer_2_scope').GetLastName]. Wygląda na to, że nikt nie pilnuje pojazdu."
 vikelas.515.f: "„Jeśli nie oszukujesz, to znaczy, że za mało się starasz”."
 vikelas.515.g: "Słodka Zemsta."
 vikelas.516.t: "Mała pomoc dla przyjaciela?"
 vikelas.516.d: "[ROOT.Var('vikelas_racer_var').GetCharacter.GetLastName] zajmuje obecnie dobrą pozycję w wyścigu, ale dostrzega na poboczu dymiący samochód należący do [SCOPE.sCharacter('vikelas_racer_2_scope').GetLastName]. Może [ROOT.Var('vikelas_racer_var').GetCharacter.GetSheHe] powinien sprawdzić, czy wszystko jest w porządku?"
 vikelas.516.f: "W początkowym okresie rozwoju wyścigów samochodowych obrażenia i wypadki były na porządku dziennym. Jednak o ile w późniejszych czasach na zamkniętych trasach obecni byli porządkowi, o tyle awaria podczas wyścigu długodystansowego, z dala od świadków, mogła być niebezpieczna. Jeszcze w latach 30. XX wieku podczas wyścigu Mille Miglia widywano wilki w Apeninach. Dlatego wzajemna pomoc między kierowcami wyścigowymi często była czymś naturalnym."
 vikelas.516.g: "[ROOT.Var('vikelas_racer_var').GetCharacter.GetLastName] powinien się zatrzymać i pomóc."
 vikelas.516.h: "Haha! Głupcy!"
 vikelas.517.t: "Problemy z Silnikiem"
 vikelas.517.d: "Coś jest nie tak z silnikiem, ale nawet [ROOT.Var('vikelas_racer_var').GetCharacter.GetLastName] nie potrafi wyjaśnić, co się dzieje. Dotychczasowe próby zdiagnozowania problemu nie przyniosły rezultatu. [ROOT.Var('vikelas_racer_var').GetCharacter.GetSheHe|U] być może będzie musiał kontynuować wyścig ze zmniejszoną prędkością."
 vikelas.517.f: "Problemy z silnikiem występują w każdej dyscyplinie sportów motorowych – zarówno dawniej, jak i dziś. Wielu kierowców musiało przedwcześnie wycofać się z wyścigu z powodu awarii, mimo że prowadzili w stawce. W obecnej sytuacji [ROOT.Var('vikelas_racer_var').GetCharacter.GetLastName] wciąż ma szansę ukończyć wyścig, ale tylko pod warunkiem, że [ROOT.Var('vikelas_racer_var').GetCharacter.GetSheHe] zmniejszy prędkość, co znacznie utrudni odniesienie zwycięstwa."
 vikelas.517.g: "Wykorzystaj wszystkie dostępne możliwości precyzyjnej regulacji mechanicznej."
 vikelas.517.h: "Samochód musi w takim stanie wytrzymać do końca wyścigu."
 vikelas.518.t: "Gwoździe"
 vikelas.518.d: "[ROOT.Var('vikelas_racer_var').GetCharacter.GetLastName] zdołał wypracować pewną przewagę nad resztą stawki. Może [ROOT.Var('vikelas_racer_var').GetCharacter.GetSheHe] mógłby zwiększyć [ROOT.Var('vikelas_racer_var').GetCharacter.GetHerHis] szanse na zwycięstwo i utrudnić życie pozostałym zawodnikom?"
 vikelas.518.f: "„Wiem, że [ROOT.Var('vikelas_racer_var').GetCharacter.GetSheHe] oszukiwał, bo sam oszukiwałem, a mimo to [ROOT.Var('vikelas_racer_var').GetCharacter.GetSheHe] mnie pokonał”."
 vikelas.518.g: "Przynieś gwoździe, Muttley."
 vikelas.518.h: "Powstrzymujemy się od takich niesportowych praktyk."
 vikelas.519.t: "Dyskwalifikacja"
 vikelas.519.d: "Niestety, niesportowe zachowanie [ROOT.Var('vikelas_racer_var').GetCharacter.GetLastName] wyszło na jaw. W związku z tym komisja wyścigowa natychmiast zdyskwalifikowała [ROOT.Var('vikelas_racer_var').GetCharacter.GetHerHim] i wykluczyła z dalszego udziału w wyścigu."
 vikelas.519.f: "„Zgodnie z paragrafem 12, ustępem 6, punktem 9 regulaminu wyścigu międzymiastowego uczestnik naruszył ogólne zasady i w związku z tym zostaje przedwcześnie wykluczony z rywalizacji. Odwołanie od tej decyzji nie jest możliwe”."
 vikelas.519.g: "Zdyskwalifikowany? To niesprawiedliwe!"
 vikelas.520.f: "#V Wyniki Końcowe#!\n\nPierwsze Miejsce: [SCOPE.sCharacter('vikelas_racer_1_scope').GetFullName] z [SCOPE.sCountry('vikelas_first_winner_scope').GetName]\nDrugie Miejsce: [SCOPE.sCharacter('vikelas_racer_2_scope').GetFullName] z [SCOPE.sCountry('vikelas_second_winner_scope').GetName]\nTrzecie Miejsce: [SCOPE.sCharacter('vikelas_racer_3_scope').GetFullName] z [SCOPE.sCountry('vikelas_third_winner_scope').GetName]"
 vikelas.520.g: "Szampan!"
 vikelas.521.t: "Zwycięstwo [ROOT.Var('vikelas_racer_var').GetCharacter.GetLastName]"
 vikelas.521.d: "[ROOT.Var('vikelas_racer_var').GetCharacter.GetFullName] zajął pierwsze miejsce w wyścigu międzymiastowym w [SCOPE.sCountry('vikelas_race_country').GetName]. [ROOT.Var('vikelas_racer_var').GetCharacter.GetSheHe] prowadził samochód [SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_race_team_name_type')] [SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_letter_name')]-[SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_first_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_second_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_third_number_name')]."
 vikelas.521.g: "Szampan!"
 vikelas.522.t: "Drugie Miejsce dla [ROOT.Var('vikelas_racer_var').GetCharacter.GetLastName]"
 vikelas.522.d: "[ROOT.Var('vikelas_racer_var').GetCharacter.GetFullName] zajął drugie miejsce w wyścigu międzymiastowym w [SCOPE.sCountry('vikelas_race_country').GetName]. [ROOT.Var('vikelas_racer_var').GetCharacter.GetSheHe] prowadził samochód [SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_race_team_name_type')] [SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_letter_name')]-[SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_first_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_second_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_third_number_name')]."
 vikelas.522.g: "Do zobaczenia następnym razem!"
 vikelas.523.t: "Trzecie Miejsce dla [ROOT.Var('vikelas_racer_var').GetCharacter.GetLastName]"
 vikelas.523.d: "[ROOT.Var('vikelas_racer_var').GetCharacter.GetFullName] zajął trzecie miejsce w wyścigu międzymiastowym w [SCOPE.sCountry('vikelas_race_country').GetName]. [ROOT.Var('vikelas_racer_var').GetCharacter.GetSheHe] prowadził samochód [SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_race_team_name_type')] [SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_letter_name')]-[SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_first_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_second_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_third_number_name')]."
 vikelas.524.t: "Wyścigu Między Miastami: Zakończony"
 vikelas.524.d: "Wielki wyścig międzymiastowy w kraju [SCOPE.sCountry('vikelas_race_country').GetName] dobiegł końca, a zwycięzcy zostali wyłonieni. [ROOT.Var('vikelas_racer_var').GetCharacter.GetFullName] prowadził samochód [SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_race_team_name_type')] [SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_letter_name')]-[SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_first_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_second_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_third_number_name')]. Chociaż nie udało nam się zająć dobrego miejsca, przynajmniej samochód i kierowca dotarli do mety bez szwanku."
 vikelas.531.t: "Wyścig Długodystansowy"
 vikelas.531.d: "[GetPlayer.GetName] zorganizował wielki wyścig długodystansowy i zaprosił kierowców z całego świata do udziału w zawodach."
 vikelas.531.f: "Pierwsze wyścigi samochodowe na początku XX wieku były wyścigami długodystansowymi, podczas których pokonywano możliwie największe odległości. Miały one sprawdzać prędkość i niezawodność samochodów wyścigowych. Choć początkowo w wyścigach dominowała Francja, wkrótce zaczęto organizować tam wyścigi Grand Prix. Nie zmieniło to jednak faktu, że nadal odbywały się ważne międzynarodowe wyścigi długodystansowe. Najbardziej tradycyjnym z nich był sycylijski wyścig Targa Florio. W latach 1906–1977 odbywał się on przeważnie w maju jako ważne wydarzenie międzynarodowe, niekiedy posiadające rangę mistrzostw świata. Po Targa Florio za klasykę wyścigów drogowych uznawano wyścig Tysiąca Mil (Mille Miglia), do którego w latach 50. XX wieku dołączyła Carrera Panamericana. Mille Miglia dało również początek określeniu „Gran Turismo” (GT), opisującemu szybkie samochody sportowe przeznaczone do dalekich podróży i wyścigów długodystansowych, takie jak modele opracowywane przez Ferrari specjalnie na potrzeby tego wyścigu."
 vikelas.531.g: "Do zobaczenia na mecie!"
 vikelas.533.t: "Uszkodzenie Opony"
 vikelas.533.d: "W połowie wyścigu pęknięta opona zmusza [ROOT.Var('vikelas_racer_var').GetCharacter.GetFullName] do nagłego zatrzymania. Mimo tego incydentu kierowca nie odniósł obrażeń, a [ROOT.Var('vikelas_racer_var').GetCharacter.GetHerHis] opanowanie zrobiło wrażenie, choć stracił cenny czas."
 vikelas.533.f: "Wyścig Mille Miglia w 1931 roku upłynął pod znakiem ogromnego zużycia opon. Jeszcze przed dotarciem do Rzymu Arcangeli musiał wymieniać oponę aż dziewięć razy. Nuvolari również kilkakrotnie złapał gumę, ale mimo to w Rzymie nadal wyprzedzał Caracciolę o dwie minuty. W drodze powrotnej nad Adriatyk samochody Alfa Romeo utrzymywały wysokie tempo pomimo problemów z oponami. W międzyczasie Borzacchini uzyskał 18-minutową przewagę nad rywalami. Na północnym odcinku trasy wzdłuż wybrzeża Morza Śródziemnego Campari wyprzedzał odradzającego się Arcangelego o cztery minuty. Prowadzenie kilkakrotnie przechodziło z rąk do rąk między kierowcami Alfy Romeo, a po pokonaniu dwóch trzecich dystansu Włosi wydawali się mieć wszystko pod kontrolą. Przyczyniła się do tego również gęsta sieć punktów serwisowych, umożliwiająca liczne wymiany opon. O wyniku zadecydowało ostatnie 80 kilometrów, gdy rozpętała się ulewa, a samochody Alfa Romeo ponownie uległy wypadkom z powodu całkowicie zużytych opon."
 vikelas.533.g: "Pech."
 vikelas.534.t: "Przejazd Kolejowy"
 vikelas.534.d: "Podczas pościgu za innym kierowcą nagle rozlega się sygnał ostrzegawczy: przed oboma samochodami opuszcza się szlaban kolejowy. Samochód jadący z przodu przejeżdża z dużą prędkością. [ROOT.Var('vikelas_racer_var').GetCharacter.GetFullName] musi zdecydować, czy się zatrzymać, czy zaryzykować przejazd, zanim rywal zyska zbyt dużą przewagę."
 vikelas.534.f: "Kierowcy biorący udział w Mille Miglia nie stronili od brawurowych manewrów. Jednym z nich był Hans Hermann, który startował w 1954 roku i przejechał samochodem pod opuszczającym się szlabanem kolejowym, zmuszając siebie i swojego pasażera do pochylenia głów."
 vikelas.534.g: "Zaryzykuj!"
 vikelas.534.h: "To zbyt brawurowe!"
 vikelas.538.t: "Wilki i Rewolwery"
 vikelas.538.d: "Podczas nocnej jazdy przez górzysty teren zespół wyścigowy gubi drogę. Nagle rozlega się wycie. Wygląda na to, że w pobliżu kręci się wataha wilków."
 vikelas.538.f: "„Znaleźliśmy się w samym środku zamieci śnieżnej, a wilki ruszyły za nami w pościg. Zostały jednak przepędzone strzałami z rewolweru, który zawsze trzymałem pod poduszką siedzenia, oraz dzięki przybyciu grupy uzbrojonych w pochodnie i broń drogowców”. – Enzo Ferrari"
 vikelas.538.g: "Zabij Wilki."
 vikelas.538.h: "Omiń szerokim łukiem ten obszar."
 vikelas.538.i: "To odkrycie jest znacznie ważniejsze niż jakiś głupi wyścig."
 vikelas.539.t: "Samochód Wyścigowy wpada w Tłum Widzów!"
 vikelas.539.d: "Podczas wyścigu doszło do strasznego wypadku, gdy samochód wyścigowy wypadł z toru i wjechał w tłum widzów. Świat sportów motorowych jest wstrząśnięty, a debata na temat standardów bezpieczeństwa ponownie rozgorzała."
 vikelas.539.f: "Od pierwszego wyścigu Mille Miglia w 1927 roku impreza ta uniknęła tragicznych w skutkach wypadków, mimo że wzdłuż dróg gromadziły się tłumy widzów. Zmieniło się to 3 kwietnia 1938 roku o godzinie 16:30. W tym momencie dwaj kierowcy z Genui, Angelo Mignanego i jego pilot Dr. Luigi Bruzzo, jechali swoją Lancią Aprilią aleją Viale Berti Pichat w Bolonii. Przy prędkości nieco poniżej 100 km/h niedoświadczony Mignanego stracił panowanie nad samochodem na znajdujących się tam torach tramwajowych. Lancia najpierw uderzyła w drzewo, a następnie wpadła w dużą grupę widzów. Podczas gdy obaj pasażerowie samochodu odnieśli jedynie niewielkie obrażenia, w wypadku zginęło dziesięć osób, w tym siedmioro dzieci. Kolejnych 26 widzów zostało rannych, niektórzy ciężko. W innym wypadku w Stanghelli zginęła 12-letnia dziewczynka."
 vikelas.539.g: "Czarny dzień dla wyścigów."
 vikelas.540.t: "Nowy Rekord Średniej Prędkości"
 vikelas.540.d: "[ROOT.Var('vikelas_racer_var').GetCharacter.GetFullName] osiągnął niespotykaną dotąd średnią prędkość w wyścigach długodystansowych. Rekord ten zapisze się jako kamień milowy w historii sportów motorowych."
 vikelas.540.f: "Dzięki zapierającej dech w piersiach precyzji i kunsztowi technicznemu [GetPlayer.GetCustom('vikelas_race_team_name_type')] osiągnął średnią prędkość, którą dotychczas uważano za niemożliwą do uzyskania. Rekord ten jeszcze długo będzie uznawany za największe osiągnięcie tej złotej ery sportów motorowych."
 vikelas.545.t: "Spotkanie Fanów!"
 vikelas.545.d: "Podczas wyścigu długodystansowego między dwoma miastami zgromadził się wiwatujący tłum, aby świętować przejazd [ROOT.Var('vikelas_racer_var').GetCharacter.GetFullName] przez ich miasto. Wydarzenie to oznacza narodziny sportów motorowych jako masowej rozrywki."
 vikelas.545.f: "Ulice były pełne ludzi, którzy tłoczyli się, by choć przez chwilę zobaczyć pędzący samochód. Dzieci machały flagami, a dorośli wykrzykiwali nazwisko kierowcy, którego umiejętności i odwaga wzbudzały ich podziw. Gdy samochód się zatrzymał, ogarnęła go fala entuzjazmu. Kwiaty, oklaski i wiwaty towarzyszyły krótkiemu postojowi, po którym kierowca ponownie ruszył w drogę. Była to chwila, która rozpaliła w sercach ludzi pasję do prędkości i techniki – zapowiedź tego, czym sporty motorowe miały stać się w nadchodzących dekadach."
 vikelas.545.g: "Wyścigi zyskują Popularność"
 vikelas.541.t: "Wyścig Długodystansowy Zakończony"
 vikelas.541.d: "[SCOPE.sCharacter('vikelas_racer_1_scope').GetFullName] z [SCOPE.sCountry('vikelas_first_winner_scope').GetName] wygrał prestiżowy wyścig długodystansowy i podbił serca widzów."
 vikelas.541.f: "Ostatnie kilometry były prawdziwym widowiskiem: kurz wirował nad trasą, silniki ryczały, a emocje sięgały zenitu. Gdy zwycięzca w końcu przekroczył linię mety, rozległy się gromkie wiwaty. Samochód [SCOPE.sCharacter('vikelas_racer_1_scope').GetHerHis|U], pokryty śladami zaciętej rywalizacji, stał się symbolem [SCOPE.sCharacter('vikelas_racer_1_scope').GetHerHis] woli zwycięstwa. Fani ponieśli [SCOPE.sCharacter('vikelas_racer_1_scope').GetHerHim] na ramionach, świętując ten wyjątkowy moment. Dzięki temu triumfowi [ROOT.Var('vikelas_racer_var').GetCharacter.GetFullName] staje się jedną z najważniejszych postaci sportów motorowych, a zespół wyścigowy [SCOPE.sCharacter('vikelas_racer_1_scope').GetHerHis] [GetPlayer.GetCustom('vikelas_race_team_name_type')] staje się marką cieszącą się ogromnym szacunkiem."
 vikelas.542.d: "[SCOPE.sCountry('vikelas_endurance_race_country_scope').GetName]"
 vikelas.551.t: "Grand Prix [GetPlayer.GetName]"
 vikelas.551.d: "Sezon wyścigowy dotarł do kraju [GetPlayer.GetNameNoFormatting]. Liczni kierowcy wyścigowi wraz ze swoimi zespołami przybyli już, aby przygotować się do Grand Prix, którego gospodarzem wkrótce będzie nasz kraj."
 vikelas.551.f: "„Wyścigi to życie. Cała reszta to po prostu czekanie”. – Rudolf Caracciola"
 vikelas.551.g: "Niech wygra najszybszy!"
 vikelas.552.t: "Najszybsze Okrążenie"
 vikelas.552.d: "[ROOT.Var('vikelas_racer_var').GetCharacter.GetFullName] uzyskał najszybszy czas okrążenia podczas treningów przed wyścigiem. To bardzo dobry prognostyk przed właściwymi zawodami."
 vikelas.552.f: "„Jeszcze przed startem byłem pewien zwycięstwa”. – Ettore Bugatti"
 vikelas.553.t: "Plama Oleju"
 vikelas.553.d: "Podczas wyścigu Grand Prix [ROOT.Var('vikelas_racer_var').GetCharacter.GetFullName] wjechał w plamę oleju pozostawioną przez samochód uczestniczący w wypadku i wypadł z trasy. Kierowca i samochód mogą kontynuować jazdę, ale stracili mnóstwo czasu w trwającym wyścigu."
 vikelas.553.f: "„Projektuję samochody, żeby jeździły, a nie stały”. – Ettore Bugatti"
 vikelas.553.g: "O nie!"
 vikelas.554.t: "Deszcz"
 vikelas.554.d: "Wyścig Grand Prix został zaskoczony przez nagły front deszczowy. Niektórzy kierowcy zatrzymali się, aby zmienić wyposażenie. [ROOT.Var('vikelas_racer_var').GetCharacter.GetFullName] musi zdecydować, czy [ROOT.Var('vikelas_racer_var').GetCharacter.GetSheHe] powinien kontynuować wyścig brawurowo, czy zwolnić, aby zachować ostrożność."
 vikelas.554.f: "„Nie bój się niczego. Po prostu wierz”. – Armand Peugeot"
 vikelas.554.g: "To nie wytrąci kierowcy z toru!"
 vikelas.554.h: "Zwolnij tempo jazdy."
 vikelas.555.t: "Manewr Wyprzedzania"
 vikelas.555.d: "Nadchodzi wyjątkowa okazja, gdy [ROOT.Var('vikelas_racer_var').GetCharacter.GetFullName] zbliża się do [SCOPE.sCharacter('vikelas_racer_2_scope').GetLastName], kierowcy wyścigowego z kraju [SCOPE.sCountry('vikelas_race_country_scope').GetName]. Czy [ROOT.Var('vikelas_racer_var').GetCharacter.GetSheHe] powinien spróbować manewru wyprzedzania?"
 vikelas.555.f: "„Idealny samochód wyścigowy najpierw przekracza linię mety, a dopiero potem rozpada się na poszczególne części”. – Ferdinand Porsche"
 vikelas.555.g: "Naprzód!"
 vikelas.555.h: "To zbyt ryzykowne."
 vikelas.556.t: "Manewr Wyprzedzania zakończony sukcesem"
 vikelas.556.d: "Manewr wyprzedzania zakończył się pełnym sukcesem. [ROOT.Var('vikelas_racer_var').GetCharacter.GetFullName] wysunął się na prowadzenie i zyskał przewagę prędkości."
 vikelas.556.f: "„Gdy widzę przejeżdżającą Alfę Romeo, uchylam kapelusza”. – Henry Ford"
 vikelas.556.g: "Hurra!"
 vikelas.557.t: "Manewr Wyprzedzania Nieudany"
 vikelas.557.d: "[ROOT.Var('vikelas_racer_var').GetCharacter.GetFullName] nie zdołał wykonać udanego manewru wyprzedzania. Rywal skutecznie się obronił, a nasz kierowca wyścigowy stracił mnóstwo czasu."
 vikelas.557.f: "„To pech, ale takie są zasady gry. Dałem z siebie wszystko, a skoro przegrałem, kibicuję temu, który zdobył nagrodę”. – Ralph DePalma"
 vikelas.557.g: "Co za szkoda."
 vikelas.558.t: "Rodzima Publiczność Dodaje Kierowcy Motywacji"
 vikelas.558.d: "Podczas Grand Prix kraju [GetPlayer.GetNameNoFormatting] [ROOT.Var('vikelas_racer_var').GetCharacter.GetFullName] jest uważany za lokalnego bohatera i otrzymuje wyjątkowo silne wsparcie publiczności. To ogromnie motywuje kierowcę wyścigowego!"
 vikelas.558.f: "„Nikt nie pamięta, kto zajął drugie miejsce, a ja nigdy nie będę tym, który je zajmie”. – Enzo Ferrari"
 vikelas.558.g: "Świetnie!"
 vikelas.559.t: "Mistrzostwa Samochodowe"
 vikelas.559.d: "[SCOPE.sCountry('vikelas_first_winner_scope').GetNameNoFlag] zdominował ten sezon wyścigowy i zdobył tytuł mistrza wyścigów samochodowych."
 vikelas.559.f: "#V Wyniki Końcowe#!\n\nPierwsze Miejsce: [SCOPE.sCountry('vikelas_first_winner_scope').GetName], [SCOPE.GetValue('vikelas_first_winner_points_scope')] Punktów, [SCOPE.GetValue('vikelas_first_winner_victories_scope')] Zwycięstw\nDrugie Miejsce: [SCOPE.sCountry('vikelas_second_winner_scope').GetName], [SCOPE.GetValue('vikelas_second_winner_points_scope')] Punktów, [SCOPE.GetValue('vikelas_second_winner_victories_scope')] Zwycięstw\nTrzecie Miejsce: [SCOPE.sCountry('vikelas_third_winner_scope').GetName], [SCOPE.GetValue('vikelas_third_winner_points_scope')] Punktów, [SCOPE.GetValue('vikelas_third_winner_victories_scope')] Zwycięstw\nCzwarte Miejsce: [SCOPE.sCountry('vikelas_fourth_winner_scope').GetName], [SCOPE.GetValue('vikelas_fourth_winner_points_scope')] Punktów, [SCOPE.GetValue('vikelas_fourth_winner_victories_scope')] Zwycięstw\nPiąte Miejsce: [SCOPE.sCountry('vikelas_fifth_winner_scope').GetName], [SCOPE.GetValue('vikelas_fifth_winner_points_scope')] Punktów, [SCOPE.GetValue('vikelas_fifth_winner_victories_scope')] Zwycięstw"
 vikelas.559.g: "A teraz zagrajcie Bizeta."
 vikelas.559.h: "Nie interesują mnie statystyki."
 vikelas.559.tt: "Coroczne statystyki Mistrzostw Samochodowych nie są już wyświetlane."
 vikelas.561.t: "Grand Prix [GetPlayer.GetName] dobiegło końca"
 vikelas.561.d: "Wyścig Grand Prix dobiegł końca, a zwycięzcy zostali wyłonieni. Zdobywcą Grand Prix kraju [GetPlayer.GetName] jest [SCOPE.sCharacter('vikelas_racer_1_scope').GetFullName]. Wydarzenie to na długo pozostanie w pamięci mieszkańców."
 vikelas.561.f: "#V Wyniki Końcowe#!\n\nPierwsze Miejsce: [SCOPE.sCharacter('vikelas_racer_1_scope').GetFullName] z [SCOPE.sCountry('vikelas_first_winner_scope').GetName]\nDrugie Miejsce: [SCOPE.sCharacter('vikelas_racer_2_scope').GetFullName] z [SCOPE.sCountry('vikelas_second_winner_scope').GetName]\nTrzecie Miejsce: [SCOPE.sCharacter('vikelas_racer_3_scope').GetFullName] z [SCOPE.sCountry('vikelas_third_winner_scope').GetName]"
 vikelas.561.g: "Szampan!"
 vikelas.571.t: "Pierwszy 24-godzinny Wyścig Le Mans"
 vikelas.571.d: "W 1923 roku odbył się pierwszy 24-godzinny wyścig Le Mans, który szybko stał się jednym z najbardziej prestiżowych wydarzeń w sportach motorowych, przyciągając kierowców i producentów samochodów z całego świata."
 vikelas.571.f: "W dniach 26–27 maja 1923 roku odbył się pierwszy 24-godzinny wyścig Le Mans, zorganizowany przez Automobile Club de l'Ouest. Na liczącej 17,3 kilometra trasie w regionie Sarthe rywalizowały 33 samochody. Warunki były trudne: deszcz, błotniste drogi oraz trasa prowadząca przez miasto Le Mans i okoliczne drogi wiejskie. Zwycięstwo odnieśli André Lagache i René Léonard, którzy za kierownicą samochodu Chenard & Walcker Sport pokonali w ciągu 24 godzin dystans 2209 kilometrów. Wyścig ten zapoczątkował tradycję, która do dziś stanowi święto innowacji i wytrzymałości w sportach motorowych."
 vikelas.571.g: "24 godziny? To szaleństwo!"
 vikelas.572.t: "Narodziny Targa Florio"
 vikelas.572.d: "W 1906 roku powstał Targa Florio, widowiskowy wyścig rozgrywany na krętych drogach Sycylii. Zorganizowany przez Vincenza Floria, sprawił, że region ten znalazł się w centrum świata sportów motorowych."
 vikelas.572.f: "6 maja 1906 roku odbył się pierwszy wyścig Targa Florio, wyścig długodystansowy, który zamienił strome górskie drogi i malownicze wioski Sycylii w wymagającą trasę wyścigową. Zorganizowane przez Vincenza Floria, pasjonata sportów motorowych, wydarzenie to urzeczywistniło jego wizję sportowego wyzwania. Trasa liczyła 446 kilometrów i była podzielona na trzy okrążenia po 148 kilometrów każde. Zwycięstwo odniósł Alessandro Cagno, który za kierownicą samochodu Itala przekroczył linię mety ze średnią prędkością 46,8 km/h. Targa Florio szybko stało się symbolem odwagi, umiejętności i pasji do prędkości."
 vikelas.572.g: "Targa Florio Zapoczątkowuje Tradycję"
 vikelas.573.t: "Pierwszy Wyścig Górski na Semmeringu"
 vikelas.573.d: "W 1899 roku odbył się pierwszy wyścig górski na Semmeringu, który wystawił na próbę możliwości ówczesnej techniki samochodowej oraz umiejętności kierowców. Wydarzenie to stanowiło ważny kamień milowy w historii sportów motorowych."
 vikelas.573.f: "27 sierpnia 1899 roku odbył się pierwszy wyścig górski na Semmeringu, zorganizowany przez Austriacki Klub Samochodowy. Trasa o długości 9,8 kilometra, prowadząca z Klamm am Semmering na przełęcz górską, wystawiła możliwości pierwszych samochodów i umiejętności ich kierowców na najcięższą próbę. Przy nachyleniu sięgającym 7% i ostrych zakrętach wyścig stanowił sprawdzian zarówno techniki, jak i odwagi. Zwycięstwo odniósł hrabia Jenő Zichy, który za kierownicą samochodu marki Mors pokonał trasę ze średnią prędkością 22,2 km/h. Wyścig przyciągnął liczną publiczność i położył podwaliny pod tradycję wyścigów górskich w Europie."
 vikelas.573.g: "Wyścig górski zachwyca tłumy."
 vikelas.581.t: "Nowy Silnik Samochodu Wyścigowego"
 vikelas.581.d_level_2: "[ROOT.Var('vikelas_mechanic_var').GetCharacter.GetFullName] ulepszył silnik. Najnowszy model samochodu wyścigowego jest teraz wyposażony w #V silnik sześciocylindrowy#!. Nowy samochód nosi nazwę [SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_race_team_name_type')] [SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_letter_name')]-[SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_first_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_second_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_third_number_name')]."
 vikelas.581.d_level_3: "[ROOT.Var('vikelas_mechanic_var').GetCharacter.GetFullName] ulepszył silnik. Najnowszy model samochodu wyścigowego jest teraz wyposażony w #V czterocylindrowy silnik z kompresorem#!. Nowy samochód nosi nazwę [SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_race_team_name_type')] [SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_letter_name')]-[SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_first_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_second_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_third_number_name')]."
 vikelas.581.d_level_4: "[ROOT.Var('vikelas_mechanic_var').GetCharacter.GetFullName] ulepszył silnik. Najnowszy model samochodu wyścigowego jest teraz wyposażony w #V ośmiocylindrowy silnik z kompresorem#!. Nowy samochód nosi nazwę [SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_race_team_name_type')] [SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_letter_name')]-[SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_first_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_second_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_third_number_name')]."
 vikelas.581.f: "„Buduję silniki i montuję do nich koła”. – Enzo Ferrari"
 vikelas.581.g: "Naprzód!"
 vikelas_new_engine_tt: "Obecny silnik zostanie ulepszony."
 vikelas.582.t: "Nowe Systemy Bezpieczeństwa Samochodu Wyścigowego"
 vikelas.582.d_level_2: "[ROOT.Var('vikelas_mechanic_var').GetCharacter.GetFullName] ulepszył systemy bezpieczeństwa. Najnowszym elementem wyposażenia zwiększającym bezpieczeństwo samochodu wyścigowego jest #V lusterko wsteczne#!. Nowy samochód nosi nazwę [SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_race_team_name_type')] [SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_letter_name')]-[SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_first_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_second_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_third_number_name')]."
 vikelas.582.d_level_3: "[ROOT.Var('vikelas_mechanic_var').GetCharacter.GetFullName] ulepszył systemy bezpieczeństwa. Najnowszym elementem wyposażenia zwiększającym bezpieczeństwo samochodu wyścigowego są #V hamulce hydrauliczne#!. Nowy samochód nosi nazwę [SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_race_team_name_type')] [SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_letter_name')]-[SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_first_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_second_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_third_number_name')]."
 vikelas.582.d_level_4: "[ROOT.Var('vikelas_mechanic_var').GetCharacter.GetFullName] ulepszył systemy bezpieczeństwa. Najnowszym elementem wyposażenia zwiększającym bezpieczeństwo samochodu wyścigowego są #V nowoczesne opony#!. Nowy samochód nosi nazwę [SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_race_team_name_type')] [SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_letter_name')]-[SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_first_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_second_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_third_number_name')]."
 vikelas.582.f: "„Aby zająć pierwsze miejsce, trzeba najpierw dotrzeć do mety”. – Juan Manuel Fangio"
 vikelas_new_safety_tt: "Obecne systemy bezpieczeństwa zostaną ulepszone."
 vikelas.583.t: "Nowe Nadwozie Samochodu Wyścigowego"
 vikelas.583.d_level_2: "[ROOT.Var('vikelas_mechanic_var').GetCharacter.GetFullName] ulepszył nadwozie. Nowy samochód wyścigowy ma teraz #V nadwozie torpedowe#!. Nowy samochód nosi nazwę [SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_race_team_name_type')] [SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_letter_name')]-[SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_first_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_second_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_third_number_name')]."
 vikelas.583.d_level_3: "[ROOT.Var('vikelas_mechanic_var').GetCharacter.GetFullName] ulepszył nadwozie. Samochód wyścigowy ma teraz #V nadwozie z tłoczonej stali#!. Nowy samochód nosi nazwę [SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_race_team_name_type')] [SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_letter_name')]-[SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_first_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_second_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_third_number_name')]."
 vikelas.583.d_level_4: "[ROOT.Var('vikelas_mechanic_var').GetCharacter.GetFullName] ulepszył nadwozie. Nowy samochód wyścigowy ma teraz #V opływowe nadwozie#!. Nowy samochód nosi nazwę [SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_race_team_name_type')] [SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_letter_name')]-[SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_first_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_second_number_name')][SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_racecar_third_number_name')]."
 vikelas.583.f: "„Wyścigi samochodowe narodziły się pięć minut po zbudowaniu drugiego samochodu”. – Henry Ford"
 vikelas_new_body_tt: "Obecne nadwozie zostanie ulepszone."
 vikelas.584.t: "Silnik Widlasty (V Engine)"
 vikelas.584.d: "Nasz inżynier Dr. [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] przedstawił przełomową koncepcję nowego silnika do samochodów wyścigowych i skontaktował się z mechanikiem [ROOT.Var('vikelas_mechanic_var').GetCharacter.GetFullName]."
 vikelas.584.f: "Silnik widlasty (V engine) to rodzaj tłokowego silnika spalinowego wyposażonego w kilka cylindrów. Są one rozmieszczone w dwóch rzędach ustawionych względem siebie pod kątem. Silniki widlaste są szeroko stosowane, zwłaszcza w przypadku większej liczby cylindrów i ograniczonej przestrzeni montażowej. Zwarta konstrukcja pozwala zaoszczędzić materiał, a tym samym zmniejszyć masę silnika. Pierwszy silnik widlasty, dwucylindrowy silnik V2, został zaprojektowany przez Wilhelma Maybacha i zastosowany w samochodzie Daimler Stahlradwagen z 1889 roku. Pierwszy silnik V8 powstał w 1903 roku jako silnik Antoinette, zaprojektowany przez Léona Levavasseura z myślą o łodziach wyścigowych i samolotach."
 vikelas.584.g: "Eureka!"
 vikelas.585.t: "Ulepszone Paliwo"
 vikelas.585.d: "Nasz chemik Dr. [ROOT.Var('mendelejew_chemist_var').GetCharacter.GetLastName] udoskonalił paliwo do silników spalinowych w sposób, który może odegrać kluczową rolę w zwiększeniu sprawności i osiągów samochodów wyścigowych. [ROOT.Var('vikelas_mechanic_var').GetCharacter.GetFullName] wyraził duże zainteresowanie przeprowadzeniem jazd próbnych."
 vikelas.585.f: "Pierwsze dziesięciolecia rozwoju paliw benzynowych charakteryzowały się ogromną różnorodnością i ciągłymi zmianami. Wiele przedsiębiorstw miało tendencję do rozcieńczania paliwa lub mieszania go z innymi czystymi paliwami. Już Nikolaus August Otto stosował alkohol rektyfikowany. W niektórych krajach niedobór ropy naftowej prowadził do opracowywania alternatywnych paliw lub sposobów wydajniejszego wykorzystania dostępnych zasobów. W wyścigach udoskonalone paliwa i oleje smarowe służyły optymalizacji osiągów samochodów."
 vikelas.585.g: "Eureka!"
 vikelas.586.t: "Siły Aerodynamiczne"
 vikelas.586.d: "Nasz fizyk Dr. [ROOT.Var('curie_physicistvar').GetCharacter.GetLastName] przedstawił obliczenia dotyczące sił aerodynamicznych, które mogłyby okazać się przydatne przy konstruowaniu pojazdów. Mechanik samochodowy [ROOT.Var('vikelas_mechanic_var').GetCharacter.GetFullName] otrzymał kopię opracowania."
 vikelas.586.f: "„Aerodynamika jest dla tych, którzy nie potrafią budować silników”. – Enzo Ferrari"
 vikelas.586.g: "Eureka!"
 vikelas.590.t: "[ROOT.Var('vikelas_racer_var').GetCharacter.GetFullName] jest teraz Sławnym Rajdowcem!"
 vikelas.590.d: "[ROOT.Var('vikelas_racer_var').GetCharacter.GetFullName] wygrywał wyścigi na całym świecie i słynie ze [ROOT.Var('vikelas_racer_var').GetCharacter.GetHerHis] stylu jazdy. [ROOT.Var('vikelas_racer_var').GetCharacter.GetSheHe|U] zdobył już tak wielką sławę, że zasługuje na miano Sławnego Rajdowca!"
 vikelas.590.f: ""
 vikelas.590.g: "Żywa legenda!"
 vikelas.591.t: "Nasz Rajdowiec, [SCOPE.sCharacter('vikelas_retired_racer_scope').GetFullNameNoFormatting], przechodzi na emeryturę"
 vikelas.591.d: "Po wielu latach [SCOPE.sCharacter('vikelas_retired_racer_scope').GetHerHis] życia spędzonych na ściganiu się samochodami na całym świecie [SCOPE.sCharacter('vikelas_retired_racer_scope').GetFullName] przechodzi teraz na emeryturę. [SCOPE.sCharacter('vikelas_retired_racer_scope').GetSheHe] nie będzie już aktywny jako [concept_vikelas_racer]."
 vikelas.591.g: "[SCOPE.sCharacter('vikelas_retired_racer_scope').GetSheHe|U] zasłużył na [SCOPE.sCharacter('vikelas_retired_racer_scope').GetHerHis] emeryturę!"
 vikelas.591.h: "Byłby świetnym inżynierem!"
 vikelas.591.new_racer_replace_tt: "[SCOPE.sCharacter('vikelas_retired_racer_scope').GetFullName] przejdzie na emeryturę, a [SCOPE.sCharacter('vikelas_new_racer_scope').GetFullName] zostanie nowym [concept_vikelas_racer] kraju [GetPlayer.GetName]."
 vikelas.591.racer_to_engineer_tt: "[SCOPE.sCharacter('vikelas_retired_racer_scope').GetFullName] zostanie twoim nowym [concept_tesla_engineer]. [SCOPE.GetRootScope.GetCountry.GetCustom('academics_replacement_engineer_custom_loc')]"
 vikelas.591.new_racer_tt: "[SCOPE.sCharacter('vikelas_new_racer_scope').GetFullName] zostanie nowym [concept_vikelas_racer] kraju [GetPlayer.GetName]."
 vikelas.592.t: "Nasz [concept_vikelas_racer] zmarł"
 vikelas.592.d: "Po wielu latach spędzonych jako [concept_vikelas_racer] zmarł znany rajdowiec z naszego kraju. Czy kiedykolwiek uda nam się znaleźć następcę tak niezwykłego talentu?"
 vikelas.592.g: "To ogromna strata!"
 vikelas.592_tt: "Czasami gra powoduje śmierć postaci. Mod nie może temu zapobiec. To wydarzenie usuwa rolę tej [concept_character] z gry, aby nie nawiedzał cię jej duch."
 vikelas.593.t: "Śmiertelny Wypadek Samochodowy"
 vikelas.593.d: "Kierowca wyścigowy [ROOT.Var('vikelas_racer_var').GetCharacter.GetFullName] zbyt mocno wystawił [ROOT.Var('vikelas_racer_var').GetCharacter.GetHerHis] szczęście na próbę. [ROOT.Var('vikelas_racer_var').GetCharacter.GetSheHe|U] wypadł z drogi przy zbyt dużej prędkości i poniósł śmierć w wypadku."
 vikelas.593.f: "„Wyścigi to wielka pasja, której trzeba poświęcić wszystko, bez żadnych zastrzeżeń i bez wahania”. – Enzo Ferrari"
 vikelas.593.g: "Następny!"
 vikelas.594.t: "Awaria Samochodu"
 vikelas.594.d: "Niestety, rajdowiec [ROOT.Var('vikelas_racer_var').GetCharacter.GetFullName] musiał wycofać się przed zakończeniem wyścigu. [ROOT.Var('vikelas_racer_var').GetCharacter.GetSheHe] twierdzi, że samochód uległ awarii."
 vikelas.594.f: "„Pech nie istnieje”. – Enzo Ferrari"
 vikelas.594.g: "Czy zawinił samochód, czy kierowca nadmiernie przeciążył silnik?"
 vikelas.595.t: "Nowy Rajdowiec"
 vikelas.595.d: "Nowy [concept_vikelas_racer] przedstawił [SCOPE.sCharacter('vikelas_new_racer_scope').GetHerselfHimself]. [SCOPE.sCharacter('vikelas_new_racer_scope').GetHerHis|U] imie to [SCOPE.sCharacter('vikelas_new_racer_scope').GetFullName]."
 vikelas.595.g: "Miejmy nadzieję, że [SCOPE.sCharacter('vikelas_new_racer_scope').GetSheHe] będzie miał więcej szczęścia."
 vikelas.596.t: "Nowy Mechanik"
 vikelas.596.d: "Nowy [concept_vikelas_mechanic] przedstawił [SCOPE.sCharacter('vikelas_new_mechanic_scope').GetHerselfHimself]. [SCOPE.sCharacter('vikelas_new_mechanic_scope').GetHerHis|U] imię to [SCOPE.sCharacter('vikelas_new_mechanic_scope').GetFullName]. [SCOPE.sCharacter('vikelas_new_mechanic_scope').GetHerHis] specjalizacja obejmuje dziedzinę..."
 vikelas_autoracing_found_automobile_club_button: "Załóż Klub Samochodowy"
 vikelas_autoracing_found_automobile_club_button_desc: "Założenie Klubu Samochodowego to pierwszy krok w kierunku budowy innych obiektów niezbędnych do rozwoju sportów motorowych."
 vikelas_autoracing_long_distance_button: "Zorganizuj Wyścig Długodystansowy"
 vikelas_autoracing_long_distance_button_desc: "Wyścigi długodystansowe, często rozgrywane między miastami, były normą w początkowym okresie rozwoju wyścigów samochodowych i pozostały popularne aż do połowy XX wieku. We Włoszech najbardziej znanymi przykładami są Targa Florio i Mille Miglia. Stanowiły one wyjątkową próbę zarówno dla człowieka, jak i maszyny, a przez długi czas uznawano je za prawdziwe narodowe wyścigi samochodowe."
 vikelas_autoracing_found_grand_prix_button: "Załóż Wyścigi Grand Prix"
 vikelas_autoracing_found_grand_prix_button_desc: "W 1906 roku zorganizowano pierwsze oficjalne Grand Prix w historii motoryzacji – wyścig o Grand Prix de l'ACF. Niezależnie od kraju pochodzenia każdy producent samochodów mógł wystawić maksymalnie trzy samochody wyścigowe, zgodnie z pierwotnymi postulatami przedstawicieli francuskiego przemysłu motoryzacyjnego. Ze względu na rangę najważniejszych zawodów wyścig rozgrywano na dystansie ponad 1200 kilometrów, przez dwa kolejne dni. W 1925 roku, z inicjatywy Włoskiego Klubu Samochodowego, ostatecznie ogłoszono utworzenie oficjalnych mistrzostw świata. Do kalendarza mistrzostw zaliczono trzy oficjalne wyścigi Grand Prix sezonu (Francji, Włoch i Belgii), a także wyścig Indianapolis, będący najważniejszym wydarzeniem wyścigowym w Ameryce."
 vikelas_autoracing_race_track_button: "Zbuduj Tor Wyścigowy"
 vikelas_autoracing_race_track_button_desc: "Wraz z rozwojem wyścigów Grand Prix stałe tory wyścigowe coraz częściej stają się standardem w wyścigach samochodowych. Specjalnie wybudowany tor wyścigowy nie tylko pozwoliłby organizować międzynarodowe zawody w jednym miejscu, ale także, jako tor testowy, zapewniałby naszym rajdowcom coroczną premię do doświadczenia."
 vikelas_coach: "Trener"
 vikelas_coach_desc: "Ta postać trenuje drużynę sportową."
 vikelas_coach_senior: "Główny Trener"
 vikelas_coach_senior_desc: "Ten trener jest legendą środowiska sportowego dzięki wieloletniemu doświadczeniu."
