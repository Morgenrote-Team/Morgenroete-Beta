 vikelas.121.t: "Gimnastyk Komunista"
 vikelas.121.d: "[SCOPE.sCharacter('vikelas_communist_athlete_scope').GetFullName] jest uznawany za jednego z najbardziej utalentowanych gimnastyków w naszym kraju i ma bardzo duże szanse na zdobycie medalu. Jednak [SCOPE.sCharacter('vikelas_communist_athlete_scope').GetHerHis] komunistyczne poglądy budzą sprzeciw niektórych działaczy sportowych. Obawiają się oni, że [SCOPE.sCharacter('vikelas_communist_athlete_scope').GetSheHe] mógłby zostać wykorzystany jako idol przez ugrupowania polityczne."
 vikelas.121.f: "Gimnastyka jest jednym z najstarszych sportów olimpijskich i jednym z czterech obecnych na wszystkich Igrzyskach Olimpijskich. Obejmuje trzy dyscypliny: gimnastykę sportową (zwaną również gimnastyką na przyrządach), gimnastykę artystyczną i skoki na trampolinie. Gimnastyka sportowa jest częścią programu olimpijskiego od Igrzysk w Atenach w 1896 roku."
 vikelas.121.g: "Nieważne, jakie ma poglądy, [SCOPE.sCharacter('vikelas_communist_athlete_scope').GetSheHe] powinien wygrać!"
 vikelas.121.h: "Czy nie mamy innego sportowca?"
 vikelas.122.t: "Reakcyjny Tenisista"
 vikelas.122.f: "W programie pierwszych Igrzysk Olimpijskich w 1896 roku znalazły się zarówno jeu de paume (w postaci francuskiej odmiany jeu de longue paume), jak i tenis ziemny. Ponieważ jednak znani zawodnicy z Francji, Wielkiej Brytanii i USA nie chcieli wziąć udziału, w turnieju tenisa ziemnego wystąpili głównie nieznani gracze z Grecji. Zwerbowano również zawodników innych dyscyplin, takich jak brytyjski młociarz George Stuart Robertson i węgierski ciężarowiec Momcsilló Tapavicza. Według rozpowszechnionej legendy lekkoatleta Friedrich Adolf Traun został namówiony do udziału w turnieju przez Irlandczyka Johna Piusa Bolanda w ateńskim sklepie, gdy kupował rakietę tenisową. Tenis był sportem olimpijskim do 1924 roku i powrócił do programu dopiero w 1988 roku."
 vikelas.123.t: "Sportowiec nie stawia się na Zawody"
 vikelas.123.d: "Jeden z naszych Sportowców nie stawił się na swoją konkurencję. Wygląda na to, że różnice między Kalendarzami wywołały zamieszanie."
 vikelas.123.f: "„Co? Inny kalendarz? Dlaczego jest ich więcej? Dlaczego nikt mi nie powiedział?”\n\n#b Historycznie#!, zwłaszcza podczas pierwszych nowożytnych Igrzysk Olimpijskich, używany w Grecji Kalendarz Juliański sprawiał problemy i powodował, że niektórzy sportowcy nawet przegapiali swoje konkurencje."
 vikelas.123.g: "Dlaczego oni używają innego kalendarza?!"
 vikelas_negative_influence_on_score_tt: "Może to #n negatywnie#! wpłynąć na szanse [GetPlayer.GetName] na zdobycie medali."
 vikelas.124.t: "Honorowy Kolarz"
 vikelas.124.d: "Nasz kolarz, [SCOPE.sCharacter('vikelas_honorable_cyclist_scope').GetFullName], zatrzymał się, gdy [SCOPE.sCharacter('vikelas_honorable_cyclist_scope').GetHerHis] rywal [SCOPE.sCharacter('vikelas_cyclist_with_problems_scope').GetFullName] musiał naprawić usterkę w [SCOPE.sCharacter('vikelas_cyclist_with_problems_scope').GetHerHis] rowerze. Obaj wznowili wyścig dopiero po zakończeniu naprawy. Ostatecznie [SCOPE.sCharacter('vikelas_honorable_cyclist_scope').GetLastName] i tak zwyciężył."
 vikelas.124.f: "„Co z twoim rowerem, [SCOPE.sCharacter('vikelas_cyclist_with_problems_scope').GetLastNameNoFormatting]?”\n„Och, to tylko drobny problem z łańcuchem. Zaciął się. Ale dziękuję, że na mnie zaczekałeś, [SCOPE.sCharacter('vikelas_honorable_cyclist_scope').GetLastNameNoFormatting]!”"
 vikelas.124.g: "Wspaniały gest!"
 vikelas.125.t: "Kolarz potrącony przez samochód"
 vikelas.125.d: "Nasz kolarz, [SCOPE.sCharacter('vikelas_cyclist_with_accident_scope').GetFullName], brał udział w wyścigu ulicznym, gdy [SCOPE.sCharacter('vikelas_cyclist_with_accident_scope').GetSheHe] został nagle potrącony przez samochód. [SCOPE.sCharacter('vikelas_cyclist_with_accident_scope').GetSheHe|U] odniósł obrażenia i przebywa teraz w szpitalu. Na szczęście wygląda na to, że [SCOPE.sCharacter('vikelas_cyclist_with_accident_scope').GetSheHe] ma tylko lekkie obrażenia."
 vikelas.125.f: "W wywiadzie kierowca odpowiedzialny za wypadek stwierdził: „Co za głupi pomysł. Wyścig rowerowy na drodze publicznej. Droga należy do mnie i mojego samochodu, a nie do jakiegoś kolarza!”"
 vikelas.125.g: "Jak to mogło się wydarzyć?"
 vikelas.126.t: "Karambol podczas Wyścigu Ulicznego"
 vikelas.126.d: "Wąskie ulice i wspólny start doprowadziły do karambolu podczas tegorocznego wyścigu ulicznego. Na szczęście zgłoszono jedynie lekkie obrażenia i po krótkiej przerwie wyścig wznowiono."
 vikelas.126.f: "„Kto mógł przewidzieć, że setki kolarzy próbujących wygrać zawody i startujących na drodze o szerokości 3 metrów spowodują wypadek? Byliśmy pewni, że w takiej sytuacji zawodnicy zachowają ostrożność” powiedział reporterowi jeden z organizatorów."
 vikelas.126.g: "Dobrze, że nikt nie zginął!"
 vikelas.127.t: "Pijany Kolarz"
 vikelas.127.d: "[SCOPE.sCharacter('vikelas_drunken_cyclist_scope').GetFullName], jeden z kolarzy reprezentujących nasz kraj, upił się podczas wyścigu ulicznego, uciął sobie drzemkę, po czym zawrócił i pojechał w niewłaściwym kierunku."
 vikelas.127.f: "„No więc ten kolarz dzielił pierwsze miejsce z innym zawodnikiem, ale zsiadł z roweru i wszedł do tawerny. Upał najwyraźniej przyprawił [SCOPE.sCharacter('vikelas_drunken_cyclist_scope').GetHerHim] o straszliwe pragnienie. Potem [SCOPE.sCharacter('vikelas_drunken_cyclist_scope').GetSheHe] wypił dwie całe butelki białego wina. Nigdy wcześniej nie widziałem, żeby ktoś pił tak szybko. Następnie [SCOPE.sCharacter('vikelas_drunken_cyclist_scope').GetSheHe] wyszedł na zewnątrz i zasnął. Próbowaliśmy [SCOPE.sCharacter('vikelas_drunken_cyclist_scope').GetHerHim] obudzić, aż w końcu [SCOPE.sCharacter('vikelas_drunken_cyclist_scope').GetSheHe] się ocknął i pospiesznie odjechał. Niestety [SCOPE.sCharacter('vikelas_drunken_cyclist_scope').GetSheHe] pojechał w niewłaściwym kierunku”."
 vikelas.127.g: "Co za żenujący pokaz!"
 vikelas.128.t: "Darmowe Piwo!"
 vikelas.128.d: "[SCOPE.sCharacter('vikelas_cheating_cyclist_scope').GetFullName] wygrał tegoroczny wyścig uliczny nie dlatego, że [SCOPE.sCharacter('vikelas_cheating_cyclist_scope').GetSheHe] był najszybszy, lecz dlatego, że [SCOPE.sCharacter('vikelas_cheating_cyclist_scope').GetSheHe] nie zatrzymał się na darmowe piwo."
 vikelas.128.f: "Tegoroczny Olimpijski Wyścig Uliczny zakończył się bardzo osobliwym zwycięstwem. Przez długi czas [SCOPE.sCharacter('vikelas_cheating_cyclist_scope').GetFullNameNoFormatting] pozostawał daleko w tyle, ale stolik z darmowym piwem skłonił [SCOPE.sCharacter('vikelas_cheating_cyclist_scope').GetHerHis] rywali do zatrzymania się. Gdy pili, [SCOPE.sCharacter('vikelas_cheating_cyclist_scope').GetLastNameNoFormatting] przemknął obok i wypracował znaczną przewagę, co doprowadziło do [SCOPE.sCharacter('vikelas_cheating_cyclist_scope').GetHerHis] zwycięstwa. Niektórzy twierdzą, że darmowe piwo nie było dziełem przypadku i że [SCOPE.sCharacter('vikelas_cheating_cyclist_scope').GetLastNameNoFormatting] sam za nie zapłacił. Niczego jednak nie można udowodnić."
 vikelas.128.g: "Ha! Tak się kończy picie."
 vikelas_positive_influence_on_score_tt: "Może to #p pozytywnie#! wpłynąć na szanse [GetPlayer.GetName] na zdobycie medali."
 vikelas.129.t: "Schwingerkönig wygrywa Zawody Zapaśnicze"
 vikelas.129.d: "Szwajcarski Schwinger [SCOPE.sCharacter('vikelas_schwingerkonig_scope').GetFullName] wygrał zawody zapaśnicze na tegorocznych Igrzyskach Olimpijskich."
 vikelas.129.f: "„Dostaję tylko złoty medal? W Szwajcarii dostajemy byka!”"
 vikelas.129.g: "Godny zwycięzca!"
 vikelas.130.t: "Przeciąganie Liny"
 vikelas.130.d: "Podczas głośnego turnieju przeciągania liny na Igrzyskach Olimpijskich nasz rywal [SCOPE.sCountry('vikelas_rival_country_scope').GetName] stosował nieuczciwe metody, aby wyprowadzić naszą drużynę z równowagi, po czym odniósł zwycięstwo. Przeciwnicy wielokrotnie obrażali naszych zawodników, żartując z naszego kraju, kultury i języka."
 vikelas.130.f: "Przeciąganie liny znajdowało się w programie Igrzysk Olimpijskich od 1900 do 1920 roku. Obecnie jest uznawane za samodzielny sport, dawniej zaliczano je do atletyki ciężkiej lub lekkoatletyki. W Paryżu rywalizowały tylko dwie drużyny: francuska oraz mieszana, złożona z Duńczyków i Szwedów. Każda liczyła sześciu zawodników. Rozgrywano najwyżej trzy rundy, a zwyciężała drużyna, która wygrała dwie z nich. Po raz ostatni przeciąganie liny rozegrano w Antwerpii. Pięć drużyn walczyło o medale w systemie Bergvalla. Po fazie pucharowej o złoto drużyny wyeliminowane przez późniejszego zwycięzcę rywalizowały w fazie pucharowej o srebro, a następnie według tej samej zasady rozegrano trzecią fazę pucharową o brąz."
 vikelas.130.g: "Jeszcze kiedyś tego pożałują!"
 vikelas.131.t_fencing: "Generał Szermierz"
 vikelas.131.t_shooting: "Generał Strzelec"
 vikelas.131.t_riding: "Generał Jeździec"
 vikelas.131.d_fencing: "Ku zdumieniu wielu [SCOPE.sCharacter('vikelas_olympic_general_scope').GetHerHis] towarzyszy broni [SCOPE.sCharacter('vikelas_olympic_general_scope').GetFullName] wziął udział w Igrzyskach Olimpijskich i zaskoczył [SCOPE.sCharacter('vikelas_olympic_general_scope').GetHerHis] przeciwników [SCOPE.sCharacter('vikelas_olympic_general_scope').GetHerHis] niezwykłymi umiejętnościami szermierczymi. Wystarczyło to jedynie na srebrny medal, lecz dla [SCOPE.sCharacter('vikelas_olympic_general_scope').GetHerHis] rodaków [SCOPE.sCharacter('vikelas_olympic_general_scope').GetSheHe] jest prawdziwym zwycięzcą."
 vikelas.131.d_shooting: "[SCOPE.sCharacter('vikelas_olympic_general_scope').GetFullName] wziął udział w Igrzyskach Olimpijskich i władał karabinem jak nikt inny. Tylko jeden niecelny strzał pozbawił [SCOPE.sCharacter('vikelas_olympic_general_scope').GetHerHim] złotego medalu. [SCOPE.sCharacter('vikelas_olympic_general_scope').GetSheHe|U] mimo to jest uznawany w ojczyźnie za bohatera."
 vikelas.131.d_riding: "Podczas Igrzysk Olimpijskich [SCOPE.sCharacter('vikelas_olympic_general_scope').GetFullName] zaprezentował tak imponujące umiejętności jeździeckie, że wielu widzów uznało [SCOPE.sCharacter('vikelas_olympic_general_scope').GetHerHim] za zwycięzcę. Dyskwalifikacja przekreśliła [SCOPE.sCharacter('vikelas_olympic_general_scope').GetHerHis] triumf, lecz [SCOPE.sCharacter('vikelas_olympic_general_scope').GetSheHe] nadal uchodzi za ulubieńca publiczności na igrzyskach."
 vikelas.131.f_fencing: "Szermierka należy do sportów obecnych na Igrzyskach Olimpijskich od pierwszej edycji w Atenach w 1896 roku. W ateńskim programie znalazły się trzy konkurencje: szabla i floret dla amatorów oraz floret dla mistrzów szermierki. Szpadę dodano w Paryżu w 1900 roku, a szermierkę drużynową w Antwerpii w 1920 roku. W 1920 roku w Antwerpii kobiety po raz pierwszy walczyły o złoto we florecie. Ponadto szpada jest jedną z pięciu dyscyplin pięcioboju nowoczesnego, który opracowano na nowo jako konkurencję olimpijską i po raz pierwszy rozegrano podczas Letnich Igrzysk w Sztokholmie w 1912 roku."
 vikelas.131.f_shooting: "MKOl włączył dziewięć konkurencji strzeleckich do programu Igrzysk II Olimpiady. Szczególną rolę odgrywało strzelanie z karabinu wojskowego, obejmujące 5 konkurencji: leżąc, klęcząc, stojąc, w trzech postawach oraz drużynowo. Spośród ponad 6,000 uczestniczących strzelców tylko 72 zawodników wzięło udział w konkurencjach olimpijskich. Strzelanie o nagrody pieniężne było wówczas powszechne i dochodowe, lecz przyjmowanie pieniędzy za osiągnięcia sportowe nie odpowiadało duchowi olimpijskiemu, dlatego zawodowcom nie wolno było uczestniczyć w zawodach olimpijskich. Do pozostałych konkurencji, które nie miały charakteru olimpijskiego, należały strzelanie do żywych gołębi, strzelanie z kuszy i strzelanie z armat."
 vikelas.131.f_riding: "MKOl włączył trzy konkurencje jeździeckie do programu Igrzysk II Olimpiady. Jeździectwo po raz pierwszy stało się wówczas dyscypliną olimpijską. Dokładnej liczby uczestników tych trzech konkurencji nie da się już ustalić. Z nazwiska znanych jest jedynie 15 jeźdźców z 5 państw. Wystartowało jednak jeszcze 50 zawodników, choć nie można wykluczyć, że część z nich brała udział w kilku konkurencjach. Zawody jeździeckie w Paryżu, Londynie i Sztokholmie były początkowo zarezerwowane dla oficerów. Ograniczenie to złagodzono dopiero podczas Igrzysk VII Olimpiady w Antwerpii."
 vikelas.131.g: "Znakomity sportowiec."
 vikelas.132.t_rowing: "Admirał Wioślarz"
 vikelas.132.t_sailing: "Admirał Żeglarz"
 vikelas.132.t_swimming: "Admirał Pływak"
 vikelas.132.d_rowing: "[SCOPE.sCharacter('vikelas_olympic_admiral_scope').GetFullName] jest nie tylko znakomitym admirałem, lecz także świetnym wioślarzem. [SCOPE.sCharacter('vikelas_olympic_admiral_scope').GetSheHe|U] wystartował na Igrzyskach Olimpijskich z [SCOPE.sCharacter('vikelas_olympic_admiral_scope').GetHerHis] własną drużyną i zdobył szacunek kolegów oraz publiczności."
 vikelas.132.d_sailing: "[SCOPE.sCharacter('vikelas_olympic_admiral_scope').GetFullName] wykorzystał [SCOPE.sCharacter('vikelas_olympic_admiral_scope').GetHerHis] bogate doświadczenie na Igrzyskach Olimpijskich: [SCOPE.sCharacter('vikelas_olympic_admiral_scope').GetSheHe] zdołał zdobyć srebrny medal wraz z [SCOPE.sCharacter('vikelas_olympic_admiral_scope').GetHerHis] drużyną żeglarską. To imponujące osiągnięcie inspiruje cały naród."
 vikelas.132.d_swimming: "Na Igrzyskach Olimpijskich doszło do niespodzianki. Bez wiedzy [SCOPE.sCharacter('vikelas_olympic_admiral_scope').GetHerHis] kolegów i bez poinformowania rządu [SCOPE.sCharacter('vikelas_olympic_admiral_scope').GetFullName] wystartował jako zwykły sportowiec. Kto by pomyślał, że [SCOPE.sCharacter('vikelas_olympic_admiral_scope').GetSheHe] okaże się tak znakomitym pływakiem? Nie wystarczyło to na złoty medal, lecz pozostawiło niezatarte wrażenie. Cóż za człowiek wielu talentów!"
 vikelas.132.f_rowing: "Podczas 2. Igrzysk Olimpijskich w Paryżu organizacja zawodów wioślarskich była tak zła, że komitet musiał rozegrać dwa finały. Uwzględnienie wyników obu finałów na liście zwycięzców MKOl świadczy o trudnościach z uporządkowaniem okoliczności, w jakich odbyły się Letnie Igrzyska Olimpijskie w 1900 roku."
 vikelas.132.f_sailing: "Żeglarstwo jest częścią programu Igrzysk od 1900 roku: podczas drugich nowożytnych Igrzysk Olimpijskich w Paryżu załogi po raz pierwszy rywalizowały o medale. Olimpijski debiut żeglarstwa miał nastąpić w Atenach w 1896 roku, lecz zawody nie mogły się odbyć z powodu złych warunków pogodowych. Z wyjątkiem Letnich Igrzysk Olimpijskich w 1904 roku żeglarstwo było obecne na każdej kolejnej edycji Igrzysk Olimpijskich. Większość olimpijskich regat rozgrywano w formule wyścigów flotowych. Podczas niektórych igrzysk stosowano jednak również formułę wyścigów meczowych lub formułę mieszaną, łączącą wyścigi flotowe i meczowe."
 vikelas.132.f_swimming: "Podczas Letnich Igrzysk Olimpijskich w 1896 roku rozegrano cztery konkurencje pływackie, wszystkie dla mężczyzn. Zaplanował je i zorganizował Podkomitet Sportów Wodnych. Wszystkie zawody odbyły się 11 kwietnia w zatoce Zea. Znajduje się tam port morski i przystań jachtowa w okolicach Aten. Wybrano ją na miejsce zawodów pływackich, ponieważ organizatorzy Igrzysk chcieli uniknąć wydatków na budowę specjalnego obiektu. Łącznie rywalizowało 13 uczestników z 4 krajów. Pływanie kobiet wprowadzono do programu olimpijskiego w 1912 roku."
 vikelas.133.t_boxing: "Polityk Bokser"
 vikelas.133.t_wrestling: "Polityk Zapaśnik"
 vikelas.133.t_archery: "Polityk Łucznik"
 vikelas.133.d_boxing: "Wielu już podejrzewało, że [SCOPE.sCharacter('vikelas_olympic_politician_scope').GetFullName] potrafi celnie ripostować. Jednak [SCOPE.sCharacter('vikelas_olympic_politician_scope').GetSheHe] pokazał podczas zawodów olimpijskich, że [SCOPE.sCharacter('vikelas_olympic_politician_scope').GetSheHe] potrafi też zadawać mocne ciosy. Może [SCOPE.sCharacter('vikelas_olympic_politician_scope').GetHerHis] polityczni rywale powinni odtąd bardziej uważać?"
 vikelas.133.d_wrestling: "Gdyby ktokolwiek podejrzewał, że [SCOPE.sCharacter('vikelas_olympic_politician_scope').GetFullName] jest utalentowanym zapaśnikiem, [SCOPE.sCharacter('vikelas_olympic_politician_scope').GetHerHis] polityczni rywale zastanowiliby się dwa razy, zanim zdecydowaliby się [SCOPE.sCharacter('vikelas_olympic_politician_scope').GetHerHim] zaczepić. Na Igrzyskach Olimpijskich [SCOPE.sCharacter('vikelas_olympic_politician_scope').GetSheHe] zdobył niemal tak wielką sympatię jak w [SCOPE.sCharacter('vikelas_olympic_politician_scope').GetHerHis] partii. Niewiele zabrakło do złotego medalu!"
 vikelas.133.d_archery: "[SCOPE.sCharacter('vikelas_olympic_politician_scope').GetFullName] od zawsze słynął z celnych przemówień. Jednak aż do [SCOPE.sCharacter('vikelas_olympic_politician_scope').GetHerHis] występu na Igrzyskach Olimpijskich tylko [SCOPE.sCharacter('vikelas_olympic_politician_scope').GetHerHis] najbliżsi przyjaciele wiedzieli, że [SCOPE.sCharacter('vikelas_olympic_politician_scope').GetSheHe] w [SCOPE.sCharacter('vikelas_olympic_politician_scope').GetHerHis] wolnym czasie z powodzeniem uprawia łucznictwo. Gdyby wyborcy kochali [SCOPE.sCharacter('vikelas_olympic_politician_scope').GetHerHim] tak jak publiczność tego międzynarodowego święta sportu, [SCOPE.sCharacter('vikelas_olympic_politician_scope').GetSheHe] wkrótce stanąłby na czele państwa!"
 vikelas.133.f_boxing: "Boks jest jedną z najstarszych dyscyplin olimpijskich. Początki walk na pięści, będących poprzednikiem współczesnego boksu, sięgają Igrzysk Olimpijskich w 688 roku p.n.e. Boks zadebiutował jako nowożytny sport olimpijski podczas Igrzysk w Saint Louis w 1904 roku. Udział wzięli jednak wyłącznie Amerykanie, łącznie 44 zawodników w siedmiu kategoriach wagowych. W 1912 roku nie rozegrano olimpijskiego turnieju bokserskiego, ponieważ boks był wówczas zakazany w Szwecji."
 vikelas.133.f_wrestling: "Podczas Letnich Igrzysk Olimpijskich w 1896 roku rozegrano jedną konkurencję zapaśniczą. Zorganizował ją i przygotował Podkomitet Zapasów i Gimnastyki. Rywalizowało pięciu zawodników z czterech państw. Zwyciężył Niemiec Carl Schumann. Początkowo walczono w stylu klasycznym, a styl wolny wprowadzono w 1904 roku. Zapasy zajmowały ważne miejsce na igrzyskach, między innymi dlatego, że były obecne już na starożytnych Igrzyskach Olimpijskich."
 vikelas.133.f_archery: "Międzynarodowy Komitet Olimpijski (MKOl) włączył sześć konkurencji łuczniczych do programu Igrzysk II Olimpiady, ponieważ zgodnie ze stanowiskiem Pierre’a de Coubertina, twórcy nowożytnych Igrzysk Olimpijskich, oraz MKOl podstawowym warunkiem uznania zawodów łuczniczych za olimpijskie był międzynarodowy udział. Łucznictwo było wówczas popularnym sportem, dlatego zawody otwarto wielką paradą z udziałem 1,723 łuczników. W całych zawodach uczestniczyło 5254 zawodników. W sześciu konkurencjach programu olimpijskiego znane są nazwiska jedynie 17 uczestników pochodzących z Francji i Belgii. W rzeczywistości startowało w nich jednak znacznie więcej łuczników. Historycy sportu szacują łączną liczbę uczestników na 153, w tym zawodników z Holandii."
 vikelas.134.t: "Mistrz Olimpijski"
 vikelas.134.d: "Po wielu próbach i latach treningów [SCOPE.sCharacter('vikelas_olympic_champion_scope').GetFullName] dzięki niezłomnemu duchowi wreszcie odniósł długo wyczekiwany sukces: olimpijczyk powrócił jako mistrz i z dumą nosi [SCOPE.sCharacter('vikelas_olympic_champion_scope').GetSheHer] złoty medal!"
 vikelas.134.f: "Znany nam dziś system olimpijski, w którym zwycięzca otrzymuje złoty medal, zdobywca drugiego miejsca srebrny, a trzeciego brązowy, nie istniał od początku. W 1896 i 1900 roku medalami nagradzano tylko dwóch najlepszych zawodników: srebrnym za pierwsze miejsce i brązowym za drugie. W 1904 roku zwycięzca po raz pierwszy otrzymał złoty medal, a pozostałe kolory medali przypisano miejscom o jedną pozycję niższym."
 vikelas.134.g: "Bohater narodowy!"
 vikelas.141.t: "Brak Żaglówek!"
 vikelas.141.d: "Choć w programie tegorocznych Igrzysk Olimpijskich miały znaleźć się zawody żeglarskie, z jakiegoś powodu nie zapewniono żadnych żaglówek. Może to oznaczać odwołanie tej konkurencji."
 vikelas.141.f: "„Gdzie są Żaglówki?”\n„Myślałem, że to ty miałeś je zapewnić”.\n„Ja?! Przecież zorganizowałem już zawody wioślarskie. To ty odpowiadałeś za żeglarstwo!”\n\n#b Historycznie#! zawody żeglarskie podczas pierwszych Igrzysk Olimpijskich nie mogły się odbyć, ponieważ ani zawodnicy, ani organizatorzy nie zapewnili żaglówek."
 vikelas.141.g: "To hańba dla naszego narodu! Zdobądźcie skądś Żaglówki!"
 vikelas.141.h: "Chyba w tym roku nie będzie żeglarstwa."
 vikelas.142.t: "Ustawiony Mecz Piłkarski?"
 vikelas.142.d: "Pojawiają się wątpliwości, czy mecz piłkarski między naszym krajem a [SCOPE.sCountry('vikelas_olympics_football_country_scope').GetName] będzie rzeczywiście sędziowany sprawiedliwie. Obserwatorzy twierdzą, że sędzia jest stronniczy i podejmuje decyzje na naszą korzyść."
 vikelas.142.f: "Piłka nożna jest oficjalną dyscypliną olimpijską od Igrzysk Olimpijskich w 1908 roku. W zawodach rywalizowały jednak również kluby piłkarskie, a czasami drużyny mieszane. Mecze międzypaństwowe rozgrywano dopiero od 1908 roku. Pierwsze oficjalne spotkanie w historii wygrała reprezentacja Danii, pokonując drugą reprezentację (French B) Francji podczas olimpijskiego turnieju piłkarskiego w 1908 roku. Do 1928 roku turniej olimpijski miał niemal taką samą rangę jak mistrzostwa świata w piłce nożnej. Jego znaczenie gwałtownie jednak spadło po wprowadzeniu mistrzostw świata w 1930 roku i rozwoju zawodowstwa, zwłaszcza w niektórych krajach Europy i Ameryki Południowej w latach 20. i 30. XX wieku. Do startu uprawnieni byli bowiem wyłącznie amatorzy, przez co najlepsi piłkarze z tych krajów nie mogli już uczestniczyć w turniejach."
 vikelas.142.g: "Przecież był ewidentny spalony!"
 vikelas.142.h: "[SCOPE.sCountry('vikelas_olympics_football_country_scope').GetName] zasłużenie wygrywa mecz."
 vikelas.143.t: "Nowa Legenda Maratonu"
 vikelas.143.d: "Maratończyk [SCOPE.sCharacter('vikelas_olympic_marathon_athlete_scope').GetFullName] wygrał maraton w tak imponującym stylu, że [SCOPE.sCharacter('vikelas_olympic_marathon_athlete_scope').GetSheHe] jest teraz uznawany za bohatera narodowego!"
 vikelas.143.f: "Biegnący w białych rękawiczkach [SCOPE.sCharacter('vikelas_olympic_rival_athlete_1_scope').GetFullName], faworyt z [SCOPE.sCountry('vikelas_olympic_rival_country_1_scope').GetName], wysunął się przed rywali: [SCOPE.sCharacter('vikelas_olympic_rival_athlete_2_scope').GetFullName] z [SCOPE.sCountry('vikelas_olympic_rival_country_2_scope').GetName] oraz [SCOPE.sCharacter('vikelas_olympic_rival_athlete_3_scope').GetFullName] z [SCOPE.sCountry('vikelas_olympic_rival_country_3_scope').GetName]. Ta trójka zajęła pierwsze trzy miejsca w biegu na 1500 metrów. Podobno [SCOPE.sCharacter('vikelas_olympic_marathon_athlete_scope').GetLastName] na 22 kilometrze wypił w gospodzie kieliszek wina i głośno zapowiedział [SCOPE.sCharacter('vikelas_olympic_marathon_athlete_scope').GetHerHis] zwycięstwo. [SCOPE.sCharacter('vikelas_olympic_marathon_athlete_scope').GetSheHe|U] dotrzymał [SCOPE.sCharacter('vikelas_olympic_marathon_athlete_scope').GetHerHis] obietnicy i wyprzedził wszystkich. Tylko [SCOPE.sCharacter('vikelas_olympic_rival_athlete_2_scope').GetFullName] zdołał [SCOPE.sCharacter('vikelas_olympic_marathon_athlete_scope').GetHerHim] dogonić, lecz potem padł z wyczerpania. [SCOPE.sCharacter('vikelas_olympic_marathon_athlete_scope').GetLastName] podobno wzmacniał [SCOPE.sCharacter('vikelas_olympic_marathon_athlete_scope').GetHerselfHimself] po drodze owczym serem, brandy i ciepłymi słowami [SCOPE.sCharacter('vikelas_olympic_marathon_athlete_scope').GetHerHis] rodaków. [SCOPE.sCharacter('vikelas_olympic_marathon_athlete_scope').GetSheHe|U] wbiegł na stadion i pokornie padł na [SCOPE.sCharacter('vikelas_olympic_marathon_athlete_scope').GetHerHis] strudzone kolana przed [SCOPE.sCharacter('vikelas_olympic_marathon_athlete_scope').GetHerHis] monarchą: „Jestem tylko prostym rolnikiem, mój [SCOPE.sCharacter('vikelas_ruler').GetPrimaryRoleTitle]”."
 vikelas.143.g: "Prawdziwy olimpijczyk!"
 vikelas.144.t: "Dobrze Zorganizowane Igrzyska Olimpijskie"
 vikelas.144.d: "Pozostali uczestnicy Igrzysk Olimpijskich nie szczędzą pochwał za dobrą organizację zawodów. Wszystko przebiega sprawnie."
 vikelas.144.f: "„Organizować Igrzyska Olimpijskie to przywoływać historię”. -Pierre de Coubertin"
 vikelas.144.g: "Doskonale"
 vikelas.145.t: "Oklaskiwany Gospodarz"
 vikelas.145.d: "Sportowcy i zagraniczni widzowie nie szczędzą pochwał za gościnność naszego kraju. Zrobiliśmy dobre wrażenie na świecie."
 vikelas.145.f: "„Igrzyska Olimpijskie są dla całego świata i wszystkie narody muszą mieć prawo w nich uczestniczyć”. -Pierre de Coubertin"
 vikelas.151.t_sailing: "Zawody żeglarskie odbywają się mimo problemów"
 vikelas.151.t_no_sailing: "Brak zawodów żeglarskich"
 vikelas.151.d_sailing: "Choć [SCOPE.sCountry('vikelas_olympics_host_scope').GetName] początkowo nie zapewniło łodzi na zawody żeglarskie, udało się sprowadzić kilka żaglówek z innych miast i krajów."
 vikelas.151.d_no_sailing: "Ponieważ [SCOPE.sCountry('vikelas_olympics_host_scope').GetName] nie zapewniło łodzi na zawody żeglarskie, w tym roku zawody się nie odbędą."
 vikelas.151.f_sailing: "Zawody żeglarskie uratowano w ostatniej chwili dzięki przybyciu żaglówek z pobliskich portów. Na szczęście pogoda również sprzyjała rywalizacji.\n\n#b Historycznie#! zawody żeglarskie podczas pierwszych Igrzysk Olimpijskich nie mogły się odbyć, ponieważ ani zawodnicy, ani organizatorzy nie zapewnili żaglówek."
 vikelas.151.f_no_sailing: "Regaty nie mogły się odbyć, ponieważ nie zadbano o sprowadzenie odpowiednich łodzi.\n — Charalambos Anninos\n\n#b Historycznie#! zawody żeglarskie podczas pierwszych Igrzysk Olimpijskich nie mogły się odbyć, ponieważ ani zawodnicy, ani organizatorzy nie zapewnili żaglówek."
 vikelas.151.g: "Mam nadzieję, że nasi sportowcy wygrają!"
 vikelas.151.h: "O jeden medal mniej dla naszych rywali!"
 vikelas.151.i: "Mam ważniejsze sprawy na głowie. Dajcie mi spokój."
 vikelas.161.t: "Autostopem przez Maraton"
 vikelas.161.d: "Gdy nasz biegacz, [SCOPE.sCharacter('vikelas_hitchhiker_scope').GetFullName], jako pierwszy przekroczył linię mety, wszyscy byli zachwyceni. Wkrótce jednak okazało się, że [SCOPE.sCharacter('vikelas_hitchhiker_scope').GetSheHe] przejechał 11 kilometrów trasy, zabrawszy się powozem. W związku z tym [SCOPE.sCharacter('vikelas_hitchhiker_scope').GetLastName] został zdyskwalifikowany. [SCOPE.sCharacter('vikelas_hitchhiker_scope').GetSheHe|U] twierdził, że [SCOPE.sCharacter('vikelas_hitchhiker_scope').GetSheHe] chciał tylko zrobić psikusa, ale może to zaszkodzić reputacji naszego kraju."
 vikelas.161.f: "„[SCOPE.sCharacter('vikelas_hitchhiker_scope').GetSheHe|U] miał ręcznik, gdy [SCOPE.sCharacter('vikelas_hitchhiker_scope').GetHerHim] zabierałem. Skąd miałem wiedzieć, że [SCOPE.sCharacter('vikelas_hitchhiker_scope').GetSheHe] uczestniczy w zawodach olimpijskich? Kto nosi ze sobą ręcznik, jest przygotowany na wszystko!\n"
 vikelas.161.g: "Nie Panikuj!"
 vikelas.162.t: "Pojawił się Dziki Pies"
 vikelas.162.d: "Nasz Maratończyk, [SCOPE.sCharacter('vikelas_chased_by_dogs_scope').GetFullName], przypadkowo wbiegł w wysoką trawę, skąd wyskoczył dziki pies i zaczął go gonić. Dopiero gdy [SCOPE.sCharacter('vikelas_chased_by_dogs_scope').GetSheHe] dotarł na pole kukurydzy, gdzie [SCOPE.sCharacter('vikelas_chased_by_dogs_scope').GetSheHe] mógł się ukryć, pies zaprzestał pościgu."
 vikelas.162.f: "\"Woof! Woof!\n"
 vikelas.162.g: "[SCOPE.sCharacter('vikelas_chased_by_dogs_scope').GetSheHe|U] nie powinien był wchodzić w wysoką trawę!"
 vikelas.163.t: "W Dziesiątkę, ale w niewłaściwą tarczę"
 vikelas.163.d: "Jeden z naszych strzelców, [SCOPE.sCharacter('vikelas_bad_shooter_scope').GetFullName], miał idealny wynik i pozostał mu już tylko jeden strzał. Ostatni pocisk również trafił w dziesiątkę... ale na niewłaściwej tarczy. Strzał oceniono na 0 punktów, przez co [SCOPE.sCharacter('vikelas_bad_shooter_scope').GetLastName] musiał pożegnać się z [SCOPE.sCharacter('vikelas_bad_shooter_scope').GetHerHis] zwycięstwem."
 vikelas.163.f: "„Przysięgam, trafiłem w swoją tarczę! Jestem tego absolutnie pewien! Nigdy nie trafiam w niewłaściwą tarczę! To się nigdy nie zdarza!\n"
 vikelas.163.g: "Cóż za okropny sposób na przegraną!"
 vikelas.182.t: "Znicz Olimpijski"
 vikelas.182.d: "Biegacz niosący ogień olimpijski do [SCOPE.sCountry('vikelas_olympic_country').GetName], gdzie zainauguruje Igrzyska Olimpijskie, przebiegł dziś przez [SCOPE.sState('capital_scope').GetName]. Było to inspirujące wydarzenie dla mieszkańców!"
 vikelas.182.f: "Ogień olimpijski, nawiązujący do wiecznie płonącego ognia w palenisku greckiej bogini Hestii, po raz pierwszy pojawił się na Igrzyskach Olimpijskich w Amsterdamie w 1928 roku. Związaną z nim tradycję sztafety z pochodnią olimpijską wprowadzono podczas Letnich Igrzysk w Berlinie w 1936 roku. Wbrew powszechnemu przekonaniu pomysł ten nie pochodził od narodowych socjalistów, lecz od niemieckiego archeologa żydowskiego pochodzenia Alfreda Schiffa. Wprowadzenie tej tradycji nie tylko nadałoby Igrzyskom Olimpijskim nowy rozpoznawalny symbol, lecz także co roku jednoczyłoby społeczeństwo i podnosiło je na duchu, odwracając uwagę od innych bolączek."
 vikelas.182.g: "Panem et circensis."
 vikelas.183.t: "Znicz Olimpijski"
 vikelas.183.d: "Po wspaniałej ceremonii otwarcia, podczas której wszystkie kraje świata zaprezentowały się w okazałej defiladzie, nastąpił punkt kulminacyjny: zapalono znicz olimpijski. Tłumy są zachwycone!"
 vikelas.183.f: "W ciągu XX wieku Igrzyska Olimpijskie coraz wyraźniej stawały się zjawiskiem masowym, którego świecka obrzędowość pozwalała społeczeństwu oddalającemu się od ideałów religijnych i narodowych odnaleźć pewne poczucie sensu, zarówno w wymiarze narodowym, jak i kosmopolitycznym. Jedni widzieli w tym okazję do podkreślenia wyjątkowej pozycji własnego kraju, dla innych większe znaczenie miała idea pokojowych spotkań narodów podczas sportowej rywalizacji. Dla kraju gospodarza była to natomiast okazja do zaprezentowania się własnemu społeczeństwu i całemu światu na niemal niespotykaną dotąd skalę."
 vikelas.183.g: "Nasi obywatele postrzegają nasz kraj jako wielki."
 vikelas.183.h: "Narody świata postrzegają nasz kraj jako wielki."
 vikelas.191.t: "MKOl w [ROOT.GetCountry.GetNameNoFlag]"
 vikelas.191.d: "Wskutek zmian politycznych MKOl musiał przenieść swoją siedzibę. Uznaje [ROOT.GetCountry.GetNameNoFlag] za odpowiednie miejsce i oferuje temu krajowi przewodnictwo w Zarządzie."
 vikelas.191.f: "Jeśli pierwotny kraj założycielski MKOl z jakiegokolwiek powodu zniknie z mapy, komitet przeniesie swoją siedzibę do innego kraju i przeprowadzi ponowne wybory wszystkich władz. W zamian krajowi przyjmującemu organizację zostanie zaoferowane przewodnictwo. Typowymi kandydatami w takich przypadkach są Szwajcaria lub Grecja. Jeśli te kraje również nie istnieją, przewodnictwo zostanie zaoferowane Wielkiemu Mocarstwu, które już zasiada w Zarządzie."
 vikelas.191.g: "Wybierz nowy MKOl."
 vikelas_no_more_olympic_flavor_notification_events_tt: "#n Nie będziesz już#! otrzymywać Wydarzeń dotyczących Igrzysk Olimpijskich, które służą jedynie budowaniu klimatu."
