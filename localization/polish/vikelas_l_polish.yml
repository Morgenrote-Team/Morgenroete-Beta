 vikelas_sports_clubs_tech: "Kluby Sportowe"
 vikelas_sports_clubs_tech_desc: "W XVIII wieku w Anglii zaczęły powstawać pierwsze kluby sportowe, szczególnie związane z wyścigami konnymi, boksem i krykietem. Odegrały one kluczową rolę w instytucjonalizacji sportu: dzięki strukturom organizacyjnym, członkostwu i regularnie organizowanym zawodom ustanowiono obowiązujące zasady i regulaminy. Ta profesjonalizacja położyła podwaliny pod współczesne systemy sportowe, obejmujące związki sportowe, ligi i zawody międzynarodowe."
 vikelas_international_sports_tech: "Sport Międzynarodowy"
 vikelas_international_sports_tech_desc: "Popularność zawodów sportowych rozprzestrzeniała się najpierw na skalę krajową, a następnie międzynarodową. Aby lepiej regulować rywalizację między narodami, konieczne stało się powołanie międzynarodowych komitetów i federacji oraz ustanowienie wspólnych zasad. Igrzyska Olimpijskie i Międzynarodowy Komitet Olimpijski (MKOl) są najbardziej rozpoznawalnymi symbolami tego rozwoju."
