 vikelas.300.t: "Nowy Sport"
 vikelas.300.d_football: "Coraz więcej naszych obywateli fascynuje się nową grą: Piłką Nożną. Choć wielu krytycznie odnosi się do tego „importu” z [SCOPE.sCountry('vikelas_overlord_country_scope').GetName], sport ten stał się już tak popularny, że niemal nie sposób od niego uciec."
 vikelas.300.d_baseball: "Coraz więcej naszych obywateli fascynuje się nową grą: Baseballem. Choć wielu krytycznie odnosi się do tego „importu” z [SCOPE.sCountry('vikelas_overlord_country_scope').GetName], sport ten stał się już tak popularny, że niemal nie sposób od niego uciec."
 vikelas.300.d_cricket: "Coraz więcej naszych obywateli fascynuje się nową grą: Krykietem. Choć wielu krytycznie odnosi się do tego „importu” z [SCOPE.sCountry('vikelas_overlord_country_scope').GetName], sport ten stał się już tak popularny, że niemal nie sposób od niego uciec."
 vikelas.300.f: "„Gra jest formą odpoczynku, a ponieważ nie można pracować bez przerwy, odpoczynek jest niezbędny”. -Arystoteles"
 vikelas.300.g: "Gol!"
 vikelas.300.h: "Daj mi mój kij!"
 vikelas.300.i: "Nice ball."
 vikelas.300.football.tt: "Piłka nożna stanie się sportem narodowym w [GetPlayer.GetName]."
 vikelas.300.baseball.tt: "Baseball stanie się sportem narodowym w [GetPlayer.GetName]."
 vikelas.300.cricket.tt: "Krykiet stanie się sportem narodowym w [GetPlayer.GetName]."
 vikelas.301.t: "Założono Klub Krykieta"
 vikelas.301.d: "Kilka wpływowych osób założyło klub sportowy, aby oddawać się swojej ulubionej rozrywce: Klub Krykieta [SCOPE.GetRootScope.GetState.GetStateRegion.GetCityHubName]."
 vikelas.301.f: "W XIX wieku krykiet przekształcił się z wiejskiej rozrywki w sport o znaczeniu krajowym i międzynarodowym. Angielskie wyższe sfery uczyniły go swoim ulubionym zajęciem: grę uprawiano w szkołach z internatem, takich jak Eton i Harrow, i wychwalano jako „sport dżentelmenów”. Jednocześnie rosła jej popularność wśród klasy robotniczej, zwłaszcza w północnej Anglii, gdzie robotnicy fabryczni zakładali własne kluby. Ta demokratyzacja gry doprowadziła do bezprecedensowego wzrostu liczby klubów i widzów.\n\nNa mecze międzypaństwowe nie trzeba było długo czekać. W 1844 roku w Nowym Jorku rozegrano pierwszy udokumentowany mecz międzypaństwowy na świecie, w którym zmierzyły się Kanada i Stany Zjednoczone."
 vikelas.301.g: "Daj mi mój kij!"
 vikelas.301.h: "Cóż za pretensjonalna gra."
 vikelas.302.t: "Założono Klub Baseballowy"
 vikelas.302.d: "Baseball stał się popularną rozrywką w regionie [SCOPE.sState('vikelas_baseball_club_state_scope').GetName]. Powstał nowy klub baseballowy, który regularnie rozgrywa mecze: [SCOPE.sState('vikelas_baseball_club_state_scope').GetCustom('vikelas_historical_baseball_club_names_type')]."
 vikelas.302.f: "W latach 40. XIX wieku baseball zaczął wychodzić z cienia swoich poprzedników i nabierać odrębnego charakteru. Stany Zjednoczone przechodziły gwałtowną urbanizację, a rozwijające się miasta poszukiwały rozrywek, które jednoczyłyby mieszkańców i odzwierciedlały ducha młodego narodu. Przełom nastąpił w 1845 roku, gdy Alexander Cartwright i członkowie nowojorskiego Knickerbocker Base Ball Club opracowali pierwsze ujednolicone zasady gry. Te „zasady Knickerbocker” położyły podwaliny pod współczesny baseball: boisko w kształcie rombu z czterema bazami, trzy auty na zmianę i dziewięciu zawodników w drużynie. Znacznie różniły się od mniej sformalizowanych odmian rozgrywanych dotąd na trawnikach i polach. 19 czerwca 1846 roku klub Knickerbocker rozegrał w Hoboken w stanie New Jersey pierwszy udokumentowany mecz według tych zasad. Drużyna przegrała z New York Nine, lecz wydarzenie to uznano za symboliczne narodziny zorganizowanego baseballu."
 vikelas.302.g: "Homerun."
 vikelas.303.t: "Założono Klub Piłkarski"
 vikelas.303.d: "Robotnicy i pracownicy fizyczni w regionie [SCOPE.sState('vikelas_football_club_state_scope').GetName] od tygodni spotykają się, by grać w piłkę nożną. Teraz założyli klub: [SCOPE.sState('vikelas_football_club_state_scope').GetCustom('vikelas_historical_football_club_names_type')]."
 vikelas.303.f: "W pierwszej połowie XIX wieku piłka nożna w Anglii nie była jeszcze jednolitym sportem, lecz zbiorczym określeniem różnych gier w piłkę uprawianych w miastach, wsiach i szkołach. Ich zasady często znacznie się różniły. Pierwszym krokiem ku ujednoliceniu były zasady z Cambridge z 1848 roku, stanowiące próbę opracowania wspólnych reguł dla tamtejszych studentów. Nie były ostatecznym rozwiązaniem, lecz położyły podwaliny pod dalsze zmiany. Prawdziwy przełom nastąpił 26 października 1863 roku, gdy przedstawiciele jedenastu klubów spotkali się w londyńskiej Freemasons' Tavern i założyli angielski związek piłkarski Football Association (FA). W ciągu kilku tygodni uzgodnili zasady dopuszczające grę wyłącznie nogami i zabraniające noszenia lub rzucania piłki. Kompromis ten rozgniewał zwolenników rugby, którzy następnie odłączyli się i opracowali własne reguły. Wraz z powstaniem FA narodziła się nowoczesna piłka nożna."
 vikelas.303.g: "Gol!"
 vikelas.304.t: "Założono Klub Koszykówki"
 vikelas.304.d: "W regionie [SCOPE.sState('vikelas_basketball_club_state_scope').GetName] założono klub koszykówki, którego celem jest popularyzacja tej gry na całym obszarze [GetPlayer.GetName]."
 vikelas.304.f: "Koszykówka jest najmłodszym z wielkich współczesnych sportów. Jej korzenie są ściśle związane z ruchami społecznymi końca XIX wieku. W 1891 roku kanadyjski lekarz i nauczyciel wychowania fizycznego James Naismith stanął przed wyzwaniem: musiał wymyślić dla studentów Instytutu Szkoleniowego YMCA w Springfield w stanie Massachusetts grę halową, w którą mogliby grać nawet podczas mroźnej zimy w Nowej Anglii. YMCA chciała poprzez sport wzmacniać zdrowie fizyczne i moralne młodych mężczyzn, realizując projekt wychowawczy w duchu protestantyzmu i urbanizacji. Koszykówka, z szybkimi zmianami zawodników i jasnymi zasadami, doskonale wpisywała się w tę misję. Była grą, która budowała poczucie wspólnoty, a zarazem zapewniała rozwijającym się amerykańskim miastom nową formę rekreacji."
 vikelas.304.g: "Splash!"
 vikelas.304.h: "Co za głupia gra."
 vikelas.311.t: "Gazeta Sportowa"
 vikelas.311.d: "W regionie [SCOPE.sState('vikelas_gazette_state').GetName] pewien wydawca stworzył nowy rodzaj gazety: poświęconej wyłącznie doniesieniom sportowym, ze szczególnym uwzględnieniem dyscypliny [GetPlayer.MakeScope.Var('vikelas_national_sport_var').GetFlagName]. Gazeta sprzedaje się jak świeże bułeczki."
 vikelas.311.f: "Gdy pod koniec XIX wieku sport opuścił areny i wkroczył do miast, kawiarni oraz świadomości mas, potrzebował nowego medium. O zwycięstwach i porażkach chcieli wiedzieć nie tylko widzowie na stadionach, lecz także robotnik pod bramą fabryki i urzędnik z gazetą w ręku. We Włoszech na tę potrzebę odpowiedziała „Gazzetta dello Sport”, otwierając nową epokę dziennikarstwa sportowego. Założona 3 kwietnia 1896 roku w Mediolanie, zaledwie trzy tygodnie przed pierwszymi nowożytnymi Igrzyskami Olimpijskimi w Atenach, Gazzetta od początku była czymś więcej niż biuletynem wyników. Postrzegała siebie jako głos rozwijających się dyscyplin: kolarstwa, lekkoatletyki, piłki nożnej, szermierki i wszystkiego, co niosło ze sobą szybkość, rywalizację oraz pasję. Początkowo ukazywała się dwa razy w tygodniu, drukowana czarną farbą na zwykłym papierze. Nie ograniczała się do suchych faktów: opowiadała historie, czyniła ze sportowców bohaterów, a z meczów dramaty. W 1899 roku nastąpiła zmiana, która nadała gazecie kultowy charakter: papier stał się różowy. Początkowo był to wybór czysto praktyczny, ponieważ różowy papier kosztował mniej, lecz wkrótce stał się znakiem rozpoznawczym gazety."
 vikelas.321.t: "Baseball"
 vikelas.321.d: "Mieszkańcy naszego kraju poznali amerykański sport, który zdobywa coraz więcej fanów. [GetPlayer.GetNameNoFlag] ogarnia baseballowa gorączka."
 vikelas.321.f: "Choć baseball jest postrzegany jako sport narodowy USA, rozpowszechnił się również w innych, zasadniczo odmiennych krajach, gdzie wkrótce zyskał podobną pozycję. Do Japonii sprowadził go Horace Wilson w 1872 roku, niedługo po otwarciu kraju na świat. W czasach, gdy Japonia chętnie przyjmowała zachodnie nowinki, gra szybko zdobyła popularność. Musiało jednak upłynąć ponad 30 lat, zanim zaczęła się profesjonalizować.\n\nBaseball po raz pierwszy pojawił się w Chinach w 1864 roku, gdy amerykański lekarz i misjonarz Henry William Boone założył Shanghai Baseball Club. Następnie dynastia Qing zaczęła wysyłać chińskich studentów do Ameryki, aby lepiej poznali grę. Początek zorganizowanych rozgrywek baseballowych wyznaczył mecz między Uniwersytetem św. Jana a klubem baseballowym Shanghai MCA w 1905 roku.\n\nBaseball spopularyzował na Kubie Nemesio Guillot, który założył pierwszy duży klub baseballowy w kraju. W latach 70. XIX wieku, jeszcze przed okresem amerykańskiej interwencji, stał się on najczęściej uprawianym sportem na wyspie. Mimo amerykańskiego pochodzenia baseball jest silnie związany z kubańskim nacjonalizmem, ponieważ skutecznie wyparł sporty hiszpańskich kolonizatorów, takie jak walki byków."
 vikelas.403.t: "FIFA: Nowy Zarząd"
 vikelas.403.f: "FIFA ustaliła następujący skład:\n\n#V Prezes: [GetGlobalVariable('vikelas_fifa_president_global_var').GetCountry.GetName] #!\n\n#V Zarząd: [GetGlobalVariable('vikelas_fifa_board_member_1_global_var').GetCountry.GetName|V] [GetGlobalVariable('vikelas_fifa_board_member_2_global_var').GetCountry.GetName|V] [GetGlobalVariable('vikelas_fifa_board_member_3_global_var').GetCountry.GetName|V] [GetGlobalVariable('vikelas_fifa_board_member_4_global_var').GetCountry.GetName|V] [GetGlobalVariable('vikelas_fifa_board_member_5_global_var').GetCountry.GetName|V]"
