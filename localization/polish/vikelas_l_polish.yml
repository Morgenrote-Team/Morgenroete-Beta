 vikelas_become_ioc_president_tt: "[GetPlayer.GetName] zostaje nowym Prezesem MKOl"
 vikelas_ioc_foundation_button: "Załóż MKOl"
 vikelas_ioc_foundation_button_desc: "Międzynarodowy Komitet Olimpijski (MKOl) jest organizacją pozarządową działającą w prawnej formie stowarzyszenia. Celem komitetu jest organizowanie i nadzorowanie współczesnych igrzysk olimpijskich. Państwo założycielskie posiada stałe miejsce w zarządzie, który decyduje o lokalizacjach igrzysk olimpijskich. Wkrótce po założeniu MKOl mogą zostać zorganizowane pierwsze igrzyska olimpijskie, które od tego momentu będą odbywać się co cztery lata. Na określonych warunkach inne państwa mogą dołączyć do MKOl jako pełnoprawni członkowie, lecz liczba miejsc w zarządzie jest ograniczona."
 vikelas_ioc_statistics_button: "Odwiedź MKOl"
 vikelas_ioc_statistics_button_desc: "Przejdź do Międzynarodowego Komitetu Olimpijskiego, aby uzyskać informacje o członkach, następnych igrzyskach olimpijskich lub międzynarodowej tabeli medalowej."
 vikelas_ioc_member_button: "Zostań członkiem MKOl"
 vikelas_ioc_member_button_desc: "Dołącz do Międzynarodowego Komitetu Olimpijskiego, aby rywalizować w odbywających się co cztery lata igrzyskach olimpijskich. Członkowie MKOl mają również szansę na organizację igrzysk we własnym kraju."
 vikelas_ioc_bribe_button: "Przekup MKOl"
 vikelas_ioc_bribe_button_desc: "Dzięki hojnemu „datkowi” dla zarządu MKOl możemy zdobyć przychylność członków i zostać umieszczeni jako czwarty kandydat w kolejności przydzielania kolejnych igrzysk olimpijskich. Nie ma jednak gwarancji, że zostaniemy później wybrani. Inni członkowie MKOl również mogą źle zrozumieć naszą hojność."
 vikelas_olympic_flame_button: "Znicz Olimpijski"
 vikelas_olympic_flame_button_desc: "Ogień olimpijski, oparty na wiecznie płonącym ogniu domowego ogniska greckiej bogini Hestii, został po raz pierwszy wprowadzony podczas igrzysk olimpijskich w Amsterdamie w 1928 roku. Tradycja związanej z nim sztafety z ogniem olimpijskim została wprowadzona podczas letnich igrzysk w Berlinie w 1936 roku. Wbrew powszechnemu przekonaniu pomysł ten nie pochodził od narodowych socjalistów, lecz od niemieckiego archeologa żydowskiego pochodzenia Alfreda Schiffa. Wprowadzenie tej tradycji nie tylko nadałoby igrzyskom olimpijskim nowy symbol tożsamości, ale także jednoczyłoby ludność każdego roku i służyłoby jako podnoszący na duchu symbol odwracający uwagę od innych problemów."
 vikelas_school_sport_button: "Wprowadź Szkolny Sport"
 vikelas_school_sport_button_desc: "Wprowadzenie sportu szkolnego zwiększy szansę na pojawienie się postaci z cechami sportowców i poprawi nasze szanse na sukces na Igrzyskach Olimpijskich."
 vikelas_football_worldcup_button: "Zorganizuj Mistrzostwa Świata w Piłce Nożnej"
 vikelas_football_worldcup_button_desc: "Mistrzostwa Świata w Piłce Nożnej to rozgrywki piłkarskie z udziałem reprezentacji narodowych. Co cztery lata drużyny mogą zakwalifikować się do turnieju finałowego. Podczas trwającego cztery tygodnie turnieju wyłaniana jest najlepsza reprezentacja narodowa, która zdobywa tytuł mistrza świata. Międzynarodowa Federacja Piłki Nożnej (Fédération Internationale de Football Association, FIFA) organizuje turniej i zarządza jego prawami komercyjnymi. Pierwsze Mistrzostwa Świata odbyły się w Urugwaju w 1930 roku, a zwyciężyła w nich reprezentacja gospodarzy."
 vikelas_football_worldcup_tt: "Posiadaj co najmniej #G 16#! krajów ze Związkiem Piłki Nożnej."
 je_vikelas_sports: "Sporty"
 je_vikelas_sports_reason: "W XIX wieku zorganizowany sport nabrał nowego znaczenia. W wielu państwach narodowych powstawały kluby sportowe, boiska stawały się obiektami użyteczności publicznej, a uprawianie sportu stało się powszechną formą spędzania wolnego czasu. Piłka nożna i baseball rozwinęły się w sporty narodowe, a wyścigi kolarskie i samochodowe wkrótce stały się nieodłącznym elementem życia społeczeństwa masowego. Ukoronowaniem tego rozwoju było ustanowienie igrzysk olimpijskich jako wydarzenia międzynarodowego."
