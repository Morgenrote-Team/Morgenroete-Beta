 vikelas_bicycles_tech: "Rowery"
 vikelas_bicycles_tech_desc: "W połowie XIX wieku rower biegowy przekształcił się w welocyped, w którym po raz pierwszy zamontowano pedały bezpośrednio na przedniej osi. Pojazdy te, znane jako „trzęsikości”, miały ciężkie żelazne obręcze i drewniane szprychy, przez co jazda po nierównym podłożu stanowiła nie lada wysiłek fizyczny. Mimo braku wygody w tym okresie nastąpił pierwszy rozkwit popularności rowerów, który doprowadził do powstania coraz doskonalszych konstrukcji i utorował drogę późniejszemu rowerowi."