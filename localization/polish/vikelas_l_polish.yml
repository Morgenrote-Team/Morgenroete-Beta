 vikelas_would_replace_coach_loc: "#n Spowodowałoby to zastąpienie twojego#! #V Trenera#!, [ROOT.Var('vikelas_coach_var').GetCharacter.GetFullName]."
 vikelas_will_not_replace_coach_loc: "#p Nie masz#! #V Trenera#! #p jeszcze!#!"
 vikelas_coach_experience_gain_tt: "Twój [concept_vikelas_coach], [GetPlayer.MakeScope.Var('vikelas_coach_var').GetCharacter.GetFullName], zyskuje [SCOPE.GetValue('xp_amount')|0+] doświadczenia."
