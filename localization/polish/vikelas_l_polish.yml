 vikelas.21.h: "Ale kogo mogłaby zainteresować taka gra?"
 vikelas.31.t: "Od gry na łące do Narodowej Rozrywki Ameryki"
 vikelas.31.d: "W regionie [SCOPE.sState('vikelas_baseball_state').GetName] popularność zdobyła nowa gra, która uosabia amerykańskiego ducha."
 vikelas.31.f: "W latach 40. XIX wieku baseball zaczął wychodzić z cienia swoich poprzedników i nabierać odrębnego charakteru. Stany Zjednoczone przechodziły gwałtowną urbanizację, a rozwijające się miasta poszukiwały rozrywek, które jednoczyłyby mieszkańców i odzwierciedlały ducha młodego narodu. Przełom nastąpił w 1845 roku, gdy Alexander Cartwright i członkowie nowojorskiego Knickerbocker Base Ball Club opracowali pierwsze ujednolicone zasady gry. Te „zasady Knickerbocker” położyły podwaliny pod współczesny baseball: boisko w kształcie rombu z czterema bazami, trzy auty na zmianę i dziewięciu zawodników w drużynie. Znacznie różniły się od mniej sformalizowanych odmian rozgrywanych dotąd na trawnikach i polach. 19 czerwca 1846 roku klub Knickerbocker rozegrał w Hoboken w stanie New Jersey pierwszy udokumentowany mecz według tych zasad. Drużyna przegrała z New York Nine, lecz wydarzenie to uznano za symboliczne narodziny zorganizowanego baseballu."
 vikelas.31.g: "Homerun!"
 vikelas.41.t: "Początki nowoczesnej piłki nożnej"
 vikelas.41.d: "Aby uporządkować liczne sprzeczne zasady gier w piłkę i umożliwić wspólne rozgrywanie meczów, kluby z regionu [SCOPE.sState('vikelas_football_state').GetName] przedstawiły nowy zbiór zasad piłki nożnej."
 vikelas.41.f: "W pierwszej połowie XIX wieku piłka nożna w Anglii nie była jeszcze jednolitym sportem, lecz zbiorczym określeniem różnych gier w piłkę uprawianych w miastach, wsiach i szkołach. Ich zasady często znacznie się różniły. Pierwszym krokiem ku ujednoliceniu były zasady z Cambridge z 1848 roku, stanowiące próbę opracowania wspólnych reguł dla tamtejszych studentów. Nie były ostatecznym rozwiązaniem, lecz położyły podwaliny pod dalsze zmiany. Prawdziwy przełom nastąpił 26 października 1863 roku, gdy przedstawiciele jedenastu klubów spotkali się w londyńskiej Freemasons' Tavern i założyli angielski związek piłkarski Football Association (FA). W ciągu kilku tygodni uzgodnili zasady dopuszczające grę wyłącznie nogami i zabraniające noszenia lub rzucania piłki. Kompromis ten rozgniewał zwolenników rugby, którzy następnie odłączyli się i opracowali własne reguły. Wraz z powstaniem FA narodziła się nowoczesna piłka nożna."
 vikelas.41.g: "Gol!"
 vikelas.51.t: "Gra z Koszem po Brzoskwiniach"
 vikelas.51.d: "W sali gimnastycznej w regionie [SCOPE.sState('vikelas_basketball_state').GetName] wymyślono nową grę, która pewnego dnia może rozbrzmiewać w halach i na stadionach całego świata."
 vikelas.51.f: "„Bez kopania. Bez biegania z piłką. I dwa kosze po brzoskwiniach przybite do galerii”.\n\nW [TimeKeeper.GetCurrentDate.Format('y')] roku, w szkole w [SCOPE.sState('vikelas_basketball_state').GetFarmHubName], Dr. [ROOT.Var('panum_physician_var').GetCharacter.GetFullName] stanął przed problemem: jak zapewnić [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis] niespokojnym uczniom ruch w zamkniętym pomieszczeniu podczas zimy. [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis|U] rozwiązanie było proste i dziwne zarazem. Piłka do nogi, dwa wysoko zawieszone kosze po brzoskwiniach i trzynaście zasad.\nChłopcy początkowo uznali to za osobliwe. Bez kontaktu fizycznego. Bez kozłowania. Tylko ostrożne podania i rzuty po łuku. Ale coś w tej grze ich urzekło. Trafiła do innych szkół, a potem do innych miast. W niespełna dekadę sale gimnastyczne od Nowego Jorku po Tokio rozbrzmiewały rytmem odbijanych piłek i okrzykami „Kosz!”\nTo, co zaczęło się jako rozrywka na chłodne dni, może stać się czymś większym. Gra jest szybka, zespołowa, dostosowana do nowoczesnego życia, a przede wszystkim ma [ROOT.GetCountry.GetAdjectiveNoFormatting] rodowód."
 vikelas.51.g: "Wprowadźmy ją do szkół i sal gimnastycznych."
 vikelas.302.h: "Cóż za przereklamowana gra."
 vikelas.303.h: "Co za nudna gra."
 vikelas.311.g: "Już nigdy nie przegap żadnego wyniku sportowego!"
 vikelas.312.t: "Radio Sportowe"
 vikelas.312.d: "Producent odbiorników radiowych w regionie [SCOPE.sState('vikelas_radio_state').GetName] reklamuje swój produkt przede wszystkim jako urządzenie do słuchania transmisji sportowych. Mieszkańcy nie chcą przegapić ani jednego meczu w dyscyplinie [GetPlayer.MakeScope.Var('vikelas_national_sport_var').GetFlagName], co skłoniło fabrykę do optymalizacji produkcji."
 vikelas.312.f: "Radio idealnie nadawało się na nowe medium sportowe: mogło na żywo przekazywać dramaturgię meczu i ryk trybun, a głos komentatora stawał się dla słuchaczy bijącym sercem widowiska. W Stanach Zjednoczonych wszystko zaczęło się 5 sierpnia 1921 roku, gdy stacja KDKA z Pittsburgha przeprowadziła pierwszą transmisję meczu baseballowego na żywo: Pittsburgh Pirates przeciwko Philadelphia Phillies. Komentator Harold Arlin siedział w loży prasowej z prostym mikrofonem i opisywał każdą akcję tak, jakby relacjonował ją przyjacielowi. Słuchacze, oczarowani nowymi urządzeniami, czuli, jak sport wkracza do ich salonów. W Europie za tym przykładem poszła BBC: 11 stycznia 1927 roku nadała pierwszą transmisję meczu piłkarskiego na żywo, w którym Arsenal zmierzył się z Sheffield United, a komentował Teddy Wakelam."
 vikelas.312.g: "To tak, jakby być na miejscu!"
 vikelas.318.t: "Związek Sportowy: [GetPlayer.MakeScope.Var('vikelas_national_sport_var').GetFlagName]"
 vikelas.318.g: "Załóż Narodowy Związek Sportowy: [GetPlayer.MakeScope.Var('vikelas_national_sport_var').GetFlagName]!"
 vikelas.318.f: "Związek sportowy, czy to krykieta, baseballu, piłki nożnej, czy koszykówki, powstaje zawsze wtedy, gdy 35 procent wcielonych regionów kraju posiada klub danej dyscypliny. Związek stanowi podstawę organizacji rozgrywek ligowych i meczu finałowego o tytuł mistrzowski. Jest to jednak możliwe tylko wtedy, gdy w kraju istnieją co najmniej dwa kluby. Posiadanie związku piłkarskiego jest warunkiem udziału w Mistrzostwach Świata FIFA."
 vikelas.318.d: "[GetPlayer.MakeScope.Var('vikelas_national_sport_var').GetFlagName] cieszy się popularnością na całym obszarze [GetPlayer.GetNameNoFormatting]. Prężny rozwój klubów doprowadził do założenia narodowego związku sportowego w [ROOT.GetCountry.GetCapital.GetCityHubName]."
 vikelas.321.g: "Homerun!"
 vikelas.322.t: "Karty Baseballowe"
 vikelas.322.d: "Znana firma w naszym kraju zaczęła drukować karty baseballowe w celach reklamowych. Od tego czasu zapanowała prawdziwa gorączka kolekcjonerska."
 vikelas.322.f: "Historia kolekcjonerskich kart baseballowych zaczyna się w dekadach, w których sam baseball przekształcał się z regionalnej rozrywki w sport narodowy Stanów Zjednoczonych. Już w latach 60. XIX wieku, gdy National Association of Baseball Players (NABBP) zrzeszało pierwsze kluby, pojawiły się portrety zawodników w formie fotografii studyjnych. Te tak zwane fotografie gabinetowe lub karty reklamowe powstawały w zakładach fotograficznych i były zbierane przez zamożniejszych kibiców, lecz nie tworzyły jeszcze serii. Właściwe początki kart kolekcjonerskich we współczesnym rozumieniu sięgają lat 80. XIX wieku. Producenci tytoniu odkryli wówczas możliwość dołączania małych kartonowych obrazków do paczek papierosów. Początkowo karty te służyły jedynie usztywnianiu opakowań, ale firmy szybko dostrzegły ich wartość reklamową. Za pioniera tej epoki uchodzi nowojorska firma Goodwin & Company ze swoją serią Old Judge (1887-1890). Karty przedstawiały czarno-białe fotografie zawodników wydrukowane na cienkim kartonie i po raz pierwszy dawały kibicom baseballu możliwość zbierania całych serii z wizerunkami swoich idoli."
 vikelas.322.g: "Kiedy ukażą się albumy kolekcjonerskie?"
 vikelas.331.t: "Założono Konkurencyjny Klub Piłkarski"
 vikelas.331.d: "Po sporze z klubem piłkarskim z sąsiedniego regionu robotnicy w regionie [SCOPE.sState('vikelas_football_club_state_scope').GetName] zjednoczyli się i założyli własny klub, nadając mu nazwę [SCOPE.sState('vikelas_football_club_state_scope').GetCustom('vikelas_historical_football_club_names_type')]. Najwyraźniej oba kluby darzą się niechęcią."
 vikelas.331.f: "Sporo klubów sportowych powstało w wyniku rozłamów i sporów z innymi klubami. Inter Mediolan założyło na przykład kilku niezadowolonych członków Milan Cricket and Football Club (obecnie AC Milan) o kosmopolitycznych poglądach, którzy spotkali się w mediolańskiej restauracji Ristorante Orologio. „Football Club Internazionale Milano”, jak oficjalnie nazwano nowy klub, odłączył się od nacjonalistycznego Milan CFC, w którym mogli grać wyłącznie Włosi."
 vikelas.331.g: "Czyżby rodziła się rywalizacja?"
 vikelas.332.t: "Piłkarska Rywalizacja"
 vikelas.332.d: "Kluby piłkarskie [SCOPE.sState('vikelas_rival_state_1_scope').GetCustom('vikelas_historical_football_club_names_type')] z regionu [SCOPE.sState('vikelas_rival_state_1_scope').GetName] oraz [SCOPE.sState('vikelas_rival_state_2_scope').GetCustom('vikelas_historical_football_club_names_type')] z regionu [SCOPE.sState('vikelas_rival_state_2_scope').GetName] rozgrywają dziś mecz ligowy, który może przesądzić o tegorocznym mistrzostwie. Atmosfera może być napięta, ponieważ oba kluby uważają się za rywali i pragną zdobyć tytuł mistrzowski."
 vikelas.332.f: "Rozpocznijcie grę, wrzućcie z autu, powalczcie o piłkę,\nGrajcie dołem, wspaniały zryw, brawo, zwycięstwo albo śmierć;\nDo piłki, City!\nNie zważajcie na niebezpieczeństwo,\nSpokojnie, teraz wasza szansa,\nHurra! Strzeliliśmy gola.\n - Albert T. Smith"
 vikelas.332.g: "Kibicuję drużynie z regionu [SCOPE.sState('vikelas_rival_state_1_scope').GetName]!"
 vikelas.332.h: "Drużyna z regionu [SCOPE.sState('vikelas_rival_state_2_scope').GetName] jest lepsza!"
 vikelas.333.t: "Piłkarscy Chuligani"
 vikelas.333.d: "Mecz piłkarski o [GetPlayer.GetAdjective] Mistrzostwo przyćmiły zamieszki wywołane przez agresywnych kibiców. Niezadowoleni z wyniku zaatakowali przeciwną drużynę, sędziego i przypadkowe sklepy w regionie [ROOT.Var('vikelas_rival_state_var').GetState.GetName], siejąc spustoszenie. Na szczęście nikt nie zginął."
 vikelas.333.f: "„Gdzie jesteś, sędzio, ty tchórzu! To przez ciebie przegraliśmy! Tam jest! Brać go, Chłopaki!”"
 vikelas.333.g: "Co za Bałagan!"
 vikelas.334.t: "Narodził się Mistrz Piłki Nożnej!"
 vikelas.334.d: "Nowy [GetPlayer.GetAdjective] Mistrz został wyłoniony w zaciętym meczu, który wygrała drużyna z regionu [ROOT.Var('vikelas_rival_state_var').GetState.GetName]. Mieszkańcy regionu [ROOT.Var('vikelas_rival_state_var').GetState.GetNameNoFormatting] świętują zwycięstwo swojego zespołu."
 vikelas.334.f: "\"Ole! Ole! Ole! Oleeee! Oleeee! Oleeee!\""
 vikelas.334.g: "Jesteśmy Mistrzami!"
 vikelas.391.t: "Dostosuj Sport Narodowy"
 vikelas.391.d: "Którą dyscyplinę ustanowić sportem narodowym w [GetPlayer.GetNameNoFormatting]?"
 vikelas.391.f: "„Czy słyszeliście kiedyś o tym uroczym sporcie zwanym Hornussen?”"
 vikelas.391.g: "Krykiet"
 vikelas.391.h: "Baseball"
 vikelas.391.i: "Piłka Nożna"
 vikelas.391.j: "Koszykówka"
 vikelas.391.k: "Nieważne"
 vikelas.392.t: "Zmień Sport Narodowy"
 vikelas.392.d: "Którą dyscyplinę wybrać na nowy sport narodowy w [GetPlayer.GetNameNoFormatting]?"
 vikelas.392.f: "„[ROOT.GetCountry.MakeScope.Var('vikelas_national_sport_var').GetFlagName] robi się strasznie nudny. Może zamiast tego potoczymy ser?”"
 vikelas.393.t: "Nowy Sport Narodowy"
 vikelas.393.d: "Wysłannicy z [SCOPE.sCountry('vikelas_overlord_country_scope').GetName] zasugerowali naszemu rządowi wprowadzenie ich sportu narodowego w naszym kraju i przysłali trenera, który ma zrealizować ten plan."
 vikelas.393.f: "„Gra jest formą odpoczynku, a ponieważ nie można pracować bez przerwy, odpoczynek jest niezbędny”. -Arystoteles"
 vikelas.393.g: "Podaj mi kij!"
 vikelas.393.h: "Homerun!"
 vikelas.393.i: "Gol!"
 vikelas.393.j: "Splash!"
 vikelas.394.t: "Wspólny Sport"
 vikelas.394.d: "Coraz więcej mieszkańców naszego kraju postrzega dyscyplinę [ROOT.GetCountry.MakeScope.Var('vikelas_national_sport_var').GetFlagName] jako jednoczący element ideologiczny, również w stosunkach międzynarodowych. Wspólny sport narodowy daje im poczucie, że [GetPlayer.GetNameNoFormatting] i nasz zwierzchnik [SCOPE.sCountry('vikelas_overlord_country_scope').GetName] mają ze sobą więcej wspólnego niż tylko zależność polityczną."
 vikelas.394.f: "Jeśli państwo zwierzchnie i państwo podległe mają wspólny sport narodowy, dążenie do wolności ulega zmniejszeniu."
 vikelas.394.g: "Wspólne sporty, wspólne zainteresowania."
 vikelas.395.t: "Mistrzostwa Wspólnoty Narodów w [GetPlayer.MakeScope.Var('vikelas_national_sport_var').GetFlagName]"
 vikelas.395.d: "Widzowie i drużyny ze wszystkich państw sojuszniczych i zaprzyjaźnionych zgromadzili się, aby uczestniczyć w Mistrzostwach Wspólnoty Narodów w [GetPlayer.MakeScope.Var('vikelas_national_sport_var').GetFlagName]. Zawody te są również dowodem na to, że [ROOT.GetCountry.GetAdjectiveNoFormatting] strefa wpływów jednoczy się nie tylko pod względem politycznym, lecz także kulturowym."
 vikelas.395.f: "Od końca XIX wieku rozgrywano serie meczów testowych pomiędzy Anglią a innymi częściami Imperium, które miały charakter zbliżony do turniejów. Utworzenie ICC (Imperialnej Konferencji Krykieta) w 1909 roku położyło podwaliny pod formalną rywalizację między krykietowymi potęgami Imperium. Początkowymi członkami były Anglia, Australia i Republika Południowej Afryki, do których później dołączyły Indie, Nowa Zelandia i Indie Zachodnie.\n\nBritish Home Championship był corocznym turniejem piłkarskim rozgrywanym pomiędzy czterema reprezentacjami brytyjskimi: Anglią, Szkocją, Walią i Irlandią Północną. Były to najstarsze regularnie rozgrywane międzynarodowe zawody piłkarskie. Uważano je za symbol brytyjskiej dominacji w futbolu.\n\nIdea zorganizowania kompleksowego Pucharu Imperium nigdy nie została w pełni urzeczywistniona, choć podejmowano pojedyncze próby i organizowano serie rozgrywek, które zbliżały się do realizacji tego zamysłu."
 vikelas.395.g: "Niech rozpoczną się igrzyska!"
 vikelas.396.t: "Mistrzostwa Wspólnoty Narodów w [GetPlayer.MakeScope.Var('vikelas_national_sport_var').GetFlagName] – Zwycięstwo!"
 vikelas.396.d: "Pokonaliśmy rywali z [SCOPE.sCountry('vikelas_second_winner_team_scope').GetName] w decydującym meczu! Wygraliśmy Mistrzostwa Wspólnoty Narodów w [GetPlayer.MakeScope.Var('vikelas_national_sport_var').GetFlagName]."
 vikelas.396.f: "Podanie [SCOPE.sCharacter('vikelas_schaefer_scope').GetFullNameNoFormatting] do [SCOPE.sCharacter('vikelas_morlock_scope').GetFullNameNoFormatting] zostaje przechwycone przez [SCOPE.sCountry('vikelas_second_winner_team_scope').GetNameNoFormatting] – a [SCOPE.sCharacter('vikelas_bozsik_scope').GetFullNameNoFormatting], jak zawsze [SCOPE.sCharacter('vikelas_bozsik_scope').GetFullNameNoFormatting], prawoskrzydłowy reprezentacji [SCOPE.sCountry('vikelas_second_winner_team_scope').GetAdjectiveNoFormatting], jest przy piłce. Ma piłkę – tym razem ją traci na rzecz [SCOPE.sCharacter('vikelas_schaefer_scope').GetFullNameNoFormatting]. [SCOPE.sCharacter('vikelas_schaefer_scope').GetFullNameNoFormatting] dośrodkowuje w pole karne. Strzał głową – zablokowany. [SCOPE.sCharacter('vikelas_rahn_scope').GetFullNameNoFormatting] powinien strzelać z głębi pola – [SCOPE.sCharacter('vikelas_rahn_scope').GetFullNameNoFormatting] strzela – Gooooool! Gooooool! Gooooool! Gooool!"
 vikelas.396.g: "Trofeum Wspólnoty Narodów trafia do [GetPlayer.GetNameNoFormatting]!"
 vikelas.397.t: "Mistrzostwa Wspólnoty Narodów w [GetPlayer.MakeScope.Var('vikelas_national_sport_var').GetFlagName] dobiegają końca"
 vikelas.397.d: "Mistrzostwa Wspólnoty Narodów w dyscyplinie [GetPlayer.MakeScope.Var('vikelas_national_sport_var').GetFlagName] dobiegły końca. [SCOPE.sCountry('vikelas_first_winner_team_scope').GetName] pokonał [SCOPE.sCountry('vikelas_second_winner_team_scope').GetName] w finale. Drużyny i kibice z państw sojuszniczych i zaprzyjaźnionych ponownie rozjechali się do domów. [GetPlayer.GetNameNoFormatting] pozostanie w ich miłych wspomnieniach jako gospodarz i organizator."
 vikelas.397.f: "„Być może nie jesteśmy pozbawionymi praw poddanymi, mięsem armatnim ani jedynie zbiorem państw podporządkowanych interesom zwierzchnika, lecz... rodziną”."
 vikelas.397.g: "Przyczyniło się to do wzajemnego zrozumienia między narodami."
 vikelas.403.d: "FIFA powołała dziś nowych członków zarządu podczas posiedzenia w [SCOPE.sState('vikelas_fifa_state').GetStateRegion.GetCityHubName]."
