 je_vikelas_endurance_race_reason: "W kilku stanach naszego kraju odbywa się obecnie wyścig długodystansowy. Biorą w nim udział kierowcy wyścigowi ze wszystkich krajów, w których popularne są wyścigi samochodowe. Kraj gospodarza ma niewielką przewagę i otrzymuje dodatkowe wydarzenia. W przeciwieństwie do wyścigów Grand Prix niezawodność jest tutaj ważniejsza od prędkości, ponieważ samochody muszą pokonać długi dystans. Ryzyko awarii silnika jest również większe niż ryzyko śmiertelnego wypadku."
