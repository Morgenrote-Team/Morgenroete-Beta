 je_vikelas_bicycle_race: "[SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_custom_bicycle_race')]"
 je_vikelas_bicycle_race_reason: "Przedsiębiorcy, wydawcy i producenci rowerów proponują zorganizowanie otwartych zawodów: wyścigu długodystansowego, który dowiedzie szybkości, wytrzymałości i potencjału nowego roweru bezpiecznego."
 je_vikelas_basketball: "Koszykówka"
 je_vikelas_basketball_reason: "Szybka, zespołowa i stworzona dla nowoczesnego miasta. To może być gra stulecia."
 vikelas.21.t: "Gra Dżentelmenów"
 vikelas.21.d: "W regionie [SCOPE.sState('vikelas_cricket_state').GetName] po raz pierwszy zebrała się grupa graczy w krykieta, aby wspólnie rozgrywać mecze według ustalonych zasad. Klub odgrywa tym samym pionierską rolę w rozwoju tego sportu."
 vikelas.21.f: "W XIX wieku krykiet przekształcił się z wiejskiej rozrywki w sport o znaczeniu krajowym i międzynarodowym. Angielskie wyższe sfery uczyniły go swoim ulubionym zajęciem: grę uprawiano w szkołach z internatem, takich jak Eton i Harrow, i wychwalano jako „sport dżentelmenów”. Jednocześnie rosła jej popularność wśród klasy robotniczej, zwłaszcza w północnej Anglii, gdzie robotnicy fabryczni zakładali własne kluby. Ta demokratyzacja gry doprowadziła do bezprecedensowego wzrostu liczby klubów i widzów.\n\nNa mecze międzypaństwowe nie trzeba było długo czekać. W 1844 roku w Nowym Jorku rozegrano pierwszy udokumentowany mecz międzypaństwowy na świecie, w którym zmierzyły się Kanada i Stany Zjednoczone."
 vikelas.21.g: "Podaj mi kij!"
 vikelas.601.t: "Pedały na Bruku"
 vikelas.601.d: "Na bulwarach pojawił się nowy wynalazek: dwukołowa machina napędzana pedałami przymocowanymi bezpośrednio do przedniego koła. Nazywają ją „welocypedem”."
 vikelas.601.f: "W parkach i na szerokich ulicach stolicy przechodnie odwracają głowy. Dżentelmeni w kapeluszach i kamizelkach siedzą na dziwnych żelaznych ramach, pedałując zawzięcie i chwiejąc się wśród zaskoczonych tłumów. Jedni upadają. Inni mkną. Dzieci się śmieją. Sędziwi mężowie stanu unoszą brwi. Gazety nazywają to le vélocipède, po części zabawką, po części obietnicą przyszłości. Wynaleziona przez wytwórcę powozów „trzęsikość” jest równie ciężka, co rewolucyjna. Na bruku wstrząsa kręgosłupem. Lecz po gładkich promenadach porusza się z zaskakującą gracją. Słychać głosy, że to nie zwykła nowinka, lecz zalążek nowego sposobu przemieszczania się."
 vikelas.601.g: "Zabawna Moda!"
 vikelas.602.t: "Rower Przyszłości"
 vikelas.602.d: "Pojawiła się nowa konstrukcja roweru z kołami jednakowej wielkości, tylną osią napędzaną łańcuchem i lepszą równowagą. W przeciwieństwie do niebezpiecznych bicykli ten „rower bezpieczny” jest stabilny, przystępny cenowo i szybko staje się sensacją. Jego wynalazca? [SCOPE.sCharacter('vikelas_bicycle_inventor_scope').GetFullName]!"
 vikelas.602.f: "Dawne welocypedy trzęsły zarówno kośćmi, jak i nerwami. Wysokie bicykle zapewniały szybkość, lecz za cenę, którą niewielu chciało zapłacić: jeden fałszywy ruch i rowerzysta wylatywał z siodełka. Teraz z warsztatów naszej stolicy trafia na ulice nowy rodzaj roweru: niewielki, elegancki i bezpieczny. Dzięki napędowi łańcuchowemu na tylne koło i pneumatycznym oponom jeździć zaczynają nawet damy i robotnicy. Ulice, na których niegdyś królowały powozy, rozbrzmiewają teraz cichym szumem gumy na kamieniu. Zarówno w kawiarniach, jak i w fabrykach słychać ten sam werdykt: to nie zabawka. To wolność, szybka, cicha i nagle na wyciągnięcie ręki."
 vikelas.602.g: "Niech każdy obywatel wjedzie w nowoczesną epokę."
 vikelas.611.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_custom_bicycle_race')]"
 vikelas.611.d: "Nadszedł ten dzień. Kolarze z całego kraju gromadzą się na linii startu, gotowi wystawić na próbę siebie i swoje maszyny na otwartej drodze. W powietrzu czuć napięcie i wyczekiwanie."
 vikelas.611.f: "Słońce wschodzi nad bulwarem, już zatłoczonym przez widzów. Powiewają sztandary. W porannym powietrzu unosi się zapach smaru i kurzu. Dziesiątki kolarzy dosiadają rowerów. Jedne to lśniące maszyny prosto z fabryki, inne poskładano w warsztatach ukrytych w bocznych zaułkach.\nRozlega się strzał. Wybuchają wiwaty. Koła zaczynają się obracać.\nKolarze przejeżdżają przez bramy miasta i ruszają na wieś. Rolnicy przerywają pracę na polach. Dzieci biegną wzdłuż drogi. Księża ich błogosławią. Cynicy szydzą. A jednak, gdy za kolarzami ciągną się tumany kurzu, wśród tłumu rodzi się osobliwe przeczucie: to chyba początek czegoś większego."
 vikelas.611.g: "Niech każde miasto usłyszy szum postępu."
 vikelas.621.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_custom_bicycle_race')]"
 vikelas.621.d: "Zwycięzca krajowego wyścigu kolarskiego nie tylko jako pierwszy przekroczył linię mety, lecz także zawładnął wyobraźnią narodu. Teraz wszyscy zwracają uwagę na to, co sobą reprezentuje."
 vikelas.621.f: "Gazety nazywają go „Żelaznym Jeźdźcem”. Urodzony w rodzinie tkacza, osierocony w wieku dwunastu lat, już jako szesnastolatek pracował w fabryce. Jego zwycięstwo na sfatygowanym rowerze bezpiecznym, połatanym, porysowanym i troskliwie naoliwionym, nie było jedynie sportowym triumfem. Stało się przypowieścią. Tłumy skandują jego imię. Malarze go szkicują. Dzieci naśladują jego postawę. Co więcej, dostrzegają go ideolodzy. Jedni widzą w nim uosobienie siły robotników. Inni twierdzą, że dowodzi żywotności narodu. Prasa spiera się, czy jest robotnikiem, patriotą, czy może kimś zupełnie nowym.\nSam kolarz mówi niewiele. Uśmiecha się, kiwa głową i jedzie dalej."
 vikelas.621.g: "Uczyńmy go bohaterem klasy robotniczej."
 vikelas.621.h: "Uhonorujmy go jako ikonę narodową."
 vikelas.621.i: "Przedstawmy go jako symbol postępu i nowoczesnego człowieka."
 vikelas.622.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_custom_bicycle_race')]"
 vikelas.622.d: "Podczas krajowego wyścigu kolarskiego doszło do tragicznego wypadku. Jeden kolarz nie żyje, a kilku innych zostało rannych. Wiwaty ucichły."
 vikelas.622.f: "Koło wpadło w koleinę. Okrzyk, zderzenie, a potem wrzaski. Widzowie rzucili się naprzód, gdy rowery przewracały się niczym kostki domina. Krew mieszała się z kurzem. Pękały kaski. Łamały się kości. Jeden z młodych zawodników, siedemnastoletni praktykant z fabryki, zginął na miejscu. Gazety są podzielone. Jedne nazywają to nieuniknioną ceną postępu, inne potępiają lekkomyślność organizowania publicznych zawodów sportowych."
 vikelas.622.g: "Uczcijmy pamięć poległych."
 vikelas.623.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_custom_bicycle_race')]"
 vikelas.623.d: "Jeden z etapów wyścigu podbił serca publiczności. Widzowie mówią o nim już nie tylko jak o rywalizacji, lecz jak o legendzie."
 vikelas.623.f: "O świcie kolarze zniknęli wśród wzgórz. To, co nastąpiło później, nie było już wyścigiem, lecz próbą ducha. Tuzin zawodników został w tyle. Trzech padło z wyczerpania. Jeden rozbił się na ostrym zakręcie i podniósł się zakrwawiony, odrzucając pomoc. Inny jednak wyrwał naprzód przez mgłę, zdobywając serca tysięcy. Cały naród nie mówi o niczym innym."
 vikelas.623.g: "Niech droga przez pokolenia pamięta jego wysiłek."
 vikelas.623.h: "Zlećmy namalowanie obrazu uwieczniającego tę chwilę."
 vikelas.624.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_custom_bicycle_race')]"
 vikelas.624.d: "Po ostatnim etapie wyścigu posypały się oskarżenia. Jednego z kolarzy przyłapano na oszustwie, choć niektórzy twierdzą, że robił jedynie to, co wszyscy, tylko mniej dyskretnie."
 vikelas.624.f: "„Mówili, że zmienił rower za stodołą. Inni twierdzą, że wciągnięto go pod górę za pomocą ukrytej linki”.\n\nFakty są niejasne. Jedno jest pewne: kolarz był zbyt szybki. Niewiarygodnie szybki. Zbyt wypoczęty po morderczym podjeździe. Rywale kipią ze złości. Widzowie nie mogą wyjść ze zdumienia. Prasa węszy krew. Na jednym ze zdjęć widać drugiego mężczyznę w takim samym stroju. Inny świadek twierdzi, że podczas nocnego etapu widział, jak samochód popychał kolarza. Oskarżony wszystkiemu zaprzecza, twierdząc, że stoją za tym zawiść i polityka."
 vikelas.624.g: "Zdyskwalifikujmy kolarza i ujawnijmy oszustwo."
 vikelas.624.h: "Zatuszujmy to dla dobra sportu."
 vikelas.625.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_custom_bicycle_race')]"
 vikelas.625.d: "Tegoroczny sezon wyścigowy zdominowała zaciekła rywalizacja. Dwaj kolarze, równie silni, lecz o zupełnie odmiennych stylach, podzielili naród na dwa obozy."
 vikelas.625.f: "Jeden jest ogniem: brawurowy, śmiały, uwielbiany przez młodych. Rzuca czapkę w tłum, śmieje się podczas pedałowania i atakuje bez ostrzeżenia.\nDrugi jest lodem: spokojny, wyrachowany, niemal matematycznie precyzyjny. Oszczędza siły, wygrywa o sekundy i odzywa się tylko wtedy, gdy musi.\n\nIch nazwiska wykrzykiwane są z dachów. Miasta opowiadają się po jednej ze stron. Drukuje się czerwone lub niebieskie plakaty. Krawcy sprzedają czapki w ich barwach. Dzieci na drewnianych rowerach naśladują ich postawy.\nGazety piszą o czymś więcej niż wyścig. Piszą o charakterze, o filozofii, o tym, kim ludzie chcą być. A żaden z kolarzy nie ustępuje ani na krok."
 vikelas.625.g: "To sprzyja rozwojowi kultury prasowej."
 vikelas.625.h: "Wykorzystajmy tę rywalizację do celów politycznych."
 vikelas.626.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('vikelas_custom_bicycle_race')]"
 vikelas.626.d: "Tegoroczny sezon wyścigowy zdominowała zaciekła rywalizacja. Dwaj kolarze, równie silni, lecz o zupełnie odmiennych stylach, podzielili naród na dwa obozy."
 vikelas.626.f: "„Znaleźli go w wiejskiej kuźni, z młotem w dłoni i twarzą poczerniałą od sadzy. Był sam”.\n\nZjazd był zdradliwy. Źle oceniony zakręt, chrzęst żwiru i przedni widelec pękł. Rower złożył się niczym ranny ptak. Większość by się zatrzymała. Ale nie on.\nKuśtykał w dół, ciągnąc ramę przez wiele kilometrów. W odległej wiosce znalazł kuźnię. Żadnych mechaników. Żadnego samochodu ekipy. Tylko miech, kowadło i jego własne ręce.\nPracował godzinami, z podwiniętymi rękawami i zaciśniętą szczęką, odtwarzając przedni widelec z pamięci i na wyczucie. Gdy przybyli sędziowie, przerwał tylko na chwilę, by spojrzeć na nich gniewnie i powiedzieć: „Nie dotykajcie tego”.\nZ ośmiogodzinną stratą do liderów znów ruszył w drogę. Bez szans na zwycięstwo. Lecz na całej trasie tłumy wstawały, by wiwatować. Nie na cześć zwycięzcy, lecz tego, który nie chciał się poddać."
 vikelas.626.g: "Inspirująca historia."
 vikelas.626.h: "Zezwólmy na naprawy awaryjne."
 vikelas.626.i: "Uhonorujmy go!"
 vikelas.401.t: "Międzynarodowa Federacja Piłki Nożnej"
 vikelas.401.d: "Dziś w [GetGlobalVariable('vikelas_fifa_seat_global_var').GetStateRegion.GetCityHubName] założono Międzynarodową Federację Piłki Nożnej. Jej pełna nazwa to Fédération Internationale de Football Association (FIFA)."
 vikelas.401.f: "21 maja 1904 roku delegaci siedmiu państw, Belgii, Danii, Francji, Holandii, Hiszpanii, Szwecji i Szwajcarii, podpisali statut. Cel: ujednolicić zasady piłki nożnej, organizować mecze międzypaństwowe i nadać grze światowy zasięg. Tak narodziła się Fédération Internationale de Football Association, czyli FIFA. W pierwszych dekadach była skromną organizacją: prezes pełnił funkcję dorywczo, zawodnicy byli amatorami, a działalność zakłócały regionalne spory. Jednak pod powierzchnią rozwijał się światowy ruch. Anglia wahała się przed przystąpieniem, obawiając się zagranicznej ingerencji. Kraje Ameryki Południowej zaczęły tworzyć własne konfederacje. W 1924 i 1928 roku turnieje olimpijskie ukazały prawdziwy zasięg piłki nożnej: tłumy liczące 60,000 osób w Paryżu wiwatowały na cześć drużyn, a nie armii."
 vikelas.401.g: "Dołączmy do FIFA i wesprzyjmy międzynarodową rywalizację."
 vikelas.411.t: "Mistrzostwa Świata w Piłce Nożnej [TimeKeeper.GetCurrentDate.Format('y')]"
 vikelas.411.d: "FIFA zdecydowała, że tegoroczne Mistrzostwa Świata odbędą się w [SCOPE.sCountry('vikelas_fifa_host_scope').GetName]. Po rundzie wstępnej grono faworytów zawęziło się do ośmiu drużyn."
 vikelas.411.f: "#V Następujące reprezentacje narodowe zakwalifikowały się do ćwierćfinałów#!\n\n[SCOPE.sCountry('vikelas_first_qualified_team_scope').GetName]\n[SCOPE.sCountry('vikelas_second_qualified_team_scope').GetName]\n[SCOPE.sCountry('vikelas_third_qualified_team_scope').GetName]\n[SCOPE.sCountry('vikelas_fourth_qualified_team_scope').GetName]\n[SCOPE.sCountry('vikelas_fifth_qualified_team_scope').GetName]\n[SCOPE.sCountry('vikelas_sixth_qualified_team_scope').GetName]\n[SCOPE.sCountry('vikelas_seventh_qualified_team_scope').GetName]\n[SCOPE.sCountry('vikelas_eighth_qualified_team_scope').GetName]"
 vikelas.411.g: "Niech zwycięży najlepsza drużyna."
 vikelas.412.t: "Mistrzowie Świata"
 vikelas.412.d: "Nasza drużyna zatriumfowała na światowej arenie, pokonując najlepsze zespoły ze wszystkich kontynentów. W całym kraju wybucha radość!"
 vikelas.412.f: "W zaciętym meczu przeciwko [SCOPE.sCountry('vikelas_second_winner_team_scope').GetName] nasza drużyna dowiodła swojej wartości w finale Mistrzostw Świata w [SCOPE.sCountry('vikelas_fifa_host_scope').GetName]. Nasza reprezentacja wzniosła złoty puchar. Końcowy gwizdek rozbrzmiał w odbiornikach radiowych, kawiarniach i koszarach. Od górników na północy po kupców w porcie wszyscy wiwatowali jednym głosem. Kapitan płacze na podium. Nowe pokolenie patrzy i marzy."
 vikelas.412.g: "Jesteśmy mistrzami."
 vikelas.413.t: "Srebrna Chwała w [SCOPE.sCountry('vikelas_fifa_host_scope').GetName]"
 vikelas.413.d: "Nasza reprezentacja piłkarska dotarła do finału, lecz do pełni chwały zabrakło jej tak niewiele. W całym kraju duma miesza się z rozgoryczeniem w równych proporcjach."
 vikelas.413.f: "Niestety, nawet najlepsza gra naszej drużyny nie wystarczyła. W pełnym napięcia meczu przeciwko [SCOPE.sCountry('vikelas_first_winner_team_scope').GetName] nasi zawodnicy musieli uznać wyższość rywali. Przez tygodnie nieśli nadzieje całego narodu. Na błotnistych boiskach i w oślepiającym skwarze biegli, walczyli, wierzyli. Z meczu na mecz stawali się legendami. Gdy rozbrzmiewał hymn przeciwników, trzymali głowy wysoko. Nie było łez, tylko cisza, a potem powoli narastające oklaski."
 vikelas.413.g: "Okradziono nas ze zwycięstwa!"
 vikelas.414.t: "Marzenie kończy się przedwcześnie"
 vikelas.414.d: "Nasza reprezentacja odpadła już na wczesnym etapie Mistrzostw Świata FIFA w [SCOPE.sCountry('vikelas_fifa_host_scope').GetName]. W finale [SCOPE.sCountry('vikelas_first_winner_team_scope').GetName] pokonuje [SCOPE.sCountry('vikelas_second_winner_team_scope').GetName]."
 vikelas.414.f: "Była nadzieja, prawdziwa i namacalna. Zwycięstwa świętowane na fabrycznych dziedzińcach, radiowe relacje przekazywane szeptem w kościołach, dzieci odtwarzające gole w zaułkach. Drużyna symbolizowała coś więcej niż piłkę nożną: ambicję, dumę i wiarę, że możemy przekroczyć własne możliwości. Lecz ostatni mecz zmienił wszystko. Jeden stracony gol. Niezauważone zagranie ręką. Zmarnowana okazja. Teraz marzenie dobiegło końca, a świat toczy się dalej."
 vikelas.414.g: "Wierzyliśmy. To wystarczyło."
