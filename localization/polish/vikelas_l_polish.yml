 je_vikelas_baseball: "Baseball"
 je_vikelas_baseball_reason: "Baseball stał się sportem narodowym Stanów Zjednoczonych w XIX wieku i stamtąd zaczął zdobywać popularność na całym świecie. Pierwszy udokumentowany mecz rozegrano w 1846 roku w Hoboken w stanie New Jersey. W latach 60. XIX wieku nastąpiła szybka profesjonalizacja tego sportu, a w 1876 roku powstała National League, pierwsza duża liga zawodowa. Jednocześnie baseball rozprzestrzeniał się w innych krajach za sprawą amerykańskich żołnierzy, kupców i misjonarzy."
 je_vikelas_baseball_fail: "Dowolny kraj wynajduje baseball przed [GetPlayer.GetName]"
 je_vikelas_football: "Piłka Nożna"
 je_vikelas_football_reason: "Pierwsze jednolite zasady gry w piłkę nożną opracowano w Anglii w latach 40. XIX wieku, w 1863 roku założono angielski związek piłkarski, a w 1872 roku rozegrano pierwszy oficjalny mecz międzypaństwowy między Anglią a Szkocją. Z Wielkiej Brytanii piłka nożna rozprzestrzeniła się na kontynent europejski i do Ameryki Południowej. Od lat 90. XIX wieku w Niemczech, Francji, Włoszech i Hiszpanii zaczęły powstawać krajowe związki piłkarskie i ligi. Jednocześnie piłka nożna zyskiwała popularność w Argentynie, Brazylii i Urugwaju, gdzie brytyjscy kolejarze i emigranci zakładali pierwsze kluby."
 je_vikelas_football_fail: "Dowolny kraj wynajduje piłkę nożną przed [GetPlayer.GetName]"
 je_vikelas_cricket: "Krykiet"
 je_vikelas_cricket_reason: "Początki krykieta sięgają późnego średniowiecza: już w XVI wieku dzieci w hrabstwie Kent grały w prostą grę z użyciem kija i piłki, określaną w dawnych dokumentach jako „creckett” lub „creag”. Dopiero jednak w XVIII wieku zaczęła ona przybierać formę złożonej gry o ustalonych zasadach. W tym okresie powstały pierwsze zorganizowane kluby, a założony w Londynie w 1787 roku Marylebone Cricket Club (MCC) stał się głównym ośrodkiem rozwoju krykieta. MCC ustanowił pierwsze powszechnie obowiązujące zasady, które dały początek współczesnej formie tej gry."
 je_vikelas_cricket_fail: "Dowolny kraj wynajduje krykiet przed [GetPlayer.GetName]"
 je_vikelas_cricket_national_league: "Narodowa Liga Krykieta"
 je_vikelas_cricket_national_league_reason: "W XIX wieku krykiet, od dawna będący w Anglii rozrywką zarówno arystokratów, jak i zwykłych ludzi, zaczął przybierać bardziej zorganizowaną formę. Przełom nastąpił w 1890 roku wraz z utworzeniem County Championship, pierwszej oficjalnej krajowej ligi krykieta na świecie. Wcześniej mecze między reprezentacjami hrabstw rozgrywano już od XVIII wieku, lecz bez formalnego systemu punktacji i tabeli ligowej. County Championship wprowadziło jednolite zasady rywalizacji do angielskiego krykieta, a w pierwszych latach rozgrywek dominowały zespoły Yorkshire, Surrey i Lancashire. Kluby krykietowe poza Anglią, zwłaszcza w Australii i Afryce Południowej, również zaczęły organizować regularne rozgrywki."
 je_vikelas_baseball_national_league: "Narodowa Liga Baseballu"
 je_vikelas_baseball_national_league_reason: "W latach 60. XIX wieku baseball, wcześniej popularny głównie w Nowym Jorku, stał się fenomenem na skalę całych Stanów Zjednoczonych. Decydującą rolę odegrali żołnierze, którzy podczas wojny secesyjnej grali w obozach wojskowych, przyczyniając się do upowszechnienia tego sportu. W 1857 roku powstała pierwsza amerykańska organizacja baseballowa, National Association of Base Ball Players (NABBP). Do 1867 roku dołączyło do niej ponad 400 klubów. Najsilniejsze zespoły nadal jednak pochodziły z północno-wschodniej części Stanów Zjednoczonych, zwłaszcza z Nowego Jorku. Założona w 1871 roku organizacja będąca następczynią NABBP, National Association of Professional Base Ball Players (NAPBBP) — znana również jako National Association (NA) — jest uznawana za pierwszą zawodową ligę baseballową na świecie."
 je_vikelas_football_national_league: "Narodowa Liga Piłki Nożnej"
 je_vikelas_football_national_league_reason: "Pod koniec XIX wieku piłka nożna, wcześniej będąca luźno zorganizowaną rozrywką w angielskich szkołach prywatnych i lokalnych społecznościach, stała się fenomenem na skalę całego kraju. Decydującą rolę odegrało założenie w 1863 roku angielskiego związku piłkarskiego The Football Association (FA), który ujednolicił zasady gry i umożliwił organizację rozgrywek. Do lat 70. XIX wieku popularność tego sportu gwałtownie wzrosła, zwłaszcza wśród społeczności robotniczych miast przemysłowych. W 1888 roku w Anglii powstała Football League, pierwsza zawodowa liga piłkarska na świecie. Zrzeszała 12 klubów z regionu Midlands i północnej Anglii, a wśród czołowych zespołów jej pierwszych lat były Preston North End i Aston Villa."
 je_vikelas_basketball_national_league: "Narodowa Liga Koszykówki"
 je_vikelas_basketball_national_league_reason: "Na początku XX wieku koszykówka, wymyślona w 1891 roku przez Jamesa Naismitha, przekształciła się z formy ćwiczeń w organizacji YMCA w sport oparty na rywalizacji. Kluczowym wydarzeniem było założenie w 1898 roku w Stanach Zjednoczonych National Basketball League (NBL), uznawanej za pierwszą zawodową ligę koszykówki na świecie. Liga skupiała sześć zespołów z Pensylwanii i New Jersey i zapoczątkowała profesjonalizację koszykówki. Pierwotna NBL istniała jednak krótko i została rozwiązana w 1904 roku. Dopiero utworzenie w 1946 roku Basketball Association of America (BAA), która później w wyniku połączenia weszła w skład NBA, zapewniło zawodowej koszykówce trwałe podstawy organizacyjne i ogólnokrajowy zasięg."
