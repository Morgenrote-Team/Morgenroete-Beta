l_polish:
 MFE_workplace_events.1.t:0 "Wypadek Górniczy"
 MFE_workplace_events.1.d:0 "W kopalni w [SCOPE.sState('mine_state').GetName] doszło do strasznego wypadku. Dwie osoby zginęły po eksplozji w kopalni w [SCOPE.sState('mine_state').GetName]. Drobne wypadki, takie jak ten, zdarzają się cały czas, ale ten był... inny. Wszyscy miejscowi pracownicy odmawiają kontynuowania pracy, dopóki warunki się nie poprawią."
 MFE_workplace_events.1.f:0 "Widziałem to na własne oczy, obaj zostali rozerwani na strzępy i zmiażdżeni w najbardziej bolesny sposób, jaki człowiek może sobie wyobrazić. Nie przepracujemy już ani jednego dnia w tych kopalniach, to po prostu nie jest bezpieczne."
 MFE_workplace_events.1.a:0 "To naprawdę wstyd, sprowadźcie ich natychmiast z powrotem do pracy"
 MFE_workplace_events.1.b:0 "Ludzie pracujący w kopalniach są takimi samymi ludźmi jak my wszyscy!"
 MFE_workplace_events.1.c:0 "Nigdy nie powinniśmy byli w ogóle zaczynać wydobycia"
 MFE_workplace_events.2.t:0 "Dziewczyna z szybów węglowych"
 MFE_workplace_events.2.d:0 "Wózek pełen węgla musiał mocno ciążyć na jej ciele, kruchym i wyniszczonym przez wiele lat ciężkiej pracy w kopalni, gdyż jej stopy nie były już w stanie jej unieść. Tam, w ciemności, gdzie szyby sięgają niezliczonych sążni w głąb ziemi, poślizgnęła się i upadła.\n\nKolejna młoda dziewczyna straciła życie w wypadku górniczym w jednej z naszych prowincji, a szczególnie tragiczne okoliczności tej sprawy zwróciły uwagę całego kraju."
 MFE_workplace_events.2.f:0 "Jak mogą po prostu pozwalać nam dalej tak żyć, jakbyśmy nawet nie byli ludźmi."
 MFE_workplace_events.2.a:0 "Była tylko dziewczynką... kim się staliśmy"
 MFE_workplace_events.2.tt:0 "Ludzie z [SCOPE.sState('mining_state').GetName] knują coś niegodziwego..."
 MFE_workplace_events.3.t:0 "Niedobory produkcji"
 MFE_workplace_events.3.d:0 "Jedna z naszych fabryk amunicji doświadczyła w ciągu ostatnich trzech miesięcy poważnego spadku produkcji, który nie został zgłoszony z obawy przed wywołaniem niepokoju wśród inwestorów i lokalnych magnatów przemysłowych. Pokrywając straty fabryki materiałami z krajowych zapasów, moglibyśmy być postrzegani jako ci, którzy ratują lokalne miejsca pracy."
 MFE_workplace_events.3.f:0 "Każą nam strzelać do ludzi, ale nie dają nam niczego, czym moglibyśmy strzelać. Jak armia ma walczyć w ten sposób?!"
 MFE_workplace_events.3.a:0 "Nic nie można zrobić"
 MFE_workplace_events.3.b:0 "Wyślijmy im trochę pieniędzy, to może rozwiązać problem"
 MFE_workplace_events.4.t:0 "Napad na fabrykę herbaty"
 MFE_workplace_events.4.d:0 "Centralna stacja ważenia herbaty w jednej z naszych prowincji produkujących herbatę została napadnięta przez uzbrojonych bandytów. Niektórzy miejscowi spekulują, że trudne czasy w prowincji mogły skłonić lokalnych rolników, zmęczonych tym, że miejscowi dystrybutorzy i sprzedawcy odbierają im zyski, do napadu na stację. Bez względu na przyczynę musimy zająć się tą sytuacją."
 MFE_workplace_events.4.f:0 "Przyszli w środku nocy, zabili strażników, a następnie ograbili całe miejsce ze wszystkich naszych zapasów zielonej herbaty. Zostawili jednak całą czarną herbatę, ale i tak nikt nie chce jej pić."
 MFE_workplace_events.4.b:0 "Podbiłbym cały świat za filiżankę herbaty! Muszą zostać odnalezieni."
 MFE_workplace_events.4.ttt:0 "Rozpocznij śledztwo w sprawie napadu."
 MFE_workplace_events.5.t:0 "Stare konserwy"
 MFE_workplace_events.5.d:0 "Kwatermistrz generalny informuje o odkryciu zapomnianych zapasów konserw w wojskowym magazynie w [SCOPE.sState('canning_state').GetName]. Zawartość puszek, mimo że mają one już kilka lat, nadal wydaje się całkiem jadalna. Co powinniśmy zrobić z 15 tonami konserw?"
 MFE_workplace_events.5.f:0 "Znaleźliśmy je w tylnym kącie, pokryte stertą kurzu grubą na metr. Sprawdziliśmy, czy nadają się do jedzenia, dając je szczurowi, który rzeczywiście je zjadł. Jak mówi przysłowie: „Jeśli zje to szczur, zjedzą to też robotnicy”."
 MFE_workplace_events.5.a:0 "Obrzydliwe"
 MFE_workplace_events.5.b:0 "Jestem pewien, że znajdziemy ludzi, którzy zjedzą tę breję!"
 MFE_workplace_events.5.tt:0 "Bogactwo grup społecznych w [SCOPE.sState('canning_state').GetName] zostanie zmniejszone."
 MFE_workplace_events.6.t:0 "Gorączka bydła"
 MFE_workplace_events.6.d:0 "Dziwna gorączka wybuchła wśród zwierząt hodowlanych w [SCOPE.sState('bovine_state').GetName], a doniesienia mówią o masowym wymieraniu bydła. Weterynarz z lokalnego garnizonu przemierza prowincję wzdłuż i wszerz, próbując zrobić wszystko, co możliwe, aby powstrzymać skutki tej, jak się wydaje, wysoce zaraźliwej choroby. Chociaż sama choroba ostatecznie ustąpi, kwestia odszkodowań dla setek zrujnowanych rolników i ich rodzin wciąż wymaga rozwiązania."
 MFE_workplace_events.6.f:0 "Wyszedłem wczoraj rano na pola i, ku mojemu zdumieniu, ujrzałem moje bydło pokryte zielonymi krostami i wydzielające dziwną fioletową ropę. Te krowy były kiedyś warte tak wiele, a teraz możemy mieć tylko nadzieję, że sprzedamy je [GetPopType('peasants').GetName], którzy nie zauważą odrażającego zapachu, jaki wydzielają."
 MFE_workplace_events.6.a:0 "Wyślijmy im wszelką potrzebną pomoc!"
 MFE_workplace_events.6.b:0 "Nie możemy przeznaczyć niczego na pomoc"
 MFE_workplace_events.6.c:0 "Porozmawiajmy z sąsiednimi państwami i sprawdźmy, czy możemy uzyskać dla nich pomoc"
 MFE_workplace_events.7.t:0 "Śmierć na jedwabnych polach"
 MFE_workplace_events.7.d:0 "Kokony więdną i obumierają, a nieliczne nici, które się na nich znajdują, nie zlepiają się prawidłowo i rozpadają przy najmniejszym powiewie wiatru. Coś jest nie tak na jedwabnych polach, a nawet nasi najlepsi chemicy nie byli w stanie znaleźć lekarstwa na chorobę nękającą nasze hodowle. Lokalni hodowcy jedwabiu są oburzeni i wzywają rząd do działania."
 MFE_workplace_events.7.f:0 "To coś, czego nigdy wcześniej nie widzieliśmy, cała nasza ciężka praca idzie na marne. Wszystko po prostu umiera, wszyscy pracownicy są bez nadziei. Mówią, że brak jedwabiu oznacza brak pracy, a brak pracy oznacza brak środków do życia."
 MFE_workplace_events.7.a:0 "[SCOPE.sCharacter('guilty_silk_field_owner').GetFullName] tylko wykonuje [SCOPE.sCharacter('guilty_silk_field_owner').GetHerHis] pracę"
 MFE_workplace_events.7.b:0 "[SCOPE.sCharacter('guilty_silk_field_owner').GetFullName] zapłaci za [SCOPE.sCharacter('guilty_silk_field_owner').GetHerHis] ignorancję"
 MFE_workplace_events.7.tt:0 "[SCOPE.sCharacter('guilty_silk_field_owner').GetFullName] zostanie aresztowany i pozbawiony [SCOPE.sCharacter('guilty_silk_field_owner').GetHerHis] stanowiska władzy."
 MFE_workplace_events.8.t:0 "Krew i Żelazo"
 MFE_workplace_events.8.d:0 "„Nie przemówieniami i głosami większości rozstrzyga się wielkie problemy naszych czasów, lecz żelazem i krwią.”\n-Otto von Bismarck\n\nW kopalniach żelaza w [SCOPE.sState('iron_state').GetName] odkryto nowe, bogate złoże minerałów. Choć żyła jest zasobna, znajduje się również na niebezpiecznej głębokości, która wykracza poza możliwości naszej obecnej technologii wydobywczej. Podjęto próby wydobycia rudy, lecz kosztowały nas one życie i krew. Kilku robotników zginęło, spoczywając w ogromnym wyrobisku żelaza, ale teraz żelazo można wydobywać w tempie, które wcześniej uznawano za niemożliwe."
 MFE_workplace_events.8.f:0 "Nigdy wcześniej nie widzieliśmy czegoś takiego, żyły żelaza tak ogromnej, że czterokrotnie zwiększyłaby produkcję. Wysłaliśmy więc kilku ludzi, aby to sprawdzili i przygotowali warunki do jego wydobycia. Dotarli tam, ale nie było to przyjemne doświadczenie. Z dziesięciu ludzi, którzy wyruszyli, tylko jeden wrócił, a i on ledwo żył, by opowiedzieć tę historię."
 MFE_workplace_events.8.a:0 "Dajmy im kilka dni wolnego i wyślijmy pomoc"
 MFE_workplace_events.8.b:0 "Kogo obchodzi kilka ofiar... wracać do pracy!"
 MFE_workplace_events.9.t:0 "Tragedia w Kopalni"
 MFE_workplace_events.9.d:0 "Kolejny tragiczny dzień dla naszych robotników. Dziś w kopalniach żelaza w [SCOPE.sState('iron_tragedy_state')] zgłoszono wypadek, który pochłonął kilka ofiar. Doniesiono o rannych pracownikach, a niektórzy wciąż pozostają zaginieni. Według raportów przyczyną wypadku było zawalenie się wadliwej podpory w kopalni. To wydarzenie z pewnością wywoła przynajmniej lokalną debatę na temat warunków pracy w naszych kopalniach."
 MFE_workplace_events.9.f:0 "Jak to mogło się wydarzyć..."
 MFE_workplace_events.9.a:0 "Ci przeklęci przemysłowcy..."
 MFE_workplace_events.9.b:0 "Wesprzyjmy pracowników w każdy możliwy sposób"
 MFE_workplace_events.9.c:0 "Dlaczego nie możemy wrócić do prostszych czasów na polach"
 MFE_workplace_events.10.t:0 "Problemy z jakością bawełny"
 MFE_workplace_events.10.d:0 "Plantacje bawełny w [SCOPE.sState('cotton_state').GetName] mają liczne problemy z jakością produkowanej bawełny. Niektórzy twierdzą, że jest to spowodowane dziwnymi zjawiskami w deszczu, ale przyczyna może być zupełnie inna..."
 MFE_workplace_events.10.f:0 "Nie mogę używać tego badziewia, jak w ogóle można to nazywać bawełną?!"
 MFE_workplace_events.10.a:0 "Właściciele ziemscy wyciągną nas z tego problemu"
 MFE_workplace_events.10.b:0 "Ludność wiejska robi to od wieków"
 MFE_workplace_events.10.c:0 "Przywódcy religijni będą modlić się o lepszą bawełnę"
 MFE_workplace_events.11.t:0 "Eksplozja Bojlera"
 MFE_workplace_events.11.d:0 "Dziś w [SCOPE.sState('steamer_state').GetName] doszło do tragedii, gdy podczas rutynowej próby eksplodował kocioł parowy w warsztacie mechanicznym, któremu zlecono jego budowę dla lokalnej fabryki parowców. W wyniku eksplozji zginęło siedmiu pracowników, a sprzęt wart kilka tysięcy funtów został zniszczony. Lokalni urzędnicy badają warunki pracy w warsztacie i mamy nadzieję, że w przyszłości uda się uniknąć takich wypadków, lecz na razie [SCOPE.sState('steamer_state').GetName] opłakuje swoich zmarłych."
 MFE_workplace_events.11.f:0 "To po prostu straszne, sprawdzaliśmy te kotły w zeszłym tygodniu, nikt nie mógł sobie wyobrazić, że mogłyby eksplodować."
 MFE_workplace_events.11.a:0 "Te wydarzenia są po prostu ceną postępu."
 MFE_workplace_events.11.b:0 "Pracownicy nie powinni być wykorzystywani i zmuszani do pracy w takich warunkach."
 MFE_workplace_events.11.c:0 "Maszyny są niebezpieczne! Sam przemysł jest rakiem."
 MFE_workplace_events.12.t:0 "Zniszczenie farbiarni"
 MFE_workplace_events.12.d:0 "Dziś w jednej z naszych farbiarni zginęło kilku pracowników, gdy przemysłowa kadź z gorącym barwnikiem przypadkowo wylała się na podłogę warsztatu na nieświadomych zagrożenia pracowników. Miejscowi są oburzeni tym zdarzeniem, twierdząc, że za wypadek odpowiadają słabe przepisy bezpieczeństwa w gorącym i niebezpiecznym miejscu pracy, oraz wzywają rząd do działania. Gdy ratownicy opuścili miejsce zdarzenia, kilku pracowników warsztatu pozostawiono umierających."
 MFE_workplace_events.12.f:0 "Po prostu pracowałem, farbując koszule, a potem wszyscy wokół mnie zaczęli nagle umierać."
 MFE_workplace_events.12.a:0 "Każdy kiedyś musi umrzeć"
 MFE_workplace_events.12.b:0 "Nie zginęli na darmo!"
 MFE_workplace_events.13.t:0 "Wybuch cysterny z ropą"
 MFE_workplace_events.13.d:0 "Cysterna z paliwem w jednej z naszych rafinerii w [SCOPE.sState('oil_state').GetName] eksplodowała dziś z nieznanych dotąd przyczyn, a w wyniku pożaru zginęło siedmiu pracowników oraz zniszczono mienie firmy warte tysiące dolarów. Właściciel rafinerii odrzucił wszelką odpowiedzialność za wypadek, twierdząc zamiast tego, że rządowe inspekcje bezpieczeństwa były niewystarczające."
 MFE_workplace_events.13.f:0 "To po prostu straszne, jeszcze niedawno ropa płynęła świetnie, a potem nagle wszystko wybuchło, co za szkoda."
 MFE_workplace_events.13.a:0 "[SCOPE.sCharacter('guilty_oil_owner').GetFullName] tylko wykonuje [SCOPE.sCharacter('guilty_oil_owner').GetHerHis] pracę"
 MFE_workplace_events.13.b:0 "[SCOPE.sCharacter('guilty_oil_owner').GetFullName] nie będzie dalej tolerować [SCOPE.sCharacter('guilty_oil_owner').GetHerHis] ignorancji"
 MFE_workplace_events.13.tt:0 "[SCOPE.sCharacter('guilty_oil_owner').GetFullName] zostanie aresztowany i zniknie..."
 MFE_workplace_events.14.t:0 "Nadprodukcja w rafinerii"
 MFE_workplace_events.14.d:0 "Jedna z naszych rafinerii radzi sobie ostatnio bardzo dobrze, a produkcja przekracza oczekiwane limity o kilka tysięcy galonów. Z powodu problemów z magazynowaniem właściciel rafinerii zwrócił się do rządu z propozycją sprzedaży paliwa po znacznie obniżonej cenie. Możemy albo sami kupić to paliwo, albo odrzucić jego ofertę i poczekać, aż wprowadzi tanie paliwo na rynek. Lokalny wpływ taniego paliwa powinien sprawić, że mieszkańcy będą całkiem zadowoleni, ale prawdopodobnie sami moglibyśmy wykorzystać to paliwo."
 MFE_workplace_events.14.f:0 "Czarne złoto płynie!"
 MFE_workplace_events.14.a:0 "Ropa jest paliwem przyszłości!"
 MFE_workplace_events.14.b:0 "Skierujmy fundusze na bardziej... legalne sprawy"
 MFE_workplace_events.15.t:0 "Stary człowiek i morze"
 MFE_workplace_events.15.d:0 "Rybak z wybrzeża [SCOPE.sState('fishing_state').GetName] o imieniu [SCOPE.sCharacter('fisherman').GetFullName] przywiózł dziś ogromny połów. Jego trawler jest wręcz przepełniony bogactwami najbogatszych z oceanów, gdy cumuje w porcie, a wkrótce inni rybacy są w stanie powtórzyć jego wyczyn. Wygląda na to, że w tym roku połowy w [SCOPE.sState('fishing_state').GetName] są wyjątkowo udane."
 MFE_workplace_events.15.f:0 "Widziałem [SCOPE.sCharacter('fisherman').GetFullName] u wybrzeży zaledwie kilka dni temu. Wyciągał je jeden za drugim, jakby był opętany, widziałem, jak w ciągu godziny do jego łodzi trafiło około 500 ryb. Musiał wrócić do [SCOPE.sState('fishing_state').GetName] tylko dlatego, że jego łódź niemal zatonęła pod samym ciężarem złowionych ryb. Gdy dotarł na brzeg, większość z tych ryb była tak ogromna, że mogłaby wykarmić dziewięcioosobową rodzinę przez miesiąc."
 MFE_workplace_events.15.a:0 "Jak moglibyśmy w to ingerować, to jest po prostu niesamowite"
 MFE_workplace_events.15.b:0 "Mieszkańcy [SCOPE.sState('fishing_state').GetName] będą mieli najtańszą rybę na świecie"
 MFE_workplace_events.16.t:0 "Wybuch materiałów wybuchowych"
 MFE_workplace_events.16.d:0 "Pożar w magazynie materiałów wybuchowych w [SCOPE.sBuilding('explosion_building').GetName] spowodował ogromną eksplozję, którą według niektórych było słychać aż w [SCOPE.GetRootScope.GetCountry.GetCapital.GetName]. Zniszczenia są ogromne, a według doniesień w okolicy zginęły setki osób. Gdy ogień rozprzestrzenia się po mieście, straż pożarna musi ustalić priorytety: pożar zagraża rozprzestrzenieniem się na północ, w kierunku zamożnych dzielnic [SCOPE.sBuilding('explosion_building').GetName], oraz na południe, w stronę biedniejszych obszarów."
 MFE_workplace_events.16.f:0 "Kilku pracowników w [SCOPE.sBuilding('explosion_building').GetName] ostrzegało, że materiały wybuchowe eksplodują, ale nikt im nie uwierzył... aż było za późno."
 MFE_workplace_events.16.a:0 "Natychmiast naprawcie fabrykę!"
 MFE_workplace_events.16.b:0 "Nie ma tam nic poza gruzami, co można zrobić..."
 MFE_workplace_events.17.t:0 "Eleganckie meble"
 MFE_workplace_events.17.d:0 "Może to krzesło, madame? Wykonane z najlepszego brazylijskiego mahoniu, zdobione delikatnymi nubijskimi wzorami z kenijskiej kości słoniowej. Proszę spojrzeć na bogate żyłkowanie skóry. Nie znajdzie pani drugiego takiego w całym [SCOPE.GetRootScope.GetCountry.GetName]!\n\nRosnący poziom życia w [SCOPE.GetRootScope.GetCountry.GetName] spowodował wzrost zapotrzebowania na lepsze i bardziej eleganckie meble. Skoro domy ludzi stają się piękniejsze, naturalne jest, że również urzędy rządowe zostają modernizowane, aby lepiej odpowiadać współczesnym standardom."
 MFE_workplace_events.17.f:0 "Uważano, że tak piękne meble są niemożliwe do wykonania, to po prostu niesamowite!"
 MFE_workplace_events.17.a:0 "Zachęćmy do produkcji!"
 MFE_workplace_events.17.b:0 "Bogaci pokochają te stoły!"
 MFE_workplace_events.18.t:0 "Fabryka cuchnie"
 MFE_workplace_events.18.d:0 "Mieszkańcy jednej z naszych prowincji, [SCOPE.sState('stinking_state').GetName], skarżą się na pewne emisje pochodzące z lokalnej fabryki nawozów. Choć miejsce to może pachnieć jak róże dla prowincjonalnego budżetu, bilans z pewnością nie wygląda ostatnio dobrze dla lokalnych nosów. Moglibyśmy poprzeć rozporządzenie mające na celu zmianę procesu pracy, ale mogłoby to rozgniewać miejscowych magnatów przemysłowych."
 MFE_workplace_events.18.f:0 "Obudziłem się dziś rano, wyszedłem na ulice i przywitał mnie najbardziej odrażający zapach, jakiego kiedykolwiek doświadczyłem. Wydawało się niemożliwe, aby tak obrzydliwy odór naprawdę istniał, ale jedno było jasne. Dochodził z zakładu chemicznego."
 MFE_workplace_events.18.a:0 "Niestety, uprawy nie rosną same z siebie."
 MFE_workplace_events.18.b:0 "Powinniśmy rozważyć pewne lokalne ograniczenia."
 MFE_workplace_events.19.t:0 "Rozkwit kliprów"
 MFE_workplace_events.19.d:0 "Nabrzeża, pomosty i doki remontowe w jednej z naszych nadmorskich prowincji tętnią życiem od odgłosów młotów i śpiewu pił, gdy lokalna fabryka zmaga się z napływem nowych zamówień na klipry z całego świata. Wydajne procesy pracy i zarządzanie, połączone z doskonałym rzemiosłem oraz sztuką żeglarską, pozwoliły im produkować więcej i lepsze statki niż w jakimkolwiek wcześniejszym roku! Być może nadszedł czas, by spocząć na laurach, ale z drugiej strony przyszłość zawsze pozostaje niepewna."
 MFE_workplace_events.19.f:0 "Te statki są najlepsze na świecie, wystarczy na nie spojrzeć, żagle lśnią w słońcu pięknem, które wydaje się niemożliwe."
 MFE_workplace_events.19.a:0 "Świętujmy!"
 MFE_workplace_events.19.b:0 "Załóż szkołę morską"
 MFE_workplace_events.20.t:0 "Radio [SCOPE.sState('radio_state').GetName]"
 MFE_workplace_events.20.d:0 "Lokalna stacja radiowa w jednej z naszych prowincji, [SCOPE.sState('radio_state').GetName], zmaga się z niedoborem podzespołów radiowych do swoich nadajników i została zmuszona do wstrzymania nadawania do czasu rozwiązania sytuacji. Lokalne władze zasugerowały pożyczenie stacji części rządowych zapasów podzespołów radiowych, ponieważ obawiają się, że ludność może zaniepokoić się brakiem wiadomości z frontu."
 MFE_workplace_events.20.f:0 "Słyszałeś? Stacja radiowa w [SCOPE.sState('radio_state').GetName] przestała działać kilka dni temu. Kto wie, co teraz może się dziać z wojną..."
 MFE_workplace_events.20.a:0 "Nie mamy żadnych na zbyciu"
 MFE_workplace_events.20.b:0 "Dajmy im radia"
