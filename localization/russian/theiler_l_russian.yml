 theiler.79.t: "Biological Team leaves"
 theiler.79.d: "After the research assistants have introduced our local farmers to the modern pesticide methods from our overlord country, they say goodbye and return to their homeland."
 theiler.79.f: "'The only thing of importance, when we depart, will be the traces of love we have left behind.' -Albert Schweitzer"
 theiler.79.g: "Maybe it's not such a bad thing to have an overlord."
