 theiler_has_microbiologist_tt: "#default_text Есть [concept_theiler_biologist|l] с чертой «$theiler_microbiologist$».#!"
 theiler_biologist_microbiologist_trait_icon_loc: "\n@mr_rating_fantastic! #tooltip:[GetRawTextTooltipTag('theiler_rating_biologist_microbiologist_information_tt')] #underline #p $theiler_microbiologist$#!#!#!"
 theiler_rating_biologist_microbiologist_information_tt: "A Biologist with the #V $theiler_microbiologist$#! trait is way better at finding [Concept('concept_theiler_microorganism','$concept_theiler_microorganisms|q$')], and researching diseases."
 theiler_biologist_physician_trait_icon_loc: "\n@mr_rating_very_good! #tooltip:[GetRawTextTooltipTag('theiler_rating_biologist_physician_information_tt')] #underline #p $panum_physician$#!#!#!"
