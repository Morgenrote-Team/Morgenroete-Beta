 theiler_boll_weevil_condition: "Хлопковый долгоносик"
 theiler_boll_weevil_condition_desc: "На рубеже XIX и XX веков хлопковый долгоносик считался одним из самых опасных вредителей Северной Америки, уничтожавшим целые урожаи хлопка."
 theiler_codling_moth_condition: "Яблонная плодожорка"
 theiler_codling_moth_condition_desc: "Яблонная плодожорка была одним из самых страшных бедствий европейского яблоневодства и регулярно уничтожала целые урожаи."
 theiler_grape_phylloxera_condition: "Виноградная филлоксера"
 theiler_grape_phylloxera_condition_desc: "В конце XIX века нашествие филлоксеры уничтожило большинство виноградников винных сортов в Европе, особенно во Франции."
 theiler_potato_beetle_condition: "Колорадский жук"
 theiler_potato_beetle_condition_desc: "Около 1840 года этот жук начал питаться культурным картофелем и вскоре стал одним из самых губительных вредителей картофельных посадок."
 theiler_screwworm_fly_condition: "Мясная муха Нового Света"
 theiler_screwworm_fly_condition_desc: "Cochliomyia hominivorax — паразитическая муха, личинки которой поражают и поедают ткани живых организмов, прежде всего теплокровных животных, включая крупный рогатый скот и другой домашний скот."
 theiler_tea_mosquito_condition: "Чайный клоп"
 theiler_tea_mosquito_condition_desc: "Клопы рода Helopeltis, которых иногда называют клопами-комарами, вредят различным культурам, включая какао, кешью, хлопчатник и чай."
