 theiler_stopped_biologist_project_tt: "Вы решили остановить проект, нажав кнопку #italic $theiler_stop_biological_project_button$#!, или у вас больше нет [Concept('concept_theiler_biologist', '#b #GREEN биолога#!#!')]."
