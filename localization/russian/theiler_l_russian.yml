 theiler_boll_weevil_condition: "Boll Weevil"
 theiler_boll_weevil_condition_desc: "From the turn of the 19th to the 20th century, the boll weevil was considered one of the most dangerous pests in North America, destroying entire cotton crops."
 theiler_codling_moth_condition: "Codling Moth"
 theiler_codling_moth_condition_desc: "The codling moth was one of the worst scourges of the European apple industry, regularly destroying entire crops."
 theiler_grape_phylloxera_condition: "Grape Phylloxera"
 theiler_grape_phylloxera_condition_desc: "In the late 19th century, a phylloxera epidemic destroyed most of the vineyards for wine grapes in Europe, most notably in France."
 theiler_potato_beetle_condition: "Colorado Potato Beetle"
 theiler_potato_beetle_condition_desc: "Around 1840, this beetle adopted the cultivated potato into its host range and it rapidly became a most destructive pest of potato crops."
 theiler_screwworm_fly_condition: "New World Screwworm Fly"
 theiler_screwworm_fly_condition_desc: "Cochliomyia hominivorax is a parasitic species, whose larvae are renowned for eating and infesting the flesh of living organisms, primarily warm-blooded animals such as cattle and other livestock."
 theiler_tea_mosquito_condition: "Tea Mosquito Bug"
 theiler_tea_mosquito_condition_desc: "The genus Helopeltis, also sometimes known as mosquito bugs, include pests of various crops, including cacao, cashew, cotton and tea."
