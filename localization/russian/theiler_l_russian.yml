 theiler.42.f.strychnine: "#V Стрихнин#! впервые был выделен из бобов чилибухи (Strychnos Ignatii), дерева родом из Юго-Восточной Азии. Он нашёл применение как пестицид, а в малых дозах - как стимулятор мышц, сердца и кишечника. Однако больше всего он известен своей нейротоксичностью: передозировка вызывает судороги, потливость, тризм и другие мучительные симптомы, приводящие к смерти, что делает его излюбленным ядом для убийц и авторов детективов."
 theiler.42.f.emetine: "#V Эметин#! - препарат, содержащийся в ипекакуане (Carapichea ipecacuanha), также известной как рвотный корень, цветке родом из Центральной и Южной Америки. Впервые он был использован для лечения амебной дизентерии, кишечной инфекции. Свое название он получил без особых церемоний из-за своего эметического (рвотного) побочного эффекта - склонности вызывать тошноту и рвоту."
 theiler.42.f.atropine: "#V Атропин#! - это лекарственное средство, получаемое из белладонны Атропы, также известной как паслен смертельный, растения, произрастающего в Европе и Западной Азии. Атропин в различных формах нашел применение при лечении астмы, для блокирования побочных эффектов нервной стимуляции, для уменьшения выработки слюны, для лечения некоторых ядов и использовался женщинами для расширения зрачков в косметических целях."
 theiler.42.f.aloin: "#V Алоин#! - это натуральное соединение, которое в той или иной степени содержится в растениях семейства алоэ. Оно используется в качестве слабительного, для лечения солнечных ожогов, для перевязки ран, а также благодаря своим антиоксидантным и противовоспалительным свойствам."
 theiler.42.f.digitoxin: "#V Дигитоксин#! - это природное соединение, содержащееся в наперстянке пурпурной, также известной как наперстянка, растении, произрастающем по всей Европе, а также в Марокко. Дигитоксин используется для уменьшения задержки жидкости в мышцах (водянки), для облегчения мочеиспускания, а также при лечении сердечной аритмии и сердечной недостаточности. Однако, как следует из названия, он обладает токсическими свойствами, которые приводят к нарушению сердечного ритма, тошноте, остановке сердца и смерти."
 theiler.42.f.quinine: "#V Хинин#! - это лекарственное средство, впервые выделенное из коры хинного дерева, произрастающего в Перу. Хинин имеет богатую историю. Кора была впервые использована индейцами кечуа в качестве мышечного релаксанта, а затем завезена в Европу иезуитами для лечения малярии. Хинин, получаемый из этой коры, вскоре получил широкое распространение, что открыло больше возможностей для европейской колонизации и завоеваний на африканском континенте. Он также может быть использован при лечении скарлатины, желтой лихорадки и гриппа."
 theiler.42.f.thymol: "#V Тимол#! - это лекарственное средство, получаемое в основном из тимьяна обыкновенного, растения, произрастающего в Южной Европе, хотя его также можно найти в различных других растениях по всему миру. Он был известен своими антимикробными, противогрибковыми и антисептическими свойствами и поэтому широко использовался для лечения ран, гигиены полости рта и борьбы с паразитами."
 theiler.42.f.pilocarpine: "#V Пилокарпин#! - это лекарственное средство, получаемое из растений рода Пилокарпус, произрастающих в тропиках Южной Америки. Он используется для стимуляции выделения слюны и пота и, следовательно, обычно используется для лечения сухости во рту, вызванной расстройствами или как побочный эффект других методов лечения. Он также используется для лечения различных заболеваний глаз."
 theiler.42.f.ephedrine: "#V Эфедрин#! - это стимулирующее средство, получаемое из растения Ephedra Sinica, произрастающего в высокогорьях Северного Китая, Монголии и России. Оно нашло применение для лечения астмы, нарколепсии, ожирения и заложенности носа. У него множество побочных эффектов, включая проблемы со сном, головные боли, беспокойство, галлюцинации, высокое кровяное давление и учащенное сердцебиение. Последние два фактора привели к тому, что его стали использовать в качестве стимулятора, повышающего работоспособность."
 theiler.42.f.strophantine: "#V Строфантин#! - это лекарственное средство, получаемое из растений рода Строфантус, произрастающих в Африке. Строфантин использовался для улучшения работы сердца, лечения сердечной недостаточности и улучшения работы нервной системы, хотя в больших концентрациях он также использовался для отравления стрел."
 theiler.42.g: "Веха в фармации!"
