 theiler_early_pesticides_tech: "Ранние пестициды"
 theiler_early_pesticides_tech_desc: "После обнаружения инсектицидных свойств «парижской зелени», служившей пигментом для обоев, началось развитие химических пестицидов. Среди них появился арсенат свинца, гораздо эффективнее уничтожавший вредителей."
 theiler_modern_pesticides_tech: "Современные пестициды"
 theiler_modern_pesticides_tech_desc: "На рубеже веков распространение монокультур всё сильнее обостряло проблему вредителей. В ответ промышленное сельское хозяйство развязало химическую войну. Арсенат кальция, сульфат никотина и арсенит натрия — лишь некоторые виды её оружия."
 je_theiler_pesticide_development: "Разработка пестицида"
 je_theiler_pesticide_development_reason: "Обладая основными знаниями об инсектицидах, биолог в сотрудничестве с химиком может найти действенное средство против [Concept('concept_theiler_pest', 'вредителей')]. Сейчас разрабатывается пестицид #V «[AddLocalizationIf( Scope.Var('theiler_pesticide_type_var').IsSet , Scope.Var('theiler_pesticide_type_var').GetFlagName)]»#!.\n\nЕсли во время работы биолог или химик умрёт, разработка пестицида приостановится и возобновится лишь тогда, когда оба учёных вновь будут доступны."
 je_theiler_pesticide_development_success: "Работа [Concept('concept_theiler_biologist', '#b #GREEN биолога#!#!')] над новым пестицидом длится не менее #ORANGE 12 месяцев#!."
 je_theiler_grafting: "Прививка винограда"
 je_theiler_grafting_reason: "Наш биолог [ROOT.Var('theiler_biologist_var').GetCharacter.GetFullName] неустанно разрабатывает метод прививки, который позволит спасти европейские виноградники благодаря американским подвоям."
 je_theiler_grafting_success: "Работа [Concept('concept_theiler_biologist', '#b #GREEN биолога#!#!')] над новым средством борьбы с вредителями длится не менее #ORANGE 12 месяцев#!."
 je_theiler_pest_control: "Борьба с вредителями"
 je_theiler_pest_control_reason: "Открытие и внедрение пестицидов и биологических методов борьбы — от арсенатов свинца и кальция до прививки растений — позволяет биологу подавлять вспышки численности вредителей, если на рынке есть необходимый товар, обычно свинец. Таким способом регион можно очистить от вредителя всего за один месяц."
 je_theiler_sterile_insect_technique: "Метод стерильных насекомых"
 je_theiler_sterile_insect_technique_reason: "Современные методы могут позволить искоренить опасную мясную муху Нового Света, избавив людей и животных от этой напасти. Биолог может разработать теорию и провести полевые эксперименты, чтобы найти подходящее решение.\n\nЕсли во время работы биолог умрёт, исследования по искоренению паразита приостановятся, но возобновятся, как только появится новый биолог."
 je_theiler_sterile_insect_technique_success: "Работа [Concept('concept_theiler_biologist', '#b #GREEN биолога#!#!')] над методом искоренения мясной мухи длится не менее #ORANGE 12 месяцев#!."
 theiler.71.t: "Арсенат свинца"
 theiler.71.d: "Доктор [SCOPE.sCharacter('mendelejew_chemist_scope').GetLastName] и доктор [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] совместно разработали эффективный пестицид, массовое производство которого способно произвести переворот в сельском хозяйстве. Яблонная плодожорка уже съела своё последнее яблоко, а колорадскому жуку кусок в горло не полезет!"
 theiler.71.f: "Арсенат свинца (PbHAsO₄) был разработан в 1892 году Мелвиллом Терстоном Куком в Массачусетсе для борьбы с яблонной плодожоркой (Cydia pomonella) в садах. Он стал более стойкой и щадящей для растений альтернативой ядовитому арсениту меди («парижской зелени»). Порошок убивал насекомых при поедании обработанных растений, надолго задерживался на листьях и плодах и впервые позволил эффективно бороться с вредителями в промышленном садоводстве. Несмотря на вред для окружающей среды и здоровья человека, арсенат свинца широко применялся вплоть до появления синтетических пестицидов, таких как ДДТ."
 theiler.71.g: "То есть мы их буквально травим?"
 theiler.71.tt: "Отныне фермеры применяют арсенат свинца в своих хозяйствах для борьбы со следующими вредителями: [GetHarvestConditionType('theiler_potato_beetle_condition').GetName] и [GetHarvestConditionType('theiler_codling_moth_condition').GetName]."
 theiler.72.t: "Метод стерильных насекомых"
 theiler.72.d: "Доктор [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] предлагает необычную, но революционную идею: вместо уничтожения паразитов пестицидами можно разводить стерильных самцов, спаривание с которыми не позволит самкам оставить потомство."
 theiler.72.f: "Метод стерильных насекомых был разработан в 1950-х годах Рэймондом К. Бушлендом и Эдвардом Ф. Ниплингом. Самцов мух стерилизуют гамма-излучением, обычно от источников на основе кобальта-60 или цезия-137. Это высокоэнергетическое излучение разрушает ДНК половых клеток, не оказывая существенного влияния на жизнеспособность насекомых и их способность к спариванию. Затем стерильных самцов массово выпускают в природу. Они успешно спариваются с дикими самками, но жизнеспособного потомства не появляется, и численность популяции постепенно падает. Метод оказался особенно действенным против мясной мухи Нового Света: её искоренение в Северной и Центральной Америке предотвратило огромный экономический ущерб и потери в животноводстве."
 theiler.72.g: "То есть мы буквально облучаем их?"
 theiler.72.tt: "Отныне, если доступен биолог, он ежегодно очищает одну область от вредителя «[GetHarvestConditionType('theiler_screwworm_fly_condition').GetName]»."
 theiler.73.t: "Арсенит натрия"
 theiler.73.d: "Доктор [SCOPE.sCharacter('mendelejew_chemist_scope').GetLastName] и доктор [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] совместно разработали эффективный пестицид, массовое производство которого способно произвести переворот в сельском хозяйстве. Стаи саранчи, наводившие ужас на человечество, теперь сами узнают, что такое настоящий страх!"
 theiler.73.f: "Арсенит натрия — высокотоксичная неорганическая соль, служившая в начале XX века одним из основных пестицидов и гербицидов неизбирательного действия. Благодаря чрезвычайно высокой растворимости в воде она стала важным средством химической защиты в сельском хозяйстве по всему миру. Её применяли для купания крупного рогатого скота и овец против клещей, в частности в колониальной Индии и Австралии, а также для борьбы с саранчой. На каучуковых и чайных плантациях Азии это было обычное средство уничтожения подлеска. При всей эффективности высокая токсичность для млекопитающих и стойкость в окружающей среде создавали серьёзную угрозу здоровью работников и скота. После появления синтетических органических препаратов в середине XX века и осознания канцерогенных свойств арсенита натрия его применение жёстко ограничили или запретили в пользу менее опасных средств."
 theiler.73.g: "То есть мы заманиваем их отравленной приманкой?"
 theiler.73.tt: "Отныне фермеры применяют арсенит натрия в своих хозяйствах для борьбы со следующими вредителями: [GetHarvestConditionType('locust_swarm').GetName]."
 theiler.74.t: "Арсенат кальция"
 theiler.74.d: "Доктор [SCOPE.sCharacter('mendelejew_chemist_scope').GetLastName] и доктор [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] совместно разработали эффективный пестицид, массовое производство которого способно произвести переворот в сельском хозяйстве. Приятного аппетита, маленькие хлопковые долгоносики!"
 theiler.74.f: "Арсенат кальция — высокотоксичная неорганическая соль, ставшая одним из важнейших средств химической борьбы с вредителями в начале XX века. Примерно с 1906 года её применяли как более дешёвую и стойкую альтернативу арсенату свинца, преимущественно в качестве кишечного яда для грызущих насекомых. Наиболее значимым историческим применением стало массовое опыливание хлопковых полей против хлопкового долгоносика в США и колониальной Индии. В отличие от арсенита натрия, меньшая растворимость в воде позволяла наносить её прямо на листву с меньшим риском ожогов растений. В Британской Индии препарат широко применяли при выращивании хлопка и картофеля, нередко распыляя с первых сельскохозяйственных самолётов. Однако крайняя стойкость в окружающей среде, высокая токсичность для опылителей и канцерогенность привели к его замене синтетическими органическими пестицидами, такими как ДДТ, в 1940-х годах."
 theiler.74.g: "То есть мы буквально портим им желудки?"
 theiler.74.tt: "Отныне фермеры применяют арсенат кальция в своих хозяйствах для борьбы со следующими вредителями: [GetHarvestConditionType('theiler_boll_weevil_condition').GetName]."
 theiler.75.t: "Прививка винограда"
 theiler.75.d: "Доктор [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] [SelectLocalization(SCOPE.sCharacter('theiler_biologist_scope').IsFemale, 'изучила', 'изучил')] американские виноградные лозы, устойчивые к филлоксере. Прививка на их подвои позволит защитить виноград Старого Света от вредителя из Нового Света."
 theiler.75.f: "Прививка — агротехнический приём, который спас мировое виноградарство после опустошительного нашествия филлоксеры во Франции в конце XIX века. Причиной кризиса стала Daktulosphaira vitifoliae — филлоксера, североамериканское тлеподобное насекомое, уничтожающее корни европейского винограда Vitis vinifera. К началу XX века «восстановление» виноградников заключалось в прививке восприимчивых европейских сортов на устойчивые американские подвои, например Vitis riparia или Vitis rupestris. Получалось составное растение: американские корни обеспечивали устойчивость к вредителю, а европейская надземная часть сохраняла нужные качества винограда. Метод остаётся отраслевым стандартом: ни одно химическое средство не оказалось столь же эффективным и долговечным, как этот генетико-механический барьер."
 theiler.75.g: "То есть мы буквально... Стоп, а этих тварей мы не убиваем?"
 theiler.75.tt: "Отныне фермеры применяют прививку винограда в своих хозяйствах для борьбы со следующими вредителями: [GetHarvestConditionType('theiler_grape_phylloxera_condition').GetName]."
 theiler.76.t: "Сульфат никотина"
 theiler.76.d: "Доктор [SCOPE.sCharacter('mendelejew_chemist_scope').GetLastName] и доктор [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] совместно разработали эффективный пестицид, массовое производство которого способно произвести переворот в сельском хозяйстве. Чайный клоп закончил своё последнее чаепитие!"
 theiler.76.f: "Сульфат никотина — сильнодействующее производное растительного алкалоида, ставшее важным инсектицидом на колониальных плантациях в начале XX века. В отличие от необработанных табачных вытяжек, стандартизированная сульфатная форма обладала стабильной токсичностью и меньшей летучестью, что делало её весьма эффективной против колюще-сосущих насекомых, таких как чайный клоп (Helopeltis theivora). На чайных плантациях Ассама и Цейлона её применяли как контактный яд, парализующий нервную систему вредителя. Препарат часто продавался под маркой «Black Leaf 40»; обычно его смешивали с мылом, чтобы он лучше держался на покрытой воском чайной листве. Быстрое разложение снижало количество долговременных остатков, однако высокая стоимость и крайняя токсичность для млекопитающих ограничивали применение ценными культурами вплоть до появления синтетических заменителей в 1940-х годах."
 theiler.76.g: "То есть мы их буквально выкуриваем?"
 theiler.76.tt: "From now on, farmers will use nicotine sulfate on their farms to get rid of the [GetHarvestConditionType('theiler_tea_mosquito_condition').GetName]."
 goods_output_tea_mult: "Производство @tea! чая сооружениями"
 goods_output_tea_mult_desc: "Бонус или штраф к количеству @tea! чая, производимого сооружениями"
 theiler.60.t: "Хлопковый долгоносик"
 theiler.60.d: "Хлопковый долгоносик, прежде питавшийся исключительно диким мексиканским хлопчатником, похоже, изменил свои привычки: теперь он угрожает всему хлопководству на побережье Мексиканского залива!"
 theiler.60.f: "Хлопковый долгоносик (Anthonomus grandis) — жук, питающийся бутонами и цветками хлопчатника. Перебравшись из Мексики в США в конце XIX века, он стал одним из самых разрушительных в экономическом отношении вредителей в истории сельского хозяйства. Особую опасность представляет его цикл размножения: самки откладывают яйца внутрь цветочных бутонов и коробочек хлопчатника. Вылупившиеся личинки поедают внутренние ткани, препятствуя развитию волокна и вызывая опадение плодов. К 1920-м годам долгоносик подорвал экономику «короля-хлопка», способствуя масштабным социальным переменам, включая Великое переселение афроамериканцев, и вынуждая фермеров переходить на другие культуры, например арахис."
 theiler.60.g: "Мой драгоценный хлопок!"
 theiler.60.tt: "Отныне [GetHarvestConditionType('theiler_boll_weevil_condition').GetName] будет появляться в Северной Америке."
 theiler.61.t: "Виноградная филлоксера"
 theiler.61.d: "Ужасные новости для наших виноделов: филлоксера каким-то образом перебралась из Америки в Европу. В [SCOPE.sState('theiler_state_scope').GetCustom('RU_SL_PP')] она уже начала свою разрушительную работу. Это катастрофа!"
 theiler.61.f: "Виноградная филлоксера (Daktulosphaira vitifoliae) — крошечное тлеподобное насекомое, один из самых губительных вредителей в истории виноградарства. Родом из Северной Америки, в конце XIX века она вызвала мировой сельскохозяйственный кризис и едва не уничтожила европейскую винодельческую отрасль. Особую опасность представляет её питание на корнях виноградной лозы. В отличие от американских видов, европейский виноград Vitis vinifera не обладает природной устойчивостью к ядовитой слюне насекомого, вызывающей образование галлов и последующее отмирание корней. В результате растение полностью теряет способность поглощать воду и питательные вещества."
 theiler.61.g: "Моё драгоценное вино!"
 theiler.61.tt: "Отныне [GetHarvestConditionType('theiler_grape_phylloxera_condition').GetName] будет появляться в Европе."
 theiler.62.t: "Чайный клоп"
 theiler.62.d: "Загадочная гибель чайных кустов в Ассаме вызвала всеобщую тревогу. По-видимому, многочисленные растения поражены чайным клопом! Кажется, распространение этого вредителя невозможно остановить!"
 theiler.62.f: "Чайный клоп (род Helopeltis) — крайне опасный полужесткокрылый вредитель из семейства слепняков (Miridae). Несмотря на встречающееся название «клоп-комар», это настоящий клоп, а не комар, хотя длинные ноги и усики придают ему похожий силуэт. Он серьёзно угрожает различным плантационным культурам, прежде всего чаю, какао и кешью. Опасность обусловлена особым способом питания: колюще-сосущий ротовой аппарат поражает сочные молодые побеги и листья. При питании клоп впрыскивает ядовитую слюну, вызывающую быстрое отмирание тканей и характерные вдавленные буро-чёрные пятна. Высокая подвижность и быстрое размножение делают его серьёзной угрозой урожайности в тропических регионах."
 theiler.62.g: "Мой драгоценный чай!"
 theiler.62.tt: "Отныне [GetHarvestConditionType('theiler_tea_mosquito_condition').GetName] будет появляться в Южной и Восточной Азии."
 theiler.63.t: "Колорадские жуки в [SCOPE.sState('theiler_state_scope').GetCustom('RU_SL_PP')]!"
 theiler.63.d: "В [SCOPE.sState('theiler_state_scope').GetCustom('RU_SL_PP')] появился новый вредитель: колорадский жук, прежде питавшийся паслёном колючим, после знакомства с американским сельским хозяйством пристрастился к картофелю. Похоже, ничто не может остановить это прожорливое насекомое!"
 theiler.63.f: "Колорадский жук был обнаружен в 1820-х годах, а уже в конце 1850-х начал опустошительное продвижение от Скалистых гор к Атлантическому побережью. Ежегодно он преодолевал около 140 километров, став настоящим бедствием для американских фермеров. На протяжении 1870-х годов и позднее его попытки закрепиться в Европе неоднократно терпели неудачу. Переправиться через океан ему удалось лишь в 1920-х, вскоре после того, как Первая мировая война истощила ресурсы Старого Света."
 theiler.63.g: "Моя драгоценная картошка!"
 theiler.63.tt: "Отныне [GetHarvestConditionType('theiler_potato_beetle_condition').GetName] будет появляться в Северной Америке."
 theiler.64.t: "Колорадский жук"
 theiler.64.d: "Сегодня натуралисты и биологи представили доклад, встревоживший и фермеров, и торговцев. На наших полях впервые обнаружен печально известный колорадский жук, родом из Северной Америки. Если его не остановить, он может захватить всю Европу!"
 theiler.64.f: "Колорадский жук (Leptinotarsa decemlineata) — печально известный сельскохозяйственный вредитель из семейства листоедов. Его легко узнать по желтовато-оранжевому панцирю и десяти чёрным продольным полосам. Он представляет серьёзную угрозу паслёновым культурам, особенно картофелю. И взрослые жуки, и личинки жадно объедают листья, способны полностью оголять растения и уничтожать урожай. Помимо прямого ущерба, мировую опасность создают быстрая адаптация вида и высокая устойчивость к химическим инсектицидам. Изначально обитавший в Северной Америке, он стал проблемой для многих стран, существенно влияя на мировую продовольственную безопасность.\n\n #p Шансы остановить нашествие вредителя повышают наличие биолога, химика и технологий пестицидов.#!"
 theiler.65.t: "Разгул яблонной плодожорки!"
 theiler.65.d: "Яблонная плодожорка расширила свой ареал: из соседнего региона она проникла и в [SCOPE.sState('theiler_state_scope').GetCustom('RU_SL_VP')], поражая местные сады. Похоже, ничто не остановит её шествие по всей Северной Америке!"
 theiler.65.f: "Яблонная плодожорка (Cydia pomonella) происходит из Евразии. В XIX веке вместе с распространением яблоневодства она расселилась по Центральной Европе, Северной Италии, Балканам, Венгрии, российским землям к западу от Урала, Северной Америке и Австралии. Северные, очень жаркие и засушливые районы в основном избежали её нашествия. В XX веке она достигла почти всех яблоневодческих районов умеренного пояса, включая Скандинавию, Прибалтику и Южную Америку, став одним из важнейших вредителей плодовых садов."
 theiler.65.g: "Бросить все силы на предотвращение распространения вредителя!"
 theiler.65.h: "Наши учёные найдут решение."
 theiler.65.i: "Придётся привыкать к соседству с этим вредителем."
 theiler.66.t: "Яблонная плодожорка в [SCOPE.sState('theiler_state_scope').GetCustom('RU_SL_PP')]!"
 theiler.66.d: "Сегодня натуралисты и биологи представили доклад, встревоживший и фермеров, и торговцев. В наших садах впервые обнаружена печально известная яблонная плодожорка, родом из Европы и Западной Азии. Если её не остановить, она может захватить всю Океанию!"
 theiler.66.f: "Яблонная плодожорка (Cydia pomonella) происходит из Евразии. В XIX веке вместе с распространением яблоневодства она расселилась по Центральной Европе, Северной Италии, Балканам, Венгрии, российским землям к западу от Урала, Северной Америке и Австралии. Северные, очень жаркие и засушливые районы в основном избежали её нашествия. В XX веке она достигла почти всех яблоневодческих районов умеренного пояса, включая Скандинавию, Прибалтику и Южную Америку, став одним из важнейших вредителей плодовых садов.\n\n #p Шансы остановить нашествие вредителя повышают наличие биолога, химика и технологий пестицидов.#!"
 theiler.67.d: "Сегодня натуралисты и биологи представили доклад, встревоживший и фермеров, и торговцев. В наших садах впервые обнаружена печально известная яблонная плодожорка, родом из Европы и Западной Азии. Если её не остановить, она может захватить всю Южную Африку!"
 theiler.68.d: "Сегодня натуралисты и биологи представили доклад, встревоживший и фермеров, и торговцев. В наших садах впервые обнаружена печально известная яблонная плодожорка, родом из Европы и Западной Азии. Если её не остановить, она может захватить всю Южную Америку!"
 theiler.69.t: "Нашествие предотвращено"
 theiler.69.d: "Борьба с вредителем в [SCOPE.sState('theiler_state_scope').GetCustom('RU_SL_PP')] завершилась полным успехом. Население одобряет принятые меры и связывает победу с энергичной работой правительства. По крайней мере на несколько лет мы защищены от нового нашествия."
 theiler.69.f: "После успешного уничтожения вредителя пострадавший регион остаётся в безопасности десять лет. Затем вредитель может вновь попытаться захватить новые территории в этом регионе — возможно, через другую страну, в которой есть порт и подходящая для него пища."
 theiler.69.g: "Слава правительству!"
 theiler.70.t: "Нашествие вредителя"
 theiler.70.d: "Попытки сдержать нового вредителя в [SCOPE.sState('theiler_state_scope').GetCustom('RU_SL_PP')] полностью провалились. Похоже, ничто не остановит его победоносное шествие по всей стране и за её пределами. Наша репутация растоптана, а общественность винит правительство в этом колоссальном провале."
 theiler.70.f: "Если вредителю удалось закрепиться, остановить его уже нельзя: пока не будет изобретено действенное средство борьбы, он будет регулярно опустошать посевы, как и в своём исконном ареале."
 theiler.70.g: "Позор правительству!"
