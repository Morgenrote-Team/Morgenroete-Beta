 theiler_congress_host_modifier: "Recently hosted a Biological Congress"
 theiler_congress_attend_modifier: "Attends Biological Congress"
 theiler.2000.t: "Preparations for the Biological Congress"
 theiler.2000.d: "Before the next International Biological Congress is held in our country, the question arises as to whether the congress should focus on a specific disease or not."
 theiler.2000.f: "Biological conferences can focus on a specific disease if the host nation has at least a description of the disease. A congress can only be held once for each disease. Biologists present receive additional clues so that they can advance their research more quickly. At a general congress, participating nations simply receive a bonus to their academic progress."
 theiler.2000.g: "This is supposed to be a general biological conference."
 theiler.2001.t: "Biological Congress"
 theiler.2001.d: "The capital is preparing for the international meeting of biological specialists. [ROOT.Var('theiler_biologist_var').GetCharacter.GetFullName] will chair the meetings as president. [SCOPE.GetRootScope.GetCountry.GetCustom('theiler_custom_congress_title')]"
 theiler.2001.f: "Biological conferences are an excellent opportunity to exchange biological knowledge. Achievements that were previously reserved for only one country are shared here in a brotherly manner. Biological conferences can share their knowledge in the field of pathogens, vaccines and pesticides."
 theiler.2001.g: "Send the invitations!"
 theiler.2002.t: "Invitation for Biological Congress"
 theiler.2002.d: "[SCOPE.sCountry('theiler_congress_host_country').GetName] is inviting the leading nations in biology to an international congress in its capital. [SCOPE.GetRootScope.GetCountry.GetCustom('theiler_custom_congress_title')]"
 theiler.2002.g: "Don't forget the microscopes!"
 theiler.2004.t: "Pathogen & Vaccine"
 theiler.2004.d: "It was with delight that Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] found that there were many like-minded people at the congress in [SCOPE.sCountry('theiler_congress_host_country').GetName] who were willing to share their microbiological knowledge. The only question is which of the wonderful illnesses [ROOT.Var('theiler_biologist_var').GetCharacter.GetSheHe] would like to know more about in the future?"
 theiler.2004.f: "Should a nation attending the Biological Congress know a pathogen of a disease or a vaccine for a disease that another country does not possess, then the latter can learn it at the congress. Knowledge can only be improved about one disease. If no new knowledge is possible at the congress, there is still the possibility of accumulating general knowledge and improving a biological technology."
 theiler.2004.g: "Our scientist should gather some general biological knowledge from colleagues."
 theiler.2005.t: "A Biological Vision"
 theiler.2005.d_general: "The biologists at the congress decided, in particular, to modernize and improve the training of prospective students of biology and wrote a joint declaration on this."
 theiler.2005.d_special: "Given the main focus of the conference, the scientists have voted to shift all efforts to combating a specific disease in the next few years."
 theiler.2005.f: "If a certain topic has been declared the main topic at the beginning of the biological congress, all participating nations will receive additional clues about this disease. If it is a general congress, the focus is on training new scientific staff."
 theiler.2005.g: "The event was worth it."
 theiler.2007.t: "Pesticides"
 theiler.2007.d: "Word got around at the congress that there were specialists who had succeeded in iventing new pesticides. They are ready to share their knowledge."
 theiler.2007.f: "Pesticides against pests like the codling moth are of such great importance to humanity that the inventors share the knowledge without reservation. Ultimately, it's about the well-being of all people."
 theiler.2007.g: "Cheers to humanity!"
 theiler.2009.t: "Medical Congress ends"
 theiler.2009.d: "The Medical Congress in [SCOPE.sCountry('theiler_congress_host_country').GetName] ended yesterday. The scientists are on their way home again and are bringing back numerous findings."
 theiler.2009.f: "The International Medical Congress (French: Congrès International de Médecine) was a series of international scientific conferences on medicine that took place, periodically, from 1867 until 1913. The idea of such a congress came in 1865, during the third annual Medical Congress of France; Professor Henri Giutrac proposed holding an international medical conference in 1867, taking advantage of the fact that physicians and surgeons from all over the world would surely be in Paris to attend that year's International Exhibition."
 theiler.2009.g: "I hope the buffet was good?"
 theiler.81.t: "Panama Disease"
 theiler.81.d: "A strange fungus has infested large parts of the banana plantations in [SCOPE.sState('theiler_state_scope').GetName]. Although similar cases have been reported in Southeast Asia and Australia, the extent of the devastation is hardly comparable. It seems that farmers are facing an entirely new threat: Panama disease!"
 theiler.81.f: "The Panama Disease (Fusarium oxysporum f. sp. cubense) is a soil-borne fungal disease that attacks banana plants, particularly the Gros Michel variety. First reported in the late 19th century in Central America, it became one of the most economically destructive plant diseases in agricultural history. Its significance lies in its mode of infection: the fungus enters through the roots and spreads through the plant's vascular system, blocking the flow of water and nutrients. Infected plants gradually wilt, turn yellow, and eventually die. By the 1950s, it had devastated Gros Michel plantations across Central and South America, forcing the banana industry to replace the variety with disease-resistant Cavendish bananas."
 theiler.81.g: "My precious bananas!"
 theiler.81.tt: "From now on the [GetHarvestConditionType('theiler_panama_disease_condition').GetName] will appear everywhere."
