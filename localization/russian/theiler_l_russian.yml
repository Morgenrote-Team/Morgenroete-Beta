 theiler.79.t: "Группа биологов уезжает"
 theiler.79.d: "Познакомив местных фермеров с современными методами применения пестицидов, используемыми в державе-сюзерене, научные помощники прощаются с нами и возвращаются на родину."
 theiler.79.f: "«Когда мы уйдём, значение будут иметь лишь следы любви, которые мы оставили после себя». — Альберт Швейцер"
 theiler.79.g: "Возможно, иметь сюзерена не так уж плохо."
