 theiler.2201.t: "Сельскохозяйственные улучшения"
 theiler.2201.d: "Доктор [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] [SelectLocalization(SCOPE.sCharacter('theiler_biologist_scope').IsFemale, 'достигла', 'достиг')] своей цели. Тщательный отбор и умелое применение биологических знаний позволили надолго укрепить сельское хозяйство нашей страны.\n\nВсего улучшено сооружений: [GetPlayer.MakeScope.Var('mr_num_improved_agriculture_buildings_var').GetValue|V0]\n$concept_theiler_microorganisms$ от проекта: [GetPlayer.MakeScope.ScriptValue('theiler_microorganisms_from_agriculture_project_for_event_value')|+0] @theiler_microorganisms_texticon!"
 theiler.2201.f: "«Эти идиоты всё еще думают, что они одомашнили все эти растения. На самом деле растения одомашнили нас, людей. Просто посмотрите, как мы за ними ухаживаем!»"
 theiler.2201.g: "Наша экономика растет!"
 theiler_biologist_improve_agriculture_project_progress_bar: "Улучшение сельского хозяйства"
