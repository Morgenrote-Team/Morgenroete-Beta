 je_theiler_improve_agriculture_project: "Проект по улучшению сельского хозяйства"
 je_theiler_improve_agriculture_project_reason: "Проект ведёт [concept_theiler_biologist|l] — доктор [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName]. Текущий объект: [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] в [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetCustom('RU_SL_PP')]. Цель — повысить его производительность.\n$mr_divider_for_je$\nПроект продвигается каждый месяц. Всякий раз, когда прогресс достигает 24, текущее сооружение получает новый модификатор. Как только все выбранные для проекта сооружения получат модификаторы, проект завершится.\n\nВсего доступно 3 модификатора. Для каждого нового модификатора шкалу прогресса необходимо заполнить заново.\n\nКаждое улучшенное сооружение приносит некоторое количество [Concept('concept_theiler_microorganism', 'микроорганизмов')]. Кроме того, после завершения улучшения сооружения биолог может получить черту «$ito_botanist$» или «$ito_zoologist$».\n$mr_divider_for_je$\nТекущее сооружение: [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] в [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetCustom('RU_SL_PP')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_theiler_improve_agriculture_project_modifier_1_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_theiler_improve_agriculture_project_modifier_2_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_theiler_improve_agriculture_project_modifier_3_type')]\n\nВсего осталось сооружений (не считая текущего): [JournalEntry.MakeScope.Var('mr_number_of_remaining_list_entries_var').GetValue|V0]\n$concept_theiler_microorganisms$ от проекта: [JournalEntry.MakeScope.ScriptValue('theiler_microorganisms_from_agriculture_project_value')|+0] @theiler_microorganisms_texticon!\n\nТекущий ежемесячный прогресс: #underline #tooltip:[GetRawTextTooltipTag('theiler_monthly_biologist_improvement_progress_var_tt')] [GetPlayer.MakeScope.ScriptValue('theiler_improve_agriculture_project_progress_value')|+2] #!#!"
