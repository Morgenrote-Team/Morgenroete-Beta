 curie_mathematics_tech_desc: "Математика — наука о числах, величинах и формах. Она создаёт логическую основу для развития инженерного дела, навигации, физики и сложных систем управления ресурсами, помогая двигаться по пути прогресса."
 je_group_curie_physics: "Morgenröte: [concept_curie_physics]"
 je_curie_formula_discovery: "Математическая формула"
 je_curie_formula_discovery_reason: "[ROOT.Var('curie_physicist_var').GetCharacter.GetFullName] пытается вывести новую математическую формулу. Некоторые черты характера и навыки могут ускорить исследование. Текущая тема работы: [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]."
 je_physicist_dies_tt: "Доктор [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] умирает"
 je_curie_formula_discovery_failed_tt: "Другая страна делает открытие раньше, чем доктор [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName]."
 curie_add_discovered_formula_effect_tt: "[GetPlayer.GetName] дела[GetPlayer.GetAltNameNoFormatting('RU_CL_END_T')] математическое открытие: #V [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]#!."
 je_curie_formula_discovery_progress_complete_tt: "Прогресс достиг #V 60#!."
 curie.201.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]"
 curie.201.d: "Неужели это правда? Или доктор [ROOT.Var('curie_physicist_var').GetCharacter.GetFullName] вновь видит один из тех странных снов, в которых является готовая формула? После бессонных ночей и мучительных поисков теперь можно с гордостью представить результат. Исследование завершено. Его тема: [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]."
 curie.201.f: "«Удивительно, что все, кто всерьёз занимается этой наукой, питают к ней своего рода страсть». — Карл Фридрих Гаусс"
 curie.201.g: "Так кто теперь будет вытирать доску?"
 curie.202.t: "Математическая формула"
 curie.202.d: "Доктор [ROOT.Var('curie_physicist_var').GetCharacter.GetFullName] стремится открыть новую область математики. Тема исследования: [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]."
 curie.202.f: "С начала XIX века основания математических понятий подвергались тщательному пересмотру и получали строгое обоснование. Огюстен Луи Коши сформулировал определение предела с помощью ε и заложил основы теории функций. Сохранялась тесная связь между развитием физики, механики и математического анализа XVIII века. Многие математики одновременно занимались теоретической физикой: в то время эти области ещё не разделяли."
 curie.202.g: "Надеюсь, из этого выйдет что-нибудь полезное...?"
 curie.203.t: "Открытие за рубежом: [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]"
 curie.203.d: "Сегодня из переписки доктор [ROOT.Var('curie_physicist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('curie_physicist_var').GetCharacter.IsFemale, 'узнала', 'узнал')], что зарубежный коллега уже опередил наши исследования! Соперник успел вывести формулу. Тема открытия: [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]."
 curie.203.f: "«Ничто так явно не выдаёт недостаток математического образования, как чрезмерная точность в арифметических вычислениях». — Вильгельм Вебер"
 curie.203.g: "Эта математическая слава должна была достаться нам!"
