 pm_curie_magnetic_observatory: "[Concept('concept_curie_geomagnetism','$concept_curie_geomagnetic_observatory|q$')]"
 je_curie_magnetic_observation: "Геомагнитные наблюдения"
 je_curie_magnetic_observation_reason: "Карл Фридрих Гаусс построил первую геофизическую обсерваторию в Гёттингене и в 1832 году создал для неё чувствительный магнитометр. Он понял, что для определения причин колебаний и более точного измерения постоянного поля необходимо проводить измерения одновременно в разных точках земного шара. С 1836 года основанный для этой цели Магнитный союз и британское Королевское общество предоставляли данные, которые обрабатывали Гаусс и Вильгельм Вебер. Целью были согласованные измерения колебаний магнитного поля Земли на многочисленных станциях по всему миру. В проекте участвовало до 50 обсерваторий: 35 в Европе, шесть в Азии, две в Африке, три в Северной Америке и четыре в Океании. Результаты направлялись в Гёттинген, где Гаусс и Вебер проводили их научную обработку."
 je_curie_magnetic_observation_goal: "Собрать #G 100#! @curie_magnetic_data_var! ед. [Concept('concept_curie_magnetic_data', 'магнитных данных')]. Это международное начинание: свой вклад внесёт каждый участник Магнитного союза."
 je_curie_magnetic_atlas: "Геомагнитный атлас"
 je_curie_magnetic_atlas_reason: "В 1830-х годах Гаусс и Вебер основали Гёттингенский магнитный союз. Они создали всемирную сеть наблюдательных станций, которые одновременно измеряли напряжённость и направление магнитного поля Земли по единым методикам. Гаусс разработал теорию потенциала для описания земного магнитного поля. Этот математический метод позволил ему рассчитать поле для всей поверхности Земли, включая области, где непосредственные измерения не проводились."
 je_curie_magnetic_atlas_progress_complete_tt: "Прогресс достиг #V 24#!."
 curie_set_magnetic_association_effect_tt: "Основать Магнитный союз. Другие страны смогут вступить в него и построить [Concept('concept_curie_geomagnetism', 'геомагнитную обсерваторию')] для сбора @curie_magnetic_data_var! [Concept('concept_curie_magnetic_data', 'магнитных данных')]."
 curie_add_magnetic_association_member_tt: "Вступить в Магнитный союз. Участники будут отправлять @curie_magnetic_data_var! [Concept('concept_curie_magnetic_data', 'магнитные данные')] в город [GetPlayer.GetCustom('curie_magnetic_association_city')] и пользоваться результатами научных исследований."
