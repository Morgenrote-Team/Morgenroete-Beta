 curie.301.t: "Реформа математического и инженерного факультета"
 curie.301.d: "Доктор [SCOPE.sCharacter('curie_physicist_scope').GetLastName] [SelectLocalization(SCOPE.sCharacter('curie_physicist_scope').IsFemale, 'достигла', 'достиг')] своей цели. В ходе визита на математический и инженерный факультет удалось внедрить новые методы исследований и познакомить новое поколение учёных с последними достижениями математики.\n\nВсего улучшено сооружений: [GetPlayer.MakeScope.Var('mr_num_improved_mathematics_buildings_var').GetValue|V0]\n$concept_curie_physical_data$ от проекта: [GetPlayer.MakeScope.ScriptValue('curie_physical_data_from_mathematics_project_for_event_value')|+0] @curie_physical_data!"
 curie.301.f: "«Только что закончился мой семинар „Основы булевой алгебры: 101“, и никто не понял шутки! Что за невежды»."
 curie.301.g: "В мире науки веет свежий ветер!"
 je_curie_physics_experiment: "Физический эксперимент"
 je_curie_physics_experiment_reason: "Доктор [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] работает над физическим экспериментом. Его успех или неудача во многом зависят от личных [Concept('concept_character_trait', 'черт характера')] учёного. Успешный эксперимент может оказаться обычным либо исторически значимым. Последнее возможно, если никто из учёных ещё не проводил такого опыта и выполнены необходимые условия, обычно связанные с определённой технологией. Каждый физик может провести лишь один исторически значимый эксперимент за всю жизнь."
