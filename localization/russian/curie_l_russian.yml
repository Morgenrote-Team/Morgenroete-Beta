 je_curie_magnetic_station: "Построить геомагнитную обсерваторию"
 je_curie_magnetic_station_reason: "С помощью приборов и инструкций, предоставленных научным центром в городе [GetPlayer.GetCustom('curie_magnetic_association_city')], наш физик создаст геомагнитную обсерваторию в течение следующих двух лет. Это международное начинание: чем больше данных из разных стран получает научный центр в городе [GetPlayer.GetCustom('curie_magnetic_association_city')], тем быстрее местные учёные смогут расширить знания о магнитном поле Земли."
