 curie_differential_geometry_tech: "Дифференциальная геометрия"
 curie_differential_geometry_tech_desc: "Дифференциальная геометрия, начало которой в XIX веке положил Гаусс, использует сложную математику для описания поведения кривых и поверхностей в реальном мире. Изначально она развивалась для создания более точных карт и измерения Земли, позволив учёным вычислять формы и расстояния по формулам, а не только оценивать их на глаз."
