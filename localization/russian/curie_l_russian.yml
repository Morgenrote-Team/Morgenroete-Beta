 je_curie_improve_meteorology_project: "Сеть метеостанций"
 je_curie_improve_meteorology_project_reason: "Наш [concept_curie_physicist], доктор [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName], занимается созданием метеостанции. Текущий объект: [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] в [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetCustom('RU_SL_PP')].\n$mr_divider_for_je$\nПроект продвигается каждый месяц. При достижении 24 очков прогресса текущее сооружение получает новый модификатор. Когда все выбранные сооружения получают все модификаторы, проект завершается.\nВсего предусмотрено 3 модификатора. Для каждого следующего модификатора шкалу прогресса необходимо заполнить заново.\n$mr_divider_for_je$\nТекущее сооружение: [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] в [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetCustom('RU_SL_PP')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_meteorology_project_modifier_1_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_meteorology_project_modifier_2_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_meteorology_project_modifier_3_type')]\n\nОсталось сооружений, не считая текущего: [JournalEntry.MakeScope.Var('mr_number_of_remaining_list_entries_var').GetValue|V0]"
