 curie_mathematical_physicist_desc: "Выдающиеся математические открытия этого персонажа снискали ему большое общественное уважение."
 curie_meteorological_physicist: "Метеоролог"
 curie_meteorological_physicist_desc: "Метеорологи — учёные, которые наблюдают за погодой и пытаются предсказать её изменения."
 curie_rocket_physicist: "Физик-ракетчик"
 curie_rocket_physicist_desc: "Учёные-ракетчики известны своей чрезвычайно незамысловатой областью исследований: они занимаются теорией, проектированием и созданием новых типов ракет."
 curie_nuclear_physicist: "Физик-ядерщик"
 curie_nuclear_physicist_desc: "Таких физиков ни в коем случае нельзя выпускать к людям: их следует держать взаперти в лаборатории с соблюдением строжайших мер безопасности."
