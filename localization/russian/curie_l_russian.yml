 je_curie_mathematical_innovation_reason: "[ROOT.GetCountry.GetCustom('je_curie_mathematical_innovation_active_type')][concept_curie_mathematical_physicist], не занятый другими делами, способствует развитию математических инноваций в стране. Математические инновации складываются из международной и национальной составляющих. Международная составляющая рассчитывается по общему числу открытых математических формул, а национальная — по числу формул, открытых самой страной.\n\nМатематические инновации увеличивают предел инноваций и уменьшают штраф за исследование технологий, опережающих своё время. После открытия новой формулы модификатор математических инноваций увеличивается в конце года."
