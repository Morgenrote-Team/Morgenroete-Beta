 je_curie_improve_mathematics_project: "Развитие математики"
 je_curie_improve_mathematics_project_reason: "Наш [concept_curie_physicist], доктор [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName], занимается повышением эффективности производства. Текущий объект: [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] в [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetCustom('RU_SL_PP')].\n$mr_divider_for_je$\nПроект продвигается каждый месяц. При достижении 24 очков прогресса текущее сооружение получает новый модификатор. Когда все выбранные сооружения получают все модификаторы, проект завершается.\nВсего предусмотрено 3 модификатора. Для каждого следующего модификатора шкалу прогресса необходимо заполнить заново.\nКогда сооружение типа «[GetBuildingType('building_university').GetName]» получает все модификаторы, вы также получаете #p 1#! @curie_physical_data! ед. [Concept('concept_curie_physical_data', 'физических данных')].\n$mr_divider_for_je$\nТекущее сооружение: [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] в [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetCustom('RU_SL_PP')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_mathematics_project_modifier_1_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_mathematics_project_modifier_2_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_mathematics_project_modifier_3_type')]\n\nОсталось сооружений, не считая текущего: [JournalEntry.MakeScope.Var('mr_number_of_remaining_list_entries_var').GetValue|V0]\n$concept_curie_physical_data$ от проекта: [JournalEntry.MakeScope.ScriptValue('curie_physical_data_from_mathematics_project_value')|+0] @curie_physical_data!"
