 curie.521.d: "Доктор [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] не верит своим глазам: во время прогулки в городе [SCOPE.sState('curie_cloud_state').GetCityHubName] в небе вдруг появляются серебряные нити. Неужели это совершенно неизвестный прежде тип облаков?"
 curie.522.d: "Во время полярной экспедиции экипаж дирижабля сделал необычайное открытие: в небе внезапно появились радужные облака! Казалось, будто в вышине висит перламутр!"
