 curie.503.t: "Общенациональная сеть метеостанций"
 curie.503.d: "Доктор [SCOPE.sCharacter('curie_physicist_scope').GetLastName] [SelectLocalization(SCOPE.sCharacter('curie_physicist_scope').IsFemale, 'достигла', 'достиг')] своей цели. Благодаря общенациональной сети метеостанций теперь можно заранее принимать меры на случай опасных погодных явлений — как для защиты от бедствий, так и в сельском хозяйстве.\n\nВсего улучшено сооружений: [GetPlayer.MakeScope.Var('mr_num_improved_meteorology_buildings_var').GetValue|V0]"
 curie.503.f: "«Семь дней солнечного июня — и вот уже распустились\nЦветы на летнем платье, что носила ты весной.\nМы смеялись вместе, но вдруг ты огорошила меня:\nМы слишком давно знакомы, чтобы быть с тобой»."
 curie.503.g: "Будет ли завтра светить солнце?"
