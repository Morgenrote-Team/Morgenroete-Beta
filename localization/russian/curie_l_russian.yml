 curie_geomagnetical_knowledge_modifier: "Знания о геомагнетизме"
 curie_mathematical_innovation_modifier: "Математические инновации"
 curie.100.t: "Магнитный союз"
 curie.100.d: "Сегодня доктор [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetLastName] [SelectLocalization(GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.IsFemale, 'ввела', 'ввёл')] в действие геомагнитную обсерваторию. Она станет центром недавно основанного Магнитного союза и образцом для подобных станций по всему миру. Троекратное «ура» науке!"
 curie.100.f: "Магнитный союз (Magnetischer Verein) стал первым международным научным объединением. Его основали Карл Фридрих Гаусс и Вильгельм Вебер в Гёттингене в 1834 году. Союз координировал одновременные измерения магнитного поля Земли в сети обсерваторий по всему миру."
 curie.101.t: "Новый участник Магнитного союза"
 curie.101.d: "Сегодня [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetFullName] [SelectLocalization(GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.IsFemale, 'вступила', 'вступил')] в Магнитный союз в городе [GetPlayer.GetCustom('curie_magnetic_association_city')]. Остальные участники устроили тёплый приём."
 curie.101.f: "После вступления в союз доктор [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetLastName] [SelectLocalization(GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.IsFemale, 'получила', 'получил')] знания, необходимые для создания действующей геомагнитной обсерватории. Председатель передал нашему физику чертежи станции и магнитометр. Все участники союза настаивали на скорейшем начале строительства и отправке первых данных в город [GetPlayer.GetCustom('curie_magnetic_association_city')]."
 curie.101.g: "Нужно немедленно построить измерительную станцию."
 curie.102.t: "Геомагнитная обсерватория построена"
 curie.102.d: "Сегодня завершилось строительство геомагнитной обсерватории. За последние месяцы было собрано множество данных, которые уже отправлены в город [GetPlayer.GetCustom('curie_magnetic_association_city')]."
 curie.102.f: "Полученные измерения служат не только научному исследованию магнитного поля Земли, но и практическим целям. Карты магнитного склонения использовались и продолжают использоваться для навигации в мореплавании и авиации. Геомагнитные измерения важны и для поиска сырья, в частности рудных и нефтяных месторождений."
 curie.102.g: "За науку о земном магнетизме!"
 curie.103.t: "Международный сбор магнитных данных"
 curie.103.d: "После многих лет сбора и сопоставления геомагнитных данных со всего мира учёные в городе [GetPlayer.GetCustom('curie_magnetic_association_city')] пришли к интересным результатам."
 curie.103.f: "Геофизика и геомагнетизм находят множество практических применений. Особенно полезным для горного дела стало выявление возможных месторождений. Крупные компании использовали геофизические знания, чтобы находить ранее неизвестные залежи железа, свинца и нефти. При наличии нужных технологий и карт магнитного поля Земли нынешним теоретическим знаниям будет нетрудно найти выгодное применение."
 curie.103.g: "Нам нужно больше научных данных."
 curie.103.h: "Это поможет искать месторождения железа."
 curie.103.i: "Это поможет искать месторождения свинца."
 curie.103.j: "Это поможет искать месторождения меди."
 curie.103.k: "Это поможет искать месторождения нефти."
 curie.104.t: "Интерес флота"
 curie.104.d: "[SCOPE.sCharacter('curie_admiral_scope').GetFullName] проявляет большой интерес к геомагнитным исследованиям. Их ведёт [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetFullName]. В ещё строящейся геомагнитной обсерватории уже удалось провести успешный эксперимент."
 curie.104.f: "«Что я собираюсь делать с лягушачьими лапками? Да ничего особенного, совершенно ничего...»"
 curie.104.g: "Новые знания пригодятся адмиралу."
 curie.104.h: "Эти знания должны послужить всем."
 curie.105.t: "Аномалия"
 curie.105.d: "Доктор [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetLastName] вновь проводит измерения, однако полученные значения магнитного поля Земли почти не соответствуют ожидаемым. Причину расхождения пока установить не удалось."
 curie.105.f: "Магнитное поле Земли может отличаться в разных местах по многим причинам. Подобные отклонения часто наводили на мысль, что поблизости находится крупное месторождение металлических руд. Именно поэтому геомагнитные исследования представляли интерес и для горного дела."
 curie.105.g: "Следует отправить данные прямо в город [GetPlayer.GetCustom('curie_magnetic_association_city')]."
 curie.106.t: "Астроном посещает геомагнитную обсерваторию"
 curie.106.d: "Доктор [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetFullName] и доктор [GetPlayer.MakeScope.GetVariable('verrier_astronomer_var').GetCharacter.GetFullName] оживлённо беседовали во время осмотра новой геомагнитной обсерватории. Благодаря этому обмену мнениями [GetPlayer.MakeScope.GetVariable('verrier_astronomer_var').GetCharacter.GetLastName] значительно [SelectLocalization(GetPlayer.MakeScope.GetVariable('verrier_astronomer_var').GetCharacter.IsFemale, 'расширила', 'расширил')] свои научные познания."
 curie.106.f: "«Так ВОТ почему хлеб с вареньем всегда падает вареньем вниз!»"
 curie.106.g: "Это поможет в практических исследованиях."
 curie.106.h: "Это поможет в теоретических исследованиях."
 curie.107.t: "Геомагнитный атлас"
 curie.107.d: "Доктор [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetFullName] [SelectLocalization(GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.IsFemale, 'опубликовала', 'опубликовал')] первый геомагнитный атлас Земли. Этой книге суждено стать общепринятым научным справочником по физике!"
 curie.107.f: "Геомагнитный атлас XIX века, обычно известный под названием «Атлас земного магнетизма», стал новаторским трудом в области геофизики и картографии. Он вышел в Лейпциге в 1840 году под редакцией математика Карла Фридриха Гаусса и физика Вильгельма Вебера. Впервые результаты измерений магнитного поля со всего мира были сведены воедино на строгой математической основе и наглядно представлены на картах. Атлас включал 18 подробных карт и схем Земли и показал, что основной источник земного магнитного поля находится в недрах планеты."
 curie.107.g: "Эти знания следует применить в теории."
 curie.107.h: "Эти знания следует применить на практике."
