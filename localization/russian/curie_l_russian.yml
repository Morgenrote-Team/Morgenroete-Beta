 curie_physics_experiment_failure_modifier: "Физический эксперимент: неудача"
 curie_physics_experiment_successful_modifier: "Физический эксперимент: успех!"
 curie.401.t: "Физический эксперимент"
 curie.401.d: "Доктор [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] приступает к новому этапу эксперимента. Пока неясно, какой подход будет выбран: осторожный или революционный."
 curie.401.f: "После некоторого времени работы над физическим экспериментом учёный стремится как можно скорее довести его до конца. Удаётся ли это — совсем другой вопрос. У физиков с чертами #G «$cautious$»#! и #G «$meticulous$»#! особенно хорошие шансы на успех. Обладатели черт #R «$wrathful$»#!, #R «$reckless$»#! и #R «$senile$»#! особенно рискуют закончить исследования катастрофой."
 curie.401.g: "Осторожный подход."
 curie.401.h: "Революционный подход."
 curie.402.t: "Эксперимент исторического значения"
 curie.402.d_1: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] [SelectLocalization(SCOPE.sCharacter('curie_physicist_scope').IsFemale, 'направила', 'направил')] свет через две узкие щели на экран. Возникшая интерференционная картина из светлых и тёмных полос показала, что свет ведёт себя как волна, и опровергла господствовавшую корпускулярную теорию Исаака Ньютона."
 curie.402.d_2: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] [SelectLocalization(SCOPE.sCharacter('curie_physicist_scope').IsFemale, 'поместила', 'поместил')] провод с током над магнитным компасом. Отклонение стрелки показало, что электрический ток создаёт магнитное поле, и связало электричество и магнетизм в единую область исследований — электромагнетизм."
 curie.402.d_3: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] [SelectLocalization(SCOPE.sCharacter('curie_physicist_scope').IsFemale, 'использовала', 'использовал')] падающие грузы для вращения лопастей в теплоизолированном сосуде с водой. Повышение температуры показало, что механическая работа превращается в тепло, подтвердив закон сохранения энергии."
 curie.402.d_4: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] [SelectLocalization(SCOPE.sCharacter('curie_physicist_scope').IsFemale, 'проверила', 'проверил')] теорию Доплера с помощью трубачей на движущемся поезде. Изменение высоты звука при прохождении поезда подтвердило эффект Доплера: движение источника меняет воспринимаемую частоту звуковой волны."
 curie.402.d_5: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] [SelectLocalization(SCOPE.sCharacter('curie_physicist_scope').IsFemale, 'подвесила', 'подвесил')] тяжёлый маятник на длинной проволоке. Постепенный поворот плоскости его колебаний относительно пола наглядно подтвердил вращение Земли вокруг оси без наблюдений за небесными телами."
 curie.402.d_6: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] [SelectLocalization(SCOPE.sCharacter('curie_physicist_scope').IsFemale, 'направила', 'направил')] свет через вращающееся зубчатое колесо на далёкое зеркало. Перекрытие обратного луча при известной скорости вращения позволило впервые измерить скорость света в наземном опыте."
 curie.402.d_7: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] [SelectLocalization(SCOPE.sCharacter('curie_physicist_scope').IsFemale, 'измерила', 'измерил')] электрический заряд с помощью лейденской банки и гальванометра. Отношение электростатической и электромагнитной единиц заряда дало величину, близкую к скорости света, указав на электромагнитную природу света."
 curie.402.d_8: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] [SelectLocalization(SCOPE.sCharacter('curie_physicist_scope').IsFemale, 'разделила', 'разделил')] световой луч на два взаимно перпендикулярных пучка с помощью чувствительного интерферометра. Ожидаемого смещения интерференционных полос не обнаружилось, что опровергло представление о неподвижном светоносном эфире и подготовило почву для специальной теории относительности."
 curie.402.d_9: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] [SelectLocalization(SCOPE.sCharacter('curie_physicist_scope').IsFemale, 'использовала', 'использовал')] электрические цепи с искровыми разрядниками для создания и обнаружения невидимых радиоволн. Совпадение их скорости и волновых свойств со свойствами света подтвердило электромагнитную теорию Максвелла и положило начало беспроводной связи."
 curie.402.d_10: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] [SelectLocalization(SCOPE.sCharacter('curie_physicist_scope').IsFemale, 'отклонила', 'отклонил')] катодные лучи электрическим и магнитным полями в вакуумной трубке. Измерение отношения заряда к массе выявило отрицательно заряженные субатомные частицы — электроны — и опровергло представление о неделимости атома."
 curie.402.d_11: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] [SelectLocalization(SCOPE.sCharacter('curie_physicist_scope').IsFemale, 'удерживала', 'удерживал')] электрически заряженные капли масла между двумя металлическими пластинами. Уравновешивание силы тяжести электрической силой показало, что заряд принимает значения, кратные определённой величине, и позволило точно измерить заряд электрона."
 curie.402.d_12: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] [SelectLocalization(SCOPE.sCharacter('curie_physicist_scope').IsFemale, 'направила', 'направил')] альфа-частицы на тонкую золотую фольгу. Неожиданные отклонения на большие углы показали, что масса и положительный заряд атома сосредоточены в крошечном центральном ядре, опровергнув модель равномерного распределения заряда."
 curie.402.d_13: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] [SelectLocalization(SCOPE.sCharacter('curie_physicist_scope').IsFemale, 'пропустила', 'пропустил')] ускоренные электроны через пары ртути. Периодические падения тока при определённых напряжениях показали, что атомы поглощают энергию отдельными квантами, подтвердив модель Бора с дискретными уровнями энергии."
 curie.402.d_14: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] [SelectLocalization(SCOPE.sCharacter('curie_physicist_scope').IsFemale, 'сфотографировала', 'сфотографировал')] звёзды вблизи Солнца во время полного затмения. Наблюдаемое искривление звёздного света под действием тяготения стало первым экспериментальным подтверждением общей теории относительности."
 curie.402.d_15: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] [SelectLocalization(SCOPE.sCharacter('curie_physicist_scope').IsFemale, 'направила', 'направил')] атомы серебра через неоднородное магнитное поле. Пучок разделился на две отчётливые части вместо непрерывного распределения. Это продемонстрировало пространственное квантование и послужило ранним свидетельством существования собственного квантового момента — спина."
 curie.402.f_1: "В 1801 году Томас Юнг провёл опыт с двумя щелями, чтобы выяснить физическую природу света. Он направил один световой пучок через две близко расположенные узкие щели на тёмный экран. Вместо двух отдельных светлых линий возникла череда светлых и тёмных полос: световые волны накладывались друг на друга. Эта интерференционная картина показала, что лучи света способны усиливать или гасить друг друга, подобно волнам на воде. Результат убедительно подтвердил волновую теорию света и поставил под сомнение общепринятую корпускулярную модель Исаака Ньютона."
 curie.402.f_2: "В 1820 году датский физик Ханс Кристиан Эрстед обнаружил фундаментальную связь между электричеством и магнетизмом. Во время демонстрации на лекции он пропустил ток от батареи через прямой провод, расположенный непосредственно над стрелкой магнитного компаса. При каждом замыкании цепи стрелка отклонялась от направления на север, поворачиваясь поперёк провода. При смене направления тока она отклонялась в противоположную сторону. Неожиданный результат показал, что электрические токи создают магнитные поля, объединив две прежде обособленные области физики в учение об электромагнетизме."
 curie.402.f_3: "В 1843 году Джеймс Прескотт Джоуль измерил превращение механической работы в тепловую энергию с помощью специальной установки с лопастным колесом. Падающие грузы вращали латунные лопасти, погружённые в теплоизолированный сосуд с водой. Сила тяжести совершала измеримую механическую работу, а трение между лопастями и жидкостью вызывало точно измеряемое повышение температуры. Сопоставив уменьшение потенциальной энергии грузов с количеством полученного жидкостью тепла, Джоуль вычислил постоянное отношение этих величин. Опыт показал, что тепло представляет собой форму энергии, и способствовал установлению закона сохранения энергии."
 curie.402.f_4: "В 1845 году нидерландский метеоролог Христофор Бёйс-Баллот поставил опыт для проверки теории изменения частоты волн, предложенной Кристианом Доплером в 1842 году. Он разместил трубачей в открытом железнодорожном вагоне, а музыканты на земле задавали постоянный эталонный тон. Когда локомотив проходил мимо с разной скоростью, трубачи непрерывно играли одну ноту. Слушатели на платформе отчётливо слышали более высокий звук при приближении поезда и более низкий — при его удалении. Опыт подтвердил эффект Доплера для звуковых волн; позднее этот эффект стал важнейшим средством измерения движения звёзд."
 curie.402.f_5: "В 1851 году французский физик Леон Фуко продемонстрировал вращение Земли с помощью массивного маятника в парижском Пантеоне. Он подвесил латунный шар массой 28 килограммов на стальной проволоке длиной 67 метров, позволив ему часами свободно колебаться в любой вертикальной плоскости. Плоскость колебаний постепенно поворачивалась по часовой стрелке относительно пола. Маятник стремился сохранять направление колебаний в пространстве, тогда как Земля под ним вращалась. Это стало первым простым наземным доказательством вращения Земли вокруг своей оси."
 curie.402.f_6: "В 1849 году Ипполит Физо впервые успешно измерил скорость света в наземном опыте. Он направил яркий пучок света между зубьями быстро вращающегося колеса на зеркало, расположенное в 8,6 километра. Отражённый свет возвращался тем же путём. Увеличивая скорость вращения до тех пор, пока соседний зуб полностью не перекрывал возвращающийся луч, Физо определил время прохождения известного расстояния. Полученная скорость — около 315 000 километров в секунду — показала, что скорость света можно измерять на Земле без астрономических данных."
 curie.402.f_7: "В 1856 году Вильгельм Вебер и Рудольф Кольрауш измерили отношение электростатической и электромагнитной единиц электрического заряда. С помощью лейденской банки большой ёмкости они определили абсолютную величину накопленного статического заряда. Затем банку разрядили через баллистический гальванометр, чтобы измерить магнитное действие протекающего тока. Неожиданно отношение единиц оказалось равным скорости около 310 000 километров в секунду. Эта величина, почти совпавшая со скоростью света, стала экспериментальной основой теории Джеймса Клерка Максвелла об электромагнитной природе света."
 curie.402.f_8: "В 1887 году Альберт Майкельсон и Эдвард Морли попытались обнаружить движение Земли через гипотетический светоносный эфир. Они построили чувствительный оптический интерферометр на тяжёлой каменной плите, плававшей в ртути для изоляции от вибраций. Светоделитель направлял луч по двум взаимно перпендикулярным путям; после отражения от зеркал пучки вновь соединялись на экране. По гипотезе неподвижного эфира орбитальное движение Земли должно было вызывать разницу в скорости распространения света по двум направлениям и смещение интерференционных полос при повороте установки. Ожидаемого смещения не обнаружили. Результат поставил под сомнение существование неподвижного эфира и согласовался с постоянством скорости света."
 curie.402.f_9: "В 1887 году Генрих Герц построил электрический искровой передатчик для проверки теории электромагнетизма Джеймса Клерка Максвелла. Высоковольтные искры в первичном разряднике порождали невидимое электромагнитное излучение, которое проходило через комнату и вызывало крошечные искры в приёмнике — проволочном кольце с разрывом. Герц показал, что эти волны распространяются со скоростью света и, подобно свету, отражаются, преломляются и поляризуются. Опыт убедительно доказал существование радиоволн, подтвердил единую теорию электромагнитного поля Максвелла и заложил основы современной беспроводной связи."
 curie.402.f_10: "В 1897 году Джозеф Джон Томсон исследовал катодные лучи в стеклянной трубке с высоким вакуумом. Воздействуя на пучок электрическим и магнитным полями, он наблюдал его отклонение и измерял отношение заряда движущихся частиц к их массе. Томсон обнаружил, что лучи состоят из отрицательно заряженных частиц, более чем в 1000 раз легче атома водорода, независимо от материала катода. Это показало, что атомы — не неделимые шарики, а составные структуры. Электрон стал первой обнаруженной субатомной частицей, что коренным образом изменило атомную физику."
 curie.402.f_11: "В 1909 году Роберт Милликен измерил заряд отдельного электрона с помощью герметичной камеры с электрическими пластинами. Он распылял в ней мелкие капли масла и ионизировал их рентгеновским излучением. Меняя напряжение электрического поля, Милликен уравновешивал направленную вверх электростатическую силу силой тяжести и удерживал отдельные заряженные капли неподвижно в воздухе. Анализ сотен капель показал, что любой измеренный заряд кратен одной фундаментальной единице. Опыт доказал квантование заряда и позволил точно определить величину элементарного заряда."
 curie.402.f_12: "В 1911 году Эрнест Резерфорд исследовал рассеяние положительно заряженных альфа-частиц на тонкой золотой фольге, окружённой регистрирующим экраном из сульфида цинка. Большинство частиц проходило прямо, но небольшая доля отклонялась на большие углы, а примерно одна из 8000 отскакивала назад. Этот неожиданный результат опроверг модель Томсона — «пудинг с изюмом», в которой положительный заряд распределён равномерно. Резерфорд заключил, что почти вся масса и положительный заряд атома сосредоточены в крошечной плотной сердцевине — ядре. Вокруг него находится преимущественно пустое пространство, в котором движутся электроны."
 curie.402.f_13: "В 1914 году Джеймс Франк и Густав Герц получили прямое подтверждение квантовой модели атома Нильса Бора. Они ускоряли электроны в стеклянной трубке с парами ртути по направлению к приёмной сетке. При увеличении ускоряющего напряжения электронный ток возрастал, но резко падал через равные промежутки в 4,9 вольта. Это показало, что при столкновениях с атомами ртути электроны теряют энергию лишь определёнными порциями. Периодические падения тока подтвердили, что атомы поглощают энергию дискретными квантами, и стали первым ясным доказательством существования квантованных атомных уровней энергии."
 curie.402.f_14: "Во время полного солнечного затмения в мае 1919 года экспедиции под руководством Артура Эддингтона отправились на остров Принсипи и в Бразилию для проверки общей теории относительности Альберта Эйнштейна. Когда Луна закрыла яркий солнечный диск, астрономы сфотографировали звёзды возле его края. Сравнение с эталонными ночными снимками показало небольшое смещение видимых положений звёзд наружу из-за отклонения света в поле тяготения Солнца. Измеренное искривление соответствовало предсказаниям Эйнштейна, а не ньютоновской физики, и стало первым наблюдательным подтверждением общей теории относительности."
 curie.402.f_15: "В 1922 году Отто Штерн и Вальтер Герлах направили пучок атомов испарённого серебра через неоднородное магнитное поле на стеклянную пластинку. Классическая физика предсказывала, что магнитные диполи атомов будут ориентированы случайным образом и дадут плавное непрерывное распределение осадка серебра. Однако пучок отчётливо разделился на две части, образовав на пластинке две отдельные полосы. Неожиданное расщепление продемонстрировало пространственное квантование и стало ранним свидетельством собственного момента импульса, позднее объяснённого спином электрона. Этот результат существенно повлиял на развитие квантовой механики."
 curie.402.g: "Эврика!"
 curie.403.t: "Успешный эксперимент"
 curie.403.d: "Доктор [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] сегодня с большим удовлетворением сообщает, что эксперимент прошёл точно по плану. Это открытие не перевернёт мир, но всё же значительно обогатит мировую физическую науку."
 curie.403.f: "«Ничто не бывает слишком чудесным, чтобы быть правдой, если оно согласуется с законами природы». — Майкл Фарадей"
 curie.403.g: "Хорошо."
 curie.404.t: "Физический эксперимент провалился!"
 curie.404.d: "Доктор [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] завершает эксперимент сокрушительной неудачей. Теперь пора убирать осколки."
 curie.404.f: "«Полное осознание своего незнания — прелюдия к любому настоящему научному прогрессу». — Джеймс Клерк Максвелл"
 curie.404.g: "Бум!"
