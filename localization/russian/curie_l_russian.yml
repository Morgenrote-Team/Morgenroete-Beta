 je_curie_agricultural_weather_service: "Агрометеорологическая служба"
 je_curie_agricultural_weather_service_reason: "Доктор [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] полностью посвящает себя сельскохозяйственной метеорологии. Прогнозы сосредоточены на явлениях, особенно важных для земледельцев страны. Будь то засухи, бури или наводнения, заблаговременные предупреждения позволяют сельскому хозяйству подготовиться и смягчить последствия погодных и климатических явлений.\n\nСила [Concept('concept_modifier', 'модификатора')] во многом зависит от опыта [Concept('concept_curie_meteorological_physicist', '#b #ORANGE метеоролога#!#!')]."
 je_curie_marine_weather_service: "Морской прогноз погоды"
 je_curie_marine_weather_service_reason: "Доктор [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] [SelectLocalization(ROOT.Var('curie_physicist_var').GetCharacter.IsFemale, 'обязалась', 'обязался')] перед Морским министерством повысить безопасность судоходства — прежде всего военного флота — и предсказывать возможные бури и другие опасности на море. Это будет особенно полезно в военное время.\n\nСила [Concept('concept_modifier', 'модификатора')] во многом зависит от опыта [Concept('concept_curie_meteorological_physicist', '#b #ORANGE метеоролога#!#!')]."
 curie.501.t: "Прогнозирование погоды завершено"
 curie.501.d: "Последние несколько лет доктор [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] по поручению государства в основном [SelectLocalization(ROOT.Var('curie_physicist_var').GetCharacter.IsFemale, 'составляла', 'составлял')] прогнозы погоды для широкой публики. Теперь пора вернуться в мир науки: постоянное внимание общественности уже начинало тяготить."
 curie.501.f: "Наш метеоролог вскоре вернётся к привычной жизни: снова найдётся время для совершенно непонятных приборов и абсолютно бессмысленных исследований. Кто вообще воспринимает эту науку всерьёз?"
 curie.501.a: "Повелитель погоды!"
 curie.501.b: "Повелительница погоды!"
 curie_weather_station_expansion_cost_modifier: "Расходы на расширение метеостанции"
 je_curie_weather_station_expansion: "Расширение метеостанции"
 je_curie_weather_station_expansion_reason: "Доктор [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] неустанно трудится в обсерватории, чтобы оснастить её метеостанцию по последнему слову науки. Состояние национальной метеостанции имеет огромное значение для прогнозирования погодных явлений по всей стране."
 je_curie_weather_station_expansion_progress_complete_tt: "Прогресс достиг #V 36#!."
 curie_weather_station_expansion_progress_bar: "Расширение метеостанции"
 curie_weather_station_expansion_progress_bar_desc: "Прогресс расширения метеостанции: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|1%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/36)"
 curie.502.t: "Метеостанция расширена"
 curie.502.d: "Доктор [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] с гордостью объявляет, что новая метеостанция при обсерватории готова. Теперь это центр всей метеорологической системы страны, который повысит точность предупреждений об опасной погоде!"
 curie.502.f: "Первые сети наблюдений по единым правилам появились в XVII–XVIII веках. Изобретение электрического телеграфа совершило переворот в наблюдениях: стало возможно оперативно собирать данные с обширных территорий. Позднее правительства создали специальные национальные учреждения, в том числе британское Метеорологическое управление в 1854 году и Бюро погоды США в 1870 году."
 curie.502.g: "Какая погода будет завтра?"
 curie.511.g: "[SelectLocalization(ROOT.Var('curie_physicist_var').GetCharacter.IsFemale, 'Она — настоящая ловительница', 'Он — настоящий ловец')] облаков!"
 curie.521.g: "Такие великолепные облака я вижу лишь во второй раз!"
 curie.511.d: "В ясную погоду доктор [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] [SelectLocalization(ROOT.Var('curie_physicist_var').GetCharacter.IsFemale, 'смогла', 'смог')] внимательно наблюдать и изучить #V перистые облака#! и сделать новые метеорологические выводы. [GetPlayer.GetName] впервые располага[GetPlayer.GetAltNameNoFormatting('RU_CL_END_T')] описанием этого типа облаков!"
