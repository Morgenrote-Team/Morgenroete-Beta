 curie.13.t: "Оутокумпу"
 curie.13.d: "Доктор [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] и новейшие технологии помогли нам обнаружить ранее неизвестную медную жилу в Оутокумпу. Возможно, это крупнейшее месторождение в Северо-Восточной Европе!"
 curie.13.f: "После открытия богатого рудного месторождения в 1910 году и строительства полного комплекса промышленных предприятий — плавильных и рафинировочных заводов — Оутокумпу вошёл в пятёрку крупнейших производителей меди в Европе в 1930-х годах и заложил основы современной финской металлургии."
 curie.13.g: "Оутокумпу станет центром производства меди!"
 je_curie_meteorological_observation: "Метеорологические наблюдения"
 je_curie_meteorological_observation_reason: "[ROOT.GetCountry.GetCustom('je_curie_meteorological_observation_active_type')][concept_curie_meteorological_physicist] полностью посвящает себя метеорологическим исследованиям: наблюдает за погодой и температурой, изучает и описывает облака, ведёт климатические записи.\n\nМетеорологические наблюдения непосредственно влияют на объём собираемых данных. Решающее значение имеет опыт метеоролога; хорошо оснащённая метеостанция даёт дополнительные очки.\nМетеоролог может собирать от #R 1#! до #G 10#! @curie_physical_data! ед. [Concept('concept_curie_physical_data', 'физических данных')] в год.\n\n$mr_divider_for_je$\nОжидаемый объём данных, который соберёт наш метеоролог: [GetPlayer.MakeScope.ScriptValue('curie_meteorological_observation_yearly_physical_data_value')|+=0] @curie_physical_data! ед. [Concept('concept_curie_physical_data', 'физических данных')]."
