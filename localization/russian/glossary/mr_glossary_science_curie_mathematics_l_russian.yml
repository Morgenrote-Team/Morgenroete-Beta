l_russian:
 glossary_curie_complex_analysis: "Комплексный анализ"
 glossary_curie_complex_analysis_desc: "#b;italic $glossary_curie_complex_analysis$#! — раздел математики, изучающий функции комплексного переменного. Комплексные числа имеют действительную и мнимую части. Этот раздел широко применяется в физике и технике для исследования волн, течения жидкостей и электрических цепей."
 glossary_curie_differential_equation: "Дифференциальное уравнение"
 glossary_curie_differential_equation_desc: "#b;italic $glossary_curie_differential_equation$#! — уравнение, связывающее неизвестную функцию с её производными. Такие уравнения описывают изменение физических величин во времени или пространстве и необходимы для моделирования движения планет, роста популяций, климатических процессов и переноса тепла."
 glossary_curie_fourier_analysis: "Анализ Фурье"
 glossary_curie_fourier_analysis_desc: "#b;italic $glossary_curie_fourier_analysis$#! — метод разложения сложных сигналов, волн или функций на простые синусоидальные составляющие. Он лежит в основе современной обработки сигналов, сжатия изображений, потоковой передачи звука и телекоммуникаций."
 glossary_curie_non_euclidean_geometry: "Неевклидова геометрия"
 glossary_curie_non_euclidean_geometry_desc: "#b;italic $glossary_curie_non_euclidean_geometry$#! — геометрия, в которой аксиома о параллельных отличается от евклидовой. Сферическая геометрия описывает искривлённую поверхность планет, а развитие неевклидовых геометрий заложило основы геометрического описания пространства-времени в общей теории относительности."
 glossary_curie_group_theory: "Теория групп"
 glossary_curie_group_theory_desc: "#b;italic $glossary_curie_group_theory$#! — раздел математики, изучающий алгебраические структуры, описывающие симметрии и преобразования. Она даёт строгий математический язык для исследования симметрий геометрических фигур, молекул и субатомных частиц, а также применяется в криптографических алгоритмах."
 glossary_curie_linear_algebra: "Линейная алгебра"
 glossary_curie_linear_algebra_desc: "#b;italic $glossary_curie_linear_algebra$#! — раздел математики, изучающий векторные пространства, векторы и матрицы. Она служит математической основой трёхмерной компьютерной графики, алгоритмов машинного обучения, квантовой механики и анализа больших объёмов данных."
 glossary_curie_abstract_algebra: "Абстрактная алгебра"
 glossary_curie_abstract_algebra_desc: "#b;italic $glossary_curie_abstract_algebra$#! — раздел математики, изучающий общие алгебраические структуры — группы, кольца и поля. Исследуя их свойства и симметрии, она создаёт основу для современной криптографии, теории кодирования и теоретической физики."
 glossary_curie_navier_stokes_equations: "Уравнения Навье — Стокса"
 glossary_curie_navier_stokes_equations_desc: "#b;italic $glossary_curie_navier_stokes_equations$#! — система дифференциальных уравнений в частных производных, описывающая движение вязких жидкостей и газов. Эти уравнения необходимы для прогнозирования погоды и океанических течений, аэродинамических расчётов и моделирования потоков в трубопроводах."
 glossary_curie_mathematical_logic: "Математическая логика"
 glossary_curie_mathematical_logic_desc: "#b;italic $glossary_curie_mathematical_logic$#! — раздел математики, изучающий формальные методы рассуждения. Она исследует системы доказательств, понятие истинности и пределы вычислимости, создавая теоретическую основу для разработки программного обеспечения и искусственного интеллекта."
 glossary_curie_analytical_number_theory: "Аналитическая теория чисел"
 glossary_curie_analytical_number_theory_desc: "#b;italic $glossary_curie_analytical_number_theory$#! — раздел математики, использующий методы математического и комплексного анализа для решения задач о целых числах. Среди основных направлений — распределение простых чисел, модулярные формы и аддитивные задачи теории чисел."
 glossary_curie_algebraic_number_theory: "Алгебраическая теория чисел"
 glossary_curie_algebraic_number_theory_desc: "#b;italic $glossary_curie_algebraic_number_theory$#! — раздел математики, применяющий методы абстрактной алгебры к изучению целых и алгебраических чисел. Он исследует разложение на множители в числовых полях и лежит в основе современной криптографии с открытым ключом, в том числе криптосистем на эллиптических кривых."
 glossary_curie_em_field_equations: "Уравнения электромагнитного поля"
 glossary_curie_em_field_equations_desc: "#b;italic $glossary_curie_em_field_equations$#! — система дифференциальных уравнений в частных производных, известная как уравнения Максвелла. Она описывает электрические и магнитные поля и их взаимодействие с веществом, объясняет природу электромагнитных волн и света, работу электрических цепей и беспроводной связи."
 glossary_curie_set_theory: "Теория множеств"
 glossary_curie_set_theory_desc: "#b;italic $glossary_curie_set_theory$#! — фундаментальный раздел математики, изучающий совокупности объектов, называемые множествами. Она определяет такие базовые понятия, как бесконечность, отношение и функция, и служит основой для большей части современной математической логики."
 glossary_curie_topology: "Топология"
 glossary_curie_topology_desc: "#b;italic $glossary_curie_topology$#! — раздел математики, изучающий свойства пространств, сохраняющиеся при непрерывных деформациях, например растяжении или изгибе без разрывов и склеиваний. Она применяется при исследовании сетей, анализе данных и в физике материалов."
 glossary_curie_functional_analysis: "Функциональный анализ"
 glossary_curie_functional_analysis_desc: "#b;italic $glossary_curie_functional_analysis$#! — раздел математики, изучающий бесконечномерные векторные пространства и преобразования между ними. Он объединяет методы линейной алгебры и математического анализа, создавая математический аппарат для квантовой механики и теории дифференциальных уравнений."
 glossary_curie_lie_theory: "Теория Ли"
 glossary_curie_lie_theory_desc: "#b;italic $glossary_curie_lie_theory$#! — теория непрерывных симметрий и геометрических преобразований. Она объединяет математический анализ и абстрактную алгебру для описания непрерывных преобразований и играет важную роль в квантовой механике и общей теории относительности."
 glossary_curie_representation_theory: "Теория представлений"
 glossary_curie_representation_theory_desc: "#b;italic $glossary_curie_representation_theory$#! — раздел математики, изучающий абстрактные алгебраические структуры через их действия на векторных пространствах. Она позволяет исследовать сложные алгебраические симметрии с помощью матриц, упрощая решение задач физики элементарных частиц и химии."
 glossary_curie_algebraic_topology: "Алгебраическая топология"
 glossary_curie_algebraic_topology_desc: "#b;italic $glossary_curie_algebraic_topology$#! — раздел математики, применяющий методы абстрактной алгебры к изучению топологических пространств. Он описывает геометрические свойства с помощью алгебраических инвариантов и находит применение в анализе данных."
 glossary_curie_class_field_theory: "Теория полей классов"
 glossary_curie_class_field_theory_desc: "#b;italic $glossary_curie_class_field_theory$#! — важный раздел алгебраической теории чисел, описывающий абелевы расширения числовых полей. Она устанавливает связи между арифметическими свойствами полей и законами взаимности и служит основой дальнейшего развития теории чисел и современной арифметической геометрии."
 glossary_curie_relativity_theory: "Теория относительности"
 glossary_curie_relativity_theory_desc: "#b;italic $glossary_curie_relativity_theory$#! — фундаментальная физическая теория пространства, времени и тяготения. Она объединяет пространство и время в единое пространство-время и описывает его искривление под действием массивных тел. Теория лежит в основе современной астрофизики и необходима для точной спутниковой навигации."
 glossary_curie_quantum_mechanics: "Квантовая механика"
 glossary_curie_quantum_mechanics_desc: "#b;italic $glossary_curie_quantum_mechanics$#! — физическая теория, описывающая природу на атомном и субатомном уровнях. Она заменяет классический детерминизм вероятностным описанием и объясняет такие явления, как корпускулярно-волновой дуализм и квантовая запутанность. Её законы лежат в основе работы полупроводников и квантовых вычислений."
 glossary_curie_proof_theory: "Теория доказательств"
 glossary_curie_proof_theory_desc: "#b;italic $glossary_curie_proof_theory$#! — раздел математической логики, рассматривающий доказательства как формальные математические объекты. Она исследует их структуру, непротиворечивость формальных систем и пределы доказуемости."
 glossary_curie_cryptography: "Криптография"
 glossary_curie_cryptography_desc: "#b;italic $glossary_curie_cryptography$#! — наука о защите передаваемой информации от несанкционированного доступа с помощью математических методов и шифров."
 glossary_curie_algorithm_theory: "Теория алгоритмов"
 glossary_curie_algorithm_theory_desc: "#b;italic $glossary_curie_algorithm_theory$#! — раздел математики, изучающий точные пошаговые процедуры решения вычислительных задач. Возникнув из исследования вычислений на бумаге, она рассматривает формальные правила, позволяющие определить, какие задачи можно решить за конечное число шагов."
 glossary_curie_lambda_calculus: "Лямбда-исчисление"
 glossary_curie_lambda_calculus_desc: "#b;italic $glossary_curie_lambda_calculus$#! — формальная логическая система, созданная в 1930-х годах для исследования математических функций, связывания переменных и подстановок. Она предназначалась для изучения принципиальных пределов разрешимости задач и формального рассуждения в логике и математике."