 curtiss_altitude_under_5000_custom_1: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'отправилась', 'отправился')] в высотный полёт. Максимально облегчив груз, [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'она забралась', 'он забрался')] в корзину шара [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')]. Подъём был стремительным. Вскоре людей внизу стало почти не разглядеть. От открывшейся панорамы захватывало дух. Несмотря на немалую высоту, до облаков было ещё далеко. Когда барометр показал высоту #p [ROOT.Var('new_balloon_altitude_var').GetValue]#! м, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'сняла', 'снял')] показания метеорологических приборов, затем [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'открыла', 'открыл')] клапан и [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'начала', 'начал')] медленно спускаться к земле."
 curtiss_altitude_under_9000_custom_1: "Шар [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] стремительно взмыл в воздух. Его пришлось максимально облегчить: [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'поставила', 'поставил')] себе цель подняться как можно выше. Сперва дома становились всё меньше, пока не превратились в крошечные точки. Затем шар вошёл в облака, словно в туман, и на метеорологических приборах стали оседать мелкие капли воды. Постепенно холодало. К счастью, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'оделась', 'оделся')] тепло. Дышать становилось всё труднее.\nНа высоте #p [ROOT.Var('new_balloon_altitude_var').GetValue]#! м [ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'приступила', 'приступил')] к необходимым измерениям. Затем начался долгий спуск."
 curtiss_altitude_under_12000_no_tools_custom_1: "Воздух становился всё более разреженным. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] с трудом [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'могла', 'мог')] сосредоточиться. Голова раскалывалась. Взгляд на барометр показал: шар уже поднялся выше любой горы на свете. Без полёта человеку сюда не добраться. Между тем тело начало дрожать. Одежда промокла в облаках, а температура уже опустилась далеко ниже нуля.\n[ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'упала', 'упал')] на колени. Лишь с большим трудом удалось приоткрыть клапан, чтобы начать спуск. Затем [ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'потеряла', 'потерял')] сознание.\nОчнувшись, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'обнаружила', 'обнаружил')] себя уже на земле — точнее, в тёплой постели. К счастью, помощь пришла вовремя."
 curtiss_altitude_under_12000_tools_custom_1: "Даже с баллоном с воздухом приходилось нелегко. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'чувствовала', 'чувствовал')], как холод пронизывает всё тело. Воздух был ледяным, стоять удавалось с трудом. Но данные с такой высоты были важны, и [ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'приступила', 'приступил')] к измерениям. Барометр показывал #p [ROOT.Var('new_balloon_altitude_var').GetValue]#! м — выше любой горы в мире. К сожалению, отсюда почти ничего не было видно: обзор закрывали плотные облака.\nЗавершив измерения, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'начала', 'начал')] выпускать газ из оболочки шара [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')]. Шар пошёл вниз."
 curtiss_altitude_under_16000_no_tools_custom_1: "Тело почти перестало слушаться. Холод уже не ощущался — только тяжёлое дыхание. На этой высоте воздух был крайне разреженным. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] не [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'знала', 'знал')], удастся ли пережить это приключение. С трудом цепляясь за одну из верёвок, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'подтянулась', 'подтянулся')] вверх. Нужно было дотянуться до клапана. Ещё чуть-чуть. В глазах медленно темнело. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'ухватила', 'ухватил')] клапан зубами и [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'начала', 'начал')] поворачивать его. Затем сознание померкло.\nКак тепло. Где [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'она', 'он')]? Перед глазами мелькали тени. Постепенно они превратились в людей. Какая-то женщина протянула миску супа. Похоже, удалось выжить."
 curtiss_altitude_under_16000_tools_custom_1: "Баллон с воздухом облегчал дыхание. Но холод проникал даже сквозь толстую одежду. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'дрожала', 'дрожал')]. И всё же, похоже, шар [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] достиг предельной для себя высоты. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'начала', 'начал')] проводить измерения для научного общества. Барометр показывал #p [ROOT.Var('new_balloon_altitude_var').GetValue]#! м. Невероятная высота! К сожалению, облака мешали обзору.\nЗакончив измерения, [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'она начала', 'он начал')] выпускать газ из оболочки. Шар медленно поплыл вниз."
 curtiss_altitude_over_16000_custom_1: "В герметичной кабине было сравнительно тепло, тогда как снаружи стоял невыносимый холод. Хорошо, что [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'находилась', 'находился')] внутри, а не снаружи. Здесь и дышалось легко. Через окно открывался вид на земной шар. С такой высоты отчётливо была видна кривизна Земли. Вверху голубизна неба всё сильнее переходила в черноту. Над землёй плыли облака, отсюда похожие на сахарную вату. Когда барометр показал #p [ROOT.Var('new_balloon_altitude_var').GetValue]#! м, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName], не покидая защищённой кабины, [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'открыла', 'открыл')] клапан, и шар начал медленно возвращаться к земле."
 santos_distance_under_400_custom_1: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'решила', 'решил')] пролететь на шаре [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] как можно дальше. Пока шар плыл над землёй, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'занималась', 'занимался')] многочисленными делами: нужно было подобрать высоту, чтобы лучше использовать ветер, следить за погодой и прокладывать курс. После полёта продолжительностью #p [ROOT.Var('new_balloon_time_var').GetValue]#! ч шар мягко опустился на землю. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'спросила', 'спросил')] у местного жителя, где произошло приземление, и по карте [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'вычислила', 'вычислил')] пройденное расстояние. Получилось около #p [ROOT.Var('new_balloon_distance_var').GetValue]#! км."
 santos_distance_under_800_custom_1: "Улететь на воздушном шаре как можно дальше не так просто. Нужно дождаться хорошей погоды, иметь надёжный шар и умело прокладывать курс. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'считала', 'считал')], что все условия выполнены, и [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'отправилась', 'отправился')] на шаре [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] устанавливать новый рекорд дальности. Под ним сменялись пейзажи, небольшие горы и реки. Погода оставалась хорошей весь полёт, и [ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName] без труда [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'приземлилась', 'приземлился')], проведя в воздухе #p [ROOT.Var('new_balloon_time_var').GetValue]#! ч.\nНа земле удалось узнать у местного жителя место посадки и определить пройденное расстояние: около #p [ROOT.Var('new_balloon_distance_var').GetValue]#! км."
 santos_distance_under_2000_custom_1: "Погода была идеальной для полёта и оставалась такой до самого конца. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'увидела', 'увидел')] самые разные пейзажи: от огромных городов и крохотных деревушек до безлюдных просторов. Но для столь долгого путешествия светового дня не хватало, и шар [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] продолжал скользить по небу даже ночью. Лишь проведя в воздухе #p [ROOT.Var('new_balloon_time_var').GetValue]#! ч, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'решила', 'решил')] приземлиться. Шар медленно опустился на землю. Местные жители рассказали, где произошло приземление, и выяснилось, что пройдено #p [ROOT.Var('new_balloon_distance_var').GetValue]#! км. Весьма солидное расстояние."
 curtiss_distance_over_2000_custom_1: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'наметила', 'наметил')] столь долгий полёт, что для него требовались достаточные припасы, несколько человек и идеальная погода. Шар [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] был хорошо снабжён, а компанию воздухоплавателю составили ещё 2 человека. К счастью, погода в тот день тоже выдалась отличной. Шар взлетел в городе [ROOT.GetCountry.GetCapital.GetCityHubName] и часами плыл по воздуху. Вечером все трое с удовольствием поужинали вином и взятой с собой жареной курицей. Под звёздным небом они по очереди несли вахту. За полёт продолжительностью #p [ROOT.Var('new_balloon_time_var').GetValue]#! ч шар преодолел огромное расстояние. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'пролетела', 'пролетел')] в общей сложности #p [ROOT.Var('new_balloon_distance_var').GetValue]#! км — почти немыслимую дистанцию."
 curtiss_custom_death_sea: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'предприняла', 'предпринял')] очередную попытку рекордного полёта. Но шар сбился с курса, и его унесло в море. Все попытки спасения оказались безуспешными. Вероятнее всего, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'утонула', 'утонул')]."
 curtiss_custom_death_hydrogen_ignition: "Когда шар [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] устремился ввысь, никто не ожидал, что этот полёт окажется последним. В корзине [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'находилась', 'находился')] [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]. Примерно на высоте 900 метров произошла катастрофа: водород внутри шара каким-то образом воспламенился. Оболочка мгновенно вспыхнула, а гондола рухнула на землю. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'погибла', 'погиб')] от удара."
 curtiss_custom_death_firework: "Во время вечернего полёта над городом [ROOT.GetCountry.GetCapital.GetCityHubName] шар [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] занесло прямо в фейерверк. Взрывающиеся ракеты искрились всеми цветами радуги — и вскоре шар вспыхнул не хуже них. Объятый пламенем, он рухнул вниз. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'погибла', 'погиб')] при крушении."
 curtiss_custom_death_redneck: "Во время полёта над сельской местностью [ROOT.GetCountry.GetAltNameNoFlag('RU_CL_RP')] шар [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] получил несколько пуль: местный житель решил отпраздновать его появление стрельбой. Шар быстро потерял газ и рухнул на землю. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'погибла', 'погиб')]; стрелок тоже не пережил этой катастрофы."
 curtiss_custom_death_belltower: "При заходе на посадку шар занесло в город. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'попыталась', 'попытался')] снова набрать высоту, чтобы не врезаться в один из домов. Увлёкшись этим, [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'она не заметила', 'он не заметил')] приближавшуюся башню. Шар врезался в неё, а [ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'вылетела', 'вылетел')] из корзины. По всей видимости, при падении произошёл перелом шеи."
 curtiss_custom_death_stork: "Сегодня в небе над [ROOT.GetCountry.GetAltNameNoFlag('RU_CL_TP')] произошёл невероятный несчастный случай! В шар [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')], которым [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'управляла', 'управлял')] [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName], врезался аист или какая-то другая птица. Как бы то ни было, её клюв пробил оболочку. Пытаясь освободиться, птица разрывала её всё сильнее, и газ стремительно выходил наружу. Шар рухнул на землю. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'погибла', 'погиб')] от удара."
 curtiss_custom_death_balloon_duel: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] и ещё один воздухоплаватель не смогли поделить сердце знаменитой оперной певицы. Единственным выходом сочли дуэль на воздушных шарах. Соперники поднялись в воздух и принялись стрелять друг в друга. Ожесточённая перестрелка продолжалась почти час — вероятно, потому, что попасть в цель с летящего шара не так-то просто. В конце концов одна из пуль оказалась смертельной: [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'погибла', 'погиб')]. Шар [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] унёс тело прочь; найти его удалось лишь через несколько часов в открытой местности."
 curtiss_custom_death_stray_bullet: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] каким-то образом [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'подлетела', 'подлетел')] на своём шаре слишком близко к линии фронта. Вражеские войска открыли огонь. Пули не задели сам шар [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')], но [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'получила', 'получил')] смертельное ранение. Шар ещё долго парил над полем боя и в конце концов упал на нашей стороне."
 curtiss_custom_death_power_line: "Во время посадки на шаре [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'оказалась', 'оказался')] слишком близко к линии электропередачи. Шар зацепился за провод, ток прошёл через тело воздухоплавателя, а оболочка вспыхнула. От чего именно [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'погибла', 'погиб')], неясно, но смерть определённо была мучительной."
 curtiss_custom_death_seagull: "Во время полёта у побережья [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'попала', 'попал')] в стаю чаек, привлечённых рыбой, взятой в качестве провизии. Сам шар [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] не пострадал, но одна из чаек с такой силой ударила воздухоплавателя по голове, что [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'она потеряла', 'он потерял')] сознание и [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'выпала', 'выпал')] из корзины. Травмы оказались смертельными, а шар уплыл прочь под крики чаек."
 curtiss_custom_death_lightning: "Летать на воздушном шаре в грозу — пожалуй, не лучшая идея. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'убедилась', 'убедился')] в этом на собственном опыте, когда молния ударила прямо в [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'неё', 'него')]. Шар [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] загорелся и рухнул вниз. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'погибла', 'погиб')] при крушении."
 curtiss_custom_death_sabotage: "Обычный полёт быстро превратился в кошмар. Прямо в воздухе оборвались несколько верёвок, и корзина шара [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] рухнула на землю, разбившись вдребезги. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'погибла', 'погиб')]. При осмотре обломков на верёвках обнаружили надрезы. Очевидно, это диверсия. Кто за ней стоит, пока неизвестно."
 curtiss_custom_death_updraft: "Во время полёта шар [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')], которым [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'управляла', 'управлял')] [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName], попал в мощный восходящий поток. Шар поднимался всё выше и выше. Дышать становилось труднее, а температура падала. Неясно, [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'задохнулась', 'задохнулся')] ли [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] или [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'замёрзла', 'замёрз')] насмерть, но на этой чудовищной высоте жизнь оборвалась."
 curtiss_custom_death_stampede: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'приземлилась', 'приземлился')] на пастбище во время одного из полётов. Должно быть, при складывании шара [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] что-то напугало лошадей. Судя по следам, животные бросились во все стороны. Несколько лошадей сбили воздухоплавателя с ног и затоптали насмерть."
 curtiss_custom_death_failed_fixing: "Ещё на небольшой высоте [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'заметила', 'заметил')] неисправность шара [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')]. Сбоку выходил газ, и шар немного терял высоту. [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'Она решила', 'Он решил')] устранить неполадку прямо в полёте и [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'забралась', 'забрался')] на оболочку. По словам свидетелей, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'потеряла', 'потерял')] опору и [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'рухнула', 'рухнул')] на землю. Падение оказалось смертельным. Шар опустился позднее, когда из него вышло достаточно газа."
 curtiss_custom_death_weak_spot: "Сегодня [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'упала', 'упал')] с неба и [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'погибла', 'погиб')] от удара о землю. Сначала причины случившегося были неясны, но вскоре обнаружили обломки шара [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')]. В корзине зияла большая дыра: судя по всему, её плохо изготовили, и дно проломилось под весом воздухоплавателя. Эта смерть — большая потеря для нашей страны."
 curtiss_custom_death_heart_attack: "Сегодня разбился шар [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')]. Среди обломков обнаружили тело; [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'погибшей оказалась', 'погибшим оказался')] [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]. Установить причину аварии было трудно. Сначала предполагали, что [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'намеренно открыла', 'намеренно открыл')] выпускной клапан, поскольку газ вышел из оболочки. Позднее врач выяснил, что смерть наступила ещё до крушения. По всей видимости, в воздухе случился сердечный приступ. Из-за него мышцы свело судорогой, которая и привела клапан в действие."
 curtiss_custom_death_balloon_crash: "Сегодня в небе над [ROOT.GetCountry.GetAltNameNoFlag('RU_CL_TP')] произошёл невероятный несчастный случай. Как ни странно, два воздушных шара столкнулись в воздухе. Шар [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')], которым [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'управляла', 'управлял')] [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName], получил повреждения и быстро потерял высоту. От удара о землю [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'погибла', 'погиб')]. Второй шар сумел приземлиться. Его пилот, потрясённый катастрофой, пытался оказать помощь, но, к сожалению, все усилия были напрасны."
 curtiss_custom_death_fighter_intercepted: "Наш воздухоплаватель [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'случайно пересекла', 'случайно пересёк')] границу страны и [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'подверглась', 'подвергся')] нападению неизвестного самолёта. Несколько попаданий повредили шар [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')], и он начал стремительно терять высоту. Ещё до того, как шар коснулся земли, самолёт атаковал снова. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'получила', 'получил')] смертельное ранение. Власти соседней страны отрицают свою причастность к нападению."
 curtiss_custom_death_tornado: "Хотя над Великими равнинами бушевала буря, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'решила', 'решил')] подняться на шаре [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')]. Ветер крутил шар, но [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] не [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'испугалась', 'испугался')] и [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'продолжила', 'продолжил')] полёт. Незаметно позади образовался смерч, который притягивал шар всё ближе. Лишь перед самым попаданием в воронку [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'заметила', 'заметил')] опасность. К сожалению, было уже поздно. Тело нашли только через несколько дней — оно было погребено под обломками."
 curtiss_custom_death_fall: "Как именно это произошло, неизвестно, но [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] каким-то образом [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'выпала', 'выпал')] из шара [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] и [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'погибла', 'погиб')] при ударе о землю. Сам шар нашли через несколько дней, когда он медленно опустился вниз. Никаких следов, которые позволили бы установить обстоятельства трагедии, в нём не обнаружили."
 curtiss_custom_death_envelope_falls_apart: "Вскоре после взлёта [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'потерпела', 'потерпел')] крушение на шаре [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')]. На первый взгляд казалось, что оболочку разорвало в клочья. Но при внимательном осмотре выяснилось: в воздухе разошлись её швы. Шар развалился и рухнул на землю. К сожалению, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'погибла', 'погиб')] от удара."
 curtiss_custom_killed_by_indigenous_people: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'приземлилась', 'приземлился')] на шаре [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] на землях коренных жителей. Те прежде никогда не видели воздушных шаров и приняли его за злого демона. Не успев даже показаться из корзины, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'была убита', 'был убит')] выстрелами. Спустя несколько дней один из наших патрулей обнаружил тело в разрушенном шаре."
 curtiss_custom_death_cigar: "Последний полёт закончился катастрофой. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'погибла', 'погиб')], а шар [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] ярко пылал, падая с неба. По всей видимости, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'курила', 'курил')] в полёте сигару и каким-то образом [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'подожгла', 'поджёг')] корзину. Огонь перекинулся на оболочку, что и привело к крушению. В этом случае курение определённо оказалось смертельным."
 curtiss_custom_killed_crash_mountainside: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'пыталась', 'пытался')] пересечь горы на шаре [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')]. Во время полёта шар попал в метель, полностью скрывшую обзор. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'попыталась', 'попытался')] подняться над непогодой, но сильный ветер швырнул шар в отвесную скалу. Полученные травмы оказались смертельными. Тело удалось найти лишь через несколько дней."
 curtiss_custom_death_hail_storm: "Все советовали отложить полёт из-за непогоды, но [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'настояла', 'настоял')] на своём. Стоило шару [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] подняться, как погода стала ещё хуже. Из мрачных туч сначала хлынул ливень, вскоре сменившийся градом. Некоторые градины были размером с кулак и всё сильнее рвали оболочку. Шар стремительно упал и разбился о землю. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'погибла', 'погиб')] при крушении."
 curtiss_custom_killed_alcohol: "Перед взлётом на шаре [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'выпила', 'выпил')] несколько бутылок вина. Алкоголь, разумеется, не помогает летать, а опьянение делает воздухоплавание ещё опаснее. Однако причиной смерти стало не падение из корзины и не случайный пожар: вскоре после взлёта за борт отправились все мешки с балластом. Шар стремительно взмыл и мгновенно исчез из виду. Его обломки нашли лишь через несколько дней. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] всё ещё [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'находилась', 'находился')] в корзине; по всей видимости, выпив последнюю бутылку вина, [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'она умерла', 'он умер')] от жажды."
 curtiss_custom_killed_opium: "После вылета шара [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] в поле обнаружили тело. [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'Погибшей оказалась', 'Погибшим оказался')] [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]. Сначала было непонятно, почему [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'она выпала', 'он выпал')] из корзины, но спустя несколько дней шар тоже опустился на землю, и внутри нашли опиум. По всей видимости, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'употребляла', 'употреблял')] его в полёте, а затем по невыясненным причинам [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'выпала', 'выпал')] из шара."
 curtiss_custom_death_acrobatics: "На глазах у большой толпы [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'попыталась', 'попытался')] перейти по канату с одного привязного шара на другой. Сначала казалось, что всё получится без труда. Но сильный порыв ветра сбил воздухоплавателя с каната. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'упала', 'упал')] прямо в толпу и [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'скончалась', 'скончался')] от полученных травм на месте."
 curtiss_custom_death_goose: "Как и в каждый полёт, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'взяла', 'взял')] с собой гуся на удачу. Вдвоём они отправились в путь на шаре [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')]. Через несколько часов шар благополучно приземлился. К удивлению встречавших, в корзине остался только один пассажир — гусь. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'исчезла', 'исчез')] без следа. Даже многодневные поиски ничего не дали."
 curtiss_custom_death_mile_high_club: "В поле обнаружили корзину шара [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')]. В ней лежали [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] и какая-то женщина. Странно, но на обоих телах не было одежды. Причины породили множество догадок. Большинство считает, что смерть наступила от переохлаждения, а одежда была снята незадолго до этого. Такое нередко случается при замерзании: внезапно возникает ощущение сильного жара. Впрочем, некоторые предполагают, что в корзине происходило нечто... непристойное."
 curtiss_custom_death_zoo_crocodile: "Полёт прошёл превосходно. Если не считать посадки... Из всех мест на свете крокодилий вольер в зоопарке был, пожалуй, одним из худших для приземления. Стоило шару [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] оказаться посреди воды, как [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'попрощалась', 'попрощался')] с жизнью. Крокодилы набросились на закуску прежде, чем кто-либо успел вмешаться."
 curtiss_custom_death_cheap_parts: "Бережливость обычно считается добродетелью. Но не тогда, когда речь идёт о деталях воздушного шара. Верёвки для шара [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] купили у самого дешёвого поставщика, сэкономив несколько фунтов. К сожалению, качество оказалось намного хуже обещанного. В полёте несколько верёвок лопнули, гондола накренилась, и [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'выпала', 'выпал')] из корзины. Удар о землю оказался смертельным."
 curtiss_custom_death_disappearance: "Прошёл уже месяц с тех пор, как [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'улетела', 'улетел')] на шаре [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')]. Вскоре после взлёта все следы оборвались. Никто не видел ни шара, ни обломков, ни тела. Наши поиски тоже не принесли результатов. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'исчезла', 'исчез')] вместе с шаром, и никто не знает, что произошло."
 curtiss_custom_death_train: "Из-за цепи несчастливых случайностей шар [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] при посадке попал под поезд и был уничтожен. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'погибла', 'погиб')]. По всей видимости, шар опустился в густом тумане, и [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] не [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'заметила', 'заметил')], что корзина оказалась на железнодорожных путях. Всего через несколько секунд в неё на полном ходу врезался поезд. Сам состав не пострадал; других жертв не было."
 curtiss_custom_death_skyscraper: "Во время полёта над городом шар [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] подхватил мощный воздушный поток и понёс прямо на небоскрёб. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] ничего не [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'могла', 'мог')] сделать и лишь беспомощно [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'смотрела', 'смотрел')], как приближается здание. Шар врезался в фасад и зацепился за него. Через мгновение оболочка разорвалась, и корзина рухнула вниз. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'упала', 'упал')] прямо на овощной прилавок, раздавив свежую капусту. К сожалению, кочаны недостаточно смягчили падение: смерть наступила на месте."
 curtiss_custom_death_disease: "Со словами «Да это всего лишь простуда!» [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'попрощалась', 'попрощался')] и [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'забралась', 'забрался')] в шар [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')]. Однако болезнь оказалась серьёзнее: через несколько дней шар нашли вместе с бездыханным телом. По всей видимости, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'скончалась', 'скончался')] от тяжёлого заболевания. При всех опасностях воздухоплавания такая причина смерти была довольно неожиданной."
 curtiss_custom_death_slipped: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'отправилась', 'отправился')] в путешествие на шаре [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] в сопровождении друга. Посреди полёта [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'она', 'он')], должно быть, [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'поскользнулась', 'поскользнулся')]. Возможно, причиной был мелкий дождь, намочивший корзину, а возможно — простая неосторожность. Как бы то ни было, равновесие было потеряно. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'выпала', 'выпал')] из шара и [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'погибла', 'погиб')]. Друг с большим трудом сумел посадить шар, но сам остался невредим."
 curtiss_custom_death_ladder: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'погибла', 'погиб')] не во время приключения, как можно было бы ожидать от воздухоплавателя. Нет, смерть настигла во время работы над шаром [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')]. Проверяя надутую оболочку на слабые места, [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'она сорвалась', 'он сорвался')] с лестницы. К сожалению, падение оказалось крайне неудачным и привело к смерти."
 curtiss_custom_death_angry_worker: "Во время последнего полёта у шара [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] оборвались несколько верёвок, и гондола рухнула на землю. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'погибла', 'погиб')] от удара. При осмотре обломков на верёвках обнаружили надрезы. Оказалось, один из работников ночью повредил их, намереваясь убить воздухоплавателя. Рабочий заявил: «[SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'Эта кровопийца сама напросилась! Она эксплуатировала', 'Этот кровопийца сам напросился! Он эксплуатировал')] нас, чтобы наслаждаться полётами на шаре!»"
 curtiss_custom_death_sabotage_slaver: "Шар [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] только что опустился в поле. Едва [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'вышла', 'вышел')] из корзины, группа наёмников схватила и убила воздухоплавателя. Расследование показало, что убийство заказал рабовладелец, желавший ослабить движение против рабства. Какая ужасная смерть!"
 curtiss_custom_death_shot_over_prison: "Во время прогулочного полёта с клиентом [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'оказалась', 'оказался')] на шаре [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] над территорией тюрьмы Сисика. Охранники открыли огонь. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'выбралась', 'выбрался')] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'невредимой', 'невредимым')], но возле Аннесберга шар попал в другую перестрелку — с бандой О'Дрисколлов. [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'Она получила', 'Он получил')] пулю и [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'выпала', 'выпал')] из корзины. Пассажир, по всей видимости, затем совершил аварийную посадку у реки. Его следов пока не обнаружено."