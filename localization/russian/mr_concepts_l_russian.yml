l_russian:
 ag_morgenroete_name: "[concept_morgenroete]"
 ag_morgenroete_tooltip: "У вас есть как минимум одно возможное действие, связанное с особенностями мода [concept_morgenroete]."
 concept_morgenroete: "#r Morgenröte#!"
 concept_morgenroete_mr: "MR"
 concept_morgenroete_concept: "Концепт"
 concept_pm_academics_university_humanities: "#b #BLUE Гуманитарно-антропологическая специализация#!#!"
 concept_pm_academics_university_natural_history: "#b #GREEN Естественно-научная специализация#!#!"
 concept_pm_academics_university_mathematics: "#b #ORANGE Математико-техническая специализация#!#!"
 concept_academics_university_specialization: "Специализация университета"
 concept_academics_academic: "Учёный"
 concept_academics_academics: "Учёные"
 concept_academics_scientist: "Учёный"
 concept_academics_scientists: "Учёные"
 concept_academics_academic_desc: "In [concept_morgenroete] #b Academics#! are special characters that allow you to use certain mechanics of the mod. You can get #b Academics#! in some events or by acquiring enough [concept_academics_progress].\nCurrently these #b Academics#! exist:\n - [concept_tesla_engineer]\n - [concept_mendelejew_chemist]\n - [concept_verrier_astronomer]\n - [concept_curie_physicist]\n - [concept_agassiz_geologist]\n - [concept_dubois_paleontologist]\n - [concept_dubois_naturalist]\n - [concept_theiler_biologist]\n - [concept_panum_physician]\n - [concept_lepsius_archaeologist]\n - [concept_andersson_anthropologist]"
 concept_academics_progress: "Научный прогресс"
 concept_academics_progress_desc: "Накопив 360 единиц #b научного прогресса#!, вы сможете получить нового [Concept('concept_academics_academic', 'учёного')]. Чтобы вообще иметь доступ к #b научному прогрессу#!, у вас должна быть технология «#b Академия#!» и хотя бы один #b университет#!.\nПрирост #b научного прогресса#! зависит от различных факторов. Например, чем выше ваша [concept_literacy|l], тем быстрее вы накапливаете #b научный прогресс#!. Другим фактором является процент учёных среди населения вашей страны. Вы получите максимальный прирост #b научного прогресса#!, если доля учёных составляет #p 2%#! или более. Улучшенные школы и довольная интеллигенция также способствуют накоплению #b научного прогресса#!. Наконец, некоторые технологические специализации и особые сооружения, такие как [concept_dubois_zoo|l] или [concept_verrier_observatory|l], также обеспечивают дополнительный #b научный прогресс#!."
 concept_academics_scientific_society: "Научное общество"
 concept_academics_scientific_societies: "Научные общества"
 concept_academics_scientific_society_desc: "The #b Scientific Society#! is a society of your countries brightest minds. It represents your countries scientists and academics and allows you to visit your [Concept('concept_academics_academic','$concept_academics_academics|q$')].\n\nThe #b Scientific Society#! might task you with [Concept('concept_academics_academic_mission','$concept_academics_missions|q$')] that will give you useful rewards."
 concept_academics_experience: "Опыт"
 concept_academics_experience_desc: "Some Academics gather #b Experience#! during their life. In [concept_morgenroete], the characters get #b Experience#! when they get created. Usually they get 10 #b Experience#! for every year older than 30.\nAdditionally they gain #b Experience#! by doing their work, for example for finding new [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects|q$')]. They gain #b Experience#! passively each year as well.\nA character that gets 100 #b Experience#! will get the #b Experienced Trait#!. If a character reaches 300 #b Experience#!, they get the #b Famous Trait#!\nThe higher the #b Experience#! of a character, the better their work. An experienced or famous [concept_dubois_paleontologist] for example finds more [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones|q$')] and is better at building a [concept_dubois_dinosaur_skeleton]."
 concept_academics_academic_mission: "Научное задание"
 concept_academics_academic_missions: "Научные задания"
 concept_academics_mission: "Задание"
 concept_academics_missions: "Задания"
 concept_academics_academic_mission_desc: "Your [concept_academics_scientific_society] will sometimes ask you to reach a certain goal. Such goals could be to find a specific amount of [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects|q$')], [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts|q$')] or similar things. Other #b Missions#! could need you to find Planet X or to get an [Concept('concept_lepsius_exhibition','$concept_lepsius_excellent_exhibition|q$')].\nIf you fail a #b Mission#! your #b Scientific Society#! will be unhappy but completing a mission will yield useful rewards for you."
 concept_curtiss_aviation: "Авиация"
 concept_curtiss_aviation_desc: "#b Aviation#! is one of the main features of [concept_morgenroete]. The 19th and 20th century saw the rise of human flight. First in the form of #b Balloons#! and #b Airships#!, then with #b Planes#!. Flying was a prestigious activity and allowed reaching new horizons.\n\nMany countries start their journey to the skies at the beginning of the game, when they start sponsoring a [Concept('concept_santos_balloonist_role','$concept_santos_balloonist_role_only_balloonist|q$')] to break records. Breaking one of the records will give your country a technology boost as well as a prestige modifier.\nResearching the Zeppelin Technology will allow you to conduct an [concept_curtiss_arctic_expedition] if you have access to the North Pole and a [concept_curtiss_pilot].\nResearching further in the aviation path will allow you to use multiple new mechanics. You will be able to build [concept_curtiss_airport] which produce the new #b Flights#! Good as well as #b Services#!. The #b Airport#! will allow an [concept_curtiss_airline] to grow which will allow you to use the [concept_curtiss_airspace_convention] diplomatic action. The #b Airspace Convention#! will allow you to get access to States and [Concept('concept_lepsius_excavation_site','$concept_lepsius_excavation_sites|q$')] as well as the North Pole. If your #b Airline#! grows enough you will be able to either build a gigantic blimp or the world's biggest plane.\nThe most exciting feature comes at the beginning of the 20th century: You will be able to compete at the [concept_curtiss_schneider_trophy]. The #b Schneider Trophy#! is a seaplane race in which different countries compete. If you win you will get prestige as well and host the next event. And if you manage to win the race 3 times, you will keep the #b Schneider Trophy#!."
 concept_curtiss_arctic_expedition: "Арктическая экспедиция"
 concept_curtiss_arctic_expeditions: "Арктические экспедиции"
 concept_curtiss_arctic_expedition_desc: "Если вы исследовали технологию «#b Цеппелин#!», имеете [Concept('concept_verrier_observatory', 'обсерваторию')] с #b метеостанцией#!, [Concept('concept_curtiss_pilot', 'пилота')] и доступ к области вблизи Северного полюса, вы можете провести #b арктическую экспедицию#!. Такими областями являются #b Гренландия#!, #b Северная Норвегия#!, #b Аляска#!, #b Нунавут#! и #b Ненеция#!. Вы можете получить доступ, либо владея областью самостоятельно, либо заключив [Concept('concept_curtiss_airspace_convention', 'конвенцию о воздушном пространстве')] с её владельцем.\nВо время #b арктической экспедиции#! вы можете предпринимать исследовательские походы, строить полярные станции, получать новые знания о географии, метеорологии и биологии Арктики и первыми пересечь полюс на дирижабле!"
 concept_curtiss_pilot: "Пилот"
 concept_curtiss_pilots: "Пилоты"
 concept_curtiss_pilot_desc: "#b Пилот#! - это персонаж с чертой «#b Пилот#!». #b Пилоты#! имеют низкий шанс появления после открытия #b ранней авиации#!. Кроме того, в битвах на фронте с использованием воздушной разведки в качестве метода производства есть шанс, что из битвы через событие появится #b пилот#!. Более совершенные технологии, такие как самолёты и современная авиация, а также создание лётной школы через решения, повышают шансы на то, что у персонажа появится черта «#b Пилот#!».\n#b Пилоты#! помогают вам по-разному. #b Авиакомпании#! могут быть заинтересованы в #b пилотах#! для повышения своего имиджа; в борьбе за [Concept('concept_curtiss_schneider_trophy', 'Кубок Шнейдера')] опытные #b пилоты#! имеют больше шансов; и #b пилот#! необходим для проведения [Concept('concept_curtiss_arctic_expedition', 'арктической экспедиции')]. #b Пилоты#! также могут быть повышены до асов через событие, если они развёрнуты на фронте."
 concept_curtiss_airport: "Аэропорт"
 concept_curtiss_airports: "Аэропорты"
 concept_curtiss_airport_desc: "#b Аэропорт#! - это сооружение, которое открывается технологией «#b Современная авиация#!». Это гражданское сооружение, которое производит #tooltippable_name #tooltip:[GetGoods('air_travel').GetTooltipTag],DATA_GOODS_NAME_TOOLTIP,GoodsTooltip [GetGoods('air_travel').GetTextIcon][GetGoods('air_travel').GetCustom('RU_GL_VP')]#!#! и #b услуги#!, но потребляет различные товары, начиная с #tooltippable_name #tooltip:[GetGoods('tools').GetTooltipTag],DATA_GOODS_NAME_TOOLTIP,GoodsTooltip [GetGoods('tools').GetTextIcon][GetGoods('tools').GetCustom('RU_GL_RP')]#!#!, #tooltippable_name #tooltip:[GetGoods('paper').GetTooltipTag],DATA_GOODS_NAME_TOOLTIP,GoodsTooltip [GetGoods('paper').GetTextIcon][GetGoods('paper').GetCustom('RU_GL_RP')]#!#!, #tooltippable_name #tooltip:[GetGoods('aeroplanes').GetTooltipTag],DATA_GOODS_NAME_TOOLTIP,GoodsTooltip [GetGoods('aeroplanes').GetTextIcon][GetGoods('aeroplanes').GetCustom('RU_GL_RP')]#!#! и #tooltippable_name #tooltip:[GetGoods('oil').GetTooltipTag],DATA_GOODS_NAME_TOOLTIP,GoodsTooltip [GetGoods('oil').GetTextIcon][GetGoods('oil').GetCustom('RU_GL_RP')]#!#!. Позже ему также потребуются #tooltippable_name #tooltip:[GetGoods('electricity').GetTooltipTag],DATA_GOODS_NAME_TOOLTIP,GoodsTooltip [GetGoods('electricity').GetTextIcon][GetGoods('electricity').GetName]#!#!, #tooltippable_name #tooltip:[GetGoods('telephones').GetTooltipTag],DATA_GOODS_NAME_TOOLTIP,GoodsTooltip [GetGoods('telephones').GetTextIcon][GetGoods('telephones').GetName]#!#! и #tooltippable_name #tooltip:[GetGoods('radios').GetTooltipTag],DATA_GOODS_NAME_TOOLTIP,GoodsTooltip [GetGoods('radios').GetTextIcon][GetGoods('radios').GetName]#!#!.\nЕсли у вас будет достаточно #b аэропортов#!, будет основана [concept_curtiss_airline|l], и по мере роста ваших #b аэропортов#! будет расти и #b авиакомпания#!, предлагая больше бонусов."
 concept_curtiss_airline: "Авиакомпания"
 concept_curtiss_airlines: "Авиакомпании"
 concept_curtiss_airline_desc: "An #b Airline#! is a company or a government run institution that offers [GetGoods('air_travel').GetName] from the local level up to international flights at the end of the game. #b Airlines#! provide various other bonuses as well. #b Airlines#! need [Concept('concept_curtiss_airport','$concept_curtiss_airports|q$')] to conduct those flights. If you grow your #b Airports#!, so will the #b Airlines#!.\nIf your #b Airline#! is government run, you will get the opportunity to construct an enormous blimp and let it travel vast distances. If your #b Airline#! is publicly or privately owned, you might instead get the chance to build the biggest airplane ever created."
 concept_curtiss_airspace_convention: "Конвенция о воздушном пространстве"
 concept_curtiss_airspace_conventions: "Конвенции о воздушном пространстве"
 concept_curtiss_airspace_convention_desc: "#b Конвенция о воздушном пространстве#! - важный [concept_diplomatic_pact|l], позволяющий взаимодействовать с регионами далеко за пределами вашей сферы влияния. Если у вас заключена #b конвенция о воздушном пространстве#! с другой страной, где есть [concept_lepsius_excavation_site|l], вы сможете провести [Concept('concept_lepsius_expedition', 'археологическую экспедицию')], даже не имея достаточно высокого [Concept('concept_interest_tier', 'уровня интереса')] в этом регионе.\n#b Конвенция о воздушном пространстве#! также позволит отправить [Concept('concept_curtiss_arctic_expedition', 'арктическую экспедицию')], если вы не владеете ни одной из необходимых областей."
 concept_curtiss_schneider_trophy: "Кубок Шнейдера"
 concept_curtiss_schneider_trophy_desc: "Борьба за этот престижный трофей, который учредил француз Жак Шнейдер незадолго до Первой мировой войны, была в первую очередь призвана стимулировать развитие гидросамолётов. Со временем гонка за этот трофей превратилась в соревнование наций, в котором Великобритания, США и Италия оказывали своим командам огромную поддержку, чтобы завоевать заветный трофей. Технологическое развитие действительно выиграло от #b Кубка Шнейдера#!, поскольку использовались всё более быстрые и совершенные гидросамолёты.\n#b Кубок Шнейдера#! может быть учреждён, если есть 5 держав, которые изобрели технологию «#b Гидросамолёты#!», и если у вас есть порт и городской центр 10-го уровня в одной из ваших областей.\nПобедитель Кубка выбирается через запись в дневнике и зависит от многих факторов. Например, преимущество будет у державы с лётной школой и большой [Concept('concept_curtiss_airline', 'авиакомпанией')]. Выдающийся [concept_curtiss_pilot|l] и солидные финансовые вложения также помогут выиграть трофей.\nПобедитель последнего Кубка сможет провести следующий, если у него есть порт, или если это Швейцария с её многочисленными озёрами. Выиграть Кубок 3 раза подряд ещё лучше, так как держава навсегда оставит трофей у себя и получит за это бонус к престижу."
 concept_dubois_natural_history: "Естествознание"
 concept_dubois_natural_history_desc: "#b Natural History#! is one of the main features of [concept_morgenroete]. The 19th century has seen many great natural history discoveries: many great expeditions, such as that of the Beagle, the invention of the theory of evolution, the discovery of hundreds of thousands of new species and, of course, the discovery of dinosaurs.\n\nMajor and Great Powers with a fleet and an admiral can send a ship on a [concept_dubois_pacific_expedition]. On a #b Pacific Expedition#! you can find rare plants, animals, and fossils, conduct oceanographic research, or observe astronomical phenomena such as solar eclipses.\n\nThe big animals you can find, the [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals|q$')], can be used to construct a [concept_dubois_zoo] and exhibit those animals. The more animals, the bigger the effect the #b Zoo#! has. You can find those #b Animals#! on Expeditions, you can collect them in your own territory or ask other countries to sell them to you.\n\nSmaller animals, plants and other organisms are called [concept_dubois_specimen]. A [concept_dubois_naturalist] can collect such #b Specimen#!. A #GREEN #b Naturalist#!#! can be sent on [Concept('concept_dubois_botanical_expedition','$concept_dubois_botanical_expeditions|q$')] to states with a rainforest state modifier. In case you do not have such a state yourself, you can acquire a [concept_mr_research_charter] from another country. A #GREEN #b Naturalist#!#! will gain [concept_academics_experience] when they find rare specimens.\n\n[Concept('concept_dubois_fossil','$concept_dubois_fossils|q$')] are the field of a [concept_dubois_paleontologist], be it fossils of plants, insects or other small animals. #b Fossils#! can be found on #b Expeditions#! or in States with [Concept('concept_dubois_formation','$concept_dubois_formations|q$')]. If you have a #b Great Formation#! You might even be able to find [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones|q$')]. And otherwise you can access one by buying a [concept_mr_research_charter].\n\nIf your country has access to a mountain range a general can participate in [concept_douglas_mountaineering] and gain better traits and a prestige bonus."
 concept_dubois_naturalist: "#b #GREEN Натуралист#!#!"
 concept_dubois_naturalists: "#b #GREEN Натуралисты#!#!"
 concept_dubois_naturalist_desc: "#b #GREEN Naturalist#!#! are Academics that can gather [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals|q$')] and [concept_dubois_specimen]. They can be sent of to a [concept_dubois_pacific_expedition] or a [concept_dubois_botanical_expedition] where they can find rare plants and animals that give you a small bonus. #b #GREEN Naturalists#!#! gain [concept_academics_experience] when they find new rare specimens."
 concept_dubois_paleontologist: "#b #GREEN Палеонтолог#!#!"
 concept_dubois_paleontologists: "#b #GREEN Палеонтологи#!#!"
 concept_dubois_paleontologist_desc: "#b #GREEN Paleontologists#!#! are Academics that will dig for [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones|q$')] and [Concept('concept_dubois_fossil','$concept_dubois_fossils|q$')]. To collect them, you need access to a [concept_dubois_formation]. If you have access to a #b Formation#! either by owning it yourself or with a [concept_mr_research_charter], you can send your #b Paleontologist#! on a [concept_dubois_paleontological_expedition].\nAfter collecting or reconstructing 5 #b Dinosaur Bones#! your #b Paleontologist#! can construct a [concept_dubois_dinosaur_skeleton]. As #b #GREEN Paleontologists#!#! gain [concept_academics_experience], they will get better at reconstructing #b Dinosaur Skeletons#! and so will the #b skeletons#!. The better the #b Dinosaur Skeletons#!, the more prestige your [concept_dubois_paleontological_collection] will provide."
 concept_dubois_pacific_expedition: "Тихоокеанская экспедиция"
 concept_dubois_pacific_expeditions: "Тихоокеанские экспедиции"
 concept_dubois_pacific_expedition_desc: "As a Major or Great Power you can send an Expedition to the Pacific Ocean. You need to have the #b Empiricism#!, #b Screw Frigate#! and #b Dialectics Technology#! researched, you need a Port and a University, as well as a Navy of at least 15 and an Admiral.\nOn a #b Pacific Expedition#! you can find rare plants, [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals|q$')], and [Concept('concept_dubois_fossil','$concept_dubois_fossils|q$')], conduct oceanographic research, or observe astronomical phenomena such as solar eclipses. At the beginning of the #b Expedition#! you can choose a #b Scientist#! for your Expedition as well, either a #b Surveyor#!, [concept_dubois_naturalist], [concept_dubois_paleontologist] or [concept_verrier_astronomer]. Each one will help to bring better yields in specific events tied to their expertise.\nYour expedition can choose a focus on what exactly it explores. It can be devoted entirely to the mysteries of the sea and improve your oceanographic and astronomical knowledge; in that case, only oceanographic events will trigger. If you explore the wonders of nature, you will be confronted with botanical, zoological and paleontological events. Great Powers will also have the option to undertake a prestige mission, in which you'll find artifacts, establish trading posts or set up missions - especially useful if you don't have diplomatic interests in Oceania, but want to try to acquire at least a small colony through missionaries.\nYou will also have to choose where exactly your mission will travel to: Oceania, Australia or Indonesia. Each one offers different events and rewards."
 concept_dubois_habitat: "Ареал"
 concept_dubois_habitats: "Ареалы"
 concept_dubois_animal_habitat: "Ареал животного"
 concept_dubois_habitat_desc: "A #b Habitat#! is a region in a state where a specific [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animal|q$')] lives. In #r Morgenröte#! #b Habitats#! for the various animals exist in various State Regions. If you own a #b Habitat#! you can transport the #b Animals#! to the [concept_dubois_zoo] or even sell them to other countries.\n\nIf your state reaches an [concept_urbanization] of 2000 or higher or has no more [concept_arable_land], the #b Exotic Animals#! will go #n extinct after 10 years#!.\n\nTo save the #b Animals#! from extinction you can build a [concept_dubois_nature_reserve] in a state with a #b Habitat#!"
 concept_dubois_nature_reserve: "Заповедник"
 concept_dubois_nature_reserves: "Заповедники"
 concept_dubois_royal_hunting_reserve: "Королевский охотничий заказник"
 concept_dubois_nature_reserve_desc: "A #b Nature Reserve#! is a protected area where you can protect or establish [Concept('concept_dubois_habitat','$concept_dubois_habitats|q$')].\n\nIf you already have a #b Habitat#!, you can protect it from destruction by the influence of humans by constructing the #b Nature Reserve#! building in the state with the #b Habitat#!. To build a #b Nature Reserve#!, you need to have the #b Genetics#! technology unlocked and have an incorporated state with a #b Habitat#! that is a homeland of one of your primary cultures.\n\nIf you do not own a #b Habitat#!, you can build a #b Nature Reserve#! by surveying your country for a location if you have the #b Genetics#! technology unlocked and at least one [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animal|q$')] from your continent in your [concept_dubois_zoo].\n\nA #b Nature Reserve#! does not only protect your animal #b Habitats#!, it also allows you to settle #b Exotic Animals#! from your continent in them. By doing this, you can protect all the #b Exotic Animals#! of your continent in one single state."
 concept_dubois_zoo_animal: "Животное для зоопарка"
 concept_dubois_zoo_animals: "Животные для зоопарка"
 concept_dubois_exotic_animal: "Экзотическое животное"
 concept_dubois_exotic_animals: "Экзотические животные"
 concept_dubois_zoo_animal_desc: "В мире много животных, которых может поймать ваш [concept_dubois_naturalist]. Чтобы поймать #b экзотическое животное#!, вам нужна область с [Concept('concept_dubois_habitat', 'ареалом')]. В качестве альтернативы вы можете купить #b экзотическое животное#! у страны, у которой есть #b ареал#!.\nПосле поимки #b животные для зоопарка#! могут быть отправлены в ваш [Concept('concept_dubois_zoo', 'зоопарк')], что позволит вам расширить #b зоопарк#!."
 concept_dubois_zoo: "Зоопарк"
 concept_dubois_zoos: "Зоопарки"
 concept_dubois_zoo_desc: "#b Зоопарк#! - это особое сооружение, которое вы можете построить, собрав 5 [Concept('concept_dubois_zoo_animal', 'экзотических животных')]. В #b зоопарке#! размещаются ваши #b животные#!, ваша коллекция [Concept('concept_dubois_specimen', 'образцов')] и ваша палеонтологическая коллекция."
 concept_dubois_specimen: "Образец"
 concept_dubois_specimens: "Образцы"
 concept_dubois_specimen_desc: "Различные насекомые, растения и мелкие животные, которых может собрать [concept_dubois_naturalist|l], называются #b образцами#!. Вы можете использовать #b образцы#! для строительства ботанического сада или коллекции образцов в вашем [Concept('concept_dubois_zoo', 'зоопарке')]."
 concept_dubois_botanical_expedition: "Ботаническая экспедиция"
 concept_dubois_botanical_expeditions: "Ботанические экспедиции"
 concept_dubois_botanical_expedition_desc: "You can send a [concept_dubois_naturalist] on a #b Botanical Expedition#! if you have access to a state with [concept_ito_medicinal_plants] either by owning such a state or by acquiring a [concept_mr_research_charter].\nYour #b Naturalist#! will collect [concept_ito_medicinal_plants] and [Concept('concept_dubois_specimen','$concept_dubois_specimens|q$')] during the one year journey. Sometimes they will find a rare plant that will make a great addition to the botanical collection of a [concept_dubois_zoo]."
 concept_dubois_fossil: "Окаменелость"
 concept_dubois_fossils: "Окаменелости"
 concept_dubois_fossil_desc: "[concept_dubois_paleontologist] может обнаруживать #b окаменелости#! давно вымерших растений и животных, если вы открыли [Concept('concept_dubois_formation', 'формацию')]."
 concept_dubois_dinosaur_bone: "Кости динозавров"
 concept_dubois_dinosaur_bones: "Кости динозавров"
 concept_dubois_dinosaur_bone_desc: "A [concept_dubois_paleontologist] can find Dinosaur Bones in Great [Concept('concept_dubois_formation','$concept_dubois_formations|q$')].\nAn #b Experienced Paleontologist#! can also attempt to reconstruct a #b Dinosaur Bone#! from 20 [Concept('concept_dubois_fossil','$concept_dubois_fossils|q$')] fragments. A #b Dinosaur Bone#! can only be reconstructed if at least one dinosaur bone is available for orientation.\nTo perform any of the actions, the paleontologist must not be exhausted or busy. Its success depends largely on paleontological [concept_academics_experience].\n#b Dinosaur Bones#! are use to reconstruct [Concept('concept_dubois_dinosaur_skeleton','$concept_dubois_dinosaur_skeletons|q$')]."
 concept_dubois_dinosaur_skeleton: "Скелет динозавра"
 concept_dubois_dinosaur_skeletons: "Скелеты динозавров"
 concept_dubois_dinosaur_skeleton_desc: "From five [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones|q$')] from a continental region, a [concept_dubois_paleontologist] can reconstruct a complete dinosaur. To reconstruct a #b Dinosaur Skeleton#!, you need 5 #b Dinosaur Bones#! from the same region.\nHopefully your #b Paleontologist#! ist experienced enough to reconstruct the #b Dinosaur Skeleton#! right. Otherwise you might risk to lose prestige for your [concept_dubois_paleontological_collection]. However, if a #b Dinosaur Skeleton#! was reconstructed wrong, you can attempt to fix it which will result in a slightly better reconstruction."
 concept_dubois_paleontological_collection: "Палеонтологическая коллекция"
 concept_dubois_paleontological_collections: "Палеонтологические коллекции"
 concept_dubois_paleontological_collection_desc: "The #b Paleontological Collection#! is the realm of your [concept_dubois_paleontologist]. There you will find all the [Concept('concept_dubois_fossil','$concept_dubois_fossils|q$')], [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones|q$')] and [Concept('concept_dubois_dinosaur_skeleton','$concept_dubois_dinosaur_skeletons|q$')] of your nation.\nThe better your #b Paleontologist#! mounted these #b Dinosaur Skeletons#!, the more prestige your #b Collection#! will provide. If your #b Paleontologist#! mounted the #b Skeletons#! horribly wrong, that could even cause you to lose prestige. But maybe the same or another #b Paleontologist#! can remount them better!"
 concept_dubois_formation: "Формация"
 concept_dubois_formations: "Формации"
 concept_dubois_geological_formation: "Геологическая формация"
 concept_dubois_formation_desc: "There are two kinds of #b Formations#!, normal Formations allow your [concept_dubois_paleontologist] to collect [Concept('concept_dubois_fossil','$concept_dubois_fossils|q$')] while Great Formations allow for the discovery of [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones|q$')].\n#b Formations#! can be uncovered by your Paleontologist or when you research the Paleontology Technology.\nIf you do not have a #b Great Formation#! yourself, you can buy a [concept_mr_research_charter] from a nation that does and gain access to it."
 concept_dubois_paleontological_expedition: "Палеонтологическая экспедиция"
 concept_dubois_paleontological_expeditions: "Палеонтологические экспедиции"
 concept_dubois_mountain: "Гора"
 concept_dubois_mountains: "Горы"
 concept_dubois_mountain_desc: "Есть много #b гор#!, на которые можно взобраться.\n\n#V Северная Америка:#!\n#b Денали#! (Аляска), 6190 метров\n#b Гора Логан#! (Территория Юкон), 5959 метров\n#b Орисаба#! (Мексика), 5636 метров\n#b Гора Уитни#! (Калифорния), 4421 метр\n\n#V Южная Америка:#!\n#b Аконкагуа#! (Мендоса), 6267 метров\n#b Уаскаран#! (Территория Лимы), 6768 метров\n#b Ильимани#! (Ла-Пас), 6438 метров\n#b Чимборасо#! (Эквадор), 6267 метров\n\n#V Европа:#!\n#b Шхара#! (Большой Кавказ), 5642 метра\n#b Пик Дюфур#! (Западная Швейцария), 4634 метра\n#b Маттерхорн#! (Западная Швейцария), 4478 метров\n#b Эгюий-Верт#! (Савойя), 4122 метра\n#b Пик Ането#! (Арагон), 3404 метра\n\n#V Африка:#!\n#b Кибо#! (Танганьика), 5895 метров\n#b Гора Кения#! (Кения), 5199 метров\n#b Гора Стэнли#! (Уганда), 5109 метров\n#b Гора Камерун#! (Южный Камерун), 4095 метров\n\n#V Азия:#!\n#b Камет#! (Дели), 7756 метров\n#b Чоголиза#! (Кашмир), 7665 метров\n#b Кабру#! (Гималаи), 7412 метров\n#b Пик Кауфмана#! (Таджикистан), 7134 метра\n\n#V Австралия и Океания:#!\n#b Гора Вильгельм#! (Восточная Новая Гвинея), 4121 метр\n#b Гора Кука#! (Южный остров), 3724 метра"
 concept_elgar_music: "Музыкальная культура"
 concept_elgar_opera: "Опера"
 concept_elgar_operas: "Оперы"
 concept_elgar_opera_house: "Оперный театр"
 concept_elgar_opera_houses: "Оперные театры"
 concept_elgar_musical_tradition: "Музыкальная традиция"
 concept_elgar_impressionism: "Импрессионизм"
 concept_elgar_expressionism: "Экспрессионизм"
 concept_elgar_art_nouveau: "Ар-нуво"
 concept_elgar_architecture: "Архитектура"
 concept_elgar_architectural_project: "Архитектурный проект"
 concept_elgar_architectural_projects: "Архитектурные проекты"
 concept_lepsius_archaeology: "Археология"
 concept_lepsius_archaeology_desc: "#b Archaeology#! is one of the main features of [concept_morgenroete].\n\nThere are 8 [Concept('concept_lepsius_excavation_site','$concept_lepsius_excavation_sites|q$')] on the map.\n\n To be able to send an [concept_lepsius_expedition], you need to research the Antiquarianism Technology, have an [concept_lepsius_archaeological_team] and have acces to one of the Excavation Sites. You can either get access by owning the Site yourself or by asking a country with a Site for a [concept_mr_research_charter].\n\nYou can now send an Archaeological expedition to one of the Excavation Sites. Your Team will discover [Concept('concept_lepsius_artifact','$concept_lepsius_minor_artifacts|q$')] and in very rare cases and the help of a good [concept_lepsius_archaeologist], you might even find a [concept_lepsius_major_artifact].\n\nOnce your Team returns with the Artifacts, you might be able to build a [concept_lepsius_museum]. In a Archaeological Museum you will be able to see your Artifacts, create [concept_lepsius_exhibition] and visit your #b #BLUE Archaeologist#!#!.\n\nThe more Artifacts and Exhibitions you have, the more Prestige you will get."
 concept_lepsius_archaeologist: "#b #BLUE Археолог#!#!"
 concept_lepsius_archaeologists: "#b #BLUE Археологи#!#!"
 concept_lepsius_archaeologist_desc: "#b #BLUE Archaeologists#!#! are Academics that you can send to [Concept('concept_lepsius_expedition','$concept_lepsius_expeditions|q$')]. They will gather [Concept('concept_lepsius_artifact','$concept_lepsius_minor_artifacts|q$')] there. Sometimes they might even find a [concept_lepsius_major_artifact].\nArchaeologists gain [concept_academics_experience] during their work and passively every year. They can get better levels of the archaeologist trait by earning enough #b Experience#!."
 concept_lepsius_museum: "Археологический музей"
 concept_lepsius_museum_desc: "The #b Archaeological Museum#! is a building you can construct that displays all the [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts|q$')] your nation has found."
 concept_lepsius_excavation_site: "Место исторических раскопок"
 concept_lepsius_excavation_sites: "Места исторических раскопок"
 concept_lepsius_excavation_site_desc: "There are multiple #b Historical Excavation Sites#! in different countries including: Upper and Lower Egypt, Babylonia, Assyria, Crete, Argolis, Yucatán and Peru. Each #b Historical Site#! offers different [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts|q$')] and Events. Besides these large, historically significant excavation sites, there are also [Concept('concept_lepsius_minor_excavation_site', '$concept_lepsius_minor_excavation_sites|q$')]."
 concept_lepsius_expedition: "Археологическая экспедиция"
 concept_lepsius_expeditions: "Археологические экспедиции"
 concept_lepsius_expedition_desc: "An #b Archaeological Expedition#! is an expedition of an [concept_lepsius_archaeologist] and his [concept_lepsius_archaeological_team]. It will take multiple months in which they will try to gather as many [Concept('concept_lepsius_artifact','$concept_lepsius_minor_artifacts|q$')] as possible. #b Expeditions#! are the only way to get in possession of [Concept('concept_lepsius_major_artifact','$concept_lepsius_major_artifacts|q$')].\nIf you researched early Archaeology, you can leave your Team at the Site to create an [concept_lepsius_excavation] after a successful #b Expeditions#!."
 concept_lepsius_archaeological_team: "Археологическая группа"
 concept_lepsius_archaeological_teams: "Археологические группы"
 concept_lepsius_excavation_team: "Раскопочная группа"
 concept_lepsius_archaeological_team_desc: "You need one or more #b Archaeological Team#! to be able to conduct [Concept('concept_lepsius_expedition','$concept_lepsius_expeditions|q$')]. You can gain up to 3 #b Archaeological Teams#!, but each one has higher requirements.\n\nYou can get your first #b Team#! by having researched the Antiquarianism Technology, having a University of at least level 3 and a Literacy of 33%.\n\nYou can get another Team if you have researched the Modern Archaeology Technology, have a University of at least level 15 and a Literacy of 66%.\n\nYou can get another #b Team#! having researched the Antiquarianism Technology and having an Experienced [concept_lepsius_archaeologist].\n\nYou need #b Teams#! for [Concept('concept_lepsius_expedition','$concept_lepsius_expeditions|q$')] and [Concept('concept_lepsius_excavation','$concept_lepsius_excavations|q$')]."
 concept_lepsius_artifact: "Артефакт"
 concept_lepsius_artifacts: "Артефакты"
 concept_lepsius_minor_artifact: "Малый артефакт"
 concept_lepsius_minor_artifacts: "Малые артефакты"
 concept_lepsius_oceanic_artifact: "Океанийский артефакт"
 concept_lepsius_oceanic_artifacts: "Океанийские артефакты"
 concept_lepsius_artifact_desc: "You can get Artifacts by sending [Concept('concept_lepsius_archaeological_team','$concept_lepsius_archaeological_teams|q$')] on [Concept('concept_lepsius_expedition','$concept_lepsius_expeditions|q$')], [Concept('concept_lepsius_excavation','$concept_lepsius_excavations|q$')], on [Concept('concept_dubois_pacific_expedition','$concept_dubois_pacific_expeditions|q$')] or in Events.\n\nUsually you will get Minor #b Artifacts#!. You can use these Minor #b Artifacts#! for [Concept('concept_lepsius_exhibition','$concept_lepsius_exhibitions|q$')] in your [concept_lepsius_museum].\n\n[Concept('concept_lepsius_major_artifact','$concept_lepsius_major_artifacts|q$')] on the other hand are unique #b Artifacts#! that can only be found once and have a unique name. You can usually find them in Expeditions, excavations and as Archaeological Discoveries."
 concept_lepsius_major_artifact: "Крупный артефакт"
 concept_lepsius_major_artifacts: "Крупные артефакты"
 concept_lepsius_major_artifact_desc: "#b Major Artifacts#! are special [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts|q$')] that have a name and an identity.\nYou can find #b Major Artifacts#! in different ways. Some of them you will find during [Concept('concept_lepsius_expedition','$concept_lepsius_expeditions|q$')]. For others you need to maintain a continous [concept_lepsius_excavation] until you find. And some will be discovered in a major discovery.\nTaking a #b Major Artifact#! out of a country illegally might cause a diplomatic incident that might harm you more than owning a #b Major Artifact#!. On the other hand, #b Major Artifacts#! allow you to create a [Concept('concept_lepsius_exhibition','$concept_lepsius_excellent_exhibition|q$')] which will give you a huge prestige bonus and is needed for some [Concept('concept_academics_academic_mission','$concept_academics_academic_missions|q$')]."
 concept_lepsius_exhibition: "Выставка"
 concept_lepsius_exhibitions: "Выставки"
 concept_lepsius_excellent_exhibition: "Превосходная выставка"
 concept_lepsius_excavation: "Раскопки"
 concept_lepsius_excavations: "Раскопки"
 concept_lepsius_excavation_desc: "If you have researched Early Archaeology and finished an [concept_lepsius_expedition], you can decide to leave your [concept_lepsius_archaeological_team] at the Site to passively dig out [Concept('concept_lepsius_artifact','$concept_lepsius_minor_artifacts|q$')]. You can always call your Team back from the #b Excavation#!."
 concept_verrier_astronomy: "Астрономия"
 concept_verrier_observatory: "Обсерватория"
 concept_verrier_observatories: "Обсерватории"
 concept_verrier_astronomer: "#b #ORANGE Астроном#!#!"
 concept_verrier_astronomers: "#b #ORANGE Астрономы#!#!"
 concept_verrier_astronomical_object: "Астрономический объект"
 concept_verrier_astronomical_objects: "Астрономические объекты"
 concept_verrier_astronomical_object_icon: "@verrier_astronomicalobject!"
 concept_verrier_celestial_body: "Небесное тело"
 concept_verrier_celestial_bodies: "Небесные тела"
 concept_verrier_comet: "Большая комета"
 concept_verrier_comets: "Большие кометы"
 concept_verrier_comet_desc: "В викторианскую эпоху было несколько #b больших комет#!, которые привлекли широкое общественное внимание. Если у вас есть [concept_verrier_astronomer|l], есть шанс, что вы первым обнаружите одну из этих #b больших комет#!, что приведёт к бонусу к престижу и исследованиям."
 concept_verrier_moon_photo: "Фотография Луны"
 concept_verrier_moon_photos: "Фотографии Луны"
 concept_rapanui_christian_mission: "Христианская миссия"
 concept_rapanui_christian_missions: "Христианские миссии"
 concept_rapanui_christian_mission_desc: "[Concept('concept_major_power','$concept_major_powers|q$')] or [Concept('concept_great_power','$concept_great_powers|q$')] with [Concept('concept_interest','$concept_interests|q$')] in Oceania can try to convert a decentralized island nation in the region - but this is only possible if your country is not too secular and the \"devout\" interest group is not too weak.\n\nThe proselytizing takes place in three steps. If you send a missionary, he will either be received kindly, ignored - or killed immediately. Should your mission go awry, you will have to wait a few years to find a new missionary to spread the word of God. Afterwards your missionary will convert 1% of the population per year. There might be events that help or hinder the conversion.\n\nThe second stage begins when you reach 30% converted natives. Now your Missionary Station will become permanent. Should 51 percent of the natives profess Christianity, then the chief will convert to your religion and place himself under your protection as a [concept_protectorate]. Years later, these areas can even be annexed if you have the technology to prevent malaria.\n\nIn the third stage you can actively make decisions via the Journal Entry. Either you strengthen the mission directly by sending additional missionaries, or you try to trade. You can acquire rare [Concept('concept_lepsius_artifact','$concept_lepsius_oceanic_artifacts|q$')], [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals|q$')] or pearls that increase the standard of living of the rich."
 concept_manzoni_literary_tradition: "Литературная традиция"
 concept_klimt_painters: "#PURPLE #b Художники#!#!"
 concept_klimt_painting_tradition: "Художественная традиция"
 concept_vikelas_sports: "Спорт"
 concept_vikelas_sports_desc: "#b Спорт#! - одна из главных особенностей мода [concept_morgenroete].\n\nКак только страна открывает #b организованный спорт#!, она получает доступ к различным видам спортивной деятельности. Самым важным является основание [Concept('concept_vikelas_ioc', 'Международного олимпийского комитета')], который начнёт организовывать [Concept('concept_vikelas_olympic_games', 'Олимпийские игры')]. Олимпийские игры дадут вам шанс выиграть золотые медали, которые принесут вашей стране [Concept('concept_prestige', 'престиж')]."
 concept_vikelas_olympic_games: "Олимпийские игры"
 concept_vikelas_olympic_games_desc: "Once the [concept_vikelas_ioc] is founded, the #b Olympic Games#! can take place every 4 years. Each time the Committee will vote for a #b Host#!. The host country will get a big [concept_prestige] boost.\n During the Olympic Games your Athletes will compete for medals. Many factors influence how many Medals you will get. Your population has a small influence, the [concept_sol] has a bigger influence, some events influence your chances as well and so do great [Concept('concept_general', '$concept_generals|q$')] and great [Concept('concept_admiral', '$concept_admirals|q$')]. Additionally characters with the #b Athlete#! trait and Urban Centers with the #b Sports Facilities#! also give small boosts.\nAll those factors have an influence on how many medals out of the 12 Gold Medals your country will get. Each Gold Medal will grant you 5 [concept_prestige]."
 concept_vikelas_ioc: "Международный олимпийский комитет"
 concept_vikelas_ioc_desc: "Держава, исследовавшая технологию #V $vikelas_international_sports_tech$#!, может основать #b Международный олимпийский комитет#!, или сокращённо #b МОК#!. Затем МОК начнёт организовывать [Concept('concept_vikelas_olympic_games', 'Олимпийские игры')]. Каждый член МОК может участвовать в Олимпийских играх.\nСамыми важными членами МОК являются #b члены правления#!. Основатель МОК станет #b президентом#! и, следовательно, навсегда останется членом правления, в то время как другие члены будут избираться каждые 4 года. В правлении есть место для 5 великих держав, 2 европейских, 2 азиатских, 2 американских, 1 африканской и 1 океанийской державы.\nОсновная задача членов правления - выбор следующей принимающей страны Игр. На выбор будет 3 кандидата (или 4, если страна решит подкупить правление).\nЕсли Греция основывает МОК, Олимпийские игры будут проводиться только в Греции, в результате чего правление будет менее важным, так как оно не выбирает принимающую страну."
 concept_lepsius_exhibition_desc: "Your [concept_lepsius_museum] will automatically set up Exhibitions (in form of a [concept_production_method] for each region) if you have enough [Concept('concept_lepsius_artifact','$concept_lepsius_minor_artifacts|q$')] of the same kind. For normal Artifacts the first Exhibition will be created for 10 or more artifacts. From there better Exhibitions are possible with 25 (Medium Exhibition), 50 (Large Exhibition) and 100 Minor Artifacts (Excellent Exhibition). The Excellent Exhibition additionally needs one [concept_lepsius_major_artifact].\n\nLocal Artifacts have a less diverse set of Exhibitions as they are limited to a regular and a grand Exhibition. The regular Exhibition requires 25 local Artifacts and the Grand Exhibition requires 50."
 concept_vikelas_racer: "Автогонщик"
 concept_vikelas_racers: "Автогонщики"
 concept_vikelas_racer_desc: "#b Автогонщик#! - это особый [Concept('concept_character', 'персонаж')], участвующий в [Concept('concept_vikelas_car_racing', 'автогонках')]. Помимо [Concept('concept_vikelas_race_car', 'гоночного автомобиля')], гонщик - важнейший фактор победы в автогонке. Его личные качества имеют решающее значение."
 concept_vikelas_car_racing: "Автогонки"
 concept_vikelas_car_racing_desc: "Car Racing is a sport in which [Concept('concept_vikelas_racer','$concept_vikelas_racers|q$')] compete against each other either on a track or on regular roads."
 concept_lepsius_archaeological_exhibition: "Археологическая выставка"
 concept_elgar_opera_desc: "#b Опера#! - это музыкальный центр державы. Здесь собираются самые важные музыканты и играют для масс.\n#b Опера#! - это отдельное сооружение, которое можно построить в областях, если городской центр достиг как минимум 5-го уровня. #b Опера#! будет производить музыку и потреблять инструменты. Чем выше уровень #b оперы#!, тем больше [Concept('concept_elgar_musical_tradition', 'музыкальной традиции')] будет производиться каждый год.\nКроме того, с #b оперой#! вы получаете доступ к некоторым решениям, таким как посещение вашей оперы."
 concept_elgar_impressionism_desc: "#b Импрессионизм#! - это стиль в истории искусства, который характеризуется атмосферным изображением мимолётных моментов сцены. Он возник из движения в живописи во Франции во второй половине XIX века. Термин «импрессионизм» также применялся к определённым стилям в музыке, литературе, кино и фотографии. В то время как многие натуралисты, такие как Генрих Гарт, отвергали музыку как средство выражения «ищущего истину акционизма», импрессионисты часто рассматривали «беспредметное погружение в мечты» под тонко градуированные красочные аккорды как удовольствие.\n\nВ игре #b импрессионизм#! можно разблокировать только с помощью записи в дневнике, которая требует 1000 единиц [Concept('concept_elgar_musical_tradition', 'музыкальной традиции')], [Concept('concept_elgar_opera', 'оперного театра')], могущественных землевладельцев, немогущественных промышленников и интеллигенции с одобрением выше 5. Если вы выберете #b импрессионизм#!, вы не сможете разблокировать две другие ветви.\n\nВ центре внимания #b импрессионизма#! в игре находится музыка. Поэтому он даст вам самый большой бонус к [Concept('concept_elgar_musical_tradition', 'музыкальной традиции')]."
 concept_elgar_expressionism_desc: "#b Экспрессионизм#! - это стиль в искусстве. Его истоки и предшественники можно найти в конце XIX века. Как импрессионизм, символизм и фовизм, экспрессионизм является движением против тенденций натурализма. В экспрессионизме выразительный уровень преобладает над эстетическим, апеллятивным и фактическим. Художник хочет представить зрителю свой опыт. В отличие от музыкального импрессионизма, который изображает восприятие внешнего вида вещей, экспрессионистские художественные движения формулируют эмоции человеческой души.\n\nВ игре #b экспрессионизм#! можно разблокировать только с помощью записи в дневнике, которая требует 1000 единиц [Concept('concept_elgar_musical_tradition', 'музыкальной традиции')], [Concept('concept_elgar_opera', 'оперного театра')], могущественной интеллигенции или профсоюзов, немогущественных землевладельцев, и либо интеллигенция, либо профсоюзы должны иметь одобрение 5 или выше. Если вы выберете #b экспрессионизм#!, вы не сможете разблокировать две другие ветви.\n\nВ центре внимания #b экспрессионизма#! в игре должна была бы быть литература, но она ещё не реализована."
 concept_elgar_art_nouveau_desc: "#b Ар-нуво#! - это художественный стиль, который развился из движения «#italic Искусства и ремёсла#!» и был вдохновлён природными формами. Он часто фокусировался на динамизме и движении и использовал современные материалы.\n\nВ игре #b ар-нуво#! можно разблокировать только с помощью записи в дневнике, которая требует 1000 единиц [Concept('concept_elgar_musical_tradition', 'музыкальной традиции')], [Concept('concept_elgar_opera', 'оперного театра')], могущественных промышленников и интеллигенции с одобрением 5 или выше. Если вы выберете #b ар-нуво#!, вы не сможете разблокировать две другие ветви.\n\nВ центре внимания #b ар-нуво#! и #b ар-деко#!, следующей технологии в этой ветви, находится архитектура. Вы будете получать различные события и записи в дневнике об архитектурных достижениях и сможете получить [Concept('concept_gaudi_architectural_splendour', 'архитектурное великолепие')]."
 concept_elgar_composer: "#PURPLE #b Композитор#!#!"
 concept_elgar_composers: "#PURPLE #b Композиторы#!#!"
 concept_elgar_composer_desc: "#b Composers#! are men and women who compose music. Composers are special character types that you can gain either from events, from gaining enough [concept_artistic_progress] to create one in your nation or by offering a position to a [concept_elgar_travelling_composer].\nOnce you have a #b Composer#! you can let them start [Concept('concept_elgar_composing','$concept_elgar_composing_lower_case|q$')], [Concept('concept_elgar_conducting','$concept_elgar_conducting_lower_case|q$')], to go on [Concept('concept_elgar_musical_tour','$concept_elgar_musical_tours|q$')] or composing [Concept('concept_elgar_musical_masterwork','$concept_elgar_musical_masterwork_masterworks|q$')]. Each action is different in what the composer does, what they require and what you gain from them. The #b Composer#! will be [Concept('concept_elgar_composer_exhaustion','$concept_elgar_composer_exhaustion_exhausted|q$')] after every task and need to rest for a while until he can work again.\nDuring their life, #b Composers#! will gain [concept_artists_experience] and sometimes lose it again. The higher the #b Reputation#!, the greater the benefits of a #b Composer's#! actions will be. #b Composers#! reaching a #b Reputation#! of 500 will become [Concept('concept_elgar_great_composer','$concept_elgar_great_composers|q$')], Titans of Music, known throughout the world."
 concept_elgar_great_composer: "#PURPLE #b Великий композитор#!#!"
 concept_elgar_great_composers: "#PURPLE #b Великие композиторы#!#!"
 concept_elgar_great_composer_desc: "#b Great Composers#! are the Titans of music. The ones whose names will be known for all eternity. [Concept('concept_elgar_composer','$concept_elgar_composers|q$')] reaching 500 [concept_artists_experience], will become #b Great Composers#!. This will greatly increase their efficiency and let your nation gain way more [concept_elgar_musical_tradition]. A #b Great Composer#! can create a [concept_elgar_musical_masterwork] way faster for example."
 concept_elgar_travelling_composer: "Странствующий композитор"
 concept_elgar_travelling_composers: "Странствующие композиторы"
 concept_elgar_travelling_composer_desc: "#b Travelling Composers#! are [Concept('concept_elgar_composer','$concept_elgar_composers|q$')] that are not hired by any nation. Instead they travel around on concert tours. You can possibly aquire a #b Travelling Composer#!, but the more [concept_artists_experience] they have the more demands they will have.\nTo invite a #b Travelling Composer#! you need to at least have an [Concept('concept_elgar_opera','$concept_elgar_opera_house|q$')]. #b Composers#! with a higher #b Reputation#! will demand bigger Opera Houses, modern music [Concept('concept_technology', '$concept_technologies|q$')], a certain [concept_elgar_musical_tradition] and some might only join [Concept('concept_major_power', '$concept_major_power_short|q$')] or [Concept('concept_great_power', '$concept_great_powers|q$')].\nA special case are [Concept('concept_elgar_national_composer','$concept_elgar_national_composers|q$')] that are only available to nations that are of the same or a very similar national identity."
 concept_elgar_national_composer: "Национальный композитор"
 concept_elgar_national_composers: "Национальные композиторы"
 concept_elgar_national_composer_desc: "#b National Composers#! are [Concept('concept_elgar_composer','$concept_elgar_composers|q$')] who value their nation very much. They will not be able to be hired by other nations.\nWhether a #b National Composer#! is available to you or not is decided by their culture's [Concept('concept_discrimination_trait', '$concept_cultural_traits|q$')]. One of your primary cultures needs to share both a non-heritage #b Trait#! as well as a [concept_language_trait]. This means that a North German #b National Composer#! will be available to German Countries as well as Switzerland."
 concept_elgar_composing: "Сочинение музыки"
 concept_elgar_composing_lower_case: "сочинение музыки"
 concept_elgar_composing_compose: "сочинять"
 concept_elgar_composing_desc: "A [concept_elgar_composer] who #b composes#! receives 5 [concept_artists_experience] per year and adds 5 [concept_elgar_musical_tradition] to the country. In addition, he creates a random number of compositions each year. A #b Composer#! with special skills such as Conductor, Virtuoso, Innovative or Meticulous creates one additional composition per year. The number of compositions is decisive for success in later [Concept('concept_elgar_musical_tour','$concept_elgar_musical_tour_tours|q$')]. A #b Composer#! composes until the action is canceled in the Journal Entry. A #b Composer#! who composes costs the country a small annual maintenance fee."
 concept_elgar_conducting: "Дирижирование"
 concept_elgar_conducting_lower_case: "дирижирование"
 concept_elgar_conducting_conduct: "дирижировать"
 concept_elgar_conducting_desc: "[Concept('concept_elgar_composer', '#b #PURPLE Композитор#!#!')] будет заниматься #b дирижированием#! в течение 24 месяцев и организует концертный сезон. Это улучшит выпуск музыки случайной [Concept('concept_elgar_opera', 'оперы')] на 5-10 лет, даст вашей державе небольшой прирост [Concept('concept_elgar_musical_tradition', 'музыкальной традиции')] и даст вашему #b композитору#! средний прирост его [Concept('concept_artists_experience', 'репутации')]. Если ваш #b композитор#! ещё не является дирижёром, он может получить эту [Concept('concept_character_trait', 'черту характера')] в конце сезона. Вам придётся платить #b композитору#!, пока он #b дирижирует#!."
 concept_elgar_musical_tour: "Концертный тур"
 concept_elgar_musical_tours: "Концертные туры"
 concept_elgar_musical_tour_tour: "Тур"
 concept_elgar_musical_tour_tours: "Туры"
 concept_elgar_musical_tour_desc: "[Concept('concept_elgar_composer', '#b #PURPLE Композитор#!#!')] может отправиться в #b концертный тур#! за границу на 30 месяцев. #b Концертные туры#! повышают [Concept('concept_prestige', 'престиж')] державы #b композитора#!. Кроме того, #b композитор#! получает прирост [Concept('concept_artists_experience', 'репутации')] в конце #b тура#!, который зависит от количества произведений #b композитора#!, а также от его черт.\n#b Композиторам#! с менее чем 20 произведениями, вероятно, не следует отправляться в #b туры#!, а #b композиторы#! с чертой «#b Сдержанный#!» не могут отправляться в #b туры#!."
 concept_elgar_musical_masterwork: "Музыкальный шедевр"
 concept_elgar_musical_masterworks: "Музыкальные шедевры"
 concept_elgar_musical_masterwork_masterwork: "Шедевр"
 concept_elgar_musical_masterwork_masterworks: "Шедевры"
 concept_elgar_musical_masterwork_of_music: "Музыкальный шедевр"
 concept_elgar_musical_masterworks_of_music: "Музыкальные шедевры"
 concept_elgar_musical_masterwork_desc: "[Concept('concept_elgar_composer', '#b #PURPLE Композитор#!#!')] может начать сочинять #b шедевр#!, что займёт несколько лет. Чем больше [Concept('concept_artists_experience', 'репутации')] у #b композитора#!, тем быстрее он закончит. Как только #b шедевр#! будет сочинён, #b композитор#! получит 50 единиц [Concept('concept_artists_experience', 'репутации')], а страна получит до 150 единиц [Concept('concept_elgar_musical_tradition', 'музыкальной традиции')] в зависимости от своего [Concept('concept_rank', 'ранга')].\n#b Композитор#! может создать максимум 3 #b шедевра#! и будет нуждаться в финансовой поддержке своей страны во время работы над ним."
 concept_elgar_composer_exhaustion: "Истощение композитора"
 concept_elgar_composer_exhaustion_exhausted: "истощён"
 concept_elgar_composer_exhaustion_desc: "Once a [concept_elgar_composer] finished [Concept('concept_elgar_composing','$concept_elgar_composing_lower_case|q$')], [Concept('concept_elgar_conducting','$concept_elgar_conducting_lower_case|q$')], composing [Concept('concept_elgar_musical_masterwork','$concept_elgar_musical_masterwork_masterworks|q$')] or a [Concept('concept_elgar_musical_tour','$concept_elgar_musical_tours|q$')], he will be #b exhausted#! from the work. An #b exhausted Composer#! will not be able to work for some time. The older the #b Composer#!, the longer it takes get rid of the #b Exhaustion#!."
 concept_manzoni_writer: "#PURPLE #b Писатель#!#!"
 concept_manzoni_writers: "#PURPLE #b Писатели#!#!"
 concept_klimt_painter: "#PURPLE #b Художник#!#!"
 concept_pm_artists_academy_conservatory: "#b #PURPLE Консерватория#!#!"
 concept_pm_artists_academy_conservatory_desc: "A Conservatory will specializes the Arts Academy for Music. If you have a Conservatory, you will be able to promote [Concept('concept_elgar_composer','$concept_elgar_composers|q$')]. You will get a #n negative throughput modifier#! for the Art Academy as well as a #n negative effect#! on your [concept_artistic_progress] when you change this production method."
 concept_pm_artists_academy_salon: "#b #PURPLE Литературный салон#!#!"
 concept_pm_artists_academy_salon_desc: "A Literary Salon will specializes the Arts Academy for Literature. If you have a Literature Salon, you will be able to promote [Concept('concept_manzoni_writer','$concept_manzoni_writers|q$')]. You will get a #n negative throughput modifier#! for the Art Academy as well as a #n negative effect#! on your [concept_artistic_progress] when you change this production method."
 concept_pm_artists_academy_studio: "#b #PURPLE Художественная студия#!#!"
 concept_pm_artists_academy_studio_desc: "An Art Studio will specializes the Arts Academy for Painting. If you have a Art Studio, you will be able to promote [Concept('concept_klimt_painter','$concept_klimt_painters|q$')]. You will get a #n negative throughput modifier#! for the Art Academy as well as a #n negative effect#! on your [concept_artistic_progress] when you change this production method."
 concept_pm_artists_academy_specialization: "Специализация Академии искусств"
 concept_pm_artists_academy_specialization_desc: "Every Arts Academy can be specialized by changing its production method.\nAn Arts Academy with a [concept_pm_artists_academy_conservatory] will allow you to promote [Concept('concept_elgar_composer','$concept_elgar_composers|q$')].\nAn Arts Academy with a [concept_pm_artists_academy_salon] will allow you to promote [Concept('concept_manzoni_writer','$concept_manzoni_writers|q$')].\nAn Arts Academy with an [concept_pm_artists_academy_studio] will allow you to promote [Concept('concept_klimt_painter','$concept_klimt_painters|q$')].\nChanging the Specialization will have a #n short negative effect#! for the building and your [concept_artistic_progress]."
 concept_artists_artist: "Деятель искусства"
 concept_artists_artists: "Деятели искусства"
 concept_artistic_progress: "Творческий прогресс"
 concept_artistic_progress_desc: "Накопив 1000 единиц #b творческого прогресса#!, вы можете получить нового [Concept('concept_artists_artist', 'деятеля искусства')]. Чтобы вообще иметь доступ к #b творческому прогрессу#!, у вас должна быть либо #b Академия искусств#!, либо #b Опера#!.\nПрирост #b творческого прогресса#! зависит от различных факторов. Например, чем выше ваша [concept_literacy|l], тем быстрее вы накапливаете #b творческий прогресс#!. Подробную информацию обо всех факторах, влияющих на творческий прогресс, вы можете получить на панели инструментов индикатора творческого прогресса в окне искусств."
 concept_artists_experience: "Репутация"
 concept_artists_experience_desc: "Каждый [concept_artists_artist|l] имеет #b репутацию#!. Репутация отражает, насколько уважаем деятель искусства. Деятели искусства начинают с небольшим количеством репутации и могут получать дополнительную репутацию, работая в своей области. Деятели искусства, набравшие репутацию 500, станут #b великими деятелями искусства#! и получат соответствующую [Concept('concept_character_trait', 'черту характера')]."
 concept_manzoni_great_writer: "Великий писатель"
 concept_manzoni_local_writer: "Местный писатель"
 concept_artists_center_of_arts: "Центр искусств"
 concept_artists_centers_of_arts: "Центры искусств"
 concept_artists_center_of_classicism: "Центр классицизма"
 concept_artists_center_of_romanticism: "Центр романтизма"
 concept_artists_center_of_realism: "Центр реализма"
 concept_artists_center_of_impressionism: "Центр импрессионизма"
 concept_artists_center_of_expressionism: "Центр экспрессионизма"
 concept_artists_center_of_art_nouveau: "Центр ар-нуво"
 concept_klimt_great_painter: "#PURPLE #b Великий художник#!#!"
 concept_klimt_great_painters: "#PURPLE #b Великие художники#!#!"
 concept_klimt_great_painter_desc: "#b Great Painters#! are [Concept('concept_klimt_painter','$concept_klimt_painters|q$')] that will be known for eternity. #b Painters#! reaching 500 [concept_artists_experience], will become #b Great Painters#!. This will greatly increase their efficiency and let your nation gain way more [concept_klimt_painting_tradition]."
 concept_klimt_independent_painter: "Независимый художник"
 concept_klimt_independent_painters: "Независимые художники"
 concept_klimt_painter_trip: "Образовательное путешествие"
 concept_klimt_painter_trip_journeys: "Путешествия"
 concept_elgar_music_desc: "#b Music Culture#! is one of the main features of [concept_morgenroete]. During the 19th and 20th Century, Music was important as a mean to entertain the populace and to show a nations greatness.\n\nTo access most of the Music content in #r Morgenröte#! you will need to build an [concept_elgar_opera]. The #b Opera#! will produce Music but needs Instruments to operate. Apart from producing #b Music #! for your populace to consume, #b Operas#! will slowly add [concept_elgar_musical_tradition] to your Country.\n\n#b Musical Tradition#! reflects a nation's musical achievements and traditions. The amount of #b Musical Tradition#! gives you a prestige bonus and allows you to choose a path for your nation's art to go forward. You can either go the route of [concept_elgar_impressionism], [concept_elgar_expressionism] or [concept_elgar_art_nouveau]. Each one of these Art Styles has another focus.\n\nA good way to gain even more #b Musical Tradition#! is by getting a [concept_elgar_composer]. A composer will be able to [Concept('concept_elgar_composing','$concept_elgar_composing_compose|q$')], [Concept('concept_elgar_conducting','$concept_elgar_conducting_conduct|q$')], go on [Concept('concept_elgar_musical_tour','$concept_elgar_musical_tours|q$')] and even create [Concept('concept_elgar_musical_masterwork','$concept_elgar_musical_masterworks_of_music|q$')]. These actions will either improve the #b Composer's#! [concept_artists_experience] or improve your nations #b Musical Tradition#!."
 concept_artists_center_of_arts_desc: "A #b Center of Arts#! is a center of an [concept_artists_art_style] that gets created in a [concept_state_region] once an #b Art Style#! gets invented. There is only one #b Center of Arts#! per #b Art Style#!.\n#b Center of Arts#! are especially important for [Concept('concept_klimt_painter','$concept_klimt_painters|q$')] that can take [concept_klimt_painter_trip] to study the #b Art Style#! there. Apart from that some #b Center of Arts#! offer unique events that will happen there. Some for example allow you to win [Concept('concept_klimt_art_prize','$concept_klimt_art_prizes|q$')]."
 concept_klimt_painting_culture: "Художественная культура"
 concept_klimt_painting_culture_desc: "#b Painting Culture#! is one of the main features of [concept_morgenroete]. During the 19th and 20th Century, Painting developed rapidly resulting in various new [Concept('concept_artists_art_style','$concept_artists_art_styles|q$')] that brought a lot of progress to individuals and countries.\n\nTo access most of the Painting content in #r Morgenröte#! you will need to build an #b Arts Academy#!. #b Arts Academies#! allow you to start gaining [concept_klimt_painting_tradition] and to recruit new [Concept('concept_klimt_painter','$concept_klimt_painters|q$')]\n\n#b Painters#! will create paintings and #b Masterworks#! for your country and give you a big amount of #b Painting Tradition#!. As there are different [Concept('concept_artists_art_style','$concept_artists_art_styles|q$')] for #b Painters#! to focus on, you can let them study additional #b Art Styles#! on a [concept_klimt_painter_trip]. Once they turn 40 years old, #b Painters#! will specialize in one of their #b Art Styles#! and focus on creating paintings in that #b Art Style#!."
 concept_artists_art_style: "Художественный стиль"
 concept_artists_art_styles: "Художественные стили"
 concept_artists_art_style_style: "Стиль"
 concept_artists_art_style_desc: "#b Художественный стиль#! - это определённое направление в искусстве. Некоторые #b художественные стили#! существуют с самого начала, например, #b классицизм#! и #b романтизм#!. Другие, #b реализм#!, #b иррационализм#!, [concept_elgar_impressionism], [concept_elgar_expressionism] и [concept_elgar_art_nouveau], появляются позже после выполнения определённых условий. Каждый #b художественный стиль#! имеет соответствующий [Concept('concept_artists_center_of_arts', 'центр искусств')] в [Concept('concept_state_region', 'регионе')], где он зародился."
 concept_klimt_painter_desc: "#PURPLE #b Painters#!#! are men and women that create paintings and other pieces of art. #b Painters#! are special character types that you can gain either from events, from gaining enough [concept_artistic_progress] to create one in your nation or by offering a position to a [concept_klimt_independent_painter].\n#b Painters#! will immediately start to paint and create a number of paintings each year depending on their [Concept('concept_character_trait','$concept_character_traits|q$')]. Sometimes they can even create a #b Masterwork#! that will give you even more [concept_klimt_painting_tradition].\n#b Painters#! can study different [Concept('concept_artists_art_style','$concept_artists_art_styles|q$')] on [Concept('concept_klimt_painter_trip','$concept_klimt_painter_trip_journeys|q$')]. Each #b Painter#! will specialize in an #b Art Style#! once they are 40 years old which will allow them to paint #b Masterworks#! of a certain Style."
 concept_klimt_independent_painter_desc: "[Concept('concept_klimt_painter','$concept_klimt_painters|q$')] that are not hired by a country are #b Independent Painters#!. #b Independent Painters#! can be hired by countries that have a [Concept('concept_primary_cultures','$concept_primary_culture|q$')] that shares a [concept_discrimination_trait] with the culture of the #b Painter#!.\n#b Independent Painters#! have various requirements for their host country. You will need #b Arts Academies#!, certain [Concept('concept_technology', '$concept_technologies|q$')] or [concept_klimt_painting_tradition] depending on the #b Painter's#! [concept_artists_experience]. Additionally you will have to pay them a sum of money that depends on their #b Renown#! as well as your country's financial capabilities."
 concept_klimt_painter_trip_desc: "A [concept_klimt_painter] can learn new [Concept('concept_artists_art_style','$concept_artists_art_styles|q$')] on an #b Educational Journey#! to one of the [Concept('concept_artists_center_of_arts','$concept_artists_centers_of_arts|q$')].\nOn such a #b Trip#! a painter can gain positive and negative [Concept('concept_character_trait','$concept_character_traits|q$')] that will influence their work and the number of paintings they create. Each #b Center of Arts#! has slightly different events and will give the #b Painter#! a unique #b Trait#! at the end that can later become the #b Painter's#! Specialization."
 concept_klimt_art_prize: "Художественный приз"
 concept_klimt_art_prizes: "Художественные призы"
 concept_klimt_art_prize_desc: "Время от времени проводятся художественные конкурсы, на которых вручаются призы, способствующие повышению репутации художника. Державы, имеющие [Concept('concept_artists_center_of_arts', 'центр искусств')] для иррационализма или [Concept('concept_elgar_impressionism', 'импрессионизма')], выбирают лучших музыкантов на конкурсе, который проходит каждые пять лет. Владельцы [Concept('concept_klimt_art_gallery', 'художественной галереи')] или #b центра искусства реализма#! проводят конкурс живописи, который проходит каждые пять лет. Страна, из которой происходят победители, также получает музыкальную или художественную традицию. Особой формой художественного конкурса является биеннале, которая каждые два года присуждает всеобъемлющий художественный приз стране, у которой есть художники с самой высокой репутацией, что повышает все значения культурной традиции."
 concept_klimt_art_gallery: "Художественная галерея"
 concept_klimt_art_gallery_desc: "The #b Art Gallery#! is a special building in a nation's capital that is available starting with #b Realism#!. It can only be built if the nation has a [concept_klimt_painter] with specialization. #b Painters#! with a specialization unlock the collection of their [Concept('concept_artists_art_style','$concept_artists_art_style_style|q$')] - that is, an artist with a specialization in the Romantic style unlocks a collection of Romanticism. In order to upgrade a collection to an excellent collection, a masterpiece of this kind is required, which must either be painted by a painter or acquired from abroad."
 concept_manzoni_writer_novelist: "Романист"
 concept_manzoni_writer_desc: "A #b Writer#! is a special character that will write works of literature for your country. #b Writers#! usually start as [concept_manzoni_local_writer] and will write #b Publications#! and sometimes even [Concept('concept_manzoni_bestseller','$concept_manzoni_bestsellers|q$')]. A #b Bestseller#! will grant the #b Writer#! a big amount of [concept_artists_experience] and [concept_manzoni_literary_tradition] to your country. There is a chance to write a #b Bestseller#! every year, depending on how close the #b Writer's#! [concept_manzoni_genre] is to the [concept_manzoni_popular_taste].\n\nA well known #b Writer#! whose [concept_interest_group] is happy enough, can become your [concept_manzoni_national_writer]. A #b National Writer#! can gain [Concept('concept_manzoni_book_licence','$concept_manzoni_book_licences|q$')] or create a Newspaper Novel. If a #b Writer#! gains 500 #b Reputation#! they can become a [concept_manzoni_great_writer] and provide your country with even more #b Literary Tradition#!.\n\nBe careful, if #b Writers#! are unhappy with the political situation in a country, they can decide to become [Concept('concept_agitator', '$concept_agitators|q$')] or interfere in the political discourse."
 concept_manzoni_great_writer_desc: "#b Великий писатель#! - это [concept_manzoni_writer], известный во всём мире. #b Писатель#! может стать #b великим писателем#!, как только его [Concept('concept_artists_experience', 'репутация')] достигнет #V 500#!. Если ваш #b великий писатель#! является вашим [Concept('concept_manzoni_national_writer', 'национальным писателем')], вы получите бонус к ежегодному приросту [Concept('concept_manzoni_literary_tradition', 'литературной традиции')]."
 concept_manzoni_local_writer_desc: "Почти каждый [concept_manzoni_writer] начинает как #b местный писатель#!. В каждой стране может быть не более 3 #b местных писателей#!, которые будут создавать #b публикации#!, давать вам [Concept('concept_manzoni_literary_tradition', 'литературную традицию')], если их [Concept('concept_manzoni_genre', 'жанр')] соответствует [Concept('concept_manzoni_popular_taste', 'вкусу публики')], и получать [Concept('concept_artists_experience', 'репутацию')].\n#b Местный писатель#! с #b репутацией#! 150 и чья [Concept('concept_interest_group', 'заинтересованная группа')] не недовольна, может стать [Concept('concept_manzoni_national_writer', 'национальным писателем')] страны, что даст вам больше #b литературной традиции#! и другие дополнительные преимущества.\nИмейте в виду, что #b местные писатели#!, недовольные текущей политической ситуацией, могут начать вмешиваться в политический дискурс или даже стать [Concept('concept_agitator', 'агитаторами')]."
 concept_manzoni_national_writer: "Национальный писатель"
 concept_manzoni_national_writer_desc: "A #b National Writer#! is a type of [concept_manzoni_writer] that is considered to be the face of your country's literature. #b National Writers#! grant you a minimum of 1 and up to 5 [concept_manzoni_literary_tradition].\nYou can gain a #b National Writer#! by appointing one of your [Concept('concept_manzoni_local_writer','$concept_manzoni_local_writers|q$')]. To be able to appoint one of your #b Local Writers#! they must have at least #V 150#! [concept_artists_experience] and their [concept_interest_group] must have a positive [concept_approval].\n"
 concept_manzoni_bestseller: "Бестселлер"
 concept_manzoni_bestsellers: "Бестселлеры"
 concept_manzoni_bestseller_desc: "#b Бестселлер#! - это #b публикация#! [Concept('concept_manzoni_writer', '#b #PURPLE писателя#!#!')], которая очень хорошо продаётся, обычно потому, что [Concept('concept_manzoni_genre', 'жанр')] #b писателя#! соответствует или близок к текущему [Concept('concept_manzoni_popular_taste', 'вкусу публики')].\nКаждый год есть шанс, что [concept_manzoni_national_writer|l] или [concept_manzoni_local_writer|l] напишет #b бестселлер#!. Первый #b бестселлер#! принесёт большое количество [Concept('concept_manzoni_literary_tradition', 'литературной традиции')], а каждый #b бестселлер#! после первого принесёт стране значительное количество #b литературной традиции#!."
 concept_manzoni_genre: "Жанр"
 concept_manzoni_genres: "Жанры"
 concept_manzoni_genre_desc: "Every [Concept('concept_manzoni_writer','$concept_manzoni_writer_novelist|q$')] has a specific #b Genre#! for their writing. The #b Genre#! gets assigned when the #b Writer#! gets created and depends on many factors.\n#b Writers#! will gain more [concept_artists_experience] and write more [Concept('concept_manzoni_bestseller','$concept_manzoni_bestsellers|q$')] when their #b Genre#! matches or is close to the [concept_manzoni_popular_taste] of the country."
 concept_manzoni_popular_taste: "Вкус публики"
 concept_manzoni_popular_taste_audience: "Вкус аудитории"
 concept_manzoni_popular_tastes_audience: "Вкусы аудитории"
 concept_manzoni_popular_taste_desc: "Every nation's population has a #b Taste#! for a specific [concept_manzoni_genre]. About every 10 years this #b Taste#! will change depending on political, social and cultural changes in the country itself.\n[Concept('concept_manzoni_writer','$concept_manzoni_writers|q$')] who have a #b Genre#! matching the #b Taste#! or close to it will gain more [concept_artists_experience] and write more [Concept('concept_manzoni_bestseller','$concept_manzoni_bestsellers|q$')].\n\n#V Close Tastes:#!\n- #b $manzoni_taste_adventure_var_loc$#!: $manzoni_genre_science_fiction$, $manzoni_genre_juvenile$, $manzoni_genre_crime_mystery$\n- #b $manzoni_taste_crime_var_loc$#!: $manzoni_genre_science_fiction$, $manzoni_genre_adventure$, $manzoni_genre_romance$\n- #b $manzoni_taste_devotional_var_loc$#!: $manzoni_genre_juvenile$, $manzoni_genre_romance$, $manzoni_genre_adventure$\n- #b $manzoni_taste_juvenile_var_loc$#!: $manzoni_genre_adventure$, $manzoni_genre_devout$, $manzoni_genre_crime_mystery$\n- #b $manzoni_taste_literary_var_loc$#!: $manzoni_genre_social_critic$, $manzoni_genre_science_fiction$, $manzoni_genre_romance$\n- #b $manzoni_taste_romance_var_loc$#!: $manzoni_genre_devout$, $manzoni_genre_juvenile$, $manzoni_genre_literary_fiction$\n- #b $manzoni_taste_science_var_loc$#!: $manzoni_genre_adventure$, $manzoni_genre_social_critic$, $manzoni_genre_literary_fiction$\n- #b $manzoni_taste_social_var_loc$#!: $manzoni_genre_literary_fiction$, $manzoni_genre_juvenile$, $manzoni_genre_crime_mystery$"
 concept_manzoni_book_licence: "Книжная лицензия"
 concept_manzoni_book_licences: "Книжные лицензии"
 concept_manzoni_book_licence_desc: "Foreign publishers can get contracts with a [concept_manzoni_national_writer] and offer his books as translations in their own market. This happens when a writer meets the [Concept('concept_manzoni_popular_taste','$concept_manzoni_popular_tastes_audience|q$')] abroad. If an author gets at least five book licenses, his books are considered world literature. He can then go on a reading tour."
 concept_manzoni_local_writers: "Местные писатели"
 concept_manzoni_library: "Национальная библиотека"
 concept_manzoni_library_desc: "Ваша #b национальная библиотека#! будет автоматически создавать книжные коллекции (в виде [Concept('concept_production_method', 'метода производства')]), если у вас будет достаточно [Concept('concept_manzoni_publications', 'публикаций')]. Первая книжная коллекция будет создана при наличии 1000 или более публикаций. После этого возможны лучшие коллекции с 2500 (крошечная книжная коллекция), 5000 (малая книжная коллекция), 10 000 (средняя книжная коллекция), 25 000 (большая книжная коллекция), 50 000 (превосходная книжная коллекция) и 100 000 (великая книжная коллекция) публикаций."
 concept_manzoni_publications: "Публикации"
 concept_manzoni_publications_desc: "#b Публикации#! включают все вновь изданные книжные наименования, газеты, эссе и другие подобные письменные продукты в державе. Они не тождественны @manzoni_prints! $manzoni_prints$, циркулирующим в качестве товаров. Публикации могут появляться и независимо от издательской индустрии, например, через собственные типографии правительственных зданий или университетов. Учёные и частные лица также производят публикации в зависимости от их уровня грамотности. Однако львиную долю составляет издательская индустрия, и решающим фактором является то, используется ли современный метод производства или нет. Большое количество публикаций является основополагающим для расширения [Concept('concept_manzoni_library', 'национальной библиотеки')]."
 concept_curtiss_tourism: "Туризм"
 concept_curtiss_tourism_desc: "Туризм обеспечивает культурно превосходящей державе дополнительный доход. Уникальные памятники, музеи и художественные галереи, археологические объекты, центры искусств, а также высокие значения в различных культурных традициях являются факторами, которые делают державу привлекательным туристическим направлением. Законы, повышающие свободу передвижения и экономическую деятельность, также способствуют увеличению доходов от туризма. Инфраструктура также играет решающую роль - ведь до удалённых мест невозможно добраться. Аэропорт, в частности, революционизирует туризм и обеспечивает значительный рост доходов."
 concept_curtiss_private_airline: "Частная авиакомпания"
 concept_mendelejew_chemist: "#b #ORANGE Химик#!#!"
 concept_manzoni_literature: "Литературная культура"
 concept_manzoni_literature_desc: "#b Literary Culture#! is one of the main features of [concept_morgenroete]. Print culture and newspaper culture in particular experienced significant upheavals in the 19th and 20th centuries. The mass of printed products and everyday use is represented by the printing industry. The cultural value of the literature produced is reflected in the [concept_manzoni_literary_tradition]. The latter depends largely on the [Concept('concept_manzoni_writer','$concept_manzoni_writers|q$')] of a country, and there are [Concept('concept_manzoni_local_writer','$concept_manzoni_national_writers|q$')] and [Concept('concept_manzoni_national_writer','$concept_manzoni_local_writers|q$')]. Whether they live in the shadows or become celebrated authors depends on the [concept_manzoni_popular_taste]."
 concept_morgenroete_desc: "#r Morgenröte - Dawn of Flavor #! is a mod created to broaden the cultural and scientific aspects of Victoria 3. It features content for various aspects of the Victorian Age:\n\n#V Science:#!\n #indent_newline:3 • Tesla: [concept_tesla_engineering]#!\n #indent_newline:3 • Mendeleev: [concept_mendelejew_chemistry]#!\n #indent_newline:3 • Verrier: [concept_verrier_astronomy]#!\n #indent_newline:3 • Curie: [concept_curie_physics]#!\n #indent_newline:3 • Agassiz: [concept_agassiz_geology]#!\n #indent_newline:3 • Dubois: [Concept('concept_dubois_natural_history','$concept_dubois_natural_history_paleontology|q$')]#!\n #indent_newline:3 • Ito: [concept_dubois_natural_history]#!\n #indent_newline:3 • Theiler: [concept_theiler_biology]#!\n #indent_newline:3 • Panum: [concept_panum_medicine]#!\n #indent_newline:3 • Lepsius: [concept_lepsius_archaeology]#!\n #indent_newline:3 • Andersson: [concept_andersson_anthropology]#!\n\n#V Art:#!\n#indent_newline:3 • Gaudí: [concept_elgar_architecture]#!\n#indent_newline:3 • Elgar: [concept_elgar_music]#!\n#indent_newline:3 • Manzoni: [concept_manzoni_literature]#!\n#indent_newline:3 • Klimt: [concept_klimt_painting_culture]#!\n\n#V Sports:#!\n#indent_newline:3 • Douglas: [concept_douglas_mountaineering]#!\n#indent_newline:3 • Vikelas: [concept_vikelas_sports] and [concept_vikelas_car_racing]#!\n#indent_newline:3 • Curtiss: [concept_curtiss_aviation]#!"
 concept_agassiz_mineral: "Минерал"
 concept_agassiz_minerals: "Минералы"
 concept_agassiz_mineral_desc: "Minerals are all types of special types of rock that do not fall under the known resources used in industry. A nation receives a certain number of minerals annually once it has invented the #b Geology#! Technology. If a [Concept('concept_agassiz_geologist','$concept_agassiz_geologists|q$')] is in the service of this nation, he can find additional minerals. Locations of minerals are characterized by state modifiers: mountains, deserts, arctic areas, raw material deposits (coal, iron and sulfur areas, for example) as well as geological [Concept('concept_dubois_formation','$concept_dubois_formations|q$')] and volcanoes. Deserts and arctic areas are considered to be poor in minerals, while great geological formations and volcanoes are considered to be particularly rich in minerals. A more valuable form of minerals are [Concept('concept_agassiz_rare_mineral','$concept_agassiz_rare_minerals|q$')]."
 concept_agassiz_rare_mineral: "Редкий минерал"
 concept_agassiz_rare_minerals: "Редкие минералы"
 concept_agassiz_rare_mineral_desc: "[Concept('concept_agassiz_geologist','$concept_agassiz_geologists|q$')] can find Rare Minerals on their expeditions, such as [Concept('concept_dubois_pacific_expedition','$concept_dubois_pacific_expeditions|q$')], [concept_douglas_mountaineering] expeditions, [concept_agassiz_volcano] expeditions or during mineral prospecting. Unlike common [Concept('concept_agassiz_mineral','$concept_agassiz_minerals|q$')], they are only found in very limited quantities. Rare Minerals are used to build a mineral cabinet."
 concept_agassiz_geologist: "#b #GREEN Геолог#!#!"
 concept_agassiz_geologists: "#b #GREEN Геологи#!#!"
 concept_agassiz_geologist_desc: "#b #GREEN Geologists#!#! are [Concept('concept_academics_academic','$concept_academics_academics|q$')] who primarily study rocks and earth history. They locate [Concept('concept_dubois_formation','$concept_dubois_formations|q$')] and [Concept('concept_curie_uranium','$concept_curie_uranium|q$')] deposits, which makes them irreplaceable colleagues for [Concept('concept_dubois_paleontologist','$concept_dubois_paleontologists|q$')] and [Concept('concept_curie_physicist','$concept_curie_physicists|q$')]. During their expeditions, they may find additional [Concept('concept_agassiz_mineral','$concept_agassiz_minerals|q$')] that a [concept_mendelejew_chemist] can use to discover or isolate [Concept('concept_mendelejew_element','$concept_mendelejew_elements|q$')]. They can find new deposits of raw materials. They are also active as volcanologists and can go on expeditions to local [Concept('concept_agassiz_volcano','$concept_agassiz_volcanoes|q$')] to research them in more detail. Together with [Concept('concept_tesla_engineer','$concept_tesla_engineers|q$')], they can develop new devices, such as seismographs, to learn more about the Earth's interior. Geologists can take part in [Concept('concept_dubois_pacific_expedition','$concept_dubois_pacific_expeditions|q$')] and [concept_douglas_mountaineering] expeditions."
 concept_agassiz_volcano: "Вулкан"
 concept_agassiz_volcanoes: "Вулканы"
 concept_curie_physicist: "#b #ORANGE Физик#!#!"
 concept_curie_physicists: "#b #ORANGE Физики#!#!"
 concept_curie_physicist_desc: "A #b Physicist#! is an [concept_academics_academic] who studies the laws of nature, matter, energy, and their interactions across all dimensions of space and time; he or she conducts research in all areas of [concept_curie_physics]. Due to the wide-ranging fields—from mathematics to nuclear physics—there are four different types of physicists who focus on a specific subfield: [Concept('concept_curie_mathematical_physicist','$concept_curie_mathematical_physicists|q$')], [Concept('concept_curie_meteorological_physicist','$concept_curie_meteorological_physicists|q$')], [Concept('concept_curie_rocket_physicist','$concept_curie_rocket_physicists|q$')] and [Concept('concept_curie_nuclear_physicist','$concept_curie_nuclear_physicists|q$')]."
 concept_curie_uranium: "Уран"
 concept_curie_uranium_desc: "Uranium is an extremely rare material that can only be found in a few selected, historical provinces by [Concept('concept_agassiz_geologist','$concept_agassiz_geologists|q$')]. Modern Physics must have been researched for this. At first glance, uranium is a secondary ore that is only used in ceramic production. However, it will be needed later, especially in the [concept_verrier_observatory]. Only if the best physical and chemical production methods are supplied with uranium they can fulfill their purpose, whether in the field of nuclear physics or in the research of previously unknown elements. Without uranium, all scientific activities in the field of radioactivity are simply impossible. It is therefore particularly interesting for [Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists|q$')] and [Concept('concept_curie_physicist','$concept_curie_physicists|q$')] in the final phase of Victoria 3."
 concept_mendelejew_chemistry: "Химия"
 concept_mendelejew_chemistry_desc: "#b Chemistry#! is one of the main features of [concept_morgenroete]. Starting in the 18th Century, #b Chemistry#! rapidly developed into a modern science. Suddenly many new elements were discovered and chemical processes were invented. The 19th and 20th century saw even more discoveries in Chemistry, ranging from new elements to the invention of dynamite or the Haber-Bosch-Process.\n\nIn #b Morgenröte#! #b Chemistry#! will be conducted by [Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists|q$')] who will be able to focus on different tasks.\nOne focus is the improvement of your countries #b $building_chemical_plant$#!, #b $building_explosives_factory$#! or #b $building_synthetics_plant$#!, which will make those [Concept('concept_building', '$concept_buildings|q$')] more efficient.\nIf you are looking for a more prestigious task, you can let your #b Chemist#! theorize, discover or isolate [Concept('concept_mendelejew_element','$concept_mendelejew_elements|q$')]. Each Element will add a little bit of [concept_prestige] depending on whether you theorized, discovered or isolated it.\nLater in the game the #b Chemist#! will also be able to invent #b Synthetic Oil#! and #b Synthetic Rubber#!. This will unlock the #b $building_mendelejew_hydrogenation_plants$#! or the #b $building_mendelejew_synthetic_rubber_factory$#!."
 concept_mendelejew_chemists: "#b #ORANGE Химики#!#!"
 concept_mendelejew_chemist_desc: "#b #ORANGE Chemists#!#! are [Concept('concept_academics_academic','$concept_academics_academics|q$')] that will theorize, discover and isolate [Concept('concept_mendelejew_element','$concept_mendelejew_elements|q$')].\n#b #ORANGE Chemists#!#! gain [concept_academics_experience] when they research #b Elements#! or attend Conferences. They can also improve fertilizers, explosives and synthetics. Chemists may invent the periodic table or synthetic fuel, making them valuable for countries without oil access. They get #b Experience#! passively as well each year. This allows #b #ORANGE Chemists#!#! to get better chemist traits. They may also get a specialization (theorist, analyst, inspector) when created or by event."
 concept_mendelejew_element: "Химический элемент"
 concept_mendelejew_element_no_chemical: "Элемент"
 concept_mendelejew_elements: "Химические элементы"
 concept_mendelejew_element_desc: "In ancient times it was common to believe that the world consisted of the four elements: fire, earth, water and air. With the beginning of the emancipation of chemistry from alchemy, the scientific analysis of the chemical elements came about. This process was far from complete in the 19th century.\n\n[Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists|q$')] can continue this research by theorizing, discovering, and isolating elements one at a time. Only when isolated is an element considered fully recognized and given its name; previously it is just a number. The categorization of elements brings scientific progress and chemist [concept_academics_experience].\nNot all elements can be theorized, discovered and isolated from the start.\n The prerequisite is that the chemical laboratory in the [concept_verrier_observatory] has adequate equipment, in some cases also an Institute for Modern Physics. Many elements can only be properly researched with spectrography; towards the end of the game, a cyclotron may be necessary. [Concept('concept_agassiz_mineral','$concept_agassiz_minerals|q$')] are necessary for the discovery and isolation of chemical elements. In addition to production methods, the chemist's experience and character traits play a decisive role in how long the research takes.\n\nResearched elements are a requirement for the development of the periodic table and the organization of the chemistry congress."
 concept_verrier_meteorite: "Метеорит"
 concept_verrier_meteorites: "Метеориты"
 concept_manzoni_national_writers: "Национальные писатели"
 concept_verrier_astronomy_desc: "#b Astronomy#! is one of the main features of [concept_morgenroete].\n\nTo gain access to #b Astronomy#! you need an [concept_verrier_observatory] or an [concept_verrier_astronomer].\n\nOnce you have an Observatory, you will passively discover [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects|q$')].\n\n If you have an [concept_verrier_astronomer] you will even be able to find new Planets, [Concept('concept_verrier_satellite','$concept_verrier_satellites|q$')], [Concept('concept_verrier_comet','$concept_verrier_comets|q$')] and take [Concept('concept_verrier_moon_photo','$concept_verrier_moon_photos|q$')].\nSometimes your [concept_agassiz_geologist] might also find [Concept('concept_verrier_meteorite','$concept_verrier_meteorites|q$')] which can be examined by #b Astronomers#! and [Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists|q$')].\n\nEvery Astronomical discovery will grant you [concept_verrier_astronomical_prestige] which will be added to you [concept_prestige]. Check the $verrier_astronomical_prestige_modifier$ [concept_modifier] to see your #b Astronomical Prestige#!"
 concept_verrier_observatory_desc: "An #b Observatory#! is the backbone of a country's [concept_verrier_astronomy] and [concept_mendelejew_chemistry]. From there [Concept('concept_verrier_astronomer','$concept_verrier_astronomers|q$')] can discover Planets, [Concept('concept_verrier_satellite','$concept_verrier_satellites|q$')], [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects|q$')], [Concept('concept_verrier_comet','$concept_verrier_comets|q$')] and take [Concept('concept_verrier_moon_photo','$concept_verrier_moon_photos|q$')].\nTo build an #b Observatory#!, you need to have a University and either the $verrier_astronomy_tech$ or $verrier_chemistry_tech$ [concept_technology] researched. Additionally an #b Observatory#! can only be built once and only in your capital."
 concept_verrier_astronomer_desc: "#b Astronomers#! are Academics that will explore the sky and discover [Concept('concept_verrier_satellite','$concept_verrier_satellites|q$')], [Concept('concept_verrier_comet','$concept_verrier_comets|q$')] and [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects|q$')].\n#b Astronomers#! gain [concept_academics_experience] when they discover #b Astronomical Objects#! or attend Conferences. They get #b Experience#! passively as well each year. This allows #b Astronomers#! to get better astronomer traits.\n\nAn #b Astronomer#! can focus on discovering new #b Satellites#! or #b Taking Moon Photos#!. This will however reduce the amount of discovered #b Astronomical Objects#!"
 concept_verrier_astronomical_prestige: "Астрономический престиж"
 concept_verrier_astronomical_prestige_desc: "#b Astronomical Prestige#! is the amount of [concept_prestige] you gain from Astronomy. Various factors influence your #b Astronomical Prestige#!:\n- Finding a new Planet will grant you between #V 15#! and #V 100#! Prestige depending on the difficulty to find it.\n- Each discovered [concept_verrier_satellite] will grant you 10 Prestige.\n- A completed [Concept('concept_verrier_moon_photo','$concept_verrier_moon_map|q$')] will grant you #V 25#! Prestige.\n- A great Comet will grant you 10 Prestige.\n- Every [concept_verrier_meteorite] will grant you #V 1#! Prestige.\n- Every #V 100#! [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects|q$')] will grant you #V 1#! Prestige."
 concept_verrier_astronomical_object_desc: "#b Астрономические объекты#! - это астероиды и звёзды, которые вы открыли. Эти объекты можно обнаружить, если у вас есть [concept_verrier_observatory]. Чем лучше ваша технология астрономии, тем больше объектов вы найдёте. Вы также будете открывать больше #b объектов#!, если у вас есть [concept_verrier_astronomer].\nС достаточным количеством #b астрономических объектов#! вы сможете открывать новые планеты или технологию астрофизики."
 concept_verrier_moon_map: "Карта Луны"
 concept_verrier_moon_photo_desc: "If you have an [concept_verrier_observatory] and researched the Camera Technology, you will be able to order your [concept_verrier_astronomer] to begin photographing the Moon. This will reduce the amount of [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects|q$')] from your #b Astronomer#! but give you #b Moon Photos#! every year.\nIf you collect enough #b Moon Photos#!, you will create an accurate map of Earth's Companion. Completing the Moon Map will grant your nation some [concept_verrier_astronomical_prestige]"
 concept_verrier_satellite: "Спутник"
 concept_verrier_satellites: "Спутники"
 concept_verrier_satellite_desc: "#b Satellites#! or Moons are [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects|q$')] that are orbiting a planet. Some #b Satellites#! like the Earth's Moon are already discovered, but an [concept_verrier_astronomer] can try to find more of them.\nEach #b Satellite#! discovered by your country will grant it a small amount of [concept_verrier_astronomical_prestige]."
 concept_verrier_meteorite_desc: "Meteorites are relatively small solid bodies of cosmic origin that have passed through the Earth's atmosphere and reached the ground. In rare cases, meteorite fragments can be found after a meteor shower. Meteorites that hit the earth thousands of years ago can also be found by [Concept('concept_agassiz_geologist','$concept_agassiz_geologists|q$')] in difficult terrain such as deserts and arctic areas. [Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists|q$')] and [Concept('concept_verrier_astronomer','$concept_verrier_astronomers|q$')] in particular are interested in meteorites and  might want to analyze them.\n\nAdditionally #b Meteorites#! help to raise your [concept_agassiz_geological_score] and allow for a better estimate of the [concept_agassiz_age_of_earth]."
 concept_agassiz_volcano_desc: "#b Volcanoes#! are a new state trait in #r Morgenröte#!. Unlike the base game for Victoria 3, it is not strategic regions but rather states with volcanoes that are tied to whether a volcanic eruption takes place. The volcanic activity is significantly greater, but it is not always destructive. In countries with volcanoes, a #b $building_agassiz_volcano_observatory$#! can be built, which not only helps to predict and mitigate eruptions through observations, but is also the starting point for a volcano expedition. [Concept('concept_agassiz_geologist','$concept_agassiz_geologists|q$')] can acquire new [concept_agassiz_geological_knowledge], [Concept('concept_agassiz_rare_mineral','$concept_agassiz_rare_minerals|q$')], experience and the volcanologist trait on a volcano expedition."
 concept_agassiz_geological_knowledge: "Геологические знания"
 concept_agassiz_geological_knowledge_desc: "#b Геологические знания#! включают общее понимание нацией природы Земли. Это очень редкий ресурс, который можно приобрести в основном в ходе геологических вех. #b Геологические знания#! не то же самое, что [concept_agassiz_geological_score], но это самый важный его компонент и считается особенно ценным."
 concept_agassiz_geological_score: "Геологический счёт"
 concept_agassiz_geological_score_desc: "The #b Geological Score#! includes all of a nation's achievements and knowledge that are related to geology. The most important component is [concept_agassiz_geological_knowledge], but there are many other important factors; such as the experience of a [concept_agassiz_geologist], [concept_agassiz_oceanographic_knowledge], the number of [Concept('concept_agassiz_mineral','$concept_agassiz_minerals|q$')], [Concept('concept_dubois_fossil','$concept_dubois_fossils|q$')] or [Concept('concept_dubois_specimen','$concept_dubois_specimens|q$')], and geological technologies. The Geological Score is crucial for re-dating the [concept_agassiz_age_of_earth]."
 concept_agassiz_oceanographic_knowledge: "Океанографические знания"
 concept_agassiz_oceanographic_knowledge_desc: "#b Oceanographic Knowledge#! forms part of [concept_agassiz_geological_knowledge] and corresponds to knowledge about the seas, in particular ocean currents, but also general marine research combined with geophysical considerations. #b Oceanographic Knowledge#! is largely gained on [Concept('concept_dubois_pacific_expedition','$concept_dubois_pacific_expeditions|q$')]. 50 #b Oceanographic Knowledge#! is necessary to acquire [concept_agassiz_geological_knowledge]."
 concept_agassiz_age_of_earth: "Возраст Земли"
 concept_agassiz_age_of_earth_desc: "Одним из главных вопросов XIX века был вопрос о #b возрасте Земли#!. Он имел естественно-научные последствия, особенно в отношении достоверности теории эволюции и последовательности геологических событий. Только [concept_agassiz_geologist] может определить новый возраст Земли. Для этого его нация должна иметь более высокий [Concept('concept_agassiz_geological_score', 'геологический счёт')], чем нация, которая последней определила возраст Земли. Затем он поделится результатами своих исследований с другими коллегами. Он не обязательно должен быть успешным - слишком молодые и неопытные геологи не будут услышаны. Однако иностранные нации немного более сговорчивы, когда в течение многих лет не было представлено ни одной новой теории. Геологи могут оценить возраст Земли только один раз в жизни - но это применимо только в случае успеха. Если вы потерпите неудачу, вы можете попробовать снова после фазы мотивации."
 concept_agassiz_geology: "Геология"
 concept_agassiz_geology_desc: "#b Geology#! is one of the main features of [concept_morgenroete]. Even before the beginning of the Victorian Age, geology had already experienced a significant boom, which is why it is available to many nations at the start of the game.\n\n[Concept('concept_agassiz_geologist','$concept_agassiz_geologists|q$')] can be used in a variety of ways: they can find [Concept('concept_dubois_formation','$concept_dubois_formations|q$')], [Concept('concept_andersson_cave','$concept_andersson_caves|q$')] and [concept_curie_uranium] deposits during a geological search, go on [concept_agassiz_volcano] expeditions, determine [concept_agassiz_age_of_earth], find new ore and oil deposits or go on [concept_dubois_pacific_expedition] and [concept_douglas_mountaineering] expeditions useful as scientific companions. A [concept_agassiz_geological_score] evaluates the overall knowledge of a nation and is crucial in determining the age of the earth. [Concept('concept_agassiz_mineral','$concept_agassiz_minerals|q$')] and [Concept('concept_agassiz_rare_mineral','$concept_agassiz_rare_minerals|q$')] are an essential part of geology; The latter can be used to establish a mineral cabinet in the [concept_dubois_zoo]. A special geological facility is the #b $building_agassiz_volcano_observatory$#!, which carries out volcanological and seismic studies."
 concept_theiler_biologist: "#b #GREEN Биолог#!#!"
 concept_theiler_biologists: "#b #GREEN Биологи#!#!"
 concept_theiler_biologist_desc: "A Biologist is an [concept_academics_academic] who researches all aspects of life.\nIn [concept_morgenroete] the Biologist is mostly responsible for researching [Concept('concept_theiler_microorganism','$concept_theiler_microorganisms|q$')], improving your Agriculture, fighting [Concept('concept_theiler_pest','$concept_theiler_pests|q$')], and finding [Concept('concept_theiler_pathogen','$concept_theiler_pathogens|q$')] and [Concept('concept_theiler_vaccine','$concept_theiler_vaccines|q$')].\nBiologists gain [concept_academics_experience] passively or by finishing projects."
 concept_gaudi_architect: "#b #PURPLE Архитектор#!#!"
 concept_gaudi_architects: "#b #PURPLE Архитекторы#!#!"
 concept_academics_university_specialization_desc: "Each University can be specialized by changing its production method.\nA university with a [concept_pm_academics_university_humanities] will allow you to focus your nations research on society innovation and allows to specifically recruit [Concept('concept_panum_physician','$concept_panum_physicians|q$')], [Concept('concept_lepsius_archaeologist','$concept_lepsius_archaeologists|q$')] and [Concept('concept_andersson_anthropologist','$concept_andersson_anthropologists|q$')].\nA university with a [concept_pm_academics_university_natural_history] will allow you to focus your nations research on society innovation and allows to specifically recruit [Concept('concept_agassiz_geologist','$concept_agassiz_geologists|q$')], [Concept('concept_dubois_paleontologist','$concept_dubois_paleontologists|q$')], [Concept('concept_dubois_naturalist','$concept_dubois_naturalists|q$')] and [Concept('concept_theiler_biologist','$concept_theiler_biologists|q$')].\nA university with a [concept_pm_academics_university_mathematics] will allow you to focus your nations research on production and military innovation and allows to specifically recruit [Concept('concept_tesla_engineer','$concept_tesla_engineers|q$')], [Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists|q$')] and [Concept('concept_verrier_astronomer','$concept_verrier_astronomers|q$')].\nChanging the Specialization will lead to [concept_academics_academic_confusion] which has a #n short negative effect#! for the building and your [concept_academics_progress].\nSpecialized Universities can influence various projects as well. Universities with a $concept_pm_academics_university_mathematics$ focus will help with engineering projects for example."
 concept_pm_academics_university_humanities_desc: "A Humanities-Anthropological Focus specializes the University and allows a national focus on Society Research and to specifically recruit [Concept('concept_lepsius_archaeologist','$concept_lepsius_archaeologists|q$')] and [Concept('concept_andersson_anthropologist','$concept_andersson_anthropologists|q$')]. You will get a #n negative throughput modifier#! for the University as well as a #n negative effect#! on your [concept_academics_progress] when you change this production method.\nSpecializing your Universities with the Humanities-Anthropological Focus will give you a bonus on the success chance of Expeditions (maximum of +4 requiring 40 Levels of specialization) and improve the progress for some other projects."
 concept_pm_academics_university_natural_history_desc: "A Natural History Focus specializes the University and allowsa national focus on Society Research and to specifically recruit [Concept('concept_agassiz_geologist','$concept_agassiz_geologists|q$')], [Concept('concept_dubois_paleontologist','$concept_dubois_paleontologists|q$')], [Concept('concept_dubois_naturalist','$concept_dubois_naturalists|q$')] and [Concept('concept_theiler_biologist','$concept_theiler_biologists|q$')]. You will get a #n negative throughput modifier#! for the University as well as a #n negative effect#! on your [concept_academics_progress] when you change this production method.\nSpecializing your Universities with the Natural History Focus will give you a bonus to various projects of your Natural scientists."
 concept_pm_academics_university_mathematics_desc: "Mathematical-Technical Focus specializes the University and allows a national focus on Production and Military Research and to specifically recruit [Concept('concept_tesla_engineer','$concept_tesla_engineers|q$')] or [Concept('concept_verrier_astronomer','$concept_verrier_astronomers|q$')]. You will get a #n negative throughput modifier#! for the University as well as a #n negative effect#! on your [concept_academics_progress] when you change this production method.\nSpecializing your Universities with the Mathematical-Technical Focus will give you a bonus to various projects of your [Concept('concept_tesla_engineer','$concept_tesla_engineers|q$')] and [Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists|q$')]."
 concept_panum_physician: "#b #BLUE Врач#!#!"
 concept_panum_physicians: "#b #BLUE Врачи#!#!"
 concept_panum_physician_desc: "#b #BLUE Physicians#!#! are [Concept('concept_academics_academic','$concept_academics_academics|q$')] who work and research in the field of [concept_panum_medicine]. Their main task is to write [Concept('concept_panum_disease_description','$concept_panum_disease_descriptions|q$')] and find [Concept('concept_panum_disease_treatment','$concept_panum_disease_treatments|q$')].They can also improve medical research, improve healthcare, and heal other characters.\nPhysicians gain [concept_academics_experience] during their work and passively every year. They can get better levels of the physician trait by earning enough #b Experience#!."
 concept_panum_medicine: "Медицина"
 concept_panum_medicine_desc: "Medicine is one of the biggest expansions of [concept_morgenroete] for Victoria 3. One of the focuses is on epidemic [Concept('concept_panum_disease','$concept_panum_diseases|q$')] such as cholera, tuberculosis and typhus, which have plagued humanity for centuries and have finally been brought under control thanks to scientific advances. Epidemic diseases are therefore one of the negative events in [concept_morgenroete]. Containment through the search for a [concept_panum_disease_treatment] is therefore even more important. A central component of medicine is therefore a [concept_panum_physician] who is one of the academics of the anthropological-humanistic university focus. He can describe epidemic diseases and find treatments. A treatment method usually requires a [concept_panum_disease_description] and a technology. A physician can also improve the research of medical technologies or expand healthcare through hospitals, as well as introduce new medical techniques and heal other characters. Medical conferences help to spread medical knowledge internationally. An important step in the modernization of medicine is also the transition from the miasma theory to the [concept_panum_germ_theory]. A nation that is a leader in medical discoveries can also demonstrate high [concept_panum_medical_prestige]."
 concept_panum_disease: "Болезнь"
 concept_panum_diseases: "Болезни"
 concept_panum_disease_desc: "The term disease usually refers to the epidemic diseases that can affect a nation every few years. A [concept_panum_physician] can counteract them by making [Concept('concept_panum_disease_description','$concept_panum_disease_descriptions|q$')] and providing [Concept('concept_panum_disease_treatment','$concept_panum_disease_treatments|q$')] Epidemic diseases usually do not occur at the same time and it takes some time for epidemic diseases to break out again. Depending on the type, epidemic diseases can have a devastating effect and spread across several states. There are various [concept_panum_disease_prevention] methods to delay the onset of such a disease or to mitigate its effects. The triggers for an illness can be very different. Yellow fever only occurs in tropical regions and cholera and tuberculosis require a minimum of urbanization to have an effect. A state's standard of living and level of devestation also play a role.\n\nIn addition to these particularly feared epidemic diseases, there are also everyday diseases that a physician can randomly examine during medical research. Such diseases include rickets, pellagra and syphilis.\n\nDiseases are:\n #indent_newline:3 • [GetHarvestConditionType('panum_cholera_condition').GetName]#!\n #indent_newline:3 • [GetHarvestConditionType('panum_tuberculosis_condition').GetName]#!\n #indent_newline:3 • [GetHarvestConditionType('panum_smallpox_condition').GetName]#!\n #indent_newline:3 • [GetHarvestConditionType('panum_typhus_condition').GetName]#!\n #indent_newline:3 • [GetHarvestConditionType('panum_yellow_fever_condition').GetName]#!\n #indent_newline:3 • [GetHarvestConditionType('panum_measles_condition').GetName]#!\n #indent_newline:3 • [GetHarvestConditionType('panum_scarlet_condition').GetName]#!\n #indent_newline:3 • [GetHarvestConditionType('panum_plague_condition').GetName]#!\n #indent_newline:3 • [GetHarvestConditionType('panum_diphteria_condition').GetName]#!\n #indent_newline:3 • [GetHarvestConditionType('panum_polio_condition').GetName]#!"
 concept_panum_disease_description: "Описание болезни"
 concept_panum_disease_descriptions: "Описания болезней"
 concept_panum_disease_description_desc: "Descriptions are the first step towards understanding a [concept_panum_disease]. They have no impact on the severity of an epidemic, but are fundamental to finding [Concept('concept_panum_disease_treatment','$concept_panum_disease_treatments|q$')], [Concept('concept_theiler_pathogen','$concept_theiler_pathogens|q$')] and [Concept('concept_theiler_vaccine','$concept_theiler_vaccines|q$')]. Disease descriptions have no further requirements: all that is required is an epidemic disease and a [concept_panum_physician]."
 concept_panum_disease_treatment: "Метод лечения"
 concept_panum_disease_treatments: "Методы лечения"
 concept_panum_disease_treatment_desc: "[concept_panum_physician] при наличии соответствующей технологии и [Concept('concept_panum_disease_description', 'описания болезни')] может найти метод лечения [Concept('concept_panum_disease', 'болезни')] в ходе длительного процесса. Лечение - это не то же самое, что излечение. Скорее, врач выясняет причину болезни и на этой основе разрабатывает методы предотвращения или значительного ограничения вспышки. Методы лечения ограничивают продолжительность эпидемического заболевания несколькими месяцами или неделями, а также предотвращают его распространение на другие области. Методы лечения являются частью возможной [Concept('concept_panum_disease_prevention', 'профилактики заболеваний')] против эпидемических вспышек."
 concept_panum_disease_prevention: "Профилактика заболеваний"
 concept_panum_disease_prevention_no_disease: "Профилактика"
 concept_panum_disease_prevention_desc: "There are several ways to avoid or at least mitigate an epidemic [concept_panum_disease]. The most well-known method is the [concept_panum_disease_treatment] developed by a [concept_panum_physician]. It significantly reduces the time in which a disease rages and also reduces the likelihood that it will spread to another country. Standard of living, hospitals, technologies and a high level of healthcare institutions also have an impact. The ultimate prevention is a [concept_theiler_vaccine] that prevents a disease from occurring in the first place. Vaccines are developed by [Concept('concept_theiler_biologist','$concept_theiler_biologists|q$')]. However, it is only effective if the health institution has at least reached the level specified in the medical faculty. After all, the distribution of a vaccine has to be organized and supervised."
 concept_panum_disease_type: "Тип болезни"
 concept_panum_disease_types: "Типы болезней"
 concept_panum_disease_type_desc: "Epidemic [Concept('concept_panum_disease','$concept_panum_diseases|q$')] can be differentiated according to their degree of distribution. #V Local diseases#!, such as scarlet fever, are limited to the state in which they broke out. #V Regional diseases#!, such as tuberculosis, can spread to some surrounding states, but not beyond. #V Transregional diseases#! - the most notorious of which is cholera - can spread throughout the country, even though states do not have to border each other."
 concept_panum_local_disease: "Локальная болезнь"
 concept_panum_local_diseases: "Локальные болезни"
 concept_panum_regional_disease: "Региональная болезнь"
 concept_panum_regional_diseases: "Региональные болезни"
 concept_panum_transregional_disease: "Трансрегиональная эпидемия"
 concept_panum_transregional_diseases: "Трансрегиональные эпидемии"
 concept_panum_germ_theory: "Микробная теория"
 concept_panum_germ_theory_desc: "Germ theory is one of the fundamental medical scientific advances of the 19th century. It replaced previous, more archaic theories, such as the miasma theory, which was widespread in Europe and represents all traditional attempts to explain the cause of [Concept('concept_panum_disease','$concept_panum_diseases|q$')]. The discovery of germ theory not only benefits the first discoverer. When looking for [Concept('concept_panum_disease_treatment','$concept_panum_disease_treatments|q$')], the chances of success are slightly higher because it prevents some negative events and unlocks more positive events."
 concept_panum_medical_prestige: "Медицинский престиж"
 concept_panum_medical_prestige_desc: "Medical Prestige is made up of the [Concept('concept_panum_disease_description','$concept_panum_disease_descriptions|q$')] (2 points), [Concept('concept_panum_disease_treatment','$concept_panum_disease_treatments|q$')] (4 points), [Concept('concept_theiler_pathogen','$concept_theiler_pathogens|q$')] (3 points) and [Concept('concept_theiler_vaccine','$concept_theiler_vaccines|q$')] (4 points) discovered so far. First discoveries give twice as many points. Further medical prestige can come from curing everyday illnesses, inventing special healing methods, or generally improving the healthcare system via a [concept_panum_physician]."
 concept_theiler_pathogen: "Патоген"
 concept_theiler_pathogens: "Патогены"
 concept_theiler_pathogen_desc: "Патогеном называется возбудитель [Concept('concept_panum_disease', 'болезни')]. Им может быть что угодно, от организма до [Concept('concept_theiler_microorganism', 'микроорганизма')]; чаще всего это бактерия, паразит или вирус.\n[Concept('concept_theiler_biologist', '#b #GREEN биолог#!#!')], имеющий доступ к достаточному количеству микроорганизмов, может попытаться найти патоген, вызывающий болезнь. Это поможет предотвратить заболевание, а также открыть и произвести [Concept('concept_theiler_vaccine', 'вакцину')]."
 concept_theiler_vaccine: "Вакцина"
 concept_theiler_vaccines: "Вакцины"
 concept_theiler_vaccine_desc: "The discovery of Vaccines has allowed humans to become immune to [Concept('concept_panum_disease','$concept_panum_diseases|q$')] without contracting them and can potentially save millions of lives.\nTo create a Vaccine, A [concept_theiler_biologist] must first find the [concept_theiler_pathogen] that causes a Disease. Then the development of a Vaccine can start if enough [Concept('concept_theiler_microorganism','$concept_theiler_microorganisms|q$')] are available."
 concept_panum_red_cross: "Красный Крест"
 concept_panum_red_cross_desc: "The Red Cross is one of the first international organizations and, in rare cases, offers the opportunity to receive Red Cross medics in a war. Red Cross members also receive certain bonuses. Depending on the game rule, the Red Cross can be founded historically or dynamically; Recognized states can join under certain technological requirements. The founder receives the headquarters of the Red Cross in his capital. Members can accede to up to three [Concept('concept_panum_convention','$concept_panum_conventions|q$')] that are binding under international law."
 concept_panum_convention: "Международная конвенция"
 concept_panum_conventions: "Международные конвенции"
 concept_panum_convention_desc: "Международная конвенция - это совместная декларация о намерениях государств установить определённые правила игры в международных отношениях. В XIX веке было несколько примеров этого, таких как Женевская конвенция или Гаагский кодекс сухопутной войны. Общим для всех конвенций является то, что они пытаются смягчить ужасы войны. Поэтому военные варианты предпочитаются безопасной медицинской помощи раненым, а абсолютное оружие запрещается, что приводит к определённому сдерживанию войны. Преимуществом является большая гибкость. В то время как принятие конвенции рассматривается благосклонно, отмена конвенции может привести к международному гневу.\n\nМеждународные конвенции обычно являются необязательными декларациями о намерениях. Однако, если достаточное количество членов [Concept('concept_panum_red_cross', 'Красного Креста')] подпишет её, со временем она станет действующим международным правом, которое все подписавшие стороны должны соблюдать, - и другие члены также подпишут её. Это происходит, когда 65% всех членов и большинство великих держав соглашаются с этой конвенцией, - тогда все остальные члены вынуждены её соблюдать. Эту конвенцию тогда уже нельзя отменить как обычно. Чтобы избежать обязательных конвенций, необходим полный выход из Красного Креста - со всеми последствиями."
 concept_manzoni_literary_tradition_desc: "#b Literary Tradition#! is a representation of a nation's literary achievements and traditions.\nThere are various ways to gain #b Literary Tradition#!. Having at least one $building_art_academy$, having one or more [Concept('concept_manzoni_local_writer','$concept_manzoni_local_writers|q$')], a [concept_manzoni_national_writer] and having certain [Concept('concept_artists_center_of_arts','$concept_artists_centers_of_arts|q$')] will passively add #b Literary Tradition#! to your country.\nThe more #b Literary Tradition#! your nation gains, the higher the prestige bonus you gain. Additionally it will allow you to unlock the [concept_elgar_expressionism] [concept_artists_art_style]."
 concept_elgar_musical_tradition_desc: "#b Музыкальная традиция#! - это отражение музыкальных достижений и традиций нации.\nСуществуют различные способы получения #b музыкальной традиции#!. Если у вас есть хотя бы одна [concept_elgar_opera|l], вы будете пассивно получать #b музыкальную традицию#!. Чем больше у вас #b опер#!, тем больше вы получаете. Вы также можете получать больше #b музыкальной традиции#! от музыкальных и художественных технологий. Каждая технология даёт разный бонус. Вы также можете получать #b музыкальную традицию#! из событий, особенно если у вас есть [concept_elgar_composer|l].\nЧем больше #b музыкальной традиции#! получает ваша нация, тем выше бонус к престижу, который вы получаете. Кроме того, это позволит вам разблокировать [Concept('concept_artists_art_style', 'художественный стиль')] [concept_elgar_impressionism|l]."
 concept_klimt_painting_tradition_desc: "#b Painting Tradition#! is a representation of a nation's painting achievements and traditions. It can be gained from having #b Arts Academies#!, a [concept_klimt_painter], certain [Concept('concept_technology', '$concept_technologies|q$')] or from events.\n#b Painting Tradition#! allows you to unlock the [concept_elgar_art_nouveau] [concept_artists_art_style] and is used to calculate your #b Cultural Tradition#!."
 concept_mendelejew_theorized_elements: "Теоретизированные элементы"
 concept_mendelejew_discovered_elements: "Открытые элементы"
 concept_mendelejew_isolated_elements: "Выделенные элементы"
 concept_panum_psycho_point: "Психотерапевтический балл"
 concept_panum_psycho_points: "Психотерапевтические баллы"
 concept_panum_psycho_point_desc: "Психотерапевтические баллы - это абстрактная валюта, которая представляет прогресс страны в области психиатрии и психологии. Они генерируются ежемесячно из технологий, психиатрической лечебницы или [Concept('concept_panum_physician', '#b #BLUE врача#!#!')] с чертой характера #V «Психиатр»#!. Психотерапевтические баллы также можно получить через событие. Большое количество психотерапевтических баллов приводит к лучшим шансам на излечение персонажей с психическими заболеваниями. Переход на новый психотерапевтический уровень также даёт бонусы к исследованиям и [Concept('concept_academics_progress', 'научному прогрессу')]. Определённое количество психотерапевтических баллов является требованием для большинства психологических школ."
 concept_vikelas_mechanic: "Механик"
 concept_vikelas_mechanic_desc: "#b Механики#! отвечают за постройку [Concept('concept_vikelas_race_car', 'гоночного автомобиля')], а их черты характера и опыт влияют на то, сколько времени займёт сборка или модернизация машины. Однако они отвечают не только за сам автомобиль, но и напрямую влияют на [Concept('concept_vikelas_mechanical_innovation', 'механическую инновацию')]. Хорошие механики следят за тем, чтобы скорость машины (включая склонность водителя искать острые ощущения) не превышала показатель безопасности и не приводила к смертельным авариям. То же относится к надёжности: если показатель скорости выше показателя надёжности, существует 50-процентная вероятность, что автомобиль не доберётся до финиша."
 concept_vikelas_mechanical_innovation: "Механическая инновация"
 concept_vikelas_race_car: "Гоночный автомобиль"
 concept_vikelas_race_car_desc: "Наряду с [Concept('concept_vikelas_racer', 'гонщиком')] #b гоночный автомобиль#! является ключевым фактором в [Concept('concept_vikelas_car_racing', 'автогонках')]. Его строит [Concept('concept_vikelas_mechanic', 'механик')]. Важнейшие характеристики гоночного автомобиля - скорость, надёжность и безопасность. Быстрая машина, не отвечающая стандартам безопасности, вполне может претендовать на победу, но несёт высокий риск смертельной аварии. Безопасная, но слишком медленная машина, напротив, не сможет победить. Поэтому гоночной команде необходимо найти правильный баланс."
 concept_vikelas_race_car_reliability: "Надёжность гоночного автомобиля"
 concept_vikelas_race_car_safety: "Безопасность гоночного автомобиля"
 concept_vikelas_race_car_speed: "Скорость гоночного автомобиля"
 concept_dubois_dinosaur_bone_no_dinosaur: "Кость"
 concept_dubois_dinosaur_bones_no_dinosaur: "Кости"
 concept_dubois_paleontological_expedition_desc: "A [concept_dubois_paleontologist] can be dispatched to [Concept('concept_dubois_formation','$concept_dubois_formations|q$')]. It will take 1 year and depending on the Success of the Expedition, you will get [Concept('concept_dubois_fossil','$concept_dubois_fossils|q$')] and [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones|q$')]. When you finish an Expedition and if you have a free [concept_dubois_paleontological_team] you can set up a [concept_dubois_paleontological_excavation] to passively gain Fossils and Bones from that region.\nThe easiest way to gain access to a formation is to control the associated state. However, access can also be gained peacefully through [Concept('concept_mr_research_charter','$concept_mr_research_charters|q$')]."
 concept_dubois_paleontological_team: "Палеонтологическая группа"
 concept_dubois_paleontological_teams: "Палеонтологические группы"
 concept_dubois_paleontological_team_desc: "Paleontological Teams can be used to set up an [concept_dubois_paleontological_excavation] after finishing a [concept_dubois_paleontological_expedition]. This will allow you to passively get [Concept('concept_dubois_fossil','$concept_dubois_fossils|q$')] and [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones|q$')]."
 concept_dubois_paleontological_excavation: "Палеонтологические раскопки"
 concept_dubois_paleontological_excavations: "Палеонтологические раскопки"
 concept_dubois_paleontological_excavation_desc: "You can set up a Paleontological Expedition after finishing a [concept_dubois_paleontological_expedition] if you have a free [concept_dubois_paleontological_team]. A Paleontological Excavation will allow your Team to passively produce [Concept('concept_dubois_fossil','$concept_dubois_fossils|q$')] and [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones|q$')]."
 concept_verrier_venus_transit: "Прохождение Венеры"
 concept_verrier_venus_transit_desc: "Прохождение Венеры - это редкое явление, при котором Венера проходит между Землёй и Солнцем. В XIX веке оно произошло дважды: в 1874 и 1882 годах. Поскольку наблюдения за прохождением Венеры позволяют сделать выводы о размере Солнечной системы и более точно определить размер астрономической единицы (АЕ), это были крупные научные события. Страны, расположенные в [Concept('concept_verrier_venus_transit_zone', 'зоне прохождения Венеры')], могут наблюдать это событие оттуда; другие страны должны отправлять экспедиции. Успех наблюдения зависит от опыта [Concept('concept_verrier_astronomer', '#b #ORANGE астронома#!#!')], наличия [Concept('concept_tesla_engineer', '#b #ORANGE инженера#!#!')] и немного удачи: иногда погода может помешать хорошему изображению. Чем лучше наблюдение, тем больше бонус."
 concept_verrier_venus_transit_zone: "Зона прохождения Венеры"
 concept_verrier_venus_transit_zone_desc: "Зона прохождения Венеры относится к той части Земли, с которой можно наблюдать полное (а не только частичное) прохождение Венеры. В 1874 году это было особенно актуально для региона Восточной Азии и Тихого океана, а в 1882 году - для почти всего американского континента. Подробная разбивка по стратегическим регионам приведена ниже.\n\n#V Прохождение Венеры 1874:#!\nИндонезия, Индокитай, Океания, Южный Китай, Северный Китай, Маньчжурия, Япония, Центральная Индия, Мадрас, Бенгалия, Гималаи; также область Индийского океана.\n\n#V Прохождение Венеры 1882:#!\nБразилия, Ла-Плата, Анды, Великая Колумбия, Мексика, Центральная Америка, Карибы, Средний Запад, Дикси, Новая Англия; также области Онтарио и Квебек."
 concept_vikelas_coach: "Тренер"
 concept_vikelas_coaches: "Тренеры"
 concept_vikelas_coach_desc: "Coaches are the national trainers of a country in a specific national sport. National sports include [concept_vikelas_football], baseball, basketball, and cricket. Coaches provide bonuses for the respective team in competitions - whether at International World Championships or at international matches. The latter are played secretly at regular intervals and increase a coach's experience value upon victory. High experience points and positive [Concept('concept_character_trait','$concept_character_traits|q$')] increase the chance of winning a World Championship. Positive traits are those that particularly motivate players - such as ambitious or charismatic - while demotivating traits reduce the chance of winning a match. These include traits such as ruthless or cruel."
 concept_vikelas_football: "Футбол"
 concept_vikelas_football_desc: "Футбол - возможный национальный вид спорта. Первые футбольные клубы могут быть созданы в Европе и Южной Америке; для этого потребуется относительно либеральная правовая система, сильная мелкая буржуазия или значительный средний уровень жизни. После этого можно будет время от времени играть в футбол. С созданием ФИФА также становятся возможными международные матчи и чемпионат мира. Восемь лучших команд автоматически квалифицируются на чемпионат мира. Команды рассчитываются по значению национальной футбольной команды (NFTV), которое выводится из параметров уровня жизни (физическая подготовка населения), силы мелкой буржуазии (клубная система), грамотности (тактика) и традиции (национальный спорт: да или нет?). В матчах учитывается не только NFTV, но и черты характера и опыт [Concept('concept_vikelas_coach', 'тренера')]."
 concept_gaudi_architectural_splendour: "Архитектурное великолепие"
 concept_gaudi_architectural_splendour_desc: "Архитектурное великолепие - это собирательный термин для обозначения впечатляющих достижений в современной архитектуре, относящийся в первую очередь к ар-деко, баухаузу и неоклассицизму, возникшим в начале XX века. Это значение представляет собой трансформацию устаревших форм в архитектуру будущего. Ар-деко требует достижения более высокого порога для осуществления мечты о городе в стиле ар-деко, однако и преимущества от этого больше."
 concept_artists_artist_desc: "В моде [concept_morgenroete] #b деятели искусства#! - это особые персонажи, которые открывают доступ к определённым механикам. Вы можете получить #b деятелей искусства#! в некоторых событиях или накопив достаточно [Concept('concept_artistic_progress', 'творческого прогресса')]. У деятелей искусства есть [concept_artists_experience], которая отражает их положение в соответствующей области.\nВ настоящее время существуют следующие #b деятели искусства#!:\n - [concept_elgar_composer]\n - [concept_klimt_painter]\n - [concept_manzoni_writer]\n - [concept_gaudi_architect]"
 concept_elgar_architecture_desc: "Architecture is one of the core concepts of [concept_morgenroete]. It is divided into two major parts.\n\nOn the one hand, [concept_gaudi_monuments] have been completely redesigned: they are no longer built directly, but expanded step by step based on decisions. On the other hand, numerous monuments have been added - some of which must be built, others exist at the start of the game.\n\nThe other key point is the introduction of the [concept_gaudi_architect], who can upgrade cities and design up to 15 new unique buildings by researching [Concept('concept_gaudi_architectural_blueprint','$concept_gaudi_architectural_blueprints|q$')]. Architects can also rebuild a country in the Bauhaus, Neoclassical, and Art Deco styles. A [concept_gaudi_great_architect] can even design their own [concept_gaudi_custom_monument]!"
 concept_gaudi_architect_desc: "#PURPLE #b Architects#!#! are [Concept('concept_artists_artist','$concept_artists_artists|q$')] whose skills relate to urban planning, building design and construction. They are special character types that you can gain either from events, from gaining enough [concept_artistic_progress] to create one in your nation or by offering a position to a [concept_gaudi_independent_architect].\nWhile other artists are more likely to accumulate cultural tradition, architects only rarely generate the very valuable [concept_gaudi_architectural_splendour] when they are involved in urban planning or the expansion of the capital—or when they completely redesign the country in a particular architectural style. Their main task is more practical in nature. They work in public construction, thus providing a nation with additional construction points. They improve infrastructure through planning and enhance capital cities into livable places. Architects can also hone their skills on a study tour or write an architectural treatise.\nOf paramount importance is the design of new, unique buildings, for which they create a [concept_gaudi_architectural_blueprint]. A total of 15 of these [concept_gaudi_blueprint_buildings] can be researched—since this takes a long time, it's worth considering which ones make sense.\nArchitects also provide a passive bonus: their mere presence accelerates the construction of [concept_gaudi_monuments] by 100 percent. The greatest achievement of an architect is the design of their own [concept_gaudi_custom_monument]. This is only possible with a [concept_gaudi_great_architect]."
 concept_douglas_mountaineering: "Альпинизм"
 concept_douglas_mountaineering_desc: "Countries that own at least one [concept_douglas_mountain_summit] or have a [concept_mr_research_charter] with a country that has one can participate in mountaineering. To start a #b Mountain Expedition#! you need both the #b Prospecting#! and #b Nationalism#! technologies as well as a general that has either the #b Mountaineer#!, #b Explorer#!, #b Mountain Commander#! or #b Surveyor#! Trait.\nAs soon as you start a #b Mountain Expedition#! you will have to first choose which general will be the main Mountaineer. Then you will choose the summit to climb.\nThe higher the mountains, the more dangerous is the ascent. The Mountains are classified according to their height in meters ranging from under 4000 meters up to over 8000 meters. Success depends on researched military technologies, the age and health of the leader, and their characteristics. Avalanches and steep slopes can pose a major risk that threatens the entire endeavor.\nYou can even send an additional [Concept('concept_academics_academic','$concept_academics_scientist|q$')] on the trip. Either a [concept_dubois_naturalist] or a [concept_dubois_paleontologist] will help discover more about the mountain you climbed on.\nIn the end you will get a prestige bonus and your general will develop better traits that will help them in combat as well for mountaineering."
 concept_gaudi_great_architect: "#PURPLE #b Великий архитектор#!#!"
 concept_gaudi_great_architects: "#PURPLE #b Великие архитекторы#!#!"
 concept_gaudi_great_architect_desc: "#b Great Architects#! are [Concept('concept_gaudi_architect','$concept_gaudi_architects|q$')] that are considered to be the most important minds in their field. #b Architects#! reaching 500 [concept_artists_experience] will become #b Great Architects#!. Should an artist achieve this special rank, he or she can design the blueprint for a truly outstanding [concept_gaudi_custom_monument] that embodies the spirit of the nation."
 concept_gaudi_monuments: "Памятники в #R Morgenröte#!"
 concept_gaudi_monuments_desc: "Многие нации получили новые #b памятники#! в [concept_morgenroete]: #b Кёльнский собор#! в Германии, #b Готтардская железная дорога#! в Швейцарии, #b Христос-Искупитель#! в Бразилии, #b Моле-Антонеллиана#! в Италии, #b Летний дворец#! в Китае, #b собор Саграда-Фамилия#! в Испании, #b замок Нойшванштайн#! в Баварии, #b Дворец изящных искусств#! в Мексике и #b дворец Кёнбоккун#! в Корее.\nВсе сооружения, кроме #b Летнего дворца#! и #b Кампанилы#!, должны быть построены их владельцем, #b Саксонский дворец#! может быть восстановлен польской нацией. Есть также новые памятники в начале игры, такие как #b Бамианские статуи Будды#! или #b дворец Потала#!.\nТакже есть возможность заказать проектирование [Concept('concept_gaudi_custom_monument', 'особого памятника')] у [Concept('concept_gaudi_great_architect', '#PURPLE #b великого архитектора#!#!')].\n\nВ отличие от ванильной игры, #b памятники#! строятся не напрямую, а через решение. Строительство происходит в несколько этапов, в зависимости от размера сооружения, и может занять годы или даже десятилетия - и стоит значительно дороже."
 concept_athletes_athlete: "Спортсмен"
 concept_athletes_athletes: "Спортсмены"
 concept_athletes_athlete_desc: "In [concept_morgenroete] #b Athletes#! are special characters that allow you to use certain mechanics of the mod.#b Athletes#! are usually created through events or via a button. Like other characters, #b Athletes#! possess experiences that guarantee greater success in their field.\nCurrently these #b Athletess#! exist:\n - [concept_santos_balloonist]\n - [concept_curtiss_pilot]\n - [concept_vikelas_olympian]\n - [concept_douglas_mountaineer]\n - [concept_vikelas_coach]\n - [concept_vikelas_racer]"
 concept_gaudi_independent_architect: "Независимый архитектор"
 concept_gaudi_independent_architects: "Независимые архитекторы"
 concept_gaudi_independent_architect_desc: "[Concept('concept_gaudi_architect','$concept_gaudi_architects|q$')] that are not hired by a country are #b Independent Architects#!.\nUnlike many other artists, there are few requirements to recruit an #b Independent Architect#!, except for a minimal technological recquirement. They are true globetrotters and usually only demand good payment."
 concept_gaudi_architectural_blueprint: "Архитектурный чертёж"
 concept_gaudi_architectural_blueprints: "Архитектурные чертежи"
 concept_gaudi_architectural_blueprint_desc: "Architectural blueprints can be researched by [Concept('concept_gaudi_architect','$concept_gaudi_architects|q$')]. They are essential for the construction of special [concept_gaudi_blueprint_buildings] that can only be erected once in a nation. There are a total of 15 different buildings in five different categories. Certain blueprints require technologies to be researched. Since research can sometimes take years, it's wise to decide beforehand which blueprints are most important. The buildings can potentially be constructed in any state, but require a certain level of urbanization. In some cases, there may be additional requirements."
 concept_gaudi_blueprint_buildings: "Сооружения по чертежам"
 concept_gaudi_blueprint_buildings_desc: "Blueprint buildings are buildings which need a bluprint researched by [Concept('concept_gaudi_architect','$concept_gaudi_architects|q$')]. These buildings can only be built once in a nation. There are 15 different buildings:\n\n#b Monument#!\n- [GetBuildingType('building_gaudi_statue').GetName]\n- [GetBuildingType('building_gaudi_fountain').GetName]\n- [GetBuildingType('building_gaudi_arch').GetName]\n\n#b Public Square#!\n- [GetBuildingType('building_gaudi_park').GetName]\n- [GetBuildingType('building_gaudi_luna').GetName]\n- [GetBuildingType('building_gaudi_parade').GetName]\n\n#b Service Buildings#!\n- [GetBuildingType('building_gaudi_almshouse').GetName]\n- [GetBuildingType('building_gaudi_school').GetName]\n- [GetBuildingType('building_gaudi_prison').GetName]\n\n#b Health Institutions#!\n- [GetBuildingType('building_gaudi_canalization').GetName]\n- [GetBuildingType('building_gaudi_hospital').GetName]\n- [GetBuildingType('building_gaudi_health').GetName]\n\n#b National Academies#!\n- [GetBuildingType('building_gaudi_science').GetName]\n- [GetBuildingType('building_gaudi_arts').GetName]\n- [GetBuildingType('building_gaudi_sports').GetName]"
 concept_gaudi_custom_monument: "Особый памятник"
 concept_gaudi_custom_monument_desc: "Особый памятник - это величайший возможный шедевр [Concept('concept_gaudi_architect', '#b #PURPLE архитектора#!#!')]. Он может конкурировать с другими, обычными памятниками. Только [concept_gaudi_great_architect] может составить такие планы. Это требует исследования самых современных архитектурных технологий. Тип памятника, который проектирует архитектор, во многом зависит от его архитектурного стиля. Архитекторы ар-деко проектируют [GetBuildingType('building_gaudi_people_monument').GetName], архитекторы баухауза - [GetBuildingType('building_gaudi_people_forum').GetName], а архитекторы-неоклассицисты - [GetBuildingType('building_gaudi_people_palace').GetName]."
 concept_douglas_mountaineer: "Альпинист"
 concept_douglas_mountaineers: "Альпинисты"
 concept_douglas_mountaineer_desc: "#b Mountaineers#! are [Concept('concept_athletes_athlete','$concept_athletes_athletes|q$')] who can climb unconquered [concept_douglas_mountain_summit]. They can be recruited against [concept_douglas_alpine_heritage] after the establishment of a mountaineering club. Countries with geographical features such as mountains, peaks, or volcanoes therefore have an advantage in recruitment. Mountaineering traits and experience are the most important factors for progress in conquering a mountain or overcoming a dangerous situation."
 concept_vikelas_olympian: "Олимпиец"
 concept_vikelas_olympian_desc: "#n Эта запись пересматривается.#!"
 concept_douglas_mountain_summit: "Горная вершина"
 concept_douglas_mountain_summits: "Горные вершины"
 concept_douglas_mountain_summit_desc: "Горные вершины - заветная цель всех альпинистов. Они отмечают самую высокую точку горы. Каждая вершина имеет три отличительных признака, которые определяют, насколько сложно её успешно достичь.\n\n#V Высота#!: Высота определяет, сколько шагов требуется для восхождения на гору, что отражает общую продолжительность экспедиции. На каждые 1000 метров требуется один шаг прогресса. Значение округляется в большую сторону, что означает, что для горы Уитни высотой 4421 метр требуется 5 шагов, в то время как для пика Кауфмана высотой 7134 метра - 8. Престиж горы рассчитывается на основе её высоты: общая высота делится на 300. Таким образом, идеальная гора высотой 4500 метров даёт 15 престижа.\n\n#V Уровень#!: Уровень горы представляет собой требования к снаряжению, необходимому для восхождения. Это не строго связано с её высотой. Например, несмотря на свои 5636 метров, Орисаба имеет только 1-й уровень и требует только базового снаряжения. В отличие от этого, Маттерхорн высотой всего 4478 метров считается значительно более сложным на 3-м уровне, требуя как минимум подготовки к оказанию первой помощи в альпийских чрезвычайных ситуациях.\n\n#V Риск#!: Уровень риска горы указывает на вероятность негативных событий, влияющих на экспедицию. Он не зависит ни от высоты, ни от уровня. Лавины, туман и суровая погода являются ключевыми проблемами. На Попокатепетль можно было взойти уже в раннее Новое время благодаря его гостеприимным окрестностям. В отличие от этого, гораздо меньший Гросвенедигер, высотой всего 3666 метров, всё ещё представлял серьёзную угрозу для австрийских экспедиций вплоть до начала XIX века.\n\nБолее подробную информацию об отдельных вершинах можно найти в разделе [concept_douglas_mountain_summit_list]."
 concept_douglas_mountain_range: "Горный хребет"
 concept_douglas_mountain_ranges: "Горные хребты"
 concept_douglas_mountain_range_desc: "A mountain range is defined as a mountain formation that offers potential for [concept_douglas_mountaineering] training over long distances. Classic mountain ranges include the Rocky Mountains, the Andes, the Alps, and the Caucasus. Unlike the [Concept('concept_douglas_mountain_summit','$concept_douglas_mountain_summits|q$')] that are to be conquered, there are also plenty of less challenging mountains where there is no risk of a [concept_douglas_mountaineer] experiencing a fatal fall. Rather, they should be viewed as a training route. Countries with mountain ranges are more likely to produce mountaineers than those without this geographical feature."
 concept_douglas_alpine_heritage: "Альпийское наследие"
 concept_douglas_alpine_heritage_desc: "Alpine Heritage is a collective term for a connection with the mountains and a specialization in climbing mountains. It also refers to the potential to recruit new [Concept('concept_douglas_mountaineer','$concept_douglas_mountaineers|q$')]—since, in most cases, experienced mountaineers come from mountainous areas. This always gives countries with [Concept('concept_douglas_mountain_range','$concept_douglas_mountain_ranges|q$')] or [Concept('concept_douglas_mountain_summit','$concept_douglas_mountain_summits|q$')] an advantage. Recruiting a new mountaineer, as well as various other actions, costs Alpine Heritage."
 concept_douglas_mountain_summit_list: "Список горных вершин"
 concept_douglas_mountain_summit_list_desc: "There are many [Concept('concept_douglas_mountain_summit','$concept_douglas_mountain_summits|q$')] that can be climbed.\n\n#V North America:#!\n#b Mount McKinley#! (Alaska), Height 6190 meters, Level 4\n#b Mount Logan#! (Yukon Territory), Height 5959 meters, Level 4\n#b Citlaltépetl#! (México), Height 5636 meters, Level 1\n#b Mount Whitney#! (California), Height 4421 meters, Level 1\n\n#V South America:#!\n#b Aconcagua#! (Mendoza), Height 6267 meters, Level 3\n#b Huascarán#! (Lima Territory), Height 6768 meters, Level 5\n#b Illimani#! (La Paz), Height 6438 meters, Level 4\n#b Chimborazo#! (Ecuador), Height 6267 meters, Level 1\n\n#V Europe:#!\n#b Shkara#! (Greater Caucasus), Height 5642 meters, Level 4\n#b Dufourspitze#! (West Switzerland), Height 4634 meters, Level 2\n#b Matterhorn#! (West Switzerland), Height 4478 meters, Level 3\n#b Aiguille Verte#! (Savoy), Height 4122 meters, Level 3\n#b Pico de Aneto#! (Aragon), Height 3404 meters, Level 1\n\n#V Africa:#!\n#b Kibo#! (Tanganyika), Height 5895 meters, Level 2\n#b Mount Kenya#! (Kenya), Height 5199 meters, Level 3\n#b Mount Stanley#! (Uganda), Height 5109 meters, Level 3\n#b Mount Cameroon#! (South Cameroon), Height 4095 meters, Level 1\n\n#V Asia:#!\n#b Kamet#! (Delhi), Height 7756 meters, Level 4\n#b Chogolisa#! (Kashmir), Height 7665 meters, Level 5\n#b Kabru#! (Himalayas), Height 7412 meters, Level 5\n#b Kaufmann Peak#! (Tajikistan), Height 7134 meters, Level 4\n\n#V Australia & Oceania:#!\n#b Mount Wilhelm#! (Eastern New Guinea), Height 4121 meters, Level 2\n#b Mount Cook#! (South Island), Height 3724 meters, Level 2"
 concept_panum_disease_description_describe: "описать"
 concept_panum_disease_description_described: "описана"
 concept_panum_disease_treatment_treat: "лечить"
 concept_panum_disease_treatment_treated: "вылечена"
 concept_roy_ethnologist: "#b #BLUE Этнолог#!#!"
 concept_roy_ethnologists: "#b #BLUE Этнологи#!#!"
 concept_roy_ethnologist_desc: "#n Скоро в Morgenröte!#!"
 ag_morgenroete_desc: "У вас есть открытые оповещения от мода [concept_morgenroete]."
 concept_tesla_engineer: "#b #ORANGE Инженер#!#!"
 concept_tesla_engineers: "#b #ORANGE Инженеры#!#!"
 concept_tesla_civil_engineer: "#b #ORANGE Инженер-строитель#!#!"
 concept_tesla_civil_engineers: "#b #ORANGE Инженеры-строители#!#!"
 concept_tesla_civil_engineering: "#b #ORANGE Гражданское строительство#!#!"
 concept_tesla_mechanical_engineer: "#b #ORANGE Инженер-механик#!#!"
 concept_tesla_mechanical_engineers: "#b #ORANGE Инженеры-механики#!#!"
 concept_tesla_mechanical_engineering: "#b #ORANGE Машиностроение#!#!"
 concept_tesla_military_engineer: "#b #ORANGE Военный инженер#!#!"
 concept_tesla_military_engineers: "#b #ORANGE Военные инженеры#!#!"
 concept_tesla_military_engineering: "#b #ORANGE Военно-инженерное дело#!#!"
 concept_tesla_electrical_engineer: "#b #ORANGE Инженер-электрик#!#!"
 concept_tesla_electrical_engineers: "#b #ORANGE Инженеры-электрики#!#!"
 concept_tesla_electrical_engineering: "#b #ORANGE Электротехника#!#!"
 concept_tesla_aeronautical_engineer: "#b #ORANGE Авиаконструктор#!#!"
 concept_tesla_aeronautical_engineers: "#b #ORANGE Авиаконструкторы#!#!"
 concept_tesla_aeronautical_engineering: "#b #ORANGE Авиастроение#!#!"
 concept_tesla_engineering: "Инженерное дело"
 concept_tesla_engineering_desc: "#b Инженерное дело#! - одна из главных особенностей мода [concept_morgenroete].\n\nЧтобы получить доступ к #b инженерному делу#!, вам нужен [concept_tesla_engineer]. #b Инженеры#! могут начинать #b инженерные проекты#! в зависимости от их специализации. Существует пять специализированных #b инженеров#!:\n- [concept_tesla_civil_engineer] специализируется на улучшении инфраструктуры страны.\n- [concept_tesla_mechanical_engineer] специализируется на механических изобретениях, которые приносят пользу, например, промышленности.\n- [concept_tesla_military_engineer] специализируется на улучшении армии и флота страны.\n- [concept_tesla_electrical_engineer] специализируется на улучшении электрической инфраструктуры страны.\n- [concept_tesla_aeronautical_engineer] специализируется на том, чтобы сделать возможными полёты человека и улучшить самолёты и другие летательные аппараты."
 concept_tesla_engineer_desc: "#b #ORANGE Инженеры#!#! - это учёные, которые помогают в строительстве особых сооружений, предоставляя свои экспертные знания.\nКроме того, #b #ORANGE инженеры#!#! дают бонус к [Concept('concept_technology_spread', 'распространению технологий')] вашей державы. Бонус зависит от того, сколько держав исследовали больше технологий, чем ваша."
 concept_tesla_civil_engineer_desc: "#b Civil Engineers#! focus on improving the infrastructure of a country.\nThey can start #b Engineering Projects#! to add [Concept('concept_modifier','$concept_modifiers|q$')] to states that raise [concept_infrastructure], to improve your #b Construction Sectors#! or to research [Concept('concept_technology', '$concept_technologies|q$')]."
 concept_tesla_mechanical_engineer_desc: "#b Mechanical Engineers#! focus on mechanical innovations that improve your industry, machines or the lives of your population.\nThey can start #b Engineering Projects#! to add [Concept('concept_modifier','$concept_modifiers|q$')] to your industrial building that improve [concept_throughput], [concept_good_production] and [concept_input_mult], to improve your #b Railways#! with new locomotives or to research industrial [Concept('concept_technology', '$concept_technologies|q$')]."
 concept_tesla_military_engineer_desc: "#b Military Engineer#! focus on improving our army and navy by introducing new innovations.\nThey can start #b Engineering Projects#! to gain new [Concept('concept_mobilization_option','$concept_mobilization_options|q$')] by inventing weapons, new field works and better tanks or to research military or naval [Concept('concept_technology', '$concept_technologies|q$')]."
 concept_tesla_electrical_engineer_desc: "#b Electrical Engineer#! focus on improving your country with electrical innovations.\nThey can start #b Engineering Projects#! to add [Concept('concept_modifier','$concept_modifiers|q$')] to your [GetBuildingType('building_power_plant').GetName] and [GetBuildingType('building_tesla_telegraph').GetName] that improve [concept_throughput], [concept_good_production] and [concept_input_mult], to unlock #V Communication#! as [concept_mobilization_option] or to research electrical [Concept('concept_technology', '$concept_technologies|q$')]."
 concept_tesla_aeronautical_engineer_desc: "#b Aeronautical Engineer#! focus on developing means to fly and improving airplanes and Zeppelins.\nThey can start #b Engineering Projects#! to add [Concept('concept_modifier','$concept_modifiers|q$')] to your #V Airports#! that improve [concept_throughput], [concept_good_production] and [concept_input_mult], to unlock #V Advanced Aircraft#! as [Concept('concept_mobilization_option','$concept_mobilization_options|q$')] or to research aviation [Concept('concept_technology', '$concept_technologies|q$')]."
 concept_vikelas_national_sport: "Национальный спорт"
 concept_vikelas_national_sport_desc: "Любая страна может объявить один из следующих видов спорта своим национальным: крикет, бейсбол, футбол или баскетбол. Три из этих четырёх видов спорта (за исключением крикета) были изобретены только в XIX веке. Страна, которая первой изобретает вид спорта, считается «родиной» этого вида спорта. С этого момента спорт распространяется по всему миру, но не на одинаковых условиях: распространение крикета и бейсбола более ограничено, в то время как распространение футбола и баскетбола подвержено менее строгим условиям. Спорт может быть распространён сюзереном среди подданных для улучшения отношений. Различные виды спорта могут сосуществовать в одной стране, но чтобы распространиться по всей стране в каждом спортивном объекте, они должны быть национальным видом спорта."
 concept_theiler_microorganism: "Микроорганизм"
 concept_theiler_microorganisms: "Микроорганизмы"
 concept_theiler_microorganism_desc: "Microorganisms are tiny organisms like bacteria, viruses and single celled organisms.\nThey can be found by a [concept_theiler_biologist] through the $je_theiler_microorganism_research$ [concept_journal_entry] which Biologists conduct when they are not busy.\nMicroorganisms can mainly be used to discover [Concept('concept_theiler_pathogen','$concept_theiler_pathogens|q$')] and [Concept('concept_theiler_vaccine','$concept_theiler_vaccines|q$')] which help a country to protect their population from [Concept('concept_panum_disease','$concept_panum_diseases|q$')]."
 concept_theiler_biology: "Биология"
 concept_theiler_biology_desc: "In [concept_morgenroete], #b Biology#! plays a vital supporting role in the medical and agricultural sectors. Microbiological studies are particularly important: a [concept_theiler_biologist] can identify [Concept('concept_theiler_microorganism','$concept_theiler_microorganisms|q$')], especially [Concept('concept_theiler_pathogen','$concept_theiler_pathogens|q$')]. The latter is useful for developing [Concept('concept_theiler_vaccine','$concept_theiler_vaccines|q$')]. Vaccines can completely prevent the onset of [Concept('concept_panum_disease','$concept_panum_diseases|q$')] if the healthcare system is well-developed. Furthermore, biologists are useful in [concept_theiler_pest] control, such as combating the codling moth, and improve the output of agricultural businesses."
 concept_ito_medicinal_plants: "Лекарственные растения"
 concept_ito_medicinal_plants_desc: "Лекарственные растения обладают целебными свойствами, которые можно использовать для создания фармацевтических препаратов и других полезных химических веществ.\nВы можете собирать лекарственные растения, отправив [Concept('concept_dubois_naturalist', '#b #GREEN натуралиста#!#!')] в [Concept('concept_dubois_botanical_expedition', 'ботаническую экспедицию')]. Когда будет собрано достаточно растений, [concept_mendelejew_chemist|l] сможет приступить к выделению химического вещества. После этого [concept_theiler_biologist|l] сможет начать производство фармацевтического препарата."
 concept_academics_academic_confusion: "Научная неразбериха"
 concept_academics_academic_confusion_desc: "Изменение [Concept('concept_academics_university_specialization', 'специализации')] университета приведёт к тому, что многие учёные будут в замешательстве. В результате на какое-то время снизится научная продуктивность."
 concept_academics_experience_civil_engineer: "Опыт инженера-строителя"
 concept_academics_experience_mechanical_engineer: "Опыт инженера-механика"
 concept_academics_experience_military_engineer: "Опыт военного инженера"
 concept_academics_experience_electrical_engineer: "Опыт инженера-электрика"
 concept_academics_experience_aeronautical_engineer: "Опыт авиаконструктора"
 concept_academics_experience_chemist: "Опыт химика"
 concept_academics_experience_astronomer: "Опыт астронома"
 concept_academics_experience_geologist: "Опыт геолога"
 concept_academics_experience_paleontologist: "Опыт палеонтолога"
 concept_academics_experience_naturalist: "Опыт натуралиста"
 concept_academics_experience_biologist: "Опыт биолога"
 concept_academics_experience_physician: "Опыт врача"
 concept_academics_experience_archaeologist: "Опыт археолога"
 concept_academics_experience_anthropologist: "Опыт антрополога"
 concept_academics_experience_tethnologist: "Опыт этнолога"
 concept_academics_experience_experienced: "Опытный"
 concept_academics_experience_famous: "Знаменитый"
 concept_andersson_anthropologist: "#b #BLUE Антрополог#!#!"
 concept_andersson_anthropologists: "#b #BLUE Антропологи#!#!"
 concept_andersson_anthropologist_desc: "#b #BLUE Anthropologists#!#! are academics who study human prehistory, both in the paleontological and archaeological senses. They search for [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils|q$')], [Concept('concept_andersson_prehistoric_artifact','$concept_andersson_prehistoric_artifacts|q$')], find new human species and reconstruct [Concept('concept_andersson_skeleton','$concept_andersson_skeletons|q$')]. Anthropologists often work as speleologists (cave explorers) and, over time, can develop a wide range of specializations. These include categories such as monogenists, polygenists, diffusionists and evolutionists, whose voting behaviour at conferences often determines the outcome. Particularly skilled anthropologists can reform existing anthropological terminology of the [concept_andersson_human_evolution] or shed light on the Piltdown fraud."
 concept_andersson_human_fossil: "Ископаемые останки человека"
 concept_andersson_human_fossils: "Ископаемые останки людей"
 concept_andersson_human_bones: "Человеческие кости"
 concept_andersson_human_fossil_desc: "There are essentially two types of #b Human Fossils#!: non-specific fossils and specific fossils. Non-specific fossils are all remains of human biology, including those of a recent nature from historical times. They can also be found by people other than anthropologists, but are important, for example, for the establishment of the [GetBuildingType('building_andersson_institute').GetName]. Specific human fossils belong to one of four groups: Neoanthropus, Palaeanthropus, Pithecanthropus, Australopithecus. They can be found during a hominid survey or a hominid expedition. [Concept('concept_andersson_anthropologist','$concept_andersson_anthropologists|q$')] may also discover entirely new types in the process. There are a total of 16 different specific human fossils. [Concept('concept_andersson_skeleton','$concept_andersson_skeletons|q$')] can also be reconstructed from them to trace [concept_andersson_human_evolution]."
 concept_andersson_cave: "Пещера"
 concept_andersson_caves: "Пещеры"
 concept_andersson_cave_desc: "#b Prehistoric Caves#! are a place where early human or pre-human species have left [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils|q$')]. They therefore provide a bonus when conducting anthropological research. Caves can be discovered and explored by [Concept('concept_andersson_anthropologist','$concept_andersson_anthropologists|q$')]. Some Caves are also unlocked through historical events."
 concept_andersson_human_evolution: "Эволюция человека"
 concept_andersson_human_evolution_desc: "In the Victorian era, there was a tendency to classify [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils|q$')] and evolutionary stages according to their higher level of development. A distinction was drawn between the 'gifted' Homo sapiens, endowed with artistic talent, and their more coarse-featured ancestors or ape-like counterparts. Thus, the precursors of humanity were divided into categories such as Neoanthropus (True Man), Palaeanthropus (Cave Man) and Pithecanthropus (Ape-Man); the latter represented the actual 'missing link' between animals and humans. Although these concepts were frequently rejected by later scholarship, they served as an initial point of reference for further research into the early history of humankind. The discovery of Australopithecus (Southern Ape) in Africa was therefore, for a number of reasons, one that shook the established view."
 concept_andersson_prehistoric_artifact: "Доисторический артефакт"
 concept_andersson_prehistoric_artifacts: "Доисторические артефакты"
 concept_andersson_prehistoric_artifact_desc: "#b Prehistoric Artifacts#! provide evidence of human presence in a [concept_andersson_cave] or other archaeological sites. Unlike non-specific [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils|q$')], they directly give [concept_andersson_anthropological_prestige]. In rare cases, they are also required for exhibitions on human life during the Neolithic, Mesolithic or Upper Palaeolithic periods. An [concept_andersson_anthropologist] with the [concept_lepsius_archaeologist] trait finds more prehistoric artifacts during an anthropological research."
 concept_andersson_skeleton: "Доисторический скелет"
 concept_andersson_skeletons: "Доисторические скелеты"
 concept_andersson_skeleton_desc: "Reconstructing a #b Prehistoric Skeleton#! requires the construction of a [GetBuildingType('building_andersson_institute').GetName]. Once [Concept('concept_andersson_anthropologist','$concept_andersson_anthropologists|q$')] have found five [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils|q$')] of a specific species, they can begin the reconstruction - the anthropologist's [Concept('concept_character_trait','$concept_character_traits|q$')] and experience affect the duration of the process. The first skeleton of a Neoanthropus, Palaeanthropus or Pithecanthropus activates the respective production method in the institute. However, an anthropologist can also easily reconstruct the other skeletons, provided they have the fossils, in order to gain further [concept_andersson_anthropological_prestige]."
 concept_lepsius_minor_excavation_site: "Малое место раскопок"
 concept_lepsius_minor_excavation_site_desc: "Besides the large [Concept('concept_lepsius_excavation_site', '$concept_lepsius_excavation_sites|q$')], which are potentially usable by all countries internationally via a [concept_mr_research_charter] and offer Egyptian, Mesopotamian, Aegean, and pre-Columbian [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts|q$')], there are also 'smaller' excavation sites. These are only usable by the owner and contain only local artifacts. They are unlocked via a Journal Entry, which usually requires an [concept_lepsius_archaeologist] and special technology. Only then is the excavation site actually activated, visible through a State Trait in the State Region. After activation, Minor Excavation Sites generate an additional Local Artifact as long as the archaeologist is conducting an archaeological project. Examples of such excavation sites are Pompeii, Tikal, or Harappa."
 concept_andersson_prehistoric_venus: "Доисторическая Венера"
 concept_andersson_prehistoric_venuses: "Доисторические Венеры"
 concept_andersson_special_human_fossil: "Особые ископаемые останки человека"
 concept_lepsius_minor_excavation_sites: "Малые места раскопок"
 concept_lepsius_egyptian_artifact: "Египетский артефакт"
 concept_lepsius_egyptian_artifacts: "Египетские артефакты"
 concept_lepsius_mesopotamian_artifact: "Месопотамский артефакт"
 concept_lepsius_mesopotamian_artifacts: "Месопотамские артефакты"
 concept_lepsius_aegean_artifact: "Эгейский артефакт"
 concept_lepsius_aegean_artifacts: "Эгейские артефакты"
 concept_lepsius_precolumbian_artifact: "Доколумбовый артефакт"
 concept_lepsius_precolumbian_artifacts: "Доколумбовые артефакты"
 concept_lepsius_major_egyptian_artifact: "Крупный $concept_lepsius_egyptian_artifact$"
 concept_lepsius_major_egyptian_artifacts: "Крупные $concept_lepsius_egyptian_artifacts$"
 concept_lepsius_major_mesopotamian_artifact: "Крупный $concept_lepsius_mesopotamian_artifact$"
 concept_lepsius_major_mesopotamian_artifacts: "Крупные $concept_lepsius_mesopotamian_artifacts$"
 concept_lepsius_major_aegean_artifact: "Крупный $concept_lepsius_aegean_artifact$"
 concept_lepsius_major_aegean_artifacts: "Крупные $concept_lepsius_aegean_artifacts$"
 concept_lepsius_major_precolumbian_artifact: "Крупный $concept_lepsius_precolumbian_artifact$"
 concept_lepsius_major_precolumbian_artifacts: "Крупные $concept_lepsius_precolumbian_artifacts$"
 concept_lepsius_local_artifact: "Местный артефакт"
 concept_lepsius_local_artifacts: "Местные артефакты"
 concept_lepsius_major_local_artifact: "Крупный $concept_lepsius_local_artifact$"
 concept_lepsius_major_local_artifacts: "Крупные $concept_lepsius_local_artifacts$"
 concept_andersson_neoanthropus_fossil: "Ископаемые останки неоантропа"
 concept_andersson_palaeanthropus_fossil: "Ископаемые останки палеоантропа"
 concept_andersson_pithecanthropus_fossil: "Ископаемые останки питекантропа"
 concept_andersson_australopithecus_fossil: "Ископаемые останки австралопитека"
 concept_andersson_anthropological_prestige: "Антропологический престиж"
 concept_andersson_anthropological_prestige_desc: "#b Антропологический престиж#! означает общий престиж, накопленный благодаря антропологическим достижениям. Он начисляется следующим образом:\n\n#b Доисторический артефакт#!: 1 престижа\n#b Окаменелость неоантропа, палеоантропа, питекантропа или австралопитека#!: 1 престижа\n#b Фигурка Венеры#!: 5 престижа\n#b Пещерные рисунки#!: 10 престижа\n#b Открытие антропологии#!: 15 престижа\n#b Новый тип неоантропа#!: 20 престижа\n#b Новый тип палеоантропа#!: 40 престижа\n#b Новый тип питекантропа#!: 60 престижа\n#b Новый тип австралопитека#!: 80 престижа\n#b Скелет неоантропа#!: 25 престижа\n#b Скелет палеоантропа#!: 50 престижа\n#b Скелет питекантропа#!: 75 престижа\n#b Скелет австралопитека#!: 100 престижа\n#b Введение Homo sapiens#!: 40 престижа\n#b Введение Homo neanderthalensis#!: 50 престижа\n#b Введение Homo erectus#!: 50 престижа"
 concept_andersson_anthropology: "Антропология"
 concept_andersson_anthropology_desc: "#b Anthropology#! focuses primarily on the prehistoric ancestors of humankind - from the Neolithic period right back to Australopithecus. [Concept('concept_andersson_anthropologist','$concept_andersson_anthropologists|q$')] examine [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils|q$')] and [Concept('concept_andersson_prehistoric_artifact','$concept_andersson_prehistoric_artifacts|q$')] in particular in order to reconstruct the distant past. Anthropologists still view [concept_andersson_human_evolution] as a progression from ape-man, through early man, to modern man (Pithecanthropus, Palaeanthropus, Neoanthropus). Accordingly, anthropologists search worldwide for representatives of these species, naming the types according to their sites of discovery. With enough fossils, they can reconstruct a [concept_andersson_skeleton]. In addition, they discover cave paintings, carry out craniometric measurements or organise exhibitions on the Neolithic, Mesolithic and Upper Palaeolithic periods. Two conferences, namely on the peopling of the Americas and the origins of modern humans, fall within their remit."
 concept_dubois_natural_history_paleontology: "Палеонтология"
 concept_dubois_dinosaur_fossils: "Окаменелости динозавров"
 concept_dubois_great_formations: "Великие формации"
 concept_panum_pandemic: "Пандемия"
 concept_theiler_pest: "Вредитель"
 concept_theiler_pests: "Вредители"
 concept_theiler_pest_desc: "Pests are primarily agricultural pests—most often insects—that can have a significant impact on a nation's agricultural production. Unlike many other factors affecting crops, they can persist for years, though they may subsequently vanish completely for a certain period. A [concept_theiler_biologist]—and sometimes a [concept_mendelejew_chemist]—can devise ways to contain this threat or eliminate it entirely. Pests are:\n\n- [GetHarvestConditionType('theiler_boll_weevil_condition').GetName]\n- [GetHarvestConditionType('theiler_codling_moth_condition').GetName]\n- [GetHarvestConditionType('theiler_grape_phylloxera_condition').GetName]\n- [GetHarvestConditionType('locust_swarm').GetName]\n- [GetHarvestConditionType('theiler_potato_beetle_condition').GetName]\n- [GetHarvestConditionType('theiler_screwworm_fly_condition').GetName]\n- [GetHarvestConditionType('theiler_tea_mosquito_condition').GetName]"
 concept_vikelas_mechanical_innovation_desc: "Механические инновации используются [Concept('concept_vikelas_mechanic', 'механиком')] для улучшения [Concept('concept_vikelas_race_car', 'гоночного автомобиля')]. С их помощью можно повысить скорость, надёжность и безопасность гоночной машины."
 concept_academics_experience_mathematical_physicist: "Physicist Experience"
 concept_academics_experience_meteorological_physicist: "Physicist Experience"
 concept_academics_experience_rocket_physicist: "Physicist Experience"
 concept_academics_experience_nuclear_physicist: "Physicist Experience"
 concept_academics_license: "Research License"
 concept_academics_license_desc: "A research license grants various academics—and, in the case of mountaineers, athletes—access to a nation's cultural and natural assets. This makes possible archaeological, botanical, and paleontological expeditions, as well as mountaineering expeditions. However, a research license entails costs; one should therefore only purchase licenses from countries that actually have something worth researching."
 concept_mr_research_charter: "Research Charter"
 concept_mr_research_charters: "Research Charters"
 concept_mr_research_charter_desc: "In many cases, a research charter provides a country with the opportunity to gather scientific data through expeditions abroad. Archaeological excavations, botanical research in the rainforest, paleontological expeditions, and mountain climbs all require the existence of a research charter with the country where these activities are to be conducted.\n\n#R In the event of a war with the Research Charter grantor, the agreement is suspended; expeditions to the target country are then no longer possible during the war.#!"
 concept_curie_physics: "Physics"
 concept_curie_rocket_science: "Rocket Science"
 concept_curie_nuclear_science: "Nuclear Science"
 concept_curie_physics_desc: "#b Physics#! refers to the totality of [Concept('concept_curie_physicist','$concept_curie_physicists|q$')]' activities in [concept_morgenroete]. There are four different types of physicists in total: [Concept('concept_curie_mathematical_physicist','$concept_curie_mathematical_physicists|q$')], [Concept('concept_curie_meteorological_physicist','$concept_curie_meteorological_physicists|q$')], [Concept('concept_curie_rocket_physicist','$concept_curie_rocket_physicists|q$')] and [Concept('concept_curie_nuclear_physicist','$concept_curie_nuclear_physicists|q$')]. All physicists can carry out physics experiments, establish a [Concept('concept_curie_geomagnetism','$concept_curie_geomagnetic_observatory|q$')] and collect [concept_curie_physical_data]. Whilst mathematicians derive [Concept('concept_curie_mathematics','$concept_curie_mathematical_formulas|q$')] and meteorologists devote themselves to [Concept('concept_curie_meteorology','$concept_curie_weather_observation|q$')], rocket physicists and nuclear physicists are only available late in the game and are often responsible for scientific milestones, some of which extend beyond the timeframe of Victoria 3: these include the first suborbital rocket flight or the construction of a nuclear reactor."
 concept_curie_physical_data: "Physical Data"
 concept_curie_physical_data_desc: "Physical data—or, more precisely, physical-mathematical data—comprises the abstract sum of a nation's physical knowledge, which can serve as a starting point for further research. Physical data is therefore raw data or observations from which further formulas, theories, or practically applicable projects can be developed. Technologies, events, specific buildings, or production methods, as well as the actions of a [concept_curie_physicist], can generate physical data. Put simply, one could view physical data as a form of innovation currency in the physical realm that is required for unlocking certain features. Physical data is used primarily in the fields of [concept_curie_rocketry] and [concept_curie_nuclear_physics], and to a lesser extent in [concept_curie_mathematics]."
 concept_curie_mathematics: "Mathematics"
 concept_curie_mathematical_formulas: "Mathematical Formulas"
 concept_curie_mathematics_desc: "In total, there are 25 different mathematical branches in [concept_morgenroete] that represent theories and formulas in the fields of mathematics and theoretical physics. Five of these formulas have already been researched by 1836. A [concept_curie_mathematical_physicist], provided they have the right technology, can also research the formulas associated with that technology. New formulas boost national mathematical innovation—a stat that increases monthly innovation capacity and reduces the penalty for researching technologies ahead of their time. Once the research is complete, all nations gain access to this formula, which represents international mathematical innovation. The value of both national and international mathematical innovation is combined when a mathematician conducts mathematical research. Research into new formulas requires [concept_curie_physical_data]."
 concept_curie_meteorology: "Meteorology"
 concept_curie_weather_observation: "Weather Observation"
 concept_curie_cloud: "Cloud"
 concept_curie_clouds: "Clouds"
 concept_curie_meteorology_desc: "Meteorology is the best way to predict extreme weather events and better prepare for impending adversity—or to take advantage of periods of good weather for planting and harvesting. A [concept_curie_meteorological_physicist] can expand the main weather station or use a [building_tesla_telegraph] to set up smaller measuring stations across the country. Weather services also influence agriculture and maritime traffic. Furthermore, a meteorologist can observe the ten classic cloud types and catalog them for the cloud atlas—knowledge of specific clouds also has a positive effect. In [concept_curtiss_aviation]—and especially in [concept_santos_ballooning]—meteorology plays an important supporting role in making journeys safer and more successful."
 concept_curie_mathematical_physicist: "#b #ORANGE Mathematician#!#!"
 concept_curie_mathematical_physicists: "#b #ORANGE Mathematicians#!#!"
 concept_curie_mathematical_physicist_desc: "#b Mathematicians#! represent the theoretical aspect of [concept_curie_physics].\nThey can develop new [Concept('concept_curie_mathematics','$concept_curie_mathematical_formulas|q$')] or physical theories to reduce the penalty for technologies that are ahead of their time and to increase innovation capacity."
 concept_curie_meteorological_physicist: "#b #ORANGE Meteorologist#!#!"
 concept_curie_meteorological_physicists: "#b #ORANGE Meteorologists#!#!"
 concept_curie_meteorological_physicist_desc: "#b Meteorologists#! have devoted themselves entirely to [Concept('concept_curie_meteorology','$concept_curie_weather_observation|q$')].\nThey collect [concept_curie_physical_data], provide early warnings for maritime traffic, reduce the likelihood of adverse weather events during a battle, and, through timely forecasts, ensure better protection against weather-related disasters in agriculture."
 concept_curie_rocket_physicist: "#b #ORANGE Rocket Physicist#!#!"
 concept_curie_rocket_physicists: "#b #ORANGE Rocket Physicist#!#!"
 concept_curie_rocket_physicist_desc: "#n Coming soon to Morgenröte!#!"
 concept_curie_nuclear_physicist: "#b #ORANGE Nuclear Physicist#!#!"
 concept_curie_nuclear_physicists: "#b #ORANGE Nuclear Physicist#!#!"
 concept_curie_nuclear_physicist_desc: "#n Coming soon to Morgenröte!#!"
 concept_dubois_great_formation: "Great Formation"
 concept_santos_balloonist_role: "Balloonist"
 concept_santos_balloonist_role_only_balloonist: "Balloonist"
 concept_santos_balloonists_role: "Balloonists"
 concept_santos_balloonist_role_desc: "A #b Balloonist#! is a special character that can be sponsored by a nation. Usually well developed or western countries will sponsor #b Balloonist#! and compete for records and new findings. The #b Balloonists#! will randomly conduct flights and get [Concept('concept_santos_balloon_record','$concept_santos_balloon_records|q$')] either for the longest distance, the longest flight time or the highest flight. For every balloon flight the #b Balloonist#! will get experience and rank up which will raise the chance for new records. A balloonist can also embark on adventurous journeys, attempt a daring [concept_santos_balloon_crossing] or simply enjoy leisurely flights. But be aware that [concept_santos_ballooning] is a dangerous business and many balloonists die early, especially if they are sick, alcoholics or drug abusers. Every #b Balloonist#! has a [concept_santos_balloon] with a specific name and specific characteristics."
 concept_santos_ballooning: "Ballooning"
 concept_santos_ballooning_desc: "Ballooning is the earliest form of [concept_curtiss_aviation] in [concept_morgenroete], and due to its inherent danger at the start of the game, it is reserved only for particularly daring adventurers. A [concept_santos_balloonist] can lead a peaceful life taking pleasure flights—or risk ambitious [concept_santos_balloon_record] flights and [Concept('concept_santos_balloon_crossing','$concept_santos_balloon_crossings|q$')] that pose a mortal danger. On adventure expeditions, balloonists pursue their [Concept('concept_academics_academic','$concept_academics_academics|q$')] interests and bring back useful items. As the game progresses, ballooning becomes increasingly professionalized and, with the Gordon Bennett Cup and flights into the stratosphere, evolves into a field that is highly regarded both in sports and science. Ballooning is intertwined with [concept_curie_meteorology] in many ways. As well as the qualities of the balloonist, the characteristics of the [concept_santos_balloon] itself are also crucial to the success of a balloon flight."
 concept_santos_balloonist: "Balloonist"
 concept_santos_balloonist_desc: "This character is a balloonist who often goes on adventurous balloon rides."
 concept_santos_experienced_balloonist: "Experienced Balloonist"
 concept_santos_experienced_balloonist_desc: "This character is an experienced balloonist who often goes on adventurous balloon rides. Characters with this trait have a higher chance of setting better records."
 concept_santos_famous_balloonist: "Famous Balloonist"
 concept_santos_famous_balloonist_desc: "This character is a famous balloonist who often goes on adventurous balloon rides. Characters with this trait have a higher chance of setting better records."
 concept_curie_formulas: "Formulas"
 concept_curie_magnetic_data: "Magnetic Data"
 concept_curie_geomagnetism: "Geomagnetism"
 concept_curie_geomagnetic_observatory: "Geomagnetic Observatory"
 concept_curie_geomagnetism_desc: "At the beginning of the 19th century, interest in geomagnetism and geophysics grew immensely within the fledgling natural sciences. The [concept_curie_mathematical_physicist] Carl Friedrich Gauss and the [Concept('concept_curie_physicist','$concept_curie_physicists|q$')] Wilhelm Weber played a particularly significant role in this development; together with Alexander von Humboldt, they founded the Magnetic Association. Shortly thereafter, numerous countries established geomagnetic observation stations to study the Earth's magnetism. This work not only yielded new insights into the Earth's magnetic field—and thus improved navigational, physical, and geological knowledge—but also produced reference works such as the Geomagnetic Atlas.\nCountries that join the Magnetic Association may establish their own Geomagnetic Observatory at the observatory, provided they have a physicist on staff. Once established, the station sends [concept_curie_magnetic_data] annually to the founding country of the Magnetic Association; each time the maximum value is reached, a reward is granted in the form of physical data or new resource deposits. With each subsequent success, the amount of magnetic data required for the next bonus increases."
 concept_curie_rocketry: "Rocketry"
 concept_curie_rocketry_desc: "#n Coming soon to Morgenröte!#!"
 concept_curie_nuclear_physics: "Nuclear Physics"
 concept_curie_nuclear_physics_desc: "#n Coming soon to Morgenröte!#!"
 concept_santos_balloon: "Balloon"
 concept_santos_balloon_desc: "The balloon is a [concept_santos_balloonist]'s most important tool and plays a crucial role in [concept_santos_balloon_record] flights and [Concept('concept_santos_balloon_crossing','$concept_santos_balloon_crossings|q$')]. Balloons can be adapted through technical advances; for example, through new technologies, specialisation in a particular type, or a change in fuel. Every balloon has specific values for altitude, distance and time. The average values are merely guidelines, as the characteristics of the balloonist also have an influence, and each value has a maximum and a minimum between which a balloon fluctuates during its flights. This means that the same balloon, with the same balloonist, may produce slightly different values during successive flights."
 concept_santos_balloon_record: "Balloon Record"
 concept_santos_balloon_records: "Balloon Records"
 concept_santos_balloon_record_desc: "Traditionally, a [concept_santos_balloonist] attempts to set balloon records in order to attract international attention. The recognised categories for balloon records are altitude, distance and time. The prestige gained from this increases with the magnitude of the record: every 500 metres in altitude, every 100 kilometres in distance and every 3 hours in time are rewarded with one prestige point. The key factors in setting these records are, above all, the characteristics of the [concept_santos_balloon] itself, which can be improved through technology, specialisation and changes to the fuel. Added to this are the personal qualities of the balloonist and, in certain cases, the presence of a [concept_curie_mathematical_physicist]. Record attempts in [concept_santos_ballooning] are a risky undertaking and can, in some cases, result in the death of the balloonist."
 concept_santos_balloon_crossing: "Balloon Crossing"
 concept_santos_balloon_crossings: "Balloon Crossings"
 concept_santos_balloon_crossing_desc: "Balloon crossings are the supreme challenge in [concept_santos_ballooning], the one that brings the most recognition. At the same time it is the most dangerous undertaking, in which a [concept_santos_balloonist] is most likely to lose their life. Seven of the nine balloon crossings are based on historical precedents; the crossings of the Strait of Korea and the Red Sea, on the other hand, are possible but have not been achieved within the Victoria 3 timeframe.\nBalloon crossings require not only specific technologies but also that the [concept_santos_balloon] meets minimum requirements in terms of altitude and distance. However, it is advisable not to fly using only the minimum requirements; whilst this may be possible for simple crossings, it can lead to disaster even with moderate requirements. Experienced balloonists with good [Concept('concept_character_trait','$concept_character_traits|q$')], in particular, are best placed to successfully complete a balloon crossing. In particular, the 'ambitious' trait is an advantage, but the 'meteorologist' trait can also work wonders. If the balloonist is not a meteorologist themselves, the presence of a [concept_curie_meteorological_physicist] has the same effect."
 concept_curie_magnetic_data_desc: "Magnetic data is primarily collected at a [Concept('concept_curie_geomagnetism','$concept_curie_geomagnetic_observatory|q$')], but can also be obtained incidentally during research missions. Magnetic data is sent annually to the founding country of the Magnetic Association and grants a bonus when the maximum data value is reached."