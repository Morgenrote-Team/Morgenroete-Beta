 santos_ballooning_danger_progress_bar_desc: "Опасность: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|1%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/[GetPlayer.MakeScope.ScriptValue('santos_balloon_crossing_danger_value')|0])"
