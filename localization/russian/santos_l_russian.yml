 santos_balloon_crossing_event_favorable_weather_title_flag: "Благоприятная погода"
 santos_balloon_crossing_event_favorable_weather_flag: "#t $santos_balloon_crossing_event_favorable_weather_title_flag$#!\nСветит солнце, дует попутный ветер. Шар продвигается быстрее, чем ожидалось."
 santos_balloon_crossing_event_wind_shear_icon_flag: "@santos_event_log_positive_wind_shear_icon!"
 santos_balloon_crossing_event_wind_shear_title_flag: "Сдвиг ветра"
 santos_balloon_crossing_event_wind_shear_flag: "#t $santos_balloon_crossing_event_wind_shear_title_flag$#!\nВетер переменился в пользу аэронавта. Шар буквально скользит по небу!\n\n#b Вероятность такого исхода повышается, если:#!\nУ [Concept('concept_santos_balloonist', 'аэронавта')] есть [concept_character_trait] «$santos_balloonist_experienced$», «$santos_balloonist_hero$» или «$ambitious$»."
 santos_balloon_crossing_event_balloonist_maneuver_icon_flag: "@santos_event_log_positive_balloonist_maneuver_icon!"
 santos_balloon_crossing_event_balloonist_maneuver_title_flag: "Манёвр аэронавта"
 santos_balloon_crossing_event_balloonist_maneuver_flag: "#t $santos_balloon_crossing_event_balloonist_maneuver_title_flag$#!\nСмелый манёвр аэронавта вывел шар в выгодное положение и позволил продвинуться как можно дальше.\n\n#b Вероятность такого исхода повышается, если:#!\nУ [Concept('concept_santos_balloonist', 'аэронавта')] есть [concept_character_trait] «$santos_balloonist_experienced$», «$santos_balloonist_hero$» или «$ambitious$»."
 santos_balloon_crossing_event_cautious_flight_icon_flag: "@santos_event_log_positive_cautious_flight_icon!"
 santos_balloon_crossing_event_cautious_flight_title_flag: "Осторожный полёт"
 santos_balloon_crossing_event_cautious_flight_flag: "#t $santos_balloon_crossing_event_cautious_flight_title_flag$#!\nАэронавт избегает всех необязательных рисков.\n\n#b Вероятность такого исхода повышается, если:#!\nУ [Concept('concept_santos_balloonist', 'аэронавта')] есть [concept_character_trait] «$cautious$»."
 santos_balloon_crossing_event_unfavorable_weather_icon_flag: "@santos_event_log_negative_unfavorable_weather_icon!"
 santos_balloon_crossing_event_unfavorable_weather_title_flag: "Неблагоприятная погода"
 santos_balloon_crossing_event_unfavorable_weather_flag: "#t $santos_balloon_crossing_event_unfavorable_weather_title_flag$#!\nИз-за плохой погоды путешествие на воздушном шаре оказывается труднее, чем ожидалось."
 santos_balloon_crossing_event_confusing_situation_icon_flag: "@santos_event_log_negative_confusing_situation_icon!"
 santos_balloon_crossing_event_confusing_situation_title_flag: "Неясная обстановка"
 santos_balloon_crossing_event_confusing_situation_flag: "#t $santos_balloon_crossing_event_confusing_situation_title_flag$#!\nОблачность, морозные ночи и общая неопределённость затрудняют перелёт.\n\n#b Вероятность такого исхода повышается, если:#!\nУ [Concept('concept_santos_balloonist', 'аэронавта')] есть [concept_character_trait] «$reckless$», «$wrathful$» или «$arrogant$» либо #V отрицательная черта состояния, например болезнь или зависимость#!."
 santos_balloon_crossing_event_dangerous_fog_icon_flag: "@santos_event_log_negative_dangerous_fog_icon!"
 santos_balloon_crossing_event_dangerous_fog_title_flag: "Опасный туман"
 santos_balloon_crossing_event_dangerous_fog_flag: "#t $santos_balloon_crossing_event_dangerous_fog_title_flag$#!\nСгущающийся туман подвергает путешествие всё большей опасности!\n\n#b Вероятность такого исхода повышается, если:#!\nУ [Concept('concept_santos_balloonist', 'аэронавта')] есть [concept_character_trait] «$reckless$», «$wrathful$» или «$arrogant$» либо #V отрицательная черта состояния, например болезнь или зависимость#!.\n\n#b Вероятность такого исхода снижается, если:#!\nУ [Concept('concept_santos_balloonist', 'аэронавта')] есть [concept_character_trait] «$curie_meteorological_physicist$». Либо у нас есть [concept_curie_meteorological_physicist]."
 santos_balloon_crossing_event_violent_storm_icon_flag: "@santos_event_log_negative_wind_icon!"
 santos_balloon_crossing_event_violent_storm_title_flag: "Сильная буря"
 santos_balloon_crossing_event_violent_storm_flag: "#t $santos_balloon_crossing_event_violent_storm_title_flag$#!\nБуря или сильные ветры на большой высоте могут причинить шару немало неприятностей!\n\n#b Вероятность такого исхода снижается, если:#!\nУ [Concept('concept_santos_balloonist', 'аэронавта')] есть [concept_character_trait] «$curie_meteorological_physicist$». Либо у нас есть [concept_curie_meteorological_physicist]."
 santos_balloon_crossing_event_balloonist_error_icon_flag: "@santos_event_log_negative_balloonist_error_icon!"
 santos_balloon_crossing_event_balloonist_error_title_flag: "Ошибка аэронавта"
 santos_balloon_crossing_event_balloonist_error_flag: "#t $santos_balloon_crossing_event_balloonist_error_title_flag$#!\nИз-за ошибки аэронавта в управлении экспедиция столкнулась с трудностями.\n\n#b Вероятность такого исхода повышается, если:#!\nУ [Concept('concept_santos_balloonist', 'аэронавта')] есть [concept_character_trait] «$reckless$», «$wrathful$» или «$arrogant$».\n\n#b Вероятность такого исхода снижается, если:#!\nУ [Concept('concept_santos_balloonist', 'аэронавта')] есть [concept_character_trait] «$santos_balloonist_experienced$»."
 santos_balloon_crossing_event_altitude_sickness_icon_flag: "@santos_event_log_negative_altitude_sickness_icon!"
 santos_balloon_crossing_event_altitude_sickness_title_flag: "Высотная болезнь"
 santos_balloon_crossing_event_altitude_sickness_flag: "#t $santos_balloon_crossing_event_altitude_sickness_title_flag$#!\nАэронавт поднялся выше критической отметки в 7000 метров и теперь страдает от острой нехватки кислорода.\n\n#b Вероятность такого исхода снижается, если:#!\nВ [GetPlayer.GetAltNameNoFlag('RU_CL_PP')] исследована технология «[GetTechnology('electric_arc_process').GetName]»."
 santos_balloon_crossing_event_the_pampero_icon_flag: "@santos_event_log_negative_wind_icon!"
 santos_balloon_crossing_event_the_pampero_title_flag: "Памперо"
 santos_balloon_crossing_event_the_pampero_flag: "#t $santos_balloon_crossing_event_the_pampero_title_flag$#!\nШар попал в памперо — печально известный внезапный шквал над Ла-Платой!\n\n#b Вероятность такого исхода снижается, если:#!\nУ [Concept('concept_santos_balloonist', 'аэронавта')] есть [concept_character_trait] «$curie_meteorological_physicist$». Либо у нас есть [concept_curie_meteorological_physicist]."
