 santos.401.t: "Выбор маршрута"
 santos.401.d: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] ещё решает, какой [concept_santos_balloon_crossing] предпринять. Маршрут нужно выбирать с осторожностью — это путешествие может стать последним..."
 santos.401.f: "«Скорее запаситесь тафтой и верёвками, и вы увидите одно из самых поразительных зрелищ на свете». — Жозеф-Мишель Монгольфье"
 santos.431.d: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'совершила', 'совершил')] выдающийся перелёт по маршруту «[Scope.Var('santos_balloon_crossing_target_var').GetFlagName]». После долгих часов упорной борьбы сомнений больше нет: испытание пройдено. Солнце ярко сияет в голубом небе, возвещая новый день в истории воздухоплавания!"
 santos.431.g: "Выдающееся достижение для аэронавта!"
