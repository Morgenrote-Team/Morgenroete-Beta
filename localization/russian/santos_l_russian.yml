 curtiss.614.t_capital: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] подумывает о переезде в город [SCOPE.sCountry('curtiss_august_piccard_destination').GetCapital.GetCityHubName]"
 curtiss.614.d_brussels: "[SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'Одна из наших важнейших учёных', 'Один из наших важнейших учёных')], [SCOPE.sCharacter('santos_balloonist_scope').GetFullName], [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'получила', 'получил')] приглашение от Брюссельского свободного университета: там [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'ей', 'ему')] предлагают профессорскую должность. Университет обещает значительные финансовые ресурсы, которые позволят использовать воздушные шары для ещё более тщательного изучения стратосферы. [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'Она, кажется, готова', 'Он, кажется, готов')] принять предложение. Для нас это будет потеря [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'великой учёной', 'великого учёного')] с большим опытом в воздухоплавании."
 curtiss.614.d_capital: "[SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'Одна из наших важнейших учёных', 'Один из наших важнейших учёных')], [SCOPE.sCharacter('santos_balloonist_scope').GetFullName], [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'получила', 'получил')] приглашение от Свободного университета в городе [SCOPE.sCountry('curtiss_august_piccard_destination').GetCapital.GetCityHubName]: там [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'ей', 'ему')] предлагают профессорскую должность. Университет обещает значительные финансовые ресурсы, которые позволят использовать воздушные шары для ещё более тщательного изучения стратосферы. [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'Она, кажется, готова', 'Он, кажется, готов')] принять предложение. Для нас это будет потеря [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'великой учёной', 'великого учёного')] с большим опытом в воздухоплавании."
 curtiss.614.f: "Пиккар был назначен в Брюссельский свободный университет в 1922 году, где помимо преподавания он посвятил себя исследованиям стратосферы с помощью воздушных шаров. В своих стратосферных исследованиях он также сотрудничал со своим другом Альбертом Эйнштейном, с которым разрабатывал эксперименты.\nПомимо стратосферных исследований, Пиккар изобрёл измерительный прибор для радиоактивности и очень точный сейсмограф. Он также изучал атомную физику и предсказал третий изотоп урана, который позже был открыт и теперь известен как уран-235.\nВ Брюсселе его лекции также сделали его прототипом профессора Турнесоля — персонажа комиксов."
 curtiss.614.g: "Мы не можем потерять Пиккара! Предложите ему спонсорство!"
 curtiss.614.h: "У нас уже есть великий аэронавт!"
 curtiss.614.g.tt: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] становится нашим новым спонсируемым аэронавтом благодаря большому опыту в воздухоплавании."
 curtiss.615.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'переехала', 'переехал')] в город [SCOPE.sCountry('curtiss_august_piccard_destination').GetCapital.GetCityHubName]"
 curtiss.615.d: "[SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'Швейцарская учёная', 'Швейцарский учёный')] [SCOPE.sCharacter('santos_balloonist_scope').GetFullName] [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'переехала', 'переехал')] на новое место работы: [SCOPE.sCountry('curtiss_august_piccard_destination').GetCapital.GetCityHubName]. Там [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'она будет', 'он будет')] преподавать в местном Свободном университете в качестве профессора. Университет пообещал большие финансовые ресурсы, которые позволят использовать воздушные шары для ещё более тщательного изучения стратосферы. Благодаря блестящей научной подготовке и опыту в воздухоплавании [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'она может', 'он может')] установить новые рекорды в воздухоплавании."
 curtiss.615.f: "Пиккар был назначен в Брюссельский свободный университет в 1922 году, где помимо преподавания он посвятил себя исследованиям стратосферы с помощью воздушных шаров. В своих стратосферных исследованиях он также сотрудничал со своим другом Альбертом Эйнштейном, с которым разрабатывал эксперименты.\nПомимо стратосферных исследований, Пиккар изобрёл измерительный прибор для радиоактивности и очень точный сейсмограф. Он также изучал атомную физику и предсказал третий изотоп урана, который позже был открыт и теперь известен как уран-235.\nВ Брюсселе его лекции также сделали его прототипом профессора Турнесоля — персонажа комиксов."
 curtiss.615.g: "Аэронавт такой известности должен стать нашим официальным аэронавтом!"
 curtiss.615.h: "Желаем [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'ей', 'ему')] удачи в карьере!"
 curtiss.615.g.tt: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] становится нашим новым спонсируемым аэронавтом благодаря большому опыту в воздухоплавании."
 santos.650.t: "Представляем нашего нового аэронавта"
 santos.650.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] уже [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'добилась', 'добился')] успеха в воздухоплавании и хочет использовать нашу поддержку, чтобы расширить границы возможного. Впереди — новые рекорды и научные открытия. [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'Она уверена', 'Он уверен')], что сможет достичь новых высот на своём шаре [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')]."
 santos.650.f: "«Я приумножу славу нашей страны!»"
 santos.650.g: "Надеюсь, поддержка [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'её', 'его')] окупится! Откройте мне окно воздухоплавания."
 santos.650.h: "Удачи!"
 santos.651.t: "Воздухоплавание в нашей стране"
 santos.651.balloonist: "Нашу поддержку получает аэронавт [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]. [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'Она', 'Он')] продолжает совершать всё более смелые полёты на своём шаре [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')]."
 santos.651.noballoonist: "В настоящее время мы не спонсируем аэронавта. Поэтому мы очень редко, если вообще когда-либо, будем устанавливать новые рекорды. Мы могли бы начать спонсировать аэронавта из нашей нации, который будет пытаться устанавливать новые рекорды и разрабатывать для нас лучшие воздушные шары."
 santos.651.f: "[SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloonist_trait_level_type')]\n\n#b Текущие рекорды [ROOT.GetCountry.GetAltNameNoFlag('RU_CL_RP')]:#!\n — Рекорд высоты: #b #p [ROOT.Var('santos_balloon_altitude_record_var').GetValue]#! м#!\n — Рекорд дальности: #b #p [ROOT.Var('santos_balloon_distance_record_var').GetValue]#! км#!\n — Рекорд продолжительности: #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! ч#!\n\n#b Текущие мировые рекорды:#!\n — Рекорд высоты: #b #p [GetGlobalVariable('santos_balloon_altitude_record_global_var').GetValue]#! м#! [GetGlobalVariable('santos_balloon_altitude_record_holder_global_var').GetCountry.GetFlagTextIcon]\n — Рекорд дальности: #b #p [GetGlobalVariable('santos_balloon_distance_record_global_var').GetValue]#! км#! [GetGlobalVariable('santos_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon]\n — Рекорд продолжительности: #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! ч#! [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon]"
 santos.651.g: "Начать спонсировать аэронавта!"
 santos.651.h: "Прекратить спонсировать аэронавта"
 santos.651.htt: "Эта опция удалит аэронавта из игры."
 santos.651.l: "Позвольте мне вернуться к своим делам!"
 santos.651.w: "Больше не сообщать о #yellow полётах#! моего аэронавта!"
 santos.651.w.tt: "Вы больше не будете получать события о #yellow полётах#! вашего аэронавта или [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'её', 'его')] #yellow новых чертах#!. Вы можете включить это обратно в любое время."
 santos.651.x: "Снова сообщать мне о #yellow полётах#! моего аэронавта!"
 santos.651.x.tt: "Вы снова будете получать события о #yellow полётах#! вашего аэронавта и [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'её', 'его')] #yellow чертах#!. Вы можете выключить это обратно в любое время."
 santos.651.y: "Больше не сообщать мне о #yellow смертях#! моего аэронавта"
 santos.651.y.tt: "Вы больше не будете получать события о #yellow смертях#! вашего аэронавта. Новый аэронавт будет спонсироваться автоматически. Вы можете снова включить их в любое время."
 santos.651.z: "Снова сообщать мне о #yellow смертях#! аэронавта."
 santos.651.z.tt: "Вы снова будете получать события о #yellow смертях#! вашего аэронавта. Вы можете снова отключить их в любое время."
 santos.652.t: "Первый полёт для нашей страны: [SCOPE.sCharacter('santos_balloonist_scope').GetFullName]"
