 santos_distance_description_no_record: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'пыталась', 'пытался')] пролететь на своём шаре как можно дальше. Пролетев #b #n [ROOT.Var('new_balloon_distance_var').GetValue]#! км#!, [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'она', 'он')] не [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'смогла', 'смог')] побить предыдущий рекорд нашей страны в #b #p [ROOT.Var('santos_balloon_distance_record_var').GetValue]#! км#!. Полёт длился #b #n [ROOT.Var('new_balloon_time_var').GetValue]#! ч#!, чего также не хватило для прежнего рекорда продолжительности в #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! ч#!. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName], безусловно, попробует снова."
 santos_distance_description_distance_record_country: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'установила', 'установил')] новый рекорд дальности для нашей страны на своём шаре! Пролетев #b #p [ROOT.Var('new_balloon_distance_var').GetValue]#! км#!, [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'она', 'он')] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'смогла', 'смог')] уверенно превзойти предыдущий рекорд нашей страны в #b #p [ROOT.Var('santos_balloon_distance_record_var').GetValue]#! км#!. Но, к сожалению, этого не хватило, чтобы побить мировой рекорд в #b #p [GetGlobalVariable('santos_balloon_distance_record_global_var').GetValue]#! км#! [GetGlobalVariable('santos_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon]. Продолжительности в #b #n [ROOT.Var('new_balloon_time_var').GetValue]#! ч#!, к сожалению, не хватило для нашего национального рекорда в #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! ч#!."
 santos_distance_description_time_record_country: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'установила', 'установил')] новый рекорд продолжительности полёта для нашей страны на своём шаре! За #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! ч#! [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'она', 'он')] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'смогла', 'смог')] побить предыдущий рекорд нашей страны в #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! ч#!. К сожалению, этого не хватило для мирового рекорда в #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! ч#! [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon]. Рекорд дальности нашей страны в #b #p [ROOT.Var('santos_balloon_distance_record_var').GetValue]#! км#! также устоял: пройденное расстояние составило #b #n [ROOT.Var('new_balloon_distance_var').GetValue]#! км#!."
 santos_distance_description_both_records_country: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'установила', 'установил')] новый рекорд дальности и новый рекорд продолжительности полёта для нашей страны на своём шаре! Пролетев #b #p [ROOT.Var('new_balloon_distance_var').GetValue]#! км#!, [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'она', 'он')] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'смогла', 'смог')] уверенно превзойти предыдущий рекорд нашей страны в #b #p [ROOT.Var('santos_balloon_distance_record_var').GetValue]#! км#!. Однако этого не хватило для мирового рекорда в #b #p [GetGlobalVariable('santos_balloon_distance_record_global_var').GetValue]#! км#! [GetGlobalVariable('santos_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon]. Продолжительность полёта #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! ч#! позволила побить и национальный рекорд в #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! ч#!, но не мировой рекорд в #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! ч#! [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon]."
 santos_distance_description_distance_record_global: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'установила', 'установил')] новый мировой рекорд дальности полёта на своём шаре! Пролетев #b #p [ROOT.Var('new_balloon_distance_var').GetValue]#! км#!, [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'она', 'он')] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'смогла', 'смог')] побить предыдущий рекорд нашей страны в #b #p [ROOT.Var('santos_balloon_distance_record_var').GetValue]#! км#! и уверенно превзойти мировой рекорд в #b #p [GetGlobalVariable('santos_balloon_distance_record_global_var').GetValue]#! км#! [GetGlobalVariable('santos_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon]. Продолжительности полёта в #b #n [ROOT.Var('new_balloon_time_var').GetValue]#! ч#!, к сожалению, не хватило для мирового рекорда в #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! ч#! [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon]."
 santos_distance_description_time_record_global: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'установила', 'установил')] новый мировой рекорд продолжительности полёта на своём шаре! За #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! ч#! [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'она', 'он')] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'смогла', 'смог')] побить предыдущий рекорд нашей страны в #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! ч#! и уверенно превзойти мировой рекорд в #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! ч#! [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon]. Дистанции в #b #n [ROOT.Var('new_balloon_distance_var').GetValue]#! км#!, к сожалению, не хватило для мирового рекорда в #b #p [GetGlobalVariable('santos_balloon_distance_record_global_var').GetValue]#! км#! [GetGlobalVariable('santos_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon]."
 santos_distance_description_both_records_global: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'установила', 'установил')] новый мировой рекорд дальности и продолжительности полёта на своём шаре! Пролетев #b #p [ROOT.Var('new_balloon_distance_var').GetValue]#! км#!, [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'она', 'он')] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'смогла', 'смог')] побить предыдущий рекорд нашей страны в #b #p [ROOT.Var('santos_balloon_distance_record_var').GetValue]#! км#! и уверенно превзойти мировой рекорд в #b #p [GetGlobalVariable('santos_balloon_distance_record_global_var').GetValue]#! км#! [GetGlobalVariable('santos_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon]. Мировой рекорд продолжительности полёта в #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! ч#! [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon] удалось превзойти при продолжительности полёта #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! ч#!."
 santos.655.t1: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] не [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'смогла', 'смог')] побить рекорд продолжительности полёта"
 santos.655.t2: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'установила', 'установил')] новый рекорд продолжительности полёта для нашей страны"
 santos.655.t3: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'летала', 'летал')] на своём шаре дольше, чем кто-либо из людей до этого!"
 santos.655.d1: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'пыталась', 'пытался')] пролететь как можно дольше на своём шаре. Время полёта #b #n [ROOT.Var('new_balloon_time_var').GetValue]#! ч#! не позволило [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'ей', 'ему')] побить предыдущий рекорд нашей страны в #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! ч#!. [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'Она', 'Он')] обязательно попробует снова."
 santos.655.d2: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'установила', 'установил')] новый рекорд продолжительности полёта для нашей страны на своём шаре! При продолжительности полёта #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! ч#! [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'она', 'он')] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'побила', 'побил')] предыдущий рекорд нашей страны в #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! ч#!. Но, к сожалению, этого не хватило для мирового рекорда в #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! ч#! [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon]."
 santos.655.d3: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'установила', 'установил')] новый мировой рекорд продолжительности полёта на своём шаре! При продолжительности полёта #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! ч#! [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'она', 'он')] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'смогла', 'смог')] побить предыдущий рекорд нашей страны в #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! ч#! и уверенно превзойти мировой рекорд в #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! ч [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon].#!"
 santos.655.f1: "«В этот раз у меня не получилось. Но в следующий раз я обязательно справлюсь!»"
 santos.655.f2: "«Кого волнует такой рекорд? Я хочу мировой!»"
 santos.655.f3: "«Это было проще простого!»"
 santos.655.g: "Удачи в следующий раз!"
 santos.655.h: "Хорошая работа!"
 santos.655.i: "Замечательно! Поздравляю!"
 santos.656.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] боится высоты и бросает воздухоплавание"
 santos.656.d: "Хотя [SCOPE.sCharacter('santos_balloonist_scope').GetFullName] [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'утверждала, что совершила', 'утверждал, что совершил')] немало полётов, во время первого же полёта для нашей страны [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'она обнаружила', 'он обнаружил')], что боится высоты, поднявшись всего на десять метров. Поэтому [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'она', 'он')] бросает воздухоплавание."
 santos.656.f: "«Это ужасно! Две недели назад я [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'летала', 'летал')] на огромной высоте, а теперь... Теперь я даже на лестницу залезть не могу!»"
 santos.656.g: "Как жаль..."
 santos.656.h: "Чёрт! Есть ли другой аэронавт, которого мы могли бы спонсировать?"
 santos.670.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] погибает в результате несчастного случая"
 santos.670.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'разбилась', 'разбился')] во время полёта на своём воздушном шаре и [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'погибла', 'погиб')]. Мы теряем героя воздухоплавания."
 santos.670.f: "[SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloonist_death_type')]"
 santos.670.g: "Какой ужас!"
 santos.670.h: "Ужасно! Есть ли другой аэронавт, которого мы могли бы спонсировать?"
 santos.671.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] теперь опытный аэронавт"
 santos.671.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'совершила', 'совершил')] множество полётов и [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'приобрела', 'приобрёл')] большой опыт в воздухоплавании. Теперь [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'она считается', 'он считается')] опытным аэронавтом и знает, что делает."
 santos.671.f: "«Не бойтесь! Я [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'делала', 'делал')] это десятки раз!»"
 santos.671.g: "Приятно слышать!"
 santos.672.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] теперь знаменитый аэронавт"
 santos.672.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] уже [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'совершила', 'совершил')] сотни полётов, в которых также [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'побила', 'побил')] несколько рекордов. К настоящему времени [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'она известна', 'он известен')] не только в нашей стране."
 santos.672.f: "«[SCOPE.sCharacter('santos_balloonist_scope').GetFullName]? Это не [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'та ли', 'тот ли')] аэронавт? Я очень хочу с [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'ней', 'ним')] познакомиться!»"
 santos.672.g: "Замечательно!"
 santos.673.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'сбита', 'сбит')] кометой во время полёта"
 santos.673.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'была сбита', 'был сбит')] кометой во время полёта и [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'погибла', 'погиб')]."
 santos.673.f: "Вскоре после взлёта на шаре [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] был слышен громкий хлопок. Люди на земле увидели вспышку света, пронесшуюся по небу и ударившую прямо в корзину аэронавта. Шар загорелся и рухнул вниз. После расчистки обломков было найдено тело аэронавта. Этому событию обрадовались только наши астрономы, потому что они смогли изучить остатки кометы."
 santos.673.g: "Если бы только у [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'неё', 'него')] было чутьё на кометы..."
 santos.673.h: "О, комета, дьявольское отродье... Есть ли другой аэронавт, которого мы могли бы спонсировать?"
 santos.674.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] погибает при крушении воздушного шара на пляже"
 santos.674.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'разбилась', 'разбился')] на пляже во время полёта и [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'погибла', 'погиб')]. Как ни странно, на обломках шара был найден кит."
 santos.674.f: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'летела', 'летел')] вдоль пляжа погожим днём. Поскольку [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'она', 'он')] так и не [SelectLocalization(SCOPE.sCharacter('santos_balloonist_scope').IsFemale, 'вернулась', 'вернулся')], были отправлены поисковые группы. Вскоре были найдены обломки. Как ни странно, шар и корзина лежали под останками сильно раздавленного кита. Алкоголик из соседней деревни сообщил, что видел, как с неба падали кит и горшок с петуниями, и что кит попал прямо в шар. Очевидно, этой истории не поверили. Интересно, что неподалёку был найден целый горшок с петуниями. Петуния выглядела немного потрёпанной и была передана в опытные руки местного ботаника.\n\n[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] запомнится своим золотым сердцем и способностью сохранять спокойствие в любой ситуации."
 santos.674.g: "О нет! Только не снова!"
 santos.674.h: "Привет, Земля! Есть ли другой аэронавт, которого мы могли бы спонсировать?"
 santos.676.t: "Нашего аэронавта не стало"
 santos.676.d: "После десятилетий, посвящённых воздухоплаванию в качестве [Concept('concept_santos_balloonist', 'аэронавта')], жизнь нашего бывшего #b #r аэронавта#!#! оборвалась. Сможем ли мы когда-нибудь найти замену столь выдающемуся исследователю?"
 santos.691.t: "Тип воздушного шара"
 santos.691.d: "Выберите другой тип воздушного шара. Переоборудование займёт полгода. В течение этого времени шар нельзя будет использовать."
 santos.691.f: "Каждый специализированный шар получает прибавку в 5 процентов к соответствующей характеристике и штраф в 5 процентов к остальным. Например, шар для дальних полётов получает #G +5%#! к #V дальности#!, но #R −5%#! к #V высоте#! и #R −5%#! к #V продолжительности полёта#!. Универсальный шар не имеет ни преимуществ, ни недостатков."
 santos.691.g: "Нам нужен высотный шар."
 santos.691.h: "Главное — дальность."
 santos.691.i: "Время решает всё!"
 santos.691.j: "Хорошего универсального шара будет достаточно."
 santos.691.k: "Неважно."
 curtiss_show_ballooning_window_decision: "Открыть окно воздухоплавания"
