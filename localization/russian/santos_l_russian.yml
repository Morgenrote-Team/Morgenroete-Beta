 santos_ballooning_on_fail_tt: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] совершает аварийную посадку и рискует погибнуть."
 santos_balloon_demoralized_modifier: "Деморализованный аэронавт"
 je_group_santos_ballooning: "Morgenröte: [concept_santos_ballooning]"
 santos.441.t: "Чудесное спасение"
 santos.441.d: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'чудом осталась жива', 'чудом остался жив')] после опасного перелёта, несмотря на все неблагоприятные обстоятельства. Однако за это спасение из пасти смерти придётся заплатить: шар снова нуждается в ремонте... да и аэронавт не в лучшем состоянии."
 santos.441.f: "«В сытной пище есть вкус жизни и бессмертия. Подобно воздушным шарам, мы ничто, пока не наполнимся». — Герман Мелвилл"
 santos.441.g: "Неужели [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'она', 'он')] больше не оправится от этого потрясения?"
