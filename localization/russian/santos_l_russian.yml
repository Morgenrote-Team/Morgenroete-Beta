 je_santos_balloon_ride: "Прогулки на воздушном шаре"
 je_santos_balloon_ride_reason: "[ROOT.GetCountry.GetCustom('santos_balloon_research_active_type')] Помимо новшеств в воздухоплавании, аэронавт может устраивать развлекательные полёты на воздушном шаре при сооружениях — прежде всего памятниках, городских парках и парках развлечений.\n\nЭто стандартный проект [Concept('concept_santos_balloonist', 'аэронавта')], который действует, пока аэронавт не занят другим проектом.\nКаждый раз, когда прогресс достигает #V 24#!, мы получаем небольшое ускорение исследования технологии. Если у нас есть [concept_monument] либо сооружение типа «[GetBuildingType('building_gaudi_park').GetName]» или «[GetBuildingType('building_gaudi_luna').GetName]», аэронавт посещает одно из этих мест, выбранное случайным образом, и добавляет модификатор «$santos_building_production_mult_modifier$».\n\nТехнология, исследование которой будет ускорено в следующий раз: [GetPlayer.MakeScope.GetCountry.GetCustom('santos_balloon_research_next_technology_type')]"
 je_santos_balloon_ride_active_loc: "#p Сейчас этот проект действует.#!\n\n[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] устраивает увлекательные обзорные полёты."
 je_santos_balloon_ride_inactive_loc: "#n Сейчас этот проект не действует.#! Он возобновится, когда аэронавт освободится.\n\n[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] сможет устраивать развлекательные полёты, когда завершит другие дела."
 santos_balloon_research_active_loc: "#p Сейчас этот проект действует.#!\n\n[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] содействует исследованиям в области воздухоплавания."
