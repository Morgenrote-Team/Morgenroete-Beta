 je_santos_balloon_adventure: "Воздушное приключение"
 je_santos_balloon_adventure_reason: "Во время рискованных путешествий аэронавты могут собирать предметы, связанные с их профессией. Археологи и этнологи собирают артефакты; натуралисты — образцы и окаменелости; геологи — обычные и редкие материалы; метеорологи — магнитные и физические данные, а также океанографические знания; инженеры же возвращаются с техническими идеями.\n\nЕсть #G небольшая вероятность#!, что аэронавт не вернётся из путешествия живым."
 santos.502.t: "Возвращение аэронавта из путешествия"
 santos.502.d: "После долгих месяцев странствий [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] снова дома, в [GetPlayer.GetAltNameNoFlag('RU_CL_PP')]. Любопытные зеваки с нетерпением ждут встречи. Наверняка найдётся немало захватывающих историй — и сувениры тоже!"
 santos.502.f: "Где-то за радугой\nЛетают синие птицы,\nИ мечты, о которых ты грезишь,\nДействительно сбываются.\nОднажды я загадаю желание на звезду\nИ проснусь там, где облака остались далеко позади,\nГде беды тают, словно лимонные леденцы.\nВысоко над дымовыми трубами —\nВот где ты найдёшь меня."
 santos.502.g: "А ведь от аэронавта есть толк..."
 santos.503.t: "Аэронавт возвращается с животным"
 santos.503.d: "Во время последнего приключения наш аэронавт вновь преодолел смертельно опасные испытания. Однако добыча оказалась скудной. Зато [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'привезла', 'привёз')] кое-что другое: нового друга из мира животных..."
 santos.503.g: "Какая милая обезьянка! Просто прелесть!"
 santos.504.g: "Какой милый горностай! Просто прелесть!"
 santos.505.g: "Какой милый... Да что это вообще такое?"
