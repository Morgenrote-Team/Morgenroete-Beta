 santos.681.t: "Кубок Гордона Беннетта"
 santos.681.d: "Подготовка к первым крупным международным соревнованиям на воздушных шарах идёт полным ходом. В городе [ROOT.GetCountry.GetCapital.GetCityHubName] собираются аэронавты со всего мира, чтобы помериться силами в состязании на дальность полёта. Соревнования уже называют легендарными, и в следующие годы их будут проводить вновь."
 santos.681.f: "«Ни перед одним прежним полётом я не получал столько добрых пожеланий на прощание и никогда ещё не готовился так тщательно, как к полёту на Кубок Гордона Беннетта 1907 года. Едва закончились соревнования в Париже в сентябре 1906 года, у меня возникло желание участвовать и в следующем году. Я благодарю Германский союз воздухоплавателей за то, что он избрал меня своим представителем, а также барона фон Гевальда и капитана Гильдебрандта, предоставивших мне свой большой воздушный шар „Поммерн“. Именно благодаря им я смог одержать победу в этом году.\n\nВо время этого полёта Северная Америка произвела на меня самое благоприятное впечатление — и условиями для воздухоплавания, и гостеприимством. Жалею лишь о том, что эта страна оказалась недостаточно большой, чтобы я мог использовать всю дальность полёта своего шара и побить мировой рекорд». — Оскар Эрбслё"
 santos.681.g: "Замечательно!"
 notification_santos_gordon_bennett_cup_notification_name: "[GetPlayer.MakeScope.Var('santos_balloonist_var').GetCharacter.GetFullName] побеждает в борьбе за Кубок Гордона Беннетта"
