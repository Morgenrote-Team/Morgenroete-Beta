 santos.653.d1: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'пыталась', 'пытался')] подняться как можно выше на своём шаре. Высота #b #n [ROOT.Var('new_balloon_altitude_var').GetValue]#! м#! не позволила [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'ей', 'ему')] побить предыдущий рекорд нашей страны в #b #p [ROOT.Var('santos_balloon_altitude_record_var').GetValue]#! м#!. [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'Она', 'Он')] обязательно попробует снова."
 santos.653.d2: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'установила', 'установил')] новый рекорд высоты для нашей страны на своём шаре! С высотой #b #p [ROOT.Var('new_balloon_altitude_var').GetValue]#! м#! [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'она', 'он')] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'побила', 'побил')] предыдущий рекорд нашей страны в #b #p [ROOT.Var('santos_balloon_altitude_record_var').GetValue]#! м#!. Но, к сожалению, этого не хватило для мирового рекорда в #b #p [GetGlobalVariable('santos_balloon_altitude_record_global_var').GetValue]#! м#! [GetGlobalVariable('santos_balloon_altitude_record_holder_global_var').GetCountry.GetFlagTextIcon]."
 santos.653.d3: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'установила', 'установил')] новый мировой рекорд высоты полёта на своём шаре! С высотой #b #p [ROOT.Var('new_balloon_altitude_var').GetValue]#! м#! [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'она', 'он')] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'смогла', 'смог')] побить предыдущий рекорд нашей страны в #b #p [ROOT.Var('santos_balloon_altitude_record_var').GetValue]#! м#! и уверенно превзойти мировой рекорд в #b #p [GetGlobalVariable('santos_balloon_altitude_record_global_var').GetValue]#! м [GetGlobalVariable('santos_balloon_altitude_record_holder_global_var').GetCountry.GetFlagTextIcon].#!"
