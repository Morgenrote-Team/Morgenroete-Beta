 santos_balloon_crossing_event_balloonist_error_title_flag: "Ошибка аэронавта"
 santos_balloon_crossing_event_balloonist_error_flag: "#t $santos_balloon_crossing_event_balloonist_error_title_flag$#!\nИз-за ошибки аэронавта в управлении экспедиция столкнулась с трудностями.\n\n#b Вероятность такого исхода повышается, если:#!\nУ [Concept('concept_santos_balloonist', 'аэронавта')] есть [concept_character_trait] «$reckless$», «$wrathful$» или «$arrogant$».\n\n#b Вероятность такого исхода снижается, если:#!\nУ [Concept('concept_santos_balloonist', 'аэронавта')] есть [concept_character_trait] «$santos_balloonist_experienced$»."
 santos_balloon_crossing_event_altitude_sickness_icon_flag: "@santos_event_log_negative_altitude_sickness_icon!"
 santos_balloon_crossing_event_altitude_sickness_title_flag: "Высотная болезнь"
 santos_balloon_crossing_event_altitude_sickness_flag: "#t $santos_balloon_crossing_event_altitude_sickness_title_flag$#!\nАэронавт поднялся выше критической отметки в 7000 метров и теперь страдает от острой нехватки кислорода.\n\n#b Вероятность такого исхода снижается, если:#!\nВ [GetPlayer.GetAltNameNoFlag('RU_CL_PP')] исследована технология «[GetTechnology('electric_arc_process').GetName]»."
 santos_balloon_crossing_event_the_pampero_icon_flag: "@santos_event_log_negative_wind_icon!"
 santos_balloon_crossing_event_the_pampero_title_flag: "Памперо"
 santos_balloon_crossing_event_the_pampero_flag: "#t $santos_balloon_crossing_event_the_pampero_title_flag$#!\nШар попал в памперо — печально известный внезапный шквал над Ла-Платой!\n\n#b Вероятность такого исхода снижается, если:#!\nУ [Concept('concept_santos_balloonist', 'аэронавта')] есть [concept_character_trait] «$curie_meteorological_physicist$». Либо у нас есть [concept_curie_meteorological_physicist]."
