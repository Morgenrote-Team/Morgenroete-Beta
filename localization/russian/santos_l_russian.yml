 santos_balloon_crossing_event_unfavorable_weather_title_flag: "Неблагоприятная погода"
 santos_balloon_crossing_event_unfavorable_weather_flag: "#t $santos_balloon_crossing_event_unfavorable_weather_title_flag$#!\nИз-за плохой погоды путешествие на воздушном шаре оказывается труднее, чем ожидалось."
 santos_balloon_crossing_event_confusing_situation_icon_flag: "@santos_event_log_negative_confusing_situation_icon!"
 santos_balloon_crossing_event_confusing_situation_title_flag: "Неясная обстановка"
 santos_balloon_crossing_event_confusing_situation_flag: "#t $santos_balloon_crossing_event_confusing_situation_title_flag$#!\nОблачность, морозные ночи и общая неопределённость затрудняют перелёт.\n\n#b Вероятность такого исхода повышается, если:#!\nУ [Concept('concept_santos_balloonist', 'аэронавта')] есть [concept_character_trait] «$reckless$», «$wrathful$» или «$arrogant$» либо #V отрицательная черта состояния, например болезнь или зависимость#!."
 santos_balloon_crossing_event_dangerous_fog_icon_flag: "@santos_event_log_negative_dangerous_fog_icon!"
 santos_balloon_crossing_event_dangerous_fog_title_flag: "Опасный туман"
 santos_balloon_crossing_event_dangerous_fog_flag: "#t $santos_balloon_crossing_event_dangerous_fog_title_flag$#!\nСгущающийся туман подвергает путешествие всё большей опасности!\n\n#b Вероятность такого исхода повышается, если:#!\nУ [Concept('concept_santos_balloonist', 'аэронавта')] есть [concept_character_trait] «$reckless$», «$wrathful$» или «$arrogant$» либо #V отрицательная черта состояния, например болезнь или зависимость#!.\n\n#b Вероятность такого исхода снижается, если:#!\nУ [Concept('concept_santos_balloonist', 'аэронавта')] есть [concept_character_trait] «$curie_meteorological_physicist$». Либо у нас есть [concept_curie_meteorological_physicist]."
 santos_balloon_crossing_event_violent_storm_icon_flag: "@santos_event_log_negative_wind_icon!"
 santos_balloon_crossing_event_violent_storm_title_flag: "Сильная буря"
 santos_balloon_crossing_event_violent_storm_flag: "#t $santos_balloon_crossing_event_violent_storm_title_flag$#!\nБуря или сильные ветры на большой высоте могут причинить шару немало неприятностей!\n\n#b Вероятность такого исхода снижается, если:#!\nУ [Concept('concept_santos_balloonist', 'аэронавта')] есть [concept_character_trait] «$curie_meteorological_physicist$». Либо у нас есть [concept_curie_meteorological_physicist]."
