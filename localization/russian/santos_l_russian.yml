 santos_stratospheric_flight_cost_modifier: "Расходы на полёт в стратосферу"
 santos.301.t: "Полёт в стратосферу: оглушительный успех"
 santos.301.d: "К удивлению многих наблюдателей, считавших полёт на воздушном шаре в стратосферу самоубийственной затеей, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] сегодня [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'вернулась', 'вернулся')] из путешествия. Кабина приземлилась на пастбище неподалёку от города [SCOPE.sState('santos_balloon_state').GetCityHubName]. Максимальная высота полёта составила #p [ROOT.Var('new_balloon_altitude_var').GetValue]#! м."
 santos.301.f: "«Несколько недель назад из города [SCOPE.sState('santos_balloon_state').GetCityHubName] в [GetPlayer.GetAltNameNoFormatting('RU_CL_PP')] взмыл в небо огромный жёлтый воздушный шар. Вместо корзины под ним висела чёрно-серебристая сфера из тончайшего алюминия. Внутри кабины — [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]. Целью было изучение атмосферы на высоте 50 000 футов. Семнадцать часов спустя, когда надежды на благополучный исход уже не осталось, [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'вернулась', 'вернулся')] благополучно с высоты примерно [ROOT.Var('new_balloon_altitude_var').GetValue] м»."
 santos.301.g: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetLastNameNoFormatting] — наша гордость!"
 santos.302.t: "Полёт в стратосферу: гибельная катастрофа"
 santos.302.d: "Опасения многих исследователей и журналистов подтвердились: полёт в стратосферу оказался безумной затеей. Причину гибели нашего аэронавта ещё предстоит установить при вскрытии. Возможно, смерть наступила при жёсткой посадке неподалёку от города [SCOPE.sState('santos_balloon_state').GetCityHubName], когда из-за усталости материала оборвались тросы. А может быть, причиной стали жара внутри кабины и недостаток кислорода на такой высоте. Как бы то ни было, пресса уже вовсю смакует происшествие."
 santos.302.f: "«Ни исследования, ни предупреждения, ни даже добрые советы не возымели действия. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] — жертва трагедии, которой, скорее всего, можно было избежать, запрети правительство эту безрассудную затею. Но жажда мировой славы и ослепительная мечта отправить аэронавта на невиданные высоты заставили власть имущих пропустить мимо ушей даже самые разумные возражения.\n\nКто вообще эти люди? Где их чувство ответственности? Не случайно страна начала трещать по швам именно тогда, когда к власти [SelectLocalization(SCOPE.sCharacter('santos_ruler_scope').IsFemale, 'пришла', 'пришёл')] [SCOPE.sCharacter('santos_ruler_scope').GetFullNameNoFormatting]! Виновные не хотят признаваться, но им страшно. И правильно: вся страна расползается по швам»."
 santos.302.g: "Объявить день национального траура."
 santos_stratospheric_flight_success_modifier: "Полёт в стратосферу: успех"
 santos_stratospheric_flight_failure_modifier: "Полёт в стратосферу: неудача"
 je_santos_stratospheric_flight: "Полёт в стратосферу"
 je_santos_stratospheric_flight_reason: "Для аэронавтов XIX века полёт в стратосферу оставался несбыточной мечтой. Однако достижения промышленной эпохи и изобретение герметичной кабины сделали возможным и это приключение. В 1930-х годах отважные мужчины и женщины из разных стран приняли вызов, рискуя собственной жизнью. Правила высотного полёта сходны с правилами [Concept('concept_santos_balloon_crossing', 'перелёта на воздушном шаре')], но это путешествие гораздо сложнее и заканчивается либо триумфом, либо гибелью. Зато здесь можно установить поистине недосягаемые рекорды высоты — вплоть до 22 000 метров!"
 santos_stratospheric_flight_on_fail_tt: "Стратостат терпит катастрофу, экипаж погибает."
 santos_stratospheric_flight_event_normal_ascent_icon_flag: "@santos_event_log_positive_normal_ascent_icon!"
 santos_stratospheric_flight_event_normal_ascent_title_flag: "Штатный подъём"
 santos_stratospheric_flight_event_normal_ascent_flag: "#t $santos_stratospheric_flight_event_normal_ascent_title_flag$#!\nВоздушный шар плавно поднимается в стратосферу."
 santos_stratospheric_flight_event_boost_ascent_icon_flag: "@santos_event_log_positive_boost_ascent_icon!"
 santos_stratospheric_flight_event_boost_ascent_title_flag: "Стремительный подъём"
 santos_stratospheric_flight_event_boost_ascent_flag: "#t $santos_stratospheric_flight_event_boost_ascent_title_flag$#!\nАэронавту удалось значительно увеличить высоту полёта.\n\n#b Вероятность такого исхода повышается, если:#!\n[concept_santos_balloonist] обладает [Concept('concept_character_trait', 'чертой')] «$santos_balloonist_experienced$», «$innovative$» или «$ambitious$»."
 santos_stratospheric_flight_event_altitude_improvisation_icon_flag: "@santos_event_log_positive_altitude_improvisation_icon!"
 santos_stratospheric_flight_event_altitude_improvisation_title_flag: "Импровизация на высоте"
 santos_stratospheric_flight_event_altitude_improvisation_flag: "#t $santos_stratospheric_flight_event_altitude_improvisation_title_flag$#!\nТехнические знания экипажа позволили свести риски полёта к минимуму.\n\n#b Вероятность такого исхода повышается, если:#!\n[concept_santos_balloonist] обладает [Concept('concept_character_trait', 'чертой')] «$cautious$», «$innovative$» или «$engineer$». Также может помочь [concept_curie_meteorological_physicist] с [Concept('concept_character_trait', 'чертой')] «$innovative$», «$erudite$» или «$meticulous$»."
 santos_stratospheric_flight_event_slow_ascent_icon_flag: "@santos_event_log_negative_slow_ascent_icon!"
 santos_stratospheric_flight_event_slow_ascent_title_flag: "Медленный подъём"
 santos_stratospheric_flight_event_slow_ascent_flag: "#t $santos_stratospheric_flight_event_slow_ascent_title_flag$#!\nПо неизвестным причинам воздушный шар поднимается медленнее, чем предполагали расчёты."
 santos_stratospheric_flight_event_broken_rope_icon_flag: "@santos_event_log_negative_broken_rope_icon!"
 santos_stratospheric_flight_event_broken_rope_title_flag: "Обрыв троса"
 santos_stratospheric_flight_event_broken_rope_flag: "#t $santos_stratospheric_flight_event_broken_rope_title_flag$#!\nОборвавшийся трос затрудняет управление воздушным шаром, особенно выпуск газа.\n\n#b Вероятность такого исхода повышается, если:#!\n[concept_santos_balloonist] обладает [Concept('concept_character_trait', 'чертой')] «$reckless$», «$wrathful$», «$arrogant$» либо #V страдает от болезни или зависимости#!.\n\n#b Вероятность такого исхода снижается, если:#!\n[concept_santos_balloonist] обладает [Concept('concept_character_trait', 'чертой')] «$curie_meteorological_physicist$» или «$engineer$». [concept_curie_meteorological_physicist] также может обнаружить неполадки перед вылетом."
 santos_stratospheric_flight_event_defective_valve_icon_flag: "@santos_event_log_negative_defective_valve_icon!"
 santos_stratospheric_flight_event_defective_valve_title_flag: "Неисправный клапан"
 santos_stratospheric_flight_event_defective_valve_flag: "#t $santos_stratospheric_flight_event_defective_valve_title_flag$#!\nИз-за неисправного клапана полёт стратостата идёт не по плану.\n\n#b Вероятность такого исхода повышается, если:#!\n[concept_santos_balloonist] обладает [Concept('concept_character_trait', 'чертой')] «$reckless$», «$wrathful$», «$arrogant$» либо #V страдает от болезни или зависимости#!.\n\n#b Вероятность такого исхода снижается, если:#!\n[concept_santos_balloonist] обладает [Concept('concept_character_trait', 'чертой')] «$curie_meteorological_physicist$» или «$engineer$». [concept_curie_meteorological_physicist] также может обнаружить неполадки перед вылетом."
 santos_stratospheric_flight_event_heat_buildup_icon_flag: "@santos_event_log_negative_heat_buildup_icon!"
 santos_stratospheric_flight_event_heat_buildup_title_flag: "Перегрев"
 santos_stratospheric_flight_event_heat_buildup_flag: "#t $santos_stratospheric_flight_event_heat_buildup_title_flag$#!\nБез защитного слоя облаков солнце беспощадно палит воздушный шар. Оболочка и наполняющий её газ сильно нагреваются, и газ стремительно расширяется.\n\n#b Вероятность такого исхода снижается, если:#!\nВ [GetPlayer.GetAltNameNoFlag('RU_CL_PP')] изучены технологии «[GetTechnology('zeppelins').GetName]» и «[GetTechnology('curie_rocket_science_tech').GetName]»."
 santos_stratospheric_flight_event_material_fatigue_icon_flag: "@santos_event_log_negative_material_fatigue_icon!"
 santos_stratospheric_flight_event_material_fatigue_title_flag: "Усталость материала"
 santos_stratospheric_flight_event_material_fatigue_flag: "#t $santos_stratospheric_flight_event_material_fatigue_title_flag$#!\nПолёт на большой высоте испытывает материалы воздушного шара на пределе прочности: риск разрывов и других повреждений значительно возрастает!\n\n#b Вероятность такого исхода снижается, если:#!\nВ [GetPlayer.GetAltNameNoFlag('RU_CL_PP')] изучены технологии «[GetTechnology('vulcanization').GetName]» и «[GetTechnology('art_silk').GetName]»."
 santos_stratospheric_flight_event_hydrogen_fire_icon_flag: "@santos_event_log_negative_hydrogen_fire_icon!"
 santos_stratospheric_flight_event_hydrogen_fire_title_flag: "Возгорание водорода!"
 santos_stratospheric_flight_event_hydrogen_fire_flag: "#t $santos_stratospheric_flight_event_hydrogen_fire_title_flag$#!\nПроизошло самое страшное, что только может случиться в полёте на воздушном шаре: загорелся водород! Для экипажа это верная гибель...\n\n#b Вероятность такого исхода снижается, если:#!\nВ [GetPlayer.GetAltNameNoFlag('RU_CL_PP')] есть сооружение типа «[GetBuildingType('building_mendelejew_helium_plant').GetName]». [concept_santos_balloonist] обладает [Concept('concept_character_trait', 'чертой')] «$curie_meteorological_physicist$» или «$engineer$». [concept_curie_meteorological_physicist] также может обнаружить неполадки перед вылетом."
 je_santos_balloon_crossing_complete_tt: "@santos_ballooning_progress! #V #BLUE Перелёт на воздушном шаре#!#!: достигнуто #V [GetPlayer.MakeScope.ScriptValue('santos_balloon_crossing_goal_value')|0]#!."
 replace_balloonist_tt: "Заменить [Concept('concept_santos_balloonist', 'аэронавта')] новым специалистом."
 santos.511.t: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetLastName] в рабстве в Африке!"
 santos.511.d: "Наш аэронавт [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] уже несколько месяцев числится пропавшим без вести. Сегодня газеты сообщили, что следы теряются в Африке, где проходил последний авантюрный полёт. По всей видимости, после крушения на территории [SCOPE.sCountry('santos_balloonist_slaver_scope').GetAltNameNoFlag('RU_CL_RP')] последовали продажа в рабство и тяжёлая работа на полях!"
 santos.511.f: "В 1853 году в различных газетах действительно появлялись сообщения о том, что Арбан попал в рабство в Африке. Однако никаких доказательств не было. Что именно с ним произошло, неизвестно, но, скорее всего, он утонул в Средиземном море."
 santos.511.g: "Мы освободим [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHim] из рабства!"
 santos.511.h: "Просто заплатим и покончим с этим..."
 santos.511.i: "Жизнь одного аэронавта не стоит таких хлопот."
 santos.512.t: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetLastName] на свободе"
 santos.512.d1: "Небольшой отряд отправился освобождать нашего аэронавта. После короткой перестрелки [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] и ещё несколько европейцев обрели свободу и скрылись верхом. Прежде чем власти [SCOPE.sCountry('santos_balloonist_slaver_scope').GetAltNameNoFlag('RU_CL_RP')] успели отреагировать, беглецы уже поднялись на борт судна, доставившего их домой. Долгий плен подорвал силы нашего аэронавта, но рассказ об этом невероятном полёте всё же удалось услышать."
 santos.512.d2: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] снова дома. Долгий плен подорвал силы нашего аэронавта, но рассказ об этом невероятном полёте всё же удалось услышать."
 santos.512.f: "«Ветер унёс меня в открытое море. Он дул на юг, и оставалось лишь попытаться добраться до Балеарских островов. Но ветер переменился и отнёс шар к побережью Северной Африки, где удалось приземлиться. К сожалению, местные жители оказались не слишком приветливы. Кто-нибудь ещё перелетал через Средиземное море? Это рекорд?»"
 santos.512.g: "Успешное спасение!"
 santos.512.h: "С возвращением, [ROOT.Var('santos_balloonist_var').GetCharacter.GetLastName]!"
 santos.701.t: "Первые снимки с воздушного шара"
 santos.701.d: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'объединила', 'объединил')] два своих увлечения — воздухоплавание и фотографию. Снимки линии фронта у города [SCOPE.sState('santos_balloon_state').GetCityHubName] позволили получить ценные разведывательные сведения."
 santos.701.f: "Надар сделал первые аэрофотоснимки в 1858 году. В 1863 году он стал председателем #b Общества содействия воздушному передвижению с помощью аппаратов тяжелее воздуха#!, посвящённого развитию авиации. Секретарём общества был сам Жюль Верн, которого воздушные шары Надара вдохновили на роман «#b Пять недель на воздушном шаре#!»."
 santos.701.g: "С высоты мир выглядит совсем иначе!"
 santos.702.t: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] перевозит пассажиров через Альпы"
 santos.702.d: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'совершила', 'совершил')] полёт с пассажирами над Альпами, пролетев над несколькими высочайшими вершинами. Теперь это настоящая звезда воздухоплавания."
 santos.702.f: "Эдуард Спелтерини, урождённый Альберт Швейцер, ещё в молодости освоил воздухоплавание. Заказав свой первый воздушный шар «Урания», он путешествовал по Европе, показывая состоятельным пассажирам мир с высоты птичьего полёта. Обычно в программу входил небольшой пикник с отбивными и шампанским. Спелтерини также занялся аэрофотосъёмкой, но больше всего его прославили пассажирские полёты над Альпами."
 santos.702.g: "Невероятный вид!"
 santos.703.t: "Первый полёт управляемого дирижабля"
 santos.703.d: "Главная трудность полётов на воздушных шарах — зависимость от попутного ветра. Шар легко сносит с курса, что нередко приводит к несчастным случаям. [ROOT.Var('tesla_engineer_var').GetCharacter.GetFullName] [SelectLocalization(ROOT.Var('tesla_engineer_var').GetCharacter.IsFemale, 'попыталась', 'попытался')] решить эту проблему, построив вытянутый дирижабль с паровым двигателем и рулём. Дирижабль «[ROOT.Var('tesla_engineer_var').GetCharacter.GetLastNameNoFormatting]» совершил 27-километровый полёт из Парижа в Эланкур. Пока он движется слишком медленно, чтобы лететь против ветра. Кто знает, какое будущее ждёт эти воздушные корабли?"
 santos.703.f: "24 сентября 1852 года Жиффар совершил первый полёт на управляемом дирижабле с двигателем. Однако мощности паровой машины было недостаточно, и дирижабли ещё не получили распространения. Лишь позднее, с изобретением двигателя внутреннего сгорания, мечту об управляемых воздушных кораблях удалось воплотить в жизнь."
 santos.703.g: "Быть может, вскоре управляемые воздушные шары покорят небеса!"
 santos.677.t: "Смерть от нехватки кислорода"
 santos.677.d: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] так и не [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'вернулась', 'вернулся')] из высотного полёта. Через несколько дней крестьяне обнаружили упавший шар на отдалённой ферме. В корзине лежало безжизненное тело: [SelectLocalization(ROOT.Var('santos_balloonist_var').GetCharacter.IsFemale, 'аэронавт погибла', 'аэронавт погиб')] ещё до крушения."
 santos.677.f: "До изобретения кислородных баллонов нехватка кислорода на большой высоте приводила к тяжёлой высотной болезни. Головокружение, паралич и потеря сознания быстро лишали аэронавтов возможности действовать. Полёт «Зенита» в 1875 году закончился трагедией: Сивель и Кроче-Спинелли потеряли сознание, не смогли сбросить балласт и погибли от гипоксии. Их коллега Тиссандье едва выжил, но пережитое навсегда оставило след в его жизни: он потерял слух.\n\n#R Чтобы предотвратить такую катастрофу, изучите технологию «[GetTechnology('electric_arc_process').GetName]» и получите #V кислородные баллоны#!.#!"
 santos.677.g: "Какая безрассудная затея!"
 santos.677.h: "Какая ужасная смерть… Но не найдётся ли другой аэронавт, готовый работать на нас?"
 santos.692.t: "Газ для воздушного шара"
 santos.692.d: "Выберите другой газ для наполнения воздушного шара. Переоборудование займёт полгода. Всё это время шар нельзя будет использовать."
 santos.692.f: "Светильный газ доступен в больших количествах. На заре воздухоплавания его вполне хватало для рекордов дальности и скорости, однако для подъёма на большую высоту он подходит гораздо хуже. Водород тоже использовался с первых лет воздухоплавания и позволил установить поразительные рекорды высоты. Он как нельзя лучше подходит для высотных полётов, но его производство очень дорого и трудоёмко. [concept_curtiss_helium] обладает сходными свойствами, хотя его подъёмная сила несколько меньше. Зато он значительно повышает безопасность воздушного шара и исключает возгорание водорода."
 santos.692.g: "Нам нужен светильный газ."
 santos.692.h: "Водород — лучший выбор."
 santos.692.i: "Всё решает гелий!"