 santos_balloon_record_progress_bar_desc: "Подготовка рекордного полёта: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|1%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/12)"
 je_santos_balloon_record: "Рекордный полёт"
 je_santos_balloon_record_reason: "Рекорды можно устанавливать по высоте, дальности и продолжительности полёта. После подготовки аэронавт попытается установить рекорд в одной из этих категорий. Даже если удастся побить лишь национальный рекорд, это даст небольшое ускорение исследования технологии. Кроме того, аэронавт в любом случае получит опыт, количество которого зависит от успеха.\n\nПри рекордном полёте существует #YELLOW умеренная вероятность#! гибели аэронавта."
 je_santos_balloon_crossing: "Перелёт на воздушном шаре"
 je_santos_balloon_crossing_reason: "#p [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] сейчас выполняет перелёт по маршруту «[Scope.Var('santos_balloon_crossing_target_var').GetFlagName]».#!\n\nПерелёты — самое серьёзное испытание для [Concept('concept_santos_balloonist', 'аэронавта')]. Каждый [concept_santos_balloon_crossing] относится к одному из трёх уровней сложности, от которого зависит вероятность неприятных событий. На самых трудных маршрутах они быстро могут обернуться катастрофой. То, какие события произойдут, зачастую определяют [concept_academics_experience] аэронавта и его [Concept('concept_character_trait', 'черты характера')]. Например, амбициозные аэронавты склонны к эффектным манёврам, способным сократить время перелёта, а осторожные стараются свести риск к минимуму. Кроме того, черта «Метеоролог» у аэронавта или отдельный [concept_curie_meteorological_physicist] могут защитить от самых губительных погодных условий.\n\nЕсли аэронавт слишком полагается на удачу, он рискует погибнуть в пути. Через год аэронавт прекратит попытку, так и не добившись результата.\n\nПри перелёте существует #R значительная вероятность#! гибели аэронавта."
