 santos_balloon_crossing_event_favorable_weather_title_flag: "Благоприятная погода"
 santos_balloon_crossing_event_favorable_weather_flag: "#t $santos_balloon_crossing_event_favorable_weather_title_flag$#!\nСветит солнце, дует попутный ветер. Шар продвигается быстрее, чем ожидалось."
 santos_balloon_crossing_event_wind_shear_icon_flag: "@santos_event_log_positive_wind_shear_icon!"
 santos_balloon_crossing_event_wind_shear_title_flag: "Сдвиг ветра"
 santos_balloon_crossing_event_wind_shear_flag: "#t $santos_balloon_crossing_event_wind_shear_title_flag$#!\nВетер переменился в пользу аэронавта. Шар буквально скользит по небу!\n\n#b Вероятность такого исхода повышается, если:#!\nУ [Concept('concept_santos_balloonist', 'аэронавта')] есть [concept_character_trait] «$santos_balloonist_experienced$», «$santos_balloonist_hero$» или «$ambitious$»."
 santos_balloon_crossing_event_balloonist_maneuver_icon_flag: "@santos_event_log_positive_balloonist_maneuver_icon!"
 santos_balloon_crossing_event_balloonist_maneuver_title_flag: "Манёвр аэронавта"
 santos_balloon_crossing_event_balloonist_maneuver_flag: "#t $santos_balloon_crossing_event_balloonist_maneuver_title_flag$#!\nСмелый манёвр аэронавта вывел шар в выгодное положение и позволил продвинуться как можно дальше.\n\n#b Вероятность такого исхода повышается, если:#!\nУ [Concept('concept_santos_balloonist', 'аэронавта')] есть [concept_character_trait] «$santos_balloonist_experienced$», «$santos_balloonist_hero$» или «$ambitious$»."
 santos_balloon_crossing_event_cautious_flight_icon_flag: "@santos_event_log_positive_cautious_flight_icon!"
 santos_balloon_crossing_event_cautious_flight_title_flag: "Осторожный полёт"
 santos_balloon_crossing_event_cautious_flight_flag: "#t $santos_balloon_crossing_event_cautious_flight_title_flag$#!\nАэронавт избегает всех необязательных рисков.\n\n#b Вероятность такого исхода повышается, если:#!\nУ [Concept('concept_santos_balloonist', 'аэронавта')] есть [concept_character_trait] «$cautious$»."
