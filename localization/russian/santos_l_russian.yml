 santos.301.t: "Stratospheric Flight: A Resounding Success"
 santos.301.d: "To the surprise of many observers, who considered the balloon flight into the stratosphere a suicide mission, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] returned from his journey today. The capsule landed in a pasture not far from [SCOPE.sState('santos_balloon_state').GetCityHubName]. In total, the balloon reached an altitude of #p [ROOT.Var('new_balloon_altitude_var').GetValue]#! meters#!."
 santos.301.f: "'A huge yellow balloon soared skyward, a few weeks ago, from [SCOPE.sState('santos_balloon_state').GetCityHubName], [GetPlayer.GetNameNoFormatting]. Instead of a basket, it trailed an air-thin black-and-silver aluminum ball. Within [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] aimed to explore the air 50,000 feet up. Seventeen hours later, after being given up for dead, [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] returned safely from an estimated height of [ROOT.Var('new_balloon_altitude_var').GetValue].'"
 santos.301.g: "Glory to our hero [ROOT.Var('santos_balloonist_var').GetCharacter.GetLastNameNoFormatting]!"
 santos.302.t: "Stratospheric Flight: A Fatal Disaster"
 santos.302.d: "The belief held by many researchers and journalists has now been confirmed: the stratospheric flight was a complete crazy idea. Whether our balloonist died in the rough landing near [SCOPE.sState('santos_balloon_state').GetCityHubName] after the ropes snapped due to material fatigue, or whether the heat inside the balloon and the lack of oxygen at that altitude led to [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis] premature death, remains to be determined by an autopsy. In any case, the press is already having a field day over the incident."
 santos.302.f: "'Studies, warnings, and even well-meaning advice had no effect. The tragic death of [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] could likely have been prevented had the government banned this reckless maneuver. But the thirst for international fame and the complete blindness brought on by the prospect of sending a balloonist to new heights caused even the most reasonable objections to fall on deaf ears.\n\nWho are these people, anyway? Where is their sense of responsibility? It's not a coincidence that once [SCOPE.sCharacter('santos_ruler_scope').GetFullNameNoFormatting] took office this country started coming apart at the seams! The responsible people don't wanna tell you, but they are scared, and they should be, because the very fabric of this country is tearing from all corners.'"
 santos.302.g: "Declare a day of national mourning."
 santos_stratospheric_flight_success_modifier: "Stratospheric Flight: Success"
 santos_stratospheric_flight_failure_modifier: "Stratospheric Flight: Failure"
 je_santos_stratospheric_flight: "Stratospheric Flight"
 je_santos_stratospheric_flight_reason: "For 19th-century balloonists, a spectacular flight into the stratosphere was still nothing more than a utopian dream. However, with the great advances of the Industrial Age and the invention of the pressurized capsule, even this adventure was no longer an insurmountable obstacle. In the 1930s, several courageous men and women from various nations took on the challenge—and risked their lives in the process. The rules governing a high-altitude flight are not unlike those of [concept_santos_balloon_crossing], with the difference that this journey is more demanding and ends only in triumph or death. Moreover, the ultimate altitude records can be set here—up to 22,000 meters are possible!"
 santos_stratospheric_flight_on_fail_tt: "The stratospheric balloon suffers a fatal disaster."
 santos_stratospheric_flight_event_normal_ascent_icon_flag: "@santos_event_log_positive_normal_ascent_icon!"
 santos_stratospheric_flight_event_normal_ascent_title_flag: "Normal Ascent"
 santos_stratospheric_flight_event_normal_ascent_flag: "#t $santos_stratospheric_flight_event_normal_ascent_title_flag$#!\nThe balloon ascends smoothly into the stratosphere."
 santos_stratospheric_flight_event_boost_ascent_icon_flag: "@santos_event_log_positive_boost_ascent_icon!"
 santos_stratospheric_flight_event_boost_ascent_title_flag: "Rapid Rise"
 santos_stratospheric_flight_event_boost_ascent_flag: "#t $santos_stratospheric_flight_event_boost_ascent_title_flag$#!\nThe balloonist managed to successfully increase the balloon's altitude.\n\n#b The following factors make this outcome more likely:#!\n[concept_santos_balloonist] has the $santos_balloonist_experienced$, $innovative$ or $ambitious$ [concept_character_trait].#!"
 santos_stratospheric_flight_event_altitude_improvisation_icon_flag: "@santos_event_log_positive_altitude_improvisation_icon!"
 santos_stratospheric_flight_event_altitude_improvisation_title_flag: "Altitude Improvisation"
 santos_stratospheric_flight_event_altitude_improvisation_flag: "#t $santos_stratospheric_flight_event_altitude_improvisation_title_flag$#!\nThe crew's technical expertise made it possible to minimize the risks associated with the balloon flight.\n\n#b The following factors make this outcome more likely:#!\n[concept_santos_balloonist] has the $cautious$, $innovative$ or $engineer$ [concept_character_trait]. A [concept_curie_meteorological_physicist] which has the $innovative$, $erudite$ or $meticulous$ [concept_character_trait] might also help.#!"
 santos_stratospheric_flight_event_slow_ascent_icon_flag: "@santos_event_log_negative_slow_ascent_icon!"
 santos_stratospheric_flight_event_slow_ascent_title_flag: "Slow Ascent"
 santos_stratospheric_flight_event_slow_ascent_flag: "#t $santos_stratospheric_flight_event_slow_ascent_title_flag$#!\nFor unknown reasons, the balloon is not rising as quickly as originally calculated."
 santos_stratospheric_flight_event_broken_rope_icon_flag: "@santos_event_log_negative_broken_rope_icon!"
 santos_stratospheric_flight_event_broken_rope_title_flag: "Broken Rope"
 santos_stratospheric_flight_event_broken_rope_flag: "#t $santos_stratospheric_flight_event_broken_rope_title_flag$#!\nA broken rope makes it harder to control the balloon and, in particular, makes it difficult to release the gas properly.\n\n#b The following factors make this outcome more likely:#!\n[concept_santos_balloonist] has the $reckless$, $wrathful$, $arrogant$ [concept_character_trait] or a #V negative condition trait like a disease or an addiction#!.\n\n#b The following factors make this outcome less likely:#!\n[concept_santos_balloonist] has the $curie_meteorological_physicist$ or $engineer$ [concept_character_trait]. A [concept_curie_meteorological_physicist] might discover these problems before the start.#!"
 santos_stratospheric_flight_event_defective_valve_icon_flag: "@santos_event_log_negative_defective_valve_icon!"
 santos_stratospheric_flight_event_defective_valve_title_flag: "Defective Valve"
 santos_stratospheric_flight_event_defective_valve_flag: "#t $santos_stratospheric_flight_event_defective_valve_title_flag$#!\nA faulty valve causes the stratospheric balloon's flight plan to deviate from the original plan.\n\n#b The following factors make this outcome more likely:#!\n[concept_santos_balloonist] has the $reckless$, $wrathful$, $arrogant$ [concept_character_trait] or a #V negative condition trait like a disease or an addiction#!.\n\n#b The following factors make this outcome less likely:#!\n[concept_santos_balloonist] has the $curie_meteorological_physicist$ or $engineer$ [concept_character_trait]. A [concept_curie_meteorological_physicist] might discover these problems before the start.#!"
 santos_stratospheric_flight_event_heat_buildup_icon_flag: "@santos_event_log_negative_heat_buildup_icon!"
 santos_stratospheric_flight_event_heat_buildup_title_flag: "Heat Buildup"
 santos_stratospheric_flight_event_heat_buildup_flag: "#t $santos_stratospheric_flight_event_heat_buildup_title_flag$#!\nWithout a protective layer of clouds, the sun beats down mercilessly on the balloon. The envelope and the lifting gas heat up significantly, and the gas expands rapidly.\n\n#b The following factors make this outcome less likely:#!\n[GetPlayer.GetName] has researched [GetTechnology('zeppelins').GetName] and [GetTechnology('curie_rocket_science_tech').GetName].#!"
 santos_stratospheric_flight_event_material_fatigue_icon_flag: "@santos_event_log_negative_material_fatigue_icon!"
 santos_stratospheric_flight_event_material_fatigue_title_flag: "Material Fatigue"
 santos_stratospheric_flight_event_material_fatigue_flag: "#t $santos_stratospheric_flight_event_material_fatigue_title_flag$#!\nThe high-altitude flight pushes the balloon material to its absolute limit: The risk of tears and other damage increases significantly!\n\n#b The following factors make this outcome more likely:#!\n[GetPlayer.GetName] has researched [GetTechnology('vulcanization').GetName] and [GetTechnology('art_silk').GetName].#!"
 santos_stratospheric_flight_event_hydrogen_fire_icon_flag: "@santos_event_log_negative_hydrogen_fire_icon!"
 santos_stratospheric_flight_event_hydrogen_fire_title_flag: "Hydrogen Fire!"
 santos_stratospheric_flight_event_hydrogen_fire_flag: "#t $santos_stratospheric_flight_event_hydrogen_fire_title_flag$#!\nThe ultimate disaster in a balloon ride has occurred: The hydrogen has caught fire! This spells certain death for the crew...\n\n#b The following factors make this outcome less likely:#!\n[GetPlayer.GetName] has the $curtiss_helium_reserve_modifier$ [concept_modifier]. [concept_santos_balloonist] has the $curie_meteorological_physicist$ or $engineer$ [concept_character_trait]. A [concept_curie_meteorological_physicist] might discover these problems before the start.#!#!"
 je_santos_balloon_crossing_complete_tt: "@santos_ballooning_progress! #V #BLUE Balloon Progress#!#! has reached #V [GetPlayer.MakeScope.ScriptValue('santos_balloon_crossing_goal_value')|0]#!."
 replace_balloonist_tt: "Replace the [concept_santos_balloonist] with a new one."