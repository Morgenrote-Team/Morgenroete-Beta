l_russian:
 thriving_culture_lesson_start_tutorial_button_loc: "Начать обучение"
 mr_tutorial_buttons: "Кнопки Morgenröte"
 mr_tutorial_buttons_desc: "Most things in Morgenröte are accesible in the Morgenröte-Windows. You can access them by clicking the buttons in the sidebar. Currently those windows exist:\n\n\n- #V Science Window#!: Here you can find your [Concept('concept_academics_academic','$concept_academics_academics|q$')], their activities, your [concept_academics_progress] and Scientific Expeditions.\n\n- #V Arts Window#!: Here you can find your [Concept('concept_artists_artist','$concept_artists_artists|q$')], their activities, your [concept_artistic_progress] and [Concept('concept_artists_art_style','$concept_artists_art_styles|q$')].\n\n- #V Sports Window#!: Here you can find various sports and characters related to sports as well as aeronautics, their activities, and International Sports Organizations."
 mr_tutorial_science_window_open: "Откройте окно науки"
 mr_tutorial_science_window_open_desc: "Теперь давайте подробнее рассмотрим окно науки. Откройте его, нажав на кнопку или клавишу «M» на клавиатуре."
 mr_tutorial_science_window_open_tt: "Откройте окно науки, нажав на кнопку науки или клавишу «M»"
 mr_tutorial_science_tab: "Окно науки"
 mr_tutorial_science_tab_desc: "Окно науки - это место, где вы можете найти информацию и действия, связанные с вашими научными начинаниями.\n\n\nОно разделено на 4 вкладки:\n\n- #V Обзор#!: на этой вкладке находится [Concept('concept_academics_progress', 'научный прогресс')], #V общие научные экспедиции#! и #V научный фокус#!\n\n- #V Математико-технические науки#!: на этой вкладке находятся [Concept('concept_tesla_engineer', '#b #ORANGE инженеры#!#!')], [Concept('concept_mendelejew_chemist', '#b #ORANGE химики#!#!')] и [Concept('concept_verrier_astronomer', '#b #ORANGE астрономы#!#!')]\n\n- [Concept('concept_dubois_natural_history', 'Естествознание')]: на этой вкладке находятся [Concept('concept_agassiz_geologist', '#b #GREEN геологи#!#!')], [Concept('concept_dubois_paleontologist', '#b #GREEN палеонтологи#!#!')] и [Concept('concept_dubois_naturalist', '#b #GREEN натуралисты#!#!')]\n\n- #V Гуманитарно-антропологические науки#!: на этой вкладке находятся [Concept('concept_panum_physician', '#b #BLUE врачи#!#!')], [Concept('concept_lepsius_archaeologist', '#b #BLUE археологи#!#!')] и [Concept('concept_andersson_anthropologist', '#b #BLUE антропологи#!#!')]"
 mr_tutorial_science_tab_tt: "Окно науки открыто"
 mr_tutorial_science_overview_tab_open: "Откройте вкладку «Обзор»"
 mr_tutorial_science_overview_tab_open_desc: "Вкладка «Обзор» даёт доступ к [Concept('concept_academics_progress', 'научному прогрессу')], #V общим научным экспедициям#! и #V научному фокусу#!.\n\nПерейдите на вкладку «Обзор», нажав на неё."
 mr_tutorial_science_overview_tab_open_tt: "Перейдите на вкладку «Обзор», нажав на неё."
 mr_tutorial_science_overview_tab_promote_academics: "Поддержка учёных"
 mr_tutorial_science_overview_tab_promote_academics_desc: "Сердце Morgenröte - это персонажи. Но как их получить?\n\nЧтобы получить нового [Concept('concept_academics_academic', 'учёного')], вам нужно накопить достаточно [Concept('concept_academics_progress', 'научного прогресса')]. Вы можете навести курсор на индикатор прогресса, чтобы увидеть, какие факторы влияют на его прирост.\n\nВы можете целенаправленно взрастить определённого учёного, если у вас есть университет со [Concept('concept_academics_university_specialization', 'специализацией')].\n\nВы также можете инвестировать деньги, чтобы быстрее накапливать научный прогресс.\n\nКроме того, учёных можно получить в результате событий или нанять с помощью дипломатического действия, если ваша держава не входит в число самых передовых в научном отношении стран."
 mr_tutorial_science_overview_tab_scientific_focus: "Научный фокус"
 mr_tutorial_science_overview_tab_scientific_focus_desc: "Иногда вам может понадобиться сосредоточиться на определённом виде исследований. Вы можете использовать научные фокусы, если соответствуете их требованиям. Они будут способствовать исследованию определённых групп технологий, снижая при этом эффективность других."
 mr_tutorial_science_overview_tab_scientific_expedition: "Научные экспедиции"
 mr_tutorial_science_overview_tab_scientific_expedition_desc: "Научные экспедиции - это экспедиции, которые может начать ваша страна. В зависимости от типа экспедиции, они могут принести вашей стране большие выгоды.\n\nВ настоящее время существуют следующие экспедиции:\n- [Concept('concept_dubois_pacific_expedition', 'Тихоокеанская экспедиция')]\n- Экспедиция для наблюдения за [Concept('concept_verrier_venus_transit', 'прохождением Венеры')]\n- Экспедиция по поиску Северо-Западного прохода\n- Экспедиция на цеппелине\n- Экспедиция по прокладке трансатлантического кабеля"
 mr_tutorial_science_natural_history_tab_open: "Откройте вкладку «Естественные науки»"
 mr_tutorial_science_natural_history_tab_open_desc: "Now let us take a look at one of the [Concept('concept_academics_academic','$concept_academics_academics|q$')]. Open the Natural History Tab to continue."
 mr_tutorial_science_natural_history_tab_open_tt: "Перейдите на вкладку «Естественные науки», нажав на неё."
 mr_tutorial_science_natural_history_tab_character: "Учёные"
 mr_tutorial_science_natural_history_tab_character_desc: "The heart of Morgenröte are its characters. In the science tab those characters are the [Concept('concept_academics_academic','$concept_academics_academics|q$')].\n\nOn the left side of each new character role you can see a portrait of your Academic and additional information on them."
 mr_tutorial_science_natural_history_tab_character_rating: "Рейтинг персонажа"
 mr_tutorial_science_natural_history_tab_character_rating_desc: "У большинства персонажей рядом с именем есть небольшой значок. Этот значок указывает на их пригодность для своей роли. Вы можете увидеть, какие факторы влияют на этот рейтинг, наведя курсор на значок.\n\nРасшифровка значков:\n@mr_rating_fantastic!  Идеально\n@mr_rating_very_good!  Очень хорошо\n@mr_rating_good!  Хорошо\n@mr_rating_mediocre!  Посредственно\n@mr_rating_bad!  Плохо\n@mr_rating_very_bad!  Очень плохо"
 mr_tutorial_science_natural_history_tab_character_experience_bar: "Опыт персонажа"
 mr_tutorial_science_natural_history_tab_character_experience_bar_desc: "Each character has [concept_academics_experience] in their field of expertise. The higher the Experience the better the character performs in various tasks.\n\nExperience is gained passively every year as well as actively by completing tasks and having success. [Concept('concept_academics_academic','$concept_academics_academics|q$')] gain higher traits if they reach 100 (experienced) and 300 (famous) experience."
 mr_tutorial_science_natural_history_tab_character_achievements: "Достижения персонажа"
 mr_tutorial_science_natural_history_tab_character_achievements_desc: "[Concept('concept_academics_academic','$concept_academics_academics|q$')] sometimes achieve impressive deeds. You can always check what your academic has achieved so far by hovering over this icon."
 mr_tutorial_science_natural_history_tab_currencies: "Открытия и показатели"
 mr_tutorial_science_natural_history_tab_currencies_desc: "У большинства персонажей в Morgenröte есть связанные с ними показатели. Они отображаются в центре для каждого учёного. Например, для геологии вы увидите, сколько минералов было найдено или сколько у вас геологических знаний.\n\nЧасто вы можете узнать больше об определённых показателях, наведя на них курсор."
 mr_tutorial_science_natural_history_visit_button: "Кнопка посещения"
 mr_tutorial_science_natural_history_visit_button_desc: "Most [Concept('concept_academics_academic','$concept_academics_academics|q$')] have special visit buttons that tell you more about this specific academic.\n\n The [concept_dubois_naturalist] for example has a button to visit the Zoo where you can find out more about your Zoo animals."
 mr_tutorial_science_natural_history_ranking: "Рейтинг"
 mr_tutorial_science_natural_history_ranking_desc: "Возможно, вам нравится сравнивать себя с другими странами. В таком случае рейтинг может быть для вас интересен. Наведя курсор на этот значок, вы увидите различные списки, которые позволят вам оценить, насколько вы преуспеваете в определённом аспекте Morgenröte по сравнению с другими державами.\n\nНапример, с помощью [Concept('concept_agassiz_geologist', '#b #GREEN геолога#!#!')] можно сравнить ваш геологический счёт, геологические знания, океанографические знания, а также количество минералов и редких минералов."
 mr_tutorial_science_natural_history_project_buttons: "Кнопки проектов и другие кнопки"
 mr_tutorial_science_natural_history_project_buttons_desc: "This part of the interface is one of the most important parts for you. It allows you to task your [Concept('concept_academics_academic','$concept_academics_academics|q$')] with projects and to start other important interactions.\n\nA [concept_agassiz_geologist] can go on expeditions, improve your industries, recalculate the age of the earth and you can found a mineralcabinet or start a congress on Continental Drift."
 mr_tutorial_science_natural_history_view_switch_buttons: "Сменить вид"
 mr_tutorial_science_natural_history_view_switch_buttons_desc: "Если вы предпочитаете более компактный интерфейс, вы можете изменить его вид с помощью этой кнопки. Для самой игры не имеет значения, какой вариант вы используете. Так что выбирайте тот, который вам больше нравится."
 mr_start_culture_tutorial_button_loc: "Обучение по культуре"
 mr_tutorial_not_yet_implemented_tt: "Это обучение ещё не готово."
 mr_tutorial_arts_window_open: "Откройте окно искусства"
 mr_tutorial_arts_window_open_desc: "Теперь давайте подробнее рассмотрим окно искусства. Откройте его, нажав на кнопку или клавиши «Ctrl + A» на клавиатуре."
 mr_tutorial_arts_window_open_tt: "Откройте окно искусства, нажав на кнопку искусства или клавиши «Ctrl + A»"
 mr_tutorial_arts_tab: "Вкладка «Искусство»"
 mr_tutorial_arts_tab_desc: "Arts were an important part of the 19th and 20th century. Great [Concept('concept_artists_artist','$concept_artists_artists|q$')] of this epoch are still well known today.\n\nMorgenröte offers various kinds of Artists and their pieces of arts.\n\nThe Arts window itself has two tabs. One shows you an overview over the Arts in your country, in the other you can find your artists and recruit artists from foreign countries."
 mr_tutorial_arts_tab_cultural_tradition: "Культурная традиция"
 mr_tutorial_arts_tab_cultural_tradition_desc: "Культурная традиция - это показатель, отражающий культурные достижения вашей страны.\nОна состоит из [Concept('concept_elgar_musical_tradition', 'музыкальной традиции')], [Concept('concept_manzoni_literary_tradition', 'литературной традиции')] и [Concept('concept_klimt_painting_tradition', 'художественной традиции')].\n\nКультурная традиция рассчитывается по следующей формуле:\nМузыкальная традиция / 4 + Художественная традиция / 3 + Литературная традиция / 2\n\nКроме того, вы будете получать [concept_prestige|l] от вашей культурной традиции. Каждые 5 очков культурной традиции принесут 1 дополнительную единицу престижа."
 mr_tutorial_arts_overview_tab_open_tt: "Откройте вкладку обзора искусства"
 mr_tutorial_arts_tab_artist_progress: "Творческий прогресс"
 mr_tutorial_arts_tab_artist_progress_desc: "You can get new [Concept('concept_artists_artist','$concept_artists_artists|q$')] by different means: You can recruit them, gain them with events or by collecting enough [concept_artistic_progress].\n\nWhile events and recruitment is not possible for every nation, gaining artists by filling the Artistic Progress bar is possible once you own an $building_elgar_opera$ or an $building_art_academy$.\nYou can see a full list of factors influencing the monthly gain by hovering over the progress bar.\n\nAdditionally you can Patronize the Arts to gain more progress and promote certain artists if you have the necessary [concept_production_method] in your $building_art_academy$."
 mr_tutorial_arts_tab_center_of_arts: "Центр искусств"
 mr_tutorial_arts_tab_center_of_arts_desc: "[Concept('concept_artists_center_of_arts','$concept_artists_centers_of_arts|q$')] are the locations where an [concept_artists_art_style] was born.\n Some Centers of Arts are already existing at game start. Others can be unlocked by [Concept('concept_journal_entry','$concept_journal_entries|q$')] or by pressing one of the buttons that you can see here. Hover over the Center of Arts to see, how you can acquire it.\n\nObviously Center of Arts are useful for you and your country as they give you access to bonuses."
 mr_tutorial_arts_tab_artists_tab_open: "Откройте вкладку «Деятели искусства»"
 mr_tutorial_arts_tab_artists_tab_open_desc: "Now let us take a closer look at the [Concept('concept_artists_artist','$concept_artists_artists|q$')].\n\nOpen the Artists Tab by clicking on the tab button."
 mr_tutorial_arts_tab_artists_tab_open_open_tt: "Откройте вкладку «Деятели искусства»"
 mr_tutorial_arts_tab_artists: "Вкладка «Деятели искусства»"
 mr_tutorial_arts_tab_artists_desc: "The [Concept('concept_artists_artist','$concept_artists_artists|q$')] look quite similar to the Academics, but they work slightly different.\n\nCurrently there are 3 Artists:\n- [concept_elgar_composer]\n- [concept_manzoni_writer]\n- [concept_klimt_painter]"
 mr_tutorial_arts_tab_artists_invite: "Приглашение деятелей искусства"
 mr_tutorial_arts_tab_artists_accquisation_desc: "As we already mentioned, [Concept('concept_artists_artist','$concept_artists_artists|q$')] can not just be acquired by gaining enough [concept_artistic_progress] but also by simply inviting them.\n\nEach kind of Artist has different requirements. You can invite [Concept('concept_elgar_travelling_composer','$concept_elgar_travelling_composers|q$')] from all around the world but you need to be a country with enough $building_elgar_opera$s and a good enough [concept_elgar_musical_tradition].\n\n[Concept('concept_klimt_independent_painter','$concept_klimt_independent_painters|q$')] can only be invited if they have a similar culture.\n\n[Concept('concept_manzoni_writer','$concept_manzoni_writers|q$')] on the other hand can't be invited at all."
 mr_tutorial_arts_tab_artists_character: "Общая информация"
 mr_tutorial_arts_tab_artists_character_desc: "The left most part of the window shows you some basic information on your artist.\n\nHere you can see:\n-The Portrait\n-The Name and Rating\n-The [concept_artists_experience]\n- The [Concept('concept_character_trait','$concept_character_traits|q$')]"
 mr_tutorial_arts_tab_artists_currencies: "Важные показатели искусства"
 mr_tutorial_arts_tab_artists_currencies_desc: "Эта часть интерфейса позволяет вам увидеть общую информацию, касающуюся этого конкретного аспекта искусства.\nНапример, для [Concept('concept_elgar_composer', '#b #PURPLE композитора#!#!')] здесь отображается [concept_elgar_musical_tradition|l], произведения и шедевры вашего композитора, а также обзор пяти лучших композиторов мира.\n\nКроме того, вы можете найти рейтинг, наведя курсор на маленький значок в правом верхнем углу."
 mr_tutorial_arts_tab_artists_actions: "Действия деятелей искусства"
 mr_tutorial_arts_tab_artists_actions_desc: "[Concept('concept_artists_artist','$concept_artists_artists|q$')] have actions as well. Here you can see what your Artists can work on or what decisions you can take with your nation.\n\nThose were the most important informations concerning the Artists. You can continue with the Tutorial for Sports from here or continue your game."
 mr_start_sports_tutorial_button_loc: "Обучение по спорту"
 mr_tutorial_sports_window_open: "Откройте окно спорта"
 mr_tutorial_sports_window_open_desc: "Теперь давайте подробнее рассмотрим окно спорта. Откройте его, нажав на кнопку или клавиши «Ctrl + S» на клавиатуре."
 mr_tutorial_sports_window_open_tt: "Откройте окно спорта, нажав на кнопку спорта или клавиши «Ctrl + S»"
 mr_tutorial_sports_window: "Окно спорта"
 mr_tutorial_sports_window_desc: "The Sports Window allows you to access all the different sports and characters who are relevant for the sports.\n\nThe Window is separated into normal sports and Aeronautics.\n\nRegular Sports include:\n- [concept_vikelas_olympic_games]\n- [concept_douglas_mountaineering]\n- Ball Sports\n- [concept_vikelas_car_racing]\n\nAeronautics include:\n- [concept_santos_balloonist]\n- [concept_curtiss_pilot]"
 mr_tutorial_sports_tab: "Вкладка «Спорт»"
 mr_tutorial_sports_tab_desc: "Вкладка «Спорт» даёт вам обзор различных спортивных мероприятий и персонажей.\nВ отличие от учёных и деятелей искусства, персонажи на вкладке спорта часто являются просто генералами или политиками."
 mr_tutorial_sports_tab_open_tt: "Откройте вкладку «Спорт»"
 mr_tutorial_sports_tab_character_overview: "Обзор персонажа"
 mr_tutorial_sports_tab_character_overview_desc: "Эта часть интерфейса даёт вам обзор [Concept('concept_character', 'персонажей')].\n\nНекоторые персонажи, такие как [Concept('concept_vikelas_coach', 'тренер')] и автогонщик, - это персонажи, которых вы можете нанять, и поэтому у них есть [Concept('concept_academics_experience', 'опыт')]. У других, например у альпиниста, опыта нет."
 mr_tutorial_sports_tab_currencies: "Показатели и информация"
 mr_tutorial_sports_tab_currencies_desc: "В середине вы можете увидеть важную информацию, касающуюся этого конкретного вида спорта.\n\nНапример, для [Concept('concept_vikelas_olympic_games', 'Олимпийских игр')] здесь представлен обзор президента и правления [Concept('concept_vikelas_ioc', 'МОК')], количество членов и сколько медалей вы уже собрали."
 mr_tutorial_sports_tab_actions: "Действия"
 mr_tutorial_sports_tab_actions_desc: "The right side allows you to take specific actions for that sport.\nThose Actions are basically decisions that allow you to use your [Concept('concept_character', '$concept_characters|q$')] or to establish something new like [concept_vikelas_ioc]."
 mr_tutorial_sports_tab_aeronautics_tab_open: "Откройте вкладку «Воздухоплавание»"
 mr_tutorial_sports_tab_aeronautics_tab_open_desc: "Теперь давайте подробнее рассмотрим вкладку «Воздухоплавание». Откройте её, нажав на кнопку."
 mr_tutorial_aeronautics_tab_open_tt: "Откройте вкладку «Воздухоплавание»"
 mr_tutorial_aeronautics_tab: "Вкладка «Воздухоплавание»"
 mr_tutorial_aeronautics_tab_desc: "The Aeronautics Tab looks mostly the same as the Sports Tab.\n\nOne big difference lies in the characters themselves. You can sponsor and automate the [concept_santos_balloonist] and the [concept_curtiss_pilot] will spawn under various circumstances.\n\nThis is the end of the overview Tutorial. Please use the Vickypedia or the Concepts we added if you would like to learn more about the characters of Morgenröte."
 mr_tutorial_lesson_button_finish: "Завершить обучение"
