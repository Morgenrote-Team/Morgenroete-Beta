 MR_BIOLOGIST_SIT_BUTTON: "Sterile Insect Technique"
 MR_BIOLOGIST_SIT_BUTTON_TT: "#T Sterile Insect Technique#!\nGiven extensive technological possibilities, a biologist with government support could research a method to finally eradicate the pesky screwworm fly. This would improve agricultural yields in affected regions.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_SCREWWORM_FLY_TRIGGER: "#default_text [GetPlayer.GetName] at least one state located within the habitat area of the [GetHarvestConditionType('theiler_screwworm_fly_condition').GetName].#!"
 MR_BIOLOGIST_LEAD_ARSENATE_BUTTON: "Lead Arsenate"
 MR_BIOLOGIST_LEAD_ARSENATE_BUTTON_TT: "#T Lead Arsenate#!\nThe inorganic pesticides currently in use—which already show initial efficacy against certain insects—still leave considerable room for improvement. 'Paris Green' could be replaced by an arsenate based on lead. A biologist could develop this new pesticide with the assistance of a chemist, in order to bring a swift end to the Colorado potato beetle and the codling moth.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_MOTH_OR_BEETLE_STATE_TRIGGER: "#default_text [GetPlayer.GetName] at least one state located within the habitat area of the [GetHarvestConditionType('theiler_potato_beetle_condition').GetName] or the [GetHarvestConditionType('theiler_codling_moth_condition').GetName].#!"
 MR_BIOLOGIST_SODIUM_ARSENITE_BUTTON: "Sodium Arsenite"
 MR_BIOLOGIST_SODIUM_ARSENITE_BUTTON_TT: "#T Sodium Arsenite#!\nConventional pesticides, mosquito repellent, and even flamethrowers fail to finish off the locusts. Here, one must think on a larger scale!\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_LOCUST_STATE_TRIGGER: "#default_text [GetPlayer.GetName] at least one state located within the habitat area of the [GetHarvestConditionType('locust_swarm').GetName].#!"
 MR_BIOLOGIST_CALCIUM_ARSENATE_BUTTON: "Calcium Arsenate"
 MR_BIOLOGIST_CALCIUM_ARSENATE_BUTTON_TT: "#T Calcium Arsenate#!\nTo put an end to the colossal losses in cotton farming, more drastic measures are required. It may well take something even more effective than mere lead arsenate.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BOLL_WEEVIL_STATE_TRIGGER: "#default_text [GetPlayer.GetName] at least one state located within the habitat area of the [GetHarvestConditionType('theiler_boll_weevil_condition').GetName].#!"
 MR_BIOLOGIST_NICOTINE_SULFATE_BUTTON: "Nicotine Sulfate"
 MR_BIOLOGIST_NICOTINE_SULFATE_BUTTON_TT: "#T Nicotine Sulfate#!\nIn the past, tobacco extracts were considered a home remedy for driving tea bugs away from farms. A new, industrial method is called for! A biologist could develop this new pesticide with the assistance of a chemist, in order to bring a swift end to tea mosquito bugs.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_TEA_MOSQUITO_STATE_TRIGGER: "#default_text [GetPlayer.GetName] at least one state located within the habitat area of the [GetHarvestConditionType('theiler_tea_mosquito_condition').GetName].#!"
 MR_BIOLOGIST_GRAFTING_BUTTON: "Grafting"
 MR_BIOLOGIST_GRAFTING_BUTTON_TT: "#T Grafting#!\nAll chemical agents used against the phylloxera have failed so far. Perhaps there is a solution to be found outside the realm of highly toxic pesticides?\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_GRAPE_PHYLLOXERA_STATE_TRIGGER: "#default_text [GetPlayer.GetName] at least one state located within the habitat area of the [GetHarvestConditionType('theiler_grape_phylloxera_condition').GetName].#!"