 MR_BIOLOGIST_SIT_BUTTON: "Метод стерильных насекомых"
 MR_BIOLOGIST_SIT_BUTTON_TT: "#T Метод стерильных насекомых#!\nРазвитые технологии позволят биологу при поддержке государства разработать метод окончательного искоренения назойливой мясной мухи. Это повысит продуктивность сельского хозяйства в пострадавших регионах.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_SCREWWORM_FLY_TRIGGER: "#default_text В [GetPlayer.GetAltNameNoFlag('RU_CL_PP')] есть хотя бы одна область в ареале следующих вредителей: [GetHarvestConditionType('theiler_screwworm_fly_condition').GetName].#!"
 MR_BIOLOGIST_LEAD_ARSENATE_BUTTON: "Арсенат свинца"
 MR_BIOLOGIST_LEAD_ARSENATE_BUTTON_TT: "#T Арсенат свинца#!\nПрименяемые сейчас неорганические пестициды уже показывают некоторую эффективность против отдельных насекомых, но их ещё можно значительно улучшить. «Парижскую зелень» можно заменить арсенатом свинца. При содействии химика биолог сможет разработать этот новый пестицид, чтобы быстро справиться с колорадским жуком и яблонной плодожоркой.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_MOTH_OR_BEETLE_STATE_TRIGGER: "#default_text В [GetPlayer.GetAltNameNoFlag('RU_CL_PP')] есть хотя бы одна область в ареале следующих вредителей: [GetHarvestConditionType('theiler_potato_beetle_condition').GetName] или [GetHarvestConditionType('theiler_codling_moth_condition').GetName].#!"
 MR_BIOLOGIST_SODIUM_ARSENITE_BUTTON: "Арсенит натрия"
 MR_BIOLOGIST_SODIUM_ARSENITE_BUTTON_TT: "#T Арсенит натрия#!\nОбычные пестициды, средства от комаров и даже огнемёты не могут справиться с саранчой. Здесь нужно мыслить масштабнее!\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_LOCUST_STATE_TRIGGER: "#default_text В [GetPlayer.GetAltNameNoFlag('RU_CL_PP')] есть хотя бы одна область в ареале следующих вредителей: [GetHarvestConditionType('locust_swarm').GetName].#!"
 MR_BIOLOGIST_CALCIUM_ARSENATE_BUTTON: "Арсенат кальция"
 MR_BIOLOGIST_CALCIUM_ARSENATE_BUTTON_TT: "#T Арсенат кальция#!\nЧтобы положить конец колоссальным потерям в хлопководстве, нужны более решительные меры. Возможно, потребуется средство ещё действеннее арсената свинца.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BOLL_WEEVIL_STATE_TRIGGER: "#default_text В [GetPlayer.GetAltNameNoFlag('RU_CL_PP')] есть хотя бы одна область в ареале следующих вредителей: [GetHarvestConditionType('theiler_boll_weevil_condition').GetName].#!"
 MR_BIOLOGIST_NICOTINE_SULFATE_BUTTON: "Сульфат никотина"
 MR_BIOLOGIST_NICOTINE_SULFATE_BUTTON_TT: "#T Сульфат никотина#!\nПрежде табачные вытяжки служили домашним средством для отпугивания чайных клопов с плантаций. Теперь нужен новый, промышленный метод! При содействии химика биолог сможет разработать новый пестицид, чтобы быстро справиться с чайными клопами.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_TEA_MOSQUITO_STATE_TRIGGER: "#default_text В [GetPlayer.GetAltNameNoFlag('RU_CL_PP')] есть хотя бы одна область в ареале следующих вредителей: [GetHarvestConditionType('theiler_tea_mosquito_condition').GetName].#!"
 MR_BIOLOGIST_GRAFTING_BUTTON: "Прививка винограда"
 MR_BIOLOGIST_GRAFTING_BUTTON_TT: "#T Прививка винограда#!\nДо сих пор все химические средства против филлоксеры оказались бессильны. Быть может, решение следует искать за пределами мира высокотоксичных пестицидов?\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_GRAPE_PHYLLOXERA_STATE_TRIGGER: "#default_text В [GetPlayer.GetAltNameNoFlag('RU_CL_PP')] есть хотя бы одна область в ареале следующих вредителей: [GetHarvestConditionType('theiler_grape_phylloxera_condition').GetName].#!"
 BIOLOGICAL_CONGRESS_BUTTON: "Host Biological Congress"
 BIOLOGICAL_CONGRESS_BUTTON_TT: "#T Host Biological Congress#!\nWith the revolution in microbiological research and the simultaneous spread of dangerous epidemics and pests, the need to share discoveries at international congresses for the benefit of humanity grew. With a bit of luck, knowledge about pathogens, vaccines and pesticides can be exchanged.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGICAL_BREAKTHROUGH_TRIGGER_TT: "#default_text [GetPlayer.GetName] has the #V Biological Breakthrough#! Modifier.#!"
 MR_BIOLOGY_5_COUNTRIES_WITH_BIOLOGIST_TRIGGER_TT: "#default_text 5 or more countries have a [concept_theiler_biologist].#!"
 MR_BIOLOGICAL_CONGRESS_COOLDOWN_TRIGGER_TT: "#default_text There #V hasn't been a Biological Congress#! in the #V last 5 years#! (the last Host doesn't have the \"Hosted a Biological Congress\" Modifier).#!"