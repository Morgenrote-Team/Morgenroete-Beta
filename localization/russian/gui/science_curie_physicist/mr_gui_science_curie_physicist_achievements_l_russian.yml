l_russian:
 MR_PHYSICIST_ACHIEVEMENTS_TT: "[AddLocalizationIf( Scope.IsSet , 'curie_physicist_achievements_loc')][AddLocalizationIf( Not(Scope.IsSet) , 'curie_physicist_achievements_no_physicist_loc')]"
 curie_physicist_achievements_loc: "$curie_physicist_achievements_intro_loc$[AddLocalizationIf( Scope.Var('curie_physicist_achievement_historical_physics_experiment_var').IsSet , Scope.Var('curie_physicist_achievement_historical_physics_experiment_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_mass_energy_equivalence_var').IsSet , Scope.Var('curie_physicist_achievement_mass_energy_equivalence_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_essay_on_wind_var').IsSet , Scope.Var('curie_physicist_achievement_essay_on_wind_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_stratospheric_flight_var').IsSet , Scope.Var('curie_physicist_achievement_stratospheric_flight_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_founded_magnetic_association_var').IsSet , Scope.Var('curie_physicist_achievement_founded_magnetic_association_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievements_finished_geomagnetic_observatory_project_var').IsSet , Scope.Var('curie_physicist_achievements_finished_geomagnetic_observatory_project_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_magnetic_atlas_var').IsSet , Scope.Var('curie_physicist_achievement_magnetic_atlas_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_mathematics_improvement_finished_var').IsSet , Scope.Var('curie_physicist_achievement_mathematics_improvement_finished_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_first_cloud_describer_var').IsSet , Scope.Var('curie_physicist_achievement_first_cloud_describer_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_weather_service_var').IsSet , Scope.Var('curie_physicist_achievement_weather_service_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_weather_station_expansion_var').IsSet , Scope.Var('curie_physicist_achievement_weather_station_expansion_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_meteorology_improvement_finished_var').IsSet , Scope.Var('curie_physicist_achievement_meteorology_improvement_finished_var').GetFlagName)]"
 curie_physicist_achievements_intro_loc: "#V Достижения этого физика#!\n #indent_newline:3 • [Scope.GetCharacter.GetFullName] — [SelectLocalization(Scope.GetCharacter.IsFemale, 'известная учёная', 'известный учёный')] в области физики.#!\n #indent_newline:3 • Открытых формул: [Scope.Var('curie_discovered_formulas_character_number_var').GetValue|V0]; проведённых экспериментов: [Scope.Var('curie_discovered_experiments_character_number_var').GetValue|V0]; описанных типов облаков: [Scope.Var('curie_discovered_clouds_character_number_var').GetValue|V0].#!"
 curie_physicist_achievements_no_physicist_loc: "Здесь будут показаны #V достижения#! вашего [Concept('concept_curie_physicist', '#b #ORANGE физика#!#!')], когда он появится в стране."
 curie_physicist_achievement_historical_physics_experiment_loc: "\n #indent_newline:3 • Доктор [Scope.GetCharacter.GetLastNameNoFormatting] [SelectLocalization(Scope.GetCharacter.IsFemale, 'прославилась', 'прославился')] благодаря #V эксперименту#!, получившему имя своего автора.#!"
 curie_physicist_achievement_founded_magnetic_association_loc: "\n #indent_newline:3 • Доктор [Scope.GetCharacter.GetLastNameNoFormatting] [SelectLocalization(Scope.GetCharacter.IsFemale, 'основала', 'основал')] #V Магнитный союз#! — первое международное научное объединение.#!"
 curie_physicist_achievements_finished_geomagnetic_observatory_project_loc: "\n #indent_newline:3 • Доктор [Scope.GetCharacter.GetLastNameNoFormatting] [SelectLocalization(Scope.GetCharacter.IsFemale, 'способствовала', 'способствовал')] развитию геомагнитных исследований, #V построив геомагнитную обсерваторию#!.#!"
 curie_physicist_achievement_magnetic_atlas_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetSheHe|U] [SelectLocalization(Scope.GetCharacter.IsFemale, 'сыграла', 'сыграл')] ключевую роль в #V создании геомагнитного атласа#!.#!"
 curie_physicist_achievement_mathematics_improvement_finished_loc: "\n #indent_newline:3 • Доктор [Scope.GetCharacter.GetLastNameNoFormatting] [SelectLocalization(Scope.GetCharacter.IsFemale, 'неустанно работала', 'неустанно работал')] над #V совершенствованием математических факультетов#! страны.#!"
 curie_physicist_achievement_first_cloud_describer_loc: "\n #indent_newline:3 • Впервые #V описав новый тип облаков#!, [Scope.GetCharacter.GetSheHe] [SelectLocalization(Scope.GetCharacter.IsFemale, 'заняла', 'занял')] видное место в истории метеорологии.#!"
 curie_physicist_achievement_weather_service_loc: "\n #indent_newline:3 • Доктор [Scope.GetCharacter.GetLastNameNoFormatting] много лет [SelectLocalization(Scope.GetCharacter.IsFemale, 'руководила', 'руководил')] #V метеорологической службой#! на благо страны.#!"
 curie_physicist_achievement_weather_station_expansion_loc: "\n #indent_newline:3 • Одним из важнейших технических достижений стала модернизация метеостанции при обсерватории. Ею [SelectLocalization(Scope.GetCharacter.IsFemale, 'руководила', 'руководил')] доктор [Scope.GetCharacter.GetLastNameNoFormatting].#!"
 curie_physicist_achievement_meteorology_improvement_finished_loc: "\n #indent_newline:3 • Доктор [Scope.GetCharacter.GetLastNameNoFormatting] [SelectLocalization(Scope.GetCharacter.IsFemale, 'расширила', 'расширил')] общенациональную сеть метеостанций при телеграфных конторах, что значительно повысило защищённость страны от погодных бедствий.#!"
 curie_physicist_achievement_stratospheric_flight_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] organized and oversaw our country's #V first stratospheric flight#! and is therefore considered one of our most respected scientists."
 curie_physicist_achievement_mass_energy_equivalence_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] revolutionized modern physics with his #V formula for the equivalence of mass and energy#!."
 curie_physicist_achievement_essay_on_wind_loc: "\n #indent_newline:3 • With [Scope.GetCharacter.GetHerHis] #V treatise on wind currents in the mid-latitudes#!, [Scope.GetCharacter.GetSheHe] has produced a seminal work. [Scope.GetCharacter.GetSheHe].#!"