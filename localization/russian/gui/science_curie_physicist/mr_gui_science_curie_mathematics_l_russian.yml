 MR_PHYSICIST_MAGNETIC_ATLAS_BUTTON_TT: "#T Составить геомагнитный атлас#!\nИспользуя обширные геомагнитные данные, физик может составить собственный геомагнитный атлас. Такой труд значительно углубит наши знания о физике.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
