 curie_cloud_history_country_flag_loc: "Первоописатель: #V [Scope.Var('discoverer').GetFlagName]#!. Страна: [Scope.Var('discovering_country').GetFlagName]. Год: [Scope.Var('year').GetValue|0]."
 MR_CIRRUS_DESCRIPTION_LOC: "#lore Перистые облака состоят из тонких волокнистых белых прядей, полос или перьевидных образований, напоминающих мазки кисти на голубом небе. Они целиком образованы кристаллами льда.#!"
 MR_CIRRUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_montgolfier_balloon_researched_type')] [GetTechnology('curtiss_montgolfier_balloon_tech').GetName]"
 MR_CIRRUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ Нет"
 MR_CIRRUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ Нет"
 MR_CIRRUS_CLOUD: "Перистые облака принимают самые разнообразные формы: отдельные пучки (табл. 35), линии на голубом небе (табл. 33), разветвлённые перьевидные полосы и дуги, заканчивающиеся пучками. Часто они образуют полосы, пересекающие небо подобно меридианам; из-за перспективы эти полосы сходятся в одной точке на горизонте или в двух противоположных точках. В образовании таких полос нередко участвуют также перисто-слоистые и перисто-кучевые облака.\n\nПеристые облака всегда состоят из кристаллов льда, а их прозрачность объясняется малым размером отдельных кристаллов.\nОбычно такие облака проходят перед солнечным диском, почти не ослабляя его света. Лишь особенно плотные перистые облака могут затуманить Солнце и скрыть его очертания. Так же ведут себя отдельные участки высокослоистых облаков, однако перистые отличаются ослепительной белизной и шелковистыми краями.\n\n#Italic По материалам Международного атласа облаков, 1930 г.#!"
 MR_CIRROCUMULUS_DESCRIPTION_LOC: "#lore Перисто-кучевые облака — это расположенные на большой высоте мелкие пушистые скопления кристаллов льда, образующие тонкий узор. Они указывают на сильные высотные ветры и растущую неустойчивость в верхней тропосфере.#!"
 MR_CIRROCUMULUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_montgolfier_balloon_researched_type')] [GetTechnology('curtiss_montgolfier_balloon_tech').GetName]"
 MR_CIRROCUMULUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetPlayer.GetCustom('curie_extreme_winds_condition_type')] [GetHarvestConditionType('extreme_winds').GetName]"
 MR_CIRROCUMULUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ #G -10%#! $state_harvest_condition_extreme_winds_impact_mult$"
 MR_CIRROCUMULUS_CLOUD: "Обычно перисто-кучевые облака представляют собой распадающееся состояние перистых или перисто-слоистых облаков, каждое из которых может в них превратиться (табл. 41). При таком превращении отдельные участки нередко сохраняют волокнистую структуру.\n\nНастоящие перисто-кучевые облака встречаются редко. Их не следует путать с мелкими участками высококучевых облаков по краям высококучевого слоя (табл. 41). Между перисто-кучевыми и обычными высококучевыми облаками существуют все переходные формы, что естественно: механизм их образования одинаков. Если иных признаков нет, термин «перисто-кучевые облака» следует применять лишь тогда, когда:\n\n1) явно видна связь с перистыми или перисто-слоистыми облаками (табл. 41);\n2) наблюдаемое облако возникло в результате преобразования перистых или перисто-слоистых облаков (табл. 41);\n3) наблюдаемое облако обладает некоторыми признаками облаков из кристаллов льда, перечисленными в разделе о перистых облаках (с. 3).\n\n#Italic По материалам Международного атласа облаков, 1930 г.#!"
 MR_CIRROSTRATUS_DESCRIPTION_LOC: "#lore Тонкая молочно-прозрачная пелена, покрывающая небо. Её главный отличительный признак — гало: кольца или дуги света вокруг Солнца либо Луны, возникающие из-за преломления света в кристаллах льда.#!"
 MR_CIRROSTRATUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_montgolfier_balloon_researched_type')] [GetTechnology('curtiss_montgolfier_balloon_tech').GetName]"
 MR_CIRROSTRATUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetPlayer.GetCustom('curie_moderate_rainfall_condition_type')] [GetHarvestConditionType('moderate_rainfall').GetName]"
 MR_CIRROSTRATUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ #G 10%#! $state_harvest_condition_moderate_rainfall_impact_mult$"
 MR_CIRROSTRATUS_CLOUD: "Обширная пелена перисто-слоистых облаков, хотя местами и разорванная просветами, почти всегда в конце концов закрывает всё небо. Её край может быть прямым и чётким (табл. 40), но чаще он неровен или рассечён (табл. 37).\n\nДнём, когда Солнце находится достаточно высоко над горизонтом, такая пелена никогда не бывает настолько плотной, чтобы скрыть тени предметов на земле.\nМолочно-белую дымку тумана можно отличить от похожей пелены перисто-слоистых облаков по гало, которое Солнце или Луна почти всегда создаёт в слое этих облаков.\n\nСказанное о прозрачности и окраске перистых облаков в значительной мере относится и к перисто-слоистым.\n\n#Italic По материалам Международного атласа облаков, 1930 г.#!"
 MR_ALTOCUMULUS_DESCRIPTION_LOC: "#lore Поля или слои облаков среднего яруса, состоящие из небольших шаров, клочьев или валиков. Нередко они предвещают скорую перемену погоды.#!"
 MR_ALTOCUMULUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_reconnaissance_balloon_researched_type')] [GetTechnology('curtiss_reconnaissance_balloon_tech').GetName]"
 MR_ALTOCUMULUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetPlayer.GetCustom('curie_torrential_rains_condition_type')] [GetHarvestConditionType('torrential_rains').GetName]"
 MR_ALTOCUMULUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ #G -10%#! $state_harvest_condition_torrential_rains_impact_mult$"
 MR_ALTOCUMULUS_CLOUD: "Диапазон высот, на которых встречаются высококучевые облака, очень широк. На наибольших высотах они состоят из мелких элементов (табл. 21) и напоминают перисто-кучевые облака. Однако у высококучевых отсутствуют следующие признаки перисто-кучевых:\n\n1) связь с перистыми или перисто-слоистыми облаками;\n2) образование из перистых или перисто-слоистых облаков;\n3) свойства, обусловленные физической структурой из кристаллов льда и перечисленные в разделе о перистых облаках.\n\nНа меньших высотах высококучевые облака могут возникать при растекании вершин кучевых облаков (табл. 25), и тогда их легко спутать со слоисто-кучевыми. Условно облако относят к высококучевым, если наименьшие из его чётко очерченных и регулярно расположенных элементов — без учёта отдельных элементов по краям — не превышают десяти солнечных диаметров по своему меньшему измерению.\n\n#Italic По материалам Международного атласа облаков, 1930 г.#!"
 MR_ALTOSTRATUS_DESCRIPTION_LOC: "#lore Высокослоистые облака представляют собой сероватую или синеватую слоистую либо волокнистую пелену, обычно равномерно покрывающую небо. Солнце, как правило, лишь тускло просвечивает сквозь неё.#!"
 MR_ALTOSTRATUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_reconnaissance_balloon_researched_type')] [GetTechnology('curtiss_reconnaissance_balloon_tech').GetName]"
 MR_ALTOSTRATUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetPlayer.GetCustom('curie_frost_condition_type')] [GetHarvestConditionType('frost').GetName]"
 MR_ALTOSTRATUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ #G -10%#! $state_harvest_condition_frost_impact_mult$"
 MR_ALTOSTRATUS_CLOUD: "Высокослоистые облака встречаются в довольно широком диапазоне высот — примерно от 2000 до 5000 метров.\nВысокий слой таких облаков отличается от похожего слоя перисто-слоистых тем, что в нём не наблюдается гало, а тени предметов на земле не видны.\n\nНизкий слой высокослоистых облаков можно отличить от похожего слоя слоисто-дождевых по следующим признакам: слоисто-дождевые облака гораздо темнее и однороднее, в них нигде не видно белёсого свечения или волокнистой структуры; граница их нижней поверхности размыта выпадающими осадками, которые могут не достигать земли.\n\nКроме того, принято считать, что слоисто-дождевые облака повсюду скрывают Солнце и Луну, тогда как высокослоистые закрывают их лишь за более тёмными участками, а сквозь светлые части светила снова становятся видны (табл. 18).\n\n#Italic По материалам Международного атласа облаков, 1930 г.#!"
 MR_NIMBOSTRATUS_DESCRIPTION_LOC: "#lore Тёмно-серый, бесформенный и плотный слой облаков, который нередко висит так низко, что полностью скрывает Солнце, а его края кажутся размытыми.#!"
 MR_NIMBOSTRATUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_early_aviation_researched_type')] [GetTechnology('curtiss_early_aviation_tech').GetName]"
 MR_NIMBOSTRATUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetPlayer.GetCustom('curie_flood_condition_type')] [GetHarvestConditionType('flood').GetName]"
 MR_NIMBOSTRATUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ #G -10%#! $state_harvest_condition_flood_impact_mult$"
 MR_NIMBOSTRATUS_CLOUD: "Обычное развитие выглядит так: слой высокослоистых облаков уплотняется и опускается, пока не превращается в слоисто-дождевой. Под ним, как правило, постепенно возникают очень низкие разорванные облака — сначала отдельные, затем сливающиеся в почти сплошной слой, в просветах которого всё ещё можно увидеть слоисто-дождевые облака. Эти очень низкие облака называют разорванно-кучевыми или разорванно-слоистыми в зависимости от того, ближе ли их форма к кучевой или слоистой.\n\nОбычно дождь начинается лишь после образования этих низких облаков. Затем они скрываются за пеленой осадков или вовсе рассеиваются под её воздействием. Вертикальная видимость при этом резко ухудшается.\n\n#Italic По материалам Международного атласа облаков, 1930 г.#!"
 MR_STRATOCUMULUS_DESCRIPTION_LOC: "#lore Серые или белёсые, часто крупноячеистые гряды облаков в форме шаров или валиков. Обычно они закрывают небо сплошными участками, хотя между ними могут оставаться просветы.#!"
 MR_STRATOCUMULUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_meteorology_researched_type')] [GetTechnology('curtiss_meteorology_tech').GetName]"
 MR_STRATOCUMULUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ Нет"
 MR_STRATOCUMULUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ Нет"
 MR_STRATOCUMULUS_CLOUD: "Элементы плотных слоисто-кучевых облаков часто стремятся полностью слиться, и в некоторых случаях слой превращается в слоисто-дождевой. Облако называют слоисто-дождевым, когда отдельные элементы слоисто-кучевой структуры полностью исчезают, а из-за полос выпадающих осадков нижняя поверхность теряет чёткую границу.\n\nСлоисто-кучевые облака могут превращаться в слоистые (табл. 10), и наоборот. Поскольку слоистые облака располагаются ниже, их элементы кажутся очень крупными и расплывчатыми, так что структура из регулярно расположенных шаров и волн перестаёт различаться. Пока эта структура остаётся видимой, облако следует считать слоисто-кучевым (табл. 10).\n\n#Italic По материалам Международного атласа облаков, 1930 г.#!"
 MR_STRATUS_DESCRIPTION_LOC: "#lore Однородная серая низкая пелена, часто похожая на поднявшийся туман и полностью затягивающая небо. Слоистые облака приносят слабую морось, особенно осенью и зимой.#!"
 MR_STRATUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_montgolfier_balloon_researched_type')] [GetTechnology('curtiss_montgolfier_balloon_tech').GetName]"
 MR_STRATUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ Нет"
 MR_STRATUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ Нет"
 MR_STRATUS_CLOUD: "Пелена настоящих слоистых облаков обычно придаёт небу характерный дымчатый вид, однако иногда её можно спутать со слоисто-дождевыми облаками. При осадках различие очевидно: слоисто-дождевые облака дают продолжительный дождь, иногда снег, причём капли могут быть мелкими и редкими либо крупными и частыми; слоистые же облака дают только морось — очень частые мелкие капли.\n\nПри отсутствии осадков тёмный однородный слой слоистых облаков легко принять за слоисто-дождевой. Однако нижняя поверхность слоисто-дождевых всегда выглядит размытой из-за повсеместных полос осадков, не достигающих земли; она совершенно однородна, и на ней невозможно различить детали. Слоистые облака выглядят «суше» и, даже будучи однородными, сохраняют контрасты и более светлые прозрачные участки — менее тёмные места, где облако тоньше. Они соответствуют промежуткам между валиками и округлыми массами слоисто-кучевых облаков, но значительно крупнее. Слоисто-дождевые облака, напротив, кажутся слабо освещёнными изнутри.\n\n#Italic По материалам Международного атласа облаков, 1930 г.#!"
 MR_CUMULUS_DESCRIPTION_LOC: "#lore Плотные кучевые облака с резко очерченными границами, плоским основанием и куполообразными вершинами, похожими на цветную капусту и ярко сияющими на фоне неба. Классический предвестник хорошей погоды.#!"
 MR_CUMULUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_montgolfier_balloon_researched_type')] [GetTechnology('curtiss_montgolfier_balloon_tech').GetName]"
 MR_CUMULUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetPlayer.GetCustom('curie_optimal_sunlight_condition_type')] [GetHarvestConditionType('optimal_sunlight').GetName]"
 MR_CUMULUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ #G 10%#! $state_harvest_condition_optimal_sunlight_impact_mult$"
 MR_CUMULUS_CLOUD: "Типичные кучевые облака (табл. 1) развиваются в ясные дни под действием дневной конвекции: появляются утром, растут, а к вечеру более или менее рассеиваются.\nОснование кучевого облака обычно серое, а его структура однородна: вплоть до вершины оно состоит из округлых частей без волокнистости (табл. 2). Даже сильно развитые кучевые облака способны давать лишь слабые осадки.\n\nДостигая уровня высококучевых облаков, кучевое облако иногда покрывается лёгкой белой рассеянной пеленой более или менее линзовидной формы с тонкой полосчатой или хлопьевидной структурой по краям. Обычно она имеет вид дуги, которая может накрыть несколько куполов кучевого облака, а затем быть ими прорвана (табл. 2).\n\n#Italic По материалам Международного атласа облаков, 1930 г.#!"
 MR_CUMULONIMBUS_DESCRIPTION_LOC: "#lore Огромные кучевые облака, поднимающиеся до больших высот, вплоть до тропопаузы, и напоминающие башни или горы. Их верхняя часть часто приобретает волокнистый вид или форму ледяной шапки — capillatus.#!"
 MR_CUMULONIMBUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_early_aviation_researched_type')] [GetTechnology('curtiss_early_aviation_tech').GetName]"
 MR_CUMULONIMBUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetPlayer.GetCustom('curie_hailstorm_condition_type')] [GetHarvestConditionType('hailstorm').GetName]"
 MR_CUMULONIMBUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ #G -10%#! $state_harvest_condition_hailstorm_impact_mult$"
 MR_CUMULONIMBUS_CLOUD: "Даже если кучево-дождевое облако по форме неотличимо от мощно развитого кучевого, его сущность проявляется в иной структуре верхней части, когда та видна: волокнистой, а не кучевой. Какими бы тяжёлыми ни были массы кучевых облаков и как бы высоко они ни развивались по вертикали, их нельзя относить к кучево-дождевым, пока вся вершина или её часть не превратится (табл. 5) либо не начнёт превращаться (табл. 4) в перистую массу.\n\nВерхняя перистообразная часть кучево-дождевого облака может принимать самые разные формы, но иногда она растекается в виде наковальни (табл. 5). Эта интересная разновидность называется #Italic incus#!.\n\n#Italic По материалам Международного атласа облаков, 1930 г.#!"
 MR_NOCTILUCENT_DESCRIPTION_LOC: "#lore Тонкие волокнистые пелены, волнистые узоры или полосы в ночном небе, часто сияющие оттенками от серебристо-белого до электрически-синего. Они становятся видны, когда Солнце уже опустилось глубоко за горизонт.#!"
 MR_NOCTILUCENT_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_high_altitude_balloon_researched_type')] [GetTechnology('curtiss_high_altitude_balloon_tech').GetName]"
 MR_NOCTILUCENT_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetGeographicRegion('curie_geographic_region_noctilucent').GetName]."
 MR_NOCTILUCENT_BONUS_LOC: "Нет"
 MR_NOCTILUCENT_CLOUD: "Серебристые облака напоминают тонкие перистые, но обычно имеют синеватую или серебристую, а иногда оранжевую либо красную окраску. Они резко выделяются на фоне тёмного ночного неба (с. 239).\n\nФизическая природа серебристых облаков всё ещё не выяснена, однако некоторые данные указывают, что они состоят из мельчайшей космической пыли.\n\nДо сих пор светящиеся серебристые облака наблюдались лишь изредка и только летом в северной части средних широт Северного полушария, когда Солнце находится на 5–13 градусов ниже горизонта. Измерения показали, что они располагаются на высоте от 75 до 90 км.\n\n#Italic По материалам Международного атласа облаков, 1990 г.#!"
 MR_NACREOUS_DESCRIPTION_LOC: "#lore Захватывающие дух переливчатые облака линзовидной или волнистой формы, сияющие ослепительными цветами радуги — особенно розовым, пурпурным, голубым и зелёным — перед восходом или после заката.#!"
 MR_NACREOUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_high_altitude_balloon_researched_type')] [GetTechnology('curtiss_high_altitude_balloon_tech').GetName]"
 MR_NACREOUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ Полярный регион."
 MR_NACREOUS_BONUS_LOC: "Нет"
 MR_NACREOUS_CLOUD: "Перламутровые облака, или полярные стратосферные облака (ПСО), напоминают перистые либо линзовидные высококучевые облака (с. 237). Подобно перламутру, они отличаются очень яркой иризацией. Самые великолепные цвета наблюдаются, когда Солнце находится на несколько градусов ниже горизонта.\n\nФизическая природа перламутровых облаков пока не выяснена. Предполагается, что они состоят из очень мелких капель воды или сферических частиц льда.\n\nТакие облака редки. До сих пор их наблюдали главным образом в Шотландии и Скандинавии. Измерения показали, что перламутровые облака над южной Норвегией возникали на высоте от 21 до 30 км.\n\n#Italic По материалам Международного атласа облаков, 1990 г.#!"
