 MR_PHYSICIST_MATHEMATICAL_INNOVATION_BUTTON: "Математические инновации"
 MR_PHYSICIST_MATHEMATICAL_INNOVATION_BUTTON_TT: "#T Математические инновации#!\nЭтот проект доступен, когда [concept_curie_mathematical_physicist] не занят другим заданием.\n\nВаш [concept_curie_physicist] повышает недельный предел инноваций и уменьшает штраф за технологии, опережающие своё время.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_FORMULA_DISCOVERY_BUTTON: "Новая формула"
 MR_PHYSICIST_FORMULA_DISCOVERY_BUTTON_TT: "#T Новая формула#!\nМатематики могут выводить новые формулы, если изучена необходимая технология и ещё остались неисследованные формулы. С каждым новым открытием объём физических данных, которые предстоит обработать, возрастает.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_IMPROVE_MATHEMATICS_BUTTON: "Развитие математики"
 MR_PHYSICIST_IMPROVE_MATHEMATICS_BUTTON_TT: "#T Развитие математики#!\nМатематик может посетить один из объектов «[GetBuildingType('building_university').GetName]», чтобы распространить новые научные стандарты через лекции и семинары.\n\nМодификаторы сооружения:\n$curie_building_throughput_add_modifier_with_tooltip$\n$curie_building_production_mult_modifier_with_tooltip$\n$curie_building_goods_input_mult_modifier_with_tooltip$\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_EXPERIMENT_BUTTON: "Физический эксперимент"
 MR_PHYSICIST_EXPERIMENT_BUTTON_TT: "#T Физический эксперимент#!\nФизик может провести эксперимент, успех которого способен иметь историческое значение. Такой проект доступен физику любой специализации.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_EXPERIMENT_POSSIBLE_TRIGGER_TT: "#default_text В [GetPlayer.GetAltNameNoFlag('RU_CL_PP')] #R отсутствуют#! [Concept('concept_modifier', 'модификаторы')] #V $curie_physics_experiment_successful_modifier$#! и #V $curie_physics_experiment_failure_modifier$#!.#!"
 MR_PHYSICIST_METEOROLOGICAL_OBSERVATION_BUTTON: "Метеорологическое наблюдение"
 MR_PHYSICIST_METEOROLOGICAL_OBSERVATION_BUTTON_TT: "#T Метеорологическое наблюдение#!\nЭтот проект доступен, когда [concept_curie_meteorological_physicist] не занят другим заданием.\n\nВаш [concept_curie_physicist] увеличивает ежегодный объём @curie_physical_data! [Concept('concept_curie_physical_data', 'физических данных')].\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_WEATHER_STATION_EXPANSION_BUTTON: "Расширение метеостанции"
 MR_PHYSICIST_WEATHER_STATION_EXPANSION_BUTTON_TT: "#T Расширение метеостанции#!\nПри наличии обсерватории и необходимой технологии [concept_curie_meteorological_physicist] может расширить действующую там метеостанцию. Это улучшит прогнозы по всей стране и позволит эффективнее справляться с опасными погодными явлениями благодаря своевременным предупреждениям.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 PHYSICIST_HAS_NO_WEATHER_STATION_PM_TT: "#default_text В [GetPlayer.GetAltNameNoFlag('RU_CL_PP')] есть [GetBuildingType('building_verrier_observatory').GetName] с [Concept('concept_production_method', 'методом производства')] #V $pm_curtiss_no_weather_station$#!.#!"
 PHYSICIST_HAS_EARLY_WEATHER_STATION_PM_TT: "#default_text В [GetPlayer.GetAltNameNoFlag('RU_CL_PP')] есть [GetBuildingType('building_verrier_observatory').GetName] с [Concept('concept_production_method', 'методом производства')] #V $pm_curtiss_early_weather_station$#!.#!"
 PHYSICIST_HAS_WEATHER_STATION_PM_TT: "#default_text В [GetPlayer.GetAltNameNoFlag('RU_CL_PP')] есть [GetBuildingType('building_verrier_observatory').GetName] с [Concept('concept_production_method', 'методом производства')] #V $pm_curtiss_weather_station$#!.#!"
 MR_PHYSICIST_IMPROVE_METEOROLOGY_BUTTON: "Сеть метеостанций"
 MR_PHYSICIST_IMPROVE_METEOROLOGY_BUTTON_TT: "#T Сеть метеостанций#!\nРаспространение телеграфа дало метеорологии огромное преимущество: погодные данные со всей страны теперь можно мгновенно передавать и сопоставлять, а затем выпускать прогнозы и предупреждения. [concept_curie_meteorological_physicist] может создать сеть метеостанций в области, где действует сооружение «[GetBuildingType('building_tesla_telegraph').GetName]», чтобы противостоять самым разным погодным явлениям.\n\nМодификаторы сооружения:\n$curie_weather_station_1_modifier_with_tooltip$\n$curie_weather_station_2_modifier_with_tooltip$\n$curie_weather_station_3_modifier_with_tooltip$\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_IMPROVE_METEOROLOGY_TRIGGER_TT: "#default_text Хотя бы у одного сооружения «[GetBuildingType('building_tesla_telegraph').GetName]» уровня 1 или выше не все три [Concept('concept_modifier','$concept_modifiers|q$')] активны.#!"
 MR_PHYSICIST_AGRICULTURAL_WEATHER_SERVICE_BUTTON: "Сельскохозяйственная служба погоды"
 MR_PHYSICIST_AGRICULTURAL_WEATHER_SERVICE_BUTTON_TT: "#T Сельскохозяйственная служба погоды#!\n[concept_curie_meteorological_physicist] может на три года сосредоточиться на прогнозах для сельского хозяйства и организовать службу, предупреждающую фермеров об опасных погодных явлениях. Чем опытнее метеоролог, тем лучше будет результат.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_ADVANCED_WEATHER_STATION_TRIGGER_TT: "#default_text В [GetPlayer.GetAltNameNoFlag('RU_CL_PP')] есть [GetBuildingType('building_verrier_observatory').GetName] с [Concept('concept_production_method', 'методом производства')] #V $pm_curtiss_weather_station$#! или $pm_curtiss_modern_weather_station$.#!"
 MR_PHYSICIST_50_OR_MORE_EXPERIENCE_TRIGGER_TT: "#default_text [concept_curie_meteorological_physicist] имеет #V не менее 50#! [Concept('concept_academics_experience', 'единиц опыта')].#!"
 MR_PHYSICIST_MARINE_WEATHER_SERVICE_BUTTON: "Морской прогноз"
 MR_PHYSICIST_MARINE_WEATHER_SERVICE_BUTTON_TT: "#T Морской прогноз#!\n[concept_curie_meteorological_physicist] может сосредоточиться на прогнозах для флота и предупреждать моряков об опасностях на море. Проект продлится три года. Чем опытнее метеоролог, тем лучше будет результат.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_5_FLOTILLAS_TRIGGER_TT: "#default_text В [GetPlayer.GetAltNameNoFlag('RU_CL_PP')] есть #V не менее 5 кораблей#!.#!"
 MR_PHYSICIST_FOUND_MAGNETIC_ASSOCIATION_BUTTON: "Магнитный союз"
 MR_PHYSICIST_FOUND_MAGNETIC_ASSOCIATION_BUTTON_TT: "#T Учредить Магнитный союз#!\nМеждународный Магнитный союз даст своему основателю особые преимущества при сборе физических данных и небольшой бонус к технологиям. Он также откроет производственный метод «Геомагнитная обсерватория».\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_MAGNETIC_RESEARCH_STATION_BUTTON: "Геомагнитная обсерватория"
 MR_PHYSICIST_MAGNETIC_RESEARCH_STATION_BUTTON_TT: "#T Построить геомагнитную обсерваторию#!\nМы можем расширить нашу обсерваторию геомагнитным отделением, чтобы подробнее исследовать магнитное поле Земли. Для этого необходимо вступить в Магнитный союз.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_NO_MAGNETIC_OBSERVATORY_TRIGGER_TT: "#default_text В [GetPlayer.GetAltNameNoFlag('RU_CL_PP')] есть [GetBuildingType('building_verrier_observatory').GetName] с [Concept('concept_production_method', 'методом производства')] #V «Без геомагнитной обсерватории»#!.#!"
