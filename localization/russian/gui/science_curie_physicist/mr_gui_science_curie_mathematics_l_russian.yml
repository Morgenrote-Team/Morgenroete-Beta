 CURIE_EXPERIMENT_ITEM_NAME: "#underline Эксперимент: [Scope.Var('name').GetFlagName]#!"
 CURIE_EXPERIMENT_ITEM_TOOLTIP: "[Scope.Var('tooltip').GetFlagName]"
 CURIE_EXPERIMENT_ITEM_COUNTRY: "[Scope.Var('discovering_country').GetCountryDefinition.GetName]"
 CURIE_EXPERIMENT_ITEM_INVENTOR: "[Scope.Var('discoverer').GetFlagName]"
 CURIE_EXPERIMENT_ITEM_YEAR: "[Scope.Var('year').GetValue]"
 CURIE_EXPERIMENT_YOUNG_NAME: "$mr_young$"
 CURIE_EXPERIMENT_ORSTED_NAME: "$mr_orsted$"
 CURIE_EXPERIMENT_YOUNG_TT: "Исследователь: [Scope.Var('discoverer').GetFlagName]. Год: [Scope.Var('year').GetValue].\n\nВ ходе опыта свет пропустили через две узкие щели на экран. Возникшая картина из чередующихся светлых и тёмных полос доказала волновую природу света и опровергла господствовавшую корпускулярную теорию Исаака Ньютона."
 CURIE_EXPERIMENT_ORSTED_TT: "Исследователь: [Scope.Var('discoverer').GetFlagName]. Год: [Scope.Var('year').GetValue].\n\nВ ходе опыта провод с током расположили над магнитным компасом. Отклонение стрелки доказало, что электрический ток создаёт магнитное поле, и положило начало единой теории электромагнетизма."
 CURIE_EXPERIMENT_JOULES_TT: "Исследователь: [Scope.Var('discoverer').GetFlagName]. Год: [Scope.Var('year').GetValue].\n\nВ ходе опыта падающие грузы вращали лопасти в теплоизолированном сосуде с водой. Повышение температуры показало, что механическая работа непосредственно превращается в тепло, и подтвердило закон сохранения энергии."
 CURIE_EXPERIMENT_DOPPLER_TT: "Исследователь: [Scope.Var('discoverer').GetFlagName]. Год: [Scope.Var('year').GetValue].\n\nТеорию Доплера проверили с помощью трубачей в движущемся поезде. Изменение высоты звука при прохождении поезда подтвердило эффект Доплера и доказало, что движение меняет частоту звуковых волн."
 CURIE_EXPERIMENT_FOUCAULT_TT: "Исследователь: [Scope.Var('discoverer').GetFlagName]. Год: [Scope.Var('year').GetValue].\n\nВ ходе опыта тяжёлый маятник подвесили на длинной проволоке. Постепенный поворот плоскости его колебаний относительно пола стал наглядным доказательством вращения Земли вокруг своей оси, не зависящим от астрономических наблюдений."
 CURIE_EXPERIMENT_FIZEAU_TT: "Исследователь: [Scope.Var('discoverer').GetFlagName]. Год: [Scope.Var('year').GetValue].\n\nВ ходе опыта свет направили через вращающееся зубчатое колесо к удалённому зеркалу. По исчезновению возвращённого луча при известных скоростях вращения впервые удалось измерить скорость света в земных условиях."
 CURIE_EXPERIMENT_WEBER_TT: "Исследователь: [Scope.Var('discoverer').GetFlagName]. Год: [Scope.Var('year').GetValue].\n\nВ ходе опыта электрический заряд измерили с помощью лейденской банки и гальванометра. Отношение электростатической и электромагнитной единиц оказалось равно скорости света, что доказало электромагнитную природу света."
 CURIE_EXPERIMENT_MICHELSON_TT: "Исследователь: [Scope.Var('discoverer').GetFlagName]. Год: [Scope.Var('year').GetValue].\n\nВ ходе опыта свет разделили на два взаимно перпендикулярных пути с помощью чувствительного интерферометра. Отсутствие ожидаемого смещения интерференционных полос опровергло существование светоносного эфира и подготовило почву для специальной теории относительности."
 CURIE_EXPERIMENT_HERTZ_TT: "Исследователь: [Scope.Var('discoverer').GetFlagName]. Год: [Scope.Var('year').GetValue].\n\nС помощью искровых контуров получили и обнаружили невидимые радиоволны. Оказалось, что они распространяются со скоростью света и обладают теми же волновыми свойствами. Это подтвердило электромагнитную теорию Максвелла и открыло путь к беспроводной связи."
 CURIE_EXPERIMENT_THOMSON_TT: "Исследователь: [Scope.Var('discoverer').GetFlagName]. Год: [Scope.Var('year').GetValue].\n\nВ ходе опыта катодные лучи отклонили электрическим и магнитным полями в вакуумной трубке. Измерение отношения заряда к массе выявило отрицательно заряженные субатомные частицы — электроны — и опровергло представление о неделимости атома."
 CURIE_EXPERIMENT_MILIKAN_TT: "Исследователь: [Scope.Var('discoverer').GetFlagName]. Год: [Scope.Var('year').GetValue].\n\nВ ходе опыта электрически заряженные капли масла удерживали между двумя металлическими пластинами. Уравновешивание силы тяжести электрической силой доказало дискретность электрического заряда и позволило точно определить заряд электрона."
 CURIE_EXPERIMENT_RUTHERFORD_TT: "Исследователь: [Scope.Var('discoverer').GetFlagName]. Год: [Scope.Var('year').GetValue].\n\nВ ходе опыта альфа-частицы направили на тонкую золотую фольгу. Неожиданные отклонения на большие углы доказали, что масса атома и его положительный заряд сосредоточены в крошечном ядре, и опровергли модель однородного атома."
 CURIE_EXPERIMENT_FRANCK_TT: "Исследователь: [Scope.Var('discoverer').GetFlagName]. Год: [Scope.Var('year').GetValue].\n\nВ ходе опыта ускоренные электроны пропустили через пары ртути. Периодические падения тока при определённых напряжениях доказали, что атомы поглощают энергию отдельными квантами, и подтвердили боровскую модель квантованных энергетических уровней."
 CURIE_EXPERIMENT_EDDINGTON_TT: "Исследователь: [Scope.Var('discoverer').GetFlagName]. Год: [Scope.Var('year').GetValue].\n\nВо время полного затмения сфотографировали звёзды рядом с Солнцем. Наблюдаемое искривление света звёзд под действием тяготения стало первым экспериментальным подтверждением общей теории относительности."
 CURIE_EXPERIMENT_STERN_TT: "Исследователь: [Scope.Var('discoverer').GetFlagName]. Год: [Scope.Var('year').GetValue].\n\nВ ходе опыта атомы серебра направили через неоднородное магнитное поле. Вместо непрерывного распределения пучок разделился на два отдельных потока, что доказало пространственное квантование и выявило собственный квантовый спин."
