l_russian:
 MR_AUTOMATE_CHEMIST_TT: "#T Автоматизация действий [Concept('concept_mendelejew_chemist', '#b #ORANGE химика#!#!')]#!\nЕсли вы включите автоматизацию, вам больше не придётся давать задания своему химику.\nОн будет работать самостоятельно и выполнять наиболее целесообразные в данный момент задачи. Тем не менее вы по-прежнему будете получать некоторые события."
 mr_chemistry_automation_gui_tt: "Начать автоматизацию задач [Concept('concept_mendelejew_chemist', '#b #ORANGE химика#!#!')]."
 mr_stop_chemistry_automation_gui_tt: "Остановить автоматизацию задач [Concept('concept_mendelejew_chemist', '#b #ORANGE химика#!#!')]."
 MR_STOP_AUTOMATE_CHEMIST_TT: "#T Остановить автоматизацию действий [Concept('concept_mendelejew_chemist', '#b #ORANGE химика#!#!')]#!\nДействия вашего химика больше не будут автоматизированы."
 MR_CHEMIST_RANKING_BUTTON: "Химики"
 MR_RANKING_BY_CHEMIST: "Показать рейтинг всех [Concept('concept_mendelejew_chemist', '#b #ORANGE химиков#!#!')] в мире."
 CHEMIST_CHEMIST_RANKING_HEADER: "Рейтинг [Concept('concept_mendelejew_chemist', '#b #ORANGE химиков#!#!')] мира по [Concept('concept_academics_experience', 'опыту')]"
 MR_CHEMIST_DDT_BUTTON: "ДДТ"
 MR_CHEMIST_DDT_BUTTON_TT: "#T ДДТ#!\nДо сих пор пестициды отличались высокой токсичностью — из-за добавления свинца или мышьяка — и потому вредили здоровью людей. Однако синтетическое средство борьбы с вредителями способно совершить переворот в сельском хозяйстве. Поручите своему [Concept('concept_mendelejew_chemist', '#b #ORANGE химику#!#!')] попытаться создать его.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_CHEMIST_HAS_IMPROVED_FERTILIZER_TRIGGER_TT: "#default_text Хотя бы одно сооружение «[GetBuildingType('building_chemical_plant').GetName]» не ниже 1-го уровня обладает всеми тремя [Concept('concept_modifier', 'модификаторами')].#!"