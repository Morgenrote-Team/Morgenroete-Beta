l_russian:
 MR_AUTOMATE_CHEMIST_TT: "#T Автоматизация действий [Concept('concept_mendelejew_chemist', '#b #ORANGE химика#!#!')]#!\nЕсли вы включите автоматизацию, вам больше не придётся давать задания своему химику.\nОн будет работать самостоятельно и выполнять наиболее целесообразные в данный момент задачи. Тем не менее вы по-прежнему будете получать некоторые события."
 mr_chemistry_automation_gui_tt: "Начать автоматизацию задач [Concept('concept_mendelejew_chemist', '#b #ORANGE химика#!#!')]."
 mr_stop_chemistry_automation_gui_tt: "Остановить автоматизацию задач [Concept('concept_mendelejew_chemist', '#b #ORANGE химика#!#!')]."
 MR_STOP_AUTOMATE_CHEMIST_TT: "#T Остановить автоматизацию действий [Concept('concept_mendelejew_chemist', '#b #ORANGE химика#!#!')]#!\nДействия вашего химика больше не будут автоматизированы."
 MR_CHEMIST_RANKING_BUTTON: "Химики"
 MR_RANKING_BY_CHEMIST: "Show Ranking of all the [Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists|q$')] in the world."
 CHEMIST_CHEMIST_RANKING_HEADER: "#V [Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists|q$')] of the World ranked by [concept_academics_experience]"
 MR_CHEMIST_DDT_BUTTON: "DDT"
 MR_CHEMIST_DDT_BUTTON_TT: "#T DDT#!\nUntil now, pesticides have proven to be highly toxic—due to the addition of lead or arsenic—and thus detrimental to human health. A synthetic pest control agent, however, could revolutionize agriculture. Let your [concept_mendelejew_chemist] try to create it.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_CHEMIST_HAS_IMPROVED_FERTILIZER_TRIGGER_TT: "#default_text At least one [GetBuildingType('building_chemical_plant').GetName] Factory of level 1 or higher has all three [Concept('concept_modifier','$concept_modifiers|q$')].#!"