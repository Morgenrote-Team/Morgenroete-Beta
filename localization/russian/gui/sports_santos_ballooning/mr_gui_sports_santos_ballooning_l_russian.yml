 MR_STOP_AUTOMATE_BALLOONIST_TT: "#T Отключить автоматизацию работы аэронавта#!\n[concept_santos_balloonist] больше не будет самостоятельно выбирать задачи."
 MR_AUTOMATE_BALLOONIST_TT: "#T Автоматизировать работу аэронавта#!\nВам больше не придётся давать задания: [concept_santos_balloonist] будет работать самостоятельно и выбирать наиболее уместные на данный момент задачи. Некоторые события по-прежнему будут появляться."
 MR_BALLOONIST_STRATOSPHERIC_FLIGHT_BUTTON: "Stratospheric Flight"
 MR_BALLOONIST_STRATOSPHERIC_FLIGHT_BUTTON_TT: "#T Stratospheric Flight#!\nHow high can a person go in a balloon? Thanks to the revolutionary invention of a pressurized capsule, an extraordinary—and dangerous—experiment might be possible.\n#R Note:#! During the first stratospheric flight, a [concept_curie_meteorological_physicist] is needed to build and modify the stratospheric balloon. After the first flight, the balloonist can fly without a meteorologist.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
