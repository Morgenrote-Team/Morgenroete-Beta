 MR_BALLOON_TIME_RECORD: "#V Последний результат:#! [Scope.Var('santos_balloon_time_record_personal_var').GetValue|0] ч"
 MR_COAL_GAS_BAR: "Светильный газ"
 MR_COAL_GAS_BAR_TT: "В этом шаре используется #V светильный газ#!."
 MR_HYDROGEN_BAR: "Водород"
 MR_HYDROGEN_BAR_TT: "В этом шаре используется #V водород#!."
 MR_BALLOONIST_CHANGE_TYPE_BUTTON: "Изменить тип"
 MR_BALLOONIST_CHANGE_TYPE_BUTTON_TT: "Специализированные шары дают небольшое преимущество по одному показателю — высоте, дальности или продолжительности полёта — за счёт ухудшения остальных. Универсальный шар не имеет ни преимуществ, ни недостатков."
 MR_HEADER_MODIFICATIONS: "Модификации"
 MR_BALLOONIST_MODIFICATION_POSSIBLE_TRIGGER_TT: "#default_text В [GetPlayer.GetAltNameNoFlag('RU_CL_PP')] сейчас не ведётся переоборудование воздушного шара.#!"
 MR_BALLOONIST_HYDROGEN_FACTORY_TRIGGER_TT: "#default_text В [GetPlayer.GetAltNameNoFlag('RU_CL_PP')] есть хотя бы одно сооружение типа «[GetBuildingType('building_explosives_factory').GetName]», использующее [Concept('concept_production_method', 'производственный метод')] «$pm_brine_electrolysis$».#!"
 MR_BALLOONIST_COAL_GAS_BUTTON: "Использовать светильный газ"
 MR_BALLOONIST_COAL_GAS_BUTTON_TT: "#T Использовать светильный газ#!\nСветильный газ широко доступен. На заре воздухоплавания его было вполне достаточно для рекордов дальности и скорости, но возможности подъёма на большую высоту с ним существенно ограничены.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_HYDROGEN_BUTTON: "Использовать водород"
 MR_BALLOONIST_HYDROGEN_BUTTON_TT: "#T Использовать водород#!\nВодород применялся уже на заре воздухоплавания и позволил установить поразительные рекорды высоты. Это, без преувеличения, лучший газ для высотных полётов. Однако его производство требует больших затрат средств и труда.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 santos_set_balloon_type_altitude_effect_tt: "Переоборудовать шар в #V высотный шар#!. Работы займут #YELLOW шесть месяцев#!."
 santos_set_balloon_type_distance_effect_tt: "Переоборудовать шар в #V шар для дальних полётов#!. Работы займут #YELLOW шесть месяцев#!."
 santos_set_balloon_type_time_effect_tt: "Переоборудовать шар в #V шар для длительных полётов#!. Работы займут #YELLOW шесть месяцев#!."
