 MR_BALLOONIST_BALLOON_RIDE_BUTTON: "Прогулки на воздушном шаре"
 MR_BALLOONIST_BALLOON_RIDE_BUTTON_TT: "#T Прогулки на воздушном шаре#!\nРазвлекательные полёты для публики — стандартное и самое безопасное, хотя и несколько скучное занятие [Concept('concept_santos_balloonist', 'аэронавта')]. Оно позволяет устраивать полёты как аттракцион при некоторых сооружениях и немного ускоряет исследование технологий воздухоплавания.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_BALLOON_ADVENTURE_BUTTON: "Воздушное приключение"
 MR_BALLOONIST_BALLOON_ADVENTURE_BUTTON_TT: "#T Воздушное приключение#!\n[concept_santos_balloonist] может отправиться навстречу приключениям за пределами нашей страны. За долгие месяцы путешествия он посетит множество стран и, возможно, привезёт какие-нибудь сувениры. Есть небольшая вероятность его гибели в пути.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_BALLOON_RECORD_BUTTON: "Рекордный полёт"
 MR_BALLOONIST_BALLOON_RECORD_BUTTON_TT: "#T Рекордный полёт#!\n[concept_santos_balloonist] может устанавливать рекорды высоты, дальности и продолжительности полёта, если его собственных возможностей достаточно, чтобы побить мировые рекорды. Есть умеренная вероятность гибели при попытке установить рекорд.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_BALLOON_CROSSING_BUTTON: "Перелёт на воздушном шаре"
 MR_BALLOONIST_BALLOON_CROSSING_BUTTON_TT: "#T Перелёт на воздушном шаре#!\n[concept_santos_balloonist] может пересекать опасные проливы и горные хребты. Такой подвиг считается высшим испытанием для любого искателя приключений. Есть значительная вероятность гибели при попытке перелёта.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_FIRE_BALLOONIST_TRIGGER_TT: "#default_text В [GetPlayer.GetAltNameNoFlag('RU_CL_PP')] #R не#! действует [concept_modifier] «#V $santos_balloon_contract_modifier$#!».#!"
 SANTOS_CROSSING_ITEM_TOOLTIP: "[Scope.Var('tooltip').GetFlagName]"
 SANTOS_CROSSING_ACHIEVED_MARK: "@green_checkmark!"
 SANTOS_CROSSING_CHANNEL_TT: "Ла-Манш — классический короткий морской маршрут протяжённостью около 35–50 километров. Главную опасность представляют непредсказуемые прибрежные ветры и внезапный снос в открытый Атлантический океан. Тем не менее ещё со времён Бланшара и Грина этот пролив служит испытательным полигоном для первых полётов."
 SANTOS_CROSSING_ALPS_TT: "Альпы — чрезвычайно трудное высотное препятствие. Для их пересечения нужен рабочий потолок 5500–6000 метров, что создаёт серьёзный риск кислородного голодания, и дальность полёта 400–600 километров. Сильные горные волны и нисходящие потоки могут бросить шар на отвесные скалы. Первым эти опасности преодолел Франсиск Арбан в 1849 году."
 SANTOS_CROSSING_SKAGERRAK_TT: "Перелёт через этот пролив между Данией и Скандинавским полуостровом проходит над открытой водой на протяжении 80–130 километров. Для него нужны крейсерская высота 2000 метров и запас дальности 400 километров. Аэронавтам угрожают внезапные штормы Северного моря, сильный холод и негостеприимные берега. Необходимы газонепроницаемая оболочка и точный учёт ветров."
 SANTOS_CROSSING_MEDITERRANEAN_TT: "Этот обширный морской бассейн с гористыми островами, такими как Корсика и Сицилия, требует крейсерской высоты 4000 метров для преодоления островных вершин и дальности полёта 700 километров. Интенсивное солнечное излучение сильно расширяет газ, а невозможность пользоваться гайдропом над водой требует тщательно расходовать балласт."
 SANTOS_CROSSING_RIO_TT: "Пересечение этого огромного эстуария между Аргентиной и Уругваем, где ширина открытой воды достигает 220 километров, требует крейсерской высоты 3000 метров и дальности полёта 300 километров. Основные опасности — внезапные шквалы, известные как памперо, и сильная термическая турбулентность над водой."
 SANTOS_CROSSING_PYRENEES_TT: "Пиренеи образуют горный барьер между Францией и Испанией. Для безопасного перелёта нужны высота не менее 5000 метров и дальность 500 километров. За вершинами высотой более 3000 метров возникают мощные нисходящие потоки, поэтому необходим значительный запас высоты, чтобы избежать гибельного падения."
 SANTOS_CROSSING_ANDES_TT: "Анды — самое серьёзное препятствие для воздухоплавателей. Их пересечение требует исключительной высоты полёта — 8000 метров — и дальности 800 километров. Без герметичного оборудования аэронавтам угрожает смертельно опасная нехватка кислорода, а также лютый холод и ураганные горные ветры."
 SANTOS_CROSSING_KOREA_TT: "Этот маршрут соединяет Корею и Японию через 180–200 километров моря. Для него нужны высота 2500 метров и запас дальности 250 километров. Промежуточные острова, такие как Цусима, помогают ориентироваться, но главными опасностями остаются переменчивые муссоны и риск сноса в открытый Тихий океан."
 SANTOS_CROSSING_BAB_TT: "В этом узком южном проходе Красного моря предстоит преодолеть лишь 30–40 километров открытой воды, однако соседние прибрежные хребты требуют высоты 4000 метров, а необходимый запас дальности составляет 400 километров. Сильная тропическая жара резко меняет состояние газа в оболочке; к этому добавляются мощные восходящие потоки над пустыней и непредсказуемые нисходящие ветры."
 SANTOS_KOREA_CROSSING_TT: "#default_text Маршрут «#V Корейский пролив#!» считается #G лёгким#!.\n\n$santos_balloon_crossing_korea_possible_trigger_tt$#!"
 SANTOS_BAB_CROSSING_TT: "#default_text Маршрут «#V Баб-эль-Мандеб#!» считается #YELLOW средним по сложности#!.\n\n$santos_balloon_crossing_bab_possible_trigger_tt$#!"
