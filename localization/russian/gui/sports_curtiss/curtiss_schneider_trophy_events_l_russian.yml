l_russian:
 curtiss_schneider_trophy_event_mechanical_problems_icon_flag: "@curtiss_event_log_negative_mechanical_problems_icon!"
 curtiss_schneider_trophy_event_mechanical_problems_title_flag: "Механические неполадки"
 curtiss_schneider_trophy_event_mechanical_problems_flag: "#t $curtiss_schneider_trophy_event_mechanical_problems_title_flag$#!\n$curtiss.121.d$"
 curtiss_schneider_trophy_event_crash_icon_flag: "@curtiss_event_log_negative_crash_icon!"
 curtiss_schneider_trophy_event_crash_title_flag: "Крушение самолёта"
 curtiss_schneider_trophy_event_crash_flag: "#t $curtiss_schneider_trophy_event_crash_title_flag$#!\nВо время манёвра была переоценена допустимая нагрузка, и самолёт рухнул в воду!"
 curtiss_schneider_trophy_event_buoy_icon_flag: "@curtiss_event_log_negative_buoy_icon!"
 curtiss_schneider_trophy_event_buoy_title_flag: "Пропущен буй"
 curtiss_schneider_trophy_event_buoy_flag: "#t $curtiss_schneider_trophy_event_buoy_title_flag$#!\nКоманда хорошо прошла круг в гонке за Кубок Шнейдера, но ей грозит снятие очков из-за жалобы одного из судей на пропущенный буй."
 curtiss_schneider_trophy_event_maximum_speed_icon_flag: "@curtiss_event_log_positive_speed_icon!"
 curtiss_schneider_trophy_event_maximum_speed_title_flag: "Максимальная скорость"
 curtiss_schneider_trophy_event_maximum_speed_flag: "#t $curtiss_schneider_trophy_event_maximum_speed_title_flag$#!\nНа трассе самолёт показал свою максимальную скорость."
 curtiss_schneider_trophy_event_slalom_icon_flag: "@curtiss_event_log_positive_slalom_icon!"
 curtiss_schneider_trophy_event_slalom_title_flag: "Слалом"
 curtiss_schneider_trophy_event_slalom_flag: "#t $curtiss_schneider_trophy_event_slalom_title_flag$#!\nКубок Шнейдера прежде всего известен как скоростное соревнование, но на трассе были три-четыре отметки, которые легко пропустить на большой скорости и тем самым заработать дисквалификацию. Умелый слалом позволил пройти их все."
 curtiss_schneider_trophy_event_fog_neutral_icon_flag: "@curtiss_event_log_fog_neutral_icon!"
 curtiss_schneider_trophy_event_fog_positive_icon_flag: "@curtiss_event_log_fog_positive_icon!"
 curtiss_schneider_trophy_event_fog_title_flag: "Туман"
 curtiss_schneider_trophy_event_fog_neutral_flag: "#t $curtiss_schneider_trophy_event_fog_title_flag$#!\nFog was more often a problem on the waterways. Even experienced pilots could fail at this sudden challenge. This time the pilot barely made it through."
 curtiss_schneider_trophy_event_fog_positive_flag: "#t $curtiss_schneider_trophy_event_fog_title_flag$#!\nНад водными трассами туман часто становился серьёзной проблемой. Даже опытным пилотам не всегда удавалось справиться с этой внезапной опасностью. На этот раз участок пройден без проблем."
 curtiss_schneider_trophy_event_superior_flight_performance_icon_flag: "@curtiss_event_log_superior_flight_performance_positive_icon!"
 curtiss_schneider_trophy_event_superior_flight_performance_title_flag: "Превосходное лётное мастерство"
 curtiss_schneider_trophy_event_superior_flight_performance_flag: "#t $curtiss_schneider_trophy_event_superior_flight_performance_title_flag$#!\nПревосходное лётное мастерство значительно повысило шансы на победу в Кубке Шнейдера!"
 curtiss_schneider_trophy_event_duel_positive_icon_flag: "@curtiss_event_log_duel_positive_icon!"
 curtiss_schneider_trophy_event_duel_title_positive_flag: "Дуэль: победа"
 curtiss_schneider_trophy_event_duel_positive_flag: "#t $curtiss_schneider_trophy_event_duel_title_positive_flag$#!\nВ борьбе за самый быстрый круг два самолёта опасно сблизились. Точный манёвр улучшил положение нашей команды и помешал прямому сопернику."
 curtiss_schneider_trophy_event_duel_negative_icon_flag: "@curtiss_event_log_duel_negative_icon!"
 curtiss_schneider_trophy_event_duel_title_negative_flag: "Дуэль: поражение"
 curtiss_schneider_trophy_event_duel_negative_flag: "#t $curtiss_schneider_trophy_event_duel_title_negative_flag$#!\nIn the race for the fastest lap, two pilots came dangerously close. With a targeted maneuver the pilot tried to improve the chances of victory but failed miserably."
 curtiss_schneider_trophy_event_rivalry_icon_positive_flag: "@curtiss_event_log_rivalry_positive_icon!"
 curtiss_schneider_trophy_event_rivalry_title_positive_flag: "Соперничество: победа"
 curtiss_schneider_trophy_event_rivalry_positive_flag: "#t $curtiss_schneider_trophy_event_rivalry_title_positive_flag$#!\nМежду участниками Кубка Шнейдера оставались старые счёты. Дерзкий манёвр выбил ненавистного соперника из гонки!"
 curtiss_schneider_trophy_event_rivalry_icon_negative_flag: "@curtiss_event_log_rivalry_negative_icon!"
 curtiss_schneider_trophy_event_rivalry_title_negative_flag: "Соперничество: поражение"
 curtiss_schneider_trophy_event_rivalry_negative_flag: "#t $curtiss_schneider_trophy_event_rivalry_title_negative_flag$#!\nМежду участниками Кубка Шнейдера оставались старые счёты. Попытка выбить ненавистного соперника из гонки дерзким манёвром не удалась."
 curtiss_schneider_trophy_event_rivalry_fly_ahead_icon_flag: "@curtiss_event_log_fly_ahead_positive_icon!"
 curtiss_schneider_trophy_event_rivalry_fly_ahead_title_flag: "Соперничество: рывок вперёд"
 curtiss_schneider_trophy_event_rivalry_fly_ahead_flag: "#t $curtiss_schneider_trophy_event_rivalry_fly_ahead_title_flag$#!\nМежду участниками Кубка Шнейдера оставались старые счёты, но на этот раз провокации были проигнорированы, и наш самолёт вырвался вперёд."
 curtiss_schneider_trophy_event_rivalry_title_positive_opponent_flag: "Соперничество: соперник побеждён"
 curtiss_schneider_trophy_event_rivalry_positive_opponent_flag: "#t $curtiss_schneider_trophy_event_rivalry_title_positive_opponent_flag$#!\nДругая команда попыталась свести счёты с нашей, но потерпела поражение."
 curtiss_schneider_trophy_event_favorable_conditions_icon_flag: "@curtiss_event_log_favorable_conditions_positive_icon!"
 curtiss_schneider_trophy_event_favorable_conditions_title_flag: "Благоприятные условия"
 curtiss_schneider_trophy_event_favorable_conditions_flag: "#t $curtiss_schneider_trophy_event_favorable_conditions_title_flag$#!\nХорошая погода повысила шансы на победу."
 curtiss_schneider_trophy_event_team_member_ill_icon_flag: "@curtiss_event_log_team_member_ill_negative_icon!"
 curtiss_schneider_trophy_event_team_member_ill_title_flag: "Участник команды заболел"
 curtiss_schneider_trophy_event_team_member_ill_flag: "#t $curtiss_schneider_trophy_event_team_member_ill_title_flag$#!\nНезадолго до гонки болезнь вывела из строя одного из пилотов команды Кубка Шнейдера."
 curtiss_schneider_trophy_event_strange_engine_failure_icon_flag: "@curtiss_event_log_strange_engine_failure_negative_icon!"
 curtiss_schneider_trophy_event_strange_engine_failure_title_flag: "Странная поломка двигателя"
 curtiss_schneider_trophy_event_strange_engine_failure_flag: "#t $curtiss_schneider_trophy_event_strange_engine_failure_title_flag$#!\nСтранная поломка двигателя поставила инженеров в тупик."
 curtiss_schneider_trophy_event_sabotage_prevented_icon_flag: "@curtiss_event_log_sabotage_prevented_positive_icon!"
 curtiss_schneider_trophy_event_sabotage_prevented_title_flag: "Саботаж предотвращён!"
 curtiss_schneider_trophy_event_sabotage_prevented_flag: "#t $curtiss_schneider_trophy_event_sabotage_prevented_title_flag$#!\nПопытка другого участника гонки устроить саботаж была предотвращена в последний момент."
 curtiss_schneider_trophy_event_sabotage_discovered_icon_flag: "@curtiss_event_log_sabotage_prevented_negative_icon!"
 curtiss_schneider_trophy_event_sabotage_discovered_title_flag: "Саботаж раскрыт!"
 curtiss_schneider_trophy_event_sabotage_discovered_flag: "#t $curtiss_schneider_trophy_event_sabotage_discovered_title_flag$#!\nThe sabotage attempt of this country was discovered causing them to be shunned by the other participants."