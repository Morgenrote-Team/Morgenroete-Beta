 concept_tesla_engineering: "Mühendislik"
 concept_tesla_engineering_desc: "#b Mühendislik#!, [concept_morgenroete] içindeki ana özelliklerden biridir.\n\n#b Mühendisliğe#! erişmek için bir [concept_tesla_engineer] sahibi olmanız gerekir. #b Mühendisler#! uzmanlıklarına bağlı olarak #b Mühendislik Projeleri#! başlatabilir. Beş farklı uzmanlaşmış #b Mühendis#! vardır:\n- [concept_tesla_civil_engineer], bir ülkenin altyapısını geliştirmeye odaklanır.\n- [concept_tesla_mechanical_engineer], örneğin sanayiye fayda sağlayan mekanik icatlara odaklanır.\n- [concept_tesla_military_engineer], bir ülkenin ordusunu ve donanmasını geliştirmeye odaklanır.\n- [concept_tesla_electrical_engineer], bir ülkenin elektrik altyapısını geliştirmeye odaklanır.\n- [concept_tesla_aeronautical_engineer], insanlı uçuşu mümkün kılmaya ve uçaklar ile diğer hava araçlarını geliştirmeye odaklanır."
 concept_tesla_engineer_desc: "#b #ORANGE Mühendisler#!#!, uzmanlıklarıyla özel binaların inşasına yardımcı olan Akademisyenlerdir.\nAyrıca #b #ORANGE Mühendisler#!#!, ülkenizin [concept_technology_spread] değerine bonus sağlar. Bonusun miktarı, sizden daha fazla teknoloji araştırmış kaç ülke olduğuna bağlıdır."
 concept_tesla_civil_engineer_desc: "#b İnşaat Mühendisleri#!, bir ülkenin altyapısını geliştirmeye odaklanır.\n[concept_infrastructure] değerini artıran [Concept('concept_modifier','$concept_modifiers$')] eklemek, #b İnşaat Sektörlerinizi#! geliştirmek veya [Concept('concept_technology', '$concept_technologies$')] araştırmak için #b Mühendislik Projeleri#! başlatabilirler."
 concept_tesla_mechanical_engineer_desc: "#b Makine Mühendisleri#!, sanayiyi, makineleri veya nüfusunuzun yaşamını iyileştiren mekanik yeniliklere odaklanır.\n[concept_throughput], [concept_good_production] ve [concept_input_mult] değerlerini iyileştiren [Concept('concept_modifier','$concept_modifiers$')] eklemek, yeni lokomotiflerle #b Demiryollarınızı#! geliştirmek veya sanayi [Concept('concept_technology', '$concept_technologies$')] teknolojilerini araştırmak için #b Mühendislik Projeleri#! başlatabilirler."
 concept_tesla_military_engineer_desc: "#b Askerî Mühendisler#!, yeni yenilikler uygulayarak ordumuzu ve donanmamızı geliştirmeye odaklanır.\nSilahlar, yeni saha tahkimatları ve daha iyi tanklar icat ederek yeni [Concept('concept_mobilization_option','$concept_mobilization_options$')] kazanmak veya askerî ya da denizcilik [Concept('concept_technology', '$concept_technologies$')] teknolojilerini araştırmak için #b Mühendislik Projeleri#! başlatabilirler."
 concept_tesla_electrical_engineer_desc: "#b Elektrik Mühendisleri#!, elektrik alanındaki yeniliklerle ülkenizi geliştirmeye odaklanır.\nDünya'nın jeomanyetik alanını araştırmak, telgraf veya radyo ağları kurmak ya da elektrik [Concept('concept_technology', '$concept_technologies$')] teknolojilerini araştırmak için #b Mühendislik Projeleri#! başlatabilirler."
 concept_tesla_aeronautical_engineer_desc: "#b Havacılık Mühendisleri#!, uçuş yöntemleri geliştirmeye ve uçaklar ile Zeplinleri iyileştirmeye odaklanır.\n[concept_throughput], [concept_good_production] ve [concept_input_mult] değerlerini iyileştiren [Concept('concept_modifier','$concept_modifiers$')] eklemek, #V Gelişmiş Uçaklar#!ı [Concept('concept_mobilization_option','$concept_mobilization_options$')] olarak açmak veya havacılık [Concept('concept_technology', '$concept_technologies$')] teknolojilerini araştırmak için #b Mühendislik Projeleri#! başlatabilirler."
 concept_vikelas_national_sport: "Ulusal Spor"
 concept_vikelas_national_sport_desc: "Her ülke aşağıdaki sporlardan birini ulusal sporu ilan edebilir: kriket, beyzbol, futbol veya basketbol. Bu dört sporun üçü (kriket hariç) yalnızca 19. yüzyılda icat edildi. Bir sporu ilk icat eden ülke, o sporun 'ana ülkesi' kabul edilir. Bu noktadan itibaren sporlar dünya çapında yayılır, ancak aynı koşullar altında değil: kriket ve beyzbolun yayılması daha sınırlıyken futbol ve basketbol daha az sıkı koşullara tabidir. İlişkileri geliştirmek için sporlar bir hükümdar tarafından tabi devletler arasında yayılabilir. Bir ülke içinde farklı sporlar bir arada bulunabilir, ancak ülke genelinde her spor tesisinde yayılmaları için ulusal spor olmaları gerekir."
 concept_theiler_microorganism: "Mikroorganizma"
 concept_theiler_microorganisms: "Mikroorganizmalar"
 concept_theiler_microorganism_desc: "Mikroorganizmalar, bakteriler, virüsler ve tek hücreli organizmalar gibi küçük canlılardır.\nBir [concept_theiler_biologist], Biyologların boş olduklarında yürüttüğü $je_theiler_microorganism_research$ [concept_journal_entry] aracılığıyla Mikroorganizmaları keşfedebilir.\nMikroorganizmalar esas olarak [Concept('concept_theiler_pathogen','$concept_theiler_pathogens$')] ve [Concept('concept_theiler_vaccine','$concept_theiler_vaccines$')] keşfetmek için kullanılabilir; bunlar da bir ülkenin nüfusunu [Concept('concept_panum_disease','$concept_panum_diseases$')] hastalıklarından korumasına yardımcı olur."
 concept_theiler_biology: "Biyoloji"
 concept_theiler_biology_desc: "[concept_morgenroete] içinde #b Biyoloji#!, tıp ve tarım sektörlerinde hayati bir destek rolü oynar. Mikrobiyolojik çalışmalar özellikle önemlidir: bir [concept_theiler_biologist], [Concept('concept_theiler_microorganism','$concept_theiler_microorganisms$')] ve özellikle [Concept('concept_theiler_pathogen','$concept_theiler_pathogens$')] türlerini tanımlayabilir. İkincisi, [Concept('concept_theiler_vaccine','$concept_theiler_vaccines$')] geliştirmek için kullanışlıdır. Sağlık sistemi yeterince gelişmişse Aşılar, [Concept('concept_panum_disease','$concept_panum_diseases$')] hastalıklarının ortaya çıkmasını tamamen önleyebilir. Ayrıca biyologlar, elma iç kurduyla mücadele etmek gibi [concept_theiler_pest] kontrolünde faydalıdır ve tarımsal işletmelerin üretimini artırırlar."
 concept_ito_medicinal_plants: "Şifalı Bitkiler"
 concept_ito_medicinal_plants_desc: "Şifalı Bitkiler, ilaçlar ve diğer yararlı kimyasalların üretiminde kullanılabilecek tıbbi özelliklere sahip bitkilerdir.\nBir [concept_dubois_naturalist]ı [concept_dubois_botanical_expedition] seferine göndererek Şifalı Bitkiler toplayabilirsiniz. Yeterli Şifalı Bitki toplandığında bir [concept_mendelejew_chemist] kimyasal maddeleri izole etmeye başlayabilir. Bu işlem tamamlandığında bir [concept_theiler_biologist] farmasötik ürün üretmeye başlayabilir."
 concept_academics_academic_confusion: "Akademik Karmaşa"
 concept_academics_academic_confusion_desc: "Bir Üniversitenin [concept_academics_university_specialization] uzmanlığını değiştirmek, birçok akademisyenin kafasının karışmasına yol açar. Bu da kısa bir süre boyunca bilimsel üretimin azalmasına neden olur."
