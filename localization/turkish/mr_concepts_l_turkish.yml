 concept_dubois_great_formation: "Great Formation"
 concept_santos_balloonist_role: "Balloonist"
 concept_santos_balloonist_role_only_balloonist: "Balloonist"
 concept_santos_balloonists_role: "Balloonists"
 concept_santos_balloonist_role_desc: "A #b Balloonist#! is a special character that can be sponsored by a nation. Usually well developed or western countries will sponsor #b Balloonist#! and compete for records and new findings. The #b Balloonists#! will randomly conduct flights and get [Concept('concept_santos_balloon_record','$concept_santos_balloon_records|q$')] either for the longest distance, the longest flight time or the highest flight. For every balloon flight the #b Balloonist#! will get experience and rank up which will raise the chance for new records. A balloonist can also embark on adventurous journeys, attempt a daring [concept_santos_balloon_crossing] or simply enjoy leisurely flights. But be aware that [concept_santos_ballooning] is a dangerous business and many balloonists die early, especially if they are sick, alcoholics or drug abusers. Every #b Balloonist#! has a [concept_santos_balloon] with a specific name and specific characteristics."
 concept_santos_ballooning: "Ballooning"
 concept_santos_ballooning_desc: "Ballooning is the earliest form of [concept_curtiss_aviation] in [concept_morgenroete], and due to its inherent danger at the start of the game, it is reserved only for particularly daring adventurers. A [concept_santos_balloonist] can lead a peaceful life taking pleasure flights—or risk ambitious [concept_santos_balloon_record] flights and [Concept('concept_santos_balloon_crossing','$concept_santos_balloon_crossings|q$')] that pose a mortal danger. On adventure expeditions, balloonists pursue their [Concept('concept_academics_academic','$concept_academics_academics|q$')] interests and bring back useful items. As the game progresses, ballooning becomes increasingly professionalized and, with the Gordon Bennett Cup and flights into the stratosphere, evolves into a field that is highly regarded both in sports and science. Ballooning is intertwined with [concept_curie_meteorology] in many ways. As well as the qualities of the balloonist, the characteristics of the [concept_santos_balloon] itself are also crucial to the success of a balloon flight."
 concept_santos_balloonist: "Balloonist"
 concept_santos_balloonist_desc: "This character is a balloonist who often goes on adventurous balloon rides."
 concept_santos_experienced_balloonist: "Experienced Balloonist"
 concept_santos_experienced_balloonist_desc: "This character is an experienced balloonist who often goes on adventurous balloon rides. Characters with this trait have a higher chance of setting better records."
 concept_santos_famous_balloonist: "Famous Balloonist"
 concept_santos_famous_balloonist_desc: "This character is a famous balloonist who often goes on adventurous balloon rides. Characters with this trait have a higher chance of setting better records."
 concept_curie_formulas: "Formulas"
 concept_curie_magnetic_data: "Magnetic Data"
 concept_curie_geomagnetism: "Geomagnetism"
 concept_curie_geomagnetic_observatory: "Geomagnetic Observatory"
 concept_curie_geomagnetism_desc: "At the beginning of the 19th century, interest in geomagnetism and geophysics grew immensely within the fledgling natural sciences. The [concept_curie_mathematical_physicist] Carl Friedrich Gauss and the [concept_curie_physicist] Wilhelm Weber played a particularly significant role in this development; together with Alexander von Humboldt, they founded the Magnetic Association. Shortly thereafter, numerous countries established geomagnetic observation stations to study the Earth's magnetism. This work not only yielded new insights into the Earth's magnetic field—and thus improved navigational, physical, and geological knowledge—but also produced reference works such as the Geomagnetic Atlas.\n\n#V All geomagnetic features can be found under Mathematical Formulas/Cloud Atlas/Rocketry/Nuclear Physics.#! Countries that join the Magnetic Association may establish their own Geomagnetic Observatory at the observatory, provided they have a physicist on staff. Once established, the station sends [concept_curie_magnetic_data] annually to the founding country of the Magnetic Association; each time the maximum value is reached, a reward is granted in the form of physical data or new resource deposits. With each subsequent success, the amount of magnetic data required for the next bonus increases."
 concept_curie_rocketry: "Rocketry"
 concept_curie_rocketry_desc: "#n Coming soon to Morgenröte!#!"
 concept_curie_nuclear_physics: "Nuclear Physics"
 concept_curie_nuclear_physics_desc: "#n Coming soon to Morgenröte!#!"
 concept_santos_balloon: "Balloon"
 concept_santos_balloon_desc: "The balloon is a [concept_santos_balloonist]'s most important tool and plays a crucial role in [concept_santos_balloon_record] flights and [Concept('concept_santos_balloon_crossing','$concept_santos_balloon_crossings|q$')]. Balloons can be adapted through technical advances; for example, through new technologies, specialisation in a particular type, or a change in fuel. Every balloon has specific values for altitude, distance and time. The average values are merely guidelines, as the characteristics of the balloonist also have an influence, and each value has a maximum and a minimum between which a balloon fluctuates during its flights. This means that the same balloon, with the same balloonist, may produce slightly different values during successive flights."
 concept_santos_balloon_record: "Balloon Record"
 concept_santos_balloon_records: "Balloon Records"
 concept_santos_balloon_record_desc: "Traditionally, a [concept_santos_balloonist] attempts to set balloon records in order to attract international attention. The recognised categories for balloon records are altitude, distance and time. The prestige gained from this increases with the magnitude of the record: every 500 metres in altitude, every 100 kilometres in distance and every 3 hours in time are rewarded with one prestige point. The key factors in setting these records are, above all, the characteristics of the [concept_santos_balloon] itself, which can be improved through technology, specialisation and changes to the fuel. Added to this are the personal qualities of the balloonist and, in certain cases, the presence of a [concept_curie_mathematical_physicist]. Record attempts in [concept_santos_ballooning] are a risky undertaking and can, in some cases, result in the death of the balloonist."
 concept_santos_balloon_crossing: "Balloon Crossing"
 concept_santos_balloon_crossings: "Balloon Crossings"
 concept_santos_balloon_crossing_desc: "Balloon crossings are the supreme challenge in [concept_santos_ballooning], the one that brings the most recognition. At the same time it is the most dangerous undertaking, in which a [concept_santos_balloonist] is most likely to lose their life. Seven of the nine balloon crossings are based on historical precedents; the crossings of the Strait of Korea and the Red Sea, on the other hand, are possible but have not been achieved within the Victoria 3 timeframe.\nBalloon crossings require not only specific technologies but also that the [concept_santos_balloon] meets minimum requirements in terms of altitude and distance. However, it is advisable not to fly using only the minimum requirements; whilst this may be possible for simple crossings, it can lead to disaster even with moderate requirements. Experienced balloonists with good [Concept('concept_character_trait','$concept_character_traits|q$')], in particular, are best placed to successfully complete a balloon crossing. In particular, the 'ambitious' trait is an advantage, but the 'meteorologist' trait can also work wonders. If the balloonist is not a meteorologist themselves, the presence of a [concept_curie_meteorological_physicist] has the same effect."
 concept_curie_magnetic_data_desc: "Magnetic data is primarily collected at a [Concept('concept_curie_geomagnetism','$concept_curie_geomagnetic_observatory|q$')], but can also be obtained incidentally during research missions. Magnetic data is sent annually to the founding country of the Magnetic Association and grants a bonus when the maximum data value is reached."