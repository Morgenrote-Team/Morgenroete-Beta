 concept_andersson_anthropologists: "#b #BLUE Antropologlar#!#!"
 concept_andersson_anthropologist_desc: "#b #BLUE Antropologlar#!#!, insanın tarih öncesini hem paleontolojik hem de arkeolojik açıdan inceleyen akademisyenlerdir. [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')], [Concept('concept_andersson_prehistoric_artifact','$concept_andersson_prehistoric_artifacts$')] arar, yeni insan türleri keşfeder ve [Concept('concept_andersson_skeleton','$concept_andersson_skeletons$')] yeniden yapılandırırlar. Antropologlar çoğu zaman speleolog olarak (mağara araştırmacıları) çalışır ve zamanla çok çeşitli uzmanlıklar geliştirebilir. Bunlar arasında monojenistler, polijenistler, difüzyonistler ve evrimciler gibi kategoriler bulunur ve konferanslardaki oy davranışları çoğu zaman sonucu belirler. Özellikle yetkin antropologlar [concept_andersson_human_evolution] kavramının mevcut antropolojik terminolojisini yeniden düzenleyebilir veya Piltdown sahtekârlığına ışık tutabilir."
