 concept_andersson_anthropological_prestige: "Antropolojik Prestij"
 concept_andersson_anthropological_prestige_desc: "#b Antropolojik Prestij#!, antropolojik başarılar yoluyla biriktirilen toplam prestiji ifade eder. Bunlar şunlardır:\n\n#b Tarih Öncesi Eser#!: 1 Prestij\n#b Neoanthropus, Palaeanthropus, Pithecanthropus, Australopithecus Fosili#!: 1 Prestij\n#b Venüs Figürini#!: 5 Prestij\n#b Mağara Resimleri#!: 10 Prestij\n#b Antropolojinin Kaşifi#!: 15 Prestij\n#b Yeni Neoanthropus Türü#!: 20 Prestij\n#b Yeni Palaeanthropus Türü#!: 40 Prestij\n#b Yeni Pithecanthropus Türü#!: 60 Prestij\n#b Yeni Australopithecus Türü#!: 80 Prestij\n#b Neoanthropus İskeleti#!: 25 Prestij\n#b Palaeanthropus İskeleti#!: 50 Prestij\n#b Pithecanthropus İskeleti#!: 75 Prestij\n#b Australopithecus İskeleti#!: 100 Prestij\n#b Homo Sapiens tanıtıldı#!: 40 Prestij\n#b Homo Neanderthalensis tanıtıldı#!: 50 Prestij\n#b Homo Erectus tanıtıldı#!: 50 Prestij"
 concept_andersson_anthropology: "Antropoloji"
 concept_andersson_anthropology_desc: "#b Antropoloji#!, öncelikle insanlığın tarih öncesi atalarına, Neolitik dönemden Australopithecus'a kadar uzanan döneme odaklanır. [Concept('concept_andersson_anthropologist','$concept_andersson_anthropologists$')], uzak geçmişi yeniden yapılandırmak için özellikle [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] ve [Concept('concept_andersson_prehistoric_artifact','$concept_andersson_prehistoric_artifacts$')] inceler. Antropologlar hâlâ [concept_andersson_human_evolution]ı maymun-insandan ilk insana ve oradan modern insana doğru bir ilerleme olarak görür (Pithecanthropus, Palaeanthropus, Neoanthropus). Buna göre antropologlar dünya çapında bu türlerin temsilcilerini arar ve türleri keşfedildikleri yerlere göre adlandırır. Yeterli fosille bir [concept_andersson_skeleton] yeniden yapılandırabilirler. Ayrıca mağara resimleri keşfeder, kraniyometrik ölçümler yapar veya Neolitik, Mezolitik ve Üst Paleolitik dönemler hakkında sergiler düzenlerler. Amerika kıtasının iskânı ve modern insanın kökenleri üzerine düzenlenen iki konferans da onların çalışma alanına girer."
