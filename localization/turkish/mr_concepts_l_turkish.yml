 concept_theiler_pest: "Zararlı"
 concept_theiler_pests: "Zararlılar"
 concept_theiler_pest_desc: "Zararlılar, öncelikle tarımsal zararlıları—çoğunlukla böcekleri—ifade eder ve bir ülkenin tarımsal üretimi üzerinde önemli bir etkiye sahip olabilir. Ekinleri etkileyen diğer birçok faktörün aksine yıllarca varlıklarını sürdürebilirler, ancak daha sonra belirli bir süre boyunca tamamen ortadan kaybolabilirler. Bir [concept_theiler_biologist]—ve bazen bir [concept_mendelejew_chemist]—bu tehdidi kontrol altına almak veya tamamen ortadan kaldırmak için yöntemler geliştirebilir. Zararlılar şunlardır:\n\n- [GetHarvestConditionType('locust_swarm').GetName]"
 concept_vikelas_mechanical_innovation_desc: "Mekanik İnovasyon, bir [concept_vikelas_mechanic] tarafından [concept_vikelas_race_car] aracını geliştirmek için kullanılır. Yarış arabasının hızını, güvenilirliğini ve güvenliğini artırmak için kullanılabilir."