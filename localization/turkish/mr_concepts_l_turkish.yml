 concept_andersson_human_fossils: "İnsan Fosilleri"
 concept_andersson_human_bones: "İnsan Kemikleri"
 concept_andersson_human_fossil_desc: "Temel olarak iki tür #b İnsan Fosili#! vardır: belirli bir türe ait olmayan fosiller ve belirli fosiller. Belirli bir türe ait olmayan fosiller, tarihî dönemlere ait yakın zamanlı kalıntılar da dâhil olmak üzere insan biyolojisine ait her türlü kalıntıyı kapsar. Bunlar antropolog olmayan kişiler tarafından da bulunabilir, ancak örneğin [GetBuildingType('building_andersson_institute').GetName] kurulması açısından önemlidir. Belirli insan fosilleri dört gruba ayrılır: Neoanthropus, Palaeanthropus, Pithecanthropus ve Australopithecus. Bir hominid araştırması veya hominid seferi sırasında bulunabilirler. [Concept('concept_andersson_anthropologist','$concept_andersson_anthropologists$')] bu süreçte tamamen yeni türler de keşfedebilir. Toplam 16 farklı belirli insan fosili vardır. Bunlardan [Concept('concept_andersson_skeleton','$concept_andersson_skeletons$')] de yeniden yapılandırılarak [concept_andersson_human_evolution] izlenebilir."
 concept_andersson_cave: "Mağara"
 concept_andersson_caves: "Mağaralar"
 concept_andersson_cave_desc: "#b Tarih Öncesi Mağaralar#!, erken insan veya insan öncesi türlerin [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] bıraktığı yerlerdir. Bu nedenle antropolojik araştırmalar yürütülürken bonus sağlarlar. Mağaralar [Concept('concept_andersson_anthropologist','$concept_andersson_anthropologists$')] tarafından keşfedilebilir ve araştırılabilir. Bazı Mağaraların kilidi tarihî olaylar aracılığıyla da açılır."
 concept_andersson_human_evolution: "İnsan Evrimi"
 concept_andersson_human_evolution_desc: "Viktorya döneminde [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] ve evrimsel aşamalar, daha yüksek gelişmişlik düzeylerine göre sınıflandırılma eğilimindeydi. Sanatsal yeteneklerle donatılmış 'yetenekli' Homo sapiens ile daha kaba hatlara sahip ataları veya maymunsu karşılıkları arasında ayrım yapılıyordu. Bu nedenle insanlığın öncülleri Neoanthropus (Gerçek İnsan), Palaeanthropus (Mağara İnsanı) ve Pithecanthropus (Maymun-İnsan) gibi kategorilere ayrıldı; sonuncusu hayvanlarla insanlar arasındaki gerçek 'kayıp halka' olarak görülüyordu. Bu kavramlar daha sonraki bilimsel çalışmalar tarafından sıkça reddedilmiş olsa da insanlığın erken tarihine ilişkin sonraki araştırmalar için başlangıç noktası oluşturdular. Bu nedenle Afrika'da Australopithecus'un (Güney Maymunu) keşfi, çeşitli nedenlerle yerleşik görüşleri sarsan bir gelişme oldu."
 concept_andersson_prehistoric_artifact: "Tarih Öncesi Eser"
 concept_andersson_prehistoric_artifacts: "Tarih Öncesi Eserler"
 concept_andersson_prehistoric_artifact_desc: "#b Tarih Öncesi Eserler#!, bir [concept_andersson_cave] veya diğer arkeolojik alanlarda insan varlığına dair kanıt sağlar. Belirli bir türe ait olmayan [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] kalıntıların aksine, doğrudan [concept_andersson_anthropological_prestige] kazandırırlar. Nadir durumlarda Neolitik, Mezolitik veya Üst Paleolitik dönemde insan yaşamını konu alan sergiler için de gereklidirler. [concept_lepsius_archaeologist] özelliğine sahip bir [concept_andersson_anthropologist], antropolojik araştırma sırasında daha fazla tarih öncesi eser bulur."
 concept_andersson_skeleton: "Tarih Öncesi İskelet"
 concept_andersson_skeletons: "Tarih Öncesi İskeletler"
 concept_andersson_skeleton_desc: "#b Tarih Öncesi İskelet#! yeniden yapılandırmak için bir [GetBuildingType('building_andersson_institute').GetName] inşa edilmesi gerekir. [Concept('concept_andersson_anthropologist','$concept_andersson_anthropologists$')] belirli bir türün beş [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] fosilini bulduktan sonra yeniden yapılandırmaya başlayabilir; sürecin süresi antropoloğun [Concept('concept_character_trait','$concept_character_traits$')] özelliklerinden ve deneyiminden etkilenir. Bir Neoanthropus, Palaeanthropus veya Pithecanthropus'un ilk iskeleti, enstitüde ilgili üretim yöntemini etkinleştirir. Ancak bir antropolog, fosillere sahip olması koşuluyla, daha fazla [concept_andersson_anthropological_prestige] kazanmak için diğer iskeletleri de kolayca yeniden yapılandırabilir."
 concept_lepsius_minor_excavation_site: "Küçük Kazı Alanı"
 concept_lepsius_minor_excavation_site_desc: "Lisanslar aracılığıyla uluslararası olarak tüm ülkeler tarafından potansiyel olarak kullanılabilen ve Mısır, Mezopotamya, Ege ve Kolomb öncesi [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts$')] sunan büyük [Concept('concept_lepsius_excavation_site', '$concept_lepsius_excavation_sites$')] alanlarının yanı sıra 'daha küçük' kazı alanları da vardır. Bunlar yalnızca sahibi tarafından kullanılabilir ve sadece yerel eserler içerir. Bir [concept_lepsius_archaeologist] ve özel bir teknoloji gerektiren bir Journal Entry aracılığıyla açılırlar. Ancak bundan sonra kazı alanı gerçekten etkinleşir ve Eyalet Bölgesi'nde bir Eyalet Özelliği aracılığıyla görünür hâle gelir. Etkinleştirildikten sonra Küçük Kazı Alanları, arkeolog bir arkeolojik proje yürüttüğü sürece ek bir Yerel Eser üretir. Bu tür kazı alanlarına Pompeii, Tikal ve Harappa örnek verilebilir."
