 andersson.61.t: "[GetPlayer.GetCustom('andersson_fossil_piltdown')] İnsanı"
 andersson.61.d: "Önde gelen iki antropolog bugün bilim dünyasını sarsabilecek bir keşfi açıkladı: [ROOT.GetCountry.GetNameNoFlag] ülkesinden gelen ilk modern insanı bulduklarını iddia ediyorlar."
 andersson.61.f: "Londra Jeoloji Cemiyetinin bir toplantısında Arthur Smith Woodward ve Charles Dawson, Piltdown köyü yakınlarındaki bir çakıl ocağında bulunan erken bir insana ait kafatası parçalarının çağ açıcı bir keşif olduğunu açıkladı. Woodward'ın bulunan parçalara dayanarak yaptığı rekonstrüksiyon, kafatası ile omurganın birleştiği bölge olan artkafa ve beynin büyüklüğü dışında büyük ölçüde modern bir insan kafatasına benziyordu; beynin büyüklüğü modern insanın yalnızca yaklaşık üçte ikisiydi ve dişleri ile çene kemiği de ancak kabaca insanı andırıyordu. British Museum'un yüksek bilimsel otoritesine dayanarak Woodward, Piltdown buluntularını büyük insansı maymunlar ile insanlar arasındaki kayıp halka olarak yorumladı. Başlangıçtaki şüphelere rağmen Londra'daki Doğa Tarihi Müzesi bilim insanları buluntunun yaşını 200.000 ila 500.000 yıl arasında belirledi. Bu, onu Neandertallerden önemli ölçüde daha yaşlı yapacaktı. Keşfin duyurulması, hem uzmanların hem de Britanya halkının büyük ilgisini hemen çekti. Piltdown keşfinin haberi dünya çapında sansasyon yarattı."
 andersson.61.g: "Demek ki ilk modern insan [ROOT.GetCountry.GetAdjectiveNoFormatting]. Hiç şaşırtıcı değil!"
 andersson.61.h: "Bu buluntu son derece şüpheli."
 andersson.62.d: "Ülkemizin önde gelen antropoloğu Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName], bugün bilim dünyasını sarsabilecek bir keşfi açıkladı: [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetSheHe], [ROOT.GetCountry.GetNameNoFlag] ülkesinden gelen ilk modern insanı bulduğunu iddia ediyor."
 andersson.62.f: "[ROOT.GetCountry.GetCapital.GetCityHubName] Antropoloji Cemiyetinin bir toplantısında [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetFullName], [GetPlayer.GetCustom('andersson_fossil_piltdown')] köyü yakınlarındaki bir çakıl ocağında bulunan erken bir insana ait kafatası parçalarının çağ açıcı bir keşif olduğunu açıkladı. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName]'ın parçalara dayanarak yaptığı rekonstrüksiyon, kafatası ile omurganın birleştiği bölge olan artkafa ve beynin büyüklüğü dışında büyük ölçüde modern bir insan kafatasına benziyordu; beynin büyüklüğü modern insanın yalnızca yaklaşık üçte ikisiydi ve dişleri ile çene kemiği de ancak kabaca insanı andırıyordu. [ROOT.GetCountry.GetAdjectiveNoFormatting] Müzesinin yüksek bilimsel otoritesine dayanarak [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName], [GetPlayer.GetCustom('andersson_fossil_piltdown')] buluntularını büyük insansı maymunlar ile insanlar arasındaki kayıp halka olarak yorumladı. Başlangıçtaki şüphelere rağmen [ROOT.GetCountry.GetCapital.GetCityHubName] Doğa Tarihi Müzesindeki bilim insanları buluntunun yaşını 200.000 ila 500.000 yıl arasında belirledi. Bu, onu Neandertallerden önemli ölçüde daha yaşlı yapacaktı. Keşfin duyurulması, hem uzmanların hem de [ROOT.GetCountry.GetAdjectiveNoFormatting] halkının büyük ilgisini hemen çekti. [GetPlayer.GetCustom('andersson_fossil_piltdown')] keşfinin haberi dünya çapında sansasyon yarattı."
 andersson.63.t: "Paranthropus"
 andersson.63.d: "Transvaal'a yapılan bir arazi gezisi sırasında bir öğrenci, Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName]a incelemesi için bazı fosiller verdi. Antropolog hemen çocuğun bunları nerede bulduğunu öğrenmek istedi. Bölgeye vardığında [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetSheHe], tamamen bilinmeyen bir türe işaret eden inanılmaz keşifler yapmayı başardı; belki de bir ata değil, insanların çok uzak bir akrabasıydı."
 andersson.63.f: "Paranthropus, yaygın olarak kabul edilen iki türü, P. robustus ve P. boisei, içeren soyu tükenmiş bir hominid cinsidir. Bununla birlikte Paranthropus'un geçerliliği tartışmalıdır ve bazen Australopithecus ile eşanlamlı kabul edilir. Pliyosen'in sonlarından Orta Pleistosen'e kadar yaklaşık 2,9 ila 1,2 milyon yıl önce yaşadılar. Paranthropus, orta hat boyunca belirgin, goril benzeri bir sagittal ibik taşıyan sağlam kafataslarıyla karakterizedir; bu yapı güçlü çiğneme kaslarına ve öğütmeye uygun geniş, otçul dişlere işaret eder. Kemik aletlerle ilişkilendirilirler ve ateş kullanımının en eski kanıtı oldukları iddiası tartışmalıdır. Genellikle ormanlık alanlarda yaşadılar ve A. africanus, H. habilis ve H. erectus gibi bazı erken insan türleriyle aynı dönemde var oldular."
 andersson.63.g: "Bu sonuçlar alınacaksa doktor daha fazla tatile çıkmalı."
 andersson_add_piltdown_fossil_effect_tt: "#G 1#! @andersson_human_fossil! [Concept('concept_andersson_human_fossil','$concept_andersson_special_human_fossil$')]: [GetPlayer.GetCustom('andersson_fossil_piltdown')] İnsanı kazan."
