 andersson.10.t: "Antropoloji ve Etnoloji Enstitüsü"
 andersson.10.d: "Bugün düzenlenen görkemli bir törenle [SCOPE.sCharacter('andersson_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('andersson_ruler').GetFullName], Antropoloji ve Etnoloji Enstitüsünü bizzat açtı."
 andersson.10.f: "Açılış töreni, basının, uzmanların ve halkın desteğini kazanan ciddi ve genel olarak memnuniyetle karşılanan bir etkinlikti, ancak eleştirilerden de yoksun değildi. Yine koleksiyonculuk saplantısıyla yönetilen, hiçbir gerçek değeri olmayan, prestijli merakların sergilendiği başka bir bina mı? Muhalif bir gazete, bunun bir para israfı ve hayal gücünden yoksun bir içerik olduğunu yazdı. Hükümetin halka sunacak yeni hiçbir şeyi olmadığı iddia edildi. Kimileri eserler topluyor, kimileri tıbbi bitkiler, ardından dinozor meraklıları vardı ve şimdi de insan kemikleri! Neyse ki bu olumsuz yorumlar kesinlikle azınlıkta kaldı ve [SCOPE.sCharacter('andersson_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('andersson_ruler').GetFullName]ın önemini bir kez daha vurguladığı yeni binaya duyulan coşkuyu gölgeleyemedi."
 andersson.10.g: "Enstitüyü Ziyaret Et."
 andersson.21.t: "Vero İnsanı"
 andersson.21.d: "Elias Sellards, Florida'da bazı antik kemikleri keşfederek ülke çapında büyük yankı uyandırdı."
 andersson.21.f: "Vero İnsanı, jeolog Elias Sellards tarafından 1915 ile 1916 yılları arasında Florida'nın Vero Beach kentinde keşfedilen önemli bir Pleistosen dönemi insan kalıntıları topluluğunu ifade eder. Kalıntıların nesli tükenmiş Buzul Çağı megafaunasıyla aynı jeolojik tabakada bulunması, insanların Amerika'ya çok daha sonra ulaştığı yönündeki dönemin hâkim bilimsel görüşüne meydan okuduğu için keşif başlangıçta büyük tartışmalara yol açtı. Modern karbon tarihleme yöntemleri ve gelişmiş arkeolojik teknikler, alanın yaklaşık 13.000 yıl öncesine tarihlenen ve Kuzey Amerika'daki en eski insan yerleşimlerinden birini temsil ettiğini doğrulamıştır."
 andersson.21.g: "Büyüleyici."
 andersson.22.t: "Lagoa Santa İnsanı"
 andersson.22.d: "Danimarkalı bir bilim insanı, Brezilya'daki bir mağarada şaşırtıcı bir keşifte bulundu."
 andersson.22.f: "Lagoa Santa İnsanı, 19. yüzyılın ortalarında Danimarkalı doğa bilimci Peter Wilhelm Lund tarafından Brezilya'nın Minas Gerais bölgesindeki kireçtaşı mağaralarında keşfedilen bir Paleo-Kızılderili iskelet kalıntıları topluluğunu ifade eder. Modern genetik çalışmalar ve arkeolojik analizler, bu kalıntıları yaklaşık 10.000 ila 12.000 yıl öncesine tarihlenen ve Güney Amerika'daki en eski insan yerleşim dalgasının bir parçası olarak değerlendirmiştir."
 andersson.23.t: "Cro-Magnon İnsanı"
 andersson.23.d: "Louis Lartet, Neandertallerden ziyade modern insanlara çok daha fazla benzeyen tarih öncesi insanlara ait birkaç iskelet buldu. İlk Avrupalılar olan bu insanlar, Abri de Cro-Magnon bölgesinin ardından Cro-Magnon olarak adlandırıldı."
 andersson.23.f: "Cro-Magnon İnsanı, Avrupa Üst Paleolitiği'nin ilk erken modern insanlarını (Homo sapiens) ifade eder. Jeolog Louis Lartet tarafından 1868'de Fransa'nın Les Eyzies kentindeki bir kaya sığınağında keşfedildiler. Bölgede beş iskeletin yanı sıra taş aletler, işlenmiş boynuzlar ve hayvan kalıntıları bulundu. Bu keşifler, fiziksel olarak modern insanların nesli tükenmiş Pleistosen faunasıyla birlikte Avrupa'da yaşadığının ilk kesin kanıtını sağladı. Bulgular, insan paleontolojisi alanının gelişmesinde büyük önem taşıdı; örnekler yaklaşık 28.000 ila 30.000 yıl öncesine tarihlendirildi ve daha önce keşfedilmiş olan daha sağlam yapılı Neandertallerden ayırt edildi."
 andersson.24.t: "Boskop İnsanı"
 andersson.24.d: "Bir kafatasının keşfi, bazı tarım işçileri arasında büyük heyecan yarattı. En yakın bilimsel kuruma haber verildi."
 andersson.24.f: "Boskop İnsanı, 1913 yılında Güney Afrika'nın Transvaal bölgesinde tarım işçileri tarafından keşfedilen ve tahmin edilen sıra dışı derecede büyük kafatası kapasitesiyle dikkat çeken fosilleşmiş bir hominid kafatası kubbesini ifade eder. 20. yüzyılın başlarında bazı antropologlar bu örneği yanlış bir şekilde Homo capensis adını verdikleri ayrı bir tür olarak sınıflandırdı ve 'büyük beyinli' insanların bölgedeki modern topluluklardan önce yaşadığını öne sürdü. Daha sonraki paleoantropolojik araştırmalar ve daha titiz tarihleme çalışmaları bu iddiaları çürüttü; kalıntıların, yerli Khoesan halklarının atalarıyla uyumlu biçimde modern bir insana (Homo sapiens) ait olduğu belirlendi."
 andersson.25.t: "Shandingdong İnsanı"
 andersson.25.d: "Bugün Zhoukoudian bölgesinin üzerindeki bir mağarada insan fosilleri bulundu. Bu durum, kuzey Çin'deki erken bir yerleşime işaret ediyor."
 andersson.25.f: "Shandingdong İnsanı, 1933-1934 yıllarında Çin'in Pekin yakınlarındaki Zhoukoudian bölgesinin Üst Mağarası'nda keşfedilen bir grup erken modern insanı (Homo sapiens) ifade eder. Pei Wenzhong'un yönetiminde kazılan ve daha sonra Franz Weidenreich tarafından incelenen bu fosillerin yaklaşık 30.000 ila 10.000 yıl öncesine ait olduğu düşünülür. Tarihsel olarak Shandingdong İnsanı, Avrupa'daki Cro-Magnon İnsanı'nın Asya'daki karşılığı olarak görülmüştür. Üç eksiksiz kafatası ve çeşitli kemik parçalarından oluşan kalıntılar; gelişmiş aletler, kemik iğneler ve delinmiş diş süsleriyle birlikte bulunmuş ve karmaşık bir kültüre işaret etmiştir. Weidenreich'in ilk hipotezi, bu bireylerin modern Asyalıların 'proto-Moğoloid' ataları olduğunu öne sürüyordu; ancak çağdaş paleoantropoloji, onları Doğu Asya boyunca bölgesel özelliklerin tam anlamıyla yerleşmesinden önce gerçekleşen daha geniş ve çeşitli bir erken insan göçünün parçası olarak değerlendirmektedir."
 andersson.26.t: "Talgai İnsanı"
 andersson.26.d: "Talgai İstasyonu yakınlarında, Avustralya'nın en eski yerleşimine yepyeni bir ışık tutan bir kemik keşfedildi."
 andersson.26.f: "Talgai İnsanı, 1884 yılında Queensland, Allora yakınlarındaki Talgai İstasyonu'nda bir çit ustası tarafından keşfedilen ve Avustralya'daki insan yerleşimine dair en eski kanıtlardan birini temsil eden tarih öncesi bir insan kafatasını ifade eder. Sağlam yüz hatları ve yoğun mineralizasyonu nedeniyle başlangıçta çok daha eski bir hominid türü sanılmış olsa da, toprak karbonatının sonraki radyokarbon tarihlemesi örneği yaklaşık 13.500 yıl öncesine tarihlendirmiştir. Keşif, ataların Avustralya Aborijin halklarının nesli tükenmiş megafaunayla birlikte yaşadığını doğrulaması açısından tarihsel olarak önemliydi ve kıtanın İlk Milletler halklarının derin tarihini anlamada önemli bir bağlantı sağladı."
 andersson.31.t: "Neandertal İnsanı"
 andersson.31.d: "Bonn Üniversitesinden bir araştırmacı, bilimsel bir meslektaşıyla birlikte, nesli tükenmiş erken bir insan türünün keşfini bugün kamuoyuna duyurdu."
 andersson.31.f: "Ağustos 1856'nın ortalarında İtalyan taş ocağı işçileri, kireçtaşı madenciliği nedeniyle kısa süre önce tahrip edilen Neandertal Vadisi'nin bir bölümünde bazı kemik parçaları keşfetti. Kemikler başlangıçta dikkatsizce molozların arasına atıldı, ancak taş ocağı sahipleri Wilhelm Beckershoff ve Friedrich Wilhelm Pieper tarafından fark edildi. Bu kişiler 16 büyük kemik parçasını çıkarttırarak incelenmeleri için Johann Carl Fuhlrott'a teslim etti. Basında çıkan haberlerden haberdar olan Bonnlu anatomist Hermann Schaaffhausen de kemikleri inceledi ve Fuhlrott'un daha önce vardığı sonuca ulaştı: bunlar modern insanların eski bir biçimiydi. Fuhlrott ve Schaaffhausen, bulguyu Haziran 1857'de Prusya Ren Bölgesi Doğa Tarihi Derneğinin genel toplantısında sundu. Ancak yorumları uzmanlar tarafından kabul görmedi. Neandertal 1 adı verilen bu buluntu, Homo neanderthalensis türünün tip örneğidir."
 andersson.32.t: "Cebelitarık İnsanı"
 andersson.32.d: "Yüzbaşı Edmund Flint, Cebelitarık yakınlarında neredeyse inanılmaz bir keşifte bulundu."
 andersson.32.f: "Cebelitarık İnsanı (özellikle Cebelitarık 1), 1848 yılında Yüzbaşı Edmund Flint tarafından Forbes Taş Ocağı'nda keşfedilen, son derece iyi korunmuş yetişkin bir kadın kafatasını ifade eder ve modern bilim tarafından keşfedilen ilk Neandertal fosilidir. Örnek, Almanya'daki Neandertal Vadisi'ndeki ünlü keşiften sekiz yıl önce bulunmuş olsa da, farklı bir insan akrabası olarak önemi, 'Neandertal' adının çoktan yerleşmesinin ardından 1860'lara kadar tam olarak anlaşılmadı. Bölgede ve yakındaki Gorham Mağarası'nda yapılan sonraki kazılar, Cebelitarık'ın Neandertaller için bilinen son sığınaklardan biri olduğunu ortaya koydu; bazı kanıtlar, burada yaklaşık 28.000 ila 32.000 yıl öncesine kadar hayatta kaldıklarını gösteriyor."
 andersson.33.t: "Spy İnsanı"
 andersson.33.d: "Spy yakınlarında bilim insanları, Belçika'nın tarih öncesi geçmişine her zamankinden daha fazla ışık tutan değerli bir antropolojik keşifte bulundu."
 andersson.33.f: "Spy İnsanı, 1886 yılında arkeolog Marcel de Puydt ve jeolog Maximin Lohest tarafından Belçika'nın Spy kenti yakınlarındaki Betche aux Rotches mağarasında keşfedilen, neredeyse eksiksiz iki Neandertal iskeletini ifade eder. Bu keşif, kalıntıların Mousterien taş aletleri ve nesli tükenmiş Buzul Çağı memelileriyle açık biçimde ilişkili olarak bulunması nedeniyle paleoantropolojide bir dönüm noktasıydı. Bu durum, Neandertallerin patolojik modern bireyler değil, antik tarih öncesi insanlar olduğunu kesin olarak kanıtladı. Sağlam vücut yapıları ve belirgin kaş çıkıntılarıyla dikkat çeken Spy fosilleri, yaklaşık 36.000 ila 40.000 yıl öncesine tarihlenir ve geç dönem Avrupa Neandertallerinin anatomisini ve davranışlarını anlamak için hâlâ en önemli örneklerden bazılarıdır."
 andersson.34.t: "Krapina İnsanı"
 andersson.34.d: "Krapina yakınlarında araştırmacılar, tüm Balkanların tarihini altüst eden devasa bir tarih öncesi insan kemiği alanı keşfetti."
 andersson.34.f: "Krapina İnsanı, 1899 ile 1905 yılları arasında paleontolog Dragutin Gorjanović-Kramberger tarafından Hırvatistan'daki Hušnjakovo Tepesi kaya sığınağında keşfedilen yaklaşık 800 Neandertal fosil parçasından oluşan devasa bir koleksiyonu ifade eder. Bu keşif, dönemi için çığır açıcıydı; Gorjanović-Kramberger, fosillerin çok eski olduğunu kanıtlamak ve Neandertallerin insan evriminin doğrudan bir parçası olduğunu göstermek için stratigrafik analiz kullanmış ve X-ışınlarının kullanımına öncülük etmiştir. Yaklaşık 120.000 ila 130.000 yıl öncesine tarihlenen alan, dünyanın en büyük ve en önemli Neandertal buluntusu olmaya devam etmekte; Neandertallerin fiziksel çeşitliliği, sağlığı ve olası ritüel davranışları hakkında kapsamlı veriler sağlamaktadır."
 andersson.35.t: "Celile İnsanı"
 andersson.35.d: "Kutsal Toprakların gerçekten de insanlığın en eski beşiklerinden biri olduğu doğrulanmış görünüyor; bu sansasyonel keşif artık uluslararası bilim camiasında biliniyor."
 andersson.35.f: "Celile İnsanı, özellikle 'Zuttiyeh kafatası' olarak bilinen ve 1925 yılında Francis Turville-Petre tarafından günümüz İsrail'inde bulunan Mugharet el-Zuttiyeh mağarasında keşfedilen kısmi bir kafatasını, yani alın kemiğini ifade eder. Batı Asya'da bulunan ilk fosil hominid olan bu örnek, kendine özgü geçiş özellikleri nedeniyle başlangıçta bir Neandertal mi yoksa erken bir modern insan mı olduğu konusunda tartışmalara yol açtı. Yaklaşık 200.000 ila 350.000 yıl öncesine tarihlenen örnek, günümüzde sıklıkla geç dönem Homo heidelbergensis veya hem Neandertallerin hem de Homo sapiens'in atası olan bir popülasyonun üyesi olarak sınıflandırılmaktadır."
 andersson.41.t: "Heidelberg İnsanı"
 andersson.41.d: "Heidelberg yakınlarında araştırmacılar, tarihin 'en eski Alman'ını bulduklarına inanıyor."
 andersson.41.f: "Heidelberg İnsanı, 1907 yılında Daniel Hartmann tarafından Almanya'nın Mauer kenti yakınlarındaki bir çakıl ocağında keşfedilen fosilleşmiş alt çeneyle tanımlanan Homo heidelbergensis türünü ifade eder. Mauer 1 mandibulası olarak bilinen bu örnek yaklaşık 600.000 yıl öncesine tarihlenir ve güçlü, iri yapısıyla ve çenesinin bulunmamasıyla dikkat çeker; buna karşın dişleri modern insanların dişlerine çarpıcı ölçüde benzer. Günümüzde Heidelberg İnsanı, Orta Pleistosen'in önemli bir atası olarak kabul edilmekte ve Avrupa'daki Neandertaller ile Afrika'daki Homo sapiens'in ortak atası olduğuna inanılmaktadır."
 andersson.42.t: "Rodezya İnsanı"
 andersson.42.d: "İsviçreli madenci Tom Zwiglaar, neredeyse tesadüfen Afrika'da şimdiye kadarki en önemli antropolojik keşiflerden birini yaptı."
 andersson.42.f: "Rodezya İnsanı, 1921 yılında İsviçreli madenci Tom Zwiglaar tarafından Kuzey Rodezya'daki (günümüzde Zambiya'nın Kabwe kenti) Broken Hill kurşun ve çinko madeninde keşfedilen, neredeyse eksiksiz fosilleşmiş bir kafatasını ifade eder. Resmî olarak Kabwe 1 olarak sınıflandırılan bu örnek, Afrika'da bulunan ilk büyük insan fosiliydi ve devasa kaş çıkıntıları gibi ilkel özellikleri modern büyüklükteki bir beyinle bir arada bulundurmasıyla dikkat çekiyordu. Son derece hassas tarihleme çalışmaları, kafatasının yaklaşık 299.000 yaşında olduğunu ortaya koymakta; bu da onu Homo heidelbergensis (veya Homo rhodesiensis) üyesi ve ortaya çıkan en eski Homo sapiens ile muhtemelen aynı dönemde yaşamış geç dönem bir tür olarak konumlandırmaktadır."
 andersson.43.t: "Pekin İnsanı"
 andersson.43.d: "Pekin yakınlarında ilk insanların yeni keşfi, insanların Asya'da ortaya çıktığı teorisini güçlendiriyor."
 andersson.43.f: "1920'lerden itibaren Pekin şehir merkezinin yaklaşık 40 km güneybatısındaki Zhoukoudian yakınlarında keşfedilen fosiller 'Pekin İnsanı' olarak anılır ve Homo cinsine atanır. 1927'de Davidson Black, esasen tek bir dişe dayanarak bu fosil buluntularına yeni tür ve cins adını Sinanthropus pekinensis Black & Zdansky verdi. 1940'ta, artık birkaç düzine fosile dayanan buluntular Wilfrid Le Gros Clark tarafından 'Cava insanları' ile yakın akraba olarak yorumlandı ve Eugène Dubois'in 1892'de seçtiği Pithecanthropus erectus tür ve cins adıyla ilişkilendirildi. Orijinal fosiller II. Dünya Savaşı sırasında kayboldu."
 andersson.44.t: "Cava İnsanı"
 andersson.44.d: "Hollanda Doğu Hint Adaları'nda hekim ve anatomist Eugène Dubois, tarih öncesi bir insan atasının fosilleşmiş kalıntılarını ortaya çıkararak bilim camiasında hem heyecan hem de tartışma yarattı."
 andersson.44.f: "Eugène Dubois tarafından 1891 yılında Doğu Cava'da Trinil yakınlarındaki Solo Nehri kıyılarında keşfedilen fosillere Cava İnsanı adı verilir. Günümüzdeki bilgilere göre yaklaşık bir milyon yıl yaşında oldukları düşünülmektedir. Bunlar Avrupa dışında keşfedilen ilk hominin fosilleri ve Neandertallerden sonra anatomik olarak modern insanların (Homo sapiens) fosil akrabalarına dair ikinci kanıttı. Cava'daki buluntular önce Anthropopithecus, ardından Pithecanthropus erectus olarak adlandırıldı. Günümüzde paleoantropologların çoğu bunları Homo erectus türüne dahil etmektedir; bazen 1940'ta Franz Weidenreich'in önerdiği üzere kökenlerini vurgulamak için bir alt tür adı da eklenir: Homo erectus javanensis. Dubois'in keşfinden 50 yıldan fazla bir süre sonra Ralph von Koenigswald, 'Hiçbir paleontolojik keşif böylesine büyük bir sansasyon yaratmamış ve bu kadar çeşitli çelişkili bilimsel görüşe yol açmamıştır' diye hatırlıyordu."
 andersson.51.t: "Taung Çocuğu"
 andersson.51.d: "Avustralyalı Raymond Dart, Taung'da olağanüstü bir keşifte bulundu: maymuna benzeyen bir çocuğun kafatası, dik yürüdüğünü gösteriyor. Dişleri ve beyni de insan öncesi özellikler taşıyor gibi görünüyor. Taung Çocuğu, insanlar ile diğer primatlar arasındaki 'kayıp halka' olabilir."
 andersson.51.f: "Taung Çocuğu, 1924 yılında Güney Afrika'nın Taung kentindeki bir kireç ocağında işçiler tarafından keşfedilen ve daha sonra anatomist Raymond Dart tarafından tanımlanan genç bir hominidin fosilleşmiş kafatasını ifade eder. Bu örnek, Australopithecus africanus türünün tip fosili olarak kullanıldı ve Afrika'da bulunan iki ayaklı bir insan atasına bilimsel olarak ilk kez 'Maymun-İnsan' teriminin uygulanmasını sağladı. İnsanlığın Asya veya Avrupa'da ortaya çıktığına inanan bilim camiasının başlangıçtaki şüpheciliğine rağmen bu keşif, sonunda paleoantropolojinin odağını Afrika'ya kaydırdı. Çocuğun yaklaşık 2,8 milyon yıl önce yaşadığı düşünülüyor."
 andersson.101.t: "Tarih Öncesi Mağara Bulundu"
 andersson.101.d: "Uzun bir keşif sürecinin ardından [SCOPE.sCharacter('andersson_anthropologist_scope').GetFullName], [SCOPE.sCharacter('andersson_anthropologist_scope').GetSheHe] tarih öncesi insanların veya insan atalarının kemiklerinin bulunduğundan şüphelendiği bir mağaranın girişini keşfetti."
 andersson.101.f: "Tarih öncesi mağaralarda genellikle insan veya insan öncesi türlere ait fosillerin yanı sıra antropolojik veya arkeolojik nitelikte başka buluntular da bulunabilir. Bulguları değerlendirmek için bir antropolog tarafından yönetilen bir keşif seferi gerekir. Bu araştırma, insanlığın kökenine yönelik araştırmalara ışık tutabilir."
 andersson.101.g: "Bu mağara mümkün olan en kısa sürede incelenmeli."
 andersson.201.t: "Hominid Araştırması: Tür"
 andersson.201.d: "Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName], [GetPlayer.GetName] topraklarında insan fosillerine yönelik görkemli — veya en azından bir ölçüde başarılı — bir araştırma başlatma konusunda mükemmel bir fikir ortaya attı. Mevcut tüm seçenekler [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetHerHis] masasının üzerinde."
 andersson.201.f: "'Sayın Beyler, iyi bilinen ve varsayımsal hominid türleri hakkında genel bir sohbet gerçekleştirmek üzere hepinizi davet ediyorum. Birçoğunuzun katılmasını umuyorum. Tüm isim önerileri bir kura tamburuna konulacak ve ardından rastgele seçilecek. Yaratıcılığınıza güveniyorum!'\n\nİmza: [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetFullName]"
 andersson.201.g: "Boş ver."
 andersson.201.h: "Neoanthropus."
 andersson.201.i: "Palaeanthropus."
 andersson.201.j: "Pithecanthropus."
 andersson.201.k: "Australopithecus."
 andersson.211.t: "Hominid Araştırması: Tamamlandı"
 andersson.211.d: "Antropolojik araştırma grubu çalışmalarını başarıyla tamamladı ve sonuçlarla birlikte [ROOT.GetCountry.GetCapital.GetCityHubName] şehrine geri dönüyor."
 andersson.211.f: "'Umarım hepimiz bir şeyler öğrenmişizdir, beyler! İnsanlığın kökeni hâlâ bir gizem, ancak en azından bu gizemin üzerine biraz ışık tutabildik. Dr. Jackson, dişlerdeki aşınma izlerinden tarih öncesi diş hijyeni hakkında sonuçlar çıkarabildi; Dr. Fittipaldi, keşfedilen aletleri bağlamına oturtarak eski tekniklerdeki incelikleri belirledi; Profesör Schabernack ise sonunda neden sürekli dikitlerin üzerine oturmaması gerektiğini öğrendi!'\n\nSaygılarımla: [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetFullName]"
 andersson.211.g: "Antropolojik bir başarı."
 andersson.212.t: "Mağaradaki Harikalar"
 andersson.212.d: "Antropoloğumuz [SCOPE.sState('andersson_cave_state_scope').GetName] bölgesinde öylesine etkileyici resimlere sahip bir mağara keşfetti ki, ülkemizdeki birçok araştırmacı bunların sahte olması gerektiğini savunuyor - bu kadar ilkel bir aşamadaki insanların böylesi eserler yaratabilmesi mümkün değil!"
 andersson.212.f: "'İlk galerideki incelememize devam ettiğimizde, kemik ve deniz kabuklarının bulunduğu katmanların tam olarak sona erdiği yerde, gözlemci mağaranın tavanında çok sayıda hayvan resmi bulunca şaşkınlığa uğrayacaktır. Büyük boyutlardaki bu resimler siyah ve kırmızı aşı boyasıyla yapılmış gibi görünmektedir. Çoğunluğu, kambur sırtlı şekillerinden dolayı bizonlara benzediği düşünülen hayvanları tasvir eder; bunlardan ikisi tam ve yandan gösterilmiş, diğerlerinin ise başları yoktur ve bazıları anlaşılmaz pozisyonlarda betimlenmiştir. Ayrıca çok ustaca çizilmiş tam bir dişi geyik ve ata benzeyen bir baş da görüyoruz.' - MARCELINO SANZ DE SAUTUOLA"
 andersson.212.g: "Taş Devri'nin Sistine Şapeli!"
 andersson.221.t: "[SCOPE.sState('andersson_cave_state_scope').GetMineHubName] İnsanı"
 andersson.221.d: "Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] sansasyonel bir keşifte bulundu! Erken bir insana ait fosiller, on binlerce yıl öncesine dayanan bir yerleşime işaret ediyor. Bu, tamamen bilinmeyen bir Neoanthropus temsilcisi olmalı."
 andersson.221.f: "Neoanthropus, 19. ve 20. yüzyılın başlarındaki antropolojide anatomik olarak modern insanları daha 'ilkel' fosil hominidlerden ayırmak için kullanılan tarihsel bir taksonomik terimdir. Dönemin doğrusal evrim çerçevelerinde bu terim, insan gelişiminin son aşamasını ifade ediyor ve modern toplulukları yeni keşfedilen 'Paleoantropus' soylarıyla karşılaştırmak için kullanılıyordu. Sınıflandırma esas olarak Homo sapiens'i, özellikle modern Avrupalıların doğrudan ataları olarak görülen Cro-Magnon İnsanı gibi Geç Pleistosen buluntularını kapsıyordu. 1800'lerin entelektüel bağlamında Neoanthropus kavramı, Neandertaller gibi 'tufan öncesi' soyu tükenmiş türler ile modern fiziksel özelliklerin ortaya çıkışı arasında kronolojik bir sınır oluşturulmasında önemli bir rol oynadı."
 andersson.221.g: "[SCOPE.sState('andersson_cave_state_scope').GetMineHubName] İnsanı mı? Beğendim."
 andersson.222.t: "[SCOPE.sState('andersson_cave_state_scope').GetFarmHubName] İnsanı"
 andersson.222.d: "Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] tarafından yapılan son araştırma sansasyonel bir sonuç ortaya koydu: Görünüşe göre daha önce bilinmeyen bir Palaeanthropus türü bu mağarada yaşamış."
 andersson.222.f: "Palaeoanthropus, 19. ve 20. yüzyılın başlarında, modern insanlardan daha 'arkaik' veya 'ilkel' özellikler sergileyen Orta ve Geç Pleistosen hominidlerini sınıflandırmak için kullanılan tarihsel bir antropolojik tanımlamadır. Viktorya dönemi biliminin gelişimsel hiyerarşilerinde bu kategori, en eski maymunsu atalar ile Neoanthropus'un ortaya çıkışı arasında köprü kuran önemli bir ara evreyi temsil ediyordu. Terim en sık Neandertallere uygulanıyordu. 19. yüzyıl araştırmacıları için Palaeanthropus tanımı, bu soyu tükenmiş biçimlerin modern insanların doğrudan ataları mı yoksa daha üstün soyların yerini aldığı bir evrimsel çıkmaz mı olduğu tartışmasının merkezindeydi."
 andersson.222.g: "[SCOPE.sState('andersson_cave_state_scope').GetFarmHubName] İnsanı - kulağa hoş geliyor!"
 andersson.223.t: "[SCOPE.sState('andersson_cave_state_scope').GetCityHubName] İnsanı"
 andersson.223.d: "Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] tarafından son kazısında bulunan kemikler yüz binlerce yıllık olabilir. Bu doğruysa, daha önce hiç karşılaşmadığımız türden bir Pithecanthropus söz konusu."
 andersson.223.f: "Pithecanthropus, kelime anlamıyla 'maymun-insan' olan, Ernst Haeckel tarafından ortaya atılan ve daha sonra Eugène Dubois tarafından 1891'deki Cava İnsanı keşfine (Pithecanthropus erectus) uygulanan önemli bir taksonomik tanımdır. 19. yüzyıl antropolojisinde bu terim, insan olmayan primatlar ile daha gelişmiş Palaeoanthropus veya Neoanthropus soyları arasında var olduğu varsayılan 'kayıp halka'yı ifade ediyordu. Sınıflandırma başlangıçta Endonezya'da bulunan ve alçak kafatası kubbesi ile belirgin kaş çıkıntılarıyla karakterize edilen fosil kalıntılara dayanıyordu; bunlar geçiş evresine işaret eden kanıtlar olarak görülüyordu. Modern taksonomi bu örnekleri Homo erectus olarak yeniden sınıflandırmış olsa da Pithecanthropus kavramı, insan evriminin Avrupa dışında ve çok daha eski bir zaman diliminde gerçekleştiğine dair ilk fiziksel kanıtları sağlaması bakımından tarihsel olarak önemliydi."
 andersson.223.g: "[SCOPE.sState('andersson_cave_state_scope').GetCityHubName] ... peki."
 andersson.224.t: "Australopithecus"
 andersson.224.d: "Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName]ın son keşfi [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetHerHim]i kelimenin tam anlamıyla konuşamaz hâle getirdi. Son seferinde ortaya çıkardığı fosiller en az bir milyon yıllık, hatta daha eski olmalı. Bu Australopithecus - daha çok maymun mu, yoksa daha çok insan mı?"
 andersson.224.f: "Australopithecus, 1924 yılında 'Taung Çocuğu'nun keşfinin ardından bilimsel önem kazanan ve Miyosen dönemi maymunları ile Homo cinsi arasında kesin bir bağlantı sağlayan soyu tükenmiş bir hominid cinsidir. Terim 20. yüzyılın başlarında Raymond Dart tarafından ortaya atılmış olsa da, nispeten küçük, maymun boyutlarında bir beyni iki ayaklı hareket kabiliyetiyle birleştiren bir canlıyı ortaya koyarak 19. yüzyılın evrimsel öngörülerini doğrulamıştır. Paleoantropoloji açısından Australopithecus'un tanımlanması, insanlığın 'beşiği' algısını Afrika'ya kaydırmış ve insanın kökenlerini daha önce tercih edilen Avrupa ve Asya bölgeleri yerine Afrika'da aramaya yön vermiştir."
 andersson.224.g: "Sadece rastgele bir köyün adını alıp sonuna 'İnsanı' eklediğimiz güzel eski günleri özlüyorum."
 andersson.231.t: "Çıkmaz Sokak?"
 andersson.231.d: "[SCOPE.sState('andersson_cave_site').GetName] bölgesindeki antropolojik alanı araştırırken ekip, zorlu patikalar ve dar mağara geçitleriyle de uğraşmak zorunda kaldı. Görünüşe göre mağara girişi, Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName]ın düşündüğünden tamamen farklı bir yerdeydi."
 andersson.231.f: "Görünen o ki mağaranın girişi kayalık bir çıkıntının üzerinde değil, yaklaşık 1.000 metre aşağıda. Ekip, antropolojik alandan itibaren ya uzun bir dolambaçlı yol izleyecek ya da son derece tehlikeli bir rotayı göze alacak."
 andersson.231.g: "Ekip, istese de istemese de dolambaçlı yoldan gitmek zorunda kalacak."
 andersson.231.h: "Doktor kestirme yolu kullanma riskini almalı!"
 andersson.232.t: "Mağara Çizimleri"
 andersson.232.d: "[SCOPE.sState('andersson_cave_site').GetName] mağarasında binlerce yıllık oyma ve resimler bulunuyor. Ancak bunların anlamı ve arka planı hâlâ gizemini koruyor."
 andersson.232.f: "Tarih öncesi arkeoloji ve antropolojinin ortaya çıkmasıyla birlikte, evrim teorisine dayanarak geçmişte yaşayan insanların soyut kavramları bilmediği varsayıldı. Bu nedenle sanatsal ifade ihtimali göz ardı edildi. Bu inanç, mağara resimleri keşfedildiğinde - en ünlü örneği Altamira olmak üzere - bunların sahte olduğunun düşünülmesine yol açtı. Ancak özellikle 1900'lerden sonra güneybatı Fransa'da giderek daha fazla mağara resmi ortaya çıktıkça, bilim insanları bunların gerçek olması gerektiği sonucuna vardı."
 andersson.232.g: "Atalarımız sandığımız kadar ilkel değilmiş."
 andersson.233.t: "Verimli Çalışmalar"
 andersson.233.d: "Son birkaç ay içinde [SCOPE.sCharacter('andersson_anthropologist_scope').GetFullName] çalışmalarını derinleştirdi. Şimdi [SCOPE.sState('andersson_cave_site').GetName] mağarasında çok sayıda buluntuyu katalogladı ve mağara sistemini gelecek nesiller için kayda geçirdi."
 andersson.233.f: "İnsanların ne kadar zamandır var olduğu, 19. yüzyılın uzun bir bölümü boyunca net değildi. Yüzyılın başlarında birçok bilim insanı insanlık tarihinin yalnızca birkaç bin yıldan oluştuğu fikrini çoktan terk etmişti; ancak Boucher de Perthes 1840'larda çok daha eski taş aletleri, insanların nesli tükenmiş memeli türleriyle birlikte yaşadığına kanıt olarak sunduğunda bu görüş pek kabul görmedi. Ancak tarih öncesi kalıntıların yorulmak bilmeden toplanması ve incelenmesi, kısa süre içinde insanların daha önce varsayıldığından çok daha uzun süredir dünyada yaşadığını ortaya koyan tabloyu tamamlayacaktı."
 andersson.233.g: "Bu onun için faydalı olacak."
 andersson.233.h: "Bu bilim için faydalı olacak."
 andersson.234.t: "Mağara Kazası"
 andersson.234.d: "[SCOPE.sState('andersson_cave_site').GetName] bölgesindeki mağaranın keşfi sırasında bir kaza meydana geldi. Bir asistan, yük eşeğiyle birlikte düştü. Yalnızca hafif yaralanmalar oldu, ancak ekipmanın değiştirilmesi gerekiyor."
 andersson.234.f: "'Bir kere olsun profesyonellerle çalışın!'"
 andersson.234.g: "Ah hayır!"
 andersson.236.t: "Mağara Labirenti"
 andersson.236.d: "Dr. [SCOPE.sCharacter('andersson_anthropologist_scope').GetLastName], kemik ve tarih öncesi kalıntıların toplanmasının geciktiğini bildiriyor. Birkaç önemli keşif, kemiklerin tanımlanmasına geçişi erteliyor. Bunlar önemli, çok önemli gecikmeler. Aslında ekip ile enstitü arasında haftalardır hiçbir yazışma yapılmadı. Bunun tek bir anlamı olabilir."
 andersson.236.f: "Tamamen kayboldular."
 andersson.236.g: "Aptallar!"
 andersson.237.t: "Taş Devri Aletleri"
 andersson.237.d: "[SCOPE.sCharacter('andersson_anthropologist_scope').GetFullName], mağarada geçmiş hakkında bilgi sağlayabilecek tarih öncesi taş aletler buldu."
 andersson.237.f: "19. yüzyılda antropoloji, kemik buluntularının yanı sıra sözde Taş Devri'ne ait silah ve aletleri de kapsayan, esas olarak insanlığın tarih öncesi geçmişiyle ilgilenen bir bilim dalını ifade ediyordu. O dönemde bu terim bilimsel bir kavram olmaktan ziyade barbarlıkla ilişkilendirilen bir çağı tanımlıyordu. Tarihsel gerçeklikten çok ilkel mağara adamı klişesi hâkimdi. Bununla birlikte, bu döneme ait giderek daha fazla eser ve kalıntı aranması, ilerleyen yıllarda bu görüşün farklılaştırılması ve gerçek anlamda bir tarih öncesi arkeolojinin kurulması için bir fırsat oluşturdu."
 andersson.237.g: "Aletleri inceleyin."
 andersson.237.h: "Bunların yeri müze!"
 andersson.238.t: "İnsan Kemikleri"
 andersson.238.d: "Antropoloğumuz mağara araştırması sırasında ek insan kemikleri buldu."
 andersson.238.f: "Genel kanı, 19. yüzyılın ve 20. yüzyılın başlarının yalnızca birkaç insan fosili buluntusuna sahne olduğu yönündedir. Bu yalnızca kısmen doğrudur. İlk dönem insanlarına ait bazı kemik buluntularının bu şekilde tanınmaması sıklıkla yaşanıyordu. Neandertal adı Neandertal'deki konumdan gelse de Neandertal kemikleri daha önce birkaç kez bulunmuştu. Keşfinden sonra bile Rudolf Virchow gibi önemli bilim insanları onun gerçekliğini ve yaşını sorguladı. Sorun buluntuların sayısında değil, bunların gerçekten eski dönemlere ait insan kalıntıları olduğunun doğrulanmasındaydı."
 andersson.238.g: "Nefis."
 andersson.239.t: "Asistan Fosil Buldu"
 andersson.239.d: "Bir öğrenci asistanı, [SCOPE.sState('andersson_cave_site').GetName] bölgesindeki mağarada bulunan bir antropolojik keşfin güvence altına alınmasında kritik bir rol oynadı. Ancak [SCOPE.sCharacter('andersson_anthropologist_scope').GetFullName], araştırma başkanı olarak keşiften kendisinin sorumlu olduğunu belirtiyor."
 andersson.239.f: "'Şöhret tutkusuna kapılmış o zeki genç Atinalının hikâyesini hatırlıyor musunuz? Kahine danıştı ve 'Büyük bir adam olmak için ne yapmalıyım?' diye sordu. Kahin şöyle cevap verdi: 'Birini öldür'!' - Richard Owen."
 andersson.239.g: "Bu keşfi genç antropolog yaptı."
 andersson.239.h: "Bu keşfi kıdemli antropoloğumuz yaptı."
 andersson.240.t: "Sepet Kayboldu"
 andersson.240.d: "Biraz utanç verici bir olay, kemiklerin tanımlanmasının başlamasını geciktirdi."
 andersson.240.f: "Araştırma ekibi toplama işlemini tamamlayıp antropolojik alanın başka bir bölümünü araştırırken, baş araştırmacı Dr. [SCOPE.sCharacter('andersson_anthropologist_scope').GetCharacter.GetLastName], topladıkları kemikleri ve eserleri kaybettiklerini biraz geç fark etti. Şimdiye kadar bulunan antropolojik nesneleri içeren sefer sepetini yanlış yere koymuş olmalılar. Hem de haftalar önce."
 andersson.240.g: "Her kemik değerlidir."
 andersson.240.h: "Çabuk olun!"
 andersson_conference_anthropologist_double_vote_tt: "Deneyimli antropoloğumuz sayesinde #G iki kat#! oy gücüne sahibiz."
 andersson_conference_anthropologist_triple_vote_tt: "Ünlü antropoloğumuz sayesinde #G üç kat#! oy gücüne sahibiz."
 andersson_cave_exploration_decrease_10_tt: "#R 10#! #V Keşif İlerlemesi#! kaybedilir."
 andersson_cave_exploration_decrease_20_tt: "#R 20#! #V Keşif İlerlemesi#! kaybedilir."
 andersson_cave_collection_decrease_10_tt: "#R 10#! #V Toplama İlerlemesi#! kaybedilir."
