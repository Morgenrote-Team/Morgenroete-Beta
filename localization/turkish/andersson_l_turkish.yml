 andersson.501.t: "[GetPlayer.GetCustom('andersson_fossil_piltdown')] İnsanı bir sahtekârlık!"
 andersson.501.d: "Dr. [SCOPE.sCharacter('andersson_piltdown_attacker_scope').GetCharacter.GetLastName] tarafından yürütülen kapsamlı incelemenin ardından [SCOPE.sCharacter('andersson_piltdown_attacker_scope').GetCharacter.GetSheHe], sözde insan kalıntılarının sahte olduğunu kanıtladı. Bu, [GetGlobalVariable('andersson_piltdown_country_global_var').GetCountryDefinition.GetName] için büyük bir utanç. [SCOPE.sCountry('andersson_piltdown_defender_country_scope').GetAdjectiveNoFormatting] baş antropoloğu Dr. [SCOPE.sCharacter('andersson_piltdown_defender_scope').GetLastName] bir dolandırıcı olarak ifşa edildi!"
 andersson.501.f: "[GetPlayer.GetCustom('andersson_fossil_piltdown')] İnsanı'nın keşfinden bu yana, [SCOPE.sCountry('andersson_piltdown_defender_country_scope').GetAdjectiveNoFormatting] olmayan birkaç bilim insanı buluntunun gerçekliği konusunda ciddi şüpheler dile getirmiş ve 'keşfi' [SCOPE.sCountry('andersson_piltdown_defender_country_scope').GetAdjectiveNoFormatting] ülkesinin tanınma arzusuna bağlamıştı. Saygın akademisyenlerin sahtekârlığı kanıtlama yönündeki birkaç girişimi şimdiye kadar başarısız olmuştu. Ancak [SCOPE.sCharacter('andersson_piltdown_attacker_scope').GetFullName], keşfin gerçekte ne olduğunu nihayet dünyaya gösterdi: antropoloji tarihindeki en büyük sahtekârlık. Kafatası iddia edilenden çok daha yeni olmakla ve yalnızca Orta Çağ'a ait olmakla kalmıyor; sahtekâr insan kafatasının üst kısmını bir orangutanın çeneleriyle birleştirmişti."
 andersson.501.g: "Sonunda ciddi bilim kazandı."
 andersson.502.t: "Bilimsel Bir Felaket!"
 andersson.502.g: "Eşi benzeri görülmemiş bir uluslararası utanç!"
 andersson.503.t: "Tartışma Kaybedildi"
 andersson.503.d: "[SCOPE.sCharacter('andersson_piltdown_attacker_scope').GetHerHis] sayısız argümanına rağmen Dr. [SCOPE.sCharacter('andersson_piltdown_attacker_scope').GetLastName], [GetPlayer.GetCustom('andersson_fossil_piltdown')] İnsanı'nın gerçekten bir sahtekârlık olduğuna akademi dünyasını ikna etmeyi başaramadı. Dr. [SCOPE.sCharacter('andersson_piltdown_defender_scope').GetLastName] olağanüstü bir hatip olduğunu kanıtladı."
 andersson.503.f: "Görünüşe göre [SCOPE.sCountry('andersson_piltdown_defender_country_scope').GetAdjectiveNoFormatting] bilim insanının tartışma günü hâlâ elinde birkaç koz vardı. Antropoloğumuz başarısızlığı önyargıya, rüşvetlere ve kötü bir kahvaltıya bağlıyor."
 andersson.503.g: "Belki de buluntu gerçekten doğrudur...?"
 andersson.504.t: "Bilimsel Bir Zafer"
 andersson.504.d: "Önemsiz bir ülkeden gelen önemsiz bir bilim insanının, değerli [GetPlayer.GetCustom('andersson_fossil_piltdown')] insanımızı sahte olarak ifşa etme girişimi başarısız oldu. Antropoloji Enstitüsü bu tartışmadan güçlenerek çıktı."
 andersson.504.f: "Bu kadarla yetinmeyip saçma argümanlar sunan yabancı ülkeler başka bir şey gösteremiyorsa, modern insanın [SCOPE.sCountry('andersson_piltdown_defender_country_scope').GetName] ülkesinde ortaya çıkmış olması son derece açıktır."
 andersson.504.g: "Sıradaki, lütfen!"
 andersson.511.t: "[GetPlayer.GetCustom('andersson_fossil_piltdown')] İnsanı: Tartışmaya Hazırlık"
 andersson.511.d: "Dr. [SCOPE.sCharacter('andersson_piltdown_attacker_scope').GetLastName], önemli bir fosilin sahte olduğunu ortaya çıkarmaya hazırlanıyor. [SCOPE.sCharacter('andersson_piltdown_attacker_scope').GetSheHe|U]ye Dr. [SCOPE.sCharacter('andersson_piltdown_defender_scope').GetLastName] karşı çıkacak. İkisi de hem kendi onurlarını hem de ülkelerinin itibarını savunuyor."
 andersson.511.f: "Bir antropoloğun tartışma gücü öncelikle deneyimine, ikinci olarak da karakter özelliklerine dayanır. Günlük performans dalgalanmaları da hesaba katıldığından, küçük bir şans faktörü vardır. Fosile sahip olan ülkenin hafif bir avantajı vardır; çünkü yeni bir teorinin önce yerleşik bir teoriye karşı üstünlük sağlaması gerekir. Tartışma gücü puanı daha yüksek olan antropolog tartışmayı kazanır. Beraberlik durumunda da savunmacı kazanır.\n\n[SCOPE.sCharacter('andersson_piltdown_attacker_scope').GetFullNameNoFormatting], [SCOPE.sCountry('andersson_piltdown_attacker_country_scope').GetName] ülkesinden: [SCOPE.GetValue('andersson_piltdown_attacker_points_scope')|0+] #V Tartışma Yeteneği#!\n\n[SCOPE.sCharacter('andersson_piltdown_defender_scope').GetFullNameNoFormatting], [SCOPE.sCountry('andersson_piltdown_defender_country_scope').GetName] ülkesinden: [SCOPE.GetValue('andersson_piltdown_defender_points_scope')|0+] #V Tartışma Yeteneği#!"
 andersson.511.g: "[GetGlobalVariable('andersson_piltdown_country_global_var').GetCountryDefinition.GetName] ülkesini bilim dünyasının önünde bir tartışmaya çıkarıyoruz!"
 andersson.511.h: "İkinci kez düşününce, bu pek iyi bir fikir değil."
