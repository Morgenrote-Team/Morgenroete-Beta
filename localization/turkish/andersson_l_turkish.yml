 andersson.311.t: "Yeni Tarih Öncesi İskelet"
 andersson.311.d: "Halka açık bir etkinlikte Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName], yeni tarih öncesi iskeleti halka sundu. Bilim camiası bu yeniden yapılandırmayı dikkate aldı."
 andersson.311.f: "'Ne kadar geriye bakabiliyorsan, o kadar ileriye bakabilirsin. -Raymond Dart'"
 andersson.311.g: "[GetPlayer.GetName] dünya çapında bir bilim ülkesi!"
 andersson.911.t: "Antropoloji Kongresi: Modern İnsanların Kökeni"
 andersson.911.d: "Ülkemiz, antropoloji tarihinin en önemli kongresine ev sahipliği yapacak. İnsanlığın en büyük sorularından biri, yani kökeni, açıklığa kavuşturulmaya çalışılacak. Dünyanın dört bir yanından antropologlar bunun Avrupa'da mı, Asya'da mı yoksa Afrika'da mı gerçekleştiğini tartışacak. [SCOPE.sCharacter('andersson_anthropologist_scope').GetFullName] tartışmayı yönetecek."
 andersson.911.f: "İnsan nereden geliyor? Cennetten kovulmaya ilişkin İncil hikâyesi bile bu sorunun özünü barındırır; çünkü insanın bugün yaşadığı bölgeden gelmediği açıktır. Bu nedenle Avrupa'da uzun süre eski insan kemiklerinin, Tufan'da yok olan insanların kalıntıları olduğu düşünüldü; tıpkı dinozorların uzun süre gemide yeri olmayan hayvanlar olduğunun düşünülmesi gibi. Buzul Çağı teorisinin ortaya atılması ve Dünya'nın sanılandan çok daha yaşlı olduğunu gösteren sonraki jeolojik ve paleontolojik çalışmalarla birlikte 'mağara insanlarına' duyulan ilgi arttı. En geç evrim teorisinin ortaya çıkışı ve birkaç bin yıldan daha eski tarih öncesi kemiklerin keşfiyle birlikte modern insanların kökeninin neresi olduğu sorusu daha da önem kazandı."
 andersson.911.g: "İnsanlığın beşiği nerede?"
 andersson.912.d: "[SCOPE.sCountry('andersson_congress_host_country').GetName], uluslararası bir bilim kongresine davette bulundu. Konu, modern insanların kökeni olacak. Profesör [SCOPE.sCharacter('andersson_anthropologist_scope').GetLastName] sıcak bir davet aldı."
 andersson.914.t: "Modern İnsanlar Avrupa'da mı, Asya'da mı, Afrika'da mı Ortaya Çıktı?"
 andersson.914.d: "Akademi dünyası üç kampa bölündü. İnsanlığın beşiğinin neresi olduğu sorusu yalnızca belirli bir ulusal gururla değil, aynı zamanda insan evrimi hakkındaki daha ileri tezlerle de bağlantılı."
 andersson.914.f: "Canlı bir tartışmada üç kampın savunucuları kendi argümanlarını ortaya koydu. [SCOPE.sCharacter('andersson_europe_defender_scope').GetLastName], Avrupa'yı savundu; çünkü bugüne kadar bulunan fosiller Avrupa'daki örneklerde en büyük beyin hacmini gösteriyordu. Büyük beynin dik yürümeden önce ortaya çıkması nedeniyle başka bir ihtimal düşünülemezdi. [SCOPE.sCharacter('andersson_asia_defender_scope').GetLastName] bu teoriye şüpheyle yaklaştı. Dik yürüyen, insana benzeyen temsilcilerin fosilleri Asya'da zaten bulunmuştu; dolayısıyla beyin, dik yürümenin ardından gelişmiş olmalıydı. Öte yandan [SCOPE.sCharacter('andersson_africa_defender_scope').GetLastName], insanlara en yakın bilinen maymun türlerinin Asya'dan değil Afrika'dan geldiğine dikkat çekti. Evrim teorisinin ortaya koyduğu çerçeveye göre insanlığın kökeni de burada aranmalıydı."
 andersson.914.g: "Modern insanlar Avrupa'da gelişti."
 andersson.914.h: "Her şey Asya kökenine işaret ediyor."
 andersson.914.i: "İnsanlığın beşiği Afrika'dadır."
 andersson.915.t: "Saygın Bir Konuşma"
 andersson.915.d: "[SCOPE.sCharacter('andersson_anthropologist_scope').GetFullName], [SCOPE.sCountry('andersson_congress_host_country').GetName] ülkesinde bir araya gelen bilim insanlarına, dinleyicileri ve genç akademisyenleri derinden etkileyen bir konferans verdi."
 andersson.915.f: "'Dünya, insanlığın beşiğidir; fakat insanlık sonsuza dek beşikte kalamaz.'\n -Konstantin Tsiolkovsky."
 andersson.915.g: "Profesör [SCOPE.sCharacter('andersson_anthropologist_scope').GetLastName] oldukça etkileyici."
 andersson.916.t: "Tartışmaya Değerli Bir Katkı"
 andersson.916.d: "Profesör [SCOPE.sCharacter('andersson_anthropologist_scope').GetFullName] tarafından verilen parlak bir bilimsel konferans, [SCOPE.sCountry('andersson_congress_host_country').GetName] ülkesindeki bilim kongresinde akademi dünyasının ufkunu genişletti. Muhtemelen uzun süre etkisini sürdürecek."
 andersson.916.f: "'Pek çok konuda çok tuhaf teorileri vardı. Hatta bir keresinde British Association'da ayağa kalkıp maymunların da tıpkı insanlar gibi beyinlerinde hippokampus major bulunduğunu söylemişti. Söylenebilecek en sarsıcı şeydi; çünkü bu doğruysa ölümsüz milyonların imanı, umudu ve sevgisi ne olacaktı? Sizinle bir maymun arasındaki konuşabilmek, makineler yapabilmek, doğru ile yanlışı bilmek, dua etmek ve bunun gibi küçük ayrıntılar gibi başka önemli farkların olduğunu düşünebilirsiniz; fakat bunlar sevgili dostum, çocukça bir hayalden ibarettir. Güvenebileceğiniz tek şey büyük hippokampus testidir. Beyninizde hippokampus major varsa, dört eliniz, hiç ayağınız olmasa ve tüm maymunlardan daha maymunsu görünseniz bile maymun değilsiniz.' -Charles Kingsley"
 andersson.917.t: "Antropolojik Miras"
 andersson.917.d: "Kongrede, ünlü bir antropoloğun birkaç gün önce hayatını kaybettiği yönündeki üzücü haber duyuruldu. Özel koleksiyonu açık artırmaya çıkarılacak."
 andersson.917.f: "'Adamın ne çocuğu, ne karısı, ne de arkadaşı vardı; ama bir sürü eski taşı ve kemiği vardı. Ne kutsanmış bir hayat!'"
 andersson.917.g: "Her kemik koleksiyonumuz için değerlidir."
 andersson.917.h: "...ama yeterince kemiğimiz var."
 andersson.919.t_europe: "Modern insanlar Avrupa'dan geliyor"
 andersson.919.t_asia: "Modern insanlar Asya'dan geliyor"
 andersson.919.t_africa: "Modern insanlar Afrika'dan geliyor"
 andersson.919.d_europe: "Uluslararası bilim dünyası, modern insanlığın Avrupa kökenli olduğu konusunda anlaşmaya vardı. Avrupalı olmayan bilim insanları bu kararı üstünlükçülük olarak kınadı."
 andersson.919.d_asia: "Uluslararası Antropoloji Kongresi kısa süre önce, insanların Asya'dan gelmiş olması gerektiği yönünde bir uzlaşmaya vardı. Meclis üyelerinin çoğu bu görüşü destekledi."
 andersson.919.d_africa: "Oldukça tartışmalı geçen son oturumun ardından bilim insanları, dar bir çoğunlukla insanlığın kökeninin Afrika'da olması gerektiği konusunda anlaşabildi."
 andersson.919.f_europe: "Tarihsel olarak insanlığın gerçek kökeninin neresi olduğu sorusu 20. yüzyılın başlarında çözüme kavuşmuş değildi. Sözde Piltdown İnsanı'nın keşfiyle kısmen yanıltılan küçük bir grup, modern insanın kökenini bilimsel olmaktan çok ideolojik nedenlerle Avrupa'da ararken, Asya teorisi en fazla desteği görüyordu. Cava'daki keşifler ve Pekin İnsanı'nın bulunması bunda büyük rol oynadı. Ancak 20. yüzyılın ortalarından itibaren giderek artan Afrika buluntuları bu görüşü sarsmaya başladı."
 andersson.919.f_asia: "Tarihsel olarak insanlığın gerçek kökeninin neresi olduğu sorusu 20. yüzyılın başlarında çözüme kavuşmuş değildi. Sözde Piltdown İnsanı'nın keşfiyle kısmen yanıltılan küçük bir grup, modern insanın kökenini bilimsel olmaktan çok ideolojik nedenlerle Avrupa'da ararken, Asya teorisi en fazla desteği görüyordu. Cava'daki keşifler ve Pekin İnsanı'nın bulunması bunda büyük rol oynadı. Ancak 20. yüzyılın ortalarından itibaren giderek artan Afrika buluntuları bu görüşü sarsmaya başladı."
 andersson.919.f_africa: "Tarihsel olarak insanlığın gerçek kökeninin neresi olduğu sorusu 20. yüzyılın başlarında çözüme kavuşmuş değildi. Sözde Piltdown İnsanı'nın keşfiyle kısmen yanıltılan küçük bir grup, modern insanın kökenini bilimsel olmaktan çok ideolojik nedenlerle Avrupa'da ararken, Asya teorisi en fazla desteği görüyordu. Cava'daki keşifler ve Pekin İnsanı'nın bulunması bunda büyük rol oynadı. Ancak 20. yüzyılın ortalarından itibaren giderek artan Afrika buluntuları bu görüşü sarsmaya başladı."
 andersson.919.g: "Beklendiği gibi, insanlık Avrupa'da evrimleşti."
 andersson.919.h: "Tüm kanıtlar, insanlığın Asya'da evrimleştiğini gösteriyor."
 andersson.919.i: "'Afrika'dan Çıkış' artık kabul edilmiş bir tez."
