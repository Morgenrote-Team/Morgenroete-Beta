 je_andersson_hominid_expedition: "Hominid Seferi"
 je_andersson_hominid_expedition_reason: "#p Hominid seferi şu anda [SCOPE.sState('target').GetCountry.GetName] ülkesindeki [SCOPE.sState('target').GetName] bölgesinde gerçekleştiriliyor.#!\n$mr_divider_for_je$\nAntropologların insan fosilleri arayışı üç aşamaya ayrılır: keşif, toplama ve tanımlama. Keşif sırasında antropolog, bölgede uygun bir antropolojik alan arar. Ancak bundan sonra fosil toplamaya başlar. Yeterli sayıda fosil bulunduğunda tanımlama sürecine geçer. Keşif ve toplama, bir keşif olayıyla sonuçlanır. Tanımlama sırasında yeni bir hominid türü de belirlenebilir."
 andersson_je_no_subject_anymore_tt: "[GetPlayer.GetName], seferin gerçekleştirildiği tâbi eyaletin artık hâkimi değil."
 andersson_hominid_expedition_modifier: "Hominid Seferi"
 andersson.205.t: "Hominid Seferi: Tür"
 andersson.205.d: "Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] bir sefer düzenleyebilmeden önce, hedefin hangi tür hominid olması gerektiğine karar verilmelidir."
 andersson.205.f: "'Evrim bir teori, bir sistem veya bir hipotez midir? Bundan çok daha fazlasıdır: tüm teorilerin, tüm hipotezlerin ve tüm sistemlerin boyun eğmek ve bundan böyle doğru ve düşünülebilir olabilmek için uymak zorunda olduğu genel bir koşuldur.' -Pierre Teilhard de Chardin"
 andersson.206.t: "Hominid Seferi: Bölge"
 andersson.206.d: "Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName], asistanlarına bir sefer için araştırmaya değer yabancı bölgelerin haritalarını çoktan getirtti. Ancak henüz bir karar verilmedi."
 andersson.206.f: "'Bir hominidin erken Pleistosen döneminde Avrupa'da bulunup bulunmadığı konusunda açık fikirliydim.' -Louis Leakey"
 andersson.213.t: "Hominid Seferi: Tamamlandı"
 andersson.213.d: "Zorlu ama değerli bir seferin ardından Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] ve ekibi sağ salim geri döndü. Antropoloji Enstitüsü artık birkaç kemik daha zengin."
 andersson.213.f: "Şimdi bu da bitti... ben de bittim. -Robert Broom (ölümünden kısa süre önce Australopithecus hakkındaki monografisini tamamladığında)"
 andersson.225.d: "Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName], [SCOPE.sCountry('andersson_cave_country_scope').GetName] ülkesindeki bir mağarada muhteşem bir keşifte bulundu!"
