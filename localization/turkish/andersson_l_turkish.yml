 andersson.401.t: "Av Kampı"
 andersson.401.d: "Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName], mağarabilim araştırmaları sırasında [SCOPE.sState('andersson_state_scope').GetName] bölgesinde Mezolitik Dönem'e tarihlendirdiği bir av kampına rastladı."
 andersson.401.f: "Kısa bir araştırmanın ardından antropolog, çok sayıda tarih öncesi eseri güvence altına aldı. Bunlar arasında mızraklar ve ok uçlarının yanı sıra Neolitik Dönem'e ait olabilecek bir el baltası da bulunuyordu. Daha ayrıntılı incelemeler üniversiteye dönüldüğünde yapılacak."
 andersson.401.g: "Bu bize geçmiş hakkında yeni bilgiler sağlayacak."
 andersson.402.t: "Çanak Çömlek"
 andersson.402.d: "Antropologlar ve arkeologlar [SCOPE.sState('andersson_state_scope').GetName] bölgesinde bazı çanak çömlekler ortaya çıkarmayı başardı. Müze koleksiyonunda çok güzel görünecekler."
 andersson.402.f: "Antropologların bulduğu kaplar, zaten birkaç bin yıllık oldukları bilinmese ilkel olarak nitelendirilebilirdi. Bu açıdan bakıldığında oldukça gelişmiş görünüyorlar. Uzmanlar, çömlekleri boya kalıntıları açısından incelemekle şimdiden görevlendirildi."
 andersson.402.g: "Dikkatli taşıyın!"
 andersson.403.t: "Neolitik Köy"
 andersson.403.d: "[SCOPE.sState('andersson_state_scope').GetName] bölgesindeki bir antropoloji ekibinden iyi haberler geldi: biraz şansla Neolitik Dönem'e ait bir yerleşimin kalıntılarını buldular. Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName], bu döneme ait çok sayıda eser ve yeni bilgiler elde edeceğinden emin."
 andersson.403.f: "Görünüşe göre yerleşimde zaten bir palisad benzeri çevreleme bulunuyordu; ayrıca bir kuyu ve ahırlar ile bir tahıl ambarı da tespit edilebildi. Bu, ülkemizde belgelenmiş en eski yerleşimlerden biri olabilir."
 andersson.403.g: "Bilimsel bir sansasyon!"
 andersson.404.t: "İnsan Kemikleri"
 andersson.404.d: "Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] birkaç yeni kemik buldu."
 andersson.404.f: "Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName]ın liderliğinde bir antropolog ekibi, binlerce yıllık kemikler içeren bir mezarlık alanını güvence altına aldı; bunlar arasında son derece iyi korunmuş bazı parçalar da vardı."
 andersson.404.g: "Umarım çorba kemiklerinde yaşadığımız hayal kırıklığının bir yenisi olmaz."
 andersson.406.t: "Tarih Öncesi Bir Kemik Flüt"
 andersson.406.d: "Bir yürüyüşçü, [SCOPE.sState('andersson_state_scope').GetName] bölgesindeki bir mağarada garip bir kemiğe rastladı. Yerel üniversiteyle iletişime geçilmesinin ardından Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] mağaraya gönderildi. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetSheHe|U] bir kemik buldu, ancak bu sıradan bir kemik değildi; tarih öncesi bir kemik flüttü!"
 andersson.406.f: "\"Bir kemik flütün berrak ve tiz düdük sesi, herkesi ürkütücü biçimde büyüleyen melekvari bir sestir.\""
 andersson.406.g: "Hâlâ müzik çalabiliyor mu?"
 andersson.408.t: "Kemikler ve Taş Aletler Ortaya Çıkarıldı"
 andersson.408.d: "[SCOPE.sState('andersson_state_scope').GetName] bölgesinde çok sayıda taş alet ve kemik gün yüzüne çıkarıldı. Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] derhal araştırma yapmak üzere gönderildi. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetSheHe|U] gerçekten de çok sayıda kemik buldu; görünüşe göre her türlü canlıya ait kemikler vardı ve bunlara bazı taş eserler de eşlik ediyordu.\"andersson.408.f: \"\"Sanırım bu bir geyik kemiği. Yoksa insan mı? Belki bir dinozor? Bir köpekbalığı? Dev bir maymun? Kemikler gerçekten uzmanlık alanım değil...\""
 andersson.408.f: "\"Sanırım bu bir geyik kemiği. Yoksa insan mı? Belki bir dinozor? Bir köpekbalığı? Dev bir maymun? Kemikler gerçekten uzmanlık alanım değil...\""
 andersson.408.g: "Bekleyin! Bunlar ne tür kemikler? Modern mi? Tarih öncesi mi? Dinozor mu?"
 andersson.409.t: "Tarih Öncesi Venüs Keşfedildi"
 andersson.409.d: "[SCOPE.sState('andersson_state_scope').GetStateRegion.GetMineHubName] bölgesinde Taş Devri'ne ait tarih öncesi bir figürin keşfedildi. Küçük fildişi figürinin geniş kalçaları ve büyük göğüsleri varmış gibi görünmesi nedeniyle birçok kişi görünüşünden hoşlanmıyor. Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] figürinin ne amaçla yapıldığından henüz emin değil; bir tanrıça mı yoksa sadece bir tılsım mı?"
 andersson.409.f: "Venüs figürinleri, özellikle Gravettien döneminde (MÖ yaklaşık 30.000-22.000) Üst Paleolitik dönemde yapılmış küçük, tarih öncesi kadın heykelcikleridir. Avrupa'nın genelinde ve Sibirya'ya kadar uzanan bölgelerde bulunan bu figürinler genellikle taş, fildişi, kemik veya kilden yapılmıştır. Birçoğunda göğüsler, kalçalar ve karın abartılı biçimde tasvir edilirken yüz ayrıntıları çoğunlukla bulunmaz. Ünlü örnekler arasında Willendorf Venüsü ve Dolní Věstonice Venüsü bulunur. Amaçları hâlâ tartışmalıdır; doğurganlık sembolleri, ritüel nesneler, kendi kendini temsil biçimleri veya toplumsal kimliğin ifadeleri olarak yorumlanmışlardır. Venüs figürinleri, erken sembolik sanatın önemli örnekleri kabul edilir."
 andersson.409.g: "[SCOPE.sState('andersson_state_scope').GetStateRegion.GetMineHubName] Venüsü olarak tanınacak."
