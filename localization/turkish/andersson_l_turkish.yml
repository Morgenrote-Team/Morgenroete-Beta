 andersson.202.a: "Hominid Araştırması: Hedef"
 andersson.202.d: "Hominid Araştırması, bir Arkeolojik Sefer veya Pasifik Seferi kadar maceralı olmayabilir, ancak zaman zaman kendine özgü zorlu şartlar ortaya çıkarabilir. Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName], insan kemiklerine yönelik ayrıntılı incelemeye başlamak için şimdiden bekliyor. Geriye tek bir soru kalıyor: ekip hangi bölgede araştırma yapmalı?"
 andersson.202.f: "'Sayın beyler, insanlığın kökenlerine doğru heyecan verici bir yolculuğa çıkıyoruz! Bilimsel merak, tutkulu bir keşif ruhu ve sarsılmaz bir disiplin bekliyorum!\n\nNot: Lütfen köpeklerinizi evde bırakın. Bu sizin için de geçerli, Profesör Schabernack!'\n\nİmza: [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetFullName]"
