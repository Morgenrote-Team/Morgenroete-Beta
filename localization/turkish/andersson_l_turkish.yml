 je_andersson_anthropological_research_reason: "[ROOT.GetCountry.GetCustom('je_andersson_anthropological_default_research_active_type')]Boşta olan bir [concept_andersson_anthropologist], kendi ülkesinde Antropolojik Araştırma yapacaktır. Bazen bir [concept_andersson_cave] bulabilirler. Uzun süre mağara araştırmaları ve kazıları yapan antropologlar, #V $dubois_paleontologist$#! veya #V $lepsius_archaeologist$#! [concept_character_trait] özelliğini kazanabilir; ancak bu ikisinden yalnızca birini elde edebilirler. Her çalışma yılı, bir @andersson_human_fossil! [concept_andersson_human_fossil] kazandıracaktır.\n\n$mr_divider_for_je$\nAntropologlar ayrıca aşağıdaki faktörlere bağlı olarak ek @andersson_human_fossil! [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] veya @andersson_prehistoric_artifact! [Concept('concept_andersson_prehistoric_artifact','$concept_andersson_prehistoric_artifacts$')] bulabilir:\n[ROOT.GetCountry.GetCustom('je_andersson_anthropological_default_research_anthropologist_paleontologist_trait_type')][ROOT.GetCountry.GetCustom('je_andersson_anthropological_default_research_anthropologist_archaeologist_trait_type')][ROOT.GetCountry.GetCustom('je_andersson_anthropological_default_research_anthropologist_speleologist_trait_type')][ROOT.GetCountry.GetCustom('je_andersson_anthropological_default_research_cave_type')]"
 je_andersson_hominid_prospecting_neoanthropus: "Hominid Araştırması: Neoanthropus"
 je_andersson_hominid_prospecting_neoanthropus_reason: "#p Hominid araştırması şu anda [SCOPE.sState('target').GetName] bölgesinde yürütülüyor.#!\n$mr_divider_for_je$\nAntropologların insan fosilleri arayışı üç aşamaya ayrılır: keşif, toplama ve tanımlama. Keşif sırasında antropolog, bölgede uygun bir antropolojik alan arar. Ancak bundan sonra fosil toplamaya başlar. Yeterli sayıda fosil bulunduğunda tanımlama sürecine geçer. Keşif ve toplama, bir keşif olayıyla sonuçlanır. Tanımlama sırasında yeni bir hominid türü de belirlenebilir.\n\n$mr_divider_for_je$\n[GetGeographicRegion('andersson_geographic_region_neoanthropus').GetName], dünya çapında yayılış gösteren bir türdür. Geleneksel olarak aşağıdaki türler bu kategoriye dâhil edilir:\n- [GetGeographicRegion('andersson_geographic_region_vero').GetName]\n- [GetGeographicRegion('andersson_geographic_region_lagoa_santa').GetName]\n- [GetGeographicRegion('andersson_geographic_region_cro_magnon').GetName]\n- [GetGeographicRegion('andersson_geographic_region_boskop').GetName]\n- [GetGeographicRegion('andersson_geographic_region_tianyuan').GetName]\n- [GetGeographicRegion('andersson_geographic_region_talgai').GetName]"
 je_andersson_hominid_prospecting_palaeanthropus: "Hominid Araştırması: Palaeanthropus"
 je_andersson_hominid_prospecting_palaeanthropus_reason: "#p Hominid araştırması şu anda [SCOPE.sState('target').GetName] bölgesinde yürütülüyor.#!\n$mr_divider_for_je$\nAntropologların insan fosilleri arayışı üç aşamaya ayrılır: keşif, toplama ve tanımlama. Keşif sırasında antropolog, bölgede uygun bir antropolojik alan arar. Ancak bundan sonra fosil toplamaya başlar. Yeterli sayıda fosil bulunduğunda tanımlama sürecine geçer. Keşif ve toplama, bir keşif olayıyla sonuçlanır. Tanımlama sırasında yeni bir hominid türü de belirlenebilir.\n\n$mr_divider_for_je$\n[GetGeographicRegion('andersson_geographic_region_palaeanthropus').GetName], Avrupa ve Yakın Doğu'da bulunur. Geleneksel olarak aşağıdaki türler bu kategoriye dâhil edilir:\n- [GetGeographicRegion('andersson_geographic_region_neanderthal').GetName]\n- [GetGeographicRegion('andersson_geographic_region_gibraltar').GetName]\n- [GetGeographicRegion('andersson_geographic_region_spy').GetName]\n- [GetGeographicRegion('andersson_geographic_region_krapina').GetName]\n- [GetGeographicRegion('andersson_geographic_region_galilee').GetName]"
 je_andersson_hominid_prospecting_pithecanthropus: "Hominid Araştırması: Pithecanthropus"
 je_andersson_hominid_prospecting_pithecanthropus_reason: "#p Hominid araştırması şu anda [SCOPE.sState('target').GetName] bölgesinde yürütülüyor.#!\n$mr_divider_for_je$\nAntropologların insan fosilleri arayışı üç aşamaya ayrılır: keşif, toplama ve tanımlama. Keşif sırasında antropolog, bölgede uygun bir antropolojik alan arar. Ancak bundan sonra fosil toplamaya başlar. Yeterli sayıda fosil bulunduğunda tanımlama sürecine geçer. Keşif ve toplama, bir keşif olayıyla sonuçlanır. Tanımlama sırasında yeni bir hominid türü de belirlenebilir.\n\n$mr_divider_for_je$\n[GetGeographicRegion('andersson_geographic_region_pithecanthropus').GetName], Avrupa, Afrika ve Asya'da bulunur. Geleneksel olarak aşağıdaki türler bu kategoriye dâhil edilir:\n- [GetGeographicRegion('andersson_geographic_region_heidelberg').GetName]\n- [GetGeographicRegion('andersson_geographic_region_rhodesian').GetName]\n- [GetGeographicRegion('andersson_geographic_region_peking').GetName]\n- [GetGeographicRegion('andersson_geographic_region_java').GetName]"
 je_andersson_hominid_prospecting_australopithecus: "Hominid Araştırması: Australopithecus"
 je_andersson_hominid_prospecting_australopithecus_reason: "#p Hominid araştırması şu anda [SCOPE.sState('target').GetName] bölgesinde yürütülüyor.#!\n$mr_divider_for_je$\nAntropologların insan fosilleri arayışı üç aşamaya ayrılır: keşif, toplama ve tanımlama. Keşif sırasında antropolog, bölgede uygun bir antropolojik alan arar. Ancak bundan sonra fosil toplamaya başlar. Yeterli sayıda fosil bulunduğunda tanımlama sürecine geçer. Keşif ve toplama, bir keşif olayıyla sonuçlanır. Tanımlama sırasında yeni bir hominid türü de belirlenebilir.\n\n$mr_divider_for_je$\n[GetGeographicRegion('andersson_geographic_region_australopithecus').GetName], Afrika'da bulunur."
 je_andersson_cave_exploration: "Mağara Araştırması"
 je_andersson_cave_exploration_reason: "#p Mağara araştırması şu anda [SCOPE.sState('target').GetName] bölgesinde yürütülüyor.#!\n$mr_divider_for_je$\nMağara araştırması tamamen mağaracılık incelemelerine dayanır. Bu nedenle deneyimli antropologlar mağaraları daha hızlı araştırabilir. [SCOPE.sState('target').GetNameNoFormatting] bölgesindeki mağara hangi sırları barındırıyor olabilir?"
