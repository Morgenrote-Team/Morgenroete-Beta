 andersson.801.t: "Homo Sapiens"
 andersson.801.d: "Dr. [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName], sözde Neoanthropus'un çeşitli türleri hakkındaki kafa karışıklığını giderdi ve sonunda bunların yalnızca tek bir türün varyantları olduğu sonucuna vardı: Homo Sapiens."
 andersson.801.f: "Neoanthropus'tan Homo sapiens'e geçiş, 20. yüzyıl paleoantropolojisinde önemli bir değişime işaret eder. İlk olarak 1920'ler ile 1950'ler arasında yaygınlaşan Neoanthropus ('yeni insan'), modern insanları Neandertaller gibi arkaik soylardan ayırmak için kullanılan tipolojik bir kategoriydi. Bu terim, artık geçerliliğini yitirmiş 'Presapiens teorisi'nin merkezinde yer alıyordu. 1950'lerdeki Modern Sentez sırasında, özellikle Ernst Mayr gibi evrimsel biyologlar nüfus temelli ve daha titiz bir taksonomi anlayışını savundu. Gereksiz cins adlarının çoğalmasına karşı çıkarak Linnaeus'un Homo sapiens (1758) sınıflandırmasına geri dönülmesini önerdiler. Bu yeniden sınıflandırma, katı morfolojik 'tiplerin' yerine birleşik bir biyolojik tür kavramını getirdi. Sonuç olarak Neoanthropus terk edildi ve tüm modern insanlar evrimsel sürekliliği vurgulayan tek bir takson olan Homo sapiens altında birleştirildi."
 andersson.801.g: "Antropoloji çocukluk çağını geride bırakıyor."
 andersson.802.t: "Homo Neanderthalensis"
 andersson.802.d: "Dr. [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName], sözde Palaeanthropus'un çeşitli türleri hakkındaki kafa karışıklığını giderdi ve sonunda bunların yalnızca tek bir türün varyantları olduğu sonucuna vardı: Homo Neanderthalensis."
 andersson.802.f: "Palaeanthropus'tan Homo neanderthalensis'e geçiş, 20. yüzyılın ortalarında hominid taksonomisinin tek bir çatı altında toplanmasını ifade eder. Başlangıçta Palaeanthropus ('eski insan'), başta Neandertaller olmak üzere arkaik insanları modern soy çizgilerinden ayırmak için kullanılan geniş bir kategoriydi. Bu terminoloji, arkaik biçimleri ayrı ve doğrusal 'evrimsel aşamalar' olarak gören 20. yüzyılın başlarındaki tipolojik düşünceyi yansıtıyordu. 1940'lar ve 1950'lerdeki Modern Sentez sırasında Ernst Mayr gibi bilim insanları Homo cinsi altında birleşik bir sınıflandırma yapılmasını savundu. Belirsiz Palaeanthropus terimi, Homo neanderthalensis (veya Homo sapiens neanderthalensis) lehine terk edildi ve Neandertaller ayrı bir 'ilkel' tipten ziyade biyolojik bir popülasyon olarak ele alındı. Bu değişim evrimsel sürekliliği vurguladı ve Neandertalleri modern insanların uzmanlaşmış kardeş soyu olarak kabul eden günümüzdeki çerçevenin temelini oluşturdu."
 andersson.803.t: "Homo Erectus"
 andersson.803.d: "Dr. [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName], sözde Pithecanthropus'un çeşitli türleri hakkındaki kafa karışıklığını giderdi ve sonunda bunların yalnızca tek bir türün varyantları olduğu sonucuna vardı: Homo Erectus."
 andersson.803.f: "Pithecanthropus'tan Homo erectus'a geçiş, farklı bölgelerde bulunan çeşitli fosil buluntularının tek ve küresel bir tür altında birleştirilmesini ifade eder. Pithecanthropus ('maymun-insan') adı, Eugène Dubois tarafından 1891'de Cava İnsanı keşfi için ortaya atılmış ve insan olmayan primatlar ile modern insanlar arasında bir 'kayıp halka'yı ifade etmesi amaçlanmıştı. 20. yüzyılın başlarında Sinanthropus (Pekin İnsanı) gibi farklı adların kullanılması hominid taksonomisini daha da karmaşıklaştırdı. Kesin değişim, 1950 civarında Modern Sentez sırasında Ernst Mayr'ın çalışmalarıyla gerçekleşti. Mayr, Asya ve Afrika'daki örnekler arasındaki anatomik farklılıkların farklı cinslere ait olmaktan ziyade popülasyon düzeyindeki farklılıklar olduğunu savundu. Bu fosillerin Homo erectus olarak yeniden sınıflandırılması, tipolojik 'kayıp halka arayışından' birleşik bir biyolojik tür anlayışına geçişi sağladı ve Homo cinsi içinde geniş bir coğrafyaya yayılmış, son derece uyumlu bir atayı tanımladı."
