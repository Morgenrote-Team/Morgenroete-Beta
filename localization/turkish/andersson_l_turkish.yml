 rule_andersson_anthropology_rule: "#tooltip:[GetRawTextTooltipTag('mr_morgenroete_tt')] @mr_morgenroete_icon! #! Antropoloji Kuralları\" setting_andersson_anthropology_historical_rule: \"#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_andersson_anthropology_historical_rule_desc Historical#!#!"
 setting_andersson_anthropology_historical_rule: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_andersson_anthropology_historical_rule_desc Tarihsel#!#!"
 setting_andersson_anthropology_historical_rule_desc: "Tarihsel bir tarihten itibaren [Concept('concept_andersson_human_fossil','$MR_FOSSILS$')] bulunabilir. Tarihsel bir olayın parçası olarak keşfedilen insan fosilleri antropolojik prestij kazandırmaz. Bir ülke tarihsel tarihten önce bir insan fosili keşfederse, bu keşif bulunduğu bölgenin adına göre genel bir isim alır."
 setting_andersson_anthropology_free_rule: "#tooltippable #tooltip:[GetPlayer.GetTooltipTag],setting_andersson_anthropology_free_rule_desc Serbest#!#!"
 setting_andersson_anthropology_free_rule_desc: "[concept_andersson_human_fossil] buluntularıyla ilişkili belirli tarihsel olaylar yoktur. Tüm buluntular, keşfedildikleri bölgenin adına göre genel bir isim alır."
 andersson_has_active_anthropologist_tt: "Meşgul olmayan bir [concept_andersson_anthropologist] sahibi."
 andersson.106.t: "Antropoloji Ekibi Ayrılıyor"
 andersson.106.d: "Antropoloji ekibi çalışmalarını tamamladıktan sonra araştırma görevlileri ülkelerine geri dönüyor. Buldukları mağaralar artık bilim insanlarımızın da erişimine açık."
 andersson.106.f: "\"Bizden önce hiç kimse bu derinliklere inmemişti; nereye gittiğimizi ve ne göreceğimizi kimse bilmiyordu. Daha önce hiç bu kadar tuhaf ve güzel bir şeyle karşılaşmamıştık ve kendiliğinden hepimiz aynı soruyu birbirimize sorduk: Acaba rüya mı görüyoruz?\" -Charles Lyell"
 andersson.106.g: "Eskiden faydalı olan yabancı yardımdı."
 andersson_anthropologist_dies_tt: "[concept_andersson_anthropologist] ölürse Günlük Girdisi başarısız olur."
 je_andersson_reconstruct_prehistoric_skeleton: "Tarih Öncesi İskeleti Yeniden Yapılandır"
 je_andersson_reconstruct_prehistoric_skeleton_reason: "Antropologlar, deneyimlerine ve özelliklerine dayanarak iskeletleri yeniden yapılandırır. Bir insan türünün — Neoanthropus, Palaeanthropus, Pithecanthropus veya Australopithecus — ilk iskeleti ayrıca enstitide sergilenir ve Prestij bonusu sağlar. Antropologlar ayrıca çeşitli insan türlerine ait diğer tüm iskeletleri de yeniden yapılandırarak ek antropolojik prestij kazanabilir."
