 andersson.405.t: "[SCOPE.sState('andersson_state_scope').GetFarmHubName] Megalitleri"
 andersson.405.d: "Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName], [SCOPE.sState('andersson_state_scope').GetFarmHubName] bölgesindeki megalitlere büyük ilgi duymaya başladı ve bunların geçmişini ayrıntılı biçimde inceledi. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetSheHe|U] kısa süre önce, büyük ölçüde varsayımsal olan bu Neolitik yapılar hakkındaki çalışmalarını yayımlayarak antropoloji camiasının dikkatini çekti."
 andersson.405.f: "Megalit kültürü, MÖ 4500 ile 1500 yılları arasında toplulukların anıtsal ibadet ve mezar alanları inşa etmek için devasa taş bloklar kullandığı Neolitik Dönem'e ait bir olguyu ifade eder. Atlantik kıyılarından Akdeniz'e kadar bu yapılar, Avrupa'nın ilk kalıcı kutsal peyzajını şekillendirdi. Biçimleri, tek başına duran menhirlerden ve Carnac'taki gibi kilometrelerce uzanan taş sıralarından, toplu mezar alanı olarak kullanılan masa biçimli dolmenlere kadar uzanır. En karmaşık örnekler ise dairesel henge yapılardır; bunların en ünlüsü olan Stonehenge, hassas bir astronomik hizalanma sergiler. Tonlarca ağırlığındaki megalitlerin taşınması ve dikilmesi, ileri statik ve lojistik bilgisiyle birlikte muazzam bir toplumsal örgütlenme gerektiriyordu."
 andersson.405.g: "Atalarımız gerçekten 5.000 yıl önce bunu mu inşa etti?"
 andersson.407.t: "Kafatasları, Kafatasları ve Daha Fazla Kafatası!"
 andersson.407.d: "[SCOPE.sState('andersson_state_scope').GetName] bölgesinde korkunç bir yıkım yaşanıyor. Herkes bu yaygın yıkımdan zarar görüyor. Herkes mi? Hayır! Dr. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName], çok sayıda yakın zamanda gömülmüş insan kafatası buldu ve [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetSheHe|U] bunları incelemek üzere topladı!"
 andersson.407.f: "'Kraniyolojik çalışmalarım için ne kadar da çok güzel kafatası!'"
 andersson.407.g: "Bu biraz ürkütücü."
