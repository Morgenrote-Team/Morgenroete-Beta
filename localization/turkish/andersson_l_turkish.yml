 andersson.601.t_neolithic: "Neolitik Çağ"
 andersson.601.t_mesolithic: "Mezolitik Çağ"
 andersson.601.t_upper_paleolithic: "Üst Paleolitik Çağ"
 andersson.601.d: "Dr. [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName], tarih öncesi dönemdeki yaşamı canlandıran serginin hazırlıklarını tamamladı. Yalnızca öğrenciler ve profesörler değil, halktan ilgili ziyaretçiler de eski çağlardaki yaşama dair bir fikir edinmek için heykelleri inceliyor."
 andersson.601.f_neolithic: "Neolitik Dönem veya Yeni Taş Devri, göçebe avcı-toplayıcılıktan yerleşik tarıma geçişle karakterize edilen ve insan yaşamında köklü bir dönüşümü temsil eden dönemdir. Bu çağda insanlar bitki ve hayvanları sistematik olarak evcilleştirmeye başladı ve böylece daha güvenilir bir gıda kaynağı elde edildi. Bu değişim, insanların ahşap, taş veya kerpiçten dayanıklı konutlar inşa etmesiyle kalıcı yerleşimlerin kurulmasını kolaylaştırdı. Ortaya çıkan gıda fazlası daha büyük nüfusları destekledi ve çömlekçilik ile dokumacılık gibi uzmanlaşmış işlerin ortaya çıkmasına olanak sağladı. Teknolojik açıdan bu dönem, cilalı taş aletlerin kullanımı ve toplumsal hiyerarşilerin gelişmesiyle tanımlanır."
 andersson.601.f_mesolithic: "Mezolitik veya Orta Taş Devri, Paleolitik ile Neolitik çağlar arasında geçiş dönemi olarak hizmet etti. Son Buzul Çağı'nın ardından başlayan bu dönem, insanların değişen ekosistemlere uyum sağlamak zorunda kalmasına neden olan ısınan iklim ve buzulların geri çekilmesiyle tanımlandı. Atalarının aksine Mezolitik insanlar, çentikli mızraklar ve oklar gibi bileşik aletler oluşturmak için kullanılan küçük ve gelişmiş çakmaktaşı bıçakları olan mikrolitlerden yararlandı. Toplumlar büyük ölçüde göçebe kalmaya devam etse de, balıkların, orman hayvanlarının ve yabani bitkilerin bolluğunun artması daha istikrarlı mevsimsel yaşam biçimlerine ve geçici üs kamplarının kullanımına olanak sağladı."
 andersson.601.f_upper_paleolithic: "Üst Paleolitik veya Geç Taş Devri, Paleolitik çağın son evresini temsil eder ve insan yaratıcılığı ile bilişsel karmaşıklığında büyük bir patlamayla tanımlanır. Bu dönemde Homo sapiens son derece uzmanlaşmış bıçak teknolojileri geliştirdi ve çakmaktaşı, kemik ve boynuzdan gelişmiş aletler üretti. İnsanlar, ren geyikleri ve mamutlar gibi büyük göçmen sürüleri uçsuz bucaksız tundralarda takip eden göçebe avcı-toplayıcılar olarak yaşadı. Hayatta kalmanın ötesinde bu çağ, figüratif sanatın ve sembolik ifadenin doğuşuyla dikkat çeker. İnsanlar karmaşık mağara resimleri, özenle işlenmiş kişisel süs eşyaları ve ünlü 'Venüs' figürinleri yarattı; bunlar karmaşık dilin ve manevi inançların geliştiğine işaret eder."
 andersson.601.g: "Muhteşem!"
 andersson.64.t: "Clovis Uçları"
 andersson.64.d: "Clovis, New Mexico'da Dr. [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName], bugüne kadar bulunan en eski yerli Amerikalı izlerini keşfetti; mızrak uçları, araştırmacıların kıtada daha önce bulduğu her şeyden çok daha eski."
 andersson.64.f: "20. yüzyılın başlarında Clovis uçlarının keşfi, Amerikan arkeolojisi ve antropolojisinde devrim yarattı. Kendine özgü şekilleri ve yivli yapılarıyla dikkat çeken bu taş mızrak uçları ilk kez 1920'lerin sonları ile 1930'ların başlarında New Mexico, Clovis yakınlarında tanımlandı. Çığır açıcı gelişme, bu aletlerin nesli tükenmiş Pleistosen megafaunasına, özellikle mamut kalıntılarına doğrudan eşlik eder şekilde bulunmasıyla yaşandı. On yıllar boyunca bu keşif, bu uzman avcıların yaklaşık 13.000 yıl önce kıtaya ulaşan ilk insanlar olduğunu savunan 'Önce Clovis' modelinin temelini oluşturdu."
 andersson.64.g: "Bu, insanların Amerika'da daha önce sanıldığından 10.000 yıldan fazla daha uzun süredir yaşadığı anlamına geliyor!"
 andersson.65.t: "Dragon İnsanı"
 andersson.65.d: "Harbin'de bir köprünün inşası sırasında bir inşaat işçisi garip bir kafatasına rastladı. Dr. [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] derhal haberdar edildi ve kafatasını inceledi. İlk teşhis şaşırtıcı: Çin'de Neandertallerin dışında başka bir insan türü daha mı yaşamıştı?"
 andersson.65.f: "Çin'in Harbin kentinde keşfedilen ve Dragon İnsanı olarak bilinen fosil kafatasına Homo longi adı verilmiştir. Kafatası ilk olarak 1933 yılında bulunmuş olsa da bilim dünyasında ancak 2021'de büyük önem kazandı. En az 146.000 yıl öncesine, Orta Pleistosen'e tarihlenen kafatası, ilkel ve türemiş özelliklerin benzersiz bir karışımını sergiler. Devasa beyin kutusu, kalın kaş çıkıntıları ve neredeyse kare göz çukurlarıyla Homo longi oldukça sağlam yapılıydı. Bazı araştırmacılar bu soyun modern insanlarla (Homo sapiens) Neandertallerden bile daha yakın akraba olduğunu savunuyor. Günümüzde araştırmacıların çoğu, 'Dragon İnsanı'nın Denisova popülasyonuna ait olduğunu öne sürmektedir."
 andersson.65.g: "Ejderha insanları mı? Ne kadar tehlikeliydiler?"
 andersson.66.t: "Homo floresiensis"
 andersson.66.d: "Flores'a yapılan bir araştırma gezisi sırasında Dr. [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName], daha önce imkânsız olduğu düşünülen bir keşifte bulundu: bir fosil, adada ayrı ve cüce benzeri bir insan türünün yaşadığını gösteriyor!"
 andersson.66.f: "2003 yılında Endonezya'nın Flores Adası'ndaki Liang Bua mağarasında keşfedilen Homo floresiensis, yaklaşık 50.000 yıl öncesine kadar yaşamış, küçük yapılı soyu tükenmiş bir hominin türüdür. Boyları yalnızca yaklaşık 1,1 metreye ulaşan ve beyin hacmi yaklaşık 400 santimetreküp olan bu tür, 'Hobbit' lakabını aldı. Bilim insanları, küçük boyutlarının sınırlı kaynaklar nedeniyle izole ada türlerinin küçülmesini sağlayan evrimsel bir süreç olan ada cüceleşmesinin sonucu olduğuna inanıyor. Küçük beyinlerine rağmen gelişmiş taş aletler kullanıyor ve cüce filleri avlıyorlardı. İnsan soy ağacındaki kesin yerleri hâlâ tartışmalıdır; teoriler onları Homo erectus'a veya daha ilkel atalara bağlamaktadır."
 andersson.66.g: "Mağaralarda yaşayıp ot içiyor ve kıllı ayakları mı vardı?"
 je_andersson_craniometry: "Kraniyometri"
 je_andersson_craniometry_reason: "Dr. [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName], aylar boyunca kendini tamamen çok sayıda kafatasını ölçmeye adadı ve bunun tamamen normal, bilimsel bir davranış olduğuna; bundan tamamen çılgınca bir fikrin asla doğamayacağına eminiz."
 je_andersson_craniometry_goal: "Antropolog, kraniyometrik çalışmalarını bir yılın ardından tamamladı."
 andersson.701.t: "Kafatası Ölçümleri Tamamlandı"
 andersson.701.d: "Dr. [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] yeterince dinlenerek aylar boyunca yüzlerce kafatasını ölçtü, katalogladı, kaydetti ve karşılaştırdı; [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetHerHis] gelecekteki antropolojik çalışmaları için sonuçlar çıkardı. Bu iyi hissettirdi!"
 andersson.701.f: "19. yüzyılda kraniyometri, yani kafatasının bilimsel ölçümü, insan çeşitliliğini sınıflandırmada baskın bir yöntem hâline geldi. Samuel Morton ve Paul Broca gibi savunucuları, kafatası kapasitesi ve biçiminin zekânın, ahlaki karakterin ve evrimsel durumun doğrudan göstergeleri olduğuna inanıyordu. Anders Retzius tarafından geliştirilen Sefalik İndeks, 'ilkel' ve 'gelişmiş' toplulukları ayırt etmek için kullanıldı. Kraniyometri ırksal politikaları meşrulaştırmak amacıyla kötüye kullanılmış olsa da, çok sayıda bulgu insan fosillerinin incelenmesinde yararlı oldu."
 andersson.701.g: "Bu oldukça tuhaftı."
 andersson.711.t: "Monojenizm ve Polijenizm"
 andersson.711.d: "Dr. [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName], [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetHerHis] kafatası incelemelerinde tesadüf olamayacak kadar sık bazı ilişkiler gözlemledi. Açıkça görülüyor ki insanlar aynı kökeni paylaşmıyor."
 andersson.711.f: "Monojenizm ve Polijenizm tartışması, 19. yüzyılda insanlığın kökenleri konusunda antropolojide yaşanan temel çatışmalardan biriydi. Monojenistler tek bir kökeni (insanlığın birliğini) savunuyor ve bunu genellikle İncil'deki Yaratılış anlatısına veya daha sonra ortak evrimsel kökene dayandırıyordu. Fiziksel farklılıkların toplumlar arasındaki çevresel etkenlerden kaynaklandığına inanıyorlardı. Buna karşılık Polijenistler, insan ırklarının ayrı kökenlere sahip farklı türlere ait olduğunu öne sürüyordu. Bu görüş, 'sabit' biyolojik hiyerarşileri ileri sürmek için sıklıkla erken dönem kraniyometrik verilerle destekleniyordu."
 andersson.711.g: "Kraniyometrik incelemeler hiçbir şüphe bırakmıyor!"
 andersson.711.h: "[GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] yanılıyor olmalı; insanlığın açıkça yalnızca tek bir kökeni var."
 andersson.712.t: "Evrimcilik ve Yayılmacılık"
 andersson.712.d: "Antik Mısır, Roma ve Yerli Amerikalılara ait kafataslarını incelerken Dr. [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName], tüm gelişmelerin yenilik merkezleri olarak kabul edilen üstün kültürlerden yayıldığını mı, yoksa tüm kültürlerin barbarlıktan uygarlığa uzanan aşamalardan geçmek zorunda olduğunu ve birçok toplumun yalnızca Taş Devri düzeyinde sıkışıp kaldığını mı tekrar tekrar sorguladı."
 andersson.712.f: "Evrimciler tek çizgili evrimi savunuyordu. Tüm toplumların evrensel bir insan psikolojisi ve bağımsız icat yoluyla aynı aşamalardan — 'vahşilikten' 'uygarlığa' — geçtiğine inanıyorlardı. Buna karşılık Yayılmacılar bu içsel ilerleme anlayışına itiraz ediyordu. Önemli kültürel özelliklerin ve teknolojilerin nadiren iki kez icat edildiğini öne sürüyorlardı. Bunun yerine fikirlerin belirli 'kültür merkezlerinde' ortaya çıktığını ve göç, ticaret veya fetih yoluyla dünyaya yayıldığını savunuyorlardı."
 andersson.712.g: "Her kültür Taş Devri'nden modernliğe geçiş yapar."
 andersson.712.h: "İlerlemenin merkezlerden yayıldığı bir kültür vardır."
