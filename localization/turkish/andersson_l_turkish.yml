 andersson.301.a: "Yeniden Yapılandırma Türü Seçimi"
 andersson.301.d: "[ROOT.Var('andersson_anthropologist_var').GetCharacter.GetFullName], bazı fosillerle birlikte kemik koleksiyonuna çekildi ve buluntuları konumlarına ve benzerliklerine göre titizlikle düzenledi. Görünüşe göre kemikler bir iskelet oluşturacak şekilde birbirine uyuyor. Ama hangisi?"
 andersson.301.f: "'Baş kemiği kaburga kemiğine bağlanır—\nKaburga kemiği bacak kemiğine bağlanır—\nBacak kemiği kalça kemiğine bağlanır—\nKalça kemiği kol kemiğine bağlanır.\nKol kemiği baş kemiğine bağlanır.\nBaş kemiği kaburga kemiğine bağlanır."
