 curie_differential_geometry_tech: "Diferansiyel Geometri"
 curie_differential_geometry_tech_desc: "19. yüzyılda Gauss tarafından öncülüğü yapılan Diferansiyel Geometri, eğrilerin ve yüzeylerin gerçek dünyada nasıl davrandığını tanımlamak için karmaşık matematik kullanır. Başlangıçta daha doğru haritalar oluşturmak ve Dünya'yı ölçmek amacıyla geliştirilen bu alan, bilim insanlarının şekilleri ve mesafeleri yalnızca gözlemlemek yerine formüller kullanarak hesaplamasına olanak sağladı."