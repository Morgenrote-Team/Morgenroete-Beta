 curie_nuclear_reactor_tech: "Nükleer Reaktör"
 curie_nuclear_reactor_tech_desc: "Kontrollü nükleer fisyona giden yol, 1942'de dünyanın ilk yapay nükleer reaktörü olan ve bir stadyumun tribünlerinin altında kendi kendini sürdüren zincirleme tepkimeyi gösteren Chicago Pile-1 ile başladı. Bunun ardından Tennessee'deki X-10 grafit reaktörü geldi ve bu tesis, büyük ölçekli plütonyum üretimini ve yoğun radyasyonla çalışmayı sınamak için bir pilot tesis olarak görev yaptı. Bu dönemin doruk noktası, dünyanın ilk tam ölçekli üretim reaktörü olan Hanford'daki B Reaktörüydü; bu reaktör nükleer enerjinin endüstriyel ölçekte uygulanmasını nihayet mümkün kıldı."
 curie_the_bomb_tech: "Bomba"
 curie_the_bomb_tech_desc: "\"Şimdi ben Ölüm oldum, dünyaların yok edicisi.\""
 curie_nuclear_fission_tech: "Nükleer Fisyon"
 curie_nuclear_fission_tech_desc: "In the late 1930s, researchers succeeded for the first time in splitting heavy atomic nuclei by bombarding them with neutrons, thereby unlocking a previously unimagined source of energy within matter. This scientific breakthrough marked the transition from theoretical physics to the practical mastery of the forces that bind the universe together."
 curie_facility_can_construct_only_facility_tt: "Henüz bir Nükleer Araştırma Tesisimiz yok."
 curie_rocket_science_tech: "Roket Bilimi"
 curie_rocket_science_tech_desc: "20. yüzyılın başlarında roket bilimi, büyük ölçüde Rus vizyoner Konstantin Tsiolkovsky'nin öncülüğünde bilim kurgudan titiz bir teorik çerçeveye dönüştü. Tsiolkovsky, 1903 tarihli öncü çalışmasında temel roket denklemini türeterek çok kademeli roketler ve sıvı yakıtlar sayesinde uzay yolculuğunun matematiksel olarak mümkün olduğunu kanıtladı. Transilvanya-Alman fizikçi Hermann Oberth ise 1920'lerde astronotiğin ilkelerini bağımsız olarak geliştirdi ve daha sonra ilk pratik roket mühendislerine ilham verecek mühendislik planlarını ortaya koydu."
 curie_modern_rockets_tech: "Modern Roketler"
 curie_modern_rockets_tech_desc: "Robert Goddard, ilk sıvı yakıtlı roketleri fırlatarak ve jiroskopik dengeleme gibi temel sistemleri geliştirerek roket bilimini pratik bir döneme taşıdı. Almanya'da araştırmalar, Verein für Raumschiffahrt aracılığıyla yoğunlaştı ve genç Wernher von Braun burada büyük ölçekli itki için gerekli mühendislik çalışmalarını geliştirmeye başladı. Bu dönem sonunda teknoloji, özel deneylerden büyük ölçüde devlet tarafından finanse edilen projelere dönüştü ve uzayın sınırlarına ulaşabilen ilk roketlerin geliştirilmesiyle sonuçlandı."
