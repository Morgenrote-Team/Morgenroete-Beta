 curie.11.t: "Uranyum Bulundu!"
 curie.11.d: "Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName], [SCOPE.sState('curie_uranium_state_scope').GetName] bölgesinde örnek toplarken olağanüstü zengin uranyum yatakları keşfetti. Fizikçiler ve kimyagerler, yatağın doğrudan işletilmesini tavsiye ediyor."
 curie.11.f: "Uranyum (adını Uranüs gezegeninden alır), element sembolü U ve atom numarası 92 olan bir kimyasal elementtir. Uranyum bileşikleri 19. yüzyıl boyunca cam ve seramikleri, vazoları ve süs eşyalarını, ayrıca kâse ve bardak gibi gündelik nesneleri renklendirmek için kullanıldı. Bohemya'daki Joachimsthal'daki cam üreticileri bu tekniği daha 1826'da kullanıyordu. Uranyum, ancak 20. yüzyılın ortalarına kadar camları renklendirmek için kullanıldı; o tarihten sonra daha az zararlı başka renklendirici minerallerin yerini aldı. Turuncudan parlak kırmızıya uzanan uranyum içeren seramik sırları, sofra takımlarından mimari süslemelere kadar her şeyde kullanıldı. ABD'de üreticisinin adından dolayı 'Fiestaware' olarak adlandırılan bu seramik, günümüzde birçok Amerikan evinde hâlâ bulunabilen en radyoaktif eşyalardan biridir."
 curie.11.g: "Oraya hemen bir uranyum madeni inşa edin!"
 curie.12.t: "Joachimsthal"
 curie.12.d: "Bugüne kadar Bohemya'daki Joachimsthal uranyum madeni yalnızca küçük miktarlarda üretim yaptı. Uranyumun sanayi ve bilimde potansiyel kullanımından doğan artan taleple birlikte, üretimi önemli ölçüde artırmaya yönelik planlar hazırlandı."
 curie.12.g: "Joachimsthal uranyum üretiminin merkezi olacak!"
