l_turkish:
 MR_AUTOMATE_ENGINEER_TT: "#T [concept_tesla_engineer] Otomatikleştir#!\n[concept_tesla_engineer]ınızı otomatikleştirirseniz artık Mühendisinize görev vermeniz gerekmeyecek.\nKendi başına çalışacak ve o anda mantıklı olan görevleri yerine getirecek. Ancak yine de bazı olaylar almaya devam edeceksiniz.\n\n#n Otomasyonun, Mühendisinizi doğrudan kontrol etmenizden muhtemelen daha az verimli olacağını unutmayın.#!"
 mr_engineering_automation_gui_tt: "[concept_tesla_engineer] görevlerini otomatikleştirmeye başla."
 mr_stop_engineering_automation_gui_tt: "[concept_tesla_engineer] görevlerinin otomatikleştirilmesini durdur."
 MR_STOP_AUTOMATE_ENGINEER_TT: "#T [concept_tesla_engineer] otomasyonunu durdur#!\nMühendisin artık otomatik olarak çalışmayacak."
 MR_ENGINEER_RANKING_BUTTON: "Mühendisler"
 MR_RANKING_BY_ENGINEER: "Show Ranking of all the [Concept('concept_tesla_engineer','$concept_tesla_engineers|q$')] in the world."
 ENGINEER_ENGINEER_RANKING_HEADER: "#V [Concept('concept_tesla_engineer','$concept_tesla_engineers|q$')] of the World ranked by [concept_academics_experience]"
 tesla_experience_current_specialization_civil_loc: "[Character.MakeScope.GetVariable('tesla_civil_engineer_experience_var').GetValue|V0]"
 tesla_experience_current_specialization_mechanical_loc: "[Character.MakeScope.GetVariable('tesla_mechanical_engineer_experience_var').GetValue|V0]"
 tesla_experience_current_specialization_military_loc: "[Character.MakeScope.GetVariable('tesla_military_engineer_experience_var').GetValue|V0]"
 tesla_experience_current_specialization_electrical_loc: "[Character.MakeScope.GetVariable('tesla_electrical_engineer_experience_var').GetValue|V0]"
 tesla_experience_current_specialization_aeronautical_loc: "[Character.MakeScope.GetVariable('tesla_aeronautical_engineer_experience_var').GetValue|V0]"
 MR_ELECTRICAL_ENGINEER_SAW_MILLS_BUTTON: "Modernizing Saw Mills"
 MR_ELECTRICAL_ENGINEER_SAW_MILLS_BUTTON_TT: "#T Modernizing Saw Mills#!\nLet your [concept_tesla_engineer] focus on modernizing your [GetBuildingType('building_logging_camp').GetName]. The $building_logging_camp$ will get the following modifier over time:$tesla_saw_mills_1_modifier$.\n\nThis will add #n expenses#! to your country.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ELECTRICAL_ENGINEER_SAW_MILLS_TRIGGER_TT: "#default_text [GetPlayer.GetName] has a [GetBuildingType('building_logging_camp').GetName] of level 1 or higher with the #O Electrical Saw Mill#! [concept_production_method] that does not have the [concept_modifier] yet.#!"
 MR_TESLA_BUILDING_CHOOSER_SAW_MILLS_MULTIPLE_HEADER: "Modernizing Saw Mills Project"
 MR_ELECTRICAL_ENGINEER_POWER_GRID_BUTTON: "Modernizing Power Grid"
 MR_ELECTRICAL_ENGINEER_POWER_GRID_BUTTON_TT: "#T Modernizing Power Grid#!\nLet your [concept_tesla_engineer] focus on modernizing your [GetBuildingType('building_tesla_telegraph').GetName]. The $building_tesla_telegraph$ will get the following modifier over time:$tesla_power_grid_1_modifier$.\n\nThis will add #n expenses#! to your country.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ELECTRICAL_ENGINEER_POWER_GRID_TRIGGER_TT: "#default_text [GetPlayer.GetName] has a [GetBuildingType('building_tesla_telegraph').GetName] of level 1 or higher with the #O Power Line#! [concept_production_method] hat does not have the [concept_modifier] yet.#!"
 MR_TESLA_BUILDING_CHOOSER_POWER_GRID_MULTIPLE_HEADER: "Modernizing Power Grid Project"