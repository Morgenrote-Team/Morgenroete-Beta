 MR_AUTORACING_FOUND_AUTOMOBILE_CLUB_BUTTON: "Otomobil Kulübü Kur"
 MR_AUTORACING_FOUND_AUTOMOBILE_CLUB_BUTTON_TT: "#T Otomobil Kulübü Kur#!\nBir otomobil kulübü kurmak, motorsporları için gerekli diğer tesisleri inşa etmenin ilk adımıdır.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_AUTORACING_LONG_DISTANCE_BUTTON: "Dayanıklılık Yarışı"
 MR_AUTORACING_LONG_DISTANCE_BUTTON_TT: "#T Dayanıklılık Yarışı Düzenle#!\nGenellikle şehirden şehre düzenlenen dayanıklılık yarışları, otomobil yarışlarının ilk dönemlerinde normdu ve 20. yüzyılın ortalarına kadar devam etti. İtalya'da Targa Florio veya Mille Miglia gibi yarışlar bunun en bilinen örnekleridir. Bu yarışlar insanı ve makineyi özel bir sınamaya tabi tutar ve uzun süre gerçek millî otomobil yarışları olarak kabul edilmiştir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_AUTORACING_FOUND_GRAND_PRIX_BUTTON: "Grand Prix'yi Kur"
 MR_AUTORACING_FOUND_GRAND_PRIX_BUTTON_TT: "#T Grand Prix Yarışlarını Kur#!\n1906 yılında otomobil yarışları tarihindeki ilk resmî Grand Prix, Grand Prix de l'ACF yarışıyla düzenlendi. Menşe ülkesi fark etmeksizin, Fransız sanayisi temsilcilerinin başlangıçta talep ettiği üzere her otomobil üreticisi başına en fazla üç yarış otomobiline izin verildi. Tüm yarışmaların en önemlisi olması nedeniyle yarış 1200 km'den uzun bir mesafe boyunca ve birbirini izleyen iki günde düzenlendi. 1925 yılında, İtalya Otomobil Kulübünün girişimiyle nihayet resmî bir dünya şampiyonasının başlatılması ilan edildi. Sezonun üç resmî Grand Prix yarışı (Fransa, İtalya ve Belçika) bu yarışlar olarak belirlenirken Indianapolis de Amerika'nın en önemli yarış etkinliği olarak dahil edildi.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_AUTORACING_FOUND_GRAND_PRIX_BUTTON_TRIGGER_TT: "#default_text #V En az 5 başka ülkenin#! bir #V Otomobil Kulübü#! vardır ve [GetTechnology('vikelas_international_sports_tech').GetName] teknolojisini araştırmıştır.#!"
 MR_AUTORACING_RACE_TRACK_BUTTON: "Yarış Pisti İnşa Et"
 MR_AUTORACING_RACE_TRACK_BUTTON_TT: "#T Yarış Pisti İnşa Et#!\nGrand Prix yarışlarıyla birlikte sabit yarış pisti, otomobil yarışlarında giderek norm hâline gelmektedir. Özel bir yarış pisti, uluslararası yarış etkinliklerini tek bir yerde merkezileştirmekle kalmaz, aynı zamanda bir test pisti olarak yarış sürücülerimize her yıl bir deneyim bonusu sağlar.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_HAS_RACER_TT: "#default_text [GetPlayer.GetName] bir [concept_vikelas_racer] sahibidir.#!"
 MR_AUTORACING_RACE_TRACK_BUTTON_TRIGGER_TT: "#default_text [GetPlayer.GetName], #V 15 veya daha yüksek seviyede#! [GetBuildingType('building_urban_center').GetName] bulunan bir [concept_incorporated_state] sahibidir.#!"
 MR_AUTORACING_FOUND_TEAM_BUTTON: "Yarış Takımı Kur"
 MR_AUTORACING_FOUND_TEAM_BUTTON_TT: "#T Yarış Takımı Kur#!\nKendi yarış otomobili üreticimize sahip olmak bizi ithalata bağımlılıktan kurtarır ve kendi yarış otomobillerimizi geliştirmemize yardımcı olabilir. Bunun için kendi otomobil sanayimize ve temel planları hazırlayacak bir mühendise ihtiyacımız vardır.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_AUTORACING_FOUND_TEAM_BUTTON_TRIGGER_TT: "#default_text [GetPlayer.GetName], #p 2#! veya daha yüksek seviyede ve #V Otomobil Üretimi#! [concept_production_method] kullanan en az bir [GetBuildingType('building_automotive_industry').GetName] sahibidir.#!"
 MR_AUTORACING_RACE_TRACK_APPLY_BUTTON: "Grand Prix Pisti İçin Başvur"
 MR_AUTORACING_RACE_TRACK_APPLY_BUTTON_TT: "#T Grand Prix Pisti İçin Başvur#!\nUluslararası Otomobil Birliğinin bir üyesi ve son teknoloji bir yarış pistinin sahibi olarak, pistimizin resmî bir Grand Prix Pisti olması için başvurabiliriz. Grand Prix yarışları bundan sonra her yıl burada düzenlenerek pistin itibarını önemli ölçüde artıracaktır.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_HAS_RACE_TRACK_TT: "#default_text [GetPlayer.GetName], en az bir [GetBuildingType('building_vikelas_circuit').GetName] sahibidir.#!"
 MR_MAXIMUM_5_RACE_TRACKS_TT: "#default_text 5'ten az ülke [GetBuildingType('building_vikelas_circuit').GetName] sahibidir.#!"
 MR_AIACR_PRESIDENT_BUTTON: "AIACR Başkanı Ol"
 MR_AIACR_PRESIDENT_BUTTON_TT: "#T AIACR Başkanı Ol#!\nAIACR'nin aktif bir başkanı yoksa bu görevi üstlenebiliriz. Bunun için Uluslararası Otomobil Birliğinin Genel Merkezini kontrol etmemiz gerekir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_AIACR_CONTROLS_HQ_TRIGGER_TT: "#default_text [GetPlayer.GetName], [GetBuildingType('building_vikelas_aiacr').GetName] yapısını kontrol ediyor.#!"
 MR_AUTORACING_RACE_TRACK_DECLARE_BUTTON: "Grand Prix Pisti İlan Et"
 MR_AUTORACING_RACE_TRACK_DECLARE_BUTTON_TT: "#T Grand Prix Pisti İlan Et#!\nAIACR Başkanı olarak yarış pistlerimizden birini Grand Prix Pisti ilan etme ayrıcalığına sahibiz.[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_IS_AIACR_PRESIDENT_TT: "#default_text [GetPlayer.GetName], #V AIACR Başkanıdır#!.#!"
 MR_AUTORACING_FOUND_AIACR_BUTTON: "Otomobil Birliği"
 MR_AUTORACING_FOUND_AIACR_BUTTON_TT: "#T Otomobil Birliği#!\nYarışçılığın, farklı ülkelerden farklı otomobil markalarıyla yarışan sürücülerin yer aldığı giderek daha uluslararası bir spor hâline gelmesiyle, birçok ülke herhangi bir anlaşma olmadan kendi yarışlarını düzenlemeye başladı. Kuralları ve şartları daha iyi koordine etmek için uluslararası bir kuruluşun, yani Uluslararası Otomobil Birliğinin kurulması gerekmektedir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_AUTORACING_FOUND_AIACR_BUTTON_TRIGGER_TT: "#default_text #V En az 10 başka ülkenin#! bir #V Otomobil Kulübü#! vardır.#!"
 MR_AUTORACING_NO_PARTICIPATION_BUTTON_TT: "#T Yarış Katılımını İptal Et#!\nBir sürücünün aşırı öfkeli olduğu veya bir otomobilin yeterince olgunlaşmadığı ve bunun yıkıcı bir kazaya yol açabileceği durumlarda, yarış katılımını duraklatmak mantıklı olabilir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 vikelas_no_participation_tt: "[ROOT.Var('vikelas_racer_var').GetCharacter.GetFullName], yarışlara yeniden katılım izni verilene kadar hiçbir yarışa katılmayacak."
 MR_AUTORACING_PARTICIPATION_BUTTON_TT: "#T Yarış Katılımı#!\nYarışçının tüm yarışlara yeniden katılmasına izin verir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 vikelas_participation_tt: "[ROOT.Var('vikelas_racer_var').GetCharacter.GetFullName], artık her zamanki gibi yarışlara katılacak."
