 MR_AUTORACING_LONG_DISTANCE_STATE_TRIGGER_TT: "#default_text [GetPlayer.GetName], en az #V 5 [Concept('concept_state', '$concept_states$')]#! sahibidir.#!"
 MR_AUTORACING_LONG_DISTANCE_MODIFIER_TRIGGER_TT: "#default_text [GetPlayer.GetName], yakın zamanda bir #V Dayanıklılık Yarışına#! ev sahipliği yapmadı.#!"
