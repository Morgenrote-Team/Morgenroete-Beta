 MR_PADDOCK_INNOVATION_TO_RESEARCH_BUTTON_TT: "#T Mekanik Yeniliği Dönüştür#!\nMotorsporlarındaki başarıların tüm ülkeye fayda sağlaması için Mekanik Yeniliği Araştırma Puanlarına dönüştürün.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
