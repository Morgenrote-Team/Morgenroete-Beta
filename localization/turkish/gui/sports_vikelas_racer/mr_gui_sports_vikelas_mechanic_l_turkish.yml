l_turkish:
 MR_PADDOCK_IMPROVE_ENGINE_BUTTON: "Motoru Geliştir"
 MR_PADDOCK_IMPROVE_ENGINE_BUTTON_TT: "#T Motoru Geliştir#!\nYeni bir motor, aracın güvenilirliğini ve hızını artırır.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PADDOCK_IMPROVE_SAFETY_BUTTON: "Güvenliği Geliştir"
 MR_PADDOCK_IMPROVE_SAFETY_BUTTON_TT: "#T Güvenliği Geliştir#!\nBir mekanik, yarışçının hayatını güvence altına almak için çeşitli yeni güvenlik teknikleri geliştirebilir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PADDOCK_IMPROVE_BODY_BUTTON: "Karoseri Geliştir"
 MR_PADDOCK_IMPROVE_BODY_BUTTON_TT: "#T Karoseri Geliştir#!\nAracın karoserini geliştirmek daha iyi aerodinamik ve dolayısıyla daha fazla hız sağlarken, kullanılan malzemenin iyileştirilmesi daha fazla güvenlik sağlar.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
