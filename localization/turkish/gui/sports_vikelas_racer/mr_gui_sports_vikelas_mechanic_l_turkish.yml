 MR_PADDOCK_FIRE_MECHANIC_BUTTON: "Mekaniği Kov"
 MR_PADDOCK_FIRE_MECHANIC_BUTTON_TT: "#T Mekaniği Kov#!\nMevcut mekanik beklenen gereksinimleri karşılamıyorsa yarış ekipleri mekanik pozisyonunu yeniden doldurabilir. Ancak yeni bir mekanik yalnızca iki yıllık bir aradan sonra işe alınabilir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PADDOCK_FIRE_RACER_BUTTON: "Yarışçıyı Kov"
 MR_PADDOCK_FIRE_RACER_BUTTON_TT: "#T Yarışçıyı Kov#!\nEski centilmen sürücülerin aksine yarış ekibindeki sürücüler vazgeçilmez değildir. Yeni bir yarış sürücüsü işe alındıktan sonra bu pozisyon iki yıl boyunca yeniden doldurulamaz.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
