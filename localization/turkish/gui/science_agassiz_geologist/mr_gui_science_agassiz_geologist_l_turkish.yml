l_turkish:
 mr_science_geologist_tab_organization: "Organizasyon"
 MR_GEOLOGIST_HIGHEST_MOUNTAIN_BUTTON: "En Yüksek Dağ"
 MR_GEOLOGIST_HIGHEST_MOUNTAIN_BUTTON_TT: "#T En Yüksek Dağ#!\n18. yüzyıldan bu yana, mevcut jeolojik dünya görüşü giderek daha fazla sarsılmıştır. And Dağları uzun süre dünyanın en yüksek sıradağları olarak kabul edilirken, Himalayalar giderek daha fazla öne çıkmaktadır. En yüksek dağı arama çabası jeologların hayal gücünü ateşlemiştir, ancak arayış henüz sona ermekten çok uzaktır.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_GEOLOGIST_HIMALAYAS_ACCESS_TRIGGER_TT: "#default_text [GetPlayer.GetName], Himalaya bölgesine ilgi duyuyor.#!"
 MR_GEOLOGIST_NO_HIMALAYA_SURVEY_TRIGGER_TT: "#default_text Şu anda başka hiçbir ülke en yüksek dağı bulmak için Himalayaları araştırmıyor.#!"
 MR_GEOLOGIST_URANIUM_BUTTON: "Uranyum Seferi"
 MR_GEOLOGIST_URANIUM_BUTTON_TT: "#T Uranyum Seferi#!\nBir jeolog, yurt dışında uranyum yatakları arayabilir ve orada kendi madenini kurabilir. Ancak uranyumu ülkemize getirmek için ayrıca bir sözleşme imzalamamız gerekir. Bu süreç beş yıla kadar sürebilir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_GEOLOGIST_FIND_URANIUM_TRIGGER_TT: "#default_text Keşfedilmemiş en az bir uranyum yatağı bulunuyor.#!"
 MR_GEOLOGIST_URANIUM_STOP_BUTTON_TT: "#T Uranyum Seferi#!\n[concept_agassiz_geologist]ınız şu anda dünya genelinde bilinmeyen uranyum yataklarını arıyor.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 mr_geologist_uranium_stop_button_effect_tt: "[concept_agassiz_geologist]ınız uranyum aramayı durduracak."