 MR_GORDON_BENNETT_CUP_BUTTON: "Gordon Bennett Kupası"
 MR_GORDON_BENNETT_CUP_BUTTON_TT: "#T Gordon Bennett Kupası#!\nGordon Bennett Kupası (veya Coupe Aéronautique Gordon Bennett), dünyanın en eski gaz balonu yarışıdır. Havacılığın 'Mavi Kurdelesi' olarak anılan etkinlik, milyoner sporcu ve New York Herald gazetesinin sahibi James Gordon Bennett Jr. tarafından desteklenmiştir. Organizatörlere göre yarışın amacı basittir: 'kalkış noktasından en uzak mesafeye uçmak.' Yarış 1906'dan 1938'e kadar düzenlenmiş, I. Dünya Savaşı nedeniyle 1914-1919 yılları arasında ve 1931'de kesintiye uğramıştır.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_GORDON_BENNETT_PUBLISHER_BUILDING_TRIGGER_TT: "#default_text [GetPlayer.GetName], toplam #V 10 veya daha fazla [GetBuildingType('building_manzoni_publishing_industry').GetName] bina seviyesine#! sahip.#!"