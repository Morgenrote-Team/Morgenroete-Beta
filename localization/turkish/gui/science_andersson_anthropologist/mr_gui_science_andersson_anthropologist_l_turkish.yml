l_turkish:
 MR_ACTIVE_ANTHROPOLOGIST_TRIGGER_TT: "#default_text [GetPlayer.GetName], #V meşgul olmayan#! bir [concept_andersson_anthropologist] sahibidir.#!"
 MR_HAS_ANTHROPOLOGIST_TRIGGER_TT: "#default_text [GetPlayer.GetName] bir [concept_andersson_anthropologist] sahibidir.#!"
 MR_ANTHROPOLOGY_10_COUNTRIES_WITH_ANTHROPOLOGIST_TRIGGER_TT: "#default_text [GetGeographicRegion('geographic_region_americas').GetName] bölgesinde 10 veya daha fazla ülke bir [concept_andersson_anthropologist] sahibidir.#!"
 MR_ANTHROPOLOGIST_CAVE_EXPLORATION_BUTTON: "Mağara Araştırması"
 MR_ANTHROPOLOGIST_CAVE_EXPLORATION_BUTTON_TT: "#T Mağara Araştırması#!\nBir [concept_andersson_anthropologist] yardımıyla, ulusal topraklarda daha önce keşfedilmiş [Concept('concept_andersson_cave','$concept_andersson_caves$')] araştırılabilir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ANTHROPOLOGIST_HAS_CAVE_TRIGGER_TT: "#default_text [GetPlayer.GetName] bir [concept_andersson_cave] sahibidir.#!"
 MR_ANTHROPOLOGIST_NOT_HAS_CAVE_MODIFIER_TRIGGER_TT: "#default_text [GetPlayer.GetName], #V $andersson_cave_exploration_modifier$#! Değiştiricisine #n sahip değil#!.#!"
 MR_ANTHROPOLOGIST_SKELETON_RECONSTRUCTION_BUTTON: "İskelet Rekonstrüksiyonu"
 MR_ANTHROPOLOGIST_SKELETON_RECONSTRUCTION_BUTTON_TT: "#T İskelet Rekonstrüksiyonu#!\nBir [concept_andersson_anthropologist] yardımıyla [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] kullanılarak bir [concept_andersson_skeleton] yeniden oluşturulabilir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ANTHROPOLOGIST_CAN_RECONSTRUCT_TRIGGER_TT: "#default_text [GetPlayer.GetName], henüz yeniden oluşturulmamış bir iskelete ait en az #V 5#! @andersson_human_fossil! [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] sahibidir.#!"
 MR_ANTHROPOLOGIST_HAS_INTITUTE_TRIGGER_TT: "#default_text [GetPlayer.GetName] bir [GetBuildingType('building_andersson_institute').GetName] sahibidir.#!"
 MR_RECALL_ANTHROPOLOGIST_BUTTON_TT: "#T Antropoloğu Geri Çağır#!\nBazen koşullar, bir mağara araştırmasını vaktinden önce sonlandırmanızı gerektirebilir. Bu durumda [concept_andersson_anthropologist], süre dolmadan yeniden kullanılabilir hâle gelir, ancak beraberinde herhangi bir kazanç getirmez.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ORIGIN_CONGRESS_BUTTON: "İnsan Kökeni Kongresi"
 MR_ORIGIN_CONGRESS_BUTTON_TT: "#T Modern İnsanların Kökeni Kongresi#!\nTarih öncesi insan kemiklerinin keşfiyle birlikte insanın ilk kökeninin neresi olduğu sorusu da ortaya çıktı. Darwin Afrika kökenli olduğunu varsayarken, diğerleri birbirinden bağımsız birçok paralel gelişim öne sürdü. Yüzyılın başlarından itibaren hâkim görüş, modern insanların Asya'da geliştiği yönündeydi.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ANTHROPOLOGY_INSTITUTE_TRIGGER_TT: "#default_text [GetPlayer.GetName] bir [GetBuildingType('building_andersson_institute').GetName] sahibidir.#!"
 MR_ORIGIN_CONGRESS_SPECIAL_HUMAN_FOSSIL_TT: "#default_text [GetPlayer.GetName], şu türlerden birine ait en az #V 5#! @andersson_human_fossil! [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] sahibidir: #V Pithecanthropus#! veya #V Australopithecus#!.#!"
 MR_ORIGIN_CONGRESS_GLOBAL_HUMAN_FOSSIL_TT: "#default_text Dünya genelinde en az #V 250#! @andersson_human_fossil! [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] bulunmuş olmalıdır (şu anda [GetGlobalVariable('dubois_global_human_fossil').GetValue|+0] @andersson_human_fossil! bulundu).#!"
 NEOANTHROPUS_VAR: "@andersson_neoanthropus_fossil!  [GetPlayer.MakeScope.Var('andersson_neoanthropus_fossil_var').GetValue|V0]"
 NEOANTHROPUS_VAR_TT: "#header Neoanthropus [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')]#!\n[GetPlayer.GetName], @andersson_neoanthropus_fossil! [GetPlayer.MakeScope.Var('andersson_neoanthropus_fossil_var').GetValue|V0] Neoanthropus [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] buldu.\n\nNeoanthropus Fosilleri:\n[GetPlayer.GetCustom('andersson_vero_fossil_discovered_type')][GetPlayer.GetCustom('andersson_lagoa_santa_fossil_discovered_type')][GetPlayer.GetCustom('andersson_cro_magnon_fossil_discovered_type')][GetPlayer.GetCustom('andersson_boskop_fossil_discovered_type')][GetPlayer.GetCustom('andersson_tianyuan_fossil_discovered_type')][GetPlayer.GetCustom('andersson_talgai_fossil_discovered_type')]"
 PALAEANTHROPUS_VAR: "@andersson_palaeanthropus_fossil!  [GetPlayer.MakeScope.Var('andersson_palaeanthropus_fossil_var').GetValue|V0]"
 PALAEANTHROPUS_VAR_TT: "#header Palaeanthropus [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')]#!\n[GetPlayer.GetName], @andersson_palaeanthropus_fossil! [GetPlayer.MakeScope.Var('andersson_palaeanthropus_fossil_var').GetValue|V0] Palaeanthropus [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] buldu.\n\nPalaeanthropus Fosilleri:\n[GetPlayer.GetCustom('andersson_neanderthal_fossil_discovered_type')][GetPlayer.GetCustom('andersson_gibraltar_fossil_discovered_type')][GetPlayer.GetCustom('andersson_spy_fossil_discovered_type')][GetPlayer.GetCustom('andersson_krapina_fossil_discovered_type')][GetPlayer.GetCustom('andersson_galilee_fossil_discovered_type')]"
 PITHECANTHROPUS_VAR: "@andersson_pithecanthropus_fossil!  [GetPlayer.MakeScope.Var('andersson_pithecanthropus_fossil_var').GetValue|V0]"
 PITHECANTHROPUS_VAR_TT: "#header Pithecanthropus [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')]#!\n[GetPlayer.GetName], @andersson_pithecanthropus_fossil! [GetPlayer.MakeScope.Var('andersson_pithecanthropus_fossil_var').GetValue|V0] Pithecanthropus [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] buldu.\n\nPithecanthropus Fosilleri:\n[GetPlayer.GetCustom('andersson_heidelberg_fossil_discovered_type')][GetPlayer.GetCustom('andersson_rhodesian_fossil_discovered_type')][GetPlayer.GetCustom('andersson_peking_fossil_discovered_type')][GetPlayer.GetCustom('andersson_java_fossil_discovered_type')]"
 AUSTRALOPITHECUS_VAR: "@andersson_australopithecus_fossil!  [GetPlayer.MakeScope.Var('andersson_australopithecus_fossil_var').GetValue|V0]"
 AUSTRALOPITHECUS_VAR_TT: "#header Australopithecus [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')]#!\n[GetPlayer.GetName], @andersson_australopithecus_fossil! [GetPlayer.MakeScope.Var('andersson_australopithecus_fossil_var').GetValue|V0] Australopithecus [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] buldu.\n\nAustralopithecus Fosilleri:\n[GetPlayer.GetCustom('andersson_australopithecus_fossil_discovered_type')]"
 PREHISTORIC_ARTIFACTS_VAR: "@andersson_prehistoric_artifact!  [GetPlayer.MakeScope.Var('andersson_prehistoric_artifact_var').GetValue|V0]"
 PREHISTORIC_ARTIFACTS_VAR_TT: "#header [Concept('concept_andersson_prehistoric_artifact','$concept_andersson_prehistoric_artifacts$')]#!\n[GetPlayer.GetName], @andersson_prehistoric_artifact! [GetPlayer.MakeScope.Var('andersson_prehistoric_artifact_var').GetValue|V0] [Concept('concept_andersson_prehistoric_artifact','$concept_andersson_prehistoric_artifacts$')] buldu."
 MR_ANTHROPOLOGIST_ANTHROPOLOGICAL_RESEARCH_BUTTON: "Antropolojik Araştırma"
 MR_ANTHROPOLOGIST_ANTHROPOLOGICAL_RESEARCH_BUTTON_TT: "#T Antropolojik Araştırma#!\nBir [concept_andersson_anthropologist], çalışmalarını öncelikle [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] ve [Concept('concept_andersson_prehistoric_artifact','$concept_andersson_prehistoric_artifacts$')] aramaya ve ülke genelinde alanları araştırmaya odaklar.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ANTHROPOLOGIST_HOMINID_PROSPECTING_BUTTON: "Hominid Araştırması"
 MR_ANTHROPOLOGIST_HOMINID_PROSPECTING_BUTTON_TT: "#T Hominid Araştırması#!\nBir [concept_andersson_anthropologist] ve ekibi, özellikle soyu tükenmiş insan türlerini bulmak için antropolojik alanları araştırabilir. [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] ve [Concept('concept_andersson_prehistoric_artifact','$concept_andersson_prehistoric_artifacts$')] elde edilebilir. Arkaik insan türleri yalnızca [GetBuildingType('building_andersson_institute').GetName] yapımızda modern üretim yöntemleri kullanılarak bulunabilir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ANTHROPOLOGIST_HOMINID_PROSPECTING_POSSIBLE_TRIGGER_TT: "#default_text [GetPlayer.GetName], şu coğrafi bölgelerde #n en az bir#! eyalete sahip: [GetGeographicRegion('andersson_geographic_region_neoanthropus').GetName], [GetGeographicRegion('andersson_geographic_region_palaeanthropus').GetName], [GetGeographicRegion('andersson_geographic_region_pithecanthropus').GetName], [GetGeographicRegion('andersson_geographic_region_australopithecus').GetName].#!"
 MR_ANTHROPOLOGIST_IS_SPELEOLOGIST_TRIGGER_TT: "#default_text [concept_andersson_anthropologist], #V $andersson_speleologist$#! [concept_character_trait] özelliğine sahiptir.#!"
 MR_ANTHROPOLOGIST_EXPOSE_PILTDOWN_FRAUD_BUTTON: "[GetPlayer.GetCustom('andersson_fossil_piltdown')] Adamı Sahtekârlığını Ortaya Çıkar"
 MR_ANTHROPOLOGIST_EXPOSE_PILTDOWN_FRAUD_BUTTON_TT: "#T [GetPlayer.GetCustom('andersson_fossil_piltdown')] Adamı Sahtekârlığını Ortaya Çıkar#!\nArtık kötü bir üne sahip olan [GetPlayer.GetCustom('andersson_fossil_piltdown')] fosilinin sahte olma ihtimali oldukça yüksek. Ancak [GetGlobalVariable('andersson_piltdown_country_global_var').GetCountryDefinition.GetName], muhtemelen araştırmacıları aracılığıyla bu son derece prestijli fosili ne pahasına olursa olsun savunacaktır. Bu yalanı ortaya çıkarma zamanı geldi!\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ANTHROPOLOGY_RATING_PILTDOWN_FRAUD_TT: "#default_text [GetPlayer.GetName], en az #V 100#! Antropolojik Prestije sahip.#!"
 MR_ANTHROPOLOGY_PILTDOWN_NO_RECENT_TRY_TRIGGER_TT: "#default_text [GetPlayer.GetName], #V $andersson_piltdown_debate_lost_modifier$#! Değiştiricisine sahip değil.#!"
 MR_ANTHROPOLOGY_PILTDOWN_NO_CURRENT_DEBATE_TRIGGER_TT: "#default_text [GetPlayer.GetCustom('andersson_fossil_piltdown')] Adamı hakkında şu anda #R hiçbir tartışma#! yok.#!"
 MR_ANTHROPOLOGY_PILTDOWN_CAN_BE_EXPOSED_TRIGGER_TT: "#default_text [GetGlobalVariable('andersson_piltdown_country_global_var').GetCountryDefinition.GetName], son 5 yıl içinde [GetPlayer.GetCustom('andersson_fossil_piltdown')] Adamını başarıyla savunmadı.#!"
 TOTAL_HUMAN_FOSSILS_VAR: "@andersson_human_fossil!  [GetPlayer.MakeScope.Var('andersson_total_human_fossil').GetValue|V0]"
 TOTAL_HUMAN_FOSSILS_VAR_TT: "#header Toplam [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')]#!\n[GetPlayer.GetName], @andersson_human_fossil! [GetPlayer.MakeScope.Var('andersson_total_human_fossil').GetValue|V0] adet fosil buldu; dünya genelindeki toplam @andersson_human_fossil! [GetGlobalVariable('andersson_global_human_fossil_global_var').GetValue|V0] [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] arasında."
 SPECIAL_HUMAN_FOSSILS_VAR: "@andersson_special_human_fossil_var!  [GetPlayer.MakeScope.Var('andersson_special_human_fossil_var').GetValue|V0]"
 SPECIAL_HUMAN_FOSSILS_VAR_TT: "#header Özel [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')]#!\n[GetPlayer.GetName], @andersson_special_human_fossil_var! [GetPlayer.MakeScope.Var('andersson_special_human_fossil_var').GetValue|V0] adet Özel [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] buldu.\n\nÖzel Fosiller:\n[GetPlayer.GetCustom('andersson_piltdown_fossil_discovered_type')][GetPlayer.GetCustom('andersson_paranthropus_fossil_discovered_type')][GetPlayer.GetCustom('andersson_clovis_fossil_discovered_type')][GetPlayer.GetCustom('andersson_dragon_fossil_discovered_type')][GetPlayer.GetCustom('andersson_floresiensis_fossil_discovered_type')]"
 PREHISTORIC_VENUSES_VAR: "@andersson_prehistoric_venus!  [GetPlayer.MakeScope.Var('andersson_prehistoric_venus_var').GetValue|V0]"
 PREHISTORIC_VENUSES_VAR_TT: "#header [Concept('concept_andersson_prehistoric_artifact','$concept_andersson_prehistoric_venuses$')]#!\n[GetPlayer.GetName], @andersson_prehistoric_venus! [GetPlayer.MakeScope.Var('andersson_prehistoric_venus_var').GetValue|V0] [Concept('concept_andersson_prehistoric_artifact','$concept_andersson_prehistoric_venuses$')] buldu."
 MR_ANTHROPOLOGIST_HOMINID_EXPEDITION_BUTTON: "Hominid Seferi"
 MR_ANTHROPOLOGIST_HOMINID_EXPEDITION_BUTTON_TT: "#T Hominid Seferi#!\nBir [concept_andersson_anthropologist] ve ekibi, tabi ülkelerde soyu tükenmiş insan türlerini aramak için bir sefere çıkabilir. Kendi topraklarındaki hominid araştırmasıyla benzer koşullar geçerlidir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ANTHROPOLOGIST_HOMINID_EXPEDITION_POSSIBLE_TRIGGER_TT: "#default_text [GetPlayer.GetName], şu coğrafi bölgelerde eyalete sahip #n en az bir#! doğrudan tabi ülkeye sahip: [GetGeographicRegion('andersson_geographic_region_neoanthropus').GetName], [GetGeographicRegion('andersson_geographic_region_palaeanthropus').GetName], [GetGeographicRegion('andersson_geographic_region_pithecanthropus').GetName], [GetGeographicRegion('andersson_geographic_region_australopithecus').GetName].#!"
 MR_ANTHROPOLOGIST_NOT_HAS_EXPEDITION_MODIFIER_TRIGGER_TT: "#default_text [GetPlayer.GetName], #V $andersson_hominid_expedition_modifier$#! Değiştiricisine #n sahip değil#!.#!"
 MR_ANTHROPOLOGIST_CRANIOMETRY_BUTTON: "Kraniyometri"
 MR_ANTHROPOLOGIST_CRANIOMETRY_BUTTON_TT: "#T Kraniyometri#!\nKafatası ölçümü, bir antropolog için en prestijli görevlerden biri kabul edilir. Bir antropolog kariyerinde bir kez, kendisini tamamen hayranı olduğu kafataslarına adayıp deneyimini geliştirebilir ve yeni beceriler kazanabilir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ANDERSSON_25_BONES_TRIGGER_TT: "#default_text [GetPlayer.GetName], en az #V 25#! @andersson_human_fossil! [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] sahibidir.#!"
 MR_ANTHROPOLOGIST_NOT_DONE_CRANIOMETRY_TRIGGER_TT: "#default_text Antropoloğumuz henüz #R kraniyometri yapmadı#!.#!"
 MR_ANTHROPOLOGIST_NEOLITHIC_BUTTON: "Neolitik Çağ"
 MR_ANTHROPOLOGIST_NEOLITHIC_BUTTON_TT: "#T Neolitik Çağ#!\nBirçok sıradan insan için ilk insanların geçmişi hâlâ soyut bir konudur. Bir antropolog, bu dönemdeki yaşamı daha canlı hâle getirmek için bir üniversitede odalar düzenleyebilir. Her üniversite için yalnızca bir canlandırma mümkündür. Bu durumda Antropoloğunuza Neolitik Çağdan bir canlandırma hazırlatın.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ANTHROPOLOGIST_MESOLITHIC_BUTTON: "Mezolitik Çağ"
 MR_ANTHROPOLOGIST_MESOLITHIC_BUTTON_TT: "#T Mezolitik Çağ#!\nBirçok sıradan insan için ilk insanların geçmişi hâlâ soyut bir konudur. Bir antropolog, bu dönemdeki yaşamı daha canlı hâle getirmek için bir üniversitede odalar düzenleyebilir. Her üniversite için yalnızca bir canlandırma mümkündür. Bu durumda Antropoloğunuza Mezolitik Çağdan bir canlandırma hazırlatın.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ANTHROPOLOGIST_UPPER_PALEOLITHIC_BUTTON: "Üst Paleolitik Çağ"
 MR_ANTHROPOLOGIST_UPPER_PALEOLITHIC_BUTTON_TT: "#T Üst Paleolitik Çağ#!\nBirçok sıradan insan için ilk insanların geçmişi hâlâ soyut bir konudur. Bir antropolog, bu dönemdeki yaşamı daha canlı hâle getirmek için bir üniversitede odalar düzenleyebilir. Her üniversite için yalnızca bir canlandırma mümkündür. Bu durumda Antropoloğunuza Üst Paleolitik Çağdan bir canlandırma hazırlatın.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ANDERSSON_NEOANTHROPUS_FOSSIL_TRIGGER: "#default_text [GetPlayer.GetName], en az #V 1#! @andersson_neoanthropus_fossil! Neoanthropus Fosiline sahip.#!"
 MR_ANDERSSON_NEOANTHROPUS_SKELETON_TRIGGER: "#default_text [GetPlayer.GetName], en az #V 1#! @andersson_neoanthropus_skeleton! Neoanthropus İskeletine sahip.#!"
 MR_ANDERSSON_20_BONES_TRIGGER_TT: "#default_text [GetPlayer.GetName], en az #V 20#! @andersson_human_fossil! [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] sahibidir.#!"
 MR_ANDERSSON_50_BONES_TRIGGER_TT: "#default_text [GetPlayer.GetName], en az #V 50#! @andersson_human_fossil! [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] sahibidir.#!"
 MR_ANDERSSON_100_BONES_TRIGGER_TT: "#default_text [GetPlayer.GetName], en az #V 100#! @andersson_human_fossil! [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] sahibidir.#!"
 MR_NO_OUR_ANCESTORS_TRIGGER_TT: "#default_text [GetPlayer.GetName], #V Atalarımızın Tarihi#! bulunmayan en az bir Üniversiteye sahip.#!"
 MR_ANDERSSON_PALAEANTHROPUS_SKELETON_TRIGGER: "#default_text [GetPlayer.GetName], en az #V 1#! @andersson_palaeanthropus_skeleton! Palaeanthropus İskeletine sahip.#!"
 MR_ANDERSSON_PITHECANTHROPUS_SKELETON_TRIGGER: "#default_text [GetPlayer.GetName], en az #V 1#! @andersson_pithecanthropus_skeleton! Pithecanthropus İskeletine sahip.#!"
 MR_ANDERSSON_200_BONES_TRIGGER_TT: "#default_text [GetPlayer.GetName], en az #V 200#! @andersson_human_fossil! [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] sahibidir.#!"
 MR_ANDERSSON_300_BONES_TRIGGER_TT: "#default_text [GetPlayer.GetName], en az #V 300#! @andersson_human_fossil! [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')] sahibidir.#!"
 MR_ANTHROPOLOGIST_NEW_SYSTEMATIZATION_BUTTON: "Yeni Sistemleştirme"
 MR_ANTHROPOLOGIST_NEW_SYSTEMATIZATION_BUTTON_TT: "#T Yeni Sistemleştirme#!\nBuluntuların konumlarına bağlı olarak farklı 'insanlar' şeklinde sınıflandırılması, neredeyse yönetilemez bir parçalı isimler bolluğuna yol açmıştır. Deneyimli bir antropolog, yeni bir teori ve sistemleştirme kullanarak modası geçmiş kategorileri bir kenara bırakabilir ve antropolojiyi modernleştirebilir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ANTHROPOLOGIST_AT_LEAST_200_EXPERIENCE_TRIGGER_TT: "#default_text [GetPlayer.GetName], en az #V 200#! Deneyime sahip bir [concept_andersson_anthropologist] sahibidir.#!"
 MR_ANTHROPOLOGIST_CAN_SYSTEMIZE_NEOANTHROPUS_TRIGGER_TT: "#default_text Neoanthropus'un altı farklı türünün tamamı keşfedildi.#!"
 MR_ANTHROPOLOGIST_CAN_SYSTEMIZE_PALAEANTHROPUS_TRIGGER_TT: "#default_text Palaeanthropus'un beş farklı türünün tamamı keşfedildi.#!"
 MR_ANTHROPOLOGIST_CAN_SYSTEMIZE_PITHECANTHROPUS_TRIGGER_TT: "#default_text Pithecanthropus'un dört farklı türünün tamamı keşfedildi.#!"
 andersson.800.tt: "[concept_andersson_anthropologist], antropolojideki mevcut tür sistemleştirmesini yeniden tanımlayacak."
