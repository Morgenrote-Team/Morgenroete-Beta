 MR_FIFA_PRESIDENT_BUTTON: "FIFA Başkanı Ol"
 MR_FIFA_PRESIDENT_BUTTON_TT: "#T FIFA Başkanı Ol#!\nFIFA'nın aktif bir başkanı yoksa bu görevi üstlenebiliriz. Bunun için Uluslararası Futbol Federasyonunun Genel Merkezini kontrol etmemiz gerekir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
