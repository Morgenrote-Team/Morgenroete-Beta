 MR_FIFA_BOARD_TOOLTIP: "#header FIFA Yönetim Kurulu#!\nAşağıdaki ülkeler FIFA Yönetim Kurulu üyesidir:\n\n[GetGlobalVariable('vikelas_fifa_board_member_1_global_var').GetCountry.GetName|V]\n[GetGlobalVariable('vikelas_fifa_board_member_2_global_var').GetCountry.GetName|V]\n[GetGlobalVariable('vikelas_fifa_board_member_3_global_var').GetCountry.GetName|V]\n[GetGlobalVariable('vikelas_fifa_board_member_4_global_var').GetCountry.GetName|V]\n[GetGlobalVariable('vikelas_fifa_board_member_5_global_var').GetCountry.GetName|V]"
 MR_FIFA_PRESIDENT_TOOLTIP: "#header FIFA Başkanı#!\n[GetGlobalVariable('vikelas_fifa_president_global_var').GetCountry.GetName], FIFA Başkanıdır."
 MR_HIRE_COACH_BUTTON_TT: "#T Millî Antrenör İşe Al#!\nMillî antrenörler, maç sonuçlarını iyileştirmek için becerilerini kullanır. Bir millî antrenörün uzmanlık alanı — kriket, beyzbol, futbol, basketbol — millî spora bağlıdır. Bir antrenör beklentileri karşılayamazsa en az üç yıl sonra değiştirilebilir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ADAPT_NATIONAL_SPORT_BUTTON: "Millî Sporu Belirle"
 MR_ADAPT_NATIONAL_SPORT_BUTTON_TT: "#T Millî Sporu Belirle#!\nÜlkemizde popüler hâle gelen belirli bir sporu millî spor ilan ederek kulüplerin kurulmasını ve sporun diğer ülkelere yayılmasını teşvik edebiliriz. Bu, millî bir spor kuruluşu için ön koşuldur.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_CHANGE_NATIONAL_SPORT_BUTTON: "Millî Sporu Değiştir"
 MR_CHANGE_NATIONAL_SPORT_BUTTON_TT: "#T Millî Sporu Değiştir#!\nMillî sporun değiştirilmesi ancak en az bir başka spor popüler hâle geldiyse mümkündür. Yerleşik spor camiası bu değişiklikten memnun olmayacaktır.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 mr_sports_coach_national_sport: "Millî Spor"
 vikelas_national_sport_loc: "[GetPlayer.MakeScope.Var('vikelas_national_sport_var').GetFlagName]"
 vikelas_no_national_sport_loc: "Yok"
 MR_SCHOOL_SPORTS_STADIUM_TRIGGER_TT: "#default_text [GetPlayer.GetName], bir [GetBuildingType('building_vikelas_sports').GetName] içinde en az bir aktif #V Spor Stadyumu [concept_production_method]#! sahibidir.#!"
 MR_INTERNATIONAL_SPORTS_EVENT_BUTTON: "Commonwealth Şampiyonası"
 MR_INTERNATIONAL_SPORTS_EVENT_BUTTON_TT: "#T Commonwealth Şampiyonası#!\nBir güç bloğunun lideri veya birkaç vasalın hükümdarı olarak, aynı millî spora sahip olmaları koşuluyla tebaalarımız arasında uluslararası bir şampiyona düzenleyebiliriz.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_INTERNATIONAL_SPORTS_MEMBER_TRIGGER_TT: "#default_text #default_text [GetPlayer.GetName], millî sporları [Country.MakeScope.Var('vikelas_national_sport_var').GetFlagName] olan en az #G 3#! başka #V Blok Üyesine#! veya #G 4#! #V Tebaaya#! sahiptir.#!"
 MR_INTERNATIONAL_SPORTS_NO_FIFA_TRIGGER_TT: "#default_text [GetPlayer.GetName], FIFA'nın #R üyesi değildir#!.#!"
 MR_INTERNATIONAL_SPORTS_MODIFIER_TRIGGER_TT: "#default_text [GetPlayer.GetName], #V $vikelas_international_sports_event_modifier$#! veya #V $vikelas_recent_international_sports_event_modifier$#! [Concept('concept_modifier','$concept_modifiers$')] değiştiricilerinden #R hiçbirine sahip değil#!.#!"
 MR_FIFA_MEMBER_TRIGGER_TT: "#default_text En az #BLUE 16#! ülke #V FIFA Üyesidir#!. Şu anda FIFA'nın #G [GetGlobalVariable('vikelas_num_fifa_members_global_var').GetValue]#! üyesi var.#!"
 MR_JOIN_FIFA_BUTTON: "FIFA'ya Katıl"
 MR_JOIN_FIFA_BUTTON_TT: "#T FIFA'ya Katıl#!\nFIFA'ya katılmak, Futbol Dünya Kupası'na katılabilmek için ön koşuldur.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_LEAVE_FIFA_BUTTON: "FIFA'dan Ayrıl"
 MR_LEAVE_FIFA_BUTTON_TT: "#T FIFA'dan Ayrıl#!\nFIFA tüm ideallerine ihanet etti ve geride bırakılması gereken yozlaşmış, ticarileşmiş bir sivil toplum kuruluşuna dönüştü.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_LEAVE_FIFA_TRIGGER_TT: "#default_text [GetPlayer.GetName], FIFA'nın ne #V Başkanı#! ne de #V Yönetim Kurulu Üyesidir#!.#!"
 MR_SCHOOL_SPORTS_BUTTON: "Okul Sporlarını Başlat"
 MR_SCHOOL_SPORTS_BUTTON_TT: "#T [GetPlayer.GetName] Ülkesinde Okul Sporlarını Başlat#!\nOkul sporlarını başlatarak, sporcu özelliklerine sahip kişilerin ortaya çıkma ihtimalini artırabilir ve Olimpiyat Oyunları'ndaki başarı şansımızı yükseltebiliriz.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_SCHOOL_SPORTS_PUBLIC_SCHOOLS_TRIGGER_TT: "#default_text [GetPlayer.GetName], [GetLawType('law_public_schools').GetName] [concept_law] yasasına sahiptir.#!"
 MR_SCHOOL_SPORTS_IG_ATHLETE_LEADER_TRIGGER_TT: "#default_text [GetPlayer.GetName], hükümette bulunan bir #V [concept_interest_group]#! lideri olarak #V Sporcu Özelliğine#! sahip bir karaktere sahiptir.#!"
 MR_SCHOOL_SPORTS_SPORTS_FACILITIES_TRIGGER_TT: "#default_text [GetPlayer.GetName], bir [GetBuildingType('building_government_administration').GetName] içinde en az bir aktif #V Spor Tesisi [concept_production_method]#! sahibidir.#!"
 MR_WORLDCUP_BUTTON: "Futbol Dünya Kupası"
 MR_WORLDCUP_BUTTON_TT: "#T Futbol Dünya Kupasını Düzenle#!\nDünya Kupası, millî takımlar arasında düzenlenen bir futbol turnuvasıdır. Takımlar her dört yılda bir Dünya Kupası finallerine katılmaya hak kazanabilir. Dört haftalık turnuvada en iyi millî takım dünya şampiyonu olarak belirlenecektir. Dünya futbol federasyonu Fédération Internationale de Football Association (FIFA), turnuvayı düzenler ve pazarlamasını yapar. İlk Dünya Kupası 1930'da Uruguay'da düzenlendi ve ev sahibi takım tarafından kazanıldı.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_FOOTBALL_WORLDCUP_FOOTBALL_ASSOCIATION_TRIGGER_TT: "#default_text Futbol Federasyonuna sahip en az #G 10#! ülke var.#!"
 MR_FIFA_BUTTON_TT: "#T FIFA'yı Kur#!\nFutbolun yayılmasıyla uluslararası maçların sayısı arttıkça, küresel bir yönetim organına duyulan ihtiyaç ortaya çıktı. FIFA (Fransızca: Fédération Internationale de Football Association), futbol, futsal ve plaj futbolunun uluslararası özdenetimli yönetim organıdır. 21 Mayıs 1904'te kurulan FIFA, dünyanın en eski ve en büyük sivil toplum kuruluşlarından biridir. FIFA'nın kurulması, bireysel ülkeler arasında uluslararası maçların oynanmasına olanak tanır ve bu maçları kazanarak antrenörleri geliştirebilir. Bu süreç sonunda bir Dünya Kupası'nın kurulmasına yol açacaktır.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_FIFA_TRIGGER_TT: "#default_text Futbol Federasyonuna sahip en az #G 6#! ülke var.#!"
