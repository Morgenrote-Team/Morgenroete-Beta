 theiler_gui_current_microscope_compound_tooltip_loc: "Bilim insanlarımız şu anda bir $theiler_early_compound_microscope_flag$ kullanıyor.\n\n[GetTechnology('theiler_microbiology_tech').GetName] teknolojisini araştırdığınızda, bir $theiler_achromatic_microscope_flag$ geliştirmeye başlayabileceksiniz. Geliştirmeyi tamamlamak için [concept_tesla_engineer]ınız ve [concept_theiler_biologist]ınızın bunun üzerinde #V 12 ay#! çalışması gerekecek. Ayrıca seviye #V 3#! bir [GetBuildingType('building_glassworks').GetName] yapısına ihtiyacınız olacak."
 theiler_gui_current_microscope_achromatic_tooltip_loc: "Bilim insanlarımız şu anda bir $theiler_achromatic_microscope_flag$ kullanıyor.\n\n[GetTechnology('verrier_nuclear_physics_tech').GetName] teknolojisini araştırdığınızda, bir $theiler_electron_microscope_flag$ geliştirmeye başlayabileceksiniz. Geliştirmeyi tamamlamak için [concept_tesla_engineer]ınız ve [concept_theiler_biologist]ınızın bunun üzerinde #V 12 ay#! çalışması gerekecek. Ayrıca seviye #V 5#! bir [GetBuildingType('building_glassworks').GetName] yapısına ihtiyacınız olacak."
 theiler_gui_current_microscope_electron_tooltip_loc: "Bilim insanlarımız şu anda bir $theiler_electron_microscope_flag$ kullanıyor.\n\nBu, en gelişmiş mikroskoptur."
