l_turkish:
 MR_BIOLOGIST_MICROORGANISM_RESEARCH_BUTTON: "Mikroorganizma Araştırması"
 MR_BIOLOGIST_MICROORGANISM_RESEARCH_BUTTON_TT: "#T Mikroorganizma Araştırması#!\nYeni [Concept('concept_theiler_microorganism','$concept_theiler_microorganisms$')] arayışı, bunların incelenmesi ve bunlarla ilgili deneyler mikrobiyolojik çalışmaların temel bir parçasıdır. Biyologlar yalnızca bir patojen arayışı için ön çalışma yapmakla kalmaz, aynı zamanda tesadüfi keşiflerde de bulunabilir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGIST_MICROORGANISM_RESEARCH_ACTIVE_TT: "#T Mikroorganizma Araştırması#!\n[concept_theiler_biologist]ınız şu anda yeni [Concept('concept_theiler_microorganism','$concept_theiler_microorganisms$')] arıyor, bunları inceliyor ve deneyler yapıyor. Biyologlar yalnızca bir patojen arayışı için ön çalışma yapmakla kalmaz, aynı zamanda tesadüfi keşiflerde de bulunabilir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGIST_FIND_PATHOGEN_BUTTON: "Patojen Bul"
 MR_BIOLOGIST_FIND_PATHOGEN_BUTTON_TT: "#T Patojen Bul#!\nBir [concept_theiler_pathogen] arayışı, daha sonra bir aşı geliştirilmesi için ön koşuldur. Patojene bağlı olarak keşif süreci daha uzun sürebilir veya yalnızca belirli koşullar altında başlayabilir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGIST_FIND_PATHOGEN_ACTIVE_TT: "#T Patojen Bul#!\n[concept_theiler_biologist]ınız şu anda daha sonra bir aşı geliştirilmesi için ön koşul olan bir [concept_theiler_pathogen] arıyor. Patojene bağlı olarak keşif süreci daha uzun sürebilir veya yalnızca belirli koşullar altında başlayabilir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ACTIVE_BIOLOGIST_TRIGGER: "#default_text [GetPlayer.GetName], #V meşgul olmayan#! bir [concept_theiler_biologist] sahibidir.#!"
 MR_BIOLOGIST_CAN_FIND_PATHOGEN_TRIGGER_TT: "#default_text Şunlardan herhangi biri:[GetPlayer.GetCustom('GUI_theiler_can_find_cholera_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_diphtheria_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_measles_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_plague_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_polio_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_typhus_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_scarlet_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_smallpox_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_tuberculosis_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_yellow_fever_trigger_custom_loc')]#!"
 MR_BIOLOGIST_CREATE_VACCINE_BUTTON: "Aşı Oluştur"
 MR_BIOLOGIST_CREATE_VACCINE_BUTTON_TT: "#T Aşı Oluştur#!\n[concept_theiler_biologist]ınız şu anda bir Aşı oluşturuyor; bu, bir Biyoloğun çalışmalarının zirvesidir. Öncelikle hastalığa neden olan [concept_theiler_pathogen] üzerinde araştırma yapılması gerekir. Belirli koşullar altında [Concept('concept_theiler_vaccine','$concept_theiler_vaccines$')], hastalığın ortaya çıkmasını tamamen önleyebilir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGIST_CREATE_VACCINE_ACTIVE_TT: "#T Aşı Oluştur#!\nAşı geliştirmek bir biyoloğun çalışmalarının zirvesidir. Öncelikle hastalığa neden olan [concept_theiler_pathogen] üzerinde araştırma yapılması gerekir. Belirli koşullar altında [Concept('concept_theiler_vaccine','$concept_theiler_vaccines$')], hastalığın ortaya çıkmasını tamamen önleyebilir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGIST_CAN_CREATE_VACCINE_TRIGGER_TT: "#default_text [GetPlayer.GetName], henüz aşısı bulunmayan bir patojen keşfetti ve ayrıca ilgili teknolojiye sahip.#!"
 MR_10000_SPECIMEN_TRIGGER_TT: "#default_text [GetPlayer.GetName], #V 10000 veya daha fazla#! [Concept('concept_dubois_specimen','$concept_dubois_specimens$')] sahibidir (şu anda [GetPlayer.MakeScope.Var('dubois_specimen').GetValue|0+]).#!"
 MR_BOTANICAL_EXPEDITION_BUTTON_TT: "#T Botanik Seferi#!\nBotanik seferleri (bazen 'Bitki avcılığı' olarak da adlandırılır), belirli bir bölgenin florasını araştırmak amacıyla düzenlenen bilimsel gezilerdir. Bir [concept_dubois_naturalist], örneklerin ve [concept_ito_medicinal_plants] tanımlanması, betimlenmesi ve toplanmasından sorumlu olur.\n\nSıtma bulunan bir Eyalette Botanik Seferi düzenlemek istiyorsanız [GetTechnology('malaria_prevention').GetName] [concept_technology] teknolojisine ihtiyacınız olduğunu unutmayın.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_SAFARI_EXPEDITION_BANNED_TRIGGER_TT: "#default_text Botanik Seferleri #V siyasi nedenlerle#! yasaklandı.#!"
 MR_SAFARI_EXPEDITION_ACCESS_RAINFOREST_TRIGGER_TT: "#default_text [GetPlayer.GetName], [concept_ito_medicinal_plants] Eyalet Özelliğine sahip bir Eyalete sahip. Bu Eyalet bir #V Sıtma Eyaleti#! ise ayrıca [GetTechnology('malaria_prevention').GetName] [concept_technology] teknolojisini araştırmış olmanız gerekir.#!"
 MR_BOTANICAL_EXPEDITION_RECALL_BUTTON_TT: "#T Doğa Bilimciyi Botanik Seferinden Geri Çağır#!\n[concept_dubois_naturalist]ınızın botanik araştırmasını bırakıp, hayvan yakalamak gibi başka amaçlarla kullanılmak üzere geri dönmesini emreder.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BOTANICAL_EXPEDITION_RECALL_TRIGGER_TT: "#default_text [concept_dubois_naturalist]ınız #V seyahat etmiyor veya hasta değil#!.#!"
 MR_BOTANICAL_EXPEDITION_RECALL_NATURALIST_EFFECT_TT: "[concept_dubois_naturalist]ınız artık meşgul değil."
 MR_BIOLOGIST_COCHLIOMYIA_EREDICATION_BUTTON: "Cochliomyia İmhası"
 MR_BIOLOGIST_COCHLIOMYIA_EREDICATION_BUTTON_TT: "#T Cochliomyia İmhası#!\nGeniş teknolojik imkânlar sayesinde, hükümet desteğine sahip bir biyolog, baş belası Cochliomyia sineğini nihayet tamamen ortadan kaldırmanın bir yöntemini araştırabilir. Bu, etkilenen bölgelerde tarımsal verimi artıracaktır.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_COCHLIOMYIA_STATE_TRIGGER: "#default_text [GetPlayer.GetName], #V $theiler_state_trait_cochliomyia$#! [Concept('concept_modifier','$concept_modifiers$')] özelliğine sahip en az bir Eyalete sahip.#!"
 MR_BIOLOGIST_STI_BUTTON: "Kısır Böcek Tekniği"
 MR_BIOLOGIST_STI_BUTTON_TT: "#T Kısır Böcek Tekniği#!\nCochliomyia sineklerinin musallat olduğu bir Eyalette, bir biyolog üç yıllık bir deneme sürecinde paraziti ortadan kaldırmayı deneyebilir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGIST_CYDIA_PESTICIDE_BUTTON: "Cydia İlacı"
 MR_BIOLOGIST_CYDIA_PESTICIDE_BUTTON_TT: "#T Cydia İlacı#!\nBir biyolog, meyve üreticilerimizi elma içkurdu nedeniyle oluşan ürün kayıplarından kurtarmak için etkili bir pestisit geliştirebilir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_CYDIA_STATE_TRIGGER: "#default_text [GetPlayer.GetName], #V $theiler_state_trait_cydia$#! [Concept('concept_modifier','$concept_modifiers$')] özelliğine sahip en az bir Eyalete sahip.#!"
 MR_BIOLOGIST_IMPROVE_AGRICULTURE_BUTTON: "Tarımı Geliştir"
 MR_BIOLOGIST_IMPROVE_AGRICULTURE_BUTTON_TT: "#T Tarımı Geliştir#!\nBiyoloğunuz, ülkenizdeki tarım yapılarını geliştirmek için yeteneklerini kullanabilir. Bu, [GetBuildingGroup('bg_agriculture').GetName], [GetBuildingGroup('bg_ranching').GetName] veya [GetBuildingGroup('bg_plantations').GetName] grubundaki yapılardan birini geliştirecektir.\n\nYapının kazanacağı değiştiriciler:\n$theiler_building_throughput_add_modifier_with_tooltip$\n$theiler_building_production_mult_modifier_with_tooltip$\n$theiler_building_goods_input_mult_modifier_with_tooltip$\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGIST_IMPROVE_AGRICULTURE_TRIGGER_TT: "#default_text Seviye 1 veya daha yüksek olan [GetBuildingGroup('bg_agriculture').GetName], [GetBuildingGroup('bg_ranching').GetName] veya [GetBuildingGroup('bg_plantations').GetName] yapılarından en az biri, üç [Concept('concept_modifier','$concept_modifiers$')] değiştiricisinin tamamına sahip değil.#!"
 MR_BIOLOGIST_IMPROVE_AGRICULTURE_ACTIVE_TT: "#T Tarımı Geliştir#!\n#p Biyoloğunuz şu anda bir [GetBuildingGroup('bg_agriculture').GetName], [GetBuildingGroup('bg_ranching').GetName] veya [GetBuildingGroup('bg_plantations').GetName] yapısını geliştiriyor.#!"
