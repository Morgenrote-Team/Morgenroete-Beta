 theiler_biologist_no_biologist_achievements_loc: "Bir [concept_theiler_biologist] sahibi olduğunuzda, bu [concept_theiler_biologist]#! kişisinin #V Başarıları#! burada gösterilecek."
 theiler_biologist_achievements_intro_loc: "#V Bu Biyoloğun Başarıları#!\n #indent_newline:3 • [Scope.GetCharacter.GetFullName], başarılı bir Biyologdur.#!"
 theiler_microbiology_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting], modern mikrobiyolojinin kurucusu olarak kabul edilmektedir.#!"
 theiler_cholera_pathogen_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting], koleraya neden olan bakteriyi ilk keşfeden kişi oldu ve daha sonra bu bakteriyi tanımlayıp izole etti.#!"
 theiler_tuberculosis_pathogen_achievement_loc: "\n #indent_newline:3 • Tüberküloza neden olan etken ilk olarak Dr. [Scope.GetCharacter.GetLastNameNoFormatting] tarafından keşfedildi; kendisi ayrıca etkeni tanımlayıp izole etti.#!"
 theiler_smallpox_pathogen_achievement_loc: "\n #indent_newline:3 • Çiçek hastalığına neden olan mikroorganizmayı ilk keşfeden kişi Dr. [Scope.GetCharacter.GetLastNameNoFormatting] oldu; ayrıca mikroorganizmayı belgeleyip izole etti.#!"
 theiler_typhus_pathogen_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting], tifüsten sorumlu etkeni tespit etti ve başarıyla tanımlayıp izole etti.#!"
 theiler_yellow_fever_pathogen_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting], sarı hummaya neden olan etkeni keşfeden öncü bilim insanı oldu; ayrıca etkeni tanımlayıp izole etti.#!"
 theiler_measles_pathogen_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting], kızamık etkenini keşfetti ve ardından etkeni tanımlayıp izole etti.#!"
 theiler_scarlet_pathogen_achievement_loc: "\n #indent_newline:3 • Kızıl hastalığının ardındaki bakteriyi ilk keşfeden kişi Dr. [Scope.GetCharacter.GetLastNameNoFormatting] oldu; ayrıca bakteriyi tanımlayıp izole etti.#!"
 theiler_plague_pathogen_achievement_loc: "\n #indent_newline:3 • Veba etkeni ilk olarak Dr. [Scope.GetCharacter.GetLastNameNoFormatting] tarafından keşfedildi; kendisi etkeni tanımlayıp başarıyla izole etti.#!"
 theiler_diphteria_pathogen_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting], difteriye neden olan mikroorganizmayı ilk tanımlayan kişi oldu ve daha sonra bunu tanımlayıp izole etti.#!"
 theiler_polio_pathogen_achievement_loc: "\n #indent_newline:3 • Çocuk felci etkeninin keşfi, tanımlanması ve izolasyonu ilk olarak Dr. [Scope.GetCharacter.GetLastNameNoFormatting] tarafından gerçekleştirildi.#!"
 theiler_cholera_vaccine_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting], etkili bir kolera aşısının geliştirilmesi, test edilmesi ve üretimine öncülük etti.#!"
 theiler_tuberculosis_vaccine_achievement_loc: "\n #indent_newline:3 • Tüberküloz aşısını ilk geliştiren, test eden ve üreten bilim insanı Dr. [Scope.GetCharacter.GetLastNameNoFormatting] oldu.#!"
 theiler_smallpox_vaccine_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting], çiçek hastalığına karşı etkili bir aşıyı ilk tasarlayan, değerlendiren ve üreten kişi oldu.#!"
 theiler_typhus_vaccine_achievement_loc: "\n #indent_newline:3 • İlk etkili tifüs aşısını geliştirme, test etme ve üretme çalışmaları Dr. [Scope.GetCharacter.GetLastNameNoFormatting] tarafından gerçekleştirildi.#!"
 theiler_yellow_fever_vaccine_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting], sarı humma aşısının geliştirilmesi, test edilmesi ve üretilmesi için ilk başarılı çalışmaya öncülük etti.#!"
 theiler_measles_vaccine_achievement_loc: "\n #indent_newline:3 • Çalışan bir kızamık aşısını ilk geliştiren, test eden ve üreten kişi Dr. [Scope.GetCharacter.GetLastNameNoFormatting] oldu.#!"
 theiler_scarlet_vaccine_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting], test edilip üretilen ilk kızıl aşısının geliştirilmesine öncülük eden bilim insanı oldu.#!"
 theiler_plague_vaccine_achievement_loc: "\n #indent_newline:3 • Vebaya karşı etkili bir aşının geliştirilmesi, test edilmesi ve üretilmesi ilk kez Dr. [Scope.GetCharacter.GetLastNameNoFormatting] tarafından gerçekleştirildi.#!"
 theiler_diphteria_vaccine_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting], difteriye karşı ilk etkili aşıyı başarıyla geliştirip test etti ve üretti.#!"
 theiler_polio_vaccine_achievement_loc: "\n #indent_newline:3 • Etkili bir çocuk felci aşısının geliştirilmesi, test edilmesi ve üretilmesi ilk olarak Dr. [Scope.GetCharacter.GetLastNameNoFormatting] tarafından gerçekleştirildi.#!"
 theiler_pharmaceutical_strychnine_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting], striknine dayalı bir ilacı ilk keşfeden kişi olarak kabul edilmektedir.#!"
 theiler_pharmaceutical_emetine_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting], emetine dayalı bir ilacın geliştirilmesinde öncü olarak kabul edilmektedir.#!"
 theiler_pharmaceutical_atropine_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting], atropine dayalı bir ilacı ilk keşfeden kişi olarak kabul edilmektedir.#!"
 theiler_pharmaceutical_aloin_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting], aloin bazlı bir ilacı ilk keşfeden kişi olarak kabul edilmektedir.#!"
 theiler_pharmaceutical_digitoxin_achievement_loc: "\n #indent_newline:3 • Digitoksin bazlı bir ilacın keşfi Dr. [Scope.GetCharacter.GetLastNameNoFormatting]'a dayanmaktadır.#!"
 theiler_pharmaceutical_quinine_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting], kinin kullanarak bir ilaç geliştiren ilk kişi oldu.#!"
 theiler_pharmaceutical_thymol_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting], timol bazlı bir ilacı ilk keşfeden kişi olarak kabul edilmektedir.#!"
 theiler_pharmaceutical_pilocarpine_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting], pilokarpin bazlı bir ilacın keşfedicisi olarak kabul edilmektedir.#!"
 theiler_pharmaceutical_ephedrine_achievement_loc: "\n #indent_newline:3 • Efedrin bazlı bir ilacın ilk keşfi Dr. [Scope.GetCharacter.GetLastNameNoFormatting]'a atfedilmektedir.#!"
 theiler_pharmaceutical_strophantine_achievement_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting], strfantin bazlı bir ilacı ilk bulan kişi olarak kabul edilmektedir.#!"