 VISIT_IOC_BUTTON: "IOC'yi Ziyaret Et"
 MR_VISIT_IOC_POSSIBLE_FOUNDED_TT: "#default_text #V Uluslararası Olimpiyat Komitesi kuruldu#!.#!"
 MR_VISIT_IOC_POSSIBLE_TT: "#default_text Şu anda #V IOC'yi ziyaret etmiyorsunuz#!.#!"
 VISIT_IOC_BUTTON_TT: "#T Uluslararası Olimpiyat Komitesini Ziyaret Et#!\nÜyeler, bir sonraki Olimpiyatlar veya uluslararası madalya tablosu hakkında bilgi almak için Uluslararası Olimpiyat Komitesini ziyaret edin.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_IOC_FOUNDATION_BUTTON: "IOC'yi Kur"
 MR_IOC_FOUNDATION_BUTTON_TT: "#T Uluslararası Olimpiyat Komitesini Kur#!\nUluslararası Olimpiyat Komitesi (IOC), dernek şeklinde kurulmuş bir sivil toplum kuruluşudur. Komitenin amacı modern Olimpiyat Oyunlarını düzenlemek ve denetlemektir. Kurucu ülke, Olimpiyat Oyunlarının düzenleneceği yerleri belirleyen yönetim kurulunda kalıcı bir koltuğa sahip olur. IOC'nin kurulmasından kısa süre sonra, bundan böyle her dört yılda bir düzenlenecek ilk Olimpiyat Oyunları organize edilebilir. Belirli koşullar altında diğer ülkeler düzenli üye olarak IOC'ye katılabilir, ancak yönetim kurulundaki koltuk sayısı sınırlıdır.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_IOC_FOUNDATION_HAS_ACADEMIC_TRIGGER_TT: "#default_text [GetPlayer.GetName] en az bir [concept_academics_academic] sahibidir.#!"
 MR_IOC_FOUNDATION_PEACE_TRIGGER_TT: "#default_text [GetPlayer.GetName] barış hâlindedir.#!"
 MR_IOC_MEMBER_BUTTON: "IOC'ye Katıl"
 MR_IOC_MEMBER_BUTTON_TT: "#T IOC Üyesi Ol#!\nDört yılda bir düzenlenen Olimpiyat Oyunlarına katılmak için Uluslararası Olimpiyat Komitesine katılın. IOC üyeleri ayrıca oyunlara kendi ülkelerinde ev sahipliği yapma şansına sahip olur.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_IOC_MEMBER_INFAMY_TRIGGER_TT: "#default_text [GetPlayer.GetName] ülkesinin kötü şöhreti #n 50#! değerinden düşük.#!"
 MR_IOC_MEMBER_NOT_UNRECOGNIZED_TRIGGER_TT: "#default_text [GetPlayer.GetName] #V tanınmamış değildir#!.#!"
 MR_IOC_MEMBER_NOT_HOSTING_TRIGGER_TT: "#default_text [GetPlayer.GetName] #V şu anki Olimpiyat Ev Sahibi değildir#!.#!"
 MR_IOC_BRIBE_BUTTON: "IOC'yi Rüşvetle İkna Et"
 MR_IOC_BRIBE_BUTTON_TT: "#T IOC'yi Rüşvetle İkna Et#!\nIOC Yönetim Kuruluna cömert bir 'bağış' yaparak üyelerin desteğini kazanabilir ve bir sonraki Olimpiyat Oyunlarının ev sahipliği dağıtımında dördüncü aday olarak yer alabiliriz. Ancak bundan sonra seçileceğimizin garantisi yoktur. Diğer IOC üyeleri de cömertliğimizi yanlış anlayabilir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_IOC_BRIBE_NOT_BRIBING_ALREADY_TRIGGER_TT: "#default_text [GetPlayer.GetName] şu anda #V IOC'ye rüşvet vermiyor#!.#!"
 MR_OLYMPIC_FLAME_BUTTON: "Olimpiyat Meşalesi"
 MR_OLYMPIC_FLAME_BUTTON_TT: "#T Olimpiyat Meşalesi#!\nYunan tanrıçası Hestia'nın hiç sönmeyen ocak ateşinden esinlenen Olimpiyat Meşalesi ilk kez 1928'de Amsterdam Olimpiyatlarında kullanıldı. Buna eşlik eden Olimpiyat meşalesi koşusu geleneği ise 1936 Berlin Yaz Oyunlarında başlatıldı. Yaygın inanışın aksine, bu fikir Nasyonal Sosyalistlerden değil, Alman-Yahudi arkeolog Alfred Schiff'ten geldi. Bu geleneğin başlatılması Olimpiyat Oyunlarına yalnızca yeni bir kimlik sembolü kazandırmakla kalmayacak, aynı zamanda halkı her yıl bir araya getirerek diğer sorunlardan uzaklaştıran moral yükseltici bir sembol görevi görecekti.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_IOC_OLYMPIC_FLAME_IS_HOST_TRIGGER_TT: "#default_text [GetPlayer.GetName] #V bir sonraki Olimpiyat Oyunlarına ev sahipliği yapmaya hazırlanıyor#!.#!"
 MR_IOC_PRESIDENT_BUTTON: "IOC Başkanı Ol"
 MR_IOC_PRESIDENT_BUTTON_TT: "#T IOC Başkanı Ol#!\nIOC'nin aktif bir başkanı yoksa bu görevi üstlenebiliriz. Bunun için Olimpiyat Komitesinin Genel Merkezini kontrol etmemiz gerekir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_IOC_CONTROLS_HQ_TRIGGER_TT: "#default_text [GetPlayer.GetName], [GetBuildingType('building_vikelas_ioc').GetName] yapısını kontrol ediyor.#!#!"
 MR_IOC_DISCIPLINE_BUTTON: "Olimpik Branş Başlat"
 MR_IOC_DISCIPLINE_BUTTON_TT: "#T Olimpik Branş Başlat#!\nIOC ne kadar büyür ve Olimpiyat Oyunlarına ne kadar çok ülke katılırsa o kadar fazla branş eklenebilir. Daha fazla branş, daha fazla madalya anlamına gelir. Millî sporlar da dâhil olmak üzere toplam 20 branş eklenebilir.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]\" MR_IOC_15_MEMBERS_TRIGGER_TT: \"#default_text The IOC has at least #G 15#! #V Members#!.#!"
 MR_IOC_15_MEMBERS_TRIGGER_TT: "#default_text IOC'nin en az #G 15#! #V Üyesi#! var.#!"
 MR_IOC_20_MEMBERS_TRIGGER_TT: "#default_text IOC'nin en az #G 20#! #V Üyesi#! var.#!"
 MR_IOC_25_MEMBERS_TRIGGER_TT: "#default_text IOC'nin en az #G 25#! #V Üyesi#! var.#!"
 MR_IOC_30_MEMBERS_TRIGGER_TT: "#default_text IOC'nin en az #G 30#! #V Üyesi#! var.#!"
 MR_IOC_40_MEMBERS_TRIGGER_TT: "#default_text IOC'nin en az #G 40#! #V Üyesi#! var.#!"
 MR_IOC_50_MEMBERS_TRIGGER_TT: "#default_text IOC'nin en az #G 50#! #V Üyesi#! var.#!"
 MR_IOC_60_MEMBERS_TRIGGER_TT: "#default_text IOC'nin en az #G 60#! #V Üyesi#! var.#!"
 MR_IOC_MAKE_NATIONAL_SPORT_DISCIPLINE_BUTTON: "[GetPlayer.GetCustom('vikelas_national_sport_for_GUI_type')] Olimpik Branş Olsun"
 MR_IOC_MAKE_NATIONAL_SPORT_DISCIPLINE_BUTTON_TT: "#T [GetPlayer.GetCustom('vikelas_national_sport_for_GUI_type')] Branşını Olimpik Branş Yap#!\nIOC Başkanı, kendi millî sporunu zorunlu bir Olimpik branş hâline getirebilir. Bu, yalnızca bir kez alınabilecek özel bir karardır.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_IOC_NO_BRIBE_BUTTON: "IOC'ye Rüşvet Vermeyi Durdur"
 MR_IOC_NO_BRIBE_BUTTON_TT: "#T IOC'ye Rüşvet Vermeyi Durdur#!\nYakın zamanda Olimpiyat Oyunlarına ev sahipliği yaptıysak, yeniden bu kadar kısa sürede başvuru yapamayacağımız için rüşvet vermeyi durdurmak akıllıca olacaktır.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_IOC_BRIBE_AT_LEAST_3_YEARS_TRIGGER_TT: "#default_text IOC'ye verilen rüşvetin süresi, sonlandırılabilmesi için #V en az dört yıl#! olmalıdır.#!"