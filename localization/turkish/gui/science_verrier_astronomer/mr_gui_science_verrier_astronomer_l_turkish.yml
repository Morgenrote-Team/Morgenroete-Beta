l_turkish:
 MR_STANDARD_TIME_BUTTON: "Standart Zamanı Kabul Et"
 MR_STANDARD_TIME_BUTTON_TT: "#T Standart Zamanı Kabul Et#!\nÇan kulelerinin değil, istasyon saatlerinin ritmine göre hareket eden bir dünyada dakika ve saatlerin giderek önem kazanmasıyla, ülke genelinde zamanı standartlaştırmak önemli bir ihtiyaç hâline geldi.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PRIME_MERIDIAN_BUTTON: "Başlangıç Meridyeni"
 MR_PRIME_MERIDIAN_BUTTON_TT: "#T Başlangıç Meridyeni#!\nUlusal standart zamanların giderek daha fazla kullanılmaya başlanmasıyla yeni bir sorun ortaya çıktı: uluslararası zaman dilimleri için referans noktası olarak kullanılabilecek bir başlangıç meridyeni arayışı.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_3_GREAT_POWERS_HAVE_STANDARD_TIME_TRIGGER_TT: "#default_text En az #V 3 Büyük Güç#! standart zamanı kabul etti.#!"
 MR_20_COUNTRIES_HAVE_STANDARD_TIME_TRIGGER_TT: "#default_text En az #V 20 ülke#! standart zamanı kabul etti.#!"