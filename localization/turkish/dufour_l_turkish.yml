 dufour.901.t: "Yerel halkın anketi bozması"
 dufour.901.d: "[SCOPE.sState('dufour_mapping_scope').GetName] bölgesindeki anket çalışmaları sırasında, anketçilerimiz kırsal bölgede yaşayanlarla çatışmaya girdi. Görünüşe göre çalışmalarıyla bir cenazeyi rahatsız etmişler."
 dufour.901.f: "\"Hadi, gitsek iyi olacak! Duymadınız mı? Bizim haritaya ihtiyacımız yok, her zaman kendi yolumuzu bulduk!\""
 dufour.901.g: "Başınız sağ olsun."
 dufour.901.h: "Devam edin!"
 dufour.902.t: "Dağda bir anketçi öldü"
 dufour.902.d: "[SCOPE.sState('dufour_mapping_scope').GetName]’in yüksek dağlarından birinde anket yaparken, anketçilerimiz bir gök gürültülü fırtına tarafından şaşırtıldı. Fırtına çıktı ve yağmur yağdı. Anketçiler, çadırlarında sığındılar fakat bir yıldırım biri öldürdü ve diğerini yaraladı."
 dufour.902.f: "\"Bacağım yıldırım çarptı ama birkaç gün içinde iyileşti. Sonunda aşağı inip güvenliğe ulaşabildim. Gerçekten bir zorluktu!\""
 dufour.902.g: "Aman Tanrım!"
 dufour.903.t: "Yerel halk anketçilere yardımcı oldu"
 dufour.903.d: "[SCOPE.sState('dufour_mapping_scope').GetName]’de anketçilerimiz neredeyse kayboluyordu ama birkaç yerli onlara yardım etti ve hatta kalacak yer ve en hızlı yollar hakkında bilgi sundu. Bu, haritanın daha hızlı tamamlanmasına kesinlikle yardımcı olacak!"
 dufour.903.f: "\"Sonra çalışırsınız. Önce birlikte içmemiz gerek. Bu bizim en iyi Kirsch'imiz!\""
 dufour.903.g: "Yardımlarını takdir ediyoruz!"
 dufour.904.t: "Ekipman kayboldu!"
 dufour.904.d: "[SCOPE.sState('dufour_mapping_scope').GetName]’de bir dağa tırmanırken, anketçilerimizden biri ekipmanını kaybetti. Yeni ekipman sağlamak zorundayız ya da ilerleme yavaşlayacak."
 dufour.904.f: "\"Sadece düştü... Tutamadım... Kim bilebilirdi ki ekipmanları sırt çantalarımıza sabitlememiz gerektiğini?\""
 dufour.904.g: "Bunlarla başa çıkmalılar."
 dufour.904.h: "Yeni araç gereç al!"
 dufour.905.t: "Blüemlisalp mi, Frau mı?"
 dufour.905.d: "[SCOPE.sState('dufour_mapping_scope').GetName]’deki yerel halk aynı dağa iki farklı isim veriyor: Blüemlisalp ve Frau. Hangi ismi seçmeliyiz?"
 dufour.905.f: "\"Sadece bir madeni para atamaz mıyız?\""
 dufour.905.g: "Blüemlisalp!"
 dufour.905.h: "Frau!"
 dufour.906.t: "Anketçi, harita üzerindeki çalışmaları hızlandırdı"
 dufour.906.d: "[SCOPE.sCharacter('surveyor_scope').GetFullName], tanınmış bir anketçi, İsviçre'nin topografik haritasının oluşturulmasında büyük bir ilerleme kaydetti."
 dufour.906.f: "\"Evet, bu alet ölçüm yapmak için; yıldızları seyretmek için değil.\""
 dufour.906.g: "Harika İş!"
 dufour.907.t: "Matematikçi hesaplamalarda yardımcı oldu"
 dufour.907.d: "[SCOPE.sCharacter('mathematician_scope').GetFullName], matematik eğitimi almış bir kişi olarak, ekibimize çeşitli hesaplamaları çözmede yardımcı oldu. Bu, haritanın daha hızlı tamamlanmasına yardımcı olacak."
 dufour.907.f: "\"Matematiğin gerçekten işe yaradığını kim bilebilirdi ki!\""
 dufour.907.g: "İyi ki Matematikçilerimiz var!"
 dufour.908.t: "Balon uçuşu sanatçıları ilhamlandırdı"
 dufour.908.d: "[SCOPE.sCharacter('balloonist_scope').GetFullName], tanınmış bir baloncu sayesinde, birkaç sanatçı ve anketçi dünyayı yukarıdan görebildiler. Sanatçılar nefes kesen manzaradan ilham aldılar ve ülkemizi harita üzerinde daha gerçekçi bir şekilde nasıl tasvir edebileceklerini daha iyi anladılar."
 dufour.908.f: "\"Aman Tanrım! Umarım kaza yapmayız!\""
 dufour.908.g: "Dünyayı yukarıdan görmek etkileyici!"
 dufour.910.t: "İlk Sayfalar Yayınlandı: Jura ve Basel"
 dufour.910.d: "Yeni topografik haritamızın ilk sayfaları yayınlandı ve bunlar Basel çevresi ve Jura bölgesine odaklanıyor."
 dufour.910.f: "Jura, Savoie'dan Basel'e kadar uzanan ve bazı etekleri Konstanz Gölü'ne kadar ulaşan küçük dağlardan oluşan bir sıradağdır. Vaud, Neuchâtel, Bern, iki Basel, Solothurn ve Aargau'nun bazı kısımlarını kapsar. Birçok büyük şehir Jura'ya yakın konumdadır.\nÖrneğin Basel, İsviçre'nin en önemli şehirlerinden biridir. Basel hem Alsace hem de Baden ile sınır komşusudur ve Ren Nehri sayesinde iyi bağlantılara sahiptir.\nSadece birkaç yıl önce Basel Kantonu, Basel Stadt (Şehir) ve Basel Land (Kırsal) kantonlarına ayrıldı. İlginç bir şekilde, o dönemde kırsal kesim daha liberalken şehir patrisyenler tarafından yönetiliyordu. Basel oldukça kozmopolit bir şehirdir ve Leonhard Euler ile Daniel Bernoulli gibi büyük düşünürlere ev sahipliği yapmış eski bir üniversiteye sahiptir.\nÖte yandan Cenevre, Fransa tarafından çevrelenmiş büyük bir şehirdir. Napoléon döneminde Fransa'nın bir parçasıydı ve 1815'te İsviçre'ye geri döndü. Şimdi ilk özel bankalar kurulmaya başladı ve Cenevre yavaş yavaş finans sektörünün merkezi hâline geliyor. Ayrıca İsviçre'nin en büyük filozoflarından ikisi olan Voltaire ve Jean-Jacques Rousseau'ya da ev sahipliği yapmıştır."
 dufour.910.g: "İlginç!"
 dufour.910.h: "İsviçre hakkında hiçbir şey duymak istemiyorum!"
 dufour.910.no_more_information_tt: "Artık #n sadece#! İsviçre'yi etkisiz bir şekilde betimleyen olaylar almayacaksınız."
 dufour.911.t: "Yeni Sayfalar Yayınlandı: Schaffhausen, Thurgau ve St. Gallen"
 dufour.911.d: "Daha fazla sayfa yayınlandı. Bu sefer odak Jura ve Basel bölgesi, özellikle Schaffhausen, Thurgau ve St. Gallen Kantoları."
 dufour.911.f: "Schaffhausen, İsviçre'nin kuzeydoğusunda yer alır ve büyük ölçüde Almanya ile çevrilidir. Şehrin kendisi Ren Nehri'nin hemen yanında ve Neuhausen'deki Ren Şelaleleri'ne çok yakın konumdadır. Nehrin sağladığı enerji sayesinde Schaffhausen oldukça erken sanayileşebildi ve kırsal nüfusun etkisiyle 1831'de liberal bir kanton hâline geldi.\nThurgau, Fransız Devrimi İsviçre'ye yayılana kadar her yıl değişen başka bir kanton tarafından yönetiliyordu. 1815'ten beri tam teşekküllü bir kantondur ve tekstil sanayisi ile tarımın merkezlerinden biridir. Armut ağaçlarının bolluğu, Ost (doğu) ve Most (elma şarabı) kelimeleri üzerinden yapılan bir kelime oyunuyla \"Mostindien\" yani \"Elma Şarabı Hindistanı\" adının ortaya çıkmasına yol açmıştır. Thurgau, 1831'den beri liberal kantonlardan biridir ve İsviçre'de daha fazla merkezileşme istemektedir.\nSt. Gallen, din açısından bölünmüş bir kantondur ve bir zamanlar bir manastıra ve prens-piskoposluğa ev sahipliği yapmıştır. Tekstil sanayisinin merkezlerinden biridir ve liberal bir kantondur. St. Gallen Kantonu, her iki Appenzell kantonunu ve Alpler'in bir parçası olan etkileyici Säntis sıradağlarını çevreler."
 dufour.912.t: "Yeni Sayfalar Yayınlandı: Grisons ve Rhaetian Alpleri"
 dufour.912.d: "Daha fazla sayfa yayınlandı. Bu sefer odak Grisons Kantonuna ve Rhaetian Alpleri'ne yerleştirildi."
 dufour.912.f: "Grisons yalnızca İsviçre'nin en büyük kantonu değil, aynı zamanda İsviçre'de bir azınlık olan Rumantsch dilini konuşan halka ve Güney Tirol ile Friuli'de de bulunan Alp Romen dilleri grubuna ev sahipliği yapar.\nGrisons, Alpler'in hâkim olduğu bir bölge olduğu için seyrek nüfusludur. Özellikle adını antik Rhaeti kabilelerinden alan Rhaetian Alpleri öne çıkar. Grisons büyük ölçüde tarımsal bir kantondur ve Alp geçitleri üzerinden yapılan mal taşımacılığından da faydalanır. Napolyon Savaşları'ndan sonra bugün İtalya'ya ait olan bazı toprakların kaybedilmesi bir felaket olsa da Grisons'ta hâlâ İtalyanca konuşanların çoğunlukta olduğu bazı bölgeler bulunmaktadır. Bu da kantonu Almanca, Rumantsch ve İtalyanca olmak üzere üç dil grubuna sahip bir kanton hâline getirir.\nSiyasi açıdan Grisons, büyük ölçüde güçlü olan belediyeleri tarafından şekillendirilir. Ancak kantonu daha fazla merkezileştirmek isteyen liberal güçler son dönemde giderek güç kazanmaktadır."
 dufour.913.t: "Yeni Sayfalar Yayınlandı: Orta İsviçre"
 dufour.913.d: "Daha fazla sayfa yayınlandı. Bu sefer odak, Orta İsviçre'nin pek çok Kantonuna yerleştirildi."
 dufour.913.f: "Orta İsviçre, \"Eidgenossenschaft\", yani İsviçre Konfederasyonu'nun doğduğu yerdir. İlk olarak Uri, Schwyz ve Underwalden (bugün Niedwalden ve Obwalden olarak ayrılmıştır) Kantoları gevşek bir ittifak kurmuş, bu ittifak zamanla daha da genişlemiştir.\nOrta İsviçre'deki pek çok küçük Kantonun ana ekonomik faaliyeti, özellikle Gotthard güzergahı üzerinde mal taşımacılığıdır. Bunun dışında tarım, kereste ve bazı tekstil üretimi bu bölge için önemliydi.\nPolitik olarak Orta İsviçre, muhafazakar Katoliklerin egemenliğindeydi. Luzern Kanton'u, Luzern Şehri sayesinde Orta İsviçre'nin en liberal Kanton'u iken, Uri, Schwyz, Obwalden, Nidwalden, Glarus ve Zug gibi daha küçük Kantolar daha muhafazakar olup, yerel üst sınıflar tarafından yönetiliyordu.\nSchwyz, 1830'larda neredeyse ikiye bölünecekti, çünkü Kanton'un dış bölgeleri eşitlik ve siyasi katılım talep ediyordu. İç Schwyz, Tagsatzung (İsviçre'nin \"hükümeti\") askerleri tarafından işgal edildikten sonra bu talepleri kabul etti ve Schwyz tek bir Kanton olarak kaldı."
 dufour.914.t: "Yeni Sayfalar Yayınlandı: Ticino"
 dufour.914.d: "Daha fazla sayfa yayınlandı. Bu sefer odak, İsviçre'nin güneyindeki en uzak Kanton olan Ticino'ya yerleştirildi."
 dufour.914.f: "Ticino, İsviçre Konfederasyonu'nun İtalya'daki tek kalan mülküdür. 15. ve 16. yüzyıllarda fethedilen bu bölge, eski yerler (Kantonlar) tarafından yönetiliyordu ve Helvetik Cumhuriyet'in kurulmasına kadar devam etti. Ancak 1803'ten itibaren tam teşekküllü bir Kanton olmuştur.\nTicino'nun baskın ekonomik sektörleri tarım ve kerestecilikti. İpek üretimi de kârlı bir işti. İsviçre'nin başka bölgelerinde yetişmeyen tarım ürünleri burada yetiştirilebiliyordu: kestane, tütün, ipek ve çeşitli meyveler gibi.\n1830'da Ticino, liberal bir anayasaya sahip ilk Kantonlardan biriydi. Ancak Kanton'daki siyasi durum karışıktır, çünkü liberaller devleti merkezileştirmeyi isterken, muhafazakarlar bölgesel özerklikten yanadır."
 dufour.915.t: "Yeni Sayfalar Yayınlandı: Bern ve Fribourg"
 dufour.915.d: "Daha fazla sayfa yayınlandı. Bu sefer Bern ve Fribourg Kantonları'na odaklanıldı."
 dufour.915.f: "Hem Bern Kantonu hem de Fribourg Kantonu Fransızca ve Almanca konuşulan bölgelere sahiptir. Bern çok büyük bir kantonken Fribourg çok daha küçüktür. Bern, Jura sıradağlarından güneydeki Alpler'e kadar uzanır. Fribourg, Bern'in batısında yer alır ve Fribourg ile ünlü peynirinin geldiği Gruyère gibi kentlere ev sahipliği yapar.\nBern Kantonu'na büyük ölçüde tarım hâkimdir, ancak saatçilik komşu Neuchâtel'den Bernese Jura'ya doğru yavaş yavaş yayılmaktadır. Umarız sanayileşme yakında kantonun gelişmesine yardımcı olur.\nSiyasi açıdan Bern'e uzun süre şehrin patrisyenleri hâkim oldu, ancak 1830'larda kantondaki daha küçük kasabalardan gelen liberaller, Bern şehri halkının ve kırsal nüfusun haklarını dengeleyen yeni bir anayasa hazırlamayı başardılar.\nFribourg, özellikle tahıl üretimi ve peynircilik olmak üzere tarımın hâkim olduğu bir kantondur. Gruyère peyniri özellikle ünlüdür.\nSiyasi açıdan Fribourg'a muhafazakâr patrisyenler ve ruhban sınıfı hâkimdi. 1831'de yeni bir anayasa ilan edilse bile kanton muhafazakâr kalmaya devam etti ve seçimlerde muhafazakârlar hâlâ oyların çoğunluğunu elde etti."
 dufour.916.t: "Yeni Sayfalar Yayınlandı: Zürich ve Aargau"
 dufour.916.d: "Daha fazla sayfa yayınlandı. Bu sefer odak Zürich ve Aargau'ya yerleştirildi."
 dufour.916.f: "Hem Zürich hem de Aargau, İsviçre'nin kuzeyinde, büyük ölçüde nispeten düz Mittelland'da (Merkez Ova) yer alır. Her iki kanton da hızla sanayileşiyor ve çok yakında sanayi güç merkezlerine dönüşebilir.\nZürich, eski kantonlardan biridir ve uzun süre şehrin kendisinin hâkimiyeti altında kaldı. Zürich, makineleşmiş tekstil sanayisinin yanı sıra makine sanayisinin de merkezidir. Birçok fabrika nehirlerin kıyısında kurulmuş ve enerjisini bu nehirlerden sağlamıştır.\nSiyasi açıdan Zürich, 1830/31 yılına kadar şehrin patrisyenlerinin hâkimiyetindeydi; o dönemde kırsal kesimin halkı yeni bir anayasanın yürürlüğe konmasını zorladı. Sonraki seçimlerde liberaller ve radikaller çoğunluğu elde etti ve artık Zürich siyasetinde hâkim durumdalar.\nAargau, Helvetik Cumhuriyet dönemine kadar diğer kantonlar tarafından yönetiliyordu. Artık tam teşekküllü bir kanton olan Aargau, özellikle tekstil fabrikaları sayesinde hızla sanayileşiyor. Aargau'nun çok sayıdaki nehri fabrikaların enerjisini sudan sağlamasına olanak tanıdı ve birçok merkezi olmayan fabrikanın kurulmasını sağladı.\nAargau, esasen Zürich ve Bern kantonlarına karşı bir denge unsuru oldu ve 1814/15'te neredeyse tam teşekküllü bir kanton hâline gelemiyordu. 1815'ten sonra bile Aargau, diğer kantonların aksine oldukça liberal kaldı. 1831'de kabul edilen yeni bir anayasa, halka daha fazla hak tanıdı. Hükümet, Katolik nüfusun devletin kilise üzerindeki artan kontrolüne gösterdiği direnişe, isyan eden bölgeleri işgal ederek karşılık verdi."
 dufour.917.t: "Yeni Sayfalar Yayınlandı: Vaud ve Valais"
 dufour.917.d: "Daha fazla sayfa yayınlandı. Bu sefer odak Vaud ve Valais'a yerleştirildi."
 dufour.917.f: "Valais, İsviçre'nin en güneyinde yer alan ve Alpler tarafından ülkenin geri kalanından büyük ölçüde ayrılmış geniş bir vadidir. Rhône Nehri vadinin içinden geçerek Lac Léman'a dökülür. Gölün kuzey kıyısı Vaud'un bir parçasıdır, ancak kanton Cenevre'den Alpler'e ve Jura'ya kadar uzanır.\nVaud hâlâ büyük ölçüde tarıma dayalıdır, ancak liberaller 1826'dan beri sanayiyi geliştirmek için değişiklikler uygulamaya başladılar. Zaman, Vaud'un tarımsal bir kanton olarak kalıp kalmayacağını veya bir sanayi merkezine dönüşüp dönüşmeyeceğini gösterecek.\nDiplomatik beceriler sayesinde Vaud Kantonu, Napolyon'un yenilgisinin ardından varlığını korudu. Ancak bunun karşılığında kanton daha muhafazakâr bir anayasayı kabul etmek zorunda kaldı. Otoriter yönetim sayesinde liberaller güç kazandı ve 1830'da yeni bir anayasanın kabul edilmesini sağladı. Bu sırada radikaller de güç kazanıyor ve demokratikleşmeyi teşvik etmeye çalışıyordu.\nValais'e tarım ve kırsal nüfus hâkimdir. Önemli bir sanayi yoktur ve dış bağlantılar sınırlıdır.\nValais'teki başlıca siyasi çatışma, Almanca konuşan Yukarı Valais ile Fransızca konuşan Aşağı Valais arasındaydı. Aşağı Valais'in nüfusu daha yüksek olmasına rağmen Yukarı Valais, kantonun baskın kesimi olmuştur. Soru şu: Aşağı vadinin liberalleri ve radikalleri Valais'in demokratikleşmesini ilerletebilecek durumda mı, yoksa eski güçler yönetimlerini istikrara kavuşturabilecek mi?"
 dufour.920.t: "Sesten, Yaban Keçisi'nin İsviçre'ye Geri Getirilmesi Talep Ediliyor"
 dufour.920.d: "St. Gallen'deki \"Walhalla\" otelinin sahibi olan otelci Robert Mader, dağ yaban keçisini İsviçre'ye geri getirmeyi öneriyor. St. Gallen'de, yaban keçilerini yetiştirip daha sonra doğaya salmak için bir kafes hazırlayacağı bir hayvan parkı kurmayı teklif ediyor."
 dufour.920.f: "\"Yaban keçisi, İsviçre'nin ulusal simgesidir. Onu geri getirmeliyiz!\""
 dufour.920.g: "Yaban keçisini geri getireceğiz!"
 dufour.920.h: "Ne kadar zaman kaybı!"
