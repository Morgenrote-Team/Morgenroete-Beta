 roy_ethnology_tech_desc: "19. yüzyılda etnoloji, ayrı bir akademik disiplin olarak ortaya çıktı ve sıradan seyahat gözlemlerinden, insan kültürlerinin ve kökenlerinin sistematik biçimde incelenmesine doğru bir geçiş yaşandı. Evrim teorisinin yükselişi ve sömürgeci genişlemeden etkilenen ilk etnologlar, karşılaştırmalı yöntemler ve maddi eserlerin toplanması yoluyla dünyadaki çeşitliliği sınıflandırmaya çalıştı. Zamanla alan, salt spekülatif ırksal hiyerarşilerden uzaklaşarak daha titiz etnografik saha çalışmalarına yöneldi ve modern sosyal antropolojinin temellerini attı."
