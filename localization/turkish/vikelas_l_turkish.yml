 vikelas_bicycles_tech: "Bisikletler"
 vikelas_bicycles_tech_desc: "19. yüzyılın ortalarında, denge bisikleti velocipede'e dönüştü ve pedallar ilk kez doğrudan ön aksa takıldı. 'Kemik sarsıcılar' olarak bilinen bu araçların ağır demir jantları ve ahşap telleri vardı; bu da engebeli arazilerde sürüşü fiziksel bir mücadele hâline getiriyordu. Konforsuz olmalarına rağmen bu dönem, giderek daha gelişmiş tasarımların ortaya çıkmasını sağlayan ilk bisiklet çılgınlığını başlattı ve daha sonra ortaya çıkacak yüksek tekerlekli bisikletlerin önünü açtı."