 vikelas.21.h: "Ama böyle bir oyunla kim ilgilenir ki?"
 vikelas.31.t: "Çayır Oyunundan Amerika'nın Eğlencesine"
 vikelas.31.d: "[SCOPE.sState('vikelas_baseball_state').GetName] bölgesinde, Amerikan ruhunu temsil eden yeni bir oyun popüler hâle geldi."
 vikelas.31.f: "1840'larda beyzbol, kendinden önceki oyunların gölgesinden sıyrılarak kendine özgü bir biçim kazanmaya başladı. Amerika Birleşik Devletleri hızlı bir kentleşme sürecinden geçiyordu ve büyüyen şehirler, yeni ulusun ruhunu yansıtırken toplulukları bir araya getirecek uğraşlar arıyordu. 1845 yılında Alexander Cartwright ve New York'taki Knickerbocker Base Ball Club üyelerinin oyunun ilk standart kurallarını oluşturması dönüm noktası oldu. Bu 'Knickerbocker Kuralları', modern beyzbolun temelini attı: dört kaleli elmas şeklindeki saha, devre başına üç oyun dışı kalma ve takım başına dokuz oyuncu. Bu kurallar, o zamana kadar çimenliklerde ve açık alanlarda oynanan daha düzensiz versiyonlardan büyük ölçüde farklıydı. 19 Haziran 1846'da Knickerbocker Kulübü, New Jersey, Hoboken'de bu kurallara göre belgelenmiş ilk maçı oynadı. Takım New York Nine'a yenildi, ancak bu olay organize beyzbolun sembolik doğuşu olarak kabul edildi."
 vikelas.31.g: "Homerun!"
 vikelas.41.t: "Modern Futbolun Başlangıcı"
 vikelas.41.d: "Top oyunları alanındaki çok sayıdaki çelişkili kuralı düzenlemek ve ortak maçlar organize etmek amacıyla, [SCOPE.sState('vikelas_football_state').GetName] bölgesindeki kulüpler yeni bir futbol kuralları dizisi sundu."
 vikelas.41.f: "19. yüzyılın ilk yarısında İngiltere'deki futbol henüz birleşmiş bir spor değildi; kasabalarda, köylerde ve okullarda oynanan çeşitli top oyunları için kullanılan genel bir terimdi. Bu oyunların kuralları çoğu zaman büyük ölçüde farklılık gösteriyordu. Standartlaşma yolundaki ilk adım, Cambridge'deki öğrenciler için ortak kurallar oluşturma girişimi olan 1848 Cambridge Kuralları ile atıldı. Bunlar nihai bir çözüm değildi, ancak sonrasında gelecek gelişmelerin temelini oluşturdu. Asıl dönüm noktası, 26 Ekim 1863'te on bir kulübün Londra'daki Freemasons' Tavern'de bir araya gelerek Futbol Birliği'ni (FA) kurmasıyla yaşandı. Birkaç hafta içinde topun yalnızca ayaklarla oynanmasını ve taşınmasını veya fırlatılmasını yasaklayan bir dizi kural üzerinde anlaştılar. Bu uzlaşma, daha sonra ayrılarak kendi kurallarını geliştiren ragbi taraftarlarını kızdırdı. FA'nın kurulmasıyla modern futbol doğmuş oldu."
 vikelas.41.g: "Gol!"
 vikelas.51.t: "Şeftali Sepetiyle Oynanan Oyun"
 vikelas.51.d: "[SCOPE.sState('vikelas_basketball_state').GetName] bölgesindeki bir spor salonunda, bir gün dünyanın dört bir yanındaki salonlarda ve stadyumlarda yankılanabilecek yeni bir oyun icat edildi."
 vikelas.51.f: "'Tekme yok. Topla koşmak yok. Ve bir galerinin iki yanına çivilenmiş iki şeftali sepeti.'\n\n[TimeKeeper.GetCurrentDate.Format('y')] yılında, [SCOPE.sState('vikelas_basketball_state').GetFarmHubName] bölgesindeki bir okulda Dr. [ROOT.Var('panum_physician_var').GetCharacter.GetFullName] bir sorunla karşılaştı: Huzursuz öğrencilerini kış aylarında içeride nasıl aktif tutabilirdi? [ROOT.Var('panum_physician_var').GetCharacter.GetHerHis|U] çözümü basit — ve tuhaftı. Bir futbol topu, iki yüksek şeftali sepeti ve on üç kural.\nÇocuklar ilk başta bunu garip buldu. Temas yoktu. Top sürme yoktu. Sadece dikkatli paslar ve kavisli atışlar vardı. Ancak bu oyunda onları kendine çeken bir şey vardı. Oyun önce diğer okullara, ardından diğer şehirlere yayıldı. On yıldan kısa bir süre içinde New York'tan Tokyo'ya kadar spor salonları, seken topların ritmi ve 'Basket!' haykırışlarıyla yankılanıyordu.\nSoğuk havalarda oynanan basit bir eğlence olarak başlayan şey daha büyük bir şeye dönüşebilir. Hızlıdır, takım oyununa dayanır, modern yaşama uygundur ve her şeyden önemlisi [ROOT.GetCountry.GetAdjectiveNoFormatting] kökenlidir."
 vikelas.51.g: "Okullarda ve spor salonlarında tanıtın."
 vikelas.302.h: "Ne kadar abartılmış bir oyun."
 vikelas.303.h: "Ne kadar sıkıcı bir oyun."
 vikelas.311.g: "Bir daha hiçbir spor sonucunu kaçırmayın!"
 vikelas.312.t: "Spor Radyosu"
 vikelas.312.d: "[SCOPE.sState('vikelas_radio_state').GetName] bölgesindeki bir radyo üreticisi, ürününü öncelikle spor müsabakalarının radyo yayınları için tanıtmaktadır. Halkın tek bir [GetPlayer.MakeScope.Var('vikelas_national_sport_var').GetFlagName] maçını bile kaçırmama isteği, fabrikanın üretimini optimize etmesine yol açmıştır."
 vikelas.312.f: "Radyo, spor için yeni bir iletişim aracı olmaya mükemmel şekilde uygundu: Maçın heyecanını canlı olarak aktarabilir, seyircilerin tezahüratlarını duyurabilir ve spikerin sesini dinleyicilerin kalbinin ritmi hâline getirebilirdi. Amerika Birleşik Devletleri'nde bu dönem, 5 Ağustos 1921'de Pittsburgh'daki KDKA istasyonunun ilk canlı beyzbol maçını yayınlamasıyla başladı: Pittsburgh Pirates ile Philadelphia Phillies arasındaki karşılaşma. Spiker Harold Arlin, basit bir mikrofonla basın locasında oturdu ve her hareketi bir arkadaşına anlatıyormuş gibi aktardı. Yeni cihazlara hayran kalan dinleyiciler, sporun oturma odalarını ele geçirdiğini hissetti. Avrupa'da BBC de aynı yolu izledi: 11 Ocak 1927'de Arsenal ile Sheffield United arasındaki ilk canlı futbol maçını, spiker Teddy Wakelam'ın anlatımıyla yayınladı."
 vikelas.312.g: "Sanki oradaymış gibi canlı!"
 vikelas.318.t: "[GetPlayer.MakeScope.Var('vikelas_national_sport_var').GetFlagName] Birliği"
 vikelas.318.g: "Ulusal [GetPlayer.MakeScope.Var('vikelas_national_sport_var').GetFlagName] Birliği'ni kurun!"
 vikelas.318.f: "Kriket, beyzbol, futbol veya basketbol gibi bir spor dalı için bir spor birliği, her zaman entegre ana eyaletlerin %35'inde ilgili spor dalına ait bir kulüp bulunduğunda kurulur. Birlik, lig maçlarının ve şampiyonluk unvanı için oynanacak final karşılaşmasının düzenlenmesinin temelini oluşturur. Ancak bu yalnızca bir ulusun en az iki kulübe sahip olması durumunda mümkündür. Futbol Dünya Kupası'na katılım için bir futbol birliği gereklidir."
 vikelas.318.d: "[GetPlayer.MakeScope.Var('vikelas_national_sport_var').GetFlagName], [GetPlayer.GetNameNoFormatting] genelinde popüler bir spor hâline geldi. Canlı kulüp kültürü, artık [ROOT.GetCountry.GetCapital.GetCityHubName] bölgesinde ulusal bir birliğin kurulmasına yol açtı."
 vikelas.321.g: "Homerun!"
 vikelas.322.t: "Beyzbol Kartları"
 vikelas.322.d: "Ülkemizde önde gelen bir şirket, tanıtım amacıyla beyzbol kartları basmaya başladı. O zamandan beri gerçek bir koleksiyon çılgınlığı gelişti."
 vikelas.322.f: "Beyzbol kartlarının tarihi, beyzbolun bölgesel bir eğlenceden Amerika Birleşik Devletleri'nin ulusal sporuna dönüştüğü dönemlere dayanır. Daha 1860'larda, Ulusal Beyzbol Oyuncuları Birliği (NABBP) ilk kulüpleri organize ettiğinde, oyuncuların erken dönem portreleri stüdyo fotoğrafları şeklinde ortaya çıktı. Kabin kartları veya ticari kartlar olarak bilinen bu ürünler fotoğraf stüdyolarında hazırlanıyor ve daha varlıklı taraftarlar tarafından toplanıyordu, ancak henüz seri hâlinde üretilmiyordu. Modern anlamdaki koleksiyon kartlarının gerçek başlangıcı 1880'lere dayanır. Bu dönemde tütün üreticileri, sigara paketlerine küçük karton resimler ekleme fikrini keşfetti. Başlangıçta bu kartlar yalnızca paketleri sağlamlaştırmak için kullanılıyordu, ancak şirketler kısa sürede reklam değerlerini fark etti. New York merkezli Goodwin & Company, Old Judge serisi (1887-1890) ile bu dönemin öncülerinden biri kabul edilir. Kartlarda oyuncuların siyah-beyaz fotoğrafları, ince karton üzerine basılmış şekilde yer alıyordu ve beyzbol hayranlarına idollerinin tüm serilerini toplama fırsatı sunuyordu."
 vikelas.322.g: "Albüm kitapları ne zaman çıkacak?"
 vikelas.331.t: "Rakip Futbol Kulübü Kuruldu"
 vikelas.331.d: "Komşu eyaletteki bir futbol kulübüyle yaşanan anlaşmazlığın ardından, [SCOPE.sState('vikelas_football_club_state_scope').GetName] bölgesindeki işçiler bir araya gelerek kendi kulüplerini kurdu ve kulübe [SCOPE.sState('vikelas_football_club_state_scope').GetCustom('vikelas_historical_football_club_names_type')] adını verdiler. Görünüşe göre iki kulüp arasında bir düşmanlık oluşmuş durumda."
 vikelas.331.f: "Oldukça fazla sayıda spor kulübünün kökeni, diğer kulüplerle yaşanan bölünmelere ve anlaşmazlıklara dayanır. Örneğin Inter Milan, Milan Cricket and Football Club'un (bugünkü AC Milan) hoşnutsuz birkaç kozmopolit üyesi tarafından Milano'daki Ristorante Orologio adlı restoranda kurulmuştur. Resmî adıyla 'Football Club Internazionale Milano' olan kulüp, yalnızca İtalyanların oynamasına izin verilen milliyetçi Milan CFC'den ayrılarak kurulmuştur."
 vikelas.331.g: "Bu bir rekabetin başlangıcı mı?"
 vikelas.332.t: "Futbol Rekabeti"
 vikelas.332.d: "[SCOPE.sState('vikelas_rival_state_1_scope').GetName] bölgesinden [SCOPE.sState('vikelas_rival_state_1_scope').GetCustom('vikelas_historical_football_club_names_type')] ile [SCOPE.sState('vikelas_rival_state_2_scope').GetName] bölgesinden [SCOPE.sState('vikelas_rival_state_2_scope').GetCustom('vikelas_historical_football_club_names_type')] bugün, bu yılın şampiyonunu belirleyebilecek bir lig maçında karşı karşıya geliyor. Her iki takım da birbirini rakip olarak gördüğü ve şampiyon olmak istediği için gerginlik yüksek olabilir."
 vikelas.332.f: "Başlama vuruşu, taç atışı, biraz mücadele,\nTopu alçaktan tut, muhteşem bir hücum, bravo, kazan ya da öl;\nTopun peşinde, City!\nTehlikeyi umursama,\nSakin ol, şimdi fırsatın,\nYaşasın! Bir gol attık.\n - Albert T. Smith"
 vikelas.332.g: "[SCOPE.sState('vikelas_rival_state_1_scope').GetName] takımını destekliyorum!"
 vikelas.332.h: "[SCOPE.sState('vikelas_rival_state_2_scope').GetName] takımı daha iyi!"
 vikelas.333.t: "Futbol Holiganları"
 vikelas.333.d: "[GetPlayer.GetAdjective] Şampiyonluğu için oynanan futbol maçı, şiddet yanlısı futbol taraftarlarının çıkardığı isyanlarla gölgelendi. Sonuçtan memnun olmayan taraftarlar diğer takıma, hakeme ve [ROOT.Var('vikelas_rival_state_var').GetState.GetName] bölgesindeki rastgele dükkânlara saldırarak kaosa neden oldu. Neyse ki kimse hayatını kaybetmedi."
 vikelas.333.f: "\"Neredesin korkak hakem! Senin yüzünden kaybettik! İşte orada! Yakalayın onu çocuklar!\""
 vikelas.333.g: "Ne karmaşa ama!"
 vikelas.334.t: "Bir Futbol Şampiyonu Doğuyor!"
 vikelas.334.d: "Yeni [GetPlayer.GetAdjective] Şampiyonu, [ROOT.Var('vikelas_rival_state_var').GetState.GetName] bölgesinden gelen takımın kazandığı çekişmeli bir maç sonucunda belirlendi. [ROOT.Var('vikelas_rival_state_var').GetState.GetNameNoFormatting] halkı, kendi takımlarının zaferini kutluyor."
 vikelas.334.f: "\"Ole! Ole! Ole! Oleeee! Oleeee! Oleeee!\""
 vikelas.334.g: "Biz Şampiyonuz!"
 vikelas.391.t: "Ulusal Sporu Uyarlama"
 vikelas.391.d: "[GetPlayer.GetNameNoFormatting] hangi ulusal sporu benimsemeli?"
 vikelas.391.f: "'Hornussen adında bu güzel sporu hiç duydunuz mu?'"
 vikelas.391.g: "Kriket."
 vikelas.391.h: "Beyzbol."
 vikelas.391.i: "Futbol."
 vikelas.391.j: "Basketbol."
 vikelas.391.k: "Boşver."
 vikelas.392.t: "Ulusal Sporu Değiştir"
 vikelas.392.d: "[GetPlayer.GetNameNoFormatting] hangi ulusal spora geçmeli?"
 vikelas.392.f: "'[ROOT.GetCountry.MakeScope.Var('vikelas_national_sport_var').GetFlagName] artık çok sıkıcı oldu, peynir yuvarlama oyununa ne dersiniz?'"
 vikelas.393.t: "Yeni Bir Ulusal Spor"
 vikelas.393.d: "[SCOPE.sCountry('vikelas_overlord_country_scope').GetName] elçileri hükümetimize kendi ulusal sporlarını ülkemizde tanıtmamızı önerdi ve bu planı uygulamak için bir antrenör gönderdiler."
 vikelas.393.f: "'Oyun bir dinlenme gibidir ve sürekli çalışamayacağınız için dinlenmeye ihtiyacınız vardır.' -Aristoteles"
 vikelas.393.g: "Bana sopayı verin!"
 vikelas.393.h: "Ana sayı!"
 vikelas.393.i: "Gol!"
 vikelas.393.j: "Sayı!"
 vikelas.394.t: "Ortak Bir Spor"
 vikelas.394.d: "Ülkemizin giderek daha fazla sakini [ROOT.GetCountry.MakeScope.Var('vikelas_national_sport_var').GetFlagName] sporunu birleştirici, ideolojik bir unsur olarak görüyor - uluslararası ilişkilerde de. Bu ortak ulusal spor, [GetPlayer.GetNameNoFormatting] ülkesinin yalnızca güç ilişkilerinden ibaret olmayan şekilde derebeyimiz [SCOPE.sCountry('vikelas_overlord_country_scope').GetName] ile daha fazla ortak noktaya sahip olduğu hissini veriyor."
 vikelas.394.f: "Bir derebeyi ve bağlı devlet aynı ulusal sporu paylaşırsa, özgürlük arzusu azalır."
 vikelas.394.g: "Ortak sporlar, ortak çıkarlar."
 vikelas.395.t: "Commonwealth [GetPlayer.MakeScope.Var('vikelas_national_sport_var').GetFlagName] Şampiyonası"
 vikelas.395.d: "Müttefik ve dost ülkelerden seyirciler ve takımlar, Commonwealth [GetPlayer.MakeScope.Var('vikelas_national_sport_var').GetFlagName] Şampiyonasına katılmak için toplandı. Oyunlar aynı zamanda [ROOT.GetCountry.GetAdjectiveNoFormatting] etki alanının yalnızca siyasi olarak değil, kültürel olarak da birleştiğinin bir işaretidir."
 vikelas.395.f: "19. yüzyılın sonlarından beri İngiltere ile İmparatorluğun diğer bölgeleri arasında, neredeyse turnuva niteliği taşıyan seri karşılaşmalar düzenlenmiştir. 1909'da ICC'nin (Uluslararası Kriket Konferansı) kurulması, İmparatorluğun kriket güçleri arasındaki resmi değişimin temelini attı. İlk üyeler İngiltere, Avustralya ve Güney Afrika'ydı; daha sonra Hindistan, Yeni Zelanda ve Batı Hint Adaları katıldı.\n\nBu sırada Britanya İç Saha Şampiyonası, dört ana ülke arasında düzenlenen yıllık bir turnuvaydı: İngiltere, İskoçya, Galler ve Kuzey İrlanda. Bu turnuva, düzenli yapılan en eski uluslararası futbol etkinliğiydi. Britanya'nın futboldaki üstünlüğünün bir sembolü olarak görülüyordu.\n\nKapsamlı bir İmparatorluk Kupası fikri hiçbir zaman tam anlamıyla gerçekleşmedi - ancak buna yaklaşan bazı bireysel girişimler ve seriler oldu."
 vikelas.395.g: "Oyunlar başlasın!"
 vikelas.396.t: "Commonwealth [GetPlayer.MakeScope.Var('vikelas_national_sport_var').GetFlagName] Şampiyonası - Zafer!"
 vikelas.396.d: "Karar maçında rakibimiz [SCOPE.sCountry('vikelas_second_winner_team_scope').GetName] ülkesini mağlup ettik! Commonwealth [GetPlayer.MakeScope.Var('vikelas_national_sport_var').GetFlagName] Şampiyonasını kazandık."
 vikelas.396.f: "[SCOPE.sCharacter('vikelas_schaefer_scope').GetFullNameNoFormatting] pasını [SCOPE.sCharacter('vikelas_morlock_scope').GetFullNameNoFormatting]'a gönderiyor, ancak [SCOPE.sCountry('vikelas_second_winner_team_scope').GetNameNoFormatting] tarafından engelleniyor - ve her zaman olduğu gibi [SCOPE.sCharacter('vikelas_bozsik_scope').GetFullNameNoFormatting], [SCOPE.sCountry('vikelas_second_winner_team_scope').GetAdjectiveNoFormatting] sağ kanadı, topa sahip. Top onda - ama bu sefer topu [SCOPE.sCharacter('vikelas_schaefer_scope').GetFullNameNoFormatting]'a kaptırıyor. [SCOPE.sCharacter('vikelas_schaefer_scope').GetFullNameNoFormatting] içeri ortalıyor. Kafa vuruşu - engellendi. [SCOPE.sCharacter('vikelas_rahn_scope').GetFullNameNoFormatting] geriden vurmalı - [SCOPE.sCharacter('vikelas_rahn_scope').GetFullNameNoFormatting] vuruyor - Goooooool! Goooooool! Goooooool! Goooool!"
 vikelas.396.g: "Commonwealth Kupası [GetPlayer.GetNameNoFormatting] ülkesine gidiyor!"
 vikelas.397.t: "Commonwealth [GetPlayer.MakeScope.Var('vikelas_national_sport_var').GetFlagName] Şampiyonası sona eriyor"
 vikelas.397.d: "Commonwealth [GetPlayer.MakeScope.Var('vikelas_national_sport_var').GetFlagName] Şampiyonası sona erdi. Finalde [SCOPE.sCountry('vikelas_first_winner_team_scope').GetName], [SCOPE.sCountry('vikelas_second_winner_team_scope').GetName] ülkesini mağlup etti. Müttefik ve dost devletlerden gelen takımlar ve seyirciler yeniden ayrıldı. [GetPlayer.GetNameNoFormatting], ev sahibi ve organizatör olarak onların güzel anılarında kalacak."
 vikelas.397.f: "'Belki de bizler hakları ellerinden alınmış tebaa, top yemi veya bir derebeyinin çıkarları için etkisi altındaki ulusların basit bir topluluğu değiliz, ama... bir aileyiz.'"
 vikelas.397.g: "Bu, uluslararası anlayışa katkıda bulundu."
 vikelas.403.d: "FIFA bugün [SCOPE.sState('vikelas_fifa_state').GetStateRegion.GetCityHubName] kentindeki toplantısında yeni yönetim kurulu üyelerini atadı."
