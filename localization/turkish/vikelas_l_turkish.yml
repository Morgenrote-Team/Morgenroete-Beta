 je_vikelas_baseball: "Beyzbol"
 je_vikelas_baseball_reason: "Beyzbol, 19. yüzyılda Amerika Birleşik Devletleri'nin ulusal sporu hâline geldi ve buradan dünyaya yayılmaya başladı. Belgelenmiş ilk maç 1846'da Hoboken, New Jersey'de gerçekleşti. 1860'larda oyun hızla profesyonelleşti; 1876'da ilk büyük profesyonel lig olan National League kuruldu. Aynı dönemde beyzbol, Amerikan askerleri, tüccarlar ve misyonerler aracılığıyla diğer ülkelere yayıldı."
 je_vikelas_baseball_fail: "[GetPlayer.GetName] ülkesinden önce herhangi bir ülke beyzbolu icat eder."
 je_vikelas_football: "Futbol"
 je_vikelas_football_reason: "İlk standart futbol kuralları 1840'larda İngiltere'de ortaya çıktı, Football Association 1863'te kuruldu ve İngiltere ile İskoçya arasındaki ilk resmi uluslararası maç 1872'de gerçekleşti. Futbol, Büyük Britanya'dan kıtaya ve Güney Amerika'ya yayıldı. Almanya, Fransa, İtalya ve İspanya'da 1890'lardan itibaren ulusal federasyonlar ve ligler ortaya çıktı. Aynı zamanda futbol, İngiliz demiryolu işçileri ve göçmenler tarafından ilk kulüplerin kurulduğu Arjantin, Brezilya ve Uruguay'a da yayıldı."
 je_vikelas_football_fail: "[GetPlayer.GetName] ülkesinden önce herhangi bir ülke futbolu icat eder."
 je_vikelas_cricket: "Kriket"
 je_vikelas_cricket_reason: "Kriketin kökenleri Orta Çağ'ın sonlarına kadar uzanır: 16. yüzyılda Kent bölgesindeki çocuklar, eski belgelerde 'creckett' veya 'creag' olarak geçen basit bir sopa ve top oyunu oynuyordu. Ancak oyun, karmaşık ve düzenlenmiş bir spora dönüşmeye 18. yüzyılda başladı. Bu dönemde ilk organize kulüpler ortaya çıktı ve 1787'de Londra'da Marylebone Cricket Club'ın (MCC) kurulmasıyla kriket merkezi bir yapıya kavuştu. MCC, modern oyunun başlangıç noktası olan ilk bağlayıcı kuralları oluşturdu."
 je_vikelas_cricket_fail: "Herhangi bir ülke [GetPlayer.GetName] ülkesinden önce kriketi icat eder."
 je_vikelas_cricket_national_league: "Ulusal Kriket Ligi"
 je_vikelas_cricket_national_league_reason: "19. yüzyılda, İngiltere'de hem aristokratların hem de halkın eğlencesi olarak uzun süredir yerleşmiş olan kriket, daha organize bir yapıya kavuşmaya başladı. Belirleyici an, dünyanın ilk resmi yerel kriket ligi olan County Championship'in 1890'da kurulmasıyla geldi. Bundan önce, 18. yüzyıldan beri kontluklar arasında maçlar oynanıyordu, ancak resmi bir puan sistemi veya şampiyona tablosu bulunmuyordu. County Championship, İngiliz kriketine standartlaştırılmış bir rekabet getirdi ve Yorkshire, Surrey ve Lancashire ilk yıllarda baskın takımlar olarak öne çıktı. İngiltere dışındaki kriket kulüpleri, özellikle Avustralya ve Güney Afrika'dakiler, de yapılandırılmış yarışmalar düzenlemeye başladı."
 je_vikelas_baseball_national_league: "Ulusal Beyzbol Ligi"
 je_vikelas_baseball_national_league_reason: "1860'larda, daha önce çoğunlukla New York'ta popüler olan beyzbol sporu, Amerika Birleşik Devletleri'nde ulusal bir olgu haline geldi. Bunun en önemli nedeni, Amerikan İç Savaşı sırasında askerlerin oyunu askeri kamplarda oynaması ve böylece sporun daha geniş kitlelere yayılmasını sağlamasıydı. 1857'de ilk Amerikan beyzbol birliği olan National Association of Base Ball Players (NABBP) kuruldu. 1867 yılına gelindiğinde birliğe 400'den fazla kulüp katılmıştı. Ancak en güçlü takımlar hâlâ özellikle New York olmak üzere kuzeydoğu Amerika Birleşik Devletleri'nde bulunuyordu. 1871'de kurulan NABBP'nin halefi olan National Association of Professional Base Ball Players (NAPBBP) - aynı zamanda National Association (NA) olarak bilinir - dünyanın ilk profesyonel beyzbol ligi olarak kabul edilir."
 je_vikelas_football_national_league: "Ulusal Futbol Ligi"
 je_vikelas_football_national_league_reason: "19. yüzyılın sonlarında, daha önce İngiltere'deki özel okullarda ve yerel topluluklarda düzensiz şekilde oynanan bir eğlence olan futbol, ulusal bir fenomene dönüştü. Bunun belirleyici nedeni, 1863'te kurulan ve kuralları standartlaştırarak organize müsabakaların yapılmasını sağlayan The Football Association (FA) oldu. 1870'lere gelindiğinde sporun popülerliği özellikle sanayi şehirlerindeki işçi sınıfı toplulukları arasında hızla yayıldı. 1888'de İngiltere'de Football League kuruldu ve dünyanın ilk profesyonel futbol ligi oldu. Lig, Midlands ve Kuzey bölgelerinden 12 kulübü bir araya getirdi; Preston North End ve Aston Villa gibi takımlar ilk güçlü ekipler arasında yer aldı."
 je_vikelas_basketball_national_league: "Ulusal Basketbol Ligi"
 je_vikelas_basketball_national_league_reason: "1891'de James Naismith tarafından icat edilen basketbol, 20. yüzyılın başlarında YMCA'daki bir beden eğitimi etkinliğinden rekabetçi bir spora dönüştü. En önemli gelişme, dünyanın ilk profesyonel basketbol ligi olarak kabul edilen National Basketball League'in (NBL) 1898'de Amerika Birleşik Devletleri'nde kurulmasıyla yaşandı. Lig, Pennsylvania ve New Jersey'den altı takımdan oluşuyordu ve basketbolun profesyonelleşmeye attığı ilk adımı temsil ediyordu. Ancak ilk NBL kısa ömürlü oldu ve 1904'te dağıldı. Profesyonel basketbolun istikrarlı ve ülke çapında bir yapıya kavuşması için 1946'da kurulan Basketball Association of America (BAA) - daha sonra NBA ile birleşti - beklenecekti."
