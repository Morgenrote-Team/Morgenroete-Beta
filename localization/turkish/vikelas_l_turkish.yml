 vikelas.301.t: "Kriket Kulübü kuruldu"
 vikelas.301.d: "Bazı nüfuzlu kişiler, en sevdikleri uğraşı sürdürmek amacıyla bir spor kulübü kurdu: [SCOPE.GetRootScope.GetState.GetStateRegion.GetCityHubName] Kriket Kulübü."
 vikelas.301.f: "19. yüzyıl, kriketin kırsal bir eğlenceden ulusal ve uluslararası öneme sahip bir spora dönüştüğü dönemdi. İngiliz üst sınıfları bu oyunu en sevdikleri uğraş hâline getirdi: Eton ve Harrow gibi yatılı okullarda geliştirildi ve bir 'beyefendi sporu' olarak yüceltildi. Aynı zamanda özellikle fabrika işçilerinin kendi kulüplerini kurduğu Kuzey İngiltere'de işçi sınıfı arasında da popülerliği arttı. Oyunun bu demokratikleşmesi, kulüplerin ve seyircilerin benzeri görülmemiş bir şekilde artmasına yol açtı.\n\nUluslararası maçların ortaya çıkması uzun sürmedi. 1844 yılında Kanada ile Amerika Birleşik Devletleri arasında dünyanın belgelenmiş ilk uluslararası maçı New York'ta oynandı."
 vikelas.301.g: "Bana sopamı verin!"
 vikelas.301.h: "Ne kadar gösterişli bir oyun."
 vikelas.302.t: "Beyzbol Kulübü kuruldu"
 vikelas.302.d: "Beyzbol, [SCOPE.sState('vikelas_baseball_club_state_scope').GetName] bölgesinde popüler bir eğlence olarak kendini kanıtladı. Düzenli maçlar yapan yeni bir beyzbol kulübü kuruldu: [SCOPE.sState('vikelas_baseball_club_state_scope').GetCustom('vikelas_historical_baseball_club_names_type')]."
 vikelas.302.f: "1840'lı yıllarda beyzbol, öncüllerinin gölgesinden sıyrılmaya ve kendine özgü bir biçim kazanmaya başladı. Amerika Birleşik Devletleri hızlı bir kentleşme sürecinden geçiyordu ve büyüyen şehirler, yeni ulusun ruhunu yansıtırken toplulukları bir araya getirebilecek eğlenceler arıyordu. 1845 yılında Alexander Cartwright ve New York'taki Knickerbocker Base Ball Club üyelerinin oyunun ilk standart kurallarını oluşturması önemli bir dönüm noktası oldu. Bu 'Knickerbocker Kuralları', modern beyzbolun temelini attı: dört kaleli elmas şeklinde saha, devre başına üç oyun dışı kalma ve takım başına dokuz oyuncu. Bu kurallar, o zamana kadar çimenliklerde ve açık alanlarda oynanan daha düzensiz biçimlerden büyük ölçüde farklıydı. 19 Haziran 1846'da Knickerbocker Kulübü, New Jersey'deki Hoboken'da bu kurallar altında belgelenmiş ilk maçı oynadı. Takım New York Nine'a yenildi, ancak bu olay organize beyzbolun sembolik doğuşu oldu."
 vikelas.302.g: "Home run."
 vikelas.303.t: "Futbol Kulübü kuruldu"
 vikelas.303.d: "[SCOPE.sState('vikelas_football_club_state_scope').GetName] bölgesindeki işçiler ve emekçiler haftalardır futbol maçları düzenliyor. Şimdi ise bir kulüp kurdular: [SCOPE.sState('vikelas_football_club_state_scope').GetCustom('vikelas_historical_football_club_names_type')]."
 vikelas.303.f: "19. yüzyılın ilk yarısında İngiltere'deki futbol henüz birleşik bir spor değildi; kasabalarda, köylerde ve okullarda oynanan çeşitli top oyunları için kullanılan genel bir terimdi. Bu oyunların kuralları çoğu zaman büyük farklılıklar gösteriyordu. Standartlaşmaya yönelik ilk adım, 1848 tarihli Cambridge Kuralları ile atıldı; bu kurallar Cambridge öğrencileri için ortak kurallar oluşturma girişimiydi. Nihai bir çözüm olmasa da sonraki gelişmeler için temel oluşturdu. Asıl dönüm noktası 26 Ekim 1863'te Londra'daki Freemasons' Tavern'de on bir kulübün bir araya gelerek Futbol Birliği'ni (FA) kurmasıyla yaşandı. Birkaç hafta içinde topa yalnızca ayaklarla oynanmasına izin veren ve topu taşımayı veya fırlatmayı yasaklayan bir dizi kural üzerinde anlaştılar. Bu uzlaşma, daha sonra ayrılarak kendi kurallarını geliştiren ragbi destekçilerini kızdırdı. FA'nın kurulmasıyla modern futbol doğmuş oldu."
 vikelas.303.g: "Gol!"
 vikelas.304.t: "Basketbol Kulübü kuruldu"
 vikelas.304.d: "[SCOPE.sState('vikelas_basketball_club_state_scope').GetName] bölgesinde, oyunu [GetPlayer.GetName] genelinde yayma amacıyla bir basketbol kulübü kuruldu."
 vikelas.304.f: "Basketbol, modern büyük sporların en yenisidir. Kökenleri 19. yüzyılın sonlarındaki toplumsal hareketlerle yakından bağlantılıdır. 1891 yılında Kanadalı doktor ve beden eğitimi öğretmeni James Naismith bir sorunla karşı karşıya kaldı: Springfield, Massachusetts'teki YMCA Eğitim Enstitüsü öğrencilerinin soğuk New England kışında bile oynayabileceği kapalı bir oyun icat etmesi gerekiyordu. YMCA, sporun genç erkeklerin fiziksel ve ahlaki sağlığını güçlendirmesi için kullanılmasını istiyordu; bu, Protestanlık ve kentleşme ruhuna uygun eğitsel bir projeydi. Basketbol, hızlı oyuncu değişiklikleri ve açık kurallarıyla bu amaca mükemmel şekilde uyuyordu. Topluluk duygusunu güçlendiren ve büyüyen Amerikan şehirlerine yeni bir eğlence imkânı sunan bir oyundu."
 vikelas.304.g: "Smaç!"
 vikelas.304.h: "Ne saçma bir oyun."
 vikelas.311.t: "Spor Gazetesi"
 vikelas.311.d: "[SCOPE.sState('vikelas_gazette_state').GetName] bölgesinde bir yayıncı, yalnızca spor haberlerine adanmış ve özellikle [GetPlayer.MakeScope.Var('vikelas_national_sport_var').GetFlagName] üzerine odaklanan yeni bir gazete formatı geliştirdi. Gazete büyük bir hızla satılıyor."
 vikelas.311.f: "Spor, 19. yüzyılın sonlarında arenalardan çıkıp şehirlere, kafelere ve kitlelerin zihnine yayıldığında yeni bir iletişim aracına ihtiyaç duydu. Zaferleri ve yenilgileri yalnızca stadyum ziyaretçilerinin değil, fabrika kapısındaki işçinin ve elinde gazete tutan çalışanın da bilmesi gerekiyordu. İtalya'da bu ihtiyacı karşılayan ve spor haberciliğinde yeni bir çağ başlatan yayın 'Gazzetta dello Sport' oldu. 3 Nisan 1896'da Milano'da, Atina'daki ilk modern Olimpiyat Oyunları'ndan yalnızca üç hafta önce kurulan Gazzetta, başlangıçtan itibaren yalnızca sonuçları veren bir bültenden fazlasıydı. Kendini yükselen sporların sesi olarak görüyordu: bisiklet, atletizm, futbol, eskrim ve hız, rekabet ve tutkuyu temsil eden her şey için. Başlangıçta haftada iki kez, sade kâğıda siyah harflerle basılan gazete, yalnızca gerçeklere değil, onların ardındaki hikâyelere de önem veriyordu: sporcuları kahramanlara, maçları ise dramalara dönüştürüyordu. 1899 yılında gazeteyi simgeleştiren bir değişiklik yaşandı: Gazete pembe renge büründü. Başlangıçta pembe kâğıdın daha ucuz olması nedeniyle yapılan bu değişiklik, kısa sürede gazetenin ayırt edici özelliği hâline geldi."
 vikelas.321.t: "Beyzbol"
 vikelas.321.d: "Ülkemizin insanları, giderek daha fazla taraftar kazanan bir Amerikan sporu ile tanıştı. [GetPlayer.GetNameNoFlag] bir beyzbol çılgınlığı yaşıyor."
 vikelas.321.f: "Amerika Birleşik Devletleri'nin ulusal sporu olarak görülmesine rağmen beyzbol, kısa sürede temelde farklı ülkelere de yayıldı ve buralarda benzer bir konuma ulaştı. Oyun, Japonya'ya ülkenin dış dünyaya açılmasından kısa bir süre sonra, 1872 yılında Horace Wilson tarafından getirildi. Japonya'nın Batı yeniliklerine açık olduğu bu dönemde oyun hızla popülerleşti. Ancak sporun profesyonel bir hâle gelmesi için 30 yıldan fazla zaman geçmesi gerekecekti.\n\nBeyzbol Çin'e ilk olarak 1864 yılında, Amerikalı tıbbi misyoner Henry William Boone tarafından Şanghay Beyzbol Kulübü'nün kurulmasıyla tanıtıldı. Daha sonra Qing Hanedanı, Çinli öğrencileri oyun hakkında daha fazla bilgi edinmeleri için Amerika'ya göndermeye başladı. Organize beyzbol maçları, 1905 yılında St. Johns Üniversitesi ile Şanghay MCA beyzbol kulübü arasında oynanan karşılaşmayla başladı.\n\nBeyzbol, Küba'da da Nemesio Guillot tarafından yaygınlaştırıldı; Guillot ülkedeki ilk büyük beyzbol kulübünü kurdu. Spor, Amerikan müdahalesi döneminden önce 1870'lerde ülkede en çok oynanan spor hâline geldi. Amerikan kökenli olmasına rağmen beyzbol, Küba milliyetçiliğiyle güçlü şekilde ilişkilendirilir; çünkü boğa güreşi gibi sömürge döneminden kalma İspanyol sporlarının yerini büyük ölçüde almıştır."
 vikelas.403.t: "FIFA: Yeni Yönetim Kurulu"
 vikelas.403.f: "FIFA aşağıdaki yönetim yapısına karar verdi:\n\n#V Başkan: [GetGlobalVariable('vikelas_fifa_president_global_var').GetCountry.GetName] #!\n\n#V Yönetim Kurulu: [GetGlobalVariable('vikelas_fifa_board_member_1_global_var').GetCountry.GetName|V] [GetGlobalVariable('vikelas_fifa_board_member_2_global_var').GetCountry.GetName|V] [GetGlobalVariable('vikelas_fifa_board_member_3_global_var').GetCountry.GetName|V] [GetGlobalVariable('vikelas_fifa_board_member_4_global_var').GetCountry.GetName|V] [GetGlobalVariable('vikelas_fifa_board_member_5_global_var').GetCountry.GetName|V]"
