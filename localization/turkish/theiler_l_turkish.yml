 theiler_achromatic_microscope_modifier: "Akromatik Mikroskop"
 theiler_electron_microscope_modifier: "Elektron Mikroskobu"
 theiler.11.t: "Akromatik Mikroskop"
 theiler.11.d: "[GetPlayer.MakeScope.Var('tesla_engineer_var').GetCharacter.GetFullName] ve [GetPlayer.MakeScope.Var('theiler_biologist_var').GetCharacter.GetFullName] bugün yeni mikroskoplarını sundular."
 theiler.11.f: "1868'de Ernst Abbe, hem birincil hem de ikincil renk bozulmalarını ortadan kaldıran apokromatik merceği icat etti. 1870'e gelindiğinde Abbe, mikroskop aydınlatmasında kullanılan Abbe kondansatörünü geliştirdi. 1871'de ilk refraktometreyi tasarladı ve bunu 1874'te yayımlanan bir kitapçıkta açıkladı. 1872'ye kadar ışık saçmayan nesnelerin görüntülenme yasalarını geliştirdi. Zeiss Optik İşleri, 1872'de geliştirilmiş mikroskoplarını satmaya başladı; bunlara 1877'de homojen daldırma objektifli modeller ve 1886'da apokromatik objektifli mikroskoplar da dahil edildi."
 theiler.11.g: "Mikrobiyoloji için bir devrim."
 theiler.12.t: "Elektron Mikroskobu"
 theiler.12.d: "[GetPlayer.MakeScope.Var('tesla_engineer_var').GetCharacter.GetFullName] ve [GetPlayer.MakeScope.Var('theiler_biologist_var').GetCharacter.GetFullName] bugün yeni mikroskoplarını sundular."
 theiler.12.f: "Geçirimli elektron mikroskobunu kimin icat ettiği konusu günümüzde hâlâ tartışmalıdır. 1928 yılında Charlottenburg Teknik Yüksekokulu'nda Adolf Matthias, elektron ışınları ve katot ışınlı osiloskoplar üzerine yapılan araştırmaları ilerletmek amacıyla Max Knoll'u bir araştırma ekibine liderlik etmekle görevlendirdi. Ekipte Ernst Ruska da dahil olmak üzere birçok doktora öğrencisi bulunuyordu. 1931 yılında Max Knoll ve Ernst Ruska, anot açıklığı üzerine yerleştirilmiş ağ ızgaraların büyütülmüş görüntülerini başarıyla oluşturdular. Görünüşe göre bu çalışmadan bağımsız olarak Siemens-Schuckert'te Reinhold Rüdenberg de çalışmalar yürütüyordu. Patent hukukuna göre elektron mikroskobunun mucidi olarak kabul edilir, ancak çalışan bir cihazı ne zaman geliştirdiği kesin değildir."
 theiler.12.g: "Hatta virüsleri bile tespit edebileceği söyleniyor!"
