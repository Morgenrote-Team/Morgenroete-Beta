 theiler_cell_culture_tech: "Hücre Kültürü"
 theiler_cell_culture_tech_desc: "Hücre kültürü, hayvan veya bitki hücrelerinin organizma dışında besleyici bir ortamda yetiştirilmesidir. 1885 yılında Wilhelm Roux, embriyonik tavuk hücrelerini tuzlu çözelti içinde birkaç gün canlı tutmayı başararak temel prensibi göstermiştir. 1907 yılında Ross Granville Harrison, amfibilerin omuriliğini kültürleyerek aksonların bireysel sinir hücrelerinin uzantıları olarak geliştiğini göstermiştir. 1913 yılında Edna Steinhardt, Chai Israeli ve Robert A. Lambert, kobay korneasından alınan parçalar üzerinde vaccinia virüsünü kültürlemiştir."
 theiler.51.t: "Patojen Araştırması"
 theiler.51.d: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName], insanlığın bu belasına dair yeni bilgiler edinmek amacıyla tehlikeli bir patojeni daha yakından incelemeye karar verdi. Araştırma projesi hâlâ belirlenmeyi bekliyor."
 theiler.51.f: "Bir patojenin incelenmesi; keşif ve izolasyon aşamalarından oluşur ve daha sonra etkili bir aşı geliştirilmesinde önemli bir adımdır. Belirli bir patojenin incelenmesi için hastalığın tanımlanması, bir akromatik mikroskop veya elektron mikroskobu (bunun bir bakteri ya da virüs olmasına bağlı olarak) ve belirli miktarda bilinen mikrop gerekir - sonuçta biyolog, mikrobu ayırt edebilmelidir."
 theiler.51.g: "Kolera Patojeni."
 theiler.51.h: "Verem Patojeni."
 theiler.51.i: "Çiçek Hastalığı Patojeni."
