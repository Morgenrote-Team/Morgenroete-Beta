 theiler.51.p: "Çocuk Felci Patojeni."
 theiler.52.t: "Aşı Araştırması"
 theiler.52.d: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName], insanlığın büyük bir belasını ortadan kaldırmak için devrim niteliğinde bir aşı geliştirmeye başladı. Ancak aşının hangi hastalığa karşı geliştirileceği henüz belirlenmedi."
 theiler.52.f: "Aşılar, tıbbın ve biyolojinin hastalıklara karşı en güçlü silahıdır. Güçlü bir sağlık sistemiyle birlikte hastalıkların ortaya çıkmasını tamamen önleyebilirler. Bir aşı geliştirilebilmesi için biyologların ilgili patojeni araştırmış olması gerekir. Bazı aşılar teknolojik ön koşullar gerektirir - örneğin tifüs, sarı humma ve difteri genetik bilgisi gerektirir."
