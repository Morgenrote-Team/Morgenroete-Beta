 je_theiler_medicinal_plant_strychnine: "Strychnos Nux-Vomica"
 je_theiler_medicinal_plant_strychnine_reason: "Yeni bir farmasötik geliştirme süreci genellikle şu sırayı takip eder: Tıbbi Teknik seviyenize bağlı olarak bir [concept_panum_physician], tıbbi kullanım için belirli [concept_ito_medicinal_plants] bulunmasını önerir; bu durumda en az #V 5 [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]#! gereklidir. Bir [concept_dubois_naturalist], bunları izole etmek için yeterli örnek toplamaktan sorumludur. Daha sonra bir [concept_mendelejew_chemist], kimyasal maddeyi izole eder. Madde bulunduğunda, bir [concept_theiler_biologist] farmasötiği üretebilir.\n\nStrychnos nux-vomica, Hindistan ve Güneydoğu Asya'ya özgü tropikal bir ağaçtır. Tohumları, ikisi de oldukça zehirli olan striknin ve brusin alkaloitlerini içerir. Striknin sinir sistemini etkileyerek şiddetli kas kasılmalarına ve potansiyel olarak ölüme neden olur. Zehirli olmasına rağmen, küçük ve kontrollü dozlarda özleri tarih boyunca uyarıcı olarak ve sindirim veya sinir sistemi bozukluklarının tedavisinde kullanılmıştır."
 je_theiler_medicinal_plant_strychnine_success: "[GetPlayer.GetName], en az #V 5 Strychnos Nux-Vomica#! örneği topladı."
 theiler_medicinal_plant_project_progress_medicinal_plants_isolated_tt: "#default_text [GetPlayer.GetName], bir [concept_theiler_biologist]'a sahip ve bir [concept_mendelejew_chemist] ile maddeyi izole etti.#!"
 theiler_biologist_medicinal_plant_project_progress_bar_at_full_tt: "Farmasötik İlerleme #variable 100%#! seviyesine ulaştı"
 je_theiler_medicinal_plant_emetine: "Carapichae Ipecacuanha"
 je_theiler_medicinal_plant_emetine_reason: "Yeni bir farmasötik geliştirme süreci genellikle şu sırayı takip eder: Tıbbi Teknik seviyenize bağlı olarak bir [concept_panum_physician], tıbbi kullanım için belirli [concept_ito_medicinal_plants] bulunmasını önerir; bu durumda en az #V 5 [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]#! gereklidir. Bir [concept_dubois_naturalist], bunları izole etmek için yeterli örnek toplamaktan sorumludur. Daha sonra bir [concept_mendelejew_chemist], kimyasal maddeyi izole eder. Madde bulunduğunda, bir [concept_theiler_biologist] farmasötiği üretebilir.\n\nCarapichea ipecacuanha, özellikle Brezilya olmak üzere Güney Amerika'ya özgü tropikal bir bitkidir. Kökleri, kusmayı tetikleyen ve parazitlere karşı etkili olan emetin ve sefaelin alkaloitlerini içerir. İpeka kökü geleneksel olarak zehirlenmeleri tedavi etmek için kusturucu ve öksürük şuruplarında balgam söktürücü olarak kullanılmıştır."
 je_theiler_medicinal_plant_emetine_success: "[GetPlayer.GetName], en az #V 5 Carapichae Ipecacuanha#! örneği topladı."
 je_theiler_medicinal_plant_atropine: "Atropa Belladonna"
 je_theiler_medicinal_plant_atropine_reason: "Yeni bir farmasötik geliştirme süreci genellikle şu sırayı takip eder: Tıbbi Teknik seviyenize bağlı olarak bir [concept_panum_physician], tıbbi kullanım için belirli [concept_ito_medicinal_plants] bulunmasını önerir; bu durumda en az #V 5 [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]#! gereklidir. Bir [concept_dubois_naturalist], bunları izole etmek için yeterli örnek toplamaktan sorumludur. Daha sonra bir [concept_mendelejew_chemist], kimyasal maddeyi izole eder. Madde bulunduğunda, bir [concept_theiler_biologist] farmasötiği üretebilir.\n\nAtropa belladonna, ölümcül itüzümü olarak da bilinir ve Avrupa, Kuzey Afrika ile Batı Asya'ya özgü çok yıllık bir bitkidir. Atropin, skopolamin ve hiyosiyamin gibi zehirli alkaloitler içerir; bunlar asetilkolin reseptörlerini engelleyerek sinir sistemini etkiler. Tarih boyunca sakinleştirici, ağrı kesici ve göz bebeklerini genişletici olarak kullanılmıştır. Modern tıpta saflaştırılmış atropin, göz hastalıklarında ve bradikardi veya organofosfat zehirlenmelerinin tedavisinde kullanılır."
 je_theiler_medicinal_plant_atropine_success: "[GetPlayer.GetName], en az #V 5 Atropa Belladonna#! örneği topladı."
 je_theiler_medicinal_plant_aloin: "Aloe Vera"
 je_theiler_medicinal_plant_aloin_reason: "Yeni bir farmasötik geliştirme süreci genellikle şu sırayı takip eder: Tıbbi Teknik seviyenize bağlı olarak bir [concept_panum_physician], tıbbi kullanım için belirli [concept_ito_medicinal_plants] bulunmasını önerir; bu durumda en az #V 5 [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]#! gereklidir. Bir [concept_dubois_naturalist], bunları izole etmek için yeterli örnek toplamaktan sorumludur. Daha sonra bir [concept_mendelejew_chemist], kimyasal maddeyi izole eder. Madde bulunduğunda, bir [concept_theiler_biologist] farmasötiği üretebilir.\n\nAloe vera, Kuzey Afrika ve Arap Yarımadası'na özgü etli bir bitkidir. Kalın yaprakları, yatıştırıcı ve nemlendirici özelliklere sahip polisakkaritler, vitaminler ve enzimler açısından zengin bir jel içerir. Jel, yanıklar, yaralar ve cilt tahrişlerinin tedavisinde kozmetik ve tıp alanında yaygın olarak kullanılır. Yaprağın iç kısmındaki kurutulmuş lateks, güçlü müshil etkileri olan aloin adlı bileşiği içerir."
 je_theiler_medicinal_plant_aloin_success: "[GetPlayer.GetName], en az #V 5 Aloe Vera#! örneği topladı."
 je_theiler_medicinal_plant_digitoxin: "Digitalis Purpurea"
 je_theiler_medicinal_plant_digitoxin_reason: "Yeni bir ilaç geliştirme süreci genellikle şu sırayı takip eder: Tıbbi Teknik seviyenize bağlı olarak bir [concept_panum_physician], bu durumda en az #V 5 [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]#! adet belirli [concept_ito_medicinal_plants] bulmayı önerir. Bir [concept_dubois_naturalist], bunları izole etmek için yeterli örnekleri toplamakla görevlendirilir. Daha sonra bir [concept_mendelejew_chemist] kimyasal maddeyi izole eder. Madde bulunduğunda, bir [concept_theiler_biologist] ilacı üretebilir.\n\nDigitalis purpurea veya yüksük otu, Avrupa'ya özgü iki yıllık bir bitkidir. Yaprakları, kalp kasılmalarını güçlendiren ve kalp ritmini düzenleyen digoksin ve digitoksin gibi kardiyak glikozitler içerir. Geleneksel olarak kalp yetmezliği ve ritim bozukluklarını tedavi etmek için kullanılmıştır. Saflaştırılmış kardiyak glikozitler kalp hastalıklarında dikkatle dozlanarak kullanılırken, ham bitki ciddi zehirlenme riski nedeniyle kullanılmaz."
 je_theiler_medicinal_plant_digitoxin_success: "[GetPlayer.GetName] en az #V 5 Digitalis Purpurea#! toplamıştır."
 je_theiler_medicinal_plant_quinine: "Cinchona Pubescens"
 je_theiler_medicinal_plant_quinine_reason: "Yeni bir ilaç geliştirme süreci genellikle şu sırayı takip eder: Tıbbi Teknik seviyenize bağlı olarak bir [concept_panum_physician], bu durumda en az #V 5 [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]#! adet belirli [concept_ito_medicinal_plants] bulmayı önerir. Bir [concept_dubois_naturalist], bunları izole etmek için yeterli örnekleri toplamakla görevlendirilir. Daha sonra bir [concept_mendelejew_chemist] kimyasal maddeyi izole eder. Madde bulunduğunda, bir [concept_theiler_biologist] ilacı üretebilir.\n\nCinchona pubescens, özellikle And Dağları bölgeleri olmak üzere Güney Amerika'ya özgü bir ağaçtır. Kabuğu, güçlü sıtma karşıtı özelliklere sahip kinin ve diğer alkaloitleri içerir. Geleneksel olarak kabuğu ateş ve sıtmayı tedavi etmek için kullanılmıştır. Günümüzde bile kinin ve türevleri sıtma tedavisinde önemini korumaktadır. Ağaç ayrıca tıbbi kabuğu için tropikal bölgelerde yetiştirilmektedir."
 je_theiler_medicinal_plant_quinine_success: "[GetPlayer.GetName] en az #V 5 Cinchona Pubescens#! toplamıştır."
 je_theiler_medicinal_plant_thymol: "Thymus Vulgaris"
 je_theiler_medicinal_plant_thymol_reason: "Yeni bir ilaç geliştirme süreci genellikle şu sırayı takip eder: Tıbbi Teknik seviyenize bağlı olarak bir [concept_panum_physician], bu durumda en az #V 5 [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]#! adet belirli [concept_ito_medicinal_plants] bulmayı önerir. Bir [concept_dubois_naturalist], bunları izole etmek için yeterli örnekleri toplamakla görevlendirilir. Daha sonra bir [concept_mendelejew_chemist] kimyasal maddeyi izole eder. Madde bulunduğunda, bir [concept_theiler_biologist] ilacı üretebilir.\n\nThymus vulgaris veya yaygın kekik, Akdeniz'e özgü küçük, çok yıllık bir bitkidir. Yaprakları ve yağı; antimikrobiyal, antioksidan ve iltihap önleyici özelliklere sahip timol, karvakrol ve diğer uçucu yağları içerir. Geleneksel olarak kekik, solunum yolu enfeksiyonları, öksürük ve sindirim sorunlarını tedavi etmek için kullanılmıştır. Bitkisel tıpta, aromaterapide ve gıdalarda doğal koruyucu veya aroma verici olarak yaygın biçimde kullanılır."
 je_theiler_medicinal_plant_thymol_success: "[GetPlayer.GetName] en az #V 5 Thymus Vulgaris#! toplamıştır."
 je_theiler_medicinal_plant_pilocarpine: "Pilocarpus Pennatifolius"
 je_theiler_medicinal_plant_pilocarpine_reason: "Yeni bir ilaç geliştirme süreci genellikle şu sırayı takip eder: Tıbbi Teknik seviyenize bağlı olarak bir [concept_panum_physician], bu durumda en az #V 5 [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]#! adet belirli [concept_ito_medicinal_plants] bulmayı önerir. Bir [concept_dubois_naturalist], bunları izole etmek için yeterli örnekleri toplamakla görevlendirilir. Daha sonra bir [concept_mendelejew_chemist] kimyasal maddeyi izole eder. Madde bulunduğunda, bir [concept_theiler_biologist] ilacı üretebilir.\n\nPilocarpus pennatifolius, Brezilya'ya özgü tropikal bir çalıdır. Yaprakları tükürük ve ter bezlerini uyaran pilokarpin adlı alkaloidi içerir. Geleneksel olarak ağız kuruluğu ve göz rahatsızlıklarını tedavi etmek için kullanılmıştır. Modern tıpta pilokarpin, göz içi basıncını azaltarak glokomu yönetmek ve radyasyon veya ilaçların neden olduğu kserostomiyi (ağız kuruluğu) tedavi etmek için kullanılır. Bitki özellikle farmakolojik olarak aktif alkaloitleri nedeniyle değerlidir."
 je_theiler_medicinal_plant_pilocarpine_success: "[GetPlayer.GetName] en az #V 5 Pilocarpus Pennatifolius#! toplamıştır."
 je_theiler_medicinal_plant_ephedrine: "Ephedra Sinica"
 je_theiler_medicinal_plant_ephedrine_reason: "Yeni bir ilaç geliştirme süreci genellikle şu sırayı takip eder: Tıbbi Teknik seviyenize bağlı olarak bir [concept_panum_physician], bu durumda en az #V 5 [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]#! adet belirli [concept_ito_medicinal_plants] bulmayı önerir. Bir [concept_dubois_naturalist], bunları izole etmek için yeterli örnekleri toplamakla görevlendirilir. Daha sonra bir [concept_mendelejew_chemist] kimyasal maddeyi izole eder. Madde bulunduğunda, bir [concept_theiler_biologist] ilacı üretebilir.\n\nEphedra sinica, diğer adıyla ma huang, Çin ve Orta Asya'ya özgü bir çalıdır. Gövdeleri, sinir sistemini uyaran ve bronş genişlemesini sağlayan efedrin ve psödoefedrin adlı alkaloitleri içerir. Çin tıbbında astım, bronşit ve burun tıkanıklığını tedavi etmek için kullanılmıştır. Kullanımı, yüksek tansiyon, kalp sorunları ve diğer yan etkiler nedeniyle sınırlıdır."
 je_theiler_medicinal_plant_ephedrine_success: "[GetPlayer.GetName] en az #V 5 Ephedra Sinica#! toplamıştır."
 je_theiler_medicinal_plant_strophantine: "Strophanthus Gratus"
 je_theiler_medicinal_plant_strophantine_reason: "Yeni bir ilaç geliştirme süreci genellikle şu sırayı takip eder: Tıbbi Teknik seviyenize bağlı olarak bir [concept_panum_physician], bu durumda en az #V 5 [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]#! adet belirli [concept_ito_medicinal_plants] bulmayı önerir. Bir [concept_dubois_naturalist], bunları izole etmek için yeterli örnekleri toplamakla görevlendirilir. Daha sonra bir [concept_mendelejew_chemist] kimyasal maddeyi izole eder. Madde bulunduğunda, bir [concept_theiler_biologist] ilacı üretebilir.\n\nStrophanthus gratus, Batı Afrika'ya özgü sarılıcı bir bitkidir. Tohumları, kalp kasılmalarını güçlü biçimde etkileyen ouabain gibi kardiyak glikozitler içerir. Geleneksel olarak özleri ok zehiri olarak ve küçük dozlarda kalp rahatsızlıklarını tedavi etmek için kullanılmıştır. Ouabain, kalp yetmezliği ve ritim bozuklukları üzerine yapılan çalışmalarda incelenmiştir."
 je_theiler_medicinal_plant_strophantine_success: "[GetPlayer.GetName] en az #V 5 Strophanthus Gratus#! toplamıştır."
