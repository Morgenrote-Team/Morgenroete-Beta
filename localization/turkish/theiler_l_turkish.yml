 je_theiler_microscope_achromatic: "Akromatik Mikroskop"
 je_theiler_microscope_achromatic_reason: "Ernst Abbe, 1870'lerde hassas optik tasarım sayesinde görüntü netliğini ve çözünürlüğünü büyük ölçüde artıran gelişmiş bir akromatik mikroskop geliştirdi. Carl Zeiss'taki çalışmaları, modern bilimsel mikroskobun temellerini attı ve mercek üretimini standartlaştırdı.\n\nDaha iyi mikroskoplar, [Concept('concept_theiler_pathogen','$concept_theiler_pathogens$')] ve diğer [Concept('concept_theiler_microorganism','$concept_theiler_microorganisms$')] gözlemlerinin daha başarılı olmasını sağlar. Hem bir [concept_tesla_engineer] hem de bir [concept_theiler_biologist] mevcutsa ilerleme kazanırsınız."
 je_theiler_microscope_achromatic_goal: "Bir biyolog ve bir mühendis yeni mikroskop üzerinde birlikte [JournalEntry.GetTotalGoalValue|V0] hafta çalışmalıdır."
 je_theiler_microscope_electron: "Elektron Mikroskobu"
 je_theiler_microscope_electron_reason: "Ernst Ruska ve Max Knoll tarafından 1930'larda geliştirilen elektron mikroskobu, çok daha yüksek çözünürlük elde etmek için ışık yerine elektron ışınları kullanır. Nanometre ölçeğindeki yapıları gözlemlemeyi sağlayarak optik mikroskopların sınırlarını aşmış ve bilim tarihinde önemli bir rol oynamıştır.\n\nDaha iyi mikroskoplar, [Concept('concept_theiler_pathogen','$concept_theiler_pathogens$')] ve diğer [Concept('concept_theiler_microorganism','$concept_theiler_microorganisms$')] gözlemlerinin daha başarılı olmasını sağlar. Hem bir [concept_tesla_engineer] hem de bir [concept_theiler_biologist] mevcutsa ilerleme kazanırsınız."
 je_theiler_microscope_electron_goal: "Bir biyolog ve bir mühendis yeni mikroskop üzerinde [JournalEntry.GetTotalGoalValue|V0] hafta çalışmalıdır."
