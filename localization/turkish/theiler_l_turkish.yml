 theiler.2101.t: "Mikrobiyoloji Enstitüsü"
 theiler.2101.d: "Patojen üzerine yapılan yoğun araştırmalar, [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] ekibindeki önde gelen bilim insanlarını araştırmaları daha verimli ilerletmek için bir mikrobiyoloji enstitüsü kurmaya yöneltti."
 theiler.2101.f: "Patojenleri tanımlamadaki başarılarının ardından (1876'da şarbon, 1882'de tüberküloz, 1884'te kolera), Robert Koch kendi enstitüsünü kurmak için Prusya hükümetinden destek aldı. Bu, hastalıkların nedeni olarak mikroorganizmaları sistematik ve kurumsal biçimde araştıran ilk araştırma merkeziydi. Louis Pasteur'ün Paris'teki 'Laboratoire de Chimie Physiologique' adlı kurumu (1887'den itibaren) bu tür bir araştırma tesisinin niteliğini zaten göstermişti. Ancak resmi olarak Robert Koch Enstitüsü (1891), modern anlamda ilk mikrobiyoloji enstitüsü kabul edilir."
 theiler.2101.g: "Enstitü genel araştırmalara adanmalı."
 theiler.2101.h: "Enstitü patojen araştırmalarına adanmalı."
 theiler.2102.t: "Geliştirilmiş Laboratuvar Yöntemi"
 theiler.2102.d: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName], mikrobiyoloji laboratuvarının ekipmanlarını modernleştirdi ve yeni boyama yöntemleri ile geliştirilmiş mikroskoplar kullanıma sundu; bu da patojen araştırmalarında bir atılım sağladı."
 theiler.2102.f: "1860'lardan itibaren sentetik anilin boyaları mikrobiyolojide devrim yarattı. Metilen mavisi, fuksin ve daha sonra Gram (1884) ile Ziehl-Neelsen boyaları, bakterilerin ilk kez ayrıştırılmasını sağladı. 1900 civarında sporlar, kapsüller ve difteri basilleri için özel boyalar eklendi; 1920'den itibaren Giemsa ve gümüş boyaları yaygınlaştı, 1940'larda ise ilk floresan yöntemler ortaya çıktı."
 theiler.2102.g: "İyi."
 theiler.2103.t: "Uluslararası İş Birliği"
 theiler.2103.d: "[SCOPE.sCountry('theiler_country_scope').GetName] ülkesinden Dr. [SCOPE.sCharacter('theiler_biologist_scopet').GetLastName] bir mektup yazdı. Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName]'ın bir arkadaşı olan biyolog, [ROOT.Var('theiler_biologist_var').GetCharacter.GetHerHis] patojen araştırması için bazı ipuçları sağladı."
 theiler.2103.f: "1885'ten itibaren Japon hekim Shibasaburo Kitasato, Robert Koch'un Berlin Enstitüsü'nde çalıştı. Koch'un rehberliğinde 1889'da tetanoz patojeninin ilk saf kültürünü elde ederek bakteriyolojide bir dönüm noktasına ulaştı. Birlikte, daha sonra tetanoz ve difteri tedavisinde kullanılan serum tedavisinin temellerini attılar. İş birlikleri, başarılı uluslararası araştırmaların erken örneklerinden biri olarak kabul edilir."
 theiler.2103.g: "Bu, patojen araştırmasını hızlandıracak."
 theiler.2103.h: "Bu bilgi bize daha fazla anlayış kazandırıyor."
 theiler.2104.t: "Laboratuvar Kazası"
 theiler.2104.d: "Patojen arayışı sırasında ciddi bir olay meydana geldi - gevşek güvenlik önlemleri nedeniyle araştırmacılarımıza bulaştı. Çok sayıda çalışan karantinaya alınmak zorunda ve bilimsel çalışmalar aylarca aksayabilir."
 theiler.2104.f: "Patojenlerle çalışmak son derece riskliydi. Birçok mikrobiyolog araştırmaları sırasında enfekte oldu: Robert Koch defalarca şarbon ve tüberküloza yakalandı, Emil von Behring difteri toksini deneyleri sırasında enfekte oldu ve Max von Pettenkofer teorisini test etmek için kolera bakterisi yuttu. Koruyucu önlemler ilkel olduğundan birçok araştırmacı hafif veya ağır enfeksiyonlar geçirdi. Bu deneyimler daha sonra modern laboratuvar güvenliği standartlarının gelişimine katkı sağladı."
 theiler.2104.g: "Bir felaket!"
 theiler.2104.h: "Laboratuvarı ne pahasına olursa olsun yeniden düzenlemeliyiz!"
 theiler.2105.t: "Kirlenmiş Örnekler"
 theiler.2105.d: "Görünen o ki, Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName]'ın bilim ekibinin üzerinde çalıştığı bazı örnekler kirlenmişti ve bu durum ne yazık ki patojen arayışını geriye götürdü."
 theiler.2105.f: "Şarbon, tüberküloz veya difteri üzerine yapılan çalışmalar sıklıkla küf, diğer bakteriler veya saf olmayan serum örnekleri tarafından kirleniyordu. Pasteur'ün ilk aşı deneyleri de bundan etkilenmişti. Bu tür kirlenmeler patojenler hakkında yanlış sonuçlara yol açtı ve saf kültür teknikleri, sterilizasyon ve aseptik yöntemlerin gelişimini büyük ölçüde ilerletti. Hücre kültürü araştırmaları böyle bir olayı daha az olası hale getirir."
 theiler.2105.g: "Bundan sorumlu bilim insanı kimdi?"
 theiler.2106.t: "Araştırmacılar Arasında Anlaşmazlık"
 theiler.2106.d: "Patojen arayışı üzerine büyük bir bilimsel anlaşmazlık patlak verdi. Ülkemizin önde gelen hekimlerinden biri olan Dr. [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] ile yaptığı tartışmada onun önceki keşiflerini eleştirdi. [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], biyoloğun tamamen yanlış yolda olduğunu iddia ediyor. Öte yandan [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName], doktorun konu hakkında hiçbir şey bilmediğini savunuyor."
 theiler.2106.f: "'Deneylerin iki haftalık bir Petri kabından daha kötü kokuyor!'\n'Ve hastalıkları yazı tura atar gibi bir kesinlikle teşhis ediyorsun!'\n'Lütfen, ben hayat kurtarıyorum, sen ise bakterileri evcil hayvan gibi okşuyorsun!'\n'Ha! Senin panik içinde yutan hastalarından daha iyi evcil hayvanlar!'\n'Mikroskop yağmacısı!'\n'Stetoskop sapığı!'"
 theiler.2106.g: "Dr. [ROOT.Var('panum_physician_var').GetCharacter.GetLastName] haklı."
 theiler.2106.h: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] haklı."
 theiler.2106.i: "Araştırma yapmalılar, tartışmamalılar!"
 theiler.2107.t: "Araştırma Asistanları"
 theiler.2107.d: "Biyoloğumuz Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName], bazı öğrencileri ve asistanları akademiden çekip [ROOT.Var('theiler_biologist_var').GetCharacter.GetHerHis] araştırmalarını desteklemek için laboratuvara göndermeyi önerdi."
 theiler.2107.f: "'Kariyerlerini mahvedebiliriz, ama neyse ki bu BİLİM adına!'"
 theiler.2107.g: "Ek asistanlar işe al."
 theiler.2107.h: "Genç akademisyenlere başka yerlerde ihtiyaç var."
 theiler.2111.t: "Askeri Aşı Kullanımı"
 theiler.2111.d: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName]'ın üzerinde çalıştığı aşı büyük başarı elde etti. Ordu, askerlerinin sağlığını korumak ve gelecek savaşlarda kayıpları azaltmak için bu aşıya şimdiden büyük ilgi gösteriyor."
 theiler.2111.f: "Aşılar savaşlarda belirleyici avantajlar sağladı: Hindistan'daki İngiliz birlikleri, kendilerini salgınlardan koruyan çiçek hastalığı variolasyonu ve aşılamasını kullandı. Benzer şekilde, 20. yüzyılın başlarında tropikal bölgelerde sarı humma aşısı salgın kaynaklı kayıpları azalttı. Aşılı askerler görevde kalırken, aşısız birlikler hastalık nedeniyle zayıfladı; bu nedenle aşılar stratejik silahlar gibi hareket etti."
 theiler.2111.g: "Aşılama konusunda öncelik orduya verilmeli."
 theiler.2111.h: "Aşıyı geliştirmek için bu saha çalışmasından elde edilen bilgileri kullan."
 theiler.2112.t: "Şanslı Keşif"
 theiler.2112.d: "Bir asistan beklenmedik şekilde, atık kavanozunda şaşırtıcı derecede etkili bir hazırlık içeren bir örnek keşfetti."
 theiler.2112.f: "Louis Pasteur, eski bir tavuk kolerası bakteri kültürünün tavukları hasta etmediğini keşfetti. Bu tesadüf, koruma sağlayan zayıflatılmış bir aşının geliştirilmesine yol açtı. Jonas Salk, çocuk felci virüslerinin hücre kültürlerinde büyütülebileceği ve aynı anda etkisizleştirilebileceği keşfinden yararlandı. Bu, ilk güvenli çocuk felci aşısının oluşturulmasını sağladı. Alexander Fleming ise küfün bakterileri öldürdüğünü tesadüfen fark ederek penisilinin keşfine yol açtı."
 theiler.2112.g: "Asistanı ödüllendir."
 theiler.2113.t: "Başarılı Test"
 theiler.2113.d: "Yeni aşının ilk denemesi beklenmedik derecede etkili oldu. Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName], seri üretime ve kitlesel aşılamaya çok daha erken başlamayı düşünüyor. Bu, aşı bilimi için mutlu bir gün!"
 theiler.2113.f: "Başarılı bir aşı pilot denemesinin olağanüstü örneklerinden biri, 19. yüzyılın sonunda Waldemar Haffkine tarafından geliştirilen kolera ve veba aşılarıdır. Rus-Yahudi kökenli bir mikrobiyolog olan Haffkine, 1892'de Hindistan'da bir kolera aşısının ilk klinik denemelerini gerçekleştirdi ve bu aşı daha sonra geniş çapta kullanıldı. 1897'de vebaya karşı bir aşı geliştirdi; bu aşı 1898'de Hindistan'da test edildi ve ölümlerde büyük bir azalmaya yol açtı. Çalışmaları modern aşı geliştirme tarihinde bir dönüm noktası kabul edilir."
 theiler.2113.g: "Aşı geliştirme için büyük bir adım!"
 theiler.2113.h: "Bunlar tıbbi araştırmalar için yeni ipuçları."
 theiler.2114.t: "Beklenmeyen Yan Etkiler"
 theiler.2114.d: "[SCOPE.sState('theiler_state_scope').GetCityHubName] bölgesinde Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName]'ın yeni aşısı ciddi yan etkiler gösterdi. Deneklerin çoğu ağır şekilde hastalandı ve bazıları hayatını kaybetti. Deneme yalnızca halkın güvenini sarsmakla kalmadı, aynı zamanda aşı geliştirme çalışmalarını da önemli ölçüde geriye götürebilir."
 theiler.2114.f: "1930'larda Lübeck'te ciddi bir aşılama olayı yaşandı: 251 yenidoğana, hatalı üretim nedeniyle virülent tüberküloz bakterileriyle kirlenmiş BCG tüberküloz aşısı uygulandı. 208 çocuk hastalandı ve 77'si öldü. 'Lübecker Impfunglück' (Lübeck Aşılama Felaketi), halk skandalına yol açtı, Almanya'da BCG aşısının kullanımını geciktirdi ve aşı üretiminde daha sıkı güvenlik standartlarının uygulanmasına neden oldu."
 theiler.2114.g: "Bunu kim öngörebilirdi?"
 theiler.2114.h: "Deneyleri bölgede yine de sürdür."
 theiler.2115.t: "İntihal Suçlaması"
 theiler.2115.d: "[SCOPE.sCountry('theiler_country_scope').GetName] ülkesinden yabancı bir biyolog, Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] tarafından geliştirilmekte olan yeni aşının üretimini kapsamlı şekilde inceledi. [SCOPE.sCharacter('theiler_biologist_scope').GetSheHe], ciddi suçlamalarda bulunuyor: [SCOPE.sCharacter('theiler_biologist_scope').GetSheHe], bunun Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName]'ın patentlemeyi planladığı çok benzer bir serumun intihali olduğunu iddia ediyor."
 theiler.2115.f: "19. yüzyıl ile 20. yüzyılın başları arasında patent korumasının ve uluslararası standartların eksikliği, aşı biliminde yazarlık anlaşmazlıklarına yol açtı. Pasteur, iş arkadaşı Toussaint daha önce deneyler yapmış olsa da sığır kolerası aşısının itibarını kendisine mal etti. Daha sonra BCG suşları ile Haffkine'in kolera ve veba aşıları tartışmalara neden oldu. Öncelik ve 'intihal' tartışmaları, aşılama yöntemlerinin hassas ve değerli olduğu bu dönemin tipik özelliklerindendi."
 theiler.2115.g: "Özür dile."
 theiler.2115.h: "Bu sadece bir tesadüf."
 theiler.2116.t: "Maliyet Patlaması"
 theiler.2116.d: "Görünüşe göre Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName], yeni aşının maliyetini hafife aldı. [SCOPE.sCharacter('theiler_biologist_scope').GetHerHis|U] iyimser tahmini artık tüm geliştirme sürecini tehlikeye atabilir."
 theiler.2116.f: "'Para mı? Para?! Kirli kazanç! Bilim için hayatımı feda ettiğimi bilmiyor musunuz? Sonuçta bu, ölüme karşı son zaferle ilgili! İnsanlığın bir belasını ortadan kaldırmakla ilgili! Ve siz bana listeler, tablolar ve bilançolarla gelmeye cüret ediyorsunuz? Siz nesiniz? Muhasebeci mi? Laboratuvarımdan çıkın!'"
 theiler.2116.g: "Yeni aşıyı sübvanse et."
 theiler.2116.h: "Geçici işçi olarak daha fazla akademisyen işe al."
 theiler.2116.i: "Bununla başa çık."
 theiler_state_trait_cochliomyia: "Cochliomyia hominivorax"
 theiler_state_trait_cydia: "Cydia pomonella"
 je_theiler_cochliomyia_eredication: "Cochliomyia Yok Etme"
 je_theiler_cochliomyia_eredication_reason: "Mevcut en modern yöntemlerle, tehlikeli Yeni Dünya kurt sineğinin yok edilmesi mümkün olabilir ve insanları ile hayvanları bu beladan kurtarabilir. Bir biyolog teori geliştirebilir ve bu soruna uygun bir çözüm bulmak için saha deneyleri gerçekleştirebilir.\n\nBiyolog çalışmaları sırasında ölürse, paraziti yok etme çalışmaları durdurulacak ancak tekrar bir biyolog bulunduğunda devam edecektir."
 je_theiler_cochliomyia_eredication_success: "Bir [concept_theiler_biologist], cochliomyia'yı yok etmek için bir yöntem bulmak üzere en az #ORANGE 12 ay#! çalıştı."
 je_theiler_cochliomyia_eredication_goal: ""
 theiler.21.t: "Kısır Böcek Tekniği"
 theiler.21.d: "Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] alışılmadık ancak çığır açıcı bir fikir geliştirdi: Parazitleri böcek ilaçlarıyla yok etmek yerine, dişilerin yavru üretememesi için kısır erkekler yetiştirmek umut verici bir yöntem olabilir."
 theiler.21.f: "Kısır Böcek Tekniği (SIT), 1950'lerde Raymond C. Bushland ve Edward F. Knipling tarafından geliştirildi. Erkek sinekler genellikle kobalt-60 veya sezyum-137 kaynaklarından gelen gama ışınıyla kısırlaştırılır. Bu yüksek enerjili radyasyon, hayvanların canlılığını veya çiftleşme yeteneğini önemli ölçüde etkilemeden üreme hücrelerindeki DNA'yı yok eder. Kısırlaştırılmış erkekler daha sonra büyük miktarlarda doğaya salınır. Yabani dişilerle başarılı şekilde çiftleşmeye devam ederler ancak yaşayabilir yavrular üretemedikleri için popülasyon zamanla çöker. Bu yöntem özellikle Yeni Dünya kurt sineğine karşı başarılı olmuş ve Kuzey ile Orta Amerika'da yok edilmesi büyük ekonomik ve veterinerlik zararlarını önlemiştir."
 theiler.21.g: "Onları gerçekten nükleer enerjiyle mi vuracağız?"
 theiler.22.t: "[SCOPE.sState('theiler_state_scope').GetName] Bölgesinde Cochliomyia Yok Edildi"
 theiler.22.d: "Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName], Yeni Dünya kurt sineğinin başka bir bölgede daha yok edildiğini bildiriyor."
 theiler.22.g: "Kurtlara lanet olsun!"
 theiler_cochliomyia_experiment_lab_modifier: "Cochliomyia Deney Laboratuvarı"
 je_theiler_sti: "Kısır Böcek Tekniği"
 je_theiler_sti_reason: "Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName], modern teknolojiyi kullanarak bir bölgedeki kurt sineğini yok etmeye çalışıyor."
 je_theiler_sti_success: "Bir [concept_theiler_biologist], cochliomyia'nın yok edilmesi üzerinde en az #ORANGE 36 ay#! çalıştı."
 je_theiler_sti_goal: ""
 je_theiler_cydia_pesticide: "Cydia Böcek İlacı"
 je_theiler_cydia_pesticide_reason: "Temel böcek ilacı bilgisiyle bir biyolog, bir kimyagerle iş birliği yaparak elma iç kurduna karşı etkili bir çözüm bulabilir.\n\nBiyolog veya kimyager çalışmaları sırasında ölürse, böcek ilacı üzerindeki çalışmalar durdurulacak ancak her iki akademisyen de tekrar mevcut olduğunda devam edecektir."
 je_theiler_cydia_pesticide_success: "Bir [concept_theiler_biologist], yeni bir böcek ilacı üzerinde en az #ORANGE 12 ay#! çalıştı."
 je_theiler_cydia_pesticide_goal: ""
 je_theiler_lead_arsenate: "Kurşun Arsenat"
 je_theiler_lead_arsenate_reason: "Meyve yetiştiricilerimiz, piyasada kurşun sıkıntısı olmadığı sürece, yeni icat edilen kurşun arsenat sayesinde elma iç kurdunu ve diğer zararlıları kontrol edebilir. Her ay bir eyalette paraziti kontrol altına almak mümkün olmalıdır."
 theiler.31.t: "Kurşun Arsenat"
 theiler.31.d: "Dr. [SCOPE.sCharacter('mendelejew_chemist_scope').GetLastName] ile iş birliği yapan Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName], seri üretimi tarımda devrim yaratabilecek etkili bir böcek ilacı geliştirdi. Elma iç kurdu elmalardaki son öğününü yedi!"
 theiler.31.f: "Kurşun arsenat (PbHAsO₄), 1892'de Massachusetts'te Melville Thurston Cook tarafından meyve bahçelerindeki elma iç kurdunu (Cydia pomonella) kontrol etmek için geliştirildi. Zehirli bakır arsenit ('Paris Yeşili') yerine daha kararlı ve bitkilere daha az zarar veren bir alternatifti. Toz formundaki madde, böcekler beslenirken onları öldürüyor, yapraklara ve meyvelere uzun süre yapışıyor ve ticari meyve üretiminde ilk kez etkili bir kontrol sağlıyordu. Kurşun arsenat, çevreye ve insan sağlığına zararlı olmasına rağmen DDT gibi sentetik böcek ilaçlarının kullanılmaya başlanmasına kadar yaygın şekilde kullanıldı."
 theiler.31.g: "Onları gerçekten zehirliyor muyuz?"
 theiler.31.tt: "Bundan sonra çiftçiler, Cydia değiştiricisinden kurtulmak için meyve bahçelerinde kurşun arsenat kullanacak."
 theiler.32.t: "Elma İç Kurdu [SCOPE.sState('theiler_state_scope').GetName] Bölgesine Yayılıyor!"
 theiler.32.d: "Elma iç kurdu yaşam alanını genişletti: Komşu bir bölgeden [SCOPE.sState('theiler_state_scope').GetName] bölgesine de yayılarak buradaki meyve bahçelerine zarar vermeye başladı."
 theiler.32.f: "Elma iç kurdu (Cydia pomonella) Avrasya kökenlidir ve 19. yüzyılda elma yetiştiriciliğiyle birlikte Orta Avrupa, Kuzey İtalya, Balkanlar, Macaristan, Uralların batısındaki Rusya bölgeleri, Kuzey Amerika ve Avustralya'ya yayıldı. Kuzey ülkeleri, çok sıcak veya kurak bölgeler büyük ölçüde bu zararlıdan etkilenmedi. 20. yüzyılda İskandinavya, Baltık ülkeleri ve Güney Amerika dahil olmak üzere dünyanın neredeyse tüm ılıman elma yetiştirme bölgelerine ulaştı ve meyve bahçelerinin en önemli zararlılarından biri haline geldi."
 theiler.32.g: "Görünüşe göre meyve fiyatları artacak."
 theiler.33.t: "Elma İç Kurdu Güney Amerika'ya Yayılıyor!"
 theiler.33.d: "Doğa bilimciler ve biyologlar bugün, çiftçileri ve tüccarları endişelendiren bir rapor sundu. Avrupa ve Batı Asya kökenli kötü şöhretli elma iç kurdu, ilk kez bizim meyve bahçelerimizde keşfedildi. Bu, Güney Amerika'daki ilk görülüşüdür!"
 theiler.33.g: "Uluslararası ticaretin faydalarını böyle hayal etmemiştim..."
 theiler.34.t: "Elma İç Kurdu Güney Afrika'ya Yayılıyor!"
 theiler.34.d: "Doğa bilimciler ve biyologlar bugün, çiftçileri ve tüccarları endişelendiren bir rapor sundu. Avrupa ve Batı Asya kökenli kötü şöhretli elma iç kurdu, ilk kez bizim meyve bahçelerimizde keşfedildi. Bu, Güney Afrika'daki ilk görülüşüdür!"
 theiler.35.t: "Elma İç Kurdu Okyanusya'ya Yayılıyor!"
 theiler.35.d: "Doğa bilimciler ve biyologlar bugün, çiftçileri ve tüccarları endişelendiren bir rapor sundu. Avrupa ve Batı Asya kökenli kötü şöhretli elma iç kurdu, ilk kez bizim meyve bahçelerimizde keşfedildi. Bu, Okyanusya'daki ilk görülüşüdür!"
 theiler.41.t: "[AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]"
 theiler.41.d: "Dr. [ROOT.Var('panum_physician_var').GetCharacter.GetLastName], #V [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]#! ile yaptığı çeşitli tedaviler sırasında bunun gelişmiş iyileştirici potansiyele sahip olduğunu keşfetti. Ancak bu, daha büyük miktarlarda tedarik ve aktif bileşenin izole edilmesi için kapsamlı araştırmalar gerektiriyor. Bu, tamamen yeni bir ilacın geliştirilmesini mümkün kılabilir!"
 theiler.41.g: "Yani, [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)] yeni bir mucize bitki mi?"
