 theiler.42.d.strychnine: "Ortak bir çalışma sonucunda bilim insanlarımız, #V $je_theiler_medicinal_plant_strychnine$#! bitkisinden izole edilebilen farmasötik #V Strychnine#! maddesini keşfetti."
 theiler.42.d.emetine: "Ortak bir çalışma sonucunda bilim insanlarımız, #V $je_theiler_medicinal_plant_emetine$#! bitkisinden izole edilebilen farmasötik #V Emetine#! maddesini keşfetti."
 theiler.42.d.atropine: "Bilim insanlarımız ortak bir çalışma sonucunda, #V $je_theiler_medicinal_plant_atropine$#! bitkisinden izole edilebilen #V Atropin#! adlı ilacı keşfetmiştir."
 theiler.42.d.aloin: "Bilim insanlarımız ortak bir çalışma sonucunda, #V $je_theiler_medicinal_plant_aloin$#! bitkisinden izole edilebilen #V Aloin#! adlı ilacı keşfetmiştir."
 theiler.42.d.digitoxin: "Bilim insanlarımız ortak bir çalışma sonucunda, #V $je_theiler_medicinal_plant_digitoxin$#! bitkisinden izole edilebilen #V Digitoksin#! adlı ilacı keşfetmiştir."
 theiler.42.d.quinine: "Bilim insanlarımız ortak bir çalışma sonucunda, #V $je_theiler_medicinal_plant_quinine$#! bitkisinden izole edilebilen #V Kinin#! adlı ilacı keşfetmiştir."
 theiler.42.d.thymol: "Bilim insanlarımız ortak bir çalışma sonucunda, #V $je_theiler_medicinal_plant_thymol$#! bitkisinden izole edilebilen #V Timol#! adlı ilacı keşfetmiştir."
 theiler.42.d.pilocarpine: "Bilim insanlarımız ortak bir çalışma sonucunda, #V $je_theiler_medicinal_plant_pilocarpine$#! bitkisinden izole edilebilen #V Pilokarpin#! adlı ilacı keşfetmiştir."
 theiler.42.d.ephedrine: "Bilim insanlarımız ortak bir çalışma sonucunda, #V $je_theiler_medicinal_plant_ephedrine$#! bitkisinden izole edilebilen #V Efedrin#! adlı ilacı keşfetmiştir."
 theiler.42.d.strophantine: "Bilim insanlarımız ortak bir çalışma sonucunda, #V $je_theiler_medicinal_plant_strophantine$#! bitkisinden izole edilebilen #V Strofantin#! adlı ilacı keşfetmiştir."
 theiler.42.f.strychnine: "#V Striknin#! ilk olarak Güneydoğu Asya'ya özgü bir ağaç olan Strychnos Ignatii'nin tohumlarından izole edilmiştir. Pestisit olarak ve çok küçük dozlarda kas, kalp ve bağırsak uyarıcısı olarak kullanılmıştır. Ancak en çok nörotoksik etkileriyle tanınır; aşırı dozlar kasılmalara, terlemeye, çene kilitlenmesine ve ölümle sonuçlanabilen diğer acı verici belirtilere yol açar. Bu nedenle potansiyel katillerin ve suç romanı yazarlarının tercih ettiği maddelerden biri hâline gelmiştir."
 theiler.42.f.emetine: "#V Emetin#!, Orta ve Güney Amerika'ya özgü bir çiçek olan ve ipekakuana kökü olarak da bilinen Carapichea ipecacuanha'da bulunan bir ilaçtır. İlk olarak bağırsak enfeksiyonu olan amipli dizanteri tedavisinde kullanılmıştır. Kusmaya neden olan etkisi nedeniyle bu isim verilmiştir; mide bulantısı ve kusmaya yol açması bilinen bir yan etkisidir."
 theiler.42.f.atropine: "#V Atropin#!, güzelavrat otu olarak da bilinen ve Avrupa ile Batı Asya'ya özgü bir bitki olan Atropa Belladonna'dan elde edilen bir ilaçtır. Atropin; astım tedavisinde, sinir uyarılarının yan etkilerini engellemede, tükürük üretimini azaltmada, bazı zehirlenmeleri tedavi etmede ve kadınlar tarafından kozmetik amaçlarla göz bebeklerini büyütmede kullanılmıştır."
 theiler.42.f.aloin: "#V Aloin#!, başta Aloe türü bitkiler olmak üzere çeşitli bitkilerde farklı oranlarda bulunan doğal bir bileşiktir. Müshil olarak, güneş yanıklarının tedavisinde, yaraların sarılmasında ve antioksidan ile iltihap önleyici özellikleri nedeniyle kullanılmıştır."
 theiler.42.f.digitoxin: "#V Digitoksin#!, Avrupa'nın tamamında ve Fas'ta yetişen, yüksük otu olarak da bilinen Digitalis Purpurea bitkisinde bulunan doğal bir bileşiktir. Digitoksin; vücutta sıvı birikimini azaltmak (ödem), idrar akışını kolaylaştırmak ve kalp ritim bozuklukları ile kalp yetmezliği tedavisinde kullanılmıştır. Ancak adından da anlaşılacağı üzere toksik özelliklere sahiptir; düzensiz kalp atışı, mide bulantısı, kalp durması ve ölüme yol açabilir."
 theiler.42.f.quinine: "#V Kinin#!, ilk olarak Peru'ya özgü Cinchona ağacının kabuğundan izole edilen bir ilaçtır. Kininin görkemli bir geçmişi vardır. Kabuk ilk olarak Keçuva halkı tarafından kas gevşetici olarak kullanılmış, daha sonra Cizvitler tarafından Avrupa'ya getirilerek sıtma tedavisinde kullanılmıştır. Bu kabuktan saflaştırılan kinin kısa sürede yaygınlaşmış ve Avrupa'nın Afrika kıtasındaki sömürgeleştirme ve fetih faaliyetleri için yeni fırsatlar sağlamıştır. Ayrıca kızıl, sarı humma ve grip tedavisinde de kullanılabilir."
 theiler.42.f.thymol: "#V Timol#!, başta Güney Avrupa'ya özgü yaygın kekik (Thymus vulgaris) olmak üzere çeşitli bitkilerden elde edilen bir ilaçtır. Antimikrobiyal, mantar önleyici ve antiseptik özellikleriyle bilinmiş; bu nedenle yaraların tedavisinde, diş hijyeninde ve parazitlerle mücadelede yaygın olarak kullanılmıştır."
 theiler.42.f.pilocarpine: "#V Pilokarpin#!, Güney Amerika tropiklerine özgü Pilocarpus cinsindeki bitkilerden elde edilen bir ilaçtır. Tükürük ve ter üretimini artırmak için kullanılmıştır ve bu nedenle hastalıklar veya diğer tedavilerin yan etkileri nedeniyle oluşan ağız kuruluğunun tedavisinde yaygın olarak kullanılır. Ayrıca çeşitli göz hastalıklarının tedavisinde de kullanılmıştır."
 theiler.42.f.ephedrine: "#V Efedrin#!, Kuzey Çin, Moğolistan ve Rusya'nın yüksek bölgelerine özgü Ephedra Sinica bitkisinden elde edilen bir uyarıcıdır. Astım, narkolepsi, obezite ve burun tıkanıklığı tedavisinde kullanılmıştır. Uyku sorunları, baş ağrısı, anksiyete, halüsinasyonlar, yüksek tansiyon ve kalp hızında artış gibi birçok yan etkisi vardır. Son iki etkisi nedeniyle performans artırıcı bir uyarıcı olarak da kullanılmıştır."
 theiler.42.f.strophantine: "#V Strofantin#!, Afrika'ya özgü Strophantus cinsindeki bitkilerden elde edilen bir ilaçtır. Kalp fonksiyonlarını iyileştirmek, kalp yetmezliğini tedavi etmek ve sinir sisteminin performansını artırmak için kullanılmıştır; ancak yüksek konsantrasyonlarda ok zehiri olarak da kullanılmıştır."
 theiler.42.g: "Eczacılık için büyük bir dönüm noktası!"
