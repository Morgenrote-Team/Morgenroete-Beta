 theiler.2201.t: "Tarımsal Geliştirmeler"
 theiler.2201.d: "Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName], hedefini başarıyla gerçekleştirdi. Dikkatli seçilim yöntemleri ve [SCOPE.sCharacter('theiler_biologist_scope').GetHerHis] biyolojik uzmanlığının uygulanması sayesinde, [SCOPE.sCharacter('theiler_biologist_scope').GetSheHe] ülkemizin tarım endüstrisini sürdürülebilir şekilde güçlendirdi.\n\nToplam geliştirilen bina sayısı: [GetPlayer.MakeScope.Var('mr_num_improved_agriculture_buildings_var').GetValue|V0]\n$concept_theiler_microorganisms$ Projeden: [GetPlayer.MakeScope.ScriptValue('theiler_microorganisms_from_agriculture_project_for_event_value')|+0] @theiler_microorganisms_texticon!"
 theiler.2201.f: "'Bu aptallar hâlâ tüm bu bitkileri kendilerinin evcilleştirdiğini sanıyor. Gerçekte ise bizi insanlar olarak evcilleştiren bitkiler oldu. Onlara gösterdiğimiz özeni bir düşünün!'"
 theiler.2201.g: "Ekonomimiz büyüyor!"
