 theiler.10.t: "Mikrobiyolojinin Doğuşu"
 theiler.10.d: "Yeni bir çalışma biyoloji ve tıp çevrelerinde büyük yankı uyandırıyor. Yazarı Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName], dünyaya bakışımızı değiştirebilecek bakteriler hakkında önemli keşifler yaptı."
 theiler.10.f: "Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] tarafından bakterilerin sınıflandırılması üzerine yürütülen sistematik çalışmalar dikkat çekici sonuçlar verdi. [SCOPE.sCharacter('theiler_biologist_scope').GetHerHis|U] 'Bakteriler Üzerine Araştırma' adlı çalışması, bakterileri tekrarlanabilir özelliklere sahip ayrı bir taksonomik grup olarak tanımladı. [SCOPE.sCharacter('theiler_biologist_scope').GetSheHe|U], bakterilerin tıpkı bitkiler veya hayvanlar gibi yetiştirilebileceğini, incelenebileceğini ve sınıflandırılabileceğini gösterdi. En önemlisi, [SCOPE.sCharacter('theiler_biologist_scope').GetHerHis] yöntemleri araştırmacıların zararsız ve hastalık yapıcı bakterileri birbirinden ayırmasına olanak sağlayabilir. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName]'in yöntemleri, bulaşıcı hastalıkların mekanizmalarını sonunda açıklayabilecek yepyeni bir tıp dalının temelini oluşturabilir."
 theiler.10.g: "Mikroorganizmaları araştırmada bir dönüm noktası."
 theiler.10.h: "Mikrop teorisi için büyük bir atılım."
