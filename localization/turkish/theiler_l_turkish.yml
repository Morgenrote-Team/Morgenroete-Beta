 je_theiler_microorganism_research_reason: "[ROOT.GetCountry.GetCustom('je_theiler_microorganism_research_active_type')]Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] şu anda mikroorganizmaların büyüleyici dünyasını araştırıyor. Yeteneklerine ve kullanılan mikroskoba bağlı olarak, [ROOT.Var('theiler_biologist_var').GetCharacter.GetSheHe] her ay yeni mikroorganizmalar keşfedecek. Mikroorganizmalar hakkında kapsamlı bilgi, [Concept('concept_theiler_pathogen','$concept_theiler_pathogens$')] tespit etmek için büyük önem taşır.\n\nEğer [concept_theiler_biologist] henüz bu beceriyi kazanmadıysa, Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName]'in $theiler_microbiologist$ özelliğini kazanma ihtimali de vardır. Bu özellik, Mikroorganizma Araştırması'nın en fazla 60 ayından sonra kazanılır.\n$mr_divider_for_je$\nMevcut tahmini verim: ayda @theiler_microorganisms_texticon! [ROOT.Var('theiler_estimated_microorganisms_on_microorganisms_research_var').GetValue|+=0] [Concept('concept_theiler_microorganism','$concept_theiler_microorganisms$')].[ROOT.GetCountry.GetCustom('je_theiler_microorganism_research_num_months_type')]"
 je_theiler_microorganism_research: "Mikroorganizma Araştırması"
