 theiler.101.t: "Vibrio Cholerae"
 theiler.101.d: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName], kolera patojenini tanımlayıp izole etmeyi başardı. Bu, etkili bir aşı geliştirme çalışmalarının başlamasında bir dönüm noktasıdır."
 theiler.101.f: "Vibrio cholerae bakterisi ilk olarak 1854'te İtalyan anatomist Filippo Pacini tarafından tanımlandı, ancak kolera salgınlarındaki rolü 1884'te Robert Koch tarafından doğrulandı. Özellikle sıcak, tuzlu sularda yaşayan kıvrımlı çubuk biçimli bir organizmadır. V. cholerae gram-negatiftir, hareket için tek kutuplu kamçıya sahiptir ve bağırsaktaki su dengesini bozarak şiddetli ishale neden olan kolera toksini salgılar."
 theiler.101.g: "Ne kadar da iğrenç küçük bir şey."
 theiler.201.t: "Mycobacterium Tuberculosis"
 theiler.201.d: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName], tüberküloz patojenini tanımlayıp izole etmeyi başardı. Bu, etkili bir aşı geliştirme çalışmalarının başlamasında bir dönüm noktasıdır."
 theiler.201.f: "Bu bakteri 1882'de Robert Koch tarafından tanımlandı ve kendisine 1905 Nobel Ödülü'nü kazandırdı. M. tuberculosis, mikolik asit bakımından zengin mumsu hücre duvarına sahip, yavaş büyüyen çubuk biçimli bir organizmadır; bu özellik onu standart Gram boyamasına ve birçok antibiyotiğe dirençli kılar. Bunun yerine 'aside dirençli' olarak sınıflandırılır. Patojen zorunlu aerobiktir ve çoğunlukla akciğerleri etkiler, ancak diğer organlara da yayılabilir."
 theiler.201.g: "Zamanın doldu, sessiz avcı."
 theiler.301.t: "Orthopoxvirus Variolae"
 theiler.301.d: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName], çiçek hastalığı patojenini tanımlayıp izole etmeyi başardı. İlk aşılamadan uzun süre sonra, hastalığa neden olan etken artık gözlemlenebilir ve sınıflandırılabilir."
 theiler.301.f: "Çiçek hastalığının etkeni olan Variola virüsü, Poxviridae ailesine aittir. Çoğu virüsün aksine, tamamen konak hücrelerin sitoplazmasında çoğalır. Çift sarmallı DNA içeren büyük, tuğla biçimli bir virüstür. Variola, Edward Jenner tarafından 1796'da geliştirilen ilk başarılı aşının hedefiydi ve 1980'de aşılama yoluyla ortadan kaldırılan ilk insan patojeni oldu."
 theiler.301.g: "Bu kadar küçük bir şey imparatorlukları nasıl devirebildi?"
 theiler.401.t: "Rickettsia Prowazekii"
 theiler.401.d: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName], tifüs patojenini tanımlayıp izole etmeyi başardı. Bu, etkili bir aşı geliştirme çalışmalarının başlamasında bir dönüm noktasıdır."
 theiler.401.f: "Henrique da Rocha Lima bu bakteriyi 1916'da keşfetti. Adını, 1915'te tifüsten ölen meslektaşı Stanislaus von Prowazek'ten aldı. Hem Prowazek hem de Rocha Lima, Almanya'nın Cottbus kentindeki savaş esiri kampı hastanesinde etkeni araştırırken tifüse yakalandı. Bu bakteri kamçıdan yoksundur ve aerobiktir. Hücre duvarları kristal viyole Gram boyasını tutmadığı için gram-negatif olarak sınıflandırılır; gram-negatif bakteriler genel olarak penisilin gibi birçok antibiyotiğe daha dirençlidir."
 theiler.401.g: "Küçük, kasvetli bir yolcu!"
 theiler.501.t: "Orthoflavivirus Flavi"
 theiler.501.d: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName], sarı humma patojenini tanımlayıp izole etmeyi başardı. Bu, etkili bir aşı geliştirme çalışmalarının başlamasında bir dönüm noktasıdır."
 theiler.501.f: "Sarı humma virüsü ilk olarak 1927'de Gana'daki bir hastadan izole edildi. Flaviviridae ailesinin bir üyesidir ve tek sarmallı pozitif anlamlı RNA genomu taşır. Virüs, başta Aedes aegypti olmak üzere Aedes sivrisinekleriyle taşınır. Enfeksiyon ateş, kas ağrısı ve sarılığa neden olabilir; ağır vakalarda kanama ve organ yetmezliğine yol açar."
 theiler.501.g: "Doğanın en acımasız oyunlarından biri ortaya çıkıyor."
 theiler.601.t: "Measles Morbillivirus"
 theiler.601.d: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName], kızamık patojenini tanımlayıp izole etmeyi başardı. Bu, etkili bir aşı geliştirme çalışmalarının başlamasında bir dönüm noktasıdır."
 theiler.601.f: "Kızamık virüsü, Paramyxoviridae ailesindeki Morbillivirus cinsine aittir. Tek sarmallı negatif anlamlı RNA genomuna sahip zarflı bir virüstür. Solunum damlacıklarıyla bulaşır ve insanlarda bilinen en bulaşıcı virüslerden biridir. Kızamık ateş, öksürük, konjonktivit ve karakteristik döküntülere neden olur; zatürre veya ensefalit gibi ciddi komplikasyonlara yol açabilir."
 theiler.601.g: "Bağışıklık sistemine saldıran küçük bir terörist."
 theiler.701.t: "Streptococcus Pyogenes"
 theiler.701.d: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName], kızıl patojenini tanımlayıp izole etmeyi başardı. Bu, etkili bir aşı geliştirme çalışmalarının başlamasında bir dönüm noktasıdır."
 theiler.701.f: "Streptococcus pyogenes bakterisi zincirler halinde dizilen gram-pozitif bir koktur. A Grubu β-hemolitik streptokok olarak sınıflandırılır ve ilk kez 19. yüzyılda kızıl hastalığıyla ilişkilendirilmiştir. Hastalık yapma gücü, döküntüden sorumlu eritrojenik toksin dahil salgıladığı ekzotoksinlerden gelir. Bu organizma ayrıca boğaz enfeksiyonu, impetigo ve romatizmal ateşe de neden olur."
 theiler.701.g: "Ne kadar da kurnaz küçük bir alçak ..."
 theiler.801.t: "Yersinia Pestis"
 theiler.801.d: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName], veba patojenini tanımlayıp izole etmeyi başardı. Bu, etkili bir aşı geliştirme çalışmalarının başlamasında bir dönüm noktasıdır."
 theiler.801.f: "Yersinia pestis, 1894'te Hong Kong'daki bir salgın sırasında Alexandre Yersin tarafından keşfedildi. Gram-negatif, hareketsiz bir kokobasildir. Bakteri, enfekte kemirgenlerle beslenen pireler, özellikle de kara sıçanlar tarafından taşınır. Üç veba türüne neden olur: hıyarcıklı, septisemik ve akciğer vebası. Tedavi edilmezse ölüm oranı son derece yüksektir."
 theiler.801.g: "Yani bu, mikroskobik biçerdöver mi?"
 theiler.901.t: "Corynebacterium diphtheriae"
 theiler.901.d: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName], difteri patojenini tanımlayıp izole etmeyi başardı. Bu, etkili bir aşı geliştirme çalışmalarının başlamasında bir dönüm noktasıdır."
 theiler.901.f: "Bu gram-pozitif, sopa biçimli bakteri, 1883'te Edwin Klebs tarafından difterinin nedeni olarak tanımlandı ve ertesi yıl Friedrich Löffler tarafından kültürü yapıldı. C. diphtheriae aerobik ve hareketsizdir. En tehlikeli özelliği, bir bakteriyofaj tarafından kodlanan ve kalp ile sinir dokularına zarar veren difteri toksinidir. Hastalık bir zamanlar çocuk ölümlerinin başlıca nedeniydi, ancak günümüzde aşılama ile kontrol edilmektedir."
 theiler.901.g: "Aldatıcı derecede basit, yıkıcı derecede acımasız."
 theiler.1001.t: "Poliovirüs"
 theiler.1001.d: "Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName], çocuk felci patojenini tanımlayıp izole etmeyi başardı. Bu, etkili bir aşı geliştirme çalışmalarının başlamasında bir dönüm noktasıdır."
 theiler.1001.f: "Poliovirüs, Picornaviridae ailesine aittir ve ilk olarak 1909'da izole edilmiştir. Tek sarmallı pozitif anlamlı RNA genomuna sahip küçük, zarfsız bir virüstür. Virüs çoğunlukla dışkı-ağız yoluyla yayılır ve omurilikteki motor nöronları hedef alarak bazen geri dönüşü olmayan felce neden olur. Küresel aşılama kampanyaları poliovirüsü yok olmanın eşiğine getirmiştir."
 theiler.1001.g: "Görünmeyen bir şey nasıl bu kadar şeyi yok edebilir?"
 theiler.102.t: "Kolera Aşısı"
 theiler.102.d: "Sayısız deney, başarısızlık ve testin ardından Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] bir atılım gerçekleştirdi: Kolera aşısı artık yalnızca bir hayal değil, bir gerçek. Tıbbi ve biyolojik bir devrim!"
 theiler.102.f: "İlk kolera aşısı, İspanyol hekim Jaime Ferrán tarafından 1885'te canlı zayıflatılmış Vibrio cholerae suşları kullanılarak geliştirildi. Valencia'daki bir salgın sırasında yaptığı saha çalışmaları, bakteriyel bir hastalığa karşı ilk kitlesel bağışıklamalardan biri oldu. Daha sonraki aşılar, öldürülmüş tam hücre preparatlarına ve sonunda öldürülmüş bakteriler ile kolera toksininin yeniden birleştirilmiş B alt birimini birleştiren modern ağızdan alınan aşılara dönüştü."
 theiler.102.g: "Bilim karşılık veriyor."
 theiler.202.t: "Tüberküloz Aşısı"
 theiler.202.d: "Sayısız deney, başarısızlık ve testin ardından Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] bir atılım gerçekleştirdi: Tüberküloz aşısı artık yalnızca bir hayal değil, bir gerçek. Tıbbi ve biyolojik bir devrim!"
 theiler.202.f: "Bacillus Calmette-Guérin (BCG) aşısı, 1921'de Fransız bilim insanları Albert Calmette ve Camille Guérin tarafından geliştirildi. Mycobacterium tuberculosis'in akrabası olan Mycobacterium bovis'in canlı, zayıflatılmış bir suşuna dayanır. Aşı, akciğer tüberkülozuna karşı değişken koruma sağlarken, miliyer TB ve tüberküloz menenjiti gibi ağır çocukluk formlarını önlemede oldukça etkilidir."
 theiler.202.g: "Sessiz avcıya karşı bir savunma kıvılcımı."
 theiler.402.t: "Tifüs Aşısı"
 theiler.402.d: "Sayısız deney, başarısızlık ve testin ardından Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] bir atılım gerçekleştirdi: Tifüs aşısı artık yalnızca bir hayal değil, bir gerçek. Tıbbi ve biyolojik bir devrim!"
 theiler.402.f: "İlk etkili tifüs aşısı, 1930'larda Polonyalı biyolog Rudolf Weigl tarafından geliştirildi. Rickettsia prowazekii'yi bitlerin bağırsaklarında yetiştirdi ve bağışıklama için etkisizleştirilmiş bakteriler kullandı. II. Dünya Savaşı sırasında Lviv'deki laboratuvarı, aşı üretimini Nazi zulmü riski altındaki insanları korumak ve çalıştırmak için gizlice kullandı. Günümüzde salgın tifüse karşı modern aşılar nadiren kullanılır."
 theiler.402.g: "Yolcuyu alt etmeyi başardık."
 theiler.502.t: "Sarı Humma Aşısı"
 theiler.502.d: "Sayısız deney, başarısızlık ve testin ardından Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] bir atılım gerçekleştirdi: Sarı humma aşısı artık yalnızca bir hayal değil, bir gerçek. Tıbbi ve biyolojik bir devrim!"
 theiler.502.f: "Sarı humma aşısı, 1930'larda Güney Afrikalı virolog Max Theiler tarafından geliştirildi ve kendisi daha sonra 1951'de Nobel Ödülü aldı. Virüsü tavuk embriyolarında ardışık geçişlerle zayıflatarak 17D suşunu üretti. Bu canlı, zayıflatılmış aşı, tek dozdan sonra uzun süreli bağışıklık sağlayarak şimdiye kadar oluşturulmuş en etkili aşılardan biri olarak kalmıştır."
 theiler.502.g: "Sivrisineğin hastalığına karşı bir darbe."
 theiler.602.t: "Kızamık Aşısı"
 theiler.602.d: "Sayısız deney, başarısızlık ve testin ardından Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] bir atılım gerçekleştirdi: Kızamık aşısı artık yalnızca bir hayal değil, bir gerçek. Tıbbi ve biyolojik bir devrim!"
 theiler.602.f: "Kızamık aşısı, John Enders ve meslektaşları tarafından virüsü tavuk embriyosu hücrelerinde başarıyla çoğaltmalarının ardından 1963'te lisanslandı. Canlı, zayıflatılmış aşı dünya çapında kızamık ölümlerini büyük ölçüde azalttı. Daha sonra kabakulak ve kızamıkçık aşılarıyla birleştirilerek, günümüzde rutin çocuk aşılamasının temel taşlarından biri olan KKK aşısı oluşturuldu."
 theiler.602.g: "Küçük canavar, sonunda dengini buldu."
 theiler.802.t: "Veba Aşısı"
 theiler.802.d: "Sayısız deney, başarısızlık ve testin ardından Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] bir atılım gerçekleştirdi: Veba aşısı artık yalnızca bir hayal değil, bir gerçek. Tıbbi ve biyolojik bir devrim!"
 theiler.802.f: "İlk veba aşısı, 1897'de Bombay'daki bir salgın sırasında çalışan Waldemar Haffkine tarafından geliştirildi. Enjekte edilebilir bir aşı hazırlamak için ısıyla öldürülmüş Yersinia pestis bakterileri kullandı. Ölüm oranını azaltmasına rağmen koruma sınırlı ve kısa süreliydi. Daha yeni araştırmalar, bakterinin F1 ve V antijenlerini hedefleyen alt birim aşılara odaklanmaktadır."
 theiler.802.g: "Biçerdöverin son saati geldi!"
 theiler.902.t: "Difteri Aşısı"
 theiler.902.d: "Sayısız deney, başarısızlık ve testin ardından Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] bir atılım gerçekleştirdi: Difteri aşısı artık yalnızca bir hayal değil, bir gerçek. Tıbbi ve biyolojik bir devrim!"
 theiler.902.f: "Difteri toksoid aşısı, Fransa'da Gaston Ramon ve İngiltere'de Alexander Glenny'nin formaldehitle işlenmiş difteri toksininin hastalığa neden olmadan bağışıklık oluşturabileceğini keşfetmelerinin ardından 1920'lerde geliştirildi. Genellikle tetanoz ve boğmaca antijenleriyle birleştirilen bu aşı (DTP aşısı), 20. yüzyılın ortalarında çocuk ölümlerini büyük ölçüde azalttı."
 theiler.902.g: "Gecedeki hırıltılar artık sona erdi."
 theiler.1002.t: "Çocuk Felci Aşısı"
 theiler.1002.d: "Sayısız deney, başarısızlık ve testin ardından Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName] bir atılım gerçekleştirdi: Çocuk felci aşısı artık yalnızca bir hayal değil, bir gerçek. Tıbbi ve biyolojik bir devrim!"
 theiler.1002.f: "20. yüzyılda iki etkili çocuk felci aşısı oluşturuldu. Jonas Salk, kimyasal olarak öldürülmüş poliovirüsleri kullanarak 1955'te inaktif çocuk felci aşısını (IPV) geliştirdi. Birkaç yıl sonra Albert Sabin, uygulanması daha kolay ve bağırsak bağışıklığı sağlayan canlı zayıflatılmış suşlara dayalı ağızdan alınan çocuk felci aşısını (OPV) geliştirdi. Her iki aşı da çocuk felcini ortadan kaldırmaya yönelik küresel çabalarda merkezi rol oynadı."
 theiler.1002.g: "Çocukların hayallerini öldüren bu katile merhamet yok!"
