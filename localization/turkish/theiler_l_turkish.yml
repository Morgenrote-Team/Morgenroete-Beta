 theiler_early_pesticides_tech: "Early Pesticides"
 theiler_early_pesticides_tech_desc: "Following the discovery that the wallpaper pigment 'Paris Green' possessed pesticidal properties, the development of chemical pesticides subsequently advanced. This included substances such as lead arsenate, which was significantly more effective against pests."
 theiler_modern_pesticides_tech: "Modern Pesticides"
 theiler_modern_pesticides_tech_desc: "At the turn of the century, the challenges posed by pest infestations intensified steadily due to the rise of monocultures. The response was an industrial agriculture that countered with chemical warfare: calcium arsenate, nicotine sulfite, and sodium arsenite are just a few of these weapons."
 je_theiler_pesticide_development: "Pesticide Development"
 je_theiler_pesticide_development_reason: "With a basic knowledge of insecticides, a biologist, in collaboration with a chemist, can find an effective remedy against a [concept_theiler_pest]. Currently, a pesticide against #V [AddLocalizationIf( Scope.Var('theiler_pesticide_type_var').IsSet , Scope.Var('theiler_pesticide_type_var').GetFlagName)]#! is developed.\n\nIf the biologist or chemist dies during their work, work on the pesticide will be stopped but will continue as soon as both academics are available again."
 je_theiler_pesticide_development_success: "A [concept_theiler_biologist] has worked at least #ORANGE 12 months#! on a new pesticide."
 je_theiler_grafting: "Grafting"
 je_theiler_grafting_reason: "Our biologist [ROOT.Var('theiler_biologist_var').GetCharacter.GetFullName] is working tirelessly on a grafting technique to save European grapevines thanks to American roots."
 je_theiler_grafting_success: "A [concept_theiler_biologist] has worked at least #ORANGE 12 months#! on a new pesticide."
 je_theiler_pest_control: "Pest Control"
 je_theiler_pest_control_reason: "The discovery and production of pesticides and biological methods—ranging from lead arsenate and calcium arsenate to grafting—provide a biologist with the means to combat acute pest outbreaks, provided that the requisite commodity—typically lead—is available on the market. In this manner, a state region can be cleared of the pest within a single month."
 je_theiler_sterile_insect_technique: "Sterile Insect Technique"
 je_theiler_sterile_insect_technique_reason: "With the most modern methods available, the eradication of the dangerous New World screwworm fly might be possible, freeing humans and animals from this plague. A biologist can develop a theory and conduct field experiments to find a suitable solution to this problem.\n\nIf the biologist dies during his work, work on eradicating the parasite will be stopped but will continue as soon as a biologist is available again."
 je_theiler_sterile_insect_technique_success: "A [concept_theiler_biologist] has worked at least #ORANGE 12 months#! to find a method to eredicate cochliomyia."
 theiler.71.t: "Lead Arsenate"
 theiler.71.d: "In collaboration with Dr. [SCOPE.sCharacter('mendelejew_chemist_scope').GetLastName], Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] has developed an effective pesticide whose mass production could revolutionize agriculture. The codling moth has finished its last meal in apples - and the Colorado potato beetle's meal will stick in its throat!"
 theiler.71.f: "Lead arsenate (PbHAsO₄) was developed in 1892 by Melville Thurston Cook in Massachusetts to control the codling moth (Cydia pomonella) in orchards. It was a more stable, plant-friendly alternative to the toxic copper arsenite ('Paris Green'). The powder killed insects as they fed, adhered to leaves and fruit for a long time, and enabled effective control in commercial fruit production for the first time. Lead arsenate remained widely used until the introduction of synthetic pesticides such as DDT, despite being harmful to the environment and human health."
 theiler.71.g: "We literally poison them?"
 theiler.71.tt: "From now on, farmers will use lead arsenate on their farms to get rid of the [GetHarvestConditionType('theiler_potato_beetle_condition').GetName] and the [GetHarvestConditionType('theiler_codling_moth_condition').GetName]."
 theiler.72.t: "Sterile Insect Technique"
 theiler.72.d: "Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] has developed an unorthodox but groundbreaking idea: instead of destroying the parasites with pesticides, a promising method would be to breed sterile males so that the females cannot produce offspring with them. "
 theiler.72.f: "The Sterile Insect Technique (SIT) was developed in the 1950s by Raymond C. Bushland and Edward F. Knipling. Male flies are sterilized with gamma radiation, usually from cobalt-60 or cesium-137 sources. This high-energy radiation destroys the DNA in the germ cells without significantly affecting the animals' vitality or ability to mate. The sterilized males are then released en masse. Since they continue to mate successfully with wild females but fail to produce viable offspring, the population gradually collapses. The method was particularly successful against the New World screwworm fly, whose eradication in North and Central America prevented massive economic and veterinary damage."
 theiler.72.g: "We literally nuke them?"
 theiler.72.tt: "From now on, a biologist—should one be available—will annually clear a state of the [GetHarvestConditionType('theiler_screwworm_fly_condition').GetName]."
 theiler.73.t: "Sodium Arsenite"
 theiler.73.d: "In collaboration with Dr. [SCOPE.sCharacter('mendelejew_chemist_scope').GetLastName], Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] has developed an effective pesticide whose mass production could revolutionize agriculture. The swarms of locusts that brought such terror upon humanity will now themselves learn what true terror means!"
 theiler.73.f: "Sodium arsenite is a highly toxic inorganic salt that served as a primary non-selective pesticide and herbicide during the early 20th century. Characterized by extreme water solubility, it was a staple of chemical control in global agriculture. Primary applications included 'cattle dips' for tick eradication in colonial India and Australia, sheep dipping, and locust control. In the rubber and tea plantations of Asia, it was the standard agent for suppressing undergrowth. While effective, its extreme mammalian toxicity and environmental persistence posed severe health risks to laborers and livestock. Following the mid-20th-century introduction of synthetic organics and increasing awareness of its carcinogenic nature, sodium arsenite was strictly regulated or banned in favor of less hazardous alternatives."
 theiler.73.g: "We literally bait them?"
 theiler.73.tt: "From now on, farmers will use sodium arsenite on their farms to get rid of [GetHarvestConditionType('locust_swarm').GetName]."
 theiler.74.t: "Calcium Arsenate"
 theiler.74.d: "In collaboration with Dr. [SCOPE.sCharacter('mendelejew_chemist_scope').GetLastName], Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] has developed an effective pesticide whose mass production could revolutionize agriculture. Bon appétit, you little boll weevils!"
 theiler.74.f: "Calcium arsenate is a highly toxic, inorganic salt that became a cornerstone of chemical pest control in the early 20th century. Introduced around 1906 as a cheaper, more stable alternative to lead arsenate, it was primarily used as a stomach poison for chewing insects. Its most significant historical application was the massive dusting of cotton fields to combat the boll weevil in the United States and colonial India. Unlike sodium arsenite, its lower water solubility allowed for direct application to foliage with reduced risk of plant scorch. In British India, it was extensively utilized in cotton and potato cultivation, often applied via early aerial crop dusting. However, its extreme environmental persistence, high toxicity to pollinators, and carcinogenic nature led to its replacement by synthetic organic pesticides like DDT in the 1940s."
 theiler.74.g: "We literally turn their stomachs?"
 theiler.74.tt: "From now on, farmers will use calcium arsenate on their farms to get rid of the [GetHarvestConditionType('theiler_boll_weevil_condition').GetName]."
 theiler.75.t: "Grafting"
 theiler.75.d: "Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] studied American grapevines that exhibit resistance to the phylloxera. Through a grafting process, [SCOPE.sCharacter('theiler_biologist_scope').GetSheHe] could fortify Old World grapevines against this pest from the New World."
 theiler.75.f: "Grafting is a horticultural technique that saved global viticulture following the late 19th-century devastation caused by the Great French Wine Blight. The crisis was triggered by Daktulosphaira vitifoliae (Phylloxera), an aphid native to North America that destroys the root systems of European Vitis vinifera vines. By the early 20th century, the 'reconstitution' of vineyards involved grafting susceptible European scions onto resistant American rootstocks (e.g., Vitis riparia or Vitis rupestris). This process creates a chimeric plant where the American roots provide biological immunity to the pest, while the European top maintains the desired grape quality. This method remains the industry standard, as no chemical treatment has proven as effective or sustainable as this genetic-mechanical barrier."
 theiler.75.g: "We literally... Wait a minute—we're not killing the critters?"
 theiler.75.tt: "From now on, farmers will use grafting on their farms to get rid of the [GetHarvestConditionType('theiler_grape_phylloxera_condition').GetName]."
 theiler.76.t: "Nicotine Sulfate"
 theiler.76.d: "In collaboration with Dr. [SCOPE.sCharacter('mendelejew_chemist_scope').GetLastName], Dr. [SCOPE.sCharacter('theiler_biologist_scope').GetLastName] has developed an effective pesticide whose mass production could revolutionize agriculture. The bug has held its final tea hour!"
 theiler.76.f: "Nicotine sulfate is a potent botanical alkaloid derivative that became a crucial insecticide in early 20th-century colonial plantations. Unlike raw tobacco extracts, this standardized sulfate form offered consistent toxicity and lower volatility, making it highly effective against piercing-sucking insects like the tea mosquito bug (Helopeltis theivora). In the tea gardens of Assam and Ceylon, it was deployed as a contact poison that paralyzed the pest's nervous system upon application. Often marketed as 'Black Leaf 40,' it was typically mixed with soap to ensure adhesion to the waxy tea foliage. While favored for its rapid degradation, which minimized long-term residue, its high cost and extreme mammalian toxicity limited its use to high-value harvests until synthetic alternatives emerged in the 1940s."
 theiler.76.g: "We're literally smoking them out?"
 theiler.76.tt: "From now on, farmers will use grafting on their farms to get rid of the [GetHarvestConditionType('theiler_tea_mosquito_condition').GetName]."
 goods_output_tea_mult: "Building @tea! Tea output"
 goods_output_tea_mult_desc: "A bonus or penalty to the amount of @tea! Tea produced by buildings"
 theiler.60.t: "Boil Weevil"
 theiler.60.d: "The boll weevil, which until now fed exclusively on wild Mexican cotton, appears to have changed its habits: it is threatening the entire cotton industry along the Gulf of Mexico!"
 theiler.60.f: "The Boll Weevil (Anthonomus grandis) is a beetle that feeds on cotton buds and flowers. Migrating from Mexico into the United States in the late 19th century, it became one of the most economically destructive pests in agricultural history. Its significance lies in its reproductive cycle: females deposit eggs inside cotton 'squares' (flower buds) and bolls. The hatching larvae consume the internal tissues, preventing fiber development and causing the fruit to drop. By the 1920s, it had decimated the 'King Cotton' economy, driving massive social shifts like the Great Migration and forcing farmers to diversify into crops like peanuts."
 theiler.60.g: "My precious cotton!"
 theiler.60.tt: "From now on the [GetHarvestConditionType('theiler_boll_weevil_condition').GetName] will appear in North America."
 theiler.61.t: "Grape Phylloxera"
 theiler.61.d: "Terrible news for our winemakers: somehow, the phylloxera has managed to cross from America to Europe. It has already begun its destructive work in [SCOPE.sState('theiler_state_scope').GetName]. This is a catastrophe!"
 theiler.61.f: "The Grape Phylloxera (Daktulosphaira vitifoliae) is a microscopic, aphid-like insect that ranks among the most devastating pests in viticultural history. Native to North America, it triggered a global agricultural crisis in the late 19th century, nearly destroying the European wine industry. Its significance as a pest lies in its specialized feeding on grapevine roots. Unlike American species, the European Vitis vinifera lacks natural immunity to the insect's toxic saliva, which causes galls and eventual root necrosis. This results in the total collapse of the plant's nutrient and water uptake."
 theiler.61.g: "My precious wine!"
 theiler.61.tt: "From now on the [GetHarvestConditionType('theiler_grape_phylloxera_condition').GetName] will appear in Europe."
 theiler.62.t: "Tea Mosquito Bug"
 theiler.62.d: "A mysterious die-off of tea plants in Assam has sparked widespread alarm. Apparently, numerous plants have been infested by the tea bug! This pest appears to be spreading unstoppably!"
 theiler.62.f: "The Tea Mosquito Bug (genus Helopeltis) is a highly destructive hemipteran pest belonging to the Miridae family. Despite its name, it is a true bug, not a mosquito, though its elongated legs and antennae give it a similar silhouette. It is a primary threat to various plantation crops, most notably tea, cocoa, and cashew. The pest's significance lies in its specialized feeding mechanism: using piercing-sucking mouthparts, it targets succulent young shoots and leaves. While feeding, it injects toxic saliva that causes rapid tissue necrosis, appearing as characteristic sunken, brownish-black lesions. Due to its high mobility and rapid reproduction, it is a major challenge for agricultural productivity in tropical regions."
 theiler.62.g: "My precious tea!"
 theiler.62.tt: "From now on the [GetHarvestConditionType('theiler_tea_mosquito_condition').GetName] will appear in South and East Asia."
 theiler.63.t: "Potato Beetles in [SCOPE.sState('theiler_state_scope').GetName]!"
 theiler.63.d: "Naturalists and biologists today presented a report that is worrying farmers and traders alike. The infamous Colorado potato beetle, native to North America, has been discovered in our fields for the first time. If we don't stop it, it may infest whole Europe!"
 theiler.63.f: "The Colorado potato beetle was discovered in the 1820s and began its predatory advance from the Rocky Mountains to the Atlantic coast as early as the late 1850s. In doing so, it covered approximately 140 kilometers annually and became a scourge for American farmers. The beetle's attempts to cross over to Europe failed repeatedly throughout the 1870s and beyond. It did not succeed in making the crossing until the 1920s—shortly after the First World War had overtaxed the resources of the Old Continent."
 theiler.63.g: "My precious potatos!"
 theiler.63.tt: "From now on the [GetHarvestConditionType('theiler_potato_beetle_condition').GetName] will appear in North America."
 theiler.64.t: "Colorado Potato Beetle"
 theiler.64.d: "In [SCOPE.sState('theiler_state_scope').GetName], a new pest has entered the scene: the Colorado potato beetle, which until now fed on buffalo bur, has—due to its contact with American agriculture—developed a voracious appetite for potatoes. Apparently, nothing can stop this voracious insect!"
 theiler.64.f: "The Colorado potato beetle (Leptinotarsa decemlineata) is a notorious agricultural pest within the Chrysomelidae family. Easily identified by its yellowish-orange exoskeleton and ten black longitudinal stripes, this beetle is a primary threat to nightshade crops, especially potatoes. Its status as a major pest stems from its destructive feeding habits; both adults and larvae are voracious defoliators, capable of stripping entire plants and causing total yield loss. Beyond physical damage, the species is globally significant due to its rapid adaptation and high level of resistance to chemical insecticides. Originally native to North America, it became a cosmopolitan concern, significantly impacting global food security.\n\n #p The chance of halting a pest invasion is improved by the following factors: Biologist, Chemist, and Pesticide Technologies.#!"
 theiler.65.t: "Codling Moths Runs Wild!"
 theiler.65.d: "The codling moth has expanded its home range: from a neighboring region it has also spread into [SCOPE.sState('theiler_state_scope').GetName] to infest the orchards there. It looks as though nothing can stop this pest on its march across all of North America!"
 theiler.65.f: "The codling moth (Cydia pomonella) originates from Eurasia and spread with apple cultivation in the 19th century across Central Europe, Northern Italy, the Balkans, Hungary, parts of Russia west of the Urals, North America, and Australia. Nordic, very hot, or dry regions were largely spared. In the 20th century, it reached almost all temperate apple-growing regions worldwide, including Scandinavia, the Baltic States, and South America, and became one of the most significant pests in orchards."
 theiler.65.g: "Mobilize every resource to prevent the pest from spreading!"
 theiler.65.h: "Our scientists will find a solution."
 theiler.65.i: "We will have to get used to living with this pest."
 theiler.66.t: "Codling Moths in [SCOPE.sState('theiler_state_scope').GetName]!"
 theiler.66.d: "Naturalists and biologists today presented a report that is worrying farmers and traders alike. The infamous codling moth, native to Europe and Western Asia, has been discovered in our orchards for the first time. If we don't stop it, it may infest whole Oceania!"
 theiler.66.f: "The codling moth (Cydia pomonella) originates from Eurasia and spread with apple cultivation in the 19th century across Central Europe, Northern Italy, the Balkans, Hungary, parts of Russia west of the Urals, North America, and Australia. Nordic, very hot, or dry regions were largely spared. In the 20th century, it reached almost all temperate apple-growing regions worldwide, including Scandinavia, the Baltic States, and South America, and became one of the most significant pests in orchards.\n\n #p The chance of halting a pest invasion is improved by the following factors: Biologist, Chemist, and Pesticide Technologies.#!"
 theiler.67.d: "Naturalists and biologists today presented a report that is worrying farmers and traders alike. The infamous codling moth, native to Europe and Western Asia, has been discovered in our orchards for the first time.If we don't stop it, it may infest whole South Africa!"
 theiler.68.d: "Naturalists and biologists today presented a report that is worrying farmers and traders alike. The infamous codling moth, native to Europe and Western Asia, has been discovered in our orchards for the first time. If we don't stop it, it may infest whole South America!"
 theiler.69.t: "Pest Prevented"
 theiler.69.d: "Pest control in [SCOPE.sState('theiler_state_scope').GetName] was a resounding success. The population views the containment efforts with approval and attributes them to the government's vigorous work. For at least a few years, we are safe from a new invasion."
 theiler.69.f: "Following the successful eradication of a pest infestation, the affected region remains secure for ten years. Afterward, the pest may once again attempt to conquer new territory within the region—potentially via another country that possesses a port and its preferred food source."
 theiler.69.g: "Praise the government!"
 theiler.70.t: "Pest Invasion"
 theiler.70.d: "Efforts to contain the newly introduced pest in [SCOPE.sState('theiler_state_scope').GetName] have failed completely. Apparently, nothing can halt its triumphant advance across the entire country—and beyond. Our reputation is in tatters, and the public blames the government for this colossal failure."
 theiler.70.f: "Once a pest has successfully invaded, there is no stopping it: until an effective countermeasure is invented, it will—just as in its native range—regularly wreak havoc."
 theiler.70.g: "Boo the government!"
