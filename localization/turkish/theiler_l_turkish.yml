 theiler.41.strychnine: "Strychnos nux-vomica, Hindistan ve Güneydoğu Asya'ya özgü tropikal bir ağaçtır. Tohumları, ikisi de oldukça zehirli olan striknin ve brusin alkaloitlerini içerir. Striknin sinir sistemini etkileyerek şiddetli kas kasılmalarına ve potansiyel olarak ölüme yol açabilir. Zehirli olmasına rağmen, küçük ve kontrollü dozlarda özleri tarih boyunca uyarıcı olarak ve sindirim veya sinir sistemi bozukluklarının tedavisinde kullanılmıştır."
 theiler.41.emetine: "Carapichea ipecacuanha, özellikle Brezilya olmak üzere Güney Amerika'ya özgü tropikal bir bitkidir. Kökleri, kusmayı tetikleyen ve parazitlere karşı etkili olan emetin ve sefaelin alkaloitlerini içerir. İpeka kökü geleneksel olarak zehirlenmeleri tedavi etmek için kusturucu ve öksürük şuruplarında balgam söktürücü olarak kullanılmıştır."
 theiler.41.atropine: "Atropa belladonna, ölümcül itüzümü olarak da bilinir ve Avrupa, Kuzey Afrika ile Batı Asya'ya özgü çok yıllık bir bitkidir. Atropin, skopolamin ve hiyosiyamin gibi zehirli alkaloitler içerir. Bu maddeler asetilkolin reseptörlerini engelleyerek sinir sistemini etkiler. Tarih boyunca sakinleştirici, ağrı kesici ve göz bebeklerini genişletici olarak kullanılmıştır. Modern tıpta saflaştırılmış atropin, göz hastalıklarında ve bradikardi veya organofosfat zehirlenmelerinin tedavisinde kullanılır."
 theiler.41.aloin: "Aloe vera, Kuzey Afrika ve Arap Yarımadası'na özgü etli bir bitkidir. Kalın yaprakları, yatıştırıcı ve nemlendirici özelliklere sahip polisakkaritler, vitaminler ve enzimler açısından zengin bir jel içerir. Jel, yanıklar, yaralar ve cilt tahrişlerinin tedavisinde kozmetik ve tıp alanında yaygın şekilde kullanılır. Yaprağın iç kısmındaki kurutulmuş lateks, güçlü müshil etkileri olan aloin adlı bileşiği içerir."
 theiler.41.digitoxin: "Digitalis purpurea veya yüksük otu, Avrupa'ya özgü iki yıllık bir bitkidir. Yaprakları, kalp kasılmalarını güçlendiren ve kalp ritmini düzenleyen digoksin ve digitoksin gibi kardiyak glikozitler içerir. Geleneksel olarak kalp yetmezliği ve ritim bozukluklarının tedavisinde kullanılmıştır. Saflaştırılmış kardiyak glikozitler kalp hastalıklarında dikkatle dozlanarak kullanılırken, ham bitki ciddi zehirlenme riski nedeniyle kaçınılır."
 theiler.41.quinine: "Cinchona pubescens, özellikle And Dağları bölgesi olmak üzere Güney Amerika'ya özgü bir ağaçtır. Kabuğu, güçlü sıtma karşıtı özelliklere sahip kinin ve diğer alkaloitleri içerir. Geleneksel olarak kabuğu ateş ve sıtma tedavisinde kullanılmıştır. Günümüzde bile kinin ve türevleri sıtmanın yönetiminde önemli ilaçlardır. Ağaç ayrıca tıbbi kabuğu için tropikal bölgelerde yetiştirilmektedir."
 theiler.41.thymol: "Thymus vulgaris veya yaygın kekik, Akdeniz'e özgü küçük çok yıllık bir bitkidir. Yaprakları ve yağı, antimikrobiyal, antioksidan ve iltihap karşıtı özelliklere sahip timol, karvakrol ve diğer uçucu yağları içerir. Geleneksel olarak solunum yolu enfeksiyonları, öksürük ve sindirim sorunlarının tedavisinde kullanılmıştır. Bitkisel tıp, aromaterapi ve gıdalarda doğal koruyucu veya aroma verici olarak yaygın şekilde kullanılır."
 theiler.41.pilocarpine: "Pilocarpus pennatifolius, Brezilya'ya özgü tropikal bir çalıdır. Yaprakları, tükürük ve ter bezlerini uyaran pilokarpin adlı alkaloidi içerir. Geleneksel olarak ağız kuruluğu ve göz rahatsızlıklarının tedavisinde kullanılmıştır. Modern tıpta pilokarpin, göz içi basıncını azaltarak glokom tedavisinde ve radyasyon veya ilaçların neden olduğu kserostomiyi (ağız kuruluğu) gidermede kullanılır. Bitki esas olarak farmakolojik olarak aktif alkaloitleri nedeniyle değerlidir."
 theiler.41.ephedrine: "Ephedra sinica veya ma huang, Çin ve Orta Asya'ya özgü bir çalıdır. Gövdeleri, sinir sistemini uyaran ve bronşları genişleten efedrin ile psödoefedrin alkaloitlerini içerir. Çin tıbbında astım, bronşit ve burun tıkanıklığını tedavi etmek için kullanılmıştır. Yüksek tansiyon, kalp sorunları ve diğer yan etki riskleri nedeniyle kullanımı sınırlandırılmıştır."
 theiler.41.strophantine: "Strophanthus gratus, Batı Afrika'ya özgü tırmanıcı bir bitkidir. Tohumları, kalp kasılmalarını güçlü şekilde etkileyen ouabain gibi kardiyak glikozitler içerir. Geleneksel olarak özleri ok zehiri olarak ve küçük dozlarda kalp rahatsızlıklarının tedavisinde kullanılmıştır. Ouabain, kalp yetmezliği ve ritim bozuklukları üzerine yapılan çalışmalarda incelenmiştir."
