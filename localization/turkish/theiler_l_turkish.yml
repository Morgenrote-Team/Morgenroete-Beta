 je_theiler_improve_agriculture_project_reason: "Sizin [concept_theiler_biologist] Dr. [ROOT.Var('theiler_biologist_var').GetCharacter.GetLastName], [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName] bölgesindeki [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] üretimini geliştirmeye odaklanmıştır.\n$mr_divider_for_je$\nProje her ay ilerleme kazanacaktır. İlerleme 24'e ulaştığında mevcut bina yeni bir değiştirici kazanacaktır. Bu proje için seçilen tüm binalar değiştiricilere sahip olduğunda proje sona erer.\n\nToplamda 3 değiştirici bulunmaktadır. Her yeni değiştiricinin tamamlanması için ilerlemenin yeniden doldurulması gerekir.\n\nTamamlanan her bina bazı [Concept('concept_theiler_microorganism','$concept_theiler_microorganisms$')] sağlar. Ayrıca bir binanın geliştirilmesi tamamlandığında Biyoloğunuz $ito_botanist$ veya $ito_zoologist$ özelliğini kazanabilir.\n$mr_divider_for_je$\nMevcut Bina: [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] - [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_theiler_improve_agriculture_project_modifier_1_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_theiler_improve_agriculture_project_modifier_2_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_theiler_improve_agriculture_project_modifier_3_type')]\n\nKalan Toplam Bina Sayısı (mevcut bina hariç): [JournalEntry.MakeScope.Var('mr_number_of_remaining_list_entries_var').GetValue|V0]\nProjenin sağladığı $concept_theiler_microorganisms$: [JournalEntry.MakeScope.ScriptValue('theiler_microorganisms_from_agriculture_project_value')|+0] @theiler_microorganisms_texticon!\n\nMevcut aylık ilerleme: #underline #tooltip:[GetRawTextTooltipTag('theiler_monthly_biologist_improvement_progress_var_tt')] [GetPlayer.MakeScope.ScriptValue('theiler_improve_agriculture_project_progress_value')|+2] #!#!"
