 je_curie_magnetic_observation: "地磁观测"
 je_curie_magnetic_observation_reason: "第一座地球物理观测站是由约翰·卡尔·弗里德里希·高斯在哥廷根建立的，他还在1832年时为其加造了一台磁力仪。高斯意识到，为了定位波动和更精确的测量静磁场，他必须在全球范围内同时进行测量。为此，他和威廉·爱德华·韦伯、亚历山大·冯·洪堡三人于1836年建立了哥廷根磁学协会。为了使得遍布全球各地的测量站协同测量地球磁场的波动，多达50座天文台参与了该项目，其中：欧洲35座、亚洲6座、北美洲3座、大洋洲4座；包括英国皇家学会在内都给在哥廷根的他们提供了数据，并由高斯和韦伯进行科学处理分析。"
 je_curie_magnetic_observation_goal: "收集#G 100#!@curie_magnetic_data_var![concept_curie_magnetic_data]。这将依靠国际努力，磁学协会的每一个成员都会作出贡献。"
 je_curie_magnetic_atlas: "地磁图集"
 je_curie_magnetic_atlas_reason: "19世纪30年代，高斯与韦伯创立了哥廷根地磁协会。他们建立了一个遍布全球的观测站网络，按照统一的标准化程序，同步测量地球磁场的强度和方向。高斯发展了用于描述地球磁场的位势理论。借助这一数学方法，他能够计算出整个地球表面的磁场分布，甚至包括那些尚无直接观测数据的地区。"
 je_curie_magnetic_atlas_progress_complete_tt: "进度已达#V 24#!。"
