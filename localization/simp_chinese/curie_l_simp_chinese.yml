 pm_curie_nuclear_reactor: "核反应堆"
 curie_nuclear_reactor_tech: "核反应堆"
 curie_nuclear_reactor_tech_desc: "可控核裂变的探索之路始于1942年的芝加哥1号堆，这是世界上第一座人造核反应堆，在体育场看台下方展示了自持链式反应。在此基础上，田纳西州的X-10石墨反应堆作为中试工厂相继建成，用于测试钚的大规模生产工艺以及强辐射环境下的操作能力。这一时代的巅峰之作当属汉福德B反应堆，这是世界上第一座全规模生产反应堆，它的建成标志着核能工业应用真正成为了现实。"
 curie_the_bomb_tech: "核弹"
 curie_the_bomb_tech_desc: "“现在，我变成了死神，世界的毁灭者。”"
 curie_nuclear_fission_tech: "核裂变"
 curie_nuclear_fission_tech_desc: "20世纪30年代末，研究人员首次成功利用中子轰击的方法分裂重原子核，从而开启了物质内部此前难以想象的能量源。这一科学突破标志着物理学从理论研究迈向对宇宙基本作用力的实际掌控。"
 curie_facility_can_construct_only_facility_tt: "我们尚未拥有核研究设施。"
 curie_rocket_science_tech: "火箭科学"
 curie_rocket_science_tech_desc: "20世纪初，火箭科学从科幻领域转变为一套严谨的理论框架，这一转变主要由富有远见的俄罗斯人康斯坦丁·齐奥尔科夫斯基开创。在他1903年出版的开创性著作中，齐奥尔科夫斯基推导出了火箭运动的基本方程，证明借助多级火箭与液体推进剂，太空旅行在数学上是完全可行的。特兰西瓦尼亚裔德国物理学家赫尔曼·奥伯特于20世纪20年代独立发展了航天学的基本原理，为后来第一代实践型火箭工程师提供了工程蓝图。"
 curie_modern_rockets_tech: "现代火箭"
 curie_modern_rockets_tech_desc: "罗伯特·戈达德通过发射首枚液体燃料火箭并开发如陀螺仪稳定等关键系统，将火箭科学带入了实践时代。在德国，研究通过太空旅行协会得到加强，年轻的沃纳·冯·布劳恩开始完善大规模推进所需的工程技术。这一时期最终见证了该技术从私人实验转向大规模国家资助项目的转变，并最终研制出了首批能够到达太空边缘的火箭。"
