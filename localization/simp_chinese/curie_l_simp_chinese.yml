 curie.503.t: "全国性的气象站网络"
 curie.503.d: "[SCOPE.sCharacter('curie_physicist_scope').GetLastName]博士已经实现了[SCOPE.sCharacter('curie_physicist_scope').GetHerHis]的目标。得益于覆盖全国的气象站网络，无论是在灾害管理还是农业生产方面，我们如今都已做好应对各种气象灾害的预防准备。\n\n改进建筑总数：[GetPlayer.MakeScope.Var('mr_num_improved_meteorology_buildings_var').GetValue|V0]"
 curie.503.f: "六月晴朗的七日时光，虽短暂，却足以让情愫绽放。\n你身着春日里穿过的夏裙，裙上的繁花依旧盛开。\n我们曾那样心有灵犀，笑声交织在一起，\n可你却突然给了我当头一棒：\n「我们相识太久，早已不适合谈情说爱。」"
 curie.503.g: "太阳明天还会照常升起吗？"
 curie.21.t: "Mass-Energy Equivalence"
 curie.21.d: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] discovered a law of nature using a simple equation. It states that the mass m and the rest energy E of an object are proportional to each other. The formula is:\nE=mc²"
 curie.21.f: "Published by Albert Einstein in 1905 during his 'Annus Mirabilis,' mass-energy equivalence (E=mc²) emerged from his special theory of relativity. Building on nineteenth-century developments in electrodynamics and conservation principles, Einstein demonstrated that mass and energy are interchangeable aspects of the same physical reality, revolutionizing modern physics."
 curie.21.g: "[SCOPE.sCharacter('curie_physicist_scope').GetSheHe|U] is a genius!"
 curie.22.t: "An Essay on the Winds and Currents of the Ocean"
 curie.22.d: "In an essay, [SCOPE.sCharacter('curie_physicist_scope').GetFullName] presented the first plausible explanation for wind circulation in the Earth's mid-latitudes. The work is already becoming a standard reference in meteorology!"
 curie.22.f: "Published in 1856 by American meteorologist William Ferrel, 'An Essay on the Winds and the Currents of the Ocean' laid foundational principles for geophysical fluid dynamics. Expanding on Hadley's circulation model, Ferrel mathematically demonstrated how the Earth's rotation deflects moving air and water—introducing the concept later known as the Coriolis effect. His work successfully explained global wind belts and mid-latitude atmospheric circulation patterns, revolutionizing meteorology and oceanography."
 curie.22.g: "So winds aren't just a coincidence?"