 curie_add_discovered_experiment_effect_tt: "[GetPlayer.GetName]开展了#V [SCOPE.sCharacter('curie_physicist_scope').GetLastName]实验#!。"
 curie_physics_experiment_failure_modifier: "物理实验：失败"
 curie_physics_experiment_successful_modifier: "物理实验：成功！"
 curie.401.t: "物理实验"
 curie.401.d: "[ROOT.Var('curie_physicist_var').GetCharacter.GetLastName]博士正将[ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis]的实验推进到一个新阶段。目前尚不清楚，[ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe]究竟会采取谨慎稳妥的研究方法，还是大胆革新的研究方法。"
 curie.401.f: "在物理学实验进行一段时间后，物理学家便会尝试尽快完成实验。至于能否顺利成功，则完全是另一回事。\n尤其是拥有#G $cautious$#!和#G $meticulous$#!角色特质的物理学家，其实验取得良好结果的概率较高。而拥有#R $wrathful$#!、#R $reckless$#!或#R $senile$#!特质的物理学家，则面临着研究以灾难告终的较高风险。"
 curie.401.g: "稳妥为上。"
 curie.401.h: "敢为天下先。"
 curie.402.t: "具有历史意义的实验"
 curie.402.d_1: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName]让光线穿过两条狭缝，投射到屏幕上。由此产生的明暗相间的干涉条纹证明了光的波动性，成功挑战了艾萨克·牛顿占主导地位的光微粒说。"
 curie.402.d_2: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName]将一根通电导线置于磁罗盘上方。磁针发生偏转，证明电流能够产生磁场，揭示了电与磁之间的内在联系。"
 curie.402.d_3: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName]利用下落的重物驱动浸没于隔热容器内水中的桨轮旋转。水温随之升高，表明机械功能够转化为热，为能量守恒定律奠定了实验基础。"
 curie.402.d_4: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName]利用行驶列车上的小号演奏者，对多普勒提出的理论进行了实验验证。列车经过观测者时所产生的音调变化证实了多普勒效应，表明声源与观测者之间的相对运动会改变观测到的声波频率。"
 curie.402.d_5: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName]利用一根长绳悬挂重物，构建了一套大型单摆装置。实验观察到，单摆的振动平面相对于地面逐渐发生旋转。这一现象无需借助天体观测，便为地球自转提供了直观的实验证据。"
 curie.402.d_6: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName]利用旋转齿轮使光束通过齿隙，射向远处的反射镜，再沿原路径返回。通过测定返回光束恰好被旋转齿轮遮挡时的转速，首次在地面实验中测定了光速。"
 curie.402.d_7: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName]利用莱顿瓶和检流计测量电荷，并确定了静电单位制与电磁单位制之间的换算关系。实验所得的单位比值与光速相吻合，为光的电磁本质提供了重要依据。"
 curie.402.d_8: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName]利用一台高灵敏度干涉仪，将光束分离为相互正交的传播路径。由于未能观测到预期的干涉条纹移动，该实验否定了发光以太假说，为狭义相对论的发展奠定了坚实基础。"
 curie.402.d_9: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName]利用火花隙振荡电路产生并探测不可见的无线电波。实验表明，这些电磁波具有与光相同的传播速度和波动特性，从而验证了麦克斯韦的电磁理论，并为无线通信技术的诞生奠定了基础。"
 curie.402.d_10: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName]利用真空放电管中的电场和磁场使阴极射线发生偏转。通过测定阴极射线粒子的荷质比，发现了带负电的亚原子粒子——电子，从而推翻了原子不可再分的传统观念。"
 curie.402.d_11: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName]将带电油滴置于两块金属极板之间，利用电场力与重力的平衡使油滴保持悬浮。通过测量油滴的运动状态及其所带电荷，证实了电荷以基本电荷量为单位呈现量子化特征，并精确测定了电子的电荷量。"
 curie.402.d_12: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName]利用α粒子轰击极薄的金箔，观察其散射行为。实验中出现的异常大角度偏转表明，原子的绝大部分质量和全部正电荷集中于体积极小的中心原子核，从而推翻了原先认为原子内部物质均匀分布的模型。"
 curie.402.d_13: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName]使经过加速的电子穿过汞蒸气，并测量电子流随加速电压的变化。实验发现，电流在特定电压下呈周期性下降，证明原子只能以离散的能量量子吸收能量，从而为玻尔原子模型中的能级量子化理论提供了实验证据。"
 curie.402.d_14: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName]在日全食期间拍摄太阳附近恒星的影像，并通过测定恒星视位置的偏移，验证了太阳引力场对星光传播路径的弯曲作用。这一观测为广义相对论提供了首批重要的实验证据。"
 curie.402.d_15: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName]使银原子束通过非均匀磁场。实验发现，原子束并未形成连续分布，而是分裂为两条彼此分离的轨迹。这一结果证实了空间量子化现象，并为揭示粒子的内禀量子自旋提供了关键依据。"
 curie.402.f_1: "1801年，托马斯·杨开展了双缝干涉实验，以探究光的物理本质。他让一束光穿过两条相距很近的狭缝，投射到暗处的屏幕上。屏幕上并未出现两条彼此分离的亮线，而是由于光波相互叠加，形成了明暗交替的干涉条纹。这一现象表明，光能够像水波一样发生相长干涉与相消干涉。实验为光的波动说提供了有力证据，直接挑战了艾萨克·牛顿所倡导的光微粒说。"
 curie.402.f_2: "1820年，丹麦物理学家汉斯·克里斯蒂安·奥斯特发现了电与磁之间的基本联系。在一次课堂演示中，他将一根连接电池的直导线置于磁罗盘上方，并让电流通过导线。每当电路接通，原本指向南北方向的磁针便会发生偏转；当电流方向反转时，磁针也会向相反方向偏转。这一出人意料的发现证明，电流能够产生磁场，揭示了此前被视为两个独立研究领域的电学与磁学之间的联系，为电磁学的建立奠定了基础。"
 curie.402.f_3: "1843年，詹姆斯·普雷斯科特·焦耳利用专门设计的桨轮装置，研究机械功向热能的转化。下落的重物带动浸没在隔热容器内水中的黄铜桨轮旋转。重力对系统做功，而桨轮与水之间的摩擦使水温发生可测量的上升。通过比较重物损失的重力势能与水获得的热量，焦耳计算出了机械功与热量之间的恒定换算关系。这项实验表明，热是一种能量形式，为能量守恒定律的确立提供了重要依据。"
 curie.402.f_4: "1845年，荷兰气象学家克里斯托夫·白贝罗开展了一项实验，以验证克里斯蒂安·多普勒于1842年提出的波动频率变化理论。他安排小号演奏者乘坐敞篷列车车厢，同时让地面上的乐手奏出音高恒定的参考音。随着机车以不同速度驶过，车上的小号手持续吹奏同一个音符。站台上的听众清楚地听到，列车驶近时音调升高，驶离时音调降低。这项实验从经验上证实了声波的多普勒效应。此后，这一原理在天文学中成为测量恒星运动的重要工具。"
 curie.402.f_5: "1851年，法国物理学家莱昂·傅科在巴黎先贤祠悬挂了一座巨大的摆，以展示地球的自转。他用一根67米长的钢丝悬挂起重达28千克的黄铜球，使其能够在任意竖直平面内自由摆动数小时。随着摆锤往复运动，其摆动平面相对于地面缓慢地顺时针旋转。由于摆动平面在空间中近似保持原有方向，实际发生转动的是摆锤下方的地面。这项实验首次以简明直观的地面实验方式证明了地球绕自身轴线旋转。"
 curie.402.f_6: "1849年，伊波利特·斐索首次成功地在地面上测量了光速。他让一束强光穿过高速旋转的齿轮齿隙，射向8.6千米外的一面反射镜。反射光随后沿原路返回。斐索逐渐提高齿轮的转速，直到返回的光线恰好被相邻轮齿完全遮挡。根据已知的传播距离和齿轮转速，他计算出了光线往返所需的时间，进而得出光速约为每秒315000千米。这项实验表明，无须依赖天文观测，也能在地面上测定光的传播速度。"
 curie.402.f_7: "1856年，威廉·韦伯与鲁道夫·科尔劳施测量了电荷在静电单位制与电磁单位制之间的换算关系。他们首先利用大容量莱顿瓶测定所积累的静电荷量，再使莱顿瓶通过冲击检流计放电，以测量电流产生的磁效应。令人惊讶的是，由两种电学单位之间的关系得到的特征速度约为每秒310000千米，与光速极为接近。这一发现为詹姆斯·克拉克·麦克斯韦提出光是一种电磁波的理论奠定了重要的实验基础。"
 curie.402.f_8: "1887年，阿尔伯特·迈克耳孙与爱德华·莫雷试图探测地球相对于假想的光以太的运动。他们制造了一台高灵敏度光学干涉仪，将仪器安装在漂浮于水银中的沉重石板上，以减少振动干扰。分束器将光分成两束相互垂直的光线，经反射镜反射后重新汇合，形成干涉条纹。按照静止以太假说，地球的轨道运动应使两个方向上的光传播时间产生差异，从而在旋转仪器时引起干涉条纹移动。然而，实验并未发现预期的条纹移动。这一零结果对静止以太假说构成了重大挑战，并成为后来狭义相对论发展的重要实验背景。"
 curie.402.f_9: "1887年，海因里希·赫兹制造了一套火花间隙发射装置，以检验詹姆斯·克拉克·麦克斯韦的电磁理论。初级火花间隙中的高压放电产生了不可见的电磁辐射。这些电磁波穿过房间，在作为接收器的次级金属环间隙中激发出微小火花。赫兹进一步证明，这些波以接近光速的速度传播，并像光波一样表现出反射、折射和偏振等性质。实验确证了无线电波的存在，验证了麦克斯韦的电磁理论，并为现代无线电通信奠定了基础。"
 curie.402.f_10: "1897年，J·J·汤姆孙在高度抽真空的玻璃管中研究阴极射线。他对射线施加电场和磁场，观察其偏转，并测定了组成射线的粒子的荷质比。汤姆孙发现，无论阴极采用何种材料，阴极射线都由带负电的粒子组成，其质量不足氢原子质量的千分之一。这一发现证明，原子并非不可分割的实心球体，而是具有内部结构。电子由此成为首个被确认的亚原子粒子，彻底改变了人们对原子结构的认识。"
 curie.402.f_11: "1909年，罗伯特·安德鲁斯·密立根利用装有金属电极板的密闭实验装置，测量电子的电荷量。他将细小的油滴喷入实验室中的观察腔，并利用X射线使其带电。通过调节电极之间的电压，密立根使向上的静电力与重力相平衡，从而让带电油滴悬浮在空中。对大量油滴的测量表明，所测得的电荷量均为某一基本电荷量的整数倍。这项实验有力地证明了电荷的量子化，并精确测定了基本电荷量。"
 curie.402.f_12: "1911年，欧内斯特·卢瑟福研究了带正电的α粒子穿过薄金箔时的散射现象。实验装置利用金箔周围的硫化锌荧光屏探测散射粒子。虽然绝大多数α粒子径直穿过金箔，但仍有少量粒子发生大角度偏转，甚至有约八千分之一的粒子几乎沿原路返回。这一惊人结果推翻了汤姆孙提出的正电荷均匀分布的“葡萄干布丁模型”。卢瑟福据此推断，原子的绝大部分质量和正电荷集中于一个极其微小而致密的中心区域——原子核，而原子内部的其余部分大多是空旷的空间。"
 curie.402.f_13: "1914年，詹姆斯·弗兰克与古斯塔夫·赫兹开展的实验，为尼尔斯·玻尔提出的原子量子模型提供了直接证据。他们让电子在充满汞蒸气的玻璃管中加速运动，并测量到达收集电极的电流。随着加速电压升高，电子电流起初逐渐增大，却在相隔约4.9伏的特定电压处反复出现骤降。这表明，电子与汞原子碰撞时，只能以离散的能量份额向原子传递能量。周期性的电流下降证实了原子只能吸收特定大小的能量，为原子能级量子化提供了早期的重要实验证据。"
 curie.402.f_14: "1919年5月的日全食期间，亚瑟·爱丁顿参与组织了前往普林西比岛和巴西的观测考察，以检验阿尔伯特·爱因斯坦的广义相对论。月球遮蔽太阳的耀眼光芒后，天文学家得以拍摄太阳边缘附近的恒星。将这些照片与夜间拍摄的参考星图进行比较后，研究人员发现，经过太阳附近的星光因引力作用而发生了微小偏折，使恒星的视位置略微向外移动。测得的光线偏折程度支持爱因斯坦的理论预测，而非牛顿理论给出的相应数值，成为广义相对论最早获得广泛关注的观测验证之一。"
 curie.402.f_15: "1922年，奥托·施特恩与瓦尔特·盖拉赫让一束汽化的银原子穿过非均匀磁场，最终落在玻璃探测板上。按照经典物理学的预期，原子磁矩的取向应呈连续分布，因此银原子的沉积痕迹也应形成一条平滑而连续的带状区域。然而，实验中的原子束却清晰地分裂为两个独立部分，在探测板上留下两条彼此分离的痕迹。这一出人意料的现象证明了空间量子化，并为后来发现和理解电子的内禀角动量——自旋——提供了早期的重要证据，深刻影响了量子力学的发展。"
 curie.402.g: "尤里卡！"
 curie.403.t: "成功的实验"
 curie.403.d: "[ROOT.Var('curie_physicist_var').GetCharacter.GetLastName]博士今日欣然宣布，[ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis]的实验完全按照预定计划顺利完成。尽管这并非一项震惊世界的发现，但它仍然显著丰富了国际物理学界的知识积累。"
 curie.403.f: "“只要不违背自然法则，再不可思议的事物也可能真实存在。”\n——迈克尔·法拉第"
 curie.403.g: "好。"
 curie.404.t: "物理实验失败！"
 curie.404.d: "[ROOT.Var('curie_physicist_var').GetCharacter.GetLastName]博士的实验以大失败告终，现在该清理残局了。"
 curie.404.f: "“对自身无知有着清醒而透彻的认识，是科学每一次真正进步的先声。”\n——詹姆斯·克拉克·麦克斯韦"
 curie.404.g: "轰隆！"
