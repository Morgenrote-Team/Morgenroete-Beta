 je_curie_agricultural_weather_service: "农业气象服务"
 je_curie_agricultural_weather_service_reason: "[ROOT.Var('curie_physicist_var').GetCharacter.GetLastName]博士已将[ROOT.Var('curie_physicist_var').GetCharacter.GetHerselfHimself]的全部精力投入农业气象学研究。[ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis]的天气报告着重提供对本国农民尤为重要的气象预报。无论是干旱、风暴还是洪水，由于农民能够提前收到预警，当地农业部门便可以做好防范准备，从而减轻气象和气候条件造成的不利影响。\n\n该[concept_modifier]的强度在很大程度上取决于[concept_curie_meteorological_physicist]的经验。"
 je_curie_marine_weather_service: "航运天气预报"
 je_curie_marine_weather_service_reason: "[ROOT.Var('curie_physicist_var').GetCharacter.GetLastName]博士已向海军部承诺，将致力于提高海上航行的安全性——尤其是舰队的航行安全——并预测海上可能出现的风暴及其他危险。这项工作很可能在战争时期发挥尤为重要的作用。\n\n该[concept_modifier]的强度在很大程度上取决于[concept_curie_meteorological_physicist]的经验。"
 curie.501.t: "天气预报工作结束"
 curie.501.d: "过去几年里，[ROOT.Var('curie_physicist_var').GetCharacter.GetLastName]博士一直代表国家，主要负责向公众提供天气预报。如今，[ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe|U]终于要重返科学研究领域了。[ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe|U]渐渐觉得，自己实在有些受不了公众的过度关注。"
 curie.501.f: "等我们的气象学家终于有时间重新摆弄[ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis]那些令人摸不着头脑的仪器，继续开展[ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis]那些莫名其妙的研究，[ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe]很快就会恢复往日的模样。天底下究竟有谁会把这门科学当回事啊？"
 curie.501.a: "他可是天气先生！"
 curie.501.b: "她可是天气女士！"
