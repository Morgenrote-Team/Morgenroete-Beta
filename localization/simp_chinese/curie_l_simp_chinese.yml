 curie.521.d: "[ROOT.Var('curie_physicist_var').GetCharacter.GetLastName]博士简直不敢相信[ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis]的眼睛：在[SCOPE.sState('curie_cloud_state').GetCityHubName]散步时，[ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe]突然发现天空中出现了银色的丝缕。难道这是一种迄今为止尚不为人知的云？"
 curie.522.d: "在极地考察期间，齐柏林飞艇的机组人员有了一项非同寻常的发现：天空中突然出现了彩虹般绚丽多彩的云朵！它们看起来就像是悬挂在天空中的珍珠母贝！"
