 curie_mathematics_tech: "数学"
 curie_mathematics_tech_desc: "数学是一门研究数、量与形的科学。在人类不断进步的历程中，数学为先进工程技术、航海导航、物理学以及复杂的资源管理提供了逻辑基础。"
