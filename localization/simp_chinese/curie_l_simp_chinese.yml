 je_curie_mathematical_innovation: "数学创新水平"
 je_curie_mathematical_innovation_reason: "[ROOT.GetCountry.GetCustom('je_curie_mathematical_innovation_active_type')]未被雇用的[concept_curie_mathematical_physicist]会为国家的数学创新水平作出贡献。数学创新水平由国际数学创新水平与国家数学创新水平之和决定。国际数学创新水平根据全球已发现的数学公式总数计算，国家数学创新水平则根据该国自行发现的全部公式计算。\n\n数学创新水平能够提高创新力上限，并减轻超前研究科技所受到的惩罚。如果发现新的公式，相关修正将在年末调整，以提高数学创新水平。"
