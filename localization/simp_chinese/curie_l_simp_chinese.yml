 curie.502.t: "气象站已扩建"
 curie.502.d: "[ROOT.Var('curie_physicist_var').GetCharacter.GetLastName]博士自豪地宣布，观测站的新气象站已经建成。如今，它已成为全国气象系统的核心，并将提升全国各地的恶劣天气预警能力！"
 curie.502.f: "早在17至18世纪，标准化气象观测网络便已初具雏形。电报的发明彻底改变了气象观测方式，使人们能够实时收集广阔地区的观测数据。此后，各国政府相继设立专门的国家气象机构，例如英国气象局（1854年）和美国气象局（1870年）。"
 curie.502.g: "明天天气怎么样？"
 curie.511.g: "[ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe|U]真是一位名副其实的捕云者！"
 curie.521.g: "这是我见过的第二壮观的云彩！"
 curie.511.d: "在晴朗的天气条件下，[ROOT.Var('curie_physicist_var').GetCharacter.GetLastName]博士得以近距离观察和研究#V 卷云#!，并从中得出了新的气象学结论。这标志着[GetPlayer.GetName]首次对这种云进行了描述！"
