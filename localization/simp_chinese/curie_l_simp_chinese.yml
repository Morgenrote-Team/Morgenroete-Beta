 je_curie_improve_mathematics_project: "数学研究"
 je_curie_improve_mathematics_project_reason: "你的[concept_curie_physicist][ROOT.Var('curie_physicist_var').GetCharacter.GetLastName]博士正致力于现代化[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]的[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName]的生产方式。\n$mr_divider_for_je$\n该项目每月都会取得进展。每当进度达到24点，该建筑将获得一个新的修正。总计可获得3个修正。\n每当[GetBuildingType('building_university').GetName]拥有全部修正，你还会获得#p 1点#!@curie_physical_data![concept_curie_physical_data]。\n$mr_divider_for_je$\n当前建筑：[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]的[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_mathematics_project_modifier_1_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_mathematics_project_modifier_2_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_mathematics_project_modifier_3_type')]\n剩余建筑总数（不包括当前）：[JournalEntry.MakeScope.Var('mr_number_of_remaining_list_entries_var').GetValue|V0]\n获自项目的$concept_curie_physical_data$：[JournalEntry.MakeScope.ScriptValue('curie_physical_data_from_mathematics_project_value')|+0]@curie_physical_data!#!#!"
