 curie.301.t: "改革后的数学与工程学院"
 curie.301.d: "[SCOPE.sCharacter('curie_physicist_scope').GetLastName]博士已经实现了[SCOPE.sCharacter('curie_physicist_scope').GetHerHis]的目标。通过访问数学与工程学院，[SCOPE.sCharacter('curie_physicist_scope').GetSheHe]引入了新的研究方法，并使新一代研究人员了解了数学领域的最新进展。\n\n改善的建筑总数：[GetPlayer.MakeScope.Var('mr_num_improved_mathematics_buildings_var').GetValue|V0]\n\n项目获得的$concept_curie_physical_data$：[GetPlayer.MakeScope.ScriptValue('curie_physical_data_from_mathematics_project_for_event_value')|+0]@curie_physical_data!"
 curie.301.f: "“我刚讲完一场布尔代数入门研讨课，结果竟然没人听懂那个笑话！真是一群不懂欣赏的俗人。”"
 curie.301.g: "一股革新之风正席卷学界！"
 je_curie_physics_experiment: "物理实验"
 je_curie_physics_experiment_reason: "[ROOT.Var('curie_physicist_var').GetCharacter.GetLastName]博士正在开展一项物理学实验。实验的成败在很大程度上取决于[ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis]的角色[concept_character_trait]。如果实验成功，它可能只是一次常规实验，也可能成为一项具有历史意义的实验。只有在此前从未有科学家开展过这项实验，且满足相应条件时，才有可能取得具有历史意义的成果。这些条件通常包括掌握某项特定技术。每位物理学家一生中只能成功完成一次具有历史意义的实验。"
