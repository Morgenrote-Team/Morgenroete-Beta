 je_curie_formula_discovery_progress_complete_tt: "进度已达#V 60#!。"
 curie.201.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]"
 curie.201.d: "这一切究竟是真的，还是又一场萦绕在[ROOT.Var('curie_physicist_var').GetCharacter.GetFullName]博士脑海中的奇异梦境，在梦中向[ROOT.Var('curie_physicist_var').GetCharacter.GetHerHim]揭示了完整的公式？\n\n经历了一个又一个令人心力交瘁的不眠之夜，[ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe]终于可以自豪地展示[ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis]的研究成果。[ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis|U]关于[SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]的研究现已完成。"
 curie.201.f: "“令人称奇的是，凡认真钻研这门科学的人，无不逐渐对它生出一种热爱之情。”\n——卡尔·弗里德里希·高斯"
 curie.201.g: "现在该谁擦黑板了？"
 curie.202.t: "数学公式"
 curie.202.d: "[ROOT.Var('curie_physicist_var').GetCharacter.GetFullName]博士着手探索一个新的数学领域。[ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis|U]的研究重点是[SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]。"
 curie.202.f: "自19世纪起，数学概念的基础开始受到严格审视，并逐步得到巩固。奥古斯丁-路易·柯西确立了极限的ε定义，并为函数论奠定了基础。物理学和力学的发展与18世纪微积分之间的紧密联系依然延续，许多数学家同时也是理论物理学家——在当时，这两个领域尚未形成明确的学科界限。"
 curie.202.g: "但愿能研究出点有用的东西……？"
 curie.203.t: "外国率先提出[SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]"
 curie.203.d: "通过与同行的书信往来，[ROOT.Var('curie_physicist_var').GetCharacter.GetFullName]博士今天得知，一位外国同行竟然抢在[ROOT.Var('curie_physicist_var').GetCharacter.GetHerHim]之前，在[SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]的研究上取得了突破！这位竞争对手已经推导出了相关公式。"
 curie.203.f: "“没有什么比在算术计算中过分追求精确，更能鲜明地暴露一个人数学素养的欠缺。”\n——威廉·韦伯"
 curie.203.g: "这份数学上的荣耀本该属于我们！"
