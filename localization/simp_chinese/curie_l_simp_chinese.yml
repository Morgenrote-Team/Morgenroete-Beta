 je_curie_formula_discovery: "数学公式"
 je_curie_formula_discovery_reason: "[ROOT.Var('curie_physicist_var').GetCharacter.GetFullName]正试图推导出一个新的数学公式。某些角色特质和技能可能加快研究进度。我们的物理学家目前正在研究[SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]。"
