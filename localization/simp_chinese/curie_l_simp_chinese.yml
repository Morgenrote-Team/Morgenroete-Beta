 je_curie_improve_meteorology_project: "气象站网络"
 je_curie_improve_meteorology_project_reason: "你的[concept_curie_physicist][ROOT.Var('curie_physicist_var').GetCharacter.GetLastName]博士正致力于现代化[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]的[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName]的生产方式。\n$mr_divider_for_je$\n该项目每月都会取得进展。每当进度达到24点，该建筑将获得一个新的修正。总计可获得3个修正。\n$mr_divider_for_je$\n当前建筑：[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]的[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_meteorology_project_modifier_1_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_meteorology_project_modifier_2_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_meteorology_project_modifier_3_type')]\n\n剩余建筑总数（不包括当前）：[JournalEntry.MakeScope.Var('mr_number_of_remaining_list_entries_var').GetValue|V0]"
