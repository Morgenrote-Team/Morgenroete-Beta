 curie.13.t: "奥托昆普"
 curie.13.d: "在[ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName]博士和最先进技术的帮助下，我们在奥托昆普发现了一条此前不为人知的铜矿脉。这可能是东北欧最大的铜矿床！"
 curie.13.f: "1910年，奥托昆普发现了一处储量丰富的矿床。随着冶炼厂和精炼厂等综合工业设施的建成，奥托昆普在20世纪30年代跻身欧洲五大铜生产商之列，并为现代芬兰金属工业奠定了基础。"
 curie.13.g: "奥托昆普将成为铜生产中心！"
 je_curie_meteorological_observation: "气象观测"
 je_curie_meteorological_observation_reason: "[ROOT.GetCountry.GetCustom('je_curie_meteorological_observation_active_type')]一名[concept_curie_meteorological_physicist]全身心投入气象研究工作，包括观测天气和测量气温、研究并描述云的形态，以及记录气候数据。\n\n气象观测工作直接影响所收集的数据量，而气象学家的经验在这方面至关重要。设备完善的气象站还能提供额外加成。气象学家每年可以收集#R 1#!至#G 10#!@curie_physical_data!#![concept_curie_physical_data]。\n\n$mr_divider_for_je$\n我们的气象学家预计将收集[GetPlayer.MakeScope.ScriptValue('curie_meteorological_observation_yearly_physical_data_value')|+=0]@curie_physical_data!#![concept_curie_physical_data]。"
