 curie.100.t: "磁学协会"
 curie.100.d: "[GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetLastName]博士今天首次启用了地磁台。它将成为新成立的磁学协会的核心，并为世界各地的同类观测站树立典范。科学万岁！"
 curie.100.f: "磁学协会是世界上第一个国际性科学协会，由卡尔·弗里德里希·高斯和威廉·韦伯于1834年在哥廷根创立。该协会协调遍布全球的地磁观测站网络，对地球磁场进行同步观测。"
 curie.101.t: "磁学协会的新成员"
 curie.101.d: "[GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetFullName]今天加入了[GetPlayer.GetCustom('curie_magnetic_association_city')]的磁学协会，受到了其他成员的热烈欢迎。"
 curie.101.f: "加入协会后，[GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetLastName]博士了解了如何建造一座基础地磁台的必要知识。协会主席也给了我们的工程师一份观测站和磁强计的规划。整个协会都推动着建筑计划迅速进行，尽快将第一批数据发送至[GetPlayer.GetCustom('curie_magnetic_association_city')]。"
 curie.101.g: "我们要立即建造一座地磁台。"
 curie.102.t: "地磁台竣工"
 curie.102.d: "地磁台今天竣工了。过去几个月获取的大量数据已传送至[GetPlayer.GetCustom('curie_magnetic_association_city')]。"
 curie.102.f: "获得的测量数据除用于地球磁场的科学研究外，也有实际应用。在过去和现在，磁偏图被用于航海和航空导航。在寻找矿床和油田上，地磁测量数据也至关重要。"
 curie.102.g: "为了地磁科学！"
 curie.103.t: "国际磁测数据收集"
 curie.103.d: "来自世界各地的地磁数据经过专业人员多年的收集和比较，[GetPlayer.GetCustom('curie_magnetic_association_city')]的研究人员们得出了个有趣的结果。"
 curie.103.f: "地球物理学和地磁学有许多实际的应用——特别是采矿业——能利用这些知识发现存在的矿藏。大型公司利用地球物理知识来找到之前未知的铁、铅和石油矿藏。结合正确的技术和对地球磁场的绘制，应该很容易将当前的理论知识转化为生产力。"
 curie.103.g: "我们需要更多数据！"
 curie.103.h: "这将为寻找铁矿提供帮助。"
 curie.103.i: "这将为寻找铅矿提供帮助。"
 curie.103.j: "这将为寻找铜矿提供帮助。"
 curie.103.k: "这将为寻找油田提供帮助。"
 curie.104.t: "航海界的关注"
 curie.104.d: "[SCOPE.sCharacter('curie_admiral_scope').GetFullName]对[GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetFullName]的地磁研究表现出浓厚的兴趣。他在目前仍在建设中的地磁观测站成功开展了一项实验。"
 curie.104.f: "“我要拿这些青蛙腿做什么？哦，没什么特别的，真的什么也没有……”"
 curie.104.g: "这些新知识应该对他有所帮助。"
 curie.104.h: "这些知识应该造福所有人。"
 curie.105.t: "异常现象"
 curie.105.d: "尽管进行了重新测量，但[GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetLastName]博士记录的地球磁场数据与预期不符。原因尚且不明。"
 curie.105.f: "地球磁场在一地与其他地不同的原因有很多。人们经常会对这类现象进行假设，如：该地有大型金属矿床什么的；这就是为什么地磁学研究与开采业并非无关联的原因。"
 curie.105.g: "我们应该直接把数据送到[GetPlayer.GetCustom('curie_magnetic_association_city')]。"
 curie.106.t: "天文学家咨询地磁台"
 curie.106.d: "[GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetFullName]博士与[GetPlayer.MakeScope.GetVariable('verrier_astronomer_var').GetCharacter.GetFullName]博士进行了场慷慨激昂的交流。这次交流极大的拓展了[GetPlayer.MakeScope.GetVariable('verrier_astronomer_var').GetCharacter.GetLastName]的科学见解。"
 curie.106.f: "“这就是为什么面包掉地上总是蘸酱的那面朝地的原因！”"
 curie.106.g: "这将推进[GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetHerHim]的应用研究。"
 curie.106.h: "这将推进[GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetHerHim]的理论研究。"
 curie.107.t: "地磁图集"
 curie.107.d: "[GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetFullName]博士出版了世界上第一部地磁图集。这部著作有望成为物理学领域的标准科学参考文献！"
 curie.107.f: "19世纪的《地磁图集》（正式名称通常为《地球磁学图集》）是地球物理学和地图学领域的一部开创性著作。该图集于1840年在莱比锡出版，由数学家卡尔·弗里德里希·高斯和物理学家威廉·韦伯共同编纂。\n这部著作首次以严谨的数学理论为基础，汇集了全球各地的地磁观测数据，并将其以地图形式直观呈现。图集收录了18幅详尽的地磁地图和图表，揭示了地球磁场的主要来源位于地球内部。"
 curie.107.g: "这些知识应当用于理论研究。"
 curie.107.h: "这些知识应当付诸实践。"
