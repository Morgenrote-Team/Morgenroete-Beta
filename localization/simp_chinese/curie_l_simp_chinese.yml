 curie_differential_geometry_tech: "微分几何"
 curie_differential_geometry_tech_desc: "微分几何由高斯在19世纪首创，利用复杂数学描述曲线和曲面在现实世界中的行为。这门学科最初是为了绘制更精确的地图和测量地球而发展起来的，它使科学家能够通过公式计算形状和距离，而不仅仅是依靠观察。"
