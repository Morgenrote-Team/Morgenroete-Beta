l_simp_chinese:
 CURTISS_FLIGHT_ROUTE: "航线"
 CURTISS_FLIGHT_ROUTES: "航线"
 CURTISS_ADD_X_FLIGHT_ROUTE_EFFECT_POSITIVE: "国家$MR_GAINS$$VALUE|0+$@curtiss_airlines![SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE$','(CFixedPoint)1'),'CURTISS_FLIGHT_ROUTES','CURTISS_FLIGHT_ROUTE')]"
 CURTISS_ADD_X_FLIGHT_ROUTE_EFFECT_NEGATIVE: "国家$MR_LOSES$[Negate_CFixedPoint('(CFixedPoint)$VALUE$')|0+]@curtiss_airlines![SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE$','(CFixedPoint)1'),'CURTISS_FLIGHT_ROUTES','CURTISS_FLIGHT_ROUTE')]"
 CURTISS_ADD_X_FLIGHT_ROUTE_EFFECT_FIRST_POSITIVE: "[COUNTRY.GetNameNoFlag]$MR_GAINS$$VALUE|+0$@curtiss_airlines![SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE$','(CFixedPoint)1'),'CURTISS_FLIGHT_ROUTES','CURTISS_FLIGHT_ROUTE')]（当前：[COUNTRY.MakeScope.GetVariable('curtiss_flight_route').GetValue|0|V]）"
 CURTISS_ADD_X_FLIGHT_ROUTE_EFFECT_FIRST_NEGATIVE: "[COUNTRY.GetNameNoFlag]$MR_LOSES$[Negate_CFixedPoint('(CFixedPoint)$VALUE$')|+0]@curtiss_airlines![SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE$','(CFixedPoint)1'),'CURTISS_FLIGHT_ROUTES','CURTISS_FLIGHT_ROUTE')]（当前：[COUNTRY.MakeScope.GetVariable('curtiss_flight_route').GetValue|0|V]）"
 CURTISS_ADD_X_FLIGHT_ROUTE_EFFECT_THIRD_POSITIVE: "[COUNTRY.GetName]$MR_GAINS$$VALUE|+0$@curtiss_airlines! [SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE$','(CFixedPoint)1'),'CURTISS_FLIGHT_ROUTES','CURTISS_FLIGHT_ROUTE')]"
 CURTISS_ADD_X_FLIGHT_ROUTE_EFFECT_THIRD_NEGATIVE: "[COUNTRY.GetName]$MR_LOSES$[Negate_CFixedPoint('(CFixedPoint)$VALUE$')|+0]@curtiss_airlines![SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE$','(CFixedPoint)1'),'CURTISS_FLIGHT_ROUTES','CURTISS_FLIGHT_ROUTE')]"