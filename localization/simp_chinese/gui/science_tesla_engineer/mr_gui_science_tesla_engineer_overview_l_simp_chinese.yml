l_simp_chinese:
 MR_AUTOMATE_ENGINEER_TT: "#T [concept_tesla_engineer]自动化#!\n如果你将工程师的任务自动化，就不再需要向其分配任务了。\n工程师将独立工作，并执行当前有意义的任务。不过你仍然会收到一些事件通知。\n\n#n 自动化效率可能低于直接控制工程师。#!"
 mr_engineering_automation_gui_tt: "[concept_tesla_engineer]开始自行开展任务。"
 mr_stop_engineering_automation_gui_tt: "[concept_tesla_engineer]不再自动执行任务。"
 MR_STOP_AUTOMATE_ENGINEER_TT: "#T [concept_tesla_engineer]停止自动执行任务#!\n你的工程师将不再自行执行有意义的任务。"
 MR_ENGINEER_RANKING_BUTTON: "工程师"
 MR_RANKING_BY_ENGINEER: "显示全球所有[Concept('concept_tesla_engineer','$concept_tesla_engineers|q$')]的排名。"
 ENGINEER_ENGINEER_RANKING_HEADER: "依据[Concept('concept_tesla_engineer','$concept_tesla_engineers|q$')][concept_academics_experience]的世界排名"
 tesla_experience_current_specialization_civil_loc: "[Character.MakeScope.GetVariable('tesla_civil_engineer_experience_var').GetValue|V0]"
 tesla_experience_current_specialization_mechanical_loc: "[Character.MakeScope.GetVariable('tesla_mechanical_engineer_experience_var').GetValue|V0]"
 tesla_experience_current_specialization_military_loc: "[Character.MakeScope.GetVariable('tesla_military_engineer_experience_var').GetValue|V0]"
 tesla_experience_current_specialization_electrical_loc: "[Character.MakeScope.GetVariable('tesla_electrical_engineer_experience_var').GetValue|V0]"
 tesla_experience_current_specialization_aeronautical_loc: "[Character.MakeScope.GetVariable('tesla_aeronautical_engineer_experience_var').GetValue|V0]"
 MR_ELECTRICAL_ENGINEER_SAW_MILLS_BUTTON: "现代化锯木厂"
 MR_ELECTRICAL_ENGINEER_SAW_MILLS_BUTTON_TT: "#T 现代化现代化锯木厂#!\n让你的[concept_tesla_engineer]专注于现代化改造你的[GetBuildingType('building_logging_camp').GetName]。$building_logging_camp$将随时间获得以下修正：$tesla_saw_mills_1_modifier$。\n\n这将增加#n 国库开支#!。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ELECTRICAL_ENGINEER_SAW_MILLS_TRIGGER_TT: "#default_text [GetPlayer.GetName] has a [GetBuildingType('building_logging_camp').GetName] of level 1 or higher with the #V $pm_electric_saw_mills$#! [concept_production_method] that does not have the [concept_modifier] yet.#!"
 MR_TESLA_BUILDING_CHOOSER_SAW_MILLS_MULTIPLE_HEADER: "现代化锯木厂项目"
 MR_ELECTRICAL_ENGINEER_POWER_GRID_BUTTON: "现代化电网"
 MR_ELECTRICAL_ENGINEER_POWER_GRID_BUTTON_TT: "#T 现代化电网#!\n让你的[concept_tesla_engineer]专注于现代化改造你的[GetBuildingType('building_tesla_telegraph').GetName]。$building_tesla_telegraph$将随时间获得以下修正：$tesla_power_grid_1_modifier$。\n\n这将增加#n 国库开支#!。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ELECTRICAL_ENGINEER_POWER_GRID_TRIGGER_TT: "#default_text [GetPlayer.GetName] has a [GetBuildingType('building_tesla_telegraph').GetName] of level 1 or higher with the #V $pm_tesla_power_line$#! [concept_production_method] hat does not have the [concept_modifier] yet.#!"
 MR_TESLA_BUILDING_CHOOSER_POWER_GRID_MULTIPLE_HEADER: "现代化电网项目"