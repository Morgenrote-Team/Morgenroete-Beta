 SANTOS_CROSSING_CHANNEL_TT: "The English Channel presents a classic short-distance maritime crossing of some 35 to 50 kilometres. Its principal hazards lie in unpredictable coastal winds and sudden drifts towards the open Atlantic, though it remains a proven proving ground for pioneer flights since Blanchard and Green."
 SANTOS_CROSSING_ALPS_TT: "Representing an extreme high-altitude obstacle, an Alpine passage demands an operational ceiling of 5,500 to 6,000 metres—introducing severe risk of hypoxia—and a flight range of 400 to 600 kilometres. Treachery resides in violent mountain leewaves and down-draughts capable of driving a craft against sheer rock faces, a peril first conquered by Francisque Arban in 1849."
 SANTOS_CROSSING_SKAGERRAK_TT: "Crossing this maritime strait between Denmark and the Scandinavian peninsula involves 80 to 130 kilometres of open water, requiring a cruising altitude of 2,000 metres and a range reserve of 400 kilometres. Balloonists must contend with rapidly developing North Sea gales, severe cold, and inhospitable shorelines, demanding gastight envelopes and precise wind navigation."
 SANTOS_CROSSING_MEDITERRANEAN_TT: "This vast sea basin, interspersed with mountainous islands such as Corsica and Sicily, requires a cruising altitude of 4,000 metres to clear island peaks and a range of 700 kilometres. Intense tropical solar radiation causes severe gas expansion, whilst the inability to deploy a trail-rope over water demands meticulous ballast management."
 SANTOS_CROSSING_RIO_TT: "Traversing this immense estuary between Argentina and Uruguay, spanning up to 220 kilometres of open water, necessitates a cruising altitude of 2,000 metres and a range of 300 kilometres. The primary dangers stem from sudden squalls, locally termed pamperos, and severe thermal turbulence over the water."
 SANTOS_CROSSING_PYRENEES_TT: "Forming a mountain barrier between France and Spain, the Pyrenees demand a minimum clearance altitude of 5,000 metres and a range capacity of 500 kilometres. Powerful down-draughts in the lee of peaks exceeding 3,000 metres necessitate a substantial vertical safety margin to prevent catastrophic descent."
 SANTOS_CROSSING_ANDES_TT: "Representing the supreme obstacle in balloon navigation, an Andean crossing requires an extraordinary altitude capability of 8,000 metres and a distance range of 800 kilometres. Aeronauts face life-threatening oxygen depletion without pressurised equipment, alongside bitter cold and gale-force mountain winds."
 SANTOS_CROSSING_KOREA_TT: "Connecting Korea to Japan across 180 to 200 kilometres of sea, this passage requires an altitude of 2,500 metres and a range reserve of 250 kilometres. Intermediate islands such as Tsushima aid orientation, though shifting monsoon winds and the threat of drift into the open Pacific remain chief concerns."
 SANTOS_CROSSING_BAB_TT: "This southern choke point of the Red Sea comprises 30 to 40 kilometres of open water, yet demands an altitude of 4,000 metres to clear adjoining coastal ranges, alongside a range reserve of 400 kilometres. Extreme tropical heat severely destabilises envelope gas, complemented by violent desert thermals and unpredictable fall-winds."
