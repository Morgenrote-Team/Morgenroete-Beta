 MR_HYDROGEN_BAR_TT: "该气球使用#V 氢气#!。"
 MR_BALLOONIST_CHANGE_TYPE_BUTTON: "改变型号"
 MR_BALLOONIST_CHANGE_TYPE_BUTTON_TT: "专用型气球可以在飞行高度、距离或时长中的某一方面获得小幅优势，但代价是其他所有方面的性能都会下降。全能型气球则既无优势，也无劣势。"
 MR_HEADER_MODIFICATIONS: "改装"
 MR_BALLOONIST_MODIFICATION_POSSIBLE_TRIGGER_TT: "#default_text [GetPlayer.GetName]未在改装气球。#!"
 MR_BALLOONIST_HYDROGEN_FACTORY_TRIGGER_TT: "#default_text [GetPlayer.GetName]拥有至少一座使用$pm_brine_electrolysis$[concept_production_method]的[GetBuildingType('building_explosives_factory').GetName]。#!"
 MR_BALLOONIST_COAL_GAS_BUTTON: "使用煤气"
 MR_BALLOONIST_COAL_GAS_BUTTON_TT: "#T 使用煤气#!\n煤气是一种来源充足的气球升力气体。在气球飞行发展的早期，它完全能够满足创造飞行距离和速度纪录的需要，但在攀升至高空方面存在明显的局限性。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_HYDROGEN_BUTTON: "使用氢气"
 MR_BALLOONIST_HYDROGEN_BUTTON_TT: "#T 使用氢气#!\n早在气球飞行发展的初期，氢气便已得到应用，并帮助人们创造了令人惊叹的飞行高度纪录。毫不夸张地说，氢气堪称首屈一指的「高空飞行气体」。然而，氢气的制备成本极高，且需要耗费大量人力。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
