 MR_BALLOONIST_BALLOON_RIDE_BUTTON: "气球游览"
 MR_BALLOONIST_BALLOON_RIDE_BUTTON_TT: "#T 气球游览#!\n面向公众提供娱乐性气球游览，是[concept_santos_balloonist]最安全的默认行动，但也难免有些乏味。这项行动可以为某些建筑增设气球游览设施，并小幅提升气球相关科技的研究进度。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_BALLOON_ADVENTURE_BUTTON: "气球探险"
 MR_BALLOONIST_BALLOON_ADVENTURE_BUTTON_TT: "#T 气球探险#!\n[concept_santos_balloonist]可以踏上一场跨越国境的冒险之旅。在长达数月的旅途中，气球飞行家将穿越众多国家，或许还能带回一两件纪念品。不过，气球飞行家也有小概率在旅途中丧生。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_BALLOON_RECORD_BUTTON: "气球飞行纪录"
