 MR_BALLOONIST_BALLOON_RIDE_BUTTON: "气球游览"
 MR_BALLOONIST_BALLOON_RIDE_BUTTON_TT: "#T 气球游览#!\n面向公众提供娱乐性气球游览，是[concept_santos_balloonist]最安全的默认行动，但也难免有些乏味。这项行动可以为某些建筑增设气球游览设施，并小幅提升气球相关科技的研究进度。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_BALLOON_ADVENTURE_BUTTON: "气球探险"
 MR_BALLOONIST_BALLOON_ADVENTURE_BUTTON_TT: "#T 气球探险#!\n[concept_santos_balloonist]可以踏上一场跨越国境的冒险之旅。在长达数月的旅途中，气球飞行家将穿越众多国家，或许还能带回一两件纪念品。不过，气球飞行家也有小概率在旅途中丧生。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_BALLOON_RECORD_BUTTON: "气球飞行纪录"
 MR_BALLOONIST_BALLOON_RECORD_BUTTON_TT: "#T 气球飞行纪录#!\n[concept_santos_balloonist]可以尝试创造飞行海拔、距离和留空时长方面的新纪录，前提是能够凭借自身资源打破这些世界纪录。在挑战纪录的过程中，气球飞行家有一定概率丧生。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_BALLOON_CROSSING_BUTTON: "气球飞越挑战"
 MR_BALLOONIST_BALLOON_CROSSING_BUTTON_TT: "#T 气球飞越挑战#!\n[concept_santos_balloonist]可以尝试飞越地理环境险恶的海峡或山脉。这一壮举被视为所有冒险家面临的终极挑战。在尝试飞越的过程中，气球飞行家有较高概率丧生。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_FIRE_BALLOONIST_TRIGGER_TT: "#default_text [GetPlayer.GetName]#R 未拥有#!#V $santos_balloon_contract_modifier$#![concept_modifier]。#!"
 MR_BALLOONIST_CROSSING_TRIGGER_TT: "#default_text [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]#R 未拥有#!#V $santos_balloon_demoralized_modifier$#![concept_modifier]。"
 mr_balloonist_automation_gui_tt: "[concept_santos_balloonist]开始自行开展任务。"
 mr_stop_balloonist_automation_gui_tt: "[concept_santos_balloonist]不再自动执行任务。"
 MR_STOP_AUTOMATE_BALLOONIST_TT: "#T [concept_santos_balloonist]停止自动执行任务#!\n你的气球飞行家将不再自行执行有意义的任务。"
 MR_AUTOMATE_BALLOONIST_TT: "#T [concept_santos_balloonist]自动化#!\n如果将气球飞行家的工作自动化，就不再需要给其分配任务了。\n气球飞行家将独立工作，并执行当前最合理的任务。不过你仍然会收到一些事件通知。"
 MR_BALLOONIST_STRATOSPHERIC_FLIGHT_BUTTON: "平流层飞行"
 MR_BALLOONIST_STRATOSPHERIC_FLIGHT_BUTTON_TT: "#T 平流层飞行#!\n人类乘坐气球究竟能升到多高？随着加压密封舱这一革命性发明的问世，一项非同寻常而又充满危险的实验或许将成为可能。\n#R 注意：#!首次进行平流层飞行时，需要一名[concept_curie_meteorological_physicist]负责建造和改装平流层气球。首次飞行成功后，气球飞行家便可在没有气象学家协助的情况下独立飞行。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_HAS_HYDROGEN_BALLOON_TRIGGER_TT: "#default_text [GetPlayer.GetName]拥有使用#BLUE 氢气#!的[concept_santos_balloon]#!"
 MR_BALLOONIST_NO_RECENT_STRATOSPHERIC_FLIGHT_TRIGGER_TT: "#default_text [GetPlayer.GetName]#R 未拥有#!#V $santos_stratospheric_flight_success_modifier$#!或#V $santos_stratospheric_flight_failure_modifier$#![concept_modifier]。#!"
 MR_HELIUM_BAR: "Helium"
 MR_HELIUM_BAR_TT: "This Balloon uses #V helium#!."
 MR_BALLOONIST_HELIUM_FACTORY_TRIGGER_TT: "#default_text [GetPlayer.GetName] has a [GetBuildingType('building_mendelejew_helium_plant').GetName].#!"
 MR_BALLOONIST_CHANGE_FUEL_BUTTON: "Change Fuel"
 MR_BALLOONIST_CHANGE_FUEL_BUTTON_TT: "Each type of balloon gas has certain advantages and disadvantages. Coal gas is good for long distances, hydrogen for high altitudes, and helium is particularly useful to prevent accidents."
