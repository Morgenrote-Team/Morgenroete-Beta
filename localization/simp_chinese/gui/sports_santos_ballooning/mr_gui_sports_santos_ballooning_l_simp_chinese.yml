 MR_BALLOONIST_COAL_GAS_BUTTON: "Use Coal Gas"
 MR_BALLOONIST_COAL_GAS_BUTTON_TT: "#T Use Coal Gas#!\nCoal gas is an abundant hot-air balloon gas which, in the early days of ballooning, was perfectly adequate for setting distance and speed records, but which has significant limitations when it comes to ascending to high altitudes.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_HYDROGEN_BUTTON: "Use Hydrogen"
 MR_BALLOONIST_HYDROGEN_BUTTON_TT: "#T Use Hydrogen#!\nHydrogen was already in use in the early days of ballooning and led to some breathtaking altitude records - it is, quite simply, the 'altitude gas' par excellence. However, producing it is very expensive and labour-intensive.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
