 SANTOS_CROSSING_CHANNEL_NAME: "英吉利海峡"
 SANTOS_CROSSING_CHANNEL_TT: "英吉利海峡是一条经典的短距离海上飞越航线，跨越约35至50千米的海面。其主要危险在于变幻莫测的沿岸风，以及气球可能突然偏离航线、飘向开阔大西洋的风险。不过，自布朗夏尔和格林的先驱性飞行以来，这里便一直是早期航空探险者久经验证的试验场。"
 SANTOS_CROSSING_ALPS_NAME: "阿尔卑斯山脉"
 SANTOS_CROSSING_ALPS_TT: "阿尔卑斯山脉是一道极为严峻的高空飞越障碍。穿越这片山脉要求气球具备5500至6000米的实用升限，以及400至600千米的航程，同时还将面临严重的缺氧风险。真正的危险来自猛烈的山地背风波与下沉气流，它们足以将气球推向陡峭的岩壁。1849年，弗朗西斯克·阿尔邦首次成功克服了这一险阻。"
 SANTOS_CROSSING_SKAGERRAK_NAME: "斯卡格拉克海峡"
 SANTOS_CROSSING_SKAGERRAK_TT: "飞越丹麦与斯堪的纳维亚半岛之间的斯卡格拉克海峡，需要跨越80至130千米的开阔海面，要求气球达到2000米的巡航高度，并具备400千米的航程储备。气球驾驶员必须应对北海迅速形成的烈风、严寒以及不利于迫降的海岸地形，因此需要具备良好气密性的气囊，并精确掌握利用风向导航的技术。"
 SANTOS_CROSSING_MEDITERRANEAN_NAME: "地中海"
 SANTOS_CROSSING_MEDITERRANEAN_TT: "地中海是一片辽阔的海域，其间散布着科西嘉岛和西西里岛等多山岛屿。为越过岛上的高峰，气球需要达到4000米的巡航高度，并具备700千米的航程。强烈的阳光辐射会使气囊内的气体显著膨胀，而在海面上无法使用拖曳绳辅助控制高度，因此必须对压载物进行极为精细的管理。"
 SANTOS_CROSSING_RIO_NAME: "拉普拉塔河口"
 SANTOS_CROSSING_RIO_TT: "飞越阿根廷与乌拉圭之间辽阔的拉普拉塔河口，需要跨越宽达220千米的开阔水域，要求气球达到2000米的巡航高度，并具备300千米的航程。主要危险来自突如其来的狂风骤雨，尤其是当地称为「潘佩罗风」的强烈阵风，以及水面上空剧烈的热力湍流。"
 SANTOS_CROSSING_PYRENEES_NAME: "比利牛斯山脉"
 SANTOS_CROSSING_PYRENEES_TT: "比利牛斯山脉构成了法国与西班牙之间的天然屏障。飞越这片山脉要求气球至少达到5000米的越障高度，并具备500千米的航程。海拔超过3000米的山峰背风侧可能产生强烈的下沉气流，因此必须保留充足的垂直安全余度，以防气球骤然下降并酿成灾难。"
 SANTOS_CROSSING_ANDES_NAME: "安第斯山脉"
 SANTOS_CROSSING_ANDES_TT: "安第斯山脉堪称气球航行所面临的终极障碍。穿越这片山脉要求气球具备高达8000米的飞行高度能力，以及800千米的航程。若缺乏加压设备，航空探险者将面临足以危及生命的严重缺氧，同时还必须经受刺骨严寒与烈风级山地气流的考验。"
 SANTOS_CROSSING_KOREA_NAME: "朝鲜海峡"
 SANTOS_CROSSING_KOREA_TT: "朝鲜海峡连接朝鲜半岛与日本列岛，飞越这片海峡需要跨越180至200千米的海面，要求气球达到2500米的飞行高度，并具备250千米的航程储备。对马岛等海峡中的岛屿可为航向判断提供参照，但不断变化的季风，以及气球偏离航线、飘向开阔太平洋的风险，仍是此次飞越面临的主要威胁。"
 SANTOS_CROSSING_BAB_NAME: "曼德海峡"
 SANTOS_CROSSING_BAB_TT: "曼德海峡扼守红海南端的咽喉要道。虽然需要跨越的开阔水域仅有30至40千米，但为越过两岸的山地，气球仍须达到4000米的飞行高度，并具备400千米的航程储备。极端的热带高温会使气囊内的气体状态剧烈变化，而猛烈的沙漠热对流与难以预测的下坡风，更令此次飞越充满危险。"
 santos_jean_pierre_blanchard_loc: "让-皮埃尔·布朗夏尔"
