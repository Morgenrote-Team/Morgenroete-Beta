 mr_stop_balloonist_automation_gui_tt: "[concept_santos_balloonist]不再自动执行任务。"
 MR_STOP_AUTOMATE_BALLOONIST_TT: "#T [concept_santos_balloonist]停止自动执行任务#!\n你的气球飞行家将不再自行执行有意义的任务。"
 MR_AUTOMATE_BALLOONIST_TT: "#T [concept_santos_balloonist]自动化#!\n如果将气球飞行家的工作自动化，就不再需要给其分配任务了。\n气球飞行家将独立工作，并执行当前最合理的任务。不过你仍然会收到一些事件通知。"
 MR_BALLOONIST_STRATOSPHERIC_FLIGHT_BUTTON: "平流层飞行"
 MR_BALLOONIST_STRATOSPHERIC_FLIGHT_BUTTON_TT: "#T 平流层飞行#!\n人类乘坐气球究竟能升到多高？随着加压密封舱这一革命性发明的问世，一项非同寻常而又充满危险的实验或许将成为可能。\n#R 注意：#!首次进行平流层飞行时，需要一名[concept_curie_meteorological_physicist]负责建造和改装平流层气球。首次飞行成功后，气球飞行家便可在没有气象学家协助的情况下独立飞行。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_HAS_HYDROGEN_BALLOON_TRIGGER_TT: "#default_text [GetPlayer.GetName]拥有使用#BLUE 氢气#!的[concept_santos_balloon]#!"
 MR_BALLOONIST_NO_RECENT_STRATOSPHERIC_FLIGHT_TRIGGER_TT: "#default_text [GetPlayer.GetName] does #R not#! have the #V $santos_stratospheric_flight_success_modifier$#! or the #V $santos_stratospheric_flight_failure_modifier$#! [concept_modifier].#!"