l_simp_chinese:
 curtiss_schneider_trophy_event_mechanical_problems_icon_flag: "@curtiss_event_log_negative_mechanical_problems_icon!"
 curtiss_schneider_trophy_event_mechanical_problems_title_flag: "机械问题"
 curtiss_schneider_trophy_event_mechanical_problems_flag: "#t $curtiss_schneider_trophy_event_mechanical_problems_title_flag$#!\n$curtiss.121.d$"
 curtiss_schneider_trophy_event_crash_icon_flag: "@curtiss_event_log_negative_crash_icon!"
 curtiss_schneider_trophy_event_crash_title_flag: "空难"
 curtiss_schneider_trophy_event_crash_flag: "#t $curtiss_schneider_trophy_event_crash_title_flag$#!\n在一次飞行训练中，我们的飞行员过于自信，最终撞向了水面！"
 curtiss_schneider_trophy_event_buoy_icon_flag: "@curtiss_event_log_negative_buoy_icon!"
 curtiss_schneider_trophy_event_buoy_title_flag: "被忽视的浮标"
 curtiss_schneider_trophy_event_buoy_flag: "#t $curtiss_schneider_trophy_event_buoy_title_flag$#!\n我们队在施耐德杯中表现出色，但有一名飞行员被裁判指责漏看浮标，因此将面临扣分处罚。"
 curtiss_schneider_trophy_event_maximum_speed_icon_flag: "@curtiss_event_log_positive_speed_icon!"
 curtiss_schneider_trophy_event_maximum_speed_title_flag: "最高速度"
 curtiss_schneider_trophy_event_maximum_speed_flag: "#t $curtiss_schneider_trophy_event_maximum_speed_title_flag$#!\n沿途，飞行员们展示了飞机所能达到的极速。"
 curtiss_schneider_trophy_event_slalom_icon_flag: "@curtiss_event_log_positive_slalom_icon!"
 curtiss_schneider_trophy_event_slalom_title_flag: "蛇形机动"
 curtiss_schneider_trophy_event_slalom_flag: "#t $curtiss_schneider_trophy_event_slalom_title_flag$#!\n施耐德杯以速度比拼而闻名，但赛道上设有三至四个标志点，飞行员在高速飞行时可能错过这些标志点，从而被取消比赛资格。幸运的是，飞行员通过蛇形机动飞行，成功通过了所有标志点。"
 curtiss_schneider_trophy_event_fog_neutral_icon_flag: "@curtiss_event_log_fog_neutral_icon!"
 curtiss_schneider_trophy_event_fog_positive_icon_flag: "@curtiss_event_log_fog_positive_icon!"
 curtiss_schneider_trophy_event_fog_title_flag: "迷雾"
 curtiss_schneider_trophy_event_fog_neutral_flag: "#t $curtiss_schneider_trophy_event_fog_title_flag$#!\n水道上更容易出现浓雾，给飞行带来麻烦。即使是经验丰富的飞行员，也可能难以应对这种突如其来的挑战。这一次，飞行员勉强闯过了难关。"
 curtiss_schneider_trophy_event_fog_positive_flag: "#t $curtiss_schneider_trophy_event_fog_title_flag$#!\n水道上更容易出现浓雾，给飞行带来麻烦。即使是经验丰富的飞行员，也可能难以应对这种突如其来的挑战。不过这一次，飞行员顺利应对了这一挑战。"
 curtiss_schneider_trophy_event_superior_flight_performance_icon_flag: "@curtiss_event_log_superior_flight_performance_positive_icon!"
 curtiss_schneider_trophy_event_superior_flight_performance_title_flag: "卓越的飞行性能"
 curtiss_schneider_trophy_event_superior_flight_performance_flag: "#t $curtiss_schneider_trophy_event_superior_flight_performance_title_flag$#!\n我们飞行员的卓越品质让我们更有可能赢得施耐德杯。"
 curtiss_schneider_trophy_event_duel_positive_icon_flag: "@curtiss_event_log_duel_positive_icon!"
 curtiss_schneider_trophy_event_duel_title_positive_flag: "赢得空中决斗"
 curtiss_schneider_trophy_event_duel_positive_flag: "#t $curtiss_schneider_trophy_event_duel_title_positive_flag$#!\n在争夺最快单圈成绩的比赛中，两名飞行员危险地逼近了彼此。通过一次有针对性的飞行机动，飞行员得以提高自己的获胜机会，同时削弱直接竞争对手的优势。"
 curtiss_schneider_trophy_event_duel_negative_icon_flag: "@curtiss_event_log_duel_negative_icon!"
 curtiss_schneider_trophy_event_duel_title_negative_flag: "输掉空中决斗"
 curtiss_schneider_trophy_event_duel_negative_flag: "#t $curtiss_schneider_trophy_event_duel_title_negative_flag$#!\n在争夺最快单圈纪录的比赛中，两名飞行员危险地逼近了彼此。其中一名飞行员试图通过一次精心策划的机动动作提高获胜的机会，却以惨败告终。"
 curtiss_schneider_trophy_event_rivalry_icon_positive_flag: "@curtiss_event_log_rivalry_positive_icon!"
 curtiss_schneider_trophy_event_rivalry_title_positive_flag: "清算宿敌"
 curtiss_schneider_trophy_event_rivalry_positive_flag: "#t $curtiss_schneider_trophy_event_rivalry_title_positive_flag$#!\n这位施耐德杯的王牌飞行员与对手之间有一笔旧账要算。在一次大胆的飞行机动中，这位飞行员成功将自己痛恨的宿敌挤出了比赛！"
 curtiss_schneider_trophy_event_rivalry_icon_negative_flag: "@curtiss_event_log_rivalry_negative_icon!"
 curtiss_schneider_trophy_event_rivalry_title_negative_flag: "大仇未报"
 curtiss_schneider_trophy_event_rivalry_negative_flag: "#t $curtiss_schneider_trophy_event_rivalry_title_negative_flag$#!\n这位施耐德杯的王牌飞行员与对手之间有一笔旧账要算。在一次大胆的飞行机动中，这位飞行员试图将自己痛恨的宿敌挤出比赛，但最终未能得逞。"
 curtiss_schneider_trophy_event_rivalry_fly_ahead_icon_flag: "@curtiss_event_log_fly_ahead_positive_icon!"
 curtiss_schneider_trophy_event_rivalry_fly_ahead_title_flag: "一马当先"
 curtiss_schneider_trophy_event_rivalry_fly_ahead_flag: "#t $curtiss_schneider_trophy_event_rivalry_fly_ahead_title_flag$#!\n这位施耐德杯的王牌飞行员与对手之间有一笔旧账要算。然而，他并未理会对手，而是径直向前飞去。"
 curtiss_schneider_trophy_event_rivalry_title_positive_opponent_flag: "宿敌败北"
 curtiss_schneider_trophy_event_rivalry_positive_opponent_flag: "#t $curtiss_schneider_trophy_event_rivalry_title_positive_opponent_flag$#!\n另一名飞行员试图向这位飞行员报一箭之仇，但最终败下阵来。"
 curtiss_schneider_trophy_event_favorable_conditions_icon_flag: "@curtiss_event_log_favorable_conditions_positive_icon!"
 curtiss_schneider_trophy_event_favorable_conditions_title_flag: "有利条件"
 curtiss_schneider_trophy_event_favorable_conditions_flag: "#t $curtiss_schneider_trophy_event_favorable_conditions_title_flag$#!\n良好的天气条件提高了获胜的机会。"
 curtiss_schneider_trophy_event_team_member_ill_icon_flag: "@curtiss_event_log_team_member_ill_negative_icon!"
 curtiss_schneider_trophy_event_team_member_ill_title_flag: "队员患病"
 curtiss_schneider_trophy_event_team_member_ill_flag: "#t $curtiss_schneider_trophy_event_team_member_ill_title_flag$#!\n施耐德杯参赛队的一名飞行员在比赛开始前突然请了病假。"
 curtiss_schneider_trophy_event_strange_engine_failure_icon_flag: "@curtiss_event_log_strange_engine_failure_negative_icon!"
 curtiss_schneider_trophy_event_strange_engine_failure_title_flag: "离奇的发动机故障"
 curtiss_schneider_trophy_event_strange_engine_failure_flag: "#t $curtiss_schneider_trophy_event_strange_engine_failure_title_flag$#!\n一场离奇的发动机故障令工程师们束手无策。"
 curtiss_schneider_trophy_event_sabotage_prevented_icon_flag: "@curtiss_event_log_sabotage_prevented_positive_icon!"
 curtiss_schneider_trophy_event_sabotage_prevented_title_flag: "破坏行动被阻止！"
 curtiss_schneider_trophy_event_sabotage_prevented_flag: "#t $curtiss_schneider_trophy_event_sabotage_prevented_title_flag$#!\n另一名参赛者企图实施破坏，但在最后一刻被成功阻止。"
 curtiss_schneider_trophy_event_sabotage_discovered_icon_flag: "@curtiss_event_log_sabotage_prevented_negative_icon!"
 curtiss_schneider_trophy_event_sabotage_discovered_title_flag: "破坏行动败露！"
 curtiss_schneider_trophy_event_sabotage_discovered_flag: "#t $curtiss_schneider_trophy_event_sabotage_discovered_title_flag$#!\n该国的蓄意破坏企图遭到揭露，致使其受到其他参赛者的排斥。"