l_simp_chinese:
 MR_AUTOMATE_CHEMIST_TT: "#T [concept_mendelejew_chemist]自动化#!\n如果将化学家的工作自动化，就不再需要给其分配任务了。\n化学家将独立工作，并执行当前最合理的任务。不过你仍然会收到一些事件通知。"
 mr_chemistry_automation_gui_tt: "[concept_mendelejew_chemist]开始自行开展任务。"
 mr_stop_chemistry_automation_gui_tt: "[concept_mendelejew_chemist]不再自动执行任务。"
 MR_STOP_AUTOMATE_CHEMIST_TT: "#T [concept_mendelejew_chemist]停止自动执行任务#!\n你的化学家将不再自行执行有意义的任务。"
 MR_CHEMIST_RANKING_BUTTON: "化学家"
 MR_RANKING_BY_CHEMIST: "显示全球所有[Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists|q$')]的排名。"
 CHEMIST_CHEMIST_RANKING_HEADER: "依据[Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists|q$')][concept_academics_experience]的世界排名"
 MR_CHEMIST_DDT_BUTTON: "DDT"
 MR_CHEMIST_DDT_BUTTON_TT: "#T DDT#!\n迄今为止，由于含有铅或砷，杀虫剂一直具有很强的毒性，对人体健康造成危害。然而，一种人工合成的害虫防治药剂有望为农业带来革命性变革。让你的[concept_mendelejew_chemist]尝试研制这种药剂吧。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_CHEMIST_HAS_IMPROVED_FERTILIZER_TRIGGER_TT: "#default_text 至少有一个1级或更高级别的[GetBuildingType('building_chemical_plant').GetName]拥有全部三个[Concept('concept_modifier','$concept_modifiers|q$')]。#!"