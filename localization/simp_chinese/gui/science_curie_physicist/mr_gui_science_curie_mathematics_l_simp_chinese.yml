 CURIE_EXPERIMENT_ITEM_NAME: "#underline [Scope.Var('name').GetFlagName]实验"
 CURIE_EXPERIMENT_ITEM_TOOLTIP: "[Scope.Var('tooltip').GetFlagName]"
 CURIE_EXPERIMENT_ITEM_COUNTRY: "[Scope.Var('discovering_country').GetCountryDefinition.GetName]"
 CURIE_EXPERIMENT_ITEM_INVENTOR: "[Scope.Var('discoverer').GetFlagName]"
 CURIE_EXPERIMENT_ITEM_YEAR: "[Scope.Var('year').GetValue]"
 CURIE_EXPERIMENT_YOUNG_NAME: "$mr_young$"
 CURIE_EXPERIMENT_ORSTED_NAME: "$mr_orsted$"
 CURIE_EXPERIMENT_YOUNG_TT: "[Scope.Var('year').GetValue]年，[Scope.Var('discoverer').GetFlagName]使光线通过两条狭缝并投射到屏幕上。实验产生的明暗相间的干涉条纹证实了光的波动性，从而有力地反驳了当时占据主导地位的艾萨克·牛顿光微粒说。"
 CURIE_EXPERIMENT_ORSTED_TT: "[Scope.Var('year').GetValue]年，[Scope.Var('discoverer').GetFlagName]将一根通电导线置于磁罗盘上方，并使其与磁针平行。磁针发生偏转的现象证明了电流能够产生磁场，奠定了电磁学统一研究的基础。"
 CURIE_EXPERIMENT_JOULES_TT: "[Scope.Var('year').GetValue]年，[Scope.Var('discoverer').GetFlagName]利用下落重物驱动绝热容器中的桨叶旋转，搅动其中的水。实验测得的水温升高表明，机械功能够转化为热量，为能量守恒定律的确立提供了实验依据。"
 CURIE_EXPERIMENT_DOPPLER_TT: "[Scope.Var('year').GetValue]年，[Scope.Var('discoverer').GetFlagName]利用行驶列车上的小号演奏者，对多普勒提出的理论进行了实验验证。列车经过观测者时所产生的音调变化证实了多普勒效应，表明声源与观测者之间的相对运动会改变观测到的声波频率。"
 CURIE_EXPERIMENT_FOUCAULT_TT: "[Scope.Var('year').GetValue]年，[Scope.Var('discoverer').GetFlagName]利用一根长绳悬挂重物，构建了一套大型单摆装置。实验观察到，单摆的振动平面相对于地面逐渐发生旋转。这一现象无需借助天体观测，便为地球自转提供了直观的实验证据。"
 CURIE_EXPERIMENT_FIZEAU_TT: "[Scope.Var('year').GetValue]年，[Scope.Var('discoverer').GetFlagName]利用旋转齿轮使光束通过齿隙，射向远处的反射镜，再沿原路径返回。通过测定返回光束恰好被旋转齿轮遮挡时的转速，首次在地面实验中测定了光速。"
 CURIE_EXPERIMENT_WEBER_TT: "[Scope.Var('year').GetValue]年，[Scope.Var('discoverer').GetFlagName]利用莱顿瓶和检流计测量电荷，并确定了静电单位制与电磁单位制之间的换算关系。实验所得的单位比值与光速相吻合，为光的电磁本质提供了重要依据。"
 CURIE_EXPERIMENT_MICHELSON_TT: "[Scope.Var('year').GetValue]年，[Scope.Var('discoverer').GetFlagName]利用一台高灵敏度干涉仪，将光束分离为相互正交的传播路径。由于未能观测到预期的干涉条纹移动，该实验否定了发光以太假说，为狭义相对论的发展奠定了坚实基础。"
 CURIE_EXPERIMENT_HERTZ_TT: "[Scope.Var('year').GetValue]年，[Scope.Var('discoverer').GetFlagName]利用火花隙振荡电路产生并探测不可见的无线电波。实验表明，这些电磁波具有与光相同的传播速度和波动特性，从而验证了麦克斯韦的电磁理论，并为无线通信技术的诞生奠定了基础。"
 CURIE_EXPERIMENT_THOMSON_TT: "[Scope.Var('year').GetValue]年，[Scope.Var('discoverer').GetFlagName]利用真空放电管中的电场和磁场使阴极射线发生偏转。通过测定阴极射线粒子的荷质比，发现了带负电的亚原子粒子——电子，从而推翻了原子不可再分的传统观念。"
 CURIE_EXPERIMENT_MILIKAN_TT: "[Scope.Var('year').GetValue]年，[Scope.Var('discoverer').GetFlagName]将带电油滴置于两块金属极板之间，利用电场力与重力的平衡使油滴保持悬浮。通过测量油滴的运动状态及其所带电荷，证实了电荷以基本电荷量为单位呈现量子化特征，并精确测定了电子的电荷量。"
 CURIE_EXPERIMENT_RUTHERFORD_TT: "[Scope.Var('year').GetValue]年，[Scope.Var('discoverer').GetFlagName]利用α粒子轰击极薄的金箔，观察其散射行为。实验中出现的异常大角度偏转表明，原子的绝大部分质量和全部正电荷集中于体积极小的中心原子核，从而推翻了原先认为原子内部物质均匀分布的模型。"
 CURIE_EXPERIMENT_FRANCK_TT: "[Scope.Var('year').GetValue]年，[Scope.Var('discoverer').GetFlagName]使经过加速的电子穿过汞蒸气，并测量电子流随加速电压的变化。实验发现，电流在特定电压下呈周期性下降，证明原子只能以离散的能量量子吸收能量，从而为玻尔原子模型中的能级量子化理论提供了实验证据。"
 CURIE_EXPERIMENT_EDDINGTON_TT: "[Scope.Var('year').GetValue]年，[Scope.Var('discoverer').GetFlagName]在日全食期间拍摄太阳附近恒星的影像，并通过测定恒星视位置的偏移，验证了太阳引力场对星光传播路径的弯曲作用。这一观测为广义相对论提供了首批重要的实验证据。"
 CURIE_EXPERIMENT_STERN_TT: "[Scope.Var('year').GetValue]年，[Scope.Var('discoverer').GetFlagName]使银原子束通过非均匀磁场。实验发现，原子束并未形成连续分布，而是分裂为两条彼此分离的轨迹。这一结果证实了空间量子化现象，并为揭示粒子的内禀量子自旋提供了关键依据。"
