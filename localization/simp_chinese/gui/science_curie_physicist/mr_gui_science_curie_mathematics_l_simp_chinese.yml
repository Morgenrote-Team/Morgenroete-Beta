 MR_CIRRUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$无"
 MR_CIRRUS_CLOUD: "卷云的形态变化极为丰富：有时呈孤立的云簇（图版35），有时如横贯蓝天的线条（图版33），有时又似分枝的羽毛状云缕，或末端带有云簇的弯曲线条。它们常排列成横贯天空的云带，形如子午线。由于透视作用，这些云带似乎汇聚于地平线上的一点，或两个相对的点（卷层云和卷积云也常参与形成此类云带）。\n\n卷云始终由冰晶构成，其透明的外观源于冰晶的细微分散状态。\n通常，卷云即使掠过日面，也不会明显减弱阳光。然而，当云层异常浓厚时，它们可能遮蔽阳光，使太阳的轮廓变得模糊。高层云的某些云片也可能产生类似现象，但卷云可凭借其耀眼的洁白色泽与丝绢般的边缘加以辨认。\n\n#Italic 摘自1930年《国际云图》#!"
 MR_CIRROCUMULUS_DESCRIPTION_LOC: "#lore 卷积云由高空中细小、蓬松的冰晶云团组成，排列成精致而细密的云纹。它们反映了高空气流的活动，有时也预示着对流层上部的不稳定性正在增强。#!"
 MR_CIRROCUMULUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$[GetPlayer.GetCustom('curie_montgolfier_balloon_researched_type')][GetTechnology('curtiss_montgolfier_balloon_tech').GetName]"
 MR_CIRROCUMULUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$[GetPlayer.GetCustom('curie_extreme_winds_condition_type')][GetHarvestConditionType('extreme_winds').GetName]"
 MR_CIRROCUMULUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$#G -10%#!$state_harvest_condition_extreme_winds_impact_mult$"
 MR_CIRROCUMULUS_CLOUD: "一般而言，卷积云是卷云和卷层云发生变化后形成的一种形态，这两种云均可能转变为卷积云（图版41）。在这种情况下，发生变化的云片往往仍会在局部保留某些纤维状结构。\n\n真正的卷积云并不常见，不应将其与高积云云层边缘的小块云片相混淆（图版41）。事实上，卷积云与典型高积云之间存在各种过渡形态。由于两者的形成过程相同，这种现象也在意料之中。在缺乏其他判别依据时，只有符合以下条件之一，才应将所观察到的云称为卷积云：\n\n1. 与卷云或卷层云存在明显联系（图版41）。\n2. 由卷云或卷层云演变而来（图版41）。\n3. 具有卷云一节所列举的某些冰晶云特征（第3页）。\n\n#Italic 摘自1930年《国际云图》#!"
 MR_CIRROSTRATUS_DESCRIPTION_LOC: "#lore 卷层云是一层纤薄、半透明的乳白色云幕，覆盖着部分或整个天空。其最显著的特征是常伴有晕象，即阳光或月光经冰晶折射后形成的光环或弧状光带。#!"
 MR_CIRROSTRATUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$[GetPlayer.GetCustom('curie_montgolfier_balloon_researched_type')][GetTechnology('curtiss_montgolfier_balloon_tech').GetName]"
 MR_CIRROSTRATUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$[GetPlayer.GetCustom('curie_moderate_rainfall_condition_type')][GetHarvestConditionType('moderate_rainfall').GetName]"
 MR_CIRROSTRATUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$#G 10%#!$state_harvest_condition_moderate_rainfall_impact_mult$"
 MR_CIRROSTRATUS_CLOUD: "范围广阔的卷层云云幕，尽管局部可能出现裂隙，最终却几乎总会覆盖整个天空。云幕的边缘有时平直而清晰（图版40），但更常呈现参差不齐或破碎的形态（图版37）。\n\n白昼时，只要太阳在地平线上方具有足够的高度，卷层云便不会厚到使地面物体的影子消失。\n\n外观相似的乳白色雾幕与卷层云云幕，可以通过晕象加以区分：太阳或月亮透过卷层云时，几乎总会产生这种光学现象。\n\n前文关于卷云透明程度及色彩的描述，在很大程度上同样适用于卷层云。\n\n#Italic 摘自1930年《国际云图》#!"
 MR_ALTOCUMULUS_DESCRIPTION_LOC: "#lore 高积云是由细小的球状、团块状或卷轴状云体组成的中层云片或云层，常成群分布于天空，有时预示着天气即将发生变化。#!"
 MR_ALTOCUMULUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$[GetPlayer.GetCustom('curie_reconnaissance_balloon_researched_type')][GetTechnology('curtiss_reconnaissance_balloon_tech').GetName]"
 MR_ALTOCUMULUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$[GetPlayer.GetCustom('curie_torrential_rains_condition_type')][GetHarvestConditionType('torrential_rains').GetName]"
 MR_ALTOCUMULUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$#G -10%#!$state_harvest_condition_torrential_rains_impact_mult$"
 MR_ALTOCUMULUS_CLOUD: "高积云的出现高度范围十分广泛。在较高的高度，高积云由细小的云块组成（图版21），外观与卷积云相似。然而，高积云不具有以下任何一种卷积云特征：\n\n1. 与卷云或卷层云存在联系。\n2. 由卷云或卷层云演变而来。\n3. 具有卷云一节所列举的、由冰晶物理结构产生的特征。\n\n在较低的高度，高积云可能由积云顶部向外扩展形成（图版25），因而容易与层积云混淆。按照分类惯例，如果云层中排列规则、轮廓清晰的最小云块，其最小视直径不超过太阳视直径的十倍，则应将其归为高积云。判断时应排除通常出现在云层边缘的孤立云块。\n\n#Italic 摘自1930年《国际云图》#!"
 MR_ALTOSTRATUS_DESCRIPTION_LOC: "#lore 高层云呈灰色或淡蓝色，形成层状或纤维状的云幕，往往均匀地铺展于天空。阳光通常只能透过云层隐约显现。#!"
 MR_ALTOSTRATUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$[GetPlayer.GetCustom('curie_reconnaissance_balloon_researched_type')][GetTechnology('curtiss_reconnaissance_balloon_tech').GetName]"
 MR_ALTOSTRATUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$[GetPlayer.GetCustom('curie_frost_condition_type')][GetHarvestConditionType('frost').GetName]"
 MR_ALTOSTRATUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$#G -10%#!$state_harvest_condition_frost_impact_mult$"
 MR_ALTOSTRATUS_CLOUD: "高层云出现的高度范围相当广泛，约在2000至5000米之间。\n\n较高的高层云云幕与外观相似的卷层云云幕，可以按照以下惯例加以区分：高层云不会产生晕象，地面物体的影子也不会清晰可见。\n\n较低的高层云云幕与外观相似的雨层云云幕，则可以根据以下特征加以区分：雨层云的颜色更加深暗、均匀，呈灰色，不会出现任何发白的亮光或纤维状结构；其云底轮廓也无法清晰辨认，而是由于降水的影响呈现模糊、柔和的外观，即使这些降水可能并未到达地面。\n\n按照分类惯例，雨层云始终会完全遮蔽太阳和月亮，而高层云仅在较厚的部分遮蔽它们；当太阳或月亮位于较薄的云层后方时，仍可能透过云层显现（图版18）。\n\n#Italic 摘自1930年《国际云图》#!"
 MR_NIMBOSTRATUS_DESCRIPTION_LOC: "#lore 雨层云是一层厚重、暗灰色且形态模糊的云层，云底通常较低，足以完全遮蔽太阳，其轮廓也常因降水而变得模糊不清。#!"
 MR_NIMBOSTRATUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$[GetPlayer.GetCustom('curie_early_aviation_researched_type')][GetTechnology('curtiss_early_aviation_tech').GetName]"
 MR_NIMBOSTRATUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$[GetPlayer.GetCustom('curie_flood_condition_type')][GetHarvestConditionType('flood').GetName]"
 MR_NIMBOSTRATUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$#G -10%#!$state_harvest_condition_flood_impact_mult$"
 MR_NIMBOSTRATUS_CLOUD: "雨层云通常按照以下过程形成：一层高层云逐渐增厚并降低，最终转变为雨层云。在雨层云下方，通常会逐渐形成位置极低、形态破碎的云体。起初，这些云体彼此孤立，随后逐渐融合，形成近乎连续的云层，但透过云层间的空隙，通常仍能看到上方的雨层云。根据这些低云呈现的形态更接近积云还是层云，可分别称其为碎积云或碎层云。\n\n一般而言，降雨要到这些极低的云体形成之后才会开始。此时，它们可能被降水遮蔽，甚至在降水作用下逐渐消散。随着降水发展，垂直方向的能见度将显著降低。\n\n#Italic 摘自1930年《国际云图》#!"
 MR_STRATOCUMULUS_DESCRIPTION_LOC: "#lore 层积云呈灰色或灰白色，由较大的球状、团块状或卷轴状云体组成，常形成斑驳的大片云层。它们通常成片覆盖天空，但云块之间也可能留有空隙。#!"
 MR_STRATOCUMULUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$[GetPlayer.GetCustom('curie_meteorology_researched_type')][GetTechnology('curtiss_meteorology_tech').GetName]"
 MR_STRATOCUMULUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$无"
 MR_STRATOCUMULUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$无"
 MR_STRATOCUMULUS_CLOUD: "浓厚的层积云（不透光层积云）中的各个云块往往趋于完全融合。在某些情况下，整个云层可能进一步转变为雨层云。当层积云原有的云块结构完全消失，且由于降水形成的雨丝使云底不再具有清晰的边界时，便应将其称为雨层云。\n\n层积云可以转变为层云（图版10），反之亦然。由于层云的位置更低，其云块看起来十分宽大，轮廓也更加柔和，以致观察者无法再辨认出规则排列的球状云块和波状结构。只要这些结构仍然清晰可见，就应继续将其归类为层积云（图版10）。\n\n#Italic 摘自1930年《国际云图》#!"
 MR_STRATUS_DESCRIPTION_LOC: "#lore 层云是一层低垂而均匀的灰色云幕，外观近似升腾的雾气，常使天空显得阴沉。层云有时会带来毛毛雨，尤其常见于秋冬季节。#!"
 MR_STRATUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$[GetPlayer.GetCustom('curie_montgolfier_balloon_researched_type')][GetTechnology('curtiss_montgolfier_balloon_tech').GetName]"
 MR_STRATUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$无"
 MR_STRATUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$无"
 MR_STRATUS_CLOUD: "真正的层云通常使天空呈现一种极具辨识度的朦胧外观，但在某些情况下，也可能因此与雨层云混淆。当出现降水时，两者的区别便十分明显：雨层云会产生连续性降雨，有时也会降雪。雨滴可能细小而稀疏，也可能较大且密集，至少其中一部分雨滴较大；而层云只会产生毛毛雨，即由极为细小、分布密集的水滴组成的降水。\n\n没有降水时，颜色深暗且均匀的层云云层很容易被误认为雨层云。然而，雨层云的云底始终呈现柔和、模糊的外观，这是由于大范围的下垂降水迹象，即雨幡所致。其外观十分均匀，难以辨认明确的细节。\n\n相比之下，层云的外观更加「干燥」。即使云层整体十分均匀，仍可观察到某些明暗变化，以及较为透明的部分。这些颜色较浅的区域意味着云层相对较薄，与层积云中卷轴状和球状云块之间的空隙相对应，只是范围大得多。而雨层云则仿佛仅受到微弱的照明，呈现出一种光线从内部透出的感觉。\n\n#Italic 摘自1930年《国际云图》#!"
 MR_CUMULUS_DESCRIPTION_LOC: "#lore 积云是一种轮廓分明、云体浓厚的云，通常具有平坦的云底和圆顶状、花椰菜状的云顶，在阳光照耀下呈现明亮的白色。典型的积云常是晴好天气的象征。#!"
 MR_CUMULUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$[GetPlayer.GetCustom('curie_montgolfier_balloon_researched_type')][GetTechnology('curtiss_montgolfier_balloon_tech').GetName]"
 MR_CUMULUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$[GetPlayer.GetCustom('curie_optimal_sunlight_condition_type')][GetHarvestConditionType('optimal_sunlight').GetName]"
 MR_CUMULUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$#G 10%#!$state_harvest_condition_optimal_sunlight_impact_mult$"
 MR_CUMULUS_CLOUD: "典型的积云（图版1）形成于晴朗的天气，其产生源于白昼的对流气流。积云通常在早晨出现，随后逐渐发展，并在傍晚前后不同程度地消散。\n\n积云的云底通常呈灰色，云体结构均匀，即从云底到云顶均由圆润的云块组成，不具有纤维状结构（图版2）。即使积云发展得十分旺盛，也只能产生较弱的降水。\n\n当积云向上发展至高积云所在的高度时，其顶部有时会出现一层轻薄、弥散的白色云幕，形状大致呈透镜状，边缘具有细致的条纹状或片状结构。这层云幕通常呈弓形，可能覆盖积云的多个圆顶，最终又被继续向上发展的云顶穿透（图版2）。\n\n#Italic 摘自1930年《国际云图》#!"
 MR_CUMULONIMBUS_DESCRIPTION_LOC: "#lore 积雨云是一种垂直发展极为旺盛的巨大云体，可高耸至对流层顶附近，外形宛如巍峨的塔楼或山峰。其上部常呈现纤维状结构，或形成由冰晶构成的云冠。#!"
 MR_CUMULONIMBUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$[GetPlayer.GetCustom('curie_early_aviation_researched_type')][GetTechnology('curtiss_early_aviation_tech').GetName]"
 MR_CUMULONIMBUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$[GetPlayer.GetCustom('curie_hailstorm_condition_type')][GetHarvestConditionType('hailstorm').GetName]"
 MR_CUMULONIMBUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$#G -10%#!$state_harvest_condition_hailstorm_impact_mult$"
 MR_CUMULONIMBUS_CLOUD: "即使积雨云的外形与高度发展的积云难以区分，只要其上部可见，仍可通过云体结构的差异辨认其本质特征，即纤维状结构与积云状结构之间的区别。无论积云多么厚重、垂直发展多么旺盛，除非其云顶全部或部分已经转变（图版5），或正在转变（图版4）为卷云状云体，否则均不应将其归类为积雨云。\n\n积雨云上部的卷云状部分虽然形态多变，但在某些情况下会向外铺展，形成铁砧状结构（图版5）。这一引人注目的变种称为#Italic 砧状云#!。\n\n#Italic 摘自1930年《国际云图》#!"
 MR_NOCTILUCENT_DESCRIPTION_LOC: "#lore 夜光云是夜空中纤细而轻薄的云幕，常呈波纹状或条带状，散发着银白色至明亮蓝色的微光。当太阳已沉至地平线以下较深处时，它们仍能反射阳光，因而显现于暮色之中。#!"
 MR_NOCTILUCENT_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$[GetPlayer.GetCustom('curie_high_altitude_balloon_researched_type')][GetTechnology('curtiss_high_altitude_balloon_tech').GetName]"
 MR_NOCTILUCENT_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$[GetGeographicRegion('curie_geographic_region_noctilucent').GetName]。"
 MR_NOCTILUCENT_BONUS_LOC: "无"
 MR_NOCTILUCENT_CLOUD: "夜光云的外观与纤薄的卷云相似，但通常呈蓝色或银白色，偶尔也会呈现橙色至红色。它们在黑暗的夜空背景下格外醒目（第239页）。\n\n夜光云的物理性质目前尚不明确，但已有一些迹象表明，它们可能由极为细小的宇宙尘埃构成。\n\n迄今为止，人们仅在北半球中纬度偏北地区的夏季偶尔观测到发光的夜光云，且只有当太阳位于地平线以下5至13度时才能看到。测量结果表明，夜光云的高度位于75至90千米之间。\n\n#Italic 摘自1990年《国际云图》#!"
 MR_NACREOUS_DESCRIPTION_LOC: "#lore 珠母云是一种色彩绚丽、具有虹彩光泽的云，常呈透镜状或波浪状。在日出前或日落后，它们会闪耀出粉红、品红、青绿等鲜艳色彩，宛如天空中的珍珠母贝。#!"
 MR_NACREOUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$[GetPlayer.GetCustom('curie_high_altitude_balloon_researched_type')][GetTechnology('curtiss_high_altitude_balloon_tech').GetName]"
 MR_NACREOUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$极地"
 MR_NACREOUS_BONUS_LOC: "无"
 MR_NACREOUS_CLOUD: "珠母云（极地平流层云）的外观与卷云或杏仁状的高积云相似（第237页）。它们如同珍珠母贝一般，呈现出十分鲜明的虹彩。太阳位于地平线以下数度时，能够观察到最为绚丽的色彩。\n\n珠母云的物理性质目前尚不明确。人们认为，这些云可能由极为细小的水滴或球形冰粒构成。\n\n珠母云十分罕见。迄今为止，人们主要在苏格兰和斯堪的纳维亚地区观测到这种云。测量结果表明，挪威南部上空出现的珠母云位于21至30千米的高度。\n\n#Italic 摘自1990年《国际云图》#!"
