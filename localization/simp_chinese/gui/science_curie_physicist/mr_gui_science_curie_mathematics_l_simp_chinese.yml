 MR_PHYSICIST_MATHEMATICAL_INNOVATION_BUTTON: "数学创新水平"
 MR_PHYSICIST_MATHEMATICAL_INNOVATION_BUTTON_TT: "#T 数学创新#!\n当[concept_curie_mathematical_physicist]未执行其他任务时，即可开展此项目。\n\n你的[concept_curie_physicist]将帮助提高每周创新力上限，并降低研究超前时代科技所受到的惩罚。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_FORMULA_DISCOVERY_BUTTON: "新公式"
 MR_PHYSICIST_FORMULA_DISCOVERY_BUTTON_TT: "#T 新公式#!\n只要具备相应的技术条件，且仍有尚未发现的公式，数学家便可以推导出新的公式。每发现一个新公式，后续研究所需的物理数据量都会增加。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_IMPROVE_MATHEMATICS_BUTTON: "数学研究"
 MR_PHYSICIST_IMPROVE_MATHEMATICS_BUTTON_TT: "#T 促进数学发展#!\n数学家可以前往[GetBuildingType('building_university').GetName]，通过讲座和学术研讨会推广新的科学规范。\n\n建筑将获得的修正：\n$curie_building_throughput_add_modifier_with_tooltip$\n$curie_building_production_mult_modifier_with_tooltip$\n$curie_building_goods_input_mult_modifier_with_tooltip$\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_EXPERIMENT_BUTTON: "物理实验"
 MR_PHYSICIST_EXPERIMENT_BUTTON_TT: "#T 物理实验#!\n物理学家可以开展实验研究，一旦取得成功，便可能产生具有历史意义的重大成果。任何类型的物理学家均可开展此类实验。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_EXPERIMENT_POSSIBLE_TRIGGER_TT: "#default_text [GetPlayer.GetName]#R 未拥有#!#V $curie_physics_experiment_successful_modifier$#!或#V $curie_physics_experiment_failure_modifier$#![concept_modifier]。#!"
 MR_PHYSICIST_METEOROLOGICAL_OBSERVATION_BUTTON: "气象观测"
 MR_PHYSICIST_METEOROLOGICAL_OBSERVATION_BUTTON_TT: "#T 气象观测#!\n当[concept_curie_meteorological_physicist]未执行其他任务时，即可开展此项目。\n\n你的[concept_curie_physicist]将帮助提高每年获得的@curie_physical_data!#![concept_curie_physical_data]数量。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_WEATHER_STATION_EXPANSION_BUTTON: "气象站扩建花费"
 MR_PHYSICIST_WEATHER_STATION_EXPANSION_BUTTON_TT: "#T 扩建气象站#!\n在已建有观测站并掌握相应技术的条件下，[concept_curie_meteorological_physicist]可以扩建其中的气象站，以提高全国天气预报的准确性，并通过及时发布预警，更有效地应对极端天气事件。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 PHYSICIST_HAS_NO_WEATHER_STATION_PM_TT: "#default_text [GetPlayer.GetName]拥有一座[GetBuildingType('building_verrier_observatory').GetName]，使用#V $pm_curtiss_no_weather_station$[concept_production_method]。#!"
 PHYSICIST_HAS_EARLY_WEATHER_STATION_PM_TT: "#default_text [GetPlayer.GetName]拥有一座[GetBuildingType('building_verrier_observatory').GetName]，使用#V $$pm_curtiss_early_weather_station$[concept_production_method]。#!"
 PHYSICIST_HAS_WEATHER_STATION_PM_TT: "#default_text [GetPlayer.GetName]拥有一座[GetBuildingType('building_verrier_observatory').GetName]，使用#V $pm_curtiss_weather_station$[concept_production_method]。#!"
 MR_PHYSICIST_IMPROVE_METEOROLOGY_BUTTON: "气象站网络"
 MR_PHYSICIST_IMPROVE_METEOROLOGY_BUTTON_TT: "#T 气象观测站网络#!\n随着电报技术的兴起，气象学获得了一项重大优势：全国各地的气象数据能够在极短时间内完成传输与比对，从而为发布天气预报和气象预警提供条件。[concept_curie_meteorological_physicist]可以在建有[GetBuildingType('building_tesla_telegraph').GetName]的地区设立气象观测站，以应对各种天气现象。\n\n该建筑将获得以下修正：\n$curie_building_throughput_add_modifier_with_tooltip$\n$curie_building_production_mult_modifier_with_tooltip$\n$curie_building_goods_input_mult_modifier_with_tooltip$\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_IMPROVE_METEOROLOGY_TRIGGER_TT: "#default_text 至少有一个等级不低于1的[GetBuildingType('building_tesla_telegraph').GetName]，且没有三个[Concept('concept_modifier','$concept_modifiers|q$')]。#!"
 MR_PHYSICIST_AGRICULTURAL_WEATHER_SERVICE_BUTTON: "农业气象服务"
 MR_PHYSICIST_AGRICULTURAL_WEATHER_SERVICE_BUTTON_TT: "#T 农业气象服务#!\n 一名[concept_curie_meteorological_physicist]可以专门从事农业领域的天气预报工作，为农民建立一项为期三年的气象服务，向他们预警各种气象事件。气象学家的经验越丰富，服务效果就越好。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_ADVANCED_WEATHER_STATION_TRIGGER_TT: "#default_text [GetPlayer.GetName]拥有一座[GetBuildingType('building_verrier_observatory').GetName]，使用#V $pm_curtiss_weather_station$或$pm_curtiss_modern_weather_station$[concept_production_method]。#!"
 MR_PHYSICIST_50_OR_MORE_EXPERIENCE_TRIGGER_TT: "#default_text [concept_curie_meteorological_physicist]至少有#V 50#![concept_academics_experience]。#!"
 MR_PHYSICIST_MARINE_WEATHER_SERVICE_BUTTON: "航运天气预报"
 MR_PHYSICIST_MARINE_WEATHER_SERVICE_BUTTON_TT: "#T 航运天气预报#!\n一名[concept_curie_meteorological_physicist]可以专门为海军提供天气预报，以预警海上可能出现的危险。该项目将持续三年。气象学家的经验越丰富，项目成效就越好。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_5_FLOTILLAS_TRIGGER_TT: "#default_text [GetPlayer.GetName]至少#V 有五艘舰船#!。#!"
 MR_PHYSICIST_FOUND_MAGNETIC_ASSOCIATION_BUTTON: "磁学协会"
 MR_PHYSICIST_FOUND_MAGNETIC_ASSOCIATION_BUTTON_TT: "#T 创立磁学协会#!\n成立一个致力于研究地球磁场的国际性磁学协会，将使创始国在收集物理学数据方面获得多项优势，并提供少量科技加成。此外，还将解锁地磁台生产方式。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_MAGNETIC_RESEARCH_STATION_BUTTON: "地磁台"
 MR_PHYSICIST_MAGNETIC_RESEARCH_STATION_BUTTON_TT: "#T 建造地磁台#!\n我们可以扩建现有观测站，增设一座地磁台，以便更加深入地研究地球磁场。为此，我们需要加入磁学协会。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_NO_MAGNETIC_OBSERVATORY_TRIGGER_TT: "#default_text [GetPlayer.GetName]拥有一座使用#V 地磁台#![concept_production_method]的[GetBuildingType('building_verrier_observatory').GetName]。#!"
 MAGNETIC_ASSOCIATION_TRIGGER_TT: "#default_text The Magnetic Association has been established.#!"
 MR_NO_MAGNETIC_ASSOCIATION_TRIGGER_TT: "#default_text 磁学协会#R 未#!成立。#!"
 MR_PHYSICIST_MAGNETIC_ATLAS_BUTTON: "地磁图集"
 MR_PHYSICIST_MAGNETIC_ATLAS_BUTTON_TT: "#T 编纂地磁图集#!\n利用我们收集的大量地磁数据，物理学家可以编纂一部自己的地磁图集。这项成果将显著加深我们对物理学的认识。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_MAGNETIC_OBSERVATORY_TRIGGER_TT: "#default_text [GetPlayer.GetName]拥有一座使用#V 地磁台#![concept_production_method]的[GetBuildingType('building_verrier_observatory').GetName]。#!"
 MR_PHYSICIST_15_MAGNETIC_DATA_TRIGGER_TT: "#default_text [GetPlayer.GetName]拥有至少#V 15#!@curie_magnetic_data![concept_curie_magnetic_data]。#!"
 MR_PHYSICIST_FORMULA_PHYSICAL_DATA_TRIGGER_TT: "#default_text [GetPlayer.GetName]至少拥有#V [GetPlayer.MakeScope.ScriptValue('curie_formula_cost_value')]#!@curie_physical_data![concept_curie_physical_data]。#!"
 MR_PHYSICIST_FORMULA_POSSIBLE_TRIGGER_TT: "#default_text 现有科技已允许研究至少一个尚未发现的公式。#!"
 MR_PHYSICIST_IMPROVE_MATHEMATICS_TRIGGER_TT: "#default_text 至少有一个等级不低于1的[GetBuildingType('building_university').GetName]使用#O 数学与技术重心#!，且没有三个[Concept('concept_modifier','$concept_modifiers|q$')]。#!"
 GEOMAGNETIC_RESEARCH_VAR: "#tooltip:[GetRawTextTooltipTag('GEOMAGNETIC_RESEARCH_VAR_TT')] @curie_magnetic_data![GetPlayer.MakeScope.GetVariable('curie_magnetic_data_var').GetValue|0+]/[GetGlobalVariable('curie_total_magnetic_data_global_var').GetValue|V0]#!"
 GEOMAGNETIC_RESEARCH_VAR_TT: "#header 地磁数据#!\n[GetPlayer.GetName]收集的@curie_magnetic_data![concept_curie_magnetic_data]/#V 所有国家#!收集的@curie_magnetic_data_var![concept_curie_magnetic_data]（[GetPlayer.MakeScope.GetVariable('curie_magnetic_data_var').GetValue|0+]/[GetGlobalVariable('curie_total_magnetic_data_global_var').GetValue|V0]）"
 MATHEMATICAL_INNOVATION_VAR: "#tooltip:[GetRawTextTooltipTag('MATHEMATICAL_INNOVATION_VAR_TT')] @curie_mathematical_innovation![GetPlayer.MakeScope.GetVariable('curie_national_mathematical_innovation_var').GetValue|0+]/[GetGlobalVariable('curie_international_mathematical_innovation_global_var').GetValue|V0]#!"
