 MR_BIOLOGIST_CAN_FIND_YELLOW_FEVER_PATHOGEN_HAS_DESCRIPTION_CHECKMARK_TT: "$panum_checkmark_loc$$panum_has_yellow_fever_description_tt$"
 MR_BIOLOGIST_CAN_FIND_YELLOW_FEVER_PATHOGEN_HAS_MICROORGANISMS_TT: "\n@simple_box![GetPlayer.GetName]拥有#V [GetPlayer.MakeScope.ScriptValue('theiler_yellow_fever_microorganism_requirement_value')|0]或更多#!@theiler_microorganisms_texticon![Concept('concept_theiler_microorganism','$concept_theiler_microorganisms|q$')]（当前为[GetPlayer.MakeScope.GetVariable('theiler_microorganisms_var').GetValue|0]）。"
 MR_BIOLOGIST_CAN_FIND_YELLOW_FEVER_PATHOGEN_HAS_MICROORGANISMS_CHECKMARK_TT: "\n$panum_checkmark_loc$[GetPlayer.GetName]拥有#V [GetPlayer.MakeScope.ScriptValue('theiler_yellow_fever_microorganism_requirement_value')|0]或更多#!@theiler_microorganisms_texticon![Concept('concept_theiler_microorganism','$concept_theiler_microorganisms|q$')]（当前为[GetPlayer.MakeScope.GetVariable('theiler_microorganisms_var').GetValue|0]）。"
 MR_BIOLOGIST_SIT_BUTTON: "昆虫不育技术"
 MR_BIOLOGIST_SIT_BUTTON_TT: "#T 昆虫不育技术#!\n凭借现有的广泛技术条件，一名获得政府支持的生物学家可以研究一种彻底根除这种棘手的螺旋蝇的方法，从而提高受害地区的农业产量。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_SCREWWORM_FLY_TRIGGER: "#default_text [GetPlayer.GetName]至少拥有一个位于[GetHarvestConditionType('theiler_screwworm_fly_condition').GetName]栖息区域内的地区。#!"
 MR_BIOLOGIST_LEAD_ARSENATE_BUTTON: "砷酸铅"
 MR_BIOLOGIST_LEAD_ARSENATE_BUTTON_TT: "#T 砷酸铅#!\n目前使用的无机杀虫剂虽然已对某些昆虫表现出初步防治效果，但仍有相当大的改进空间。以铅为基础的砷酸盐可以取代“巴黎绿”。生物学家可以在化学家的协助下研制这种新型杀虫剂，以迅速消灭科罗拉多马铃薯甲虫和苹果蠹蛾。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_MOTH_OR_BEETLE_STATE_TRIGGER: "#default_text [GetPlayer.GetName]至少拥有一个位于[GetHarvestConditionType('theiler_potato_beetle_condition').GetName]或[GetHarvestConditionType('theiler_codling_moth_condition').GetName]栖息区域内的地区。#!"
 MR_BIOLOGIST_SODIUM_ARSENITE_BUTTON: "亚砷酸钠"
 MR_BIOLOGIST_SODIUM_ARSENITE_BUTTON_TT: "#T 亚砷酸钠#!\n传统杀虫剂、驱蚊剂，甚至火焰喷射器，都无法彻底消灭蝗虫。要解决这一问题，就必须考虑采取更大规模的防治措施！\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_LOCUST_STATE_TRIGGER: "#default_text [GetPlayer.GetName]至少拥有一个位于[GetHarvestConditionType('locust_swarm').GetName]栖息区域内的地区。#!"
 MR_BIOLOGIST_CALCIUM_ARSENATE_BUTTON: "砷酸钙"
 MR_BIOLOGIST_CALCIUM_ARSENATE_BUTTON_TT: "#T 砷酸钙#!\n要遏制棉花种植业遭受的巨额损失，就必须采取更为强有力的防治措施。仅靠砷酸铅恐怕还不够，或许需要一种效果更为显著的药剂。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BOLL_WEEVIL_STATE_TRIGGER: "#default_text [GetPlayer.GetName]至少拥有一个位于[GetHarvestConditionType('theiler_boll_weevil_condition').GetName]栖息区域内的地区。#!"
 MR_BIOLOGIST_NICOTINE_SULFATE_BUTTON: "硫酸烟碱"
 MR_BIOLOGIST_NICOTINE_SULFATE_BUTTON_TT: "#T 硫酸烟碱#!\n过去，人们曾将烟草提取物视为驱除农田茶蚊盲蝽的民间偏方。如今，需要一种新的工业化防治方法！生物学家可以在化学家的协助下研制这种新型杀虫剂，以迅速消灭茶蚊盲蝽。\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_TEA_MOSQUITO_STATE_TRIGGER: "#default_text [GetPlayer.GetName]至少拥有一个位于[GetHarvestConditionType('theiler_tea_mosquito_condition').GetName]栖息区域内的地区。#!"
 MR_BIOLOGIST_GRAFTING_BUTTON: "嫁接"
 MR_BIOLOGIST_GRAFTING_BUTTON_TT: "#T 嫁接#!\n迄今为止，所有用于防治葡萄根瘤蚜的化学药剂均未取得成效。或许，我们能够在剧毒杀虫剂之外找到解决之道？\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_GRAPE_PHYLLOXERA_STATE_TRIGGER: "#default_text [GetPlayer.GetName]至少拥有一个位于[GetHarvestConditionType('theiler_grape_phylloxera_condition').GetName]栖息区域内的地区。#!"
 BIOLOGICAL_CONGRESS_BUTTON: "Host Biological Congress"
 BIOLOGICAL_CONGRESS_BUTTON_TT: "#T Host Biological Congress#!\nWith the revolution in microbiological research and the simultaneous spread of dangerous epidemics and pests, the need to share discoveries at international congresses for the benefit of humanity grew. With a bit of luck, knowledge about pathogens, vaccines and pesticides can be exchanged.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGICAL_BREAKTHROUGH_TRIGGER_TT: "#default_text [GetPlayer.GetName] has the #V Biological Breakthrough#! Modifier.#!"
 MR_BIOLOGY_5_COUNTRIES_WITH_BIOLOGIST_TRIGGER_TT: "#default_text 5 or more countries have a [concept_theiler_biologist].#!"
 MR_BIOLOGICAL_CONGRESS_COOLDOWN_TRIGGER_TT: "#default_text There #V hasn't been a Biological Congress#! in the #V last 5 years#! (the last Host doesn't have the \"Hosted a Biological Congress\" Modifier).#!"