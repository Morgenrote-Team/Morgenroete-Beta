l_simp_chinese:
 mr_botanical_expedition_no_current_expedtion_tt: "#default_text [GetPlayer.GetName]没有活跃的[concept_dubois_botanical_expedition]。#!"
 je_ito_botanical_expedition: "植物学考察"
 je_ito_botanical_expedition_reason: "Your [concept_dubois_naturalist] is currently on a [concept_dubois_botanical_expedition] to gather [ROOT.Var('ito_botanical_expedition_target_var').GetFlagName|V] and new [Concept('concept_dubois_specimen','$concept_dubois_specimens|q$')].\n$mr_divider_for_je$\nEach month the Expedition will gain progress towards gathering [ROOT.Var('ito_botanical_expedition_target_var').GetFlagName|V]. Over a Botanical Expedition, a maximum of 10 [concept_ito_medicinal_plants] can be gathered\n\nAdditionally the expedition will yield [Concept('concept_dubois_specimen','$concept_dubois_specimens|q$')] each month and has a chance of events that will add additional [Concept('concept_dubois_specimen','$concept_dubois_specimens|q$')] or even special plants.\n$mr_divider_for_je$\nCurrent yield of the Expedition: @dubois_specimen! [GetPlayer.MakeScope.Var('ito_total_specimen_current_botanical_expedition_var').GetValue|*V0] [Concept('concept_dubois_specimen','$concept_dubois_specimens|q$')]\nEstimated monthly yield: @dubois_specimen! [ROOT.ScriptValue('ito_botanical_expedition_monthly_specimen_rounded_value')|+=0] [Concept('concept_dubois_specimen','$concept_dubois_specimens|q$')]"
 je_ito_botanical_expedition_goal_tt: "$ito_botanical_expedition_progress_bar$进度条已到达#V 12#!。"
 ito_botanical_expedition_progress_bar: "探险进度"
 ito_botanical_expedition_progress_bar_desc: "探险进度：#v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#!([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)]/12)"
 ito_botanical_expedition_progress_bar_monthly_progress_tt: "每月进度"
 ito_naturalist_is_dead_tt: "#default_text 你没有[concept_dubois_naturalist]。"
 dubois.390.t: "植物学考察队归来"
 dubois.390.d: "Our [concept_dubois_botanical_expedition] led by [SCOPE.sCharacter('dubois_naturalist_scope').GetFullName] has returned. In total they gathered [SCOPE.GetValue('medicinal_herbs_scope_value')|0+] [ROOT.Var('ito_botanical_expedition_target_var').GetFlagName|V] and  @dubois_specimen! [GetPlayer.MakeScope.Var('ito_total_specimen_current_botanical_expedition_var').GetValue|*0+] [Concept('concept_dubois_specimen','$concept_dubois_specimens|q$')]"
 dubois.390.f: "“我在这里发现了一种迷人的植物，还没人认识呢！我要叫它[SCOPE.sCharacter('dubois_naturalist_scope').GetLastNameNoFormatting]！”"
 dubois.390.g: "欢迎回来！"
 ito_total_specimen_collected_on_expedition_tt: "A total of @dubois_specimen! [GetPlayer.MakeScope.Var('ito_total_specimen_current_botanical_expedition_var').GetValue|*V0] [Concept('concept_dubois_specimen','$concept_dubois_specimens|q$')] have been collected on this [concept_dubois_botanical_expedition]."
