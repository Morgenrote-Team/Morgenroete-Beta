 curtiss_altitude_under_5000_custom_1: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]展开了一场高空飞行的壮举。[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]轻装简行，敏捷地攀上了[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]，气球以惊人的速度直冲云霄，转瞬之间，地面的喧嚣与人群已然消失无踪。俯瞰大地，景象磅礴，令人心驰神往。尽管此时已攀升至惊人的高度，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName]与云海之间仍有一段距离。当气压计显示高度为#p [ROOT.Var('new_balloon_altitude_var').GetValue]#!米时，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName]首先使用气象仪器采集了各类数据，随后才缓缓开启阀门，悠然下降，结束这次壮美的空中旅程。"
 curtiss_altitude_under_9000_custom_1: "[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球腾空而起。为了实现尽可能飞得更高的目标，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]必须尽量减轻气球的重量。\n起初，地面上的房屋变得越来越小，直到缩成一个个小点。随后，气球飘入云层，四周仿佛笼罩着浓雾，细小的水滴开始凝结在气象观测仪器上。气温逐渐下降。幸运的是，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName]穿了足够保暖的衣服。\n随着高度不断增加，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName]渐渐感到呼吸越来越困难。当气球升至#p [ROOT.Var('new_balloon_altitude_var').GetValue]#!米的高度时，[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]开始进行必要的测量。随后，漫长的下降过程开始了。"
 curtiss_altitude_under_12000_no_tools_custom_1: "空气变得越来越稀薄。[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]开始难以集中注意力，[ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis]的脑袋一阵阵剧痛。瞥了一眼气压计后，[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]发现自己如今所处的高度已经超过了世界上任何一座山峰。人类只有借助飞行才能抵达这样的高度。\n与此同时，[ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis]的身体开始颤抖。穿越云层时，衣服早已被浸透，而气温也已经降至零下好几度。[ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName]终于支撑不住，跪倒在地。[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]费了好大劲才勉强打开阀门，开始下降。随后，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName]便失去了知觉。\n回到地面后，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName]终于苏醒了过来。更准确地说，是在一张温暖的床上醒来的。幸运的是，[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]被人及时发现了。"
 curtiss_altitude_under_12000_tools_custom_1: "即使带着空气瓶，这次飞行也称不上轻松。冷气逼人，寒意在[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]全身上下蔓延，连站起来都十分困难。但是考虑到这个海拔高度下数据的重要性，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName]还是强忍着开始测量。气压计显示此时的海拔为#p [ROOT.Var('new_balloon_altitude_var').GetValue]#!米。比世界上所有的山峰都要高。但不幸的是，从这里几乎什么都看不到，厚密的云层几乎遮住了一切。\n测量工作完成后，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName]开始从[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]的气囊中放气，气球开始缓缓下降。"
 curtiss_altitude_under_16000_no_tools_custom_1: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]几乎已经无法挪动自己的身体，甚至连寒冷都感觉不到了，只剩下沉重而急促的呼吸。这里的空气极其稀薄。[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]不知道自己能否从这场冒险中活下来。\n[ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName]艰难地抓住一根绳索，支撑着身体站了起来。[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]必须够到那个阀门。就差一点了。眼前的一切渐渐暗了下来。[ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName]用牙齿咬住阀门，开始转动它。随后，[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]失去了知觉。\n好温暖。[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]这是在哪里？几个模糊的身影从[ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHim]眼前掠过，渐渐显现出人的轮廓。一名女子递给[ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHim]一碗汤。看来，[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]终究还是活了下来。"
 curtiss_altitude_under_16000_tools_custom_1: "氧气瓶缓解了空气稀薄带来的不适，但严寒依然穿透了厚重的衣物。[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]冷得瑟瑟发抖。不过，气球[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]似乎已经升到了它所能达到的最高高度。[ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName]开始为科学学会进行测量。气压计显示的高度为#p [ROOT.Var('new_balloon_altitude_var').GetValue]#!米。这真是一个令人难以置信的高度。遗憾的是，云层遮挡了视线，使得能见度并不理想。完成测量后，[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]开始排出气囊中的气体。气球缓缓下降，重新飘向地面。"
 curtiss_altitude_over_16000_custom_1: "密封增压舱内相对温和，外部气温却已酷寒难耐。万幸的是，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]置身于舱室庇护之中，免受严寒侵袭。此处呼吸亦维持顺畅。从观测窗望去，[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]俯瞰着脚下的地表；伫立于这般高度，大地的弧线已清晰可见。仰望天顶，蔚蓝的天空逐渐隐褪为愈发深邃的墨黑。云层在大地上空缓缓流转，自高处俯瞰宛如团团棉花糖。待气压计读数升至#p [ROOT.Var('new_balloon_altitude_var').GetValue]#!米时，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName]在增压舱的防护下开启气阀，引导气球缓缓向地面飘降。"
 santos_distance_under_400_custom_1: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]立下志向，意图驾乘[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球尽可能飞往更远之地。当气球在山川原野之上漂游时，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName]始终专注于各项操纵事务：[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]既须寻得恰当的飞行高度以最大程度顺应风向，亦须密切观测气象变幻，并修正航向以避开阻碍。在历经整整#p [ROOT.Var('curtiss_balloon_time_record_var').GetValue]#!小时的飞行后，气球平稳降落于地面。[ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName]向当地一名居民询问着陆方位后，便借助地图测算此次航程；经核算，实际飞行距离应在#p [ROOT.Var('new_balloon_distance_var').GetValue]#!公里左右。"
 santos_distance_under_800_custom_1: "驾驶气球实现尽可能远距离的飞行绝非易事，既须候得利好的气象条件，亦依托于优良的飞行器性能与精准的领航操纵。[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]深信自身已齐备这般要素，遂驾乘[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球启航升空，立志创下新的航程纪录。航行途中，[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]掠过万千地貌，横越了起伏的丘陵与蜿蜒的河流。整场飞行期间天候始终维持晴好，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName]在历经#p [ROOT.Var('curtiss_balloon_time_record_var').GetValue]#!小时的航程后得以平稳着陆。\n降至地面后，[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]向当地居民问明了着陆方位，并据此测算出本次飞行的总航程约为#p [ROOT.Var('new_balloon_distance_var').GetValue]#!公里。"
 santos_distance_under_2000_custom_1: "飞行期间的气象条件十分理想，且全程维持晴好。在空中航行过程中，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]得以纵览形形色色的地理风貌——从规模宏大的繁华都会、幽僻的村落聚落，直至人烟罕至的荒原旷野。然而，面对如此遥远的航程，仅在日间操纵气球飞行断然不足，[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球在夜色中依然持续滑翔穿梭于天际。直至整整航行#p [ROOT.Var('curtiss_balloon_time_record_var').GetValue]#!小时之后，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName]才决定返航降落。气球缓缓向地面飘降，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName]随即从当地居民口中获知了[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]当前的准确方位。经核算，其累计飞行距离应在#p [ROOT.Var('new_balloon_distance_var').GetValue]#!公里左右——这无疑是一段蔚为壮观的漫长航程。"
 curtiss_distance_over_2000_custom_1: "若要完成[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]所设想的如此长距离的飞行，必须储备充足的给养、配备数名随行人员，并依托理想的气象条件。所乘的[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球备齐了充裕的补给，并有另外两名同行者协助该气球驾驶员。万幸的是，当天的天候亦十分利好。于是，气球自[ROOT.GetCountry.GetCapital.GetCityHubName]拔地升空，在空中平稳航行了数小时。傍晚时分，三人享用了由自带的葡萄酒与烤鸡构成的美餐。在星月交辉的夜色中，他们轮流警戒值守。在整整#p [ROOT.Var('curtiss_balloon_time_record_var').GetValue]#!小时的飞行历程中，该气球横越了广袤的空间跨度。最终，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName]累计航行了#p [ROOT.Var('new_balloon_distance_var').GetValue]#!公里——这是一段几近不可想象的壮举航程。"
 curtiss_custom_death_sea: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]尝试开展一次打破纪录的全新飞行。在此过程中，他偏离了既定航线并漂向外海。其后所有搜寻与搜救[ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHim]的行动皆无功而返。[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]大概已不幸罹难溺毙于大海之中。"
 curtiss_custom_death_hydrogen_ignition: "当搭载着[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]的[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球攀升至高空时，无人料到这竟会成为[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]的最后一次飞行。待升至约900米高度时，意外骤然发生。不知因何缘故，气球内部充填的氢气被引燃。转瞬之间，整个气囊便化作火海，吊篮随即坠向地面。[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]在撞击中当场遇难。"
 curtiss_custom_death_firework: "在傍晚的[ROOT.GetCountry.GetCapital.GetCityHubName]上空飞行时，[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球径直驶入了一场烟火表演的空域。腾空爆裂的礼花弹绽放出斑斓绚丽的七彩华光，气球旋即亦被烈焰吞噬，如同烟火般猛烈燃烧。气球自空中疾速下坠并最终坠毁，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]在坠毁事故中不幸罹难。"
 curtiss_custom_death_redneck: "在飞越[ROOT.GetCountry.GetName]的乡村地区上空时，[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球遭到当地一名居民在狂喜之下发射的数发子弹击中。受此影响，气球迅速漏气并坠毁于地面。除[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]不幸罹难外，开枪射击者亦在此次事故中丧生。"
 curtiss_custom_death_belltower: "在进近着陆阶段，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]所乘的气球失控漂入城区。为免同民房相撞，[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]试图重新拉升高度；然而在此番慌乱处置之下，他未能察觉气球正径直撞向一座高塔。最终，气球猛烈撞毁于塔身，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName]被当场甩出吊篮；在此过程中，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName]的颈椎据推断已发生骨折。"
 curtiss_custom_death_stork: "今日，[ROOT.GetCountry.GetName]上空发生了一起令人匪夷所思的飞行事故！[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]所操纵的[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球在空中遭到一只鹳鸟或其他禽类的撞击。无论实情究竟为何，该鸟的尖喙刺穿了气囊外皮；而在其挣扎脱困的过程中，气囊被撕扯出更大的破口，导致内部气体大量逸散泄露。气球随即干瘪失压并坠毁于地，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]在撞击中当场遇难。"
 curtiss_custom_death_balloon_duel: "在关于著名歌剧演员对谁倾心的问题上，我们的气球驾驶员[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]与另一名气球驾驶员之间意见不一。他们认为唯一的解决方法是进行气球决斗。于是，他们登上各自的气球，开始互相射击。这场激烈的火拼持续了将近一个小时——可能是因为从飞行的气球中击中目标并不容易。最终，一颗子弹击中了[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]，并致[ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHim]丧生。[ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis]的气球，[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]随着尸体飘向远处，数小时后才在乡村地区被找到。"
 curtiss_custom_death_stray_bullet: "不知何故，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]驾驶[ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis]气球过分接近了交战前线。敌军部队旋即对气球展开射击。子弹虽未击中[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球，却致命地击中了[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]。该气球随后在战场上空持续盘旋良久，最终坠落于我方战线一侧。"
 curtiss_custom_death_power_line: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]在操纵[ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis]的[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球降落期间，过分贴近了高压输电线。气球随后挂滞于电线之上，不仅导致电流贯穿[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]的躯体，更引燃了气球引发剧烈爆燃。[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]的具体致命死因尚未查明，但其遇难过程无疑极为惨烈。"
 curtiss_custom_death_seagull: "在近海区域飞行时，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]遭遇了一群海鸥的围袭；这群海鸥的目标正是[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]随身携带充当给养的鱼类。尽管[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球本身未遭损伤，但其中一只海鸥剧烈撞击了[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]的头部，致使[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]当场失去意识并跌出吊篮。[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]因伤势过重不治身亡，而[ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis]的气球则在海鸥的阵阵尖鸣声中随风飘远。"
 curtiss_custom_death_lightning: "在雷暴天气中操纵气球绝非明智之举。[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]在[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]遭到雷击时亲身体会到了这一代价。[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球随即起火爆燃并因此坠毁，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]在坠毁事故中不幸罹难。"
 curtiss_custom_death_sabotage: "原本一场寻常的飞行迅速演变为一场灾难。飞行中途，气球的数根系绳骤然断裂，致使[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球的吊篮坠地摔碎。[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]在此过程中不幸丧生。经对残骸进行调查，发现系绳上存在明显的蓄意切割痕迹，显然是一起蓄意破坏事件。该案幕后真凶目前尚未查明。"
 curtiss_custom_death_updraft: "在一次飞行中，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]所操纵的[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球卷入了一股极其强劲的上升气流之中。气球持续攀升；随着高度不断增加，呼吸愈发困难，气温亦骤降至酷寒。尚无法确定[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]究竟系窒息而亡抑或冻毙，但他的生命确实终结在了这一极高海拔空域之中。"
 curtiss_custom_death_stampede: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]在一次气球飞行中降落于一片牧场之上。折叠收纳[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球必定惊扰了马群。现场痕迹表明，马群受惊后向四处溃逃狂奔，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]被其中数匹撞击并最终踩踏致死。"
 curtiss_custom_death_failed_fixing: "在尚处于低空阶段时，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]察觉到[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球出现异常：气体自侧面发生泄露，导致气球高度略有下降。[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]决定在飞行途中排除故障，并攀爬至气囊外皮上方。据部分目击者报告，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]失足坠落于地面，[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]被发现时已确认死亡。在内部气体充分逸散后，气球于不久后亦自行飘降落回地面。"
 curtiss_custom_death_weak_spot: "今日，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]自高空坠落，并在撞击中当场身亡。最初事发缘由尚不明朗，但不久后便搜获到了[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球的残骸。吊篮底部裂有一处巨大破口，表明该吊篮存在严重做工缺陷，在[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]的自身重量重压之下发生结构断裂破损。[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]的罹难乃是我国的重大损失。"
 curtiss_custom_death_heart_attack: "[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球于今日坠毁，搜救人员从残骸中搜获了[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]的遗体。事故起因起初极难判定：鉴于空气曾自气囊排出，最初怀疑是[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]故意操纵了排气阀门。随后不久，一名医生经检验发现[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]在坠毁前便已身亡；他似乎在空中突发心脏病，由此引发的肌肉痉挛致使排气阀门被无意触发启动。"
 curtiss_custom_death_balloon_crash: "今日，[ROOT.GetCountry.GetName]上空发生了一起令人难以置信的意外！两具气球竟在空中发生了相撞，这听来虽不可思议，却确凿无疑。[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]所乘的[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球受损并疾速坠落。气球在地面剧烈弹跳撞击，导致[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]当场殒命。另一具气球虽得以成功着陆，但其飞行家因这场惨剧而心力交瘁，仍拼尽全力试图搭救[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]；遗憾的是，一切抢救努力终告徒劳。"
 curtiss_custom_death_fighter_intercepted: "当我国气球飞行家[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]误飞越过国境线时，突遭一架不明飞行器的截击。[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球多次中弹并迅速丧失高度。尚未等气球坠至地面，该飞行器再度发起攻击并致命地击中了[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]。邻国当局对此次袭击事件予以全盘否认，坚称与此毫无瓜葛。"
 curtiss_custom_death_tornado: "尽管一场暴风雨正在大平原上空肆虐，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]依然决意驾驶[ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis]的[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球升空。气球在狂风中被剧烈旋转甩动，但[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]毫无退意，执意继续[ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis]的飞行。在毫无察觉的情况下，一道龙卷风已自[ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHim]身后悄然成形，将气球越吸越近。直至气球即将被龙卷风风暴卷入的千钧一发之际，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]方才警觉危险；遗憾的是，一切为时已晚。由于深埋于残骸废墟之下，其遗体直至数日之后才被搜寻人员发现。"
 curtiss_custom_death_fall: "目前尚无法查明事发的具体细节，但[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]不知何故自[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球上坠落，并在撞击中当场身亡。在缓慢飘回地面后，气球于数日后被搜寻人员发现。气球内部并未发现任何能够推断[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]具体遭遇的蛛丝马迹。"
 curtiss_custom_death_envelope_falls_apart: "在升空后不久，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]便与[ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis]的[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球一同坠毁。初看之下，气囊外皮仿佛遭到了撕扯粉碎；但在进一步仔细勘验后，调查人员发现实则是气囊的缝合线在空中发生了开裂解体。气球由此彻底破损散架并坠毁于地，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]不幸在撞击中当场遇难。"
 curtiss_custom_killed_by_indigenous_people: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]驾驶[ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis]的[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球降落在了原住民的领地内。当地土著此前从未见过气球，将其误认作邪恶的妖魔。尚未等[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]现身露面，[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]便遭子弹射杀。数日后，我方的一支巡逻队在损毁的气球残骸中发现了遗体。"
 curtiss_custom_death_cigar: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]在[ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis]的最后一次飞行中遭遇坠毁。当[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球从天际坠落时，正剧烈燃烧着熊熊烈火。现场迹象表明，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]似乎在飞行途中抽了雪茄，并不慎引燃了吊篮。大火随即蔓延至气球气囊，最终导致坠毁。在这次事件中，吸烟无疑带来了致命后果。"
 curtiss_custom_killed_crash_mountainside: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]试图驾驶[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球飞越连绵的山峦。在此过程中，[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]遭遇了一场致使能见度降至零的暴风雪。[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]试图拉升高度以摆脱暴风雪，但气球被强劲的狂风捕获，猛烈撞击在山岳的悬崖峭壁之上。[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]在撞击中受了致命伤，其遗体直至数日之后才被搜寻队伍寻获。"
 curtiss_custom_death_hail_storm: "众人都曾劝阻[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]切勿在此等恶劣天候下乘气球升空，但他依然一意孤行。随着[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]搭乘[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球升入空中，天候愈发险恶不适。阴云中最初倾盆泼下暴雨，不久便转为密集的冰雹。部分冰雹大如拳头，将气球的气囊外皮撕扯出越来越多的破洞。气球随即急剧失控下坠并坠毁于地，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]在坠机事故中不幸罹难。"
 curtiss_custom_killed_alcohol: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]在驾驶[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球升空前饮下了数瓶葡萄酒。显而易见，酒精对飞行毫无益处，醉酒更会使气球航行险象环生。然而，其人之死并非因为跌出气球，亦非意外引燃了气球——不，祸根在于起飞后不久便抛弃了所有配重沙袋。气球随之如离弦之箭般径直冲向高空，转瞬便消失无踪。直至数日之后，残骸才被搜寻人员发现。[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]当时依然身处吊篮之中，显然是在喝完最后一瓶葡萄酒后活活渴死。"
 curtiss_custom_killed_opium: "在[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]乘[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球升空飞行后，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]的遗体在旷野田间被寻获。起初人们尚无法理解[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]为何会自气球上坠落，直至数日后该气球同样飘降着陆，人们在其中搜获了鸦片。显而易见，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]在飞行途中吸食了鸦片，随后因不明缘故跌出了气球。"
 curtiss_custom_death_acrobatics: "在万众瞩目之下，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]尝试借助一根绳索从一具系留气球横越转移至另一具气球。起初，看似游刃有余；但紧接着一股强劲的阵风呼啸而至，将其猛然从绳索上掀落。[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]直坠入围观的人群正中，因伤势过重当场身亡。"
 curtiss_custom_death_goose: "与往常每次飞行一样，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]总会带上一只象征幸运的鹅一同乘气球升空。二者搭乘[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球启航远行。数小时后，气球顺利着陆；令人惊愕的是，气球上仅剩下一名乘客——那只鹅，而[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]却已下落不明。即便在搜寻数日之后，仍未能寻获[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]的踪影。"
 curtiss_custom_death_mile_high_club: "[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球的吊篮在田野中被寻获，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]与一名女子横卧其中。诡异的是，二人皆未着寸缕。关于其中缘由众说纷纭：多数人推测二人死于失温症，并在临死前脱去了衣物——这在冻死案例中屡见不鲜，因患者往往会突发极度燥热的错觉；但亦有推测认为，二人当时正在行……苟且之事。"
 curtiss_custom_death_zoo_crocodile: "整场飞行本是一次彻底的成功，唯有着陆环节出了差池……在世间所有的着陆地点中，动物园的鳄鱼池大概算得上气球最糟糕的降落地点之一。当[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球最终坠入池水正中时，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]的性命便迅速走到了尽头。尚未等任何人施救干预，群鳄便已一拥而上饱餐一顿。"
 curtiss_custom_death_cheap_parts: "节俭通常是一种美德，但在涉及气球结构部件时却绝非如此。[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球的系绳购自要价最低廉的供应商，借此省下了数镑开销；然而遗憾的是，其实际质量远比承诺的要恶劣得多。飞行途中，数根系绳骤然崩断，吊篮发生严重倾斜，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]跌出气球并在撞击中当场身亡。"
 curtiss_custom_death_disappearance: "自[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]搭乘[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球升空启航以来，已整整过去了一个月。在升空后不久，所有踪迹便彻底断绝——既未见气球本体，亦未曾寻获残骸或遗体。我方的搜寻行动同样无功而返。[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]与其气球一同凭空蒸发，无人知晓究竟发生了何事。"
 curtiss_custom_death_train: "由于一连串不幸的巧合，[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球在降落过程中遭到一列火车撞击并被彻底摧毁，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]在此过程中不幸丧生。据调查，气球似乎是在浓雾中着陆，致使[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]未能察觉气球正横陈于铁轨之上。仅仅数秒之后，火车便全速撞上了气球。列车本身未受损坏，除[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]外亦无其他人员伤亡。"
 curtiss_custom_death_skyscraper: "在飞越城市上空时，[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球被一股强劲气流捕获，径直吹向摩天大楼。[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]对此无能为力，只得眼睁睁看着建筑在眼前步步逼近。气球撞向大楼外立面并挂滞受困；片刻之后，气囊外皮被撕裂解体，气球猛然坠入深渊。[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]径直跌入了一处蔬菜摊位，将新鲜卷心菜砸得粉碎。遗憾的是，这些蔬菜并未能有效缓冲[ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis]坠落的势头，[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]当场气绝身亡。"
 curtiss_custom_death_disease: "伴随着一句“不过是场小感冒！”，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]告辞动身，登上了[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球。然而实情似乎远非寻常感冒，数日后人们搜获了气球以及[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]毫无生机的遗体。[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe|U]似乎已罹患恶疾不治身亡。面对气球航行中的诸多凶险，这实属一种相当罕见的致死缘由。"
 curtiss_custom_death_slipped: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]搭乘[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球开展了一次航行，[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]身旁有一位友人随行。在飞行中途，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]不知何故必定失足滑倒——或许是微雨打湿了吊篮，又或许纯属疏忽大意。无论如何，[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]失去了平衡并跌出气球，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]在此过程中不幸丧生。同行的友人历经千难万险才操纵气球重新着陆，所幸未曾受伤。"
 curtiss_custom_death_ladder: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]并未如人们通常设想的气球飞行家那样在冒险历程中英勇牺牲；不，[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]是在检修[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球时丧生的。正当[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]检查承压状态下的气球气囊是否存在结构薄弱处时，[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]抓扶梯子失手踩空摔下。遗憾的是，这是一次极度致命的意外跌落，最终导致了[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]的死亡。"
 curtiss_custom_death_angry_worker: "在最后一次飞行中，[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球的数根系绳断裂，致使吊篮坠地摔毁，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]在撞击中当场身亡。在对气球残骸进行调查时，发现系绳上存在切割刀痕。调查表明，受雇于[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]的一名劳工在夜间蓄意破坏了系绳，意图谋杀[ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHim]。该名工人扬言道：“这个吸血鬼落得这般下场纯属罪有应得！这人残酷剥削我们，就是为了能让自己逍遥快活地玩弄气球！”"
 curtiss_custom_death_sabotage_slaver: "正当[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球降落于田野且[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]走出吊篮之际，[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]遭到了数名雇佣兵的制伏与杀害。我方的调查表明，一名奴隶主此前下达密令，要求除掉[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]，以遏制并削弱废奴运动的发展势头。何等凄惨的横祸！"
 curtiss_custom_death_shot_over_prison: "在搭载一名主顾进行气球飞行期间，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]操纵的[SCOPE.GetRootScope.GetCountry.GetCustom('curtiss_balloon_type')]气球误入了西斯卡监狱空域，狱警随即对气球开火射击。[ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName]虽毫发无损地脱险，却又在安尼斯堡附近卷入了与奥德里斯科帮的一场交火。在此过程中，[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]中弹并自吊篮坠落。随行的乘客据推断其后迫降于河流附近，但截至目前依然毫无踪迹。"