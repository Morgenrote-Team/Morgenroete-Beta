l_simp_chinese:
 glossary_curie_complex_analysis: "$curie_complex$$curie_analysis$"
 glossary_curie_complex_analysis_desc: "#b;italic $glossary_curie_complex_analysis$#!是研究复数域上函数性质的数学分支。复数由实部与虚部构成。复分析广泛应用于物理学与工程学，尤其在波动现象、流体力学和电路分析等领域发挥着重要作用。"
 glossary_curie_differential_equation: "$curie_differential$$curie_equation$"
 glossary_curie_differential_equation_desc: "#b;italic $glossary_curie_differential_equation$#!是描述未知函数及其导数之间关系的方程。微分方程能够刻画物理量随时间或空间的变化规律，是建立行星运动、种群增长、气候系统和热传递等数学模型的重要工具。"
 glossary_curie_fourier_analysis: "$mr_fourier$$curie_analysis$"
 glossary_curie_fourier_analysis_desc: "#b;italic $glossary_curie_fourier_analysis$#!是一种将复杂信号、波形或函数分解为不同频率的正弦与余弦分量的数学方法。它是现代信号处理、图像压缩、音频传输和电信技术的重要理论基础。"
 glossary_curie_non_euclidean_geometry: "非欧$curie_geometry$"
 glossary_curie_non_euclidean_geometry_desc: "#b;italic $glossary_curie_non_euclidean_geometry$#!是研究不满足欧几里得平行公设的几何体系的数学分支。在球面几何中，测地线可以相交；在双曲几何中，过直线外一点可以作出多条与已知直线不相交的直线。非欧几何不仅拓展了人们对空间结构的认识，也为广义相对论中的弯曲时空几何奠定了重要的数学基础。"
 glossary_curie_group_theory: "群$curie_theory$"
 glossary_curie_group_theory_desc: "#b;italic $glossary_curie_group_theory$#!是研究群这一代数结构及其性质的数学分支，尤其适用于描述对称性与变换。群论为分析几何图形、化学分子、亚原子粒子及密码算法中的对称性提供了严格的数学语言。"
 glossary_curie_linear_algebra: "线性代数"
 glossary_curie_linear_algebra_desc: "#b;italic $glossary_curie_linear_algebra$#!是研究向量空间、向量、矩阵及线性变换的数学分支。它为三维计算机图形学、机器学习算法、量子力学和大规模数据分析提供了核心数学基础。"
 glossary_curie_abstract_algebra: "抽象代数"
 glossary_curie_abstract_algebra_desc: "#b;italic $glossary_curie_abstract_algebra$#!是研究群、环、域等代数结构，而非具体数值的数学分支。它探讨这些结构的基本运算规律与对称性质，为现代密码学、编码理论和理论物理学提供重要的数学基础。"
 glossary_curie_navier_stokes_equations: "纳维–斯托克斯方程"
 glossary_curie_navier_stokes_equations_desc: "#b;italic $glossary_curie_navier_stokes_equations$#!是一组描述流体运动的偏微分方程，用于刻画具有黏性的流体的动力学行为，在天气预报、洋流预测、空气动力学及管道流动模拟等领域具有重要应用。"
 glossary_curie_mathematical_logic: "数理逻辑"
 glossary_curie_mathematical_logic_desc: "#b;italic $glossary_curie_mathematical_logic$#!是运用数学方法研究形式逻辑的学科，主要探讨形式证明系统、真值、可计算性及形式系统的局限性，为计算理论、软件设计和人工智能提供重要的理论基础。"
 glossary_curie_analytical_number_theory: "解析数$curie_theory$"
 glossary_curie_analytical_number_theory_desc: "#b;italic $glossary_curie_analytical_number_theory$#!是运用微积分、复分析等分析方法研究整数性质的数学分支，主要涉及素数分布、模形式以及加性数论中的各类问题。"
 glossary_curie_algebraic_number_theory: "代数数$curie_theory$"
 glossary_curie_algebraic_number_theory_desc: "#b;italic $glossary_curie_algebraic_number_theory$#!是运用抽象代数方法研究整数及代数数性质的数学分支，主要探讨数域中的整除性、素因子分解及相关代数结构，并为现代数论与部分公钥密码体制提供理论基础。"
 glossary_curie_em_field_equations: "电磁场方程"
 glossary_curie_em_field_equations_desc: "#b;italic $glossary_curie_em_field_equations$#!即麦克斯韦方程组，是描述电场、磁场及其与电荷、电流之间关系的一组基本方程。它揭示了电磁波的存在及其传播规律，为理解光、电路和无线通信奠定了理论基础。"
 glossary_curie_set_theory: "集合$curie_theory$"
 glossary_curie_set_theory_desc: "#b;italic $glossary_curie_set_theory$#!是研究集合及其性质的数学基础分支，探讨无穷、关系与函数等基本概念，并为现代数学的公理化体系提供重要的理论基础。"
 glossary_curie_topology: "拓扑学"
 glossary_curie_topology_desc: "#b;italic $glossary_curie_topology$#!是研究空间在拉伸、弯曲等连续变形下保持不变的性质的数学分支，重点关注连通性、连续性及空间结构，并应用于网络分析、数据分析和凝聚态物理学等领域。"
 glossary_curie_functional_analysis: "泛函分析"
 glossary_curie_functional_analysis_desc: "#b;italic $glossary_curie_functional_analysis$#!是研究函数空间、无穷维向量空间及其上的算子的数学分支。它综合运用线性代数、分析学与拓扑学的方法，为量子力学、微分方程及其他数学物理理论提供重要的数学框架。"
 glossary_curie_lie_theory: "李理$curie_theory$"
 glossary_curie_lie_theory_desc: "#b;italic $glossary_curie_lie_theory$#!是研究连续对称性及其相关代数结构的数学理论，主要涉及李群、李代数及其表示。它建立了微积分、几何学与抽象代数之间的重要联系，并广泛应用于量子力学和广义相对论。"
 glossary_curie_representation_theory: "表示$curie_theory$"
 glossary_curie_representation_theory_desc: "#b;italic $glossary_curie_representation_theory$#!是研究如何通过向量空间上的线性变换来表示抽象代数结构的数学分支。它使复杂的代数对称性能够借助矩阵等工具加以分析，在粒子物理学和化学等领域具有重要应用。"
 glossary_curie_algebraic_topology: "代数拓扑学"
 glossary_curie_algebraic_topology_desc: "#b;italic $glossary_curie_algebraic_topology$#!是运用抽象代数方法研究拓扑空间的数学分支，通过将空间的几何与拓扑性质转化为代数不变量，分析其连通性、孔洞及其他结构特征，并应用于拓扑数据分析等领域。"
 glossary_curie_class_field_theory: "类域$curie_theory$"
 glossary_curie_class_field_theory_desc: "#b;italic $glossary_curie_class_field_theory$#!是代数数论的重要理论，主要研究数域及更一般的整体域的阿贝尔扩张，揭示数域的算术性质与互反律之间的深刻联系，是现代数论和算术几何的重要理论基础。"
 glossary_curie_relativity_theory: "相对$curie_theory$"
 glossary_curie_relativity_theory_desc: "#b;italic $glossary_curie_relativity_theory$#!是描述时间、空间、运动与引力之间关系的基本物理理论，包括狭义相对论和广义相对论。它揭示了时间与空间的统一性，并以时空曲率解释引力现象，为现代天体物理学和卫星导航技术奠定了重要理论基础。"
 glossary_curie_quantum_mechanics: "量子力学"
 glossary_curie_quantum_mechanics_desc: "#b;italic $glossary_curie_quantum_mechanics$#!是描述原子及亚原子尺度物理现象的基本理论。它以量子态和概率性测量结果刻画微观世界，解释波粒二象性、量子纠缠等现象，并为半导体技术与量子计算提供理论基础。"
 glossary_curie_proof_theory: "证明$curie_theory$"
 glossary_curie_proof_theory_desc: "#b;italic $glossary_curie_proof_theory$#!是数理逻辑的一个分支，将数学证明本身视为形式化的数学对象，研究证明的结构、形式系统的一致性以及可证明性的范围与局限。"
 glossary_curie_cryptography: "密码学"
 glossary_curie_cryptography_desc: "#b;italic $glossary_curie_cryptography$#!是研究如何运用数学方法与密码技术保护信息安全的学科，旨在防止未经授权的信息获取，并保障通信内容的机密性及其他安全属性。"
 glossary_curie_algorithm_theory: "算法理$curie_theory$"
 glossary_curie_algorithm_theory_desc: "#b;italic $glossary_curie_algorithm_theory$#!是研究解决计算问题的系统化、有限步骤程序的数学分支。它通过分析计算规则及其执行过程，探讨问题的可计算性与求解方法，并为现代计算理论的发展奠定基础。"
 glossary_curie_lambda_calculus: "λ演算"
 glossary_curie_lambda_calculus_desc: "#b;italic $glossary_curie_lambda_calculus$#!是一种于20世纪30年代提出的形式化计算体系，用于研究函数抽象、函数应用、变量绑定及代换规则。它在探索可计算性、可判定性与形式逻辑的基础问题方面发挥了重要作用，并成为现代函数式程序设计的重要理论基础。"