 santos.655.t1: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]没能打破持续飞行纪录"
 santos.655.t2: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]创造了我国新的持续时间最长的气球飞行纪录"
 santos.655.t3: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]驾驶[SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]的气球飞得比过去所有人都高！"
 santos.655.d1: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]尝试驾驶[SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]的气球飞行尽可能长的时间。然而，其取得的#b #n [ROOT.Var('new_balloon_time_var').GetValue]#!小时#!飞行留空时间，未能打破我国此前保持的#b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#!小时#!纪录。[SCOPE.sCharacter('santos_balloonist_scope').GetSheHe|U]日后定会再次发起挑战。"
 santos.655.d2: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]驾驶[SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]的气球为我国创下了全新的最长留空飞行纪录！凭借#b #p [ROOT.Var('new_balloon_time_var').GetValue]#!小时#!的飞行时间，[SCOPE.sCharacter('santos_balloonist_scope').GetSheHe]打破了我国此前保持的#b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#!小时#!纪录；但遗憾的是，这一成绩仍不足以打破由[GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon]保持的#b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#!小时#!世界纪录。"
 santos.655.d3: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]驾驶[SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]的气球创下了全新的最长留空飞行世界纪录！凭借#b #p [ROOT.Var('new_balloon_time_var').GetValue]#!小时#!的飞行时间，[SCOPE.sCharacter('santos_balloonist_scope').GetSheHe]不仅打破了我国此前保持的#b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#!小时#!纪录，更显著超越了由[GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon]保持的#b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#!小时世界纪录#!。"
 santos.655.f1: "“我这次没成功，但下次我一定要成功！”"
 santos.655.f2: "“谁在乎那种纪录？我想要的是世界纪录！”"
 santos.655.f3: "“手到擒来！”"
 santos.655.g: "祝下次好运！"
 santos.655.h: "干得漂亮！"
 santos.655.i: "太棒了！恭喜！"
 santos.656.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName]因恐高而放弃了气球飞行"
 santos.656.d: "尽管[SCOPE.sCharacter('santos_balloonist_scope').GetFullName]声称自己进行过多次飞行，但其人在我国的第一次十米海拔飞行时发现自己恐高，因此放弃了气球飞行。"
 santos.656.f: "“太糟糕了！两周前我还在高空飞翔，现在……现在我甚至连梯子都爬不上了！”"
 santos.656.g: "多么不幸……"
 santos.656.h: "啊！还有别的气球飞行家我们可以赞助吗？"
 santos.670.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName]死于一次气球飞行事故"
 santos.670.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName]在驾驶[SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]的气球飞行时坠落遇难。我们因此失去了一位航空英雄。"
 santos.670.f: "[SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloonist_death_type')]"
 santos.670.g: "糟透了！"
 santos.670.h: "糟糕！还有别的气球飞行家我们可以赞助吗？"
 santos.671.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName]现在是一个经验丰富的气球飞行家"
 santos.671.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName]已经完成了多次气球飞行并获得许多相关经验。他现在被视作一位经验丰富的气球飞行家，因为他清楚自己在做什么。"
 santos.671.f: "“别怕！我已经做过几十次了！”"
 santos.671.g: "好消息！"
 santos.672.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName]现在是著名气球飞行家"
 santos.672.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName]已经完成了上百次气球飞行，其中还打破了许多纪录。现在他已经是海内外著名人物了。"
 santos.672.f: "“[SCOPE.sCharacter('santos_balloonist_scope').GetFullName]？这不是那位气球飞行家吗？我真的很想见见他！”"
 santos.672.g: "太棒了！"
 santos.673.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName]在飞行中被彗星击中"
 santos.673.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName]在飞行中被彗星击中而死。"
 santos.673.f: "在搭乘[SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')]气球升空后不久，天际传来一声轰然巨响。地面上的人们目睹一道强光掠过长空，径直击中了[SCOPE.sCharacter('santos_balloonist_scope').GetFullName]的吊篮。气球随即起火燃烧并猛然坠入深渊。在残骸清理完毕后，人们搜寻到了[SCOPE.sCharacter('santos_balloonist_scope').GetFullName]的遗体。唯有我国的天文学家对这场意外倍感欣喜，因其得以借此勘验彗星的残留碎片。"
 santos.673.g: "[SCOPE.sCharacter('santos_balloonist_scope').GetSheHe]要是有对彗星的常识就好了……"
 santos.673.h: "啊，彗星，恶魔的亲朋好友……还有别的气球飞行家我们可以赞助吗？"
 santos.674.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName]在海滩上飞行时坠机遇难了"
 santos.674.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName]在飞行期间坠毁在海滩上并死亡。奇怪的是，在气球残骸上发现了一头鲸鱼。"
 santos.674.f: "在一个明媚宜人的日子里，[SCOPE.sCharacter('santos_balloonist_scope').GetFullName]沿着海滩驾气球翱翔。由于[SCOPE.sCharacter('santos_balloonist_scope').GetSheHe]始终未归，搜寻队随即被派出。不多时，残骸便被寻获；离奇的是，气球与吊篮竟在一具被砸得稀烂的鲸鱼尸骸之下被发现。邻村的一名酒鬼声称，他曾亲眼目睹一头鲸鱼与一盆矮牵牛从天而降，且鲸鱼不偏不倚径直砸中了气球。显然，这套说辞并未取信于人。然而耐人寻味的是，人们确实在附近发现了一盆完好无损的矮牵牛。这株矮牵牛略显凌乱枯槁，已被托付给当地一位植物学家悉心照料。\n\n[SCOPE.sCharacter('santos_balloonist_scope').GetFullName]那一颗金子般的心以及处变不惊的沉着气度，将永远为人铭记。"
 santos.674.g: "哦不，别再来了！"
 santos.674.h: "你好，大地！我们还能赞助其他气球飞行家吗？"
 santos.676.t: "气球飞行家去世"
 santos.676.d: "在数十年的[concept_santos_balloonist]生涯后，我们的前任#b #r 气球飞行家#!#!去世了。谁能取代这样一位卓越的探索者？"
 santos.691.t: "气球类型"
 santos.691.d: "更改气球的类型。改装将耗时半年；在此期间，该气球将暂不可用。"
 santos.691.f: "每种特化气球都会为其命名所对应的专精领域提供5%加成，并带来-5%惩罚。例如：远距离特化气球可获得#G +5%#!#V 飞行距离#!，但会承受#R -5%#!#V 飞行高度#!与#R -5%#!#V 留空时间#!惩罚。全能型气球则无增益亦无减益。"
 santos.691.g: "我们需要一具高空特化气球。"
 santos.691.h: "飞行距离方为王道。"
 santos.691.i: "时间就是一切！"
 santos.691.j: "一具好用的全能型气球便足够了"
 santos.691.k: "没事了。"
