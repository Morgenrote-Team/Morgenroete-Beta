 santos.651.balloonist: "我们资助了[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]，这位气球飞行家不断驾驶[SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]的[SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')]气球，尝试一次又一次愈发惊险的飞行。"
 santos.651.noballoonist: "我们现在没有赞助气球飞行家。因此，我们将基本不可能创造新的气球飞行纪录。我们可以开始赞助我们国家的气球飞行家，他会努力创造新纪录并为我们开发更好的气球。"
