 santos.650.t: "介绍我们新的气球飞行家"
 santos.650.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName]是一位志在突破气球飞行极限的勇敢气球家，渴望借助我们的力量再创辉煌。旧日的纪录必会作古，全新的科学奥秘即将揭晓。[SCOPE.sCharacter('santos_balloonist_scope').GetSheHe]坚信，[SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]凭借[SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')]，定能冲破云霄，攀登前所未至的高度。"
 santos.650.f: "“我要为祖国增光添彩！”"
 santos.650.g: "希望对[SCOPE.sCharacter('santos_balloonist_scope').GetHerHim]的投资能回本。带我到气球飞行UI那去。"
 santos.650.h: "祝你们好运！"
