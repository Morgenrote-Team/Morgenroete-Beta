 santos_balloon_crossing_event_wind_shear_title_flag: "风切变"
 santos_balloon_crossing_event_wind_shear_flag: "#t $santos_balloon_crossing_event_wind_shear_title_flag$#!\nThe wind has changed in the balloonist's favour. The balloon is practically gliding through the sky!\n\n#b The following factors make this outcome more likely:#!\n[concept_santos_balloonist] has the $santos_balloonist_experienced$, $santos_balloonist_hero$ or $ambitious$ [concept_character_trait].#!"
