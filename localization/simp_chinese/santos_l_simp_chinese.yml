 je_santos_balloon_record_reason: "纪录挑战分为飞行海拔、距离和留空时长三个类别。经过一段时间的准备后，气球飞行家将尝试打破其中一项纪录。即使只打破了全国纪录，也能获得少量科技研究进度加成。此外，气球飞行家始终会获得经验值，具体数值取决于挑战的成功程度。\n\n气球飞行家在挑战飞行纪录时，有#YELLOW 中等概率#!丧生。"
