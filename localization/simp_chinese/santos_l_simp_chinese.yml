 santos.653.d3: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]驾驶[SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]的气球创下了全新的高空飞行世界纪录！凭借#b #p [ROOT.Var('new_balloon_altitude_var').GetValue]#!米#!的飞行高度，[SCOPE.sCharacter('santos_balloonist_scope').GetSheHe]不仅打破了我国此前保持的#b #p [ROOT.Var('santos_balloon_altitude_record_var').GetValue]#!米#!纪录，更显著超越了由[GetGlobalVariable('santos_balloon_altitude_record_holder_global_var').GetCountry.GetFlagTextIcon]保持的#b #p [GetGlobalVariable('santos_balloon_altitude_record_global_var').GetValue]#!米世界纪录#!。"
