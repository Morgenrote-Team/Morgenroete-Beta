 santos_balloonist_hero_desc: "This daring balloonist has conquered a waterway or a mountain range!"
 santos.401.t: "选择飞越路线"
 santos.401.d: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] is still pondering which balloon [concept_santos_balloon_crossing] [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] should attempt. The destination of his journey must be chosen carefully—it could be his last..."
 santos.401.f: "“赶快备好塔夫绸和绳索，你们将见证世上最令人惊叹的奇观之一。”\n——约瑟夫-米歇尔·蒙哥尔费"
 santos.431.d: "成功飞越[Scope.Var('santos_balloon_crossing_target_var').GetFlagName]后，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]完成了一项非凡的壮举：经过数小时的坚持不懈，如今终于可以确认，这项挑战已被成功克服。阳光灿烂，碧空如洗，预示着气球飞行新时代的到来！"
 santos.431.g: "气球飞行家的一项非凡成就！"
 santos_add_crossed_crossing_country_effect_tt: "[GetPlayer.GetName] conquers this [concept_santos_balloon_crossing]"
 santos_add_crossed_crossing_effect_tt: "[GetPlayer.GetName] conquers this [concept_santos_balloon_crossing] #V for the first time in history!#!"
 santos_ballooning_on_timeout_tt: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] aborts the attempt to cross. There is a 35% chance that [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] will die in the process."
 santos_ballooning_on_fail_tt: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] makes a crash landing. There is a 50% chance that [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] will die in the process."
 santos_balloon_demoralized_modifier: "Demoralized Balloonist"
 je_group_santos_ballooning: "Morgenröte: [concept_santos_ballooning]"
 santos.441.t: "A Narrow Escape"
 santos.441.d: "Miraculously, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] managed to escape alive from the perilous crossing of the English Channel, despite all the adverse circumstances. However, this narrow escape from the jaws of death comes at a price: the balloon needs to be repaired again... and the balloonist isn't doing well either."
 santos.441.f: "'There is a savor of life and immortality in substantial fare. Like balloons, we are nothing till filled.' -Herman Melville"
 santos.441.g: "Is [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] traumatized?"
 santos_repair_balloon_effect_tt: "#default_text It will take #V a year#! to repair the [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')]!#!"
