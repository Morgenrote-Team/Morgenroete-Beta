 je_santos_balloon_adventure: "气球探险"
 je_santos_balloon_adventure_reason: "在充满冒险的旅途中，气球飞行者可以收集与其专业领域相关的物品。考古学家和民族学家收集文物；博物学家收集标本和化石；地质学家收集普通及稀有材料；气象学家收集地磁数据、物理数据和海洋学知识；而工程师则会带回技术方面的新见解。\n\n气球飞行者有#G 极小概率#!无法从旅途中生还。"
 santos.502.t: "气球飞行家从冒险中归来"
 santos.502.d: "经过数月的旅行，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]终于回到了[GetPlayer.GetNameNoFormatting]。好奇的围观者们正热切期盼着[ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis]的归来。[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe|U]一定有不少精彩的冒险故事可以讲述，而且[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]还带回了一些纪念品！"
 santos.502.f: "在彩虹之上的某个地方\n蓝色的鸟儿自由翱翔\n而你心中怀揣的那些梦想\n终有一天会成真\n\n总有一天，我会向星辰许愿\n醒来时，云朵已远远落在身后\n在那里，烦恼如柠檬糖般消融\n高高的烟囱顶端之上\n你会在那里找到我，噢"
 santos.502.g: "这位气球飞行家总算派上点用场了……"
 santos.503.t: "气球飞行家带回了一只动物"
 santos.503.d: "在最近一次冒险中，我们的气球飞行家再次克服了重重生死考验。然而，此行的收获却寥寥无几。不过，[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]倒是带回了另一件意想不到的礼物：一位新结识的动物朋友……"
 santos.503.g: "多么可爱的小猴子啊！真讨人喜欢！"
 santos.504.g: "多么可爱的小白鼬啊！真讨人喜欢！"
 santos.505.g: "多么可爱的小……等等，这到底是什么鬼东西？"
