 santos.653.d1: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]尝试驾驶[SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]的气球飞往尽可能高的天空。然而，其最终达到的#b #n [ROOT.Var('new_balloon_altitude_var').GetValue]#!米#!高度，未能打破我国此前保持的#b #p [ROOT.Var('santos_balloon_altitude_record_var').GetValue]#!米#!纪录。[SCOPE.sCharacter('santos_balloonist_scope').GetSheHe|U]日后定会再次发起挑战。"
