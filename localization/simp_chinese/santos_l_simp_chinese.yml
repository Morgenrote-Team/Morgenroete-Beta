 je_santos_balloon_crossing: "气球飞越挑战"
 je_santos_balloon_crossing_reason: "#p [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]目前正在飞越[Scope.Var('santos_balloon_crossing_target_var').GetFlagName]。#!\n\n气球飞越是[concept_santos_balloonist]所面临的最大挑战。每条[concept_santos_balloon_crossing]都可划分为三个难度等级之一，难度等级决定了负面事件发生的可能性。尤其是在最为艰险的路线上，这些事件可能迅速演变成灾难。\n\n气球飞行家的[concept_academics_experience]和[concept_character_trait]往往决定了会触发哪些事件。例如，雄心勃勃的气球飞行家倾向于施展令人惊叹的飞行技巧，以缩短飞行时间；而谨慎的气球飞行家则倾向于尽可能降低风险。此外，拥有气象学家特质的气球飞行家，或专职的[concept_curie_meteorological_physicist]，能够帮助抵御最为恶劣的天气条件。\n\n如果气球飞行家过于冒险，就有可能在旅途中丧生。如果一年后仍未完成飞越挑战，气球飞行家便会放弃尝试，且不会取得任何成果。\n\n气球飞行家在进行飞越挑战时，有#R 较高概率#!丧生。"
 santos_balloon_research_active_loc: "#p 当前项目已激活。#!\n\n[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]正在推动气球飞行研究。"
 santos_balloon_research_inactive_loc: "#n 该项目目前未激活。#!当气球飞行家不再忙于其他事务时，该项目便会重新激活。\n\n如果[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]没有忙于其他事务，[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]本可以进行愉快的观光飞行。"
