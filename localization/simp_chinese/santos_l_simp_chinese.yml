 santos.681.t: "戈登•贝内特杯"
 santos.681.d: "首届大型国际气球竞速赛的筹备工作正进行得如火如荼。来自世界各地的气球飞行家正齐聚[ROOT.GetCountry.GetCapital.GetCityHubName]，准备在这场长距离竞逐中一决高下。这项赛事已被视作一项传奇盛事，并将在未来数年内持续举办。"
 santos.681.f: "“在以往的所有航行中，我启程之时从未收到过如此多的真挚祝愿与一路相伴的温情；我也从未像准备这届1907年戈登•贝内特杯一样，投入过如此多的心血与筹备。1906年9月巴黎的那场竞逐刚一落幕，参加今年赛事的愿望便在我心头油然而生。我谨向德意志飞艇飞行员协会表示由衷的感谢，感谢他们选派我作为代表；我亦深切致谢海瓦尔德男爵与希尔德布兰特上尉，正是他们将庞大的‘波美拉尼亚’气球托付于我，才让我捧回了今年的桂冠。\n\n在此次航行中，北美在气球飞行与待客之道方面皆给我留下了最为深刻而美好的印象。我唯一的遗憾，便是这片土地若能再辽阔一些便更好了——那样我便能让气球发挥出全部的航程潜力，进而一举打破飞行距离的世界纪录。”——奥斯卡·埃尔布斯勒"
 santos.681.g: "太棒了！"
 notification_santos_gordon_bennett_cup_notification_name: "[GetPlayer.MakeScope.Var('santos_balloonist_var').GetCharacter.GetFullName]赢得戈登•贝内特杯"
 notification_santos_gordon_bennett_cup_notification_desc: "我们的气球飞行家赢得了传奇的戈登·贝内特杯，并获得了#G 25#![concept_academics_experience]。下一届赛事将在两年后于我国举行。"
