 je_santos_balloon_ride: "气球游览"
 je_santos_balloon_ride_reason: "[ROOT.GetCountry.GetCustom('santos_balloon_research_active_type')]除了推动气球技术创新之外，[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]还可以为建筑增设气球游览设施，主要包括纪念建筑、城市公园和游乐园。\n\n这是[concept_santos_balloonist]的默认项目。当气球飞行家没有忙于其他项目时，该项目便会自动进行。每当项目进度达到#V 36#!时，我们便会获得少量科技研究进度加成。如果存在[concept_monument]、[GetBuildingType('building_gaudi_park').GetName]或[GetBuildingType('building_gaudi_luna').GetName]，气球飞行家便会随机造访其中一处，并为其施加$santos_building_production_mult_modifier$修正。\n\n下一次获得研究进度加成的科技：[GetPlayer.MakeScope.GetCountry.GetCustom('santos_balloon_research_next_technology_type')]"
 je_santos_balloon_ride_active_loc: "#p 当前项目已激活。#!\n\n[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]正在进行愉快的观光飞行。"
