 tesla_states_with_irrigation_tt: "[GetPlayer.GetAdjective] 모든 주에 $tesla_state_trait_irrigation$ 주 특성이 부여됨 (현재 [GetPlayer.MakeScope.GetVariable('tesla_num_states_irrigation_var').GetValue|+0] / [GetPlayer.MakeScope.GetVariable('tesla_num_states_var').GetValue|V0])"
 tesla_irrigation_project_finished_engineer_loc: "\nDr. [GetPlayer.MakeScope.GetVariable('tesla_engineer_var').GetCharacter.GetLastName] worked on the new #b Irrigation Systems#! of [GetPlayer.GetName] and was able to extend it which massively improved our agricultural sector."
 gaudi.1111.t: "[GetPlayer.GetName]의 관개 시설"
 gaudi.1111.d: "우리 [concept_tesla_civil_engineer] [GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')](이)가 마침내 [GetPlayer.GetNameNoFormatting]의 근대적 관개 시설을 구축하는 사업을 마무리했다. 강을 다스리고 논밭으로 물을 끌어들였으니 이제 우리의 농업도 틀림없이 번성할 것이다!"
 gaudi.1111.f: "\"거센 강을 다스리다니. 요술도 자취를 감췄고. 이제는 그저 곧게 뻗은 수로일 뿐. 비버마저도 자취를 감췄군...\""
 gaudi.1111.g: "예기치 못한 결과로 이어지는 일이 없었으면 좋겠군..."
