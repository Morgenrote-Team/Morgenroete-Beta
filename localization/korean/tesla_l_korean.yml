 je_tesla_improve_power_plants_project_reason: "우리 [concept_tesla_electrical_engineer] [GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')](이)가 [ROOT.GetCountry.GetName]의 [GetBuildingType('building_power_plant').GetName] 현대화 사업에 주력하고 있습니다.\n$mr_divider_for_je$\n이 사업은 매달 진행도를 얻습니다. 진행도가 #V 24점#!에 도달하면 건물에 새로운 변화 요인이 부여됩니다. 변화 요인은 총 세 가지가 존재합니다. 각각의 새로운 변화 요인마다 진행도를 다시 채워야 합니다.\n$mr_divider_for_je$\n현재 건물: [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]의 [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_tesla_improve_power_plants_project_modifier_1_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_tesla_improve_power_plants_project_modifier_2_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_tesla_improve_power_plants_project_modifier_3_type')]\n\n남은 건물 수 (현재 건물 제외): [JournalEntry.MakeScope.Var('mr_number_of_remaining_list_entries_var').GetValue|V0]곳\n\n현재 월간 진행도: #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_electrical_research_progress_tt')] [GetPlayer.MakeScope.ScriptValue('tesla_monthly_electrical_engineering_progress_for_research_value')|+2]#!#!"
