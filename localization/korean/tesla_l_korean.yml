 tesla_topographic_map_project_new_priority_button_desc: "#T 우선하는 주 변경#!\n이 프로젝트에서 우선하는 [Concept('concept_state', '$concept_states$')]의 순서를 바꿉니다.\n#n 주의: 우선순위가 제대로 작동하려면 변경 전에 게임을 정지하는 것이 좋습니다.#!"
