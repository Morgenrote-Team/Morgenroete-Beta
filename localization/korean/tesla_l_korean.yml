 je_tesla_transatlantic_cable: "대서양 횡단 케이블"
 je_tesla_transatlantic_cable_reason: "해저 전신 케이블의 부설은 총 3단계로 구성됩니다. 1단계에서는 추가 투자자를 모집하고 계획에 나서게 됩니다. 2단계에서는 케이블을 부설합니다. 마지막 3단계에서는 시범 사용을 위한 최종 준비를 진행합니다.\n\n본 사업의 성공에는 두가지 변수가 좌우하는데, 바로 #O 케이블 부설 진행도#!와 #O 주주 신임도#!입니다. 부설 진행도는 건설 기간을 결정하며 [concept_tesla_engineer]의 실력에 따라 좌우됩니다. 주주 신임도는 회사의 [concept_executive]에 크게 의존합니다. 신임도가 0으로 떨어지면 이 사업은 가망이 없다는 여론 하에 사업 실패라는 결말을 맞이하게 됩니다. 어떤 대가를 치르더라도 신임도가 떨어지는 일은 피하는 것이 중요합니다.\n\n해저 케이블 부설은 반드시 성공으로 이어지지 않습니다. 실제 역사에서도 대서양 횡단 케이블을 처음 부설하려는 시도는 실패로 끝났습니다. 그러나 주주의 신임이 견고하다면 회사 측에서 그러한 좌절을 극복할 수 있습니다. 첫번째 시도가 실패로 끝났다면 두번째 시도에서는 성공할 가능성이 보장됩니다."
