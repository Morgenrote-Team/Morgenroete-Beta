 tesla.3001.t: "바다를 가로지르는 전신 케이블"
 tesla.3001.d: "업계를 선도하는 전신회사의 사장 [SCOPE.sCharacter('tesla_telegraph_boss_scope').GetFullName] 씨가 야심찬 계획을 내세웠다. 멀리 떨어진 대륙을 연결하고 즉각적인 통신으로 각국을 더욱 가깝게 만드는 해저 전신 케이블을 부설한다는 계획이다. 사업에 들어갈 예산을 마련하기 위해 신설 케이블 회사의 주식이 전격 발행에 나섰다. 사측에서는 이번 사업에 자신감이 있다는 증표로 정부의 참여를 공식적으로 건의하였으며, 이번 사업이 상업적 이익과 국가적 이익 모두에 부합한다고 주장하고 나섰다."
 tesla.3001.f: "그것은 선박도 신호선도 아닌, 잉크와 자신감으로 출발한다. 계약서가 체결되고, 사업계획서가 인쇄되고, 살롱과 증권거래소에서 연설이 이어진다. 지금 이 순간 해저 케이블은 약속인 동시에 질문으로만 존재한다. 그 질문은 바로 누가 미래에 투자할 것인가이다. 사장은 단결과 비전 그리고 발전을 이야기한다. 이제 정부는 전선과 해수를 다루는 사업에서 어떤 역할을 맡을지 결정해야 한다."
 tesla.3001.g: "이번 사업에 국가가 참여하겠다."
 tesla.3001.h: "사측에서 케이블 부설을 바라는 상황이니 그쪽에서 부담해야 하지 않겠나."
 tesla.3002.t: "투자 열풍"
 tesla.3002.d: "[SCOPE.sState('tesla_fund_state').GetName]의 야심찬 기업가와 금융가에서 해저 전신 케이블 부설 사업을 지원하기 위해 한자리에 모였다. 이들의 투자는 미래의 통신 체계를 확보하고 대양 횡단 시장에 조기에 진출하기 위한 전략적 움직임으로 평가받고 있다."
 tesla.3002.f: "투자자들은 자선가도 아니고 낭만적인 선구자도 아니다. 허나 그들은 정보의 가치를 잘 알고 있다. 정보가 얼마나 빨리 전달되는가, 얼마나 안전하게 도착하는가, 누가 그 흐름을 통제하는가 말이다. 케이블 회사에 자본을 투자하면서 거리 단위가 밀리초 단위로 측정되는 세상을 꿈꾸는 것이다. 이들의 열정을 진보의 징표로 보는 사람이 있는가 하면, 통신조차도 투기의 대상이 되었다는 신호로 여기는 사람도 있다. 어찌 되었든 이번 사업은 새로운 추진력을 얻어 앞으로 나아가고 있다."
 tesla.3002.g: "훌륭한 계획이오!"
 tesla.3003.t: "정략적 케이블?"
 tesla.3003.d: "[SCOPE.gsInterestGroup('tesla_fund_ig').GetName]의 각계 인사가 해저 케이블 사업에 투자하갰다는 의향을 공개적으로 밝혔다. 이들은 이전에 전신회사와는 별다른 인연이 없었지만 이번 예산 지원은 이념적, 전략적 측면에서 모두 의미가 큰 것으로 보인다. 근대화를 지지하는 동시에 주요 통신망에 대한 영향력을 확보하려는 전략적 움직임인 것이다."
 tesla.3003.f: "언뜻 보면 이번 제안은 자본 유입과 정치적 호의 면에서 환영할 만한 듯 보인다. 허나 그 투자의 이면에는 영향력의 문제가 깔려 있다. 유력 야당이 핵심 기반시설의 지분을 확보하게 된다면 시장역학은 물론 국가 정책의 균형까지도 뒤바뀔 수 있다. 통신망의 관리 주체, 즉 구축과 유지, 비용부담의 주체가 누군가는 결코 단순한 기술 문제가 아니다. 사내에서는 지금 문을 열어두면 나중에 다시 닫기 어려워질 수 있다는 우려가 나오고 있다."
 tesla.3003.g: "아것으로 이번 사업의 신뢰도를 높이게 되었군."
 tesla.3003.h: "이것으로 우리 공학자의 성과에 힘을 보태겠군."
 tesla.3003.i: "투자하겠다는 세력이 너무 막강해."
 tesla.3004.t: "투자를 꺼리는 사람들"
 tesla.3004.d: "[SCOPE.sState('tesla_fund_state').GetName] 지역의 자본가들이 해저 케이블 사업에 그다지 열의를 보이지 않고 있다. 적대적인 입장을 취하고 있진 않지만, 수익성과 장기적인 지속가능성에 심각한 의구심을 표명한 것이다. 이사회 일각에서는 현지 금융가를 안심시키기 위한 홍보 움직임에 나서자고 제안하였으나, 이렇게 된다면 사업 자체의 예산을 전용해야 하는 상황을 초래할 수도 있다."
 tesla.3004.f: "저들은 위험 대비, 기회비용, 불확실한 기술력을 논한다. 저들에게 있어 해저 케이블은 경이로운 발명품이 아니라, 불확실한 수인을 안겨줄 수 있는 도박과도 같다. 반드시 성공한다는 가시적인 증거는 없기에, 저들은 관망하거나 아예 관여하지 않으려 한다. 허나 영향력이란 것은 돈과 함께 흐르고, 저들을 놓친다면 사업의 신뢰도를 떨어뜨릴 수도 있다. 정교하게 짜인 이야기라면 저들을 설득할 수도 있겠지만, 설득에 들이는 예산은 철강과 전선, 선박에 투자할 예산이 줄어든다는 뜻이기도 하다."
 tesla.3004.g: "보고만 있게 놔두라지. 우리는 앞으로 나아갈 테니."
 tesla.3004.h: "사업 예산에서 홍보 자금을 충당하는 것이 좋겠다!"
 tesla.3005.t: "기업가들의 지지 의사"
 tesla.3005.d: "전신회사 이사진의 개인적인 노력과 정부 내각과의 오랜 관계 덕분에 영향력 있는 재계 인사들이 해저 케이블 사업을 지원하기로 결정하였다. 이들의 정치적 입지를 통해 민간 자본과 대중의 신뢰를 사업에 투입할 수 있게 되었으며, 이것으로 사업에 새로운 추진력을 불어넣게 된 것이다."
 tesla.3005.f: "사업의 성공은 계획과 계산 뿐만 아니라 믿음에도 달려 있다. 똑바른 사람들이 손을 맞잡으면 제일 주저하던 투자자도 재무제표를 달리 보기 시작하는 법이다. 업계 인사들이 참여하면 케이블 부설 사업은 비용 조달과 보전, 홍보를 지원하는 강력한 우군을 얻게 된다. 공익과 사익의 경계가 모호해지는 것을 비판하는 사람도 있겠으나, 그 결과에 대해서는 이견이 거의 없다."
 tesla.3005.g: "고맙소, [SCOPE.sCharacter('tesla_telegraph_boss_scope').GetFullName]!"
 tesla.3006.t: "불안해하는 주주들"
 tesla.3006.d: "[SCOPE.sState('tesla_fund_state').GetName] 지역에서 일부 주주들이 해저 케이블 사업이 더디게 진행되고 예산도 증가하고 있는 것에 점차 불안감을 느끼고 있다는 소식이다. 장기적인 손실을 우려한 이들은 이제 보유한 주식의 매각을 고려하고 있는 것으로 알려졌다. 사측 경영진은 주 정부의 일부 지분 매입이 신뢰 회복에 보탬이 될 것이라 제의하고 나섰으나, 그것이 실현된다면 향후 정부가 다시 지원에 나서 줄 것이라는 기대에 대한 선례로 남을 수 있다."
 tesla.3006.f: "이사진들 사이에서 거론되던 이야기가 이제는 본격적인 철수 요구로 바뀌었다. 투자자들은 사업 지연과 예기치 못한 기술 비용, 불확실한 수익을 이유로 들고 있다. 이를 놓고 사람들은 공황 상태로 보는 측과 합리적인 신중함으로 해석하는 측으로 나뉘고 있다. 만일 지금 투자자들이 발을 빼면 다른 곳에서도 신뢰가 무너질 수 있다. 그러나 정부가 마지막으로 인수하고 나선다면 시장을 안심시킬 수 있겠지만, 그만큼 복잡한 상황에 휘말릴 가능성도 있다."
 tesla.3006.g: "국가에서 지분을 매입하여 시장을 안정시키시오."
 tesla.3006.h: "앞길이 안 보인다면 하선은 언제든지."
 tesla.3007.t: "기술적 돌파구"
 tesla.3007.d: "케이블 부설 사업의 선임 공학자는 수정된 계획안을 상부에 제출하여 기술적으로 큰 불확실성을 해결해냈다. [ROOT.Var('tesla_engineer_var').GetCharacter.GetFullName]의 연구 결과는 케이블 부설 기술, 절연 내구성과 신호 안정성 개선 사항을 상세히 해설하고 있다. 이사진은 이를 중대한 진전으로 평가하고 새로운 접근법을 만장일치로 승인하였다."
 tesla.3007.f: "설계도는 대단히 정밀하다. 온 케이블 구간과 중계소, 전압 제약 여건을 고려해 제작되었다. 한떄는 멀게만 느껴지고 추정에 그쳤던 것이 이제는 구현 가능한 체계의 윤곽을 드러내기 시작했다. 흔들리려던 투자자들은 이제 장기 전략과 기반시설로 남게 될 유산을 입에 올라고 있다. 비전이 기술력으로 뒷받침되면 신뢰는 따라오는 법이다."
 tesla.3007.g: "멋진 소식일세!"
 tesla.3007.h: "이것으로 주주들을 안심시키게 됩니다."
 tesla.3011.t: "케이블 부설선의 출항"
 tesla.3011.d: "케이블 부설선이 출항하면서 계획 단계에서 실행 단계로의 전환을 알렸다. 정밀 기기, 절연 전선, 필수 물자를 가득 실은 이 배에는 사업 상의 기술 공사를 직접 감독하는 선임 공학자 [ROOT.Var('tesla_engineer_var').GetCharacter.GetFullName] 씨도 승선하였다. 부설선의 출항과 함께 수천 킬로미터에 달하는 망망대해를 가로지를 케이블 부설 사업의 성공 여부가 세심한 작업에 달려 있게 되었다."
 tesla.3011.f: "성대한 의식은 없었다. 배가 천천히 밧줄을 당기고 프로펠러 도는 소리만 들릴 뿐이었다. [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName]에게는 축하의 순간이 아니라 집중해야 하는 순간이었다. 도면을 재확인하고, 허용되는 오차를 재검하고, 축축한 나무판 위에 해도를 펼친다. 강철과 야망의 무게가 이제는 연안에서 멀리 떨어진 배 위에 실렸다. 문서와 구두로만 존재했던 것이 이제는 현실이 되어, 감겨진 채로 선적되어 심해에 깔리기 시작하였다."
 tesla.3011.g: "잘 다녀 오시게!"
 tesla.3012.t: "갑판 아래 숨은 밀항자"
 tesla.3012.d: "케이블 부설에 나선 지 며칠 뒤, 승무원들이 선실 하부의 창고에 어떤 젊은이가 숨어 있는 것을 발견하였다. 그는 본인이 자연사 전공 학생이라며 심해 생물을 연구하기 위해 몰래 배에 탔다고 주장하였다. 공식적인 절차를 통해서는 연구비를 마련할 수 없었다는 것이다. 일부 직원들은 불청객의 존재를 단순한 호기심으로 여기는 반면, 경쟁 관계에 있는 외국의 첩보 활동일 수 있다고 의심하는 직원들도 있었다."
 tesla.3012.f: "그 젊은이는 분명하면서도 상대를 위축시키지 않는 어조로 말한다. 종의 이름을 대고, 지층을 거론하며, 서적과 강의 내용을 조심스레 참조한다. 허나 보안이 최우선이고 소란만 벌어져도 위태로울 수 있는 선내에서 의심은 빠르게 퍼져나간다. 그 자가 학생이 아니라 임무를 방해하러 온 첩자일지 모른다는 소문이 도는 것이다. 선장은 이제 어려운 선택에 직면했다. 그 자를 바다에 던져버리면 일이 빨리 해결될 지도 모른다. 반대로 배에 남겨두면 작업 지연과 분열, 그리고 더 심각한 문제가 닥칠 위험이 남은 것이다."
 tesla.3012.g: "승선을 용인하되 엄격히 지도하시오."
 tesla.3012.h: "골칫거리는 해결해야 한다. 바다에 던져 버려라."
 tesla.3013.t: "발굴 현장에서 온 특별한 승객"
 tesla.3013.d: "수에즈 운하를 건너는 해저 케이블 부설 탐사선이 출항하기 직전, 어느 유럽 국가 발굴단의 젊은 조수가 승선 허가를 요청하였다. 나일강 삼각주에서의 고고학 발굴 임무를 마친 그는 봄베이로 가서 사원 건축의 비교와 고대 무역로에 관한 연구를 계속할 의향이었다. 이 조수는 추천서를 갖고 있었으며, 필요하다면 목록 작성이나 번역 작업을 돕겠다고 제안하였다."
 tesla.3013.f: "그 사람의 옷은 때가 묻었고, 유창한 아랍어를 하며, 들고 다니는 기록지에는 신전 기둥과 카르투슈, 햇볕에 바랜 조각상을 그린 스케치가 가득하다. 투트모세와 아쇼카를 단숨에 거론하고 과거란 것이 건물과 도로의 형태로 살아 숨쉰다고 믿는다. 직원들은 그 사람이 말은 많아도 별로 해가 되진 않는다고 생각한다. [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] 박사는 그 사람을 '메아리 수집가'라 칭한다. 허나 누군가는 그 여정을 승인한다. 어쩌면 호기심 때문일 수도 있고, 유적 속에서 의의를 찾는 이들에 대한 동정심 때문일 수도 있다."
 tesla.3013.g: "동행을 허가하시오. 역사가 우리와 함께 있기를."
 tesla.3013.h: "거절한다. 이 배의 목적은 케이블이지 호기심이 아니야."
 tesla.3014.t: "태평양의 학자"
 tesla.3014.d: "출항 직전 어느 젊은 민족학자가 태평양 횡단에 나서는 해저 케이블 부설선에 승선 허가를 내려달라고 요청해 왔다. 이 사람은 항로를 따라 만나는 폴리네시아 섬 공동체의 사회 구조와 전통 구전, 종교적 관습을 연구하는 것이 목표라고 밝혀 왔다. 또 참고 자료와 언어학 노트, 현장 연구를 지원하는 해외 대학의 추천서를 소지하고 있었다."
 tesla.3014.f: "그 사람은 온화한 어조로 본인을 소개하며, 족보와 주문이 가득한 낡은 수첩을 건넨다. 선내의 기계 장치에 대해서는 거의 묻지 않지만, 선원들이 들르는 각각의 섬에 대해서는 질문이 넘쳐난다. 누군가에겐 그저 해 끼치지 않는 괴짜로 보이고, 또 누군가에겐 현대 문명이 아직 흘려보내지 못한 것에 존경심을 갖고 관찰하는 사람으로 보인다. 선장은 잠자리는 허락하나 그저 승객으로 남아야 한다는 조건을 달았다. 케이블을 어떻게 부설하는가에 대해 왈가왈부하는 승객이 되어서는 안 된다는 것이다."
 tesla.3014.g: "승선을 허락한다. 문화란 것은 해류와는 달리 흐르는 법이오."
 tesla.3014.h: "여긴 크루즈선이 아니란 말이다!"
 tesla_cable_student_gains_experience_tt: "[ROOT.Var('rapanui_adventurer_var').GetCharacter.GetFullName](이)가 경험치를 획득하는 동시에 케이블 부설 임무가 끝나면 [concept_academics_academic]로 등극할 기회를 얻게 됩니다."
 tesla.3021.t: "케이블 절단!"
 tesla.3021.d: "본 케이블선이 부설 과정에서 파손되고 말았다는 소식이다. 사고는 연안에서 수백 해리 떨어진 해상에서 발생하였으며, 장력이나 불규칙한 지형, 제조상의 결함이 원인일 가능성이 존재한다."
 tesla.3021.f: "그 순간은 신호가 갑작스레 끊기면서부터 시작되었다. 그리고 작업 지연과 함께, 침묵이 흘렀다. 선원들이 윈치로 전선을 끌어올리자 찢어진 절연체와 너절해진 구리선이 보였다. 해저 어딘가에서 연결선이 끊어진 것이었다."
 tesla.3021.g: "[ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] 박사가 나설 차례요!"
 tesla.3022.t: "케이블 복구"
 tesla.3022.d: "[ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] 박사가 공해상에서 기적적으로 케이블 수리에 성공하였다."
 tesla.3022.f: "실 한 가닥과 부러진 연필, 그리고 껌 한 조각과 함께 우리 공학자는 안될 거라던 주변의 목소리를 마다하고 해저 케이블을 기적적으로 수리해낸 것이었다."
 tesla.3022.g: "[ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] 박사가 있어 참으로 다행이오!"
 tesla.3023.t: "연결되지 못한 케이블"
 tesla.3023.d: "갖은 노력에도 불구하고 [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] 박사는 해저 케이블을 살려낼 수 없었다."
 tesla.3023.f: "선상의 공학자들은 이제 응력의 허용범위와 접합지점을 놓고 논쟁을 벌였다. 투자자들은 책임 소관을 두고 다투었다. 그리고 회사는 일반에 어느 선까지 정보를 공개해야 하는가를 두고 고심하고 있다."
 tesla.3023.g: "무슨 수를 써서라도 손상 구간을 찾아내서 복구합시다."
 tesla.3023.h: "손상 구간을 건너뛰고 계속 진행하시오. 신호 상의 손실이 있더라도 어쩔 수 없지."
 tesla.3024.t: "다가오는 폭풍 전선"
 tesla.3024.d: "기압이 급격히 떨어지고 거뭇한 구름이 지평선에 드리워졌다. 선원들은 폭풍 전선이 현재 선박의 위치를 향해 오고 있다고 알렸다. 케이블 부설 작업이 중간 단계에 이른 만큼, 지금 중단하는 것은 공사 진척에 지연을 불러일으키겠지만 그렇다고 계속하다가는 케이블이 파손되거나 영영 소실될지도 모르는 상황이다."
 tesla.3024.f: "바람은 불규칙적으로 거세지고 지평이 회색빛으로 물들어간다. 아직 비는 내리지 않지만 발밑의 바다는 벌써부터 요동친다. 선장은 해도를 살펴보고 공학자는 장력 수치를 확인한다. 이사진들은 작업 지연으로 인한 여론 악화와 파산 위험을 놓고 논쟁을 벌였다. 폭풍우란 것은 시장과는 달리 협상길에 올라주지 않는다. 지금 당장 결정을 내려야 한다."
 tesla.3024.g: "폭풍우를 뚫고 나아가세. 더 이상 미룰 여지가 없소."
 tesla.3024.h: "작업을 중단하고 안전한 해역으로 돌아갑시다."
 tesla.3025.t: "예상치 못한 해저 환경"
 tesla.3025.d: "선원들은 케이블이 부설되는 경로 상에 해도에도 표시되지 않은 해구가 있다며, 케이블에 엄청난 압박이 가해질 것이라고 알려왔다. [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] 박사는 그만한 수압만큼 케이블이 잘 버텨줄지 확신이 없는 상황이다. 경로를 바로잡을 수는 있으나 그렇게 우회하는 만큼 비용이 따르게 될 전망이다."
 tesla.3025.f: "이론상으로는 완벽히 지도에 담았던 것으로 보이던 해저 지형이 실제 현장에서는 도무지 가늠할 수 없다는 사실이 드러났다. 수심도는 오래되었거나 정확하지 않고, 지도상으로는 안정되어 보였던 곳도 이제는 위험의 징후를 보인다. 해구는 급속도로 깊어지며 위험한 지형으로 끌고 간다. 공학자들은 매 해리마다 위험 여부와 예산을 저울질한다. 지금 방향을 바꾸면 케이블을 살릴 수는 있겠지만, 예산은 감당할 수 없을 것이다."
 tesla.3025.g: "계획대로 진행하시오. 위험을 감수하겠네."
 tesla.3025.h: "해구를 피해 경로를 바로잡으시오."
 tesla.3026.t: "케이블 사고"
 tesla.3026.d: "케이블 통을 잘못 다루는 바람에 인부 한 명이 목숨을 잃었다. 이 사고로 선원 모두가 동요하여 안전 절차에 대한 우려가 높아진 상황이다. 갑작스러운 사고였음에도 사망자가 발생했다는 소식이 고국의 언론에 벌써부터 오르내리고 있다."
 tesla.3026.f: "회전통이 예고 없이 돌면서 순식간에 그는 목숨을 잃고 말았다. 쇠고리와 회전력에 깔려 숨지고 만 것이다. 반응할 시간조차 없었다. 그의 부재는 단순한 침묵을 넘어 공포를 남겼다. 바다는 실수를 용서치 않는다. 그리고 어쩌면 여론 역시 마찬가지일 터다."
 tesla.3026.g: "안전을 확고히 지키겠다고 공언해야 한다. 새로운 방침을 발표하시오."
 tesla.3026.h: "일단은 임무 재개에 집중합시다."
 tesla.3027.t: "선내에 창궐한 역병"
 tesla.3027.d: "여러 선원들이 병에 옮아 발열과 탈진 증세를 보이며 쓰러졌다. 의료 보급품도 넉넉치 않고 발병 원인도 오리무중인 상황이다. 더욱이 감염된 사람 중에는 [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] 박사도 있었다."
 tesla.3027.f: "작업은 느려지고 대화는 사그라든다. 어느 기술자의 기침 소리가 윈치 돌아가는 소리보다 더 크게 들린다. 답을 찾지 못한 상황에서 두려움이 퍼져 나간다. 바다는 각국을 갈라놓을 수는 있어도 격리는 해주지 않는다."
 tesla.3027.g: "병에 걸린 자가 회복할 때까지 작업을 일시 중단하시오."
 tesla.3028.t: "갑판 아래 수상한 움직임"
 tesla.3028.d: "[ROOT.Var('rapanui_adventurer_var').GetCharacter.GetFullName](이)가 한밤중에 민감한 계측 장비를 조작하고 있던 것이 발각되었다. 단지 호기심 때문이라는 항변과 함께 어떠한 잘못도 저지르지 않았다고 부인하였음에도 직원들은 그의 말을 믿지 않고 있다. 방해 공작일 가능성을 배제할 수 없는 상황이 되고 만 것이다."
 tesla.3028.f: "현장에서 발각된 그 자는 \"측정값을 확인했을 뿐\"이며 \"모든 것이 제대로 돌아가는지 확실히 보려던 것 뿐\"이라는 변명만 늘어놓았다. 그 누구도 그 자에게 출입금지 구역에 들어갈 권한을 부여한 적은 없었다. 기술진들은 방해 공작에 나서려던 것이 아니냐고 수근거린다. 해저 케이블은 대양을 가로지르지만, 배신은 고작 몇 미터의 전선만으로도 가능했던 것이다."
 tesla.3028.g: "이번에는 가만두지 않겠어!"
 tesla.3028.h: "그 자는 무고하다."
 tesla.3029.t: "엉뚱한 사람"
 tesla.3029.d: "해고된 선원이 해저 케이블 부설 임무를 방해하려는 의도가 없었다는 새로운 증거가 드러났다. 너저분한 서류 더미에 섞여들어갔다 다시 발견된 정비 명령서에 따르면 이 자는 정말로 문제의 장비를 점검하는 임무를 맡았던 것으로 확인되었다. 해상에서 조용히 처리되었던 이 건은 이후 언론의 비판 기사를 통해 세상에 알려지게 되었다."
 tesla.3029.f: "선원들의 사적인 불평이 언론 기사에 오르내렸다. 잘못된 짐작과 서류 미비로 한 사람을 판가름할 겨를도 없이 쫓아냈다는 것이다. 이후 드러난 증거를 통해 그 자가 무고하다는 사실이 입증되었지만, 이미 엎은 물은 돌이킬 수 없게 되었다. 본인 뿐만 아니라 사업 자체의 평판에도 큰 타격을 입힌 것이다. 투자자들은 이번 탐사가 규율보다는 공황 상태에 전락한 것이 아닌지 의문을 품고 있다."
 tesla.3029.g: "아... 크흠... 그래도 뭐 괜찮겠지?"
 tesla.3030.t: "까다로운 해역의 순조로운 진척"
 tesla.3030.d: "제법 복잡하게 되어 있어 지금껏 특수한 조절이 필요할 것으로 전망됐던 해저 케이블 구간이 지연이나 문제 없이 성공적으로 설치되었다. 작업반의 대비와 효율성은 기대 이상의 모습을 보였다."
 tesla.3030.f: "해당 구간의 해저 지형은 불규칙할 것으로 전망되었으나, 세심한 계획과 잔잔한 날씨 덕분에 부설 작업이 순조롭게 진행되었다. 승무원들은 거의 말없이 작업에 임했고, 전선은 마치 실타래에서 풀려 나오듯 펼쳐져 나갔다. 기술진은 만족스러운 듯 짧게 고개를 끄덕였고, 모처럼 잘못된 것을 바로잡을 일도 없었다. 어느 직원이 꼬집었던 것과 마찬가지로 그것은 '언제나 바라지만 좀처럼 얻기 힘든, 별 일 없이 무탈한 성공'이었다. 기압계가 올라가면서 선내의 사기도 올라갔다."
 tesla.3030.g: "아주 좋아!"
 tesla.3031.t: "고래와 돌고래"
 tesla.3031.d: "고래와 돌고래가 우리 항로를 가로지르며 독특한 자연 경관이 눈앞에 펼쳐졌다. [SCOPE.sCharacter('rapanui_adventurer_var').GetFullName](은)는 그 모습을 눈에 담으며 새로운 생물학적 통찰력을 기대하였으나 선원들은 이런 학문적 호기심에는 별다른 관심을 보이지 않고 있다."
 tesla.3031.f: "선상에서 논쟁이 불거졌다. 연구원생이 이 매혹적인 해양 생물들을 도살하는 것이 비열하다며 사냥 방법을 지적한 탓이다. 고래를 기름 저장고로만 여기던 대다수 선원들은 학생의 설교에 더욱 낙담할 뿐이었다."
 tesla.3031.g: "저 놀라운 생물들을 연구해 봅시다."
 tesla.3031.h: "그럴 시간은 없네."
 tesla.3032.t: "넘쳐나는 생선!"
 tesla.3032.d: "[SCOPE.sCharacter('rapanui_adventurer_var').GetFullName](은)는 북대서양에 지금껏 알려지지 않은 종의 물고기떼가 있는 것을 발견하고서 이게 왠 횡재냐 한 뒤, 선장에게 잠시 작업을 중단하여 표본을 확보하자고 요청하였다. 이에 [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] 박사는 이곳은 케이블 부설선이지 연구 시설이 아니라는 현실을 지적하고 나섰다."
 tesla.3032.f: "\"제발 제 말 좀 들어보십시오! 과학 연구를 날려버릴 셈입니까! 이 물고기는 작고 미세해보일지 몰라도 지금껏 전혀 발견된 적이 없는 종이라니깐요. 모르실 수도 있겠지만... 그렇게 좋으면 지금 당장 바다에서 같이 헤엄치고 놀으라니 그게 무슨 말입니까?!\""
 tesla.3032.g: "생선을 잡자."
 tesla.3033.t: "대서양의 해상 실험"
 tesla.3033.d: "[SCOPE.sCharacter('rapanui_cable_guy_scope').GetFullName](은)는 해상에서 시간을 내어 케이블 부설선에 과학 연구를 수행하기 위한 몇 가지 장비를 설치하였다. 어떤 연구를 실시할지는 아직 정하지 않았다."
 tesla.3033.atlantic: "'바다에는 강이 하나 있다. 극심한 가뭄에도 마르지 않고, 엄청난 홍수에도 넘치지 않는다. 강둑과 강바닥은 차가운 물이지만, 흐르는 물은 따뜻하다. 그 강의 발원지는 멕시코만이고, 그 끝은 북극해에 있다. 그것이 바로 멕시코 만류다.' - 매튜 폰테인 모리"
 tesla.3033.indian: "\"인도양은 진귀한 보석으로 가득하나, 그렇다고 맑은 하늘이나 잔잔한 바다를 자랑하지 않는다. 변덕스런 파도의 진노를 두려워하지 않는 연안이 있다면, 그것은 바람도 모르는 작고 좁은 만일 것이다.\" - 피에트로 메타스타시오"
 tesla.3033.pacific: "\"태평양은 나의 고향 바다다. 나는 태평양을 제일 먼저 알았고, 그 연안에서 자랐으며, 연안을 따라 해양 동물을 손에 넣었다. 그 분위기와 색채, 환경을 나는 잘 알고 있다.\" - 존 스타인벡"
 tesla.3033.g: "지자기 실험에 주력한다."
 tesla.3033.h: "해양학 실험에 주력한다."
 tesla.3034.t: "심해의 수수께끼"
 tesla.3034.d: "[SCOPE.sCharacter('rapanui_cable_guy_scope').GetFullName](은)는 조사 자료를 점검하던 중 수상한 점을 발견하였다. 대서양의 특정 지역에서 해저면이 비정상적으로 높게 솟은 것이다. 지금으로썬 이 현상에 가설을 세워볼 수밖에 없는 상황이다."
 tesla.3034.f: "바다는 중심부에 도달할수록 더욱 깊어진다는 것이 실로 그간의 상식이었다. 허나 오늘의 발견은 그런 생각을 완전히 뒤집어 높았다. 수심이 더욱 깊어지는 것이 아니라 해저와 해수면 간의 거리가 줄어들었던 것이다. 이는 회사 입장에서는 희소식이 되었는데 부설해야 할 케이블의 길이가 짧아지기 때문이다. 하지만 [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] 박사에게는 이번 발견으로 심해에 대한 기존 견해를 전부 바로잡아야 한다는 뜻이 되었다. 해저에도 고원과 계곡이 있으며, 그 고원은 단순한 고원 그 이상의 의미가 담겨 있는 것으로 밝혀진 것이다."
 tesla.3034.g: "해저에도 산맥이 있다는 것인가?"
 tesla.3035.t: "아왐 신전"
 tesla.3035.d: "[SCOPE.sCharacter('rapanui_adventurer_var').GetFullName](이)가 선장에게 건의 사항을 들고 왔다. 아덴만에서 잠시 내륙으로 우회하여 마리브 인근의 아왐 신전 유적을 둘러보고 싶다는 것이었다. 학계에서는 사바테아 문명의 중심지로 알려진 이곳은 체계적인 연구가 오랫동안 이뤄지지 못한 채 방치되어 있었다. 그 유적에 이렇게 가까이 지나가는 동안 직접 눈으로 살펴볼 기회가 다시 오지 않을지도 모른다는 주장이었다. 그러나 이렇게 우회했다가는 해저 케이블 작업이 지연될 것이 분명했다."
 tesla.3035.f: "[SCOPE.sCharacter('rapanui_adventurer_var').GetLastName] 씨는 달을 숭배하는 교단, 향료의 교역로, 아직 풀리지 않은 금석문의 신비에 대해 이야기하였다. 그 사람은 모래속에 묻힌 거대한 벽과 절반뿐인 기둥을 그리며, 상상 속의 비문을 허공에 손가락으로 짚어나갔다. 그에게 있어 아왐 사원은 흙먼지 속에 숨겨진 미지의 영역이다. [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] 박사에게는 그저 작업이 지연될 일에 불과하다."
 tesla.3035.g: "우회를 승인하겠다."
 tesla.3035.h: "케이블에도 마감 시한이 있단 말일세."
 tesla.3036.t: "소코트라"
 tesla.3036.d: "보급을 위해 소코트라에 닻을 내린 사이 [SCOPE.sCharacter('rapanui_adventurer_var').GetFullName](이)가 조심스레 하선 허가를 요청하였다. 이집트에서 유래했다고 전해지는 조그만 조각상과 부장품들이 동방의 어느 군주국의 개인 소장품으로 밀반입하고자 소코트라를 통과하고 있다는 소식을 접했기 때문이다. 지금 이 유물들을 확보한다면 보존과 함꼐 목록으로 작성하여, 종국에는 제대로 된 학자들의 손에 들어갈 수 있을 것이라 주장하였다."
 tesla.3036.f: "[SCOPE.sCharacter('rapanui_adventurer_var').GetLastName](은)은 거래에 사적인 부분이 있었음을 부인하지 않고 단지 긴급한 상황이었다고 힘주어 말했다. \"궁전의 선반 위에 가만 있는 우상보다 기록보관소에 주석 달린 상자가 낫지 않겠습니까\"라고 그는 말했다. 선원들은 어수선해하고, 선장은 외교적으로 민감한 사안이 될 수 있다고 경고하고 나섰다. 그러나 조수는 그런 문화유산이 얼마나 중요한가, 망각 속에서 조금이나마 구해내는 것이 얼마나 중요한가, 그리고 행동으로 나서지 않았다면 사라졌을 지식은 어떠했는가에 대하여 거론하였다."
 tesla.3036.g: "조용히 진행토록 하시오."
 tesla.3036.h: "이건 우리가 관여할 바는 아니오."
 tesla.3040.t: "거대한 형체"
 tesla.3040.d: "선원들이 정기적인 케이블 설치 작업 과정에서 선박 아래 거대하고 느리게 움직이는 형체를 목격했다고 알려왔다. 그 형체는 평상시의 해류나 우리가 알고 있는 야생 동물의 움직임과는 일치하지 않았으며 흔적도 없이 사라졌다. 직원들은 이를 고래나 착시 현상일 가능성이 높다며 일축하였으나, 이 때의 목격담은 선내는 물론 언론에서도 소문이 자자하게 되었다."
 tesla.3040.f: "그것은 수면 아래 깊은 곳에서, 조용히 끊임없이 움직였다. 해류라고 하기엔 너무나 규칙적이었고, 고래라고 하기엔 학계에 알려진 그 어느 것보다 거대했다. 누군가는 금속성 광택이 있었다고 하였다. 또 누군가는 빛을 보았다고 주장했다. 항해일지에는 '바닷 속 정체불명의 조밀한 덩어리'라고만 기록되었다. 허나 소문은 벌써부터 퍼져나갔다. 우리가 설치한 케이블 아래에 또 무언가가 움직이고 있는 것일까? 무엇이 우리를 계속해서 지켜보고 있었단 말인가?"
 tesla.3040.g: "희귀 해양 생물을 만난 거라고 언론에 전하시오."
 tesla.3041.t: "해저 케이블 부설 전단의 귀환"
 tesla.3041.d: "케이블 부설 선단이 항구로 복귀하였다. 수 주간의 해상 작업 끝에 계획된 경로를 따라 모든 해저 케이블의 설치가 완료된 것이다. 허나 최종 시험은 아직 시작되지 않았다. 이제 케이블을 육상 기지국에 연결하고 신호 검증을 거쳐야 한다. 그래야만 이번 사업이 진정으로 성공하였는지 알 수 있을 것이다."
 tesla.3041.f: "윈치에 녹슨 쪼가리가 들러붙고, 선체는 소금기로 뒤덮였다. 선원들은 지쳐 돌아왔지만 기술자는 말이 없다. 케이블은 제자리에 놓였다. 바닷속에 담그고, 해저의 능선을 넘어 뻗으면서, 이어붙여 봉인되어 있다. 허나 여전히 대륙 간에 아무런 소식도 전해지지 않는다. 작업선은 무사히 귀환했을지 모르지만 확신은 아직 그와 함께 오지 않았다. 이제 모든 시선은 마지막 시험에 쏠려 있다."
 tesla.3041.g: "만세!"
 tesla.3042.t: "바다의 전문가"
 tesla.3042.d: "해저 케이블 임무를 둘러싼 불확실성에도 어느 학자가 이번 항해를 뜻밖의 과학적 성과로 바꿔놓았다. 처음에는 밀항자로 의심받고 추방당할 뻔했던 이 젊은이는 탐사 기간 동안 심해의 생물을 기록하고 수백 점의 표본과 상세한 스케치를 손에 넣었다. 고국으로 돌아온 뒤 그 연구 결과가 유럽 전역의 자연과학 학회에서 주목을 받기에 이르렀다."
 tesla.3042.f: "기름 등잔과 보급받은 종이에 의지하던 그 학생은 발광 플랑크톤과 어류의 연접골, 그리고 근해 생태계 분류체계에는 들일 일이 없던 갑각류들을 목록으로 정리하였다. 필사적으로 시작했던 그의 행동은 학계의 명성으로 이어졌다. 언론에서는 '심해의 박물학자'라 칭하지만 본인은 그저 관찰에 따른 성과라 말할 뿐이다."
 tesla.3042.g: "학생이라니? 박사라고 부르게!"
 tesla.3042.h: "이런 과학 문서야말로 조국이 찾던 것이오."
 tesla.3043.t: "유적과 길목의 연대기"
 tesla.3043.d: "수에즈에서 봄베이까지 이어진 케이블 부설 탐사 기간 동안 젊은 고고학 조수가 건축과 비문, 문화 유적에 관한 방대한 기록을 남겼다. 이 조수는 이전의 현장 연구와 다양한 지역을 두루 거친 항해를 바탕으로 포괄적인 보고서를 작성해 공개하면서 학계에서 널리 호평받고 있다."
 tesla.3043.f: "그 사람은 해안선만 관찰한 것이 아니었다. 본인의 일지를 통해 버려진 신전과 중간 기착지, 잊혀진 항구 마을의 윤곽을 기록해 나갔다. 한떄 무역과 종교로 연결되던 문명의 단편과도 같았다. 이제 그의 글을 통해 그 단편이 모여 다시 말을 걸어온다. 명료하면서도 일관된 문체로 찬사를 얻은 이 책은 학문과 항해 간의 간극을 메운 작품으로 높이 평가받고 있다. 해저 케이블이 지금 살아가는 이 시대를 묶는다면, 그의 일지는 과거를 되살린 것이다."
 tesla.3043.h: "이런 고고학 유물이야말로 조국이 찾던 것이오."
 tesla.3044.t: "민족학 석좌 교수"
 tesla.3044.d: "케이블 탐사에 이어 동승했던 학생이 상륙지와 기항지에서 만난 폴리네시아인들의 친족 체계, 전통 구전, 천문항법을 상세히 기술한 논문을 발표하였다. 이 학생의 연구는 여러 나라의 학자들로부터 찬사를 받았다. 또 어느 대학에서 이 학생을 비교민족학 부문의 새로운 석좌교수직에 임명하고자 한다는 소식도 전해졌다."
 tesla.3044.f: "그 사람의 글은 낭만주의를 피하면서도 찬송가의 율동과 혈통의 논리를 담았다. 바람의 형상을 한 신과 파도의 형상을 한 가계도를 그리고 있다. 이제 그의 이름은 학계에서 '대양인식론'이라는 용어와 함께 회자되고 있다. 갑판 위의 그 사람을 기억하는 사람들에게는 그토록 조용히 써내려가던 행동이 하나의 학문을 이룰 수 있었다는 사실에 낯설어할지도 모른다. 그 사람은 그것을 '경청'이라 하였다."
 tesla.3044.h: "이런 폴리네시아 유물이야말로 조국이 찾던 것이오."
 tesla.3051.t: "대서양을 건넌 최초의 전보"
 tesla.3051.d: "해저 횡단 케이블을 통해 전송된 [SCOPE.sCountry('tesla_country_1').GetName]의 [SCOPE.sCountry('tesla_country_1').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCharacter('tesla_leader_1').GetFullName]의 인사가 16시간의 시차를 거쳐 [SCOPE.sCountry('tesla_country_2').GetName]의 [SCOPE.sCountry('tesla_country_2').GetRuler.GetPrimaryRoleTitle] [SCOPE.sCharacter('tesla_leader_2').GetFullName]에게 전달되었다."
 tesla.3051.f: "\"이것은 전쟁터에서 정복자가 거둔 승리보다 더 영광스럽고 인류에게 훨씬 더 유익한 대성과가 아닐 수 없소. 하늘의 축복 아래 대서양 전신선이 동족 국가 간의 영원한 평화와 우정의 유대가 되고, 하느님의 섭리에 따라 종교와 문명과 자유와 법치를 전세계에 전파하는 도구가 되기를 바라오.\" - 제임스 뷰캐넌"
 tesla.3051.g: ".... . .-.. .-.. --- -.-.-- (...안녕하시오!)"
 tesla.3052.t: "고요"
 tesla.3052.d: "해저 케이블이 연안 기지국과 연결되었다. 첫 송신 시도는 있었으나 응답은 없었다. 아직 반대편에서 신호가 확인되지 않고 있다. 기술자들은 계속해서 장비를 시험하고 조정하고 있으나, 시간이 흐를수록 믿음이 사라지고 있다. 이번 임무가 아무래도 실패한 모양이다."
 tesla.3052.f: "회선은 잠잠했다. 지직거리는 소리도, 딸깍이는 소리도, 전류의 떨림도 없다. 너무나 완벽해서 자연스럽지 않을 정적만이 감돈다. 누군가는 계측 장비의 문제라 하고, 누군가는 중계소의 문제라 하고, 또 누군가는 바다 탓을 한다. 기술진들은 긴장된 침묵 속에 작업에 몰두하고, 투자자들은 손실을 볼까 수근거리고, 언론은 추측성 보도에 나선다. 어쩌면 신호가 단순 지연된 것일지 모른다. 아니면 무언가 잘못된 것일지도 모른다. 또 어쩌면 애초에 바닷속을 거쳐 전신을 보낸다는 것이 너무나 무리한 요구였을지도 모른다."
 tesla.3052.g: "거액의 자금이 바다에 가라앉았구나..."
 tesla.3052.tt: "주주 신임도가 바닥나지 않았다면 사측에서 새로운 투자금 조달 단계에 나서게 됩니다."
 tesla.3053.t: "무너진 신뢰"
 tesla.3053.d: "금융 시장은 공황에 휩싸였다. 투자 심리는 무너져 내렸고 전신 회사의 주가는 폭락하여 산업 혁신과 정부의 투기 사업 참여에 대한 신뢰도 상실이 한층 더해진 것이다. 그 결과 발생한 경제 위기가 은행과 기업, 가정으로 확산되고 있다."
 tesla.3053.f: "모든 것은 불확실성으로 비롯되었다. 그 다음엔 침묵이, 그리고 이제는 심판의 순간이 다가왔다. 한때 미래의 상징으로 여겨졌던 주식은 이제 휴지조각만도 못한 가치를 지니게 되었다. 사무실은 문을 닫고, 은행은 인출을 중단하였으며, 해저 케이블 회사의 이름은 씁쓸한 기억 속에서만 맴돈다. 수많은 소액 투자자들은 평생 모은 저축이 몇 시간 만에 날아가는 것을 목격하였다. 대륙을 하나로 이으려던 계획은 오히려 한 나라의 경제를 절단냈다. 해저 케이블은 조용히 놓였지만, 그 위는 소란에 귀청이 터질 듯하다."
 tesla.3053.g: "시장도 결국엔 조정이 이루어지는 법. 늘상 그랬잖은가..."
 tesla.3054.t: "패배"
 tesla.3054.d: "외국에서 해저 케이블 연결을 성공적으로 완료하고 작동에 들어갔다는 소식이 전해졌다. 이제 바다를 건너 전보가 전송되고 있으나, 우리의 케이블을 통해서는 아니게 되었다. 이 소식은 시장을 뒤흔들었고 우리의 사업 속도와 목적에 관한 어려운 질문을 남기게 되었다."
 tesla.3054.f: "언론 지면에는 명확하고도 냉혹한 어휘가 담겼다. 전보가 바다를 건넜지만 우리 뜻대로는 아니었다. 한때 경쟁이었던 이 싸움에는 이제 승자가 갈렸고, 그 승자는 우리가 아니었던 것이다. 투자자들은 주저하고, 관계자들은 얼버무리고, 경쟁사들은 조용히 상황을 주시한다. 외국의 해저 케이블은 단순한 전보 이상의 것을 전했다. 영향력과 신뢰도, 그리고 선발 주자로서의 이점을 나르는 것이다. 우리 선박들은 여전히 바다 위를 표류하고, 우리 기술진들은 여전히 계산에 매달린다. 그러는 동안 세상은 계속 돌아간다. 연결은 이루어졌으나 그것은 우리의 것이 아니다."
 tesla.3054.g: "이건 좀... 골치 아프게 되었군."
 tesla.3061.t: "동부 전신선 완공"
 tesla.3061.d: "이제부터 이집트와 인도가 수에즈 운하를 경유하는 해저 전신 케이블로 연결되기에 이르렀다. 오랜 세월 동안의 준비와 측량, 그리고 얕은 바다와 분쟁 해역을 통과하는 부설 공사를 거쳐 마침내 케이블을 완공한 것이다. 전신기사들은 신호가 뚜렷하고 지연 없이 수신되고 있음을 확인하였다."
 tesla.3061.f: "\"인도로 향하는 케이블이 완공됐다.\" - 신원 미상"
 tesla.3061.g: "-... --- -- -... .- -.-- ..--.."
 tesla.3071.t: "태평양을 횡단한 최초의 전보"
 tesla.3071.d: "역사상 처음으로 호주에서 캐나다까지 태평양을 끊김 없이 가로지르는 해저 케이블을 통해 전보가 전송되었다. 해저 케이블은 수천 해리에 걸쳐 있으며, 대륙 간 전보를 단 몇 초만에 전달할 수 있게 되었다. 최초의 공식 전보는 간결하면서도 격식을 갖췄으며 역사적인 문구로 선정되었다."
 tesla.3071.f: "\"태평양 해저 케이블이 성공적으로 부설되었다. 이제 대영제국은 제국의 소유이거나 관할 하에 있는 통신망으로 연결되기에 이르렀다. 이번 성과는 대영제국의 온 영토에 걸쳐 단결과 협력의 유대를 강화할 것이다.\" - 에드먼드 바튼"
 tesla.3071.g: ".... --- --- .-. .- -.-- -.-.--"
