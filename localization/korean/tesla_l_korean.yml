l_korean:
 tesla_prototype_mechanical_computer_modifier: "기계식 계산수 시제품"
 tesla.223.t: "첫 시제품"
 tesla.223.d: "기계식 계산수의 제작 사업에 나선 [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] 박사가 간단한 계산을 수행할 수 있는 첫 시제품의 제작을 마쳤다. 실제 계산수가 하는 것만큼 성능이 뛰어나진 않지만 이 기계도 우리 학자들에게 보탬이 될 것이다."
 tesla.223.f: "아직 모든 계산을 할 수 있는 것은 아니지만 그 중에 몇 가지 정도는 할 수 있습니다. 덧셈, 뺄셈, 곱셈, 나눗셈은 문제없을 겁니다. 다만 기계가 작동하는 과정에서 우리 조수 중 한 놈이 손가락을 잃을 뻔했으니 조심하십시오."
 tesla.223.g: "시제품에 그칠 게 아니라 완성이 되기를 바라오..."
 tesla.224.t: "기능 확대"
 tesla.224.d: "[ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] 박사는 온갖 아이디어로 가득찬 모양이다. 기계식 계산수의 설계도가 하루도 빠짐없이 수정되고 있다. 문제는 이 사업을 제대로 끝마칠 수 있는가의 여부다."
 tesla.224.f: "\"하지만 음악도 연주하는 모습을 상상해 보시오! 참으로 근사하지 않겠소?\""
 tesla.224.g: "그 계산기나 제대로 만들어 주시면 안 되겠소?"
 tesla.224.h: "예산 삭감의 위협"
 tesla.225.t: "화재로 기계식 계산수가 손상되다"
 tesla.225.d: "대형 화재로 [ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] 박사의 기계식 계산수 일부가 손상을 입고 설계도 일부도 불에 타 버리고 말았다. 이것으로 사업이 얼마나 지연될지는 아직 알 수 없다."
 tesla.225.f: "화재는 계산수의 출력 부품에서 발생했다. 정확한 원인은 밝혀지지 않았으나 출력기에서 상당량의 종이가 출력된 것으로 보인다."
 tesla.225.g: "이 계산수는 완성이 가능하긴 한가?"
 tesla.225.h: "추가 예산을 보태 주도록."
