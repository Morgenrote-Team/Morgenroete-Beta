l_korean:
 glossary_curie_complex_analysis: "$curie_complex$ $curie_analysis$"
 glossary_curie_complex_analysis_desc: "The #b;italic $glossary_curie_complex_analysis$#! is a branch of mathematics that studies functions operating on complex numbers, which combine real and imaginary numbers. It is widely used in physics and engineering to analyze wave patterns, fluid dynamics, and electrical circuits."
 glossary_curie_differential_equation: "$curie_differential$ $curie_equation$"
 glossary_curie_differential_equation_desc: "#b;italic $glossary_curie_differential_equation$#! are equations that relate functions to their rates of change. They describe how physical quantities evolve over time or space, making them essential for modeling planetary motion, population growth, climate systems, and heat transfer."
 glossary_curie_fourier_analysis: "$mr_fourier$ $curie_analysis$"
 glossary_curie_fourier_analysis_desc: "The #b;italic $glossary_curie_fourier_analysis$#! is a technique that breaks complex signals, waves, or functions down into simple sine and cosine components. It is fundamental to modern signal processing, image compression, audio streaming, and telecommunications."
 glossary_curie_non_euclidean_geometry: "비유클리드 $curie_geometry$"
 glossary_curie_non_euclidean_geometry_desc: "The #b;italic $glossary_curie_non_euclidean_geometry$#! covers geometry based on surfaces that are not flat, where parallel lines can intersect or diverge. Spherical geometry models the curved surface of planets, while hyperbolic geometry helps explain spacetime in general relativity."
 glossary_curie_group_theory: "군$curie_theory$"
 glossary_curie_group_theory_desc: "#b;italic $glossary_curie_group_theory$#! is the study of algebraic structures that capture symmetry and transformations. It provides a formal language to analyze symmetries in geometric shapes, chemical molecules, subatomic particles, and cryptographic algorithms."
 glossary_curie_linear_algebra: "선형대수학"
 glossary_curie_linear_algebra_desc: "#b;italic $glossary_curie_linear_algebra$#! is the branch of mathematics studying vector spaces, vectors, and matrices. It provides the core mathematical foundation for 3D computer graphics, machine learning algorithms, quantum mechanics, and large-scale data analysis."
 glossary_curie_abstract_algebra: "추상대수학"
 glossary_curie_abstract_algebra_desc: "#b;italic $glossary_curie_abstract_algebra$#! is the study of algebraic structures such as groups, rings, and fields, rather than specific numbers. It examines underlying rules and symmetries, forming the basis for modern cryptography, coding theory, and theoretical physics."
 glossary_curie_navier_stokes_equations: "나비에-스토크스 방정식"
 glossary_curie_navier_stokes_equations_desc: "The #b;italic $glossary_curie_navier_stokes_equations$#! is a set of partial differential equations describing how fluids move. They model viscous fluid behavior and are essential for weather forecasting, ocean current predictions, aerodynamics, and pipeline simulation."
 glossary_curie_mathematical_logic: "수리논리학"
 glossary_curie_mathematical_logic_desc: "#b;italic $glossary_curie_mathematical_logic$#! is the study of formal logic applied to mathematics. It analyzes proof systems, truth, and computation limits, serving as the theoretical foundation for software design and artificial intelligence."
 glossary_curie_analytical_number_theory: "해석적 정수$curie_theory$"
 glossary_curie_analytical_number_theory_desc: "The #b;italic $glossary_curie_analytical_number_theory$#! is a branch using tools from continuous calculus and complex analysis to solve problems about integers. It focuses primarily on prime number distribution, modular forms, and additive number patterns."
 glossary_curie_algebraic_number_theory: "대수적 정수$curie_theory$"
 glossary_curie_algebraic_number_theory_desc: "The #b;italic $glossary_curie_algebraic_number_theory$#! is a branch that applies abstract algebra to study integers and algebraic numbers. It solves factorization problems in number fields and underpins modern public-key cryptography, including elliptic curve encryption systems."
 glossary_curie_em_field_equations: "전자기장 방정식"
 glossary_curie_em_field_equations_desc: "#b $glossary_curie_em_field_equations$#!은 맥스웰 방정식이란 이름으로 알려진 편미분 방정식의 집합으로, 전기장과 자기장이 물질과 상호작용하는 방식을 설명하고 있다. 이것으로 전자기파와 빛, 전기 회로와 무선 통신의 원리를 해설할 수 있다."
 glossary_curie_set_theory: "집합$curie_theory$"
 glossary_curie_set_theory_desc: "The #b;italic $glossary_curie_set_theory$#! is the foundational branch of mathematics studying collections of objects, known as sets. It establishes basic concepts like infinity, relations, and functions, forming the structural basis for almost all modern mathematical logic."
 glossary_curie_topology: "위상수학"
 glossary_curie_topology_desc: "#b;italic $glossary_curie_topology$#! is the study of spatial properties that remain unchanged under continuous deformations like stretching or bending, without tearing. It is applied in network analysis, data analysis  and material physics."
 glossary_curie_functional_analysis: "함수해석"
 glossary_curie_functional_analysis_desc: "#b;italic $glossary_curie_functional_analysis$#! is a branch studying infinite-dimensional vector spaces and transformations between them. It extends linear algebra to calculus, providing the mathematical framework for quantum mechanics and differential equations."
 glossary_curie_lie_theory: "리 이론"
 glossary_curie_lie_theory_desc: "The #b;italic $glossary_curie_lie_theory$#! is the study of continuous symmetries and geometric transformations. It links calculus with abstract algebra to describe continuous motion, making it vital for quantum mechanics and general relativity."
 glossary_curie_representation_theory: "표현$curie_theory$"
 glossary_curie_representation_theory_desc: "The #b;italic $glossary_curie_representation_theory$#! is a branch that translates abstract algebraic structures into concrete operations on linear vector spaces. It allows complex algebraic symmetries to be studied via matrices, simplifying problems in particle physics and chemistry."
 glossary_curie_algebraic_topology: "대수적 위상수학"
 glossary_curie_algebraic_topology_desc: "#b;italic $glossary_curie_algebraic_topology$#! is a field using tools from abstract algebra to study topological spaces and continuous shapes. It converts geometric shape features into algebraic invariants, aiding data analysis."
 glossary_curie_class_field_theory: "유체$curie_theory$"
 glossary_curie_class_field_theory_desc: "The #b;italic $glossary_curie_class_field_theory$#! is a major branch of algebraic number theory describing abelian extensions of number fields. It links arithmetic properties to reciprocity laws, forming the basis for advanced number theory and modern arithmetic geometry."
 glossary_curie_relativity_theory: "상대성 이론"
 glossary_curie_relativity_theory_desc: "The #b;italic $glossary_curie_relativity_theory$#! is a fundamental physics framework describing gravitation, space, and time. It shows that time and space are intertwined as spacetime and that massive objects warp this fabric, underpinning astrophysics and satellite navigation."
 glossary_curie_quantum_mechanics: "양자역학"
 glossary_curie_quantum_mechanics_desc: "#b;italic $glossary_curie_quantum_mechanics$#! are a physical theory describing nature at atomic and subatomic scales. It replaces classical determinism with probabilities, explaining phenomena like wave-particle duality and entanglement, which power semiconductors and quantum computing."
 glossary_curie_proof_theory: "증명$curie_theory$"
 glossary_curie_proof_theory_desc: "#b;italic $glossary_curie_proof_theory$#! is a branch of mathematical logic treating mathematical proofs as formal mathematical objects. It analyzes proof structure, consistency, and provability limits."
 glossary_curie_cryptography: "암호학"
 glossary_curie_cryptography_desc: "#b;italic $glossary_curie_cryptography$#! is the science of securing communications against unauthorized access through mathematical codes and ciphers."
 glossary_curie_algorithm_theory: "알고리즘 이론"
 glossary_curie_algorithm_theory_desc: "#b;italic $glossary_curie_algorithm_theory$#! is a mathematical study of systematic, step-by-step procedures for solving computational problems. Formulated around pencil-and-paper calculation, it analyzes mechanical rules to determine which problems can be solved in a finite sequence of steps."
 glossary_curie_lambda_calculus: "람다 대수"
 glossary_curie_lambda_calculus_desc: "#b;italic $glossary_curie_lambda_calculus$#! is a formal logical system introduced in the 1930s to investigate mathematical functions, variable bindings, and substitution. It was created to study the foundational limits of decidability and formal reasoning in pure logic and mathematics."