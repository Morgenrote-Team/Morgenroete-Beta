 CURTISS_ADD_X_FLIGHT_ROUTE_EFFECT_FIRST_POSITIVE: "[COUNTRY.GetNameNoFlag]은 $MR_GAINS$ $VALUE|+0$ @curtiss_airlines! [SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE$','(CFixedPoint)1'),'CURTISS_FLIGHT_ROUTES','CURTISS_FLIGHT_ROUTE')]을 획득합니다. (현재 [COUNTRY.MakeScope.GetVariable('curtiss_flight_route').GetValue|0|V])"
