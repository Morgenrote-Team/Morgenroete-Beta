 santos_ballooning_recruit_balloonist_desc: "국가 차원에서 [Concept('concept_santos_balloonist_role','$concept_santos_balloonist_role_only_balloonist|q$')]를 후원합니다. #b 열기구 조종사#!는 국가를 대표하여 기록을 경신하려 시도할 것입니다. #b 열기구 조종사#!를 후원하는 데에는 매달 @money! #n 400#!의 예산이 소요됩니다."
