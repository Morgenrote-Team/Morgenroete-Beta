 santos_building_production_mult_modifier: "열기구 볼거리"
 santos_balloonist: "열기구 조종사"
 santos_balloonist_desc: "이 인물은 열기구 비행으로 모험을 즐기곤 하는 열기구 조종사입니다."
 santos_balloonist_experienced: "경험 많은 열기구 조종사"
 santos_balloonist_experienced_desc: "이 인물은 경험 많은 열기구 조종사로, 열기구 비행으로 모험을 떠나곤 합니다. 이 특성을 가진 인물은 더 나은 기록을 세울 확률이 높습니다."
 santos_balloonist_famous: "유명한 열기구 조종사"
 santos_balloonist_famous_desc: "이 인물은 유명한 열기구 조종사로, 열기구 비행으로 모험을 떠나곤 합니다. 이 특성을 가진 인물은 더 나은 기록을 세울 확률이 높습니다."
 curtiss_custom_no_balloonist: ""
 curtiss_custom_balloonist: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]는 경험치 #p [ROOT.Var('santos_balloonist_var').GetVariable('santos_balloonist_experience_var').GetValue]#! / 100를 가진 [concept_santos_balloonist]입니다. 경험치가 100에 도달하면 숙련도 특성을 [concept_santos_experienced_balloonist]로 승격받게 됩니다."
 curtiss_custom_experienced_balloonist: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]는 경험치 #p [ROOT.Var('santos_balloonist_var').GetVariable('santos_balloonist_experience_var').GetValue]#! / 100를 가진 [concept_santos_experienced_balloonist]입니다. 경험치가 100에 도달하면 숙련도 특성을 [concept_santos_famous_balloonist]로 승격받게 됩니다."
 curtiss_custom_famous_balloonist: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName](은)는 [concept_santos_famous_balloonist]입니다. [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe|U]는 세계 최고의 열기구 조종사 중 한 명입니다."
 curtiss.600.t: "복솔 가든-바일부르크 열기구 비행"
 curtiss.600.d: "영국의 열기구 조종사 찰스 그린이 런던의 복솔 가든에서 두 명의 대원을 데리고 열기구 로열 복솔 (Royal Vauxhall)호를 타고 출발했다. 순풍이 불어준 덕분에 열기구는 영국해협을 건너 독일 나사우의 바일부르크까지 날아갔다. 총거리 약 500마일 (800km)에 달하는 이번 비행은 역사상 가장 긴 거리를 날았던 열기구 비행으로 기록되었다."
 curtiss.600.f: "로열 복솔 호의 비행은 대성공을 거두었다. 비행 거리 기록은 80년 동안 깨지지 않았다.\n비행에 위험이 따르지 않은 것은 아니었다. 19세기의 열기구 비행은 어디에 착륙할지 전혀 알 수 없다는 점에서 특히 위험했다. 이에 따라 찰스 그린은 여정에 나서는 동안 충분한 식량을 챙겼다. 거기에 균형을 맞추기 위한 모래 1톤, 300m 길이의 밧줄, 기압계와 망원경, 여러 종류의 술과 외투, 온갖 물건들을 실었다. 이 모든 물자 뿐만 아니라 찰스 그린 본인과 토머스 몽크 메이슨, 로버트 홀랜드 두 명의 동행자가 기구 바구니에 몸을 구겨넣어야 했다.\n바일부르크에 도착한 이들은 현지 주민들의 도움, 그리고 가져온 브랜디와 함께, 열기구에 실었던 물자를 하선시키고 귀환할 준비를 했다. 바일부르크에서 세 사람은 나사우 공작을 비롯한 많은 사람들의 따뜻한 환영을 받았다. 이들은 열기구에 쓸 석탄 가스가 없어 마차를 타고 고국으로 돌아와야 했다."
 curtiss.600.g: "대영제국의 진기록이 또 하나 생겼군!"
 curtiss.601.t: "립 패널의 발명"
 curtiss.601.d: "열기구에 열광하던 발명가 [SCOPE.sCharacter('santos_balloonist_scope').GetFullName](이)가 열기구 비행을 보다 안전하게 만드는 최신 발명품을 공개하였다. 일명 립 패널(rip panel)이란 이름의 이 발명품은 열기구 본체에 가볍게 부착된 외피의 한 부분으로, 열기구가 착륙할 때 이 부분을 뜯어낼 수 있도록 설계됐다. 그렇게 하면 열기구에 차 있던 가스가 빠른 속도로 빠져나가게 되며, 풍선이 지면에 끌리거나 어딘가에 걸리거나 충돌하는 것을 방지할 수 있다."
 curtiss.601.f: "립 패널이 발명되기 전까지 열기구 조종사들은 닻으로 열기구를 고정하거나 열기구 꼭대기로 직접 올라가 밸브를 개방하여 열기구의 공기를 빼내야 했다. 이는 기체가 빠르게 빠져나가 열기구가 찌그러진다는 점에서 매우 위험했다. 열기구 조종사들이 선체에 끼어 사망하는 사고도 빈번했다. 1839년 4월 27일 립 패널이 발명되면서 열기구 조종은 훨씬 안전해졌다."
 curtiss.601.g: "참 훌륭한 발명품이오! 이 분에게서 다시 소식이 들려왔으면 하네!"
 curtiss.601.h: "사실 새로운 열기구 조종사를 찾고 있네만!"
 curtiss.601.h.tt: "경험 많은 열기구 조종사 [SCOPE.sCharacter('santos_balloonist_scope').GetFullName](이)가 국가에서 후원하는 새로운 열기구 조종사가 됩니다."
 curtiss.602.t: "프랑시스크 아르방, 열기구 비행으로 알프스 산맥 횡단 성공"
 curtiss.602.d: "프랑스의 열기구 조종사 프랑시스크 아르방이 수소 열기구를 타고 알프스 산맥을 처음으로 횡단한 사람으로 기록되었다. 1849년 9월 2일 저녁 아르방은 마르세유에서 이륙하여 동쪽으로 향했다. 그의 열기구는 코티앙 알프스를 넘기 위해 약 15,000피트 (4,600m) 고도까지 상승하였다. 그 다음날 오전 2시 30분 경, 아르방은 토리노 인근에 착륙하였다."
 curtiss.602.f: "알프스 산맥 횡단은 오랜 세월 동안 깨지지 않는 기록으로 남았다. 이 기록이 다시 세워진 것은 1924년에 이르러서였다.\n아르방은 알프스 산맥 횡단에 앞서 이미 열기구 조종 경험을 쌓았다. 17살이 되던 1832년 무렵 첫 비행 시도에 나섰지만, 대부분의 열기구 비행은 1845년~1849년 이탈리아에서 실시하였다. 1846년에는 트리에스테 인근에서 항로를 이탈하여 어부들에게 구조되기도 하였다."
 curtiss.602.g: "굉장하군! 프랑스의 진정한 영웅일세!"
 curtiss.603.t: "열기구 비행으로 지중해 횡단에 나선 프랑시스크 아르방이 실종"
 curtiss.603.d: "알프스 산맥을 열기구로 횡단한 지 불과 한 달 만에 프랑시스크 아르방이 실종되고 말았다. 바르셀로나에서 이륙한 아르방은 바람에 휘말려 지중해 쪽을 향해 떠내려갔다. 이후로 그의 흔적은 발견되지 않고 있다. 구조대를 파견해 아르방을 찾아 나서는 것이 좋을까?"
 curtiss.603.f: "실제 역사에서도 1849년 10월 7일 프랑시스크 아르방의 열기구가 망망대해 위로 떠내려 갔다. 그 후로 아르방의 흔적은 전혀 발견되지 않았다. 정황상 이 때의 비행으로 사망한 것으로 보인다. 그러나 정확한 사고 경위는 미지의 상태로 남아 있다."
 curtiss.603.g: "나쁜 소식이군! 선박들을 파견하여 즉각 수색에 나서도록 하시오!"
 curtiss.603.h: "위험 부담을 안고 간 사람이다. 우리가 할 수 있는 것은 없어."
 curtiss.604.t: "프랑시스크 아르방 구조"
 curtiss.604.d1: "수색 작전이 결실을 맺었다! 우리 배 한 척이 프랑시스크 알방을 찾아낸 것이다! 다행히 아르방은 기민하게도 열기구에서 물건을 계속 떨어뜨려 물 위에 흔적을 남기는 버릇이 있었다. 우리 배에서 그 흔적을 발견하고 따라갔던 것이다. 아르방은 열기구에서 바구니를 분리하고 그것을 며칠 동안 붙잡고 있었다. 열기구에 실었던 몇 가지 보급픔 덕에 그러한 시련에서 살아남을 수 있었다."
 curtiss.604.d2: "한 어선이 바르셀로나 연안에서 프랑시스크 알반의 열기구를 발견했다. 상황을 고려하면 건강은 양호하겠으나 심한 탈수 증세를 보이고 있다. 하루빨리 회복되기를 바란다!"
 curtiss.604.f: "\"내 인생에서 가장 신나는 열기구 비행이었습니다! 기록도 경신이 되었다면 좋겠군요!\""
 curtiss.604.g: "정말 다행이야! 돌아온 것을 환영하오, 아르방!"
 curtiss.605.t: "속보: 아르방이 아프리카에서 노예 신세로 발견!"
 curtiss.605.d: "스페인의 여러 일간지에서 아르방이 지중해에 떨어진 것이 아니라 열기구를 타고 아프리카로 건너갔다가 그곳에 노예로 억류되어 있다고 보도했다. 아르방을 수색하여 자유의 몸에서 벗어나게 해달라는 국민들의 투서가 날이 갈수록 늘어나고 있다."
 curtiss.605.f: "실제 역사에서 1853년 여러 신문에 아르방이 아프리카에서 노예 신세가 되었다는 기사가 실린 적은 있지만, 이를 뒷받침하는 증거는 없었다. 아르방에게 정확히 무슨 일이 벌어졌는가는 불분명하나, 지중해에서 익사했을 가능성이 높다."
 curtiss.605.g: "아르방을 찾아야 한다!"
 curtiss.605.h: "누구도 그렇다 해선 안 될 믿기 어려운 이야기로군."
 curtiss.606.t: "[SCOPE.sCountry('curtiss_arban_slaver_scope').GetName]에 억류되어 있던 아르방"
 curtiss.606.d: "우리 조사단은 아르방이 아직 살아있다는 사실을 밝혀냈다. 아르방은 [SCOPE.sCountry('curtiss_arban_slaver_scope').GetName]에 있었으며 그곳에서 노예처럼 들판에 나가 일하고 있었다. 주인은 우리가 엄청난 금액을 제시하면 넘겨주겠다고 한다. 물론, 무력을 써서 풀려나게 할 수도 있다."
 curtiss.606.f: "실제 역사에서 각 신문들은 후속 보도를 이어가지 않았다. 따라서 아르방이 정말로 노예 신세가 되었는가는 확실치 않다. 다만 그렇지 않았을 것으로 추정된다."
 curtiss.606.g: "노예의 삶에서 구출해 주어야 한다!"
 curtiss.606.h: "그냥 돈 좀 쥐어주고 끝내자구..."
 curtiss.607.t: "노예에서 벗어나 조국으로 돌아온 아르방"
 curtiss.607.d1: "소규모 특공대가 아르방을 억류 상태에서 구출하는 임무를 맡았다. 짧은 교전 끝에 아르방과 여러 유럽인들을 구출하여 말에 태우고 탈출할 수 있었다. [SCOPE.sCountry('curtiss_arban_slaver_scope').GetAdjective] 당국이 대응에 나서기 전에 이미 고국으로 돌아가는 배에 몸을 싣게 되었다. 아르방은 오랜 기간 동안 억류되면서 몸이 쇠약해졌지만, 우리에게 모험적인 열기구 비행에 관한 이야기를 들려줄 수 있었다. 그의 경험담은 분명 우리나라에도 큰 도움이 되리라."
 curtiss.607.d2: "아르방이 조국으로 돌아왔다. 오랜 기간 동안 억류되면서 몸이 쇠약해졌지만, 우리에게 모험적인 열기구 비행에 관한 이야기를 들려줄 수 있었다. 그의 경험담은 분명 우리나라에도 큰 도움이 되리라."
 curtiss.607.f: "\"바람에 휘말려 망망대해로 나아갔단 말입니다. 남쪽으로 밀려가는 상황이라 발레아레스 제도에라도 도달해 보기로 마음먹었습니다. 그런데 바람이 워낙 안 좋아서 북아프리카 해안까지 밀려가 착륙할 수밖에 없었습니다. 아쉽게도 그곳 주민들은 그닥 친절하지 않더군요. 지중해 상공을 비행한 사람이 또 있었습니까? 제가 기록을 세운 건가요?\""
 curtiss.607.g: "성공적인 구출 작전이었소!"
 curtiss.607.h: "돌아온 것을 환영하네, 아르방!"
 curtiss.608.t: "어디에도 남지 않은 아르방의 흔적"
 curtiss.608.d: "몇 달간의 수색에도 우리는 여전히 아르방의 흔적을 전혀 찾지 못했다. 북아프리카에 노예 신세로 지내고 있다는 이야기는 지어낸 이야기였던 것으로 보인다. 프랑시스크 아르방은 틀림없이 사망했을 것이다."
 curtiss.608.f: "\"프랑스인? 아 그럼! 프랑스인이라면 우리가 많이 갖다 팔지. 어떤 놈으로 줄까? 하나같이 힘 세고 바닷일 하던 놈이라오!\""
 curtiss.608.g: "수색을 중단한다."
 curtiss.609.t: "나다르, 열기구에서 최초의 항공 사진 촬영"
 curtiss.609.d: "프랑스의 사진가 나다르는 열기구 조종과 사진이라는 두 가지의 야심을 하나로 모았다. 공중에서 사진을 촬영하는 데 성공한 것이다. 이 사진은 이전까지 극소수의 사람만 보았을, 창공에서 바라본 세상을 보여주고 있었다."
 curtiss.609.f: "나다르는 1859년 솔페리노 전투에서 첫 항공 사진 촬영에 나섰다. 1863년 나다르는 항공 관련 협회인 #b 공기보다 무거운 기계를 이용한 공중수송 장려 협회#! (Société d'encouragement pour la locomotion aérienne au moyen d'appareils plus lourds que l'air)의 회장이 되었다. 이 협회의 비서는 다름아닌 소설가 쥘 베른이었는데, 나다르의 열기구 비행에서 영감을 받아 소설 '#b 열기구에서의 5주#!'를 쓰기도 하였다."
 curtiss.609.g: "상공에서 바라본 세상은 이토록 다르구나!"
 curtiss.610.t: "나다르의 르 제앙 호가 하노버에 추락"
 curtiss.610.d: "파리에서 하노버까지 아슬아슬하고 몹시 까다로운 비행에 나섰던 나다르가 초대형 열기구 '르 제앙' 호를 하노버의 들판에 추락시켰다. 나다르와 그 아내는 심각한 부상을 입었다. 하루빨리 회복하여 다시 열기구 비행에 나설 수 있기를 바란다!"
 curtiss.610.f: "'르 제앙' (Le Géant, 거인) 호는 그 이름처럼 높이 60m에 달하는 거대한 열기구였으며, 에두아르 고다르가 제작하여 나다르가 조종하였다. 두번째 비행에서 나다르는 르 제앙 호를 지면에 충돌시키고 말았다. 본인은 심각한 부상을 입은 것은 물론 열기구도 크게 망가졌으나, 나다르는 르 제앙 호를 수리하여 다시 비행에 나섰다. 1867년에는 최대 12명의 승객을 태우고 비행에 나서 차가운 닭고기와 포도주를 대접하기도 했다."
 curtiss.610.g: "참으로 끔찍한 사고로다!"
 curtiss.611.t: "글레이셔와 콕스웰, 열기구 최고 고도 비행 기록 수립"
 curtiss.611.d: "기상학자 제임스 글레이셔와 열기구 조종사 헨리 트레이시 콕스웰이 열기구 최고 고도 비행 기록을 세웠다. 이 두 사람은 열기구에 함께 승선하여 약 11,270m (37,000피트)에 달하는 고도까지 올라갔다. 8,800m 고도에서 글레이셔는 이미 의식을 잃었다. 콕스웰은 간신히 열기구를 하강시킬 수 있었다. 다행히 두 사람은 목숨을 건졌다."
 curtiss.611.f: "1862년 글레이셔와 콕스웰은 열기구 '맴모스' 호에 올랐다. 두 사람의 비행은 영국 과학 발전 협회으로부터 초고층 대기권에서 실험을 수행할 것을 의뢰받으면서 이루어지게 되었다. 8,800m (29,000ft) 고도에서 글레이셔는 정신을 잃고 콕스웰은 손에 감각을 잃고 말았다. 밸브 선이 엉켜버리는 바람에 콕스웰은 바구니에서 열기구를 조작할 수 없었던 것이다. 결국 밧줄 위로 올라가 이빨로 밸브를 개방했다. 그런 뒤 의식을 잃었으나 열기구는 하강하기 시작했다. 15분 뒤 열기구는 지상에 무사히 착륙했다."
 curtiss.611.g: "살아 있는 것이 다행이구만!"
 curtiss.612.t: "에두아르드 스펠테리니, 알프스 횡단 여객 수송애 나서"
 curtiss.612.d: "스위스의 에두아르드 스펠테리니가 승객들을 열기구에 태우고 알프스 산맥을 넘어갔다. 비행 과정에서 알프스의 최정상 중 한 곳을 지나간 것으로 전해졌다. 스펠테리니는 이제 열기구 조종의 떠오르는 별이 되었다."
 curtiss.612.f: "에두아르트 스펠테리니 (태명 알베르트 슈바이처)는 어린 시절부터 열기구 조종 훈련을 받았다. 스펠테리니는 인생 최초로 자신만의 열기구인 '우라니아'(Urania) 호를 마련한 뒤, 유럽 전역을 돌아다니며 상류층 고객을 대상으로 상공에서 바라본 세상을 보여주는 사업을 펼쳤다. 비행에는 갈빗살과 샴페인으로 구성된 간단한 도시락이 함께 포함된 것이 일반적이었다. 스펠테리니는 항공 사진 촬영도 시작했으나 자신의 명성을 가장 크게 드높인 것은 알프스 산맥 위를 나는 여객 비행이었다."
 curtiss.612.g: "전망이 기가 막히는군!"
 curtiss.613.t: "지파르가 제작한 조종형 비행선의 첫 비행"
 curtiss.613.d: "열기구 비행은 언제나 순풍에 의존한다는 것이 큰 문제였다. 열기구가 바람에 떠내려가기가 너무 쉽고 그로 인한 사고도 빈번했던 것이다. 앙리 지파르는 이 문제를 해결하기 위하여 증기 엔진과 방향타를 장착한 길쭉한 비행선을 제작하였다. 자파르는 이른바 '자파르 조종기구'라 불리는 이 비행선을 타고 파리에서 엘랑쿠르까지 27km를 비행하였다. 비행선의 속도가 너무 느린 탓에 역풍을 거스르는 것은 아직까지 불가능하다. 하지만 이런 비행선이 앞으로 어떤 방향으로 발전할지는 누가 알겠는가?"
 curtiss.613.f: "1852년 9월 24일 지파르는 동력으로 움직이고 조종이 가능한 비행선을 타고 최초로 비행에 성공했다. 그러나 증기 엔진의 추진력이 너무 약했기 때문에 아직까지는 비행선이 제대로 자리 잡지는 못했다. 이후 내연기관의 발명으로 비행선을 향한 꿈은 비로소 구현될 수 있었다."
 curtiss.613.g: "머지않아 이런 조종형 열기구가 하늘을 정복할 지도 모른다!"
 curtiss.614.t_brussels: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName], 브뤼셀행 고려 중"
 curtiss.614.t_capital: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName], [SCOPE.sCountry('curtiss_august_piccard_destination').GetCapital.GetCityHubName]행 고려 중"
 curtiss.614.d_brussels: "우리나라에서 가장 중요한 학자로 꼽히는 [SCOPE.sCharacter('santos_balloonist_scope').GetFullName](이)가 브뤼셀 자유 대학교로부터 교수직을 제의받았다. 대학교 측은 열기구를 이용해 성층권을 보다 심층적으로 연구할 수 있도록 상당한 재정 지원을 약속하였다. 피카르는 해당 제의를 수락할 의향이 있는 것으로 보인다. 이것이 성사되면 우리는 열기구 비행 분야에서도 풍부한 경험을 가진 훌륭한 과학자를 잃게 된다는 뜻이기도 하다."
 curtiss.614.d_capital: "우리나라에서 가장 중요한 학자로 꼽히는 [SCOPE.sCharacter('santos_balloonist_scope').GetFullName](이)가 [SCOPE.sCountry('curtiss_august_piccard_destination').GetCapital.GetCityHubName] 자유 대학교로부터 교수직을 제의받았다. 대학교 측은 열기구를 이용해 성층권을 보다 심층적으로 연구할 수 있도록 상당한 재정 지원을 약속하였다. 피카르는 해당 제의를 수락할 의향이 있는 것으로 보인다. 이것이 성사되면 우리는 열기구 비행 분야에서도 풍부한 경험을 가진 훌륭한 과학자를 잃게 된다는 뜻이기도 하다."
 curtiss.614.f: "피카르는 1922년 브뤼셀 자유 대학교의 교수로 임명된 후, 강의와 함께 기구를 이용한 성층권 연구에 전념했다. 성층권 연구에서 친구인 알베르트 아인슈타인과 협력해 여러 실험을 구상하기도 했다.\n또한 방사능 측정 장치와 초정밀 지진계를 발명하였으며, 원자물리학을 연구하여 세번째 우라늄 동위원소의 존재를 예측하기도 하였는데, 이것이 바로 훗날 실제로 발견된 우라늄-235이다.\n브뤼셀에서 본인의 강연은 만화 캐릭터 캘큘러스 교수(Professor Calculus)의 모티브가 되기도 했다."
 curtiss.614.g: "피카르 씨에 대한 후원을 이대로 멈출 수는 없소!"
 curtiss.614.h: "우수한 열기구 조종사라면 얼마든지 있다!"
 curtiss.614.g.tt: "경험 많은 열기구 조종사 [SCOPE.sCharacter('santos_balloonist_scope').GetFullName](이)가 국가에서 후원하는 새로운 열기구 조종사가 됩니다."
 curtiss.615.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName]의 [SCOPE.sCountry('curtiss_august_piccard_destination').GetCapital.GetCityHubName]행"
 curtiss.615.d: "스위스 과학자 [SCOPE.sCharacter('santos_balloonist_scope').GetFullName](이)가 [SCOPE.sCountry('curtiss_august_piccard_destination').GetCapital.GetCityHubName](으)로 건너가 [SCOPE.sCountry('curtiss_august_piccard_destination').GetCapital.GetCityHubName] 자유 대학교의 교수로 강단에 서게 되었다. 대학교 측은 열기구를 이용해 성층권을 보다 심층적으로 연구할 수 있도록 상당한 재정 지원을 약속하였다. 피카르는 뛰어난 과학자이자 열기구 조종사로서, 열기구 분야에서 새로운 기록을 세울 전망이다."
 curtiss.615.f: "피카르는 1922년 브뤼셀 자유 대학교의 교수로 임명된 후, 강의와 함께 기구를 이용한 성층권 연구에 전념했다. 성층권 연구에서 친구인 알베르트 아인슈타인과 협력해 여러 실험을 구상하기도 했다.\n또한 방사능 측정 장치와 초정밀 지진계를 발명하였으며, 원자물리학을 연구하여 세번째 우라늄 동위원소의 존재를 예측하기도 하였는데, 이것이 바로 훗날 실제로 발견된 우라늄-235이다.\n브뤼셀에서 본인의 강연은 만화 캐릭터 캘큘러스 교수(Professor Calculus)의 모티브가 되기도 했다."
 curtiss.615.g: "이처럼 명성 높은 열기구 조종사는 우리 국가의 대표가 되어야 한다!"
 curtiss.615.h: "그의 앞날에 행운이 있길!"
 curtiss.615.g.tt: "경험 많은 열기구 조종사 [SCOPE.sCharacter('santos_balloonist_scope').GetFullName](이)가 국가에서 후원하는 새로운 열기구 조종사가 됩니다."
 santos.650.t: "신임 열기구 조종사 소개"
 santos.650.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName](은)는 성공한 열기구 조종사로서 우리의 지원을 받아 열기구 조종의 한계에 도전할 뜻을 밝혀왔다. 기록은 깨지기만 기다리고 있고 과학적 발견은 우리 눈앞에 있다. 열기구 [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] 호라면 본인은 틀림없이 새로운 고도에 도달할 수 있을 것이라고 [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe]는 자신하고 있다."
 santos.650.f: "\"조국의 영광을 드높이겠소!\""
 santos.650.g: "이 자를 지원하는 것이 성과로 돌아왔으면 좋겠군! 열기구 창으로 데려가 주시오."
 santos.650.h: "행운을 비네!"
 santos.651.t: "우리나라의 열기구 비행"
 santos.651.balloonist: "우리는 열기구 조종사 [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] 씨를 후원하기로 결정하였다. 열기구 '[SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] 호'를 타고 계속해서 한층 더 모험적인 비행에 나서려는 사람이다."
 santos.651.noballoonist: "우리나라는 현재 열기구 조종사를 후원하고 있지 않다. 따라서 지금의 우리에게 열기구 기록 경신이란 머나먼 이야기일 것이다. 우리나라 출신 열기구 조종사를 후원하여 신기록 수립에 도전하고, 신형 열기구 개발에 나서도록 지원할 수도 있다."
 santos.651.f: "[SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloonist_trait_level_type')]\n\n#b 현재 [ROOT.GetCountry.GetAdjective] 기록:#!\n - 고도 기록: #b #p [ROOT.Var('santos_balloon_altitude_record_var').GetValue]m#!#!\n - 거리 기록: #b #p [ROOT.Var('santos_balloon_distance_record_var').GetValue]km#!#!\n - 시간 기록: #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]시간#!#!\n\n#b 현재 세계 기록:#!\n - 고도 기록: #b #p [GetGlobalVariable('santos_balloon_altitude_record_global_var').GetValue]m#!#! [GetGlobalVariable('santos_balloon_altitude_record_holder_global_var').GetCountry.GetFlagTextIcon]\n - 거리 기록: #b #p [GetGlobalVariable('santos_balloon_distance_record_global_var').GetValue]km#!#! [GetGlobalVariable('santos_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon]\n - 시간 기록: #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]시간#!#! [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon]"
 santos.651.g: "열기구 조종사의 후원을 시작하게!"
 santos.651.h: "열기구 조종사의 후원을 중단하겠소."
 santos.651.htt: "이 선택지로 열기구 조종사가 게임에서 자취를 감추게 됩니다."
 santos.651.l: "하던 일이나 마저 하겠소!"
 santos.651.w: "우리 조종사의 #yellow 비행#!에 관해서 더는 알리지 마시오!"
 santos.651.w.tt: "열기구 조종사의 #yellow 비행#!이나 #yellow 신규 특성 획득#!에 관한 이벤트를 더 이상 받지 않게 됩니다. 이 설정은 언제든 되돌릴 수 있습니다."
 santos.651.x: "우리 조종사의 #yellow 비행#!에 관해서 알려주시오!"
 santos.651.x.tt: "열기구 조종사의 #yellow 비행#!이나 #yellow 신규 특성 획득#!에 관한 이벤트를 받게 됩니다. 이 설정은 언제든 되돌릴 수 있습니다."
 santos.651.y: "우리 조종사의 #yellow 죽음#!에 관해서 더는 알리지 마시오."
 santos.651.y.tt: "열기구 조종사의 #yellow 죽음#!에 관한 이벤트를 더 이상 받지 않게 됩니다. 신임 열기구 조종사의 후원은 자동으로 이루어집니다. 이 설정은 언제든 되돌릴 수 있습니다."
 santos.651.z: "우리 조종사의 #yellow 죽음#!에 관해서 알려주시오."
 santos.651.z.tt: "열기구 조종사의 #yellow 죽음#!에 관한 이벤트를 받게 됩니다. 이 설정은 언제든 되돌릴 수 있습니다."
 santos.652.t: "조국을 위한 [SCOPE.sCharacter('santos_balloonist_scope').GetFullName]의 첫 비행"
 santos.652.f: " - #b 고도: #p [ROOT.Var('new_balloon_altitude_var').GetValue]m#!#!\n - #b 거리: #p [ROOT.Var('new_balloon_distance_var').GetValue]km#!#!\n - #b 시간: #p [ROOT.Var('new_balloon_time_var').GetValue]시간#!#!"
 santos.652.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName](이)가 열기구 초계 비행을 정식으로 마치고 첫 기록을 남겼다."
 santos.652.g: "시작이 좋군!"
 santos.653.t1: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]의 열기구 비행 고도 기록 경신 실패"
 santos.653.t2: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]의 열기구 비행 고도 신기록 도달"
 santos.653.t3: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName](이)가 자신의 열기구를 타고 그 어떤 인간도 올라보지 못한 고도에 오르는 데 성공했다!"
 santos.653.d1: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName](은)는 자신의 열기구로 최고 고도에 도달하는 비행 시도에 나섰다. 그 결과 고도 #b #n [ROOT.Var('new_balloon_altitude_var').GetValue]#!m#!에 도달했지만 기존 국내 기록인 #b #p [ROOT.Var('santos_balloon_altitude_record_var').GetValue]#!m#!를 넘어서지는 못했다. [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe|U]는 기필코 재도전에 나설 것이다."
 santos.653.d2: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName](이)가 자신의 열기구로 비행 고도 국내 신기록을 달성했다! 고도 #b #p [ROOT.Var('new_balloon_altitude_var').GetValue]#!m#!에 도달하여 기존 국내 기록인 #b #p [ROOT.Var('santos_balloon_altitude_record_var').GetValue]#!m#!을 넘어선 것이다. 다만 안타깝게도 현재 세계 기록인 [GetGlobalVariable('santos_balloon_altitude_record_holder_global_var').GetCountry.GetFlagTextIcon]의 #b #p [GetGlobalVariable('santos_balloon_altitude_record_global_var').GetValue]#!m#!에는 미치지 못했다."
 santos.653.d3: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName](이)가 자신의 열기구로 세계 비행 고도 기록을 경신했다! 고도 #b #p [ROOT.Var('new_balloon_altitude_var').GetValue]#!m#!에 도달하여 기존 국내 기록인 #b #p [ROOT.Var('santos_balloon_altitude_record_var').GetValue]#!m#!은 물론 세계 기록인 [GetGlobalVariable('santos_balloon_altitude_record_holder_global_var').GetCountry.GetFlagTextIcon]의 #b #p [GetGlobalVariable('santos_balloon_altitude_record_global_var').GetValue]#!m#!를 넘어서고 만 것이다."
 santos.653.f1: "\"이번에는 성공을 거두지 못했지만, 다음 기회에는 반드시 해내고 말 것이오!\"\n\n[SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloonist_altitude_flight_type')]"
 santos.653.f2: "\"그런 기록 누가 신경이나 쓴다고? 난 세계 기록을 원하네!\"\n\n[SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloonist_altitude_flight_type')]"
 santos.653.f3: "\"누워서 떡 먹기군!\"\n\n[SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloonist_altitude_flight_type')]"
 santos.653.g: "다음 번엔 행운이 있길!"
 santos.653.h: "수고했소!"
 santos.653.i: "정말 대단해! 경축드리오!"
 santos.654.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloonist_distance_flight_title_type')]"
 santos.654.d: "[SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloonist_distance_flight_description_type')]"
 santos.654.f1: "\"이번에는 성공을 거두지 못했지만, 다음 기회에는 반드시 해내고 말 것이오!\"\n\n[SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloonist_distance_flight_type')]"
 santos.654.f2: "\"그런 기록 누가 신경이나 쓴다고? 난 세계 기록을 원하네!\"\n\n[SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloonist_distance_flight_type')]"
 santos.654.f3: "\"누워서 떡 먹기군!\"\n\n[SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloonist_distance_flight_type')]"
 santos.654.g: "다음 번엔 행운이 있길!"
 santos.654.h: "수고했소!"
 santos.654.i: "정말 대단해! 경축드리오!"
 santos_distance_title_no_record: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]의 열기구 비행 거리 기록 경신 실패"
 santos_distance_record_global_broken_trigger: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]의 열기구 비행 거리 신기록 도달"
 santos_distance_title_time_record_country: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]의 국내 열기구 비행 거리 기록 경신"
 santos_distance_title_both_records_country: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]의 국내 열기구 비행 거리 및 시간 기록 경신"
 santos_distance_title_distance_record_global: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName](이)가 자신의 열기구를 타고 그 어떤 인간도 나아가지 못한 거리까지 나아가는 데 성공했다! "
 santos_distance_title_time_record_global: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName](이)가 자신의 열기구를 타고 그 어떤 인간도 버티지 못한 시간 동안 비행하는 데 성공했다! "
 santos_distance_title_both_records_global: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName](이)가 자신의 열기구를 타고 그 어떤 인간도 나아가지 못한 거리와 시간 동안 비행하는 데 성공했다! "
 santos_distance_description_no_record: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName](은)는 자신의 열기구로 최대한 먼 거리로 나아가는 시도에 나섰다. 그 결과 #b #n [ROOT.Var('new_balloon_distance_var').GetValue]#!km#! 거리에 도달했지만 기존 국내 기록인 #b #p [ROOT.Var('santos_balloon_distance_record_var').GetValue]#!km#!를 넘어서지는 못했다. 비행 지속 시간 역시 #b #n [ROOT.Var('santos_balloon_time_record_var').GetValue]#!시간#!을 기록하여, 기존 비행 지속 시간 기록인 #b #p [ROOT.Var('new_balloon_time_var').GetValue]#!시간#!을 넘어서지 못했다. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName](은)는 기필코 재도전에 나설 것이다."
 santos_distance_description_distance_record_country: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] has set a new distance record for our country with [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] balloon! With a distance of #b #p [ROOT.Var('new_balloon_distance_var').GetValue]#! kilometers#!, [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] was able to clearly surpass our country's previous record of #b #p [ROOT.Var('santos_balloon_distance_record_var').GetValue]#! Kilometers#!.  But unfortunately it was not enough to break the world record of #b #p [GetGlobalVariable('santos_balloon_distance_record_global_var').GetValue]#! kilometers#! [GetGlobalVariable('santos_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon]. The duration of #b #n [ROOT.Var('new_balloon_time_var').GetValue]#! hours#! was unfortunally not enough for our national record of #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! hours#!"
 santos_distance_description_time_record_country: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] has set a new duration record for our country with [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] balloon! With a duration of #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! hours#!, [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] was able to beat our country's previous record of #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! hours#!.  Unfortunately it was not enough for the world record of #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! hours#! [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon] The distance record of our country of #b #p [ROOT.Var('santos_balloon_distance_record_var').GetValue]#! kilometers#! could not be broken either with a distance of #b #n [ROOT.Var('new_balloon_distance_var').GetValue]#! kilometers#!."
 santos_distance_description_both_records_country: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] has set a new distance record and a new continuous flight record for our country with [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] balloon! With a distance of #b #p [ROOT.Var('new_balloon_distance_var').GetValue]#! kilometers#!, [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] was able to clearly surpass our country's previous record of #b #p [ROOT.Var('santos_balloon_distance_record_var').GetValue]#! kilometers#!. It was not enough for the world record of #b #p [GetGlobalVariable('santos_balloon_distance_record_global_var').GetValue]#! Kilometers#! [GetGlobalVariable('santos_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon] Though. With a duration of #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! hours#! the national record of #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! hours#! was broken as well, but not the world record of #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! hours#! [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon]"
 santos_distance_description_distance_record_global: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] has set a new world record for a distance flight with [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] balloon! With a distance of #b #p [ROOT.Var('new_balloon_distance_var').GetValue]#! kilometers#! [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] was able to break our country's previous record of #b #p [ROOT.Var('santos_balloon_distance_record_var').GetValue]#! kilometers#! and the world record of #b #p [GetGlobalVariable('santos_balloon_distance_record_global_var').GetValue]#! Kilometers#! [GetGlobalVariable('santos_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon] clearly exceed. The duration of the flight of #b #n [ROOT.Var('new_balloon_time_var').GetValue]#! hours#! was unfortunately not enough for the world record of #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! hours#! [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon]"
 santos_distance_description_time_record_global: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] has set a new world record for a duration flight with [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] balloon! With a duration of #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! hours#! [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] was able to break our country's previous record of #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! Hours#! and the world record of #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! Hours#! [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon] clearly exceed. The distance of #b #n [ROOT.Var('new_balloon_distance_var').GetValue]#! Kilometers#! was unfortunately not enough for the world record of #b #p [GetGlobalVariable('santos_balloon_distance_record_global_var').GetValue]#! Kilometer#! [GetGlobalVariable('santos_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon]"
 santos_distance_description_both_records_global: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] has set a new world record for a distance and a duration flight with [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] balloon! With a distance of #b #p [ROOT.Var('new_balloon_distance_var').GetValue]#! kilometers#! [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] was able to break our country's previous record of #b #p [ROOT.Var('santos_balloon_distance_record_var').GetValue]#! kilometers#! and the world record of #b #p [GetGlobalVariable('santos_balloon_distance_record_global_var').GetValue]#! kilometers#! [GetGlobalVariable('santos_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon] clearly surpassed. The world record time of #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! hours#! [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon] could be exceeded with a flight duration of #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! hours#!."
 santos.655.t1: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]의 열기구 비행 시간 기록 경신 실패"
 santos.655.t2: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName]의 국내 열기구 비행 거리 기록 경신"
 santos.655.t3: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName](이)가 자신의 열기구를 타고 그 어떤 인간도 버티지 못한 시간 동안 비행하는 데 성공했다! "
 santos.655.d1: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] tried to fly as long as possible with [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] balloon. With a flight time of #b #n [ROOT.Var('new_balloon_time_var').GetValue]#! hours#!, [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] was not able to beat our country's previous record of #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! hours#!. [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe|U] will surely try again."
 santos.655.d2: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] has set a new record for the longest lasting flight for our country with [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis] balloon! With a flight time of #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! hours#!, [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] beat our country's previous record of #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! hours#!. But unfortunately it was not enough for the world record of #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! hours#! [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon]."
 santos.655.d3: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName](이)가 자신의 열기구로 비행 지속 시간 세계 신기록을 달성했다! #b #p [ROOT.Var('new_balloon_time_var').GetValue]#!시간#! 동안 비행하여 기존 국내 기록인 #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#!시간#!은 물론 세계 기록인 [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon]의 #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#!시간#!도 가뿐히 넘어선 것이다."
 santos.655.f1: "\"이번에는 성공을 거두지 못했지만, 다음 기회에는 반드시 해내고 말 것이오!\""
 santos.655.f2: "\"그런 기록 누가 신경이나 쓴다고? 난 세계 기록을 원하네!\""
 santos.655.f3: "\"누워서 떡 먹기군!\""
 santos.655.g: "다음 번엔 행운이 있길!"
 santos.655.h: "수고했소!"
 santos.655.i: "정말 대단해! 경축드리오!"
 santos.656.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName], 고소공포증으로 열기구 비행 포기"
 santos.656.d: "열기구 비행을 수차례 해 보았다고 자부하던 [SCOPE.sCharacter('santos_balloonist_scope').GetFullName](이)가 조국 대표로 10m 높이에서 처음 비행에 나섰을 때 고소공포증이 있다는 사실을 털어놓았다. 이에 따라 열기구 비행을 그만두기로 한 상황이다."
 santos.656.f: "\"이렇게 끔찍할 데가! 2주 전까지만 해도 엄청난 고도에서 비행하고 있었는데 이젠... 사다리조차 오를 수가 없다네!\""
 santos.656.g: "정말 안타깝군..."
 santos.656.h: "아아악! 후원할 만한 조종사가 또 있는가?"
 santos.670.t: "열기구 사고로 [SCOPE.sCharacter('santos_balloonist_scope').GetFullName] 사망"
 santos.670.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName](이)가 열기구 비행에 나섰다가 추락하여 사망했다. 이로써 우리는 창공의 영웅을 잃었다."
 santos.670.f: "[SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloonist_death_type')]"
 santos.670.g: "참으로 끔찍하다!"
 santos.670.h: "끔찍하구나! 후원할 만한 조종사가 또 있는가?"
 santos.671.t: "경험 많은 열기구 조종사로 등극한 [SCOPE.sCharacter('santos_balloonist_scope').GetFullName]"
 santos.671.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName](이)가 수차례의 열기구 비행을 마치고 열기구 조종 경험도 상당한 수준에 이르렀다. 이제는 본인의 분야에 숙달되어 경험 많은 열기구 조종사로 여겨지고 있다."
 santos.671.f: "\"겁먹지 말라구! 이런 비행은 수십 번도 더 해봤어!\""
 santos.671.g: "좋은 소식이군!"
 santos.672.t: "유명한 열기구 조종사로 등극한 [SCOPE.sCharacter('santos_balloonist_scope').GetFullName]"
 santos.672.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName](이)가 수백 번의 열기구 비행을 마치고 그 과정에서 기록도 몇 차례 경신하였다. 이제는 국내에 그치지 않은 유명한 조종사로 거듭나게 되었다."
 santos.672.f: "\"[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] 씨라고? 열기구 조종사 말인가? 정말이지 만나보고 싶었는데!\""
 santos.672.g: "정말 대단해!"
 santos.673.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName], 비행 도중 혜성과 추돌"
 santos.673.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName](이)가 열기구 비행 도중 혜성에 맞아 목숨을 잃었다."
 santos.673.f: "열기구 [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] 호가 이륙한지 얼마 되지 않아 큰 폭발음이 들렸다. 지상에 있던 사람들은 섬광 하나가 하늘을 가로질러[SCOPE.sCharacter('santos_balloonist_scope').GetFullName]의 탑승용 바구니로 직격하는 모습을 목격했다. 열기구는 불타오르기 시작했고 깊숙이 곤두박질쳤다. 열기구 잔해를 치우자 [SCOPE.sCharacter('santos_balloonist_scope').GetFullName]의 시신이 발견되었다. 이번 사건을 반긴 사람은 오직 천문학자 뿐이었는데 혜성의 잔해를 조사할 수 있다는 이유에서였다."
 santos.673.g: "그 자가 혜성 조심만 했었더라면..."
 santos.673.h: "아, 혜성이라. 악마의 친지이자 친척 같으니... 우리가 후원할 만한 열기구 조종사는 어디 또 없는가?"
 santos.674.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName], 해변에서 열기구 비행에 나섰다가 추락사"
 santos.674.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName](이)가 열기구 비행 도중 해변에 추락하여 목숨을 잃었다. 이상하게도 열기구 잔해 인근에서 고래 한 마리가 발견되었다."
 santos.674.f: "어느 화창한 날 [SCOPE.sCharacter('santos_balloonist_scope').GetFullName](은)는 해변을 따라 비행에 나섰다. 아무리 기다려도 돌아오지 않자 수색대가 파견되었다. 얼마 지나지 않아 잔해가 발견됐다. 열기구와 바구니는 심하게 짓눌린 고래의 유해 밑에서 발견됐다. 인근 마을의 한 술꾼은 피튜니아 화분처럼 생긴 것이 고래와 충돌하는 것을 보았으며 이제 보니 고래가 열기구에 정면으로 부딪힌 것 같다고 목소리를 높였다. 당연하지만 이 이야기는 별 신빙성이 없었다. 흥미롭게도 근처에서 온전한 피튜니아 화분이 발견됐다. 피튜니아는 다소 시든 상태였으며 현지 식물학자의 손에 맡겨졌다.\n\n[SCOPE.sCharacter('santos_balloonist_scope').GetFullName](은)는 순수한 마음과 어떤 상황에서도 침착할 수 있는 능력으로 기억될 것이다."
 santos.674.g: "안돼! 또라니!"
 santos.674.h: "땅바닥아 안녕! 후원할 만한 조종사가 또 있는가?"
 santos.676.t: "열기구 조종사 사망"
 santos.676.d: "수십 년간 [concept_santos_balloonist]로 활동해 왔던 우리의 옛 #b #r 열기구 조종사#!#!가 세상을 떠났다. 과연 이토록 눈부신 탐험가를 대신할 사람은 누구인가?"
 santos.691.t: "열기구 유형"
 santos.691.d: "열기구의 유형을 변경합니다. 변경 작업에는 반년의 시간이 소요됩니다. 이 기간 동안 열기구는 사용이 불가능합니다."
 santos.691.f: "각 기록에 특화된 열기구는 해당 기록에서 5퍼센트가 가산되는 동시에 다른 기록에서 -5퍼센트가 감산된다. 예를 들어서 거리 특화형 열기구는  #V 거리 기록#! #G +5%#! 가산인 동시에 #V 고도 기록#! #R -5%#!, #V 시간 기록#! #R -5%#! 감산이 적용된다. 어느 기록에도 특화되지 않은 범용 열기구는 가산도 감산도 적용받지 않는다."
 santos.691.g: "높이 오를 열기구가 필요해."
 santos.691.h: "거리가 우선이야."
 santos.691.i: "시간이 전부다!"
 santos.691.j: "어느 기록이든 적당히 잘 날면 그만."
 santos.691.k: "그만두겠다."
