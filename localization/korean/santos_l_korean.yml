 santos_balloon_experiments_modifier: "열기구 실험"
 curtiss_arban_lost_modifier: "프랑시스크 아르방의 실종"
 curtiss_searching_arban_modifier: "프랑시스크 아르방을 찾아서"
 curtiss_sponsoring_balloonist_modifier: "열기구 조종사 후원"
 curtiss_sponsoring_balloonist_ai_modifier: "열기구 조종사 후원"
 santos_balloon_altitude_record_modifier: "열기구 고도 기록"
 santos_balloon_distance_record_modifier: "열기구 비행 거리 기록"
