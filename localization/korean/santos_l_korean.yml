 je_santos_balloon_adventure: "Balloon Adventure"
 je_santos_balloon_adventure_reason: "During their adventurous journey, balloonists can collect items related to their profession. Archaeologists and ethnologists collect artifacts; naturalists collect specimens and fossils; geologists collect generic and rare materials; meteorologists collect magnetic data, physical data, and oceanographic knowledge; and engineers, on the other hand, return with technical insights.\n\nThere is a #G small chance#! that balloonists will not return alive from their journey."
 santos.502.t: "탐험에서 돌아온 열기구 조종사"
 santos.502.d: "After many months of traveling, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] is back in [GetPlayer.GetNameNoFormatting]. Curious onlookers are eagerly awaiting [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis] return. [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe|U] surely has some exciting stories to tell—and [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe]'s brought back some souvenirs!"
 santos.502.f: "Somewhere over the rainbow\nBluebirds fly\nAnd the dreams that you dream of\nDreams really do come true-ooh-ooh\nSomeday I'll wish upon a star\nWake up where the clouds are far behind me\nWhere trouble melts like lemon drops\nHigh above the chimney tops that's where\nYou'll find me, oh"
 santos.502.g: "The balloonist is actually good for something ..."
 santos.503.t: "동물을 데리고 온 열기구 조종사"
 santos.503.d: "최근 탐험에 나섰던 우리 열기구 조종사가 또 한번 목숨을 걸어야 하는 위험천만한 도전을 극복해냈다. 그러나 [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] 씨가 얻어온 것은 미미했고, 그 대신 무언가 다른 것을 데려왔다고 한다. 그것은 다름아닌 자그마한 동물이었다..."
 santos.503.g: "참으로 작고 예쁜 원숭이로군! 너무 귀여워!"
 santos.504.g: "참으로 작고 예쁜 족제비로군! 너무 귀여워!"
 santos.505.g: "참으로 작고 예쁜... 이건 도대체 무슨 동물이야?"
 santos_balloon_ride_cost_modifier: "기본 열기구 조종사 예산"
 santos_balloon_adventure_cost_modifier: "열기구 탐험 예산"
 santos_balloon_record_cost_modifier: "열기구 기록 시도 예산"
 santos_balloon_contract_modifier: "열기구 조종사 계약"
 santos_balloon_record_progress_bar: "열기구 기록"
 santos_balloon_record_progress_bar_desc: "열기구 기록 준비: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|1%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/12)"
 je_santos_balloon_record: "열기구 기록"
 je_santos_balloon_record_reason: "Records can be set in the categories of altitude, distance, and time. After a certain amount of preparation time, a balloonist will attempt to set a record in one of these categories. Even if he only manages to break the national record, he can expect a small technology boost. In addition, he will always receive experience points, which are tiered based on his success. \n\nThere is a #YELLOW moderate chance#! that balloonists will die when doing a record flight."
 je_santos_balloon_crossing: "Balloon Crossing"
 je_santos_balloon_crossing_reason: "#p [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] is currently crossing the [Scope.Var('santos_balloon_crossing_target_var').GetFlagName].#!\n\nBalloon crossings pose the greatest challenge for a [concept_santos_balloonist]. Each [concept_santos_balloon_crossing] can be classified into one of three difficulty levels—and these levels determine the potential for negative events, which can quickly become disastrous, especially on the most demanding routes. A balloonist's [concept_academics_experience] and [concept_character_trait] often determine which events are triggered. For example, ambitious balloonists tend to perform impressive maneuvers that can shorten the flight duration, while cautious balloonists tend to minimize risks. Additionally, a balloonist with the Meteorologist trait—or a dedicated [concept_curie_meteorological_physicist]—can protect against the most devastating weather conditions.\n\nIf a balloonist pushes their luck too far, there is a risk that they will perish on the journey. After one year, a balloonist will abandon their endeavor without achieving any results.\n\nThere is a #R significant chance#! that balloonists will die when doing a balloon crossing."
 santos_ballooning_danger_progress_bar: "위험도"
 santos_ballooning_danger_progress_bar_desc: "위험도: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|1%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/5)"
 santos.506.g: "참으로 작고 예쁜 코알라로군! 너무 귀여워!"
 santos_balloon_crossing_cost_modifier: "열기구 횡단 예산"
