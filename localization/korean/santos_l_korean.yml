 santos.681.t: "고든 베넷 컵"
 santos.681.d: "Preparations for the first major international balloon race are in full swing. Balloonists from all over the world are gathering in [ROOT.GetCountry.GetCapital.GetCityHubName] to test their strength in the long-distance competition. The event is already considered legendary and will find its continuation in the coming years."
 santos.681.f: "'At no previous flight, have I received so many good wishes when I left, with me on my way, and never before I have I made so many preparations as for this flight for the Gordon-Bennett-Cup 1907. Soon after the race from Paris in September 1906 was over, the wish raised in me, to take part in this years flight. I say thanks to the Deutschen Luftschiffer-Verband, for their selecting me as its representative, as well as to Baron von Hewald and Hauptmann Hildebrandt, who placed their big balloon POMMERN at my disposal. So they made the victory this year possible for me.\n\nDuring this flight, I received the best impression of North-America concerning flying balloon and hospitality. I only regret, that this country was not even bigger, to allow me, to fly my balloon to its full range and breaking the world-record for distance.' -Oscar Erbslöh"
 santos.681.g: "Wonderful!"
