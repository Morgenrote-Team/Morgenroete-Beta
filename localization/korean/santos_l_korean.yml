 santos.401.t: "횡단 비행지 선택"
 santos.401.d: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName](은)는 [concept_santos_balloon_crossing]에 나설 지역을 놓고 여전히 고민 중에 있다. 그 여정의 목적지는 신중히 택해야 한다. 어쩌면 인생 마지막 여정이 될지도 모를 일이니까..."
 santos.401.f: "\"어서 빨리 타프타와 밧줄을 챙기시오. 그러면 세상에서 가장 놀라운 광경을 눈에 담게 될 테니.\" - 조제프미셸 몽골피"
 santos.431.d: "By conquering the [Scope.Var('santos_balloon_crossing_target_var').GetFlagName], [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] has accomplished an outstanding feat: After many hours of perseverance, it is finally clear that this challenge has been met. The sun shines brightly in the blue sky, heralding a new day for ballooning!"
 santos.431.g: "A remarkable achievement for a balloonist!"
