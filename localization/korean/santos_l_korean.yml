 SANTOS_CROSSING_EVENTS_ENTRIES_EMPTY: "아직 로그 기록 없음"
 santos_balloon_crossing_event_favorable_weather_icon_flag: "@santos_event_log_positive_favorable_weather_icon!"
 santos_balloon_crossing_event_favorable_weather_title_flag: "Favorable Weather"
 santos_balloon_crossing_event_favorable_weather_flag: "#t $santos_balloon_crossing_event_favorable_weather_title_flag$#!\nThe sun is shining and the wind is favourable. The balloon is making better progress than expected."
 santos_balloon_crossing_event_wind_shear_icon_flag: "@santos_event_log_positive_wind_shear_icon!"
 santos_balloon_crossing_event_wind_shear_title_flag: "Wind Shear"
 santos_balloon_crossing_event_wind_shear_flag: "#t $santos_balloon_crossing_event_wind_shear_title_flag$#!\nThe wind has changed in the balloonist's favour. The balloon is practically gliding through the sky!\n\n#b The following factors make this outcome more likely:#!\n[concept_santos_balloonist] has the $santos_balloonist_experienced$, $santos_balloonist_hero$ or $ambitious$ [concept_character_trait].#!"
 santos_balloon_crossing_event_balloonist_maneuver_icon_flag: "@santos_event_log_positive_balloonist_maneuver_icon!"
 santos_balloon_crossing_event_balloonist_maneuver_title_flag: "Balloonist Maneuver"
 santos_balloon_crossing_event_balloonist_maneuver_flag: "#t $santos_balloon_crossing_event_balloonist_maneuver_title_flag$#!\nThe balloonist has carried out a daring manoeuvre that has placed the balloon in an excellent position and enabled it to make maximum progress.\n\n#b The following factors make this outcome more likely:#!\n[concept_santos_balloonist] has the $santos_balloonist_experienced$, $santos_balloonist_hero$ or $ambitious$ [concept_character_trait].#!"
 santos_balloon_crossing_event_cautious_flight_icon_flag: "@santos_event_log_positive_cautious_flight_icon!"
 santos_balloon_crossing_event_cautious_flight_title_flag: "Cautious Flight"
 santos_balloon_crossing_event_cautious_flight_flag: "#t $santos_balloon_crossing_event_cautious_flight_title_flag$#!\nThe balloonist avoids all unnecessary risks.\n\n#b The following factors make this outcome more likely:#!\n[concept_santos_balloonist] has the $cautious$ [concept_character_trait].#!"
 santos_balloon_crossing_event_unfavorable_weather_icon_flag: "@santos_event_log_negative_unfavorable_weather_icon!"
 santos_balloon_crossing_event_unfavorable_weather_title_flag: "Unfavorable Weather"
 santos_balloon_crossing_event_unfavorable_weather_flag: "#t $santos_balloon_crossing_event_unfavorable_weather_title_flag$#!\nBad weather is making the balloon trip more difficult than expected."
 santos_balloon_crossing_event_confusing_situation_icon_flag: "@santos_event_log_negative_confusing_situation_icon!"
 santos_balloon_crossing_event_confusing_situation_title_flag: "Confusing Situation"
 santos_balloon_crossing_event_confusing_situation_flag: "#t $santos_balloon_crossing_event_confusing_situation_title_flag$#!\nCloud cover, frosty nights and general uncertainty are hampering the balloon crossing.\n\n#b The following factors make this outcome more likely:#!\n[concept_santos_balloonist] has the $reckless$, $wrathful$, $arrogant$ [concept_character_trait] or a #V negative condition trait like a disease or an addiction#!.#!"
 santos_balloon_crossing_event_dangerous_fog_icon_flag: "@santos_event_log_negative_dangerous_fog_icon!"
 santos_balloon_crossing_event_dangerous_fog_title_flag: "Dangerous Fog"
 santos_balloon_crossing_event_dangerous_fog_flag: "#t $santos_balloon_crossing_event_dangerous_fog_title_flag$#!\nThickening fog is putting the balloon journey in increasing danger!\n\n#b The following factors make this outcome more likely:#!\n[concept_santos_balloonist] has the $reckless$, $wrathful$, $arrogant$ [concept_character_trait] or a #V negative condition trait like a disease or an addiction#!.\n\n#b The following factors make this outcome less likely:#!\n[concept_santos_balloonist] has the $curie_meteorological_physicist$ [concept_character_trait] or having a [concept_curie_meteorological_physicist].#!"
 santos_balloon_crossing_event_violent_storm_icon_flag: "@santos_event_log_negative_wind_icon!"
 santos_balloon_crossing_event_violent_storm_title_flag: "Violent Storm"
 santos_balloon_crossing_event_violent_storm_flag: "#t $santos_balloon_crossing_event_violent_storm_title_flag$#!\nA storm or high-altitude winds can cause the balloon serious trouble!\n\n#b The following factors make this outcome less likely:#!\n[concept_santos_balloonist] has the $curie_meteorological_physicist$ [concept_character_trait] or having a [concept_curie_meteorological_physicist].#!"
 santos_balloon_crossing_event_balloonist_error_icon_flag: "@santos_event_log_negative_balloonist_error_icon!"
 santos_balloon_crossing_event_balloonist_error_title_flag: "Balloonist Error"
 santos_balloon_crossing_event_balloonist_error_flag: "#t $santos_balloon_crossing_event_balloonist_error_title_flag$#!\nThe balloonist caused problems for the balloon expedition itself due to a piloting error.\n\n#b The following factors make this outcome more likely:#!\n[concept_santos_balloonist] has the $reckless$, $wrathful$ or $arrogant$ [concept_character_trait].\n\n#b The following factors make this outcome less likely:#!\n[concept_santos_balloonist] has the $santos_balloonist_experienced$ [concept_character_trait].#!"
 santos_balloon_crossing_event_altitude_sickness_icon_flag: "@santos_event_log_negative_altitude_sickness_icon!"
 santos_balloon_crossing_event_altitude_sickness_title_flag: "Altitude Sickness"
 santos_balloon_crossing_event_altitude_sickness_flag: "#t $santos_balloon_crossing_event_altitude_sickness_title_flag$#!\nThe balloonist has exceeded the critical altitude of 7,000 metres and is therefore suffering from the acute effects of low oxygen levels.\n\n#b The following factors make this outcome less likely:#!\n[GetPlayer.GetName] has researched [GetTechnology('electric_arc_process').GetName].#!"
 santos_balloon_crossing_event_the_pampero_icon_flag: "@santos_event_log_negative_wind_icon!"
 santos_balloon_crossing_event_the_pampero_title_flag: "The Pampero"
 santos_balloon_crossing_event_the_pampero_flag: "#t $santos_balloon_crossing_event_the_pampero_title_flag$#!\nThe Pampero, that notorious, sudden gale over the Río de la Plata, has caught the balloon!\n\n#b The following factors make this outcome less likely:#!\n[concept_santos_balloonist] has the $curie_meteorological_physicist$ [concept_character_trait] or having a [concept_curie_meteorological_physicist].#!"
 santos_balloon_crossing_event_wind_calm_icon_flag: "@santos_event_log_negative_wind_calm_icon!"
 santos_balloon_crossing_event_wind_calm_title_flag: "Wind Calm"
 santos_balloon_crossing_event_wind_calm_flag: "#t $santos_balloon_crossing_event_wind_calm_title_flag$#!\nNot a breath of wind stirs. The balloon is baking under the scorching sun.\n\n#b The following factors make this outcome more likely:#!\n[concept_santos_balloonist] has the $reckless$, $wrathful$ or $arrogant$ [concept_character_trait].#!"
