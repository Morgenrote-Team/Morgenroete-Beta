 pius_adopt_gregorian_calender_decision_desc: "그레고리력이 유럽 대부분 지역에서 사용되던 시절, 다른 달력을 사용하면 종종 문제가 발생했습니다. 유럽 국가들과의 교류 편의성을 위해 그레고리력을 채택할 수 있습니다."
 pius_non_gregorian_calender_modifier: "그레고리력 사용 안 함"
 pius_new_calender_modifier: "불경한 달력"
