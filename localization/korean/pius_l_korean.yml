 pius.111.h_tt: "성모 발현을 계기로 추가 이벤트가 높은 확률로 발생합니다."
 pius.111.i_tt: "유혈 사태가 벌어질 확률이 높아집니다."
 pius.121.h_tt: "이 조치로 알 수 없는 심각한 결과를 초래할 수 있습니다."
 pius.101.t: "라살레트의 성모 발현"
 pius.101.d: "프랑스 남동부의 산맥에서 두 아이가 성모 마리아의 발현을 목격했다고 주장하여, 가톨릭 세계 전반에 열띤 신앙심과 우려의 물결이 일고 있다."
 pius.101.f: "\"아이들아, 가까이 오너라. 두려워 말려무나. 내가 너희에게 기쁜 소식을 전하러 왔다....\"\n\n프랑스 남동부 코르프 인근의 라살레트 마을 위쪽의 높다란 목초지에 어린 양치기 두 명이 환영을 보았다고 전하면서 온 기독교인의 마음을 뒤흔들고 있다. 빛으로 둘러싸여 슬픔에 잠긴 한 여인이 그들 앞에 나타났던 것이다. 여인은 하나님을 등진 세상을 헤아리며 눈물을 흘렸다. 주저없이 행해지는 신성 모독, 더럽혀진 주일, 인류가 회개하지 않으면 닥쳐올 기근과 파멸에 대해서도 말했다.\n처음에는 시골의 전승으로 여겨졌던 이 이야기는 하나의 현상으로 나아갔다. 순례자들이 외딴 산비탈로 몰려들고, 수도사와 기자들이 같은 길을 오른다. 교회는 동요하고 있다. 이번 사건이 회개를 촉구하는 하나님의 부르심으로 받아들인 이들이 있는가 하면, 일반 대중에게 신비주의로 받아들여져 비이성적 열광으로 퍼져나가지는 않을까 우려하는 이들도 있다.\n그르노블 주교는 조심스럽게 공인에 나섰다. 세속 당국은 여전히 의심을 거두지 못하고 있다.\n그럼 교황청은? 교황청은 지켜본다 - 말 없이. 허나 벌써부터 종소리는 울린다."
 pius.101.g: "하늘의 경고일세."
 pius.101.h: "이성을 유지하자."
 pius.102.t: "루르드의 성모 발현"
 pius.102.d: "루르드라는 작은 마을에서 열네살 짜리 소녀가 굴 속에서 빛나는 여인을 보았다고 주장하고 있다. 이 소녀의 환영은 머지않아 순례자와 논란을 끌어모으고, 교황청의 관심도 끌게 될 것이다."
 pius.102.f: "'그 여인은 어리고 맨발에 불쌍한 모습이었다. 허나 어떤 말로도 이를 길이 없는 아름다움을 털어놓았다.'\n\n피레네 산맥 기슭, 루르드 인근 외딴 동굴에서 베르나데트 수비루라는 시골 소녀가 흰옷을 입고 퍼런 허리띠를 두르며 발에는 황금 장미를 꽂은 여인ㅇ을 만났다고 전했다. 처음에 그 환영은 아무 말도 하지 않고 미소만 지었다. 그러다 참회와 기도, 고통, 그리고 하느님의 자비로움을 전해주었다. 자기 자신에 대해선 그저 '원죄 없는 잉태'라 소개하였다.\n처음에 마을 사람들은 비웃었다. 하지만 베르나데트가 숨겨진 샘을 발견하고 그곳을 치유의 수원지라 이름하자, 수천 명의 사람들이 몰려들어 희망을 품고 기도하고 눈물을 흘렸다. 그리고서 그 자리에 목발을 버리고 떠났다. 간증은 퍼져나가고 회의 갖는 이들은 히스테리 증세라 비난하였다. 의사와 사제, 정치인들이 루르드로 몰려들었다.\n교회 측은 조사에 착수하였다. 정부는 경계하는 눈초리로 지켜보고 있다. 그럼에도 사람들은 계속해서 몰려든다."
 pius.102.g: "치유와 희망의 성지일세."
 pius.102.h: "환각이야!"
 pius.103.t: "노크 마을의 조용한 발현"
 pius.103.d: "아일랜드의 노크 마을에서 열다섯 명의 목격자가 성모 마리와 성 요섭, 사도 요한이 아무 말도 하지 않고 모습을 보였다고 증언하였다. 이번 발현은 오래토록 가난과 추방, 외세의 통치에 시달리던 마을 사람들에게 큰 감동을 안겼다."
 pius.103.f: "'그들은 한마디도 하지 않았으매 그 침묵 속에서 온 나라는 희망에 귀기울였도다.'\n\n메이요군 노크 교구 교회에 폭우가 끝없이 내렸다. 그런데도 마을 사람 열다섯 명은 넋을 놓고 서 있었다. 그들 앞에는 남측 박공벽에 빛을 받아 고요한 형상이 펼쳐져 있었던 것이다. 기도하는 자세의 성모 마리아, 그 곁의 성 요셉, 그리고 옷을 입고 복음서를 들고 있는 사도 요한. 세 사람의 뒤편 제단 위에는 어린 양과 십자가.\n아무 말도 없었다. 움직이지 말라는 지시도 없었다. 그런데도 목격자들은 자신들이 본 것을 한시코 맹세하였다. 젊은이와 노인, 남자와 여자 할 것 없이 모두 마찬가지였다.\n기근과 이주 그리고 영적 갈망에 지친 땅에서, 그 침묵의 환상은 설교보다 더 크게 울려 퍼졌다. 곧 순례자들이 치유와 기적과 위로를 찾아 몰려들었다. 영국 정부는 비웃었고, 교회에서도 주저하는 사람들이 있었다. 하지만 아일랜드의 가난하고 독실한 사람들 사이에서 노크의 발현은 존엄을 향한 거룩한 외침이 되었다."
 pius.103.g: "빗줄기 속의 빛 한 줄기일세."
 pius.103.h: "단순한 민담일 뿐이다."
 pius.104.t: "파티마의 비밀"
 pius.104.d: "포르투갈 중부에서 세 명의 어린 양치기들이 성모 마리아의 발현을 반복적으로 목격했다고 전하였다. 이윽고 기적적인 현상을 수천 명이 목격하며 믿음이 절정에 달했다. 아이들이 본 환상에는 전쟁과 고통, 그리고 교회의 미래에 관한 예언이 담겨 있었다."
 pius.104.f: "\"결국 나의 티 없는 성심이 승리할지니.\"\n\n포르투갈 파티마 마을 인근에 위치한 코바 다 이리아의 시골 언덕에서 루시아, 프란시스쿠, 자신타의 세 아이가 태양보다 밝으면서도 광채와 슬픔을 두른 어느 여인을 보았다고 증언하였다. 반년 동안 그 여인은 여러 차례 나타나 세계 대전과 무신론 이념의 대두, 신자들을 향한 박해를 경고하였다. 그리고 참회와 기도, 그리고 러시아를 자신의 성심에 봉헌할 것을 전하였다.\n1917년 10월 13일 수만 명의 사람들이 쏟아지는 빗속에 서 있는 가운데 태양이 하늘에서 나와 회전하고 부수어지는 듯했다. 무릎꿇은 이가 있는가 하면 도망가는 이들도 있었다. 빛이 사라지자 이들의 옷은 말라 있었다. 인파는 침묵과 경외감, 두려움에 휩싸여 흩어졌다.\n교회에서는 신중을 기하고 언론에선 논박이 이루어졌다. 허나 사람들 사이에서, 특히 가난한 자와 아픈 자, 하느님을 믿는 자 사이에서 새로운 불꽃을 지폈다. 희망의 불꽃이자 경고의 불꽃. 성모 마리아를 그저 성모로만 보는 것이 아니라 다가오는 시대의 파수꾼으로 보는 불꽃이었던 것이다."
 pius.104.g: "파티마의 경고에 귀 기울이자."
 pius.104.h: "태양의 기적을 폭로하라."
 pius.105.t: "[SCOPE.sState('pius_marian_apparition_state').GetFarmHubName]의 성모 마리아"
 pius.105.d: "[SCOPE.sState('pius_marian_apparition_state').GetFarmHubName] 지역 인근의 외딴 마을에서 성모 마리아가 발현했다는 소문이 퍼졌다. 이 이야기는 빠르게 전해져 순례자와 회의론자, 교회 당국의 관심을 끌어모았다."
 pius.105.f: "'성모께서는 들판 위에서 빛의 왕관을 쓰고 서서 마치 온 영혼의 슬픔을 아는 듯이 우리를 내려다보셨나이다.'\n\n제일 먼저 입을 연 사람은 어린아이였다. 눈은 경외심에 바짝 뜨고 목소리는 떨리고 있었다. 그 아이는 새벽보다 더 밝은, 광채와 슬픔에 잠긴 여인이 아무 말 없이 나타나, 깊고도 의미심장한 슬픔으로 세상을 바라보았다고 증언했다. 다른 사람들도 성모님을 보았다고 주장했다. 어떤 이들은 무릎을 꿇었고 어떤 이들은 도망쳤다. 모두 그 뒤에 찾아온 고요함을 기억하고 있었다.\n그 이야기는 마을 밖으로 퍼져 나갔다. 순례자들이 손이 촛불을 들고 나타났다. 신자들은 기도했고 고통받던 이들은 희망을 품었다. 사제들은 토론하고 관리들은 눈살을 찌푸렸다. 허나 사람들은 계속해서 몰려들었다. 확신해서가 아니라 더 오래된 무언가, 바로 믿고 싶은 갈망 때문이었다.\n이것이 기적이든, 환상이든, 신화든, 이번 사건은 이미 목격한 이들의 마음을, 그리고 이제 그 의미를 파악해야 할 사람들의 일상을 이루었던 것이다."
 pius.105.g: "믿음 있는 자들에게 건네는 증표다."
 pius.105.h: "이런 집단 히스테리는 억눌러야 한다."
 pius.111.t: "뜻밖의 행렬"
 pius.111.d: "공식적인 공개 행사를 금하라는 정부 명령에도 불구하고 신도들로 이루어진 한 무리가 [SCOPE.sState('pius_marian_apparition_state').GetFarmHubName]의 성모 발현 장소를 향해 자발적인 행렬을 이루었다."
 pius.111.f: "\"우리는 횃불도 깃발도 들지 않았나이다. 묵주와 침묵 그리고 흙먼지 묻은 발만이 있었나이다.\"\n\n그들은 새벽녘에 두세 명씩 무리 지어 들판과 작은 마을을 걸어오며 기도를 되뇌었다. 정오가 되자 인파는 수백 명이 되어 시골길을 따라 걸어갔다. 어떤 이는 맨발이었고 어떤 이는 눈물을 흘렸다. 여인들은 꽃을 들고 노인들은 기도문을 중얼거렸으며 아이들은 목제 성상을 꼭 껴안았다.\n당국은 그곳을 폐쇄하고 군인들을 배치하였다. 허나 누구도 군중을 막지 않았다. 노래 때문이었을까. 침묵 때문이었을까. 보이지 않는 무언가 때문이었을까.\n신도들이 환영을 본 장소에 도착하자 무릎을 꿇고 기도를 중얼거리며 지면에 촛불을 두었다. 하늘에서는 어떤 목소리도 울리지 않았다. 어떤 기적도 본 사람이 없었다. 허나 이미 무언가 변화가 일어났다. 사람들은 법을 어긴 것이 아니었다. 법보다 더 오래된 무언가에 순종하여 처신했던 것이다."
 pius.111.g: "기도하게 두어라."
 pius.111.h: "조용히 지켜보자."
 pius.111.i: "군대를 동원해 해산하라."
 pius.112.t: "성지의 유혈"
 pius.112.d: "성모 마리아 행렬에 금지령이 내려지면서 당국과 신도 간의 충돌이 폭력 사태로 번졌다. 한떄 희망을 불어넣던 성모 발현의 무대는 이제 핏자국으로 물들고 말았다."
 pius.112.f: "\"기도가 있었고 그 뒤로 비명이 있었다.\"\n\n군인들이 투입될 당시에도 촛불은 여전히 타오르고 있었다. 혼란 속에 목소리가 커지다 애원으로 바뀌었다. 여인 하나가 쓰러진다. 소년이 울부짖는다. 누가 명령을 내렸는지는 아무도 모른다. 허나 총성은 울려퍼지고, 곤봉은 휘둘러지고, 군화소리가 향과 흙길을 가로질렀다. 돌아온 침묵은 그 전보다 무거웠다.\n교회는 동요했다. 신도들은 분노했다. 언론들은 조심스럽게 보도했다. 누구는 사고라 하고, 누구는 학살이라 한다. 한때 신성하다 이야기하던 그곳은 이제 기억 속에 저주가 내려지게 되었다. 그럼에도 사람들은 모인다. 꽃이 아닌 분노와 침묵, 그리고 어떤 법으로도 그칠 수 없는 응시와 함께."
 pius.112.g: "이런 일이 벌어지다니 대단히 유감일세."
 pius.112.h: "자업자득이오."
 pius.113.t: "강단의 목소리"
 pius.113.d: "[SCOPE.sState('pius_marian_apparition_state').GetFarmHubName]에서 벌어진 성모 발현을 옹호하는 데 앞장서는 지역 사제가 있다. 이 사제의 설교는 많은 이들을 끌어모으고 있고, 그 가르침으로 희망을 불어넣는 동시에 국가 권위에 도전하고 있다. 그 이름은 [SCOPE.sCharacter('pius_marian_priest_scope').GetFirstName] 신부라고 한다."
 pius.113.f: "\"그분께선 권력자가 아닌 천한 자에게 나타났다. 아무래도 그것이 그분을 잠자코 만들려는 이유일 것이다.\"\n\n마을 위쪽의 석조 교회에서 [SCOPE.sCharacter('pius_marian_priest_scope').GetFirstName](이)라는 사제가 성모 마리아의 자비 뿐만 아니라 정의에 대해서도 설교하기 시작했다. 그 사제의 말은 성당 전체에 울려 퍼진다. \"하느님이 이곳에 전한 바가 있다면, 그 어떤 정부도 메아리를 막을 순 없습니다.\"\n사제의 설교를 듣기 위해 순례자들이 모여들었다. 그 이름은 소문과 찬송가를 통해 퍼져 나간다. 사제는 평화를 촉구하지만 그 존재로 불안은 고조되어 간다. 누군가는 예언자라 하고 누군가는 사제복 입은 반역자라 한다.\n당국은 불안해하고 있다. 군부는 선동이라 말한다. 교회 당국은 교리와 외교 사이에서 갈등하며 머뭇거린다. 이제 당신의 책상에 은밀한 제안이 올라왔다. 그 사제를 조용히, 아무도 모르게 면직하자는 것이다.\n허나 침묵당한 이들은 오히려 더 큰 목소리를 내는 법이다."
 pius.113.g: "설교하도록 두시오."
 pius.113.h: "수도로 소환하여 교섭에 나서도록."
 pius.113.i: "없애버리시오."
 pius.114.t: "온 나라를 뒤흔든 행렬"
 pius.114.d: "전국 각지에서 가톨릭 신자들이 성모발현을 지지하는 공개 시위에 나섰다. 시골 지역의 순례로 시작된 이번 시위는 전국적인 운동으로 발전하게 되었다."
 pius.114.f: "\"그들은 손에 묵주를 들고, 어깨에 아이들을 메고, 입술에는 성모 마리아를 부르짖으며 걸어갔다.\"\n\n어촌에서 공장 도시까지 같은 풍경이 펼쳐진다. 창문에는 촛불이 켜지고 광장에는 찬송가가 울려 퍼지며 수천 명이 침묵 속에 모여든다. 깃발은 나부끼지 않았다. 그저 조각상과 성상, 그리고 끊임없이 되뇌이는 단 하나의 이름, 성모 마리아만이 있을 뿐. 신앙심으로 출발한 것이 저항심으로 변했다.\n[SCOPE.sState('pius_marian_apparition_state').GetFarmHubName]의 성소에서 벌어진 폭력 사태에 대한 항의로 신도들은 거리로 나왔다. 이들은 소리치지 않는다. 기도할 뿐이다. 허나 그 규모는 날로 늘어간다.\n정부 여당에서는 관용을 촉구하는 이들이 있는가 하면, 강경 진압을 주문하는 이들도 있다. 군부는 불안해하고 있다. 그리고 전국 각지의 가정에서는 의심하는 사람조차 이렇게 생각한다. 이렇게 많은 사람들이 믿는다면 어떻게 거짓일 수 있겠는가."
 pius.114.g: "전국 행렬을 허가하시오."
 pius.114.h: "전국 행렬을 금지하시오."
 pius.115.t: "밭은 텅 비어 있고"
 pius.115.d: "[SCOPE.sState('pius_marian_apparition_state').GetFarmHubName]의 여러 농촌 지역에서 큰 흉작이 벌어지고 말았다. 신도들 사이에서는 위험한 소문이 퍼져나가고 있다. 예전에 국가가 나서 침묵시켰던 성모 마리아님이 이제 눈물을 흘리며 벌을 내리고 있다는 것이다."
 pius.115.f: "\"성모께선 기도를 부탁했다. 우리는 성모께 병사를 보냈다.\"\n\n비가 내리지 않는다. 밀은 너무 빨리 누렇게 변했다. 감자는 땅속에서 썩어 들어가 조막만한 크기에 쓴 맛을 냈다. 마을 사람들은 밭이... 버려진 것 같다고 입을 모은다. 한낱 인간이 버린 것이 아니라 신이 은총을 저버린 것 같다는 것이다.\n그래서 사람들은 입을 모은다. 예전에 빛을 발하며 나타났다가, 조롱당하고 만 여인에 대해. 사라진 사제에 대해. 봉쇄되어 버린 성소와 매질당한 순례자들에 대해. 이제 성모께서 얼굴을 돌렸다고 이들은 말한다.\n촛불은 다시 타오르지만 이제는 닫힌 창문 뒤에 있다. 어머니들은 몰래 자식들에게 세례를 내린다. 노인들은 빵 조각을 제물로 삼는다. 교회는 감히 입을 열지 못하지만 사람들은 이미 믿고 있다. 이것은 성모의 슬픔, 혹은 경고라고."
 pius.115.g: "이건 미신이오! 그래야만 해..."
 pius.116.t: "종소리 너머의 침묵"
 pius.116.d: "수 년 간의 탄압과 기적의 부인 끝에, 한때는 독실했던 많은 국민들이 [SCOPE.sState('pius_marian_apparition_state').GetFarmHubName]에 대한 믿음을 저버리기 시작했다. 이제 본인이 가톨릭교도가 아닌 무교라 생각하는 사람들이 점차 늘어가고 있다."
 pius.116.f: "\"성모께선 더 이상 오지 않는다. 꿈으로도, 환영으로도. 촛불은 꺼졌다.\"\n\n성소는 닫혔고 사제는 떠났다. 들판은 고요하다.\n한때 제일 가난한 사람들조차 잠들기 전에 성모송을 나지막히 불렀고, 벽난로 옆에는 성상이 걸렸고, 종소리에는 눈물이 흘렀다. 이제 교회는 비어 있다. 아이들은 고해성사가 뭐냐고 묻는다. 젊은이들은 이성과 진보, 허무를 이야기한다.\n사람들은 이념에 의지하지 않았다. 이들은 재가 되어버렸다. 급진파는 아니다. 지쳐버렸다. 그리고 공허한 침묵 속 어딘가에 질문이 남았다.\n성모께서 우리 곁을 떠난 것인가, 아니면 우리가 떠난 것인가?"
 pius.116.g: "믿음의 시대는 지나갔다."
 pius.119.t: "성소 폐쇄"
 pius.119.d: "새로 들어선 무신론 정부가 성모 마리아 순례지의 폐쇄를 명령했다. 한떄 섬광과 기도의 무대였던 이곳은 이제 국가의 감시 아래 텅 빈 채 침묵 속에 잠겨 있다."
 pius.119.f: "\"종소리도 촛불도 타오르지 않았다. 해 뜨기 전에 문은 굳게 닫혔다.\"\n\n한때 수천 명의 순례객을 불러모았던 성지는 이제 텅 비었다. 예배당 문에는 '인민의회의 명령에 따라 본 건물은 비필수 용도로 선포함'이라 쓰인 공고문이 붙어 있다. 경비병들은 보호하기 위해서가 아니라 막기 위해 지키고 서 있다.\n무력은 쓰이지 않았다. 항의는 용납되지 않았다. 변화는 공문서로 조용히, 폭발이 아닌 부재처럼 다가왔다. 그러나 전국 곳곳의 가정에서 노인들의 손은 떨린다. 할머니들은 묵주를 숨긴다. 아이들은 순례객들이 더 이상 찬송가를 부르지 않는 이유를 묻는다.\n성직자들은 침묵하고, 당에서는 과학과 이성, 진보를 부르짖는다. 그리고 닫힌 문 뒤 어딘가에서, 꺼져가는 촛불처럼 희미하게 타오르는 질문이 있다. 이것이 정말 필요한 일이었는가."
 pius.119.g: "이제 환영 따위에 기념물은 세우지 않는다."
 pius.121.t: "무슨 뜻을 전하려 했나?"
 pius.121.d: "[SCOPE.sState('pius_marian_apparition_state').GetFarmHubName]의 성모 발현은 좋은 징조로 공인되었다. 하지만 그 진정한 의미에 대해서는 해석의 여지가 여전히 남아 있다."
 pius.121.f: "그 빛나는 형체가 마을 사람들에게 나타난 지 몇 주가 흘렀지만, 이후로 별다른 징조가 나타나지 않았다. 하늘에서 불길이 내려오지도 않았고, 구름 속에서 목소리가 들리지도 않았다. 남은 것은 그저 고요한 하늘과 경이롭다는 메아리 뿐.\n하지만 사람들은 평화가, 치유가, 국가의 정신에 어떤 변화가 일었다고 이야기한다. 순례자들은 열광이 아닌 경외심으로 찾아온다. 사제들은 조용히 설교를 이어나간다. 언론에서도 이번만큼은 별 조롱 없이 보도한다. 이런 기적은 무엇을 의미하는가?"
 pius.121.g: "보통 사람들을 축복하는 것이오."
 pius.121.h: "우리 성직자들을 향한 신성한 증표다."
 pius.121.i: "우리 정부의 정당성을 보여주었지."
 pius.122.t: "[SCOPE.sState('pius_marian_apparition_state').GetFarmHubName] 성지"
 pius.122.d: "성모 발현이 벌어진 곳은 이제 명실상부한 순례지로 변모하여, 가깝고 먼 곳을 가리지 않고 조금씩 신자들이 찾아오고 있다."
 pius.122.f: "\"한때 목초지뿐이던 곳에 이제 촛불과 장미, 그리고 수천 명의 조용한 발걸음이 자리한다.\"\n\n도로는 넓어졌고, 들판은 개간되었다. 아이들이 광채를 두른 여인에 대해 이야기하던 곳 근처에는 소박한 예배당이 세워졌다. 매일같이 순례자들이 찾아온다. 아들을 데리고 온 농부들, 검은 옷을 입은 과부들, 휴가 나온 군인들, 그리고 뱃속의 아이를 위해 기도하는 어머니들.\n교회는 이곳을 성지로 인정하고 성지를 건립하고 있다. 그 주변에는 빵과 성배, 묵주, 포도주를 파는 시장이 활기를 띈다. 한때 응접실에서 의심받던 이야기가 이제는 온 국민의 마음속 깊이 자리 잡았다.\n계곡에 울려 퍼지는 종소리를 들으며 우리는 생각한다. 신앙은 다시 태어난 것인가, 아니면 앞으로 다가올 더 큰 무언가의 씨앗인가?"
 pius.122.g: "토투스 투우스 (온전히 주님의 것)."