 gaudi.1161.t: "[GetPlayer.GetName] 지형도 신규 제작"
 gaudi.1161.d: "우리 [concept_tesla_civil_engineer] [GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')](이)가 마침내 [GetPlayer.GetName]의 고정밀 지형도를 완성하였다. 이 지도로 우리 공학자들이 새로운 기반 시설과 건축물을 건설하는 데 보탬이 될 것이다. 뿐만 아니라 [GetPlayer.GetNameNoFormatting]에 있어서도 훌륭한 개관 자료로 기능하게 되었다."
 gaudi.1161.f: "\"이건 정말 근사하군! 내 사는 곳이 옆 도시와 이리도 가까울 줄이야. 그리고 우리 정원 창고마저도 지도에 표시되어 있어!\""
 gaudi.1161.g: "우리 집도 보인다!"
