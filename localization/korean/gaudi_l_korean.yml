 gaudi.35.t: "[SCOPE.sState('gaudi_art_nouveau_quarter_state').GetCityHubName]의 아르누보 지구"
 gaudi.35.d: "예술계의 새로운 발전은 [SCOPE.sState('gaudi_art_nouveau_quarter_state').GetCityHubName]에 그치지 않았다. 도심의 한 구역에 새로운 아르누보 건축이 우후죽순 들어서면서 아방가르드한 구역으로 평가받고 있다."
 gaudi.35.f: "벨기에 브뤼셀에 아르누보 건축이 첫선을 보인 것은 새로운 양식 장식 예술 열풍을 동반한 것이었다. 이 시기의 대표 예술가로는 브뤼셀 거리의 외형에 바로크풍 효과를 내기 위하여 연철을 활용한 귀스타브 스트로방, 독창적인 의자와 관절형 금속 가구로 이름난 가구 디자이너 귀스타브 세뤼리에보비, 잠자리와 나비, 백조, 뱀 등 자연 요소의 외형을 딴 장신구를 제작한 공예 디자이너 필리퍼 볼퍼르스가 있었다. 아르누보 양식은 이웃나라인 프랑스에서도 빠르게 주목을 받았다. 엑토르 기마르는 오르타의 타셀 저택을 방문하고 파리 최초의 아르누보 건축으로 꼽히는 카스텔 베랑제를 지었다. 파리 시민들은 기마르의 독창적이고 아름다운 양식을 환영하였고, 카스텔 베랑제는 파리 최고의 신축 건물로 선정되며 기마르가 건축가 경력에 나서도록 하였다. 1900년 파리 만국 박람회는 아르누보 양식의 정점을 찍었다. 1900년 4월부터 11월까지 전세계에서 약 5천만 명의 방문객이 찾아와 건축, 디자인, 가구, 유리 공예, 장식품 등 다양한 아르누보 양식의 제품을 선보였다. 규모로 따지면 파리 만국박람회가 최대였으나 다른 박람회들도 아르누보 양식을 대중화하는 데 크게 기여하였다."
 gaudi.35.g: "활기찬 신문화로세."
 gaudi.22.t: "직선과 측정"
 gaudi.22.d: "우리 건축가가 고국으로 돌아왔다. 이번에는 측량용 막대를 손에 들고 토지에 대한 새로운 식견을 갖춘 모습으로 말이다."
 gaudi.22.f: "[ROOT.Var('gaudi_architect_var').GetCharacter.GetFullName](은)는 한때 마을 광장의 풍경 속 명암을 따라가며 스케치하는 것으로 만족했다. 이제 [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe]는 대지에 선을 긋는 사람이 되었다.\n\n유학길에 오른 [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe]는 내륙지의 도시들을 버렸다. 갈리시아의 미개척지에서, 포 삼각주의 습지에서, 미들랜즈를 가로지르는 철로를 따라서, 기술자와 농부, 현장 감독과 함께 발맞추어 걸었다. 누군가에겐 경전을 읽는 것처럼 토지를 읽는 방법을 배워나갔다. 물이 흐를 만한 지역, 토양이 움직일 법한 지역, 지금으로부터 다섯 번의 겨울을 거치면 금이 갈 수도 있을 부지를 알려줄 수 있는 사람이 된 것이다.\n\n이제 [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U]는 경사도와 측량기준점을 논한다. [ROOT.Var('gaudi_architect_var').GetCharacter.GetHerHis|U] 공책은 장식이 아닌 각도와 높이, 거리의 인치 단위로 가득하다. 누군가는 너무 깐깐하고 또 엄격한, 재미없는 사람이 되어버렸다고들 한다. 하지만 텅 빈 대지를 두루 바라보기만 해도, 대로를 어떻게 깔게 될 지를 진작에 간파하는 사람이 되었다."
 gaudi.22.g: "건물의 시공은 초석을 놓기 한참 전부터 시작되는 법."
 gaudi.23.t: "셈하는 건축가"
 gaudi.23.d: "2년 간의 유학 끝에 우리 건축가가 고국으로 돌아왔다. 더욱 예리한 생각에, 더욱 낮선 스케치를 그리는 사람으로 거듭난 것이다."
 gaudi.23.f: "[ROOT.Var('gaudi_architect_var').GetCharacter.GetFullName](은)는 한때 직감에 따라 스케치를 그리는 사람이었다. 이제는 논리에 따라 스케치를 그리는 사람이 되었다.\n\n[ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U]는 벽돌공이나 시공업자와 시간을 보내지 않고, 강의실에서 시간을 보냈다. 파리, 괴팅겐, 상트페테르부르크까지. [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U]는 수식으로 가득한 칠판 밑에 앉아, 제 손으로 직접 짓는 것이 아니라 생각으로 짓는 학자들 밑에서 공부하였다. 이제 [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U]는 우아한 공식으로 풀어낸 대칭과 계수, 하중곡선을 논하는 사람이 되었다.\n\n오로지 손으로만 그리던 장식 곡선은 이제 자취를 감췄다. 새롭게 선보인 설계도들은 꾸밈없고 낯설며, 정확도 면에서 이질적이기까지 한 모습이다. 누군가에게는 차갑고 비인간적인 설계도로 보인다. 그러나 그 순간 [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe]는 이렇게 설명한다. 돔의 아름다움은 장식에 있지 않고 완벽한 곡선에 있다고.\n\n정부 관계자들은 [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U]를 어떻게 대해야 할지 확신하지 못하고 있다. 동료들은 비현실적이라고 수근거린다. 그러나 특히 젊은 세대일 수록 [ROOT.Var('gaudi_architect_var').GetCharacter.GetHerHis|U] 말에 귀 기울이는 사람들도 있다."
 gaudi.23.g: "다른 이들은 상상만 하던 것을 지어 나가는 사람이 되었군."
 gaudi.24.t: "초석보단 서류부터"
 gaudi.24.d: "우리 건축가가 고국으로 돌아왔다. 그 손에 들린 것은 도구도 방정식도 아닌... 도장과 날인, 정부 관계자들의 연락망이었다."
 gaudi.24.f: "[ROOT.Var('gaudi_architect_var').GetCharacter.GetFullName](은)는 더 이상 제도판과 씨름하지 않았다. 이제는 여러 관공서를 서슴없이 드나드는 사람이 되었다.\n\n2년 동안 해외로 나가 있던 [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe]는 그저 건축 공부만 하지 않고 행정 업무도 배워나갔다. 그리고 사업이 진행되느냐 좌초되느냐의 여부는 설계도가 아니라 서류 승인에 달려 있단 것을 배웠다. 빈에서는 정부 부처의 업무 생활을 지켜보았다. 브뤼셀에서는 허가 담당 공무원을 따라다녔다. 마르세유에서는 도시 풍경을 결정지을 하수도 관련 시의회 회의에 참석하였다.\n\n이제 고국으로 돌아온 [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe]는 어떤 서류를 제때 제출해야 하는지, 어떤 규제법령을 인용해야 하는지, 몸 낮춰야 할 사람은 누구고 무시해도 될 사람은 누구인지를 알고 있다. 본인의 말로는 규정이란 벽체가 아닌 비계와 같아서, 옮길 수도 있고, 누그러뜨릴 수도 있고, 뒤바꿀 수도 있다. 그리고 어떻게든 허가를 빨리 받을 수도 있다고 말한다."
 gaudi.24.g: "장대한 건축물의 시작은 서류 허가로부터."
 gaudi.25.t: "드디어 기어나온 건축가"
 gaudi.25.d: "우리 건축가가 드디어 오랜 유학길에서 돌아왔다. 그런데 [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe]가 무엇을 챙겨왔는지는 불분명하다. 경험담을 제외한다면 말이다."
 gaudi.25.f: "[ROOT.Var('gaudi_architect_var').GetCharacter.GetFullName](은)는 스케치북을 챙겨 떠났다. 그리고는 담배와 경험담을 챙겨 고국으로 돌아왔다. [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U]에게는 들먹일 이름도 많고, 내놓을 의견도 많고, 기억 못하는 척하는 빚도 많다.\n\n[ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U]는 자신이 직접 측정해 본적도 없는 건축물에 수려하면서도 그럴듯하게 이야기한다. 설계도를 보여달라는 말에는 화제를 돌리고, 결과물을 재촉하면 미소지으며 탁월한 완성도는 결코 서두를 수 없는 법이라고 달랜다.\n\n누군가는 [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe]가 사기꾼이라 한다. 또 누군가는 오해를 받고 있을 뿐 분명 천재라고 평한다.  진실은? 트리에스테의 카페와 나폴리의 놓친 열차 사이 어딘가에 있지 않을까."
 gaudi.25.g: "그 시간 동안 대체 뭐하고 지냈단 말인가?!"
 gaudi.26.t: "거장의 그림자 속에서"
 gaudi.26.d: "우리 건축가가 위대한 스승의 흔적을 품고 더욱 원숙하고 침착한 모습으로 고국에 돌아왔다."
 gaudi.26.f: "다른 사람 같으면 유학길의 범위를 넓혔을 테지만 [ROOT.Var('gaudi_architect_var').GetCharacter.GetFullName](은)는 거리보다 깊이를 택했다. [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U]는 그 기간 동안 단 한 사람, 전설적인 명성을 지닌 노련한 건축가의 밑에서 가르침을 받으며 시간을 보냈다. 강의실 뿐만이 아니라 비계 위에서, 그리고 침묵 속에서, 장식 뒤에 숨겨진 구조와 외형 뒤에 숨은 의도를 보는 법을 배워나갔다. 그은 선은 점차 정확해졌고, 보는 시선은 점차 예리해졌다. 어떻게 짓는가보다도 왜 그렇게 짓는가의 가르침을 받았다. 스승을 받아들였다는 소문은 앞서 퍼져나갔다. 젊은 제자들은 벌써부터 [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U]를 찾아 나섰고, 시 공무원들은 뜻밖의 존경심으로 [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U]를 맞이하였다. [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U]는 그렇게 돌아왔다. 관례를 지닌 사람, 전통으로 나아갈 사람, 그리고 어쩌면 언젠가... 유산으로 남을 사람으로 말이다."
 gaudi.26.g: "타인의 지혜를 고스란히 짊어지게 되었군."
 je_gaudi_study_trip: "건축 유학"
 je_gaudi_study_trip_reason: "우리 건축가 [ROOT.Var('gaudi_architect_var').GetCharacter.GetFullName](은)는 현재 유학을 떠나 건축 명소와 학술원을 둘러보고, 다른 예술인과의 만남을 갖고 있다. 건축가와는 2년 동안 연락할 수 없게 된다."
