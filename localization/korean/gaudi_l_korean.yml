 gaudi_moistero_selloff_revenue_modifier: "제로니무스 수도원: 매각 수입"
 gaudi.73.t: "제로니무스의 과거와 미래"
 gaudi.73.d: "리스본의 제로니무스 수도원은 포르투갈 역사상 가장 영광스러운 시대를 연상케 하는 마누엘 양식 건축의 대표 사례로 꼽힌다. 그러나 근 수십 년간 방치된 탓에 현재는 심각하게 훼손된 상태로 남아 있다."
 gaudi.73.f: "리스본 벨렝의 제로니무스 수도원은 후기 고딕-마누엘 양식으로 된 건축 가운데 포르투갈을 대표할 만한 건물로 16세기에 지어졌다. 수백 년 동안 풍화 작용과 방치로 훼손되었던 제로니무스 수도원은 19세기 후반에 이르러 국가 문화유산에 대한 관심이 높아지면서 다시 주목받았다. 1860년대~1880년대에 걸쳐 낭만주의 시대의 역사학자와 건축가들은 포르투갈의 제정 시대 유산을 문화적 자긍심의 원천으로 삼고자 복원 시도를 주도하면서 본격적인 복원이 이루어지게 되었다."
 gaudi.73.g: "소소한 수리를 하는 것이 좋겠다."
 gaudi.73.h: "전면 복원으로 역사적인 장엄함을 되찾자!"
 gaudi.73.i: "가장 값비싼 유물들을 매각하여 국고를 채우자."
