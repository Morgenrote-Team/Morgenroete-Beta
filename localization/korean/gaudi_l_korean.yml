 gaudi.74.t: "석재의 새로운 시각"
 gaudi.74.d: "대담하고 새로운 건축가가 교회와 왕실 모두의 시선을 사로잡고 있다. 그 건축가의 이름은 알레산드로 안토넬리다."
 gaudi.74.f: "1798년 피에몬테주 게메에서 태어난 알레산드로 안토넬리는 이탈리아 건축계에서 오랫동안 유망하지만 아직 검증되지 않은 인물로 여겨졌다. 그러나 노바라 대성당 건설에 참여해 혁신을 일궈내면서 이러한 인식이 바뀌게 되었다. 신고전주의 제단의 신설을 맡게 된 안토넬리는 고전적인 기하학과 높이 솟은 수직성을 대담하게 조합하여 엇갈린 여론을 촉발하였지만 그 누구도 무관심하다고 볼 순 없었다. 일각에서는 안토넬리의 설계가 과하다고 비판하는 평가도 있었으나, 그에게서 이탈리아 르네상스에 걸맞은 정신을 보는 평가도 있었다.\n\n안토넬리의 명성이 높아지면서 향후 어떤 작품을 맡게 될 것인가와 더불어 이탈리아의 풍경을 재편할 인물이 될 것인지에 관한 궁금증이 제기되고 있다."
 gaudi.74.g: "안토넬리를 사르데냐의 새로운 수석 건축가로 임명한다."
 gaudi.74.h: "예술원에 자리를 하나 마련해 주도록."
