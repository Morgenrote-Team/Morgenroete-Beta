 gaudi.2101.t: "거대한 철골 건축물의 탄생"
 gaudi.2101.d: "대중의 뜨거운 관심 속에 기초 다지기를 위한 굴착과 함께 공사가 개시되었다. 이번 공사 하나로 총 30,973제곱미터 규모의 부지가 굴착될 전망이다. 에펠탑은 아직 철골 하나 설치하지 않고도 벌써부터 기록을 세우게 되었다."
 gaudi.2101.f: "\"이 타워는 단순히 현대 공학의 기술 뿐만 아니라 우리가 사는 산업과 과학의 세기를 상징하는 것이요, 그 시대는 18세기의 위대한 과학 운동과 1789년 대혁명으로 마련된 진로이기에, 프랑스에 고마움을 표하는 차원에서 기념비를 세우는 것이다.\" - 귀스타브 에펠"
 gaudi.2101.g: "하늘을 향해, 별들을 향해!"
 gaudi.2102.t: "에펠탑 준공식"
 gaudi.2102.d: "두려움과 염원이 공존하는 가운데 완공된 거대한 철골 구조물이 마침내 프랑스 수도의 상공에 우뚝 솟았다. 파리 전역이 이 타워의 그림자 아래에 놓였으며 - 도시의 새로운 랜드마크로 거듭나게 되었다. 비판 여론은 준공식을 축하하는 열광적인 반응 속에 굳게 닫혔다."
 gaudi.2102.f: "\"우리는 기정 사실 - 그야말로 사실 그 자체! - 앞에 고개를 숙여야 한다. 나를 비롯한 많은 사람들이 에펠탑을 광기라 칭하고 믿어왔지만, 그것은 웅장하고도 자랑스러운 광기였던 것이다. 이 거대한 구조물은 확실히 박람회장의 나머지 구역을 압도하며, 샹 드 마르스 광장으로 다시 발을 내딛는 순간 거대한 돔과 회랑도 조그마해 보이지 않을 수 없다. 허나 우리는 무엇을 바라겠는가? 에펠탑은 상상력을 자극하는, 예상치 못한 무언가, 우리의 왜소함을 부각시키는 환상적인 무언가이다. 건설이 막 시작되었을 때에는 메이소니에르부터 졸라에 이르기까지 유수의 예술가와 작가들이, 에펠탑은 예술에 대한 끔찍한 범죄 행위라며 격렬하게 반대하는 서명 운동에 나섰다. 그대는 지금도 여전히 그들의 서명 운동에 참여하겠는가? 아니다, 당연히 아닐 것이다. 그들 역시 그런 분노의 서명 목록이 차라리 없었으면 하고 바랄 것이다.\""
 gaudi.2102.g: "프랑스 만세!"
 gaudi.2109.t: "파리 상실!"
 gaudi.2109.d: "파리 지역을 상실하면서 에펠탑의 건설을 지속할 기회도 영영 사라지게 되었다."
 gaudi.2109.f: "어떤 이유에서건 파리를 상실하게 되면, 건설 진행도도 #R 통째로 상실#!하게 됩니다. 에펠탑 건설을 계속할 수 있는 국가는 프랑스 뿐입니다. 우리를 침략한 외국 세력은 궁궐 건설에 전혀 관심을 보이지 않을 것입니다."
 gaudi.2109.g: "파리를 언제까지고 넘겨줄 순 없다!"
 gaudi.2111.t: "엘리베이터"
 gaudi.2111.d: "엘리베이터 개발 분야의 새로운 기술 발전으로 에펠탑 공사 작업이 예상보다 훨씬 빠르게 진척되고 있다."
 gaudi.2111.f: "에펠탑 내부에서는 총 아홉 대의 엘리베이터를 통해 정상에 오를 수 있다. 그 가운데 다섯 대는 에펠탑 기둥 내에 설치되어 입구와 2층부를 연결하며, 나머지 두 쌍의 엘리베이터는 양측 탑승실을 두고 있어 2층부와 3층부 사이를 잇는다. 에펠탑 건설 당시 에펠은 어떠한 착오도 벌어지지 않도록 여러 기술과 제조사를 신중히 활용하였다. 북측과 남측 기둥부에는 오티스 엘리베이터가 설치되어 1910년까지 운영되었다. 동측과 서측 기둥부에는 1897년까지 루(Roux),  콩발뤼지, 르파프 사의 엘리베이터가 설치되었다. 당시에는 이중 무한 사슬로 구동되었으며 최대 탑승 인원은 200명 규모였다. 양쪽 엘리베이터 모두 유압식 컨베이어 체계를 통해 제어되었다. 1900년 세계박람회 당시 에펠은 엘리베이터와 유압 기관에 동력을 넣는 증기 기관을 전기모터식으로 교체하였다."
 gaudi.2111.g: "정말 훌륭하군!"
 gaudi.2112.t: "Outcry of the Intellectuals"
 gaudi.2112.d: "In a renowned daily newspaper, several figureheads of intellectual, academic and artistic life have protested against the construction of the Eiffel Tower, which they castigate as an ugly eyesore."
 gaudi.2112.f: "'We, writers, painters, sculptors, architects and passionate devotees of the hitherto untouched beauty of Paris, protest with all our strength, with all our indignation in the name of slighted French taste, against the erection ... of this useless and monstrous Eiffel Tower ... To bring our arguments home, imagine for a moment a giddy, ridiculous tower dominating Paris like a gigantic black smokestack, crushing under its barbaric bulk Notre Dame, the Tour Saint-Jacques, the Louvre, the Dome of les Invalides, the Arc de Triomphe, all of our humiliated monuments will disappear in this ghastly dream. And for twenty years ... we shall see stretching like a blot of ink the hateful shadow of the hateful column of bolted sheet metal.'"
 gaudi.2112.g: "Postpone the construction."
 gaudi.2112.h: "This protest encourages us to build the tower even faster!"
 gaudi.2113.t: "Industrialists applaud the Titan of Steel"
 gaudi.2113.d: "The ever-growing Eiffel Tower is seen by the country's industrialists as a symbol of France's economic and technical progress. They look forward to the opening with enthusiasm."
 gaudi.2113.f: "The entrepreneur and archaeologist Heinrich Schliemann, who had already been able to climb the Eiffel Tower before the official opening, praised the building in a letter to Rudolf Virchow on May 24, 1889 as a miracle of engineering skills, without which the world exhibition in Paris had no appeal. Despite the euphoria that praised it as a successful national self-portrayal and demonstration of technical progress, there was also unforgiving criticism."
 gaudi.2113.g: "Maybe you can help a bit?"
 gaudi.2113.h: "Thanks to you!"
 gaudi.2114.t: "Inferrior Steel"
 gaudi.2114.d: "The chief architect heavily criticized the quality of the last steel delivery and had it returned. The schedule for the construction of the Eiffel Tower is shifting noticeably."
 gaudi.2114.f: "Up to 250 people were involved in the construction work, around 150 of whom were used to rivet the components on site. In addition to carpenters, the construction workers also included chimney sweeps, as they were used to working at great heights. The work shifts lasted nine hours in the winter months and twelve hours in the summer months. In September 1888 there was a workers' strike; three months later they stopped work again and demanded more wages. Gustave Eiffel negotiated with them and set up a canteen for them in the first platform that had already been completed. There was only one fatal accident during the entire work. An Italian worker had an accident while installing the elevators after the official opening."
 gaudi.2114.g: "Buy a new load of steel."
 gaudi.2115.t: "양질의 강철"
 gaudi.2115.d: "파리 근교의 제철소에서 생산된 강철이 에펠탑 건설 현장에서 뛰어난 품질을 입증하고 있다. 이는 공사 효율성을 높였을 뿐만 아니라 다른 고객들의 해당 제철소에 대한 강철 수요 증가로도 이어지고 있다."
 gaudi.2115.f: "1888년 8월 14일 에펠탑의 2층부가 완공되고 최상층부는 캔틸레버 구조로 세워지기 시작했다. 그와 동시에 전망대도 설치되었다. 공장에서 미리 조립된 개별 부품들은  현장에서 원뿔형 맨드릴을 써서 충격을 주어 제 위치로 배치시켰다. 에펠탑의 각 부품을 고정하는 데에는 총 250만 개의 리벳이 사용되었다. 리벳 고정 작업에는 4인조가 투입되었다. 첫번째 인부는 작은 화로를 이용해 리벳을 핫스탬핑시켜 달아오르게 만든다. 두번째 인부는 리벳을 드릴 구멍에 끼워 둔다. 세번째 인부는 리벳의 잠금 헤드를 두드려 형태를 만든다. 마지막으로 볼트를 압축한다."
 gaudi.2115.g: "프랑스산 강철이 최고야."
 gaudi.2116.t: "수학자의 붕괴 예견"
 gaudi.2116.d: "프랑스에서 가장 존경받는 수학자가 에펠탑이 높이 230m에 도달하면 붕괴할 것이라 예측하면서 일부 집주인들 사이에서 공포가 확산되고 있다."
 gaudi.2116.f: "샹 드 마르스에 거주하는 한 주민은 에펠탑 붕괴로 본인의 집이 파괴될 것을 우려하여 프랑스 정부와 파리 시를 상대로 소송에 들어갔다. 법원은 귀스타브 에펠이 모든 손해 배상에 나선다는 조건 하에 건설 재개를 허가하였다. 이 사건은 프랑스 사회에 근본적인 논쟁을 불러일으켰으며, 에펠의 설계와 계산이 믿을 만한지에 관하여 의문이 제기되었다. 그러나 산업 관계자들은 이러한 비판이 기술 발전이라는 개념을 모욕하는 것이라 보고 있다. "
 gaudi.2116.g: "말도 안 되는 소리야."
 gaudi.2116.h: "타워가 무너지면 에펠 씨가 보상해야 한다."
 gaudi_admires_liberty_statue_modifier: "자유의 여신상: 존경받는 미국의 이상"
 gaudi_liberty_impressed_modifier: "자유의 여신상: 여신에게 감명받다"
 gaudi_america_first_modifier: "자유의 여신상: 미국의 사업"
 gaudi.2201.t: "미국 대표 항구의 프랑스 여인"
 gaudi.2201.d: "프랑스의 주도로 거대한 조형물이 제작 중에 있으며, 머지않아 신대륙에 도착하는 모든 사람들을 자유의 상징으로서 맞이하게 될 전망이다."
 gaudi.2201.f: "베들로 섬은 1796년 뉴욕주에 할양되었으나 1800년 미국 연방정부가 최종적으로 소유하는 것으로 넘어갔다. 연방정부 측은 유사시 뉴욕 항을 지키기 위하여 베들로 섬에 방어 시설을 구축하기로 결정하였다. 이는 인근의 가버너 섬과 엘리스 섬도 마찬가지였다. 1871년 6월 뉴욕을 방문하던 조각가 바르톨디는 뉴욕만 상부의 베들로 섬을 보고, 매일마다 이곳에 도착하는 선박이 저 섬을 지나치는 만큼 동상을 하나 세우기에 알맞는 장소일 것이라 보았다."
 gaudi.2201.g: "좋은 부지라면 이미 알아봐 두었지."
 gaudi.2202.t: "세상을 일꺠우는 자유"
 gaudi.2202.d: "수십만 명의 사람들이 오늘 자유의 여신상 준공을 축하하는 퍼레이드에 합류하였다. 이번 행사는 [SCOPE.sCharacter('gaudi_ruler_scope').GetLastName] [SCOPE.sCharacter('gaudi_ruler_scope').GetPrimaryRoleTitle]이 직접 주관하였다. 프랑스 위원회 측도 베들로 섬으로 향하는 선박 퍼레이드를 주관하고 나섰다."
 gaudi.2202.f: "땅에서 땅으로 정복의 두 다리 뻗는\n그리스 신화의 청동 거인과는 달리\n바닷물에 씻긴 석양빛의 문 앞에\n횃불 든 위엄 찬 여인이 서 있으리\n그 불꽃은 갇힌 번개와 같고 그 이름은 망명자들의 어머니로세.\n그이의 횃불 든 손에서 온 세상에 어서 오라는 빛을 발하고\n온화한 눈빛은 두 도시를 잇는 공중 다리 놓인 항구를 내려다보네.\n\"오랜 땅이여, 영광을 간직하라!\n조용한 목소리로 그 여인은 외친다.\n\"지치고 가난한 자여,\n억압 속에 자유롭게 숨쉬고픈 자들이여,\n북적이는 해안의 불우한 쓰레기들을\n나에게로 보내라, 집 없고 폭풍에 시달리는 이들을 보내라.\n나는 황금빛 문 옆에서 횃불을 들어 올리라.\""
 gaudi.2202.g: "새로운 거신상일세."
 gaudi.2209.t: "뉴욕 상실!"
 gaudi.2209.d: "뉴욕 지역을 상실하면서 자유의 여신상의 건설을 지속할 기회도 영영 사라지게 되었다."
 gaudi.2209.f: "어떤 이유에서건 뉴욕을 상실하게 되면, 건설 진행도도 #R 통째로 상실#!하게 됩니다. 자유의 여신상 건설을 계속할 수 있는 국가는 미국 뿐입니다. 우리를 침략한 외국 세력은 궁궐 건설에 전혀 관심을 보이지 않을 것입니다."
 gaudi.2209.g: "뉴욕을 언제까지고 넘겨줄 순 없다!"
 gaudi.2211.t: "엘리베이터"
 gaudi.2211.d: "엘리베이터 개발 분야의 새로운 기술 발전으로 자유의 여신상 공사 작업이 예상보다 훨씬 빠르게 진척되고 있다."
 gaudi.2211.f: "\"여신상은 중요한 위치에서 강조되는 만큼, 선명하고 분명한 설계에 따라 깔끔하고 단순한 외형을 지녀야 한다. 세부묘사를 확대하거나 중복하는 것은 지양하여야 한다. 형태를 과장하여 보다 뚜렷이 보이게 한다거나 세부묘사를 더하게 된다면 작품의 균형을 망가뜨리게 될 것이다. 마지막으로 모형은 설계도와 마찬가지로 빠른 초안처럼 특징을 함축하고 있어야 한다. 그 특징은 의지와 관찰의 산물이어야 하며, 작가는 자신의 지식을 집중하여 최대한 단순한 모습의 형태와 선을 찾아내야 한다.\" - 프레데리크 오귀스트 바르톨디"
 gaudi.2211.g: "아주 훌륭해!"
 gaudi.2213.t: "감명 받은 지식인들"
 gaudi.2213.d: "대표 지식인들은 현재 뉴욕에서 진행 중인 건설 사업에 환영을 표했다. 미국의 민주적이고 자유주의적인 정신을 오롯이 실현한다는 기대에서였다. 예술가들은 이번 사업에서 영감을 얻어 시와 작품을 창작하고 있다."
 gaudi.2213.f: "\"맨해튼만 위 서쪽 문을 지키는 파수꾼이여\n그대 얼굴 가리던 의심의 안개 걷히네\n그대 눈은 멀리 맑게 바라보며, 손 높이 들어\n세계의 만방에 자유의 빛을 퍼뜨리네\" - 헨리 반 다이크"
 gaudi.2213.g: "저들의 창작이 홍보 역할을 하지 않겠는가."
 gaudi.2214.t: "미국의 사업인가, 프랑스의 사업인가?"
 gaudi.2214.d: "자유의 여신상 제작이 진척을 이루고, 맨해튼 앞바다 섬의 기단이 한층 더 높아지면서 일부 정치인들은 이번 사업의 실질적인 기원지가 어디인가에 대해 의문을 제기하고 있다."
 gaudi.2214.f: "\"오늘 우리는 분노와 복수로 가득 찬, 사나운 전쟁 신의 형상 앞에 고개 숙이기 위해 이 자리에 모인 것이 아니오. 오히려 우리는 옛 노래에서 찬미하는 모든 것보다 위대하고, 미국의 열린 문을 지키고 수호하는 우리 스스로의 신을 기쁜 마음으로 묵상하기 위해 모인 것이오. 공포와 죽음의 번개를 손에 쥐는 대신, 인간의 참정권으로 가는 길을 밝히는 빛을 높이 들고 있소. 우리는 자유가 이 땅에 자리잡았음을 잊지 않을 것이며, 여신이 택한 제단을 소홀히 하지 않을 것이외다. 기꺼이 헌신하는 자들은 계속해서 그 불꽃을 꺼뜨리지 않을 것이요, 그 불꽃은 거기서부터 우리의 자매 공화국의 연안까지 비춰질 것이다. 또 그 빛줄기와 합쳐 무지와 인류를 억압하는 어둠을 뚫고 자유가 세상을 밝힐 때까지, 한 줄기 빛이 이어질 것이오.\" - 그루버 클리블랜드"
 gaudi.2214.g: "미국의 사업이다."
 gaudi.2214.h: "프랑스와 미국의 공동 사업이다."
 gaudi.2214.i: "프랑스의 사업이다."
 gaudi.2215.t: "양질의 강철"
 gaudi.2215.d: "뉴욕 근교의 제철소에서 생산된 강철이 자유의 여신상 건설 현장에서 뛰어난 품질을 입증하고 있다. 이는 공사 효율성을 높였을 뿐만 아니라 다른 고객들의 해당 제철소에 대한 강철 수요 증가로도 이어지고 있다."
 gaudi.2215.f: "\"나는 자유의 여신상을 보고 속으로 말했다. 아가씨, 참 예쁘시군요! 두 팔을 벌리시며 이곳의 모든 외국인들을 맞이하고 계시는군요. 미국에서 제가 가치있는 존재고, 해낼 수 있고, 거듭날 수 있다는 것을 입증할 기회를 주세요... 라고. 그리고 그 여신상은 항상 내 마음 속에 있었다.\""
 gaudi.2215.g: "미국산 강철이 최고야."
 gaudi.2216.t: "정부 여당의 자유의 여신상 건설 지지"
 gaudi.2216.d: "[SCOPE.sCharacter('gaudi_liberty_leader').GetFullName] 씨는 자유의 여신상을 세울 것을 열렬히 지지하는 것으로 널리 알려져 있다. 이미 주변의 여러 주요 인사들을 설득하여 이번 사업을 지원토록 하였으며, 추가 기부금도 모아 전달하였다."
 gaudi.2216.f: "바르톨디는 금박으로 덮인 횃불의 발코니에 집중 조명을 설치하여 횃불을 밝힐 계획이었다. 그러나 준공식 일주일 전, 미 육군 공병대 측에서 지나가는 선박들의 시야를 가릴 수 있다고 우려하며 해당 방안을 기각하였다. 대신 바르톨디는 횃불에 작은 창문을 뚫고 그 안에 헤드라이트를 설치하였다."
 gaudi.2216.g: "추가로 기부해 달라고 요청해 보자."
 gaudi.2216.h: "공개적으로 찬사를 보내자!"
 gaudi.2217.t: "건설 현장 사고"
 gaudi.2217.d: "자유의 여신상 건설 현장에서 사고가 벌어져, 여러 명이 다치고 일부분이 파손되는 피해를 입었다."
 gaudi.2217.f: "\"당신들은 뉴욕항에 자유라는 괴물 같은 우상을 세웠소. 그 기념상을 완성하기까지 유일하게 남은 것은 단테가 지옥문에 새긴 글귀, '이곳에 들어오는 자 온 희망을 버려라'를 받침대에 새기는 것 뿐이오.\" - 조지 버나드 쇼"
 gaudi.2217.g: "미국산 강철이 최고야, 라고 생각했건만..."
 gaudi.2218.t: "자유의 여신상에 들어가는 비용은?"
 gaudi.2218.d: "[SCOPE.sCharacter('gaudi_opposition_leader').GetFullName] 대표는 자유의 여신상 건설을 단호히 비판하고 있다. 확보한 예산을 훨씬 더 좋은 사업에 투자하면 얼마나 좋겠느냐는 논지에서다."
 gaudi.2218.f: "미국 건설위원회는 기부금 모금에 큰 어려움을 겪었다. 이렇듯 예산 부족에 시달린 사업은 자유의 여신상 뿐만이 아니었다. 이를테면 워싱턴 기념탑 건설은 수 차례의 중단을 거쳐 35년이라는 긴 시간이 소요되었다. 바르톨디의 조각상 자체에 대한 비판과 더불어 미국 국민들이 기증품을 세울 받침대를 부담해야 한다는 점도 비판 대상에 올랐다. 또 공공 예술 작품은 미국인이 설계하여야 한다는 여론이 지배적이었다. 하퍼스 위클리지는 바르톨리가 조각상을 기증했다면 받침대도 기증하는 것이 도리 아니냐고 주장하였고, 뉴욕 타임스도 \"진정한 애국자라면 지금 우리의 재정 상태에서 청동 여자 조각상에 그 정도의 예산을 지출하는 것은 용납할 수 없을 것이다\"라고 지적하였다."
 gaudi.2218.g: "그렇지만 이번 사업은 대단히 중요하단 말이오!"
 gaudi.2218.h: "이보다 더 중요한 사업이 있지 않겠나..."
 gaudi.2301.t: "아물어가는 런던의 상처"
 gaudi.2301.d: "런던 시민들은 옛 웨스트민스터 궁전이 화재로 전소된 충격에서 아직 벗어나지 못하고 있다. 이번 화재로 영국 정계의 심장이 박동하던 템스 강변에 깊은 상처를 남겼다. 마침내 그 상처를 치료하기 위한 복구 공사가 엄숙한 착공식과 함께 시작되었다."
 gaudi.2301.f: "화재 직후 윌리엄 4세 영국 국왕은 거의 완공된 상태였으나 본인이 맘에 들어하지 않았던 버킹엄 궁전을 의회에 넘기려 하였다. 그러나 해당 건물을 의사당으로 쓰기에는 적절치 않은 것으로 여겨져 거절되었다. 신고전주의 양식을 옹호하는 목소리가 확산됨에 따라 데시머스 버튼은 신고전주의 양식으로 된 새로운 국회의사당 설계안을 내놓았다. 신고딕 양식과는 상반되게 신고전주의 양식은 고대 로마 건축의 가장 아름답고 보편적인 양식으로 성 바오로 대성전을 지은 건축가들을 찬미하고 있었다. 고딕 양식의 최고 권위자였던 오거스터스 W. N. 퓨긴은 최근 가톨릭교로 개종할 뜻을 공개적으로 밝혔기 때문에, 제임스 길레스피 그레이엄과 찰스 배리라는 다른 건축가의 이름으로 설계안을 제출해야 했다. 퓨긴이 배리의 이름으로 제출한 국회의사당 설계안은 공모전에서 최종 선정되었다."
 gaudi.2301.g: "그렇게 정치인들이 길거리에 영영 나앉았으면 좋겠군."
 gaudi.2302.t: "국회 회의장 완공"
 gaudi.2302.d: "상하원 회의장이 완공됨에 따라 영국 의회는 신 웨스트민스터 궁전에서 평소 의사 일정을 소화할 수 있게 되었다. 허나 전체 의사당이 완공되려면 앞으로 수 년의 시간이 더 필요할 전망이다."
 gaudi.2302.f: "상원 회의장은 1847년에, 하원 회의장은 1852년에 완공되었다. 마침 그 해는 배리가 기사작위를 수여받기도 했다. 찰스 배리가 사망한 1860년 당시에는 공사 대부분이 마무리되었으나 완공에 이르기까지는 그 후로 수십 년이 더 소요되었으며, 아들 에드워드 미들턴 배리가 공사 감독을 대신 맡게 되었다."
 gaudi.2302.g: "제법 진전이 있는 모양이오, 그렇지 않은가?"
 gaudi.2303.t: "빅 벤"
 gaudi.2303.d: "2차 공사 단계에서는 국회의사당 내부 장식과 시계탑에 대형 종을 설치하는 작업에 나서게 되었다."
 gaudi.2303.f: "앨버트 왕자가 위원장을 맡은 왕립 미술 위원회의 감독 하에, 로버트 필 경을 비롯한 특별위원회가 1841년부터 전문가들의 증언을 취하기 시작하였다. 당시 전문가로는 마틴 아처 시 경과 화가이자 미술사 분야 권위자였던 찰스 록 이스트레이크가 있었으며, 이스트레이크는 훗날 영국 내셔널 갤러리의 초대 관장이자 웨스트민스터 궁전의 장식 설치 공사 전반을 실질적으로 감독하게 된다. 이 기회를 통해 영국 고유의 역사화파를 육성하고, 그림은 프레스코화로 그려야 한다는 결정이 내려졌다."
 gaudi.2303.g: "그깟 시계탑 하나로 왜들 이리 소란이오?"
 gaudi.2304.t: "웨스트민스터 궁전 복원 완료"
 gaudi.2304.d: "영국의 새로운 국회의사당이 템스 강변에 위풍당당하게 솟아 도시의 풍경을 아름답게 장식하게 되었다. 시계탑의 종소리는 런던의 일상을 아우르는 특색이 되어 시민들 곁에 매 순간 함께하는 동시에, 벌써부터 온 나라를 대표하는 상징물로 거듭나고 있다."
 gaudi.2304.f: "\"그러니까 다음 총리 질의응답 시간에는 공무조직의 비대화가 의원들 탓이라고 의회 측에 전하라 이 말인가?\"\n\"그게 사실이지 않습니까, 장관님.\"\n\"난 진실을 바라는 게 아니야! 의회에 전할 말을 바라는 거라고! 험프리, 그대는 내 상임비서관이고 우리 정책을 이행할 책임이 있지 않은가. 그런데도 왜 그렇게 완강히 반대하는지 아직도 이해가 안 돼. 그대가 이 문제에 관해서 어느 편인지 내 꼭 알아야겠어.\"\n\"장관님, 입장이란 건 어떤 직위에 앉아 있느냐에 달려 있는 겁니다.\""
 gaudi.2304.g: "딩-동 댕-동, 딩-동-댕-동."
 gaudi.2309.t: "런던 상실!"
 gaudi.2309.d: "런던 지역을 상실하면서 웨스트민스터 궁전의 건설을 지속할 기회도 영영 사라지게 되었다."
 gaudi.2309.f: "어떤 이유에서건 런던을 상실하게 되면, 건설 진행도도 #R 통째로 상실#!하게 됩니다. 웨스트민스터 궁전 건설을 계속할 수 있는 국가는 영국 뿐입니다. 우리를 침략한 외국 세력은 궁궐 건설에 전혀 관심을 보이지 않을 것입니다."
 gaudi.2309.g: "런던을 언제까지고 넘겨줄 순 없다!"
 gaudi_ben_decoration_modifier: "웨스트민스터 궁전 장식 설치"
 gaudi_praised_by_parliament_modifier: "의회의 찬사"
 gaudi_ben_decoration_tt: "웨스트민스터 궁전이 완공되면 더욱 위엄 있는 모습을 갖추게 될 것입니다."
 gaudi.2311.t: "저질 석회석"
 gaudi.2311.d: "최근에 납품된 웨스트민스터 궁전 건설 자재의 품질이 떨어지는 것으로 드러났다."
 gaudi.2311.f: "국회의사당 건물이 매일같이 높이 올라가던 건설 현장에 평소대로의 활기가 사라졌다. 건축가가 잠시 점검에 나서보니 석회암의 품질이 평소와는 다르다는 것을 알게 되었고, 건설 사업에 차질이 생기기 전에 좀 더 기다려보자고 밝혔다. 하지만 건설 관리를 맡은 책임자들은 석회암을 계속 사용해야 한다는 목소리가 나오고 있다."
 gaudi.2311.g: "우수한 품질의 영국산 석재를 소중히 여길 줄 알아야 한다."
 gaudi.2311.h: "마감 일정을 지켜야 한다!"
 gaudi.2312.t: "참사 발생!"
 gaudi.2312.f: "어쩌면 건축가의 의견에 귀기울여야 했을지도 모른다. 웨스트민스터 궁전처럼 중요한 건물에 부서지기 쉬운 석회암을 사용한 것이 정말 좋지 않은 생각이었을지도 모른다. 그렇기에 결단을 내리기 전에 두 번 다시 생각해야 했을지도 모른다. 허나 떄는 이미 늦었다. 저품질 자재로 인해 오늘 결국 외벽이 무너져 내렸고, 지난 몇 주, 몇 달 간 이어왔던 공사가 건물 정면 붕괴로 인해 물거품이 되고 만 것이다."
 gaudi.2313.t: "최신 공사 기계"
 gaudi.2313.d: "우리나라 전동차 업계에서 최근 웨스트민스터 궁전 건설 현장에 보급한 최첨단 장비로 공사 진척도가 향상되고 있다."
 gaudi.2313.f: "\"기관차가 있어 정말 좋구만!\""
 gaudi.2313.g: "이것이 진보다!"
 gaudi.2314.t: "웨스트민스터 궁전: 순조로운 진척"
 gaudi.2314.d: "웨스트민스터 궁전 공사의 진척 속도가 놀랍다. 지금 상태라면 궁전이 예정보다 빨리 완공될 수도 있다고 한다."
 gaudi.2314.f: "알 수 없는 이유로 웨스트민스터 궁전 공사가 순조롭게 진행되고 있다. 그것이 애국충정 때문이든, 임금이 높기 때문이든, 지역 유지들이 지원에 거리낌 없기 때문이든, 아니면 그저 날씨가 더 좋기 때문이든 간에 말이다."
 gaudi.2314.g: "아주 좋아."
 gaudi.2315.t: "웨스트민스터 궁전: 느린 진척"
 gaudi.2315.d: "오늘 런던 건설 총책임자가 안타깝게도 국회의사당 건설이 예정보다 늦어지고 있으며 시간이 더 오래 걸리고 있음을 인정하였다."
 gaudi.2315.f: "알 수 없는 이유로 웨스트민스터 궁전 공사가 더디게 진행되고 있다. 그것이 정치적 반대 세력의 교란이든, 노조가 공사에 소홀한 것이든, 비밀 결사의 음모이든, 아니면 그저 악천후가 내려서든 간에 말이다."
 gaudi.2315.g: "안타깝다."
 gaudi.2316.t: "[SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle]의 방문"
 gaudi.2316.d: "[SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('gaudi_ruler').GetFullName] 폐하께서 웨스트민스터 궁전 공사 현장을 친히 방문키로 하였다."
 gaudi.2316.f: "우리 [SCOPE.sCharacter('gaudi_ruler').GetFullName] 국왕께서는 과거에도 런던 건설 현장의 현황에 큰 관심을 보였으며 이제는 현장을 방문할 의향을 내비쳤다. 국왕을 맞이할 준비도 한창 진행 중에 있다. 당연하겠지만 폐하께 무언가 제대로 선보이고픈 마음 때문이기도 하다! 이에 따라 일반 건설 노동자와 건설 관리 책임자, 수석 건축가는 방문 계획 발표 이후 전례 없는 속도로 공사를 진행하고 있다."
 gaudi.2316.g: "폐하께서 독려하는 법을 확실히 알고 계시는군."
 gaudi.2317.t: "폭풍우 치는 날씨"
 gaudi.2317.d: "런던에 폭풍우가 몰아쳐 건설 공사가 몇 주 동안 지연되고 있다."
 gaudi.2317.f: "어젯밤 폭풍우가 런던을 강타했다. 강풍으로 방수포가 날아가고 비계를 넘어뜨려 창문과 조각상, 지붕을 파손시키고 말았다."
 gaudi.2317.g: "혜성이라도 나타난 거라면 더 좋았을 것을."
 gaudi.2318.t: "웨스트민스터 궁전의 장식"
 gaudi.2318.d: "현재 정치권과 건설 현장 관리직 사이에서 국회의사당 건물의 내부 설비 규모를 둘러싼 논란이 끊이지 않고 있다. 어느 내부 장식 설계자는 웨스트민스터 궁전을 화려하게 장식할 것을 제안했지만, 그렇게 된다면 건물 완공에 상당한 차질이 있을 수 있다는 우려가 제기되고 있다."
 gaudi.2318.f: "1834년 웨스트민스터 궁전이 화재로 소실되자 오거스터스 푸긴은 찰스 배리 경의 의뢰에 따라 신 웨스트민스터 궁전 건축 설계 공모전에 출품할 설계안의 내부 장식 설계를 맡게 되었다. 이후 선정위원회 측은 푸긴을 신 궁전 내부 공사에 참여시켰고, 푸긴은 내부 설계의 핵심적인 역할을 맡게 되었다. 푸긴이 생을 마감하기 직전이던 1852년 2월, 배리 경이 렘즈게이트에 머물던 푸긴을 만나, 웨스트민스터 궁전을 상징하는 시계탑의 세부 설계안을 전달받았다. 이 설계안은 푸긴의 초창기 작품들, 특히 잉글랜드 랭커셔의 스카리스브릭 홀의 설계도에 들어갔으나 실현되지 못한 것과 매우 유사한 모습을 띄고 있다. 또 푸긴이 정신 질환에 걸리기 전 마지막으로 설계한 작품이기도 하다."
 gaudi.2318.g: "시간이 걸리더라도 영국 의회에 걸맞게 최대한 화려함을 보이는 수밖에 없다."
 gaudi.2318.h: "그래서 또 뭘 달겠단 거지? 황금잎 의자 덮개라도 만드나?"
 gaudi.2319.t: "새 국회의사당을 위한 지원금"
 gaudi.2319.d: "[SCOPE.sCharacter('gaudi_ben_leader').GetFullName] 씨는 새로운 국회의사당을 호화롭게 건설할 것을 열렬히 지지하는 것으로 널리 알려져 있다. 이미 주변의 여러 주요 인사들을 설득하여 이번 사업을 지원토록 하였으며, 추가 기부금도 모아 전달하였다."
 gaudi.2319.f: "새 웨스트민스터 궁전의 건설 공사는 1840년에 시작되었다. 배리는 건설 기간을 6년으로 예상하였고 공사비는 총 @money! 724,986파운드로 추산하였다. 실제 공사 기간은 30년이 넘게 걸렸으며, 공사비는 @money! 200만 파운드가 넘었다."
 gaudi.2319.g: "추가로 기부해 달라고 요청해 보자."
 gaudi.2319.h: "공개적으로 찬사를 보내자!"
