 je_gaudi_capital_expansion_project: "수도 확장"
 je_gaudi_capital_expansion_project_reason: "1836년부터 1936년 사이 빅토리아 시대의 각 수도는 엄청난 도시 격변을 거치게 되었습니다. 파리는 조르주외젠 오스만이 설계한 넓은 대로와 중심축의 경관으로 새롭게 탈바꿈했습니다. 빈에서는 1857년 도시 성벽을 허물고 거대한 순환도로로 대체하였습니다. 베를린에서는 연립주택, 산업지구, 나중에는 모더니즘 양식의 주택 단지가 들어서면서 급속도로 확장되었습니다. 런던에서는 철도로 이어진 교외, 기반시설 확충 사업, 그리고 세계 최초의 지하철을 통해 시역 주변으로 뻗어나갔습니다. 유럽 대륙을 통틀어 왕립 도시들은 권력과 야망, 고조되는 사회적 긴장을 담아낸 근대적 대도시로서 진화해 나가게 되었습니다."
 gaudi.41.t: "속박 풀린 도시"
 gaudi.41.d: "옛 성벽이 철거되고 그 자리에 공기와 빛과 성장의 가능성이 깃들었다."
 gaudi.41.f: "수백 년 동안 [ROOT.GetCountry.GetCapital.GetCityHubName]시는 성벽으로 둘러쌓인 도시였다. 굳세면서도 오밀조밀하며 폐쇄적인 모습을 자처했던 것이다. 그러나 이제 그 돌덩이들은 곡괭이와 화약의 몫이 되었다.\n\n중세 시대에 지어진 성벽이 철거되었다. 그 자리에는 나무와 웅장한 건물들이 늘어선 널찍한 대로가 들어선다. 한때 경비대가 진주하던 곳에 이제는 시장 가판대와 산책하는 연인들이 거닌다. 대로란 것은 한낱 도로 그 이상의 존재다. 그것은 선언이다. 자신감의 선언이요, 확장의 선언이요, 담아낼 수 없을 만큼 크나큰 미래에 대한 선언이다.\n\n누군가는 옛 성문이 사라진 것을 아쉬워한다. 허나 [ROOT.GetCountry.GetCapital.GetCityHubName]시는 마침내 깊은 숨을 처음으로 들이쉬게 되었다."
 gaudi.41.g: "통찰력과 활력을 갖추고 벽 밖으로 나아가세."
 gaudi.42.t: "발전의 고리"
 gaudi.42.d: "순환 도로가 새로 건설되어 도시와 주를 하나로 묶게 되었다."
 gaudi.42.f: "한때 진흙으로 가득한 둑이 있던 자리에 이제는 석재와 강철이 놓였다. 거대한 대로가 [ROOT.GetCountry.GetCapital.GetCityHubName]의 심장부를 목걸이처럼 감싸며, 빛과 움직임으로 도시 곳곳을 하나로 묶는다.\n\n단순한 도로 공사는 아니었다. 구역 전체가 재정비되고, 공원을 조성하고, 완벽한 원근법에 맞춰 기념비를 세웠다. 해질녘에는 가스등이 질서정연한 별처럼 빛난다. 포장길 수 미터마다 [ROOT.GetCountry.GetCapital.GetCityHubName]의 풍경은 한층 또렷해지고 더욱 위엄을 갖춘다.\n\n시 관계자들은 '도시의 조화'라 칭한다. 그렇다면 시민들은 어떠한가? 시민들은 지금껏 본 적 없는 조각상들을 바라보며 한때는 걷기조차 두려워하던 거리를 거닐고 있다."
 gaudi.42.g: "방어를 하기 위한 고리가 아닌, 방향을 제시하는 고리로다."
 gaudi.43.t: "권력의 대로"
 gaudi.43.d: "새 지사가 [ROOT.GetCountry.GetCapital.GetCityHubName]의 형태를 한 축씩 바꾸어나가고 있다. 드넓고 곧으며 한 치의 타협도 없는 축 말이다."
 gaudi.43.f: "이것은 확장이 아니다. 수술이다.\n\n동네 전체가 나침반과 도시 계획의 몫으로 전락한다. 한때 미로 같던 구역에는 대로가 깎여나간다. 오랜 골목길은 사라지고 그 자리에는 기념비와 병영, 정부기관으로 이어지는 길쭉하고 곧은 선이 채워나간다.\n\n반발이 터져나오는가 하면, 동의서는 서명되고, 주택은 수용되고, 건물 정면은 정돈된다. [ROOT.GetCountry.GetCapital.GetCityHubName]에서는 이제 질서의 언어를 말한다. 가시성과 순환, 통제의 언어 말이다. 웅장함의 뒷편에는 의도가 담겨 있다.\n\n가난한 사람들은 '정화 작업'이라 부른다. 시 공무원들은 '근대화'라 부른다. 도지사는 '필수 사업'이라 부른다."
 gaudi.43.g: "이 계획에서 벗어날 자 누가 있으랴."
 gaudi.44.t: "대도시의 지평"
 gaudi.44.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]시는 이제 한낱 수도에 그치지 않는다. 세상을 축소판으로 만들어 나가고 있다."
 gaudi.44.f: "옛날의 도시는 경계란 것이 있었다. 이 도시는 그런 게 없다.\n\n석재가 지배하던 곳에 강철과 유리가 박힌다. 철도 노선은 공공 정원의 지하를 교차해 나간다. 황혼에서 새벽까지 전등불이 선을 흐릿하게 만든다. 대사관과 은행, 미술관과 카페가 새 시대의 철제 온실 속 난초처럼 만발해 있다.\n\n아케이드에서는 외국의 언어가 울려 퍼진다. 마천루는 성당과 자웅을 겨룬다. [ROOT.GetCountry.GetCapital.GetCityHubName]시는 더 이상 성장하여도 되느냐고 허락을 구하지 않는다... 오히려 성장을 주도할 것이란 기대 뿐. 각 구역에서 단 하나의 진실이 드러난다. 이곳은 더 이상 한 국가의 도시가 아니라, 여러 나라가 모인 도시란 것을."
 gaudi.44.g: "우리는 일어선다. 벌써부터 세상이 우리를 지켜보고 있기에."
 gaudi_capital_expansion_project_progress_bar: "수도 확장"
 gaudi_capital_expansion_project_progress_bar_desc: "수도 확장: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|1%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/30)"
 gaudi.511.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]의 정비 사업에 나서는 과정에서 도시 계획에 의견차가 빚어지고 있다."
 gaudi.512.t: "순환 도로의 조각상"
 gaudi.512.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]의 새로운 순환 도로에 여러 인물상이 세워질 예정이지만, 신화 속의 어떤 존재가 이 특별한 자리를 장식할 지는 아직 결정되지 않았다."
 gaudi.513.f: "새 정부 청사는 정부의 대표 청사로 지어질 전망이었으나, 거듭된 설계 변경과 확장, 결탁 정황으로 건설이 지연되었고 결국 모든 예산이 완공 직전에 소진되고 말았다. 미완공 상태라 해도 몇가지 임시 조치를 취하면 쓸만한 수준이 되겠지만, 사무공간이 더 작고 기대했던 것보다 불편한 환경에 만족해야 한다는 점에서 정부에게는 못미더운 수준이 될 수 있다. 추가 공사도 가능하지만 상당한 예산이 소요될 것으로 전망된다."
 gaudi.511.t: "분수냐 전시관이냐"
 gaudi.511.f: "황제의 수염을 놓고도 언쟁을 벌이고 마는 것이 사람일진데, 이번에도 별 것도 아닌 것이 본격적인 정치 논쟁으로 비화되고 말았다. 그 주제는 고도의 미학적 가치로 꾸며진 대표 광장에 어떤 건설 사업을 벌일지에 관한 것이었다. 한쪽은 그곳에 전시관을 지어 오래토록 남겨두자고 한 반면, 다른 쪽에서는 분수를 지을 것을 지지하고 있다. 자리는 하나 뿐인 만큼 건설 사업도 하나만 택할 수 있는 상황이다. 여기에 타협은 성립될 수 없다."
 gaudi.511.g: "전시관을 짓는다."
 gaudi.511.h: "분수를 짓는다."
 gaudi.511.i: "그 자리라면 내가 따로 생각해 둔 계획이 있거늘..."
 gaudi.512.f: "순환 도로를 계획하는 과정에서도 몇가지 세부 사항은 아직 확실치 않다. 눈에 잘 드러나는 위치에 어떤 인물상을 세워둘 것이냐가 결정되지 않고 있다. 고대 로마의 신을 대상으로 삼아야 한다는 점은 확실하다. 특정 계층에서는 각 신의 형상에 본인 스스로를 대입시키려는 모습이다. 이를테면 자본가들은 상업의 신인 메르쿠리우스를 중앙에 배치하자고 제안하고 있고, 귀족들은 신들의 아버지인 유피테르를 고집하고 있다. 군부에서는 마르스를, 학계에서는 아폴로를 중앙에 세우기를 바라고 있다."
 gaudi.512.g: "유피테르."
 gaudi.512.h: "메르쿠리우스."
 gaudi.512.i: "아폴로."
 gaudi.512.j: "마르스."
 gaudi.513.t: "정부청사 공사비의 예산 초과"
 gaudi.513.d: "새로운 정부 청사 건설이 작은 스캔들로 번지고 있다."
 gaudi.513.g: "예산을 한번 배정했으면 그 예산을 어떻게든 지켜야 하오."
 gaudi.513.h: "안타까운 일이지만 여기서는 흔한 일이라."
 gaudi.513.i: "필요한 만큼 예산과 시간을 들여야 할 사업이오."
 gaudi.514.t: "새로운 커피 하우스"
 gaudi.514.d: "빈 순환도로에 새로운 커피 하우스가 문을 열었다."
 gaudi.514.f: "\"커피 하우스는 새로운 모든 것을 가르치기 위한 최적의 장소에 자리해 있다. 이 말을 이해하려면 빈의 커피 하우스가 세계 그 어디에서도 비슷한 곳을 찾아볼 수 없는 특별한 시설이라는 것을 알아야 할 터이다. 그곳은 어느 누구든 값싼 커피 한 잔을 마실 수 있는데, 그 소량의 입장료면 여느 손님이든 몇 시간 동안 앉아서 토론하고, 글쓰고, 카드 놀이하고, 편지를 읽고, 또 무엇보다도 무제한의 신문과 잡지를 즐길 수 있다는 점에서 사실 민주적인 클럽이라 할 수 있다. 빈의 고급 커피 하우스에서는 빈에서 유통되는 모든 신문을 읽어볼 수 있으며, 빈의 것 뿐만 아니라 독일 제국, 프랑스, 영국, 이탈리아, 미국의 온갖 신문은 물론 세계의 문학과 예술 평론지도 즐길 수 있다. 그렇게 우리는 세상에서 무슨 일이 벌어지고 있는지 직접 알게 되고, 출간되는 모든 책과 공연 소식을 어디서든 접하고, 온 신문의 평론을 비교하였다. 오스트리아 사람들의 유연한 지성과 국제적 감각에 제일 큰 영향을 끼친 것은 아무래도 커피 하우스에서 세상의 모든 사건들을 두루 파악하고 동시에 친근한 분위기 속에서 토론할 수 있었던 것이 아닐까. 우리는 매일 몇 시간씩 그곳에 앉아 있었고, 그 덕분에 하나도 놓치지 않을 수 있었다.\" - 슈테판 츠바이크"
 gaudi.514.g: "[SCOPE.sCharacter('gaudi_ruler').GetFullName] [SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle]께서 찾아뵙는 것이 좋겠군."
 gaudi.514.h: "빈 시민들의 삶의 수준을 높여 주겠군."
 gaudi.515.t: "순환 도로 궁전"
 gaudi.515.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]의 신도시 구역에 궁전을 짓겠다고 욕심을 부리는 귀족이 있다. 반쯤 완성된 건물 잔해가 흉물로 변할 위기에 처했다."
 gaudi.515.f: "순환 도로 궁전은 빈 순환도로에 늘어선 웅장한 궁전들을 일컫는 용어이다. 이 건물들은 19세기 말 오랜 귀족들이나 은행업자와 기업가들이 지은 것이 대부분이다. 신바로크 양식이나 신르네상스 양식, 신매너리즘 양식이 혼합된 이 궁전들은 신분 상승과 지위의 상징이었다. 그러나 최근 건설업체 중 한 곳이 과도한 사업 확장으로 파산 위기에 처했다고 한다. 최악의 경우 철거가 불가피해져 전체 사업이 지연될 것으로 전망되는 가운데, 시민들은 흉물로 남아버린 건물들을 벌써부터 싸늘한 시선으로 보고 있다."
 gaudi.515.g: "공사비를 부담하겠다."
 gaudi.515.h: "우리가 개입할 바 아니다."
 gaudi.516.t: "수도 확장: 순조로운 진척"
 gaudi.516.d: "[ROOT.Var('gaudi_architect_var').GetCharacter.GetFullName](이)가 수도 확장 공사가 에상보다 일찍 마무리될 것이라고 밝혔다."
 gaudi.516.f: "알 수 없는 이유로 공사가 순조롭게 진행되고 있다. 그것이 애국심 때문이든, 임금이 높기 때문이든, 지역 유지들이 지원에 거리낌 없기 때문이든, 아니면 그저 날씨가 더 좋기 때문이든 간에 말이다."
 gaudi.516.g: "아주 좋아."
 gaudi.517.t: "수도 확장: 느린 진척"
 gaudi.517.d: "오늘 [ROOT.Var('gaudi_architect_var').GetCharacter.GetFullName] 산하 건설 총책임자가 안타깝게도 [ROOT.GetCountry.GetCapital.GetCityHubName]의 새 구역 건설이 예정보다 늦어지고 있으며 시간이 더 오래 걸리고 있음을 인정하였다."
 gaudi.517.f: "알 수 없는 이유로 공사가 더디게 진행되고 있다. 그것이 정치적 반대 세력의 교란이든, 노조가 공사에 소홀한 것이든, 비밀 결사의 음모이든, 아니면 그저 악천후가 내려서든 간에 말이다."
 gaudi.517.g: "안타깝다."
 gaudi.518.t: "[SCOPE.sCharacter('gaudi_ruler').GetFullName] [SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle] 기념상"
 gaudi.518.d: "빈 순환도로에 새로운 기념비를 세우는 방안이 계획되고 있다. 그건 바로 [SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle] 폐하의 동상이다."
 gaudi.518.f: "빈 순환도로는 오스트리아의 역사를 보여주는 공간이었다. 한쪽에는 합스부르크 왕가의 군주들이 불멸의 모습으로 길게 늘어서 있고, 그 중에서도 마리아 테레지아가 가장 화려한 동상으로 자리해 있다. 그러나 오이겐 폰 자포이엔 이나 슈바르츠베르크 등의 장군상도 빈의 도시 풍경을 장식하고 있다. 한편 자본가들은 본인들의 사상을 영원히 기리는 데 중점을 두었는데, 대표적으로 시인 괴테와 쉴러는 물론 위대한 작곡가 슈베르트, 모차르트, 베토벤 등의 인물상이 세워졌다."
 gaudi.518.g: "[SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle]께서 마음에 들어하실 것이오."
 gaudi.518.h: "그것도 좋지만... 그보다 순환도로의 완공에 집중해야 한다."
 gaudi.519.t: "화재 발생!"
 gaudi.519.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]의 건설 현장에서 거센 불길이 이는 바람에 여러 건물이 전소되고 말았다."
 gaudi.519.f: "빈 순환 도로에서 벌어진 제일 유명한 사고로는 1881년 12월 8일 링테아터 화재 사고가 있다. 사망자가 수백 명에서 천여 명에 달하는 것으로 추정되어, 19세기를 통틀어 가장 큰 규모의 화재 사고로 꼽힌다. 화재 원인은 가스불에 있었는데, 등불에서 가스가 누출된 상태에서 불을 붙였다가 폭발한 것이었다. 그 결과 발생한 화재는 배경막 자락으로 번진 뒤 빠르게 무대 전체로 확산되고 결국 객석까지 번졌다. 이 사고로 국내외적으로 화재 예방 조치, 특히 극장 부문과 국내 극장 건설 법령에 큰 영향을 끼쳤다. 그날 저녁 공연 입장권을 갖고 있던 작곡가 안톤 브루크너는 몸이 좋지 않아 집에 머물렀기에 목숨을 건질 수 있었다."
 gaudi.519.g: "비참한 날일세."
 gaudi.520.t: "도시 확장에 대한 편견"
 gaudi.520.d: "농촌 주민 대표들이 [ROOT.GetCountry.GetCapital.GetCityHubName]의 성장이 일반 농촌 주민들에게 불리하게 돌아온다는 시각을 내비쳤다."
 gaudi.520.f: "\"수도의 풍경으로 보여주는 형언할 수 없는 오만함은, 정부가 고작 몇 걸음 앞만 생각하고 [ROOT.GetCountry.GetCapital.GetCityHubName] 시를 떠나본 적이 없는 고립된 도시 거주민으로 이루어져 있음을 보여준다. 그곳에서 막대한 자금이 낭비되고 있는데도 수도로만 흘러가고, 소도시나 마을에 사는 평민들은 전혀 알아챌 새가 없다. 그 이면에 깔린 이념은 중앙집권과 관료주의를 옹호하고 국가기관을 지지한다. 허나 이처럼 퇴폐적인 계획이 보통 사람들에게 무슨 시각을 제시할 수 있겠는가?\""
 gaudi.520.g: "열심히 일하는 농촌 주민들에게 이득이 될 만한, 따뜻한 선물을 선사하는 것이 어떻겠나?"
 gaudi.520.h: "도시와 농촌은 동등하다."
 gaudi.520.i: "이런 무식한 농부의 넋두리를 누가 신경 쓴단 말인가?"
 gaudi.521.t: "기업가의 저택"
 gaudi.521.d: "부유한 사업가가 새로운 궁전을 지었다. 또 하나의 거대한 건물로 [ROOT.GetCountry.GetCapital.GetCityHubName]에 풍요로움이 한층 더해졌다."
 gaudi.521.f: "기업가와 은행업자들의 궁전은 조국의 새로운 직책을 강조하기 위한 수단으로 비추어졌다. 또 유대인 출신의 부유층은 본인들이 해방되었음을 강조할 수 있었다. 19세기 빈의 도시 변화는 이를 보여주는 좋은 예시다. 가장 유명한 순환 도로 궁전은 엡슈타인 궁전이 꼽히는데, 기업가이자 은행업자였던 구스타프 리터 폰 엡슈타인의 소유로 지어졌다. 건축가는 테오필 프라이허 폰 한센으로, 인근의 오스트리아 국회의사당도 설계한 바 있다. 궁전의 규모는 총 5층이며 당대 전형적으로 쓰이던 신르네상스 양식으로 지어졌다."
 gaudi.521.g: "성장하고 번영하는 [ROOT.GetCountry.GetCapital.GetCityHubName]."
 gaudi.522.t: "병영 확대"
 gaudi.522.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]의 확장으로 병영들을 새로이 하고 확대할 기회가 생겼다."
 gaudi.522.f: "프란츠 요제프 병영은 오늘날 순환도로 구역에 지어져 있었던 병영 건물로, 오랫동안 대규모 건설 사업의 장애물로 여겨져 왔다. 이 병영은 프란츠 요제프 1세 황제의 이름을 따왔으며 1848년 혁명을 계기로 1854년부터 1857년까지 지어졌다. 완공 직후 1857년부터 시작된 빈 순환도로 개발의 길목에 병영이 자리하게 되었으나 부대가 철수하기까지는 40년의 시간이 더 걸렸다. 따라서 프란츠 요제프 병영의 철거를 감안하여 사전에 새로운 병영을 건설할 필요가 있었다."
 gaudi.522.g: "병영을 확대하세."
 gaudi.522.h: "그 시간을 다른 곳에 투자하세."
 gaudi.523.t: "건설 부문 확대"
 gaudi.523.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]의 확장으로 건설 부문을 확대할 기회가 생겼다."
 gaudi.523.f: "\"예술가의 본성이란 일반적으로 예술가의 작품 창작을 방해하는 여러 특성의 총합이라고들 한다.\" - 아르투어 슈니츨러"
 gaudi.523.g: "건설 사무소를 확대하세."
 gaudi.524.t: "아름다운 공원"
 gaudi.524.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]의 새로운 공원이 완공되어 온 시민들에게 개방되었다."
 gaudi.524.f: "새로운 시립공원의 대문이 활짝 열렸다. 잔디는 비단처럼 부드럽게 펼쳐져 있고, 오솔길은 화단과 조각상 사이로 굽이굽이 이어진다. 그러나 사람들을 가장 끌어당기는 것은 잔디가 아니라 바로 그 소리다. 그것은 야외음악당, 소규모 관현악단, 산들바람을 타는 왈츠다. 한때 살롱과 궁전에서만 들리던 공공 음악이 이제는 공기를 가득 채우며 모두의 귓속에 들어간다. 빈 같은 도시에서는 쿠르잘론이 음악의 시민 전당으로 자리한다. 요하네스가세에 위치한 웅장한 이탈리아 르네상스 양식 건물로, 공원 안에 넓은 테라스를 갖췄다. 슈트라우스 형제 시대에 쿠르잘론은 무용과 공연이 펼쳐지는 인기 많은 장소였다."
 gaudi.524.g: "산책해 봅시다."
 gaudi.524.h: "공연을 열어 기념하세!"
 gaudi.525.t: "오페라 극장 확대"
 gaudi.525.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]의 확장으로 오페라 극장을 새로이 하고 확대할 기회가 생겼다."
 gaudi.525.f: "대로와 아케이드, 분수와 정부청사가 즐비한 가운데 기존의 오페라 극장은 초라하고 촌스럽게까지 느껴지게 되었다. 이에 건물을 새로 세우거나 대규모 확장에 나서자는 제안이 제기되었다. 좌석수를 늘리고, 음향 시설을 개선하고, 장엄한 외관으로 바꾸는 것이다. 문화의 전당은 도시의 위상에 부합하는 법이다. 전 유럽을 통틀어 이러한 움직임은 국가적 위신의 상징이 된다. 파리에서는 대리석 계단과 황금 천장을 갖춘 오페라 가르니에가 들어섰고, 빈에서는 1869년 슈타트조퍼 극장이 도도하고 품격있는 모습으로 순환도로를 장식하였다."
 gaudi.525.g: "오페라 극장을 확대하세."
 gaudi.526.t: "시청 확대"
 gaudi.526.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]의 확장으로 시청을 새로이 하고 확대할 기회가 생겼다."
 gaudi.526.f: "옛 시청사는 아직도 지난 세기의 시 문장을 품고 있다. 내부를 보면 계단은 비좁고, 사무공간은 포화 상태이며, 높이 쌓인 원장 서류는 벽판을 넘볼 지경이다. 시장의 탁자는 서류를 두기에 겨우 충분한 크기이며 권력을 담기엔 턱없이 부족하다. 이제는 이 도시의 늘어가는 행정, 경제, 사회적 정체성을 반영할 새로운 시청사를 건립하는 방안이 제시되고 있다. 높이 솟은 첨탑, 절제된 고전주의 양식. 어느 쪽이든 권위를 담아내어야 한다. 전 유럽의 도시들은 이러한 도전에 제대로 대응해 왔다. 빈에서는 1883년 신고딕 양식의 라트하우스가 준공되어 도시가 내비치는 자신감의 상징이 되었다. 파리에서는 1871년 장엄하고 도전적인 모습으로 시청사를 다시 세웠다. 베를린의 로테스 라트하우스는 르네상스의 외형과 프로이센의 기능성을 두루 갖춘 건물로 세워졌다."
 gaudi.526.g: "시청을 확대하세."
 gaudi.527.t: "헬덴플라츠"
 gaudi.527.d: "헬덴플라츠(영웅 광장)의 조성이 완료되면서 정계 대표 인사들이 그에 걸맞은 개장식을 추진하고 있다."
 gaudi.527.f: "빈 순환도로가 조성될 당시, 프란츠 요제프 황제의 명으로 추진되었으나 완공에는 이르지 못한 카이저포룸의 한 구역으로 '외부 왕궁 광장'이 설계되었다. 이 광장은 레오폴디네관, 신 호프부르크 궁전, 합스부르크 미술관, 그리고 폴크스가르텐 부지에 세워질 예정이었으나 결국 지어지지 못한 신 궁전의 대척점으로 둘러싸인 직사각형 형태의 광장이었다. 1878년에는 헬덴플라츠(Heldenplatz)라는 이름이 확정되었는데, 안톤 도미니크 페른코른이 제작한 두 개의 기마상에서 유래한 이름이었다. 두 기마상 가운데 오래된 것은 카를 대공의 기마상으로 1860년에 공개되었다. 짝을 이루는 나머지 하나는 오이겐 왕자의 기마상으로 1865년에 완성되었다. 제1차 세계 대전 패전으로 합스부르크-로렌 왕조 하의 오스트리아-헝가리 이중 군주제가 붕괴되고 오스트리아 제1공화국이 건국되면서, 헬덴플라츠는 모든 정치 진영이 모이는 장이자 오스트리아군의 연병장 역할을 하게 되었다."
 gaudi.527.g: "행진식을 열고 조국의 친우들을 초청하세."
 gaudi.527.h: "추후 몇 년 동안 정기적인 군사 열병식을 실시하세."
 gaudi.527.i: "그 돈은 누가 다 내려고?"
 gaudi.528.t: "대학 확대"
 gaudi.528.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]의 확장으로 대학을 새로이 하고 확대할 기회가 생겼다."
 gaudi.528.f: "지성이 없는 대도시는 무슨 의미가 있는가? 철도와 정부청사, 극장이 즐비한 가운데 대학은 제 흥행에 짓눌려 있다. 학생들은 너무 많은 데 반해 가르칠 공간은 너무 부족하다. 각 학부는 여러 임대 건물로 뿔뿔이 흩어져 있다. 교수들은 도서관과 실험실 사이 공간에 떠밀려 있다. 해결 방안은 명확하다. 캠퍼스를 새로 짓거나 대규모 확장에 나서는 것. 최신 강의실, 전용 시설, 장엄한 도서관 말이다. 그러한 사업은 단순 기반시설 그 이상의 의미를 지닌다. 야심찬 지성을 선언하는 기회가 되는 것이다. 빈에서는 1870년대에 이르러 순환도로를 따라 대학을 이전하고 장대한 외관과 상징적 통합을 갖추어 다시 지었다. 파리에서는 프랑스의 늘어나는 지식 계층을 수용하기 위해 소르본 대학교가 쥘 페리의 개편 방안을 따라 대거 확장된 사례가 있었다."
 gaudi.528.g: "대학을 확대하세."
 gaudi.529.t: "예술 학교 확대"
 gaudi.529.d: "[ROOT.GetCountry.GetCapital.GetCityHubName]의 확장으로 예술 학교를 새로이 하고 확대할 기회가 생겼다."
 gaudi.529.f: "도시가 성장하면서 예술을 향한 갈망도 커져가고 있다. 그러나 화가와 조각가들은 여전히 비좁은 작업실과 어두컴컴한 다락방에 틀어박혀, 거장의 가르침이 아니라 소문과 빌려온 스케치에 의존하고 있다. 이에 채광 좋은 작업실, 해부학 실습실, 대중에게 개방된 전시관을 갖춘, 제대로 된 예술 학교를 설립하는 방안이 제기되고 있다. 전 유럽에서 이러한 예술 학교는 국가의 정취를 이루어 왔다. 파리의 에콜 데 보자르는 유럽 대륙 절반에 걸쳐 고전 미술의 기준을 제시하였다. 빈에서는 미술 대학의 웅장한 건물이 빈 순환도로의 문화적 위상을 드높이고 있다."
 gaudi.529.g: "예술 학교를 확대하세."
 gaudi.530.t: "우라니아"
 gaudi.530.d: "민중 교육관이라고도 부르는 '우라니아'가 빈에 개관하였다. 그러나 정확한 운영 목적은 여전히 논란이 분분하다."
 gaudi.530.f: "1883년 독일 천문학자 막스 빌헬름 마이어는 빈 대학의 조교로 부임하여 과거와 미래의 일식을 계산하는 일을 맡았다. 이와 함께 민속학 강의를 진행하고 민속 교육기관을 설립한다는 구상을 진행해 나갔다. 1885년 베를린으로 부임한 뒤에도 그곳에서 자신의 구상안을 계속해서 발전시켜 나갔다. 빈의 우라니아 천문대는 베를린의 우라니아 천문대를 본보기로 삼아, 최대 수용력 800명에 200석 규모의 강당, 과학 시연장, 천문대를 갖추었다. 그러나 당시 '임시'로 세워졌던 탓에 몰려드는 방문객을 감당하기 어려워, 머지않아 순환도로에 새 건물을 지어야 했다. 우라니아는 어학 강좌 등의 교육기회를 확대했을 뿐만 아니라, 자체적인 우라니아 교향악단과 우라니아 합창단을 갖춘 공연장으로도 활용되었다. 그러나 파격적인 형태와 건축 방식은 당시 빈에서 흔히 볼 수 있던 논란을 불러일으켰다. 그러나 빈 시민들은 새로운 우라니아를 마음에 들어했고, 머지않아 빈을 대표하는 건축물로 자리매김하였다."
 gaudi.530.g: "건축계를 대표할 건물이다."
 gaudi.530.h: "오락 시설을 주 목적으로 삼는다."
 gaudi.530.i: "어느 무엇보다도 천문대여야 한다."
 gaudi.9.t: "도시 계획 완료"
 gaudi.9.d: "[ROOT.Var('gaudi_architect_var').GetCharacter.GetFullName](이)가 여러 지역의 도시 계획 작업을 마무리짓고 다시 다른 활동에 나설 수 있게 되었다.\n\n개량된 건물 수: [GetPlayer.MakeScope.Var('mr_num_improved_urban_center_buildings_var').GetValue|V0]곳\n사업으로 획득한 $concept_gaudi_architectural_splendour$의 수: @gaudi_architectural_splendour! [JournalEntry.MakeScope.ScriptValue('gaudi_architectural_splendor_from_urban_planning_for_event_value')|+0]"
 gaudi.9.f: "\"건축은 상상력과 기발함을 충분히 불어넣기 전까지 최고의 경지에 도달하지 않는다. 그것은 정제되지 않은 상상력이나 변덕스러운 공상이 아니라, 질서정연한 구조로 모든 지적 관찰자의 눈을 즐겁게 하고 시처럼 감정을 자극하여야 한다.\" - 헨리 반 브런트"
 gaudi.9.g: "할 일은 많고 시간은 부족하구나."
 gaudi_architecture_treatise_modifier: "건축 논문"
 gaudi.8.t: "[ROOT.Var('gaudi_architect_var').GetCharacter.GetLastName]의 건축 논문"
 gaudi.8.d: "[ROOT.Var('gaudi_architect_var').GetCharacter.GetFullName](이)가 논문 집필을 마무리하였다. [ROOT.Var('gaudi_architect_var').GetCharacter.GetHerHis|U] 논문은 과거와 현대의 건축을 주제로 삼았으며 본인의 이론적 고찰로 한층 강화되어 후세의 건축가들에게 영향을 끼칠 것이다."
 gaudi.8.f: "\"건축은 인류의 위대한 사상을 기록해 왔다. 그 모든 종교적인 상징 뿐만 아니라 온 인류의 생각이 그 거대한 책에 한 쪽을 차지하고 있다.\" - 빅토르 위고"
 gaudi.8.g: "후세를 위한 작품이군."
 je_gaudi_architecture_treatise: "건축 논문"
 je_gaudi_architecture_treatise_reason: "[ROOT.Var('gaudi_architect_var').GetCharacter.GetFullName](이)가 건축 예술에 관하여 자신이 쌓아왔던 지식을 하나의 저서로 엮기 위해 1년간 자리를 비웁니다. 이 저서는 본인의 일생에 대한 선언문으로서, 건축에 관한 자신의 모든 경험과 이론을 집대성한 것입니다. 논문의 가치를 결정짓는 데에는 건축가의 명성이 결정적인 역할을 합니다. 하지만 $literary$, $erudite$, $innovative$, $aesthete$와 같은 인물 특성도 중요하게 여겨집니다."
 je_gaudi_architecture_treatise_success: "[ROOT.Var('gaudi_architect_var').GetCharacter.GetFullName](이)가 1년 뒤에 복귀함"
