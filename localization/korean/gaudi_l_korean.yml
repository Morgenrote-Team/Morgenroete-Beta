 gaudi_traditional_style: "전통 건축"
 gaudi_traditional_style_desc: "건축가 보유로\n$country_construction_add$ #p +10#! (과제로 바쁘지 않을 때에 한정)\n\n이 건축가는 새로운 혁신 없이 옛 건축 양식에만 전념합니다."
 gaudi_historicism_style: "역사주의 건축"
 gaudi_historicism_style_desc: "건축가 보유로\n$country_construction_add$ #p +20#! (과제로 바쁘지 않을 때에 한정)\n\n이 건축가는 고대 건축물의 주제와 형태, 양식을 가져와 조합하고 해석하여 새로운 것을 창조합니다."
 gaudi_bauhaus_style: "바우하우스 건축"
 gaudi_bauhaus_style_desc: "건축가 보유로\n$country_construction_add$ #p +30#! (과제로 바쁘지 않을 때에 한정)\n\n이 건축가는 절제되고 명료하며 단순한 형태의 건물을 선호합니다."
 gaudi_neoclassical_style: "신고전주의 건축"
 gaudi_neoclassical_style_desc: "건축가 보유로\n$country_construction_add$ #p +30#! (과제로 바쁘지 않을 때에 한정)\n\n이 건축가는 뚜렷한 미적 형태와 제정 시대의 과거를 연상시키는 기념비적 건축을 선호하는 경향이 있습니다."
 gaudi_art_deco_style: "아르데코 건축"
 gaudi_art_deco_style_desc: "건축가 보유로\n$country_construction_add$ #p +30#! (과제로 바쁘지 않을 때에 한정)\n\n이 건축가는 활력과 웅장함을 강조하는 고급스럽고 유쾌한 건축을 추구합니다."
 gaudi.51.t: "신고전주의 부활"
 gaudi.51.d: "[ROOT.GetCountry.GetName](이)가 시대를 초월하는 품격 있는 건축의 모범이 되고 있다. 그 지위만큼은 문명 세계 모두에 경외감을 불러일으키게 되었다!"
 gaudi.51.f: "\"오랜 걸작의 보편적이면서도 가장 두드러진 특징은, 결국 자세와 표정 모두에서 드러나는 고귀한 간결함과 고요한 웅장함이다.\"\n- 요한 요하임 빈켈만"
 gaudi.51.g: "진정한 예술의 정수로다."
 gaudi.52.t: "바우하우스의 승리"
 gaudi.52.d: "[ROOT.GetCountry.GetName](이)가 합리적이고 진보적인 건축의 상징이 되고 있다. 그 지위만큼은 전세계의 존경과 찬사를 받게 되었다!"
 gaudi.52.f: "\"디자인은 직업이 아니라 태도이다.\"\n-라슬로 모호이너지"
 gaudi.52.g: "멋부림의 필요가 아닌 인간의 필요를 위하여!"
 je_gaudi_bauhaus_architecture: "바우하우스 건축"
 je_gaudi_bauhaus_architecture_reason: "바우하우스는 공예와 순수미술을 조화한다는 취지에서 1919년부터 1933년까지 운영된 독일의 예술 학교다. 바우하우스는 개인의 예술적 관점과 대량 생산의 원칙, 기능성을 중시하는 고유의 디자인 철학으로 유명해졌다. 모든 예술 분야를 궁극적으로 결합하여 '종합예술작품'(Gesamtkunstwerk, 게잠트쿤스트베르크)을 창조한다는 이념을 바탕으로 설립되었다. 바우하우스 양식은 이후 현대 디자인, 현대 건축, 건축 교육에 가장 큰 영향을 끼친 사조로 거듭나게 되었다."
 je_gaudi_neoclassical_architecture: "신고전주의 건축"
 je_gaudi_neoclassical_architecture_reason: "20세기 초의 신고전주의는 고대 그리스 로마 시대의 정갈한 명료성, 대칭성, 웅장함을 되찾고자 했던 부활주의 건축이자 예술 운동이었다. 역사주의의 과도함과 근대 미술의 추상성 증가에 대한 반발로 등장한 신고전주의 양식은 기념비성, 기하학적 질서, 전통적 형태의 활용을 강조하였으며, 합리적이면서도 대개는 국가에서 허락하는 방식으로 이루어졌다. 신고전주의는 국가 정체성과 시민 건축과 밀접한 연관이 있었으며, 영속성과 권위, 절제된 미라는 이상을 투영하였다."
 je_gaudi_art_deco_architecture: "아르데코 건축"
 je_gaudi_art_deco_architecture_reason: "1920년대 등장한 아르데코 운동은 고전적 질서의 요소들을 유지하면서도 모더니즘을 수용한 장식과 건축 양식이다. 양식화된 형태, 풍부한 소재, 장식적인 기하학 무늬를 활용한 것이 특징인 아르데코는 장인 정신의 화려함과 새롭게 부상하는 기계적인 미학의 조화를 꾀했다. 산업과 속도, 이국적 요소에서 영감을 받은 모티프를 통해 기술의 발전과 도시의 역동성을 찬양하였다."
 je_gaudi_splendour_bauhaus: "바우하우스의 승리"
 je_gaudi_splendour_bauhaus_reason: "바우하우스 정신의 도래와 함께 건축가들은 장식과 환상을 벗어던지고 명료성, 정밀성, 재료의 진실성에 충실하기 시작하였다. 그 목표는 더 이상 화려함으로 사람들을 압도하거나 옛 제국의 위엄을 되살리는 것이 아니라, 기능적이고 정직하며 근대적인 공간을 창조함으로서 사회에 기여하는 것이 되었다. 바우하우스는 단순 미학이 아니라 건축과 일상생활이 단순성, 실용성, 형태와 목적의 통일성을 거쳐 조화롭게 어우러져야 한다는 신념에 기반한 디자인 철학에 해당된다. 수도의 건축에 바우하우스 원칙을 적용하면 단순 근대성을 넘어 가장 순수한 형태의 진보를 보여줄 것이다. 외관보다 기능을, 전통보다 혁신을 우선시하는 것이다."
 je_gaudi_splendour_neoclassical: "신고전주의 부활"
 je_gaudi_splendour_neoclassical_reason: "신고전주의는 고대 그리스 로마의 이성적 조화, 이를테면 기둥과 박공, 대칭적 배치와 같은 건축 문법에 뿌리를 둔 양식이다. 그러나 20세기 초에 이르러 근대 건축 공법, 간결한 직선, 기념비적 규모로 재해석되는 경우가 많았다. 전통을 상징하였을 뿐만 아니라 미래를 향한 절제된 비전을 제시한 것이다. 그 비전이라 함은 경외감과 통합을 불러일으키는 건축물 속에서 대중 생활과 법치, 문화를 담는 미래를 지향하는 것이었다. 이러한 원칙을 수용한 건축은 우리 수도에 위엄과 장대함을 부여하여, 세계의 눈앞에 질서와 회복력, 세련된 권력의 상징으로 자리매김할 것이다."
 je_gaudi_splendour_art_deco: "아르데코의 이상"
 je_gaudi_splendour_art_deco_reason: "아르데코의 도입으로 건축가들은 과거의 경직된 역사주의를 타파하는 식으로 예술계를 뒤바꿔놓았다. 그러나 여러 모더니즘 사조와는 달리 이들의 건축은 단순히 기능성과 즉물성을 표현한 것이 아니었다. 아르데코는 고전 모더니즘의 전반적인 부흥 속에서 일궈낸 하나의 발전으로서, 형태의 우아함, 재료의 고급스러움, 색채의 강렬함, 주제의 관능미가 조화롭게 어우러졌다. 전성기 아르데코는 사치와 화려함, 풍요, 사회 기술 발전에 대한 신뢰를 상징했다. 이러한 원칙들을 존중하는 건축은 조국을 근대성과 부의 얼굴로 탈바꿈할 것이다."
