 gaudi.1409.d: "우리 [concept_tesla_engineer] [GetPlayer.MakeScope.GetVariable('tesla_engineer_var').GetCharacter.GetFullName] 박사가 최첨단 지구물리학적 방법을 동원하여 [SCOPE.sState('gaudi_deposit_state').GetName] 지역에서 새로운 석유 매장지를 발견하였다."
 gaudi.1407.f: "게임 진행 과정에서 공학자를 통해 철, 납, 석유 등 특수 광물 매장지를 세 차례에 걸쳐 찾아낼 수 있습니다. 그러나 이것은 오랜 기간 동안 지자기에 관한 지식을 축적해야 가능한 일입니다. 따라서 지자기 조사는 가능한 한 빨리 시작하는 것이 좋습니다."
