 je_gaudi_custom_monument_blueprint_research: "건축가의 걸작"
 je_gaudi_custom_monument_blueprint_research_reason: "[ROOT.Var('gaudi_architect_var').GetCharacter.GetFullName](은)는 동시대를 대표하는 가장 중요한 건축가로서 세계적 명성을 누리고 있다. 그 이름을 영원히 기리기 위하여 우리나라를 건축의 중심지로 세계 만방에 빛나게 할, 훌륭한 기념 건축물의 설계 작업에 나섰다."
 gaudi.81.t: "건축가의 걸작"
 gaudi.81.d: "최근 몇 년 사이에 건축계에서 [THIS.GetCountry.GetName](이)가 선도적인 국가로 부상하기 시작하였다. 이러한 발전의 이면에는 [ROOT.Var('gaudi_architect_var').GetCharacter.GetFullName]의 역할이 컸다.  이에 따라 고대와 중세, 근대의 위대한 건축에 필적할 만한 기념 건축물을 설계해 달라는 의뢰를 받아들였다."
 gaudi.81.f: "건축가의 기념 건축물은 위대한 건축가가 선호하는 양식에 기반을 두게 된다.\n\n아르데코 건축가는 [GetBuildingType('building_gaudi_people_monument').GetName]의 설계에 나선다.\n바우하우스 건축가는 [GetBuildingType('building_gaudi_people_forum').GetName]을 설계하게 된다.\n신고전주의 건축가는 [GetBuildingType('building_gaudi_people_palace').GetName]의 설계를 맡게 된다."
 gaudi.81.g: "참으로 기대되는군."
 ACHIEVEMENT_gaudi_stalin: "스탈린도 질투할"
 ACHIEVEMENT_DESC_gaudi_stalin: "계획 경제를 채택한 평의회 공화국으로 국민 궁전을 소유하십시오."
 gaudi.82.t: "건축가 일생일대의 역작"
 gaudi.82.d: "몇 달에 걸친 준비 끝에 [ROOT.Var('gaudi_architect_var').GetCharacter.GetFullName](은)는 설계도와 계산, 통계 자료, 그리고 직접 제작한 모형을 제출하였다. 그 야심찬 기념 건축물은 이미 건축계의 이상으로 불리우고 있다. 이제 남은 의문은 누가 그 이상을 현실로 구현할 것인가다."
 gaudi.82.f: "\"내일이면 우리는 아름다운 것들을 만들어낼 것이다.\" - 안토니오 가우디"
 gaudi.82.g: "우리 모두를 위한 기념물이오."
