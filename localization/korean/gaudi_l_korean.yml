 gaudi.1211.t: "신규 산업 생산 방식"
 gaudi.1211.d: "우리 [concept_tesla_mechanical_engineer] [GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')](이)가 우리 산업의 기계와 생산 공정 개량을 위해 몇 개월 동안 힘쓰고 있다.\n\n개량된 건물 수는 총 [GetPlayer.MakeScope.Var('mr_num_improved_industries_buildings_var').GetValue|V0]곳이다."
 je_gaudi_mechanical_computer_project_reason: "#T 우리 [concept_tesla_mechanical_engineer] [GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')](이)가 $verrier_mechanical_computer_tech$의 개발에 주력하고 있습니다.#!\n$mr_divider_for_je$\n다양한 여러 요인에 근거하여 월간 진행도를 획득합니다. 진행도가 2000에 도달하면 [GetTechnology('verrier_mechanical_computer_tech').GetName] 기술을 획득하여 #V $pm_verrier_mechanical_computer$#! [concept_production_method]을 사용할 수 있게 됩니다.\n$mr_divider_for_je$\n#V 현재 월간 진행도:#![GetPlayer.MakeScope.Var('gaudi_mechanical_computer_monthly_progress_var').GetValue|+2]\n\n#V 월간 기계 공학 진행도의 영향 요인: #![GetPlayer.GetCustom('gaudi_base_engineering_progress_tt_type')][GetPlayer.GetCustom('tesla_mechanical_engineering_progress_has_mechanical_engineer_tt_type')][GetPlayer.GetCustom('tesla_mechanical_engineering_progress_experience_tt_type')][GetPlayer.GetCustom('gaudi_mechanical_engineering_mechanical_engineer_trait_tt_type')][GetPlayer.GetCustom('gaudi_mechanical_computer_progress_mathematician_trait_tt_type')][GetPlayer.GetCustom('gaudi_mechanical_computer_progress_innovative_trait_tt_type')][GetPlayer.GetCustom('gaudi_mechanical_computer_progress_physicist_trait_tt_type')][GetPlayer.GetCustom('tesla_mechanical_engineering_progress_meticulous_trait_tt_type')][GetPlayer.GetCustom('tesla_mechanical_engineering_progress_persistent_trait_tt_type')][GetPlayer.GetCustom('gaudi_mechanical_computer_progress_bad_trait_trait_tt_type')][GetPlayer.GetCustom('gaudi_mechanical_computer_progress_senile_trait_trait_tt_type')][GetPlayer.GetCustom('academics_mathematical_university_multiplier_tiny_tt_type')][GetPlayer.GetCustom('gaudi_mechanical_computer_progress_tooling_workshop_levels_trait_trait_tt_type')]"
