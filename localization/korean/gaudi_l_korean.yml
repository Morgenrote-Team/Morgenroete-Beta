 je_gaudi_dombau_phase_4: "쾰른 대성당: 서측 정면과 첨탑"
 je_gaudi_dombau_phase_4_reason: "쾰른 대성당의 서측 정면은 지금까지 지어진 가장 큰 규모의 교회 정면이다. 이는 '정면 설계도 F'라고도 불리우는, 1370년 건축장인 미하엘 폰 사포이엔이 개발한 중세 시대 설계도를 세세히 따르고 있다. 쾰른 대성당의 실루엣을 이루는 특징은 두 개의 높이 솟은 첨탑이 자리한 쌍둥이탑 정면이다. 미하엘이 설계한 세공형 첨탑은 팔각형의 완전 개방형으로 되어 있으며, 그 꼭대기에 여러 층으로 된 장식물이 얹혀 있다. 고딕 건축가들은 이러한 설계를 통해 기술적으로 가능한 한계를 탐구하여, 쾰른 대성당이 동방박사 3인을 모신 '기념비적 성물함'으로서 강조되기를 바랐다."
 je_gaudi_dombau_phase_4_goal: "#E 건설 진행도#!가 #BLUE 120점#! 도달. 현재 #G [GetGlobalVariable('gaudi_dombau_progress').GetValue]#!점을 보유하고 있습니다. 보통 달마다 1점씩 획득합니다."
 je_gaudi_gotthard_survey: "고트하르트 철도: 계획과 측량"
 je_gaudi_gotthard_survey_reason: "19세기 스위스는 국제 철도 수송으로부터 소외되어 근대 교통 체계는 물론 산업혁명과도 단절될 위험에 놓여 있었다. 브레너 고개를 지나는 철도가 개통되면서 이러한 위협은 새로운 국면을 맞게 된다. 지리적으로 스위스는 오스트리아보다 더 큰 문제에 직면하였는데, 브레너 고개가 스위스 내 우회로보다 훨씬 쉽게 통과할 수 있었기 때문이다. 스위스의 산악 철도 부설에 앞서 경로 선정과 예산조달에 관한 논의가 수십 년 동안 이어졌다. 취리히의 정치인이자 사업가였던 알프레트 에셔는 고트하르트 노선의 결정에 있어 핵심적인 인물로 나섰다."
 je_gaudi_gotthard_survey_goal: "#E 계획 진행도#!가 #BLUE 60점#! 도달. 현재 #G [GetGlobalVariable('gaudi_gotthard_progress').GetValue]#!점을 보유하고 있습니다. 보통 달마다 1점씩 획득합니다."
 je_gaudi_gotthard_construction: "고트하르트 철도: 시공"
 je_gaudi_gotthard_construction_reason: "고트하르트 철도의 건설은 19세기 최대 규모의 건설 사업으로 평가되며, 그 규모와 기술적 난관으로 따지면 수에즈 운하의 건설과 비견될 만하다. 처음부터 가장 핵심적이면서도 야심차게 기획되었던 구간은 고트하르트 산맥을 관통하는 터널의 구현이었다. 1882년 개통 당시 고트하르트 정상 터널은 15km의 길이로 세계에서 가장 긴 터널로 꼽혔다. 주로 철강으로 지어진 100여개의 크고 작은 교량은 이 구간의 또다른 야심찬 구간으로서 유럽 북부와 남부를 이을 뿐만 아니라 스위스 통일의 상징이기도 하다."
 je_gaudi_gotthard_construction_goal: "#E 건설 진행도#!가 #BLUE 120점#! 도달. 현재 #G [GetGlobalVariable('gaudi_gotthard_progress').GetValue]#!점을 보유하고 있습니다. 보통 달마다 1점씩 획득합니다."
 je_gaudi_gotthard_discontent: "고트하르트 철도: 노동자의 불만"
 je_gaudi_gotthard_discontent_reason: "고트하르트 철도 건설 당시 노동 환경은 당대 기준으로도 열악했다. 노동자들은 대부분 외국인으로 구성되었는데 주로 이탈리아 북부 알프스 계곡 지대의 빈곤층으로 사실상 아무런 권리가 없었다. 특히 고트하르트 터널에서는 노동 강도가 목숨을 위협하는 수준에 임금도 매우 낮았다. 이 때문에 건설 관계자와의 갈등이 끊이지 않았고 한때는 전체 사업이 무산될 위기에 처하기도 했다."
 je_gaudi_gotthard_discontent_goal: "#E 노동자 불만도#!가 #BLUE 10점#!에 도달하면 파업이 발생합니다! 현재 값은 #R [GetGlobalVariable('gaudi_gotthard_discontent').GetValue]점#!입니다."
 je_gaudi_cristo: "구세주 그리스도상: 건설"
 je_gaudi_cristo_reason: "빈센트회 소속 페드루 마리아 보스 신부는 1850년대 중반 브라질의 섭정이자 페드루 2세 황제의 딸 이사벨 공주를 기리는 의미에서 코르코바두산에 기독교 조각상을 세우자고 처음 제안하였으나 이 계획은 승인되지 않았다. 1920년 리우데자네이루 가톨릭회에서 랜드마크 조각상을 세우자는 두번째 방안을 제시하였다. 현지 공학자 에이토르 다 시우바 코스타와 화가 카를루스 오즈와우드가 석상의 설계를 맡았으며, 프랑스 조각가 폴 란도스키가 실물로 제작하였다. 아르데코 양식의 조각상은 훗날 바로 옆에 있는 슈가로프산과 함께 리우데자네이루의 상징으로서 세계적인 명성을 얻게 되었다."
 je_gaudi_cristo_goal: "#E 건설 진행도#!가 #BLUE 120점#! 도달. 현재 #G [GetGlobalVariable('gaudi_cristo_progress').GetValue]#!점을 보유하고 있습니다. 보통 달마다 1점씩 획득합니다."
 je_gaudi_mole_phase_1: "몰레 안토넬리아나: 유대교 회당에서 국가적 상징으로"
 je_gaudi_mole_phase_1_reason: "몰레 안토넬리아나는 토리노의 건축가 알레산드로 안토넬리가 설계한 파빌리온 형태의 건물로서 높고 날카로운 첨탑이 돋보인다. 원래는 유대교 사회를 위한 시나고그(유대교 회당)으로 지어질 예정이었으나 건축가의 엄청난 야심으로 기존 계획을 넘어선 사업으로 나아가게 되었다. 이런 야심찬 시도에도 유대교 사회에서는 결국 추가 예산을 확보하지 못했다. 그러나 토리노 시민들은 대략적인 골조로도 충분히 인상적인 이 사업을 지역정부에서 인수하여 완공하고, 이탈리아 통일을 기리는 건물이 되어야 한다고 목소리를 냈다."
 je_gaudi_mole_phase_1_goal: "#E 건설 진행도#!가 #BLUE 120점#! 도달. 현재 #G [GetGlobalVariable('gaudi_mole_progress').GetValue]#!점을 보유하고 있습니다. 보통 달마다 1점씩 획득합니다."
 je_gaudi_mole_phase_2: "몰레 안토넬리아나: 등실과 첨탑"
 je_gaudi_mole_phase_2_reason: "안토넬리는 본인의 건축에 지속적인 변화를 가했는데, 예를 들어서 '템피에토'(tempietto)라 해서 신고전주의 양식의 육각 기둥이 두 층으로 구성된 회랑을 추가하여 기초적인 프로나오스 양식을 계승하였다. 안토넬리는 원래 첨탑 꼭대기에 오각형 별을 세우고자 하였으나 이후 날개 달린 정령 '제니오 알라토'(genio alato)의 동상을 대신 채택하였다. 이 동상의 제작은 안토넬리 사후 몇 개월 뒤 조각가 푸마갈리에게 의뢰되었다. 동상에는 양각과 금박을 입힌 구리 정령이 한 손에는 그릇을, 다른 손에는 야자나무 가지를 들고 있는 모습이었다. 머리에는 막대로 지지하는 조그만 오각형 별이 있었다. 1889년 4월 10일 이 별이 제자리에 설치되면서 몰레 안토넬리아나의 총높이는 167.5m에 달했고 당시 유럽에서 가장 높은 벽돌 건물로 등극하게 되었다."
 je_gaudi_mole_phase_2_goal: "#E 건설 진행도#!가 #BLUE 120점#! 도달. 현재 #G [GetGlobalVariable('gaudi_mole_progress').GetValue]#!점을 보유하고 있습니다. 보통 달마다 1점씩 획득합니다."
 je_gaudi_ringstrasse_phase_1: "빈 순환도로: 순환 도로의 제왕"
 je_gaudi_ringstrasse_phase_1_reason: "빈 순환도로는 19세기 도시 성벽을 철거하고 난 뒤에 건설되었다. 1860년대부터 1890년대까지 순환도로를 따라 수많은 대형 공공 건축이 조성되었는데, 이들은 간혹 '링슈트라센슈틸'(Ringstraßenstil, 순환도로 양식)이라 불리우는 고전주의, 고딕, 르네상스, 바로크 건축 양식의 요소를 혼합한 절충적 역사주의 양식으로 지어졌다. 순환도로 전반에 걸쳐 수많은 공공, 사설 건축물이 들어섰다. 귀족들과 부유한 민간인들은 기념비적 역사주의 양식으로 지어진 대표 궁전 (순환도로 궁전)의 건설에 서두르기에 이르렀다."
 je_gaudi_ringstrasse_phase_1_goal: "#E 건설 진행도#!가 #BLUE 120점#! 도달. 현재 #G [GetGlobalVariable('gaudi_ringstrasse_progress').GetValue]#!점을 보유하고 있습니다. 보통 달마다 1점씩 획득합니다."
 je_gaudi_ringstrasse_phase_2: "빈 순환도로: 호포퍼와 노이에스 시청사"
 je_gaudi_ringstrasse_phase_2_reason: "빈 순환도로는 도시 요새를 철거한 자리에 장대한 대로를 건설하겠다는 결정이 내려진 지 10년 만에 개통이 이루어졌다. 그러나 이 시점에서도 도로 주변은 아직 공터로 뒤덮여 있었다. 이후 몇년 동안 진행된 대표적인 사업으로 대규모 오페라 하우스의 신축이 꼽혔는데 이는 훗날 빈 국립 오페라 극장이 되었다. 신 시청사 역시 이 시기에 지어진 것으로, 순환도로는 단순한 대로에서 궁전과 공공건축이 즐비한 빈의 새로운 중심지로 탈바꿈하게 되었다."
 je_gaudi_ringstrasse_phase_2_goal: "#E 건설 진행도#!가 #BLUE 120점#! 도달. 현재 #G [GetGlobalVariable('gaudi_ringstrasse_progress').GetValue]#!점을 보유하고 있습니다. 보통 달마다 1점씩 획득합니다."
 je_gaudi_ringstrasse_phase_3: "빈 순환도로: 대학교와 국립미술관"
 je_gaudi_ringstrasse_phase_3_reason: "순환도로는 이미 기업가와 은행가, 귀족들이 탐내는 거주지로 변모하였다. 중요한 위치에는 공공 건축이 자리잡아 제일 아름다운 모습으로 국가를 대표하고 있다. 그럼에도 완공을 위해서는 최종 건설 단계가 필요한데 이 단계에서는 신규 대학 건물 건설과 미술관의 건립이 최우선 과제로 남게 되었다."
 je_gaudi_ringstrasse_phase_3_goal: "#E 건설 진행도#!가 #BLUE 120점#! 도달. 현재 #G [GetGlobalVariable('gaudi_ringstrasse_progress').GetValue]#!점을 보유하고 있습니다. 보통 달마다 1점씩 획득합니다."
 je_gaudi_sagrada_phase_1: "사그라다 파밀리아: 안토니 가우디의 꿈"
 je_gaudi_sagrada_phase_1_reason: "안토니 가우디 이 코르네트는 스페인 카탈루냐의 건축가이자 디자이너로, 카탈루냐 모더니즘을 대표하는 거장으로 알려져 있다. 가우디의 작품은 대단히 개성적이고 독창적인 스타일을 지니고 있다. 1883년 가우디는 최근 출범한 바르셀로나의 성당 건설 사업에 참여하게 되었는데, 그 이름하여 '사그라다 파밀리아 대성당과 속죄사원'이었다. 가우디는 설계 초안을 완전히 바꾸고 자신만의 독특한 양식을 불어넣었다. 가우디는 사망할 때까지 이 사업에 전력을 다하였다. 수십년 동안 사그라다 파밀리아 성당은 미완성 상태로는 세계에서 가장 큰 가톨릭 성당으로 남아 있었다. 천재와 광기가 공존하는 세기의 프로젝트였던 것이다."
 je_gaudi_sagrada_phase_1_goal: "#E 건설 진행도#!가 #BLUE 120점#! 도달. 현재 #G [GetGlobalVariable('gaudi_sagrada_progress').GetValue]#!점을 보유하고 있습니다. 보통 달마다 1점씩 획득합니다."
 je_gaudi_sagrada_phase_2: "사그라다 파밀리아: 성당의 후진"
 je_gaudi_sagrada_phase_2_reason: "가우디는 델 비야르에 초안에 따라 시작됐던 지하 예배당 공사를 마무리하였는데, 궁륭(vault, 반원형 천장)의 경우 가우디의 수정을 거쳤다. 1880년대 중반에 실내에서 첫 예배가 거행되었고, 지하 예배당은 1889년에 완공되었다. 지하 예배당의 건설과 동시에 가우디는 성당의 설계를 기초부터 다시 수정하기 시작하였다. 1885년 고딕 양식의 언어로 된 새로운 전면 설계안을 선보였는데 여기에는 현재 계획보다 작은 규모이지만 18개의 탑이 눈에 띈다. 1893년 완공된 후진(apse) 외벽의 높이는 델 비야르의 설계보다 높다. 외벽에는 신고딕 양식 요소가 들어갔으나, 고딕 양식에 있어 본인 특유의 활용, 자연주의적인 가고일, 첨탑 끝부분에서 가우디의 특정이 드러난다."
 je_gaudi_sagrada_phase_2_goal: "#E 건설 진행도#!가 #BLUE 120점#! 도달. 현재 #G [GetGlobalVariable('gaudi_sagrada_progress').GetValue]#!점을 보유하고 있습니다. 보통 달마다 1점씩 획득합니다."
 je_gaudi_sagrada_phase_3: "사그라다 파밀리아 성당: 성탄 파사드"
 je_gaudi_sagrada_phase_3_reason: "예수의 탄생에 할애한 성탄 파사드(정면)는 인생의 일면들을 연상시키게 하는 장면들로 장식되어 있다. 가우디 고유의 자연주의 양식이 특색인 이 조각상들은 정교한 배치를 이룬 것은 물론, 자연에서 얻은 풍경과 화상으로 꾸며져 각자 고유의 상징성을 지니고 있다. 성탄 파사드는 북동쪽의 떠오르는 태양과 면해 있는데 이는 그리스도의 탄생을 상징한다. 총 세 개의 포르티코(현관 지붕)으로 나뉘어 있으며 각 현관은 신학적 덕목 (희망, 믿음, 관용)을 나타낸다. 관용의 현관에 달린 예수의 문 위에는 생명의 나무가 솟아 있다."
 je_gaudi_sagrada_phase_3_goal: "#E 건설 진행도#!가 #BLUE 120점#! 도달. 현재 #G [GetGlobalVariable('gaudi_sagrada_progress').GetValue]#!점을 보유하고 있습니다. 보통 달마다 1점씩 획득합니다."
 je_gaudi_sagrada_phase_4: "사그라다 파밀리아 성당: 본당"
 je_gaudi_sagrada_phase_4_reason: "성당의 평면 구조는 다섯 개의 측랑을 지닌 라틴 십자가형으로 되어 있다. 내부의 기둥은 가우디 특유의 설계로 되어 있다. 또한 하중을 지지하기 위해 뻗어 있으며, 다양한 기하학적 도형이 교차하면서 지속적으로 변화하는 표면을 만들어내고 있다. 가장 단순한 것은 정사각형 기단이며, 그 다음에는 팔각형으로, 십육각형으로, 마지막에는 원형으로 바뀌는 형태를 지녔다. 실내 표면은 평평한 것이 거의 없으며, 장식은 매끄러운 곡선과 뾰족한 점이 결합된 추상적 형태로 이루어진 것이 많아 풍부하고 다채롭다. 발코니와 계단 철제 난간 같은 세부에 있어서도 곡선적인 장식으로 가득차 있다."
 je_gaudi_sagrada_phase_4_goal: "#E 건설 진행도#!가 #BLUE 120점#! 도달. 현재 #G [GetGlobalVariable('gaudi_sagrada_progress').GetValue]#!점을 보유하고 있습니다. 보통 달마다 1점씩 획득합니다."
 je_gaudi_sagrada_phase_5: "사그라다 파밀리아 성당: 사도의 첨탑"
 je_gaudi_sagrada_phase_5_reason: "가우디의 원안에는 총 18개의 첨탑이 계획되어 있는데, 높이의 순서대로 열두 사도와 성모 마리아, 4복음서의 저자를 뜻하며 가장 높은 첨탑은 예수 그리스도를 상징한다. 이들 첨탑의 형태는 주교의 지팡이를 연상시키도록 의도된 것이며 길쭉한 수직의 홈이 나 있고, 화려한 색상에 동물이나 성스러운 상징, 성경 구절들로 장식되어 있다. 각각의 탑에는 해당 사도의 이름이 새겨진 조그만 황금 십자가가 달려 있다. 첨탑 중에는 얇은 돌다리로 연결된 것도 있다."
 je_gaudi_sagrada_phase_5_goal: "#E 건설 진행도#!가 #BLUE 120점#! 도달. 현재 #G [GetGlobalVariable('gaudi_sagrada_progress').GetValue]#!점을 보유하고 있습니다. 보통 달마다 1점씩 획득합니다."
 je_gaudi_sagrada_phase_6: "사그라다 파밀리아 성당: 수난 파사드"
 je_gaudi_sagrada_phase_6_reason: "화려하게 장식된 성탄 파사드(정면)과는 대조적으로 수난 파사드는 널찍한 맨돌로 지어져 소박하고 간결한 느낌을 주며, 해골의 뼈를 닮은 거친 직선으로 조각되어 있다. 그리스도의 수난, 즉 십자가에 못 박히던 시점의 예수가 겪는 수난에 할애되어 있으며, 인간의 죄를 표현하려는 의도에서 만들어진 파사드이다. 가우디는 수난 파사드를 통해 보는 이에게 두려움을 불러일으키고자 하였다. 아치는 끊고 기둥은 잘라냈으며, 어둡고 각진 그림자와 강렬하고 날카로운 빛의 대비, 즉 키아로스큐로 (명암법) 효과를 활용하여 그리스도의 희생이 얼마나 가혹하고 잔인한지를 한층 더 보여주고 있다. 태양이 지는 쪽을 면하도록 하여 그리스도의 죽음을 직접적으로 상징하는 수난 파사드는 여섯 개의 크고 경사진 기둥으로 지탱하고 있으며 긴장된 근육을 닮도록 설계되었다."
 je_gaudi_sagrada_phase_6_goal: "#E 건설 진행도#!가 #BLUE 120점#! 도달. 현재 #G [GetGlobalVariable('gaudi_sagrada_progress').GetValue]#!점을 보유하고 있습니다. 보통 달마다 1점씩 획득합니다."
 je_gaudi_sagrada_phase_7: "사그라다 파밀리아 성당: 교차랑"
 je_gaudi_sagrada_phase_7_reason: "장식 전반에 걸쳐 등장하는 주제는 전례에서 등장하는 단어다. 첨탑에는 '호산나' (Hosanna), '엑셀시스' (Excelsis), '상투스' (Sanctus) 같은 단어가 새겨져 있고, 수난 파사드의 정문에는 신약성경에서 발췌한 예수의 수난 일화가 카탈루냐어를 중심으로 여러 언어로 재현되어 있다. 영광 파사드에는 사도신경이 새겨져 있고, 정문에는 주기도문 전문이 카탈루냐어로 새겨져 있으며, '오늘 우리에게 일용할 양식을 주옵시고'라는 구문이 다양한 언어로 새겨져 있다. 세 개의 입구는 각각 믿음, 소망, 관용이라는 세가지 덕목을 상징한다. 이들 모두 예수 그리스도의 삶을 각각 나타내고 있다."
 je_gaudi_sagrada_phase_7_goal: "#E 건설 진행도#!가 #BLUE 120점#! 도달. 현재 #G [GetGlobalVariable('gaudi_sagrada_progress').GetValue]#!점을 보유하고 있습니다. 보통 달마다 1점씩 획득합니다."
 je_gaudi_sagrada_phase_8: "사그라다 파밀리아 성당: 성모와 사도의 첨탑"
 je_gaudi_sagrada_phase_8_reason: "사도의 첨탑은 각 사도의 옛 상징을 형상화한 조각이 서 있다. 성 누가는 날개 달린 황소, 성 마태오는 날개 달린 사람, 성 요한은 독수리, 성 마르코는 날개 달린 사자가 새겨져 있다. 탑의 꼭대기는 높이가 22.5m이며 세 가지 부분으로 구성되어 있다. 하단부는 육각형이 4열로 이루어져 있고 그 위에 '알렐루야', '아멘'이란 글자가 새겨져 있으며 그 주변을 오늬(헤링본) 모양의 야자잎 세라믹으로 둘러싸고 있다. 중앙부는 구와 이십면체가 서로 교차한 무늬에 세라믹으로 된 트렝카디스(도자 조각을 모자이크처럼 이어붙이는 기법)와 베네치아 유리로 덮여 있으며, 그 안에 조명 장치가 설치되어 있다. 그리고 상단부에는 날개가 달리고 각 사도의 이니셜이 새겨진, 복음서를 든 네 천사(사각 형상의 성모) 조각상이 세워져 있다. 후진에는 마리아의 탑이 서 있으며, 꼭대기에는 샛별을 상징하는 커다란 12각별이 달려 있다. 또한 성모 마리아를 상징하는 여러 도상학적 요소가 들어가 있는데, 예를 들어 성모송과 예수의 어머니를 상징하는 다양한 꽃으로 장식되어 있다."
 je_gaudi_sagrada_phase_8_goal: "#E 건설 진행도#!가 #BLUE 120점#! 도달. 현재 #G [GetGlobalVariable('gaudi_sagrada_progress').GetValue]#!점을 보유하고 있습니다. 보통 달마다 1점씩 획득합니다."
 je_gaudi_sagrada_phase_9: "사그라다 파밀리아 성당: 영광 파사드"
 je_gaudi_sagrada_phase_9_reason: "사그라다 파밀리아 성당에서 가장 크고 인상적인 파사드는 영광의 파사드다. 예수가 하늘로 올라가면서 맞이하는 영광에 헌정된 이 파사드는 신에게 이르는 과정에서 죽음과 최후의 신판, 그리고 영광을 상징하며, 지옥은 신의 뜻에서 벗어난 자들을 위한 곳이다. 영광의 포르티코(지붕형 현관)로 나아가려면 카예 데 마요르카 거리 위에 건설된 지하 통로 위로 큰 계단을 올라가야 하는데, 이 통로에도 지옥과 악을 묘사한 장식으로 꾸며져 있다. 악마와 우상, 거짓된 신, 이단과 분열 등이 묘사되며, 연옥과 죽음도 표현될 전망이다. 특히 죽음은 바닥의 무덤으로 묘사된다. 포르티코에는 성령의 은사를 상징하는 일곱 개의 큰 기둥이 있다. 기둥 아래쪽에는 칠죄종(七罪宗, 7대 죄악)이, 위쪽에는 칠주선(七主善, 7대 덕목)이 표현되어 있다."
 je_gaudi_sagrada_phase_9_goal: "#E 건설 진행도#!가 #BLUE 120점#! 도달. 현재 #G [GetGlobalVariable('gaudi_sagrada_progress').GetValue]#!점을 보유하고 있습니다. 보통 달마다 1점씩 획득합니다."
 je_gaudi_sagrada_phase_10: "사그라다 파밀리아 성당: 예수의 첨탑"
 je_gaudi_sagrada_phase_10_reason: "예수의 첨탑은 네 개의 다리를 통해 사도의 첨탑과 연결되어 있으며, 꼭대기에는 높이 13.5m의 여섯 팔이 달린 거대한 십자가가 세워져 있다. 십자가 중앙에는 어린양이 조각되어 있으며, '홀로 거룩하시고, 홀로 주님이시며, 홀로 높으시다'(Tu solus Sanctus, Tu solus Dominus, Tu solus Altissimus)는 글귀와 '아멘', '할렐루야'라는 단어가 새겨져 있다. 십자가의 네 팔마다 멀리서도 볼 수 있는 강한 빛줄기가 뻗어 나오는데, 이는 예수를 '나는 세상의 빛이니'라고 전했던 성경 구절(요한 8:12)을 상징한다. 예수의 탑 내부는 총 세가지 층으로 나뉘어 있으며, 각 층은 '내가 곧 길이요 진리요 생명이니'라는 예수의 말씀을 받들어 우주의 창조와 그리스도와 관련된 상징이 그려져 있다."
 je_gaudi_sagrada_phase_10_goal: "#E 건설 진행도#!가 #BLUE 120점#! 도달. 현재 #G [GetGlobalVariable('gaudi_sagrada_progress').GetValue]#!점을 보유하고 있습니다. 보통 달마다 1점씩 획득합니다."
 notification_gaudi_summer_palace_burned_notification_name: "이화원 소실"
 notification_gaudi_summer_palace_burned_notification_desc: "지난 한 세기 동안 중국 황제의 웅장한 거처였던 이화원은 [INITIATOR_COUNTRY.GetName]의 방화로 소실되었습니다."
 gaudi_dombau_phase_1_decision: "쾰른 대성당 공사 재개"
 gaudi_dombau_phase_1_decision_desc: "쾰른 대성당은 세계에서 가장 완벽한 고딕 성당으로 평가받고 있다. 13세기에 착공된 쾰른 대성당은 거대한 규모를 자랑하고 있다. 성가대 건물이 완공되고 한동안 진척을 보이지 못했던 공사는 15세기에 완전히 중단되고 말았다. 현재까지도 중세 후기에 쓰였던 건설용 크레인이 미완성된 남쪽 탑 위로 솟아 있는 모습이다. 독일 부르주아 계층 사이에서 민족주의와 낭만주의 감정이 부활하고, 무엇보다도 원본 건축 설계도가 다시 발견되었다는 소식이 널리 퍼지면서, 쾰른 대성당의 완공은 단순히 신의 영광을 위한 사업에 그칠 것이 아니라 독일 문화와 독일 민족의 통일을 상징한다는 인식이 생겨나기 시작하였다."
 gaudi_dombau_phase_2_decision: "쾰른 대성당의 남측 정면"
 gaudi_dombau_phase_2_decision_desc: "수년 간의 공사가 진행된 끝에 건축가들은 성당 남측 정면의 공사와 장식에 착수하게 되었다. 남측 정면은 풍부한 조각 장식을 갖추며 독일 조소의 정점일 뿐만 아니라 고딕 부활 건축의 대표작으로 손꼽히고 있다. 정면 하나에만 13년의 공사 시간이 소요되었고 장식하여 마무리하는 데에는 18년의 시간이 소요되었다."
 gaudi_dombau_phase_3_decision: "쾰른 대성당의 지붕 구조"
 gaudi_dombau_phase_3_decision_desc: "쾰른 대성당의 설계는 고딕 양식의 이상에 근간을 두었음에도 대표 시공사들이 당대 최신의 건축 자재를 사용하는 것을 막지는 못했다. 지붕 구조물은 철강으로 만들어졌으며 에펠탑이 지어지기 전까지 세계에서 가장 큰 철강 구조물로 등극하게 되었다. 이러한 결정 덕에 지붕 구조물은 제2차 세계 대전 시기 연합군의 폭격에 직면하였음에도 살아남을 수 있었다."
 gaudi_dombau_phase_4_decision: "쾰른 대성당의 서측 정면과 첨탑"
 gaudi_dombau_phase_4_decision_desc: "쾰른 대성당의 서측 정면은 지금까지 지어진 가장 큰 규모의 교회 정면이다. 이는 '정면 설계도 F'라고도 불리우는, 1370년 건축장인 미하엘 폰 사포이엔이 개발한 중세 시대 설계도를 세세히 따르고 있다. 쾰른 대성당의 실루엣을 이루는 특징은 두 개의 높이 솟은 첨탑이 자리한 쌍둥이탑 정면이다. 미하엘이 설계한 세공형 첨탑은 팔각형의 완전 개방형으로 되어 있으며, 그 꼭대기에 여러 층으로 된 장식물이 얹혀 있다. 고딕 건축가들은 이러한 설계를 통해 기술적으로 가능한 한계를 탐구하여, 쾰른 대성당이 동방박사 3인을 모신 '기념비적 성물함'으로서 강조되기를 바랐다."
 gaudi_gotthard_survey_decision: "고트하르트 철도의 계획과 측량"
 gaudi_gotthard_survey_decision_desc: "19세기 스위스는 국제 철도 수송으로부터 소외되어 근대 교통 체계는 물론 산업혁명과도 단절될 위험에 놓여 있었다. 브레너 고개를 지나는 철도가 개통되면서 이러한 위협은 새로운 국면을 맞게 된다. 지리적으로 스위스는 오스트리아보다 더 큰 문제에 직면하였는데, 브레너 고개가 스위스 내 우회로보다 훨씬 쉽게 통과할 수 있었기 때문이다. 스위스의 산악 철도 부설에 앞서 경로 선정과 예산조달에 관한 논의가 수십 년 동안 이어졌다. 취리히의 정치인이자 사업가였던 알프레트 에셔는 고트하르트 노선의 결정에 있어 핵심적인 인물로 나섰다."
 gaudi_gotthard_construction_decision: "고트하르트 철도 건설"
 gaudi_gotthard_construction_decision_desc: "고트하르트 철도의 건설은 19세기 최대 규모의 건설 사업으로 평가되며, 그 규모와 기술적 난관으로 따지면 수에즈 운하의 건설과 비견될 만하다. 처음부터 가장 핵심적이면서도 야심차게 기획되었던 구간은 고트하르트 산맥을 관통하는 터널의 구현이었다. 1882년 개통 당시 고트하르트 정상 터널은 15km의 길이로 세계에서 가장 긴 터널로 꼽혔다. 주로 철강으로 지어진 100여개의 크고 작은 교량은 이 구간의 또다른 야심찬 구간으로서 유럽 북부와 남부를 이을 뿐만 아니라 스위스 통일의 상징이기도 하다."
 gaudi_cristo_construction_decision: "구세주 그리스도상"
 gaudi_cristo_construction_decision_desc: "빈센트회 소속 페드루 마리아 보스 신부는 1850년대 중반 브라질의 섭정이자 페드루 2세 황제의 딸 이사벨 공주를 기리는 의미에서 코르코바두산에 기독교 조각상을 세우자고 처음 제안하였으나 이 계획은 승인되지 않았다. 1920년 리우데자네이루 가톨릭회에서 랜드마크 조각상을 세우자는 두번째 방안을 제시하였다. 현지 공학자 에이토르 다 시우바 코스타와 화가 카를루스 오즈와우드가 석상의 설계를 맡았으며, 프랑스 조각가 폴 란도스키가 실물로 제작하였다. 아르데코 양식의 조각상은 훗날 바로 옆에 있는 슈가로프산과 함께 리우데자네이루의 상징으로서 세계적인 명성을 얻게 되었다."
 gaudi_mole_phase_1_decision: "몰레 안토넬리아나: 유대교 회당에서 국가적 상징으로"
 gaudi_mole_phase_1_decision_desc: "몰레 안토넬리아나는 토리노의 건축가 알레산드로 안토넬리가 설계한 파빌리온 형태의 건물로서 높고 날카로운 첨탑이 돋보인다. 원래는 유대교 사회를 위한 시나고그(유대교 회당)으로 지어질 예정이었으나 건축가의 엄청난 야심으로 기존 계획을 넘어선 사업으로 나아가게 되었다. 이런 야심찬 시도에도 유대교 사회에서는 결국 추가 예산을 확보하지 못했다. 그러나 토리노 시민들은 대략적인 골조로도 충분히 인상적인 이 사업을 지역정부에서 인수하여 완공하고, 이탈리아 통일을 기리는 건물이 되어야 한다고 목소리를 냈다."
 gaudi_custom_tt_trigger_mole: "#yellow 이탈리아#!로 플레이"
 gaudi_mole_phase_2_decision: "몰레 안토넬리아나: 등실과 첨탑"
 gaudi_mole_phase_2_decision_desc: "안토넬리는 본인의 건축에 지속적인 변화를 가했는데, 예를 들어서 '템피에토'라 해서 신고전주의 양식의 육각 기둥이 두 층으로 구성된 회랑을 추가하여 기초적인 프로나오스 양식을 계승하였다. 안토넬리는 원래 첨탑 꼭대기에 오각형 별을 세우고자 하였으나 이후 날개 달린 정령 '제니오 알라토'의 동상을 대신 채택하였다. 이 동상의 제작은 안토넬리 사후 몇 개월 뒤 조각가 푸마갈리에게 의뢰되었다. 동상에는 양각과 금박을 입힌 구리 정령이 한 손에는 그릇을, 다른 손에는 야자나무 가지를 들고 있는 모습이었다. 머리에는 막대로 지지하는 조그만 오각형 별이 있었다. 1889년 4월 10일 이 별이 제자리에 설치되면서 몰레 안토넬리아나의 총높이는 167.5m에 달했고 당시 유럽에서 가장 높은 벽돌 건물로 등극하게 되었다."
 gaudi_ringstrasse_phase_1_decision: "빈 순환도로: 순환 도로의 제왕"
 gaudi_ringstrasse_phase_1_decision_desc: "빈 순환도로는 19세기 도시 성벽을 철거하고 난 뒤에 건설되었다. 1860년대부터 1890년대까지 순환도로를 따라 수많은 대형 공공 건축이 조성되었는데, 이들은 간혹 '링슈트라센슈틸'(Ringstraßenstil, 순환도로 양식)이라 불리우는 고전주의, 고딕, 르네상스, 바로크 건축 양식의 요소를 혼합한 절충적 역사주의 양식으로 지어졌다. 순환도로 전반에 걸쳐 수많은 공공, 사설 건축물이 들어섰다. 귀족들과 부유한 민간인들은 기념비적 역사주의 양식으로 지어진 대표 궁전 (순환도로 궁전)의 건설에 서두르기에 이르렀다."
 gaudi_ringstrasse_phase_2_decision: "빈 순환도로: 호포퍼와 노이에스 시청사"
 gaudi_ringstrasse_phase_2_decision_desc: "빈 순환도로는 도시 요새를 철거한 자리에 장대한 대로를 건설하겠다는 결정이 내려진 지 10년 만에 개통이 이루어졌다. 그러나 이 시점에서도 도로 주변은 아직 공터로 뒤덮여 있었다. 이후 몇년 동안 진행된 대표적인 사업으로 대규모 오페라 하우스의 신축이 꼽혔는데 이는 훗날 빈 국립 오페라 극장이 되었다. 신 시청사 역시 이 시기에 지어진 것으로, 순환도로는 단순한 대로에서 궁전과 공공건축이 즐비한 빈의 새로운 중심지로 탈바꿈하게 되었다."
 gaudi_ringstrasse_phase_3_decision: "빈 순환도로: 대학교와 국립미술관"
 gaudi_ringstrasse_phase_3_decision_desc: "순환도로는 이미 기업가와 은행가, 귀족들이 탐내는 거주지로 변모하였다. 중요한 위치에는 공공 건축이 자리잡아 제일 아름다운 모습으로 국가를 대표하고 있다. 그럼에도 완공을 위해서는 최종 건설 단계가 필요한데 이 단계에서는 신규 대학 건물 건설과 미술관의 건립이 최우선 과제로 남게 되었다."
 gaudi_custom_tt_trigger_ringstrasse: "#yellow 오스트리아#!로 플레이"
 gaudi_sagrada_phase_1_decision: "사그라다 파밀리아 성당: 안토니 가우디의 꿈"
 gaudi_sagrada_phase_1_decision_desc: "안토니 가우디 이 코르네트는 스페인 카탈루냐의 건축가이자 디자이너로, 카탈루냐 모더니즘을 대표하는 거장으로 알려져 있다. 가우디의 작품은 대단히 개성적이고 독창적인 스타일을 지니고 있다. 1883년 가우디는 최근 출범한 바르셀로나의 성당 건설 사업에 참여하게 되었는데, 그 이름하여 '사그라다 파밀리아 대성당과 속죄사원'이었다. 가우디는 설계 초안을 완전히 바꾸고 자신만의 독특한 양식을 불어넣었다. 가우디는 사망할 때까지 이 사업에 전력을 다하였다. 수십년 동안 사그라다 파밀리아 성당은 미완성 상태로는 세계에서 가장 큰 가톨릭 성당으로 남아 있었다. 천재와 광기가 공존하는 세기의 프로젝트였던 것이다."
 gaudi_sagrada_phase_2_decision: "사그라다 파밀리아 성당: 성당의 후진"
 gaudi_sagrada_phase_2_decision_desc: "가우디는 델 비야르에 초안에 따라 시작됐던 지하 예배당 공사를 마무리하였는데, 궁륭(vault, 반원형 천장)의 경우 가우디의 수정을 거쳤다. 1880년대 중반에 실내에서 첫 예배가 거행되었고, 지하 예배당은 1889년에 완공되었다. 지하 예배당의 건설과 동시에 가우디는 성당의 설계를 기초부터 다시 수정하기 시작하였다. 1885년 고딕 양식의 언어로 된 새로운 전면 설계안을 선보였는데 여기에는 현재 계획보다 작은 규모이지만 18개의 탑이 눈에 띈다. 1893년 완공된 후진(apse) 외벽의 높이는 델 비야르의 설계보다 높다. 외벽에는 신고딕 양식 요소가 들어갔으나, 고딕 양식에 있어 본인 특유의 활용, 자연주의적인 가고일, 첨탑 끝부분에서 가우디의 특정이 드러난다."
 gaudi_sagrada_phase_3_decision: "사그라다 파밀리아 성당: 성탄 파사드"
 gaudi_sagrada_phase_3_decision_desc: "예수의 탄생에 할애한 성탄 파사드(정면)는 인생의 일면들을 연상시키게 하는 장면들로 장식되어 있다. 가우디 고유의 자연주의 양식이 특색인 이 조각상들은 정교한 배치를 이룬 것은 물론, 자연에서 얻은 풍경과 화상으로 꾸며져 각자 고유의 상징성을 지니고 있다. 성탄 파사드는 북동쪽의 떠오르는 태양과 면해 있는데 이는 그리스도의 탄생을 상징한다. 총 세 개의 포르티코(현관 지붕)으로 나뉘어 있으며 각 현관은 신학적 덕목 (희망, 믿음, 관용)을 나타낸다. 관용의 현관에 달린 예수의 문 위에는 생명의 나무가 솟아 있다."
 gaudi_sagrada_phase_4_decision: "사그라다 파밀리아 성당: 본당"
 gaudi_sagrada_phase_4_decision_desc: "성당의 평면 구조는 다섯 개의 측랑을 지닌 라틴 십자가형으로 되어 있다. 내부의 기둥은 가우디 특유의 설계로 되어 있다. 또한 하중을 지지하기 위해 뻗어 있으며, 다양한 기하학적 도형이 교차하면서 지속적으로 변화하는 표면을 만들어내고 있다. 가장 단순한 것은 정사각형 기단이며, 그 다음에는 팔각형으로, 십육각형으로, 마지막에는 원형으로 바뀌는 형태를 지녔다. 실내 표면은 평평한 것이 거의 없으며, 장식은 매끄러운 곡선과 뾰족한 점이 결합된 추상적 형태로 이루어진 것이 많아 풍부하고 다채롭다. 발코니와 계단 철제 난간 같은 세부에 있어서도 곡선적인 장식으로 가득차 있다."
 gaudi_sagrada_phase_5_decision: "사그라다 파밀리아 성당: 사도의 첨탑"
 gaudi_sagrada_phase_5_decision_desc: "가우디의 원안에는 총 18개의 첨탑이 계획되어 있는데, 높이의 순서대로 열두 사도와 성모 마리아, 4복음서의 저자를 뜻하며 가장 높은 첨탑은 예수 그리스도를 상징한다. 이들 첨탑의 형태는 주교의 지팡이를 연상시키도록 의도된 것이며 길쭉한 수직의 홈이 나 있고, 화려한 색상에 동물이나 성스러운 상징, 성경 구절들로 장식되어 있다. 각각의 탑에는 해당 사도의 이름이 새겨진 조그만 황금 십자가가 달려 있다. 첨탑 중에는 얇은 돌다리로 연결된 것도 있다."
 gaudi_sagrada_phase_6_decision: "사그라다 파밀리아 성당: 수난 파사드"
 gaudi_sagrada_phase_6_decision_desc: "화려하게 장식된 성탄 파사드(정면)과는 대조적으로 수난 파사드는 널찍한 맨돌로 지어져 소박하고 간결한 느낌을 주며, 해골의 뼈를 닮은 거친 직선으로 조각되어 있다. 그리스도의 수난, 즉 십자가에 못 박히던 시점의 예수가 겪는 수난에 할애되어 있으며, 인간의 죄를 표현하려는 의도에서 만들어진 파사드이다. 가우디는 수난 파사드를 통해 보는 이에게 두려움을 불러일으키고자 하였다. 아치는 끊고 기둥은 잘라냈으며, 어둡고 각진 그림자와 강렬하고 날카로운 빛의 대비, 즉 키아로스큐로 (명암법) 효과를 활용하여 그리스도의 희생이 얼마나 가혹하고 잔인한지를 한층 더 보여주고 있다. 태양이 지는 쪽을 면하도록 하여 그리스도의 죽음을 직접적으로 상징하는 수난 파사드는 여섯 개의 크고 경사진 기둥으로 지탱하고 있으며 긴장된 근육을 닮도록 설계되었다."
 gaudi_sagrada_phase_7_decision: "사그라다 파밀리아 성당: 교차랑"
 gaudi_sagrada_phase_7_decision_desc: "장식 전반에 걸쳐 등장하는 주제는 전례에서 등장하는 단어다. 첨탑에는 '호산나' (Hosanna), '엑셀시스' (Excelsis), '상투스' (Sanctus) 같은 단어가 새겨져 있고, 수난 파사드의 정문에는 신약성경에서 발췌한 예수의 수난 일화가 카탈루냐어를 중심으로 여러 언어로 재현되어 있다. 영광 파사드에는 사도신경이 새겨져 있고, 정문에는 주기도문 전문이 카탈루냐어로 새겨져 있으며, '오늘 우리에게 일용할 양식을 주옵시고'라는 구문이 다양한 언어로 새겨져 있다. 세 개의 입구는 각각 믿음, 소망, 관용이라는 세가지 덕목을 상징한다. 이들 모두 예수 그리스도의 삶을 각각 나타내고 있다."
 gaudi_sagrada_phase_8_decision: "사그라다 파밀리아 성당: 성모와 사도의 첨탑"
 gaudi_sagrada_phase_8_decision_desc: "사도의 첨탑은 각 사도의 옛 상징을 형상화한 조각이 서 있다. 성 누가는 날개 달린 황소, 성 마태오는 날개 달린 사람, 성 요한은 독수리, 성 마르코는 날개 달린 사자가 새겨져 있다. 탑의 꼭대기는 높이가 22.5m이며 세 가지 부분으로 구성되어 있다. 하단부는 육각형이 4열로 이루어져 있고 그 위에 '알렐루야', '아멘'이란 글자가 새겨져 있으며 그 주변을 오늬(헤링본) 모양의 야자잎 세라믹으로 둘러싸고 있다. 중앙부는 구와 이십면체가 서로 교차한 무늬에 세라믹으로 된 트렝카디스(도자 조각을 모자이크처럼 이어붙이는 기법)와 베네치아 유리로 덮여 있으며, 그 안에 조명 장치가 설치되어 있다. 그리고 상단부에는 날개가 달리고 각 사도의 이니셜이 새겨진, 복음서를 든 네 천사(사각 형상의 성모) 조각상이 세워져 있다. 후진에는 마리아의 탑이 서 있으며, 꼭대기에는 샛별을 상징하는 커다란 12각별이 달려 있다. 또한 성모 마리아를 상징하는 여러 도상학적 요소가 들어가 있는데, 예를 들어 성모송과 예수의 어머니를 상징하는 다양한 꽃으로 장식되어 있다."
 gaudi_sagrada_phase_9_decision: "사그라다 파밀리아 성당: 영광 파사드"
 gaudi_sagrada_phase_9_decision_desc: "사그라다 파밀리아 성당에서 가장 크고 인상적인 파사드는 영광의 파사드다. 예수가 하늘로 올라가면서 맞이하는 영광에 헌정된 이 파사드는 신에게 이르는 과정에서 죽음과 최후의 신판, 그리고 영광을 상징하며, 지옥은 신의 뜻에서 벗어난 자들을 위한 곳이다. 영광의 포르티코(지붕형 현관)로 나아가려면 카예 데 마요르카 거리 위에 건설된 지하 통로 위로 큰 계단을 올라가야 하는데, 이 통로에도 지옥과 악을 묘사한 장식으로 꾸며져 있다. 악마와 우상, 거짓된 신, 이단과 분열 등이 묘사되며, 연옥과 죽음도 표현될 전망이다. 특히 죽음은 바닥의 무덤으로 묘사된다. 포르티코에는 성령의 은사를 상징하는 일곱 개의 큰 기둥이 있다. 기둥 아래쪽에는 칠죄종(七罪宗, 7대 죄악)이, 위쪽에는 칠주선(七主善, 7대 덕목)이 표현되어 있다."
 gaudi_sagrada_phase_10_decision: "사그라다 파밀리아 성당: 예수의 첨탑"
 gaudi_sagrada_phase_10_decision_desc: "예수의 첨탑은 네 개의 다리를 통해 사도의 첨탑과 연결되어 있으며, 꼭대기에는 높이 13.5m의 여섯 팔이 달린 거대한 십자가가 세워져 있다. 십자가 중앙에는 어린양이 조각되어 있으며, '홀로 거룩하시고, 홀로 주님이시며, 홀로 높으시다'(Tu solus Sanctus, Tu solus Dominus, Tu solus Altissimus)는 글귀와 '아멘', '할렐루야'라는 단어가 새겨져 있다. 십자가의 네 팔마다 멀리서도 볼 수 있는 강한 빛줄기가 뻗어 나오는데, 이는 예수를 '나는 세상의 빛이니'라고 전했던 성경 구절(요한 8:12)을 상징한다. 예수의 탑 내부는 총 세가지 층으로 나뉘어 있으며, 각 층은 '내가 곧 길이요 진리요 생명이니'라는 예수의 말씀을 받들어 우주의 창조와 그리스도와 관련된 상징이 그려져 있다."
 gaudi_sagrada_support_decision: "사그라다 파밀리아 성당 공사 지원"
 gaudi_sagrada_support_decision_desc: "사그라다 파밀리아 성당의 건설은 원래 기부금을 기반으로 시공 비용이 마련되고 있으나, 현행 헌법은 이러한 '기부금'을 보다 관대하게 해석하여 국민들이 건설사업을 지원하도록 장려하는 것을 허용하고 있습니다. 이것으로 매달 건설 점수가 1점씩 획득할 수 있습니다."
 gaudi_end_sagrada_support_decision: "사그라다 파밀리아 지원 중단"
 gaudi_end_sagrada_support_decision_desc: "사그라다 파밀리아의 건설 지원은 언제든 중단할 수 있지만, 과연 누가 정말로 그렇게 하겠습니까?"
 gaudi_activate_saxon_palace_decision: "작센 궁전 복원"
 gaudi_activate_saxon_palace_decision_desc: "바르샤바의 해방으로 폴란드 민족사에 새로운 장이 열렸다. 한때 베틴 왕조의 거처였으나 오랫동안 방치된 작센 궁전은 무명 용사를 기리는 기념비 등으로 제 모습을 되찾으려 한다."
 gaudi.31.t: "[SCOPE.sState('gaudi_art_deco_cinema_state').GetCityHubName]에 들어선 아르데코 영화관"
 gaudi.31.d: "오늘 모던 양식의 영화관이 새롭게 문을 열었다."
 gaudi.31.f: "아르데코 건축에서 가장 중요한 장르로 영화관이 꼽힙니다. 아르데코가 유행하던 시대는 유성 영화가 도래하던 시대, 웅장하고 화려하게 장식된 영화관의 시대와 맞물려 있습니다. 이러한 영화관 중 상당수가 지금도 남아 있으나, 내부가 여러 개의 소형 상영관으로 바뀐 곳도 많습니다. 가장 유명한 사례로는 캘리포니아 오클랜드에 있는 파라마운트 극장으로 4층 높이의 대형 로비에 27개의 출입구, 3,746개의 좌석을 자랑하고 있습니다."
 gaudi.31.g: "버스터 키튼 신작 아직 안 나왔소?"
 gaudi.32.t: "[SCOPE.sState('gaudi_art_deco_skyscraper_state').GetCityHubName]에 들어선 아르데코 마천루"
 gaudi.32.d: "쾌활한 장식, 기막힌 모자이크, 매력적인 형태. [SCOPE.sState('gaudi_art_deco_skyscraper_state').GetCityHubName]에 새로 들어선 마천루가 단순히 높다란 건물 이상의 가치를 더했다."
 gaudi.32.f: "아르데코 양식은 파리에서 비롯되었으나 그곳에서는 노트르담 대성당보다 높은 건물이 들어서는 안 된다는 규제가 존재했다. 단 하나의 예외가 있다면 바로 에펠탑이었다. 따라서 고층 건물의 건설에 곧바로 두각을 드러낸 것은 미국이었다. 1880년대 시카고에 보자르 양식이나 신고전주의 양식으로 된 최초의 마천루가 모습을 드러내기 시작하였다. 1920년대 뉴욕의 건축업자들은 크라이슬러 빌딩과 엠파이어 스테이트 빌딩 건설에 최신 아르데코 양식을 적용하였다. 엠파이어 스테이트 빌딩은 완공된 지 40년 동안 세계에서 가장 높은 건물의 지위를 유지하였다. 마천루의 내외부 장식은 고전 아르데코 양식으로서 기하학적 형태와 지그재그 무늬를 지녔다. 크라이슬러 빌딩의 경우 고딕 성당에서 볼 수 있는 고전 가고일 형상을 새로운 요소로 적용하였으며, 건물 가장자리에 크라이슬러 사의 방열기 장식을 따온 조각을 두었다."
 gaudi.32.g: "우아한 마천루일세."
 gaudi.33.t: "아르데코 공항"
 gaudi.33.d: "호화로운 아르데코 양식으로 된 공항이 새로 개항하여 전세계의 승객들을 맞이하고, 이제 막 도착한 외국인들에게 조국의 위대함을 보여주고 있다."
 gaudi.33.f: "새로운 세기로 넘어가던 시절 공항은 진보의 상징이었다. 오랫동안 인류가 도달할 수 없었던 이상의 영역이던 창공의 정복은 갑작스레 당연한 일상이 되었기 떄문이다. 비행사들은 경쟁에 나서 기록을 경신하고 전세계 한 바퀴를 도는 시도에 나섰다. 그들 스스로가 고대의 영웅의 이상이 최신 기술이 어우러진 모습이 되었던 것이다. 이와 동시에 여객기 또한 고위층의 상징으로 거듭났다. 화려함과 사치가 여객기에 녹아들었다. 아르데코 양식의 공항들은 이러한 소재들을 차용하여, 장식이나 거대한 규모로 승부하여 인상적인 풍경으로 바꿔놓았다."
 gaudi.33.g: "하워드 휴즈도 자랑스러워 할 테요."
 gaudi.34.t: "아르데코 청사"
 gaudi.34.d: "오늘 새로운 정부 청사가 준공되었다. 청사의 활기찬 정면 구성이 아르데코 양식의 환희를 제대로 보여주고 있었다."
 gaudi.34.f: "다른 무엇보다도 아르데코 양식은 상업용 건물, 증권 거래소, 영화관과 극장처럼 풍요와 사치를 상징하는 건물과 결부되어 있었다. 그러나 시간이 흐르면서 아르데코 양식은 국가 기관에도 확산되었다. 시청과 법원, 우체국 등의 정부 청사도 머지않아 같은 양식을 채택했던 것이다."
 gaudi.34.g: "볼품 없는 사무실은 이제 안녕이구나!"
 gaudi.50.t: "아르데코의 이상"
 gaudi.50.d: "[ROOT.GetCountry.GetName](은)는 근대적이고 고급스러운 건축의 빛나는 모범 국가로 떠올랐다. 전 세계가 우러러보는 위상에 등극한 것이다!"
 gaudi.50.f: "\"Tout sert au luxe, aux plaisirs de ce monde.\nO le bon temps que ce siecle de fer !\nLe superflu, chose tres necessaire,\nA reuni l’un et l’autre hemisphere.\n\n이런 사치와 쾌락을 일으키는 것들,\n이 철기 시대는 행복한 나날을 부르네\n필요하면서도 필요 없는 것들이 나타나고\n두 영역을 하나로 묶어 버렸네.\"\n- 볼테르의 〈세속인〉에서"
 gaudi.50.g: "이세계로의 황홀경일세!"
 gaudi.60.t: "이화원 방화"
 gaudi.60.d: "중국에서  우리 국민 몇 명이 포로로 잡혀 살해된 사건에 우리 군의 고위 장교들이 보복을 촉구하고 나섰다. 중국인이 우리 동포를 다시는 얕보아서는 안 될 것이다!"
 gaudi.60.f: "\"세상의 한 구석에 세계의 경이로움이 있었으니 그 이름하여 이화원이라 일컬었다. 예술에는 두 가지 원칙이 있는데 하나는 유럽 예술을 낳은 '이상', 다른 하나는 동양 예술을 낳은 '환상'이다. 환상 예술에서 이화원이 갖는 위상은 이상 예술에서 파르테논 신전이 지닌 위상과도 같았다. 마치 유럽 문명의 지평에 드리운 동양 문명의 실루엣처럼, 멀리서 희미하게 보이는 장대하면서도 알 수 없는 걸작과도 같았다.\n그런 경이로움이 자취를 감췄다.\n어느날 도적 둘이서 이화원에 침입했다. 한 명은 약탈하고 다른 한 명은 불을 질렀다. 승리의 여신은 도둑질하는 여자일지도 모르고, 혹은 그렇게 보일지 모른다. 이화원의 파괴는 두 승리자가 공모하여 이루어졌다. 한 승리자는 주머니를 채웠고, 그것을 본 다른 승리자는 자기 군장을 채웠다. 그리고 그들은 팔짱을 끼고 크게 웃으며 유럽으로 돌아왔다. 이것이 두 도적의 이야기다.\n우리 유럽인들은 문명인이고, 우리에게 중국인들은 야만인이다. 이것이 바로 문명이 야만에게 벌인 짓이다.\" - 빅토르 위고"
 gaudi.60.g: "불태워 버려라!"
 gaudi.60.h: "야만인이나 할 법한 발상이오."
 gaudi.61.t: "이화원 소실!"
 gaudi.61.d: "천하고금을 막론하고 야만스럽기 이를 데 없는 적군들이 청나라의 황궁을 약탈하고 이화원에 불을 질렀다!"
 gaudi.61.g: "실로 눈물만 하염없이 흐르는구나..."
 gaudi.62.t: "빅벤 방화"
 gaudi.62.d: "복수는 달콤하다."
 gaudi.62.f: "\"군중은 조용했고 오히려 즐거워하는 모습이었다. 바람이 불자 마치 그 바람을 더욱 부추기듯 한숨을 내쉬고 휘파람을 불었다. '상원에서 불길이 확 타오른다', '구빈법에 대한 천벌이군!', '법이라도 만드시나!' 하는 식의 외침이 주를 이뤘다. 안타까워하는 사람은 어디서도 볼 수 없었다.\" - 토머스 칼라일"
 gaudi.63.t: "웨스트민스터 궁전 소실!"
 gaudi.63.d: "세계사에 유례없는 야만적 행위로 적군이 영국 국회의사당을 습격하고 빅벤에 불을 질렀다!"
 gaudi.100.t: "잠들어 있는 거인"
 gaudi.100.d: "낭만주의 시대에 중세 시대를 이상으로 평가하게 되면서 쾰른 대성당의 완공을 국가적 과제로 여기는 사람들이 점점 더 많아지고 있다."
 gaudi.100.f: "1770년 요한 볼프강 폰 괴테는 스트라스부르의 고딕 성당에 매료되어, 낭만주의의 관점에서 고딕 건축 양식을 재조명하는 움직임을 촉발시켰다. 이후 평론가들 사이에서는 쾰른 대성당을 아직도 완성되기를 기다리는 하나의 예술 작품으로 칭송하였다. 급기야 1814년 가톨릭 언론인 조제프 괴레스가 쾰른 대성당은 국가적 성지로 칭송해야 마땅하며, 우리가 바라던 독일 민족 국가의 상징으로 만들어야 한다며 담론의 흐름을 바꿨다. 쾰른을 기반으로 활동한 미술상 쉴피즈 부아세레는 대성당 완공을 위한 지속적인 노력의 중심에 서 있었다. 부아세레의 노고는 1814년과 1816년 본인과 게오르크 몰러가 성당 정면 설계도를 재발견하면서 탄력을 얻게 되었다. 이 설계도는 1370년에 제작된 것으로 성당의 서쪽 정면을 바탕으로 하였다. 1821년~1831년 부아세레는 대성당의 완공 예상도를 담은 일련의 판화를 출판하였고, 독일 전역에 걸쳐 대성당 건설에 대한 열의를 크게 촉진시키는 계기가 되었다. 당시 진정한 독일 건축 양식으로 여겨졌던 고딕 양식의 낭만주의적 변형과 대성당을 독일의 국가 상징으로서 고정시키려는 여론은 마침내 프로이센 왕세자 프리드리히 빌헬름의 마음을 움직여 성당 건설 계획에 나서도록 하였다. 본래 쾰른에서 추진되던 성당의 완공 구상은 이제 프로이센과 독일 전역의 문제로 거듭났고 사상 처음으로 현실적인 선택지에 이르렀다."
 gaudi.100.g: "거대한 녀석이로군."
 gaudi.101.t: "시공 1단계 개시"
 gaudi.101.d: "오늘 쾰른 대성당이 두번째 초석이 성대한 기념식과 함께 제자리에 놓였다."
 gaudi.101.f: "1842년 9월 4일 프로이센 국왕 프리드리히 빌헬름 4세와 보좌주교이자 훗날 대주교가 되는 요하네스 폰 가이셀이 쾰른 대성당의 공사 재개를 기념하는 초석을 놓았다. 이 초석은 아직 완공되지 못한 남쪽 탑으로 옮겨져 그곳의 벽으로 쌓아올려졌다."
 gaudi.101.g: "새로운 시공 단계에 돌입하였군."
 gaudi.102.t: "시공 1단계 완료"
 gaudi.102.d: "쾰른 대성당의 시공 1단계가 마무리되었다."
 gaudi.102.f: "성당 완공에 앞서 초석이 놓인 지 6년 만에 본당과 교차랑의 양쪽 통로에 궁륭 천장이 올려졌으며 중앙 통로도 트리포리움 위로 쌓아올려졌다. 트리포리움 위로는 아래쪽이 개방된 지붕 트러스가 설치되어, 상층부 공사가 진행되는 동안에도 본당과 교차랑의 공간을 사용할 수 있게 하였다."
 gaudi.102.g: "이 대작을 계속해서 지어 봅시다."
 gaudi.103.t: "2차 시공 단계 개시"
 gaudi.103.d: "시공사 측에서 성당 남측 정면의 건설과 장식 공사에 들어갔다."
 gaudi.103.f: "중세 시대에 건축가들은 성가대석을 이미 완공하였으나 본당과 익랑은 방치하였다. 두 구역의 공사가 진행되면서 이제 긴 측면의 대형 정면 설계에 집중할 수 있게 되었으며, 그 결과 북측 정면은 남측 정면보다 단순하게 설계되었다."
 gaudi.104.t: "2차 시공 단계 완료"
 gaudi.104.d: "쾰른 대성당의 2차 시공 단계가 마무리되었다."
 gaudi.104.f: "남측 정면은 건축 총책임자 에른스트 프리드리히 츠비르너가 카를 프리드리히 신켈, 쉴피즈 부아세레, 프리드리히 빌헬름 4세 국왕과의 협의에 따라 설계하였다. 1842년부터 1855년까지 건설된 이 구역은 오늘날 신고딕 양식으로 지어진 가장 대표적이면서도 예술적으로 완벽한 작품으로 꼽힌다. 정면 좌측에는 우르줄라의 대문, 중앙에는 수난의 대문, 우측에는 게레온의 대문을 두었다."
 gaudi.105.t: "3차 시공 단계 개시"
 gaudi.105.d: "숱한 논란 끝에 우리 공학자들이 대성당 지붕 공사에 들어갔다."
 gaudi.105.f: "대성당 완공을 지지했던 여러 후원자들은 중세 시대에 완공된 대성당 구역에 존재하던 목재 지붕 트러스 구조를 고집하며 강경 반대로 돌아섰다. 이에 건축가 에른스트 프리드리히 츠비너는 지붕과 중앙 첨탑을 철골 구조로 건설하였다. 이런 현대적인 건축 공법을 채택한 배경에 대해 예산 절감과 하중 감소, 가연물량 감소 등의 장점을 꼽았기 때문이다."
 gaudi.106.t: "3차 시공 단계 완료"
 gaudi.106.d: "쾰른 대성당의 3차 시공 단계가 마무리되었다."
 gaudi.106.f: "1863년 첨탑 사이 구역을 제외한 본당과 익랑이 완공되었다. 수백 년 간 기존의 성가대석과 미완공 구역을 분리했던 임시 벽체를 철거할 수 있게 되면서, 대성당 내부의 거의 모든 부분을 처음으로 공개할 수 있었다."
 gaudi.107.t: "4차 시공 단계 개시"
 gaudi.107.d: "중세 후기 쾰른 대성당 남측 첨탑에 세워진 건설용 기중기가 도시의 상징으로 널리 여겨져 왔던 세월을 뒤로 하고 오늘 철거되었다."
 gaudi.107.f: "본당과 익랑이 완공된 이래 마침내 두 첨탑이 우뚝 섰다. 공사 당시 500명이 넘는 인력을 고용했던 공방 '돔바우휘테'(Dombauhütte)는 건설 현장 위 철로를 따라 이동하는 윈치 왜건이나 증기 기관 등의 첨단 건설 기술을 활용했다."
 gaudi.108.t: "쾰른 대성당 준공"
 gaudi.108.d: "오늘은 건축계와 독일 문화권에 있어 영광스러운 날이다. 쾰른 대성당이 수십년 간의 공사 끝에 마침내 준공에 이른 것이다. 진정 우리는 고딕 건축의 거장들을 능가하게 되었다!"
 gaudi.108.f: "대성당이 완공될 당시 두 첨탑의 높이는 157m로 세계에서 가장 높은 건축물로 등극하게 되었다. 비록 600년 전 중세 시대였던 1280년~1290년경에 작성된 정면 설계도를 공사 과정에서 거의 그대로 따랐지만 말이다. 중세 시대에 계획되었던 완공 후 쾰른 대성당의 높이를 넘어서게 된 것은 산업 시대의 산물인 에펠탑 뿐이었다."
 gaudi.108.g: "그 지위야말로 성당이 있을 자리다!"
 gaudi.109.t: "쾰른 상실!"
 gaudi.109.d: "라인란트 북부 지역을 상실하면서 쾰른 대성당의 건설을 지속할 기회도 영영 사라지게 되었다."
 gaudi.109.f: "어떤 이유에서건 라인란트를 상실하게 되더라도, 건설 진행도가 통째로 사라지는 것은 아닙니다. 주 문화가 독일인 다른 국가가 지난 건설 단계를 이어받아 성당 건설을 계속할 수 있습니다. 우리를 침략한 외국 세력은 성당 건설에 전혀 관심을 보이지 않을 것입니다."
 gaudi.109.g: "쾰른을 언제까지고 넘겨줄 순 없다!"
 gaudi.111.t: "저품질 자재"
 gaudi.111.d: "최근에 납품된 쾰른 대성당 건설 자재의 품질이 떨어지는 것으로 드러났다."
 gaudi.111.f: "1차 조사 결과 석재에 구멍이 뚫린 부분이 있는 것으로 드러났다. 건설 총책임자는 더 이상 논의할 것도 없이 해당 자재의 사용을 거부하였다. 이는 분명 공사 지연과 추가 공사비 발생으로 이어지겠지만, 결국엔 품질을 우선할 수밖에 없다. 한편 비용과 시간을 절약하기 위해서라도 석재를 사용해야 하며, 더 좋은 건축 자재를 남겨두는 게 아니라 남은 수익금을 좀 다른... 곳에 쓰자는 주장도 있다."
 gaudi.111.g: "비싼 가격에 품질이 따라오는 법."
 gaudi.111.h: "그 정도 가지고 누가 알아채겠나."
 gaudi.112.t: "부실 공사"
 gaudi.112.d: "저품질 자재를 사용한 결과가 여실히 드러나고 말았다. 오늘 아침 쾰른 대성당의 일부가 무너져 내려 상당한 피해를 입힌 것이다."
 gaudi.112.f: "쾰른 처치 이즈 폴링 다운,\n폴링 다운, 폴링 다운,\n쾰른 처치 이즈 폴링 다운,\n마이 페어 레이디!"
 gaudi.112.g: "누가 이럴 줄 예상이나 했겠는가?"
 gaudi.113.t: "건설 속도 향상"
 gaudi.113.d: "쾰른 대성당 공사가 예상보다 순조롭게 진행되고 있다. 완공 일정이 예정보다 몇 달 앞당겨질 것으로 전망된다."
 gaudi.113.f: "최신 기술, 빠른 작업 공정, 막힘없는 자재 보급, 온화한 날씨. 이 모두가 건설 속도에 유리하게 작용한다."
 gaudi.113.g: "예상했던 대로군!"
 gaudi.114.t: "사고"
 gaudi.114.d: "쾰른 대성당 건설 현장에서 끔찍한 사고가 일어났다. 인부 몇 명이 부상을 입고 사망자도 발생하고 말았다!"
 gaudi.114.f: "유감스럽게도 아무리 훌륭한 건축 규정을 적용하여도 사고를 막을 순 없다. 특히 자재가 몇 년이나 된 것이라면 더더욱 그러하다."
 gaudi.114.g: "어떻게 이런 비극이!"
 gaudi.115.t: "새로운 일자리"
 gaudi.115.d: "대성당 건설로 상당수의 인력이 쾰른에 유입되기에 이르렀다."
 gaudi.115.f: "중세 시대와 마찬가지로 쾰른 대성당의 건설은 도시 생활에 다양한 수요를 창출하게 되었으며, 그러한 수요는 새로운 노동력을 들여야 충족되는 경우가 많았다. 고용해야 할 인력은 건설 노동자만이 아니었다. 노동자들 역시 식당과 가게, 공급업체, 그리고 새로 지어질 숙소 등도 누군가가 건설해야 했기 때문이다. 이는 쾰른에 경기호황을 불러왔고 일부 시민들은 이번 호황에서 직간접적으로 이득을 얻기를 바랐다."
 gaudi.115.g: "거대한 사업에는 거대한 인력이 필요한 법."
 gaudi.116.t: "대성당을 향한 정치 갈등"
 gaudi.116.d: "쾰른 대성당의 완공에 모두가 동조하고 있는 것은 아니다. 노동조합 대표가 오늘 성당 공사를 두고 '헛짓거리'라며 공개적으로 혹평하고 나섰다."
 gaudi.116.f: "\"그리고 내가 여러분께 하나 묻겠소... 도대체 무엇이 국가를 이토록 참혹한 지출에 몰아넣고 있는가? 그것은 오로지 성직주의, 민족주의, 자본주의만을 부추길 뿐이오. 권력자들은 위신을 높이고, 부자들은 건설 사업에 참여하여 이윤을 늘리며, 프롤레타리아에게 미신과 낙후를 안기는 교회에서는 그런 반동적인 정책으로 힘을 얻고 있소. 허나 내가 하나 다시 묻겠소. 이토록 사치스럽고 낭비스러운 몽상의 전당을 짓는 사람은 누구인가? 그렇소, 바로 평범한 노동자요! 건설 현장에서 학대받고 불구가 되고 목숨을 잃는 평범한 노동자 말이오. 그 노동자에게 주어지는 유일한 보상은 있지도 않은 천국을 향한 희망뿐이외다. 이런 중세 시대의 대성당은 이 나라가 잘못 돌아가고 있음을 온전히 보여주고 있는 것이오!\""
 gaudi.116.g: "그래서 오늘 날씨가 어떻다고?"
 gaudi.116.h: "그 말도 일리는 있군."
 gaudi.117.t: "정치권의 대성당 건설 지지"
 gaudi.117.d: "애국심으로 가득 찬 소시민 대표가 오늘 쾰른 대성당의 건설을 지지하는 열정 넘치는 연설에 나섰다."
 gaudi.117.f: "\"여러분, 속좁고 질투 많은 반역자들의 반대는 들어주지 맙시다. 쾰른 대성당의 준공이 다가오는 지금, 우리나라는 지난날의 타락으로부터 벗어나 선조들의 발자취를 따르고 있습니다. 이런 거대한 사업을 벌인 나라가가 세상 어디에 또 있었습니까? 중세 시대의 성당을 건설하던 시절, 아니 피라미드를 짓던 시절로 거슬러 가야 하겠지요. 우리는 역사적인 순간에 발을 들이고 있습니다. 미래 세대는 이 거대한 탑을 올려다보며, 우리가 그때 올바른 결정을 내렸음을 기억할 것입니다. 대성당은 단순한 교회가 아니요, 기념비이자 앞으로 수십 년 수년 간 많은 독일인들에게 새로운 곳으로 나아가게 만드는, 영감 가득한 건물이올시다!\""
 gaudi.117.g: "옳소! 백번 지당한 말씀!"
 gaudi.117.h: "이번 연설을 기회로 지지의 폭을 한층 더 넓혀야겠다."
 gaudi.118.t: "국가적 사업인가, 종교적 사업인가"
 gaudi.118.d: "쾰른 대성당의 목적이 국가적 상징에 있는가, 아니면 종교적 상징에 있는가를 놓고 의회에서 진지한 토론이 벌어지고 있다."
 gaudi.118.f: "하나된 독일 민족으로서 쾰른 대성당의 중요성은 중세 건축을 완공하자는 논의가 시작된 초창기부터 중요하게 다루어졌다. 독일 민족에게 있어 중세 시대를 성찰의 시대로 여기는 시각이 많았는데, 잘리안 가문과 슈타우퍼 가문 치하의 신성 로마 제국이 독일의 전성기로 인식되었다는 점에서 더욱 그러하였다. 그러나 이를 기독교 정신을 변질시키는 것이라 보는 시각도 존재하였다. 어쨌든 쾰른 대성당은 한낱 교회에 불과한 것이 아니라 독일의 최상위급 주교가 머무는 본부에 해당되었기 때문이다. 쾰른에 기독교가 전래된 것은 고대 로마 제국 시절로 거슬러 올라가며, 신과 국가에 대한 문제는 화해보다는 분열을 초래하는 경우가 많았다."
 gaudi.118.g: "이것은 국가적 사업이다."
 gaudi.118.h: "이것은 국가적 시업인 동시에 종교적 사업이기도 하다."
 gaudi.118.i: "이것은 종교적 사업이다."
 gaudi.119.t: "대성당 건설 복권"
 gaudi.119.d: "대성당 건설 비용을 마련하기 위한 복권 사업이 올해 엄청난 수익을 거두면서, 건설 속도가 예상보다 한층 더 빨라지게 되었다."
 gaudi.119.f: "원래 건축 총괄을 맡은 츠비르너는 본당 완공에 들어가는 비용으로 120만 탈러, 익랑 완공에 다시 120만 탈러가 들어갈 것으로 추샇나였다. 이 계산값을 바탕으로 연간 건설비는 10만 탈러로 추산되었는데, 그 중의 절반은 프로이센 국왕이 건설 기금으로 충당하고자 하였다. 나머지 건설 비용을 마련하기 위해 '중앙 대성당 건설 협회' (Zentral-Dombau-Verein)가 쾰른에 출범하였으며, 처음에는 헌금을 통해 재원을 꾸려나갔다. 1863년 내부공사가 마무리될 당시 지금 같은 재원 조달 방식으로는 완공까지 50년이 걸릴 것으로 전망되었다. 이에 협회 측은 1864년 대성당 복권을 발행하기로 결정하였는데 이것으로 상당한 재원을 마련할 수 있었다. 전체 예산 가운데 대성당 건설 협회는 약 60%를 부담하였으며, 프로이센 정부에서 지원한 비중은 약 32%에 그쳤다."
 gaudi.119.g: "당첨이다!"
 gaudi.120.t: "[SCOPE.sCharacter('gaudi_ruler').GetFullName] [SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle]의 대성당 건설 지지"
 gaudi.120.d: "[SCOPE.sCharacter('gaudi_ruler').GetFullName] [SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle]께서 낭만주의 운동에 지대한 관심을 두고 있다. 이에 대성당 건설에 개인적으로 헌금하겠다는 뜻을 표하였다."
 gaudi.120.f: "역사적 관점에서 쾰른 대성당의 건설이 이루어질 수 있었던 것은, 신앙심 깊고 낭만주의에 빠져 있던 프리드리히 빌헬름 4세 국왕의 개인적인 지도력에도 다소 기인한 바가 없지 않다. 빌헬름 4세는 한평생 예술과 건축에 깊은 관심을 두고 있었다."
 gaudi.120.g: "[SCOPE.sCharacter('gaudi_ruler').GetFullName] [SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle] 만세!"
 gaudi.121.t: "내부 관람"
 gaudi.121.d: "쾰른 대성당은 아직 건설 중에 있지만 진척 속도가 놀랍다. 동맹국 한 곳을 초청해서 이 모든 광경을 보여줄 빌요가 있다."
 gaudi.121.f: "쾰른 대성당은 미완성 건물임에도 방문객들에게 큰 인상을 남기며 상상력을 자극하였다. 이는 쾰른 대성당이 수십 년 동안 공사 현장에 머물렀던 시절에도 마찬가지였다. 로베르트 슈만은 공사 현장을 보고 감명받아 교향곡 3번을 작곡하였고, 빅토리아 여왕도 방문 당시 대성당을 둘러보며 공사에 관한 설명을 들었다."
 gaudi.121.g: "우리 동맹국을 쾰른에 초청하자."
 gaudi.121.h: "공사에 방해만 될 뿐이오."
 gaudi.122.t: "쾰른 대성당에 헌금을?"
 gaudi.122.d: "우리 대사가 초청을 통해 쾰른 대성당 공사 현장을 둘러보게 되었다. 그 과정에서 깊은 감명을 받은 대사는 우리 정부 차원에서 대성당 공사에 헌금하여 국제적 위신을 확보할 것인지 문의해 왔다."
 gaudi.122.f: "쾰른 대성당은 미완성 건물임에도 방문객들에게 큰 인상을 남기며 상상력을 자극하였다. 이는 쾰른 대성당이 수십 년 동안 공사 현장에 머물렀던 시절에도 마찬가지였다. 로베르트 슈만은 공사 현장을 보고 감명받아 교향곡 3번을 작곡하였고, 빅토리아 여왕도 방문 당시 대성당을 둘러보며 공사에 관한 설명을 들었다."
 gaudi.122.g: "이런 찬란한 사업에 우리도 나서지 않을 수 없군."
 gaudi.122.h: "그렇게까지 나설 만한 건 못 되오."
 gaudi.123.t: "동맹국의 헌금"
 gaudi.123.d: "우리 동맹국의 대사가 공사 현장을 둘러본 뒤 큰 감명을 받고, 대성당 공사에 헌금하기로 결정하였다."
 gaudi.123.f: "쾰른 대성당은 미완성 건물임에도 방문객들에게 큰 인상을 남기며 상상력을 자극하였다. 이는 쾰른 대성당이 수십 년 동안 공사 현장에 머물렀던 시절에도 마찬가지였다. 로베르트 슈만은 공사 현장을 보고 감명받아 교향곡 3번을 작곡하였고, 빅토리아 여왕도 방문 당시 대성당을 둘러보며 공사에 관한 설명을 들었다."
 gaudi.123.g: "진정한 친구는 한눈에 알아보는 법."
 gaudi.124.t: "쾰른의 신형 기계"
 gaudi.124.d: "쾰른 대성당의 고된 건설 현장에 최신형 기계가 도입되어 공사 기간을 몇 달 정도 단축시켜 화제다."
 gaudi.124.f: "무엇보다도 증기기관의 활용은 대성당의 고층 구역으로 자재를 운반하는 데 큰 도움이 되었다. 허나 그밖에도 여러 기술적 발전을 통해 중세 시대보다 훨씬 효율적인 공사 환경을 조성하는데 한몫하고 있다."
 gaudi.124.g: "이것이 진보다!"
 gaudi.125.t: "철도로 운반되는 성당 석재"
 gaudi.125.d: "쾰른 일대 지역에 철도가 놓인 덕분에 대성당 공사도 몇 달 정도 단축되어 화제가 되고 있다."
 gaudi.125.f: "먼 옛날부터 건축 자재를 쾰른으로 운반하려면 라인강의 수운을 거쳐야 했다. 대량의 자재를 대성당의 도시로 운반하는 데 최적의 수단으로 남아 있었던 것이다. 그러나 철도 교통량의 증가로 비상시 운반 경로를 변경하거나 사람과 기계를 더욱 빠르게 수송하는 데에도 한몫하게 되었다."
 gaudi.126.t: "폭풍우 치는 날씨"
 gaudi.126.d: "쾰른에 폭풍우가 몰아쳐 건설 공사가 몇 주 동안 지연되고 있다."
 gaudi.126.f: "어젯밤 폭풍우가 쾰른을 강타했다. 강풍으로 방수포가 날아가고 비계를 넘어뜨려 가고일과 조각상을 파손시키고 말았다."
 gaudi.126.g: "혜성이라도 나타난 거라면 더 좋았을 것을."
 gaudi.127.t: "쾰른의 고고학 발굴 조사"
 gaudi.127.d: "쾰른을 방문한 [SCOPE.sCharacter('gaudi_archaeologist').GetFullName](이)가 쾰른 대성당이 고대 로마 시대의 유적 위에 들어선 정황을 발견하였다. 이에 당국에 발굴 허가를 요청한 상황이다."
 gaudi.127.f: "쾰른은 독일에서 가장 오래된 도시로서 로마 제국의 주요 식민 도시이기도 하였다. 고대 로마의 유산은 쾰른의 도시 의식 속에 깊이 스며들었는데, 이는 자치 공동체로서의 도시 구조 뿐만 아니라 기독교에서 성 베드로에 대한 언급과 '로마의 딸'이라는 면모에서도 드러난다. 도심부는 고대 로마의 유적 위에 세워진 것으로 밝혀졌으며, 일부 거리는 그 흔적을 고스란히 간직하고 있다. 허나 고밀도 개발로 인해 지금까지 아무도 발굴 작업에 나서지 못했다. 대성당 인근에서 발굴 작업을 진행한다면 공사에 상당한 차질을 빚겠지만, 고고학자들에게는 귀중한 경험을 제공할 수 있을 것이다."
 gaudi.127.g: "건설을 그렇게나 오랫동안 중단할 순 없는 노릇이오."
 gaudi.127.h: "고고학계에 있어 특별한 기회가 아닐 수 없군."
 gaudi.200.t: "알프레트 에셔의 등장"
 gaudi.200.d: "1849년 기업가 알프레트 에셔가 처음으로 스위스 국민의회 의장으로 선출되었다. 정치인이자 은행가로서 국내 대표 철도 회사를 이끌고 있으며 고트하르트 터널 구축 사업의 시공을 맡게 된 에셔는 스위스 역사상 가장 영향력 큰 인물로 거듭나게 된 것이다."
 gaudi.200.f: "요한 하인리히 알프레트 에셔 폼 글라스, 줄여서 알프레트 에셔는 스위스의 정치인이자 재계 대표, 철도 사업가이다. 스위스 북동부 철도, 스위스 연방 공과대학, 스위스 신용은행, 스위스 생명보험, 연금공단, 고트하르트 철도회사 등 수많은 정치기관을 거쳐 창립과 주관 업무를 거듭해온 에셔는 19세기 스위스의 정치와 경제 발전에 그 누구보다도 엄청난 영향력을 이끈 인물로 기록되었다."
 gaudi.200.g: "누구보다 스위스를 위해 일할 사람이로군."
 gaudi.200.h: "이 자는 너무 위험해."
 gaudi.201.t: "알프레트 에셔의 실각"
 gaudi.201.d: "알프레트 에셔에게 있어 고트하르트 철도의 건설은 능력 밖의 부담으로 작용한 모양이다. 에셔의 정적들은 이 기회로 말미암아 스위스 신용은행 총재직을 사퇴하도록 촉구하고, 나아가 고트하르트 철도회사의 회장직에서 물러나도록 하였다."
 gaudi.201.f: "무수한 국영 기관 활동과 스위스 북동부 철도, 스위스 신용은행으로 대표되는 사업 기반 마련으로 알프레트 에셔는 막강한 권력을 쥐게 되어 '알프레트 1세'라는 별명을 얻을 정도였다. 이런 패권은 현장에서 비판의 목소리가 나오게 만드는 원인이 되었다. 특히 당시 스위스에서는 정치 사안에 있어 국민의 발언권 확대를 요구하는 민주화 운동이 일었는데, 알프레트 에셔를 중심으로 한 기득권 정치 집단, 즉 '에셔 체제'는 민주화 운동의 공공연한 적이 되었다. 운동 세력은 전단 배포와 민중 집회를 통해 체제에 맞선 저항 운동을 벌였고, 1870년대에는 스위스 북동부 철도 회사가 심각한 재정난에 빠지면서 상황이 더욱 어려워졌다."
 gaudi.201.g: "몰락이 임박한 것인가?"
 gaudi.202.t: "알프레트 에셔의 죽음"
 gaudi.202.d: "19세기 스위스에 가장 큰 영향력을 행사안 인물로 불리우는 알프레트 에셔가 오늘 세상을 떠났다."
 gaudi.202.f: "에셔는 개인적인 공격 외에도 건강 문제에 시달려야 했다. 평생 동안 끊임없이 앓아 누워야 했으며 회복하는 데 오랜 시간을 보내야 했다. 평소 병약한 체질은 과중한 업무와 공존할 수 없었다. 고트하르트 철도 사업의 중대한 시기에는 과로로 쓰러져 죽을 지경에 이르기도 했다. 이후에도 천식과 고열, 안구질환, 종기 등 건강 문제가 끊이질 않았다. 그러나 이러한 어려움 속에서도 에셔는 정계와 재계에서 최대한 제 임무를 다했다. 1882년 11월 말, 다시 중병에 걸린 에셔는 12월 6일 아침 본인 소유의 '벨부아 저택'에서 세상을 떠났다."
 gaudi.202.g: "에셔야말로 스위스를 근대화의 길로 이끈 사람이었다."
 gaudi.211.t: "고트하르트 철도의 계획 수립"
 gaudi.211.d: "우리 정부는 고트하르트 철도 사업 계획 수립에 나섰다. 토지 측량과 노선 확정은 물론, 해외 투자자 물색과 회사 설립을 통한 재정 지원의 확보에도 착수하였다."
 gaudi.211.f: "1852년 연방 철도청장 고틀리프 콜러는 고트하르트 산맥을 관통하는 최초의 철도 노선을 처음 제시하였으며 1853년 8월 19일에는 스위스 9주로 이루어진 최초의 고트하르트 건설위원회가 출범하였다. 기술진으로 나선 콜러는 플뤼렌에서 랑겐 호수로 이어지는 구간의 첫 사업 구상에 나섰다. 1861년 스위스 공학자 카스파르 베틀리가 에르스트펠트에서 루가노까지의 구간을 단 5개월 만에 측량하여, 오늘날까지 측량 기술의 전설로 높이 평가받고 있다."
 gaudi.211.g: "막중한 사업이로군."
 gaudi.212.t: "계획 수립 완료"
 gaudi.212.d: "고트하르트 철도 건설 계획의 수립과 준비가 마무리되었다. 적절한 필수 요건만 갖춘다면 건설을 승인할 수 있을 것으로 전망된다."
 gaudi.212.f: "노선 설정 문제를 놓고 고트하르트 산맥을 넘어가자는 쪽과 루크마니에와 스풀뤼겐 고개로 분기할 것을 지지하는 쪽으로 격한 논쟁이 벌어진 이래, 1863년 공학자 베틀리와 콜러가 고트하르트 산맥 아래에 터널을 뚫자는 구상이 처음으로 제기되었다. 그리고 취리히에 본사를 둔 스위스 북동부 철도의 알프레트 에셔 회장이 고트하르트를 넘어가는 노선을 승인하면서 결론이 내려졌다. 여기에는 고트하르트를 횡단하는 노선이 최단 거리 노선이기 때문인 것도 있었다. 에셔는 \"스위스와 인접국의 철도망 설계를 고려하면 그라우뷘덴의 알프스 고개를 넘는 철도보다는 고트하르트를 횡단하는 철도가 취리히와 북동부 철도 회사의 이익에 훨씬 더 유리할 것이라 오래토록 확신하는 바이다\"라고 말했다."
 gaudi.212.g: "시작이 반이다..."
 gaudi.213.t: "고트하르트 철도 건설"
 gaudi.213.d: "고트하르트 산맥에서 철도 공사가 시작되었다. 북쪽으로는 괴슈넨에서, 남쪽으로는 아이롤로 인근에서 굴착이 시작된 것이다. 고트하르트 철도 회사는 수천 명의 인부를 동원하고 있으며 이들 대다수는 이탈리아 출신이다."
 gaudi.213.f: "After an extremely short submission period of six weeks, seven offers for the construction of the Gotthard tunnel were received. The Geneva company 'Entreprise du Grand Tunnel du Gothard' of Louis Favre was awarded the contract. The biggest competitor was the Italian company 'Società Italiana di Lavori Pubblici' headed by Severino Grattoni. Grattoni had already built the world's longest tunnel, the Mont Cenis railway tunnel, at 12 kilometers. He had also dealt with the Gotthard, had examined the geology and carried out test drilling. Favre, who had never built a tunnel longer than 1,000 meters, undercut his fellow competitors, accepted the ruinous terms of the contract and posted a deposit of CHF 8 million. He promised a construction period of eight years - a risky undertaking in view of the unknown geology."
 gaudi.213.g: "이런 역사적인 사업을 맡게 되다니 파브르는 행운아가 틀림없소."
 gaudi.214.t: "고트하르트 철도 완공!"
 gaudi.214.d: "Today is a big day for our country: with the completion of the Gotthard railway, not only Northern and Southern Europe were connected, but also Switzerland became a crossroads for international rail traffic."
 gaudi.214.f: "'Basically, I hate the mountains because they are cold and eat away pieces of the sky, i.e. the ball of light, and reduce the horizon. My favorite fantasy now is to blow up the Gotthard with all the Alps with dynamite on the other side, to the north, so that we could get Italian air directly.' - Carl Spitteler"
 gaudi.214.g: "고트하르트 철도 만세!"
 gaudi.219.t: "스위스 동부 상실!"
 gaudi.219.d: "스위스 동부 지역을 상실하면서 고트하르트 철도의 건설을 지속할 기회도 영영 사라지게 되었다."
 gaudi.219.f: "어떤 이유에서건 스위스 동부를 상실하게 되더라도, 건설 진행도가 통째로 사라지는 것은 아닙니다. 다른 국가가 지난 건설 단계를 이어받아 건설을 계속할 수 있습니다."
 gaudi.219.g: "스위스 동부를 언제까지고 넘겨줄 순 없다!"
 gaudi.221.t: "Credit from Italy"
 gaudi.221.d: "Alfred Escher has met a number of Italian businessmen in Milan who want to invest in the construction of the Gotthard railway and have good connections with the government."
 gaudi.221.f: "The construction costs of the route network of the future Gotthard railway company were estimated at 187 million Swiss francs before construction began. The largest part (54.55%) of the funds had to be raised from the international capital market, Italy subsidized 24.05%, Germany and Switzerland 10.7% each. A finance consortium led by German banks was set up to raise the CHF 102 million on the capital market. It consisted of a German, Italian and Swiss group, each of whom had to raise CHF 34 million."
 gaudi.221.g: "어떤 도움이라도 고맙소."
 gaudi.221.h: "We don't need help from foreigners."
 gaudi.222.t: "Credit from Germany"
 gaudi.222.d: "Alfred Escher has met a number of German businessmen who wish to invest in the construction of the Gotthard railway and who are on good terms with the government."
 gaudi.222.f: "The construction costs of the route network of the future Gotthard railway company were estimated at 187 million Swiss francs before construction began. The largest part (54.55%) of the funds had to be raised from the international capital market, Italy subsidized 24.05%, Germany and Switzerland 10.7% each. A finance consortium led by German banks was set up to raise the CHF 102 million on the capital market. It consisted of a German, Italian and Swiss group, each of whom had to raise CHF 34 million."
 gaudi.223.t: "Gotthardbahn-Gesellschaft"
 gaudi.223.d: "With the founding of the Gotthard Railway Company (Gotthardbahn-Gesellschaft), an important step was taken towards the realization of this ambitious project."
 gaudi.223.f: "The Gotthard Railway Company was founded in Lucerne as a stock corporation to build and operate the Gotthard Railway. The political decisions and negotiations for the financing of the Gotthard railway in the run-up to the founding of the Gotthard railway company and its management in the early days of construction were essentially made by the former President of the Government Council of the Canton of Zurich and later three-time President of the National Council, Dr. Alfred Escher coined. After the financing of the Gotthard project had been secured almost exclusively by state subsidies from Switzerland, its cantons and from 1869 by Italy, the North German Confederation and its legal successor from 1871 the German Reich, the Gotthard Railway Company was founded from the Gotthard Association, which transferred its rights to the Gotthard Railway Company. Alfred Escher became its president and Joseph Zingg its vice president. The company then tackled the actual construction of the Gotthard railway."
 gaudi.231.t: "Water ingress in the tunnel"
 gaudi.231.d: "Water ingress in the Gotthard tunnel threatens construction progress and the lives of the workers."
 gaudi.231.f: "The different rock layers in the Gotthard massif repeatedly caused problems. Sometimes sandy foundations alternated with impenetrable rock - and in rare, but all the more dangerous cases, water or a rocky pulp penetrated the tunnel, which became fatal for some workers."
 gaudi.231.g: "Do what is necessary to seal the site, safety first."
 gaudi.231.h: "Pay the workers extra hours to fix the rift, but be careful."
 gaudi.231.i: "Plug the hole at all costs and keep working - regardless of the losses!"
 gaudi.232.t: "Viaduct stress test"
 gaudi.232.d: "The construction management is unsure whether the many stress tests that we carry out on the numerous viaducts are really necessary in this number, as they take up material and time."
 gaudi.232.f: "Given the time pressure to complete the Gotthard Railway, not all projects can enjoy the same level of attention. For example, some engineers consider the multiple load tests on one of our viaducts to be unnecessary - the structure is strong enough. However, some of our consultants insist on not stopping testing prematurely, as damage could set our work back months and tarnish our reputation."
 gaudi.232.g: "We should do an extra test."
 gaudi.232.h: "I have no concerns that this viaduct will be unstable."
 gaudi.233.t: "Viaduct collapses!"
 gaudi.233.d: "One of our viaducts collapsed today. Apparently it wasn't as safe as we thought."
 gaudi.233.f: "How dare you damage the reputation of Swiss precision and thoroughness like that?"
 gaudi.233.g: "I said right away that we should have done a stress test!"
 gaudi.234.t: "More work breaks"
 gaudi.234.d: "Gotthard tunnel workers find their shifts too long and their breaks too short."
 gaudi.234.f: "Apart from the risky work in the Gotthard tunnel, the very poor air circulation caused problems. The interior of the earth also heated up to more than 33 degrees (and in rare cases: to 40 degrees) inside the tunnel. Nevertheless, the workers had to carry out their arduous and sweaty work for more than 8 hours a day."
 gaudi.234.g: "A break? Bah! Those lazy Italians don't even know what work is!"
 gaudi.234.h: "A little break, nothing more."
 gaudi.234.i: "Give them a bonus instead of a break."
 gaudi.234.j: "They deserve regular breaks."
 gaudi.235.t: "Dizziness underground"
 gaudi.235.d: "The poor air quality in the Gotthard tunnel has gotten so bad that some workers have collapsed from dizziness."
 gaudi.235.f: "The air quality in the Gotthard reaches an alarmingly low level. The dust thrown up by the pickaxes and machines has a part in it; however, the dynamite does the rest. Far too often workers are sent back into the tunnel before the smoke from the blasts has cleared. One of our wardens wanted to urge the lazy bunch back to work, but succumbed to an unfortunate cardiovascular problem on the way inside the tunnel."
 gaudi.235.g: "That is unfortunate. Now continue working!"
 gaudi.235.h: "Give the workers a greater incentive to risk their lives..."
 gaudi.235.i: "Introduce shorter shift changes."
 gaudi.236.t: "터무니없이 비싼 가격"
 gaudi.236.d: "Our pricing policy for food, clothing and other necessities has been heavily criticized by the workers of the Gotthard tunnel."
 gaudi.236.f: "A maximum of 1645 workers worked in Göschenen and 1302 in Airolo, mostly Italians from the poor rural areas of Piedmont and Lombardy. The miners and workers lived in dirty and overcrowded shacks and were financially exploited. A miner earned around 3.90 francs in an eight-hour shift. Two thirds of this wage was deducted for food and accommodation, the lamps and the oil for them - 30 centimes a day - they had to pay for themselves. They were also deducted five francs a month for their clothing and two francs for their residence permit in Switzerland. Part of the earnings were paid out in coupons that could only be redeemed in the company's own shops."
 gaudi.236.g: "No one is forced to work on this project. Everyone is free to go!"
 gaudi.236.h: "We exploit them and pay them with their own money to make them work overtime - a splendid idea!"
 gaudi.236.i: "Ban this unethical business!"
 gaudi.237.t: "Dirty shacks"
 gaudi.237.d: "The misery in the workers' huts at the Gotthard tunnel has grown to such an extent that the railway construction managers are very concerned that a revolt could be imminent."
 gaudi.237.f: "'I found the situation in Göschenen little changed; the Favre apartments are satisfactory, but to an extremely insufficient extent, the private apartments of the citizens are partly good, partly tolerable, partly bad; the workers' barracks, built on speculation and rented out, are as scandalous as before, especially in the large house next to the post office, inhabited by 240 people; there castings ran down the outer walls and they lay in heaps in corridors and in corners; the rooms and their furniture are streaked with dirt, the windows are tightly shut, the air is abominable, actually worse than in most pigsties, which have gates and vents. A water pipe was dutifully built, but in such a way that it froze and ripped, didn't deliver anything all winter and is still out of order, although it hasn't been seriously freezing for weeks.'"
 gaudi.237.g: "To each his own."
 gaudi.237.h: "If they don't like it so badly in their houses - they should work more."
 gaudi.237.i: "These outrageous conditions should be abolished immediately in a civilized country like ours!"
 gaudi.238.t: "Burried alive"
 gaudi.238.d: "A serious accident has happened in the Gotthard tunnel. Several workers were buried under rubble. Their chances of survival are unknown."
 gaudi.238.f: "199 workers died during the construction work on the Gotthard Tunnel. Of the 171 dead mentioned in the accident list in the Federal Archives, 53 workers were crushed by wagons or locomotives, 49 were struck by rocks, and 46 were killed by dynamite. 23 perished in other ways, one of them drowned. According to official statements, the culprit was either chance or the casualty himself. Numerous other men died over the course of the following years as a result of malnutrition, illnesses and injuries sustained during tunnel construction."
 gaudi.238.g: "Unfortunately, that's the risk with this job. Keep digging!"
 gaudi.238.h: "We can not do anything for them. Implement better rules for the future."
 gaudi.238.i: "Do whatever you can to save these poor souls!"
 gaudi.239.t: "New machines in the tunnel"
 gaudi.239.d: "The introduction of new technologies has significantly accelerated our progress in the construction of the Gotthard tunnel."
 gaudi.239.f: "The building contractor Louis Favre took over the first drilling machines of the Sommeiller type from the Mont-Cenis tunnel. To do this, he tested the most important available impact drills on site. The two workshop bosses in Airolo and Göschenen further developed the existing machines: The machines should be less prone to repairs and the impact drills should be equipped with an automatic drive. Seguin and Ferroux, the two workshop managers, were able to make significant progress: at the beginning, three machines had to be replaced every day, towards the end of construction only one machine every three days. At the same time, the exhaust air from the pneumatic percussion drills served to sparingly ventilate the tunnel. Six drilling machines were mounted on carriages. The machines drilled holes about a meter deep, which were then filled with dynamite and blown up."
 gaudi.239.g: "Cheers to progress!"
 gaudi.240.t: "Trade unions criticize Gotthard project"
 gaudi.240.d: "A trade union leader in Parliament today lamented the appalling conditions under which the Gotthard tunnel is being built."
 gaudi.240.f: "Water spills every day, work in a blast furnace heat, miserable housing, exorbitant prices, and a cheap wage of less than 4 francs a day! There are numerous dogs in our country who live better than the hundreds of workers who risk their lives for the profit of a railway company; before being blown to bits by a load of dynamite on an unlucky day. I thought gone were the days when a landowner could push his peasants around like cattle? What is happening in Göschenen and Airolo seems far worse! If something doesn't change urgently, then I promise you that the situation will escalate!'"
 gaudi.240.g: "Doesn't this man understand the importance of our project?"
 gaudi.240.h: "Some reforms may actually be necessary."
 gaudi.241.t: "Escher donates money"
 gaudi.241.d: "Alfred Escher, to whom the construction of the Gotthard railway is a personal concern, used his equity today to advance the construction of the line."
 gaudi.241.f: "Escher not only accompanied the Gotthard project from its inception to its completion; he also personally sacrificed himself for it. It wasn't just about the financial part. He was accused of literally working himself to death for the Gotthard Railway."
 gaudi.241.g: "Thanks, Mr. Escher."
 gaudi.242.t: "다공질 암석"
 gaudi.242.d: "공사 현장의 암질이 굉장히 연한 탓에 고트하르트 터널 공사가 예상보다 훨씬 빠른 진척을 보이게 되었다."
 gaudi.242.f: "고트하르트 터널 공사 과정에서는 헤아릴 수 없을 정도로 많은 요인으로 대개 좋지 않는 효과를 불러오는 경우와 더불어 예상치 못한 쾌재도 있었다."
 gaudi.242.g: "아주 훌륭해!"
 gaudi.243.t: "도무지 뚫을 수 없는 암석"
 gaudi.243.d: "공사 현장의 암질이 상당히 단단한 탓에 고트하르트 터널 공사가 예상보다 훨씬 느린 진척을 보이게 되었다."
 gaudi.243.f: "현장 관리단이 계속해서 변화하는 암질 때문에 여러 문제에 직면하였다. 공사가 시작될 당시 기술진들은 고트하르트 산맥의 복잡한 암반 지형에 제대로 대비하지 못했다. 이런 예기치 못한 문제들을 헤쳐나갈 수 있었던 것은 시간이 다소 지난 뒤였다. 수석 공학자 로베르트 게르비히는 독일 광산 기술자 프리드리히 모리츠 슈타프에게 공사 현장의 지질 조사를 일임하였다. 슈타프는 처음에는 아이롤로의 공사 구간에 배치되었으며, 이후 아이롤로 중앙 건설 관리단의 지질 굴착 부서장으로 임명되었다. 슈타프가 맡은 것은 기존 지질현황도를 고쳐 나가고, 온도와 지하수의 유입, 암반 상태 등의 지질 환경을 관찰하여 공사가 지연되지 않도록 하는 것이었다. 슈타프는 터널 축을 따라 모든 암반층을 기록하고 각 암반층마다 자료를 수집하였다."
 gaudi.243.g: "시간이 걸리더라도 제대로 해야 한다."
 gaudi.243.h: "전 근로자는 초과 근무에 나서도록!"
 gaudi.243.i: "대학에서 전문가를 초빙해 장기적인 해결책을 모색해 보자."
 gaudi.244.t: "엄청난 폭약"
 gaudi.244.d: "고트하르트 터널 공사의 영구 납품 업체로 국내의 한 다이너마이트 공장이 선정되었다. 이것으로 터널 사업부와 회사 측 모두가 동등한 이익을 보게 되었다."
 gaudi.244.f: "공사 과정에서 폭약 수요가 막대한 관계로, 루체른 호수 인근에 터널 전용 폭약 공장이 별도로 세워지게 되었다."
 gaudi.244.g: "안전 점검은 제대로 했겠지?"
 gaudi.245.t: "노동자 유입"
 gaudi.245.d: "고트하르트 철도 건설 현장에서 일거리를 구하기 위해 스위스 동부에 점점 더 많은 노동자가 모여들고 있다."
 gaudi.245.f: "고트하르트 철도 건설 사업이 지금껏 근 10년에 걸친 기간 동안 5천 명이 넘는 노동자를 동원해 왔다."
 gaudi.245.g: "그 모두에게 삽을 들라 하세. 일손 하나가 소중하다."
 gaudi.245.h: "더 오랜 기간 동안 머물도록 이곳에 정착하게 만들자."
 gaudi.246.t: "신규 외국 투자자"
 gaudi.246.d: "알프레트 에셔가 고트하르트 사업에 새로운 자본을 조달할 수 있는, 또 하나의 부유한 외국 투자자를 유치하는 데 성공하였다. "
 gaudi.246.f: "수년에 걸쳐 에셔는 재정 위기에 처할 때마다 본인의 인맥을 거듭 활용할 수 있었다. 지독할 정도로 예산이 많이 들어갔지만 그만큼 절실히 필요한 고트하르트 터널의 건설 자금을 마련하기 위해서다."
 gaudi.246.g: "사막에서 물 찾아 헤메는 게 우리 처지 아니던가!"
 gaudi.246.h: "괜찮소."
 gaudi.247.t: "파업!"
 gaudi.247.d: "나쁘디 나쁜 소식이다! 고트하르트 철도의 노동자들이 일을 그만두고 임금과 숙소, 식사와 작업복 개선에 나서지 않는다면 다시는 삽을 들지 않겠다고 엄포를 놓았다!"
 gaudi.247.f: "During the construction of the Gotthard tunnel, the population of Göschenen increased several times over. The construction workers lived in precarious conditions. Italian tunnel workers went on strike, demanding more wages and causing an uproar in the village. The trigger was a dispute between a post chief and the miners, who refused to continue drilling until the smoke cleared from the blasts. A war of words then broke out until the miners left the work site in a rage. On the way out, a rumor spread that a box of dynamite was on fire. This caused the rest of the tunnel crew to run outside as well. The workers moved on to the village, where they stopped in front of the post office, where the mayor and postman lived, and vented their anger. Here Luigi Dissune presented the demands of the workers to applause: one franc more wages per day, functioning ventilation and better safety regulations. The threat that no more miners would go into the tunnel until this was completely fulfilled was reinforced by taking up post in front of the tunnel portal so that no miners were allowed into the tunnel at the 10 p.m. shift change."
 gaudi.247.g: "자경단을 소집하라."
 gaudi.247.h: "요구를 들어줍시다."
 gaudi.248.t: "A sad day for Switzerland"
 gaudi.248.d: "When there was a workers' uprising, our security forces intervened quite brutally. Several workers were killed. We have suffered a loss of international reputation because of this."
 gaudi.248.f: "It is not known why the first shot was fired and by whom it was fired. No order to shoot was given. The exact course of the shooting is also unclear. Afterwards, the demonstrators dispersed. Four of them died and several were injured. Depending on the source, two or three died on the spot, another succumbed to his injuries a day later, and according to the investigation report, the fourth several days later. The event became known throughout Europe through accusatory press reports, also beyond Switzerland. In particular, the background to the formation of the police units involved was questioned."
 gaudi.248.g: "They started it!"
 gaudi.249.t: "Durchstich"
 gaudi.249.d: "After years of extremely difficult efforts, the construction workers met with only a minimal displacement in the middle of the Gotthard massif."
 gaudi.249.f: "After seven years and five months, the construction crews who broke through the mountain massif from the north and south met each other. The deviations were only 33 centimeters laterally and 5 centimeters in height - a masterpiece of engineering and surveying technology at the time. The event was celebrated in the European media, and at 15 kilometers the longest tunnel in the world at the time had been built. 'One can say today that the entire press on the continent pays homage to the Gotthardwerk and pays the tribute of sincere recognition,' wrote the Zurich Landbote at the time."
 gaudi.249.g: "Champagne!"
 gaudi.301.t: "Construction of Cristo Redentor begins"
 gaudi.301.d: "With the construction of the first scaffolding and iron structures on the Corcovado, the construction workers have started to work on the statue of Christ."
 gaudi.301.f: "Christ the Redeemer is the largest statue in the world built in Art Deco style. The face of the statue was created by the sculptor Gheorghe Leonida who was born in Galati, Romania in 1893. He studied sculpture at the Bucharest Conservatory of Fine Arts and then, after studying in Italy for another three years, won the Reveil Sculpture Prize. Famed in France as a portraitist, he was recruited by Paul Landowski into the team that began work on Christ the Redeemer in 1922. Gheorghe Leonida contributed by depicting the face of Jesus Christ on the statue, a fact that made him famous. A group of engineers and technicians studied Landowski's presentations and made the decision to build the structure out of reinforced concrete (designed by Albert Caquot) rather than steel, which would be more appropriate for a cruciform statue. The outer layers are made of soapstone, chosen for its durability and ease of use. It took nine years to build and cost the equivalent of USD 250,000 (or USD 3.3 million in 2014 value)."
 gaudi.301.g: "An important step for our nation."
 gaudi.302.t: "Christ on Corcovado mountain"
 gaudi.302.d: "After years of construction work, a highlight of Art Deco architecture was completed today with the statue of Christ - and one of the new symbols of Brazil!"
 gaudi.302.f: "During the unveiling ceremony, the statue was illuminated by a series of floodlights triggered remotely by shortwave radio pioneer Guglielmo Marconi, who was 9,200 kilometers away in Rome, Italy, but due to inclement weather the lights were switched on on site. A mass was also held at the inauguration. Cristo Rednetor was the tallest statue of Christ in the world from 1931 to 1981."
 gaudi.302.g: "May he protect country and city."
 gaudi.309.t: "리우데자네이루 상실"
 gaudi.309.d: "리우데자네이루 지역을 상실하면서 구세주 그리스도상의 건설을 지속할 기회도 영영 사라지게 되었다."
 gaudi.309.f: "리우데자네이루를 상실했다면 해당 지역을 수복한 뒤에는 처음부터 다시 건설을 시작해야 합니다. 브라질 문화를 가진 나라만이 구세주 그리스도상을 완공할 수 있습니다."
 gaudi.309.g: "리우데자네이루를 언제까지고 넘겨줄 순 없다!"
 gaudi.311.t: "Good progress"
 gaudi.311.d: "The work on Cristo Redentor is progressing better than expected. We expect to be a few months ahead of schedule."
 gaudi.311.f: "Modern technology, fast work processes, material supplies without interruption and good weather favor the construction progress."
 gaudi.311.g: "News that sweeten the day."
 gaudi.312.t: "A Donation for Cristo Redentor"
 gaudi.312.d: "As a good christian, [SCOPE.sCharacter('gaudi_cristo_donator').GetFullName] has a great personal interest in Cristo Redentor. He therefore submitted a personal donation for the construction of the statue."
 gaudi.312.f: "The erection of the statue of Christ was a suggestion that had been circulating for decades before it was realized and was a major concern, especially in devout Catholic circles. Numerous donors supported the project when it was finally tackled."
 gaudi.312.g: "We are in his debt."
 gaudi.313.t: "The clergy welcomes our building project"
 gaudi.313.d: "Brazil's clergy are ready to do everything in their power to complete Rio de Janeiro's Christ the Redeemer statue. Church-critical forces fear that our government will be influenced too much by the church."
 gaudi.313.f: "Funding problems delayed the construction of the Cristo Rednetor for almost ten years before the inauguration could finally take place with the support of the Archdiocese of Rio de Janeiro, the Holy See and France."
 gaudi.313.g: "We should benefit from that."
 gaudi.313.h: "Praise the Church in public."
 gaudi.313.i: "This matter does not involve the church!"
 gaudi.314.t: "Trade unions are critical of Cristo Redentor"
 gaudi.314.d: "As a representative of the trade unions, [SCOPE.sCharacter('trade_unions_leader').GetFullName] sent a petition to the government today to reconsider the controversial support of Cristo Redentor."
 gaudi.314.f: "The trade union leaders in Brazil see the current construction of Christ the Redeemer as a horrendous waste of money. If they can't prevent construction even to divert the funds to meaningful charitable channels, they at least demand better treatment and care for the builders who work at dangerous heights and have to haul tons of material up the mountain."
 gaudi.314.g: "Ignore them."
 gaudi.314.h: "Pay lip service."
 gaudi.314.i: "Spend money to improve the worker's situation."
 gaudi.315.t: "Transportation problems"
 gaudi.315.d: "Corcovado Mountain is certainly an ideal spot to build a landmark that can be seen for miles. Logistically, however, it has its disadvantages."
 gaudi.315.f: "Corcovado, which means 'hump' in Portuguese, is a 710 meter high mountain in the metropolitan area of Rio de Janeiro with a nearly vertical drop on one side. Although a railway line opened up the mountain at the end of the 19th century, the transport of larger components in particular turned out to be more difficult than initially thought, especially due to the winding and narrow path up to the mountain top."
 gaudi.315.g: "All I hear are only complaints!"
 gaudi.316.t: "Accident"
 gaudi.316.d: "An accident happened today at the Christ the Redeemer construction site, which has set construction work back by weeks."
 gaudi.316.f: "Despite the great height, the construction of the statue of Christ was less dangerous than the construction of many a skyscraper. However, accidents could not be ruled out. Even the site manager Heitor Levy almost fell off a scaffolding into the abyss. Levy was saved by the construction workers at the last moment and attributed this miracle to an intervention by Jesus Christ himself. Due to this near-death experience, the native Jew later converted to Catholicism."
 gaudi.316.g: "An omen?"
 gaudi.317.t: "Thunderstorm"
 gaudi.317.d: "During a thunderstorm, lightning struck Christ the Redeemer, destroying parts of it."
 gaudi.317.f: "Thunderstorms were a constant problem during construction and even after the statue was completed. Lightning strikes repeatedly destroyed parts of the soap stone and also destroyed some larger parts such as fingers."
 gaudi.317.g: "An unfortunate incident."
 gaudi.317.h: "Repair the damages."
 gaudi.317.i: "We need more lightning rods."
 gaudi.317.j: "Repair the damage and build new lightning rods."
 gaudi.318.t: "A praise"
 gaudi.318.d: "A member of parliament from [SCOPE.sCountry('gaudi_cristo_neighbour').GetName] visited Rio de Janeiro today and expressed his delight at the Christ the Redeemer statue, which is taking shape every day."
 gaudi.318.f: "The statue of Christ has already become a national symbol of Brazil and outshines all of Latin America."
 gaudi.318.g: "Thank you."
 gaudi.318.h: "Get him to collect support in his country for our project."
 gaudi.319.t: "Atheistic intervention"
 gaudi.319.d: "In a public speech today, [SCOPE.sCharacter('gaudi_cristo_atheist').GetFullName] castigated the construction of the statue of Christ as a return to the Middle Ages and called on like-minded people to denounce the waste of money."
 gaudi.319.f: "'If God wanted a statue of himself, why didn't he say so? And if he needs one, why not build it himself? Brazil is a modern country that needs no gods or kings, only man. Is a man not entitled to the sweat of his brow? I believe in no God, no invisible man in the sky. Why worship a flag or a God, when we can worship that which is best in us: our will to be great?"
 gaudi.319.g: "We should not challenge this group too much."
 gaudi.319.h: "DEUS VULT!"
 gaudi.319.i: "Art Deco and words like that. I have a VERY bad feeling about this guy."
 gaudi.320.t: "Touristic investments"
 gaudi.320.d: "The tourism industry sees the statue of Christ as a positive factor and would like to support the project."
 gaudi.320.f: "The construction of the Christ the Redeemer coincided with a time when Rio de Janeiro was becoming a fashionable travel destination due to the networking in air traffic, its sandy beach and the lively cultural scene. The modern statue on the Corcovado was thus also a symbol for the emerging tourism industry and a welcome addition as a new attraction."
 gaudi.320.g: "Beach, sun, hotels and Christ the Redeemer!"
 gaudi.401.t: "몰레 안토넬리아나 공사 재개"
 gaudi.401.d: "토리노 시에서 유대교 사회와 막판 협상을 마무리함에 따라 공사가 오늘부터 재개되었다."
 gaudi.401.f: "본디 토리노의 유대교 사회는 사르데냐-피에몬테 왕국의 옛 수도에 호화로운 회당을 건설하기를 바랐다. 새로 건설될 유대교 회당은 토리노의 유대교 시민들의 존재감과 발전, 통합을 한껏 드러내기 위함이었다. 당시 유명 건축가로 활동하던 알레산드로 안토넬리가 유대교 회당의 건설을 담당하게 되었다. 허나 안토넬리는 기념물 건축으로도 이름이 알려져 있었는데 그쪽이야말로 안토넬리 본인이 확대해 나가고픈 분야이기도 하였다. 실제로 피에몬테 지역의 카스텔라몬테 마을에서 로마의 성 베드로 대성전에 비견될 만한 대성당을 설계한 바 있었으나, 야심찬 사업에 들어갈 예산이 마땅찮았기 때문에 미완으로 남게 되었다. 그 때와 비슷한 운명이 이제는 유대교 사회를 위협하고 있었다. 새로 지은 회당은 날이 갈수록 높이 솟아올랐지만 유대교 사회에 있어 재정난을 초래할 위기에 처했던 것이다. 이에 토리노 시 당국은 건물을 매입하고 유대인들에게 새로운 부지와 회당을 제공하였으며, 새 회당은 그로부터 몇년 만에 완공되었다. 그리하여 몰레 안토넬리아나는 이탈리아의 국가 상징으로 거듭날 발판을 마련하게 되었다."
 gaudi.401.g: "안토넬리가 본인의 설계도에 다시 손대지 않았으면 좋겠군..."
 gaudi.402.t: "몰레 안토넬리아나: 1단계 시공 완료"
 gaudi.402.d: "몰레 안토넬리아나의 기본 구조가 완공되었다. 그런데 지붕과 첨탑과 관련해서 안토넬리가 독특한 발상을 새로 떠올린 모양이다..."
 gaudi.402.f: "몰레 안토넬리아나는 원래 원형 돔으로 지어질 계획이었다. 그러나 안토넬리는 그 규모를 한층 더 크고 높이 바꾸어 오늘날 우리가 아는 특유의 형태를 지니게 되었다. 이는 상단부 시공 단계를 마무리하는 데 추가 시간이 소요된다는 뜻이기도 하다."
 gaudi.402.g: "이 사람은 만족할 줄도 모르는가?"
 gaudi.403.t: "안토넬리와 함께 하늘에 닿다"
 gaudi.403.d: "몰레 안토넬리아나가 마지막 시공 단계에 접어들었다."
 gaudi.403.f: "As per his initial project, Antonelli decided to finish the Mole with an almost pointed termination, provided with colonnades between the neo-Gothic and the neo-classical, thus imitating another of his previous works, the tip of the Basilica of San Gaudenzio, symbol of Novara. From 90 meters upwards he therefore broke with the square-based architectural theme, designing a granite colonnade with a circular base, called the 'Lantern', placed on a truncated cone base. Likewise, the architect also conceived the design of a spire of about 50 meters above the Lantern, with an octagonal section, and interspersed with ten circular terraces, the first two still equipped with a colonnade, then upwards gradually more and more small, and accessible by a small zig-zag ladder."
 gaudi.403.g: "마감과 장식 좀 덧대는 것이기를 바랬건만..."
 gaudi.404.t: "몰레 안토넬리아나 완공"
 gaudi.404.d: "오늘 정령 조각상을 설치하는 행사와 함께 모든 공사가 마무리되었다. 하나의 명소로 토리노와 이탈리아가 한층 더 빛나 보이게 된 것이다!"
 gaudi.404.f: "Antonelli worked with dedication on the Mole until his death; the rudimentary lift operated by a pulley that carried the nearly ninety-year-old architect to several tens of meters in height, to personally check the state of the works, became legendary. A few months before his death, the architect suggested finishing the spire with a statue depicting a 'Winged Genius'. The design of the statue was commissioned to the sculptor Fumagalli; the Genius, made of embossed and gilded copper, weighed about 300 kg, and had a spear in one hand and a palm branch in the other. The statue reached a total height of 5.46 meters. After Antonelli's death, the completion of the spire was overseen above all by his son Costanzo and his pupil Crescentino Caselli. With the final laying of the 'Winged Genius', the building reached an overall height of 167.35 metres, a height, at the time, never reached by any masonry construction in Europe and the world. The Mole, the tallest masonry construction in the world, entered into direct 'competition' with the Eiffel Tower in Paris, inaugurated just 10 days earlier and which would have been the tallest building in the world until 1930."
 gaudi.404.g: "토리노 만세, 이탈리아 만세!"
 gaudi.409.t: "토리노 상실!"
 gaudi.409.d: "피에몬테 지역을 상실하면서 몰레 안토넬리아나의 건설을 지속할 기회도 영영 사라지게 되었다."
 gaudi.409.f: "어떤 이유에서건 피에몬테를 상실하게 되더라도, 건설 진행도가 통째로 사라지는 것은 아닙니다. 이탈리아만이 지난 건설 단계를 이어받아 몰레 안토넬리아나의 건설을 계속할 수 있습니다. 우리를 침략한 외국 세력은 건설에 전혀 관심을 보이지 않을 것입니다."
 gaudi.409.g: "토리노를 언제까지고 넘겨줄 순 없다!"
 gaudi.411.t: "못 쓰게 된 벽돌"
 gaudi.411.d: "최근에 납품된 몰레 안토넬리아나 건설 자재의 품질이 떨어지는 것으로 드러났다."
 gaudi.411.f: "몰레 안토넬리아나 건물이 매일같이 높이 올라가던 토리노 건설 현장에 평소대로의 활기가 사라졌다. 안토넬리가 잠시 점검에 나서보니 벽돌의 품질이 평소와는 다르다는 것을 알게 되었고, 건설 사업에 차질이 생기기 전에 좀 더 기다려보자고 밝혔다. 하지만 건설 관리를 맡은 책임자들은 벽돌을 계속 사용해야 한다는 목소리가 나오고 있다. 건설이 지연될 뿐만 아니라 안토넬리가 또다시 설계도를 고치는 데 시간을 할애할 것이란 우려가 제기된 탓이다..."
 gaudi.412.t: "참사 발생!"
 gaudi.412.d: "저품질 자재를 사용한 결과가 여실히 드러나고 말았다. 오늘 아침 몰레 안토넬리아나의 일부가 무너져 내려 상당한 피해를 입힌 것이다."
 gaudi.412.f: "어쩌면 안토넬리의 의견에 귀기울여야 했을지도 모른다. 몰레 안토넬리아나처럼 중요한 건물에 부서지기 쉬운 석회암을 사용한 것이 정말 좋지 않은 생각이었을지도 모른다. 그렇기에 결단을 내리기 전에 두 번 다시 생각해야 했을지도 모른다. 허나 떄는 이미 늦었다. 저품질 자재로 인해 오늘 결국 외벽이 무너져 내렸고, 지난 몇 주, 몇 달 간 이어왔던 공사가 건물 정면 붕괴로 인해 물거품이 되고 만 것이다."
 gaudi.413.t: "토리노의 고고학 발굴 조사"
 gaudi.413.d: "토리노를 방문한 [SCOPE.sCharacter('gaudi_archaeologist').GetFullName](이)가 몰레 안토넬리아나가 고대 로마 시대의 유적 위에 들어선 정황을 발견하였다. 이에 당국에 발굴 허가를 요청한 상황이다."
 gaudi.413.f: "토리노의 기원은 기원전 1세기 로마인들이 '아우구스타 타우리노룸'을 지은 것이 시작이다. 오늘날 토리노의 가리발디길은 고대 로마시 대의 데쿠마누스길을 정확히 따라가고 있으며, 그 길이 시작되는 데쿠마니 문은 나중에 마다마 궁전의 일부로 포함되었다. 오늘날 도심부의 북쪽에 위치한 팔라티나 문은 대성당 인근의 공원에 여전히 보존되고 있다. 고대 로마 시대의 극장 유적 역시 마니카 누오바 지역에 보존되어 있다."
 gaudi.414.t: "최신 공사 기계"
 gaudi.414.d: "우리나라 전동차 업계에서 최근 몰레 안토넬리아나 건설 현장에 보급한 최첨단 장비로 공사 진척도가 향상되고 있다."
 gaudi.414.f: "몰레 안토넬리아나는 당대 최대 규모의 벽돌 건축물로 제일 유명해졌으며 여러 측면에서 전통보다는 혁신적인 건축 이론을 반영하고 있다. 건축 내부에 철강 구조나 시멘트는 활용하지 않았음에도 다른 기계의 활용은 배제하지 않았다. 토리노는 밀라노와 제노바에 이어 이탈리아를 대표하는 산업 도시였기에, 안토넬리 건축장이 주문하는 대로 공사를 수월하게 만드는 각종 기계를 조달해올 수 있었다."
 gaudi.415.t: "Citizen Donation"
 gaudi.415.d: "Representatives of the patriotically minded petty bourgeoisie, under their leader [SCOPE.sCharacter('pb_leader').GetPrimaryRoleTitle] [SCOPE.sCharacter('pb_leader').GetFullName], made a donation to the construction of the Mole Antonelliana."
 gaudi.415.f: "Since it was taken over by the municipal authorities, the Mole Antonelliana had become more than just a symbol for the up-and-coming industrial location of Turin. The greatness striving for heaven was not only a symbol of modernity, but also of the national spirit of Italy. For the patriotically minded bourgeoisie, the building was a symbol of identification for the new state. When completed, the building would house the Museum of the Risorgimento. Nationally minded Italians therefore had a great interest in speedy completion."
 gaudi.415.g: "We owe them a debt of gratitude."
 gaudi.416.t: "또 시작된 안토넬리의 발상"
 gaudi.416.d: "본인의 이름을 딴 기념탑을 짓고 있는 알레산드로 안토넬리가 최근 계획 변경안을 내놓아 건설 관리자들을 경악에 빠뜨리고 말았다..."
 gaudi.416.f: "알레산드로 안토넬리를 괴짜 건축가라 치부하는 것은 지나친 과소평가다. 130m 높이의 건물을 설계해 놓고는 본인의 완벽주의 성향에 맞추어 160m를 넘기지 못하면 건축가의 품위에 걸맞지 않는다고 주장하는 것은 지극히 자연스러운 일이다. 피에몬테 지역에 로마의 성 베드로 대성당과 같은 규모의 성당을 설계하는 것 또안 당연한 일이다. 그리고 설계한 건물 중 상당수가 본인의 기준을 충족하지 못해 미완으로 남았다는 사실은 결코 과대망상의 징후가 아닐 것이다. 이 가운데 알레산드로 안토넬리에게 어울릴 사례는 없다. 이런데도 몰레 안토넬리아나의 건설 기간을 또다시 늘릴 새로운 방안을 구상한 모양이다..."
 gaudi.416.g: "맘마 미아!"
 gaudi.416.h: "산토 디오!"
 gaudi.416.i: "포르카 미세리아!"
 gaudi.416.j: "카볼로!"
 gaudi.417.t: "하늘 높이 뻗어가는 안토넬리아나"
 gaudi.417.d: "몰레 안토넬리아나의 건설 작업이 특정할 수 없는 이유로 예상보다 훨씬 더 빠른 진척을 보이고 있다."
 gaudi.417.f: "영문 모를 이유로 저 장엄한 몰레 안토넬리아나의 건설이 순조롭게 진행되고 있다. 어쩌면 날씨가 좋아서일지도 모른다. 성모님께 기도를 잘 드려서일수도 있고, 며칠 전에 낭비해 버려 다시는 발견되지 않기를 바라는 저품질 건축 자재 때문인지도 모른다. 한 가지 확실한 것은 온갖 사정으로 수차례 지연되었던 이 거대한 건축물이 예상보다 빨리 완공될 전망이라는 것이다. 안토넬리가 시간 절약을 만회하기 위해 새로운 확장 계획에 나서지 않는다는 가정 하에 말이다..."
 gaudi.418.t: "Falling beam destroys brick wall"
 gaudi.418.d: "A falling support beam caused considerable damage to the Mole Antonelliana today and set construction back."
 gaudi.418.f: "This support beam wasn't really supporting."
 gaudi.418.g: "Aggravating."
 gaudi.419.t: "국왕의 방문"
 gaudi.419.d: "[SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('gaudi_ruler').GetFullName] has decided to pay a personal visit to the Molle Antonelliana construction site."
 gaudi.419.f: "Our monarch [SCOPE.sCharacter('gaudi_ruler').GetFullName] has already shown a great deal of interest in what is happening on the Turin construction site in the past and now intends to visit the site. The preparations are in full swing - and of course they want to offer something to His Majesty! Simple construction workers, the construction management and Antonelli personally have therefore set a previously unknown chord speed after the announcement."
 gaudi.419.g: "폐하께서 독려하는 법을 확실히 알고 계시는군."
 gaudi.420.t: "건설 현장 사고"
 gaudi.420.d: "오늘 벌어진 사고로 여러 명의 인부가 부상당했다. 몰레 안토넬리아나의 건설 관리실에서는 피해 복구와 대체 인력 충원이 이뤄지지 않는다면 공사가 크게 지연될 것이라 전망하고 있다."
 gaudi.420.f: "오늘 토리노에서 벌어진 사고로 여러 명이 부상을 입고 일부는 중상을 입어 병원으로 이송됐다. 부상자 중에는 건설 현장에서 핵심 역할을 담당하던 숙련된 기술자들도 있었다. 이들이 없다면 현장이 복구될 때까지 공사가 지연될 가능성이 높다."
 gaudi.420.g: "사고란 늘 일어나는 법."
 gaudi.420.h: "이번 사고로 건설 진행에 차질이 없도록 온 노력을 다해야 한다."
 gaudi.421.t: "Threat of strike"
 gaudi.421.d: "The construction workers of the Mole Antonelliana have announced a strike if we don't want to negotiate better pay."
 gaudi.421.f: "Ah, the wonderful world of strikes! You don't know what you're missing out on if you haven't experienced in Italy what it's like to be stranded at a train station because the railway workers' union suddenly decides to sabotage it. Today it affects only one construction site. We're really lucky!"
 gaudi.421.g: "We will not negotiate."
 gaudi.421.h: "Paying some scabs will do the job."
 gaudi.421.i: "Call the Carabinieri!"
 gaudi.421.j: "Negotiate."
 gaudi.422.t: "Thunderstorm destroys Spire"
 gaudi.422.d: "A thunderstorm became a tornado-like phenomenon and ripped off the spire of the Mole Antonelliana during the night!"
 gaudi.422.f: "A violent storm, probably a whirlwind, caused 47 meters of the spire to break and fall into a small garden. The spire, brushing against the window of a room on the top floor, partially destroyed a balcony, but caused no harm to people. A similar fate happened to the Mole on 23 May 1953. The Mole with the broken spire can be seen at the end of the opening credits of the 1955 film The Friends by Michelangelo Antonini. The title of tallest masonry building in Europe therefore passed to the bell tower of the Cathedral of Ulm, Germany (161.53 meters), while Philadelphia City Hall passed the title of tallest masonry building in the world (162.53 metres). This was also due to the fact that the spire would no longer be rebuilt in masonry, but in reinforced concrete."
 gaudi.422.g: "A disaster!"
 gaudi.423.t: "Nietzsche admires the Mole"
 gaudi.423.d: "The famous German philosopher Friedrich Nietzsche spent much of the 1870s and 1880s in Turin, which he held in high esteem. He praised the Mole Antonelliana as one of the greatest buildings of his time."
 gaudi.423.f: "'I passed by the Mole Antonelliana, the most ingenious building which was perhaps built for an absolute upward impulse - it recalls nothing but Zarathustra. I baptized it Ecce Homo and surrounded it in my spirit with an immense free space.' - Friedrich Nietzsche"
 gaudi.423.g: "The man has taste. Not just since 'Morgenröte'."
 gaudi.424.t: "Mongolfiera Italo"
 gaudi.424.d: "The construction of the Mole Antonelliana should be financed by a special measure and thus arouse additional interest."
 gaudi.424.f: "The Municipality had planned that the completion of the Mole Antonelliana should coincide with the timing of a major exhibition. Visitors should observe the Mole Antonelliana up close. The structure was not built on time, but to make up for it, it was still possible to see the construction progress by balloon ride for a fee of 5 lire. The balloon itself was given the name 'Italo'."
 gaudi.424.g: "A tourist balloon sounds like a good idea."
 gaudi.424.h: "What a waste of money."
 gaudi.425.t: "Italo struck by lightning"
 gaudi.425.d: "The balloon at the Mole Antonelliana was destroyed in a tempest!"
 gaudi.425.f: "The balloon 'Italo', which had become a nice pastime for the upper class for a small excursion fee during the construction of the Mole Antonelliana, was struck by lightning on April 27, 1884 and crashed on the ground. There were no dead or injured."
 gaudi.425.g: "Build a new balloon."
 gaudi.425.h: "These balloon rides are far too dangerous."
 gaudi.501.t: "Construction work begins on the Ringstrasse"
 gaudi.501.d: "With a decree, [SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('gaudi_ruler').GetFullName] initiated the start of construction of the ring road today."
 gaudi.501.f: "'It is my will that the expansion of the inner city of Vienna be tackled as soon as possible with a view to connecting it with the suburbs and that the regulation and beautification of my residence and imperial capital be taken into account. To this end I authorize the abandonment of the wall and fortifications of the inner city, as well as the ditches around it. That part of the area and glacis grounds obtained by abandoning the wall around the fortifications and city moats, which is not reserved for another determination in accordance with the basic plan to be drafted, is to be used as building ground and the proceeds gained from this are to be used to form a building fund, From which the expenses incurred by the state treasury as a result of this measure, in particular also the costs of the construction of public buildings, as well as the relocation of the military institutions that are still necessary, are to be met.' - Franz Joseph I."
 gaudi.501.g: "Vienna will become a metropolis of the first rank."
 gaudi.502.t: "Inauguration of the Ringstrasse"
 gaudi.502.d: "The Ringstrasse was inaugurated with a ceremony today. But that only applies to the avenue as such - this place still lacks the greatness that is supposed to put Vienna on a par with London and Paris."
 gaudi.502.f: "'Your Majesty brought the most beautiful Christmas gift to the entire population of your faithful residence city through the generous decision that the walls of Vienna should fall and the city should be expanded, because Vienna should become one of the most beautiful and healthy cities in Europe. The greater part of the task set by Your Majesty has been accomplished, the confining curtain walls have disappeared, a street with the most beautiful palaces and houses has been completed, gardens and grounds have been created which adorn the residence and provide relaxation for the residents. The long-awaited aqueduct, which is the condition for the cleanliness of the city and for the health of its inhabitants, will crown the great work of city expansion, and Your Majesty as the founder of the same will owe even the coming generations the deepest thanks. Permit Your Majesty that I express my most respectful thanks on behalf of the representatives of the City of Vienna, that they have the grace to open the Ringstrasse today.' - Andreas Zelinka, Mayor of Vienna"
 gaudi.502.g: "Vienna, you are a gem!"
 gaudi.503.t: "A turning point for Vienna"
 gaudi.503.d: "The ring road is slowly taking shape. In particular, the construction of a large opera house and a new town hall will underpin the caesura that this construction phase means for Vienna's city history."
 gaudi.503.f: "'I regard the completion of the ring road as a particularly important stage in the work of urban expansion. I have always devoted my special attention to this matter and express my appreciation and gratitude to you, Mr. Mayor, and to the municipal council for the special care you have given to the beautification of my residence. In the future I will continue to pay attention to the further progress in the expansion of the city and, as far as possible, take into account the wishes of the municipality in relation to obtaining building plots for the construction of schools, warehouses and parks at very reasonable prices. In order to bring one of the most important questions to a speedy solution, I have made the order that the municipality be allowed to carry out the water supply of the Kaiserbrunnen free of charge, and I hope that the water supply will thus come to a speedy and happy conclusion.' - Franz Joseph I."
 gaudi.504.t: "빈의 화려함"
 gaudi.504.d: "With the inauguration of the new State Opera and the move into the New Town Hall, an important step has been taken towards making Vienna a truly worthy capital of Austria."
 gaudi.504.f: "'The streets of Vienna are paved with culture. The streets of other cities with asphalt.' - Karl Kraus"
 gaudi.505.t: "On the Road to Greatness"
 gaudi.505.d: "With the planning for the university, parliament and art museums, the construction of the Vienna Ringstrasse is entering its final phase. The task now is to create an architectural wonder out of an aesthetically pleasing district."
 gaudi.505.f: "'Vienna has a lot of landmarks and every Viennese feels like one.' - Karl Kraus"
 gaudi.506.t: "Vienna Ringstrasse completed"
 gaudi.506.d: "As of today, the Ringstrasse has gained its defining appearance. Although it cannot be ruled out that further extensions could follow in the future, what will go down in history as the 'ring house style' has reached its zenith here and now. The whole of Europe envies us for this scenery!"
 gaudi.506.f: "'Es war sehr schön, es hat mich sehr gefreut.' - Franz Joseph I."
 gaudi.506.g: "It was very nice, it was truly my pleasure."
 gaudi.509.t: "빈 상실!"
 gaudi.509.d: "빈 지역을 상실하면서 빈 순환도로의 건설을 지속할 기회도 영영 사라지게 되었다."
 gaudi.509.f: "어떤 이유에서건 피에몬테를 상실하게 되더라도, 건설 진행도가 통째로 사라지는 것은 아닙니다. 오스트리아만이 지난 건설 단계를 이어받아 빈 순환도로의 건설을 계속할 수 있습니다. 우리를 침략한 외국 세력은 건설에 전혀 관심을 보이지 않을 것입니다."
 gaudi.509.g: "빈을 언제까지고 넘겨줄 순 없다!"
 gaudi.601.t: "The Crypt"
 gaudi.601.d: "The first phase of construction will focus on the crypt and the apse of the Sagrada Família. It becomes clear right from the start that the dimensions are larger than initially thought."
 gaudi.601.f: "'The work of the Holy Family is slow, because the Master of this work is in no hurry.' - Antoni Gaudí"
 gaudi.601.g: "It won't take that long, will it?"
 gaudi.602.t: "Crypt completed"
 gaudi.602.d: "Today the crypt of the Sagrada Família was consecrated. A first service can be celebrated there soon."
 gaudi.602.f: "'Men may be divided into two types: men of words and men of action. The first speaks; the latter act. I am of the second group. I lack the means to express myself adequately. I would not be able to explain to anyone my artistic concepts. I have not yet concretised them. I never had time to reflect on them. My hours have been spent in my work.' - Antoni Gaudí"
 gaudi.602.g: "Nine more construction phases..."
 gaudi.603.t: "The Apse"
 gaudi.603.d: "With a completely renewed plan that bears little resemblance to what was originally envisaged, Antoni Gaudí has opened the window to a church that has never existed before."
 gaudi.603.f: "'We have given the title to a madman or a genius, time will tell.' - Elies Rogent, Director of the Barcelona School of Architecture"
 gaudi.603.g: "Is this supposed to end in a man's lifetime?"
 gaudi.604.t: "Apse completed"
 gaudi.604.d: "After completing the apse, Barcelona residents have their first glimpse of what Gaudí is actually up to. The building already has unusual shapes."
 gaudi.604.f: "The straight line belongs to Man. The curved line belongs to God. - Antoni Gaudí"
 gaudi.604.g: "Eight more construction phases..."
 gaudi.605.t: "The Nativity Facade"
 gaudi.605.d: "Contrary to the wishes of the city administration, construction of the Nativity Facade begins. The first wish was to build the Passion Facade because it faces the city."
 gaudi.605.f: "'Everyone finds their things in the temple: the peasants see chickens and roosters; the scientists, the signs of the Zodiac; theologians, the genealogy of Jesus; but the explanation, the reasoning, is only known by the competent and should not be vulgarized.' - Antoni Gaudí"
 gaudi.605.g: "I like the tourtoises."
 gaudi.606.t: "Nativity Facade completed"
 gaudi.606.d: "Construction on the Nativity Facade is complete. Its playful appearance and its colossal dimensions not only convince the residents of Barcelona to support the construction of the church. It gives a foretaste of the whole work."
 gaudi.606.f: "'It is not possible for a single generation to reach the entire Temple, so let us leave such a vigorous display of our pace so that future generations feel the stimulus to do the same; and on the other hand we do not tie them for the rest of the work (...). We have made a complete facade of the Temple so that its importance makes it impossible to stop continuing the work.' - Antoni Gaudí"
 gaudi.606.g: "Seven more construction phases."
 gaudi.607.t: "The Main Nave"
 gaudi.607.d: "The interior of the Sagrada Família is enriched with details every day; it feels more like a forest than a house."
 gaudi.607.f: "'The interior of the temple will be like a forest. (...) The pillars of the main nave will be palm trees; they are the trees of glory, sacrifice and martyrdom. Those of the lateral naves will be laurels, trees of glory, of intelligence.' - Antoni Gaudí"
 gaudi.607.g: "How many years will this take?"
 gaudi.608.t: "Main Nave completed"
 gaudi.608.d: "The papal nuncio paid a visit to Gaudí while visiting the Sagrada Família. According to the Nuntio, his work and his way of life would rightly give him the title of 'Dante of architecture'. Given the grotesque architecture, however, critics do not know whether the church quotes paradise or inferno."
 gaudi.608.f: "'Painting, through colour, and sculpture, through form, represent existing organisms. Figures, trees, fruits... express their interiority through their exteriority. Architecture creates the organism. Therefore, it has to be governed by a law in harmony with those of nature. Architects who do not abide by this principle make botch jobs instead of a work of art.' - Antoni Gaudí"
 gaudi.608.g: "Six more construction phases."
 gaudi.609.t: "Spires of the Apostels"
 gaudi.609.d: "Already with the Nativity Facade Gaudí had emphasized that the Sagrada Família should grow in height rather than in width in order to arouse more enthusiasm; building individual towers will give the structure a great effect."
 gaudi.609.f: "'Some time ago, an old neighbor came from home, who had known me as a child, and, seeing the Temple of the Sagrada Família, naively exclaimed: Alas, alas! he does the same thing he did when he was little! And he was right. It is an aptitude, accumulated by inheritance, that moves and guides me.' - Antoni Gaudí"
 gaudi.609.g: "Will this ever end?"
 gaudi.610.t: "Spires of the Apostels completed"
 gaudi.610.d: "The first towers of the Sagrada Família are completed. The residents are partly fascinated, partly shocked."
 gaudi.610.f: "'Unlike most of the churches in Barcelona it was not damaged during the revolution - it was spared because of its 'artistic value', people said. I think the Anarchists showed bad taste in not blowing it up when they had the chance, though they did hang a red and black banner between its spires.' - George Orwell"
 gaudi.610.g: "Five more construction phases."
 gaudi.611.t: "The Passion Facade"
 gaudi.611.d: "With the Passion Facade of the Sagrada Família, a part of the church is now being created that also causes irritation among friends of Gaudí."
 gaudi.611.f: "'Someone will find this door too fancy; but I would like it to be scary, and to achieve it I will not spare chiaroscuro, incoming and outgoing motifs, everything that results in the most gloomy effect. What's more, I am willing to sacrifice the construction itself, to break arches and cut columns to give an idea of how bloody the Sacrifice is.' - Antoni Gaudí"
 gaudi.611.g: "A horror of stone."
 gaudi.612.t: "Passion Facade completed"
 gaudi.612.d: "In contrast to the Nativity Facade, the Passion Facade, which is kept simple, has a highly modern effect and is therefore attractive to some, repulsive to others. It is now perfectly understandable why Gaudí did not want to build this facade first."
 gaudi.612.f: "'What I saw in Barcelona - Gaudí - was the work of such strength, such faith, of an extraordinary technical capacity, manifested during a whole life of genius; of a man who carved the stones before his eyes in well thought out pattern. Gaudí is the 'builder' of the turn of the century, a man adept with stone, iron and brick. His glory is seen today in his country. Gaudí was a great artist; only those who move the sensitive hearts of gentle people remain.' - Le Corbusier"
 gaudi.612.g: "Only four construction phases remain."
 gaudi.613.t: "The Transept"
 gaudi.613.d: "Despite the successful progress of construction work, critics are still speaking out, now also from the art world. They do not want the building to adhere to the strict specifications, but also have to evolve with modern developments in architecture. The construction management has given such requests a refusal."
 gaudi.613.f: "'In books you rarely find what you're looking for, and when you do, it's often wrong.' - Antoni Gaudí"
 gaudi.613.g: "Hosanna in excelsis."
 gaudi.614.t: "Transept completed"
 gaudi.614.d: "Now that the Sagrada Família is almost two-thirds complete, the Pope had it elevated to the rank of a minor basilica in a mass."
 gaudi.614.f: "'In the Sagrada Familia everything is providential: its location is in the center of the city and the plain of Barcelona; there is the same distance from the temple to the sea and the mountains, to Sants and Sant Andreu, and to the Besòs and Llobregat rivers.' - Antoni Gaudí"
 gaudi.614.g: "Only three construction phases remain."
 gaudi.615.t: "Spires of Mary and the Evangelists"
 gaudi.615.d: "With the planning of the evangelist towers, Gaudí played off symbols, elements, zodiac signs and virtues architecturally. Now they should become reality."
 gaudi.615.f: "'Virgin Mary, it doesn't seem bad for you to be little, so are the flowers and the stars.' - Antoni Gaudí"
 gaudi.615.g: "Ave Maria."
 gaudi.616.t: "Spires of Mary and the Evangelists completed"
 gaudi.616.d: "The five tall towers of the Sagrada Família tower over Barcelona; the construction of the Spire of Mary comes to an end with the placement of the twelve-pointed star."
 gaudi.616.f: "'The Sagrada Família is not the last of the cathedrals, but the first of a new era.' - Antoni Gaudí"
 gaudi.616.g: "Two last construction phases!"
 gaudi.617.t: "The Glory Facade"
 gaudi.617.d: "The main façade of the Sagrada Família is finally being tackled. For this, new building land has to be acquired, much to the displeasure of the city population. Management has yet to give its approval."
 gaudi.617.f: "'I will not complete or develop the fragment of the model of the bell towers on the main façade. I have decided to leave it only scheduled for another generation to collaborate in the temple, as is repeatedly seen in the history of cathedrals, whose facades are not only by other authors, but also in other styles.' - Antoni Gaudí"
 gaudi.617.g: "Sanctus, Sanctus, Sanctus."
 gaudi.618.t: "Glory Facade completed"
 gaudi.618.d: "With the completion of the Glory Facade, the Sagrada Família is now almost complete."
 gaudi.618.f: "'Sagrada Familia...is the greatest piece of creative architecture in the last twenty-five years. It is spirit symbolised in stone!' - Louis Sullivan"
 gaudi.618.g: "One last construction phase!"
 gaudi.619.t: "The Spire of Christ"
 gaudi.619.d: "With the Spire of Christ, the Sagrada Família will not only tower over Barcelona, but also surpass Ulm Minster - the tallest church in Europe to date."
 gaudi.619.f: "'Originality consists in going back to the origins.' - Antoni Gaudí"
 gaudi.619.g: "This will be the tallest church on earth."
 gaudi.620.t: "La Sagrada"
 gaudi.620.d: "It is finished! It is truly done! An architectural wonder of the world, the Sagrada Família shines over Barcelona and across the globe!"
 gaudi.620.f: "Pater noster, qui es in caelis :\nsanctificetur nomen tuum :\nadveniat regnum tuum :\nfiat voluntas tua, sicut in caelo, et in terra.\nPanem nostrum quotidianum da nobis hodie :\net dimitte nobis debita nostra,sicut et nos dimittimus debitoribus nostris\net ne nos inducas in tentationem.\nSed libera nos a malo."
 gaudi.620.g: "I never thought I would live to see this day."
 gaudi.629.t: "바르셀로나 상실!"
 gaudi.629.d: "바르셀로나 지역을 상실하면서 사그라다 파밀리아 성당의 건설을 지속할 기회도 영영 사라지게 되었다."
 gaudi.629.f: "어떤 이유에서건 카탈루냐를 상실하게 되더라도, 건설 진행도가 통째로 사라지는 것은 아닙니다. 주 문화가 이베리아인 다른 국가가 지난 건설 단계를 이어받아 성당의 건설을 계속할 수 있습니다. 우리를 침략한 외국 세력은 성당 건설에 전혀 관심을 보이지 않을 것입니다."
 gaudi.629.g: "바르셀로나를 언제까지고 넘겨줄 순 없다!"
 gaudi.631.t: "A pious donation to the Sagrada Família"
 gaudi.631.d: "As a good christian, [SCOPE.sCharacter('gaudi_sagrada_donator').GetFullName] has a great personal interest in the Sagrada Família. He therefore submitted a personal donation for the construction of the church."
 gaudi.631.f: "For decades, the Sagrada Família was mainly financed by donations. It was thanks to a large anonymous donation shortly before construction began that Antoni Gaudí significantly expanded his building plans and made the Sagrada Família the project it is today. The construction work is still being financed, as originally planned by Josep Maria Bocabella, with donations from foundations and entrance fees. Around 22 million euros are available for construction each year; in 2009 it was 18 million euros."
 gaudi.631.g: "We are in his debt."
 gaudi.632.t: "The construction of the Sagrada Família delights the clergy"
 gaudi.632.d: "Our nation's clergy are euphoric at the progress of construction on the Sagrada Família and have offered to help. However, there is a fear that this could make the church too influential."
 gaudi.632.f: "Gaudí dedicated the last years of his life entirely to the 'Cathedral of the Poor', as it was commonly known, for which he took alms in order to continue. Apart from his dedication to this cause, he participated in few other activities, the majority of which were related to his Catholic faith: in 1916 he participated in a course about Gregorian chant at the Palau de la Música Catalana taught by the Benedictine monk Gregori M. Sunyol. Monsegnor Ragonesi considered Gaudí 'The Dante of architecture'. Despite its gigantic dimensions, the Sagrada Família is not a cathedral church and is not financed by official church sources."
 gaudi.632.g: "We should benefit from that."
 gaudi.632.h: "Praise the Church in public."
 gaudi.632.i: "This matter does not involve the church!"
 gaudi.633.t: "Unions criticize the Sagrada Família"
 gaudi.633.d: "As a representative of the trade unions, [SCOPE.sCharacter('trade_unions_leader').GetFullName] sent a petition to the government today to reconsider the controversial support of the Sagrada Família."
 gaudi.633.f: "The trade union leaders see the current construction of the Sagrada Família as a horrendous waste of money. If they can't prevent construction even to divert the funds to meaningful charitable channels, they at least demand better treatment and care for the builders who work at dangerous heights."
 gaudi.633.g: "Ignore them."
 gaudi.633.h: "Pay lip service."
 gaudi.633.i: "Spend money to improve the worker's situation."
 gaudi.634.t: "Accident"
 gaudi.634.d: "An accident happened today at the Sagrada Família construction site, which has set construction work back by weeks."
 gaudi.634.f: "Working at dizzying heights is not the only risk of accidents. An arsonist set fire to the Sagrada Família in 2020, interrupting construction and arranging for the evacuation of construction workers and tourists present. The sacristy was affected by the fire and was damaged."
 gaudi.634.g: "Regrettable."
 gaudi.635.t: "Atheists rush against the Sagrada Família"
 gaudi.635.d: "In a public speech today, [SCOPE.sCharacter('gaudi_sagrada_atheist').GetFullName] castigated the construction of the Sagrada Família as a return to the Middle Ages and called on like-minded people to denounce the waste of money."
 gaudi.635.f: "'You can be against the Sagrada Família for many reasons. For many good reasons. For example, because it is an architectural nightmare, not to say a horrible nightmare. Not even in the European architecture of our period can one discover anything so vulgar or pretentious. It's a nightmare that grows skyward every day, in the most obscure and absurd forms, settled between kitsch, superstition and human madness. Above all, it is madness, paid for by our taxpayers so that the priests keep the stupid even stupider and the poor even poorer. Ladies and gentlemen, let me tell you: this madness has to stop. Not tomorrow, but today!'"
 gaudi.635.g: "We should not challenge this group too much."
 gaudi.635.h: "DEUS VULT!"
 gaudi.636.t: "Touristic investments"
 gaudi.636.d: "The tourism industry sees the Sagrada Família as a positive factor and would like to support the project."
 gaudi.636.f: "In the course of the 20th century, the Sagrada Família became Barcelona's real symbol. While the spiritual aspect was paramount for Gaudí, it became increasingly clear to resourceful entrepreneurs that the eternal construction site could be marketed. In later years, hundreds of bartering tourists would flock to Barcelona for this reason. Today the Sagrada Família is one of the most popular tourist destinations in Spain."
 gaudi.636.g: "Barcelona will soon be enriched by a landmark."
 gaudi.637.t: "건설 현장에 신형 기계 투입"
 gaudi.637.d: "우리나라 전동차 업계에서 최근 사그라다 파밀리아 대성당 건설 현장에 보급한 최첨단 장비로 공사 진척도가 향상되고 있다."
 gaudi.637.f: "백 년 넘는 세월이 흐른 사그라다 파밀리아 대성당 건설 과정에서 기술 발전이 이루어지면서 건설 속도를 높이는 데에도 기여하였다. 세기가 넘어갈 무렵 새로운 건축 공법과 기계가 활용되었고, 세기말에 이르러서는 컴퓨터 시뮬레이션으로 대성당 건설에 큰 혁신을 불러일으켰다."
 gaudi.637.g: "이것이 진보다!"
 gaudi.638.t: "Threat of strike"
 gaudi.638.d: "The construction workers of the Sagrada Família have announced a strike if we don't want to negotiate better pay."
 gaudi.638.f: "Ah, the wonderful world of strikes! You don't know what you're missing out on if you haven't experienced in Southern Europe what it's like to be stranded at a train station because the railway workers' union suddenly decides to sabotage it. Today it affects only one construction site. We're really lucky!"
 gaudi.638.g: "We will not negotiate."
 gaudi.638.h: "Paying some scabs will do the job."
 gaudi.638.i: "Call the Guardia Civil!"
 gaudi.638.j: "Negotiate."
 gaudi.639.t: "Inferior material"
 gaudi.639.d: "The last delivery of material for the Sagrada Família turned out to be poor."
 gaudi.639.f: "The first observation revealed that the stone that had been brought in had porous spots. The master builder therefore rejected the charge without further ado. This would certainly delay construction and incur additional costs, but quality wins out in the end. At the same time, there are some who say that not only should we use the stone for cost and time reasons, but that we should save some of the better building material to use the proceeds... elsewhere."
 gaudi.639.g: "Quality has its price."
 gaudi.639.h: "As if anyone would notice."
 gaudi.640.t: "Sloppy construction"
 gaudi.640.d: "The inferior material has taken its toll: this morning a section of the Sagrada Família collapsed and caused considerable damage."
 gaudi.640.f: "Antoni Gaudí is not amused."
 gaudi.640.g: "Who could have predicted that?"
 gaudi.641.t: "Faster construction progress"
 gaudi.641.d: "The work on the Sagrada Família is progressing better than expected. We expect to be a few months ahead of schedule."
 gaudi.641.f: "Modern technology, fast work processes, material supplies without interruption and good weather favor the construction progress."
 gaudi.641.g: "I have predicted that!"
 gaudi.642.t: "New jobs in Barcelona"
 gaudi.642.d: "The construction of the church led to a large influx of people to Barcelona."
 gaudi.642.f: "As in the Middle Ages, the construction of a large church created many new demands on city life, which often could only be met by new workers. Not only the construction workers themselves have to be recruited. They also depend on restaurants and shops, suppliers and the construction of new apartments, which also have to be built by someone. This has led to an upswing in Barcelona, from which some want to benefit directly or indirectly."
 gaudi.642.g: "A great project needs great people."
 gaudi.643.t: "A large anonymous donation"
 gaudi.643.d: "An unknown, wealthy donor has transferred a significant sum of money that will speed up the construction of the Sagrada Família."
 gaudi.643.f: "For decades, the Sagrada Família was mainly financed by donations. It was thanks to a large anonymous donation shortly before construction began that Antoni Gaudí significantly expanded his building plans and made the Sagrada Família the project it is today. The construction work is still being financed, as originally planned by Josep Maria Bocabella, with donations from foundations and entrance fees. Around 22 million euros are available for construction each year; in 2009 it was 18 million euros."
 gaudi.643.g: "Apparently someone has great concerns about his salvation."
 gaudi.644.t: "[SCOPE.sCharacter('gaudi_ruler').GetFullName] [SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle]의 사그라다 파밀리아 대성당 건설 지지"
 gaudi.644.d: "[SCOPE.sCharacter('gaudi_ruler').GetFullName] [SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle]께서 사그라다 파밀리아 대성당에 지대한 관심을 표하였다."
 gaudi.644.f: "사그라다 파밀리아 대성당의 건설 과정은 공식적으로는 정부의 지원을 전혀 받지 못했다. 스페인 내전 당시에는 급진 좌파 세력이 나서 추가 건설 공사를 막기까지 하였다. 프랑코는 사그라다 파밀리아 대성당에 별다른 관심을 보이지는 않았으나, 그렇다고 딱히 도울 수 있는 것도 아니었다. 가우디는 스페인 가톨릭 사회의 예산으로 공사가 이루어져야 한다고 주장하였다. 그러나 국가 원수의 관심이 있다면 예산 지원이든 지방 정부와의 연줄이든, 숨겨진 경로를 통해 사업을 크게 진전시킬 가능성을 배제할 수는 없다."
 gaudi.644.g: "[SCOPE.sCharacter('gaudi_ruler').GetFullName] [SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle] 만세!"
 gaudi.645.t: "내부 관람"
 gaudi.645.d: "사그라다 파밀리아 대성당은 아직 건설 중에 있지만 진척 속도가 놀랍다. 동맹국 한 곳을 초청해서 이 모든 광경을 보여줄 빌요가 있다."
 gaudi.645.f: "사그라다 파밀리아 대성당은 미완성 건물임에도 방문객들에게 큰 인상을 남기며 상상력을 자극하였다. 대성당의 설계 자체는 호불호가 극히 갈렸다. 가우디의 동료 건축가들은 대체로 긍정적인 평가를 내렸다. 루이스 설리번은 사그라다 파밀리아를 \"지난 25년 간 가장 위대한 창조적 건축. 정신을 석재로 형상화하였다\"라고 극찬을 남겼다. 발터 그로피우스도 건물의 벽체가 \"기술적 완벽성의 경이로움\"이라며 사그라다 파밀리아 대성당에 찬사를 보냈다. 반대로 작가이자 비평가였던 조지 오웰은 \"세상에서 가장 흉측한 건물\"이라고 혹평했다."
 gaudi.645.g: "우리 동맹국을 바르셀로나에 초청하자."
 gaudi.645.h: "공사에 방해만 될 뿐이오."
 gaudi.646.t: "사그라다 파밀리아 대성당 건설 지원?"
 gaudi.646.d: "우리 대사가 초청을 통해 쾰른 대성당 공사 현장을 둘러보게 되었다. 그 과정에서 깊은 감명을 받은 대사는 우리 정부 차원에서 대성당 공사에 헌금하여 국제적 위신을 확보할 것인지 문의해 왔다."
 gaudi.646.f: "사그라다 파밀리아 대성당은 미완성 건물임에도 방문객들에게 큰 인상을 남기며 상상력을 자극하였다. 대성당의 설계 자체는 호불호가 극히 갈렸다. 가우디의 동료 건축가들은 대체로 긍정적인 평가를 내렸다. 루이스 설리번은 사그라다 파밀리아를 \"지난 25년 간 가장 위대한 창조적 건축. 정신을 석재로 형상화하였다\"라고 극찬을 남겼다. 발터 그로피우스도 건물의 벽체가 \"기술적 완벽성의 경이로움\"이라며 사그라다 파밀리아 대성당에 찬사를 보냈다. 반대로 작가이자 비평가였던 조지 오웰은 \"세상에서 가장 흉측한 건물\"이라고 혹평했다."
 gaudi.646.g: "이런 찬란한 사업에 우리도 나서지 않을 수 없군."
 gaudi.646.h: "이런 교회만도 못한 것이 살아있는 괴수였다면 불태워 없애야 마땅하오."
 gaudi.647.t: "동맹국의 헌금"
 gaudi.647.d: "우리 동맹국의 대사가 공사 현장을 둘러본 뒤 큰 감명을 받고, 대성당 공사에 헌금하기로 결정하였다."
 gaudi.647.f: "사그라다 파밀리아 대성당은 미완성 건물임에도 방문객들에게 큰 인상을 남기며 상상력을 자극하였다. 대성당의 설계 자체는 호불호가 극히 갈렸다. 가우디의 동료 건축가들은 대체로 긍정적인 평가를 내렸다. 루이스 설리번은 사그라다 파밀리아를 \"지난 25년 간 가장 위대한 창조적 건축. 정신을 석재로 형상화하였다\"라고 극찬을 남겼다. 발터 그로피우스도 건물의 벽체가 \"기술적 완벽성의 경이로움\"이라며 사그라다 파밀리아 대성당에 찬사를 보냈다. 반대로 작가이자 비평가였던 조지 오웰은 \"세상에서 가장 흉측한 건물\"이라고 혹평했다."
 gaudi.647.g: "진정한 친구는 한눈에 알아보는 법."
 gaudi.648.t: "바르셀로나의 고고학 발굴 조사"
 gaudi.648.d: "바르셀로나를 방문한 [SCOPE.sCharacter('gaudi_archaeologist').GetFullName](이)가 사그라다 파밀리아 대성당이 고대 로마 시대의 유적 위에 들어선 정황을 발견하였다. 이에 당국에 발굴 허가를 요청한 상황이다."
 gaudi.648.f: "바르셀로나는 고대 로마 시절 바르키노(Barcino)라는 이름으로 로마인들이 정착한 곳으로 알려져 있었으나 타라코나 카이사라우구스타 같은 주요 도시에 비해 중요성은 훨씬 떨어졌다. 바르키노라는 이름은 로마 초대 황제 아우구스투스 재위기 말기에 정해졌다. 기원전 133년에 세워진 식민도시인 '콜로니아 파벤티아 율리아 아우구스타 피아 바르키노'(Colonia Faventia Iulia Augusta Pia Barcino)의 줄임말이었던 것이다. 이 식민도시는 퇴역 군인들에게 거주지를 제공하기 위해 건설되었다. 고대 로마의 지리학자 폼포니우스 멜라는 바르키노가 타라고나(타라코)의 지배하에 있는 여러 조그만 정착지 중 하나로 기록하였다. 그럼에도 아우구스타 가도의 한 갈래에 위치한 전략적 요충지로서 바르키노는 경제 발전을 이루었으며 그 덕에 면세 혜택도 누리게 되었다."
 gaudi.648.g: "건설을 그렇게나 오랫동안 중단할 순 없는 노릇이오."
 gaudi.648.h: "고고학계에 있어 특별한 기회가 아닐 수 없군."
 gaudi.649.t: "[SCOPE.sCharacter('gaudi_chief_engineer').GetLastName] just had another idea ..."
 gaudi.649.d: "[SCOPE.sCharacter('gaudi_chief_engineer').GetFullName] has recently surprised the construction management with a change..."
 gaudi.649.f: "Anyone who builds a monster like the Sagrada Família will sooner or later become eccentric - or already is."
 gaudi.649.g: "That's almost as bad as the construction of the Mole Antonelliana..."
 gaudi.650.t: "[SCOPE.sCharacter('gaudi_chief_engineer').GetLastName] accelerates the construction of the Sagrada Família"
 gaudi.650.d: "[SCOPE.sCharacter('gaudi_chief_engineer').GetFullName] has recently surprised the construction management with the building progress."
 gaudi.650.f: "It's good to be the chief engineer."
 gaudi.650.g: "This is almost as gratifying as the construction of Vienna's ring road."
 gaudi.1001.t: "Spread of the Steel Frame in construction"
 gaudi.1001.d: "The invention of Steel Framed Building was not the work of one person alone. It was a slow process. However, [SCOPE.sCharacter('gaudi_engineer_scope').GetFullName], a well known engineer, drives the spread of the invention by constructing buildings of remarkable strength that reach heights never seen before."
 gaudi.1001.f: "The new building, which would house a bank in the future, grew taller day by day. Like a skeleton, the steel framework stood there, waiting to be covered with other material.\nBut its architects were already dreaming of much more than the 10 floors. In the future, 50, maybe even 100 floors would become possible!"
 gaudi.1001.g: "Our towers will finally reach the sky!"
 gaudi.1002.t: "Pavellons Güell"
 gaudi.1002.g: "A truly remarkable Art Style!"
 gaudi.1003.t: "[SCOPE.sCharacter('tesla_new_engineer_scope').GetFullName] wins on the Savio Circuit"
 gaudi.1003.d: "The young [SCOPE.sCharacter('tesla_new_engineer_scope').GetFullName] was first in the Grand Prix Race on the Savio Circuit in Ravenna. Maybe we could nurture this emerging talent somehow?"
 gaudi.1003.f: "The smell of gasoline in the air, the roar of engines, excitement, danger, action, that was why people flocked to car races as spectators.\n\nIn 1923, the young Enzo Ferrari won his first Grand Prix and continued to race until the birth of his son, when he stopped racing himself. But he remained faithful to racing by establishing the Scuderia Ferrari, his own team of car racers."
 gaudi.1003.g: "What a spectacle!"
