 gaudi_radio_mania_modifier: "라디오 열풍"
 gaudi.1002.d: "[SCOPE.sCharacter('gaudi_new_architect_scope').GetFullName] 씨가 구엘 저택의 공사를 마쳤다. 모더니즘 양식의 대농원을 확장한 사업으로 [SCOPE.sCharacter('gaudi_new_architect_scope').GetLastName]의 대표작으로 일컬어지고 있다."
 gaudi.1002.f: "구엘 저택의 철제 대문 위에는 유리 눈알을 박은 철제 용 조각상이 장식되었다. 모든 건물은 모데르니스메 양식으로 설계되어 오리엔탈리즘 디자인의 경향을 띄고 있다.\n\n[SCOPE.sCharacter('gaudi_new_architect_scope').GetLastName](은)는 모데르니스메라는 카탈루냐 고유의 양식을 대표하는 건축가였다. 모데르니스메는 카탈루냐에서 아르누보를 나름대로 해석한 양식으로 볼 수 있으며 카탈루냐의 전통 재료와 기법을 사용한 것이 특징이다. '자연스러움'과 '움직임'은 모데르니스메를 설명하는 가장 핵심적인 단어다. 이런 특징이 가장 잘 드러나는 사례는 구엘 공원이 있는데, 식물과 여타 자연 속의 형상에서 영감을 받은 둥근 형태를 곳곳에 드러내고 있다."
 gaudi.1002.h: "가우디는 장차 큰일을 해낼 사람이다!"
 gaudi_bauhaus_modifier: "바우하우스 건축"
 gaudi.21.t: "건축가 복귀"
 gaudi.21.d: "우리 건축가가 2년 간의 유학을 마치고 돌아왔다. 건축 스케치 뿐만 아니라 새롭게 단련된 모습으로 말이다."
 gaudi.21.f: "제도사로 떠났던 [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U]가 건축가가 되어 돌아왔다.\n\n2년이라는 긴 시간 동안 [ROOT.Var('gaudi_architect_var').GetCharacter.GetFullName](은)는 유럽 곳곳을 누볐다. 롬바르디아의 계곡을 거쳐 맨체스터의 제철소, 부다페스트의 다리 아래까지. 교회 뿐만 아니라 양수장도, 기둥머리와 처마장식 뿐만 아니라 보일러실과 크레인 선착장까지 연구했다. 공과대학 강의실에 앉아 공학자들의 노트를 베껴 쓰고, 리옹의 건설 현장에서 위력이란 끌어내는 것이 아니라 이해하는 것임을 배웠다.\n\n이제 [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U]는 새로운 단어를 쓴다. 하중지지력, 장력구조, 철의 영혼에 관한 것이다. 과거 [ROOT.Var('gaudi_architect_var').GetCharacter.GetSheHe|U]와 함께 지냈던 동료들은 거의 알아보지 못한다. 하지만 그 손은 여전히 그대로, 다만 조금 더 안정되었을 뿐이다. 그 시선은 어떠한가? 벽을 꿰뚫고 있는 것만 같다."
 gaudi.21.g: "건축은 '무엇을 담는가'란 질문에서 출발한다."
