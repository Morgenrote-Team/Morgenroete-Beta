 gaudi_neuschwanstein_phase_2_decision: "노이슈반슈타인성: 동화 속에 나올 법한 성"
 gaudi_neuschwanstein_phase_2_decision_desc: "처음부터 노이슈반슈타인성은 일반에 공개하기 위한 것이 아니라 국왕의 개인 휴식처로 계획되었다. 바이에른의 루트비히 2세는 중세 기독교 신화, 특히 자신이 존경해 마지않아 후원에 아낌없던 리히바르트 바그너의 오페라에서 영감을 받아 성을 설계하였다. 끊임없이 새로운 이상을 추구하고 노이슈반슈타인성을 영원한 오페라 석조 무대로 만들고자 했던 국왕의 열망은 건설을 상당히 지연시키는 결과를 낳았고, 결국 본인을 파산 직전까지 몰아갔다."
 gaudi_custom_tt_trigger_neuschwanstein: "#yellow 바이에른#!이나 바이에른에 수도를 둔 $south_german$ 국가로 플레이"
