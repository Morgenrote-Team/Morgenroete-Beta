 pm_gaudi_magnetic_observatory: "지자기장 관측소"
 je_gaudi_magnetic_observation: "지자기장 관측"
 je_gaudi_magnetic_observation_reason: "카를 프리드리히 가우스는 1832년 괴팅겐에 최초의 지구물리학 관측소를 설립하고 정밀 자기계측기를 구축하였다. 가우스는 자기장 변동의 원인을 파악하고 정자기장을 정확히 측정하기 위해서는 지구상 곳곳에 분산되어 동시에 측정을 실시해야 한다는 사실을 깨달았다. 이러한 목적을 안고 1836년 출범한 지자기 학회와 영국 왕립학회는 측정 데이터를 전달하여 분석할 수 있도록 하였다. 전세계 각지에 분산된 여러 관측소를 이용하여 지자기장의 변동을 동시에 측정하는 것이 그 목표였다.  이 사업에는 유럽 관측소 35곳, 아시아 6곳, 아프리카 2곳, 북미 3곳, 오세아니아 4곳을 비롯하여 총 50곳의 관측소가 참여하였다. 측정 결과는 괴팅겐으로 전송되어 가우스와 빌헬름 베버가 과학적으로 분석하게 되었다."
 je_gaudi_magnetic_observation_goal: "@gaudi_magnetic_data!#O 자기 데이터#! #G 100개#! 수집. 이것은 국제적인 공조로 지자기 학회의 모든 참여국이 기여하게 됩니다."
 tesla_set_magnetic_association_tt: "지자기 학회 창설. 다른 국가도 참여하여 #O 지자기장 관측소#!를 설립해 @gaudi_magnetic_data!#O 자기 데이터#!를 수집할 수 있습니다. 이 데이터는 괴팅겐으로 보내집니다."
 tesla_add_magnetic_association_member_tt: "지자기 학회 가입. 참여국은 @gaudi_magnetic_data!#O 자기 데이터#!를 괴팅겐으로 보내 과학적 결과에 따라 이익을 보게 됩니다."
 tesla_add_x_magnetic_data_minus_x_tt: "@gaudi_magnetic_data!#O 자기 데이터#! [SCOPE.GetValue('magnetic_data_amount')|0+] 상실"
 tesla_add_x_magnetic_data_minus_1_tt: "@gaudi_magnetic_data!#O 자기 데이터#! [SCOPE.GetValue('magnetic_data_amount')|0+] 상실"
 tesla_add_x_magnetic_data_0_tt: "@gaudi_magnetic_data!#O 자기 데이터#! 0 획득"
 tesla_add_x_magnetic_data_plus_1_tt: "@gaudi_magnetic_data!#O 자기 데이터#! [SCOPE.GetValue('magnetic_data_amount')|0+] 획득"
 tesla_add_x_magnetic_data_plus_x_tt: "@gaudi_magnetic_data!#O 자기 데이터#! [SCOPE.GetValue('magnetic_data_amount')|0+] 획득"
 gaudi_geomagnetical_knowledge_modifier: "지자기학 지식"
 gaudi.1401.t: "지자기 학회의 신규 회원"
 gaudi.1401.d: "[GetPlayer.MakeScope.GetVariable('tesla_engineer_var').GetCharacter.GetFullName](이)가 오늘 괴팅겐의 지자기 학회에 가입하였다. 다른 회원들은 그를 따뜻하게 맞이해 주었다."
 gaudi.1401.f: "이번 가입으로 [GetPlayer.MakeScope.GetVariable('tesla_engineer_var').GetCharacter.GetLastName] 박사는 지자기 관측소를 마련하여 운영할 필수적인 지식들을 습득할 수 있게 되었다. 학회장은 우리 공학자에게 관측소와 자력측정기의 설계도를 제공해 주었다. 관측소 착공을 조속히 개시하고, 최초의 관측 자료를 괴팅겐으로 보낼 수 있도록 학회 전원이 지원한다는 방침이다."
 gaudi.1401.g: "지금 즉시 관측소를 지어야겠소."
 gaudi.1402.t: "지자기장 관측소 완공"
 gaudi.1402.d: "지자기장 관측소의 건설이 오늘 마무리되었다. 지난 몇 달 간 축적된 수많은 데이터는 괴팅겐으로 보내질 것이다."
 gaudi.1402.f: "측정 자료는 지자기장의 과학적 연구를 수행할 뿐만 아니라 실용적 측면도 갖추고 있다. 자기편차도는 예로부터 사용되어 오늘날 선박 항해와 항공 운항에도 여전히 활용되고 있다. 또한 광석이나 석유 매장지와 같은 원자재 탐사에도 지자기 측정 자료는 필수적이다."
 gaudi.1402.g: "지자기학을 위하여!"
 gaudi.1403.t: "지자기 측정 자료의 국제적인 수집 결과"
 gaudi.1403.d: "수년 동안 전세계의 지자기 측정 자료를 수집하고 비교한 결과, 괴팅겐의 연구원들은 흥미로운 결과를 도출할 수 있었다."
 gaudi.1403.f: "1839년 가우스는 지구의 자기장이 지구 내부에서 온 것이 대다수이며, 작고 단기적인 변화는 외부에서 비롯된다는 사실을 밝혀냈다. 가우스는 베버와 함께  〈자기 협회의 관측 결과〉라는 제목에 총 6권 분량으로 연구 결과를 출간하였다. 별권에 실린 지도에는 당시 지구상의 모든 위치에서 수집된 자기 측정 자료를 보여주고 있다. 이 지도에는 동일한 편각, 동일한 경사, 동일한 자기장 세기를 나타내는 지점들이 선으로 연결되어 있다. 이 출판물은 자연과학 발전사에 있아 하나의 이정표가 되었다."
 gaudi.1403.g: "인상적인 성과로군."
 gaudi.1404.t: "해양에 흥미를 느끼다"
 gaudi.1404.d: "[SCOPE.sCharacter('gaudi_admiral_scope').GetFullName] 측에서 [GetPlayer.MakeScope.GetVariable('tesla_engineer_var').GetCharacter.GetFullName]의 지자기장 연구에 큰 관심을 표했다. 현재 건설 중인 지자기장 관측소에서 실험에 나서 성공을 거두었다고 한다."
 gaudi.1404.f: "\"개구리 다리 가지고 나는 도대체 뭘 하고 있는 거지? 아, 그건 아무것도 아니었구나, 정말 아무것도 아니었어...\""
 gaudi.1404.g: "새로운 지식은 본인에게 도움이 될 것이다."
 gaudi.1404.h: "이 지식은 모두에게 이익이 되어야 한다."
 gaudi.1405.t: "변칙"
 gaudi.1405.d: "측정을 다시 진행했음에도 [GetPlayer.MakeScope.GetVariable('tesla_engineer_var').GetCharacter.GetLastName] 박사가 기록한 지구의 자기장 수치는 예상했던 것과 거의 일치하지 않았다. 박사는 그 이유를 아직 밝혀내지 못하고 있다."
 gaudi.1405.f: "특정 장소의 지자기장이 다른 지역과 유독 다른 이유는 다양할 수 있다. 이러한 현상은 해당 지역에 대규모 금속 매장지가 있을 가능성을 시사하는 경우가 많았다. 이것이 바로 지자기 연구가 광업계의 관심을 끌지 않을 수 없었던 이유다."
 gaudi.1405.g: "그 자료를 괴팅겐에 보냅시다."
 gaudi.1406.t: "지자기장 관측소에 자문을 구하는 천문학자"
 gaudi.1406.d: "[GetPlayer.MakeScope.GetVariable('tesla_engineer_var').GetCharacter.GetFullName] 박사와 [GetPlayer.MakeScope.GetVariable('verrier_astronomer_var').GetCharacter.GetFullName] 박사가 새로 들어선 지자기 관측소를 둘러보던 중에 열띤 대화를 펼쳤다. 두 사람의 교류는 [GetPlayer.MakeScope.GetVariable('verrier_astronomer_var').GetCharacter.GetLastName]의 과학적 지식을 대폭 확대하는 계기가 되었다."
 gaudi.1406.f: "\"잼을 바른 빵이 항상 잼을 바른 면 쪽으로 바닥에 떨어지는 이유가 바로 그것 때문이었군!\""
 gaudi.1406.g: "이것으로 그분의 실용적인 연구에 보탬이 되겠지."
 gaudi.1406.h: "이것으로 그분의 이론적인 연구에 보탬이 되겠지."
 pmg_gaudi_communication: "통신 시설"
 pm_gaudi_no_communication: "통신 없음"
 pm_gaudi_telegraph_office: "전신국"
 gaudi_building_telegraph_network_modifier: "전신으로 연결된 전국"
 gaudi_telegraphy_network_modifier: "국립 전신망"
 gaudi_mocked_by_telegram_modifier: "전신으로 조롱받다"
 je_gaudi_telegraphy_network: "전신망 건설"
 je_gaudi_telegraphy_network_reason: "원칙적으로 전신국은 철도가 깔린 지역에만 설치할 수 있다. 전신주가 철로를 따라 설치되고 열차 운행 체계의 관제에도 대단히 중요하기 때문이다. 새로운 전신국을 개설하는 데에는 약 1년이 소요되지만, [concept_tesla_engineer]가 있다면 설치 과정을 단축할 수 있다. [concept_tesla_electrical_engineer]가 있다면 설치를 훨씬 더 빨리 앞당길 수 있다. 전자기학 기술을 개발하는 것도 사업 진행에 긍정적인 영향을 끼친다. 해외 국가나 월경지에 전신국을 설치하는 데에도 전자기학 기술을 해금하여야 한다. 그렇지 않으면 전신국은 다른 전신국과 국경을 접하는 주에만 건설할 수 있다."
 gaudi.1411.t: "전국 전신망"
 gaudi.1411.d: "오늘 [GetPlayer.MakeScope.GetVariable('tesla_engineer_var').GetCharacter.GetFullName] 박사는 [GetPlayer.GetName](을)를 하나로 묶을 신규 전신망 구축 계획을 우리 측에 제출하였다. 이것으로 온 국민들이 이전보다 훨씬 더 가까워질 것이다."
 gaudi.1411.f: "1837년 새뮤얼 모스는 기록식 전기 전신을 발명하고 특허를 취득하였다. 모스의 조교였던 알프레드 베일은 수신 메시지를 기록하는 장치인 레지스터를 개발하였다. 레지스터의 작동 원리는 전자석으로 움직이는 바늘을 사용하여 움직이는 종이 테이프에 점과 선을 새기는 방식이었다. 이후 모스와 베일은 전신용 신호 체계를 개발하였는데 이를 모스 부호라고 부른다. 미국 최초의 전보는 1838년 1월 11일 뉴저지주 모리스타운 인근 스피드웰 제철소에서 모스 본인이 직접 2마일(3km) 길이의 전선을 통해 보냈다. 다만 '하나님께서 행한 일이 무엇이냐'(WHAT HATH GOD WROUGHT)라는 유명한 전보는 그 이후인 1844년 워싱턴 D.C.의 국회의사당에서 볼티모어의 마운트 클레어 구 역사로 보냈던 문구다."
 gaudi.1411.g: "..-. .. -. . (좋아)"
 gaudi.1412.t: "전신망 구축 중단"
 gaudi.1412.d: "정부가 전신망 확장 사업을 즉시 중단하라는 명령을 내렸다."
 gaudi.1412.f: "오늘 발효된 시행령에 따라 지금부터 모든 구축 사업이 중단에 들어가게 되었으며 그 전문은 다음과 같다.\n\n-.-. --- -. ... - .-. ..- -.-. - .. --- -. / ... - --- .--. --..-- / -. --- .-- -.-.--"
 gaudi.1412.g: "지금 구축 사업을 완료해야 한다."
 gaudi.1413.t: "전신망 구축 완료"
 gaudi.1413.d: "과거에는 접근하기 힘들었던 지역에 마지막 전신주를 세우는 기념식이 오늘 개최되었다. 이제 우리나라 전역이 전국 전신망으로 연결되어, 나라의 한쪽 끝에서 다른 쪽 끝까지 전보를 보낼 수 있게 되었다."
 gaudi.1413.f: "전국을 하나의 전신망으로 연결하는 것은 실로 엄청난 과업이다. 국제 전신망과 연결되는 것은 물론 국내외 통신 교류를 크게 활성화할 것이다. 물론 이것이 끝이 아니다. 앞으로 우리나라에 아직 전신망이 설치되지 않는 지역이 생긴다면 그곳에도 전신국을 설치하여야 할 것이다. 그리고 언젠가는 전신선을 쓰지 않고도 전보를 주고받을 방법이 개발될지도 모른다."
 gaudi.1413.g: "..-. .- -. - .- ... - .. -.-. (환상적이야)"
 gaudi.1414.t: "전신으로 하나된 대학교들"
 gaudi.1414.d: "[SCOPE.sState('gaudi_university_state_1').GetName] 지역과 [SCOPE.sState('gaudi_university_state_2').GetName] 지역의 두 대학이 이제부터 직통 전신선으로 연결된다. 학계에서는 이를 통해 교류가 한층 더 활발해지기를 기대하고 있다."
 gaudi.1414.f: "\"현대과학의 놀라운 업적 가운데서도 단연코 가장 위대하고 인류에게 유익한 것이라면 전선을 꼽을 수 있다 ... 지구 전체가 전류로 뒤덮이고, 인간의 생각과 감정이 고동칠 것이다 ... 그렇다면 전신은 세계 문명에 얼마나 강력한 힘이 될 운명인가! 전신은 생명의 끈으로 지구 만방의 온 나라를 하나로 묶는다. 만국의 서로 간에 생각을 교환할 수 있는 이런 도구가 만들어진 이상, 오랜 편견과 적대감은 더 이상 설 자리가 없을 것이다.\" - 오거스터스 매버릭"
 gaudi.1414.g: "이것으로 기술 연구가 강화될 것이다."
 gaudi.1414.h: "이것으로 자연 연구가 강화될 것이다."
 gaudi.1414.i: "이것으로 고고학 연구가 강화될 것이다."
 gaudi.1415.t: "이웃 국가에 보낼 전보"
 gaudi.1415.d: "[SCOPE.sState('gaudi_our_telegraph_state').GetName]의 전신국이 이웃한 [SCOPE.sState('gaudi_neigbour_telegraph_state').GetName](와)과 연결되었다. 이제 이웃 국가로 전보를 보낼 수 있게 된 것이다."
 gaudi.1415.f: "전보는 국가 간의 이해와 관계 개선에 공헌할 수 있다. 허나 모든 전보가 다 그런 것은 아니다."
 gaudi.1415.g: "우호적인 전보를 보내어 양국 관계를 강화하자."
 gaudi.1415.h: "장난스러운 전보를 보내어 저들의 국가원수를 골탕 먹이자."
 gaudi.1416.t: "이웃 국가에서 보내온 전보"
 gaudi.1416.d: "우리 이웃 국가 [SCOPE.sCountry('gaudi_telegram_country').GetName]에서 이웃한 주에 전신선을 세워 우호적인 전보를 보내왔다."
 gaudi.1416.f: "\"친애하는 이웃 분께.\""
 gaudi.1416.g: "전보를 보냈다고? 우리한테? 우리도 답장합시다!"
 gaudi.1417.d: "오늘 [SCOPE.sCountry('gaudi_telegram_country').GetName]에서 처음으로 공식 전보를 보내왔다. 그 내용으로 보건대 아무래도 우릴 놀려먹을 작정인 것 같다!"
 gaudi.1417.f: "\"[SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('gaudi_ruler').GetFullName] 벼룩 있다.\""
 gaudi.1417.g: "이건 장난성 전보인가?"
 gaudi_building_radio_network_modifier: "모두를 위한 라디오 방송국"
 gaudi_radio_network_modifier: "라디오 방송망"
 je_gaudi_radio_network: "라디오 방송망 건설"
 je_gaudi_radio_network_reason: "전국 어디든 철도가 놓인 곳이라면 라디오 방송국을 설치할 수 있으며, 사전에 전신망을 따로 구축할 필요는 없습니다. 신규 라디오 방송국을 건설하는 데이는 1년의 시간이 소요되며, [concept_tesla_engineer]가 참여하면 시간이 단축됩니다. 공학자가 [concept_tesla_electrical_engineer]라면 완공 시점이 더욱 앞당겨집니다."
 gaudi.1421.t: "라디오 방송망"
 gaudi.1421.d: "무선 통신수단의 발명은 기적을 현실로 만들었다. 이제부터 적절한 기술 장비만 갖춰진다면 송신탑 없이도 어느 지역에서건 다른 곳으로 전하고픈 바를 전할 수 있게 되었다."
 gaudi.1421.f: "1897년 카를 페르디난트 브라운이 무선 통신기술의 선구자 대열에 섰다. 브라운은 송신기의 발전부에 폐쇄형 동조회로를 추가하고, 유도결합을 통해 송신부(안테나)와 분리하였으며, 훗날 수신부에 수정발진기를 활용한 것이 대표적인 기여로 꼽힌다. 브라운 박사는 1898년부터 무선 전신에 전념하였으며 그 후 수년 동안 무선 전신의 문제해결에 거의 모든 시간을 보냈다. 무선 통신 분야에 관한 저술 활동도 활발하였으며, 《전기기술》(Electrician)을 비롯한 여러 과학 저널에 기고하여 이름을 알렸다. 1899년에는 '표면을 통한 무선 전기 신호 전송'에 관한 특허를 출원하였다."
 gaudi.1421.g: "온 동네에 안테나를!"
 gaudi.1422.t: "라디오 방송망 구축 중단"
 gaudi.1422.d: "신규 안테나와 라디오 방송국 구축 사업이 잠시 동안 중단되었다. 사업은 [concept_tesla_electrical_engineer]가 있다면 언제든 재개할 수 있다."
 gaudi.1422.f: "\"내가 세상에 좋은 일을 하였는가, 아니면 해만 끼쳤는가?\" - 굴리엘모 마르코니"
 gaudi.1422.g: "지금 구축 사업을 완료해야 한다."
 gaudi.1423.t: "라디오 방송망 구축 완료"
 gaudi.1423.d: "[GetPlayer.GetName]의 물리학자와 공학자들이 전국을 무선으로 연결하는 데 성공였다는 자랑스러운 소식을 발표하였다!"
 gaudi.1423.f: "\"가장 큰 문제는 그 발상이 너무나 기초적이고 논리적으로 너무나 단순해서, 다른 누구도 그것을 실천에 옮길 생각을 하지 못한 것이 믿기지 않는다는 점이다.\" - 굴리엘모 마르코니"
 gaudi.1423.g: "라디오에 귀 기울입시다!"
 gaudi.1424.t: "최초의 라디오 프로그램"
 gaudi.1424.d: "[SCOPE.sState('gaudi_radio_state').GetName]에서 민영 라디오 프로그램이 처음 방송을 개시하면서 라디오라는 새로운 매체에 대한 관심이 급격히 늘고 있다. 인근의 공장은 그에 따른 소비 급증에 대비하기 위해 자체적인 생산 효율 개선에 나섰다."
 gaudi.1424.f: "1909년 세계 최초의 뉴스 방송국이 14와트 출력으로 정규 프로그램 방송에 들어갔다. 그 주인공은 미국 캘리포니아 산호세에 위치한 방송국으로, 물리학자 찰스 '닥' 헤럴드와 그가 가르치는 무선공학대학 재학생들이 설립한 것이다. 1921년 상업 방송국으로 전환한 이 방송국은 KQW라는 방송식별부호를 부여받았고, 이후 CBS로 인수되었다."
 gaudi.1424.g: "집집마다 라디오를?"
 gaudi.1425.t: "라디오 선전"
 gaudi.1425.d: "정치와 선전도 기술 발전과 함께 변화한다. [SCOPE.sCharacter('gaudi_opposition_leader').GetFullName] 대표는 당 지지자들이 매일 듣는 소규모 라디오 채널을 개국하였다. 이전에는 정치에 관심 없었던 사람들조차 해당 방송에 관심을 보이고 있다."
 gaudi.1425.f: "\"안녕하세요오 청취자 여러분. 아침 방송을 보내드립니다. 금요일 오후에 축구팀 선발전이 있지요. 물론 [SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle]께서 최악의 상태로 방치된 축구장을 손 봐 주신다면 말이지요. 제가 질문 하나 드리려고 합니다. [SCOPE.sCharacter('gaudi_ruler').GetFullName]께서 실제로 하는 일이 뭡니까? [SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle]의 직함을 누리고 있지 않습니까? 그분께서 지닌 저의는 무엇입니까? 모두에게 거짓말을 하고 있나요? 아니면 본인이 거짓인 건가요? 이런 질문들을 또 보지 않을 수 없지요. 더군다나 [SCOPE.sCharacter('gaudi_ruler').GetFullName]에게 표를 던진 사람이 있긴 합니까? 저는 안 뽑았는데 말이지요. 뽑았던 사람이 있다면 지금쯤 머리를 긁적이며 '아, 내가 그러지 말았어야 했는데' 하실 겁니다. 저는 내각 사람이 아니라 여러분 같이 평범한 사람입니다. 또 여러분과 마찬가지로 저는 무슨 일이 벌어지고 있는가를 알고 싶을 뿐입니다... 이 나라에 말이지요.\""
 gaudi.1425.g: "그런 라디오 방송국은 폐국시키시오!"
 gaudi.1425.h: "우리는 자유로운 국가이니 방송도 자유롭게 할 수 있소."
 gaudi.1426.t: "A disturbing Radio Play"
 gaudi.1426.d: "One of the first radio plays on a radio show caused mass panic among uninformed listeners because they thought the fictional story was part of the news reporting."
 gaudi.1426.f: "'This is Orson Welles, ladies and gentlemen, out of character, to assure you that The War of the Worlds has no further significance than as the holiday offering it was intended to be; The Mercury Theatre's own radio version of dressing up in a sheet and jumping out of a bush and saying 'Boo!' Starting now, we couldn't soap all your windows and steal all your garden gates by tomorrow night, so we did the next best thing. We annihilated the world before your very ears and utterly destroyed the CBS. You will be relieved, I hope, to learn that we didn't mean it, and that both institutions are still open for business. So goodbye everybody, and remember please for the next day or so the terrible lesson you learned tonight. That grinning, glowing, globular invader of your living room is an inhabitant of the pumpkin patch, and if your doorbell rings and nobody's there, that was no Martian, it's Halloween.' -Orson Welles"
 gaudi.1426.g: "An alien invasion? And people believed that?"
 gaudi.1426.h: "Good thing we were prepared!"
 gaudi.1420.t: "대서양 횡단 케이블"
 gaudi.1420.d: "이제 대서양 횡단 케이블이 뉴펀들랜드와 아일랜드의 두 지역을 연결하게 되었다. 양 대륙 간에 최초의 전보가 전달된 것이다."
 gaudi.1420.f: "\"이것은 전쟁터에서 승리자가 거둔 그 어떤 승리보다 더 영광이요, 인류에게 훨씬 더 이익이 되는 승리다. 하늘의 축복 아래 대서양 전신이 세계 한가족의 영구한 평화와 우정의 유대가 되고, 하느님의 섭리에 따라 종교와 문명, 자유, 법치를 전 세계에 전하는 도구가 되기를 바란다.\" - 제임스 뷰캐넌"
 gaudi.1420.g: ".... . .-.. .-.. --- -.-.-- (안녕하시오!)"
 gaudi.1430.t: "대서양 횡단 송신"
 gaudi.1430.d: "인류의 진보에 위대한 성취가 이루어졌다. 오늘 처음으로 무선 메시지가 대서양을 건너 송신된 것이다!"
 gaudi.1430.f: "-s-"
 gaudi.1430.g: "그게 정말 작동한단 말인가? 전갈을 공중으로 보낸다고?"
 je_gaudi_transatlantic_cable: "대서양 횡단 케이블"
 je_gaudi_transatlantic_cable_reason: "대서양 양쪽에 전신국이 설치되면 유럽과 아메리카를 더욱 가까이 잇는 해저 전신 케이블의 부설이 가능해진다."
 je_gaudi_transatlantic_radio: "대서양 횡단 송신"
 je_gaudi_transatlantic_radio_reason: "마법처럼 들리겠지만 첨단 기술을 동원하면 전신선 없이도 대서양을 건너 메시지를 훨씬 더 쉽게 전할 수 있다. 이것으로 케이블이 계속해서 끊어지고 통신 차단을 일으키는 문제를 해결할 것이다."
