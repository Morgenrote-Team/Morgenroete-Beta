 gaudi_no_campanile_modifier: "산 마르코 종탑 복원 무산"
 je_gaudi_rebuild_campanile: "있던 자리에 옛 모습 그대로"
 je_gaudi_rebuild_campanile_reason: "베네치아를 상징하던 산 마르코 종탑이 붕괴한 이래 유력 인사들은 종탑을 원래 모습 그대로 복원하는 것에 반대하는 목소리를 높여왔다. 옛 모습대로 복원하는 것에는 시간과 비용이 많이 소요될 전망이다."
 je_gaudi_rebuild_campanile_goal: "#E 건설 진행도#!가 #BLUE 120점#! 도달. 현재 #G [GetGlobalVariable('gaudi_campanile_progress').GetValue]#!점을 보유하고 있습니다. 보통 달마다 1점씩 획득합니다."
 gaudi.70.t: "종탑의 붕괴"
 gaudi.70.d: "베네치아를 상징하는 건축으로 꼽히던 산 마르코 종탑이 무너졌다. 베네치아 시민 뿐만 아니라 온 국민이 이번 붕괴 사태에 슬퍼하고 있다. 앞으로의 재건 방향은 아직 완전히 정해지지 않았다."
 gaudi.70.f: "산 마르코 종탑은 이탈리아 베네치아의 산 마르코 광장에 위치한 산 마르코 대성당의 종탑이다. 베네치아에서도 가장 인지도가 높은 건축물로 꼽힌다. 1902년 7월, 종탑의 북쪽 면에 위험한 균열이 처음 나타났다. 이후 며칠 동안 그 균열이 조금씩 커져가다 결국 7월 14일 월요일 오전 9시 45분 경, 종탑이 완전히 붕괴함과 동시에 기단부의 로게타도 무너지고 말았다. 놀랍게도 관리인의 고양이를 제외하면 사망자는 아무도 없었다. 붕괴로 인한 피해 역시 종탑의 위치 상 비교적 한계가 있었다. 로게타를 제외하면 마르치아나 도서관의 구석면이 붕괴되었을 뿐이었다. 법전을 읽어내려가던 거대한 반암 기둥인 피에트라 델 반도는 성당 자체를 보호하는 역할을 하였다. 그럼에도 불구하고 옛 이탈리아 문화의 가장 위대한 상징으로 꼽히던 것이 무너져 내린 것을 놓고 이탈리아 전국으로 논란이 확산되었다."
 gaudi.70.g: "종탑을 재건한다. 있던 그 자리에, 옛 모습 그대로."
 gaudi.70.h: "새로운 종탑을 건설한다!"
 gaudi.70.i: "그런 것을 지을 여유는 없다."
 gaudi.71.t: "종탑 재건"
 gaudi.71.d: "베네치아의 새로운 산 마르코 종탑이 오늘 엄숙한 제막식과 함께 정식으로 모습을 드러냈다. 옛 종탑과 벽돌 하나하나까지 똑같이 지어진 종탑의 귀환을 온 베네치아 시민들이 축하하고 있다."
 gaudi.71.f: "새로운 종탑은 1912년 4월 25일 성 마르코의 축일을 겸하여 준공되었다. 이 날은 원래 종탑이 세워졌다고 전해지는 날로부터 정확히 1000년 뒤의 시점이기도 하다."
 gaudi.71.g: "대감이 돌아왔다!"
 gaudi_captain: "함장"
 gaudi_nemo: "네모"
 gaudi_nautilus_modifier: "움직임 속의 움직임"
 gaudi_nautilus_strikes_modifier: "반제국주의적 복수"
 gaudi_nemo_button: "괴물 사냥"
 gaudi_nemo_button_desc: "경험 많은 자연학자가 주도하는 소수 인원 탐사대를 보내면 미지의 괴물이 초래하는 위험에 대해 더 많은 정보를 알아내는 데 보탬이 될 것입니다."
 je_gaudi_nemo: "해저 이만 리"
 je_gaudi_nemo_reason: "거대한 일각고래라는 증언이 존재하는 정체불명의 바다 괴물이 상선들을 공격하고 항구까지 덮쳐오고 있다. 자연학자의 도움을 받으며 탐사대를 파견하면, 괴물의 정체에 대해 알아보는 한편으로 그것을 막을 수 있을지도 모른다."
 gaudi.80.t: "발할라 전당"
 gaudi.80.d: "바이에른 레겐스부르크 인근에 발할라 전당이 완공되면서, 바이에른은 위대한 독일의 천재들을 흉상으로 제작해 전시하고 기리는 공간을 마련하게 되었다."
 gaudi.80.f: "발할라 전당은 바이에른 마르크트도나우슈타우프의 브레우베르크에 위치한 기념관이다. 1830년부터 1842년까지 바이에른 국왕 루트비히 1세의 명으로 건축가 레오 폰 클렌체가 설계하여 지었다. 1806년 신성로마제국이 해체되고 오늘날 독일의 대부분 지역이 나폴레옹의 직접적 영향권에 들어가면서 '독일 최악의 망신'을 맞이하였을 당시, 왕세자 신분이던 루트비히는 '독일의 찬란한 위인들'의 흉상을 제작하라는 명을 내렸다. 전당 3층의 첫째 비문에 명시된 바와 같이 1807년 1월 루트비히는 이미 위대한 독일인 50인을 기리는 전당을 최대한 빨리 건설한다는 결단을 내렸다. 1825년 루트비히가 왕위를 이어받을 당시 총 60점이 이미 완성된 상태였으나, 건물을 지을 부지는 아직 확정하지 못했다. 발할라 전당은 그리스 아테네의 파르테논 신전을 본보기로 삼아 도리아식 페리프테로스 양식의 그리스 신전 형태로 지어졌다."
 gaudi.80.g: "독일의 작곡가를 기리시오."
 gaudi.80.h: "독일의 문학가를 기리시오."
 gaudi.80.i: "독일의 화가를 기리시오."
 gaudi.90.t: "정체불명의 고래, 선박 침몰시켜!"
 gaudi.90.d: "처음에는 선원들의 미신으로 치부되었던 목격담이 점점 더 많아지면서 더는 무시할 수 없는 수준에 이르렀다. 요약하자면 여러 기간에 걸쳐 수많은 배가 바다 한가운데서 '거대한 괴물'을 마주쳤는데, 기다랗고 방추형으로 생긴 것이 때때로 형광빛을 내뿜고, 어떤 고래보다도 빨랐다는 것이었다.\n\n지난 한 해 동안 여러 척의 상선이 바다에서 침몰했는데, 이것이 지금껏 발견되지 않은 거대 고래의 소행이라 믿는 사람들이 많다."
 gaudi.90.f: "그 환영이란 것에 관한 사실로는 물체랄지 생물의 형체, 지칠 줄 모르는 빠른 움직임, 놀라운 운동 실력, 특이한 생명력을 지닌 듯한 모습 등 대부분의 측면에서 일치하였다. 그것이 고래류라면 당대 학계에 알려져 있던 모든 고래류를 능가하는 크기일 터이다. 여러 시기에 걸쳐 이루어진 관찰 결과를 종합적으로 고려해 볼 때, 신비로운 존재는 당대 어류학자들이 인정하던 모든 크기를 훨씬 뛰어넘는다고 결론지을 수 있을 듯하다."
 gaudi.90.g: "그렇다고 그게 정말 고래일까?"
 gaudi.91.t: "정체불명의 고래, 다시 공격에 나서!"
 gaudi.91.d: "정체 모를 괴수가 또다시 습격에 나섰다! 상선 업계 전체가 두려움에 떨고 있는 실정이다."
 gaudi.91.f: "공학자들은 건독에 정박시켜 둔 스코샤호를 찾아가 그 상태를 보고는 도저히 믿지 못했다. 수면 아래 2.5야드(2.28m) 지점에 이등변삼각형 모양의 찢어진 자국이 규칙적으로 나 있었기 때문이다. 철판에 난 균열은 너무나 깔끔하게 윤곽이 드러나 있어, 펀치로 뚫더라도 이렇게 정교한 무늬를 낼 수가 없었다. 따라서 구멍을 낸 도구는 일반적인 것이 아니라는 게 분명해졌다. 그 도구는 엄청난 힘으로 1⅜인치(3.5cm) 두께의 철판을 뚫고 들어간 뒤, 도무지 설명할 수 없는 역행 운동으로 빠져나온 것이었다."
 gaudi.91.g: "공해의 평화를 해치는 이런 악랄한 행위를 반드시 종식시켜야 한다!"
 gaudi.92.t: "정체불명의 고래, 해안가를 습격!"
 gaudi.92.d: "고래인지 뭔지 모를 것이 항구 도시를 습격하여 파괴의 흔적을 남기고 사라졌다."
 gaudi.92.f: "판단력이 부족한 사람들이 지지했던, 떠다니는 섬이라는 설과 다가가기 어려운 모래톱이라는 설은 폐기되고 말았다. 더욱이 그런 암초에 기계 장치라도 달려 있지 않은 이상, 어떻게 그렇게 놀라운 속도로 위치를 바꿀 수 있었겠는가? 동일한 이유로 거대한 난파선의 떠다니는 선체라는 추측도 폐기되었다.\n\n그렇다면 이 문제를 해결할 방안은 두 가지만 남았고, 그것으로 사람들의 여론도 둘로 팽팽히 나뉘었다. 한쪽은 엄청난 위력을 자랑하는 괴물이라는 사람들, 다른 한쪽은 엄청난 추진력을 지닌 잠수함이라는 사람들이었다."
 gaudi.93.t: "교수와 괴물"
 gaudi.93.d: "[SCOPE.sCharacter('dubois_naturalist_scope').GetFullName] 씨가 최근 정체불명의 생명체가 저지른 범죄 행각에 관하여 수소문한 뒤, 그 괴물을 찾아 나설 용감한 수색대를 꾸리기로 하였다."
 gaudi.93.f: "\"저 바다 깊은 곳은 우리에게 순전히 미지의 영역으로 남아 있다. 그곳에 소리는 닿지 않는다. 그 깊은 바닷속에서 무슨 일이 벌어지는가, 수면 아래 12~15마일 (19~24km) 깊이에 어떤 생명체가 살고 있는가, 아니면 살 수는 있는가, 그 동물들의 구성은 어떠한가, 우리는 짐작조차 어렵다. 그러나 본인에게 제시된 이 문제의 해결책은 이도저도 못하는 형세를 바꿀 수도 있다. 우리 지구에 자생하는 모든 다양한 생명체들을 우리들은 잘 알고 있는가, 알지 못하는가다. 우리가 전부 알지 못하고 있다면, 다시 말해 아직 우리가 알지 못하는 어류학에 관한 비밀이 숨어 있다면, 수심 측정이 불가능한 심해층에서 살아남기 위하여 제 모습을 갖춘 생물, 혹은 다른 종류의 고래류, 심지어는 새로운 종의 존재를 인정하는 것보다 더 이성적인 설명은 없을 것이며, 그러한 생물은 기상천외하거나 변덕스러운 사건으로 오랜 시간 동안 해수면 위로 올라왔을 가능성도 있다.\""
 gaudi.93.g: "행운을 빌겠소!"
 gaudi.94.t: "[SCOPE.sCharacter('dubois_naturalist_scope').GetLastName]의 실종!"
 gaudi.94.d: "바다 괴물의 정체를 조사하려던 탐사선이 습격을 당하고 말았다. [SCOPE.sCharacter('dubois_naturalist_scope').GetFullName] 교수가 괴물과 분투하는 과정에서 갑판에서 떨어지고 말았다! 며칠 동안 이어진 수색에도 교수를 찾지 못했다."
 gaudi.94.f: "\"그 순간, 선수의 난간에 기대어 있던 나는 아래쪽에 네드 랜드가 한 손으로는 마팅게일(후방 버팀줄)을 쥐고, 다른 한 손으로는 무서운 작살을 휘두르며, 움직이지 않는 물고기로부터 불과 6미터 남짓 떨어진 곳에 서 있는 것을 보았다. 랜드는 갑자기 팔을 쭉 뻗으며 작살을 던졌다. 나는 작살이 단단한 물체에 부딪히는 듯한 굉음을 들었다. 전등이 갑작스레 꺼지고 거대한 물기둥 두 개가 프리깃함의 함교 위로 솟구쳐 올라와, 선수에서 선미까지 급류처럼 쏟아져 내리며 사람들을 넘어뜨리고 돛대를 묶던 밧줄을 끊어버렸다. 무서운 충격이 뒤따랐고, 나는 난간 너머로 튕겨 나가 몸도 가누지 못한 채 바다에 빠졌다.\""
 gaudi.94.g: "안돼! [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] 교수만은 안 된단 말이다!"
 gaudi.95.t: "[SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] 교수, 해안으로 떠밀려 오다!"
 gaudi.95.d: "유명 박물학자인 [SCOPE.sCharacter('dubois_naturalist_scope').GetFullName] 교수가 오늘 해안가로 밀려온 채 발견되었다. 교수는 공해에 숨어서 선박들을 집어삼키는 것으로 전해지는 정체불명의 고래에 숨겨진 진실을 찾아내기 위해 파견된 탐사선에 합류하였다가 얼마 동안 실종된 상태였다. 교수는 자신이 겪은 심오한 경험에 충격받은 모습이었으며, 실로 인상깊은 이야기를 전해 주었다. [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] 교수가 전한 바에 따르면 탐사선과 생명체가 근접 조우하던 순간에 배 밖으로 쓸려 나갔는데, 알고 보니 생명체가 아니라 인간이 만든 배로서 수중 항해가 가능하다고 한다. [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] 교수는 그 배를 조종하는 (혹은 조종했던) 사람은 자유를 사랑하는 자경단원으로, 육지와의 모든 접촉을 끊고 본인만의 배를 타고 세계의 바다에서 자유로운 삶을 살기로 맹세한 사람이었다고 밝혔다. 진실이 어떻던 간에 [SCOPE.sCharacter('dubois_naturalist_scope').GetLastName] 교수는 그 이상한 배에 손님으로 승선하여 항해하는 동안 마주했다는 처음 보는 여러가지 기이한 생명체에 관하여 상세한 설명을 전해주면서, 앞으로 수년간 조국의 과학 연구에 큰 보탬이 되어줄 것으로 보인다."
 gaudi.95.f: "\"그것은 틀림없이 거대한 일각고래, 그것도 전기로 움직이는 일각고래였소.\" - [SCOPE.sCharacter('gaudi_nemo_scope').GetFullName]"
 gaudi.95.g: "그런데 네모 선장이 정말로 패했단 말이오?"
 gaudi.1004.t: "괴팅겐 지자기 학회"
 gaudi.1004.d: "유명 천문학자이자 수학자인 카를 프리드리히 가우스와 물리학자 빌헬름 에두아르트 베버가 지구의 자기장을 연구하는 국제 학회를 창설하였다."
 gaudi.1004.f: "지자기학회 (괴팅겐 지자기학회)는 1830년대에 독일 괴팅겐에서 창설된 연구 단체이다. 지자기 학회의 주 설립 목적은 지구의 자기장에서 벌어지는 일시적이고 부분적인 변화를 조사하기 위한 세계적 지구물리학 연구를 수행하기 위함이었다. 지자기 학회는 괴팅겐 대학교의 교수였던 카를 프리드리히 가우스와 빌헬름 베버가 알렉산더 폰 훔볼트의 지원으로 창설하였다. 이들의 목표는 전세계 곳곳에 흩어진 수많은 관측소를 활용하여 지자기장의 변동을 조직적인 수단으로 측정하는 것이었다. 1836년부터 1841년까지 6년의 시간 동안 미리 지정된 총 28일의 날짜에, 5분 간격으로 24시간 동안 측정이 진행되었다. 최대 50곳의 연구소가 연구 사업에 참여하였으며, 그 중에 35곳은 유럽, 6곳은 아시아, 2곳은 아프리카, 3곳은 북아메리카, 4곳은 남태평양에 거점을 두고 있었다. 측정 결과는 괴팅겐으로 보내졌으며 가우스와 베버가 과학적 분석에 나섰다."
 gaudi.1004.g: "자석? 전기? 전자기학이로군!"
 gaudi.1004.h: "짜릿한 소식이오!"
 building_gaudi_neuschwanstein: "노이슈반슈타인성"
 pm_default_building_neuschwanstein: "노이슈반슈타인성"
 pmg_base_building_neuschwanstein: "노이슈반슈타인성"
 gaudi_neuschwanstein_can_construct_tt: "노이슈반슈타인성은 바이에른이 #E 바이에른#!에만 건설할 수 있습니다. 결단을 통해서 건설해야 합니다."
 gaudi_neuschwanstein_phase_1_modifier: "노이슈반슈타인성: 시공 단계 (1)"
 gaudi_neuschwanstein_phase_2_modifier: "노이슈반슈타인성: 시공 단계 (2)"
 gaudi_neuschwanstein_cost_1_modifier: "노이슈반슈타인성: 시공 예산 (1)"
 gaudi_neuschwanstein_cost_2_modifier: "노이슈반슈타인성: 시공 예산 (2)"
 gaudi_neuschwanstein_defender_modifier: "노이슈반슈타인성이 아니면 죽음을!"
 gaudi_neuschwanstein_verein_modifier: "왕실 노동자의 복지"
 je_gaudi_neuschwanstein_phase_1: "노이슈반슈타인성: 국왕의 꿈"
 je_gaudi_neuschwanstein_phase_1_reason: "노이슈반슈타인성은 역사주의와 독일 낭만주의를 대표하는 건축물로 여겨진다. 마치 동화에서 등장할 법한 이 성은 바이에른 국왕 루트비히 2세가 설계한 것으로서, 훗날 많은 이들에게 '이상적인' 성의 전형으로 자리매김하였다. 19세기 유럽 군주들은 중세풍의 웅장한 성을 짓는 것이 흔한 일이었으나, 노이슈반슈타인성은 그 모든 것을 뛰어넘고 바이에른 뿐만 아니라 독일어권 전체를 대표하는 건축이 되었다."
 je_gaudi_neuschwanstein_phase_1_goal: "#E 건설 진행도#!가 #BLUE 120점#! 도달. 현재 #G [GetGlobalVariable('gaudi_neuschwanstein_progress').GetValue]#!점을 보유하고 있습니다. 보통 달마다 1점씩 획득합니다."
 je_gaudi_neuschwanstein_phase_2: "노이슈반슈타인성: 동화 속에 나올 법한 성"
 je_gaudi_neuschwanstein_phase_2_reason: "처음부터 노이슈반슈타인성은 일반에 공개하기 위한 것이 아니라 국왕의 개인 휴식처로 계획되었다. 바이에른의 루트비히 2세는 중세 기독교 신화, 특히 자신이 존경해 마지않아 후원에 아낌없던 리히바르트 바그너의 오페라에서 영감을 받아 성을 설계하였다. 끊임없이 새로운 이상을 추구하고 노이슈반슈타인성을 영원한 오페라 석조 무대로 만들고자 했던 국왕의 열망은 건설을 상당히 지연시키는 결과를 낳았고, 결국 본인을 파산 직전까지 몰아갔다."
 je_gaudi_neuschwanstein_phase_2_goal: "#E 건설 진행도#!가 #BLUE 120점#! 도달. 현재 #G [GetGlobalVariable('gaudi_neuschwanstein_progress').GetValue]#!점을 보유하고 있습니다. 보통 달마다 1점씩 획득합니다."
 gaudi_neuschwanstein_phase_1_decision: "노이슈반슈타인성: 국왕의 꿈"
 gaudi_neuschwanstein_phase_1_decision_desc: "노이슈반슈타인성은 역사주의와 독일 낭만주의를 대표하는 건축물로 여겨진다. 마치 동화에서 등장할 법한 이 성은 바이에른 국왕 루트비히 2세가 설계한 것으로서, 훗날 많은 이들에게 '이상적인' 성의 전형으로 자리매김하였다. 19세기 유럽 군주들은 중세풍의 웅장한 성을 짓는 것이 흔한 일이었으나, 노이슈반슈타인성은 그 모든 것을 뛰어넘고 바이에른 뿐만 아니라 독일어권 전체를 대표하는 건축이 되었다."
 gaudi_neuschwanstein_phase_2_decision: "노이슈반슈타인성: 동화 속에 나올 법한 성"
 gaudi_neuschwanstein_phase_2_decision_desc: "처음부터 노이슈반슈타인성은 일반에 공개하기 위한 것이 아니라 국왕의 개인 휴식처로 계획되었다. 바이에른의 루트비히 2세는 중세 기독교 신화, 특히 자신이 존경해 마지않아 후원에 아낌없던 리히바르트 바그너의 오페라에서 영감을 받아 성을 설계하였다. 끊임없이 새로운 이상을 추구하고 노이슈반슈타인성을 영원한 오페라 석조 무대로 만들고자 했던 국왕의 열망은 건설을 상당히 지연시키는 결과를 낳았고, 결국 본인을 파산 직전까지 몰아갔다."
 gaudi_custom_tt_trigger_neuschwanstein: "#yellow 바이에른#!이나 바이에른에 수도를 둔 $south_german$ 국가로 플레이"
 gaudi_add_x_neuschwanstein_progress_minus_x_tt: " #E 건설 진행도#! [SCOPE.GetValue('neuschwanstein_progress_amount')|0+]점 상실"
 gaudi_add_x_neuschwanstein_progress_minus_1_tt: " #E 건설 진행도#! [SCOPE.GetValue('neuschwanstein_progress_amount')|0+]점 상실"
 gaudi_add_x_neuschwanstein_progress_0_tt: " #E 건설 진행도#! 0점 획득"
 gaudi_add_x_neuschwanstein_progress_plus_1_tt: " #E 건설 진행도#! [SCOPE.GetValue('neuschwanstein_progress_amount')|0+]점 획득"
 gaudi_add_x_neuschwanstein_progress_plus_x_tt: " #E 건설 진행도#! [SCOPE.GetValue('neuschwanstein_progress_amount')|0+]점 획득"
 gaudi.701.t: "노이슈반슈타인성 공사 개시"
 gaudi.701.d: "바이에른 국왕이 어린 시절 눈에 익었던 호헨슈방가우의 옛 성 인근을 부지로 선정하였다. 실제 건설 관리 권한은 이미 건축가가 아니라 국왕에게 있다는 것이 분명해지는 순간이었다."
 gaudi.701.f: "\"짐은 푈라트 협곡 근처의 옛 호엔슈방가우 성터를 옛 독일 기사가 쓰던 성의 진정한 면모로 재건할 계획이오.\" - 국왕 루트비히 2세"
 gaudi.701.g: "국왕이 천재거나 미친 사람이겠군."
 gaudi.702.t: "노이슈반슈타인성: 시공 1단계 완료"
 gaudi.702.d: "퓌센 인근의 언덕에 들어선 궁전이 이제 바이에른 알고우 너머로 뚜렷이 보이게 되었다. 노이슈반슈타인성의 문루가 벌써 그곳에 자리잡게 된 것이다."
 gaudi.702.f: "\"...이 성은 모든 면에서 힌터호헨슈방가우성보다 더욱 아름답고 아늑할 것이며...\" - 국왕 루트비히 2세"
 gaudi.702.g: "계획했던 것보다 없어 보이는군."
 gaudi.703.t: "노이슈반슈타인성 공사 재개"
 gaudi.703.d: "노이슈반슈타인성이 다음 시공 단계에 들어갔다. 저렇게 호사스런 건물은 완전히 돈낭비라고 비판하는 목소리가 이제는 점점 더 커지고 있다."
 gaudi.703.f: "항간에 알려진 바와는 달리 루트비히 2세는 노이슈반슈타인성의 건설 비용 전액을 본인의 개인 재산으로 충당하였다. 건설 예산에 허덕이던 루트비히 2세는 옛 프로이센 왕조의 재정 지원 요청에도 적극적이었다. 비스마르크는 빌헬름 폰 프로이센이 독일 황제로 즉위할 당시 바이에른의 환심을 사기 위하여 루트비히 2세에게 연금으로 매년 30만 라이히스마르크를 지급하였다. 루트비히 2세가 말년에 접어들 무렵 개인 부채는 825만 라이히스마르크에 이르렀다."
 gaudi.703.g: "이번엔 돈이 얼마나 드려나?"
 gaudi.704.t: "노이슈반슈타인성 완공"
 gaudi.704.d: "노이슈반슈타인성이 오늘 드디어 완공되었다! 루이 14세의 전통을 따라 추억 돋는 과욕의 표현으로 남을 것인가, 아니면 국왕의 신화가 수백 년 동안 전해져 내려올 것인가. 그것은 역사가 증명할 것이다. 확신할 수 없다면 두 가지 모두 정답이리라."
 gaudi.704.f: "\"짐은 내 스스로와 모든 이들에게 영원한 수수께끼로 남고 싶다...\" - 국왕 루트비히 2세"
 gaudi.704.g: "[SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('gaudi_ruler').GetFirstName] 만세!"
 gaudi.709.t: "바이에른 상실!"
 gaudi.709.d: "바이에른 지역을 상실하면서 노이슈반슈타인 성의 건설을 지속할 기회도 영영 사라지게 되었다."
 gaudi.709.f: "어떤 이유에서건 바이에른을 상실하게 되더라도, 건설 진행도가 통째로 사라지는 것은 아닙니다. 바이에른만이 지난 건설 단계를 이어받아 노이슈반슈타인 성의 건설을 계속할 수 있습니다. 우리를 침략한 외국 세력은 성 건설에 전혀 관심을 보이지 않을 것입니다."
 gaudi.709.g: "바이에른을 언제까지고 넘겨줄 순 없다!"
 gaudi.711.t: "못 쓰게 된 벽돌"
 gaudi.711.d: "최근에 납품된 노이슈반슈타인성 건설 자재의 품질이 떨어지는 것으로 드러났다."
 gaudi.711.f: "노인슈반슈타인성 건물이 매일같이 높이 올라가던 건설 현장에 평소대로의 활기가 사라졌다. 국왕이 직접 점검에 나서보니 벽돌의 품질이 평소와는 다르다는 것을 알게 되었고, 건설 사업에 차질이 생기기 전에 좀 더 기다려보자고 밝혔다. 하지만 건설 관리를 맡은 책임자들은 벽돌을 계속 사용해야 한다는 목소리가 나오고 있다. 건설이 지연될 뿐만 아니라 극왕이 또다시 설계도를 고치는 데 시간을 할애할 것이란 우려가 제기된 탓이다..."
 gaudi.712.t: "참사 발생!"
 gaudi.712.d: "저품질 자재를 사용한 결과가 여실히 드러나고 말았다. 오늘 아침 노이슈반슈타인성의 일부가 무너져 내려 상당한 피해를 입힌 것이다."
 gaudi.712.f: "어쩌면 국왕의 말이 맞았을지도 모른다. 노이슈반슈타인성처럼 중요한 건물에 부서지기 쉬운 석회암을 사용한 것이 정말 좋지 않은 생각이었을지도 모른다. 그렇기에 결단을 내리기 전에 두 번 다시 생각해야 했을지도 모른다. 허나 떄는 이미 늦었다. 저품질 자재로 인해 오늘 결국 외벽이 무너져 내렸고, 지난 몇 주, 몇 달 간 이어왔던 공사가 건물 정면 붕괴로 인해 물거품이 되고 만 것이다."
 gaudi.713.t: "야당의 노이슈반슈타인성 건설 비판"
 gaudi.713.d: "[SCOPE.sCharacter('gaudi_opposition_leader').GetFullName] 대표가 국왕에게 청원을 올렸다.."
 gaudi.713.f: "\"해외에서는 벌써 기분에 따라 본인을 동화 속의 왕이나 루이 14세의 환생으로 여기는 군주를 비웃고 있습니다. 왕실이 시대착오적인 이상에 매달리는 행태는 이제 마무리지어야 합니다. 바이에른은 유럽의 웃음거리가 되고 있으며, 이런 행태는 국왕에게 어울리지 않습니다.\""
 gaudi.713.g: "내가 국왕인데 내 마음대로 짓는 것도 못한단 말이냐!"
 gaudi.713.h: "그렇게까지 말한다면 짐이 사치를 부렸단 말인가?"
 gaudi.714.t: "신형 기계"
 gaudi.714.d: "기술의 발전은 중세 시대의 성처럼 옛 것으로 보이는 건물을 짓는 데에도 보탬이 되고 있다."
 gaudi.714.f: "뮌헨의 기계 공장과 최신 철골 공법 덕분에 노이슈반슈타인성을 지금껏 볼 수 없었던 기록적인 시간 안에 공사를 진행할 수 있게 되었다."
 gaudi.715.t: "노이슈반슈타인성에 감명받은 이웃 국가"
 gaudi.715.d: "우리 이웃 국가인 [SCOPE.sCountry('gaudi_neighbour_nation').GetName]에서 바이에른이 이상적인 성을 향한 꿈을 실현하기 위하여 온 정성을 다하는 점에 감탄하며, 건설 진척 상황에 큰 관심을 표해 왔다."
 gaudi.715.f: "노이슈반슈타인성은 루트비히 2세의 성 가운데서도 가장 널리 알려져 있는 동시에 독일에서 제일 유명한 명소이기도 하다. 루트비히 2세가 사망한 그해부터 관광객에 개방되었으며 그 후로 방문객 수가 꾸준히 늘어나고 있다. 개장 후 첫 8주 동안에만 약 18,000명이 성을 방문했다. 1913년 방문객이 28,000명을 돌파하였고, 1939년에는 이미 방문객 수가 290,000명에 달했다. 2001년에는 방문객 수가 약 130만 명으로 증가했는데, 그중 독일인은 56만 명, 미국인과 영국인은 38만 5천 명으로 집계되었다. 같은해 방문객 국적 3위를 찾이한 것은 일본인으로, 총 14만 9천 명이었다. 2005년까지 총 방문객 수는 5천만 명을 넘어섰다."
 gaudi.715.g: "대사에게 노이슈반슈타인성을 보여주시오."
 gaudi.715.h: "기부를 요청해 보자."
 gaudi.716.t: "또 시작된 국왕의 발상"
 gaudi.716.d: "국왕이 최근 계획 변경안을 내놓아 건설 관리자들을 경악에 빠뜨리고 말았다."
 gaudi.716.f: "노이슈반슈타인성의 건설은 1869년에 시작되었다. 건설이 진행되면서 루트비히 2세의 바람과 요구는 늘어만 갔고 동시에 공사비도 증가하면서, 설계도와 비용 추산도 수차례 변경되어야 했다. 원래 소박한 서재만이 있던 공간을 널찍한 알현실로 바꾸고, 무어식 연회장을 들이기 위해 당초 계획되었던 일부 객실을 제거하였으나, 연회장 자체도 예산 부족으로 실현되지 못했다. 노이슈반슈타인성의 완공 시점은 1872년으로 예정되었으나 이마저도 계속해서 연기되었다."
 gaudi.716.g: "크루제티아큰 (빌어먹을)!"
 gaudi.716.h: "자크라멘트 (제기랄)!"
 gaudi.716.i: "체픽스 (젠장)!"
 gaudi.716.j: "힘메, 오아르슈 운트 츠비안 (이런 씨발라먹을)! "
 gaudi.717.t: "순조롭게 지어가는 노이슈반슈타인성"
 gaudi.717.d: "노이슈반슈타인성의 건설 작업이 특정할 수 없는 이유로 예상보다 훨씬 더 빠른 진척을 보이고 있다."
 gaudi.717.f: "영문 모를 이유로 저 장엄한 노이슈반슈타인성의 건설이 순조롭게 진행되고 있다. 어쩌면 날씨가 좋아서일지도 모른다. 성모님께 기도를 잘 드려서일수도 있고, 며칠 전에 낭비해 버려 다시는 발견되지 않기를 바라는 저품질 건축 자재 때문인지도 모른다. 한 가지 확실한 것은 온갖 사정으로 수차례 지연되었던 이 거대한 건축물이 예상보다 빨리 완공될 전망이라는 것이다. 국왕이 시간 절약을 만회하기 위해 새로운 확장 계획에 나서지 않는다는 가정 하에 말이다..."
 gaudi.718.t: "국가적 사업인가, 국왕의 사업인가"
 gaudi.718.d: "노이슈반슈타인성의 목적이 국가적 상징에 있는가, 아니면 국왕의 상징에 있는가를 놓고 의회에서 진지한 토론이 벌어지고 있다."
 gaudi.718.f: "알게우의 외딴 지역에 자리한 노이슈반슈타인성은 국왕의 처음부터 개인 휴양지로 계획되었다. 그럼에도 노이슈반슈타인성은 적어도 외부의 시선에서는 낭만적인 건축이었으며 따라서 국가적인 의의도 존재하였다. 중세 시대를 독일사의 진정한 정점으로 바꾸는 것은 민족주의 운동의 중대 서사이기도 하였던 것이다. 동시에 이 성은 분열된 독일 민족의 국민 작곡가인 리하르트 바그너에게 석조 건축으로나마 경의를 표하려는 의의도 존재하였다. "
 gaudi.718.g: "이것은 국가적 사업이다."
 gaudi.718.h: "이것은 국가적 사업인 동시에 국왕의 사업이기도 하다."
 gaudi.718.i: "이것은 국왕의 사업이다."
 gaudi.719.t: "국왕의 방문"
 gaudi.719.d: "[SCOPE.sCharacter('gaudi_ruler').GetFullName] [SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle]께서 노이슈반슈타인성 공사 현장을 친히 방문키로 하였다."
 gaudi.719.f: "우리 [SCOPE.sCharacter('gaudi_ruler').GetFirstName] 국왕께서는 과거에도 건설 현장을 지속적으로 지켜보고 있었으며 현장을 방문하겠다고 밝혔다. 국왕을 맞이할 준비도 한창 진행 중에 있다. 당연하겠지만 폐하께 무언가 제대로 선보이고픈 마음 때문이기도 하다! 이에 따라 일반 건설 노동자와 건설 관리 책임자, 수석 건축가는 방문 계획 발표 이후 전례 없는 속도로 공사를 진행하고 있다."
 gaudi.719.g: "폐하께서 독려하는 법을 확실히 알고 계시는군."
 gaudi.720.t: "건설 현장의 화재 발생"
 gaudi.720.d: "노이슈반슈타인성 건설 현장에서 원인 모를 불길이 치솟아올라 몇 달간의 공사를 무용지물로 만들어 버렸다!"
 gaudi.720.f: "\"지금 리하르트 바그너의 〈발퀴리의 행진〉튼 사람 누구야?!\""
 gaudi.720.g: "끔찍하군! 바그너 같아!"
 gaudi.721.t: "노동자들에게 건넨 왕실의 손길"
 gaudi.721.d: "노동조합 대표가 국왕에게 노이슈반슈타인성의 건설 현장에서 더 나은 처우와 더불어 위험한 작업에 대한 수당을 지급해 달라고 요청하고 나섰다."
 gaudi.721.f: "노이슈반슈타인성의 거대한 건설 현장은 약 20년 동안 이 지역의 최대 고용주로 군림하였다. 1880년에는 매일 건설 현장에 매일 200여명의 숙련공이 투입되었으며, 그와는 별개로 자재 담당이나 건설과 직접 관련된 사람들도 있었다. 국왕이 빠듯한 공사 기한과 긴급한 설계 변경을 요구할 때면, 하루에 최대 300명의 인부가 등불 아래서 밤낮 가리지 않고 일했다고 전해진다. 1870년 4월 3일에는 '호헨슈방가우 왕실 궁전 장인 협회'라는 상당히 현대적인 사회 단체가 결성되기에 이르렀다. 협회의 설립 목적은 낮은 월 회비와 국왕으로부터 받아낸 상당액의 보조금으로 질병이나 부상을 입은 건설 노동자에게 임금을 계속 지급하는 것을 보장하기 위함이었다. 오늘날의 사회보험이나 노조처럼, 건설사 측에서 0.70마르크의 임금을 15주 동안 보장하기도 했다. 건설 중 사망한 사람들의 유족에게는 연금이 지급되었는데, 금액은 적긴 했어도 당시로서는 찾아보기 힘든 제도였다."
 gaudi.721.g: "지원할 가치가 있는 계획이로군."
 gaudi.721.h: "온 나라에 본보기가 되겠군!"
 gaudi.721.i: "사회 복지라고? 여긴 투덜쟁이가 아니라 일손이 필요하단 말이다!"
 building_gaudi_palacio: "벨라스 아르테스 궁전"
 pm_default_building_palacio: "벨라스 아르테스 궁전"
