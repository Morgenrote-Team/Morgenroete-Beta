 gaudi_neuschwanstein_verein_modifier: "왕실 노동자의 복지"
 je_gaudi_neuschwanstein_phase_1: "노이슈반슈타인성: 국왕의 꿈"
 je_gaudi_neuschwanstein_phase_1_reason: "노이슈반슈타인성은 역사주의와 독일 낭만주의를 대표하는 건축물로 여겨진다. 마치 동화에서 등장할 법한 이 성은 바이에른 국왕 루트비히 2세가 설계한 것으로서, 훗날 많은 이들에게 '이상적인' 성의 전형으로 자리매김하였다. 19세기 유럽 군주들은 중세풍의 웅장한 성을 짓는 것이 흔한 일이었으나, 노이슈반슈타인성은 그 모든 것을 뛰어넘고 바이에른 뿐만 아니라 독일어권 전체를 대표하는 건축이 되었다."
 je_gaudi_neuschwanstein_phase_1_goal: "#E 건설 진행도#!가 #BLUE 120점#! 도달. 현재 #G [GetGlobalVariable('gaudi_neuschwanstein_progress').GetValue]#!점을 보유하고 있습니다. 보통 달마다 1점씩 획득합니다."
 je_gaudi_neuschwanstein_phase_2: "노이슈반슈타인성: 동화 속에 나올 법한 성"
 je_gaudi_neuschwanstein_phase_2_reason: "처음부터 노이슈반슈타인성은 일반에 공개하기 위한 것이 아니라 국왕의 개인 휴식처로 계획되었다. 바이에른의 루트비히 2세는 중세 기독교 신화, 특히 자신이 존경해 마지않아 후원에 아낌없던 리히바르트 바그너의 오페라에서 영감을 받아 성을 설계하였다. 끊임없이 새로운 이상을 추구하고 노이슈반슈타인성을 영원한 오페라 석조 무대로 만들고자 했던 국왕의 열망은 건설을 상당히 지연시키는 결과를 낳았고, 결국 본인을 파산 직전까지 몰아갔다."
 je_gaudi_neuschwanstein_phase_2_goal: "#E 건설 진행도#!가 #BLUE 120점#! 도달. 현재 #G [GetGlobalVariable('gaudi_neuschwanstein_progress').GetValue]#!점을 보유하고 있습니다. 보통 달마다 1점씩 획득합니다."
