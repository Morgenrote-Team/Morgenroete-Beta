 je_gaudi_civil_research_project_reason: "[ROOT.GetCountry.GetCustom('je_gaudi_civil_research_project_type')]분주하지 않은 상태의 [concept_tesla_civil_engineer]는 토목 공학을 혁신하기 위한 연구에 나서게 됩니다. 연구 사업은 매달 진행도를 획득합니다. 진행도가 36에 도달하면 소량의 기술 가속이 부여됩니다.\n$mr_divider_for_je$\n다음 가속 대상 기술: [ROOT.GetCountry.GetCustom('tesla_civil_engineering_next_technology_type')]\n$mr_divider_for_je$\n현재 월간 진행도: #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_civil_research_progress_tt')] [JournalEntry.MakeScope.GetVariable('mr_monthly_progress_var').GetValue|2+]#!#!\n현재 총 진행도: [JournalEntry.MakeScope.GetVariable('mr_je_progress_var').GetValue|2+] / 36"
