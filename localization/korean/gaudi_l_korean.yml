 gaudi.801.t: "벨라스 아르테스 궁전 착공"
 gaudi.801.d: "국립극장의 철거와 함께 문화 행사 전용 대규모 궁전으로 멕시코시티의 격을 높일 적당한 부지가 확보되기에 이르렀다. 오늘 열린 성대한 착공식에 [SCOPE.sCharacter('gaudi_ruler').GetFullName] [SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle]도 참석하였다."
 gaudi.801.f: "해당 부지에 지어진 것으로 알려진 가장 오래된 건물은 1680년에 지어진 산타 이사벨 수녀원이었다. 해당 주택가의 일부였던 산타 이사벨 골목가는 19세기에 이르러 허물어지고 국립국장이 들어서는 자리로 대체되었다. 19세기 말부터 20세기 극초기까지 국립국장은 멕시코시티 내 대다수 고급 문화가 치러지는 자리였으며, 연극, 오페레타, 비엔나 춤 등의 행사를 계속해서 유치해 나갔다. 그 후 1910년 멕시코 독립 100주년을 기념하기 위해 해당 건물을 더욱 화려한 건물로 대체하기로 결정되었다. 기존 극장은 1901년에 철거되었고, 새 극장은 오페라 대극장(Gran Teatro de Ópera)으로 불리게 되었다."
 gaudi.801.g: "멕시코는 일류 문화 강국이 될 것이다!"
 gaudi.802.t: "벨라스 아르테스 궁전: 시공 1단계 완료"
 gaudi.802.d: "벨라스 아르테스 궁전의 골조가 벌써부터 멕시코시티 거리의 옥상 너머로 우뚝 솟았다. 시민들은 벌써부터 눈앞에 걸작이 탄생하고 있음을 느낄 수 있었다."
 gaudi.802.f: "아다모 보아리는 설계 과정에서 벨에포크 양식과 신고전주의 양식은 물론 스페인 정복 이전 시대의 모티프를 결합하는 식으로 당대 여러 건축 양식들을 혼합하였다. 궁전의 외관은 흰색 대리석으로, 내부는 여러 가지 색의 대리석으로 마감되었다. 이 때문에 벨라스 아르테스 궁전은 엄청난 무게를 지니고 있어 주변의 거리보다 수 미터 낮아져 있다."
 gaudi.802.g: "사전 예매는 언제부터입니까?"
 gaudi.803.t: "벨라스 아르테스 궁전 공사 재개"
 gaudi.803.d: "벨라스 아르테스 궁전은 이미 대부분 완성되었지만 추가 시공 과정과 더불어 각 내부 공간의 화려하고 정교한 장식 작업이 이제 막 시작되고 있다."
 gaudi.803.f: "궁전의 벽면에는 호세 클레멘테 오로스코, 디에고 리베라, 다비드 알파로 시케이로스 등 여러 유명 벽화가들의 작품으로 장식되었다. 궁전 내부에는 일곱 뮤즈 여신에 헌정된 안드레 알라르의 조각상도 두었다. 궁전의 화려하게 장식된 10개 철제 대문은 이탈리아 조각가 알레산드로 마추코텔리가 작업하였다. 본 건물 돔 위를 장식하는 청동 조각군은 헝가리의 게자 마로티가 작업하였으며, 돔 자체의 장식은 로베르토 알바레스 에스피노사가 아르데코 양식으로 꾸몄다."
 gaudi.803.g: "아르데코의 이상이로다."
 gaudi.804.t: "벨라스 아르테스 궁전 준공"
 gaudi.804.d: "수년 간의 공사와 뜻밖에 빚어진 몇 차례의 연기 끝에 드디어 멕시코시티에 새로운 명소가 탄생했다. 벨라스 아르테스 궁전은 문화적 영향력으로 온 나라를 굽어보게 될 것이다."
 gaudi.804.f: "벨라스 아르테스 궁전은 1934년 최종 완공되어 그해 11월 29일 개관식을 열었다. 개관 기념 행사로 후안 루이스 데 알라르콘의 1934년 작품 〈수상한 진실〉(La Verdad Sospechosa)의 공연이 있었다. 1946년 이곳을 본부로 예술 진흥을 위한 정부 기관인 멕시코 국립예술원(Instituto Nacional de Bellas Artes)이 출범하였다."
 gaudi.804.g: "음악, 문학, 회화가 한 지붕 아래 모였구나!"
 gaudi.809.t: "멕시코 상실!"
 gaudi.809.d: "멕시코 지역을 상실하면서 벨라 아르테스 궁전을 건설할 기회도 영영 사라지게 되었다."
 gaudi.809.f: "어떤 이유에서건 멕시코 주를 상실하게 되더라도, 건설 진행도가 통째로 사라지는 것은 아닙니다. 멕시코만이 지난 건설 단계를 이어받아 벨라스 아르테스 궁전의 건설을 계속할 수 있습니다. 우리를 침략한 외국 세력은 궁전 건설에 전혀 관심을 보이지 않을 것입니다."
 gaudi.809.g: "멕시코를 언제까지고 넘겨줄 순 없다!"
 gaudi.811.t: "기부"
 gaudi.811.d: "여당에서 벨라스 아르테스 궁전의 건설 속도 가속에 상당한 관심을 갖고 있다. 그중에서도 [SCOPE.sCharacter('gaudi_government_leader').GetFullName] 대표가 문화 궁전에 많은 노력을 기울이며 기부금의 모금에 나섰다."
 gaudi.811.f: "그 기부금이 사실은 정당 예산에서 나온 검은 돈이며, 이런 관행은 하루빨리 근절해야 한다는 여론은 물론 야당이 지어낸 이야기일 뿐이다."
 gaudi.811.g: "무차스 그라시아스 (정말 감사합니다)."
 gaudi.812.t: "노동조합의 작업 환경 비판"
 gaudi.812.d: "오늘 의회에서 [SCOPE.sCharacter('trade_unions_leader').GetFullName] 대표가 벨라스 아르테스 궁전 건설 현장의 처참한 환경을 규탄하고 나섰다."
 gaudi.812.f: "\"벨라스 아르테스 궁전은 우리나라 문화 중심지요, 오직 진실하고 선하며 아름다운 것에 사람들이 몰두하는 곳이 되어야 하겠습니다. 헌데 국민들로 하여금 그 아름다움을 누리게 한답시고 정부가 평범한 노동자들을 착취하고, 제일 처참한 환경으로 몰아넣는 것은, 이 사업에서 품고 있어야 할 미적 가치와 명백히 모순되지 않겠습니까!\""
 gaudi.813.t: "습지대"
 gaudi.813.d: "벨라스 아르테스 궁전의 수석 건축가가 울퉁불퉁한 습지대라는 새로운 문제에 봉착하였다. 건물이 땅 속으로 가라앉을 위험이 점차 늘고 있는 것이다. 이에 대한 대응 조치로 시공 작업이 계속 지연되고 있다."
 gaudi.813.f: "멕시코시티는 넓게 뻗어나간 도시로서, 지금도 그렇지만 과거에도 세계에서 제일 큰 도시권으로 꼽혔다. 그러나 그 환경은 결코 유리하지 않았다. 아즈텍 문명이 세운 전신 격의 도시인 테노치티틀란은 호수 한가운데에 자리잡고 있었다. 호수는 수백년에 걸쳐 물이 빠졌고, 토양이 진흙으로 되어 있어 쉽게 물러진다는 사실이 이미 과거부터 알려져 있었다. 여기에 깊은 우물을 파면서 상황은 더욱 악화되었다. 바로크 교회 중에서는 처음 지어졌을 때보다 훨씬 더 파묻혀 버리는 경우도 있었다. 따라서 벨라스 아르테스 궁전 역시 예외는 아니었다."
 gaudi.813.g: "죽어라, 텍스코코 호수!"
 gaudi.814.t: "신형 기계"
 gaudi.814.d: "기술의 발전으로 벨라스 아르테스 궁전이 당초 예상보다 이른 시점에 완공될 전망이다."
 gaudi.814.f: "\"엘레베이터라고? 계단이 필요 없다 이 말인가? 그러면 그냥 땅바닥에 발 붙이고 올라갈 수 있는 건가? 건축 자재는 또 뭐야? 이런 걸 왜 아무도 미리 말해주지 않았는가?\""
 gaudi.815.t: "파업 위협"
 gaudi.815.d: "벨라스 아르테스 궁전의 건설 노동자들이 임금 개선 협상에 나서지 않는다면 파업에 돌입하겠다고 선포하였다."
 gaudi.815.f: "아, 파업이라니 참 좋은 세상이란 말이야! 라틴아메리카에서 철도 노조가 갑자기 파업을 벌여 기차역에 발이 묶이는 경험을 해보지 않았다면 그 진가를 제대로 알지 못할 것이다. 오늘은 다행히 건설 현장 한 곳만 영향을 받았다. 참으로 운이 좋다!"
 gaudi.815.i: "군경을 소집하라!"
 gaudi.816.t: "궁전 정면 붕괴로 노동자 사망"
 gaudi.816.d: "벨라스 아르테스 궁전 건설 현장에서 큰 사고가 일어났다. 노동자 수십 명이 부상을 당했고, 사망자도 발생한 것과 더불어 궁전 정면 일부가 붕괴하고 말았다!"
 gaudi.816.f: "붕괴 원인은 아직 밝혀지지 않았으며 수석 건축가도 골머리를 앓고 있다. 일각에서는 시공이 잘못되었거나 고품질 자재에 쓰일 공사비를 횡령한 것이 아닌가 하고 짐작하고 있다. 한편으로 설계상의 결함을 지적하는 의견도 있었다. 분명한 것은 건물 정면부가 무너져 내리면서 온 노동자들이 파편에 맞았으며 이미 지어두었던 일부 건물 공간도 완전히 무너지고 말았다는 사실이다."
 gaudi.817.t: "순조롭게 지어가는 벨라스 아르테스 궁전"
 gaudi.817.d: "벨라스 아르테스 궁전의 건설 작업이 특정할 수 없는 이유로 예상보다 훨씬 더 빠른 진척을 보이고 있다."
 gaudi.817.f: "영문 모를 이유로 저 눈부신 벨라스 아르테스 궁전의 건설이 순조롭게 진행되고 있다. 어쩌면 날씨가 좋아서일지도 모른다. 성모님께 기도를 잘 드려서일수도 있고, 며칠 전에 낭비해 버려 다시는 발견되지 않기를 바라는 저품질 건축 자재 때문인지도 모른다. 한 가지 확실한 것은 온갖 사정으로 수차례 지연되었던 이 거대한 건축물이 예상보다 빨리 완공될 전망이라는 것이다. 건물이 또다시 습지 속으로 빠져 버리지 않는다는 가정 하에 말이다..."
 gaudi.817.g: "엑셀렌테 (완벽해)!"
 gaudi.818.t: "멕시코시티의 고고학 발굴 조사"
 gaudi.818.d: "건설 현장을 방문한 [SCOPE.sCharacter('gaudi_archaeologist').GetFullName](이)가 벨라스 아르테스 궁전이 아즈텍 문명의 유적 위에 들어선 정황을 발견하였다. 이에 당국에 연구 허가를 요청한 상황이다."
 gaudi.818.f: "테노치티틀란은 아즈텍 제국의 수도이자 멕시코시티의 선대 격에 해당되는 도시다. 스페인의 침략으로 대대적으로 파괴되었으며, 그 유적 일부는 주변의 텍스코코 호수에 던져 넣거나, 새 건물을 지을 용도로 자재를 떼어가기도 하였다. 지금도 식민지 시대의 오래된 주택에서는 아즈텍 유적에서 떼온 자재를 찾아볼 수 있다."
 gaudi.819.t: "멕시코시티의 새 일자리"
 gaudi.819.d: "벨라스 아르테스 궁전 건설로 상당수의 인력이 멕시코에 유입되기에 이르렀다."
 gaudi.819.f: "멕시코시티가 오늘날의 특별한 지위를 갖게 된 것은 식민지 이전 시대로 거슬러 올라간다. 당시 테노치티틀란이란 이름으로 아즈텍 제국의 수도였으며 수많은 중심 기능을 수행하고 있었다. 스페인군이 이곳을 파괴하고 식민지의 대도시로 재건하면서 멕시코시티는 중앙집권형 식민 행정의 중심지로 거듭났다. 19세기 말에는 철도망의 확장으로 그 중요성이 더욱 커졌다. 20세기 초에는 금융과 무역 중심지로서의 기능 외에도 산업 중심지로서 중요성을 더해갔다. 일자리를 찾아 수십 년 동안 수십만 명이 수도로 몰려들었고, 벨라스 아르테스 궁전 같은 건설 사업이 이러한 인구 유입 현상을 더욱 촉진시켰다."
 building_gaudi_gyeong: "경복궁"
 pm_default_building_gyeong: "경복궁"
 pmg_base_building_gyeong: "경복궁"
 gaudi_gyeong_can_construct_tt: "경복궁은 한국이 #E 서울#!에만 건설할 수 있습니다. 결단을 통해서만 건설할 수 있습니다."
 gaudi_gyeong_phase_1_modifier: "경복궁 건설"
 gaudi_gyeong_cost_1_modifier: "경복궁 건설 비용"
 gaudi_gyeong_defender_modifier: "경복궁 없이는 살 수 없다"
 gaudi_gyeong_more_rooms_modifier: "경복궁의 행각 추가"
 gaudi_gyeong_impressed_modifier: "경복궁 중건에 감명받다"
 modifier_building_gaudi_gyeong_throughput_add: "경복궁의 행각 추가"
 je_gaudi_gyeong_phase_1: "경복궁 중건"
 je_gaudi_gyeong_phase_1_reason: "경복궁은 서울의 궁궐로, 그 이름은 큰 복(慶福)을 누리기를 기원하는 뜻을 담고 있다. 조선 왕조의 5대 궁궐 가운데 가장 오래된 동시에 최대 규모를 자랑하고 있다. 조선 왕조의 초대 국왕인 태조 이성계가 지었으며 1395년에 완공하였다. 이후 왕가의 거처로 사용되다, 1592년 임진왜란 당시 일본군의 진주로 무너져 내렸다. 전쟁의 화마에 휩싸여 파괴된 이래 300년간 누구도 재건하지 못했던 경복궁. 이제는 다시 세워야 할 때가 찾아왔을지 모른다."
 je_gaudi_gyeong_phase_1_goal: "#E 건설 진행도#!가 #BLUE 60점#! 도달. 현재 #G [GetGlobalVariable('gaudi_gyeong_progress').GetValue]#!점을 보유하고 있습니다. 보통 달마다 1점씩 획득합니다."
 gaudi_gyeong_phase_1_decision: "경복궁 중건"
 gaudi_gyeong_phase_1_decision_desc: "경복궁은 서울의 궁궐로, 그 이름은 큰 복(慶福)을 누리기를 기원하는 뜻을 담고 있다. 조선 왕조의 5대 궁궐 가운데 가장 오래된 동시에 최대 규모를 자랑하고 있다. 조선 왕조의 초대 국왕인 태조 이성계가 지었으며 1395년에 완공하였다. 이후 왕가의 거처로 사용되다, 1592년 임진왜란 당시 일본군의 진주로 무너져 내렸다. 전쟁의 화마에 휩싸여 파괴된 이래 300년간 누구도 재건하지 못했던 경복궁. 이제는 다시 세워야 할 때가 찾아왔을지 모른다."
 gaudi_custom_tt_trigger_gyeong: "#yellow 한국#!으로 플레이"
 gaudi_add_x_gyeong_progress_minus_x_tt: " #E 건설 진행도#! [SCOPE.GetValue('gyeong_progress_amount')|0+]점 상실"
 gaudi_add_x_gyeong_progress_minus_1_tt: " #E 건설 진행도#! [SCOPE.GetValue('gyeong_progress_amount')|0+]점 상실"
 gaudi_add_x_gyeong_progress_0_tt: "#E 건설 진행도#! 0점 획득"
 gaudi_add_x_gyeong_progress_plus_1_tt: "#E 건설 진행도#! [SCOPE.GetValue('gyeong_progress_amount')|0+]점 획득"
 gaudi_add_x_gyeong_progress_plus_x_tt: "#E 건설 진행도#! [SCOPE.GetValue('gyeong_progress_amount')|0+]점 획득"
 gaudi_gyeong_rooms_tt: "경복궁이 중건되면 더욱 위엄 있는 모습을 갖추게 될 것입니다."
 gaudi.901.t: "경복궁 중건 개시"
 gaudi.901.d: "[SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle] [SCOPE.sCharacter('gaudi_ruler').GetFullName] 전하께서 옛 궁궐을 중건하라는 명을 내리셨다. 몇 년만 있으면 과거의 영광을 되찾을 것이다."
 gaudi.901.f: "경복궁은 250여년 간 폐허로 남아 있었다. [SCOPE.sCharacter('gaudi_ruler').GetFullName]께서 복원하려는 전체 규모는 13만여 평 부지의 행각 5백여 동, 7천 7백 여 칸이다. 경복궁의 대대적인 중건 사업은 수년 안에 마칠 것으로 예상된다."
 gaudi.901.g: "이만한 궁궐이라면 [SCOPE.sCharacter('gaudi_ruler').GetPrimaryRoleTitle] 전하께 걸맞지 않겠느냐!"
 gaudi.902.t: "경복궁 중건 완료"
 gaudi.902.d: "수 년이 흘러 경복궁이 마침내 중건되었다. 그 찬란한 빛이 도성를 굽어보는 옥석과도 같다. 마침내 우리는 이 나라의 권력과 재력이 고스란히 깃든 궁궐을 다시금 갖게 되었다."
 gaudi.902.f: "1867년 흥선대원군 섭정 시기, 경복궁은 330동 5,792칸 규모의 거대한 궁궐로 탈바꿈하며 중건되기에 이르렀다. 432,703제곱미터에 달하는 넓은 부지에 자리 잡은 경복궁은 한국과 조선 왕실의 상징적인 건축물로 다시금 자리매김했다. 1894년 일본은 경복궁을 점거하고 고종에게 친일 정부 수립을 강요했다. 국가 주권의 상징이었던 경복궁은 1910년 일제강점기에 이르러 극심한 피해를 입었다. 1911년 경복궁 부지가 조선 총독에게 넘어갔고, 1915년 일제는 박람회 개최를 구실로 경복궁 건물의 90% 이상을 철거했다. 박람회가 끝나고 남은 잔해마저 완전히 허물고 그 자리에 조선총독부 청사를 건설했다."
 gaudi.902.g: "조선의 위엄이 돌아왔노라!"
 gaudi.909.t: "서울 상실!"
 gaudi.909.d: "서울 지역을 상실하면서 경복궁을 중건할 기회도 영영 사라지게 되었다."
 gaudi.909.f: "어떤 이유에서건 서울을 상실하게 되면, 건설 진행도도 #R 통째로 상실#!하게 된다. 경복궁 건설을 계속할 수 있는 지역은 서울 뿐이다. 우리를 침략한 외국 세력은 궁궐 건설에 전혀 관심을 보이지 않을 것이다."
 gaudi.909.g: "서울을 언제까지고 넘겨줄 순 없다!"
 gaudi.911.t: "건설 진행도 느림"
 gaudi.911.d: "궁궐 공사가 더딘 진척을 보이고 있다. 도편수의 헤아림에 의하면 현재까지의 진척 상황은 예정보다 수 개월 뒤처진 상태라 한다."
 gaudi.911.f: "알 수 없는 이유로 경복궁 공사가 더디게 진행되고 있다. 그것이 역적 세력의 교란이든, 인부들이 공역에 소홀한 것이든, 비밀 계원들의 음모이든, 아니면 그저 악천후가 내려서든 간에 말이다."
 gaudi.911.g: "근무 시간을 강제로 연장하라."
 gaudi.911.h: "노동자들에게 상여금을 지급하라."
 gaudi.911.i: "기다려 보겠다."
 gaudi.912.t: "건설 진행도 양호"
 gaudi.912.d: "경복궁 공사의 진척 속도가 놀랍다. 도편수가 이르기를 궁궐이 예정보다 빨리 완공될 수도 있다고 한다."
 gaudi.912.f: "알 수 없는 이유로 경복궁 공사가 순조롭게 진행되고 있다. 그것이 애국충정 때문이든, 임금이 높기 때문이든, 지역 유지들이 지원에 거리낌 없기 때문이든, 아니면 그저 날씨가 더 좋기 때문이든 간에 말이다."
 gaudi.912.g: "아주 좋아."
 gaudi.913.t: "불이야!"
 gaudi.913.d: "도성 위로 피어오른 연기 구름이 몇 리 바깥에서도 보인다. 조선 최대의 건설 현장에서 화재가 발생했다!"
 gaudi.913.f: "화재 원인은 아직 밝혀지지 않았으나, 부주의와 소방 조직의 부실로 인해 불길이 수많은 행각으로 번졌다. 화재에 특히 취약한 목조 구조물이 화마에 휩싸여 무너졌다. 이로서 중건 사업은 수 주에서 수 개월까지 지연되었다!"
 gaudi.913.g: "통탄스럽다!"
 gaudi.914.t: "칸수 늘리기"
 gaudi.914.d: "공사가 한창이던 와중에 도편수가 궁궐 부지를 보다 면밀히 활용할 수 있는 새로운 도면을 올렸다. 이대로라면 전각과 방을 더 많이 들일 수 있지만, 그만큼 공사 비용이 추가되고 완공 시기도 크게 늦어질 터이다."
 gaudi.914.f: "'고작 오천 칸뿐이란 말인가? 칠천 칸은 되어야 할 것을!'"
 gaudi.914.g: "국왕 전하와 왕실을 위해서라도 공간을 늘려야겠다."
 gaudi.914.h: "사치를 부릴 순 없다!"
 gaudi.915.t: "궁궐에 감복한 자"
 gaudi.915.d: "며칠 전, [SCOPE.sCharacter('gaudi_sycophant_leader').GetFullName](이)가 공사 중인 경복궁의 규모와 장엄함을 직접 두 눈으로 담고자 했다. 서서히 위용을 드러내는 전각들을 마주한 그는, 눈앞에 펼쳐진 걸작에 넋을 잃고 말았다."
 gaudi.915.f: "\"전하, 소인은 궁궐의 위용을 보기 전까지 제 자신이 얼마나 미천한 존재인지 헤아리지 못하였나이다. 광활한 해안의 모래 한 알, 밤하늘에 길 잃은 작은 별 하나가 된 기분이옵니다. 그날 소인은 이글거리는 태양 앞에 선 반딧불이 한 마리에 불과하였나이다!\n\n본 궁궐은 참으로 궁궐 중의 으뜸이요, 군주와 황제, 나아가 상제께서도 머무르실 안식처가 아니온지요! 전하의 명철한 혜안 덕에 소인들이 이토록 찬란한 위용을 미리 엿볼 수 있게 되었나이다. 소인은 전하의 그림자라도 핥고 싶을 뿐이요, 전하께서 뱉은 침조차 이 비천한 몸뚱이에 과분한 성은이옵니다.\n\n아아, 참으로 이 미천한 벌레 같은 놈이 전하를 의심하고, 대지를 의심하고, 천상천해의 만방을 의심하였나이다! 허나 틀린 것은 오직 소인이었사옵니다. 이곳에서도, 저곳에서도, 천상에서도 천하에서도 소인이 그릇되었나이다! 무릇 뱁새가 대붕에게 이르듯...\""
 gaudi.915.g: "간사한 자들이 역병처럼 끝도 없구나."
 gaudi.1005.t: "최초의 전보"
 gaudi.1005.d: "오늘 [GetPlayer.MakeScope.GetVariable('tesla_engineer_var').GetCharacter.GetFullName](이)가 자신이 개발한 부호로 된 전보를 처음으로 발송하였다. 이 시험은 완벽히 성공을 거두었다."
 gaudi.1005.f: "1843년 미국 연방의회는 새뮤얼 모스에게 워싱턴 D.C.와 메릴랜드주 볼티모어를 연결하는 전신선 건설에 3만 달러 규모의 예산을 배정하였다. 처음에 모스는 전선을 지하에 매설하기로 하고 에즐라 코넬에게 자신이 개발한 특수 전신선 매설 장비를 활용할 것을 요청하였다. 그러나 약 9.3마일(약 15km) 구간의 전선이 제대로 작동하지 않아 공사가 중단되었다. 모스는 영국에서 쿡과 휘트스톤이 전봇대를 활용해 전선을 쓰는 것을 알고 두 사람의 방식을 따르기로 하였다. 1844년 5월 1일 아직 미완 상태인 전신선의 시험 사용이 이루어졌다. 볼티모어에서 열린 휘그당 전당대회에서 헨리 클레이가 미국 대통령 후보로 지명되었다는 소식이 워싱턴 국회의사당으로 전달된 것이다. 모스의 무선망은 1844년 5월 24일 워싱턴 D.C.의 미국 국회의사당 옛 대법원 회의실에서 볼티모어의 마운트 클레어 역까지 연결되었으며, 워싱턴에 있던 모스가 볼티모어의 앨프레드 베일에게 첫 전보를 발송하면서 역사가 시작되었다."
 gaudi.1005.g: "하나님께서 행하신 일이 어찌 이리 크냐."
 gaudi.1006.t: "내연기관을 둔 최초의 자동차"
 gaudi.1006.d: "오늘 [GetPlayer.MakeScope.GetVariable('tesla_engineer_var').GetCharacter.GetFullName](은)는 내연기관 자동차를 타고 [SCOPE.sState('gaudi_car_state_1_scope').GetName]에서 [SCOPE.sState('gaudi_car_state_2_scope').GetName]까지 이동하였으며 시속 16km을 기록하였다."
 gaudi.1006.f: "\"시간당 16km라고? 그건 목숨을 잃을 수도 있는 위험한 속도가 아닌가!\""
 gaudi.1006.g: "부릉!"
