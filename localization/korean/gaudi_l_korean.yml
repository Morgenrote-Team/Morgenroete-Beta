 gaudi_palacio_cost_2_modifier: "벨라스 아르테스 궁전: 시공 예산 (2)"
 gaudi_palacio_better_worker_conditions_modifier: "벨라스 아르테스 궁전: 인부 보호"
 gaudi_palacio_new_jobs_modifier: "벨라스 아르테스 궁전: 새로운 일거리"
 je_gaudi_palacio_phase_1: "멕시코 문화의 심장"
 je_gaudi_palacio_phase_1_reason: "벨라스 아르테스 궁전 (예술 궁전)은 멕시코를 대표하는 문화 기관이다. 멕시코에서 가장 높은 기념 건축물이자, 연극과 무용, 음악과 오페라, 미술, 문학, 건축에 이르기까지 여러 분야에 걸쳐 제일 우수한 문화 시설로 손꼽히는 곳이다. 예술 궁전의 공사는 1904년 10월 1일에 시작되었으며, 당시 식민주의의 유산으로 여겨져 심하게 훼손된 국립극장을 대체하기 위한 것이었다."
 je_gaudi_palacio_phase_1_goal: "#E 건설 진행도#!가 #BLUE 120점#! 도달. 현재 #G [GetGlobalVariable('gaudi_palacio_progress').GetValue]#!점을 보유하고 있습니다. 보통 달마다 1점씩 획득합니다."
 je_gaudi_palacio_phase_2: "멕시코 문화의 심장"
 je_gaudi_palacio_phase_2_reason: "벨라스 아르테스 궁전의 설계는 이탈리아 건축가 아다모 보아리에게 의뢰되어 4년 이내에 완공될 것으로 전망되었다. 허나 이 마감 일정은 산적한 여러 문제 때문에 이룩할 수 없는 것이었다. 멕시코의 습한 토양 때문에 건물이 침하되는 문제가 있었고, 예산 확보의 어려움도 있었으며, 보아리 역시 멕시코 혁명으로 인해 이탈리아로 돌아가야 했던 것이다. 또한 건설 지연으로 예술과 건축적 취향이 변화하면서 아르데코 양식에서 영감을 얻어 차용하게 되었다."
 je_gaudi_palacio_phase_2_goal: "#E 건설 진행도#!가 #BLUE 120점#! 도달. 현재 #G [GetGlobalVariable('gaudi_palacio_progress').GetValue]#!점을 보유하고 있습니다. 보통 달마다 1점씩 획득합니다."
 gaudi_palacio_phase_1_decision: "벨라스 아르테스 궁전"
 gaudi_palacio_phase_1_decision_desc: "벨라스 아르테스 궁전 (예술 궁전)은 멕시코를 대표하는 문화 기관이다. 멕시코에서 가장 높은 기념 건축물이자, 연극과 무용, 음악과 오페라, 미술, 문학, 건축에 이르기까지 여러 분야에 걸쳐 제일 우수한 문화 시설로 손꼽히는 곳이다. 예술 궁전의 공사는 1904년 10월 1일에 시작되었으며, 당시 식민주의의 유산으로 여겨져 심하게 훼손된 국립극장을 대체하기 위한 것이었다."
 gaudi_palacio_phase_2_decision: "멕시코 문화의 심장"
 gaudi_palacio_phase_2_decision_desc: "벨라스 아르테스 궁전의 설계는 이탈리아 건축가 아다모 보아리에게 의뢰되어 4년 이내에 완공될 것으로 전망되었다. 허나 이 마감 일정은 산적한 여러 문제 때문에 이룩할 수 없는 것이었다. 멕시코의 습한 토양 때문에 건물이 침하되는 문제가 있었고, 예산 확보의 어려움도 있었으며, 보아리 역시 멕시코 혁명으로 인해 이탈리아로 돌아가야 했던 것이다. 또한 건설 지연으로 예술과 건축적 취향이 변화하면서 아르데코 양식에서 영감을 얻어 차용하게 되었다."
