 gaudi.1511.d: "우리 [concept_tesla_aeronautical_engineer] [GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')](이)가 마침내 우리 공군을 위한 신형 군용기를 제작하였다. 전쟁의 판도를 바꿀 엄청난 항공기다."
 gaudi.1511.f: "\"신형 비행기가 완성됐다는 이야길 들었는데. 뭐가 그렇게까지 새로운 건진 잘 모르겠어... 날개랑 엔지는 있더라. 다른 비행기하고 똑같아.\""
 gaudi.1511.g: "창공은 우리의 것이다!"
