 je_gaudi_construction_sector_project_reason: "우리 [concept_tesla_civil_engineer] [GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')](이)가 [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]의 [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] 현대화 사업에 나서고 있습니다.\n$mr_divider_for_je$\n이 사업은 매달 진행도를 얻습니다. 진행도가 #V 12점#!에 도달할 때마다 현재 건물에 새로운 변화 요인이 부여됩니다. 이 사업에 선정된 모든 건물이 변화 요인을 부여받게 되었다면 사업은 끝이 납니다.\n\n변화 요인은 총 세 가지가 존재합니다. 각각의 새로운 변화 요인마다 진행도를 다시 채워야 합니다.\n$mr_divider_for_je$\n현재 건물: [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]의 [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_tesla_improve_construction_project_modifier_1_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_tesla_improve_construction_project_modifier_2_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_tesla_improve_construction_project_modifier_3_type')]\n\n남은 건물 수 (현재 대상 제외): [JournalEntry.MakeScope.Var('mr_number_of_remaining_list_entries_var').GetValue|V0]곳\n\n현재 월간 진행도: #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_civil_research_progress_tt')] [GetPlayer.MakeScope.ScriptValue('tesla_monthly_civil_engineering_progress_value')|+2]#!#!"
 gaudi.1151.t: "최신 건설 공법"
 gaudi.1151.d: "우리 [concept_tesla_civil_engineer] [GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')](이)가 우리 [GetBuildingType('building_construction_sector').GetName]에 최신 기술을 도입하는 사업을 마무리지었다. 이제 우리나라의 건설 과정이 그 어느 때보다 가장 큰 효율을 보이게 된 만큼 건설 작업도 훨씬 빠르게 완료할 수 있게 되었다!\n\n개량된 건물 수는 총 [GetPlayer.MakeScope.Var('mr_num_improved_construction_buildings_var').GetValue|V0]곳이다."
 je_gaudi_modernizing_industries_project_reason: "우리 [concept_tesla_mechanical_engineer] [GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')](이)가 [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]의 [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName]를 대상으로 생산 방식 현대화에 주력하고 있습니다.\n$mr_divider_for_je$\n이 사업은 매달 진행도를 얻습니다. 진행도가 #V 24점#!에 도달하면 건물에 새로운 변화 요인이 부여됩니다.\n$mr_divider_for_je$\n현재 건물: [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]의 [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_tesla_improve_industries_project_modifier_1_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_tesla_improve_industries_project_modifier_2_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_tesla_improve_industries_project_modifier_3_type')]\n\n남은 건물 수 (현재 대상 제외): [JournalEntry.MakeScope.Var('mr_number_of_remaining_list_entries_var').GetValue|V0]\n\n현재 월간 진행도: #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_mechanical_research_progress_tt')] [GetPlayer.MakeScope.ScriptValue('tesla_monthly_mechanical_engineering_progress_value')|+2]#!#!"
 je_gaudi_civil_airports_project_reason: "우리 [concept_tesla_aeronautical_engineer] [GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')](이)가 [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]의 [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] 현대화 사업에 나서고 있습니다. \n$mr_divider_for_je$\n이 사업은 매달 진행도를 얻습니다. 진행도가 #V 18점#!에 도달할 때마다 현재 건물에 새로운 변화 요인이 부여됩니다. 이 사업에 선정된 모든 건물이 변화 요인을 부여받게 되었다면 사업은 끝이 납니다. 변화 요인은 총 세 가지가 존재합니다. 각각의 새로운 변화 요인마다 진행도를 다시 채워야 합니다.\n$mr_divider_for_je$\n현재 건물: [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]의 [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_gaudi_civil_airports_project_modifier_1_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_gaudi_civil_airports_project_modifier_2_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_gaudi_civil_airports_project_modifier_3_type')]\n\n남은 건물 수 (현재 대상 제외): [JournalEntry.MakeScope.Var('mr_number_of_remaining_list_entries_var').GetValue|V0]곳\n\n현재 월간 진행도: #underline #tooltip:[GetRawTextTooltipTag('gaudi_monthly_aeronautical_research_progress_tt')] [GetPlayer.MakeScope.ScriptValue('tesla_monthly_aeronautical_engineering_progress_value')|+2]#!#!"
 gaudi.1501.d: "우리 [concept_tesla_aeronautical_engineer] [GetPlayer.MakeScope.GetCountry.GetCustom('gaudi_dr_engineer_type')](이)가 국내 공항의 수용 규모 개선을 위해 긴 시간을 투자해 왔다. 활주로 개선부터 새로운 항공기 제작, 엔진 효율 향상에 이르기까지 다양한 부분에서 성과를 거두었다.\n\n개량된 건물 수는 총 [GetPlayer.MakeScope.Var('mr_num_improved_airport_buildings_var').GetValue|V0]곳이다."
 gaudi.1221.g: "진정한 공학의 경이로다."
