 douglas.209.t: "최신 장비"
 douglas.209.d: "#V [AddLocalizationIf( Scope.Var('douglas_mountain_expedition_var').IsSet , Scope.Var('douglas_mountain_expedition_var').GetFlagName)]#!의 등반에 나서는 과정에서 [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName](은)는 등산에 요구되는 조건에 비해 장비가 너무 좋아 과분할 정도라는 사실을 깨달았다."
 douglas.209.f: "등산대의 장비 수준이 산의 난이도보다 높다면 등반 초기의 위험 요소가 줄어들고 진행 보너스를 얻게 됩니다."
 douglas.209.g: "정상에서 만나세!"
 douglas.216.t: "의욕 상실"
 douglas.216.d: "우리 등산대는 오늘 다른 국가에서 #V [AddLocalizationIf( Scope.Var('douglas_mountain_expedition_var').IsSet , Scope.Var('douglas_mountain_expedition_var').GetFlagName)]#!을 최초로 정복했다는 소식을 접하게 되었다. 대원들 사이에서 불화가 빚어지고 있으며, 일부는 하산에 나섰고 [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName] 역시 등산을 포기하겠다는 의사를 공개적으로 밝힌 상황이다."
 douglas.216.f: "다른 국가가 산 정상을 먼저 등정하면 그 산을 오르려는 시도도 거의 확실히 포기하게 된다."
 douglas.216.g: "이번 원정은 그 의미를 잃었다."
 douglas_mountaineer_speech_tt: "등산 원정은 시간 초과까지 #YELLOW 60일의 시간#!이 주어집니다."
 douglas.208.t: "등정을 앞둔 다짐"
 douglas.208.d: "정상을 향한 마지막 전진을 앞두고 [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName](이)가 대원들에게 말을 건넸다. [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetHerHis] 목소리는 #V [AddLocalizationIf( Scope.Var('douglas_mountain_expedition_var').IsSet , Scope.Var('douglas_mountain_expedition_var').GetFlagName)]#!처럼 장대했다."
 douglas.208.f: "\"우리 위에는 정상이 있다. 그 정상은 차갑고, 고요하고, 움직이지 않는다. 정상은 용기를 따지지 않는다. 우리에게 의문을 던지지도 않는다. 그러나 우리는 한 걸음씩 내딛을 때마다 정상에 답한다. 정상에는 두드림도 영광도 없다. 오직 우리 뒤에 펼쳐진 풍경과 감히 도전했다는 자부심 뿐이다. 우리는 산을 만나러 온 것이 아니다. 산을 정복하러 온 것이다. 대원들 각자에게는 두려워할 권리가 있다. 하지만 어떤 두려움도 우릴 막을 순 없다. 오늘은 아니다.\""
 douglas.208.g: "[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFirstName](와)과 함께라면 산을 거스를 수 있다!"
 douglas_alpine_club_new_board_tt: "산악회의 신규 이사회가 선출됩니다."
 douglas.302.t: "산악회의 신규 이사국"
 douglas.302.d: "산악회는 오늘 [SCOPE.sState('douglas_alpine_club_state').GetStateRegion.GetCityHubName]에서 열린 회담을 통해 신규 이사국을 임명하였다."
 douglas.302.f: "산악회는 다음의 조직을 따른다는 결정을 내렸다.\n\n#V 회장국: [GetGlobalVariable('douglas_alpine_club_president_global_var').GetCountry.GetName|V]#!\n\n#V 이사국: [GetGlobalVariable('douglas_alpine_club_board_member_1_global_var').GetCountry.GetName|V] [GetGlobalVariable('douglas_alpine_club_board_member_2_global_var').GetCountry.GetName|V] [GetGlobalVariable('douglas_alpine_club_board_member_3_global_var').GetCountry.GetName|V] [GetGlobalVariable('douglas_alpine_club_board_member_4_global_var').GetCountry.GetName|V] [GetGlobalVariable('douglas_alpine_club_board_member_5_global_var').GetCountry.GetName|V]"
 douglas.302.g: "신규 이사국이 된 것을 축하드립니다."
 douglas.302.h: "뇌물 수수는 없었소?"
 douglas_mountaineering_international_expedition_modifier: "최근 국제 등반 원정대"
 douglas_mountaineering_international_expedition_setback_modifier: "산악회의 차질"
 douglas.311.t: "국제 등산 원정대 제안"
 douglas.311.d: "산악회 회원국인 [SCOPE.sCountry('douglas_board_scope').GetName]에서 국제 등산 원정대 조직을 요청하였다. 비용은 해당국에서 부담할 예정이다. 그러나 회장국은 해당 안건에 거부권을 행사할 수 있다."
 douglas.311.f: "\"여러분, 산은 국기나 국경을 따르지 않습니다. 나라 간의 사소한 다툼을 초월하고, 우리네 경쟁심에 흔들리지 않는 것입니다. 그렇기에 저는 오늘 여러분 앞에 서서 하나의 선견지명을 제시하렵니다. 그것은 바로 정치와 혈연을 초월한, 인류라는 정상입니다. 유럽과 아메리카, 심지어 저 멀리 아시아에서 최고의 등반가들을 불러모아, 포르투갈인도, 프랑스인도, 작센인도 아닌 용감한 자들의 연대로서 산에 맞서 나갑시다. 이는 의지와 밧줄의 승리일 뿐안 아니라 외교와 신뢰, 그리고 함께 나누는 영광의 승리가 될 것이외다. 우리가 남길 유산은 정복이 아닌 협력이 되어야 합니다.\""
 douglas.311.g: "좋은 제안일세."
 douglas.311.h: "싫소."
 douglas.312.t: "거부권 행사"
 douglas.312.d: "산악회 회장국인 [SCOPE.sCountry('douglas_president_scope').GetName]에서 국제 등산 원정대 출범 제의에 거부권 행사를 선언했다."
 douglas.312.f: "\"프랑스 사람하고 등산을 하라고? 또 스위스 사람하고? 차라리 실내화를 신고 곰하고 싸우라지. 영국인이 홍차 문제로 순순히 따르는 걸 본 적 있는가? 텐트는 또 어떻고? 이젠 됐소. 저번에 외국 등산대를 초청했더니 슈냅스를 네 통이나 가져오고 지도는 잊어먹더군. 더군다나 여러분, 산은 어디 가지 않고 나 역시도 마찬가지라오. 영광의 쟁취란 국제 연합을 이루어서 빙하 위의 소풍에 나서는 것이 아니라, 나 자신이 신은 부츠를 눈밭에 찍어서 쟁취하는 것이오. 우리는 품위 있게 등산하겠소, 아니면 관둘 것이고!\""
 douglas.312.g: "회장국은 대체 누가 뽑은 거야?"
 douglas.321.t: "등산 대상 선정"
 douglas.321.d: "국제 등산 원정대가 승인됨에 따라 산악회는 이제 궁극적인 의문을 두고 논쟁을 벌이고 있다. 어느 봉우리를 영광의 전장으로 삼을 것인가?"
 douglas.321.f: "산악회는 등산회를 둔 국가의 영토 내에 존재하는 산을 등산 대상으로 선정할 수 있다. 별도의 등산 허가는 필요하지 않다. 다만 산의 등산 난이도가 2단계~4단계여야 한다."
 douglas.321.g: "너무 오르기 힘든 산은 피하자."
 douglas.321.h: "예로부터 흔히 알려진 산을 택하자."
 douglas.321.i: "제대로 도전해볼 만한 산에 올라야 한다!"
 douglas.331.t: "산악회 원정"
 douglas.331.d: "산악회에서 야심찬 목표를 선언하였다. 각국 최고의 산악인들로 구성된 국제 원정대가 이름있는 산 정상을 등정할 전망이다. 이번 정복 대상은 #V [AddLocalizationIf( Scope.Var('douglas_mountain_expedition_var').IsSet , Scope.Var('douglas_mountain_expedition_var').GetFlagName)]#!이다."
 douglas.331.f: "산악회 이사회의 전 회원국은 산악회 차원에서 조직하는 국제 등산 원정대에 참가할 수 있다. 산악회 원정에 참여하려면 활동 중인 산악인이 필요하다. 국제 원정은 성공 확률이 거의 무조건이라 하여도 좋지만, 결성되는 기회 자체가 드물다. 산악회 회장국은 등정에 성공하면 초등의 영예와 가장 높은 위신을 획득하지만, 원정에 참여한 나머지 이사국들도 보상을 받게 된다."
 douglas.331.g: "정상에 우리 모두의 깃발을 꽂읍시다."
 douglas.341.t: "만국의 등정"
 douglas.341.d: "깃발은 올려졌다. 보급품도 준비 만반이다. 국제 원정대가 그 누구도 아직 오르지 못한 곳에 등정할 준비에 나섰다."
 douglas.341.f: "베이스캠프에 고요함이 감돌고, 세계 각국의 억양이 상쾌한 아침 공기와 어우러졌다. 말없이 부츠 끈을 조이는 사람과, 긴장감을 풀기 위한 우스개를 마지막으로 나누는 사람도 있었다. 캠프 가장자리에서 [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName](은)는 구름에 가려진 정상을 바라보며 가만히 서 있었다.\n\n\"아직 아무도 오르지 못했다더군요.\" 프랑스 남자가 담배에 불을 붙이며 중얼거렸다.\n\n\"그럼 이제 오를 때가 된 거죠.\" 영국 여자가 조용히 미소 지으며 답했다."
 douglas.341.g: "세계가 한마음 한뜻으로 오른다."
 douglas.351.t: "정상의 영광"
 douglas.351.d: "몇 주간에 걸친 분투 끝에 정상에 이르렀다. [GetGlobalVariable('douglas_alpine_club_president_global_var').GetCountry.GetName|V]에서 산악회를 대표하여 등정에 성공한 것이다."
 douglas.351.f: "그들은 희박한 공기 속에서 어깨를 나란히 하고 서 있었다. 수염과 속눈썹에는 얼음 결정이 달라붙었고, 얼굴에는 피로가 역력했다. 허나 뒤로 물러선 이는 아무도 없었다. 산악회 회장이 원정대 깃발을 펼쳐 눈 위에 굳게 꽂았다.\n\n모두가 한 곳으로 모여들었다. 힘들게 이 높은 곳까지 끌어올린 카메라가 자리를 잡았다. 이들 뒤로 구름이 걷히면서 아래쪽의 계곡이 마치 그림 같은 지도처럼 드러났다.\n\n\"움직이지 마세요.\" 사진사가 말했다. \"이 사진을 길이 간직합시다.\"\n\n셔터가 찰칵 울렸다.\n\n그 한 장의 사진이 전세계의 응접실과 강당, 지면을 장식하게 될 것이다. 사진 속에서 회장은 깃발을 들고 꼿꼿이 서 있었고, 동상에 걸렸지만 활짝 웃음 핀 산악인들이 그를 둘러쌌다. 이들은 국가가 아닌 등정으로 하나 된 것이었다."
 douglas.351.g: "과학과 영광과 인류를 위하여."
 douglas_add_international_expedition_effect_tt: "#default_text [GetPlayer.GetName]에서 산악회 원정을 완료함"
 je_douglas_international_mountaineering_expedition_preparation: "산악회 원정대 준비"
 je_douglas_international_mountaineering_expedition_preparation_reason: "산악회 이사회의 전 회원국은 산악회 차원에서 조직하는 국제 등산 원정대에 참가할 수 있다. 산악회 원정에 참여하려면 활동 중인 산악인이 필요하다. 국제 원정은 성공 확률이 거의 무조건이라 하여도 좋지만, 결성되는 기회 자체가 드물다. 산악회 회장국은 등정에 성공하면 초등의 영예와 가장 높은 위신을 획득하지만, 원정에 참여한 나머지 이사국들도 보상을 받게 된다.\n\n국제 원정대에 참여하려면 산악인 메뉴의 '조직' 창에서 참가 신청을 해야 합니다. 본 일지 항목이 만료되지 않은 한 참가 신청은 가능합니다."
 je_douglas_international_mountaineering_expedition: "산악회 원정"
 je_douglas_international_mountaineering_expedition_reason: "산악회가 이끄는 등산 원정대는 대개 등정이 보장되기 마련이다. 허나 원정대의 기간은 참여하는 회원국의 수에 크게 좌우된다. 등정에 성공할 경우 산악회 회장국은 첫 등장의 영광을 누리며 가장 큰 위신을 확보하지만, 원정대에 참가한 다른 회원국들도 전원 보상을 받는다."
