 ACHIEVEMENT_douglas_president: "윗세오름"
 ACHIEVEMENT_DESC_douglas_president: "산악회의 회장국이 되십시오."
 ACHIEVEMENT_douglas_seven: "7대륙 최고봉"
 ACHIEVEMENT_DESC_douglas_seven: "일곱 곳의 봉우리를 등정하십시오."
 ACHIEVEMENT_douglas_everest: "조지 말로리의 마지막 소원"
 ACHIEVEMENT_DESC_douglas_everest: "1953년 이전에 에베레스트산을 등정하십시오."
 je_douglas_mount_everest_expedition_preparation: "에베레스트산 원정 준비"
 je_douglas_mount_everest_expedition_preparation_reason: "세계 최고봉을 등정한다는 것은 뛰어난 등반가 뿐만 아니라 철저한 준비가 요구된다. 등반 준비를 철저히 할 수록 기본적인 위험은 줄어들게 된다."
 je_douglas_mount_everest_expedition: "에베레스트산 원정"
 je_douglas_mount_everest_expedition_reason: "에베레스트산은 산 중의 산이다. 이곳에서의 성과는 오로지 결과로 평가된다. 등반가의 성공 여부는 해당 인물의 능력에 달려 있다. 에베레스트 등반의 기본 위험도가 매우 높은 관계로, 원정대 역시 사소한 실수가 최악의 결과로 이어지는 것을 막기 위해 사전에 철저한 과학적 자문을 구했을 것이다."
 je_mount_everest_metereologist_tt: "#default_text [GetPlayer.GetName]에서 #V $curie_meteorological_physicist$#! [concept_character_trait]을 지닌 [concept_curie_physicist]을 보유함#!"
 je_mount_everest_mechanical_engineer_tt: "#default_text [GetPlayer.GetName]에서 #V $tesla_mechanical_engineer$#! [concept_character_trait]을 지닌 [concept_tesla_engineer]을 보유함#!"
 je_mount_everest_good_physician_tt: "#default_text [GetPlayer.GetName]에서 #V $panum_physician_experienced$#!이나 #V $panum_physician_famous$#! [concept_character_trait]을 지닌 [concept_panum_physician]를 보유함#!"
 je_mount_everest_good_ethnologist_tt: "#default_text [GetPlayer.GetName]에서 #V $roy_ethnologist_experienced$#!이나 #V $roy_ethnologist_famous$#! [concept_character_trait]을 지닌 [concept_roy_ethnologist]를 보유함"
 je_mount_everest_good_geologist_tt: "#default_text [GetPlayer.GetName]에서 #V $agassiz_geologist_experienced$#!이나 #V $agassiz_geologist_famous$#! [concept_character_trait]을 지닌 [concept_agassiz_geologist]를 보유함#!"
 douglas.401.t: "신성한 산의 기슭에서"
 douglas.401.d: "원정대가 히말라야 산맥에 이르면서, 세계 최고봉에 오르는 진로를 택할 순간이 다가왔다."
 douglas.401.f: "[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName](은)는 지도를 펼쳐 바위 위에 놔 두었다. 노선은 두 가지. 선택도 두 가지다.\n\n북쪽 면으로 가는 길은 티베트 지역을 통과하는 기존 경로. 외교적으로도 마찰을 벌일 일도 없고, 측량 조사도 오래되었으며, 옛 원정대의 흔적이 남아 있다.\n\n남쪽 면으로 가는 길은 네팔에 위치한 금단의 계곡. 알 수 없는 지형에 신의 분노를 살 지 모를 속삭임이 들려온다. 허나 경사면은 더 완만할지 모른다.\n\n두 길을 동시에 나설 수는 없다.\n\n산은 오로지 하나의 시도만 허락할 뿐이다."
 douglas.401.g: "북쪽 면 경로를 따라간다."
 douglas.401.h: "남쪽 면 경로를 따라간다."
 douglas.411.t: "금단의 계곡"
 douglas.411.d: "수 개월에 걸친 협의 끝에 원정대는 초몰룽가산 남봉 등반 시도에 나섰다."
 douglas.411.f: "그곳은 '금단의 계곡'이라고들 하였다. 수십 년 동안 외지인이 다르질링의 마지막 거점을 넘어 발을 들이는 일은 없었다. 허나 그날 아침, 안개가 걷히고 [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName](와)과 원정대는 마지막 능선을 넘어섰다.\n\n숲을 굽이치며 흐르는 강은 더 이상 지도에 표시되지 않았다. 길은 없었다. 염소들이 다니는 오솔길과 인근 마을에서 들려오는 나지막한 목소리 뿐. 아무리 셰르파라도 이런 곳은 불안한 듯 싶었다. 밤에는 알프스나 안데스 산맥에서도 들어본 적 없는 소리가 바람을 타고 들렸다. 빙하에서 흘러나온 듯한 낮고 숨소리 같은 침묵이었다. 대원들도 말을 아꼈다. 짐 나르는 동물들도 동요하기 시작했다. 의사는 고산병 증세가 생각보다 일찍 나타났다고 보고했다. 허나 누구도 돌아가지 않았다. 나무 너머에, 안개 너머에, 계곡의 마지막 굽이 너머에, 남쪽에서 누구도 손대지 않은 에베레스트의 모습이 펼쳐졌기 때문이다.\n\n그 산은 아름다웠다. 그리고 마치 모두가 죽음에 이르기를 바라는 듯했다."
 douglas.411.g: "우리가 가는 길에 도로는 없다."
 douglas.412.t: "저 너머의 세락"
 douglas.412.d: "원정대는 눈 덩어리와 벌어진 크레바스가 뒤엉킨 미로인 쿰부 빙폭 기슭에 도착했다."
 douglas.412.f: "빙하는 아무 말 없이 움직인다. 마치 살아있는 것처럼 끼익거리고 몸을 비틀며 소리를 낸다. [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName]에게 있어 얼음은 낯설지 않았으나 이런 모습은 처음이었다. 산의 능선이란 게 없었다. 기울어지고 속은 텅 빈 거석이 얼어붙은 폐처럼 푸르렀고, 당장이라도 부서질 것만 같았다.\n\n한낮에 이르러 기온이 올랐다. 좌측에서 둔탁한 금 가는 소리가 울려 퍼치고, 곧이어 또다른 균열이 들리더니 집채만한 얼음이 뜯겨져 나가 유리 조각처럼 떨어졌다. 셰르파는 흩어졌다. 누군가는 크레바스 근처에서 발을 헛디뎠다 간신히 구조되었다. 지도는 아무 소용이 없었다. 로프는 얼어붙어 끊어졌다. 햇빛은 등산 속도보다 더 빠르게 발 디딜 곳을 독여벼렸다.\n\n그리고 이들은 지금껏 절반쯤 왔을 뿐이었다.\n\n앞으로 나아갈 수도 있다. 빙하가 버텨주기를 바라면서. 아니면 물러나서 새벽녘 추위가 얼음을 굳힌 다음에 재등반할 수도 있다.\n\n허나 이곳에서 흘려보내는 시간이라 함은, 해발 8천 미터 너머에서 공기 없이 보내는 시간이란 뜻이기도 하다."
 douglas.412.g: "전진한다. 우리는 오르기 위해 여기까지 왔다."
 douglas.412.h: "도저히 넘을 수 없는 장애물이다."
 douglas.413.t: "백색의 화로"
 douglas.413.d: "원정대가 웨스턴 쿰에 진입하였다. 높이 솟은 빙벽 사이로 넓게 펼쳐진 빙하 계곡으로, 사방에서 햇빛이 반사되고 있었다."
 douglas.413.f: "원래는 쉬운 구간이어야 했다. 평탄한 길을 걸으며 로체벽에 도달하기 전 잠시 숨을 돌리는 구간이었다. 하지만 아무도 더위에 관해서는 경고하지 않았다.\n\n정오가 되자 웨스턴 쿰은 화덕으로 변했다. 대원들의 장화 아래에서 눈이 진창으로 녹아내렸다. 고글은 김이 서리거나 깨졌다. 양쪽 얼음벽이 햇빛을 눈부시게 아래로 반사하여, 마치 불타는 유리 위를 걷는 듯했다. [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName](이)가 말을 하려 했지만 [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetSheHe]는 이미 [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetHerHis] 혀에 감각이 느껴지지 않았다.\n\n짐꾼 한 명이 쓰러졌고 다른 한 명은 구토했다. 동상의 위협은 일광화상으로 바뀌었다. 빙하는 대원들의 무게를 원망하듯 발밑에서 신음했다. 바람도, 소리도, 그늘도 없었다. 오직 눈부신 빛과 열기, 그리고 세계의 지붕에서 산 채로 삶아지고 있다는 느낌만이 서서히 밀려왔다.\n\n그럼에도 앞의 장벽은 대원들을 불렀다. 푸르고 수직으로 솟은 로체벽이었다.\n\n기다린다는 것은 더 많은 시간과 식량과 체력을 포기한다는 뜻이었다.\n\n움직인다는 것은 태양을 상대로 도박한다는 뜻이었다."
 douglas.413.g: "전진한다. 지금 멈출 수는 없다."
 douglas.413.h: "이런 미친 짓은 그만둡시다."
 douglas.414.t: "푸른 장벽"
 douglas.414.d: "사우스콜에 도달하려면 원정대는 악화되는 환경 속에서 가파르고 노출된 로체벽을 올라야 한다."
 douglas.414.f: "이제는 등반이라 부를 수도 없었다. 중력 그 자체에 맞서 위로 기어가는 일이었다. 발밑의 얼음은 대리석처럼 단단하고 강철처럼 푸르렀다. [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName](은)는 양쪽 장화를 힘껏 박고 얼음도끼를 내리친 뒤 그것이 버텨 주기를 기도했다. 한 걸음마다 몇 분이 걸렸고, 한 번의 호흡마다 전쟁을 치러야 했다.\n\n저 아래에서는 웨스턴 쿰이 거짓된 평온 속에서 빛났다. 위로는 장벽이 끝없이 뻗어 있었다. 바람이 다시 불기 시작했다. 폭풍은 아니었지만 뼛속의 온기를 긁어 가는 메마르고 거친 쉿소리였다. 밧줄은 얼고 손가락은 굳었다. 그러나 실수할 여지는 없었다. 한 명이 미끄러지면 세 명이 함께 추락할 수 있었다.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName]의 뒤에서 누군가 기침했다. 눈 위에 피가 떨어졌다. 셰르파 한 명이 휘청이고 있었다. 너무 높고, 너무 빠르게 올라왔다. 하지만 이미 되돌리기에는 늦었다.\n\n장벽에는 몸을 숨길 곳도, 쉴 곳도 없었다. 오직 상승만이 있을 뿐이었다.\n\n그런데도 위쪽 능선은 두 시간 전보다 조금도 가까워진 것 같지 않았다."
 douglas.414.g: "오른다. 돌아가기에는 너무 멀리 왔다."
 douglas.414.h: "도망쳐, 이 바보들아!"
 douglas.415.t: "마지막 야영지"
 douglas.415.d: "원정대가 사우스콜에 도착했다. 이제 정상 능선과 마지막 선택만이 남았다."
 douglas.415.f: "그것은 마치 달 위에서 야영하는 듯했다. 날씨는 불안하고 바람은 사정없이 몰아쳤다.  천막은 세찬 바람에 마치 웅크린 동물처럼 벌벌 떨었다. 새소리도, 목소리도, 빙하의 금 가는 소리도 들리지 않았다. 얇고 거친 숨소리 뿐. 사우스 콜은 쉬었다 가는 곳이 아니라... 영광이냐 죽음이냐 둘 중 하나를 기다리는 곳이었다.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName](은)는 천막 속에 구부정하게 앉아 떨리는 손으로 지도를 응시했다. 정상으로 향하는 길은 확실했다. 남동쪽 산등성이를 따라 세계의 꼭대기에 오르는 것이다.\n\n허나 산소는 바닥나고 있다. 보급품도 줄어든다. 손가락은 검어진다. 해가 뜬 이후로 입을 여는 이는 아무도 없었다.\n\n우리에게 남은 동력은 마지막 한 번의 진격 뿐. 최후의 시도였다. 정상은 수직으로 1,000m도 되지 않은 곳에 있다... 허나 그곳은 죽음의 구역, 가는 길은 천 킬로미터도 넘을 지도 모른다.\n\n바깥에는 바람이 마치 생명체처럼 울부짖었다. 이제는 선택해야 할 순간.\n\n등정이냐 하산이냐.\n\n사느냐 오르냐."
 douglas.415.g: "등정에 나선다."
 douglas.415.h: "등정을 그만둔다. 목숨을 보전하고 다른 해를 기약하자."
 douglas.416.t: "[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName] 스텝"
 douglas.416.d: "정상 바로 밑의 예상치 못한 장애물이 마지막 산등성이를 가로막고 있었다... 그것은 다름아닌 수직 얼음 암벽이었다."
 douglas.416.f: "태양은 아직 떠오르지 않았다. 꼭대기의 능선이 동트기 전의 빛에 창백하게 빛나고, [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName](은)는 잠시나마 길이 열려 있을 것이라 생각했다. 공기는 입을 열기에 너무나 희박했다. 바람은 장갑과 고글 속을 뚫고 들어왔다. 그런데 그때... 그것이 원정대를 멈춰세웠다.\n\n수직면. 그 높이는 10미터에서 12미터는 되어 보였다. 그냥 넘어가기엔 너무 가파르고, 피해 가기엔 너무 크다. 수직 암벽 하나가 마치 칼날처럼 능선을 끊어놓고 있다... 그리고 우리에겐 로프도, 송곳도, 길목도 없다. 지도에는 없던 것이었다. 어느 기록에도 이런 것은 언급하지 않았다. 그 누구도 이런 걸 경고하지 않았다.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName](은)는 암벽을 찬찬히 올려다보였다. 눈이 얇게 쌓여 있었다. 성에가 낀 검은 화강암이었다. 셰르파 한 명이 왼편을 살펴보았지만, 낭떠러지뿐이었다. 다른 한 명이 오른편을 보니, 하늘 말곤 없었다.\n\n에베레스트산은 단 하나의 마지막 묘책을 숨겨두고 있었다. 최후의 암벽다.\n\n주변에는 아무런 길도 없었다. 넘어가야 할 뿐이다.\n\n훗날 그들은 이 암벽의 처음 발견한 사람에게서 이름을 따와 붙였다."
 douglas.416.g: "[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName] 스텝을 오른다."
 douglas.416.h: "너무 위험해. 발길을 돌린다."
 douglas.421.t: "금기의 벽"
 douglas.421.d: "현지 당국의 허가를 받은 원정대가 롱복 계곡을 따라 북쪽 방면으로 에베레스트산을 오르기로 계획을 세웠다."
 douglas.421.f: "그곳에서는 환대는 없이 오직 바람만이 있을 뿐이었다. 여러 순례기가 빛 바랜 채 펄럭이고 있었다. 언덕 위의 수도승들은 움직임도 말도 없이 유령처럼 내려다보았다. 길목이 끝나는 곳에서 빙하가 시작된다... 그리고 그 빙하는 침묵으로 우리를 이끈다.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName](은)는 기록을 훑어보았다. 말러리, 노튼, 핀치. 그들의 지도는 미완성이었고 기록지는 아리송했다. 허나 그때도 그곳엔 산이 있었고, 그들은 이런 꾸밈말을 동원했다. 높이 솟은, 회색빛의, 엄숙한 산.\n\n롱북 수도원 인근에 야크가 멈춰 섰다. 여기서부터 이 야크들이 모든 것을 등에 지고 갈 것이다. 원정에 더 이상 이론의 영역은 없고, 돌길과 얼음과 고도로 이어졌다. 그들 위의 하늘은 얇고 부숴질 것만 같았다. 눈은 내리지 않고 공중에 매달렸다. 밤만 되면 빙하는 삐걱댔다. 마치 태곳적의 무언가가 잠들어 뒤척이는 것처럼.\n\n짐꾼 한 명은 산 위에 사는 신 이야기를 하며, 그 신을 아직 달래지 못했다고 중얼거렸다.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName](은)는 통역해달라 하지 않았다."
 douglas.421.g: "북쪽 방면의 길은 허락은 받아도 환대는 받지 못하는구나."
 douglas.422.t: "빙하의 균열"
 douglas.422.d: "동부 롱북 빙하가 위험 조짐을 보였다. 무너져 내린 빙탑과 숨겨진 크레바스가 원정대의 전진을 위협하고 있었다."
 douglas.422.f: "태양빛이 계곡 바닥을 겨우 데우고 있을 즈음, 어떤 소리가 처음으로 들려왔다... 얼음 아래 깊은 곳에서 텅 비어 신음하는 듯한 균열 소리였다. 그러더니 또 소리가 일었다. 전 대원은 얼어붙었다. 야크는 가만 있지 못했다. 절벽 위에서 눈이 천천히, 식식 소리를 내며 쏟아져 내렸다.\n\n멀리서 본 동부 롱북 빙하는 고요해 보였지만, 가까이서 보니 푸르른 능선과 크레바스 지대, 기울어진 빙탑이 복잡하게 얽혀 있었다. 발걸음 하나하나가 조심스럽고, 발자국 하나하나가 도박이었다.\n\n원정대는 능선을 왼쪽으로 둘러 가려고 했다. 얼음바닥이 무너져 내렸다. 짐꾼 하나가 소리소문 없이 사라지고, 로프에 매달린 또다른 짐꾼이 소리를 질렀다. 그가 찬 아이젠이 매끄러운 얼음 표면을 긁었지만 파고들 틈이 없었다. 대원들은 그를 끌어당겨보니 피투성이에 눈을 크게 뜨고 있었다. 누구도 오랜 시간 동안 입을 열지 않았다.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName](은)는 앞을 바라보았다. 경사면이 평평해지기까지 3km에 달하는 빙하 지대가 계속 이어져 있었다. 대원들은 지금 즉시 돌파에 나서거나, 후퇴하여 날이 더 추워지기를 기다려서 얼음이 단단해지면 재시도에 나서는 수밖에 없었다.\n\n허나 날씨는 변덕스러웠다. 구름은 북소리처럼 몰려왔다. 지체하면 폭풍이 몰아칠 수도 있었다."
 douglas.423.t: "빙벽"
 douglas.423.d: "노스 콜로 향하는 길목에서 대원들은 바람과 그림자가 몰아치는 가파르고 노출된 빙벽을 오를 수밖에 없었다."
 douglas.423.f: "등산로는 위로 가파르게 뻗어 있었다. 강철처럼 단단한 빙하가 하늘로 곧장 이어졌다. 노스 콜은 얼음에 새긴 약속처럼 그들 위에 아른거렸다. 허나 길은 없었다... 오직 경사로와 바람, 두려움 뿐.\n\n원정대가 높이 올라갈 수록 바람도 점차 매서워졌다. 바람소리는 으르렁거리는 정도가 아니라 비명을 지르는 듯했다. 암벽에서 눈을 뜯어 유리 조각처럼 얼굴을 덮졌다. 앵커는 고정되지 않는다. 로프는 뻣뻣해졌다. 부끄럼 많은 태양은 구름 사이로 숨어들었다.\n\n한 대원이 미끄러졌다. 그의 비명은 짤막했다. 나머지 대원들은 그를 간신히 붙잡았다. 하지만 이제 로프는 닳고 말았다. 저 위의 능선은 더 이상 가까워 보이지 않았다.\n\n몇몇 셰르파는 계속 나아가기를 거부하고 눈밭에 무릎을 꿇고서 보이지 않는 신들에게 보내는 기도를 속삭였다.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName](은)는 마지막 정점의 터에 서 있었다. 능선은 마치 환각처럼 저 위에 아른거렸다. 억지로라도 오르든, 하산하여 로프를 단단히 챙기고 따뜻한 날씨에 다시 도전하든 둘 중 하나였다.\n\n그러나 지체하면 폭풍우를 만날 위험이 있었다. 아니면 그보다 더 나쁜, 의구심이라는 게 생길 수도 있었다."
 douglas.424.t: "숨결의 끝"
 douglas.424.d: "원정대가 노스 콜 위에 마지막 거점을 꾸렸다. 그곳은 바람과 정상의 무게에 그대로 노출된 곳이었다."
 douglas.424.f: "그곳에 피난처 같은 건 없었다. 오로지 바람과 없는 공기를 찾는 숨소리만 있을 뿐. 천막이 온 세찬 바람에 휘어지는 것이 마치 산 자체가 이들을 삼켜버리는 듯했다.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName](은)는 아직 얼음으로 뒤덮인 침낭 안으로 기어들어갔다. 온도계는 무용지물이었다. 추위는 더 이상 숫자로 표현할 것이 아니라, 생존의 조건이었다. 화롯불도 식욕도 없다. 그저 몸을 떨며, 이미 얼어붙기 시작한 밸브를 통해 마스크로 산소가 끊임없이 새어들어가는 소리만 들렸다.\n\n셰르파 한 명은 더 이상 말하지 않았다. 그는 눈을 뜬 채 미동도 없이 앉아 있었다. 그 손가락은 회색으로 변해 있었다. 누군가는 돌아가고 싶다고 중얼거렸지만 누구도 요구하지는 않고 있었다.\n\n이들은 지금 8,000m 고도 너머, 죽음의 구간에 자리해 있다. 근육은 더 이상 회복되지 않았다. 몸은 살아남기 위해 스스로를 갉아먹었다. 숨쉬는 것조차 선택의 문제였다.\n\n정상의 능선은 저 위에 놓여 있다. 원정대는 내일 그곳에 도달하는가. 아니면 다시는 입밖에도 꺼내지 않는가. 둘 중 하나였다."
 douglas.425.t: "제2의 스텝"
 douglas.425.d: "정상을 목전에 둔 원정대는 깎아지를 듯한 얼음 암벽과 마주했다. 북쪽 능선에서 가장 큰 장애물을 만난 것이다."
 douglas.425.f: "마치 거인들이 두른 방벽처럼, 그것은 능선에 우뚝 솟아올랐다. 높이는 10m에, 얼음으로 뒤덮인 검은 수직벽. 제2의 스텝이었다.\n\n사전 경고는 없었다. 이것을 표시한 지도도 없었다.\n\n오르막길은 여기서 끝난다. 한쪽에는 수천 미터에 달하는 허공이, 다른 한쪽에는 발폭만한 좁은 능선이 나 있었다. 바람이 겉옷 속을 헤집어왔다. 산소는 마스크 사이로 연기처럼 새어나왔다.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName](은)는 위쪽을 깊이 올려다보았다. 손으로 확실히 잡고 올라갈 만한 건 없었다. 균열도 없었다. 그저 얼어붙은 숨결로 매끌거리는 백지 같은 암벽이었다. 셰르파는 더 이상 못 가겠다고 했다. 다른 대원들은 푹 패인 눈으로 입을 열기조차 버거워 가만히 서 있었다.\n\n한 대원이 짐을 놓고 올라가 보자고 제안했다. 다른 누군가가 올라가서 로프를 설치하겠다고 나섰다. 그러나 남은 로프는 없었다.\n\n이들이 닿은 곳은 발길을 돌려야 하는 곳. 그렇지 않으면 스러져야 하는 곳이었다."
 douglas.425.g: "제2의 스텝의 등반을 시도한다."
 douglas.425.h: "돌아선다. 여기까지다."
 douglas.431.t: "세계의 지붕"
 douglas.431.d: "[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName](이)가 초몰룽마산의 정상에 도달했다. 세계의 정상에 올라선 최초의 인간이 된 것이다."
 douglas.431.f: "바람은 불지 않았다. 아무 소리도 들리지 않았다. 오직 [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetHerHis] 발 밑에 밟힌 눈소리 뿐. 그리고 뒤에 남겨진 세상의 텅 빈 침묵만이 감돌았다.\n\n마지막 발걸음은 꿈 속을 헤메이는 듯했다. 폐는 타들어가고, 눈은 흐릿하고, 몸은 떨렸다... 그러더니 위에 문득 아무것도 펼쳐지지 않았다.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName](은)는 정상에 홀로 섰다. 태양빛이 화염처럼 눈밭을 내리쬐고 있었다. 저 한참 아래에는 구름들이 대양처럼 떠다니고 있었다. 한때 웅장한 자태를 자랑하던 봉우리들은 이제 구깃한 종이처럼 아래에 펼쳐져 있었다.\n\n수평선은 굽이졌다. 시간은 정지했다. 얼움과 숨 막힐 듯한 하늘에 새기는, 단 하나의 순간이었다."
 douglas.431.g: "제3의 극지는 우리 것이다."
 douglas.432.t: "산이 기다린다"
 douglas.432.d: "물자 부족과 탈진, 줄어드는 희망에 직면한 원정대가 등정을 마다하고 철수를 택했다."
 douglas.432.f: "세상에 쉬운 결단이란 것이 어디 있을까. 등정을 끝낸 것은 폭풍도, 동상도, 굶주림도 아니었다. 모닥불 주변에 침묵이 감돌았다. 대원들의 눈빛은 더 이상 고개를 들지 않았다. '얼마나 남았냐'가 아니라 '왜 가야 하느냐'를 묻는 대원들이었다.\n\n지도는 찢어졌고, 밧줄은 얼어붙어 뻣뻣하게 굳어 있었다. 짐꾼들은 어둠 속에서 중얼거리며 기도했다. 심지어 [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName]조차 더 이상 꼭대기가 아닌... 그저 하늘만 바라보고 있었다.\n\n원정대는 짊어질 수 없는 짐을 땅속에 묻었다. 고개 아래 돌무더기 위에 깃발을 꽂아 두었다.\n\n내리막길에서 그 누구도 입을 열지 않았다. 허나 그들의 침묵 속에는 부끄럼 한 점 없었다."
 douglas.432.g: "에베레스트에 오르지 못한 것은 실패가 아니다. 기약이다."
 douglas.433.t: "영원히 돌아오지 못한 그들"
 douglas.433.d: "최후의 전진이 있은 뒤, 아무 소식도 들려오지 않았다. 산은 침묵을 지켰다."
 douglas.433.f: "마지막 신호는 해질녘에 왔다. 능선에 희미한 불빛이 깜빡였다. 하늘 바로 앞에 형상이 움직였다. 그리고... 아무도 없었다.\n\n며칠 동안 산비탈을 수색했다. 셰르파들이 빙하를 샅샅이 뒤졌다. 로프도, 장갑도 없다. 오직 어디로도 이어지지 않는, 바람에 날린 발자국 뿐.\n\n원정대가 얼마나 멀리까지 갔는지는 알 도리가 없었다. 정상에 도달했는지조차 알 수 없다. 아래의 세상을 온전히 굽어보았는지도 모른다.\n\n한가지는 분명했다. 그들은 돌아오지 않았다.\n\n누군가는 추락했을 거라 말한다. 또 누군가는 눈밑에 묻혀, 한쪽 팔을 하늘로 뻗고 있을거라 했다.\n\n그러나 다른 이야기를 거론하는 이들도 있었다... 그 산이 그들을 받아들였다는 것이다. 그리고 여전히 그곳에, 얼음과 돌무더기 속에 남아, 누군가가 따르기를 기다리고 있을 거라고."
 douglas.433.g: "원정대는 전설 속으로 사라졌다."
 douglas_third_pole_modifier: "제3의 극지"
 douglas_mount_everest_physicist_button: "히말라야 기상 예보"
 douglas_mount_everest_physicist_button_desc: "지난날 원정에서는 여러 기상 상황이 실패 원인으로 작용하였습니다. 기상학자 특성을 지닌 물리학자는 원정대가 언제 등정에 나서면 최고의 전망을 누릴 수 있을지 최적의 날짜를 판정할 수 있습니다."
 douglas_mount_everest_engineer_button: "산소 공급 개선"
 douglas_mount_everest_engineer_button_desc: "극고도 등산에서 산소통을 활용하는 것은 아직 갓 나온 수준에 머물러 있습니다. 공학자라면 이러한 시범 기술로부터 한층 더 나은 장비를 개발할 수 있습니다."
 douglas_mount_everest_physician_button: "고산병 연구"
 douglas_mount_everest_physician_button_desc: "고산병은 히말라야 산맥 등산에서 가장 위험한 부작용으로 여겨지고 있습니다. 경험 많은 의사라면 고산병을 심층 조사할 수 있습니다."
 douglas_mount_everest_ethnologist_button: "현지 셰르파"
 douglas_mount_everest_ethnologist_button_desc: "히말라야 봉우리로 향하는 가장 수월한 경로는 그 지형을 누구보다도 잘 파악하고 있는 현지인들의 지식을 활용하는 것입니다. 민족학자라면 숙련된 셰르파를 원정대의 동반자로 영입할 수 있습니다."
 douglas_mount_everest_geologist_button: "지질학 조사"
 douglas_mount_everest_geologist_button_desc: "지질학자는 산의 지형을 파악하고 더욱 오르기 수월한 경로를 제시할 뿐만 아니라, 더 좋은 등산법 자체도 제안할 수도 있습니다."
 douglas_mount_everest_risk_decrease_tt: "에베레스트산을 등반할 때 초반 위험도가 줄어듭니다."
 douglas.402.t: "기상 예보"
 douglas.402.d: "[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName] 원정대가 출발하기 전날, [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] 박사는 히말라야 산맥을 대상으로 한 광범위 기상 모델을 처음으로 제공하였다. "
 douglas.402.f: "수 개월 동안 물리학자는 말없이 연구에 임했다. 도표와 기압 측정 자료. 인도 지역의 풍속 기록. 그리고 이론까지... 철저할지 몰라도 멋들어지게, 아무렇게나가 아니라 계절마다 특정 경로를 따라 부는 중앙아시아의 강풍처럼.\n\n그리고 지금, [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] 박사는 분필 자국 묻은 소매와 갈라진 손끝과 함께 등산회 앞에 서서 종이를 가리켰다. 히말라야 능선을 따라 10일간의 대기 안정기를 예측하는, 일일히 손으로 그린 일련의 등압선이었다.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName](은)는 눈을 가늘게 뜨며 물었다. \"이거 확실합니까?\"\n\n물리학자는 안경을 고쳐 썼다.\n\n\"더할 나위 없이 확실하지요... 산에게 물었을 때처럼요.\""
 douglas.402.g: "이 기상 예보를 활용하여 등산 시기를 정하자."
 douglas.403.t: "죽음의 구역에 공기를"
 douglas.403.d: "[ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] 박사는 고고도 생존에 특화 설계된 새로운 산소공급기를 선보였다."
 douglas.403.f: "지금까지 8,000m 이상 고도에서 산소를 활용하는 것은 시험에 그쳐왔다... 걷기조차 버거운 사람들의 등에, 불편하고 쉭쉭거리는 짐을 들리는 일이었다.\n\n[ROOT.Var('tesla_engineer_var').GetCharacter.GetLastName] 씨는 그 상황에 변화를 일으켰다.\n\n신형 기기는 미세한 공기차로 조정된 압력조절기, 절연 튜브와 모듈형 하네스 체계를 갖추어 무게가 절반으로 줄고 유동안정성은 두배로 뛰었다. 이제는 산소 탱크를 옷 안에 착용하여 동결을 방지할 수 있게 되었다. 마스크는 다이버처럼 얼굴에 부착하게 되었다.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName](은)는 장갑 낀 손으로 장비를 들어올리며 끄덕였다. \"해발 8,000m 너머에서도 작동합니까?\"\n\n공학자는 미소지었다.\n\n\"그 어떤 장비가 작동하지 않는 곳에서도 작동하도록 설계되었습니다.\""
 douglas.403.g: "개량된 장비를 갖추자."
 douglas.404.t: "눈에 보이는 위험"
 douglas.404.d: "[ROOT.Var('panum_physician_var').GetCharacter.GetLastName] 박사는 등산 과정에서 고산병의 증상을 확인하고 예방하는 방법을 원정대에 전해 주었다."
 douglas.404.f: "동상은 눈에 보인다. 추락은 대비할 수 있다. 하지만 이 병은... 좀 이야기가 다르다.\n\n[ROOT.Var('panum_physician_var').GetCharacter.GetLastName](은)는 원정대 앞에 서서 고산병의 증세를 설명하기 시작했다. 두통과 가쁜 숨, 미묘한 현기증이 죽음의 경지로 끌고 간다는 것이었다.\n\n[ROOT.Var('panum_physician_var').GetCharacter.GetSheHe] 박사는 이렇게 말했다. \"그 시작은 술에 취한 기분이지만, 그 끝은 익사와도 같습니다.\"\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName](은)는 말없이 듣고만 있었다. 이 자리는 생존을 위한 처방이므로."
 douglas.404.g: "의사의 수칙을 정확히 따르자."
 douglas.405.t: "산을 잘 아는 사나이"
 douglas.405.d: "[ROOT.Var('roy_ethnologist_var').GetCharacter.GetLastName] 박사가 은밀한 협상력과 문화적 통찰력으로 베테랑 셰르파를 영입하는 데 성공하였다. 이 자는 에베레스트 산의 경사로에 관한 지식이 탁월하다고 한다."
 douglas.405.f: "그 셰르파는 지도를 가지고 다니지도 않았고, 영어도 그리 썩 잘하지 못했다. 그런데도 그가 가리키는 곳은 산이 응하였다.\n\n이 자를 찾은 사람은 [ROOT.Var('roy_ethnologist_var').GetCharacter.GetLastName]였다. 명단에서가 아니라 두 계곡 떨어진 한적한 마을에서 말이다.\n\n\"이 자는 우리 누구보다 높은 곳에 올라갔고, 무사히 돌아온 것도 한번은 더 되오.\"\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName](이)가 손을 내밀었다. 셰르파는 말없이 그의 손을 잡았다. 아무런 의식도, 아무런 의심도 없었다.\n\n\"그쪽은 정상을 탐구하였을지 모르겠지요.\" [ROOT.Var('roy_ethnologist_var').GetCharacter.GetLastName] 박사가 중얼거렸다. \"허나 이 자는 정상의 그림자와 말을 건답니다.\""
 douglas.405.g: "그 베테랑 셰르파를 선두로 고용합시다."
 douglas.406.t: "산의 뿌리"
 douglas.406.d: "[ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] 박사가 지형을 측량하고 옛 지층을 통과하는 안전한 등산로를 찾아냈다."
 douglas.406.f: "[ROOT.Var('agassiz_geologist_var').GetCharacter.GetSheHe|U]는 돌에 새겨진 검은 줄무늬를 손가락을 훑으며 천천히 고개를 끄덕였다. 편암 다음에는 편마암, 그리고 갈라진 석회암 덩이. 단층선은 흉터와도 같았다. 압력으로 형성된 주름은 굳은 파도와도 같았다.\n\n\"산은 가만 있는 게 아니야.\" 지질학자가 말했다. \"그 속도가 느릴 뿐이오.\"\n\n몇 시간 동안 [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] 박사는 등반대보다 앞서 걸어가며 손에 망치를 쥐어 돌을 두드리고, 그 소리를 듣고, 무엇인지를 읽어냈다. 지질학자는 위험천만한 빙폭포를 피할 수 있는 능선을 표시하였다. 바람에 노출된 너덜지대를 대각선으로 가로질러 등반에 이틀간의 시간을 절약해 주었다.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName](은)는 말없이 지켜보았다.\n\n\"어떤 부분이 버틸지 가늠이 되십니까?\"\n\n[ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] 박사는 어깨를 으쓱했다.\n\n\"아니오\"라는 대답이 돌아왔다. \"허나 지난 천만 년 동안 변함없이 유지되어 왔단 것은 말씀드릴 수 있소.\"\n\n때론 그것만으로도 충분하다."
 douglas.406.g: "지질학자의 자문을 따르자."
 douglas.121.t: "고국에서 단련된 용기"
 douglas.121.d: "[ROOT.GetCountry.GetAdjective] 산맥에서 수년간 훈련을 통해 한때 주저하던 마음 한 켠에 평온함이 자리잡았다. [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName](은)는 더욱 안정된 손놀림과 용감한 정신력으로 돌아왔다."
 douglas.121.f: "\"예전엔 두려움이란 게 극복해야 하는 줄로만 알았지요.\" [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetSheHe]가 말했다. \"헌데 사실은 내 스스로가 잠식되지 않는 선에서 안고 가야 하는 것이더군요.\"\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName](은)는 몇 개월 동안 조국의 산등성이와 설산을 오르내렸다. 홀로 말없이, 같은 길을 다시 걷기도 하면서 이전에 미처 보지 못했던 것들을 발견하였다.\n\n봉우리는 더 위로 나아가지 않았으되 이 사람은 그러하였다. 낙석과 추위, 눈보라는 익숙한 적이 되었다. 그리고 그 어떤 등반도 지면을 장식할 순 없었으나 그 하나하나가 마음 속에 남기는 것이 있었으니, 명성이 아닌 용기였다."
 douglas.121.g: "세상의 높은 곳이여, 나에게 오라."
 douglas.122.t: "결코 헛되지 않는 발걸음"
 douglas.122.d: "모두가 되돌아 설 때에도 [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName](은)는 묵묵히 나아갔다. 좌절조차도 원동력이 되고, 모든 길은 교훈이 되었다."
 douglas.122.f: "정상은 절대 목적이 아니었다. 최소한 전부는 아니었다.\n\n어떤 산길에서는 마지막 구간에 다다르기도 전에 폭풍이 몰아쳤고, 또 어떤 산길에서는 하룻밤 사이에 눈사태가 등반로를 휩쓸어 버렸다. 때로는 식량이 떨어지고, 안내인들이 등반을 포기하기도 했다. 그러나 [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetSheHe]는 남았다. 돌아와서 적응한 것이다.\n\n산은 고집에 굴하지 않는다. 허나 끈기는 인정한다.\n\n수개월 동안 [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName](은)는 익숙한 봉우리들을 낯선 방식으로 오르며 새로운 등반 실력을 탐구하고, 도구를 시험하고, 숨은 단을 찾아냈다. 남들이 무의미한 반복이라 여겼던 그 과정은 영광보다 값진, 인내의 토대가 되었다."
 douglas.122.g: "두 번 걸은 길은 결코 같지 않다."
 douglas.123.t: "알려진 지도 너머"
 douglas.123.d: "[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName](은)는 호기심에 이끌려 남들이 믿어 의심치 않던 등산로 너머로 향했다. 그 미지의 영역에서 목적지를 찾고, 등산로를 알아냈다."
 douglas.123.f: "옛 지도는 땅의 경계 뿐만 아니라 지식의 경계도 보여준다. 등반가라면 모름지기 그 경계 안에 머물기 마련이다. [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName]에게는 그렇지 않다.\n\n남들이 정해진 길을 따라가는 동안 [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetSheHe]는 그 너머를 헤메었다. 누구도 지도에 표시하지 않은 무너진 산등성이, 이름 모를 계곡, 관광객이나 명예욕에 눈먼 자들이 발 들일 틈도 없는, 마을에서 굉장히 멀리 떨어진 절벽들.\n\n그런 여정에서 잊혀진 빙하 인근에서 야영하며 옛 지각 변동의 흔적을 보여주는 암석층을 기록하고, 지역민들 사이에서 이야기만 돌고 감히 들어갈 엄두도 못 냈던 협곡을 지도에 표시하였다. 그것은 최초의 등정은 아니었을지 모르나, 최초의 깨달음이었다."
 douglas.123.g: "누구도 예상치 못한 것을 발견하는 것만큼 즐거운 것도 없다."
 douglas.124.t: "철과 돌"
 douglas.124.d: "[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName](이)가 [SCOPE.sCharacter('douglas_general_scope').GetLastName] 장군을 만났을 때 경험이 본능과 충돌하며 두 사람 모두 다른 사람으로 거듭나게 되었다."
 douglas.124.f: "[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetSheHe|U]는 포격 속에서도 고함 지르는 데 익숙한 사람처럼 자세를 취했고 제복에는 여전히 알프스의 눈가루가 묻어 있었다. [SCOPE.sCharacter('mountain_general').GetFullName] 장군은 고산지대에서 싸우고, 추위와 적막 속에서 장병들을 이끌며, 산을 장벽이 아닌 전장으로 이해하였다.\n\n[ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName](은)는 장군에게서 배워가는 점이 있었다. 그리고 며칠 만에 두 사람의 교류는 장군으로서도 얻어가는 상황이 되었다.\n\n\"우린 작전을 계획하는데, 당신은 생존을 계획하는구려.\" 피톤과 지형도를 살피는 모습을 본 장군이 중얼거렸다.\n\n\"장군께선 군대를 이끌지만, 저는 홀로 갑니다. 허나 산이란 것은 우리 둘을 동등하게 심판하지요\", 하고 답했다."
 douglas.124.g: "산은 모든 것을 다른 말로 가르친다."
 douglas_mount_everest_highest_mountain_flag: "에베레스트산 (히말라야)"
 douglas_kangchenjunga_highest_mountain_flag: "칸첸중가산 (히말라야)"
 douglas_dhalaugiri_highest_mountain_flag: "달라우기리산 (히말라야)"
 douglas_chimborazo_highest_mountain_flag: "침보라소산 (에콰도르)"
 douglas.217.t: "눈밭 위의 발자국"
 douglas.217.d: "\"그것은 사람의 것이라기엔 너무 컸고, 눈표범이라기엔 너무 깊게 찍혀 있었습니다.\" [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetLastName](은)는 〈페니 일러스트레이티드 페이퍼〉지의 특파원에게 이렇게 설명하였다. 이 기사는 런던에서 캘커타에 이르기까지 찻집과 술집을 거쳐 빠르게 퍼져나가며 코웃음과 경외감을 동시에 불러일으켰다. 크기는 곰만 하고 눈송이처럼 조용히 움직이는 생명체가 카브루산과 카멧산, 에베레스트산의 얼음 덮인 산비탈을 배회한다는 소문이 돌게 된 것이다. 셰르파 안내인들조차 그것을 '메토-캉미'라 부르며 의심을 품지 못했다. "
 douglas.217.f: "\"저는 이 산에서 많은 것을 보았습니다. 얼음폭포, 갑작스런 폭풍, 손가락을 잃고 하느님을 찾던 대원들. 하지만 여왕 폐하의 발치에 맹세컨대, 우리 모덕불 너머로 무언가가 걸어가는 것을 보았습니다. 그리고 그건 우릴 지켜보고 있었지요.\"\n\n[TimeKeeper.GetCurrentDate.Format('y')]년 [ROOT.Var('douglas_mountaineer_var').GetCharacter.GetFullName]의 편지에서"
 douglas.217.g: "사람들이 좋아하는 이야기란 바로 이런 것."
 douglas.217.h: "이런 기사가 돌아봤자 우리 산악인의 명예를 훼손할 뿐이오!"
