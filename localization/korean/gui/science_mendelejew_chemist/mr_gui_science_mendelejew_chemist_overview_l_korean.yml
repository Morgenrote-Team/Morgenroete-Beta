l_korean:
 MR_AUTOMATE_CHEMIST_TT: "#T [concept_mendelejew_chemist] 자동화#!\n자동화를 설정하면 더 이상 화학자에게 업무를 지시할 필요가 없습니다.\n그들은 알아서 작업하고 그때마다 알맞은 업무를 수행할 것입니다. 다만 일부 이벤트는 여전히 수신하게 됩니다."
 mr_chemistry_automation_gui_tt: "[concept_mendelejew_chemist]의 업무 자동화를 시작합니다."
 mr_stop_chemistry_automation_gui_tt: "[concept_mendelejew_chemist]의 업무 자동화를 중지합니다. "
 MR_STOP_AUTOMATE_CHEMIST_TT: "#T [concept_mendelejew_chemist]의 자동화 중지#!\n화학자는 더 이상 알아서 활동하지 않게 됩니다."
 MR_CHEMIST_RANKING_BUTTON: "화학자"
 MR_RANKING_BY_CHEMIST: "전 세계 [Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists|q$')]의 순위를 표시합니다."
 CHEMIST_CHEMIST_RANKING_HEADER: "[concept_academics_experience] 순 전세계 [Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists|q$')] 순위"
 MR_CHEMIST_DDT_BUTTON: "DDT"
 MR_CHEMIST_DDT_BUTTON_TT: "#T DDT#!\n지금까지 살충제는 납이나 비소가 첨가되어 독성이 매우 강한 것으로 알려져 왔으며 이 때문에 인체의 건강에도 해로웠습니다. 그러나 합성 방제제가 개발된다면 농업에 혁명을 일으킬 수 있을 것입니다. 우리 [concept_mendelejew_chemist]에게 합성 방제제의 개발을 문의해 봅시다.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_CHEMIST_HAS_IMPROVED_FERTILIZER_TRIGGER_TT: "#default_text [Concept('concept_modifier','$concept_modifiers|q$')] 세가지가 모두 적용된 1단계 이상의 [GetBuildingType('building_chemical_plant').GetName]이 최소 하나 이상#!"