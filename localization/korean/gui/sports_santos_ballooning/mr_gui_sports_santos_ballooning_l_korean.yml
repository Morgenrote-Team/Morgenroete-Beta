 MR_BALLOONIST_BALLOON_RIDE_BUTTON_TT: "#T 열기구 유람#!\n일반인의 유람을 위한 열기구 비행은 [concept_santos_balloonist]에게 있어 가장 안전하면서도 조금은 지루할 수 있는 기본 활동에 해당됩니다. 열기구 명소를 두어 특정 건물을 강화하고 열기구 관련 기술에 약간의 가속이 붙게 됩니다.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_BALLOON_ADVENTURE_BUTTON: "열기구 탐험"
 MR_BALLOONIST_BALLOON_ADVENTURE_BUTTON_TT: "#T 열기구 탐험#!\n[concept_santos_balloonist]는 우리 국경 너머로 탐험을 떠날 수 있습니다. 몇 개월에 걸쳐 여러 나라를 비행하며 기념품도 조금 챙겨올 수 있습니다. 여행 중에 목숨을 잃을 가능성이 조금은 존재합니다.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_BALLOON_RECORD_BUTTON: "열기구 기록"
 MR_BALLOONIST_BALLOON_RECORD_BUTTON_TT: "#T 열기구 기록#!\n[concept_santos_balloonist]는 본인에게 주어진 자원을 활용하여 비행 고도, 비행 거리, 비행 시간 기록을 세우고 세계 기록도 경신할 기회에 도전합니다. 기록 갱신 시도에 나섰다가 목숨을 잃을 가능성이 대체로 존재합니다.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_BALLOON_CROSSING_BUTTON: "열기구 횡단"
 MR_BALLOONIST_BALLOON_CROSSING_BUTTON_TT: "#T 열기구 횡단#!\n[concept_santos_balloonist]는 위험한 지형이 도사리는 해협과 산맥을 넘어 비행할 기회에 도전합니다. 횡단 비행은 여느 모험가라면 궁극적으로 도전해볼 역경으로 꼽힙니다. 횡단 비행에 나섰다가 목숨을 잃을 가능성이 적잖게 존재합니다.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_FIRE_BALLOONIST_TRIGGER_TT: "#default_text [GetPlayer.GetName]에 #V $santos_balloon_contract_modifier$#! [concept_modifier]가 #R 없음#!"
 SANTOS_CROSSING_ITEM_TOOLTIP: "[Scope.Var('tooltip').GetFlagName]"
 SANTOS_CROSSING_ACHIEVED_MARK: "@green_checkmark!"
 SANTOS_CROSSING_CHANNEL_TT: "영국해협은 약 35~50km 규모의 전형적인 단거리 해상 횡단 코스입니다. 대표적인 위험 요소는 예측 불가능한 연안 바람과 갑작스러운 표류에 대서양으로 밀려나는 것이지만, 블랜처드와 그린의 비행 이래 기록 개척자들의 시험장으로 꾸준히 자리매김해왔습니다."
 SANTOS_CROSSING_ALPS_TT: "알프스 산맥 횡단길은 극한의 고고도 난관 지대로서, 필요 운항 고도는 5,500~6,000m로 저산소증이라는 심각한 위험 요인을 수반하고 있으며, 비행 거리는 400~600km에 달합니다. 이와 더불어 산악 지대의 강풍과 하강 기류는 열기구가 가파른 암벽에 부딪히게 만들 수 있습니다. 1849년 프랑시스크 아르방이 처음으로 극복한 역경의 장이기도 합니다."
 SANTOS_CROSSING_SKAGERRAK_TT: "덴마크와 스칸디나비아 반도 사이의 해협으로 80~130km의 넓은 해역을 통과해야 하므로 순항 고도 2,000m에 항속 거리 400km가 요구됩니다. 이곳에서 열기구 조종사들은 북해의 급격히 발달하는 강풍, 혹독한 추위, 험준한 해안선과 분투해야 하며, 기밀성이 뛰어난 기체와 풍향에 따른 정확한 항법이 필수적입니다."
 SANTOS_CROSSING_MEDITERRANEAN_TT: "코르시카와 시칠리아처럼 산악 지형의 섬들이 흩어져 있는 광활한 해역으로, 섬 봉우리를 넘기 위해 순항 고도 4,000m에 항속 거리 700km가 요구됩니다. 열대 기후의 강렬한 태양 복사열로 기체가 크게 팽창하고, 수면 위에서는 속도 조절용 트레일 로프를 사용할 수 없기 때문에 밸러스트(무게추)를 세심하게 관리하는 것이 필수적입니다."
 SANTOS_CROSSING_RIO_TT: "아르헨티나와 우루과이 사이에 펼쳐진 광활한 하구 지대로서 그 규모는 최대 220km에 달하며, 순항 고도 2,000m에 항속 거리 300km가 요구됩니다. 대표적인 위험 요소는 현지인들이 '팜페로스'라 부르는 갑작스런 돌풍과 해수면 위의 심한 열난류가 꼽힙니다."
 SANTOS_CROSSING_PYRENEES_TT: "프랑스와 스페인을 가로막는 산의 장벽인 피레네 산맥은 순항 고도 5,000m에 항속 거리 500km를 요구합니다. 해발 3,000m가 넘는 봉우리 뒤편에서는 강한 하강 기류가 발생하기 때문에 죽음에 이를 수 있는 추락 사고를 막기 위해서는 안전 고도차에 상당한 여유를 두는 것이 필수적입니다."
 SANTOS_CROSSING_ANDES_TT: "열기구 비행에 있어 제일 가는 난관으로 꼽히는 안데스 산맥 횡단길은 8,000m에 달하는 엄청난 순항 고도와 800km의 항속 거리가 요구됩니다. 열기구 조종사들은 가압 장비가 없다면 목숨을 위협할 지 모를 산소 부족 현상과 더불어 혹독한 추위와 강풍에 맞서 싸워야 합니다."
 SANTOS_CROSSING_KOREA_TT: "한반도와 일본 열도를 잇는 해협으로, 180~200km 거리의 해역이 펼쳐지며 순항 고도 2,500m에 항속 거리 250km가 요구됩니다. 대마도를 비롯한 중간 섬이 방향 감각을 유지하는 데 도움을 주지만, 변화무쌍한 계절풍과 태평양 한가운데로 표류할 위험성이 대표적인 위험 요소로 여전히 도사리고 있습니다."
 SANTOS_CROSSING_BAB_TT: "홍해 남단의 좁은 해협으로 30~40km에 달하는 넓은 수역이 펼쳐져 있지만, 인접한 연안 산맥 지대를 피하려면 순항 고도 4,000m에 항속 거리 400km가 요구됩니다. 극심한 열대 기후로 열기구의 가스를 상당히 불안정하게 만들며, 여기에 사막 특유의 강력한 상승 기류와 예측 불가능한 하강풍이 더해집니다."
 SANTOS_KOREA_CROSSING_TT: "#default_text #V 대한해협#!은 난이도 #G 하급 코스#!로 여겨집니다.\n\n$santos_balloon_crossing_korea_possible_trigger_tt$#!"
 SANTOS_BAB_CROSSING_TT: "#default_text #V 바브 알만다브#!는 난이도 #R 상급 코스#!로 여겨집니다.\n\n$santos_balloon_crossing_bab_possible_trigger_tt$#!"
