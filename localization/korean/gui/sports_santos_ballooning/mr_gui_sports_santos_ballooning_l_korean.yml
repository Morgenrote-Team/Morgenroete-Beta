 MR_BALLOON_ALTITUDE_RECORD: "#V 최근 기록#! [Scope.Var('santos_balloon_altitude_record_personal_var').GetValue|0]m"
 MR_BALLOON_DISTANCE_RECORD: "#V 최근 기록#! [Scope.Var('santos_balloon_distance_record_personal_var').GetValue|0]km"
 MR_BALLOON_TIME_RECORD: "#V 최근 기록#! [Scope.Var('santos_balloon_time_record_personal_var').GetValue|0]시간"
 MR_COAL_GAS_BAR: "석탄 가스"
 MR_COAL_GAS_BAR_TT: "이 열기구는 #V 석탄 가스#!를 사용합니다."
 MR_HYDROGEN_BAR: "수소"
 MR_HYDROGEN_BAR_TT: "이 열기구는 #V 수소#!를 사용합니다."
 MR_BALLOONIST_CHANGE_TYPE_BUTTON: "유형 변경"
 MR_BALLOONIST_CHANGE_TYPE_BUTTON_TT: "특화 열기구는 고도, 거리, 체공 시간 중 한가지 기록에 대한 성능을 가산을 적용받지만, 나머지 두 기록의 성능은 감산을 적용받습니다. 범용 열기구는 가산도 감산도 적용받지 않습니다."
 MR_HEADER_MODIFICATIONS: "개조"
 MR_BALLOONIST_MODIFICATION_POSSIBLE_TRIGGER_TT: "#default_text [GetPlayer.GetName]에서 열기구를 재설계하고 있지 않음#!"
 MR_BALLOONIST_HYDROGEN_FACTORY_TRIGGER_TT: "#default_text [GetPlayer.GetName]에서 $pm_brine_electrolysis$ [concept_production_method]을 채택한 [GetBuildingType('building_explosives_factory').GetName]을 최소 하나 이상 보유함#!"
 MR_BALLOONIST_COAL_GAS_BUTTON: "석탄 가스 사용"
 MR_BALLOONIST_COAL_GAS_BUTTON_TT: "#T 석탄 가스 사용#!\n석탄 가스는 열기구에 사용되는 풍부한 가스로, 초창기 열기구 비행에서는 거리와 속도 기록을 세우기에 충분했지만, 고고도 상승에는 제법 한계가 따랐습니다.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_HYDROGEN_BUTTON: "수소 사용"
 MR_BALLOONIST_HYDROGEN_BUTTON_TT: "#T 수소 사용#!\n수소는 열기구 비행 초창기부터 사용되어 놀라운 고도 기록을 세우는 데 한몫했습니다. 달리 말해서 수소는 '고도 기록용 가스'의 대명사라고 볼 수 있습니다. 허나 수소 생산은 단가가 비싸고 많은 노동력을 필요로 합니다.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 santos_set_balloon_type_altitude_effect_tt: "열기구 유형을 #V 고도 특화 열기구#!로 변경합니다. 열기구 개조에는 #YELLOW 6개월#!의 시간이 소요됩니다."
 santos_set_balloon_type_distance_effect_tt: "열기구 유형을 #V 거리 특화 열기구#!로 변경합니다. 열기구 개조에는 #YELLOW 6개월#!의 시간이 소요됩니다."
 santos_set_balloon_type_time_effect_tt: "열기구 유형을 #V 시간 특화 열기구#!로 변경합니다. 열기구 개조에는 #YELLOW 6개월#!의 시간이 소요됩니다."
 santos_set_balloon_type_allround_effect_tt: "열기구 유형을 #V 범용 열기구#!로 변경합니다. 열기구 개조에는 #YELLOW 6개월#!의 시간이 소요됩니다."
 santos_set_balloon_fuel_coal_gas_effect_tt: "열기구 연료를 #V 석탄 가스#!로 변경합니다. 열기구 개조에는 #YELLOW 6개월#!의 시간이 소요됩니다."
 santos_set_balloon_fuel_hydrogen_effect_tt: "열기구 연료를 #V 수소#!로 변경합니다. 열기구 개조에는 #YELLOW 6개월#!의 시간이 소요됩니다."
 santos_altitude_bonus_overview_tt: "#header 대략적인 고도 기록 보너스#!\n#O 고도 기록#!에 영향을 끼치는 요소는 다음과 같습니다 (모든 수치는 추정값에 해당됨).\n[GetPlayer.GetCustom('santos_altitude_bonus_montgolfier_balloon_tt_type')][GetPlayer.GetCustom('santos_altitude_bonus_meteorology_tt_type')][GetPlayer.GetCustom('santos_altitude_bonus_reconnaissance_balloon_tt_type')][GetPlayer.GetCustom('santos_altitude_bonus_early_aviation_tt_type')][GetPlayer.GetCustom('santos_altitude_bonus_zeppelins_tt_type')]\n[GetPlayer.GetCustom('santos_altitude_bonus_rip_panel_tt_type')][GetPlayer.GetCustom('santos_altitude_bonus_fine_sand_tt_type')][GetPlayer.GetCustom('santos_altitude_bonus_oxygen_cylinders_tt_type')]\n[GetPlayer.GetCustom('santos_altitude_bonus_fuel_coal_gas_tt_type')][GetPlayer.GetCustom('santos_altitude_bonus_fuel_hydrogen_tt_type')]\n[GetPlayer.GetCustom('santos_altitude_bonus_meteorologist_tt_type')]\n[GetPlayer.GetCustom('santos_altitude_bonus_balloon_type_tt_type')][GetPlayer.GetCustom('santos_altitude_bonus_innovative_trait_tt_type')][GetPlayer.GetCustom('santos_generic_bonus_experienced_trait_tt_type')][GetPlayer.GetCustom('santos_generic_bonus_famous_trait_tt_type')][GetPlayer.GetCustom('santos_generic_bonus_brave_trait_tt_type')][GetPlayer.GetCustom('santos_generic_bonus_negative_trait_tt_type')]"
