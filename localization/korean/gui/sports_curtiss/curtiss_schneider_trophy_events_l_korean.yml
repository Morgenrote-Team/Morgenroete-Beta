l_korean:
 curtiss_schneider_trophy_event_mechanical_problems_icon_flag: "@curtiss_event_log_negative_mechanical_problems_icon!"
 curtiss_schneider_trophy_event_mechanical_problems_title_flag: "기계적 결함"
 curtiss_schneider_trophy_event_mechanical_problems_flag: "#t $curtiss_schneider_trophy_event_mechanical_problems_title_flag$#!\n$curtiss.121.d$"
 curtiss_schneider_trophy_event_crash_icon_flag: "@curtiss_event_log_negative_crash_icon!"
 curtiss_schneider_trophy_event_crash_title_flag: "항공기 추락 사고"
 curtiss_schneider_trophy_event_crash_flag: "#t $curtiss_schneider_trophy_event_crash_title_flag$#!\n우리 비행사가 기동 과정에서 너무나 자신한 나머지 수면에 추락하고 말았다!"
 curtiss_schneider_trophy_event_buoy_icon_flag: "@curtiss_event_log_negative_buoy_icon!"
 curtiss_schneider_trophy_event_buoy_title_flag: "못 보고 넘어간 부표"
 curtiss_schneider_trophy_event_buoy_flag: "#t $curtiss_schneider_trophy_event_buoy_title_flag$#!\n슈나이더 트로피 경주에 출전한 우리 팀이 좋은 기록을 냈으나, 심판 중 한 명이 부표를 그냥 지나친 점을 잡아내어 감점 위기에 처했다."
 curtiss_schneider_trophy_event_maximum_speed_icon_flag: "@curtiss_event_log_positive_speed_icon!"
 curtiss_schneider_trophy_event_maximum_speed_title_flag: "최고 속력"
 curtiss_schneider_trophy_event_maximum_speed_flag: "#t $curtiss_schneider_trophy_event_maximum_speed_title_flag$#!\n비행사들은 비행 경로를 따라 있는 힘껏 비행기의 속력을 높여 보였다."
 curtiss_schneider_trophy_event_slalom_icon_flag: "@curtiss_event_log_positive_slalom_icon!"
 curtiss_schneider_trophy_event_slalom_title_flag: "슬라럼 기동"
 curtiss_schneider_trophy_event_slalom_flag: "#t $curtiss_schneider_trophy_event_slalom_title_flag$#!\n슈나이더 트로피는 속도 경쟁으로 유명하지만 고속 주행 시 놓칠 수 있는 서너 개의 마크를 두고 있기에, 이를 어길 경우 실격 처리가 가능하다."
 curtiss_schneider_trophy_event_fog_neutral_icon_flag: "@curtiss_event_log_fog_neutral_icon!"
 curtiss_schneider_trophy_event_fog_positive_icon_flag: "@curtiss_event_log_fog_positive_icon!"
 curtiss_schneider_trophy_event_fog_title_flag: "안개"
 curtiss_schneider_trophy_event_fog_neutral_flag: "#t $curtiss_schneider_trophy_event_fog_title_flag$#!\nFog was more often a problem on the waterways. Even experienced pilots could fail at this sudden challenge. This time the pilot barely made it through."
 curtiss_schneider_trophy_event_fog_positive_flag: "#t $curtiss_schneider_trophy_event_fog_title_flag$#!\n안개는 물 위에서 더 문제되는 경우가 많다. 숙련된 비행사라 할지라도 갑작스러운 난관에 좌절을 경험할 수 있다. 올해 경기에서는 별달리 문제가 되지 않았다."
 curtiss_schneider_trophy_event_superior_flight_performance_icon_flag: "@curtiss_event_log_superior_flight_performance_positive_icon!"
 curtiss_schneider_trophy_event_superior_flight_performance_title_flag: "탁월한 비행 실력"
 curtiss_schneider_trophy_event_superior_flight_performance_flag: "#t $curtiss_schneider_trophy_event_superior_flight_performance_title_flag$#!\n비행사의 뛰어난 기량 덕에 슈나이더 컵 우승이 유력해졌다!"
 curtiss_schneider_trophy_event_duel_positive_icon_flag: "@curtiss_event_log_duel_positive_icon!"
 curtiss_schneider_trophy_event_duel_title_positive_flag: "공중전 승리"
 curtiss_schneider_trophy_event_duel_positive_flag: "#t $curtiss_schneider_trophy_event_duel_title_positive_flag$#!\n최단 시간 기록을 향한 경쟁에서 두 선수가 아슬아슬하게 따라붙었다. 정확한 기동을 펼쳐 승산을 높이고 경쟁 상대를 누를 수 있게 되었다."
 curtiss_schneider_trophy_event_duel_negative_icon_flag: "@curtiss_event_log_duel_negative_icon!"
 curtiss_schneider_trophy_event_duel_title_negative_flag: "공중전 패배"
 curtiss_schneider_trophy_event_duel_negative_flag: "#t $curtiss_schneider_trophy_event_duel_title_negative_flag$#!\nIn the race for the fastest lap, two pilots came dangerously close. With a targeted maneuver the pilot tried to improve the chances of victory but failed miserably."
 curtiss_schneider_trophy_event_rivalry_icon_positive_flag: "@curtiss_event_log_rivalry_positive_icon!"
 curtiss_schneider_trophy_event_rivalry_title_positive_flag: "경쟁 선수를 이김"
 curtiss_schneider_trophy_event_rivalry_positive_flag: "#t $curtiss_schneider_trophy_event_rivalry_title_positive_flag$#!\n슈나이더 컵의 에이스 비행사가 경쟁 비행사와의 오랜 앙금을 풀기 위해 대담한 작전을 펼쳤다. 이것으로 그동안의 숙적을 경기에서 탈락시켰다!"
 curtiss_schneider_trophy_event_rivalry_icon_negative_flag: "@curtiss_event_log_rivalry_negative_icon!"
 curtiss_schneider_trophy_event_rivalry_title_negative_flag: "경쟁 선수에 패배함"
 curtiss_schneider_trophy_event_rivalry_negative_flag: "#t $curtiss_schneider_trophy_event_rivalry_title_negative_flag$#!\n슈나이더 컵의 에이스 비행사가 경쟁 비행사와의 오랜 앙금을 풀기 위해 대담한 작전을 펼쳤다. 그것은 다름아닌 숙적을 경기에서 탈락시키려는 것이었다! 하지만 이번 시도는 성공하지 못했다."
 curtiss_schneider_trophy_event_rivalry_fly_ahead_icon_flag: "@curtiss_event_log_fly_ahead_positive_icon!"
 curtiss_schneider_trophy_event_rivalry_fly_ahead_title_flag: "경쟁 선수에 앞서 날아감"
 curtiss_schneider_trophy_event_rivalry_fly_ahead_flag: "#t $curtiss_schneider_trophy_event_rivalry_fly_ahead_title_flag$#!\n슈나이더 컵의 에이스 비행사가 경쟁 비행사와의 오랜 앙금을 풀기 위해 대담한 작전을 펼쳤다. 그러나 그는 상대를 무시하고 앞서 날아갈 뿐이었다."
 curtiss_schneider_trophy_event_rivalry_title_positive_opponent_flag: "경쟁 선수가 패배함"
 curtiss_schneider_trophy_event_rivalry_positive_opponent_flag: "#t $curtiss_schneider_trophy_event_rivalry_title_positive_opponent_flag$#!\n다른 비행사가 이 비행사와 승부를 가리려 하였으나 패배하고 말았다."
 curtiss_schneider_trophy_event_favorable_conditions_icon_flag: "@curtiss_event_log_favorable_conditions_positive_icon!"
 curtiss_schneider_trophy_event_favorable_conditions_title_flag: "양호한 날씨"
 curtiss_schneider_trophy_event_favorable_conditions_flag: "#t $curtiss_schneider_trophy_event_favorable_conditions_title_flag$#!\n기상 여건이 양호한 덕에 우리 팀의 우승 확률도 높아졌다."
 curtiss_schneider_trophy_event_team_member_ill_icon_flag: "@curtiss_event_log_team_member_ill_negative_icon!"
 curtiss_schneider_trophy_event_team_member_ill_title_flag: "제3의 팀원"
 curtiss_schneider_trophy_event_team_member_ill_flag: "#t $curtiss_schneider_trophy_event_team_member_ill_title_flag$#!\n슈나이더 트로피 대표팀에 참가하는 비행사 한 명이 경기 바로 직전에 병에 걸리고 말았다."
 curtiss_schneider_trophy_event_strange_engine_failure_icon_flag: "@curtiss_event_log_strange_engine_failure_negative_icon!"
 curtiss_schneider_trophy_event_strange_engine_failure_title_flag: "수상한 엔진 고장"
 curtiss_schneider_trophy_event_strange_engine_failure_flag: "#t $curtiss_schneider_trophy_event_strange_engine_failure_title_flag$#!\n영문 모를 엔진 고장으로 우리 기술진들이 절망에 빠졌다."
 curtiss_schneider_trophy_event_sabotage_prevented_icon_flag: "@curtiss_event_log_sabotage_prevented_positive_icon!"
 curtiss_schneider_trophy_event_sabotage_prevented_title_flag: "방해 공작 차단!"
 curtiss_schneider_trophy_event_sabotage_prevented_flag: "#t $curtiss_schneider_trophy_event_sabotage_prevented_title_flag$#!\n다른 참가자의 방해 공작 시도가 마지막 순간에 가까쓰로 차단되었다."
 curtiss_schneider_trophy_event_sabotage_discovered_icon_flag: "@curtiss_event_log_sabotage_prevented_negative_icon!"
 curtiss_schneider_trophy_event_sabotage_discovered_title_flag: "방해 공작 발각!"
 curtiss_schneider_trophy_event_sabotage_discovered_flag: "#t $curtiss_schneider_trophy_event_sabotage_discovered_title_flag$#!\nThe sabotage attempt of this country was discovered causing them to be shunned by the other participants."