l_korean:
 MR_AUTOMATE_ENGINEER_TT: "#T [concept_tesla_engineer] 자동화#!\n자동화를 설정하면 더 이상 공학자에게 업무를 지시할 필요가 없습니다.\n그들은 알아서 작업하고 그때마다 알맞은 업무를 수행할 것입니다. 다만 일부 이벤트는 여전히 수신하게 됩니다.\n\n#n 자동화를 설정하면 공학자에게 직접 업무를 맡길 때마다 다소 비효율적일 수 있다는 점에 유의해 주세요.#!"
 mr_engineering_automation_gui_tt: "[concept_tesla_engineer]의 업무 자동화를 시작합니다."
 mr_stop_engineering_automation_gui_tt: "[concept_tesla_engineer]의 업무 자동화를 중지합니다."
 MR_STOP_AUTOMATE_ENGINEER_TT: "#T [concept_tesla_engineer]의 자동화 중지#!\n공학자는 더 이상 알아서 활동하지 않게 됩니다."
 MR_ENGINEER_RANKING_BUTTON: "공학자"
 MR_RANKING_BY_ENGINEER: "전 세계 [Concept('concept_tesla_engineer','$concept_tesla_engineers|q$')]의 순위를 표시합니다."
 ENGINEER_ENGINEER_RANKING_HEADER: "#V [concept_academics_experience] 순 전세계 [Concept('concept_tesla_engineer','$concept_tesla_engineers|q$')] 순위"
 tesla_experience_current_specialization_civil_loc: "[Character.MakeScope.GetVariable('tesla_civil_engineer_experience_var').GetValue|V0]"
 tesla_experience_current_specialization_mechanical_loc: "[Character.MakeScope.GetVariable('tesla_mechanical_engineer_experience_var').GetValue|V0]"
 tesla_experience_current_specialization_military_loc: "[Character.MakeScope.GetVariable('tesla_military_engineer_experience_var').GetValue|V0]"
 tesla_experience_current_specialization_electrical_loc: "[Character.MakeScope.GetVariable('tesla_electrical_engineer_experience_var').GetValue|V0]"
 tesla_experience_current_specialization_aeronautical_loc: "[Character.MakeScope.GetVariable('tesla_aeronautical_engineer_experience_var').GetValue|V0]"
 MR_ELECTRICAL_ENGINEER_SAW_MILLS_BUTTON: "제재소 현대화"
 MR_ELECTRICAL_ENGINEER_SAW_MILLS_BUTTON_TT: "#T 제재소 현대화#!\n[concept_tesla_engineer]가 [GetBuildingType('building_logging_camp').GetName] 현대화에 집중하도록 합니다. 이를 통해 시간이 흐르면서 $building_logging_camp$에 $tesla_saw_mills_1_modifier$의 변화 요인을 부여하게 됩니다\n\n이 사업으로 국가 재정에 #n 지출#!을 더하게 됩니다.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ELECTRICAL_ENGINEER_SAW_MILLS_TRIGGER_TT: "#default_text [GetPlayer.GetName]에서 아직 [concept_modifier]을 지니고 있지 않은 #O 전기식 제재소#! [concept_production_method]을 채택한 1단계 이상의 [GetBuildingType('building_logging_camp').GetName]를 하나 이상 보유함#!"
 MR_TESLA_BUILDING_CHOOSER_SAW_MILLS_MULTIPLE_HEADER: "제재소 현대화 사업"
 MR_ELECTRICAL_ENGINEER_POWER_GRID_BUTTON: "전력망 현대화"
 MR_ELECTRICAL_ENGINEER_POWER_GRID_BUTTON_TT: "#T 전력망 현대화#!\n[concept_tesla_engineer]가 [GetBuildingType('building_tesla_telegraph').GetName] 현대화에 집중하도록 합니다. 이를 통해 시간이 흐르면서 $building_tesla_telegraph$에 $tesla_power_grid_1_modifier$의 변화 요인을 부여하게 됩니다\n\n이 사업으로 국가 재정에 #n 지출#!을 더하게 됩니다.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ELECTRICAL_ENGINEER_POWER_GRID_TRIGGER_TT: "#default_text [GetPlayer.GetName]에서 아직 [concept_modifier]을 지니고 있지 않은 #O 전선#! [concept_production_method]을 채택한 1단계 이상의 [GetBuildingType('building_tesla_telegraph').GetName]를 하나 이상 보유함#!"
 MR_TESLA_BUILDING_CHOOSER_POWER_GRID_MULTIPLE_HEADER: "전력망 현대화 사업"