 MR_PHYSICIST_IMPROVE_MATHEMATICS_TRIGGER_TT: "#default_text 세가지 [Concept('concept_modifier','$concept_modifiers|q$')]을 전부 지니고 있지 않은 #O 수학-기술 특화#!로 설정된 1단계 이상의 [GetBuildingType('building_university').GetName]을 하나 이상 보유#!"
