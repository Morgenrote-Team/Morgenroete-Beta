 MR_ROCKET_EQUATION_ACTIVE_TT: "로켓 방정식이 연구됨"
 MR_ROCKET_EQUATION_INACTIVE_TT: "#T 로켓 방정식#!\n로켓 방정식은 현대 로켓 과학의 역사적 토대로 꼽히는 방정식입니다. 러시아의 로켓 기술 개척자 콘스탄틴 치올코프스키의 공헌을 기려 '치올코프스키 로켓 방정식'이라는 이름으로도 불립니다.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
