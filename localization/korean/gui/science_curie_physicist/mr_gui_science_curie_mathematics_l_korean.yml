 VISIT_ROCKETRY_BUTTON_TT: "#T 수학 공식#!\n이곳에서는 물리학계의 주요 로켓 연구와 중대한 업적 현황을 둘러볼 수 있습니다.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
