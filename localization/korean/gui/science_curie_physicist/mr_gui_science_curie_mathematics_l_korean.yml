 MATHEMATICAL_INNOVATION_VAR: "#tooltip:[GetRawTextTooltipTag('MATHEMATICAL_INNOVATION_VAR_TT')] @curie_mathematical_innovation!  [GetPlayer.MakeScope.GetVariable('curie_national_mathematical_innovation_var').GetValue|0+] / [GetGlobalVariable('curie_international_mathematical_innovation_global_var').GetValue|V0] #!"
