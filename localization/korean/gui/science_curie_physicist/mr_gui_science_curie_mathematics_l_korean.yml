 MR_PHYSICIST_FORMULA_PHYSICAL_DATA_TRIGGER_TT: "#default_text [GetPlayer.GetName]에서 보유한 @curie_physical_data! [concept_curie_physical_data]의 양이 #V [GetPlayer.MakeScope.ScriptValue('curie_formula_cost_value')]#! 이상#!"
