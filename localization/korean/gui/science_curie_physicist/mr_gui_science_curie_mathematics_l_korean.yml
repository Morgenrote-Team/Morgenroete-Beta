 MR_PHYSICIST_MAGNETIC_ATLAS_BUTTON: "Geomagnetic Atlas"
 MR_PHYSICIST_MAGNETIC_ATLAS_BUTTON_TT: "#T Create a Geomagnetic Atlas#!\nUsing our extensive geomagnetic data, a physicist could compile their own geomagnetic atlas. Such a work would significantly enhance our understanding of physics.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_MAGNETIC_OBSERVATORY_TRIGGER_TT: "#default_text [GetPlayer.GetName] has an [GetBuildingType('building_verrier_observatory').GetName] with the #V Geomagnetic Observatory#! [concept_production_method]."
