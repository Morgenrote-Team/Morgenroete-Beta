 MR_AUTOMATE_PHYSICIST_TT: "#T [concept_curie_physicist] 자동화#!\n자동화를 설정하면 더 이상 물리학자에게 업무를 지시할 필요가 없습니다.\n그들은 알아서 작업하고 그때마다 알맞은 업무를 수행할 것입니다. 다만 일부 이벤트는 여전히 수신하게 됩니다.\n\n#n 자동화를 설정하면 물리학자에게 직접 업무를 맡길 때마다 다소 비효율적일 수 있다는 점에 유의해 주세요.#!"
