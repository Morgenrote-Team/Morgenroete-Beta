 MR_PHYSICIST_MAGNETIC_ATLAS_BUTTON: "지자기 현황도"
 MR_PHYSICIST_MAGNETIC_ATLAS_BUTTON_TT: "#T 지자기 현황도 제작#!\n물리학자가 지금까지 모은 대량의 지자기 데이터를 활용하여 전 지구의 지자기 현황도를 제작할 수 있습니다. 이러한 현황도를 만들 수만 있다면 물리학에 대한 이해를 상당한 수준으로 끌어올릴 수 있을 것입니다.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
