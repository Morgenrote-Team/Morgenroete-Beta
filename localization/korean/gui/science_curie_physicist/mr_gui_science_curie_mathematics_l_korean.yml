 MR_PHYSICIST_MATHEMATICAL_INNOVATION_BUTTON: "수학 혁신"
 MR_PHYSICIST_MATHEMATICAL_INNOVATION_BUTTON_TT: "#T 수학 혁신#!\n본 과제는 [concept_curie_mathematical_physicist]가 다른 일을 맡고 있지 않을 때 진행할 수 있습니다.\n\n[concept_curie_physicist]가 주간 혁신 역량을 늘리고 시대에 앞선 기술 연구로 인한 불이익을 줄이는 데 힘씁니다.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_FORMULA_DISCOVERY_BUTTON: "공식 연구"
 MR_PHYSICIST_FORMULA_DISCOVERY_BUTTON_TT: "#T 공식 연구#!\n적절한 기술을 보유한 동시에 아직 밝혀지지 않은 공식이 있다면, 수학자로 하여금 새로운 공식을 연구하게 만들 수 있습니다. 새로운 공식이 발견될 때마다 조사해야 할 물리학 데이터의 양도 늘어납니다.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_IMPROVE_MATHEMATICS_BUTTON: "수학 증진"
 MR_PHYSICIST_IMPROVE_MATHEMATICS_BUTTON_TT: "#T 수학 증진#!\n수학자가 [GetBuildingType('building_university').GetName]을 방문하여 강연과 세미나를 통해 최신 학계 표준을 보급할 수 있습니다.\n\n이것으로 해당 건물에 적용되는 변화 요인은 다음과 같습니다.\n$curie_building_throughput_add_modifier_with_tooltip$\n$curie_building_production_mult_modifier_with_tooltip$\n$curie_building_goods_input_mult_modifier_with_tooltip$\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_EXPERIMENT_BUTTON: "물리학 실험"
 MR_PHYSICIST_EXPERIMENT_BUTTON_TT: "#T 물리학 실험#!\n물리학자는 실험을 수행할 수 있으며, 성공에 이를 시에는 그 자체로 역사적인 의의를 가질 수도 있습니다. 실험은 어느 분야의 물리학자든 수행이 가능합니다.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_EXPERIMENT_POSSIBLE_TRIGGER_TT: "#default_text [GetPlayer.GetName]에 #V $curie_physics_experiment_successful_modifier$#!이나 #V $curie_physics_experiment_failure_modifier$#! [concept_modifier]이 #R 없음#!"
 MR_PHYSICIST_METEOROLOGICAL_OBSERVATION_BUTTON: "기상 관측"
 MR_PHYSICIST_METEOROLOGICAL_OBSERVATION_BUTTON_TT: "#T 기상 관측#!\n본 과제는 [concept_curie_meteorological_physicist]가 다른 일을 맡고 있지 않을 때 진행할 수 있습니다.\n\n[concept_curie_physicist]가 연간 @curie_physical_data! [concept_curie_physical_data] 획득량을 늘리는 데 힘씁니다.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_WEATHER_STATION_EXPANSION_BUTTON: "기상 관측소 확대"
 MR_PHYSICIST_WEATHER_STATION_EXPANSION_BUTTON_TT: "#T 기상 관측소 확대#!\n천문대를 둔 동시에 적절한 기술을 보유하고 있다면, [concept_curie_meteorological_physicist]로 하여금 기상 관측소를 확충하여 전국의 기상 예보를 개선하고, 적시 경보를 통해 악천후 상황에 한층 더 대비할 수 있습니다.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 PHYSICIST_HAS_NO_WEATHER_STATION_PM_TT: "#default_text [GetPlayer.GetName]에 #V $pm_curtiss_no_weather_station$#! [concept_production_method]이 적용된 [GetBuildingType('building_verrier_observatory').GetName]가 있음"
 PHYSICIST_HAS_EARLY_WEATHER_STATION_PM_TT: "#default_text [GetPlayer.GetName]에 #V $pm_curtiss_early_weather_station$#! [concept_production_method]이 적용된 [GetBuildingType('building_verrier_observatory').GetName]가 있음"
 PHYSICIST_HAS_WEATHER_STATION_PM_TT: "#default_text [GetPlayer.GetName]에 #V $pm_curtiss_weather_station$#! [concept_production_method]이 적용된 [GetBuildingType('building_verrier_observatory').GetName]가 있음"
 MR_PHYSICIST_IMPROVE_METEOROLOGY_BUTTON: "기상 관측망"
 MR_PHYSICIST_IMPROVE_METEOROLOGY_BUTTON_TT: "#T 기상 관측망#!\n전신 기술의 도래와 함께 기상학도 엄청난 이점을 얻게 되었습니다. 전국 각지의 기상 측정 자료를 순식간에 전송하고 비교할 수 있게 되면서 날씨 예보와 경보를 때맞추어 내리게 된 것입니다. [concept_curie_meteorological_physicist]는 [GetBuildingType('building_tesla_telegraph').GetName]를 설치한 주에 기상 관측소를 세워 광범위한 지역에 걸친 기후 현상에 대처할 수 있습니다.\n\n해당 건물에 적용되는 변화 요인은 다음과 같습니다.\n$curie_building_throughput_add_modifier_with_tooltip$\n$curie_building_production_mult_modifier_with_tooltip$\n$curie_building_goods_input_mult_modifier_with_tooltip$\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_IMPROVE_METEOROLOGY_TRIGGER_TT: "#default_text 세가지 [Concept('concept_modifier','$concept_modifiers|q$')]을 전부 지니고 있지 않은 1단계 이상의 [GetBuildingType('building_tesla_telegraph').GetName]를 하나 이상 보유#!"
 MR_PHYSICIST_AGRICULTURAL_WEATHER_SERVICE_BUTTON: "농업 기상 예보"
 MR_PHYSICIST_AGRICULTURAL_WEATHER_SERVICE_BUTTON_TT: "#T 농업 기상 예보#!\n[concept_curie_meteorological_physicist]는 농업 분야를 위한 기상 예보에 집중하여, 농민들에게 기상 현상을 사전 경고해 주는 기상 예보를 3년 동안 운영할 수 있습니다. 기상학자의 경험치가 풍부할수록 더 나은 결과를 기대할 수 있습니다.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_ADVANCED_WEATHER_STATION_TRIGGER_TT: "#default_text [GetPlayer.GetName]에서 #V $pm_curtiss_weather_station$#!나 $pm_curtiss_modern_weather_station$ [concept_production_method]이 적용된 [GetBuildingType('building_verrier_observatory').GetName]가 있음"
 MR_PHYSICIST_50_OR_MORE_EXPERIENCE_TRIGGER_TT: "#default_text [concept_curie_meteorological_physicist]의 [concept_academics_experience]가 #V 50 이상#!#!"
 MR_PHYSICIST_MARINE_WEATHER_SERVICE_BUTTON: "해상 예보"
 MR_PHYSICIST_MARINE_WEATHER_SERVICE_BUTTON_TT: "#T 해상 예보#!\n[concept_curie_meteorological_physicist]는 해군을 위한 기상 예보에 집중하여, 해상의 위험 요인을 사전 경고해 줄 수 있습니다. 이 과제는 3년 동안 진행됩니다. 기상학자의 경험치가 풍부할수록 더 나은 결과를 기대할 수 있습니다.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_5_FLOTILLAS_TRIGGER_TT: "#default_text [GetPlayer.GetName]에서 보유한 #V 함선이 5척 이상#!#!"
 MR_PHYSICIST_FOUND_MAGNETIC_ASSOCIATION_BUTTON: "지자기 학회"
 MR_PHYSICIST_FOUND_MAGNETIC_ASSOCIATION_BUTTON_TT: "#T 지자기 학회 창설#!\n지자기장 연구를 전문으로 하는 국제 지자기 학회는 창립국에 물리적 측정 자료를 수집하는 측면에서 여러 이점을 가져다주며, 소소한 기술 보너스도 함께 부여합니다. 또 본 학회를 통해 생산 방식 가운데 '지자기 관측소'를 해금할 수 있습니다.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_MAGNETIC_RESEARCH_STATION_BUTTON: "지자기 관측소"
 MR_PHYSICIST_MAGNETIC_RESEARCH_STATION_BUTTON_TT: "#T 지자기 관측소 건설#!\n우리나라의 천문대를 증축하여 지자기 관측소를 두면 지자기장 분야를 더욱 상세히 연구할 수 있습니다. 이를 위해서는 지자기 학회에 가임해야 합니다.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_NO_MAGNETIC_OBSERVATORY_TRIGGER_TT: "#default_text [GetPlayer.GetName]에 #V 지자기 관측소 없음#! [concept_production_method]을 지닌 [GetBuildingType('building_verrier_observatory').GetName]가 있음"
 MAGNETIC_ASSOCIATION_TRIGGER_TT: "#default_text 지자기 학회가 창설되어 있음#!"
