l_korean:
 MR_PHYSICIST_ACHIEVEMENTS_TT: "[AddLocalizationIf( Scope.IsSet , 'curie_physicist_achievements_loc')][AddLocalizationIf( Not(Scope.IsSet) , 'curie_physicist_achievements_no_physicist_loc')]"
 curie_physicist_achievements_loc: "$curie_physicist_achievements_intro_loc$[AddLocalizationIf( Scope.Var('curie_physicist_achievement_historical_physics_experiment_var').IsSet , Scope.Var('curie_physicist_achievement_historical_physics_experiment_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_mass_energy_equivalence_var').IsSet , Scope.Var('curie_physicist_achievement_mass_energy_equivalence_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_essay_on_wind_var').IsSet , Scope.Var('curie_physicist_achievement_essay_on_wind_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_stratospheric_flight_var').IsSet , Scope.Var('curie_physicist_achievement_stratospheric_flight_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_founded_magnetic_association_var').IsSet , Scope.Var('curie_physicist_achievement_founded_magnetic_association_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievements_finished_geomagnetic_observatory_project_var').IsSet , Scope.Var('curie_physicist_achievements_finished_geomagnetic_observatory_project_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_magnetic_atlas_var').IsSet , Scope.Var('curie_physicist_achievement_magnetic_atlas_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_mathematics_improvement_finished_var').IsSet , Scope.Var('curie_physicist_achievement_mathematics_improvement_finished_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_first_cloud_describer_var').IsSet , Scope.Var('curie_physicist_achievement_first_cloud_describer_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_weather_service_var').IsSet , Scope.Var('curie_physicist_achievement_weather_service_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_weather_station_expansion_var').IsSet , Scope.Var('curie_physicist_achievement_weather_station_expansion_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_meteorology_improvement_finished_var').IsSet , Scope.Var('curie_physicist_achievement_meteorology_improvement_finished_var').GetFlagName)]"
 curie_physicist_achievements_intro_loc: "#V 이 물리학자의 업적#!\n#indent_newline:3 • [Scope.GetCharacter.GetFullName](은)는 이름난 물리학자입니다.#!\n #indent_newline:3 • 지금까지 총 [Scope.Var('curie_discovered_formulas_character_number_var').GetValue|V0]개의 공식을 도출하고 [Scope.Var('curie_discovered_experiments_character_number_var').GetValue|V0]건의 실험을 수행하였습니다. 또한 [Scope.Var('curie_discovered_clouds_character_number_var').GetValue|V0]개의 구름을 기록에 남겼습니다.#!"
 curie_physicist_achievements_no_physicist_loc: "이 #V [concept_curie_physicist]의 업적#!은 하나라도 달성하면 이곳에 표시됩니다."
 curie_physicist_achievement_historical_physics_experiment_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetSheHe]는 자신의 이름에서 따온 #V [Scope.GetCharacter.GetLastNameNoFormatting] 실험#!으로 유명합니다."
 curie_physicist_achievement_founded_magnetic_association_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetLastNameNoFormatting] 박사는 최초의 국제 과학 학회인 #V 지자기 학회의 창설자#!입니다.#!"
 curie_physicist_achievements_finished_geomagnetic_observatory_project_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetLastNameNoFormatting] 박사는 #V 지자기 관측소의 설치#!로 지자기 연구의 수행에 보탬이 되었습니다.#!"
 curie_physicist_achievement_magnetic_atlas_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetSheHe]는 #V 지자기 현황도의 제작#!에 핵심적인 역할을 하였습니다."
 curie_physicist_achievement_mathematics_improvement_finished_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetLastNameNoFormatting] 박사는 국내 대학에 설치된 #V 수학과의 수준 향상#!에 끊임없이 헌신하였습니다.#!"
 curie_physicist_achievement_first_cloud_describer_loc: "\n #indent_newline:3 • #V 특정 구름 유형을 처음으로 기록#!하여 기상학의 역사에 발자취를 남기게 되었습니다.#!"
 curie_physicist_achievement_weather_service_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetLastNameNoFormatting] 박사는 조국의 이익을 위하여 수년 동안 #V 기상 예보를 운영#!하였습니다.#!"
 curie_physicist_achievement_weather_station_expansion_loc: "\n #indent_newline:3 • 중대한 기술 혁신으로 꼽히는 천문대 부속 기상 관측소의 최신 기술 도입을 직접 지도하였습니다.#!"
 curie_physicist_achievement_meteorology_improvement_finished_loc: "\n #indent_newline:3 • 전신소를 통한 전국 기상 관측망의 확대는 우리나라를 기상 이변으로부터 훨씬 안전하게 만들어 주었습니다. 그 공로는 오롯이 [Scope.GetCharacter.GetLastNameNoFormatting] 박사의 것입니다!#!"
 curie_physicist_achievement_stratospheric_flight_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] organized and oversaw our country's #V first stratospheric flight#! and is therefore considered one of our most respected scientists."
 curie_physicist_achievement_mass_energy_equivalence_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] revolutionized modern physics with his #V formula for the equivalence of mass and energy#!."
 curie_physicist_achievement_essay_on_wind_loc: "\n #indent_newline:3 • With [Scope.GetCharacter.GetHerHis] #V treatise on wind currents in the mid-latitudes#!, [Scope.GetCharacter.GetSheHe] has produced a seminal work. [Scope.GetCharacter.GetSheHe].#!"