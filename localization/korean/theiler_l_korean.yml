 theiler.79.t: "생물학 조사단 철수"
 theiler.79.d: "연구 지원단이 국내 농부들에게 지배국에서 들여온 최신 해충 방제법을 소개하고 작별 인사를 나눈 뒤 고국으로 돌아갔다."
 theiler.79.f: "\"우리가 세상을 떠날 때 진정으로 중요한 것은, 우리가 남긴 사랑의 흔적 뿐.\" - 알베르트 슈바이처"
 theiler.79.g: "지배국을 둔다는 게 항상 그리 나쁜 건 아닐지도 모르겠군."
 subject_biological_team: "생물학 조사단 파견"
 subject_biological_team_desc: "[concept_theiler_biologist]는 종속국에 살충제를 도입할 생물학 조사단을 양성할 수 있습니다. "
 je_theiler_overlord_biological_team: "종주국에서 파견한 생물학 조사단"
 je_theiler_overlord_biological_team_reason: "현재 다른 국가에서 온 생물학 조사단이 우리나라에 최신 해충 방제법을 보급하고 있다."
 je_theiler_overlord_biological_team_goal: "생물학 조사단이 1년 동안 현장에 머무름"
