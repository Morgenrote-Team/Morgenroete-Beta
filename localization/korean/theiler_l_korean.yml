 theiler_early_pesticides_tech: "초창기 살충제"
 theiler_early_pesticides_tech_desc: "벽지의 안료로 쓰이던 '파리스 그린'이 살충 효과를 지녔다는 사실이 발견되면서 화학적 살충제도 점차 발전하기 시작하였습니다. 여기에는 해충 방제 효과가 훨씬 더 뛰어난 비산납 등의 물질도 포함되었습니다."
 theiler_modern_pesticides_tech: "현대식 살충제"
 theiler_modern_pesticides_tech_desc: "세기말에 이르러 해충의 창궐로 인한 문제도 점차 심해지게 되었습니다. 그에 따라 농산업계에서는 화학전으로 맞섰는데, 이 과정에서 동원된 무기로는 비산칼슘, 황산니코틴, 비산나트륨 등이 꼽힙니다."
 je_theiler_pesticide_development: "살충제 개발"
 je_theiler_pesticide_development_reason: "살충제에 대한 기본 지식을 갖춘 생물학자는 화학자와의 합동 연구로 [concept_theiler_pest]의 효과적인 처리 방안을 모색할 수 있다. 현재 개발 중인 방제 대상은 #V [AddLocalizationIf( Scope.Var('theiler_pesticide_type_var').IsSet , Scope.Var('theiler_pesticide_type_var').GetFlagName)]#!이다.\n\n생물학자나 화학자가 연구 도중에 사망하면 살충제 연구 자체도 중단되지만, 두 학자의 자리가 다시 채워지면 곧바로 재개됩니다."
 je_theiler_pesticide_development_success: "[concept_theiler_biologist]가 신형 살충제 개발에 나선 기간이 #ORANGE 12개월 이상#!"
 je_theiler_grafting: "접목"
 je_theiler_grafting_reason: "우리 생물학자 [ROOT.Var('theiler_biologist_var').GetCharacter.GetFullName](이)가 아메리카산 뿌리를 기반으로 유럽의 포도 농가를 살리기 위한 접목 기술 개발을 쉼없이 진행하고 있다."
 je_theiler_grafting_success: "[concept_theiler_biologist]가 신형 살충제 개발에 나선 기간이 #ORANGE 12개월 이상#!"
 je_theiler_pest_control: "해충 방제"
 je_theiler_pest_control_reason: "비산납과 비산칼슘부터 접목에 이르기까지 각종 살충제와 생물학적 수단의 개발과 제조가 이루어지면서, 시장에서 필수 원재료 (주로 납)을 구할 수 있다는 전제 하에, 생물학자들은 해충의 급격한 창궐에 맞서 싸울 수단을 갖추게 되었다. 이러한 방식을 통해 특정 주 지역 내의 해충을 한 달 이내에 전부 박멸할 수 있게 되었다."
 je_theiler_sterile_insect_technique: "불임충 방사법"
 je_theiler_sterile_insect_technique_reason: "최신 수단을 동원한다면 악명 높은 나선벌레파리를 박멸하여 인간과 동물을 그 고난으로부터 해방시킬 수 있을지도 모른다. 생물학자는 본 문제에 대한 적절한 해결책을 모색하기 위하여 이론을 세우고 현장 실험을 수행할 수 있다.\n\n생물학자가 연구 도중에 사망한다면 기생충의 박멸 과제도 중단되지만, 신임 생물학자가 채용되는 즉시 재개될 것이다."
 je_theiler_sterile_insect_technique_success: "[concept_theiler_biologist]가 나선벌레파리를 박멸할 수단을 모색하기 위한 연구에 보낸 시간이 #ORANGE 12개월 이상#!"
 theiler.71.t: "비산납"
 theiler.71.d: "[SCOPE.sCharacter('theiler_biologist_scope').GetLastName] 박사는 [SCOPE.sCharacter('mendelejew_chemist_scope').GetLastName] 박사와의 협업으로 대량 생산 시 농가에 혁명을 가져다줄 효과적인 살충제를 개발하였다. 사과굴나방이 사과를 파먹는 일도 이젠 끝이요, 콜로라도감자잎벌레도 목구멍 걸려 죽을 터이다!"
 theiler.71.f: "비산납 (PbHAsO₄)은 1892년 미국 매사추세츠의 멜빌 서스턴 쿡이 과수원의 사과굴나방(Cydia pomonella)을 방제하기 위하여 처음 개발하였다. 기존에 독성이 있는 비산동 (일명 '파리스 그린')보다 더 안전하고 식물에도 큰 해를 끼치지 않는 대체제로 여겨졌다. 비산납 가루를 작물의 잎과 열매에 한번 뿌리면 오랫동안 들러붙어 벌레를 죽이기 때문에, 과일 생산업의 효과적인 관리를 처음으로 가능하게 만들어 주었다. 비산납은 환경과 인간의 건강에 유해한 면이 없지 않았음에도, DDT를 비롯한 합성 살충제가 도입되기 전까지 널리 쓰여 왔다."
 theiler.71.g: "말 그대로 독살을 시킨다 이거지?"
 theiler.71.tt: "지금부터 농가에서는 [GetHarvestConditionType('theiler_potato_beetle_condition').GetName]와 [GetHarvestConditionType('theiler_codling_moth_condition').GetName]의 처리를 위해 농장에서 비산납을 활용하게 됩니다."
 theiler.72.t: "불임충 방사법"
 theiler.72.d: "[SCOPE.sCharacter('theiler_biologist_scope').GetLastName] 박사가 기존과는 어긋나면서도 획기적인 발상을 떠올렸다. 해충을 살충제로 박멸하는 대신 불임 상태의 수컷을 번식시켜 암컷이 자식을 낳지 못하도록 만든다는 유망한 방법을 써 보기로 한 것이다."
 theiler.72.f: "불임충 방사법(SIT)은 1950년대 레이먼드 C. 부시랜드와 에드워드 F. 니플링이 개발하였다. 주로 코발트-60이나 세슘-137으로 만든 감마선을 수컷 파리에 쏘여 불임으로 만드는 방법이다. 고에너지 방사선이 생식 세포의 DNA를 파괴하되 생명체의 활력이나 짝짓기 능력에는 큰 영향을 주지 않는 것이다. 수컷을 불임으로 만든 뒤에는 집단으로 풀어놓는다. 그때부터 수컷 파리들은 야생의 암컷과 만나 무사히 짝짓기에 나서지만 독자 생존이 가능한 자손 번식에는 실패하고 개체수가 점차 무너지게 되는 것이다. 이 방법은 특히 북중미 지역에서 나선벌레파리를 대상으로 박멸하는 성과를 거두면서 축산업계의 막중한 경제적 피해를 방지할 수 있었다."
 theiler.72.g: "말 그대로 피폭을 시킨다 이거지?"
 theiler.72.tt: "지금부터 생물학자는 다른 과제로 분주하지 않는다는 전제 하에 [GetHarvestConditionType('theiler_screwworm_fly_condition').GetName]가 창궐한 주를 해마다 한 곳씩 방제 작업에 나설 수 있습니다."
 theiler.73.t: "비산나트륨"
 theiler.73.d: "[SCOPE.sCharacter('theiler_biologist_scope').GetLastName] 박사는 [SCOPE.sCharacter('mendelejew_chemist_scope').GetLastName] 박사와의 협업으로 대량 생산 시 농가에 혁명을 가져다줄 효과적인 살충제를 개발하였다. 인류를 두려움에 떨게 만들던 메뚜기떼가 지금부터 진짜 공포를 맛볼 시간이 된 것이다!"
 theiler.73.f: "비산나트륨은 맹독성 무기염의 일종으로 20세기 초에 비선택성 살충제와 제초제로 쓰였다. 물에 상당히 잘 녹는 것이 특징이며, 전세계 농가에서 대표적인 화학 방제 수단으로 활용되었다. 비산나트륨의 대표적인 활용 사례는 식민지 시절 인도와 호주에서 소에 꼬이는 진드기를 박멸하기 위해 살충액 재료로 쓰인 것이 꼽히며, 양 살충액, 메뚜기 방제용으로도 쓰였다. 아시아의 고무와 차 플랜테이션에서는 덤불을 솎아내기 위한 수단으로 우선시되었다. 그 효력에도 불구하고 포유류에 대한 극심한 독성과 환경에 오랫동안 남아 있던 특성 탓에 노동자와 가축에 심각한 건강 문제를 초래하였다. 20세기 중반부터는 합성 유기염이 도입되고 비산나트륨 자체의 발암성을 점차 의식하게 되면서, 엄격히 규제되거나 사용을 금지하게 됨에 따라 유해성이 덜한 대체 용품을 사용하게 되었다."
 theiler.73.g: "말 그대로 미끼를 놓는다 이거지?"
 theiler.73.tt: "지금부터 농가에서는 [GetHarvestConditionType('locust_swarm').GetName]의 처리를 위해 농장에서 비산나트륨을 활용하게 됩니다."
 theiler.74.t: "비산칼슘"
 theiler.74.d: "[SCOPE.sCharacter('theiler_biologist_scope').GetLastName] 박사는 [SCOPE.sCharacter('mendelejew_chemist_scope').GetLastName] 박사와의 협업으로 대량 생산 시 농가에 혁명을 가져다줄 효과적인 살충제를 개발하였다. 맛이 어떠냐, 목화바구미!"
 theiler.74.f: "비산칼슘은 20세기 초 화학적 해충 방제의 초석이 된 맹독성 무기염의 일종이다. 1906년경부터 비산납보다 값도 싸고 안정적인 대체제로 소개되었으며, 이파리를 파먹는 벌레의 체내를 중독시키는 용도로 주로 활용되었다. 역사적으로 비산칼슘의 가장 대표적인 활용 사례로는 미국과 인도 식민지에서 목화비구미를 박멸하기 위해 목화밭에 대량 살포했던 것이 꼽힌다. 비산나트륨과는 달리 물에 녹는 성질이 덜하여, 작물이 시들 위험성이 적어 나뭇잎에 직접 살포하는 것이 가능했다. 영국령 인도에서는 목화와 감자 재배에 대대적으로 동원되었으며 초창기 공중 방제 살포의 형식으로 활용되는 경우가 많았다. 그러나 환경에 극도로 오랫동안 남아 있는 특성, 수분 매개 곤충을 대상으로 한 맹독성, 그리고 발암 요인 탓에 1940년대부터 DDT와 같은 합성 유기 살충제로 대체되기에 이르렀다."
 theiler.74.g: "말 그대로 속을 뒤집어놓는다 이거지?"
 theiler.74.tt: "지금부터 농가에서는 [GetHarvestConditionType('theiler_boll_weevil_condition').GetName]의 처리를 위해 농장에서 비산칼슘을 활용하게 됩니다."
 theiler.75.t: "접목"
 theiler.75.d: "[SCOPE.sCharacter('theiler_biologist_scope').GetLastName] 박사는 포도나무뿌리진디에 저항력을 보이는 미국산 포도나무의 연구를 마쳤다. 박사가 개발한 접목법을 통해, 신세계에서 건너온 포도나무뿌리진디로부터 구세계의 포도나무를 지킬 수 있게 되었다."
 theiler.75.f: "접목법은 19세기 말 프랑스 포도 대역병으로 황폐화된 전세계 포도 농가를 살려낸 원예 기술이다. 당시 대역병의 원흉은 포도나무뿌리진디(Daktulosphaira vitifoliae)로, 북아메리카에서 기원하여 유럽산 포도나무의 뿌리를 송두리째 갉아먹는 진딧물이었다. 20세기 초에 이르러 포도밭의 '재건' 과정에서 취약한 유럽 자생종의 어린가지를 저항력 있는 미국 자생종 (비티스 리파리아, 비티스 루페스트리스 등)의 뿌리줄기에 접목하는 작업이 이루어졌다. 이 작업을 통해 미국산 뿌리로 진딧물에 생물학적 면역력을 갖춘 동시에, 유럽산 수관(樹冠)은 포도의 품질을 그대로 유지하는 환상종이 탄생하게 되었다. 접목법은 지금까지도 업계 표준으로 유지되고 있는데, 이 정도 수준의 유전공학적 방어막에 비견될 만큼 제 효과나 지속성을 입증한 화학적 방제법이 전무하기 때문이다."
 theiler.75.g: "말 그대로... 아니 잠깐, 해충을 죽이질 않는다 이 말이오?"
 theiler.75.tt: "지금부터 농가에서는 [GetHarvestConditionType('theiler_grape_phylloxera_condition').GetName]의 처리를 위해 농장에서 접목법을 활용하게 됩니다."
 theiler.76.t: "황산니코틴"
 theiler.76.d: "[SCOPE.sCharacter('theiler_biologist_scope').GetLastName] 박사는 [SCOPE.sCharacter('mendelejew_chemist_scope').GetLastName] 박사와의 협업으로 대량 생산 시 농가에 혁명을 가져다줄 효과적인 살충제를 개발하였다. 벌레들의 티타임도 이젠 안녕이다!"
 theiler.76.f: "황산니코틴은 강력한 식물성 알칼로이드 유도체의 일종으로, 20세기 초 식민지 플랜테이션의 운영에 없어서는 안 될 살충제로 거듭났다. 담배 원료 추출물과는 달리 표준화된 황산염으로서 일관된 독성과 적은 용해성을 보이며, 차모기벌레(Helopeltis theivora)와 같은 흡즙성 벌레에 탁월한 효과를 보였다. 아삼과 실론의 차 농장에서는 건드리는 즉시 벌레의 신경계를 마비시키는 접촉독으로 널리 활용되었다. 보통 '블랙 리프 40'이란 상표명으로 출시되었으며, 번들거리고 매끈한 찻잎에 잘 들러붙도록 비누와 섞어 쓰는 경우가 많았다. 분해 속도도 빨라 잔여물이 장기간 남는 것을 최소화한 점도 강점으로 꼽혔지만, 높은 단가와 포유류를 상대로 한 높은 독성으로 활용 범위가 고가치 농작물로 제한되었으며, 1940년대에 이르러 합성 살충제의 등장으로 대체되었다."
 theiler.76.g: "말 그대로 연기로 내쫓는다 이거지?"
 theiler.76.tt: "From now on, farmers will use nicotine sulfate on their farms to get rid of the [GetHarvestConditionType('theiler_tea_mosquito_condition').GetName]."
 goods_output_tea_mult: "건물 @tea! 차 산출량"
 goods_output_tea_mult_desc: "건물에서 생산되는 @tea! 차의 양에 대한 보너스 또는 불이익"
 theiler.60.t: "목화바구미"
 theiler.60.d: "지금까지 멕시코 지역의 야생 목화만 먹잇감으로 삼았던 목화바구미가 서식지를 바꾼 것으로 보인다. 이제는 멕시코만 전역의 목화업계를 위협하고 있다!"
 theiler.60.f: "목화비구미(Anthonomus grandis)는 목화의 봉오리와 꽃을 먹이로 삼는 비구미다. 19세기 말 멕시코에서 미국으로 서식지를 옮기면서 농업 역사상 가장 막대한 경제적 피해를 끼친 해충으로 기록되었다. 목화비구미의 특성은 고유의 생식 주기에 있는데, 암컷이 목화의 꽃봉오리와 꼬투리에 알을 깠던 탓이다. 유충이 부화해서 목화의 내부 조직을 먹어치우면서 섬유조직이 자라나는 것을 막고 열매의 낙과를 유발하였다. 1920년대에 이르러 미국의 '무적 면화'(King Cotton) 산업에 극심한 피해를 끼치면서, 흑인 계층의 대이주 같은 큰 사회 변화를 일으키고 농가에서는 땅콩 등 수확물의 다변화를 꾀하는 계기가 되었다."
 theiler.60.g: "내 금쪽같은 목화가!"
 theiler.60.tt: "지금부터 [GetHarvestConditionType('theiler_boll_weevil_condition').GetName]가 북아메리카에 출몰하게 됩니다."
 theiler.61.t: "포도나무뿌리진디"
 theiler.61.d: "우리나라의 포도 농가에 나쁜 소식이 전해졌다. 어떤 이유에서인지 포도나무뿌리진디가 아메리카에서 유럽으로 퍼지고 말았다는 소식이다. 벌써부터 [SCOPE.sState('theiler_state_scope').GetName] 지역의 농가를 휩쓸기 시작했다고 한다. 그야말로 대참사가 아닐 수 없다!"
 theiler.61.f: "포도나무뿌리진디(Daktulosphaira vitifoliae)는 진딧물처럼 생긴 미세한 곤충으로, 포도 재배 역사상 가장 큰 피해를 끼친 해충으로 기록되었다. 북아메리카에 자생하던 포도나무뿌리진디는 19세기 말 유럽의 포도주 생산업을 파멸 직전으로 몰고 가면서 세계적인 농업 위기를 불러일으켰다. 포도나무뿌리진디가 해충으로서 보이는 특성은 포도나무 뿌리를 주먹이로 삼는 데 있다. 포도나무뿌리진디는 독성 타액을 뱉는데, 아메리카 자생종과는 달리 유럽에 자생하는 포도나무는 태초부터 면역력이 약해, 벌레혹과 뿌리의 점진적인 괴사를 유발한다. 이것으로 포도나무의 수분과 영앙분 흡수가 완전히 차단되기에 이르렀던 것이다."
 theiler.61.g: "내 금쪽같은 포도주가!"
 theiler.61.tt: "지금부터 [GetHarvestConditionType('theiler_grape_phylloxera_condition').GetName]이 유럽에 출몰하게 됩니다."
 theiler.62.t: "차모기벌레"
 theiler.62.d: "아삼 지역의 차나무가 알 수 없는 이유로 말라 죽어나가면서 대대적인 비상이 걸렸다. 수많은 나무에 차나무벌레가 꼬여 있으며, 벌레가 걷잡을 수 없이 퍼져나가고 있는 것으로 전해지는 모양이다!"
 theiler.62.f: "차모기벌레(genus Helopeltis)는 장님노린재과 반시목에 속하며 그 해로움이 극에 달한 것으로 알려진 해충이다. 이름과는 달리 모기가 아니라 순수 벌레지만 다리가 가늘고 길며 더듬이가 달려 있어 비슷한 외형을 띄고 있다. 이 벌레의 대표적인 피해 대상은 플랜테이션 작물, 그 중에서도 차, 코코아, 캐슈넛이 꼽힌다. 차모기벌레의 특성은 먹이를 먹는 특유의 원리에 있는데, 매미형 입틀로 즙이 많은 새순과 이파리를 빨아먹기 때문이다. 즙을 빨아먹는 동안 독성 타액을 식물에 주입하여 급격한 조직괴사를 유발하는데, 이는 곧 특유의 움푹 들어간 흑갈색 병변으로 나타난다. 이동성도 높고 번식력도 빠른 탓에 열대 지방의 농업 생산력에 큰 문제로 작용하고 있다."
 theiler.62.g: "내 금쪽같은 찻잎이!"
 theiler.62.tt: "지금부터 [GetHarvestConditionType('theiler_tea_mosquito_condition').GetName]가 남아시아와 동아시아에 출몰하게 됩니다."
 theiler.63.t: "[SCOPE.sState('theiler_state_scope').GetName]에서 감자잎벌레 발견!"
 theiler.63.d: "오늘 박물학자와 생물학자가 공동으로 발표한 보고서를 놓고 농민들은 물론 상인들도 시름에 빠졌다. 북아메리카 지역에 자생하는 악명 높은 콜로라도감자잎벌레가 우리나라의 과수원에서도 처음으로 발견되었다는 것이다. 지금 나서서 막지 못하면 유럽 전역으로 퍼질지도 모르는 상황이다!"
 theiler.63.f: "1820년대에 처음 발견된 콜로라도감자잎벌레는 일찍이 1850년대 말부터 로키 산맥에서 대서양 연안까지 확산되어 농가를 휩쓸기 시작했다. 그 과정에서 해마다 반경 140km에 달하는 감자밭을 먹어치우며 미국 농민들의 골치를 썩였다. 1870년대부터는 유럽 대륙으로 퍼져나가려는 시도가 번번히 있었으나 이루어지지 않았다. 그러다 제1차 세계 대전으로 구대륙의 식량 자원이 극히 고갈된 직후인 1920년대에 이르러서야 대륙을 건너오기 시작했던 것이다."
 theiler.63.g: "내 금쪽같은 감자가!"
 theiler.63.tt: "지금부터 [GetHarvestConditionType('theiler_potato_beetle_condition').GetName]가 북아메리카에 출몰하게 됩니다."
 theiler.64.t: "콜로라도감자잎벌레"
 theiler.64.d: "[SCOPE.sState('theiler_state_scope').GetName] 지역에서 전에 보지 못한 해충이 모습을 드러냈다. 지금까지 가시가지를 먹잇감으로 삼아왔던 콜로라도감자잎벌레가 미국 농가를 침범하면서 감자를 게걸스럽게 먹어치우기 시작한 것이다. 이 탐욕스런 해충을 막을 방법은 아무래도 없어 보인다!"
 theiler.64.f: "콜로라도감자잎벌레(Leptinotarsa decemlineata)는 잎벌레과에 속한 벌레 중에서도 농가에서 제일 악명 높은 해충으로 알려져 있다. 감귤빛 외피에 열 개의 검은 세로줄이 나 있는 것으로 쉽게 알아볼 수 있는 이 벌레는 가지과 작물, 특히 감자류에 주로 피해를 끼친다. 콜로라도감자잎벌레가 대표적인 해충으로서의 입지를 지키게 된 것은 그 무자비한 먹이 습성에 있는데, 성체와 유충 모두 무자비한 식엽 해충으로서 작물 전체를 갉아먹고 최종 수확량의 저하를 유발하기 때문이다. 물리적 피해 뿐만 아니라 빠른 번식 속도와 화학 살충제에 높은 면역력을 보인다는 점에서 전반적으로 두각을 드러낸다. 본래 북아메리카에서 기원한 콜로라도감자잎벌레는 국제 식량 안보에 큰 악영향을 끼치면서 세계적인 골칫거리로 떠오르게 되었다.\n\n#p 본 해충의 습격을 막을 확률은 생물학자와 화학자의 존재 유무, 살충제 기술 개발 여부에 따릅니다.#! "
 theiler.65.t: "사과굴나방의 걷잡을 수 없는 확산!"
 theiler.65.d: "사과굴나방이 서식지를 넓혀나가고 있다. 이웃한 지역에서 [SCOPE.sState('theiler_state_scope').GetName] 지역으로 건너와 그곳의 과수원으로 전파되고 있는 것이다. 그럼에도 이 나방이 북미 전역으로 퍼져 나가는 것을 막을 길은 없어 보인다!"
 theiler.65.f: "사과굴나방(Cydia pomonella)은 유라시아에서 기원하여 19세기에 사과 재배가 이루어지던 중부 유럽, 이탈리아 북부, 발칸 반도, 헝가리, 우랄 산맥 서부 러시아, 북아메리카, 호주 지역으로 퍼져나갔다. 북유럽 지역이나 너무 덥고 건조한 지역의 경우에는 영향이 미미했다. 20세기부터는 스칸디나비아 반도와 발트 3국, 남아메리카에 이르기까지 전세계의 사과 재배가 이루어지는 온대 지역 대부분으로 퍼져나갔으며, 과수원 농가에 있어 가장 악명 높은 해충으로 거듭나게 되었다."
 theiler.65.g: "해충의 전파를 막기 위해 모든 자원을 동원하라!"
 theiler.65.h: "우리 과학자들이 해결책을 모색할 것이오."
 theiler.65.i: "결국에는 해충과 더불어 사는 수밖에 없을 것이네."
 theiler.66.t: "[SCOPE.sState('theiler_state_scope').GetName]에서 사과굴나방 발견!"
 theiler.66.d: "오늘 박물학자와 생물학자가 공동으로 발표한 보고서를 놓고 농민들은 물론 상인들도 시름에 빠졌다. 유럽과 서아시아 지역에 자생하는 악명 높은 사과굴나방이 우리나라의 과수원에서도 처음으로 발견되었다는 것이다. 지금 나서서 막지 못하면 오세아니아 전역으로 퍼질지도 모르는 상황이다!"
 theiler.66.f: "사과굴나방(Cydia pomonella)은 유라시아에서 기원하여 19세기에 사과 재배가 이루어지던 중부 유럽, 이탈리아 북부, 발칸 반도, 헝가리, 우랄 산맥 서부 러시아, 북아메리카, 호주 지역으로 퍼져나갔다. 북유럽 지역이나 너무 덥고 건조한 지역의 경우에는 영향이 미미했다. 20세기부터는 스칸디나비아 반도와 발트 3국, 남아메리카에 이르기까지 전세계의 사과 재배가 이루어지는 온대 지역 대부분으로 퍼져나갔으며, 과수원 농가에 있어 가장 악명 높은 해충으로 거듭나게 되었다.\n\n#p 본 해충의 습격을 막을 확률은 생물학자와 화학자의 존재 유무, 살충제 기술 개발 여부에 따릅니다.#!"
 theiler.67.d: "오늘 박물학자와 생물학자가 공동으로 발표한 보고서를 놓고 농민들은 물론 상인들도 시름에 빠졌다. 유럽과 서아시아 지역에 자생하는 악명 높은 사과굴나방이 우리나라의 과수원에서도 처음으로 발견되었다는 것이다. 지금 나서서 막지 못하면 남아프리카 전역으로 퍼질지도 모르는 상황이다!"
 theiler.68.d: "오늘 박물학자와 생물학자가 공동으로 발표한 보고서를 놓고 농민들은 물론 상인들도 시름에 빠졌다. 유럽과 서아시아 지역에 자생하는 악명 높은 사과굴나방이 우리나라의 과수원에서도 처음으로 발견되었다는 것이다. 지금 나서서 막지 못하면 남아메리카 전역으로 퍼질지도 모르는 상황이다!"
 theiler.69.t: "해충 방지"
 theiler.69.d: "[SCOPE.sState('theiler_state_scope').GetName] 지역의 해충 방제가 대성공을 고두었다. 지역민들은 해충 억제 노력에 지지를 표하며, 이번 성과는 정부에서 적극적으로 대응한 덕분이라고 보고 있다. 최소한 수년 동안은 해충이 창궐할 일은 없게 된 것이다."
 theiler.69.f: "들끓는 해충을 박멸하는 데 성공하면 영향권에 든 주는 향후 10년 간 안전한 상태로 남게 된다. 그 후에는 해충이 좋아하는 식자원이나 항구를 보유한 다른 국가를 경유하여, 다시 한번 해당 지역 내 새로운 영토로 침범해 들어올 수도 있다."
 theiler.69.g: "이번엔 정부가 잘 해 주었군!"
 theiler.70.t: "해충 습격"
 theiler.70.d: "[SCOPE.sState('theiler_state_scope').GetName] 지역에 새롭게 유입된 해충을 방제하려던 노력이 완전 실패로 돌아가고 말았다. 해충이 온 나라로 당당하게 진군하는 것을 막을 수단은 전무해 보인다. 조국의 명성은 누더기가 되었고, 국민들은 이번 거대한 실책을 두고 정부의 책임을 성토하고 있다."
 theiler.70.f: "해충의 습격이 성공에 이른 순간 그 누구도 막을 길은 없다. 효과적인 대책을 강구하기 전까지는 (서식 범위에 한하여) 상습적으로 그 지역을 쑥대밭으로 만들게 될 것이다."
 theiler.70.g: "정부는 도대체 뭘 하는가!"
 theiler_biological_victory_modifier: "생물학의 승리"
 theiler_biological_defeat_modifier: "생물학의 패배"
 theiler_field_burning_modifier: "논밭 태우기"
