 je_theiler_medicinal_plant_emetine: "토근"
 je_theiler_medicinal_plant_emetine_reason: "신약 개발 과정은 일반적으로 다음의 절차를 거칩니다. 우선 당신의 의료 기술 단계에 따라 [concept_panum_physician]가 약용으로 사용할 특정 [concept_ito_medicinal_plants]을 탐색할 것을 제안합니다. 이 경우 최소 #V 5개의 [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]#!을 모으게 됩니다. [concept_dubois_naturalist]는 채집본들을 모아 분리하는 임무를 맡습니다. 그런 뒤 [concept_mendelejew_chemist]가 화학물질을 추출합니다. 화학 물질이 발견되면 [concept_theiler_biologist]는 의약품 제조에 나설 수 있습니다.\n\n토근은 브라질을 중심으로 남아메리카에 자생하는 열대 식물입니다. 뿌리에는 구토를 유발하고 항기생충 효과를 보이는 알칼로이드의 일종인 에메틴과 세팔린이 함유되어 있습니다. 예로부터 토근 뿌리는 중독 치료를 위한 구토제와 기침 시럽약의 거담제로 쓰였습니다."
 je_theiler_medicinal_plant_emetine_success: "[GetPlayer.GetName]에서 #V 토근 5개#! 이상 확보"
 je_theiler_medicinal_plant_atropine: "벨라돈나풀"
 je_theiler_medicinal_plant_atropine_reason: "신약 개발 과정은 일반적으로 다음의 절차를 거칩니다. 우선 당신의 의료 기술 단계에 따라 [concept_panum_physician]가 약용으로 사용할 특정 [concept_ito_medicinal_plants]을 탐색할 것을 제안합니다. 이 경우 최소 #V 5개의 [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]#!을 모으게 됩니다. [concept_dubois_naturalist]는 채집본들을 모아 분리하는 임무를 맡습니다. 그런 뒤 [concept_mendelejew_chemist]가 화학물질을 추출합니다. 화학 물질이 발견되면 [concept_theiler_biologist]는 의약품 제조에 나설 수 있습니다.\n\n벨라돈나풀은 독말풀이라고도 알려져 있으며 유럽, 북아프리카, 서아시아에서 자생하는 여러해살이풀입니다. 아트로핀, 스코폴라민, 히오시아민 등의 독성 알칼로이드가 함유되어 있으며, 아세틸콜린 수용체를 차단하여 신경계를 보호하는 효과를 지니고 있습니다. 예로부터 진정제, 진통제, 동공확장제로 사용되었습니다. 현대 의학에서는 정제된 아트로핀이 안과에서 사용되며 서맥이나 유기인산염 중독 지료에 쓰입니다."
 je_theiler_medicinal_plant_atropine_success: "[GetPlayer.GetName]에서 #V 벨라돈나풀 5개#! 이상 확보"
 je_theiler_medicinal_plant_aloin: "알로에 베라"
 je_theiler_medicinal_plant_aloin_reason: "신약 개발 과정은 일반적으로 다음의 절차를 거칩니다. 우선 당신의 의료 기술 단계에 따라 [concept_panum_physician]가 약용으로 사용할 특정 [concept_ito_medicinal_plants]을 탐색할 것을 제안합니다. 이 경우 최소 #V 5개의 [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]#!을 모으게 됩니다. [concept_dubois_naturalist]는 채집본들을 모아 분리하는 임무를 맡습니다. 그런 뒤 [concept_mendelejew_chemist]가 화학물질을 추출합니다. 화학 물질이 발견되면 [concept_theiler_biologist]는 의약품 제조에 나설 수 있습니다.\n\n알로에 베라는 북아프리카와 아라비아 반도에서 자생하는 다육식물입니다. 두꺼운 잎 속에는 다당류, 비타민, 효소가 풍부한 젤이 들어 있는데 진정과 보습 효과가 뛰어납니다. 젤은 화장품과 화상, 상처, 피부 극 치료제로 널리 사용됩니다. 잎 안쪽 층에서 추출한 건조 유액에는 강력한 완화 효과를 지닌 알로인이 함유되어 있습니다."
 je_theiler_medicinal_plant_aloin_success: "[GetPlayer.GetName]에서 #V 알로에 베라 5개#! 이상 확보"
 je_theiler_medicinal_plant_digitoxin: "디기탈리스"
 je_theiler_medicinal_plant_digitoxin_reason: "신약 개발 과정은 일반적으로 다음의 절차를 거칩니다. 우선 당신의 의료 기술 단계에 따라 [concept_panum_physician]가 약용으로 사용할 특정 [concept_ito_medicinal_plants]을 탐색할 것을 제안합니다. 이 경우 최소 #V 5개의 [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]#!을 모으게 됩니다. [concept_dubois_naturalist]는 채집본들을 모아 분리하는 임무를 맡습니다. 그런 뒤 [concept_mendelejew_chemist]가 화학물질을 추출합니다. 화학 물질이 발견되면 [concept_theiler_biologist]는 의약품 제조에 나설 수 있습니다.\n\n디기탈리스는 폭스글로브라고도 부르며 유럽에 자생하는 두해살이 식물입니다. 잎에는 다이곡신과 디기톡신과 같은 강심배당체가 함유되어 있어 심장수축을 강화하고 심장박동을 조절하는 효과를 지닙니다. 예로부터 디기탈리스 추출물은 심부전과 부정맥 치료에 사용되었습니다. 강심배당체를 정제하여 심장 질환 치료에 조심스레 투여되지만, 생 식물은 심각한 중독 위험 때문에 활용이 금지되어 있습니다."
 je_theiler_medicinal_plant_digitoxin_success: "[GetPlayer.GetName]에서 #V 디기탈리스 5개#! 이상 확보"
 je_theiler_medicinal_plant_quinine: "기나나무"
 je_theiler_medicinal_plant_quinine_reason: "신약 개발 과정은 일반적으로 다음의 절차를 거칩니다. 우선 당신의 의료 기술 단계에 따라 [concept_panum_physician]가 약용으로 사용할 특정 [concept_ito_medicinal_plants]을 탐색할 것을 제안합니다. 이 경우 최소 #V 5개의 [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]#!을 모으게 됩니다. [concept_dubois_naturalist]는 채집본들을 모아 분리하는 임무를 맡습니다. 그런 뒤 [concept_mendelejew_chemist]가 화학물질을 추출합니다. 화학 물질이 발견되면 [concept_theiler_biologist]는 의약품 제조에 나설 수 있습니다.\n\n기나나무는 남아메리카, 그 중에서도 안데스 산맥 지역에 자생하는 나무입니다. 나무껍질에 퀴닌과 기타 알칼로이드 성분이 함유되어 있는데 강력한 항말라리아 효능을 지니고 있습니다. 예로부터 기나나무 껍질은 열병과 말라리아 치료에 사용되었습니다. 오늘날까지도 퀴닌과 그 유도체는 말라리아 치료에 중요한 약으로 남아 있습니다. 기나나무는 열대 지역에서도 약용 나무껍질 수화을 위해 재배되고 있습니다."
 je_theiler_medicinal_plant_quinine_success: "[GetPlayer.GetName]에서 #V 기나나무 5개#! 이상 확보"
 je_theiler_medicinal_plant_thymol: "타임"
 je_theiler_medicinal_plant_thymol_reason: "신약 개발 과정은 일반적으로 다음의 절차를 거칩니다. 우선 당신의 의료 기술 단계에 따라 [concept_panum_physician]가 약용으로 사용할 특정 [concept_ito_medicinal_plants]을 탐색할 것을 제안합니다. 이 경우 최소 #V 5개의 [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]#!을 모으게 됩니다. [concept_dubois_naturalist]는 채집본들을 모아 분리하는 임무를 맡습니다. 그런 뒤 [concept_mendelejew_chemist]가 화학물질을 추출합니다. 화학 물질이 발견되면 [concept_theiler_biologist]는 의약품 제조에 나설 수 있습니다.\n\n선백리향이라고도 불리는 타임 (Thymus vulgaris)은 지중해에 자생하는 조그마한 다년생 허브입니다. 잎과 기름에는 티몰과 카르바크롤, 그리고 기타 향균, 항산화, 항염증 효과가 있는 에센셜 오일이 함유되어 있습니다. 예로부터 타임은 호흡기 감염, 기침, 소화장애 치료에 사용되어 왔습니다. 약초학과 아로마테라피, 식품의 천연 방부제 및 향미제로도 널리 사용되고 있습니다."
 je_theiler_medicinal_plant_thymol_success: "붉은킨코나나무[GetPlayer.GetName]에서 #V 타임 5개#! 이상 확보"
 je_theiler_medicinal_plant_pilocarpine: "필로카르푸스 펜나티폴리우스"
 je_theiler_medicinal_plant_pilocarpine_reason: "신약 개발 과정은 일반적으로 다음의 절차를 거칩니다. 우선 당신의 의료 기술 단계에 따라 [concept_panum_physician]가 약용으로 사용할 특정 [concept_ito_medicinal_plants]을 탐색할 것을 제안합니다. 이 경우 최소 #V 5개의 [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]#!을 모으게 됩니다. [concept_dubois_naturalist]는 채집본들을 모아 분리하는 임무를 맡습니다. 그런 뒤 [concept_mendelejew_chemist]가 화학물질을 추출합니다. 화학 물질이 발견되면 [concept_theiler_biologist]는 의약품 제조에 나설 수 있습니다.\n\n필로카르푸스 페나티폴리우스(Pilocarpus pennatifolius)는 브라질에 자생하는 열대 관목입니다. 잎에는 침샘과 땀샘을 자극하는 알칼로이드의 일종인 필로카르핀이 함유되어 있습니다. 예로부터 구강건조증과 안구질환 치료에 사용되었습니다. 현대 의학에서는 안압을 낮춰 녹내장을 다스리고 방사능이나 약물로 인한 구강건조증(제로스토미아)을 치료하는 데 사용됩니다. 식물 자체는 약리학적으로 활성화된 알칼로이드 성분에 주로 가치를 두는 편입니다. "
 je_theiler_medicinal_plant_pilocarpine_success: "[GetPlayer.GetName]에서 #V 필로카르푸스 펜나티폴리우스 5개#! 이상 확보"
 je_theiler_medicinal_plant_ephedrine: "마황"
 je_theiler_medicinal_plant_ephedrine_reason: "신약 개발 과정은 일반적으로 다음의 절차를 거칩니다. 우선 당신의 의료 기술 단계에 따라 [concept_panum_physician]가 약용으로 사용할 특정 [concept_ito_medicinal_plants]을 탐색할 것을 제안합니다. 이 경우 최소 #V 5개의 [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]#!을 모으게 됩니다. [concept_dubois_naturalist]는 채집본들을 모아 분리하는 임무를 맡습니다. 그런 뒤 [concept_mendelejew_chemist]가 화학물질을 추출합니다. 화학 물질이 발견되면 [concept_theiler_biologist]는 의약품 제조에 나설 수 있습니다.\n\n마황은 에페드라 시니카(Ephedra sinica)라는 학명을 갖고 있으며 중국과 중앙아시아에 자생하는 관목입니다. 잎에는 침샘과 땀샘을 자극하는 알칼로이드의 일종인 필로카르핀이 함유되어 있습니다. 한의학에서는 천식, 기관지염, 코막힘 치료에 쓰였습니다. 그러나 지금은 고혈압, 심장질환, 기타 부작용의 위험으로 사용이 제한되고 있습니다."
 je_theiler_medicinal_plant_ephedrine_success: "[GetPlayer.GetName]에서 #V 마황 5개#! 이상 확보"
 je_theiler_medicinal_plant_strophantine: "스트로판투스 그라투스"
 je_theiler_medicinal_plant_strophantine_reason: "신약 개발 과정은 일반적으로 다음의 절차를 거칩니다. 우선 당신의 의료 기술 단계에 따라 [concept_panum_physician]가 약용으로 사용할 특정 [concept_ito_medicinal_plants]을 탐색할 것을 제안합니다. 이 경우 최소 #V 5개의 [AddLocalizationIf( Scope.Var('theiler_physician_demand_var').IsSet , Scope.Var('theiler_physician_demand_var').GetFlagName)]#!을 모으게 됩니다. [concept_dubois_naturalist]는 채집본들을 모아 분리하는 임무를 맡습니다. 그런 뒤 [concept_mendelejew_chemist]가 화학물질을 추출합니다. 화학 물질이 발견되면 [concept_theiler_biologist]는 의약품 제조에 나설 수 있습니다.\n\n스트로판투스 그라투스 (Strophanthus gratus)는 서아프리카에 자생하는 덩굴 식물입니다. 식물의 씨앗에는 심장수축에 큰 영향을 끼치는 우아바인 등의 강심배당체가 함유되어 있습니다. 예로부터 이 식물의 추출물은 화살독으로 사용되었으며 심부전 치료에 소량을 사용하기도 했습니다. 우아바인은 심부전과 부정맥 수술에 활용하려는 연구가 이뤄져 왔습니다."
 je_theiler_medicinal_plant_strophantine_success: "[GetPlayer.GetName]에서 #V 스트로판투스 그라투스 5개#! 이상 확보"
