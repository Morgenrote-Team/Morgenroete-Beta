 theiler_boll_weevil_condition: "목화바구미"
 theiler_boll_weevil_condition_desc: "19세기에서 20세기로 넘어갈 즈음 출몰한 목화비구미는 목화 작물을 쓸어버리며 북미 지역에서 가장 위협적인 해충으로 꼽혔습니다."
 theiler_codling_moth_condition: "사과굴나방"
 theiler_codling_moth_condition_desc: "사과굴나방은 온 작물을 정기적으로 휩쓸면서 유럽 지역의 사과 농가로 하여금 최악의 재앙으로 꼽혔습니다. "
 theiler_grape_phylloxera_condition: "포도나무뿌리진디"
 theiler_grape_phylloxera_condition_desc: "19세기 말 포도나무뿌리진디의 창궐로 유럽 지역, 그 중에서도 특히 프랑스의 포도밭은 거의 대부분 작살나고 말았습니다."
 theiler_potato_beetle_condition: "콜로라도감자잎벌레"
 theiler_potato_beetle_condition_desc: "1840년경 콜로라도감자잎벌레가 재배용 감자를 숙주 범위로 삼으면서, 감자 작물에 있어 가장 해로운 벌레로 급속히 거듭나게 되었습니다."
 theiler_screwworm_fly_condition: "나선벌레파리"
 theiler_screwworm_fly_condition_desc: "코클리오미아 호미니보락스는 기생종의 일종으로, 그 유충은 살아 있는 유기체, 주로 소나 그 밖의 가축 같은 온혈동물에 꼬여 살을 파먹는 것으로 악명이 높습니다."
 theiler_tea_mosquito_condition: "차모기벌레"
 theiler_tea_mosquito_condition_desc: "이른바 모기벌레라 부르는 게누스 헬로펠티스는 카카오나무, 캐슈나무, 목화, 차나무를 비롯한 여러 작물의 해충으로 알려져 있습니다."
