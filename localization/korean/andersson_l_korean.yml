 andersson.501.t: "[GetPlayer.GetCustom('andersson_fossil_piltdown')]인은 사기였다!"
 andersson.501.d: "[SCOPE.sCharacter('andersson_piltdown_attacker_scope').GetLastName] 박사의 철저한 조사 끝에 문제의 유골이 가짜임을 입증해냈다. 이는 [GetGlobalVariable('andersson_piltdown_country_global_var').GetCountryDefinition.GetName]에게 엄청난 망신거리로 다가왔다. [SCOPE.sCountry('andersson_piltdown_defender_country_scope').GetAdjectiveNoFormatting]의 선임 인류학자 [SCOPE.sCharacter('andersson_piltdown_defender_scope').GetLastName] 박사가 사기꾼임이 드러난 것이다!"
 andersson.501.f: "[GetPlayer.GetCustom('andersson_fossil_piltdown')]인이 발견된 이래 [SCOPE.sCountry('andersson_piltdown_defender_country_scope').GetAdjectiveNoFormatting] 국외 학자들은 그 진위여부를 놓고 상당한 의심을 표명했으며, 오히려 이런 '발견'이 [SCOPE.sCountry('andersson_piltdown_defender_country_scope').GetAdjectiveNoFormatting]의 인정 욕구 때문이라고 주장하였다. 저명한 학자들이 사기극임을 밝혀내기 위해 수차례 시도했음에도 모두 실패로 돌아갔다. 허나 [SCOPE.sCharacter('andersson_piltdown_attacker_scope').GetFullName](은)는 마침내 그 이면의 진실을 세상에 드러내기에 이르렀다. 그것은 바로 인류학 역사상 최대의 사기극이었다. 해당 두개골은 기존 주장보다 훨씬 후대의 것으로, 그 연대가 중세 시대에 불과하였을 뿐만 아니라, 인간의 두개골 상부과 오랑우탄의 턱뼈를 결합하였다는 사실이 밝혀졌다."
 andersson.501.g: "결국 엄밀한 과학이 승리하는 법."
 andersson.502.t: "학계의 참사!"
 andersson.502.g: "이루 말할 수 없는 국제 망신이오!"
 andersson.503.t: "토론 패배"
 andersson.503.d: "[SCOPE.sCharacter('andersson_piltdown_attacker_scope').GetLastName] 박사는 그간의 무수한 논쟁에도 불구하고 [GetPlayer.GetCustom('andersson_fossil_piltdown')]인이 위조된 것이라는 주장을 학계에 설파하는 데 끝내 실패하고 말았다. 그런 한편으로 [SCOPE.sCharacter('andersson_piltdown_defender_scope').GetLastName] 박사는 뛰어난 연사임을 증명해냈다."
 andersson.503.f: "알고 보니 그 [SCOPE.sCountry('andersson_piltdown_defender_country_scope').GetAdjectiveNoFormatting] 학자는 토론 당일에도 몇 가지 비장의 수를 감추고 있었던 모양이다. 우리 측 인류학자는 편견과 뇌물, 그리고 형편없는 아침식사를 실패의 원인으로 돌렸다."
 andersson.503.g: "어쩌면 그것이 진품일지도 모르겠군..."
 andersson.504.t: "학계의 승리"
 andersson.504.d: "하찮은 나라의 하찮은 학자가 우리나라의 귀중한 [GetPlayer.GetCustom('andersson_fossil_piltdown')]인 화석이 위조된 것이라 폭로하려던 시도가 실패로 돌아갔다. 국내 인류학 연구소는 이번 논쟁을 통해 더욱 탄력을 얻게 되었다."
 andersson.504.f: "타국에서 내세우는 주장들이 고작 이 정도 수준에 지나지 않는다면 현생 인류가 [SCOPE.sCountry('andersson_piltdown_defender_country_scope').GetName]에서 기원하였다는 사실은 너무나 자명한 셈이다."
 andersson.504.g: "다음 상대 들어오시오!"
 andersson.511.t: "[GetPlayer.GetCustom('andersson_fossil_piltdown')]인: 토론 준비"
 andersson.511.d: "[SCOPE.sCharacter('andersson_piltdown_attacker_scope').GetLastName] 박사는 중요한 화석이 위조된 것임을 폭로하기 위한 준비에 들어갔다. 그 반대 입장으로는 [SCOPE.sCharacter('andersson_piltdown_defender_scope').GetLastName] 박사가 나설 전망이다. 두 사람 모두 자신과 조국의 명예를 지키기 위해 나섰다."
 andersson.511.f: "인류학자의 토론 능력을 좌우하는 것은 학자 본인의 경험치가 우선이고, 인물 특성이 그 다음에 해당됩니다. 형식의 변동이 매일같이 이루어진다는 점도 고려한다면 약간의 운적인 요소도 작용합니다. 기존 이론을 새로운 이론으로 무너뜨려야 한다는 점에서 화석을 보유한 국가는 다소 유리한 위치에 있습니다. 토론 능력 점수가 더 높은 인류학자가 토론에서 승리합니다. 무승부일 경우에도 방어에 나선 쪽이 승리하게 됩니다.\n\n[SCOPE.sCountry('andersson_piltdown_attacker_country_scope').GetName]의 [SCOPE.sCharacter('andersson_piltdown_attacker_scope').GetFullNameNoFormatting]: #V 토론 능력#! [SCOPE.GetValue('andersson_piltdown_attacker_points_scope')|0+]\n\n[SCOPE.sCountry('andersson_piltdown_defender_country_scope').GetName]의 [SCOPE.sCharacter('andersson_piltdown_defender_scope').GetFullNameNoFormatting]: #V 토론 능력#! [SCOPE.GetValue('andersson_piltdown_defender_points_scope')|0+]"
 andersson.511.g: "[GetGlobalVariable('andersson_piltdown_country_global_var').GetCountryDefinition.GetName](을)를 공개 과학 토론에 제기하겠다!"
 andersson.511.h: "다시 생각해 보니 좋은 생각은 아닌 듯하다."
