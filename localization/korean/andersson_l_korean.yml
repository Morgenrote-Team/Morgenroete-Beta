 andersson_state_trait_cave_paintings: "동굴 벽화\n인류학 연구로 #G +2#! @andersson_human_fossil! [Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')]"
 je_group_andersson_anthropology: "인류학"
 je_andersson_anthropological_research: "인류학 연구"
 je_andersson_anthropological_research_reason: "[ROOT.GetCountry.GetCustom('je_andersson_anthropological_default_research_active_type')]분주한 상태가 아닌 [concept_andersson_anthropologist]는 조국의 인류학 연구를 수행할 수 있습니다. 그 과정에서 간혹 [concept_andersson_cave]을 찾아낼 수도 있습니다. 장기간 동굴 탐사와 발굴을 수행하는 인류학자는 #V $dubois_paleontologist$#!나 #V $lepsius_archaeologist$#! [concept_character_trait]을 획득할 수 있지만 둘 중에 오직 하나만 획득할 수 있습니다. 연구를 통해 해마다 @andersson_human_fossil! [concept_andersson_human_fossil] 1점을 획득하게 됩니다.\n\n$mr_divider_for_je$\n인류학자는 @andersson_human_fossil![Concept('concept_andersson_human_fossil','$concept_andersson_human_fossils$')]이나 @andersson_prehistoric_artifact![Concept('concept_andersson_prehistoric_artifact','$concept_andersson_prehistoric_artifacts$')]을 추가로 획득할 수도 있으며, 그에 영향을 끼치는 요인은 다음과 같습니다.\n[ROOT.GetCountry.GetCustom('je_andersson_anthropological_default_research_anthropologist_paleontologist_trait_type')][ROOT.GetCountry.GetCustom('je_andersson_anthropological_default_research_anthropologist_archaeologist_trait_type')][ROOT.GetCountry.GetCustom('je_andersson_anthropological_default_research_anthropologist_speleologist_trait_type')][ROOT.GetCountry.GetCustom('je_andersson_anthropological_default_research_cave_type')]"
 je_andersson_hominid_prospecting_neoanthropus: "원시 인류 탐색: 네오안트로푸스"
 je_andersson_hominid_prospecting_neoanthropus_reason: "#p 현재 [SCOPE.sState('target').GetName]에서 원시 인류 탐색이 진행되고 있습니다.#!\n$mr_divider_for_je$\n인류학자의 인류 화석 탐색은 탐사, 수집, 식별의 세 단계로 나뉩니다. 탐사 단계에서 인류학자는 적절한 인류학적 유적지를 찾아 해당 지역을 탐색합니다. 그 단계를 거치고 나면 화석 수집에 나섭니다. 화석을 충분히 발견했다면 식별 절차에 나섭니다. 탐사와 수집은 발견 이벤트로 마무리됩니다. 식별 절차에서 신규 원시 인류 종이 확인될 수도 있습니다.\n\n$mr_divider_for_je$\n[GetGeographicRegion('andersson_geographic_region_neoanthropus').GetName]는 전세계에서 찾아볼 수 있습니다. 이 범주에 속하는 종은 다음과 같습니다.\n- [GetGeographicRegion('andersson_geographic_region_vero').GetName]\n- [GetGeographicRegion('andersson_geographic_region_lagoa_santa').GetName]\n- [GetGeographicRegion('andersson_geographic_region_cro_magnon').GetName]\n- [GetGeographicRegion('andersson_geographic_region_boskop').GetName]\n- [GetGeographicRegion('andersson_geographic_region_tianyuan').GetName]\n- [GetGeographicRegion('andersson_geographic_region_talgai').GetName]"
 je_andersson_hominid_prospecting_palaeanthropus: "원시 인류 탐색: 팔라에안트로푸스"
 je_andersson_hominid_prospecting_palaeanthropus_reason: "#p 현재 [SCOPE.sState('target').GetName]에서 원시 인류 탐색이 진행되고 있습니다.#!\n$mr_divider_for_je$\n인류학자의 인류 화석 탐색은 탐사, 수집, 식별의 세 단계로 나뉩니다. 탐사 단계에서 인류학자는 적절한 인류학적 유적지를 찾아 해당 지역을 탐색합니다. 그 단계를 거치고 나면 화석 수집에 나섭니다. 화석을 충분히 발견했다면 식별 절차에 나섭니다. 탐사와 수집은 발견 이벤트로 마무리됩니다. 식별 절차에서 신규 원시 인류 종이 확인될 수도 있습니다.\n\n$mr_divider_for_je$\n[GetGeographicRegion('andersson_geographic_region_palaeanthropus').GetName]는 유럽과 근동 지역에서 발견됩니다. 이 범주에 속하는 종은 다음과 같습니다.\n- [GetGeographicRegion('andersson_geographic_region_neanderthal').GetName]\n- [GetGeographicRegion('andersson_geographic_region_gibraltar').GetName]\n- [GetGeographicRegion('andersson_geographic_region_spy').GetName]\n- [GetGeographicRegion('andersson_geographic_region_krapina').GetName]\n- [GetGeographicRegion('andersson_geographic_region_galilee').GetName]"
 je_andersson_hominid_prospecting_pithecanthropus: "원시 인류 탐색: 피테칸트로푸스"
 je_andersson_hominid_prospecting_pithecanthropus_reason: "#p 현재 [SCOPE.sState('target').GetName]에서 원시 인류 탐색이 진행되고 있습니다.#!\n$mr_divider_for_je$\n인류학자의 인류 화석 탐색은 탐사, 수집, 식별의 세 단계로 나뉩니다. 탐사 단계에서 인류학자는 적절한 인류학적 유적지를 찾아 해당 지역을 탐색합니다. 그 단계를 거치고 나면 화석 수집에 나섭니다. 화석을 충분히 발견했다면 식별 절차에 나섭니다. 탐사와 수집은 발견 이벤트로 마무리됩니다. 식별 절차에서 신규 원시 인류 종이 확인될 수도 있습니다.\n\n$mr_divider_for_je$\n[GetGeographicRegion('andersson_geographic_region_pithecanthropus').GetName]는 유럽과 아프리카, 아시아 지역에서 발견됩니다. 이 범주에 속하는 종은 다음과 같습니다.\n- [GetGeographicRegion('andersson_geographic_region_heidelberg').GetName]\n- [GetGeographicRegion('andersson_geographic_region_rhodesian').GetName]\n- [GetGeographicRegion('andersson_geographic_region_peking').GetName]\n- [GetGeographicRegion('andersson_geographic_region_java').GetName]"
 je_andersson_hominid_prospecting_australopithecus: "원시 인류 탐색: 오스트랄로피테쿠스"
 je_andersson_hominid_prospecting_australopithecus_reason: "#p 현재 [SCOPE.sState('target').GetName]에서 원시 인류 탐색이 진행되고 있습니다.#!\n$mr_divider_for_je$\n인류학자의 인류 화석 탐색은 탐사, 수집, 식별의 세 단계로 나뉩니다. 탐사 단계에서 인류학자는 적절한 인류학적 유적지를 찾아 해당 지역을 탐색합니다. 그 단계를 거치고 나면 화석 수집에 나섭니다. 화석을 충분히 발견했다면 식별 절차에 나섭니다. 탐사와 수집은 발견 이벤트로 마무리됩니다. 식별 절차에서 신규 원시 인류 종이 확인될 수도 있습니다.\n\n$mr_divider_for_je$\n[GetGeographicRegion('andersson_geographic_region_australopithecus').GetName]는 아프리카 지역에서 발견됩니다."
 je_andersson_cave_exploration: "동굴 탐사"
 je_andersson_cave_exploration_reason: "#p 현재 동굴 탐사가 [SCOPE.sState('target').GetName]에서 진행되고 있습니다.#!\n$mr_divider_for_je$\n동굴 탐사는 전적으로 동굴학적 조사에 달려 있다. 따라서 경험 많은 인류학자만이 동굴을 더 신속히 탐사할 수 있다. [SCOPE.sState('target').GetNameNoFormatting]의 동굴에는 어떤 비밀을 간직하고 있는가?"
