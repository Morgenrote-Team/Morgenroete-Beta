 andersson_speleology_progress_anthropologist_evolutionist_diffusionist_trait_tt: "#default_text #n [concept_andersson_anthropologist]가 #V $andersson_evolutionist$#!나 #V $andersson_diffusionist$#! [concept_character_trait]을 보유함#!"
 andersson.61.t: "[GetPlayer.GetCustom('andersson_fossil_piltdown')]인"
 andersson.61.d: "인류학을 선도하는 인류학자 두 명이 학계를 뒤흔들 만한 발견을 이루어냈다고 발표하였다. 최초의 현생 인류를 발견하였는데 그 기원이 [ROOT.GetCountry.GetNameNoFlag](이)었음이 분명히 드러난 것이다."
 andersson.61.f: "런던 지질학회 모임에서 아서 스미스 우드워드와 찰스 도슨은 필트다운 마을 인근 자갈 채취장에서 찾아낸 초기 인류의 두개골 파편은 획기적인 발견이라 소개하였다. 우드워드는 발견된 파편을 바탕으로 복원한 두개골 모형을 통해 현생 인류의 두개골과 거의 유사한 형태라 평가하였는데, 여기서 다만 두개골과 척추가 만나는 후두부와 두뇌의 크기가 현생 인류의 약 3분의 2에 불과할 뿐이며, 치아와 턱뼈 또한 현생 인류와 크게 다르지 않다고 소개하였다. 대영박물관의 드높은 학술적 권위를 등에 업은 우드워드는 필트다운에서 발견된 유골이 유인원과 인류 사이의 잊혀진 연결 고리라 해석하였다. 처음에는 회의적인 시각도 있었으나, 런던 자연사 박물관의 학자들은 해당 유골의 연대를 20만 년에서 50만 년 전으로 추산하였다. 이는 네안데르탈인보다 훨씬 오래된 시점이었다. 이러한 발견 소식이 전해지면서 곧바로 전문가들과 영국 국민들의 큰 관심을 불러일으켰다. 또한 필트다운인의 발견 소식은 전세계적으로 큰 반향을 일으켰다."
 andersson.61.g: "그러니까 최초의 현생 인류가 [ROOT.GetCountry.GetAdjectiveNoFormatting] 사람이었단 거군. 놀라울 것도 없지!"
 andersson.61.h: "이번 발견은 정말이지 의심스럽소."
 andersson.62.d: "국내 최고의 인류학자인 [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사가 오늘 학계를 뒤흔들 만한 발견을 이루어냈다고 발표하였다. 최초의 현생 인류를 발견하였는데 그 기원이 [ROOT.GetCountry.GetNameNoFlag](이)었음이 분명히 드러난 것이다."
 andersson.62.f: "[ROOT.GetCountry.GetCapital.GetCityHubName] 인류학회 모임에서 [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetFullName] 씨는 [GetPlayer.GetCustom('andersson_fossil_piltdown')] 마을 인근 자갈 채취장에서 찾아낸 초기 인류의 두개골 파편은 획기적인 발견이라 소개하였다. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 씨는 발견된 파편을 바탕으로 복원한 두개골 모형을 통해 현생 인류의 두개골과 거의 유사한 형태라 평가하였는데, 여기서 다만 두개골과 척추가 만나는 후두부와 두뇌의 크기가 현생 인류의 약 3분의 2에 불과할 뿐이며, 치아와 턱뼈 또한 현생 인류와 크게 다르지 않다고 소개하였다. [ROOT.GetCountry.GetAdjectiveNoFormatting] 국립박물관의 드높은 학술적 권위를 등에 업은 [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 씨는 [GetPlayer.GetCustom('andersson_fossil_piltdown')]에서 발견된 유골이 유인원과 인류 사이의 잊혀진 연결 고리라 해석하였다. 처음에는 회의적인 시각도 있었으나, [ROOT.GetCountry.GetCapital.GetCityHubName] 자연사 박물관의 학자들은 해당 유골의 연대를 20만 년에서 50만 년 전으로 추산하였다. 이는 네안데르탈인보다 훨씬 오래된 시점이었다. 이러한 발견 소식이 전해지면서 곧바로 전문가들과 [ROOT.GetCountry.GetAdjectiveNoFormatting] 국민들의 큰 관심을 불러일으켰다. 또한 [GetPlayer.GetCustom('andersson_fossil_piltdown')]인의 발견 소식은 전세계적으로 큰 반향을 일으켰다."
 andersson.63.t: "파란트로푸스"
 andersson.63.d: "트란스발에서 현장 학습을 진행하던 [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사에게 어느 남학생이 조사해볼 것이 생겼다며 화석 몇 점을 건넸다. 인류학자는 곧바로 그 학생에게 화석이 어디서 났느냐고 물었다. 현장에 도착한 박사는 놀라운 발견을 해내고 말았다. 지금껏 전혀 알려지지 않았던 종, 어쩌면 인류의 조상은 아니더라도 아주 먼 친척일지도 모르는 종을 발견한 것이다."
 andersson.63.f: "파란트로푸스는 멸종된 원시 인류의 한 속으로, 두 개의 종이 널리 인정받고 있다. 하나는 파란트로푸스 로부스투스(P. robustus), 다른 하나는 파란트로푸스 보이세이(P. boisei)다. 그러나 파란트로푸스라는 범주의 타당성은 논란의 여지가 있으며, 간혹 오스트랄로피테쿠스와 동일시되기도 한다. 이들은 약 290만년 전에서 120만년 전 사이, 플라이오세 말기부터 플라이스토세 중기에 걸쳐 존재하였다. 파란트로푸스는 튼튼한 두개골과 정중선을 따라 나 있는 고릴라와 유사한 시상능선이 특징인데, 씹기근육(저작근)이 강하게 발달했음을 시사하며 널찍한 초식성 치아로 먹이를 씹은 것으로 추정된다. 이들은 뼈로 만든 도구를 사용하였으며, 인류 최초로 불을 사용한 시기로 여겨지기도 한다. 파란트로푸스는 주로 삼림지대에 서식하였으며 오스트랄로피테쿠스 아프리카누스, 호모 하빌리스, 호모 에렉투스와 같은 초창기 인류 종들과 공존하였다."
 andersson.63.g: "이런 성과라면 박사가 얼마든지 현장에 나설 수 있어야겠군."
 andersson_add_piltdown_fossil_effect_tt: "@andersson_human_fossil! [Concept('concept_andersson_human_fossil','$concept_andersson_special_human_fossil$')] #G 1점#! 획득 ([GetPlayer.GetCustom('andersson_fossil_piltdown')]인)"
 andersson_add_paranthropus_fossil_effect_tt: "@andersson_human_fossil! [Concept('concept_andersson_human_fossil','$concept_andersson_special_human_fossil$')] #G 1점#! 획득 (파란트로푸스)"
 andersson.202.a: "원시 인류 탐색: 목적지"
 andersson.202.d: "원시 인류 탐사는 고고학 탐사나 태평양 탐사만큼 모험적이지는 않을 수 있어도 나름 고된 도전이 될 수 있다. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사는 인류 유골을 상세히 조사하기 위한 준비를 이미 마쳤다. 남은 것은 하나, 우리 탐사단이 수색에 나서야 할 지역은 어디일까?"
 andersson.202.f: "신사 여러분, 우리는 인류의 기원을 향한 흥미로운 여정을 시작합니다! 과학적 호기심과 열정적인 탐구심, 흔들림 없는 규율을 갖추시기를 기대하겠습니다.\n\n추신: 반려견은 집에 두고 오세요. 샤베르나크 교수님도 마찬가지입니다!\n\n서명: [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetFullName]"
