 andersson.801.t: "호모 사피엔스"
 andersson.801.d: "[GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사가 네오안트로푸스라 칭하던 여러 유형을 둘러싼 혼란을 바로잡고, 그것에 속하던 종들을 모두 호모 사피엔스라는 하나의 유형의 변종으로 정리하기에 이르렀다."
 andersson.801.f: "네오안트로푸스(신인류)에서 호모 사피엔스로 범주가 바뀐 것은 20세기 고인류학에서 중요한 전환점에 해당된다. 1920년대부터 1950년대까지 널리 사용된 네오안트로푸스는 네안데르탈인 등의 원시 혈통과 현생 인류를 구분하기 위한 유형 범주에 해당되었다. 또 지금은 사용되지 않는 '선사피엔스 이론'의 핵심으로 자리한 용어이기도 하였다. 1950년대 현대종합이론 시대에는 진화생물학자들, 그 중에서도 에른스트 마이어는 엄격한 게체군 기반의 분류체계를 주장하였다. 이들은 속명의 중복 남용을 비판하며 1758년 린네가 명명하였던 호모 사피엔스로 돌아갈 것을 강력 주장하였다. 이러한 재분류 과정은 경직된 형태학적 '유형'을 통일된 생물학적 종 개념으로 대체하였다. 결과적으로 네오안트로푸스라는 용어는 폐기되고, 온 현생 인류는 진화적 연속성을 강조하는 단일 분류군으로 합쳐지게 되었다."
 andersson.801.g: "인류학이 무르익어 가고 있군."
 andersson.802.t: "호모 네안데르탈렌시스"
 andersson.802.d: "[GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사가 팔라에오안트로푸스라 칭하던 여러 유형을 둘러싼 혼란을 바로잡고, 그것에 속하던 종들을 모두 호모 네안데르탈렌시스라는 하나의 유형의 변종으로 정리하기에 이르렀다."
 andersson.802.f: "팔라에오안트로푸스(고인류)에서 호모 네안데르탈렌시스로 범주가 바뀐 것은 20세기 중반 인류 분류법의 정립을 보여주는 사례다. 원래 팔라에오안트로푸스는 주로 네안데르탈인을 비롯한 원시 인류를 광범위하게 아우르는 범주로서 현생인류와의 구분을 위해 쓰인 용어였다. 이러한 용어는 원시 인류를 별개의 선형적 진화 단계로 보았던 20세기 초의 유형론적 사고방식을 반영한 것이었다. 1940년대~1950년대에 이르러 현대종합이론에 들어서면서 에른스트 마이어 등의 학자들은 인간속(호모) 아래 분류 체계를 통일하자고 주장하고 나섰다. 모호하게 쓰이던 팔라에오안트로푸스라는 명칭은 호모 네안데르탈렌시스(또는 호모 사피엔스 네안데르탈렌시스)로 대체하였고, 네안데르탈인은 별개의 '원시'적인 유형이 아닌 하나의 생물학적 집단으로 취급되기에 이른 것이다. 이러한 변화는 진화적 연속성을 강조하고, 네안데르탈인을 현생 인류의 자매로서 특화된 계통으로 인식하는 오늘날의 분류 체계를 확립하였다."
 andersson.803.t: "호모 에렉투스"
 andersson.803.d: "[GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사가 피테칸트로푸스라 칭하던 여러 유형을 둘러싼 혼란을 바로잡고, 그것에 속하던 종들을 모두 호모 에렉투스라는 하나의 유형의 변종으로 정리하기에 이르렀다."
 andersson.803.f: "피테칸트로푸스에서 호모 에렉투스로 범주가 바뀐 것은 다양한 지역에서 발견되는 화석들이 전지구적인 하나의 종으로 통일되었음을 보여준 사례였다. 1891년 외젠 뒤부아가 '자바인'을 처음 발견하면서 사용한 피테칸트로푸스라는 명칭은 영장류와 현생 인류 사이의 '잃어버린 고리'를 지칭하기 위한 것이었다. 20세기 초에는 시난트로푸스(베이징 원인)와 같은 다양한 명칭으로 원시 인류의 분류를 더욱 복잡하게 만들었다. 결정적인 변화는 1950년대 에른스트 마이어가 주도한 현대종합이론 시대에 벌어졌다. 마이어는 아시아와 아프리카 화석 표본 간의 해부학적 변이가 속의 차이가 아니라 개체군 수준의 차이임을 주장하였다. 이러한 화석들을 호모 에렉투스로 다시 분류함으로서 학계에서는 유형학적 연결고리 찾기에서 벗어나, 인간속 내에 널리 분포하고 적응력도 뛰어난 조상이 존재했다는, 생물학적 종 개념으로의 통일로 나아갔던 것이다."
