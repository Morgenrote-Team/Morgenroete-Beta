 andersson.601.t_neolithic: "신석기 시대"
 andersson.601.t_mesolithic: "중석기 시대"
 andersson.601.t_upper_paleolithic: "후기 구석기"
 andersson.601.d: "[GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사가 선사시대의 생활을 생생하게 재현하는 모든 작업을 마쳤다. 학생들과 교수진 뿐만 아니라 이에 관심 있는 일반 시민들도 조각들을 관람하며 태초의 생활상을 엿보고 있다."
 andersson.601.f_neolithic: "신석기 시대는 인류 생활에 있어 근본적인 변화를 불러일으킨 시대로, 유목 생활에서 농업 정착으로 전환된 것이 특징이다. 이 시기 인류는 동식물을 체계적으로 기르기 시작하였고 이를 통해 보다 안정적인 식량 공급을 확보하게 되었다. 또한 목재와 석재, 진흙 벽돌 등으로 내구성이 뛰어난 주거지를 건설하면서 영구적인 정착촌을 마련할 수 있었다. 식량 생산에 여유가 생기면서 인구 증가가 가능해졌고, 도예나 직조처럼 전문 노동의 발달을 촉진하였다. 기술적으로는 석기를 연마해 사용한 것과 사회계층 구조가 발달한 것이 이 시대의 특징이다."
 andersson.601.f_mesolithic: "중석기 시대는 구석기와 신석기 사이의 과도기에 해당되는 시대다. 마지막 빙하기 이후 시작되었으며 기후 온난화와 빙하의 후퇴가 특징으로, 인류가 변화하는 생테계에 적응해야 했던 시기이기도 하다. 조상들과는 달리 중석기 시대 인류는 미세석기, 즉 작고 정교한 부싯돌의 날을 이용하여 뾰족한 창이나 화살처럼 복잡한 도구를 만들었다. 여전히 유목 생활을 하는 인구가 대다수였으나, 생선과 사냥감, 야생 식물이 풍부해지면서 계절에 따른 안정적인 생활이 가능해졌고, 임시 거점을 마련하여 거주하기도 하였다."
 andersson.601.f_upper_paleolithic: "구석기 시대 후기 (석기 시대 후기)는 구석기 시대의 마지막 단계로 인류의 창의성과 인지복잡성이 폭발적으로 증가한 시대다. 구석기 시대 후기에 호모 사피엔스는 날붙이를 이용한 고도의 전문 기술, 즉 부싯돌과 뼈, 뿔 등을 이용하여 정교한 도구를 제작하는 기술을 발전시켰다. 이 시기 인류는 순록이나 매머드처럼 대규모로 이동하는 동물떼를 따라 광활한 툰드라를 누비며 유목 생활을 하는 수렵 채집인에 해당되었다. 생존이란 측면 외에도 구상 미술과 상징 표현이 탄생했다는 점에서 제일 주목할 만하다. 복잡한 동굴 벽화, 정교한 장신구, 그리고 유명한 '비너스 조각상'도 이 시기에 제작되었는데, 복잡한 언어와 정신적 신념이 발달하였음을 시사한다."
 andersson.601.g: "참으로 아름답군!"
 andersson.64.t: "클로비스 석기"
 andersson.64.d: "뉴멕시코의 클로비스에서 [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사가 지금까지 발견된 아메리카 원주민의 가장 오래된 흔적을 발견하였다. 북아메리카 대륙에서 출토되어 학계에 보고된 그 어떤 유물보다도 훨씬 오래된 창촉이 발견된 것이다."
 andersson.64.f: "20세기 초 클로비스 창촉의 발견은 미국 고고학계와 인류학계에 파란을 일으켰다. 클로비스 창촉이란 독특한 형태에 홈이 파인 석재 창촉으로, 1920년대 말에서 1930년대 초 미국 뉴멕시코주 클로비스 인근에서 처음 발견되어 이름이 붙여졌다. 클로비스 창촉은 플라이스토세의 멸종된 거대 동물, 특히 매머드의 유해와 함께 발견되면서 획기적인 발견으로 일컬어진다. 이때의 발견은 수십 년 간 '클로비스 발원설'의 토대가 되었는데, 클로비스인들이 약 13,000년 전 아메리카 대륙에 처음 발을 들인 인류였다는 주장이다."
 andersson.64.g: "그렇다면 인류가 기존에 생각했던 것보다 아메리카 대륙에 1만 년 넘게 더 오래 거주했다는 거군!"
 andersson.65.t: "용인"
 andersson.65.d: "하얼빈의 교량 축조 공사 과정에서 어느 인부가 특이하게 생긴 두개골을 발견하였다. [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사는 연락을 받고 즉시 두개골 조사에 나섰다. 네안데르탈인 외에 다른 원시 인류가 중원에 살고 있었던 것인가?"
 andersson.65.f: "중국 하얼빈에서 발견된 일명 '용인'(龍人) 두개골 화석은 호모 롱기(Homo longi)라는 학명이 붙여져 있다. 두개골 자체는 1933년에 처음 발견되었으나 2021년에 이르러서야 학계의 주목을 받게 되었다. 최소 14만 6천 년 전 중기 플라이스토세까지 거슬러 올라가는 이 화석은 원시적인 면과 진화된 면이 독특한 방식으로 혼재되어 나타나고 있다. 뇌두개골이 거대하고, 눈썹뼈가 두터우며, 눈구멍이 거의 정사각형에 가깝다는 특징이 존재하는 호모 롱기는 신체적으로 몹시 강건했다고 볼 수 있다. 학계 일각에서는 해당 계통이 네안데르탈인보다 현생 인류(호모 사피엔스)에 더욱 가깝다고 주장한다. 오늘날 대다수 학자들은 용인 화석이 데니소바인에 속한 것으로 보고 있다."
 andersson.65.g: "용인이라고? 얼마나 용하기에?"
 andersson.66.t: "호모 플로레시엔시스"
 andersson.66.d: "플로레스섬으로 현장 조사를 떠난 [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사가 불가능할 것으로 여겨졌던 발견을 이루어내고 말았다. 이 섬에 난쟁이 같은 별개의 인류 종이 살았을 가능성을 제기하는 화석을 발견하게 된 것이다!"
 andersson.66.f: "2003년 인도네시아 플로레스섬 리앙부아 동굴에서 발견된 호모 플로레시엔시스는 약 50,000년 전까지 존재했던 작은 체격의 멸종한 원시 인류이다. 직립시 키가 1.1m에 불과하고 두뇌 크기는 400제곱센티미터에 달해 '호빗'이라는 별명이 붙었다. 학계에서는 작은 체구가 섬 내에서의 왜소화 현상이 벌어진 결과라고 본다. 고립된 섬에 서식하는 종은 자원의 제약으로 인해 왜소해지는 쪽으로 진화하는 과정인 것이다. 두뇌가 작았음에도 정교한 석기를 사용하였고 피그미코끼리를 사냥하였다. 인류 계통도에서 이들의 정확한 위치는 여전히 논란의 여지가 남아 있으며, 호모 에렉투스와 결부짓거나 그보다 더 원시적인 조상과 연계하려는 이론이 존재한다."
 andersson.66.g: "그 원시인이 혹시 굴 속에 살고, 허브를 피우고, 북슬한 발을 갖고 있진 않았던가?"
 je_andersson_craniometry: "두개측정"
 je_andersson_craniometry_reason: "[GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사가 수개월에 걸쳐 무수한 두개골을 측정하는 데 전념하였다. 우리는 이런 연구가 틀림없이 정상적이고 과학적인 행동이며 그로부터 전혀 엉뚱한 생각이 나올 리는 없다는 확신을 갖고 있다."
 je_andersson_craniometry_goal: "인류학자가 1년 간의 연구를 거쳐 두개측정 연구를 마침"
 andersson.701.t: "두개골 측정 완료"
 andersson.701.d: "[GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사가 충분한 휴식을 거쳐 몇달 동안 수백 개의 두개골을 측정, 분류, 기록하고 비교하여, 장차 본인의 인류학 연구를 위한 결론을 도출하기에 이르렀다. 참으로 뿌듯한 심정이다!"
 andersson.701.f: "19세기 동안 두개골을 과학적으로 측정하는 두개측정은 인간 변이를 분류하는 주요 연구수단으로 자리잡았다. 새뮤얼 모턴이나 폴 브로카 등의 학자들은 두개골의 용량과 형태가 지능과 도덕성, 진화적 지위와 직결되는 지표라고 보았다. 안데르스 레치우스가 개발한 '두개지수'는 '미개'한 집단과 '진화'한 집단을 구분하는 데 사용되었다. 두개측정은 인종 정책을 정당화하는 데 악용되기도 하였으나, 수많은 연구 결과로 하여금 인류 화석 연구에 유용하게 활용되었다."
 andersson.701.g: "그건 좀 기괴한걸."
 andersson.711.t: "단일기원이냐 다중기원이냐"
 andersson.711.d: "[GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사는 두개골 조사 과정에서 우연의 일치라 볼 수는 없는 상관 관계를 거듭해서 관찰해냈다. 인류는 동일한 기원을 지니지 않는다는 것이 분명해진 것이다."
 andersson.711.f: "단일기원설과 다중기원설을 놓고 벌어진 논쟁은 19세기 인류의 기원에 관한 인류학계의 핵심적인 갈등이었다. 단일기원설을 지지한 학자들은 인류의 단일 기원을 주장하며, 주로 성경의 창조론이나 후대의 진화론에 기반한 공통조상설을 근거로 들었다. 이들은 환경적 요인이 인구 집단 간의 신체적 변이를 야기한다고 보았다. 반면 다중기원설을 지지한 학자들은 인류가 각기 다른 기원을 지닌 별개의 여러 종에 걸쳐 있다고 주장하였다. 이러한 견해는 초창기 두개골 계측 자료를 통해 '고정'된 생물학적 계층구조를 주장하는데 널리 이용되었다."
 andersson.711.g: "두개골의 계측검사 결과는 의심의 여지가 없소!"
 andersson.711.h: "[GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 씨가 실수한 게 분명해. 인류의 기원은 분명 하나다."
 andersson.712.t: "진화론이냐 전파론이냐"
 andersson.712.d: "고대 이집트와 로마, 아메리카 원주민의 두개골을 조사하던 [GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사는 스스로 이러한 질문을 거듭 던지게 되었다. 모든 기술 발전을 전파하는 혁신의 중심지로서 우월한 문화가 존재하였는가, 아니면 모든 문화가 야만에서 문명으로 나아가는 단계를 거쳐야 했고 수많은 인구 집단이 단지 석기 시대 수준에 머물렀던 것인가에 관한 질문이다."
 andersson.712.f: "진화론자들은 단선적 진화론을 주장하였다. 이들은 모든 사회가 보편적인 인간심리와 별개의 발전을 통해 '야만'에서 '문명'에 이르는 동일한 단계를 거쳐 발전한다고 믿었다. 반대로 전파론자들은 이러한 내적 진화에 의문을 제기하였다. 이들은 중요한 문화적 특성과 기술이 두 번 발명되는 경우는 드물다고 주장하였다. 대신 기술과 발상이라는 것은 특정한 '문화 중심지'에서 발생하여 이주와 무역, 정복을 통해 전세계로 퍼져나간다고 주장하였다."
 andersson.712.g: "모든 문화는 석기 시대에서 근대로의 전환기를 거친다."
 andersson.712.h: "특정 문화에서는 기술 발전이 동심원처럼 퍼져나가기도 했다."
