 andersson_evolutionist: "진화론자"
 andersson_evolutionist_desc: "진화론자는 각 문화가 별개의 발전을 통해 진화해 왔다고 보는 인류학자입니다."
 andersson_diffusionist: "전파론자"
 andersson_diffusionist_desc: "전파론자는 문화라는 것이 주로 여러 사회 간의 지식 전파를 통해 형성되어 왔다는 학설을 따르는 인류학자입니다."
 country_andersson_decorative_evolutionist_add: "동굴학으로 얻는 @andersson_human_fossil! [concept_andersson_human_fossil]"
 country_andersson_decorative_diffusionist_add: "동굴학으로 얻는 @andersson_prehistoric_artifact! [concept_andersson_prehistoric_artifact]"
 andersson.401.t: "사냥장"
 andersson.401.d: "동굴 조사에 나선 [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사가 [SCOPE.sState('andersson_state_scope').GetName]에서 사냥장으로 추정되는 유적을 발견하였다. 그 사용 연대는 중석기 시대로 거슬러 올라가는 것으로 보인다."
 andersson.401.f: "간단한 수색 끝에 인류학자는 선사시대 유물을 다량 확보할 수 잇었다. 여기에는 창과 화살촉 뿐만 아니라 손도끼도 포함되었는데 그 제작 연대가 신석기 시대로 거슬러 올라가는 것으로 추정되었다. 심층 조사는 대학으로 돌아가면 진행될 예정이다."
 andersson.401.g: "이것으로 지난 과거를 새롭게 엿볼 수 있게 되었군."
 andersson.402.t: "토기"
 andersson.402.d: "[SCOPE.sState('andersson_state_scope').GetName]에서 인류학자와 고고학자가 합동 조사에 나서 토기 몇 점을 출토해낼 수 있었다. 박물관 소장품으로 삼기에 부족함이 없어 보인다."
 andersson.402.f: "인류학자들이 발견한 토기들은 수만 년이나 된 것이라는 사실을 모른다면 원시적인 것이라 볼 수도 있겠다. 그런 관점에서는 오히려 대단히 정교해 보이는 유물이다. 전문가들은 벌써부터 토기에서 물감 흔적을 찾아내는 조사에 들어갔다."
 andersson.402.g: "조심히 다루시오!"
 andersson.403.t: "신석기 마을"
 andersson.403.d: "[SCOPE.sState('andersson_state_scope').GetName] 지역의 고고학 발굴단이 좋은 소식을 전해왔다. 신석기 시대의 정착지 유적을 운 좋게 발견했다는 소식이다. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사는 그 시대에 대한 여러 유물과 새로운 지식을 얻을 수 있을 것이라 확신하였다."
 andersson.403.f: "알고보니 해당 유적지에는 이미 목책 같은 울타리를 둘렀고, 우물과 마구간, 곡물 창고도 발견되었다. 이는 국내에서 기록된 곳 가운데 가장 오래된 정착지일 가능성이 생겨나게 되었다."
 andersson.403.g: "학계의 대사건이로군!"
 andersson.404.t: "인간 뼈"
 andersson.404.d: "[ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사가 새로운 유골 몇 점을 발견했다."
 andersson.404.f: "[ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사가 이끄는 인류학자 조사단이 어느 매장지에서 수천년 된 유골을 발견하였다. 그 가운데 보존 상태가 놀라운 유골도 있었다."
 andersson.404.g: "이번엔 국 끓여 먹은 뼈마냥 실망스럽지 않은 결과가 나왔으면 좋겠군."
 andersson.406.t: "선사시대 뼈 피리"
 andersson.406.d: "[SCOPE.sState('andersson_state_scope').GetName]의 어느 동굴에서 등산객이 이상한 뼈를 발견하였다. 현지 대학의 연락을 거쳐 [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사가 동굴로 파견되었다. 그곳에서 박사는 문제의 뼈를 찾아냈는데 그것은 그냥 뼈가 아니라 선사시대의 뼈 피리였다!"
 andersson.406.f: "\"뼈 피리의 맑고 높은 소리는 천사의 음성과도 같아서, 모두를 신비롭게 매혹시키는 듯했다.\""
 andersson.406.g: "지금도 연주가 가능한가?"
 andersson.408.t: "뼈와 석기 출토"
 andersson.408.d: "[SCOPE.sState('andersson_state_scope').GetName]에서 석기와 뼈가 다량으로 출토되어 [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사가 조사를 위해 급히 파견되었다. 그곳에서 상당량의 뼈를 발견하였는데 온갖 생물의 뼈는 물론 석기 유물도 몇 점 찾아낼 수 있었다."
 andersson.408.f: "\"이건 아무래도 사슴 뼈 같군. 아니면 인골인가? 아니면 공룡뼈일지도? 상어인가? 거대 원숭이인가? 뼈는 내 전공 분야가 아니라서 말이지...\""
 andersson.408.g: "가만, 이 뼈는 누구의 것이오? 현생 인류? 선사 인류? 공룡?"
 andersson.409.t: "선사시대 비너스상 발견"
 andersson.409.d: "석기 시대의 조각상이 [SCOPE.sState('andersson_state_scope').GetStateRegion.GetMineHubName]에서 발견되었다. 상아를 깎아 만든 이 조그마한 조각상의 외형에 많은 사람들이 탐탁찮아하고 있는데 엉덩이와 가슴이 지나치게 부풀려져 있기 때문이다. [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사는 이 조각상이 여신을 형상화한 것인지, 아니면 단순한 부적인지 아직 확신하지 못하고 있다."
 andersson.409.f: "비너스 조각상은 구석기 시대 후기, 특히 그라베티안기 (기원전 30,000년~22,000년경)에 제작된 조그마한 선사시대 여인상이다. 유럽 전역과 시베리아에서 발견되는 이 조각상은 일반적으로 석재와 상아, 뼈를 조각하거나 점토를 빚는 식으로 제작되었다. 대부분의 조각상이 가슴과 엉덩이, 복부를 과장하여 묘사하고 있으며, 얼굴의 세부묘사는 없는 경우가 많다. 유명한 사례로는 빌렌도르프의 비너스와 돌니 베스토니체의 비너스가 있다. 비너스 조각상의 용도는 여전히 논란이 분분하며, 다산의 상징, 의례용 도구, 자아의 표현, 사회적 정체성의 표현 등 다양한 해석이 제기되고 있다. 비너스 조각상은 초창기 상징 미술의 대표 사례로 평가받고 있다."
 andersson.409.g: "그런 조각상이라면 [SCOPE.sState('andersson_state_scope').GetStateRegion.GetMineHubName] 비너스상으로 알려지게 되겠군."
