 andersson.10.t: "인류학·민족학 연구소"
 andersson.10.d: "오늘 개소식과 함께 [SCOPE.sCharacter('andersson_ruler').GetFullName] [SCOPE.sCharacter('andersson_ruler').GetPrimaryRoleTitle]가 인류학·민족학 연구소의 문을 열었다."
 andersson.10.f: "개소식은 엄숙하면서도 널리 환영받는 행사였으며, 언론가와 전문가, 대중의 호의를 받았으나 비판의 목소리도 없지 않았다. 수집욕에 사로잡힌 사람들이 별다른 가치도 없는 진기한 물건들을 전시하는 건물이 또 하나 생긴 것은 아닌지 하는 의문이다. 어느 야당 계열의 신문에서는 예산 낭비이자 사무적인 전시에 그쳤다고 목소리를 높였다. 정부가 새로운 것을 선보이지 못한다는 비판이었다. 어디서는 유물을 수집하고, 어디서는 약초를 수집하고, 또 어디서는 공룡에 집착하는데, 이제는 사람의 뼈까지 모은다니! 다행히 이런 부정적인 여론은 소수에 불과했고, 새 연구소를 향한 열기는 식지 않았다. [SCOPE.sCharacter('andersson_ruler').GetFullName] [SCOPE.sCharacter('andersson_ruler').GetPrimaryRoleTitle]는 그 중요성을 다시금 역설하였다."
 andersson.10.g: "연구소를 방문하겠다."
 andersson.21.t: "베로인"
 andersson.21.d: "엘라이어스 셀라즈가 플로리다에서 태고의 유골을 발견하여 전국적으로 화제를 불러모았다."
 andersson.21.f: "베로인은 지질학자 엘라이어스 셀라즈가 1915년~1916년 미국 플로리다주 베로 비치에서 발견한 플라이스토세의 대표적인 인류 유골을 가리킨다. 이 유골이 발견될 당시 빙하기의 거대 멸종 동물의 화석과 같은 지층에서 발견되어 거센 논란을 불러일으켰는데, 인류가 아메리카 대륙에 도달한 시점은 훨씬 나중의 일이라는 기존의 과학적 통념에 도전하는 것이었기 때문이다. 최신 탄소연대 측정법과 발전된 코코학 기법을 동원하여 해당 부지가 북아메리카에서 가장 오래된 인류 거주지이며 그 연대는 약 13,000여년 전으로 거슬러 올라가는 사례인 것으로 확인되었다."
 andersson.21.g: "흥미롭군."
 andersson.22.t: "라고아산타인"
 andersson.22.d: "덴마크의 학자가 브라질 동굴에서 놀라운 발견을 해냈다."
 andersson.22.f: "라고아산타인은 19세기 중반 덴마크의 박물학자 페테르 빌헬름 룬드가 브라질 미나스제라이스주의 석회암 동굴에서 발견한 구석기 시대의 원주민 유골을 가리킨다. 현대 유전학 연구와 고고학 분석을 통해 이 유골이 남아메리카에 인류가 처음으로 정착하던 시기의 것이며 그 연대는 1만 년 전에서 1만 2천 년 전으로 거슬러 올라간다는 배경을 파악해냈다."
 andersson.23.t: "크로마뇽인"
 andersson.23.d: "루이 라르테가 네안데르탈인보다 현생인류에 훨씬 더 유사한 선사시대 인류의 골격 여러 점을 찾아냈다. 이 최초의 유럽인들은 아브리 드 크로마뇽 유적에서 이름을 따와 크로마뇽인으로 불리우게 되었다."
 andersson.23.f: "크로마뇽인은 유럽 후기 구석기 시대의 초창기 현생 인류 (호모 사비엔스)를 가리키는 말로 1868년 지질학자 루이 라르테가 프랑스 레제이지의 암굴에서 발견하였다. 이 유적에서는 석기와 뿔 조각품, 동물 유해와 함께 다섯 구의 유골이 출토되었으며, 이는 플라이스토세의 멸종 동물과 함께 유럽에 현생 인류가 살았다는 최초의 결정적인 증거가 되었다. 이러한 발견은 표본의 연대를 2만 8천년 전에서 3만 년 전으로 추정하고, 과거에 발견된 강인한 체격의 네안데르탈인과 구별하는 등, 인류고생물학이라는 분야를 확립하는 데 중추적인 역할을 하였다."
 andersson.24.t: "보스코프인"
 andersson.24.d: "어느 농장에서 두개골이 발견되어 인부들 사이에서 소동이 일었다. 가장 가까운 연구 부처에 이 사실이 전해졌다."
 andersson.24.f: "보스코프인은 1913년 남아프리카 트란스발 지역의 농장 인부들이 처음 발견한 원시 인류의 화석화된 머리덮개뼈를 가리키는 말로, 뇌수용량이 비정상적으로 크다는 점에서 널리 주목받았다. 20세기 초에는 일부 인류학자들을 중심으로 이 표본을 '호모 카펜시스'라는 별개의 종으로 잘못 분류하고, 이 지역에 현생 인류보다 앞서 '큰 뇌를 가진' 인류가 살았다는 가설을 제시하였다. 이후 고인류학 연구와 더욱 정밀한 연대 측정으로 이러한 주장은 반박되고, 그 지역의 원주민인 코이산족의 조상 계통과 일치하는 현생 인류(호모 사피엔스)에 속하는 것으로 확인되었다."
 andersson.25.t: "산정동인"
 andersson.25.d: "오늘 저우커우뎬 유적지 위쪽의 동굴에서 중원에 처음으로 인간이 정착해 살았음을 시사하는 인류 화석이 발견되었다."
 andersson.25.f: "산정동인(山顶洞人)은 1933년~1934년 중국 베이징 인근 저우커우뎬 유적지의 상부 동굴에서 발견된 초창기 현생 인류 (호모 사피엔스) 화석군을 가리킨다. 페이원중이 이끄는 발굴단이 처음 출토하였으며 이후 프란츠 바이덴라이히가 분석한 이들 화석은 약 3만년 전에서 1만년 전의 것으로 추정된다. 실제 역사에서 산정동인은 유럽의 크로마뇽인에 해당되는 아시아계 인류로 여겨져 왔다. 온전한 두개골 세 점과 여러 뼛조각으로 이루어진 유해가 정교한 도구, 뼈바늘, 구멍 뚫린 치아 장식과 함께 발견되어 발전된 문화를 이루었음을 시사한다. 바이덴라이히는 처음에 이들이 현대 동양인의 직계조상인 '원시 몽골로이드'라 주장하였으나, 오늘날 고인류학계에서는 초창기 인류가 동아시아 전역으로 이동하면서 지역적 특성이 완전히 자리잡기 전까지 다양하고 광범위한 모습을 띄었던 이주 집단의 하나로 보고 있다."
 andersson.26.t: "탈가이인"
 andersson.26.d: "탈가이 역 인근에서 유골이 발견되어 인류의 첫 호주 정착에 대해 완전히 새롭게 조명되고 있다."
 andersson.26.f: "탈가이인은 1884년 오스트레일리아 퀸즐랜드 알로라 인근의 탈가이 역에서 울타리를 설치하던 사람이 발견한 선사시대의 두개골로, 인류가 호주에 정착하게 된 정황을 보여주는 가장 오래된 증거로 남아 있다. 처음에는 다부진 체격과 두터운 광물화 때문에 훨씬 더 오래된 종으로 오인되었으나, 이후 토양 탄산염을 탄소측정법으로 검사한 결과 해당 표본은 약 13,500여년 전의 것으로 판명되었다. 탈가이인의 발견은 호주 원주민의 조상이 거대 멸종 동물과 함께 살았다는 사실을 확인하였으며, 호주 원주민의 깊은 역사를 이해하는 데 중요한 연결고리의 역할을 한다는 점에서 역사적으로 뜻깊은 의미를 지니고 있다."
 andersson.31.t: "네안데르탈인"
 andersson.31.d: "오늘 독일 본 대학의 어느 연구원이 동료 과학자와 함께 멸종한 초창기 인류를 발견하였다는 사실을 일반에 공개하였다."
 andersson.31.f: "1856년 8월 중순, 이탈리아인 채석장 인부들이 네안데르탈 계곡의 석회암 채굴로 무너져 내린 지역에서 뼛조각을 발견하였다. 처음에는 돌무더기에 아무렇게나 방치되어 있던 이 뼛조각들은 채석장의 주인인 빌헬름 베커쇼프와 프리드리히 빌헬름 피퍼의 눈에 띄었고, 이후 그보다 더 큰 뼛조각 16점을 수습하여 요한 카를풀로트에게 감정을 의뢰하였다. 언론 보도로 이 소식을 접한 본 대학의 해부학자 헤르만 샤프하우젠도 유골 조사에 나섰고, 풀로트와 마찬가지로 현생 인류의 옛 모습이라는 결론을 내렸다. 풀로트와 샤프하우젠은 1857년 6월 프로이센 라인란트 자연사학회 총회에서 유골 발견 사실을 공개하였지만, 전문가들은 두 사람의 설명에 생각을 같이하지 않았다. 네안데르탈 1호로 불린 이 유골은 호모 네안데르탈의 모식표본이 되었다."
 andersson.32.t: "지브롤터인"
 andersson.32.d: "에드먼드 플린트 대위가 지브롤터 인근에서 거의 믿어지지 않는 수준의 발견을 이룩했다는 소식이다."
 andersson.32.f: "지브롤터인 (특칭 지브롤터 1호)은 1848년 에드먼드 플린트 대위가 포브스 채석장에서 발견한, 보존 상태가 몹시 뛰어난 성인 여성 두개골을 말한다. 근대 과학을 통해 발견한 최초의 네안데르탈인 화석이기도 하다. 독일 네안데르계곡에서 발견된 유명한 화석보다 8년 앞서 발견된 것이지만, 이 화석도 인류와는 별개의 친척으로서 중요한 화석이라는 사실이 완전히 인식된 것은 '네안데르탈인'이란 이름이 이미 확립된 1860년대에 이르러서였다. 이후 지브롤터와 인근 고르함 동굴에서 이루어진 발굴 조사를 통해 지브롤터가 네안데르탈인의 마지막 서식지 중 하나였으며, 단편적인 증거를 통해 약 2만 8천년~3만 2천년 전까지 이곳에 살아 있었음을 알아낼 수 있었다."
 andersson.33.t: "스피인"
 andersson.33.d: "벨기에 스피 마을 인근을 조사하던 인류학자들이 선사시대의 역사를 그 어느 때보다 확실히 밝혀줄 귀중한 인류학적 발견을 이룩하였다."
 andersson.33.f: "스피인은 1886년 고고학자 마르셀 드 퓌트와 지질학자 막시맹 로에스트가 벨기에 스피(Spy) 인근 베슈 오 로슈 동굴에서 발견한 네안데르탈인 골격 두 점을 말한다. 보존 상태가 완벽에 가까웠던 이 두 골격의 발견으로 고인류학에 획기적인 전환점을 불러일으켰는데, 무엇보다도 무스티에 석기와 멸종한 빙하기 포유류와 함께 발견되어 네안데르탈인이 현생 인류의 변종이 아닌 옛 선사시대의 인류였음을 명확히 하였기 때문이다. 견고한 체격과 눈썹뼈가 두드러진 것이 특징인 스피 화석은 약 36,000년에서 40,000년 전으로 추정되는 후기 유럽 네안데르탈인의 해부학적 구조와 행동방식을 이해하는데 있어 최고의 표본으로 평가받고 있다."
 andersson.34.t: "크라피나인"
 andersson.34.d: "크라피나 인근에서 조사하던 연구원들이 발칸 반도 전체의 역사를 뒤바꿀 만한 선사시대 인류 화석을 대량으로 발견하였다."
 andersson.34.f: "크라피나인은 1899년부터 1905년까지 크로아티아 후슈나코보 언덕의 바위그늘에서 고생물학자 드라구틴 고랴노비치-크람베르게르가 발견한 네안데르탈인 화석 파편을 말한다. 그 개수만 약 800여점으로 상당한 수준인데, 고르야노비치-크람베르게르는 층위분석과 X선 촬영술을 처음으로 활용하여 화석의 연대를 입증하고 네안데르탈인이 인류 진화사와 직결된다는 것을 밝혀내었는데, 이는 당시로서는 획기적인 발견이었다. 형성연대가 12만 년 전에서 13만 년 전으로 추정되는 이 유적지는 지금까지도 세계에서 가장 크고 중요한 네안데르탈인 유적지로 남아 있으며, 네안데르탈인의 신체적 다양성과 건강 상태, 의례적 행동을 벌였을 가능성에 관한 흔적이 다량으로 남아 있다."
 andersson.35.t: "갈릴리인"
 andersson.35.d: "이스라엘 성지가 인류의 가장 오래된 요람으로 등극했다는 소식이 국제 학계에 전해지면서 충격을 일으켰다."
 andersson.35.f: "갈릴리인은 1925년 프랑시스 투르빌페트르가 오늘날 이스라엘에 위치한 무가렛 엘주티예 동굴에서 발견한 두개골 파편의 일부로, 그 중에서도 전두골 부위가 '주티예 두개골'이라는 이름으로 널리 알려져 있다. 갈릴리인은 서아시아에서 발견된 최초의 인류 화석으로, 진화 과정의 과도기에서 발생하는 독특한 특징 탓에 처음에는 네안데르탈인이냐 초창기 현생 인류냐를 놓고 논란이 일었다. 오늘날 고인류학계에서는 약 20만 년에서 35만 년 전의 것으로 추정하고 있으며, 후기 호모 하이델게르겐시스, 즉 네안데르탈인과 호모 사피엔스의 조상집단으로 분류하는 것이 정설이다."
 andersson.41.t: "하이델베르크인"
 andersson.41.d: "하이델베르크 인근을 조사하던 연구원들이 역사상 가장 오래된 '독일인'으로 보이는 유골을 찾아냈다."
 andersson.41.f: "하이델베르크인은 호모 하이델베르겐시스 종을 일컫는 용어로, 1907년 다니엘 하르트만이 독일 마우어 인근의 자갈채취장에서 발견한 하악골 화석을 기준으로 정의되고 있다. 해당 표본은 약 60만 년 전의 것으로 마우어 1호 하악골이라는 명칭으로도 알려져 있는데, 거대하고 견고한 구조와 떨어져 나간 턱이 특징이지만, 현생 인류와 매우 유사한 치아를 지니고 있다. 오늘날 하이델베르델인은 중기 플라이스토세를 살아갔던 현생 인류의 중추적인 조상으로 널리 인정받고 있으며, 유럽의 네안데르탈인과 아프리카의 호모 사피엔스의 공통 조상으로 여겨지고 있다."
 andersson.42.t: "로디지아인"
 andersson.42.d: "스위스에서 온 광부 톰 츠비글라가 아프리카에서 지금껏 가장 중대한 인류학적 발견을 우연히 이룩했다는 소식이다."
 andersson.42.f: "로디지아인은 1921년 스위스 출신 광부 톰 츠비글라가 북로디지아(지금의 잠비아 카브웨)의 브로큰 힐 납아연 광산에서 발견한 두개골 화석을 말한다. 거의 완벽한 보존 상태를 이루고 있는 로디지아인은 공식적으로는 카브웨 1호라는 명칭으로 분류되며, 아프리카에서 발견된 최초의 주요 인류 화석이다. 큼직한 눈썹뼈처럼 원시적인 특징과 후대에 필적하는 크기의 두뇌를 함께 지니고 있는 것이 특징이다. 최근 정밀 연대 측정을 진행한 결과, 두개골의 연대는 약 29만 9천 년 전의 것으로 추산되며, 호모 하이델베르겐시스 (내지는 호모 로데지엔시스)로 분류된다. 시대적으로는 초창기 호모 사피엔스와 동시대에 살았던 후기 생존자일 가능성이 높다."
 andersson.43.t: "베이징인"
 andersson.43.d: "베이징 인근에서 원시 인류의 화석이 새로 발견되어 인류가 아시아에서 기원했다는 이론에 힘을 더했다."
 andersson.43.f: "베이징인은 1920년대 중국 베이징 도심에서 남서쪽으로 40km 떨어진 저우커우뎬 인근에서 발견된 사람속 화석을 말한다. 1927년 데이비슨 블랙은 단 하나의 치아 화석을 근거로 해당 화석을 새로운 종으로 판명하고 속명도 '시난트로푸스 페키넨시스 블랙 / 즈단스키'(Sinanthropus pekinensis Black & Zdansky)로 명명하였다. 1940년 윌프리드 르 그로스 클라크는 수십 점의 화석을 바탕으로 해당 화석이 자바인과 밀접한 연관성이 존재한다고 보고, 1892년 외젠 뒤부아가 처음 명명한 피테칸트로푸스 에렉투스(Pithecanthropus erectus)로 다시 분류하였다. 원래의 화석은 제2차 세계 대전 당시 소실되어 지금은 복제품만 남아 있다."
 andersson.44.t: "자바인"
 andersson.44.d: "네덜란드 동인도 회사의 영토에서 의사이자 해부학자로 활동하는 외젠 뒤부아가 선사시대 인류 조상의 유골 화석을 발견하였다는 소식에 학계 내에서 흥분과 논쟁이 벌어지고 있다."
 andersson.44.f: "1891년 외젠 뒤부아가 자바 동부 트리닐 인근의 솔로 강변에서 처음 발견한 화석을 자바인이라 부른다. 현재까지 알려진 바에 따르면 이 화석은 약 100만 년 전의 것으로 추정된다. 유럽 이외의 지역에서 발견된 최초의 영장류 화석이며, 네안데르탈인에 이어 해부학적으로 현생 인류, 즉 호모 사피엔스의 친척 관계에 있는 두번째 화석 증거로 남았다. 자바에서 발견된 화석은 처음에는 안트로포피테쿠스, 나중에는 피테칸트로푸스 에렉투스로 불렸다. 오늘날 고인류학계에서는 이 화석을 호모 에렉투스로 분류하는 학자가 대부분이며, 1940년 프란츠 바이덴라이히의 제안처럼 아종 명칭인 '호모 에렉투스 자바넨시스'로 칭하여 그 기원을 강조하기도 한다. 뒤부아의 발견 이래 50년이 넘은 뒤 인류학자 랄프 폰 쾨니히스발트는 \"이처럼 거대한 충격을 불러일으키고 다양한 과학적 견해가 대립했던 적은 그 어떤 고생물학계의 발견도 뛰어넘을 수 없었던 순간\"이라 회상하였다."
 andersson.51.t: "타웅 아이"
 andersson.51.d: "호주의 레이먼드 다트가 남아프리카의 타웅에서 엄청난 발견을 해냈다. 유인원처럼 생긴 어린아이의 두개골이 직립보행을 하였다는 사실이 밝혀진 것이다. 치아와 두뇌 또한 선인류의 것으로 보인다. 타웅 아이는 인류와 여타 영장류 간의 '잃어버린 고리'인 것인가."
 andersson.51.f: "타웅 아이는 1924년 남아프리카 타웅의 석회 채석장에서 채석공들이 발견한 뒤, 해부학자 레이먼드 다트가 기록으로 남긴 어린아이의 두개골 화석을 말한다. 해당 표본은 오스트랄로피테쿠스 아프리카누스 종의 모식화석이 되었으며, 아프리카에서 발견된 이종보행 인류 조상에게 '유인원'이라는 명칭이 학술적으로 부여된 첫 사례로 남았다. 당시 학계에서는 인류의 기원이 아시아나 유럽이라 확신하고 있었기에, 발견 소식에 처음에는 회의적인 반응을 보였으나, 화석의 연대가 약 280만 년 전의 것으로 추산되면서 결국 고인류학계의 관심을 아프리카로 돌리게 되었다."
 andersson.101.t: "선사시대 동굴 발견"
 andersson.101.d: "[SCOPE.sCharacter('andersson_anthropologist_scope').GetFullName](은)는 원시인이나 인류의 조상의 유골이 있을 것으로 추정되는 동굴의 입구를 오랜 수색 끝에 발견해냈다."
 andersson.101.f: "선사시대 동굴은 인류학, 고고학적 환경을 알아낼 수 있을 뿐만 아니라 인류나 선인류의 화석을 발견할 수도 있다. 조사를 위해서는 인류학자가 탐사대장으로 나서 발견 사항들을 평가하여야 한다. 이러한 연구는 인류 기원의 규명 과정에 중요한 단서를 남길 수 있다."
 andersson.101.g: "이 동굴은 가급적 빨리 조사해 보는 것이 좋겠군."
 andersson.201.t: "원시 인류 탐색: 유형"
 andersson.201.d: "[ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사가 [GetPlayer.GetName] 내에서 인류 화석을 탐색해 보자는 멋진 발상, 적어도 성공에 이를 만한 훌륭한 계획을 학계에 제시하였다. 이제 모든 선택지는 박사의 책상 위에 놓여 있다."
 andersson.201.f: "\"신사 여러분, 확인과 추정을 막론하고 원시 인류의 종류에 관한 전반적인 토의에 여러분 모두를 초대하는 바입니다. 모든 명칭 제안은 추첨함에 넣어 무작위로 채택할 방침입니다. 귀하의 창의력을 기대하겠습니다!\"\n\n서명: [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetFullName]"
 andersson.201.g: "그만두겠다."
 andersson.201.h: "네오안트로푸스."
 andersson.201.i: "팔라에안트로푸스."
 andersson.201.j: "피테칸트로푸스."
 andersson.201.k: "오스트랄로피테쿠스."
 andersson.211.t: "원시 인류 탐색 종료"
 andersson.211.d: "인류학 연구진이 탐색 작업을 성공적으로 마무리하고 나름의 성과와 함께 [ROOT.GetCountry.GetCapital.GetCityHubName]로 돌아왔다."
 andersson.211.f: "\"여러분 모두가 무언가 배워가셨기를 바랍니다! 인류의 기원은 여전히 알 수 없지만, 적어도 그 미지에 대해 어느 정도 밝혀내는 부분이 있었습니다. 잭슨 박사님께선 치아 마모 양상을 통해 선사시대 구강 위생에 관한 결론을 도출하였고, 피티팔디 박사님께선 발견된 도구들을 맥락에 따라 분석하고 선사시대 기술의 세부 차이를 분간해냈습니다. 그리고 샤베르나크 교수님께선 어째서 종유석 위에 앉아 있으면 안 되는가를 드디어 알게 되셨겠지요!\"\n\n[ROOT.Var('andersson_anthropologist_var').GetCharacter.GetFullName] 올림"
 andersson.211.g: "인류학계의 위업일세."
 andersson.212.t: "동굴의 경이로움"
 andersson.212.d: "우리 인류학자가 [SCOPE.sState('andersson_cave_state_scope').GetName]에서 엄청난 벽화가 그려진 동굴을 발견하였는데 국내 많은 연구진들이 해당 벽화는 위조된 것이라 주장하였다. 그토록 원시적인 수준의 인간이 벽화를 그릴 리가 없다는 견해에서다!"
 andersson.212.f: "\"첫번째 굴을 계속 조사하다 보면, 뼈와 조개껍질이 묻힌 퇴적층이 끝나는 바로 그곳에서 동굴 천장에 그려진 수많은 동물 그림에 놀랄 것이다. 상당한 크기를 자랑하는 이 그림들은 검은색과 붉은색 황토로 그려진 것으로 보이며 대부분 등이 굽은 모습으로 미뤄보아 들소 등의 동물을 묘사하고 있다. 그 중 두마리는 옆모습이 온전히 그려져 있고, 다른 그림들은 머리가 없거나 이해할 수 없는 자세로 그려져 있다. 또 매우 상세히 묘사된 암사슴 하나와 말의 머리로 보이는 그림도 찾아볼 수 있다.\" - 마르셀리노 산스 데 사우투올라"
 andersson.212.g: "석기 시대의 시스티나 경당이로군!"
 andersson.221.t: "[SCOPE.sState('andersson_cave_state_scope').GetMineHubName]인"
 andersson.221.d: "[ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사가 학계에 충격을 가져올 발견을 이루어냈다! 초창기 인류의 화석을 발견하여 이곳에 인류가 정착한 시점이 수만 년 전으로 거슬러 올라가게 된 것이다. 이 화석은 현재로서는 네오안트로푸스의 미확인 종임이 분명하다."
 andersson.221.f: "네오안트로푸스(Neoanthropus, 신인류)는 19세기부터 20세기 초까지 인류학계에서 해부학적으로 현생 인류를 '원시적인' 인류 화석과 구분하기 위해 사용한 옛 분류 용어이다. 당시 진화론의 선형적 틀 안에서 네오안트로푸스란 용어는 인류 진화의 최종 단계를 특정하는 데 사용되었으며, 새롭게 발견되던 '고인류' 계통과 현생 인류를 대조하는 데 쓰이는 경우가 많았다. 네오안트로푸스는 주로 호모 사피엔스를 포괄하였으며, 특히 크로마뇽인처럼 후기 플라이스토세의 화석에 중점을 두었는데 이들이 당시 유럽인의 직계 조상으로 여겨졌기 때문이다. 19세기의 지식 배경에서 네오안트로푸스라는 개념은 네안데르탈인처럼 '대홍수 이전'의 멸종한 종과 현대인의 신체적 특징이 출현한 시점 간에 경계를 설정하는 데 큰 역할을 하였다."
 andersson.221.g: "[SCOPE.sState('andersson_cave_state_scope').GetMineHubName]인이라고? 마음에 드는군."
 andersson.222.t: "[SCOPE.sState('andersson_cave_state_scope').GetFarmHubName]인"
 andersson.222.d: "[ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사가 최근 연구를 통해 학계에 파장을 일으킬 결과를 발표하였다. 말라에안트로푸스의 미확인 종이 동굴에 살았다는 증거가 발견된 것이다."
 andersson.222.f: "팔라에오안트로푸스(Palaeoanthropus, 고인류)는 19세기부터 20세기 초까지 플라이스토세 중후기에 살았던 인류 조상을 분류하기 위하여 사용되었던, 현생 인류보다 더 '원시적'이거나 '뒤떨어진' 특징을 보이는 인류학 용어이다. 빅토리아 시대 학계의 단계적 진화 구조에서 팔라에안트로푸스는 가장 오래된 유인원 조상과 마지막으로 출현한 네오안트로푸스 사이의 핵심적인 중간 단계를 가리키는 말이었다. 팔라에오안트로푸스라는 말은 주로 네안데르탈인을 대상으로 사용되었다. 19세기 학자들에게 있어 팔라에오안트로푸스를 정의하느냐의 여부는 멸종된 인류가 현생 인류의 직계 조상인가, 아니면 더 우월한 계통으로 교체된 진화 단계의 막다른 지점이었는가에 관한 논쟁의 핵심이기도 했다."
 andersson.222.g: "[SCOPE.sState('andersson_cave_state_scope').GetFarmHubName]인이라, 좋은 이름일세!"
 andersson.223.t: "[SCOPE.sState('andersson_cave_state_scope').GetCityHubName]인"
 andersson.223.d: "지난번 발굴 조사에서 [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사가 찾아낸 유골의 연대가 수십만 년 전에 달하는 것으로 추산되었다. 이것이 사실로 드러날 경우 우리가 지금껏 마주하지 못했던 피테칸트로푸스의 한 종일 것으로 보인다."
 andersson.223.f: "피테칸트로푸스(Pithecanthropus)는 라틴어 명칭 그대로 '유인원 인간'을 뜻하는 중대한 분류 명칭으로, 에른스트 헤켈이 처음 제시하여 훗날 1891년 외젠 뒤부아가 자바인(피테칸트로푸스 에렉투스)을 발견하면서 학명으로 삼았다. 19세기 인류학계에서 피테칸트로푸스라는 용어는 비인간 영장류와 그보다 진화한 팔라에오안트로푸스(고인류) 또는 네오안트로푸스(신인류) 계통 사이에 위치해 있다고 추정되는 '잃어버린 고리'에 해당되었다. 피테칸트로푸스는 처음에는 인도네시아에서 발견된 유골 화석에 기반하였는데 이 화석들은 넙적한 두개골과 두터운 눈썹뼈가 특징으로, 과도기적 진화 단계의 증거로 여겨져 왔다. 오늘날 분류법 상에서는 이들 표본을 호모 에렉투스로 다시 배정하였으나, 피테칸트로푸스라는 개념은 유럽 외 지역에서도 훨씬 더 오래된 시점에서 인류의 진화가 일어났다는 최초의 실증적 증거를 제시하였다는 점에서 역사적으로 중요한 의미를 지닌다."
 andersson.223.g: "이번엔 [SCOPE.sState('andersson_cave_state_scope').GetCityHubName]... 알겠네."
 andersson.224.t: "오스트랄로피테쿠스"
 andersson.224.d: "[ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사는 최근 발견한 유골을 분석하는 과정에서 아연실색하고 말았다. 지난번 탐사 과정에서 출토한 인류 화석의 연대가 적어도 수백만 년 전의 것으로 드러났기 때문이다. 이런 오스트랄로피테쿠스는 유인원과 인간 둘 중에 어느 쪽과 더 가까운 것인가?"
 andersson.224.f: "오스트랄로피테쿠스(Australopithecus)는 1924년 '타웅 아이'의 발견 이래 학계에서 주목받은 멸종된 원시 인류의 한 속으로, 마이오세의 유인원과 사람속을 잇는 결정적인 연결고리의 역할을 하였다. 오스트랄로피테쿠스란 용어는 20세기 초 레이먼드 다트가 처음 사용하였으나, 이족보행의 활동 방식과 상대적으로 작은 유인원 크기의 두뇌를 지닌 생명체라는 점에서 19세기에 전망되던 진화론의 전개를 충족하였다. 고인류학 분야에서 오스트랄로피테쿠스의 발견은 '인류의 요람'이란 인식을 아프리카로 옮겨놓았으며, 인류의 기원에 대한 탐구 방향이 기존에는 유럽과 아시아로 모아졌던 것이서 벗어나 근본적으로 뒤바꾸어 놓았다."
 andersson.224.g: "영문 모를 마을 이름에 '인' 자만 붙이면 되던 시절이 그립군."
 andersson.231.t: "막다른 길?"
 andersson.231.d: "[SCOPE.sState('andersson_cave_site').GetName]의 인류학 유적지를 탐사하던 연구진은 험준한 등반로와 좁은 동굴 통로를 헤쳐나가야 했다. 알고 보니 동굴 입구는 [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사가 생각했던 것과는 전혀 다른 곳에 위치해 있었다."
 andersson.231.f: "알고 보니 동굴 입구가 바위 노출부가 아니라 근 1000m 아래에 위치해 있었다. 연구진은 유적지에서 동굴까지 가는 데 상당한 거리의 우회로, 달리 말하자면 대단히 위험한 경로를 택할 수밖에 없었다."
 andersson.231.g: "좋든 싫든 우회해서 가는 수밖에."
 andersson.231.h: "이번엔 박사님께서 지름길로 가는 위험을 감수할 필요가 있소!"
 andersson.232.t: "동굴 벽화"
 andersson.232.d: "[SCOPE.sState('andersson_cave_site').GetName] 동굴에 수만 년이 넘은 것으로 보이는 벽화와 새김이 발견되었다. 그러나 이들이 지닌 의미와 배경은 여전히 미지의 영역에 머물러 있다."
 andersson.232.f: "선사시대 고고학과 인류학이 창시될 무렵, 진화론에 따라 원시인들은 추상적인 개념을 이해하지 못한다는 가설이 존재하였다. 따라서 예술적 표현을 했을 가능성도 배제되었다. 학계의 이러한 믿음은 동굴 벽화, 그 중에서도 알타미라 동굴 벽화가 발견되던 시점에서도 분명 위조된 것이라 여겨지는 결과를 낳게 되었다. 1900년대에 이르러 프랑스 남서부를 중심으로 더 많은 동굴 벽화가 발견되면서 비로소 학계에서는 이들이 진품이라는 결론에 도달하게 되었다."
 andersson.232.g: "우리 조상들은 생각했던 것보다 그리 원시적이지 않았던 모양이군."
 andersson.233.t: "연구의 결실"
 andersson.233.d: "지난 몇 달 간 [SCOPE.sCharacter('andersson_anthropologist_scope').GetFullName] 박사는 본인의 연구에 매진해 왔다. 그리고 이제 후대를 위하여 [SCOPE.sState('andersson_cave_site').GetName] 동굴에서 발견한 수많은 흔적들을 목록화하고 동굴 내부 구조를 기록하기에 이르렀다."
 andersson.233.f: "인류의 역사가 얼마나 오래되었는가는 19세기 내내 명확히 밝혀지지 않은 상태로 남았다. 20세기로 넘어가면서 인류의 역사가 고작 수천 년에 불과하다는 견해는 이미 버린 학자들이 많았다. 그러나 일찍이 1840년대에 부셰 드 페르테스가 훨씬 오래된 석기들을 증거로 제시하며 인류가 멸종 포유류와 공존했다고 주장하였음에도 묵살당했다. 선사시대 유물을 끊임없이 수집하고 분석한 후에야 인류가 기존의 견해보다 훨씬 더 오랫동안 지구를 누볐다는 사실을 밝혀낼 수 있었다."
 andersson.233.g: "본인에게 큰 보탬이 되겠군."
 andersson.233.h: "학계에 큰 보탬이 되겠군."
 andersson.234.t: "동굴에서 벌어진 사고"
 andersson.234.d: "[SCOPE.sState('andersson_cave_site').GetName] 지역의 동굴을 탐사하는 과정에서 사고가 벌어지고 말았다. 조수 한 명이 짐을 진 당나귀와 함께 추락하고 만 것이다. 부상은 미미하나 일부 장비는 새것으로 교체할 수밖에 없게 되었다."
 andersson.234.f: "\"제발 한번이라도 전문가의 손에 맡기란 말이오!\""
 andersson.234.g: "안 돼!"
 andersson.236.t: "미로 같은 동굴"
 andersson.236.d: "[SCOPE.sCharacter('andersson_anthropologist_scope').GetLastName] 박사의 보고에 따르면 유골과 선사시대 유물 수집이 지연되고 있다고 한다. 중대한 발견이 잇따른 탓에 유골 감식 단계로 접어들지 못하고 연기되고 있는 것이다. 참으로 크나큰 지연이 아닐 수 없다. 실제로 몇 주 동안 연구진과 연구소 간에 아무런 연락도 이루어지지 않았다. 이는 곧 단 한가지를 의미할 뿐이다."
 andersson.236.f: "이래서야 완전히 길을 잃고 말았다."
 andersson.236.g: "멍청하긴!"
 andersson.237.t: "석기시대 도구"
 andersson.237.d: "[SCOPE.sCharacter('andersson_anthropologist_scope').GetFullName](이)가 과거에 관한 정보를 알아낼 수 있는 선사시대 석기를 동굴에서 발견하였다."
 andersson.237.f: "19세기 인류학은 주로 인류의 선사시대 역사를 다루는 학문으로서 유골 뿐만 아니라 석기 시대의 무기와 도구도 다루었다. 당시 석기 시대라는 말은 학계 용어라기보다는 야만적인 시대를 가리키는 의미가 컸다. 당대 인류학은 동굴에 사는 원시인이라는 고정관념에 사로잡혀 있었으며 역사적 사실과는 거리가 있었다. 그럼에도 그 시기의 유물과 유적들이 점점 더 많이 발견되면서, 후대에 이르러 기존 인식을 바꾸고 진정한 선사시대 고고학을 정립하는 계기가 되었다."
 andersson.237.g: "석기를 조사해 봅시다."
 andersson.237.h: "이런 유물은 박물관에 모셔야 한다!"
 andersson.238.t: "인간 뼈"
 andersson.238.d: "우리 인류학자가 동굴 탐사 과정에서 유골을 추가로 찾아냈다."
 andersson.238.f: "19세기와 20세기 초에 발견된 인류 화석의 수는 적다는 것이 통절이다. 하지만 이는 절반만 맞는 설명으로, 초창기 인류 뼈 화석 가운데 상당수는 제대로 그 진가를 알아보지 못하는 경우가 많았다. 네안데르탈인이라는 이름은 네안데르탈 지역에서 발견되는 인류 화석이었던 것에서 유래하였지만, 네안데르탈인의 유골 자체는 이전에도 수차례 발견되어 왔다. 심지어 발견 이후에도 루돌프 비르호프처럼 저명한 학자들은 그 진위와 연대에 관해서 의문을 제기하였다. 문제는 발견된 화석의 수가 아니라, 그것이 선사시대 인류의 실제 유해인지의 여부를 검증하는 것이었다."
 andersson.238.g: "냠냠."
 andersson.239.t: "조교의 화석 발견"
 andersson.239.d: "학부생 조교가 [SCOPE.sState('andersson_cave_site').GetName]의 동굴에서 인류학 흔적 확보에 큰 역할을 하였다. 허나 [SCOPE.sCharacter('andersson_anthropologist_scope').GetFullName](은)는 자신이 선임연구원으로서 해당 발견의 공은 자신에게 돌아간다고 지적하고 나섰다."
 andersson.239.f: "\"머리 좋은 아테네 젊은이가 명성에 갈망하던 이야기를 기억하는가? 그 자는 신탁을 찾아가 '어찌하면 큰사람이 될 수 있겠습니까' 하고 물었다. 신탁은 답했다. '사람을 죽여라'라고!\" - 리처드 오웬"
 andersson.239.g: "이번 발견은 젊은 인류학도의 것이오."
 andersson.239.h: "이번 발견은 우리 선임 인류학자의 것이오."
 andersson.240.t: "잃어버린 보관 상자"
 andersson.240.d: "다소 남부끄러운 사고가 발생하여 유골 감식 개시를 늦추고 말았다."
 andersson.240.f: "연구진이 수집을 마치고 유적지의 다른 지역을 탐사하던 중, 선임연구원으로 나선 [SCOPE.sCharacter('andersson_anthropologist_scope').GetLastName] 박사가 수집했던 뼈와 유물을 깜빡 잃어버렸다는 사실을 너무 늦게 깨닫고 말았다. 지금껏 발견한 유물이 담긴 탐사용 상자를 어디에 두었는지를 잊어버리고 만 것이다. 그것도 몇 주 전에 둔 것을 말이다."
 andersson.240.g: "뼛조각 하나하나가 소중하다."
 andersson.240.h: "그냥 속행하시오!"
 andersson_conference_anthropologist_double_vote_tt: "경험 많은 인류학자를 보유한 덕분에 우리나라의 투표권은 #G 2배#!로 적용됩니다."
