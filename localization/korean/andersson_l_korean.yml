 je_andersson_hominid_expedition: "원시 인류 탐사"
 je_andersson_hominid_expedition_reason: "#p 현재 [SCOPE.sState('target').GetCountry.GetName]의 [SCOPE.sState('target').GetName]에서 원시 인류 탐색이 진행되고 있습니다.#!\n$mr_divider_for_je$\n인류학자의 인류 화석 탐색은 탐사, 수집, 식별의 세 단계로 나뉩니다. 탐사 단계에서 인류학자는 적절한 인류학적 유적지를 찾아 해당 지역을 탐색합니다. 그 단계를 거치고 나면 화석 수집에 나섭니다. 화석을 충분히 발견했다면 식별 절차에 나섭니다. 탐사와 수집은 발견 이벤트로 마무리됩니다. 식별 절차에서 신규 원시 인류 종이 확인될 수도 있습니다."
 andersson_je_no_subject_anymore_tt: "[GetPlayer.GetName](은)는 더 이상 탐사가 이루어지고 있는 종속국의 종주국이 아님"
 andersson_hominid_expedition_modifier: "원시 인류 탐사"
 andersson.205.t: "원시 인류 탐사: 유형"
 andersson.205.d: "[ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사가 탐사대를 꾸리기에 앞서 어느 유형의 원시 인류를 탐색 목표로 삼을 것인가를 결정하여야 한다."
 andersson.205.f: "\"진화론은 이론인가, 체계인가, 아니면 가설인가? 답은 그 이상이다. 모든 이론, 모든 가설, 모든 체계가 따라야 하고, 앞으로 생각할 여지가 있는 동시에 진실을 찾아 헤맬 문제라면 반드시 만족시켜야 하는 통상적인 조건이다.\""
 andersson.206.t: "원시 인류 탐사: 지역"
 andersson.206.d: "[ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사가 벌써부터 조수들에게 탐험 대상에 오를 만한 해외 지역의 지도를 가져오도록 지시하였다. 그러나 아직 결정은 내려지지 않았다."
 andersson.206.f: "\"나는 초기 플라이스토세에 인류의 조상이 유럽에 존재하는가의 여부를 놓고 열린 마음을 유지하였다.\" - 루이스 리키"
 andersson.213.t: "원시 인류 탐사 완료"
 andersson.213.d: "힘겨웠지만 보람찬 탐사 끝에 [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사가 이끄는 탐사대가 무사히 고국으로 돌아왔다. 인류학 연구소는 이제 여러 점의 유골을 확보하며 한층 더 탄탄해지게 되었다."
 andersson.213.f: "\"이제 끝났다... 그리고 나 역시도 그러하다.\" - 로버트 블룸, 사망 직전 오스트랄로피테쿠스 관련 논문을 마무리하며"
 andersson.225.d: "[ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사가 [SCOPE.sCountry('andersson_cave_country_scope').GetName] 지역의 어느 동굴에서 엄청난 발견을 해냈다는 소식이다!"
