 ACHIEVEMENT_andersson_own: "나만의 인류"
 ACHIEVEMENT_DESC_andersson_own: "자유로움 설정으로 게임을 시작하여 특정 인류 화석을 찾아내고 명명하십시오."
 ACHIEVEMENT_andersson_piltdown: "이건 사기야!"
 ACHIEVEMENT_DESC_andersson_piltdown: "필트다운인이 위조라는 사실을 입증하십시오."
 ACHIEVEMENT_andersson_africa: "아웃 오브 아프리카"
 ACHIEVEMENT_DESC_andersson_africa: "인류의 아프리카 기원론을 정립하십시오."
