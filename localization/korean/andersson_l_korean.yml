 andersson.405.t: "[SCOPE.sState('andersson_state_scope').GetFarmHubName]의 거석"
 andersson.405.d: "[ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사가 [SCOPE.sState('andersson_state_scope').GetFarmHubName] 지역의 거석에 깊은 관심을 갖고 그 배경에 대해 심층적인 연구를 진행해 왔다. 그리고 최근에는 비록 추측에 기반한 부분이 많지만, 이러한 신석기 시대의 구조물에 관한 연구 결과를 발표하여 인류학계의 주목을 받게 되었다."
 andersson.405.f: "거석 문화는 기원전 4500년에서 1500년 사이 신석기 시대에 각 공동체마다 거대한 바위를 사용하여 기념물로서 예배소와 매장지를 건설했던 현상을 말한다. 대서양 연안에서 지중해에 이르기까지 이러한 구조물은 유럽 대륙 최초로 신성한 자리를 영구히 마련하였다고 할 수 있다. 그 형태는 단독으로 서 있는 거석부터 카르나크의 유적처럼 수 킬로미터에 걸쳐 늘어선 돌기둥, 그리고 공동 매장지 역할로서 탁자 형태를 했던 돌멘(고인돌)에 이르기까지 다양하다. 특히 복잡한 구조를 지닌 것으로 원형 헨지가 꼽히는데, 그 중에서도 제일 유명한 영국의 스톤헨지는 천문학에 따라 정확히 배열된 모습을 보여주고 있다. 수 톤에 달하는 거석을 운반하고 세우는 데에는 적잖은 규모의 조직 사회와 더불어 고도의 역학, 수송 지식이 필요하였다. "
 andersson.405.g: "그러니까 정말로 오천 년 전에 우리 선조들이 저런 큰 돌을 세웠단 말인가?"
 andersson.407.t: "유골, 유골, 그리고 더 많은 유골!"
 andersson.407.d: "[SCOPE.sState('andersson_state_scope').GetName]에서는 주민들의 불편이 이만저만이 아니다. 대대적인 발굴 작업으로 사방을 뒤집어엎은 탓이다. 그렇다고 모두가 불편한가? 그건 아니다! [ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사가 최근 인간의 두개골을 다수 발견하여, 입수 과정을 거쳐 조사에 나서고 있다!"
 andersson.407.f: "\"두개학 연구에 사용할 예쁜 두개골이 이렇게나 많다니!\""
 andersson.407.g: "두개골이 그렇게나 많이 나온다니 섬뜩하군."
