 je_andersson_our_ancestors: "우리 조상의 역사"
 je_andersson_our_ancestors_reason: "[GetPlayer.MakeScope.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사는 현재 국내 대학 중 한 곳에 인류 진화사에 관한 전시를 준비중에 있다. 이번 전시는 우리 조상들의 삶을 보여주고 그에 관심있는 일반 대중에게 관련 정보를 제공하기 위한 것이다."
