 andersson.311.t: "새로운 선사시대 골격"
 andersson.311.d: "[ROOT.Var('andersson_anthropologist_var').GetCharacter.GetLastName] 박사가 공개 행사를 통해 새로운 선사시대 골격을 대중에 선보였다. 학계에서는 이번 복원에 주목하는 분위기다."
 andersson.311.f: "\"과거를 돌아보는 만큼 미래를 내다보는 법.\" - 레이먼드 다트"
 andersson.311.g: "[GetPlayer.GetName](은)는 세계적인 과학 강국이다!"
 andersson.911.t: "인류학 학술회의: 현생 인류의 기원"
 andersson.911.d: "우리나라가 인류학 역사상 제일 중요한 학술회의를 개최하게 되었다. 인류의 기원이라는 가장 중대한 질문에 해답을 찾아야 할 때가 된 것이다. 전세계의 인류학자들이 한자리에 모여 인류의 기원이 유럽인지, 아시아인지, 아프리카인지 토의에 나설 전망이다. [SCOPE.sCharacter('andersson_anthropologist_scope').GetFullName] 교수가 이번 토의를 주최하게 되었다."
 andersson.911.f: "인류는 어디에서 기원하였는가? 그 질문의 핵심은 성경에 나오는 에덴 동산에서의 추방 이야기에 이미 담겨져 있다. 인류는 오늘날 우리가 살고 있는 지역에서 기원한 것이 아니라는 이야기다. 따라서 오랫동안 유럽에서는 원시 인류의 유골을 대홍수 때 죽은 사람들의 유해로 여겼다. 마치 공룡이 방주에 탈 자격이 없는 동물이라 생각했던 것처럼 말이다. 빙하기설이 제기되고 이후 지질학과 고생물학 연구를 통해 지구의 역사가 훨씬 더 오래됐다는 사실이 밝혀지면서 일명 '동굴인'에 대한 관심도 높아졌다. 그리고 진화론이 정립되고 수만 년도 더 된 선사시대의 유골이 발견되면서 현생 인류의 기원에 대한 질문은 더욱 격렬해졌다."
 andersson.911.g: "인류의 요람은 어디인가?"
 andersson.912.d: "[SCOPE.sCountry('andersson_congress_host_country').GetName]에서 고고학 학술회의에 우리나라를 초청하였다. 이번 회의의 주제는 현생 인류의 기원을 다룰 전망이다. [SCOPE.sCharacter('andersson_anthropologist_scope').GetLastName] 교수가 따뜻한 환대를 받으며 회의에 참석하게 되었다."
 andersson.914.t: "현생 인류의 기원은 유럽인가, 아시아인가, 아니면 아프리카인가?"
 andersson.914.d: "인류학계가 세 부류로 나뉘었다. 인류의 요람이 어디인가에 대한 질문은 단순히 특정 국가의 자존심과 맞물린 문제일 뿐만 아니라, 인류의 진화에 관한 심층 논의와도 연결되어 있다."
 andersson.914.f: "크게 세 가지 부류로 나뉜 지지자들이 열띤 토론을 통해 각자의 주장을 주고받았다. [SCOPE.sCharacter('andersson_europe_defender_scope').GetLastName](은)는 지금껏 유럽에서 발견된 인류 화석에서 두뇌의 용량이 제일 크다는 점을 거론하며 유럽 기원설을 논제로 올렸다. 직립보행 이전에 두뇌가 커져야 하므로 유럽에서 기원한 것이 필연적이라는 것이다. [SCOPE.sCharacter('andersson_asia_defender_scope').GetLastName] 측은 이러한 가설에 의문을 제기했다. 직립보행을 하는 인간과 유사한 화석이 이미 아시아에서 발견되었으므로 두뇌는 직립보행 이후에 발달했다는 것이다. 반면 [SCOPE.sCharacter('andersson_africa_defender_scope').GetLastName](은)는 인간과 가장 가까운 유인원 종이 아시아가 아닌 아프리카에 서식한다는 점을 지적하였다. 진화론의 창시자가 말했듯, 인류의 기원은 아프리카에서 찾아야 한다는 것이다."
 andersson.914.g: "현생 인류는 유럽에서 기원하였소."
 andersson.914.h: "모든 증거가 아시아 기원설을 뒷받침하고 있소."
 andersson.914.i: "인류의 요람은 아프리카요."
 andersson.915.t: "존경받는 강연"
 andersson.915.d: "[SCOPE.sCharacter('andersson_anthropologist_scope').GetFullName](이)가 [SCOPE.sCountry('andersson_congress_host_country').GetName]에 모인 학계 연구진에게 강연을 펼쳐 청중과 젊은 학도들 모두에게 영감을 불어넣었다."
 andersson.915.f: "\"지구는 인류의 요람이나, 인류는 영원히 요람에 머물 순 없다.\"\n - 콘스탄틴 치올코프스키"
 andersson.915.g: "[SCOPE.sCharacter('andersson_anthropologist_scope').GetLastName] 교수가 큰 인상을 남겼군."
 andersson.916.t: "토론에 값진 공헌을 남기다"
 andersson.916.d: "[SCOPE.sCharacter('andersson_anthropologist_scope').GetFullName] 교수의 훌륭한 학술 강연은 [SCOPE.sCountry('andersson_congress_host_country').GetName]에서 열린 학술대회에서 학계의 지평을 넓히는 계기가 되었다. 이는 오래토록 영향을 끼칠 것으로 전망된다."
 andersson.916.f: "\"그는 만물에 대하여 꽤나 기이한 생각을 지니고 있었다. 심지어 한번은 영국과학협회에서 유인원의 두뇌에도 사람처럼 하마(역주: 두뇌 기관 중 하나인 '해마'의 풍자)를 달고 있다고 언명한 적도 있다. 그야말로 충격적인 발언이 아닐 수 없었다. 그것이 사실이라면 무수한 불멸의 존재들의 믿음, 희망, 관용은 어떻게 될 것인가? 그대도 본인과 유인원 사이에 더 큰 차이점이 있다 생각할지 모르겠다. 말을 할 수 있고, 기계를 만들고, 옳고 그름을 분별하고, 기도를 하는 등 말이다. 허나 그대여, 그것은 어린아이의 공상일 뿐이다. 오로지 그 위대한 하마가 존재하느냐 마느냐의 여부에 달린 것이다. 그대의 두뇌에 하마가 있다면, 비록 손이 네 개이고 발도 없고 온 유인원 가운데서 제일 유인원처럼 생겼을지라도, 그대는 유인원이 아닐 것이다.\" - 찰스 킹슬리"
 andersson.917.t: "인류학계 위신"
 andersson.917.d: "이번 학술대회에서 저명한 인류학자가 며칠 전 별세했다는 비보가 전해졌다. 인류학자의 개인 소장품이 경매에 부쳐질 전망이다."
 andersson.917.f: "\"자식도, 아내도, 친구도 두지 않으면서, 낡은 돌과 뼈만 잔뜩 모은 사람일세. 참으로 복된 삶이 아닌가!\""
 andersson.917.g: "뼛조각 하나하나가 우리 소장품에 들이기에 모자람이 없다."
 andersson.917.h: "...그 정도는 우리도 충분히 갖추지 않은가."
 andersson.919.t_europe: "현생 인류의 기원은 유럽에서"
 andersson.919.t_asia: "현생 인류의 기원은 아시아에서"
 andersson.919.t_africa: "현생 인류의 기원은 아프리카에서"
 andersson.919.d_europe: "국제 학계에서는 현생 인류의 기원이 유럽이라는 점에 의견 일치를 보았다. 비유럽권 학자들은 이번 결정이 지상주의라며 거센 비판을 가했다."
 andersson.919.d_asia: "최근 국제 인류학 회의에서 인류가 아시아에서 기원했을 것이라는 결론에 의견 일치를 보았다. 회의에 참석한 대다수 학자들은 해당 설에 수긍하는 모습을 보였다."
 andersson.919.d_africa: "인류의 기원지가 아프리카였다는 설이 최종 토론의 격렬한 논쟁을 거쳐 근소차의 과반수로 채택되기에 이르렀다."
 andersson.919.f_europe: "실제 역사에서 인류의 기원이 어디였는가에 관한 의문은 20세기 초까지만 하더라도 해결되지 않은 문제로 남았다. 일명 필트다운인의 발견에 다소 호도되어, 과학적 근거보다는 이상적 근거에 기반하여 현생 인류의 기원이 유럽이었다는 설이 소수설로 존재한 반면, 아시아에서 기원했다는 설이 다수설로 자리잡았다. 자바섬에서의 발견과 베이징 원인의 회수가 아시아 기원설에 큰 역할을 했던 것이다. 아프리카에서 유골이 점점 더 많이 발견되면서 이 설을 잠식하게 된 것은 20세기 중반이 되어서였다."
 andersson.919.f_asia: "실제 역사에서 인류의 기원이 어디였는가에 관한 의문은 20세기 초까지만 하더라도 해결되지 않은 문제로 남았다. 일명 필트다운인의 발견에 다소 호도되어, 과학적 근거보다는 이상적 근거에 기반하여 현생 인류의 기원이 유럽이었다는 설이 소수설로 존재한 반면, 아시아에서 기원했다는 설이 다수설로 자리잡았다. 자바섬에서의 발견과 베이징 원인의 회수가 아시아 기원설에 큰 역할을 했던 것이다. 아프리카에서 유골이 점점 더 많이 발견되면서 이 설을 잠식하게 된 것은 20세기 중반이 되어서였다."
 andersson.919.f_africa: "실제 역사에서 인류의 기원이 어디였는가에 관한 의문은 20세기 초까지만 하더라도 해결되지 않은 문제로 남았다. 일명 필트다운인의 발견에 다소 호도되어, 과학적 근거보다는 이상적 근거에 기반하여 현생 인류의 기원이 유럽이었다는 설이 소수설로 존재한 반면, 아시아에서 기원했다는 설이 다수설로 자리잡았다. 자바섬에서의 발견과 베이징 원인의 회수가 아시아 기원설에 큰 역할을 했던 것이다. 아프리카에서 유골이 점점 더 많이 발견되면서 이 설을 잠식하게 된 것은 20세기 중반이 되어서였다."
 andersson.919.g: "예상대로 인류는 유럽에서 진화를 이룩했군."
 andersson.919.h: "모든 증거가 인류가 아시아에서 진화했음을 보여주고 있소."
 andersson.919.i: "'아웃 오브 아프리카'는 이제 공인된 학설이다."
