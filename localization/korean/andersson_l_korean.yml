 andersson.301.a: "복원 유형 선택"
 andersson.301.d: "[ROOT.Var('andersson_anthropologist_var').GetCharacter.GetFullName](은)는 화석 몇 점을 가지고 그간 모은 유골 수집품으로 돌아가, 발견한 것을 위치와 유사성에 따라 꼼꼼히 배열하였다. 겉보기에는 각각의 뼈가 서로 맞춰져 하나의 골격을 이루는 듯했다. 과연 어떤 종의 골격인가?"
 andersson.301.f: "\"머리뼈는... 갈비뼈에 연결하고.\n갈비뼈는... 다리뼈에 연결하고.\n다리뼈는... 엉덩이뼈에 연결하고.\n엉덩이뼈는... 팔뼈에 연결하고.\n팔뼈는... 머리뼈에 연결하고.\n머리뼈는... 갈비뼈에 연결하고.\""
