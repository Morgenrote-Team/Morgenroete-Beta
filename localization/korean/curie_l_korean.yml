 curie.401.t: "물리학 실험"
 curie.401.d: "[ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] 박사가 자신이 진행하는 실험의 새 단계에 돌입했다. 실험의 접근 방식이 신중한 방향이 될지, 아니면 획기적인 방향이 될지의 여부를 아직 정하지 못한 상황이다."
 curie.401.f: "물리학 실험 과정에서 일정 시간이 흐르고 나면 물리학자는 그 결론을 최대한 빨리 도출하는 시도에 나선다. 실험이 항상 성공할지의 여부는 전혀 별개의 문제다. 무엇보다도 #G $cautious$#!, #G $meticulous$#! 인물 특성을 지닌 물리학자는 실험 결과도 잘 나올 확률이 높다. #R $wrathful$#!, #R $reckless$#!, #R $senile$#! 특성을 지닌 물리학자는 본인의 연구가 파국을 맞이하게 될 위험성이 특히나 높다."
 curie.401.g: "신중한 방향으로."
 curie.401.h: "획기적인 방향으로."
 curie.402.t: "역사에 길이 남을 실험"
 curie.402.d_1: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] passed light through two narrow slits onto a screen. The resulting interference pattern of bright and dark bands proved that light behaves as a wave, successfully refuting Isaac Newton's dominant particle theory."
 curie.402.d_2: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] aligned a current-carrying wire above a magnetic compass. The needle's deflection proved that electricity generates a magnetic field, establishing the unified field of electromagnetism."
 curie.402.d_3: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] used falling weights to spin paddle wheels in insulated water. The resulting temperature increase showed that mechanical work converts directly into heat, establishing energy conservation."
 curie.402.d_4: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] tested Doppler's theory using trumpet players on a moving train. The observed shift in pitch as the train passed confirmed the Doppler effect, proving that motion alters acoustic frequency."
 curie.402.d_5: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] suspended a heavy pendulum from a long wire. The gradual rotation of its swinging plane relative to the floor provided direct visual proof of Earth's axial rotation without celestial observations."
 curie.402.d_6: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] bounced light through a rotating cogwheel to a distant mirror. Blocking the return light at known rotation speeds yielded the first terrestrial measurement of the speed of light."
 curie.402.d_7: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] measured electric charge using a Leyden jar and galvanometer. The ratio between electrostatic and electromagnetic units yielded the speed of light, proving light's electromagnetic nature."
 curie.402.d_8: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] split light into perpendicular paths using a sensitive interferometer. The absence of expected fringe shifts disproved the luminiferous aether, paving the way for Special Relativity."
 curie.402.d_9: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] used spark-gap circuits to generate and detect invisible radio waves. Proving they shared light's velocity and wave properties, it confirmed Maxwell's electromagnetic theory and birthed wireless communication."
 curie.402.d_10: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] deflected cathode rays using electric and magnetic fields in a vacuum tube. Measuring their charge-to-mass ratio revealed negative subatomic particles—electrons—disproving the idea that atoms were indivisible."
 curie.402.d_11: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] suspended electrically charged oil droplets between two metal plates. Balancing gravity against electric force proved charge is quantized in fixed units, accurately establishing the electron's charge."
 curie.402.d_12: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] fired alpha particles at thin gold foil. Unexpected wide-angle deflections proved that atomic mass and positive charge are concentrated in a tiny central nucleus, replacing the uniform atom model."
 curie.402.d_13: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] passed accelerated electrons through mercury vapor. Periodic current drops at specific voltages proved atoms absorb energy in discrete quanta, confirming Bohr's model of quantized energy levels."
 curie.402.d_14: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] photographed stars near the sun during a total eclipse. The observed gravitational bending of starlight provided the first empirical proof of General Relativity."
 curie.402.d_15: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] directed silver atoms through an uneven magnetic field. The beam split into two distinct paths rather than a continuum, proving space quantization and discovering intrinsic quantum spin."
 curie.402.f_1: "In 1801, Thomas Young conducted the double-slit experiment to determine the physical nature of light. He directed a single beam of light through two closely spaced, narrow slits onto a dark screen. Rather than producing two distinct illuminated lines, the emerging light waves overlapped, creating a pattern of alternating bright and dark bands on the surface. This interference pattern demonstrated that light beams can reinforce or cancel each other out, behaving identically to ripples in water. The result provided conclusive evidence for the wave theory of light, directly challenging Isaac Newton's established particle model."
 curie.402.f_2: "In 1820, Danish physicist Hans Christian Ørsted discovered the fundamental link between electricity and magnetism. During a lecture demonstration, he passed an electric current from a battery through a straight wire positioned directly above a magnetic compass needle. Each time the circuit closed, the compass needle deflected perpendicular to the wire instead of pointing north. When the current direction was reversed, the needle turned in the opposite direction. This unexpected result proved that electric currents generate magnetic fields, unifying two previously separate areas of physics into the foundational field of electromagnetism."
 curie.402.f_3: "In 1843, James Prescott Joule measured the conversion of mechanical work into thermal energy using a specialized paddle-wheel apparatus. Falling weights rotated a submerged brass paddle wheel inside an insulated vessel of water. Gravity did measurable mechanical work on the system, while friction between the paddles and liquid caused a precise rise in water temperature. By comparing the gravitational potential energy lost by the weights with the heat gained by the liquid, Joule calculated a constant conversion ratio. The experiment demonstrated that heat is a form of energy, establishing the principle of conservation of energy."
 curie.402.f_4: "In 1845, Dutch meteorologist Christoph Buys Ballot conducted an experiment to verify Christian Doppler's 1842 theory on wave pitch shifts. He placed trumpet players on an open train carriage while musicians on the ground held a steady reference pitch. As the locomotive moved past at varying speeds, the trumpeters played a continuous musical note. Listeners on the platform clearly heard the pitch shift higher as the train approached and drop lower as it moved away. The trial empirically confirmed the Doppler effect for sound waves, which later became critical in astronomy to measure stellar movement."
 curie.402.f_5: "In 1851, French physicist Léon Foucault demonstrated Earth's rotation using a massive pendulum suspended in the Paris Panthéon. He hung a 28-kilogram brass sphere from a 67-meter steel wire, allowing it to swing freely in any vertical plane for hours. As the pendulum swung back and forth, its plane of oscillation steadily rotated clockwise relative to the floor. Because no lateral forces acted on the wire, the floor beneath was actually turning while the swinging plane remained fixed in space. This provided the first simple, terrestrial proof that the Earth rotates on its axis."
 curie.402.f_6: "In 1849, Hippolyte Fizeau performed the first successful terrestrial measurement of the speed of light. He projected an intense beam of light between the teeth of a fast-spinning cogwheel toward a mirror positioned 8.6 kilometers away. The reflected light returned along the same path. By increasing the wheel's rotation speed until a returning light pulse was completely blocked by the adjacent tooth, Fizeau determined the precise transit time over the known distance. His calculated speed of roughly 315,000 kilometers per second proved that light's speed could be accurately measured on Earth without astronomical data."
 curie.402.f_7: "In 1856, Wilhelm Weber and Rudolf Kohlrausch measured the ratio between electrostatic and electromagnetic units of electric charge. Using a high-capacity Leyden jar, they determined the absolute quantity of static charge accumulated. They then discharged the jar through a ballistic galvanometer to measure the magnetic force generated by the flowing current. Surprisingly, the ratio of electrostatic force to electromagnetic force matched a speed of approximately 310,000 kilometers per second. This constant, nearly identical to the speed of light, laid the empirical foundation for James Clerk Maxwell's theory that light is an electromagnetic wave."
 curie.402.f_8: "In 1887, Albert Michelson and Edward Morley attempted to detect Earth's motion through the hypothetical luminiferous aether. They built a sensitive optical interferometer mounted on a heavy stone slab floating in mercury to isolate vibrations. A beam splitter divided light into two perpendicular paths, reflecting them off mirrors before recombining them on a screen. If the aether existed, Earth's orbital velocity would create a difference in light speed along the two paths, producing a shift in interference fringes when rotated. No shift was observed, proving the speed of light is constant and disproving the stationary aether."
 curie.402.f_9: "In 1887, Heinrich Hertz built an electrical spark-gap transmitter to test James Clerk Maxwell's theory of electromagnetism. High-voltage sparks generated across a primary gap produced invisible electromagnetic radiation, which traveled across the room and induced tiny sparks in a secondary wire ring receiver. Hertz demonstrated that these waves moved at the speed of light and exhibited reflection, refraction, and polarization like light waves. The experiment conclusively proved the existence of radio waves, confirming Maxwell's unified electromagnetic field theory and establishing the foundation for modern wireless telecommunications."
 curie.402.f_10: "In 1897, J.J. Thomson investigated cathode rays inside a highly evacuated glass tube. By applying electric and magnetic fields to the beam, he observed its deflection and measured the charge-to-mass ratio of the moving particles. Thomson discovered that the rays consisted of negatively charged particles over 1,000 times lighter than a hydrogen atom, regardless of the cathode material used. This proved that atoms were not indivisible spheres but composite structures, revealing the electron as the first identified subatomic particle and fundamentally transforming atomic physics."
 curie.402.f_11: "In 1909, Robert A. Millikan measured the charge of a single electron using a sealed chamber fitted with electric plates. He sprayed fine oil droplets into the chamber and ionized them using X-rays. By adjusting the electric field voltage, Millikan balanced the upward electrostatic force against gravity, holding individual charged droplets stationary in mid-air. Analyzing hundreds of drops revealed that every electric charge was a whole-number multiple of a single fundamental unit. The experiment proved charge quantization and determined the exact elementary charge value."
 curie.402.f_12: "In 1911, Ernest Rutherford directed a beam of positively charged alpha particles at a thin sheet of gold foil surrounded by a zinc sulfide detection screen. While most particles passed straight through, a small fraction deflected at wide angles, and roughly 1 in 8,000 bounced directly backward. This surprising result disproved Thomson's 'plum pudding' model of evenly distributed charge. Rutherford concluded that nearly all of an atom's mass and positive charge is concentrated in a tiny, dense central core—the nucleus—surrounded by mostly empty space filled with orbiting electrons."
 curie.402.f_13: "In 1914, James Franck and Gustav Hertz provided direct evidence for Niels Bohr's quantum model of the atom. They accelerated electrons through a glass tube filled with mercury vapor toward a receiving grid. As the accelerating voltage increased, electron current rose, but dropped sharply at regular intervals of 4.9 volts. This demonstrated that electrons lost energy only in discrete packets during collisions with mercury atoms. The periodic drops confirmed that atoms absorb energy in fixed quantum steps, providing the first clear proof of quantized atomic energy levels."
 curie.402.f_14: "During the total solar eclipse of May 1919, Arthur Eddington led expeditions to Principe and Brazil to test Albert Einstein's General Theory of Relativity. As the moon blocked the sun's glare, astronomers photographed star clusters positioned near the solar limb. Comparing these images with reference photographs taken at night showed that starlight shifted slightly outward as it passed close to the sun's gravitational field. The measured bending of light matched Einstein's mathematical predictions rather than Newtonian physics, providing the first observational confirmation of General Relativity."
 curie.402.f_15: "In 1922, Otto Stern and Walther Gerlach sent a beam of vaporized silver atoms through an inhomogeneous magnetic field onto a glass detector plate. Classical physics predicted that the atomic magnetic dipoles would align randomly, producing a smooth, continuous spread of silver deposits. Instead, the atomic beam split cleanly into two distinct components, forming two separated lines on the plate. This unexpected splitting demonstrated spatial quantization and provided early evidence for intrinsic angular momentum, later identified as electron spin, fundamentally altering quantum mechanics."
 curie.402.g: "유레카!"
 curie.403.t: "실험 성공"
 curie.403.d: "[ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] 박사가 오늘 자신의 실험 결과가 예상했던 바와 정확히 맞아 떨어졌다며 상당한 만족감을 표했다. 비록 세상을 뒤흔들 만한 발견은 아니지만, 국제 물리학계의 지식 저변을 상당 부분 확대하는 데에는 모자람이 없을 것이다."
 curie.403.f: "\"자연 법칙에 부합한다면 아무리 놀라운 것이라도 사실이 되지 못할 것은 없다.\" - 마이클 패러데이"
 curie.403.g: "좋았어."
 curie.404.t: "물리학 실험 실패!"
 curie.404.d: "[ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] 박사가 진행한 실험이 처참한 실패로 끝났다. 이제는 그 잔해를 수습해야 할 시간이다."
 curie.404.f: "\"무지를 철저히 자각하는 것은 과학의 진정한 진보를 위한 서막이기 마련이다.\" - 제임스 클러크 맥스웰"
 curie.404.g: "펑!"
