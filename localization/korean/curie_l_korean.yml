 je_curie_agricultural_weather_service_reason: "[ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] 박사는 농업 기상학에 전력을 다하고 있다. 박사의 일기 예보는 국내 농민들에게 무엇보다도 중요한 예보에 초점을 맞추고 있다. 농민들에게 미리 통지하여 지역 농업 분야의 대비가 있다면, 가뭄, 폭우, 홍수 등 어떤 기상·기후 여건에도 그로 인한 피해를 훨씬 누그러뜨릴 수 있을 것이다.\n\n[concept_modifier]의 강도는 [concept_curie_meteorological_physicist]의 경험치에 크게 좌우됩니다."
 je_curie_marine_weather_service: "해상 예보"
 je_curie_marine_weather_service_reason: "[ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] 박사는 해군부에 선박, 특히 무엇보다도 함대의 안전을 지키고 혹시 있을 수 있는 폭풍이나 그 밖의 해상 위험을 예측하는 임무를 맡고 있다. 이는 전시 상황에서 특히나 유용할 것이다.\n\n[concept_modifier]의 강도는 [concept_curie_meteorological_physicist]의 경험치에 크게 좌우됩니다."
 curie.501.t: "기상 예보 종료"
 curie.501.d: "지난 수년 동안 국가를 대신하여 일반 대중에게 기상 예보를 전해주었던 [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] 박사가 이제 학계로 돌아간다는 소식이다. 대중의 관심이 이제는 점차 버겁게 느껴진다고 한다."
 curie.501.f: "우리 기상학자가 도무지 이해할 수 없는 기계들과 무슨 소린지 전혀 모르겠는 연구에 다시 시간을 쏟으면서 머지않아 예전의 모습으로 돌아갈 것이다. 대체 누가 이런 학문을 진지하게 들어준단 말인가?"
 curie.501.a: "참된 일기예보관이로군!"
 curie.501.b: "참된 일기예보관이로군!"
 curie_weather_station_expansion_cost_modifier: "기상 관측소 확대 예산"
 je_curie_weather_station_expansion: "기상 관측소 확대"
 je_curie_weather_station_expansion_reason: "[ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] 박사는 천문대에서 기상 관측소를 최신 시설로 유지하는 작업에 여념이 없다. 국립 기상 관측소의 상태는 기상 현상의 예측에 있어 국가적으로 중요하다."
 je_curie_weather_station_expansion_progress_complete_tt: "진행도가 #V 36#!에 도달"
 curie_weather_station_expansion_progress_bar: "기상 관측소 확대"
 curie_weather_station_expansion_progress_bar_desc: "기상 관측소 확대 진행도: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|1%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/36)"
 curie.502.t: "기상 관측소 확대 완료"
 curie.502.d: "[ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] 박사가 천문대의 기상 관측소가 새로 완공되었음을 자랑스럽게 발표하였다. 이제 기상 관측소는 국가 기상 체계의 심장부로서 전국의 악천후 예보를 개선할 것이다!"
 curie.502.f: "최초의 표준 기상 관측 체계는 17세기~18세기부터 등장하였다. 전보의 발명으로 여러 지역을 아우르는 실시간 정보 수집이 가능해지면서 기상 관측에도 큰 변혁이 일어났다. 이후 각 정부는 1854년 영국 기상청이나 1870년 미국 기상국처럼 국가 차원의 전문 기관을 설립하였다."
 curie.502.g: "내일은 날씨가 어떻게 되려나?"
 curie.511.g: "박사님께선 그야말로 참된 구름 박사시군요!"
 curie.521.g: "저건 내 한평생 봐온 구름 중에 둘째 가는 구름이군! "
 curie.511.d: "또렷한 기상 환경 속에서 [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] 박사는 #V 권운#!을 면밀히 관찰하고 연구하여 새로운 기상학적 결론을 이끌어낼 수 있었다. 이것으로 [GetPlayer.GetName]에서 해당 유형의 구름을 처음으로 기록에 남기게 되었다!"
 curie.512.d: "또렷한 기상 환경 속에서 [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] 박사는 #V 권적운#!을 면밀히 관찰하고 연구하여 새로운 기상학적 결론을 이끌어낼 수 있었다. 이것으로 [GetPlayer.GetName]에서 해당 유형의 구름을 처음으로 기록에 남기게 되었다!"
