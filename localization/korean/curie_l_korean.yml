 je_curie_mathematical_innovation: "수학 혁신"
 je_curie_mathematical_innovation_reason: "[ROOT.GetCountry.GetCustom('je_curie_mathematical_innovation_active_type')]다른 과제를 맡고 있지 않은 [concept_curie_mathematical_physicist]는 국가의 수학 혁신에 공헌하게 된다. 수학 혁신은 국제 수학 혁신과 국내 수학 혁신의 총합에 해당된다. 국제 수학 혁신은 지금까지 발견된 수학 공식의 수에 기반한다. 국내 수학 혁신은 그 중에서도 해당 국가에서 발견한 공식에 기반하여 산정된다.\n\n수학 혁신은 최대 혁신 역량을 늘리고, 시대에 앞선 기술을 연구할 때 받는 불이익을 줄인다. 새로운 공식을 발견하면 그 해가 끝나는 시점부터 변화 요인이 적용되어 수학 혁신을 늘리게 된다."
 je_curie_mathematical_innovation_active_loc: "#p 이 과제는 현재 활성화된 상태입니다.#!\n$mr_divider_for_je$\n"
