 curie_geomagnetical_knowledge_modifier: "지자기학 지식"
 curie_mathematical_innovation_modifier: "수학 혁신"
 curie.100.t: "지자기 학회"
 curie.100.d: "[GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetLastName] 박사가 오늘 지자기 관측소를 처음으로 개소하였다. 이곳은 새로 창설된 지자기 학회의 심장이요, 전세게에 세워질 유사한 관측소들의 본보기가 되리라. 과학이여 만세!"
 curie.100.f: "지자기 학회 (Magnetischer Verein)는 역사상 최초의 국제 과학 학회로, 1834년 카를 프리드리히 가우스와 빌헬름 베버가 독일 괴팅겐에 설립하였다. 지자기 학회는 전세계의 관측소를 아우르는 연락망을 통해 지자기장의 측정을 조정하고 동기화하는 역할을 하였다."
 curie.101.t: "지자기 학회의 신규 회원"
 curie.101.d: "[GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetFullName] 박사가 오늘 [GetPlayer.GetCustom('curie_magnetic_association_city')]에 있는 지자기 학회에 가입하게 되었다. 다른 회원들도 이를 따뜻하게 환영해 주었다."
 curie.101.f: "학회 가입과 함께 [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetLastName] 박사는 실질적인 지자기 관측소를 마련하기 위한 필수 지식을 습득할 수 있게 되었다. 학회장은 우리 물리학자에게 관측소 설계도와 자기계를 전달하였다. 빠른 시일 내에 관측에 나서고 [GetPlayer.GetCustom('curie_magnetic_association_city')]에 첫 결과 자료를 보낼 수 있도록 온 학회가 관측소 건립에 힘을 보태기로 하였다."
 curie.101.g: "지금 바로 관측소를 마련해야 하겠군."
 curie.102.t: "지자기 관측소 개소"
 curie.102.d: "오늘 지자기 관측소의 신설 공사가 마무리되었다. 지난 몇 달 동안 수많은 관측 자료를 수집하여 [GetPlayer.GetCustom('curie_magnetic_association_city')]에 보내지게 되었다."
 curie.102.f: "수집한 측정 데이터 자료는 지자기장의 과학적 연구에 쓰이는 것을 넘어서 실용적으로도 활용될 수 있다. 예로부터 해운과 항공 분야에서 편각 지도가 사용되었고 오늘날까지도 여전히 쓰이고 있다. 광석이나 석유 매장지 같은 원자재 탐색에 있어서도 지자기 측정 자료는 중요하다."
 curie.102.g: "지자기학을 위하여!"
 curie.103.t: "국제 지자기 데이터 수집"
 curie.103.d: "전세계 곳곳의 지자기 데이터의 수집과 비교를 수년 동안 진행해온 끝에, [GetPlayer.GetCustom('curie_magnetic_association_city')]의 연구원들이 흥미로운 결과를 도출해낼 수 있었다."
 curie.103.f: "지구물리학과 지자기학은 실용적인 쓰임새가 많다. 특히 광업에서는 매장 여부를 밝혀낸다는 점에서 큰 이득을 보았다. 대기업들은 지구물리학 지식을 활용하여 과거에는 몰랐던 철과 납, 석유 매장지를 찾아냈다. 적절한 기술과 지자기 현황도가 확보된다면 지금의 이론적 지식을 실질적으로 활용하는 것도 수월해질 것이다."
 curie.103.g: "조국에는 과학적인 측정 자료가 더 필요하다."
 curie.103.h: "철 매장지 탐색에 도움이 되겠군."
 curie.103.i: "납 매장지 탐색에 도움이 되겠어."
 curie.103.j: "구리 매장지 탐색에 도움이 되겠구나."
 curie.103.k: "석유 매장지 탐색에 도움이 될 것이야."
 curie.104.t: "해군의 관심"
 curie.104.d: "[SCOPE.sCharacter('curie_admiral_scope').GetFullName] 씨가 [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetFullName]의 지자기학 연구에 큰 관심을 표했다. 현재 건설중인 지자기 관측소에서 실험을 성공적으로 완수한 데 따른 결과다."
 curie.104.f: "\"난 개구리 다리 가지고 무얼 하고 있단 말인가? 아, 아무것도 아니었구나, 아무것도 아니었어...\""
 curie.104.g: "이번에 얻은 지식은 본인에게도 유용하겠군."
 curie.104.h: "이런 지식은 모두에게 이익이 되어야 한다."
 curie.105.t: "변칙"
 curie.105.d: "측정 장비를 새로 들였음에도 [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetLastName] 박사가 기록한 지자기장의 측정값이 예상했던 것과 거의 일치하지 않았다. 그 원인이 무엇인지는 아직 밝혀내지 못한 상황이다."
 curie.105.f: "지자기장이 지역마다 다르게 나타나는 데에는 여러 가지 이유가 존재할 수 있다. 이러한 현상은 해당 지역에 대규모 광석 매장지가 존재할지도 모른다는 추측으로 이어지곤 하였는데, 그에 따라 지자기장 연구는 광업 분야에서 나름 흥미를 보이게 되는 계기가 되었다."
 curie.105.g: "[GetPlayer.GetCustom('curie_magnetic_association_city')]에 측정 자료를 보내야겠군."
 curie.106.t: "천문학자, 지자기 관측소에 자문"
 curie.106.d: "[GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetFullName] 박사와 [GetPlayer.MakeScope.GetVariable('verrier_astronomer_var').GetCharacter.GetFullName] 박사가 새로 완공된 지자기 관측소를 둘러보며 서로 고무적인 대화를 나눴다. 이번 교류로 [GetPlayer.MakeScope.GetVariable('verrier_astronomer_var').GetCharacter.GetLastName]의 과학 지식을 대폭 확대하는 계기가 되었다."
 curie.106.f: "\"잼을 바른 빵이 항상 잼을 바른 쪽으로 바닥에 떨어지는 이유가 그래서였군!\""
 curie.106.g: "이것으로 실용적인 연구에 보탬이 되겠군."
 curie.106.h: "이것으로 이론적인 연구에 보탬이 되겠군."
 curie.107.t: "지자기 현황도"
 curie.107.d: "[GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetFullName] 박사가 지자기장 현황도를 처음으로 출간하였다. 이 도감은 물리학계의 표준 과학 참고문헌이 될 것으로 보인다!"
 curie.107.f: "지자기 현황도 (공식 명칭은 '지구자기도감')는 19세기부터 출간된 지구물리학과 지도학 분야의 선구적인 연구 성과다. 1840년 독일 라이프치히에서 출간되었으며, 수학자 카를 프리드리히 가우스와 물리학자 빌헬름 베버가 검수를 맡았다. 이 연구는 철저한 수학적 기반을 바탕으로 지자기장의 범지구적 관측 결과를 엮어 지도 상에 시각적으로 표현한 최초의 사례였다. 지자기 현황도는 총 18개의 세부지도와 지구의 도해로 구성되어 있으며 지자기장의 주요 발생 원인은 지구 내부로부터 기인한다는 증거를 제시하였다."
 curie.107.g: "이 지식을 이론적인 방면으로 활용할 수 있겠군."
 curie.107.h: "이 지식은 실용적인 방면으로 활용해야겠어."
