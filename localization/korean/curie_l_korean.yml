 je_curie_formula_discovery_reason: "[ROOT.Var('curie_physicist_var').GetCharacter.GetFullName] 박사는 새로운 수학 공식을 알아내고자 노력하고 있다. 인물 특성과 숙련도에 따라 연구 속도를 높일 수 있다. 우리 물리학자는 현재 [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]에 관한 연구를 진행하고 있다."
