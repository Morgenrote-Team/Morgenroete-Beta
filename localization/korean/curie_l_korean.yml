 curie.11.t: "우라늄 발견!"
 curie.11.d: "[ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] 박사는 [SCOPE.sState('curie_uranium_state_scope').GetName] 지역에서 시료 채집 중 매우 풍부한 우라늄 매장지를 발견했다. 물리학자와 화학자들은 이 매장지를 직접 개발할 것을 권고하고 있다."
 curie.11.f: "우라늄(행성 천왕성에서 이름을 따옴)은 원소 기호 U, 원자 번호 92를 가진 화학 원소입니다. 우라늄 화합물은 19세기 내내 유리와 도자기, 꽃병 및 장식품뿐만 아니라 그릇이나 컵 같은 일상 용품의 착색에 사용되었습니다. 보헤미아의 요아힘스탈에 있는 유리 제조업체들은 이 기법을 1826년경부터 사용했습니다. 우라늄은 20세기 중반까지 유리 착색에 쓰였으며, 이후에는 덜 해로운 다른 착색 광물로 대체되었습니다. 오렌지색에서 밝은 빨간색까지 다양한 우라늄 함유 도자기 유약은 식기류부터 건축용 액세서리에 이르기까지 다양하게 사용되었습니다. 미국에서 '피에스타웨어'라 불리는 이 도자기는 제조업체 이름에서 유래했으며, 오늘날에도 많은 미국 가정에서 여전히 발견될 수 있는 가장 방사능이 높은 물품 중 하나일 것입니다."
 curie.11.g: "바로 거기에 우라늄 광산을 건설하라!"
 curie.12.t: "요아힘스탈"
 curie.12.d: "현재까지 보헤미아 요아힘스탈의 우라늄 광산은 소량만 생산해왔다. 제조업과 과학 분야에서 우라늄의 잠재적 활용으로 수요가 증가함에 따라, 이제 생산량을 크게 늘릴 계획이 수립되었다."
 curie.12.g: "요아힘스탈이 우라늄 생산의 중심지가 될 것이다!"
 curie_state_trait_high_quality_uranium: "고품질 우라늄"
