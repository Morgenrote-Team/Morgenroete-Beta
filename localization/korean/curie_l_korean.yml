 je_curie_magnetic_station_reason: "[GetPlayer.GetCustom('curie_magnetic_association_city')]에서 보내온 관측 장비와 설명서의 도움으로 우리 물리학자는 향후 2년 이내에 지자기 관측소를 세우게 될 전망이다. 이번 연구는 국제적인 사업으로, [GetPlayer.GetCustom('curie_magnetic_association_city')]에 관측 자료를 보내는 나라가 많아질수록 그곳의 과학자들이 지자기장에 관한 통찰력을 새롭게 밝혀낼 날도 가까워지게 될 것이다."
