 curie.13.t: "Outokumpu"
 curie.13.d: "With the help of Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] and state-of-the-art technologies, we were able to discover a previously unknown copper vein in Outokumpu. It may be the largest deposit in Northeastern Europe!"
 curie.13.f: "Following the discovery of a rich ore deposit in 1910 and the construction of integrated industrial facilities (smelters and refineries), Outokumpu rose to become one of the top five copper producers in Europe in the 1930s and laid the foundation for the modern Finnish metal industry."
 curie.13.g: "Outokumpu will be a center of copper production!"
 je_curie_meteorological_observation: "Meteorological Observation"
 je_curie_meteorological_observation_reason: "[ROOT.GetCountry.GetCustom('je_curie_meteorological_observation_active_type')]A [concept_curie_meteorological_physicist] devotes himself entirely to his meteorological studies. These consist of observing weather and temperature, studying and describing clouds, and keeping climate records.\n\nMeteorological observations have a direct impact on the collected data. A meteorologist's experience is crucial in this regard. A well-equipped weather station earns extra points.\nA meteorologist may collect #R 1#! to #G 10#! @curie_physical_data!#! [concept_curie_physical_data] per year.\n\n$mr_divider_for_je$\nOur meteorologist is expected to collect [GetPlayer.MakeScope.ScriptValue('curie_meteorological_observation_yearly_physical_data_value')|+=0] @curie_physical_data!#! [concept_curie_physical_data]."
 je_curie_meteorological_observation_active_loc: "#p 이 과제는 현재 활성화된 상태입니다.#!\n$mr_divider_for_je$\n"
