 je_curie_agricultural_weather_service: "농업 기상 예보"
 je_curie_agricultural_weather_service_reason: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] has dedicated [ROOT.Var('curie_physicist_var').GetCharacter.GetHerselfHimself] entirely to agricultural meteorology—[ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis] weather reports focus on forecasts that are particularly important to the country's farmers. Whether it's droughts, storms, or floods, the local agricultural sector's preparedness ensures that the impact of meteorological and climatic conditions is less severe than it would otherwise be, since farmers are forewarned.\n\nThe strenght of the [concept_modifier] depends largely on a [concept_curie_meteorological_physicist]'s experience."
 je_curie_marine_weather_service: "해상 예보"
 je_curie_marine_weather_service_reason: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] has given an undertaking to the Ministry of the Navy to make shipping—and by that we mean, above all, the fleet—safer and to forecast potential storms or other dangers at sea. This is likely to be particularly useful in times of war.\n\nThe strenght of the [concept_modifier] depends largely on a [concept_curie_meteorological_physicist]'s experience."
 curie.501.t: "기상 예보 종료"
 curie.501.d: "지난 수년 동안 국가를 대신하여 일반 대중에게 기상 예보를 전해주었던 [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] 박사가 이제 학계로 돌아간다는 소식이다. 대중의 관심이 이제는 점차 버겁게 느껴진다고 한다."
 curie.501.f: "우리 기상학자가 도무지 이해할 수 없는 기계들과 무슨 소린지 전혀 모르겠는 연구에 다시 시간을 쏟으면서 머지않아 예전의 모습으로 돌아갈 것이다. 대체 누가 이런 학문을 진지하게 들어준단 말인가?"
 curie.501.a: "참된 일기예보관이로군!"
 curie.501.b: "참된 일기예보관이로군!"
 curie_weather_station_expansion_cost_modifier: "기상 관측소 확대 예산"
 je_curie_weather_station_expansion: "기상 관측소 확대"
 je_curie_weather_station_expansion_reason: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] works tirelessly at the observatory to bring the weather station there up to date. The condition of the national weather station is of nationwide importance for forecasting weather phenomena."
 je_curie_weather_station_expansion_progress_complete_tt: "진행도가 #V 36#!에 도달"
 curie_weather_station_expansion_progress_bar: "기상 관측소 확대"
 curie_weather_station_expansion_progress_bar_desc: "기상 관측소 확대 진행도: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|1%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/36)"
 curie.502.t: "Weather Station Expanded"
 curie.502.d: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] is proud to announce that the observatory's new weather station is complete. It is now the beating heart of the nation's meteorological system and will improve severe weather warnings nationwide!"
 curie.502.f: "Early standardized observational networks emerged in the 17th and 18th centuries. The invention of the electric telegraph revolutionized observations, allowing real-time data collection across vast areas; later, governments established dedicated national institutions, such as the UK Met Office (1854) and the U.S. Weather Bureau (1870)."
 curie.502.g: "What will the weather be like tomorrow?"
 curie.511.g: "[ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe|U] is a true cloud catcher!"
 curie.521.g: "Those are the second most magnificent cloud I've ever seen!"
 curie.511.d: "또렷한 기상 환경 속에서 [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] 박사는 #V 권운#!을 면밀히 관찰하고 연구하여 새로운 기상학적 결론을 이끌어낼 수 있었다. 이것으로 [GetPlayer.GetName]에서 해당 유형의 구름을 처음으로 기록에 남기게 되었다!"
