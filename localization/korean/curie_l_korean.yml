 curie_rocket_can_construct_only_rocket_tt: "우리나라에 아직 로켓 시험장이 없음"
 curie_mathematics_tech: "수학"
 curie_mathematics_tech_desc: "수학은 수와 양, 도형을 다루는 학문입니다. 수학은 인류의 발전사에서 첨단공학, 항법, 물리학, 복잡한 자원 관리에 필요한 논리적 토대를 마련해 줍니다. "
 je_group_curie_physics: "모르겐뢰테: [concept_curie_physics]"
 je_curie_formula_discovery: "수학 공식"
 je_curie_formula_discovery_reason: "[ROOT.Var('curie_physicist_var').GetCharacter.GetFullName] 박사는 새로운 수학 공식을 알아내고자 노력하고 있다. 인물 특성과 숙련도에 따라 연구 속도를 높일 수 있다. 우리 물리학자는 현재 [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]에 관한 연구를 진행하고 있다."
