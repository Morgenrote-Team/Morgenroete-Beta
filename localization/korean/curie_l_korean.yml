 curie.301.t: "A Reformed Faculty of Mathematics and Engineering"
 curie.301.d: "Dr. [SCOPE.sCharacter('curie_physicist_scope').GetLastName] has achieved [SCOPE.sCharacter('curie_physicist_scope').GetHerHis] goal. Through a visit to the Faculty of Mathematics and Engineering, [SCOPE.sCharacter('curie_physicist_scope').GetSheHe] introduced new research methods and familiarised the next generation of researchers with the latest developments in mathematics.\n\nTotal improved buildings: [GetPlayer.MakeScope.Var('mr_num_improved_mathematics_buildings_var').GetValue|V0]\n$concept_curie_physical_data$ from Project: [GetPlayer.MakeScope.ScriptValue('curie_physical_data_from_mathematics_project_for_event_value')|+0] @curie_physical_data!"
 curie.301.f: "'I've just finished teaching a seminar on Boolean Algebra 101 and nobody got the joke! What a bunch of philistines.'"
 curie.301.g: "A breath of fresh air is sweeping through the world of science!"
 je_curie_physics_experiment: "Physics Experiment"
 je_curie_physics_experiment_reason: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] is working on a physics experiment. Whether it succeeds or fails depends largely on [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis] personal [concept_character_trait]. If it succeeds, it will either be a routine experiment or one of historical significance. The latter is possible if no scientist has ever conducted this experiment before and if the right conditions are met—which usually require a specific technology. Every physicist succeeds in conducting only one historic experiment in his or her lifetime."
 je_curie_physics_experiment_complete: "진행도가 #G 40#!에 도달"
