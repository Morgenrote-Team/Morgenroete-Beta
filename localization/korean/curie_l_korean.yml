 je_curie_mathematical_innovation_reason: "[ROOT.GetCountry.GetCustom('je_curie_mathematical_innovation_active_type')]A [concept_curie_mathematical_physicist] who is not employed contributes to a country's mathematical innovation. Mathematical innovation refers to the sum of international mathematical innovation and national mathematical innovation. International mathematical innovation is calculated based on the total number of mathematical formulas discovered. National mathematical innovation is calculated based on all formulas discovered by a nation itself.\n\nMathematical innovation increases the maximum innovation capacity and reduces the penalty for researching technologies that are ahead of their time. If a new formula is discovered, the modifier is adjusted at the end of the year to increase mathematical innovation."
