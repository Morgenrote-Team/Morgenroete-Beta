 curie.21.t: "질량-에너지 등가성"
 curie.21.d: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName](이)가 간단한 방정식을 이용한 자연 법칙을 새롭게 발견하였다. 이 방정식은 물체의 질량 m과 잔류 에너지 E가 서로 비례한다는 것을 나타내고 있다. 공식은 다음과 같다.\nE=mc²"
 curie.21.f: "'기적의 해'(Annus Mirabilis)로 불리우는 1905년, 알베르트 아인슈타인은 자신이 세운 특수 상대성 이론을 통해 질량 에너지 등가성(E=mc²)을 발표하였다. 19세기 전기역학과 보전법칙의 발전을 바탕으로 아인슈타인은 질량과 에너지가 동일한 물리적 실체에 있어 상호 교환이 가능한 측면임을 증명하여 근대물리학에 변혁을 일으켰다."
 curie.21.g: "정말 천재군!"
 curie.22.t: "바다의 바람과 해류에 관한 논문"
 curie.22.d: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName](은)는 한 논문 통해 지구의 중위도 지역에 존재하는 바람 순환에 대한 설득력 있는 해설을 처음으로 제시하였다. 이 연구는 벌써부터 기상학 분야에서 표준 참고 문헌으로 거듭나게 되었다!"
 curie.22.f: "1856년 미국 기상학자 윌리엄 퍼렐이 출간한 '바다의 바람과 해류에 관한 논문'은 지구물리학적 유체역학의 근간을 이루는 원칙을 제시하였다. 퍼렐은 하들리의 순환 모델을 확대하여 지구의 자전이 대기와 해양에 어떻게 반영되는지를 수학적으로 증명하고, 훗날 코리올리스 효과라 불리우는 개념을 처음 도입하였다. 그의 연구는 범지구적인 바람대(wind belt)와 중위도 지역의 대기 순환 패턴을 제대로 해설하여 기상학과 해양학 문야에 변혁을 불러일으켰다."
 curie.22.g: "그러니까 바람이란 게 단순 우연이 아니었군?"
 je_curie_decision_problem: "결정 문제"
 je_curie_decision_problem_reason: "1928년 독일의 수학자 다비트 힐베르트가 어떤 문제 하나를 제시하였다. 모든 수학적 명제가 증명 가능한지 여부를 판별할 수 있는 기계적 절차는 존재하는가? 이미 라이프니츠는 수학적 명제의 진리값을 판별하기 위해 기호를 조작하는 기계를 제작하는 꿈을 꾸고 있었다. 그 첫 단계로 명확하고 형식적인 언어가 필요하다는 것을 깨달았고, 후일의 연구 대부분은 그 목표를 향해 나아가는 것이었다. 힐베르트는 1930년까지도 풀 수 없는 문제는 없다고 믿었다."
 je_curie_decision_problem_progress_complete_tt: "진행도가 #V 100#!에 도달"
 je_curie_decision_problem_failed_tt: "다른 나라에서 [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] 박사보다 결정 문제를 더 빨리 해결함"
 curie_physicist_decision_problem_progress_bar: "문제 해결"
 curie_physicist_decision_problem_progress_bar_desc: "문제 해결 진행도: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|1%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/100)"
 curie.311.t: "[ROOT.Var('curie_physicist_var').GetCharacter.GetLastNameNoFormatting] 머신"
 curie.311.d: "[ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] 박사가 특이한 사고 실험을 활용하여 결정 문제에 해답을 제시하였는데, 그것이 복잡하고 해결할 수 없다는 결론이었다."
 curie.311.f: "튜링 머신은 영국의 수학자 앨런 튜링이 1936년 수학의 토대와 결정 문제에 관한 연구 과정에서 소개한 수학적 모델이다. 튜링 머신은 셀로 나뉜 무한한 길이의 테이프, '읽기'와 '쓰기'의 헤드, 기계가 테이프를 읽고 쓰고 이동하는 방식을 다루는 사전 정의된 여러 수칙으로 이루어진다. 튜링 머신은 이 수칙에 따라 기호를 조작하면서 알고리즘을 통해 가능한 모든 계산을 수행할 수 있다. 튜링 머신의 의의는 현대 컴퓨팅의 이론적 토대를 마련한 데에 있다. 즉 하나의 범용 기계가 다른 모든 계산 기계를 시뮬레이션할 수 있음을 보여주면서 범용 컴퓨팅이라는 개념을 도입한 것이다. 비록 실체가 있는 컴퓨터로 설계된 것은 아니지만, 튜링 머신은 컴퓨터과학의 근본을 이루는 모델이 되어 프로그래밍 언어, 알고리즘, 오늘날의 컴퓨터 아키텍처의 발전에 지대한 영향을 끼쳤다."
 curie.311.g: "솔직히 무슨 말인지 하나도 못 알아 듣겠지만 제법 혁신적인 것 같군."
 curie_turing_machine_modifier: "튜링 머신"
 curie.313.t: "다른 국가에서 결정 문제 해결"
 curie.313.d: "오늘 수학 학술지를 읽던 [ROOT.Var('curie_physicist_var').GetCharacter.GetFullName] 박사는 다른 수학자가 본인이 오랜 시간동안 숙고해 왔던 결정 문제를 풀었다는 소식을 접하고 충격에 빠지고 말았다. 이번 성과에 박사가 완전히 망연자실한 것은, 그 해법마저도 자신의 것과 별반 다르지 않았다는 점에서였다..."
