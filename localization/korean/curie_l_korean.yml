 je_curie_formula_discovery_failed_tt: "다른 나라에서 [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] 박사보다 공식을 더 빨리 발견함"
 curie_add_discovered_formula_effect_tt: "[GetPlayer.GetName]에서 #V [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]#!(을)를 정립함"
