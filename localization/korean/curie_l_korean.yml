 curie.201.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]"
 curie.201.d: "이번엔 사실인가, 아니면 [ROOT.Var('curie_physicist_var').GetCharacter.GetFullName] 박사가 머릿속에 또 이상한 꿈을 헤아리며 완성된 공식과 마주하였던 것인가? 밤샘 연구에 매진했던 박사는 마침내 본인의 연구 결과를 자랑스레 내세우게 되었다. [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')] 분야에 관한 그간의 연구가 마침표를 찍은 것이다."
 curie.201.f: "\"본 학문의 연구에 진지하게 임하는 자들은 모두 그에 관한 열정을 갖게 된다는 점이 늘상 흥미로울 따름이다.\""
 curie.201.g: "그래서 이제 저 칠판은 누가 지워주겠나?"
 curie.202.t: "수학 공식"
 curie.202.d: "[ROOT.Var('curie_physicist_var').GetCharacter.GetFullName] 박사가 수학의 새 분야를 개척하고자 나섰다. 이번 연구에서는 [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')] 분야를 중점적으로 다루게 되었다."
 curie.202.f: "19세기부터 수학적 개념의 기초가 신중한 검토를 거쳐 자리를 잡게 되었다. 오귀스탱루이 코시는 극한에 대한 ε 정의를 확립하였으며, 함수론의 기초를 다졌다. 물리학과 역학은 18세기 미적분학과 서로 맞물려 계속 발전해 나갔으며, 수많은 수학자들이 당시로서는 아직 별개로 구분되지 않던 이론 물리학자로 활동하였다."
 curie.202.g: "그걸로 무언가 유익한 결과가 나왔으면..."
 curie.203.t: "외국의 [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')] 정립"
 curie.203.d: "오늘 [ROOT.Var('curie_physicist_var').GetCharacter.GetFullName] 박사는 서신 교환 과정에서 외국의 동료 학자가 본인의 [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]에 관한 연구에 일격을 날렸다는 사실을 깨닫게 되었다! 이는 곧 경쟁국에서 그 공식을 이미 도출해 낸 것이다."
 curie.203.f: "\"산수에서 지나친 정밀성을 따는 것만큼 수학적 교육의 결여를 더 극명하게 드러내는 것도 없다.\" - 빌헬름 베버"
 curie.203.g: "이런 수학적 영광은 우리 것이어야 했는데!"
