 curie.503.t: "전국 기상 관측망"
 curie.503.d: "[SCOPE.sCharacter('curie_physicist_scope').GetLastName] 박사가 본인의 목표를 달성하였다. 전국 기상 관측망 덕분에 재난 관리나 농업 등 여러 분야에서 기상 현상에 대응하기 위한 예방 조치를 마련할 수 있게 되었다.\n\n개량된 건물 수: [GetPlayer.MakeScope.Var('mr_num_improved_meteorology_buildings_var').GetValue|V0]곳"
 curie.503.f: "\"햇빛 가득한 6월의 일곱 날은 꽃 피으기엔 충분한 시간\n봄에 네가 입었던 햇빛깔의 드레스에 있던 꽃들\n우린 하나 되어 웃었는데 넌 나에게 폭탄을 던지는구나\n난 알아 무언가 이루기에 우린 너무 오래됐단 것을\""
 curie.503.g: "내일은 날이 좀 개려나?"
