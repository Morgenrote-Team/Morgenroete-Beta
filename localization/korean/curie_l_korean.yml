 curie_differential_geometry_tech: "미분기하학"
 curie_differential_geometry_tech_desc: "19세기 가우스가 개척한 미분기하학은 복잡한 수학을 이용하여 곡선과 표면이 현실 세계에서 어떻게 움직이는가를 설명합니다. 원래 정확한 제도 제작과 지구의 측정을 위해 개발된 것으로, 과학자들이 직접 눈으로 재는 대신 공식을 이용하여 모양과 거리를 계산할 수 있게 하였습니다."
