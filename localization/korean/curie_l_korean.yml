 curie.13.t: "Outokumpu"
 curie.13.d: "With the help of Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] and state-of-the-art technologies, we were able to discover a previously unknown copper vein in Outokumpu. It may be the largest deposit in Northeastern Europe!"
 curie.13.f: "Following the discovery of a rich ore deposit in 1910 and the construction of integrated industrial facilities (smelters and refineries), Outokumpu rose to become one of the top five copper producers in Europe in the 1930s and laid the foundation for the modern Finnish metal industry."
 curie.13.g: "Outokumpu will be a center of copper production!"
 je_curie_meteorological_observation: "기상 관측"
 je_curie_meteorological_observation_reason: "[ROOT.GetCountry.GetCustom('je_curie_meteorological_observation_active_type')][concept_curie_meteorological_physicist]가 기상학 연구에 매진하고 있습니다. 이 연구는 날씨와 기온 측정, 구름의 연구와 기록, 기상 기록 관리 등으로 구성됩니다.\n\n기상 관측은 데이터 수집에 직접적인 영향을 줍니다. 이 점에 있어서 기상학자의 경험치가 매우 중요합니다. 기상 관측소의 장비가 우수하다면 추가 점수를 획득할 수 있습니다.\n기상학자는 매년 @curie_physical_data!#! [concept_curie_physical_data]를 최소 #R 1#!건에서 최대 #G 10#!건까지 수집할 수 있습니다.\n\n$mr_divider_for_je$\n우리 기상학자가 수집할 것으로 예상되는 @curie_physical_data!#! [concept_curie_physical_data]의 수는 총 [GetPlayer.MakeScope.ScriptValue('curie_meteorological_observation_yearly_physical_data_value')|+=0]건입니다."
