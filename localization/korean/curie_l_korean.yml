 curie.503.t: "A National Network of Weather Stations"
 curie.503.d: "Dr. [SCOPE.sCharacter('curie_physicist_scope').GetLastName] has achieved [SCOPE.sCharacter('curie_physicist_scope').GetHerHis] goal. Thanks to the nationwide network of weather stations, precautions are in place to deal with meteorological events, whether in the context of disaster management or agriculture.\n\nTotal improved buildings: [GetPlayer.MakeScope.Var('mr_num_improved_meteorology_buildings_var').GetValue|V0]"
 curie.503.f: "'Seven days in sunny June but long enough to bloom\nThe flowers on the summer dress you wore in spring\nThe way we laughed as one and then you dropped the bomb\nThat I've know you too long for us to have a thing'"
 curie.503.g: "Will the sun be shining tomorrow?"
