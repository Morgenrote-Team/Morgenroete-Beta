 curie.517.d: "또렷한 기상 환경 속에서 [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] 박사는 #V 층적운#!을 면밀히 관찰하고 연구하여 새로운 기상학적 결론을 이끌어낼 수 있었다. 이것으로 [GetPlayer.GetName]에서 해당 유형의 구름을 처음으로 기록에 남기게 되었다!"
