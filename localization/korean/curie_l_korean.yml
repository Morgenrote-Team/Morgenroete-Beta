 je_curie_improve_meteorology_project: "기상 관측망"
 je_curie_improve_meteorology_project_reason: "우리 [concept_curie_physicist] [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] 박사가 [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]의 [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName]에 기상 관측소를 확충하는 작업에 주력하고 있습니다.\n$mr_divider_for_je$\n이 사업은 매달 진행도를 얻습니다. 진행도가 24점에 도달할 때마다 현재 건물에 새로운 변화 요인이 부여됩니다. 이 사업에 선정된 모든 건물이 변화 요인을 부여받게 되었다면 사업은 끝이 납니다.\n변화 요인은 총 세 가지가 존재합니다. 각각의 새로운 변화 요인마다 진행도를 다시 채워야 합니다.\n$mr_divider_for_je$\n현재 건물: [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]의 [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_meteorology_project_modifier_1_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_meteorology_project_modifier_2_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_meteorology_project_modifier_3_type')]\n\n남은 건물 수 (현재 건물 제외): [JournalEntry.MakeScope.Var('mr_number_of_remaining_list_entries_var').GetValue|V0]곳#!"
