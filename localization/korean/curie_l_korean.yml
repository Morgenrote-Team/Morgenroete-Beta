 curie_mathematical_physicist: "수학자"
 curie_mathematical_physicist_desc: "이 인물은 수학계에서 몇 가지 놀라운 발견을 이루어냈기에 국민들부터 큰 존경을 받고 있습니다."
 curie_meteorological_physicist: "기상학자"
 curie_meteorological_physicist_desc: "기상학자는 날씨를 관측하는 과학자로, 추후 날씨가 어떻게 될지를 예측하고자 노력하는 사람입니다."
 curie_rocket_physicist: "로켓물리학자"
 curie_rocket_physicist_desc: "로켓물리학자는 새로운 유형의 로켓에 관한 이론, 설계, 제작 등 도대체 쓸모가 있긴 한건가 싶은 연구 분야에 몸담는 과학자입니다."
 curie_nuclear_physicist: "핵물리학자"
 curie_nuclear_physicist_desc: "이런 부류의 물리학자는 절대 인류 사회에 풀어놓아서는 안 될 것이며, 최상위 보안 조치가 이루어진 실험실 안에 가두어야 마땅합니다."
 building_curie_rocket: "로켓 시험장"
 pmg_curie_rocket_test: "로켓 시험장"
 pm_curie_rocket_test: "로켓 시험장"
