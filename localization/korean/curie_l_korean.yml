 building_curie_facility: "핵 연구 시설"
 pmg_curie_nuclear_research_facility: "핵 연구 시설"
 pm_curie_nuclear_research_facility: "핵 연구 시설"
 building_curie_reactor: "원자력 발전소"
 pmg_curie_nuclear_reactor: "원자력 발전소"
 pm_curie_nuclear_reactor: "원자력 발전소"
 curie_nuclear_reactor_tech: "원자력 발전소"
 curie_nuclear_reactor_tech_desc: "핵분열을 통제하기 위한 여정은 1942년 시카고 파일-1이라는 세계 최초의 인공 원자로가 건설되면서 시작되었습니다. 이 원자로는 경기장 관중석 아래에 설치되어 자발적인 연쇄반응을 보여주었습니다. 이를 바탕으로 미국 테네시주에 X-10 흑연 원자로가 건설되어, 플루토늄의 대량 생산과 고강도 방사선 관리를 시험하는 예비시설로 삼았습니다. 이 시대의 정점은 세계 최초의 본격적인 산업용 원자로인 핸포드의 B 원자로였으며 이를 통해 핵발전의 산업계 응용이 마침내 현실화되었습니다."
 curie_the_bomb_tech: "그 폭탄"
 curie_the_bomb_tech_desc: "\"나는 이제 죽음이요, 세상의 파괴자가 되었도다.\""
 curie_nuclear_fission_tech: "핵분열"
 curie_nuclear_fission_tech_desc: "1930년대 말 학계에서는 중성자를 충돌시켜 중핵을 분열시키는 데 처음으로 성공함으로써 과거에는 상상할 수조차 없었던 물질 내부의 에너지원을 발견하였습니다. 이러한 과학적 돌파구는 이론물리학에서 우주를 구성하는 힘을 실질적으로 이해하는 단계로 나아갔음을 알리는 계기가 되었습니다."
 curie_facility_can_construct_only_facility_tt: "우리나라에 아직 핵 연구 시설이 없음"
 curie_rocket_science_tech: "로켓과학"
 curie_rocket_science_tech_desc: "20세기로 접어들 무렵 로켓 과학은 공상과학 소설에서 벗어나 엄밀한 이론적 토대를 마련하게 되었는데 그 이면에는 러시아의 선구자 콘스탄틴 치올코프스키의 이론 개척이 큰 역할을 했습니다. 치올코프스키는 1903년 획기적인 저서를 통해 로켓의 기본 방정식을 도출하여 다단 로켓과 액체 추진제를 이용한 우주 여행이 수학적으로 가능하다는 것을 증명하였습니다. 트란실바니아계 독일인 물리학자 헤르만 오베르트 역시 1920년대에 우주항행학의 원칙을 독자적으로 개발하여, 훗날 최초의 실용적인 로켓 공학자들에게 영감을 주는 공학적 청사진을 제시하였습니다."
 curie_modern_rockets_tech: "현대적 로켓"
 curie_modern_rockets_tech_desc: "로버트 고다드는 최초의 액체 연료 로켓을 발사하고 자이로스코프 안정화 장치처럼 핵심 체계를 개발함으로서 로켓 과학을 실용화 시대로 이끌었습니다. 독일에서는 우주로켓협회 (Verein für Raumschiffahrt)를 통해 연구가 활발히 이루어졌는데, 그곳에 참여했던 젊은 과학자 베르너 폰 브라운이 대규모 추진에 필요한 공학기술을 개선하기 시작하였습니다. 이 시기에는 궁극적으로 기술이 개인적인 실험에서 대대적인 국가 지원 사업으로 전환되는 계기가 되었으며, 우주의 초입까지 도달할 수 있는 최초의 로켓 개발로 이어졌습니다."
