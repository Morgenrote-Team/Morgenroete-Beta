 curie.520.d: "또렷한 기상 환경 속에서 [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] 박사는 #V 적란운#!을 면밀히 관찰하고 연구하여 새로운 기상학적 결론을 이끌어낼 수 있었다. 이것으로 [GetPlayer.GetName]에서 해당 유형의 구름을 처음으로 기록에 남기게 되었다!"
 curie.521.d: "[ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] 박사는 본인의 눈을 믿을 수 없었다. [SCOPE.sState('curie_cloud_state').GetCityHubName]의 길거리를 걷던 중에 문득 하늘에 은빛 실이 펼쳐진 것을 포착한 것이다. 이건 어쩌면 지금까지 존재가 알려지지 않았던 구름 유형이 아닌가?"
 curie.522.d: "극지 탐사 과정에서 비행선 대원들이 엄청난 발견을 이룩하였다. 갑자기 무지개빛 구름이 하늘에 나타난 것이다! 마치 자개를 하늘에 내걸어놓은 듯한 모습이었다!"
