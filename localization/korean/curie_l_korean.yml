 curie.531.t: "[GetPlayer.GetAdjectiveNoFormatting] 라디오존데"
 curie.531.d: "숱한 실패 끝에 오늘 [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] 박사가 [GetPlayer.GetName]에서는 최초로 성층권에 라디오존데를 띄워놓았다! 이 장비는 완벽한 기상 측정 자료를 지상에 전송하여, 불과 수십년 전만 하더라도 상상조차 할 수 없었던 기상 관측에 관한 통찰력을 제공하게 된다."
 curie.531.f: "라디오존데는 기상 관측 기구로 하늘 높이 띄워지는 경량형 원격측정 장비로, 1920년대 후반에 개발되어 성층권 기상학에 큰 변혁을 불러일으켰다. 레옹 테이세랑 드 보르와 리하르트 아스만의 선구적인 대기 자료 수집 연구가 있은 뒤, 프랑스의 기상학자 로베르 부로가 라디오존데라는 말을 처음 만들었으며, 1929년 1월 7일 프랑스 트라페에서 최초의 전파 통신 음향 장비를 성공적으로 발사하였다. 뒤이어 소련의 기상학자 파벨 몰차노프가 비슷한 기구를 독자 개발하였으며, 1930년 1월 30일 소련 파블롭스크에서 기념비적인 비행을 달성하였다. 라디오존데는 온도, 기압, 습도 측정 자료를 전파로 실시간으로 전송하여, 비용이 많이 들고 시간도 오래 걸리는 계측기 회수 작업을 대체하고 현대적인 종관기상예보(넓은 지역의 동시 관측 기상 예보)를 가능케 하였다."
 curie.531.g: "예측할 수 없는 것이 예측 가능해졌고, 좌우할 수 없던 것을 좌우할 수 있는 시대로군."
 je_curie_radiosonde: "라디오존데"
 je_curie_radiosonde_reason: "라디오존데는 기상학계에서 지구의 약 20km~35km에 달하는 고도(성층권)의 대기를 이루는 각 변수를 측정하는 용도로 사용된다. 기상 관측 기구로 띄워 대기의 기온과 변화, 습도 등의 측정 결과를 전파를 통해 지상의 수신소로 전송한다.\n\n라디오존데는 기상 예보의 정확도를 대폭 늘려줄 것으로 전망된다. 세계 최초로 라디오존데를 성층권에 띄우게 된다면 그 이익은 훨씬 더 커질 것이다."
