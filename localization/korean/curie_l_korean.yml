 curie.301.t: "새단장을 맞이한 수학·공학부"
 curie.301.d: "[SCOPE.sCharacter('curie_physicist_scope').GetLastName] 박사가 목표를 달성했다. 수학·공학부의 방문을 통해 새로운 연구 방법을 소개하고, 다음 세대 학자들에게 수학계의 최신 발전 동향을 널리 알렸다.\n\n개선된 건물 수: [GetPlayer.MakeScope.Var('mr_num_improved_mathematics_buildings_var').GetValue|V0]곳\n본 과제로 획득한 $concept_curie_physical_data$: @curie_physical_data! [GetPlayer.MakeScope.ScriptValue('curie_physical_data_from_mathematics_project_for_event_value')|+0]"
 curie.301.f: "\"불 대수의 기초에 관한 세미나 강연을 이제 막 끝냈는데, 내 농담에 아무도 웃어주지 않더라니까! 거 참 이렇게나 교양들이 없어서야.\""
 curie.301.g: "학계에 신선한 바람을 불어넣었군!"
 je_curie_physics_experiment: "물리학 실험"
 je_curie_physics_experiment_reason: "[ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] 박사는 물리학 실험을 진행하고 있다. 이 실험의 성패 여부는 박사의 개인 [concept_character_trait]에 크게 달려 있다. 실험이 성공하면 늘상 있는 실험이냐, 역사에 길이 남을 실험이냐가 판가름나게 된다. 후자의 경우 지금까지 어떤 과학자도 그 실험을 하지 않았고 적절한 여건을 갖췄을 경우, 대체로 특정 기술을 연구했을 경우라면 가능해진다. 물리학자는 일생에 단 한 차례만 역사적인 실험을 완수할 수 있다."
