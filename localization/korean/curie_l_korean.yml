 alert_curie_geomagnetics_possible_alert_name: "[concept_curie_physicist]의 지자기학 연구 수행 가능"
 alert_curie_geomagnetics_possible_alert_hint: "우리 [concept_curie_physicist]가 #b 지자기학 연구#!를 수행할 수 있습니다. 여기에는 지자기 학회 창설, 지자기 학회 가입, 지자기 관측소 설립, 지자기 현황도 제작 등의 활동을 아우릅니다.\n\n수학 탭의 물리학자 란으로 가서 수학 공식/구름 도감/로켓학/핵물리학 칸 아래에 있는 개요를 여십시오."
