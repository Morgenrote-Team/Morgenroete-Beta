 je_curie_agricultural_weather_service: "Agricultural Weather Service"
 je_curie_agricultural_weather_service_reason: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] has dedicated [ROOT.Var('curie_physicist_var').GetCharacter.GetHerselfHimself] entirely to agricultural meteorology—[ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis] weather reports focus on forecasts that are particularly important to the country's farmers. Whether it's droughts, storms, or floods, the local agricultural sector's preparedness ensures that the impact of meteorological and climatic conditions is less severe than it would otherwise be, since farmers are forewarned.\n\nThe strenght of the [concept_modifier] depends largely on a [concept_curie_meteorological_physicist]'s experience."
 je_curie_marine_weather_service: "Shiping Forecast"
 je_curie_marine_weather_service_reason: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] has given an undertaking to the Ministry of the Navy to make shipping—and by that we mean, above all, the fleet—safer and to forecast potential storms or other dangers at sea. This is likely to be particularly useful in times of war.\n\nThe strenght of the [concept_modifier] depends largely on a [concept_curie_meteorological_physicist]'s experience."
 curie.501.t: "End of Weather Forecast"
 curie.501.d: "Having spent the last few years mainly providing weather forecasts for the general public on behalf of the state, Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] is now returning to the world of science. [ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe|U] was gradually finding the public spotlight a bit too much."
 curie.501.f: "Our meteorologist will soon be back to [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis] old self once [ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe]'s found time again for [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis] utterly baffling instruments and completely nonsensical studies. Who on earth actually takes this science seriously?"
 curie.501.a: "He's the Weather Man!"
 curie.501.b: "She's the Weather Woman!"
 curie_weather_station_expansion_cost_modifier: "Weather Station Expansion Cost"
 je_curie_weather_station_expansion: "Weather Station Expansion"
 je_curie_weather_station_expansion_reason: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] works tirelessly at the observatory to bring the weather station there up to date. The condition of the national weather station is of nationwide importance for forecasting weather phenomena."
 je_curie_weather_station_expansion_progress_complete_tt: "진행도가 #V 36#!에 도달"
 curie_weather_station_expansion_progress_bar: "기상 관측소 확대"
 curie_weather_station_expansion_progress_bar_desc: "기상 관측소 확대 진행도: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|1%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/36)"
 curie.502.t: "Weather Station Expanded"
 curie.502.d: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] is proud to announce that the observatory's new weather station is complete. It is now the beating heart of the nation's meteorological system and will improve severe weather warnings nationwide!"
 curie.502.f: "Early standardized observational networks emerged in the 17th and 18th centuries. The invention of the electric telegraph revolutionized observations, allowing real-time data collection across vast areas; later, governments established dedicated national institutions, such as the UK Met Office (1854) and the U.S. Weather Bureau (1870)."
 curie.502.g: "What will the weather be like tomorrow?"
 curie.511.g: "[ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe|U] is a true cloud catcher!"
 curie.521.g: "Those are the second most magnificent cloud I've ever seen!"
 curie.511.d: "Under clear weather conditions, Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] was able to closely observe and study the #V Cirrus Clouds#! and draw new meteorological conclusions from them. This marks the first time this type of cloud has been described in [GetPlayer.GetName]!"
 curie.512.d: "Under clear weather conditions, Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] was able to closely observe and study the #V Cirrocumulus Clouds#! and draw new meteorological conclusions from them. This marks the first time this type of cloud has been described in [GetPlayer.GetName]!"
 curie.513.d: "Under clear weather conditions, Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] was able to closely observe and study the #V Cirrostratus Clouds#! and draw new meteorological conclusions from them. This marks the first time this type of cloud has been described in [GetPlayer.GetName]!"
 curie.514.d: "Under clear weather conditions, Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] was able to closely observe and study the #V Altocumulus Clouds#! and draw new meteorological conclusions from them. This marks the first time this type of cloud has been described in [GetPlayer.GetName]!"
 curie.515.d: "Under clear weather conditions, Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] was able to closely observe and study the #V Altostratus Clouds#! and draw new meteorological conclusions from them. This marks the first time this type of cloud has been described in [GetPlayer.GetName]!"
 curie.516.d: "Under clear weather conditions, Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] was able to closely observe and study the #V Nimbostratus Clouds#! and draw new meteorological conclusions from them. This marks the first time this type of cloud has been described in [GetPlayer.GetName]!"
 curie.517.d: "Under clear weather conditions, Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] was able to closely observe and study the #V Stratocumulus Clouds#! and draw new meteorological conclusions from them. This marks the first time this type of cloud has been described in [GetPlayer.GetName]!"
 curie.518.d: "Under clear weather conditions, Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] was able to closely observe and study the #V Stratus Clouds#! and draw new meteorological conclusions from them. This marks the first time this type of cloud has been described in [GetPlayer.GetName]!"
 curie.519.d: "Under clear weather conditions, Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] was able to closely observe and study the #V Cumulus Clouds#! and draw new meteorological conclusions from them. This marks the first time this type of cloud has been described in [GetPlayer.GetName]!"
 curie.520.d: "Under clear weather conditions, Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] was able to closely observe and study the #V Cumulonimbus Clouds#! and draw new meteorological conclusions from them. This marks the first time this type of cloud has been described in [GetPlayer.GetName]!"
 curie.521.d: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] can't believe [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis] eyes: whilst out for a walk in [SCOPE.sState('curie_cloud_state').GetCityHubName], [ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe] suddenly spots silver threads in the sky. Could this be a type of cloud that's been completely unknown until now?"
 curie.522.d: "During the polar expedition, the zeppelin's crew made an extraordinary discovery: all of a sudden, rainbow-coloured clouds appeared in the sky! It looked as though mother-of-pearl were hanging in the sky!"
