 curie.521.d: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] can't believe [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis] eyes: whilst out for a walk in [SCOPE.sState('curie_cloud_state').GetCityHubName], [ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe] suddenly spots silver threads in the sky. Could this be a type of cloud that's been completely unknown until now?"
 curie.522.d: "During the polar expedition, the zeppelin's crew made an extraordinary discovery: all of a sudden, rainbow-coloured clouds appeared in the sky! It looked as though mother-of-pearl were hanging in the sky!"
