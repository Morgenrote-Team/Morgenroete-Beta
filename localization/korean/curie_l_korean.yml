 je_curie_magnetic_observation: "지자기 관측"
 je_curie_magnetic_observation_reason: "카를 프리드리히 가우스는 1832년 괴팅겐에 최초의 지구물리학 관측소를 설립하고 정밀 자기계측기를 구축하였다. 가우스는 자기장 변동의 원인을 파악하고 정자기장을 정확히 측정하기 위해서는 지구상 곳곳에 분산되어 동시에 측정을 실시해야 한다는 사실을 깨달았다. 이러한 목적을 안고 1836년 출범한 지자기 학회와 영국 왕립학회는 측정 데이터를 전달하여 분석할 수 있도록 하였다. 전세계 각지에 분산된 여러 관측소를 이용하여 지자기장의 변동을 동시에 측정하는 것이 그 목표였다.  이 사업에는 유럽 관측소 35곳, 아시아 6곳, 아프리카 2곳, 북미 3곳, 오세아니아 4곳을 비롯하여 총 50곳의 관측소가 참여하였다. 측정 결과는 괴팅겐으로 전송되어 가우스와 빌헬름 베버가 과학적으로 분석하게 되었다."
 je_curie_magnetic_observation_goal: "Collect #G 100#! @curie_magnetic_data_var! [concept_curie_magnetic_data]. This is an international effort, every member of the Magnetic Association will contribute."
 je_curie_magnetic_atlas: "지자기 현황도"
 je_curie_magnetic_atlas_reason: "1830년대에 이르러 가우스와 베버는 괴팅겐 지자기 학회를 설립하였다. 두 사람은 지자기장의 강도와 방향을 표준 절차에 따라 꾸준히 측정할 범지구적 관측망을 구축하였다. 가우스는 지자기장을 구체화할 수학 이론인 '퍼텐셜 이론'을 개발하였다. 이를 활용하여 직접적인 측정이 이루어지지 않는 지역까지도 아우르는, 지구 표면 전체의 자기장을 계산할 수 있었다."
