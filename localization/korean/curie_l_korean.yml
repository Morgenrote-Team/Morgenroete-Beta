 curie.13.t: "오우토쿰푸"
 curie.13.d: "[ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] 박사의 협력과 최첨단 기술 덕분에 오우토쿰푸에서 지금껏 알려지지 않았던 구리 매장지를 발견해낼 수 있었다. 그것도 북동부 유럽 최대의 매장지인 것으로 보인다!"
 curie.13.f: "핀란드의 오우토쿰푸는 1910년 풍부한 구리 매장지가 발견되고 제련소와 정제공장을 비롯한 통합 산업 시설이 조성되면서, 1930년대부터 유럽에서 다섯번째로 큰 구리 생산지 중 하나로 거듭나며 핀란드의 근대 철강 산업의 토대가 되었다."
 curie.13.g: "오우토쿰푸는 구리 생산의 중심지가 될 것이다!"
 je_curie_meteorological_observation: "기상 관측"
 je_curie_meteorological_observation_reason: "[ROOT.GetCountry.GetCustom('je_curie_meteorological_observation_active_type')][concept_curie_meteorological_physicist]가 [Concept('concept_curie_meteorology','$je_curie_meteorological_observation|q$')] 과정에서 기상학 연구에 매진하고 있습니다. 이 연구는 날씨와 기온 측정, 구름의 연구와 기록, 기상 기록 관리 등으로 구성됩니다.\n\n기상 관측은 데이터 수집에 직접적인 영향을 줍니다. 이 점에 있어서 기상학자의 경험치가 매우 중요합니다. 기상 관측소의 장비가 우수하다면 추가 점수를 획득할 수 있습니다.\n기상학자는 매년 @curie_physical_data!#! [concept_curie_physical_data]를 최소 #R 1#!건에서 최대 #G 10#!건까지 수집할 수 있습니다.\n\n$mr_divider_for_je$\n우리 기상학자가 수집할 것으로 예상되는 @curie_physical_data!#! [concept_curie_physical_data]의 수는 총 [GetPlayer.MakeScope.ScriptValue('curie_meteorological_observation_yearly_physical_data_value')|+=0]건입니다."
