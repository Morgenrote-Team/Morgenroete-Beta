 je_curie_improve_mathematics_project: "수학 증진"
 je_curie_improve_mathematics_project_reason: "[concept_curie_physicist] [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] 박사가 [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]의 [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName]을 대상으로 생산량 증진에 주력하고 있습니다.\n$mr_divider_for_je$\n이 과제는 매달 진행도를 얻습니다. 진행도가 24점에 도달할 때마다 현재 건물에 새로운 변화 요인이 부여됩니다. 본 과제의 대상으로 선택된 건물에 변화 요인이 전부 부여되면 과제는 종료됩니다.\n변화 요인은 총 세 가지가 존재합니다. 각각의 변화 요인을 부여받으려면 그때마다 진행도를 채워야 합니다.\n[GetBuildingType('building_university').GetName]에 모든 변화 요인이 부여되면 @curie_physical_data! [concept_curie_physical_data] #p 1#!을 추가로 획득합니다.\n$mr_divider_for_je$\n현재 건물: [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]의 [[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_mathematics_project_modifier_1_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_mathematics_project_modifier_2_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_mathematics_project_modifier_3_type')]\n\n남은 건물 수 (현재 건물 제외): [JournalEntry.MakeScope.Var('mr_number_of_remaining_list_entries_var').GetValue|V0]곳\n과제로 얻은 $concept_curie_physical_data$: @curie_physical_data! [JournalEntry.MakeScope.ScriptValue('curie_physical_data_from_mathematics_project_value')|+0]#!#!"
