 je_curie_improve_mathematics_project: "Improve Mathematics"
 je_curie_improve_mathematics_project_reason: "Your [concept_curie_physicist] Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] focuses on improving the production of the [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] in [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName].\n$mr_divider_for_je$\nThe project will get progress every month. Every time the progress reaches 24 the current building will receive a new modifier. Once all chosen buildings for this project have the modifiers, the project ends.\nThere is a total number of 3 modifiers. Each new modifier needs the progress to fill up again.\nOnce a [GetBuildingType('building_university').GetName] has all modifiers you will also gain #p 1#! @curie_physical_data! [concept_curie_physical_data].\n$mr_divider_for_je$\nCurrent Building: [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] in [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_mathematics_project_modifier_1_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_mathematics_project_modifier_2_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_mathematics_project_modifier_3_type')]\n\nTotal Remaining Buildings (excluding current): [JournalEntry.MakeScope.Var('mr_number_of_remaining_list_entries_var').GetValue|V0]\n$concept_curie_physical_data$ from Project: [JournalEntry.MakeScope.ScriptValue('curie_physical_data_from_mathematics_project_value')|+0] @curie_physical_data!#!#!"
