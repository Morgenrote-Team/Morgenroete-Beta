l_german:
 glossary_curie_complex_analysis: "$curie_complex$ $curie_analysis$"
 glossary_curie_complex_analysis_desc: "Die #b;italic $glossary_curie_complex_analysis$#! ist ein Teilgebiet der Mathematik, das sich mit Funktionen befasst, die auf komplexen Zahlen basieren, welche reelle und imaginäre Zahlen kombinieren. Sie findet in der Physik und im Ingenieurwesen breite Anwendung, um Wellenmuster, Strömungsdynamik und elektrische Schaltungen zu analysieren."
 glossary_curie_differential_equation: "$curie_differential$ $curie_equation$"
 glossary_curie_differential_equation_desc: "#b;italic $glossary_curie_differential_equation$#! sind Gleichungen, die Funktionen mit ihren Änderungsraten in Beziehung setzen. Sie beschreiben, wie sich physikalische Größen über Zeit oder Raum hinweg entwickeln, und sind daher unverzichtbar für die Modellierung von Planetenbewegungen, Bevölkerungswachstum, Klimasystemen und Wärmeübertragung."
 glossary_curie_fourier_analysis: "$mr_fourier$-$curie_analysis$"
 glossary_curie_fourier_analysis_desc: "Die #b;italic $glossary_curie_fourier_analysis$#! ist ein Verfahren, bei dem komplexe Signale, Wellen oder Funktionen in einfache Sinus- und Kosinus-Komponenten zerlegt werden. Sie ist von grundlegender Bedeutung für die moderne Signalverarbeitung, Bildkompression, Audio-Streaming und Telekommunikation."
 glossary_curie_non_euclidean_geometry: "Nichteuklidische $curie_geometry$"
 glossary_curie_non_euclidean_geometry_desc: "Der #b;italic $glossary_curie_non_euclidean_geometry$#! befasst sich mit Geometrie, die auf nicht-ebenen Flächen basiert, auf denen sich parallele Geraden schneiden oder auseinanderlaufen können. Die sphärische Geometrie modelliert die gekrümmte Oberfläche von Planeten, während die hyperbolische Geometrie dabei hilft, die Raumzeit in der allgemeinen Relativitätstheorie zu erklären."
 glossary_curie_group_theory: "Gruppen$curie_theory$"
 glossary_curie_group_theory_desc: "#b;italic $glossary_curie_group_theory$#! ist die Lehre von algebraischen Strukturen, die Symmetrie und Transformationen beschreiben. Sie bietet eine formale Sprache zur Analyse von Symmetrien in geometrischen Formen, chemischen Molekülen, subatomaren Teilchen und kryptografischen Algorithmen."
 glossary_curie_linear_algebra: "Lineare Algebra"
 glossary_curie_linear_algebra_desc: "#b;italic $glossary_curie_linear_algebra$#! ist der Zweig der Mathematik, der sich mit Vektorräumen, Vektoren und Matrizen befasst. Er bildet die zentrale mathematische Grundlage für 3D-Computergrafik, Algorithmen des maschinellen Lernens, Quantenmechanik und die Analyse großer Datenmengen."
 glossary_curie_abstract_algebra: "Abstrakte Algebra"
 glossary_curie_abstract_algebra_desc: "#b;italic $glossary_curie_abstract_algebra$#! befasst sich mit der Untersuchung algebraischer Strukturen wie Gruppen, Ringe und Körper und nicht mit bestimmten Zahlen. Es untersucht zugrunde liegende Regeln und Symmetrien und bildet die Grundlage für die moderne Kryptografie, die Codierungstheorie und die theoretische Physik."
 glossary_curie_navier_stokes_equations: "Navier-Stokes-Gleichungen"
 glossary_curie_navier_stokes_equations_desc: "Die #b;italic $glossary_curie_navier_stokes_equations$#! sind eine Reihe von partiellen Differentialgleichungen, die die Bewegung von Flüssigkeiten beschreiben. Sie modellieren das Verhalten viskoser Flüssigkeiten und sind für Wettervorhersagen, die Vorhersage von Meeresströmungen, die Aerodynamik und die Simulation von Rohrleitungssystemen unverzichtbar."
 glossary_curie_mathematical_logic: "Mathematische Logik"
 glossary_curie_mathematical_logic_desc: "#b;italic $glossary_curie_mathematical_logic$#! ist die Lehre von der formalen Logik in der Mathematik. Sie befasst sich mit der Analyse von Beweissystemen, Wahrheit und Berechnungsgrenzen und bildet die theoretische Grundlage für Softwareentwicklung und künstliche Intelligenz."
 glossary_curie_analytical_number_theory: "Analytische Zahlen-$curie_theory$"
 glossary_curie_analytical_number_theory_desc: "Die #b;italic $glossary_curie_analytical_number_theory$#! ist ein Teilgebiet, das Methoden der Analysis und der komplexen Analysis nutzt, um Probleme im Zusammenhang mit ganzen Zahlen zu lösen. Sie befasst sich vor allem mit der Verteilung von Primzahlen, modularen Formen und additiven Zahlenmustern."
 glossary_curie_algebraic_number_theory: "Algebraische Zahlen-$curie_theory$"
 glossary_curie_algebraic_number_theory_desc: "Die #b;italic $glossary_curie_algebraic_number_theory$#! ist ein Teilgebiet, das abstrakte Algebra zur Untersuchung von ganzen Zahlen und algebraischen Zahlen anwendet. Sie löst Faktorisierungsprobleme in Zahlkörpern und bildet die Grundlage für die moderne Public-Key-Kryptografie, einschließlich Verschlüsselungssysteme auf Basis elliptischer Kurven."
 glossary_curie_em_field_equations: "EM-Feldgleichungen"
 glossary_curie_em_field_equations_desc: "Die #b;italic $glossary_curie_em_field_equations$#! sind eine Reihe von partiellen Differentialgleichungen, die als Maxwell-Gleichungen bekannt sind und beschreiben, wie elektrische und magnetische Felder mit Materie interagieren. Sie erklären elektromagnetische Wellen, Licht, elektrische Schaltkreise und drahtlose Kommunikation."
 glossary_curie_set_theory: "Mengenlehre"
 glossary_curie_set_theory_desc: "Die #b;italic $glossary_curie_set_theory$#! ist der grundlegende Zweig der Mathematik, der sich mit Sammlungen von Objekten, den sogenannten Mengen, befasst. Sie definiert grundlegende Konzepte wie Unendlichkeit, Relationen und Funktionen und bildet damit die strukturelle Grundlage für fast die gesamte moderne mathematische Logik."
 glossary_curie_topology: "Topologie"
 glossary_curie_topology_desc: "#b;italic $glossary_curie_topology$#! ist die Lehre von räumlichen Eigenschaften, die bei kontinuierlichen Verformungen wie Dehnung oder Biegung unverändert bleiben, ohne dass es zu einem Reißen kommt. Sie findet Anwendung in der Netzwerkanalyse, der Datenanalyse und der Materialphysik."
 glossary_curie_functional_analysis: "Funktionalanalyse"
 glossary_curie_functional_analysis_desc: "#b;italic $glossary_curie_functional_analysis$#! ist ein Teilgebiet, das sich mit unendlich-dimensionalen Vektorräumen und Transformationen zwischen diesen befasst. Es erweitert die lineare Algebra auf die Analysis und liefert den mathematischen Rahmen für die Quantenmechanik und Differentialgleichungen."
 glossary_curie_lie_theory: "Lie-$curie_theory$"
 glossary_curie_lie_theory_desc: "Die #b;italic $glossary_curie_lie_theory$#! befasst sich mit der Untersuchung kontinuierlicher Symmetrien und geometrischer Transformationen. Sie verbindet die Analysis mit der abstrakten Algebra, um kontinuierliche Bewegungen zu beschreiben, und ist daher für die Quantenmechanik und die allgemeine Relativitätstheorie von entscheidender Bedeutung."
 glossary_curie_representation_theory: "Darstellungs-$curie_theory$"
 glossary_curie_representation_theory_desc: "Die #b;italic $glossary_curie_representation_theory$#! ist ein Teilgebiet, das abstrakte algebraische Strukturen in konkrete Operationen auf linearen Vektorräumen übersetzt. Sie ermöglicht die Untersuchung komplexer algebraischer Symmetrien mithilfe von Matrizen und vereinfacht damit Probleme in der Teilchenphysik und Chemie."
 glossary_curie_algebraic_topology: "Algebraische Topologie"
 glossary_curie_algebraic_topology_desc: "#b;italic $glossary_curie_algebraic_topology$#! ist ein Fachgebiet, das sich mithilfe von Methoden der abstrakten Algebra mit topologischen Räumen und stetigen Formen befasst. Es wandelt geometrische Merkmale in algebraische Invarianten um und unterstützt so die Datenanalyse."
 glossary_curie_class_field_theory: "Klassenkörper-$curie_theory$"
 glossary_curie_class_field_theory_desc: "Die #b;italic $glossary_curie_class_field_theory$#! ist ein wichtiger Zweig der algebraischen Zahlentheorie, der abelsche Erweiterungen von Zahlkörpern beschreibt. Sie verbindet arithmetische Eigenschaften mit Reziprozitätsgesetzen und bildet damit die Grundlage für die fortgeschrittene Zahlentheorie und die moderne arithmetische Geometrie."
 glossary_curie_relativity_theory: "Relativitäts-$curie_theory$"
 glossary_curie_relativity_theory_desc: "Die #b;italic $glossary_curie_relativity_theory$#! ist ein grundlegendes physikalisches Rahmenwerk, das Gravitation, Raum und Zeit beschreibt. Sie zeigt, dass Zeit und Raum als Raumzeit miteinander verflochten sind und dass massereiche Objekte dieses Gefüge krümmen, was die Grundlage für die Astrophysik und die Satellitennavigation bildet."
 glossary_curie_quantum_mechanics: "Quantenmechanik"
 glossary_curie_quantum_mechanics_desc: "#b;italic $glossary_curie_quantum_mechanics$#! ist eine physikalische Theorie, die die Natur auf atomarer und subatomarer Ebene beschreibt. Sie ersetzt den klassischen Determinismus durch Wahrscheinlichkeiten und erklärt Phänomene wie die Welle-Teilchen-Dualität und die Verschränkung, die die Grundlage für Halbleiter und Quantencomputer bilden."
 glossary_curie_proof_theory: "Beweis-$curie_theory$"
 glossary_curie_proof_theory_desc: "#b;italic $glossary_curie_proof_theory$#! ist ein Teilgebiet der mathematischen Logik, das mathematische Beweise als formale mathematische Objekte behandelt. Es analysiert die Struktur von Beweisen, ihre Konsistenz und die Grenzen ihrer Beweisbarkeit."
 glossary_curie_cryptography: "Kryptographie"
 glossary_curie_cryptography_desc: "#b;italic $glossary_curie_cryptography$#! ist die Wissenschaft, die sich mit der Sicherung der Kommunikation vor unbefugtem Zugriff durch mathematische Codes und Verschlüsselungsverfahren befasst."
 glossary_curie_algorithm_theory: "Algorithmus-$curie_theory$"
 glossary_curie_algorithm_theory_desc: "#b;italic $glossary_curie_algorithm_theory$#! ist eine mathematische Untersuchung systematischer, schrittweiser Verfahren zur Lösung rechnerischer Probleme. Ausgehend von Berechnungen mit Stift und Papier analysiert sie mechanische Regeln, um festzustellen, welche Probleme in einer endlichen Abfolge von Schritten gelöst werden können."
 glossary_curie_lambda_calculus: "Lambda-Kalkül"
 glossary_curie_lambda_calculus_desc: "#b;italic $glossary_curie_lambda_calculus$#! ist ein formal-logisches System, das in den 1930er Jahren eingeführt wurde, um mathematische Funktionen, Variablenbindungen und Substitution zu untersuchen. Es wurde entwickelt, um die grundlegenden Grenzen der Entscheidbarkeit und des formalen Denkens in der reinen Logik und Mathematik zu erforschen."