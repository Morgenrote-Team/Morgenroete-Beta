l_german:
 CURTISS_FLIGHT_ROUTE: "Flugroute"
 CURTISS_FLIGHT_ROUTES: "Flugrouten"
 CURTISS_ADD_X_FLIGHT_ROUTE_EFFECT_POSITIVE: "Das Land $MR_GAINS$ $VALUE|0+$ @curtiss_airlines! [SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE$','(CFixedPoint)1'),'CURTISS_FLIGHT_ROUTES','CURTISS_FLIGHT_ROUTE')]"
 CURTISS_ADD_X_FLIGHT_ROUTE_EFFECT_NEGATIVE: "Das Land $MR_LOSES$ [Negate_CFixedPoint('(CFixedPoint)$VALUE$')|0+] @curtiss_airlines! [SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE$','(CFixedPoint)1'),'CURTISS_FLIGHT_ROUTES','CURTISS_FLIGHT_ROUTE')]"
 CURTISS_ADD_X_FLIGHT_ROUTE_EFFECT_FIRST_POSITIVE: "[COUNTRY.GetAltNameNoFlag('NOM')|U] $MR_GAINS$ $VALUE|+0$ @curtiss_airlines! [SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE$','(CFixedPoint)1'),'CURTISS_FLIGHT_ROUTES','CURTISS_FLIGHT_ROUTE')] (currently [COUNTRY.MakeScope.GetVariable('curtiss_flight_route').GetValue|0|V])"
 CURTISS_ADD_X_FLIGHT_ROUTE_EFFECT_FIRST_NEGATIVE: "[COUNTRY.GetAltNameNoFlag('NOM')|U] $MR_LOSES$ [Negate_CFixedPoint('(CFixedPoint)$VALUE$')|+0] @curtiss_airlines! [SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE$','(CFixedPoint)1'),'CURTISS_FLIGHT_ROUTES','CURTISS_FLIGHT_ROUTE')] (currently [COUNTRY.MakeScope.GetVariable('curtiss_flight_route').GetValue|0|V])"
 CURTISS_ADD_X_FLIGHT_ROUTE_EFFECT_THIRD_POSITIVE: "[COUNTRY.GetAltName('NOM')|U] $MR_GAINS$ $VALUE|+0$ @curtiss_airlines! [SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE$','(CFixedPoint)1'),'CURTISS_FLIGHT_ROUTES','CURTISS_FLIGHT_ROUTE')]"
 CURTISS_ADD_X_FLIGHT_ROUTE_EFFECT_THIRD_NEGATIVE: "[COUNTRY.GetAltName('NOM')|U] $MR_LOSES$ [Negate_CFixedPoint('(CFixedPoint)$VALUE$')|+0] @curtiss_airlines! [SelectLocalization(GreaterThan_CFixedPoint('(CFixedPoint)$VALUE$','(CFixedPoint)1'),'CURTISS_FLIGHT_ROUTES','CURTISS_FLIGHT_ROUTE')]"