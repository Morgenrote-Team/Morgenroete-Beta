l_german:
 curtiss_schneider_trophy_event_mechanical_problems_icon_flag: "@curtiss_event_log_negative_mechanical_problems_icon!"
 curtiss_schneider_trophy_event_mechanical_problems_title_flag: "Mechanische Probleme"
 curtiss_schneider_trophy_event_mechanical_problems_flag: "#t $curtiss_schneider_trophy_event_mechanical_problems_title_flag$#!\n$curtiss.121.d$"
 curtiss_schneider_trophy_event_crash_icon_flag: "@curtiss_event_log_negative_crash_icon!"
 curtiss_schneider_trophy_event_crash_title_flag: "Flugzeugabsturz"
 curtiss_schneider_trophy_event_crash_flag: "#t $curtiss_schneider_trophy_event_crash_title_flag$#!\nBei einem Manöver hat sich der Pilot überschätzt - und ist ins Wasser gestürzt!"
 curtiss_schneider_trophy_event_buoy_icon_flag: "@curtiss_event_log_negative_buoy_icon!"
 curtiss_schneider_trophy_event_buoy_title_flag: "Boje übersehen"
 curtiss_schneider_trophy_event_buoy_flag: "#t $curtiss_schneider_trophy_event_buoy_title_flag$#!\nDas Team flog beim Schneider-Trophy-Rennen eine gute Runde, doch einem der Piloten drohte ein Punktabzug, weil einer der Schiedsrichter beanstandete, er habe eine Boje übersehen."
 curtiss_schneider_trophy_event_maximum_speed_icon_flag: "@curtiss_event_log_positive_speed_icon!"
 curtiss_schneider_trophy_event_maximum_speed_title_flag: "Maximale Geschwindigkeit"
 curtiss_schneider_trophy_event_maximum_speed_flag: "#t $curtiss_schneider_trophy_event_maximum_speed_title_flag$#!\nAuf der Strecke demonstrierten die Piloten, welche Geschwindigkeit das Flugzeug erreichen konnte."
 curtiss_schneider_trophy_event_slalom_icon_flag: "@curtiss_event_log_positive_slalom_icon!"
 curtiss_schneider_trophy_event_slalom_title_flag: "Slalommanöver"
 curtiss_schneider_trophy_event_slalom_flag: "#t $curtiss_schneider_trophy_event_slalom_title_flag$#!\nDie Schneider-Trophy ist vor allem als Geschwindigkeitswettbewerb bekannt, doch bei hoher Geschwindigkeit konnten drei bis vier Punkte verfehlt werden – und zur Disqualifikation führen."
 curtiss_schneider_trophy_event_fog_neutral_icon_flag: "@curtiss_event_log_fog_neutral_icon!"
 curtiss_schneider_trophy_event_fog_positive_icon_flag: "@curtiss_event_log_fog_positive_icon!"
 curtiss_schneider_trophy_event_fog_title_flag: "Nebel"
 curtiss_schneider_trophy_event_fog_neutral_flag: "#t $curtiss_schneider_trophy_event_fog_title_flag$#!\nAuf den Wasserstraßen war häufiger Nebel ein Problem. Selbst erfahrene Piloten könnten an dieser plötzlichen Herausforderung scheitern. Dieser Pilot hat es knapp durch geschafft."
 curtiss_schneider_trophy_event_fog_positive_flag: "#t $curtiss_schneider_trophy_event_fog_title_flag$#!\nAuf den Wasserstraßen war häufiger Nebel ein Problem. Selbst erfahrene Piloten könnten an dieser plötzlichen Herausforderung scheitern. Dieser Pilot hatte kein Problem damit."
 curtiss_schneider_trophy_event_superior_flight_performance_icon_flag: "@curtiss_event_log_superior_flight_performance_positive_icon!"
 curtiss_schneider_trophy_event_superior_flight_performance_title_flag: "Superior Flight Performance"
 curtiss_schneider_trophy_event_superior_flight_performance_flag: "#t $curtiss_schneider_trophy_event_superior_flight_performance_title_flag$#!\nDie überlegenen Qualitäten des Piloten haben die Chancen auf den Gewinn des Schneider-Cups deutlich verbessert!"
 curtiss_schneider_trophy_event_duel_positive_icon_flag: "@curtiss_event_log_duel_positive_icon!"
 curtiss_schneider_trophy_event_duel_title_positive_flag: "Duell: Gewonnen"
 curtiss_schneider_trophy_event_duel_positive_flag: "#t $curtiss_schneider_trophy_event_duel_title_positive_flag$#!\nIm Rennen um die schnellste Runde kamen sich zwei Piloten gefährlich nahe. Mit einem gezielten Manöver konnte dieser Pilot seine Chancen verbessern und seinen direkten Konkurrenten schwächen."
 curtiss_schneider_trophy_event_duel_negative_icon_flag: "@curtiss_event_log_duel_negative_icon!"
 curtiss_schneider_trophy_event_duel_title_negative_flag: "Duell: Verloren"
 curtiss_schneider_trophy_event_duel_negative_flag: "#t $curtiss_schneider_trophy_event_duel_title_negative_flag$#!\nIm Rennen um die schnellste Runde kamen sich zwei Piloten gefährlich nahe. Mit einem gezielten Manöver versuchte dieser Pilot seine Chancen zu verbessern, scheiterte jedoch kläglich."
 curtiss_schneider_trophy_event_rivalry_icon_positive_flag: "@curtiss_event_log_rivalry_positive_icon!"
 curtiss_schneider_trophy_event_rivalry_title_positive_flag: "Rivalität: Gewonnen"
 curtiss_schneider_trophy_event_rivalry_positive_flag: "#t $curtiss_schneider_trophy_event_rivalry_title_positive_flag$#!\nDas Schneider-Cup-Ass hatte eine alte Rechnung mit einem Rivalen offen. In einem waghalsigen Manöver schaffte er es, den verhassten Feind aus dem Rennen zu werfen!"
 curtiss_schneider_trophy_event_rivalry_icon_negative_flag: "@curtiss_event_log_rivalry_negative_icon!"
 curtiss_schneider_trophy_event_rivalry_title_negative_flag: "Rivalitäte: Verloren"
 curtiss_schneider_trophy_event_rivalry_negative_flag: "#t $curtiss_schneider_trophy_event_rivalry_title_negative_flag$#!\nDas Schneider-Cup-Ass hatte eine alte Rechnung mit einem Rivalen offen. In einem waghalsigen Manöver schaffte er es nicht, den verhassten Feind aus dem Rennen zu werfen!"
 curtiss_schneider_trophy_event_rivalry_fly_ahead_icon_flag: "@curtiss_event_log_fly_ahead_positive_icon!"
 curtiss_schneider_trophy_event_rivalry_fly_ahead_title_flag: "Rivalität: Voraus fliegen"
 curtiss_schneider_trophy_event_rivalry_fly_ahead_flag: "#t $curtiss_schneider_trophy_event_rivalry_fly_ahead_title_flag$#!\nDas Schneider-Cup-Ass hatte eine alte Rechnung mit einem Rivalen offen. Er ignorierte ihn jedoch und flog weiter."
 curtiss_schneider_trophy_event_rivalry_title_positive_opponent_flag: "Rivalität: Ein besiegter Rivale"
 curtiss_schneider_trophy_event_rivalry_positive_opponent_flag: "#t $curtiss_schneider_trophy_event_rivalry_title_positive_opponent_flag$#!\nEin anderer Pilot versuchte eine alte Rechnung mit diesem Piloten zu begleichen. Aber er scheiterte."
 curtiss_schneider_trophy_event_favorable_conditions_icon_flag: "@curtiss_event_log_favorable_conditions_positive_icon!"
 curtiss_schneider_trophy_event_favorable_conditions_title_flag: "Günstige Wetterbedingungen"
 curtiss_schneider_trophy_event_favorable_conditions_flag: "#t $curtiss_schneider_trophy_event_favorable_conditions_title_flag$#!\nGute Wetterbedingungen verbesserten die Siegchancen."
 curtiss_schneider_trophy_event_team_member_ill_icon_flag: "@curtiss_event_log_team_member_ill_negative_icon!"
 curtiss_schneider_trophy_event_team_member_ill_title_flag: "Krankes Teammitglied"
 curtiss_schneider_trophy_event_team_member_ill_flag: "#t $curtiss_schneider_trophy_event_team_member_ill_title_flag$#!\nEin Pilot des Schneider-Trophy-Teams meldete sich kurz vor dem Rennen krank."
 curtiss_schneider_trophy_event_strange_engine_failure_icon_flag: "@curtiss_event_log_strange_engine_failure_negative_icon!"
 curtiss_schneider_trophy_event_strange_engine_failure_title_flag: "Seltsamer Motorschaden"
 curtiss_schneider_trophy_event_strange_engine_failure_flag: "#t $curtiss_schneider_trophy_event_strange_engine_failure_title_flag$#!\nEin seltsamer Motorschaden liess die Ingenieure verzweifeln."
 curtiss_schneider_trophy_event_sabotage_prevented_icon_flag: "@curtiss_event_log_sabotage_prevented_positive_icon!"
 curtiss_schneider_trophy_event_sabotage_prevented_title_flag: "Sabotage verhindert!"
 curtiss_schneider_trophy_event_sabotage_prevented_flag: "#t $curtiss_schneider_trophy_event_sabotage_prevented_title_flag$#!\nDer Sabotageversuch eines anderen Rennteilnehmers konnte in letzter Sekunde verhindert werden."
 curtiss_schneider_trophy_event_sabotage_discovered_icon_flag: "@curtiss_event_log_sabotage_prevented_negative_icon!"
 curtiss_schneider_trophy_event_sabotage_discovered_title_flag: "Sabotage entdeckt!"
 curtiss_schneider_trophy_event_sabotage_discovered_flag: "#t $curtiss_schneider_trophy_event_sabotage_discovered_title_flag$#!\nDer Sabotageversuch dieses Landes wurde aufgedeckt, woraufhin es von den anderen Teilnehmern geächtet wurde."