 MR_BALLOONIST_HYDROGEN_FACTORY_TRIGGER_TT: "#default_text [GetPlayer.GetAltName('NOM')] mindestens ein [GetBuildingType('building_explosives_factory').GetName]-Gebäude mit der $pm_brine_electrolysis$-[concept_production_method].#!"
 MR_BALLOONIST_COAL_GAS_BUTTON: "Kohlegas nutzen"
 MR_BALLOONIST_COAL_GAS_BUTTON_TT: "#T Kohlegas nutzen#!\nKohlegas ist ein weit verbreitetes Gas für Ballons, das in den Anfängen des Ballonfahrens für das Aufstellen von Distanz- und Geschwindigkeitsrekorden vollkommen ausreichte, jedoch erhebliche Einschränkungen beim Aufstieg in große Höhen mit sich bringt.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_HYDROGEN_BUTTON: "Wasserstoff nutzen"
 MR_BALLOONIST_HYDROGEN_BUTTON_TT: "#T Wasserstoff nutzen#!\nWasserstoff wurde bereits in den Anfängen der Ballonfahrt verwendet und führte zu einigen atemberaubenden Höhenrekorden – er ist, ganz einfach gesagt, das „Höhen-Gas“ schlechthin. Seine Herstellung ist jedoch sehr teuer und arbeitsintensiv.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
