 MR_BALLOONIST_BALLOON_RIDE_BUTTON: "Ballonfahrt"
 MR_BALLOONIST_BALLOON_RIDE_BUTTON_TT: "#T Ballonfahrt#!\nDie Ballonfahrt zur Unterhaltung der Öffentlichkeit ist die sicherste – aber auch etwas langweilige – Standardaktion des [concept_santos_balloonist]. Sie kann bestimmte Gebäude mit einer Ballonattraktion aufwerten und einen kleinen Technologieschub für die Ballontechnik bewirken.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_BALLOON_ADVENTURE_BUTTON: "Ballonabenteuer"
 MR_BALLOONIST_BALLOON_ADVENTURE_BUTTON_TT: "#T Ballonabenteuer#!\nEin [concept_santos_balloonist] kann sich auf ein Abenteuer jenseits unserer Grenzen begeben. Im Laufe vieler Monate wird er zahlreiche Länder durchqueren – und vielleicht das eine oder andere Souvenir mitbringen. Es besteht eine geringe Wahrscheinlichkeit, dass er während der Reise ums Leben kommt.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_BALLOON_RECORD_BUTTON: "Ballonrekord"
 MR_BALLOONIST_BALLOON_RECORD_BUTTON_TT: "#T Ballon-Rekord#!\nEin [concept_santos_balloonist] kann Rekorde in den Bereichen Höhe, Entfernung und Zeit aufstellen, vorausgesetzt, er kann diese Weltrekorde aus eigener Kraft brechen. Es besteht eine moderate Wahrscheinlichkeit, dass er während des Rekordversuchs ums Leben kommt.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_BALLOON_CROSSING_BUTTON: "Ballonüberquerung"
 MR_BALLOONIST_BALLOON_CROSSING_BUTTON_TT: "#T Ballonüberquerung#!\nEin [concept_santos_balloonist] kann geografisch gefährliche Meerengen oder Gebirgsketten überfliegen. Diese Leistung gilt als die ultimative Herausforderung für jeden Abenteurer. Es besteht eine erhebliche Wahrscheinlichkeit, dass er bei dem Überquerungsversuch ums Leben kommt.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_FIRE_BALLOONIST_TRIGGER_TT: "#default_text [GetPlayer.GetAltName('NOM')] hat #R nicht#! den [concept_modifier] #V $santos_balloon_contract_modifier$#!."
 SANTOS_CROSSING_ITEM_TOOLTIP: "[Scope.Var('tooltip').GetFlagName]"
 SANTOS_CROSSING_ACHIEVED_MARK: "@green_checkmark!"
 SANTOS_CROSSING_CHANNEL_TT: "Der Ärmelkanal stellt eine klassische Kurzstreckenüberquerung auf See dar, die etwa 35 bis 50 Kilometer lang ist. Die größten Gefahren gehen von unvorhersehbaren Küstenwinden und plötzlichen Abdriftungen in Richtung des offenen Atlantiks aus, dennoch gilt er seit Blanchard und Green als bewährtes Testgebiet für Pionierflüge."
 SANTOS_CROSSING_ALPS_TT: "Als extremes Hindernis in großer Höhe erfordert eine Alpenpassage eine Einsatzhöhe von 5.500 bis 6.000 Metern – was ein erhebliches Risiko für Sauerstoffmangel mit sich bringt – sowie eine Flugreichweite von 400 bis 600 Kilometern. Die Tücke liegt in den heftigen Gebirgs-Leewellen und Abwinden, die ein Fluggerät gegen steile Felswände treiben können – eine Gefahr, die erstmals 1849 von Francisque Arban überwunden wurde."
 SANTOS_CROSSING_SKAGERRAK_TT: "Die Überquerung dieser Meerenge zwischen Dänemark und der skandinavischen Halbinsel umfasst 80 bis 130 Kilometer offenes Wasser und erfordert eine Reiseflughöhe von 2.000 Metern sowie eine Reichweitenreserve von 400 Kilometern. Ballonfahrer müssen mit sich rasch entwickelnden Nordseestürmen, extremer Kälte und unwirtlichen Küstenabschnitten fertig werden, was gasdichte Ballonhüllen und präzise Windnavigation erfordert."
 SANTOS_CROSSING_MEDITERRANEAN_TT: "Dieses riesige Meeresbecken, durchsetzt mit bergigen Inseln wie Korsika und Sizilien, erfordert eine Reiseflughöhe von 4.000 Metern, um die Inselgipfel zu überfliegen, sowie eine Reichweite von 700 Kilometern. Die intensive tropische Sonneneinstrahlung führt zu einer starken Gasausdehnung, während die Unmöglichkeit, über Wasser ein Schleppseil auszubringen, ein sorgfältiges Ballastmanagement erfordert."
 SANTOS_CROSSING_RIO_TT: "Um dieses riesige Mündungsgebiet zwischen Argentinien und Uruguay zu überqueren, das sich über bis zu 220 Kilometer offenes Wasser erstreckt, sind eine Reiseflughöhe von 2.000 Metern und eine Reichweite von 300 Kilometern erforderlich. Die größten Gefahren gehen von plötzlichen Sturmböen aus, die vor Ort als „Pamperos“ bezeichnet werden, sowie von starken thermischen Turbulenzen über dem Wasser."
 SANTOS_CROSSING_PYRENEES_TT: "Die Pyrenäen, die eine Gebirgsbarriere zwischen Frankreich und Spanien bilden, erfordern eine Mindestflughöhe von 5.000 Metern und eine Reichweite von 500 Kilometern. Starke Abwinde im Windschatten von Gipfeln über 3.000 Metern machen eine beträchtliche vertikale Sicherheitsreserve erforderlich, um einen katastrophalen Sinkflug zu verhindern."
 SANTOS_CROSSING_ANDES_TT: "Eine Überquerung der Anden stellt die größte Herausforderung in der Ballonnavigation dar und erfordert eine außergewöhnliche Höhenleistung von 8.000 Metern sowie eine Reichweite von 800 Kilometern. Ohne Druckausrüstung sind die Ballonfahrer lebensbedrohlichem Sauerstoffmangel sowie bitterer Kälte und stürmischen Bergwinden ausgesetzt."
 SANTOS_CROSSING_KOREA_TT: "Diese Passage, die Korea über eine Meeresstrecke von 180 bis 200 Kilometern mit Japan verbindet, erfordert eine Flughöhe von 2.500 Metern und eine Reichweite von 250 Kilometern. Zwischenliegende Inseln wie Tsushima erleichtern die Orientierung, doch wechselnde Monsunwinde und die Gefahr, ins offene Pazifikgebiet abgetrieben zu werden, bleiben die größten Sorgen."
 SANTOS_CROSSING_BAB_TT: "Dieser südliche Engpass des Roten Meeres umfasst 30 bis 40 Kilometer offenes Wasser, erfordert jedoch eine Flughöhe von 4.000 Metern, um die angrenzenden Küstengebirgszüge zu überfliegen, sowie eine Reichweitenreserve von 400 Kilometern. Extreme tropische Hitze destabilisiert die Hüllgase erheblich, was durch heftige Wüstenthermik und unvorhersehbare Fallwinde noch verstärkt wird."
 SANTOS_KOREA_CROSSING_TT: "#default_text #V Koreastraße#! gilt als #G leichte Überquerung#!.\n\n$santos_balloon_crossing_korea_possible_trigger_tt$#!"
 SANTOS_BAB_CROSSING_TT: "#default_text #V Bab al-Mandab#! gilt als #R schwierige Überquerung#!.\n\n$santos_balloon_crossing_bab_possible_trigger_tt$#!"
