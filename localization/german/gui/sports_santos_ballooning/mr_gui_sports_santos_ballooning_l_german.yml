 MR_BALLOONIST_CHANGE_TYPE_BUTTON: "Typ ändern"
 MR_BALLOONIST_CHANGE_TYPE_BUTTON_TT: "Spezialisierte Ballons können in einem Bereich – Höhe, Distanz oder Zeit – kleine Vorteile bieten, allerdings auf Kosten der Leistung in allen anderen Bereichen. Ein Mehrzweckballon bietet weder Vor- noch Nachteile."
 MR_HEADER_MODIFICATIONS: "Modifikationen"
