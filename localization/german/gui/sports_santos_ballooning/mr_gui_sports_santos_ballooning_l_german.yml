 MR_STOP_AUTOMATE_BALLOONIST_TT: "#T Automatisierung des [concept_santos_balloonist] stoppen#!\nDie Arbeit des Ballonfahrers wird nicht mehr automatisiert."
 MR_AUTOMATE_BALLOONIST_TT: "#T Automatisierung des [concept_santos_balloonist]s#!\nSie müssen Ihrem Ballonfahrer keine Aufgaben mehr geben, wenn Sie ihn automatisieren.\nEr wird selbstständig arbeiten und Aufgaben ausführen, die im Moment sinnvoll sind. Sie werden aber immer noch einige Ereignisse erhalten."
 MR_BALLOONIST_STRATOSPHERIC_FLIGHT_BUTTON: "Stratosphärenflug"
 MR_BALLOONIST_STRATOSPHERIC_FLIGHT_BUTTON_TT: "#T Stratosphärenflug#!\nWie hoch kann ein Mensch in einem Ballon steigen? Dank der revolutionären Erfindung einer Druckkapsel könnte ein außergewöhnliches – und gefährliches – Experiment möglich sein.\n#R Hinweis:#! Für den ersten Stratosphärenflug wird ein [concept_curie_meteorological_physicist] benötigt, um den Stratosphärenballon zu bauen und anzupassen. Nach dem ersten Flug kann der Ballonfahrer ohne Meteorologen fliegen.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BALLOONIST_HAS_HYDROGEN_BALLOON_TRIGGER_TT: "#default_text [GetPlayer.GetAltName('NOM')] hat einen [concept_santos_balloon] mit #BLUE Wasserstoff#!#!"
 MR_BALLOONIST_NO_RECENT_STRATOSPHERIC_FLIGHT_TRIGGER_TT: "#default_text [GetPlayer.GetAltName('NOM')] hat #R nicht#! den [concept_modifier] #V $santos_stratospheric_flight_success_modifier$#! oder #V $santos_stratospheric_flight_failure_modifier$#!.#!"
 MR_HELIUM_BAR: "Helium"
 MR_HELIUM_BAR_TT: "Dieser Ballon nützt #V Helium#!."
 MR_BALLOONIST_HELIUM_FACTORY_TRIGGER_TT: "#default_text [GetPlayer.GetAltName('NOM')] hat eine [GetBuildingType('building_mendelejew_helium_plant').GetName].#!"
 MR_BALLOONIST_CHANGE_FUEL_BUTTON: "Kraftstoff wechseln"
 MR_BALLOONIST_CHANGE_FUEL_BUTTON_TT: "Jede Art von Ballongas hat bestimmte Vor- und Nachteile. Kohlegas eignet sich gut für lange Strecken, Wasserstoff für große Höhen, und Helium ist besonders nützlich, um Unfälle zu verhindern."
 MR_BALLOONIST_CHANGE_FUEL_TRIGGER: "#default_text [GetPlayer.GetAltName('NOM')] hat mindestens eine [GetBuildingType('building_explosives_factory').GetName] mit der [concept_production_method] $pm_brine_electrolysis$\n#R ODER#! [GetPlayer.GetAltName('NOM')] hat eine [GetBuildingType('building_mendelejew_helium_plant').GetName].#!"
 santos_set_balloon_fuel_helium_effect_tt: "Ändern Sie den Ballonbrennstoff zu #V Helium#!. Die Anpassung des Ballons dauert #V sechs Monate#!."
 santos_altitude_bonus_fuel_helium_tt_loc: "\n#p 2750 Meter#! für Helium."
 santos_altitude_bonus_fuel_helium_inactive_tt_loc: "\n#default_text 2750 Meter für Helium.#!"
 santos_distance_bonus_fuel_helium_tt_loc: "\n#p 150 Kilometer#! für Helium."
 santos_distance_bonus_fuel_helium_inactive_tt_loc: "\n#default_text 150 Kilometer für Helium.#!"
 santos_distance_bonus_fuel_helium_improved_tt_loc: "\n#p 350 Kilometer#! für Helium (mit [GetTechnology('art_silk').GetName] und [GetTechnology('vulcanization').GetName])."
 santos_distance_bonus_fuel_helium_improved_inactive_tt_loc: "\n#default_text 350 Kilometer für Helium (mit [GetTechnology('art_silk').GetName] und [GetTechnology('vulcanization').GetName]).#!"
 santos_time_bonus_fuel_helium_tt_loc: "\n#p 8 Stunden#! für Helium."
 santos_time_bonus_fuel_helium_inactive_tt_loc: "\n#default_text 8 Stunden für Helium.#!"
 MR_RIP_PANEL: "#underline #T Reißbahn#!#!: [GetPlayer.GetCustom('santos_logistics_researched_type')] [GetTechnology('logistics').GetName]"
 MR_RIP_PANEL_TT: "#header Reißbahn#!\nEine Reißbahn ist ein integrierter, abreißbarer Abschnitt der Ballonhülle, den der Pilot bei der Landung aufreißt, um das Traggas schnell abzulassen und zu verhindern, dass der Ballon über den Boden geschleift wird.\n\nHöhenbonus: #p +500 Meter#!\n[concept_santos_stratospheric_flight]: #p Geringere Wahrscheinlichkeit#! für langsamen Aufstieg"
 MR_BAGS_OF_FINE_SAND: "#underline #T Säcke mit feinem Sand#!#!: [GetPlayer.GetCustom('santos_military_statistics_researched_type')] [GetTechnology('military_statistics').GetName]"
 MR_BAGS_OF_FINE_SAND_TT: "#header Säcke mit feinem Sand#!\nDie immer präzisere Gewichtsverteilung der Ballonladung und die Umstellung auf feinkörnigeren Sand ermöglichen eine genauere Steuerung des Ballonaufstiegs.\n\nHöhenbonus: #p +500 Meter#!\n[concept_santos_stratospheric_flight]: #p Geringere Wahrscheinlichkeit#! für einen langsamen Aufstieg"
 MR_OXYGEN_CYLINDERS: "#underline #T Sauerstoffflaschen#!#!: [GetPlayer.GetCustom('santos_electric_arc_process_researched_type')] [GetTechnology('electric_arc_process').GetName]"
 MR_OXYGEN_CYLINDERS_TT: "#header Sauerstoffflaschen#!\nDank neuer Löttechniken und der dadurch verbesserten Gasspeicherung wurde auch die Sauerstoffflasche erfunden, die es Ballonfahrern ermöglichte, bisher unbekannte Höhen zu erreichen – darunter auch solche, die zuvor den sicheren Tod bedeutet hätten.\n\nHöhenbonus: #p +500 Meter#!\n[concept_santos_balloon_record]: Schützt #p vor Höhenkrankheit#!"
 MR_TRAIL_ROPE: "#underline #T Schlepptau#!#!: [GetPlayer.GetCustom('santos_mechanical_tools_researched_type')] [GetTechnology('mechanical_tools').GetName]"
 MR_TRAIL_ROPE_TT: "#header Schlepptau#!\nEin Schlepptau (oder Führungsseil) ist ein langes, schweres Seil, das unter einem Ballon aufgehängt ist und über den Boden geschleift wird, um die Flughöhe automatisch zu regulieren – dabei wird das Gewicht verringert, wenn beim Sinkflug mehr Seil auf dem Boden aufliegt, und erhöht, wenn es beim Steigflug vom Boden abhebt –, während es den Ballon gleichzeitig vor der Landung abbremst.\n\nEntfernungsbonus: #p +200 Kilometer#!\n[concept_santos_stratospheric_flight]: #p Geringere Wahrscheinlichkeit#! für langsamen Aufstieg"
 MR_CANNED_FOOD: "#underline #T Konserven#!#!: [GetPlayer.GetCustom('santos_canneries_researched_type')] [GetTechnology('canneries').GetName]"
 MR_CANNED_FOOD_TT: "#header Konserven#!\nEin Schleppseil (oder Führungsseil) ist ein langes, schweres Kabel, das unter einem Ballon aufgehängt ist und über den Boden geschleift wird, um die Flughöhe automatisch zu regulieren – wobei das Gewicht verringert wird, wenn beim Abstieg mehr Seil auf dem Boden aufliegt, und erhöht wird, wenn es beim Aufstieg vom Boden abhebt –, und gleichzeitig den Ballon vor der Landung abzubremsen.\n\nDistanzbonus: #p +200 Kilometer#!\n[concept_santos_stratospheric_flight]: #p Geringere Wahrscheinlichkeit#! für langsamen Aufstieg"
 MR_RUBBERIZED_FABRICS: "#underline #T Gummierte Stoffe#!#!: [GetPlayer.GetCustom('santos_rubber_mastication_researched_type')] [GetTechnology('rubber_mastication').GetName]"
 MR_RUBBERIZED_FABRICS_TT: "#header Gummierte Stoffe#!\nGummierte Stoffe waren im Ballonfahren des 19. Jahrhunderts Standard und erhöhten die Luftdichtheit eines Ballons.\n\nZeitbonus: #p +5 Stunden#!"
 MR_VULCANIZED_COTTON: "#underline #T Vulkanisierte Baumwolle#!#!: [GetPlayer.GetCustom('santos_vulcanization_researched_type')] [GetTechnology('vulcanization').GetName]"
 MR_VULCANIZED_COTTON_TT: "#header Vulkanisierte Baumwolle#!\nDurch die Verwendung von vulkanisierter Baumwollstoffe gelang es Ballonfahrern und Ingenieuren, das Volumen eines Ballons zu vergrößern und dessen Luftdichtheit zu verbessern.\n\nZeitbonus: #p +5 Stunden#!"
 MR_VULCANIZED_SILK: "#underline #T Vulkanisierte Seide#!#!: [GetPlayer.GetCustom('santos_art_silk_researched_type')] [GetTechnology('art_silk').GetName]"
 MR_VULCANIZED_SILK_TT: "#header Vulkanisierte Seide#!\nVulkanisierte Seide war eine der besten Optionen für die Herstellung von Ballons, die für lange Reisen geeignet waren, und galt lange Zeit als das unübertroffene Material für Ballons.\n\nZeitbonus: #p +5 Stunden#!\n[concept_santos_stratospheric_flight]: #p Geringere Wahrscheinlichkeit#! für langsamen Aufstieg"
 MR_REINFORCED_MATERIAL: "#underline #T Modernes Material#!#!: [GetPlayer.GetCustom('santos_reinforced_material_researched_type')] [GetTechnology('art_silk').GetName]&[GetTechnology('vulcanization').GetName]"
 MR_REINFORCED_MATERIAL_TT: "#header Moderne Materialien#!\nAls Ballonflüge bis in die Stratosphäre vordrangen, stieß auch das Ballonmaterial an seine Grenzen. Zwar reichten die bis dahin verwendeten Methoden für Ballonflüge in diese Höhe aus, doch erst mit der Entdeckung von Polyethylen wurden sie wirklich sicher.\n[concept_santos_balloon_record]: Die Streckenrekorde werden #p deutlich verbessert#!, wenn Wasserstoff oder Helium als Treibstoff verwendet werden\n\n[concept_santos_stratospheric_flight]: Schützt #p vor Materialermüdung#!"
 MR_SUN_PROTECTION: "#underline #T Sonnenschutz#!#!: [GetPlayer.GetCustom('santos_sun_protection_researched_type')] [GetTechnology('zeppelins').GetName]&[GetTechnology('curie_rocket_science_tech').GetName]"
 MR_SUN_PROTECTION_TT: "#header Sonnenschutz#!\nIm Laufe der Zeit erkannten Physiker, Ingenieure und Ballonfahrer, dass die Eigenschaften der Lackierung und des Materials eines stratosphärischen Ballons entscheidend dafür sind, eine Überhitzung des Ballons und die damit verbundene Gefahr zu verhindern.\n\n[concept_santos_stratospheric_flight]: Schützt #p vor Hitzestau#!"
 MR_BALLOONIST_HAS_HYDROGEN_OR_HELIUM_BALLOON_TRIGGER_TT: "#default_text [GetPlayer.GetAltName('NOM')] hat einen [concept_santos_balloon] mit #BLUE Wasserstoff#! oder #V Helium#!#!"