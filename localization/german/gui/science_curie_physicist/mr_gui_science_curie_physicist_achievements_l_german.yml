l_german:
 MR_PHYSICIST_ACHIEVEMENTS_TT: "[AddLocalizationIf( Scope.IsSet , 'curie_physicist_achievements_loc')][AddLocalizationIf( Not(Scope.IsSet) , 'curie_physicist_achievements_no_physicist_loc')]"
 curie_physicist_achievements_loc: "$curie_physicist_achievements_intro_loc$[AddLocalizationIf( Scope.Var('curie_physicist_achievement_historical_physics_experiment_var').IsSet , Scope.Var('curie_physicist_achievement_historical_physics_experiment_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_mass_energy_equivalence_var').IsSet , Scope.Var('curie_physicist_achievement_mass_energy_equivalence_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_essay_on_wind_var').IsSet , Scope.Var('curie_physicist_achievement_essay_on_wind_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_stratospheric_flight_var').IsSet , Scope.Var('curie_physicist_achievement_stratospheric_flight_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_turing_machine_var').IsSet , Scope.Var('curie_physicist_achievement_turing_machine_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_radiosonde_var').IsSet , Scope.Var('curie_physicist_achievement_radiosonde_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_founded_magnetic_association_var').IsSet , Scope.Var('curie_physicist_achievement_founded_magnetic_association_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievements_finished_geomagnetic_observatory_project_var').IsSet , Scope.Var('curie_physicist_achievements_finished_geomagnetic_observatory_project_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_magnetic_atlas_var').IsSet , Scope.Var('curie_physicist_achievement_magnetic_atlas_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_mathematics_improvement_finished_var').IsSet , Scope.Var('curie_physicist_achievement_mathematics_improvement_finished_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_first_cloud_describer_var').IsSet , Scope.Var('curie_physicist_achievement_first_cloud_describer_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_weather_service_var').IsSet , Scope.Var('curie_physicist_achievement_weather_service_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_weather_station_expansion_var').IsSet , Scope.Var('curie_physicist_achievement_weather_station_expansion_var').GetFlagName)][AddLocalizationIf( Scope.Var('curie_physicist_achievement_meteorology_improvement_finished_var').IsSet , Scope.Var('curie_physicist_achievement_meteorology_improvement_finished_var').GetFlagName)]"
 curie_physicist_achievements_intro_loc: "#V Errungenschaften dieses Physikers#!\n #indent_newline:3 • [Scope.GetCharacter.GetFullName] ist ein bekannter Physiker.#!\n#indent_newline:3 • Bislang hat [Scope.GetCharacter.GetSheHe] [Scope.Var('curie_discovered_formulas_character_number_var').GetValue|V0] Formeln abgeleitet und [Scope.Var('curie_discovered_experiments_character_number_var').GetValue|V0] Experimente durchgeführt. [Scope.GetCharacter.GetSheHe] beschrieb außerdem [Scope.Var('curie_discovered_clouds_character_number_var').GetValue|V0] Wolken.#!"
 curie_physicist_achievements_no_physicist_loc: "Die #V Errungenschaften dieses [concept_curie_physicist]s#! werden hier angezeigt, sobald Sie einen davon haben."
 curie_physicist_achievement_historical_physics_experiment_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetSheHe|U] is famous for the #V [Scope.GetCharacter.GetLastNameNoFormatting] Experiment#! named after [Scope.GetCharacter.GetHerHim]."
 curie_physicist_achievement_founded_magnetic_association_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] ist der #V Gründer des Magnetischen Vereins#!, der ersten internationalen wissenschaftlichen Vereinigung.#!"
 curie_physicist_achievements_finished_geomagnetic_observatory_project_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] trug zur Durchführung geomagnetischer Forschungen bei, indem er #V ein geomagnetisches Observatorium errichtete#!.#!"
 curie_physicist_achievement_magnetic_atlas_loc: "\n #indent_newline:3 • [Scope.GetCharacter.GetSheHe|U] played a key role in the #V creation of a magnetic atlas#!."
 curie_physicist_achievement_mathematics_improvement_finished_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] setzte sich unermüdlich für die #V Verbesserung der Mathematikfakultäten#! in diesem Land ein.#!"
 curie_physicist_achievement_first_cloud_describer_loc: "\n #indent_newline:3 • Mit seiner #V ersten Beschreibung einer Wolkenart#! sicherte [Scope.GetCharacter.GetSheHe] sich einen herausragenden Platz in der Geschichte der Meteorologie.#!"
 curie_physicist_achievement_weather_service_loc: "\n #indent_newline:3 • Seit vielen Jahren betreibt Dr. [Scope.GetCharacter.GetLastNameNoFormatting] #V einen Wetterdienst#! zum Wohle des Landes.#!"
 curie_physicist_achievement_weather_station_expansion_loc: "\n #indent_newline:3 • Eine der wichtigsten technischen Neuerungen war die Modernisierung der Wetterstation der Sternwarte, die unter [Scope.GetCharacter.GetHerHis]er Leitung erfolgte.#!"
 curie_physicist_achievement_meteorology_improvement_finished_loc: "\n #indent_newline:3 • Der Ausbau eines landesweiten Netzes von Wetterstationen über Telegrafenämter hat unser Land deutlich sicherer vor meteorologischen Katastrophen gemacht – dank Dr. [Scope.GetCharacter.GetLastNameNoFormatting]!#!"
 curie_physicist_achievement_stratospheric_flight_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] organisierte und leitete den #V ersten Stratosphärenflug#! unseres Landes und gilt daher als einer unserer angesehensten Wissenschaftler."
 curie_physicist_achievement_mass_energy_equivalence_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] revolutionierte die moderne Physik mit seiner #V Formel zur Äquivalenz von Masse und Energie#!."
 curie_physicist_achievement_essay_on_wind_loc: "\n #indent_newline:3 • Mit [Scope.GetCharacter.GetHerHis] #V Abhandlung über Windströmungen in den mittleren Breiten#! hat [Scope.GetCharacter.GetSheHe] ein bahnbrechendes Werk verfasst.#!"
 curie_physicist_achievement_turing_machine_loc: "\n #indent_newline:3 • Mit dem nach [Scope.GetCharacter.GetHerHim] benannten Gedankenexperiment – #V die [Scope.GetCharacter.GetLastNameNoFormatting]-Maschine#! –leistete [Scope.GetCharacter.GetSheHe] einen entscheidenden Beitrag zur Lösung des Entscheidungsproblems in der Mathematik.#!"
 curie_physicist_achievement_radiosonde_loc: "\n #indent_newline:3 • Dr. [Scope.GetCharacter.GetLastNameNoFormatting] #V launched a radiosonde into the stratosphere#!, thereby revolutionizing meteorology.#!"