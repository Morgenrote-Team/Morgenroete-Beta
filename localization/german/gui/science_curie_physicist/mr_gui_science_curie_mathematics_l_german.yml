 MR_CIRRUS_DESCRIPTION_LOC: "#lore Cirruswolken bestehen aus zarten, faserartigen, weißen Strähnen, Streifen oder federartigen Formationen, die oft wie Pinselstriche vor dem blauen Himmel wirken. Sie bestehen vollständig aus Eiskristallen.#!"
 MR_CIRRUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_montgolfier_balloon_researched_type')] [GetTechnology('curtiss_montgolfier_balloon_tech').GetName]"
 MR_CIRRUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ Keine"
 MR_CIRRUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ Keine"
 MR_CIRRUS_CLOUD: "Cirruswolken treten in den unterschiedlichsten Formen auf, beispielsweise als vereinzelte Büschel (Abb. 35), als Linien, die sich quer über den blauen Himmel ziehen (Abb. 33), als verzweigte, federartige Wolkenfahnen oder als geschwungene Linien, die in Büscheln enden; sie sind oft in Bändern angeordnet, die den Himmel wie Meridianlinien durchziehen und die aufgrund der perspektivischen Wirkung zu einem Punkt am Horizont oder zu zwei gegenüberliegenden Punkten zusammenlaufen (Cirrostratus und Cirrocumulus sind oft an der Bildung dieser Bänder beteiligt).\n\nCirruswolken bestehen immer aus Eiskristallen, und ihre Transparenz ist auf den Zerkleinerungsgrad der Kristalle zurückzuführen.\nIn der Regel durchqueren diese Wolken die Sonnenscheibe, ohne ihr Licht zu trüben. Sind sie jedoch außergewöhnlich dicht, können sie das Licht der Sonne verschleiern und ihre Konturen auslöschen. Dies wäre auch bei Altostratus-Flächen der Fall, doch Cirrus-Wolken zeichnen sich durch ihr blendendes Weiß und ihre seidenartigen Ränder aus.\n\n#Italic aus dem Internationalen Wolkenatlas, 1930#!"
 MR_CIRROCUMULUS_DESCRIPTION_LOC: "#lore Cirrocumulus-Wolken sind feine, flauschige Ansammlungen von Eiskristallen in großen Höhen, die ein zartes Muster bilden. Sie deuten auf Höhenwinde und zunehmende Instabilität in der oberen Troposphäre hin.#!"
 MR_CIRROCUMULUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_montgolfier_balloon_researched_type')] [GetTechnology('curtiss_montgolfier_balloon_tech').GetName]"
 MR_CIRROCUMULUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetPlayer.GetCustom('curie_extreme_winds_condition_type')] [GetHarvestConditionType('extreme_winds').GetName]"
 MR_CIRROCUMULUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ #G -10 %#! $state_harvest_condition_extreme_winds_impact_mult$"
 MR_CIRROCUMULUS_CLOUD: "Im Allgemeinen stellen Cirrocumulus-Wolken einen abgebauten Zustand von Cirrus- und Cirrostratus-Wolken dar, die sich beide in Cirrocumulus-Wolken verwandeln können (Abb. 41). In diesem Fall behalten die sich verändernden Flecken oft stellenweise eine gewisse faserige Struktur bei.\n\nEchte Cirrocumulus-Wolken sind selten. Sie dürfen nicht mit kleinen Altocumulus-Flecken an den Rändern von Altocumulus-Schichten verwechselt werden (Abb. 41). Tatsächlich gibt es alle Übergangsstadien zwischen Cirrocumulus und Altocumulus im eigentlichen Sinne; dies ist nur zu erwarten, da der Entstehungsprozess derselbe ist. In Ermangelung anderer Kriterien sollte der Begriff Cirrocumulus nur verwendet werden, wenn:\n\n1) ein offensichtlicher Zusammenhang mit Cirrus oder Cirrostratus besteht (Abb. 41).\n2) Die beobachtete Wolke aus einer Veränderung von Cirrus oder Cirrostratus hervorgeht (Abb. 41)\n3) Die beobachtete Wolke einige der Merkmale von Eiskristallwolken aufweist, die unter „Cirrus“ (S. 3) aufgeführt sind.\n\n#Italic aus dem Internationalen Wolkenatlas, 1930#!"
 MR_CIRROSTRATUS_DESCRIPTION_LOC: "#lore Ein feiner, milchig-durchscheinender Schleier, der den Himmel bedeckt. Sein auffälligstes Merkmal sind Halos (Lichtringe oder -bögen um Sonne oder Mond), die durch die Lichtbrechung von Eiskristallen entstehen.#!"
 MR_CIRROSTRATUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_montgolfier_balloon_researched_type')] [GetTechnology('curtiss_montgolfier_balloon_tech').GetName]"
 MR_CIRROSTRATUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetPlayer.GetCustom('curie_moderate_rainfall_condition_type')] [GetHarvestConditionType('moderate_rainfall').GetName]"
 MR_CIRROSTRATUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ #G 10 %#! $state_harvest_condition_moderate_rainfall_impact_mult$"
 MR_CIRROSTRATUS_CLOUD: "Eine Cirrostratus-Schicht, die sehr ausgedehnt ist, auch wenn sie stellenweise durch Lücken unterbrochen sein mag, bedeckt fast immer schließlich den gesamten Himmel. Der Rand der Schicht kann gerade und scharf abgegrenzt sein (Taf. 40), häufiger ist er jedoch gezackt oder zerklüftet (Taf. 37).\n\nTagsüber, wenn die Sonne ausreichend hoch über dem Horizont steht, ist die Wolkendecke nie dick genug, um die Schatten von Objekten am Boden zu verdecken.\nEin milchiger Nebelschleier unterscheidet sich von einem Cirrostratus-Schleier ähnlicher Erscheinung durch die Halo-Phänomene, die Sonne oder Mond fast immer in einer Cirrostratus-Schicht hervorrufen.\n\nWas oben über den transparenten Charakter und die Farben der Cirrus-Wolken gesagt wurde, trifft in hohem Maße auch auf Cirrostratus-Wolken zu\n\n#Italic aus dem Internationalen Wolkenatlas, 1930#!"
 MR_ALTOCUMULUS_DESCRIPTION_LOC: "#lore Wolkenfelder oder -schichten in mittlerer Höhe, die aus kleinen Kugeln, Klumpen oder rollenförmigen Elementen bestehen. Sie deuten oft auf einen bevorstehenden Wetterumschwung hin.#!"
 MR_ALTOCUMULUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_reconnaissance_balloon_researched_type')] [GetTechnology('curtiss_reconnaissance_balloon_tech').GetName]"
 MR_ALTOCUMULUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetPlayer.GetCustom('curie_torrential_rains_condition_type')] [GetHarvestConditionType('torrential_rains').GetName]"
 MR_ALTOCUMULUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ #G -10%#! $state_harvest_condition_torrential_rains_impact_mult$"
 MR_ALTOCUMULUS_CLOUD: "Die Grenzen, innerhalb derer Altocumulus vorkommt, sind sehr weit gefasst. In den größten Höhen ähnelt der Altocumulus, der aus kleinen Elementen besteht (Abb. 21), dem Cirrocumulus; der Altocumulus unterscheidet sich jedoch dadurch, dass er keines der folgenden Merkmale des Cirrocumulus aufweist:\n\n1) Verbindung mit Cirrus oder Cirrostratus\n2)Eine Entstehung aus Cirrus oder Cirrostratus.\n3) Eigenschaften aufgrund der physikalischen Struktur (Eiskristalle), die unter Cirrus aufgeführt sind.\n\nIn tieferen Schichten, wo sich Altocumulus aus einer Ausbreitung der Spitzen von Cumuluswolken entwickeln kann (Abb. 25), kann er leicht mit Stratocumulus verwechselt werden; es gilt die Konvention, dass es sich um Altocumulus handelt, wenn die kleinsten, klar abgegrenzten und regelmäßig angeordneten Elemente, die in der Schicht beobachtet werden (abgesehen von den losen Elementen, die im Allgemeinen an den Rändern zu sehen sind), in ihrem kleinsten Durchmesser nicht größer als zehn Sonnendurchmesser sind.\n\n#Italic aus dem Internationalen Wolkenatlas, 1930#!"
 MR_ALTOSTRATUS_DESCRIPTION_LOC: "#lore Altostratus ist eine graue oder bläuliche, geschichtete oder faserige Wolkendecke, die sich oft gleichmäßig über den Himmel erstreckt. Die Sonne scheint in der Regel nur schwach durch sie hindurch.#!"
 MR_ALTOSTRATUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_reconnaissance_balloon_researched_type')] [GetTechnology('curtiss_reconnaissance_balloon_tech').GetName]"
 MR_ALTOSTRATUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetPlayer.GetCustom('curie_frost_condition_type')] [GetHarvestConditionType('frost').GetName]"
 MR_ALTOSTRATUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ #G -10%#! $state_harvest_condition_frost_impact_mult$"
 MR_ALTOSTRATUS_CLOUD: "Die Höhenbereiche, in denen Altostratus auftreten kann, sind recht groß (etwa 5000 bis 2000 Meter).\nEine hohe Altostratus-Schicht unterscheidet sich von einer recht ähnlichen Cirrostratus-Schicht dadurch, dass bei Altostratus keine Halo-Phänomene zu beobachten sind und auch keine Schatten von Objekten am Boden sichtbar sind.\n\nEine niedrige Altostratus-Schicht lässt sich anhand der folgenden Merkmale von einer etwas ähnlichen Nimbostratus-Schicht unterscheiden: Nimbostratus ist deutlich dunkler und einheitlicher grau und weist nirgendwo einen weißlichen Schimmer oder eine faserige Struktur auf; man kann die Grenze seiner Unterseite nicht eindeutig erkennen, die aufgrund des Regens, der möglicherweise nicht bis zum Boden reicht, ein „weiches“ Aussehen hat.\n\nEs gilt außerdem die Konvention, dass der Nimbostratus die Sonne und den Mond in jedem seiner Bereiche vollständig verdeckt, während der Altostratus sie nur stellenweise hinter seinen dunkleren Teilen verdeckt, sie jedoch durch die helleren Teile wieder sichtbar werden (PL 18).\n\n#Italic aus dem Internationalen Wolkenatlas, 1930#!"
 MR_NIMBOSTRATUS_DESCRIPTION_LOC: "#lore Eine dunkelgraue, formlose und dichtere Wolkendecke, die oft so tief hängt, dass sie die Sonne vollständig verdeckt und ihre Ränder verschwimmen.#!"
 MR_NIMBOSTRATUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_early_aviation_researched_type')] [GetTechnology('curtiss_early_aviation_tech').GetName]"
 MR_NIMBOSTRATUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetPlayer.GetCustom('curie_flood_condition_type')] [GetHarvestConditionType('flood').GetName]"
 MR_NIMBOSTRATUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ #G -10%#! $state_harvest_condition_flood_impact_mult$"
 MR_NIMBOSTRATUS_CLOUD: "Der übliche Verlauf ist folgender: Eine Altostratus-Schicht wird immer dichter und senkt sich immer weiter ab, bis sie zu einer Nimbostratus-Schicht wird. Unterhalb des Nimbostratus bilden sich in der Regel nach und nach sehr tief liegende, zerklüftete Wolken, die zunächst vereinzelt auftreten und sich dann zu einer fast durchgehenden Schicht zusammenfügen, in deren Lücken jedoch meist noch der Nimbostratus zu erkennen ist. Diese sehr tief liegenden Wolken werden als Fractocumulus oder Fractostratus bezeichnet, je nachdem, ob sie eher kumuliform oder stratiform erscheinen.\n\nIm Allgemeinen fällt der Regen erst nach der Bildung dieser sehr tief liegenden Wolken, die dann durch den Niederschlag verdeckt werden oder unter dessen Einwirkung sogar wegschmelzen können. Die vertikale Sicht wird dann sehr schlecht.\n\n#Italic aus dem Internationalen Wolkenatlas, 1930#!"
 MR_STRATOCUMULUS_DESCRIPTION_LOC: "#lore Graue oder weißliche, oft grob gesprenkelte Wolkenbänke in Form von Kugeln oder Rollen, die in der Regel den gesamten Himmel in geschlossenen Flecken bedecken, aber auch Lücken aufweisen können.#!"
 MR_STRATOCUMULUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_meteorology_researched_type')] [GetTechnology('curtiss_meteorology_tech').GetName]"
 MR_STRATOCUMULUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ Keine"
 MR_STRATOCUMULUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ Keine"
 MR_STRATOCUMULUS_CLOUD: "Die Elemente einer dichten Stratocumulus-Wolke (Stratocumulus opacus) neigen oft dazu, vollständig miteinander zu verschmelzen, und die Schicht kann sich in bestimmten Fällen in eine Nimbostratus-Wolke verwandeln. Die Wolke wird als Nimbostratus bezeichnet, wenn die Wolkenelemente des Stratocumulus vollständig verschwunden sind und die Unterseite aufgrund der Spuren des herabfallenden Niederschlags keine klar abgegrenzte Grenze mehr aufweist.\n\nStratocumulus kann sich in Stratus (Taf. 10) verwandeln und umgekehrt. Da der Stratus tiefer liegt, erscheinen die Elemente sehr groß und sehr weich, sodass die Struktur aus regelmäßig angeordneten kugelförmigen Massen und Wellen so weit das Auge reicht verschwindet. Die Wolke wird als Stratocumulus bezeichnet, solange die Struktur sichtbar bleibt (Abb. 10.\n\n#Italic aus dem Internationalen Wolkenatlas, 1930#!"
 MR_STRATUS_DESCRIPTION_LOC: "#lore Eine gleichmäßige, graue, tief hängende Wolkendecke, die oft wie aufsteigender Nebel aussieht und den Himmel vollständig verdunkelt. Stratuswolken bringen leichten Nieselregen mit sich, insbesondere im Herbst und Winter.#!"
 MR_STRATUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_montgolfier_balloon_researched_type')] [GetTechnology('curtiss_montgolfier_balloon_tech').GetName]"
 MR_STRATUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ Keine"
 MR_STRATUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ Keine"
 MR_STRATUS_CLOUD: "Ein Schleier aus echtem Stratus verleiht dem Himmel in der Regel ein dunstiges Aussehen, das sehr charakteristisch ist, in bestimmten Fällen jedoch zu Verwechslungen mit Nimbostratus führen kann. Bei Niederschlag ist der Unterschied offensichtlich: Nimbostratus bringt anhaltenden Regen (manchmal Schnee) mit sich, wobei der Niederschlag aus Tröpfchen besteht, die entweder klein und spärlich oder aber groß (zumindest teilweise) und dicht beieinander liegen, während Stratus nur Nieselregen verursacht, d. h. kleine, sehr dicht beieinander liegende Tröpfchen.\n\nWenn kein Niederschlag fällt, kann eine dunkle und gleichmäßige Stratus-Schicht leicht mit Nimbostratus verwechselt werden. Die Unterseite des Nimbostratus weist jedoch stets ein weiches Erscheinungsbild auf (weit verbreiteter, nachhinkender Niederschlag, „Virga“); sie ist recht gleichmäßig und es lassen sich keine eindeutigen Details erkennen; Stratus hingegen hat ein „trockeneres“ Aussehen, und so gleichmäßig er auch sein mag, weist er doch gewisse Kontraste und einige hellere, durchsichtige Stellen auf, d. h. weniger dunkle Bereiche, an denen die Wolke dünner ist, die den Zwischenräumen zwischen den Walzen und kugelförmigen Massen des Stratocumulus entsprechen, jedoch erheblich größer sind, während der Nimbostratus nur schwach beleuchtet zu sein scheint, als würde er von innen heraus leuchten.\n\n#Italic aus dem Internationalen Wolkenatlas, 1930#!"
 MR_CUMULUS_DESCRIPTION_LOC: "#lore Deutlich abgegrenzte, dichte Cumuluswolken mit flacher Basis und kuppelförmigen, blumenkohlartigen Spitzen, die weiß gegen den Himmel leuchten. Der klassische Vorbote für schönes Wetter.#!"
 MR_CUMULUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_montgolfier_balloon_researched_type')] [GetTechnology('curtiss_montgolfier_balloon_tech').GetName]"
 MR_CUMULUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetPlayer.GetCustom('curie_optimal_sunlight_condition_type')] [GetHarvestConditionType('optimal_sunlight').GetName]"
 MR_CUMULUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ #G 10%#! $state_harvest_condition_optimal_sunlight_impact_mult$"
 MR_CUMULUS_CLOUD: "Typische Cumuluswolken (Abb. i) bilden sich an Tagen mit klarem Himmel und entstehen durch die Strömungen der täglichen Konvektion; sie treten am Morgen auf, wachsen an und lösen sich dann gegen Abend mehr oder weniger wieder auf.\Cumuluswolken, deren Basis im Allgemeinen grau gefärbt ist, weisen eine gleichmäßige Struktur auf, das heißt, sie bestehen bis zu ihrer Spitze aus abgerundeten Teilen ohne faserige Struktur (Abb. 2). Selbst in stark ausgeprägter Form können Cumuluswolken nur leichten Niederschlag erzeugen.\n\nErreicht ein Cumulus die Altocumulus-Höhe, wird er manchmal von einem leichten, diffusen und weißen Schleier von mehr oder weniger linsenförmiger Gestalt überlagert, der an den Rändern eine zarte, gestreifte oder schuppige Struktur aufweist; er hat im Allgemeinen die Form eines Bogens, der mehrere Kuppeln des Cumulus bedecken kann und schließlich von diesen durchbrochen wird (Abb. 2).\n\n#Italic aus dem Internationalen Wolkenatlas, 1930#!"
 MR_CUMULONIMBUS_DESCRIPTION_LOC: "#lore Riesige Cumuluswolken, die sich bis in große Höhen (bis zur Tropopause) erheben und Türmen oder Bergen ähneln, wobei ihre oberen Teile oft ein faseriges oder eisdeckelartiges Aussehen annehmen (Capillatus).#!"
 MR_CUMULONIMBUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_early_aviation_researched_type')] [GetTechnology('curtiss_early_aviation_tech').GetName]"
 MR_CUMULONIMBUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetPlayer.GetCustom('curie_hailstorm_condition_type')] [GetHarvestConditionType('hailstorm').GetName]"
 MR_CUMULONIMBUS_BONUS_LOC: "$CURIE_CLOUD_BONUS$ #G -10%#! $state_harvest_condition_hailstorm_impact_mult$"
 MR_CUMULONIMBUS_CLOUD: "Selbst wenn sich ein Cumulonimbus in seiner Form nicht von einem stark entwickelten Cumulus unterscheiden würde, zeigt sich sein wesentlicher Charakter doch in der unterschiedlichen Struktur seiner oberen Teile, sofern diese sichtbar sind (faserige Struktur und cumulusartige Struktur). Cumulusmassen sollten, wie schwer sie auch sein mögen und wie groß ihre vertikale Ausdehnung auch sein mag, niemals als Cumulonimbus klassifiziert werden, es sei denn, ihre Oberkante ist ganz oder teilweise in eine Cirrusmasse umgewandelt (PL 5) oder befindet sich im Prozess der Umwandlung (PL 4).\n\nObwohl die oberen cirrusartigen Teile eines Cumulonimbus sehr unterschiedliche Formen annehmen können, breiten sie sich in bestimmten Fällen doch in Form eines Ambosses aus (PL 5). Diese interessante Variante wird als #Italic incus#! bezeichnet.\n\n#Italic Aus dem Internationalen Wolkenatlas, 1930#!"
 MR_NOCTILUCENT_DESCRIPTION_LOC: "#lore Zarte, faserartige Schleier, wellenförmige Muster oder Streifen am Nachthimmel, die oft in Farbtönen leuchten, die von silberweiß bis zu einem elektrischen Blau reichen. Sie werden sichtbar, wenn die Sonne bereits weit hinter dem Horizont untergegangen ist.#!"
 MR_NOCTILUCENT_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_high_altitude_balloon_researched_type')] [GetTechnology('curtiss_high_altitude_balloon_tech').GetName]"
 MR_NOCTILUCENT_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ [GetGeographicRegion('curie_geographic_region_noctilucent').GetName]."
 MR_NOCTILUCENT_BONUS_LOC: "None"
 MR_NOCTILUCENT_CLOUD: "Nachtleuchtende Wolken (NLC) ähneln dünnen Zirruswolken, weisen jedoch meist eine bläuliche oder silberne, gelegentlich auch orangefarbene bis rote Färbung auf. Sie heben sich deutlich vom dunklen Nachthimmel ab (S. 239).\n\nDie physikalische Beschaffenheit von leuchtenden Nachtwolken ist noch unbekannt, doch gibt es Hinweise darauf, dass sie aus sehr feinem kosmischem Staub bestehen.\n\nLeuchtende leuchtende Nachtwolken wurden bisher nur selten beobachtet, und zwar ausschließlich im Sommer in den nördlichen Regionen der mittleren Breiten der nördlichen Hemisphäre, wenn die Sonne 5–13 Grad unter dem Horizont steht. Messungen haben gezeigt, dass ihre Höhe zwischen 75 und 90 km liegt.\n\n#Italic aus dem Internationalen Wolkenatlas, 1990#!"
 MR_NACREOUS_DESCRIPTION_LOC: "#lore Atemberaubend schillernde, linsenförmige oder wellenförmige Wolken, die kurz vor Sonnenaufgang oder nach Sonnenuntergang in den schillerndsten Regenbogenfarben (vor allem Rosa, Magenta, Cyan und Grün) leuchten.#!"
 MR_NACREOUS_REQUIRED_TECHNOLOGY_LOC: "$CURIE_REQUIRED_TECHNOLOGY$ [GetPlayer.GetCustom('curie_high_altitude_balloon_researched_type')] [GetTechnology('curtiss_high_altitude_balloon_tech').GetName]"
 MR_NACREOUS_REQUIRED_CONDITION_LOC: "$CURIE_REQUIRED_CONDITION$ Polarregion."
 MR_NACREOUS_BONUS_LOC: "None"
 MR_NACREOUS_CLOUD: "Perlmuttwolken (Polar Stratographic Clouds, PSC) ähneln Zirruswolken oder mandelförmigen Altocumuluswolken (S. 237). Wie Perlmutt weisen sie ein sehr ausgeprägtes Schillern auf. Die prächtigsten Farben sind zu beobachten, wenn die Sonne einige Grad unter dem Horizont steht.\n\nDie physikalische Beschaffenheit einer Perlmuttwolke ist noch unbekannt. Man nimmt an, dass diese Wolken aus sehr kleinen Wassertröpfchen oder kugelförmigen Eispartikeln bestehen. \n\nDiese Wolken sind selten. Bislang wurden sie hauptsächlich in Schottland und Skandinavien beobachtet. Messungen haben gezeigt, dass die über Südnorwegen beobachteten Perlmuttwolken in Höhen zwischen 21 und 30 Kilometern auftraten.\n\n#Italic aus dem Internationalen Wolkenatlas, 1990#!"
