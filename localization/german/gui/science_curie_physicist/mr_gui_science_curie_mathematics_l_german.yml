 MR_PHYSICIST_RADIOSONDE_BUTTON: "Radiosonde bauen"
 MR_PHYSICIST_RADIOSONDE_BUTTON_TT: "#T Eine Radiosonde bauen#!\nEine Radiosonde wird in der Meteorologie und Aerologie eingesetzt, um Parameter der Erdatmosphäre in Höhen zwischen etwa 20 km und 35 km (der Stratosphäre) zu messen. Sie wird von einem Wetterballon getragen und übermittelt Messwerte – wie Lufttemperatur, Temperaturgradient und Luftfeuchtigkeit – per Funk an die Bodenstation. Eine solche Radiosonde würde Wettervorhersagen genauer denn je machen!\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
