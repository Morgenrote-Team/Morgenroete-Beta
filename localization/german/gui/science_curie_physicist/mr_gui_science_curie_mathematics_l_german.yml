 MR_PHYSICIST_FORMULA_POSSIBLE_TRIGGER_TT: "#default_text Mit der derzeitigen Technologie lässt sich mindestens eine unbekannte Formel untersuchen.#!"
 MR_PHYSICIST_IMPROVE_MATHEMATICS_TRIGGER_TT: "#default_text Mindestens ein [GetBuildingType('building_university').GetName]-Gebäude der Stufe 1 oder höher mit $concept_pm_academics_university_mathematics$ hat noch nicht alle drei [Concept('concept_modifier','$concept_modifiers|q$')].#!"
 GEOMAGNETIC_RESEARCH_VAR: "#tooltip:[GetRawTextTooltipTag('GEOMAGNETIC_RESEARCH_VAR_TT')] @curie_magnetic_data!  [GetPlayer.MakeScope.GetVariable('curie_magnetic_data_var').GetValue|0+] / [GetGlobalVariable('curie_total_magnetic_data_global_var').GetValue|V0] #!"
 GEOMAGNETIC_RESEARCH_VAR_TT: "#header Geomagnetische Daten#!\n[GetPlayer.GetAltName('NOM')] hat @curie_magnetic_data! [GetPlayer.MakeScope.GetVariable('curie_magnetic_data_var').GetValue|0+] [concept_curie_magnetic_data] der insgesamt @curie_magnetic_data_var! [GetGlobalVariable('curie_total_magnetic_data_global_var').GetValue|V0] [concept_curie_magnetic_data] entdeckt, die von der #V Internationalen Gemeinschaft#! entdeckt wurde."
 MATHEMATICAL_INNOVATION_VAR: "#tooltip:[GetRawTextTooltipTag('MATHEMATICAL_INNOVATION_VAR_TT')] @curie_mathematical_innovation!  [GetPlayer.MakeScope.GetVariable('curie_national_mathematical_innovation_var').GetValue|0+] / [GetGlobalVariable('curie_international_mathematical_innovation_global_var').GetValue|V0] #!"
 MATHEMATICAL_INNOVATION_VAR_TT: "#header MAthematische Innovation#!\n[GetPlayer.GetAltName('NOM')] hat @curie_mathematical_innovation! [GetPlayer.MakeScope.GetVariable('curie_national_mathematical_innovation_var').GetValue|0+] nationale Mathematische Innovation der insgesamt @curie_mathematical_innovation! [GetGlobalVariable('curie_international_mathematical_innovation_global_var').GetValue|V0] von der #V Internationalen Gemeinschaft#! erzeugten Mathematischen Innovation erzeugt."
 CLOUDS_VAR: "#tooltip:[GetRawTextTooltipTag('CLOUDS_VAR_TT')] @curie_clouds!  [GetPlayer.MakeScope.GetVariable('curie_discovered_clouds_country_number_var').GetValue|V0] / [GetGlobalVariable('curie_discovered_clouds_global_number_var').GetValue|V0] #!"
 CLOUDS_VAR_TT: "#header Wolken#!\n[GetPlayer.GetAltName('NOM')] hat @curie_clouds! [GetPlayer.MakeScope.GetVariable('curie_discovered_clouds_country_number_var').GetValue|V0] von @curie_clouds! [GetGlobalVariable('curie_discovered_clouds_global_number_var').GetValue|V0] [Concept('concept_curie_meteorology','$concept_curie_clouds|q$')] beschrieben."
