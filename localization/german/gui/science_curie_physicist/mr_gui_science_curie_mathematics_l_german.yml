 MR_ROCKETRY: "Raketentechnik"
 VISIT_ROCKETRY_BUTTON: "Raketenwissenschaften"
 VISIT_ROCKETRY_BUTTON_TT: "#T Raketenwissenschaften#!\nHier finden Sie einen Überblick über unsere Raketenforschung und die wichtigsten Errungenschaften in der Physik.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 ROCKET_SCIENCE_HEADER_TEXT: "Raketenwissenschaften"
 mr_rocket_equation: "Raketengrundgleichung"
 MR_ROCKET_EQUATION_ACTIVE_TT: "Die Raketengrundgleichung wurde erforscht"
 MR_ROCKET_EQUATION_INACTIVE_TT: "#T Raketengrundgleichung#!\nDie Raketengrundgleichung ist eine der historischen Grundlagen der modernen Raketenwissenschaft. Sie ist auch als Tsiolkovsky-Raketengleichung bekannt, benannt nach dem russischen Raketenpionier Konstantin Tsiolkovsky.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 mr_spaceflight_theory: "Theorie der Raumfahrt"
 mr_rocket_association: "Raketenverein"
 mr_liquid_fuelled_rocket: "Flüssiggetriebene Rakete"
 VISIT_NUCLEAR_PHYSICS_BUTTON: "Kernphysik"
 VISIT_NUCLEAR_PHYSICS_BUTTON_TT: "#T Kernphysik#!\nHier finden Sie einen Überblick über unsere Forschung im Bereich der Kernphysik und die wichtigsten Errungenschaften der Physik.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_DECISION_PROBLEM_BUTTON: "Entscheidungsproblem lösen"
 MR_PHYSICIST_DECISION_PROBLEM_BUTTON_TT: "#T Das Entscheidungsproblem lösen#!\nGibt es eine mechanische Methode, mit der sich für jede mathematische Aussage feststellen lässt, ob sie beweisbar ist? Um diese Frage zu beantworten, die in der Mathematik seit langem diskutiert wird, kann ein Mathematiker mithilfe eines Gedankenexperiments eine Lösung finden. Wie lange dies dauert, hängt von den Fähigkeiten des Mathematikers ab.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ALL_FORMULAS_DISCOVERED_TRIGGER_TT: "#default_text Alle [Concept('concept_curie_mathematics','$concept_curie_mathematical_formulas|q$')] wurden hergeleitet.#!"
