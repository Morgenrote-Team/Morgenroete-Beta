 CURIE_EXPERIMENT_ORSTED_NAME: "$mr_orsted$"
 CURIE_EXPERIMENT_YOUNG_TT: "[Scope.Var('year').GetValue] leitete [Scope.Var('discoverer').GetFlagName] Licht durch zwei schmale Spalte auf eine Leinwand. Das dabei entstehende Interferenzmuster aus hellen und dunklen Streifen bewies, dass sich Licht wie eine Welle verhält, und widerlegte damit erfolgreich Isaac Newtons vorherrschende Teilchentheorie."
 CURIE_EXPERIMENT_ORSTED_TT: "[Scope.Var('year').GetValue] richtete [Scope.Var('discoverer').GetFlagName] einen stromführenden Draht über einem Magnetkompass aus. Die Auslenkung der Nadel bewies, dass Elektrizität ein Magnetfeld erzeugt, und begründete damit das einheitliche Feld des Elektromagnetismus."
 CURIE_EXPERIMENT_JOULES_TT: "[Scope.Var('year').GetValue] verwendete [Scope.Var('discoverer').GetFlagName] fallende Gewichte, um Schaufelräder in isoliertem Wasser anzutreiben. Der daraus resultierende Temperaturanstieg zeigte, dass mechanische Arbeit direkt in Wärme umgewandelt wird, womit der Energieerhaltungssatz bewiesen wurde."
 CURIE_EXPERIMENT_DOPPLER_TT: "[Scope.Var('year').GetValue] überprüfte [Scope.Var('discoverer').GetFlagName] Dopplers Theorie mithilfe von Trompetenspielern in einem fahrenden Zug. Die beim Vorbeifahren des Zuges beobachtete Tonhöhenverschiebung bestätigte den Doppler-Effekt und bewies damit, dass Bewegung die akustische Frequenz verändert."
 CURIE_EXPERIMENT_FOUCAULT_TT: "[Scope.Var('year').GetValue] hängte [Scope.Var('discoverer').GetFlagName] ein schweres Pendel an einem langen Draht auf. Die allmähliche Drehung seiner Schwingebene relativ zum Boden lieferte einen direkten visuellen Beweis für die Achsenrotation der Erde, ohne dass Himmelsbeobachtungen erforderlich waren."
 CURIE_EXPERIMENT_FIZEAU_TT: "[Scope.Var('year').GetValue] lenkte [Scope.Var('discoverer').GetFlagName] Licht durch ein rotierendes Zahnrad auf einen weit entfernten Spiegel. Durch das Abfangen des zurückgestrahlten Lichts bei bekannten Drehzahlen gelang die erste terrestrische Messung der Lichtgeschwindigkeit."
 CURIE_EXPERIMENT_WEBER_TT: "[Scope.Var('year').GetValue] maß [Scope.Var('discoverer').GetFlagName] die elektrische Ladung mithilfe eines Leidener Glases und eines Galvanometers. Das Verhältnis zwischen elektrostatischen und elektromagnetischen Einheiten ergab die Lichtgeschwindigkeit und bewies damit die elektromagnetische Natur des Lichts."
 CURIE_EXPERIMENT_MICHELSON_TT: "[Scope.Var('year').GetValue] spaltete [Scope.Var('discoverer').GetFlagName] das Licht mithilfe eines empfindlichen Interferometers in senkrecht zueinander stehende Strahlen auf. Das Ausbleiben der erwarteten Streifenverschiebungen widerlegte die Existenz des Lichtäthers und ebnete den Weg für die spezielle Relativitätstheorie."
 CURIE_EXPERIMENT_HERTZ_TT: "[Scope.Var('year').GetValue] nutzte [Scope.Var('discoverer').GetFlagName] Funkenstrecken, um unsichtbare Radiowellen zu erzeugen und zu erfassen. Damit wurde nachgewiesen, dass diese die Geschwindigkeit und die Welleneigenschaften des Lichts teilten, was Maxwells elektromagnetische Theorie bestätigte und den Grundstein für die drahtlose Kommunikation legte."
 CURIE_EXPERIMENT_THOMSON_TT: "[Scope.Var('year').GetValue] lenkte [Scope.Var('discoverer').GetFlagName] Kathodenstrahlen mithilfe elektrischer und magnetischer Felder in einer Vakuumröhre ab. Die Messung ihres Ladungs-Massen-Verhältnisses brachte negative subatomare Teilchen – Elektronen – zum Vorschein und widerlegte damit die Vorstellung, dass Atome unteilbar seien."
 CURIE_EXPERIMENT_MILIKAN_TT: "[Scope.Var('year').GetValue] hielt [Scope.Var('discoverer').GetFlagName] elektrisch geladene Öltröpfchen zwischen zwei Metallplatten in der Schwebe. Durch das Ausgleichen der Schwerkraft durch die elektrische Kraft wurde nachgewiesen, dass die Ladung in festen Einheiten quantisiert ist, wodurch die Ladung des Elektrons genau bestimmt werden konnte."
 CURIE_EXPERIMENT_RUTHERFORD_TT: "[Scope.Var('year').GetValue] richtete [Scope.Var('discoverer').GetFlagName] Alpha-Teilchen auf eine dünne Goldfolie. Unerwartete Ablenkungen in einem weiten Winkel bewiesen, dass sich die Atommasse und die positive Ladung in einem winzigen zentralen Kern konzentrieren, wodurch das Modell des gleichförmigen Atoms abgelöst wurde."
 CURIE_EXPERIMENT_FRANCK_TT: "[Scope.Var('year').GetValue] leitete [Scope.Var('discoverer').GetFlagName] beschleunigte Elektronen durch Quecksilberdampf. Periodische Stromabfälle bei bestimmten Spannungen bewiesen, dass Atome Energie in diskreten Quanten absorbieren, was Bohrs Modell der quantisierten Energieniveaus bestätigte."
 CURIE_EXPERIMENT_EDDINGTON_TT: "[Scope.Var('year').GetValue] fotografierte [Scope.Var('discoverer').GetFlagName] während einer totalen Sonnenfinsternis Sterne in der Nähe der Sonne. Die beobachtete gravitative Ablenkung des Sternenlichts lieferte den ersten empirischen Beweis für die Allgemeine Relativitätstheorie."
 CURIE_EXPERIMENT_STERN_TT: "[Scope.Var('year').GetValue] lenkte [Scope.Var('discoverer').GetFlagName] Silberatome durch ein ungleichmäßiges Magnetfeld. Der Strahl teilte sich in zwei unterschiedliche Pfade auf, anstatt ein Kontinuum zu bilden, was die Raumquantisierung bewies und den intrinsischen Quantenspin entdeckte."
