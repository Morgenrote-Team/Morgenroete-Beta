 MR_PHYSICIST_MATHEMATICAL_INNOVATION_BUTTON: "Mathematische Innovation"
 MR_PHYSICIST_MATHEMATICAL_INNOVATION_BUTTON_TT: "#T Mathematische Innovation#!\nDieses Projekt ist verfügbar, wenn der [concept_curie_mathematical_physicist] nicht mit einer anderen Aufgabe beschäftigt ist.\n\nIhr [concept_curie_physicist] trägt dazu bei, ihre wöchentliche Innovationskapazität zu erhöhen, und verringert den Malus für Technologien, die ihrer Zeit voraus sind.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_FORMULA_DISCOVERY_BUTTON: "Neue Formel"
 MR_PHYSICIST_FORMULA_DISCOVERY_BUTTON_TT: "#T Neue Formel#!\nMathematiker können neue Formeln ableiten, vorausgesetzt, die richtige Technologie steht zur Verfügung und es gibt noch unerforschte Formeln. Mit jeder neu entdeckten Formel steigt die Menge der zu untersuchenden physikalischen Daten.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_IMPROVE_MATHEMATICS_BUTTON: "Mathematik verbessern"
 MR_PHYSICIST_IMPROVE_MATHEMATICS_BUTTON_TT: "#T Mathematik verbessern#!\nEin Mathematiker kann eine [GetBuildingType('building_university').GetName] besuchen, um durch Vorlesungen und Seminare neue wissenschaftliche Standards zu verbreiten.\n\nModifikatoren, die das Gebäude erhält:\n$curie_building_throughput_add_modifier_with_tooltip$\n$curie_building_production_mult_modifier_with_tooltip$\n$curie_building_goods_input_mult_modifier_with_tooltip$\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_EXPERIMENT_BUTTON: "Physikalisches Experiment"
 MR_PHYSICIST_EXPERIMENT_BUTTON_TT: "#T Physikalisches Experiment#!\nEin Physiker kann ein Experiment durchführen, das bei Erfolg historische Auswirkungen haben könnte. Das kann jeder Physiker tun.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_EXPERIMENT_POSSIBLE_TRIGGER_TT: "#default_text [GetPlayer.GetAltName('NOM')] hat #R nicht#! den [concept_modifier] #V $curie_physics_experiment_successful_modifier$#! oder #V $curie_physics_experiment_failure_modifier$#!."
 MR_PHYSICIST_METEOROLOGICAL_OBSERVATION_BUTTON: "Meteorologische Beobachtung"
 MR_PHYSICIST_METEOROLOGICAL_OBSERVATION_BUTTON_TT: "#T Meteorologische Beobachtung#!\nDas [Concept('concept_curie_meteorology','$je_curie_meteorological_observation|q$')] ist verfügbar, wenn der [concept_curie_meteorological_physicist] nicht mit einer anderen Aufgabe beschäftigt ist.\n\nIhr [concept_curie_physicist] hilft Ihnen dabei, Ihre jährlichen @curie_physical_data! [concept_curie_physical_data] zu steigern.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_WEATHER_STATION_EXPANSION_BUTTON: "Erweiterung der Wetterstation"
 MR_PHYSICIST_WEATHER_STATION_EXPANSION_BUTTON_TT: "#T Erweiterung der Wetterstation#!\nSofern eine Beobachtungsstation und die entsprechende Technologie vorhanden sind, kann ein [concept_curie_meteorological_physicist] die dortige Wetterstation erweitern, um die Wettervorhersagen für das gesamte Land zu verbessern – und extreme Wetterereignisse durch rechtzeitige Warnungen besser zu bewältigen.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 PHYSICIST_HAS_NO_WEATHER_STATION_PM_TT: "#default_text [GetPlayer.GetAltName('NOM')] verfügt über ein [GetBuildingType('building_verrier_observatory').GetName] mit dem [concept_production_method] #V $pm_curtiss_no_weather_station$#!."
 PHYSICIST_HAS_EARLY_WEATHER_STATION_PM_TT: "#default_text [GetPlayer.GetAltName('NOM')] verfügt über ein [GetBuildingType('building_verrier_observatory').GetName] mit der [concept_production_method] #V $pm_curtiss_early_weather_station$#!."
 PHYSICIST_HAS_WEATHER_STATION_PM_TT: "#default_text [GetPlayer.GetAltName('NOM')] hat ein [GetBuildingType('building_verrier_observatory').GetName] mit der [concept_production_method] #V $pm_curtiss_weather_station$#!."
 MR_PHYSICIST_IMPROVE_METEOROLOGY_BUTTON: "Wetterstationsnetzwerk"
 MR_PHYSICIST_IMPROVE_METEOROLOGY_BUTTON_TT: "#T Wetterstationsnetzwerk#!\nMit dem Aufkommen des Telegrafen hat die Meteorologie einen unglaublichen Vorteil gewonnen: Sie kann Wetterdaten aus allen Teilen des Landes im Handumdrehen übertragen und vergleichen und so Vorhersagen und Warnungen herausgeben. Ein [concept_curie_meteorological_physicist] kann in einem Staat mit einem [GetBuildingType('building_tesla_telegraph').GetName] Wetterstationen einrichten, um einer Vielzahl von Wetterphänomenen gerecht zu werden.\n\nModifikatoren, die das Gebäude erhält:\n$curie_building_throughput_add_modifier_with_tooltip$\n$curie_building_production_mult_modifier_with_tooltip$\n$curie_building_goods_input_mult_modifier_with_tooltip$\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_IMPROVE_METEOROLOGY_TRIGGER_TT: "#default_text Mindestens ein [GetBuildingType('building_tesla_telegraph').GetName]-Gebäude der Stufe 1 oder höher verfügt nicht über alle drei [Concept('concept_modifier','$concept_modifiers|q$')].#!"
 MR_PHYSICIST_AGRICULTURAL_WEATHER_SERVICE_BUTTON: "Landwirtschaftlicher Wetterdienst"
 MR_PHYSICIST_AGRICULTURAL_WEATHER_SERVICE_BUTTON_TT: "#T Landwirtschaftlicher Wetterdienst#!\nEin [concept_curie_meteorological_physicist] könnte sich auf Wettervorhersagen für den Agrarsektor beschränken und für drei Jahre einen Wetterdienst für Landwirte einrichten, um diese vor meteorologischen Ereignissen zu warnen. Je erfahrener ein Meteorologe ist, desto besser werden die Ergebnisse sein.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_ADVANCED_WEATHER_STATION_TRIGGER_TT: "#default_text [GetPlayer.GetAltName('NOM')] hat ein [GetBuildingType('building_verrier_observatory').GetName] mit der [concept_production_method] #V $pm_curtiss_weather_station$#! oder $pm_curtiss_modern_weather_station$."
 MR_PHYSICIST_50_OR_MORE_EXPERIENCE_TRIGGER_TT: "#default_text Der [concept_curie_meteorological_physicist] hat #V 50 oder mehr#! [concept_academics_experience].#!"
 MR_PHYSICIST_MARINE_WEATHER_SERVICE_BUTTON: "Seewetterbericht"
 MR_PHYSICIST_MARINE_WEATHER_SERVICE_BUTTON_TT: "#T Seewetterbericht#!\nEin [concept_curie_meteorological_physicist] beschränkt sich möglicherweise auf Wettervorhersagen für die Marine, um diese vor Gefahren auf See zu warnen. Dieses Projekt wird drei Jahre dauern. Je erfahrener ein Meteorologe ist, desto besser werden die Ergebnisse sein.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_5_FLOTILLAS_TRIGGER_TT: "#default_text [GetPlayer.GetAltName('NOM')] hat #V 5 oder mehr Schiffe#!.#!"
 MR_PHYSICIST_FOUND_MAGNETIC_ASSOCIATION_BUTTON: "Magnetischer Verein"
 MR_PHYSICIST_FOUND_MAGNETIC_ASSOCIATION_BUTTON_TT: "#T Gründe den Magnetischen Verein#!\nEin internationaler magnetischer Verein zur Erforschung des Erdmagnetismus bietet dem Gründer insbesondere eine Reihe von Vorteilen bei der Erfassung physikalischer Daten sowie einen kleinen technologischen Bonus. Außerdem wird dadurch das geomagnetische Observatorium als Produktionsmethode freigeschaltet.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_MAGNETIC_RESEARCH_STATION_BUTTON: "Geomagnetisches Observatorium"
 MR_PHYSICIST_MAGNETIC_RESEARCH_STATION_BUTTON_TT: "#T Baue das geomagnetische Observatorium#!\nWir können unser Observatorium um ein geomagnetisches Observatorium erweitern, um das Erdmagnetfeld genauer zu untersuchen. Dazu müssen wir dem Magentischen Verein beitreten.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_NO_MAGNETIC_OBSERVATORY_TRIGGER_TT: "#default_text [GetPlayer.GetAltName('NOM')] hat ein [GetBuildingType('building_verrier_observatory').GetName] mit der [concept_production_method] #V „Kein geomagnetisches Observatorium“#!."
 MAGNETIC_ASSOCIATION_TRIGGER_TT: "#default_text Der Magnetische Verein wurde gegründet.#!"
 MR_NO_MAGNETIC_ASSOCIATION_TRIGGER_TT: "#default_text Der Magnetische Verein wurde #R noch nicht#! gegründet."
 MR_PHYSICIST_MAGNETIC_ATLAS_BUTTON: "Geomagnetischer Atlas"
 MR_PHYSICIST_MAGNETIC_ATLAS_BUTTON_TT: "#T Geomagnetischen Atlas erstellen#!\nAnhand unserer umfangreichen geomagnetischen Daten könnte ein Physiker seinen eigenen geomagnetischen Atlas erstellen. Ein solches Werk würde unser Verständnis der Physik erheblich vertiefen.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PHYSICIST_MAGNETIC_OBSERVATORY_TRIGGER_TT: "#default_text [GetPlayer.GetAltName('NOM')] hat ein [GetBuildingType('building_verrier_observatory').GetName]-Gebäude mit der [concept_production_method] #V $pm_curie_magnetic_observatory$#!."
 MR_PHYSICIST_15_MAGNETIC_DATA_TRIGGER_TT: "#default_text [GetPlayer.GetAltName('NOM')] hat mindestens #V 15#! @curie_magnetic_data! [concept_curie_magnetic_data].#!"
