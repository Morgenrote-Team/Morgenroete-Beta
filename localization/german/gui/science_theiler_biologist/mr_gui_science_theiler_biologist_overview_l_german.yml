 THEILER_BIOLOGIST_PHARMACEUTICALS_VAR_TT: "#header Arzneimittel#!\n[GetPlayer.GetAltName('NOM')] hat @theiler_pharmaceuticals_texticon! [GetPlayer.MakeScope.GetVariable('theiler_num_pharmaceuticals_var').GetValue|V0] von 10 #V Arzneimitteln#! hergestellt.\n\n#V Arzneimittel#! und ihr Status:\n[GetPlayer.GetCustom('theiler_pharmaceutical_aloin_type')] #V Aloin#!\n[GetPlayer.GetCustom('theiler_pharmaceutical_atropine_type')] #V Atropin#!\n[GetPlayer.GetCustom('theiler_pharmaceutical_digitoxin_type')] #V Digitoxin#!\n[GetPlayer.GetCustom('theiler_pharmaceutical_emetine_type')] #V Emetin#!\n[GetPlayer.GetCustom('theiler_pharmaceutical_ephedrine_type')] #V Ephedrin#!\n[GetPlayer.GetCustom('theiler_pharmaceutical_pilocarpine_type')] #V Pilocarpin#!\n[GetPlayer.GetCustom('theiler_pharmaceutical_quinine_type')] #V Chinin#!\n[GetPlayer.GetCustom('theiler_pharmaceutical_strophantine_type')] #V Strophantin#!\n[GetPlayer.GetCustom('theiler_pharmaceutical_strychnine_type')] #V Strychnin#!\n[GetPlayer.GetCustom('theiler_pharmaceutical_thymol_type')] #V Thymol#!"
