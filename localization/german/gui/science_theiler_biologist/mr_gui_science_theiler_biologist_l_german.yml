 MR_BIOLOGIST_CAN_FIND_YELLOW_FEVER_PATHOGEN_HAS_DESCRIPTION_CHECKMARK_TT: "$panum_checkmark_loc$ $panum_has_yellow_fever_description_tt$"
 MR_BIOLOGIST_CAN_FIND_YELLOW_FEVER_PATHOGEN_HAS_MICROORGANISMS_TT: "\n@simple_box! [GetPlayer.GetAltName('NOM')] hat #V [GetPlayer.MakeScope.ScriptValue('theiler_yellow_fever_microorganism_requirement_value')|0] oder mehr#! @theiler_microorganisms_texticon! [Concept('concept_theiler_microorganism','$concept_theiler_microorganisms|q$')] (derzeit [GetPlayer.MakeScope.GetVariable('theiler_microorganisms_var').GetValue|0])."
 MR_BIOLOGIST_CAN_FIND_YELLOW_FEVER_PATHOGEN_HAS_MICROORGANISMS_CHECKMARK_TT: "\n$panum_checkmark_loc$ [GetPlayer.GetAltName('NOM')] hat #V [GetPlayer.MakeScope.ScriptValue('theiler_yellow_fever_microorganism_requirement_value')|0] oder mehr#! @theiler_microorganisms_texticon! [Concept('concept_theiler_microorganism','$concept_theiler_microorganisms|q$')] (derzeit [GetPlayer.MakeScope.GetVariable('theiler_microorganisms_var').GetValue|0])."
 MR_BIOLOGIST_SIT_BUTTON: "Sterile-Insekten-Technik"
 MR_BIOLOGIST_SIT_BUTTON_TT: "#T Sterile-Insekten-Technik#!\nAngesichts der vielfältigen technologischen Möglichkeiten könnte ein Biologe mit staatlicher Unterstützung eine Methode erforschen, um die lästige Schraubenfliege endgültig auszurotten. Dies würde die landwirtschaftlichen Erträge in den betroffenen Regionen verbessern.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_SCREWWORM_FLY_TRIGGER: "#default_text [GetPlayer.GetAltName('NOM')] hat mindestens einen Staat im Lebensraum der [GetHarvestConditionType('theiler_screwworm_fly_condition').GetName].#!"
 MR_BIOLOGIST_LEAD_ARSENATE_BUTTON: "Bleiarsenat"
 MR_BIOLOGIST_LEAD_ARSENATE_BUTTON_TT: "#T Bleiarsenat#!\nDie derzeit verwendeten anorganischen Pestizide, die bereits erste Wirksamkeit gegen bestimmte Insekten zeigen, lassen noch erheblichen Raum für Verbesserungen. „Schweinfurter Grün“ könnte durch ein auf Blei basierendes Arsenat ersetzt werden. Ein Biologe könnte dieses neue Pestizid mit Unterstützung eines Chemikers entwickeln, um dem Kartoffelkäfer und dem Apfelwickler rasch ein Ende zu bereiten.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_MOTH_OR_BEETLE_STATE_TRIGGER: "#default_text [GetPlayer.GetAltName('NOM')] hat mindestens einen Staat im Lebensraum des [GetHarvestConditionType('theiler_potato_beetle_condition').GetName] or the [GetHarvestConditionType('theiler_codling_moth_condition').GetName].#!"
 MR_BIOLOGIST_SODIUM_ARSENITE_BUTTON: "Natriumarsenit"
 MR_BIOLOGIST_SODIUM_ARSENITE_BUTTON_TT: "#T Sodium Arsenite#!\nHerkömmliche Pestizide, Mückenschutzmittel und sogar Flammenwerfer reichen nicht aus, um die Heuschrecken auszurotten. Hier muss man in größeren Dimensionen denken!\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_LOCUST_STATE_TRIGGER: "#default_text [GetPlayer.GetAltName('NOM')] hat mindestens einen Staatim Lebensraum eines [GetHarvestConditionType('locust_swarm').GetName].#!"
 MR_BIOLOGIST_CALCIUM_ARSENATE_BUTTON: "Kalciumarsenit"
 MR_BIOLOGIST_CALCIUM_ARSENATE_BUTTON_TT: "#T Kalciumarsenit#!\nUm den enormen Verlusten im Baumwollanbau ein Ende zu setzen, sind drastischere Maßnahmen erforderlich. Möglicherweise ist sogar etwas noch Wirksameres als bloßes Bleiarsenat nötig.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BOLL_WEEVIL_STATE_TRIGGER: "#default_text [GetPlayer.GetAltName('NOM')] hat mindestens einen Staatim Lebensraum der [GetHarvestConditionType('theiler_boll_weevil_condition').GetName].#!"
 MR_BIOLOGIST_NICOTINE_SULFATE_BUTTON: "Nikotinsulfat"
 MR_BIOLOGIST_NICOTINE_SULFATE_BUTTON_TT: "#T Nikotinsulfat#!\nFrüher galten Tabakextrakte als Hausmittel, um Teemücken von den Plantagen fernzuhalten. Es ist eine neue, industrielle Methode gefragt! Ein Biologe könnte dieses neue Pflanzenschutzmittel mit Unterstützung eines Chemikers entwickeln, um den Teemücken ein schnelles Ende zu bereiten.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_TEA_MOSQUITO_STATE_TRIGGER: "#default_text [GetPlayer.GetAltName('NOM')] hat mindestens einen Staatim Lebensraum der [GetHarvestConditionType('theiler_tea_mosquito_condition').GetName].#!"
 MR_BIOLOGIST_GRAFTING_BUTTON: "Veredelung"
 MR_BIOLOGIST_GRAFTING_BUTTON_TT: "#T Veredelung#!\nAlle bisher gegen die Reblaus eingesetzten chemischen Mittel haben versagt. Vielleicht lässt sich eine Lösung außerhalb des Bereichs hochgiftiger Pestizide finden?\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_GRAPE_PHYLLOXERA_STATE_TRIGGER: "#default_text [GetPlayer.GetAltName('NOM')] hat mindestens einen Staatim Lebensraum der [GetHarvestConditionType('theiler_grape_phylloxera_condition').GetName].#!"
 BIOLOGICAL_CONGRESS_BUTTON: "Biologie-Kongress ausrichten"
 BIOLOGICAL_CONGRESS_BUTTON_TT: "#T Biologie-Kongress ausrichten#!\nAngesichts der Revolution in der mikrobiologischen Forschung und der gleichzeitigen Ausbreitung gefährlicher Epidemien und Schädlinge wuchs die Notwendigkeit, Erkenntnisse auf internationalen Kongressen zum Wohle der Menschheit auszutauschen. Mit etwas Glück lassen sich so Kenntnisse über Krankheitserreger, Impfstoffe und Pflanzenschutzmittel austauschen.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGICAL_BREAKTHROUGH_TRIGGER_TT: "#default_text [GetPlayer.GetAltName('NOM')] hat den #V $theiler_biological_breakthrough_modifier$#! $concept_modifier$.#!"
 MR_BIOLOGY_5_COUNTRIES_WITH_BIOLOGIST_TRIGGER_TT: "#default_text 5 oder mehr Länder haben einen [Concept('concept_theiler_biologist','$concept_theiler_biologists|q$')].#!"
 MR_BIOLOGICAL_CONGRESS_COOLDOWN_TRIGGER_TT: "#default_text In den #V letzten 5 Jahren#! hat es keinen #V Biologiekongress#! gegeben (der letzte Gastgeber verfügt nicht über den Modifikator „$theiler_congress_host_modifier$“).#!"
 MR_BIOLOGIST_CAVENDISH_BUTTON: "Cavendish"
 MR_BIOLOGIST_CAVENDISH_BUTTON_TT: "#T Cavendish#!\nAlle bisher gegen die Panama-Krankheit eingesetzten chemischen Mittel haben versagt. Vielleicht könnte die Einführung einer anderen Bananensorte Abhilfe schaffen.?\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_PANAMA_DISEASE_STATE_TRIGGER: "#default_text [GetPlayer.GetAltName('NOM')] hat mindestens einen Staat mit einem [GetBuildingType('building_banana_plantation').GetName]-Gebäude.#!"
 MR_BIOLOGICAL_CONGRESS_BUTTON: "Biologie-Kongress ausrichten"
 MR_BIOLOGICAL_CONGRESS_BUTTON_TT: "#T Biologie-Kongress ausrichten#!\nAngesichts der Revolution in der mikrobiologischen Forschung und der gleichzeitigen Ausbreitung gefährlicher Epidemien und Schädlinge wuchs die Notwendigkeit, Erkenntnisse auf internationalen Kongressen zum Wohle der Menschheit auszutauschen. Mit etwas Glück lassen sich so Kenntnisse über Krankheitserreger, Impfstoffe und Pflanzenschutzmittel austauschen.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
