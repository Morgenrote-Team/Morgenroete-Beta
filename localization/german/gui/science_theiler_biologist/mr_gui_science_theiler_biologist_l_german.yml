l_german:
 MR_BIOLOGIST_MICROORGANISM_RESEARCH_BUTTON: "Mikroorganismenforschung"
 MR_BIOLOGIST_MICROORGANISM_RESEARCH_BUTTON_TT: "#T Microorganism Research#!\nThe search for new [Concept('concept_theiler_microorganism','$concept_theiler_microorganisms|q$')], their study, and the associated experiments are an essential part of microbiological work. Biologists can not only conduct preliminary work for the search for a pathogen but also make serendipitous discoveries.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGIST_MICROORGANISM_RESEARCH_ACTIVE_TT: "#T Microorganism Research#!\nYour [concept_theiler_biologist] is currently searching for new [Concept('concept_theiler_microorganism','$concept_theiler_microorganisms|q$')], studying them, and experimenting with them. Biologists can not only conduct preliminary work for the search for a pathogen but also make serendipitous discoveries.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGIST_FIND_PATHOGEN_BUTTON: "Krankheitserreger finden"
 MR_BIOLOGIST_FIND_PATHOGEN_BUTTON_TT: "#T Krankheitserreger finden#!\nDie Suche nach einem [concept_theiler_pathogen] ist eine Voraussetzung für die anschließende Entwicklung eines Impfstoffs. Je nach Pathogen kann der Entdeckungsprozess länger dauern oder nur unter bestimmten Bedingungen beginnen.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGIST_FIND_PATHOGEN_ACTIVE_TT: "#T Krankheitserreger finden#!\nIhr [concept_theiler_biologist] sucht derzeit nach einem [concept_theiler_pathogen], der eine Voraussetzung für die anschließende Entwicklung eines Impfstoffs ist. Je nach Erreger kann der Entdeckungsprozess länger dauern oder nur unter bestimmten Bedingungen beginnen.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ACTIVE_BIOLOGIST_TRIGGER: "#default_text [GetPlayer.GetAltName('NOM')] hat einen [Concept('concept_theiler_biologist','$concept_theiler_biologists$')], der #V nicht beschäftigt#! ist.#!"
 MR_BIOLOGIST_CAN_FIND_PATHOGEN_TRIGGER_TT: "#default_text Beliebige der folgenden Bedingungen:[GetPlayer.GetCustom('GUI_theiler_can_find_cholera_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_diphtheria_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_measles_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_plague_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_polio_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_typhus_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_scarlet_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_smallpox_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_tuberculosis_trigger_custom_loc')][GetPlayer.GetCustom('GUI_theiler_can_find_yellow_fever_trigger_custom_loc')]#!"
 MR_BIOLOGIST_CREATE_VACCINE_BUTTON: "Impfstoff entwickeln"
 MR_BIOLOGIST_CREATE_VACCINE_BUTTON_TT: "#T Create Vaccine#!\nYour [concept_theiler_biologist] is currently creating a Vaccine, the Pinnacle of a Biologist's work. It requires first research into the [concept_theiler_pathogen] that causes the disease. Under certain circumstances, [Concept('concept_theiler_vaccine','$concept_theiler_vaccines|q$')] can completely prevent the outbreak of disease.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGIST_CREATE_VACCINE_ACTIVE_TT: "#T Create Vaccine#!\nVaccine development is a biologist's pinnacle. It requires first research into the [concept_theiler_pathogen] that causes the disease. Under certain circumstances, [Concept('concept_theiler_vaccine','$concept_theiler_vaccines|q$')] can completely prevent the outbreak of disease.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGIST_CAN_CREATE_VACCINE_TRIGGER_TT: "#default_text [GetPlayer.GetAltName('NOM')] hat einen Krankheitserreger entdeckt, für den es noch keinen Impfstoff gibt, und verfügt auch über die entsprechende Technologie.#!"
 MR_10000_SPECIMEN_TRIGGER_TT: "#default_text [GetPlayer.GetName] has #V 10000 or more#! [Concept('concept_dubois_specimen','$concept_dubois_specimens|q$')] (currently [GetPlayer.MakeScope.Var('dubois_specimen').GetValue|0+]).#!"
 MR_BOTANICAL_EXPEDITION_BUTTON_TT: "#T Botanische Expedition#!\nBotanische Expeditionen (manchmal auch als „Pflanzenjagd” bezeichnet) sind wissenschaftliche Reisen, deren Ziel es ist, die Flora einer bestimmten Region zu erforschen. Ein [concept_dubois_naturalist] ist für die Identifizierung, Beschreibung und Sammlung von Exemplaren und [concept_ito_medicinal_plants] verantwortlich.\n\nBeachten Sie, dass Sie die [concept_technology] [GetTechnology('malaria_prevention').GetName] benötigen, falls die Expedition in einen Staat entsandt werden soll, der von Malaria heimgesucht wird.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_SAFARI_EXPEDITION_BANNED_TRIGGER_TT: "#default_text Botanische Expeditionen wurden aus #V politischen Gründen#! verboten.#!"
 MR_SAFARI_EXPEDITION_ACCESS_RAINFOREST_TRIGGER_TT: "#default_text [GetPlayer.GetAltName('NOM')] besitzt einen Staat mit einer [concept_ito_medicinal_plants]-Eigenschaft. Sollte der Staat ein #V Malaria-Staat#! sein, müssen Sie zusätzlich die [concept_technology] [GetTechnology('malaria_prevention').GetName] erforscht haben.#!"
 MR_BOTANICAL_EXPEDITION_RECALL_BUTTON_TT: "#T Naturforscher von botanischer Expedition zurückrufen#!\nBefiehlt dem [concept_dubois_naturalist], seine botanische Forschung zu unterbrechen, um ihn für andere Zwecke einzusetzen – beispielsweise zum Fangen von Tieren.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BOTANICAL_EXPEDITION_RECALL_TRIGGER_TT: "#default_text Ihr [concept_dubois_naturalist] ist #V weder auf Reisen noch krank#!.#!"
 MR_BOTANICAL_EXPEDITION_RECALL_NATURALIST_EFFECT_TT: "Ihr [concept_dubois_naturalist] ist nicht mehr beschäftigt."
 MR_BIOLOGIST_IMPROVE_AGRICULTURE_BUTTON: "Landwirtschaft verbessern"
 MR_BIOLOGIST_IMPROVE_AGRICULTURE_BUTTON_TT: "#T Landwirtschaft verbessern#!\nIhr Biologe kann seine Fähigkeiten einsetzen, um die landwirtschaftlichen Gebäude in Ihrem Land zu verbessern. Dadurch wird eines Ihrer [GetBuildingGroup('bg_agriculture').GetName], [GetBuildingGroup('bg_ranching').GetName] oder [GetBuildingGroup('bg_plantations').GetName]-Gebäude verbessert.\n\nModifikatoren, die das Gebäude erhält:\n$theiler_building_throughput_add_modifier_with_tooltip$\n$theiler_building_production_mult_modifier_with_tooltip$\n$theiler_building_goods_input_mult_modifier_with_tooltip$\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_BIOLOGIST_IMPROVE_AGRICULTURE_TRIGGER_TT: "#default_text At least one [GetBuildingGroup('bg_agriculture').GetName], [GetBuildingGroup('bg_ranching').GetName] or [GetBuildingGroup('bg_plantations').GetName]-Buildings of level 1 or higher does not have all three [Concept('concept_modifier','$concept_modifiers|q$')].#!"
 MR_BIOLOGIST_IMPROVE_AGRICULTURE_ACTIVE_TT: "#T Landwirtschaft verbessern#!\n#p Ihr Biologe verbessert derzeit ein [GetBuildingGroup('bg_agriculture').GetName], [GetBuildingGroup('bg_ranching').GetName] oder [GetBuildingGroup('bg_plantations').GetName]-Gebäude.#!"
