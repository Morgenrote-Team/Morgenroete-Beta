l_german:
 MR_AUTOMATE_ENGINEER_TT: "#T Automatisierung des [Concept('concept_tesla_engineer','#b #ORANGE Ingenieurs#!#!')]#!\nSie müssen Ihren Ingenieur keine Aufgaben mehr geben, wenn Sie sie automatisieren.\nSie werden unabhängig arbeiten und Aufgaben ausführen, die im Moment sinnvoll sind. Sie werden aber immer noch einige Ereignisse erhalten.\n\n#n Beachten Sie, dass die Automatisierung wahrscheinlich weniger effizient ist, als wenn Sie den Ingenieur direkt steuern.#!"
 mr_engineering_automation_gui_tt: "Starte die Automatisierung der Aufgaben des [Concept('concept_tesla_engineer','#b #ORANGE Ingenieurs#!#!')]."
 mr_stop_engineering_automation_gui_tt: "Stoppe die Automatisierung der Aufgaben des [Concept('concept_tesla_engineer','#b #ORANGE Ingenieurs#!#!')]."
 MR_STOP_AUTOMATE_ENGINEER_TT: "#T Stoppt die Automatisierung des [Concept('concept_tesla_engineer','#b #ORANGE Ingenieurs#!#!')]#!\nIhr Ingenieur wird nicht mehr automatisiert arbeiten."
 MR_ENGINEER_RANKING_BUTTON: "Ingenieure"
 MR_RANKING_BY_ENGINEER: "Ranking aller [Concept('concept_tesla_engineer','$concept_tesla_engineers|q$')] in der Welt anzeigen."
 ENGINEER_ENGINEER_RANKING_HEADER: "[Concept('concept_tesla_engineer','$concept_tesla_engineers|q$')] der Welt, geordnet nach [concept_academics_experience]"
 tesla_experience_current_specialization_civil_loc: "[Character.MakeScope.GetVariable('tesla_civil_engineer_experience_var').GetValue|V0]"
 tesla_experience_current_specialization_mechanical_loc: "[Character.MakeScope.GetVariable('tesla_mechanical_engineer_experience_var').GetValue|V0]"
 tesla_experience_current_specialization_military_loc: "[Character.MakeScope.GetVariable('tesla_military_engineer_experience_var').GetValue|V0]"
 tesla_experience_current_specialization_electrical_loc: "[Character.MakeScope.GetVariable('tesla_electrical_engineer_experience_var').GetValue|V0]"
 tesla_experience_current_specialization_aeronautical_loc: "[Character.MakeScope.GetVariable('tesla_aeronautical_engineer_experience_var').GetValue|V0]"
 MR_ELECTRICAL_ENGINEER_SAW_MILLS_BUTTON: "Modernisierung von Sägemühlen"
 MR_ELECTRICAL_ENGINEER_SAW_MILLS_BUTTON_TT: "#T Modernisierung von Sägemühlen#!\nLassen Sie ihren [concept_tesla_engineer] sich auf das Modernisieren von [GetBuildingType('building_logging_camp').GetName]n fokussieren. Das $building_logging_camp$ wird dadurch den folgenden Modifikator erhalten:$tesla_saw_mills_1_modifier$.\n\nDadurch werden Ihrem Land #n Ausgaben#! hinzugefügt.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ELECTRICAL_ENGINEER_SAW_MILLS_TRIGGER_TT: "#default_text [GetPlayer.GetAltName('NOM')] hat ein [GetBuildingType('building_logging_camp').GetName]-Gebäude der Stufe 1 oder höher mit der  #V $pm_electric_saw_mills$#! [concept_production_method], welches noch nicht den [concept_modifier] hat.#!"
 MR_TESLA_BUILDING_CHOOSER_SAW_MILLS_MULTIPLE_HEADER: "Projekt zur Modernisierung von Sägemühlen"
 MR_ELECTRICAL_ENGINEER_POWER_GRID_BUTTON: "Modernisierung des Stromnetzes"
 MR_ELECTRICAL_ENGINEER_POWER_GRID_BUTTON_TT: "#T Modernisierung des Stromnetzes#!\nLassen Sie Ihren [concept_tesla_engineer] sich auf das Modernisieren von [GetBuildingType('building_tesla_telegraph').GetName] fokussieren. Das $building_tesla_telegraph$-Gebäude wird dadurch den folgenden Modifikator erhalten:$tesla_power_grid_1_modifier$.\n\nDadurch werden Ihrem Land #n Ausgaben#! hinzugefügt.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_ELECTRICAL_ENGINEER_POWER_GRID_TRIGGER_TT: "#default_text [GetPlayer.GetAltName('NOM')] hat ein [GetBuildingType('building_tesla_telegraph').GetName]-Gebäude der Stufe 1 oder höher mit der  #V $pm_tesla_power_line$#! [concept_production_method], welches noch nicht den [concept_modifier] hat.#!"
 MR_TESLA_BUILDING_CHOOSER_POWER_GRID_MULTIPLE_HEADER: "Projekt zur Modernisierung des Stromnetzes"