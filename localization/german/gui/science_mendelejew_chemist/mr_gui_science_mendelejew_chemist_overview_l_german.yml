l_german:
 MR_AUTOMATE_CHEMIST_TT: "#T Automatisierung des [Concept('concept_mendelejew_chemist','#b #ORANGE Chemikers#!#!')]#!\nSie müssen Ihrem Chemiker keine Aufgaben mehr geben, wenn Sie ihn automatisieren.\nSie werden selbstständig arbeiten und Aufgaben ausführen, die im Moment sinnvoll sind. Sie werden aber immer noch einige Ereignisse erhalten."
 mr_chemistry_automation_gui_tt: "Starte die Automatisierung der Aufgaben des [Concept('concept_mendelejew_chemist','#b #ORANGE Chemikers#!#!')]."
 mr_stop_chemistry_automation_gui_tt: "Stoppe die Automatisierung der Aufgaben des [Concept('concept_mendelejew_chemist','#b #ORANGE Chemikers#!#!')]."
 MR_STOP_AUTOMATE_CHEMIST_TT: "#T Automatisierung des [Concept('concept_mendelejew_chemist','#b #ORANGE Chemikers#!#!')] stoppen#!\nIhr Chemiker wird nicht mehr automatisiert arbeiten."
 MR_CHEMIST_RANKING_BUTTON: "Chemiker"
 MR_RANKING_BY_CHEMIST: "Rangliste aller [Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists|q$')] in der Welt anzeigen."
 CHEMIST_CHEMIST_RANKING_HEADER: "[Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists|q$')] der Welt, geordnet nach [concept_academics_experience]"
 MR_CHEMIST_DDT_BUTTON: "DDT"
 MR_CHEMIST_DDT_BUTTON_TT: "#T DDT#!\nBislang haben sich Pestizide - aufgrund des Zusatzes von Blei oder Arsen - als hochgiftig und somit gesundheitsschädlich erwiesen. Ein synthetisches Pflanzenschutzmittel könnte jedoch die Landwirtschaft revolutionieren. Beauftragen Sie Ihren [concept_mendelejew_chemist], es herzustellen.\n\n[ScriptedGui.BuildTooltip( GuiScope.SetRoot( GetPlayer.MakeScope ).End )]"
 MR_CHEMIST_HAS_IMPROVED_FERTILIZER_TRIGGER_TT: "#default_text Mindestens ein [GetBuildingType('building_chemical_plant').GetName]-Gebäude der Stufe 1 oder höher hat alle [Concept('concept_modifier','$concept_modifiers|q$')].#!"