l_german:
 ag_morgenroete_name: "[concept_morgenroete]"
 ag_morgenroete_tooltip: "Wir haben mindestens eine mögliche Aktion für eine [concept_morgenroete]-Funktion."
 concept_morgenroete: "#r Morgenröte#!"
 concept_morgenroete_mr: "MR"
 concept_morgenroete_concept: "Konzept"
 concept_pm_academics_university_humanities: "#b #BLUE Humanwissenschaftlich-anthropologischer Schwerpunkt#!#!"
 concept_pm_academics_university_natural_history: "#b #GREEN Naturgeschichtlicher Schwerpunkt#!#!"
 concept_pm_academics_university_mathematics: "#b #ORANGE Mathematisch-Technischer Schwerpunkt#!#!"
 concept_academics_university_specialization: "Universitätsfokus"
 concept_academics_academic: "Akademiker"
 concept_academics_academics: "Akademiker"
 concept_academics_scientist: "Wissenschaftler"
 concept_academics_scientists: "Wissenschaftler"
 concept_academics_academic_desc: "In [concept_morgenroete] sind #b Akademiker#! spezielle Charaktere, die es Ihnen ermöglichen, bestimmte Mechaniken des Mods zu nutzen. Sie können #b Akademiker#! in einigen Ereignisse erhalten oder indem Sie genügend [concept_academics_progress] erwerben.\nDerzeit gibt es diese #b Akademiker#!:\n - [concept_tesla_engineer]\n - [concept_mendelejew_chemist]\n - [concept_verrier_astronomer]\n - [concept_curie_physicist]\n - [concept_agassiz_geologist]\n - [concept_dubois_paleontologist]\n - [concept_dubois_naturalist]\n - [concept_theiler_biologist]\n - [concept_panum_physician]\n - [concept_lepsius_archaeologist]\n - [concept_andersson_anthropologist]"
 concept_academics_progress: "Akademischer Fortschritt"
 concept_academics_progress_desc: "Durch den Erwerb von 360 #b Akademischem Fortschritt#! können Sie einen neuen [concept_academics_academic] erlangen. Um überhaupt Zugriff auf #b Akademischen Fortschritt#! zu haben, müssen Sie über die Technologie #b Hochschulwesen#! und mindestens eine #b Universität#! verfügen.\nIhr #b Akademischer Fortschrittx#!-Gewinn wird von verschiedenen Faktoren beeinflusst. Je mehr [concept_literacy] Sie haben, desto schneller erzielen Sie beispielsweise #b Akademischen Fortschritt#!. Ein weiterer Faktor ist der Prozentsatz der akademischen Pops in Ihrem Land. Sie erhalten den maximalen #b akademischen Fortschritt#! für #p 2%#! oder mehr akademische Pops. Bessere Schulen und glückliche Intellektuelle tragen auch zum #b akademischen Fortschritten#! bei. Schließlich sorgen einige der Technologieschwerpunkte und Sondergebäude wie der [concept_dubois_zoo] oder das [concept_verrier_observatory] auch für zusätzlichen #b akademischen Fortschritt#!."
 concept_academics_scientific_society: "Wissenschaftliche Gesellschaft"
 concept_academics_scientific_societies: "Wissenschaftliche Gesellschaften"
 concept_academics_scientific_society_desc: "Die #b Wissenschaftliche Gesellschaft#! ist eine Gesellschaft der klügsten Köpfe Ihres Landes. Es repräsentiert die Wissenschaftler und Akademiker Ihres Landes und ermöglicht Ihnen den Besuch Ihrer [Concept('concept_academics_academic','$concept_academics_academics|q$')].\n\nDie #b Wissenschaftliche Gesellschaft#! könnte Sie mit [Concept('concept_academics_academic_mission','$concept_academics_missions|q$')] beauftragen, die Ihnen nützliche Belohnungen einbringt."
 concept_academics_experience: "Erfahrung"
 concept_academics_experience_desc: "Einige Akademiker sammeln im Laufe ihres Lebens #b Erfahrung#!. In [concept_morgenroete] erhalten die Charaktere #b Erfahrung#!, wenn sie erstellt werden. Normalerweise erhalten sie 10 #b Erfahrung#! für jedes Jahr, das sie älter als 30 Jahre sind.\nZusätzlich erhalten sie #b Erfahrung#! durch das Erledigen ihrer Arbeit, zum Beispiel für die Suche nach neuen [Concept('concept_verrier_astronomical_object','Astronomischen Objekten')]. Sie erhalten auch jedes Jahr passiv #b Erfahrung#!.\nEin Charakter, der 100 #b Erfahrung#! erhält, erhält die #b Eigenschaft Erfahren#!. Wenn ein Charakter 300 #b Erfahrung#! erreicht, erhält er die #b Eigenschaft Berühmt#!\nJe höher die #b Erfahrung#! eines Charakters, desto besser ist seine Arbeit. Ein erfahrener oder berühmter [concept_dubois_paleontologist] findet beispielsweise mehr [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones|q$')] und ist besser darin, ein [concept_dubois_dinosaur_skeleton] zu rekonstruieren."
 concept_academics_academic_mission: "Akademische Mission"
 concept_academics_academic_missions: "Akademische Missionen"
 concept_academics_mission: "Auftrag"
 concept_academics_missions: "Missionen"
 concept_academics_academic_mission_desc: "Ihre [concept_academics_scientific_society] wird Sie manchmal auffordern, ein bestimmtes Ziel zu erreichen. Solche Ziele könnten sein, eine bestimmte Menge an [Concept('concept_verrier_astronomical_object','Astronomischen Objekten')], [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts|q$')] oder ähnlichem zu finden. Bei anderen #b Missionen#! müssen Sie möglicherweise Planet X finden oder eine [Concept('concept_lepsius_exhibition','$concept_lepsius_excellent_exhibition|q$')] organisiern.\nWenn Sie bei einer #b Mission#! versagen, wird Ihre #b Wissenschaftliche Gesellschaft#! unglücklich sein, aber wenn Sie eine Mission erfüllen, erhalten sie nützliche Belohnungen."
 concept_curtiss_aviation: "Luftfahrt"
 concept_curtiss_aviation_desc: "#b Luftfahrt#! ist einer der Hauptinhalte von [concept_morgenroete]. Das 19. und 20. Jahrhundert erlebte den Aufschwung der menschlichen Luftfahrt. Zuerst in Form von #b Ballons#! und #b Luftschiffen#!, dann mit #b Flugzeugen#!. Fliegen war eine prestigeträchtige Aktivität und ermöglichte das Erreichen neuer Horizonte.\n\nViele Länder beginnen ihre Reise in die Lüfte zu Beginn des Spiels, wenn sie [Concept('concept_santos_balloonist_role','$concept_santos_balloonist_role_only_balloonist|q$')] sponsern, um Rekorde zu brechen. Wenn Sie einen der Rekorde brechen, erhält Ihr Land einen Technologieschub und einen Prestigemodifikator.\nWenn Sie die Zeppelin-Technologie erforschen, können Sie eine [concept_curtiss_arctic_expedition] durchführen, wenn Sie Zugang zum Nordpol, und einen [Concept('concept_curtiss_pilot','$concept_curtiss_pilots|q$')] haben.\nWeitere Forschung im Luftfahrtpfad ermöglicht Ihnen den Einsatz mehrerer neuer Spielmechaniken. Sie können [Concept('concept_curtiss_airport','$concept_curtiss_airports|q$')] bauen, welche das neue Handelsgut #b Flüge#!, sowie #b Dienstleistungen#! produzieren. Der #b Flughafen#! ermöglicht das Wachstum einer [concept_curtiss_airline], die es Ihnen ermöglicht, die diplomatische Aktion [concept_curtiss_airspace_convention] zu nutzen. Die #b Luftfahrtkonvention#! ermöglicht Ihnen den Zugang zu Staaten und [Concept('concept_lepsius_excavation_site','$concept_lepsius_excavation_sites|q$')] sowie zum Nordpol. Wenn Ihre #b Fluggesellschaft#! ausreichend wächst, können Sie entweder ein riesiges Luftschiff oder das größte Flugzeug der Welt bauen.\nDas aufregendste Feature kommt zu Beginn des 20. Jahrhunderts: Sie können an dem [concept_curtiss_schneider_trophy] teilnehmen. Die #b Schneider-Trophy#! ist ein Wasserflugzeugrennen, bei dem verschiedene Länder gegeneinander antreten. Wenn Sie gewinnen, erhalten Sie Prestige und können das nächste Rennen ausrichten. Und wenn es Ihnen gelingt, das Rennen dreimal zu gewinnen, behalten Sie die #b Schneider-Trophy#! für immer."
 concept_curtiss_arctic_expedition: "Arktische Expedition"
 concept_curtiss_arctic_expeditions: "Arktische Expeditionen"
 concept_curtiss_arctic_expedition_desc: "Wenn Sie die Technologie #b Zeppelin#! erforscht haben, über ein [concept_verrier_observatory] mit einer #b Wetterstation#!, einen [Concept('concept_curtiss_pilot','$concept_curtiss_pilots$')] und Zugang zu einem Staat in der Nähe des Nordpols verfügen, können Sie eine #b Arktische Expedition#! durchführen. Diese Staaten sind #b Grönland#!, #b Nord-Norwegen#!, #b Alaska#!, #b Nunavut#! und #b Nenzien#!. Sie erhalten Zugang, indem Sie entweder den Staat selbst besitzen oder eine [concept_curtiss_airspace_convention] mit dem Eigentümer abschließen.\nWährend einer #b Arktischen Expedition#! können Sie Forschungsreisen unternehmen, Polarstationen bauen, neue Erkenntnisse über Geographie, Meteorologie und die Biologie der Arktis erhalten und als als Erster den Pol in einem Luftschiff überqueren!"
 concept_curtiss_pilot: "Pilot"
 concept_curtiss_pilots: "Piloten"
 concept_curtiss_pilot_desc: "Ein #b Pilot#! ist ein Charakter mit der Eigenschaft #b Pilot#!. #b Piloten#! haben nach der Entdeckung der #b Frühen Luftfahrt#! eine geringe Chance, zu erscheinen. Darüber hinaus besteht bei Schlachten an einer Front, bei denen Luftaufklärung als Produktionsmethode eingesetzt wird, die Möglichkeit, dass ein #b Pilot#! durch ein Ereignis aus der Schlacht hervorgeht. Bessere Technologien wie Flugzeuge und moderne Luftfahrt, aber auch die Einrichtung einer Pilotenschule bis zu Entscheidungen erhöhen die Chance für einen Charakter, die Eigenschaft #b Pilot#! zu erhalten.\n#b Piloten#! helfen Ihnen auf unterschiedliche Weise. #b Fluggesellschaften#! könnten an #b Piloten#! interessiert sein, um ihr Image zu verbessern; im Kampf um die [concept_curtiss_schneider_trophy] haben erfahrene #b Piloten#! bessere Chancen; und ein #b Pilot#! ist notwendig, um die [concept_curtiss_arctic_expedition] durchzuführen. #b Piloten#! können über ein Ereignis auch zu Fliegerassen werden, wenn sie an einer Front eingesetzt werden."
 concept_curtiss_airport: "Flughafen"
 concept_curtiss_airports: "Flughäfen"
 concept_curtiss_airport_desc: "Ein #b Flughafen#! ist ein Gebäude, das durch die Technologie #b Moderne Luftfahrt#! freigeschaltet wird. Es ist ein rein ziviles Gebäude und bieten [GetGoods('air_travel').GetName] und #b Dienstleistungen#! an, verbraucht aber eine Vielzahl von Gütern von [GetGoods('tools').GetName] über [GetGoods('paper').GetName], bis zu [GetGoods('aeroplanes').GetName] und [GetGoods('oil').GetName]. Später benötigen Flughäfen auch noch [GetGoods('electricity').GetName], [GetGoods('telephones').GetName] und [GetGoods('radios').GetName].\nWenn Sie genug #b Flughäfen#! haben, wird eine [concept_curtiss_airline] gegründet und mit den wachsenden #b Flughäfen#! wird auch die #b Fluggesellschaft#! wachsen und mehr Vorteile anbieten."
 concept_curtiss_airline: "Fluggesellschaft"
 concept_curtiss_airlines: "Fluggesellschaften"
 concept_curtiss_airline_desc: "Eine #b Fluggesellschaft#! ist ein Unternehmen oder eine staatliche Einrichtung, die am Ende des Spiels [GetGoods('air_travel').GetName] anbietet, vom lokaler Ebene bis hin zu internationale Flügen anbietet. #b Fluggesellschaften#! bieten auch verschiedene andere Vorteile. #b Fluggesellschaften#! benötigen [Concept('concept_curtiss_airport','$concept_curtiss_airports|q$')], um Flüge durchzuführen. Wenn Sie Ihre #b Flughäfen#! ausbauen, wächst auch die #b Fluggesellschaft#!.\nWenn Ihre #b Fluggesellschaft#! von der Regierung betrieben wird, erhalten Sie die Möglichkeit, ein riesiges Luftschiff zu bauen und es weite Strecken zurücklegen zu lassen. Wenn Ihre #b Fluggesellschaft#! in öffentlichem oder privatem Besitz ist, erhalten Sie möglicherweise stattdessen die Chance, das größte Flugzeug aller Zeiten zu bauen."
 concept_curtiss_airspace_convention: "Luftfahrtkonvention"
 concept_curtiss_airspace_conventions: "Luftfahrtkonventionen"
 concept_curtiss_airspace_convention_desc: "Die #b Luftfahrtkonvention#! ist ein wichtiger [concept_diplomatic_pact], der es Ihnen ermöglicht, mit Regionen zu interagieren, die weit von Ihrem Einfluss entfernt sind. Wenn Sie eine #b Luftfahrtkonvention#! mit einer anderen Nation haben, die über eine [concept_lepsius_excavation_site] verfügt, können Sie eine [concept_lepsius_expedition] durchführen, ohne über einen genug hohen [concept_interest_tier] in der Region zu verfügen.\nEine #b Luftfahrtkonvention#! ermöglicht Ihnen das Senden einer [concept_curtiss_arctic_expedition], auch wenn Sie nicht über einen der erforderlichen Staaten verfügen."
 concept_curtiss_schneider_trophy: "Schneider-Trophy"
 concept_curtiss_schneider_trophy_desc: "Der Kampf um diese prestigeträchtige Trophäe, die der Franzose Jacques Schneider kurz vor dem Ersten Weltkrieg stiftete, sollte vor allem die Entwicklung von Wasserflugzeugen ankurbeln. Im Laufe der Zeit entwickelte sich das Rennen um diese Trophäe zu einem Rennen der Nationen, wobei vor allem Großbritannien, die USA und Italien ihre Mannschaften massiv unterstützten, um die begehrte Trophäe zu gewinnen. Tatsächlich hat die technologische Entwicklung von der #b Schneider-Trophy#! durch den Einsatz immer schnellerer und fortschrittlicherer Wasserflugzeuge profitiert.\nDie #b Schneider-Trophy#! kann gegründet werden, wenn es 5 Nationen gibt, welche die Technologie #b Wasserflugzeuge#! erfunden haben und wenn Sie einen Hafen und ein städtisches Zentrum der Stufe 10 in einem Ihrer Staaten haben.\nDer Gewinner der Trophäe wird durch einen Journaleintrag und viele Faktoren bestimmt. Ein Land mit einer Pilotenschule und einem großen [Concept('concept_curtiss_pilot','$concept_curtiss_pilots$')] wird zum Beispiel im Vorteil sein. Ein toller [concept_curtiss_pilot] und eine massive Finanzierung werden auch zum Gewinn der Trophäe beitragen.\nDer Gewinner der letzten Trophäe kann die nächste ausrichten, wenn er einen Hafen hat oder in der Schweiz mit ihren vielen Seen ist. Noch besser ist es, die Trophäe dreimal hintereinander zu gewinnen, da die Nation die Trophäe für immer behält und dafür einen Prestigebonus erhält."
 concept_dubois_natural_history: "Naturgeschichte"
 concept_dubois_natural_history_desc: "#b Naturgeschichte#! ist einer der Hauptinhalte von [concept_morgenroete]. Im 19. Jahrhundert gab es viele große naturkundliche Entdeckungen: viele große Expeditionen wie die der Beagle, die Erfindung der Evolutionstheorie, die Entdeckung Hunderttausender neuer Arten und natürlich die Entdeckung der Dinosaurier.\n\nGroß- und Mittelmächte mit einer Flotte und einem Admiral können ein Schiff auf eine [concept_dubois_pacific_expedition] schicken. Auf einer #b Pazifikexpedition#! können Sie seltene Pflanzen, Tiere und Fossilien finden, ozeanografische Forschung betreiben oder astronomische Phänomene wie Sonnenfinsternisse beobachten.\n\nDie großen Tiere, die Sie finden können, die [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals|q$')], können in einem [concept_dubois_zoo] ausgestellt werden. Je mehr Tiere, desto größer ist die Wirkung des #b Zoos#!. Sie können diese #b Tiere#! auf Expeditionen finden, Sie können sie in Ihrem eigenen Gebiet sammeln oder andere Länder bitten, sie Ihnen zu verkaufen.\n\nKleinere Tiere, Pflanzen und andere Organismen werden [Concept('concept_dubois_specimen','$concept_dubois_specimens|q$')] genannt. Ein [concept_dubois_naturalist] kann solche #b Exemplare#! sammeln. Ein #GREEN #b Naturforscher#!#! kann auf [Concept('concept_dubois_botanical_expedition','$concept_dubois_botanical_expeditions|q$')] in Staaten mit einem Regenwald-Zustandsmodifikator gesendet werden. Falls Sie selbst keinen solchen Staat haben, können Sie eine [concept_mr_research_charter] von einem anderen Land erwerben. Ein #GREEN #b Naturforscher#!#! erhält [concept_academics_experience], wenn er seltene Exemplare findet.\n\n[Concept('concept_dubois_fossil','$concept_dubois_fossils|q$')] sind das Feld eines [Concept('concept_dubois_paleontologist','$concept_dubois_paleontologists$')], seien es Fossilien von Pflanzen, Insekten oder anderen Kleintieren. #b Fossilien#! können auf #b Expeditionen#! oder in Staaten mit [Concept('concept_dubois_formation','$concept_dubois_formations|q$')] gefunden werden. Wenn Sie eine #b Große Formation#! haben, können Sie vielleicht sogar [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones|q$')] finden. Ansonsten können Sie darauf zugreifen, indem Sie eine [concept_mr_research_charter] erwerben.\n\nWenn Ihr Land Zugang zu einem Gebirge hat, kann ein General [concept_douglas_mountaineering] durchführen und so bessere Eigenschaften und einen Prestigebonus erhalten."
 concept_dubois_naturalist: "#b #GREEN Naturforscher#!#!"
 concept_dubois_naturalists: "#b #GREEN Naturforscher#!#!"
 concept_dubois_naturalist_desc: "#b #GREEN Naturforscher#!#! sind Akademiker, die [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals|q$')] und [Concept('concept_dubois_specimen','$concept_dubois_specimens|q$')] sammeln können. Sie können auf eine [concept_dubois_pacific_expedition] oder eine [concept_dubois_botanical_expedition] geschickt werden, wo sie seltene Pflanzen und Tiere finden können, die Ihnen einen kleinen Bonus verschaffen. #b #GREEN Naturforscher#!#! erhalten [concept_academics_experience], wenn sie neue seltene Exemplare finden."
 concept_dubois_paleontologist: "#b #GREEN Paläontologe#!#!"
 concept_dubois_paleontologists: "#b #GREEN Paläontologen#!#!"
 concept_dubois_paleontologist_desc: "#b #GREEN Paläontologen#!#! sind Akademiker, die nach [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones|q$')] und [Concept('concept_dubois_fossil','$concept_dubois_fossils|q$')] graben. Um sie einzusammeln, benötigen Sie Zugriff auf eine [concept_dubois_formation]. Wenn Sie Zugang zu einer #b Formation#! haben, entweder indem Sie sie selbst besitzen oder von einem anderen Land eine [concept_mr_research_charter] haben, können Sie Ihren #b Paläontologen#! auf eine [concept_dubois_paleontological_expedition] schicken.\nNachdem Sie 5 #b Dinosaurierknochen#! gesammelt oder rekonstruiert haben, kann Ihr #b Paläontologe#! ein [concept_dubois_dinosaur_skeleton] rekonstruieren. Wenn #b #GREEN Paläontologen#!#! [concept_academics_experience] erhalten, werden sie besser darin, #b Dinosaurierskelette#! zu rekonstruieren, und so werden auch für die #b Skelette#! mit zunehmender Erfahrung besser. Je besser die #b Dinosaurierskelette#!, desto mehr Prestige verschafft Ihnen Ihre [concept_dubois_paleontological_collection]."
 concept_dubois_pacific_expedition: "Pazifikexpedition"
 concept_dubois_pacific_expeditions: "Pazifikexpeditionen"
 concept_dubois_pacific_expedition_desc: "Als Groß- oder Mittelmacht können Sie eine Expedition in den Pazifischen Ozean schicken. Sie müssen den #b Empirismus#!, die #b Schraubenfregatte#! und die #b Dialektik-Technologie#! erforscht haben, Sie benötigen einen Hafen und eine Universität sowie eine Marine von mindestens 15 Einheiten und einen Admiral.\nAuf einer #b Pazifikexpedition#! können Sie seltene Pflanzen, [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals|q$')] und [Concept('concept_dubois_fossil','$concept_dubois_fossils|q$')] finden, ozeanografische Forschung betreiben oder astronomische Phänomene wie Sonnenfinsternisse beobachten. Zu Beginn der #b Expedition#! können Sie auch einen #b Wissenschaftler#! für Ihre Expedition auswählen, entweder einen #b Landvermesser#!, einen [concept_dubois_naturalist], einen [Concept('concept_dubois_paleontologist','$concept_dubois_paleontologists|q$')] oder einen [Concept('concept_verrier_astronomer','$concept_verrier_astronomers|q$')]. Jeder einzelne wird abhängig von seinem Fachwissen dazu beitragen, bei bestimmten Ereignissen bessere Ergebnisse zu erzielen.\nIhre Expedition kann einen Schwerpunkt auf ein bestimmtes Forschungsgebiet legen. Sie kann ganz den Geheimnissen des Meeres gewidmet werden und Ihr ozeanografisches und astronomisches Wissen verbessern; In diesem Fall werden nur ozeanografische Ereignisse ausgelöst. Wer die Wunder der Natur erkundet, wird mit botanischen, zoologischen und paläontologischen Ereignisse konfrontiert. Großmächte haben auch die Möglichkeit, eine Prestige-Mission durchzuführen, bei der Sie Artefakte finden, Handelsposten errichten oder Christliche Missionen einrichten – dies ist besonders nützlich, wenn Sie keine diplomatischen Interessen in Ozeanien haben, aber versuchen möchten eine Kolonie einzurichten.\nSie müssen auch auswählen, wohin Ihre Mission genau reisen soll: Ozeanien, Australien oder Indonesien. Jede Region bietet unterschiedliche Ereignisse und Belohnungen."
 concept_dubois_habitat: "Lebensraum"
 concept_dubois_habitats: "Lebensräume"
 concept_dubois_animal_habitat: "Tierlebensraum"
 concept_dubois_habitat_desc: "Ein #b Habitat#! ist eine Region in einem Staat, in der ein bestimmtes [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animal|q$')] lebt. In #r Morgenröte#! gibt es für die verschiedenen Tiere #b Habitate#! in verschiedenen Staatsregion. Wenn Sie einen #b Lebensraum#! besitzen, können Sie die #b Tiere#! zum [concept_dubois_zoo] transportieren oder sie sogar in andere Länder verkaufen.\n\nWenn Ihr Staat eine [concept_urbanization] von 2000 oder höher erreicht oder kein [concept_arable_land] mehr hat , werden die #b exotischen Tiere#! #n nach 10 Jahren aussterben#!.\n\nUm die #b Tiere#! vor dem Aussterben zu bewahren, können Sie in einem Staat mit einem #b Habitat#! ein [concept_dubois_nature_reserve] errichten."
 concept_dubois_nature_reserve: "Naturschutzgebiet"
 concept_dubois_nature_reserves: "Naturschutzgebiete"
 concept_dubois_royal_hunting_reserve: "Königliches Jagdreservat"
 concept_dubois_nature_reserve_desc: "Ein #b Naturschutzgebiet#! ist ein Schutzgebiet, in dem Sie [Concept('concept_dubois_habitat','$concept_dubois_habitats|q$')] schützen oder etablieren können.\n\nWenn Sie bereits über ein #b Habitat#! verfügen, können Sie ihn vor der Zerstörung durch den Einfluss von Menschen schützen, indem Sie ein #b Naturschutzgebiet#! im Staat mit dem #b Habitat#! errichten. Um ein #b Naturschutzgebiet#! zu errichten, müssen Sie die #b Genetik#!-Technologie freigeschaltet haben und über einen Inkorporierten Staat mit einem #b Habitat#! verfügen, der das Heimatland einer Ihrer Primärkulturen ist.\n\nWenn Sie kein #b Habitat#! besitzen, können Sie ein #b Naturschutzgebiet#! errichten, indem Sie Ihr Land nach einem Standort durchsuchen, wenn Sie die Technologie #b Genetik#! freigeschaltet haben und mindestens ein [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animal|q$')] von Ihrem Kontinent in Ihrem [concept_dubois_zoo] haben.\n\nEin #b Naturschutzgebiet#! schützt nicht nur die #b Habitate#! Ihrer Tiere, sondern ermöglicht Ihnen auch die Ansiedlung von #b exotischen Tieren#! des selben Kontinents. Auf diese Weise können Sie alle #b exotischen Tiere#! Ihres Kontinents in einem einzigen Staat schützen."
 concept_dubois_zoo_animal: "Zootier"
 concept_dubois_zoo_animals: "Zootiere"
 concept_dubois_exotic_animal: "Exotisches Tier"
 concept_dubois_exotic_animals: "Exotische Tiere"
 concept_dubois_zoo_animal_desc: "Es gibt viele Tiere auf der Welt, die Ihr [concept_dubois_naturalist] fangen kann. Um ein #b Exotisches Tier#! zu fangen, benötigen Sie einen Staat mit einem [concept_dubois_habitat]. Alternativ können Sie ein #b Exotisches Tier#! aus einem Land mit einem entsprechenden #b Lebensraum#! kaufen.\nNach dem Fang können die #b Zootiere#! an Ihren [concept_dubois_zoo] gesendet werden, wodurch Sie den #b Zoo#! erweitern können."
 concept_dubois_zoo: "Zoo"
 concept_dubois_zoos: "Zoos"
 concept_dubois_zoo_desc: "Ein #b Zoo#! ist ein besonderes Gebäude, das Sie bauen können, nachdem Sie 5 [concept_dubois_zoo_animal] gesammelt haben. Der #b Zoo#! beherbergt Ihre #b Tiere#!, Ihre [concept_dubois_specimen]-Sammlung und Ihre Paläontologische Sammlung."
 concept_dubois_specimen: "Exemplar"
 concept_dubois_specimens: "Exemplare"
 concept_dubois_specimen_desc: "Die verschiedenen Insekten, Pflanzen und kleineren Tiere, die ein [concept_dubois_naturalist] sammeln kann, werden #b Exemplare#! genannt. Sie können Ihre #b Exemplare#! verwenden, um in Ihrem [concept_dubois_zoo] einen Botanischen Garten oder eine Exemplarsammlung aufzubauen."
 concept_dubois_botanical_expedition: "Botanische Expedition"
 concept_dubois_botanical_expeditions: "Botanische Expeditionen"
 concept_dubois_botanical_expedition_desc: "Sie können einen [concept_dubois_naturalist] auf eine #b Botanische Expedition#! schicken, wenn Sie Zugang zu einem Staat mit [concept_ito_medicinal_plants] haben, entweder durch den Besitz eines solchen Staates oder durch den Erwerb einer [concept_mr_research_charter].\nIhr #b Naturforscher#! wird während der einjährigen Reise [concept_ito_medicinal_plants] und [Concept('concept_dubois_specimen','$concept_dubois_specimens|q$')] sammeln. Manchmal finden sie auch eine seltene Pflanze, die eine großartige Ergänzung für die botanische Sammlung eines [concept_dubois_zoo] darstellt."
 concept_dubois_fossil: "Fossil"
 concept_dubois_fossils: "Fossilien"
 concept_dubois_fossil_desc: "Ein [concept_dubois_paleontologist] kann #b Fossilien#! von Pflanzen und Tieren entdecken, die längst ausgestorben sind, wenn er Zugriff auf eine [concept_dubois_formation] hat."
 concept_dubois_dinosaur_bone: "Dinosaurierknochen"
 concept_dubois_dinosaur_bones: "Dinosaurierknochen"
 concept_dubois_dinosaur_bone_desc: "Ein [concept_dubois_paleontologist] kann Dinosaurierknochen in Großen [Concept('concept_dubois_formation','$concept_dubois_formations|q$')] finden.\nEin #b Erfahrener Paläontologe#! kann auch versuchen, einen #b Dinosaurierknochen#! aus 20 [Concept('concept_dubois_fossil','$concept_dubois_fossils|q$')] zu rekonstruieren. Ein #b Dinosaurierknochen#! kann nur rekonstruiert werden, wenn mindestens ein Dinosaurierknochen zur Orientierung zur Verfügung steht.\nUm eine der Aktionen durchzuführen, darf der Paläontologe weder erschöpft noch beschäftigt sein. Sein Erfolg hängt weitgehend von seiner paläontologischen [concept_academics_experience] ab.\n#b Dinosaurierknochen#! werden zur Rekonstruktion von [Concept('concept_dubois_dinosaur_skeleton','Dinsosaurierskeletten')] verwendet."
 concept_dubois_dinosaur_skeleton: "Dinosaurierskelett"
 concept_dubois_dinosaur_skeletons: "Dinosaurierskelette"
 concept_dubois_dinosaur_skeleton_desc: "Aus fünf [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones|q$')] aus derselben Kontinentalregion kann ein [concept_dubois_paleontologist] einen vollständigen Dinosaurier rekonstruieren.\nHoffentlich hat Ihr #b Paläontologe#! genug Erfahrung, um das #b Dinosaurierskelett#! richtig zu rekonstruieren. Andernfalls riskieren Sie einen Prestigeverlust für Ihre [concept_dubois_paleontological_collection]. Wenn ein #b Dinosaurierskelett#! falsch rekonstruiert wurde, können Sie jedoch versuchen, es zu reparieren, was normalerweise zu einer etwas besseren Rekonstruktion führt."
 concept_dubois_paleontological_collection: "Paläontologische Sammlung"
 concept_dubois_paleontological_collections: "Paläontologische Sammlungen"
 concept_dubois_paleontological_collection_desc: "Die #b Paläontologische Sammlung#! ist das Reich Ihres [Concept('concept_dubois_paleontologist','$concept_dubois_paleontologists|q$')]. Dort finden Sie alle [Concept('concept_dubois_fossil','$concept_dubois_fossils|q$')], [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones|q$')] und [Concept('concept_dubois_dinosaur_skeleton','$concept_dubois_dinosaur_skeletons|q$')] Ihrer Nation.\nJe besser Ihr #b Paläontologe#! diese #b Dinosaurierskelette#! montiert hat, desto prestigeträchtiger ist Ihre #b Sammlung#!. Wenn Ihr #b Paläontologe#! die #b Skelette#! furchtbar falsch montiert hat, könnte das dazu führen, dass die Sammlung an Prestige verliert. Aber vielleicht kann derselbe oder ein anderer #b Paläontologe#! das Skelett besser rekonstruieren!"
 concept_dubois_formation: "Formation"
 concept_dubois_formations: "Formationen"
 concept_dubois_geological_formation: "Geologische Formation"
 concept_dubois_formation_desc: "Es gibt zwei Arten von #b Formationen#!, Normale Formationen ermöglichen es Ihrem [Concept('concept_dubois_paleontologist','$concept_dubois_paleontologists|q$')], [Concept('concept_dubois_fossil','$concept_dubois_fossils|q$')] zu sammeln, während große Formationen die Entdeckung von [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones|q$')] ermöglichen.\n#b Formationen#! können von Ihrem Paläontologen oder bei der Erforschung der Technologie Paläontologie entdeckt werden.\nWenn Sie selbst keine #b Große Formation#! haben, können Sie eine [concept_mr_research_charter] von einer Nation mit einer Formation kaufen, um Zugang dazu zu erhalten."
 concept_dubois_paleontological_expedition: "Paläontologische Expedition"
 concept_dubois_paleontological_expeditions: "Paläontologische Expeditionen"
 concept_dubois_mountain: "Berg"
 concept_dubois_mountains: "Berge"
 concept_dubois_mountain_desc: "Es gibt viele #b Berge#! die bestiegen werden können.\n\n#V Nordamerika:#!\n#b Mount McKinley#! (Alaska), 6190 Meter\n#b Mount Logan#! (Yukon Territory), 5959 Meter\n#b Citlaltépetl#! (México), 5636 Meter\n#b Mount Whitney#! (California), 4421 Meter\n\n#V Südamerika:#!\n#b Aconcagua#! (Mendoza), 6267 Meter\n#b Huascarán#! (Lima-Gebiet), 6768 Meter\n#b Illimani#! (La Paz), 6438 Meter\n#b Chimborazo#! (Ecuador), 6267 Meter\n\n#V Europa:#!\n#b Shkara#! (Großer Kaukasus), 5642 Meter\n#b Dufourspitze#! (Westschweiz), 4634 Meter\n#b Matterhorn#! (Westschweiz), 4478 Meter\n#b Aiguille Verte#! (Savoyen), 4122 Meter\n#b Pico de Aneto#! (Aragon), 3404 Meter\n\n#V Afrika:#!\n#b Kibo#! (Tanganjika), 5895 Meter\n#b Mount Kenya#! (Kenia), 5199 Meter\n#b Mount Stanley#! (Uganda), 5109 Meter\n#b Kamerunberg#! (Südkamerun), 4095 Meter\n\n#V Asien:#!\n#b Kamet#! (Delhi), 7756 Meter\n#b Chogolisa#! (Kaschmir), 7665 Meter\n#b Kabru#! (Himalaya), 7412 Meter\n#b Kaufmann Peak#! (Tadschikistan), 7134 Meter\n\n#V Australien & Ozeanien:#!\n#b Mount Wilhelm#! (Ost-Neuguinea), 4121 Meter\n#b Mount Cook#! (Südinsel), 3724 Meter"
 concept_elgar_music: "Musikkultur"
 concept_elgar_opera: "Oper"
 concept_elgar_operas: "Opern"
 concept_elgar_opera_house: "Opernhaus"
 concept_elgar_opera_houses: "Opernhäuser"
 concept_elgar_musical_tradition: "Musikalische Tradition"
 concept_elgar_impressionism: "Impressionismus"
 concept_elgar_expressionism: "Expressionismus"
 concept_elgar_art_nouveau: "Jugendstil"
 concept_elgar_architecture: "Architektur"
 concept_elgar_architectural_project: "Architekturprojekt"
 concept_elgar_architectural_projects: "Architekturprojekte"
 concept_lepsius_archaeology: "Archäologie"
 concept_lepsius_archaeology_desc: "#b Archaeology#! is one of the main features of [concept_morgenroete].\n\nThere are 8 [Concept('concept_lepsius_excavation_site','$concept_lepsius_excavation_sites|q$')] on the map.\n\n To be able to send an [concept_lepsius_expedition], you need to research the Antiquarianism Technology, have an [concept_lepsius_archaeological_team] and have acces to one of the Excavation Sites. You can either get access by owning the Site yourself or by asking a country with a Site for a [concept_mr_research_charter].\n\nYou can now send an Archaeological expedition to one of the Excavation Sites. Your Team will discover [Concept('concept_lepsius_artifact','$concept_lepsius_minor_artifacts|q$')] and in very rare cases and the help of a good [concept_lepsius_archaeologist], you might even find a [concept_lepsius_major_artifact].\n\nOnce your Team returns with the Artifacts, you might be able to build a [concept_lepsius_museum]. In a Archaeological Museum you will be able to see your Artifacts, create [concept_lepsius_exhibition] and visit your #b #BLUE Archaeologist#!#!.\n\nThe more Artifacts and Exhibitions you have, the more Prestige you will get."
 concept_lepsius_archaeologist: "#b #BLUE Archäologe#!#!"
 concept_lepsius_archaeologists: "#b #BLUE Archäologen#!#!"
 concept_lepsius_archaeologist_desc: "#b #BLUE Archäologen#!#! sind Akademiker, die Sie auf [Concept('concept_lepsius_expedition','$concept_lepsius_expeditions|q$')] entsenden können. Dort werden sie [Concept('concept_lepsius_artifact','$concept_lepsius_minor_artifacts|q$')] sammeln. Manchmal finden sie sogar ein [concept_lepsius_major_artifact].\nArchäologen erhalten während ihrer Arbeit und passiv jedes Jahr [concept_academics_experience]. Sie können ein höheres Level der Archäologeneigenschaft erreichen, indem sie genügend #b Erfahrung#! sammeln."
 concept_lepsius_museum: "Archäologisches Museum"
 concept_lepsius_museum_desc: "Das #b Archäologische Museum#! ist ein Gebäude, das Sie errichten können und in dem alle entdeckten [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts|q$')] Ihrer Nation ausgestellt sind."
 concept_lepsius_excavation_site: "Historische Ausgrabungsstätte"
 concept_lepsius_excavation_sites: "Historische Ausgrabungsstätten"
 concept_lepsius_excavation_site_desc: "Es gibt mehrere #b Historische Ausgrabungsstätten#! in verschiedenen Ländern, darunter: Ober- und Unterägypten, Babylonien, Assyrien, Kreta, Argolis, Yucatán und Peru. Jede #b historische Stätte#! bietet unterschiedliche [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts|q$')] und Ereignisse. Neben diesen großen, historisch bedeutsamen Ausgrabungsstätten gibt es auch [Concept('concept_lepsius_minor_excavation_site', '$concept_lepsius_minor_excavation_sites|q$')]."
 concept_lepsius_expedition: "Archäologische Expedition"
 concept_lepsius_expeditions: "Archäologische Expeditionen"
 concept_lepsius_expedition_desc: "Eine #b Archäologische Expedition#! ist eine Expedition eines [Concept('concept_lepsius_archaeologist','$concept_lepsius_archaeologists|q$')] und seines [Concept('concept_lepsius_archaeological_team','archäologischen Teams')]. Die Expedition wird mehrere Monate dauern, in denen das Team versucht, so viele [Concept('concept_lepsius_artifact','$concept_lepsius_minor_artifacts|q$')] wie möglich zu sammeln. #b Expeditionen#! sind eine Möglichkeit, in den Besitz [Concept('concept_lepsius_major_artifact','ärchäologischer Artefakte')] zu kommen.\nWenn Sie frühe Archäologie erforscht haben, können Sie Ihr Team an der Ausgrabungsstätte zurücklassen, um nach einer erfolgreichen #b Expedition#! eine [concept_lepsius_excavation] einzurichten."
 concept_lepsius_archaeological_team: "Archäologisches Team"
 concept_lepsius_archaeological_teams: "Archäologische Teams"
 concept_lepsius_excavation_team: "Ausgrabungsteam"
 concept_lepsius_archaeological_team_desc: "Sie benötigen ein oder mehrere #b Archäologische Teams#!, um [Concept('concept_lepsius_expedition','$concept_lepsius_expeditions|q$')] durchführen zu können. Sie können bis zu 3 #b Archäologische Teams#! erhalten, aber jedes hat höhere Anforderungen.\n\nSie können Ihr erstes #b Team#! erhalten, indem Sie die Technologie Antiquarismus erforschen, über eine Universität von mindestens Stufe 3 verfügen und Ihre Bevölkerung eine Alphabetisierung von mindestens 33 % aufweist.\n\nSie können ein weiteres Team erhalten, wenn Sie die Technologie der modernen Archäologie erforscht haben, eine Universität mit mindestens Stufe 15 und eine Alphabetisierung von 66 % haben.\n\nSie können ein weiteres #b Team#! erhalten wenn Sie die Technologie Antiquarismus erforscht haben und über einen erfahrenen [Concept('concept_lepsius_archaeologist','$concept_lepsius_archaeologists|q$')] verfügen.\n\nSie benötigen #b Teams#! für [Concept('concept_lepsius_expedition','$concept_lepsius_expeditions|q$')] und [Concept('concept_lepsius_excavation','$concept_lepsius_excavations|q$')]."
 concept_lepsius_artifact: "Artefakt"
 concept_lepsius_artifacts: "Artefakte"
 concept_lepsius_minor_artifact: "Kleineres Artefakt"
 concept_lepsius_minor_artifacts: "Kleinere Artefakte"
 concept_lepsius_oceanic_artifact: "Ozeanisches Artefakt"
 concept_lepsius_oceanic_artifacts: "Ozeanische Artefakte"
 concept_lepsius_artifact_desc: "Sie können Artefakte erhalten, indem Sie [Concept('concept_lepsius_archaeological_team','$concept_lepsius_archaeological_teams|q$')] auf [Concept('concept_lepsius_expedition','$concept_lepsius_expeditions|q$')] schicken, [Concept('concept_lepsius_excavation','$concept_lepsius_excavations|q$')] durchführen lassen, auf [Concept('concept_dubois_pacific_expedition','$concept_dubois_pacific_expeditions|q$')] oder zufällig bei Ereignissen.\n\nNormalerweise erhalten Sie kleinere #b Artefakte#!. Sie können diese kleineren #b Artefakte#! für [Concept('concept_lepsius_exhibition','$concept_lepsius_exhibitions|q$')] in Ihrem [concept_lepsius_museum] verwenden.\n\n[Concept('concept_lepsius_major_artifact','$concept_lepsius_major_artifacts|q$')] hingegen sind einzigartige #b Artefakte#!, die nur einmal gefunden werden können und einen eindeutigen Namen haben. Sie finden sie normalerweise bei Expeditionen, Ausgrabungen und als archäologische Entdeckungen."
 concept_lepsius_major_artifact: "Bedeutendes Artefakt"
 concept_lepsius_major_artifacts: "Bedeutende Artefakte"
 concept_lepsius_major_artifact_desc: "#b Bedeutende Artefakte#! sind besondere [Concept('concept_lepsius_artifact','$concept_lepsius_artifacts|q$')], die einen Namen und eine Identität haben.\nSie können #b Bedeutende Artefakte#! auf unterschiedliche Weise finden. Einige davon finden Sie in [Concept('concept_lepsius_expedition','$concept_lepsius_expeditions|q$')]. Für andere müssen Sie eine fortlaufende [concept_lepsius_excavation] aufrechterhalten, bis Sie es finden. Und einige erhalten Sie bei einer großen Entdeckung.\nDie illegale Mitnahme eines #b Bedeutenden Artefakts#! aus einem Land kann zu einem diplomatischen Zwischenfall führen, der Ihnen mehr schaden könnte als der Besitz eines #b Bedeutenden Artefakts#! einbringt. Auf der anderen Seite können Sie mit #b Bedeutenden Artefakten#! [Concept('concept_lepsius_exhibition','$concept_lepsius_excellent_exhibition|q$')] gründen, die Ihnen einen enormen Prestigebonus verschaffen und für einige [Concept('concept_academics_academic_mission','$concept_academics_academic_missions|q$')] benötigt werden."
 concept_lepsius_exhibition: "Ausstellung"
 concept_lepsius_exhibitions: "Ausstellungen"
 concept_lepsius_excellent_exhibition: "Ausgezeichnete Ausstellung"
 concept_lepsius_excavation: "Ausgrabung"
 concept_lepsius_excavations: "Ausgrabungen"
 concept_lepsius_excavation_desc: "Wenn Sie die Frühe Archäologie erforscht und eine [concept_lepsius_expedition] abgeschlossen haben, können Sie sich entscheiden, Ihr [concept_lepsius_archaeological_team] an der Ausgrabungsstätte zu belassen, um passiv [Concept('concept_lepsius_artifact','$concept_lepsius_minor_artifacts|q$')] auszugraben. Sie können Ihr Team jederzeit von der #b Ausgrabung#! zurückrufen."
 concept_verrier_astronomy: "Astronomie"
 concept_verrier_observatory: "Observatorium"
 concept_verrier_observatories: "Observatorien"
 concept_verrier_astronomer: "#b #ORANGE Astronom#!#!"
 concept_verrier_astronomers: "#b #ORANGE Astronomen#!#!"
 concept_verrier_astronomical_object: "Astronomisches Objekt"
 concept_verrier_astronomical_objects: "Astronomische Objekte"
 concept_verrier_astronomical_object_icon: "@verrier_astronomicalobject!"
 concept_verrier_celestial_body: "Himmelskörper"
 concept_verrier_celestial_bodies: "Himmelskörper"
 concept_verrier_comet: "Großer Komet"
 concept_verrier_comets: "Große Kometen"
 concept_verrier_comet_desc: "Im Viktorianischen Zeitalter gab es einige #b Große Kometen#!, die die Aufmerksamkeit der Öffentlichkeit auf sich zogen. Wenn Sie einen [Concept('concept_verrier_astronomer','$concept_verrier_astronomers$')] haben, besteht die Chance, dass Sie einen dieser #b Großen Kometen#! zuerst entdecken, was zu einem Bonus auf Prestige und Forschung führt."
 concept_verrier_moon_photo: "Mondfoto"
 concept_verrier_moon_photos: "Mondfotos"
 concept_rapanui_christian_mission: "Christliche Mission"
 concept_rapanui_christian_missions: "Christliche Missionen"
 concept_rapanui_christian_mission_desc: "[Concept('concept_major_power','$concept_major_powers|q$')] oder [Concept('concept_great_power','$concept_great_powers|q$')] mit einem [concept_interest] in Ozeanien können versuchen, einen dezentralen Inselstaat in der Region zu bekehren – dies ist jedoch nur möglich, wenn Ihr Land nicht zu säkular ist und die Fromme Interessengruppe nicht zu schwach ist.\n\nDie Missionierung erfolgt in drei Schritten. Wenn Sie einen Missionar schicken, wird er entweder freundlich empfangen, ignoriert – oder sofort getötet. Sollte Ihre Mission scheitern, müssen Sie einige Jahre warten, bis Sie einen neuen Missionar finden, der das Wort Gottes verbreitet. Anschließend wird Ihr Missionar jedes Jahr 1% der Bevölkerung bekehren. Es kann Ereignisse geben, die die Konvertierung unterstützen oder behindern.\n\nDie zweite Phase beginnt, wenn Sie 30% der Einheimischen konvertierte haben. Jetzt wird Ihre Missionsstation dauerhaft. Sollten sich 51% der Einheimischen zum Christentum bekennen, dann wird der Häuptling zu Ihrer Religion konvertieren und sich als [concept_protectorate] unter Ihren Schutz stellen. Jahre später können diese Gebiete sogar annektiert werden, wenn Sie über die Technologie zur Malariaprävention verfügen.\n\nIn der dritten Stufe können Sie über den Journaleintrag aktiv Entscheidungen treffen. Entweder stärkt man die Mission direkt durch die Entsendung zusätzlicher Missionare, oder man kann auf den Handel setzen. Durch Handel können seltene [Concept('concept_lepsius_artifact','$concept_lepsius_oceanic_artifacts|q$')], [Concept('concept_dubois_zoo_animal','$concept_dubois_exotic_animals|q$')] oder Perlen erworben werden, die den Lebensstandard der Oberschicht erhöhen."
 concept_manzoni_literary_tradition: "Literarische Tradition"
 concept_klimt_painters: "#PURPLE #b Maler#!#!"
 concept_klimt_painting_tradition: "Malerische Tradition"
 concept_vikelas_sports: "Sport"
 concept_vikelas_sports_desc: "#b Sport#! ist einer der Hauptinhalte von [concept_morgenroete].\n\nSobald ein Land #b Organisierter Sport#! entdeckt, erhält es Zugang zu verschiedenen sportlichen Aktivitäten. Das wichtigste ist die Gründung des [concept_vikelas_ioc], das mit der Organisation der [Concept('concept_vikelas_olympic_games','$concept_vikelas_olympic_games$')] beginnen wird. Bei den Olympischen Spielen haben Sie die Chance, Goldmedaillen zu gewinnen, die Ihrem Land [concept_prestige] bescheren."
 concept_vikelas_olympic_games: "Olympische Spiele"
 concept_vikelas_olympic_games_desc: "Sobald das [concept_vikelas_ioc] gegründet ist, können die #b Olympischen Spiele#! alle 4 Jahre stattfinden. Jedes Mal stimmt das Komitee für einen #b Gastgeber#!. Das Gastgeberland wird einen großen [concept_prestige]-Bonus erhalten.\nWährend der Olympischen Spiele werden Ihre Athleten um Medaillen kämpfen. Viele Faktoren beeinflussen, wie viele Medaillen Sie erhalten. Ihre Bevölkerung hat einen kleinen Einfluss, der [concept_sol] hat einen größeren Einfluss, einige Ereignisse beeinflussen auch Ihre Chancen, ebenso wie große [Concept('concept_general', '$concept_generals|q$')] und große [Concept('concept_admiral', '$concept_admirals|q$')]. Zusätzlich geben Charakter mit der Eigenschaft #b Athlet#! und städtische Zentren mit der Produktionsmethode #b Sportanlagen#! ebenfalls kleine Boni.\nAll diese Faktoren haben Einfluss darauf, wie viele der 12 Goldmedaillen Ihr Land erhalten wird. Für jede Goldmedaille erhalten Sie 5 [concept_prestige]."
 concept_vikelas_ioc: "Internationales Olympisches Komitee"
 concept_vikelas_ioc_desc: "Eine Nation, die #V $vikelas_international_sports_tech$#! erforscht hat, kann das #b Internationale Olympische Komitee#! oder kurz #b IOC#! gründen. Das IOC wird dann mit der Organisation der [Concept('concept_vikelas_olympic_games', '$concept_vikelas_olympic_games$')] beginnen. Jedes Mitglied des IOC kann an den Olympischen Spielen teilnehmen.\nDie wichtigsten Mitglieder des IOC sind die #b Vorstandsmitglieder#!. Der Gründer des IOC wird #b Präsident#! und bleibt somit für immer Vorstandsmitglied, während die anderen Mitglieder alle 4 Jahre gewählt werden. Der Vorstand bietet Platz für 5 Großmächte, 2 europäische, 2 asiatische, 2 amerikanische, 1 afrikanische und 1 ozeanische Nation.\nDie Hauptaufgabe der Vorstandsmitglieder besteht darin, den nächsten Gastgeber der Spiele auszuwählen. Es stehen 3 Kandidaten (oder 4, wenn ein Land beschließt, den Vorstand zu bestechen) zur Auswahl.\nWenn Griechenland das IOC gründet, werden die Olympischen Spiele nur in Griechenland abgehalten, was dazu führt, dass der Vorstand weniger wichtig ist, da er nicht den Gastgeber wählt."
 concept_lepsius_exhibition_desc: "Ihr [concept_lepsius_museum] richtet automatisch Ausstellungen ein (in Form einer [concept_production_method] für jede Region), wenn Sie genügend [Concept('concept_lepsius_artifact','$concept_lepsius_minor_artifacts|q$')] derselben Art haben. Für normale Artefakte wird die erste Ausstellung für 10 oder mehr Artefakte erstellt. Von dort aus sind bessere Ausstellungen mit 25 (mittlere Ausstellung), 50 (große Ausstellung) und 100 kleinen Artefakten (ausgezeichnete Ausstellung) möglich. Die ausgezeichnete Ausstellung benötigt zusätzlich ein [concept_lepsius_major_artifact].\n\nLokale Artefakte haben eine weniger vielfältige Auswahl an Ausstellungen, da sie auf eine reguläre und eine große Ausstellung beschränkt sind. Für die reguläre Ausstellung sind 25 lokale Artefakte erforderlich und für die Große Ausstellung sind 50 erforderlich."
 concept_vikelas_racer: "Autorennfahrer"
 concept_vikelas_racers: "Autorennfahrer"
 concept_vikelas_racer_desc: "Ein #b Autorennfahrer#! ist eine besonderer [concept_character], der an [concept_vikelas_car_racing] teilnimmt. Neben dem [concept_vikelas_race_car] ist der Fahrer der wichtigste Faktor für den Sieg bei einem Autorennen. Seine persönlichen Eigenschaften sind entscheidend."
 concept_vikelas_car_racing: "Autorennen"
 concept_vikelas_car_racing_desc: "Autorennen sind eine Sportart, bei der [Concept('concept_vikelas_racer','$concept_vikelas_racers|q$')] entweder auf normalen Strassen oder Rennstrecken gegeneinander antreten."
 concept_lepsius_archaeological_exhibition: "Archäologische Ausstellung"
 concept_elgar_opera_desc: "Die #b Oper#! ist das musikalische Zentrum einer Nation. Hier versammeln sich die wichtigsten Musiker und spielen für die Massen.\nDie #b Oper#! ist ein separates Gebäude, das in Staaten errichtet werden kann, wenn das Stadtzentrum mindestens Stufe 5 hat. Die #b Oper#! wird Musik produzieren und Instrumente verbrauchen. Je höher die Stufe der #b Oper#! ist, desto mehr [concept_elgar_musical_tradition] wird jedes Jahr produziert.\nZusätzlich erhalten Sie mit einer #b Oper#! Zugriff auf einige Entscheidungen wie den Besuch Ihrer Oper."
 concept_elgar_impressionism_desc: "#b Impressionismus#! ist ein Stil in der Kunstgeschichte, der sich durch die stimmungsvolle Darstellung flüchtiger Momentaufnahmen einer Szene auszeichnet. Sie entstand aus einer Bewegung innerhalb der Malerei in Frankreich in der zweiten Hälfte des 19. Jahrhunderts. Der Begriff Impressionismus wurde auch auf bestimmte Musik-, Literatur-, Film- und Fotografiestile angewendet. Während viele Naturforscher wie Heinrich Hart Musik als Ausdrucksmittel eines \"wahrheitssuchenden Aktionismus\" ablehnten, empfanden die Impressionisten das \"gegenstandslose Vorausträumen\" zu fein abgestuften bunten Akkorden oft als Vergnügen.\n\nIm Spiel #b Impressionismus#! kann nur mit einem Tagebucheintrag freigeschaltet werden, der 1000 [concept_elgar_musical_tradition], eine [concept_elgar_opera], mächtige Landbesitzer, nicht mächtige Industrielle und Intellektuelle mit einer Zustimmung von über 5 erfordert. Wenn Sie #b Impressionismus#! wählen, können Sie die beiden anderen Zweige nicht freischalten.\n\nDer Fokus von #b Impressionismus#! im Spiel liegt auf Musik. Daher erhalten Sie den größten Bonus für [concept_elgar_musical_tradition]."
 concept_elgar_expressionism_desc: "#b Expressionismus#! ist ein Stil in der Kunst. Ihre Anfänge und Vorläufer sind im späten 19. Jahrhundert zu finden. Der Expressionismus ist wie Impressionismus, Symbolismus und Fauvismus eine Bewegung gegen die Tendenzen des Naturalismus. Im Expressionismus überwiegt die expressive Ebene die ästhetische, appellative und sachliche Ebene. Der Künstler möchte seine Erfahrung für den Betrachter darstellen. Im Gegensatz zum musikalischen Impressionismus, der die Wahrnehmung der äußeren Erscheinung von Dingen darstellt, formulieren die expressionistischen Kunstrichtungen die Emotionen der menschlichen Seele.\n\nIm Spiel kann #b Expressionismus#! nur mit einem erforderlichen Tagebucheintrag freigeschaltet werden 1000 [concept_elgar_musical_tradition], eine [concept_elgar_opera], mächtige Intellektuelle oder Gewerkschaftler haben, Grundbesitzer, die nicht mächtig sind und entweder die Intellektuellen oder die Gewerkschaftler eine Zustimmung von 5 oder höher haben. Wenn Sie #b Expressionismus#! wählen, können Sie die beiden anderen Zweige nicht freischalten.\n\nDer Schwerpunkt von #b Expressionismus#! im Spiel wäre Literatur, aber es ist noch nicht implementiert."
 concept_elgar_art_nouveau_desc: "#b Jugendstil#! ist ein Kunststil, der sich aus der #italic Arts-and-Crafts-Bewegung#! entwickelte und von natürlichen Formen inspiriert wurde. Es konzentrierte sich oft auf Dynamik und Bewegung und verwendete moderne Materialien.\n\nIm Spiel kann #b Jugendstil#! nur mit einem Tagebucheintrag freigeschaltet werden, der 1000 [concept_elgar_musical_tradition], eine [concept_elgar_opera], mächtige Industrielle und Intellektuelle mit einer Zustimmung von 5 oder höher erfordert. Wenn Sie #b Jugendstil#! wählen, können Sie die anderen beiden Zweige nicht freischalten.\n\nDer Fokus von #b Art Nouveau#! und #b Art Déco#!, der nächsten Technologie in diesem Zweig, ist Architektur. Sie erhalten verschiedene Veranstaltungen und Journaleinträge zu architektonischen Taten und können [concept_gaudi_architectural_splendour] erhalten."
 concept_elgar_composer: "#PURPLE #b Komponist#!#!"
 concept_elgar_composers: "#PURPLE #b Komponisten#!#!"
 concept_elgar_composer_desc: "#b Komponisten#! sind Männer und Frauen, die Musik komponieren. Komponisten sind spezielle Charaktere, die Sie entweder durch Ereignisse erhalten, indem Sie genug [concept_artistic_progress] sammeln, um einen in Ihrem Land zu erschaffen, oder indem Sie einem [concept_elgar_travelling_composer] eine Position anbieten.\nSobald Sie einen #b Komponisten#! haben, können Sie ihn [Concept('concept_elgar_composing','$concept_elgar_composing_lower_case|q$')], [Concept('concept_elgar_conducting','$concept_elgar_conducting_lower_case|q$')], auf [Concept('concept_elgar_musical_tour','$concept_elgar_musical_tours|q$')] gehen oder ein [Concept('concept_elgar_musical_masterwork','$concept_elgar_musical_masterwork_masterworks|q$')] komponieren lassen. Jede Aktion unterscheidet sich darin, was der Komponist macht, was er braucht und was Sie davon haben. Der #b Komponist#! wird nach jeder Aufgabe [Concept('concept_elgar_composer_exhaustion','$concept_elgar_composer_exhaustion_exhausted|q$')] sein und sich eine Weile ausruhen müssen, bis er wieder arbeiten kann.\nIm Laufe seines Lebens wird der #b Komponist#! [concept_artists_experience] erhalten und manchmal wieder verlieren. Je höher die #b Reputation#! ist, desto größer sind die Vorteile der Handlungen eines #b Komponisten#!. #b Komponisten#!, die eine #b Reputation#! von 500 erreichen, bekommen die Eigenschaft [Concept('concept_elgar_great_composer','$concept_elgar_great_composers|q$')], Titanen der Musik, bekannt in der ganzen Welt."
 concept_elgar_great_composer: "#PURPLE #b Großer Komponist#!#!"
 concept_elgar_great_composers: "#PURPLE #b Große Komponisten#!#!"
 concept_elgar_great_composer_desc: "#b Große Komponisten#! sind die Titanen der Musik. Diejenigen, deren Namen bis in alle Ewigkeit bekannt sein werden. [Concept('concept_elgar_composer','$concept_elgar_composers|q$')], die 500 [concept_artists_experience] erreichen, werden #b Große Komponisten#!. Dies erhöht ihre Effizienz und lässt Ihre Nation viel mehr [concept_elgar_musical_tradition] erhalten. Ein #b Großer Komponist#! kann zum Beispiel ein [concept_elgar_musical_masterwork] viel schneller erschaffen."
 concept_elgar_travelling_composer: "Reisender Komponist"
 concept_elgar_travelling_composers: "Reisende Komponisten"
 concept_elgar_travelling_composer_desc: "#b Reisende Komponisten#! sind [Concept('concept_elgar_composer','$concept_elgar_composers|q$')], die von keiner Nation angestellt wurden. Stattdessen reisen sie auf Konzerttourneen umher. Sie können einen #b Reisenden Komponisten#! anwerben, aber je mehr [concept_artists_experience] sie haben, desto mehr Ansprüche werden sie stellen.\nUm einen #b Reisenden Komponisten#! einzuladen, müssen Sie mindestens ein [Concept('concept_elgar_opera','$concept_elgar_opera_house|q$')] haben. #b Komponisten#! mit einer höheren #b Reputation#! verlangen größere Opernhäuser, moderne Musik [Concept('concept_technology', '$concept_technologies|q$')], eine gewisse [concept_elgar_musical_tradition] und manche können sich nur [Concept('concept_major_power', '$concept_major_power_short|q$')] oder [Concept('concept_great_power', '$concept_great_powers|q$')] anschließen.\nEin Sonderfall sind [Concept('concept_elgar_national_composer','$concept_elgar_national_composers|q$')], die nur für Nationen zur Verfügung stehen, die dieselbe oder eine sehr ähnliche nationale Identität haben."
 concept_elgar_national_composer: "Nationaler Komponist"
 concept_elgar_national_composers: "Nationale Komponisten"
 concept_elgar_national_composer_desc: "#b Nationale Komponisten#! sind [Concept('concept_elgar_composer','$concept_elgar_composers|q$')], die ihre Nation sehr schätzen. Sie können nicht von anderen Nationen angeheuert werden.\nOb ein #b Nationaler Komponist#! für Sie verfügbar ist oder nicht, wird durch die [Concept('concept_discrimination_trait', '$concept_cultural_traits|q$')] seiner Kultur entschieden. Eine Ihrer primären Kulturen muss sowohl eine nicht-erbliche #b Eigenschaft#! als auch eine [concept_language_trait] teilen. Das bedeutet, dass ein norddeutscher #b Nationaler Komponist#! sowohl für deutsche Länder als auch für die Schweiz verfügbar ist."
 concept_elgar_composing: "Komponieren"
 concept_elgar_composing_lower_case: "komponieren"
 concept_elgar_composing_compose: "komponieren"
 concept_elgar_composing_desc: "Ein [concept_elgar_composer], der #b komponiert#! erhält pro Jahr 5 [concept_artists_experience] und fügt dem Land 5 [concept_elgar_musical_tradition] hinzu. Außerdem schafft er jedes Jahr eine zufällige Anzahl von Kompositionen. Ein #b Komponist#! mit besonderen Fähigkeiten wie Dirigent, Virtuose, Innovativ oder Akribisch schafft eine zusätzliche Komposition pro Jahr. Die Anzahl der Kompositionen ist entscheidend für den Erfolg auf späteren [Concept('concept_elgar_musical_tour','$concept_elgar_musical_tour_tours|q$')]. Ein #b Komponist#! komponiert so lange, bis die Aktion im Journaleintrag abgebrochen wird. Ein #b Komponist#!, der komponiert, kostet das Land eine kleine jährliche Unterhaltsgebühr."
 concept_elgar_conducting: "Dirigieren"
 concept_elgar_conducting_lower_case: "dirigieren"
 concept_elgar_conducting_conduct: "dirigieren"
 concept_elgar_conducting_desc: "Der [concept_elgar_composer] wird sich 24 Monate lang auf das #b Dirigieren#! konzentrieren und eine Konzertsaison organisieren. Dies verbessert die Musikproduktion einer zufälligen [concept_elgar_opera], gibt, für 5 bis 10 Jahre, Ihrer Nation einen kleinen Schub für [concept_elgar_musical_tradition] und Ihrem #b Komponisten#! einen mittleren Schub für seine [concept_artists_experience]. Wenn Ihr #b Komponist#! noch kein Dirigent ist, kann er die [concept_character_trait] am Ende der Saison erhalten. Sie müssen den #b Komponisten#! bezahlen, solange er #b dirigiert#!."
 concept_elgar_musical_tour: "Konzerttournee"
 concept_elgar_musical_tours: "Konzerttourneen"
 concept_elgar_musical_tour_tour: "Tournee"
 concept_elgar_musical_tour_tours: "Tourneen"
 concept_elgar_musical_tour_desc: "Der [concept_elgar_composer] kann 30 Monate lang auf #b Konzerttournee#! im Ausland gehen. #b Konzerttourneen#! erhöhen das [concept_prestige] der Nation des #b Komponisten#!. Zusätzlich erhält der #b Komponist#! am Ende der #b Tournee#! einen Schub an [concept_artists_experience], der von der Anzahl der Kompositionen des #b Komponisten#!, sowie seinen Eigenschaften abhängt.\n#b Komponisten#! mit weniger als 20 Kompositionen sollten wahrscheinlich nicht auf #b Tournee#! gehen und #b Komponisten#! mit der Eigenschaft #b Zurückhaltend#! können nicht auf #b Tournee#! gehen."
 concept_elgar_musical_masterwork: "Musikalisches Meisterwerk"
 concept_elgar_musical_masterworks: "Musikalische Meisterwerke"
 concept_elgar_musical_masterwork_masterwork: "Meisterwerk"
 concept_elgar_musical_masterwork_masterworks: "Meisterwerke"
 concept_elgar_musical_masterwork_of_music: "Meisterwerk der Musik"
 concept_elgar_musical_masterworks_of_music: "Meisterwerke der Musik"
 concept_elgar_musical_masterwork_desc: "Der [concept_elgar_composer] kann mit der Komposition eines #b Meisterwerks#! beginnen, was mehrere Jahre dauern wird. Je mehr [concept_artists_experience] ein #b Komponist#! hat, desto schneller wird er fertig. Sobald das #b Meisterwerk#! fertig komponiert ist, erhält der #b Komponist#! 50 [concept_artists_experience] und das Land erhält bis zu 150 [concept_elgar_musical_tradition], abhängig von seinem [concept_rank].\nEin #b Komponist#! kann maximal 3 #b Meisterwerke#! erschaffen und benötigt während der Arbeit daran finanzielle Unterstützung durch sein Land."
 concept_elgar_composer_exhaustion: "Erschöpfung des Komponisten"
 concept_elgar_composer_exhaustion_exhausted: "erschöpft"
 concept_elgar_composer_exhaustion_desc: "Sobald ein [concept_elgar_composer] [Concept('concept_elgar_composing','$concept_elgar_composing_lower_case|q$')], [Concept('concept_elgar_conducting','$concept_elgar_conducting_lower_case|q$')], das Erstellen von [Concept('concept_elgar_musical_masterwork','$concept_elgar_musical_masterwork_masterworks|q$')] oder [Concept('concept_elgar_musical_tour','$concept_elgar_musical_tours|q$')] abgeschlossen hat, ist er von der Arbeit #b erschöpft#!. Ein #b erschöpfter Komponist#! wird für einige Zeit nicht arbeiten können. Je älter der #b Komponist#!, desto länger dauert es, die #b Erschöpfung#! loszuwerden."
 concept_manzoni_writer: "#PURPLE #b Schriftsteller#!#!"
 concept_manzoni_writers: "#PURPLE #b Schriftsteller#!#!"
 concept_klimt_painter: "#PURPLE #b Maler#!#!"
 concept_pm_artists_academy_conservatory: "#b #PURPLE Konservatorium#!#!"
 concept_pm_artists_academy_conservatory_desc: "Ein Konservatorium wird die Kunstakademie für Musik spezialisieren. Wenn Sie ein Konservatorium haben, können Sie [Concept('concept_elgar_composer','$concept_elgar_composers|q$')] fördern. Sie erhalten einen #n negativen Durchsatzmodifikator#! für die Kunstakademie sowie einen #n negativen Effekt#! auf Ihren [concept_artistic_progress], wenn Sie diese Produktionsmethode ändern."
 concept_pm_artists_academy_salon: "#b #PURPLE Literarischer Salon#!#!"
 concept_pm_artists_academy_salon_desc: "Ein Literarischer Salon wird die Kunstakademie auf Literatur spezialisieren. Wenn Sie einen Literatursalon haben, können Sie [Concept('concept_manzoni_writer','$concept_manzoni_writers|q$')] bewerben. Sie erhalten einen #n negativen Durchsatzmodifikator#! für die Kunstakademie sowie einen #n negativen Effekt#! auf Ihren [concept_artistic_progress], wenn Sie diese Produktionsmethode ändern."
 concept_pm_artists_academy_studio: "#b #PURPLE Kunstatelier#!#!"
 concept_pm_artists_academy_studio_desc: "Ein Kunstatelier wird die Kunstakademie auf Malerei spezialisieren. Wenn Sie ein Kunstatelier haben, können Sie [Concept('concept_klimt_painter','$concept_klimt_painters|q$')] werben. Sie erhalten einen #n negativen Durchsatzmodifikator#! für die Kunstakademie sowie einen #n negativen Effekt#! auf Ihren [concept_artistic_progress], wenn Sie diese Produktionsmethode ändern."
 concept_pm_artists_academy_specialization: "Schwerpunkt der Kunstakademie"
 concept_pm_artists_academy_specialization_desc: "Jede Kunstakademie kann durch Änderung ihrer Produktionsmethode spezialisiert werden.\nEine Kunstakademie mit einem [concept_pm_artists_academy_conservatory] ermöglicht es Ihnen, [Concept('concept_elgar_composer','$concept_elgar_composers|q$')] zu werben.\nEine Kunstakademie mit einem [concept_pm_artists_academy_salon] ermöglicht Ihnen die Werbung von [Concept('concept_manzoni_writer','$concept_manzoni_writers|q$')].\nEine Kunstakademie mit einem [concept_pm_artists_academy_studio] ermöglicht es Ihnen [Concept('concept_klimt_painter','$concept_klimt_painters|q$')] zu werben.\nEine Änderung der Spezialisierung hat einen #n kurzen negativen Effekt#! für das Gebäude und Ihren [concept_artistic_progress]."
 concept_artists_artist: "Künstler"
 concept_artists_artists: "Künstler"
 concept_artistic_progress: "Künstlerischer Fortschritt"
 concept_artistic_progress_desc: "Durch den Erwerb von 1000 #b Künstlerischer Fortschritt#! können Sie einen neuen [concept_artists_artist] erhalten. Um überhaupt Zugriff auf #b Künstlerischen Fortschritt#! zu haben, müssen Sie entweder über eine #b Kunst Akademie#! oder eine #b Oper#! verfügen.\nIhr #b Künstlerischer Fortschritt#! wird von verschiedenen Faktoren beeinflusst. Je mehr [concept_literacy] du hast, desto schneller erlangst du zum Beispiel #b künstlerischen Fortschritt#!. Detaillierte Informationen zu allen Faktoren, die den künstlerischen Fortschritt beeinflussen, erhalten Sie über die Symbolleiste der künstlerischen Fortschrittsleiste im Kunstfenster."
 concept_artists_experience: "Reputation"
 concept_artists_experience_desc: "Jeder [concept_artists_artist] hat eine #b Reputation#!. Diese Reputation gibt an, wie hoch das Ansehen des Künstlers ist. Künstler beginnen mit einer kleinen Reputation und können durch die Arbeit in ihrem Fachgebiet zusätzliche Reputation erlangen. Künstler, die eine Reputation von 500 erreicht haben, werden zu #b Großartigen Künstlern#! und erhalten die entsprechende [concept_character_trait]."
 concept_manzoni_great_writer: "Großer Schriftsteller"
 concept_manzoni_local_writer: "Lokaler Schriftsteller"
 concept_artists_center_of_arts: "Zentrum der Künste"
 concept_artists_centers_of_arts: "Zentren der Künste"
 concept_artists_center_of_classicism: "Zentrum des Klassizismus"
 concept_artists_center_of_romanticism: "Zentrum der Romantik"
 concept_artists_center_of_realism: "Zentrum des Realismus"
 concept_artists_center_of_impressionism: "Zentrum des Impressionismus"
 concept_artists_center_of_expressionism: "Zentrum des Expressionismus"
 concept_artists_center_of_art_nouveau: "Zentrum des Jugendstils"
 concept_klimt_great_painter: "#PURPLE #b Großer Maler#!#!"
 concept_klimt_great_painters: "#PURPLE #b Große Maler#!#!"
 concept_klimt_great_painter_desc: "#b Großer Maler#! sind [Concept('concept_klimt_painter','$concept_klimt_painters|q$')] die für die Ewigkeit bekannt sein werden. #b Maler#!, die 500 [concept_artists_experience] erreichen, werden zu #b Großen Malern#!. Dadurch wird ihre Effizienz erheblich gesteigert und Ihre Nation kann viel mehr [concept_klimt_painting_tradition] erhalten."
 concept_klimt_independent_painter: "Unabhängiger Maler"
 concept_klimt_independent_painters: "Unabhängige Maler"
 concept_klimt_painter_trip: "Bildungsreise"
 concept_klimt_painter_trip_journeys: "Reisen"
 concept_elgar_music_desc: "Die #b Musikkultur#! ist eines der Hauptmerkmale von [concept_morgenroete]. Im 19. und 20. Jahrhundert war Musik ein wichtiges Mittel, um die Bevölkerung zu unterhalten und die Größe einer Nation zu zeigen.\n\nUm auf die meisten Musikinhalte in #r Morgenröte#! zugreifen zu können, müssen Sie eine [concept_elgar_opera] bauen. Die #b Oper#! wird Musik produzieren, braucht aber Instrumente, um zu funktionieren. Abgesehen von der Produktion von #b Musik#! für Ihre Bevölkerung, werden #b Opern#! langsam [concept_elgar_musical_tradition] zu Ihrem Land hinzufügen.\n\n#b Musikalische Tradition#! reflektiert die musikalischen Errungenschaften und Traditionen einer Nation. Die Höhe der #b Musikalischen Tradition#! gibt Ihnen einen Prestige-Bonus und erlaubt Ihnen, einen Weg zu wählen, auf dem die Kunst Ihrer Nation voranschreiten kann. Sie können entweder den Weg des [concept_elgar_impressionism], [concept_elgar_expressionism] oder [concept_elgar_art_nouveau] einschlagen. Jeder dieser Kunststile hat einen anderen Schwerpunkt.\n\nEine gute Möglichkeit, noch mehr #b Musikalische Tradition#! zu erlangen, ist die Anstellung eines [Concept('concept_elgar_composer','$concept_elgar_composers|q$')]. Ein Komponist wird in der Lage sein, [Concept('concept_elgar_composing','$concept_elgar_composing_compose|q$')], [Concept('concept_elgar_conducting','$concept_elgar_conducting_conduct|q$')], auf [Concept('concept_elgar_musical_tour','$concept_elgar_musical_tours|q$')] zu gehen und sogar [Concept('concept_elgar_musical_masterwork','$concept_elgar_musical_masterworks_of_music|q$')] zu erstellen. Diese Aktionen verbessern entweder die [concept_artists_experience] des #b Komponisten#! oder die #b Musikalische Tradition#! Ihrer Nation."
 concept_artists_center_of_arts_desc: "Ein #b Kunstzentrum#! ist ein Zentrum eines [concept_artists_art_style], das in einer [concept_state_region] erstellt wird, sobald ein #b Kunststil#! erfunden wird. Es gibt nur ein #b Kunstzentrum#! pro #b Kunststil#!.\n#b Kunstzentren#! sind besonders wichtig für [Concept('concept_klimt_painter','$concept_klimt_painters|q$')], die eine [concept_klimt_painter_trip] machen sollen, um den #b Kunststil#! dort zu studieren. Außerdem lösen einige #b Kunstzentren#! einzigartige Ereignisse aus, die dort stattfinden werden. Bei einigen kannst du zum Beispiel [Concept('concept_klimt_art_prize','$concept_klimt_art_prizes|q$')] gewinnen."
 concept_klimt_painting_culture: "Malereikultur"
 concept_klimt_painting_culture_desc: "Die #b Malereikultur#! ist eines der Hauptmerkmale von [concept_morgenroete]. Im 19. und 20. Jahrhundert entwickelte sich die Malerei rasant, was zu verschiedenen neuen [Concept('concept_artists_art_style','$concept_artists_art_styles|q$')] führte, die Einzelpersonen und Ländern viel Fortschritt brachten.\n\nUm auf die meisten Malerei-Inhalte in #r Morgenröte#! zuzugreifen, musst du eine #b Kunstakademie#! aufbauen. #b Kunstakademien#! ermöglichen es dir, [concept_klimt_painting_tradition] zu erlangen und neue [Concept('concept_klimt_painter','$concept_klimt_painters|q$')] zu rekrutieren.\n\n#b Maler#! werden Gemälde und #b Meisterwerke#! für Ihr Land schaffen und Ihnen eine große Menge an #b Malerische Tradition#! geben. Da es verschiedene [Concept('concept_artists_art_style','$concept_artists_art_styles|q$')] für #b Maler#! gibt, kannst du sie zusätzliche #b Kunststile#! auf einer [concept_klimt_painter_trip] studieren lassen. Sobald sie 40 Jahre alt sind, werden sich #b Maler#! auf einen ihrer #b Kunststile#! spezialisieren und sich auf die Erstellung von Gemälden in diesem #b Kunststil#! konzentrieren."
 concept_artists_art_style: "Kunststil"
 concept_artists_art_styles: "Kunststile"
 concept_artists_art_style_style: "Stil"
 concept_artists_art_style_desc: "Ein #b Kunststil#! ist ein spezifischer Schwerpunkt der Kunst. Einige #b Kunststile#! sind von Anfang an verfügbar, wie #b Klassizismus#! und #b Romantik#!. Die anderen, #b Realism#!, #b Irrationalism#!, [concept_elgar_impressionism], [concept_elgar_expressionism] und [concept_elgar_art_nouveau], erscheinen erst, nachdem bestimmte Bedingungen erfüllt sind. Jeder #b Kunststil#! hat ein zugehöriges [concept_artists_center_of_arts] in dem [concept_state_region], in dem die Kunstrichtung begründet wurde."
 concept_klimt_painter_desc: "#PURPLE #b Maler#!#! sind Männer und Frauen, die Gemälde und andere Kunstwerke schaffen. #b Maler#! sind spezielle Charaktere, die Sie entweder durch Ereignisse erhalten, indem Sie genug [concept_artistic_progress] sammeln, um einen in Ihrem Land zu erzeugen, oder indem Sie einem [concept_klimt_independent_painter] eine Position anbieten.\n#b Maler#! beginnen sofort zu malen und erschaffen jedes Jahr eine Anzahl von Gemälden, abhängig von ihren [Concept('concept_character_trait','$concept_character_traits|q$')]. Manchmal können sie sogar ein #b Meisterwerk#! erschaffen, das Ihrer Nation noch mehr [concept_klimt_painting_tradition] gibt.\n#b Maler#! können verschiedene [Concept('concept_artists_art_style','$concept_artists_art_styles|q$')] auf [Concept('concept_klimt_painter_trip','$concept_klimt_painter_trip_journeys|q$')] studieren. Jeder #b Maler#! wird sich auf einen #b Kunststil#! spezialisieren, sobald er 40 Jahre alt ist, was ihm erlaubt, #b Meisterwerke#! eines bestimmten Stils zu malen."
 concept_klimt_independent_painter_desc: "[Concept('concept_klimt_painter','$concept_klimt_painters|q$')], die nicht von einem Land angeheuert werden, sind #b Unabhängige Maler#!. #b Unabhängige Maler#! können von Ländern angeheuert werden, die eine [Concept('concept_primary_cultures','$concept_primary_culture|q$')] haben, die eine [concept_discrimination_trait] mit der Kultur des #b Malers#! teilt.\n#b Unabhängige Maler#! haben unterschiedliche Anforderungen an ihr Gastland. Sie benötigen #b Kunstakademien#!, bestimmte [Concept('concept_technology', '$concept_technologies|q$')] oder eine bestimmte [concept_klimt_painting_tradition], je nach [concept_artists_experience] des #b Malers#!. Zusätzlich müssen Sie ihnen einen Geldbetrag zahlen, der von ihrer #b Reputation#! sowie den finanziellen Möglichkeiten Ihres Landes abhängt."
 concept_klimt_painter_trip_desc: "A [concept_klimt_painter] can learn new [Concept('concept_artists_art_style','$concept_artists_art_styles|q$')] on an #b Educational Journey#! to one of the [Concept('concept_artists_center_of_arts','$concept_artists_centers_of_arts|q$')].\nOn such a #b Trip#! a painter can gain positive and negative [Concept('concept_character_trait','$concept_character_traits|q$')] that will influence their work and the number of paintings they create. Each #b Center of Arts#! has slightly different events and will give the #b Painter#! a unique #b Trait#! at the end that can later become the #b Painter's#! Specialization."
 concept_klimt_art_prize: "Kunstpreis"
 concept_klimt_art_prizes: "Kunstpreise"
 concept_klimt_art_prize_desc: "Von Zeit zu Zeit finden künstlerische Wettbewerbe statt, bei denen Preise vergeben werden – die die Reputation eines Künstlers fördern. Nationen, die einen [concept_artists_center_of_arts] für Irrationalismus oder [concept_elgar_impressionism] haben, wählen die besten Musiker in einem alle fünf Jahre stattfindenden Wettbewerb aus. Die Besitzer eines [concept_klimt_art_gallery] oder eines #b Zentrums für Kunst des Realismus#! veranstalten alle fünf Jahre einen Malwettbewerb. Das Land, aus dem die Gewinner kommen, erhält auch Musikalisch oder Malerische Tradition. Eine besondere Form des Kunstwettbewerbs ist die Biennale, die alle zwei Jahre einen umfassenden Kunstpreis an das Land vergibt, das über die Künstler mit der höchsten Reputation verfügt, was alle kulturellen Traditionswerte steigert."
 concept_klimt_art_gallery: "Kunstgalerie"
 concept_klimt_art_gallery_desc: "The #b Art Gallery#! is a special building in a nation's capital that is available starting with #b Realism#!. It can only be built if the nation has a [concept_klimt_painter] with specialization. #b Painters#! with a specialization unlock the collection of their [Concept('concept_artists_art_style','$concept_artists_art_style_style|q$')] - that is, an artist with a specialization in the Romantic style unlocks a collection of Romanticism. In order to upgrade a collection to an excellent collection, a masterpiece of this kind is required, which must either be painted by a painter or acquired from abroad."
 concept_manzoni_writer_novelist: "Romanschriftsteller"
 concept_manzoni_writer_desc: "A #b Writer#! is a special character that will write works of literature for your country. #b Writers#! usually start as [concept_manzoni_local_writer] and will write #b Publications#! and sometimes even [Concept('concept_manzoni_bestseller','$concept_manzoni_bestsellers|q$')]. A #b Bestseller#! will grant the #b Writer#! a big amount of [concept_artists_experience] and [concept_manzoni_literary_tradition] to your country. There is a chance to write a #b Bestseller#! every year, depending on how close the #b Writer's#! [concept_manzoni_genre] is to the [concept_manzoni_popular_taste].\n\nA well known #b Writer#! whose [concept_interest_group] is happy enough, can become your [concept_manzoni_national_writer]. A #b National Writer#! can gain [Concept('concept_manzoni_book_licence','$concept_manzoni_book_licences|q$')] or create a Newspaper Novel. If a #b Writer#! gains 500 #b Reputation#! they can become a [concept_manzoni_great_writer] and provide your country with even more #b Literary Tradition#!.\n\nBe careful, if #b Writers#! are unhappy with the political situation in a country, they can decide to become [Concept('concept_agitator', '$concept_agitators|q$')] or interfere in the political discourse."
 concept_manzoni_great_writer_desc: "Ein #b Großer Schriftsteller#! ist ein [concept_manzoni_writer], der in der ganzen Welt bekannt ist. Ein #b Schriftsteller#! kann ein #b Großer Schriftsteller#! werden, wenn seine [concept_artists_experience] #V 500#! erreicht. Wenn ihr #b Großer Schriftsteller#! Ihr [concept_manzoni_national_writer] ist, erhalten Sie einen Bonus auf Ihren jährlichen Ertrag an [concept_manzoni_literary_tradition]."
 concept_manzoni_local_writer_desc: "Nahezu jeder [concept_manzoni_writer] beginnt als #b Lokaler Schriftsteller#!. Jedes Land kann maximal 3 #b Lokale Schriftsteller#! haben, die #b Publikationen#! erstellen, Ihnen [concept_manzoni_literary_tradition] einbringen, wenn ihr [concept_manzoni_genre] mit dem [concept_manzoni_popular_taste] übereinstimmt und [concept_artists_experience] erlangen.\nEin #b Lokaler Schriftsteller#! mit einer #b Reputation#! von 150 und dessen [concept_interest_group] nicht unglücklich ist, kann [concept_manzoni_national_writer] Ihres Landes werden, was Ihnen mehr #b Literarische Tradition#! und andere zusätzliche Vorteile gewährt.\nBeachten Sie, dass #b Lokale Schriftsteller#!, die mit der aktuellen politischen Situation unzufrieden sind, anfangen können, sich in den politischen Diskurs einzumischen oder sogar [concept_agitator]en werden."
 concept_manzoni_national_writer: "Nationaler Schriftsteller"
 concept_manzoni_national_writer_desc: "A #b National Writer#! is a type of [concept_manzoni_writer] that is considered to be the face of your country's literature. #b National Writers#! grant you a minimum of 1 and up to 5 [concept_manzoni_literary_tradition].\nYou can gain a #b National Writer#! by appointing one of your [Concept('concept_manzoni_local_writer','$concept_manzoni_local_writers|q$')]. To be able to appoint one of your #b Local Writers#! they must have at least #V 150#! [concept_artists_experience] and their [concept_interest_group] must have a positive [concept_approval].\n"
 concept_manzoni_bestseller: "Bestseller"
 concept_manzoni_bestsellers: "Bestseller"
 concept_manzoni_bestseller_desc: "Ein #b Bestseller#! ist eine #b Veröffentlichung#! von einem [concept_manzoni_writer], die sich sehr gut verkauft, in der Regel, weil das [concept_manzoni_genre] des #b Schriftstellers#! mit dem aktuellen [concept_manzoni_popular_taste] übereinstimmt oder diesem nahe kommt.\nJedes Jahr besteht die Chance, dass ein [concept_manzoni_national_writer] oder [concept_manzoni_local_writer] einen #b Bestseller#! schreibt. Der erste #b Bestseller#! verleiht dem Land eine große Menge an [concept_manzoni_literary_tradition] und jeder weitere #b Bestseller#! verleiht dem Land signifikante Menge an #b Literarischer Tradition#!"
 concept_manzoni_genre: "Genre"
 concept_manzoni_genres: "Genres"
 concept_manzoni_genre_desc: "Every [Concept('concept_manzoni_writer','$concept_manzoni_writer_novelist|q$')] has a specific #b Genre#! for their writing. The #b Genre#! gets assigned when the #b Writer#! gets created and depends on many factors.\n#b Writers#! will gain more [concept_artists_experience] and write more [Concept('concept_manzoni_bestseller','$concept_manzoni_bestsellers|q$')] when their #b Genre#! matches or is close to the [concept_manzoni_popular_taste] of the country."
 concept_manzoni_popular_taste: "Zuschauergeschmack"
 concept_manzoni_popular_taste_audience: "Zuschauergeschmack"
 concept_manzoni_popular_tastes_audience: "Zuschauergeschmack"
 concept_manzoni_popular_taste_desc: "Every nation's population has a #b Taste#! for a specific [concept_manzoni_genre]. About every 10 years this #b Taste#! will change depending on political, social and cultural changes in the country itself.\n[Concept('concept_manzoni_writer','$concept_manzoni_writers|q$')] who have a #b Genre#! matching the #b Taste#! or close to it will gain more [concept_artists_experience] and write more [Concept('concept_manzoni_bestseller','$concept_manzoni_bestsellers|q$')].\n\n#V Close Tastes:#!\n- #b $manzoni_taste_adventure_var_loc$#!: $manzoni_genre_science_fiction$, $manzoni_genre_juvenile$, $manzoni_genre_crime_mystery$\n- #b $manzoni_taste_crime_var_loc$#!: $manzoni_genre_science_fiction$, $manzoni_genre_adventure$, $manzoni_genre_romance$\n- #b $manzoni_taste_devotional_var_loc$#!: $manzoni_genre_juvenile$, $manzoni_genre_romance$, $manzoni_genre_adventure$\n- #b $manzoni_taste_juvenile_var_loc$#!: $manzoni_genre_adventure$, $manzoni_genre_devout$, $manzoni_genre_crime_mystery$\n- #b $manzoni_taste_literary_var_loc$#!: $manzoni_genre_social_critic$, $manzoni_genre_science_fiction$, $manzoni_genre_romance$\n- #b $manzoni_taste_romance_var_loc$#!: $manzoni_genre_devout$, $manzoni_genre_juvenile$, $manzoni_genre_literary_fiction$\n- #b $manzoni_taste_science_var_loc$#!: $manzoni_genre_adventure$, $manzoni_genre_social_critic$, $manzoni_genre_literary_fiction$\n- #b $manzoni_taste_social_var_loc$#!: $manzoni_genre_literary_fiction$, $manzoni_genre_juvenile$, $manzoni_genre_crime_mystery$"
 concept_manzoni_book_licence: "Buchlizenz"
 concept_manzoni_book_licences: "Buchlizenzen"
 concept_manzoni_book_licence_desc: "Foreign publishers can get contracts with a [concept_manzoni_national_writer] and offer his books as translations in their own market. This happens when a writer meets the [Concept('concept_manzoni_popular_taste','$concept_manzoni_popular_tastes_audience|q$')] abroad. If an author gets at least five book licenses, his books are considered world literature. He can then go on a reading tour."
 concept_manzoni_local_writers: "Lokale Schriftsteller"
 concept_manzoni_library: "Nationalbibliothek"
 concept_manzoni_library_desc: "Ihre #b Nationalbibliothek#! richtet automatisch Buchsammlungen (in Form eines [concept_production_method]) ein, wenn Sie über genügend [concept_manzoni_publications] verfügen. Die erste Buchsammlung wird ab 1.000 Publikationen angelegt. Von dort aus sind bessere Sammlungen möglich mit 2.500 (Kleine Büchersammlung), 5.000 (Kleine Büchersammlung), 10.000 (Mittlere Büchersammlung), 25.000 (Große Büchersammlung), 50.000 (Exzellente Büchersammlung) und 100.000 (Ausgezeichnete Büchersammlung)."
 concept_manzoni_publications: "Veröffentlichungen"
 concept_manzoni_publications_desc: "#b Veröffentlichungen#! umfassen alle neu veröffentlichten Buchtitel, Zeitungen, Essays und andere ähnliche schriftliche Produkte in einem Land. Sie stimmen nicht mit den @manzoni_prints! $manzoni_prints$ überein, die als Waren zirkulieren. Publikationen können auch unabhängig von der Verlagsbranche erscheinen, beispielsweise über die hauseigenen Druckereien von Regierungsgebäuden oder Universitäten. Auch Wissenschaftler und Privatpersonen produzieren je nach Alphabetisierungsniveau Publikationen. Der Löwenanteil entfällt jedoch auf die Verlagsbranche und entscheidend ist, ob eine moderne Produktionsmethode zum Einsatz kommt oder nicht. Eine große Anzahl an Veröffentlichungen ist für den Ausbau der [concept_manzoni_library] von grundlegender Bedeutung."
 concept_curtiss_tourism: "Tourismus"
 concept_curtiss_tourism_desc: "Der Tourismus verschafft einer kulturell hochstehenden Nation ein zusätzliches Einkommen. Einzigartige Denkmäler, Museen und Kunstgalerien, archäologische Stätten, Kunstzentren sowie ein hoher Wert der verschiedenen kulturellen Traditionen sind Faktoren, die ein Land zu einem attraktiven Reiseziel machen. Gesetze, die die Freizügigkeit und die wirtschaftliche Tätigkeit fördern, tragen ebenfalls zu höheren Einnahmen aus dem Tourismus bei. Auch die Infrastruktur spielt eine entscheidende Rolle - schließlich können abgelegene Orte nicht erreicht werden. Vor allem ein Flughafen revolutioniert den Tourismus und sorgt für eine deutliche Steigerung der Einnahmen."
 concept_curtiss_private_airline: "Private Fluggesellschaft"
 concept_mendelejew_chemist: "#b #ORANGE Chemiker#!#!"
 concept_manzoni_literature: "Literarische Kultur"
 concept_manzoni_literature_desc: "#b Literary Culture#! is one of the main features of [concept_morgenroete]. Print culture and newspaper culture in particular experienced significant upheavals in the 19th and 20th centuries. The mass of printed products and everyday use is represented by the printing industry. The cultural value of the literature produced is reflected in the [concept_manzoni_literary_tradition]. The latter depends largely on the [Concept('concept_manzoni_writer','$concept_manzoni_writers|q$')] of a country, and there are [Concept('concept_manzoni_local_writer','$concept_manzoni_national_writers|q$')] and [Concept('concept_manzoni_national_writer','$concept_manzoni_local_writers|q$')]. Whether they live in the shadows or become celebrated authors depends on the [concept_manzoni_popular_taste]."
 concept_morgenroete_desc: "#r Morgenröte - Dawn of Flavor #! is a mod created to broaden the cultural and scientific aspects of Victoria 3. It features content for various aspects of the Victorian Age:\n\n#V Science:#!\n #indent_newline:3 • Tesla: [concept_tesla_engineering]#!\n #indent_newline:3 • Mendeleev: [concept_mendelejew_chemistry]#!\n #indent_newline:3 • Verrier: [concept_verrier_astronomy]#!\n #indent_newline:3 • Curie: [concept_curie_physics]#!\n #indent_newline:3 • Agassiz: [concept_agassiz_geology]#!\n #indent_newline:3 • Dubois: [Concept('concept_dubois_natural_history','$concept_dubois_natural_history_paleontology|q$')]#!\n #indent_newline:3 • Ito: [concept_dubois_natural_history]#!\n #indent_newline:3 • Theiler: [concept_theiler_biology]#!\n #indent_newline:3 • Panum: [concept_panum_medicine]#!\n #indent_newline:3 • Lepsius: [concept_lepsius_archaeology]#!\n #indent_newline:3 • Andersson: [concept_andersson_anthropology]#!\n\n#V Art:#!\n#indent_newline:3 • Gaudí: [concept_elgar_architecture]#!\n#indent_newline:3 • Elgar: [concept_elgar_music]#!\n#indent_newline:3 • Manzoni: [concept_manzoni_literature]#!\n#indent_newline:3 • Klimt: [concept_klimt_painting_culture]#!\n\n#V Sports:#!\n#indent_newline:3 • Douglas: [concept_douglas_mountaineering]#!\n#indent_newline:3 • Vikelas: [concept_vikelas_sports] and [concept_vikelas_car_racing]#!\n#indent_newline:3 • Curtiss: [concept_curtiss_aviation]#!"
 concept_agassiz_mineral: "Mineral"
 concept_agassiz_minerals: "Mineralien"
 concept_agassiz_mineral_desc: "Minerals are all types of special types of rock that do not fall under the known resources used in industry. A nation receives a certain number of minerals annually once it has invented the #b Geology#! Technology. If a [Concept('concept_agassiz_geologist','$concept_agassiz_geologists|q$')] is in the service of this nation, he can find additional minerals. Locations of minerals are characterized by state modifiers: mountains, deserts, arctic areas, raw material deposits (coal, iron and sulfur areas, for example) as well as geological [Concept('concept_dubois_formation','$concept_dubois_formations|q$')] and volcanoes. Deserts and arctic areas are considered to be poor in minerals, while great geological formations and volcanoes are considered to be particularly rich in minerals. A more valuable form of minerals are [Concept('concept_agassiz_rare_mineral','$concept_agassiz_rare_minerals|q$')]."
 concept_agassiz_rare_mineral: "Seltenes Mineral"
 concept_agassiz_rare_minerals: "Seltene Mineralien"
 concept_agassiz_rare_mineral_desc: "[Concept('concept_agassiz_geologist','$concept_agassiz_geologists|q$')] can find Rare Minerals on their expeditions, such as [Concept('concept_dubois_pacific_expedition','$concept_dubois_pacific_expeditions|q$')], [concept_douglas_mountaineering] expeditions, [concept_agassiz_volcano] expeditions or during mineral prospecting. Unlike common [Concept('concept_agassiz_mineral','$concept_agassiz_minerals|q$')], they are only found in very limited quantities. Rare Minerals are used to build a mineral cabinet."
 concept_agassiz_geologist: "#b #GREEN Geologe#!#!"
 concept_agassiz_geologists: "#b #GREEN Geologen#!#!"
 concept_agassiz_geologist_desc: "#b #GREEN Geologists#!#! are [Concept('concept_academics_academic','$concept_academics_academics|q$')] who primarily study rocks and earth history. They locate [Concept('concept_dubois_formation','$concept_dubois_formations|q$')] and [Concept('concept_curie_uranium','$concept_curie_uranium|q$')] deposits, which makes them irreplaceable colleagues for [Concept('concept_dubois_paleontologist','$concept_dubois_paleontologists|q$')] and [Concept('concept_curie_physicist','$concept_curie_physicists|q$')]. During their expeditions, they may find additional [Concept('concept_agassiz_mineral','$concept_agassiz_minerals|q$')] that a [concept_mendelejew_chemist] can use to discover or isolate [Concept('concept_mendelejew_element','$concept_mendelejew_elements|q$')]. They can find new deposits of raw materials. They are also active as volcanologists and can go on expeditions to local [Concept('concept_agassiz_volcano','$concept_agassiz_volcanoes|q$')] to research them in more detail. Together with [Concept('concept_tesla_engineer','$concept_tesla_engineers|q$')], they can develop new devices, such as seismographs, to learn more about the Earth's interior. Geologists can take part in [Concept('concept_dubois_pacific_expedition','$concept_dubois_pacific_expeditions|q$')] and [concept_douglas_mountaineering] expeditions."
 concept_agassiz_volcano: "Vulkan"
 concept_agassiz_volcanoes: "Vulkane"
 concept_curie_physicist: "#b #ORANGE Physiker#!#!"
 concept_curie_physicists: "#b #ORANGE Physiker#!#!"
 concept_curie_physicist_desc: "A #b Physicist#! is an [concept_academics_academic] who studies the laws of nature, matter, energy, and their interactions across all dimensions of space and time; he or she conducts research in all areas of [concept_curie_physics]. Due to the wide-ranging fields—from mathematics to nuclear physics—there are four different types of physicists who focus on a specific subfield: [Concept('concept_curie_mathematical_physicist','$concept_curie_mathematical_physicists|q$')], [Concept('concept_curie_meteorological_physicist','$concept_curie_meteorological_physicists|q$')], [Concept('concept_curie_rocket_physicist','$concept_curie_rocket_physicists|q$')] and [Concept('concept_curie_nuclear_physicist','$concept_curie_nuclear_physicists|q$')]."
 concept_curie_uranium: "Uran"
 concept_curie_uranium_desc: "Uranium is an extremely rare material that can only be found in a few selected, historical provinces by [Concept('concept_agassiz_geologist','$concept_agassiz_geologists|q$')]. Modern Physics must have been researched for this. At first glance, uranium is a secondary ore that is only used in ceramic production. However, it will be needed later, especially in the [concept_verrier_observatory]. Only if the best physical and chemical production methods are supplied with uranium they can fulfill their purpose, whether in the field of nuclear physics or in the research of previously unknown elements. Without uranium, all scientific activities in the field of radioactivity are simply impossible. It is therefore particularly interesting for [Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists|q$')] and [Concept('concept_curie_physicist','$concept_curie_physicists|q$')] in the final phase of Victoria 3."
 concept_mendelejew_chemistry: "Chemie"
 concept_mendelejew_chemistry_desc: "#b Chemistry#! is one of the main features of [concept_morgenroete]. Starting in the 18th Century, #b Chemistry#! rapidly developed into a modern science. Suddenly many new elements were discovered and chemical processes were invented. The 19th and 20th century saw even more discoveries in Chemistry, ranging from new elements to the invention of dynamite or the Haber-Bosch-Process.\n\nIn #b Morgenröte#! #b Chemistry#! will be conducted by [Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists|q$')] who will be able to focus on different tasks.\nOne focus is the improvement of your countries #b $building_chemical_plant$#!, #b $building_explosives_factory$#! or #b $building_synthetics_plant$#!, which will make those [Concept('concept_building', '$concept_buildings|q$')] more efficient.\nIf you are looking for a more prestigious task, you can let your #b Chemist#! theorize, discover or isolate [Concept('concept_mendelejew_element','$concept_mendelejew_elements|q$')]. Each Element will add a little bit of [concept_prestige] depending on whether you theorized, discovered or isolated it.\nLater in the game the #b Chemist#! will also be able to invent #b Synthetic Oil#! and #b Synthetic Rubber#!. This will unlock the #b $building_mendelejew_hydrogenation_plants$#! or the #b $building_mendelejew_synthetic_rubber_factory$#!."
 concept_mendelejew_chemists: "#b #ORANGE Chemiker#!#!"
 concept_mendelejew_chemist_desc: "#b #ORANGE Chemists#!#! are [Concept('concept_academics_academic','$concept_academics_academics|q$')] that will theorize, discover and isolate [Concept('concept_mendelejew_element','$concept_mendelejew_elements|q$')].\n#b #ORANGE Chemists#!#! gain [concept_academics_experience] when they research #b Elements#! or attend Conferences. They can also improve fertilizers, explosives and synthetics. Chemists may invent the periodic table or synthetic fuel, making them valuable for countries without oil access. They get #b Experience#! passively as well each year. This allows #b #ORANGE Chemists#!#! to get better chemist traits. They may also get a specialization (theorist, analyst, inspector) when created or by event."
 concept_mendelejew_element: "Chemisches Element"
 concept_mendelejew_element_no_chemical: "Element"
 concept_mendelejew_elements: "Chemische Elemente"
 concept_mendelejew_element_desc: "In ancient times it was common to believe that the world consisted of the four elements: fire, earth, water and air. With the beginning of the emancipation of chemistry from alchemy, the scientific analysis of the chemical elements came about. This process was far from complete in the 19th century.\n\n[Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists|q$')] can continue this research by theorizing, discovering, and isolating elements one at a time. Only when isolated is an element considered fully recognized and given its name; previously it is just a number. The categorization of elements brings scientific progress and chemist [concept_academics_experience].\nNot all elements can be theorized, discovered and isolated from the start.\n The prerequisite is that the chemical laboratory in the [concept_verrier_observatory] has adequate equipment, in some cases also an Institute for Modern Physics. Many elements can only be properly researched with spectrography; towards the end of the game, a cyclotron may be necessary. [Concept('concept_agassiz_mineral','$concept_agassiz_minerals|q$')] are necessary for the discovery and isolation of chemical elements. In addition to production methods, the chemist's experience and character traits play a decisive role in how long the research takes.\n\nResearched elements are a requirement for the development of the periodic table and the organization of the chemistry congress."
 concept_verrier_meteorite: "Meteorit"
 concept_verrier_meteorites: "Meteoriten"
 concept_manzoni_national_writers: "Nationale Schriftsteller"
 concept_verrier_astronomy_desc: "#b Astronomy#! is one of the main features of [concept_morgenroete].\n\nTo gain access to #b Astronomy#! you need an [concept_verrier_observatory] or an [concept_verrier_astronomer].\n\nOnce you have an Observatory, you will passively discover [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects|q$')].\n\n If you have an [concept_verrier_astronomer] you will even be able to find new Planets, [Concept('concept_verrier_satellite','$concept_verrier_satellites|q$')], [Concept('concept_verrier_comet','$concept_verrier_comets|q$')] and take [Concept('concept_verrier_moon_photo','$concept_verrier_moon_photos|q$')].\nSometimes your [concept_agassiz_geologist] might also find [Concept('concept_verrier_meteorite','$concept_verrier_meteorites|q$')] which can be examined by #b Astronomers#! and [Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists|q$')].\n\nEvery Astronomical discovery will grant you [concept_verrier_astronomical_prestige] which will be added to you [concept_prestige]. Check the $verrier_astronomical_prestige_modifier$ [concept_modifier] to see your #b Astronomical Prestige#!"
 concept_verrier_observatory_desc: "An #b Observatory#! is the backbone of a country's [concept_verrier_astronomy] and [concept_mendelejew_chemistry]. From there [Concept('concept_verrier_astronomer','$concept_verrier_astronomers|q$')] can discover Planets, [Concept('concept_verrier_satellite','$concept_verrier_satellites|q$')], [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects|q$')], [Concept('concept_verrier_comet','$concept_verrier_comets|q$')] and take [Concept('concept_verrier_moon_photo','$concept_verrier_moon_photos|q$')].\nTo build an #b Observatory#!, you need to have a University and either the $verrier_astronomy_tech$ or $verrier_chemistry_tech$ [concept_technology] researched. Additionally an #b Observatory#! can only be built once and only in your capital."
 concept_verrier_astronomer_desc: "#b Astronomers#! are Academics that will explore the sky and discover [Concept('concept_verrier_satellite','$concept_verrier_satellites|q$')], [Concept('concept_verrier_comet','$concept_verrier_comets|q$')] and [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects|q$')].\n#b Astronomers#! gain [concept_academics_experience] when they discover #b Astronomical Objects#! or attend Conferences. They get #b Experience#! passively as well each year. This allows #b Astronomers#! to get better astronomer traits.\n\nAn #b Astronomer#! can focus on discovering new #b Satellites#! or #b Taking Moon Photos#!. This will however reduce the amount of discovered #b Astronomical Objects#!"
 concept_verrier_astronomical_prestige: "Astronomisches Prestige"
 concept_verrier_astronomical_prestige_desc: "#b Astronomical Prestige#! is the amount of [concept_prestige] you gain from Astronomy. Various factors influence your #b Astronomical Prestige#!:\n- Finding a new Planet will grant you between #V 15#! and #V 100#! Prestige depending on the difficulty to find it.\n- Each discovered [concept_verrier_satellite] will grant you 10 Prestige.\n- A completed [Concept('concept_verrier_moon_photo','$concept_verrier_moon_map|q$')] will grant you #V 25#! Prestige.\n- A great Comet will grant you 10 Prestige.\n- Every [concept_verrier_meteorite] will grant you #V 1#! Prestige.\n- Every #V 100#! [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects|q$')] will grant you #V 1#! Prestige."
 concept_verrier_astronomical_object_desc: "#b Astronomische Objekte#! sind Asteroiden und Sterne, die Sie entdeckt haben. Diese Objekte können entdeckt werden, wenn Sie ein [concept_verrier_observatory] haben. Je besser Ihre Astronomietechnologie ist, desto mehr Objekte werden Sie finden. Sie werden auch mehr #b Objekte#! entdecken, wenn Sie einen [Concept('concept_verrier_astronomer','$concept_verrier_astronomers$')] haben.\nMit genügend #b Astronomischen Objekten#! können Sie neue Planeten oder die Astrophysiktechnologie entdecken."
 concept_verrier_moon_map: "Mondkarte"
 concept_verrier_moon_photo_desc: "If you have an [concept_verrier_observatory] and researched the Camera Technology, you will be able to order your [concept_verrier_astronomer] to begin photographing the Moon. This will reduce the amount of [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects|q$')] from your #b Astronomer#! but give you #b Moon Photos#! every year.\nIf you collect enough #b Moon Photos#!, you will create an accurate map of Earth's Companion. Completing the Moon Map will grant your nation some [concept_verrier_astronomical_prestige]"
 concept_verrier_satellite: "Satellit"
 concept_verrier_satellites: "Satelliten"
 concept_verrier_satellite_desc: "#b Satellites#! or Moons are [Concept('concept_verrier_astronomical_object','$concept_verrier_astronomical_objects|q$')] that are orbiting a planet. Some #b Satellites#! like the Earth's Moon are already discovered, but an [concept_verrier_astronomer] can try to find more of them.\nEach #b Satellite#! discovered by your country will grant it a small amount of [concept_verrier_astronomical_prestige]."
 concept_verrier_meteorite_desc: "Meteorites are relatively small solid bodies of cosmic origin that have passed through the Earth's atmosphere and reached the ground. In rare cases, meteorite fragments can be found after a meteor shower. Meteorites that hit the earth thousands of years ago can also be found by [Concept('concept_agassiz_geologist','$concept_agassiz_geologists|q$')] in difficult terrain such as deserts and arctic areas. [Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists|q$')] and [Concept('concept_verrier_astronomer','$concept_verrier_astronomers|q$')] in particular are interested in meteorites and  might want to analyze them.\n\nAdditionally #b Meteorites#! help to raise your [concept_agassiz_geological_score] and allow for a better estimate of the [concept_agassiz_age_of_earth]."
 concept_agassiz_volcano_desc: "#b Volcanoes#! are a new state trait in #r Morgenröte#!. Unlike the base game for Victoria 3, it is not strategic regions but rather states with volcanoes that are tied to whether a volcanic eruption takes place. The volcanic activity is significantly greater, but it is not always destructive. In countries with volcanoes, a #b $building_agassiz_volcano_observatory$#! can be built, which not only helps to predict and mitigate eruptions through observations, but is also the starting point for a volcano expedition. [Concept('concept_agassiz_geologist','$concept_agassiz_geologists|q$')] can acquire new [concept_agassiz_geological_knowledge], [Concept('concept_agassiz_rare_mineral','$concept_agassiz_rare_minerals|q$')], experience and the volcanologist trait on a volcano expedition."
 concept_agassiz_geological_knowledge: "Geologisches Wissen"
 concept_agassiz_geological_knowledge_desc: "#b Geologisches Wissen#! umfasst das allgemeine Verständnis einer Nation über die Natur der Erde. Es ist eine sehr seltene Ressource, die vor allem im Laufe geologischer Meilensteine ​​erworben werden kann. #b Geologisches Wissen#! ist nicht dasselbe wie die [concept_agassiz_geological_score], aber es ist dessen wichtigster Bestandteil und wird als besonders wertvoll angesehen."
 concept_agassiz_geological_score: "Geologische Punktzahl"
 concept_agassiz_geological_score_desc: "The #b Geological Score#! includes all of a nation's achievements and knowledge that are related to geology. The most important component is [concept_agassiz_geological_knowledge], but there are many other important factors; such as the experience of a [concept_agassiz_geologist], [concept_agassiz_oceanographic_knowledge], the number of [Concept('concept_agassiz_mineral','$concept_agassiz_minerals|q$')], [Concept('concept_dubois_fossil','$concept_dubois_fossils|q$')] or [Concept('concept_dubois_specimen','$concept_dubois_specimens|q$')], and geological technologies. The Geological Score is crucial for re-dating the [concept_agassiz_age_of_earth]."
 concept_agassiz_oceanographic_knowledge: "Ozeanographisches Wissen"
 concept_agassiz_oceanographic_knowledge_desc: "#b Oceanographic Knowledge#! forms part of [concept_agassiz_geological_knowledge] and corresponds to knowledge about the seas, in particular ocean currents, but also general marine research combined with geophysical considerations. #b Oceanographic Knowledge#! is largely gained on [Concept('concept_dubois_pacific_expedition','$concept_dubois_pacific_expeditions|q$')]. 50 #b Oceanographic Knowledge#! is necessary to acquire [concept_agassiz_geological_knowledge]."
 concept_agassiz_age_of_earth: "Alter der Erde"
 concept_agassiz_age_of_earth_desc: "Eine der großen Fragen des 19. Jahrhunderts war die Frage nach dem #b Alter der Erde#!. Sie hatte naturgeschichtliche Implikationen, insbesondere hinsichtlich der Gültigkeit der Evolutionstheorie und der Abfolge geologischer Ereignisse. Nur ein [concept_agassiz_geologist] kann ein neues Erdalter bestimmen. Dazu muss seine Nation eine höhere [concept_agassiz_geological_score] aufweisen als die Nation, die zuletzt ein Erdalter bestimmt hat. Seine Forschungsergebnisse wird er dann mit anderen Kollegen teilen. Dabei muss er nicht unbedingt Erfolg haben – zu junge und unerfahrene Geologen finden kein Gehör. Allerdings sind fremde Nationen etwas entgegenkommender, wenn über viele Jahre keine neue Theorie vorgelegt wurde. Geologen können nur einmal in ihrem Leben das Alter der Erde schätzen – dies gilt allerdings auch nur, wenn sie erfolgreich sind. Bei Misserfolg kann man es nach einer Phase der Motivation erneut versuchen."
 concept_agassiz_geology: "Geologie"
 concept_agassiz_geology_desc: "#b Geology#! is one of the main features of [concept_morgenroete]. Even before the beginning of the Victorian Age, geology had already experienced a significant boom, which is why it is available to many nations at the start of the game.\n\n[Concept('concept_agassiz_geologist','$concept_agassiz_geologists|q$')] can be used in a variety of ways: they can find [Concept('concept_dubois_formation','$concept_dubois_formations|q$')], [Concept('concept_andersson_cave','$concept_andersson_caves|q$')] and [concept_curie_uranium] deposits during a geological search, go on [concept_agassiz_volcano] expeditions, determine [concept_agassiz_age_of_earth], find new ore and oil deposits or go on [concept_dubois_pacific_expedition] and [concept_douglas_mountaineering] expeditions useful as scientific companions. A [concept_agassiz_geological_score] evaluates the overall knowledge of a nation and is crucial in determining the age of the earth. [Concept('concept_agassiz_mineral','$concept_agassiz_minerals|q$')] and [Concept('concept_agassiz_rare_mineral','$concept_agassiz_rare_minerals|q$')] are an essential part of geology; The latter can be used to establish a mineral cabinet in the [concept_dubois_zoo]. A special geological facility is the #b $building_agassiz_volcano_observatory$#!, which carries out volcanological and seismic studies."
 concept_theiler_biologist: "#b #GREEN Biologe#!#!"
 concept_theiler_biologists: "#b #GREEN Biologen#!#!"
 concept_theiler_biologist_desc: "A Biologist is an [concept_academics_academic] who researches all aspects of life.\nIn [concept_morgenroete] the Biologist is mostly responsible for researching [Concept('concept_theiler_microorganism','$concept_theiler_microorganisms|q$')], improving your Agriculture, fighting [Concept('concept_theiler_pest','$concept_theiler_pests|q$')], and finding [Concept('concept_theiler_pathogen','$concept_theiler_pathogens|q$')] and [Concept('concept_theiler_vaccine','$concept_theiler_vaccines|q$')].\nBiologists gain [concept_academics_experience] passively or by finishing projects."
 concept_gaudi_architect: "#b #PURPLE Architekt#!#!"
 concept_gaudi_architects: "#b #PURPLE Architekten#!#!"
 concept_academics_university_specialization_desc: "Each University can be specialized by changing its production method.\nA university with a [concept_pm_academics_university_humanities] will allow you to focus your nations research on society innovation and allows to specifically recruit [Concept('concept_panum_physician','$concept_panum_physicians|q$')], [Concept('concept_lepsius_archaeologist','$concept_lepsius_archaeologists|q$')] and [Concept('concept_andersson_anthropologist','$concept_andersson_anthropologists|q$')].\nA university with a [concept_pm_academics_university_natural_history] will allow you to focus your nations research on society innovation and allows to specifically recruit [Concept('concept_agassiz_geologist','$concept_agassiz_geologists|q$')], [Concept('concept_dubois_paleontologist','$concept_dubois_paleontologists|q$')], [Concept('concept_dubois_naturalist','$concept_dubois_naturalists|q$')] and [Concept('concept_theiler_biologist','$concept_theiler_biologists|q$')].\nA university with a [concept_pm_academics_university_mathematics] will allow you to focus your nations research on production and military innovation and allows to specifically recruit [Concept('concept_tesla_engineer','$concept_tesla_engineers|q$')], [Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists|q$')] and [Concept('concept_verrier_astronomer','$concept_verrier_astronomers|q$')].\nChanging the Specialization will lead to [concept_academics_academic_confusion] which has a #n short negative effect#! for the building and your [concept_academics_progress].\nSpecialized Universities can influence various projects as well. Universities with a $concept_pm_academics_university_mathematics$ focus will help with engineering projects for example."
 concept_pm_academics_university_humanities_desc: "A Humanities-Anthropological Focus specializes the University and allows a national focus on Society Research and to specifically recruit [Concept('concept_lepsius_archaeologist','$concept_lepsius_archaeologists|q$')] and [Concept('concept_andersson_anthropologist','$concept_andersson_anthropologists|q$')]. You will get a #n negative throughput modifier#! for the University as well as a #n negative effect#! on your [concept_academics_progress] when you change this production method.\nSpecializing your Universities with the Humanities-Anthropological Focus will give you a bonus on the success chance of Expeditions (maximum of +4 requiring 40 Levels of specialization) and improve the progress for some other projects."
 concept_pm_academics_university_natural_history_desc: "A Natural History Focus specializes the University and allowsa national focus on Society Research and to specifically recruit [Concept('concept_agassiz_geologist','$concept_agassiz_geologists|q$')], [Concept('concept_dubois_paleontologist','$concept_dubois_paleontologists|q$')], [Concept('concept_dubois_naturalist','$concept_dubois_naturalists|q$')] and [Concept('concept_theiler_biologist','$concept_theiler_biologists|q$')]. You will get a #n negative throughput modifier#! for the University as well as a #n negative effect#! on your [concept_academics_progress] when you change this production method.\nSpecializing your Universities with the Natural History Focus will give you a bonus to various projects of your Natural scientists."
 concept_pm_academics_university_mathematics_desc: "Mathematical-Technical Focus specializes the University and allows a national focus on Production and Military Research and to specifically recruit [Concept('concept_tesla_engineer','$concept_tesla_engineers|q$')] or [Concept('concept_verrier_astronomer','$concept_verrier_astronomers|q$')]. You will get a #n negative throughput modifier#! for the University as well as a #n negative effect#! on your [concept_academics_progress] when you change this production method.\nSpecializing your Universities with the Mathematical-Technical Focus will give you a bonus to various projects of your [Concept('concept_tesla_engineer','$concept_tesla_engineers|q$')] and [Concept('concept_mendelejew_chemist','$concept_mendelejew_chemists|q$')]."
 concept_panum_physician: "#b #BLUE Arzt#!#!"
 concept_panum_physicians: "#b #BLUE Ärzte#!#!"
 concept_panum_physician_desc: "#b #BLUE Physicians#!#! are [Concept('concept_academics_academic','$concept_academics_academics|q$')] who work and research in the field of [concept_panum_medicine]. Their main task is to write [Concept('concept_panum_disease_description','$concept_panum_disease_descriptions|q$')] and find [Concept('concept_panum_disease_treatment','$concept_panum_disease_treatments|q$')].They can also improve medical research, improve healthcare, and heal other characters.\nPhysicians gain [concept_academics_experience] during their work and passively every year. They can get better levels of the physician trait by earning enough #b Experience#!."
 concept_panum_medicine: "Medizin"
 concept_panum_medicine_desc: "Medicine is one of the biggest expansions of [concept_morgenroete] for Victoria 3. One of the focuses is on epidemic [Concept('concept_panum_disease','$concept_panum_diseases|q$')] such as cholera, tuberculosis and typhus, which have plagued humanity for centuries and have finally been brought under control thanks to scientific advances. Epidemic diseases are therefore one of the negative events in [concept_morgenroete]. Containment through the search for a [concept_panum_disease_treatment] is therefore even more important. A central component of medicine is therefore a [concept_panum_physician] who is one of the academics of the anthropological-humanistic university focus. He can describe epidemic diseases and find treatments. A treatment method usually requires a [concept_panum_disease_description] and a technology. A physician can also improve the research of medical technologies or expand healthcare through hospitals, as well as introduce new medical techniques and heal other characters. Medical conferences help to spread medical knowledge internationally. An important step in the modernization of medicine is also the transition from the miasma theory to the [concept_panum_germ_theory]. A nation that is a leader in medical discoveries can also demonstrate high [concept_panum_medical_prestige]."
 concept_panum_disease: "Krankheit"
 concept_panum_diseases: "Krankheiten"
 concept_panum_disease_desc: "The term disease usually refers to the epidemic diseases that can affect a nation every few years. A [concept_panum_physician] can counteract them by making [Concept('concept_panum_disease_description','$concept_panum_disease_descriptions|q$')] and providing [Concept('concept_panum_disease_treatment','$concept_panum_disease_treatments|q$')] Epidemic diseases usually do not occur at the same time and it takes some time for epidemic diseases to break out again. Depending on the type, epidemic diseases can have a devastating effect and spread across several states. There are various [concept_panum_disease_prevention] methods to delay the onset of such a disease or to mitigate its effects. The triggers for an illness can be very different. Yellow fever only occurs in tropical regions and cholera and tuberculosis require a minimum of urbanization to have an effect. A state's standard of living and level of devestation also play a role.\n\nIn addition to these particularly feared epidemic diseases, there are also everyday diseases that a physician can randomly examine during medical research. Such diseases include rickets, pellagra and syphilis.\n\nDiseases are:\n #indent_newline:3 • [GetHarvestConditionType('panum_cholera_condition').GetName]#!\n #indent_newline:3 • [GetHarvestConditionType('panum_tuberculosis_condition').GetName]#!\n #indent_newline:3 • [GetHarvestConditionType('panum_smallpox_condition').GetName]#!\n #indent_newline:3 • [GetHarvestConditionType('panum_typhus_condition').GetName]#!\n #indent_newline:3 • [GetHarvestConditionType('panum_yellow_fever_condition').GetName]#!\n #indent_newline:3 • [GetHarvestConditionType('panum_measles_condition').GetName]#!\n #indent_newline:3 • [GetHarvestConditionType('panum_scarlet_condition').GetName]#!\n #indent_newline:3 • [GetHarvestConditionType('panum_plague_condition').GetName]#!\n #indent_newline:3 • [GetHarvestConditionType('panum_diphteria_condition').GetName]#!\n #indent_newline:3 • [GetHarvestConditionType('panum_polio_condition').GetName]#!"
 concept_panum_disease_description: "Krankheitsbeschreibung"
 concept_panum_disease_descriptions: "Krankheitsbeschreibungen"
 concept_panum_disease_description_desc: "Descriptions are the first step towards understanding a [concept_panum_disease]. They have no impact on the severity of an epidemic, but are fundamental to finding [Concept('concept_panum_disease_treatment','$concept_panum_disease_treatments|q$')], [Concept('concept_theiler_pathogen','$concept_theiler_pathogens|q$')] and [Concept('concept_theiler_vaccine','$concept_theiler_vaccines|q$')]. Disease descriptions have no further requirements: all that is required is an epidemic disease and a [concept_panum_physician]."
 concept_panum_disease_treatment: "Krankheitsbehandlung"
 concept_panum_disease_treatments: "Krankheitsbehandlungen"
 concept_panum_disease_treatment_desc: "Ein [concept_panum_physician] kann, die richtige Technologie und eine [concept_panum_disease_description] vorausgesetzt, in einem langwierigen Prozess eine Behandlung für eine [concept_panum_disease] finden. Behandlungen sind nicht dasselbe wie eine Heilung. Vielmehr findet der Arzt die Ursache einer Krankheit heraus und entwickelt auf dieser Grundlage Methoden, um einen Ausbruch zu verhindern oder deutlich einzudämmen. Krankheitsbehandlungen begrenzen die Dauer einer epidemischen Krankheit auf wenige Monate oder Wochen und verhindern zudem, dass sie sich auf mehrere Staaten ausbreitet. Krankheitsbehandlungen sind Teil möglicher [concept_panum_disease_prevention] gegen epidemische Ausbrüche."
 concept_panum_disease_prevention: "Krankheitsprävention"
 concept_panum_disease_prevention_no_disease: "Prävention"
 concept_panum_disease_prevention_desc: "There are several ways to avoid or at least mitigate an epidemic [concept_panum_disease]. The most well-known method is the [concept_panum_disease_treatment] developed by a [concept_panum_physician]. It significantly reduces the time in which a disease rages and also reduces the likelihood that it will spread to another country. Standard of living, hospitals, technologies and a high level of healthcare institutions also have an impact. The ultimate prevention is a [concept_theiler_vaccine] that prevents a disease from occurring in the first place. Vaccines are developed by [Concept('concept_theiler_biologist','$concept_theiler_biologists|q$')]. However, it is only effective if the health institution has at least reached the level specified in the medical faculty. After all, the distribution of a vaccine has to be organized and supervised."
 concept_panum_disease_type: "Krankheitstyp"
 concept_panum_disease_types: "Krankheitstypen"
 concept_panum_disease_type_desc: "Epidemic [Concept('concept_panum_disease','$concept_panum_diseases|q$')] can be differentiated according to their degree of distribution. #V Local diseases#!, such as scarlet fever, are limited to the state in which they broke out. #V Regional diseases#!, such as tuberculosis, can spread to some surrounding states, but not beyond. #V Transregional diseases#! - the most notorious of which is cholera - can spread throughout the country, even though states do not have to border each other."
 concept_panum_local_disease: "Lokale Krankheit"
 concept_panum_local_diseases: "Lokale Krankheiten"
 concept_panum_regional_disease: "Regionale Krankheit"
 concept_panum_regional_diseases: "Regionale Krankheiten"
 concept_panum_transregional_disease: "Überregionale Epidemie"
 concept_panum_transregional_diseases: "Überregionale Epidemie"
 concept_panum_germ_theory: "Keimtheorie"
 concept_panum_germ_theory_desc: "Germ theory is one of the fundamental medical scientific advances of the 19th century. It replaced previous, more archaic theories, such as the miasma theory, which was widespread in Europe and represents all traditional attempts to explain the cause of [Concept('concept_panum_disease','$concept_panum_diseases|q$')]. The discovery of germ theory not only benefits the first discoverer. When looking for [Concept('concept_panum_disease_treatment','$concept_panum_disease_treatments|q$')], the chances of success are slightly higher because it prevents some negative events and unlocks more positive events."
 concept_panum_medical_prestige: "Medizinisches Prestige"
 concept_panum_medical_prestige_desc: "Medical Prestige is made up of the [Concept('concept_panum_disease_description','$concept_panum_disease_descriptions|q$')] (2 points), [Concept('concept_panum_disease_treatment','$concept_panum_disease_treatments|q$')] (4 points), [Concept('concept_theiler_pathogen','$concept_theiler_pathogens|q$')] (3 points) and [Concept('concept_theiler_vaccine','$concept_theiler_vaccines|q$')] (4 points) discovered so far. First discoveries give twice as many points. Further medical prestige can come from curing everyday illnesses, inventing special healing methods, or generally improving the healthcare system via a [concept_panum_physician]."
 concept_theiler_pathogen: "Erreger"
 concept_theiler_pathogens: "Krankheitserreger"
 concept_theiler_pathogen_desc: "Ein Pathogen ist die Bezeichnung für etwas, das eine [concept_panum_disease] verursacht. Dies kann alles Mögliche sein, von einem Organismus bis hin zu einem [concept_theiler_microorganism]. Oft handelt es sich um ein Bakterium, einen Parasiten oder ein Virus.\nEin [concept_theiler_biologist], der Zugang zu einer ausreichenden Menge an Mikroorganismen hat, kann versuchen, das Pathogen zu finden, das eine Krankheit verursacht. Dies kann dazu beitragen, die Krankheit zu verhindern und einen [concept_theiler_vaccine] zu finden und herzustellen."
 concept_theiler_vaccine: "Impfstoff"
 concept_theiler_vaccines: "Impfungen"
 concept_theiler_vaccine_desc: "The discovery of Vaccines has allowed humans to become immune to [Concept('concept_panum_disease','$concept_panum_diseases|q$')] without contracting them and can potentially save millions of lives.\nTo create a Vaccine, A [concept_theiler_biologist] must first find the [concept_theiler_pathogen] that causes a Disease. Then the development of a Vaccine can start if enough [Concept('concept_theiler_microorganism','$concept_theiler_microorganisms|q$')] are available."
 concept_panum_red_cross: "Rotes Kreuz"
 concept_panum_red_cross_desc: "The Red Cross is one of the first international organizations and, in rare cases, offers the opportunity to receive Red Cross medics in a war. Red Cross members also receive certain bonuses. Depending on the game rule, the Red Cross can be founded historically or dynamically; Recognized states can join under certain technological requirements. The founder receives the headquarters of the Red Cross in his capital. Members can accede to up to three [Concept('concept_panum_convention','$concept_panum_conventions|q$')] that are binding under international law."
 concept_panum_convention: "Internationale Konvention"
 concept_panum_conventions: "Internationale Konventionen"
 concept_panum_convention_desc: "Eine internationale Konvention ist eine gemeinsame Absichtserklärung von Staaten, bestimmte Spielregeln im internationalen Verkehr festzulegen. Beispiele hierfür gab es im Laufe des 19. Jahrhunderts mehrere, etwa die Genfer Konvention oder die Haager Landkriegsordnung. Allen Konventionen ist gemeinsam, dass sie versuchen, die Schrecken des Krieges zu mildern. Militärische Optionen werden daher einer sicheren medizinischen Versorgung der Verwundeten vorgezogen und ultimative Waffen werden verboten, was zu einer gewissen Eindämmung des Krieges führt. Der Vorteil ist eine höhere Flexibilität. Während die Annahme einer Konvention positiv gesehen wird, kann die Aufhebung einer Konvention zu internationalem Unmut führen.\n\nInternationale Konventionen sind in der Regel unverbindliche Absichtserklärungen. Unterzeichnen sie jedoch genügend Mitglieder des [Concept('concept_panum_red_cross','Roten Kreuzes')], wird sie mit der Zeit zu gültigem Völkerrecht, an das sich alle Unterzeichner halten müssen – und das auch die anderen Mitglieder unterzeichnen. Dies geschieht, wenn 65 Prozent aller Mitglieder und die Mehrheit der Großmächte dieser Konvention zustimmen – dann sind alle anderen Mitglieder gezwungen, sich daran zu halten. Dieses Übereinkommen kann dann nicht mehr wie gewohnt abgeschafft werden. Um bindende Übereinkommen zu vermeiden, ist ein vollständiger Austritt aus dem Roten Kreuz notwendig – mit allen Konsequenzen."
 concept_manzoni_literary_tradition_desc: "#b Literary Tradition#! is a representation of a nation's literary achievements and traditions.\nThere are various ways to gain #b Literary Tradition#!. Having at least one $building_art_academy$, having one or more [Concept('concept_manzoni_local_writer','$concept_manzoni_local_writers|q$')], a [concept_manzoni_national_writer] and having certain [Concept('concept_artists_center_of_arts','$concept_artists_centers_of_arts|q$')] will passively add #b Literary Tradition#! to your country.\nThe more #b Literary Tradition#! your nation gains, the higher the prestige bonus you gain. Additionally it will allow you to unlock the [concept_elgar_expressionism] [concept_artists_art_style]."
 concept_elgar_musical_tradition_desc: "#b Musikalische Tradition#! ist die Darstellung der musikalischen Errungenschaften und Traditionen einer Nation.\nEs gibt verschiedene Möglichkeiten, #b musikalische Tradition#! zu erlangen. Wenn Sie mindestens einen [Concept('concept_elgar_composer','$concept_elgar_composers$')] haben, erhalten Sie passiv #b musikalische Tradition#!. Je mehr #b Opern#! Sie haben, desto mehr bekommen Sie. Sie können auch mehr #b musikalische Tradition#! durch Musik- und Kunsttechnologien erhalten. Jede Technologie gibt einen anderen Bonus. Sie können #b musikalische Tradition#! auch durch Ereignisse erhalten, insbesondere wenn Sie einen [concept_elgar_composer]en haben.\nJe mehr #b musikalische Tradition#! Ihre Nation erlangt, desto höher ist Ihr Prestigebonus. Außerdem können Sie damit [concept_elgar_impressionism] [concept_artists_art_style] freischalten."
 concept_klimt_painting_tradition_desc: "#b Painting Tradition#! is a representation of a nation's painting achievements and traditions. It can be gained from having #b Arts Academies#!, a [concept_klimt_painter], certain [Concept('concept_technology', '$concept_technologies|q$')] or from events.\n#b Painting Tradition#! allows you to unlock the [concept_elgar_art_nouveau] [concept_artists_art_style] and is used to calculate your #b Cultural Tradition#!."
 concept_mendelejew_theorized_elements: "Theoretisierte Elemente"
 concept_mendelejew_discovered_elements: "Entdeckte Elemente"
 concept_mendelejew_isolated_elements: "Isolierte Elemente"
 concept_panum_psycho_point: "Psychotherapeutischer Punkt"
 concept_panum_psycho_points: "Psychotherapeutische Punkte"
 concept_panum_psycho_point_desc: "Psychotherapeutische Punkte sind eine abstrakte Währung, die den Fortschritt eines Landes auf dem Gebiet der Psychiatrie und Psychologie darstellen. Sie werden monatlich durch Technologien, eine Irrenanstalt oder einen [concept_panum_physician] mit der [concept_character_trait] #V Psychiater#! generiert. Psychotherapeutische Punkte können auch über Ereignisse erworben werden. Eine hohe Anzahl an psychotherapeutischen Punkten führt zu einer besseren Chance, Charaktere mit Geisteskrankheiten zu heilen. Das Erreichen einer psychotherapeutischen Stufe bringt auch Forschungsboni und [concept_academics_progress]. Eine bestimmte Anzahl von psychotherapeutischen Punkten ist Voraussetzung für die meisten psychologischen Schulen."
 concept_vikelas_mechanic: "Mechaniker"
 concept_vikelas_mechanic_desc: "#b Mechaniker#! sind für den Bau des [Concept('concept_vikelas_race_car','Rennwagens')] verantwortlich, und ihre Charaktereigenschaften sowie ihre Erfahrung beeinflussen, wie lange der Bau oder die Aufrüstung eines Autos dauert. Sie sind jedoch nicht nur für das Auto selbst verantwortlich, sondern haben auch direkten Einfluss auf [concept_vikelas_mechanical_innovation]. Gute Mechaniker stellen sicher, dass die Geschwindigkeit eines Autos (einschließlich der Neigung des Fahrers, den Nervenkitzel der Geschwindigkeit zu suchen) die Sicherheitsbewertung nicht überschreitet, um tödliche Unfälle zu verhindern. Dasselbe gilt für die Zuverlässigkeit: Wenn die Geschwindigkeitsbewertung höher ist als die Zuverlässigkeitsbewertung, besteht eine 50-prozentige Wahrscheinlichkeit, dass das Auto sein Ziel nicht erreicht."
 concept_vikelas_mechanical_innovation: "Mechanische Innovation"
 concept_vikelas_race_car: "Rennwagen"
 concept_vikelas_race_car_desc: "Neben dem [concept_vikelas_racer] ist der #b Rennwagen#! der entscheidende Faktor bei einem [concept_vikelas_car_racing]. Sie werden von einem [concept_vikelas_mechanic] gebaut. Die wichtigsten Eigenschaften eines Rennwagens sind Geschwindigkeit, Zuverlässigkeit und Sicherheit. Ein schnelles Auto, das die Sicherheitsstandards nicht erfüllt, hat zwar durchaus Gewinnchancen, birgt aber auch ein hohes Risiko für tödliche Unfälle. Ein Auto, das sicher, aber zu langsam ist, kann hingegen keinen Sieg erringen. Das Rennteam muss daher die richtige Balance finden."
 concept_vikelas_race_car_reliability: "Zuverlässigkeit des Rennwagen"
 concept_vikelas_race_car_safety: "Sicherheit des Rennwagens"
 concept_vikelas_race_car_speed: "Rennwagengeschwindigkeit"
 concept_dubois_dinosaur_bone_no_dinosaur: "Knochen"
 concept_dubois_dinosaur_bones_no_dinosaur: "Knochen"
 concept_dubois_paleontological_expedition_desc: "A [concept_dubois_paleontologist] can be dispatched to [Concept('concept_dubois_formation','$concept_dubois_formations|q$')]. It will take 1 year and depending on the Success of the Expedition, you will get [Concept('concept_dubois_fossil','$concept_dubois_fossils|q$')] and [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones|q$')]. When you finish an Expedition and if you have a free [concept_dubois_paleontological_team] you can set up a [concept_dubois_paleontological_excavation] to passively gain Fossils and Bones from that region.\nThe easiest way to gain access to a formation is to control the associated state. However, access can also be gained peacefully through [Concept('concept_mr_research_charter','$concept_mr_research_charters|q$')]."
 concept_dubois_paleontological_team: "Paläontologisches Team"
 concept_dubois_paleontological_teams: "Paläontologische Teams"
 concept_dubois_paleontological_team_desc: "Paleontological Teams can be used to set up an [concept_dubois_paleontological_excavation] after finishing a [concept_dubois_paleontological_expedition]. This will allow you to passively get [Concept('concept_dubois_fossil','$concept_dubois_fossils|q$')] and [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones|q$')]."
 concept_dubois_paleontological_excavation: "Paläontologische Ausgrabung"
 concept_dubois_paleontological_excavations: "Paläontologische Ausgrabungen"
 concept_dubois_paleontological_excavation_desc: "You can set up a Paleontological Expedition after finishing a [concept_dubois_paleontological_expedition] if you have a free [concept_dubois_paleontological_team]. A Paleontological Excavation will allow your Team to passively produce [Concept('concept_dubois_fossil','$concept_dubois_fossils|q$')] and [Concept('concept_dubois_dinosaur_bone','$concept_dubois_dinosaur_bones|q$')]."
 concept_verrier_venus_transit: "Venus Transit"
 concept_verrier_venus_transit_desc: "Der Venustransit ist ein seltenes Ereignis, bei dem die Venus zwischen Erde und Sonne vorbeizieht. Im 19. Jahrhundert fand er jedoch zweimal statt: 1874 und 1882. Da die Beobachtung des Venustransits Rückschlüsse auf die Größe des Sonnensystems und eine genauere Bestimmung der Größe der Astronomischen Einheit (AE) ermöglicht, waren dies bedeutende wissenschaftliche Ereignisse. Länder, die sich in der [concept_verrier_venus_transit_zone] befinden, können das Ereignis von dort aus beobachten; andere Länder müssen Expeditionen entsenden. Der Erfolg der Beobachtung hängt von der Erfahrung des [Concept('concept_verrier_astronomer','$concept_verrier_astronomers$')], der Verfügbarkeit eines [Concept('concept_tesla_engineer','#b #ORANGE Ingenieurs#!#!')] und einer Portion Glück ab: Manchmal kann das Wetter ein gutes Bild verhindern. Je besser die Beobachtung, desto größer die Prämie."
 concept_verrier_venus_transit_zone: "Venustranit-Zone"
 concept_verrier_venus_transit_zone_desc: "Die Venustransitzone bezieht sich auf den Teil der Erde, von dem aus ein vollständiger (und nicht nur teilweiser) Venustransit beobachtet werden kann. Im Jahr 1874 galt dies insbesondere für die ostasiatisch-pazifische Region und im Jahr 1882 für fast den gesamten amerikanischen Kontinent. Eine detaillierte Aufschlüsselung der strategischen Regionen findet sich im Folgenden.\n\n#V Venustransit 1874:#!\nIndonesien, Indochina, Ozeanien, Südchina, Nordchina, Mandschurei, Japan, Zentralindien, Madras, Bengalen, Himalaya; außerdem der Staat des Indischen Ozeans.\n\n#V Venus-Transit 1882:#!\nBrasilien, La Plata, Anden, Großkolumbien, Mexiko, Mittelamerika, Karibik, Mittlerer Westen, Südstaaten, Neuengland; außerdem die Staaten Ontario und Quebec."
 concept_vikelas_coach: "Coach"
 concept_vikelas_coaches: "Coaches"
 concept_vikelas_coach_desc: "Coaches are the national trainers of a country in a specific national sport. National sports include [concept_vikelas_football], baseball, basketball, and cricket. Coaches provide bonuses for the respective team in competitions - whether at International World Championships or at international matches. The latter are played secretly at regular intervals and increase a coach's experience value upon victory. High experience points and positive [Concept('concept_character_trait','$concept_character_traits|q$')] increase the chance of winning a World Championship. Positive traits are those that particularly motivate players - such as ambitious or charismatic - while demotivating traits reduce the chance of winning a match. These include traits such as ruthless or cruel."
 concept_vikelas_football: "Fussball"
 concept_vikelas_football_desc: "Fußball ist ein möglicher Nationalsport. Die ersten Fußballvereine können in Europa und Südamerika gegründet werden; dies setzt ein relativ liberales Rechtssystem, ein starkes Kleinbürgertum oder einen beachtlichen durchschnittlichen Lebensstandard voraus. Danach könnten gelegentliche Fußballspiele ausgetragen werden. Mit der Gründung der FIFA werden auch internationale Spiele und die Fußballweltmeisterschaft möglich. Die acht besten Mannschaften sind automatisch für die Weltmeisterschaft qualifiziert. Die Mannschaften werden nach dem National Football Team Value (NFTV) berechnet, der sich aus den Parametern Lebensstandard (Fitness der Bevölkerung), Stärke des Kleinbürgertums (Vereinssystem), Bildung (Taktik) und Tradition (Nationalsport: ja oder nein?) ergibt. Bei Spielen wird nicht nur der NFTV berücksichtigt, sondern auch die Charaktereigenschaften und die Erfahrung des [Concept('concept_vikelas_coach','Coaches')]."
 concept_gaudi_architectural_splendour: "Architektonische Pracht"
 concept_gaudi_architectural_splendour_desc: "Architektonische Pracht ist ein Sammelbegriff für die spektakulären Fortschritte in der modernen Architektur und bezieht sich in erster Linie auf Art Deco, Bauhaus und Neoklassizismus, wie sie zu Beginn des 20. Jahrhunderts entstanden sind. Der Wert steht für die Umwandlung überholter Formen in eine zukunftsfähige Architektur. Um den Traum von einer Art-Déco-Stadt zu verwirklichen, muss man eine höhere Schwelle erreichen - doch der Nutzen ist größer."
 concept_artists_artist_desc: "In [concept_morgenroete] sind #b Künstler#! spezielle Charaktere, die es Ihnen erlauben, bestimmte Mechaniken des Mods zu nutzen. Sie können #b Künstler#! bei einigen Ereignissen bekommen oder indem Sie genug [Concept('concept_artistic_progress','künstlerischen Fortschritt')] erwerben. Künstler haben [concept_artists_experience], das ihr Ansehen in ihrem jeweiligen Bereich widerspiegelt.\nDie folgenden #b Künstler#! gibt es derzeit:\n - [concept_elgar_composer]\n - [concept_klimt_painter]\n - [concept_manzoni_writer]\n - [concept_gaudi_architect]"
 concept_elgar_architecture_desc: "Architecture is one of the core concepts of [concept_morgenroete]. It is divided into two major parts.\n\nOn the one hand, [concept_gaudi_monuments] have been completely redesigned: they are no longer built directly, but expanded step by step based on decisions. On the other hand, numerous monuments have been added - some of which must be built, others exist at the start of the game.\n\nThe other key point is the introduction of the [concept_gaudi_architect], who can upgrade cities and design up to 15 new unique buildings by researching [Concept('concept_gaudi_architectural_blueprint','$concept_gaudi_architectural_blueprints|q$')]. Architects can also rebuild a country in the Bauhaus, Neoclassical, and Art Deco styles. A [concept_gaudi_great_architect] can even design their own [concept_gaudi_custom_monument]!"
 concept_gaudi_architect_desc: "#PURPLE #b Architects#!#! are [Concept('concept_artists_artist','$concept_artists_artists|q$')] whose skills relate to urban planning, building design and construction. They are special character types that you can gain either from events, from gaining enough [concept_artistic_progress] to create one in your nation or by offering a position to a [concept_gaudi_independent_architect].\nWhile other artists are more likely to accumulate cultural tradition, architects only rarely generate the very valuable [concept_gaudi_architectural_splendour] when they are involved in urban planning or the expansion of the capital—or when they completely redesign the country in a particular architectural style. Their main task is more practical in nature. They work in public construction, thus providing a nation with additional construction points. They improve infrastructure through planning and enhance capital cities into livable places. Architects can also hone their skills on a study tour or write an architectural treatise.\nOf paramount importance is the design of new, unique buildings, for which they create a [concept_gaudi_architectural_blueprint]. A total of 15 of these [concept_gaudi_blueprint_buildings] can be researched—since this takes a long time, it's worth considering which ones make sense.\nArchitects also provide a passive bonus: their mere presence accelerates the construction of [concept_gaudi_monuments] by 100 percent. The greatest achievement of an architect is the design of their own [concept_gaudi_custom_monument]. This is only possible with a [concept_gaudi_great_architect]."
 concept_douglas_mountaineering: "Bergsteigen"
 concept_douglas_mountaineering_desc: "Countries that own at least one [concept_douglas_mountain_summit] or have a [concept_mr_research_charter] with a country that has one can participate in mountaineering. To start a #b Mountain Expedition#! you need both the #b Prospecting#! and #b Nationalism#! technologies as well as a general that has either the #b Mountaineer#!, #b Explorer#!, #b Mountain Commander#! or #b Surveyor#! Trait.\nAs soon as you start a #b Mountain Expedition#! you will have to first choose which general will be the main Mountaineer. Then you will choose the summit to climb.\nThe higher the mountains, the more dangerous is the ascent. The Mountains are classified according to their height in meters ranging from under 4000 meters up to over 8000 meters. Success depends on researched military technologies, the age and health of the leader, and their characteristics. Avalanches and steep slopes can pose a major risk that threatens the entire endeavor.\nYou can even send an additional [Concept('concept_academics_academic','$concept_academics_scientist|q$')] on the trip. Either a [concept_dubois_naturalist] or a [concept_dubois_paleontologist] will help discover more about the mountain you climbed on.\nIn the end you will get a prestige bonus and your general will develop better traits that will help them in combat as well for mountaineering."
 concept_gaudi_great_architect: "#PURPLE #b Großer Architekt#!#!"
 concept_gaudi_great_architects: "#PURPLE #b Große Architekten#!#!"
 concept_gaudi_great_architect_desc: "#b Great Architects#! are [Concept('concept_gaudi_architect','$concept_gaudi_architects|q$')] that are considered to be the most important minds in their field. #b Architects#! reaching 500 [concept_artists_experience] will become #b Great Architects#!. Should an artist achieve this special rank, he or she can design the blueprint for a truly outstanding [concept_gaudi_custom_monument] that embodies the spirit of the nation."
 concept_gaudi_monuments: "Denkmäler in #R Morgenröte#!"
 concept_gaudi_monuments_desc: "Viele Nationen erhalrne neue #b Denkmäler#! in [concept_morgenroete]: der #b Kölner Dom#! in Deutschland, die #b Gotthardbahn#! in der Schweiz, der #b Cristo Redentor#! in Brasilien, die #b Mole Antonelliana#! in Italien, der #b Sommerpalast#! in China, die #b Sagrada Família#! in Spanien, das #b Schloss Neuschwanstein#! in Bayern, der #b Palacio de Bellas Artes#! in Mexiko und der #b Gyeongbokgung Palace#! in Korea.\nAlle Gebäude außer dem #b Sommerpalast#! und dem #b Campanile#! müssen von ihrem Besitzer errichtet werden, das #b Sächsische Schloss#! kann von einer polnischen Nation reaktiviert werden. Es gibt auch neue Monumente zu Spielbeginn, wie die #b Buddhas von Bamiyan#! oder den #b Potala-Palast#!\nEs gibt auch die Möglichkeit, ein [concept_gaudi_custom_monument] von einem [concept_gaudi_great_architect] entwerfen zu lassen.\n\nIm Gegensatz zum Vanilla-Spiel werden #b Monumente#! nicht direkt gebaut, sondern durch eine Entscheidung. Der Bau erfolgt in mehreren Phasen, je nach Größe des Gebäudes, und kann Jahre oder sogar Jahrzehnte dauern - und ist deutlich teurer."
 concept_athletes_athlete: "Athleten"
 concept_athletes_athletes: "Sportler"
 concept_athletes_athlete_desc: "In [concept_morgenroete] #b Athletes#! are special characters that allow you to use certain mechanics of the mod.#b Athletes#! are usually created through events or via a button. Like other characters, #b Athletes#! possess experiences that guarantee greater success in their field.\nCurrently these #b Athletess#! exist:\n - [concept_santos_balloonist]\n - [concept_curtiss_pilot]\n - [concept_vikelas_olympian]\n - [concept_douglas_mountaineer]\n - [concept_vikelas_coach]\n - [concept_vikelas_racer]"
 concept_gaudi_independent_architect: "Unabhängiger Architekt"
 concept_gaudi_independent_architects: "Unabhängige Architekten"
 concept_gaudi_independent_architect_desc: "[Concept('concept_gaudi_architect','$concept_gaudi_architects|q$')] that are not hired by a country are #b Independent Architects#!.\nUnlike many other artists, there are few requirements to recruit an #b Independent Architect#!, except for a minimal technological recquirement. They are true globetrotters and usually only demand good payment."
 concept_gaudi_architectural_blueprint: "Architektonische Blaupause"
 concept_gaudi_architectural_blueprints: "Architektonische Blaupausen"
 concept_gaudi_architectural_blueprint_desc: "Architectural blueprints can be researched by [Concept('concept_gaudi_architect','$concept_gaudi_architects|q$')]. They are essential for the construction of special [concept_gaudi_blueprint_buildings] that can only be erected once in a nation. There are a total of 15 different buildings in five different categories. Certain blueprints require technologies to be researched. Since research can sometimes take years, it's wise to decide beforehand which blueprints are most important. The buildings can potentially be constructed in any state, but require a certain level of urbanization. In some cases, there may be additional requirements."
 concept_gaudi_blueprint_buildings: "Blaupausen-Gebäude"
 concept_gaudi_blueprint_buildings_desc: "Blueprint buildings are buildings which need a bluprint researched by [Concept('concept_gaudi_architect','$concept_gaudi_architects|q$')]. These buildings can only be built once in a nation. There are 15 different buildings:\n\n#b Monument#!\n- [GetBuildingType('building_gaudi_statue').GetName]\n- [GetBuildingType('building_gaudi_fountain').GetName]\n- [GetBuildingType('building_gaudi_arch').GetName]\n\n#b Public Square#!\n- [GetBuildingType('building_gaudi_park').GetName]\n- [GetBuildingType('building_gaudi_luna').GetName]\n- [GetBuildingType('building_gaudi_parade').GetName]\n\n#b Service Buildings#!\n- [GetBuildingType('building_gaudi_almshouse').GetName]\n- [GetBuildingType('building_gaudi_school').GetName]\n- [GetBuildingType('building_gaudi_prison').GetName]\n\n#b Health Institutions#!\n- [GetBuildingType('building_gaudi_canalization').GetName]\n- [GetBuildingType('building_gaudi_hospital').GetName]\n- [GetBuildingType('building_gaudi_health').GetName]\n\n#b National Academies#!\n- [GetBuildingType('building_gaudi_science').GetName]\n- [GetBuildingType('building_gaudi_arts').GetName]\n- [GetBuildingType('building_gaudi_sports').GetName]"
 concept_gaudi_custom_monument: "individuelles Denkmal"
 concept_gaudi_custom_monument_desc: "Ein maßgeschneidertes Denkmal ist das größtmögliche Meisterwerk von [Concept('concept_gaudi_architect','$concept_gaudi_architects$')]. Es kann mit anderen, gewöhnlichen Denkmälern konkurrieren. Nur ein [concept_gaudi_great_architect] kann solche Pläne entwerfen. Sie erfordern die Erforschung der modernsten architektonischen Technologien. Die Art des Denkmals, das ein Architekt entwirft, hängt weitgehend von seinem Architekturstil ab. Art-Déco-Architekten entwerfen das [GetBuildingType('building_gaudi_people_monument').GetName], Bauhaus-Architekten das [GetBuildingType('building_gaudi_people_forum').GetName] und neoklassische Architekten das [GetBuildingType('building_gaudi_people_palace').GetName]."
 concept_douglas_mountaineer: "Bergsteiger"
 concept_douglas_mountaineers: "Bergsteiger"
 concept_douglas_mountaineer_desc: "#b Mountaineers#! are [Concept('concept_athletes_athlete','$concept_athletes_athletes|q$')] who can climb unconquered [concept_douglas_mountain_summit]. They can be recruited against [concept_douglas_alpine_heritage] after the establishment of a mountaineering club. Countries with geographical features such as mountains, peaks, or volcanoes therefore have an advantage in recruitment. Mountaineering traits and experience are the most important factors for progress in conquering a mountain or overcoming a dangerous situation."
 concept_vikelas_olympian: "Olympionike"
 concept_vikelas_olympian_desc: "#n Dieser Eintrag wird derzeit überarbeitet.#!"
 concept_douglas_mountain_summit: "Berggipfel"
 concept_douglas_mountain_summits: "Berggipfel"
 concept_douglas_mountain_summit_desc: "Berggipfel sind das begehrte Ziel aller Alpinisten. Sie markieren den höchsten Punkt eines Berges. Jeder Gipfel hat drei verschiedene Eigenschaften, die bestimmen, wie schwierig es ist, ihn erfolgreich zu erreichen.\n\n#V Höhe#!: Die Höhe bestimmt, wie viele Schritte erforderlich sind, um einen Berg zu besteigen - dies spiegelt die Gesamtlänge einer Expedition wider. Pro 1.000 Meter ist ein Aufstiegsschritt erforderlich. Der Wert wird aufgerundet, d. h. für den 4.421 Meter hohen Mount Whitney sind 5 Schritte erforderlich, für den 7.134 Meter hohen Kauffmann Peak dagegen 8. Das Prestige eines Berges wird auf der Grundlage seiner Höhe berechnet: Die Gesamthöhe wird durch 300 geteilt. Ein idealer Berg von 4.500 Metern Höhe gewährt also 15 Prestige.\n\n#V Stufe#!: Die Stufe eines Berges entspricht den Anforderungen an die Ausrüstung, die für seine Besteigung erforderlich ist. Sie ist nicht strikt an seine Höhe gebunden. Zum Beispiel ist der Citlaltépetl trotz seiner 5.636 Meter nur Stufe 1 und erfordert nur eine Grundausrüstung. Im Gegensatz dazu gilt das Matterhorn mit einer Höhe von nur 4.478 Metern als wesentlich anspruchsvoller (Stufe 3) und erfordert zumindest eine Erste-Hilfe-Ausrüstung für alpine Notfälle.\n\n#V Risiko#!: Die Risikostufe eines Berges gibt die Wahrscheinlichkeit an, dass negative Ereignisse eine Expedition beeinträchtigen. Sie ist sowohl von der Höhe als auch vom Niveau unabhängig. Lawinen, Nebel und schlechtes Wetter sind die Hauptrisiken. Der Popocatépetl konnte bereits in der frühen Neuzeit aufgrund seiner gastfreundlichen Umgebung bestiegen werden. Der wesentlich kleinere Großvenediger mit nur 3.666 Metern stellte dagegen noch bis ins frühe 19. Jahrhundert eine ernsthafte Bedrohung für österreichische Expeditionen dar.\n\nWeitere Informationen zu den einzelnen Gipfeln finden Sie unter [concept_douglas_mountain_summit_list]."
 concept_douglas_mountain_range: "Bergkette"
 concept_douglas_mountain_ranges: "Gebirgsketten"
 concept_douglas_mountain_range_desc: "A mountain range is defined as a mountain formation that offers potential for [concept_douglas_mountaineering] training over long distances. Classic mountain ranges include the Rocky Mountains, the Andes, the Alps, and the Caucasus. Unlike the [Concept('concept_douglas_mountain_summit','$concept_douglas_mountain_summits|q$')] that are to be conquered, there are also plenty of less challenging mountains where there is no risk of a [concept_douglas_mountaineer] experiencing a fatal fall. Rather, they should be viewed as a training route. Countries with mountain ranges are more likely to produce mountaineers than those without this geographical feature."
 concept_douglas_alpine_heritage: "Alpines Erbe"
 concept_douglas_alpine_heritage_desc: "Alpine Heritage is a collective term for a connection with the mountains and a specialization in climbing mountains. It also refers to the potential to recruit new [Concept('concept_douglas_mountaineer','$concept_douglas_mountaineers|q$')]—since, in most cases, experienced mountaineers come from mountainous areas. This always gives countries with [Concept('concept_douglas_mountain_range','$concept_douglas_mountain_ranges|q$')] or [Concept('concept_douglas_mountain_summit','$concept_douglas_mountain_summits|q$')] an advantage. Recruiting a new mountaineer, as well as various other actions, costs Alpine Heritage."
 concept_douglas_mountain_summit_list: "Liste von Berggipfeln"
 concept_douglas_mountain_summit_list_desc: "There are many [Concept('concept_douglas_mountain_summit','$concept_douglas_mountain_summits|q$')] that can be climbed.\n\n#V North America:#!\n#b Mount McKinley#! (Alaska), Height 6190 meters, Level 4\n#b Mount Logan#! (Yukon Territory), Height 5959 meters, Level 4\n#b Citlaltépetl#! (México), Height 5636 meters, Level 1\n#b Mount Whitney#! (California), Height 4421 meters, Level 1\n\n#V South America:#!\n#b Aconcagua#! (Mendoza), Height 6267 meters, Level 3\n#b Huascarán#! (Lima Territory), Height 6768 meters, Level 5\n#b Illimani#! (La Paz), Height 6438 meters, Level 4\n#b Chimborazo#! (Ecuador), Height 6267 meters, Level 1\n\n#V Europe:#!\n#b Shkara#! (Greater Caucasus), Height 5642 meters, Level 4\n#b Dufourspitze#! (West Switzerland), Height 4634 meters, Level 2\n#b Matterhorn#! (West Switzerland), Height 4478 meters, Level 3\n#b Aiguille Verte#! (Savoy), Height 4122 meters, Level 3\n#b Pico de Aneto#! (Aragon), Height 3404 meters, Level 1\n\n#V Africa:#!\n#b Kibo#! (Tanganyika), Height 5895 meters, Level 2\n#b Mount Kenya#! (Kenya), Height 5199 meters, Level 3\n#b Mount Stanley#! (Uganda), Height 5109 meters, Level 3\n#b Mount Cameroon#! (South Cameroon), Height 4095 meters, Level 1\n\n#V Asia:#!\n#b Kamet#! (Delhi), Height 7756 meters, Level 4\n#b Chogolisa#! (Kashmir), Height 7665 meters, Level 5\n#b Kabru#! (Himalayas), Height 7412 meters, Level 5\n#b Kaufmann Peak#! (Tajikistan), Height 7134 meters, Level 4\n\n#V Australia & Oceania:#!\n#b Mount Wilhelm#! (Eastern New Guinea), Height 4121 meters, Level 2\n#b Mount Cook#! (South Island), Height 3724 meters, Level 2"
