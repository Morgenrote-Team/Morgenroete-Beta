 curie.21.t: "Masse-Energie-Äquivalenz"
 curie.21.d: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] discovered a law of nature using a simple equation. It states that the mass m and the rest energy E of an object are proportional to each other. The formula is:\nE=mc²"
 curie.21.f: "Die von Albert Einstein im Jahr 1905 während seines Wunderjahres veröffentlichte Masse-Energie-Äquivalenz (E=mc²) entstand aus seiner speziellen Relativitätstheorie. Aufbauend auf den Entwicklungen des 19. Jahrhunderts in der Elektrodynamik und den Erhaltungssätzen demonstrierte Einstein, dass Masse und Energie austauschbare Aspekte derselben physikalischen Realität sind und revolutionierte damit die moderne Physik."
 curie.21.g: "[SCOPE.sCharacter('curie_physicist_scope').GetSheHe|U] is a genius!"
 curie.22.t: "Ein Essay über die Winde und Strömungen des Ozeans"
 curie.22.d: "In an essay, [SCOPE.sCharacter('curie_physicist_scope').GetFullName] presented the first plausible explanation for wind circulation in the Earth's mid-latitudes. The work is already becoming a standard reference in meteorology!"
 curie.22.f: "Die 1856 von dem amerikanischen Meteorologen William Ferrel veröffentlichte Abhandlung „An Essay on the Winds and the Currents of the Ocean“ legte die Grundlagen für die geophysikalische Fluiddynamik. Aufbauend auf Hadleys Zirkulationsmodell demonstrierte Ferrel mathematisch, wie die Erdrotation bewegte Luft und Wasser ablenkt – und führte damit das später als Coriolis-Effekt bekannte Konzept ein. Seine Arbeit erklärte erfolgreich die globalen Windgürtel und die atmosphärischen Zirkulationsmuster der mittleren Breiten und revolutionierte Meteorologie und Ozeanographie."
 curie.22.g: "Die Winde sind also kein bloßer Zufall?"
 je_curie_decision_problem: "Das Entscheidungsproblem"
 je_curie_decision_problem_reason: "1928 stellte der deutsche Mathematiker David Hilbert die Frage: Gibt es ein mechanisches Verfahren, das für jede mathematische Aussage feststellen kann, ob sie beweisbar ist? Leibniz hatte bereits davon geträumt, eine Maschine zu bauen, die Symbole manipulieren könnte, um die Wahrheitswerte mathematischer Aussagen zu bestimmen. Er erkannte, dass der erste Schritt eine klare, formale Sprache sein müsste, und ein Großteil seiner späteren Arbeit war diesem Ziel gewidmet. Noch 1930 glaubte Hilbert, dass es kein unlösbares Problem geben würde."
 je_curie_decision_problem_progress_complete_tt: "The progess reached #V 100#!."
 je_curie_decision_problem_failed_tt: "Another nation solves the decision problem before Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName]."
 curie_physicist_decision_problem_progress_bar: "Lösung"
 curie_physicist_decision_problem_progress_bar_desc: "Solution Progress: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|1%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/100)"
 curie.311.t: "The [ROOT.Var('curie_physicist_var').GetCharacter.GetLastNameNoFormatting] Machine"
 curie.311.d: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] has provided an answer to the decision problem using an unusual thought experiment: It's complicated. And unsolvable."
 curie.311.f: "Die Turingmaschine ist ein mathematisches Berechnungsmodell, das der britische Mathematiker Alan Turing 1936 im Rahmen seiner Arbeiten zu den Grundlagen der Mathematik und dem Entscheidungsproblem einführte. Sie besteht aus einem unendlich langen, in Zellen unterteilten Band, einem Lese-/Schreibkopf und einer Reihe vordefinierter Regeln, die festlegen, wie die Maschine liest, schreibt und sich auf dem Band bewegt. Durch die Manipulation von Symbolen gemäß diesen Anweisungen kann die Maschine jede algorithmisch mögliche Berechnung durchführen. Ihre Bedeutung liegt in der Etablierung der theoretischen Grundlagen des modernen Rechnens: Sie demonstrierte, dass eine einzige universelle Maschine jede andere Rechenmaschine simulieren kann und führte damit das Konzept des universellen Rechnens ein. Obwohl die Turingmaschine nie als physischer Computer konzipiert war, wurde sie zu einem fundamentalen Modell der Informatik und prägte die Entwicklung von Programmiersprachen, Algorithmen und der modernen Computerarchitektur."
 curie.311.g: "Ich habe ehrlich gesagt kein Wort verstanden, aber es scheint ziemlich revolutionär zu sein."
 curie_turing_machine_modifier: "Turingmaschine"
 curie.313.t: "Entscheidungsproblem in einem anderen Land gelöst"
 curie.313.d: "As Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetFullName] was reading a mathematical journal today, [ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe] was shocked to discover that another mathematician had solved the decision problem [ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe] had been pondering for so long. [ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe|U] is devastated by this development—because the solution approach resembles [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis] own..."
