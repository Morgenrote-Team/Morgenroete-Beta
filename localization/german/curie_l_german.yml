 je_curie_agricultural_weather_service_reason: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] hat sich selbst vollständig der Agrarmeteorologie gewidmet – [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis]e Wetterberichte konzentrieren sich auf Vorhersagen, die für die Landwirte des Landes besonders wichtig sind. Ob Dürren, Stürme oder Überschwemmungen – die Vorbereitung des lokalen Agrarsektors sorgt dafür, dass die Auswirkungen meteorologischer und klimatischer Bedingungen weniger gravierend sind, da die Landwirte frühzeitig gewarnt werden.\n\nDie Stärke des [concept_modifier] hängt maßgeblich von der Erfahrung eines [concept_curie_meteorological_physicist] ab."
 je_curie_marine_weather_service: "Schifffahrtsvorhersage"
 je_curie_marine_weather_service_reason: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] has given an undertaking to the Ministry of the Navy to make shipping—and by that we mean, above all, the fleet—safer and to forecast potential storms or other dangers at sea. This is likely to be particularly useful in times of war.\n\nThe strenght of the [concept_modifier] depends largely on a [concept_curie_meteorological_physicist]'s experience."
 curie.501.t: "Ende der Wettervorhersage"
 curie.501.d: "Having spent the last few years mainly providing weather forecasts for the general public on behalf of the state, Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] is now returning to the world of science. [ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe|U] was gradually finding the public spotlight a bit too much."
 curie.501.f: "Unser Meteorologe wird bald wieder ganz der Alte sein, sobald [ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe] wieder Zeit für [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis]e völlig rätselhafte Instrumente und absolut unsinnige Studien findet. Wer in aller Welt nimmt diese Wissenschaft eigentlich ernst?"
 curie.501.a: "Er ist der Wetteransager!"
 curie.501.b: "Sie ist die Wetterfee!"
 curie_weather_station_expansion_cost_modifier: "Kosten für die Erweiterung der Wetterstation"
 je_curie_weather_station_expansion: "Erweiterung der Wetterstation"
 je_curie_weather_station_expansion_reason: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] works tirelessly at the observatory to bring the weather station there up to date. The condition of the national weather station is of nationwide importance for forecasting weather phenomena."
 je_curie_weather_station_expansion_progress_complete_tt: "The progess reached #V 36#!."
 curie_weather_station_expansion_progress_bar: "Erweiterung der Wetterstation"
 curie_weather_station_expansion_progress_bar_desc: "Weather Station Expansion Progress: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|1%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/36)"
 curie.502.t: "Erweiterte Wetterstation"
 curie.502.d: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] is proud to announce that the observatory's new weather station is complete. It is now the beating heart of the nation's meteorological system and will improve severe weather warnings nationwide!"
 curie.502.f: "Die ersten standardisierten Beobachtungsnetze entstanden im 17. und 18. Jahrhundert. Die Erfindung des elektrischen Telegrafen revolutionierte die Beobachtungen und ermöglichte die Datenerfassung in Echtzeit über riesige Gebiete hinweg; später gründeten Regierungen spezielle nationale Institutionen, wie das britische Met Office (1854) und das US-amerikanische Wetteramt (1870)."
 curie.502.g: "Wie wird das Wetter morgen sein?"
 curie.511.g: "[ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe|U] is a true cloud catcher!"
 curie.521.g: "Das sind die zweitschönsten Wolken, die ich je gesehen habe!"
 curie.511.d: "Under clear weather conditions, Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] was able to closely observe and study the #V Cirrus Clouds#! and draw new meteorological conclusions from them. This marks the first time this type of cloud has been described in [GetPlayer.GetName]!"
