 curie_has_active_nuclear_physicist_trigger_tt: "#default_text Hat einen [concept_curie_nuclear_physicist], der nicht beschäftigt ist.#!"
 curie_mathematical_physicist: "Mathematiker"
 curie_mathematical_physicist_desc: "Dieser Charakter hat einige außergewöhnliche mathematische Entdeckungen gemacht und genießt deshalb hohes Ansehen in der Öffentlichkeit."
 curie_meteorological_physicist: "Meteorologe"
 curie_meteorological_physicist_desc: "Meteorologen sind Wissenschaftler, die das Wetter beobachten und versuchen, Vorhersagen darüber zu erstellen, wie das Wetter in der Zukunft sein wird."
 curie_rocket_physicist: "Raketenphysiker"
 curie_rocket_physicist_desc: "Raketenwissenschaftler sind bekannt für ihr extrem anspruchsloses Forschungsgebiet, das aus der Theorie, dem Entwurf und dem Bau neuer Raketentypen besteht."
 curie_nuclear_physicist: "Kernphysiker"
 curie_nuclear_physicist_desc: "Solche Physiker sollten niemals auf die Menschheit losgelassen werden und sollten unter strengsten Sicherheitsvorkehrungen in einem Labor eingesperrt bleiben."
 building_curie_rocket: "Raketentestgelände"
