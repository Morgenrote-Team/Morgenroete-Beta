 je_curie_agricultural_weather_service: "Landwirtschaftlicher Wetterdienst"
 je_curie_agricultural_weather_service_reason: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] hat sich selbst vollständig der Agrarmeteorologie gewidmet – [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis]e Wetterberichte konzentrieren sich auf Vorhersagen, die für die Landwirte des Landes besonders wichtig sind. Ob Dürren, Stürme oder Überschwemmungen – die Vorbereitung des lokalen Agrarsektors sorgt dafür, dass die Auswirkungen meteorologischer und klimatischer Bedingungen weniger gravierend sind, da die Landwirte frühzeitig gewarnt werden.\n\nDie Stärke des [concept_modifier]s hängt maßgeblich von der Erfahrung eines [Concept('concept_curie_meteorological_physicist','$concept_curie_meteorological_physicists|q$')] ab."
 je_curie_marine_weather_service: "Schifffahrtsvorhersage"
 je_curie_marine_weather_service_reason: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] hat dem Marineministerium die Zusage gegeben, die Schifffahrt – und damit meinen wir vor allem die Flotte – sicherer zu machen und potenzielle Stürme oder andere Gefahren auf See vorherzusagen. Dies dürfte sich insbesondere in Kriegszeiten als nützlich erweisen.\n\nDie Stärke des [concept_modifier]s hängt maßgeblich von der Erfahrung eines [Concept('concept_curie_meteorological_physicist','$concept_curie_meteorological_physicists|q$')] ab."
 curie.501.t: "Ende der Wettervorhersage"
 curie.501.d: "Nachdem sie die letzten Jahre hauptsächlich im Auftrag des Staates Wettervorhersagen für die Öffentlichkeit erstellt hat, kehrt Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] nun in die Welt der Wissenschaft zurück. [ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe|U] wurde das öffentliche Rampenlicht allmählich etwas zu viel."
 curie.501.f: "Unser Meteorologe wird bald wieder ganz der Alte sein, sobald [ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe] wieder Zeit für [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis]e völlig rätselhafte Instrumente und absolut unsinnige Studien findet. Wer in aller Welt nimmt diese Wissenschaft eigentlich ernst?"
 curie.501.a: "Er ist der Wetteransager!"
 curie.501.b: "Sie ist die Wetterfee!"
 curie_weather_station_expansion_cost_modifier: "Kosten für die Erweiterung der Wetterstation"
 je_curie_weather_station_expansion: "Erweiterung der Wetterstation"
 je_curie_weather_station_expansion_reason: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] arbeitet unermüdlich in der Sternwarte, um die dortige Wetterstation auf den neuesten Stand zu bringen. Der Zustand der nationalen Wetterstation ist von landesweiter Bedeutung für die Wettervorhersage."
 je_curie_weather_station_expansion_progress_complete_tt: "Der Fortschritt erreichte #V 36#!."
 curie_weather_station_expansion_progress_bar: "Erweiterung der Wetterstation"
 curie_weather_station_expansion_progress_bar_desc: "Fortschritt der Wetterstationserweiterung: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|1%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/36)"
 curie.502.t: "Erweiterte Wetterstation"
 curie.502.d: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] freut sich, die Fertigstellung der neuen Wetterstation des Observatoriums bekanntzugeben. Sie ist nun das Herzstück des nationalen meteorologischen Systems und wird die Unwetterwarnungen landesweit verbessern!"
 curie.502.f: "Die ersten standardisierten Beobachtungsnetze entstanden im 17. und 18. Jahrhundert. Die Erfindung des elektrischen Telegrafen revolutionierte die Beobachtungen und ermöglichte die Datenerfassung in Echtzeit über riesige Gebiete hinweg; später gründeten Regierungen spezielle nationale Institutionen, wie das britische Met Office (1854) und das US-amerikanische Wetteramt (1870)."
 curie.502.g: "Wie wird das Wetter morgen sein?"
 curie.511.g: "[ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe|U] ist ein wahrer Wolkenfänger!"
 curie.521.g: "Das sind die zweitschönsten Wolken, die ich je gesehen habe!"
 curie.511.d: "Bei klarem Wetter konnte Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] die #V Cirruswolken#! genau beobachten und untersuchen und daraus neue meteorologische Schlussfolgerungen ziehen. Dies ist das erste Mal, dass diese Wolkenart [GetPlayer.GetAltName('IN')] beschrieben wurde."
 curie.512.d: "Bei klarem Wetter konnte Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] die #V Cirrocumuluswolken#! genau beobachten und untersuchen und daraus neue meteorologische Schlussfolgerungen ziehen. Dies ist das erste Mal, dass diese Wolkenart [GetPlayer.GetAltName('IN')] beschrieben wurde."
 curie.513.d: "Bei klarem Wetter konnte Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] die #V Cirrostratuswolken#! genau beobachten und untersuchen und daraus neue meteorologische Schlussfolgerungen ziehen. Dies ist das erste Mal, dass diese Wolkenart [GetPlayer.GetAltName('IN')] beschrieben wurde."
 curie.514.d: "Bei klarem Wetter konnte Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] die #V Altocumuluswolken#! genau beobachten und untersuchen und daraus neue meteorologische Schlussfolgerungen ziehen. Dies ist das erste Mal, dass diese Wolkenart [GetPlayer.GetAltName('IN')] beschrieben wurde."
 curie.515.d: "Bei klarem Wetter konnte Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] die #V Altostratus-Wolken#! genau beobachten und untersuchen und daraus neue meteorologische Schlussfolgerungen ziehen. Dies ist das erste Mal, dass diese Wolkenart [GetPlayer.GetAltName('IN')] beschrieben wurde."
 curie.516.d: "Bei klarem Wetter konnte Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] die #V Nimbostratus-Wolken#! genau beobachten und untersuchen und daraus neue meteorologische Schlussfolgerungen ziehen. Dies ist das erste Mal, dass diese Wolkenart [GetPlayer.GetAltName('IN')] beschrieben wurde."
 curie.517.d: "Bei klarem Wetter konnte Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] die #V Stratocumulus-Wolken#! aus nächster Nähe beobachten und untersuchen und daraus neue meteorologische Schlussfolgerungen ziehen. Dies ist das erste Mal, dass diese Wolkenart [GetPlayer.GetAltName('IN')] beschrieben wurde!"
 curie.518.d: "Bei klarem Wetter konnte Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] die #V Stratuswolken#! genau beobachten und untersuchen und daraus neue meteorologische Schlussfolgerungen ziehen. Dies ist das erste Mal, dass diese Wolkenart [GetPlayer.GetAltName('IN')] beschrieben wurde."
 curie.519.d: "Bei klarem Wetter konnte Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] die #V Cumuluswolken#! genau beobachten und untersuchen und daraus neue meteorologische Schlussfolgerungen ziehen. Dies ist das erste Mal, dass diese Wolkenart [GetPlayer.GetAltName('IN')] beschrieben wurde."
 curie.520.d: "Bei klarem Wetter konnte Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] die #V Cumulonimbus-Wolken#! genau beobachten und untersuchen und daraus neue meteorologische Schlussfolgerungen ziehen. Dies ist das erste Mal, dass diese Wolkenart [GetPlayer.GetAltName('IN')] beschrieben wurde."
 curie.521.d: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] traut [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis]en Augen nicht: Während eines Spaziergangs in [SCOPE.sState('curie_cloud_state').GetCityHubName] entdeckt [ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe] plötzlich silberne Fäden am Himmel. Könnte es sich um eine bisher unbekannte Wolkenart handeln?"
 curie.522.d: "Während der Polarexpedition machte die Zeppelin-Besatzung eine außergewöhnliche Entdeckung: Plötzlich erschienen regenbogenfarbene Wolken am Himmel! Es sah aus, als würden Perlmuttkörner am Himmel hängen!"
