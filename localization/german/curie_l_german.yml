 alert_curie_geomagnetics_possible_alert_name: "Your [concept_curie_physicist] could conduct Geomagnetic Research"
 alert_curie_geomagnetics_possible_alert_hint: "Ihr [concept_curie_physicist] könnte #b Geomagnetische Forschung#! betreiben. Dies umfasst Aktivitäten wie die Gründung des Magnetischen Vereins, den Beitritt zum Magnetischen Verein, die Einrichtung eines geomagnetischen Observatoriums oder die Erstellung eines geomagnetischen Atlas.\n\nGehen Sie im Reiter „Mathematik“ zum Physiker und öffnen Sie die Übersicht unter Mathematische Formeln/Wolkenatlas/Raketen/Kernphysik."
