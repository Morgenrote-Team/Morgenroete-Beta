 curie.13.t: "Outokumpu"
 curie.13.d: "With the help of Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] and state-of-the-art technologies, we were able to discover a previously unknown copper vein in Outokumpu. It may be the largest deposit in Northeastern Europe!"
 curie.13.f: "Nach der Entdeckung eines reichen Erzvorkommens im Jahr 1910 und dem Bau integrierter Industrieanlagen (Schmelzhütten und Raffinerien) stieg Outokumpu in den 1930er Jahren zu einem der fünf größten Kupferproduzenten Europas auf und legte den Grundstein für die moderne finnische Metallindustrie."
 curie.13.g: "Outokumpu wird ein Zentrum der Kupferproduktion werden!"
 je_curie_meteorological_observation: "Meteorologische Beobachtung"
 je_curie_meteorological_observation_reason: "[ROOT.GetCountry.GetCustom('je_curie_meteorological_observation_active_type')]During a [Concept('concept_curie_meteorology','$je_curie_meteorological_observation|q$')] a [concept_curie_meteorological_physicist] devotes himself entirely to his meteorological studies. These consist of observing weather and temperature, studying and describing clouds, and keeping climate records.\n\nMeteorological observations have a direct impact on the collected data. A meteorologist's experience is crucial in this regard. A well-equipped weather station earns extra points.\nA meteorologist may collect #R 1#! to #G 10#! @curie_physical_data!#! [concept_curie_physical_data] per year.\n\n$mr_divider_for_je$\nOur meteorologist is expected to collect [GetPlayer.MakeScope.ScriptValue('curie_meteorological_observation_yearly_physical_data_value')|+=0] @curie_physical_data!#! [concept_curie_physical_data]."
