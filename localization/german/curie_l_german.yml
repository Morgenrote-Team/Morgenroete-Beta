 je_curie_improve_meteorology_project: "Wetterstationsnetzwerk"
 je_curie_improve_meteorology_project_reason: "Ihr [concept_curie_physicist] Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] konzentriert sich darauf, eine Wetterstation für das [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] in [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName] zu bauen.\n$mr_divider_for_je$\nDas Projekt wird monatlich Fortschritte erzielen. Sobald der Fortschritt 24 erreicht, erhält das aktuelle Gebäude einen neuen Modifikator. Sobald alle für dieses Projekt ausgewählten Gebäude die Modifikatoren erhalten haben, ist das Projekt abgeschlossen.\nEs gibt insgesamt 3 Modifikatoren. Jeder neue Modifikator benötigt den Fortschrittsbalken erneut.\n$mr_divider_for_je$\nAktuelles Gebäude: [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] in [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_meteorology_project_modifier_1_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_meteorology_project_modifier_2_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_meteorology_project_modifier_3_type')]\n\nAnzahl der verbleibenden Gebäude (ohne das aktuelle): [JournalEntry.MakeScope.Var('mr_number_of_remaining_list_entries_var').GetValue|V0]!#!"
