 curie.521.d: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] traut [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis]en Augen nicht: Während eines Spaziergangs in [SCOPE.sState('curie_cloud_state').GetCityHubName] entdeckt [ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe] plötzlich silberne Fäden am Himmel. Könnte es sich um eine bisher unbekannte Wolkenart handeln?"
 curie.522.d: "Während der Polarexpedition machte die Zeppelin-Besatzung eine außergewöhnliche Entdeckung: Plötzlich erschienen regenbogenfarbene Wolken am Himmel! Es sah aus, als würden Perlmuttkörner am Himmel hängen!"
