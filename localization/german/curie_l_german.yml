 curie_has_active_mathematical_physicist_trigger_tt: "#default_text Hat einen [concept_curie_mathematical_physicist], der nicht beschäftigt ist.#!"
 curie_has_active_meteorological_physicist_trigger_tt: "#default_text Hat einen [Concept('concept_curie_meteorological_physicist','$concept_curie_meteorological_physicists|q$')], der nicht beschäftigt ist.#!"
