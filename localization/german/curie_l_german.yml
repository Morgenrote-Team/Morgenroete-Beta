 je_curie_mathematical_innovation: "Mathematische Innovation"
 je_curie_mathematical_innovation_reason: "[ROOT.GetCountry.GetCustom('je_curie_mathematical_innovation_active_type')]Ein [concept_curie_mathematical_physicist], der keiner Beschäftigung nachgeht, trägt zur mathematischen Innovation eines Landes bei. Mathematische Innovation bezeichnet die Summe aus internationaler und nationaler mathematischer Innovation. Die internationale mathematische Innovation wird anhand der Gesamtzahl der entdeckten mathematischen Formeln berechnet. Die nationale mathematische Innovation basiert auf allen Formeln, die ein Land selbst entdeckt hat.\n\nMathematische Innovation erhöht die maximale Innovationskapazität und verringert die Strafe für die Erforschung zukunftsweisender Technologien. Wird eine neue Formel entdeckt, wird der Modifikator am Jahresende angepasst, um die mathematische Innovation zu steigern."
