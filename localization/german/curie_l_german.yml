 curie_mathematics_tech: "Mathematik"
 curie_mathematics_tech_desc: "Die Mathematik ist die Wissenschaft von Zahlen, Größen und Formen. Sie bildet die logische Grundlage für fortgeschrittene Ingenieurwissenschaften, Navigation, Physik und komplexes Ressourcenmanagement im Zuge des Fortschritts."
 je_group_curie_physics: "Morgenröte: [concept_curie_physics]"
 je_curie_formula_discovery: "Mathematische Formeln"
 je_curie_formula_discovery_reason: "[ROOT.Var('curie_physicist_var').GetCharacter.GetFullName] versucht, eine neue mathematische Formel zu entwickeln. Bestimmte Charaktereigenschaften und Fähigkeiten können die Forschung beschleunigen. Unser Physiker arbeitet derzeit an [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]."
 je_physicist_dies_tt: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] starb"
 je_curie_formula_discovery_failed_tt: "Eine andere Nation entdeckt die Formel vor Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName]."
 curie_add_discovered_formula_effect_tt: "[GetPlayer.GetName] formulates #V [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]#!."
 je_curie_formula_discovery_progress_complete_tt: "Der Fortschritt erreichte #V 60#!."
 curie.201.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]"
 curie.201.d: "Ist es wirklich wahr – oder nur einer dieser seltsamen Träume, die Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetFullName] durch den Kopf gingen und [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHim] die fertige Formel offenbarten? Nach nervenaufreibenden Nächten kann [ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe] stolz auf [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis]e Arbeit verweisen. [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis|U]e Forschung auf dem Gebiet von [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')] ist abgeschlossen."
 curie.201.f: "„Es ist immer wieder erstaunlich, dass alle, die sich ernsthaft mit dieser Wissenschaft beschäftigen, eine Art Leidenschaft dafür entwickeln.“ – Carl Friedrich Gauß"
 curie.201.g: "Wer reinigt jetzt die Tafel?"
 curie.202.t: "Mathematische Formeln"
 curie.202.d: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetFullName] hat sich zum Ziel gesetzt, ein neues Gebiet der Mathematik zu entdecken. [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis|U]e Forschung konzentriert sich auf [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]."
 curie.202.f: "Ab dem 19. Jahrhundert wurden die Grundlagen mathematischer Konzepte eingehend geprüft und gefestigt. Augustin-Louis Cauchy etablierte die ε-Definition des Grenzwerts und legte die Grundlagen der Funktionentheorie. Die enge Verbindung zwischen der Entwicklung der Physik und Mechanik und der Infinitesimalrechnung des 18. Jahrhunderts blieb bestehen, und viele Mathematiker waren zugleich theoretische Physiker – eine Unterscheidung, die damals noch nicht getroffen wurde."
 curie.202.g: "Hoffentlich kommt dabei etwas Nützliches heraus...?"
 curie.203.t: "Foreign Nation formulates [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')]"
 curie.203.d: "Durch einen Briefwechsel erfuhr Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetFullName] heute, dass ein ausländischer Kollege [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHim] in [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis]er Forschung zu [SCOPE.GetRootScope.GetCountry.GetCustom('curie_searched_formula_name')] zuvorgekommen ist! Der Konkurrent hat die Formel bereits hergeleitet."
 curie.203.f: "„Nichts offenbart einen Mangel an mathematischer Bildung deutlicher als übertriebene Genauigkeit in der Arithmetik.“ – Wilhelm Weber"
