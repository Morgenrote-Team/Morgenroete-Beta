 curie.301.t: "Eine reformierte Fakultät für Mathematik und Ingenieurwesen"
 curie.301.d: "Dr. [SCOPE.sCharacter('curie_physicist_scope').GetLastName] hat [SCOPE.sCharacter('curie_physicist_scope').GetHerHis] Ziel erreicht. Durch einen Besuch der Fakultät für Mathematik und Ingenieurwesen hat [SCOPE.sCharacter('curie_physicist_scope').GetSheHe] neue Forschungsmethoden eingeführt und die nächste Generation von Forschern mit den neuesten Entwicklungen in der Mathematik vertraut gemacht.\n\nGesamtanzahl verbesserter Gebäude: [GetPlayer.MakeScope.Var('mr_num_improved_mathematics_buildings_var').GetValue|V0]\n$concept_curie_physical_data$ aus Projekt: [GetPlayer.MakeScope.ScriptValue('curie_physical_data_from_mathematics_project_for_event_value')|+0] @curie_physical_data!"
 curie.301.f: "„Ich habe gerade ein Seminar über Boolesche Algebra 101 beendet und niemand hat den Witz verstanden! Was für ein Haufen Kulturbanausen!“"
 curie.301.g: "Ein Hauch frischer Luft weht durch die Welt der Wissenschaft!"
 je_curie_physics_experiment: "Physikexperiment"
 je_curie_physics_experiment_reason: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] arbeitet an einem Physikexperiment. Ob es gelingt oder scheitert, hängt maßgeblich von [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis]en persönlichen [concept_character_trait]en ab. Gelingt es, handelt es sich entweder um ein Routineexperiment oder um ein Experiment von historischer Bedeutung. Letzteres ist möglich, wenn noch nie zuvor ein Wissenschaftler dieses Experiment durchgeführt hat und die richtigen Bedingungen erfüllt sind – was in der Regel eine spezielle Technologie erfordert. Jeder Physiker führt in seinem Leben nur ein einziges historisches Experiment durch."
 je_curie_physics_experiment_complete: "Der Fortschritt erreichte #G 40#!."
 je_curie_physics_experiment_fail: "Der Fortschritt erreichte #R -40#!."
 je_curie_physics_special_experiment_success: "Löst das Ereignis aus: #V Ein Experiment von historischer Bedeutung#!"
 je_curie_physics_generic_experiment_success: "Löst das Ereignis aus: #V Ein erfolgreiches Experiment#!"
 curie_add_discovered_experiment_effect_tt: "[GetPlayer.GetAltName('NOM')] führt das #V [SCOPE.sCharacter('curie_physicist_scope').GetLastName]-Experiment#! durch."
 curie_physics_experiment_failure_modifier: "Physikexperiment: Fehlgeschlagen"
 curie_physics_experiment_successful_modifier: "Physikexperiment: Erfolgreich!"
 curie.401.t: "Physikexperiment"
 curie.401.d: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] leitet eine neue Phase [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis]es Experiments ein. Es ist noch unklar, ob [ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe] einen vorsichtigen oder einen revolutionären Ansatz verfolgt."
 curie.401.f: "Während eines Physikexperiments versucht ein Physiker nach einer gewissen Zeit, es so schnell wie möglich abzuschließen. Ob dies immer gelingt, ist eine ganz andere Frage. Insbesondere Physiker mit den Charaktereigenschaften #G $cautious$#! oder #G $meticulous$#! haben gute Chancen auf einen erfolgreichen Verlauf ihres Experiments. Physiker mit den Eigenschaften #R $wrathful$#!, #R $reckless$#! oder #R $senile$#! laufen hingegen Gefahr, dass ihre Forschung in einer Katastrophe endet."
 curie.401.g: "Vorsichtige Vorgehensweise."
 curie.401.h: "Revolutionärer Ansatz."
 curie.402.t: "Ein Experiment von historischer Bedeutung"
 curie.402.d_1: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] leitete Licht durch zwei schmale Spalte auf einen Schirm. Das entstehende Interferenzmuster aus hellen und dunklen Streifen bewies, dass sich Licht wie eine Welle verhält und widerlegte damit erfolgreich Isaac Newtons Theorie der dominanten Teilchen."
 curie.402.d_2: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] richtete einen stromdurchflossenen Draht über einem Magnetkompass aus. Die Ablenkung der Nadel bewies, dass Elektrizität ein Magnetfeld erzeugt und begründete damit das einheitliche Feld des Elektromagnetismus."
 curie.402.d_3: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] nutzten fallende Gewichte, um Schaufelräder in isoliertem Wasser in Rotation zu versetzen. Der daraus resultierende Temperaturanstieg zeigte, dass mechanische Arbeit direkt in Wärme umgewandelt wird, womit der Energieerhaltungssatz bewiesen wurde."
 curie.402.d_4: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] testete die Doppler-Theorie mithilfe von Trompetern in einem fahrenden Zug. Die beobachtete Tonhöhenänderung beim Vorbeifahren des Zuges bestätigte den Doppler-Effekt und bewies, dass Bewegung die akustische Frequenz verändert."
 curie.402.d_5: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] hängte ein schweres Pendel an einem langen Draht auf. Die allmähliche Drehung seiner Schwingebene relativ zum Boden lieferte einen direkten visuellen Beweis für die Erdrotation, ohne dass Himmelsbeobachtungen nötig waren."
 curie.402.d_6: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] reflektierte Licht mithilfe eines rotierenden Zahnrads auf einen entfernten Spiegel. Durch Blockieren des zurückkehrenden Lichts bei bekannten Rotationsgeschwindigkeiten gelang die erste terrestrische Messung der Lichtgeschwindigkeit."
 curie.402.d_7: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] maß die elektrische Ladung mithilfe einer Leidener Flasche und eines Galvanometers. Das Verhältnis zwischen elektrostatischer und elektromagnetischer Ladung ergab die Lichtgeschwindigkeit und bewies damit den elektromagnetischen Charakter des Lichts."
 curie.402.d_8: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] Mithilfe eines hochempfindlichen Interferometers spaltete man Licht in senkrechte Strahlen auf. Das Ausbleiben der erwarteten Verschiebungen der Interferenzstreifen widerlegte die Theorie des Lichtäthers und ebnete so den Weg für die Spezielle Relativitätstheorie."
 curie.402.d_9: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] nutzte Funkenstreckenschaltungen, um unsichtbare Radiowellen zu erzeugen und zu detektieren. Der Nachweis, dass diese die gleiche Ausbreitungsgeschwindigkeit und die gleichen Welleneigenschaften wie Licht aufweisen, bestätigte Maxwells elektromagnetische Theorie und legte den Grundstein für die drahtlose Kommunikation."
 curie.402.d_10: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] lenkte Kathodenstrahlen mithilfe elektrischer und magnetischer Felder in einer Vakuumröhre ab. Die Messung ihres Ladungs-Masse-Verhältnisses offenbarte negative subatomare Teilchen – Elektronen – und widerlegte damit die Vorstellung, dass Atome unteilbar seien."
 curie.402.d_11: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] Elektrisch geladene Öltröpfchen wurden zwischen zwei Metallplatten suspendiert. Durch den Ausgleich von Schwerkraft und elektrischer Kraft konnte bewiesen werden, dass die Ladung in festen Einheiten gequantelt ist, wodurch die Ladung des Elektrons präzise bestimmt wurde."
 curie.402.d_12: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] beschoss dünne Goldfolie mit Alphateilchen. Unerwartete Weitwinkelablenkungen bewiesen, dass die atomare Masse und die positive Ladung in einem winzigen zentralen Atomkern konzentriert sind und somit das Modell des homogenen Atoms ersetzen."
 curie.402.d_13: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] leitete beschleunigte Elektronen durch Quecksilberdampf. Periodische Stromabfälle bei bestimmten Spannungen bewiesen, dass Atome Energie in diskreten Quanten absorbieren, was Bohrs Modell quantisierter Energieniveaus bestätigte."
 curie.402.d_14: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] fotografierte Sterne in der Nähe der Sonne während einer totalen Sonnenfinsternis. Die beobachtete Gravitationsablenkung des Sternenlichts lieferte den ersten empirischen Beweis für die Allgemeine Relativitätstheorie."
 curie.402.d_15: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] lenkte Silberatome durch ein ungleichmäßiges Magnetfeld. Der Strahl spaltete sich in zwei getrennte Pfade auf, anstatt ein Kontinuum zu bilden. Dies bewies die Raumquantisierung und entdeckte den intrinsischen Quantenspin."
 curie.402.f_1: "Im Jahr 1801 führte Thomas Young das Doppelspaltexperiment durch, um die physikalischen Eigenschaften des Lichts zu ergründen. Er richtete einen einzelnen Lichtstrahl durch zwei eng beieinander liegende, schmale Spalte auf einen dunklen Schirm. Anstatt zwei getrennte Lichtlinien zu erzeugen, überlagerten sich die austretenden Lichtwellen und bildeten ein Muster aus abwechselnd hellen und dunklen Streifen auf der Oberfläche. Dieses Interferenzmuster bewies, dass sich Lichtstrahlen verstärken oder auslöschen können und sich dabei wie Wellen auf dem Wasser verhalten. Das Ergebnis lieferte den schlüssigen Beweis für die Wellentheorie des Lichts und stellte Isaac Newtons etabliertes Teilchenmodell direkt in Frage."
 curie.402.f_2: "Im Jahr 1820 entdeckte der dänische Physiker Hans Christian Ørsted den fundamentalen Zusammenhang zwischen Elektrizität und Magnetismus. Während einer Vorlesungsdemonstration leitete er einen elektrischen Strom von einer Batterie durch einen geraden Draht, der sich direkt über einer Kompassnadel befand. Jedes Mal, wenn der Stromkreis geschlossen wurde, schlug die Kompassnadel senkrecht zum Draht aus, anstatt nach Norden zu zeigen. Wurde die Stromrichtung umgekehrt, drehte sich die Nadel in die entgegengesetzte Richtung. Dieses unerwartete Ergebnis bewies, dass elektrische Ströme Magnetfelder erzeugen und vereinte damit zwei zuvor getrennte Bereiche der Physik zum grundlegenden Gebiet des Elektromagnetismus."
 curie.402.f_3: "1843 maß James Prescott Joule die Umwandlung von mechanischer Arbeit in Wärmeenergie mithilfe eines speziellen Schaufelradapparats. Fallende Gewichte versetzten ein in Wasser eingetauchtes Messingschaufelrad in Rotation. Die Schwerkraft verrichtete messbare mechanische Arbeit am System, während die Reibung zwischen den Schaufeln und der Flüssigkeit einen präzisen Temperaturanstieg im Wasser verursachte. Durch den Vergleich der von den Gewichten abgegebenen potenziellen Energie mit der von der Flüssigkeit aufgenommenen Wärme berechnete Joule ein konstantes Umwandlungsverhältnis. Das Experiment bewies, dass Wärme eine Energieform ist und begründete damit den Energieerhaltungssatz."
 curie.402.f_4: "Im Jahr 1845 führte der niederländische Meteorologe Christoph Buys Ballot ein Experiment durch, um Christian Dopplers Theorie von 1842 über die Tonhöhenverschiebung von Schallwellen zu überprüfen. Er platzierte Trompeter in einem offenen Eisenbahnwaggon, während Musiker am Boden einen konstanten Referenzton spielten. Während die Lokomotive mit unterschiedlichen Geschwindigkeiten vorbeifuhr, spielten die Trompeter einen durchgehenden Ton. Zuhörer auf dem Bahnsteig konnten deutlich hören, wie die Tonhöhe anstieg, als sich der Zug näherte, und abfiel, als er sich entfernte. Der Versuch bestätigte empirisch den Doppler-Effekt für Schallwellen, der später in der Astronomie zur Messung von Sternbewegungen von entscheidender Bedeutung wurde."
 curie.402.f_5: "1851 demonstrierte der französische Physiker Léon Foucault die Erdrotation mithilfe eines massiven Pendels im Pariser Panthéon. Er hängte eine 28 Kilogramm schwere Messingkugel an einen 67 Meter langen Stahldraht und ließ sie stundenlang frei in jeder vertikalen Ebene schwingen. Während das Pendel hin und her schwang, drehte sich seine Schwingungsebene stetig im Uhrzeigersinn relativ zum Boden. Da keine seitlichen Kräfte auf den Draht wirkten, drehte sich der Boden darunter, während die Schwingungsebene im Raum fixiert blieb. Dies lieferte den ersten einfachen, irdischen Beweis für die Erdrotation um ihre Achse."
 curie.402.f_6: "1849 gelang Hippolyte Fizeau die erste erfolgreiche Messung der Lichtgeschwindigkeit auf der Erde. Er richtete einen intensiven Lichtstrahl zwischen den Zähnen eines schnell rotierenden Zahnrads auf einen 8,6 Kilometer entfernten Spiegel. Das reflektierte Licht kehrte auf demselben Weg zurück. Indem er die Drehzahl des Zahnrads erhöhte, bis ein zurückkehrender Lichtimpuls vom benachbarten Zahn vollständig blockiert wurde, bestimmte Fizeau die genaue Laufzeit über die bekannte Entfernung. Seine berechnete Geschwindigkeit von etwa 315.000 Kilometern pro Sekunde bewies, dass die Lichtgeschwindigkeit auf der Erde auch ohne astronomische Daten präzise gemessen werden kann."
 curie.402.f_7: "1856 maßen Wilhelm Weber und Rudolf Kohlrausch das Verhältnis zwischen elektrostatischer und elektromagnetischer elektrischer Ladung. Mithilfe einer Leidener Flasche mit hoher Kapazität bestimmten sie die absolute Menge der angesammelten statischen Ladung. Anschließend entluden sie die Flasche durch ein ballistisches Galvanometer, um die durch den fließenden Strom erzeugte magnetische Kraft zu messen. Überraschenderweise entsprach das Verhältnis von elektrostatischer zu elektromagnetischer Kraft einer Geschwindigkeit von etwa 310.000 Kilometern pro Sekunde. Diese Konstante, nahezu identisch mit der Lichtgeschwindigkeit, legte den empirischen Grundstein für James Clerk Maxwells Theorie, dass Licht eine elektromagnetische Welle ist."
 curie.402.f_8: "1887 versuchten Albert Michelson und Edward Morley, die Bewegung der Erde mithilfe des hypothetischen Lichtäthers nachzuweisen. Sie bauten ein empfindliches optisches Interferometer, das auf einer schweren Steinplatte montiert war, die in Quecksilber schwamm, um Schwingungen zu isolieren. Ein Strahlteiler teilte das Licht in zwei senkrecht zueinander stehende Strahlen, die an Spiegeln reflektiert und anschließend auf einem Schirm wieder vereint wurden. Existierte der Äther, so hätte die Umlaufgeschwindigkeit der Erde eine Differenz der Lichtgeschwindigkeit entlang der beiden Strahlen und damit eine Verschiebung der Interferenzstreifen bei Rotation zur Folge gehabt. Da keine Verschiebung beobachtet wurde, bewies dies die Konstanz der Lichtgeschwindigkeit und widerlegte die Existenz eines stationären Äthers."
 curie.402.f_9: "1887 baute Heinrich Hertz einen Funkenstreckensender, um James Clerk Maxwells Theorie des Elektromagnetismus zu überprüfen. Hochspannungsfunken, die über eine primäre Funkenstrecke erzeugt wurden, erzeugten unsichtbare elektromagnetische Strahlung, die sich durch den Raum ausbreitete und in einem sekundären Drahtringempfänger winzige Funken auslöste. Hertz wies nach, dass sich diese Wellen mit Lichtgeschwindigkeit ausbreiteten und Reflexion, Brechung und Polarisation wie Lichtwellen zeigten. Das Experiment bewies endgültig die Existenz von Radiowellen, bestätigte Maxwells einheitliche elektromagnetische Feldtheorie und legte den Grundstein für die moderne drahtlose Telekommunikation."
 curie.402.f_10: "1897 untersuchte J. J. Thomson Kathodenstrahlen in einem hochevakuierten Glasrohr. Durch Anlegen elektrischer und magnetischer Felder an den Strahl beobachtete er dessen Ablenkung und maß das Ladungs-Masse-Verhältnis der bewegten Teilchen. Thomson entdeckte, dass die Strahlen aus negativ geladenen Teilchen bestanden, die unabhängig vom verwendeten Kathodenmaterial mehr als 1000-mal leichter als ein Wasserstoffatom waren. Dies bewies, dass Atome keine unteilbaren Kugeln, sondern zusammengesetzte Strukturen sind, und enthüllte das Elektron als erstes identifiziertes subatomares Teilchen, was die Atomphysik grundlegend veränderte."
 curie.402.f_11: "1909 maß Robert A. Millikan die Ladung eines einzelnen Elektrons in einer geschlossenen Kammer mit elektrischen Platten. Er sprühte feine Öltröpfchen in die Kammer und ionisierte sie mit Röntgenstrahlen. Durch Anpassen der elektrischen Feldspannung hielt Millikan die elektrostatische Aufwärtskraft und die Schwerkraft im Gleichgewicht und fixierte so die einzelnen geladenen Tröpfchen in der Luft. Die Analyse hunderter Tröpfchen ergab, dass jede elektrische Ladung ein ganzzahliges Vielfaches einer Elementarladung war. Das Experiment bewies die Ladungsquantisierung und bestimmte den exakten Wert der Elementarladung."
 curie.402.f_12: "1911 richtete Ernest Rutherford einen Strahl positiv geladener Alphateilchen auf eine dünne Goldfolie, die von einem Zinksulfid-Detektorschirm umgeben war. Während die meisten Teilchen ungehindert hindurchgingen, wurde ein kleiner Teil unter großen Winkeln abgelenkt, und etwa eines von 8.000 prallte direkt zurück. Dieses überraschende Ergebnis widerlegte Thomsons „Rosinenkuchenmodell“ der gleichmäßigen Ladungsverteilung. Rutherford schloss daraus, dass nahezu die gesamte Masse und die positive Ladung eines Atoms in einem winzigen, dichten Kern – dem Atomkern – konzentriert sind, der von größtenteils leerem Raum umgeben ist, der mit Elektronen gefüllt ist, die den Kern umkreisen."
 curie.402.f_13: "1914 lieferten James Franck und Gustav Hertz den direkten Beweis für Niels Bohrs Quantenmodell des Atoms. Sie beschleunigten Elektronen durch ein mit Quecksilberdampf gefülltes Glasrohr auf ein Empfangsgitter zu. Mit steigender Beschleunigungsspannung nahm der Elektronenstrom zu, fiel aber in regelmäßigen Abständen von 4,9 Volt abrupt ab. Dies zeigte, dass Elektronen bei Kollisionen mit Quecksilberatomen nur in diskreten Energiepaketen Energie verloren. Die periodischen Abfälle bestätigten, dass Atome Energie in festen Quantenschritten absorbieren und lieferten damit den ersten eindeutigen Beweis für quantisierte atomare Energieniveaus."
 curie.402.f_14: "Während der totalen Sonnenfinsternis im Mai 1919 leitete Arthur Eddington Expeditionen nach Príncipe und Brasilien, um Albert Einsteins Allgemeine Relativitätstheorie zu überprüfen. Da der Mond das Sonnenlicht verdeckte, fotografierten Astronomen Sternhaufen in der Nähe des Sonnenrandes. Der Vergleich dieser Bilder mit Referenzaufnahmen, die nachts gemacht wurden, zeigte, dass sich das Sternenlicht beim Vorbeiflug an der Gravitationskraft der Sonne leicht nach außen verschob. Die gemessene Lichtablenkung entsprach eher Einsteins mathematischen Vorhersagen als der Newtonschen Physik und lieferte damit die erste empirische Bestätigung der Allgemeinen Relativitätstheorie."
 curie.402.f_15: "1922 schickten Otto Stern und Walther Gerlach einen Strahl verdampfter Silberatome durch ein inhomogenes Magnetfeld auf eine Glasdetektorplatte. Die klassische Physik sagte voraus, dass sich die magnetischen Dipole der Atome zufällig ausrichten und so eine gleichmäßige, kontinuierliche Silberablagerung erzeugen würden. Stattdessen spaltete sich der Atomstrahl sauber in zwei getrennte Komponenten auf und bildete zwei getrennte Linien auf der Platte. Diese unerwartete Aufspaltung demonstrierte die räumliche Quantisierung und lieferte frühe Hinweise auf den intrinsischen Drehimpuls, der später als Elektronenspin identifiziert wurde und die Quantenmechanik grundlegend veränderte."
 curie.402.g: "Eureka!"
 curie.403.t: "Ein erfolgreiches Experiment"
 curie.403.d: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] gab heute mit großer Zufriedenheit bekannt, dass [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis] Experiment exakt nach Plan verlaufen ist. Auch wenn es keine bahnbrechende Entdeckung ist, hat sie den Wissensstand in der internationalen Physik dennoch erheblich erweitert."
 curie.403.f: "„Nichts ist zu wunderbar, um wahr zu sein, solange es mit den Naturgesetzen übereinstimmt.“ – Michael Faraday"
 curie.403.g: "Gut."
 curie.404.t: "Physikexperiment fehlgeschlagen!"
 curie.404.d: "Das Experiment von Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] endete in einem Desaster. Jetzt gilt es, die Scherben aufzuräumen."
 curie.404.f: "„Völlig bewusste Ignoranz ist die Vorstufe zu jedem wirklichen Fortschritt in der Wissenschaft.“ – James Clerk Maxwell"
 curie.404.g: "Boom!"
