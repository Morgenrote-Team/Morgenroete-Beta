 curie.13.t: "Outokumpu"
 curie.13.d: "Mithilfe von Dr. [ROOT.Var('agassiz_geologist_var').GetCharacter.GetLastName] und modernster Technologien konnten wir in Outokumpu eine bisher unbekannte Kupferader entdecken. Es könnte sich um das größte Vorkommen in Nordosteuropa handeln!"
 curie.13.f: "Nach der Entdeckung eines reichen Erzvorkommens im Jahr 1910 und dem Bau integrierter Industrieanlagen (Schmelzhütten und Raffinerien) stieg Outokumpu in den 1930er Jahren zu einem der fünf größten Kupferproduzenten Europas auf und legte den Grundstein für die moderne finnische Metallindustrie."
 curie.13.g: "Outokumpu wird ein Zentrum der Kupferproduktion werden!"
 je_curie_meteorological_observation: "Meteorologische Beobachtung"
 je_curie_meteorological_observation_reason: "[ROOT.GetCountry.GetCustom('je_curie_meteorological_observation_active_type')]Während einer [Concept('concept_curie_meteorology','$je_curie_meteorological_observation|q$')] widmet sich ein [concept_curie_meteorological_physicist] ausschließlich seinen meteorologischen Studien. Diese umfassen die Beobachtung von Wetter und Temperatur, die Untersuchung und Beschreibung von Wolken sowie die Führung von Klimaaufzeichnungen.\n\nMeteorologische Beobachtungen haben einen direkten Einfluss auf die gesammelten Daten. Die Erfahrung eines Meteorologen ist in dieser Hinsicht entscheidend. Eine gut ausgestattete Wetterstation bringt zusätzliche Punkte.\nEin Meteorologe kann #R 1#! bis #G 10#! @curie_physical_data!#! [concept_curie_physical_data] pro Jahr sammeln.\n\n$mr_divider_for_je$\nUnser Meteorologe soll [GetPlayer.MakeScope.ScriptValue('curie_meteorological_observation_yearly_physical_data_value')|+=0] @curie_physical_data!#! [concept_curie_physical_data] sammeln."
