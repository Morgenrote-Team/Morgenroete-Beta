 curie.503.t: "Ein nationales Netzwerk von Wetterstationen"
 curie.503.d: "Dr. [SCOPE.sCharacter('curie_physicist_scope').GetLastName] hat [SCOPE.sCharacter('curie_physicist_scope').GetHerHis] Ziel erreicht. Dank des landesweiten Netzes von Wetterstationen sind Vorkehrungen getroffen, um auf meteorologische Ereignisse zu reagieren, sei es im Katastrophenschutz oder in der Landwirtschaft.\n\nGesamtzahl verbesserter Gebäude: [GetPlayer.MakeScope.Var('mr_num_improved_meteorology_buildings_var').GetValue|V0]"
 curie.503.f: "\"Sieben sonnige Junitage, doch lang genug,\num die Blumen auf dem Sommerkleid, das du im Frühling trugst, erblühen zu lassen.\"\n\"Wie wir gemeinsam lachten und dann die Bombe platzen ließest:\nDass ich dich schon zu lange kenne, als dass zwischen uns etwas laufen könnte.\""
 curie.503.g: "Wird morgen die Sonne scheinen?"
