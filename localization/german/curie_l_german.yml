 curie.21.t: "Masse-Energie-Äquivalenz"
 curie.21.d: "[SCOPE.sCharacter('curie_physicist_scope').GetFullName] entdeckte mithilfe einer einfachen Gleichung ein Naturgesetz. Es besagt, dass die Masse m und die Ruheenergie E eines Objekts zueinander proportional sind. Die Formel lautet:\nE=mc²"
 curie.21.f: "Die von Albert Einstein im Jahr 1905 während seines Wunderjahres veröffentlichte Masse-Energie-Äquivalenz (E=mc²) entstand aus seiner speziellen Relativitätstheorie. Aufbauend auf den Entwicklungen des 19. Jahrhunderts in der Elektrodynamik und den Erhaltungssätzen demonstrierte Einstein, dass Masse und Energie austauschbare Aspekte derselben physikalischen Realität sind und revolutionierte damit die moderne Physik."
 curie.21.g: "[SCOPE.sCharacter('curie_physicist_scope').GetSheHe|U] ist ein Genie!"
 curie.22.t: "Ein Essay über die Winde und Strömungen des Ozeans"
 curie.22.d: "In einem Aufsatz legte [SCOPE.sCharacter('curie_physicist_scope').GetFullName] die erste plausible Erklärung für die Windzirkulation in den mittleren Breiten der Erde vor. Die Arbeit entwickelt sich bereits zu einem Standardwerk in der Meteorologie!"
 curie.22.f: "Die 1856 von dem amerikanischen Meteorologen William Ferrel veröffentlichte Abhandlung „An Essay on the Winds and the Currents of the Ocean“ legte die Grundlagen für die geophysikalische Fluiddynamik. Aufbauend auf Hadleys Zirkulationsmodell demonstrierte Ferrel mathematisch, wie die Erdrotation bewegte Luft und Wasser ablenkt – und führte damit das später als Coriolis-Effekt bekannte Konzept ein. Seine Arbeit erklärte erfolgreich die globalen Windgürtel und die atmosphärischen Zirkulationsmuster der mittleren Breiten und revolutionierte Meteorologie und Ozeanographie."
 curie.22.g: "Die Winde sind also kein bloßer Zufall?"
 je_curie_decision_problem: "Das Entscheidungsproblem"
 je_curie_decision_problem_reason: "1928 stellte der deutsche Mathematiker David Hilbert die Frage: Gibt es ein mechanisches Verfahren, das für jede mathematische Aussage feststellen kann, ob sie beweisbar ist? Leibniz hatte bereits davon geträumt, eine Maschine zu bauen, die Symbole manipulieren könnte, um die Wahrheitswerte mathematischer Aussagen zu bestimmen. Er erkannte, dass der erste Schritt eine klare, formale Sprache sein müsste, und ein Großteil seiner späteren Arbeit war diesem Ziel gewidmet. Noch 1930 glaubte Hilbert, dass es kein unlösbares Problem geben würde."
 je_curie_decision_problem_progress_complete_tt: "Der Fortschritt hat #V 100#! erreicht!"
 je_curie_decision_problem_failed_tt: "Eine weitere Nation löste das Entscheidungsproblem noch vor Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName]."
 curie_physicist_decision_problem_progress_bar: "Lösung"
 curie_physicist_decision_problem_progress_bar_desc: "Lösungsfortschritt: #v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|1%]#! ([JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|0]/100)"
 curie.311.t: "Die [ROOT.Var('curie_physicist_var').GetCharacter.GetLastNameNoFormatting]-Maschine"
 curie.311.d: "Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] hat mithilfe eines ungewöhnlichen Gedankenexperiments eine Antwort auf das Entscheidungsproblem gegeben: Es ist kompliziert. Und unlösbar."
 curie.311.f: "Die Turingmaschine ist ein mathematisches Berechnungsmodell, das der britische Mathematiker Alan Turing 1936 im Rahmen seiner Arbeiten zu den Grundlagen der Mathematik und dem Entscheidungsproblem einführte. Sie besteht aus einem unendlich langen, in Zellen unterteilten Band, einem Lese-/Schreibkopf und einer Reihe vordefinierter Regeln, die festlegen, wie die Maschine liest, schreibt und sich auf dem Band bewegt. Durch die Manipulation von Symbolen gemäß diesen Anweisungen kann die Maschine jede algorithmisch mögliche Berechnung durchführen. Ihre Bedeutung liegt in der Etablierung der theoretischen Grundlagen des modernen Rechnens: Sie demonstrierte, dass eine einzige universelle Maschine jede andere Rechenmaschine simulieren kann und führte damit das Konzept des universellen Rechnens ein. Obwohl die Turingmaschine nie als physischer Computer konzipiert war, wurde sie zu einem fundamentalen Modell der Informatik und prägte die Entwicklung von Programmiersprachen, Algorithmen und der modernen Computerarchitektur."
 curie.311.g: "Ich habe ehrlich gesagt kein Wort verstanden, aber es scheint ziemlich revolutionär zu sein."
 curie_turing_machine_modifier: "Turingmaschine"
 curie.313.t: "Entscheidungsproblem in einem anderen Land gelöst"
 curie.313.d: "Als Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetFullName] heute eine mathematische Fachzeitschrift las, war [ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe] schockiert, als er entdeckte, dass ein anderer Mathematiker das Entscheidungsproblem gelöst hatte, über das [ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe] schon so lange nachgedacht hatte. [ROOT.Var('curie_physicist_var').GetCharacter.GetSheHe|U] ist über diese Entwicklung am Boden zerstört – denn die Lösung ähnelt [ROOT.Var('curie_physicist_var').GetCharacter.GetHerHis]er eigenen..."
 curie_radiosonde_modifier: "Radiosonde"
 curie_first_radiosonde_modifier: "Erste Radiosonde"
 curie_physicist_radiosonde_cost_modifier: "Radiosondenkosten"
 curie.531.t: "Die [GetPlayer.GetAdjectiveNoFormatting]e Radiosonde"
 curie.531.d: "Nach zahlreichen Fehlstarts hat Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] heute endlich die erste Radiosonde für [GetPlayer.GetAltName('AKK')] in die Stratosphäre geschickt! Das Gerät übermittelt einwandfreie Wetterdaten und liefert Erkenntnisse zur Wetterbeobachtung, die noch vor wenigen Jahrzehnten unvorstellbar gewesen wären."
 curie.531.f: "Die Radiosonde, ein leichtes Telemetrieinstrument, das von Wetterballons in die Höhe getragen wird, revolutionierte Ende der 1920er Jahre die Meteorologie der oberen Atmosphäre. Nach den Pionierarbeiten von Léon Teisserenc de Bort und Richard Assmann zur Atmosphärenprofilierung prägte der französische Meteorologe Robert Bureau den Begriff und startete am 7. Januar 1929 in Trappes das erste erfolgreiche Radiosondengerät. Zeitgleich entwickelte der sowjetische Meteorologe Pawel Moltschanow unabhängig ein ähnliches Gerät und absolvierte am 30. Januar 1930 in Pawlowsk einen wegweisenden Flug. Durch die Übertragung von Temperatur-, Druck- und Feuchtigkeitsdaten in Echtzeit per Funkwellen ersetzten Radiosonden die kostspieligen und zeitaufwendigen Bergungen von Messinstrumenten und ermöglichten die moderne synoptische Wettervorhersage."
 curie.531.g: "Das Unvorhersehbare wird vorhersehbar und das Unkontrollierbare kontrollierbar."
 je_curie_radiosonde: "Radiosonde"
 je_curie_radiosonde_reason: "Eine Radiosonde wird in der Meteorologie und Aerologie eingesetzt, um Parameter der Erdatmosphäre in Höhen zwischen etwa 20 km und 35 km (der Stratosphäre) zu messen. Sie wird von einem Wetterballon getragen und übermittelt Messwerte – wie Lufttemperatur, Temperaturgradient und Luftfeuchtigkeit – per Funk an die Bodenstation.\n\nRadiosonden verbessern die Genauigkeit von Wettervorhersagen erheblich. Würden wir zudem die weltweit erste Radiosonde in die Stratosphäre starten, wäre der Nutzen noch größer."
