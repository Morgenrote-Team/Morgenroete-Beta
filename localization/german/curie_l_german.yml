 curie.531.t: "The [GetPlayer.GetAdjectiveNoFormatting] Radiosonde"
 curie.531.d: "After numerous false starts, Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] finally launched the first radiosonde for [GetPlayer.GetName] into the stratosphere today! The device is sending back flawless weather data and providing insights into weather observation that would have been unimaginable just a few decades ago."
 curie.531.f: "Die Radiosonde, ein leichtes Telemetrieinstrument, das von Wetterballons in die Höhe getragen wird, revolutionierte Ende der 1920er Jahre die Meteorologie der oberen Atmosphäre. Nach den Pionierarbeiten von Léon Teisserenc de Bort und Richard Assmann zur Atmosphärenprofilierung prägte der französische Meteorologe Robert Bureau den Begriff und startete am 7. Januar 1929 in Trappes das erste erfolgreiche Radiosondengerät. Zeitgleich entwickelte der sowjetische Meteorologe Pawel Moltschanow unabhängig ein ähnliches Gerät und absolvierte am 30. Januar 1930 in Pawlowsk einen wegweisenden Flug. Durch die Übertragung von Temperatur-, Druck- und Feuchtigkeitsdaten in Echtzeit per Funkwellen ersetzten Radiosonden die kostspieligen und zeitaufwendigen Bergungen von Messinstrumenten und ermöglichten die moderne synoptische Wettervorhersage."
 curie.531.g: "Das Unvorhersehbare wird vorhersehbar und das Unkontrollierbare kontrollierbar."
 je_curie_radiosonde: "Radiosonde"
 je_curie_radiosonde_reason: "A radiosonde is used in meteorology and aerology to measure parameters of the Earth's atmosphere at altitudes ranging from about 20 km to 35 km (the stratosphere). It is carried by a weather balloon and transmits measurements—such as air temperature, its gradient, and humidity—to the ground station via radio.\n\nRadiosondes greatly improve the accuracy of weather forecasts. If we were also to launch the world's first radiosonde into the stratosphere, the bonus would be even greater."
