 je_curie_improve_mathematics_project: "Mathematik verbessern"
 je_curie_improve_mathematics_project_reason: "Ihr [concept_curie_physicist] Dr. [ROOT.Var('curie_physicist_var').GetCharacter.GetLastName] konzentriert sich auf die Verbesserung der Produktion des [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] in [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName].\n$mr_divider_for_je$\nDas Projekt erzielt monatlich Fortschritte. Sobald der Fortschritt 24 erreicht, erhält das aktuelle Gebäude einen neuen Modifikator. Sobald alle für dieses Projekt ausgewählten Gebäude die Modifikatoren besitzen, ist das Projekt abgeschlossen.\nEs gibt insgesamt 3 Modifikatoren. Jeder neue Modifikator benötigt erneut Fortschritt.\nSobald ein [GetBuildingType('building_university').GetName] alle Modifikatoren besitzt, erhalten Sie außerdem #p 1#! @curie_physical_data! [concept_curie_physical_data].\n$mr_divider_for_je$\nAktuelles Gebäude: [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetName] in [JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetState.GetName]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_mathematics_project_modifier_1_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_mathematics_project_modifier_2_type')]\n[JournalEntry.MakeScope.Var('mr_target_building_var').GetBuilding.GetCustom('je_curie_improve_mathematics_project_modifier_3_type')]\n\nGesamtzahl der verbleibenden Gebäude (ohne das aktuelle): [JournalEntry.MakeScope.Var('mr_number_of_remaining_list_entries_var').GetValue|V0]\n$concept_curie_physical_data$ aus Projekt: [JournalEntry.MakeScope.ScriptValue('curie_physical_data_from_mathematics_project_value')|+0] @curie_physical_data!#!#!"
