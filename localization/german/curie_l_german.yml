 curie.100.t: "Der Magnetische Verein"
 curie.100.d: "Dr. [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetLastName] hat heute das Geomagnetische Observatorium erstmals in Betrieb genommen. Es wird das Herzstück des neu gegründeten Magnetischen Vereins und ein Vorbild für ähnliche Stationen weltweit sein. Ein dreifaches Hoch auf die Wissenschaft!"
 curie.100.f: "Der Magnetische Verein war die erste internationale wissenschaftliche Vereinigung. Er wurde 1834 von Carl Friedrich Gauß und Wilhelm Weber in Göttingen gegründet. Er koordinierte weltweite, synchronisierte Messungen des Erdmagnetfelds über ein Netzwerk globaler Observatorien."
 curie.101.t: "Ein neues Mitglied des Magnetischen Vereins"
 curie.101.d: "[GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetFullName] ist heute dem Magnetischen Verein in [GetPlayer.GetCustom('curie_magnetic_association_city')] beigetreten. Die anderen Mitglieder haben [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetHerHim] herzlich willkommen geheißen."
 curie.101.f: "Durch seinen Beitritt konnte Dr. [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetLastName] auch das notwendige Wissen erlangen, um ein funktionsfähiges geomagnetisches Observatorium zu errichten. Der Vorsitzende übergab unserem Physiker die Pläne für eine solche Station sowie ein Magnetometer. Die gesamte Vereinigung drängte auf einen schnellen Baubeginn und die Übermittlung der ersten Daten an [GetPlayer.GetCustom('curie_magnetic_association_city')]."
 curie.101.g: "Wir sollten unverzüglich eine Messstation bauen."
 curie.102.t: "Geomagnetisches Observatorium fertiggestellt"
 curie.102.d: "Der Bau des geomagnetischen Observatoriums wurde heute abgeschlossen. Zahlreiche Daten wurden in den letzten Monaten gewonnen und an [GetPlayer.GetCustom('curie_magnetic_association_city')] übermittelt."
 curie.102.f: "Die gewonnenen Messdaten dienen nicht nur der wissenschaftlichen Erforschung des Erdmagnetfelds, sondern haben auch praktische Anwendung. Deklinationskarten wurden in der Vergangenheit verwendet und werden auch heute noch zur Navigation in Schifffahrt und Luftfahrt eingesetzt. Für die Suche nach Rohstoffen wie Erz- und Erdöllagerstätten sind geomagnetische Messdaten von großer Bedeutung."
 curie.102.g: "Für die Geomagnetik!"
 curie.103.t: "Internationale Sammlung magnetischer Daten"
 curie.103.d: "Nach jahrelangem Sammeln und Vergleichen geomagnetischer Daten aus aller Welt konnten die Forscher in [GetPlayer.GetCustom('curie_magnetic_association_city')] zu einem interessanten Ergebnis gelangen."
 curie.103.f: "Geophysik und Geomagnetismus haben viele praktische Anwendungen. Insbesondere der Bergbau profitierte von der Entdeckung potenzieller Lagerstätten. Große Unternehmen nutzten geophysikalische Erkenntnisse, um zuvor unbekannte Eisen-, Blei- und Erdölvorkommen zu lokalisieren. Mit den richtigen Technologien und der Kartierung des Erdmagnetfelds sollte es leicht sein, das aktuelle theoretische Wissen produktiv zu nutzen."
 curie.103.g: "Wir benötigen mehr wissenschaftliche Daten."
 curie.103.h: "Dies wird bei der Suche nach Eisenvorkommen hilfreich sein."
 curie.103.i: "Dies wird bei der Suche nach Bleivorkommen hilfreich sein."
 curie.103.j: "Dies wird bei der Suche nach Kupfervorkommen hilfreich sein."
 curie.103.k: "Dies wird bei der Suche nach Ölvorkommen hilfreich sein."
 curie.104.t: "Nautisches Interesse"
 curie.104.d: "[SCOPE.sCharacter('curie_admiral_scope').GetFullName] hat großes Interesse an der geomagnetischen Forschung von [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetFullName] gezeigt. Er führte ein erfolgreiches Experiment am derzeit im Bau befindlichen Geomagnetischen Observatorium durch."
 curie.104.f: "\"Was soll ich denn jetzt mit den Froschschenkeln anfangen? Ach, nichts Besonderes, absolut nichts...\""
 curie.104.g: "Das neue Wissen dürfte ihm nützlich sein."
 curie.104.h: "Dieses Wissen sollte allen zugutekommen."
 curie.105.t: "Eine Anomalie"
 curie.105.d: "Trotz erneuter Messungen stimmen die von Dr. [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetLastName] aufgezeichneten Werte für das Erdmagnetfeld kaum mit den Erwartungen überein. Die Ursache dafür konnte er bisher nicht finden."
 curie.105.f: "Es gibt verschiedene Gründe, warum das Erdmagnetfeld an einem Ort anders ist als anderswo. Solche Vorkommnisse führten oft zu der Annahme, dass sich an dem jeweiligen Ort ein großes Metallvorkommen befinden könnte, weshalb die geomagnetische Forschung für den Bergbau von großem Interesse war."
 curie.105.g: "Wir sollten die Daten direkt an [GetPlayer.GetCustom('curie_magnetic_association_city')] senden."
 curie.106.t: "Astronom konsultiert Geomagnetisches Observatorium"
 curie.106.d: "Dr. [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetFullName] und Dr. [GetPlayer.MakeScope.GetVariable('verrier_astronomer_var').GetCharacter.GetFullName] führten während der Führung durch das neu errichtete geomagnetische Observatorium anregende Gespräche. Dieser Austausch hat das wissenschaftliche Wissen von [GetPlayer.MakeScope.GetVariable('verrier_astronomer_var').GetCharacter.GetLastName] enorm erweitert."
 curie.106.f: "„Aha, DAS ist also der Grund, warum das Marmeladenbrot immer mit der Marmeladenseite nach unten auf den Boden fällt!“"
 curie.106.g: "Dies wird [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetHerHim] für [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetHerHis]er praktischen Forschung  helfen."
 curie.106.h: "Dies wird [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetHerHim] bei [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetHerHis]er theoretischen Forschung helfen."
 curie.107.t: "Magnetatlas"
 curie.107.d: "Dr. [GetPlayer.MakeScope.GetVariable('curie_physicist_var').GetCharacter.GetFullName] hat den ersten geomagnetischen Atlas der Erde veröffentlicht. Das Buch wird sich mit Sicherheit zu einem Standardwerk der Physik entwickeln!"
 curie.107.f: "Der Geomagnetische Atlas (offiziell meist als „Atlas des Erdmagnetismus“ bezeichnet) aus dem 19. Jahrhundert ist ein Pionierwerk der Geophysik und Kartographie. Er erschien 1840 in Leipzig und wurde von dem Mathematiker Carl Friedrich Gauß und dem Physiker Wilhelm Weber herausgegeben. Das Werk trug erstmals globale Messungen des Erdmagnetfelds auf mathematisch fundierter Basis zusammen und stellte sie in Karten dar. Der Atlas umfasst 18 detaillierte Karten und Diagramme der Erde und belegte, dass die Hauptursache des Erdmagnetfelds im Erdinneren liegt."
 curie.107.g: "Dieses Wissen sollte in einem theoretischen Kontext angewendet werden."
 curie.107.h: "Dieses Wissen sollte in die Praxis umgesetzt werden."
