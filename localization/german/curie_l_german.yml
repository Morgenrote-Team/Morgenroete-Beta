 je_curie_magnetic_observation: "Geomagnetisches Observatorium"
 je_curie_magnetic_observation_reason: "Carl Friedrich Gauß errichtete 1832 in Göttingen die erste geophysikalische Sternwarte und konstruierte dafür ein empfindliches Magnetometer. Er erkannte, dass weltweit verteilte Messungen gleichzeitig durchgeführt werden mussten, um die Ursachen der Schwankungen zu lokalisieren und das statische Feld genauer zu messen. Ab 1836 stellte der eigens dafür gegründete Magnetische Verein Daten bereit, die Gauß und Wilhelm Weber auswerteten. Ziel war es, die Schwankungen des Erdmagnetfelds mithilfe zahlreicher, weltweit verteilter Messstationen koordiniert zu erfassen. Bis zu 50 Sternwarten beteiligten sich an diesem Projekt, darunter 35 in Europa, sechs in Asien, zwei in Afrika, drei in Nordamerika und vier in Ozeanien. Die Ergebnisse wurden nach Göttingen übermittelt und von Gauß und Weber wissenschaftlich ausgewertet."
 je_curie_magnetic_observation_goal: "Sammle #G 100#! @curie_magnetic_data_var! [concept_curie_magnetic_data]. Dies ist eine internationale Initiative, zu der jedes Mitglied des Magnetischen Vereins beitragen wird."
 je_curie_magnetic_atlas: "Der geomagnetische Atlas"
 je_curie_magnetic_atlas_reason: "In den 1830er Jahren gründeten Gauß und Weber den Göttinger Magnetischer Verein. Sie errichteten ein weltweites Netz von Beobachtungsstationen, die Stärke und Richtung des Erdmagnetfelds gleichzeitig und nach standardisierten Verfahren maßen. Gauß entwickelte die Potentialtheorie zur Beschreibung des Erdmagnetfelds. Mithilfe dieser mathematischen Methode konnte er das Magnetfeld für die gesamte Erdoberfläche berechnen – selbst für Regionen, für die keine direkten Messungen vorlagen."
 je_curie_magnetic_atlas_progress_complete_tt: "The progess reached #V 24#!."
