 theiler.60.t: "Boil Weevil"
 theiler.60.d: "The boll weevil, which until now fed exclusively on wild Mexican cotton, appears to have changed its habits: it is threatening the entire cotton industry along the Gulf of Mexico!"
 theiler.60.f: "The Boll Weevil (Anthonomus grandis) is a beetle that feeds on cotton buds and flowers. Migrating from Mexico into the United States in the late 19th century, it became one of the most economically destructive pests in agricultural history. Its significance lies in its reproductive cycle: females deposit eggs inside cotton 'squares' (flower buds) and bolls. The hatching larvae consume the internal tissues, preventing fiber development and causing the fruit to drop. By the 1920s, it had decimated the 'King Cotton' economy, driving massive social shifts like the Great Migration and forcing farmers to diversify into crops like peanuts."
 theiler.60.g: "My precious cotton!"
 theiler.60.tt: "From now on the [GetHarvestConditionType('theiler_boll_weevil_condition').GetName] will appear in North America."
 theiler.61.t: "Grape Phylloxera"
 theiler.61.d: "Terrible news for our winemakers: somehow, the phylloxera has managed to cross from America to Europe. It has already begun its destructive work in [SCOPE.sState('theiler_state_scope').GetName]. This is a catastrophe!"
 theiler.61.f: "The Grape Phylloxera (Daktulosphaira vitifoliae) is a microscopic, aphid-like insect that ranks among the most devastating pests in viticultural history. Native to North America, it triggered a global agricultural crisis in the late 19th century, nearly destroying the European wine industry. Its significance as a pest lies in its specialized feeding on grapevine roots. Unlike American species, the European Vitis vinifera lacks natural immunity to the insect's toxic saliva, which causes galls and eventual root necrosis. This results in the total collapse of the plant's nutrient and water uptake."
 theiler.61.g: "My precious wine!"
 theiler.61.tt: "From now on the [GetHarvestConditionType('theiler_grape_phylloxera_condition').GetName] will appear in Europe."
 theiler.62.t: "Tea Mosquito Bug"
 theiler.62.d: "A mysterious die-off of tea plants in Assam has sparked widespread alarm. Apparently, numerous plants have been infested by the tea bug! This pest appears to be spreading unstoppably!"
 theiler.62.f: "The Tea Mosquito Bug (genus Helopeltis) is a highly destructive hemipteran pest belonging to the Miridae family. Despite its name, it is a true bug, not a mosquito, though its elongated legs and antennae give it a similar silhouette. It is a primary threat to various plantation crops, most notably tea, cocoa, and cashew. The pest's significance lies in its specialized feeding mechanism: using piercing-sucking mouthparts, it targets succulent young shoots and leaves. While feeding, it injects toxic saliva that causes rapid tissue necrosis, appearing as characteristic sunken, brownish-black lesions. Due to its high mobility and rapid reproduction, it is a major challenge for agricultural productivity in tropical regions."
 theiler.62.g: "My precious tea!"
 theiler.62.tt: "From now on the [GetHarvestConditionType('theiler_tea_mosquito_condition').GetName] will appear in South and East Asia."
 theiler.63.t: "Potato Beetles in [SCOPE.sState('theiler_state_scope').GetName]!"
 theiler.63.d: "Naturalists and biologists today presented a report that is worrying farmers and traders alike. The infamous Colorado potato beetle, native to North America, has been discovered in our fields for the first time. If we don't stop it, it may infest whole Europe!"
 theiler.63.f: "The Colorado potato beetle was discovered in the 1820s and began its predatory advance from the Rocky Mountains to the Atlantic coast as early as the late 1850s. In doing so, it covered approximately 140 kilometers annually and became a scourge for American farmers. The beetle's attempts to cross over to Europe failed repeatedly throughout the 1870s and beyond. It did not succeed in making the crossing until the 1920s—shortly after the First World War had overtaxed the resources of the Old Continent."
 theiler.63.g: "My precious potatos!"
 theiler.63.tt: "From now on the [GetHarvestConditionType('theiler_potato_beetle_condition').GetName] will appear in North America."
 theiler.64.t: "Colorado Potato Beetle"
 theiler.64.d: "In [SCOPE.sState('theiler_state_scope').GetName], a new pest has entered the scene: the Colorado potato beetle, which until now fed on buffalo bur, has—due to its contact with American agriculture—developed a voracious appetite for potatoes. Apparently, nothing can stop this voracious insect!"
 theiler.64.f: "The Colorado potato beetle (Leptinotarsa decemlineata) is a notorious agricultural pest within the Chrysomelidae family. Easily identified by its yellowish-orange exoskeleton and ten black longitudinal stripes, this beetle is a primary threat to nightshade crops, especially potatoes. Its status as a major pest stems from its destructive feeding habits; both adults and larvae are voracious defoliators, capable of stripping entire plants and causing total yield loss. Beyond physical damage, the species is globally significant due to its rapid adaptation and high level of resistance to chemical insecticides. Originally native to North America, it became a cosmopolitan concern, significantly impacting global food security.\n\n #p The chance of halting a pest invasion is improved by the following factors: Biologist, Chemist, and Pesticide Technologies.#!"
 theiler.65.t: "Codling Moths Runs Wild!"
 theiler.65.d: "The codling moth has expanded its home range: from a neighboring region it has also spread into [SCOPE.sState('theiler_state_scope').GetName] to infest the orchards there. It looks as though nothing can stop this pest on its march across all of North America!"
 theiler.65.f: "The codling moth (Cydia pomonella) originates from Eurasia and spread with apple cultivation in the 19th century across Central Europe, Northern Italy, the Balkans, Hungary, parts of Russia west of the Urals, North America, and Australia. Nordic, very hot, or dry regions were largely spared. In the 20th century, it reached almost all temperate apple-growing regions worldwide, including Scandinavia, the Baltic States, and South America, and became one of the most significant pests in orchards."
 theiler.65.g: "Mobilize every resource to prevent the pest from spreading!"
 theiler.65.h: "Our scientists will find a solution."
 theiler.65.i: "We will have to get used to living with this pest."
 theiler.66.t: "Codling Moths in [SCOPE.sState('theiler_state_scope').GetName]!"
 theiler.66.d: "Naturalists and biologists today presented a report that is worrying farmers and traders alike. The infamous codling moth, native to Europe and Western Asia, has been discovered in our orchards for the first time. If we don't stop it, it may infest whole Oceania!"
 theiler.66.f: "The codling moth (Cydia pomonella) originates from Eurasia and spread with apple cultivation in the 19th century across Central Europe, Northern Italy, the Balkans, Hungary, parts of Russia west of the Urals, North America, and Australia. Nordic, very hot, or dry regions were largely spared. In the 20th century, it reached almost all temperate apple-growing regions worldwide, including Scandinavia, the Baltic States, and South America, and became one of the most significant pests in orchards.\n\n #p The chance of halting a pest invasion is improved by the following factors: Biologist, Chemist, and Pesticide Technologies.#!"
 theiler.67.d: "Naturalists and biologists today presented a report that is worrying farmers and traders alike. The infamous codling moth, native to Europe and Western Asia, has been discovered in our orchards for the first time.If we don't stop it, it may infest whole South Africa!"
 theiler.68.d: "Naturalists and biologists today presented a report that is worrying farmers and traders alike. The infamous codling moth, native to Europe and Western Asia, has been discovered in our orchards for the first time. If we don't stop it, it may infest whole South America!"
 theiler.69.t: "Pest Prevented"
 theiler.69.d: "Pest control in [SCOPE.sState('theiler_state_scope').GetName] was a resounding success. The population views the containment efforts with approval and attributes them to the government's vigorous work. For at least a few years, we are safe from a new invasion."
 theiler.69.f: "Following the successful eradication of a pest infestation, the affected region remains secure for ten years. Afterward, the pest may once again attempt to conquer new territory within the region—potentially via another country that possesses a port and its preferred food source."
 theiler.69.g: "Praise the government!"
 theiler.70.t: "Pest Invasion"
 theiler.70.d: "Efforts to contain the newly introduced pest in [SCOPE.sState('theiler_state_scope').GetName] have failed completely. Apparently, nothing can halt its triumphant advance across the entire country—and beyond. Our reputation is in tatters, and the public blames the government for this colossal failure."
 theiler.70.f: "Once a pest has successfully invaded, there is no stopping it: until an effective countermeasure is invented, it will—just as in its native range—regularly wreak havoc."
 theiler.70.g: "Boo the government!"
