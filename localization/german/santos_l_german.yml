 santos.441.t: "Knapp dem Tod entronnen"
 santos.441.d: "Wie durch ein Wunder gelang es [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName], trotz aller widrigen Umstände die gefährliche Überquerung des Ärmelkanals lebend zu überstehen. Diese knappe Rettung vor dem sicheren Tod hat jedoch ihren Preis: Der Ballon muss erneut repariert werden … und auch dem Ballonfahrer geht es nicht gut."
 santos.441.f: "„In einer nahrhaften Mahlzeit liegt ein Hauch von Leben und Unsterblichkeit. Wie Ballons sind wir nichts, solange wir nicht gefüllt sind.“ – Herman Melville"
 santos.441.g: "Ist [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] traumatisiert?"
