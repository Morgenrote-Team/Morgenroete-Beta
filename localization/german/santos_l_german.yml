 santos_stratospheric_flight_cost_modifier: "Kosten für einen Stratosphärenflug"
 santos.301.t: "Stratosphärenflüge: Ein durchschlagender Erfolg"
 santos.301.d: "To the surprise of many observers, who considered the balloon flight into the stratosphere a suicide mission, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] returned from his journey today. The capsule landed in a pasture not far from [SCOPE.sState('santos_balloon_state').GetCityHubName]. In total, the balloon reached an altitude of #p [ROOT.Var('new_balloon_altitude_var').GetValue]#! meters."
 santos.301.f: "'A huge yellow balloon soared skyward, a few weeks ago, from [SCOPE.sState('santos_balloon_state').GetCityHubName], [GetPlayer.GetNameNoFormatting]. Instead of a basket, it trailed an air-thin black-and-silver aluminum ball. Within [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] aimed to explore the air 50,000 feet up. Seventeen hours later, after being given up for dead, [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] returned safely from an estimated height of [ROOT.Var('new_balloon_altitude_var').GetValue].'"
 santos.301.g: "Glory to our hero [ROOT.Var('santos_balloonist_var').GetCharacter.GetLastNameNoFormatting]!"
 santos.302.t: "Stratosphärenflüge: Eine tödliche Katastrophe"
 santos.302.d: "The belief held by many researchers and journalists has now been confirmed: the stratospheric flight was a complete crazy idea. Whether our balloonist died in the rough landing near [SCOPE.sState('santos_balloon_state').GetCityHubName] after the ropes snapped due to material fatigue, or whether the heat inside the balloon and the lack of oxygen at that altitude led to [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis] premature death, remains to be determined by an autopsy. In any case, the press is already having a field day over the incident."
 santos.302.f: "'Studies, warnings, and even well-meaning advice had no effect. The tragic death of [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] could likely have been prevented had the government banned this reckless maneuver. But the thirst for international fame and the complete blindness brought on by the prospect of sending a balloonist to new heights caused even the most reasonable objections to fall on deaf ears.\n\nWho are these people, anyway? Where is their sense of responsibility? It's not a coincidence that once [SCOPE.sCharacter('santos_ruler_scope').GetFullNameNoFormatting] took office this country started coming apart at the seams! The responsible people don't wanna tell you, but they are scared, and they should be, because the very fabric of this country is tearing from all corners.'"
 santos.302.g: "Einen nationalen Trauertag ausrufen."
 santos_stratospheric_flight_success_modifier: "Stratosphärenflug: Erfolg"
 santos_stratospheric_flight_failure_modifier: "Stratosphärenflug: Fehlschlag"
 je_santos_stratospheric_flight: "Stratosphärenflug"
 je_santos_stratospheric_flight_reason: "For 19th-century balloonists, a spectacular flight into the stratosphere was still nothing more than a utopian dream. However, with the great advances of the Industrial Age and the invention of the pressurized capsule, even this adventure was no longer an insurmountable obstacle. In the 1930s, several courageous men and women from various nations took on the challenge—and risked their lives in the process. The rules governing a high-altitude flight are not unlike those of [concept_santos_balloon_crossing], with the difference that this journey is more demanding and ends only in triumph or death. Moreover, the ultimate altitude records can be set here—up to 22,000 meters are possible!"
 santos_stratospheric_flight_on_fail_tt: "Der Stratosphärenballon erleidet ein tödliches Unglück."
 santos_stratospheric_flight_event_normal_ascent_icon_flag: "@santos_event_log_positive_normal_ascent_icon!"
 santos_stratospheric_flight_event_normal_ascent_title_flag: "Normaler Aufstieg"
 santos_stratospheric_flight_event_normal_ascent_flag: "#t $santos_stratospheric_flight_event_normal_ascent_title_flag$#!\nThe balloon ascends smoothly into the stratosphere."
 santos_stratospheric_flight_event_boost_ascent_icon_flag: "@santos_event_log_positive_boost_ascent_icon!"
 santos_stratospheric_flight_event_boost_ascent_title_flag: "Rasanter Anstieg"
 santos_stratospheric_flight_event_boost_ascent_flag: "#t $santos_stratospheric_flight_event_boost_ascent_title_flag$#!\nThe balloonist managed to successfully increase the balloon's altitude.\n\n#b The following factors make this outcome more likely:#!\n[concept_santos_balloonist] has the $santos_balloonist_experienced$, $innovative$ or $ambitious$ [concept_character_trait]."
 santos_stratospheric_flight_event_altitude_improvisation_icon_flag: "@santos_event_log_positive_altitude_improvisation_icon!"
 santos_stratospheric_flight_event_altitude_improvisation_title_flag: "Höhenimprovisation"
 santos_stratospheric_flight_event_altitude_improvisation_flag: "#t $santos_stratospheric_flight_event_altitude_improvisation_title_flag$#!\nThe crew's technical expertise made it possible to minimize the risks associated with the balloon flight.\n\n#b The following factors make this outcome more likely:#!\n[concept_santos_balloonist] has the $cautious$, $innovative$ or $engineer$ [concept_character_trait]. A [concept_curie_meteorological_physicist] which has the $innovative$, $erudite$ or $meticulous$ [concept_character_trait] might also help."
 santos_stratospheric_flight_event_slow_ascent_icon_flag: "@santos_event_log_negative_slow_ascent_icon!"
 santos_stratospheric_flight_event_slow_ascent_title_flag: "Langsamer Aufstieg"
 santos_stratospheric_flight_event_slow_ascent_flag: "#t $santos_stratospheric_flight_event_slow_ascent_title_flag$#!\nFor unknown reasons, the balloon is not rising as quickly as originally calculated."
 santos_stratospheric_flight_event_broken_rope_icon_flag: "@santos_event_log_negative_broken_rope_icon!"
 santos_stratospheric_flight_event_broken_rope_title_flag: "Gebrochenes Seil"
 santos_stratospheric_flight_event_broken_rope_flag: "#t $santos_stratospheric_flight_event_broken_rope_title_flag$#!\nA broken rope makes it harder to control the balloon and, in particular, makes it difficult to release the gas properly.\n\n#b The following factors make this outcome more likely:#!\n[concept_santos_balloonist] has the $reckless$, $wrathful$, $arrogant$ [concept_character_trait] or a #V negative condition trait like a disease or an addiction#!.\n\n#b The following factors make this outcome less likely:#!\n[concept_santos_balloonist] has the $curie_meteorological_physicist$ or $engineer$ [concept_character_trait]. A [concept_curie_meteorological_physicist] might discover these problems before the start."
 santos_stratospheric_flight_event_defective_valve_icon_flag: "@santos_event_log_negative_defective_valve_icon!"
 santos_stratospheric_flight_event_defective_valve_title_flag: "Defektes Ventil"
 santos_stratospheric_flight_event_defective_valve_flag: "#t $santos_stratospheric_flight_event_defective_valve_title_flag$#!\nA faulty valve causes the stratospheric balloon's flight plan to deviate from the original plan.\n\n#b The following factors make this outcome more likely:#!\n[concept_santos_balloonist] has the $reckless$, $wrathful$, $arrogant$ [concept_character_trait] or a #V negative condition trait like a disease or an addiction#!.\n\n#b The following factors make this outcome less likely:#!\n[concept_santos_balloonist] has the $curie_meteorological_physicist$ or $engineer$ [concept_character_trait]. A [concept_curie_meteorological_physicist] might discover these problems before the start."
 santos_stratospheric_flight_event_heat_buildup_icon_flag: "@santos_event_log_negative_heat_buildup_icon!"
 santos_stratospheric_flight_event_heat_buildup_title_flag: "Wärmeentwicklung"
 santos_stratospheric_flight_event_heat_buildup_flag: "#t $santos_stratospheric_flight_event_heat_buildup_title_flag$#!\nWithout a protective layer of clouds, the sun beats down mercilessly on the balloon. The envelope and the lifting gas heat up significantly, and the gas expands rapidly.\n\n#b The following factors make this outcome less likely:#!\n[GetPlayer.GetName] has researched [GetTechnology('zeppelins').GetName] and [GetTechnology('curie_rocket_science_tech').GetName]."
 santos_stratospheric_flight_event_material_fatigue_icon_flag: "@santos_event_log_negative_material_fatigue_icon!"
 santos_stratospheric_flight_event_material_fatigue_title_flag: "Materialermüdung"
 santos_stratospheric_flight_event_material_fatigue_flag: "#t $santos_stratospheric_flight_event_material_fatigue_title_flag$#!\nThe high-altitude flight pushes the balloon material to its absolute limit: The risk of tears and other damage increases significantly!\n\n#b The following factors make this outcome more likely:#!\n[GetPlayer.GetName] has researched [GetTechnology('vulcanization').GetName] and [GetTechnology('art_silk').GetName]."
 santos_stratospheric_flight_event_hydrogen_fire_icon_flag: "@santos_event_log_negative_hydrogen_fire_icon!"
 santos_stratospheric_flight_event_hydrogen_fire_title_flag: "Wasserstofffeuer!"
 santos_stratospheric_flight_event_hydrogen_fire_flag: "#t $santos_stratospheric_flight_event_hydrogen_fire_title_flag$#!\nThe ultimate disaster in a balloon ride has occurred: The hydrogen has caught fire! This spells certain death for the crew...\n\n#b The following factors make this outcome less likely:#!\n[GetPlayer.GetName] has a [GetBuildingType('building_mendelejew_helium_plant').GetName]. [concept_santos_balloonist] has the $curie_meteorological_physicist$ or $engineer$ [concept_character_trait]. A [concept_curie_meteorological_physicist] might discover these problems before the start."
 je_santos_balloon_crossing_complete_tt: "@santos_ballooning_progress! #V #BLUE Balloon Progress#!#! has reached #V [GetPlayer.MakeScope.ScriptValue('santos_balloon_crossing_goal_value')|0]#!."
 replace_balloonist_tt: "Replace the [concept_santos_balloonist] with a new one."
 santos.511.t: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetLastName] enslaved in Africa!"
 santos.511.d: "Our balloon pilot, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName], has been missing for several months now. Newspapers reported today that [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] apparently went missing during his last adventure flight over Africa. It seems [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] crashed in [SCOPE.sCountry('santos_balloonist_slaver_scope').GetName], was sold into slavery there, and is now forced to do hard labor in the fields!"
 santos.511.f: "Historisch gesehen gab es 1853 tatsächlich Artikel in verschiedenen Zeitungen, die behaupteten, Arban sei in Afrika versklavt worden. Dafür gab es jedoch keine Beweise. Was genau mit Arban geschah, ist unklar, aber höchstwahrscheinlich ertrank er im Mittelmeer."
 santos.511.g: "We will free [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHim] from slavery!"
 santos.511.h: "Lasst uns einfach bezahlen und die Sache hinter uns bringen..."
 santos.511.i: "Das Leben eines Ballonfahrers ist all diese Mühe nicht wert."
 santos.512.t: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetLastName] rescued from slavery"
 santos.512.d1: "A small squad was assigned to free [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] from captivity. After a brief skirmish, they were able to free [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHim] and several other Europeans and escaped on horseback. Before the [SCOPE.sCountry('curtiss_arban_slaver_scope').GetAdjective] authorities could react, they had already arrived on a ship that took them home. Due to [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis] long captivity [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] is worn out and weak, but [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] was able to tell us about [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis] adventurous balloon flight."
 santos.512.d2: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] has returned home. Due to [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis] long captivity [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] is worn out and weak, but [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] was able to tell us about his adventurous balloon flight."
 santos.512.f: "„Ich wurde vom Wind aufs offene Meer hinausgetrieben. Da ich nach Süden abgetrieben wurde, beschloss ich, die Balearen anzusteuern. Doch der Wind war stark, und so trieb er mich an die nordafrikanische Küste, wo ich landen konnte. Leider waren die Einwohner dort nicht sehr freundlich. Ist schon mal jemand über das Mittelmeer geflogen? Habe ich einen Rekord aufgestellt?“"
 santos.512.g: "Eine erfolgreiche Rettungsaktion!"
 santos.512.h: "Welcome back [ROOT.Var('santos_balloonist_var').GetCharacter.GetLastName]!"
 santos.701.t: "Erste Luftaufnahmen aus einem Ballon"
 santos.701.d: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] has combined [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis] two passions, ballooning and photography. [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe|U] was able to photograph the front lines at [SCOPE.sState('santos_balloon_state').GetCityHubName] and thereby gather valuable military intelligence."
 santos.701.f: "Nadar took his first aerial photographs in 1859 at the Battle of Solferino. In 1863, Nadar became president of the #b Société d'encouragement pour la locomotion aérienne au moyen d'appareils plus lourds que l'air#!, a society dedicated to aviation. The secretary of the Société was none other than Jules Verne, who was inspired by the balloons of Nadar to write his story \"#b Five weeks in a balloon#!\"."
 santos.701.g: "Die Welt von oben sieht so anders aus!"
 santos.702.t: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] transports passengers across the Alps"
 santos.702.d: "During a flight with passengers, the Swiss [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] flew passengers over the Alps. In the process, [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] crossed some of the highest points in the Alps. [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe|U] is now a star of ballooning."
 santos.702.f: "Eduard Spelterini, geboren als Albert Schweizer, absolvierte in seiner Jugend eine Ausbildung zum Ballonfahrer. Nachdem er seinen ersten eigenen Ballon namens „Urania“ gebaut hatte, bereiste er Europa, um der Oberschicht die Welt aus der Vogelperspektive zu zeigen. Üblicherweise gehörte ein kleines Picknick mit Koteletts und Champagner dazu. Spelterini begann auch mit dem Fotografieren von Luftbildern, doch seine Passagierflüge über die Alpen trugen am meisten zu seinem Ruhm bei."
 santos.702.g: "Eine unglaubliche Aussicht!"
 santos.703.t: "Erstflug eines lenkbaren Luftschiffs"
 santos.703.d: "A big problem of balloon flights is that they always depend on good winds. It is far too easy for the balloon to drift, which repeatedly leads to accidents. [ROOT.Var('tesla_engineer_var').GetCharacter.GetFullName] tried to find a solution to this problem by constructing an elongated airship with a steam engine and rudder for steering. With his \"[ROOT.Var('tesla_engineer_var').GetCharacter.GetLastNameNoFormatting] dirigible\", [ROOT.Var('tesla_engineer_var').GetCharacter.GetSheHe] made a 27-kilometer flight from Paris to Élancourt. Since the airship is very slow, the flight against the wind is not possible so far. Who knows in which direction these airships will develop?"
 santos.703.f: "Mit seinem Flug am 24. September 1852 gelang Giffard der erste Flug mit einem motorisierten und steuerbaren Luftschiff. Der Antrieb durch eine Dampfmaschine war jedoch sehr schwach, weshalb sich das Luftschiff noch nicht durchsetzen konnte. Erst mit der Erfindung des Verbrennungsmotors konnte der Traum vom Luftschiff Wirklichkeit werden."
 santos.703.g: "Vielleicht werden diese lenkbaren Ballons bald den Himmel erobern!"
 santos.677.t: "Tod durch Sauerstoffmangel"
 santos.677.d: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] never returned from [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis] high-altitude flight. Days later, farmers found [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHim] at a remote farm where the balloon had crashed. The balloonist was found lifeless in the basket—[ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] had already been dead before the crash."
 santos.677.f: "Before the invention of oxygen cylinders, oxygen deprivation at high altitudes led to severe altitude sickness. Dizziness, paralysis, and loss of consciousness quickly rendered balloonists incapable of acting. The Zenith flight ended tragically in 1875: Sivel and Croce-Spinelli lost consciousness, were unable to jettison ballast, and died of hypoxia. Their colleague Tissandier barely survived, but the experience left a lasting mark on him for the rest of his life, and he was left deaf.\n\n#R To prevent such a fatal high-altitude accident, research [GetTechnology('electric_arc_process').GetName] to get #V Oxygen Cylinders#!.#!"
 santos.677.g: "Was für ein waghalsiges Unterfangen!"
 santos.677.h: "Was für ein schrecklicher Tod – aber gibt es einen anderen Ballonfahrer, der bereit wäre, für uns zu arbeiten?"
 santos.692.t: "Ballontreibstoff"
 santos.692.d: "Wechseln Sie den Treibstoff Ihres Ballons. Die Umstellung dauert ein halbes Jahr. Während dieser Zeit ist der Ballon außer Betrieb."
 santos.692.f: "Coal gas is an abundant hot-air balloon gas which, in the early days of ballooning, was perfectly adequate for setting distance and speed records, but which has significant limitations when it comes to ascending to high altitudes. Hydrogen was already in use in the early days of ballooning and led to some breathtaking altitude records - it is, quite simply, the 'altitude gas' par excellence; however, producing it is very expensive and labour-intensive. [concept_curtiss_helium] has properties similar to those of hydrogen, though slightly weaker. However, it significantly increases a balloon's safety and prevents hydrogen fires."
 santos.692.g: "Wir brauchen Kohlegas."
 santos.692.h: "Wasserstoff ist König."
 santos.692.i: "Helium ist alles!"