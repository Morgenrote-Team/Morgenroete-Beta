 santos_balloon_crossing_event_confusing_situation_flag: "#t $santos_balloon_crossing_event_confusing_situation_title_flag$#!\nBewölkung, frostige Nächte und allgemeine Unsicherheit behindern die Ballonüberquerung.\n\n#b Die folgenden Faktoren machen dieses Ergebnis wahrscheinlicher:#!\n[concept_santos_balloonist] hat die [concept_character_trait] $reckless$, $wrathful$, $arrogant$ auf oder eine #V negative Eigenschaft wie eine Krankheit oder eine Sucht#!.#!"
 santos_balloon_crossing_event_dangerous_fog_icon_flag: "@santos_event_log_negative_dangerous_fog_icon!"
 santos_balloon_crossing_event_dangerous_fog_title_flag: "Gefährlicher Nebel"
 santos_balloon_crossing_event_dangerous_fog_flag: "#t $santos_balloon_crossing_event_dangerous_fog_title_flag$#!\nDer immer dichter werdende Nebel macht die Ballonfahrt zunehmend gefährlicher!\n\n#b Die folgenden Faktoren erhöhen die Wahrscheinlichkeit dieses Ausgangs:#!\n[concept_santos_balloonist] hat die [concept_character_trait] $reckless$, $wrathful$, $arrogant$ oder hat eine #V negative Eigenschaft wie eine Krankheit oder eine Sucht#!.\n\n#b Die folgenden Faktoren machen dieses Ergebnis weniger wahrscheinlich:#!\n[concept_santos_balloonist] hat die [concept_character_trait] $curie_meteorological_physicist$ oder verfügt über einen [concept_curie_meteorological_physicist].#!"
 santos_balloon_crossing_event_violent_storm_icon_flag: "@santos_event_log_negative_wind_icon!"
 santos_balloon_crossing_event_violent_storm_title_flag: "Heftiger Sturm"
 santos_balloon_crossing_event_violent_storm_flag: "#t $santos_balloon_crossing_event_violent_storm_title_flag$#!\nEin Sturm oder Winde in großer Höhe können dem Ballon ernsthafte Probleme bereiten!\n\n#b Die folgenden Faktoren verringern die Wahrscheinlichkeit dieses Ausgangs:#!\n[concept_santos_balloonist] hat die [concept_character_trait] $curie_meteorological_physicist$ oder hat einen [concept_curie_meteorological_physicist].#!"
 santos_balloon_crossing_event_balloonist_error_icon_flag: "@santos_event_log_negative_balloonist_error_icon!"
 santos_balloon_crossing_event_balloonist_error_title_flag: "Fehler des Ballonfahrers"
 santos_balloon_crossing_event_balloonist_error_flag: "#t $santos_balloon_crossing_event_balloonist_error_title_flag$#!\nDer Ballonfahrer verursachte durch einen Steuerungsfehler Probleme für die Ballon-Expedition selbst.\n\n#b Die folgenden Faktoren machen dieses Ergebnis wahrscheinlicher:#!\n[concept_santos_balloonist] hat die [concept_character_trait] $reckless$, $wrathful$ oder $arrogant$.\n\n#b Die folgenden Faktoren machen dieses Ergebnis weniger wahrscheinlich:#!\n[concept_santos_balloonist] hat den [concept_character_trait] $santos_balloonist_experienced$.#!"
