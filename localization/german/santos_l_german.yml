 santos.651.g: "Werden Sie Sponsor eines Ballonfahrers!"
 santos.651.h: "Hör auf, deinen Ballonfahrer zu sponsern."
 santos.651.htt: "Mit dieser Option wird der Ballonfahrer aus dem Spiel entfernt."
 santos.651.l: "Ich möchte mich wieder meinen Aufgaben widmen!"
 santos.651.w: "Don't tell about the #yellow flights#! of my balloonist anymore!"
