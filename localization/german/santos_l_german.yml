 je_santos_balloon_adventure: "Ballonabenteuer"
 je_santos_balloon_adventure_reason: "Während ihrer abenteuerlichen Reise können Ballonfahrer Gegenstände sammeln, die mit ihrem Beruf in Verbindung stehen. Archäologen und Ethnologen sammeln Artefakte; Naturforscher sammeln Exemplare und Fossilien; Geologen sammeln allgemeine und seltene Materialien; Meteorologen sammeln magnetische Daten, physikalische Daten und ozeanografische Erkenntnisse; und Ingenieure hingegen kehren mit technischen Erkenntnissen zurück.\n\nEs besteht eine #G geringe Chance#!, dass Ballonfahrer nicht lebend von ihrer Reise zurückkehren."
 santos.502.t: "Ballonfahrer kehrt vom Abenteuer zurück"
 santos.502.d: "Nach vielen Monaten auf Reisen ist [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] wieder [GetPlayer.GetAltNameNoFormatting('IN')] angekommen. Neugierige Zuschauer warten gespannt auf die  [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis]e Rückkehr. [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe|U] hat sicherlich einige spannende Geschichten zu erzählen – und [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] hat ein paar Souvenirs mitgebracht!"
 santos.502.f: "Irgendwo über dem Regenbogen\nfliegen Blaumeisen\nUnd die Träume, von denen du träumst\nTräume werden wahr-ooh-ooh\nEines Tages werde ich mir etwas wünschen, wenn ich einen Stern sehe\nWach auf, wo die Wolken weit hinter mir liegen\nWo Sorgen wie Zitronenbonbons schmelzen\nHoch über den Schornsteinen, dort\nwirst du mich finden, oh"
 santos.502.g: "Der Ballonfahrer ist tatsächlich zu etwas gut ..."
 santos.503.t: "Der Ballonfahrer kehrt mit einem Tier zurück"
 santos.503.d: "Bei [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis]en neuesten Abenteuer hat unser Ballonfahrer erneut einige lebensgefährliche Herausforderungen gemeistert. Die Beute ist jedoch mager. Stattdessen hat [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] etwas anderes mitgebracht: einen neuen tierischen Freund..."
 santos.503.g: "Was für ein süßes Äffchen! Wie entzückend!"
 santos.504.g: "Was für ein süßes kleines Hermelin! Wie bezaubernd!"
 santos.505.g: "Was für ein süßes kleines ... was zum Teufel ist das?"
