 santos_balloon_crossing_event_altitude_sickness_flag: "#t $santos_balloon_crossing_event_altitude_sickness_title_flag$#!\nDer Ballonfahrer hat die kritische Höhe von 7.000 Metern überschritten und leidet daher unter den akuten Auswirkungen des Sauerstoffmangels.\n\n#b Die folgenden Faktoren verringern die Wahrscheinlichkeit dieses Ausgangs:#!\n[GetPlayer.GetAltName('NOM')] hat [GetTechnology('electric_arc_process').GetName] erforscht.#!"
