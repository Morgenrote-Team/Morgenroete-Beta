 santos_distance_title_both_records_country: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] has achieved a new distance and duration record for our country"
 santos_distance_title_distance_record_global: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] ist mit [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]em Ballon weiter geflogen als je ein Mensch zuvor!"
