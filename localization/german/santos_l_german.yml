 santos_distance_title_both_records_global: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] ist mit [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]em Ballon weiter und länger geflogen als je ein Mensch zuvor!"
 santos_distance_description_no_record: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] versuchte, mit [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]em Ballon so weit wie möglich zu fliegen. Mit einer Distanz von #b #n [ROOT.Var('new_balloon_distance_var').GetValue]#! Kilometern#! konnte [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] den bisherigen Landesrekord von #b #p [ROOT.Var('santos_balloon_distance_record_var').GetValue]#! Kilometern#! nicht übertreffen. Auch den bisherigen Dauerrekord von #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! Stunden#! konnte [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] nicht brechen. mit einer Dauer von #b #n [ROOT.Var('new_balloon_time_var').GetValue]#! Stunden#!. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFirstName] wird es sicherlich erneut versuchen."
 santos_distance_description_distance_record_country: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] hat mit [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]em Ballon einen neuen Distanzrekord für unser Land aufgestellt! Mit einer Distanz von #b #p [ROOT.Var('new_balloon_distance_var').GetValue]#! Kilometern#! konnte [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] den bisherigen Landesrekord von #b #p [ROOT.Var('santos_balloon_distance_record_var').GetValue]#! Kilometern#! deutlich übertreffen. Leider reichte es aber nicht, um den Weltrekord von #b #p [GetGlobalVariable('santos_balloon_distance_record_global_var').GetValue]#! Kilometern#! [GetGlobalVariable('santos_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon] zu brechen. Die Dauer von #b #n [ROOT.Var('new_balloon_time_var').GetValue]#! Stunden#! reichte leider nicht für unseren nationalen Rekord von #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! Stunden#!."
 santos_distance_description_time_record_country: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] hat mit [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]em Ballon einen neuen Dauerrekord für unser Land aufgestellt! Mit einer Dauer von #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! Stunden#! konnte [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] den vorherigen Landesrekord von #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! Stunden#! übertreffen. Leider reichte es nicht für den Weltrekord von #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! Stunden#! [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon] Der Distanzrekord unseres Landes von #b #p [ROOT.Var('santos_balloon_distance_record_var').GetValue]#! Kilometern#! konnte auch mit einer Distanz von #b #n [ROOT.Var('new_balloon_distance_var').GetValue]#! Kilometern#! nicht gebrochen werden."
 santos_distance_description_both_records_country: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] hat mit [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]em Ballon einen neuen Distanzrekord und einen neuen Rekord für einen ununterbrochenen Flug für unser Land aufgestellt! Mit einer Distanz von #b #p [ROOT.Var('new_balloon_distance_var').GetValue]#! Kilometern#! konnte [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] den bisherigen Landesrekord von #b #p [ROOT.Var('santos_balloon_distance_record_var').GetValue]#! Kilometern#! deutlich übertreffen. Für den Weltrekord von #b #p [GetGlobalVariable('santos_balloon_distance_record_global_var').GetValue]#! Kilometern#! reichte es jedoch nicht. [GetGlobalVariable('santos_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon] Allerdings wurde mit einer Dauer von #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! Stunden#! auch der nationale Rekord von #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! Stunden#! gebrochen, aber nicht der Weltrekord von #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! Stunden#! [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon]"
 santos_distance_description_distance_record_global: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] hat einen neuen Weltrekord im Weitflug mit [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]em Ballon aufgestellt! Mit einer Distanz von #b #p [ROOT.Var('new_balloon_distance_var').GetValue]#! Kilometern#! konnte [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] den bisherigen Landesrekord von #b #p [ROOT.Var('santos_balloon_distance_record_var').GetValue]#! Kilometern#! und den Weltrekord von #b #p [GetGlobalVariable('santos_balloon_distance_record_global_var').GetValue]#! Kilometern#! brechen. [GetGlobalVariable('santos_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon] wurde deutlich überschritten. Die Flugdauer von #b #n [ROOT.Var('new_balloon_time_var').GetValue]#! Stunden#! reichte leider nicht für den Weltrekord von #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! Stunden#! [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon]"
 santos_distance_description_time_record_global: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] hat einen neuen Weltrekord mit [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]em Ballon für die längste Ballonfahrt aufgestellt! Mit einer Dauer von #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! Stunden#! konnte [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] den bisherigen Landesrekord von #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! Stunden#! und den Weltrekord von #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! Stunden#! [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon] brechen. Die Distanz von #b #n [ROOT.Var('new_balloon_distance_var').GetValue]#! Kilometern#! reichte leider nicht für den Weltrekord von #b #p [GetGlobalVariable('santos_balloon_distance_record_global_var').GetValue]#! Kilometern#! [GetGlobalVariable('santos_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon]"
 santos_distance_description_both_records_global: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] hat mit [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]em Ballon einen neuen Weltrekord in den Kategorien Distanz und Dauer aufgestellt! Mit einer Distanz von #b #p [ROOT.Var('new_balloon_distance_var').GetValue]#! Kilometern#! konnte [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] den bisherigen Rekord unseres Landes von #b #p [ROOT.Var('santos_balloon_distance_record_var').GetValue]#! Kilometer#! sowie den Weltrekord von #b #p [GetGlobalVariable('santos_balloon_distance_record_global_var').GetValue]#! Kilometern#! [GetGlobalVariable('santos_balloon_distance_record_holder_global_var').GetCountry.GetFlagTextIcon] deutlich übertroffen. Die Weltrekordzeit von #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! Stunden#! [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon] konnte mit einer Flugdauer von #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! Stunden#! übertroffen werden."
 santos.655.t1: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] schlägt beim Versuch fehl, den Rekord für einen kontinuierlichen Ballonflug zu brechen."
 santos.655.t2: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] hat einen neuen Rekord für die längste Ballonfahrt unseres Landes aufgestellt."
 santos.655.t3: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] ist mit [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]em Ballon länger geflogen als je ein Mensch zuvor!"
 santos.655.d1: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] versuchte, mit [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]em Ballon so lange wie möglich zu fliegen. Mit einer Flugzeit von #b #n [ROOT.Var('new_balloon_time_var').GetValue]#! Stunden#! war [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] nicht in der Lage, den bisherigen Rekord unseres Landes von #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! Stunden#! zu übertreffen. [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe|U] wird es sicherlich noch einmal versuchen."
 santos.655.d2: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] hat mit [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]em Ballon einen neuen Rekord für den längsten Flug unseres Landes aufgestellt! Mit einer Flugzeit von #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! Stunden#! hat [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] den bisherigen Rekord unseres Landes von #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! Stunden#! gebrochen. Leider reichte dies jedoch nicht für den Weltrekord von #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! Stunden#! [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon]."
 santos.655.d3: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] hat mit [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]em Ballon einen neuen Weltrekord für den längsten Flug aufgestellt! Mit einer Flugzeit von #b #p [ROOT.Var('new_balloon_time_var').GetValue]#! Stunden#! gelang es [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe], den bisherigen Rekord unseres Landes von #b #p [ROOT.Var('santos_balloon_time_record_var').GetValue]#! Stunden#! zu übertreffen und den Weltrekord von #b #p [GetGlobalVariable('santos_balloon_time_record_global_var').GetValue]#! Stunden [GetGlobalVariable('santos_balloon_time_record_holder_global_var').GetCountry.GetFlagTextIcon].#!"
 santos.655.f1: "„Diesmal hat es nicht geklappt. Aber beim nächsten Mal schaffe ich es ganz bestimmt!“"
 santos.655.f2: "\"Wen interessiert so ein Rekord? Ich will den Weltrekord!\""
 santos.655.f3: "\"Das war ein Kinderspiel!\""
 santos.655.g: "Viel Glück beim nächsten Mal!"
 santos.655.h: "Gut gemacht!"
 santos.655.i: "Wunderbar! Herzlichen Glückwunsch!"
 santos.656.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] hat Höhenangst und gibt das Ballonfahren auf."
 santos.656.d: "Obwohl er behauptete, bereits einige Ballonfahrten unternommen zu haben, stellte [SCOPE.sCharacter('santos_balloonist_scope').GetFullName] bei seiner ersten Fahrt für unser Land in zehn Metern Höhe fest, dass er Höhenangst hat. Daher gibt er das Ballonfahren auf."
 santos.656.f: "„Es ist furchtbar! Vor zwei Wochen bin ich noch in schwindelerregenden Höhen geflogen und jetzt … jetzt kann ich nicht einmal mehr eine Leiter hochklettern!“"
 santos.656.g: "Wie schade..."
 santos.656.h: "Verdammt! Gibt es vielleicht einen anderen Ballonfahrer, den wir sponsern könnten?"
 santos.670.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] stirbt bei einem Ballonunfall"
 santos.670.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] stürzte bei einer [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]er Ballonfahrten ab und kam dabei ums Leben. Wir verlieren damit einen Helden der Luftfahrt."
 santos.670.f: "[SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloonist_death_type')]"
 santos.670.g: "Wie schrecklich!"
 santos.670.h: "Schrecklich! Gibt es einen anderen Ballonfahrer, den wir sponsern könnten?"
 santos.671.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] ist jetzt ein erfahrener Ballonfahrer"
 santos.671.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] hat bereits mehrere Ballonfahrten absolviert und dabei viel Erfahrung gesammelt. Er gilt mittlerweile als erfahrener Ballonfahrer, der sein Handwerk versteht."
 santos.671.f: "\"Hab keine Angst! Ich habe das schon dutzende Male gemacht!\""
 santos.671.g: "Das freut mich!"
 santos.672.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] ist jetzt ein berühmter Ballonfahrer"
 santos.672.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] hat bereits Hunderte von Ballonfahrten unternommen und dabei auch einige Rekorde gebrochen. Mittlerweile ist er berühmt, und zwar nicht nur in unserem Land."
 santos.672.f: "\"[SCOPE.sCharacter('santos_balloonist_scope').GetFullName]? Ist das nicht der Ballonfahrer? Ich möchte ihn unbedingt kennenlernen!\""
 santos.672.g: "Wunderbar!"
 santos.673.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] wurde während des Fluges von einem Kometen getroffen"
 santos.673.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] wurde während der Ballonfahrt von einem Kometen getroffen und starb."
 santos.673.f: "Kurz nach dem Start des Ballons [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] war ein lauter Knall zu hören. Die Beobachter am Boden sahen einen Lichtblitz über den Himmel zucken, der direkt in den Korb des [SCOPE.sCharacter('santos_balloonist_scope').GetFullName] einschlug. Der Ballon fing Feuer und stürzte in die Tiefe. Nachdem die Trümmer beseitigt waren, wurde der Körper des [SCOPE.sCharacter('santos_balloonist_scope').GetFullName] gefunden. Nur unsere Astronomen freuten sich über dieses Ereignis, da sie die Überreste des Kometen untersuchen konnten."
 santos.673.g: "Wenn [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] nur Kometensinn hätte..."
 santos.673.h: "Oh Comet, du Teufelsbruder... Gibt es einen anderen Ballonfahrer, den wir sponsern könnten?"
 santos.674.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] stürzte beim Ballonfahren am Strand ab und starb."
 santos.674.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] stürzte bei einer Ballonfahrt am Strand ab und kam dabei ums Leben. Merkwürdigerweise wurde auf dem Wrack des Ballons ein Wal gefunden."
 santos.674.f: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] schwebte an einem herrlichen Tag an einem Strand entlang. Da [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] nicht zurückkehrte, wurden Suchtrupps ausgesandt. Nach kurzer Zeit fand man die Trümmer. Ballon und Korb lagen, seltsamerweise, unter den Überresten eines schwer verletzten Wals. Ein Alkoholiker aus dem Nachbardorf berichtete, er habe einen Wal und einen Petunientopf abstürzen sehen, und der Wal habe den Ballon frontal getroffen. Natürlich schenkte man dieser Geschichte keinen Glauben. Interessanterweise wurde in der Nähe ein unversehrter Petunientopf gefunden. Die Petunie sah etwas mitgenommen aus und wurde einem ortsansässigen Botaniker anvertraut.\n\n[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] wird für sein gutes Herz und seine Fähigkeit, in jeder Situation die Ruhe zu bewahren, in Erinnerung bleiben."
 santos.674.g: "Oh nein! Nicht schon wieder!"
 santos.674.h: "Hallo Bodenstation! Gibt es noch einen anderen Ballonfahrer, den wir sponsern könnten?"
 santos.676.t: "Unser Ballonfahrer ist gestorben."
 santos.676.d: "Nach jahrzehntelanger Tätigkeit als [concept_santos_balloonist] ist unser ehemaliger #b #r Ballonfahrer#!#! verstorben. Werden wir jemals einen so außergewöhnlichen Entdecker ersetzen können?"
 santos.691.t: "Ballonart"
 santos.691.d: "Ändern Sie den Ballontyp. Die Umstellung dauert ein halbes Jahr. Während dieser Zeit ist der Ballon außer Betrieb."
 santos.691.f: "Jeder Spezialballon gewährt einen Bonus von 5 % auf die Spezialisierung, nach der er benannt ist, und einen Malus von -5 %. Beispiel: Ein Distanzballon erzielt einen Bonus von #G +5%#! #V Distanz#!, aber einen Malus von #R -5%#! #V Höhe#! und #R -5%#! #V Zeit#!. Der Allround-Ballon hat weder Vor- noch Nachteile."
