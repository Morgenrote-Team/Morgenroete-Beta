 santos.653.d1: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] versuchte, mit [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]em Ballon so hoch wie möglich zu fliegen. Mit einer Höhe von #b #n [ROOT.Var('new_balloon_altitude_var').GetValue]#! Metern#! konnte [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] den bisherigen Landesrekord von #b #p [ROOT.Var('santos_balloon_altitude_record_var').GetValue]#! Metern#! nicht übertreffen. [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe|U] wird es sicherlich erneut versuchen."
 santos.653.d2: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] hat mit [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]em Ballon einen neuen Höhenrekord für unser Land aufgestellt! Mit einer Höhe von #b #p [ROOT.Var('new_balloon_altitude_var').GetValue]#! Meter#!, [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] übertraf den bisherigen Rekord unseres Landes von #b #p [ROOT.Var('santos_balloon_altitude_record_var').GetValue]#! Meter#!. Doch für den Weltrekord von #b #p [GetGlobalVariable('santos_balloon_altitude_record_global_var').GetValue]#! Metern#! hat es leider nicht gereicht [GetGlobalVariable('santos_balloon_altitude_record_holder_global_var').GetCountry.GetFlagTextIcon]."
