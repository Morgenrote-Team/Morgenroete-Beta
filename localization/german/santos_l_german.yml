 santos.652.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] hat [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]en ersten offiziellen Ballonflug für uns abgeschlossen und [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]en ersten Rekorde aufgestellt."
 santos.652.g: "Ein guter Anfang!"
 santos.653.t1: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] fails in attempt to break altitude record with balloon"
 santos.653.t2: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] has reached a new altitude record for our country"
 santos.653.t3: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] ist mit [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]em Ballon höher geflogen als je ein Mensch zuvor!"
 santos.653.d1: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] versuchte, mit [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]em Ballon so hoch wie möglich zu fliegen. Mit einer Höhe von #b #n [ROOT.Var('new_balloon_altitude_var').GetValue]#! Metern#! konnte [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] den bisherigen Landesrekord von #b #p [ROOT.Var('santos_balloon_altitude_record_var').GetValue]#! Metern#! nicht übertreffen. [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe|U] wird es sicherlich erneut versuchen."
 santos.653.d2: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] hat mit [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]em Ballon einen neuen Höhenrekord für unser Land aufgestellt! Mit einer Höhe von #b #p [ROOT.Var('new_balloon_altitude_var').GetValue]#! Meter#!, [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] übertraf den bisherigen Rekord unseres Landes von #b #p [ROOT.Var('santos_balloon_altitude_record_var').GetValue]#! Meter#!. Doch für den Weltrekord von #b #p [GetGlobalVariable('santos_balloon_altitude_record_global_var').GetValue]#! Metern#! hat es leider nicht gereicht [GetGlobalVariable('santos_balloon_altitude_record_holder_global_var').GetCountry.GetFlagTextIcon]."
 santos.653.d3: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] hat einen neuen Weltrekord für einen Höhenflug mit [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]em Ballon aufgestellt! Mit einer Höhe von #b #p [ROOT.Var('new_balloon_altitude_var').GetValue]#! Metern#! konnte [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] den bisherigen Landesrekord von #b #p [ROOT.Var('santos_balloon_altitude_record_var').GetValue]#! Metern#! übertreffen und den Weltrekord von #b #p [GetGlobalVariable('santos_balloon_altitude_record_global_var').GetValue]#! Metern deutlich übertreffen [GetGlobalVariable('santos_balloon_altitude_record_holder_global_var').GetCountry.GetFlagTextIcon].#!"
 santos.653.f1: "\"This time I did not succeed. But next time I will definitely make it!\"\n\n[SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloonist_altitude_flight_type')]"
 santos.653.f2: "\"Who cares about a record like that? I want the world record!\"\n\n[SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloonist_altitude_flight_type')]"
 santos.653.f3: "\"That was a cinch!\"\n\n[SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloonist_altitude_flight_type')]"
 santos.653.g: "Viel Glück beim nächsten Mal!"
 santos.653.h: "Gut gemacht!"
 santos.653.i: "Wunderbar! Herzlichen Glückwunsch!"
