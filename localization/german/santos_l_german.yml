 je_santos_balloon_ride: "Ballonfahrt"
 je_santos_balloon_ride_reason: "[ROOT.GetCountry.GetCustom('santos_balloon_research_active_type')] Neben Innovationen im Bereich der Ballons kann [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] Gebäude – vor allem Denkmäler, Stadtparks und Vergnügungsparks – mit Ballonattraktionen aufwerten.\n\nDies ist das Standardprojekt des [concept_santos_balloonist]s. Es ist aktiv, wenn der Ballonfahrer nicht mit einem anderen Projekt beschäftigt ist.\nJedes Mal, wenn der Fortschritt #V 24#! erreicht, erhalten wir einen kleinen Technologieschub. Wenn ein [concept_monument] vorhanden ist, [GetBuildingType('building_gaudi_park').GetName] oder [GetBuildingType('building_gaudi_luna').GetName] vorhanden ist, besucht der Ballonfahrer zufällig einen dieser Orte und wendet den Modifikator $santos_building_production_mult_modifier$ an. \n\nTechnologie für den nächsten Schub: [GetPlayer.MakeScope.GetCountry.GetCustom('santos_balloon_research_next_technology_type')]"
 je_santos_balloon_ride_active_loc: "#p Dieses Projekt ist derzeit aktiv.#!\n\n[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] unternimmt unterhaltsame Ausflüge."
 je_santos_balloon_ride_inactive_loc: "#n Dieses Projekt ist derzeit inaktiv.#! Es wird wieder aktiv, sobald der Ballonfahrer nicht mehr beschäftigt ist.\n\n[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] könnte lustige Fahrten unternehmen, wenn [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] nicht bereits beschäftigt wäre."
 santos_balloon_research_active_loc: "#p Dieses Projekt ist derzeit aktiv.#!\n\n[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] treibt derzeit die Forschung im Bereich Ballonfahren voran."
