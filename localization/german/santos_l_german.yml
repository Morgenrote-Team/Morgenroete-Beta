 santos.401.t: "Kreuzungsauswahl"
 santos.401.d: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] überlegt noch, mit welchen Ballon [concept_santos_balloon_crossing] [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] es versuchen soll. Das Ziel seiner Reise muss sorgfältig ausgewählt werden – es könnte seine letzte sein..."
 santos.401.f: "„Besorgt euch schnell Taft und Tauwerk, und ihr werdet einen der erstaunlichsten Anblicke der Welt sehen.“ – Joseph-Michel Montgolfier"
 santos.431.d: "Bei der Eroberung von [Scope.Var('santos_balloon_crossing_target_var').GetFlagName] hat [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] eine herausragende Leistung vollbracht: Nach vielen Stunden beharrlicher Bemühungen steht nun endlich fest, dass diese Herausforderung gemeistert wurde. Die Sonne strahlt hell am blauen Himmel und läutet einen neuen Tag für das Ballonfahren ein!"
 santos.431.g: "Eine bemerkenswerte Leistung für einen Ballonfahrer!"
