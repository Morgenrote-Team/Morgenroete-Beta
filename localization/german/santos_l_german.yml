 je_santos_balloon_record: "Ballonrekord"
 je_santos_balloon_record_reason: "Rekorde können in den Kategorien Höhe, Entfernung und Zeit aufgestellt werden. Nach einer gewissen Vorbereitungszeit versucht ein Ballonfahrer, in einer dieser Kategorien einen Rekord aufzustellen. Selbst wenn es ihm nur gelingt, den nationalen Rekord zu brechen, kann er mit einem kleinen technologischen Schub rechnen. Außerdem erhält er immer Erfahrungspunkte, deren Höhe sich nach seinem Erfolg richtet. \n\nEs besteht eine #YELLOW mäßige Wahrscheinlichkeit#!, dass Ballonfahrer bei einem Rekordflug ums Leben kommen."
 je_santos_balloon_crossing: "Ballonüberquerung"
 je_santos_balloon_crossing_reason: "#p [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] überquert gerade das [Scope.Var('santos_balloon_crossing_target_var').GetFlagName].#!\n\nBallonüberquerungen stellen für einen [concept_santos_balloonist] die größte Herausforderung dar. Jede [concept_santos_balloon_crossing] lässt sich in einen von drei Schwierigkeitsgraden einordnen – und diese Grade bestimmen das Potenzial für negative Ereignisse, die schnell katastrophale Ausmaße annehmen können, insbesondere auf den anspruchsvollsten Routen. Die [concept_academics_experience] und die [concept_character_trait]en eines Ballonfahrers bestimmen oft, welche Ereignisse ausgelöst werden. Beispielsweise neigen ehrgeizige Ballonfahrer dazu, beeindruckende Manöver durchzuführen, die die Flugdauer verkürzen können, während vorsichtige Ballonfahrer eher dazu neigen, Risiken zu minimieren. Zudem kann ein Ballonfahrer mit der Eigenschaft „Meteorologe“ – oder ein engagierter [concept_curie_meteorological_physicist] – sich vor den verheerendsten Wetterbedingungen schützen.\n\nWenn ein Ballonfahrer sein Glück zu sehr herausfordert, besteht die Gefahr, dass er auf der Reise ums Leben kommt. Nach einem Jahr gibt ein Ballonfahrer sein Vorhaben auf, ohne Ergebnisse erzielt zu haben.\n\nEs besteht eine #R erhebliche Wahrscheinlichkeit#!, dass Ballonfahrer bei einer Ballonüberquerung ums Leben kommen."
