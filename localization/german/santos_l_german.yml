 santos.651.x.tt: "You will receive events about the #yellow flights#! of your balloonist and their #yellow traits#! again. You can turn it back off at any time."
 santos.651.y: "Don't tell me about the #yellow deaths#! of my balloonist anymore"
 santos.651.y.tt: "You will no longer receive events about the #yellow deaths#! of your balloonist. A new balloonist will automatically be sponsored. You can turn it back on at any time."
