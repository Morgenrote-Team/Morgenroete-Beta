 santos.301.t: "Stratosphärenflüge: Ein durchschlagender Erfolg"
 santos.301.d: "Zur Überraschung vieler Beobachter, die den Ballonflug in die Stratosphäre als Selbstmordmission betrachteten, kehrte [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] heute von seiner Reise zurück. Die Kapsel landete auf einer Weide unweit von [SCOPE.sState('santos_balloon_state').GetCityHubName]. Insgesamt erreichte der Ballon eine Höhe von #p [ROOT.Var('new_balloon_altitude_var').GetValue]#! Metern."
 santos.301.f: "„Vor einigen Wochen stieg ein riesiger gelber Ballon von [SCOPE.sState('santos_balloon_state').GetCityHubName], [GetPlayer.GetNameNoFormatting], in den Himmel. Anstelle eines Korbs zog er eine luftdünne schwarz-silberne Aluminiumkugel hinter sich her. [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] wollte die Lüfte in 50.000 Fuß Höhe erkunden. Siebzehn Stunden später, nachdem man ihn bereits für tot gehalten hatte, kehrte [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] sicher aus einer geschätzten Höhe von [ROOT.Var('new_balloon_altitude_var').GetValue] zurück.'"
 santos.301.g: "Ehre sei unserem Helden [ROOT.Var('santos_balloonist_var').GetCharacter.GetLastNameNoFormatting]!"
 santos.302.t: "Stratosphärenflüge: Eine tödliche Katastrophe"
 santos.302.d: "Was viele Forscher und Journalisten bereits vermutet hatten, hat sich nun bestätigt: Der Stratosphärenflug war eine völlig verrückte Idee. Ob unser Ballonfahrer bei der harten Landung in der Nähe von [SCOPE.sState('santos_balloon_state').GetCityHubName] ums Leben kam, nachdem die Seile aufgrund von Materialermüdung gerissen waren, oder ob die Hitze im Inneren des Ballons und der Sauerstoffmangel in dieser Höhe zu [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis]em vorzeitigem Tod führten, muss noch durch eine Obduktion geklärt werden. Auf jeden Fall hat die Presse wegen des Vorfalls bereits einen großen Tag."
 santos.302.f: "„Studien, Warnungen und sogar gut gemeinte Ratschläge blieben ohne Wirkung. Der tragische Tod von [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] hätte wahrscheinlich verhindert werden können, hätte die Regierung dieses rücksichtslose Manöver verboten. Doch die Gier nach internationalem Ruhm und die völlige Blindheit, die durch die Aussicht, einen Ballonfahrer in neue Höhen zu schicken, hervorgerufen wurde, ließen selbst die vernünftigsten Einwände auf taube Ohren stoßen.\n\nWer sind diese Leute überhaupt? Wo bleibt ihr Verantwortungsbewusstsein? Es ist kein Zufall, dass dieses Land, sobald [SCOPE.sCharacter('santos_ruler_scope').GetFullNameNoFormatting] sein Amt antrat, aus allen Nähten auseinanderzufallen begann! Die Verantwortlichen wollen es euch nicht sagen, aber sie haben Angst, und das sollten sie auch, denn das Gefüge dieses Landes zerreißt an allen Ecken und Enden.“"
 santos.302.g: "Einen nationalen Trauertag ausrufen."
 santos_stratospheric_flight_success_modifier: "Stratosphärenflug: Erfolg"
 santos_stratospheric_flight_failure_modifier: "Stratosphärenflug: Fehlschlag"
 je_santos_stratospheric_flight: "Stratosphärenflug"
 je_santos_stratospheric_flight_reason: "Für die Ballonfahrer des 19. Jahrhunderts war ein spektakulärer Flug in die Stratosphäre noch nichts weiter als ein utopischer Traum. Doch mit den großen Fortschritten des Industriezeitalters und der Erfindung der Druckkapsel war selbst dieses Abenteuer kein unüberwindbares Hindernis mehr. In den 1930er Jahren stellten sich mehrere mutige Männer und Frauen aus verschiedenen Nationen dieser Herausforderung – und riskierten dabei ihr Leben. Die Regeln für einen Höhenflug unterscheiden sich nicht wesentlich von denen von [concept_santos_balloon_crossing], mit dem Unterschied, dass diese Reise anspruchsvoller ist und nur mit Triumph oder dem Tod endet. Zudem können hier die ultimativen Höhenrekorde aufgestellt werden – bis zu 22.000 Meter sind möglich!"
 santos_stratospheric_flight_on_fail_tt: "Der Stratosphärenballon erleidet ein tödliches Unglück."
 santos_stratospheric_flight_event_normal_ascent_icon_flag: "@santos_event_log_positive_normal_ascent_icon!"
 santos_stratospheric_flight_event_normal_ascent_title_flag: "Normaler Aufstieg"
 santos_stratospheric_flight_event_normal_ascent_flag: "#t $santos_stratospheric_flight_event_normal_ascent_title_flag$#!\nDer Ballon steigt sanft in die Stratosphäre auf."
 santos_stratospheric_flight_event_boost_ascent_icon_flag: "@santos_event_log_positive_boost_ascent_icon!"
 santos_stratospheric_flight_event_boost_ascent_title_flag: "Rasanter Anstieg"
 santos_stratospheric_flight_event_boost_ascent_flag: "#t $santos_stratospheric_flight_event_boost_ascent_title_flag$#!\nDem Ballonfahrer ist es gelungen, die Höhe des Ballons erfolgreich zu steigern.\n\n#b Die folgenden Faktoren erhöhen die Wahrscheinlichkeit dieses Ergebnisses:#!\n[concept_santos_balloonist] verfügt über die [concept_character_trait] $santos_balloonist_experienced$, $innovative$ oder $ambitious$."
 santos_stratospheric_flight_event_altitude_improvisation_icon_flag: "@santos_event_log_positive_altitude_improvisation_icon!"
 santos_stratospheric_flight_event_altitude_improvisation_title_flag: "Höhenimprovisation"
 santos_stratospheric_flight_event_altitude_improvisation_flag: "#t $santos_stratospheric_flight_event_altitude_improvisation_title_flag$#!\nDank des technischen Fachwissens der Besatzung konnten die mit dem Ballonflug verbundenen Risiken auf ein Minimum reduziert werden.\n\n#b Die folgenden Faktoren erhöhen die Wahrscheinlichkeit dieses Ergebnisses:#!\n[concept_santos_balloonist] hat die [concept_character_trait] $cautious$, $innovative$ oder $engineer$. Ein [concept_curie_meteorological_physicist] mit der [concept_character_trait] $innovative$, $erudite$ oder $meticulous$ könnte ebenfalls hilfreich sein."
 santos_stratospheric_flight_event_slow_ascent_icon_flag: "@santos_event_log_negative_slow_ascent_icon!"
 santos_stratospheric_flight_event_slow_ascent_title_flag: "Langsamer Aufstieg"
 santos_stratospheric_flight_event_slow_ascent_flag: "#t $santos_stratospheric_flight_event_slow_ascent_title_flag$#!\nAus unbekannten Gründen steigt der Ballon nicht so schnell auf wie ursprünglich berechnet."
 santos_stratospheric_flight_event_broken_rope_icon_flag: "@santos_event_log_negative_broken_rope_icon!"
 santos_stratospheric_flight_event_broken_rope_title_flag: "Gebrochenes Seil"
 santos_stratospheric_flight_event_broken_rope_flag: "#t $santos_stratospheric_flight_event_broken_rope_title_flag$#!\nEin gerissenes Seil erschwert die Steuerung des Ballons und macht es insbesondere schwierig, das Gas ordnungsgemäß abzulassen.\n\n#b Die folgenden Faktoren erhöhen die Wahrscheinlichkeit dieses Ergebnisses:#!\n[concept_santos_balloonist] weist die [concept_character_trait] $reckless$, $wrathful$ oder $arrogant$ auf oder hat eine #V negative Eigenschaft wie eine Krankheit oder eine Sucht#!.\n\n#b Die folgenden Faktoren machen dieses Ergebnis weniger wahrscheinlich:#!\n[concept_santos_balloonist] hat die [concept_character_trait] $curie_meteorological_physicist$ oder $engineer$. Ein [concept_curie_meteorological_physicist] könnte diese Probleme bereits vor dem Start entdecken."
 santos_stratospheric_flight_event_defective_valve_icon_flag: "@santos_event_log_negative_defective_valve_icon!"
 santos_stratospheric_flight_event_defective_valve_title_flag: "Defektes Ventil"
 santos_stratospheric_flight_event_defective_valve_flag: "#t $santos_stratospheric_flight_event_defective_valve_title_flag$#!\nEin defektes Ventil führt dazu, dass der Flugplan des Stratosphärenballons vom ursprünglichen Plan abweicht.\n\n#b Die folgenden Faktoren machen dieses Ergebnis wahrscheinlicher:#!\n[concept_santos_balloonist] hat die [concept_character_trait] $reckless$, $wrathful$, $arrogant$ auf oder eine #V negative Eigenschaft wie eine Krankheit oder eine Sucht#!.\n\n#b Die folgenden Faktoren machen dieses Ergebnis weniger wahrscheinlich:#!\n[concept_santos_balloonist] hat die [concept_character_trait] $curie_meteorological_physicist$ oder $engineer$. Ein [concept_curie_meteorological_physicist] könnte diese Probleme bereits vor dem Start entdecken."
 santos_stratospheric_flight_event_heat_buildup_icon_flag: "@santos_event_log_negative_heat_buildup_icon!"
 santos_stratospheric_flight_event_heat_buildup_title_flag: "Wärmeentwicklung"
 santos_stratospheric_flight_event_heat_buildup_flag: "#t $santos_stratospheric_flight_event_heat_buildup_title_flag$#!\nOhne eine schützende Wolkendecke brennt die Sonne gnadenlos auf den Ballon herab. Die Hülle und das Traggas erhitzen sich erheblich, und das Gas dehnt sich rasch aus.\n\n#b Die folgenden Faktoren verringern die Wahrscheinlichkeit dieses Ergebnisses:#!\n[GetPlayer.GetAltName('NOM')] hat [GetTechnology('zeppelins').GetName] und [GetTechnology('curie_rocket_science_tech').GetName] erforscht."
 santos_stratospheric_flight_event_material_fatigue_icon_flag: "@santos_event_log_negative_material_fatigue_icon!"
 santos_stratospheric_flight_event_material_fatigue_title_flag: "Materialermüdung"
 santos_stratospheric_flight_event_material_fatigue_flag: "#t $santos_stratospheric_flight_event_material_fatigue_title_flag$#!\nDer Höhenflug bringt das Ballonmaterial an seine absoluten Grenzen: Das Risiko von Rissen und anderen Schäden steigt erheblich!\n\n#b Die folgenden Faktoren erhöhen die Wahrscheinlichkeit dieses Ergebnisses:#!\n[GetPlayer.GetAltName('NOM')] hat [GetTechnology('vulcanization').GetName] und [GetTechnology('art_silk').GetName] erforscht."
 santos_stratospheric_flight_event_hydrogen_fire_icon_flag: "@santos_event_log_negative_hydrogen_fire_icon!"
 santos_stratospheric_flight_event_hydrogen_fire_title_flag: "Wasserstofffeuer!"
 santos_stratospheric_flight_event_hydrogen_fire_flag: "#t $santos_stratospheric_flight_event_hydrogen_fire_title_flag$#!\nDie schlimmste Katastrophe, die bei einer Ballonfahrt passieren kann, ist eingetreten: Der Wasserstoff hat Feuer gefangen! Das bedeutet den sicheren Tod für die Besatzung...\n\n#b Die folgenden Faktoren machen dieses Ergebnis weniger wahrscheinlich:#!\n[GetPlayer.GetAltName('NOM')] hat eine [GetBuildingType('building_mendelejew_helium_plant').GetName]. [concept_santos_balloonist] hat die [concept_character_trait] $curie_meteorological_physicist$ oder $engineer$. Ein [concept_curie_meteorological_physicist] könnte diese Probleme bereits vor dem Start entdecken."
 je_santos_balloon_crossing_complete_tt: "@santos_ballooning_progress! #V #BLUE Ballon-Fortschritt#!#! hat #V [GetPlayer.MakeScope.ScriptValue('santos_balloon_crossing_goal_value')|0]#! erreicht."
 replace_balloonist_tt: "Ersetze [concept_santos_balloonist] durch einen neuen."
 santos.511.t: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetLastName] wurde in Afrika versklavt!"
 santos.511.d: "Unser Ballonpilot, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName], wird nun schon seit mehreren Monaten vermisst. Zeitungen berichteten heute, dass [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] offenbar während seines letzten Abenteuerflugs über Afrika verschollen ist. Es scheint, als sei [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] in [SCOPE.sCountry('santos_balloonist_slaver_scope').GetName] abgestürzt zu sein, dort in die Sklaverei verkauft worden zu sein und nun zu harter Arbeit auf den Feldern gezwungen zu werden!"
 santos.511.f: "Historisch gesehen gab es 1853 tatsächlich Artikel in verschiedenen Zeitungen, die behaupteten, Arban sei in Afrika versklavt worden. Dafür gab es jedoch keine Beweise. Was genau mit Arban geschah, ist unklar, aber höchstwahrscheinlich ertrank er im Mittelmeer."
 santos.511.g: "Wir werden [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHim] aus der Sklaverei befreien!"
 santos.511.h: "Lasst uns einfach bezahlen und die Sache hinter uns bringen..."
 santos.511.i: "Das Leben eines Ballonfahrers ist all diese Mühe nicht wert."
 santos.512.t: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetLastName] wurde aus der Sklaverei befreit"
 santos.512.d1: "Eine kleine Truppe wurde damit beauftragt, [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] aus der Gefangenschaft zu befreien. Nach einem kurzen Gefecht gelang es ihnen, [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHim] und mehrere andere Europäer zu befreien und zu Pferd zu fliehen. Bevor die [SCOPE.sCountry('curtiss_arban_slaver_scope').GetAdjective]en Behörden reagieren konnten, waren sie bereits auf einem Schiff angekommen, das sie nach Hause brachte. Aufgrund [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis]er langen Gefangenschaft ist [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] erschöpft und geschwächt, doch [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] konnte uns von [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis]en abenteuerlichem Ballonflug berichten."
 santos.512.d2: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] ist nach Hause zurückgekehrt. Aufgrund [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis]en langen Gefangenschaft ist [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] erschöpft und geschwächt, aber [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] konnte uns von seinem abenteuerlichen Ballonflug berichten."
 santos.512.f: "„Ich wurde vom Wind aufs offene Meer hinausgetrieben. Da ich nach Süden abgetrieben wurde, beschloss ich, die Balearen anzusteuern. Doch der Wind war stark, und so trieb er mich an die nordafrikanische Küste, wo ich landen konnte. Leider waren die Einwohner dort nicht sehr freundlich. Ist schon mal jemand über das Mittelmeer geflogen? Habe ich einen Rekord aufgestellt?“"
 santos.512.g: "Eine erfolgreiche Rettungsaktion!"
 santos.512.h: "Willkommen zurück, [ROOT.Var('santos_balloonist_var').GetCharacter.GetLastName]!"
 santos.701.t: "Erste Luftaufnahmen aus einem Ballon"
 santos.701.d: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] hat [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis]e zwei Leidenschaften miteinander verbunden: das Ballonfahren und die Fotografie. [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe|U] konnte die Frontlinien in [SCOPE.sState('santos_balloon_state').GetCityHubName] fotografieren und dadurch wertvolle militärische Informationen zu sammeln."
 santos.701.f: "Nadar machte 1859 bei der Schlacht von Solferino seine ersten Luftaufnahmen. Im Jahr 1863 wurde Nadar Präsident der #b Société d'encouragement pour la locomotion aérienne au moyen d'appareils plus lourds que l'air#!, einer Gesellschaft, die sich der Luftfahrt widmete. Sekretär der Société war kein Geringerer als Jules Verne, der sich von Nadars Ballons zu seiner Erzählung „#b Fünf Wochen im Ballon#!“ inspirieren ließ."
 santos.701.g: "Die Welt von oben sieht so anders aus!"
 santos.702.t: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] befördert Passagiere über die Alpen"
 santos.702.d: "Während eines Flugs mit Passagieren flog der Schweizer [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] die Passagiere über die Alpen. Dabei überquerte [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] einige der höchsten Gipfel der Alpen. [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe|U] ist nun ein Star der Ballonfahrt."
 santos.702.f: "Eduard Spelterini, geboren als Albert Schweizer, absolvierte in seiner Jugend eine Ausbildung zum Ballonfahrer. Nachdem er seinen ersten eigenen Ballon namens „Urania“ gebaut hatte, bereiste er Europa, um der Oberschicht die Welt aus der Vogelperspektive zu zeigen. Üblicherweise gehörte ein kleines Picknick mit Koteletts und Champagner dazu. Spelterini begann auch mit dem Fotografieren von Luftbildern, doch seine Passagierflüge über die Alpen trugen am meisten zu seinem Ruhm bei."
 santos.702.g: "Eine unglaubliche Aussicht!"
 santos.703.t: "Erstflug eines lenkbaren Luftschiffs"
 santos.703.d: "Ein großes Problem bei Ballonfahrten ist, dass sie immer von günstigen Windverhältnissen abhängen. Der Ballon gerät viel zu leicht ab, was immer wieder zu Unfällen führt. [ROOT.Var('tesla_engineer_var').GetCharacter.GetFullName] versuchte, eine Lösung für dieses Problem zu finden, indem er ein längliches Luftschiff mit einer Dampfmaschine und einem Ruder zur Steuerung konstruierte. Mit seinem „[ROOT.Var('tesla_engineer_var').GetCharacter.GetLastNameNoFormatting]-Luftschiff“ unternahm [ROOT.Var('tesla_engineer_var').GetCharacter.GetSheHe] einen 27 Kilometer langen Flug von Paris nach Élancourt. Da das Luftschiff sehr langsam ist, ist ein Flug gegen den Wind bislang nicht möglich. Wer weiß, in welche Richtung sich diese Luftschiffe weiterentwickeln werden?"
 santos.703.f: "Mit seinem Flug am 24. September 1852 gelang Giffard der erste Flug mit einem motorisierten und steuerbaren Luftschiff. Der Antrieb durch eine Dampfmaschine war jedoch sehr schwach, weshalb sich das Luftschiff noch nicht durchsetzen konnte. Erst mit der Erfindung des Verbrennungsmotors konnte der Traum vom Luftschiff Wirklichkeit werden."
 santos.703.g: "Vielleicht werden diese lenkbaren Ballons bald den Himmel erobern!"
 santos.677.t: "Tod durch Sauerstoffmangel"
 santos.677.d: "[ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName] kehrte nie von [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHis]em Höhenflug zurück. Einige Tage später fanden Bauern [ROOT.Var('santos_balloonist_var').GetCharacter.GetHerHim] auf einem abgelegenen Bauernhof, auf dem der Ballon abgestürzt war. Der Ballonfahrer wurde leblos im Korb aufgefunden – [ROOT.Var('santos_balloonist_var').GetCharacter.GetSheHe] war bereits vor dem Absturz verstorben."
 santos.677.f: "Vor der Erfindung der Sauerstoffflaschen führte Sauerstoffmangel in großen Höhen zu schwerer Höhenkrankheit. Schwindel, Lähmungen und Bewusstlosigkeit machten die Ballonfahrer schnell handlungsunfähig. Der Zenith-Flug endete 1875 tragisch: Sivel und Croce-Spinelli verloren das Bewusstsein, konnten keinen Ballast abwerfen und starben an Sauerstoffmangel. Ihr Kollege Tissandier überlebte zwar knapp, doch das Erlebnis prägte ihn für den Rest seines Lebens nachhaltig, und er blieb taub.\n\n#R Um einen solchen tödlichen Unfall in großer Höhe zu verhindern, erforschen Sie [GetTechnology('electric_arc_process').GetName], um #V Sauerstoffflaschen#! zu erhalten.#!"
 santos.677.g: "Was für ein waghalsiges Unterfangen!"
 santos.677.h: "Was für ein schrecklicher Tod – aber gibt es einen anderen Ballonfahrer, der bereit wäre, für uns zu arbeiten?"
 santos.692.t: "Ballontreibstoff"
 santos.692.d: "Wechseln Sie den Treibstoff Ihres Ballons. Die Umstellung dauert ein halbes Jahr. Während dieser Zeit ist der Ballon außer Betrieb."
 santos.692.f: "Kohlegas ist ein weit verbreitetes Gas für Heißluftballons, das in den Anfängen des Ballonfahrens für das Aufstellen von Distanz- und Geschwindigkeitsrekorden vollkommen ausreichte, jedoch erhebliche Einschränkungen beim Aufstieg in große Höhen mit sich bringt. Wasserstoff wurde bereits in den Anfängen der Ballonfahrt verwendet und führte zu einigen atemberaubenden Höhenrekorden – er ist, ganz einfach gesagt, das „Höhen-Gas“ schlechthin; seine Herstellung ist jedoch sehr teuer und arbeitsintensiv. [concept_curtiss_helium] weist ähnliche Eigenschaften wie Wasserstoff auf, wenn auch in etwas schwächerem Maße. Es erhöht jedoch die Sicherheit eines Ballons erheblich und verhindert Wasserstoffbrände."
 santos.692.g: "Wir brauchen Kohlegas."
 santos.692.h: "Wasserstoff ist König."
 santos.692.i: "Helium ist alles!"