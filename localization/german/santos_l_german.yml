 curtiss.600.t: "Ballonfahrt von Vauxhall Gardens nach Weilburg"
 curtiss.600.d: "Der englische Ballonfahrer Charles Green startete mit zwei Besatzungsmitgliedern im Royal-Vauxhall-Ballon von den Vauxhall Gardens in London. Dank günstiger Winde überquerte der Ballon den Ärmelkanal und erreichte Weilburg in Nassau, Deutschland. Mit einer zurückgelegten Strecke von rund 800 Kilometern (500 Meilen) ist dies die längste jemals unternommene Ballonfahrt."
 curtiss.600.f: "Die Fahrt des Royal Fauxhall war ein unglaublicher Erfolg. Der Distanzrekord sollte 80 Jahre lang Bestand haben.\nDie Fahrt war nicht ungefährlich. Ballonfahren im 19. Jahrhundert war besonders gefährlich, da man nie wusste, wo man landen würde. Daher nahm Green reichlich Proviant mit. Er führte außerdem eine Tonne Sand als Ballast, ein 300 Meter langes Seil, Barometer, Teleskope, verschiedene alkoholische Getränke, Mäntel und allerlei andere Dinge mit. Neben all dem Gepäck mussten sich Green und seine beiden Begleiter, Thomas Monck Mason und Robert Hollond, in die Gondel quetschen.\nNach ihrer Ankunft in Weilburg wurde der Ballon mithilfe der Einheimischen – und des mitgebrachten Schnapses – entladen und für die Rückreise vorbereitet. In Weilburg wurden die drei herzlich empfangen – unter anderem vom Prinzen von Nassau. Die Rückreise mussten sie mit der Kutsche antreten, da für den Ballon kein Kohlegas zur Verfügung stand."
 curtiss.600.g: "Ein weiterer Rekord für Großbritannien!"
 curtiss.601.t: "Erfindung des Rip Panels"
 curtiss.601.d: "Balloon enthusiast and inventor [SCOPE.sCharacter('santos_balloonist_scope').GetFullName] has unveiled his latest invention to make ballooning much safer. The rip panel is a piece of the balloon envelope that is only lightly attached to the balloon. When the balloon lands, the piece can be torn off. This allows the gas in the balloon to escape at lightning speed. This prevents the balloon from dragging on the ground, getting caught somewhere or crashing into something."
 curtiss.601.f: "Vor der Erfindung der Aufreißklappe mussten Ballonfahrer ihre Ballons entweder mit Ankern sichern oder auf den Ballon klettern und dort ein Ventil öffnen, um die Luft entweichen zu lassen. Dies war äußerst gefährlich, da das Gas schnell entwich und der Ballon zusammenfiel. Immer wieder kam es vor, dass Ballonfahrer im Ballon eingeklemmt wurden und starben. Die Erfindung der Aufreißklappe am 27. April 1839 machte das Ballonfahren wesentlich sicherer."
 curtiss.601.g: "Großartige Arbeit! Hoffentlich hören wir bald wieder von diesem Mann!"
 curtiss.601.h: "Wir brauchen eigentlich einen neuen Ballonfahrer!"
 curtiss.601.h.tt: "The experienced balloonist [SCOPE.sCharacter('santos_balloonist_scope').GetFullName] becomes our new sponsored balloonist"
 curtiss.602.t: "Erste Alpenüberquerung im Ballon durch Francisque Arban"
 curtiss.602.d: "Der französische Ballonfahrer Francisque Arban überquerte als Erster die Alpen in einem Wasserstoffballon. Am Abend des 2. September 1849 startete er in Marseille und flog ostwärts. Um die Cottischen Alpen zu überqueren, stieg sein Ballon auf eine Höhe von etwa 4600 Metern. Am nächsten Morgen landete er gegen 2:30 Uhr in der Nähe von Turin."
 curtiss.602.f: "Die Alpenüberquerung war ein Rekord, der lange Zeit ungebrochen blieb. Erst 1924 wurde sie wiederholt.\nArban hatte bereits vor seiner Alpenüberquerung Erfahrung mit Ballonfahrten gesammelt. Seine ersten Versuche unternahm er im Alter von 17 Jahren um 1832, die meisten seiner Ballonfahrten absolvierte er jedoch 1845 und 1849 in Italien. 1846 musste er von Fischern aus dem Meer gerettet werden, nachdem er in der Nähe von Triest vom Kurs abgekommen war."
 curtiss.602.g: "Großartig! Ein wahrer Held Frankreichs!"
 curtiss.603.t: "Francisque Arban verschwand während einer Ballonfahrt über dem Mittelmeer."
 curtiss.603.d: "Nur einen Monat nach seiner Alpenüberquerung im Heißluftballon ist Francisque Arban verschwunden. Nach dem Start in Barcelona wurde er vom Wind in Richtung Mittelmeer abgetrieben. Seitdem fehlt von ihm jede Spur. Sollten wir Rettungsteams zur Suche nach Arban entsenden?"
 curtiss.603.f: "Francisque Arbans Ballon stieg am 7. Oktober 1849 über dem offenen Meer auf. Seitdem fehlt von ihm jede Spur. Vermutlich kam er bei dieser Ballonfahrt ums Leben. Was genau geschah, ist jedoch unbekannt."
 curtiss.603.g: "Schrecklich! Schickt sofort Schiffe los, um ihn zu suchen!"
 curtiss.603.h: "Er war sich des Risikos bewusst. Wir können nichts mehr tun."
 curtiss.604.t: "Francisque Arban rettete"
 curtiss.604.d1: "Unsere Suche war erfolgreich! Francisque Arban wurde von einem unserer Schiffe gefunden! Glücklicherweise hatte Arban geistesgegenwärtig weiter Gegenstände aus seinem Ballon geworfen, die auf der Wasseroberfläche trieben. Eines unserer Schiffe fand die Spur und folgte ihr. Arban hatte sich mehrere Tage an seinem Korb festgehalten, den er aus dem Ballonstoff befreit hatte. Dank einiger Vorräte im Ballon hatte er das Abenteuer überlebt."
 curtiss.604.d2: "Ein Fischerboot hat Francisque Arbans Ballon vor der Küste Barcelonas gefunden. Sein Zustand ist den Umständen entsprechend gut, aber er ist stark dehydriert. Hoffentlich erholt er sich bald!"
 curtiss.604.f: "„Das war die aufregendste Ballonfahrt meines Lebens! Ich hoffe, ich habe dabei einen Rekord gebrochen!“"
 curtiss.604.g: "Was für ein Glück! Willkommen zurück, Arban!"
 curtiss.605.t: "Zusatzinformation: Arban in Afrika versklavt!"
 curtiss.605.d: "Verschiedene spanische Zeitungen berichten, dass Arban nicht im Mittelmeer ertrunken, sondern mit seinem Ballon nach Afrika gelangt und dort versklavt wurde. Immer mehr Briefe erreichen uns von Bürgern, die uns bitten, nach Arban zu suchen und ihn aus der Sklaverei zu befreien."
 curtiss.605.f: "Historisch gesehen gab es 1853 tatsächlich Artikel in verschiedenen Zeitungen, die behaupteten, Arban sei in Afrika versklavt worden. Dafür gab es jedoch keine Beweise. Was genau mit Arban geschah, ist unklar, aber höchstwahrscheinlich ertrank er im Mittelmeer."
 curtiss.605.g: "Wir müssen Arban finden!"
 curtiss.605.h: "Das sind unglaubwürdige Geschichten, die niemand glauben sollte."
 curtiss.606.t: "Arban was enslaved in [SCOPE.sCountry('curtiss_arban_slaver_scope').GetName]"
 curtiss.606.d: "Our research has revealed that Arban is indeed still alive. He was found in [SCOPE.sCountry('curtiss_arban_slaver_scope').GetName], where he has to work as a slave in the fields. The owners have offered that we could buy him from them for an immense sum. Of course, we could also just free him by force."
 curtiss.606.f: "Historisch gesehen wurden die Zeitungsberichte nicht weiter verfolgt. Daher ist unklar, ob Arban nicht versklavt wurde. Es ist jedoch sehr unwahrscheinlich."
 curtiss.606.g: "Wir werden ihn aus der Sklaverei befreien!"
 curtiss.606.h: "Lasst uns einfach bezahlen und die Sache hinter uns bringen..."
 curtiss.607.t: "Arban wurde aus der Sklaverei befreit und kehrte nach Hause zurück."
 curtiss.607.d1: "A small squad was assigned to free Arban from captivity. After a brief skirmish, they were able to free Arban and several other Europeans and escaped on horseback. Before the [SCOPE.sCountry('curtiss_arban_slaver_scope').GetAdjective] authorities could react, they had already arrived on a ship that took them home. Due to his long captivity he is worn out and weak, but he was able to tell us about his adventurous balloon flight. His know-how will certainly help us."
 curtiss.607.d2: "Arban ist wieder zu Hause. Durch seine lange Gefangenschaft ist er erschöpft und schwach, konnte uns aber von seiner abenteuerlichen Ballonfahrt berichten. Sein Wissen wird uns sicherlich weiterhelfen."
 curtiss.607.f: "„Ich wurde vom Wind aufs offene Meer hinausgetrieben. Da ich nach Süden abgetrieben wurde, beschloss ich, die Balearen anzusteuern. Doch der Wind war stark, und so trieb er mich an die nordafrikanische Küste, wo ich landen konnte. Leider waren die Einwohner dort nicht sehr freundlich. Ist schon mal jemand über das Mittelmeer geflogen? Habe ich einen Rekord aufgestellt?“"
 curtiss.607.g: "Eine erfolgreiche Rettungsaktion!"
 curtiss.607.h: "Willkommen zurück, Arban!"
 curtiss.608.t: "Keine Spuren von Arban"
 curtiss.608.d: "Nach monatelanger Suche haben wir noch immer keine Spur von Arban gefunden. Es scheint, dass die Geschichten über seine Versklavung in Nordafrika erfunden sind. Francisque Arban ist zweifellos tot."
 curtiss.608.f: "\"Franzosen? Natürlich! Wir verkaufen viele Franzosen. Welchen möchten Sie? Sie sind alle stark, sie waren Seeleute!\""
 curtiss.608.g: "Suche abbrechen."
 curtiss.609.t: "Nadar macht die ersten Luftaufnahmen aus einem Ballon"
 curtiss.609.d: "Der französische Fotograf Nadar hat seine beiden Leidenschaften, Ballonfahren und Fotografie, miteinander verbunden. Ihm ist es gelungen, Luftaufnahmen zu machen, die die Welt von oben zeigen – aus einer Perspektive, die nur wenige Menschen je zuvor gesehen haben."
 curtiss.609.f: "Nadar took his first aerial photographs in 1859 at the Battle of Solferino. In 1963, Nadar became president of the #b Société d'encouragement pour la locomotion aérienne au moyen d'appareils plus lourds que l'air#!, a society dedicated to aviation. The secretary of the Société was none other than Jules Verne, who was inspired by the balloons of Nadar to write his story \"#b Five weeks in a balloon#!\"."
 curtiss.609.g: "Die Welt von oben sieht so anders aus!"
 curtiss.610.t: "Nadars „Le Géant“ stürzt in Hannover ab"
 curtiss.610.d: "Nach einem nervenaufreibenden und extrem schwierigen Flug von Paris nach Hannover stürzte Nadar mit seinem Riesenballon „Le Géant“ auf einem Feld in Hannover ab. Er und seine Frau wurden schwer verletzt. Hoffentlich erholt er sich bald und kann wieder Ballon fahren!"
 curtiss.610.f: "„Le Géant“ war ein 60 Meter hoher Ballon, der treffend „Der Riese“ genannt wurde. Er wurde von Eugène Godard gebaut und von Nadar geflogen. Bereits bei seiner zweiten Fahrt stürzte „Le Géant“ ab. Trotz seiner schweren Verletzungen und des stark beschädigten Ballons reparierte Nadar „Le Géant“ und flog erneut damit. 1867 nahm er bis zu zwölf Passagiere auf seine Ballonfahrten mit und servierte ihnen kaltes Hühnchen und Wein."
 curtiss.610.g: "Was für ein schrecklicher Unfall!"
 curtiss.611.t: "Glaisher und Coxwell stellen Rekord für den höchsten Ballonflug auf"
 curtiss.611.d: "Der Meteorologe James Glaisher und der Ballonfahrer Henry Tracey Coxwell stellten einen Rekord für die höchste Ballonfahrt auf. Gemeinsam stiegen sie in einem Ballon auf eine geschätzte Höhe von 11.270 Metern. In 8.800 Metern Höhe verlor Glaisher bereits das Bewusstsein. Coxwell gelang es nur mit großer Mühe, den Ballon zu senken. Glücklicherweise überlebten die beiden ihr Abenteuer."
 curtiss.611.f: "1862 stiegen Glaisher und Coxwell mit dem Ballon „Mammoth“ auf. Sie waren von der British Association for the Advancement of Science beauftragt worden, Experimente in der oberen Atmosphäre durchzuführen. In einer Höhe von 8800 Metern (29.000 Fuß) wurde Glaisher ohnmächtig, und Coxwell verlor das Gefühl in seinen Händen. Da sich die Ventilleine verheddert hatte, konnte Coxwell den Ballon nicht vom Korb ablassen. Er musste auf die Takelage klettern und das Ventil dort mit den Zähnen öffnen. Dabei verlor er das Bewusstsein, doch der Ballon begann zu sinken. Nach 15 Minuten sank der Ballon sicher zu Boden."
 curtiss.611.g: "Sie haben Glück, überlebt zu haben!"
 curtiss.612.t: "Eduard Spelterini befördert Passagiere über die Alpen."
 curtiss.612.d: "Bei einem Flug mit Passagieren überquerte der Schweizer Eduard Spelterini die Alpen und passierte dabei einige der höchsten Gipfel des Gebirges. Spelterini ist heute ein Star der Ballonfahrt."
 curtiss.612.f: "Eduard Spelterini, geboren als Albert Schweizer, absolvierte in seiner Jugend eine Ausbildung zum Ballonfahrer. Nachdem er seinen ersten eigenen Ballon namens „Urania“ gebaut hatte, bereiste er Europa, um der Oberschicht die Welt aus der Vogelperspektive zu zeigen. Üblicherweise gehörte ein kleines Picknick mit Koteletts und Champagner dazu. Spelterini begann auch mit dem Fotografieren von Luftbildern, doch seine Passagierflüge über die Alpen trugen am meisten zu seinem Ruhm bei."
 curtiss.612.g: "Eine unglaubliche Aussicht!"
 curtiss.613.t: "Erstflug eines von Giffard gebauten lenkbaren Luftschiffs"
 curtiss.613.d: "Ein großes Problem von Ballonfahrten ist ihre Abhängigkeit von günstigen Winden. Der Ballon driftet allzu leicht ab, was immer wieder zu Unfällen führt. Henri Giffard versuchte, dieses Problem zu lösen, indem er ein längliches Luftschiff mit Dampfmaschine und Ruder konstruierte. Mit seinem „Giffard-Luftschiff“ unternahm Giffard einen 27 Kilometer langen Flug von Paris nach Élancourt. Da das Luftschiff sehr langsam ist, ist ein Flug gegen den Wind bisher nicht möglich. Wer weiß, wohin sich diese Luftschiffe entwickeln werden?"
 curtiss.613.f: "Mit seinem Flug am 24. September 1852 gelang Giffard der erste Flug mit einem motorisierten und steuerbaren Luftschiff. Der Antrieb durch eine Dampfmaschine war jedoch sehr schwach, weshalb sich das Luftschiff noch nicht durchsetzen konnte. Erst mit der Erfindung des Verbrennungsmotors konnte der Traum vom Luftschiff Wirklichkeit werden."
 curtiss.613.g: "Vielleicht werden diese lenkbaren Ballons bald den Himmel erobern!"
 curtiss.614.t_brussels: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] considers moving to Brussels"
 curtiss.614.t_capital: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] considers moving to [SCOPE.sCountry('curtiss_august_piccard_destination').GetCapital.GetCityHubName]"
 curtiss.614.d_brussels: "One of our most important scientists, [SCOPE.sCharacter('santos_balloonist_scope').GetFullName], has been asked by the Free University of Brussels to become a professor there. The university promises large financial resources that would allow Piccard to use balloons to study the stratosphere even more thoroughly. Piccard seems eager to accept the offer. This would mean losing a great scientist who has extensive experience in ballooning as well."
 curtiss.614.d_capital: "One of our most important scientists, [SCOPE.sCharacter('santos_balloonist_scope').GetFullName], has been asked by the Free University of [SCOPE.sCountry('curtiss_august_piccard_destination').GetCapital.GetCityHubName] to become a professor there. The university promises large financial resources that would allow Piccard to use balloons to study the stratosphere even more thoroughly. Piccard seems eager to accept the offer. This would mean losing a great scientist who has extensive experience in ballooning as well."
 curtiss.614.f: "Piccard wurde 1922 an die Freie Universität Brüssel berufen, wo er sich neben seiner Lehrtätigkeit der Stratosphärenforschung mit Ballons widmete. In dieser Forschung arbeitete er auch mit seinem Freund Albert Einstein zusammen, mit dem er Experimente entwickelte.\nZusätzlich zu seiner Stratosphärenforschung erfand Piccard ein Messgerät für Radioaktivität und einen hochpräzisen Seismografen. Er befasste sich auch mit Atomphysik und sagte ein drittes Uranisotop voraus, das später entdeckt wurde und heute als Uran-235 bekannt ist.\nIn Brüssel inspirierten ihn seine Vorlesungen auch zur Comicfigur Professor Bienlein."
 curtiss.614.g: "Wir dürfen Piccards Angebot, ihn zu sponsern, nicht verlieren!"
 curtiss.614.h: "Wir haben bereits einen großartigen Ballonfahrer!"
 curtiss.614.g.tt: "The experienced balloonist [SCOPE.sCharacter('santos_balloonist_scope').GetFullName] becomes our new sponsored balloonist."
 curtiss.615.t: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] moved to [SCOPE.sCountry('curtiss_august_piccard_destination').GetCapital.GetCityHubName]"
 curtiss.615.d: "The Swiss scientist [SCOPE.sCharacter('santos_balloonist_scope').GetFullName], moved to [SCOPE.sCountry('curtiss_august_piccard_destination').GetCapital.GetCityHubName], to teach at the Free University of [SCOPE.sCountry('curtiss_august_piccard_destination').GetCapital.GetCityHubName] as a professor. The university promised large financial resources that allow Piccard to use balloons to study the stratosphere even more thoroughly. As a brilliant scientist and balloonist, Piccard might be able to set new records in ballooning."
 curtiss.615.f: "Piccard wurde 1922 an die Freie Universität Brüssel berufen, wo er sich neben seiner Lehrtätigkeit der Stratosphärenforschung mit Ballons widmete. In dieser Forschung arbeitete er auch mit seinem Freund Albert Einstein zusammen, mit dem er Experimente entwickelte.\nZusätzlich zu seiner Stratosphärenforschung erfand Piccard ein Messgerät für Radioaktivität und einen hochpräzisen Seismografen. Er befasste sich auch mit Atomphysik und sagte ein drittes Uranisotop voraus, das später entdeckt wurde und heute als Uran-235 bekannt ist.\nIn Brüssel inspirierten ihn seine Vorlesungen auch zur Comicfigur Professor Bienlein."
 curtiss.615.g: "Ein Ballonfahrer von solchem Renommee sollte unser offizieller Ballonfahrer werden!"
 curtiss.615.h: "Wir wünschen ihm viel Erfolg für seine Karriere!"
 curtiss.615.g.tt: "The experienced balloonist [SCOPE.sCharacter('santos_balloonist_scope').GetFullName] becomes our new sponsored balloonist."
 santos.650.t: "Wir stellen Ihnen unseren neuen Ballonfahrer vor."
 santos.650.d: "[SCOPE.sCharacter('santos_balloonist_scope').GetFullName] ist ein erfolgreicher Ballonfahrer, der mit unserer Unterstützung die Grenzen des Ballonfahrens erweitern möchte. Rekorde warten darauf, gebrochen und wissenschaftliche Entdeckungen gemacht zu werden. [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] ist sich sicher, dass [SCOPE.sCharacter('santos_balloonist_scope').GetSheHe] mit [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]en Ballon [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] neue Höhen erreichen wird."
 santos.650.f: "„Ich werde den Ruhm unseres Landes mehren!“"
 santos.650.g: "Hopefully supporting [SCOPE.sCharacter('santos_balloonist_scope').GetHerHim] will be worth it! Bring me to the ballooning window."
 santos.650.h: "Viel Glück!"
 santos.651.t: "Ballonfahren in unserem Land"
 santos.651.balloonist: "Wir sponsern [ROOT.Var('santos_balloonist_var').GetCharacter.GetFullName], einen Ballonfahrer, der immer abenteuerlichere Versuche unternimmt, mit [SCOPE.sCharacter('santos_balloonist_scope').GetHerHis]en Ballon [SCOPE.GetRootScope.GetCountry.GetCustom('santos_balloon_type')] zu fliegen."
 santos.651.noballoonist: "Wir sponsern derzeit keinen Ballonfahrer. Daher werden wir nur sehr selten, wenn überhaupt, neue Ballonrekorde aufstellen. Wir könnten jedoch damit beginnen, einen Ballonfahrer aus unserem Land zu sponsern, der versucht, neue Rekorde aufzustellen und bessere Ballons für uns zu entwickeln."
