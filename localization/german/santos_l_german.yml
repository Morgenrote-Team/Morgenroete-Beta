 santos.681.t: "Gordon-Bennett-Pokal"
 santos.681.d: "Preparations for the first major international balloon race are in full swing. Balloonists from all over the world are gathering in [ROOT.GetCountry.GetCapital.GetCityHubName] to test their strength in the long-distance competition. The event is already considered legendary and will find its continuation in the coming years."
 santos.681.f: "„Bei keinem Flug zuvor habe ich so viele gute Wünsche zur Abreise erhalten und mich so intensiv vorbereitet wie für diesen Flug zum Gordon-Bennett-Cup 1907. Schon kurz nach dem Rennen von Paris im September 1906 wuchs in mir der Wunsch, an diesem Flug teilzunehmen. Mein Dank gilt dem Deutschen Luftschiffer-Verband, der mich als seinen Vertreter ausgewählt hat, sowie Baron von Hewald und Hauptmann Hildebrandt, die mir ihren großen Ballon „Pommern“ zur Verfügung stellten. Sie haben mir den diesjährigen Sieg ermöglicht.\n\nWährend dieses Fluges gewann ich den besten Eindruck von Nordamerika, was Ballonfahren und Gastfreundschaft betrifft. Ich bedauere nur, dass dieses Land nicht noch größer war, um mir zu erlauben, meinen Ballon in seiner vollen Reichweite fliegen zu lassen und den Weltrekord für die längste Flugstrecke zu brechen.“ – Oscar Erbslöh"
 santos.681.g: "Wunderbar!"
