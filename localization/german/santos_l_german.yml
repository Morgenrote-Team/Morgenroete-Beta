 santos_balloon_crossing_event_wind_shear_flag: "#t $santos_balloon_crossing_event_wind_shear_title_flag$#!\nDer Wind hat sich zugunsten des Ballonfahrers gedreht. Der Ballon gleitet geradezu durch den Himmel!\n\n#b Die folgenden Faktoren erhöhen die Wahrscheinlichkeit dieses Ergebnisses:#!\n[concept_santos_balloonist] verfügt über die [concept_character_trait] $santos_balloonist_experienced$, $santos_balloonist_hero$ oder $ambitious$.#!"
 santos_balloon_crossing_event_balloonist_maneuver_icon_flag: "@santos_event_log_positive_balloonist_maneuver_icon!"
 santos_balloon_crossing_event_balloonist_maneuver_title_flag: "Ballonfahrermanöver"
 santos_balloon_crossing_event_balloonist_maneuver_flag: "#t $santos_balloon_crossing_event_balloonist_maneuver_title_flag$#!\nDer Ballonfahrer hat ein gewagtes Manöver durchgeführt, durch das der Ballon in eine hervorragende Position gebracht wurde und maximale Fortschritte erzielen konnte.\n\n#b Die folgenden Faktoren erhöhen die Wahrscheinlichkeit dieses Ergebnisses:#!\n[concept_santos_balloonist] hat die [concept_character_trait] $santos_balloonist_experienced$, $santos_balloonist_hero$ oder $ambitious$.#!"
